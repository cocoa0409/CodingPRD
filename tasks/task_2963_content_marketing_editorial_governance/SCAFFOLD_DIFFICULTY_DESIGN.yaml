# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Domain: content-marketing-editorial-governance (api_prefix /editorial)
# Nine §0.5 Difficulty Rules x 2 differentiated instances each = 18 instances.
# Every literal in every `assert:` line below was computed by executing the
# matching §1.3 formula and its `constants:` as code; none are estimates.
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00.000Z.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: claim_evidence_score_strict_regulated_diverges_from_standard
        grounds:
          - calculations.claim_evidence_score
          - entities.Claim.fields.scoring_variant
          - entities.Claim.fields.evidence_score
          - entities.Claim.fields.required_score
          - entities.Claim.fields.evidence_valid_until
          - state_machines.Claim.EVIDENCE_PENDING_to_SUBSTANTIATED
          - validations[priority=38]
          - errors[ERR_EVIDENCE_INSUFFICIENT]
        distinguishing_aspect: |
          Two claims on the same content item hold a byte-identical three-row Evidence set, yet the
          STANDARD variant scores 4.25 while the STRICT_REGULATED variant scores 2.00, because STRICT
          discards INTERNAL_STUDY as inadmissible and zeroes the 945-day-old REGULATORY_FILING that
          STANDARD merely halves; the higher REQUIRED_SCORE of 4.00 compounds the gap so the same
          evidence substantiates one claim and is rejected as insufficient on the other.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-03T08:00:00.000Z."
            - "Campaign CMP-EVID is ACTIVE, persona IT_BUYER, primary_funnel_stage DECISION, governance_posture OPEN."
            - "One DECISION CalendarSlot for week 2026-08-03 with capacity_points 40."
            - "ContentBrief with requires_regulated_review true (so a REGULATED claim may be attached), effort_points 21, sme_reserved_hours 11, state APPROVED."
            - "One ContentItem in workflow_state DRAFT carrying exactly two claims: a PERFORMANCE claim (scoring_variant STANDARD, required_score 2.00) and a REGULATED claim (scoring_variant STRICT_REGULATED, required_score 4.00)."
            - "Each claim carries the same three Evidence rows: THIRD_PARTY_TEST collected 2026-06-01 (age_days 63), INTERNAL_STUDY collected 2026-07-01 (age_days 33), REGULATORY_FILING collected 2024-01-01 (age_days 945)."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-EVID", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/campaigns/${cmp_id}/calendar-slots"
              payload: { week_start_date: "2026-08-03", funnel_stage: "DECISION", capacity_points: 40 }
              as: ManagingEditor
              captures: { slot_id: $.data.id }
            - call: "POST /editorial/experts"
              payload: { full_name: "Dana Vo", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, exp_v: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "COMMERCIAL", primary_keyword: "zero trust platform pricing", target_word_count: 1500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-04T09:00:00.000Z", requires_regulated_review: true }
              as: ManagingEditor
              captures: { brief_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v}" }
              as: ManagingEditor
            - call: "POST /editorial/briefs/${brief_id}/approve"
              payload: {}
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { cmp_v: $.data.version }
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_id}", slot_id: "${slot_id}", title: "Zero trust platform pricing guide", planned_publish_at: "2026-08-05T09:00:00.000Z", expected_campaign_version: "${cmp_v}" }
              as: ManagingEditor
              as_user_id: "me-1"
              captures: { item_id: $.data.id }
            - call: "POST /editorial/content-items/${item_id}/claims"
              payload: { claim_text: "Cuts breach response time by 60 percent versus manual triage", claim_type: "PERFORMANCE" }
              as: ManagingEditor
              captures: { claim_perf_id: $.data.id }
            - call: "POST /editorial/content-items/${item_id}/claims"
              payload: { claim_text: "Meets the financial-services data residency standard in every listed region", claim_type: "REGULATED" }
              as: ManagingEditor
              captures: { claim_reg_id: $.data.id }
            - call: "POST /editorial/claims/${claim_perf_id}/evidence"
              payload: { source_type: "THIRD_PARTY_TEST", citation: "Northwind Labs comparative benchmark, report NL-2026-118", collected_at: "2026-06-01T00:00:00.000Z", valid_until: "2027-06-01T00:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/claims/${claim_perf_id}/evidence"
              payload: { source_type: "INTERNAL_STUDY", citation: "Internal SOC time-to-respond study, cohort 2026H1", collected_at: "2026-07-01T00:00:00.000Z", valid_until: "2027-07-01T00:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/claims/${claim_perf_id}/evidence"
              payload: { source_type: "REGULATORY_FILING", citation: "Filing 2024-DR-0091, residency schedule B", collected_at: "2024-01-01T00:00:00.000Z", valid_until: "2027-01-01T00:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/claims/${claim_reg_id}/evidence"
              payload: { source_type: "THIRD_PARTY_TEST", citation: "Northwind Labs comparative benchmark, report NL-2026-118", collected_at: "2026-06-01T00:00:00.000Z", valid_until: "2027-06-01T00:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/claims/${claim_reg_id}/evidence"
              payload: { source_type: "INTERNAL_STUDY", citation: "Internal SOC time-to-respond study, cohort 2026H1", collected_at: "2026-07-01T00:00:00.000Z", valid_until: "2027-07-01T00:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/claims/${claim_reg_id}/evidence"
              payload: { source_type: "REGULATORY_FILING", citation: "Filing 2024-DR-0091, residency schedule B", collected_at: "2024-01-01T00:00:00.000Z", valid_until: "2027-01-01T00:00:00.000Z" }
              as: ManagingEditor
          trigger:
            - call: "POST /editorial/claims/${claim_perf_id}/decide"
              payload: { decision: "SUBSTANTIATED" }
              as: LegalReviewer
              as_user_id: "legal-1"
              captures: { perf_score: $.data.evidence_score }
            - call: "POST /editorial/claims/${claim_reg_id}/decide"
              payload: { decision: "SUBSTANTIATED" }
              as: LegalReviewer
              as_user_id: "legal-1"
              captures: { reg_error: $.data.error_id }
          assert:
            - "Claim.${claim_perf_id}.scoring_variant == STANDARD"
            - "Claim.${claim_perf_id}.required_score == 2.00"
            - "Claim.${claim_perf_id}.evidence_score == 4.25"
            - "Claim.${claim_perf_id}.substantiation_state == SUBSTANTIATED"
            - "Claim.${claim_perf_id}.evidence_valid_until == 2027-01-01T00:00:00.000Z"
            - "Claim.${claim_perf_id}.decided_by_user_id == legal-1"
            - "Claim.${claim_perf_id}.decided_at == 2026-08-03T08:00:00.000Z"
            - "Claim.${claim_reg_id}.scoring_variant == STRICT_REGULATED"
            - "Claim.${claim_reg_id}.required_score == 4.00"
            - "Claim.${claim_reg_id}.evidence_score == 2.00"
            - "the second trigger call returns HTTP 422 with error_id ERR_EVIDENCE_INSUFFICIENT"
            - "Claim.${claim_reg_id}.substantiation_state == EVIDENCE_PENDING"
            - "Claim.${claim_reg_id}.decided_at == null"
            - "Claim.${claim_reg_id}.evidence_valid_until == null"
            - "GET /editorial/claims/${claim_perf_id}/evidence and GET /editorial/claims/${claim_reg_id}/evidence each return exactly 3 rows with identical source_type and collected_at values, so the 4.25 vs 2.00 delta of 2.25 is attributable to scoring_variant alone"
            - "Campaign.${cmp_id}.governance_posture == OPEN"

      - name: pipeline_attribution_last_touch_diverges_from_assisted_fractional
        grounds:
          - calculations.content_pipeline_attribution
          - entities.ContentItem.fields.last_touch_pipeline_cents
          - entities.ContentItem.fields.assisted_pipeline_cents
          - entities.PerformanceSnapshot.fields.touch_position
          - entities.PerformanceSnapshot.fields.influenced_opportunity_amount_cents
        distinguishing_aspect: |
          The identical four-snapshot measurement set yields last_touch_pipeline_cents 2955888 and
          assisted_pipeline_cents 1779887 on the same ContentItem row: LAST_TOUCH credits 100 percent
          of the two LAST snapshots and nothing else, while ASSISTED_FRACTIONAL credits every snapshot
          its TOUCH_WEIGHT share, so the FIRST and MIDDLE snapshots contribute 597532 cents that the
          last-touch figure never sees and the two LAST snapshots contribute only 40 percent of theirs.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-03T08:00:00.000Z for the editorial setup, then advances to 2026-09-14T00:00:00.000Z so every measurement period ends at or before the clock."
            - "Campaign CMP-ATTR is ACTIVE with a DECISION CalendarSlot for week 2026-08-03, capacity_points 40."
            - "One ContentItem in workflow_state DRAFT (snapshots are accepted regardless of workflow_state)."
            - "Four PerformanceSnapshot rows on that item: FIRST 1000003 cents, MIDDLE 987657 cents, LAST 555557 cents, LAST 2400331 cents, with engaged_sessions 400/300/250/250 and conversions 10/8/6/4."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-ATTR", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/campaigns/${cmp_id}/calendar-slots"
              payload: { week_start_date: "2026-08-03", funnel_stage: "DECISION", capacity_points: 40 }
              as: ManagingEditor
              captures: { slot_id: $.data.id }
            - call: "POST /editorial/experts"
              payload: { full_name: "Dana Vo", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, exp_v: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "COMMERCIAL", primary_keyword: "zero trust platform pricing", target_word_count: 1500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-04T09:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v}" }
              as: ManagingEditor
            - call: "POST /editorial/briefs/${brief_id}/approve"
              payload: {}
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { cmp_v: $.data.version }
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_id}", slot_id: "${slot_id}", title: "Zero trust platform pricing guide", planned_publish_at: "2026-08-05T09:00:00.000Z", expected_campaign_version: "${cmp_v}" }
              as: ManagingEditor
              as_user_id: "me-1"
              captures: { item_id: $.data.id }
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/content-items/${item_id}/performance-snapshots"
              payload: { period_start: "2026-08-03T00:00:00.000Z", period_end: "2026-08-10T00:00:00.000Z", engaged_sessions: 400, conversions: 10, influenced_opportunity_amount_cents: 1000003, touch_position: "FIRST" }
              as: AnalyticsService
            - call: "POST /editorial/content-items/${item_id}/performance-snapshots"
              payload: { period_start: "2026-08-10T00:00:00.000Z", period_end: "2026-08-17T00:00:00.000Z", engaged_sessions: 300, conversions: 8, influenced_opportunity_amount_cents: 987657, touch_position: "MIDDLE" }
              as: AnalyticsService
            - call: "POST /editorial/content-items/${item_id}/performance-snapshots"
              payload: { period_start: "2026-08-17T00:00:00.000Z", period_end: "2026-08-24T00:00:00.000Z", engaged_sessions: 250, conversions: 6, influenced_opportunity_amount_cents: 555557, touch_position: "LAST" }
              as: AnalyticsService
          trigger:
            - call: "POST /editorial/content-items/${item_id}/performance-snapshots"
              payload: { period_start: "2026-08-24T00:00:00.000Z", period_end: "2026-08-31T00:00:00.000Z", engaged_sessions: 250, conversions: 4, influenced_opportunity_amount_cents: 2400331, touch_position: "LAST" }
              as: AnalyticsService
              captures: { snap4_id: $.data.id }
          assert:
            - "the trigger call returns HTTP 201"
            - "ContentItem.${item_id}.engaged_sessions_total == 1200"
            - "ContentItem.${item_id}.conversions_total == 28"
            - "ContentItem.${item_id}.last_touch_pipeline_cents == 2955888"
            - "ContentItem.${item_id}.assisted_pipeline_cents == 1779887"
            - "ContentItem.${item_id}.last_touch_pipeline_cents != ContentItem.${item_id}.assisted_pipeline_cents"
            - "ContentItem.${item_id}.last_touch_pipeline_cents - ContentItem.${item_id}.assisted_pipeline_cents == 1176001"
            - "GET /editorial/content-items/${item_id}/performance-snapshots returns exactly 4 rows"
            - "ContentItem.${item_id}.workflow_state == DRAFT"

  - rule_id: combinatorial_formula
    instances:

      - name: slot_commit_tier_pinned_to_pre_commit_utilization
        grounds:
          - calculations.slot_capacity_commit
          - entities.ContentItem.fields.capacity_tier_at_commit
          - entities.ContentItem.fields.commit_points
          - entities.CalendarSlot.fields.utilization_pct
          - state_machines.CalendarSlot.OPEN_to_FULL
          - state_machines.ContentItem.NONE_to_DRAFT
          - validations[priority=41]
        distinguishing_aspect: |
          The tier is selected in step 2 from the PRE-commit utilization 75.00 percent (MEDIUM,
          surcharge 1, commit_points 10, projected 40 == capacity, accepted, slot FULL at 100.00
          percent); recomputing the tier from the POST-commit utilization of 97.50 percent would
          select HIGH, raise the surcharge to 3, project 42 and reject the very same request, so the
          step order between step 2 and step 7 is directly observable as 201-vs-409.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-03T08:00:00.000Z."
            - "Campaign CMP-TIER is ACTIVE with one DECISION CalendarSlot for week 2026-08-03, capacity_points 40."
            - "One filler ContentItem already committed against that slot: brief search_intent TRANSACTIONAL, target_word_count 4500, funnel_stage DECISION, effort_points 30, tier LOW at 0.00 percent pre-utilization, commit_points 30, so the slot sits at committed_points 30 and utilization_pct 75.00, status OPEN."
            - "A second APPROVED brief with search_intent NAVIGATIONAL, target_word_count 500, funnel_stage DECISION, effort_points 9, sme_reserved_hours 5, on the same expert with a touching review window in the same ISO week (15 + 5 = 20 hours against a 40-hour weekly capacity)."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-TIER", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/campaigns/${cmp_id}/calendar-slots"
              payload: { week_start_date: "2026-08-03", funnel_stage: "DECISION", capacity_points: 40 }
              as: ManagingEditor
              captures: { slot_id: $.data.id }
            - call: "POST /editorial/experts"
              payload: { full_name: "Dana Vo", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, exp_v1: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "TRANSACTIONAL", primary_keyword: "buy zero trust platform", target_word_count: 4500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-04T09:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_filler_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_filler_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v1}" }
              as: ManagingEditor
            - call: "POST /editorial/briefs/${brief_filler_id}/approve"
              payload: {}
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "NAVIGATIONAL", primary_keyword: "zero trust platform login", target_word_count: 500, required_expertise_tag: "security", review_window_start: "2026-08-04T09:00:00.000Z", review_window_end: "2026-08-04T14:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_target_id: $.data.id }
            - call: "GET /editorial/experts/${exp_id}"
              payload: {}
              as: ManagingEditor
              captures: { exp_v2: $.data.version }
            - call: "POST /editorial/briefs/${brief_target_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v2}" }
              as: ManagingEditor
            - call: "POST /editorial/briefs/${brief_target_id}/approve"
              payload: {}
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { cmp_v1: $.data.version }
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_filler_id}", slot_id: "${slot_id}", title: "Buyer guide to zero trust platform procurement", planned_publish_at: "2026-08-05T09:00:00.000Z", expected_campaign_version: "${cmp_v1}" }
              as: ManagingEditor
              as_user_id: "me-1"
              captures: { item_filler_id: $.data.id }
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { cmp_v2: $.data.version }
          trigger:
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_target_id}", slot_id: "${slot_id}", title: "Zero trust platform login help", planned_publish_at: "2026-08-06T09:00:00.000Z", expected_campaign_version: "${cmp_v2}" }
              as: ManagingEditor
              as_user_id: "me-1"
              captures: { item_target_id: $.data.id }
          assert:
            - "the trigger call returns HTTP 201"
            - "ContentItem.${item_filler_id}.capacity_tier_at_commit == LOW"
            - "ContentItem.${item_filler_id}.commit_points == 30"
            - "ContentItem.${item_target_id}.effort_points == 9"
            - "ContentItem.${item_target_id}.capacity_tier_at_commit == MEDIUM"
            - "ContentItem.${item_target_id}.commit_points == 10"
            - "CalendarSlot.${slot_id}.committed_points == 40"
            - "CalendarSlot.${slot_id}.utilization_pct == 100.00"
            - "CalendarSlot.${slot_id}.status == FULL"
            - "Campaign.${cmp_id}.committed_points_total == 40"
            - "the tier recorded on the target item is NOT HIGH and the request was NOT rejected with ERR_SLOT_CAPACITY_EXCEEDED, which is what a post-commit tier derivation (97.50 percent -> HIGH -> surcharge 3 -> projected 42 > 40) would have produced"

      - name: assisted_attribution_rounds_each_snapshot_before_summing
        grounds:
          - calculations.content_pipeline_attribution
          - entities.ContentItem.fields.assisted_pipeline_cents
          - entities.ContentItem.fields.last_touch_pipeline_cents
          - entities.PerformanceSnapshot.fields.influenced_opportunity_amount_cents
        distinguishing_aspect: |
          Four MIDDLE snapshots of 12343 cents each weight to 2468.6 cents apiece; rounding per
          snapshot first yields 2469 x 4 == 9876, while summing the unrounded shares (9874.4) and
          rounding once yields 9874 — a 2-cent gap that pins the rounding position inside the fold,
          and the same all-MIDDLE set drives last_touch_pipeline_cents to exactly 0.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-03T08:00:00.000Z for setup, then advances to 2026-09-14T00:00:00.000Z."
            - "Campaign CMP-ROUND is ACTIVE with a DECISION CalendarSlot for week 2026-08-03, capacity_points 40."
            - "One ContentItem in workflow_state DRAFT with three MIDDLE PerformanceSnapshot rows of 12343 cents already recorded."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-ROUND", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/campaigns/${cmp_id}/calendar-slots"
              payload: { week_start_date: "2026-08-03", funnel_stage: "DECISION", capacity_points: 40 }
              as: ManagingEditor
              captures: { slot_id: $.data.id }
            - call: "POST /editorial/experts"
              payload: { full_name: "Dana Vo", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, exp_v: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "COMMERCIAL", primary_keyword: "zero trust platform pricing", target_word_count: 1500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-04T09:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v}" }
              as: ManagingEditor
            - call: "POST /editorial/briefs/${brief_id}/approve"
              payload: {}
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { cmp_v: $.data.version }
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_id}", slot_id: "${slot_id}", title: "Zero trust platform pricing guide", planned_publish_at: "2026-08-05T09:00:00.000Z", expected_campaign_version: "${cmp_v}" }
              as: ManagingEditor
