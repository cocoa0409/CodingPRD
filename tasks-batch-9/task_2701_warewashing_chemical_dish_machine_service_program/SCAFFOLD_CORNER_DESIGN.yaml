          trigger:
            - call: "POST /warewashing/usage-variance-reviews"
              payload: { site_id: "${site_id}", product_id: "${det_id}", period_start: "2026-07-31T00:00:00Z", period_end: "2026-08-08T00:00:00Z", basis: "AS_CALIBRATED", opening_inventory_ml: 20000, ending_inventory_ml: 20000 }
              as: QualityAuditor
              captures: { err_1: $.data.error_id }
            - call: "POST /warewashing/usage-variance-reviews"
              payload: { site_id: "${site_id}", product_id: "${det_id}", period_start: "2026-08-08T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "AS_CALIBRATED", opening_inventory_ml: 20000, ending_inventory_ml: 20000 }
