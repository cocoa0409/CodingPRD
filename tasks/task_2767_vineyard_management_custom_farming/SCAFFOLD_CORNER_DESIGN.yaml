              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { po2_id: $.data.id }
            - call: "POST /spray-records"
              payload: { block_id: "${b1_id}", farming_plan_id: "${p1_id}", pest_observation_id: "${po1_id}", product_name: "Quintec", active_ingredient: "quinoxyfen", rei_hours: 72, phi_days: 21, rate_per_acre: 5.0, material_cost: 812.50 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { sr1_id: $.data.id }
            - call: "POST /spray-records"
              payload: { block_id: "${b1_id}", farming_plan_id: "${p1_id}", pest_observation_id: "${po2_id}", product_name: "Movento", active_ingredient: "spirotetramat", rei_hours: 24, phi_days: 30, rate_per_acre: 8.0, material_cost: 640.00 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { sr2_id: $.data.id }
