              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Ben Ortiz", email: "ben.ortiz@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
          trigger:
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_b_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "SELF_SERVE_PORTAL", lease_start_date: "2027-08-03", lease_end_date: "2028-07-31" }
              as: ProgramOperator
              captures: { overlap_err: "$.data.error_id" }
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_b_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "SELF_SERVE_PORTAL", lease_start_date: "2027-08-04", lease_end_date: "2028-07-31" }
              as: ProgramOperator
              captures: { sub_b_id: "$.data.id" }
          assert:
            - "the 2027-08-03 request returns ERR_UNIT_OCCUPANCY_CONFLICT with HTTP 409 — a gap of exactly TURNOVER_BUFFER_DAYS (3) is NOT enough"
            - "the 2027-08-03 request does NOT return ERR_DUPLICATE_ACTIVE_SUBSCRIPTION, since the resident differs"
            - "no Subscription row was created by the refused request"
            - "the 2027-08-04 request succeeds with HTTP 201: lease_end 2027-07-31 + 4 days is the first legal start"
