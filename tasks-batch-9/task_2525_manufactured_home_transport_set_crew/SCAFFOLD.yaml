  # --- TransportPermit ------------------------------------------------------
  - method: POST
    path: /installations/permits
    description: "Requests an oversize/superload transport permit for one section in one state. Evaluates the PROVISIONAL escort matrix and PROVISIONAL fee from the section's DECLARED dimensions. Carries expected_section_version for optimistic concurrency against the section the permit is anchored to."
    roles: [PermitDesk]
    code: 201
    input: [section_id, state_code, planned_leg_count, expected_section_version, "night_move?"]
    output: TransportPermit
    side_effects:
      - "runs calculations.escort_requirement_matrix (PROVISIONAL), writing permit_class, escort_count_required and pilot_car_required"
      - "runs calculations.permit_fee_assessment variant PROVISIONAL, writing provisional_fee_cents"
      - "status initialised to REQUESTED, paid_amount_cents to 0"
      - "any earlier TransportPermit for the same (section_id, state_code) in status REQUESTED or FEE_PAID moves to SUPERSEDED"
      - "increments HomeSection.version by 1"
      - "recomputes the parent InstallationOrder.posture"
  - method: GET
    path: /installations/permits/{id}
    description: "Reads one transport permit, including permit_class, escort_count_required, both fee variants, paid_amount_cents and validity date."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: TransportPermit
    side_effects: []
  - method: GET
    path: /installations/permits
    description: "Lists transport permits, filterable by section_id (FK reverse-reachability for TransportPermit.section_id), state and status."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    input: ["section_id?", "state_code?", "status?", "limit?", "offset?"]
    output: TransportPermit[]
    side_effects: []
  - method: POST
    path: /installations/permits/{id}/pay-fee
    description: "Hauler pays the permit fee. The amount is recorded as-is; issuance later re-checks it against the FINAL fee, so a provisional-sized payment can fall short."
    roles: [TransportManager]
    code: 200
    input: [amount_cents]
    output: TransportPermit
    side_effects:
      - "adds amount_cents to paid_amount_cents"
      - "status REQUESTED -> FEE_PAID once paid_amount_cents >= provisional_fee_cents"
      - "increments TransportPermit.version by 1"
  - method: POST
    path: /installations/permits/{id}/issue
    description: "Permit desk issues the permit. Re-runs the escort matrix and the fee assessment in their FINAL form against MEASURED dimensions and the permit's actual non-cancelled leg count, then checks aggregate escort sufficiency and fee coverage."
    roles: [PermitDesk]
    code: 200
    output: TransportPermit
    side_effects:
      - "runs calculations.escort_requirement_matrix (FINAL), overwriting permit_class, escort_count_required and pilot_car_required"
      - "runs calculations.permit_fee_assessment variant FINAL, writing final_fee_cents"
      - "rejects with ERR_PERMIT_ESCORT_SHORTFALL when RESERVED role == ESCORT assignments across the permit's non-cancelled legs are fewer than the FINAL escort_count_required, or when the FINAL pilot_car_required is true and no RESERVED role == PILOT_CAR assignment exists on those legs"
      - "rejects with ERR_PERMIT_FEE_UNPAID (402) when paid_amount_cents < final_fee_cents"
      - "status FEE_PAID -> ISSUED and valid_until_date set to the logical current date plus PERMIT_VALID_DAYS"
      - "the permit's HomeSection moves PERMIT_PENDING -> DISPATCH_READY (or PERMIT_REVOKED_HOLD -> DISPATCH_READY on a re-issue)"
      - "increments TransportPermit.version and HomeSection.version by 1"
      - "recomputes the parent InstallationOrder.posture"
  - method: POST
    path: /installations/permits/{id}/revoke
    description: "Permit desk revokes an issued permit (route condition, bridge posting, mis-measure). Fans out a five-level cascade through legs, escort reservations, crew minutes, the section and the order."
    roles: [PermitDesk]
    code: 200
    input: [reason_code]
    output: TransportPermit
    side_effects:
      - "cascade link 1: status ISSUED -> REVOKED"
      - "cascade link 2: every RouteLeg of this permit in status SCHEDULED -> CANCELLED (IN_TRANSIT and ARRIVED legs are untouched)"
      - "cascade link 3: every RESERVED EscortAssignment on those cancelled legs -> RELEASED"
      - "cascade link 4: calculations.escort_reserved_minutes recomputes each affected EscortCrew.reserved_minutes and refreshes AVAILABLE/OVERBOOKED"
      - "cascade link 5: the permit's HomeSection moves DISPATCH_READY or IN_TRANSIT -> PERMIT_REVOKED_HOLD, and calculations.order_posture drives the order to TRANSPORT_BLOCKED"
      - "increments the version of every mutated row by 1"

  # --- RouteLeg -------------------------------------------------------------
  - method: POST
    path: /installations/route-legs
    description: "Adds one corridor leg to an issued or pending permit and books the motor carrier that will run it."
    roles: [TransportManager, PermitDesk]
    code: 201
    input: [permit_id, hauler_id, sequence_no, corridor_id, state_code, window_start, window_end]
    output: RouteLeg
    side_effects:
      - "status initialised to SCHEDULED"
      - "rejects with ERR_HAULER_SUSPENDED when the hauler's status is SUSPENDED"
      - "rejects with ERR_LEG_PERMIT_MISMATCH when state_code differs from the permit's state_code"
      - "adding a leg raises the permit's FINAL leg count, so it can raise the FINAL fee above what was already paid"
      - "increments TransportPermit.version by 1"
  - method: GET
    path: /installations/route-legs/{id}
    description: "Reads one route leg, including its window and status."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: RouteLeg
    side_effects: []
  - method: GET
    path: /installations/route-legs
    description: "Lists route legs, filterable by permit_id and hauler_id (FK reverse-reachability for both RouteLeg FKs)."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    input: ["permit_id?", "hauler_id?", "status?", "limit?", "offset?"]
    output: RouteLeg[]
    side_effects: []
  - method: POST
    path: /installations/route-legs/{id}/depart
    description: "Hauler reports the load rolling. Guarded on the permit being ISSUED, the hauler being ACTIVE and every RESERVED escort crew on the leg being AVAILABLE."
    roles: [TransportManager]
    code: 200
    output: RouteLeg
    side_effects:
      - "status SCHEDULED -> IN_TRANSIT"
      - "rejects with ERR_ESCORT_CREW_OVERBOOKED when any RESERVED EscortAssignment on this leg belongs to a crew whose status is OVERBOOKED (cross-entity state dependency RouteLeg -> EscortCrew)"
      - "the permit's HomeSection moves DISPATCH_READY -> IN_TRANSIT"
      - "increments RouteLeg.version and HomeSection.version by 1"
      - "recomputes the parent InstallationOrder.posture"
  - method: POST
    path: /installations/route-legs/{id}/arrive
    description: "Hauler reports arrival at the end of the leg; escort reservations on the leg are consumed and their minutes released."
    roles: [TransportManager]
    code: 200
    output: RouteLeg
    side_effects:
      - "status IN_TRANSIT -> ARRIVED"
      - "every RESERVED EscortAssignment on this leg -> COMPLETED"
      - "calculations.escort_reserved_minutes recomputes each affected EscortCrew.reserved_minutes and refreshes AVAILABLE/OVERBOOKED"
      - "the permit's HomeSection moves IN_TRANSIT -> DELIVERED"
      - "increments the version of every mutated row by 1"
      - "recomputes the parent InstallationOrder.posture"

  # --- EscortAssignment -----------------------------------------------------
  - method: POST
    path: /installations/escort-assignments
    description: "Reserves an escort or pilot-car crew for a window on one route leg. Endorsement class is checked before the buffered window-overlap test, so an unendorsed crew with a clashing window reports the endorsement error."
    roles: [TransportManager]
    code: 201
    input: [route_leg_id, escort_crew_id, role, window_start, window_end]
    output: EscortAssignment
    side_effects:
      - "status initialised to RESERVED"
      - "runs calculations.escort_reserved_minutes: freezes this assignment's reserved_minutes and recomputes EscortCrew.reserved_minutes"
      - "refreshes EscortCrew.status to OVERBOOKED when reserved_minutes exceeds max_reserved_minutes"
      - "rejects with ERR_ESCORT_WINDOW_CONFLICT per calculations.escort_window_conflict (half-open windows inflated by buffer_minutes on both sides)"
      - "increments EscortCrew.version by 1"
  - method: GET
    path: /installations/escort-assignments/{id}
    description: "Reads one escort reservation, including its frozen reserved_minutes."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: EscortAssignment
    side_effects: []
  - method: GET
    path: /installations/escort-assignments
    description: "Lists escort reservations, filterable by route_leg_id and escort_crew_id (FK reverse-reachability for both EscortAssignment FKs)."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    input: ["route_leg_id?", "escort_crew_id?", "status?", "limit?", "offset?"]
    output: EscortAssignment[]
    side_effects: []
  - method: POST
    path: /installations/escort-assignments/{id}/release
    description: "Releases a reservation. This is the compensating action for creation: the crew's reserved_minutes must return to its exact pre-reservation value."
    roles: [TransportManager]
    code: 200
    output: EscortAssignment
    side_effects:
      - "status RESERVED -> RELEASED"
      - "calculations.escort_reserved_minutes recomputes EscortCrew.reserved_minutes from the remaining RESERVED rows"
      - "refreshes EscortCrew.status back to AVAILABLE when reserved_minutes no longer exceeds max_reserved_minutes"
      - "increments EscortAssignment.version and EscortCrew.version by 1"

  # --- SetJob ---------------------------------------------------------------
  - method: POST
    path: /installations/set-jobs
    description: "Books an installer crew for the set. Carries expected_order_version for optimistic concurrency against the parent order; enforces the crew's inclusive-both-ends per-calendar-day capacity."
    roles: [NetworkAdmin]
    code: 201
    input: [order_id, set_crew_id, scheduled_start_date, scheduled_end_date, labor_base_cents, expected_order_version]
    output: SetJob
    side_effects:
      - "progress_status initialised to SCHEDULED and scope_status to SCOPE_PENDING; closure_status to NOT_ASSESSED; final_result to PENDING"
      - "rejects with ERR_SET_CREW_CAPACITY_EXCEEDED per calculations.set_crew_day_load when any calendar date in the inclusive range would exceed the crew's daily_capacity"
      - "any existing SetJob on the same order_id still in progress_status SCHEDULED moves to SUPERSEDED"
      - "increments InstallationOrder.version by 1"
      - "recomputes the parent InstallationOrder.posture"
  - method: GET
    path: /installations/set-jobs/{id}
    description: "Reads one set job, including both status dimensions, the scope-split fees, closure_score/closure_status and invoice_total_cents."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: SetJob
    side_effects: []
  - method: GET
    path: /installations/set-jobs
    description: "Lists set jobs, filterable by order_id and set_crew_id (FK reverse-reachability for both SetJob FKs)."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    input: ["order_id?", "set_crew_id?", "progress_status?", "scope_status?", "limit?", "offset?"]
    output: SetJob[]
    side_effects: []
  - method: POST
    path: /installations/set-jobs/{id}/dispatch
    description: "Sends the crew to the site. Gated in priority order on the site being READY (8), the order posture not being TRANSPORT_BLOCKED (9), the crew's licence being valid (11) and every section being DELIVERED (17)."
    roles: [NetworkAdmin]
    code: 200
    output: SetJob
    side_effects:
      - "progress_status SCHEDULED -> DISPATCHED"
      - "rejects with ERR_SITE_NOT_READY when the order's Site.readiness_status is not READY (cross-entity state dependency SetJob -> Site)"
      - "rejects with ERR_INSTALLER_LICENSE_INVALID when the SetCrew is LICENSE_EXPIRED or its licence has lapsed against the logical clock"
      - "rejects with ERR_SECTIONS_NOT_DELIVERED / ERR_SECTION_COUNT_MISMATCH when the order's sections are not all DELIVERED or are miscounted"
      - "increments SetJob.version by 1"
      - "recomputes the parent InstallationOrder.posture"
  - method: POST
    path: /installations/set-jobs/{id}/scope-split
    description: "Records who owns the skirting and steps scope (installer vs dealer) and the skirting run length; prices the installer-owned lines."
    roles: [SetCrewLead]
    code: 200
    input: [skirting_owner, steps_owner, skirting_linear_ft, steps_count]
    output: SetJob
    side_effects:
      - "scope_status SCOPE_PENDING -> SCOPE_SPLIT (independent of progress_status)"
      - "runs step 1 of calculations.installation_invoice_total, writing skirting_fee_cents and steps_fee_cents"
      - "increments SetJob.version by 1"
  - method: POST
    path: /installations/set-jobs/{id}/utility-crossover
    description: "Records the number of under-floor utility crossovers made between sections and prices the crossover line."
    roles: [SetCrewLead]
    code: 200
    input: [crossover_count]
    output: SetJob
    side_effects:
      - "scope_status SCOPE_SPLIT -> SCOPE_DELIVERED (independent of progress_status)"
      - "runs step 2 of calculations.installation_invoice_total, writing crossover_fee_cents"
      - "sets crossover_recorded to true"
      - "increments SetJob.version by 1"
  - method: POST
    path: /installations/set-jobs/{id}/close-marriage-line
    description: "Closes the marriage line once every joint is measured. Scores the line by rounding each joint's deviation FIRST and summing the rounded values."
    roles: [SetCrewLead]
    code: 200
    output: SetJob
    side_effects:
      - "runs steps 2-3 of calculations.marriage_line_closure_score, writing closure_score and closure_status"
      - "rejects with ERR_MARRIAGE_JOINT_COUNT_MISMATCH unless the joint count equals max(0, InstallationOrder.section_count - 1)"
      - "progress_status DISPATCHED -> SET_COMPLETE"
      - "a single-section order records zero joints, yielding closure_score 0.00 and closure_status NOT_APPLICABLE"
      - "increments SetJob.version by 1"
      - "recomputes the parent InstallationOrder.posture"
  - method: POST
    path: /installations/set-jobs/{id}/final-inspection
    description: "Final installation inspection. A clean inspection (punch_item_count == 0) closes the job, assembles the invoice and starts the warranty; a punch list leaves the job in SET_COMPLETE for re-inspection. The signer may not be the same user who signed the site-readiness inspection."
    roles: [InstallationInspector]
    code: 200
    input: [punch_item_count, notes]
    output: SetJob
    side_effects:
      - "rejects with ERR_SEGREGATION_OF_DUTIES when the acting X-User-ID equals Site.last_inspector_user_id"
      - "rejects with ERR_ANCHOR_NOT_CERTIFIED unless a CERTIFIED AnchorCertification exists for this job"
      - "rejects with ERR_MARRIAGE_LINE_NOT_CLOSED unless closure_status is PASS or NOT_APPLICABLE"
      - "rejects with ERR_SCOPE_SPLIT_INCOMPLETE / ERR_UTILITY_CROSSOVER_INCOMPLETE unless the scope split and crossover are both recorded"
      - "stores the acting X-User-ID in final_inspector_user_id and sets final_result to PASS or PUNCH_LIST"
      - "on punch_item_count == 0: progress_status SET_COMPLETE -> CLOSED, runs steps 3-8 of calculations.installation_invoice_total writing SetJob.invoice_total_cents, mirrors it onto InstallationOrder.invoice_total_cents, sets InstallationOrder.warranty_start_date to the logical current date and drives the order to CLOSED"
      - "on punch_item_count >= 1: progress_status stays SET_COMPLETE, no invoice is assembled and no warranty starts"
      - "increments SetJob.version and InstallationOrder.version by 1"

  # --- MarriageJoint (append-only measurement event) -------------------------
  - method: POST
    path: /installations/marriage-joints
    description: "Records one marriage-line joint measurement (gap, vertical offset, ridge-beam shim) for a set job. Append-only event row: no update or delete surface, no version field."
    roles: [SetCrewLead]
    code: 201
    input: [set_job_id, joint_index, gap_in, vertical_offset_in, ridge_beam_shim_in]
    output: MarriageJoint
    side_effects:
      - "runs step 1 of calculations.marriage_line_closure_score, writing this joint's deviation_score"
      - "rejects with ERR_DUPLICATE_JOINT_INDEX when (set_job_id, joint_index) already exists"
  - method: GET
    path: /installations/marriage-joints/{id}
    description: "Reads one joint measurement and its per-joint deviation_score."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: MarriageJoint
    side_effects: []
  - method: GET
    path: /installations/marriage-joints
    description: "Lists joint measurements, filterable by set_job_id (FK reverse-reachability for MarriageJoint.set_job_id). This is the only discovery channel for joints, which are never returned inside a SetJob response."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    input: ["set_job_id?", "limit?", "offset?"]
    output: MarriageJoint[]
    side_effects: []

  # --- AnchorCertification --------------------------------------------------
  - method: POST
    path: /installations/anchor-certifications
    description: "Installer submits the anchoring and foundation package (anchor count, average strap torque, strap count, pier count) for HUD and state evaluation."
    roles: [SetCrewLead]
    code: 201
    input: [set_job_id, anchor_count, avg_torque_ft_lb, strap_count, pier_count]
    output: AnchorCertification
    side_effects:
      - "runs calculations.anchor_certification_evaluation, writing hud_pass and state_pass"
      - "status initialised to SUBMITTED and revision_round to 1"
      - "rejects with ERR_DUPLICATE_ANCHOR_CERT when a non-FAILED certification already exists for the job"
      - "rejects with ERR_INSTALLER_LICENSE_INVALID when the job's SetCrew licence has lapsed"
  - method: GET
    path: /installations/anchor-certifications/{id}
    description: "Reads one anchoring certification, including hud_pass, state_pass, revision_round and certifier_user_id."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: AnchorCertification
    side_effects: []
  - method: GET
    path: /installations/anchor-certifications
    description: "Lists anchoring certifications, filterable by set_job_id (FK reverse-reachability for AnchorCertification.set_job_id)."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    input: ["set_job_id?", "status?", "limit?", "offset?"]
    output: AnchorCertification[]
    side_effects: []
  - method: POST
    path: /installations/anchor-certifications/{id}/review
    description: "Inspector certifies, requests changes on, or fails an anchoring package. CERTIFY is rejected with ERR_ANCHOR_COMPLIANCE_FAILED unless both hud_pass and state_pass are true."
    roles: [InstallationInspector]
    code: 200
    input: [decision, findings]
    output: AnchorCertification
    side_effects:
      - "decision CERTIFY: status SUBMITTED -> CERTIFIED and certifier_user_id set to the acting X-User-ID"
      - "decision REQUEST_CHANGES: status SUBMITTED -> CHANGES_REQUIRED (re-enterable, so the row can cycle)"
      - "decision FAIL: status SUBMITTED -> FAILED (terminal)"
      - "increments AnchorCertification.version by 1"
  - method: POST
    path: /installations/anchor-certifications/{id}/resubmit
    description: "Installer resubmits corrected anchoring figures on the SAME certification row, driving CHANGES_REQUIRED back to SUBMITTED. Bounded by MAX_ANCHOR_REVISIONS so the cycle terminates."
    roles: [SetCrewLead]
    code: 200
    input: [anchor_count, avg_torque_ft_lb, strap_count, pier_count]
    output: AnchorCertification
    side_effects:
      - "status CHANGES_REQUIRED -> SUBMITTED"
      - "increments revision_round by 1 and re-runs calculations.anchor_certification_evaluation"
      - "rejects with ERR_ANCHOR_REVISION_LIMIT when revision_round is already MAX_ANCHOR_REVISIONS"
      - "increments AnchorCertification.version by 1"

  # --- DamageClaim ----------------------------------------------------------
  - method: POST
    path: /installations/damage-claims
    description: "Opens a damage-in-transit claim naming the plant (via the order), the hauler and the installer as potentially responsible parties. When blocks_set is true the damaged section is held, freezing downstream set work."
    roles: [PlantDispatcher, TransportManager, SetCrewLead, ClaimsAdjuster]
    code: 201
    input: [order_id, section_id, hauler_id, set_crew_id, discovered_stage, claimed_amount_cents, "blocks_set?", "plant_evidence_points?", "hauler_evidence_points?", "installer_evidence_points?"]
    output: DamageClaim
    side_effects:
      - "status initialised to SUBMITTED, all three charge fields to 0, dispute_round to 0"
      - "rejects with ERR_CLAIM_AMOUNT_EXCEEDS_CAP when claimed_amount_cents exceeds CLAIM_CAP_CENTS"
      - "on blocks_set == true the named HomeSection moves IN_TRANSIT or DELIVERED -> DAMAGED_HOLD and the order posture becomes TRANSPORT_BLOCKED"
      - "increments HomeSection.version and InstallationOrder.version by 1"
  - method: GET
    path: /installations/damage-claims/{id}
    description: "Reads one damage claim, including allocation_basis, approved_amount_cents and the three party charges."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: DamageClaim
    side_effects: []
  - method: GET
    path: /installations/damage-claims
    description: "Lists damage claims, filterable by order_id, section_id, hauler_id and set_crew_id (FK reverse-reachability for all four DamageClaim FKs)."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    input: ["order_id?", "section_id?", "hauler_id?", "set_crew_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: /installations/damage-claims/{id}/review
    description: "Adjuster takes the claim under review. Also the re-entry point from DISPUTED, making the review loop cyclic."
    roles: [ClaimsAdjuster]
    code: 200
    input: [notes]
    output: DamageClaim
    side_effects:
      - "status SUBMITTED -> UNDER_REVIEW, or DISPUTED -> UNDER_REVIEW"
      - "increments DamageClaim.version by 1"
  - method: POST
    path: /installations/damage-claims/{id}/dispute
    description: "A named party disputes the review and, at the same time, re-scores its own evidence points, which changes the eventual EVIDENCE split."
    roles: [PlantDispatcher, TransportManager, SetCrewLead]
    code: 200
    input: [reason_code, "plant_evidence_points?", "hauler_evidence_points?", "installer_evidence_points?"]
    output: DamageClaim
    side_effects:
      - "status UNDER_REVIEW -> DISPUTED and dispute_round increments by 1"
      - "increments DamageClaim.version by 1"
  - method: POST
    path: /installations/damage-claims/{id}/adjudicate
    description: "Adjuster adjudicates the claim under one of two allocation bases and fans out a five-level chargeback cascade."
    roles: [ClaimsAdjuster]
    code: 200
    input: [allocation_basis]
    output: DamageClaim
    side_effects:
      - "cascade link 1: runs calculations.damage_claim_allocation (variant STAGE or EVIDENCE), writing approved_amount_cents, plant_charge_cents, hauler_charge_cents and installer_charge_cents; status UNDER_REVIEW -> ADJUDICATED"
      - "cascade link 2: calculations.party_chargeback_ledger fully recomputes Plant, Hauler and SetCrew chargeback_balance_cents"
      - "cascade link 3: the hauler moves to SUSPENDED at or above HAULER_SUSPENSION_THRESHOLD_CENTS, the plant to PROBATION at or above PLANT_PROBATION_THRESHOLD_CENTS"
      - "cascade link 4: every SCHEDULED RouteLeg of a newly SUSPENDED hauler moves to HAULER_HOLD"
      - "cascade link 5: calculations.order_posture drives every affected order to TRANSPORT_BLOCKED; a DAMAGED_HOLD section returns to DELIVERED"
      - "increments the version of every mutated row by 1"
  - method: POST
    path: /installations/damage-claims/{id}/reverse
    description: "Adjuster reverses an adjudicated claim (new evidence, wrong party). Every side effect of adjudication must unwind with no residue: balances, party statuses, leg holds and order postures all return to their pre-adjudication values."
    roles: [ClaimsAdjuster]
    code: 200
    input: [reason_code]
    output: DamageClaim
    side_effects:
      - "status ADJUDICATED -> REVERSED (terminal) and the three charge fields reset to 0"
      - "calculations.party_chargeback_ledger fully recomputes all three balance families, dropping the reversed claim from every sum"
      - "the hauler returns to ACTIVE and the plant to ACTIVE once their balances fall below their thresholds"
      - "every HAULER_HOLD RouteLeg of the restored hauler returns to SCHEDULED"
      - "calculations.order_posture re-derives every affected order's posture"
      - "increments the version of every mutated row by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth / shape ---------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty on any endpoint (validation priority 1)"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not in the endpoint's authorized_roles (validation priority 2)"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed principal (PlantDispatcher / TransportManager / SetCrewLead) addresses a resource belonging to a different Plant, Hauler or SetCrew (validation priority 6)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, out-of-range number, unknown enum value, or non-ISO-8601 datetime (validation priority 3)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the addressed row's current state has no transition for the requested action - including every terminal state (REVOKED, SUPERSEDED, ARRIVED, CANCELLED, RELEASED, COMPLETED, CLOSED, CERTIFIED, FAILED, REVERSED, READY) and every repeat of a once-only action (validation priority 7)"

  # --- existence ------------------------------------------------------------
  - id: ERR_PLANT_NOT_FOUND
    http: 404
    condition: "plant_id in a path or body does not resolve to a Plant"
  - id: ERR_HAULER_NOT_FOUND
    http: 404
    condition: "hauler_id in a path or body does not resolve to a Hauler"
  - id: ERR_ESCORT_CREW_NOT_FOUND
    http: 404
    condition: "escort_crew_id in a path or body does not resolve to an EscortCrew"
  - id: ERR_SET_CREW_NOT_FOUND
    http: 404
    condition: "set_crew_id in a path or body does not resolve to a SetCrew"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id in a path or body does not resolve to an InstallationOrder"
  - id: ERR_SECTION_NOT_FOUND
    http: 404
    condition: "section_id or mates_to_section_id does not resolve to a HomeSection"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "the addressed Site does not exist, or a set job's order has no Site row at all"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit_id in a path or body does not resolve to a TransportPermit"
  - id: ERR_ROUTE_LEG_NOT_FOUND
    http: 404
    condition: "route_leg_id in a path or body does not resolve to a RouteLeg"
  - id: ERR_ESCORT_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "the addressed EscortAssignment does not exist"
  - id: ERR_SET_JOB_NOT_FOUND
    http: 404
    condition: "set_job_id in a path or body does not resolve to a SetJob"
  - id: ERR_MARRIAGE_JOINT_NOT_FOUND
    http: 404
    condition: "the addressed MarriageJoint does not exist"
  - id: ERR_ANCHOR_CERT_NOT_FOUND
    http: 404
    condition: "the addressed AnchorCertification does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "the addressed DamageClaim does not exist"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version on POST /installations/set-jobs does not equal the parent InstallationOrder's current version (§1.2.1 rule set-job-create-stale-order)"
  - id: ERR_STALE_SECTION_VERSION
    http: 412
    condition: "expected_section_version on POST /installations/permits does not equal the parent HomeSection's current version (§1.2.1 rule permit-create-stale-section)"

  # --- cross-entity state gates ---------------------------------------------
  - id: ERR_SITE_NOT_READY
    http: 409
    condition: "dispatch attempted while the order's Site.readiness_status is READINESS_PENDING or READINESS_FAILED (validation priority 8)"
  - id: ERR_ORDER_POSTURE_BLOCKED
    http: 409
    condition: "dispatch or final inspection attempted while the order's posture is TRANSPORT_BLOCKED (validation priority 9)"
  - id: ERR_SECTIONS_NOT_DELIVERED
    http: 422
    condition: "dispatch attempted while at least one HomeSection of the order is not DELIVERED (validation priority 17)"
  - id: ERR_SECTION_COUNT_MISMATCH
    http: 422
    condition: "the number of HomeSection rows on the order does not equal InstallationOrder.section_count (validation priority 17)"

  # --- safety / qualification ------------------------------------------------
  - id: ERR_INSTALLER_LICENSE_INVALID
    http: 422
    condition: "the SetCrew is LICENSE_EXPIRED, or its license_expiry_date is before the logical current date, at dispatch or anchor-certification submission (validation priority 11)"
  - id: ERR_ESCORT_ENDORSEMENT_MISSING
    http: 422
    condition: "the EscortCrew's endorsement_class does not cover the route leg's permit_class (validation priority 12)"
  - id: ERR_ESCORT_CREW_OVERBOOKED
    http: 422
    condition: "the EscortCrew's status is OVERBOOKED when a new reservation is requested, or when a leg carrying that crew's RESERVED assignment attempts departure (validation priority 13)"
  - id: ERR_HAULER_SUSPENDED
    http: 422
    condition: "a route leg is created for, or departure is attempted by, a Hauler whose status is SUSPENDED (validation priority 14)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "the X-User-ID signing the final installation inspection equals Site.last_inspector_user_id (validation priority 15)"

  # --- referential coherence -------------------------------------------------
  - id: ERR_LEG_PERMIT_MISMATCH
    http: 422
    condition: "a route leg's state_code differs from the state_code of the TransportPermit it is filed under (validation priority 16)"
  - id: ERR_SECTION_MATE_INVALID
    http: 422
    condition: "mates_to_section_id points at the section itself, at a section of a different order, or at a section already mated to a third section (validation priority 16)"

  # --- workflow completeness gates -------------------------------------------
  - id: ERR_ANCHOR_NOT_CERTIFIED
    http: 422
    condition: "final inspection attempted with no CERTIFIED AnchorCertification on the set job (validation priority 18)"
  - id: ERR_MARRIAGE_LINE_NOT_CLOSED
    http: 422
    condition: "final inspection attempted while SetJob.closure_status is NOT_ASSESSED or FAIL (validation priority 19)"
  - id: ERR_SCOPE_SPLIT_INCOMPLETE
    http: 422
    condition: "final inspection attempted while SetJob.scope_status is still SCOPE_PENDING (validation priority 20)"
  - id: ERR_UTILITY_CROSSOVER_INCOMPLETE
    http: 422
    condition: "final inspection attempted while SetJob.crossover_recorded is false (validation priority 20)"
  - id: ERR_MARRIAGE_JOINT_COUNT_MISMATCH
    http: 422
    condition: "close-marriage-line attempted when the recorded joint count does not equal max(0, InstallationOrder.section_count - 1) (validation priority 25)"
  - id: ERR_PERMIT_ESCORT_SHORTFALL
    http: 422
    condition: "issuance attempted with fewer RESERVED role == ESCORT assignments across the permit's non-cancelled legs than the FINAL escort_count_required, or with no RESERVED role == PILOT_CAR assignment while the FINAL pilot_car_required is true (validation priority 26)"
  - id: ERR_ANCHOR_REVISION_LIMIT
    http: 422
    condition: "resubmit attempted when AnchorCertification.revision_round already equals MAX_ANCHOR_REVISIONS (validation priority 27)"
  - id: ERR_ANCHOR_COMPLIANCE_FAILED
    http: 422
    condition: "review with decision CERTIFY attempted while hud_pass or state_pass is false"

  # --- temporal / capacity ---------------------------------------------------
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end is not strictly after window_start, or scheduled_end_date is before scheduled_start_date (validation priority 21)"
  - id: ERR_ESCORT_WINDOW_CONFLICT
    http: 409
    condition: "the requested escort window overlaps a RESERVED window of the same crew once both are inflated by buffer_minutes; back-to-back windows conflict whenever buffer_minutes > 0 (validation priority 22)"
  - id: ERR_SET_CREW_CAPACITY_EXCEEDED
    http: 409
    condition: "a calendar date inside the candidate job's inclusive range would carry more committed jobs for that SetCrew than daily_capacity; two jobs merely touching on one date both occupy it (validation priority 23)"

  # --- uniqueness ------------------------------------------------------------
  - id: ERR_DUPLICATE_SECTION_INDEX
    http: 409
    condition: "(order_id, section_index) already exists (validation priority 24)"
  - id: ERR_DUPLICATE_LEG_SEQUENCE
    http: 409
    condition: "(permit_id, sequence_no) already exists (validation priority 24)"
  - id: ERR_DUPLICATE_JOINT_INDEX
    http: 409
    condition: "(set_job_id, joint_index) already exists (validation priority 24)"
  - id: ERR_DUPLICATE_ANCHOR_CERT
    http: 409
    condition: "a non-FAILED AnchorCertification already exists for the set job (validation priority 24)"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_PERMIT_FEE_UNPAID
    http: 402
    condition: "issuance attempted while TransportPermit.paid_amount_cents is below the FINAL final_fee_cents (validation priority 29)"
  - id: ERR_CLAIM_AMOUNT_EXCEEDS_CAP
    http: 422
    condition: "claimed_amount_cents exceeds CLAIM_CAP_CENTS at claim creation (validation priority 30)"
  - id: ERR_CLAIM_EVIDENCE_MISSING
    http: 422
    condition: "adjudicate with allocation_basis EVIDENCE while the three evidence-point fields sum to 0 (validation priority 28)"
  - id: ERR_CLAIM_STAGE_MISMATCH
    http: 422
    condition: "adjudicate with allocation_basis STAGE while DamageClaim.discovered_stage is not a key of STAGE_OWNER (validation priority 28)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Champion installation-network administrator. Onboards plants, haulers, escort vendors and installer crews, books set jobs and authorises dispatch. Not tied to any single trading partner."
    identity: opaque
    exclusive_operations:
      - "POST /installations/plants"
      - "POST /installations/haulers"
      - "POST /installations/escort-crews"
      - "POST /installations/set-crews"
      - "POST /installations/set-jobs"
      - "POST /installations/set-jobs/{id}/dispatch"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /installations/orders (with PlantDispatcher)"
      - "POST /installations/sites (with InstallationInspector)"
      - "all GET endpoints"

  - name: PlantDispatcher
    description: "Manufacturing-plant shipping office. Declares sections, records plant-QC measurements and releases floors to the permit desk. Scoped to its own Plant."
    identity: "entity_backed:Plant"
    exclusive_operations:
      - "POST /installations/sections"
      - "PATCH /installations/sections/{id}"
      - "POST /installations/sections/{id}/measure"
      - "POST /installations/sections/{id}/release"
    shared_operations:
      - "POST /installations/orders (with NetworkAdmin)"
      - "POST /installations/damage-claims (with TransportManager, SetCrewLead, ClaimsAdjuster)"
      - "POST /installations/damage-claims/{id}/dispute (with TransportManager, SetCrewLead)"
      - "all GET endpoints"

  - name: TransportManager
    description: "Motor-carrier transport manager. Pays permit fees, books escort crews and reports departures and arrivals. Scoped to its own Hauler."
    identity: "entity_backed:Hauler"
    exclusive_operations:
      - "POST /installations/permits/{id}/pay-fee"
      - "POST /installations/escort-assignments"
      - "POST /installations/escort-assignments/{id}/release"
      - "POST /installations/route-legs/{id}/depart"
      - "POST /installations/route-legs/{id}/arrive"
    shared_operations:
      - "POST /installations/route-legs (with PermitDesk)"
      - "POST /installations/damage-claims (with PlantDispatcher, SetCrewLead, ClaimsAdjuster)"
      - "POST /installations/damage-claims/{id}/dispute (with PlantDispatcher, SetCrewLead)"
      - "all GET endpoints"

  - name: PermitDesk
    description: "State transport-permit desk. Requests, issues and revokes oversize/superload permits. Deliberately separate from the carrier that pays the fee, so no single principal can both pay and issue."
    identity: opaque
    exclusive_operations:
      - "POST /installations/permits"
      - "POST /installations/permits/{id}/issue"
      - "POST /installations/permits/{id}/revoke"
    shared_operations:
      - "POST /installations/route-legs (with TransportManager)"
      - "all GET endpoints"

  - name: SetCrewLead
    description: "Licensed installer crew lead. Records the marriage line, the skirting/steps scope split, the utility crossover and the anchoring package. Scoped to its own SetCrew."
    identity: "entity_backed:SetCrew"
    exclusive_operations:
      - "POST /installations/set-jobs/{id}/scope-split"
      - "POST /installations/set-jobs/{id}/utility-crossover"
      - "POST /installations/set-jobs/{id}/close-marriage-line"
      - "POST /installations/marriage-joints"
      - "POST /installations/anchor-certifications"
      - "POST /installations/anchor-certifications/{id}/resubmit"
    shared_operations:
      - "POST /installations/damage-claims (with PlantDispatcher, TransportManager, ClaimsAdjuster)"
      - "POST /installations/damage-claims/{id}/dispute (with PlantDispatcher, TransportManager)"
      - "all GET endpoints"

  - name: InstallationInspector
    description: "Third-party installation inspector. Signs site readiness, certifies anchoring and signs the final installation inspection that starts the warranty. Segregation of duties forbids the same X-User-ID from signing both the site-readiness and the final inspection for one order."
    identity: opaque
    exclusive_operations:
      - "POST /installations/sites/{id}/readiness-inspection"
      - "POST /installations/anchor-certifications/{id}/review"
      - "POST /installations/set-jobs/{id}/final-inspection"
    shared_operations:
      - "POST /installations/sites (with NetworkAdmin)"
      - "all GET endpoints"

  - name: ClaimsAdjuster
    description: "Damage-in-transit claims adjuster. Reviews, adjudicates and reverses claims between plant, hauler and installer. Cannot dispute a claim - only the named parties can."
    identity: opaque
    exclusive_operations:
      - "POST /installations/damage-claims/{id}/review"
      - "POST /installations/damage-claims/{id}/adjudicate"
      - "POST /installations/damage-claims/{id}/reverse"
    shared_operations:
      - "POST /installations/damage-claims (with PlantDispatcher, TransportManager, SetCrewLead)"
      - "all GET endpoints"
