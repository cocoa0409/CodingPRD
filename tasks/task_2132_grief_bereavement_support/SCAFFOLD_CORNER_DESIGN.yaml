        grounds: ["validations[priority=14]", "errors[ERR_GRANT_FUNDS_INSUFFICIENT]", "entities.GrantAward.fields.available_cents"]
        distinguishing_aspect: "With every earlier rule satisfied, an award whose available_cents is 11445 - one cent short of the 11446 required - is refused with ERR_GRANT_FUNDS_INSUFFICIENT (409), while an award of exactly 11446 passes because the comparison is >=."
