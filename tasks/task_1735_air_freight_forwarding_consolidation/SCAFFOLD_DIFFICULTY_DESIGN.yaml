            - { call: "GET /air-freight/flight-bookings/${bk1}", as: ForwarderOps, captures: { w_after_a: "$.data.consumed_weight_kg" } }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv2: "$.data.version" } }
