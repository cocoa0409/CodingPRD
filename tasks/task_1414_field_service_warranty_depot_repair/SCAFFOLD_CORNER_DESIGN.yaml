            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "00000000-0000-0000-0000-000000000000", quantity: 1 } ] }, captures: { e2: $.data.error_id } }
