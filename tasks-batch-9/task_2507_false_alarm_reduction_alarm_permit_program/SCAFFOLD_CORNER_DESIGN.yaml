      - name: money_conservation_invariant_returns_to_zero_drift_after_a_payment_void
        claim_type: Aggregation reversal
        grounds:
          - calculations.money_conservation_invariant
          - state_machines.PenaltyInvoice.PAID_to_PARTIALLY_PAID
        distinguishing_aspect: "The void must move BOTH sides of cash_in == cash_out + credit_balance_cents in the same request: the two 5500-cent allocations flip to REVERSED, both invoices return to UNPAID, and the 1000-cent residual is pulled back out of credit_balance_cents so no credit drift survives the compensating action."
        test_recipe:
          setup:
            - "The two-permit fixture with a 12000-cent AUTO_WATERFALL payment that fully settled both invoices and parked 1000 cents of credit."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_sys2
            - *k_app2
            - *k_inv_p1
            - *k_inv_p2
            - *k_site_v
            - *k_pay12000
          trigger:
            - &k_pay12000_void
              call: "POST /false-alarm-program/payment-records/${pay12000_id}/void"
              payload: { void_reason: "Cheque returned unpaid by the drawee bank." }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { pay12000_status: $.data.status, pay12000_voided_at: $.data.voided_at }
          assert:
            - "the response status is 200 and response_type is object"
            - "PaymentRecord.${pay12000_id}.status == VOIDED with voided_at 2026-08-01T00:00:00Z"
            - "both PaymentAllocation rows are status REVERSED and neither invoice retains any paid_cents"
            - "PenaltyInvoice.${invP1_id} and ${invP2_id} are both back to payment_status UNPAID with outstanding_cents 5500 each"
            - "AlarmSite.${site_id}.credit_balance_cents == 0 and outstanding_balance_cents == 11000"
            - "cash_in 0 == cash_out 0 + credit_balance_cents 0 — the identity holds with zero drift"

      - name: chargeable_count_conservation_invariant_renumbers_and_reprices_after_a_grant
        claim_type: Aggregation reversal
        grounds:
          - calculations.chargeable_count_conservation_invariant
          - state_machines.Appeal.HEARD_to_GRANTED
        distinguishing_aspect: "Granting the appeal on occurrence 3 must leave the site byte-identical to a world where that incident never counted: occurrence 4 renumbers DOWN to 3 and is RE-PRICED at the 10000 tier (10000 * 1.50 * 1.20 = 18000 instead of 45000), its invoice is re-assessed to 18900, the exempted incident's invoice is VOIDED, and the surviving index set is exactly {1, 2, 3}."
        test_recipe:
          setup:
            - "The four-system fixture with incidents 1..4 COUNTED at clock 2026-09-20T01:00:00Z (fees 0, 0, 15000, 45000)."
            - "An appeal on incident 3 is filed, scheduled onto ho-03's 2026-10-05T14:00:00Z docket, and the session is held at that instant so the appeal reaches HEARD."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_c3
            - *k_sys1
            - *k_app1
            - *k_sys2
            - *k_app2
            - *k_sys3
            - *k_app3
            - *k_sys4
            - *k_app4
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
            - *k_inc1_counted
            - *k_dr2
            - *k_dr2_val
            - *k_dr2_disp
            - *k_inc2
            - *k_inc2_counted
            - *k_dr3
            - *k_dr3_val
            - *k_dr3_disp
            - *k_inc3
            - *k_inc3_counted
            - *k_dr4
            - *k_dr4_val
            - *k_dr4_disp
            - *k_inc4
            - *k_inc4_counted
            - *k_docket1
            - &k_appeal3
              call: "POST /false-alarm-program/appeals"
              payload: { false_alarm_incident_id: "${inc3_id}", grounds: "WRONG_CAUSE_CODE", narrative: "The glassbreak trip was caused by a utility power transient, not an equipment defect.", expected_false_alarm_incident_version: "${inc3_v2}" }
              as: AlarmUser
              as_user_id: "${site_id}"
              captures: { appeal3_id: $.data.id, appeal3_v: $.data.version }
            - &k_sched_appeal3
              call: "POST /false-alarm-program/appeals/${appeal3_id}/schedule"
              payload: { hearing_docket_id: "${docket1_id}", expected_hearing_docket_version: "${docket1_v}" }
              as: HearingOfficer
              as_user_id: "ho-03"
              captures: { appeal3_v2: $.data.version }
            - &k_clock_oct05_1400
              call: "POST /false-alarm-program/_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T14:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
            - &k_hold_docket1
              call: "POST /false-alarm-program/hearing-dockets/${docket1_id}/hold-session"
              payload: {}
              as: HearingOfficer
              as_user_id: "ho-03"
              captures: { docket1_v2: $.data.version, docket1_status: $.data.status }
          trigger:
            - &k_decide_appeal3_granted
              call: "POST /false-alarm-program/appeals/${appeal3_id}/decide"
              payload: { decision: "GRANTED", findings: "The utility transient is an exempt cause; the occurrence is struck from the premises record.", exempt_cause_code: "UTILITY_POWER_FAILURE" }
              as: HearingOfficer
              as_user_id: "ho-03"
              captures: { appeal3_v3: $.data.version, appeal3_status: $.data.status }
          assert:
            - "the response status is 200 and response_type is object"
            - "Appeal.${appeal3_id}.status == GRANTED with decided_by_user_id ho-03, which differs from FalseAlarmIncident.${inc3_id}.determined_by_user_id faro-11"
            - "FalseAlarmIncident.${inc3_id}.status == EXEMPT_BY_APPEAL with occurrence_index null and assessed_fee_cents 0; its 15750-cent invoice is payment_status VOIDED with outstanding_cents 0"
            - "FalseAlarmIncident.${inc4_id}.occurrence_index == 3 (renumbered down) and assessed_fee_cents == 18000 (10000 * 1.50 * 1.20), fee_basis.tier_base_cents == 10000"
            - "the invoice for incident 4 is re-assessed to subtotal_cents 18000, admin_fee_cents 900, assessed_cents 18900"
            - "INVARIANT A: AlarmSite.${site_id}.chargeable_count_window == 3; INVARIANT B: the surviving occurrence_index set is exactly {1, 2, 3} with no gaps or duplicates"
            - "INVARIANT C: lifetime_assessed_cents == 40900 (four 5500 permit invoices plus 18900) and outstanding_balance_cents == 40900, so renewal_block_active flips back to false"
            - "AlarmSite.${site_id}.response_status == RESPONSE_ACTIVE because 3 < probation_threshold_count 4"

  # ===========================================================================
  # 4. VALIDATIONS — Violation -> Error for the §1.4 rules, Satisfaction -> Pass
  #    for the interesting gates, and Priority Ordering for the declared
  #    conflict pairs. Batch 1 covers the header / auth / format / existence /
  #    ownership prefix (priorities 1-10).
  # ===========================================================================
  - section: validations
    instances:

      - name: alarm_site_read_missing_x_user_id_header_returns_401
        claim_type: Violation -> Error
        grounds:
          - validations.priority_1_headers_ERR_MISSING_AUTH_HEADERS
          - errors.ERR_MISSING_AUTH_HEADERS
        distinguishing_aspect: "Priority 1 is evaluated before body parsing, path resolution and role lookup, so a request carrying X-User-Role: PermitClerk but no X-User-ID is 401 ERR_MISSING_AUTH_HEADERS even when the path id is itself unknown — the 404 never surfaces."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one ACTIVE schedule and one premises exist. The trigger call is issued with the X-User-ID header omitted entirely (empty as_user_id)."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
          trigger:
            - call: "GET /false-alarm-program/alarm-sites/${site_id}"
              payload: {}
              as: PermitClerk
              as_user_id: ""
              captures: { err_hdr_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_MISSING_AUTH_HEADERS"
            - "no AlarmSite body is returned — the response carries only error_id and message"
            - "repeating the same header-less call against a fabricated siteId 99999999-9999-4999-8999-999999999999 still returns 401 ERR_MISSING_AUTH_HEADERS, never 404 ERR_ALARM_SITE_NOT_FOUND, proving priority 1 precedes priority 6"

      - name: alarm_site_read_with_an_unrecognized_role_header_is_unauthenticated
        claim_type: Violation -> Error
        grounds:
          - validations.priority_2_headers_ERR_UNKNOWN_ROLE
          - errors.ERR_UNKNOWN_ROLE
          - rbac.roles
        distinguishing_aspect: "A syntactically present but unknown role string is rejected at priority 2 with 401 ERR_UNKNOWN_ROLE, one step before the per-endpoint 403 ERR_ROLE_NOT_PERMITTED; the match is case-sensitive, so even \"permitclerk\" is unknown."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one premises exists."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
          trigger:
            - call: "GET /false-alarm-program/alarm-sites/${site_id}"
              payload: {}
              as: "PermitSupervisor"
              as_user_id: "pc-07"
              captures: { err_role_unknown: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNKNOWN_ROLE"
            - "the eight declared roles are unchanged: PermitSupervisor is not one of them, so the endpoint's roles list is never consulted"
            - "the same call with the exact string PermitClerk returns 200, confirming the rejection is about role recognition and not about permission"

      - name: alarm_company_create_by_permit_clerk_is_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations.priority_3_auth_ERR_ROLE_NOT_PERMITTED
          - endpoints.POST_/false-alarm-program/alarm-companies
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "POST /alarm-companies declares roles: [ProgramAdministrator] only. A recognized-but-unlisted role fails at priority 3 with 403 ERR_ROLE_NOT_PERMITTED before the body is validated, so a payload that is also missing fields still yields the 403, not the 422."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. No company registered yet."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /false-alarm-program/alarm-companies"
              payload: { legal_name: "Northgate Monitoring LLC", license_number: "TXALM-51001", contact_email: "ops@northgate.example", contact_phone: "+12145550333", score_mode: "VOLUME_WEIGHTED" }
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err_role_403: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_ROLE_NOT_PERMITTED"
            - "no AlarmCompany row is created: GET /false-alarm-program/alarm-companies as ProgramAdministrator returns total_count 0"
            - "the identical payload sent as ProgramAdministrator pa-01 returns 201, so the rejection is purely the role check"

      - name: suspension_order_create_missing_required_effective_through_returns_422
        claim_type: Priority Ordering
        grounds:
          - validations.priority_4_format_ERR_MISSING_REQUIRED_FIELD
          - validations.priority_7_existence_body_fk
          - endpoints.POST_/false-alarm-program/suspension-orders
        distinguishing_aspect: "effective_through is a required §1.5 input of POST /suspension-orders; omitting it returns 422 ERR_MISSING_REQUIRED_FIELD even though the same request also carries a triggering_incident_id that does not exist (priority 7) and a site that has not reached the suspension threshold (priority 49) — priority 4 wins over both."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; permit AP-000001 issued at the site, so the site exists with version bumps to read."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_site_v
          trigger:
            - call: "POST /false-alarm-program/suspension-orders"
              payload: { alarm_site_id: "${site_id}", triggering_incident_id: "33333333-3333-4333-8333-333333333333", basis: "EXCESSIVE_FALSE_ALARMS", effective_from: "2026-08-11T00:00:00Z", expected_alarm_site_version: "${site_v_now}" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { err_missing_field: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_MISSING_REQUIRED_FIELD"
            - "the message names effective_through, the first required §1.5 input absent in declaration order"
            - "no SuspensionOrder row is created and AlarmSite.${site_id}.version is unchanged from ${site_v_now}"

      - name: compliance_report_create_with_a_negative_count_is_rejected
        claim_type: Violation -> Error
        grounds:
          - validations.priority_5_format_ERR_INVALID_FIELD_VALUE
          - endpoints.POST_/false-alarm-program/compliance-reports
          - errors.ERR_INVALID_FIELD_VALUE
        distinguishing_aspect: "Count fields are non-negative integers and are reported in §1.5 input declaration order: with reported_dispatch_count = -1 (4th input) and ecv_attempt_count = 2.5 (6th input) both malformed, the 422 names reported_dispatch_count."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; Guardian Signal Monitoring LLC is registered and ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
          trigger:
            - call: "POST /false-alarm-program/compliance-reports"
              payload: { monitoring_company_id: "${company_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", reported_dispatch_count: -1, reported_cancellation_count: 0, ecv_attempt_count: 2.5 }
              as: AlarmCompanyOperator
              as_user_id: "${company_id}"
              captures: { err_bad_value: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_INVALID_FIELD_VALUE"
            - "the message names reported_dispatch_count, not ecv_attempt_count, because the first offender in §1.5 declaration order is reported"
            - "no ComplianceReport row is created and AlarmCompany.${company_id}.reporting_compliance_score stays null"
            - "the same rule rejects a *_pct outside [0, 1] and a timestamp without a trailing Z on POST /false-alarm-program/fee-schedules"

      - name: appeal_schedule_with_unknown_appeal_and_unknown_docket_is_not_found
        claim_type: Priority Ordering
        grounds:
          - validations.priority_6_existence_path
          - validations.priority_7_existence_body_fk
          - endpoints.POST_/false-alarm-program/appeals/{appealId}/schedule
          - errors.ERR_APPEAL_NOT_FOUND
        distinguishing_aspect: "Path ids are resolved strictly left-to-right and always before body FKs: an unknown appealId together with an unknown hearing_docket_id returns ERR_APPEAL_NOT_FOUND, never ERR_HEARING_DOCKET_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one OPEN docket exists so a real version value is available for the payload."
          setup_api_calls:
            - *k_clock
            - *k_docket1
          trigger:
            - call: "POST /false-alarm-program/appeals/44444444-4444-4444-8444-444444444444/schedule"
              payload: { hearing_docket_id: "55555555-5555-4555-8555-555555555555", expected_hearing_docket_version: "${docket1_v}" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { err_path_404: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_APPEAL_NOT_FOUND"
            - "HearingDocket.${docket1_id}.scheduled_appeal_count is still 0 and its version is unchanged at ${docket1_v}"
            - "the ERR_STALE_HEARING_DOCKET_VERSION check (priority 16) is never reached, confirming existence precedes concurrency"

      - name: appeal_create_with_unknown_incident_and_unknown_prior_appeal_is_not_found
        claim_type: Violation -> Error
        grounds:
          - validations.priority_7_existence_body_fk
          - endpoints.POST_/false-alarm-program/appeals
          - errors.ERR_FALSE_ALARM_INCIDENT_NOT_FOUND
        distinguishing_aspect: "Body FKs are resolved in §1.5 input declaration order, so with false_alarm_incident_id (1st input) and prior_appeal_id (5th input) both unknown the 404 is ERR_FALSE_ALARM_INCIDENT_NOT_FOUND; the version guard at priority 15 is also skipped."
        test_recipe:
          setup:
            - "Clock advanced to 2026-09-20T01:00:00Z with incident 1 COUNTED (occurrence_index 1, fee 5000) so a genuine incident version exists to quote."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
            - *k_inc1_counted
          trigger:
            - call: "POST /false-alarm-program/appeals"
              payload: { false_alarm_incident_id: "66666666-6666-4666-8666-666666666666", grounds: "WRONG_CAUSE_CODE", narrative: "Filed against an incident id that does not exist.", expected_false_alarm_incident_version: "${inc1_v2}", prior_appeal_id: "77777777-7777-4777-8777-777777777777" }
              as: AlarmUser
              as_user_id: "${site_id}"
              captures: { err_fk_404: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_FALSE_ALARM_INCIDENT_NOT_FOUND"
            - "ERR_APPEAL_NOT_FOUND is not returned even though prior_appeal_id is also unknown — only the first offender in declaration order is reported"
            - "FalseAlarmIncident.${inc1_id}.status is still COUNTED and its version is unchanged at ${inc1_v2}: no appeal row exists"

      - name: payment_record_read_by_a_different_site_alarm_user_is_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations.priority_8_auth_ERR_NOT_RESOURCE_OWNER
          - endpoints.GET_/false-alarm-program/payment-records/{paymentId}
          - errors.ERR_NOT_RESOURCE_OWNER
          - rbac.AlarmUser
        distinguishing_aspect: "AlarmUser is entity-backed: its X-User-ID must equal the AlarmSite.id reachable from the target resource. The 88 Elm Ave user holds a valid, listed role for this endpoint and quotes an existing payment id, yet the reachable site is 1200 Main St, so priority 8 returns 403."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a 5500-cent card payment is posted against the 1200 Main St premises, and a second unrelated premises (88 Elm Ave) exists to supply a foreign AlarmUser id."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_inv1
            - *k_site_v
            - *k_pay1
            - *k_site2
          trigger:
            - call: "GET /false-alarm-program/payment-records/${pay1_id}"
              payload: {}
              as: AlarmUser
              as_user_id: "${site2_id}"
              captures: { err_owner: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_NOT_RESOURCE_OWNER"
            - "no PaymentRecord body is disclosed: receipt_number and amount_cents do not appear in the response"
            - "the same call with as_user_id ${site_id} returns 200 with amount_cents 5500 and allocated_cents 5500"

      - name: incident_determination_by_the_validating_supervisor_is_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations.priority_9_auth_ERR_SEGREGATION_OF_DUTIES
          - endpoints.POST_/false-alarm-program/false-alarm-incidents/{incidentId}/determination
          - errors.ERR_SEGREGATION_OF_DUTIES
          - rbac.role_model_segregation_of_duties
        distinguishing_aspect: "One human (dual-07) validates the dispatch request wearing the PoliceDispatchSupervisor hat and then tries to rule on the incident wearing the FalseAlarmReviewOfficer hat. Both roles are listed for their endpoints, so only the X-User-ID comparison against DispatchRequest.validated_by_user_id can reject it."
        test_recipe:
          setup:
            - "Clock 2026-09-20T01:00:00Z; a DISPATCHED request whose validated_by_user_id is dual-07 carries a REPORTED incident."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - &k_dr1_val_dual
              call: "POST /false-alarm-program/dispatch-requests/${dr1_id}/validate"
              payload: {}
              as: PoliceDispatchSupervisor
              as_user_id: "dual-07"
              captures: { dr1_dual_v: $.data.version }
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
          trigger:
            - call: "POST /false-alarm-program/false-alarm-incidents/${inc1_id}/determination"
              payload: { determination: "COUNTED", review_notes: "Same officer who validated the request now rules on it." }
              as: FalseAlarmReviewOfficer
              as_user_id: "dual-07"
              captures: { err_sod: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "DispatchRequest.${dr1_id}.validated_by_user_id == \"dual-07\", which is exactly the acting X-User-ID"
            - "FalseAlarmIncident.${inc1_id}.status is still REPORTED with occurrence_index null and assessed_fee_cents null; no invoice is raised"
            - "the identical call as FalseAlarmReviewOfficer faro-11 succeeds with 200 and occurrence_index 1"

      - name: hold_session_by_a_non_docket_hearing_officer_is_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations.priority_10_auth_ERR_NOT_DOCKET_OFFICER
          - endpoints.POST_/false-alarm-program/hearing-dockets/{docketId}/hold-session
          - errors.ERR_NOT_DOCKET_OFFICER
        distinguishing_aspect: "hold-session declares roles: [HearingOfficer], so the role check passes for any hearing officer; priority 10 additionally pins the actor to HearingDocket.hearing_officer_user_id (ho-03), rejecting officer ho-99 with 403 even though the clock has reached session_start."
        test_recipe:
          setup:
            - "One OPEN docket for officer ho-03 at 2026-10-05T14:00:00Z .. 16:00:00Z; the clock is parked exactly on session_start, so the temporal precondition is satisfied."
          setup_api_calls:
            - *k_clock
            - *k_docket1
            - *k_clock_oct05_1400
          trigger:
            - call: "POST /false-alarm-program/hearing-dockets/${docket1_id}/hold-session"
              payload: {}
              as: HearingOfficer
              as_user_id: "ho-99"
              captures: { err_not_officer: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_NOT_DOCKET_OFFICER"
            - "HearingDocket.${docket1_id}.status is still OPEN with held_at null and version unchanged at ${docket1_v}"
            - "the identical call as HearingOfficer ho-03 returns 200 with status HELD, so the rejection is the identity comparison and not ERR_HEARING_SESSION_NOT_STARTED"

      - name: alarm_site_read_by_its_own_alarm_user_satisfies_the_ownership_check
        claim_type: Satisfaction -> Pass
        grounds:
          - validations.priority_8_auth_ERR_NOT_RESOURCE_OWNER
          - endpoints.GET_/false-alarm-program/alarm-sites/{siteId}
          - rbac.AlarmUser
        distinguishing_aspect: "The positive half of priority 8: when the AlarmUser's X-User-ID equals the target AlarmSite.id the ownership row passes silently and the full record — posture, counters, balances and the version clients quote as expected_alarm_site_version — is returned, proving the rule gates identity rather than blanket-denying AlarmUser reads."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; the 1200 Main St premises exists with permit AP-000001 issued and its 5500-cent permit invoice outstanding."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
