            - call: "POST /warewashing/usage-variance-reviews"
              payload: { site_id: "${site_id}", product_id: "${det_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z", basis: "AS_CALIBRATED", opening_inventory_ml: 20000, ending_inventory_ml: 20000 }
              as: QualityAuditor
              captures: { rev_id: $.data.id, rev_status: $.data.status, cls: $.data.classification, racks: $.data.rack_count_in_period, exp: $.data.expected_consumption_ml }
          assert:
            - "${term_end} == 2029-08-01"
            - "${err_1} == ERR_PERIOD_OUTSIDE_AGREEMENT_TERM with HTTP 422 - one day before start_date"
            - "${err_2} == ERR_INVALID_REQUEST with HTTP 400 - the inverted interval is caught by the priority-16 shape rule first"
            - "${rev_status} == DRAFT with ${racks} == 0, ${exp} == 0 and ${cls} == INSUFFICIENT_DATA - a legal period with no data still records"

      - name: a_published_review_freezes_the_deliveries_inside_its_half_open_window
        claim_type: Temporal validation
        grounds:
          - validations.delivery_period_not_closed
          - state_machines.ChemicalDelivery.status.DELIVERED_to_VOIDED
          - errors[ERR_DELIVERY_IN_CLOSED_PERIOD]
        distinguishing_aspect: |
          Voiding is legal today and illegal tomorrow purely because a review was published over the
          delivery's instant, and the freeze uses the same half-open window as every other period rule:
          the 2026-08-02 delivery inside [2026-08-01, 2026-08-08) is ERR_DELIVERY_IN_CLOSED_PERIOD (409)
          while the delivery landing exactly at period_end voids normally. The published figures are not
          recomputed by that void, so the review still reports the 40000 ml it was stamped with.
        test_recipe:
          setup:
