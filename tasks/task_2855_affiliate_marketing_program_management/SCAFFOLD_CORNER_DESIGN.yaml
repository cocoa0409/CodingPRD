      - name: stale_affiliate_version_on_decide_rejected_then_fresh_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[decide-stale-affiliate]
          - validations[priority 29]
          - errors[ERR_STALE_AFFILIATE_VERSION]
          - endpoints[POST /affiliate-applications/{id}/decide]
        distinguishing_aspect: "The OCC guard on decide reads the applicant's Affiliate.version, not the application's: filing a tax document bumps Affiliate.version from 1 to 2 while leaving status PENDING_APPLICATION and review_state SCREENED, so nothing in the state machine or the validation table objects and only expected_affiliate_version 1 fails, with ERR_STALE_AFFILIATE_VERSION (412) and no decision written. Re-reading the affiliate and resubmitting the identical decision with version 2 succeeds and lands the affiliate at ACTIVE with version 3."
        test_recipe:
          setup:
            - "Clock 2026-07-05T00:00:00Z."
            - "One Network, one CONTENT affiliate at version 1, one application screened to PASS by cmp-001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
