scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dues_amount_anniversary_vs_calendar_prorated
        grounds:
          - calculations.dues_invoice_amount
          - calculations.dues_invoice_amount.variants.anniversary_variant
          - calculations.dues_invoice_amount.variants.calendar_prorated_variant
        distinguishing_aspect: |
          Same schedule (annual_amount_cents=120000) and same join date
          produce different DuesInvoice.amount_cents when the governing
          RenewalCyclePolicy is ANNIVERSARY (full 120000) versus
          CALENDAR + PRO_RATA_DAILY (prorated by days remaining to the
          anchor date). The dual-variant divergence is on the
          DuesInvoice/dues-pricing domain.
        test_recipe:
          setup:
            - "Category PROF_ACTIVE with is_voting=true, is_directory_eligible=true, allows_auto_renew=true, lapse_grace_days=30, reinstatement_window_days=90"
            - "Chapter CH_WEST active, non-affiliate"
            - "DuesSchedule SCHED_P published with effective_from=2026-01-01, effective_to=null, annual_amount_cents=120000, chapter_share_bps=2000, increase_notice_days=60"
            - "Two RenewalCyclePolicy rows: POLICY_ANN (mode=ANNIVERSARY, anchors ignored, proration=NONE), POLICY_CAL (mode=CALENDAR, anchor 12/31, proration=PRO_RATA_DAILY)"
            - "Logical clock at 2026-05-01T00:00:00Z (server default)"
            - "Member A joined_at=2026-05-01 on POLICY_ANN; Member C joined_at=2026-05-01 on POLICY_CAL"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF_ACTIVE", name: "Professional Active", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat_prof: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH_WEST", name: "West Chapter", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch_west: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY_ANN", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol_ann: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY_CAL", mode: "CALENDAR", calendar_anchor_month: 12, calendar_anchor_day: 31, proration_method: "PRO_RATA_DAILY" }
              as: DuesAdministrator
              captures: { pol_cal: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat_prof}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched_prof: $.data.id }
            - call: "POST /api/dues-schedules/${sched_prof}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "ann@x.com", full_name: "Ann Ann", category_id: "${cat_prof}", home_chapter_id: "${ch_west}", cycle_policy_id: "${pol_ann}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m_ann: $.data.id }
            - call: "POST /api/members"
              payload: { email: "cal@x.com", full_name: "Cal Cal", category_id: "${cat_prof}", home_chapter_id: "${ch_west}", cycle_policy_id: "${pol_cal}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m_cal: $.data.id }
          trigger:
            - call: "GET /api/members/${m_ann}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m_ann}"
              captures: { inv_ann_amt: "$.data[0].amount_cents" }
            - call: "GET /api/members/${m_cal}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m_cal}"
              captures: { inv_cal_amt: "$.data[0].amount_cents" }
          assert:
            - "Member.${m_ann} initial DuesInvoice.amount_cents == 120000"
            - "Member.${m_cal} initial DuesInvoice.amount_cents == 80219"
            # 2026 is non-leap (365 days). May 1 to Dec 31 = 244 days.
            # round_half_up(120000 * 244 / 365) = round_half_up(80219.178...) = 80219
            - "Invoice amounts differ (120000 != 80219) — dual-variant divergence confirmed"

      - name: chapter_share_vs_national_revenue_attribution_divergent_aggregation
        grounds:
          - calculations.chapter_share_amount
          - calculations.non_dues_revenue_attribution
        distinguishing_aspect: |
          Two different aggregation domains — chapter dues-share on the
          DuesInvoice (cents flowing to member.home_chapter) versus
          non-dues revenue attribution on the Member (fiscal_period
          rollup that never touches dues ledgers). Same member, same
          payment amount, but two independent aggregation outputs —
          chapter_share_cents accrues on the chapter side while
          RevenueAttribution sums roll up on a per-fiscal-period member
          axis, with no cross-contamination.
        test_recipe:
          setup:
            - "Category PROF_ACTIVE active, lapse_grace_days=30, reinstatement_window_days=90"
            - "Chapter CH_EAST active, non-affiliate"
            - "Schedule SCHED_P published for PROF_ACTIVE: annual_amount_cents=120000, chapter_share_bps=2000, effective_from=2026-01-01, increase_notice_days=60"
            - "RenewalCyclePolicy POLICY_ANN (ANNIVERSARY)"
            - "Member M paid full 120000 initial invoice (SETTLED)"
            - "Three RevenueAttribution rows on M: (CONFERENCE_REGISTRATION, 45000, 2026-06-05), (PUBLICATION_SALE, 8000, 2026-06-12), (CERTIFICATION_FEE, 15000, 2026-07-01)"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF_ACTIVE", name: "Professional", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat_prof: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH_EAST", name: "East Chapter", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch_east: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY_ANN", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol_ann: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat_prof}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched_prof: $.data.id }
            - call: "POST /api/dues-schedules/${sched_prof}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat_prof}", home_chapter_id: "${ch_east}", cycle_policy_id: "${pol_ann}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "GET /api/members/${m_id}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /api/dues-invoices/${inv_id}/payments"
              payload: { payment_method_token: "tok_visa", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/members/${m_id}/revenue-attributions"
              payload: { revenue_kind: "CONFERENCE_REGISTRATION", amount_cents: 45000, occurred_at: "2026-06-05T10:00:00Z" }
              as: MembershipAdministrator
            - call: "POST /api/members/${m_id}/revenue-attributions"
              payload: { revenue_kind: "PUBLICATION_SALE", amount_cents: 8000, occurred_at: "2026-06-12T10:00:00Z" }
              as: MembershipAdministrator
            - call: "POST /api/members/${m_id}/revenue-attributions"
              payload: { revenue_kind: "CERTIFICATION_FEE", amount_cents: 15000, occurred_at: "2026-07-01T10:00:00Z" }
              as: MembershipAdministrator
          trigger:
            - call: "GET /api/dues-invoices/${inv_id}"
              payload: {}
              as: MembershipAdministrator
              captures: { inv_chapter_share: $.data.chapter_share_cents }
            - call: "GET /api/members/${m_id}/revenue-attributions"
              payload: { fiscal_period: "2026-06" }
              as: MembershipAdministrator
              captures: {}
            - call: "GET /api/members/${m_id}"
              payload: {}
              as: MembershipAdministrator
              captures: { lifetime_dues: $.data.lifetime_dues_paid_cents }
          assert:
            - "DuesInvoice.${inv_id}.chapter_share_cents == 24000"   # round_half_up(120000*2000/10000) = 24000
            - "RevenueAttribution sum for fiscal_period=2026-06 == 53000"   # 45000+8000
            - "RevenueAttribution sum for fiscal_period=2026-07 == 15000"
            - "Member.${m_id}.lifetime_dues_paid_cents == 120000 (RevenueAttribution entries MUST NOT pollute dues ledger)"

  # =====================================================================
  # Rule 2 — Combinatorial formulas in different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: member_risk_score_weighted_3_input_formula
        grounds:
          - calculations.member_risk_score
          - entities.Member.fields.risk_score
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction:
          member_risk_score combines failed_payment_count_90d,
          days_to_current_period_end, and benefit_usage_events_30d via
          three independent min/max clamps then sums. Nested clamping +
          threshold non-linearity makes this combinatorial, not linear.
        test_recipe:
          setup:
            - "Category, chapter, schedule (120000, 2000 bps), ANNIVERSARY cycle set up"
            - "Member M joined 2026-05-01, initial invoice settled"
            - "Clock advanced to 2027-04-15 (16 days to expiry on 2027-05-01)"
            - "Member has 2 DECLINED_TRANSIENT attempts on a renewal invoice within last 90 days (renewal invoice issued; two failed charges)"
            - "Member has 5 benefit usage events in last 30 days"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /api/dues-invoices/${inv0}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/members/${m}/verify"
              payload: {}
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-15T00:00:00Z" }
              as: DuesAdministrator
            - call: "POST /api/_scheduler/run_renewal_cycle"
              payload: {}
              as: DuesAdministrator
            - call: "GET /api/members/${m}/dues-invoices"
              payload: { payment_status: "PENDING" }
              as: Member
              as_user_id: "${m}"
              captures: { inv_renew: "$.data[0].id" }
            - call: "POST /api/dues-invoices/${inv_renew}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "DECLINED_TRANSIENT" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/dues-invoices/${inv_renew}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "DECLINED_TRANSIENT" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "GET /api/members/${m}"
              payload: {}
              as: MembershipAdministrator
              captures: { risk: $.data.risk_score }
          assert:
            # failed_payment_count_90d=2 -> min(40, 40)=40
            # days_to_current_period_end = (2027-05-01 - 2027-04-15) = 16 -> max(0, 30 - 8) = 22
            # benefit_usage_events_30d=5 -> max(0, 30 - 5) = 25
            # risk_score = clamp(0, 100, 40+22+25) = 87
            - "Member.${m}.risk_score == 87"

      - name: chapter_share_nested_rounding_order_pinned
        grounds:
          - calculations.chapter_share_amount
          - entities.DuesInvoice.fields.chapter_share_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Computing
          chapter_share_cents = round(amount * bps / 10000) FIRST then
          national = amount - chapter_share (pinned order) yields a
          different cent than the naive national=round(amount*(1-bps/10000))
          with chapter = amount - national. For amount=120001 and
          bps=3333 the two orderings diverge by one cent.
        test_recipe:
          setup:
            - "Category, chapter, schedule with odd-cent amount and bps chosen to force different cent under the two rounding orders: annual_amount_cents=120001, chapter_share_bps=3333"
            - "Member pays full invoice via SUCCEEDED payment"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120001, chapter_share_bps: 3333, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /api/dues-invoices/${inv}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m}"
            - call: "GET /api/dues-invoices/${inv}"
              payload: {}
              as: MembershipAdministrator
              captures: { cs: $.data.chapter_share_cents }
          assert:
            # round_half_up(120001 * 3333 / 10000) = round_half_up(39996.3333) = 39996
            # national = 120001 - 39996 = 80005
            # naive alt: national_first = round_half_up(120001*6667/10000) = round_half_up(80006.6667) = 80007 -> chapter = 120001-80007 = 39994
            # two cent-level answers differ: pinned order yields 39996, alternate yields 39994
            - "DuesInvoice.${inv}.chapter_share_cents == 39996"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dues_invoice_parallel_payment_x_fulfillment_dimensions
        grounds:
          - state_machines.DuesInvoice
          - entities.DuesInvoice.fields.payment_status
          - entities.DuesInvoice.fields.fulfillment_status
        distinguishing_aspect: |
          DuesInvoice carries two INDEPENDENT state axes —
          payment_status (PENDING|SETTLED|FAILED_RETRYABLE|FAILED_FINAL|
          REFUNDED|WRITTEN_OFF) × fulfillment_status (NOT_DUE|
          COVERAGE_ACTIVE|COVERAGE_SUSPENDED|COVERAGE_ENDED) — evolving
          in parallel on the same row. Refund flips both
          (SETTLED/COVERAGE_ACTIVE -> REFUNDED/COVERAGE_ENDED); a
          FAILED_RETRYABLE -> SETTLED transition changes only the
          payment axis while fulfillment flips COVERAGE_ACTIVE on the
          transition to SETTLED but stays independent. This is the
          parallel-dimension shape.
        test_recipe:
          setup:
            - "Category PROF, Chapter CH, ANNIVERSARY policy, schedule published, Member M initial invoice settled (payment_status=SETTLED, fulfillment_status=COVERAGE_ACTIVE)"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { inv: "$.data[0].id" }
            - call: "POST /api/dues-invoices/${inv}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /api/dues-invoices/${inv}/refund"
              payload: {}
              as: MembershipAdministrator
            - call: "GET /api/dues-invoices/${inv}"
              payload: {}
              as: MembershipAdministrator
              captures: { ps: $.data.payment_status, fs: $.data.fulfillment_status }
          assert:
            - "DuesInvoice.${inv}.payment_status == REFUNDED"
            - "DuesInvoice.${inv}.fulfillment_status == COVERAGE_ENDED"

      - name: member_cyclic_grace_active_lapsed_reinstated_cycle
        grounds:
          - state_machines.Member
          - state_machines.Member.transitions.GRACE_to_ACTIVE
          - state_machines.Member.transitions.LAPSED_to_REINSTATED
        distinguishing_aspect: |
          Member machine is cyclic: ACTIVE -> GRACE -> ACTIVE (renewal
          payment during grace), and LAPSED -> REINSTATED -> ACTIVE
          (reinstatement path). Both revert edges permit re-entry to
          ACTIVE — no absorbing sink short of RESIGNED/EXPELLED. The
          cyclic shape lives on Member, different entity from the
          parallel DuesInvoice instance.
        test_recipe:
          setup:
            - "Category PROF (lapse_grace_days=30, reinstatement_window_days=90), chapter, ANNIVERSARY policy, schedule published"
            - "Member M joined_at=2026-05-01, initial invoice settled, status ACTIVE"
            - "Clock advanced past current_period_end (2027-05-01) but within grace window (2027-05-15) — Member -> GRACE"
            - "Renewal invoice SETTLED during grace -> Member GRACE -> ACTIVE"
            - "Clock advanced to 2028-06-15 (past second expiry, still within grace) — Member -> GRACE again"
            - "Clock advanced past grace (2028-06-30) -> Member GRACE -> LAPSED"
            - "ReinstatementRequest filed; back-dues invoice settled; approve -> Member LAPSED -> REINSTATED -> ACTIVE"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /api/dues-invoices/${inv0}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/members/${m}/verify"
              payload: {}
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-15T00:00:00Z" }
              as: DuesAdministrator
            - call: "POST /api/_scheduler/run_renewal_cycle"
              payload: {}
              as: DuesAdministrator
