            - "post-trigger - Partner.${p1_id}.trailing_revenue_cents == 17810000 (8650000 + 9160000): the memo is subtracted exactly once, never twice"
            - "OrderInvoice.${inv_seed_id}.invoice_amount_cents == 8650000 and margin_value_cents == 1350000 (an unrelated invoice of the same partner is untouched)"

      - name: claim_reject_restores_mdf_fund_bucket_conservation
        grounds:
          - consistency_model.invariants.mdf_allocation_bucket_conservation
          - state_machines.MdfClaim.validation_state_VALIDATED_to_REJECTED
          - calculations.mdf_claim_approval
          - calculations.marketing_attainment
          - entities.MdfAllocation.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity #2 - a different ledger entirely: the four-bucket allocation identity
          allocated_cents == committed_cents + paid_cents + expired_cents + available_cents, which
          must hold at all three checkpoints (create 20,000/253,000, validate 6,000/267,000,
          reject 0/273,000) and must return the pool to its exact pre-claim value of 273,000 with
          no cent parked in expired_cents - unlike a WRITTEN_OFF settlement, a validation
          claw-back is a true compensation.
