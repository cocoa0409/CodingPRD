          assert:
            - "${ap1_state} == SUBMITTED   # §1.2 Appeal.initial_state"
            - "HTTP 409 and ${err_code} == ERR_INVALID_STATE   # priority 85, not 403 and not 422"
            - "Appeal.${ap1}.state == SUBMITTED and Appeal.${ap1}.decided_by_user_id == null and Appeal.${ap1}.decided_at == null"
            - "EnforcementAction.${a1}.state == ISSUED and EnforcementAction.${a1}.resolution_reason == null"
            - "Seller.${s_id}.severity_points_balance == 2.00 and Seller.${s_id}.enforcement_state == WATCHLIST   # no partial reinstatement"

      - name: state_relist_an_active_listing_returns_listing_not_removed
        claim_type: invalid_transitions
        grounds:
          - "state_machines.Listing.transitions.REMOVED_to_ACTIVE"
          - "validations.priority_85"
          - "errors[ERR_LISTING_NOT_REMOVED]"
        distinguishing_aspect: |
          §1.2 Listing gives relist exactly one source state, REMOVED. Firing it at an ACTIVE
          listing is a trigger that does not exist from that state, so it is refused with the
          state-specific code ERR_LISTING_NOT_REMOVED (409) rather than being silently treated as
          a no-op success — and the listing's fields are untouched afterwards.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One ACTIVE seller (enforcement_state ACTIVE, so the cross-entity relist guard is satisfied and only the listing's own state can refuse the call)."
            - "One listing in its initial state ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
