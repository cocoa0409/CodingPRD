      - name: amendment_required_at_exactly_one_pct_move
        claim_type: threshold_boundary
        grounds: [calculations.beneficial_ownership_pct, state_machines.BeneficialHolder.FILED_to_AMENDMENT_REQUIRED]
        distinguishing_aspect: "After filing at 5.00, a move to 5.99 (delta 0.99) keeps the holder FILED; reaching 6.00 (delta exactly 1.00) triggers AMENDMENT_REQUIRED (>= semantics)."
        test_recipe:
          setup:
            - "Issuer I (shares_outstanding 1,000,000); holder H brought to 50,000 shares (5.00) and SCHEDULE_13G filed (last_reported_pct == 5.00)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
