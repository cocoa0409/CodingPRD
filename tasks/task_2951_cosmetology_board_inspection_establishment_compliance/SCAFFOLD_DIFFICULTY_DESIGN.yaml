            - "after the third contest: Citation.${cit_id}.status == CONTESTED"
            - "the final POST /cosmetology/citations/${cit_id}/hearings returns 409 with error_id ERR_HEARING_ROUNDS_EXHAUSTED"
            - "GET /cosmetology/citations/${cit_id}/hearings returns total_count == 2"
            - "Citation.${cit_id}.hearing_round_count == 2 (unchanged by the rejected request)"

  - rule_id: transitive_cascade
    instances:
      - name: finalize_score_to_ledger_to_balance_to_license_status_to_posture
        grounds:
          - state_machines.Inspection.PENDING_REVIEW_to_FINALIZED
          - calculations.inspection_adjusted_score
          - calculations.establishment_demerit_and_posture
          - entities.LedgerEntry.fields.delta_points
          - entities.Establishment.fields.demerit_balance
          - entities.Establishment.fields.license_status
          - entities.Establishment.fields.compliance_posture
        distinguishing_aspect: |
          Depth 5 from a single finalize call, each hop caused by the previous one: the FINAL score
          115.00 is what creates the DEMERIT_POINTS ledger row; that row is what moves
          demerit_balance to 115.00; that balance crossing 100.00 is what re-derives license_status
          to PROBATION; and the balance is what then re-derives compliance_posture to FROZEN.
        test_recipe:
          setup:
            - "Violation codes FSP-300 (CRITICAL, base_points 4.0) and IMP-200 (MAJOR, base_points 6.0) are published."
            - "One establishment 'Chair & Comb' exists with license_status PENDING_INSPECTION, demerit_balance 0.00 and compliance_posture CLEAR."
            - "One ROUTINE inspection on it is PENDING_REVIEW with two findings, neither corrected on site: FSP-300 observed 5x (100.00 final points) and IMP-200 observed 1x (15.00 final points)."
            - "The establishment has no other ledger entries, so the pre-finalize snapshot is 0.00."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
