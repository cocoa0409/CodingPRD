              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-CALC-5" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_g: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_g}/separations"
              payload: { blended_gallons: 100 }
              as: ComplianceManager
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: true }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/vendors/${ven}/diligence"
              payload: { outcome: "APPROVED" }
              as: ComplianceManager
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 50, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/deliver"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/verify"
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /rfs/rin-trades/${trd}/invalidate"
              as: ComplianceManager
          trigger:
            - call: "GET /rfs/compliance-accounts/${acct}/position"
              as: ComplianceManager
          assert:
            - "bucket (D6,2026).generated_rins == 100 and purchased_rins == 50"
            - "bucket (D6,2026).invalidated_rins == 50"
            - "bucket (D6,2026).available_rins == 100"
            - "position.total_invalidated_rins == 50"

      - name: posture_shortfall_after_deadline
        claim_type: correct_result
        grounds: [calculations.posture_derivation]
        distinguishing_aspect: "Threshold + clock: a year with unmet RVOs flips ON_TRACK -> SHORTFALL exactly when the clock passes the retirement deadline; retired == RVO would be SATISFIED (>= boundary)."
        test_recipe:
          setup: ["year 2026 with provisional RVOs 100/200/300/400 and zero retirements; clock advanced past 2027-03-31T23:59:59Z"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-CALC-6" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "GET /rfs/obligation-years/${yr}"
              as: ComplianceManager
          assert:
            - "ObligationYear.${yr}.compliance_posture == SHORTFALL"

      - name: dual_variant_rvo_divergence
        claim_type: variant_divergence
        grounds: [calculations.rvo_obligation]
        distinguishing_aspect: "Covered by difficulty instance rvo_provisional_vs_final_on_obligation_year."
        excluded_because:
          difficulty_instance: dual_variant_calc / rvo_provisional_vs_final_on_obligation_year
          rationale: "Both variants and their delta asserted there."

      - name: dual_variant_state_credit_divergence
        claim_type: variant_divergence
        grounds: [calculations.state_credit_generation]
        distinguishing_aspect: "Covered by difficulty instance state_credit_provisional_vs_verified_on_credit_report."
        excluded_because:
          difficulty_instance: dual_variant_calc / state_credit_provisional_vs_verified_on_credit_report
          rationale: "Provisional 1.4808 vs verified 2.2212 asserted there, including program-total reconciliation."

      - name: carryover_cap_boundary
        claim_type: correct_result
        grounds: [calculations.carryover_cap_check]
        distinguishing_aspect: "Covered by difficulty instance carryover_cap_at_exactly_20_percent_allowed."
        excluded_because:
          difficulty_instance: boundary_precision_check / carryover_cap_at_exactly_20_percent_allowed
          rationale: "At-cap pass and cap+1 fail asserted there."

      - name: per_lot_rounding_order
        claim_type: precision
        grounds: [calculations.rin_generation_qty]
        distinguishing_aspect: "Covered by difficulty instance per_lot_generation_rounding_mode_b."
        excluded_because:
          difficulty_instance: combinatorial_formula / per_lot_generation_rounding_mode_b
          rationale: "Per-lot round-then-sum (4 vs 3) pinned and asserted there."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role header is rejected 401 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rfs/compliance-accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_UNAUTHENTICATED with http 401 (auth beats existence: the id does not exist either)"

      - name: stale_year_version_occ_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "concurrency_rules[report-create-stale-year]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: after a first report create bumps ObligationYear.version 1 -> 2, a second create carrying the stale version 1 is rejected 412."
        test_recipe:
          setup: ["account + year (version 1 observed); first QUARTERLY report created with expected version 1 (year now version 2)"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-VAL-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id, yr_v: $.data.version }
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "QUARTERLY", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
          trigger:
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "ANNUAL", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_STALE_VERSION with http 412 (year.version advanced by the first create)"
            - "no second report is created"

      - name: invalid_vintage_year_window
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_VINTAGE]"]
        distinguishing_aspect: "Temporal gate at lot generation: at default clock (year 2026) a vintage-2024 lot is too old and vintage-2027 is in the future; both rejected."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-VAL-2" }
              as: OpsAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2024, gallon_qty: 10, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { err_old: $.data.error_id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2027, gallon_qty: 10, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { err_new: $.data.error_id }
          assert:
            - "vintage 2024 error_id == ERR_INVALID_VINTAGE"
            - "vintage 2027 error_id == ERR_INVALID_VINTAGE"
            - "allowed window at default clock is {2025, 2026}"

      - name: retirement_deadline_exact_instant
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DEADLINE_PASSED]", calculations.rin_vintage_expiry]
        distinguishing_aspect: "Temporal boundary: submit at exactly (year+1)-03-31T23:59:59Z succeeds (<=), one second later fails. Distinct timestamp metric from retention cutoff."
        test_recipe:
          setup: ["year 2026; GENERATED D6/2026 lot 100 separated; batch TOTAL/D6 qty 10 created DRAFT; clock at deadline minus 1 second"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-VAL-3" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot: $.data.id }
            - call: "POST /rfs/rin-lots/${lot}/separations"
              payload: { blended_gallons: 100 }
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 10 }
