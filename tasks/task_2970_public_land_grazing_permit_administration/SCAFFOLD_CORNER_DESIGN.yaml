      - name: corner_appeals_adjudicator_alone_dockets_and_decides_others_rejected
        claim_type: role_denied_operation
        grounds:
          - rbac.AppealsAdjudicator.exclusive_operations
          - rbac.AppealsAdjudicator.shared_operations
          - validations.priority_3
          - validations.priority_5
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_APPEAL_NOT_FOUND
        distinguishing_aspect: "Docketing and deciding belong to the independent adjudicator only: the deciding officer, the authoring specialist and the appellant permittee are all refused, including the appellant who filed the case in the first place. The control separates the role gate from existence — the same never-minted appeal id returns 403 for every other role but 404 ERR_APPEAL_NOT_FOUND for the adjudicator, and the adjudicator's read access to the rest of the record is unaffected."
        test_recipe:
          setup:
            - "One permittee ${c_m51_id} to supply a real entity_backed Permittee identity; no appeal is minted, because priority 3 answers every refusal before the lookup"
          setup_api_calls:
            - call: "POST /permittees"
              payload: { name: "Appellant Only Ranch", contact_email: "appellant.only@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m51_id: "$.data.id" }
          trigger:
            - call: "POST /appeal-cases/00000000-0000-4000-8000-000000000099/docket"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /appeal-cases/00000000-0000-4000-8000-000000000099/docket"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /appeal-cases/00000000-0000-4000-8000-000000000099/docket"
              payload: {}
              as: Permittee
              as_user_id: "${c_m51_id}"
            - call: "POST /appeal-cases/00000000-0000-4000-8000-000000000099/decide"
              payload: { appeal_outcome: "AFFIRM", decision_rationale: "The deciding officer attempts to affirm its own decision on appeal." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /appeal-cases/00000000-0000-4000-8000-000000000099/decide"
              payload: { appeal_outcome: "REVERSE", decision_rationale: "The appellant attempts to grant its own appeal." }
              as: Permittee
              as_user_id: "${c_m51_id}"
            - call: "POST /appeal-cases/00000000-0000-4000-8000-000000000099/docket"
              payload: {}
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
            - call: "GET /appeal-cases"
              payload: { appeal_status: "FILED" }
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
            - call: "GET /permittees/${c_m51_id}"
              payload: {}
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
          assert:
            - "the first five calls all return HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "sixth call: HTTP 404 with data.error_id == \"ERR_APPEAL_NOT_FOUND\" — the adjudicator's role is listed, so the same id now reaches the priority-5 lookup"
            - "seventh call: HTTP 200 with total_count 0 — the adjudicator holds every GET, unscoped, and sees an empty docket"
            - "eighth call: HTTP 200 with data.id == ${c_m51_id} — unlike a Permittee, the adjudicator is not restricted to its own rows"

      - name: corner_system_admin_holds_the_clock_and_every_other_call_is_rejected
        claim_type: role_exclusive_operation
        grounds:
          - rbac.SystemAdmin.exclusive_operations
          - rbac.SystemAdmin.shared_operations
          - endpoints.POST /_clock/set_current_utc
          - validations.priority_3
          - validations.priority_27
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_CLOCK_NOT_MONOTONIC
        distinguishing_aspect: "SystemAdmin is the only role whose shared_operations list is EMPTY: it may move the logical clock and may do nothing else at all — not even a GET, which every other role holds. Symmetrically, no business role may move the clock. The successful set is proven to have landed by a following backward set that is refused at priority 27, not by re-reading the clock (POST /_clock/set_current_utc declares output null, so nothing can be captured from it)."
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default; one permittee ${c_m52_id} to supply a real entity_backed Permittee identity"
          setup_api_calls:
            - call: "POST /permittees"
              payload: { name: "Clock Probe Ranch", contact_email: "clock.probe@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m52_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Permittee
              as_user_id: "${c_m52_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
            - call: "POST /allotments"
              payload: { name: "Admin Authored Allotment", admin_unit_code: "NV-172", acres: 3000, total_permitted_aums: 100, season_start: "01-01", season_end: "12-31" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
            - call: "GET /allotments"
              payload: {}
              as: SystemAdmin
              as_user_id: "u_admin_1"
            - call: "GET /permittees/${c_m52_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "u_admin_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
          assert:
            - "the first four calls all return HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\" — no business role may move the clock"
            - "fifth call: HTTP 403 ERR_UNAUTHORIZED, and GET /allotments with admin_unit_code NV-172 (read as u_officer_1) returns total_count 0"
            - "sixth and seventh calls: HTTP 403 ERR_UNAUTHORIZED — SystemAdmin holds no GET at all, which is exactly what an empty shared_operations list means"
            - "eighth call: HTTP 200 with data null — the clock advances to 2026-08-15T00:00:00Z"
            - "ninth call: HTTP 422 with data.error_id == \"ERR_CLOCK_NOT_MONOTONIC\", which proves the eighth call actually landed (a one-second retreat from the new now is refused, while it would have been a legal forward jump from the 2026-08-01 default)"
            - "control: an allotment created as u_officer_1 after the eighth call carries created_at on 2026-08-15, not 2026-08-01"

