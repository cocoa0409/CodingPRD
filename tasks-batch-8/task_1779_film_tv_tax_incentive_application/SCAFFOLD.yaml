    side_effects: ["remaining_amount_cents -= redeem_amount_cents; redeemed_total_cents += redeem_amount_cents", "-> REDEEMED when remaining reaches 0", "ERR_CERTIFICATE_EXPIRED when now > expires_at", "ERR_AMOUNT_EXCEEDS_REMAINING when redeem_amount_cents > remaining_amount_cents"]

  # --- CreditTransfer ---
  - method: POST
    path: "/api/transfers"
    description: "Propose a credit sale (OCC-guarded on the certificate's version); increments certificate.version"
    roles: [Producer]
    code: 201
    input: [certificate_id, buyer_id, amount_cents, price_cents, expected_certificate_version]
    output: CreditTransfer
    side_effects: ["status=PROPOSED", "proposed_at = now; expires_at = now + program.transfer_proposal_validity_days", "current_price_cents = price_cents", "increments CreditCertificate.version by 1", "certificate must be ISSUED or PARTIALLY_TRANSFERRED and not expired", "amount_cents <= certificate.remaining_amount_cents (ERR_AMOUNT_EXCEEDS_REMAINING)", "price_cents >= floor(program.transfer_price_floor_pct * amount_cents) (ERR_TRANSFER_PRICE_BELOW_FLOOR)"]
  - method: GET
    path: "/api/transfers"
    description: "List transfers (filtered; reverse-reachability for certificate_id and buyer_id)"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: ["certificate_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: "CreditTransfer[]"
    side_effects: []
  - method: GET
    path: "/api/transfers/{transferId}"
    description: "Get a transfer"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: []
    output: CreditTransfer
    side_effects: []
  - method: POST
    path: "/api/transfers/{transferId}/counter"
    description: "Counter-offer: buyer counters when PROPOSED, seller counter-counters when COUNTERED (negotiation loop)"
    roles: [Producer, CreditBuyer]
    code: 200
    input: [new_price_cents]
    output: CreditTransfer
    side_effects: ["PROPOSED -> COUNTERED (buyer) or COUNTERED -> PROPOSED (seller)", "current_price_cents = new_price_cents; round_count += 1", "floor re-checked", "ERR_TRANSFER_EXPIRED when now > expires_at"]
  - method: POST
    path: "/api/transfers/{transferId}/accept"
    description: "Accept the standing offer: buyer accepts when PROPOSED, seller accepts when COUNTERED"
    roles: [Producer, CreditBuyer]
    code: 200
    input: []
    output: CreditTransfer
    side_effects: ["-> ACCEPTED", "ERR_TRANSFER_EXPIRED when now > expires_at"]
  - method: POST
    path: "/api/transfers/{transferId}/settle"
    description: "Settle an ACCEPTED transfer: debits the certificate and auto-cancels oversized sibling proposals"
    roles: [FilmOfficeAdmin]
    code: 200
    input: []
    output: CreditTransfer
    side_effects: ["ACCEPTED -> SETTLED; settled_at = now", "certificate debited; status -> PARTIALLY_TRANSFERRED or FULLY_TRANSFERRED at 0", "sibling transfers in PROPOSED|COUNTERED with amount_cents > new remaining -> CANCELLED (INSUFFICIENT_REMAINING)"]
  - method: POST
    path: "/api/transfers/{transferId}/cancel"
    description: "Cancel a PROPOSED or COUNTERED transfer (seller cancels; buyer may withdraw its own counter-offer)"
    roles: [Producer, CreditBuyer]
    code: 200
    input: ["cancel_reason?"]
    output: CreditTransfer
    side_effects: ["-> CANCELLED with cancellation_reason = MANUAL"]

  # --- ClawbackCase ---
  - method: POST
    path: "/api/clawback-cases"
    description: "Open a clawback case against a CREDIT_ISSUED application"
    roles: [FilmOfficeAdmin]
    code: 201
    input: [application_id, trigger_reason, "penalty_mode?", "shortfall_amount_cents?"]
    output: ClawbackCase
    side_effects: ["status=OPENED", "certificate_id derived from the application's certificate", "shortfall defaults to certificate.overissued_exposure_cents when omitted", "shortfall must be > 0 and <= certificate.issued_amount_cents (ERR_CLAWBACK_EXCEEDS_EXPOSURE)", "ERR_INVALID_STATE_TRANSITION unless application.status == CREDIT_ISSUED"]
  - method: GET
    path: "/api/clawback-cases"
    description: "List clawback cases (filtered)"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: ["application_id?", "certificate_id?", "status?", "limit?", "offset?"]
    output: "ClawbackCase[]"
    side_effects: []
  - method: GET
    path: "/api/clawback-cases/{caseId}"
    description: "Get a clawback case"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: []
    output: ClawbackCase
    side_effects: []
  - method: POST
    path: "/api/clawback-cases/{caseId}/send-notice"
    description: "Send the clawback notice; starts the appeal window"
    roles: [FilmOfficeAdmin]
    code: 200
    input: []
    output: ClawbackCase
    side_effects: ["OPENED -> NOTICE_SENT", "notice_sent_at = now; appeal_deadline_at = now + program.appeal_window_days"]
  - method: POST
    path: "/api/clawback-cases/{caseId}/appeal"
    description: "Production company appeals within the appeal window"
    roles: [Producer]
    code: 200
    input: ["appeal_grounds?"]
    output: ClawbackCase
    side_effects: ["NOTICE_SENT -> APPEALED", "appealed_at = now", "ERR_APPEAL_WINDOW_CLOSED when now > appeal_deadline_at"]
  - method: POST
    path: "/api/clawback-cases/{caseId}/resolve"
    description: "Resolve a case: SUSTAINED (executes the clawback cascade), VACATE (no financial effect), or SETTLE (cash settlement, certificate untouched)"
    roles: [FilmOfficeAdmin]
    code: 200
    input: [outcome, "settled_amount_cents?"]
    output: ClawbackCase
    side_effects: ["-> SUSTAINED | VACATED | SETTLED", "SUSTAINED computes interest + assessed total per clawback_assessment, then cascades: certificate CLAWED_BACK (remaining forfeited to program cap), open transfers CANCELLED (CERTIFICATE_CLAWED_BACK), application REVOKED", "SUSTAINED from NOTICE_SENT requires now > appeal_deadline_at (ERR_NOTICE_WINDOW_ACTIVE)"]

  # --- Test-driving utility ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock used by every deadline/window/expiry check. The server starts at the fixed default 2026-08-01T00:00:00Z and NEVER falls back to wall-clock time; this endpoint only moves the clock forward or to an arbitrary ISO-8601 instant for deterministic tests."
    roles: [FilmOfficeAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource chain (Producer vs production_company_id, CreditBuyer vs buyer_id, CPAAuditor vs cpa_user_id)" }
  # --- Existence / request shape ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive amount, inverted date range, unknown payload field, or missing conditional field (e.g. settled_amount_cents on SETTLE)" }
  # --- State ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested transition is not declared from the resource's current state (incl. submit on non-DRAFT, review on SUPERSEDED entry, settle on non-ACCEPTED transfer, etc.)" }
  - { id: ERR_APPLICATION_ALREADY_OPEN, http: 409, condition: "Another application for the same (production_id, jurisdiction_program_id) has status NOT IN {DENIED, WITHDRAWN, REVOKED}" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Submit attempted while the program status is DRAFT, SUSPENDED, or CLOSED" }
  - { id: ERR_AUDIT_PACKAGE_EXISTS, http: 409, condition: "An audit package with status NOT IN {REJECTED} already exists for the application" }
  - { id: ERR_CERTIFICATE_ALREADY_ISSUED, http: 409, condition: "A certificate already exists for the application" }
  # --- OCC ---
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version does not match the program's current version on amend" }
  - { id: ERR_STALE_CERTIFICATE_VERSION, http: 412, condition: "expected_certificate_version does not match the certificate's current version on transfer create" }
  # --- Business safety / compliance ---
  - { id: ERR_VENDOR_RESIDENCY_NOT_VERIFIED, http: 409, condition: "Spend-entry QUALIFY attempted while the vendor's residency_status is UNVERIFIED or REJECTED" }
  - { id: ERR_AUDIT_NOT_ACCEPTED, http: 409, condition: "Issue-credit (or credit-estimate variant=FINAL) attempted without an audit package in ACCEPTED (resp. ATTESTED|ACCEPTED) status" }
  - { id: ERR_AUDIT_PACKAGE_INCOMPLETE, http: 409, condition: "Attest attempted with documentation_complete != true" }
  - { id: ERR_SPEND_ENTRIES_PENDING, http: 409, condition: "Attest attempted while any of the application's spend entries is PENDING_REVIEW" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same X-User-ID on both sides of a segregated duty: approver == reviewer_user_id, denier == reviewer_user_id, or audit decider == cpa_user_id" }
  # --- Business temporal ---
  - { id: ERR_WINDOW_NOT_YET_OPEN, http: 409, condition: "Submit attempted before program.window_opens_at" }
  - { id: ERR_APPLICATION_DEADLINE_PASSED, http: 409, condition: "Submit attempted after program.window_closes_at (boundary: submission at exactly window_closes_at is allowed)" }
  - { id: ERR_VERIFICATION_WINDOW_EXPIRED, http: 409, condition: "Spend-entry QUALIFY where spend_date is outside [vendor.verified_at, verified_at + program.vendor_verification_validity_days): start inclusive, end exclusive" }
  - { id: ERR_CERTIFICATE_EXPIRED, http: 409, condition: "Redeem / transfer-create / settle attempted when now > certificate.expires_at" }
  - { id: ERR_TRANSFER_EXPIRED, http: 409, condition: "Counter / accept / settle attempted when now > transfer.expires_at" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal attempted when now > appeal_deadline_at" }
  - { id: ERR_NOTICE_WINDOW_ACTIVE, http: 409, condition: "Resolve SUSTAINED from NOTICE_SENT attempted while now <= appeal_deadline_at (appeal quiet period still running)" }
  # --- Business constraint / referential ---
  - { id: ERR_PROGRAM_WINDOW_OVERLAP, http: 409, condition: "Program create/amend/OPEN whose [window_opens_at, window_closes_at) overlaps another non-CLOSED program with the same jurisdiction_code; touching boundaries are allowed" }
  - { id: ERR_DUPLICATE_SPEND_INVOICE, http: 409, condition: "external_invoice_ref already used by a non-SUPERSEDED spend entry of the same production (any application, any jurisdiction)" }
  - { id: ERR_VENDOR_PRODUCTION_MISMATCH, http: 409, condition: "Spend entry's vendor belongs to a different production than the application's" }
  - { id: ERR_AMENDMENT_TARGET_MISMATCH, http: 409, condition: "amends_entry_id is missing from the same application or is in SUPERSEDED status" }
  # --- Business fiscal ---
  - { id: ERR_MINIMUM_SPEND_NOT_MET, http: 409, condition: "Approve with estimated_qualified_spend_cents below program minimum, or issue-credit with attested capped total below program minimum (final credit 0)" }
  - { id: ERR_PROGRAM_CAP_EXHAUSTED, http: 409, condition: "issue-credit where final_credit_cents > program.remaining_cap_cents (exact fit allowed)" }
  - { id: ERR_TRANSFER_PRICE_BELOW_FLOOR, http: 409, condition: "price_cents (or new_price_cents) < floor(program.transfer_price_floor_pct * amount_cents); exact floor allowed" }
  - { id: ERR_AMOUNT_EXCEEDS_REMAINING, http: 409, condition: "Transfer amount or redemption exceeds certificate.remaining_amount_cents" }
  - { id: ERR_CLAWBACK_EXCEEDS_EXPOSURE, http: 409, condition: "Clawback shortfall_amount_cents is 0 or exceeds certificate.issued_amount_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FilmOfficeAdmin
    description: "State film office administrator: configures programs, issues credits, runs clawbacks, settles transfers, drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/jurisdiction-programs, /amend, /transition — program configuration and lifecycle"
      - "POST /api/applications/{id}/issue-credit — credit issuance"
      - "POST /api/clawback-cases(+ /send-notice, /resolve) — clawback administration"
      - "POST /api/transfers/{id}/settle — settlement desk"
      - "POST /api/_clock/set_current_utc — test clock"
    shared_operations: ["All GET endpoints"]
  - name: FilmOfficeReviewer
    description: "Film office eligibility reviewer: claims and decides applications, verifies vendor residency, qualifies spend, raises audit exceptions, decides audit packages"
    identity: opaque
    exclusive_operations:
      - "POST /api/applications/{id}/claim-review, /request-corrections, /approve, /deny"
      - "POST /api/vendors/{id}/review-residency"
      - "POST /api/spend-entries/{id}/review"
      - "POST /api/audit-packages/{id}/raise-exceptions, /decision"
    shared_operations: ["All GET endpoints"]
  - name: Producer
    description: "Production company applicant: registers companies, productions, vendors; files and resubmits applications; records spend; sells/redeems credits; appeals clawbacks"
    identity: "entity_backed:ProductionCompany"
    exclusive_operations:
      - "POST /api/production-companies, /api/productions, /api/vendors, /api/spend-entries"
      - "POST /api/applications(+ /submit, /withdraw, /resubmit)"
      - "POST /api/certificates/{id}/redeem"
      - "POST /api/clawback-cases/{id}/appeal"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/transfers(+ /counter, /accept, /cancel) — shared with CreditBuyer, actor side pinned by transfer state"
  - name: CPAAuditor
    description: "Independent CPA firm operator: engages audit packages, submits drafts, attests qualified-spend figures"
    identity: opaque
    exclusive_operations:
      - "POST /api/audit-packages(+ /submit-draft, /attest)"
    shared_operations: ["All GET endpoints"]
  - name: CreditBuyer
    description: "Taxpayer purchasing credits on the transfer market"
    identity: "entity_backed:CreditBuyer"
    exclusive_operations:
      - "POST /api/credit-buyers"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/transfers/{id}/counter, /accept, /cancel — shared with Producer, actor side pinned by transfer state"
