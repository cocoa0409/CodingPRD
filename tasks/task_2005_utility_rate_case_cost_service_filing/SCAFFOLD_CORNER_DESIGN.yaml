            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/deficiency-review", payload: { outcome: "ACCEPTED" }, as: CommissionStaff }
            - { call: "POST /api/v1/rate-cases/${rc}/open-discovery", payload: {}, as: CommissionStaff, captures: { close_at: $.data.discovery_close_at } }
            - { call: "POST /api/v1/intervenors", payload: { rate_case_id: "${rc}", party_name: "AAA Industrial Group", representative_name: "Rae Torres", contact_email: "rae@aaa.example" }, as: IntervenorRep, captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-29T00:00:00Z" }, as: CommissionStaff }
            - { call: "POST /api/v1/data-requests", payload: { rate_case_id: "${rc}", subject: "At-close request", body: "Issued exactly at discovery_close_at", issuing_intervenor_id: "${i1}" }, as: IntervenorRep, as_user_id: "${i1}", captures: { dr_ok: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-29T00:00:01Z" }, as: CommissionStaff }
            - { call: "POST /api/v1/data-requests", payload: { rate_case_id: "${rc}", subject: "One second late", body: "Issued one second past discovery_close_at", issuing_intervenor_id: "${i1}" }, as: IntervenorRep, as_user_id: "${i1}", captures: { err: $.data.error_id } }
          assert:
            - "${close_at} == 2026-11-29T00:00:00Z"
            - "At exactly the close instant: request ${dr_ok} created (201, status ISSUED) — the window is inclusive at the deadline"
            - "One second later: ${err} == ERR_DISCOVERY_WINDOW_CLOSED (409)"

      - name: clock_regression_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CLOCK_REGRESSION]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "The logical clock is monotone: moving to an earlier instant AND re-setting the same instant both fail ERR_CLOCK_REGRESSION (strictly forward only); the current_utc remains at the last accepted value."
        test_recipe:
          setup: ["Empty database; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: CommissionStaff, captures: { t1: $.data.current_utc } }
