      - 'after issuing the second standard pass: allocated_units == 2 == sum of units_used over ACTIVE passes (${p2} + ${p3})'
      - ParkingPass.${p1}.status == VOIDED; ${p2} and ${p3} == ACTIVE
  - name: refund_split_money_conservation
    grounds:
    - calculations.ticket_refund_amount
    - state_machines.TicketOrder.PAID_to_REFUNDED
    - entities.TicketOrder.fields.final_total_cents
    distinguishing_aspect: "Conserved quantity: MONEY (cents) \u2014 a different quantity type from\ncapacity units. Invariant: after a PAID -> REFUNDED pair,\nrefund_amount_cents + retained_fee_cents ==\
      \ final_total_cents exactly;\nthe patron refund splits 8508 into 7232 + 1276 with zero drift.\n"
    test_recipe:
      setup:
      - Canonical event, published; clock 2026-05-10T12:00:00Z (early bird applies)
      - Order with lines ADULT_DAY x3 + CHILD_DAY x2, PAID at final_total_cents = 8508
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
          ev_v: $.data.version
      - call: POST /events/${ev_id}/agreements
        payload:
          agreement_type: LANDOWNER_USE
          document_ref: DOC-LAND-1
          effective_from: '2026-07-01T00:00:00Z'
          effective_until: '2026-07-31T00:00:00Z'
          expected_event_version: ${ev_v}
        as: EventOrganizer
        captures:
          ag_land_id: $.data.id
      - call: POST /agreements/${ag_land_id}/sign
        payload:
          signer_name: Landowner Lee
        as: EventOrganizer
      - call: GET /events/${ev_id}
        as: EventOrganizer
        captures:
          ev_v2: $.data.version
      - call: POST /events/${ev_id}/agreements
        payload:
          agreement_type: INSURANCE_LIABILITY
          document_ref: DOC-INS-1
          coverage_amount_cents: 2000000
          effective_from: '2026-07-01T00:00:00Z'
          effective_until: '2026-07-31T00:00:00Z'
          expected_event_version: ${ev_v2}
        as: EventOrganizer
        captures:
          ag_ins_id: $.data.id
      - call: POST /agreements/${ag_ins_id}/sign
        payload:
          signer_name: Insurer Irene
        as: EventOrganizer
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /events/${ev_id}/publish
        as: EventOrganizer
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-10T12:00:00Z'
        as: EventOrganizer
      - call: POST /events/${ev_id}/ticket-orders
        payload:
          buyer_name: Pat Poe
          lines:
          - line_type: ADULT_DAY
            quantity: 3
          - line_type: CHILD_DAY
            quantity: 2
        as: Spectator
        as_user_id: spec-1
        captures:
          ord_id: $.data.id
      - call: POST /ticket-orders/${ord_id}/pay
        payload:
          payment_method: CARD
          payment_reference: payref-1
        as: Spectator
        as_user_id: spec-1
      trigger:
      - call: POST /ticket-orders/${ord_id}/refund
        payload:
          reason: PATRON_CHOICE
        as: Spectator
        as_user_id: spec-1
        captures:
          ref: $.data.refund_amount_cents
          ret: $.data.retained_fee_cents
      assert:
      - TicketOrder.${ord_id}.refund_amount_cents == 7232
      - TicketOrder.${ord_id}.retained_fee_cents == 1276 (round_half_up(8508 * 0.15))
      - TicketOrder.${ord_id}.refund_amount_cents + TicketOrder.${ord_id}.retained_fee_cents == 8508 == final_total_cents (money conserved)
      - TicketOrder.${ord_id}.status == REFUNDED and refund_reason == PATRON_CHOICE
