    path: "/mutual-aid/timesheets/{id}"
    description: "Get one timesheet"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: TimeSheet
    side_effects: []

  - method: GET
    path: "/mutual-aid/timesheets"
    description: "List timesheets"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["crew_id?", "status?", "certified_schedule_id?", "billed_invoice_id?"]
    output: "TimeSheet[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/timesheets/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [CrewSupervisor]
    code: 200
    input: [submitted_by_operator_ref]
    output: TimeSheet
    side_effects: ["submitted_by_operator_ref recorded"]

  - method: POST
    path: "/mutual-aid/timesheets/{id}/certify"
    description: "SUBMITTED -> CERTIFIED; pins effective schedule and prices the day via crew_daily_billing"
    roles: [HostCoordinator]
    code: 200
    input: [certifier_operator_ref]
    output: TimeSheet
    side_effects: ["certified_schedule_id pinned; certified_amount_cents computed; request/event certified totals recomputed"]

  - method: POST
    path: "/mutual-aid/timesheets/{id}/recertify"
    description: "CERTIFIED -> CERTIFIED re-pin and re-price when the pinned schedule was SUPERSEDED"
    roles: [HostCoordinator]
    code: 200
    input: [certifier_operator_ref]
    output: TimeSheet
    side_effects: ["certified_schedule_id re-resolved; certified_amount_cents recomputed; increments TimeSheet.version by 1"]

  - method: POST
    path: "/mutual-aid/timesheets/{id}/reject"
    description: "SUBMITTED -> REJECTED"
    roles: [HostCoordinator]
    code: 200
    input: ["reason?"]
    output: TimeSheet
    side_effects: []

  - method: POST
    path: "/mutual-aid/timesheets/{id}/revise"
    description: "REJECTED -> DRAFT with optional corrected values"
    roles: [CrewSupervisor]
    code: 200
    input: ["day_classification?", "reported_work_minutes?", "reported_travel_minutes?"]
    output: TimeSheet
    side_effects: ["status -> DRAFT"]

  # --- LodgingBlock ---
  - method: POST
    path: "/mutual-aid/lodging-blocks"
    description: "Host registers a hotel room block"
    roles: [HostCoordinator]
    code: 201
    input: [event_id, hotel_name, block_code, total_rooms, nightly_rate_cents]
    output: LodgingBlock
    side_effects: ["assigned_rooms = 0"]

  - method: GET
    path: "/mutual-aid/lodging-blocks/{id}"
    description: "Get one block"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: LodgingBlock
    side_effects: []

  - method: GET
    path: "/mutual-aid/lodging-blocks"
    description: "List blocks"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["event_id?"]
    output: "LodgingBlock[]"
    side_effects: []

  # --- LodgingAssignment ---
  - method: POST
    path: "/mutual-aid/lodging-assignments"
    description: "Allocate rooms from a block to a crew"
    roles: [HostCoordinator]
    code: 201
    input: [block_id, crew_id, room_count, check_in_date, check_out_date]
    output: LodgingAssignment
    side_effects: ["status=RESERVED; block.assigned_rooms += room_count; ERR_LODGING_CAPACITY_EXCEEDED when assigned_rooms + room_count > total_rooms; ERR_LODGING_OVERLAP on same-crew half-open interval collision"]

  - method: GET
    path: "/mutual-aid/lodging-assignments/{id}"
    description: "Get one assignment"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: LodgingAssignment
    side_effects: []

  - method: GET
    path: "/mutual-aid/lodging-assignments"
    description: "List assignments"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["block_id?", "crew_id?", "status?"]
    output: "LodgingAssignment[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/lodging-assignments/{id}/cancel"
    description: "RESERVED -> CANCELLED; frees capacity"
    roles: [HostCoordinator]
    code: 200
    input: []
    output: LodgingAssignment
    side_effects: ["block.assigned_rooms -= room_count"]

  # --- PerDiemClaim ---
  - method: POST
    path: "/mutual-aid/per-diem-claims"
    description: "File a daily per-diem claim (amount computed by per_diem_claim_amount under the effective schedule's method)"
    roles: [RespondingCoordinator]
    code: 201
    input: [crew_id, claim_date, member_count, meals_provided_count, day_factor_type, "receipts_total_cents?"]
    output: PerDiemClaim
    side_effects: ["status=SUBMITTED; method_applied/lodging_covered/amount_cents computed; ERR_DUPLICATE_CLAIM on (crew_id, claim_date) reuse; ERR_INVALID_REQUEST when member_count < 1 or > roster_size or ACTUAL method without receipts"]

  - method: GET
    path: "/mutual-aid/per-diem-claims/{id}"
    description: "Get one claim"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: PerDiemClaim
    side_effects: []

  - method: GET
    path: "/mutual-aid/per-diem-claims"
    description: "List claims"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["crew_id?", "status?"]
    output: "PerDiemClaim[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/per-diem-claims/{id}/approve"
    description: "SUBMITTED -> APPROVED"
    roles: [HostCoordinator]
    code: 200
    input: []
    output: PerDiemClaim
    side_effects: ["request/event certified totals recomputed"]

  - method: POST
    path: "/mutual-aid/per-diem-claims/{id}/reject"
    description: "SUBMITTED -> REJECTED"
    roles: [HostCoordinator]
    code: 200
    input: []
    output: PerDiemClaim
    side_effects: []

  # --- Invoice ---
  - method: POST
    path: "/mutual-aid/invoices"
    description: "Responding utility drafts an invoice against a request; provisional totals computed immediately"
    roles: [RespondingFinance]
    code: 201
    input: [request_id, rate_schedule_id, billing_period_start, billing_period_end]
    output: Invoice
    side_effects: ["status=DRAFT; provisional_* computed (provisional variant); request must be in {IN_PROGRESS, FULFILLED, RELEASED} (ERR_INVALID_STATE_TRANSITION); ERR_INVOICE_EXISTS when a non-DRAFT non-VOID invoice exists for the request; ERR_REFERENTIAL_INTEGRITY when schedule does not belong to the request's (event, responding utility); ERR_INVALID_REQUEST when billing_period_start > billing_period_end"]

  - method: GET
    path: "/mutual-aid/invoices/{id}"
    description: "Get one invoice"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/mutual-aid/invoices"
    description: "List invoices"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["request_id?", "rate_schedule_id?", "status?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/invoices/{id}/submit"
    description: "DRAFT -> SUBMITTED; computes final totals, sweeps and locks certified rows"
    roles: [RespondingFinance]
    code: 200
    input: []
    output: Invoice
    side_effects: ["final totals computed (final variant); billed_invoice_id set on swept timesheets; outstanding_cents = final_total_cents; event/request invoiced totals recomputed"]

  - method: POST
    path: "/mutual-aid/invoices/{id}/approve"
    description: "SUBMITTED -> APPROVED with segregation-of-duties against covered timesheet certifiers"
    roles: [HostFinance]
    code: 200
    input: [approver_operator_ref]
    output: Invoice
    side_effects: ["approved_by_operator_ref recorded; ERR_SEGREGATION_OF_DUTIES when approver certified any covered timesheet"]

  - method: POST
    path: "/mutual-aid/invoices/{id}/mark_paid"
    description: "APPROVED -> PAID; amount must equal outstanding_cents exactly"
    roles: [HostFinance]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["outstanding -> 0; event.total_paid_cents recomputed; request RELEASED -> CLOSED"]

  - method: POST
    path: "/mutual-aid/invoices/{id}/void"
    description: "DRAFT|SUBMITTED -> VOID; compensating action for submit (totals return to pre-submit values)"
    roles: [RespondingFinance]
    code: 200
    input: []
    output: Invoice
    side_effects: ["billed_invoice_id cleared on swept timesheets; event/request invoiced totals recomputed"]

  - method: POST
    path: "/mutual-aid/invoices/{id}/dispute"
    description: "Host disputes a SUBMITTED invoice (SUBMITTED -> DISPUTED)"
    roles: [HostFinance]
    code: 200
    input: [reason, disputed_amount_cents]
    output: Invoice
    side_effects: ["dispute fields recorded; ERR_DISPUTE_AMOUNT_INVALID when outside 1..outstanding_cents"]

  - method: POST
    path: "/mutual-aid/invoices/{id}/propose_credit"
    description: "Responding utility proposes credit (DISPUTED -> CREDIT_PROPOSED)"
    roles: [RespondingFinance]
    code: 200
    input: [credit_cents]
    output: Invoice
    side_effects: ["proposed_credit_cents recorded; ERR_CREDIT_EXCEEDS_DISPUTED when credit_cents > disputed_amount_cents"]

  - method: POST
    path: "/mutual-aid/invoices/{id}/accept_credit"
    description: "Host accepts proposed credit (CREDIT_PROPOSED -> SUBMITTED); credit applied to outstanding"
    roles: [HostFinance]
    code: 200
    input: []
    output: Invoice
    side_effects: ["applied_credit_total_cents += proposed; outstanding recomputed; dispute fields cleared"]

  - method: POST
    path: "/mutual-aid/invoices/{id}/reject_credit"
    description: "Host rejects proposed credit (CREDIT_PROPOSED -> ESCALATED)"
    roles: [HostFinance]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> ESCALATED"]

  - method: POST
    path: "/mutual-aid/invoices/{id}/arbitrate"
    description: "ProgramAdmin arbitrates an escalated dispute with a pinned credit (ESCALATED -> SUBMITTED)"
    roles: [ProgramAdmin]
    code: 200
    input: [final_credit_cents]
    output: Invoice
    side_effects: ["applied_credit_total_cents += final_credit_cents; outstanding recomputed; dispute fields cleared"]

  # --- AfterActionReport ---
  - method: POST
    path: "/mutual-aid/after-action-reports"
    description: "Host opens the event's after-action report (one per event)"
    roles: [HostCoordinator]
    code: 201
    input: [event_id, summary, "lessons_learned?"]
    output: AfterActionReport
    side_effects: ["status=DRAFTING; ERR_AAR_EXISTS when one already exists for the event"]

  - method: GET
    path: "/mutual-aid/after-action-reports/{id}"
    description: "Get one report"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: []
    output: AfterActionReport
    side_effects: []

  - method: GET
    path: "/mutual-aid/after-action-reports"
    description: "List reports"
    roles: [ProgramAdmin, HostCoordinator, RespondingCoordinator, CrewSupervisor, HostSafetyOfficer, HostFinance, RespondingFinance]
    code: 200
    input: ["event_id?", "status?"]
    output: "AfterActionReport[]"
    side_effects: []

  - method: POST
    path: "/mutual-aid/after-action-reports/{id}/submit"
    description: "DRAFTING -> SUBMITTED; computes cost-variance metrics"
    roles: [HostCoordinator]
    code: 200
    input: []
    output: AfterActionReport
    side_effects: ["total_crew_days/as_certified_total_cents/as_billed_total_cents/variance_cents computed; ERR_EVENT_NOT_FULLY_DEMOBILIZED when any crew not in {RETURNED, WITHDRAWN}"]

  - method: POST
    path: "/mutual-aid/after-action-reports/{id}/accept"
    description: "SUBMITTED -> ACCEPTED; unblocks event close"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AfterActionReport
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SCOPE_MISMATCH, http: 403, condition: "Entity-backed caller id does not match the resource's owning scope (host utility / responding utility / crew)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, empty roster/topics, start after end date, member_count out of 1..roster_size, ACTUAL claim without receipts, duplicate company_code, resubmission from COUNTERED without amended_crews" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Current state does not permit the requested transition (generic from-state violation, incl. recertify on a non-superseded pin)" }
  - { id: ERR_INVALID_AMOUNT, http: 400, condition: "Amount out of range: <= 0 where a positive amount is required" }
  - { id: ERR_EVENT_NOT_ACCEPTING_REQUESTS, http: 409, condition: "event.intake_posture is RESTRICTED or SEALED when creating an AssistanceRequest" }
  - { id: ERR_EVENT_NOT_DEMOBILIZING, http: 409, condition: "Invoice submit attempted while event is not in DEMOBILIZING" }
  - { id: ERR_EVENT_CLOSE_BLOCKED, http: 409, condition: "Event close attempted without an ACCEPTED after-action report or with invoices outside {PAID, VOID}" }
  - { id: ERR_EVENT_NOT_FULLY_DEMOBILIZED, http: 409, condition: "After-action submit attempted while any crew is outside terminal mobility {RETURNED, WITHDRAWN}" }
  - { id: ERR_SCHEDULE_WINDOW_OVERLAP, http: 409, condition: "Publishing would overlap another PUBLISHED/LOCKED schedule for the same (event, responding utility) under closed-interval (inclusive both ends) semantics" }
  - { id: ERR_SCHEDULE_NOT_PUBLISHED, http: 409, condition: "Request acceptance requires a PUBLISHED or LOCKED schedule for (event, responding utility)" }
  - { id: ERR_NO_EFFECTIVE_SCHEDULE, http: 409, condition: "Certification selector found no PUBLISHED/LOCKED schedule covering work_date" }
  - { id: ERR_STALE_SCHEDULE_VERSION, http: 412, condition: "expected_superseded_schedule_version does not match the superseded schedule's current version (OCC)" }
  - { id: ERR_SUPERSEDED_SCHEDULE, http: 409, condition: "Invoice submit covers a timesheet whose pinned schedule is SUPERSEDED; recertify first" }
  - { id: ERR_LODGING_CAPACITY_EXCEEDED, http: 409, condition: "assigned_rooms + room_count > total_rooms (equality allowed)" }
  - { id: ERR_LODGING_OVERLAP, http: 409, condition: "Same crew has a non-cancelled assignment whose half-open [check_in, check_out) interval intersects the new one" }
  - { id: ERR_CREW_NOT_CLEARED, http: 409, condition: "Crew readiness is not CLEARED_TO_WORK (safety gate on certification)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same operator on both sides of a controlled step: briefing conductor vs acknowledger, timesheet submitter vs certifier, timesheet certifier vs invoice approver" }
  - { id: ERR_DUPLICATE_TIMESHEET, http: 409, condition: "A timesheet already exists for (crew_id, work_date)" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "A per-diem claim already exists for (crew_id, claim_date)" }
  - { id: ERR_CERTIFICATION_WINDOW_CLOSED, http: 409, condition: "Certification attempted more than 14 days after work_date" }
  - { id: ERR_MOBILIZATION_DEADLINE_PASSED, http: 409, condition: "Arrival confirmation attempted after event.mobilization_deadline" }
  - { id: ERR_INVOICE_WINDOW_CLOSED, http: 409, condition: "Invoice submit attempted more than 30 days after event.demobilized_at" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "A non-DRAFT non-VOID invoice already exists for the request" }
  - { id: ERR_EMPTY_INVOICE, http: 409, condition: "Submit computed final_total_cents == 0 (nothing newly billable in the period)" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 409, condition: "mark_paid amount_cents != outstanding_cents" }
  - { id: ERR_DISPUTE_AMOUNT_INVALID, http: 409, condition: "disputed_amount_cents outside 1..outstanding_cents" }
  - { id: ERR_CREDIT_EXCEEDS_DISPUTED, http: 409, condition: "Proposed/arbitrated credit exceeds disputed_amount_cents (or is negative where positive required)" }
  - { id: ERR_AAR_EXISTS, http: 409, condition: "An after-action report already exists for the event" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 409, condition: "Cross-reference mismatch: schedule/event/utility, block/event, briefing/event, or invoice/schedule scope inconsistency" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "EEI program operator; runs the event lifecycle, arbitrates escalated disputes, accepts after-action reports, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /mutual-aid/utility-companies"
      - "POST /mutual-aid/events"
      - "POST /mutual-aid/events/{id}/activate"
      - "POST /mutual-aid/events/{id}/close"
      - "POST /mutual-aid/invoices/{id}/arbitrate"
      - "POST /mutual-aid/after-action-reports/{id}/accept"
      - "POST /mutual-aid/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: HostCoordinator
    description: "Host utility operations coordinator; owns requests, arrivals, releases, lodging, timesheet certification, per-diem approval, after-action drafting"
    identity: "entity_backed:UtilityCompany"
    exclusive_operations:
      - "POST /mutual-aid/assistance-requests, submit, cancel (scope: event.host_utility_id)"
      - "POST /mutual-aid/events/{id}/begin_demobilization"
      - "POST /mutual-aid/crews/{id}/confirm_arrival, release"
      - "POST /mutual-aid/timesheets/{id}/certify, recertify, reject"
      - "POST /mutual-aid/lodging-blocks and lodging-assignments create/cancel"
      - "POST /mutual-aid/per-diem-claims/{id}/approve, reject"
      - "POST /mutual-aid/after-action-reports create/submit"
    shared_operations: ["all GET endpoints"]

  - name: RespondingCoordinator
    description: "Responding utility coordinator; owns rate schedules, negotiation responses, crew registration/travel, per-diem claims"
    identity: "entity_backed:UtilityCompany"
    exclusive_operations:
      - "POST /mutual-aid/billing-rate-schedules create/publish (responding_utility_id := X-User-ID)"
      - "POST /mutual-aid/assistance-requests/{id}/counter, accept, decline"
      - "POST /mutual-aid/crews create, complete_return, withdraw"
      - "POST /mutual-aid/per-diem-claims create"
    shared_operations: ["all GET endpoints"]

  - name: CrewSupervisor
    description: "Supervisor of one crew; files and revises timesheets, acknowledges briefings"
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /mutual-aid/timesheets create, submit, revise (X-User-ID == crew_id)"
      - "POST /mutual-aid/safety-briefings/{id}/acknowledge (X-User-ID == briefing.crew_id)"
    shared_operations: ["all GET endpoints"]

  - name: HostSafetyOfficer
    description: "Host utility safety officer; conducts briefings and suspends crews for rule violations"
    identity: "entity_backed:UtilityCompany"
    exclusive_operations:
      - "POST /mutual-aid/safety-briefings (scope: event host)"
      - "POST /mutual-aid/crews/{id}/suspend"
    shared_operations: ["all GET endpoints"]

  - name: HostFinance
    description: "Host utility finance; locks schedules, reviews/approves/pays invoices, opens and settles disputes"
    identity: "entity_backed:UtilityCompany"
    exclusive_operations:
      - "POST /mutual-aid/billing-rate-schedules/{id}/lock"
      - "POST /mutual-aid/invoices/{id}/approve, mark_paid, dispute, accept_credit, reject_credit"
    shared_operations: ["all GET endpoints"]

  - name: RespondingFinance
    description: "Responding utility finance; drafts/submits/voids invoices, proposes credits"
    identity: "entity_backed:UtilityCompany"
    exclusive_operations:
      - "POST /mutual-aid/invoices create, submit, void"
      - "POST /mutual-aid/invoices/{id}/propose_credit"
    shared_operations: ["all GET endpoints"]




