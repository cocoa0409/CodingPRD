    instances:
      - name: contract_activation_guarded_by_faculty_compliance
        grounds:
          - state_machines.Contract.ISSUED_to_ACTIVE
          - state_machines.CourseSection.SCHEDULED_to_RUNNING
          - entities.AdjunctFaculty.fields.compliance_status
        distinguishing_aspect: |
          Entity pair Contract -> AdjunctFaculty: the Contract's ISSUED->ACTIVE
          transition (fired by the section cascade at term start) is guarded by
          the faculty's compliance_status. With compliance ONBOARDING the
          section flips RUNNING while the contract stays ISSUED — two entities'
          states diverge under one system event.
        test_recipe:
          setup:
            - "Faculty hired with degree verified but BACKGROUND_CHECK and TRAINING never verified -> compliance_status ONBOARDING"
            - "Section SCHEDULED with an ISSUED contract for this faculty"
            - "Clock advanced to term start 2026-08-24T00:00:00Z fires the section cascade"
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
