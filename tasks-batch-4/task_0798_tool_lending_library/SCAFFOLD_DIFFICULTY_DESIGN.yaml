  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: late_fee_grace_exact_boundary_no_fee
        grounds:
          - calculations.late_fee
          - state_machines.Loan.OVERDUE_to_RETURNED
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /library/loans/{id}/return: at exactly
          days_overdue==GRACE_DAYS (2), billable_days=max(0,2-2)=0 so the late fee is 0
          (the rule is strictly greater-than, not >=).
        test_recipe:
          setup:
            - "ACTIVE member; TOOL item (daily_late_fee_cents=100, loan_period_days=7); one copy; clock 2026-03-01; checked out (due 2026-03-08); clock advanced to 2026-03-10 (exactly 2 days overdue) and ops-run makes it OVERDUE."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Lee", email: "lee@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Drill2", category: "TOOL", replacement_value_cents: 12000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
