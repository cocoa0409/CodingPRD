              as_user_id: "${w1_id}"
            - call: "POST /weld-seams/${s1}/weld-log"
              payload: { welder_id: "${w2_id}", filler_lot: "E7018-A" }
              as: Welder
              as_user_id: "${w2_id}"
          assert:
            - "the first trigger call returns 409 ERR_WELDER_NOT_QUALIFIED (priority 25) because Welder.${w1_id}.qualification_status == REVOKED"
            - "after the failed call WeldSeam.${s1}.status is still FIT_READY, welded_at_utc is null and welder_id is null - the gated entity was not mutated"
            - "after the failed call ShellCourse.${course_id}.status is still FITTED and Tank.${tank_id}.construction_phase is still ERECTION_IN_PROGRESS"
            - "the second trigger call returns 200 and WeldSeam.${s1}.status == WELDED with welder_id == ${w2_id} and welded_at_utc == 2026-08-10T00:00:00Z"
            - "ShellCourse.${course_id}.status == WELDED after the second call (bubble-up: every seam is now WELDED and none is RT_ACCEPTED)"
            - "Welder.${w2_id}.last_weld_date_utc == 2026-08-10T00:00:00Z and continuity_expires_at_utc == 2027-02-06T00:00:00Z (refreshed by the production weld)"
            - "Welder.${w1_id} is untouched by both calls: qualification_status == REVOKED, last_weld_date_utc == 2026-06-01T00:00:00Z"

      - name: appurtenance_installation_gate_reads_host_course_status
        grounds:
          - validations.priority_34_ERR_HOST_COURSE_NOT_ACCEPTED
          - state_machines.Appurtenance.DESIGNED_to_INSTALLED
          - state_machines.ShellCourse.WELDED_to_RT_ACCEPTED
          - calculations.appurtenance_clearance_requirement
          - endpoints.POST_appurtenances_installation
        distinguishing_aspect: |
          Entity pair Appurtenance <- ShellCourse, and the gate is a bubble-up derived
          status rather than an input field: the host course is not written by anybody, it
          flips to RT_ACCEPTED only as a side effect of an NDE result on its last seam.
          Installation of the very same nozzle therefore fails and then succeeds with no
          change to the Appurtenance row, to the tank phase or to the acting role - only
          the referenced course's derived status moved.
        test_recipe:
          setup:
            - "A tank at ERECTION_IN_PROGRESS whose only course has one WELDED seam with an RT report still SCHEDULED, plus one DESIGNED 6-inch nozzle hosted on that course."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
