# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3335_engineered_wood_products_distribution_builder_direct_supply
# Breadth probe: claims the §1.1–§1.7 surface declares that §1.8 does not
# already exercise. Corners §1.8 covers appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: product_creation_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Product
          - endpoints.POST_/products
        distinguishing_aspect: "A product created with only the four required inputs returns 201 with specialty_flag / requires_code_report / requires_design_support false, index_premium_cents 0, version 1, and system-minted id / created_at / updated_at."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z (no set_current_utc call). Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku_code: "GLB-DF-24", product_family: "GLULAM_BEAM", species: "DOUGLAS_FIR", dimension_label: "24in" }
              as: OpsAdmin
              captures: { prod: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Product.${prod}.specialty_flag == false and requires_code_report == false and requires_design_support == false"
            - "Product.${prod}.index_premium_cents == 0"
            - "Product.${prod}.version == 1"
            - "the response data carries non-null id, created_at and updated_at, and created_at reflects the 2026-09-01 default clock"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: inventory_lot_computed_quantities_and_received_at_on_create
        claim_type: Computed Fields
        grounds:
          - entities.InventoryLot
          - endpoints.POST_/branches/{branch_id}/inventory-lots
        distinguishing_aspect: "A received lot comes back with qty_available_mbf == qty_received_mbf, qty_reserved_mbf == 0, qty_sold_mbf == 0, lot_status ON_HAND, and received_at stamped from the logical clock — none of these accept client input."
        test_recipe:
          setup:
            - "Logical clock 2026-09-02T08:00:00Z. Branch and product exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T08:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 12, unit_cost_cents_per_mbf: 50000 }
              as: BranchManager
              captures: { lot: $.data.id }
          assert:
            - "InventoryLot.${lot}.qty_available_mbf == 12 and qty_reserved_mbf == 0 and qty_sold_mbf == 0"
            - "InventoryLot.${lot}.lot_status == ON_HAND"
            - "InventoryLot.${lot}.received_at == \"2026-09-02T08:00:00Z\" (logical clock, not wall clock)"
            - "InventoryLot.${lot}.branch_id == ${br} and product_id == ${prod}"

      - name: sales_order_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/sales-orders/{order_id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 with ERR_NOT_FOUND and the error envelope shape."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /sales-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_NOT_FOUND"
            - "response_type == error and meta.api_request_id is present"

      - name: capacity_week_missing_total_capacity_rejected
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/capacity-weeks
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required total_capacity_mbf from capacity-week creation returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /capacity-weeks"
              payload: { mill_code: "MILL-ALX", week_start_date: "2026-09-07" }
              as: MillPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: product_invalid_family_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Product.fields.product_family
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "product_family PLYWOOD is outside the declared enum {I_JOIST, LVL_BEAM, GLULAM_BEAM, STRUCTURAL_PANEL} and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku_code: "PLY-CDX", product_family: "PLYWOOD", species: "SOUTHERN_PINE", dimension_label: "4x8" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: sales_orders_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/sales-orders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three DRAFT orders on one job, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count spans the whole filtered set."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch and product exist. Builder ACTIVE (limit 9000000). Job J. Three DRAFT orders created directly."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 9000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v1: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 1, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v1}" }
              as: AccountManager
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v2: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 2, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v2}" }
              as: AccountManager
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v3: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 3, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v3}" }
              as: AccountManager
          trigger:
            - call: "GET /sales-orders"
              payload: { job_id: "${job}", limit: 2, offset: 0 }
              as: AccountManager
            - call: "GET /sales-orders"
              payload: { job_id: "${job}", limit: 2, offset: 2 }
              as: AccountManager
          assert:
            - "first page returns exactly 2 orders with total_count == 3 and has_more == true"
            - "second page returns exactly 1 order with total_count == 3 and has_more == false"
            - "all returned orders have job_id == ${job} and order_status == DRAFT"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: builder_created_provisional_then_approve_activates
        claim_type: Initial State
        grounds:
          - state_machines.Builder
          - state_machines.Builder.PROVISIONAL_to_ACTIVE
        distinguishing_aspect: "A freshly created builder is PROVISIONAL with credit_limit_cents 0 and both exposures 0; an APPROVE review with a positive limit moves it to ACTIVE and sets the limit."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 5000000 }
              as: CreditManager
              captures: { cs: $.data.credit_status, lim: $.data.credit_limit_cents }
          assert:
            - "after create: Builder.${b}.credit_status == PROVISIONAL and credit_limit_cents == 0"
            - "after create: Builder.${b}.exposure_committed_cents == 0 and exposure_settled_cents == 0"
            - "after APPROVE: credit_status == ACTIVE and credit_limit_cents == 5000000"
            - "Builder.${b}.version == 2 after the review (create 1, review +1)"

      - name: cancel_from_delivered_rejected_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SalesOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DELIVERED is terminal for cancel: a delivered order rejects POST /cancel with ERR_INVALID_STATE and keeps all exposure and lot quantities unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Stocked branch; builder ACTIVE limit 5000000; job J; order of 10 mbf FIXED @ 100000 CONFIRMED then DELIVERED via completed 2026-09-10 delivery."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 5000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 20, unit_cost_cents_per_mbf: 40000 }
              as: BranchManager
              captures: { lot: $.data.id }
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 10, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
              captures: { o: $.data.id }
            - call: "POST /sales-orders/${o}/confirm"
              payload: {}
              as: AccountManager
            - call: "POST /sales-orders/${o}/deliveries"
              payload: { boom_required: false, window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: AccountManager
              captures: { d: $.data.id }
            - call: "POST /truck-shifts"
              payload: { fleet_code: "FLT-1", shift_date: "2026-09-10", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", boom_capable: true }
              as: OpsAdmin
              captures: { sh: $.data.id }
            - call: "POST /deliveries/${d}/schedule"
              payload: { truck_shift_id: "${sh}" }
              as: FleetCoordinator
            - call: "POST /deliveries/${d}/complete"
              payload: { outcome: "COMPLETED" }
              as: FleetCoordinator
          trigger:
            - call: "POST /sales-orders/${o}/cancel"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "SalesOrder.${o}.order_status == DELIVERED (unchanged)"
            - "Builder.${b}.exposure_settled_cents == 1000000 (unchanged)"
            - "InventoryLot.${lot}.qty_sold_mbf == 10 (unchanged)"

      - name: confirm_reserves_oldest_lot_first_fifo
        claim_type: Side Effect Execution
        grounds:
          - calculations.fifo_lot_reservation
          - state_machines.SalesOrder.DRAFT_to_CONFIRMED
        distinguishing_aspect: "Two lots of the same product received on different days: a confirm for 8 mbf draws entirely from the older lot L1 (reserved 8, available 2) and leaves the newer lot L2 completely untouched — the FIFO ordering is observable per lot."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. L1 10 mbf @ 50000 received 2026-09-02; L2 10 mbf @ 60000 received 2026-09-03. Builder ACTIVE; job J; DRAFT order of 8 mbf."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 5000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 10, unit_cost_cents_per_mbf: 50000 }
              as: BranchManager
              captures: { lot1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 10, unit_cost_cents_per_mbf: 60000 }
              as: BranchManager
              captures: { lot2: $.data.id }
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 8, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
              captures: { o: $.data.id }
          trigger:
            - call: "POST /sales-orders/${o}/confirm"
              payload: {}
              as: AccountManager
          assert:
            - "InventoryLot.${lot1}.qty_reserved_mbf == 8 and qty_available_mbf == 2 and lot_status == ON_HAND"
            - "InventoryLot.${lot2}.qty_reserved_mbf == 0 and qty_available_mbf == 10 (untouched)"
            - "SalesOrder.${o}.order_status == CONFIRMED and order_total_cents == 800000"

      - name: lien_release_valid_transition_then_second_release_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LienFiling.FILED_to_RELEASED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "FILED -> RELEASED succeeds and stamps released_at from the logical clock; a second release on the now-RELEASED lien is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Builder ACTIVE; job J with a delivered order (completed 2026-09-10, settled exposure 1000000). Lien filed at clock 2026-10-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 20000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 100, unit_cost_cents_per_mbf: 40000 }
              as: BranchManager
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 10, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
              captures: { o: $.data.id }
            - call: "POST /sales-orders/${o}/confirm"
              payload: {}
              as: AccountManager
            - call: "POST /sales-orders/${o}/deliveries"
              payload: { boom_required: false, window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: AccountManager
              captures: { d: $.data.id }
            - call: "POST /truck-shifts"
              payload: { fleet_code: "FLT-1", shift_date: "2026-09-10", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", boom_capable: true }
              as: OpsAdmin
              captures: { sh: $.data.id }
            - call: "POST /deliveries/${d}/schedule"
              payload: { truck_shift_id: "${sh}" }
              as: FleetCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T13:00:00Z" }
              as: OpsAdmin
            - call: "POST /deliveries/${d}/complete"
              payload: { outcome: "COMPLETED" }
              as: FleetCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: OpsAdmin
            - call: "POST /jobs/${job}/lien-filings"
              payload: {}
              as: CreditManager
              captures: { lien: $.data.id }
          trigger:
            - call: "POST /lien-filings/${lien}/release"
              payload: {}
              as: CreditManager
              captures: { lst: $.data.lien_status, rel: $.data.released_at }
            - call: "POST /lien-filings/${lien}/release"
              payload: {}
              as: CreditManager
              captures: { err: $.data.error_id }
          assert:
            - "first release: lien_status == RELEASED and released_at == \"2026-10-01T09:00:00Z\""
            - "second release: error_id == ERR_INVALID_STATE (terminal lockdown)"

      - name: takeoff_accept_from_submitted_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TakeoffRequest.QUOTED_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Accept requires QUOTED; a takeoff still in SUBMITTED (no design package yet) rejects accept with ERR_INVALID_STATE and creates no order."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Builder ACTIVE; job J; branch exists; takeoff created but never quoted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
