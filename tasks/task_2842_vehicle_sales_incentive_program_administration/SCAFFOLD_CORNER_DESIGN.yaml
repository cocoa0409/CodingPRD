          assert:
            - "${obj_status} == PROPOSED and ${acc1_month} == 2026-08 with ${acc1_entry} == ACCRUAL"
            - "${acc1_cents} == 0 and ${acc2_cents} == 0 — no VALIDATED delivery exists, so both months accrue zero; a zero accrual is still a ROW, which is why the second August call must fail"
            - "${err_rerun} == ERR_ACCRUAL_PERIOD_ALREADY_RUN (409) — the guard is the (program_id, period_month) key, not the amount"
            - "${acc2_id} != ${acc1_id} and ${acc2_month} == 2026-09: a different month on the SAME program is unaffected by the key collision"
            - "${err_month_shape} == ERR_INVALID_REQUEST (400) — period_month must match ^[0-9]{4}-(0[1-9]|1[0-2])$, so 2026-8 is not an accepted spelling of the month that was already run"
            - "${fin_status} == FINAL and ${err_refinalize} == ERR_OBJECTIVE_INVALID_STATE (409) — a different guard and a different error id from the accrual case"
            - "${obj_status_after} == FINAL and ${obj_version_after} == ${fin_version}: the refused re-finalize was inert"

      - name: list_endpoints_refuse_a_limit_outside_the_declared_one_to_one_hundred_range
        claim_type: standard_crud
        grounds:
          - response_envelope.pagination_defaults
          - endpoints.GET_programs
        distinguishing_aspect: "limit is validated against min 1 and max 100 as a shape check, so 0, 101 and a negative offset are all 400s while 1 and 100 are accepted — and omitting limit entirely yields the default of 10 rather than an unbounded page."
        test_recipe:
          setup:
            - "At least three programs exist (created by this instance) so that limit=1 genuinely truncates."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-E-PG1", name: "Page Program One", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNPG", priority_rank: 431, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { pg1: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-E-PG2", name: "Page Program Two", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNPG", priority_rank: 432, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { pg2: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-E-PG3", name: "Page Program Three", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNPG", priority_rank: 433, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { pg3: $.data.id }
          trigger:
            - call: "GET /incentives/programs"
              payload: { limit: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { err_zero: $.data.error_id }
            - call: "GET /incentives/programs"
              payload: { limit: 101 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { err_big: $.data.error_id }
            - call: "GET /incentives/programs"
              payload: { offset: -1 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { err_neg: $.data.error_id }
            - call: "GET /incentives/programs"
              payload: { limit: 1 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { one_first: "$.data[0].id" }
            - call: "GET /incentives/programs"
              payload: { limit: 100 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { hundred_first: "$.data[0].id" }
            - call: "GET /incentives/programs"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { default_first: "$.data[0].id" }
          assert:
            - "${err_zero} == ERR_INVALID_REQUEST (400) — limit has min 1, so a zero-size page is not a way to ask for the count only"
            - "${err_big} == ERR_INVALID_REQUEST (400) — limit has max 100"
            - "${err_neg} == ERR_INVALID_REQUEST (400) — offset has min 0"
            - "${one_first} == ${hundred_first} == ${default_first}: the ordering is stable across page sizes, so page 1 always starts at the same row"
            - "the limit=1 response carries exactly one element while limit=100 and the default limit=10 response each carry all three of ${pg1}, ${pg2} and ${pg3}"
            - "the wrapper reports total_count 3 and has_more true only for the limit=1 call"

  - section: errors
    instances:
      - name: every_path_lookup_reports_its_own_entity_specific_not_found_error_id
        claim_type: triggerable
        grounds:
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_OBJECTIVE_NOT_FOUND]
          - errors[ERR_DEALER_NOT_FOUND]
          - errors[ERR_DELIVERY_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_CHARGEBACK_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "From a completely empty database, seven different endpoints are called with the SAME syntactically valid UUID and each returns a DIFFERENT 404 error_id. A shared generic not-found handler — the natural implementation — fails seven assertions at once."
        test_recipe:
          setup:
            - "Empty database. Only the logical clock is set; no entity of any kind exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
          trigger:
            - call: "GET /incentives/programs/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { e_program: $.data.error_id }
            - call: "GET /incentives/objectives/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { e_objective: $.data.error_id }
            - call: "GET /incentives/dealers/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { e_dealer: $.data.error_id }
            - call: "POST /incentives/deliveries/00000000-0000-4000-8000-0000000000aa/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { e_delivery: $.data.error_id }
            - call: "GET /incentives/claims/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { e_claim: $.data.error_id }
            - call: "POST /incentives/chargebacks/00000000-0000-4000-8000-0000000000aa/recover"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { e_chargeback: $.data.error_id }
            - call: "GET /incentives/payment-batches/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { e_batch: $.data.error_id }
          assert:
            - "${e_program} == ERR_PROGRAM_NOT_FOUND, ${e_objective} == ERR_OBJECTIVE_NOT_FOUND, ${e_dealer} == ERR_DEALER_NOT_FOUND, ${e_delivery} == ERR_DELIVERY_NOT_FOUND, ${e_claim} == ERR_CLAIM_NOT_FOUND, ${e_chargeback} == ERR_CHARGEBACK_NOT_FOUND and ${e_batch} == ERR_BATCH_NOT_FOUND"
            - "all seven responses are HTTP 404 with success false and a data object holding exactly error_id and message"
            - "the seven error_ids are pairwise distinct — the id encodes WHICH entity was missing, which is what a debugging operator needs from a 404"
            - "the write endpoints among them (validate, recover) performed no partial work: the database is still empty afterwards"

      - name: a_protest_resolved_once_cannot_be_resolved_again_or_reached_through_another_objective
        claim_type: triggerable
        grounds:
          - errors[ERR_PROTEST_ALREADY_RESOLVED]
          - errors[ERR_PROTEST_NOT_FOUND]
          - state_machines.ObjectiveProtest
        distinguishing_aspect: "The nested protest id is scoped to its objective: a REAL protest id resolved under a DIFFERENT objective returns ERR_PROTEST_NOT_FOUND rather than resolving it, and a second resolve of the same protest returns ERR_PROTEST_ALREADY_RESOLVED. Treating protest_id as globally unique passes the first case and thereby corrupts another dealer's objective."
