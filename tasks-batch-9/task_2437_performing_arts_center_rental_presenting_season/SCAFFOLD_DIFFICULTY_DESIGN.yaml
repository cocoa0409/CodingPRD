                expected_engagement_version: "${eng_v_pre_risk}"
          trigger:
            - call: "POST /engagements/${engagement_id}/confirm"
              as: ProgrammingDirector
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "409 with error_id ERR_RIDER_INVALID_STATE: the engagement's own fields are all in order and only the child rider's review_status blocks the transition."
            - "GET /engagements/${engagement_id}: lifecycle_status still DRAFT, ticketing_status still TIERS_DRAFT (the confirm-side TIERS_DRAFT side effect did not run), financial_clearance CLEARED, negotiated_fee_cents 200000."
            - "GET /tech-riders/${rider_id}: review_status GAP_IDENTIFIED with capability_gaps == [\"POWER_SHORTFALL\"]; the rider is one call away from CLEARED, which proves the failure is a state guard and not a missing prerequisite."
            - "After POST /tech-riders/${rider_id}/clear (200, review_status CLEARED, additional_equipment_cost_cents 25000), retrying POST /engagements/${engagement_id}/confirm returns 200 with lifecycle_status CONFIRMED — the same request now succeeds purely because the OTHER entity moved."
            - "GET /equipment-items/${item_id}: reserved_qty == 1 throughout; the rejected confirm neither reserved nor released inventory."

      - name: fee_negotiation_accept_gated_by_engagement_financial_clearance
        differentiation: |
          CHILD gated by PARENT, and by a state DIMENSION that is orthogonal to the parent's lifecycle:
          the negotiation is perfectly acceptable on its own terms and the engagement is a perfectly
          normal DRAFT, but the engagement's independent financial_clearance dimension sits at BLOCKED.
          The sibling instance above reads down into a child; this one reads up into a parallel state
          dimension of the parent, so the two guards traverse the relationship in opposite directions.
        mechanism: "state_machines FeeNegotiation OFFERED -> ACCEPTED precondition 'engagement.financial_clearance != BLOCKED' (validation priority 80, ERR_CLEARANCE_BLOCKED); financial_risk_score PROHIBITIVE band at >= 75"
        entities_involved: [FeeNegotiation, Engagement, Artist, PriceTier]
        test_recipe:
          setup: |
            An engagement engineered to score PROHIBITIVE. Artist: historical_sell_through_pct 0.20,
            a narrow routing window of 2026-08-05 to 2026-08-20, guarantee_floor_cents 500000.
            Engagement: performance 2026-08-10T19:00Z to 22:00Z, so at the default clock
            (2026-08-01T00:00:00Z) the lead time is 9 days and the routing slack is
            min(5, 9) = 5 days. Tier: 100 seats at 5000 -> projected gross
            round(5000*100*0.20) = 100000. A single OFFERED round at exactly the 500000 floor gives a
            fee exposure of 5.0, clamped to 1.0.
            Score = 100*(0.45*1 + 0.25*(1 - 5/14) + 0.20*(1 - 9/120) + 0.10*(1 - 0.20))
                  = 100*(0.45 + 0.160714 + 0.185 + 0.08) = 87.57 -> 88 -> PROHIBITIVE -> BLOCKED.
            The negotiation is left in OFFERED, which is a perfectly valid source state for accept.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Studio Theatre"
                seat_capacity: 400
                base_facility_fee_cents: 500000
