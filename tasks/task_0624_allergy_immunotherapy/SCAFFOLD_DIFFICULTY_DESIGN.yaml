          setup_note: "wheal 10 control 3 -> index 7 -> clinical_composite 7 -> HIGH -> starting_vial_color GREEN; the GREEN vial satisfies activation. The trigger shot draws from the SILVER vial (same plan, so no plan-mismatch), whose 0.05 mL is below the GREEN-step1 0.10 mL draw (fiscal violation) AND whose SILVER color demands epinephrine_on_file (safety violation). Both vials belong to this plan."
