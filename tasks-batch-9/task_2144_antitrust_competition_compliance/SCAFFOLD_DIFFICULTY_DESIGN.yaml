      - name: leniency_marker_and_disclosure_dimensions_advance_independently
        grounds:
          - state_machines.LeniencyApplication.DISCLOSURE_DRAFT_to_DISCLOSURE_SUBMITTED
          - state_machines.LeniencyApplication.MARKER_REQUESTED_to_MARKER_GRANTED
          - state_machines.LeniencyApplication.DISCLOSURE_SUBMITTED_to_DISCLOSURE_ACCEPTED
          - state_machines.LeniencyApplication.MARKER_GRANTED_to_PERFECTED
          - calculations.leniency_penalty_estimate
        distinguishing_aspect: |
          PARALLEL state dimensions on ONE LeniencyApplication row: the
          disclosure advances DRAFT -> SUBMITTED while marker_status is still
          only MARKER_REQUESTED, and the penalty estimate at that instant is
          864000013 (rank null, zero reduction); the marker then advances
          independently to MARKER_GRANTED, re-pricing the estimate to 0 at
          rank 1; the two dimensions meet exactly once, at PERFECTED.
        test_recipe:
          setup:
            - "One BusinessUnit with an ACTIVE BASELINE RiskAssessment of 70.00 -> band HIGH."
            - "One LeniencyApplication on cartel_code EU-ADHES-2022 with three affected years, marker_status MARKER_REQUESTED, disclosure_status DRAFT."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Adhesives Z", market_code: "EU-ADHES", market_share_bps: 5000, interaction_point_count: 0, competitor_overlap_pct: 0, exposure_budget_points: 100, review_minutes_budget: 480 }
