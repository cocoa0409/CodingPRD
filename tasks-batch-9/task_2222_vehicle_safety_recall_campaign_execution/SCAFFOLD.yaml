scenario: |
  2222. Vehicle Safety Recall Campaign Execution (automaker recall campaign office): defect determination, remedy development and recall decision with regulatory filing deadlines, affected vehicle identification by build records with production date and part number ranges, owner notification mailing waves timed to remedy parts availability, interim notice when a remedy is not yet available with stop-sale and do-not-drive advisories, dealer parts allocation, labor operation codes and reimbursement rates, completion rate tracking with follow-up mailings and outreach to unresponsive owners, owner reimbursement for pre-recall repairs, quarterly completion reporting and remedy effectiveness monitoring

domain_name: "vehicle-safety-recall-campaigns"
api_prefix: ""   # flat top-level collections: /recall-campaigns, /vehicles, /affected-vehicles, /repair-claims, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer collections joined by explicit FK fields; no deep URL nesting except
  # campaign-scoped creation/sub-resource reads.

  state_machine_shape: branching
  # RecallCampaign carries two INDEPENDENT dimensions (campaign_status x remedy_status)
  # and remedy_status itself cycles REMEDY_RELEASED -> REMEDY_REVISED -> REMEDY_RELEASED;
  # NotificationWave forks PLANNED -> {RELEASE_APPROVED, CANCELLED};
  # RepairClaim forks SUBMITTED -> {APPROVED, REJECTED} with APPROVED -> REVERSED compensation;
  # OwnerReimbursementRequest cycles SUBMITTED <-> DOCUMENTS_REQUESTED (bounded rounds);
  # AffectedVehicle cycles REMEDIED -> UNREPAIRED and UNREACHABLE -> SCHEDULED.

  relationship_patterns:
    - one_to_many          # RecallCampaign -> population rules / waves / parts / labor ops / filings
    - many_to_many         # AffectedVehicle joins RecallCampaign x Vehicle; PartsAllocation joins RemedyPart x Dealer
    - self_referential     # RecallCampaign.supersedes_campaign_id -> RecallCampaign.id
    - cross_aggregate      # RepairClaim spans AffectedVehicle, Dealer, LaborOperation, PartsAllocation

  role_model: segregation_of_duties
  # The user who recorded the defect determination may not file the Part 573 defect
  # notice; the user who released the remedy may not close the campaign.

  consistency_model: immediate
  difficulty_level: expert_plus   # above the Expert band of SKILL.md 0.4: 13 entities, 50 endpoints, 8 calculations, 6 state machines

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RecallCampaign
    parent: null
    common_fields: true
    fields:
      - name: campaign_number
        type: string
        source: input
        description: NHTSA-style campaign identifier, unique across all campaigns
        constraints: "matches ^[0-9]{2}V-[0-9]{3}$; unique"
      - name: defect_type
        type: enum
        source: input
        description: whether the campaign is a safety defect or a standards noncompliance
        constraints: "SAFETY_DEFECT | NONCOMPLIANCE"
      - name: defect_description
        type: string
        source: input
        description: engineering description of the defect and its safety consequence
        constraints: "1..2000 chars"
      - name: risk_severity
        type: enum
        source: input
        description: severity band that selects the parts-coverage gate for wave release
        default: MODERATE
        constraints: "HIGH | MODERATE | LOW"
      - name: campaign_status
        type: enum
        source: system
        description: regulatory/administrative dimension of the campaign lifecycle
        default: DRAFT
        constraints: "DRAFT | DEFECT_DETERMINED | FILED | INTERIM_NOTIFIED | OWNER_NOTIFIED | MONITORING | CLOSED | SUPERSEDED"
      - name: remedy_status
        type: enum
        source: system
        description: remedy-engineering dimension, evolving independently of campaign_status
        default: REMEDY_UNDER_DEVELOPMENT
        constraints: "REMEDY_UNDER_DEVELOPMENT | INTERIM_ONLY | REMEDY_RELEASED | REMEDY_REVISED"
      - name: supersedes_campaign_id
        type: string
        source: input
        description: "FK -> RecallCampaign.id; the earlier campaign this campaign replaces; null when the campaign stands alone"
        default: null
      - name: defect_determination_date
        type: datetime
        source: input
        description: instant the safety committee determined the defect exists; starts the filing clock
        default: null
      - name: filing_deadline_utc
        type: datetime
        source: computed
        description: latest instant at which the DEFECT_NOTICE filing is timely (calculation filing_deadline)
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant the DEFECT_NOTICE filing was accepted
        default: null
      - name: days_late
        type: integer
        source: computed
        description: whole days by which filed_at exceeded filing_deadline_utc; 0 when timely
        default: 0
      - name: late_filing_flag
        type: boolean
        source: computed
        description: true when filed_at is strictly after filing_deadline_utc
        default: false
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the SafetyEngineer who recorded the defect determination
        default: null
      - name: remedy_released_by_user_id
        type: string
        source: system
        description: X-User-ID of the SafetyEngineer who most recently released a remedy
        default: null
      - name: remedy_released_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent remedy release
        default: null
      - name: remedy_revision_count
        type: integer
        source: system
        description: number of times the remedy has been forced back into revision
        default: 0
      - name: stop_sale_flag
        type: boolean
        source: system
        description: true while a stop-sale advisory is in force
        default: false
      - name: do_not_drive_flag
        type: boolean
        source: system
        description: true while a do-not-drive advisory is in force; enables towing allowance
        default: false
      - name: affected_vehicle_count
        type: integer
        source: computed
        description: total AffectedVehicle rows for this campaign in any remedy_status
        default: 0
      - name: recall_population_count
        type: integer
        source: computed
        description: affected_vehicle_count minus REMOVED_FROM_POPULATION rows (regulatory denominator)
        default: 0
      - name: remedied_count
        type: integer
        source: computed
        description: AffectedVehicle rows in remedy_status REMEDIED
        default: 0
      - name: completion_rate_pct
        type: number
        source: computed
        description: REGULATORY variant of calculation completion_rate, 2 decimal places
        default: 0.00
      - name: remedy_effectiveness_score
        type: number
        source: computed
        description: output of calculation remedy_effectiveness_score, 0.00..100.00
        default: 100.00
      - name: reimbursement_obligation_cents
        type: integer
        source: computed
        description: conserved money ledger; sum of APPROVED RepairClaim.final_amount_cents plus APPROVED OwnerReimbursementRequest.approved_amount_cents
        default: 0
      - name: quarterly_filing_count
        type: integer
        source: system
        description: number of QUARTERLY RegulatoryFiling rows accepted for this campaign
        default: 0
      - name: open_followup_wave_count
        type: integer
        source: computed
        description: NotificationWave rows with wave_type FOLLOW_UP and status in {PLANNED, RELEASE_APPROVED}
        default: 0
      - name: closure_note
        type: string
        source: input
        description: closure justification recorded when the campaign is closed
        default: null

  - name: VehiclePopulationRule
    parent: RecallCampaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: system
        description: "FK -> RecallCampaign.id; campaign whose population this rule shapes"
      - name: inclusion_mode
        type: enum
        source: input
        description: whether the rule adds build records to the population or carves them out
        constraints: "INCLUDE | EXCLUDE"
      - name: plant_code
        type: string
        source: input
        description: assembly plant code the rule matches exactly
        constraints: "1..8 chars"
      - name: model_code
        type: string
        source: input
        description: model code the rule matches exactly
        constraints: "1..8 chars"
      - name: model_year
        type: integer
        source: input
        description: model year the rule matches exactly
        constraints: "1980..2100"
      - name: production_start_date
        type: string
        source: input
        description: INCLUSIVE lower bound of the build window (date, YYYY-MM-DD)
      - name: production_end_date
        type: string
        source: input
        description: EXCLUSIVE upper bound of the build window (date, YYYY-MM-DD)
      - name: part_number_low
        type: integer
        source: input
        description: INCLUSIVE lower bound of the suspect part sequence range
      - name: part_number_high
        type: integer
        source: input
        description: INCLUSIVE upper bound of the suspect part sequence range
      - name: matched_vehicle_count
        type: integer
        source: computed
        description: AffectedVehicle rows currently attributed to this rule
        default: 0

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: vehicle identification number, unique across build records
        constraints: "17 chars; unique"
      - name: plant_code
        type: string
        source: input
        description: assembly plant that built the vehicle
      - name: model_code
        type: string
        source: input
        description: model code of the build record
      - name: model_year
        type: integer
        source: input
        description: model year of the build record
      - name: production_date
        type: string
        source: input
        description: build date (date, YYYY-MM-DD) compared against population windows
      - name: suspect_part_number
        type: integer
        source: input
        description: sequence number of the installed suspect part
      - name: in_service_date
        type: string
        source: input
        description: retail delivery date (date, YYYY-MM-DD)
        default: null
      - name: region_code
        type: enum
        source: input
        description: owner-address region used for wave targeting and dealer matching
        constraints: "NE | SE | MW | WE"
      - name: sale_status
        type: enum
        source: input
        description: disposition of the vehicle; EXPORTED and SCRAPPED leave the recall population
        default: SOLD
        constraints: "IN_DEALER_STOCK | SOLD | EXPORTED | SCRAPPED"
      - name: owner_name
        type: string
        source: input
        description: registered owner of record used for mailings
        default: null
      - name: owner_address_valid
        type: boolean
        source: input
        description: false once mail is returned undeliverable
        default: true
      - name: stop_sale_hold
        type: boolean
        source: system
        description: true while the vehicle is held from retail delivery by a stop-sale advisory
        default: false

  - name: AffectedVehicle
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: system
        description: "FK -> RecallCampaign.id; campaign the vehicle is affected by"
      - name: vehicle_id
        type: string
        source: system
        description: "FK -> Vehicle.id; build record matched into the population"
      - name: matched_by_rule_id
        type: string
        source: system
        description: "FK -> VehiclePopulationRule.id; INCLUDE rule credited with the match"
      - name: notification_wave_id
        type: string
        source: system
        description: "FK -> NotificationWave.id; wave that most recently mailed this owner; null before first mailing"
        default: null
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; dealer holding the repair appointment; null when unscheduled"
        default: null
      - name: remedy_status
        type: enum
        source: system
        description: per-vehicle remedy progress
        default: UNREPAIRED
        constraints: "UNREPAIRED | SCHEDULED | REMEDIED | UNREACHABLE | REMOVED_FROM_POPULATION"
      - name: notice_count
        type: integer
        source: computed
        description: number of mailings this owner has received across all waves
        default: 0
      - name: last_notice_type
        type: enum
        source: system
        description: wave_type of the most recent mailing; null before first mailing
        default: null
        constraints: "INTERIM | REMEDY | FOLLOW_UP"
      - name: last_notice_date
        type: datetime
        source: system
        description: logical-clock instant of the most recent mailing
        default: null
      - name: scheduled_repair_date
        type: string
        source: input
        description: appointment date (date, YYYY-MM-DD) set when the owner schedules
        default: null
      - name: approved_claim_count
        type: integer
        source: computed
        description: number of RepairClaim rows for this row currently in status APPROVED
        default: 0
      - name: requires_renotification
        type: boolean
        source: system
        description: true after a remedy revision knocks a REMEDIED row back to UNREPAIRED
        default: false
      - name: outreach_attempt_count
        type: integer
        source: computed
        description: number of OutreachAttempt rows recorded for this row
        default: 0

  - name: NotificationWave
    parent: RecallCampaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: system
        description: "FK -> RecallCampaign.id; campaign the mailing wave belongs to"
      - name: wave_type
        type: enum
        source: input
        description: interim advisory mailing, remedy-available mailing, or follow-up to non-responders
        constraints: "INTERIM | REMEDY | FOLLOW_UP"
      - name: target_region_code
        type: enum
        source: input
        description: owner region this wave mails to
        constraints: "NE | SE | MW | WE"
      - name: scheduled_mail_date
        type: string
        source: input
        description: planned drop date (date, YYYY-MM-DD); mailing is blocked before this date
      - name: sequence_number
        type: integer
        source: computed
        description: 1 + count of non-CANCELLED sibling waves ordered by (scheduled_mail_date ASC, created_at ASC)
        default: 1
      - name: status
        type: enum
        source: system
        description: wave lifecycle state
        default: PLANNED
        constraints: "PLANNED | RELEASE_APPROVED | MAILED | CANCELLED"
      - name: eligible_vehicle_count
        type: integer
        source: computed
        description: candidate set size pinned at release time (calculation wave_release_quota step 1)
        default: 0
      - name: parts_capacity_qty
        type: integer
        source: computed
        description: uncommitted parts units reachable by this region, pinned at release time (step 2)
        default: 0
      - name: provisional_coverage_ratio
        type: number
        source: computed
        description: parts_capacity_qty / eligible_vehicle_count, 4 decimals; the value the release gate compares
        default: 0.0000
      - name: coverage_tier_factor
        type: number
        source: computed
        description: tier factor selected from provisional_coverage_ratio (1.00 | 0.75 | 0.40 | 0.00)
        default: 0.00
      - name: planned_vehicle_count
        type: integer
        source: computed
        description: floor(eligible_vehicle_count * coverage_tier_factor); number of owners this wave will mail
        default: 0
      - name: parts_coverage_ratio
        type: number
        source: computed
        description: parts_capacity_qty / planned_vehicle_count, 4 decimals; reported coverage, NOT the gate input
        default: 0.0000
      - name: mailed_vehicle_count
        type: integer
        source: computed
        description: AffectedVehicle rows actually stamped by this wave at mailing time
        default: 0
      - name: actual_mail_date
        type: datetime
        source: system
        description: logical-clock instant the wave was mailed
        default: null
      - name: auto_created
        type: boolean
        source: system
        description: true when the wave was synthesized by a completion-rate cascade rather than by an operator
        default: false
      - name: cancel_reason
        type: string
        source: input
        description: reason recorded when the wave is cancelled
        default: null

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - name: dealer_code
        type: string
        source: input
        description: franchise dealer code, unique
        constraints: "unique; 1..16 chars"
      - name: name
        type: string
        source: input
        description: dealership name
      - name: region_code
        type: enum
        source: input
        description: region the dealer serves; must equal a wave target region to contribute parts capacity
        constraints: "NE | SE | MW | WE"
      - name: labor_rate_per_hour
        type: number
        source: input
        description: posted door rate in USD used by the PROVISIONAL claim variant
        constraints: "> 0; 2 decimal places"
      - name: monthly_repair_capacity
        type: integer
        source: input
        description: maximum recall repairs the dealer can perform per month; caps parts allocation
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: dealer participation state
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: suspension_reason
        type: string
        source: input
        description: reason recorded when the dealer is suspended
        default: null

  - name: RemedyPart
    parent: RecallCampaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: system
        description: "FK -> RecallCampaign.id; campaign the remedy part belongs to"
      - name: part_number
        type: string
        source: input
        description: service part number of the remedy kit
      - name: unit_cost
        type: number
        source: input
        description: dealer net cost per kit in USD, 2 decimal places
        constraints: "> 0"
      - name: total_procured_qty
        type: integer
        source: input
        description: total physical units procured for the campaign; the conserved quantity
        constraints: ">= 0"
      - name: unallocated_qty
        type: integer
        source: computed
        description: units not currently held by any ALLOCATED PartsAllocation and not yet consumed
        default: 0
      - name: consumed_qty
        type: integer
        source: computed
        description: units burned by APPROVED repair claims across all allocations
        default: 0
      - name: lead_time_days
        type: integer
        source: input
        description: supplier lead time in days, recorded for planning
        default: 30

  - name: PartsAllocation
    parent: null
    common_fields: true
    fields:
      - name: remedy_part_id
        type: string
        source: system
        description: "FK -> RemedyPart.id; part pool the units come from"
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; dealer receiving the units"
      - name: campaign_id
        type: string
        source: computed
        description: "FK -> RecallCampaign.id; denormalized from RemedyPart.campaign_id"
      - name: requested_qty
        type: integer
        source: input
        description: units the operator asked for
        constraints: ">= 1"
      - name: allocated_qty
        type: integer
        source: computed
        description: units actually granted by calculation parts_allocation_grant
        default: 0
      - name: consumed_qty
        type: integer
        source: computed
        description: units of this allocation burned by APPROVED repair claims
        default: 0
      - name: status
        type: enum
        source: system
        description: allocation lifecycle state
        default: ALLOCATED
        constraints: "ALLOCATED | REVOKED"
      - name: partially_granted
        type: boolean
        source: computed
        description: true when allocated_qty < requested_qty
        default: false
      - name: revoked_reason
        type: enum
        source: system
        description: why the allocation was revoked; null while ALLOCATED
        default: null
        constraints: "SUPERSEDED | MANUAL | CAMPAIGN_SUPERSEDED | REMEDY_REVISED"

  - name: LaborOperation
    parent: RecallCampaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: system
        description: "FK -> RecallCampaign.id; campaign the labor operation code belongs to"
      - name: labor_op_code
        type: string
        source: input
        description: labor operation code dealers claim against
      - name: description
        type: string
        source: input
        description: what the labor operation covers
      - name: flat_hours
        type: number
        source: input
        description: published flat-rate hours, 2 decimal places; caps audited claim hours
        constraints: "> 0"
      - name: rate_type
        type: enum
        source: input
        description: whether the code reimburses at warranty rate or prevailing rate
        constraints: "WARRANTY | PREVAILING"
      - name: effective_from
        type: string
        source: input
        description: INCLUSIVE first date the code may be claimed (date, YYYY-MM-DD)
      - name: effective_to
        type: string
        source: input
        description: INCLUSIVE last date the code may be claimed (date, YYYY-MM-DD)
      - name: claim_count
        type: integer
        source: computed
        description: RepairClaim rows referencing this code in status SUBMITTED or APPROVED
        default: 0

  - name: RepairClaim
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: computed
        description: "FK -> RecallCampaign.id; denormalized from the AffectedVehicle row"
      - name: affected_vehicle_id
        type: string
        source: input
        description: "FK -> AffectedVehicle.id; population row the repair closes"
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; dealer that performed the repair"
      - name: labor_operation_id
        type: string
        source: input
        description: "FK -> LaborOperation.id; code claimed"
      - name: parts_allocation_id
        type: string
        source: computed
        description: "FK -> PartsAllocation.id; allocation the consumed unit is drawn from, chosen by calculation parts_allocation_pick"
        default: null
      - name: repair_date
        type: string
        source: input
        description: date the repair was performed (date, YYYY-MM-DD)
      - name: claimed_labor_hours
        type: number
        source: input
        description: hours the dealer claims, 2 decimal places
        constraints: "> 0"
      - name: parts_used_qty
        type: integer
        source: input
        description: kits the dealer reports consuming
        constraints: ">= 1"
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: PROVISIONAL variant of calculation claim_reimbursement, in cents, pinned at submission
        default: 0
      - name: final_amount_cents
        type: integer
        source: computed
        description: FINAL variant of calculation claim_reimbursement, in cents, pinned at audit approval
        default: null
      - name: is_repeat_repair
        type: boolean
        source: computed
        description: true when the AffectedVehicle already had at least one APPROVED claim when this claim was submitted
        default: false
      - name: status
        type: enum
        source: system
        description: claim lifecycle state
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REJECTED | REVERSED"
      - name: audit_note
        type: string
        source: input
        description: auditor note recorded at approval or rejection
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: reason recorded when an approved claim is reversed
        default: null

  - name: OwnerReimbursementRequest
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> RecallCampaign.id; campaign the pre-recall repair relates to"
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; vehicle the owner paid to repair"
      - name: labor_operation_id
        type: string
        source: computed
        description: "FK -> LaborOperation.id; campaign labor operation whose closed effective window contains invoice_date"
        default: null
      - name: invoice_date
        type: string
        source: input
        description: date on the owner's paid invoice (date, YYYY-MM-DD)
      - name: invoice_amount
        type: number
        source: input
        description: total the owner paid in USD, 2 decimal places
        constraints: "> 0"
      - name: parts_amount
        type: number
        source: input
        description: parts portion of the invoice in USD
        default: 0.00
      - name: labor_hours_claimed
        type: number
        source: input
        description: labor hours shown on the invoice
        constraints: "> 0"
      - name: towing_amount
        type: number
        source: input
        description: towing charge on the invoice in USD
        default: 0.00
      - name: documentation_complete
        type: boolean
        source: input
        description: whether the intake packet was complete
        default: true
      - name: document_round
        type: integer
        source: system
        description: how many document-request rounds have been opened; capped at 2
        default: 0
      - name: approved_amount_cents
        type: integer
        source: computed
        description: output of calculation owner_reimbursement_amount in cents, pinned at adjudication
        default: null
      - name: status
        type: enum
        source: system
        description: reimbursement request lifecycle state
        default: SUBMITTED
        constraints: "SUBMITTED | DOCUMENTS_REQUESTED | APPROVED | DENIED"
      - name: requested_items
        type: string
        source: input
        description: documents the auditor asked the owner for
        default: null
      - name: denial_reason
        type: string
        source: input
        description: reason recorded when the request is denied
        default: null

  - name: OutreachAttempt
    parent: AffectedVehicle
    common_fields: false
    fields:
      - name: affected_vehicle_id
        type: string
        source: system
        description: "FK -> AffectedVehicle.id; population row the outreach targets"
      - name: channel
        type: enum
        source: input
        description: contact channel used
        constraints: "MAIL | PHONE | EMAIL | CANVASS"
      - name: outcome
        type: enum
        source: input
        description: result of the attempt
        constraints: "NO_RESPONSE | BAD_ADDRESS | SCHEDULED | OWNER_REFUSED"
      - name: attempt_number
        type: integer
        source: computed
        description: 1 + count of prior OutreachAttempt rows for the same affected_vehicle_id
        default: 1
      - name: attempted_at
        type: datetime
        source: system
        description: logical-clock instant of the attempt
      - name: note
        type: string
        source: input
        description: free-text note
        default: null

  - name: RegulatoryFiling
    parent: RecallCampaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: system
        description: "FK -> RecallCampaign.id; campaign being reported on"
      - name: filing_type
        type: enum
        source: input
        description: Part 573 defect notice, quarterly completion report, or amendment of a quarterly report
        constraints: "DEFECT_NOTICE | QUARTERLY | AMENDMENT"
      - name: report_period
        type: string
        source: input
        description: reporting quarter label such as 2026Q3; required for QUARTERLY and AMENDMENT
        default: null
        constraints: "matches ^[0-9]{4}Q[1-4]$"
      - name: narrative
        type: string
        source: input
        description: filing narrative text
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant the filing was accepted
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who filed
      - name: days_late
        type: integer
        source: computed
        description: for DEFECT_NOTICE filings, whole days past filing_deadline_utc; 0 otherwise
        default: 0
      - name: completion_rate_snapshot_pct
        type: number
        source: computed
        description: REGULATORY completion rate frozen onto the filing at acceptance
        default: null
      - name: remedied_count_snapshot
        type: integer
        source: computed
        description: REMEDIED count frozen onto the filing at acceptance
        default: null
      - name: recall_population_snapshot
        type: integer
        source: computed
        description: recall_population_count frozen onto the filing at acceptance
        default: null
      - name: effectiveness_score_snapshot
        type: number
        source: computed
        description: remedy_effectiveness_score frozen onto the filing at acceptance
        default: null
      - name: amendment_required
        type: boolean
        source: system
        description: true when a post-filing cascade invalidated the frozen snapshot
        default: false
      - name: status
        type: enum
        source: system
        description: filing state; AMENDED once a later AMENDMENT filing supersedes it
        default: SUBMITTED
        constraints: "SUBMITTED | AMENDED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- RecallCampaign: two independent dimensions on one row -----------------
  - entity: RecallCampaign
    dimension: campaign_status
    initial_state: DRAFT
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: DEFECT_DETERMINED
        trigger: "POST /recall-campaigns/{id}/defect-determination"
        actor: SafetyEngineer
        preconditions:
          - "campaign_status == DRAFT"
          - "defect_determination_date is a valid ISO 8601 UTC instant"
        side_effects:
          - "defect_determination_date stored; risk_severity overwritten when supplied"
          - "filing_deadline_utc = calculation filing_deadline(defect_determination_date)"
          - "determined_by_user_id = X-User-ID of the caller"
          - "version incremented by 1"
      - from: DEFECT_DETERMINED
        to: FILED
        trigger: "POST /recall-campaigns/{id}/filings with filing_type DEFECT_NOTICE"
        actor: ComplianceOfficer
        preconditions:
          - "campaign_status == DEFECT_DETERMINED"
          - "X-User-ID != determined_by_user_id (segregation of duties)"
          - "no existing RegulatoryFiling with filing_type DEFECT_NOTICE for this campaign"
        side_effects:
          - "RegulatoryFiling created in status SUBMITTED with filed_at = current logical clock"
          - "campaign.filed_at = filing.filed_at; days_late and late_filing_flag = calculation filing_deadline outputs"
          - "filing.days_late = campaign.days_late"
          - "completion/effectiveness snapshots frozen onto the filing"
          - "version incremented by 1"
      - from: FILED
        to: INTERIM_NOTIFIED
        trigger: "POST /recall-campaigns/{id}/interim-advisory"
        actor: SafetyEngineer
        preconditions:
          - "campaign_status == FILED"
          - "remedy_status == REMEDY_UNDER_DEVELOPMENT (an interim notice is only lawful while no remedy exists)"
        side_effects:
          - "remedy_status REMEDY_UNDER_DEVELOPMENT -> INTERIM_ONLY (parallel dimension advances in the same request)"
          - "stop_sale_flag and do_not_drive_flag set from the request body"
          - "when stop_sale is true: every Vehicle with sale_status == IN_DEALER_STOCK that has an AffectedVehicle row for this campaign gets stop_sale_hold = true"
          - "version incremented by 1"
      - from: FILED
        to: OWNER_NOTIFIED
        trigger: "POST /notification-waves/{id}/mail for a REMEDY or FOLLOW_UP wave of this campaign"
        actor: RecallOperationsManager
        preconditions:
          - "campaign_status == FILED"
          - "wave.status == RELEASE_APPROVED"
        side_effects:
          - "campaign_status -> OWNER_NOTIFIED (branch that skips the interim notice when the remedy shipped first)"
          - "version incremented by 1"
        note: "Diamond join: FILED reaches OWNER_NOTIFIED either directly or through INTERIM_NOTIFIED."
      - from: INTERIM_NOTIFIED
        to: OWNER_NOTIFIED
        trigger: "POST /notification-waves/{id}/mail for a REMEDY or FOLLOW_UP wave of this campaign"
        actor: RecallOperationsManager
        preconditions:
          - "campaign_status == INTERIM_NOTIFIED"
          - "wave.status == RELEASE_APPROVED"
        side_effects:
          - "campaign_status -> OWNER_NOTIFIED"
          - "version incremented by 1"
      - from: OWNER_NOTIFIED
        to: MONITORING
        trigger: "POST /recall-campaigns/{id}/filings with filing_type QUARTERLY"
        actor: ComplianceOfficer
        preconditions:
          - "campaign_status == OWNER_NOTIFIED"
          - "no existing RegulatoryFiling with the same report_period for this campaign"
        side_effects:
          - "quarterly_filing_count incremented by 1"
          - "remedy_effectiveness_score recomputed, then frozen onto the filing"
          - "when the recomputed score < REMEDY_EFFECTIVENESS_MIN the remedy_status dimension takes REMEDY_RELEASED -> REMEDY_REVISED (cascade B link 1)"
          - "version incremented by 1"
      - from: MONITORING
        to: MONITORING
        trigger: "POST /recall-campaigns/{id}/filings with filing_type QUARTERLY (subsequent quarters)"
        actor: ComplianceOfficer
        preconditions:
          - "campaign_status == MONITORING"
          - "no existing RegulatoryFiling with the same report_period for this campaign"
        side_effects:
          - "quarterly_filing_count incremented by 1"
          - "remedy_effectiveness_score recomputed and frozen onto the filing"
          - "when the recomputed score < REMEDY_EFFECTIVENESS_MIN the remedy_status dimension takes REMEDY_RELEASED -> REMEDY_REVISED (cascade B link 1)"
          - "version incremented by 1"
        note: "Self-loop: quarterly reporting repeats without leaving MONITORING."
      - from: MONITORING
        to: CLOSED
        trigger: "POST /recall-campaigns/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "campaign_status == MONITORING"
          - "remedy_status == REMEDY_RELEASED"
          - "completion_rate_pct >= CLOSURE_COMPLETION_MIN (95.00)"
          - "remedy_effectiveness_score >= REMEDY_EFFECTIVENESS_MIN (70.00)"
          - "quarterly_filing_count >= CLOSURE_QUARTERLY_FILINGS_MIN (2)"
          - "no NotificationWave for this campaign in status PLANNED or RELEASE_APPROVED"
          - "X-User-ID != remedy_released_by_user_id (segregation of duties)"
        side_effects:
          - "closure_note stored"
          - "version incremented by 1"
      - from: DEFECT_DETERMINED
        to: SUPERSEDED
        trigger: "POST /recall-campaigns with supersedes_campaign_id pointing at this campaign"
        actor: SafetyEngineer
        preconditions:
          - "campaign_status NOT IN {CLOSED, SUPERSEDED}"
        side_effects:
          - "every NotificationWave of this campaign in status PLANNED or RELEASE_APPROVED -> CANCELLED with cancel_reason 'CAMPAIGN_SUPERSEDED'"
          - "every PartsAllocation of this campaign in status ALLOCATED -> REVOKED with revoked_reason CAMPAIGN_SUPERSEDED; (allocated_qty - consumed_qty) returned to RemedyPart.unallocated_qty; RemedyPart.version incremented by 1"
          - "version incremented by 1"
        note: "Same transition applies from FILED, INTERIM_NOTIFIED, OWNER_NOTIFIED and MONITORING; only DRAFT, CLOSED and SUPERSEDED are refused (ERR_SUPERSEDED_CAMPAIGN_INVALID)."

  - entity: RecallCampaign
    dimension: remedy_status
    initial_state: REMEDY_UNDER_DEVELOPMENT
    terminal_states: []
    transitions:
      - from: REMEDY_UNDER_DEVELOPMENT
        to: INTERIM_ONLY
        trigger: "POST /recall-campaigns/{id}/interim-advisory"
        actor: SafetyEngineer
        preconditions:
          - "remedy_status == REMEDY_UNDER_DEVELOPMENT"
          - "campaign_status == FILED"
        side_effects:
          - "advisory flags set; campaign_status dimension advances FILED -> INTERIM_NOTIFIED in the same request"
      - from: REMEDY_UNDER_DEVELOPMENT
        to: REMEDY_RELEASED
        trigger: "POST /recall-campaigns/{id}/remedy-releases"
        actor: SafetyEngineer
        preconditions:
          - "campaign_status IN {DEFECT_DETERMINED, FILED, INTERIM_NOTIFIED, OWNER_NOTIFIED, MONITORING}"
          - "expected_campaign_version == campaign.version"
          - "labor_operation_id references a LaborOperation of this campaign"
        side_effects:
          - "remedy_released_at = current logical clock; remedy_released_by_user_id = X-User-ID"
          - "stop_sale_flag = false; every Vehicle with stop_sale_hold == true in this campaign's population gets stop_sale_hold = false"
          - "version incremented by 1"
      - from: INTERIM_ONLY
        to: REMEDY_RELEASED
        trigger: "POST /recall-campaigns/{id}/remedy-releases"
        actor: SafetyEngineer
        preconditions:
          - "campaign_status IN {INTERIM_NOTIFIED, OWNER_NOTIFIED, MONITORING}"
          - "expected_campaign_version == campaign.version"
        side_effects:
          - "remedy_released_at and remedy_released_by_user_id set"
          - "stop_sale_flag = false and stop_sale_hold cleared on the population's IN_DEALER_STOCK vehicles"
          - "do_not_drive_flag unchanged (a do-not-drive advisory survives until the campaign is closed)"
          - "version incremented by 1"
      - from: REMEDY_RELEASED
        to: REMEDY_REVISED
        trigger: "system: remedy_effectiveness_score < REMEDY_EFFECTIVENESS_MIN evaluated during POST /recall-campaigns/{id}/filings with filing_type QUARTERLY"
        actor: system
        preconditions:
          - "remedy_status == REMEDY_RELEASED"
          - "recomputed remedy_effectiveness_score < 70.00 (strict)"
        side_effects:
          - "remedy_revision_count incremented by 1"
          - "cascade B link 2: every AffectedVehicle of this campaign in remedy_status REMEDIED -> UNREPAIRED with requires_renotification = true"
          - "cascade B link 3, caused by link 2: remedied_count, completion_rate_pct and recall_population_count recomputed; the QUARTERLY filing just created gets amendment_required = true"
          - "every PartsAllocation of this campaign in status ALLOCATED -> REVOKED with revoked_reason REMEDY_REVISED; (allocated_qty - consumed_qty) returned to RemedyPart.unallocated_qty"
          - "version incremented by 1"
      - from: REMEDY_REVISED
        to: REMEDY_RELEASED
        trigger: "POST /recall-campaigns/{id}/remedy-releases with revision_reason"
        actor: SafetyEngineer
        preconditions:
          - "remedy_status == REMEDY_REVISED"
          - "revision_reason present"
          - "expected_campaign_version == campaign.version"
        side_effects:
          - "remedy_released_at and remedy_released_by_user_id refreshed"
          - "version incremented by 1"
        note: "Cycle: REMEDY_RELEASED -> REMEDY_REVISED -> REMEDY_RELEASED may repeat any number of times."

  # ---- AffectedVehicle -------------------------------------------------------
  - entity: AffectedVehicle
    initial_state: UNREPAIRED
    terminal_states: [REMOVED_FROM_POPULATION]
    transitions:
      - from: UNREPAIRED
        to: SCHEDULED
        trigger: "POST /affected-vehicles/{id}/schedule"
        actor: DealerServiceManager
        preconditions:
          - "remedy_status == UNREPAIRED"
          - "X-User-ID == dealer_id in the request body"
          - "Dealer.status == ACTIVE"
          - "Vehicle.sale_status NOT IN {SCRAPPED, EXPORTED}"
          - "campaign.remedy_status == REMEDY_RELEASED"
        side_effects:
          - "dealer_id and scheduled_repair_date stored"
          - "version incremented by 1"
      - from: UNREACHABLE
        to: SCHEDULED
        trigger: "POST /affected-vehicles/{id}/schedule"
        actor: DealerServiceManager
        preconditions:
          - "remedy_status == UNREACHABLE"
          - "Dealer.status == ACTIVE"
          - "campaign.remedy_status == REMEDY_RELEASED"
        side_effects:
          - "dealer_id and scheduled_repair_date stored; recall_population_count unchanged, completion_rate_pct recomputed because the OPERATIONAL denominator changes"
          - "version incremented by 1"
        note: "Cycle back out of UNREACHABLE when an owner finally responds."
      - from: SCHEDULED
        to: REMEDIED
        trigger: "POST /repair-claims/{id}/audit with decision APPROVE"
        actor: ClaimsAuditor
        preconditions:
          - "claim.status == SUBMITTED"
          - "remedy_status IN {UNREPAIRED, SCHEDULED, REMEDIED}"
        side_effects:
          - "approved_claim_count incremented by 1"
          - "campaign.remedied_count, recall_population_count and completion_rate_pct recomputed"
          - "campaign.reimbursement_obligation_cents increased by claim.final_amount_cents"
          - "PartsAllocation.consumed_qty and RemedyPart.consumed_qty each incremented by 1"
          - "version incremented by 1"
      - from: UNREPAIRED
        to: REMEDIED
        trigger: "POST /repair-claims/{id}/audit with decision APPROVE (owner walked in without an appointment)"
        actor: ClaimsAuditor
        preconditions:
          - "claim.status == SUBMITTED"
          - "remedy_status == UNREPAIRED"
        side_effects:
          - "same side effects as the SCHEDULED -> REMEDIED transition"
      - from: REMEDIED
        to: UNREPAIRED
        trigger: "POST /repair-claims/{id}/reverse"
        actor: ClaimsAuditor
        preconditions:
          - "claim.status == APPROVED"
          - "approved_claim_count becomes 0 after the reversal"
        side_effects:
          - "cascade A link 1: approved_claim_count decremented; remedy_status REMEDIED -> UNREPAIRED"
          - "cascade A link 2, caused by link 1: campaign.remedied_count and completion_rate_pct recomputed; campaign.reimbursement_obligation_cents decreased by exactly the claim's stored final_amount_cents"
          - "cascade A link 3, caused by link 2: when campaign_status == MONITORING and the recomputed completion_rate_pct < FOLLOWUP_TRIGGER_PCT (85.00) and no FOLLOW_UP wave in status PLANNED or RELEASE_APPROVED exists for the vehicle's region, a FOLLOW_UP NotificationWave is created with auto_created = true (see calculation followup_wave_autoschedule)"
          - "parts returned per the invariant in calculation parts_conservation_invariant"
          - "version incremented by 1"
        note: "Cycle: REMEDIED -> UNREPAIRED -> ... -> REMEDIED may repeat; each pass raises is_repeat_repair on later claims."
      - from: REMEDIED
        to: UNREPAIRED
        trigger: "system: campaign remedy_status REMEDY_RELEASED -> REMEDY_REVISED"
        actor: system
        preconditions:
          - "remedy_status == REMEDIED"
        side_effects:
          - "requires_renotification = true"
          - "campaign.remedied_count and completion_rate_pct recomputed (cascade B link 3)"
          - "version incremented by 1"
      - from: UNREPAIRED
        to: UNREACHABLE
        trigger: "POST /affected-vehicles/{id}/outreach-attempts"
        actor: RecallOperationsManager
        preconditions:
          - "remedy_status == UNREPAIRED"
          - "the new attempt's outcome == BAD_ADDRESS, or outreach_attempt_count reaches UNREACHABLE_ATTEMPT_THRESHOLD (3) with every attempt's outcome IN {NO_RESPONSE, BAD_ADDRESS, OWNER_REFUSED}"
        side_effects:
          - "Vehicle.owner_address_valid = false when the triggering outcome is BAD_ADDRESS"
          - "campaign.completion_rate_pct recomputed (OPERATIONAL denominator shrinks; REGULATORY denominator does not)"
          - "version incremented by 1"
      - from: SCHEDULED
        to: UNREPAIRED
        trigger: "POST /affected-vehicles/{id}/outreach-attempts with outcome OWNER_REFUSED"
        actor: RecallOperationsManager
        preconditions:
          - "remedy_status == SCHEDULED"
        side_effects:
          - "dealer_id and scheduled_repair_date cleared"
          - "campaign.completion_rate_pct recomputed"
          - "version incremented by 1"
      - from: UNREPAIRED
        to: REMOVED_FROM_POPULATION
        trigger: "PATCH /vehicles/{id} setting sale_status to SCRAPPED or EXPORTED"
        actor: RecallOperationsManager
        preconditions:
          - "remedy_status NOT IN {REMOVED_FROM_POPULATION}"
        side_effects:
          - "campaign.affected_vehicle_count unchanged; recall_population_count decremented; completion_rate_pct recomputed (both variants shift)"
          - "version incremented by 1"
        note: "Applies from SCHEDULED, REMEDIED and UNREACHABLE as well; terminal once entered."

  # ---- NotificationWave ------------------------------------------------------
  - entity: NotificationWave
    initial_state: PLANNED
    terminal_states: [MAILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RELEASE_APPROVED
        trigger: "POST /notification-waves/{id}/release"
        actor: RecallOperationsManager
        preconditions:
          - "status == PLANNED"
          - "campaign_status IN {FILED, INTERIM_NOTIFIED, OWNER_NOTIFIED, MONITORING}"
          - "for wave_type REMEDY or FOLLOW_UP: campaign.remedy_status == REMEDY_RELEASED"
          - "for wave_type INTERIM: campaign.remedy_status == INTERIM_ONLY and campaign_status == INTERIM_NOTIFIED"
          - "planned_vehicle_count >= 1 after calculation wave_release_quota"
          - "provisional_coverage_ratio >= required_min_ratio for campaign.risk_severity"
        side_effects:
          - "eligible_vehicle_count, parts_capacity_qty, provisional_coverage_ratio, coverage_tier_factor, planned_vehicle_count and parts_coverage_ratio all pinned onto the wave"
          - "version incremented by 1"
      - from: RELEASE_APPROVED
        to: MAILED
        trigger: "POST /notification-waves/{id}/mail"
        actor: RecallOperationsManager
        preconditions:
          - "status == RELEASE_APPROVED"
          - "current logical clock date >= scheduled_mail_date"
        side_effects:
          - "the first planned_vehicle_count eligible AffectedVehicle rows, ordered by (Vehicle.production_date ASC, AffectedVehicle.created_at ASC), get notification_wave_id = wave.id, notice_count + 1, last_notice_type = wave_type, last_notice_date = clock, requires_renotification = false"
          - "mailed_vehicle_count set to the number of rows stamped; actual_mail_date = clock"
          - "for wave_type REMEDY or FOLLOW_UP: campaign_status FILED or INTERIM_NOTIFIED -> OWNER_NOTIFIED (unchanged when already OWNER_NOTIFIED or MONITORING)"
          - "for wave_type INTERIM: campaign_status unchanged"
          - "campaign.open_followup_wave_count recomputed; campaign.version incremented by 1"
          - "version incremented by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /notification-waves/{id}/cancel"
        actor: RecallOperationsManager
        preconditions:
          - "status == PLANNED"
        side_effects:
          - "cancel_reason stored; the wave stops counting toward the mailing-separation rule and toward open_followup_wave_count"
          - "campaign.open_followup_wave_count recomputed; campaign.version incremented by 1"
          - "version incremented by 1"
      - from: RELEASE_APPROVED
        to: CANCELLED
        trigger: "POST /notification-waves/{id}/cancel"
        actor: RecallOperationsManager
        preconditions:
          - "status == RELEASE_APPROVED"
        side_effects:
          - "cancel_reason stored; pinned quota fields retained for audit"
          - "campaign.open_followup_wave_count recomputed; campaign.version incremented by 1"
          - "version incremented by 1"

  # ---- RepairClaim -----------------------------------------------------------
  - entity: RepairClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /repair-claims/{id}/audit with decision APPROVE"
        actor: ClaimsAuditor
        preconditions:
          - "status == SUBMITTED"
          - "campaign.remedy_status IN {REMEDY_RELEASED, REMEDY_REVISED}"
          - "parts_allocation_id still references a PartsAllocation in status ALLOCATED with allocated_qty - consumed_qty >= 1"
        side_effects:
          - "final_amount_cents = FINAL variant of calculation claim_reimbursement"
          - "AffectedVehicle -> REMEDIED (see AffectedVehicle machine); approved_claim_count + 1"
          - "PartsAllocation.consumed_qty + 1; RemedyPart.consumed_qty + 1; RemedyPart.version + 1"
          - "campaign.reimbursement_obligation_cents + final_amount_cents; remedied_count and completion_rate_pct recomputed; remedy_effectiveness_score recomputed; campaign.version + 1"
          - "version incremented by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /repair-claims/{id}/audit with decision REJECT"
        actor: ClaimsAuditor
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "audit_note stored; final_amount_cents stays null"
          - "no AffectedVehicle transition, no parts consumption, no ledger movement"
          - "LaborOperation.claim_count decremented by 1"
          - "version incremented by 1"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /repair-claims/{id}/reverse"
        actor: ClaimsAuditor
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "reversal_reason stored; final_amount_cents retained (never recomputed) so the ledger reversal is exact"
          - "campaign.reimbursement_obligation_cents decreased by final_amount_cents"
          - "RemedyPart.consumed_qty decremented by 1; when the source PartsAllocation is still ALLOCATED its consumed_qty is decremented by 1, otherwise the unit is credited to RemedyPart.unallocated_qty instead"
          - "AffectedVehicle REMEDIED -> UNREPAIRED when approved_claim_count reaches 0 (cascade A)"
          - "version incremented by 1"

  # ---- OwnerReimbursementRequest --------------------------------------------
  - entity: OwnerReimbursementRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: DOCUMENTS_REQUESTED
        trigger: "POST /owner-reimbursements/{id}/request-documents"
        actor: ClaimsAuditor
        preconditions:
          - "status == SUBMITTED"
          - "document_round < MAX_DOCUMENT_ROUNDS (2)"
        side_effects:
          - "document_round incremented by 1; requested_items stored; documentation_complete = false"
          - "version incremented by 1"
      - from: DOCUMENTS_REQUESTED
        to: SUBMITTED
        trigger: "POST /owner-reimbursements/{id}/resubmit"
        actor: RecallOperationsManager
        preconditions:
          - "status == DOCUMENTS_REQUESTED"
        side_effects:
          - "supplied invoice fields overwritten; documentation_complete = true"
          - "version incremented by 1"
        note: "Cycle: SUBMITTED -> DOCUMENTS_REQUESTED -> SUBMITTED, bounded at 2 rounds by MAX_DOCUMENT_ROUNDS."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /owner-reimbursements/{id}/adjudicate with decision APPROVE"
        actor: ClaimsAuditor
        preconditions:
          - "status == SUBMITTED"
          - "documentation_complete == true"
          - "an AffectedVehicle row exists for (campaign_id, vehicle_id)"
          - "invoice_date within the reimbursement window (validation priority 26)"
        side_effects:
          - "approved_amount_cents = calculation owner_reimbursement_amount"
          - "campaign.reimbursement_obligation_cents increased by approved_amount_cents; campaign.version + 1"
          - "version incremented by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /owner-reimbursements/{id}/adjudicate with decision DENY"
        actor: ClaimsAuditor
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "denial_reason stored; approved_amount_cents = 0; no ledger movement"
          - "version incremented by 1"
      - from: DOCUMENTS_REQUESTED
        to: DENIED
        trigger: "POST /owner-reimbursements/{id}/adjudicate with decision DENY"
        actor: ClaimsAuditor
        preconditions:
          - "status == DOCUMENTS_REQUESTED"
        side_effects:
          - "denial_reason stored; approved_amount_cents = 0"
          - "version incremented by 1"

  # ---- RegulatoryFiling ------------------------------------------------------
  - entity: RegulatoryFiling
    initial_state: SUBMITTED
    terminal_states: [AMENDED]
    transitions:
      - from: SUBMITTED
        to: AMENDED
        trigger: "POST /recall-campaigns/{id}/filings with filing_type AMENDMENT and the same report_period"
        actor: ComplianceOfficer
        preconditions:
          - "a RegulatoryFiling with filing_type QUARTERLY, the same report_period and status SUBMITTED exists for the campaign"
        side_effects:
          - "the prior QUARTERLY filing -> AMENDED and its amendment_required = false"
          - "the new AMENDMENT filing is created in status SUBMITTED with fresh completion/effectiveness snapshots"
          - "version incremented by 1 on the amended filing"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: remedy-release-stale-campaign
    parent_entity: RecallCampaign
    write_endpoint: "POST /recall-campaigns/{id}/remedy-releases"
    occ_field: "expected_campaign_version"
    description: |
      Releasing a remedy against a campaign whose version has advanced since the
      client last read it is rejected. A remedy release legitimately supersedes the
      prior remedy definition (REMEDY_REVISED -> REMEDY_RELEASED, or a second release
      that re-stamps remedy_released_at), so the second writer would otherwise
      succeed and silently overwrite a remedy decision it never observed.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
  - rule_id: allocation-create-stale-part
    parent_entity: RemedyPart
    write_endpoint: "POST /parts-allocations"
    occ_field: "expected_part_version"
    description: |
      Creating a PartsAllocation against a RemedyPart whose version has advanced
      since the client last read it is rejected. A new allocation for the same
      (remedy_part_id, dealer_id) legitimately supersedes the prior ALLOCATED row and
      returns its uncommitted units to the pool, so a writer working from a stale
      unallocated_qty would supersede an allocation it never saw.
    error_id: ERR_STALE_PART_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: filing_deadline
    trigger: "POST /recall-campaigns/{id}/defect-determination (deadline); POST /recall-campaigns/{id}/filings with filing_type DEFECT_NOTICE (lateness)"
    algorithm: threshold
    formula: |
      # deadline
      d = date(defect_determination_date)            # UTC calendar date
      counted = 0
      while counted < FILING_BUSINESS_DAYS:
          d = d + 1 day
          if weekday(d) in {MON..FRI} and d not in FEDERAL_HOLIDAYS:
              counted = counted + 1
      filing_deadline_utc = d at 23:59:59Z

      # lateness, evaluated when the DEFECT_NOTICE filing is accepted
      late_filing_flag = filed_at > filing_deadline_utc          # STRICT >
      if late_filing_flag:
          days_late = ceil((filed_at - filing_deadline_utc) / 86400 seconds)
      else:
          days_late = 0
    input_set: "the campaign's own defect_determination_date and the logical clock at filing time; no other entity participates"
    constants:
      FILING_BUSINESS_DAYS: 5
      FEDERAL_HOLIDAYS: ["2026-01-01", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25", "2027-01-01"]
    precision: "deadline pinned to 23:59:59Z; days_late is a whole number, ceiling of fractional days"

  - name: affected_population_match
    trigger: "POST /recall-campaigns/{id}/population-runs"
    algorithm: constraint_propagation
    formula: |
      include_rules = VehiclePopulationRule[campaign_id == C, inclusion_mode == INCLUDE]
                      ordered by (production_start_date ASC, created_at ASC)
      exclude_rules = VehiclePopulationRule[campaign_id == C, inclusion_mode == EXCLUDE]

      def matches(rule, v):
          return v.plant_code == rule.plant_code
             and v.model_code == rule.model_code
             and v.model_year == rule.model_year
             and rule.production_start_date <= v.production_date < rule.production_end_date   # HALF-OPEN
             and rule.part_number_low <= v.suspect_part_number <= rule.part_number_high        # CLOSED

      for v in Vehicle (all build records, ordered by (production_date ASC, created_at ASC)):
          hit = first rule in include_rules where matches(rule, v)     # first match wins
          if hit is None:                       continue
          if any(matches(x, v) for x in exclude_rules):
              excluded_count += 1;              continue
          if AffectedVehicle[campaign_id == C, vehicle_id == v.id] exists:
              continue                          # re-runs never disturb existing rows
          create AffectedVehicle(campaign_id=C, vehicle_id=v.id, matched_by_rule_id=hit.id,
                                 remedy_status = REMOVED_FROM_POPULATION if v.sale_status in {SCRAPPED, EXPORTED}
                                                 else UNREPAIRED)
          matched_count += 1
          if remedy_status == REMOVED_FROM_POPULATION: removed_count += 1

      # rows whose vehicle no longer matches any INCLUDE rule (rule deleted or edited)
      for av in AffectedVehicle[campaign_id == C, remedy_status != REMOVED_FROM_POPULATION]:
          if no include rule matches av.vehicle:
              av.remedy_status = REMOVED_FROM_POPULATION; removed_count += 1

      campaign.affected_vehicle_count = count(AffectedVehicle[campaign_id == C])
      campaign.recall_population_count = affected_vehicle_count - count(remedy_status == REMOVED_FROM_POPULATION)
      each rule.matched_vehicle_count = count(AffectedVehicle[matched_by_rule_id == rule.id])
    input_set: "every Vehicle row in the database; INCLUDE and EXCLUDE rules of this campaign only; vehicles already linked to the campaign are skipped so the run is idempotent"
    constants: {}
    precision: "integer counts; date comparisons on calendar dates, lower bound inclusive, upper bound exclusive"

  - name: parts_allocation_grant
    trigger: "POST /parts-allocations"
    algorithm: waterfall_allocation
    formula: |
      part   = RemedyPart[remedy_part_id]
      dealer = Dealer[dealer_id]

      # step 1 - supersede the dealer's prior holding on this part, in this order
      prior = PartsAllocation[remedy_part_id == part.id, dealer_id == dealer.id, status == ALLOCATED]
              ordered by created_at ASC          # at most one exists by construction
      if prior exists:
          returned = prior.allocated_qty - prior.consumed_qty
          prior.status = REVOKED; prior.revoked_reason = SUPERSEDED
          part.unallocated_qty = part.unallocated_qty + returned

      # step 2 - regional demand snapshot (taken AFTER the supersede in step 1)
      region_demand = count(AffectedVehicle av
                            where av.campaign_id == part.campaign_id
                              and av.remedy_status IN {UNREPAIRED, SCHEDULED}
                              and Vehicle[av.vehicle_id].region_code == dealer.region_code)

      # step 3 - nested caps
      dealer_cap = min(requested_qty, dealer.monthly_repair_capacity, region_demand * PARTS_PER_REPAIR_MAX)
      granted    = min(dealer_cap, part.unallocated_qty)
      if granted == 0: reject ERR_NO_PARTS_AVAILABLE

      allocation.allocated_qty      = granted
      allocation.partially_granted  = granted < requested_qty
      allocation.consumed_qty       = 0
      part.unallocated_qty          = part.unallocated_qty - granted
      part.version                  = part.version + 1
    input_set: "the named RemedyPart and Dealer; AffectedVehicle rows of the part's campaign in remedy_status UNREPAIRED or SCHEDULED whose Vehicle.region_code equals the dealer's region"
    constants:
      PARTS_PER_REPAIR_MAX: 1
    precision: "integer units; no rounding"

  - name: parts_allocation_pick
    trigger: "POST /repair-claims (selects the allocation the unit will be drawn from)"
    algorithm: aggregation
    formula: |
      candidates = PartsAllocation a
                   where a.dealer_id == claim.dealer_id
                     and a.campaign_id == affected_vehicle.campaign_id
                     and a.status == ALLOCATED
                     and (a.allocated_qty - a.consumed_qty) >= PARTS_PER_REPAIR_MAX
      ranking   = candidates ordered by created_at ASC       # oldest holding drains first
      tie_break = "created_at is unique per row; when two rows share created_at, order by allocated_qty DESC"
      pick      = first row of ranking
      if candidates is empty: reject ERR_NO_PARTS_AVAILABLE
      claim.parts_allocation_id = pick.id
    input_set: "ALLOCATED allocations of the claiming dealer for the claim's campaign with at least one uncommitted unit"
    constants:
      PARTS_PER_REPAIR_MAX: 1
    precision: "exact row selection; no numeric rounding"

  - name: claim_reimbursement
    trigger: "POST /repair-claims (PROVISIONAL variant); POST /repair-claims/{id}/audit with decision APPROVE (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      # ROUNDING ORDER IS PINNED: round EACH component to 2 decimals, THEN sum,
      # THEN round the sum. Summing first and rounding once is a different number
      # and is wrong (e.g. 173.425 + 75.555 + 12.00 -> 260.98 instead of 260.99).

      # ---- PROVISIONAL (dealer's posted rate, dealer's reported quantities) ----
      labor_p = round(claimed_labor_hours * dealer.labor_rate_per_hour, 2)
      parts_p = round(parts_used_qty * remedy_part.unit_cost * (1 + PARTS_HANDLING_MARKUP_PCT), 2)
      provisional_amount_cents = round(round(labor_p + parts_p + ADMIN_ALLOWANCE_USD, 2) * 100)

      # ---- FINAL (flat-rate hours, regional rate cap, one kit per repair) ----
      effective_hours = min(claimed_labor_hours, labor_operation.flat_hours)
      effective_rate  = min(dealer.labor_rate_per_hour, RATE_CAP_BY_REGION[dealer.region_code])
      labor_f = round(effective_hours * effective_rate, 2)
      parts_f = round(min(parts_used_qty, PARTS_PER_REPAIR_MAX) * remedy_part.unit_cost * (1 + PARTS_HANDLING_MARKUP_PCT), 2)
      admin_f = ADMIN_ALLOWANCE_USD if date(repair_date) >= date(campaign.remedy_released_at) else 0.00
      final_amount_cents = round(round(labor_f + parts_f + admin_f, 2) * 100)
    input_set: "the claim's own fields, its Dealer, its LaborOperation, and the single RemedyPart of the claim's campaign (ordered by created_at ASC, first row, when more than one exists)"
    constants:
      ADMIN_ALLOWANCE_USD: 12.00
      PARTS_HANDLING_MARKUP_PCT: 0.15
      PARTS_PER_REPAIR_MAX: 1
      RATE_CAP_BY_REGION: { NE: 152.00, SE: 128.50, MW: 121.75, WE: 165.25 }
      CLAIM_HOURS_TOLERANCE: 1.5
    precision: "2 decimal places per component, round_half_up; cents are integers"
    variants:
      - name: PROVISIONAL
        when: "computed at claim submission and stored in provisional_amount_cents; what the dealer sees as the expected payment"
        difference: "uses claimed_labor_hours uncapped, the dealer's posted labor_rate_per_hour uncapped, the dealer's full parts_used_qty, and always adds ADMIN_ALLOWANCE_USD"
      - name: FINAL
        when: "computed at audit approval and stored in final_amount_cents; the amount that moves the campaign ledger"
        difference: "caps hours at LaborOperation.flat_hours, caps the rate at RATE_CAP_BY_REGION[dealer.region_code], caps kits at PARTS_PER_REPAIR_MAX, and drops ADMIN_ALLOWANCE_USD when repair_date precedes the remedy release date"

  - name: completion_rate
    trigger: "recomputed whenever an AffectedVehicle.remedy_status changes, on repair-claim approval and reversal, and read by GET /recall-campaigns/{id}/completion-metrics"
    algorithm: aggregation
    formula: |
      # Population buckets, all filtered to AffectedVehicle[campaign_id == C]:
      total       = count(all rows)
      removed     = count(remedy_status == REMOVED_FROM_POPULATION)
      unreachable = count(remedy_status == UNREACHABLE)
      remedied    = count(remedy_status == REMEDIED)
      scheduled   = count(remedy_status == SCHEDULED)

      # ---- REGULATORY variant (persisted in campaign.completion_rate_pct) ----
      recall_population = total - removed              # UNREACHABLE stays in the denominator
      regulatory_completion_rate_pct = 0.00 if recall_population == 0
                                       else round(100 * remedied / recall_population, 2)

      # ---- OPERATIONAL variant (read-only, dashboard) ----
      op_denominator = total - removed - unreachable   # UNREACHABLE leaves the denominator
      operational_completion_rate_pct = 0.00 if op_denominator == 0
                                        else round(100 * (remedied + scheduled) / op_denominator, 2)
    input_set: "every AffectedVehicle row of the campaign; no time window (the buckets are current-state counts, not events)"
    constants:
      FOLLOWUP_TRIGGER_PCT: 85.00
      CLOSURE_COMPLETION_MIN: 95.00
    precision: "2 decimal places, round_half_up; both variants return 0.00 on an empty denominator"
    variants:
      - name: REGULATORY
        when: "persisted on the campaign, frozen onto every RegulatoryFiling snapshot, and used by the closure gate and the follow-up cascade"
        difference: "numerator is REMEDIED only; denominator excludes REMOVED_FROM_POPULATION but keeps UNREACHABLE"
      - name: OPERATIONAL
        when: "returned by GET /recall-campaigns/{id}/completion-metrics as operational_completion_rate_pct"
        difference: "numerator adds SCHEDULED; denominator also drops UNREACHABLE, so the same population reports a higher rate"

  - name: wave_release_quota
    trigger: "POST /notification-waves/{id}/release"
    algorithm: threshold
    formula: |
      # STEP ORDER IS PINNED. The gate compares the ratio whose denominator is
      # eligible_vehicle_count; the ratio STORED on the wave has denominator
      # planned_vehicle_count. They are different numbers and must not be swapped.

      # step 1 - candidate set, by wave_type, restricted to the target region
      base = AffectedVehicle av where av.campaign_id == wave.campaign_id
                               and Vehicle[av.vehicle_id].region_code == wave.target_region_code
      if wave_type == INTERIM:   cand = base where av.remedy_status == UNREPAIRED and av.notice_count == 0
      if wave_type == REMEDY:    cand = base where av.remedy_status IN {UNREPAIRED, SCHEDULED}
                                              and (av.last_notice_type IS NULL or av.last_notice_type == INTERIM)
      if wave_type == FOLLOW_UP: cand = base where av.remedy_status == UNREPAIRED
                                              and av.notice_count >= 1
                                              and av.last_notice_type IN {REMEDY, FOLLOW_UP}
      eligible_vehicle_count = count(cand)
      if eligible_vehicle_count == 0: reject ERR_EMPTY_WAVE_POPULATION

      # step 2 - parts capacity snapshot
      if wave_type == INTERIM:
          parts_capacity_qty = eligible_vehicle_count      # an interim letter needs no parts
      else:
          parts_capacity_qty = sum(a.allocated_qty - a.consumed_qty
                                   for a in PartsAllocation
                                   where a.status == ALLOCATED
                                     and a.campaign_id == wave.campaign_id
                                     and Dealer[a.dealer_id].region_code == wave.target_region_code)

      # step 3 - gate input
      provisional_coverage_ratio = round(parts_capacity_qty / eligible_vehicle_count, 4)
      required_min_ratio = REQUIRED_MIN_RATIO_BY_SEVERITY[campaign.risk_severity]
      if provisional_coverage_ratio < required_min_ratio: reject ERR_INSUFFICIENT_PARTS_COVERAGE   # >= passes

      # step 4 - tier factor from the SAME provisional ratio
      coverage_tier_factor = 1.00 if provisional_coverage_ratio >= 1.0000
                        else 0.75 if provisional_coverage_ratio >= 0.6000
                        else 0.40 if provisional_coverage_ratio >= 0.3000
                        else 0.00

      # step 5 - mailing size (deliberately allowed to run ahead of parts on hand)
      planned_vehicle_count = floor(eligible_vehicle_count * coverage_tier_factor)
      if planned_vehicle_count == 0: reject ERR_EMPTY_WAVE_POPULATION

      # step 6 - reported coverage, denominator = planned_vehicle_count
      parts_coverage_ratio = round(parts_capacity_qty / planned_vehicle_count, 4)
    input_set: "AffectedVehicle rows of the wave's campaign whose Vehicle.region_code equals the wave's target region, filtered by wave_type as above; ALLOCATED PartsAllocation rows of the campaign held by dealers in that region"
    constants:
      REQUIRED_MIN_RATIO_BY_SEVERITY: { HIGH: 1.0000, MODERATE: 0.6000, LOW: 0.3000 }
      PARTS_PER_REPAIR_MAX: 1
    precision: "ratios 4 decimal places, round_half_up; counts integer; floor() on planned_vehicle_count"

  - name: owner_reimbursement_amount
    trigger: "POST /owner-reimbursements/{id}/adjudicate with decision APPROVE"
    algorithm: tiered_pricing
    formula: |
      lop = LaborOperation of request.campaign_id where effective_from <= invoice_date <= effective_to   # CLOSED window
      if lop is None: reject ERR_LABOR_OP_NOT_EFFECTIVE
      part = RemedyPart of request.campaign_id ordered by created_at ASC, first row

      labor_c = round(min(labor_hours_claimed, lop.flat_hours) * PREVAILING_LABOR_RATE_USD, 2)
      parts_c = round(min(parts_amount, round(part.unit_cost * PARTS_PER_REPAIR_MAX * OWNER_PARTS_MSRP_FACTOR, 2)), 2)
      tow_c   = round(min(towing_amount, TOWING_CAP_USD), 2) if campaign.do_not_drive_flag else 0.00
      cap     = round(labor_c + parts_c + tow_c, 2)                 # per-component rounding, then sum
      approved_amount_cents = round(round(min(invoice_amount, cap), 2) * 100)
    input_set: "the request's own invoice fields, the campaign's do_not_drive_flag, the campaign LaborOperation whose closed effective window contains invoice_date, and the campaign's first RemedyPart by created_at"
    constants:
      PREVAILING_LABOR_RATE_USD: 115.00
      OWNER_PARTS_MSRP_FACTOR: 1.40
      TOWING_CAP_USD: 100.00
      PARTS_PER_REPAIR_MAX: 1
      OWNER_INVOICE_MAX_USD: 5000.00
      REIMBURSEMENT_LOOKBACK_DAYS: 365
      REIMBURSEMENT_TAIL_DAYS: 30
    precision: "2 decimal places per component, round_half_up; cents integer"

  - name: remedy_effectiveness_score
    trigger: "recomputed on POST /repair-claims/{id}/audit with decision APPROVE, on POST /repair-claims/{id}/reverse, and on POST /recall-campaigns/{id}/filings (QUARTERLY or AMENDMENT), where it is compared with REMEDY_EFFECTIVENESS_MIN"
    algorithm: weighted_scoring
    formula: |
      remedied          = count(AffectedVehicle[campaign_id == C, remedy_status == REMEDIED])
      recall_population = campaign.recall_population_count
      unreachable       = count(AffectedVehicle[campaign_id == C, remedy_status == UNREACHABLE])
      repeat_claims     = sum(max(0, count(RepairClaim[affected_vehicle_id == av.id, status == APPROVED]) - 1)
                              for av in AffectedVehicle[campaign_id == C])

      repeat_rate      = 0.0000 if remedied == 0 else round(repeat_claims / remedied, 4)
      unreachable_rate = 0.0000 if recall_population == 0 else round(unreachable / recall_population, 4)
      late_penalty     = LATE_FILING_PENALTY_POINTS if campaign.late_filing_flag else 0.00

      raw   = 100.00 - (REPEAT_WEIGHT * repeat_rate) - (UNREACHABLE_WEIGHT * unreachable_rate) - late_penalty
      score = round(max(0.00, min(100.00, raw)), 2)

      # threshold, evaluated only inside a QUARTERLY filing
      if filing_type == QUARTERLY and score < REMEDY_EFFECTIVENESS_MIN and remedy_status == REMEDY_RELEASED:
          remedy_status -> REMEDY_REVISED        # STRICT <: exactly 70.00 does NOT revise
    input_set: "AffectedVehicle rows of the campaign in any status for the buckets; only APPROVED RepairClaim rows count toward repeat_claims (REVERSED and REJECTED claims are excluded)"
    constants:
      REPEAT_WEIGHT: 60.00
      UNREACHABLE_WEIGHT: 20.00
      LATE_FILING_PENALTY_POINTS: 5.00
      REMEDY_EFFECTIVENESS_MIN: 70.00
    precision: "rates 4 decimal places, score 2 decimal places, round_half_up, clamped to [0.00, 100.00]"

  - name: followup_wave_autoschedule
    trigger: "cascade A link 3, inside POST /repair-claims/{id}/reverse"
    algorithm: interval_merge
    formula: |
      if campaign.campaign_status != MONITORING: stop
      if campaign.completion_rate_pct >= FOLLOWUP_TRIGGER_PCT: stop
      region = Vehicle[affected_vehicle.vehicle_id].region_code
      if NotificationWave[campaign_id == C, wave_type == FOLLOW_UP, target_region_code == region,
                          status IN {PLANNED, RELEASE_APPROVED}] exists: stop

      d = date(current logical clock) + FOLLOWUP_LEAD_DAYS
      while exists w in NotificationWave[campaign_id == C, target_region_code == region,
                                         status IN {PLANNED, RELEASE_APPROVED, MAILED}]
            with abs(d - w.scheduled_mail_date) < MIN_WAVE_SEPARATION_DAYS:
          d = d + 1 day                       # step forward one day at a time
      create NotificationWave(wave_type = FOLLOW_UP, target_region_code = region,
                              scheduled_mail_date = d, status = PLANNED, auto_created = true)
      campaign.open_followup_wave_count = count(FOLLOW_UP waves in {PLANNED, RELEASE_APPROVED})
    input_set: "non-CANCELLED NotificationWave rows of the campaign in the same target region; the logical clock"
    constants:
      FOLLOWUP_LEAD_DAYS: 21
      MIN_WAVE_SEPARATION_DAYS: 14
      FOLLOWUP_TRIGGER_PCT: 85.00
    precision: "whole calendar days; separation compared with absolute day difference >= 14"

  - name: parts_conservation_invariant
    trigger: "asserted after every mutation touching RemedyPart, PartsAllocation or RepairClaim"
    algorithm: aggregation
    formula: |
      for every RemedyPart p:
        p.total_procured_qty ==
              p.unallocated_qty
            + sum(a.allocated_qty - a.consumed_qty for a in PartsAllocation[remedy_part_id == p.id, status == ALLOCATED])
            + p.consumed_qty

      # forward action  : POST /parts-allocations           unallocated -> allocated
      # compensation    : POST /parts-allocations/{id}/revoke  (allocated - consumed) -> unallocated
      # forward action  : POST /repair-claims/{id}/audit APPROVE  allocation.consumed +1, p.consumed +1
      # compensation    : POST /repair-claims/{id}/reverse
      #     if source allocation.status == ALLOCATED: allocation.consumed -1, p.consumed -1
      #     else (allocation already REVOKED):        p.unallocated +1,      p.consumed -1
    input_set: "all PartsAllocation rows of the part, partitioned by status; REVOKED rows contribute nothing"
    constants: {}
    precision: "exact integer equality at every observable point"

  - name: obligation_conservation_invariant
    trigger: "asserted after every mutation touching RepairClaim or OwnerReimbursementRequest"
    algorithm: aggregation
    formula: |
      for every RecallCampaign C:
        C.reimbursement_obligation_cents ==
              sum(rc.final_amount_cents for rc in RepairClaim[campaign_id == C.id, status == APPROVED])
            + sum(orr.approved_amount_cents for orr in OwnerReimbursementRequest[campaign_id == C.id, status == APPROVED])

      # forward action : audit APPROVE       obligation += final_amount_cents (computed once)
      # compensation   : reverse             obligation -= the STORED final_amount_cents (never recomputed)
      # forward action : adjudicate APPROVE  obligation += approved_amount_cents
    input_set: "RepairClaim rows in status APPROVED only (SUBMITTED, REJECTED and REVERSED excluded) and OwnerReimbursementRequest rows in status APPROVED only"
    constants: {}
    precision: "exact integer cents; a reversal must restore the pre-approval value bit for bit"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the calling role appears in the endpoint's roles list in 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path-referenced RecallCampaign exists"
    error_id: ERR_CAMPAIGN_NOT_FOUND
    http_status: 404
    applies_to: "all /recall-campaigns/{id}/** endpoints"
  - priority: 4
    category: existence
    check: "path-referenced Vehicle exists"
    error_id: ERR_VEHICLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /vehicles/{id}, PATCH /vehicles/{id}"
  - priority: 5
    category: existence
    check: "path-referenced AffectedVehicle exists"
    error_id: ERR_AFFECTED_VEHICLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /affected-vehicles/{id}, GET /affected-vehicles/{id}/outreach-attempts, POST /affected-vehicles/{id}/schedule, POST /affected-vehicles/{id}/outreach-attempts"
  - priority: 6
    category: existence
    check: "path-referenced NotificationWave, PartsAllocation, RepairClaim or OwnerReimbursementRequest exists"
    error_id: ERR_WAVE_NOT_FOUND
    http_status: 404
    applies_to: "POST /notification-waves/{id}/**; the sibling ids raise ERR_ALLOCATION_NOT_FOUND, ERR_CLAIM_NOT_FOUND and ERR_REIMBURSEMENT_NOT_FOUND respectively"
  - priority: 7
    category: existence
    check: "path-referenced PartsAllocation exists"
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /parts-allocations/{id}, POST /parts-allocations/{id}/revoke"
  - priority: 8
    category: existence
    check: "path-referenced RepairClaim exists"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /repair-claims/{id}, POST /repair-claims/{id}/audit, POST /repair-claims/{id}/reverse"
  - priority: 9
    category: existence
    check: "path-referenced OwnerReimbursementRequest exists"
    error_id: ERR_REIMBURSEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /owner-reimbursements/{id}, POST /owner-reimbursements/{id}/**"
  - priority: 10
    category: business_constraint
    check: "required body fields are present, enum values are members of the declared set, numbers are positive where constrained, dates parse as YYYY-MM-DD and instants as ISO 8601 UTC, limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 11
    category: existence
    check: "body-referenced Dealer, LaborOperation, RemedyPart, Vehicle, AffectedVehicle and RecallCampaign ids exist"
    error_id: ERR_DEALER_NOT_FOUND
    http_status: 404
    applies_to: "POST /parts-allocations, POST /repair-claims, POST /affected-vehicles/{id}/schedule (dealer_id); ERR_LABOR_OP_NOT_FOUND, ERR_PART_NOT_FOUND, ERR_VEHICLE_NOT_FOUND, ERR_AFFECTED_VEHICLE_NOT_FOUND and ERR_CAMPAIGN_NOT_FOUND for the other body ids"
  - priority: 12
    category: business_referential
    check: "supersedes_campaign_id, when supplied, references a campaign whose campaign_status is not DRAFT, CLOSED or SUPERSEDED"
    error_id: ERR_SUPERSEDED_CAMPAIGN_INVALID
    http_status: 422
    applies_to: "POST /recall-campaigns"
  - priority: 13
    category: auth
    check: "for DealerServiceManager callers, X-User-ID equals the dealer_id in the body (and equals AffectedVehicle.dealer_id when the row is already scheduled)"
    error_id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /repair-claims, POST /affected-vehicles/{id}/schedule"
  - priority: 14
    category: auth
    check: "segregation of duties: X-User-ID != campaign.determined_by_user_id when filing a DEFECT_NOTICE, and X-User-ID != campaign.remedy_released_by_user_id when closing the campaign"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /recall-campaigns/{id}/filings (filing_type DEFECT_NOTICE), POST /recall-campaigns/{id}/close"
  - priority: 15
    category: state
    check: "the target RecallCampaign is in a campaign_status that permits the operation (and is neither CLOSED nor SUPERSEDED)"
    error_id: ERR_INVALID_CAMPAIGN_STATE
    http_status: 409
    applies_to: "all campaign-scoped writes"
  - priority: 16
    category: state
    check: "the target NotificationWave is in the status the operation requires (PLANNED for release, RELEASE_APPROVED for mail, PLANNED or RELEASE_APPROVED for cancel)"
    error_id: ERR_WAVE_INVALID_STATE
    http_status: 409
    applies_to: "POST /notification-waves/{id}/release, POST /notification-waves/{id}/mail, POST /notification-waves/{id}/cancel"
  - priority: 17
    category: state
    check: "the target RepairClaim is SUBMITTED for audit and APPROVED for reverse"
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "POST /repair-claims/{id}/audit, POST /repair-claims/{id}/reverse"
  - priority: 18
    category: state
    check: "the target OwnerReimbursementRequest is SUBMITTED for request-documents, DOCUMENTS_REQUESTED for resubmit, and SUBMITTED or DOCUMENTS_REQUESTED for adjudicate"
    error_id: ERR_REIMBURSEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /owner-reimbursements/{id}/request-documents, POST /owner-reimbursements/{id}/resubmit, POST /owner-reimbursements/{id}/adjudicate"
  - priority: 19
    category: state
    check: "the target PartsAllocation is ALLOCATED"
    error_id: ERR_ALLOCATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /parts-allocations/{id}/revoke"
  - priority: 20
    category: state
    check: "the target AffectedVehicle is repairable: remedy_status IN {UNREPAIRED, SCHEDULED, REMEDIED} for a claim, IN {UNREPAIRED, UNREACHABLE} for scheduling; UNREACHABLE and REMOVED_FROM_POPULATION rows reject claim submission"
    error_id: ERR_VEHICLE_NOT_REPAIRABLE
    http_status: 409
    applies_to: "POST /repair-claims, POST /affected-vehicles/{id}/schedule"
  - priority: 21
    category: state
    check: "OCC: expected_campaign_version equals campaign.version; expected_part_version equals remedy_part.version"
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /recall-campaigns/{id}/remedy-releases (ERR_STALE_CAMPAIGN_VERSION), POST /parts-allocations (ERR_STALE_PART_VERSION)"
  - priority: 22
    category: business_safety
    check: "a remedy-dependent operation requires campaign.remedy_status IN {REMEDY_RELEASED, REMEDY_REVISED}: releasing a REMEDY or FOLLOW_UP wave, scheduling a repair, submitting a repair claim"
    error_id: ERR_REMEDY_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /notification-waves/{id}/release, POST /affected-vehicles/{id}/schedule, POST /repair-claims"
  - priority: 23
    category: business_safety
    check: "an interim advisory may only be issued while no remedy exists (remedy_status == REMEDY_UNDER_DEVELOPMENT)"
    error_id: ERR_REMEDY_ALREADY_AVAILABLE
    http_status: 409
    applies_to: "POST /recall-campaigns/{id}/interim-advisory"
  - priority: 24
    category: business_safety
    check: "a vehicle under stop_sale_hold may not be moved to sale_status SOLD"
    error_id: ERR_STOP_SALE_ACTIVE
    http_status: 409
    applies_to: "PATCH /vehicles/{id}"
  - priority: 25
    category: business_referential
    check: "the referenced LaborOperation's CLOSED effective window contains the relevant date (repair_date for claims, invoice_date for owner reimbursements); cross-campaign ownership of the code is a separate check at priority 27"
    error_id: ERR_LABOR_OP_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /repair-claims, POST /owner-reimbursements/{id}/adjudicate, POST /recall-campaigns/{id}/remedy-releases"
  - priority: 26
    category: business_referential
    check: "an AffectedVehicle row exists for (campaign_id, vehicle_id) on an owner reimbursement, and the RemedyPart named in an allocation belongs to the same campaign as the dealer's allocation target"
    error_id: ERR_VEHICLE_NOT_IN_POPULATION
    http_status: 422
    applies_to: "POST /owner-reimbursements, POST /owner-reimbursements/{id}/adjudicate; the allocation variant raises ERR_PART_CAMPAIGN_MISMATCH"
  - priority: 27
    category: business_referential
    check: "the claim's dealer, labor operation and affected vehicle all belong to the same campaign"
    error_id: ERR_PART_CAMPAIGN_MISMATCH
    http_status: 422
    applies_to: "POST /repair-claims, POST /parts-allocations"
  - priority: 28
    category: state
    check: "the Dealer named by an allocation, schedule or claim is ACTIVE"
    error_id: ERR_DEALER_SUSPENDED
    http_status: 409
    applies_to: "POST /parts-allocations, POST /affected-vehicles/{id}/schedule, POST /repair-claims"
  - priority: 29
    category: business_temporal
    check: "production_start_date < production_end_date on a population rule; effective_from <= effective_to on a labor operation"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /recall-campaigns/{id}/population-rules, POST /recall-campaigns/{id}/labor-operations"
  - priority: 30
    category: business_temporal
    check: "a new INCLUDE population rule must not overlap an existing INCLUDE rule with the same (plant_code, model_code, model_year): half-open windows [start, end) intersect. Touching windows (existing.production_end_date == new.production_start_date) are allowed. EXCLUDE rules are exempt."
    error_id: ERR_POPULATION_RULE_OVERLAP
    http_status: 409
    applies_to: "POST /recall-campaigns/{id}/population-rules"
  - priority: 31
    category: business_temporal
    check: "a new LaborOperation must not overlap an existing one with the same (campaign_id, labor_op_code): CLOSED windows [effective_from, effective_to] intersect, so touching endpoints (existing.effective_to == new.effective_from) ARE a conflict"
    error_id: ERR_LABOR_OP_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /recall-campaigns/{id}/labor-operations"
  - priority: 32
    category: business_temporal
    check: "a new wave's scheduled_mail_date must be at least MIN_WAVE_SEPARATION_DAYS (14) whole days from every non-CANCELLED wave of the same campaign and target_region_code; exactly 14 days apart is allowed"
    error_id: ERR_WAVE_MAILING_TOO_CLOSE
    http_status: 409
    applies_to: "POST /recall-campaigns/{id}/notification-waves"
  - priority: 33
    category: business_temporal
    check: "the logical clock date has reached the wave's scheduled_mail_date"
    error_id: ERR_WAVE_MAIL_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /notification-waves/{id}/mail"
  - priority: 34
    category: business_temporal
    check: "repair_date >= date(campaign.remedy_released_at)"
    error_id: ERR_REPAIR_DATE_BEFORE_REMEDY
    http_status: 422
    applies_to: "POST /repair-claims"
  - priority: 35
    category: business_temporal
    check: "invoice_date >= date(campaign.defect_determination_date) - REIMBURSEMENT_LOOKBACK_DAYS (365, INCLUSIVE) and, when campaign.remedy_released_at is set, invoice_date <= date(campaign.remedy_released_at) + REIMBURSEMENT_TAIL_DAYS (30, INCLUSIVE)"
    error_id: ERR_REIMBURSEMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /owner-reimbursements, POST /owner-reimbursements/{id}/adjudicate"
  - priority: 36
    category: business_constraint
    check: "campaign_number, vin and dealer_code are unique"
    error_id: ERR_DUPLICATE_CAMPAIGN_NUMBER
    http_status: 409
    applies_to: "POST /recall-campaigns; POST /vehicles raises ERR_DUPLICATE_VIN"
  - priority: 37
    category: business_constraint
    check: "no other RepairClaim for the same (affected_vehicle_id, repair_date) is in status SUBMITTED or APPROVED"
    error_id: ERR_DUPLICATE_REPAIR_CLAIM
    http_status: 409
    applies_to: "POST /repair-claims"
  - priority: 38
    category: business_constraint
    check: "no existing RegulatoryFiling for the campaign shares the report_period (QUARTERLY) or filing_type DEFECT_NOTICE"
    error_id: ERR_FILING_PERIOD_DUPLICATE
    http_status: 409
    applies_to: "POST /recall-campaigns/{id}/filings"
  - priority: 39
    category: business_constraint
    check: "an AMENDMENT filing requires a QUARTERLY filing with the same report_period in status SUBMITTED"
    error_id: ERR_NO_QUARTERLY_FILING_TO_AMEND
    http_status: 422
    applies_to: "POST /recall-campaigns/{id}/filings"
  - priority: 40
    category: business_constraint
    check: "document_round < MAX_DOCUMENT_ROUNDS (2) before opening another document request"
    error_id: ERR_MAX_DOCUMENT_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST /owner-reimbursements/{id}/request-documents"
  - priority: 41
    category: business_constraint
    check: "the candidate set for a wave release is non-empty and planned_vehicle_count >= 1 (calculation wave_release_quota steps 1 and 5)"
    error_id: ERR_EMPTY_WAVE_POPULATION
    http_status: 409
    applies_to: "POST /notification-waves/{id}/release"
  - priority: 42
    category: business_constraint
    check: "closure gate: completion_rate_pct >= 95.00, remedy_effectiveness_score >= 70.00, quarterly_filing_count >= 2, remedy_status == REMEDY_RELEASED, and no PLANNED or RELEASE_APPROVED wave remains"
    error_id: ERR_CLOSURE_CRITERIA_NOT_MET
    http_status: 409
    applies_to: "POST /recall-campaigns/{id}/close"
  - priority: 43
    category: business_fiscal
    check: "provisional_coverage_ratio >= REQUIRED_MIN_RATIO_BY_SEVERITY[campaign.risk_severity] (calculation wave_release_quota step 3)"
    error_id: ERR_INSUFFICIENT_PARTS_COVERAGE
    http_status: 409
    applies_to: "POST /notification-waves/{id}/release"
  - priority: 44
    category: business_fiscal
    check: "parts are available: calculation parts_allocation_grant grants at least 1 unit, and calculation parts_allocation_pick finds an ALLOCATED allocation with an uncommitted unit"
    error_id: ERR_NO_PARTS_AVAILABLE
    http_status: 409
    applies_to: "POST /parts-allocations, POST /repair-claims"
  - priority: 45
    category: business_fiscal
    check: "claimed_labor_hours <= labor_operation.flat_hours * CLAIM_HOURS_TOLERANCE (1.5); exactly at the product passes"
    error_id: ERR_LABOR_HOURS_EXCEED_CAP
    http_status: 422
    applies_to: "POST /repair-claims"
  - priority: 46
    category: business_fiscal
    check: "invoice_amount <= OWNER_INVOICE_MAX_USD (5000.00)"
    error_id: ERR_REIMBURSEMENT_INVOICE_EXCEEDS_MAX
    http_status: 422
    applies_to: "POST /owner-reimbursements, POST /owner-reimbursements/{id}/resubmit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- campaign lifecycle ----------------------------------------------------
  - method: POST
    path: "/recall-campaigns"
    description: "Open a recall campaign file in DRAFT, optionally superseding an earlier campaign"
    roles: [SafetyEngineer]
    code: 201
    input: [campaign_number, defect_type, defect_description, "risk_severity?", "supersedes_campaign_id?"]
    output: RecallCampaign
    side_effects:
      - "campaign_status DRAFT, remedy_status REMEDY_UNDER_DEVELOPMENT"
      - "when supersedes_campaign_id is present: that campaign -> SUPERSEDED, its PLANNED/RELEASE_APPROVED waves -> CANCELLED, its ALLOCATED allocations -> REVOKED (revoked_reason CAMPAIGN_SUPERSEDED) with units returned to RemedyPart.unallocated_qty, and its version incremented by 1"
  - method: GET
    path: "/recall-campaigns/{id}"
    description: "Read one campaign including all computed counters"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: []
  - method: GET
    path: "/recall-campaigns"
    description: "List campaigns; supersedes_campaign_id finds the successor of a superseded campaign"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["campaign_status?", "supersedes_campaign_id?", "limit?", "offset?"]
    output: RecallCampaign[]
    side_effects: []
  - method: POST
    path: "/recall-campaigns/{id}/defect-determination"
    description: "Record the safety committee's defect determination and start the filing clock"
    roles: [SafetyEngineer]
    code: 200
    input: [defect_determination_date, "risk_severity?"]
    output: RecallCampaign
    side_effects:
      - "campaign_status DRAFT -> DEFECT_DETERMINED"
      - "filing_deadline_utc computed by calculation filing_deadline"
      - "determined_by_user_id = X-User-ID; version incremented by 1"
  - method: POST
    path: "/recall-campaigns/{id}/interim-advisory"
    description: "Issue an interim owner notice with optional stop-sale and do-not-drive advisories while the remedy is still under development"
    roles: [SafetyEngineer]
    code: 200
    input: [stop_sale, do_not_drive, justification]
    output: RecallCampaign
    side_effects:
      - "campaign_status FILED -> INTERIM_NOTIFIED and remedy_status REMEDY_UNDER_DEVELOPMENT -> INTERIM_ONLY in the same request"
      - "stop_sale_flag / do_not_drive_flag set; IN_DEALER_STOCK vehicles in the population get stop_sale_hold = true"
      - "version incremented by 1"
  - method: POST
    path: "/recall-campaigns/{id}/remedy-releases"
    description: "Release (or re-release after a revision) the remedy; OCC-guarded on the campaign version"
    roles: [SafetyEngineer]
    code: 200
    input: [remedy_description, labor_operation_id, expected_campaign_version, "revision_reason?"]
    output: RecallCampaign
    side_effects:
      - "remedy_status -> REMEDY_RELEASED from REMEDY_UNDER_DEVELOPMENT, INTERIM_ONLY or REMEDY_REVISED"
      - "remedy_released_at = logical clock; remedy_released_by_user_id = X-User-ID"
      - "stop_sale_flag = false and stop_sale_hold cleared on the population's IN_DEALER_STOCK vehicles"
      - "increments RecallCampaign.version by 1"
  - method: POST
    path: "/recall-campaigns/{id}/close"
    description: "Close the campaign once completion, effectiveness and reporting gates are met"
    roles: [ComplianceOfficer]
    code: 200
    input: [closure_note]
    output: RecallCampaign
    side_effects:
      - "campaign_status MONITORING -> CLOSED; closure_note stored; version incremented by 1"
  - method: GET
    path: "/recall-campaigns/{id}/completion-metrics"
    description: "Read both completion-rate variants and the effectiveness inputs side by side"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: []
    output: "{ regulatory_completion_rate_pct: number, operational_completion_rate_pct: number, remedied_count: integer, scheduled_count: integer, unreachable_count: integer, removed_count: integer, recall_population_count: integer, affected_vehicle_count: integer, remedy_effectiveness_score: number, repeat_claim_count: integer }"
    side_effects: []

  # ---- population definition -------------------------------------------------
  - method: POST
    path: "/recall-campaigns/{id}/population-rules"
    description: "Add an INCLUDE or EXCLUDE build-record rule (production window half-open, part range closed)"
    roles: [SafetyEngineer]
    code: 201
    input: [inclusion_mode, plant_code, model_code, model_year, production_start_date, production_end_date, part_number_low, part_number_high]
    output: VehiclePopulationRule
    side_effects: ["no population recomputation until a population run is executed"]
  - method: GET
    path: "/recall-campaigns/{id}/population-rules"
    description: "List the campaign's population rules"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["inclusion_mode?", "limit?", "offset?"]
    output: VehiclePopulationRule[]
    side_effects: []
  - method: POST
    path: "/recall-campaigns/{id}/population-runs"
    description: "Match build records against the campaign's rules and materialise AffectedVehicle rows (idempotent re-runs)"
    roles: [SafetyEngineer, RecallOperationsManager]
    code: 201
    input: []
    output: "{ matched_count: integer, excluded_count: integer, removed_count: integer, affected_vehicle_count: integer, recall_population_count: integer }"
    side_effects:
      - "AffectedVehicle rows created per calculation affected_population_match"
      - "campaign.affected_vehicle_count, recall_population_count and completion_rate_pct recomputed; campaign.version incremented by 1"
      - "each VehiclePopulationRule.matched_vehicle_count recomputed"

  # ---- build records ---------------------------------------------------------
  - method: POST
    path: "/vehicles"
    description: "Ingest a build record"
    roles: [RecallOperationsManager]
    code: 201
    input: [vin, plant_code, model_code, model_year, production_date, suspect_part_number, region_code, "sale_status?", "in_service_date?", "owner_name?", "owner_address_valid?"]
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/vehicles/{id}"
    description: "Read a build record"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: PATCH
    path: "/vehicles/{id}"
    description: "Update disposition or owner data on a build record"
    roles: [RecallOperationsManager]
    code: 200
    input: ["sale_status?", "owner_name?", "owner_address_valid?", "region_code?"]
    output: Vehicle
    side_effects:
      - "sale_status SCRAPPED or EXPORTED: every non-terminal AffectedVehicle row for this vehicle -> REMOVED_FROM_POPULATION"
      - "caused by that row change: campaign.recall_population_count, remedied_count and completion_rate_pct recomputed and campaign.version incremented by 1"
      - "version incremented by 1"

  # ---- affected population ---------------------------------------------------
  - method: GET
    path: "/affected-vehicles/{id}"
    description: "Read one affected-vehicle row"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: []
    output: AffectedVehicle
    side_effects: []
  - method: GET
    path: "/affected-vehicles"
    description: "List affected-vehicle rows filtered by any of their foreign keys or remedy_status"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["campaign_id?", "vehicle_id?", "matched_by_rule_id?", "notification_wave_id?", "dealer_id?", "remedy_status?", "limit?", "offset?"]
    output: AffectedVehicle[]
    side_effects: []
  - method: POST
    path: "/affected-vehicles/{id}/schedule"
    description: "Dealer books the recall repair appointment for an owner"
    roles: [DealerServiceManager]
    code: 200
    input: [dealer_id, scheduled_repair_date]
    output: AffectedVehicle
    side_effects:
      - "remedy_status UNREPAIRED or UNREACHABLE -> SCHEDULED; dealer_id and scheduled_repair_date stored"
      - "campaign.completion_rate_pct recomputed (OPERATIONAL numerator/denominator shift); campaign.version incremented by 1"
      - "version incremented by 1"
  - method: POST
    path: "/affected-vehicles/{id}/outreach-attempts"
    description: "Log an outreach attempt to an unresponsive owner"
    roles: [RecallOperationsManager]
    code: 201
    input: [channel, outcome, "note?"]
    output: OutreachAttempt
    side_effects:
      - "attempt_number = 1 + prior attempts; attempted_at = logical clock; AffectedVehicle.outreach_attempt_count incremented"
      - "outcome BAD_ADDRESS, or the 3rd consecutive unsuccessful attempt: AffectedVehicle UNREPAIRED -> UNREACHABLE and Vehicle.owner_address_valid = false on BAD_ADDRESS"
      - "outcome OWNER_REFUSED on a SCHEDULED row: -> UNREPAIRED with dealer_id and scheduled_repair_date cleared"
      - "campaign.completion_rate_pct recomputed; campaign.version incremented by 1"
  - method: GET
    path: "/affected-vehicles/{id}/outreach-attempts"
    description: "List outreach attempts for one affected-vehicle row"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: OutreachAttempt[]
    side_effects: []

  # ---- mailing waves ---------------------------------------------------------
  - method: POST
    path: "/recall-campaigns/{id}/notification-waves"
    description: "Plan an owner-notification mailing wave for one region"
    roles: [RecallOperationsManager]
    code: 201
    input: [wave_type, target_region_code, scheduled_mail_date]
    output: NotificationWave
    side_effects:
      - "status PLANNED; sequence_number computed; mailing-separation rule enforced against non-CANCELLED sibling waves in the same region"
  - method: GET
    path: "/recall-campaigns/{id}/notification-waves"
    description: "List the campaign's mailing waves"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["wave_type?", "status?", "limit?", "offset?"]
    output: NotificationWave[]
    side_effects: []
  - method: POST
    path: "/notification-waves/{id}/release"
    description: "Approve a wave for mailing; pins the parts-coverage quota fields"
    roles: [RecallOperationsManager]
    code: 200
    input: []
    output: NotificationWave
    side_effects:
      - "calculation wave_release_quota pins eligible_vehicle_count, parts_capacity_qty, provisional_coverage_ratio, coverage_tier_factor, planned_vehicle_count and parts_coverage_ratio"
      - "status PLANNED -> RELEASE_APPROVED; version incremented by 1"
  - method: POST
    path: "/notification-waves/{id}/mail"
    description: "Drop the wave: stamp the selected owners as notified"
    roles: [RecallOperationsManager]
    code: 200
    input: []
    output: NotificationWave
    side_effects:
      - "the first planned_vehicle_count eligible rows ordered by (Vehicle.production_date ASC, AffectedVehicle.created_at ASC) get notification_wave_id, notice_count + 1, last_notice_type, last_notice_date"
      - "status RELEASE_APPROVED -> MAILED; mailed_vehicle_count and actual_mail_date set"
      - "REMEDY / FOLLOW_UP waves move campaign_status FILED or INTERIM_NOTIFIED -> OWNER_NOTIFIED; campaign.version incremented by 1"
      - "version incremented by 1"
  - method: POST
    path: "/notification-waves/{id}/cancel"
    description: "Cancel a planned or approved wave"
    roles: [RecallOperationsManager]
    code: 200
    input: ["cancel_reason?"]
    output: NotificationWave
    side_effects:
      - "status -> CANCELLED; the wave stops constraining the mailing-separation rule"
      - "campaign.open_followup_wave_count recomputed; campaign.version incremented by 1"
      - "version incremented by 1"

  # ---- dealers, parts, labor -------------------------------------------------
  - method: POST
    path: "/dealers"
    description: "Enroll a servicing dealer"
    roles: [RecallOperationsManager]
    code: 201
    input: [dealer_code, name, region_code, labor_rate_per_hour, monthly_repair_capacity]
    output: Dealer
    side_effects: []
  - method: GET
    path: "/dealers/{id}"
    description: "Read a dealer"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: []
    output: Dealer
    side_effects: []
  - method: POST
    path: "/dealers/{id}/suspend"
    description: "Suspend a dealer from recall work"
    roles: [RecallOperationsManager]
    code: 200
    input: [suspension_reason]
    output: Dealer
    side_effects:
      - "status ACTIVE -> SUSPENDED; existing allocations are retained but new allocations, schedules and claims are refused"
      - "version incremented by 1"
  - method: POST
    path: "/recall-campaigns/{id}/remedy-parts"
    description: "Register the remedy part pool for the campaign"
    roles: [SafetyEngineer]
    code: 201
    input: [part_number, unit_cost, total_procured_qty, "lead_time_days?"]
    output: RemedyPart
    side_effects: ["unallocated_qty initialised to total_procured_qty; consumed_qty 0"]
  - method: GET
    path: "/recall-campaigns/{id}/remedy-parts"
    description: "List the campaign's remedy parts with live pool counters"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["part_number?", "limit?", "offset?"]
    output: RemedyPart[]
    side_effects: []
  - method: POST
    path: "/parts-allocations"
    description: "Allocate remedy parts to a dealer; supersedes that dealer's prior holding on the part. OCC-guarded on the part version"
    roles: [RecallOperationsManager]
    code: 201
    input: [remedy_part_id, dealer_id, requested_qty, expected_part_version]
    output: PartsAllocation
    side_effects:
      - "prior ALLOCATED row for the same (remedy_part_id, dealer_id) -> REVOKED with revoked_reason SUPERSEDED and its uncommitted units returned to the pool"
      - "allocated_qty set by calculation parts_allocation_grant; RemedyPart.unallocated_qty decreased"
      - "increments RemedyPart.version by 1"
  - method: GET
    path: "/parts-allocations/{id}"
    description: "Read one allocation"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: []
    output: PartsAllocation
    side_effects: []
  - method: GET
    path: "/parts-allocations"
    description: "List allocations by part, dealer, campaign or status"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["remedy_part_id?", "dealer_id?", "campaign_id?", "status?", "limit?", "offset?"]
    output: PartsAllocation[]
    side_effects: []
  - method: POST
    path: "/parts-allocations/{id}/revoke"
    description: "Compensating action for an allocation: return uncommitted units to the pool"
    roles: [RecallOperationsManager]
    code: 200
    input: ["revoke_note?"]
    output: PartsAllocation
    side_effects:
      - "status ALLOCATED -> REVOKED with revoked_reason MANUAL; (allocated_qty - consumed_qty) added back to RemedyPart.unallocated_qty; RemedyPart.version incremented by 1"
      - "version incremented by 1"
  - method: POST
    path: "/recall-campaigns/{id}/labor-operations"
    description: "Publish a labor operation code with a closed effective window"
    roles: [SafetyEngineer]
    code: 201
    input: [labor_op_code, description, flat_hours, rate_type, effective_from, effective_to]
    output: LaborOperation
    side_effects: ["closed-interval overlap rule enforced against same-code siblings"]
  - method: GET
    path: "/recall-campaigns/{id}/labor-operations"
    description: "List the campaign's labor operations; effective_on filters to codes whose closed window contains that date"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["labor_op_code?", "effective_on?", "limit?", "offset?"]
    output: LaborOperation[]
    side_effects: []

  # ---- dealer repair claims --------------------------------------------------
  - method: POST
    path: "/repair-claims"
    description: "Dealer submits a completed recall repair for reimbursement"
    roles: [DealerServiceManager]
    code: 201
    input: [affected_vehicle_id, dealer_id, labor_operation_id, repair_date, claimed_labor_hours, parts_used_qty]
    output: RepairClaim
    side_effects:
      - "parts_allocation_id picked by calculation parts_allocation_pick"
      - "provisional_amount_cents = PROVISIONAL variant of calculation claim_reimbursement"
      - "is_repeat_repair set when the AffectedVehicle already has an APPROVED claim; LaborOperation.claim_count incremented"
  - method: GET
    path: "/repair-claims/{id}"
    description: "Read one repair claim"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: []
    output: RepairClaim
    side_effects: []
  - method: GET
    path: "/repair-claims"
    description: "List repair claims by campaign, dealer, affected vehicle, labor operation, allocation or status"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["campaign_id?", "dealer_id?", "affected_vehicle_id?", "labor_operation_id?", "parts_allocation_id?", "status?", "limit?", "offset?"]
    output: RepairClaim[]
    side_effects: []
  - method: POST
    path: "/repair-claims/{id}/audit"
    description: "Auditor approves or rejects a submitted claim; approval fixes the FINAL amount and burns a part"
    roles: [ClaimsAuditor]
    code: 200
    input: [decision, "audit_note?"]
    output: RepairClaim
    side_effects:
      - "APPROVE: final_amount_cents = FINAL variant; AffectedVehicle -> REMEDIED; allocation and part consumed_qty + 1; campaign obligation + final_amount_cents; completion_rate_pct and remedy_effectiveness_score recomputed; campaign.version + 1; RemedyPart.version + 1"
      - "REJECT: status -> REJECTED with no ledger, parts or population effect; LaborOperation.claim_count decremented"
      - "version incremented by 1"
  - method: POST
    path: "/repair-claims/{id}/reverse"
    description: "Auditor reverses an approved claim (audit finding); runs the full compensation cascade"
    roles: [ClaimsAuditor]
    code: 200
    input: [reversal_reason]
    output: RepairClaim
    side_effects:
      - "status APPROVED -> REVERSED; campaign obligation decreased by the stored final_amount_cents"
      - "part unit returned per calculation parts_conservation_invariant"
      - "AffectedVehicle REMEDIED -> UNREPAIRED, then completion_rate_pct recomputed, then a FOLLOW_UP wave auto-created per calculation followup_wave_autoschedule"
      - "campaign.version incremented by 1; version incremented by 1"

  # ---- owner reimbursement ---------------------------------------------------
  - method: POST
    path: "/owner-reimbursements"
    description: "Intake an owner's request for reimbursement of a pre-recall repair"
    roles: [RecallOperationsManager]
    code: 201
    input: [campaign_id, vehicle_id, invoice_date, invoice_amount, labor_hours_claimed, "parts_amount?", "towing_amount?", "documentation_complete?"]
    output: OwnerReimbursementRequest
    side_effects: ["status SUBMITTED; document_round 0; eligibility window checked at intake"]
  - method: GET
    path: "/owner-reimbursements/{id}"
    description: "Read one owner reimbursement request"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: []
    output: OwnerReimbursementRequest
    side_effects: []
  - method: GET
    path: "/owner-reimbursements"
    description: "List owner reimbursement requests by campaign, vehicle, labor operation or status"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["campaign_id?", "vehicle_id?", "labor_operation_id?", "status?", "limit?", "offset?"]
    output: OwnerReimbursementRequest[]
    side_effects: []
  - method: POST
    path: "/owner-reimbursements/{id}/request-documents"
    description: "Auditor asks the owner for missing documentation (bounded at 2 rounds)"
    roles: [ClaimsAuditor]
    code: 200
    input: [requested_items]
    output: OwnerReimbursementRequest
    side_effects:
      - "status SUBMITTED -> DOCUMENTS_REQUESTED; document_round + 1; documentation_complete = false"
      - "version incremented by 1"
  - method: POST
    path: "/owner-reimbursements/{id}/resubmit"
    description: "Intake re-keys the request after the owner responds"
    roles: [RecallOperationsManager]
    code: 200
    input: ["invoice_amount?", "parts_amount?", "towing_amount?", "labor_hours_claimed?", "documentation_complete?"]
    output: OwnerReimbursementRequest
    side_effects:
      - "status DOCUMENTS_REQUESTED -> SUBMITTED; supplied fields overwritten; documentation_complete = true"
      - "version incremented by 1"
  - method: POST
    path: "/owner-reimbursements/{id}/adjudicate"
    description: "Auditor approves (computing the capped amount) or denies the request"
    roles: [ClaimsAuditor]
    code: 200
    input: [decision, "denial_reason?"]
    output: OwnerReimbursementRequest
    side_effects:
      - "APPROVE: labor_operation_id resolved from invoice_date; approved_amount_cents = calculation owner_reimbursement_amount; campaign obligation increased; campaign.version + 1"
      - "DENY: approved_amount_cents = 0 with denial_reason stored"
      - "version incremented by 1"

  # ---- regulatory filings ----------------------------------------------------
  - method: POST
    path: "/recall-campaigns/{id}/filings"
    description: "File the Part 573 defect notice, a quarterly completion report, or an amendment to a quarterly report"
    roles: [ComplianceOfficer]
    code: 201
    input: [filing_type, narrative, "report_period?"]
    output: RegulatoryFiling
    side_effects:
      - "DEFECT_NOTICE: campaign_status DEFECT_DETERMINED -> FILED; campaign.filed_at, days_late and late_filing_flag pinned by calculation filing_deadline"
      - "QUARTERLY: campaign_status OWNER_NOTIFIED -> MONITORING (self-loop when already MONITORING); quarterly_filing_count + 1; remedy_effectiveness_score recomputed and, when below 70.00, remedy_status REMEDY_RELEASED -> REMEDY_REVISED with the full cascade B"
      - "AMENDMENT: the same-period QUARTERLY filing -> AMENDED with amendment_required = false"
      - "completion/effectiveness snapshots frozen onto the new filing; campaign.version incremented by 1"
  - method: GET
    path: "/recall-campaigns/{id}/filings"
    description: "List the campaign's regulatory filings with their frozen snapshots"
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: ["filing_type?", "report_period?", "status?", "limit?", "offset?"]
    output: RegulatoryFiling[]
    side_effects: []

  # ---- test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every deadline, mailing-date and window evaluation reads that default instead of real wall-clock time."
    roles: [SafetyEngineer, ComplianceOfficer, RecallOperationsManager, DealerServiceManager, ClaimsAuditor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; subsequent requests stamp system timestamps from the new value"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the calling role is not listed for the endpoint in 1.5"
  - id: ERR_DEALER_SCOPE_VIOLATION
    http: 403
    condition: "a DealerServiceManager acts with a dealer_id different from its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the defect-determining user files the defect notice, or the remedy-releasing user closes the campaign"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "referenced RecallCampaign id does not exist"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "referenced Vehicle id does not exist"
  - id: ERR_AFFECTED_VEHICLE_NOT_FOUND
    http: 404
    condition: "referenced AffectedVehicle id does not exist"
  - id: ERR_WAVE_NOT_FOUND
    http: 404
    condition: "referenced NotificationWave id does not exist"
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "referenced Dealer id does not exist"
  - id: ERR_PART_NOT_FOUND
    http: 404
    condition: "referenced RemedyPart id does not exist"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "referenced PartsAllocation id does not exist"
  - id: ERR_LABOR_OP_NOT_FOUND
    http: 404
    condition: "referenced LaborOperation id does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "referenced RepairClaim id does not exist"
  - id: ERR_REIMBURSEMENT_NOT_FOUND
    http: 404
    condition: "referenced OwnerReimbursementRequest id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, non-positive amount, malformed date or out-of-range pagination parameter"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "production_start_date >= production_end_date, or effective_from > effective_to"
  - id: ERR_SUPERSEDED_CAMPAIGN_INVALID
    http: 422
    condition: "supersedes_campaign_id points at a campaign in DRAFT, CLOSED or SUPERSEDED"
  - id: ERR_INVALID_CAMPAIGN_STATE
    http: 409
    condition: "the campaign's campaign_status does not permit the requested operation, including any write against a CLOSED or SUPERSEDED campaign"
  - id: ERR_WAVE_INVALID_STATE
    http: 409
    condition: "wave is not PLANNED for release, not RELEASE_APPROVED for mail, or already MAILED/CANCELLED for cancel"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "claim is not SUBMITTED for audit, or not APPROVED for reverse"
  - id: ERR_REIMBURSEMENT_INVALID_STATE
    http: 409
    condition: "reimbursement request is not in the status the requested step needs"
  - id: ERR_ALLOCATION_INVALID_STATE
    http: 409
    condition: "allocation is already REVOKED"
  - id: ERR_VEHICLE_NOT_REPAIRABLE
    http: 409
    condition: "the AffectedVehicle row is UNREACHABLE or REMOVED_FROM_POPULATION for a claim, or not in {UNREPAIRED, UNREACHABLE} for scheduling"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version does not equal the campaign's current version"
  - id: ERR_STALE_PART_VERSION
    http: 412
    condition: "expected_part_version does not equal the remedy part's current version"
  - id: ERR_REMEDY_NOT_AVAILABLE
    http: 409
    condition: "a remedy-dependent operation is attempted while remedy_status is REMEDY_UNDER_DEVELOPMENT or INTERIM_ONLY"
  - id: ERR_REMEDY_ALREADY_AVAILABLE
    http: 409
    condition: "an interim advisory is attempted once a remedy exists (remedy_status is not REMEDY_UNDER_DEVELOPMENT)"
  - id: ERR_STOP_SALE_ACTIVE
    http: 409
    condition: "a vehicle under stop_sale_hold is moved to sale_status SOLD"
  - id: ERR_LABOR_OP_NOT_EFFECTIVE
    http: 422
    condition: "no labor operation of the campaign has a closed effective window containing the relevant date, or the named code's window excludes it"
  - id: ERR_VEHICLE_NOT_IN_POPULATION
    http: 422
    condition: "no AffectedVehicle row links the reimbursement's campaign and vehicle"
  - id: ERR_PART_CAMPAIGN_MISMATCH
    http: 422
    condition: "an allocation or claim mixes entities from different campaigns"
  - id: ERR_DEALER_SUSPENDED
    http: 409
    condition: "the dealer named by an allocation, appointment or claim is SUSPENDED"
  - id: ERR_POPULATION_RULE_OVERLAP
    http: 409
    condition: "a new INCLUDE rule's half-open production window intersects an existing INCLUDE rule with the same plant, model and model year"
  - id: ERR_LABOR_OP_WINDOW_CONFLICT
    http: 409
    condition: "a new labor operation's closed effective window intersects an existing window for the same code, endpoints included"
  - id: ERR_WAVE_MAILING_TOO_CLOSE
    http: 409
    condition: "a new wave's scheduled_mail_date is fewer than 14 whole days from a non-CANCELLED wave in the same campaign and region"
  - id: ERR_WAVE_MAIL_DATE_NOT_REACHED
    http: 409
    condition: "mailing is attempted before the logical clock reaches scheduled_mail_date"
  - id: ERR_REPAIR_DATE_BEFORE_REMEDY
    http: 422
    condition: "repair_date precedes the campaign's remedy release date"
  - id: ERR_REIMBURSEMENT_WINDOW_CLOSED
    http: 422
    condition: "invoice_date falls outside the 365-day lookback / 30-day tail reimbursement window"
  - id: ERR_DUPLICATE_CAMPAIGN_NUMBER
    http: 409
    condition: "campaign_number already exists"
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "vin already exists"
  - id: ERR_DUPLICATE_REPAIR_CLAIM
    http: 409
    condition: "another SUBMITTED or APPROVED claim exists for the same affected vehicle and repair_date"
  - id: ERR_FILING_PERIOD_DUPLICATE
    http: 409
    condition: "a defect notice was already filed, or a filing already exists for the same report_period"
  - id: ERR_NO_QUARTERLY_FILING_TO_AMEND
    http: 422
    condition: "an AMENDMENT filing names a report_period with no SUBMITTED quarterly filing"
  - id: ERR_MAX_DOCUMENT_ROUNDS_EXCEEDED
    http: 409
    condition: "a third document request is attempted on the same reimbursement request"
  - id: ERR_EMPTY_WAVE_POPULATION
    http: 409
    condition: "a wave release finds no eligible owners, or the tier factor floors planned_vehicle_count to 0"
  - id: ERR_CLOSURE_CRITERIA_NOT_MET
    http: 409
    condition: "closure attempted with completion below 95.00, effectiveness below 70.00, fewer than 2 quarterly filings, a revised remedy, or an open wave"
  - id: ERR_INSUFFICIENT_PARTS_COVERAGE
    http: 409
    condition: "provisional_coverage_ratio is below the severity's required minimum at wave release"
  - id: ERR_NO_PARTS_AVAILABLE
    http: 409
    condition: "an allocation would grant zero units, or no allocation of the dealer has an uncommitted unit for a claim"
  - id: ERR_LABOR_HOURS_EXCEED_CAP
    http: 422
    condition: "claimed_labor_hours exceeds flat_hours * 1.5"
  - id: ERR_REIMBURSEMENT_INVOICE_EXCEEDS_MAX
    http: 422
    condition: "invoice_amount exceeds 5000.00"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SafetyEngineer
    description: "Recall engineering: opens campaign files, records the defect determination, defines the affected population, publishes labor operations and remedy parts, releases and revises the remedy, issues interim advisories"
    identity: opaque
    exclusive_operations:
      - "POST /recall-campaigns"
      - "POST /recall-campaigns/{id}/defect-determination"
      - "POST /recall-campaigns/{id}/population-rules"
      - "POST /recall-campaigns/{id}/interim-advisory"
      - "POST /recall-campaigns/{id}/remedy-releases"
      - "POST /recall-campaigns/{id}/labor-operations"
      - "POST /recall-campaigns/{id}/remedy-parts"
    shared_operations:
      - "POST /recall-campaigns/{id}/population-runs (with RecallOperationsManager)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: ComplianceOfficer
    description: "Regulatory filings office: files the Part 573 defect notice, quarterly completion reports and amendments, and closes the campaign. May never file a defect notice for a determination it recorded, nor close a campaign whose remedy it released"
    identity: opaque
    exclusive_operations:
      - "POST /recall-campaigns/{id}/filings"
      - "POST /recall-campaigns/{id}/close"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: RecallOperationsManager
    description: "Campaign operations: ingests build records, plans/releases/mails notification waves, allocates parts to dealers, logs owner outreach, intakes and re-keys owner reimbursement requests, suspends dealers"
    identity: opaque
    exclusive_operations:
      - "POST /vehicles"
      - "PATCH /vehicles/{id}"
      - "POST /dealers"
      - "POST /dealers/{id}/suspend"
      - "POST /recall-campaigns/{id}/notification-waves"
      - "POST /notification-waves/{id}/release"
      - "POST /notification-waves/{id}/mail"
      - "POST /notification-waves/{id}/cancel"
      - "POST /parts-allocations"
      - "POST /parts-allocations/{id}/revoke"
      - "POST /affected-vehicles/{id}/outreach-attempts"
      - "POST /owner-reimbursements"
      - "POST /owner-reimbursements/{id}/resubmit"
    shared_operations:
      - "POST /recall-campaigns/{id}/population-runs (with SafetyEngineer)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: DealerServiceManager
    description: "Franchise dealer service manager acting for one dealership: books appointments and submits repair claims for its own dealer only"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /affected-vehicles/{id}/schedule"
      - "POST /repair-claims"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: ClaimsAuditor
    description: "Warranty audit: approves, rejects and reverses dealer repair claims, and adjudicates owner reimbursement requests"
    identity: opaque
    exclusive_operations:
      - "POST /repair-claims/{id}/audit"
      - "POST /repair-claims/{id}/reverse"
      - "POST /owner-reimbursements/{id}/request-documents"
      - "POST /owner-reimbursements/{id}/adjudicate"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
