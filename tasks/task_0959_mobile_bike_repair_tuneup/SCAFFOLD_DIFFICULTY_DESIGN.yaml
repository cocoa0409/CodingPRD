            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
