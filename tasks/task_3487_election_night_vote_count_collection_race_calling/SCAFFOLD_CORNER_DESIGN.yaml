  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A call with neither X-User-Role nor X-User-ID fails 401 ERR_UNAUTHENTICATED before any role or existence check runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /contests/00000000-0000-4000-8000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED and http status 401 (auth beats the would-be 404)"

      - name: stringer_cannot_create_counties
        claim_type: Violation to Error
        grounds:
          - validations[priority=2]
          - roles.Stringer
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Role denial precedes body validation: a Stringer POSTing a county gets 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Clock set; event exists; Sally on the roster."]
          setup_api_calls:
