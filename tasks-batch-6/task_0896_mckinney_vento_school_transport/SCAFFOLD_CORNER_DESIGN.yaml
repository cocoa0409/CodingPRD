      - name: student_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_STUDENT_NOT_FOUND]"]
        distinguishing_aspect: "GET a student id that does not exist returns 404 ERR_STUDENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /mv/students/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StateCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_STUDENT_NOT_FOUND"

