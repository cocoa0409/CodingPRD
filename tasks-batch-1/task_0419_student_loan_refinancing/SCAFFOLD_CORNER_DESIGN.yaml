              as: Borrower
              as_user_id: "${cb18_id}"
              captures: { locked18: $.data.locked_apr_bps }
          assert:
            - "Offer.${coffer18_id}.estimated_apr_bps == 800 (650 base + 150 NEAR_PRIME surcharge)"
            - "Offer.${coffer18_id}.locked_apr_bps == 775 (800 - 25 autopay - 0 member NONE)"

