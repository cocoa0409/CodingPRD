              as: Couple
              as_user_id: "couple_ir"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400; error_id == ERR_INVALID_REQUEST."

      - name: error_stale_version_on_cancel_duplicate
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[cancel-duplicate-stale-registry-item]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          POST /purchases/{id}/cancel-duplicate with an expected_registry_item_version
          that is one less than the actual RegistryItem.version returns 412
          ERR_STALE_VERSION.
        test_recipe:
          setup:
            - "Wedding W_sv in RSVP_OPEN with RegistryItem R_sv (target=2). One CONFIRMED Purchase P_sv exists; another purchase has just landed (CONFIRMED via STORE_B), bumping RegistryItem.version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_sv", title: "SV Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_sv"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_sv"
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_sv"
            - call: "POST /weddings/${w_id}/registry-items"
              payload: { sku: "GR", title: "Grater", target_quantity: 2, unit_price_cents: 1000 }
              as: Couple
              as_user_id: "couple_sv"
              captures: { r_id: $.data.id }
            - call: "POST /registry-items/${r_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "SV1", purchaser_name: "Lee", quantity: 1, occurred_at: "2027-01-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { p_sv_id: $.data.id }
            - call: "GET /registry-items/${r_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_sv"
              captures: { r_v_pre_second: $.data.version }
            - call: "POST /registry-items/${r_id}/purchases"
              payload: { platform_code: "STORE_B", external_purchase_id: "SV2", purchaser_name: "Mae", quantity: 1, occurred_at: "2027-01-02T11:00:00Z" }
              as: PlatformIntegration
          trigger:
            - call: "POST /purchases/${p_sv_id}/cancel-duplicate"
              payload: { expected_registry_item_version: "${r_v_pre_second}" }
              as: Couple
              as_user_id: "couple_sv"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 412; error_id == ERR_STALE_VERSION."
            - "Purchase.${p_sv_id}.status remains CONFIRMED (no transition)."

  # ---------------------------------------------------------------------------
  # RBAC — role-based access claims
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: platform_integration_cannot_create_wedding
        claim_type: forbidden_role
        grounds:
          - roles[PlatformIntegration]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          PlatformIntegration is not in the roles list for POST /weddings; attempting
          to call it returns 403 ERR_FORBIDDEN.
        test_recipe:
          setup:
            - "No state required."
          setup_api_calls: []
          trigger:
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_x", title: "X Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: PlatformIntegration
              as_user_id: "integ-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 403; error_id == ERR_FORBIDDEN."

      - name: guest_self_cannot_create_other_guest
        claim_type: forbidden_role
        grounds:
          - roles[GuestSelf]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          GuestSelf is not in the roles list for POST /weddings/{id}/guests (only Couple
          can create guests); call returns 403 ERR_FORBIDDEN.
        test_recipe:
          setup:
            - "Wedding W_gs with one Guest G_gs (so GuestSelf has a valid token to authenticate)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_gs", title: "GS Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_gs"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Authn", email: "authn@example.com" }
              as: Couple
              as_user_id: "couple_gs"
              captures: { g_authn_id: $.data.id }
          trigger:
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Sneaky", email: "sneaky@example.com" }
              as: GuestSelf
              as_user_id: "${g_authn_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 403; error_id == ERR_FORBIDDEN."

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: missing_auth
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Request without X-User-Role / X-User-ID headers (or, for GuestSelf, without
          X-Invitation-Token) returns 401 ERR_UNAUTHENTICATED.
        test_recipe:
          setup:
            - "Wedding W_auth with one Guest G_auth."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_au", title: "Auth Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_au"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_au"
              captures: { meal_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Auth", email: "auth@example.com" }
              as: Couple
              as_user_id: "couple_au"
              captures: { g_id: $.data.id }
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_au"
          trigger:
            # GuestSelf without invitation_token → ERR_UNAUTHENTICATED. We omit as_user_id to model "no headers".
            - call: "POST /guests/${g_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_id}" }
              as: GuestSelf
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 401; error_id == ERR_UNAUTHENTICATED."

  # ---------------------------------------------------------------------------
  # Cross-cutting complexity layers — claims for OCC / cascade / derived-field
  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: occ_finalize_seating_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[finalize-seating-stale-wedding]
        excluded_because:
          difficulty_instance: compensating_invariant / purchase_create_cancel_preserves_fulfilled_quantity
          rationale: "OCC stale-version is exercised through both §1.8 transitive_cascade and corner state_machines.error_stale_version_on_finalize_seating; this stub records the layer claim without redundant test_recipe."

      - name: derived_field_total_capacity_recomputed
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Wedding.fields.total_capacity
          - endpoints[POST /weddings/{id}/tables]
        distinguishing_aspect: |
          Wedding.total_capacity is recomputed on Table create; adding a Table with
          capacity=N increases Wedding.total_capacity by N.
        test_recipe:
          setup:
            - "Wedding W_tc with no tables initially."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_tc", title: "TC Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_tc"
              captures: { w_id: $.data.id, cap_before: $.data.total_capacity }
          trigger:
            - call: "POST /weddings/${w_id}/tables"
              payload: { table_number: 1, capacity: 4, kids_only: false }
              as: Couple
              as_user_id: "couple_tc"
            - call: "POST /weddings/${w_id}/tables"
              payload: { table_number: 2, capacity: 6, kids_only: false }
              as: Couple
              as_user_id: "couple_tc"
            - call: "GET /weddings/${w_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_tc"
              captures: { cap_after: $.data.total_capacity }
          assert:
            - "Wedding.${w_id}.total_capacity == 0 before any Table; == 10 after the two Tables (4+6 derived field reconciled)."

      - name: cascade_purchase_cancel_deletes_thank_you
        claim_type: cascading_side_effect
        grounds:
          - state_machines.Purchase.transitions.CONFIRMED_to_CANCELLED
          - entities.ThankYouNote
        excluded_because:
          difficulty_instance: transitive_cascade / purchase_cancel_depth2_recompute_and_notedelete
          rationale: "The Purchase CONFIRMED -> CANCELLED -> ThankYouNote hard-delete chain is exactly the depth-2 cascade asserted in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # Consistency model — immediate writes
  # ---------------------------------------------------------------------------
  - section: consistency
    instances:
      - name: immediate_visibility_of_rsvp_in_meal_summary
        claim_type: immediate
        grounds:
          - calculations.meal_count_aggregation
        distinguishing_aspect: |
          A single POST /guests/{id}/rsvp ATTENDING is immediately visible to
          GET /weddings/{id}/meal-summary (no read-after-write delay).
        test_recipe:
          setup:
            - "Wedding W_im in RSVP_OPEN with one MealOption and one INVITED Guest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_im", title: "IM Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_im"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_im"
              captures: { meal_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "Imm", email: "imm@example.com" }
              as: Couple
              as_user_id: "couple_im"
              captures: { g_id: $.data.id }
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_im"
          trigger:
            - call: "POST /guests/${g_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_id}" }
              as: Couple
              as_user_id: "couple_im"
            - call: "GET /weddings/${w_id}/meal-summary"
              payload: {}
              as: Couple
              as_user_id: "couple_im"
              captures: { summary: $.data }
          assert:
            - "GET /weddings/${w_id}/meal-summary called immediately after the RSVP shows count(meal_id)==1 and total_attendees==1 (immediate consistency)."
