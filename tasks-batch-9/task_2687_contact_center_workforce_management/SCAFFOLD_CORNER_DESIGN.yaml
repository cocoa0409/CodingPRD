            - "e_stale == \"ERR_STALE_PARTNER_VERSION\" with status 412, not ERR_STALE_CYCLE_VERSION and not ERR_PARTNER_NOT_ELIGIBLE"
            - "st_mid == \"PROPOSED\", v_mid == 2 and out_mid == 0"
            - "the retry with ${p1_v2} answers st_ok == \"COMMITTED\", OutsourcePartner.${p1_id}.version becomes 3 and committed_volume_outstanding becomes 20"
            - "IntervalPlan.${ip0_id}.partner_committed_volume becomes 20 and unserved_volume 62 only after the successful commit"

      - name: version_increments_on_every_write_and_only_on_writes
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reforecast-stale-cycle]
          - concurrency_rules[allocation-commit-stale-partner]
          - endpoints[POST /partner-allocations/{partner_allocation_id}/settle]
        distinguishing_aspect: |
          The two OCC parents advance on exactly the writes their §1.2.1 rules name and on nothing
          else. PlanningCycle goes 1 -> 2 on the posture lock -> 3 on the reforecast, while posting
          actuals -- a write to a CHILD IntervalPlan -- leaves it alone. OutsourcePartner goes 1 -> 2
          on the performance report -> 3 on the commit, but settlement does NOT bump it even though
          settlement moves real money onto invoice_total_cents. That asymmetry is the whole point: a
          naive "increment the parent version on any related write" implementation over-bumps and
          breaks every client holding a valid version, and a naive "only bump on my own entity"
          implementation under-bumps and defeats the guard.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; cycle W37-VER with FG-P and its 2026-09-07 grid (2 intervals of 82)."
