scaffold_corner_design:

  # ==========================================================================
  # SECTION 1 — ENTITIES (claim-extraction-guide Table 1)
  # ==========================================================================
  - section: entities
    instances:

      - name: refrigerant_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - endpoints[POST /refrigerants]
          - entities.Refrigerant.fields.refrigerant_code
          - entities.Refrigerant.fields.gwp_100yr
          - entities.Refrigerant.fields.allowed_system_types
          - response_envelope.success
        distinguishing_aspect: "A single POST /refrigerants returns 201 with every declared Refrigerant field echoed inside data, including the array field allowed_system_types; Refrigerant is a common_fields:false catalogue row, so no version field appears."
        test_recipe:
          setup:
            - "Empty database. No refrigerant exists."
          setup_api_calls: []
          trigger:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "data.refrigerant_code == \"R-448A\""
            - "data.trade_name == \"Solstice N40\""
            - "data.gwp_100yr == 1387"
            - "data.safety_class == \"A1\""
            - "data.max_charge_grams == 999999"
            - "data.allowed_system_types == [\"REMOTE\", \"SELF_CONTAINED\"]"
            - "data.id is a non-empty string"
            - "data has no key named version"
            - "meta.api_request_id and meta.api_request_timestamp are present; response_type == \"object\""

      - name: case_model_retrieval_returns_stored_design_inputs
        claim_type: retrieval
        grounds:
          - endpoints[GET /case-models/{id}]
          - entities.CaseModel.fields.application
          - entities.CaseModel.fields.tda_sqft
          - entities.CaseModel.fields.refrigerant_id
        distinguishing_aspect: "GET /case-models/{id} returns exactly the 19 design inputs supplied at creation, unmodified, with tda_sqft preserved as the number 26.4 rather than an integer."
        test_recipe:
          setup:
            - "One Refrigerant R-448A exists."
            - "One CaseModel MDL-MT-8 exists in DRAFT."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          trigger:
            - { call: "GET /case-models/${cm_id}", as: SalesEngineer, as_user_id: "sales-001", payload: {} }
          assert:
            - "HTTP 200"
            - "data.model_code == \"MDL-MT-8\""
            - "data.application == \"DAIRY_MULTIDECK\""
            - "data.temperature_class == \"MT\""
            - "data.system_type == \"REMOTE\""
            - "data.refrigerant_id equals the id returned by POST /refrigerants"
            - "data.nominal_length_ft == 8"
            - "data.tda_sqft == 26.4"
            - "data.charge_grams == 4200"
            - "data.line_set_length_ft == 120"
            - "data.curtain_layers == 2"
            - "data.defrost_cycles_per_day == 4"
            - "data.predecessor_model_id is null"

      - name: case_model_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /case-models]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three CaseModel rows and limit=2, the list returns exactly 2 rows, total_count 3 and has_more true; the second page at offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One Refrigerant R-448A exists."
            - "Three CaseModel rows exist: MDL-MT-8, MDL-MT-6, MDL-HT-12, created in that order."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm1_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-6", application: "DELI_SERVICE", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 6, tda_sqft: 19.8, charge_grams: 3000, line_set_length_ft: 60, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.50, case_air_temp_c: 3.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 11.0, fan_w_per_ft: 9.0, defrost_cycles_per_day: 4 }, captures: { cm2_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-HT-12", application: "PRODUCE_ISLAND", temperature_class: "HT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 12, tda_sqft: 39.6, charge_grams: 5200, line_set_length_ft: 140, door_type: "OPEN", glass_door_count: 0, curtain_layers: 1, discharge_velocity_mps: 0.45, case_air_temp_c: 6.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 10.0, fan_w_per_ft: 8.0, defrost_cycles_per_day: 2 }, captures: { cm3_id: "$.data.id" } }
          trigger:
            - { call: "GET /case-models", as: PlatformAdmin, as_user_id: "admin-001", payload: { limit: 2, offset: 0 } }
            - { call: "GET /case-models", as: PlatformAdmin, as_user_id: "admin-001", payload: { limit: 2, offset: 2 } }
          assert:
            - "First call: HTTP 200, response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "First call: data[0].model_code == \"MDL-MT-8\" and data[1].model_code == \"MDL-MT-6\" (created_at ASC)"
            - "Second call: len(data) == 1, data[0].model_code == \"MDL-HT-12\", total_count == 3, has_more == false, offset == 2"

      - name: case_model_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /case-models/{id}]
          - validations[priority=5]
          - errors[ERR_CASE_MODEL_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown UUID on the CaseModel path yields 404 ERR_CASE_MODEL_NOT_FOUND, not 400 ERR_INVALID_REQUEST and not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database; no CaseModel exists."
          setup_api_calls: []
          trigger:
            - { call: "GET /case-models/00000000-0000-0000-0000-000000000000", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404"
            - "response_type == \"error\""
            - "data.error_id == \"ERR_CASE_MODEL_NOT_FOUND\""

      - name: refrigerant_creation_missing_gwp_field_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /refrigerants]
          - entities.Refrigerant.fields.gwp_100yr
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "gwp_100yr carries no default, so omitting it fails input validation with 400 ERR_INVALID_REQUEST instead of persisting a Refrigerant with a null GWP."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE"] }, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400"
            - "data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /case-models is unaffected; no Refrigerant row was created (a later POST /refrigerants with refrigerant_code R-448A succeeds with 201)"

      - name: case_model_omitted_glass_door_count_defaults_to_zero
        claim_type: defaults
        grounds:
          - entities.CaseModel.fields.glass_door_count
          - endpoints[POST /case-models]
          - validations[priority=17]
        distinguishing_aspect: "glass_door_count is optional with default 0, so an OPEN case created without it is accepted and reads back 0 — the priority-17 door-configuration check sees the defaulted 0, not null."
        test_recipe:
          setup:
            - "One Refrigerant R-448A exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "data.glass_door_count == 0"
            - "data.door_type == \"OPEN\""
            - "data.status == \"DRAFT\""

      - name: case_model_computed_load_fields_null_until_airflow_model
        claim_type: computed_fields
        grounds:
          - entities.CaseModel.fields.total_design_load_w
          - entities.CaseModel.fields.installed_charge_grams
          - calculations.airflow_load_model
          - state_machines.CaseModel.transitions.DRAFT_to_MODELED
        distinguishing_aspect: "All eleven computed airflow/charge fields are null on a freshly created DRAFT CaseModel and are populated only by POST /case-models/{id}/airflow-model — creation itself never runs the load model."
        test_recipe:
          setup:
            - "One Refrigerant R-448A exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "data.curtain_factor is null"
            - "data.velocity_factor is null"
            - "data.infiltration_load_w is null"
            - "data.lighting_load_w is null"
            - "data.fan_load_w is null"
            - "data.defrost_load_w is null"
            - "data.anti_sweat_load_w is null"
            - "data.total_design_load_w is null"
            - "data.installed_charge_grams is null"
            - "data.nameplate_co2e_kg is null"
            - "data.installed_co2e_kg is null"

      - name: case_model_system_fields_generated_by_server
        claim_type: system_fields
        grounds:
          - entities.CaseModel.fields.status
          - entities.CaseModel.fields.design_revision
          - entities.CaseModel.fields.submitted_by_user_id
        distinguishing_aspect: "status, design_revision, version, created_at and submitted_by_user_id are system-sourced: client-supplied values for them are ignored, so the created row still reads DRAFT / 1 / 1 / null."
        test_recipe:
          setup:
            - "One Refrigerant R-448A exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          assert:
            - "HTTP 201"
            - "data.status == \"DRAFT\""
            - "data.design_revision == 1"
            - "data.version == 1"
            - "data.submitted_by_user_id is null"
            - "data.created_at is a non-null ISO-8601 timestamp"

      - name: case_model_unknown_temperature_class_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.CaseModel.fields.temperature_class
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "temperature_class accepts only HT, MT or LT; the unrecognised member FROZEN is rejected at priority 4 with 400 ERR_INVALID_REQUEST before any refrigerant compatibility work happens."
        test_recipe:
          setup:
            - "One Refrigerant R-448A exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "FROZEN", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400"
            - "data.error_id == \"ERR_INVALID_REQUEST\""

      - name: energy_test_pinned_design_revision_immutable_after_engineering_change
        claim_type: immutability
        grounds:
          - entities.EnergyTest.fields.pinned_design_revision
          - entities.EnergyTest.fields.pinned_tda_sqft
          - state_machines.CaseModel.transitions.SUBMITTED_FOR_TEST_to_DRAFT
        distinguishing_aspect: "EnergyTest.pinned_design_revision is written once at scheduling and never re-derived: after an engineering change lifts CaseModel.design_revision to 2, the SCHEDULED test still reads pinned_design_revision 1 and limit_daily_kwh 17.568."
        test_recipe:
          setup:
            - "R-448A, MT standard DOE-2027-RSC-MT (a=0.62, b=1.20) and chamber CH-1 exist."
            - "CaseModel MDL-MT-8 (tda 26.4) is SUBMITTED_FOR_TEST at design_revision 1 and an EnergyTest is SCHEDULED against it."
            - "A refrigerant-transition engineering change is then applied to the model."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /energy-standards", as: ComplianceOfficer, as_user_id: "co-001", payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }, captures: { std_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
            - { call: "POST /case-models/${cm_id}/submit-for-test", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v: "$.data.version" } }
            - { call: "POST /energy-tests", as: TestLabTechnician, as_user_id: "lab-001", payload: { case_model_id: "${cm_id}", test_chamber_id: "${ch_id}", energy_standard_id: "${std_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }, captures: { et_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/engineering-change", as: DesignEngineer, as_user_id: "eng-001", payload: { refrigerant_id: "${ref_id}", charge_grams: 1200, line_set_length_ft: 100, change_note: "Lower-GWP retrofit trial" } }
          trigger:
            - { call: "GET /energy-tests/${et_id}", as: TestLabTechnician, as_user_id: "lab-001", payload: {} }
            - { call: "GET /case-models/${cm_id}", as: TestLabTechnician, as_user_id: "lab-001", payload: {} }
          assert:
            - "First call: HTTP 200, data.pinned_design_revision == 1"
            - "First call: data.pinned_tda_sqft == 26.4 and data.pinned_defrost_cycles_per_day == 4"
            - "First call: data.limit_daily_kwh == 17.568"
            - "First call: data.status == \"SCHEDULED\" (a SCHEDULED test keeps its chamber slot)"
            - "Second call: data.design_revision == 2 and data.status == \"DRAFT\""

      - name: store_plan_line_create_on_unknown_plan_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.StorePlanLine.fields.store_plan_id
          - endpoints[POST /store-plans/{id}/lines]
          - validations[priority=5]
          - errors[ERR_STORE_PLAN_NOT_FOUND]
        distinguishing_aspect: "A StorePlanLine cannot exist without its parent StorePlan: posting a line under an unknown plan id returns 404 ERR_STORE_PLAN_NOT_FOUND at priority 5, ahead of the priority-15 certification check on case_model_id."
        test_recipe:
          setup:
            - "One Refrigerant and one DRAFT CaseModel exist; no StorePlan exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          trigger:
            - { call: "POST /store-plans/00000000-0000-0000-0000-000000000000/lines", as: SalesEngineer, as_user_id: "sales-001", payload: { case_model_id: "${cm_id}", length_ft: 8, quantity: 1 }, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_STORE_PLAN_NOT_FOUND\""

      - name: case_model_predecessor_self_reference_is_traversable
        claim_type: graph
        grounds:
          - entities.CaseModel.fields.predecessor_model_id
          - endpoints[GET /case-models]
          - complexity_profile.relationship_patterns.self_referential
        distinguishing_aspect: "CaseModel.predecessor_model_id is a self-referential FK: the successor stores the predecessor's id and GET /case-models?predecessor_model_id=<pred> returns exactly the one successor row, while the predecessor itself has predecessor_model_id null."
        test_recipe:
          setup:
            - "One Refrigerant R-448A exists."
            - "CaseModel MDL-MT-8 exists (no predecessor); CaseModel MDL-MT-8B names MDL-MT-8 as its predecessor."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm1_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8B", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", predecessor_model_id: "${cm1_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 3600, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm2_id: "$.data.id" } }
          trigger:
            - { call: "GET /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { predecessor_model_id: "${cm1_id}" } }
          assert:
            - "HTTP 200, total_count == 1, len(data) == 1"
            - "data[0].model_code == \"MDL-MT-8B\""
            - "data[0].predecessor_model_id equals the MDL-MT-8 id"
            - "GET /case-models?predecessor_model_id=<MDL-MT-8B id> returns total_count == 0"

  # ==========================================================================
  # SECTION 2 — STATE MACHINES (claim-extraction-guide Table 2)
  # ==========================================================================
  - section: state_machines
    instances:

      - name: case_model_initial_state_is_draft_at_design_revision_one
        claim_type: initial_state
        grounds:
          - entities.CaseModel.fields.status
          - entities.CaseModel.fields.design_revision
          - state_machines.CaseModel.transitions.DRAFT_to_MODELED
        distinguishing_aspect: "A newly created CaseModel enters the machine at DRAFT with design_revision 1 — never at MODELED — so the only legal next call is POST /case-models/{id}/airflow-model."
        test_recipe:
          setup:
            - "One Refrigerant R-448A exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          trigger:
            - { call: "GET /case-models/${cm_id}", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
          assert:
            - "HTTP 200"
            - "data.status == \"DRAFT\""
            - "data.design_revision == 1"
            - "data.version == 1"
            - "GET /case-models?status=DRAFT returns total_count == 1"

      - name: case_model_airflow_model_run_twice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CaseModel.transitions.DRAFT_to_MODELED
          - validations[priority=7]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "DRAFT -> MODELED is the only transition into MODELED, so a second POST /case-models/{id}/airflow-model from MODELED returns 409 ERR_INVALID_STATE_TRANSITION and leaves total_design_load_w at 442.91 and version at 2."
        test_recipe:
          setup:
            - "One Refrigerant R-448A and one CaseModel MDL-MT-8 exist; the airflow model has been run once, so the model is MODELED at version 2."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
          trigger:
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "GET /case-models/${cm_id}", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
          assert:
            - "First call: HTTP 409, data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "Second call: data.status == \"MODELED\""
            - "Second call: data.total_design_load_w == 442.91"
            - "Second call: data.version == 2 (the rejected call bumped nothing)"

      - name: case_model_submit_for_test_before_airflow_model_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CaseModel.transitions.MODELED_to_SUBMITTED_FOR_TEST
          - validations[priority=7]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "The MODELED -> SUBMITTED_FOR_TEST precondition requires total_design_load_w IS NOT NULL, so submitting a DRAFT model whose loads were never computed returns 409 and leaves submitted_by_user_id null."
        test_recipe:
          setup:
            - "One Refrigerant R-448A and one CaseModel MDL-MT-8 in DRAFT exist; the airflow model has NOT been run."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models/${cm_id}/submit-for-test", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "GET /case-models/${cm_id}", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
          assert:
            - "First call: HTTP 409, data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "Second call: data.status == \"DRAFT\", data.submitted_by_user_id is null, data.version == 1"

      - name: compliance_label_issue_pins_index_and_certifies_model
        claim_type: side_effect_execution
        grounds:
          - state_machines.CaseModel.transitions.TESTED_PASS_to_CERTIFIED
          - entities.ComplianceLabel.fields.pinned_lab_rated_index
          - entities.ComplianceLabel.fields.pinned_standard_code
          - calculations.energy_use_index
        distinguishing_aspect: "Issuing the label performs three observable side effects in one request: the label is created ISSUED with pinned_lab_rated_index 0.568 and pinned_standard_code DOE-2027-RSC-MT, and the CaseModel moves TESTED_PASS -> CERTIFIED."
        test_recipe:
          setup:
            - "R-448A, standard DOE-2027-RSC-MT (a=0.62, b=1.20, max_gwp 1500) and chamber CH-1 exist."
            - "CaseModel MDL-MT-8 (tda 26.4) has passed a test measuring 15.0 kWh/24h against limit_daily_kwh 17.568, so it is TESTED_PASS."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /energy-standards", as: ComplianceOfficer, as_user_id: "co-001", payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }, captures: { std_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
            - { call: "POST /case-models/${cm_id}/submit-for-test", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v: "$.data.version" } }
            - { call: "POST /energy-tests", as: TestLabTechnician, as_user_id: "lab-001", payload: { case_model_id: "${cm_id}", test_chamber_id: "${ch_id}", energy_standard_id: "${std_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }, captures: { et_id: "$.data.id" } }
            - { call: "POST /energy-tests/${et_id}/start", as: TestLabTechnician, as_user_id: "lab-001", payload: {} }
            - { call: "POST /energy-tests/${et_id}/complete", as: TestLabTechnician, as_user_id: "lab-001", payload: { measured_kwh_24h: 15.0, measured_defrost_cycles: 4 } }
          trigger:
            - { call: "POST /compliance-labels", as: ComplianceOfficer, as_user_id: "co-001", payload: { case_model_id: "${cm_id}", energy_test_id: "${et_id}", label_code: "LBL-MT-8-A" }, captures: { lbl_id: "$.data.id" } }
            - { call: "GET /case-models/${cm_id}", as: ComplianceOfficer, as_user_id: "co-001", payload: {} }
          assert:
            - "First call: HTTP 201, data.label_status == \"ISSUED\""
            - "First call: data.pinned_design_revision == 1"
            - "First call: data.pinned_lab_rated_index == 0.568"
            - "First call: data.pinned_standard_code == \"DOE-2027-RSC-MT\""
            - "First call: data.issued_by_user_id == \"co-001\" and data.revocation_reason is null"
            - "Second call: data.status == \"CERTIFIED\" and data.version == 5"

      - name: energy_test_start_called_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.EnergyTest.transitions.SCHEDULED_to_RUNNING
          - validations[priority=7]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "POST /energy-tests/{id}/start is not idempotent-by-replay: the second call from RUNNING returns 409 ERR_INVALID_STATE_TRANSITION and the test's version stays at 2 rather than incrementing again."
        test_recipe:
          setup:
            - "R-448A, standard DOE-2027-RSC-MT and chamber CH-1 exist; MDL-MT-8 is SUBMITTED_FOR_TEST; one EnergyTest has been started and is RUNNING."
          setup_api_calls:
