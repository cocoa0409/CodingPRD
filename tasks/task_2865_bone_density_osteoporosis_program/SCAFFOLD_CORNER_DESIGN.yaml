scaffold_corner_design:
  - section: entities
    instances:
      - name: payer_policy_creation_echoes_every_input_field
        claim_type: creation
        grounds:
          - endpoints["POST /bone-density/payer-policies"]
          - entities.PayerPolicy.fields.payer_code
          - entities.PayerPolicy.fields.max_lifetime_screening_scans
        distinguishing_aspect: "A PayerPolicy created with all ten declared inputs returns 201 with every field echoed verbatim under data, including the decimal vfa_requires_height_loss_cm 4.0 and the booleans, and no field is silently coerced or dropped."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-03-02T08:00:00Z."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
          assert:
            - "the trigger response status is 201 and response_type is object"
            - "PayerPolicy.${policy_id}.payer_code == PAY-STD"
            - "PayerPolicy.${policy_id}.name == Standard Bone Health"
            - "PayerPolicy.${policy_id}.baseline_screening_min_interval_months == 24"
            - "PayerPolicy.${policy_id}.high_risk_min_interval_months == 12"
            - "PayerPolicy.${policy_id}.treatment_monitoring_min_interval_months == 12"
            - "PayerPolicy.${policy_id}.vfa_covered == true"
            - "PayerPolicy.${policy_id}.vfa_requires_height_loss_cm == 4.0"
            - "PayerPolicy.${policy_id}.repeat_scan_grace_days == 30"
            - "PayerPolicy.${policy_id}.max_lifetime_screening_scans == 6"
            - "PayerPolicy.${policy_id}.appeal_allowed == false"
      - name: densitometer_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints["GET /bone-density/densitometers/{id}"]
          - entities.Densitometer.fields.status
          - entities.Densitometer.fields.calibration_generation
        distinguishing_aspect: "A GET by id returns exactly the row POST created, with status ACTIVE, cross_cal_factor 1.0, calibration_generation 1, consecutive_qc_pass_count 0, lsc_g_cm2 null and version 1 — a fresh device is readable before any QC or precision work happens."
        test_recipe:
          setup:
            - "One densitometer registered at 2026-03-02T08:00:00Z with no QC runs and no precision assessment."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id }
          trigger:
            - call: "GET /bone-density/densitometers/${dev_a_id}"
              payload: {}
              as: Technologist
              as_user_id: "tech-001"
          assert:
            - "the trigger response status is 200"
            - "Densitometer.${dev_a_id}.serial_number == HLG-0001"
            - "Densitometer.${dev_a_id}.status == ACTIVE"
            - "Densitometer.${dev_a_id}.cross_cal_factor == 1.0"
            - "Densitometer.${dev_a_id}.calibration_generation == 1"
            - "Densitometer.${dev_a_id}.consecutive_qc_pass_count == 0"
            - "Densitometer.${dev_a_id}.lsc_g_cm2 == null"
            - "Densitometer.${dev_a_id}.rms_sd_g_cm2 == null"
            - "Densitometer.${dev_a_id}.precision_degrees_of_freedom == null"
            - "Densitometer.${dev_a_id}.version == 1"
            - "Densitometer.${dev_a_id}.created_at == 2026-03-02T08:00:00Z"
      - name: densitometer_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /bone-density/densitometers"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three devices registered, limit=2&offset=0 returns two rows with total_count 3 and has_more true, and offset=2 returns the single remaining row with has_more false; total_count reports the filtered set size, not the page size."
        test_recipe:
          setup:
            - "Three densitometers HLG-0001, GEL-0002 and HLG-0003 registered in that order at 2026-03-02T08:00:00Z."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id }
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "GEL-0002", manufacturer: "GE_LUNAR", model: "iDXA", site_code: "WEST", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 10, daily_scan_capacity: 8 }
              as: ProgramAdmin
              captures: { dev_b_id: $.data.id }
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0003", manufacturer: "HOLOGIC", model: "Horizon W", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_c_id: $.data.id }
          trigger:
            - call: "GET /bone-density/densitometers?limit=2&offset=0"
              payload: {}
              as: ProgramAdmin
            - call: "GET /bone-density/densitometers?limit=2&offset=2"
              payload: {}
              as: ProgramAdmin
            - call: "GET /bone-density/densitometers?site_code=MAIN"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the first trigger call returns response_type array with 2 rows, total_count 3, limit 2, offset 0 and has_more true"
            - "the second trigger call returns 1 row, total_count 3, offset 2 and has_more false"
            - "the third trigger call returns total_count 2 containing ${dev_a_id} and ${dev_c_id} and not ${dev_b_id}"
      - name: patient_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints["GET /bone-density/patients/{id}"]
          - errors[ERR_PATIENT_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unused id returns 404 ERR_PATIENT_NOT_FOUND in the error envelope under data.error_id, not 200 with a null body and not 422."
        test_recipe:
          setup:
            - "Empty database; no Patient rows exist."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /bone-density/patients/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: Scheduler
          assert:
            - "the trigger response status is 404"
            - "response_type is error and data.error_id is ERR_PATIENT_NOT_FOUND"
      - name: patient_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - endpoints["POST /bone-density/patients"]
          - errors[ERR_INVALID_REQUEST]
          - entities.Patient.fields.mrn
          - entities.Patient.fields.baseline_height_cm
        distinguishing_aspect: "mrn, primary_payer_policy_id, birth_date, sex and baseline_height_cm carry source input with no default, so omitting mrn returns 422 ERR_INVALID_REQUEST and creates nothing; omitting the optional postmenopausal flag in the same shape succeeds."
        test_recipe:
          setup:
            - "One PayerPolicy exists so the FK is satisfiable."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /bone-density/patients"
              payload: { primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", baseline_height_cm: 165.0 }
              as: Scheduler
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-3001", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", baseline_height_cm: 165.0 }
              as: Scheduler
          assert:
            - "the first trigger call returns 422 with data.error_id ERR_INVALID_REQUEST"
            - "the second trigger call returns 201"
            - "GET /bone-density/patients?mrn=MRN-3001 returns total_count 1"
          # the second call also demonstrates that only mrn was missing, not a second defect
      - name: optional_flags_default_to_false_when_omitted
        claim_type: defaults
        grounds:
          - entities.Patient.fields.postmenopausal
          - entities.ScanOrder.fields.vfa_requested
          - entities.RiskFactorProfile.fields.current_smoker
          - entities.RiskFactorProfile.fields.alcohol_units_per_day
        distinguishing_aspect: "Every optional boolean defaults to false and alcohol_units_per_day defaults to 0.0 when omitted, so the FRAX clinical_risk_factor_count of a profile that sends only height and weight is 0 rather than null or an error."
        test_recipe:
          setup:
            - "A PayerPolicy and a Patient created without postmenopausal, then a RiskFactorProfile created with only the two mandatory measurements, then a ScanOrder created without vfa_requested."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-3101", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", baseline_height_cm: 165.0 }
              as: Scheduler
              captures: { pat_id: $.data.id, pat_version: $.data.version }
          trigger:
            - call: "POST /bone-density/patients/${pat_id}/risk-factor-profiles"
              payload: { expected_patient_version: "${pat_version}", height_cm: 165.0, weight_kg: 60.0 }
              as: Scheduler
              captures: { prof_id: $.data.id }
            - call: "POST /bone-density/scan-orders"
              payload: { patient_id: "${pat_id}", indication: "BASELINE_SCREENING", requested_sites: ["FEMORAL_NECK"], requested_scan_date: "2026-03-10" }
              as: Scheduler
              captures: { order1_id: $.data.id }
          assert:
            - "Patient.${pat_id}.postmenopausal == false"
            - "RiskFactorProfile.${prof_id}.prior_fragility_fracture == false"
            - "RiskFactorProfile.${prof_id}.parental_hip_fracture == false"
            - "RiskFactorProfile.${prof_id}.current_smoker == false"
            - "RiskFactorProfile.${prof_id}.glucocorticoid_use == false"
            - "RiskFactorProfile.${prof_id}.rheumatoid_arthritis == false"
            - "RiskFactorProfile.${prof_id}.secondary_osteoporosis == false"
            - "RiskFactorProfile.${prof_id}.alcohol_units_per_day == 0.0"
            - "RiskFactorProfile.${prof_id}.status == ACTIVE"
            - "ScanOrder.${order1_id}.vfa_requested == false"
            - "ScanOrder.${order1_id}.status == REQUESTED"
            - "ScanOrder.${order1_id}.frequency_eligibility == ELIGIBLE"
            - "ScanOrder.${order1_id}.earliest_allowed_date == null"
            - "ScanOrder.${order1_id}.required_densitometer_id == null"
      - name: site_measurement_computed_t_score_ignores_extra_field
        claim_type: computed_fields
        grounds:
          - calculations.site_scores
          - entities.SiteMeasurement.fields.t_score
          - entities.SiteMeasurement.fields.z_score
          - endpoints["POST /bone-density/scan-sessions/{id}/site-measurements"]
        distinguishing_aspect: "t_score and z_score carry source computed, so a request that also sends t_score 9.9 and z_score 9.9 must store the derived -1.7 and -0.4 from the reference means and SDs, not the client's values, and must not fail with ERR_INVALID_REQUEST for the extra keys."
        test_recipe:
          setup:
            - "An IN_PROGRESS ScanSession on a precision-certified device, acquired by tech-001 for a LUMBAR_SPINE order."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id, dev_a_version: $.data.version }
            - call: "POST /bone-density/densitometers/${dev_a_id}/precision-assessment"
              payload: { expected_densitometer_version: "${dev_a_version}", technologist_user_id: "tech-001", patient_count: 30, scans_per_patient: 2, rms_sd_g_cm2: 0.0100 }
              as: ProgramAdmin
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-3201", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /bone-density/scan-orders"
              payload: { patient_id: "${pat_id}", indication: "BASELINE_SCREENING", requested_sites: ["LUMBAR_SPINE"], requested_scan_date: "2026-03-10", vfa_requested: false }
              as: Scheduler
              captures: { order1_id: $.data.id }
            - call: "POST /bone-density/scan-appointments"
              payload: { scan_order_id: "${order1_id}", densitometer_id: "${dev_a_id}", start_utc: "2026-03-10T09:00:00Z", end_utc: "2026-03-10T09:30:00Z" }
              as: Scheduler
              captures: { appt1_id: $.data.id }
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:05:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/scan-appointments/${appt1_id}/scan-sessions"
              payload: { scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { sess1_id: $.data.id }
          trigger:
            - call: "POST /bone-density/scan-sessions/${sess1_id}/site-measurements"
              payload: { site_code: "LUMBAR_SPINE", bmd_g_cm2: 0.9000, area_cm2: 58.20, bmc_g: 52.38, reference_mean_bmd_g_cm2: 1.1000, reference_sd_g_cm2: 0.1200, age_matched_mean_bmd_g_cm2: 0.9500, age_matched_sd_g_cm2: 0.1200, included_vertebrae: ["L1", "L2", "L3", "L4"], t_score: 9.9, z_score: 9.9 }
              as: Technologist
              as_user_id: "tech-001"
              captures: { meas1_id: $.data.id }
          assert:
            - "the trigger response status is 201"
            - "SiteMeasurement.${meas1_id}.t_score == -1.7"
            - "SiteMeasurement.${meas1_id}.z_score == -0.4"
            - "SiteMeasurement.${meas1_id}.valid_vertebral_count == 4"
            - "SiteMeasurement.${meas1_id}.site_usable_for_diagnosis == true"
            - "SiteMeasurement.${meas1_id}.superseded == false"
            - "ScanSession.${sess1_id}.measured_site_count == 1"
      - name: patient_system_fields_ignore_extra_field_input
        claim_type: system_fields
        grounds:
          - endpoints["POST /bone-density/patients"]
          - entities.Patient.common_fields
          - entities.Patient.fields.open_scheduled_order_count
          - entities.Patient.fields.lifetime_screening_scan_count
        distinguishing_aspect: "id, created_at and version are system-generated: a create request that also sends id, created_at 2001-01-01T00:00:00Z and version 77 must return a server-minted id, created_at equal to the logical clock 2026-03-02T08:00:00Z and version 1, and the two counters must start at 0 rather than null."
        test_recipe:
          setup:
            - "One PayerPolicy exists; the logical clock is 2026-03-02T08:00:00Z."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-3301", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0, id: "22222222-2222-2222-2222-222222222222", created_at: "2001-01-01T00:00:00Z", version: 77 }
              as: Scheduler
              captures: { pat_id: $.data.id }
          assert:
            - "the trigger response status is 201"
            - "Patient.${pat_id}.id != 22222222-2222-2222-2222-222222222222"
            - "Patient.${pat_id}.created_at == 2026-03-02T08:00:00Z"
            - "Patient.${pat_id}.version == 1"
            - "Patient.${pat_id}.open_scheduled_order_count == 0"
            - "Patient.${pat_id}.lifetime_screening_scan_count == 0"
            - "Patient.${pat_id}.baseline_report_id == null"
            - "Patient.${pat_id}.next_eligible_scan_date == null"
      - name: write_endpoint_rejects_unknown_enum_and_negative_number
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.ScanOrder.fields.indication
          - entities.Densitometer.fields.daily_scan_capacity
          - entities.SiteMeasurement.fields.site_code
        distinguishing_aspect: "Enum fields accept only their declared members and numeric fields only their declared range, so indication SCREENING_X, daily_scan_capacity -1 and a string where phantom_baseline_bmd_g_cm2 expects a decimal each return 422 ERR_INVALID_REQUEST rather than being stored or coerced."
        test_recipe:
          setup:
            - "One PayerPolicy and one Patient exist so only the offending field is at fault."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-3401", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Scheduler
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /bone-density/scan-orders"
              payload: { patient_id: "${pat_id}", indication: "SCREENING_X", requested_sites: ["FEMORAL_NECK"], requested_scan_date: "2026-03-10", vfa_requested: false }
              as: Scheduler
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0009", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: -1 }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0010", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: "one point zero", phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
          assert:
            - "each of the three trigger calls returns 422 with data.error_id ERR_INVALID_REQUEST"
            - "GET /bone-density/scan-orders?patient_id=${pat_id} returns total_count 0"
            - "GET /bone-density/densitometers returns total_count 0"
      - name: qc_run_and_site_measurement_are_immutable_rows
        claim_type: immutability
        grounds:
          - entities.QcRun.common_fields
          - entities.SiteMeasurement.common_fields
          - entities.PositioningReview.common_fields
          - endpoints["GET /bone-density/qc-runs/{id}"]
        distinguishing_aspect: "QcRun, SiteMeasurement, PositioningReview, AdherenceRefill and PayerPolicy declare common_fields false, so their rows expose id and created_at but no version and no updated_at, and §1.5 declares no PATCH or DELETE for any of them — a QC run once written can only be superseded by a later run, never edited."
        test_recipe:
          setup:
            - "One densitometer with a single passing DAILY_QC run recorded at 2026-03-05T08:00:00Z."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id }
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0100, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { qc1_id: $.data.id }
          trigger:
            - call: "GET /bone-density/qc-runs/${qc1_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the trigger response status is 200"
            - "QcRun.${qc1_id}.created_at == 2026-03-05T08:00:00Z"
