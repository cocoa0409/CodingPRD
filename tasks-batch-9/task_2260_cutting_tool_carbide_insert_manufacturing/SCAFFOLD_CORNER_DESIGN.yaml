              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { err_single: $.data.error_id }
            - call: "POST /tooling/machining-trials/${trial_id}/complete"
              payload: { wear_measurements: [ { minutes: 0, vb_um: 0 }, { minutes: 10, vb_um: 200 }, { minutes: 20, vb_um: 180 } ], measured_surface_ra_um: 1.20 }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { err_decreasing: $.data.error_id }
            - call: "POST /tooling/machining-trials/${trial_id}/complete"
              payload: { wear_measurements: [ { minutes: 0, vb_um: 0 }, { minutes: 12, vb_um: 225 }, { minutes: 24, vb_um: 320 }, { minutes: 30, vb_um: 320 } ], measured_surface_ra_um: 1.20 }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { err_flat: $.data.error_id }
            - call: "POST /tooling/machining-trials/${trial_id}/complete"
              payload: { wear_measurements: [ { minutes: 0, vb_um: 0 }, { minutes: 6, vb_um: 150 }, { minutes: 12, vb_um: 225 }, { minutes: 18, vb_um: 290 }, { minutes: 24, vb_um: 320 }, { minutes: 30, vb_um: 340 } ], measured_surface_ra_um: 1.20 }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { rated: $.data.rated_life_min, verdict: $.data.verdict, status: $.data.status }
          assert:
            - "${err_ghost} == ERR_INVALID_WEAR_CURVE with HTTP status 422, not ERR_TRIAL_NOT_FOUND (priority 5 precedes 7)"
            - "${err_single} == ERR_INVALID_WEAR_CURVE (fewer than two points)"
            - "${err_decreasing} == ERR_INVALID_WEAR_CURVE (vb_um must be non-decreasing)"
            - "${err_flat} == ERR_INVALID_WEAR_CURVE (an equal last pair makes the Taylor projection undefined)"
            - "the final call succeeds with ${status} == COMPLETED, ${rated} == 20.0 and ${verdict} == PASS, and PowderBlendBatch remaining_units is still 160 because none of the rejected calls consumed anything"

      - name: state_error_family_for_coating_runs_and_recondition_jobs
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_COATING_RUN_STATE
          - errors.ERR_INVALID_JOB_STATE
          - validations[priority=12]
          - state_machines.CoatingRun
          - state_machines.ReconditionJob
        distinguishing_aspect: "Two entities that share priority 12 raise their own codes: a second completion of an already COMPLETED coating run raises ERR_INVALID_COATING_RUN_STATE, while a reconditioning job raises ERR_INVALID_JOB_STATE for a skipped step (refurbish before inspect), a jumped step (return before refurbish) and a terminal step (scrap after return)."
        test_recipe:
          setup:
            - "PVD recipe PVD-TIALN-3 with a run CH1 over [2026-08-05T06:00Z, 12:00Z) and the clock advanced past the window"
            - "Regrindable product EM-10-1, customer CU-A ACTIVE with 50000 credit, wheel WH-A AVAILABLE"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-TIALN-3", deposition_type: "PVD", layers: [ { material: "TiAlN", thickness_um: 3.0 } ] }
              as: CoatingEngineer
              captures: { recipe_id: $.data.id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T12:00:00Z", loaded_area_cm2: 2500.00 }
              as: CoatingEngineer
              captures: { run_id: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/coating-runs/${run_id}/complete"
              payload: { adhesion_hf_class: 2, measured_thickness_um: 3.10 }
              as: CoatingEngineer
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-A", spec_code: "D64-C100", initial_life_units: 100000 }
              as: ProductionPlanner
              captures: { wheel_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-A", name: "Kappa Cutters", tier: "STANDARD", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver: $.data.version }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-A", units_received: 10, expected_customer_version: "${c_ver}" }
              as: ProductionPlanner
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /tooling/coating-runs/${run_id}/complete"
              payload: { adhesion_hf_class: 1, measured_thickness_um: 3.05 }
              as: CoatingEngineer
              captures: { err_run: $.data.error_id }
            - call: "POST /tooling/recondition-jobs/${job_id}/refurbish"
              payload: { wheel_id: "${wheel_id}" }
              as: ProductionPlanner
              captures: { err_skip: $.data.error_id }
            - call: "POST /tooling/recondition-jobs/${job_id}/inspect"
              payload: { units_inspected: 10, measured_length_mm: 90.0, measured_corner_wear_um: 210.0 }
              as: ProductionPlanner
            - call: "POST /tooling/recondition-jobs/${job_id}/return"
              payload: { units_returned: 10 }
              as: ProductionPlanner
              captures: { err_jump: $.data.error_id }
            - call: "POST /tooling/recondition-jobs/${job_id}/refurbish"
              payload: { wheel_id: "${wheel_id}", recoat_applied: false }
              as: ProductionPlanner
            - call: "POST /tooling/recondition-jobs/${job_id}/return"
              payload: { units_returned: 10 }
              as: ProductionPlanner
            - call: "POST /tooling/recondition-jobs/${job_id}/scrap"
              payload: { scrap_reason: "Late discovery of core cracking" }
              as: ProductionPlanner
              captures: { err_terminal: $.data.error_id }
          assert:
            - "${err_run} == ERR_INVALID_COATING_RUN_STATE with HTTP status 409, and the run keeps adhesion_hf_class 2 / measured_thickness_um 3.10 from the first completion"
            - "${err_skip} == ERR_INVALID_JOB_STATE (refurbish is not a transition out of RECEIVED) and GrindingWheel.${wheel_id}.consumed_life_units is still 0 at that point"
            - "${err_jump} == ERR_INVALID_JOB_STATE (return is not a transition out of INSPECTED)"
            - "${err_terminal} == ERR_INVALID_JOB_STATE (RETURNED is terminal)"
            - "after the successful refurbish and return: ReconditionJob.${job_id}.status == RETURNED, rebate_cents == 1800 and GrindingWheel.${wheel_id}.consumed_life_units == 200"




  # ===========================================================================
  - section: rbac
    instances:
      - name: exclusive_operations_are_closed_to_every_peer_role
        claim_type: exclusive_operation_denial
        grounds:
          - roles.MetallurgyEngineer.exclusive_operations
          - roles.GeometryEngineer.exclusive_operations
          - roles.QualityApprover.exclusive_operations
          - roles.ProductionPlanner.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The role model is peer-based with no hierarchical override, so each engineering discipline is locked out of the others' exclusive routes: metallurgy cannot define geometry, geometry cannot define grades, application engineering cannot release a product, quality cannot move supply status and coating cannot commission wheels."
        test_recipe:
          setup:
            - "Grade WC-P25, geometry CNMG-MM and product CAT-INS-1 created by their owning roles"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
          trigger:
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-XX", iso_designation: "CNMG120404", application_class: "FINISHING", chipbreaker_code: "FF", rake_angle_deg: 8.0, nose_radius_mm: 0.4, max_depth_of_cut_mm: 2.0, edge_prep: "SHARP" }
              as: MetallurgyEngineer
              captures: { err_geo: $.data.error_id }
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-M20", target_workpiece_group: "M", co_binder_pct: 10.0, wc_grain_um: 1.5, hardness_hv: 1450, trs_mpa: 2400 }
              as: GeometryEngineer
              captures: { err_grade: $.data.error_id }
            - call: "POST /tooling/tool-products/${product_id}/release"
              as: ApplicationEngineer
              captures: { err_release: $.data.error_id }
            - call: "POST /tooling/tool-products/${product_id}/set-supply-status"
              payload: { supply_status: "STOCKED" }
              as: QualityApprover
              captures: { err_supply: $.data.error_id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-Z", spec_code: "D46-C75-B", initial_life_units: 5000 }
              as: CoatingEngineer
              captures: { err_wheel: $.data.error_id }
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: QualityApprover
              captures: { err_pilot: $.data.error_id }
          assert:
            - "all six of ${err_geo}, ${err_grade}, ${err_release}, ${err_supply}, ${err_wheel} and ${err_pilot} == ERR_ROLE_NOT_PERMITTED with HTTP status 403"
            - "exactly one InsertGeometry, one CarbideGrade and zero GrindingWheel rows exist afterwards"
            - "ToolProduct.${product_id} still has release_status DEVELOPMENT, supply_status UNAVAILABLE and an unchanged version"
            - "CarbideGrade.${grade_id}.status is still DEVELOPMENT"

      - name: shared_operations_accept_either_declared_role
        claim_type: shared_operation_access
        grounds:
          - roles.MetallurgyEngineer.shared_operations
          - roles.ProductionPlanner.shared_operations
          - roles.ApplicationEngineer.shared_operations
          - roles.Customer.shared_operations
        distinguishing_aspect: "Shared routes must accept every declared role while the exclusive step wedged between them stays closed: the planner may open and press a blend batch but not sinter it, product definition works from either engineering role, and a Customer may pull speeds-and-feeds advice."
        test_recipe:
          setup:
            - "Grade WC-P25 in DEVELOPMENT and geometry CNMG-MM created by their owning roles"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-B", name: "Lambda Tooling", tier: "PREFERRED", regrind_credit_cents: 0 }
              as: ApplicationEngineer
              captures: { customer_id: $.data.id }
          trigger:
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-P", planned_mass_kg: 120.0 }
              as: ProductionPlanner
              captures: { batch_id: $.data.id, batch_stage: $.data.stage }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: ProductionPlanner
              captures: { pressed_stage: $.data.stage }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: ProductionPlanner
              captures: { err_sinter: $.data.error_id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-AE", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: ApplicationEngineer
              captures: { product_id: $.data.id }
            - call: "GET /tooling/tool-products/${product_id}/speeds-feeds"
              payload: { workpiece_group: "P", machine_rigidity: "RIGID", coolant: "FLOOD" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { cust_vc: $.data.recommended_vc }
          assert:
            - "${batch_stage} == BLENDED and ${pressed_stage} == PRESSED: both shared batch routes work for ProductionPlanner"
            - "${err_sinter} == ERR_ROLE_NOT_PERMITTED with HTTP status 403, because sintering is exclusive to MetallurgyEngineer, and the batch stays PRESSED with qc_status PENDING"
            - "ToolProduct.${product_id} is created 201 by ApplicationEngineer (product definition is shared with GeometryEngineer)"
            - "${cust_vc} == 238 for the Customer-role read"

      - name: dossier_decision_is_closed_to_the_submitter_and_to_every_trial_operator
        claim_type: segregation_of_duties
        grounds:
          - roles.QualityApprover.description
          - state_machines.QualificationDossier.transitions.SUBMITTED_to_APPROVED
          - state_machines.QualificationDossier.transitions.SUBMITTED_to_REJECTED
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Segregation is enforced on identity, not on role: the same QualityApprover role is refused while carrying the submitter's user id or either trial operator's user id, and only an untainted approver id can decide - and this holds for the reject branch too, so the check cannot be implemented on the approve path alone."
        test_recipe:
