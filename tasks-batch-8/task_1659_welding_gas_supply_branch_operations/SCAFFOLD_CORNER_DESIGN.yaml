  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent without the X-User-Role header fails 401 ERR_UNAUTHENTICATED before any role check (trigger omits the role header entirely)."
        test_recipe:
          setup: ["nothing needed"]
          setup_api_calls: []
          trigger:
            - call: "GET /customers"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: price_book_create_forbidden_for_counter_rep
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Price-book management is BranchManager-exclusive; CounterRep gets ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["one customer for the CONTRACT scope"]
          setup_api_calls:
