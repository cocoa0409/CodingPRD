      - name: corner_issuing_a_blocked_form_returns_form_gate_not_met
        claim_type: Violation to Error
        grounds:
          - validations[priority=37]
          - errors[ERR_FORM_GATE_NOT_MET]
          - state_machines.FormRequest.PENDING_to_BLOCKED
          - calculations.form_issuance_gate
        distinguishing_aspect: "A request created BLOCKED cannot be issued directly: POST /form-requests/{id}/issue returns ERR_FORM_GATE_NOT_MET 409 and the row stays BLOCKED with issued_at null, which is what makes the recheck endpoint the only recovery path."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T00:00:00Z after the setup chain"
            - "One PLUS plan, one physician with panel_slot_cap 20.0, one family, one child born 2026-05-20 with zero doses"
