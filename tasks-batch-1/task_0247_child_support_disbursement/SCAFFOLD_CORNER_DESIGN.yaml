# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Child Support Disbursement (State SDU). Breadth probe across §1.1–§1.7.
# All monetary values in cents. excluded_because stubs cite §1.8 by instance name.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_support_order_returns_201_with_derived_fields
        claim_type: Creation
        grounds:
          - entities.SupportOrder
          - endpoints.POST /sdu/support-orders
          - calculations.arrears_distribution_rule_derivation
        distinguishing_aspect: "POST /sdu/support-orders with a NEVER_ASSISTED payee returns 201, obligation_status=ESTABLISHED, enforcement_status=NONE, arrears_distribution_rule=FAMILY_FIRST."
        test_recipe:
          setup:
            - "A NEVER_ASSISTED custodial party and a noncustodial party exist."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA", assistance_status: "NEVER_ASSISTED" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "0001" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
          trigger:
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 30000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
          assert:
            - "SupportOrder.${o_id}.obligation_status == ESTABLISHED"
            - "SupportOrder.${o_id}.enforcement_status == NONE"
            - "SupportOrder.${o_id}.arrears_distribution_rule == FAMILY_FIRST"
            - "SupportOrder.${o_id}.version == 1"

      - name: state_first_rule_derived_for_currently_assisted_payee
        claim_type: Computed Fields
        grounds:
          - entities.SupportOrder.fields.arrears_distribution_rule
          - calculations.arrears_distribution_rule_derivation
        distinguishing_aspect: "A CURRENTLY_ASSISTED payee yields arrears_distribution_rule=STATE_FIRST on order creation."
        test_recipe:
          setup:
            - "A CURRENTLY_ASSISTED custodial party exists."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP SF", state_code: "CA", assistance_status: "CURRENTLY_ASSISTED" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "0002" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
          trigger:
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 30000, assigned_arrears_cents: 5000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
          assert:
            - "SupportOrder.${o_id}.arrears_distribution_rule == STATE_FIRST"

      - name: order_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.SupportOrder.fields.interest_rate_bps
          - entities.SupportOrder.fields.frequency
          - entities.SupportOrder.fields.assigned_arrears_cents
        distinguishing_aspect: "Omitting interest_rate_bps/frequency/assigned_arrears_cents applies defaults 1000/MONTHLY/0."
        test_recipe:
          setup:
            - "A payee and obligor exist."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "0003" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
          trigger:
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 30000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
          assert:
            - "SupportOrder.${o_id}.interest_rate_bps == 1000"
            - "SupportOrder.${o_id}.frequency == MONTHLY"
            - "SupportOrder.${o_id}.assigned_arrears_cents == 0"

      - name: get_support_order_nonexistent_id_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET /sdu/support-orders/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /sdu/support-orders/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /sdu/support-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CaseWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_support_order_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SupportOrder.fields.current_support_cents
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /sdu/support-orders omitting current_support_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A payee and obligor exist."]
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "0004" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
          trigger:
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}" }
              as: CaseWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: ledger_entry_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
          - endpoints.GET /sdu/ledger-entries/{id}
        distinguishing_aspect: "LedgerEntry is common_fields:false (append-only): it exposes id and created_at but no version/updated_at and has no mutating endpoint."
        test_recipe:
          setup:
            - "An activated order has at least one CHARGE ledger entry."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "0005" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 30000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "GET /sdu/ledger-entries?support_order_id=${o_id}"
              payload: {}
              as: CaseWorker
              captures: { le_id: "$.data[0].id" }
          trigger:
            - call: "GET /sdu/ledger-entries/${le_id}"
              payload: {}
              as: CaseWorker
              captures: { le_type: "$.data.entry_type" }
          assert:
            - "LedgerEntry.${le_id}.entry_type == CHARGE"
            - "LedgerEntry.${le_id} response has no version field"

      - name: order_fk_to_nonexistent_payee_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.SupportOrder.fields.custodial_party_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /sdu/support-orders with a custodial_party_id that does not exist returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["An obligor exists; the referenced payee id does not."]
          setup_api_calls:
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "0006" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
          trigger:
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "00000000-0000-0000-0000-000000000000", noncustodial_party_id: "${ncp_id}", current_support_cents: 30000 }
              as: CaseWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: duplicate_fein_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Employer.fields.fein
          - validations[priority=6]
          - errors[ERR_DUPLICATE_FEIN]
        distinguishing_aspect: "Creating a second Employer with an already-used fein returns ERR_DUPLICATE_FEIN (409)."
        test_recipe:
          setup: ["One employer with fein 10-1010101 exists."]
          setup_api_calls:
            - call: "POST /sdu/employers"
              payload: { legal_name: "Emp1", fein: "10-1010101" }
              as: CaseWorker
          trigger:
            - call: "POST /sdu/employers"
              payload: { legal_name: "Emp2", fein: "10-1010101" }
              as: CaseWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_FEIN"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SupportOrder.obligation_status.ESTABLISHED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling activate on an order already ACTIVE returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE order."]
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "0007" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 30000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminate_clean_order_succeeds_and_cascades_iwo_terminated
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SupportOrder.obligation_status.ACTIVE_to_TERMINATED
          - state_machines.IncomeWithholdingOrder.ISSUED_to_TERMINATED
        distinguishing_aspect: "Terminating an ACTIVE order whose arrears_principal_cents and interest_balance_cents are both 0 (only the activation current-support CHARGE exists, which does not block termination) and with no enforcement transitions its ISSUED IWOs to TERMINATED (cascade down)."
        test_recipe:
          setup:
            - "ACTIVE order with only the activation current-support CHARGE (arrears_principal_cents=0, interest_balance_cents=0) and one ISSUED IWO; no enforcement."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "0008" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/employers"
              payload: { legal_name: "Emp", fein: "20-2020202" }
              as: CaseWorker
              captures: { emp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 30000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/income-withholding-orders"
              payload: { support_order_id: "${o_id}", employer_id: "${emp_id}", ordered_amount_cents: 30000, effective_start_at: "2026-01-01T00:00:00Z", effective_end_at: "2027-01-01T00:00:00Z" }
              as: CaseWorker
              captures: { iwo_id: "$.data.id" }
          trigger:
            - call: "POST /sdu/support-orders/${o_id}/terminate"
              payload: {}
              as: CaseWorker
            - call: "GET /sdu/income-withholding-orders/${iwo_id}"
              payload: {}
              as: CaseWorker
              captures: { iwo_status: "$.data.status" }
          assert:
            - "SupportOrder.${o_id}.obligation_status == TERMINATED"
            - "IncomeWithholdingOrder.${iwo_id}.status == TERMINATED"

      - name: allocate_terminal_remittance_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Remittance.RECEIVED_to_ALLOCATED
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: allocate_invalid_state_beats_no_allocable_order
          rationale: "Allocating a RETURNED (terminal) remittance yielding ERR_INVALID_STATE is asserted as the winning error in the named §1.8 priority-conflict instance."

      - name: modification_decide_on_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Modification.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Deciding (approve) a Modification still in DRAFT (not SUBMITTED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE order with a DRAFT modification (not yet submitted)."]
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "0009" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 40000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/modifications"
              payload: { support_order_id: "${o_id}", proposed_current_support_cents: 45000, coverage_start_at: "2026-07-01T00:00:00Z", coverage_end_at: "2026-12-31T00:00:00Z" }
              as: CaseWorker
              captures: { mod_id: "$.data.id" }
          trigger:
            - call: "POST /sdu/modifications/${mod_id}/decide"
              payload: { decision: "APPROVE" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: enforcement_certify_on_withdrawn_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.EnforcementAction.PROPOSED_to_CERTIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Certifying an EnforcementAction that is WITHDRAWN (not PROPOSED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "ACTIVE order, arrears principal 50000, enforcement proposed then withdrawn (back to NONE; action WITHDRAWN)."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "1010" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 50000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${o_id}/post-charge"
              payload: {}
              as: CaseWorker
            - call: "GET /sdu/support-orders/${o_id}"
              payload: {}
              as: CaseWorker
              captures: { o_ver: "$.data.version" }
            - call: "POST /sdu/enforcement-actions"
              payload: { support_order_id: "${o_id}", action_type: "TAX_INTERCEPT", expected_support_order_version: "${o_ver}" }
              as: CaseWorker
              captures: { enf_id: "$.data.id" }
            - call: "POST /sdu/enforcement-actions/${enf_id}/withdraw"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /sdu/enforcement-actions/${enf_id}/certify"
              payload: {}
              as: CaseWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_disbursement_initial_state_pending
        claim_type: Initial State
        grounds:
          - state_machines.Disbursement.PENDING_to_SENT
          - entities.Disbursement.fields.status
        distinguishing_aspect: "A newly created Disbursement starts in PENDING with family_amount_cents computed."
        test_recipe:
          setup:
            - "An allocation slice exists from an allocated remittance on an activated order."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "1011" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/employers"
              payload: { legal_name: "Emp", fein: "21-2121212" }
              as: CaseWorker
              captures: { emp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 20000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/remittances"
              payload: { employer_id: "${emp_id}", noncustodial_party_id: "${ncp_id}", disposable_earnings_cents: 100000, gross_remitted_cents: 20000 }
              as: FinanceOfficer
              captures: { rem_id: "$.data.id" }
            - call: "POST /sdu/remittances/${rem_id}/allocate"
              payload: {}
              as: FinanceOfficer
            - call: "GET /sdu/allocations?remittance_id=${rem_id}"
              payload: {}
              as: FinanceOfficer
              captures: { alloc_id: "$.data[0].id" }
          trigger:
            - call: "POST /sdu/disbursements"
              payload: { support_order_id: "${o_id}", custodial_party_id: "${cp_id}", allocation_id: "${alloc_id}" }
              as: FinanceOfficer
              captures: { disb_id: "$.data.id" }
          assert:
            - "Disbursement.${disb_id}.status == PENDING"
            - "Disbursement.${disb_id}.family_amount_cents == 20000"

  # ===========================================================================
  - section: calculations
    instances:
      - name: ccpa_cap_non_binding_distributable_equals_gross
        claim_type: Correct Result
        grounds:
          - calculations.ccpa_withholding_cap
          - entities.Remittance.fields.distributable_cents
        distinguishing_aspect: "When gross_remitted_cents (50000) <= ccpa_cap_cents (cap_slack variant), distributable_cents == gross_remitted_cents == 50000."
        test_recipe:
          setup:
            - "Obligor with no second family, no arrears (cap tier 0.60); remittance gross 50000, disposable 200000 → cap 120000."
          setup_api_calls:
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "1012" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/employers"
              payload: { legal_name: "Emp", fein: "22-2323232" }
              as: CaseWorker
              captures: { emp_id: "$.data.id" }
          trigger:
            - call: "POST /sdu/remittances"
              payload: { employer_id: "${emp_id}", noncustodial_party_id: "${ncp_id}", disposable_earnings_cents: 200000, gross_remitted_cents: 50000 }
              as: FinanceOfficer
              captures: { rem_id: "$.data.id" }
          assert:
            - "Remittance.${rem_id}.ccpa_cap_cents == 120000"
            - "Remittance.${rem_id}.distributable_cents == 50000"

      - name: interest_accrual_31_days_posts_expected
        claim_type: Constants Applied
        grounds:
          - calculations.arrears_interest_accrual
          - entities.SupportOrder.fields.interest_balance_cents
        distinguishing_aspect: "Simple interest on principal 50000 at 1000 bps for 31 days = round(50000*0.10*31/365) = 425 cents posted to interest_balance_cents."
        test_recipe:
          setup:
            - "ACTIVE order cs=50000, arrears principal 50000 (rolled), clock set 31 days after last accrual."
          setup_api_calls:
            - call: "POST /sdu/_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FinanceOfficer
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "1013" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 50000 }
              as: CaseWorker
              captures: { o_id: "$.data.id" }
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${o_id}/post-charge"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FinanceOfficer
          trigger:
            - call: "POST /sdu/support-orders/${o_id}/accrue-interest"
              payload: {}
              as: FinanceOfficer
              captures: { ib: "$.data.interest_balance_cents" }
          assert:
            - "SupportOrder.${o_id}.interest_balance_cents == 425"

      - name: within_order_waterfall_clears_within_current_support
        claim_type: Correct Result
        grounds:
          - calculations.within_order_waterfall
          - calculations.multi_order_allocation
          - entities.Allocation.fields.current_support_applied_cents
