      - name: offer_state_beats_authority_ceiling
        grounds:
          - validations[priority=9]
          - validations[priority=39]
          - errors[ERR_OFFER_NOT_DRAFT]
          - errors[ERR_AUTHORITY_EXCEEDED]
          - state_machines.SettlementOffer.DRAFT_to_VOIDED
        distinguishing_aspect: |
          The conflicting pair is category `state` (priority 9, ERR_OFFER_NOT_DRAFT) against
          category `business_fiscal` (priority 39, ERR_AUTHORITY_EXCEEDED): one request
          violates both and the state error must win, proven against a control request that
          violates only the fiscal rule and does return ERR_AUTHORITY_EXCEEDED.
        test_recipe:
          setup:
            - "Local 2100 agreement with director ceiling 250000 and negotiator ceiling 1500000."
            - "Clause ART-12, uncapped, supervisor SUP-1, grievant EMP-1, steward STW-1."
            - "One grievance in FILED with a single DRAFT employer offer of 1600000 cents, which lands in the BOARD tier that no role can authorize."
