      - name: transferability_chain_first_match_wins_over_later_matching_rule
        grounds:
          - calculations.asset_transferability_class
          - entities.DigitalAsset.fields.transferability
          - entities.DigitalAsset.fields.transferability_reason
          - entities.Platform.fields.supports_transfer
          - entities.Platform.fields.license_terminates_at_death
        distinguishing_aspect: |
          Four assets on the ONE platform (supports_transfer false, license_terminates_at_death
          false) land on four different (transferability, transferability_reason) pairs decided by
          which rule matches FIRST, not by the platform flags alone: SUBSCRIPTION stops at rule 2
          with CATEGORY_SUBSCRIPTION_LICENCE and never reaches rule 5's PROVIDER_NO_TRANSFER,
          while the CLOUD_STORAGE asset falls through rule 3 to rule 5 and gets exactly that
          reason — and flipping license_terminates_at_death to true moves the same CLOUD_STORAGE
          asset up to rule 3 with reason PROVIDER_LICENCE_TERMINATES.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one platform LockVault with supports_transfer false and license_terminates_at_death false"
            - "one estate with an EXECUTOR fiduciary (letters not required for inventory work)"
            - "four assets on LockVault: SUBSCRIPTION, CLOUD_STORAGE, EMAIL and LOYALTY_PROGRAM"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "LockVault", platform_type: "CLOUD_STORAGE", form_code: "LV-FORM-8", review_window_days: 14, refund_policy: "NONE", supports_online_tool: false, supports_transfer: false, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
