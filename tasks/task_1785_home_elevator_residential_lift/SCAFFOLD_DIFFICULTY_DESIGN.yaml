            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 12, measured_overhead_clearance_inches: 96, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id, proj_v: $.data.version } }
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", expected_project_version: "${proj_v}" }, as: ProjectCoordinator }
            - { call: "POST /api/grant-programs", payload: { program_name: "AccessGrant", funder_name: "State ADA Fund", max_award: 10000.00, income_cap: 60000.00, coverage_percent: 0.40, total_pool: 50000.00, application_open_date: "2026-07-01T00:00:00Z", application_close_date: "2026-12-31T23:59:59Z", eligible_project_types: ["NEW_INSTALLATION"] }, as: DealerAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/grant-applications", payload: { project_id: "${proj}", program_id: "${prog}", household_income: 42000.00 }, as: Homeowner, as_user_id: "u-own-1", captures: { app: $.data.id } }
            - { call: "POST /api/grant-applications/${app}/approve", payload: { verified_income: 42000.00 }, as: GrantOfficer }
          trigger:
            - { call: "POST /api/projects/${proj}/cancel", payload: {}, as: ProjectCoordinator }
          assert:
            - "Project.${proj}.status == CANCELLED (hop 1)"
            - "GrantApplication.${app}.status == WITHDRAWN (hop 2: caused by the project cancel)"
            - "GrantProgram.${prog}.remaining_pool == 50000.00 (hop 3: pool credit caused by the withdrawal)"
            - "GrantProgram.${prog}.status == OPEN"

      - name: grant_approve_pool_exhaustion_cascade
        grounds:
          - state_machines.GrantApplication.SUBMITTED_to_APPROVED
          - state_machines.GrantProgram.OPEN_to_EXHAUSTED
        distinguishing_aspect: |
          Depth-3 cascade from a third trigger (grant approve): application APPROVED ->
          remaining_pool debited to exactly 0 -> program OPEN -> EXHAUSTED (a status
          mutation on the program caused by the pool reaching zero, not by the approve
          directly); the second award is clamped to the remaining pool (5000.00).
        test_recipe:
          setup:
            - "Two QUOTED projects (price 33000.00 each) for the same homeowner"
            - "One program: max_award 10000.00, coverage 0.50, pool 15000.00"
            - "Application A1 on project 1 already APPROVED (award 10000.00; pool 5000.00)"
          setup_api_calls:
