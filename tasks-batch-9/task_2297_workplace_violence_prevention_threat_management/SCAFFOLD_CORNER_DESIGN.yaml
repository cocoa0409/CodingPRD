              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", reporter_employee_id: "${rep_id}", subject_employee_id: "${subj_id}", channel: "WEB_FORM", occurred_at: "2026-07-30T14:00:00Z", narrative: "Co-worker brandished a box cutter during a shift handover argument.", incident_type: "TYPE_3_COWORKER", weapon_involved: true, injury_level: "FIRST_AID" }
              as: Employee
              as_user_id: "${rep_id}"
              captures: { rep_report_id: $.data.id }
            - call: "POST /incident-reports/${rep_report_id}/triage"
              payload: { disposition: "ESCALATE", triage_note: "Weapon present; convening the threat assessment team." }
              as: SafetyOfficer
              as_user_id: "${so_id}"
            - call: "POST /threat-cases"
              payload: { incident_report_id: "${rep_report_id}", lead_employee_id: "${lead_id}" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${lead_id}", discipline: "HR", role_on_team: "LEAD" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_hr_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${sec_id}", discipline: "SECURITY", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_sec_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${ops_id}", discipline: "OPERATIONS", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_ops_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${clin_id}", discipline: "CLINICAL", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_clin_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${legal_id}", discipline: "LEGAL", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_legal_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/convene"
              payload: { convene_note: "Five disciplines seated; opening round 1." }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "ELEVATED", rationale: "Shift overlap keeps the two employees in contact." }
              as: ThreatTeamMember
              as_user_id: "${ops_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "IMMINENT", rationale: "Weapon on site and no badge control at the front desk." }
              as: ThreatTeamMember
              as_user_id: "${sec_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "ELEVATED", rationale: "Pattern of escalating verbal conflict on file." }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "MONITOR", rationale: "No clinical indicators of imminent harm." }
              as: ThreatTeamMember
              as_user_id: "${clin_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "IMMINENT", rationale: "Conduct is chargeable; restraining order is viable." }
              as: ThreatTeamMember
              as_user_id: "${legal_id}"
          trigger:
            - call: "POST /threat-cases/${case_id}/decide"
              payload: { disposition: "MONITOR" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { err: $.data.error_id }
            - call: "POST /threat-cases/${case_id}/decide"
              payload: { disposition: "ELEVATED_RISK" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
          assert:
            - "The first trigger call returns HTTP 409 with $.data.error_id == ERR_DISPOSITION_BAND_MISMATCH"
            - "After the rejected call, ThreatCase.${case_id}.status is still DELIBERATION with consensus_risk_score null, disposition null and risk_band HIGH from the interim score band only"
            - "After the rejected call, TeamAssignment.${seat_sec_id}.ballot_share is still null"
            - "The second trigger call returns HTTP 200 with consensus_risk_score == 60.94 and risk_band == HIGH"
            - "ThreatCase.${case_id}.status == MONITORING with disposition == ELEVATED_RISK"
            - "TeamAssignment.${seat_sec_id}.ballot_share == 24.56 and TeamAssignment.${seat_ops_id}.ballot_share == 9.83"
      - name: module_scope_mismatch_on_training_assignment_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors[ERR_MODULE_SCOPE_MISMATCH]
          - entities.TrainingModule.fields.job_function_scope
          - entities.Employee.fields.job_function
          - concurrency_rules[training-assignment-create-stale-employee]
          - endpoints[POST /training-assignments]
        distinguishing_aspect: |
          Both FKs resolve and the OCC guard is satisfied, yet the pair is incoherent: a SECURITY
          employee cannot be assigned a module scoped to ADMIN, so priority 32 returns
          ERR_MODULE_SCOPE_MISMATCH and - crucially - Employee.version is NOT bumped, because the version
          increment is a side effect of a successful create only.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Worksite \"North Plant\" with one WorkArea."
            - "Two Employees: \"Priya Nair\" (SECURITY) backing the HRPartner role and \"Sam Okoye\" (SECURITY) at version 1."
            - "One TrainingModule WVP-ADMIN with job_function_scope [\"ADMIN\"]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Front Desk", job_function: "CASH_HANDLING", public_access_flag: true, lone_worker_flag: false, night_shift_flag: true, occupancy_cap: 8 }
              as: ProgramAdmin
              captures: { wa_front_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Priya Nair", job_function: "SECURITY" }
              as: ProgramAdmin
              captures: { hr_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Sam Okoye", job_function: "SECURITY" }
              as: ProgramAdmin
              captures: { sam_id: $.data.id, sam_id_v: $.data.version }
            - call: "POST /training-modules"
              payload: { code: "WVP-ADMIN", job_function_scope: ["ADMIN"], scenario_set_version: "2026.1", refresh_interval_days: 365, passing_score: 80, required_for_escort: false }
              as: ProgramAdmin
              captures: { mod_adm_id: $.data.id }
          trigger:
            - call: "POST /training-assignments"
              payload: { employee_id: "${sam_id}", module_id: "${mod_adm_id}", due_at: "2026-08-20T00:00:00Z", expected_employee_version: "${sam_id_v}" }
              as: HRPartner
              as_user_id: "${hr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The trigger returns HTTP 409 with $.data.error_id == ERR_MODULE_SCOPE_MISMATCH"
            - "$.data.error_id is NOT ERR_STALE_EMPLOYEE_VERSION - expected_employee_version matched exactly"
            - "Employee.${sam_id}.version is still ${sam_id_v} - a rejected create bumps nothing"
            - "Employee.${sam_id}.training_current is still false"
            - "GET /training-assignments?employee_id=${sam_id} returns total_count 0"
