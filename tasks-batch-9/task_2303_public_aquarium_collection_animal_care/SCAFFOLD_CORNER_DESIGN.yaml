- section: rbac
  instances:
  - name: rbac_permit_officer_prepares_but_never_decides_a_permit
    claim_type: Exclusive Operations
    grounds:
    - §1.7 PermitOfficer exclusive_operations (POST /aquarium/permits, POST /aquarium/permits/{id}/submission)
    - §1.7 ComplianceDirector exclusive_operations (POST /aquarium/permits/{id}/decisions)
    - §1.6 ERR_UNAUTHORIZED (403)
    - §1.4 priority 3
    distinguishing_aspect: The officer who assembles and files the dossier is forbidden from issuing it — 403 — while the director who may issue it is equally forbidden from filing it. The pair is a structural separation, not an ordering rule.
    test_recipe:
      setup:
      - A WILD_COLLECTION request in PENDING_PERMIT with a DRAFT IMPORT permit carrying the three base documents. Clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
