# =============================================================================
# Scaffold: Credit Union Service Organization (CUSO) & Loan Participation Network
# =============================================================================

scenario: |
  Credit Union Service Organization & Loan Participation Network (credit union CUSO):
  CUSO investment limit & regulatory approval, participation offering & credit due
  diligence by buyer, servicing agreement & remittance timing, concentration limits
  by originator, loss sharing & repurchase triggers, documentation exceptions & cure
  period, portfolio surveillance & reporting to participants, exam findings &
  remediation

domain_name: credit-union-cuso-participation
api_prefix: /network

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - ops_run_checkpoint          # POST /network/sweeps/run advances late-remittance, cure-deadline, offering-expiry epochs
    - optimistic_concurrency      # OCC on ServicingAgreement.version for surveillance report create-with-supersede
    - dual_variant_calculation    # day-count interest variants; WAC weighting variants; loss-basis variants
    - cascading_side_effects      # remittance -> agreement -> offering chain; exam -> CUSO -> agreement -> offering chain
  entity_topology: flat           # all entities are peers linked by FK references; URLs are flat (/network/<collection>)
  state_machine_shape: cyclic     # DocumentationException cure-reject-resubmit loop; ExamFinding reopen loop; ServicingAgreement ACTIVE<->DELINQUENT
  relationship_patterns:
    - one_to_many
    - cross_aggregate             # concentration spans CreditUnion x CreditUnion through Offering -> ServicingAgreement
  role_model: segregation_of_duties  # finding recorder cannot verify own finding; cure submitter (originator) vs verifier (buyer)
  consistency_model: immediate    # all side effects atomic within the triggering request
  difficulty_level: Expert

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CreditUnion
    parent: null
    common_fields: true
    fields:
      - { name: charter_number, type: string, source: input, description: "NCUA charter number; unique across the network" }
      - { name: legal_name, type: string, source: input, description: "Credit union legal name" }
      - { name: cu_type, type: enum, source: input, description: "ORIGINATOR | BUYER | DUAL" }
      - { name: total_assets_cents, type: integer, source: input, description: "Total assets in cents; drives CUSO investment caps" }
      - { name: net_worth_cents, type: integer, source: input, description: "Net worth in cents; drives concentration cap and enhanced-basis eligibility" }
      - { name: concentration_cap_pct, type: number, source: input, default: 0.25, description: "Max share of net worth exposed to a single originator (default 0.25)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }
      - { name: net_worth_ratio, type: number, source: computed, description: "= net_worth_cents / total_assets_cents (unrounded ratio)" }
      - { name: total_committed_principal_cents, type: integer, source: computed, default: 0, description: "Sum of committed_amount_cents over this CU's certificates in status {PENDING_DILIGENCE, COMMITTED, ACTIVE, EXCEPTION}" }

  - name: CUSO
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "CUSO legal name" }
      - { name: service_line, type: enum, source: input, description: "LENDING | PAYMENTS | COMPLIANCE | TECHNOLOGY" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED (cascade-driven by exam findings)" }
      - { name: total_approved_investment_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over CUSOInvestments in APPROVED targeting this CUSO" }
      - { name: open_critical_finding_count, type: integer, source: computed, default: 0, description: "Count of ExamFindings with severity CRITICAL and status in {OPEN, VERIFYING, REOPENED} on exams of this CUSO" }

  - name: CUSOInvestment
    parent: null
    common_fields: true
    fields:
      - { name: credit_union_id, type: string, source: input, description: "FK -> CreditUnion.id; the investing credit union (must equal caller X-User-ID for TreasuryUser)" }
      - { name: cuso_id, type: string, source: input, description: "FK -> CUSO.id" }
      - { name: amount_cents, type: integer, source: input, description: "Investment amount; must be > 0" }
      - { name: approval_basis, type: enum, source: input, default: STANDARD, description: "STANDARD (<= base cap) | ENHANCED (> base cap, requires well-capitalized CU and no open CRITICAL findings on the CUSO)" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | APPROVED | REJECTED | RESCINDED" }
      - { name: post_approval_aggregate_cents, type: integer, source: computed, description: "Aggregate approved investment of the CU including this investment, stamped at approve time" }
      - { name: decided_at, type: datetime, source: system, description: "Clock timestamp of approve/reject; null until decided" }

  - name: ServicingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: cuso_id, type: string, source: input, description: "FK -> CUSO.id; the servicing CUSO (must equal caller X-User-ID for CUSOOfficer)" }
      - { name: originator_id, type: string, source: input, description: "FK -> CreditUnion.id; must have cu_type ORIGINATOR or DUAL" }
      - { name: servicing_fee_bps, type: integer, source: input, description: "Annualized servicing fee in basis points of beginning-of-period outstanding principal" }
      - { name: remittance_due_day, type: integer, source: input, constraints: "1..28", description: "Day of month remittances are due (month following each period)" }
      - { name: grace_period_days, type: integer, source: input, default: 0, description: "Days after due_at before the sweep escalates a SCHEDULED remittance to LATE_UNPAID" }
      - { name: cure_period_days, type: integer, source: input, default: 30, description: "Days a documentation exception may remain open before escalation" }
      - { name: day_count_convention, type: enum, source: input, description: "THIRTY_360 | ACT_360; selects the accrued_interest / fee day-count variant" }
      - { name: late_remittance_threshold, type: integer, source: input, default: 2, description: "Number of currently-LATE_UNPAID remittances that flips the agreement to DELINQUENT" }
      - { name: late_remittance_count, type: integer, source: system, default: 0, description: "Current count of remittances in LATE_UNPAID across this agreement's certificates" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | DELINQUENT | SUSPENDED | TERMINATED" }

  - name: ParticipationOffering
    parent: null
    common_fields: true
    fields:
      - { name: servicing_agreement_id, type: string, source: input, description: "FK -> ServicingAgreement.id" }
      - { name: pool_name, type: string, source: input, description: "Human-readable pool name" }
      - { name: pool_principal_cents, type: integer, source: input, description: "Total loan principal offered for participation; > 0" }
      - { name: min_share_pct, type: number, source: input, description: "Minimum commitment as a fraction of pool_principal_cents (e.g. 0.01)" }
      - { name: yield_rate_bps, type: integer, source: input, description: "Annualized pool yield passed to participants, basis points" }
      - { name: loss_basis, type: enum, source: input, default: OUTSTANDING, description: "OUTSTANDING (pro-rata by current outstanding_principal_cents) | COMMITTED (pro-rata by committed_amount_cents)" }
      - { name: open_at, type: datetime, source: input, description: "Commitment window start (inclusive)" }
      - { name: close_at, type: datetime, source: input, description: "Commitment window end (inclusive); must be > open_at" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | SUSPENDED | CLOSED | EXPIRED | WITHDRAWN" }
      - { name: committed_principal_cents, type: integer, source: computed, default: 0, description: "Sum of committed_amount_cents over certificates in {PENDING_DILIGENCE, COMMITTED, ACTIVE, EXCEPTION}" }
      - { name: remaining_principal_cents, type: integer, source: computed, description: "= pool_principal_cents - committed_principal_cents" }

  - name: ParticipationCertificate
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> ParticipationOffering.id" }
      - { name: buyer_id, type: string, source: system, description: "FK -> CreditUnion.id; set from caller X-User-ID (BuyerUser); input ignored" }
      - { name: committed_amount_cents, type: integer, source: input, description: "Committed participation principal; > 0" }
      - { name: share_pct, type: number, source: computed, description: "= committed_amount_cents / offering.pool_principal_cents" }
      - { name: status, type: enum, source: system, default: PENDING_DILIGENCE, description: "PENDING_DILIGENCE | COMMITTED | ACTIVE | EXCEPTION | PAID_OFF | DECLINED | RESCINDED | REPURCHASED" }
      - { name: funded_amount_cents, type: integer, source: system, default: 0, description: "= committed_amount_cents once funded" }
      - { name: outstanding_principal_cents, type: integer, source: system, default: 0, description: "Current principal; set to committed at funding; reduced by remittance principal portions, loss allocations, repurchase" }
      - { name: cumulative_interest_cents, type: integer, source: system, default: 0, description: "Lifetime interest remitted" }
      - { name: cumulative_loss_cents, type: integer, source: system, default: 0, description: "Lifetime loss allocated" }
      - { name: diligence_decision_at, type: datetime, source: system, description: "Clock timestamp of diligence approve/decline; null until decided" }
      - { name: funded_at, type: datetime, source: system, description: "Clock timestamp of funding; null until ACTIVE; anchors repurchase accrual when no remittances exist" }

  - name: DocumentationException
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> ParticipationCertificate.id" }
      - { name: exception_type, type: enum, source: input, description: "MISSING_NOTE | STALE_APPRAISAL | INSURANCE_LAPSE | UCC_FILING_GAP" }
      - { name: description, type: string, source: input, description: "Free-text description of the documentation gap" }
      - { name: detected_at, type: datetime, source: system, description: "Clock timestamp at creation" }
      - { name: cure_deadline, type: datetime, source: computed, description: "= detected_at + agreement.cure_period_days (calendar days)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CURE_SUBMITTED | REJECTED | CURED | ESCALATED" }
      - { name: cure_notes, type: string, source: system, description: "Notes from the latest cure submission; null until submitted" }
      - { name: cure_attempt_count, type: integer, source: system, default: 0, description: "Number of cure submissions (increments on every submit-cure)" }

  - name: Remittance
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> ParticipationCertificate.id" }
      - { name: period_start, type: datetime, source: input, description: "Period start date (inclusive), 00:00:00Z" }
      - { name: period_end, type: datetime, source: input, description: "Period end date (inclusive), 00:00:00Z; must be >= period_start" }
      - { name: collections_cents, type: integer, source: input, description: "Total borrower collections for the period; must be >= interest + servicing fee" }
      - { name: due_at, type: datetime, source: computed, description: "= agreement.remittance_due_day of the month following period_end's month, 00:00:00Z" }
      - { name: interest_portion_cents, type: integer, source: computed, description: "Accrued interest for the period (see accrued_interest calculation)" }
      - { name: servicing_fee_cents, type: integer, source: computed, description: "Servicing fee for the period (see remittance_settlement calculation)" }
      - { name: principal_portion_cents, type: integer, source: computed, description: "= collections_cents - interest_portion_cents - servicing_fee_cents" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Late penalty stamped at pay time; 0 when paid on or before due_at" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PAID | PAID_LATE | LATE_UNPAID | REVERSED" }
      - { name: paid_at, type: datetime, source: system, description: "Clock timestamp of payment; null until paid" }

  - name: SurveillanceReport
    parent: null
    common_fields: true
    fields:
      - { name: servicing_agreement_id, type: string, source: input, description: "FK -> ServicingAgreement.id" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end (inclusive); must be >= period_start" }
      - { name: weighting_basis, type: enum, source: input, default: OUTSTANDING, description: "OUTSTANDING | COMMITTED; selects the WAC weighting variant" }
      - { name: status, type: enum, source: system, default: CURRENT, description: "CURRENT | SUPERSEDED (creating a new report supersedes the prior CURRENT one)" }
      - { name: total_outstanding_principal_cents, type: integer, source: computed, description: "Sum of outstanding_principal_cents over the agreement's certificates in {ACTIVE, EXCEPTION}" }
      - { name: active_certificate_count, type: integer, source: computed, description: "Count of the agreement's certificates in {ACTIVE, EXCEPTION}" }
      - { name: weighted_avg_yield_bps, type: integer, source: computed, description: "Pool WAC over {ACTIVE, EXCEPTION} certificates; see surveillance_pool_aggregates" }
      - { name: delinquent_remittance_count, type: integer, source: computed, description: "Count of remittances in LATE_UNPAID across the agreement's certificates at creation time" }

  - name: RegulatoryExam
    parent: null
    common_fields: true
    fields:
      - { name: cuso_id, type: string, source: input, description: "FK -> CUSO.id" }
      - { name: start_date, type: datetime, source: input, description: "Exam window start (inclusive), 00:00:00Z" }
      - { name: end_date, type: datetime, source: input, description: "Exam window end (exclusive), 00:00:00Z; half-open [start_date, end_date); must be > start_date" }
      - { name: status, type: enum, source: system, default: IN_PROGRESS, description: "IN_PROGRESS | FINALIZED" }
      - { name: finalized_at, type: datetime, source: system, description: "Clock timestamp of finalization; null until finalized" }

  - name: ExamFinding
    parent: null
    common_fields: true
    fields:
      - { name: exam_id, type: string, source: input, description: "FK -> RegulatoryExam.id" }
      - { name: severity, type: enum, source: input, description: "LOW | MODERATE | HIGH | CRITICAL" }
      - { name: description, type: string, source: input, description: "Finding description" }
      - { name: remediation_due_date, type: datetime, source: input, description: "Date by which remediation must be verified" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recording RegulatorUser; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | VERIFYING | REOPENED | CLOSED" }
      - { name: remediation_notes, type: string, source: system, description: "Notes from the latest remediation submission; null until submitted" }

  - name: LossEvent
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> ParticipationOffering.id" }
      - { name: loss_amount_cents, type: integer, source: input, description: "Realized pool loss to allocate; > 0" }
      - { name: defaulted_at, type: datetime, source: input, description: "Date of borrower default" }
      - { name: loss_basis_used, type: enum, source: system, description: "OUTSTANDING | COMMITTED; copied from offering.loss_basis at allocation" }
      - { name: allocations, type: array, source: computed, description: "[{ certificate_id, allocated_cents }] per certificate in {ACTIVE, EXCEPTION}; see loss_share_allocation" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | ALLOCATED" }

  - name: RepurchaseCase
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> ParticipationCertificate.id" }
      - { name: trigger_reason, type: enum, source: input, description: "DOCUMENTATION_DEFAULT | MATERIAL_BREACH | FRAUD; system sets DOCUMENTATION_DEFAULT when auto-created from an ESCALATED exception" }
      - { name: documentation_exception_id, type: string, source: system, description: "FK -> DocumentationException.id; set only for auto-created cases; null for buyer-created cases" }
      - { name: repurchase_price_cents, type: integer, source: computed, description: "Stamped at completion; see repurchase_price calculation" }
      - { name: status, type: enum, source: system, default: TRIGGERED, description: "TRIGGERED | DISPUTED | COMPLETED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CreditUnion
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /network/credit-unions/{id}/suspend"
        actor: NetworkAdmin
        preconditions: ["CreditUnion in ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["Gates: new commitments by this buyer, offering open by this originator (ERR_CREDIT_UNION_NOT_ACTIVE)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /network/credit-unions/{id}/reinstate"
        actor: NetworkAdmin
        preconditions: ["CreditUnion in SUSPENDED (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: CUSO
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade of POST /network/exams/{id}/finalize when open_critical_finding_count >= 1)"
        actor: system
        preconditions: ["Exam being finalized belongs to this CUSO and has >= 1 finding with severity CRITICAL and status in {OPEN, VERIFYING, REOPENED}"]
        side_effects:
          - "Every ServicingAgreement of this CUSO in ACTIVE -> SUSPENDED"
          - "Every ParticipationOffering of each such agreement in OPEN -> SUSPENDED (no certificate mutation; funding/opening gated while SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade of POST /network/findings/{id}/verify with pass=true when that finding was the last open CRITICAL finding)"
        actor: system
        preconditions: ["After the verify, CUSO.open_critical_finding_count == 0"]
        side_effects:
          - "Every ServicingAgreement of this CUSO in SUSPENDED -> ACTIVE"
          - "Every ParticipationOffering of each such agreement in SUSPENDED -> OPEN"

  - entity: CUSOInvestment
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, RESCINDED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /network/cuso-investments/{id}/approve"
        actor: RegulatorUser
        preconditions:
          - "Investment in PENDING_REVIEW (else ERR_INVALID_STATE)"
          - "investment_cap_check passes (else ERR_INVESTMENT_CAP_EXCEEDED or ERR_ENHANCED_BASIS_NOT_ELIGIBLE)"
        side_effects:
          - "post_approval_aggregate_cents stamped; decided_at = clock"
          - "CUSO.total_approved_investment_cents recomputed"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /network/cuso-investments/{id}/reject"
        actor: RegulatorUser
        preconditions: ["Investment in PENDING_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: ["decided_at = clock"]
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /network/cuso-investments/{id}/rescind"
        actor: TreasuryUser
        preconditions:
          - "Investment in APPROVED (else ERR_INVALID_STATE)"
          - "Caller X-User-ID == investment.credit_union_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["CUSO.total_approved_investment_cents recomputed"]

  - entity: ServicingAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /network/servicing-agreements/{id}/activate"
        actor: CUSOOfficer
        preconditions:
          - "Agreement in DRAFT (else ERR_INVALID_STATE)"
          - "CUSO in ACTIVE (else ERR_CUSO_SUSPENDED)"
        side_effects: []
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system (cascade of POST /network/sweeps/run: when the sweep flips a remittance to LATE_UNPAID, late_remittance_count increments; on reaching late_remittance_threshold the agreement flips)"
        actor: system
        preconditions: ["late_remittance_count >= late_remittance_threshold after the increment"]
        side_effects:
          - "Every ParticipationOffering of this agreement in OPEN -> SUSPENDED"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system (cascade of POST /network/remittances/{id}/pay: paying a LATE_UNPAID remittance decrements late_remittance_count; on reaching 0 the agreement reinstates)"
        actor: system
        preconditions: ["late_remittance_count == 0 after the decrement"]
        side_effects:
          - "Every ParticipationOffering of this agreement in SUSPENDED -> OPEN"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade of CUSO ACTIVE -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: ["Every ParticipationOffering of this agreement in OPEN -> SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade of CUSO SUSPENDED -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: ["Every ParticipationOffering of this agreement in SUSPENDED -> OPEN"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /network/servicing-agreements/{id}/terminate"
        actor: CUSOOfficer
        preconditions: ["Agreement in DRAFT (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /network/servicing-agreements/{id}/terminate"
        actor: CUSOOfficer
        preconditions:
          - "No certificate under this agreement's offerings in {PENDING_DILIGENCE, COMMITTED, ACTIVE, EXCEPTION} (else ERR_AGREEMENT_HAS_OPEN_CERTIFICATES)"
        side_effects: []
      - from: DELINQUENT
        to: TERMINATED
        trigger: "POST /network/servicing-agreements/{id}/terminate"
        actor: CUSOOfficer
        preconditions:
          - "No certificate under this agreement's offerings in {PENDING_DILIGENCE, COMMITTED, ACTIVE, EXCEPTION} (else ERR_AGREEMENT_HAS_OPEN_CERTIFICATES)"
        side_effects: []

  - entity: ParticipationOffering
    initial_state: DRAFT
    terminal_states: [CLOSED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /network/offerings/{id}/open"
        actor: OriginatorUser
        preconditions:
          - "Offering in DRAFT (else ERR_INVALID_STATE)"
          - "Agreement in ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
          - "Originator CreditUnion in ACTIVE (else ERR_CREDIT_UNION_NOT_ACTIVE)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /network/offerings/{id}/close (manual) OR system (automatic on POST /network/commitments/{id}/fund when remaining_principal_cents reaches 0)"
        actor: OriginatorUser | system
        preconditions: ["Offering in OPEN (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: OPEN
        to: SUSPENDED
        trigger: "system (cascade of ServicingAgreement ACTIVE -> DELINQUENT or ACTIVE -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: ["Funding gated: POST /network/commitments/{id}/fund rejects with ERR_OFFERING_NOT_OPEN"]
      - from: SUSPENDED
        to: OPEN
        trigger: "system (cascade of ServicingAgreement DELINQUENT -> ACTIVE or SUSPENDED -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: EXPIRED
        trigger: "system (POST /network/sweeps/run when clock > close_at and remaining_principal_cents > 0)"
        actor: system
        preconditions: ["now > close_at", "remaining_principal_cents > 0"]
        side_effects:
          - "Every certificate of this offering in {PENDING_DILIGENCE, COMMITTED} -> RESCINDED"
          - "offering.committed_principal_cents and each buyer's total_committed_principal_cents recomputed"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /network/offerings/{id}/close"
        actor: OriginatorUser
        preconditions: ["Offering in DRAFT (else ERR_INVALID_STATE)"]
        side_effects: []
        note: "close on a DRAFT offering withdraws it; close on an OPEN offering closes it"

  - entity: ParticipationCertificate
    initial_state: PENDING_DILIGENCE
    terminal_states: [DECLINED, RESCINDED, REPURCHASED]
    transitions:
      - from: PENDING_DILIGENCE
        to: COMMITTED
        trigger: "POST /network/commitments/{id}/approve-diligence"
        actor: BuyerUser
        preconditions:
          - "Certificate in PENDING_DILIGENCE (else ERR_INVALID_STATE)"
          - "Caller X-User-ID == certificate.buyer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["diligence_decision_at = clock"]
      - from: PENDING_DILIGENCE
        to: DECLINED
        trigger: "POST /network/commitments/{id}/decline"
        actor: BuyerUser
        preconditions: ["Certificate in PENDING_DILIGENCE (else ERR_INVALID_STATE)"]
        side_effects:
          - "diligence_decision_at = clock"
          - "offering.committed_principal_cents and buyer.total_committed_principal_cents recomputed (excludes DECLINED)"
      - from: COMMITTED
        to: ACTIVE
        trigger: "POST /network/commitments/{id}/fund"
        actor: BuyerUser
        preconditions:
          - "Certificate in COMMITTED (else ERR_INVALID_STATE)"
          - "Offering in OPEN (else ERR_OFFERING_NOT_OPEN)"
        side_effects:
          - "funded_amount_cents = committed_amount_cents; outstanding_principal_cents = committed_amount_cents"
          - "If offering.remaining_principal_cents == 0 after funding (impossible in practice since commitment already reserved; equality means fully subscribed at commit time) -> no-op; auto-close fires only when commitment filled the pool and all commitments funded"
          - "NOTE: offering auto-close is evaluated at fund time as remaining_principal_cents == 0 -> offering OPEN -> CLOSED"
      - from: COMMITTED
        to: RESCINDED
        trigger: "POST /network/commitments/{id}/rescind OR system (cascade of offering -> EXPIRED)"
        actor: BuyerUser | system
        preconditions: ["Certificate in COMMITTED (else ERR_INVALID_STATE)"]
        side_effects: ["offering.committed_principal_cents and buyer.total_committed_principal_cents recomputed"]
      - from: PENDING_DILIGENCE
        to: RESCINDED
        trigger: "system (cascade of offering -> EXPIRED)"
        actor: system
        preconditions: []
        side_effects: ["offering.committed_principal_cents and buyer.total_committed_principal_cents recomputed"]
      - from: ACTIVE
        to: EXCEPTION
        trigger: "system (cascade of POST /network/exceptions creating a DocumentationException on this certificate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXCEPTION
        to: ACTIVE
        trigger: "system (cascade of POST /network/exceptions/{id}/verify-cure with accept=true, or POST /network/repurchase-cases/{id}/withdraw, when no exceptions remain in {OPEN, CURE_SUBMITTED, REJECTED, ESCALATED} and no RepurchaseCase in {TRIGGERED, DISPUTED})"
        actor: system
        preconditions: ["Zero DocumentationExceptions of this certificate in {OPEN, CURE_SUBMITTED, REJECTED, ESCALATED}", "Zero RepurchaseCases of this certificate in {TRIGGERED, DISPUTED}"]
        side_effects: []
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (cascade of POST /network/remittances/{id}/pay when outstanding_principal_cents reaches 0)"
        actor: system
        preconditions: ["outstanding_principal_cents == 0 after applying principal portion"]
        side_effects: []
      - from: PAID_OFF
        to: ACTIVE
        trigger: "system (cascade of POST /network/remittances/{id}/reverse restoring principal)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REPURCHASED
        trigger: "system (cascade of POST /network/repurchase-cases/{id}/complete)"
        actor: system
        preconditions: []
        side_effects:
          - "outstanding_principal_cents = 0"
          - "offering.committed_principal_cents and buyer.total_committed_principal_cents recomputed (excludes REPURCHASED)"
      - from: EXCEPTION
        to: REPURCHASED
        trigger: "system (cascade of POST /network/repurchase-cases/{id}/complete)"
        actor: system
        preconditions: []
        side_effects:
          - "outstanding_principal_cents = 0"
          - "offering.committed_principal_cents and buyer.total_committed_principal_cents recomputed (excludes REPURCHASED)"

  - entity: DocumentationException
    initial_state: OPEN
    terminal_states: [CURED, ESCALATED]
    transitions:
      - from: OPEN
        to: CURE_SUBMITTED
        trigger: "POST /network/exceptions/{id}/submit-cure"
        actor: OriginatorUser
        preconditions:
          - "Exception in OPEN or REJECTED (else ERR_INVALID_STATE)"
          - "clock <= cure_deadline (else ERR_CURE_PERIOD_EXPIRED)"
          - "Caller owns the originator of the servicing agreement behind the certificate (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["cure_notes = payload.cure_notes; cure_attempt_count += 1"]
      - from: REJECTED
        to: CURE_SUBMITTED
        trigger: "POST /network/exceptions/{id}/submit-cure"
        actor: OriginatorUser
        preconditions:
          - "Exception in OPEN or REJECTED (else ERR_INVALID_STATE)"
          - "clock <= cure_deadline (else ERR_CURE_PERIOD_EXPIRED)"
        side_effects: ["cure_notes = payload.cure_notes; cure_attempt_count += 1"]
      - from: CURE_SUBMITTED
        to: CURED
        trigger: "POST /network/exceptions/{id}/verify-cure with accept=true"
        actor: BuyerUser
        preconditions:
          - "Exception in CURE_SUBMITTED (else ERR_INVALID_STATE)"
          - "Caller X-User-ID == certificate.buyer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["Certificate EXCEPTION -> ACTIVE if no other open exceptions and no open repurchase case"]
      - from: CURE_SUBMITTED
        to: REJECTED
        trigger: "POST /network/exceptions/{id}/verify-cure with accept=false"
        actor: BuyerUser
        preconditions: ["Exception in CURE_SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: OPEN
        to: ESCALATED
        trigger: "system (POST /network/sweeps/run when clock > cure_deadline)"
        actor: system
        preconditions: ["now > cure_deadline"]
        side_effects:
          - "Auto-create RepurchaseCase (status TRIGGERED, trigger_reason DOCUMENTATION_DEFAULT, documentation_exception_id = this exception)"
      - from: REJECTED
        to: ESCALATED
        trigger: "system (POST /network/sweeps/run when clock > cure_deadline)"
        actor: system
        preconditions: ["now > cure_deadline"]
        side_effects:
          - "Auto-create RepurchaseCase (status TRIGGERED, trigger_reason DOCUMENTATION_DEFAULT, documentation_exception_id = this exception)"

  - entity: Remittance
    initial_state: SCHEDULED
    terminal_states: [REVERSED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /network/remittances/{id}/pay when clock <= due_at"
        actor: OriginatorUser
        preconditions:
          - "Remittance in SCHEDULED or LATE_UNPAID (else ERR_INVALID_STATE)"
          - "Certificate in ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "paid_at = clock; penalty_cents = 0"
          - "certificate.outstanding_principal_cents -= principal_portion_cents; certificate.cumulative_interest_cents += interest_portion_cents"
          - "If outstanding_principal_cents == 0 -> certificate ACTIVE -> PAID_OFF"
      - from: SCHEDULED
        to: PAID_LATE
        trigger: "POST /network/remittances/{id}/pay when clock > due_at"
        actor: OriginatorUser
        preconditions:
          - "Remittance in SCHEDULED or LATE_UNPAID (else ERR_INVALID_STATE)"
          - "Certificate in ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "paid_at = clock; penalty_cents per remittance_settlement"
          - "certificate balances applied as in PAID; PAID_OFF check as in PAID"
      - from: LATE_UNPAID
        to: PAID_LATE
        trigger: "POST /network/remittances/{id}/pay"
        actor: OriginatorUser
        preconditions: ["Certificate in ACTIVE (else ERR_INVALID_STATE)"]
        side_effects:
          - "agreement.late_remittance_count -= 1"
          - "If agreement.late_remittance_count == 0 and agreement in DELINQUENT -> agreement DELINQUENT -> ACTIVE (cascade reopens SUSPENDED offerings)"
          - "penalty_cents per remittance_settlement; certificate balances applied"
      - from: SCHEDULED
        to: LATE_UNPAID
        trigger: "system (POST /network/sweeps/run when clock > due_at + agreement.grace_period_days)"
        actor: system
        preconditions: ["now > due_at + grace_period_days"]
        side_effects:
          - "agreement.late_remittance_count += 1"
          - "If late_remittance_count >= agreement.late_remittance_threshold and agreement in ACTIVE -> agreement ACTIVE -> DELINQUENT (cascade suspends OPEN offerings)"
      - from: PAID
        to: REVERSED
        trigger: "POST /network/remittances/{id}/reverse"
        actor: NetworkAdmin
        preconditions: ["Remittance in PAID or PAID_LATE (else ERR_INVALID_STATE)"]
        side_effects:
          - "certificate.outstanding_principal_cents += principal_portion_cents; certificate.cumulative_interest_cents -= interest_portion_cents"
          - "If certificate in PAID_OFF -> PAID_OFF -> ACTIVE"
      - from: PAID_LATE
        to: REVERSED
        trigger: "POST /network/remittances/{id}/reverse"
        actor: NetworkAdmin
        preconditions: ["Remittance in PAID or PAID_LATE (else ERR_INVALID_STATE)"]
        side_effects: ["Same compensating effects as PAID -> REVERSED"]

  - entity: SurveillanceReport
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (cascade of POST /network/surveillance-reports creating a newer report for the same servicing_agreement_id)"
        actor: system
        preconditions: []
        side_effects: ["Exactly one report per agreement remains CURRENT"]

  - entity: RegulatoryExam
    initial_state: IN_PROGRESS
    terminal_states: [FINALIZED]
    transitions:
      - from: IN_PROGRESS
        to: FINALIZED
        trigger: "POST /network/exams/{id}/finalize"
        actor: RegulatorUser
        preconditions: ["Exam in IN_PROGRESS (else ERR_INVALID_STATE)"]
        side_effects:
          - "finalized_at = clock"
          - "If exam has >= 1 finding with severity CRITICAL and status in {OPEN, VERIFYING, REOPENED} -> CUSO ACTIVE -> SUSPENDED (cascade: agreements ACTIVE -> SUSPENDED; their OPEN offerings -> SUSPENDED)"

  - entity: ExamFinding
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: VERIFYING
        trigger: "POST /network/findings/{id}/submit-remediation"
        actor: CUSOOfficer
        preconditions:
          - "Finding in OPEN or REOPENED (else ERR_INVALID_STATE)"
          - "Caller X-User-ID == exam.cuso_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["remediation_notes = payload.remediation_notes"]
      - from: REOPENED
        to: VERIFYING
        trigger: "POST /network/findings/{id}/submit-remediation"
        actor: CUSOOfficer
        preconditions: ["Finding in OPEN or REOPENED (else ERR_INVALID_STATE)"]
        side_effects: ["remediation_notes = payload.remediation_notes"]
      - from: VERIFYING
        to: CLOSED
        trigger: "POST /network/findings/{id}/verify with verification_passed=true"
        actor: RegulatorUser
        preconditions:
          - "Finding in VERIFYING (else ERR_INVALID_STATE)"
          - "Caller X-User-ID != finding.recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CUSO.open_critical_finding_count recomputed"
          - "If finding.severity == CRITICAL and CUSO.open_critical_finding_count == 0 and CUSO in SUSPENDED -> CUSO SUSPENDED -> ACTIVE (cascade reinstates agreements and offerings)"
      - from: VERIFYING
        to: REOPENED
        trigger: "POST /network/findings/{id}/verify with verification_passed=false"
        actor: RegulatorUser
        preconditions:
          - "Finding in VERIFYING (else ERR_INVALID_STATE)"
          - "Caller X-User-ID != finding.recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

  - entity: LossEvent
    initial_state: REPORTED
    terminal_states: [ALLOCATED]
    transitions:
      - from: REPORTED
        to: ALLOCATED
        trigger: "POST /network/loss-events/{id}/allocate"
        actor: OriginatorUser
        preconditions:
          - "LossEvent in REPORTED (else ERR_INVALID_STATE)"
          - ">= 1 certificate of the offering in {ACTIVE, EXCEPTION} (else ERR_NO_ALLOCATABLE_CERTIFICATES)"
          - "loss_amount_cents <= sum of basis weights over eligible certificates (else ERR_LOSS_EXCEEDS_POOL)"
        side_effects:
          - "loss_basis_used = offering.loss_basis; allocations[] computed per loss_share_allocation"
          - "Each certificate: outstanding_principal_cents -= allocated_cents; cumulative_loss_cents += allocated_cents"

  - entity: RepurchaseCase
    initial_state: TRIGGERED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: TRIGGERED
        to: COMPLETED
        trigger: "POST /network/repurchase-cases/{id}/complete"
        actor: OriginatorUser
        preconditions:
          - "Case in TRIGGERED or DISPUTED (else ERR_INVALID_STATE)"
          - "Certificate in ACTIVE or EXCEPTION (else ERR_INVALID_STATE)"
        side_effects:
          - "repurchase_price_cents stamped per repurchase_price"
          - "Certificate -> REPURCHASED; outstanding_principal_cents = 0"
          - "offering.committed_principal_cents and buyer.total_committed_principal_cents recomputed"
      - from: TRIGGERED
        to: DISPUTED
        trigger: "POST /network/repurchase-cases/{id}/dispute"
        actor: OriginatorUser
        preconditions: ["Case in TRIGGERED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: DISPUTED
        to: COMPLETED
        trigger: "POST /network/repurchase-cases/{id}/complete"
        actor: OriginatorUser
        preconditions: ["Case in TRIGGERED or DISPUTED (else ERR_INVALID_STATE)"]
        side_effects: ["Same as TRIGGERED -> COMPLETED"]
      - from: DISPUTED
        to: WITHDRAWN
        trigger: "POST /network/repurchase-cases/{id}/withdraw"
        actor: BuyerUser
        preconditions:
          - "Case in DISPUTED (else ERR_INVALID_STATE)"
          - "Caller X-User-ID == certificate.buyer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["Certificate EXCEPTION -> ACTIVE if no open exceptions remain"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: surveillance-report-stale-agreement
    parent_entity: ServicingAgreement
    write_endpoint: "POST /network/surveillance-reports"
    occ_field: expected_servicing_agreement_version
    description: |
      Creating a SurveillanceReport supersedes the agreement's prior CURRENT
      report and bumps ServicingAgreement.version. A create carrying an
      expected_servicing_agreement_version that no longer matches the
      agreement's current version is rejected: the caller's view of the
      agreement (which report is CURRENT) is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: accrued_interest
    trigger: "remittance creation (POST /network/remittances); repurchase completion (accrued-unpaid component of repurchase_price)"
    algorithm: forward_looking
    formula: |
      days = day_count(agreement.day_count_convention, period_start, period_end)
        THIRTY_360: each full calendar month counts 30 days; a partial month
          counts min(actual_calendar_days_in_period, 30). (2026-08-01..2026-08-31 -> 30)
        ACT_360: actual calendar days from period_start through period_end
          INCLUSIVE. (2026-08-01..2026-08-31 -> 31)
      base = certificate.outstanding_principal_cents at period start
        (remittance) OR at completion time (repurchase accrued-unpaid)
      rate = offering.yield_rate_bps / 10000
      accrued = round_half_up(base * rate * days / 360)
    input_set: "the certificate being remitted/repurchased; its offering's yield_rate_bps; its agreement's day_count_convention"
    constants:
      YEAR_DAYS: 360
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: thirty_360
        when: "agreement.day_count_convention == THIRTY_360"
        difference: "Full months count 30 days -> smaller accrual for 31-day months"
      - name: act_360
        when: "agreement.day_count_convention == ACT_360"
        difference: "Actual inclusive calendar days -> larger accrual for 31-day months (identical inputs, different output)"

  - name: remittance_settlement
    trigger: "remittance creation (interest/fee/principal split) and pay (late penalty)"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking dependency resolved):
      (1) beginning_outstanding = certificate.outstanding_principal_cents BEFORE this remittance applies
      (2) servicing_fee_cents = round_half_up(beginning_outstanding * agreement.servicing_fee_bps / 10000 * days / 360),
          days per agreement.day_count_convention (same day-count rule as accrued_interest)
      (3) interest_portion_cents = accrued_interest(certificate, period)
      (4) principal_portion_cents = collections_cents - interest_portion_cents - servicing_fee_cents
          (creation rejects collections_cents < interest + fee with ERR_COLLECTIONS_INSUFFICIENT)
      (5) at pay time: if paid_at > due_at:
            days_late = calendar days from due_at to paid_at (date difference)
            penalty_cents = round_half_up((interest_portion_cents + principal_portion_cents) * LATE_PENALTY_DAILY_BPS * days_late / 10000)
          else penalty_cents = 0
    input_set: "single remittance row; certificate state before application"
    constants:
      LATE_PENALTY_DAILY_BPS: 3
      YEAR_DAYS: 360
    precision: "0 decimal places (whole cents), round_half_up"

  - name: investment_cap_check
    trigger: "POST /network/cuso-investments/{id}/approve"
    algorithm: threshold
    formula: |
      base_cap_cents       = round_half_down(CU.total_assets_cents * BASE_CAP_PCT)
      extended_cap_cents   = round_half_down(CU.total_assets_cents * EXTENDED_CAP_PCT)
      aggregate_cents      = sum(amount_cents over the CU's OTHER APPROVED investments) + candidate.amount_cents
      if aggregate_cents <= base_cap_cents:                            -> approve allowed (STANDARD or ENHANCED)
      elif candidate.approval_basis == ENHANCED
           and CU.net_worth_ratio >= WELL_CAPITALIZED_MIN_RATIO
           and CUSO.open_critical_finding_count == 0
           and aggregate_cents <= extended_cap_cents:                  -> approve allowed
      elif aggregate_cents > base_cap_cents and candidate.approval_basis == STANDARD: ERR_INVESTMENT_CAP_EXCEEDED
      elif basis is ENHANCED but eligibility fails:                     ERR_ENHANCED_BASIS_NOT_ELIGIBLE
      else (aggregate > extended_cap_cents):                            ERR_INVESTMENT_CAP_EXCEEDED
      Boundary: aggregate == cap is ALLOWED (rejection requires aggregate > cap).
    input_set: "candidate CUSOInvestment (PENDING_REVIEW); the investing CreditUnion; the target CUSO's open critical findings"
    constants:
      BASE_CAP_PCT: 0.01
      EXTENDED_CAP_PCT: 0.03
      WELL_CAPITALIZED_MIN_RATIO: 0.07
    precision: "caps rounded down to whole cents; comparisons on integers"

  - name: concentration_share
    trigger: "POST /network/commitments"
    algorithm: aggregation
    formula: |
      exposure_cents = sum(committed_amount_cents over certificates where
        certificate.buyer_id == buyer AND offering's agreement.originator_id == this originator
        AND certificate.status IN {PENDING_DILIGENCE, COMMITTED, ACTIVE, EXCEPTION})
        -- DECLINED, RESCINDED, REPURCHASED are excluded
      candidate_exposure = exposure_cents + new committed_amount_cents
      cap_cents = round_half_down(buyer.net_worth_cents * buyer.concentration_cap_pct)
      reject with ERR_CONCENTRATION_LIMIT_EXCEEDED iff candidate_exposure > cap_cents
      (candidate_exposure == cap_cents is ALLOWED)
    input_set: "buyer CreditUnion; originator CreditUnion via offering -> servicing_agreement"
    precision: "cap rounded down to whole cents; integer comparison"

  - name: loss_share_allocation
    trigger: "POST /network/loss-events/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      eligible = certificates of the offering with status IN {ACTIVE, EXCEPTION}
      weight_i = outstanding_principal_cents (basis OUTSTANDING) | committed_amount_cents (basis COMMITTED)
      total_weight = sum(weight_i)
      ROUNDING ORDER PINNED (per-share then residual; NOT sum-then-round):
        raw_i = loss_amount_cents * weight_i / total_weight
        share_i = round_half_up(raw_i)                       # round each share first
        residual = loss_amount_cents - sum(share_i)
        if residual != 0: distribute residual one cent at a time (sign of residual)
          to certificates ordered by fractional part of raw_i DESC,
          tie-break certificate.created_at ASC (never id)
      If a computed share would exceed the certificate's outstanding_principal_cents,
      cap that share at outstanding and redistribute the excess pro-rata among
      uncapped certificates (repeat until fully distributed).
    input_set: "offering's certificates in {ACTIVE, EXCEPTION} at allocation time"
    precision: "whole cents, round_half_up per share"
    variants:
      - name: outstanding_basis
        when: "offering.loss_basis == OUTSTANDING"
        difference: "Weights track current outstanding_principal_cents (post-paydown) -> paydown shifts loss share"
      - name: committed_basis
        when: "offering.loss_basis == COMMITTED"
        difference: "Weights track original committed_amount_cents -> identical loss produces different per-certificate shares"

  - name: repurchase_price
    trigger: "POST /network/repurchase-cases/{id}/complete"
    algorithm: aggregation
    formula: |
      accrued_unpaid = accrued_interest over the window:
        start = day after the certificate's most recent remittance period_end
          (or funded date if no remittances), end = completion date, inclusive,
        using the agreement's day_count_convention
      repurchase_price_cents = certificate.outstanding_principal_cents + accrued_unpaid
      (cumulative_loss_cents has already reduced outstanding_principal_cents;
       no double-counting)
    input_set: "certificate; its offering yield; agreement day-count; remittance history"
    precision: "whole cents, round_half_up on the accrued component"

  - name: surveillance_pool_aggregates
    trigger: "POST /network/surveillance-reports"
    algorithm: weighted_scoring
    formula: |
      pool = certificates across the agreement's offerings with status IN {ACTIVE, EXCEPTION}
      total_outstanding_principal_cents = sum(outstanding_principal_cents over pool)
      active_certificate_count = count(pool)
      delinquent_remittance_count = count(remittances of pool certificates with status LATE_UNPAID)
      weight_i = outstanding_principal_cents (basis OUTSTANDING) | committed_amount_cents (basis COMMITTED)
      weighted_avg_yield_bps = round_half_up(
        sum(weight_i * offering_i.yield_rate_bps over pool) / sum(weight_i over pool))
      (pool empty -> weighted_avg_yield_bps = 0, totals 0)
    input_set: "all offerings of the agreement; their certificates in {ACTIVE, EXCEPTION}"
    precision: "WAC in whole bps, round_half_up"
    variants:
      - name: outstanding_weighted
        when: "report.weighting_basis == OUTSTANDING"
        difference: "WAC weights current outstanding principal"
      - name: committed_weighted
        when: "report.weighting_basis == COMMITTED"
        difference: "WAC weights original committed principal; identical pool, different WAC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed caller owns the target resource (BuyerUser == certificate.buyer_id; TreasuryUser == investment.credit_union_id; OriginatorUser == agreement.originator_id; CUSOOfficer == agreement.cuso_id)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "action endpoints on existing resources" }
  - { priority: 4, category: existence, check: "Every id in path and body resolves to an existing resource (path ids left-to-right, then body ids)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "Request body shape: required fields present, enum members valid, integers positive where required, end dates after start dates", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_servicing_agreement_version matches the agreement's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /network/surveillance-reports" }
  - { priority: 7, category: state, check: "Target resource is in a state from which the requested transition exists", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: business_safety, check: "Regulatory caps and segregation: investment_cap_check (ERR_INVESTMENT_CAP_EXCEEDED / ERR_ENHANCED_BASIS_NOT_ELIGIBLE); concentration_share (ERR_CONCENTRATION_LIMIT_EXCEEDED); finding verifier != recorder (ERR_SEGREGATION_OF_DUTIES)", error_id: "ERR_INVESTMENT_CAP_EXCEEDED | ERR_ENHANCED_BASIS_NOT_ELIGIBLE | ERR_CONCENTRATION_LIMIT_EXCEEDED | ERR_SEGREGATION_OF_DUTIES", http_status: 409, applies_to: "approve investment, create commitment, verify finding" }
  - { priority: 9, category: business_referential, check: "Linked entities in required state: agreement ACTIVE for offering create/open and commitment (ERR_AGREEMENT_NOT_ACTIVE); offering OPEN for commitment/fund (ERR_OFFERING_NOT_OPEN); credit union ACTIVE for its writes (ERR_CREDIT_UNION_NOT_ACTIVE); CUSO ACTIVE for agreement activate and agreement create (ERR_CUSO_SUSPENDED); no open certificates for agreement terminate (ERR_AGREEMENT_HAS_OPEN_CERTIFICATES)", error_id: "ERR_AGREEMENT_NOT_ACTIVE | ERR_OFFERING_NOT_OPEN | ERR_CREDIT_UNION_NOT_ACTIVE | ERR_CUSO_SUSPENDED | ERR_AGREEMENT_HAS_OPEN_CERTIFICATES", http_status: 409, applies_to: "offering open/create, commitment create/fund, agreement activate/terminate, remittance create/pay" }
  - { priority: 10, category: business_temporal, check: "Windows and deadlines: commitment within [open_at, close_at] (ERR_OFFERING_WINDOW_CLOSED); cure submission at or before cure_deadline (ERR_CURE_PERIOD_EXPIRED); exam half-open window overlap per CUSO (ERR_EXAM_WINDOW_OVERLAP); remittance closed-period overlap per certificate (ERR_REMITTANCE_PERIOD_OVERLAP)", error_id: "ERR_OFFERING_WINDOW_CLOSED | ERR_CURE_PERIOD_EXPIRED | ERR_EXAM_WINDOW_OVERLAP | ERR_REMITTANCE_PERIOD_OVERLAP", http_status: 409, applies_to: "create commitment, submit cure, create exam, create remittance" }
  - { priority: 11, category: business_constraint, check: "Domain constraints: buyer != originator (ERR_SELF_PARTICIPATION); buyer has at most one non-terminal certificate per offering (ERR_DUPLICATE_COMMITMENT); committed_amount_cents >= min_share_pct * pool_principal_cents (ERR_MIN_SHARE_NOT_MET); at most one open RepurchaseCase per certificate (ERR_DUPLICATE_REPURCHASE_CASE)", error_id: "ERR_SELF_PARTICIPATION | ERR_DUPLICATE_COMMITMENT | ERR_MIN_SHARE_NOT_MET | ERR_DUPLICATE_REPURCHASE_CASE", http_status: 409, applies_to: "create commitment, create repurchase case" }
  - { priority: 12, category: business_fiscal, check: "Funds checks: committed_amount_cents <= offering.remaining_principal_cents (ERR_POOL_EXHAUSTED); loss_amount_cents <= total basis weight (ERR_LOSS_EXCEEDS_POOL); >= 1 allocatable certificate (ERR_NO_ALLOCATABLE_CERTIFICATES); collections_cents >= interest + fee (ERR_COLLECTIONS_INSUFFICIENT)", error_id: "ERR_POOL_EXHAUSTED | ERR_LOSS_EXCEEDS_POOL | ERR_NO_ALLOCATABLE_CERTIFICATES | ERR_COLLECTIONS_INSUFFICIENT", http_status: 409, applies_to: "create commitment, allocate loss event, create remittance" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Credit unions & CUSOs ---
  - { method: POST, path: "/network/credit-unions", description: "Register a credit union", roles: [NetworkAdmin], code: 201, input: [charter_number, legal_name, cu_type, total_assets_cents, net_worth_cents, "concentration_cap_pct?"], output: CreditUnion, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/network/credit-unions/{id}", description: "Get a credit union", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: CreditUnion, side_effects: [] }
  - { method: POST, path: "/network/credit-unions/{id}/suspend", description: "Suspend a credit union", roles: [NetworkAdmin], code: 200, input: [], output: CreditUnion, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/network/credit-unions/{id}/reinstate", description: "Reinstate a credit union", roles: [NetworkAdmin], code: 200, input: [], output: CreditUnion, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/network/cusos", description: "Register a CUSO", roles: [NetworkAdmin], code: 201, input: [legal_name, service_line], output: CUSO, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/network/cusos/{id}", description: "Get a CUSO", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: CUSO, side_effects: [] }

  # --- CUSO investments ---
  - { method: POST, path: "/network/cuso-investments", description: "Submit a CUSO investment for regulatory review", roles: [TreasuryUser], code: 201, input: [credit_union_id, cuso_id, amount_cents, "approval_basis?"], output: CUSOInvestment, side_effects: ["status=PENDING_REVIEW; caller X-User-ID must equal credit_union_id"] }
  - { method: GET, path: "/network/cuso-investments/{id}", description: "Get an investment", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: CUSOInvestment, side_effects: [] }
  - { method: GET, path: "/network/cuso-investments", description: "List investments", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["credit_union_id?", "cuso_id?", "status?", "limit?", "offset?"], output: "CUSOInvestment[]", side_effects: [] }
  - { method: POST, path: "/network/cuso-investments/{id}/approve", description: "Regulator approves investment (investment_cap_check runs here)", roles: [RegulatorUser], code: 200, input: [], output: CUSOInvestment, side_effects: ["status -> APPROVED; post_approval_aggregate_cents stamped; CUSO.total_approved_investment_cents recomputed"] }
  - { method: POST, path: "/network/cuso-investments/{id}/reject", description: "Regulator rejects investment", roles: [RegulatorUser], code: 200, input: [], output: CUSOInvestment, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/network/cuso-investments/{id}/rescind", description: "Investor rescinds an approved investment", roles: [TreasuryUser], code: 200, input: [], output: CUSOInvestment, side_effects: ["status -> RESCINDED; CUSO.total_approved_investment_cents recomputed"] }

  # --- Servicing agreements ---
  - { method: POST, path: "/network/servicing-agreements", description: "Create a servicing agreement between a CUSO and an originator CU", roles: [CUSOOfficer], code: 201, input: [cuso_id, originator_id, servicing_fee_bps, remittance_due_day, "grace_period_days?", "cure_period_days?", day_count_convention, "late_remittance_threshold?"], output: ServicingAgreement, side_effects: ["status=DRAFT; caller X-User-ID must equal cuso_id; CUSO must be ACTIVE (ERR_CUSO_SUSPENDED)"] }
  - { method: GET, path: "/network/servicing-agreements/{id}", description: "Get a servicing agreement", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: ServicingAgreement, side_effects: [] }
  - { method: GET, path: "/network/servicing-agreements", description: "List servicing agreements", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["cuso_id?", "originator_id?", "status?", "limit?", "offset?"], output: "ServicingAgreement[]", side_effects: [] }
  - { method: POST, path: "/network/servicing-agreements/{id}/activate", description: "Activate a draft agreement", roles: [CUSOOfficer], code: 200, input: [], output: ServicingAgreement, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/network/servicing-agreements/{id}/terminate", description: "Terminate an agreement with no open certificates", roles: [CUSOOfficer], code: 200, input: [], output: ServicingAgreement, side_effects: ["status -> TERMINATED"] }

  # --- Participation offerings ---
  - { method: POST, path: "/network/offerings", description: "Create a participation offering under an agreement", roles: [OriginatorUser], code: 201, input: [servicing_agreement_id, pool_name, pool_principal_cents, min_share_pct, yield_rate_bps, "loss_basis?", open_at, close_at], output: ParticipationOffering, side_effects: ["status=DRAFT; agreement must be ACTIVE (ERR_AGREEMENT_NOT_ACTIVE); caller must own agreement.originator_id"] }
  - { method: GET, path: "/network/offerings/{id}", description: "Get an offering", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: ParticipationOffering, side_effects: [] }
  - { method: GET, path: "/network/offerings", description: "List offerings", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["servicing_agreement_id?", "status?", "limit?", "offset?"], output: "ParticipationOffering[]", side_effects: [] }
  - { method: POST, path: "/network/offerings/{id}/open", description: "Open a draft offering for commitments", roles: [OriginatorUser], code: 200, input: [], output: ParticipationOffering, side_effects: ["status -> OPEN"] }
  - { method: POST, path: "/network/offerings/{id}/close", description: "Close an OPEN offering or withdraw a DRAFT offering", roles: [OriginatorUser], code: 200, input: [], output: ParticipationOffering, side_effects: ["OPEN -> CLOSED; DRAFT -> WITHDRAWN"] }

  # --- Participation certificates (commitments) ---
  - { method: POST, path: "/network/commitments", description: "Buyer commits to a participation share; creates a certificate in PENDING_DILIGENCE", roles: [BuyerUser], code: 201, input: [offering_id, committed_amount_cents], output: ParticipationCertificate, side_effects: ["buyer_id = caller X-User-ID; concentration_share checked; offering.committed_principal_cents and buyer.total_committed_principal_cents recomputed"] }
  - { method: GET, path: "/network/commitments/{id}", description: "Get a certificate", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: ParticipationCertificate, side_effects: [] }
  - { method: GET, path: "/network/commitments", description: "List certificates", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["offering_id?", "buyer_id?", "status?", "limit?", "offset?"], output: "ParticipationCertificate[]", side_effects: [] }
  - { method: POST, path: "/network/commitments/{id}/approve-diligence", description: "Buyer completes credit due diligence", roles: [BuyerUser], code: 200, input: [], output: ParticipationCertificate, side_effects: ["PENDING_DILIGENCE -> COMMITTED"] }
  - { method: POST, path: "/network/commitments/{id}/decline", description: "Buyer declines after diligence", roles: [BuyerUser], code: 200, input: [], output: ParticipationCertificate, side_effects: ["PENDING_DILIGENCE -> DECLINED; aggregates recomputed"] }
  - { method: POST, path: "/network/commitments/{id}/fund", description: "Buyer funds a committed certificate", roles: [BuyerUser], code: 200, input: [], output: ParticipationCertificate, side_effects: ["COMMITTED -> ACTIVE; funded_amount_cents = outstanding_principal_cents = committed_amount_cents; offering auto-closes if fully subscribed"] }
  - { method: POST, path: "/network/commitments/{id}/rescind", description: "Buyer rescinds an unfunded commitment", roles: [BuyerUser], code: 200, input: [], output: ParticipationCertificate, side_effects: ["COMMITTED -> RESCINDED; aggregates recomputed"] }

  # --- Documentation exceptions ---
  - { method: POST, path: "/network/exceptions", description: "Buyer flags a documentation exception on a certificate", roles: [BuyerUser], code: 201, input: [certificate_id, exception_type, description], output: DocumentationException, side_effects: ["status=OPEN; cure_deadline = now + agreement.cure_period_days; certificate ACTIVE -> EXCEPTION"] }
  - { method: GET, path: "/network/exceptions/{id}", description: "Get an exception", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: DocumentationException, side_effects: [] }
  - { method: GET, path: "/network/exceptions", description: "List exceptions", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["certificate_id?", "status?", "limit?", "offset?"], output: "DocumentationException[]", side_effects: [] }
  - { method: POST, path: "/network/exceptions/{id}/submit-cure", description: "Originator submits cure documentation", roles: [OriginatorUser], code: 200, input: [cure_notes], output: DocumentationException, side_effects: ["OPEN|REJECTED -> CURE_SUBMITTED; cure_attempt_count += 1"] }
  - { method: POST, path: "/network/exceptions/{id}/verify-cure", description: "Buyer accepts or rejects a submitted cure", roles: [BuyerUser], code: 200, input: [accept], output: DocumentationException, side_effects: ["accept=true -> CURED (certificate may return to ACTIVE); accept=false -> REJECTED"] }

  # --- Remittances ---
  - { method: POST, path: "/network/remittances", description: "Servicer schedules a period remittance for a certificate", roles: [OriginatorUser], code: 201, input: [certificate_id, period_start, period_end, collections_cents], output: Remittance, side_effects: ["status=SCHEDULED; due_at computed; interest/fee/principal split computed; closed-period overlap check per certificate (REVERSED remittances excluded)"] }
  - { method: GET, path: "/network/remittances/{id}", description: "Get a remittance", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: Remittance, side_effects: [] }
  - { method: GET, path: "/network/remittances", description: "List remittances", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["certificate_id?", "status?", "limit?", "offset?"], output: "Remittance[]", side_effects: [] }
  - { method: POST, path: "/network/remittances/{id}/pay", description: "Servicer pays a remittance (on time or late; penalty stamped if late)", roles: [OriginatorUser], code: 200, input: [], output: Remittance, side_effects: ["SCHEDULED -> PAID|PAID_LATE; LATE_UNPAID -> PAID_LATE with agreement counter decrement and possible DELINQUENT -> ACTIVE reinstatement; certificate balances applied; PAID_OFF check"] }
  - { method: POST, path: "/network/remittances/{id}/reverse", description: "Network admin reverses a paid remittance (compensating action)", roles: [NetworkAdmin], code: 200, input: [], output: Remittance, side_effects: ["PAID|PAID_LATE -> REVERSED; certificate balances restored; PAID_OFF -> ACTIVE if applicable"] }

  # --- Surveillance reports ---
  - { method: POST, path: "/network/surveillance-reports", description: "CUSO publishes a portfolio surveillance report; supersedes the prior CURRENT report (OCC on agreement version)", roles: [CUSOOfficer], code: 201, input: [servicing_agreement_id, period_start, period_end, "weighting_basis?", expected_servicing_agreement_version], output: SurveillanceReport, side_effects: ["aggregates computed; prior CURRENT report -> SUPERSEDED; increments ServicingAgreement.version by 1"] }
  - { method: GET, path: "/network/surveillance-reports/{id}", description: "Get a surveillance report", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: SurveillanceReport, side_effects: [] }
  - { method: GET, path: "/network/surveillance-reports", description: "List surveillance reports (participants read these)", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["servicing_agreement_id?", "status?", "limit?", "offset?"], output: "SurveillanceReport[]", side_effects: [] }

  # --- Regulatory exams & findings ---
  - { method: POST, path: "/network/exams", description: "Regulator opens an exam on a CUSO; half-open [start_date, end_date) windows must not overlap per CUSO", roles: [RegulatorUser], code: 201, input: [cuso_id, start_date, end_date], output: RegulatoryExam, side_effects: ["status=IN_PROGRESS"] }
  - { method: GET, path: "/network/exams/{id}", description: "Get an exam", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: RegulatoryExam, side_effects: [] }
  - { method: GET, path: "/network/exams", description: "List exams", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["cuso_id?", "status?", "limit?", "offset?"], output: "RegulatoryExam[]", side_effects: [] }
  - { method: POST, path: "/network/exams/{id}/finalize", description: "Finalize an exam; open CRITICAL findings suspend the CUSO (cascade)", roles: [RegulatorUser], code: 200, input: [], output: RegulatoryExam, side_effects: ["IN_PROGRESS -> FINALIZED; conditional cascade CUSO -> SUSPENDED -> agreements -> offerings"] }
  - { method: POST, path: "/network/findings", description: "Record an exam finding", roles: [RegulatorUser], code: 201, input: [exam_id, severity, description, remediation_due_date], output: ExamFinding, side_effects: ["status=OPEN; recorded_by_user_id = caller X-User-ID; CUSO.open_critical_finding_count recomputed"] }
  - { method: GET, path: "/network/findings/{id}", description: "Get a finding", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: ExamFinding, side_effects: [] }
  - { method: GET, path: "/network/findings", description: "List findings", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["exam_id?", "status?", "severity?", "limit?", "offset?"], output: "ExamFinding[]", side_effects: [] }
  - { method: POST, path: "/network/findings/{id}/submit-remediation", description: "CUSO submits remediation for verification", roles: [CUSOOfficer], code: 200, input: [remediation_notes], output: ExamFinding, side_effects: ["OPEN|REOPENED -> VERIFYING"] }
  - { method: POST, path: "/network/findings/{id}/verify", description: "Regulator verifies remediation (must differ from recorder)", roles: [RegulatorUser], code: 200, input: [verification_passed], output: ExamFinding, side_effects: ["pass=true -> CLOSED (may reinstate CUSO); pass=false -> REOPENED"] }

  # --- Loss events ---
  - { method: POST, path: "/network/loss-events", description: "Originator reports a pool loss", roles: [OriginatorUser], code: 201, input: [offering_id, loss_amount_cents, defaulted_at], output: LossEvent, side_effects: ["status=REPORTED"] }
  - { method: GET, path: "/network/loss-events/{id}", description: "Get a loss event", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: LossEvent, side_effects: [] }
  - { method: GET, path: "/network/loss-events", description: "List loss events", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["offering_id?", "status?", "limit?", "offset?"], output: "LossEvent[]", side_effects: [] }
  - { method: POST, path: "/network/loss-events/{id}/allocate", description: "Allocate the loss pro-rata across eligible certificates", roles: [OriginatorUser], code: 200, input: [], output: LossEvent, side_effects: ["REPORTED -> ALLOCATED; allocations[] computed; certificate outstanding_principal_cents and cumulative_loss_cents updated"] }

  # --- Repurchase cases ---
  - { method: POST, path: "/network/repurchase-cases", description: "Buyer triggers a repurchase on a certificate", roles: [BuyerUser], code: 201, input: [certificate_id, trigger_reason], output: RepurchaseCase, side_effects: ["status=TRIGGERED; certificate must be ACTIVE or EXCEPTION; at most one open case per certificate"] }
  - { method: GET, path: "/network/repurchase-cases/{id}", description: "Get a repurchase case", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: [], output: RepurchaseCase, side_effects: [] }
  - { method: GET, path: "/network/repurchase-cases", description: "List repurchase cases", roles: [NetworkAdmin, TreasuryUser, RegulatorUser, CUSOOfficer, OriginatorUser, BuyerUser], code: 200, input: ["certificate_id?", "status?", "documentation_exception_id?", "limit?", "offset?"], output: "RepurchaseCase[]", side_effects: [] }
  - { method: POST, path: "/network/repurchase-cases/{id}/complete", description: "Originator completes the repurchase (pays repurchase_price)", roles: [OriginatorUser], code: 200, input: [], output: RepurchaseCase, side_effects: ["TRIGGERED|DISPUTED -> COMPLETED; price stamped; certificate -> REPURCHASED; aggregates recomputed"] }
  - { method: POST, path: "/network/repurchase-cases/{id}/dispute", description: "Originator disputes a repurchase trigger", roles: [OriginatorUser], code: 200, input: [], output: RepurchaseCase, side_effects: ["TRIGGERED -> DISPUTED"] }
  - { method: POST, path: "/network/repurchase-cases/{id}/withdraw", description: "Buyer withdraws a disputed repurchase", roles: [BuyerUser], code: 200, input: [], output: RepurchaseCase, side_effects: ["DISPUTED -> WITHDRAWN; certificate may return to ACTIVE"] }

  # --- Ops-run checkpoint & logical clock ---
  - { method: POST, path: "/network/sweeps/run", description: "Ops-run checkpoint: flips SCHEDULED remittances past due_at+grace to LATE_UNPAID (incrementing agreement counters, cascading DELINQUENT at threshold), escalates exceptions past cure_deadline (auto-creating RepurchaseCases), expires OPEN offerings past close_at with remaining principal (rescinding pending certificates)", roles: [NetworkAdmin], code: 200, input: [], output: "{ remittances_marked_late: integer, exceptions_escalated: integer, offerings_expired: integer }", side_effects: ["All three sweep families execute atomically"] }
  - { method: POST, path: "/network/_clock/set_current_utc", description: "Test-driving logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time", roles: [NetworkAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["All 'now' references (due_at comparison, deadlines, sweeps, timestamps) read this clock"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum member, non-positive amount, end date before start date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_servicing_agreement_version does not match the agreement's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that allows the requested transition" }
  - { id: ERR_INVESTMENT_CAP_EXCEEDED, http: 409, condition: "Approving would push the CU's aggregate CUSO investment above the applicable cap" }
  - { id: ERR_ENHANCED_BASIS_NOT_ELIGIBLE, http: 409, condition: "ENHANCED approval basis requires net_worth_ratio >= 0.07 and zero open CRITICAL findings on the CUSO" }
  - { id: ERR_CONCENTRATION_LIMIT_EXCEEDED, http: 409, condition: "Commitment would push the buyer's exposure to this originator above concentration_cap_pct of net worth" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Finding verifier X-User-ID equals finding.recorded_by_user_id" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Servicing agreement not in ACTIVE where required (offering create/open, commitment create)" }
  - { id: ERR_OFFERING_NOT_OPEN, http: 409, condition: "Offering not OPEN where required (commitment create, fund)" }
  - { id: ERR_CREDIT_UNION_NOT_ACTIVE, http: 409, condition: "Credit union is SUSPENDED and the operation requires ACTIVE" }
  - { id: ERR_CUSO_SUSPENDED, http: 409, condition: "CUSO is SUSPENDED and the operation requires ACTIVE (agreement create/activate)" }
  - { id: ERR_AGREEMENT_HAS_OPEN_CERTIFICATES, http: 409, condition: "Agreement terminate blocked by certificates in {PENDING_DILIGENCE, COMMITTED, ACTIVE, EXCEPTION}" }
  - { id: ERR_OFFERING_WINDOW_CLOSED, http: 409, condition: "Commitment attempted outside [open_at, close_at]" }
  - { id: ERR_CURE_PERIOD_EXPIRED, http: 409, condition: "Cure submitted after cure_deadline (deadline inclusive)" }
  - { id: ERR_EXAM_WINDOW_OVERLAP, http: 409, condition: "Exam half-open window overlaps another exam for the same CUSO; adjacency (start == other's end) is allowed" }
  - { id: ERR_REMITTANCE_PERIOD_OVERLAP, http: 409, condition: "Remittance closed period shares a calendar day with another non-REVERSED remittance for the same certificate" }
  - { id: ERR_SELF_PARTICIPATION, http: 409, condition: "Buyer equals the offering's originator" }
  - { id: ERR_DUPLICATE_COMMITMENT, http: 409, condition: "Buyer already holds a non-terminal certificate in this offering" }
  - { id: ERR_MIN_SHARE_NOT_MET, http: 409, condition: "committed_amount_cents below min_share_pct * pool_principal_cents" }
  - { id: ERR_DUPLICATE_REPURCHASE_CASE, http: 409, condition: "An open RepurchaseCase (TRIGGERED or DISPUTED) already exists for the certificate" }
  - { id: ERR_POOL_EXHAUSTED, http: 409, condition: "committed_amount_cents exceeds offering.remaining_principal_cents" }
  - { id: ERR_LOSS_EXCEEDS_POOL, http: 409, condition: "loss_amount_cents exceeds total basis weight of eligible certificates" }
  - { id: ERR_NO_ALLOCATABLE_CERTIFICATES, http: 409, condition: "No certificates in {ACTIVE, EXCEPTION} to absorb a loss allocation" }
  - { id: ERR_COLLECTIONS_INSUFFICIENT, http: 409, condition: "collections_cents < interest_portion_cents + servicing_fee_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Platform operator: registers credit unions and CUSOs, suspends/reinstates credit unions, reverses remittances, runs sweeps, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /network/credit-unions, POST /network/cusos"
      - "POST /network/credit-unions/{id}/suspend, POST /network/credit-unions/{id}/reinstate"
      - "POST /network/remittances/{id}/reverse"
      - "POST /network/sweeps/run, POST /network/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: TreasuryUser
    description: "Credit union treasury officer managing that CU's CUSO investments"
    identity: "entity_backed:CreditUnion"
    exclusive_operations:
      - "POST /network/cuso-investments (credit_union_id must equal X-User-ID)"
      - "POST /network/cuso-investments/{id}/rescind"
    shared_operations: ["all GET endpoints"]

  - name: RegulatorUser
    description: "Regulator/examiner: approves or rejects CUSO investments, opens and finalizes exams, records and verifies findings"
    identity: opaque
    exclusive_operations:
      - "POST /network/cuso-investments/{id}/approve, POST /network/cuso-investments/{id}/reject"
      - "POST /network/exams, POST /network/exams/{id}/finalize"
      - "POST /network/findings, POST /network/findings/{id}/verify"
    shared_operations: ["all GET endpoints"]

  - name: CUSOOfficer
    description: "CUSO operations officer: owns servicing agreements, publishes surveillance reports, submits finding remediation"
    identity: "entity_backed:CUSO"
    exclusive_operations:
      - "POST /network/servicing-agreements, POST /network/servicing-agreements/{id}/activate, POST /network/servicing-agreements/{id}/terminate"
      - "POST /network/surveillance-reports"
      - "POST /network/findings/{id}/submit-remediation"
    shared_operations: ["all GET endpoints"]

  - name: OriginatorUser
    description: "Originator credit union officer: lists offerings, schedules and pays remittances, cures documentation exceptions, reports losses, answers repurchase cases"
    identity: "entity_backed:CreditUnion"
    exclusive_operations:
      - "POST /network/offerings, POST /network/offerings/{id}/open, POST /network/offerings/{id}/close"
      - "POST /network/remittances, POST /network/remittances/{id}/pay"
      - "POST /network/exceptions/{id}/submit-cure"
      - "POST /network/loss-events, POST /network/loss-events/{id}/allocate"
      - "POST /network/repurchase-cases/{id}/complete, POST /network/repurchase-cases/{id}/dispute"
    shared_operations: ["all GET endpoints"]

  - name: BuyerUser
    description: "Buyer credit union officer: commits to offerings, performs due diligence, funds, flags documentation exceptions, verifies cures, triggers repurchases"
    identity: "entity_backed:CreditUnion"
    exclusive_operations:
      - "POST /network/commitments, POST /network/commitments/{id}/approve-diligence, POST /network/commitments/{id}/decline, POST /network/commitments/{id}/fund, POST /network/commitments/{id}/rescind"
      - "POST /network/exceptions, POST /network/exceptions/{id}/verify-cure"
      - "POST /network/repurchase-cases, POST /network/repurchase-cases/{id}/withdraw"
    shared_operations: ["all GET endpoints"]
