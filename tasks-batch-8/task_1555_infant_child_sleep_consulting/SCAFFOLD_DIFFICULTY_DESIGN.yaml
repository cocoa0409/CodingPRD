              as: Parent
              as_user_id: "${fam_id}"
              captures: { rem_after_cancel: $.data.remaining_calls }
          assert:
            - "After booking: remaining_calls == 0 (captured rem_after_book); 0 + 1 SCHEDULED == included_calls 1"
            - "TroubleshootingSession.${sess_id}.status == CANCELLED"
            - "After cancellation: remaining_calls == 1 (captured rem_after_cancel); 1 + 0 counted sessions == 1 — no entitlement drift"

      - name: credit_ledger_conservation
        grounds:
          - calculations.sla_breach_and_credit
          - calculations.package_price_cents
          - entities.ClientFamily.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = family credit money (cents), a different quantity
          type from the sibling's entitlement count. Forward action: an SLA breach
          grants +1000; compensating action: applying 1000 credit to the next
          package purchase returns the balance to 0. Invariant credit_balance ==
          credits_granted_total - credits_applied_total holds after every step.
        test_recipe:
          setup:
            - "Case ACTIVE_SUPPORT; child INFANT (birth 2026-03-15 -> no surcharge, gross 29900); BASIC package P1 ACTIVE [2026-08-01, 2026-08-14], sla 48h"
            - "Message sent at clock 2026-08-05; consultant responds at 2026-08-10 -> elapsed 120h > 48h -> breach; cap round_half_up(29900*0.10) = 2990 >= 1000 -> credit granted"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-117", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Q", email: "q@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-03-15", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-01" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { pkg1_id: $.data.id }
            - call: "POST /sleep-consulting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /sleep-consulting/cases/${case_id}/messages"
              payload: { body: "he cried for 40 minutes, is this normal?" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { msg_id: $.data.id }
            - call: "POST /sleep-consulting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /sleep-consulting/messages/${msg_id}/respond"
              payload: { response_body: "yes — here is the plan tweak" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { breached: $.data.sla_breached, credit: $.data.credit_granted_cents }
            - call: "GET /sleep-consulting/families/${fam_id}"
              as: Parent
              as_user_id: "${fam_id}"
              captures: { bal_mid: $.data.credit_balance_cents }
          trigger:
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-15", apply_credit_cents: 1000 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { pkg2_id: $.data.id, applied: $.data.credit_applied_cents, net2: $.data.net_price_cents }
            - call: "GET /sleep-consulting/families/${fam_id}"
              as: Parent
              as_user_id: "${fam_id}"
              captures: { bal_end: $.data.credit_balance_cents }
          assert:
            - "Message.${msg_id}: sla_breached == true and credit_granted_cents == 1000 (captured breached/credit)"
            - "ClientFamily.${fam_id}.credit_balance_cents == 1000 after the breach (captured bal_mid)"
            - "SupportPackage.${pkg2_id}.credit_applied_cents == 1000 and net_price_cents == 28900 (29900 - 0 - 1000)"
            - "ClientFamily.${fam_id}.credit_balance_cents == 0 after the compensating purchase (captured bal_end): granted 1000 - applied 1000 == 0"
