            - "RecoveryFund.balance_cents == appropriated_cents (0) + fine_credits_cents (500000) + clawed_back_cents (0) - awarded_cents (0) - assessment_cents (0)"
            - "the trailing 1-cent payment returns 409 ERR_INVALID_STATE, not ERR_PAYMENT_EXCEEDS_BALANCE: the from-state check at priority 9 outranks the fiscal check at priority 50 once the order is SATISFIED"
      - name: the_licensee_cap_and_an_empty_candidate_set_are_two_different_refusals_of_the_same_run
