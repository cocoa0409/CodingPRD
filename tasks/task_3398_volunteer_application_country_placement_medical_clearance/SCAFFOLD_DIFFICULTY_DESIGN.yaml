      - name: cohort_overlap_aggregate_capacity_semantics
        grounds:
          - calculations.cohort_overlap_capacity
          - errors[ERR_TRAINING_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the country-program training resource:
          cohorts in the same program MAY overlap as long as the SUM of overlapping capacities
          stays within training_capacity (6 + 4 == 10 passes exactly at the cap), while one more
          overlapping seat (6 + 4 + 1 == 11 > 10) is rejected — overlap permitted up to a summed
          cap, fundamentally different from the interviews' strict half-open exclusion.
        test_recipe:
          setup:
            - "PE program with training_capacity 10; cohort A (2027-01-01..2027-03-31, capacity 6) and cohort B (2027-02-01..2027-04-30, capacity 4) already created — overlapping, summed exactly at capacity"
