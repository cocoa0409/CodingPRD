              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/care-teams"
              payload: { market_id: "${mkt_id}", app_user_id: "app-002", tech_user_id: "tech-002", supervising_physician_user_id: "md-002", skill_tags: ["POCT", "IV_INFUSION"] }
              as: Dispatcher
              captures: { team_id: $.data.id }
            - call: "POST /dh/care-teams/${team_id}/go-available"
