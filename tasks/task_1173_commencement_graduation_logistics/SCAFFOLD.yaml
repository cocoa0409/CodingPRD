# =============================================================================
# Task 1173 — Commencement & Graduation Logistics
# Scaffold seed tables (§1.0–§1.7). Difficulty target: harder than expert.
# =============================================================================

scenario: |
  1173. Commencement & Graduation Logistics (school graduation committee): graduation eligibility audit & honor designation, ticket allocation & guest limits, regalia ordering & distribution, seating chart, name pronunciation & reader cards, venue/rain-plan & accessibility accommodations, diploma printing & post-ceremony correction, rehearsal attendance & behavior policy, livestream & photography vendor

domain_name: commencement-graduation-logistics
api_prefix: /api

complexity_profile:
  primary_archetype: posture_driven_gating        # Ceremony.readiness_posture gates all child operations
  secondary_archetype: quota_allocation           # ticket pool + seat inventory + accessible-seat pool
  complexity_layers:
    - optimistic_concurrency                      # OCC on Ceremony.version and TicketAllocation.version
    - cascading_side_effects                      # withdraw cascade; rain-plan cascade
    - dual_variant_calculation                    # honor GPA (combined vs institutional); ticket waterfall (provisional vs final)
    - version_pinning_on_approval                 # diploma honors_text pinned at queue time; stale snapshot blocks batch release
  entity_topology: flat                           # peer entities with FK references; no nested creation paths
  state_machine_shape: cyclic                     # diploma correction cycle, regalia exchange cycle, ceremony weather toggling; also parallel dims on Ceremony
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties               # batch release != batch creator; waive != strike recorder; fulfill != approver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology)
# common_fields: true ⇒ id (UUID, no prefix), created_at, updated_at, version
# =============================================================================
entities:
  - name: Ceremony
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Ceremony display name" }
      - { name: ceremony_date, type: datetime, source: input, description: "Scheduled start instant (UTC); correction window is measured from this" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; primary (fair-weather) venue" }
      - { name: rain_venue_id, type: string, source: input, description: "FK -> Venue.id; nullable rain-plan venue", default: null, constraints: "nullable" }
      - { name: readiness_posture, type: enum, source: system, description: "PLANNING | AUDIT_OPEN | AUDIT_LOCKED | READY | COMMENCED | COMPLETED", default: "PLANNING" }
      - { name: weather_mode, type: enum, source: system, description: "FAIR | RAIN_PLAN_ACTIVE — parallel state dimension, independent of readiness_posture", default: "FAIR" }
      - { name: ticket_ratio, type: number, source: input, description: "Guest tickets issued per venue seat; ticket_pool_total = floor(effective_capacity * ticket_ratio)", constraints: "> 0" }
      - { name: guest_ticket_base_cap, type: integer, source: input, description: "Per-graduate guest ticket entitlement before honor bonus", constraints: ">= 0" }
      - { name: honor_bonus_tickets, type: integer, source: input, description: "Extra entitlement for honor_tier != NONE", constraints: ">= 0" }
      - { name: rehearsal_required, type: boolean, source: input, description: "Whether rehearsal conduct policy is enforced", default: true }
      - { name: pronunciation_deadline, type: datetime, source: input, description: "Reader-card submission cutoff (strictly after => rejected)" }
      - { name: ticket_request_deadline, type: datetime, source: input, description: "Ticket request cutoff (strictly after => rejected)" }
      - { name: regalia_order_deadline, type: datetime, source: input, description: "Orders created strictly after this incur the late fee" }
      - { name: effective_capacity, type: integer, source: computed, description: "FAIR: venue.total_capacity; RAIN_PLAN_ACTIVE: rain_venue.total_capacity" }
      - { name: ticket_pool_total, type: integer, source: computed, description: "floor(effective_capacity * ticket_ratio)" }
      - { name: ticket_pool_remaining, type: integer, source: computed, description: "ticket_pool_total - sum(granted_count over non-terminal TicketAllocations)" }
      - { name: open_seat_count, type: integer, source: computed, description: "effective_capacity - count(SeatAssignment status ASSIGNED for this ceremony)" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: total_capacity, type: integer, source: input, description: "Total graduate seats", constraints: ">= 1" }
      - { name: accessible_capacity, type: integer, source: input, description: "Accessible (wheelchair) seat pool size", constraints: ">= 0 and <= total_capacity" }
      - { name: indoor, type: boolean, source: input, description: "Whether the venue is indoors" }

  - name: Graduate
    parent: null
    common_fields: true
    fields:
      - { name: ceremony_id, type: string, source: input, description: "FK -> Ceremony.id" }
      - { name: full_name, type: string, source: input, description: "Legal name (default diploma printed_name)" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: institutional_gpa_credits, type: number, source: input, description: "GPA credits earned at this institution", constraints: ">= 0" }
      - { name: institutional_quality_points, type: number, source: input, description: "Quality points earned at this institution", constraints: ">= 0" }
      - { name: transfer_gpa_credits, type: number, source: input, description: "Transfer GPA credits", default: 0, constraints: ">= 0" }
      - { name: transfer_quality_points, type: number, source: input, description: "Transfer quality points", default: 0, constraints: ">= 0" }
      - { name: credits_completed, type: number, source: input, description: "Credits completed toward degree", constraints: ">= 0" }
      - { name: credits_required, type: number, source: input, description: "Credits required for the degree", constraints: ">= 1" }
      - { name: outstanding_hold_count, type: integer, source: input, description: "Unresolved administrative/financial holds", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING_AUDIT | ELIGIBLE | INELIGIBLE | APPEALING | ELIGIBLE_ON_APPEAL | CONFIRMED | WITHDRAWN", default: "PENDING_AUDIT" }
      - { name: honor_tier, type: enum, source: computed, description: "NONE | CUM_LAUDE | MAGNA_CUM_LAUDE | SUMMA_CUM_LAUDE — provisional (COMBINED) before AUDIT_LOCKED, final (INSTITUTIONAL) after", default: "NONE" }
      - { name: honor_basis, type: enum, source: computed, description: "NONE | COMBINED | INSTITUTIONAL — which honor_gpa_designation variant produced honor_tier", default: "NONE" }
      - { name: conduct_strike_count, type: integer, source: computed, description: "count of RehearsalAttendance status ABSENT for this graduate", default: 0 }
      - { name: walk_privilege_revoked, type: boolean, source: computed, description: "true iff conduct_strike_count >= 2 (MAX_UNEXCUSED_STRIKES)", default: false }

  - name: EligibilityAudit
    parent: null
    common_fields: true
    fields:
      - { name: graduate_id, type: string, source: system, description: "FK -> Graduate.id (from path)" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per eligibility_determination" }
      - { name: fail_reasons, type: array, source: computed, description: "subset of INSUFFICIENT_CREDITS | OUTSTANDING_HOLD | NO_INSTITUTIONAL_CREDITS; empty on PASS" }
      - { name: provisional_honor_tier, type: enum, source: computed, description: "COMBINED-variant honor tier snapshot at audit time (NONE when result FAIL)" }
      - { name: appeal_status, type: enum, source: system, description: "NONE | SUBMITTED | APPROVED | DENIED", default: "NONE" }
      - { name: audited_by_user_id, type: string, source: system, description: "X-User-ID of the RegistrarOfficer who ran the audit" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the CommitteeChair who decided the appeal; null until decided", default: null, constraints: "nullable" }
      - { name: notes, type: string, source: input, description: "Free-text audit notes", default: "", constraints: "optional" }

  - name: TicketAllocation
    parent: null
    common_fields: true
    fields:
      - { name: graduate_id, type: string, source: system, description: "FK -> Graduate.id" }
      - { name: ceremony_id, type: string, source: system, description: "FK -> Ceremony.id (denormalized for ceremony-scoped queries)" }
      - { name: requested_count, type: integer, source: system, description: "Guest tickets requested; mutated only via POST .../request", default: 0 }
      - { name: entitlement_count, type: integer, source: computed, description: "guest_ticket_base_cap + honor bonus (snapshot taken at each waterfall run)", default: 0 }
      - { name: provisional_granted_count, type: integer, source: computed, description: "PROVISIONAL waterfall variant estimate at request time (non-mutating)", default: 0 }
      - { name: granted_count, type: integer, source: computed, description: "FINAL waterfall grant; 0 until a waterfall/promotion runs", default: 0 }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based rank among WAITLISTED allocations in waterfall order; null when not waitlisted", default: null, constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PENDING | ALLOCATED | PARTIAL | WAITLISTED | RELEASED | EXPIRED", default: "PENDING" }

  - name: RegaliaOrder
    parent: null
    common_fields: true
    fields:
      - { name: graduate_id, type: string, source: system, description: "FK -> Graduate.id (from path)" }
      - { name: items, type: array, source: input, description: "Array of { item_type, size, quantity, unit_price_cents }; quantity >= 1; unit_price_cents >= 0" }
      - { name: subtotal_cents, type: integer, source: computed, description: "sum(unit_price_cents * quantity)" }
      - { name: discount_cents, type: integer, source: computed, description: "sum of PER-LINE rounded discounts (rounding order pinned in regalia_pricing)" }
      - { name: late_fee_cents, type: integer, source: computed, description: "round_half_up(discounted_subtotal * 0.10) when created after regalia_order_deadline, else 0" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + late_fee_cents" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | PAID | FULFILLED | EXCHANGE_REQUESTED | CANCELLED", default: "SUBMITTED" }

  - name: SeatAssignment
    parent: null
    common_fields: true
    fields:
      - { name: ceremony_id, type: string, source: system, description: "FK -> Ceremony.id" }
      - { name: graduate_id, type: string, source: system, description: "FK -> Graduate.id" }
      - { name: section, type: string, source: input, description: "Section label, e.g. A" }
      - { name: row_label, type: string, source: input, description: "Row label within section" }
      - { name: seat_number, type: integer, source: input, description: "Seat number within row", constraints: ">= 1" }
      - { name: accessible, type: boolean, source: input, description: "Consumes the venue accessible-seat pool when true", default: false }
      - { name: status, type: enum, source: system, description: "ASSIGNED | EVICTED", default: "ASSIGNED" }
      - { name: evicted_reason, type: enum, source: system, description: "null | RAIN_SHRINK | MANUAL | WITHDRAWN", default: null, constraints: "nullable" }

  - name: ReaderCard
    parent: null
    common_fields: true
    fields:
      - { name: graduate_id, type: string, source: system, description: "FK -> Graduate.id (from path); at most one card per graduate" }
      - { name: phonetic_spelling, type: string, source: input, description: "Phonetic rendering for the name reader" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | LOCKED", default: "SUBMITTED" }
      - { name: approved_by_user_id, type: string, source: system, description: "CommitteeChair who approved; null until approved", default: null, constraints: "nullable" }

  - name: PrintBatch
    parent: null
    common_fields: true
    fields:
      - { name: ceremony_id, type: string, source: system, description: "FK -> Ceremony.id (from path)" }
      - { name: scheduled_print_date, type: datetime, source: input, description: "Planned print date", default: null, constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | RELEASED | PRINTED", default: "OPEN" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating RegistrarOfficer (segregation-of-duties anchor)" }
      - { name: released_by_user_id, type: string, source: system, description: "X-User-ID of the releasing RegistrarOfficer; must differ from created_by_user_id", default: null, constraints: "nullable" }
      - { name: diploma_count, type: integer, source: computed, description: "count of Diplomas currently attached to this batch", default: 0 }

  - name: Diploma
    parent: null
    common_fields: true
    fields:
      - { name: graduate_id, type: string, source: system, description: "FK -> Graduate.id" }
      - { name: print_batch_id, type: string, source: system, description: "FK -> PrintBatch.id" }
      - { name: printed_name, type: string, source: input, description: "Name as printed; defaults to graduate.full_name when omitted", default: null, constraints: "nullable" }
      - { name: honors_text, type: string, source: computed, description: "Derived from pinned_honor_tier at queue time (version-pinned snapshot)" }
      - { name: pinned_honor_tier, type: enum, source: system, description: "Graduate.honor_tier snapshot pinned when the diploma enters a batch; re-pinned on approved correction" }
      - { name: corrected_name, type: string, source: system, description: "Name requested via POST .../corrections; null unless a correction is in flight", default: null, constraints: "nullable" }
      - { name: correction_count, type: integer, source: system, description: "Number of approved corrections", default: 0 }
      - { name: status, type: enum, source: system, description: "QUEUED | PRINTED | ISSUED | CORRECTION_REQUESTED | REPRINT_QUEUED | ARCHIVED", default: "QUEUED" }

  - name: RehearsalSession
    parent: null
    common_fields: true
    fields:
      - { name: ceremony_id, type: string, source: system, description: "FK -> Ceremony.id (from path)" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: start_utc, type: datetime, source: input, description: "Rehearsal window start (half-open interval [start_utc, end_utc))" }
      - { name: end_utc, type: datetime, source: input, description: "Rehearsal window end (exclusive)" }
      - { name: capacity, type: integer, source: input, description: "Max registered attendees", constraints: ">= 1" }
      - { name: registered_count, type: integer, source: computed, description: "count of attendances in REGISTERED or ATTENDED", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: "SCHEDULED" }

  - name: RehearsalAttendance
    parent: null
    common_fields: true
    fields:
      - { name: rehearsal_session_id, type: string, source: system, description: "FK -> RehearsalSession.id" }
      - { name: graduate_id, type: string, source: system, description: "FK -> Graduate.id (from X-User-ID at registration)" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ATTENDED | ABSENT | EXCUSED | CANCELLED", default: "REGISTERED" }
      - { name: checked_in_at, type: datetime, source: system, description: "Check-in instant; null until checked in", default: null, constraints: "nullable" }
      - { name: recorded_by_user_id, type: string, source: system, description: "VenueCoordinator who marked the absence at session completion (SoD anchor)", default: null, constraints: "nullable" }
      - { name: waived_by_user_id, type: string, source: system, description: "VenueCoordinator who waived the absence; must differ from recorded_by_user_id", default: null, constraints: "nullable" }

  - name: AccommodationRequest
    parent: null
    common_fields: true
    fields:
      - { name: graduate_id, type: string, source: system, description: "FK -> Graduate.id (from path)" }
      - { name: ceremony_id, type: string, source: input, description: "FK -> Ceremony.id" }
      - { name: request_type, type: enum, source: input, description: "WHEELCHAIR_SEAT | SIGN_INTERPRETER | ASSISTIVE_LISTENING | SERVICE_ANIMAL" }
      - { name: notes, type: string, source: input, description: "Free-text details", default: "", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | FULFILLED", default: "SUBMITTED" }
      - { name: approved_by_user_id, type: string, source: system, description: "VenueCoordinator approver (SoD anchor)", default: null, constraints: "nullable" }
      - { name: fulfilled_by_user_id, type: string, source: system, description: "VenueCoordinator fulfiller; must differ from approved_by_user_id", default: null, constraints: "nullable" }

  - name: VendorContract
    parent: null
    common_fields: true
    fields:
      - { name: ceremony_id, type: string, source: system, description: "FK -> Ceremony.id (from path)" }
      - { name: vendor_type, type: enum, source: input, description: "LIVESTREAM | PHOTOGRAPHY" }
      - { name: vendor_user_id, type: string, source: input, description: "Opaque Vendor X-User-ID allowed to submit the deliverable" }
      - { name: coverage_start_utc, type: datetime, source: input, description: "Coverage window start (closed, buffered interval)" }
      - { name: coverage_end_utc, type: datetime, source: input, description: "Coverage window end (closed, buffered interval)", constraints: "> coverage_start_utc" }
      - { name: setup_buffer_minutes, type: integer, source: input, description: "Buffer added on BOTH sides of the window for overlap detection", default: 30, constraints: ">= 0" }
      - { name: fee_cents, type: integer, source: input, description: "Contracted fee", constraints: ">= 0" }
      - { name: deliverable_url, type: string, source: system, description: "Submitted deliverable link; null until submitted", default: null, constraints: "nullable" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "vendor_cancellation_fee output; null until cancelled", default: null, constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SETTLED | CANCELLED", default: "DRAFT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Ceremony
    initial_state: PLANNING
    terminal_states: [COMPLETED]
    note: "Two parallel dimensions: readiness_posture (this machine) x weather_mode (FAIR <-> RAIN_PLAN_ACTIVE, toggled independently while posture in {AUDIT_LOCKED, READY})."
    transitions:
      - from: PLANNING
        to: AUDIT_OPEN
        trigger: "POST /api/ceremonies/{id}/open-audit"
        actor: CommitteeChair
        preconditions: ["readiness_posture == PLANNING"]
        side_effects: ["increments Ceremony.version by 1"]
      - from: AUDIT_OPEN
        to: AUDIT_LOCKED
        trigger: "POST /api/ceremonies/{id}/lock-audit"
        actor: CommitteeChair
        preconditions: ["readiness_posture == AUDIT_OPEN"]
        side_effects:
          - "honor_gpa_designation FINAL (INSTITUTIONAL) variant recomputed for every Graduate with status in {ELIGIBLE, ELIGIBLE_ON_APPEAL, CONFIRMED}; Graduate.honor_tier and honor_basis updated (basis := INSTITUTIONAL)"
          - "increments Ceremony.version by 1"
      - from: AUDIT_LOCKED
        to: AUDIT_OPEN
        trigger: "POST /api/ceremonies/{id}/reopen-audit"
        actor: CommitteeChair
        preconditions:
          - "readiness_posture == AUDIT_LOCKED"
          - "no PrintBatch for this ceremony in status RELEASED or PRINTED (else ERR_INVALID_STATE)"
        side_effects:
          - "honor_gpa_designation PROVISIONAL (COMBINED) variant recomputed for every audited non-WITHDRAWN Graduate; honor_basis := COMBINED (may strand QUEUED diploma honor snapshots)"
          - "increments Ceremony.version by 1"
      - from: AUDIT_LOCKED
        to: READY
        trigger: "POST /api/ceremonies/{id}/mark-ready"
        actor: CommitteeChair
        preconditions:
          - "readiness_posture == AUDIT_LOCKED"
          - "no non-WITHDRAWN Graduate in status PENDING_AUDIT or APPEALING (else ERR_CEREMONY_POSTURE_FORBIDS)"
          - "every Graduate in {ELIGIBLE, ELIGIBLE_ON_APPEAL, CONFIRMED} has a ReaderCard in {SUBMITTED, APPROVED} (else ERR_CEREMONY_POSTURE_FORBIDS)"
        side_effects:
          - "every ReaderCard in {SUBMITTED, APPROVED} for this ceremony's graduates -> LOCKED"
          - "increments Ceremony.version by 1"
      - from: READY
        to: COMMENCED
        trigger: "POST /api/ceremonies/{id}/commence"
        actor: CommitteeChair
        preconditions: ["readiness_posture == READY"]
        side_effects: ["increments Ceremony.version by 1"]
      - from: COMMENCED
        to: COMPLETED
        trigger: "POST /api/ceremonies/{id}/complete"
        actor: CommitteeChair
        preconditions: ["readiness_posture == COMMENCED"]
        side_effects:
          - "every TicketAllocation for this ceremony in {PENDING, WAITLISTED} -> EXPIRED"
          - "increments Ceremony.version by 1"
      - from: FAIR
        to: RAIN_PLAN_ACTIVE
        trigger: "POST /api/ceremonies/{id}/activate-rain-plan"
        actor: VenueCoordinator
        preconditions:
          - "weather_mode == FAIR"
          - "readiness_posture in {AUDIT_LOCKED, READY} (else ERR_CEREMONY_POSTURE_FORBIDS)"
          - "rain_venue_id is not null (else ERR_RAIN_VENUE_MISSING)"
          - "count(APPROVED|FULFILLED WHEELCHAIR_SEAT AccommodationRequests) <= rain_venue.accessible_capacity (else ERR_ACCESSIBLE_CAPACITY_EXCEEDED)"
        side_effects:
          - "weather_mode := RAIN_PLAN_ACTIVE"
          - "effective_capacity_and_pools recompute: effective_capacity := rain_venue.total_capacity; open_seat_count and ticket_pool_total recomputed"
          - "seat eviction cascade: while count(SeatAssignment ASSIGNED) > effective_capacity, evict per selector (accessible ASC first, then row_label DESC, seat_number DESC, created_at DESC) -> status EVICTED, evicted_reason RAIN_SHRINK; each eviction bumps open_seat_count"
          - "ticket_pool_waterfall FINAL variant re-run (grants may shrink; WAITLISTED/PARTIAL reassigned; ticket_pool_remaining recomputed)"
          - "increments Ceremony.version by 1"
      - from: RAIN_PLAN_ACTIVE
        to: FAIR
        trigger: "POST /api/ceremonies/{id}/deactivate-rain-plan"
        actor: VenueCoordinator
        preconditions:
          - "weather_mode == RAIN_PLAN_ACTIVE"
          - "readiness_posture in {AUDIT_LOCKED, READY} (else ERR_CEREMONY_POSTURE_FORBIDS)"
        side_effects:
          - "weather_mode := FAIR; effective_capacity_and_pools recompute"
          - "EVICTED seats are NOT restored (stay EVICTED); open_seat_count grows"
          - "ticket_pool_waterfall FINAL variant re-run (pool increase triggers waitlist promotion scan)"
          - "increments Ceremony.version by 1"

  - entity: Graduate
    initial_state: PENDING_AUDIT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING_AUDIT
        to: ELIGIBLE
        trigger: "POST /api/graduates/{id}/audits with computed result PASS"
        actor: RegistrarOfficer
        preconditions:
          - "graduate.status == PENDING_AUDIT"
          - "ceremony.readiness_posture == AUDIT_OPEN (else ERR_CEREMONY_POSTURE_FORBIDS)"
          - "eligibility_determination result == PASS"
        side_effects:
          - "EligibilityAudit created (result PASS, provisional_honor_tier = COMBINED variant tier)"
          - "honor_gpa_designation PROVISIONAL variant: honor_tier := COMBINED tier; honor_basis := COMBINED"
          - "increments Graduate.version by 1"
      - from: PENDING_AUDIT
        to: INELIGIBLE
        trigger: "POST /api/graduates/{id}/audits with computed result FAIL"
        actor: RegistrarOfficer
        preconditions:
          - "graduate.status == PENDING_AUDIT"
          - "ceremony.readiness_posture == AUDIT_OPEN"
          - "eligibility_determination result == FAIL"
        side_effects:
          - "EligibilityAudit created (result FAIL, fail_reasons populated, provisional_honor_tier NONE)"
          - "increments Graduate.version by 1"
      - from: INELIGIBLE
        to: APPEALING
        trigger: "POST /api/eligibility-audits/{id}/appeal"
        actor: Graduate
        preconditions:
          - "graduate.status == INELIGIBLE and the audit is the graduate's latest audit"
          - "now <= audit.created_at + 14 days (APPEAL_WINDOW_DAYS) else ERR_APPEAL_WINDOW_CLOSED"
          - "audit.appeal_status == NONE"
        side_effects:
          - "audit.appeal_status := SUBMITTED"
          - "increments Graduate.version by 1"
      - from: APPEALING
        to: ELIGIBLE_ON_APPEAL
        trigger: "POST /api/eligibility-audits/{id}/appeal-decision with decision APPROVED"
        actor: CommitteeChair
        preconditions: ["graduate.status == APPEALING", "audit.appeal_status == SUBMITTED"]
        side_effects:
          - "audit.appeal_status := APPROVED; audit.decided_by_user_id := caller"
          - "honor_gpa_designation PROVISIONAL (COMBINED) recomputed; honor_basis := COMBINED"
          - "increments Graduate.version by 1"
      - from: APPEALING
        to: INELIGIBLE
        trigger: "POST /api/eligibility-audits/{id}/appeal-decision with decision DENIED"
        actor: CommitteeChair
        preconditions: ["graduate.status == APPEALING", "audit.appeal_status == SUBMITTED"]
        side_effects: ["audit.appeal_status := DENIED", "increments Graduate.version by 1"]
      - from: ELIGIBLE
        to: CONFIRMED
        trigger: "POST /api/graduates/{id}/confirm"
        actor: Graduate
        preconditions: ["graduate.status in {ELIGIBLE, ELIGIBLE_ON_APPEAL}", "ceremony.readiness_posture != COMPLETED"]
        side_effects: ["increments Graduate.version by 1"]
      - from: ELIGIBLE_ON_APPEAL
        to: CONFIRMED
        trigger: "POST /api/graduates/{id}/confirm"
        actor: Graduate
        preconditions: ["graduate.status in {ELIGIBLE, ELIGIBLE_ON_APPEAL}", "ceremony.readiness_posture != COMPLETED"]
        side_effects: ["increments Graduate.version by 1"]
      - from: ANY_NON_TERMINAL
        to: WITHDRAWN
        trigger: "POST /api/graduates/{id}/withdraw"
        actor: "RegistrarOfficer | Graduate (self)"
        preconditions:
          - "graduate.status != WITHDRAWN"
          - "ceremony.readiness_posture != COMPLETED"
        side_effects:
          - "TicketAllocation (if not RELEASED/EXPIRED) -> RELEASED: ticket_pool_remaining += granted_count; granted_count := 0 — this release itself triggers the ticket_pool_waterfall promotion scan over remaining WAITLISTED/PARTIAL allocations, and each promotion decrements ticket_pool_remaining"
          - "SeatAssignment ASSIGNED -> EVICTED (evicted_reason WITHDRAWN); open_seat_count += 1 per eviction"
          - "RegaliaOrder SUBMITTED -> CANCELLED (PAID/FULFILLED orders untouched)"
          - "RehearsalAttendance REGISTERED -> CANCELLED"
          - "Diploma QUEUED|REPRINT_QUEUED -> ARCHIVED (PRINTED/ISSUED untouched)"
          - "increments Graduate.version by 1"

  - entity: TicketAllocation
    initial_state: PENDING
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "POST /api/ticket-allocations/{id}/request"
        actor: Graduate
        preconditions:
          - "allocation.status in {PENDING, ALLOCATED, PARTIAL, WAITLISTED} (new request supersedes prior request terms)"
          - "ceremony.readiness_posture == AUDIT_OPEN (else ERR_CEREMONY_POSTURE_FORBIDS)"
          - "graduate.status in {ELIGIBLE, ELIGIBLE_ON_APPEAL, CONFIRMED} (else ERR_GRADUATE_NOT_ELIGIBLE)"
          - "now <= ceremony.ticket_request_deadline (else ERR_REQUEST_WINDOW_CLOSED)"
          - "requested_count >= 1 (else ERR_INVALID_REQUEST)"
          - "requested_count <= guest_ticket_base_cap + honor bonus (else ERR_TICKET_CAP_EXCEEDED)"
        side_effects:
          - "requested_count updated; provisional_granted_count recomputed (PROVISIONAL waterfall variant)"
          - "increments TicketAllocation.version by 1"
      - from: PENDING
        to: ALLOCATED
        trigger: "POST /api/ceremonies/{id}/run-ticket-waterfall (or promotion scan) when grant == target"
        actor: system
        preconditions: []
        side_effects: ["granted_count := target; ticket_pool_remaining debited; waitlist_position := null"]
      - from: PENDING
        to: PARTIAL
        trigger: "waterfall when 0 < grant < target"
        actor: system
        preconditions: []
        side_effects: ["granted_count := grant; ticket_pool_remaining debited"]
      - from: PENDING
        to: WAITLISTED
        trigger: "waterfall when grant == 0"
        actor: system
        preconditions: []
        side_effects: ["granted_count := 0; waitlist_position assigned (1-based, waterfall order among zero-grant allocations)"]
      - from: WAITLISTED
        to: ALLOCATED
        trigger: "promotion scan when top-up reaches target"
        actor: system
        preconditions: []
        side_effects: ["granted_count := target; waitlist_position := null; ticket_pool_remaining debited"]
      - from: WAITLISTED
        to: PARTIAL
        trigger: "promotion scan when 0 < top-up < target"
        actor: system
        preconditions: []
        side_effects: ["granted_count += top-up; waitlist_position := null"]
      - from: PARTIAL
        to: ALLOCATED
        trigger: "promotion scan when top-up reaches target"
        actor: system
        preconditions: []
        side_effects: ["granted_count := target; ticket_pool_remaining debited"]
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /api/ticket-allocations/{id}/release or graduate withdrawal"
        actor: "Graduate | system"
        preconditions: ["allocation.status in {PENDING, ALLOCATED, PARTIAL, WAITLISTED}"]
        side_effects:
          - "ticket_pool_remaining += granted_count; granted_count := 0; waitlist_position := null"
          - "triggers ticket_pool_waterfall promotion scan over remaining WAITLISTED/PARTIAL allocations in waterfall order"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /api/ceremonies/{id}/complete"
        actor: system
        preconditions: []
        side_effects: ["granted_count := 0"]
      - from: WAITLISTED
        to: EXPIRED
        trigger: "POST /api/ceremonies/{id}/complete"
        actor: system
        preconditions: []
        side_effects: ["granted_count := 0; waitlist_position := null"]

  - entity: RegaliaOrder
    initial_state: SUBMITTED
    terminal_states: [CANCELLED]
    transitions:
      - from: SUBMITTED
        to: PAID
        trigger: "POST /api/regalia-orders/{id}/pay"
        actor: Graduate
        preconditions:
          - "order.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "amount_cents == total_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects: ["increments RegaliaOrder.version by 1"]
      - from: PAID
        to: FULFILLED
        trigger: "POST /api/regalia-orders/{id}/fulfill"
        actor: CommitteeChair
        preconditions:
          - "order.status in {PAID, EXCHANGE_REQUESTED}"
          - "graduate.walk_privilege_revoked == false (else ERR_WALK_PRIVILEGE_REVOKED)"
        side_effects: ["increments RegaliaOrder.version by 1"]
      - from: EXCHANGE_REQUESTED
        to: FULFILLED
        trigger: "POST /api/regalia-orders/{id}/fulfill (exchange re-fulfillment)"
        actor: CommitteeChair
        preconditions: ["order.status in {PAID, EXCHANGE_REQUESTED}", "graduate.walk_privilege_revoked == false"]
        side_effects: ["increments RegaliaOrder.version by 1"]
      - from: FULFILLED
        to: EXCHANGE_REQUESTED
        trigger: "POST /api/regalia-orders/{id}/request-exchange"
        actor: Graduate
        preconditions: ["order.status == FULFILLED"]
        side_effects: ["increments RegaliaOrder.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/regalia-orders/{id}/cancel or graduate withdrawal"
        actor: "Graduate | system"
        preconditions: ["order.status == SUBMITTED"]
        side_effects: ["increments RegaliaOrder.version by 1"]

  - entity: SeatAssignment
    initial_state: ASSIGNED
    terminal_states: [EVICTED]
    transitions:
      - from: ASSIGNED
        to: EVICTED
        trigger: "POST /api/seat-assignments/{id}/evict, rain-plan eviction cascade, or graduate withdrawal"
        actor: "VenueCoordinator | system"
        preconditions: ["seat.status == ASSIGNED"]
        side_effects: ["evicted_reason set (MANUAL | RAIN_SHRINK | WITHDRAWN)", "open_seat_count += 1"]

  - entity: ReaderCard
    initial_state: SUBMITTED
    terminal_states: [LOCKED]
    transitions:
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "PATCH /api/reader-cards/{id}"
        actor: Graduate
        preconditions: ["card.status == SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: ["phonetic_spelling updated", "increments ReaderCard.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/reader-cards/{id}/approve"
        actor: CommitteeChair
        preconditions: ["card.status == SUBMITTED"]
        side_effects: ["approved_by_user_id := caller", "increments ReaderCard.version by 1"]
      - from: SUBMITTED
        to: LOCKED
        trigger: "POST /api/ceremonies/{id}/mark-ready (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: LOCKED
        trigger: "POST /api/ceremonies/{id}/mark-ready (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrintBatch
    initial_state: OPEN
    terminal_states: [PRINTED]
    transitions:
      - from: OPEN
        to: RELEASED
        trigger: "POST /api/print-batches/{id}/release"
        actor: RegistrarOfficer
        preconditions:
          - "batch.status == OPEN"
          - "caller X-User-ID != batch.created_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "ceremony.readiness_posture in {AUDIT_LOCKED, READY, COMMENCED, COMPLETED} — post-ceremony correction reprints must remain releasable (else ERR_CEREMONY_POSTURE_FORBIDS)"
          - "batch.diploma_count >= 1 (else ERR_BATCH_NOT_RELEASABLE)"
          - "every attached Diploma in {QUEUED, REPRINT_QUEUED} has pinned_honor_tier == graduate.honor_tier (else ERR_HONOR_SNAPSHOT_STALE)"
        side_effects: ["released_by_user_id := caller", "increments PrintBatch.version by 1"]
      - from: RELEASED
        to: PRINTED
        trigger: "POST /api/print-batches/{id}/mark-printed"
        actor: RegistrarOfficer
        preconditions: ["batch.status == RELEASED"]
        side_effects:
          - "every attached Diploma in {QUEUED, REPRINT_QUEUED} -> PRINTED"
          - "increments PrintBatch.version by 1"

  - entity: Diploma
    initial_state: QUEUED
    terminal_states: [ARCHIVED]
    transitions:
      - from: QUEUED
        to: PRINTED
        trigger: "POST /api/print-batches/{id}/mark-printed (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRINTED
        to: ISSUED
        trigger: "POST /api/diplomas/{id}/issue"
        actor: CommitteeChair
        preconditions:
          - "diploma.status == PRINTED"
          - "ceremony.readiness_posture == COMMENCED (else ERR_CEREMONY_POSTURE_FORBIDS)"
        side_effects: ["increments Diploma.version by 1"]
      - from: ISSUED
        to: CORRECTION_REQUESTED
        trigger: "POST /api/diplomas/{id}/corrections"
        actor: Graduate
        preconditions:
          - "diploma.status == ISSUED"
          - "now <= ceremony.ceremony_date + 30 days (CORRECTION_WINDOW_DAYS) else ERR_CORRECTION_WINDOW_CLOSED"
        side_effects: ["corrected_name := request value", "increments Diploma.version by 1"]
      - from: CORRECTION_REQUESTED
        to: REPRINT_QUEUED
        trigger: "POST /api/diplomas/{id}/correction-decision with decision APPROVED"
        actor: RegistrarOfficer
        preconditions:
          - "diploma.status == CORRECTION_REQUESTED"
          - "an OPEN PrintBatch exists for the ceremony (else ERR_NO_OPEN_REPRINT_BATCH)"
        side_effects:
          - "print_batch_id := the OPEN batch; printed_name := corrected_name; corrected_name := null"
          - "correction_count += 1; honors_text and pinned_honor_tier re-pinned from graduate's CURRENT honor_tier"
          - "increments Diploma.version by 1"
      - from: CORRECTION_REQUESTED
        to: ISSUED
        trigger: "POST /api/diplomas/{id}/correction-decision with decision DENIED"
        actor: RegistrarOfficer
        preconditions: ["diploma.status == CORRECTION_REQUESTED"]
        side_effects: ["corrected_name := null", "increments Diploma.version by 1"]
      - from: REPRINT_QUEUED
        to: PRINTED
        trigger: "POST /api/print-batches/{id}/mark-printed (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUEUED
        to: ARCHIVED
        trigger: "graduate withdrawal (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REPRINT_QUEUED
        to: ARCHIVED
        trigger: "graduate withdrawal (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RehearsalSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/rehearsal-sessions/{id}/complete"
        actor: VenueCoordinator
        preconditions: ["session.status == SCHEDULED"]
        side_effects:
          - "every attendance still REGISTERED -> ABSENT with recorded_by_user_id := caller; conduct_strike_policy recomputed per affected graduate (strike += 1; walk_privilege_revoked re-evaluated)"
          - "increments RehearsalSession.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/rehearsal-sessions/{id}/cancel"
        actor: VenueCoordinator
        preconditions: ["session.status == SCHEDULED"]
        side_effects: ["every attendance REGISTERED -> CANCELLED (no strikes)", "increments RehearsalSession.version by 1"]

  - entity: RehearsalAttendance
    initial_state: REGISTERED
    terminal_states: [ATTENDED, ABSENT, EXCUSED, CANCELLED]
    transitions:
      - from: REGISTERED
        to: ATTENDED
        trigger: "POST /api/rehearsal-attendances/{id}/check-in"
        actor: VenueCoordinator
        preconditions: ["attendance.status == REGISTERED", "session.status == SCHEDULED"]
        side_effects: ["checked_in_at := now"]
      - from: REGISTERED
        to: ABSENT
        trigger: "POST /api/rehearsal-sessions/{id}/complete (cascade)"
        actor: system
        preconditions: []
        side_effects: ["recorded_by_user_id := completing coordinator", "graduate.conduct_strike_count += 1; walk_privilege_revoked recomputed (>= 2)"]
      - from: ABSENT
        to: EXCUSED
        trigger: "POST /api/rehearsal-attendances/{id}/waive"
        actor: VenueCoordinator
        preconditions:
          - "attendance.status == ABSENT"
          - "caller X-User-ID != attendance.recorded_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["waived_by_user_id := caller", "graduate.conduct_strike_count -= 1; walk_privilege_revoked recomputed"]
      - from: REGISTERED
        to: CANCELLED
        trigger: "session cancel or graduate withdrawal (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AccommodationRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, FULFILLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/accommodation-requests/{id}/approve"
        actor: VenueCoordinator
        preconditions:
          - "request.status == SUBMITTED"
          - "for WHEELCHAIR_SEAT: count(WHEELCHAIR_SEAT requests in {APPROVED, FULFILLED} for this ceremony) < effective venue accessible_capacity (else ERR_ACCESSIBLE_CAPACITY_EXCEEDED)"
        side_effects: ["approved_by_user_id := caller"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/accommodation-requests/{id}/deny"
        actor: VenueCoordinator
        preconditions: ["request.status == SUBMITTED"]
        side_effects: []
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /api/accommodation-requests/{id}/fulfill"
        actor: VenueCoordinator
        preconditions:
          - "request.status == APPROVED"
          - "caller X-User-ID != request.approved_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["fulfilled_by_user_id := caller"]

  - entity: VendorContract
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/vendor-contracts/{id}/activate"
        actor: CommitteeChair
        preconditions:
          - "contract.status == DRAFT"
          - "ceremony.readiness_posture in {AUDIT_LOCKED, READY, COMMENCED} (else ERR_CEREMONY_POSTURE_FORBIDS)"
        side_effects: ["increments VendorContract.version by 1"]
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /api/vendor-contracts/{id}/settle"
        actor: CommitteeChair
        preconditions:
          - "contract.status == ACTIVE"
          - "contract.deliverable_url is not null (else ERR_VENDOR_DELIVERABLE_MISSING)"
        side_effects: ["increments VendorContract.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/vendor-contracts/{id}/cancel"
        actor: CommitteeChair
        preconditions: ["contract.status in {DRAFT, ACTIVE}"]
        side_effects: ["vendor_cancellation_fee computed and stored on cancellation_fee_cents", "increments VendorContract.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/vendor-contracts/{id}/cancel"
        actor: CommitteeChair
        preconditions: ["contract.status in {DRAFT, ACTIVE}"]
        side_effects: ["vendor_cancellation_fee computed and stored on cancellation_fee_cents", "increments VendorContract.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: ceremony-config-stale-version
    parent_entity: Ceremony
    write_endpoint: "PATCH /api/ceremonies/{id}"
    occ_field: "expected_ceremony_version"
    description: |
      Updating ceremony configuration against a stale observed version is
      rejected. The client must present the version it last read; if any
      intervening write (PATCH or lifecycle action) advanced Ceremony.version,
      the update is rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ticket-request-supersede-stale-version
    parent_entity: TicketAllocation
    write_endpoint: "POST /api/ticket-allocations/{id}/request"
    occ_field: "expected_ticket_allocation_version"
    description: |
      Posting a ticket request supersedes the allocation's prior request
      terms; doing so against a stale observed TicketAllocation.version is
      rejected with ERR_STALE_VERSION so a client never silently overwrites
      request terms it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: honor_gpa_designation
    trigger: "audit creation (PROVISIONAL/COMBINED), lock-audit (FINAL/INSTITUTIONAL), reopen-audit (COMBINED), appeal-decision APPROVED (COMBINED), grade-revision (INSTITUTIONAL)"
    algorithm: threshold
    formula: |
      gpa(qp, cr) = cr == 0 ? 0.000 : round_half_up(qp / cr, 3)
      tier(g) = SUMMA_CUM_LAUDE if g >= 3.900
                MAGNA_CUM_LAUDE if g >= 3.700
                CUM_LAUDE       if g >= 3.500
                NONE            otherwise
      COMBINED variant:      g = gpa(institutional_quality_points + transfer_quality_points,
                                     institutional_gpa_credits + transfer_gpa_credits)
      INSTITUTIONAL variant: g = gpa(institutional_quality_points, institutional_gpa_credits)
    input_set: "the single Graduate being (re)scored; honor recomputed only for graduates in {ELIGIBLE, ELIGIBLE_ON_APPEAL, CONFIRMED} family (never for INELIGIBLE/PENDING_AUDIT/WITHDRAWN — those keep NONE)"
    constants:
      SUMMA_THRESHOLD: 3.900
      MAGNA_THRESHOLD: 3.700
      CUM_THRESHOLD: 3.500
      GPA_DECIMALS: 3
    precision: "GPA rounded to 3 decimal places, round_half_up, BEFORE threshold comparison (comparison uses >=)"
    variants:
      - name: COMBINED
        when: "provisional designation — at audit creation, reopen-audit, appeal approval"
        difference: "includes transfer credits/points; can yield a different tier than INSTITUTIONAL for identical graduate data"
      - name: INSTITUTIONAL
        when: "final designation — at lock-audit and grade-revision"
        difference: "excludes transfer credits/points; this is the tier printed on diplomas and used for ticket honor bonus"

  - name: eligibility_determination
    trigger: "POST /api/graduates/{id}/audits"
    algorithm: threshold
    formula: |
      PASS iff credits_completed >= credits_required
           AND outstanding_hold_count == 0
           AND institutional_gpa_credits > 0
      fail_reasons accumulates INSUFFICIENT_CREDITS | OUTSTANDING_HOLD | NO_INSTITUTIONAL_CREDITS
    input_set: "the audited Graduate's current credit/hold fields"
    constants: {}
    precision: "exact numeric comparison; boundary credits_completed == credits_required PASSES (>=)"
    variants: []

  - name: ticket_pool_waterfall
    trigger: "POST /api/ticket-allocations/{id}/request (PROVISIONAL estimate, non-mutating), POST /api/ceremonies/{id}/run-ticket-waterfall (FINAL), release/withdraw and rain-plan toggles (FINAL promotion/recompute)"
    algorithm: waterfall_allocation
    formula: |
      entitlement(g) = ceremony.guest_ticket_base_cap + (g.honor_tier != NONE ? ceremony.honor_bonus_tickets : 0)
      target(a)      = min(a.requested_count, entitlement(a.graduate))
      pool_total     = floor(ceremony.effective_capacity * ceremony.ticket_ratio)
      waterfall order = honor_rank DESC (SUMMA 3, MAGNA 2, CUM 1, NONE 0),
                        then requested_count DESC,
                        then allocation.created_at ASC   (never id)
      FINAL run: for each allocation with status in {PENDING, ALLOCATED, PARTIAL, WAITLISTED}
                 (RELEASED/EXPIRED excluded), reset granted_count := 0, then in waterfall order:
                 grant_i = min(target_i, pool_remaining); pool_remaining -= grant_i
                 status := ALLOCATED if grant == target, PARTIAL if 0 < grant < target,
                           WAITLISTED if grant == 0 (waitlist_position = 1-based rank among
                           zero-grant allocations in waterfall order, else null)
      PROMOTION scan (on pool increase: release, withdraw, deactivate-rain):
                 iterate unsatisfied allocations (PARTIAL, WAITLISTED) in waterfall order:
                 top_up = min(target_i - granted_i, pool_remaining); pool_remaining -= top_up
      PROVISIONAL (at request time): provisional_granted_count =
                 min(requested_count, entitlement(graduate using CURRENT honor_tier),
                     ceremony.ticket_pool_remaining)  — estimate only, does NOT mutate the pool
    input_set: "all TicketAllocations of the ceremony with status in {PENDING, ALLOCATED, PARTIAL, WAITLISTED} AND requested_count >= 1 (RELEASED/EXPIRED and never-requested allocations are excluded — a PENDING allocation with requested_count 0 stays PENDING)"
    constants:
      HONOR_RANK: { NONE: 0, CUM_LAUDE: 1, MAGNA_CUM_LAUDE: 2, SUMMA_CUM_LAUDE: 3 }
    precision: "integer ticket counts; pool_total uses floor"
    variants:
      - name: PROVISIONAL
        when: "computed at POST .../request time"
        difference: "uses CURRENT weather_mode, CURRENT honor_tier (possibly COMBINED-provisional) and CURRENT pool_remaining; stored on provisional_granted_count; may diverge from the FINAL grant"
      - name: FINAL
        when: "run-ticket-waterfall, promotion scans, rain-plan recompute"
        difference: "uses effective_capacity under the CURRENT weather_mode and FINAL honor tiers; mutates granted_count/status/waitlist_position"

  - name: regalia_pricing
    trigger: "POST /api/graduates/{id}/regalia-orders (computed at creation; exchange does NOT re-price)"
    algorithm: tiered_pricing
    formula: |
      line_total(line)   = line.unit_price_cents * line.quantity
      subtotal_cents     = sum(line_total)
      discount_pct       = 0.15 if subtotal_cents >= 20000 else 0.10 if subtotal_cents >= 10000 else 0
      # pinned evaluation order: (1) tier keyed on PRE-discount subtotal;
      # (2) discount rounded PER LINE ITEM then summed;
      discount_cents     = sum(round_half_up(line_total(line) * discount_pct))
      discounted         = subtotal_cents - discount_cents
      # (3) late fee computed on the already-rounded discounted subtotal:
      late_fee_cents     = created_at > ceremony.regalia_order_deadline
                           ? round_half_up(discounted * 0.10) : 0
      total_cents        = discounted + late_fee_cents
    input_set: "the order's items array; ceremony.regalia_order_deadline; server created_at"
    constants:
      TIER1_MIN_CENTS: 10000
      TIER1_PCT: 0.10
      TIER2_MIN_CENTS: 20000
      TIER2_PCT: 0.15
      LATE_RATE: 0.10
    precision: "integer cents; round_half_up PER LINE for discounts (per-line-then-sum pinned; sum-then-round yields different cents and is WRONG)"
    variants:
      - name: ON_TIME
        when: "created_at <= regalia_order_deadline (deadline instant itself is on time)"
        difference: "late_fee_cents = 0"
      - name: LATE
        when: "created_at strictly after regalia_order_deadline"
        difference: "late_fee_cents = round_half_up(discounted * 0.10)"

  - name: effective_capacity_and_pools
    trigger: "ceremony creation, activate-rain-plan, deactivate-rain-plan, seat assign/evict, ticket waterfall/grant/release"
    algorithm: aggregation
    formula: |
      effective_capacity   = weather_mode == FAIR ? venue.total_capacity : rain_venue.total_capacity
      open_seat_count      = effective_capacity - count(SeatAssignment ASSIGNED for ceremony)
      ticket_pool_total    = floor(effective_capacity * ticket_ratio)
      ticket_pool_remaining = ticket_pool_total - sum(granted_count over allocations
                              with status in {PENDING, ALLOCATED, PARTIAL, WAITLISTED})
    input_set: "ceremony's venue/rain_venue; SeatAssignments ASSIGNED; non-terminal TicketAllocations"
    constants: {}
    precision: "integer; floor for pool_total"
    variants: []

  - name: conduct_strike_policy
    trigger: "rehearsal session completion (strike += 1 per ABSENT), attendance waive (strike -= 1)"
    algorithm: threshold
    formula: |
      conduct_strike_count(g) = count(RehearsalAttendance ABSENT for g across the ceremony's sessions)
      walk_privilege_revoked(g) = conduct_strike_count(g) >= 2
    input_set: "all RehearsalAttendance rows for the graduate (CANCELLED/EXCUSED/ATTENDED/REGISTERED do not count)"
    constants:
      MAX_UNEXCUSED_STRIKES: 2
    precision: "integer count; revocation boundary is >= 2 (exactly 2 revokes)"
    variants: []

  - name: vendor_cancellation_fee
    trigger: "POST /api/vendor-contracts/{id}/cancel"
    algorithm: threshold
    formula: |
      cancellation_fee_cents = now < coverage_start_utc
                               ? round_half_up(fee_cents * 0.10)
                               : round_half_up(fee_cents * 0.50)
    input_set: "the contract; logical clock 'now'"
    constants:
      CANCEL_BEFORE_START_PCT: 0.10
      CANCEL_AT_OR_AFTER_START_PCT: 0.50
    precision: "integer cents, round_half_up; boundary now == coverage_start_utc uses the 0.50 rate (>=)"
    variants: []

  - name: seating_run_assignment
    trigger: "POST /api/ceremonies/{id}/run-seating"
    algorithm: constraint_propagation
    formula: |
      candidates = graduates in {ELIGIBLE, ELIGIBLE_ON_APPEAL, CONFIRMED} with no ASSIGNED seat,
                   ordered by honor_rank DESC, then graduate.created_at ASC
      seat cursor: section "A", rows numbered 1.., seats per row SEATS_PER_ROW = 4,
                   next free seat = lowest (row, seat_number) not occupied by an ASSIGNED seat
      for each candidate in order: assign next free seat;
        if candidate has an APPROVED|FULFILLED WHEELCHAIR_SEAT AccommodationRequest:
          require count(accessible ASSIGNED) < effective venue accessible_capacity
          (else skip candidate — remains unassigned); seat.accessible := true
      stop when candidates exhausted or no free seat under effective_capacity
    input_set: "ceremony's eligible-family graduates, existing ASSIGNED seats, effective_capacity, accessible pool"
    constants:
      SEATS_PER_ROW: 4
      DEFAULT_SECTION: "A"
    precision: "deterministic selector; ties broken by graduate.created_at ASC (never id)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path-templated resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "request body schema: required fields present, types valid, enum values in domain, ranges valid (requested_count >= 1, end_utc > start_utc, capacities >= 1, amounts >= 0)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: auth, check: "ownership: Graduate role may only touch own resources (X-User-ID == graduate_id of the target chain); Vendor may only submit deliverables on contracts with vendor_user_id == X-User-ID", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "graduate-scoped and vendor deliverable endpoints" }
  - { priority: 6, category: auth, check: "segregation of duties: batch release caller != created_by_user_id; attendance waive caller != recorded_by_user_id; accommodation fulfill caller != approved_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /api/print-batches/{id}/release", "POST /api/rehearsal-attendances/{id}/waive", "POST /api/accommodation-requests/{id}/fulfill"] }
  - { priority: 7, category: state, check: "optimistic concurrency: expected_ceremony_version / expected_ticket_allocation_version must equal the current entity version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["PATCH /api/ceremonies/{id}", "POST /api/ticket-allocations/{id}/request"] }
  - { priority: 8, category: state, check: "target entity's own state machine permits the transition from its current state", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: state, check: "cross-entity posture gate: ceremony.readiness_posture permits the operation (audits only in AUDIT_OPEN; ticket requests only in AUDIT_OPEN; diploma queue + vendor activate in AUDIT_LOCKED/READY; batch release in AUDIT_LOCKED/READY/COMMENCED/COMPLETED; diploma issue only in COMMENCED; deliverables only in COMMENCED/COMPLETED; rain toggle only in AUDIT_LOCKED/READY)", error_id: ERR_CEREMONY_POSTURE_FORBIDS, http_status: 409, applies_to: "ceremony-gated endpoints" }
  - { priority: 10, category: state, check: "cross-entity graduate gate: graduate.status in {ELIGIBLE, ELIGIBLE_ON_APPEAL, CONFIRMED} for ticket request, reader-card creation, rehearsal registration, diploma queue, seat assignment", error_id: ERR_GRADUATE_NOT_ELIGIBLE, http_status: 409, applies_to: ["POST /api/ticket-allocations/{id}/request", "POST /api/graduates/{id}/reader-card", "POST /api/rehearsal-sessions/{id}/register", "POST /api/print-batches/{id}/diplomas", "POST /api/seat-assignments"] }
  - { priority: 11, category: business_safety, check: "conduct gate: graduate.walk_privilege_revoked must be false to fulfill regalia", error_id: ERR_WALK_PRIVILEGE_REVOKED, http_status: 409, applies_to: ["POST /api/regalia-orders/{id}/fulfill"] }
  - { priority: 12, category: business_temporal, check: "now <= ceremony.ticket_request_deadline", error_id: ERR_REQUEST_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /api/ticket-allocations/{id}/request"] }
  - { priority: 13, category: business_temporal, check: "now <= ceremony.pronunciation_deadline", error_id: ERR_PRONUNCIATION_DEADLINE_PASSED, http_status: 422, applies_to: ["POST /api/graduates/{id}/reader-card"] }
  - { priority: 14, category: business_temporal, check: "now <= audit.created_at + 14 days", error_id: ERR_APPEAL_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /api/eligibility-audits/{id}/appeal"] }
  - { priority: 15, category: business_temporal, check: "now <= ceremony.ceremony_date + 30 days", error_id: ERR_CORRECTION_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /api/diplomas/{id}/corrections"] }
  - { priority: 16, category: business_constraint, check: "requested_count <= guest_ticket_base_cap + honor bonus for the graduate's CURRENT honor_tier (equality allowed)", error_id: ERR_TICKET_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /api/ticket-allocations/{id}/request"] }
  - { priority: 17, category: business_constraint, check: "seat position (ceremony, section, row_label, seat_number) unique among ASSIGNED seats; graduate has at most one ASSIGNED seat", error_id: ERR_SEAT_CONFLICT, http_status: 409, applies_to: ["POST /api/seat-assignments"] }
  - { priority: 18, category: business_constraint, check: "count(ASSIGNED seats) < ceremony.effective_capacity before assigning", error_id: ERR_SEAT_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /api/seat-assignments", "POST /api/ceremonies/{id}/run-seating"] }
  - { priority: 19, category: business_constraint, check: "accessible pool: WHEELCHAIR_SEAT approvals <= effective venue accessible_capacity; rain activation requires reserved <= rain_venue.accessible_capacity", error_id: ERR_ACCESSIBLE_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /api/accommodation-requests/{id}/approve", "POST /api/ceremonies/{id}/activate-rain-plan", "POST /api/seat-assignments"] }
  - { priority: 20, category: business_constraint, check: "rehearsal overlap: same venue, HALF-OPEN [start_utc, end_utc) intervals among SCHEDULED sessions; adjacent (end == start) is allowed", error_id: ERR_VENUE_TIME_OVERLAP, http_status: 409, applies_to: ["POST /api/ceremonies/{id}/rehearsal-sessions"] }
  - { priority: 21, category: business_constraint, check: "vendor overlap: same ceremony AND same vendor_type, CLOSED buffered intervals [coverage_start - buffer, coverage_end + buffer] among non-CANCELLED contracts; touching boundaries conflict", error_id: ERR_VENDOR_COVERAGE_OVERLAP, http_status: 409, applies_to: ["POST /api/ceremonies/{id}/vendor-contracts"] }
  - { priority: 22, category: business_constraint, check: "at most one ReaderCard per graduate", error_id: ERR_READER_CARD_EXISTS, http_status: 409, applies_to: ["POST /api/graduates/{id}/reader-card"] }
  - { priority: 23, category: business_constraint, check: "graduate not already registered (attendance in REGISTERED/ATTENDED) for this session", error_id: ERR_DUPLICATE_REGISTRATION, http_status: 409, applies_to: ["POST /api/rehearsal-sessions/{id}/register"] }
  - { priority: 24, category: business_constraint, check: "session registered_count < capacity before registering", error_id: ERR_REHEARSAL_FULL, http_status: 422, applies_to: ["POST /api/rehearsal-sessions/{id}/register"] }
  - { priority: 25, category: business_constraint, check: "rain_venue_id must be set before activating the rain plan", error_id: ERR_RAIN_VENUE_MISSING, http_status: 409, applies_to: ["POST /api/ceremonies/{id}/activate-rain-plan"] }
  - { priority: 26, category: business_constraint, check: "version-pinned honor snapshot: every QUEUED/REPRINT_QUEUED diploma's pinned_honor_tier == its graduate's current honor_tier at batch release", error_id: ERR_HONOR_SNAPSHOT_STALE, http_status: 409, applies_to: ["POST /api/print-batches/{id}/release"] }
  - { priority: 27, category: business_constraint, check: "an OPEN PrintBatch exists for the ceremony when approving a correction", error_id: ERR_NO_OPEN_REPRINT_BATCH, http_status: 409, applies_to: ["POST /api/diplomas/{id}/correction-decision"] }
  - { priority: 28, category: business_constraint, check: "batch diploma_count >= 1 at release", error_id: ERR_BATCH_NOT_RELEASABLE, http_status: 409, applies_to: ["POST /api/print-batches/{id}/release"] }
  - { priority: 29, category: business_constraint, check: "deliverable_url submitted before settlement", error_id: ERR_VENDOR_DELIVERABLE_MISSING, http_status: 409, applies_to: ["POST /api/vendor-contracts/{id}/settle"] }
  - { priority: 30, category: business_fiscal, check: "amount_cents == order.total_cents exactly", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 402, applies_to: ["POST /api/regalia-orders/{id}/pay"] }

# =============================================================================
# §1.5 API Endpoint Table (84 endpoints)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Before any call, the clock reads the fixed default 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time.", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: [] }

  # --- Ceremony lifecycle ---
  - { method: POST, path: "/api/ceremonies", description: "Create ceremony (posture PLANNING, weather FAIR; pools initialized from venue)", roles: [CommitteeChair], code: 201, input: [name, ceremony_date, venue_id, "rain_venue_id?", ticket_ratio, guest_ticket_base_cap, honor_bonus_tickets, "rehearsal_required?", pronunciation_deadline, ticket_request_deadline, regalia_order_deadline], output: Ceremony, side_effects: ["effective_capacity_and_pools initialized"] }
  - { method: GET, path: "/api/ceremonies/{id}", description: "Read ceremony", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate, Vendor], code: 200, input: [], output: Ceremony, side_effects: [] }
  - { method: PATCH, path: "/api/ceremonies/{id}", description: "Update ceremony config (OCC-guarded)", roles: [CommitteeChair], code: 200, input: [expected_ceremony_version, "name?", "ticket_ratio?", "guest_ticket_base_cap?", "honor_bonus_tickets?", "pronunciation_deadline?", "ticket_request_deadline?", "regalia_order_deadline?", "rain_venue_id?"], output: Ceremony, side_effects: ["increments Ceremony.version by 1", "pool fields recomputed if ticket_ratio changed"] }
  - { method: POST, path: "/api/ceremonies/{id}/open-audit", description: "PLANNING -> AUDIT_OPEN", roles: [CommitteeChair], code: 200, input: [], output: Ceremony, side_effects: ["increments Ceremony.version by 1"] }
  - { method: POST, path: "/api/ceremonies/{id}/lock-audit", description: "AUDIT_OPEN -> AUDIT_LOCKED; finalizes honor tiers (INSTITUTIONAL variant)", roles: [CommitteeChair], code: 200, input: [], output: Ceremony, side_effects: ["honor_gpa_designation FINAL recompute for eligible-family graduates", "increments Ceremony.version by 1"] }
  - { method: POST, path: "/api/ceremonies/{id}/reopen-audit", description: "AUDIT_LOCKED -> AUDIT_OPEN (revert); blocked when a batch is RELEASED/PRINTED", roles: [CommitteeChair], code: 200, input: [], output: Ceremony, side_effects: ["honor_gpa_designation PROVISIONAL recompute", "increments Ceremony.version by 1"] }
  - { method: POST, path: "/api/ceremonies/{id}/mark-ready", description: "AUDIT_LOCKED -> READY; requires audits complete and reader cards present; locks reader cards", roles: [CommitteeChair], code: 200, input: [], output: Ceremony, side_effects: ["ReaderCards SUBMITTED/APPROVED -> LOCKED", "increments Ceremony.version by 1"] }
  - { method: POST, path: "/api/ceremonies/{id}/activate-rain-plan", description: "weather FAIR -> RAIN_PLAN_ACTIVE; capacity shrink cascades to seats and tickets", roles: [VenueCoordinator], code: 200, input: [], output: Ceremony, side_effects: ["effective_capacity_and_pools recompute", "seat eviction cascade (RAIN_SHRINK)", "ticket_pool_waterfall FINAL re-run", "increments Ceremony.version by 1"] }
  - { method: POST, path: "/api/ceremonies/{id}/deactivate-rain-plan", description: "weather RAIN_PLAN_ACTIVE -> FAIR; pools grow; promotion scan runs; evicted seats NOT restored", roles: [VenueCoordinator], code: 200, input: [], output: Ceremony, side_effects: ["effective_capacity_and_pools recompute", "ticket_pool_waterfall FINAL re-run with promotion", "increments Ceremony.version by 1"] }
  - { method: POST, path: "/api/ceremonies/{id}/commence", description: "READY -> COMMENCED", roles: [CommitteeChair], code: 200, input: [], output: Ceremony, side_effects: ["increments Ceremony.version by 1"] }
  - { method: POST, path: "/api/ceremonies/{id}/complete", description: "COMMENCED -> COMPLETED; expires pending ticket allocations", roles: [CommitteeChair], code: 200, input: [], output: Ceremony, side_effects: ["PENDING/WAITLISTED TicketAllocations -> EXPIRED", "increments Ceremony.version by 1"] }
  - { method: POST, path: "/api/ceremonies/{id}/run-ticket-waterfall", description: "Run FINAL ticket_pool_waterfall over the ceremony's non-terminal allocations", roles: [CommitteeChair], code: 200, input: [], output: { processed_count: integer, granted_total: integer, waitlisted_count: integer, pool_remaining: integer }, side_effects: ["ticket_pool_waterfall FINAL variant"] }
  - { method: POST, path: "/api/ceremonies/{id}/run-seating", description: "Auto-assign seats to eligible-family graduates per seating_run_assignment selector", roles: [VenueCoordinator], code: 200, input: [], output: { assigned_count: integer, skipped_count: integer, open_seat_count: integer }, side_effects: ["seating_run_assignment", "open_seat_count recompute"] }

  # --- Ceremony-scoped sub-resource lists (FK reverse reachability) ---
  - { method: GET, path: "/api/ceremonies/{id}/graduates", description: "List graduates of a ceremony", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator], code: 200, input: ["status?", "honor_tier?", "limit?", "offset?"], output: "Graduate[]", side_effects: [] }
  - { method: GET, path: "/api/ceremonies/{id}/ticket-allocations", description: "List ticket allocations of a ceremony", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator], code: 200, input: ["status?", "limit?", "offset?"], output: "TicketAllocation[]", side_effects: [] }
  - { method: GET, path: "/api/ceremonies/{id}/seat-assignments", description: "List seat assignments of a ceremony", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator], code: 200, input: ["status?", "limit?", "offset?"], output: "SeatAssignment[]", side_effects: [] }
  - { method: GET, path: "/api/ceremonies/{id}/accommodation-requests", description: "List accommodation requests of a ceremony", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator], code: 200, input: ["status?", "request_type?", "limit?", "offset?"], output: "AccommodationRequest[]", side_effects: [] }
  - { method: GET, path: "/api/ceremonies/{id}/vendor-contracts", description: "List vendor contracts of a ceremony", roles: [CommitteeChair, VenueCoordinator], code: 200, input: ["status?", "vendor_type?", "limit?", "offset?"], output: "VendorContract[]", side_effects: [] }
  - { method: GET, path: "/api/ceremonies/{id}/print-batches", description: "List print batches of a ceremony", roles: [CommitteeChair, RegistrarOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "PrintBatch[]", side_effects: [] }
  - { method: GET, path: "/api/ceremonies/{id}/rehearsal-sessions", description: "List rehearsal sessions of a ceremony", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: ["limit?", "offset?"], output: "RehearsalSession[]", side_effects: [] }

  # --- Venue ---
  - { method: POST, path: "/api/venues", description: "Create venue", roles: [VenueCoordinator], code: 201, input: [name, address, total_capacity, accessible_capacity, indoor], output: Venue, side_effects: [] }
  - { method: GET, path: "/api/venues/{id}", description: "Read venue", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate, Vendor], code: 200, input: [], output: Venue, side_effects: [] }
  - { method: GET, path: "/api/venues/{id}/ceremonies", description: "List ceremonies using this venue (as primary or rain venue)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator], code: 200, input: ["limit?", "offset?"], output: "Ceremony[]", side_effects: [] }
  - { method: GET, path: "/api/venues/{id}/rehearsal-sessions", description: "List rehearsal sessions booked at this venue", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator], code: 200, input: ["limit?", "offset?"], output: "RehearsalSession[]", side_effects: [] }

  # --- Graduate ---
  - { method: POST, path: "/api/graduates", description: "Import a graduate record; auto-creates a PENDING TicketAllocation", roles: [RegistrarOfficer], code: 201, input: [ceremony_id, full_name, email, institutional_gpa_credits, institutional_quality_points, "transfer_gpa_credits?", "transfer_quality_points?", credits_completed, credits_required, "outstanding_hold_count?"], output: Graduate, side_effects: ["TicketAllocation created (PENDING, requested_count 0)"] }
  - { method: GET, path: "/api/graduates/{id}", description: "Read graduate (Graduate role restricted to self)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: [], output: Graduate, side_effects: [] }
  - { method: POST, path: "/api/graduates/{id}/withdraw", description: "Withdraw graduate; cascades release/evict/cancel/archive", roles: [RegistrarOfficer, Graduate], code: 200, input: [], output: Graduate, side_effects: ["TicketAllocation -> RELEASED + promotion scan", "SeatAssignment -> EVICTED (WITHDRAWN)", "RegaliaOrder SUBMITTED -> CANCELLED", "RehearsalAttendance REGISTERED -> CANCELLED", "Diploma QUEUED/REPRINT_QUEUED -> ARCHIVED", "increments Graduate.version by 1"] }
  - { method: POST, path: "/api/graduates/{id}/confirm", description: "Graduate confirms attendance (ELIGIBLE/ELIGIBLE_ON_APPEAL -> CONFIRMED)", roles: [Graduate], code: 200, input: [], output: Graduate, side_effects: ["increments Graduate.version by 1"] }
  - { method: POST, path: "/api/graduates/{id}/grade-revision", description: "Registrar posts revised grades while AUDIT_LOCKED; recomputes FINAL honor and may stale queued diploma snapshots", roles: [RegistrarOfficer], code: 200, input: ["institutional_gpa_credits?", "institutional_quality_points?", "transfer_gpa_credits?", "transfer_quality_points?"], output: Graduate, side_effects: ["honor_gpa_designation FINAL (INSTITUTIONAL) recompute", "increments Graduate.version by 1"] }
  - { method: GET, path: "/api/graduates/{id}/audits", description: "List eligibility audits of a graduate (Graduate restricted to self)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: ["limit?", "offset?"], output: "EligibilityAudit[]", side_effects: [] }
  - { method: GET, path: "/api/graduates/{id}/ticket-allocations", description: "List ticket allocations of a graduate (0..1 rows; Graduate restricted to self)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: ["limit?", "offset?"], output: "TicketAllocation[]", side_effects: [] }
  - { method: GET, path: "/api/graduates/{id}/regalia-orders", description: "List regalia orders of a graduate (Graduate restricted to self)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: ["status?", "limit?", "offset?"], output: "RegaliaOrder[]", side_effects: [] }
  - { method: GET, path: "/api/graduates/{id}/seat-assignments", description: "List seat assignments of a graduate (Graduate restricted to self)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: ["limit?", "offset?"], output: "SeatAssignment[]", side_effects: [] }
  - { method: GET, path: "/api/graduates/{id}/diplomas", description: "List diplomas of a graduate (Graduate restricted to self)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: ["limit?", "offset?"], output: "Diploma[]", side_effects: [] }
  - { method: GET, path: "/api/graduates/{id}/accommodation-requests", description: "List accommodation requests of a graduate (Graduate restricted to self)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: ["limit?", "offset?"], output: "AccommodationRequest[]", side_effects: [] }
  - { method: GET, path: "/api/graduates/{id}/rehearsal-attendances", description: "List rehearsal attendances of a graduate (Graduate restricted to self)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: ["limit?", "offset?"], output: "RehearsalAttendance[]", side_effects: [] }
  - { method: GET, path: "/api/graduates/{id}/reader-cards", description: "List reader cards of a graduate (0..1 rows; Graduate restricted to self)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: ["limit?", "offset?"], output: "ReaderCard[]", side_effects: [] }

  # --- Eligibility audit & appeal ---
  - { method: POST, path: "/api/graduates/{id}/audits", description: "Run eligibility audit (computes result + provisional COMBINED honor)", roles: [RegistrarOfficer], code: 201, input: ["notes?"], output: EligibilityAudit, side_effects: ["eligibility_determination", "honor_gpa_designation PROVISIONAL", "Graduate PENDING_AUDIT -> ELIGIBLE|INELIGIBLE"] }
  - { method: POST, path: "/api/eligibility-audits/{id}/appeal", description: "Graduate appeals a FAIL audit (within 14 days)", roles: [Graduate], code: 200, input: [], output: EligibilityAudit, side_effects: ["Graduate INELIGIBLE -> APPEALING", "appeal_status -> SUBMITTED"] }
  - { method: POST, path: "/api/eligibility-audits/{id}/appeal-decision", description: "CommitteeChair decides an appeal", roles: [CommitteeChair], code: 200, input: [decision], output: EligibilityAudit, side_effects: ["APPROVED: Graduate -> ELIGIBLE_ON_APPEAL + honor PROVISIONAL recompute; DENIED: Graduate -> INELIGIBLE"] }

  # --- Ticket allocation ---
  - { method: POST, path: "/api/ticket-allocations/{id}/request", description: "Request guest tickets (supersedes prior request terms; OCC-guarded)", roles: [Graduate], code: 200, input: [requested_count, expected_ticket_allocation_version], output: TicketAllocation, side_effects: ["provisional_granted_count recomputed (PROVISIONAL variant)", "increments TicketAllocation.version by 1"] }
  - { method: POST, path: "/api/ticket-allocations/{id}/release", description: "Release granted tickets back to the pool; triggers promotion scan", roles: [Graduate], code: 200, input: [], output: TicketAllocation, side_effects: ["ticket_pool_remaining += granted_count", "granted_count := 0", "ticket_pool_waterfall promotion scan", "increments TicketAllocation.version by 1"] }

  # --- Regalia ---
  - { method: POST, path: "/api/graduates/{id}/regalia-orders", description: "Submit regalia order (pricing computed per regalia_pricing; late fee after regalia_order_deadline)", roles: [Graduate], code: 201, input: [items], output: RegaliaOrder, side_effects: ["regalia_pricing"] }
  - { method: GET, path: "/api/regalia-orders/{id}", description: "Read regalia order (Graduate restricted to own)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: [], output: RegaliaOrder, side_effects: [] }
  - { method: POST, path: "/api/regalia-orders/{id}/pay", description: "Pay exact total_cents", roles: [Graduate], code: 200, input: [amount_cents], output: RegaliaOrder, side_effects: ["SUBMITTED -> PAID", "increments RegaliaOrder.version by 1"] }
  - { method: POST, path: "/api/regalia-orders/{id}/fulfill", description: "Distribute regalia (PAID or EXCHANGE_REQUESTED -> FULFILLED); blocked when walk privilege revoked", roles: [CommitteeChair], code: 200, input: [], output: RegaliaOrder, side_effects: ["increments RegaliaOrder.version by 1"] }
  - { method: POST, path: "/api/regalia-orders/{id}/request-exchange", description: "FULFILLED -> EXCHANGE_REQUESTED (size exchange loop)", roles: [Graduate], code: 200, input: ["reason?"], output: RegaliaOrder, side_effects: ["increments RegaliaOrder.version by 1"] }
  - { method: POST, path: "/api/regalia-orders/{id}/cancel", description: "SUBMITTED -> CANCELLED (pre-payment only)", roles: [Graduate], code: 200, input: [], output: RegaliaOrder, side_effects: ["increments RegaliaOrder.version by 1"] }

  # --- Seating ---
  - { method: POST, path: "/api/seat-assignments", description: "Manually assign a seat (uniqueness + capacity + accessible pool enforced)", roles: [VenueCoordinator], code: 201, input: [ceremony_id, graduate_id, section, row_label, seat_number, "accessible?"], output: SeatAssignment, side_effects: ["open_seat_count -= 1"] }
  - { method: GET, path: "/api/seat-assignments/{id}", description: "Read seat assignment", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: [], output: SeatAssignment, side_effects: [] }
  - { method: POST, path: "/api/seat-assignments/{id}/evict", description: "Manually evict an assigned seat (reason MANUAL)", roles: [VenueCoordinator], code: 200, input: [], output: SeatAssignment, side_effects: ["open_seat_count += 1"] }

  # --- Reader cards ---
  - { method: POST, path: "/api/graduates/{id}/reader-card", description: "Submit pronunciation reader card (one per graduate; before pronunciation_deadline)", roles: [Graduate], code: 201, input: [phonetic_spelling], output: ReaderCard, side_effects: [] }
  - { method: PATCH, path: "/api/reader-cards/{id}", description: "Update phonetic spelling while SUBMITTED", roles: [Graduate], code: 200, input: [phonetic_spelling], output: ReaderCard, side_effects: ["increments ReaderCard.version by 1"] }
  - { method: POST, path: "/api/reader-cards/{id}/approve", description: "Approve a reader card", roles: [CommitteeChair], code: 200, input: [], output: ReaderCard, side_effects: ["approved_by_user_id := caller", "increments ReaderCard.version by 1"] }

  # --- Print batches & diplomas ---
  - { method: POST, path: "/api/ceremonies/{id}/print-batches", description: "Create an OPEN print batch", roles: [RegistrarOfficer], code: 201, input: ["scheduled_print_date?"], output: PrintBatch, side_effects: ["created_by_user_id := caller"] }
  - { method: GET, path: "/api/print-batches/{id}", description: "Read print batch", roles: [CommitteeChair, RegistrarOfficer], code: 200, input: [], output: PrintBatch, side_effects: [] }
  - { method: POST, path: "/api/print-batches/{id}/diplomas", description: "Queue a diploma into an OPEN batch; pins honors_text/pinned_honor_tier from the graduate's CURRENT (final) honor_tier", roles: [RegistrarOfficer], code: 201, input: [graduate_id, "printed_name?"], output: Diploma, side_effects: ["honor snapshot pinned", "batch.diploma_count += 1"] }
  - { method: GET, path: "/api/print-batches/{id}/diplomas", description: "List diplomas in a batch", roles: [CommitteeChair, RegistrarOfficer], code: 200, input: ["limit?", "offset?"], output: "Diploma[]", side_effects: [] }
  - { method: POST, path: "/api/print-batches/{id}/release", description: "Release batch to printer (SoD: caller != creator; honor snapshots must be fresh; posture AUDIT_LOCKED/READY/COMMENCED/COMPLETED)", roles: [RegistrarOfficer], code: 200, input: [], output: PrintBatch, side_effects: ["released_by_user_id := caller", "increments PrintBatch.version by 1"] }
  - { method: POST, path: "/api/print-batches/{id}/mark-printed", description: "RELEASED -> PRINTED; attached diplomas QUEUED/REPRINT_QUEUED -> PRINTED", roles: [RegistrarOfficer], code: 200, input: [], output: PrintBatch, side_effects: ["diplomas -> PRINTED", "increments PrintBatch.version by 1"] }
  - { method: GET, path: "/api/diplomas/{id}", description: "Read diploma (Graduate restricted to own)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: [], output: Diploma, side_effects: [] }
  - { method: POST, path: "/api/diplomas/{id}/issue", description: "Issue a printed diploma at the ceremony (posture COMMENCED)", roles: [CommitteeChair], code: 200, input: [], output: Diploma, side_effects: ["PRINTED -> ISSUED", "increments Diploma.version by 1"] }
  - { method: POST, path: "/api/diplomas/{id}/corrections", description: "Graduate requests a name correction (within 30 days after ceremony_date)", roles: [Graduate], code: 200, input: [corrected_name], output: Diploma, side_effects: ["ISSUED -> CORRECTION_REQUESTED", "increments Diploma.version by 1"] }
  - { method: POST, path: "/api/diplomas/{id}/correction-decision", description: "Approve (requires an OPEN batch; re-pins honor snapshot) or deny a correction", roles: [RegistrarOfficer], code: 200, input: [decision], output: Diploma, side_effects: ["APPROVED: -> REPRINT_QUEUED into the OPEN batch, correction_count += 1, snapshot re-pinned; DENIED: -> ISSUED"] }

  # --- Rehearsal ---
  - { method: POST, path: "/api/ceremonies/{id}/rehearsal-sessions", description: "Book a rehearsal session at a venue (half-open overlap check)", roles: [VenueCoordinator], code: 201, input: [venue_id, start_utc, end_utc, capacity], output: RehearsalSession, side_effects: [] }
  - { method: GET, path: "/api/rehearsal-sessions/{id}", description: "Read rehearsal session", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: [], output: RehearsalSession, side_effects: [] }
  - { method: POST, path: "/api/rehearsal-sessions/{id}/register", description: "Graduate registers for a session (creates RehearsalAttendance REGISTERED)", roles: [Graduate], code: 201, input: [], output: RehearsalAttendance, side_effects: ["registered_count += 1"] }
  - { method: POST, path: "/api/rehearsal-sessions/{id}/complete", description: "Complete a session; no-shows become ABSENT strikes recorded by the caller", roles: [VenueCoordinator], code: 200, input: [], output: RehearsalSession, side_effects: ["REGISTERED attendances -> ABSENT + strike", "conduct_strike_policy recompute", "increments RehearsalSession.version by 1"] }
  - { method: POST, path: "/api/rehearsal-sessions/{id}/cancel", description: "Cancel a session; registrations CANCELLED without strikes", roles: [VenueCoordinator], code: 200, input: [], output: RehearsalSession, side_effects: ["REGISTERED attendances -> CANCELLED", "increments RehearsalSession.version by 1"] }
  - { method: GET, path: "/api/rehearsal-sessions/{id}/attendances", description: "List attendances of a session", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator], code: 200, input: ["status?", "limit?", "offset?"], output: "RehearsalAttendance[]", side_effects: [] }
  - { method: POST, path: "/api/rehearsal-attendances/{id}/check-in", description: "Check in a registered graduate (session still SCHEDULED)", roles: [VenueCoordinator], code: 200, input: [], output: RehearsalAttendance, side_effects: ["checked_in_at := now"] }
  - { method: POST, path: "/api/rehearsal-attendances/{id}/waive", description: "Excuse an absence (SoD: caller != recorded_by_user_id); strike removed", roles: [VenueCoordinator], code: 200, input: [], output: RehearsalAttendance, side_effects: ["conduct_strike_policy recompute", "waived_by_user_id := caller"] }

  # --- Accessibility accommodations ---
  - { method: POST, path: "/api/graduates/{id}/accommodation-requests", description: "Submit an accessibility accommodation request", roles: [Graduate], code: 201, input: [ceremony_id, request_type, "notes?"], output: AccommodationRequest, side_effects: [] }
  - { method: GET, path: "/api/accommodation-requests/{id}", description: "Read accommodation request (Graduate restricted to own)", roles: [CommitteeChair, RegistrarOfficer, VenueCoordinator, Graduate], code: 200, input: [], output: AccommodationRequest, side_effects: [] }
  - { method: POST, path: "/api/accommodation-requests/{id}/approve", description: "Approve (WHEELCHAIR_SEAT consumes the accessible-seat pool)", roles: [VenueCoordinator], code: 200, input: [], output: AccommodationRequest, side_effects: ["approved_by_user_id := caller"] }
  - { method: POST, path: "/api/accommodation-requests/{id}/deny", description: "Deny a request", roles: [VenueCoordinator], code: 200, input: ["reason?"], output: AccommodationRequest, side_effects: [] }
  - { method: POST, path: "/api/accommodation-requests/{id}/fulfill", description: "Mark fulfilled (SoD: caller != approved_by_user_id)", roles: [VenueCoordinator], code: 200, input: [], output: AccommodationRequest, side_effects: ["fulfilled_by_user_id := caller"] }

  # --- Vendors ---
  - { method: POST, path: "/api/ceremonies/{id}/vendor-contracts", description: "Contract a livestream/photography vendor (buffered closed-interval overlap check per vendor_type)", roles: [CommitteeChair], code: 201, input: [vendor_type, vendor_user_id, coverage_start_utc, coverage_end_utc, "setup_buffer_minutes?", fee_cents], output: VendorContract, side_effects: [] }
  - { method: GET, path: "/api/vendor-contracts/{id}", description: "Read vendor contract", roles: [CommitteeChair, VenueCoordinator, Vendor], code: 200, input: [], output: VendorContract, side_effects: [] }
  - { method: POST, path: "/api/vendor-contracts/{id}/activate", description: "DRAFT -> ACTIVE (posture AUDIT_LOCKED/READY/COMMENCED)", roles: [CommitteeChair], code: 200, input: [], output: VendorContract, side_effects: ["increments VendorContract.version by 1"] }
  - { method: POST, path: "/api/vendor-contracts/{id}/submit-deliverable", description: "Vendor submits deliverable (own contract only; ceremony COMMENCED/COMPLETED)", roles: [Vendor], code: 200, input: [deliverable_url], output: VendorContract, side_effects: ["deliverable_url set", "increments VendorContract.version by 1"] }
  - { method: POST, path: "/api/vendor-contracts/{id}/settle", description: "Settle an ACTIVE contract with submitted deliverable", roles: [CommitteeChair], code: 200, input: [], output: VendorContract, side_effects: ["increments VendorContract.version by 1"] }
  - { method: POST, path: "/api/vendor-contracts/{id}/cancel", description: "Cancel DRAFT/ACTIVE contract; vendor_cancellation_fee computed from time vs coverage_start", roles: [CommitteeChair], code: 200, input: [], output: VendorContract, side_effects: ["vendor_cancellation_fee", "increments VendorContract.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "caller role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Graduate touches another graduate's resource, or Vendor submits for a contract with a different vendor_user_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "same X-User-ID attempts two segregated steps (batch create/release, strike record/waive, accommodation approve/fulfill)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path-templated resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "body schema violation: missing required field, bad type, out-of-domain enum, out-of-range value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "target entity's own state machine rejects the transition from its current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the entity's current version (OCC)" }
  - { id: ERR_CEREMONY_POSTURE_FORBIDS, http: 409, condition: "ceremony.readiness_posture does not permit the operation" }
  - { id: ERR_GRADUATE_NOT_ELIGIBLE, http: 409, condition: "graduate.status not in {ELIGIBLE, ELIGIBLE_ON_APPEAL, CONFIRMED} for an eligibility-gated operation" }
  - { id: ERR_WALK_PRIVILEGE_REVOKED, http: 409, condition: "graduate has >= 2 unexcused rehearsal strikes; regalia fulfillment blocked" }
  - { id: ERR_REQUEST_WINDOW_CLOSED, http: 422, condition: "now is strictly after ceremony.ticket_request_deadline" }
  - { id: ERR_PRONUNCIATION_DEADLINE_PASSED, http: 422, condition: "now is strictly after ceremony.pronunciation_deadline" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "now is strictly after audit.created_at + 14 days" }
  - { id: ERR_CORRECTION_WINDOW_CLOSED, http: 422, condition: "now is strictly after ceremony.ceremony_date + 30 days" }
  - { id: ERR_TICKET_CAP_EXCEEDED, http: 422, condition: "requested_count strictly greater than the graduate's entitlement (base cap + honor bonus)" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 402, condition: "amount_cents != order.total_cents" }
  - { id: ERR_SEAT_CONFLICT, http: 409, condition: "seat position already ASSIGNED, or graduate already holds an ASSIGNED seat" }
  - { id: ERR_SEAT_CAPACITY_EXCEEDED, http: 422, condition: "assigning would push ASSIGNED seats beyond ceremony.effective_capacity" }
  - { id: ERR_ACCESSIBLE_CAPACITY_EXCEEDED, http: 422, condition: "accessible-seat pool exhausted (approval, accessible seat assignment, or rain-plan activation into a smaller accessible pool)" }
  - { id: ERR_VENUE_TIME_OVERLAP, http: 409, condition: "rehearsal [start_utc, end_utc) overlaps another SCHEDULED session at the same venue (adjacency allowed)" }
  - { id: ERR_VENDOR_COVERAGE_OVERLAP, http: 409, condition: "buffered closed coverage window overlaps another non-CANCELLED contract of the same vendor_type for the ceremony (touching boundaries conflict)" }
  - { id: ERR_VENDOR_DELIVERABLE_MISSING, http: 409, condition: "settle attempted before deliverable submission" }
  - { id: ERR_RAIN_VENUE_MISSING, http: 409, condition: "rain-plan activation attempted without rain_venue_id" }
  - { id: ERR_HONOR_SNAPSHOT_STALE, http: 409, condition: "a QUEUED/REPRINT_QUEUED diploma's pinned_honor_tier differs from the graduate's current honor_tier at batch release" }
  - { id: ERR_NO_OPEN_REPRINT_BATCH, http: 409, condition: "correction approval requires an OPEN PrintBatch for the ceremony" }
  - { id: ERR_BATCH_NOT_RELEASABLE, http: 409, condition: "release attempted on an empty batch (diploma_count == 0)" }
  - { id: ERR_READER_CARD_EXISTS, http: 409, condition: "graduate already has a reader card" }
  - { id: ERR_REHEARSAL_FULL, http: 422, condition: "session registered_count == capacity" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "graduate already REGISTERED/ATTENDED for this session" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CommitteeChair
    description: "Graduation committee chair; owns ceremony lifecycle, ticket waterfall, appeals, diploma issue, vendor contracts, regalia fulfillment"
    identity: opaque
    exclusive_operations: ["ceremony create/patch/lifecycle actions", "run-ticket-waterfall", "appeal-decision", "reader-card approve", "diploma issue", "vendor contract management", "regalia fulfill"]
    shared_operations: ["read endpoints"]
  - name: RegistrarOfficer
    description: "Registrar's office; imports graduates, runs eligibility audits, posts grade revisions, manages print batches and correction decisions"
    identity: opaque
    exclusive_operations: ["graduate import", "eligibility audits", "grade-revision", "print-batch management incl. release (SoD)", "correction-decision"]
    shared_operations: ["read endpoints"]
  - name: VenueCoordinator
    description: "Venue/logistics coordinator; manages venues, rain plan, seating chart, rehearsal sessions, strikes/waivers (SoD), accommodations (SoD)"
    identity: opaque
    exclusive_operations: ["venue management", "rain-plan toggle", "seating (manual + run)", "rehearsal session management/check-in/waive", "accommodation approve/deny/fulfill"]
    shared_operations: ["read endpoints"]
  - name: Graduate
    description: "A graduating student acting on their own records only (X-User-ID == Graduate.id)"
    identity: "entity_backed:Graduate"
    exclusive_operations: ["own ticket request/release", "own regalia order/pay/exchange/cancel", "own reader card submit/update", "own accommodation requests", "own diploma corrections", "own appeal", "own confirm/withdraw", "rehearsal registration"]
    shared_operations: ["read own records", "read ceremony/venue/session reads"]
  - name: Vendor
    description: "External livestream/photography operator; X-User-ID matched to VendorContract.vendor_user_id for deliverable submission"
    identity: opaque
    exclusive_operations: ["submit-deliverable on own contracts"]
    shared_operations: ["read own contracts", "read ceremony/venue"]
