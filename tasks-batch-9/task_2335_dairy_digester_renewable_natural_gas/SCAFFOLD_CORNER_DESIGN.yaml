          - errors[ERR_DISTRIBUTION_LOCKED]
          - calculations.dscr_and_distribution_posture
          - calculations.net_distributable_waterfall
        distinguishing_aspect: >
          The covenant gate is derived from the statement being approved, not configured:
          a gross of exactly 1000000 cents takes the inclusive tier-1 fee rate 0.0800,
          leaves after_fee 920000 and dscr 0.613, which is below dscr_minimum - 0.15, so
          the posture is LOCKED and approval is a 409.
