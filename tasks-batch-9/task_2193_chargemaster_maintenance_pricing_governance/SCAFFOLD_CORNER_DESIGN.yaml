            - call: "POST /chargemaster/revenue-codes/${rc250}/retire"
              payload: {}
              as: SystemAdmin
              captures: { rc250_after: $.data.status }
            - call: "GET /chargemaster/revenue-codes"
              payload: { status: "RETIRED", limit: 100 }
              as: RevenueIntegrityAnalyst
            - call: "GET /chargemaster/revenue-codes"
              payload: { pricing_class: "PROCEDURE" }
