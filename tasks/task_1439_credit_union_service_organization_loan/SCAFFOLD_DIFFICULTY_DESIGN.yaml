# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Credit Union Service Organization & Loan Participation Network
# All clock-dependent setups assume the logical clock default 2026-08-01T00:00:00Z
# unless a POST /network/_clock/set_current_utc call says otherwise.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: accrued_interest_day_count_variants
        grounds:
          - calculations.accrued_interest
          - calculations.remittance_settlement
          - entities.ServicingAgreement.fields.day_count_convention
        distinguishing_aspect: |
          Same principal (10,000,000), same yield (600 bps), same period
          (2026-08-01..2026-08-31): the THIRTY_360 agreement yields interest
          50,000 and fee 2,083 while the ACT_360 agreement yields interest
          51,667 and fee 2,153 — the day-count variant alone changes the result.
          Entity domain: certificate/remittance interest accrual.
        test_recipe:
          setup:
            - "Originator CU and Buyer CU registered; CUSO registered"
            - "Agreement T (THIRTY_360, fee 25bps, due day 15) ACTIVE with offering OT (pool 100,000,000, min 0.01, yield 600bps) OPEN"
            - "Agreement A (ACT_360, fee 25bps, due day 15) ACTIVE with offering OA (pool 100,000,000, min 0.01, yield 600bps) OPEN"
            - "One funded certificate of 10,000,000 in each offering (same buyer)"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_t_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "ACT_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_a_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_t_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/servicing-agreements/${ag_a_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_t_id}", pool_name: "Pool T", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_t_id: "$.data.id" } }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_a_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_a_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_t_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/offerings/${off_a_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_t_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_t_id: "$.data.id" } }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_a_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_a_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_t_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_a_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_t_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_a_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
          trigger:
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_t_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 100000 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { rem_t: "$.data" } }
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_a_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 100000 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { rem_a: "$.data" } }
          assert:
            - "rem_t.interest_portion_cents == 50000 (10,000,000 x 0.06 x 30/360)"
            - "rem_t.servicing_fee_cents == 2083 (round_half_up(10,000,000 x 0.0025 x 30/360))"
            - "rem_a.interest_portion_cents == 51667 (round_half_up(10,000,000 x 0.06 x 31/360))"
            - "rem_a.servicing_fee_cents == 2153 (round_half_up(10,000,000 x 0.0025 x 31/360))"
            - "rem_t.interest_portion_cents != rem_a.interest_portion_cents"

      - name: surveillance_wac_weighting_variants
        grounds:
          - calculations.surveillance_pool_aggregates
          - entities.SurveillanceReport.fields.weighting_basis
        distinguishing_aspect: |
          Same pool of two certificates (A: outstanding 15,000,000 / committed
          20,000,000 @ 600bps; B: outstanding 10,000,000 / committed 10,000,000
          @ 700bps): weighting_basis OUTSTANDING yields WAC 640 bps while
          COMMITTED yields 633 bps. Entity domain: surveillance reporting
          (distinct from interest accrual).
        test_recipe:
          setup:
            - "Agreement ACTIVE (THIRTY_360, fee 25bps, due day 15); two OPEN offerings O1 (600bps) and O2 (700bps), each pool 1,000,000,000 min 0.01"
            - "Cert A in O1: committed+funded 20,000,000, then one on-time remittance with collections 5,052,083 paying principal down to 15,000,000"
            - "Cert B in O2: committed+funded 10,000,000"
            - "Concentration: buyer net worth 2,000,000,000 x 0.25 = 500,000,000 cap; exposure 30,000,000 OK"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool 600", pool_principal_cents: 1000000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off1_id: "$.data.id" } }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool 700", pool_principal_cents: 1000000000, min_share_pct: 0.01, yield_rate_bps: 700, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off2_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off1_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/offerings/${off2_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off1_id}", committed_amount_cents: 20000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_a_id: "$.data.id" } }
            - { call: "POST /network/commitments", payload: { offering_id: "${off2_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_b_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_a_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_b_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_a_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_b_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_a_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 5052083 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { rem_a_id: "$.data.id" } }
            - { call: "POST /network/remittances/${rem_a_id}/pay", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "GET /network/servicing-agreements/${ag_id}", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_v1: "$.data.version" } }
          trigger:
            - { call: "POST /network/surveillance-reports", payload: { servicing_agreement_id: "${ag_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", weighting_basis: "OUTSTANDING", expected_servicing_agreement_version: "${ag_v1}" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { rep1_id: "$.data.id", rep1_wac: "$.data.weighted_avg_yield_bps" } }
            - { call: "GET /network/servicing-agreements/${ag_id}", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_v2: "$.data.version" } }
            - { call: "POST /network/surveillance-reports", payload: { servicing_agreement_id: "${ag_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", weighting_basis: "COMMITTED", expected_servicing_agreement_version: "${ag_v2}" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { rep2_wac: "$.data.weighted_avg_yield_bps" } }
          assert:
            - "rep1_wac == 640 ((15,000,000x600 + 10,000,000x700) / 25,000,000)"
            - "rep2_wac == 633 (round_half_up((20,000,000x600 + 10,000,000x700) / 30,000,000) = round_half_up(633.333))"
            - "rep1_wac != rep2_wac for the identical pool"
            - "GET /network/surveillance-reports/${rep1_id} shows status SUPERSEDED after the second create"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: investment_cap_tiered_branching
        grounds:
          - calculations.investment_cap_check
          - entities.CUSOInvestment.fields.approval_basis
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (total_assets, net_worth_ratio, approved
          aggregate, approval_basis, CUSO critical findings) with non-linear
          interaction — nested base/extended caps and conditional branches;
          aggregate == base cap approves while aggregate > extended cap rejects.
        test_recipe:
          setup:
            - "Investor CU: total_assets 50,000,000,000 (base cap 500,000,000; extended cap 1,500,000,000), net_worth 5,000,000,000 (ratio 0.10 >= 0.07)"
            - "CUSO One with zero open critical findings"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-INV", legal_name: "Investor CU", cu_type: "DUAL", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 490000000 }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i1_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments/${i1_id}/approve", payload: {}, as: RegulatorUser, captures: { i1_status: "$.data.status" } }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 10000000 }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i2_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments/${i2_id}/approve", payload: {}, as: RegulatorUser, captures: { i2_status: "$.data.status", i2_agg: "$.data.post_approval_aggregate_cents" } }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 600000000, approval_basis: "ENHANCED" }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i3_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments/${i3_id}/approve", payload: {}, as: RegulatorUser, captures: { i3_status: "$.data.status" } }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 400000001, approval_basis: "ENHANCED" }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i4_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 1 }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i5_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/cuso-investments/${i4_id}/approve", payload: {}, as: RegulatorUser, captures: { i4_err: "$.data.error_id" } }
            - { call: "POST /network/cuso-investments/${i5_id}/approve", payload: {}, as: RegulatorUser, captures: { i5_err: "$.data.error_id" } }
          assert:
            - "i1_status == APPROVED (490,000,000 <= 500,000,000 base cap)"
            - "i2_status == APPROVED and i2_agg == 500000000 (aggregate == base cap is allowed)"
            - "i3_status == APPROVED (ENHANCED: 1,100,000,000 <= 1,500,000,000 extended cap, ratio 0.10 eligible, no critical findings)"
            - "i4_err == ERR_INVESTMENT_CAP_EXCEEDED (aggregate 1,500,000,001 > extended cap)"
            - "i5_err == ERR_INVESTMENT_CAP_EXCEEDED (STANDARD basis: 1,100,000,001 > base cap)"

      - name: loss_allocation_residual_rounding
        grounds:
          - calculations.loss_share_allocation
        distinguishing_aspect: |
          Mode (b): nested rounding order — each certificate's share is rounded
          (round_half_up) FIRST, then the residual cent is assigned to the
          largest fractional remainder with created_at ASC tie-break; a
          sum-then-round order would leave per-certificate shares at 33.33
          with no +1 recipient. Loss 100 over three equal 300-cent certs
          produces [34, 33, 33] with the earliest-created cert taking 34.
        test_recipe:
          setup:
            - "Agreement ACTIVE; offering pool 900, min_share_pct 0.01, yield 600bps, loss_basis OUTSTANDING, OPEN"
            - "Three buyers each commit+approve+fund exactly 300 (cert1 created first, then cert2, then cert3); all three ACTIVE, outstanding 300 each"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-B1", legal_name: "Buyer One", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { b1_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-B2", legal_name: "Buyer Two", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { b2_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-B3", legal_name: "Buyer Three", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { b3_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool Tiny", pool_principal_cents: 900, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 300 }, as: BuyerUser, as_user_id: "${b1_id}", captures: { c1_id: "$.data.id" } }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 300 }, as: BuyerUser, as_user_id: "${b2_id}", captures: { c2_id: "$.data.id" } }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 300 }, as: BuyerUser, as_user_id: "${b3_id}", captures: { c3_id: "$.data.id" } }
            - { call: "POST /network/commitments/${c1_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${b1_id}" }
            - { call: "POST /network/commitments/${c2_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${b2_id}" }
            - { call: "POST /network/commitments/${c3_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${b3_id}" }
            - { call: "POST /network/commitments/${c1_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${b1_id}" }
            - { call: "POST /network/commitments/${c2_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${b2_id}" }
            - { call: "POST /network/commitments/${c3_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${b3_id}" }
            - { call: "POST /network/loss-events", payload: { offering_id: "${off_id}", loss_amount_cents: 100, defaulted_at: "2026-08-10T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { loss_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/loss-events/${loss_id}/allocate", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}", captures: { allocs: "$.data.allocations" } }
          assert:
            - "allocs contains exactly 3 entries summing to 100"
            - "allocation for cert ${c1_id} (earliest created_at) == 34; certs ${c2_id} and ${c3_id} == 33 each"
            - "GET /network/commitments/${c1_id} outstanding_principal_cents == 266 and cumulative_loss_cents == 34"
            - "GET /network/commitments/${c2_id} outstanding_principal_cents == 267 and cumulative_loss_cents == 33"

      - name: remittance_settlement_evaluation_order
        grounds:
          - calculations.remittance_settlement
          - state_machines.Remittance.SCHEDULED_to_PAID_LATE
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          servicing fee is computed on the BEGINNING-of-period outstanding
          (10,000,000) before current collections apply (a naive order on the
          post-principal balance 5,000,000 would give fee 1,042, not 2,083),
          and the late penalty is computed on (interest + principal), not on
          (collections - penalty).
        test_recipe:
          setup:
            - "Agreement ACTIVE (THIRTY_360, fee 25bps, due day 15, grace 5); offering OPEN; cert funded 10,000,000 @ 600bps"
            - "Remittance for period 2026-08-01..2026-08-31 with collections 5,052,083; due_at 2026-09-15"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, grace_period_days: 5, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
