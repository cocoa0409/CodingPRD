              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "ABC", product_id: "${p_tm}", quantity: 90, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
              payload: { baker_name: "LBB", product_id: "${p_tm}", quantity: 20, delivery_site_id: "${site1}" }
              as: CouncilAdmin
              captures: { po_b: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po_a}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po_b}/place"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po_a}/record-delivery"
              payload: { delivered_now: 90 }
              as: CouncilAdmin
          trigger:
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po_b}/record-delivery"
              payload: { delivered_now: 10 }
              as: CouncilAdmin
              captures: { po_b_state: $.data.status }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos/${po_b}/record-delivery"
              payload: { delivered_now: 10 }
              as: CouncilAdmin
              captures: { over_err: $.data.error_id }
          assert:
            - "first delivery of 10 succeeds: received_units == 100 == capacity (boundary inclusive)"
            - "DistributionSite.${site1}.posture == FULL"
            - "over_err == ERR_SITE_CAPACITY_EXCEEDED (101st package rejected; aggregate semantics)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant over DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: season_commitment_conservation_submit_reject
        grounds:
          - calculations.season_remaining_units
          - state_machines.CookieOrder.DRAFT_to_SUBMITTED
          - state_machines.CookieOrder.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Conserved quantity = CookieSeason commitment ledger. Invariant:
          submit(+Q pending) paired with reject(-Q pending) leaves
          initial_commit_units, pending_commit_units, and remaining_units
          EXACTLY at their pre-submit values: pending_before == pending_after
          and remaining_before == remaining_after.
        test_recipe:
          setup:
            - "Season OPEN; purchased 200; no orders yet (remaining 200, pending 0)"
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2043", name: "S43", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cookie-program/seasons/${s_id}/products"
              payload: { variety_code: "TM", name: "Thin Mints", unit_price_cents: 600, troop_proceeds_cents: 100, allergen_tags: [], packages_per_case: 1 }
              as: CouncilAdmin
              captures: { p_tm: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/sites"
              payload: { name: "Depot 1", address: "1 Depot Way", capacity_units: 10000, expected_season_version: "${s_v}" }
              as: CouncilAdmin
              captures: { site1: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/baker-pos"
