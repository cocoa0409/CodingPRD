          - { call: "POST /return-authorizations/${ra}/receive", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /return-authorizations/${ra}/inspect", payload: { inspection_grade: "RESELLABLE" }, as: CareOpsAgent, as_user_id: "ops_1" }
