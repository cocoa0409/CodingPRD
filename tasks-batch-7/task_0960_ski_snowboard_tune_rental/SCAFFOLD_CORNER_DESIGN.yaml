        claim_type: violation_to_error
        grounds: ["validations[priority=31]", "errors[ERR_DEPOSIT_BELOW_MINIMUM]"]
        distinguishing_aspect: "Deposit 2300 against minimum 2400 is rejected; the exact minimum (2400) is accepted (>= boundary)."
        test_recipe:
          setup: ["Reservation with one ASSIGNED item: quoted 12000, deposit_minimum 2400"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Min Dep", email: "min@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
