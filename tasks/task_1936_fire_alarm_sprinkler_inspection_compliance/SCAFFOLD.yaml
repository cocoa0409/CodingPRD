    description: "List impairments of a system"
    roles: [FireMarshal, ContractorAdmin, Technician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Impairment[]"
    side_effects: []
  - method: GET
    path: "/fire-compliance/impairments/{id}"
    description: "Fetch one impairment"
    roles: [FireMarshal, ContractorAdmin, Technician]
    code: 200
    input: []
    output: Impairment
    side_effects: []
  - method: POST
    path: "/fire-compliance/impairments/{id}/notify-authority"
    description: "Record authority notification; computes notification_late"
    roles: [ContractorAdmin]
    code: 200
    input: []
