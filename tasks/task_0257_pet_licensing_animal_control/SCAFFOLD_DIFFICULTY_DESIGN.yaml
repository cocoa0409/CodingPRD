      - name: submit_depends_on_kennel_open_state
        grounds:
          - state_machines.License.DRAFT_to_SUBMITTED
          - entities.Kennel.fields.status
          - errors[ERR_LICENSE_KIND_MISMATCH]
        distinguishing_aspect: |
          License DRAFT→SUBMITTED for a KENNEL license is gated by the KENNEL's state: when the kennel
          is SUSPENDED, the submit is rejected ERR_LICENSE_KIND_MISMATCH (KENNEL requires
          Kennel.status==OPEN); cross-entity pair License↔Kennel, distinct from the License↔Pet pair above.
        test_recipe:
          setup:
            - "Owner OK owns kennel KK that has been SUSPENDED; a KENNEL license LK is in DRAFT referencing KK"
          setup_api_calls:
            - call: "POST /_clock/set"
