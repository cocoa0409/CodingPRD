              payload: { product_id: "${prod}", channel: "RETAILER_SITE", seller_display_name: "BigBox Online", listing_url: "https://bigbox.example/p/1", listed_price_cents: 12000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obsret: $.data.id }
          trigger:
            - call: "POST /price-observations/${obsret}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { dc: $.data.deviation_cents, dp: $.data.deviation_pct, pp: $.data.provisional_points }
          assert:
            - "HTTP 200"
            - "${dc} == 3000"
            - "${dp} == 0.2000"
            - "${pp} == 4"

      - name: violation_points_repeat_multiplier_after_one_prior_notice
        claim_type: correct_result
        grounds: ["calculations.violation_points"]
        distinguishing_aspect: "One prior NOTICED violation gives repeat_multiplier 1.00 + 0.25 * 1 = 1.25, so a 9000 MARKETPLACE listing (pct 0.4000, base 6) scores round_half_up(6 * 1.5 * 1.25) = 11 rather than 9."
        test_recipe:
          setup: ["Violation V1 NOTICED with assessed_points 3; a second 9000 MARKETPLACE listing by the same reseller."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
          trigger:
            - call: "POST /price-observations/${obs2}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { dc: $.data.deviation_cents, dp: $.data.deviation_pct, pp: $.data.provisional_points, vid: $.data.violation_id }
          assert:
            - "HTTP 200"
            - "${dc} == 6000"
            - "${dp} == 0.4000"
            - "${pp} == 11"
            - "Violation.${vid}.provisional_points == 11"

      - name: violation_points_repeat_count_excludes_voided_violations
        claim_type: input_set_filtering
        grounds: ["calculations.violation_points"]
        distinguishing_aspect: "A VOIDED violation has assessed_points null and its status is outside the repeat set, so the same 9000 MARKETPLACE listing scores 9 (repeat 1.00) instead of the 11 it would score behind a live notice."
        test_recipe:
          setup: ["Violation V1 VOIDED via a sustained dispute (assessed_points null, ledger back to 0); a second 9000 MARKETPLACE listing by the same reseller."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *DISPUTE1
            - call: "POST /violations/${vio}/dispute-decision"
              payload: { decision: "SUSTAIN", decision_reason: "Evidence hash mismatch" }
