      - name: corner_calc_photo_penalty_cap_holds_at_three_and_four_rejections
        claim_type: threshold
        grounds:
          - calculations.cleaner_pay_line.constants.PHOTO_REJECT_PENALTY_CENTS
          - calculations.cleaner_pay_line.constants.PHOTO_PENALTY_CAP_CENTS
          - endpoints["GET /turnovers/{id}/pay-preview"]
          - entities.Turnover.fields.rejected_review_count
        distinguishing_aspect: |
          PHOTO_REJECT_PENALTY_CENTS 300 accumulates per rejection against the absolute
          PHOTO_PENALTY_CAP_CENTS 900, so the cap is walked at threshold-1 (2 rejections ->
          600), exactly at threshold (3 -> 900) and past it (4 -> still 900). The 4th rejection
          is the proof: raw 1200 is clipped, so net_cents is byte-identical to the 3-rejection
