        distinguishing_aspect: >
          The shipping waiver is a fixed-point test: the 500-cent fee is waived when
          the PROVISIONAL total reaches 1500, and the final patient_price_cents is
          assembled afterwards without the waived fee, so the same inputs yield
          delivery_fee 0 and patient_price_cents 1628 rather than the 2128 a
          naive single-pass reading produces.
