# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine rule_id blocks from §0.5, each with >= 2 grounded instances.
# Every numeric literal in an `assert:` was computed against the §1.3 formulas and constants.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: alignment_index_provisional_local_vs_federal_certified
        grounds:
          - calculations.program_alignment_index
          - entities.ProgramOfStudy.fields.alignment_index
          - entities.ProgramOfStudy.fields.alignment_index_variant
          - entities.SequenceCourse.fields.articulation_verified
          - state_machines.ProgramOfStudy.DRAFT_to_SUBMITTED
          - state_machines.ProgramOfStudy.COMMITTEE_REVIEW_to_STATE_APPROVED
          - validations[priority=29]
        distinguishing_aspect: |
          This instance's two variants diverge on the CURRICULUM entity domain: identical SequenceCourse rows
          yield alignment_index 0.9250 under PROVISIONAL_LOCAL (include_set {DRAFT, ACTIVE}, articulation_verified
          ignored) and 0.7750 under FEDERAL_CERTIFIED (include_set {ACTIVE} only, articulation_verified required),
          a delta of exactly 0.1500 produced by input-set filtering rather than by any change to the weights.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT authored by u_dir_1, clna_phase CERTIFIED with clna_expires_on 2028-07-31."
            - "Four SequenceCourse rows: SEC-A SECONDARY/ACTIVE 2.50 cr; SEC-B SECONDARY/DRAFT 1.00 cr; PS-A POSTSECONDARY/ACTIVE 3.00 cr with articulated 3.00 and articulation_verified true; PS-B POSTSECONDARY/DRAFT 3.00 cr with articulated 3.00 and articulation_verified false."
            - "One NATIONAL-tier Credential on the program and one Educator in status ELIGIBLE with 4200 verified industry hours."
            - "One AdvisoryCommittee in status ACTIVE with quorum_min_members 3, employer_seat_min 2, three ACTIVE members (two EMPLOYER, one of them the chair) whose terms span 2026-01-01 to 2027-12-31, and two FINALIZED quorate CLNA_STAKEHOLDER meetings on file."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "47.0604", title: "Automotive Technology", cluster: "ADVANCED_MANUFACTURING", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "SEC-A", title: "Intro to Automotive Systems", segment: "SECONDARY", position: 1, credit_hours: 2.50, status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { sec_a_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "SEC-B", title: "Automotive Electrical", segment: "SECONDARY", position: 2, credit_hours: 1.00, prerequisite_course_id: "${sec_a_id}", status: "DRAFT" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "PS-A", title: "Dual-Credit Powertrain", segment: "POSTSECONDARY", position: 3, credit_hours: 3.00, articulated_credit_hours: 3.00, articulation_verified: true, prerequisite_course_id: "${sec_a_id}", status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { ps_a_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "PS-B", title: "Dual-Credit Diagnostics", segment: "POSTSECONDARY", position: 4, credit_hours: 3.00, articulated_credit_hours: 3.00, articulation_verified: false, prerequisite_course_id: "${ps_a_id}", status: "DRAFT" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study/${pos_id}/credentials"
              payload: { code: "ASE-G1", title: "ASE Maintenance and Light Repair", tier: "NATIONAL", exam_required: true }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study/${pos_id}/educators"
              payload: { full_name: "Dana Ortiz", certification_route: "INDUSTRY_EXPERIENCE", claimed_industry_hours: 4200, credential_expires_on: "2029-06-30" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { edu_id: $.data.id }
            - call: "POST /cte/educators/${edu_id}/verify-industry-hours"
              payload: { verified_hours: 4200, verification_source: "EMPLOYER_LETTER" }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
            - call: "GET /cte/programs-of-study/${pos_id}"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_v_a: $.data.version }
            - call: "POST /cte/programs-of-study/${pos_id}/advisory-committees"
              payload: { name: "Automotive Advisory Committee", quorum_min_members: 3, employer_seat_min: 2, expected_program_of_study_version: "${pos_v_a}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { cmte_id: $.data.id }
            - call: "POST /cte/advisory-committees/${cmte_id}/members"
              payload: { full_name: "Rosa Vega", sector: "EMPLOYER", seat_code: "EMP-1", term_start_on: "2026-01-01", term_end_on: "2027-12-31", is_chair: true }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { m1_id: $.data.id }
            - call: "POST /cte/advisory-committees/${cmte_id}/members"
              payload: { full_name: "Ken Ade", sector: "EMPLOYER", seat_code: "EMP-2", term_start_on: "2026-01-01", term_end_on: "2027-12-31" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { m2_id: $.data.id }
            - call: "POST /cte/advisory-committees/${cmte_id}/members"
              payload: { full_name: "Iris Lund", sector: "POSTSECONDARY", seat_code: "PSE-1", term_start_on: "2026-01-01", term_end_on: "2027-12-31" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { m3_id: $.data.id }
            - call: "POST /cte/advisory-committees/${cmte_id}/meetings"
              payload: { agenda_kind: "CLNA_STAKEHOLDER", scheduled_for: "2026-08-04T14:00:00.000Z" }
              as: CommitteeChair
              as_user_id: "${m1_id}"
              captures: { mtg1_id: $.data.id }
            - call: "POST /cte/committee-meetings/${mtg1_id}/minutes"
              payload: { held_at: "2026-08-04T14:00:00.000Z", attendee_member_ids: ["${m1_id}", "${m2_id}", "${m3_id}"], vote_yes: 3, vote_no: 0, minutes_url: "https://district.example/min/clna-1.pdf" }
              as: CommitteeChair
              as_user_id: "${m1_id}"
            - call: "POST /cte/advisory-committees/${cmte_id}/meetings"
              payload: { agenda_kind: "CLNA_STAKEHOLDER", scheduled_for: "2026-08-05T14:00:00.000Z" }
              as: CommitteeChair
              as_user_id: "${m1_id}"
              captures: { mtg2_id: $.data.id }
            - call: "POST /cte/committee-meetings/${mtg2_id}/minutes"
              payload: { held_at: "2026-08-05T14:00:00.000Z", attendee_member_ids: ["${m1_id}", "${m2_id}", "${m3_id}"], vote_yes: 3, vote_no: 0, minutes_url: "https://district.example/min/clna-2.pdf" }
              as: CommitteeChair
              as_user_id: "${m1_id}"
            - call: "POST /cte/programs-of-study/${pos_id}/clna-advance"
              payload: { to_phase: "DATA_COLLECTION" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study/${pos_id}/clna-advance"
              payload: { to_phase: "STAKEHOLDER_CONSULTATION" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study/${pos_id}/clna-advance"
              payload: { to_phase: "GAP_ANALYSIS", evidence_url: "https://district.example/clna/gap.pdf" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study/${pos_id}/clna-advance"
              payload: { to_phase: "CERTIFIED", evidence_url: "https://district.example/clna/certified.pdf" }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
          trigger:
            - call: "POST /cte/programs-of-study/${pos_id}/submit"
              payload: { narrative_url: "https://district.example/pos/47-0604/narrative.pdf" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { prov_index: $.data.alignment_index, prov_variant: $.data.alignment_index_variant }
            - call: "POST /cte/advisory-committees/${cmte_id}/meetings"
              payload: { agenda_kind: "POS_ENDORSEMENT", scheduled_for: "2026-08-10T15:00:00.000Z" }
              as: CommitteeChair
              as_user_id: "${m1_id}"
              captures: { mtg3_id: $.data.id }
            - call: "POST /cte/committee-meetings/${mtg3_id}/minutes"
              payload: { held_at: "2026-08-10T15:00:00.000Z", attendee_member_ids: ["${m1_id}", "${m2_id}", "${m3_id}"], vote_yes: 3, vote_no: 0, minutes_url: "https://district.example/min/endorse.pdf" }
              as: CommitteeChair
              as_user_id: "${m1_id}"
            - call: "POST /cte/programs-of-study/${pos_id}/state-approve"
              payload: { approval_note: "Aligned sequence verified." }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { fed_index: $.data.alignment_index, fed_variant: $.data.alignment_index_variant }
          assert:
            - "${prov_variant} == PROVISIONAL_LOCAL"
            - "${prov_index} == 0.9250"
            - "ProgramOfStudy.${pos_id}.secondary_credit_total == 3.50 and postsecondary_credit_total == 6.00 and articulated_credit_total == 6.00 in the submit response"
            - "${fed_variant} == FEDERAL_CERTIFIED"
            - "${fed_index} == 0.7750"
            - "${prov_index} - ${fed_index} == 0.1500"
            - "ProgramOfStudy.${pos_id}.approval_status == STATE_APPROVED and federal_reporting_eligible == true"

      - name: indicator_actual_preliminary_unadjusted_vs_final_small_cohort_adjusted
        grounds:
          - calculations.performance_indicator_actual
          - entities.PerformanceIndicator.fields.preliminary_actual_pct
          - entities.PerformanceIndicator.fields.preliminary_status_projection
          - entities.PerformanceIndicator.fields.actual_pct
          - entities.PerformanceIndicator.fields.small_cohort_flag
          - state_machines.PerformanceIndicator.AGREED_to_NOT_SCORED
        distinguishing_aspect: |
          This instance's two variants diverge on the STUDENT-OUTCOME entity domain and diverge in KIND rather than
          in magnitude: with 4 concentrators and 1 qualifying attainment both variants compute raw 25.00, but
          PRELIMINARY_UNADJUSTED publishes preliminary_status_projection NOT_MET while FINAL_SMALL_COHORT_ADJUSTED
          suppresses the score to NOT_SCORED and leaves consecutive_miss_count at 0 because small_cohort_flag is true.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT (approval state is irrelevant to this calculation)."
            - "One ACTIVE SECONDARY SequenceCourse worth 2.50 credit hours and one NATIONAL-tier Credential with exam_required false."
            - "Four Students in cohort_year 2026 each carrying exactly 2.00 CTE credits, so all four are CONCENTRATOR and denominator_count is 4 — one below SMALL_COHORT_MIN of 5."
            - "Exactly one of those four holds a VERIFIED attainment of the NATIONAL credential, so numerator_count is 1."
            - "One PerformanceIndicator 4S1_CREDENTIAL / reporting_year 2027 / cohort_year 2026 in status AGREED with negotiated_level_pct 44.44 and met_threshold_pct 40.00."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.3902", title: "Practical Nursing", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "NUR-1", title: "Nursing Fundamentals", segment: "SECONDARY", position: 1, credit_hours: 2.50, status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/credentials"
              payload: { code: "CNA-ST", title: "Certified Nursing Assistant", tier: "NATIONAL", exam_required: false }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { cred_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000001", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu1_id: $.data.id }
            - call: "POST /cte/students/${stu1_id}/credit-postings"
              payload: { sequence_course_id: "${crs_id}", credit_delta: 2.00, posted_on: "2026-07-15" }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000002", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu2_id: $.data.id }
            - call: "POST /cte/students/${stu2_id}/credit-postings"
              payload: { sequence_course_id: "${crs_id}", credit_delta: 2.00, posted_on: "2026-07-15" }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000003", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu3_id: $.data.id }
            - call: "POST /cte/students/${stu3_id}/credit-postings"
              payload: { sequence_course_id: "${crs_id}", credit_delta: 2.00, posted_on: "2026-07-15" }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000004", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu4_id: $.data.id }
            - call: "POST /cte/students/${stu4_id}/credit-postings"
              payload: { sequence_course_id: "${crs_id}", credit_delta: 2.00, posted_on: "2026-07-15" }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
            - call: "POST /cte/students/${stu1_id}/credential-attainments"
              payload: { credential_id: "${cred_id}", attained_on: "2026-07-20", verification_status: "VERIFIED" }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
            - call: "POST /cte/programs-of-study/${pos_id}/performance-indicators"
              payload: { indicator_code: "4S1_CREDENTIAL", reporting_year: 2027, baseline_pct: 60.00, cohort_year: 2026 }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { pi_id: $.data.id }
            - call: "POST /cte/performance-indicators/${pi_id}/negotiation-offers"
              payload: { offered_level_pct: 44.44, rationale: "State opening offer." }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
            - call: "POST /cte/performance-indicators/${pi_id}/accept-level"
              payload: { acceptance_note: "District accepts." }
              as: CteDirector
              as_user_id: "u_dir_1"
          trigger:
            - call: "GET /cte/performance-indicators/${pi_id}"
              payload: {}
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { prelim_pct: $.data.preliminary_actual_pct, prelim_proj: $.data.preliminary_status_projection, thresh: $.data.met_threshold_pct }
            - call: "POST /cte/performance-indicators/${pi_id}/close-reporting-year"
              payload: { closed_on: "2027-09-30" }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { final_pct: $.data.actual_pct, final_status: $.data.status, final_misses: $.data.consecutive_miss_count }
          assert:
            - "PerformanceIndicator.${pi_id}.denominator_count == 4"
            - "PerformanceIndicator.${pi_id}.numerator_count == 1"
            - "PerformanceIndicator.${pi_id}.small_cohort_flag == true"
            - "${thresh} == 40.00"
            - "${prelim_pct} == 25.00"
            - "${prelim_proj} == NOT_MET"
            - "${final_pct} == 25.00"
            - "${final_status} == NOT_SCORED"
            - "${final_misses} == 0"

  - rule_id: combinatorial_formula
    instances:

      - name: federal_share_rounds_per_line_before_the_grant_rollup_sums
        grounds:
          - calculations.expenditure_federal_share
          - calculations.grant_obligation_rollup
          - entities.Expenditure.fields.approved_cents
          - entities.GrantAward.fields.direct_obligated_cents
          - state_machines.Expenditure.REQUESTED_to_CERTIFIED
        distinguishing_aspect: |
          This instance pins ROUNDING ORDER (§0.5 mode b): two CONSUMABLE lines of gross_cents 250010 at
          federal_share_pct 0.85 must be rounded to 212509 each and then summed to direct_obligated_cents 425018;
          summing gross first and rounding once yields 425017, so the single-cent difference falsifies the wrong order.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status STATE_APPROVED with clna_phase CERTIFIED and clna_expires_on 2028-07-31."
            - "One GrantAward for fiscal_year 2027 with allocation_cents 5000000 and obligation window 2026-07-01 to 2027-06-30, so the clock sits inside the window."
            - "Two REQUESTED CONSUMABLE Expenditures on that award, each unit_cost_cents 125005 and quantity 2, so each has gross_cents 250010 and neither carries an asset_tag."
            - "Both expenditures were requested by u_dir_1, so the certifier u_fis_1 satisfies segregation of duties."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "15.0805", title: "Mechatronics", cluster: "ADVANCED_MANUFACTURING", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
