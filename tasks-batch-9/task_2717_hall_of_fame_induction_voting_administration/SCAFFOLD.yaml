    roles: [ElectionAdministrator, Elector, IndependentAuditor]
    code: 200
    input: []
    output: VoteSubmission
    side_effects: []
  - method: GET
    path: "/vote-submissions"
    description: "List vote submissions by ballot or by elector, ordered by created_at ASC, then id ASC; selected_slot_ids is returned as null unless the acting role is IndependentAuditor"
    roles: [ElectionAdministrator, Elector, IndependentAuditor]
    code: 200
    input: ["ballot_id?", "elector_id?", "status?", "limit?", "offset?"]
    output: VoteSubmission[]
    side_effects: []
  - method: GET
    path: "/inductions/{id}"
    description: "Read one induction with its three parallel dimensions and readiness flag"
    roles: [ElectionAdministrator, IndependentAuditor, CuratorialStaff, Elector, ScreeningCommitteeMember]
    code: 200
    input: []
    output: Induction
    side_effects: []
  - method: GET
    path: "/inductions"
    description: "List inductions by cycle, candidacy or candidate, ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, IndependentAuditor, CuratorialStaff, Elector, ScreeningCommitteeMember]
    code: 200
    input: ["cycle_id?", "candidacy_id?", "candidate_id?", "status?", "travel_status?", "artifact_status?", "exhibit_status?", "limit?", "offset?"]
    output: Induction[]
    side_effects: []
  - method: GET
    path: "/travel-grants/{id}"
    description: "Read one travel grant with its variant, applied austerity tier and award"
    roles: [ElectionAdministrator, IndependentAuditor, CuratorialStaff]
    code: 200
    input: []
    output: TravelGrant
    side_effects: []
  - method: GET
    path: "/travel-grants"
    description: "List travel grants by cycle or induction, ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, IndependentAuditor, CuratorialStaff]
    code: 200
    input: ["cycle_id?", "induction_id?", "status?", "variant?", "limit?", "offset?"]
    output: TravelGrant[]
    side_effects: []
  - method: GET
    path: "/exhibit-cases/{id}"
    description: "Read one exhibit case with its live artifacts_installed occupancy"
    roles: [ElectionAdministrator, CuratorialStaff, IndependentAuditor]
    code: 200
    input: []
    output: ExhibitCase
    side_effects: []
  - method: GET
    path: "/exhibit-cases"
    description: "List exhibit cases ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, CuratorialStaff, IndependentAuditor]
    code: 200
    input: ["case_code?", "limit?", "offset?"]
    output: ExhibitCase[]
    side_effects: []
  - method: GET
    path: "/exhibit-installations/{id}"
    description: "Read one exhibit installation with its half-open display window"
    roles: [ElectionAdministrator, CuratorialStaff, IndependentAuditor]
    code: 200
    input: []
    output: ExhibitInstallation
    side_effects: []
  - method: GET
    path: "/exhibit-installations"
    description: "List exhibit installations by induction or case, ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, CuratorialStaff, IndependentAuditor]
    code: 200
    input: ["induction_id?", "exhibit_case_id?", "status?", "limit?", "offset?"]
    output: ExhibitInstallation[]
    side_effects: []

  # ------------------------------------------------- configuration writes ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; every credential expiry, ballot window, ceremony date and exhibit window rule is evaluated against this logical clock."
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor, CuratorialStaff]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock used by every temporal validation and by credentialed_roster_count"
  - method: POST
    path: "/induction-cycles"
    description: "Open a new induction cycle in SETUP"
    roles: [ElectionAdministrator]
    code: 201
    input: [cycle_year, sport_code, "max_inductees?", "travel_budget_cents?", "escort_pool_size?"]
    output: InductionCycle
    side_effects:
      - "initializes status = SETUP, current_round = 0, austerity_tier = FULL and every counter at 0"
  - method: POST
    path: "/eligibility-rules"
    description: "Declare the eligibility rule for one (category, pathway) pair"
    roles: [ElectionAdministrator]
    code: 201
    input: [category, pathway, waiting_period_years, min_career_seasons, min_career_metric, max_ballot_appearances, election_threshold_pct, carryover_min_pct, runoff_floor_pct]
    output: EligibilityRule
    side_effects: []
  - method: POST
    path: "/voter-blocs"
    description: "Create a voter bloc with a seat cap and a participation floor used at audit certification"
    roles: [ElectionAdministrator]
    code: 201
    input: [bloc_code, name, seat_cap, min_participation_pct]
    output: VoterBloc
    side_effects:
      - "initializes seats_filled = 0"
  - method: POST
    path: "/exhibit-cases"
    description: "Create a display case with an artifact capacity and a changeover buffer"
    roles: [CuratorialStaff, ElectionAdministrator]
    code: 201
    input: [case_code, capacity_artifacts, changeover_buffer_days]
    output: ExhibitCase
    side_effects:
      - "initializes artifacts_installed = 0"
  - method: POST
    path: "/candidates"
    description: "Register a candidate with career figures and living-or-deceased standing"
    roles: [ElectionAdministrator]
    code: 201
    input: [full_name, category, retirement_year, career_seasons, career_metric_value, "is_deceased?", "death_year?"]
    output: Candidate
    side_effects:
      - "initializes hof_status = NOT_INDUCTED and ballot_appearances_used = 0"
  - method: PATCH
    path: "/candidates/{id}"
    description: "Correct a candidate's career record or record a death after registration"
    roles: [ElectionAdministrator]
    code: 200
    input: ["career_seasons?", "career_metric_value?", "is_deceased?", "death_year?"]
    output: Candidate
    side_effects:
      - "increments Candidate.version by 1"
      - "leaves hof_status, ballot_appearances_used and veterans_eligible_from_year untouched"
  - method: POST
    path: "/candidates/{id}/permanent-ineligibility"
    description: "Bar a candidate permanently; strikes every live candidacy and every printed ballot slot of that candidate"
    roles: [ElectionAdministrator]
    code: 200
    input: [permanently_ineligible_reason]
    output: Candidate
    side_effects:
      - "sets hof_status = PERMANENTLY_INELIGIBLE"
      - "drives every Candidacy of this candidate with status IN {SUBMITTED, SCREENING, INFO_REQUESTED, ADVANCED, ON_BALLOT} to STRUCK"
      - "sets every BallotSlot of those candidacies to STRUCK, decrementing Ballot.slot_count and incrementing Ballot.version by 1"
      - "reduces Ballot.total_selections_counted by the selections cast for the struck slots"
  - method: POST
    path: "/electors"
    description: "Add an elector to a voter bloc in PROVISIONAL standing"
    roles: [ElectionAdministrator]
    code: 201
    input: [full_name, bloc_id, credential_expires_on, "is_screening_member?"]
    output: Elector
    side_effects:
      - "initializes status = PROVISIONAL and consecutive_missed_cycles = 0"
  - method: POST
    path: "/electors/{id}/credential"
    description: "Credential a provisional elector against the bloc's seat cap"
    roles: [ElectionAdministrator]
    code: 200
    input: ["credential_expires_on?"]
    output: Elector
    side_effects:
      - "sets status = CREDENTIALED and overwrites credential_expires_on when supplied"
      - "increments VoterBloc.seats_filled by 1"
      - "recomputes InductionCycle.credentialed_roster_count for every cycle in NOMINATIONS_OPEN, SCREENING or BALLOTING"
  - method: POST
    path: "/electors/{id}/suspend"
    description: "Suspend a credentialed elector without freeing the bloc seat"
    roles: [ElectionAdministrator]
    code: 200
    input: [suspension_reason]
    output: Elector
    side_effects:
      - "sets status = SUSPENDED and stores suspension_reason"
      - "recomputes InductionCycle.credentialed_roster_count for every cycle in NOMINATIONS_OPEN, SCREENING or BALLOTING"
  - method: POST
    path: "/electors/{id}/reinstate"
    description: "Return a suspended elector to credentialed standing, optionally with a fresh expiry"
    roles: [ElectionAdministrator]
    code: 200
    input: ["credential_expires_on?"]
    output: Elector
    side_effects:
      - "sets status = CREDENTIALED, clears suspension_reason and overwrites credential_expires_on when supplied"
      - "recomputes InductionCycle.credentialed_roster_count for every cycle in NOMINATIONS_OPEN, SCREENING or BALLOTING"

  # ------------------------------------------------------- cycle lifecycle ----
  - method: POST
    path: "/induction-cycles/{id}/open-nominations"
    description: "Move a cycle from SETUP to NOMINATIONS_OPEN and snapshot the credentialed roster count"
    roles: [ElectionAdministrator]
    code: 200
    input: []
    output: InductionCycle
    side_effects:
      - "sets status = NOMINATIONS_OPEN"
      - "recomputes credentialed_roster_count"
      - "increments InductionCycle.version by 1"
  - method: POST
    path: "/induction-cycles/{id}/close-nominations"
    description: "Close nomination intake and hand every submitted candidacy to the screening committee"
    roles: [ElectionAdministrator]
    code: 200
    input: []
    output: InductionCycle
    side_effects:
      - "sets status = SCREENING"
      - "drives every Candidacy of the cycle with status == SUBMITTED to SCREENING"
      - "increments InductionCycle.version by 1"
  - method: POST
    path: "/induction-cycles/{id}/certify-election"
    description: "Close out the balloting phase: elect the certified slots, create inductions, resolve carryover and expiration, and run elector participation maintenance"
    roles: [ElectionAdministrator]
    code: 200
    input: []
    output: InductionCycle
    side_effects:
      - "sets status = CERTIFIED"
      - "drives every ELECTED BallotSlot's Candidacy ON_BALLOT -> ELECTED, sets Candidate.hof_status = INDUCTED and creates one Induction each"
      - "increments induction_count per created Induction and recomputes ceremony_ready_count"
      - "increments Candidate.ballot_appearances_used by 1 for every scored candidacy of the final round"
      - "runs carryover_and_expiration over every Candidacy still ON_BALLOT or ELIMINATED, resolving each to CARRYOVER_ELIGIBLE or EXPIRED"
      - "sets Candidate.veterans_eligible_from_year on every EXPIRED candidacy"
      - "runs elector_participation_maintenance, flipping non-participating electors to LAPSED at LAPSE_MISSED_CYCLES and freeing their bloc seats"
      - "increments InductionCycle.version by 1"
  - method: PATCH
    path: "/induction-cycles/{id}/ceremony"
    description: "Plan the induction ceremony: date, venue, travel budget and escort pool"
    roles: [ElectionAdministrator]
    code: 200
    input: [ceremony_date, ceremony_venue, "travel_budget_cents?", "escort_pool_size?"]
    output: InductionCycle
    side_effects:
      - "sets status = CEREMONY_PLANNED and stores ceremony_date, ceremony_venue, travel_budget_cents and escort_pool_size"
      - "recomputes austerity_tier from travel_committed_cents / travel_budget_cents"
      - "increments InductionCycle.version by 1"
  - method: POST
    path: "/induction-cycles/{id}/hold-ceremony"
    description: "Hold the ceremony and enshrine every inductee; requires that every induction is ceremony_ready"
    roles: [ElectionAdministrator]
    code: 200
    input: []
    output: InductionCycle
    side_effects:
      - "sets status = CLOSED"
      - "drives every Induction of the cycle ANNOUNCED -> ENSHRINED, freezing all three of its dimensions"
      - "increments InductionCycle.version by 1"

  # -------------------------------------------- nomination and screening ----
  - method: POST
    path: "/candidacies"
    description: "File a nomination against an open cycle; runs the full eligibility assessment for the candidate's (category, pathway) rule"
    roles: [Elector, ElectionAdministrator]
    code: 201
    input: [cycle_id, candidate_id, nominated_by_elector_id, pathway, "justification?", "carryover_from_candidacy_id?"]
    output: Candidacy
    side_effects:
      - "runs career_eligibility_assessment and stores eligible_from_year"
      - "sets status = SUBMITTED and appearance_number = 0"
      - "increments InductionCycle.nomination_count by 1 and recomputes special_election_used"
  - method: POST
    path: "/candidacies/{id}/screening-decisions"
    description: "Record a screening committee decision: ADVANCE, REJECT, DEFER or REQUEST_INFO"
    roles: [ScreeningCommitteeMember]
    code: 200
    input: [decision, "screening_notes?"]
    output: Candidacy
    side_effects:
      - "ADVANCE sets status = ADVANCED and increments InductionCycle.advanced_candidacy_count by 1"
      - "REJECT sets status = REJECTED and recomputes InductionCycle.special_election_used"
      - "DEFER sets status = DEFERRED"
      - "REQUEST_INFO sets status = INFO_REQUESTED and increments info_request_count by 1"
      - "sets screened_by_elector_id to the acting X-User-ID"
  - method: POST
    path: "/candidacies/{id}/supplements"
    description: "The nominating elector answers an information request and returns the candidacy to screening"
    roles: [Elector]
    code: 200
    input: [supplement_note]
    output: Candidacy
    side_effects:
      - "sets status = SCREENING"
      - "appends supplement_note to screening_notes"

  # ------------------------------------------------- balloting and tally ----
  - method: POST
    path: "/ballots"
    description: "Construct the ballot for the next round; prints one slot per advanced candidacy (first round) or per slot carried to the runoff (later rounds)"
    roles: [ElectionAdministrator]
    code: 201
    input: [cycle_id, opens_at, closes_at, expected_cycle_version]
    output: Ballot
    side_effects:
      - "sets round_number = InductionCycle.current_round + 1 for a first or runoff round, or reuses the round_number of the EXPIRED ballot it replaces"
      - "runs max_votes_per_elector_for_round and stores max_votes_per_elector"
      - "creates one BallotSlot per source candidacy with candidate_name_snapshot, pathway_snapshot and candidacy_version_pinned, and sets slot_count"
      - "drives every ADVANCED Candidacy to ON_BALLOT on a first round and sets its appearance_number"
      - "sets InductionCycle.status = BALLOTING and current_round = 1 on the first ballot"
      - "increments InductionCycle.version by 1"
  - method: POST
    path: "/ballots/{id}/certify"
    description: "Certify the printed slate and open the ballot for voting"
    roles: [ElectionAdministrator]
    code: 200
    input: []
    output: Ballot
    side_effects:
      - "sets voting_status = OPEN"
      - "increments Ballot.version by 1"
  - method: POST
    path: "/ballots/{id}/close"
    description: "Close the voting window; a ballot closed at or after closes_at expires instead and can never be tabulated"
    roles: [ElectionAdministrator]
    code: 200
    input: []
    output: Ballot
    side_effects:
      - "sets voting_status = CLOSED when the logical clock is before closes_at, otherwise EXPIRED"
      - "snapshots credentialed_roster_at_close from the live credentialed roster"
      - "increments Ballot.version by 1"
  - method: POST
    path: "/ballots/{id}/tally"
    description: "Produce the draft tally with the turnout-based provisional threshold; may be re-run after an auditor rejection"
    roles: [ElectionAdministrator]
    code: 200
    input: []
    output: Ballot
    side_effects:
      - "runs ballot_tally_counts, setting votes_received and vote_pct on every LISTED slot"
      - "runs election_threshold_votes variant TURNOUT_BASED and stores threshold_votes_provisional"
      - "sets tally_status = PENDING_AUDIT and tallied_by_user_id to the acting X-User-ID"
      - "increments Ballot.version by 1"
  - method: POST
    path: "/ballots/{id}/audit-decision"
    description: "Independent auditor certifies or rejects the draft tally; certification applies the roster-based final threshold and resolves the round"
    roles: [IndependentAuditor]
    code: 200
    input: [decision, "invalidate_submission_ids?", "audit_note?"]
    output: Ballot
    side_effects:
      - "REJECT drives every listed VoteSubmission COUNTED -> INVALIDATED, reduces ballots_cast, total_selections_counted and the affected slots' votes_received, resets threshold_votes_provisional to 0 and clears tallied_by_user_id"
      - "CERTIFY runs election_threshold_votes variant ROSTER_BASED and stores threshold_votes_final"
      - "CERTIFY runs election_outcome_resolution, setting every LISTED slot to ELECTED, CARRIED_TO_RUNOFF or NOT_ELECTED and storing elected_slot_count and outcome"
      - "CERTIFY drives every NOT_ELECTED slot's Candidacy ON_BALLOT -> ELIMINATED when outcome == RUNOFF_REQUIRED"
      - "CERTIFY copies latest_round_votes and latest_round_pct onto every scored Candidacy"
      - "CERTIFY with outcome == RUNOFF_REQUIRED increments InductionCycle.current_round and InductionCycle.version by 1"
      - "increments Ballot.version by 1"
  - method: POST
    path: "/vote-submissions"
    description: "Cast one elector's ballot; the selection list is confidential and is echoed back only to the IndependentAuditor"
    roles: [Elector, ScreeningCommitteeMember]
    code: 201
    input: [ballot_id, "selected_slot_ids?", "is_abstention?", expected_ballot_version]
    output: VoteSubmission
    side_effects:
      - "sets elector_id from the acting X-User-ID, status = COUNTED, selection_count = len(selected_slot_ids) and cast_at from the logical clock"
      - "increments Ballot.ballots_cast by 1 and Ballot.total_selections_counted by selection_count"
      - "increments Ballot.version by 1 and reports the new value in ballot_version_after"
      - "sets Elector.last_participated_cycle_year to the ballot's cycle year and resets consecutive_missed_cycles to 0"
  - method: POST
    path: "/vote-submissions/{id}/withdraw"
    description: "The casting elector withdraws a submission while the voting window is still open"
    roles: [Elector, ScreeningCommitteeMember]
    code: 200
    input: []
    output: VoteSubmission
    side_effects:
      - "sets status = WITHDRAWN"
      - "decrements Ballot.ballots_cast by 1 and reduces Ballot.total_selections_counted by selection_count"
      - "increments Ballot.version by 1 and reports the new value in ballot_version_after"

  # ------------------------------------------ ceremony, travel, exhibits ----
  - method: POST
    path: "/inductions/{id}/artifact-intake"
    description: "Record the artifacts an inductee donates, or mark the induction artifact-exempt; supply artifact_count >= 1 or is_exempt == true, never both"
    roles: [CuratorialStaff]
    code: 200
    input: ["artifact_count?", "is_exempt?"]
    output: Induction
    side_effects:
      - "sets artifact_status = RECEIVED and artifact_count when artifacts are donated"
      - "sets artifact_status = EXEMPT and leaves artifact_count at 0 when is_exempt == true"
      - "recomputes induction_ceremony_readiness for the induction and InductionCycle.ceremony_ready_count"
  - method: POST
    path: "/travel-grants"
    description: "Request travel funding for one induction; the award formula branches on the living-versus-posthumous variant and on the cycle's austerity tier"
    roles: [ElectionAdministrator, CuratorialStaff]
    code: 201
    input: [induction_id, nights, requested_airfare_cents, "escort_from?", "escort_to?", "cycle_id?", expected_cycle_version]
    output: TravelGrant
    side_effects:
      - "sets cycle_id from the induction, variant and traveler_count from Induction.delegation_type and austerity_tier_applied from the cycle's current tier; a supplied cycle_id is a cross-check only and must equal Induction.cycle_id"
      - "runs travel_grant_award_cents and stores award_cents"
      - "sets status = REQUESTED and drives Induction.travel_status PENDING -> REQUESTED"
      - "increments InductionCycle.version by 1 and reports the new value in cycle_version_after"
  - method: POST
    path: "/travel-grants/{id}/approve"
    description: "Commit the award against the cycle's travel budget and the ceremony escort pool"
    roles: [ElectionAdministrator]
    code: 200
    input: []
    output: TravelGrant
    side_effects:
      - "sets status = APPROVED"
      - "increases InductionCycle.travel_committed_cents by award_cents and recomputes austerity_tier"
      - "drives Induction.travel_status REQUESTED -> APPROVED, recomputes Induction.ceremony_ready and InductionCycle.ceremony_ready_count"
      - "occupies the escort interval for POSTHUMOUS_DELEGATION grants"
      - "increments InductionCycle.version by 1 and refreshes cycle_version_after"
  - method: POST
    path: "/travel-grants/{id}/deny"
    description: "Deny a requested grant; the inductee travels unfunded and stops blocking ceremony readiness"
    roles: [ElectionAdministrator]
    code: 200
    input: [cancellation_reason]
    output: TravelGrant
    side_effects:
      - "sets status = DENIED and stores cancellation_reason"
      - "leaves InductionCycle.travel_committed_cents and austerity_tier unchanged"
      - "drives Induction.travel_status REQUESTED -> WAIVED and recomputes Induction.ceremony_ready and InductionCycle.ceremony_ready_count"
      - "increments InductionCycle.version by 1 and refreshes cycle_version_after"
  - method: POST
    path: "/travel-grants/{id}/cancel"
    description: "Cancel an approved grant and release every committed resource exactly as it was committed"
    roles: [ElectionAdministrator]
    code: 200
    input: [cancellation_reason]
    output: TravelGrant
    side_effects:
      - "sets status = CANCELLED and stores cancellation_reason"
      - "decreases InductionCycle.travel_committed_cents by award_cents, restoring the pre-approval value exactly, and recomputes austerity_tier"
      - "drives Induction.travel_status APPROVED -> PENDING, recomputes Induction.ceremony_ready and decrements InductionCycle.ceremony_ready_count when it flips to false"
      - "frees the escort interval"
      - "increments InductionCycle.version by 1 and refreshes cycle_version_after"
  - method: POST
    path: "/exhibit-installations"
    description: "Install an inductee's artifacts in a display case for a half-open display window"
    roles: [CuratorialStaff]
    code: 201
    input: [induction_id, exhibit_case_id, display_starts_on, display_ends_on, artifact_count]
    output: ExhibitInstallation
    side_effects:
      - "runs exhibit_window_conflict against every INSTALLED window of the case"
      - "sets status = INSTALLED and increments ExhibitCase.artifacts_installed by artifact_count"
      - "drives Induction.exhibit_status NOT_PLANNED -> INSTALLED on the first installation and leaves it INSTALLED for later ones, recomputes Induction.ceremony_ready and InductionCycle.ceremony_ready_count"
  - method: POST
    path: "/exhibit-installations/{id}/withdraw"
    description: "Withdraw an installation, releasing the case occupancy and the display window"
    roles: [CuratorialStaff]
    code: 200
    input: []
    output: ExhibitInstallation
    side_effects:
      - "sets status = WITHDRAWN"
      - "decrements ExhibitCase.artifacts_installed by artifact_count, restoring the pre-installation value exactly"
      - "drives Induction.exhibit_status INSTALLED -> NOT_PLANNED when no other INSTALLED installation remains, recomputing Induction.ceremony_ready and InductionCycle.ceremony_ready_count"

errors:
  # ---- authentication / authorization / identity ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed for the endpoint"
  - id: ERR_ELECTOR_IDENTITY_UNKNOWN
    http: 403
    condition: "Acting role is Elector or ScreeningCommitteeMember but X-User-ID is not an existing Elector id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, undeclared enum value, wrong scalar type, unparseable timestamp, or artifact intake that supplies neither artifact_count >= 1 nor is_exempt == true"
  # ---- existence ----
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "InductionCycle id in the path or in cycle_id does not exist"
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "Candidate id in the path or in candidate_id does not exist"
  - id: ERR_CANDIDACY_NOT_FOUND
    http: 404
    condition: "Candidacy id in the path or in carryover_from_candidacy_id does not exist"
  - id: ERR_ELECTOR_NOT_FOUND
    http: 404
    condition: "Elector id in the path or in nominated_by_elector_id does not exist"
  - id: ERR_BALLOT_NOT_FOUND
    http: 404
    condition: "Ballot, BallotSlot or VoteSubmission id in the path or body does not exist"
  - id: ERR_INDUCTION_NOT_FOUND
    http: 404
    condition: "Induction or TravelGrant id in the path or body does not exist"
  - id: ERR_EXHIBIT_NOT_FOUND
    http: 404
    condition: "ExhibitCase or ExhibitInstallation id in the path or body does not exist"
  - id: ERR_ELIGIBILITY_RULE_NOT_FOUND
    http: 404
    condition: "No EligibilityRule exists for the candidate's category paired with the requested pathway, or nominations are opened on a cycle while the EligibilityRule table is empty"
  - id: ERR_BLOC_NOT_FOUND
    http: 404
    condition: "VoterBloc id in the path or in bloc_id does not exist"
  # ---- state preconditions ----
  - id: ERR_INVALID_CYCLE_STATE
    http: 409
    condition: "InductionCycle.status is not the from-state the requested cycle transition or child write requires"
  - id: ERR_INVALID_CANDIDACY_STATE
    http: 409
    condition: "Candidacy.status is not the from-state the requested screening decision or supplement requires"
  - id: ERR_INVALID_ELECTOR_STATE
    http: 409
    condition: "Elector.status is not the from-state the requested credential, suspension or reinstatement requires"
  - id: ERR_INVALID_BALLOT_STATE
    http: 409
    condition: "Ballot.voting_status is not the from-state the operation requires, or a new ballot is constructed while a DRAFT or OPEN ballot still exists for the cycle"
  - id: ERR_BALLOT_EXPIRED
    http: 409
    condition: "Tabulation or audit attempted on a ballot whose voting_status == EXPIRED"
  - id: ERR_INVALID_TALLY_STATE
    http: 409
    condition: "Ballot.tally_status is not NOT_TALLIED or AUDIT_REJECTED for a tally, or not PENDING_AUDIT for an audit decision"
  - id: ERR_ELECTION_NOT_FINAL
    http: 409
    condition: "Election certification attempted while the newest ballot is not AUDIT_CERTIFIED or resolved outcome == RUNOFF_REQUIRED"
  - id: ERR_CEREMONY_NOT_PLANNED
    http: 409
    condition: "Travel grant creation or decision attempted while InductionCycle.status != CEREMONY_PLANNED"
  - id: ERR_INVALID_GRANT_STATE
    http: 409
    condition: "TravelGrant.status is not REQUESTED for an approval or denial, or not APPROVED for a cancellation"
  - id: ERR_INVALID_INDUCTION_STATE
    http: 409
    condition: "Induction.status == ENSHRINED, or the addressed dimension is already past its from-state: travel_status != PENDING for a new grant, artifact_status != AWAITED for artifact intake, or ExhibitInstallation.status != INSTALLED for a withdrawal"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal InductionCycle.version"
  - id: ERR_STALE_BALLOT_VERSION
    http: 412
    condition: "expected_ballot_version does not equal Ballot.version"
  # ---- segregation of duties and credential compliance ----
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user screens a candidacy they nominated, or audits a tally they produced"
  - id: ERR_NOMINATOR_IDENTITY_MISMATCH
    http: 403
    condition: "An Elector files a nomination for another elector, supplements a candidacy they did not nominate, or withdraws another elector's submission"
  - id: ERR_NOT_SCREENING_MEMBER
    http: 403
    condition: "The acting elector has is_screening_member == false or is not CREDENTIALED"
  - id: ERR_ELECTOR_NOT_CREDENTIALED
    http: 403
    condition: "The elector the operation depends on has status != CREDENTIALED"
  - id: ERR_CREDENTIAL_EXPIRED
    http: 403
    condition: "Elector.credential_expires_on is before the logical clock"
  # ---- eligibility ----
  - id: ERR_CANDIDATE_INELIGIBLE
    http: 422
    condition: "Candidate.hof_status is INDUCTED or PERMANENTLY_INELIGIBLE at nomination or at an ADVANCE decision"
  - id: ERR_POSTHUMOUS_PATHWAY_REQUIRES_DECEASED
    http: 422
    condition: "POSTHUMOUS pathway requested for a candidate with is_deceased == false or a null death_year"
  - id: ERR_WAITING_PERIOD_NOT_MET
    http: 422
    condition: "InductionCycle.cycle_year is below the candidacy's computed eligible_from_year"
  - id: ERR_CAREER_THRESHOLD_NOT_MET
    http: 422
    condition: "Candidate.career_seasons or career_metric_value is below the matching EligibilityRule minimum"
  - id: ERR_APPEARANCE_LIMIT_REACHED
    http: 422
    condition: "Candidate.ballot_appearances_used has reached EligibilityRule.max_ballot_appearances"
  - id: ERR_JUSTIFICATION_REQUIRED
    http: 422
    condition: "SPECIAL pathway nomination filed without a justification"
  - id: ERR_SPECIAL_ELECTION_QUOTA_EXHAUSTED
    http: 409
    condition: "InductionCycle.special_election_used has reached SPECIAL_MAX_PER_CYCLE"
  # ---- uniqueness and quantitative constraints ----
  - id: ERR_DUPLICATE_CANDIDACY
    http: 409
    condition: "A non-rejected Candidacy already exists for the same cycle and candidate"
  - id: ERR_DUPLICATE_SUBMISSION
    http: 409
    condition: "The elector already has a COUNTED or INVALIDATED submission on this ballot"
  - id: ERR_DUPLICATE_CONFIGURATION
    http: 409
    condition: "bloc_code, case_code, (category, pathway) or (sport_code, cycle_year) already exists"
  - id: ERR_INFO_REQUEST_LIMIT
    http: 409
    condition: "Candidacy.info_request_count has reached MAX_INFO_REQUESTS"
  - id: ERR_BLOC_SEATS_EXHAUSTED
    http: 409
    condition: "VoterBloc.seats_filled has reached seat_cap"
  - id: ERR_NO_SLATE_AVAILABLE
    http: 409
    condition: "Ballot construction found no ADVANCED candidacy for a first round, no slot carried to the runoff for a runoff round, and no ON_BALLOT candidacy when replacing an EXPIRED ballot"
  - id: ERR_MAX_VOTES_EXCEEDED
    http: 422
    condition: "len(selected_slot_ids) exceeds Ballot.max_votes_per_elector, or the empty selection does not match is_abstention"
  - id: ERR_NO_BALLOTS_CAST
    http: 409
    condition: "Tabulation attempted on a ballot with ballots_cast == 0"
  - id: ERR_BLOC_QUORUM_NOT_MET
    http: 409
    condition: "A seated voter bloc's participation on this ballot is below its min_participation_pct at audit certification"
  - id: ERR_CASE_CAPACITY_EXCEEDED
    http: 409
    condition: "artifacts_installed + artifact_count would exceed ExhibitCase.capacity_artifacts"
  - id: ERR_ESCORT_POOL_EXHAUSTED
    http: 409
    condition: "Approving the grant would push escort occupation above InductionCycle.escort_pool_size somewhere inside the closed escort interval"
  - id: ERR_INDUCTIONS_NOT_READY
    http: 409
    condition: "ceremony_ready_count is below induction_count when the ceremony is held"
  # ---- temporal ----
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "opens_at >= closes_at on ballot construction, ceremony_date at or before the logical clock, or display_starts_on >= display_ends_on on an installation"
  - id: ERR_VOTING_WINDOW_CLOSED
    http: 409
    condition: "A submission is cast or withdrawn at or after Ballot.closes_at"
  - id: ERR_INVALID_ESCORT_INTERVAL
    http: 422
    condition: "A POSTHUMOUS_DELEGATION grant omits escort_from or escort_to, or escort_from is after escort_to"
  - id: ERR_CASE_WINDOW_CONFLICT
    http: 409
    condition: "The requested display window overlaps an INSTALLED window of the same case, or falls inside another induction's changeover buffer"
  - id: ERR_CEREMONY_DATE_NOT_REACHED
    http: 409
    condition: "The ceremony is held before InductionCycle.ceremony_date"
  # ---- referential and fiscal ----
  - id: ERR_SLOT_NOT_ON_BALLOT
    http: 422
    condition: "A selected slot id does not belong to the ballot named in ballot_id"
  - id: ERR_SLOT_STRUCK
    http: 409
    condition: "A selected slot has status == STRUCK"
  - id: ERR_INDUCTION_CYCLE_MISMATCH
    http: 422
    condition: "The named induction does not belong to the cycle whose version and budget the write targets - on POST /travel-grants a supplied cycle_id differs from Induction.cycle_id"
  - id: ERR_ARTIFACTS_NOT_RECEIVED
    http: 409
    condition: "An exhibit installation is requested while Induction.artifact_status is AWAITED or EXEMPT"
  - id: ERR_TRAVEL_BUDGET_EXCEEDED
    http: 409
    condition: "award_cents exceeds travel_budget_cents - travel_committed_cents at creation or at approval"

roles:
  - name: ElectionAdministrator
    description: "Hall of fame staff who run the cycle: configuration, credentialing, ballot construction, tabulation, election certification, ceremony planning and travel funding"
    identity: opaque
    exclusive_operations:
      - "POST /induction-cycles and every /induction-cycles/{id} lifecycle action (open-nominations, close-nominations, certify-election, ceremony, hold-ceremony)"
      - "POST /eligibility-rules, POST /voter-blocs"
      - "POST /candidates, PATCH /candidates/{id}, POST /candidates/{id}/permanent-ineligibility"
      - "POST /electors and every /electors/{id} credential action (credential, suspend, reinstate)"
      - "POST /ballots, POST /ballots/{id}/certify, POST /ballots/{id}/close, POST /ballots/{id}/tally"
      - "POST /travel-grants/{id}/approve, POST /travel-grants/{id}/deny, POST /travel-grants/{id}/cancel"
    shared_operations:
      - "POST /candidacies (may file on behalf of a credentialed elector)"
      - "POST /travel-grants (with CuratorialStaff)"
      - "POST /exhibit-cases (with CuratorialStaff)"
      - "every GET endpoint, and POST /_clock/set_current_utc"
  - name: ScreeningCommitteeMember
    description: "A credentialed elector serving on the screening committee; builds the ballot by advancing, rejecting, deferring or querying nominations, and votes like any other elector"
    identity: "entity_backed:Elector"
    exclusive_operations:
      - "POST /candidacies/{id}/screening-decisions"
    shared_operations:
      - "POST /vote-submissions, POST /vote-submissions/{id}/withdraw (with Elector)"
      - "GET /induction-cycles, /candidates, /candidacies, /ballots, /ballot-slots, /electors/{id}, /eligibility-rules, /inductions, and POST /_clock/set_current_utc"
  - name: Elector
    description: "A credentialed member of the voting body; files nominations, answers information requests and casts confidential ballots"
    identity: "entity_backed:Elector"
    exclusive_operations:
      - "POST /candidacies/{id}/supplements"
    shared_operations:
      - "POST /candidacies (with ElectionAdministrator)"
      - "POST /vote-submissions, POST /vote-submissions/{id}/withdraw (with ScreeningCommitteeMember)"
      - "GET /induction-cycles, /candidates, /candidacies, /ballots, /ballot-slots, /vote-submissions, /inductions, /eligibility-rules, /electors/{id}, and POST /_clock/set_current_utc"
  - name: IndependentAuditor
    description: "External auditor with sole authority to certify or reject a draft tally and the only role that may read individual ballot selections"
    identity: opaque
    exclusive_operations:
      - "POST /ballots/{id}/audit-decision"
      - "reading VoteSubmission.selected_slot_ids as a non-null array on GET /vote-submissions and GET /vote-submissions/{id}"
    shared_operations:
      - "every GET endpoint, and POST /_clock/set_current_utc"
  - name: CuratorialStaff
    description: "Museum curators who take in artifacts, plan display cases and request inductee travel"
    identity: opaque
    exclusive_operations:
      - "POST /inductions/{id}/artifact-intake"
      - "POST /exhibit-installations, POST /exhibit-installations/{id}/withdraw"
    shared_operations:
      - "POST /exhibit-cases (with ElectionAdministrator)"
      - "POST /travel-grants (with ElectionAdministrator)"
      - "GET /induction-cycles, /candidates, /candidacies, /ballots, /ballot-slots, /inductions, /travel-grants, /exhibit-cases, /exhibit-installations, and POST /_clock/set_current_utc"
