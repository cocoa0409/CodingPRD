scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rest_compliance_scheduled_vs_irregular_variants
        grounds:
          - calculations.rest_compliance
          - entities.CrewLayoverRequirement.fields.rest_compliant
          - entities.CrewLayoverRequirement.fields.is_irregular_ops
        distinguishing_aspect: |
          Dual-variant rest math on the CrewLayoverRequirement domain: with identical stored
          arrival/departure fields, the scheduled variant marks the layover rest_compliant=true
          while the irregular_ops variant (arrival clamped to the logical clock) marks
          rest_compliant=false — different results for identical input fields.
        test_recipe:
          setup:
            - "Station DFW with min_rest_hours 10, transport_time_minutes 30"
            - "UnionAgreement for PILOT with min_rest_hours 10, quiet_room_required false, min_room_standard STANDARD, blackout_protection_required false, max_invoice_variance_pct 10.0"
            - "logical clock left at the server default 2026-09-01T00:00:00Z (before all fixture times)"
            - "layover A: is_irregular_ops false, arrival 2026-06-01T10:00:00Z, departure 2026-06-01T23:00:00Z, required_rest_hours 10 (scheduled variant: layover_hours 13, transport 1.0, effective 12.0 >= 10 -> compliant)"
            - "layover B: is_irregular_ops true, identical stored arrival/departure fields (irregular_ops variant clamps the past arrival to the clock 2026-09-01T00:00:00Z, which is after the stored departure 2026-06-01T23:00:00Z, so layover_hours floors below 0 and effective rest < 10 -> non-compliant)"
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "DFW", name: "Dallas Fort Worth", timezone: "America/Chicago", min_rest_hours: 10, transport_time_minutes: 30, room_availability_commitment: 40 }
              as: PlatformAdmin
              captures: { st_dfw: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "APA-2026", crew_type: "PILOT", min_rest_hours: 10, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_dfw}", crew_type: "PILOT", crew_count: 4, arrival_time: "2026-06-01T10:00:00Z", departure_time: "2026-06-01T23:00:00Z", required_rest_hours: 10, is_irregular_ops: false }
              as: CrewOps
              captures: { lay_sched: $.data.id }
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_dfw}", crew_type: "PILOT", crew_count: 4, arrival_time: "2026-06-01T10:00:00Z", departure_time: "2026-06-01T23:00:00Z", required_rest_hours: 10, is_irregular_ops: true }
              as: CrewOps
              captures: { lay_iro: $.data.id }
          trigger:
            - call: "GET /layover-requirements/${lay_sched}"
              payload: {}
              as: CrewOps
              captures: { lay_sched_compliant: $.data.rest_compliant }
            - call: "GET /layover-requirements/${lay_iro}"
              payload: {}
              as: CrewOps
              captures: { lay_iro_compliant: $.data.rest_compliant }
          assert:
            - "CrewLayoverRequirement.${lay_sched}.rest_compliant == true"
            - "CrewLayoverRequirement.${lay_iro}.rest_compliant == false"
            - "identical arrival_time and departure_time fields produce different rest_compliant across variants"
      - name: invoice_variance_percent_of_reconciled_vs_billed
        grounds:
          - calculations.invoice_variance
          - entities.Invoice.fields.variance_pct
        distinguishing_aspect: |
          Dual-variant variance math on the Invoice domain: the approval-gating variant divides
          by reconciled_amount_cents (yields 60.0 on the pinned data and blocks approval at a
          10.0 union cap), while the percent_of_billed reporting variant divides by
          billed_amount_cents (yields 37.5) — same inputs, different denominators, and only the
          reconciled-based variant may drive approval.
        test_recipe:
          setup:
            - "Awarded ACTIVE contract C at DFW: negotiated_rate_cents 10000, room_block_size 10, dates 2026-06-01..2026-06-11, late_cancel_hours 24, no blackout dates"
            - "layover L booked against C for stay_date 2026-06-03 with crew_count 4, allocation confirmed and checked in on 2026-06-03"
            - "second layover L2 booked against C for stay_date 2026-06-04 with crew_count 4, allocation confirmed and checked in on 2026-06-04"
            - "third layover L3 booked against C for stay_date 2026-06-05 with crew_count 4, allocation confirmed, then layover cancelled at 2026-06-04T12:00:00Z (within 24h of stay -> late-cancel charge 0.5 * 40000 = 20000)"
            - "invoice INV for period 2026-06-01..2026-06-30 with billed_room_nights 16, billed_amount_cents 160000; reconciled to 8 nights / 100000 cents"
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "DFW", name: "Dallas Fort Worth", timezone: "America/Chicago", min_rest_hours: 10, transport_time_minutes: 30, room_availability_commitment: 40 }
              as: PlatformAdmin
              captures: { st_dfw: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "APA-2026", crew_type: "PILOT", min_rest_hours: 10, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
            - call: "POST /hotel-vendors"
              payload: { name: "DFW Airport Hotel LLC", contact_email: "ops@dfwhotel.example", security_certified: true, quiet_rooms_count: 50 }
              as: PlatformAdmin
              captures: { vend_h: $.data.id }
            - call: "POST /rfp-cycles"
              payload: { station_id: "${st_dfw}", title: "DFW 2026 crew hotel", response_deadline: "2026-09-10T00:00:00Z", target_room_count: 10, budget_cap_cents: 2000000 }
              as: SourcingManager
              captures: { cyc_c: $.data.id }
            - call: "POST /rfp-cycles/${cyc_c}/open"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_c}/proposals"
              payload: { vendor_id: "${vend_h}", offered_room_count: 10, offered_rate_cents: 10000, quiet_room_commitment: 10 }
              as: HotelVendorRep
              as_user_id: "${vend_h}"
              captures: { prop_p: $.data.id }
            - call: "POST /rfp-cycles/${cyc_c}/close"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-proposals/${prop_p}/shortlist"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_c}/open-negotiation"
              payload: {}
              as: SourcingManager
            - call: "GET /rfp-cycles/${cyc_c}"
              payload: {}
              as: SourcingManager
              captures: { cyc_c_v: $.data.version }
            - call: "POST /rfp-cycles/${cyc_c}/award"
              payload: { proposal_id: "${prop_p}", room_block_size: 10, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-11T00:00:00Z", late_cancel_hours: 24, quiet_room_standard: "ENHANCED", security_requirements: ["KEYCARD_FLOOR"], blackout_dates: [], blackout_protection: false, expected_cycle_version: "${cyc_c_v}" }
              as: SourcingManager
              captures: { ctr_c: $.data.id }
            - call: "POST /contracts/${ctr_c}/activate"
              payload: {}
              as: SourcingManager
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_dfw}", crew_type: "PILOT", crew_count: 4, arrival_time: "2026-06-03T10:00:00Z", departure_time: "2026-06-03T23:00:00Z", required_rest_hours: 10 }
              as: CrewOps
              captures: { lay_1: $.data.id, lay_1_v: $.data.version }
            - call: "POST /layover-requirements/${lay_1}/book"
              payload: { contract_id: "${ctr_c}", stay_date: "2026-06-03T00:00:00Z", expected_layover_version: "${lay_1_v}" }
              as: CrewOps
              captures: { al_1: $.data.id }
            - call: "POST /allocations/${al_1}/confirm"
              payload: {}
              as: CrewOps
            - call: "POST /allocations/${al_1}/check-in"
              payload: {}
              as: HotelVendorRep
              as_user_id: "${vend_h}"
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_dfw}", crew_type: "PILOT", crew_count: 4, arrival_time: "2026-06-04T10:00:00Z", departure_time: "2026-06-04T23:00:00Z", required_rest_hours: 10 }
              as: CrewOps
              captures: { lay_2: $.data.id, lay_2_v: $.data.version }
            - call: "POST /layover-requirements/${lay_2}/book"
              payload: { contract_id: "${ctr_c}", stay_date: "2026-06-04T00:00:00Z", expected_layover_version: "${lay_2_v}" }
              as: CrewOps
              captures: { al_2: $.data.id }
            - call: "POST /allocations/${al_2}/confirm"
              payload: {}
              as: CrewOps
            - call: "POST /allocations/${al_2}/check-in"
              payload: {}
              as: HotelVendorRep
              as_user_id: "${vend_h}"
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_dfw}", crew_type: "PILOT", crew_count: 4, arrival_time: "2026-06-05T10:00:00Z", departure_time: "2026-06-05T23:00:00Z", required_rest_hours: 10 }
              as: CrewOps
              captures: { lay_3: $.data.id, lay_3_v: $.data.version }
            - call: "POST /layover-requirements/${lay_3}/book"
              payload: { contract_id: "${ctr_c}", stay_date: "2026-06-05T00:00:00Z", expected_layover_version: "${lay_3_v}" }
              as: CrewOps
              captures: { al_3: $.data.id }
            - call: "POST /allocations/${al_3}/confirm"
              payload: {}
              as: CrewOps
            - call: "POST /layover-requirements/${lay_3}/cancel"
              payload: {}
              as: CrewOps
            - call: "POST /invoices"
              payload: { contract_id: "${ctr_c}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-06-30T00:00:00Z", billed_room_nights: 16, billed_amount_cents: 160000 }
              as: HotelVendorRep
              as_user_id: "${vend_h}"
              captures: { inv_i: $.data.id }
            - call: "POST /invoices/${inv_i}/reconcile"
              payload: {}
              as: FinanceAnalyst
          trigger:
            - call: "POST /invoices/${inv_i}/approve"
              payload: {}
              as: FinanceAnalyst
              captures: { approve_err: $.data.error_id }
          assert:
            - "Invoice.${inv_i}.reconciled_room_nights == 8"
            - "Invoice.${inv_i}.reconciled_amount_cents == 100000"
            - "Invoice.${inv_i}.variance_pct == 60.0 (percent_of_reconciled gating variant)"
            - "approve is rejected with ERR_INVOICE_VARIANCE_EXCEEDED because 60.0 > 10.0, even though the percent_of_billed reporting variant would read 37.5"
  - rule_id: combinatorial_formula
    instances:
      - name: distressed_cost_tiered_surge_multiplier
        grounds:
          - calculations.distressed_cost
          - entities.RoomAllocation.fields.distressed_cost_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: distressed_cost combines nightly_rate_cents x rooms_held with a
          three-band surge multiplier selected by the count of pre-existing DISTRESSED allocations
          on the same stay_date — with exactly 7 pre-existing distressed allocations the tier is
          1.50 and the pinned inputs 12000 x 8 x 1.50 yield 144000, whereas the same inputs at a
          surge count of 5 or fewer would use 1.25 and yield 120000.
        test_recipe:
          setup:
            - "Station ORD (min_rest_hours 8, transport_time_minutes 45), union FLIGHT_ATTENDANT min_rest_hours 8"
            - "vendor H1 ACTIVE holding an ACTIVE contract K1 at ORD (rate 9000, block 20, no blackouts)"
            - "seven layovers S1..S7 each booked against K1 for stay_date 2026-06-02, allocation confirmed, then released (each layover CONFIRMED -> SURGED), then distressed-booked to vendor H2 at rate 9000 and confirmed — 7 DISTRESSED CONFIRMED allocations exist for 2026-06-02"
            - "layover S8 booked against K1 for 2026-06-02, confirmed, released to SURGED, distressed-booked to H2 at rate 12000 with crew_count 8 — still HELD"
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "ORD", name: "Chicago O'Hare", timezone: "America/Chicago", min_rest_hours: 8, transport_time_minutes: 45, room_availability_commitment: 60 }
              as: PlatformAdmin
              captures: { st_ord: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "AFA-2026", crew_type: "FLIGHT_ATTENDANT", min_rest_hours: 8, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
            - call: "POST /hotel-vendors"
