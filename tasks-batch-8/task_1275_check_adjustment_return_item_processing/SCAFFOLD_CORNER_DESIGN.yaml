              as: ItemProcessor
              captures: { elig: $.data.re_presentment_eligible }
          trigger:
            - call: "POST /bank/check-items/${item_id}/represent"
              as: ItemProcessor
              captures: { err: $.data.error_id }
          assert:
            - "elig == false"
            - "err == 'ERR_RE_PRESENTMENT_NOT_ELIGIBLE'"
      - name: extend_hold_requires_later_until
        claim_type: violation_to_error
        grounds: [state_machines.HoldDecision.PENDING_to_DECIDED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "EXTEND_HOLD with extend_until earlier than the current hold_until (2026-05-05) is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["large item UNDER_REVIEW with auto hold hold_until 2026-05-05T00:00:00Z"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB EH", routing_number: "222000035" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Vera", account_number: "A-2027" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-EH", amount_cents: 600000, encoded_amount_cents: 600000, image_quality_score: 90, capture_channel: "BRANCH" }
