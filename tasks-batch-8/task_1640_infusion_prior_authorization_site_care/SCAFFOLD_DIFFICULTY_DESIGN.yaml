            - { call: "POST /infusion/benefit-investigations/${bi_xb}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_xb}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_xb: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_xb}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_xb}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
