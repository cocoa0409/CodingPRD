        grounds:
          - errors.ERR_SUBJECT_COMPANY_NOT_FOUND
          - errors.ERR_INVESTIGATION_NOT_FOUND
          - errors.ERR_JUDGMENT_NOT_FOUND
          - errors.ERR_REDRESS_FUND_NOT_FOUND
          - errors.ERR_CLAIM_NOT_FOUND
          - errors.ERR_CLAIMANT_NOT_FOUND
        distinguishing_aspect: "Each single-resource GET (and the claimant body-FK on claim creation) maps an unallocated id to its OWN 404 code — six distinct error_ids, never a generic 404."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
