  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      # -------- pair: concurrency (p7) beats state (p8) --------
      - name: priority_pair_concurrency_p7_beats_state_p8_stale_investigation_version
        grounds:
          - concurrency_rules[adjustment-create-stale-investigation]
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_STALE_INVESTIGATION_VERSION]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - endpoints[POST /leak-adjustments]
        distinguishing_aspect: |
          PAIR: category concurrency at priority 7 versus category state at priority 8, on
          POST /leak-adjustments. Both are violated by the same single request: the supplied
          expected_investigation_version is the version observed at creation (1) while the
          investigation has since advanced to 2, AND the investigation sits in EVIDENCE_REQUESTED
          rather than DETERMINED. The response must be ERR_STALE_INVESTIGATION_VERSION with HTTP
          412, never ERR_INVALID_STATE_TRANSITION with HTTP 409, and no LeakAdjustment row is
          created. Sending the CURRENT version on the same investigation flips the answer to the
          409, which proves the ordering rather than merely observing one error.
        test_recipe:
          setup:
            - "The full ACC-1001 fixture is in place with four ISSUED bills; the 2026-07 bill has seasonal_baseline_gallons 4000."
            - "An investigation is opened on the 2026-07 bill and its version 1 is captured before any further write."
            - "request-evidence is then called once, advancing the investigation to EVIDENCE_REQUESTED and its version to 2, and the fresh version is also captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
