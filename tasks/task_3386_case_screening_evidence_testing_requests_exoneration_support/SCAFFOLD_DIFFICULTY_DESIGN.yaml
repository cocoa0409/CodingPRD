          trigger:
            - call: "POST /lab-analyses"
              payload: { evidence_item_id: "${item_id}", authorization_id: "${ta_id}", lab_name: "LabPrime", test_type: "DNA_YSTR", required_sample_ng: 11, scheduled_start: "2026-10-10T17:00:00Z", scheduled_end: "2026-10-15T17:00:00Z" }
