    roles: [UtilityAdmin, ComplianceOfficer, Regulator, Hydrogeologist, StatisticalReviewer]
    code: 200
    input: ["sampling_event_id?", "well_id?", "parameter_code?", "detection_flag?", "limit?", "offset?"]
    output: AnalyticalResult[]
