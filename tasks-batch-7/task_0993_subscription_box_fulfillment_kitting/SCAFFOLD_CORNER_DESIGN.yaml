  - section: rbac
    instances:
      - name: warehouse_ops_cannot_create_box_plan
        claim_type: role_exclusive_denied
        grounds:
          - roles.WarehouseOps
          - "endpoints.POST_/box-plans"
        distinguishing_aspect: "BoxPlan creation is exclusive to ClientOps/PlatformAdmin; WarehouseOps gets ERR_FORBIDDEN (403) even with a well-formed payload."
        test_recipe:
          setup: ["client exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "RB1 Client", billing_email: "rb1@acme.test" }
              as: PlatformAdmin
              captures: { rb1_cl: $.data.id }
          trigger:
            - call: "POST /box-plans"
              payload: { client_id: "${rb1_cl}", name: "RB1 Box", sku: "PL-RB1", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: WarehouseOps
              captures: { rb1_err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (${rb1_err}) with HTTP 403; no plan persisted"

      - name: client_ops_cannot_finalize_statement
        claim_type: role_exclusive_denied
        grounds:
          - roles.BillingAdmin
          - "endpoints.POST_/billing-statements/{id}/finalize"
        distinguishing_aspect: "Statement finalize is BillingAdmin-exclusive; the owning ClientOps (who may dispute) is still forbidden from finalizing."
        test_recipe:
          setup: ["client RB2 wallet 100000; component 10 qty 1; plan ACTIVE; 1 subscriber; run 2026-05 LOCKED -> KITTED actual 1; statement PROVISIONAL exists; clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "RB2 Client", billing_email: "rb2@acme.test" }
              as: PlatformAdmin
              captures: { rb2_cl: $.data.id }
            - { call: "POST /clients/${rb2_cl}/credit-adjustments", payload: { amount_cents: 100000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-RB2", name: "RB2 widget", unit_cost_cents: 10 }
              as: WarehouseOps
              captures: { rb2_cp: $.data.id, rb2_cp_v: $.data.version }
            - { call: "POST /components/${rb2_cp}/receipts", payload: { quantity: 10, expected_component_version: "${rb2_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${rb2_cl}", name: "RB2 Box", sku: "PL-RB2", price_per_box_cents: 1000, shipping_weight_grams: 800 }
              as: ClientOps
              as_user_id: "${rb2_cl}"
              captures: { rb2_pl: $.data.id, rb2_pl_v: $.data.version }
            - call: "POST /box-plans/${rb2_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${rb2_pl_v}" }
              as: ClientOps
              as_user_id: "${rb2_cl}"
              captures: { rb2_rv: $.data.id }
            - call: "PUT /kit-revisions/${rb2_rv}/bom-lines"
              payload: { lines: [{ component_id: "${rb2_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${rb2_cl}"
            - { call: "POST /kit-revisions/${rb2_rv}/approve", as: ClientOps, as_user_id: "${rb2_cl}" }
            - { call: "POST /box-plans/${rb2_pl}/activate", as: ClientOps, as_user_id: "${rb2_cl}" }
            - call: "POST /box-plans/${rb2_pl}/import-batches"
              payload: { rows: [{ email: "rb2@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${rb2_cl}"
              captures: { rb2_ib: $.data.id }
            - { call: "POST /import-batches/${rb2_ib}/commit", as: ClientOps, as_user_id: "${rb2_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${rb2_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { rb2_rn: $.data.id }
            - { call: "POST /assembly-runs/${rb2_rn}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${rb2_rn}/start-kitting", as: WarehouseOps }
            - { call: "POST /assembly-runs/${rb2_rn}/complete-kitting", payload: { actual_kitted_count: 1 }, as: WarehouseOps }
            - call: "GET /clients/${rb2_cl}/billing-statements"
              as: BillingAdmin
              captures: { rb2_st: "$.data[0].id" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /billing-statements/${rb2_st}/finalize"
              as: ClientOps
              as_user_id: "${rb2_cl}"
              captures: { rb2_err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (${rb2_err}) with HTTP 403; statement remains PROVISIONAL"

      - name: client_ops_cannot_touch_other_clients_plan
        claim_type: role_exclusive_denied
        grounds:
          - roles.ClientOps
          - validations[priority=2]
        distinguishing_aspect: "entity_backed identity: ClientOps of client A reading client B's plan is ERR_FORBIDDEN even though the plan exists and the role can read plans generally."
        test_recipe:
          setup: ["clients A and B; plan PL-RB3 belongs to client B"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
