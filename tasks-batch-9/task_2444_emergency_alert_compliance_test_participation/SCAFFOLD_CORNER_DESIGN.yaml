      - name: score_clamps_at_zero_instead_of_going_negative
        claim_type: precision
        grounds:
          - "§1.3 calculations.station_compliance_score formula 'compliance_score = round(max(0.00, BASE_SCORE - d1 - d2 - d3 - d4), 2)'"
          - "§1.3 constants BASE_SCORE 100.00, MISSING_SOURCE_DEDUCTION 25.00, REVALIDATION_DEDUCTION 15.00, WATCH_MIN_SCORE 75.00"
          - "§1.2 state_machines.StatePlan ACTIVE -> SUPERSEDED hop 2: 'every Station with state_plan_id == this plan sets plan_revalidation_required = true and re-runs calculations.station_compliance_score'"
        distinguishing_aspect: "Four uncovered required sources already exhaust the base score exactly (100.00 - 100.00 = 0.00); the plan-supersede flag then adds a further 15.00 of deduction and the response still reads 0.00, so the max(0.00, ...) clamp is the only thing keeping the field non-negative."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan1 KS 2026-R1 requiring ['PEP', 'SATELLITE', 'LP1', 'LP2'] (required_source_count 4) activated; station KWEA with no devices and no assignments."
            - "run-log-review gives d1 = 4 * 25.00 = 100.00, d2 = d3 = d4 = 0 -> 0.00 exactly."
            - "plan2 KS 2026-R2 activated -> hop 1 supersedes plan1 -> hop 2 sets plan_revalidation_required = true on KWEA (its state_plan_id still points at plan1, so required_source_count stays 4) and recomputes: 100.00 - 100.00 - 15.00 = -15.00 -> clamped to 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP", "SATELLITE", "LP1", "LP2"], mandatory_relay_event_codes: [] }
              captures: { plan1: "$.data.id" }
            - call: "POST /state-plans/${plan1}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan1}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /stations/${station_id}/run-log-review"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R2", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan2: "$.data.id" }
          trigger:
            - call: "POST /state-plans/${plan2}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "GET /state-plans/${plan1}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "after run-log-review: compliance_score == 0.00 (not null) with posture SUSPENDED_FILINGS and last_log_review_at == '2026-08-01T00:00:00Z'"
            - "plan1.status == 'SUPERSEDED' with superseded_at == '2026-08-01T00:00:00Z' and plan2.status == 'ACTIVE'"
            - "compliance-summary.plan_revalidation_required == true and required_source_count == 4 — the station still references plan1, activation does not repoint it"
            - "compliance_score == 0.00 after the recompute: the unclamped arithmetic is 100.00 - 100.00 - 15.00 == -15.00"
            - "posture is still SUSPENDED_FILINGS and unfiled_test_count == 0"

      - name: decommissioned_device_leaves_the_readiness_denominator
        claim_type: input_set_filtering
        grounds:
          - "§1.3 calculations.test_event_readiness_score input_set 'countable_device_count = EASDevice rows with this station_id and status IN {REGISTERED, READY, FAILED} (DECOMMISSIONED devices leave the denominator)'"
          - "§1.3 formula 'ready_device_ratio = ready_device_count / max(1, countable_device_count)' with READY_DEVICE_WEIGHT 40, SOURCE_COVERAGE_WEIGHT 40, RECENT_ALERT_WEIGHT 20, READINESS_PASS_MIN 80.00"
          - "§1.5 POST /eas-devices/{id}/decommission side effect 'device leaves the readiness denominator'"
        distinguishing_aspect: "The same station re-evaluates from 60.00 (READINESS_PENDING) to exactly 80.00 (READY) without any device becoming READY — only the never-checked REGISTERED device leaving the denominator changes the ratio from 1/2 to 1/1."
