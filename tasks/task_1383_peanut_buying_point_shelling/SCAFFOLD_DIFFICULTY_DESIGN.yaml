              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: 8.0, discount_cents_per_ton: 0 }, { up_to_pct: 10.49, discount_cents_per_ton: 250 }, { up_to_pct: 12.0, discount_cents_per_ton: 700 }, { up_to_pct: 15.0, discount_cents_per_ton: 1500 }, { up_to_pct: null, discount_cents_per_ton: 3000 } ], foreign_material_tiers: [ { up_to_pct: 4.0, discount_cents_per_ton: 0 }, { up_to_pct: 7.0, discount_cents_per_ton: 400 }, { up_to_pct: 10.0, discount_cents_per_ton: 1000 }, { up_to_pct: null, discount_cents_per_ton: 2000 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - { call: "POST /buying-points/quota-histories", payload: { grower_id: "${g1}", crop_year: 2026, quota_tons: 100 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/warehouses"
              payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }
              as: BuyingPointAdmin
              captures: { whg: $.data.id }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { la_v: $.data.version }
            - call: "POST /buying-points/loads/${loadA}/grade-sheets"
              payload: { moisture_pct: 9.2, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${la_v}" }
              as: GradingInspector
