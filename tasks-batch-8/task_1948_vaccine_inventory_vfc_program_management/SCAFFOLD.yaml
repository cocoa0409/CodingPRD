# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or syntactically invalid"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not permitted for this endpoint per §1.5"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced id does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, type mismatch, value out of range (e.g., quantity < 1)"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource's current state does not permit the requested transition"

  - id: ERR_STORAGE_UNIT_QUARANTINED
    http: 409
    condition: "Storage unit has an active excursion; blocking dose administration, allocation receipt, transfer receive"

  - id: ERR_LOT_NOT_AVAILABLE
    http: 409
    condition: "Lot is not AVAILABLE (QUARANTINED / EXPIRED / DEPLETED / WASTED_CLOSED)"

  - id: ERR_LOT_EXPIRED
    http: 409
    condition: "administration_date > lot.expires_on"

  - id: ERR_STOCK_ELIGIBILITY_MISMATCH
    http: 422
    condition: "Lot stock_type incompatible with screening outcome and no covering OPEN BorrowTicket"

  - id: ERR_SCREENING_MISMATCH
    http: 422
    condition: "Screening belongs to a different patient or screening_date != administration_date"

  - id: ERR_PATIENT_NOT_VFC_ELIGIBLE_AGE
    http: 422
    condition: "Patient is 19 or older on administration_date; cannot draw from PUBLIC_VFC lot"

  - id: ERR_UNIT_SITE_MISMATCH
    http: 422
    condition: "Storage unit does not belong to the referenced provider site"

  - id: ERR_INSUFFICIENT_STOCK
    http: 422
    condition: "Lot quantity_on_hand < requested doses"

  - id: ERR_SAME_STOCK_BORROW
    http: 422
    condition: "BorrowTicket direction inconsistent with from_lot/to_lot stock_types, or both lots share the same stock_type"

  - id: ERR_PAYBACK_EXCEEDS_BORROWED
    http: 422
    condition: "paid_back_quantity + payback_quantity > borrowed_quantity"

  - id: ERR_TICKET_HAS_PAYBACK
    http: 409
    condition: "Attempted to void a ticket that already has paid_back_quantity > 0"

  - id: ERR_BORROWED_DOSES_CONSUMED
    http: 409
    condition: "Attempted to void a ticket but to_lot.quantity_borrowed_in < borrowed_quantity (doses already used)"

  - id: ERR_OVER_RECEIPT
    http: 422
    condition: "AllocationReceipt would push OrderLine.received_doses above approved_doses"

  - id: ERR_ALLOCATION_MISMATCH
    http: 422
    condition: "Sum of OrderLine.approved_doses != VaccineOrder.approved_vfc_doses at approval time"

  - id: ERR_LINE_ALLOCATION_MISSING
    http: 422
    condition: "At least one OrderLine lacks approved_doses at approval time"

  - id: ERR_SITE_SUSPENDED_ORDERING
    http: 409
    condition: "Site is in SUSPENDED_ORDERING; order submission forbidden"

  - id: ERR_ACCOUNTABILITY_GAP_UNRESOLVED
    http: 422
    condition: "audit accountability_gap != on_hand_public_total at close-pass"

  - id: ERR_OPEN_EXCURSION_EXISTS
    http: 409
    condition: "An OPEN or UNDER_REVIEW TemperatureExcursion blocks the requested lifecycle operation"

  - id: ERR_OPEN_BORROW_TICKET_EXISTS
    http: 409
    condition: "An OPEN or PARTIALLY_REPAID BorrowTicket blocks the requested lifecycle operation"

  - id: ERR_OPEN_AUDIT_EXISTS
    http: 409
    condition: "A SCHEDULED or IN_PROGRESS SiteVisitAudit blocks site termination"

  - id: ERR_EXCURSION_STILL_OPEN
    http: 409
    condition: "begin-review requires an in-range reading to have closed the excursion first"

  - id: ERR_EMPTY_ORDER
    http: 422
    condition: "Order submission requires at least one OrderLine"

  - id: ERR_INVALID_ENUM
    http: 400
    condition: "Enum field carries a value outside its declared constraint set"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VaccineManager
    description: "Site-level operator: manages storage units, lots, patients, screenings, dose administration, orders, borrow tickets, transfers; records temperature readings"
    identity: opaque
    exclusive_operations:
      - "POST /provider-sites/{id}/storage-units"
      - "POST /storage-units/{id}/temperature-readings"
      - "POST /storage-units/{id}/excursions/{excursionId}/begin-review"
      - "POST /storage-units/{id}/excursions/{excursionId}/resolve-viable"
      - "POST /storage-units/{id}/excursions/{excursionId}/resolve-wasted"
      - "POST /provider-sites/{id}/lots"
      - "POST /provider-sites/{id}/patients"
      - "POST /patients/{id}/eligibility-screenings"
      - "POST /provider-sites/{id}/dose-administrations"
      - "POST /provider-sites/{id}/dose-administrations/{doseId}/submit-registry"
      - "POST /provider-sites/{id}/dose-administrations/{doseId}/mark-registry-rejected"
      - "POST /provider-sites/{id}/dose-administrations/{doseId}/reset-registry"
      - "POST /provider-sites/{id}/vaccine-orders"
      - "POST /provider-sites/{id}/vaccine-orders/{orderId}/lines"
      - "POST /provider-sites/{id}/vaccine-orders/{orderId}/submit"
      - "POST /provider-sites/{id}/vaccine-orders/{orderId}/cancel"
      - "POST /provider-sites/{id}/vaccine-orders/{orderId}/allocation-receipts"
      - "POST /provider-sites/{id}/borrow-tickets"
      - "POST /provider-sites/{id}/borrow-tickets/{ticketId}/record-payback"
      - "POST /provider-sites/{id}/borrow-tickets/{ticketId}/void"
      - "POST /provider-sites/{id}/short-date-transfers"
      - "POST /provider-sites/{id}/short-date-transfers/{transferId}/ship"
      - "POST /provider-sites/{id}/short-date-transfers/{transferId}/receive"
      - "POST /provider-sites/{id}/short-date-transfers/{transferId}/cancel"
    shared_operations:
      - "GET endpoints per §1.5"

  - name: StateProgramOfficer
    description: "State VFC program official; approves orders and allocates doses"
    identity: opaque
    exclusive_operations:
      - "POST /provider-sites/{id}/vaccine-orders/{orderId}/approve"
    shared_operations:
      - "GET endpoints per §1.5"

  - name: ComplianceAuditor
    description: "State/federal compliance auditor; manages sites, runs audits, advances logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /provider-sites"
      - "POST /provider-sites/{id}/suspend-ordering"
      - "POST /provider-sites/{id}/reinstate-ordering"
      - "POST /provider-sites/{id}/terminate"
      - "POST /vaccine-products"
      - "POST /provider-sites/{id}/site-visit-audits"
      - "POST /provider-sites/{id}/site-visit-audits/{auditId}/begin"
      - "POST /provider-sites/{id}/site-visit-audits/{auditId}/issue-findings"
      - "POST /provider-sites/{id}/site-visit-audits/{auditId}/close-pass"
      - "POST /provider-sites/{id}/site-visit-audits/{auditId}/close-fail"
      - "POST /provider-sites/{id}/site-visit-audits/{auditId}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints per §1.5"
