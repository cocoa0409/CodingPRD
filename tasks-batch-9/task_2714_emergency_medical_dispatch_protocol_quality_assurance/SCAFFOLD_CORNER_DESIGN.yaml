            - "GET /reviews/${r1_id} shows status SELECTED with provisional_composite_score null (the UPHELD effect stands) and rebuttal_round_count still 1"
            - "Review.version did not advance on the refused call"

      - name: certifying_a_dispatcher_advances_the_rollout_training_counters
        claim_type: cross_entity
        grounds:
          - state_machines.Dispatcher.PROVISIONAL_to_CERTIFIED.side_effects
          - state_machines.ProtocolRollout.TRAINING_NOT_STARTED_to_TRAINING_IN_PROGRESS
          - calculations.rollout_training_rollup
        distinguishing_aspect: "One certification write must move a second entity: the rollout's trained_dispatcher_count and training_status are recomputed from the Dispatcher table, and the intermediate IN_PROGRESS rung must appear at 1 of 2 before COMPLETE appears at 2 of 2, with golive_status untouched throughout."
        test_recipe:
          setup:
            - "An APPROVED version with a rollout whose target_dispatcher_count is 2, and two PROVISIONAL dispatchers."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-14.0", effective_from: "2026-09-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /protocol-versions/${pv_id}/rollouts"
              payload: { scheduled_golive_at: "2026-09-01T00:00:00Z", target_dispatcher_count: 2, required_training_hours: 4.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ro_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-001", full_name: "Ada Rune" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-002", full_name: "Bo Wexler" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d2_id: $.data.id }
          trigger:
            - call: "POST /dispatchers/${d1_id}/certify"
              payload: { protocol_version_id: "${pv_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d2_id}/certify"
              payload: { protocol_version_id: "${pv_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "After the first certify, GET /protocol-versions/${pv_id}/rollouts shows data[0].trained_dispatcher_count == 1 and data[0].training_status == IN_PROGRESS"
            - "After the second certify, data[0].trained_dispatcher_count == 2 and data[0].training_status == COMPLETE (the comparison is >=, so hitting the target exactly completes)"
            - "data[0].golive_status is SCHEDULED at every step and went_live_at stays null — the training dimension never touches the go-live dimension"
            - "GET /dispatchers/${d1_id} shows certification_status CERTIFIED, certified_protocol_version_id ${pv_id}, dispatch_privilege still FULL"

      - name: cyclic_review_loop_returns_to_selected_stub
        claim_type: cyclic
        grounds:
          - state_machines.Review
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The SCORED -> DISPUTED -> SELECTED loop with its score-clearing effect is exercised in §1.8."
        excluded_because:
          difficulty_instance: upheld_rebuttal_returns_review_to_selected_and_clears_the_score
          rationale: "The §1.8 instance already drives the full cycle and asserts the cleared provisional score, the preserved current_sheet_round and the re-score at round 2, which is strictly more than a shape-only loop check."

      - name: parallel_rollout_dimensions_move_independently_stub
        claim_type: parallel
        grounds:
          - state_machines.ProtocolRollout
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "Independent movement of training_status while golive_status is already LIVE is exercised in §1.8."
        excluded_because:
          difficulty_instance: rollout_training_dimension_regresses_while_golive_dimension_stays_live
          rationale: "The §1.8 instance asserts the regression of the training dimension on an already-LIVE rollout, which subsumes any weaker independent-dimension check."

      - name: compound_golive_guard_reads_child_dimension_stub
        claim_type: compound
        grounds:
          - state_machines.ProtocolRollout.GOLIVE_SCHEDULED_to_GOLIVE_LIVE.preconditions
        distinguishing_aspect: "The go-live guard reading the derived training dimension is exercised in §1.8."
        excluded_because:
          difficulty_instance: golive_requires_the_rollouts_training_dimension_to_be_complete
          rationale: "The §1.8 instance drives the derived training_status from below target to target and shows the guard flipping from ERR_TRAINING_INCOMPLETE to success on identical go-live input."

      - name: guarded_transition_blocked_by_locked_period_stub
        claim_type: guarded_transitions
        grounds:
          - state_machines.Review.SELECTED_to_SCORED.preconditions
          - state_machines.SamplingPeriod.CLOSED_to_LOCKED
        distinguishing_aspect: "The cross-entity guard 'score only if the period is not LOCKED' is exercised in §1.8."
        excluded_because:
          difficulty_instance: scoring_and_finalizing_are_blocked_by_the_periods_locked_state
          rationale: "The §1.8 instance covers both guarded operations (score and finalize) against the same LOCKED period and contrasts them with the pre-lock success."

      - name: cascade_down_from_golive_stub
        claim_type: cascade_down
        grounds:
          - state_machines.ProtocolRollout.GOLIVE_SCHEDULED_to_GOLIVE_LIVE.side_effects
        distinguishing_aspect: "The five-link CASCADE B parent-to-descendant chain is exercised in §1.8."
        excluded_because:
          difficulty_instance: golive_of_the_successor_version_suspends_coaching_plans_five_links_upstream
          rationale: "The §1.8 instance walks all five links of CASCADE B and asserts each intermediate entity, including the non-terminal-children-only rule on coaching plans."

      - name: conditional_cascade_on_period_lock_stub
        claim_type: conditional_cascade
        grounds:
          - state_machines.SamplingPeriod.CLOSED_to_LOCKED.side_effects
        distinguishing_aspect: "The state-conditional void of SELECTED reviews while SCORED and DISPUTED reviews are frozen is exercised in §1.8."
        excluded_because:
          difficulty_instance: submitting_a_report_locks_the_period_and_voids_its_unscored_reviews
          rationale: "The §1.8 instance contrasts all three review states inside one locked period, which is exactly the conditional-cascade claim."

      - name: bubble_up_plan_verification_stub
        claim_type: bubble_up
        grounds:
          - state_machines.CoachingPlan.IN_PROGRESS_to_VERIFIED
          - state_machines.CoachingPlan.VERIFIED_to_IN_PROGRESS
        distinguishing_aspect: "Child-session completion driving the parent plan to VERIFIED and back is exercised in §1.8."
        excluded_because:
          difficulty_instance: cancelling_a_completed_session_returns_the_hours_ledger_and_the_plan_state
          rationale: "The §1.8 instance asserts the bubble-up to VERIFIED and the compensating return to IN_PROGRESS with the ledger restored to its exact pre-completion value."

      - name: ledger_sync_on_finalize_stub
        claim_type: ledger_sync
        grounds:
          - state_machines.Review.SCORED_to_FINALIZED.side_effects
          - calculations.dispatcher_compliance_rollup
        distinguishing_aspect: "The ancestor-ledger reconciliation driven by finalization is exercised in §1.8."
        excluded_because:
          difficulty_instance: finalizing_one_under_triaged_review_restricts_the_dispatcher_five_links_later
          rationale: "The §1.8 instance asserts every ledger field before and after the finalize, five links deep to dispatch_privilege."

      - name: compensation_on_void_stub
        claim_type: compensation
        grounds:
          - state_machines.Review.FINALIZED_to_VOIDED.side_effects
        distinguishing_aspect: "Reversal of every CASCADE A side effect by the void is exercised in §1.8."
        excluded_because:
          difficulty_instance: voiding_a_finalized_review_reverses_every_link_of_the_finalize_cascade
          rationale: "The §1.8 instance asserts field-by-field equality with the pre-finalize snapshot, which is the no-drift claim in full."

  - section: calculations
    instances:
      - name: systematic_draw_selects_by_stride_over_the_ordered_pool
        claim_type: correct_result
        grounds:
          - calculations.systematic_sample_selection
          - endpoints.POST_/sampling-periods/{id}/draw-random-sample
        distinguishing_aspect: "With a 4-call pool and requested_count 2 the stride is floor(4/2) = 2, so indices 0 and 2 of the (received_at ASC, call_reference ASC) ordering are drawn — C-0001 and C-0003 — and no random number generator or id ordering may substitute for that deterministic choice."
        test_recipe:
          setup:
            - "Four INGESTED CHEST_PAIN calls one day apart inside an OPEN RANDOM period with target_sample_count 4."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
