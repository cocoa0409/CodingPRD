  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: compensating_chauffeur_duty_conserved_across_assign_then_cancel
        grounds:
          - state_machines.Reservation.CONFIRMED_to_ASSIGNED
          - state_machines.Reservation.ASSIGNED_to_CANCELLED
          - state_machines.Chauffeur.OFF_DUTY_to_ON_DUTY
          - entities.Chauffeur.fields.status
        distinguishing_aspect: "Conserved quantity = chauffeur duty posture: assign (OFF_DUTY->ON_DUTY, +1 ACTIVE assignment) then cancel from ASSIGNED (ON_DUTY->OFF_DUTY, assignment RELEASED) must leave Chauffeur.status == OFF_DUTY and zero ACTIVE assignments — net-zero duty drift."
        test_recipe:
          setup:
            - "Chauffeur OFF_DUTY; reservation assigned in-house then cancelled while ASSIGNED."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com", cancellation_grace_minutes: 0 }
              as: DispatchAdmin
