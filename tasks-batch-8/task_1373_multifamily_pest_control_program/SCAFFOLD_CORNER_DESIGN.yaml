      - name: compliance_officer_cannot_bill_returns_403
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "ComplianceOfficer may resolve disputes but not bill — bill is BillingClerk exclusive -> ERR_FORBIDDEN_ROLE."
        test_recipe:
