      - name: retention_analysis_buckets_four_donors_and_divides_by_the_risk_denominator
        claim_type: aggregation
        grounds:
          - calculations.donor_retention_analysis
          - endpoints[GET /athletics/point-recalculations/{id}/retention-analysis]
        distinguishing_aspect: |
          The three retention buckets are mutually exclusive and NOT exhaustive:
          a donor with streak 0 and zero cumulative giving falls into none of
          them. The denominator is retained + lapsed_risk only, so with 1
          retained, 1 new, 1 lapsed_risk and 1 uncounted donor the rate is
          1/2 = 0.5000, not 1/4 = 0.2500 and not 1/3. average_certified_points
          divides by donors_processed_count (4), giving 55.00/4 = 13.75, which is
          a different denominator from the rate.
