    input: [closure_note, "closure_retest_id?"]
    output: Issue
    side_effects: ["status = VERIFIED_CLOSED", "releases retainage_hold_cents from CxProject.retainage_withheld_cents", "decrements EquipmentUnit.blocking_issue_count and may re-promote the unit", "recomputes issue_severity_index and readiness_posture, unblocking BLOCKED deferred tests", "increments CxProject.version by 1"]

  - method: POST
    path: "/issues/{id}/reopen"
    description: "Re-open a closed, deferred or in-review issue"
    roles: [CxAuthority]
    code: 200
    input: [reason]
