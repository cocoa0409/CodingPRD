          trigger:
            - call: "GET /drafting-requests"
              payload: { session_id: "${s_id}", limit: 0 }
              as: Clerk
            - call: "GET /drafting-requests"
              payload: { session_id: "${s_id}", limit: 101 }
              as: Clerk
            - call: "GET /drafting-requests"
