      - name: commercial_coverage_floor_is_inclusive_at_one_million_cents
        claim_type: constants_applied
        grounds:
          - calculations.covering_policy_selection
          - validations.priority_37
          - endpoints.POST_/drone-ops/flights
        distinguishing_aspect: |
          MIN_COMMERCIAL_COVERAGE_CENTS is probed one cent either side of its boundary on the
          same pilot: a policy with remaining_coverage_cents 999999 leaves the candidate set
          empty and the COMMERCIAL flight is refused, while a policy at exactly 1000000 is
          eligible because the comparison is >=. It also pins which of the three fiscal errors
          fires - the pilot does hold an ACTIVE indemnified policy covering the window, so
          priority 37 answers, not 35 or 36.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-08-01T00:00:00Z with a REGISTERED 249 g airframe and one uncontrolled class G zone."
            - "Policy P1: coverage_limit_cents 999999, deductible 0, indemnification accepted, effective 2026-08-01 .. 2027-08-01, verified ACTIVE (remaining_coverage_cents 999999)."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
