            - "the team_id query returns total_count == 2 and both rows carry team_id == ${t1_id}"
            - "the UNSANCTIONED query returns total_count == 0, has_more == false and data == []"
            - "the limit=2&offset=2 query returns exactly 2 rows with total_count == 4 and has_more == false"
            - "every response carries meta.api_request_id and meta.api_request_timestamp"
            - "League.${lg_id}.sanctioned_member_count == 4 agrees with the filtered total_count"

