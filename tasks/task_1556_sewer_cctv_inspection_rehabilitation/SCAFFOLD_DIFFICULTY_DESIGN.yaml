scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pacp_quick_rating_vs_weighted_index_divergence
        grounds:
          - calculations.pacp_scoring
          - entities.PipeSegment.fields.quick_rating
          - entities.PipeSegment.fields.structural_index
        distinguishing_aspect: |
          PACP scoring on PipeSegment (severity domain) exhibits two valid
          algorithms — ordinal Quick Rating (extent-blind) vs extent-weighted
          structural index — producing divergent severity pictures for the same
          observation set; this is a different entity domain than the WorkOrder
          cost-ledger dual variants.
        test_recipe:
          setup:
            - "District D with budget 100000000"
            - "Segment S: diameter 200mm, VCP, length 100m"
            - "Cycle CY OPEN, window 2026-08-01..2026-09-01"
            - "Coder TC and QA TQ, certs valid to 2027-01-01"
            - "Clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-DV1", ii_reduction_target_pct: 25, budget_cents: 100000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Coder One", nassco_cert_number: "PACP-C1", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "QA One", nassco_cert_number: "PACP-Q1", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["QA_REVIEWER"] }
              as: DistrictEngineer
              captures: { tq_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-DV1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1975 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T08:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
              captures: { i_id: $.data.id }
            - call: "POST /sewer/cctv-inspections/${i_id}/start"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/begin-coding"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/defects"
              payload: { pacp_code: "B", family: "STRUCTURAL", grade: 5, distance_m: 10, clock_position: 12, extent_m: 0 }
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/defects"
              payload: { pacp_code: "CRK", family: "STRUCTURAL", grade: 4, distance_m: 20, clock_position: 3, extent_m: 30 }
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/submit-qa"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
          trigger:
            - call: "POST /sewer/cctv-inspections/${i_id}/certify"
              payload: {}
              as: QaReviewer
              as_user_id: "${tq_id}"
            - call: "GET /sewer/segments/${s_id}"
              payload: {}
              as: DistrictEngineer
              captures: { s_qr: $.data.quick_rating, s_idx: $.data.structural_index, s_sg: $.data.structural_grade }
          assert:
            - "PipeSegment.${s_id}.quick_rating == '5141'  (highest grade 5 count 1, second 4 count 1 — extent-blind ordinal encoding)"
            - "PipeSegment.${s_id}.structural_index == 4.03  (weighted: (5*1 + 4*30)/(1+30) = 125/31 = 4.0322... -> 4.03)"
            - "PipeSegment.${s_id}.structural_grade == 5"
            - "quick_rating and structural_index disagree about severity ordering: 4.03 < 5.0 implied by worst-grade ordinal"
      - name: work_order_provisional_vs_final_invoice_divergence
        grounds:
          - calculations.work_order_cost
          - entities.RehabPlan.fields.provisional_total_cents
          - entities.RehabPlan.fields.final_total_cents
          - entities.WorkOrderLineItem.fields.provisional_line_cents
          - entities.WorkOrderLineItem.fields.final_line_cents
        distinguishing_aspect: |
          Work-order costing on RehabPlan/WorkOrderLineItem (fiscal domain)
          runs provisional (scheduled_qty) vs final (installed_qty) variants
          over identical line items; per-line round_half_up then sum ordering is
          pinned and the two totals diverge once installed quantities differ —
          a different entity domain than PACP severity scoring.
        test_recipe:
          setup:
            - "District D, segment S (200mm VCP 100m) with CERTIFIED baseline inspection: structural_grade 3 (one grade-3 structural point defect, extent 0)"
            - "Plan P method SPOT_REPAIR APPROVED with work order W and two line items: L1 (SPOT-EA qty 2 @ 250000c), L2 (EXC-CY qty 1.5 @ 133333c)"
            - "W execution_status IN_WORK (bypass not required for SPOT_REPAIR)"
            - "installed_qty L1 := 1, L2 := 1.7 (L2 final_line = round_half_up(1.7*133333) = round_half_up(226666.1) = 226666)"
            - "Clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-DV2", ii_reduction_target_pct: 25, budget_cents: 100000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Coder Two", nassco_cert_number: "PACP-C2", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "QA Two", nassco_cert_number: "PACP-Q2", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["QA_REVIEWER"] }
              as: DistrictEngineer
              captures: { tq_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Crew Two", nassco_cert_number: "PACP-W2", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CREW_LEAD"] }
              as: DistrictEngineer
              captures: { tw_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-DV2", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-3->MH-4", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1980 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T08:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
              captures: { i_id: $.data.id }
            - call: "POST /sewer/cctv-inspections/${i_id}/start"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/begin-coding"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/defects"
              payload: { pacp_code: "CRK", family: "STRUCTURAL", grade: 3, distance_m: 40, clock_position: 6, extent_m: 0 }
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/submit-qa"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/certify"
              payload: {}
              as: QaReviewer
              as_user_id: "${tq_id}"
            - call: "POST /sewer/segments/${s_id}/rehab-plans"
              payload: { method: "SPOT_REPAIR", basis_inspection_id: "${i_id}" }
              as: DistrictEngineer
              captures: { p_id: $.data.id }
            - call: "POST /sewer/rehab-plans/${p_id}/propose"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/rehab-plans/${p_id}/work-orders"
              payload: { crew_lead_id: "${tw_id}" }
              as: DistrictEngineer
              captures: { w_id: $.data.id, w_v0: $.data.version }
            - call: "POST /sewer/work-orders/${w_id}/line-items"
              payload: { pay_item_code: "SPOT-EA", scheduled_qty: 2, unit_price_cents: 250000, expected_work_order_version: "${w_v0}" }
              as: DistrictEngineer
              captures: { l1_id: $.data.id }
            - call: "GET /sewer/work-orders/${w_id}"
              payload: {}
              as: DistrictEngineer
              captures: { w_v1: $.data.version }
            - call: "POST /sewer/work-orders/${w_id}/line-items"
              payload: { pay_item_code: "EXC-CY", scheduled_qty: 1.5, unit_price_cents: 133333, expected_work_order_version: "${w_v1}" }
              as: DistrictEngineer
              captures: { l2_id: $.data.id }
            - call: "GET /sewer/rehab-plans/${p_id}"
              payload: {}
              as: DistrictEngineer
              captures: { p_v1: $.data.version }
            - call: "POST /sewer/rehab-plans/${p_id}/approve"
              payload: { expected_plan_version: "${p_v1}" }
              as: DistrictEngineer
            - call: "POST /sewer/work-orders/${w_id}/mobilize"
              payload: {}
              as: CrewLead
              as_user_id: "${tw_id}"
            - call: "POST /sewer/work-orders/${w_id}/begin-work"
              payload: {}
              as: CrewLead
              as_user_id: "${tw_id}"
            - call: "PATCH /sewer/work-orders/${w_id}/line-items/${l1_id}"
              payload: { installed_qty: 1 }
              as: CrewLead
              as_user_id: "${tw_id}"
            - call: "PATCH /sewer/work-orders/${w_id}/line-items/${l2_id}"
              payload: { installed_qty: 1.7 }
              as: CrewLead
              as_user_id: "${tw_id}"
            - call: "POST /sewer/work-orders/${w_id}/submit-punch"
              payload: {}
              as: CrewLead
              as_user_id: "${tw_id}"
          trigger:
            - call: "POST /sewer/work-orders/${w_id}/complete"
              payload: {}
              as: CrewLead
              as_user_id: "${tw_id}"
            - call: "GET /sewer/rehab-plans/${p_id}"
              payload: {}
              as: DistrictEngineer
              captures: { p_prov: $.data.provisional_total_cents, p_fin: $.data.final_total_cents }
          assert:
            - "RehabPlan.${p_id}.provisional_total_cents == 850000  (2*250000 + round_half_up(1.5*133333)=200000; + MOB_SMALL 150000 = 850000)"
            - "RehabPlan.${p_id}.final_total_cents == 626666  (1*250000 + round_half_up(1.7*133333)=226666; + 150000 = 626666)"
            - "provisional_total_cents != final_total_cents (850000 != 626666) — the two variants diverge on identical line items"
      - name: infiltration_dry_vs_storm_variant_gate
        grounds:
          - calculations.infiltration_reduction_pct
          - entities.SewerDistrict.fields.ii_reduction_target_pct
        distinguishing_aspect: |
          I/I reduction on FlowMonitoringPeriod (hydrology domain) computes
          dry-weather and storm-event reduction variants from the same closed
          periods; ONLY the dry-weather variant gates basin_target_met — a
          third entity domain distinct from severity scoring and cost ledger.
        test_recipe:
          setup:
            - "District D with ii_reduction_target_pct = 30"
            - "Segment S REHABILITATED (completed SPOT_REPAIR path)"
            - "PRE period basin 'B1' closed with dry 100 gpm / peak 500 gpm; POST period closed with dry 60 gpm / peak 425 gpm"
            - "dry reduction = 100*(1-60/100) = 40.0 >= 30 -> target met; storm reduction = 100*(1-425/500) = 15.0 < 30 -> storm variant does NOT meet"
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-DV3", ii_reduction_target_pct: 30, budget_cents: 100000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
