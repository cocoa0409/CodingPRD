      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "an EXECUTED DivisionOrder with pinned_decimal 0.00195313 in a TX unit, LOCATED owner"
      setup_api_calls:
      - call: "POST /tracts"
