  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role / X-User-ID headers fail priority 1 before anything else — even on a malformed-body request the 401 wins."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/members", payload: {}, as: RecAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "with both headers dropped by the harness: error_id == ERR_UNAUTHENTICATED, http 401 (not ERR_VALIDATION)"
      - name: existence_precedes_shape_on_nested_write
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A membership purchase on a nonexistent member id AND missing the required term field must return ERR_NOT_FOUND (existence, priority 3) before ERR_VALIDATION (shape, priority 4)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/memberships", payload: {}, as: Member, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND (404) — existence wins over the missing-term shape error"
