          setup:
            - "An OPEN program with budget_total_cents 50000000, low_tier_cap_cents 1400000, low_tier_cost_share_pct 1.00, max_remediations_per_project 1 and quality_suspension_threshold 0 (the quality path is deliberately disabled so the only cascade under test is the release chain)."
