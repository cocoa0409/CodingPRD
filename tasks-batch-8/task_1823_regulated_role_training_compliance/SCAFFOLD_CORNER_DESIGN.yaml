            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-SOD", title: "SOD Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
