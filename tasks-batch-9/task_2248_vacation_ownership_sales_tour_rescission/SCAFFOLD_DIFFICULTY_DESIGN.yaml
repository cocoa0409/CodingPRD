          - entities.RefundDisbursement.disbursed_amount_cents
        distinguishing_aspect: |
          Conserved quantity: escrow cash. On a TX agreement
          (refund_policy CONTRACTUAL_NET_OF_GIFT) with escrow_collected_cents 320000 and a
          12500 gift issued at check-in, settlement must satisfy
          320000 == 287600 disbursed + 32400 retained exactly. The compensation is also
          correctly TIMED: retained_cents stays 0 while the disbursement is PENDING and only
