        distinguishing_aspect: "total_count and has_more describe the filtered collection and not the table: three of the five episodes belong to patient A, so limit 2 reports total_count 3 with has_more true, offset 2 returns the single remaining row with has_more false, and closing one row moves the clinical_status OPEN filter to total_count 2 while the unfiltered patient_id filter stays at 3."
