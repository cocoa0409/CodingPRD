              payload: { jurisdiction_id: "${juris}", unit_count: 19, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "ID-B" }
              as: PlatformAdmin
              captures: { batch_status: $.data.brand_coverage_status, batch_count: $.data.brand_counted_unit_count }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0020", unit_status: "PLANNED", operates_under_brand_name: true }
