  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: stale_return_dispute_cycle
        grounds:
          - state_machines.StaleReturn.VERIFIED_to_DISPUTED
          - state_machines.StaleReturn.DISPUTED_to_VERIFIED
        distinguishing_aspect: |
          Cyclic negotiation rounds on StaleReturn: VERIFIED -> DISPUTED ->
          VERIFIED increments dispute_round to 1 and recomputes
          final_credit_cents from the new verified_lines.
        test_recipe:
          setup:
            - "Baseline distribution chain (product A only); stop DELIVERED; stale return 3x batch A at age 30h verified with qty 3 -> final 299"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Zeta", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S1", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/drivers", payload: { plant_id: "${p}", name: "Driver One" }, as: PlantAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 100 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${ord}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:50:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/release", payload: {}, as: QALead, as_user_id: "qa-1" }
            - { call: "POST /bakery/routes", payload: { plant_id: "${p}", driver_id: "${drv}", route_date: "2026-08-10", window_start_at: "2026-08-10T08:00:00Z", window_end_at: "2026-08-10T12:00:00Z", truck_capacity_units: 500 }, as: Planner, captures: { rt: $.data.id } }
            - { call: "POST /bakery/route-stops", payload: { route_id: "${rt}", store_order_id: "${ord}", planned_units: 100, batch_ids: [ "${bt}" ] }, as: Planner, captures: { stp: $.data.id } }
            - { call: "POST /bakery/routes/${rt}/start-loading", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /bakery/routes/${rt}/dispatch", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/route-stops/${stp}/deliver", payload: { delivered_units: 100, on_shelf_units_observed: 0 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/stale-returns", payload: { store_id: "${st}", route_stop_id: "${stp}", lines: [ { batch_id: "${bt}", qty: 3 } ] }, as: Driver, as_user_id: "${drv}", captures: { sre: $.data.id } }
            - { call: "POST /bakery/stale-returns/${sre}/verify", payload: { verified_lines: [ { batch_id: "${bt}", qty: 3 } ] }, as: QALead, as_user_id: "qa-1" }
          trigger:
            - call: "POST /bakery/stale-returns/${sre}/dispute"
              payload: {}
              as: StoreReceiver
              as_user_id: "${st}"
              captures: { st1: $.data.status }
            - call: "POST /bakery/stale-returns/${sre}/resolve-dispute"
              payload: { verified_lines: [ { batch_id: "${bt}", qty: 3 } ] }
              as: QALead
              as_user_id: "qa-1"
              captures: { st2: $.data.status, round: $.data.dispute_round, fin: $.data.final_credit_cents }
          assert:
            - "st1 == DISPUTED  # VERIFIED -> DISPUTED loop leg"
            - "st2 == VERIFIED  # cycle returns to VERIFIED"
            - "StaleReturn.${sre}.dispute_round == 1"
            - "StaleReturn.${sre}.final_credit_cents == 299  # round_half_up(3*199*0.5)"

      - name: store_order_amendment_cycle
        grounds:
          - state_machines.StoreOrder.CONFIRMED_to_AMENDMENT_PENDING
          - state_machines.StoreOrder.AMENDMENT_PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Cyclic amendment loop on StoreOrder (different entity than
          StaleReturn): CONFIRMED -> AMENDMENT_PENDING -> CONFIRMED via
          accept-amendment installs the amended lines (total 120).
        test_recipe:
          setup:
            - "Plant, product A, store lead 48h; clock 2026-08-06 (before cutoff 2026-08-08T08:00Z)"
            - "Order 100xA delivery 2026-08-10, CONFIRMED (version 2)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Eta", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S1", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 100 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner, captures: { ov2: $.data.version } }
          trigger:
            - call: "POST /bakery/store-orders/${ord}/request-amendment"
              payload: { lines: [ { product_id: "${pa}", qty: 120 } ], expected_store_order_version: "${ov2}" }
              as: StoreReceiver
              as_user_id: "${st}"
              captures: { st1: $.data.status }
            - call: "POST /bakery/store-orders/${ord}/accept-amendment"
              payload: {}
              as: Planner
              captures: { st2: $.data.status, tot: $.data.total_units }
          assert:
            - "st1 == AMENDMENT_PENDING"
            - "st2 == CONFIRMED  # looped back to CONFIRMED, not a new state"
            - "StoreOrder.${ord}.total_units == 120"

      - name: sanitation_fail_retry_loop
        grounds:
          - state_machines.SanitationCycle.IN_PROGRESS_to_FAILED
          - state_machines.SanitationCycle.FAILED_to_IN_PROGRESS
          - calculations.sanitation_changeover_minutes
        distinguishing_aspect: |
          Cyclic retry loop on SanitationCycle (different entity than the
          other two): IN_PROGRESS -> FAILED -> IN_PROGRESS -> VERIFIED, with
          the SESAME->NONE matrix row requiring 120 minutes before verify.
        test_recipe:
          setup:
            - "Plant, products A (NONE) and B (SESAME), line L1"
            - "Plan 2026-08-09 with SESAME batch B; B run to COOLING at 2026-08-09T08:10:00Z -> line DIRTY with SESAME residue"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant Theta", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-B", name: "Sesame 300", allergen_class: "SESAME", unit_weight_g: 300, shelf_life_hours: 48, base_price_cents: 299, flour_share_pct: 0.25, butter_share_pct: 0.05, batch_capacity_units: 400 }, as: PlantAdmin, captures: { pb: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pb}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T08:10:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/sanitation-cycles", payload: { line_id: "${ln}", to_allergen_class: "NONE" }, as: LineOperator, as_user_id: "op-1", captures: { cyc: $.data.id, reqmin: $.data.required_minutes } }
            - { call: "POST /bakery/sanitation-cycles/${cyc}/start", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/sanitation-cycles/${cyc}/fail", payload: {}, as: QALead, as_user_id: "qa-1", captures: { st_fail: $.data.status } }
          trigger:
            - call: "POST /bakery/sanitation-cycles/${cyc}/start"
              payload: {}
              as: LineOperator
              as_user_id: "op-1"
              captures: { st_loop: $.data.status }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T10:10:00Z" }, as: PlantAdmin }
            - call: "POST /bakery/sanitation-cycles/${cyc}/verify"
              payload: {}
              as: QALead
              as_user_id: "qa-1"
              captures: { st_ver: $.data.status }
            - call: "GET /bakery/lines/${ln}"
              as: Any
              captures: { lclean: $.data.cleanliness, lclass: $.data.allergen_class_current }
          assert:
            - "reqmin == 120  # ALLERGEN_TO_NONE matrix row"
            - "st_fail == FAILED  # first pass failed"
            - "st_loop == IN_PROGRESS  # FAILED -> IN_PROGRESS retry loop leg"
            - "st_ver == VERIFIED"
            - "Line.${ln}.cleanliness == CLEAN"
            - "Line.${ln}.allergen_class_current == NONE"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: batch_reject_cascade_plan_stop_order
        grounds:
          - state_machines.Batch.RELEASED_to_REJECTED
          - entities.ProductionPlan.fields.shortfall_units
          - entities.RouteStop.fields.shortfall_flag
          - state_machines.StoreOrder.LOCKED_to_SHORTED
        distinguishing_aspect: |
          Depth-3 cascade from POST /bakery/batches/{id}/reject: the batch
          rejection mutates ProductionPlan.shortfall_units (hop 1), whose
          shortfall propagation flags each PENDING RouteStop (hop 2), whose
          flag drives StoreOrder LOCKED -> SHORTED (hop 3) — each hop caused
          by the previous hop's mutation, not by the original request.
        test_recipe:
          setup:
            - "Baseline distribution chain (product A, order 100 LOCKED, batch 100 RELEASED, route PLANNED, stop PENDING with batch assigned)"
