              captures: { al2: $.data.id }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act1}", respondent_ref: "resident-77", demographic_group: "LOW_INCOME", census_tract: "06001402100" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_pr: $.data.error_id }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act2}", respondent_ref: "resident-77", demographic_group: "RENTER", census_tract: "06001402100" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { pr2: $.data.id }
            - call: "GET /planning/plan-updates/${pu1}/plan-elements?element_type=LAND_USE"
              as: PlanningStaff
