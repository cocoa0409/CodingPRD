              captures: { order_id: "$.data.id", order_version: "$.data.version" }
            - call: POST /engineered-orders/${order_id}/shipment-releases
              payload: { stage_index: 1, stage_share_bp: 10000, is_final_stage: true, expected_engineered_order_version: "${order_version}" }
