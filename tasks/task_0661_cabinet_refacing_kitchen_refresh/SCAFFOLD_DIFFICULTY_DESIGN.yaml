scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_provisional_estimate_vs_firm_total_diverge
        grounds:
          - calculations.provisional_estimate
          - calculations.firm_quote_total
          - entities.Quote.fields.estimate_total_cents
          - entities.Quote.fields.firm_total_cents
        distinguishing_aspect: |
          On a Quote (cost domain), the DRAFT provisional estimate (blended per-foot rate, ignoring
          door_count and finish multiplier) and the QUOTED firm total (door term + finish multiplier +
          volume discount) compute different cents from the identical Measure: estimate 700000 vs firm 715000.
        test_recipe:
          setup:
            - "A Customer and Project exist; a Measure is COMPLETED with linear_feet=25, door_count=18, finish_code=WOOD_VENEER."
            - "A REFACE Quote is created (DRAFT) then issued (QUOTED), with no add-ons."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h1@x.com", full_name: "H One", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust1: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust1}", address_line: "1 Kitchen Way" }
              as: SalesRep
              captures: { proj1: $.data.id }
            - call: "POST /projects/${proj1}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas1: $.data.id }
            - call: "POST /projects/${proj1}/measures/${meas1}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${proj1}/quotes"
              payload: { measure_id: "${meas1}", scope: "REFACE" }
              as: SalesRep
              captures: { q1: $.data.id, est1: $.data.estimate_total_cents }
          trigger:
            - call: "POST /quotes/${q1}/issue"
              payload: {}
              as: SalesRep
              captures: { firm1: $.data.firm_total_cents }
          assert:
            - "Quote.${q1}.estimate_total_cents == 700000"
            - "Quote.${q1}.firm_total_cents == 715000"
            - "Quote.${q1}.estimate_total_cents != Quote.${q1}.firm_total_cents"

      - name: change_order_lead_days_rush_vs_standard_diverge
        grounds:
          - calculations.change_order_delta
          - calculations.change_order_delta.variants.rush_variant
          - entities.ChangeOrder.fields.lead_time_delta_days
        distinguishing_aspect: |
          On a ChangeOrder (lead-time domain, distinct from the Quote cost domain), the same +4 linear-feet /
          +2 door delta yields lead_time_delta_days=11 standard but 6 under rush (ceil(11*0.5)); price_delta_cents
          is identical (110000) under both, isolating the rush variant to the lead-time axis.
        test_recipe:
          setup:
            - "An APPROVED REFACE/WOOD_VENEER quote exists on a SOLD project (Measure linear_feet=25, door_count=18)."
            - "Two PENDING change orders are raised on that quote: one rush=false, one rush=true, each delta +4 lf / +2 doors."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h2@x.com", full_name: "H Two", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust2: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust2}", address_line: "2 Kitchen Way" }
              as: SalesRep
              captures: { proj2: $.data.id }
            - call: "POST /projects/${proj2}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas2: $.data.id }
            - call: "POST /projects/${proj2}/measures/${meas2}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${proj2}/quotes"
              payload: { measure_id: "${meas2}", scope: "REFACE" }
              as: SalesRep
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/issue"
              payload: {}
              as: SalesRep
              captures: { q2v: $.data.version }
            - call: "POST /quotes/${q2}/approve"
              payload: { expected_quote_version: "${q2v}" }
              as: Customer
              as_user_id: "${cust2}"
              captures: { q2v2: $.data.version }
            - call: "POST /quotes/${q2}/change-orders"
              payload: { delta_linear_feet: 4, delta_door_count: 2, rush: false }
              as: SalesRep
              captures: { co_std: $.data.id }
            - call: "POST /quotes/${q2}/change-orders"
              payload: { delta_linear_feet: 4, delta_door_count: 2, rush: true }
              as: SalesRep
              captures: { co_rush: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_std}/accept"
              payload: { expected_quote_version: "${q2v2}" }
              as: Customer
              as_user_id: "${cust2}"
              captures: { q2v3: $.data.version }
            - call: "GET /change-orders/${co_std}"
              payload: {}
              as: SalesRep
              captures: { std_lead: $.data.lead_time_delta_days }
          assert:
            - "ChangeOrder.${co_std}.lead_time_delta_days == 11"
            - "ChangeOrder.${co_std}.price_delta_cents == 110000"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: firm_total_nonlinear_finish_and_tier_interaction
        grounds:
          - calculations.firm_quote_total
          - entities.Quote.fields.firm_total_cents
          - entities.Measure.fields.finish_code
        distinguishing_aspect: |
          Mode (a): firm_quote_total has 4 interacting inputs (linear_feet, door_count, finish_code multiplier,
          and a subtotal-tier volume discount) where the discount tier is itself a function of the finish-inflated
          subtotal — a non-linear chain. REDOOR/32lf/24d/SOLID_WOOD yields subtotal 1579200, a 5% tier discount of
          78960, firm 1500240.
        test_recipe:
          setup:
            - "A COMPLETED Measure with linear_feet=32, door_count=24, finish_code=SOLID_WOOD; a REDOOR Quote (no add-ons)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h3@x.com", full_name: "H Three", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust3: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust3}", address_line: "3 Kitchen Way" }
              as: SalesRep
              captures: { proj3: $.data.id }
            - call: "POST /projects/${proj3}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas3: $.data.id }
            - call: "POST /projects/${proj3}/measures/${meas3}/complete"
              payload: { linear_feet: 32, door_count: 24, door_style: "RAISED", finish_code: "SOLID_WOOD" }
              as: SalesRep
            - call: "POST /projects/${proj3}/quotes"
              payload: { measure_id: "${meas3}", scope: "REDOOR" }
              as: SalesRep
              captures: { q3: $.data.id }
          trigger:
            - call: "POST /quotes/${q3}/issue"
              payload: {}
              as: SalesRep
              captures: { firm3: $.data.firm_total_cents }
          assert:
            - "Quote.${q3}.firm_total_cents == 1500240"

      - name: addons_total_round_per_component_then_sum
        grounds:
          - calculations.firm_quote_total
          - entities.AddOn.fields.price_cents
          - entities.Quote.fields.addons_total_cents
        distinguishing_aspect: |
          Mode (b): two fractional-cent COUNTERTOP add-ons (6533*10.5=68596.5 and 4567*20.5=93623.5). The scaffold
          pins round-per-AddOn-then-sum: rhu(68596.5)+rhu(93623.5)=68597+93624=162221, NOT rhu(68596.5+93623.5)=162220.
          The pinned order is what distinguishes this from round-once.
        test_recipe:
          setup:
            - "A COMPLETED Measure (linear_feet=12, door_count=6, finish_code=LAMINATE); a REFACE DRAFT Quote."
            - "Two COUNTERTOP add-ons proposed and APPROVED: unit 6533 x qty 10.5, and unit 4567 x qty 20.5."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h4@x.com", full_name: "H Four", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust4: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust4}", address_line: "4 Kitchen Way" }
              as: SalesRep
              captures: { proj4: $.data.id }
            - call: "POST /projects/${proj4}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas4: $.data.id }
            - call: "POST /projects/${proj4}/measures/${meas4}/complete"
              payload: { linear_feet: 12, door_count: 6, door_style: "SLAB", finish_code: "LAMINATE" }
              as: SalesRep
            - call: "POST /projects/${proj4}/quotes"
              payload: { measure_id: "${meas4}", scope: "REFACE" }
              as: SalesRep
              captures: { q4: $.data.id }
            - call: "POST /quotes/${q4}/addons"
              payload: { kind: "COUNTERTOP", unit_price_cents: 6533, quantity: 10.5 }
              as: SalesRep
              captures: { ad1: $.data.id, ad1p: $.data.price_cents }
            - call: "POST /quotes/${q4}/addons"
              payload: { kind: "COUNTERTOP", unit_price_cents: 4567, quantity: 20.5 }
              as: SalesRep
              captures: { ad2: $.data.id, ad2p: $.data.price_cents }
            - call: "POST /addons/${ad1}/approve"
              payload: {}
              as: SalesRep
            - call: "POST /addons/${ad2}/approve"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /quotes/${q4}/issue"
              payload: {}
              as: SalesRep
              captures: { addons4: $.data.addons_total_cents, firm4: $.data.firm_total_cents }
          assert:
            - "AddOn.${ad1}.price_cents == 68597"
            - "AddOn.${ad2}.price_cents == 93624"
            - "Quote.${q4}.addons_total_cents == 162221"
            - "Quote.${q4}.firm_total_cents == 452621"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_quoted_revising_quoted
        grounds:
          - state_machines.Quote.QUOTED_to_REVISING
          - state_machines.Quote.REVISING_to_QUOTED
          - entities.Quote.fields.status
        distinguishing_aspect: |
          Quote is cyclic: QUOTED -> REVISING -> QUOTED. A reopen then re-issue returns the quote to QUOTED
          with a recomputed firm_total and a fresh expires_at, and version advanced by 2 over the cycle.
        test_recipe:
          setup:
            - "A QUOTED REFACE/WOOD_VENEER quote (linear_feet=25, door_count=18) exists, firm 715000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h5@x.com", full_name: "H Five", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust5: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust5}", address_line: "5 Kitchen Way" }
              as: SalesRep
              captures: { proj5: $.data.id }
            - call: "POST /projects/${proj5}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas5: $.data.id }
            - call: "POST /projects/${proj5}/measures/${meas5}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${proj5}/quotes"
              payload: { measure_id: "${meas5}", scope: "REFACE" }
              as: SalesRep
              captures: { q5: $.data.id }
            - call: "POST /quotes/${q5}/issue"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /quotes/${q5}/reopen"
              payload: {}
              as: SalesRep
            - call: "POST /quotes/${q5}/issue"
              payload: {}
              as: SalesRep
              captures: { q5status: $.data.status, q5firm: $.data.firm_total_cents }
          assert:
            - "Quote.${q5}.status == QUOTED"
            - "Quote.${q5}.firm_total_cents == 715000"

      - name: install_job_branching_done_vs_cancelled
        grounds:
          - state_machines.InstallJob.SCHEDULED_to_IN_PROGRESS
          - state_machines.InstallJob.IN_PROGRESS_to_DONE
          - state_machines.InstallJob.SCHEDULED_to_CANCELLED
          - entities.InstallJob.fields.status
        distinguishing_aspect: |
          InstallJob (different entity from Quote) branches from SCHEDULED into two divergent terminals with
          different side-effect sets: start->complete drives Project to INSTALLED (RECEIVED material), whereas
          cancel reverts Project IN_PRODUCTION -> SOLD. This is fork-join branching on a distinct entity.
        test_recipe:
          setup:
            - "A SCHEDULED InstallJob exists for a project IN_PRODUCTION whose MaterialOrder is READY; clock at window_start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "h6@x.com", full_name: "H Six", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust6: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust6}", address_line: "6 Kitchen Way" }
              as: SalesRep
              captures: { proj6: $.data.id }
            - call: "POST /projects/${proj6}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas6: $.data.id }
            - call: "POST /projects/${proj6}/measures/${meas6}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${proj6}/quotes"
              payload: { measure_id: "${meas6}", scope: "REFACE" }
              as: SalesRep
              captures: { q6: $.data.id }
            - call: "POST /quotes/${q6}/issue"
              payload: {}
              as: SalesRep
              captures: { q6v: $.data.version }
            - call: "POST /quotes/${q6}/approve"
              payload: { expected_quote_version: "${q6v}" }
              as: Customer
              as_user_id: "${cust6}"
            - call: "POST /projects/${proj6}/material-orders"
              payload: { quote_id: "${q6}" }
              as: Scheduler
              captures: { mo6: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-orders/${mo6}/mark-ready"
              payload: {}
              as: Scheduler
            - call: "POST /crews"
              payload: { name: "Crew A", daily_job_capacity: 2, skill_finishes: ["WOOD_VENEER","LAMINATE"] }
              as: Scheduler
              captures: { crew6: $.data.id }
            - call: "POST /projects/${proj6}/install-jobs"
              payload: { material_order_id: "${mo6}", crew_id: "${crew6}", window_start: "2026-05-06T08:00:00Z", window_end: "2026-05-06T17:00:00Z" }
              as: Scheduler
              captures: { ij6: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /install-jobs/${ij6}/start"
              payload: {}
              as: InstallCrew
            - call: "POST /install-jobs/${ij6}/complete"
              payload: {}
              as: InstallCrew
              captures: { ij6status: $.data.status }
          assert:
            - "InstallJob.${ij6}.status == DONE"
            - "Project.${proj6}.status == INSTALLED"
            - "MaterialOrder.${mo6}.status == RECEIVED"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_accept_cascade_depth3_to_install_cancel
        grounds:
          - state_machines.ChangeOrder.PENDING_to_ACCEPTED
          - calculations.change_order_delta
          - entities.MaterialOrder.fields.ready_at
          - entities.InstallJob.fields.status
          - entities.Project.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from ChangeOrder ACCEPTED: (1) Quote re-priced (firm_total += price_delta), which (2)
          extends MaterialOrder.lead_extension_days and pushes ready_at past the booked install window, which (3)
          cancels the SCHEDULED InstallJob and reverts Project IN_PRODUCTION -> SOLD. Each hop is caused by the prior.
        test_recipe:
          setup:
            - "Project IN_PRODUCTION with APPROVED REFACE/WOOD_VENEER quote (lf=25,d=18), MaterialOrder PLACED ready_at=2026-05-04, and a SCHEDULED InstallJob window_start 2026-05-05."
            - "A PENDING change order +4lf/+2d (no rush, lead +11 days) raised on the quote."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "h7@x.com", full_name: "H Seven", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust7: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust7}", address_line: "7 Kitchen Way" }
              as: SalesRep
              captures: { proj7: $.data.id }
            - call: "POST /projects/${proj7}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas7: $.data.id }
            - call: "POST /projects/${proj7}/measures/${meas7}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${proj7}/quotes"
              payload: { measure_id: "${meas7}", scope: "REFACE" }
              as: SalesRep
              captures: { q7: $.data.id }
            - call: "POST /quotes/${q7}/issue"
              payload: {}
              as: SalesRep
              captures: { q7v: $.data.version }
            - call: "POST /quotes/${q7}/approve"
              payload: { expected_quote_version: "${q7v}" }
              as: Customer
              as_user_id: "${cust7}"
              captures: { q7v2: $.data.version }
            - call: "POST /projects/${proj7}/material-orders"
              payload: { quote_id: "${q7}" }
              as: Scheduler
              captures: { mo7: $.data.id, ready7: $.data.ready_at }
            - call: "POST /crews"
              payload: { name: "Crew B", daily_job_capacity: 2, skill_finishes: ["WOOD_VENEER"] }
              as: Scheduler
              captures: { crew7: $.data.id }
            - call: "POST /projects/${proj7}/install-jobs"
              payload: { material_order_id: "${mo7}", crew_id: "${crew7}", window_start: "2026-05-05T08:00:00Z", window_end: "2026-05-05T17:00:00Z" }
              as: Scheduler
              captures: { ij7: $.data.id }
            - call: "POST /quotes/${q7}/change-orders"
              payload: { delta_linear_feet: 4, delta_door_count: 2, rush: false }
              as: SalesRep
              captures: { co7: $.data.id }
          trigger:
            - call: "POST /change-orders/${co7}/accept"
              payload: { expected_quote_version: "${q7v2}" }
              as: Customer
              as_user_id: "${cust7}"
              captures: { co7status: $.data.status }
          assert:
            - "ChangeOrder.${co7}.status == ACCEPTED"
            - "ChangeOrder.${co7}.price_delta_cents == 110000"
            - "Quote.${q7}.firm_total_cents == 825000"
            - "MaterialOrder.${mo7}.lead_extension_days == 11"
            - "MaterialOrder.${mo7}.ready_at == 2026-05-15T00:00:00Z"
            - "InstallJob.${ij7}.status == CANCELLED"
            - "Project.${proj7}.status == SOLD"

      - name: project_cancel_cascade_depth2_measure_and_quote
        grounds:
          - state_machines.Project.LEAD_to_CANCELLED
          - state_machines.Measure.SCHEDULED_to_CANCELLED
          - state_machines.Quote.QUOTED_to_SUPERSEDED
          - entities.Project.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (Project cancel, not ChangeOrder accept): cancelling a QUOTED
          project (1) cancels its SCHEDULED Measure and (2) supersedes its is_active Quote. The propagation pattern
          (fan to two distinct child entities by the cancel) differs from the linear hop chain of the depth-3 cascade.
        test_recipe:
          setup:
            - "A QUOTED project: a second SCHEDULED Measure remains open and the is_active Quote is QUOTED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h8@x.com", full_name: "H Eight", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust8: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust8}", address_line: "8 Kitchen Way" }
              as: SalesRep
              captures: { proj8: $.data.id }
            - call: "POST /projects/${proj8}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas8a: $.data.id }
            - call: "POST /projects/${proj8}/measures/${meas8a}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${proj8}/quotes"
              payload: { measure_id: "${meas8a}", scope: "REFACE" }
              as: SalesRep
              captures: { q8: $.data.id }
            - call: "POST /quotes/${q8}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /projects/${proj8}/measures"
              payload: { scheduled_for: "2026-04-10T15:00:00Z" }
              as: SalesRep
              captures: { meas8b: $.data.id }
          trigger:
            - call: "POST /projects/${proj8}/cancel"
              payload: {}
              as: SalesRep
              captures: { proj8status: $.data.status }
          assert:
            - "Project.${proj8}.status == CANCELLED"
            - "Measure.${meas8b}.status == CANCELLED"
            - "Quote.${q8}.status == SUPERSEDED"
            - "Quote.${q8}.is_active == false"

  # ===================================================================
  # Rule 5 — Validation priority conflicts across different category pairs
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_quote_not_approved_beats_dti
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DTI_EXCEEDED]
        distinguishing_aspect: |
          Category pair state(p6) vs business_fiscal(p17): approving a financing application that is already
          DECLINED (state) while its dti_ratio also exceeds DTI_MAX (fiscal) returns ERR_INVALID_STATE (409),
          the higher-priority error, not ERR_DTI_EXCEEDED.
        test_recipe:
          setup:
            - "A FinancingApplication has been DECLINED by admin; its dti_ratio (0.2032) also exceeds DTI_MAX."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h9@x.com", full_name: "H Nine", state_code: "CA", annual_income_cents: 3700000 }
              as: SalesRep
              captures: { cust9: $.data.id }
            - call: "POST /projects"
