  # ==========================================================================
  # RULE 2 - combinatorial_formula
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: bowler_handicap_class_branch_zero_floor_and_cap_in_one_cascade
        grounds:
          - calculations.bowler_handicap
          - state_machines.Membership.PENDING_REMITTANCE_to_SANCTIONED
          - entities.Member.fields.member_class
          - entities.League.fields.handicap_percentage_youth
          - entities.League.fields.max_handicap_per_game
        distinguishing_aspect: |
          One national-decision ACCEPT drives bowler_handicap down four different branch
          combinations of the same formula: adult 180 -> 36 (plain product), adult 130 -> 60
          (product 81 floored then clipped by max_handicap_per_game), youth 150 -> 56 (the
          handicap_percentage_youth 0.80 factor instead of 0.90), adult 230 -> 0 (the
          max(0, base - basis_average) guard).
        test_recipe:
          setup:
            - "One league on CONFIG-B except that member Eve is a YOUTH member and the four prior-season averages are 180, 130, 150 and 230."
            - "handicap_average_basis is CURRENT but no match is certified, so current_average is null on every membership and the basis falls back to entering_average."
            - "The remittance lists three adults at 3100 cents each and one youth at 1700 cents, so declared_amount_cents is 11000."
            - "The remittance is SUBMITTED and every membership sits at sanction_status PENDING_REMITTANCE with handicap_per_game 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AssociationOfficer
            - call: "POST /members"
