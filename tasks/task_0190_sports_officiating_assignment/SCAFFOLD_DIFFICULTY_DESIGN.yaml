              captures: { g2v1: $.data.version }
          trigger:
            - call: "POST /crew-slots/${s2}/offer"
              payload: { official_id: "${off}", expected_game_version: "${g2v1}" }
              as: Assignor
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OFFICIAL_DOUBLE_BOOKED"

      - name: availability_blackout_intersection_semantics
        grounds:
          - validations[priority=9]
          - entities.Availability.fields.kind
          - errors[ERR_OUTSIDE_AVAILABILITY]
        distinguishing_aspect: "Resource = Availability windows on a different entity; intersection (not strict overlap) semantics: a BLACKOUT that merely intersects the game interval — even by a few minutes — defeats cover, unlike the double-book rule which requires strict overlap of two game intervals."
        test_recipe:
          setup:
            - "League OPEN; official has a wide AVAILABLE window AND a BLACKOUT [19:30,19:45) that intersects the game [18:00,20:00)."
          setup_api_calls:
            - call: "POST /leagues"
