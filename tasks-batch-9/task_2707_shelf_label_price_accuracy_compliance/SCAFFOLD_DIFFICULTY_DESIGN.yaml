              captures: { audit_at: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_at}/scan-lines"
              payload: { item_upc: "00000000000711", shelf_price_cents: 949, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_at}/scan-lines"
              payload: { item_upc: "00000000000712", shelf_price_cents: 299, register_price_cents: 299 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_at}/scan-lines"
              payload: { item_upc: "00000000000713", shelf_price_cents: 199, register_price_cents: 199 }
              as: PriceAuditor
