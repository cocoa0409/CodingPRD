          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Half Cent", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "39 Round Rd" }, as: Applicant, captures: { app_id: $.data.id } }
