          setup:
            - "GI case in WORKUP (specimen grossed, no slides), assigned to p1, with an OPEN LEVEL_3 discrepancy recorded by LabAdmin"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-600", full_name: "Pat Nine", date_of_birth: "1948-07-07" }, as: LabAdmin, captures: { pat: $.data.id } }
