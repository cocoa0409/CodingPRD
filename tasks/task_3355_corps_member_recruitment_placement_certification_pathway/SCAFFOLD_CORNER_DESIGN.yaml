            - call: "POST /corps/applications/${app_id}/decision"
              payload: { decision: "SELECT" }
              as: SelectionManager
              as_user_id: "sm_decider"
            - call: "POST /corps/applications/${app_id}/offer"
              payload: {}
              as: SelectionManager
            - call: "POST /corps/applications/${app_id}/offer/respond"
              payload: { accept: true }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { m_id: $.data.created_corps_member_id }
            - call: "GET /corps/corps-members/${m_id}/certification-milestones"
              payload: {}
              as: CertificationOfficer
              captures: { ms_cw: "$.data[0].id" }
            - call: "POST /corps/corps-members/${m_id}/institute/practice-hours"
              payload: { practice_hours_delta: 240 }
              as: InstituteDirector
            - call: "GET /corps/corps-members/${m_id}"
              payload: {}
              as: CertificationOfficer
              captures: { ready_before: $.data.readiness_score, cwc_before: $.data.coursework_hours_completed }
          trigger:
            - call: "POST /corps/certification-milestones/${ms_cw}/start"
              payload: {}
              as: CertificationOfficer
            - call: "POST /corps/certification-milestones/${ms_cw}/complete"
              payload: {}
              as: CertificationOfficer
              as_user_id: "co_completer"
