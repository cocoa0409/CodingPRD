              captures: { o: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: DispatchAdmin
          trigger:
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { err: "$.data.error_id" }
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o_status: "$.data.status" }
          assert:
            - "err == ERR_DONOR_NOT_ACTIVE while the donor is PENDING_REVIEW"
            - "o_status == OPEN after the donor becomes ACTIVE (identical request, different donor state)"

