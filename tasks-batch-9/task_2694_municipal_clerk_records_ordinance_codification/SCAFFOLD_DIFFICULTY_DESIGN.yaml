scaffold_difficulty_design:

  # ===================================================================
  # RULE 1 — dual_variant_calc
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: records_fee_actual_cost_versus_flat_schedule_diverge_on_identical_lines
        grounds:
          - calculations.records_request_fee_assessment
          - entities.PublicRecordsRequest.fields.fee_schedule_variant
          - entities.PublicRecordsRequest.fields.total_assessed_cents
          - endpoints[POST /clerk/records-requests/{request_id}/assess-fee]
        distinguishing_aspect: |
          Money variant: the SAME two fee lines assessed under ACTUAL_COST yield
          2125 cents and under FLAT_SCHEDULE yield 1875 cents, because
          ACTUAL_COST applies the 20-page allowance per line in input order,
          halves the electronic line and rounds each line's staff minutes up to
          quarter-hours separately, while FLAT_SCHEDULE sums pages and minutes
          first and rounds once at the flat 25-cent page rate.
        test_recipe:
          setup:
            - "Two public records requests filed by the same non-commercial requester with identical responsive-record profiles."
            - "Logical clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "Ada Vance", requester_email: "ada@example.org", subject_description: "Council minutes 2024", commercial_purpose: false }
              as: Anonymous
              as_user_id: "public-01"
              captures: { req_actual: $.data.id }
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "Ada Vance", requester_email: "ada@example.org", subject_description: "Council minutes 2025", commercial_purpose: false }
              as: Anonymous
              as_user_id: "public-01"
              captures: { req_flat: $.data.id }
          trigger:
            - call: "POST /clerk/records-requests/${req_actual}/assess-fee"
              payload: { fee_schedule_variant: "ACTUAL_COST", fee_lines: [ { page_count: 30, staff_minutes: 20, delivery_medium: "PAPER" }, { page_count: 30, staff_minutes: 25, delivery_medium: "ELECTRONIC" } ] }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req_flat}/assess-fee"
              payload: { fee_schedule_variant: "FLAT_SCHEDULE", fee_lines: [ { page_count: 30, staff_minutes: 20, delivery_medium: "PAPER" }, { page_count: 30, staff_minutes: 25, delivery_medium: "ELECTRONIC" } ] }
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "PublicRecordsRequest.${req_actual}.total_assessed_cents == 2125"
            - "PublicRecordsRequest.${req_actual}.fee_schedule_variant == ACTUAL_COST"
            - "PublicRecordsRequest.${req_flat}.total_assessed_cents == 1875"
            - "PublicRecordsRequest.${req_flat}.fee_schedule_variant == FLAT_SCHEDULE"
            - "PublicRecordsRequest.${req_actual}.total_assessed_cents - PublicRecordsRequest.${req_flat}.total_assessed_cents == 250"
            - "PublicRecordsRequest.${req_actual}.fee_balance_cents == 2125 and PublicRecordsRequest.${req_flat}.fee_balance_cents == 1875"
            - "PublicRecordsRequest.${req_actual}.fee_status == ASSESSED and PublicRecordsRequest.${req_actual}.fulfillment_status == RECEIVED"

      - name: effective_date_adoption_immediate_versus_publication_plus_30
        grounds:
          - calculations.instrument_effective_date
          - entities.LegislativeInstrument.fields.effective_date_basis
          - entities.LegislativeInstrument.fields.effective_date
          - state_machines.LegislativeInstrument.ADOPTED_to_PUBLISHED
          - state_machines.LegislativeInstrument.PUBLISHED_to_EFFECTIVE
        distinguishing_aspect: |
          Date variant: an ordinance and a resolution adopted at the SAME meeting
          on 2026-10-06 take different bases — the resolution takes
          ADOPTION_IMMEDIATE and is effective 2026-10-06 without any publication,
          while the ordinance takes PUBLICATION_PLUS_30 and is effective
          2026-11-16 (2026-10-16 + 30 days lands on Sunday 2026-11-15 and rolls
          forward), a 41-day divergence from identical adoption data.
        test_recipe:
          setup:
            - "Two numbering series for 2026: ORD for ordinances, RES for resolutions."
            - "An ordinance (GENERAL, 1200 characters) and a resolution both introduced and adopted at the 2026-09-15 council meeting, whose minutes are approved at the 2026-10-06 meeting."
            - "The ordinance's full-text publication notice is ordered and certified complete on 2026-10-16."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_main: $.data.id }
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD", next_sequence: 1 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns_ord: $.data.id }
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "RESOLUTION", prefix: "RES", next_sequence: 1 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns_res: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "GENERAL", title: "An ordinance amending parking hours", full_text_length: 1200, number_series_id: "${ns_ord}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { inst_ord: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "RESOLUTION", title: "A resolution honouring the fire brigade", full_text_length: 800, number_series_id: "${ns_res}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { inst_res: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_main}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg_sep: $.data.id, mtg_sep_v: $.data.version }
            - call: "POST /clerk/meetings/${mtg_sep}/agenda-packets"
              payload: { expected_meeting_version: "${mtg_sep_v}", late_addendum: false }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt_sep: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt_sep}/agenda-items"
              payload: { sequence_number: 1, item_type: "ORDINANCE_FIRST_READING", title: "First reading: parking hours" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt_sep}/agenda-items"
              payload: { sequence_number: 2, item_type: "ORDINANCE_ADOPTION", title: "Adoption: parking hours" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt_sep}/agenda-items"
              payload: { sequence_number: 3, item_type: "RESOLUTION", title: "Resolution honouring the fire brigade" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt_sep}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings/${mtg_sep}/convene"
              payload: { present_member_count: 7 }
              as: PresidingOfficer
              as_user_id: "po-01"
            - call: "POST /clerk/instruments/${inst_ord}/advance-reading"
              payload: { meeting_id: "${mtg_sep}" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/motions"
              payload: { meeting_id: "${mtg_sep}", motion_type: "ORDINANCE_ADOPTION", majority_rule: "SIMPLE", moved_by_member_id: "cm-01", seconded_by_member_id: "cm-02", instrument_id: "${inst_ord}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mo_ord: $.data.id }
            - call: "POST /clerk/motions/${mo_ord}/tally"
              payload: { yes_count: 4, no_count: 3, abstain_count: 0, recused_count: 0 }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/motions"
              payload: { meeting_id: "${mtg_sep}", motion_type: "RESOLUTION_ADOPTION", majority_rule: "SIMPLE", moved_by_member_id: "cm-03", seconded_by_member_id: "cm-04", instrument_id: "${inst_res}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mo_res: $.data.id }
            - call: "POST /clerk/motions/${mo_res}/tally"
              payload: { yes_count: 5, no_count: 2, abstain_count: 0, recused_count: 0 }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings/${mtg_sep}/adjourn"
              payload: {}
              as: PresidingOfficer
              as_user_id: "po-01"
            - call: "GET /clerk/meetings/${mtg_sep}/minutes"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { min_sep: "$.data[0].id" }
            - call: "PUT /clerk/minutes/${min_sep}"
              payload: { text_body: "Minutes of the regular council meeting of 15 September 2026." }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/minutes/${min_sep}/submit"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_main}", scheduled_start: "2026-10-06T18:00:00Z", scheduled_end: "2026-10-06T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg_oct: $.data.id, mtg_oct_v: $.data.version }
            - call: "POST /clerk/meetings/${mtg_oct}/agenda-packets"
              payload: { expected_meeting_version: "${mtg_oct_v}", late_addendum: false }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt_oct: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt_oct}/agenda-items"
              payload: { sequence_number: 1, item_type: "MINUTES", title: "Approval of the minutes of 15 September 2026" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt_oct}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings/${mtg_oct}/convene"
              payload: { present_member_count: 7 }
              as: PresidingOfficer
              as_user_id: "po-01"
            - call: "POST /clerk/motions"
              payload: { meeting_id: "${mtg_oct}", motion_type: "MINUTES_APPROVAL", majority_rule: "SIMPLE", moved_by_member_id: "cm-01", seconded_by_member_id: "cm-02", target_minutes_id: "${min_sep}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mo_min: $.data.id }
            - call: "POST /clerk/motions/${mo_min}/tally"
              payload: { yes_count: 5, no_count: 2, abstain_count: 0, recused_count: 0 }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/publication-notices"
              payload: { instrument_id: "${inst_ord}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { notice_ord: "$.data[0].id" }
            - call: "POST /clerk/publication-notices/${notice_ord}/order"
              payload: { newspaper_name: "The City Herald", column_inches: 12.50, publication_dates: ["2026-10-09", "2026-10-16"], affidavit_required: true }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T09:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/publication-notices/${notice_ord}/certify-publication"
              payload: { publication_completed_on: "2026-10-16" }
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "LegislativeInstrument.${inst_res}.effective_date_basis == ADOPTION_IMMEDIATE"
            - "LegislativeInstrument.${inst_res}.effective_date == 2026-10-06"
            - "LegislativeInstrument.${inst_res}.status == EFFECTIVE"
            - "LegislativeInstrument.${inst_res}.assigned_number == RES-2026-001"
            - "LegislativeInstrument.${inst_ord}.effective_date_basis == PUBLICATION_PLUS_30"
            - "LegislativeInstrument.${inst_ord}.effective_date == 2026-11-16"
            - "LegislativeInstrument.${inst_ord}.status == PUBLISHED"
            - "LegislativeInstrument.${inst_ord}.assigned_number == ORD-2026-001"
            - "LegislativeInstrument.${inst_ord}.adoption_date == 2026-10-06 and LegislativeInstrument.${inst_res}.adoption_date == 2026-10-06"
            - "LegislativeInstrument.${inst_ord}.publication_completed_on == 2026-10-16 and LegislativeInstrument.${inst_res}.publication_completed_on == null"

  # ===================================================================
  # RULE 2 — combinatorial_formula
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: notice_hours_combine_meeting_type_hearing_addendum_and_body_multiplier
        grounds:
          - calculations.meeting_notice_requirement
          - entities.AgendaPacket.fields.required_notice_hours
          - entities.AgendaPacket.fields.notice_deadline_at
          - entities.AgendaPacket.fields.contains_public_hearing
          - entities.AgendaPacket.fields.late_addendum
        distinguishing_aspect: |
          Four independent factors multiply into one integer: the statutory base
          hours per meeting_type (SPECIAL 48 vs REGULAR 72), a +168 public-hearing
          addition driven by an AgendaItem's item_type, a +24 late-addendum
          penalty carried on the packet, and a per-body multiplier (1.5 for
          PLANNING_COMMISSION, 1.0 for COUNCIL) applied to the SUM and rounded up
          — 360 hours versus 72 hours for meetings that start at the same instant.
        test_recipe:
          setup:
            - "Two venues so the two meetings can share the same start instant without a venue conflict."
            - "Meeting A: PLANNING_COMMISSION / SPECIAL, packet flagged late_addendum, one PUBLIC_HEARING item."
            - "Meeting B: COUNCIL / REGULAR, no addendum, no hearing item."
            - "Both start 2026-09-15T18:00:00Z; both packets posted at 2026-08-25T00:00:00Z."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/venues"
              payload: { name: "Planning Room", address: "2 Civic Plaza", capacity: 60, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_plan: $.data.id }
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_council: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "PLANNING_COMMISSION", meeting_type: "SPECIAL", venue_id: "${venue_plan}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T20:00:00Z", quorum_required: 3 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg_pc: $.data.id, mtg_pc_v: $.data.version }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_council}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg_cc: $.data.id, mtg_cc_v: $.data.version }
            - call: "POST /clerk/meetings/${mtg_pc}/agenda-packets"
              payload: { expected_meeting_version: "${mtg_pc_v}", late_addendum: true }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt_pc: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt_pc}/agenda-items"
              payload: { sequence_number: 1, item_type: "PUBLIC_HEARING", title: "Public hearing on the Elm Street rezoning" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings/${mtg_cc}/agenda-packets"
              payload: { expected_meeting_version: "${mtg_cc_v}", late_addendum: false }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt_cc: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt_cc}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/agenda-packets/${pkt_pc}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt_cc}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "AgendaPacket.${pkt_pc}.contains_public_hearing == true"
            - "AgendaPacket.${pkt_pc}.required_notice_hours == 360"
            - "AgendaPacket.${pkt_pc}.notice_deadline_at == 2026-08-31T18:00:00Z"
            - "AgendaPacket.${pkt_pc}.notice_compliant == true"
            - "AgendaPacket.${pkt_cc}.contains_public_hearing == false"
            - "AgendaPacket.${pkt_cc}.required_notice_hours == 72"
            - "AgendaPacket.${pkt_cc}.notice_deadline_at == 2026-09-12T18:00:00Z"
            - "Meeting.${mtg_pc}.required_notice_hours == 360 and Meeting.${mtg_cc}.required_notice_hours == 72"
            - "Meeting.${mtg_pc}.status == NOTICED and Meeting.${mtg_cc}.status == NOTICED"

      - name: publication_invoice_combines_rate_tier_and_post_discount_affidavit
        grounds:
          - calculations.publication_invoice_total
          - entities.PublicationNotice.fields.gross_cost_cents
          - entities.PublicationNotice.fields.discount_pct
          - entities.PublicationNotice.fields.invoice_total_cents
          - endpoints[POST /clerk/publication-notices/{notice_id}/order]
        distinguishing_aspect: |
          Four factors compose in a fixed order that no single-step formula
          reproduces: 320.00 column inches x 500 cents rounded per insertion
          (160000), the volume tier keyed on that gross EXCLUDING the affidavit
          (0.10), the discount applied to the gross (144000), and only then the
          2500-cent-per-insertion affidavit added (146500). Folding the affidavit
          into the gross before the tier would produce 146250 instead.
        test_recipe:
          setup:
            - "A council meeting on 2026-09-15T18:00:00Z whose posted packet generated a DRAFT MEETING_AGENDA notice with required_publication_count 1 and publication_deadline_on 2026-09-14."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_main: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_main}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg_sep: $.data.id, mtg_sep_v: $.data.version }
            - call: "POST /clerk/meetings/${mtg_sep}/agenda-packets"
              payload: { expected_meeting_version: "${mtg_sep_v}", late_addendum: false }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt_sep: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt_sep}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt_sep}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/publication-notices"
              payload: { meeting_id: "${mtg_sep}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { notice_agenda: "$.data[0].id" }
          trigger:
            - call: "POST /clerk/publication-notices/${notice_agenda}/order"
              payload: { newspaper_name: "The City Herald", column_inches: 320.00, publication_dates: ["2026-09-14"], affidavit_required: true }
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "PublicationNotice.${notice_agenda}.required_publication_count == 1"
            - "PublicationNotice.${notice_agenda}.publication_deadline_on == 2026-09-14"
            - "PublicationNotice.${notice_agenda}.gross_cost_cents == 160000"
            - "PublicationNotice.${notice_agenda}.discount_pct == 0.10"
            - "PublicationNotice.${notice_agenda}.invoice_total_cents == 146500"
            - "PublicationNotice.${notice_agenda}.status == ORDERED"

      - name: vote_outcome_combines_majority_rule_recusal_abstention_and_tie_break
        grounds:
          - calculations.motion_vote_outcome
          - entities.Motion.fields.effective_base
          - entities.Motion.fields.required_yes
          - entities.Motion.fields.outcome
          - entities.Motion.fields.tie_break_used
          - state_machines.Motion.SECONDED_to_TALLIED
        distinguishing_aspect: |
          Three motions at ONE meeting with present_member_count 7 resolve
          differently because four factors combine: recusals shrink the base
          while abstentions do not, the majority_rule chooses among four
          fractions, and the presiding tie-break is reachable only under SIMPLE
          when yes == no. Result: FAILED at base 6 / required 4 with 3 yes to 2
