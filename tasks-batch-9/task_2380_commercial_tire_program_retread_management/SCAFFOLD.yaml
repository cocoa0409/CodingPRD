  # ---------------- RoadServiceCall ----------------
  - method: POST
    path: "/road-service-calls"
    description: "Opens a road service call for a disabled unit from a dispatching location, at NORMAL or EMERGENCY priority."
    roles: [DispatchCoordinator, FleetManager]
    code: 201
    input: [fleet_account_id, vehicle_id, service_location_id, priority, complaint, reported_at]
    output: RoadServiceCall
    side_effects: ["dispatch_status = OPEN, billing_status = UNBILLED", "the fleet must be ACTIVE and the vehicle must belong to it"]

  - method: POST
    path: "/road-service-calls/{call_id}/dispatch"
    description: "Dispatches a technician. When technician_id is omitted the assignment is made by calculations.technician_dispatch_selector; EMERGENCY calls restrict the pool to TIA_CERTIFIED technicians at the dispatching location."
    roles: [DispatchCoordinator]
    code: 200
    input: [dispatched_at, dispatch_miles, "technician_id?"]
    output: RoadServiceCall
    side_effects:
      - "dispatch_status OPEN -> DISPATCHED, sets technician_id, dispatched_at, dispatch_miles"
      - "sets the assigned Technician AVAILABLE -> ON_CALL"
      - "sets Vehicle.status = OUT_OF_SERVICE"
      - "billing_status is untouched"

  - method: POST
    path: "/road-service-calls/{call_id}/arrive"
    description: "Records technician arrival and resolves the response commitment (location baseline, agreement emergency term, or the NORMAL grace) plus the actual response minutes and the SLA outcome."
    roles: [TireTechnician]
    code: 200
    input: [arrived_at]
    output: RoadServiceCall
    side_effects: ["dispatch_status DISPATCHED -> ON_SITE", "computes committed_response_minutes, actual_response_minutes and sla_met per calculations.road_service_response_and_pricing STEP 1"]

  - method: POST
    path: "/road-service-calls/{call_id}/complete"
    description: "Closes the call and prices it (emergency and after-hours multipliers are taken with max(), never stacked, then capped, then reduced by any SLA-miss credit). When replaced_tire_asset_id is supplied the failed assembly is pulled, its casing is automatically collected at the dispatching location, and an optional replacement asset is minted and mounted in the same position."
    roles: [TireTechnician]
    code: 200
    input: [closed_at, labor_hours, "replaced_tire_asset_id?", "replacement_casing_id?", "replacement_brand?", "replacement_cost_basis_cents?"]
    output: RoadServiceCall
    side_effects:
      - "dispatch_status ON_SITE -> COMPLETED; computes gross_cents, sla_credit_cents and invoice_total_cents per calculations.road_service_response_and_pricing STEP 2"
      - "sets Technician ON_CALL -> AVAILABLE and recomputes completed_call_count"
      - "sets Vehicle.status = IN_SERVICE"
      - "hop 1 (replaced_tire_asset_id supplied): the replaced TireAsset MOUNTED|PULL_FLAGGED -> PULLED; with replacement_casing_id a new TireAsset is minted and mounted at the same position with odometer_at_mount = Vehicle.current_odometer_miles and tread_depth_at_mount_32nds = TirePolicy.new_tire_tread_depth_32nds, carrying replaced_tire_asset_id"
      - "hop 2: the replaced asset's Casing ON_WHEEL -> COLLECTED at the dispatching location"
      - "hop 3: recomputes that ServiceLocation.casings_in_holding_count"
      - "billing_status stays UNBILLED, making the call eligible for the next invoice rollup"

  - method: POST
    path: "/road-service-calls/{call_id}/cancel"
    description: "Cancels an OPEN or DISPATCHED call. This is the one place the dispatch dimension touches the billing dimension: the call becomes NON_BILLABLE."
    roles: [DispatchCoordinator]
    code: 200
    input: [cancel_reason]
    output: RoadServiceCall
    side_effects: ["dispatch_status -> CANCELLED, billing_status -> NON_BILLABLE", "releases any assigned Technician to AVAILABLE", "sets Vehicle.status = IN_SERVICE"]

  - method: GET
    path: "/road-service-calls/{call_id}"
    description: "Reads one road service call including both state dimensions and the full pricing breakdown."
    roles: [DealerAdmin, DispatchCoordinator, TireTechnician, FleetManager, BillingClerk]
    code: 200
    input: []
    output: RoadServiceCall
    side_effects: []

  - method: GET
