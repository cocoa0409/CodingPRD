  # ==============================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_agreement_activate_version_increments
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[agreement-activate-stale-agreement]"]
        distinguishing_aspect: "Correct-version activation succeeds and bumps version by exactly 1; a replay with the pre-activation version then fails 412."
        test_recipe:
          setup: ["talent T; DRAFT agreement A1 at version 1"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Occ Olive", legal_name: "Olive Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2027-01-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: false, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
          trigger:
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ContractAdmin
              captures: { ag_v2: $.data.version }
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first activation succeeds: TalentAgreement.${ag_id}.version == ${ag_v} + 1 and status == ACTIVE"
            - "replayed activation with the old version returns $.data.error_id == ERR_STALE_VERSION (state check would also reject — the OCC guard at 412 fires on the version contract)"

      - name: derived_field_reconciliation_likeness_on_terminate
        claim_type: derived_field_reconciliation
        grounds: [entities.Talent.fields.likeness_granted, state_machines.TalentAgreement.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "Talent.likeness_granted is a derived field over ACTIVE agreements: terminating the only granting agreement flips it to false in the same request."
        test_recipe:
          setup: ["talent T with ACTIVE likeness-granting agreement A1"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Derived Deb", legal_name: "Deb Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2027-01-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: true, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ContractAdmin
          trigger:
            - call: "POST /touring/agreements/${ag_id}/terminate"
              payload: {}
              as: ContractAdmin
          assert:
            - "before terminate Talent.${t_id}.likeness_granted was true (post-activation)"
            - "after terminate Talent.${t_id}.likeness_granted == false"

      - name: rate_threshold_booking_mode_band_boundaries
        claim_type: rate_threshold_boundary
        grounds: [calculations.booking_mode_derivation]
        distinguishing_aspect: "The 40.00 floor: a talent at exactly 40.00 is LIMITED; below 40.00 (e.g., after enough no-shows) UNBOOKABLE — band boundaries are inclusive downward."
        test_recipe:
          setup: ["talent T fresh at 50.00 with one completed event, then no-showed twice (50 + 3 = 53 -> 42 -> 31): crossing 40.00 on the second no-show"]
