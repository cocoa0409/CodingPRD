  - rule_id: compensating_invariant
    instances:
      - name: suspend_reinstate_suspend_conserves_active_count_while_suspension_count_only_climbs
        grounds:
          - calculations.active_certified_product_count
          - calculations.applicant_compliance_posture
          - entities.Certificate.fields.suspension_count
          - entities.Applicant.fields.active_certified_product_count
          - entities.Applicant.fields.suspended_certificate_count
          - state_machines.Certificate.ISSUED_to_SUSPENDED
          - state_machines.Certificate.SUSPENDED_to_ISSUED
          - endpoints."POST /gfco/certificates/{certificateId}/suspension"
          - endpoints."POST /gfco/certificates/{certificateId}/reinstatement"
        distinguishing_aspect: |
          Reinstatement is the compensation for suspension, and it must undo exactly the reversible
          part of the side-effect set while leaving the historical part alone: the applicant's
          active_certified_product_count, suspended_certificate_count, posture score and band and
          the product's label_status all return to their pre-suspension values, but the
          certificate's suspension_count is a monotone lap counter that reinstatement must NOT
          decrement. The instance walks a full lap (issue 1/0/100, suspend 0/1/95, reinstate
          1/0/100) and then triggers a second suspension, so an implementation that decrements
          suspension_count on reinstatement reports 1 instead of 2, and one that adjusts the
          counters incrementally instead of recomputing them from the certificate set drifts.
        test_recipe:
          setup:
            - "One applicant with one facility (shared equipment, ADJACENT_LINES) whose sanitation validation is current and whose INITIAL audit closed CLOSED_PASS with no findings."
            - "One STANDARD-tier product with a single APPROVED INHERENTLY_GF ingredient, formula CLEARED, an active testing plan and label APPROVED."
            - "One certificate issued at clock 2026-08-11: base_fee 98000 + 6000 + 45000 = 149000, tier 0.20, surcharge 29800, total 178800; the applicant then reads 1 active / 0 suspended / posture 100."
            - "The certificate is suspended once for CHANGE_REQUIRES_RECERT (applicant reads 0 active / 1 suspended / posture 95, suspension_count 1) and immediately reinstated (back to 1 active / 0 suspended / posture 100 with suspension_count still 1)."
            - "No nonconformance and no lot test exist anywhere in the fixture, so the only posture penalty in play is the 5-point suspended-certificate term."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
