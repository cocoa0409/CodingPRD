# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3135_donated_medicine_allocation_safety_net_providers
#
# Nine Difficulty Rules × 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: valuation_snapshot_acquisition_vs_wholesale_diverge
        grounds:
          - calculations.valuation_total
          - entities.ValuationSnapshot.fields.method
          - entities.ProductLot.fields.unit_acquisition_value_usd
          - entities.ProductLot.fields.unit_wholesale_value_usd
        distinguishing_aspect: |
          Valuation operates on the ValuationSnapshot / ProductLot (donor-inventory)
          domain: the same two lots produce different total_value_usd when the
          snapshot method flips from ACQUISITION_COST to WHOLESALE_REFERENCE.
          Distinct from the request-domain need_score dual variant.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Donor D exists. Two lots from D with intake_recorded_at in 2026-09, both still QUARANTINED."
            - "Lot A: quantity_received=100, unit_acquisition_value_usd=1.25, unit_wholesale_value_usd=2.00."
            - "Lot B: quantity_received=40, unit_acquisition_value_usd=3.10, unit_wholesale_value_usd=4.05."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "Meridian Pharma", country_code: "US", tax_id: "12-3456789", dea_registration_no: "BM1234567" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "00001-0001-01", product_name: "Amoxicillin 500mg", product_class: "STANDARD", dosage_form: "CAPSULE", unit_of_measure: "UNIT", quantity_received: 100, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.25, unit_wholesale_value_usd: 2.00 }
              as: QAPharmacist
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "00002-0002-01", product_name: "Lisinopril 10mg", product_class: "STANDARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 40, expiration_date: "2027-08-31T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 3.10, unit_wholesale_value_usd: 4.05 }
              as: QAPharmacist
          trigger:
            - call: "POST /medicine-relief/valuation-snapshots"
              payload: { donor_id: "${donor_id}", snapshot_period: "2026-09", method: "ACQUISITION_COST" }
              as: DonorReportingOfficer
              captures: { snap_acq: $.data.id }
            - call: "POST /medicine-relief/valuation-snapshots"
              payload: { donor_id: "${donor_id}", snapshot_period: "2026-09", method: "WHOLESALE_REFERENCE" }
              as: DonorReportingOfficer
              captures: { snap_wh: $.data.id }
          assert:
            - "ValuationSnapshot.${snap_acq}.total_value_usd == 249.00"
            - "ValuationSnapshot.${snap_acq}.lot_count == 2"
            - "ValuationSnapshot.${snap_wh}.total_value_usd == 362.00"
            - "ValuationSnapshot.${snap_wh}.lot_count == 2"
            - "ValuationSnapshot.${snap_acq}.total_value_usd != ValuationSnapshot.${snap_wh}.total_value_usd"

      - name: need_score_emergency_weighted_vs_standard_diverge
        grounds:
          - calculations.need_score
          - entities.AllocationRequest.fields.need_score
          - entities.AllocationRequest.fields.emergency_event_id
        distinguishing_aspect: |
          Need-score operates on the AllocationRequest / RecipientSite domain
          (not inventory valuation). Two sites with identical underserved_index
          and monthly_patient_volume produce different need_score values when
          one request references an ACTIVE EmergencyEvent (severity 3 adds +30)
          and the other does not. Distinct entity domain from instance 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Donor D, two RELEASABLE STANDARD lots (L1 ndc_code=X1, L2 ndc_code=X2) each with quantity_received=100."
            - "Sites A and B are QUALIFIED with identical underserved_index=0.50, monthly_patient_volume=2000, cold_storage_capacity_l=100, has_dea_registration=false, country_code=US."
            - "EmergencyEvent EV severity=3 in ACTIVE status with affected_country_codes=['US']."
            - "Request R1 (site A) references EV; request R2 (site B) references no event."
            - "Both requests are UNDER_REVIEW with a DRAFT decision each containing a single line of quantity=10 against L1 and L2 respectively."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "Meridian Pharma", country_code: "US", tax_id: "12-3456789" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "X1", product_name: "Amoxicillin 500mg", product_class: "STANDARD", dosage_form: "CAPSULE", unit_of_measure: "UNIT", quantity_received: 100, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.00, unit_wholesale_value_usd: 1.50 }
              as: QAPharmacist
              captures: { lot1_id: $.data.id }
            - call: "POST /medicine-relief/lots/${lot1_id}/release"
              payload: {}
              as: QAPharmacist
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "X2", product_name: "Amoxicillin 500mg", product_class: "STANDARD", dosage_form: "CAPSULE", unit_of_measure: "UNIT", quantity_received: 100, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.00, unit_wholesale_value_usd: 1.50 }
              as: QAPharmacist
              captures: { lot2_id: $.data.id }
            - call: "POST /medicine-relief/lots/${lot2_id}/release"
              payload: {}
              as: QAPharmacist
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "Clinic A", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 2000, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_a: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_a}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "LIC-A-1", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_a: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_a}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_a}/qualify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "Clinic B", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 2000, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_b: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_b}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "LIC-B-1", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_b: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_b}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_b}/qualify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/emergency-events"
              payload: { event_name: "Hurricane Delta", severity: 3, affected_country_codes: ["US"], surge_window_ends_at: "2026-10-01T00:00:00Z" }
              as: EmergencyManager
              captures: { ev_id: $.data.id }
            - call: "POST /medicine-relief/emergency-events/${ev_id}/activate"
              payload: {}
              as: EmergencyManager
            - call: "POST /medicine-relief/allocation-requests"
              payload: { site_id: "${site_a}", ndc_code: "X1", quantity_requested: 10, justification_text: "surge", emergency_event_id: "${ev_id}" }
              as: SiteCoordinator
              as_user_id: "${site_a}"
              captures: { req_a: $.data.id }
            - call: "POST /medicine-relief/allocation-requests/${req_a}/begin-review"
              payload: {}
              as: AllocationOfficer
            - call: "GET /medicine-relief/allocation-requests/${req_a}"
              payload: {}
              as: AllocationOfficer
              captures: { req_a_v: $.data.version }
            - call: "POST /medicine-relief/allocation-decisions"
              payload: { request_id: "${req_a}", rationale: "r", lines: [{ lot_id: "${lot1_id}", quantity: 10 }] }
              as: AllocationOfficer
              captures: { dec_a: $.data.id }
            - call: "POST /medicine-relief/allocation-requests"
              payload: { site_id: "${site_b}", ndc_code: "X2", quantity_requested: 10, justification_text: "regular" }
              as: SiteCoordinator
              as_user_id: "${site_b}"
              captures: { req_b: $.data.id }
            - call: "POST /medicine-relief/allocation-requests/${req_b}/begin-review"
              payload: {}
              as: AllocationOfficer
            - call: "GET /medicine-relief/allocation-requests/${req_b}"
              payload: {}
              as: AllocationOfficer
              captures: { req_b_v: $.data.version }
            - call: "POST /medicine-relief/allocation-decisions"
              payload: { request_id: "${req_b}", rationale: "r", lines: [{ lot_id: "${lot2_id}", quantity: 10 }] }
              as: AllocationOfficer
              captures: { dec_b: $.data.id }
          trigger:
            - call: "POST /medicine-relief/allocation-decisions/${dec_a}/finalize"
              payload: { expected_request_version: "${req_a_v}" }
              as: AllocationOfficer
            - call: "POST /medicine-relief/allocation-decisions/${dec_b}/finalize"
              payload: { expected_request_version: "${req_b_v}" }
              as: AllocationOfficer
          assert:
            - "AllocationRequest.${req_a}.need_score == 130.00"
            - "AllocationRequest.${req_b}.need_score == 100.00"
            - "AllocationRequest.${req_a}.need_score - AllocationRequest.${req_b}.need_score == 30.00"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: need_score_multi_input_non_linear_mode_a
        grounds:
          - calculations.need_score
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs and non-linear interaction.
          need_score combines underserved_index (linear), monthly_patient_volume
          through a min() cap (non-linear), emergency severity through a
          conditional branch (zero when no ACTIVE event), and a -50 conditional
          cold-chain penalty. The same request yields a different value when the
          volume cap kicks in vs not.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Site S QUALIFIED with underserved_index=0.80, monthly_patient_volume=5000 (volume_factor hits the min(…,2.0) cap), cold_storage_capacity_l=0."
            - "RELEASABLE COLD_CHAIN lot L (so the -50 cold-chain penalty triggers against S.cold_storage_capacity_l==0 is NOT applied because allocation would be rejected; instead use a STANDARD lot)."
            - "Request R for 5 units of a STANDARD lot."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "D", country_code: "US", tax_id: "T" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "STD", product_name: "Std", product_class: "STANDARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 100, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.00, unit_wholesale_value_usd: 1.50 }
              as: QAPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /medicine-relief/lots/${lot_id}/release"
              payload: {}
              as: QAPharmacist
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "Big Clinic", site_type: "FQHC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 5000, underserved_index: 0.8 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L1", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_id}/qualify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/allocation-requests"
              payload: { site_id: "${site_id}", ndc_code: "STD", quantity_requested: 5, justification_text: "r" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { req_id: $.data.id }
            - call: "POST /medicine-relief/allocation-requests/${req_id}/begin-review"
              payload: {}
              as: AllocationOfficer
            - call: "GET /medicine-relief/allocation-requests/${req_id}"
              payload: {}
              as: AllocationOfficer
              captures: { req_v: $.data.version }
            - call: "POST /medicine-relief/allocation-decisions"
              payload: { request_id: "${req_id}", rationale: "r", lines: [{ lot_id: "${lot_id}", quantity: 5 }] }
              as: AllocationOfficer
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /medicine-relief/allocation-decisions/${dec_id}/finalize"
              payload: { expected_request_version: "${req_v}" }
              as: AllocationOfficer
          assert:
            - "AllocationRequest.${req_id}.need_score == 130.00"
            - "AllocationRequest.${req_id}.status == APPROVED"
            - "AllocationRequest.${req_id}.quantity_approved == 5"

      - name: valuation_per_lot_rounding_then_sum_mode_b
        grounds:
          - calculations.valuation_total
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Per-lot rounding before
          summation produces a different total than sum-then-round; the scaffold
          pins per-lot-then-sum. Lot A: qty=3, acq=0.335 -> round_half_up(1.005, 2)
          = 1.01 (round-half-up). Lot B: qty=7, acq=0.045 -> round_half_up(0.315, 2)
          = 0.32. Total = 1.01 + 0.32 = 1.33, while sum-then-round would yield
          round_half_up(1.005 + 0.315, 2) = round_half_up(1.32, 2) = 1.32.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Donor D."
            - "Lot A: quantity_received=3, unit_acquisition_value_usd=0.335, intake 2026-09."
            - "Lot B: quantity_received=7, unit_acquisition_value_usd=0.045, intake 2026-09."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "D", country_code: "US", tax_id: "T" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "A", product_name: "A", product_class: "STANDARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 3, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 0.335, unit_wholesale_value_usd: 0.50 }
              as: QAPharmacist
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "B", product_name: "B", product_class: "STANDARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 7, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 0.045, unit_wholesale_value_usd: 0.10 }
              as: QAPharmacist
          trigger:
            - call: "POST /medicine-relief/valuation-snapshots"
              payload: { donor_id: "${donor_id}", snapshot_period: "2026-09", method: "ACQUISITION_COST" }
              as: DonorReportingOfficer
              captures: { snap_id: $.data.id }
          assert:
            - "ValuationSnapshot.${snap_id}.total_value_usd == 1.33"
            - "ValuationSnapshot.${snap_id}.lot_count == 2"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: site_qualification_cycle_qualified_suspended_qualified
        grounds:
          - state_machines.RecipientSite.QUALIFIED_to_SUSPENDED
          - state_machines.RecipientSite.SUSPENDED_to_QUALIFIED
          - state_machines.RecipientSite.QUALIFIED_to_REVOKED
        distinguishing_aspect: |
          RecipientSite follows a cyclic shape QUALIFIED -> SUSPENDED ->
          QUALIFIED, diverging from a linear pipeline; revocation from either
          state terminates the cycle. The cycle is reachable multiple times.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Site S is QUALIFIED with one VERIFIED license. Current RecipientSite.version captured."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "Cycle Clinic", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 500, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-CYC-1", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_id}/qualify"
              payload: {}
              as: ComplianceOfficer
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /medicine-relief/sites/${site_id}/suspend"
              payload: { expected_site_version: "${site_v1}" }
              as: ComplianceOfficer
              captures: { site_v2: $.data.version }
            - call: "POST /medicine-relief/sites/${site_id}/reinstate"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "RecipientSite.${site_id}.qualification_status == QUALIFIED after the cycle"
            - "RecipientSite.${site_id}.version has been incremented at least twice from ${site_v1}"

      - name: shipment_fork_join_international_vs_domestic_paths
        grounds:
          - state_machines.Shipment.PACKING_to_AWAITING_CUSTOMS_DOCS
          - state_machines.Shipment.PACKING_to_READY_TO_DISPATCH
          - state_machines.Shipment.AWAITING_CUSTOMS_DOCS_to_READY_TO_DISPATCH
          - state_machines.Shipment.READY_TO_DISPATCH_to_DISPATCHED
        distinguishing_aspect: |
          Shipment uses a fork-join shape on a different entity than
          RecipientSite: from PACKING, the next state forks based on
          is_international (AWAITING_CUSTOMS_DOCS vs READY_TO_DISPATCH); both
          branches rejoin at READY_TO_DISPATCH -> DISPATCHED, but only the
          international branch requires customs CLEARED before dispatch.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Donor D, RELEASABLE STANDARD lot L."
            - "Domestic site SD (country_code=US) QUALIFIED with a VERIFIED license; decision DCD FINALIZED with line against L quantity 5."
            - "International site SI (country_code=HT) QUALIFIED with VERIFIED PHARMACY and IMPORT licenses; decision DCI FINALIZED with line against L quantity 5."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "D", country_code: "US", tax_id: "T" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "N1", product_name: "P", product_class: "STANDARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 100, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.00, unit_wholesale_value_usd: 1.50 }
              as: QAPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /medicine-relief/lots/${lot_id}/release"
              payload: {}
              as: QAPharmacist
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "US Clinic", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { sd_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${sd_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-US-1", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_d: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_d}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${sd_id}/qualify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "Haiti Clinic", site_type: "FREE_CLINIC", country_code: "HT", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.9 }
              as: ComplianceOfficer
              captures: { si_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
