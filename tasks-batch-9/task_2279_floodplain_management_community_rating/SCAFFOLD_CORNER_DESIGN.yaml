              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { comm_version: $.data.version }
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2025, claimed_points: 100, expected_community_version: "${comm_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { std_id: $.data.id }
            - call: "POST /floodplain/higher-standards/${std_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/higher-standards/${std_id}/verify"
              payload: { decision: "VERIFY" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2025, cycle_start_date: "2025-01-01T00:00:00Z", cycle_end_date: "2025-12-31T00:00:00Z", due_at: "2026-09-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_id: $.data.id }
            - call: "POST /floodplain/crs-cycles/${cycle_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/crs-cycles/${cycle_id}/certify"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_VERIFICATION_VISIT_REQUIRED'"
            - "CrsCycle.${cycle_id}.status == SUBMITTED"
            - "CrsCycle.${cycle_id}.verification_visit_required == true"
            - "CrsCycle.${cycle_id}.verification_visit_completed_at == null"
            - "HigherStandard.${std_id}.documentation_status == VERIFIED"
            - "Community.${comm_id}.crs_class == 10"

      - name: finished_certificate_without_a_surveyor_license_is_rejected
