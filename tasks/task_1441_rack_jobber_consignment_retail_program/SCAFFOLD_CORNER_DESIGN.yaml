            - { call: "POST /products", payload: { program_id: "${prog}", sku: "DC-001", name: "Disc Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "PATCH /products/${prod}", payload: { status: "DISCONTINUED" }, as: JobberAdmin }
