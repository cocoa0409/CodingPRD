scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: impressions_estimated_vs_measured_diverge
        grounds:
          - calculations.estimated_impressions
          - calculations.delivered_impressions
          - entities.Flight.fields.impression_entries
        distinguishing_aspect: |
          Entity domain = Flight delivery metrics. Two valid algorithms over the same
          flight — forward-looking traffic model (estimated_impressions, all booked
          weeks incl. future) vs chronological replay of impression_entries with
          AUDIENCE_MEASURED precedence (delivered_impressions) — produce different
          totals for identical inputs; a late measured entry retroactively replaces
          (not adds to) the estimate for its period.
        test_recipe:
          setup:
            - "PUBLISHED static rate card (base 200000, ill 0.15, t1 100000/0.10, t2 250000/0.25)"
            - "Face F1: STATIC, illuminated, daily_traffic_count 300000, 168x576 in, current permit expiring 2026-12-31"
            - "Advertiser (credit_limit 90000000), Campaign 2026-08-01..2026-09-30 APPROVED"
            - "Flight 2026-08-10..2026-09-06 confirmed (BOOKED), artwork DELIVERED (ART_CLEARED), posting verified posted_on 2026-08-10 (LIVE) at clock 2026-08-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { fl: $.data.id } }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "APPROVED" }, as: SalesManager, captures: { camp_v: $.data.version } }
            - { call: "POST /api/flights/${fl}/confirm", payload: { expected_campaign_version: "${camp_v}" }, as: SalesPlanner }
            - { call: "POST /api/artwork-orders", payload: { flight_id: "${fl}", creative_code: "CR-1", material: "VINYL", width_inches: 168, height_inches: 576 }, as: ProductionCoordinator, captures: { ao: $.data.id } }
            - { call: "PUT /api/artwork-orders/${ao}", payload: { status: "IN_PRODUCTION" }, as: ProductionCoordinator }
            - { call: "PUT /api/artwork-orders/${ao}", payload: { status: "PRINTED" }, as: ProductionCoordinator }
            - { call: "PUT /api/artwork-orders/${ao}", payload: { status: "SHIPPED" }, as: ProductionCoordinator }
            - { call: "PUT /api/artwork-orders/${ao}", payload: { status: "DELIVERED" }, as: ProductionCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/posting-records", payload: { flight_id: "${fl}", posted_on: "2026-08-10", photo_proof_url: "https://proof.example/1.jpg" }, as: FieldInstaller, as_user_id: "installer-1", captures: { pr: $.data.id } }
            - { call: "PUT /api/posting-records/${pr}", payload: { status: "VERIFIED" }, as: OperationsAuditor, as_user_id: "auditor-1" }
          trigger:
            - { call: "POST /api/flights/${fl}/impression-entries", payload: { period_start: "2026-08-10", period_end: "2026-08-16", source: "TRAFFIC_ESTIMATE", impressions: 2400000 }, as: OperationsAuditor }
            - { call: "POST /api/flights/${fl}/impression-entries", payload: { period_start: "2026-08-10", period_end: "2026-08-16", source: "AUDIENCE_MEASURED", impressions: 1900000 }, as: OperationsAuditor }
            - { call: "POST /api/flights/${fl}/impression-entries", payload: { period_start: "2026-08-17", period_end: "2026-08-23", source: "TRAFFIC_ESTIMATE", impressions: 2100000 }, as: OperationsAuditor }
            - { call: "GET /api/flights/${fl}", payload: {}, as: SalesPlanner, captures: { est: $.data.estimated_impressions, del: $.data.delivered_impressions, ratio: $.data.delivery_ratio } }
          assert:
            - "Flight.${fl}.estimated_impressions == 9408000  (2352000 per week x 4, forward-looking; unchanged by entries)"
            - "Flight.${fl}.delivered_impressions == 4000000  (period 08-10..08-16 uses 1900000 measured, NOT 2400000 estimate and NOT 4300000 sum; period 08-17..08-23 uses 2100000)"
            - "Flight.${fl}.delivery_ratio == 0.4252"
      - name: availability_committed_vs_forward_calendar
        grounds:
          - calculations.face_availability_calendar
        distinguishing_aspect: |
          Entity domain = Face occupancy calendar (different domain from the impressions
          instance). Same face, same query window, same underlying flights: the committed
          variant (BOOKED-and-later only) and the forward-looking variant (includes
          unexpired HELD) return different calendars that diverge exactly on the HELD window.
        test_recipe:
          setup:
            - "PUBLISHED static rate card; Face F2 STATIC not illuminated, daily_traffic_count 50000, current permit expiring 2026-12-31"
            - "Advertiser, Campaign 2026-08-01..2026-09-30 in DRAFT"
            - "One flight HELD 2026-08-10..2026-09-06 on F2 (created at default clock 2026-08-01, held_until 2026-08-04T00:00:00Z, unexpired)"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-002", structure_code: "ST-002", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f2: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f2}", permit_number: "P-002", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f2}", payload: {}, as: SalesPlanner, captures: { f2_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f2}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f2_v}" }, as: SalesPlanner, captures: { fl: $.data.id } }
          trigger:
            - { call: "GET /api/faces/${f2}/availability", payload: { from_date: "2026-08-01", to_date: "2026-09-30" }, as: SalesPlanner, captures: { committed: $.data.committed_calendar, forward: $.data.forward_calendar } }
          assert:
            - "committed_calendar == []  (HELD excluded)"
            - "forward_calendar == [[\"2026-08-10\", \"2026-09-06\"]]  (unexpired HELD included)"
            - "The two calendars over identical inputs differ exactly on the HELD window"

  # =================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: flight_gross_cost_tiered_multipliers
        grounds:
          - calculations.flight_gross_cost
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — traffic tier BRANCH selection
          (3 branches) x illumination conditional x digital slot share x week count.
          Same rate card and same dates price three faces to three different weeklies
          (287500 / 220000 / 200000) purely via branch selection.
        test_recipe:
          setup:
            - "PUBLISHED static rate card (base 200000, ill 0.15, t1 100000/0.10, t2 250000/0.25)"
            - "Three STATIC faces with current permits expiring 2026-12-31: F-HI (illuminated, 300000 traffic), F-T1 (not illuminated, 150000), F-LO (not illuminated, 50000)"
            - "Advertiser (limit 90000000), Campaign 2026-08-01..2026-09-30 in DRAFT"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-HI", structure_code: "ST-1", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f_hi: $.data.id } }
            - { call: "POST /api/faces", payload: { face_code: "F-T1", structure_code: "ST-2", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 150000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f_t1: $.data.id } }
            - { call: "POST /api/faces", payload: { face_code: "F-LO", structure_code: "ST-3", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f_lo: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f_hi}", permit_number: "P-HI", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/permits", payload: { face_id: "${f_t1}", permit_number: "P-T1", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/permits", payload: { face_id: "${f_lo}", permit_number: "P-LO", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f_hi}", payload: {}, as: SalesPlanner, captures: { f_hi_v: $.data.version } }
            - { call: "GET /api/faces/${f_t1}", payload: {}, as: SalesPlanner, captures: { f_t1_v: $.data.version } }
            - { call: "GET /api/faces/${f_lo}", payload: {}, as: SalesPlanner, captures: { f_lo_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
          trigger:
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f_hi}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f_hi_v}" }, as: SalesPlanner, captures: { fl_hi: $.data.id, hi_weekly: $.data.pinned_weekly_cents, hi_gross: $.data.gross_cents } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f_t1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f_t1_v}" }, as: SalesPlanner, captures: { fl_t1: $.data.id, t1_weekly: $.data.pinned_weekly_cents, t1_gross: $.data.gross_cents } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f_lo}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f_lo_v}" }, as: SalesPlanner, captures: { fl_lo: $.data.id, lo_weekly: $.data.pinned_weekly_cents, lo_gross: $.data.gross_cents } }
          assert:
            - "Flight.${fl_hi}: pinned_weekly_cents == 287500, gross_cents == 1150000, weeks == 4  (tier-2 x1.25 AND illumination x1.15)"
            - "Flight.${fl_t1}: pinned_weekly_cents == 220000, gross_cents == 880000  (tier-1 x1.10, no illumination)"
            - "Flight.${fl_lo}: pinned_weekly_cents == 200000, gross_cents == 800000  (no tier, no illumination)"
      - name: volume_discount_round_per_flight_then_sum
        grounds:
          - calculations.campaign_volume_discount
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from the tiered-multiplier instance):
          scaffold pins round-per-flight-then-sum. With three 4-slot/5-week digital flights
          (gross 2246095 each), per-line rounding yields campaign net 6401370 while
          sum-then-round would yield 6401371 — one cent of divergence that pins the order.
          Also exercises the >= tier boundary: the third confirm crosses 5000000 exactly
          into the 0.05 tier while the first two lock 0.
        test_recipe:
          setup:
            - "PUBLISHED digital rate card (base 625000, ill 0.15, t1 100000/0.10, t2 250000/0.25)"
            - "Three DIGITAL faces (illuminated, 300000 traffic, loop_slots_total 8) with current permits expiring 2026-12-31"
            - "Advertiser (limit 90000000), Campaign 2026-08-01..2026-10-31 APPROVED with three HELD flights (2026-08-10..2026-09-13, 5 weeks, 4 slots each, one per face)"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "DIGITAL", base_weekly_cents: 625000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-D1", structure_code: "ST-D1", market_code: "NYC", display_type: "DIGITAL", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576, loop_slots_total: 8 }, as: InventoryManager, captures: { fd1: $.data.id } }
            - { call: "POST /api/faces", payload: { face_code: "F-D2", structure_code: "ST-D2", market_code: "NYC", display_type: "DIGITAL", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576, loop_slots_total: 8 }, as: InventoryManager, captures: { fd2: $.data.id } }
            - { call: "POST /api/faces", payload: { face_code: "F-D3", structure_code: "ST-D3", market_code: "NYC", display_type: "DIGITAL", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576, loop_slots_total: 8 }, as: InventoryManager, captures: { fd3: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${fd1}", permit_number: "P-D1", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/permits", payload: { face_id: "${fd2}", permit_number: "P-D2", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/permits", payload: { face_id: "${fd3}", permit_number: "P-D3", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${fd1}", payload: {}, as: SalesPlanner, captures: { fd1_v: $.data.version } }
            - { call: "GET /api/faces/${fd2}", payload: {}, as: SalesPlanner, captures: { fd2_v: $.data.version } }
            - { call: "GET /api/faces/${fd3}", payload: {}, as: SalesPlanner, captures: { fd3_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-10-31" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fd1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-13", loop_slots: 4, expected_face_version: "${fd1_v}" }, as: SalesPlanner, captures: { fl1: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fd2}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-13", loop_slots: 4, expected_face_version: "${fd2_v}" }, as: SalesPlanner, captures: { fl2: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fd3}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-13", loop_slots: 4, expected_face_version: "${fd3_v}" }, as: SalesPlanner, captures: { fl3: $.data.id } }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "APPROVED" }, as: SalesManager }
          trigger:
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { cv1: $.data.version } }
            - { call: "POST /api/flights/${fl1}/confirm", payload: { expected_campaign_version: "${cv1}" }, as: SalesPlanner, captures: { net1: $.data.net_cents, g1: $.data.gross_cents } }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { cv2: $.data.version } }
            - { call: "POST /api/flights/${fl2}/confirm", payload: { expected_campaign_version: "${cv2}" }, as: SalesPlanner, captures: { net2: $.data.net_cents } }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { cv3: $.data.version } }
            - { call: "POST /api/flights/${fl3}/confirm", payload: { expected_campaign_version: "${cv3}" }, as: SalesPlanner, captures: { net3: $.data.net_cents, disc3: $.data.discount_pct } }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { contracted: $.data.contracted_cents, net_total: $.data.net_contracted_cents } }
          assert:
            - "Each flight gross_cents == 2246095 (weekly 449219 = round_half_up(898437.5 * 4/8) x 5 weeks)"
            - "Flight.${fl1}.net_cents == 2246095 (tier 0: contracted after confirm 2246095 < 5000000)"
            - "Flight.${fl2}.net_cents == 2246095 (tier 0: 4492190 < 5000000)"
            - "Flight.${fl3}.discount_pct == 0.05 and net_cents == 2133790 (6738285 >= 5000000 crosses the tier)"
            - "Campaign.${camp}.contracted_cents == 6738285"
            - "Campaign.${camp}.net_contracted_cents == 6401370 (per-flight round then sum; sum-then-round would give 6401371)"

  # =================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: artwork_revision_loop_cycle
        grounds:
          - state_machines.ArtworkOrder.IN_PRODUCTION_to_REVISION_REQUESTED
          - state_machines.ArtworkOrder.REVISION_REQUESTED_to_SUBMITTED
          - entities.ArtworkOrder.fields.revision_count
        distinguishing_aspect: |
          ArtworkOrder is cyclic: IN_PRODUCTION -> REVISION_REQUESTED -> SUBMITTED loops
          three times before proceeding; revision_count accumulates across loops and the
          surcharge formula (first 2 revisions free, 35000 per revision beyond) fires on
          the third loop at DELIVERED.
        test_recipe:
          setup:
            - "Full booking chain: PUBLISHED static card, static face F1 (illuminated, 300000) with permit to 2026-12-31, advertiser (limit 90000000), campaign 2026-08-01..2026-09-30 APPROVED, flight 2026-08-10..2026-09-06 confirmed BOOKED, artwork order created"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
