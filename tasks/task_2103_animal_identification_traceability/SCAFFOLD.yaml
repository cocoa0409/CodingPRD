roles:
  - name: Producer
    description: "Livestock owner/operator: registers premises, applies devices, reports movements, counts inventory, appeals holds and enrolls for incentives."
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /premises"
      - "POST /producers/{id}/enroll"
      - "POST /tag-lots/{id}/apply-tag"
      - "POST /tags/{id}/replace"
      - "POST /movement-events"
      - "POST /movement-events/{id}/receive"
      - "POST /movement-events/{id}/correct"
      - "POST /hold-orders/{id}/appeal"
      - "POST /reconciliation-runs"
      - "POST /reconciliation-runs/{id}/submit"
    shared_operations:
      - "GET /producers/{id}"
      - "GET /producers/{id}/incentive-awards"
      - "GET /premises/{id}"
      - "GET /premises"
      - "GET /premises/{id}/reconciliation-runs"
      - "GET /tag-lots/{id}"
      - "GET /tag-lots"
      - "GET /tags/{id}"
      - "GET /tags"
      - "GET /animals/{id}"
      - "GET /animals"
      - "GET /sightings/{id}"
      - "GET /sightings"
      - "GET /movement-events/{id}"
      - "GET /movement-events"
      - "GET /hold-orders/{id}"
      - "GET /hold-orders"

  - name: StateAnimalHealthOfficial
