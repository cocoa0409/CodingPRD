      - name: a_second_sweep_at_the_same_clock_value_reports_three_empty_lists
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/regulatory-sweeps
          - state_machines.LetterOfIntent.ISSUED_to_LAPSED
        distinguishing_aspect: |
          The sweep is the only bulk endpoint and its contract is idempotence at a fixed
          clock: the first call at 2026-09-29T00:00:00Z lapses the letter and names it in
          lapsed_letter_of_intent_ids, the second call at the same instant must return
          three EMPTY arrays and leave LetterOfIntent.version where the first call left it.
          An implementation that re-reports already-swept rows makes an operator checkpoint
          non-repeatable, and one that re-applies the side effect double-bumps the version.
        test_recipe:
          setup:
            - "A Restructuring in LOI_NEGOTIATION with one ISSUED LetterOfIntent whose expires_at is 2026-09-29T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
