              captures: { x_tier: "$.data.irmaa_tier", x_total: "$.data.total_premium_cents" }
            - call: "POST /medicare/premium-determinations"
              payload: { beneficiary_id: "${by_id}", coverage_year: 2027, part: "PART_B" }
              as: FieldOfficer
              as_user_id: "fo-100"
              captures: { y_tier: "$.data.irmaa_tier", y_total: "$.data.total_premium_cents" }
          assert:
            - "X (MAGI == 10000000 == floor): irmaa_tier == 1, irmaa_surcharge_cents == 7600, total_premium_cents == 26600"
            - "Y (MAGI == 9999999 == floor - 1): irmaa_tier == 0, total_premium_cents == 19000"
            - "a single cent of MAGI flips the tier — >= is inclusive, not >"
      - name: part_b_lep_gap_12_vs_11_months
        grounds:
          - calculations.calc_part_b_lep
          - calculations.calc_lep_gap_months
          - entities.PenaltyAssessment.fields.full_12month_periods
        distinguishing_aspect: |
          Metric: gap month count (integer). floor(12/12) = 1 period -> 10%,
          floor(11/12) = 0 -> no assessment at all. Endpoint under test:
          POST /medicare/enrollments (penalty created as a side effect) —
          distinct endpoint and distinct metric from the MAGI boundary.
        test_recipe:
          setup:
            - "Two beneficiaries X and Y, both DOB 1960-11-15 (attainment 2025-11, IEP end 2026-02), no employer coverage"
            - "X enrolls PART_B at clock 2027-02-10 (GEP -> effective 2027-03, gap [2026-03..2027-02] = 12)"
            - "Y enrolls PART_B at clock 2027-01-10 (GEP -> effective 2027-02, gap [2026-03..2027-01] = 11)"
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "X Twelve", date_of_birth: "1960-11-15" }
              as: FieldOfficer
              captures: { bx_id: "$.data.id" }
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Y Eleven", date_of_birth: "1960-11-15" }
              as: FieldOfficer
              captures: { by_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${by_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${by_id}"
              captures: { y_eff: "$.data.effective_month" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${bx_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${bx_id}"
              captures: { x_eff: "$.data.effective_month" }
            - call: "GET /medicare/beneficiaries/${bx_id}/penalties"
              as: FieldOfficer
              captures: { x_pct: "$.data[0].penalty_pct", x_periods: "$.data[0].full_12month_periods", x_gap: "$.data[0].gap_months" }
            - call: "GET /medicare/beneficiaries/${by_id}/penalties"
              as: FieldOfficer
          assert:
            - "X: effective_month == \"2027-03\"; exactly ONE PenaltyAssessment with gap_months == 12, full_12month_periods == 1, penalty_pct == 10, status == ACTIVE"
            - "Y: effective_month == \"2027-02\"; penalties list is EMPTY (gap 11 -> floor(11/12) == 0 -> no row created)"
            - "one month of gap difference flips a lifetime penalty on/off"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_creation_depends_on_window_state
        grounds:
          - state_machines.EnrollmentPeriod.UPCOMING_to_OPEN
          - validations[priority=18]
          - state_machines.CoverageEnrollment.enrollment_status
        distinguishing_aspect: |
          Entity pair CoverageEnrollment x EnrollmentPeriod: the same
          POST /medicare/enrollments succeeds while the beneficiary's IEP row
          is clock-OPEN and fails with ERR_NO_OPEN_ENROLLMENT_WINDOW once the
          row is EXPIRED — the enrollment's creatability is gated by the other
          entity's clock-derived state. Different entity pair than the
          withholding-arrangement instance.
        test_recipe:
          setup:
            - "Beneficiary DOB 1960-06-10 (IEP [2025-03, 2025-09])"
            - "Clock 2025-07-15: IEP OPEN"
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Wendy Window", date_of_birth: "1960-06-10" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-15T00:00:00Z" }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_eff: "$.data.effective_month", e_via: "$.data.enrolled_via_window" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_D" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger[0] (IEP OPEN): 201, enrolled_via_window == IEP, effective_month == \"2025-09\" (M == T+1 branch)"
            - "trigger[2] (IEP EXPIRED, no SEP, clock 2026-06 not in GEP): ERR_NO_OPEN_ENROLLMENT_WINDOW"
            - "identical endpoint, same beneficiary — only the EnrollmentPeriod window state changed"
      - name: switch_to_withholding_depends_on_arrangement_state
        grounds:
          - state_machines.WithholdingArrangement.ACTIVE_to_SUSPENDED
          - state_machines.WithholdingArrangement.SUSPENDED_to_ACTIVE
          - state_machines.CoverageEnrollment.DIRECT_BILL_to_WITHHOLDING
          - validations[priority=32]
        distinguishing_aspect: |
          Entity pair CoverageEnrollment x WithholdingArrangement:
          switch-collection-method to WITHHOLDING is rejected with
          ERR_NO_ACTIVE_WITHHOLDING while the arrangement is SUSPENDED, and
          succeeds after the arrangement resumes to ACTIVE via adjust. The
          enrollment's valid transition set depends on the arrangement's state.
        test_recipe:
          setup:
            - "Rate schedule 2026; beneficiary DOB 1961-04-12; PART_B and PART_D enrolled at clock 2026-05-10 (both effective 2026-06)"
            - "WithholdingArrangement created with monthly_benefit_cents 21000"
            - "Cycle at 2026-06-05: both enrollments activate WITHHOLDING; waterfall due 18500 + 3450 = 21950 > 21000 -> B paid 18500 in full, D gets 2500, shortfall 950 -> arrangement SUSPENDED, both enrollments flipped DIRECT_BILL, arrears invoice for PART_D 950 issued"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Wendy Withhold", date_of_birth: "1961-04-12" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { eb_id: "$.data.id" }
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_D" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ed_id: "$.data.id" }
            - call: "POST /medicare/withholding-arrangements"
              payload: { beneficiary_id: "${b_id}", monthly_benefit_cents: 21000 }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { wa_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/enrollments/${eb_id}/switch-collection-method"
              payload: { target_method: "WITHHOLDING" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /medicare/withholding-arrangements/${wa_id}/adjust"
              payload: { monthly_benefit_cents: 30000 }
              as: BenefitAdministrator
              captures: { wa_status: "$.data.status" }
            - call: "POST /medicare/enrollments/${eb_id}/switch-collection-method"
              payload: { target_method: "WITHHOLDING" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { eb_coll: "$.data.collection_status" }
          assert:
            - "trigger[0]: ERR_NO_ACTIVE_WITHHOLDING — the arrangement is SUSPENDED, so the enrollment transition is closed"
            - "trigger[1]: arrangement resumes ACTIVE (30000 >= 21950 total monthly premium)"
            - "trigger[2]: 200, CoverageEnrollment.${eb_id}.collection_status == WITHHOLDING"
            - "setup consequence: after the cycle the PART_D arrears invoice exists with amount_cents == 950 and is_arrears == true (verifiable via GET /medicare/beneficiaries/${b_id}/invoices)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: employer_coverage_closed_interval_touch_rejected
        grounds:
          - validations[priority=23]
          - conventions.employer_coverage_interval_semantics
          - entities.EmployerCoverageRecord.fields.coverage_end_month
        distinguishing_aspect: |
          Interval semantics: CLOSED month intervals. Record A covers
          [2024-01 .. 2026-08] inclusive; a second ACME record starting
          2026-08 shares the boundary month and is REJECTED, while one starting
          2026-09 is accepted. Touching = collision. Resource:
          EmployerCoverageRecord — different resource and different geometry
          from the relief half-open instance.
        test_recipe:
          setup:
            - "Beneficiary exists; ACME record A covering 2024-01..2026-08 (end declared at registration)"
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Olive Overlap", date_of_birth: "1961-03-10" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${b_id}", employer_name: "ACME", employer_size: 30, coverage_start_month: "2024-01", coverage_end_month: "2026-08" }
              as: Beneficiary
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${b_id}", employer_name: "ACME", employer_size: 30, coverage_start_month: "2026-08" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err_touch: "$.data.error_id" }
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${b_id}", employer_name: "ACME", employer_size: 30, coverage_start_month: "2026-09" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { c_id: "$.data.id" }
          assert:
            - "trigger[0]: ERR_COVERAGE_PERIOD_OVERLAP — month 2026-08 belongs to both closed intervals"
            - "trigger[1]: 201 — first month AFTER A's end is free (closed-interval adjacency means disjoint months)"
      - name: relief_retro_interval_half_open_touch_allowed
        grounds:
          - validations[priority=36]
          - conventions.enrollment_interval_semantics
          - calculations.calc_relief_repricing
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN month intervals [effective_month,
          end_month). A terminated PART_B enrollment [2026-01, 2026-06) collides
          with a relief retro request at 2026-05 (strictly inside) but NOT at
          2026-06 (touching end == start). Resource: retroactive
          CoverageEnrollment via EquitableReliefCase — different resource and
          opposite boundary treatment from the closed employer-coverage
          instance.
        test_recipe:
          setup:
            - "Beneficiary DOB 1960-12-05 (attainment 2025-12, IEP [2025-09, 2026-03]); PART_B enrolled at clock 2025-12-10 -> effective 2026-01; activated at 2026-01-05 cycle"
            - "Terminated at clock 2026-06-10 -> interval [2026-01, 2026-06)"
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Half Open", date_of_birth: "1960-12-05" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments/${e_id}/terminate"
              payload: {}
              as: Beneficiary
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /medicare/equitable-relief-cases"
              payload: { beneficiary_id: "${b_id}", relief_type: "RETROACTIVE_ENROLLMENT", part: "PART_B", claimed_misinform_source: "PLAN_REPRESENTATIVE", description: "told coverage ended in May", requested_effective_month: "2026-05" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /medicare/equitable-relief-cases"
              payload: { beneficiary_id: "${b_id}", relief_type: "RETROACTIVE_ENROLLMENT", part: "PART_B", claimed_misinform_source: "PLAN_REPRESENTATIVE", description: "told coverage ended in May", requested_effective_month: "2026-06" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /medicare/equitable-relief-cases/${rc_id}/adjudicate"
              payload: { decision: "GRANTED" }
              as: FieldOfficer
              as_user_id: "fo-100"
            - call: "GET /medicare/beneficiaries/${b_id}/enrollments"
              as: FieldOfficer
              captures: { e2_eff: "$.data[1].effective_month", e2_status: "$.data[1].enrollment_status", e2_via: "$.data[1].enrolled_via_window" }
          assert:
            - "trigger[0]: ERR_RELIEF_PERIOD_OVERLAP — 2026-05 lies strictly inside [2026-01, 2026-06)"
            - "trigger[1]: 201 — requested 2026-06 touches the terminated interval's end (half-open: no shared month)"
            - "trigger[2] GRANTED -> new PART_B enrollment created: effective_month == \"2026-06\", enrollment_status == ACTIVE (2026-06 <= clock month), enrolled_via_window == RELIEF"
            - "no PenaltyAssessment created: span [2026-04..2026-05] fully covered by the prior enrollment -> gap 0"

  - rule_id: compensating_invariant
    instances:
      - name: relief_repricing_conserves_paid_equals_applied_plus_credit
        grounds:
          - calculations.calc_relief_repricing
          - entities.Beneficiary.fields.credit_cents
          - entities.PremiumInvoice.fields.applied_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY. Forward action: two invoices paid at the
          penalized premium (2 x 20900 = 41800). Compensating action: relief
          grant reprices those months to 19000. Invariant:
          sum(paid_cents) == sum(applied_cents) + credit_cents holds before
          (41800 == 41800 + 0) and after (41800 == 38000 + 3800). Different
          conserved quantity than the election-cardinality instance.
        test_recipe:
          setup:
            - "Identical to relief_grant_depth4_cascade: 2027 PART_B at 20900/month (base 19000 + 10% LEP 1900), invoices 2027-03 and 2027-04 both PAID (41800 total)"
            - "Relief case BOTH with requested_effective_month 2026-06"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2027, part_b_standard_cents: 19000, part_d_national_base_cents: 3600, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7600, part_d_surcharge_cents: 1400 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 19000, part_d_surcharge_cents: 3620 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 30400, part_d_surcharge_cents: 5830 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 41800, part_d_surcharge_cents: 8060 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 45600, part_d_surcharge_cents: 8810 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Con Serve", date_of_birth: "1960-06-10" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/tax-records"
              payload: { beneficiary_id: "${b_id}", tax_year: 2025, magi_cents: 5000000, filing_status: "SINGLE" }
              as: IrsDataAgent
            - call: "POST /medicare/premium-determinations"
              payload: { beneficiary_id: "${b_id}", coverage_year: 2027, part: "PART_B" }
              as: FieldOfficer
              as_user_id: "fo-100"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "GET /medicare/beneficiaries/${b_id}/invoices"
              as: FieldOfficer
              captures: { inv1_id: "$.data[0].id", inv2_id: "$.data[1].id" }
            - call: "POST /medicare/invoices/${inv1_id}/pay"
              payload: { amount_cents: 20900 }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/invoices/${inv2_id}/pay"
              payload: { amount_cents: 20900 }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/equitable-relief-cases"
              payload: { beneficiary_id: "${b_id}", relief_type: "BOTH", part: "PART_B", claimed_misinform_source: "FEDERAL_AGENCY", description: "misinformed about IEP end", requested_effective_month: "2026-06" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { rc_id: "$.data.id" }
          trigger:
            - call: "POST /medicare/equitable-relief-cases/${rc_id}/adjudicate"
              payload: { decision: "GRANTED" }
              as: FieldOfficer
              as_user_id: "fo-100"
            - call: "GET /medicare/beneficiaries/${b_id}/invoices"
              as: FieldOfficer
              captures: { i1_paid: "$.data[0].paid_cents", i1_applied: "$.data[0].applied_cents", i1_status: "$.data[0].status", i2_paid: "$.data[1].paid_cents", i2_applied: "$.data[1].applied_cents" }
            - call: "GET /medicare/beneficiaries/${b_id}"
              as: FieldOfficer
              captures: { b_credit: "$.data.credit_cents" }
          assert:
            - "before grant: paid total was 41800, applied total 41800, credit 0 (invariant holds trivially)"
            - "after grant: invoice1 paid_cents == 20900, applied_cents == 19000, status stays PAID; invoice2 identical"
            - "Beneficiary.credit_cents == 3800"
            - "INVARIANT: 20900 + 20900 == (19000 + 19000) + 3800 — no cent created or destroyed by the forward+compensating pair"
      - name: aep_supersede_conserves_single_governing_election
        grounds:
          - calculations.calc_election_effectivity
          - state_machines.PlanElection.GOVERNING_to_SUPERSEDED
          - concurrency_rules[election-create-stale-beneficiary]
        distinguishing_aspect: |
          Conserved quantity: CARDINALITY of GOVERNING elections per
          (beneficiary, season). Forward action: election E1 created (count 1).
          Compensating action: election E2 in the same AEP season supersedes E1
          (E1 -> SUPERSEDED, E2 -> GOVERNING): the count is exactly 1 both
          before and after. Different conserved quantity than money.
        test_recipe:
          setup:
            - "Beneficiary DOB 1960-01-15 with PART_B enrolled at clock 2025-01-10 (current_coverage ORIGINAL)"
            - "Clock 2026-10-20: AEP-2026 window open (Oct 15 - Dec 7)"
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Elle Ection", date_of_birth: "1960-01-15" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitAdministrator
            - call: "GET /medicare/beneficiaries/${b_id}"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { b_v1: "$.data.version" }
          trigger:
            - call: "POST /medicare/elections"
              payload: { beneficiary_id: "${b_id}", election_window: "AEP", target_coverage: "MA", expected_beneficiary_version: "${b_v1}" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e1_id: "$.data.id", e1_status: "$.data.status", e1_eff: "$.data.effective_month", e1_season: "$.data.season_key" }
            - call: "GET /medicare/beneficiaries/${b_id}"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { b_v2: "$.data.version" }
            - call: "POST /medicare/elections"
              payload: { beneficiary_id: "${b_id}", election_window: "AEP", target_coverage: "MA", expected_beneficiary_version: "${b_v2}" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e2_id: "$.data.id", e2_status: "$.data.status" }
            - call: "GET /medicare/beneficiaries/${b_id}/elections"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e1_final: "$.data[0].status", e2_final: "$.data[1].status" }
          assert:
            - "E1: status GOVERNING, season_key == \"AEP-2026\", effective_month == \"2027-01\"; Beneficiary.version advanced 1 -> 2"
            - "after E2 (created with the fresh version ${b_v2}): exactly ONE GOVERNING election exists in season AEP-2026 — E1 SUPERSEDED, E2 GOVERNING"
            - "INVARIANT: count(elections where status == GOVERNING and season_key == AEP-2026) == 1 before E2 and == 1 after E2"
