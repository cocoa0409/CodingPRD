          The training lapse boundary uses >=, so at clock 2027-07-31T23:59:59Z the member is
          still training_status CURRENT with contact_eligibility ELIGIBLE and membership_status
          ACTIVE, and at exactly 2027-08-01T00:00:00Z - the stored expires_at, not one second
