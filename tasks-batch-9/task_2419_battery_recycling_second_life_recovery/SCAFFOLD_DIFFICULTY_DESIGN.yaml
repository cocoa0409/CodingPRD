            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 60.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-09-30T00:00:00.000Z", planned_input_kg: 5000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id" }
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/campaigns/${camp_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "L-1" }
              as: PlantOperator
              captures: { lot1_id: "$.data.id", lot1_v: "$.data.version" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { total_before: "$.data.module_mass_total_kg", unassigned_before: "$.data.unassigned_mass_kg" }
          trigger:
            - call: "POST /recycling/lots/${lot1_id}/charge"
              payload: { module_ids: ["${m1_id}", "${m2_id}"], expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { charged_mass: "$.data.charged_mass_kg" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { assigned_charged: "$.data.assigned_mass_kg", unassigned_charged: "$.data.unassigned_mass_kg" }
            - call: "POST /recycling/lots/${lot1_id}/void"
              payload: { void_reason: "Reactor contamination found before leaching" }
              as: PlantOperator
              captures: { lot1_status: "$.data.status", charged_after: "$.data.charged_mass_kg" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { assigned_voided: "$.data.assigned_mass_kg", unassigned_voided: "$.data.unassigned_mass_kg", total_after: "$.data.module_mass_total_kg" }
            - call: "GET /recycling/campaigns/${camp_id}"
              payload: {}
              as: PlantOperator
              captures: { committed_voided: "$.data.committed_input_kg" }
            - call: "GET /recycling/lots/${lot1_id}"
              payload: {}
              as: PlantOperator
              captures: { lot1_v2: "$.data.version" }
            - call: "POST /recycling/lots/${lot1_id}/charge"
              payload: { module_ids: ["${m1_id}", "${m2_id}"], expected_lot_version: "${lot1_v2}" }
              as: PlantOperator
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "L-2" }
              as: PlantOperator
              captures: { lot2_id: "$.data.id", lot2_v: "$.data.version" }
            - call: "POST /recycling/lots/${lot2_id}/charge"
              payload: { module_ids: ["${m1_id}", "${m2_id}"], expected_lot_version: "${lot2_v}" }
              as: PlantOperator
              captures: { lot2_status: "$.data.status", lot2_charged: "$.data.charged_mass_kg" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { assigned_recharged: "$.data.assigned_mass_kg", unassigned_recharged: "$.data.unassigned_mass_kg" }
          assert:
            - "${total_before} == 800.0 and ${unassigned_before} == 800.0"
            - "${charged_mass} == 800.000 and ${assigned_charged} == 800.0 and ${unassigned_charged} == 0.0"
            - "${lot1_status} == VOIDED, ${charged_after} == 0.0 and RecoveryLot.${lot1_id}.void_reason == 'Reactor contamination found before leaching'"
            - "Module.${m1_id}.status == Module.${m2_id}.status == RECOVERY_QUEUE and both lot_id fields are null"
            - "${assigned_voided} == 0.0, ${unassigned_voided} == 800.0 and ${total_after} == 800.0 - intake_mass_conservation_invariant holds on both sides of the compensation"
            - "${committed_voided} == 0.000 - the campaign plan is freed"
            - "Re-charging the voided lot returns HTTP 409 with error.error_id == ERR_LOT_NOT_OPEN (the OCC version supplied is current, so priority 7 does not mask priority 8)"
            - "${lot2_status} == CHARGED and ${lot2_charged} == 800.000"
            - "${assigned_recharged} == 800.0 and ${unassigned_recharged} == 0.0 - no drift after the round trip"
            - "ProcessingCampaign.${camp_id}.committed_input_kg == 800.000 after the re-charge"

      - name: discharge_event_then_void_restores_permit_allowance_invariant
        grounds:
          - invariants.permit_allowance_invariant
          - state_machines.DischargeEvent.POSTED_to_VOIDED
          - calculations.permit_daily_bucket_usage
          - errors[ERR_DISCHARGE_EVENT_NOT_POSTED]
        distinguishing_aspect: |
          Voiding a discharge event must give back both the aggregate and the per-day bucket:
          consumed_kg returns to 0.0 AND the 2026-08-20 bucket becomes empty again, so the very
          same 500.0 kg that was refused with ERR_DISCHARGE_DAILY_CAP_EXCEEDED a moment earlier is
          now accepted for that same day - proving the bucket sum re-reads status == POSTED rather
          than replaying a stored counter. The voided row survives as an audit trail and a second
          void of it is refused with ERR_DISCHARGE_EVENT_NOT_POSTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-20T00:00:00.000Z, one campus, one HYDROMET NICKEL_RICH line, one SCHEDULED campaign 2026-08-25 to 2026-09-30 and one OPEN lot L-1."
            - "One ACTIVE WATER PermitAllotment NV-W-118, valid_from 2026-08-01T00:00:00.000Z, valid_to 2026-08-31T23:59:59.999Z, daily_cap_kg 500.0, consumed_kg 0.0."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 60.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-25T00:00:00.000Z", window_end: "2026-09-30T00:00:00.000Z", planned_input_kg: 5000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id" }
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "L-1" }
              as: PlantOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /recycling/permit-allotments"
              payload: { facility_id: "${fac_id}", medium: "WATER", permit_no: "NV-W-118", valid_from: "2026-08-01T00:00:00.000Z", valid_to: "2026-08-31T23:59:59.999Z", daily_cap_kg: 500.0 }
              as: ComplianceOfficer
              captures: { allot_id: "$.data.id", consumed_before: "$.data.consumed_kg" }
          trigger:
            - call: "POST /recycling/lots/${lot_id}/discharge-events"
              payload: { allotment_id: "${allot_id}", event_date: "2026-08-20T06:00:00.000Z", mass_kg: 500.0, analyte: "FLUORIDE" }
              as: ComplianceOfficer
              captures: { ev1_id: "$.data.id", ev1_status: "$.data.status" }
            - call: "POST /recycling/lots/${lot_id}/discharge-events"
              payload: { allotment_id: "${allot_id}", event_date: "2026-08-20T09:00:00.000Z", mass_kg: 500.0, analyte: "FLUORIDE" }
              as: ComplianceOfficer
            - call: "POST /recycling/discharge-events/${ev1_id}/void"
              payload: { void_reason: "Sampled from the wrong sump" }
              as: ComplianceOfficer
              captures: { ev1_status2: "$.data.status" }
            - call: "GET /recycling/permit-allotments/${allot_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { consumed_voided: "$.data.consumed_kg" }
            - call: "POST /recycling/lots/${lot_id}/discharge-events"
              payload: { allotment_id: "${allot_id}", event_date: "2026-08-20T09:00:00.000Z", mass_kg: 500.0, analyte: "FLUORIDE" }
              as: ComplianceOfficer
              captures: { ev2_id: "$.data.id", ev2_status: "$.data.status" }
            - call: "GET /recycling/permit-allotments/${allot_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { consumed_final: "$.data.consumed_kg" }
            - call: "POST /recycling/discharge-events/${ev1_id}/void"
              payload: { void_reason: "Duplicate reversal attempt" }
              as: ComplianceOfficer
          assert:
            - "${consumed_before} == 0.0 and ${ev1_status} == POSTED with HTTP 201"
            - "The second 500.0 kg booking returns HTTP 422 with error.error_id == ERR_DISCHARGE_DAILY_CAP_EXCEEDED while the first event is still POSTED"
            - "${ev1_status2} == VOIDED and DischargeEvent.${ev1_id}.void_reason == 'Sampled from the wrong sump'"
            - "${consumed_voided} == 0.0 - permit_allowance_invariant is restored, consumed_kg equals the sum over POSTED events only"
            - "${ev2_status} == POSTED with HTTP 201: the identical booking that was rejected before the void now succeeds, so the 2026-08-20 bucket was recomputed and not merely decremented"
            - "${consumed_final} == 500.0 and DischargeEvent.${ev1_id}.mass_kg == 500.0 - the voided row is retained for audit but excluded from the sum"
            - "The second void of ${ev1_id} returns HTTP 409 with error.error_id == ERR_DISCHARGE_EVENT_NOT_POSTED and PermitAllotment.${allot_id}.consumed_kg stays 500.0"
            - "PermitAllotment.${allot_id}.status == ACTIVE throughout - the clock never passes valid_to"
