        claim_type: violation_to_error
        grounds: ["errors[ERR_KITCHEN_DAILY_RUN_CAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / field_kitchen_daily_run_cap_is_an_aggregate_day_bucket
