  # ============================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: programming_slot_half_open_overlap
        grounds:
          - validations[priority=9]
        distinguishing_aspect: |
          ProgrammingSlot uses half-open interval [starts_at, ends_at): a new
          slot starting exactly when another ends is ALLOWED (adjacent, not
          overlapping). Two slots [10:00,11:00) and [11:00,12:00) coexist.
        test_recipe:
          setup:
            - "Market SETUP, existing ProgrammingSlot 10:00-11:00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "M15", season_code: "W26O", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-08-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { m15_id: $.data.id }
            - call: "POST /markets/${m15_id}/programming"
              payload: { title: "Concert A", slot_kind: "MUSIC", starts_at: "2026-12-10T10:00:00Z", ends_at: "2026-12-10T11:00:00Z" }
              as: MarketOperator
              captures: { ps15a_id: $.data.id }
          trigger:
            - call: "POST /markets/${m15_id}/programming"
              payload: { title: "Concert B", slot_kind: "MUSIC", starts_at: "2026-12-10T11:00:00Z", ends_at: "2026-12-10T12:00:00Z" }
              as: MarketOperator
              captures: { ps15b_id: $.data.id }
          assert:
            - "ProgrammingSlot.${ps15b_id}.status == SCHEDULED (adjacent half-open intervals allowed)"

      - name: load_slot_aggregate_capacity_overlap
        grounds:
          - validations[priority=9]
        distinguishing_aspect: |
          LoadSlot uses aggregate-capacity semantics: the market has a fixed
          number of loading docks (derived from standard_booth_count / 4).
          Overlap is rejected when the COUNT of overlapping LOAD_IN slots
          exceeds capacity, not when intervals merely intersect.
