            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/_billing/run_renewals"
              payload: {}
              as: SystemOperator
            - call: "GET /api/v1/radios/${radioD_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sigD_deact: "$.data[1].id" }
            - call: "POST /api/v1/_signals/dispatch"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/signal-commands/${sigD_deact}/ack"
