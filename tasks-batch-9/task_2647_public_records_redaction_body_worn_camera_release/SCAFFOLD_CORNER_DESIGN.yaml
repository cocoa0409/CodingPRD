            - "third clarification: HTTP 409 and ${e_limit} == ERR_SCOPE_CLARIFICATION_LIMIT (the version supplied was correct, so this is not an OCC failure)"
            - "PublicRecordsRequest.${req_id}.scope_clarification_count == 2 and scope_narrative == 'Second narrowing' and requested_date_to == 2026-07-07T00:00:00Z"
            - "PublicRecordsRequest.${req_id}.version == ${req_v3} and processing_status == SCOPING"
