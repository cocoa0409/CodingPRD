scenario: |
  Non-Revenue Water & Loss Reduction Program (water utility efficiency program): water balance & apportionment of real vs apparent loss, district metered area monitoring & minimum night flow, leak detection survey & repair prioritization, meter accuracy testing & replacement policy, unauthorized consumption investigation, pressure management project, benchmark reporting to state, cost-benefit of intervention

domain_name: non-revenue-water-loss-reduction
api_prefix: /nrw

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - pagination_with_filtering

  entity_topology: hybrid
  # DMA is the root aggregate; WaterBalancePeriod / NightFlowAssessment / LeakSurvey /
  # PressureProject hang off it; Leak hangs off LeakSurvey; CustomerMeter and
  # UnauthorizedConsumptionCase cross-reference a DMA by FK (flat peers of the tree);
  # BenchmarkReport aggregates across DMAs (cross-cutting association).

  state_machine_shape: compound
  # DMA.posture is a derived aggregate field gating child operations; Leak has a
  # branching machine with a rework cycle (VERIFIED -> REPAIR_SCHEDULED -> REPAIRED ->
  # VERIFIED_REPAIR, with REPAIRED -> REOPENED -> REPAIR_SCHEDULED loop);
  # UnauthorizedConsumptionCase uses parallel dimensions
  # (investigation_status x billing_adjustment_status).

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # Segregation of duties: the same user (X-User-ID) who creates a WaterBalancePeriod
  # may not finalize it; the FieldSupervisor who reports a Leak repair may not verify
  # it; the Investigator who substantiates an UnauthorizedConsumptionCase may not
  # approve its billing adjustment. ProgramDirector holds override only for DMA
  # administration and benchmark submission.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DistrictMeteredArea
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique short code for the DMA (e.g. DMA-NORTH-01); unique across the utility"
        constraints: "unique; 3-40 chars"
      - name: name
        type: string
        source: input
        description: "Human-readable DMA name"
      - name: connection_count
        type: integer
        source: input
        description: "Number of billed service connections inside the DMA"
        constraints: ">= 1"
      - name: mains_length_km
        type: number
        source: input
        description: "Length of distribution mains in the DMA, kilometres"
        constraints: "> 0"
      - name: target_nrw_pct
        type: number
        source: input
        description: "Program target for non-revenue water percentage in this DMA"
        constraints: "0 <= target_nrw_pct < 100"
      - name: posture
        type: enum
        source: computed
        description: "Derived aggregate gating state: OPEN | RESTRICTED | FROZEN. RESTRICTED when any child WaterBalancePeriod is in SUBMITTED state or any PressureProject is ACTIVE; FROZEN when a BenchmarkReport covering this DMA is in SUBMITTED or ACCEPTED state for a period overlapping any open child; otherwise OPEN"
        constraints: "enum: OPEN, RESTRICTED, FROZEN"
        default: OPEN
      - name: latest_nrw_pct
        type: number
        source: computed
        description: "NRW percentage from the most recently FINALIZED WaterBalancePeriod for this DMA; null if none finalized"
      - name: open_leak_count
        type: integer
        source: computed
        description: "Count of Leak rows whose LeakSurvey belongs to this DMA and whose status is in {REPORTED, VERIFIED, REPAIR_SCHEDULED, REOPENED}"
        default: 0

  - name: WaterBalancePeriod
    parent: DistrictMeteredArea
    common_fields: true
    fields:
      - name: dma_id
        type: string
        source: input
        description: "FK -> DistrictMeteredArea.id; the DMA this balance covers"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the balance period (ISO 8601 UTC)"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the balance period (ISO 8601 UTC); must be > period_start; periods for the same DMA must not overlap (half-open [start, end) semantics; adjacent periods sharing a boundary instant are allowed)"
      - name: system_input_volume_m3
        type: number
        source: input
        description: "Volume of water entering the DMA during the period, cubic metres"
        constraints: "> 0"
      - name: billed_authorized_m3
        type: number
        source: input
        description: "Billed authorized consumption (metered + unmetered billed), cubic metres"
        constraints: ">= 0"
      - name: unbilled_authorized_m3
        type: number
        source: input
        description: "Unbilled authorized consumption (e.g. firefighting, mains flushing), cubic metres"
        constraints: ">= 0"
      - name: unauthorized_consumption_m3
        type: number
        source: input
        description: "Estimated unauthorized consumption component of apparent losses, cubic metres"
        constraints: ">= 0"
      - name: metering_inaccuracy_m3
        type: number
        source: input
        description: "Estimated customer-metering inaccuracy component of apparent losses, cubic metres"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle: DRAFT -> SUBMITTED -> FINALIZED; FINALIZED -> SUPERSEDED when a replacement period for an overlapping window is finalized"
        constraints: "enum: DRAFT, SUBMITTED, FINALIZED, SUPERSEDED"
        default: DRAFT
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the UtilityAnalyst who created the period (segregation-of-duties anchor: creator may not finalize)"
      - name: nrw_volume_m3
        type: number
        source: computed
        description: "Non-revenue water volume = system_input_volume_m3 - billed_authorized_m3"
      - name: nrw_pct
        type: number
        source: computed
        description: "NRW percentage; formula differs between PROVISIONAL (status DRAFT/SUBMITTED) and AUDITED (status FINALIZED) variants per calculations.water_balance_nrw"
      - name: apparent_loss_m3
        type: number
        source: computed
        description: "Apparent losses = unauthorized_consumption_m3 + metering_inaccuracy_m3"
      - name: real_loss_m3
        type: number
        source: computed
        description: "Real losses = nrw_volume_m3 - unbilled_authorized_m3 - apparent_loss_m3; clamped at 0 (a negative raw value indicates input inconsistency surfaced by validation)"
      - name: ili
        type: number
        source: computed
        description: "Infrastructure Leakage Index per calculations.infrastructure_leakage_index; only set when status == FINALIZED, else null"

  - name: NightFlowAssessment
    parent: DistrictMeteredArea
    common_fields: true
    fields:
      - name: dma_id
        type: string
        source: input
        description: "FK -> DistrictMeteredArea.id; the DMA assessed"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the minimum-night-flow observation window; assessments for the same DMA must not overlap, and a 1-hour buffer is required between consecutive windows (half-open [start, end); end of one + 1h must be <= start of the next)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of window; window_end - window_start must be >= 2 hours and <= 6 hours"
      - name: measured_mnf_lps
        type: number
        source: input
        description: "Measured minimum night flow, litres per second"
        constraints: ">= 0"
      - name: expected_legitimate_night_use_lps
        type: number
        source: input
        description: "Expected legitimate night consumption allowance, litres per second"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "RECORDED -> ANALYZED; ANALYZED -> SUPERSEDED if a later assessment for an overlapping window is recorded after VOID; also RECORDED -> VOID"
        constraints: "enum: RECORDED, ANALYZED, VOID, SUPERSEDED"
        default: RECORDED
      - name: net_night_flow_lps
        type: number
        source: computed
        description: "Net night flow = measured_mnf_lps - expected_legitimate_night_use_lps; floored at 0"
      - name: net_night_flow_pct
        type: number
        source: computed
        description: "Net night flow as percentage of the DMA average daily inflow implied by the latest FINALIZED WaterBalancePeriod; null when no finalized balance exists"
      - name: leak_signal
        type: enum
        source: computed
        description: "NONE | ELEVATED | CRITICAL per calculations.night_flow_signal thresholds"
        constraints: "enum: NONE, ELEVATED, CRITICAL"

  - name: LeakSurvey
    parent: DistrictMeteredArea
    common_fields: true
    fields:
      - name: dma_id
        type: string
        source: input
        description: "FK -> DistrictMeteredArea.id; the DMA surveyed"
      - name: planned_start
        type: datetime
        source: input
        description: "Planned inclusive start of the survey campaign"
      - name: planned_end
        type: datetime
        source: input
        description: "Planned exclusive end; must be > planned_start; surveys in the same DMA with status in {PLANNED, IN_FIELD} must not overlap (half-open intervals, touching boundaries allowed)"
      - name: method
        type: enum
        source: input
        description: "Detection method"
        constraints: "enum: ACOUSTIC, CORRELATOR, SATELLITE, STEP_TEST, NOISE_LOGGER"
      - name: crew_lead_user_id
        type: string
        source: input
        description: "X-User-ID of the FieldSupervisor leading the crew (audit anchor)"
      - name: status
        type: enum
        source: system
        description: "PLANNED -> IN_FIELD -> COMPLETED; PLANNED -> CANCELLED; IN_FIELD -> CANCELLED only when no Leak under the survey is in non-terminal state"
        constraints: "enum: PLANNED, IN_FIELD, COMPLETED, CANCELLED"
        default: PLANNED
      - name: coverage_pct
        type: number
        source: input
        description: "Percentage of DMA mains length actually surveyed; set at COMPLETED transition"
        constraints: "0 < coverage_pct <= 100"
        default: null
      - name: leaks_found_count
        type: integer
        source: computed
        description: "Count of Leak rows belonging to this survey (any status except WITHDRAWN)"

  - name: Leak
    parent: LeakSurvey
    common_fields: true
    fields:
      - name: survey_id
        type: string
        source: input
        description: "FK -> LeakSurvey.id; the survey that found this leak"
      - name: location_description
        type: string
        source: input
        description: "Free-text location within the DMA"
      - name: estimated_loss_lps
        type: number
        source: input
        description: "Estimated loss rate of the leak, litres per second"
        constraints: "> 0"
      - name: detected_at
        type: datetime
        source: input
        description: "When the leak was detected in the field"
      - name: repair_cost_estimate
        type: number
        source: input
        description: "Estimated repair cost in currency units"
        constraints: ">= 0"
      - name: actual_repair_cost
        type: number
        source: input
        description: "Actual repair cost recorded at repair completion; required for REPAIRED transition"
        constraints: ">= 0"
        default: null
      - name: status
        type: enum
        source: system
        description: "REPORTED -> VERIFIED -> REPAIR_SCHEDULED -> REPAIRED -> VERIFIED_REPAIR; REPAIRED -> REOPENED -> REPAIR_SCHEDULED (rework cycle); REPORTED -> WITHDRAWN; VERIFIED -> WITHDRAWN"
        constraints: "enum: REPORTED, VERIFIED, REPAIR_SCHEDULED, REPAIRED, VERIFIED_REPAIR, REOPENED, WITHDRAWN"
        default: REPORTED
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FieldSupervisor who reported the leak (segregation anchor: reporter may not verify the repair)"
      - name: repair_priority_score
        type: number
        source: computed
        description: "Repair prioritization score per calculations.leak_repair_priority"
      - name: priority_band
        type: enum
        source: computed
        description: "P1 | P2 | P3 band derived from repair_priority_score thresholds"
        constraints: "enum: P1, P2, P3"
      - name: annualized_loss_m3
        type: number
        source: computed
        description: "Annualized volume loss = estimated_loss_lps * 86400 * 365 / 1000"

  - name: CustomerMeter
    parent: DistrictMeteredArea
    common_fields: true
    fields:
      - name: dma_id
        type: string
        source: input
        description: "FK -> DistrictMeteredArea.id; the DMA where the meter is installed"
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial; unique across the utility"
        constraints: "unique"
      - name: size_mm
        type: integer
        source: input
        description: "Nominal meter size in millimetres"
        constraints: "enum-as-integer: one of 15, 20, 25, 40, 50, 100, 150"
      - name: installed_at
        type: datetime
        source: input
        description: "Installation date"
      - name: replacement_policy
        type: enum
        source: input
        description: "Replacement policy lane: AGE_BASED replaces when age >= AGE_LIMIT_YEARS; ACCURACY_BASED replaces on a FAILED accuracy test; HYBRID applies whichever triggers first"
        constraints: "enum: AGE_BASED, ACCURACY_BASED, HYBRID"
        default: ACCURACY_BASED
      - name: status
        type: enum
        source: system
        description: "IN_SERVICE -> FLAGGED_FOR_REPLACEMENT -> REPLACED; IN_SERVICE -> RETIRED"
        constraints: "enum: IN_SERVICE, FLAGGED_FOR_REPLACEMENT, REPLACED, RETIRED"
        default: IN_SERVICE
      - name: last_test_accuracy_pct
        type: number
        source: computed
        description: "Accuracy percentage from the most recent COMPLETED MeterAccuracyTest; null if none"
      - name: replacement_due
        type: boolean
        source: computed
        description: "True when the replacement policy triggers per calculations.meter_replacement_due"

  - name: MeterAccuracyTest
    parent: CustomerMeter
    common_fields: true
    fields:
      - name: meter_id
        type: string
        source: input
        description: "FK -> CustomerMeter.id; the meter under test"
      - name: tested_at
        type: datetime
        source: input
        description: "When the test was performed; must be >= meter.installed_at"
      - name: flow_rate_lps
        type: number
        source: input
        description: "Test flow rate, litres per second"
        constraints: "> 0"
      - name: registered_volume_m3
        type: number
        source: input
        description: "Volume registered by the meter during the test"
        constraints: "> 0"
      - name: reference_volume_m3
        type: number
        source: input
        description: "True volume from the reference apparatus"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> COMPLETED; SCHEDULED -> CANCELLED"
        constraints: "enum: SCHEDULED, COMPLETED, CANCELLED"
        default: SCHEDULED
      - name: accuracy_pct
        type: number
        source: computed
        description: "Accuracy = registered_volume_m3 / reference_volume_m3 * 100"
      - name: result
        type: enum
        source: computed
        description: "PASS when accuracy_pct >= ACCURACY_PASS_THRESHOLD and <= ACCURACY_OVER_CEILING; FAIL otherwise; null until COMPLETED"
        constraints: "enum: PASS, FAIL"

  - name: UnauthorizedConsumptionCase
    parent: DistrictMeteredArea
    common_fields: true
    fields:
      - name: dma_id
        type: string
        source: input
        description: "FK -> DistrictMeteredArea.id; the DMA where the suspected unauthorized consumption occurred"
      - name: service_location_ref
        type: string
        source: input
        description: "External reference of the service location under investigation"
      - name: opened_at
        type: datetime
        source: input
        description: "When the case was opened"
      - name: investigation_status
        type: enum
        source: system
        description: "Parallel dimension 1: OPEN -> EVIDENCE_GATHERING -> SUBSTANTIATED | UNFOUNDED -> CLOSED"
        constraints: "enum: OPEN, EVIDENCE_GATHERING, SUBSTANTIATED, UNFOUNDED, CLOSED"
        default: OPEN
      - name: billing_adjustment_status
        type: enum
        source: system
        description: "Parallel dimension 2: NONE -> PROPOSED -> APPROVED | REJECTED -> POSTED; only reachable when investigation_status == SUBSTANTIATED"
        constraints: "enum: NONE, PROPOSED, APPROVED, REJECTED, POSTED"
        default: NONE
      - name: estimated_loss_m3
        type: number
        source: input
        description: "Estimated unauthorized volume; required to transition investigation to SUBSTANTIATED"
        constraints: ">= 0"
        default: null
      - name: proposed_adjustment_amount
        type: number
        source: input
        description: "Back-billing amount proposed when billing_adjustment_status moves NONE -> PROPOSED"
        constraints: "> 0"
        default: null
      - name: substantiated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Investigator who substantiated the case (segregation anchor: substantiator may not approve the billing adjustment)"
      - name: posted_adjustment_amount
        type: number
        source: computed
        description: "Final posted amount; equals proposed_adjustment_amount when POSTED, else null"

  - name: PressureProject
    parent: DistrictMeteredArea
    common_fields: true
    fields:
      - name: dma_id
        type: string
        source: input
        description: "FK -> DistrictMeteredArea.id; the DMA whose pressure is managed"
      - name: name
        type: string
        source: input
        description: "Project name"
      - name: planned_start
        type: datetime
        source: input
        description: "Planned inclusive start of field work"
      - name: planned_end
        type: datetime
        source: input
        description: "Planned exclusive end; > planned_start"
      - name: baseline_pressure_m
        type: number
        source: input
        description: "Average zone pressure before intervention, metres of head"
        constraints: "> 0"
      - name: target_pressure_m
        type: number
        source: input
        description: "Target average zone pressure after intervention"
        constraints: "> 0 and < baseline_pressure_m"
      - name: status
        type: enum
        source: system
        description: "PROPOSED -> APPROVED -> ACTIVE -> COMMISSIONED; PROPOSED -> REJECTED; APPROVED -> REJECTED; COMMISSIONED is terminal"
        constraints: "enum: PROPOSED, APPROVED, REJECTED, ACTIVE, COMMISSIONED"
        default: PROPOSED
      - name: measured_pressure_m
        type: number
        source: input
        description: "Measured post-commissioning average pressure; required at COMMISSIONED transition; must be <= baseline_pressure_m"
        constraints: "> 0"
        default: null
      - name: pressure_reduction_pct
        type: number
        source: computed
        description: "Achieved reduction = (baseline_pressure_m - measured_pressure_m) / baseline_pressure_m * 100; null until COMMISSIONED"
      - name: estimated_leak_reduction_m3_per_year
        type: number
        source: computed
        description: "Estimated real-loss reduction via pressure-leakage exponent per calculations.pressure_leak_reduction"

  - name: InterventionProposal
    parent: DistrictMeteredArea
    common_fields: true
    fields:
      - name: dma_id
        type: string
        source: input
        description: "FK -> DistrictMeteredArea.id; the DMA the intervention targets"
      - name: kind
        type: enum
        source: input
        description: "Intervention class"
        constraints: "enum: LEAK_REPAIR_PROGRAM, METER_REPLACEMENT_PROGRAM, PRESSURE_MANAGEMENT, UNAUTHORIZED_USE_ENFORCEMENT"
      - name: capital_cost
        type: number
        source: input
        description: "Up-front cost of the intervention"
        constraints: ">= 0"
      - name: annual_om_cost
        type: number
        source: input
        description: "Recurring annual operating & maintenance cost"
        constraints: ">= 0"
      - name: expected_volume_saved_m3_per_year
        type: number
        source: input
        description: "Expected annual volume recovered"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> SUBMITTED -> APPROVED | REJECTED; APPROVED -> ARCHIVED when superseded by a newer APPROVED proposal of the same kind for the same DMA"
        constraints: "enum: DRAFT, SUBMITTED, APPROVED, REJECTED, ARCHIVED"
        default: DRAFT
      - name: benefit_cost_ratio
        type: number
        source: computed
        description: "BCR per calculations.intervention_benefit_cost; variant depends on status (PROVISIONAL in DRAFT/SUBMITTED, BANKABLE in APPROVED)"
      - name: payback_years
        type: number
        source: computed
        description: "Simple payback = capital_cost / max(annual_net_benefit, epsilon); null when annual net benefit <= 0"

  - name: BenchmarkReport
    parent: null
    common_fields: true
    fields:
      - name: reporting_year
        type: integer
        source: input
        description: "Calendar year the report covers"
        constraints: ">= 2000"
      - name: reporting_period_start
        type: datetime
        source: input
        description: "Inclusive start of the reporting window"
      - name: reporting_period_end
        type: datetime
        source: input
        description: "Exclusive end; > reporting_period_start"
      - name: dma_ids
        type: array
        source: input
        description: "FK -> DistrictMeteredArea.id (array); every DMA included in this report; each must have a FINALIZED WaterBalancePeriod fully inside the reporting window"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> SUBMITTED -> ACCEPTED | RETURNED; RETURNED -> SUBMITTED (resubmission cycle)"
        constraints: "enum: DRAFT, SUBMITTED, ACCEPTED, RETURNED"
        default: DRAFT
      - name: utility_nrw_pct
        type: number
        source: computed
        description: "Volume-weighted average NRW across included DMAs per calculations.benchmark_nrw_aggregation"
      - name: utility_ili
        type: number
        source: computed
        description: "Volume-weighted average ILI across included DMAs (only DMAs with non-null ili contribute)"
      - name: per_dma_breakdown
        type: array
        source: computed
        description: "Array of {dma_id, dma_code, nrw_pct, ili, real_loss_m3} snapshot rows frozen at SUBMITTED time"

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: entity_type
        type: string
        source: system
        description: "Name of the entity mutated"
      - name: entity_id
        type: string
        source: system
        description: "ID of the entity mutated"
      - name: action
        type: string
        source: system
        description: "Transition or operation name (e.g. SUBMIT, FINALIZE, REOPEN)"
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID of the actor"
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role of the actor"
      - name: detail
        type: object
        source: system
        description: "Before/after snapshot of changed fields"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DistrictMeteredArea
    initial_state: OPEN
    terminal_states: []
    transitions:
      # posture is a DERIVED field, not a user-driven machine: recomputed on every
      # child mutation per the posture rule on entities.DistrictMeteredArea.fields.posture.
      - from: OPEN
        to: RESTRICTED
        trigger: "system: derived when any child WaterBalancePeriod enters SUBMITTED or any child PressureProject enters ACTIVE"
        actor: system
        preconditions: ["a child transition listed above commits"]
        side_effects:
          - "DistrictMeteredArea.posture := RESTRICTED; version increments by 1"
        note: "Derived transition; no direct endpoint sets posture."
      - from: RESTRICTED
        to: OPEN
        trigger: "system: derived when no child WaterBalancePeriod remains in SUBMITTED and no child PressureProject remains ACTIVE"
        actor: system
        preconditions: ["the last gating child left the gating state"]
        side_effects:
          - "DistrictMeteredArea.posture := OPEN; version increments by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: derived when a BenchmarkReport whose dma_ids contains this DMA enters SUBMITTED or ACCEPTED"
        actor: system
        preconditions: ["BenchmarkReport transition to SUBMITTED commits"]
        side_effects:
          - "DistrictMeteredArea.posture := FROZEN; version increments by 1"
      - from: FROZEN
        to: OPEN
        trigger: "system: derived when the covering BenchmarkReport enters RETURNED and no other gating child states hold"
        actor: system
        preconditions: ["BenchmarkReport returned and no WaterBalancePeriod SUBMITTED and no PressureProject ACTIVE"]
        side_effects:
          - "DistrictMeteredArea.posture := OPEN; version increments by 1"

  - entity: WaterBalancePeriod
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /nrw/water-balance-periods/{id}/submit"
        actor: UtilityAnalyst
        preconditions:
          - "parent DMA posture != FROZEN"
          - "real_loss_m3 (computed) >= 0"
        side_effects:
          - "DistrictMeteredArea.posture recomputed (may move OPEN -> RESTRICTED)"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /nrw/water-balance-periods/{id}/finalize"
        actor: UtilityAnalyst
        preconditions:
          - "acting user's X-User-ID != created_by_user_id (segregation of duties)"
          - "parent DMA posture != FROZEN"
        side_effects:
          - "nrw_pct recomputed under AUDITED variant (calculations.water_balance_nrw)"
          - "ili computed (calculations.infrastructure_leakage_index)"
          - "DistrictMeteredArea.latest_nrw_pct := this period's nrw_pct if this period's period_end is the max period_end among FINALIZED siblings"
          - "DistrictMeteredArea.posture recomputed (may move RESTRICTED -> OPEN)"
          - "Every overlapping WaterBalancePeriod in DRAFT or SUBMITTED for the same DMA is rejected from future finalize via overlap check"
          - "AuditEvent appended"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: when a newer WaterBalancePeriod with overlapping window for the same DMA is finalized"
        actor: system
        preconditions: ["the replacement period's finalize commits"]
        side_effects:
          - "DistrictMeteredArea.latest_nrw_pct recomputed over remaining FINALIZED, non-SUPERSEDED siblings"
          - "AuditEvent appended"

  - entity: NightFlowAssessment
    initial_state: RECORDED
    terminal_states: [VOID, SUPERSEDED]
    transitions:
      - from: RECORDED
        to: ANALYZED
        trigger: "POST /nrw/night-flow-assessments/{id}/analyze"
        actor: UtilityAnalyst
        preconditions:
          - "status == RECORDED"
        side_effects:
          - "net_night_flow_lps, net_night_flow_pct, leak_signal computed (calculations.night_flow_signal)"
          - "if leak_signal == CRITICAL: DistrictMeteredArea.open_leak_count unchanged, but a LeakSurvey in PLANNED state is NOT auto-created (signal only); AuditEvent appended"
      - from: RECORDED
        to: VOID
        trigger: "POST /nrw/night-flow-assessments/{id}/void"
        actor: UtilityAnalyst
        preconditions: ["status == RECORDED"]
        side_effects: ["AuditEvent appended"]

  - entity: LeakSurvey
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_FIELD
        trigger: "POST /nrw/leak-surveys/{id}/start"
        actor: FieldSupervisor
        preconditions:
          - "parent DMA posture == OPEN"
          - "current logical clock time >= planned_start"
        side_effects: ["AuditEvent appended"]
      - from: IN_FIELD
        to: COMPLETED
        trigger: "POST /nrw/leak-surveys/{id}/complete"
        actor: FieldSupervisor
        preconditions:
          - "every child Leak is in a terminal state {VERIFIED_REPAIR, WITHDRAWN} OR in {REPORTED, VERIFIED, REPAIR_SCHEDULED, REOPENED} (non-terminal leaks are allowed; completion only freezes coverage)"
          - "coverage_pct supplied in request body"
        side_effects:
          - "LeakSurvey.coverage_pct := request value"
          - "AuditEvent appended"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /nrw/leak-surveys/{id}/cancel"
        actor: FieldSupervisor
        preconditions: ["no child Leak exists in any status"]
        side_effects: ["AuditEvent appended"]
      - from: IN_FIELD
        to: CANCELLED
        trigger: "POST /nrw/leak-surveys/{id}/cancel"
        actor: FieldSupervisor
        preconditions: ["every child Leak is in terminal state {VERIFIED_REPAIR, WITHDRAWN}"]
        side_effects:
          - "conditional cascade: only terminal children unaffected; AuditEvent appended"

  - entity: Leak
    initial_state: REPORTED
    terminal_states: [VERIFIED_REPAIR, WITHDRAWN]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /nrw/leaks/{id}/verify"
        actor: FieldSupervisor
        preconditions: ["parent LeakSurvey.status == IN_FIELD"]
        side_effects:
          - "repair_priority_score and priority_band recomputed (calculations.leak_repair_priority)"
          - "AuditEvent appended"
      - from: VERIFIED
        to: REPAIR_SCHEDULED
        trigger: "POST /nrw/leaks/{id}/schedule-repair"
        actor: FieldSupervisor
        preconditions: ["status == VERIFIED"]
        side_effects: ["AuditEvent appended"]
      - from: REPAIR_SCHEDULED
        to: REPAIRED
        trigger: "POST /nrw/leaks/{id}/complete-repair"
        actor: FieldSupervisor
        preconditions: ["actual_repair_cost supplied in request body"]
        side_effects:
          - "Leak.actual_repair_cost := request value"
          - "DistrictMeteredArea.open_leak_count recomputed"
          - "AuditEvent appended"
      - from: REPAIRED
        to: VERIFIED_REPAIR
        trigger: "POST /nrw/leaks/{id}/verify-repair"
        actor: FieldSupervisor
        preconditions:
          - "acting user's X-User-ID != reported_by_user_id (segregation of duties)"
        side_effects:
          - "DistrictMeteredArea.open_leak_count recomputed (leak leaves the open set)"
          - "bubble-up: if every sibling Leak under the survey is terminal AND survey.status == IN_FIELD, survey may be completed (not automatic; completion stays explicit)"
          - "AuditEvent appended"
      - from: REPAIRED
        to: REOPENED
        trigger: "POST /nrw/leaks/{id}/reopen"
        actor: FieldSupervisor
        preconditions: ["status == REPAIRED"]
        side_effects:
          - "repair_priority_score recomputed with REOPENED penalty multiplier (calculations.leak_repair_priority REOPEN_MULTIPLIER)"
          - "DistrictMeteredArea.open_leak_count recomputed"
          - "AuditEvent appended"
      - from: REOPENED
        to: REPAIR_SCHEDULED
        trigger: "POST /nrw/leaks/{id}/schedule-repair"
        actor: FieldSupervisor
        preconditions: ["status == REOPENED"]
        side_effects: ["AuditEvent appended"]
      - from: REPORTED
        to: WITHDRAWN
        trigger: "POST /nrw/leaks/{id}/withdraw"
        actor: FieldSupervisor
        preconditions: ["status == REPORTED"]
        side_effects:
          - "DistrictMeteredArea.open_leak_count recomputed"
          - "AuditEvent appended"
      - from: VERIFIED
        to: WITHDRAWN
        trigger: "POST /nrw/leaks/{id}/withdraw"
        actor: FieldSupervisor
        preconditions: ["status == VERIFIED"]
        side_effects:
          - "DistrictMeteredArea.open_leak_count recomputed"
          - "AuditEvent appended"

  - entity: CustomerMeter
    initial_state: IN_SERVICE
    terminal_states: [REPLACED, RETIRED]
    transitions:
      - from: IN_SERVICE
        to: FLAGGED_FOR_REPLACEMENT
        trigger: "system: replacement_due flips true (failed MeterAccuracyTest COMPLETED with result FAIL, or age policy trip at logical-clock advance), OR POST /nrw/customer-meters/{id}/flag-replacement"
        actor: MeterTechnician | system
        preconditions: ["status == IN_SERVICE"]
        side_effects:
          - "DistrictMeteredArea untouched (meters do not gate DMA posture)"
          - "AuditEvent appended"
      - from: FLAGGED_FOR_REPLACEMENT
        to: REPLACED
        trigger: "POST /nrw/customer-meters/{id}/replace"
        actor: MeterTechnician
        preconditions:
          - "status == FLAGGED_FOR_REPLACEMENT"
          - "replacement serial_number supplied and unique"
        side_effects:
          - "a new CustomerMeter row is created IN_SERVICE with the replacement serial, dma_id copied, installed_at := logical clock now; old row's status := REPLACED"
          - "AuditEvent appended on both rows"
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /nrw/customer-meters/{id}/retire"
        actor: MeterTechnician
        preconditions: ["status == IN_SERVICE", "no MeterAccuracyTest in SCHEDULED status for this meter"]
        side_effects: ["AuditEvent appended"]

  - entity: MeterAccuracyTest
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /nrw/meter-accuracy-tests/{id}/complete"
        actor: MeterTechnician
        preconditions:
          - "parent CustomerMeter.status IN {IN_SERVICE, FLAGGED_FOR_REPLACEMENT}"
          - "registered_volume_m3 and reference_volume_m3 supplied"
        side_effects:
          - "accuracy_pct and result computed"
          - "CustomerMeter.last_test_accuracy_pct := accuracy_pct"
          - "if result == FAIL and meter.replacement_policy IN {ACCURACY_BASED, HYBRID}: CustomerMeter.status := FLAGGED_FOR_REPLACEMENT (cross-entity cascade)"
          - "AuditEvent appended on both test and meter"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /nrw/meter-accuracy-tests/{id}/cancel"
        actor: MeterTechnician
        preconditions: ["status == SCHEDULED"]
        side_effects: ["AuditEvent appended"]

  - entity: UnauthorizedConsumptionCase
    initial_state: "OPEN (investigation) x NONE (billing)"
    terminal_states: ["CLOSED (investigation)"]
    transitions:
      # Parallel dimensions: investigation_status and billing_adjustment_status evolve
      # independently except billing moves are gated on SUBSTANTIATED.
      - from: OPEN
        to: EVIDENCE_GATHERING
        trigger: "POST /nrw/unauthorized-consumption-cases/{id}/begin-evidence"
        actor: Investigator
        preconditions: ["investigation_status == OPEN"]
        side_effects: ["AuditEvent appended"]
      - from: EVIDENCE_GATHERING
        to: SUBSTANTIATED
        trigger: "POST /nrw/unauthorized-consumption-cases/{id}/substantiate"
        actor: Investigator
        preconditions:
          - "investigation_status == EVIDENCE_GATHERING"
          - "estimated_loss_m3 supplied in request body"
        side_effects:
          - "estimated_loss_m3 := request value; substantiated_by_user_id := acting X-User-ID"
          - "the DMA's next DRAFT WaterBalancePeriod input suggestion uses this value (advisory only; no automatic write)"
          - "AuditEvent appended"
      - from: EVIDENCE_GATHERING
        to: UNFOUNDED
        trigger: "POST /nrw/unauthorized-consumption-cases/{id}/close-unfounded"
        actor: Investigator
        preconditions: ["investigation_status == EVIDENCE_GATHERING"]
        side_effects: ["AuditEvent appended"]
      - from: UNFOUNDED
        to: CLOSED
        trigger: "POST /nrw/unauthorized-consumption-cases/{id}/close"
        actor: Investigator
        preconditions: ["investigation_status == UNFOUNDED", "billing_adjustment_status == NONE"]
        side_effects: ["AuditEvent appended"]
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /nrw/unauthorized-consumption-cases/{id}/close"
        actor: Investigator
        preconditions: ["billing_adjustment_status IN {NONE, REJECTED, POSTED}"]
        side_effects: ["AuditEvent appended"]
      - from: NONE
        to: PROPOSED
        trigger: "POST /nrw/unauthorized-consumption-cases/{id}/propose-adjustment"
        actor: Investigator
        preconditions:
          - "investigation_status == SUBSTANTIATED"
          - "billing_adjustment_status == NONE"
          - "proposed_adjustment_amount supplied"
        side_effects: ["proposed_adjustment_amount := request value", "AuditEvent appended"]
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /nrw/unauthorized-consumption-cases/{id}/approve-adjustment"
        actor: ProgramDirector
        preconditions:
          - "billing_adjustment_status == PROPOSED"
          - "acting user's X-User-ID != substantiated_by_user_id (segregation of duties)"
        side_effects: ["AuditEvent appended"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /nrw/unauthorized-consumption-cases/{id}/reject-adjustment"
        actor: ProgramDirector
        preconditions: ["billing_adjustment_status == PROPOSED"]
        side_effects: ["AuditEvent appended"]
      - from: APPROVED
        to: POSTED
        trigger: "POST /nrw/unauthorized-consumption-cases/{id}/post-adjustment"
        actor: Investigator
        preconditions: ["billing_adjustment_status == APPROVED"]
        side_effects:
          - "posted_adjustment_amount := proposed_adjustment_amount"
          - "AuditEvent appended"

  - entity: PressureProject
    initial_state: PROPOSED
    terminal_states: [REJECTED, COMMISSIONED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /nrw/pressure-projects/{id}/approve"
        actor: ProgramDirector
        preconditions:
          - "status == PROPOSED"
          - "parent DMA posture == OPEN"
        side_effects: ["AuditEvent appended"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /nrw/pressure-projects/{id}/reject"
        actor: ProgramDirector
        preconditions: ["status == PROPOSED"]
        side_effects: ["AuditEvent appended"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /nrw/pressure-projects/{id}/activate"
        actor: ProgramDirector
        preconditions:
          - "status == APPROVED"
          - "current logical clock time >= planned_start"
        side_effects:
          - "DistrictMeteredArea.posture recomputed (OPEN -> RESTRICTED)"
          - "AuditEvent appended"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /nrw/pressure-projects/{id}/reject"
        actor: ProgramDirector
        preconditions: ["status == APPROVED"]
        side_effects: ["AuditEvent appended"]
      - from: ACTIVE
        to: COMMISSIONED
        trigger: "POST /nrw/pressure-projects/{id}/commission"
        actor: ProgramDirector
        preconditions:
          - "status == ACTIVE"
          - "measured_pressure_m supplied and <= baseline_pressure_m"
        side_effects:
          - "pressure_reduction_pct and estimated_leak_reduction_m3_per_year computed (calculations.pressure_leak_reduction)"
          - "DistrictMeteredArea.posture recomputed (RESTRICTED -> OPEN when nothing else gates)"
          - "AuditEvent appended"

  - entity: InterventionProposal
    initial_state: DRAFT
    terminal_states: [REJECTED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /nrw/intervention-proposals/{id}/submit"
        actor: UtilityAnalyst
        preconditions: ["parent DMA posture != FROZEN"]
        side_effects:
          - "benefit_cost_ratio recomputed under PROVISIONAL variant (calculations.intervention_benefit_cost)"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /nrw/intervention-proposals/{id}/approve"
        actor: ProgramDirector
        preconditions:
          - "status == SUBMITTED"
          - "benefit_cost_ratio >= BCR_APPROVAL_THRESHOLD (boundary: >= counts)"
        side_effects:
          - "benefit_cost_ratio recomputed under BANKABLE variant"
          - "cascade: every other InterventionProposal for the same DMA with same kind in status APPROVED moves to ARCHIVED"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /nrw/intervention-proposals/{id}/reject"
        actor: ProgramDirector
        preconditions: ["status == SUBMITTED"]
        side_effects: ["AuditEvent appended"]
      - from: APPROVED
        to: ARCHIVED
        trigger: "system: supersede cascade from a newer APPROVED proposal of same kind for same DMA"
        actor: system
        preconditions: ["the newer proposal's approve transition commits"]
        side_effects: ["AuditEvent appended"]

  - entity: BenchmarkReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /nrw/benchmark-reports/{id}/submit"
        actor: RegulatorLiaison
        preconditions:
          - "every DMA in dma_ids has a FINALIZED (non-SUPERSEDED) WaterBalancePeriod whose [period_start, period_end) is fully inside [reporting_period_start, reporting_period_end)"
          - "dma_ids is non-empty"
        side_effects:
          - "utility_nrw_pct, utility_ili, per_dma_breakdown computed and frozen (calculations.benchmark_nrw_aggregation)"
          - "cascade: every DMA in dma_ids posture recomputed (RESTRICTED -> FROZEN or OPEN -> FROZEN)"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /nrw/benchmark-reports/{id}/accept"
        actor: RegulatorLiaison
        preconditions: ["status == SUBMITTED"]
        side_effects: ["AuditEvent appended"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /nrw/benchmark-reports/{id}/return"
        actor: RegulatorLiaison
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "compensation: every DMA in dma_ids posture recomputed (FROZEN -> OPEN when nothing else gates)"
          - "AuditEvent appended"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /nrw/benchmark-reports/{id}/submit"
        actor: RegulatorLiaison
        preconditions:
          - "status == RETURNED"
          - "same finalized-balance precondition as DRAFT -> SUBMITTED"
        side_effects:
          - "utility_nrw_pct, utility_ili, per_dma_breakdown recomputed (snapshot refreshed)"
          - "cascade: DMA postures recomputed to FROZEN"
          - "AuditEvent appended"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: water-balance-submit-stale-dma
    parent_entity: DistrictMeteredArea
    write_endpoint: "POST /nrw/water-balance-periods"
    occ_field: "expected_dma_version"
    description: |
      Creating a WaterBalancePeriod against a DMA whose version has advanced
      since the client last observed it is rejected: the client may be building
      a balance on a stale posture/connection_count snapshot (e.g. another writer
      just submitted a balance for an overlapping window, which legitimately
      recomputed the DMA posture).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: benchmark-submit-stale-report
    parent_entity: BenchmarkReport
    write_endpoint: "POST /nrw/benchmark-reports/{id}/submit"
    occ_field: "expected_report_version"
    description: |
      Submitting a BenchmarkReport whose version has advanced since the client
      last observed it is rejected: another writer may have just returned the
      report and refreshed the DMA snapshot set, so the current writer's view of
      which balances feed the aggregation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: water_balance_nrw
    trigger: "on WaterBalancePeriod create (PROVISIONAL), on DRAFT->SUBMITTED recompute (PROVISIONAL), on SUBMITTED->FINALIZED recompute (AUDITED)"
    algorithm: aggregation
    formula: |
      nrw_volume_m3 = system_input_volume_m3 - billed_authorized_m3
      apparent_loss_m3 = unauthorized_consumption_m3 + metering_inaccuracy_m3
      real_loss_raw = nrw_volume_m3 - unbilled_authorized_m3 - apparent_loss_m3
      real_loss_m3 = max(real_loss_raw, 0)
      base_pct = nrw_volume_m3 / system_input_volume_m3 * 100
      PROVISIONAL: nrw_pct = round_half_up(base_pct, 2)
      AUDITED: nrw_pct = round_half_up(base_pct - confidence_adjustment, 2)
        where confidence_adjustment = min(AUDIT_CONFIDENCE_CREDIT_PCT,
                                          base_pct * AUDIT_CREDIT_CAP_FRACTION)
      (AUDITED credits verified field-audit work: a finalized balance reports a
       slightly lower NRW than the provisional number for identical inputs.)
    input_set: "the single WaterBalancePeriod row being computed; no cross-row aggregation"
    constants:
      AUDIT_CONFIDENCE_CREDIT_PCT: 0.50
      AUDIT_CREDIT_CAP_FRACTION: 0.10
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "status in {DRAFT, SUBMITTED}"
        difference: "no confidence adjustment; raw percentage reported"
      - name: AUDITED
        when: "status == FINALIZED (including rows later SUPERSEDED, which keep the value computed at finalize time)"
        difference: "subtracts min(0.50, base_pct * 0.10) percentage points"

  - name: infrastructure_leakage_index
    trigger: "on WaterBalancePeriod SUBMITTED->FINALIZED"
    algorithm: threshold
    formula: |
      uarl_m3_per_year = (UARL_A * connection_count + UARL_B * mains_length_km + UARL_C * connection_count * AVG_PRESSURE_M_DEFAULT) * AVG_PRESSURE_M_DEFAULT / 1000 * 365 / 365
      # simplified UARL (litres/connection/day form normalised to m3/year):
      uarl_m3_per_year = (18 * connection_count + 0.8 * mains_length_km * 1000 / 1000 + 25 * AVG_PRESSURE_M_DEFAULT * connection_count / connection_count) / 1000 * 365
      carl_m3_per_year = real_loss_m3 * (365 / period_days)
      period_days = (period_end - period_start).days
      ili_raw = carl_m3_per_year / uarl_m3_per_year
      ili = round_half_up(ili_raw, 2); floored at ILI_FLOOR 0.01 to avoid div-by-zero-shaped 0
    input_set: "the finalized WaterBalancePeriod plus parent DistrictMeteredArea {connection_count, mains_length_km}"
    constants:
      UARL_A: 18
      UARL_B: 0.8
      UARL_C: 25
      AVG_PRESSURE_M_DEFAULT: 40
      ILI_FLOOR: 0.01
    precision: "2 decimal places, round_half_up"

  - name: night_flow_signal
    trigger: "on NightFlowAssessment RECORDED->ANALYZED"
    algorithm: threshold
    formula: |
      net_night_flow_lps = max(measured_mnf_lps - expected_legitimate_night_use_lps, 0)
      if a FINALIZED non-SUPERSEDED WaterBalancePeriod exists for the DMA:
        avg_daily_inflow_lps = system_input_volume_m3 * 1000 / (period_days * 86400)
        net_night_flow_pct = net_night_flow_lps / avg_daily_inflow_lps * 100
      else:
        net_night_flow_pct = null
      leak_signal:
        CRITICAL if net_night_flow_lps >= MNF_CRITICAL_LPS OR (net_night_flow_pct is not null AND net_night_flow_pct >= MNF_CRITICAL_PCT)
        ELEVATED if net_night_flow_lps >= MNF_ELEVATED_LPS OR (net_night_flow_pct is not null AND net_night_flow_pct >= MNF_ELEVATED_PCT)
        NONE otherwise
      Boundary: thresholds are inclusive (>=).
    input_set: "the assessment row; latest FINALIZED WaterBalancePeriod of parent DMA selected by max period_end, tie-break by created_at ASC (earliest created wins ties)"
    constants:
      MNF_ELEVATED_LPS: 5.0
      MNF_CRITICAL_LPS: 15.0
      MNF_ELEVATED_PCT: 8.0
      MNF_CRITICAL_PCT: 20.0
    precision: "2 decimal places, round_half_up for pct; lps kept at input precision"

  - name: leak_repair_priority
    trigger: "on Leak create, on REPORTED->VERIFIED, on REPAIRED->REOPENED"
    algorithm: weighted_scoring
    formula: |
      annualized_loss_m3 = estimated_loss_lps * 86400 * 365 / 1000
      value_per_m3 = WATER_VALUE_PER_M3
      annual_value_loss = annualized_loss_m3 * value_per_m3
      cost_ratio = annual_value_loss / max(repair_cost_estimate, COST_EPSILON)
      base_score = min(100, cost_ratio * SCORE_SCALE)
      band multiplier: PRESSURE_BONUS when parent DMA has an ACTIVE PressureProject: score *= PRESSURE_PROJECT_MULTIPLIER
      if status == REOPENED (recompute at reopen): score *= REOPEN_MULTIPLIER
      repair_priority_score = round_half_up(score, 2)
      priority_band: P1 if repair_priority_score >= P1_THRESHOLD; P2 if >= P2_THRESHOLD; else P3 (inclusive boundaries)
    input_set: "the Leak row; parent LeakSurvey -> DistrictMeteredArea; ACTIVE PressureProject existence over the same DMA"
    constants:
      WATER_VALUE_PER_M3: 1.20
      COST_EPSILON: 1.0
      SCORE_SCALE: 2.0
      PRESSURE_PROJECT_MULTIPLIER: 1.25
      REOPEN_MULTIPLIER: 1.10
      P1_THRESHOLD: 50.0
      P2_THRESHOLD: 20.0
    precision: "2 decimal places, round_half_up"

  - name: meter_replacement_due
    trigger: "on MeterAccuracyTest COMPLETED (accuracy lane); on logical-clock advance crossing an install anniversary (age lane); on CustomerMeter create"
    algorithm: threshold
    formula: |
      age_years = (current_utc - installed_at).days / 365.25, truncated to integer
      age_trip = age_years >= AGE_LIMIT_YEARS
      accuracy_trip = (most recent COMPLETED test exists AND its result == FAIL)
      policy AGE_BASED: replacement_due = age_trip
      policy ACCURACY_BASED: replacement_due = accuracy_trip
      policy HYBRID: replacement_due = age_trip OR accuracy_trip
      Boundary: age limit is inclusive (>=). A test exactly at ACCURACY_PASS_THRESHOLD PASSES.
    input_set: "the CustomerMeter row plus its most recent COMPLETED MeterAccuracyTest (selected by max tested_at, tie-break by created_at ASC)"
    constants:
      AGE_LIMIT_YEARS: 15
      ACCURACY_PASS_THRESHOLD: 98.0
      ACCURACY_OVER_CEILING: 102.0
    precision: "accuracy_pct 2 decimal places, round_half_up"

  - name: pressure_leak_reduction
    trigger: "on PressureProject ACTIVE->COMMISSIONED"
    algorithm: constraint_propagation
    formula: |
      pressure_reduction_pct = (baseline_pressure_m - measured_pressure_m) / baseline_pressure_m * 100
      # leakage varies with pressure^N1 (FAVAD exponent)
      latest_finalized = latest FINALIZED non-SUPERSEDED WaterBalancePeriod for the DMA (max period_end, tie created_at ASC)
      if latest_finalized exists:
        estimated_leak_reduction_m3_per_year = latest_finalized.real_loss_m3 * (365 / period_days_of(latest_finalized)) * (1 - (measured_pressure_m / baseline_pressure_m) ** FAVAD_N1)
      else:
        estimated_leak_reduction_m3_per_year = null
      precision: pct 2 dp round_half_up; volume 0 dp round_half_up
    input_set: "the PressureProject row; latest FINALIZED WaterBalancePeriod of the parent DMA"
    constants:
      FAVAD_N1: 1.15
    precision: "pct 2 decimal places round_half_up; volume 0 decimal places round_half_up"

  - name: intervention_benefit_cost
    trigger: "on InterventionProposal create and DRAFT->SUBMITTED (PROVISIONAL); on SUBMITTED->APPROVED (BANKABLE)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: (1) gross benefit tiers, (2) discount, (3) costs, (4) ratio.
      annual_gross_benefit = expected_volume_saved_m3_per_year * marginal_value_per_m3(volume_tier)
        volume tiers on expected_volume_saved_m3_per_year:
          tier LOW (< TIER_LOW_MAX):  marginal_value_per_m3 = VALUE_LOW
          tier MID (>= TIER_LOW_MAX and < TIER_MID_MAX): marginal_value_per_m3 = VALUE_MID
          tier HIGH (>= TIER_MID_MAX): marginal_value_per_m3 = VALUE_HIGH
      horizon = ANALYSIS_HORIZON_YEARS
      discount rate r: PROVISIONAL uses R_PROVISIONAL; BANKABLE uses R_BANKABLE
      pv_factor = sum_{t=1..horizon} 1/(1+r)^t  (computed to 6 dp before use)
      pv_benefit = annual_gross_benefit * pv_factor
      pv_cost = capital_cost + annual_om_cost * pv_factor
      benefit_cost_ratio = round_half_up(pv_benefit / max(pv_cost, COST_FLOOR), 2)
      payback_years: annual_net_benefit = annual_gross_benefit - annual_om_cost;
        if annual_net_benefit <= 0 -> null else round_half_up(capital_cost / annual_net_benefit, 1)
    input_set: "the single InterventionProposal row"
    constants:
      TIER_LOW_MAX: 50000
      TIER_MID_MAX: 200000
      VALUE_LOW: 1.10
      VALUE_MID: 1.30
      VALUE_HIGH: 1.55
      ANALYSIS_HORIZON_YEARS: 20
      R_PROVISIONAL: 0.07
      R_BANKABLE: 0.04
      COST_FLOOR: 1.0
      BCR_APPROVAL_THRESHOLD: 1.00
    precision: "benefit_cost_ratio 2 dp round_half_up; payback_years 1 dp round_half_up; intermediate pv_factor 6 dp round_half_up"
    variants:
      - name: PROVISIONAL
        when: "status in {DRAFT, SUBMITTED}"
        difference: "discount rate 7% — screening-grade estimate"
      - name: BANKABLE
        when: "status == APPROVED (and ARCHIVED rows keep their approve-time value)"
        difference: "discount rate 4% — investment-grade; identical inputs yield a strictly higher BCR than PROVISIONAL"

  - name: benchmark_nrw_aggregation
    trigger: "on BenchmarkReport DRAFT->SUBMITTED and RETURNED->SUBMITTED"
    algorithm: waterfall_allocation
    formula: |
      # Per-DMA snapshot rows are frozen in per_dma_breakdown in a deterministic order:
      # sorted by dma.code ASC (lexicographic), tie impossible because code is unique.
      for each dma_id in dma_ids:
        bal = the FINALIZED, non-SUPERSEDED WaterBalancePeriod for that DMA fully inside the
              reporting window; if several qualify, select the one with max period_end,
              tie-break created_at ASC
        row = { dma_id, dma_code, nrw_pct: bal.nrw_pct, ili: bal.ili, real_loss_m3: bal.real_loss_m3 }
      utility_nrw_pct = sum(bal.nrw_volume_m3) / sum(bal.system_input_volume_m3) * 100
        (volume-weighted, NOT an arithmetic mean of percentages)
      utility_ili = sum(bal.real_loss_m3 annualized) / sum(bal UARL annualized) over DMAs with non-null ili;
        equivalently the volume-weighted harmonic-free aggregation: sum(carl)/sum(uarl)
      Both rounded 2 dp round_half_up.
    input_set: "BenchmarkReport row; for each listed DMA the selected FINALIZED WaterBalancePeriod"
    constants: {}
    precision: "2 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and every FK in the body (dma_id, survey_id, meter_id, dma_ids[]) resolves to an existing row; path ids validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "uniqueness constraints: DistrictMeteredArea.code unique; CustomerMeter.serial_number unique (including replacement serial at replace time)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /nrw/dmas, POST /nrw/customer-meters, POST /nrw/customer-meters/{id}/replace"
  - priority: 5
    category: state
    check: "state-machine precondition: the target entity is in a valid from-state for the invoked transition; terminal states reject every transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "DMA posture gate: child-creating or child-transitioning operations on WaterBalancePeriod, LeakSurvey, PressureProject, InterventionProposal require parent DMA posture != FROZEN; PressureProject approve additionally requires posture == OPEN"
    error_id: ERR_DMA_FROZEN
    http_status: 409
    applies_to: "POST /nrw/water-balance-periods, POST /nrw/water-balance-periods/{id}/submit, POST /nrw/water-balance-periods/{id}/finalize, POST /nrw/leak-surveys, POST /nrw/leak-surveys/{id}/start, POST /nrw/pressure-projects/{id}/approve, POST /nrw/intervention-proposals, POST /nrw/intervention-proposals/{id}/submit"
  - priority: 7
    category: business_safety
    check: "segregation of duties: finalize actor != WaterBalancePeriod.created_by_user_id; verify-repair actor != Leak.reported_by_user_id; approve-adjustment actor != UnauthorizedConsumptionCase.substantiated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /nrw/water-balance-periods/{id}/finalize, POST /nrw/leaks/{id}/verify-repair, POST /nrw/unauthorized-consumption-cases/{id}/approve-adjustment"
  - priority: 8
    category: business_temporal
    check: "interval arithmetic: period_end > period_start; window_end - window_start within [2h, 6h]; planned_end > planned_start; no overlap among same-DMA WaterBalancePeriods in {DRAFT, SUBMITTED, FINALIZED} (half-open, touching allowed); NightFlowAssessment windows per DMA non-overlapping WITH a 1-hour buffer (window_start >= max(prior window_end) + 1h); LeakSurvey planned windows per DMA non-overlapping among {PLANNED, IN_FIELD}"
    error_id: ERR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /nrw/water-balance-periods, POST /nrw/night-flow-assessments, POST /nrw/leak-surveys, POST /nrw/pressure-projects"
  - priority: 9
    category: business_constraint
    check: "scalar field constraints: volumes > 0 where required; percentages within range; enums valid; target_pressure_m < baseline_pressure_m; measured_pressure_m <= baseline_pressure_m; coverage_pct in (0, 100]"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all create/action endpoints with bodies"
  - priority: 10
    category: business_referential
    check: "cross-entity content rule: BenchmarkReport submit requires every listed DMA to have a qualifying FINALIZED WaterBalancePeriod fully inside the reporting window; substantiate requires estimated_loss_m3 present; complete-repair requires actual_repair_cost present; commission requires measured_pressure_m present"
    error_id: ERR_MISSING_PREREQUISITE
    http_status: 422
    applies_to: "POST /nrw/benchmark-reports/{id}/submit, POST /nrw/unauthorized-consumption-cases/{id}/substantiate, POST /nrw/leaks/{id}/complete-repair, POST /nrw/pressure-projects/{id}/commission"
  - priority: 11
    category: business_fiscal
    check: "InterventionProposal approve gate: computed benefit_cost_ratio (PROVISIONAL variant as last computed at submit) >= BCR_APPROVAL_THRESHOLD (1.00, inclusive)"
    error_id: ERR_BCR_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /nrw/intervention-proposals/{id}/approve"
  - priority: 12
    category: business_fiscal
    check: "water-balance consistency: real_loss_raw >= 0 (i.e. billed_authorized + unbilled_authorized + apparent losses <= system input) — checked at submit time against computed values"
    error_id: ERR_BALANCE_INCONSISTENT
    http_status: 422
    applies_to: "POST /nrw/water-balance-periods/{id}/submit"
  - priority: 13
    category: state
    check: "OCC: expected_dma_version / expected_report_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /nrw/water-balance-periods, POST /nrw/benchmark-reports/{id}/submit"
  - priority: 14
    category: business_constraint
    check: "cancel semantics: LeakSurvey cancel from PLANNED requires zero child Leaks; cancel from IN_FIELD requires all child Leaks terminal"
    error_id: ERR_CHILDREN_OPEN
    http_status: 409
    applies_to: "POST /nrw/leak-surveys/{id}/cancel"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/nrw/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["age-based meter replacement_due recomputed for all CustomerMeter rows with policy in {AGE_BASED, HYBRID}; meters crossing AGE_LIMIT_YEARS flip to FLAGGED_FOR_REPLACEMENT"]

  # --- DistrictMeteredArea ---
  - method: POST
    path: "/nrw/dmas"
    description: "Create a DMA"
    roles: [ProgramDirector]
    code: 201
    input: [code, name, connection_count, mains_length_km, target_nrw_pct]
    output: DistrictMeteredArea
    side_effects: ["posture initialized OPEN"]
  - method: GET
    path: "/nrw/dmas"
    description: "List DMAs with pagination and optional filters"
    roles: [ProgramDirector, UtilityAnalyst, FieldSupervisor, MeterTechnician, Investigator, RegulatorLiaison]
    code: 200
    input: ["posture?", "code?", "limit?", "offset?"]
    output: DistrictMeteredArea[]
    side_effects: []
  - method: GET
    path: "/nrw/dmas/{id}"
    description: "Fetch one DMA including computed posture, latest_nrw_pct, open_leak_count"
    roles: [ProgramDirector, UtilityAnalyst, FieldSupervisor, MeterTechnician, Investigator, RegulatorLiaison]
    code: 200
    input: []
    output: DistrictMeteredArea
    side_effects: []
  - method: GET
    path: "/nrw/dmas/{id}/water-balance-periods"
    description: "List balance periods of a DMA (reverse-reachability for WaterBalancePeriod.dma_id)"
    roles: [ProgramDirector, UtilityAnalyst, RegulatorLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WaterBalancePeriod[]
    side_effects: []
  - method: GET
    path: "/nrw/dmas/{id}/night-flow-assessments"
    description: "List night-flow assessments of a DMA"
    roles: [ProgramDirector, UtilityAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: NightFlowAssessment[]
    side_effects: []
  - method: GET
    path: "/nrw/dmas/{id}/leak-surveys"
    description: "List leak surveys of a DMA"
    roles: [ProgramDirector, UtilityAnalyst, FieldSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LeakSurvey[]
    side_effects: []
  - method: GET
    path: "/nrw/dmas/{id}/customer-meters"
    description: "List meters of a DMA"
    roles: [ProgramDirector, MeterTechnician, UtilityAnalyst]
    code: 200
    input: ["status?", "replacement_due?", "limit?", "offset?"]
    output: CustomerMeter[]
    side_effects: []
  - method: GET
    path: "/nrw/dmas/{id}/unauthorized-consumption-cases"
    description: "List unauthorized-consumption cases of a DMA"
    roles: [ProgramDirector, Investigator]
    code: 200
    input: ["investigation_status?", "billing_adjustment_status?", "limit?", "offset?"]
    output: UnauthorizedConsumptionCase[]
    side_effects: []
  - method: GET
    path: "/nrw/dmas/{id}/pressure-projects"
    description: "List pressure projects of a DMA"
    roles: [ProgramDirector, UtilityAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PressureProject[]
    side_effects: []
  - method: GET
    path: "/nrw/dmas/{id}/intervention-proposals"
    description: "List intervention proposals of a DMA"
    roles: [ProgramDirector, UtilityAnalyst]
    code: 200
    input: ["status?", "kind?", "limit?", "offset?"]
    output: InterventionProposal[]
    side_effects: []

  # --- WaterBalancePeriod ---
  - method: POST
    path: "/nrw/water-balance-periods"
    description: "Create a water balance period (DRAFT) with OCC against the parent DMA"
    roles: [UtilityAnalyst]
    code: 201
    input: [dma_id, period_start, period_end, system_input_volume_m3, billed_authorized_m3, unbilled_authorized_m3, unauthorized_consumption_m3, metering_inaccuracy_m3, expected_dma_version]
    output: WaterBalancePeriod
    side_effects:
      - "computed fields nrw_volume_m3, nrw_pct (PROVISIONAL), apparent_loss_m3, real_loss_m3 populated"
      - "increments DistrictMeteredArea.version by 1"
      - "AuditEvent appended"
  - method: GET
    path: "/nrw/water-balance-periods"
    description: "List balance periods with filters"
    roles: [ProgramDirector, UtilityAnalyst, RegulatorLiaison]
    code: 200
    input: ["dma_id?", "status?", "limit?", "offset?"]
    output: WaterBalancePeriod[]
    side_effects: []
  - method: GET
    path: "/nrw/water-balance-periods/{id}"
    description: "Fetch one balance period"
    roles: [ProgramDirector, UtilityAnalyst, RegulatorLiaison]
    code: 200
    input: []
    output: WaterBalancePeriod
    side_effects: []
  - method: POST
    path: "/nrw/water-balance-periods/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [UtilityAnalyst]
    code: 200
    input: []
    output: WaterBalancePeriod
    side_effects: ["DMA posture recomputed", "AuditEvent appended", "increments WaterBalancePeriod.version by 1"]
  - method: POST
    path: "/nrw/water-balance-periods/{id}/finalize"
    description: "SUBMITTED -> FINALIZED with segregation-of-duties check"
    roles: [UtilityAnalyst]
    code: 200
    input: []
    output: WaterBalancePeriod
    side_effects:
      - "nrw_pct recomputed under AUDITED variant; ili computed"
      - "DistrictMeteredArea.latest_nrw_pct recomputed; posture recomputed"
      - "overlapping FINALIZED siblings superseded"
      - "increments WaterBalancePeriod.version by 1 and DistrictMeteredArea.version by 1"
      - "AuditEvent appended"

  # --- NightFlowAssessment ---
  - method: POST
    path: "/nrw/night-flow-assessments"
    description: "Record a minimum-night-flow assessment window (RECORDED)"
    roles: [UtilityAnalyst]
    code: 201
    input: [dma_id, window_start, window_end, measured_mnf_lps, expected_legitimate_night_use_lps]
    output: NightFlowAssessment
    side_effects: ["AuditEvent appended"]
  - method: GET
    path: "/nrw/night-flow-assessments/{id}"
    description: "Fetch one assessment"
    roles: [ProgramDirector, UtilityAnalyst]
    code: 200
    input: []
    output: NightFlowAssessment
    side_effects: []
  - method: POST
    path: "/nrw/night-flow-assessments/{id}/analyze"
    description: "RECORDED -> ANALYZED; computes net flows and leak_signal"
    roles: [UtilityAnalyst]
    code: 200
    input: []
    output: NightFlowAssessment
    side_effects: ["calculations.night_flow_signal applied", "AuditEvent appended"]
  - method: POST
    path: "/nrw/night-flow-assessments/{id}/void"
    description: "RECORDED -> VOID"
    roles: [UtilityAnalyst]
    code: 200
    input: []
    output: NightFlowAssessment
    side_effects: ["AuditEvent appended"]

  # --- LeakSurvey ---
  - method: POST
    path: "/nrw/leak-surveys"
    description: "Plan a leak survey (PLANNED)"
    roles: [FieldSupervisor]
    code: 201
    input: [dma_id, planned_start, planned_end, method, crew_lead_user_id]
    output: LeakSurvey
    side_effects: ["AuditEvent appended"]
  - method: GET
    path: "/nrw/leak-surveys/{id}"
    description: "Fetch one survey"
    roles: [ProgramDirector, UtilityAnalyst, FieldSupervisor]
    code: 200
    input: []
    output: LeakSurvey
    side_effects: []
  - method: GET
    path: "/nrw/leak-surveys/{id}/leaks"
    description: "List leaks of a survey (reverse-reachability for Leak.survey_id)"
    roles: [ProgramDirector, UtilityAnalyst, FieldSupervisor]
    code: 200
    input: ["status?", "priority_band?", "limit?", "offset?"]
    output: Leak[]
    side_effects: []
  - method: POST
    path: "/nrw/leak-surveys/{id}/start"
    description: "PLANNED -> IN_FIELD (requires DMA posture OPEN and clock >= planned_start)"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: LeakSurvey
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/leak-surveys/{id}/complete"
    description: "IN_FIELD -> COMPLETED with coverage_pct"
    roles: [FieldSupervisor]
    code: 200
    input: [coverage_pct]
    output: LeakSurvey
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/leak-surveys/{id}/cancel"
    description: "PLANNED|IN_FIELD -> CANCELLED with child-state guard"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: LeakSurvey
    side_effects: ["AuditEvent appended"]

  # --- Leak ---
  - method: POST
    path: "/nrw/leaks"
    description: "Report a leak under a survey (REPORTED); survey must be IN_FIELD"
    roles: [FieldSupervisor]
    code: 201
    input: [survey_id, location_description, estimated_loss_lps, detected_at, repair_cost_estimate]
    output: Leak
    side_effects:
      - "repair_priority_score, priority_band, annualized_loss_m3 computed"
      - "DistrictMeteredArea.open_leak_count recomputed"
      - "AuditEvent appended"
  - method: GET
    path: "/nrw/leaks"
    description: "List leaks with filters (cross-survey repair backlog view)"
    roles: [ProgramDirector, UtilityAnalyst, FieldSupervisor]
    code: 200
    input: ["survey_id?", "dma_id?", "status?", "priority_band?", "limit?", "offset?"]
    output: Leak[]
    side_effects: []
  - method: GET
    path: "/nrw/leaks/{id}"
    description: "Fetch one leak"
    roles: [ProgramDirector, UtilityAnalyst, FieldSupervisor]
    code: 200
    input: []
    output: Leak
    side_effects: []
  - method: POST
    path: "/nrw/leaks/{id}/verify"
    description: "REPORTED -> VERIFIED"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: Leak
    side_effects: ["repair_priority_score recomputed", "AuditEvent appended"]
  - method: POST
    path: "/nrw/leaks/{id}/schedule-repair"
    description: "VERIFIED|REOPENED -> REPAIR_SCHEDULED"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: Leak
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/leaks/{id}/complete-repair"
    description: "REPAIR_SCHEDULED -> REPAIRED with actual_repair_cost"
    roles: [FieldSupervisor]
    code: 200
    input: [actual_repair_cost]
    output: Leak
    side_effects: ["DistrictMeteredArea.open_leak_count recomputed", "AuditEvent appended"]
  - method: POST
    path: "/nrw/leaks/{id}/verify-repair"
    description: "REPAIRED -> VERIFIED_REPAIR; actor must differ from reported_by_user_id"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: Leak
    side_effects: ["DistrictMeteredArea.open_leak_count recomputed", "AuditEvent appended"]
  - method: POST
    path: "/nrw/leaks/{id}/reopen"
    description: "REPAIRED -> REOPENED (rework cycle; score penalty)"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: Leak
    side_effects: ["repair_priority_score recomputed with REOPEN_MULTIPLIER", "DistrictMeteredArea.open_leak_count recomputed", "AuditEvent appended"]
  - method: POST
    path: "/nrw/leaks/{id}/withdraw"
    description: "REPORTED|VERIFIED -> WITHDRAWN"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: Leak
    side_effects: ["DistrictMeteredArea.open_leak_count recomputed", "AuditEvent appended"]

  # --- CustomerMeter ---
  - method: POST
    path: "/nrw/customer-meters"
    description: "Register a customer meter (IN_SERVICE)"
    roles: [MeterTechnician]
    code: 201
    input: [dma_id, serial_number, size_mm, installed_at, "replacement_policy?"]
