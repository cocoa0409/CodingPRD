        distinguishing_aspect: "The aggregate is driven by block_id and scheduling_status, not by the practice's case list: two held cases of 60 and 30 minutes give committed 90 of 240 (37.50%), while a third DRAFT case that never held the block contributes nothing at all."
        test_recipe:
