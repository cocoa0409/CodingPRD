              captures: { loyalty_state: $.data.state }
            - call: "POST /kiosk-ops/campaign-versions/${autumn2_id}/actions"
              payload: { action: "SCHEDULE" }
              as: ContentManager
              captures: { autumn2_state: $.data.state }
          assert:
            - "${summer_state} == SCHEDULED and ${summer_pin} == 1"
            - "AUTUMN10 v1 returns HTTP 409 with error_id == ERR_CAMPAIGN_WINDOW_CONFLICT — the closed windows share the single instant 2026-08-20T00:00:00Z"
            - "${loyalty_state} == SCHEDULED: the identical window in stacking_group LOYALTY does NOT conflict, so the check is scoped to (cluster_id, stacking_group)"
            - "${autumn2_state} == SCHEDULED: moving the start to 2026-08-20T00:01:00Z removes the only point of intersection"
            - "PromoCampaignVersion.${autumn_id}.state is still DRAFT and SUMMER15 v1 is still SCHEDULED (it was not superseded by a different campaign_code)"

  - rule_id: compensating_invariant
    instances:

      - name: price_rollback_restores_zone_override_total_and_cache_freshness
        grounds:
          - state_machines.PriceChangeRequest.APPLIED_to_ROLLED_BACK
          - entities.MenuItem.fields.zone_override_total_cents
          - entities.Device.fields.cache_state
          - entities.Store.fields.content_posture
        distinguishing_aspect: |
          Conserved quantity: MONEY — MenuItem.zone_override_total_cents, the sum of the
          item's zone price overrides. ROLLBACK must return it to its pre-APPLY value of 0
          and unwind the whole four-link forward cascade (bundle stale_flag, device
          cache_state, store content_posture) with no drift, while MenuItem.version keeps
          moving forward and the audit trail keeps both legs.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001; a PUBLISHED bundle cached FRESH by kiosk K001, so Store.content_posture is OPEN and MenuItem.zone_override_total_cents is 0."
            - "A PriceChangeRequest on Item A proposing 590 is SUBMITTED, APPROVED by two distinct approvers and APPLIED, so the override is 599, the bundle is stale, the device cache is STALE and the store is DEGRADED."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id, total_before: $.data.zone_override_total_cents }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bundle_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bundle_ver}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "VALIDATE" }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "PUBLISH" }
              as: ContentManager
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /kiosk-ops/devices/${dev_id}/payment-attestation"
              payload: { pin_pad_firmware_version: "1.4.2", p2pe_certified: true, attestation_expiry_utc: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/devices/${dev_id}/heartbeat"
              payload: { printer_ok: true, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${dev_id}"
            - call: "POST /kiosk-ops/devices/${dev_id}/cache-sync"
              payload: { bundle_id: "${bundle_id}" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
            - call: "GET /kiosk-ops/menu-items/${item_a_id}"
              payload: {}
              as: PricingAnalyst
              captures: { item_a_ver: $.data.version }
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_a_id}", proposed_price_cents: 590, justification: "Beef cost increase", effective_from_utc: "2026-08-05T17:00:00Z", expected_menu_item_version: "${item_a_ver}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { pcr_id: $.data.id, baseline: $.data.baseline_price_cents }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "SUBMIT" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE" }
              as: PricingApprover
              as_user_id: "u_approver_1"
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE" }
              as: PricingApprover
              as_user_id: "u_approver_2"
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPLY" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
            - call: "GET /kiosk-ops/menu-items/${item_a_id}"
              payload: {}
              as: PricingAnalyst
              captures: { total_applied: $.data.zone_override_total_cents, ver_applied: $.data.version }
          trigger:
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "ROLLBACK" }
              as: PricingApprover
              as_user_id: "u_approver_1"
              captures: { rolled_state: $.data.state }
          assert:
            - "${total_before} == 0 and ${total_applied} == 599 (the forward leg moved the conserved quantity)"
            - "${rolled_state} == ROLLED_BACK and PriceChangeRequest.${pcr_id}.applied_price_cents is retained as 599 for the audit trail"
            - "MenuItem.${item_a_id}.zone_override_total_cents is back to 0 and zone_price_overrides is empty — exact restoration, not an approximation"
            - "MenuItem.${item_a_id}.version == ${ver_applied} + 1: compensation still advances the version, it does not rewind it"
            - "ContentBundle.${bundle_id}.stale_flag == false, Device.${dev_id}.cache_state == FRESH and Store.${store_id}.content_posture == OPEN"
            - "GET /kiosk-ops/stores/${store_id}/menu-projection reports stale_prices false and the item priced at 559 again"
            - "GET /kiosk-ops/audit-events?subject_kind=MENU_ITEM contains BOTH a PRICE_OVERRIDE_APPLIED (559 -> 599) and a PRICE_OVERRIDE_ROLLED_BACK (599 -> 559) event; nothing is deleted"

      - name: order_void_conserves_reserved_units_but_retires_the_order_number
        grounds:
          - state_machines.OrderHandoff.handoff_state=QUEUED_TO_KITCHEN_to_handoff_state=VOIDED
          - entities.StoreItemAvailability.fields.reserved_units
          - entities.Store.fields.daily_order_seq_counter
          - calculations.order_number_and_receipt
        distinguishing_aspect: |
          A different conserved quantity: PHYSICAL UNIT RESERVATIONS. reserved_units,
          available_units and Store.open_order_count are fully restored, but the monotonic
          Store.daily_order_seq_counter is explicitly NOT conserved — the order number is
          retired, so a later order gets S001-0002 and never reuses S001-0001. The instance
          therefore asserts one quantity restored and one deliberately not restored.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001; a PUBLISHED LUNCH bundle over ENTREE cached FRESH by attested kiosk K001, Store.content_posture OPEN."
            - "Item A has 40 on hand, 0 reserved, par 20, so available_units is 40 and Store.daily_order_seq_counter is 0."
            - "A CARD order for 4 x Item A is captured: subtotal 2236, no campaign, tax 196, total 2432, order_number S001-0001, 4 units reserved."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id, seq_before: $.data.daily_order_seq_counter }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bundle_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bundle_ver}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "VALIDATE" }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "PUBLISH" }
              as: ContentManager
            - call: "POST /kiosk-ops/stores/${store_id}/item-availabilities"
              payload: { menu_item_id: "${item_a_id}", on_hand_units: 40, reserved_units: 0, par_units: 20 }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { avail_a_id: $.data.id, avail_before: $.data.available_units }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /kiosk-ops/devices/${dev_id}/payment-attestation"
              payload: { pin_pad_firmware_version: "1.4.2", p2pe_certified: true, attestation_expiry_utc: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/devices/${dev_id}/heartbeat"
              payload: { printer_ok: true, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${dev_id}"
            - call: "POST /kiosk-ops/devices/${dev_id}/cache-sync"
              payload: { bundle_id: "${bundle_id}" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
            - call: "POST /kiosk-ops/devices/${dev_id}/orders"
              payload: { line_items: [{ menu_item_id: "${item_a_id}", qty: 4 }], tender_kind: "CARD" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
              captures: { order_id: $.data.id, order_number: $.data.order_number, total: $.data.total_cents }
            - call: "GET /kiosk-ops/item-availabilities/${avail_a_id}"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { reserved_during: $.data.reserved_units, avail_during: $.data.available_units }
          trigger:
            - call: "POST /kiosk-ops/order-handoffs/${order_id}/actions"
              payload: { action: "VOID", void_reason: "Guest abandoned the order" }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { handoff_after: $.data.handoff_state, payment_after: $.data.payment_state }
            - call: "POST /kiosk-ops/devices/${dev_id}/orders"
              payload: { line_items: [{ menu_item_id: "${item_a_id}", qty: 1 }], tender_kind: "CASH" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
              captures: { next_number: $.data.order_number }
          assert:
            - "${seq_before} == 0, ${order_number} == S001-0001 and ${total} == 2432 (4 x 559 = 2236 plus 196 tax)"
            - "${reserved_during} == 4 and ${avail_during} == 36 before the void, versus ${avail_before} == 40"
            - "${handoff_after} == VOIDED and ${payment_after} == VOIDED (the void moves both dimensions of the parallel pair)"
            - "StoreItemAvailability.${avail_a_id}.reserved_units == 0, available_units == 40, supply_state == IN_STOCK and availability_state == AVAILABLE — the unit reservation is conserved exactly"
            - "Store.${store_id}.open_order_count == 1 after the second order (it was decremented to 0 by the void, then incremented again)"
            - "${next_number} == S001-0002: Store.daily_order_seq_counter was NOT decremented, so S001-0001 is permanently retired"
            - "OrderHandoff.${order_id}.total_cents is still 2432 (the money on the voided ticket is preserved for the audit trail) and GET /kiosk-ops/audit-events?subject_kind=ORDER_HANDOFF contains ORDER_VOIDED with before_value_cents 2432 and after_value_cents 0"
