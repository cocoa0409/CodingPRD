            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "POST /communities/${com}/incentives", payload: {type: "PRICE_CUT", value_cents: 500000, window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z"}, as: COMMUNITY_MANAGER, captures: {inc1: $.data.id} }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "GET /communities/${com}/incentives", as: COMMUNITY_MANAGER, captures: {st_before: "$.data[0].status"} }
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: DIVISION_PRESIDENT }
            - { call: "GET /homes/${h1}", as: COMMUNITY_MANAGER, captures: {net_active: $.data.net_effective_price_cents} }
            - { call: "POST /incentives/${inc1}/cancel", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "GET /homes/${h1}", as: COMMUNITY_MANAGER, captures: {net_cancelled: $.data.net_effective_price_cents} }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-09-21T00:00:00Z"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/incentives", as: COMMUNITY_MANAGER, captures: {st_after: "$.data[0].status"} }
            - { call: "GET /homes/${h1}", as: COMMUNITY_MANAGER, captures: {net_expired: $.data.net_effective_price_cents} }
          assert:
            - "status == SCHEDULED at clock 2026-09-01 (net 40,000,000 implied)"
            - "status ACTIVE at 2026-09-10: net_effective_price_cents == 39500000"
            - "after cancel: net_effective_price_cents == 40000000 immediately"
            - "at 2026-09-21 the cancelled incentive reads CANCELLED (not EXPIRED) and net stays 40,000,000"

