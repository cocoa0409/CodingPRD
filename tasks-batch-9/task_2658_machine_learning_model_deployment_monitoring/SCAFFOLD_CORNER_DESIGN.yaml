              captures: { new_due: $.data.revalidation_due_at, still_approved: $.data.approval_state }
            - call: "GET /revalidation-tasks/${task_id}"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { task_read_status: $.data.status, task_read_reviewer: $.data.reviewer_user_id, task_read_findings: $.data.findings }
          assert:
            - "the version records decided_by_user_id 'u_appr_1' and revalidation_due_at '2026-10-30T00:00:00Z'"
            - "the sweep at 2026-10-30 created exactly 1 DUE task for it"
            - "PRIORITY 22: START_REVIEW from u_appr_1 returns HTTP 403 'ERR_SEGREGATION_OF_DUTIES' — the id is compared against the VERSION's decided_by_user_id, an entity hop away from the task"
            - "the same id acting as PlatformAdmin is refused identically, so switching to the other permitted role does not launder the identity"
            - "u_appr_2 takes the task: status 'IN_REVIEW' with reviewer_user_id 'u_appr_2'"
            - "ONLY START_REVIEW CARRIES THE RULE: the subsequent PASS from u_appr_1 succeeds, moving the task to 'PASSED'"
            - "the PASS_ANCHOR variant then re-dates the version: revalidation_due_at becomes '2027-01-28T00:00:00Z' (clock 2026-10-30 + 90 days) and approval_state stays 'APPROVED'"
