      - name: facilitator_conflict_beats_duplicate_org_on_interview_create
        grounds:
          - validations.priority_15.ERR_FACILITATOR_WINDOW_CONFLICT
          - validations.priority_18.ERR_DUPLICATE_ORGANIZATION
          - calculations.facilitator_buffer_overlap
        distinguishing_aspect: |
          A single POST /stakeholder-interviews body re-uses an organization
          name that is already scheduled AND lands inside the facilitator's
          30-minute buffer, so the temporal rule at priority 15 and the
          uniqueness rule at priority 18 are both violated; the temporal rule
          must win. Sliding the same duplicate name out of the buffer window
          (start exactly 30 minutes after the existing session ends) leaves
          only the uniqueness rule, and changing the name as well succeeds —
          so neither rule is masking the other by accident.
        test_recipe:
          setup:
            - "AssessmentCycle in INPUT_GATHERING with posture OPEN"
            - "one INTERNAL ResponsibleParty acting as facilitator"
            - "one SCHEDULED StakeholderInterview for \"Riverbend Free Clinic\" from 2026-04-06T14:00:00Z to 2026-04-06T15:00:00Z with that facilitator"
