          trigger:
            - call: "POST /channel-orders"
              payload: { product_line_id: "${pl_a}", channel_type: "DISTRIBUTOR", priority_tier: "CONTRACT", requested_sqft: 8800.00, required_by: "2026-08-20T00:00:00Z" }
              as: ChannelBuyer
              as_user_id: "cb-1"
