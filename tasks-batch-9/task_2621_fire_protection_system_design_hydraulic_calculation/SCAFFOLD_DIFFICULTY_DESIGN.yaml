              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0, room_area_sqft: 3000.0, enclosure_rating_hours: 2.0, room_has_unprotected_opening: false }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stair 1 and 2 standpipes", riser_count: 2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux1: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", method: "AREA_DENSITY", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc1: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 1, pipe_size_in: "2", length_ft: 150.0, fitting_equivalent_ft: 40.0, flow_gpm: 110.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 2, pipe_size_in: "4", length_ft: 90.0, fitting_equivalent_ft: 5.0, flow_gpm: 420.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-14", static_psi: 80.0, residual_psi: 64.0, flow_gpm: 2250.0, tested_at: "2026-05-14T15:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft1: $.data.id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 3, pipe_size_in: "6", length_ft: 60.0, fitting_equivalent_ft: 5.0, flow_gpm: 880.0, elevation_change_ft: 8.0, is_supply_connection: true }
              as: DesignEngineer
              as_user_id: "${e1}"
          trigger:
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "FOAM_DELUGE", label: "Flammable liquids dock", protected_area_sqft: 3000.0, agent_type: "AFFF" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux_foam: $.data.id }
