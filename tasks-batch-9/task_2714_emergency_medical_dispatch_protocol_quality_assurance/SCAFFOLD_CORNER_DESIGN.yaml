  - section: validations
    instances:
      - name: weights_that_do_not_sum_to_one_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_18_business_constraint
          - errors.ERR_WEIGHTS_NOT_NORMALIZED
          - endpoints.POST_/audit-programs/{id}/protocol-versions
        distinguishing_aspect: "The four section weights must sum to exactly 1.0000 at 4 dp, so 0.2500 + 0.2500 + 0.2500 + 0.2000 (sum 0.9500) is refused with 422 ERR_WEIGHTS_NOT_NORMALIZED and no DRAFT version is persisted."
        test_recipe:
          setup:
            - "One program with no protocol versions."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2500, key_questions_weight: 0.2500, pre_arrival_weight: 0.2500, final_coding_weight: 0.2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP 422 and data.error_id == ERR_WEIGHTS_NOT_NORMALIZED"
            - "GET /audit-programs/${prog_id}/protocol-versions returns 0 elements"
            - "A weight sum of 1.0001 is refused the same way, and a negative weight is refused with ERR_WEIGHTS_NOT_NORMALIZED as well"
            - "Control — 0.2500 / 0.2500 / 0.2500 / 0.2500 is accepted with 201 and status DRAFT"

      - name: a_call_received_exactly_at_the_logical_clock_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_65_business_temporal
          - errors.ERR_CALL_RECEIVED_IN_FUTURE
        distinguishing_aspect: "The temporal envelope is 'received_at is not AFTER the clock', so received_at exactly equal to the logical clock must succeed while one second later must fail — the comparison is strict, not tolerant."
        test_recipe:
          setup:
            - "One program with one dispatcher and the logical clock parked at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-001", full_name: "Ada Rune" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-EQ-1", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_eq_id: $.data.id }
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-EQ-2", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:01Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "The first call returns 201 with data.status == INGESTED and data.received_at == 2026-08-05T09:00:00.000Z"
            - "The second call returns 422 with data.error_id == ERR_CALL_RECEIVED_IN_FUTURE"
            - "GET /dispatchers/${d1_id}/call-records returns exactly 1 element, ${c_eq_id}"

      - name: targeting_a_call_from_another_program_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_45_business_referential
          - errors.ERR_PROGRAM_SCOPE_MISMATCH
        distinguishing_aspect: "Validity depends on a third entity: the CallRecord exists and its call_type matches the period, but its dispatcher belongs to program B while the period belongs to program A, so the priority-45 scope check must fire with ERR_PROGRAM_SCOPE_MISMATCH before the call_type check at 46 or the pinning check at 50."
        test_recipe:
          setup:
            - "Two fully configured programs, each with an approved MPDS version and one dispatcher; program A holds an OPEN CHEST_PAIN period, program B holds the CHEST_PAIN call."
          setup_api_calls:
