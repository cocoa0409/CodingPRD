    instances:
      - name: field_technician_cannot_approve_own_survey
        claim_type: role_exclusive_violation
        grounds: ["roles.FieldTechnician", "roles.RFEngineer", "validations[priority=28]"]
        distinguishing_aspect: "The same FieldTechnician who submitted a SiteSurvey cannot approve it; only an RFEngineer may."
        test_recipe:
          setup: ["SiteSurvey submitted by FieldTechnician ft-007"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "SoD Co", erp_account_code: "SOD-001", industry_vertical: "CAMPUS" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "SOD1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id }
            - call: "POST /private-wireless/sites/${site}/surveys"
              payload: { surveyor_id: "ft-007", survey_date: "2026-09-01T10:00:00Z", measured_rsrp_dbm: -80, measured_sinr_db: 20, floor_plan_area_sqm: 500, building_material_class: "OPEN" }
              as: FieldTechnician
              captures: { surv: $.data.id }
            - call: "POST /private-wireless/sites/${site}/surveys/${surv}/submit"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /private-wireless/sites/${site}/surveys/${surv}/approve"
              payload: {}
              as: FieldTechnician
          assert:
            - "HTTP 403 ERR_UNAUTHORIZED (FieldTechnician role lacks the survey-approve permission entirely)"

      - name: spectrum_regulator_cannot_file_coordination_request
        claim_type: role_exclusive_violation
        grounds: ["roles.SpectrumRegulator", "roles.SpectrumCoordinator"]
        distinguishing_aspect: "SpectrumRegulator role cannot create SpectrumCoordinationRequests (that is the Coordinator's role)."
