            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v_id}", po_number: "PO-1", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { po1_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po1_id}/shipments"
              payload: { asn_number: "ASN-1", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /compliance/shipments/${s1_id}/receive"
              payload: { received_units: 1000 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/shipments/${s1_id}/violations"
              payload: { requirement_id: "${r_shp_id}", affected_units: 400, affected_cartons: 16, narrative: "ASN transmitted after trailer arrival." }
