            - "${occ} == 800"

      - name: quarantine_release_cycle_restores_available
        claim_type: valid_transition
        grounds: [state_machines.InventoryLot.QUARANTINED_to_AVAILABLE, state_machines.InventoryLot.IN_INSPECTION_to_QUARANTINED]
        distinguishing_aspect: "Cyclic lot shape: IN_INSPECTION -> QUARANTINED via non-compliant inspection (fat 20 > max 12), then release returns it to AVAILABLE with quarantine_reason cleared."
        test_recipe:
          setup: ["LOT-QR IN_INSPECTION, product max_fat_pct 12.0"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-QR", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo", establishment_number: "EST-QR", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/warehouses", payload: { name: "WH-1", zone: "CHILLER", capacity_lbs: 100000 }, as: DeskAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-QR", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 100, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 100, warehouse_id: "${wh_id}", lot_code: "LOT-QR", production_date: "2026-08-01" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 20.0 }, as: QualityGrader, captures: { st1: "$.data.status" } }
            - { call: "POST /api/inventory-lots/${lot_id}/release", payload: {}, as: QualityGrader, captures: { st2: "$.data.status" } }
          assert:
            - "${st1} == QUARANTINED with quarantine_reason == SPEC_NONCOMPLIANCE and spec_compliant == false"
            - "${st2} == AVAILABLE and quarantine_reason == null"

      - name: supplier_suspend_cascades_to_booked_pos
        claim_type: cross_entity
        grounds: [state_machines.Supplier.ACTIVE_to_SUSPENDED, state_machines.PurchaseOrder.BOOKED_to_CANCELLED]
        distinguishing_aspect: "Suspending a supplier cancels its BOOKED POs with cancel_reason SUPPLIER_SUSPENDED; reinstatement does NOT resurrect them."
        test_recipe:
          setup: ["Supplier SUP-CASC ACTIVE with PO-CASC BOOKED"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "CARC-SC", kind: "CARCASS", species: "BEEF", shelf_life_days: 30, required_temp_max_f: 40 }, as: DeskAdmin, captures: { carc_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { name: "PackCo SC", establishment_number: "EST-SC", contact_email: "ops@packco.example" }, as: DeskAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-CASC", supplier_id: "${sup_id}", product_id: "${carc_id}", ordered_weight_lbs: 500, contract_price_per_cwt_cents: 25000, required_delivery_date: "2026-08-12" }, as: Trader, captures: { po_id: "$.data.id" } }
          trigger:
            - { call: "PUT /api/suppliers/${sup_id}/status", payload: { status: "SUSPENDED", reason: "USDA audit" }, as: DeskAdmin }
            - { call: "GET /api/purchase-orders/${po_id}", payload: {}, as: DeskAdmin, captures: { po_status: "$.data.status", po_reason: "$.data.cancel_reason" } }
            - { call: "PUT /api/suppliers/${sup_id}/status", payload: { status: "ACTIVE" }, as: DeskAdmin }
            - { call: "GET /api/purchase-orders/${po_id}", payload: {}, as: DeskAdmin, captures: { po_status2: "$.data.status" } }
          assert:
            - "After suspend: ${po_status} == CANCELLED and ${po_reason} == SUPPLIER_SUSPENDED"
            - "After reinstate: ${po_status2} == CANCELLED (no resurrection); Supplier.${sup_id}.status == ACTIVE"

      - name: grading_certificate_computes_actual_cutout
        claim_type: side_effect_execution
        grounds: [state_machines.PurchaseOrder.RECEIVED_to_GRADED]
        excluded_because:
          difficulty_instance: po_cutout_booking_vs_grading_basis
          rationale: "Cert-issuance side effects (lot grade set, PO -> GRADED, actual cutout computed) are asserted there with exact literals."

  # ===========================================================================
  - section: calculations
    instances:
      - name: cutout_missing_sheet_line_contributes_zero
        claim_type: correct_result
        grounds: [calculations.cutout_value]
        distinguishing_aspect: "A YieldSpec whose output product has NO line on the selected sheet contributes 0 to the cutout (not an error): 1000 lbs at 50%/50% with only a RIBEYE 900c line yields exactly 450000."
        test_recipe:
          setup:
            - "CARC-Z CARCASS with YieldSpecs to RIBEYE-Z 50% and CHUCK-Z 50%; sheet PUBLISHED with ONLY a RIBEYE-Z line (900c)"
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "CARC-Z", kind: "CARCASS", species: "BEEF", shelf_life_days: 30, required_temp_max_f: 40 }, as: DeskAdmin, captures: { carc_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-Z", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { product_code: "CHUCK-Z", kind: "PRIMAL", species: "BEEF", max_fat_pct: 18.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { chk_id: "$.data.id" } }
