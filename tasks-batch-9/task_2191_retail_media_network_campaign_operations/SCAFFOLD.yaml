  # --- IncrementalityStudy --------------------------------------------------
  - method: POST
    path: "/rmn/incrementality-studies"
    description: "Designs a holdout study for a campaign under either GEO_HOLDOUT or USER_HOLDOUT, subject to the washout gap against every other live or published study. Optimistically concurrent against the campaign."
    roles: [NetworkAdmin, MeasurementAnalyst]
    code: 201
    input: ["campaign_id", "design_method", "holdout_pct", "window_start_at", "window_end_at", "supersedes_study_id?", "expected_campaign_version"]
    output: IncrementalityStudy
    side_effects: ["creates IncrementalityStudy with study_status=DESIGNED and all group counters at 0", "increments Campaign.version by 1"]
  - method: GET
    path: "/rmn/incrementality-studies"
    description: "Lists incrementality studies, filterable by campaign, superseded study, design method and status."
    roles: [NetworkAdmin, MeasurementAnalyst, AccountManager, BillingOps, AdvertiserUser]
    code: 200
    input: ["campaign_id?", "supersedes_study_id?", "design_method?", "study_status?", "limit?", "offset?"]
    output: IncrementalityStudy[]
    side_effects: []
  - method: GET
    path: "/rmn/incrementality-studies/{id}"
    description: "Reads one study with lift_pct, incremental_sales_cents, significance_score and significance_flag."
    roles: [NetworkAdmin, MeasurementAnalyst, AccountManager, BillingOps, AdvertiserUser]
    code: 200
    input: []
    output: IncrementalityStudy
    side_effects: []
  - method: POST
    path: "/rmn/incrementality-studies/{id}/start"
    description: "Starts a DESIGNED study once the clock has reached window_start_at, splitting exposed and control groups."
    roles: [NetworkAdmin, MeasurementAnalyst]
    code: 200
    input: ["exposed_group_size", "control_group_size"]
    output: IncrementalityStudy
    side_effects: ["sets study_status=RUNNING", "re-verifies study_window_washout against every other RUNNING, MEASURING or PUBLISHED study on the campaign", "increments IncrementalityStudy.version by 1"]
  - method: POST
    path: "/rmn/incrementality-studies/{id}/measure"
    description: "Loads exposed and control outcomes for a RUNNING study whose window has elapsed and computes lift under the study's design variant."
    roles: [NetworkAdmin, MeasurementAnalyst]
    code: 200
    input: ["exposed_conversions", "control_conversions", "exposed_sales_cents", "control_sales_cents"]
    output: IncrementalityStudy
    side_effects: ["sets study_status=MEASURING", "runs incremental_sales_lift to set lift_pct, incremental_sales_cents, significance_score and significance_flag", "increments IncrementalityStudy.version by 1"]
  - method: POST
    path: "/rmn/incrementality-studies/{id}/publish"
    description: "Publishes a MEASURING study that cleared the significance threshold, writing its incremental result onto the campaign."
    roles: [NetworkAdmin, MeasurementAnalyst]
    code: 200
    input: ["publication_note?"]
    output: IncrementalityStudy
    side_effects: ["sets study_status=PUBLISHED and published_by_user_id to the acting X-User-ID", "sets Campaign.incremental_revenue_cents and recomputes Campaign.iroas", "supersedes the study named by supersedes_study_id, moving it to INVALIDATED with invalidated_reason=SUPERSEDED", "increments IncrementalityStudy.version by 1"]
  - method: POST
    path: "/rmn/incrementality-studies/{id}/invalidate"
    description: "Invalidates a RUNNING, MEASURING or PUBLISHED study; invalidating a PUBLISHED study runs the depth-3 restatement cascade and a DATA_DEFECT reason returns it to MEASURING for re-measurement."
    roles: [NetworkAdmin, MeasurementAnalyst]
    code: 200
    input: ["invalidated_reason"]
    output: IncrementalityStudy
    side_effects: ["sets study_status=INVALIDATED", "L1: Campaign.incremental_revenue_cents reset to 0 and Campaign.iroas recomputed", "L2: every AttributedSale inside the study window flagged restated=true and re-credited via attributed_sales_credit", "L3: every ISSUED Invoice covering the study window transitions to DISPUTED with an INCREMENTALITY_RESTATEMENT dispute opened against it", "invalidated_reason=DATA_DEFECT immediately returns the study to MEASURING", "increments IncrementalityStudy.version by 1"]
  # --- Invoice --------------------------------------------------------------
  - method: POST
    path: "/rmn/invoices"
    description: "Opens a DRAFT invoice for one advertiser billing period, bound to the funding plan and the fiscal-period-matched trade fund account."
    roles: [NetworkAdmin, BillingOps]
    code: 201
    input: ["advertiser_id", "budget_plan_id", "trade_fund_account_id", "billing_period_code"]
    output: Invoice
    side_effects: ["creates Invoice with invoice_status=DRAFT, adjustment_round=0 and every money field at 0"]
  - method: GET
    path: "/rmn/invoices"
    description: "Lists invoices, filterable by advertiser, funding plan, trade fund account, period and status."
    roles: [NetworkAdmin, BillingOps, CreditAnalyst, AccountManager, AdvertiserUser]
    code: 200
    input: ["advertiser_id?", "budget_plan_id?", "trade_fund_account_id?", "billing_period_code?", "invoice_status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/rmn/invoices/{id}"
    description: "Reads one invoice with the full settlement waterfall decomposition and net_cash_due_cents."
    roles: [NetworkAdmin, BillingOps, CreditAnalyst, AccountManager, AdvertiserUser]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/rmn/invoices/{id}/issue"
    description: "Issues a DRAFT invoice, running the ten pinned steps of invoice_settlement_waterfall over every PENDING_INVOICE campaign in the period."
    roles: [NetworkAdmin, BillingOps]
    code: 200
    input: ["issue_note?"]
    output: Invoice
    side_effects: ["sets invoice_status=ISSUED, issued_at to clock_now, due_at to clock_now + NET_TERMS_DAYS and issued_by_user_id to the acting X-User-ID", "runs invoice_settlement_waterfall to set onsite_spend_cents, offsite_spend_cents, gross_spend_cents, managed_service_fee_cents, trade_fund_deduction_cents, dispute_credit_cents, net_cash_due_cents and variance_pct", "moves trade_fund_deduction_cents from TradeFundAccount.available_cents to TradeFundAccount.deducted_cents", "consumes Advertiser.dispute_credit_balance_cents up to dispute_credit_cents", "every covered Campaign moves billing_status PENDING_INVOICE -> INVOICED"]
  - method: POST
    path: "/rmn/invoices/{id}/adjust"
    description: "Applies a credit adjustment to a DISPUTED invoice, bounded by MAX_ADJUSTMENT_ROUNDS, and re-runs the waterfall."
    roles: [NetworkAdmin, BillingOps]
    code: 200
    input: ["adjustment_amount_cents", "adjustment_reason"]
    output: Invoice
    side_effects: ["sets invoice_status=ADJUSTED and adjustment_round = adjustment_round + 1", "adds adjustment_amount_cents to dispute_credit_cents and re-runs invoice_settlement_waterfall from STEP 6 onward, leaving gross_spend_cents untouched", "increments Invoice.version by 1"]
  - method: POST
    path: "/rmn/invoices/{id}/settle"
    description: "Settles an ISSUED or ADJUSTED invoice against an exact-amount payment."
    roles: [NetworkAdmin, BillingOps]
    code: 200
    input: ["paid_amount_cents", "payment_reference"]
    output: Invoice
    side_effects: ["sets invoice_status=SETTLED and settled_at to clock_now", "reduces Advertiser.credit_exposure_cents by net_cash_due_cents", "every covered Campaign moves billing_status INVOICED or DISPUTED -> RECONCILED", "increments Invoice.version by 1"]
  - method: POST
    path: "/rmn/invoices/{id}/write-off"
    description: "Writes off an ISSUED or ADJUSTED invoice once WRITE_OFF_DAYS have passed since due_at; the write-off is the compensating transaction that restores the trade-fund invariant."
    roles: [NetworkAdmin]
    code: 200
    input: ["write_off_reason"]
    output: Invoice
    side_effects: ["sets invoice_status=WRITTEN_OFF", "returns trade_fund_deduction_cents from TradeFundAccount.deducted_cents to TradeFundAccount.available_cents so accrued == available + reserved + deducted still holds", "reduces Advertiser.credit_exposure_cents by net_cash_due_cents and suspends the advertiser when its onboarding_status is ACTIVE", "increments Invoice.version by 1"]
  # --- MeasurementDispute ---------------------------------------------------
  - method: POST
    path: "/rmn/measurement-disputes"
    description: "Files a measurement dispute against an ISSUED or ADJUSTED invoice inside the dispute grace window, starting the reporting SLA clock. Optimistically concurrent against the invoice."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 201
    input: ["invoice_id", "dispute_category", "claimed_amount_cents", "line_item_id?", "evidence_note?", "expected_invoice_version"]
    output: MeasurementDispute
    side_effects: ["creates MeasurementDispute with dispute_status=SUBMITTED, filed_at=clock_now, info_request_count=0, review_rounds=0, escalation_level=0, sla_breached=false", "runs dispute_sla_clock to set sla_response_hours and sla_due_at from the category base hours", "transitions the invoice ISSUED or ADJUSTED -> DISPUTED and every covered Campaign billing_status INVOICED -> DISPUTED", "increments Invoice.version by 1"]
  - method: GET
    path: "/rmn/measurement-disputes"
    description: "Lists measurement disputes, filterable by invoice, disputed line item, category, status and breach flag."
    roles: [NetworkAdmin, MeasurementAnalyst, BillingOps, AccountManager, AdvertiserUser]
    code: 200
    input: ["invoice_id?", "line_item_id?", "dispute_category?", "dispute_status?", "sla_breached?", "limit?", "offset?"]
    output: MeasurementDispute[]
    side_effects: []
  - method: GET
    path: "/rmn/measurement-disputes/{id}"
    description: "Reads one dispute with its SLA clock, review rounds and awarded credit."
    roles: [NetworkAdmin, MeasurementAnalyst, BillingOps, AccountManager, AdvertiserUser]
    code: 200
    input: []
    output: MeasurementDispute
    side_effects: []
  - method: POST
    path: "/rmn/measurement-disputes/{id}/start-review"
    description: "Assigns an analyst to a SUBMITTED dispute and stamps the first response, stopping the SLA clock."
    roles: [NetworkAdmin, MeasurementAnalyst]
    code: 200
    input: ["assigned_analyst_user_id"]
    output: MeasurementDispute
    side_effects: ["sets dispute_status=UNDER_REVIEW, first_response_at=clock_now and review_rounds = review_rounds + 1", "re-runs dispute_sla_clock: a first_response_at exactly equal to sla_due_at is NOT a breach", "increments MeasurementDispute.version by 1"]
  - method: POST
    path: "/rmn/measurement-disputes/{id}/request-info"
    description: "Requests further evidence from an UNDER_REVIEW dispute, extending the SLA; the request/response cycle is bounded by MAX_INFO_REQUESTS."
    roles: [NetworkAdmin, MeasurementAnalyst]
    code: 200
    input: ["information_request_note"]
    output: MeasurementDispute
    side_effects: ["sets dispute_status=INFO_REQUESTED and info_request_count = info_request_count + 1", "extends sla_due_at by INFO_REQUEST_EXTENSION_HOURS via dispute_sla_clock", "increments MeasurementDispute.version by 1"]
  - method: POST
    path: "/rmn/measurement-disputes/{id}/provide-info"
    description: "Supplies the requested evidence, returning an INFO_REQUESTED dispute to UNDER_REVIEW."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["evidence_note"]
    output: MeasurementDispute
    side_effects: ["sets dispute_status=UNDER_REVIEW and review_rounds = review_rounds + 1", "increments MeasurementDispute.version by 1"]
  - method: POST
    path: "/rmn/measurement-disputes/{id}/resolve"
    description: "Branching resolution fork from UNDER_REVIEW: UPHOLD awards credit and runs the depth-3 unwind cascade, REJECT closes the dispute with no credit."
    roles: [NetworkAdmin, MeasurementAnalyst]
    code: 200
    input: ["decision", "approved_credit_amount_cents", "resolution_note?"]
    output: MeasurementDispute
    side_effects: ["UPHOLD sets dispute_status=UPHELD and approved_credit_cents from dispute_credit_award, then L1: Invoice DISPUTED -> ADJUSTED with the credit applied, L2: TradeFundAccount FROZEN -> OPEN once the adjusted deduction fits the cap, L3: BudgetPlan EXHAUSTED -> ACTIVE when the released credit restores available_cents", "REJECT sets dispute_status=REJECTED, approved_credit_cents=0 and returns the invoice DISPUTED -> ISSUED", "sets resolved_by_user_id to the acting X-User-ID", "increments MeasurementDispute.version by 1"]
  - method: POST
    path: "/rmn/measurement-disputes/{id}/escalate"
    description: "Escalates an UNDER_REVIEW, INFO_REQUESTED or REJECTED dispute to the next escalation level, re-opening the SLA clock at the escalated base hours."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["escalation_reason"]
    output: MeasurementDispute
    side_effects: ["sets dispute_status=ESCALATED and escalation_level = escalation_level + 1", "re-runs dispute_sla_clock at the ESCALATED base hours, clearing first_response_at", "increments MeasurementDispute.version by 1"]
  - method: POST
    path: "/rmn/measurement-disputes/{id}/withdraw"
    description: "Withdraws a SUBMITTED, UNDER_REVIEW or INFO_REQUESTED dispute at the advertiser's request, restoring the invoice."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["withdrawal_reason"]
    output: MeasurementDispute
    side_effects: ["sets dispute_status=WITHDRAWN and approved_credit_cents=0", "returns the invoice DISPUTED -> ISSUED and every covered Campaign billing_status DISPUTED -> INVOICED", "increments MeasurementDispute.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog (every code is referenced by at least one §1.4 row
# and reachable from at least one §1.5 endpoint)
# =============================================================================
errors:
  # --- authentication / authorization --------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header is missing or blank" }
  - { id: ERR_UNKNOWN_ROLE, http: 401, condition: "X-User-Role is not one of the eight roles declared in §1.7" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is not listed in the target endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "An AdvertiserUser targets a resource that does not resolve to its own Advertiser.id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting X-User-ID is the same operator who performed the preceding step of the same approval, review, write-off or restatement chain" }
  # --- request shape --------------------------------------------------------
  - { id: ERR_VALIDATION, http: 422, condition: "A required input field is absent, mistyped, or carries an enum value outside the declared set" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit is outside [1, 100] or offset is negative" }
  # --- existence -----------------------------------------------------------
  - { id: ERR_ADVERTISER_NOT_FOUND, http: 404, condition: "The referenced Advertiser or parent_advertiser_id does not exist" }
  - { id: ERR_BUDGET_PLAN_NOT_FOUND, http: 404, condition: "The referenced BudgetPlan does not exist" }
  - { id: ERR_TRADE_FUND_ACCOUNT_NOT_FOUND, http: 404, condition: "The referenced TradeFundAccount does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "The referenced Campaign does not exist" }
  - { id: ERR_PLACEMENT_SLOT_NOT_FOUND, http: 404, condition: "The referenced PlacementSlot does not exist" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "The referenced LineItem does not exist" }
  - { id: ERR_CATALOG_PRODUCT_NOT_FOUND, http: 404, condition: "The referenced CatalogProduct does not exist" }
  - { id: ERR_PRODUCT_ASSIGNMENT_NOT_FOUND, http: 404, condition: "The referenced ProductAssignment does not exist" }
  - { id: ERR_AUCTION_EVENT_NOT_FOUND, http: 404, condition: "The referenced AuctionEvent does not exist" }
  - { id: ERR_ENGAGEMENT_EVENT_NOT_FOUND, http: 404, condition: "The referenced EngagementEvent does not exist" }
  - { id: ERR_STUDY_NOT_FOUND, http: 404, condition: "The referenced IncrementalityStudy or supersedes_study_id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "The referenced Invoice does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "The referenced MeasurementDispute does not exist" }
  # --- optimistic concurrency ----------------------------------------------
  - { id: ERR_STALE_ADVERTISER_VERSION, http: 412, condition: "expected_advertiser_version does not match the current Advertiser.version, so the caller read the advertiser before an intervening write" }
  - { id: ERR_STALE_CAMPAIGN_VERSION, http: 412, condition: "expected_campaign_version does not match the current Campaign.version" }
  - { id: ERR_STALE_LINE_ITEM_VERSION, http: 412, condition: "expected_line_item_version does not match the current LineItem.version" }
  - { id: ERR_STALE_TRADE_FUND_VERSION, http: 412, condition: "expected_trade_fund_account_version does not match the current TradeFundAccount.version" }
  - { id: ERR_STALE_INVOICE_VERSION, http: 412, condition: "expected_invoice_version does not match the current Invoice.version" }
  # --- state ---------------------------------------------------------------
  - { id: ERR_ADVERTISER_TERMINATED, http: 409, condition: "The resolved Advertiser is REJECTED or TERMINATED and accepts no further mutation" }
  - { id: ERR_INVALID_ONBOARDING_TRANSITION, http: 409, condition: "The requested onboarding transition is not declared for the advertiser's current onboarding_status" }
  - { id: ERR_ADVERTISER_NOT_ACTIVE, http: 409, condition: "The operation requires Advertiser.onboarding_status == ACTIVE but the advertiser is DRAFT, SUBMITTED, KYC_REVIEW, CREDIT_HOLD or SUSPENDED" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "The requested budget plan transition is not declared for the plan's current plan_status" }
  - { id: ERR_PLAN_NOT_FUNDABLE, http: 409, condition: "The funding BudgetPlan is not APPROVED or ACTIVE when delivery funding is required" }
  - { id: ERR_INVALID_CAMPAIGN_TRANSITION, http: 409, condition: "The requested campaign delivery transition is not declared for the campaign's current delivery_status" }
  - { id: ERR_CAMPAIGN_NOT_DELIVERING, http: 409, condition: "A line item activation or resume is attempted while the owning campaign is not DELIVERING" }
  - { id: ERR_LINE_ITEM_INVALID_STATE, http: 409, condition: "The requested line item transition is not declared for its current line_item_status" }
  - { id: ERR_SLOT_NOT_OPEN, http: 409, condition: "The placement slot is MAINTENANCE or RETIRED when occupancy or an auction is requested, or a RETIRED slot is asked to reopen" }
  - { id: ERR_PRODUCT_DELISTED, http: 409, condition: "The catalog product is DELISTED, a terminal state that accepts no assignment, stock adjustment or reinstatement" }
  - { id: ERR_AUCTION_INVALID_STATE, http: 409, condition: "Ranking a non-OPEN auction, awarding a non-RANKED auction, or settling an auction that is neither AWARDED nor NO_FILL" }
  - { id: ERR_STUDY_INVALID_STATE, http: 409, condition: "The requested study transition is not declared for its current study_status" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "The requested invoice transition is not declared for its current invoice_status" }
  - { id: ERR_DISPUTE_INVALID_STATE, http: 409, condition: "The requested dispute transition is not declared for its current dispute_status" }
  - { id: ERR_TRADE_FUND_FROZEN, http: 409, condition: "The trade fund account is FROZEN, RECONCILING or CLOSED when an accrual, deduction or invoice issuance needs it OPEN" }
  # --- business safety -----------------------------------------------------
  - { id: ERR_PRODUCT_RESTRICTED, http: 422, condition: "A RESTRICTED or OUT_OF_STOCK catalog product is assigned to a line item, or a line item carrying one is approved for eligibility" }
  - { id: ERR_KYC_DOCUMENTS_INSUFFICIENT, http: 422, condition: "kyc_document_count is below 2 on first onboarding submission, or below 3 on a re-submission out of CREDIT_HOLD" }
  - { id: ERR_SLA_BREACH_REJECTION_FORBIDDEN, http: 409, condition: "A dispute with sla_breached == true and escalation_level == 1 is resolved with decision=REJECT" }
  - { id: ERR_STUDY_NOT_SIGNIFICANT, http: 422, condition: "A study is published while significance_flag is false" }
  - { id: ERR_SERVICE_MODEL_CONFLICT, http: 422, condition: "A SELF_SERVE advertiser carries a managed service fee or an account manager, or a MANAGED advertiser has no account manager" }
  # --- business temporal ---------------------------------------------------
  - { id: ERR_FLIGHT_WINDOW_OUTSIDE_CAMPAIGN, http: 422, condition: "The line item flight window is not contained in the campaign flight window under half-open [start, end) semantics, or its start is not strictly before its end" }
  - { id: ERR_FLIGHT_WINDOW_OUTSIDE_PLAN, http: 422, condition: "The campaign flight window is not contained in the budget plan window" }
  - { id: ERR_PLAN_WINDOW_OVERLAP, http: 409, condition: "Approving the plan would leave two APPROVED or ACTIVE plans of the same advertiser with overlapping windows" }
  - { id: ERR_ENGAGEMENT_OUTSIDE_FLIGHT, http: 422, condition: "The engagement occurred_at falls outside the winning line item's flight window or before the auction's requested_at" }
  - { id: ERR_STUDY_WASHOUT_VIOLATION, http: 409, condition: "The clear gap to another RUNNING, MEASURING or PUBLISHED study window on the same campaign is strictly less than WASHOUT_DAYS" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "A dispute is filed after due_at + DISPUTE_GRACE_DAYS, or a write-off is attempted before due_at + WRITE_OFF_DAYS" }
  - { id: ERR_STUDY_WINDOW_NOT_ELAPSED, http: 409, condition: "A study is measured before its window_end_at, or started before its window_start_at" }
  # --- business constraint -------------------------------------------------
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "Granting occupancy would push the count of overlapping occupying line items to max_concurrent_line_items or beyond" }
  - { id: ERR_SLOT_CATEGORY_EXCLUSIVE, http: 409, condition: "An overlapping occupying line item on an exclusivity slot already holds the candidate's category_code" }
  - { id: ERR_SLOT_BUFFER_CONFLICT, http: 409, condition: "On an OFFSITE slot the buffer-inflated candidate window touches or overlaps an occupying line item window" }
  - { id: ERR_DUPLICATE_BRAND_CODE, http: 409, condition: "brand_code is already used by another advertiser" }
  - { id: ERR_DUPLICATE_RESOURCE_CODE, http: 409, condition: "sku or slot_code is already used by another catalog product or placement slot" }
  - { id: ERR_DUPLICATE_TRADE_FUND_PERIOD, http: 409, condition: "The advertiser already has a trade fund account for that fiscal_period_code" }
  - { id: ERR_DUPLICATE_ATTRIBUTED_SALE, http: 409, condition: "The (retail_order_ref, catalog_product_id, line_item_id) triple has already been credited" }
  - { id: ERR_DUPLICATE_INVOICE_PERIOD, http: 409, condition: "The advertiser already has an invoice for that billing_period_code" }
  - { id: ERR_HERO_ASSIGNMENT_REQUIRED, http: 422, condition: "A line item is submitted for eligibility with no ACTIVE hero assignment, or the last hero assignment of a non-DRAFT line item is removed" }
  - { id: ERR_NO_ELIGIBLE_PRODUCTS, http: 422, condition: "eligible_product_count is 0 when a line item is submitted for eligibility or activated" }
  - { id: ERR_PARENT_ADVERTISER_INVALID, http: 422, condition: "parent_advertiser_id is self-referential, points at a child that itself has a parent, or points at a non-ACTIVE advertiser" }
  - { id: ERR_OFFSITE_CHANNEL_MISMATCH, http: 422, condition: "A line item's slot channel contradicts the campaign channel_mix, or an OMNI campaign is submitted without a line item on each channel" }
  - { id: ERR_MAX_INFO_REQUESTS_EXCEEDED, http: 409, condition: "A further information request is issued once info_request_count has reached MAX_INFO_REQUESTS" }
  - { id: ERR_MAX_ROUNDS_EXCEEDED, http: 409, condition: "adjustment_round has reached MAX_ADJUSTMENT_ROUNDS, or revision_round would exceed MAX_REVISION_ROUNDS" }
  # --- business referential ------------------------------------------------
  - { id: ERR_CROSS_ADVERTISER_REFERENCE, http: 422, condition: "Two referenced rows resolve to different advertisers, e.g. a campaign funded by another advertiser's plan or an invoice bound to another advertiser's fund account" }
  - { id: ERR_FISCAL_PERIOD_MISMATCH, http: 422, condition: "The invoice's trade fund account fiscal_period_code differs from its budget plan's fiscal_period_code" }
  - { id: ERR_ENGAGEMENT_AUCTION_MISMATCH, http: 422, condition: "The engagement's line_item_id is not the auction's winning_line_item_id, or its catalog product is not ACTIVE-assigned to that line item" }
  - { id: ERR_SUPERSEDED_STUDY_INVALID, http: 422, condition: "supersedes_study_id points at a study on a different campaign or one that is not PUBLISHED" }
  # --- business fiscal -----------------------------------------------------
  - { id: ERR_CAP_EXCEEDS_PARENT_LIMIT, http: 422, condition: "trade_fund_share_cents exceeds committed_total_cents, daily_cap_cents exceeds allocated_budget_cents, or a SELF_SERVE daily cap exceeds self_serve_daily_spend_cap_cents" }
  - { id: ERR_PLAN_BUDGET_INSUFFICIENT, http: 402, condition: "BudgetPlan.available_cents cannot cover the campaign allocation or the line item daily reservation being requested" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Approving the plan would push credit_exposure_cents past the advertiser's own or its parent umbrella's credit_limit_cents" }
  - { id: ERR_TRADE_FUND_INSUFFICIENT, http: 402, condition: "TradeFundAccount.available_cents cannot cover the requested deduction or the plan's trade-fund share" }
  - { id: ERR_AMOUNT_BELOW_MINIMUM, http: 422, condition: "top_up_amount_cents is below MIN_TOP_UP_CENTS or accrual_amount_cents is below MIN_ACCRUAL_CENTS" }
  - { id: ERR_CLAIM_EXCEEDS_INVOICE, http: 422, condition: "claimed_amount_cents exceeds the invoice's net cash due plus its trade fund deduction" }
  - { id: ERR_CREDIT_EXCEEDS_CLAIM, http: 422, condition: "approved_credit_amount_cents exceeds the dispute's claimed_amount_cents" }
  - { id: ERR_SETTLEMENT_AMOUNT_MISMATCH, http: 422, condition: "paid_amount_cents does not equal net_cash_due_cents exactly" }
  - { id: ERR_NOTHING_TO_INVOICE, http: 422, condition: "gross_spend_cents computes to 0, so the invoice has nothing to bill" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties: the operator who submits a step is
# barred from deciding it — enforced by ERR_SEGREGATION_OF_DUTIES at priority 40)
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Retail media network superuser: owns inventory definition, the logical clock, the daily checkpoint sweep, advertiser termination and invoice write-off. May perform any operation, but is still bound by the segregation-of-duties rule when it acts on both sides of an approval chain."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-daily-checkpoint"
      - "POST /rmn/advertisers/{id}/terminate"
      - "POST /rmn/invoices/{id}/write-off"
      - "POST /rmn/placement-slots"
      - "PATCH /rmn/placement-slots/{id}"
    shared_operations:
      - "every other endpoint declared in §1.5"
  - name: AccountManager
    description: "Managed-service seller who builds and runs campaigns on behalf of MANAGED advertisers, submits budget plans and campaigns for review, and files disputes for its book of business. Recorded on Advertiser.account_manager_user_id."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /rmn/advertisers and PATCH /rmn/advertisers/{id}"
      - "POST /rmn/advertisers/{id}/submit-onboarding"
      - "POST /rmn/budget-plans, submit, top-up"
      - "POST /rmn/campaigns, PATCH, submit-for-review, review-decision, activate, pause, resume, complete, archive"
      - "POST /rmn/line-items and its submit-eligibility, activate, pause, resume, end actions"
      - "POST /rmn/product-assignments and DELETE /rmn/product-assignments/{id}"
      - "POST /rmn/measurement-disputes, provide-info, escalate, withdraw"
      - "all GET reads except the auction bid ledger filters reserved to measurement"
  - name: AdvertiserUser
    description: "Self-serve advertiser seat. X-User-ID is the Advertiser.id it acts as, so every request is ownership-checked at priority 4; it can never read or mutate another advertiser's plans, campaigns, invoices or disputes."
    identity: "entity_backed:Advertiser"
    exclusive_operations: []
    shared_operations:
      - "POST /rmn/advertisers/{id}/submit-onboarding"
      - "POST /rmn/budget-plans and POST /rmn/budget-plans/{id}/submit"
      - "POST /rmn/campaigns, PATCH, submit-for-review, activate, pause, resume"
      - "POST /rmn/line-items and its submit-eligibility, activate, pause, resume, end actions"
      - "POST /rmn/product-assignments and DELETE /rmn/product-assignments/{id}"
      - "POST /rmn/measurement-disputes, provide-info, escalate, withdraw"
      - "GET reads scoped to its own advertiser tree, including /rmn/advertisers/{id}/credit-summary and /rmn/campaigns/{id}/performance-summary"
  - name: CreditAnalyst
    description: "Credit and risk decision-maker: renders the KYC fork, approves or returns budget plans, and suspends or reinstates advertisers. Cannot create campaigns or line items, so it can never approve work it authored."
    identity: "opaque"
    exclusive_operations:
      - "POST /rmn/advertisers/{id}/kyc-decision"
      - "POST /rmn/budget-plans/{id}/approve"
      - "POST /rmn/budget-plans/{id}/return-for-revision"
      - "POST /rmn/advertisers/{id}/suspend"
      - "POST /rmn/advertisers/{id}/reinstate"
    shared_operations:
      - "POST /rmn/budget-plans/{id}/top-up"
      - "GET /rmn/advertisers, /rmn/advertisers/{id}, /rmn/advertisers/{id}/credit-summary, /rmn/budget-plans, /rmn/trade-fund-accounts, /rmn/invoices"
  - name: MeasurementAnalyst
    description: "Owns closed-loop attribution and incrementality: posts attributed sales, designs, runs, measures, publishes and invalidates holdout studies, and adjudicates measurement disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /rmn/attributed-sales"
      - "POST /rmn/incrementality-studies and its start, measure, publish, invalidate actions"
      - "POST /rmn/measurement-disputes/{id}/start-review"
      - "POST /rmn/measurement-disputes/{id}/request-info"
      - "POST /rmn/measurement-disputes/{id}/resolve"
    shared_operations:
      - "POST /rmn/campaigns/{id}/offsite-reconciliation"
      - "GET /rmn/auction-bids, /rmn/auction-events, /rmn/engagement-events, /rmn/attributed-sales, /rmn/campaigns/{id}/performance-summary, /rmn/measurement-disputes"
  - name: BillingOps
    description: "Runs the money side: trade fund accounts and accruals, deductions, invoice issuance, adjustment and settlement, and off-site spend reconciliation. Cannot decide disputes, so credit awards stay with measurement."
    identity: "opaque"
    exclusive_operations:
      - "POST /rmn/trade-fund-accounts and its accruals, deductions, freeze, unfreeze actions"
      - "POST /rmn/invoices"
      - "POST /rmn/invoices/{id}/issue"
      - "POST /rmn/invoices/{id}/adjust"
      - "POST /rmn/invoices/{id}/settle"
    shared_operations:
      - "POST /rmn/budget-plans/{id}/close"
      - "POST /rmn/campaigns/{id}/complete and offsite-reconciliation"
      - "POST /rmn/auction-events/{id}/settle"
      - "GET reads across advertisers, plans, fund accounts, campaigns, line items, invoices and disputes"
  - name: CatalogOps
    description: "Retail merchandising side: registers SKUs, posts stock movements that drive the out-of-stock pausing cascade, restricts, reinstates and delists products, and renders the line item eligibility fork."
    identity: "opaque"
    exclusive_operations:
      - "POST /rmn/catalog-products and its stock-adjustments, restrict, reinstate, delist actions"
      - "POST /rmn/line-items/{id}/eligibility-decision"
    shared_operations:
      - "POST /rmn/product-assignments and DELETE /rmn/product-assignments/{id}"
      - "POST /rmn/line-items/{id}/resume"
      - "GET /rmn/catalog-products, /rmn/product-assignments, /rmn/line-items, /rmn/placement-slots"
  - name: AuctionService
    description: "Machine identity for the ad server: opens, ranks, awards and settles sponsored placement auctions and records impressions, clicks and off-site views. Holds no financial or measurement authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /rmn/auction-events"
      - "POST /rmn/auction-events/{id}/rank"
      - "POST /rmn/auction-events/{id}/award"
      - "POST /rmn/engagement-events"
    shared_operations:
      - "POST /rmn/auction-events/{id}/settle"
      - "GET /rmn/placement-slots, /rmn/line-items, /rmn/catalog-products, /rmn/product-assignments, /rmn/auction-events, /rmn/auction-bids, /rmn/engagement-events"
