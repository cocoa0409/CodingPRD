          trigger:
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 16.50, trash_pct: 4.00 }, as: SCHEDULER, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: member_cannot_confirm_booking
        claim_type: rbac_denial
        grounds: [roles.SCHEDULER, "endpoints.POST_/api/bookings/{booking_id}/confirm", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Confirm is exclusive to SCHEDULER; the owning MEMBER gets ERR_FORBIDDEN (peer-role isolation, not ownership)."
        test_recipe:
          setup: ["campaign, member, station; booking REQUESTED owned by M1"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /api/bookings/${b_id}/confirm", as: MEMBER, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: member_reading_other_members_booking_forbidden
        claim_type: rbac_denial
        grounds: [roles.MEMBER, "validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Ownership rule for the entity_backed MEMBER role: M2 reading M1's booking gets ERR_FORBIDDEN; M1 reading it succeeds."
        test_recipe:
          setup: ["campaign, members M1 and M2, station; booking owned by M1"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M2", member_code: "M-1002", haul_distance_miles: 12.0 }, as: COOP_ADMIN, captures: { m2_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
          trigger:
            - { call: "GET /api/bookings/${b_id}", as: MEMBER, as_user_id: "${m2_id}", captures: { err: $.data.error_id } }
            - { call: "GET /api/bookings/${b_id}", as: MEMBER, as_user_id: "${m1_id}", captures: { got_id: $.data.id } }
          assert:
            - "err == ERR_FORBIDDEN (M2 is not the booking's member)"
            - "got_id == ${b_id} (M1 reads own booking)"

      - name: sod_same_user_cannot_verify_own_recorded_sample
        claim_type: segregation_of_duties
        grounds: [roles.QUALITY_TECH, state_machines.QualitySample.RESULT_RECORDED_to_VERIFIED, "errors[ERR_SOD_VIOLATION]", "validations[priority=3]"]
        distinguishing_aspect: "Segregation of duties: the technician who recorded a LAB_VERIFY result (qt-alice) cannot verify it; the same payload from a different technician (qt-bob) succeeds."
        test_recipe:
          setup: ["campaign, member, station; booking CONFIRMED; ticket weighed; LAB_VERIFY sample recorded by qt-alice"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 60000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 16.10, trash_pct: 4.40 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
          trigger:
            - { call: "POST /api/samples/${s_id}/verify", as: QUALITY_TECH, as_user_id: "qt-alice", captures: { err: $.data.error_id } }
            - { call: "POST /api/samples/${s_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob", captures: { s_status: $.data.status } }
