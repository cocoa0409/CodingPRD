  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: submission_submit_requires_active_registration
        grounds:
          - validations[priority=22]
          - errors.ERR_REGISTRATION_NOT_ACTIVE
          - state_machines.Registration.DETERMINED_to_ACTIVE
          - state_machines.Submission.DRAFT_to_SUBMITTED
        dependency_pair: "Submission depends on Registration (the filer's obligation record)"
        distinguishing_aspect: |
          Entity pair Submission -> Registration. A draft filing may be assembled with a
          registration that is only DETERMINED, but the submit transition reads the
          OTHER entity's status: it is refused until the registration is ACTIVE, and the
          same request succeeds unchanged once the dependency moves. The dependency is
          on a foreign row reached through Plant, not on the submission's own state.
        test_recipe:
          setup:
