        claim_type: error_envelope
        grounds: [response_envelope.error, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type 'error' with data.error_id and data.message, and meta.api_request_id / api_request_timestamp."
