            - { call: "POST /shot-plans/${plan}/complete-drilling", payload: { drilled_hole_count: 20 }, as: BlastForeman, as_user_id: "bf-1", captures: { st3: $.data.status } }
          assert:
            - "first complete-drilling leaves ShotPlan.${plan}.status == DRILLED"
            - "after redrill: status == DRILLING and drilled_hole_count == 0 (cycle back, counter reset)"
            - "second complete-drilling leaves status == DRILLED again (cycle repeatable)"

      - name: stockpile_quarantine_release_cycle
        grounds:
          - state_machines.Stockpile.OPEN_to_QUARANTINED
          - state_machines.Stockpile.QUARANTINED_to_OPEN
          - state_machines.GradationTest.REPORTED_to_CONFIRMED
        distinguishing_aspect: |
          Cyclic shape on Stockpile (different entity than ShotPlan):
          OPEN -> QUARANTINED -> OPEN driven by confirmed gradation results;
          the PASS-release only fires because the latest confirmed non-VOIDED
          test is a PASS (selector: max sampled_at, tie max created_at).
        test_recipe:
          setup:
            - "Site; spec A57 with band 1.5in [90,100]; stockpile OPEN; three tests: T1 PASS, T2 FAIL (later sample), T3 PASS (latest sample)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id } }
            - { call: "POST /gradation-tests", payload: { stockpile_id: "${pile}", sampled_at: "2026-08-01T06:00:00Z", sieve_results: [ { sieve: "1.5in", pct_passing: 95 } ] }, as: QCTechnician, as_user_id: "qc-1", captures: { t1: $.data.id } }
            - { call: "POST /gradation-tests/${t1}/confirm", payload: {}, as: QCTechnician, as_user_id: "qc-2" }
            - { call: "POST /gradation-tests", payload: { stockpile_id: "${pile}", sampled_at: "2026-08-01T07:00:00Z", sieve_results: [ { sieve: "1.5in", pct_passing: 80 } ] }, as: QCTechnician, as_user_id: "qc-1", captures: { t2: $.data.id } }
            - { call: "POST /gradation-tests/${t2}/confirm", payload: {}, as: QCTechnician, as_user_id: "qc-2" }
          trigger:
            - { call: "POST /gradation-tests", payload: { stockpile_id: "${pile}", sampled_at: "2026-08-01T08:00:00Z", sieve_results: [ { sieve: "1.5in", pct_passing: 97 } ] }, as: QCTechnician, as_user_id: "qc-1", captures: { t3: $.data.id } }
            - { call: "POST /gradation-tests/${t3}/confirm", payload: {}, as: QCTechnician, as_user_id: "qc-2" }
          assert:
            - "after T1 confirm (PASS): Stockpile.${pile}.status == OPEN"
            - "after T2 confirm (FAIL): Stockpile.${pile}.status == QUARANTINED (cycle leg 1)"
            - "after T3 confirm (PASS, latest sampled_at): Stockpile.${pile}.status == OPEN (cycle leg 2)"
            - "GradationTest.${t2}.result == FAIL and GradationTest.${t3}.result == PASS"

      - name: plantrun_parallel_state_dimensions
        grounds:
          - state_machines.PlantRun
          - entities.PlantRun.fields.production_status
          - entities.PlantRun.fields.reconciliation_status
        distinguishing_aspect: |
          Parallel state dimensions on PlantRun (different entity and different
          shape than the two cycle instances): production_status reaches
          COMPLETED while reconciliation_status independently walks
          UNRECONCILED -> DISPUTED -> RECONCILED; production never changes
          during the reconciliation branch.
        test_recipe:
          setup:
            - "Site OPERATING with fired shot (muckpile OPEN), certified belt scale, pile A capacity 5000; one run COMPLETED with input 1000.0 / outputs 970.0 (within 3% balance)"
          setup_api_calls:
