      - name: audit_variance_tolerance_is_inclusive_on_both_signs
        grounds:
          - calculations.benefit_recomputation
          - state_machines.BenefitAudit.OPEN_to_PASSED
          - state_machines.BenefitAudit.OPEN_to_CORRECTION_REQUIRED
          - calculations.data_confidence_score
        distinguishing_aspect: |
          The variance fork is probed at exactly -500, exactly +500 and at -501,
          one cent past the tolerance, on three participants who share the same
          recomputation inputs (FAME 400000, 380 credited months, recomputed
          190000). abs(variance) <= 500 is inclusive on BOTH signs, so -500 and
          +500 both land in PASSED while -501 forks to CORRECTION_REQUIRED with a
          different side-effect set: PASSED mirrors participant.benefit_audit_status
          as AUDIT_OPEN, CORRECTION_REQUIRED writes CORRECTION_REQUIRED, and both
          leave data_confidence_score at 85 because the two statuses carry the same
