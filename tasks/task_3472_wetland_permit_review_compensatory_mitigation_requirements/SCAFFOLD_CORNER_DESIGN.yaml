          assert:
            - "issued == 2026-09-01T00:00:00Z (the pinned startup default)"
            - "exp == 2031-08-31T00:00:00Z (issued + 1825 days)"

      - name: corner_clock_regression_rejected
        claim_type: scheduled_actions
        grounds: ["errors[ERR_CLOCK_REGRESSION]", "endpoints.POST /_clock/set_current_utc"]
        distinguishing_aspect: "The logical clock is strictly monotonic: setting 2026-10-01 then 2026-09-15 fails with ERR_CLOCK_REGRESSION; an equal timestamp also fails."
        test_recipe:
          setup: ["Clock advanced once to 2026-10-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: SystemAdmin, captures: { err_back: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: SystemAdmin, captures: { err_same: "$.data.error_id" } }
          assert:
            - "err_back == ERR_CLOCK_REGRESSION (422)"
            - "err_same == ERR_CLOCK_REGRESSION (strictly-greater rule)"

