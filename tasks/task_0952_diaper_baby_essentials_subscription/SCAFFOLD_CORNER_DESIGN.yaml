              payload: {}
              as: OpsAdmin
              captures: { line_status: $.data.status }
          assert:
            - "${stock} == 0"
            - "${line_status} == SUBSTITUTION_PENDING"
            - "Cycle.${c1}.subtotal_cents == 2400"

