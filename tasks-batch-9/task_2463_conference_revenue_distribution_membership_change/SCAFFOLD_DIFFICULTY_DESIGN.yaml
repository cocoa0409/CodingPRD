# =====================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >= 2 instances = 25 instances.
# YAML anchors declared in the first instance are aliased by later
# instances to replay the canonical bootstrap chain without restating it.
# All numeric asserts are literals produced by executing the §1.3
# formulas in integer basis-point arithmetic.
# =====================================================================
scaffold_difficulty_design:

  # ===================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: provisional_vs_final_audited_media_distribution
        grounds:
          - calculations.distribution_share_allocation
          - calculations.distribution_line_offsets
          - entities.DistributionRun.fields.variant
          - entities.DistributionLine.fields.withheld_cents
          - state_machines.RevenuePool.OPEN_to_BOOKS_CLOSED
          - concurrency_rules[distribution-run-create-stale-pool]
        distinguishing_aspect: |
          The same pool, the same four members and the same endpoint produce different
          per-member cents under the two variants because PROVISIONAL counts SCHEDULED
          games and under-review appearances against estimated_expense_cents while
          FINAL_AUDITED counts only PLAYED games and APPROVED appearances against
          audited_expense_cents: North receives 141368422 provisionally and 140703884
          finally, and West receives 116421052 provisionally and 90776699 finally.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget of 120000000 operating cents, so reserve_target_cents is 18000000."
            - "The reserve holds 12000000 cents, a funded ratio of 6666 bps, so reserve_posture is OPEN."
            - "Four charter members exist in created_at order North, South, East, West, all FULL_SHARE at 10000 bps."
            - "Four media-designated FY2027 games exist: North-South, North-East and North-West with North at home, plus South-East with South at home. The first, second and fourth are PLAYED; the North-West game is still SCHEDULED."
            - "North has an APPROVED FY2027 bowl appearance claiming 2 units; West has a FY2027 bowl appearance still in SUBMITTED."
            - "An OPEN FY2027 MEDIA_RIGHTS pool holds 500000000 gross cents with 20000000 estimated expense cents and no audited expense figure."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_conf
              call: "POST /conference"
              payload: { name: "Mid-Continental Athletic Conference", fiscal_year_start_month: 7, current_fiscal_year: 2027, unit_value_cents: 34000000, phase_schedule_years: 3 }
              as: PlatformAdmin
              captures: { conf_id: $.data.id }
            - &k_v1
              call: "POST /venues"
              payload: { name: "Northfield Dome", city: "Northfield", seating_capacity: 60000, concurrent_event_capacity: 1 }
              as: PlatformAdmin
              captures: { v1_id: $.data.id }
            - &k_v2
              call: "POST /venues"
              payload: { name: "Eastport Arena", city: "Eastport", seating_capacity: 45000, concurrent_event_capacity: 2 }
              as: PlatformAdmin
              captures: { v2_id: $.data.id }
            - &k_mn
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "North State University", institution_code: "NOR", admission_path: "CHARTER", home_venue_id: "${v1_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_n_id: $.data.id }
            - &k_ms
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "South Valley University", institution_code: "SOU", admission_path: "CHARTER", home_venue_id: "${v1_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_s_id: $.data.id }
            - &k_me
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "East Harbor College", institution_code: "EAS", admission_path: "CHARTER", home_venue_id: "${v2_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_e_id: $.data.id }
            - &k_mw
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "West Ridge University", institution_code: "WES", admission_path: "CHARTER", home_venue_id: "${v2_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_w_id: $.data.id }
            - &k_bp
              call: "POST /budget-proposals"
              payload: { conference_id: "${conf_id}", fiscal_year: 2027, proposed_operating_expense_cents: 120000000, proposed_governance_expense_cents: 20000000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { bp_id: $.data.id }
            - &k_bp_open
              call: "POST /budget-proposals/${bp_id}/open-voting"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - &k_bal_n
