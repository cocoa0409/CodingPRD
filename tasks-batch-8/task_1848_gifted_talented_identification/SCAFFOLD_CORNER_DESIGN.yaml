            - { call: "POST /gifted/students", payload: { student_number: "ST-A", legal_name: "Stu A", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-a" }, as: GiftedCoordinator, captures: { stu_a: $.data.id } }
