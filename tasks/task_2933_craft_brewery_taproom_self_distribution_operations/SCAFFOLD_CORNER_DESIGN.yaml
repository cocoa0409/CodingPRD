          - entities.EventPermit.fields.submission_count
        distinguishing_aspect: "Each permit is individually far under the 25.00 bbl ceiling; only the SUM over SUBMITTED and APPROVED permits in the same venue state breaches it. The third submission is refused at 26.00 bbl, and because the check runs on the submit transition the permit stays DRAFT with submission_count 0."
