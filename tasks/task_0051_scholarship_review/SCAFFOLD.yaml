# =============================================================================
# Scholarship Review Management System — Scaffold v1
# =============================================================================

scenario: |
  Scholarship review management system: award setup with scholarship-type
  configuration, eligibility criteria (GPA/major/grade/family-finance), award
  amount and quota, application period, and required-material list; student
  application with online form filling, supporting-material upload
  (transcript/award certificates/poverty proof), advisor recommendation,
  application withdrawal and modification within window, and
  duplicate-application check across awards; material review with
  department-level preliminary review, completeness check, authenticity
  verification, rejection-and-correction workflow, and review-comment
  recording; reviewer scoring with reviewer pool management,
  conflict-of-interest avoidance rules (same-department/same-supervisor/
  family-relation), multi-reviewer scoring, scoring-rubric configuration,
  outlier-score handling, and weighted aggregation; quota allocation with
  quota distribution by department/grade/category, dynamic adjustment based
  on application volume, gender or special-group quota rules, and
  unfilled-quota reallocation; public announcement and objection with
  announcement period, objection submission, objection review and response,
  decision adjustment on valid objection, and final-list confirmation;
  disbursement approval with disbursement plan generation, multi-level
  financial approval, payment-channel routing, tax withholding rules, and
  disbursement record archiving; event-driven synchronization with academic
  affairs, finance, and IM systems; audit logging for review actions and
  disbursement records.

domain_name: scholarship-review
api_prefix: /scholarships

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - selector_policy            # reviewer assignment with COI exclusion
    - cascading_side_effects     # objection → decision flip → quota reallocation → disbursement revoke
    - dual_variant_calculation   # trimmed-mean vs full-mean aggregation
    - rate_threshold_triggers    # outlier z-score breakpoint
    - scheduled_deferred_actions # clock-driven window transitions
    - bulk_operations            # reviewer assignment batch + audit emit

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many                # Scholarship → Application; Application → Score
    - many_to_many               # Reviewer ↔ Application (via Assignment)
    - cross_aggregate            # Objection references Application across announcement boundary

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0  Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1  Entity-Relationship Table
# =============================================================================
entities:
  - name: Scholarship
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique scholarship code", constraints: "unique, 3-32 chars" }
      - { name: name, type: string, source: input, description: "Human-readable scholarship name" }
      - { name: category, type: enum, source: input, description: "MERIT | NEED | RESEARCH | SPECIAL_GROUP", constraints: "one of MERIT, NEED, RESEARCH, SPECIAL_GROUP" }
      - { name: per_award_amount_cents, type: integer, source: input, description: "Award amount per recipient, in cents", constraints: ">= 1" }
      - { name: total_quota, type: integer, source: input, description: "Total slots across all departments", constraints: ">= 1" }
      - { name: gpa_threshold_x100, type: integer, source: input, description: "Minimum GPA times 100 (e.g., 350 means GPA >= 3.50). Compared inclusively (>=)." }
      - { name: eligible_majors, type: array, source: input, description: "Array of major codes; empty array = ALL majors" }
      - { name: eligible_grades, type: array, source: input, description: "Array of integer grade levels (1..4 typical); empty = ALL grades" }
      - { name: family_income_ceiling_cents, type: integer, source: input, description: "Annual household income upper bound for NEED category; null for non-NEED. Compared inclusively (<=)." , default: null }
      - { name: required_materials, type: array, source: input, description: "Array of material codes in {TRANSCRIPT, AWARD_CERT, POVERTY_PROOF, ADVISOR_REC}" }
      - { name: application_window_start, type: datetime, source: input, description: "Inclusive start of application window (UTC ISO 8601)" }
      - { name: application_window_end, type: datetime, source: input, description: "Exclusive end of application window (UTC ISO 8601). Must be strictly after start." }
      - { name: announcement_window_end, type: datetime, source: input, description: "Exclusive end of announcement/objection window. Must be strictly after application_window_end." }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | REVIEWING | ANNOUNCED | FINALIZED | DISBURSED", constraints: "one of DRAFT, OPEN, REVIEWING, ANNOUNCED, FINALIZED, DISBURSED" }
      - { name: rubric_weights, type: object, source: input, description: "Map of rubric_criterion → weight; weights are non-negative integers and MUST sum to exactly 100" }
      - { name: outlier_z_threshold_x100, type: integer, source: input, description: "Z-score threshold ×100 for dropping outlier scores; default 200 (i.e., |z| > 2.00)", default: 200 }

  - name: QuotaAllocation
    parent: Scholarship
    common_fields: true
    fields:
      - { name: scholarship_id, type: string, source: system, description: "Parent scholarship id" }
      - { name: department_code, type: string, source: input, description: "Department this slice belongs to" }
      - { name: grade, type: integer, source: input, description: "Grade level (1..4)" }
      - { name: special_group, type: enum, source: input, description: "NONE | GENDER_FEMALE | GENDER_MALE | ETHNIC_MINORITY | DISABILITY", default: "NONE" }
      - { name: initial_slots, type: integer, source: input, description: "Originally allocated slots for this slice", constraints: ">= 0" }
      - { name: current_slots, type: integer, source: computed, description: "Slots after dynamic adjustment and reallocation; starts equal to initial_slots" }
      - { name: filled_slots, type: integer, source: computed, description: "Count of Applications in this slice with status AWARDED or DISBURSED" }
      - { name: reallocated_from_ids, type: array, source: computed, description: "Array of QuotaAllocation ids whose unfilled slots were moved here (chronological order of reallocation events)" }

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Reviewer's display name" }
      - { name: department_code, type: string, source: input, description: "Home department of reviewer (used in same-department COI check)" }
      - { name: family_relation_student_ids, type: array, source: input, description: "Array of student ids the reviewer has declared family relation with" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: Application
    parent: Scholarship
    common_fields: true
    fields:
      - { name: scholarship_id, type: string, source: system, description: "Parent scholarship id" }
      - { name: student_id, type: string, source: input, description: "Acting student identifier (= X-User-ID for Student role)" }
      - { name: student_department_code, type: string, source: input, description: "Student's department code (used for quota slice and COI)" }
      - { name: student_advisor_id, type: string, source: input, description: "Reviewer id of the student's academic supervisor (used for same-supervisor COI)" }
      - { name: student_major, type: string, source: input, description: "Student's major code" }
      - { name: student_grade, type: integer, source: input, description: "Student's current grade level" }
      - { name: student_gpa_x100, type: integer, source: input, description: "Student's current GPA × 100" }
      - { name: student_family_income_cents, type: integer, source: input, description: "Annual household income in cents (required for NEED applications, null otherwise)", default: null }
      - { name: student_special_group, type: enum, source: input, description: "Student's special group attribute; copied to slice key", default: "NONE" }
      - { name: uploaded_materials, type: array, source: input, description: "Array of material codes uploaded; must be a superset of Scholarship.required_materials at SUBMITTED time" }
      - { name: advisor_recommendation_id, type: string, source: input, description: "Reviewer id who issued advisor recommendation (must be Reviewer with status=ACTIVE)" , default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DEPT_PRELIM_PASSED | DEPT_PRELIM_REJECTED | UNDER_REVIEW | REVIEW_COMPLETE | AWARDED | NOT_AWARDED | WITHDRAWN | DISBURSED | REVOKED", constraints: "see §1.2" }
      - { name: dept_review_comment, type: string, source: system, description: "Latest department reviewer comment; updated on each preliminary review action", default: null }
      - { name: aggregated_score_x100, type: integer, source: computed, description: "Final weighted aggregated score × 100 after outlier handling; null until REVIEW_COMPLETE" , default: null }
      - { name: final_rank, type: integer, source: computed, description: "1-based rank within QuotaAllocation slice after FINALIZED; null otherwise", default: null }
      - { name: revocation_reason, type: enum, source: computed, description: "OBJECTION_UPHELD | AUDIT_FAILURE | null", default: null }

  - name: ReviewerAssignment
    parent: Application
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "Parent application id" }
      - { name: reviewer_id, type: string, source: input, description: "Reviewer assigned to score this application" }
      - { name: assigned_at, type: datetime, source: system, description: "When the assignment was created" }

  - name: Score
    parent: Application
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "Parent application id" }
      - { name: reviewer_id, type: string, source: input, description: "Reviewer who submitted this score; MUST have a ReviewerAssignment for this application" }
      - { name: criterion_scores, type: object, source: input, description: "Map of rubric_criterion → integer 0..100; keys MUST be exactly Scholarship.rubric_weights keys" }
      - { name: raw_total_x100, type: integer, source: computed, description: "sum(criterion_scores[c] * Scholarship.rubric_weights[c]) — equivalent to weighted score × 100 before outlier trim" }
      - { name: is_outlier, type: boolean, source: computed, description: "Set true when this score is trimmed during aggregation (see §1.3 calc:aggregate_application_score)" }
      - { name: comment, type: string, source: input, description: "Optional reviewer comment", default: null }

  - name: Objection
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "Application being objected to" }
      - { name: objector_student_id, type: string, source: input, description: "Student submitting the objection (can be the applicant or another student)" }
      - { name: reason_code, type: enum, source: input, description: "MATERIAL_FALSE | SCORING_ERROR | ELIGIBILITY_BREACH | COI_BREACH", constraints: "one of MATERIAL_FALSE, SCORING_ERROR, ELIGIBILITY_BREACH, COI_BREACH" }
      - { name: description, type: string, source: input, description: "Free-form objection details" }
      - { name: status, type: enum, source: system, description: "PENDING | UPHELD | DISMISSED", default: "PENDING" }
      - { name: ruling_comment, type: string, source: system, description: "Officer's adjudication comment; required when transitioning out of PENDING", default: null }

  - name: DisbursementPlan
    parent: Scholarship
    common_fields: true
    fields:
      - { name: scholarship_id, type: string, source: system, description: "Parent scholarship id" }
      - { name: payment_channel, type: enum, source: input, description: "BANK | CAMPUS_CARD; routing controlled by amount tier (see §1.3 calc:payment_channel_routing)" }
      - { name: status, type: enum, source: system, description: "DRAFT | DEPT_APPROVED | FINANCE_APPROVED | EXECUTED | ARCHIVED", constraints: "one of DRAFT, DEPT_APPROVED, FINANCE_APPROVED, EXECUTED, ARCHIVED" }
      - { name: total_gross_cents, type: integer, source: computed, description: "Sum of per_award_amount_cents over all Applications in AWARDED status when DRAFT was sealed" }
      - { name: total_tax_cents, type: integer, source: computed, description: "Sum of tax_withheld_cents over the same set; computed per §1.3 calc:tax_withholding" }
      - { name: total_net_cents, type: integer, source: computed, description: "total_gross_cents - total_tax_cents" }
      - { name: dept_approver_id, type: string, source: system, description: "DeptOfficer who approved at DRAFT → DEPT_APPROVED", default: null }
      - { name: finance_approver_id, type: string, source: system, description: "FinanceOfficer who approved at DEPT_APPROVED → FINANCE_APPROVED; MUST differ from dept_approver_id", default: null }

  - name: DisbursementRecord
    parent: DisbursementPlan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent disbursement plan id" }
      - { name: application_id, type: string, source: system, description: "Linked application id" }
      - { name: student_id, type: string, source: system, description: "Recipient student id" }
      - { name: gross_cents, type: integer, source: system, description: "Gross award amount in cents (= Scholarship.per_award_amount_cents at EXECUTED time)" }
      - { name: tax_withheld_cents, type: integer, source: system, description: "Tax withheld in cents per §1.3 calc:tax_withholding" }
      - { name: net_cents, type: integer, source: system, description: "= gross_cents - tax_withheld_cents" }
      - { name: payment_channel, type: enum, source: system, description: "BANK | CAMPUS_CARD; copied from DisbursementPlan with override per routing rule" }
      - { name: executed_at, type: datetime, source: system, description: "Timestamp when plan transitioned to EXECUTED" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: event_type, type: enum, source: system, description: "APPLICATION_SUBMITTED | APPLICATION_WITHDRAWN | DEPT_REVIEW | SCORE_SUBMITTED | AGGREGATION_DONE | FINALIZED | OBJECTION_RULED | DISBURSEMENT_APPROVED | DISBURSEMENT_EXECUTED | EXT_SYNC_EMITTED" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role at the moment of the event" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at the moment of the event" }
      - { name: target_entity, type: string, source: system, description: "Entity name affected" }
      - { name: target_id, type: string, source: system, description: "Affected entity id" }
      - { name: payload, type: object, source: system, description: "Frozen snapshot fields (before/after pair for state transitions)" }

  - name: ExternalSyncEvent
    parent: null
    common_fields: false
    fields:
      - { name: kind, type: enum, source: system, description: "ACADEMIC_AFFAIRS_FINALIZED | FINANCE_DISBURSED | IM_NOTIFY_AWARD | IM_NOTIFY_REJECT | IM_NOTIFY_OBJECTION_RULING" }
      - { name: application_id, type: string, source: system, description: "Application that triggered this sync event", default: null }
      - { name: scholarship_id, type: string, source: system, description: "Scholarship context" }
      - { name: payload, type: object, source: system, description: "Frozen body delivered to the downstream system" }

# =============================================================================
# §1.2  State Machine Table
# =============================================================================
state_machines:
  - entity: Scholarship
    initial_state: DRAFT
    terminal_states: [DISBURSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /scholarships/{scholarshipId}/state with to_status=OPEN, OR system tick when now() >= application_window_start"
        actor: SchoolAdmin | system
        preconditions:
          - "rubric_weights values sum to exactly 100 (else ERR_RUBRIC_WEIGHT_INVALID)"
          - "sum of QuotaAllocation.initial_slots == Scholarship.total_quota (else ERR_QUOTA_MISMATCH)"
          - "now() >= application_window_start (else ERR_WINDOW_NOT_OPEN)"
        side_effects:
          - "AuditEvent(event_type=APPLICATION_SUBMITTED context bootstrap) NOT emitted; transition itself emits nothing yet"
      - from: OPEN
        to: REVIEWING
        trigger: "POST /scholarships/{scholarshipId}/state with to_status=REVIEWING, OR system tick when now() >= application_window_end"
        actor: SchoolAdmin | system
        preconditions:
          - "now() >= application_window_end (else ERR_WINDOW_NOT_CLOSED)"
        side_effects:
          - "All Applications still in DRAFT are moved to WITHDRAWN (cascade) and AuditEvent emitted per application"
          - "Dynamic quota adjustment: invoke calc:dynamic_quota_adjustment (§1.3)"
      - from: REVIEWING
        to: ANNOUNCED
        trigger: "POST /scholarships/{scholarshipId}/state with to_status=ANNOUNCED"
        actor: SchoolAdmin
        preconditions:
          - "Every Application not in WITHDRAWN, DRAFT, DEPT_PRELIM_REJECTED is in REVIEW_COMPLETE state (else ERR_REVIEW_NOT_COMPLETE)"
        side_effects:
          - "Invoke calc:rank_and_award (§1.3) — every Application in REVIEW_COMPLETE is ranked within its QuotaAllocation slice; the top current_slots become AWARDED, the rest NOT_AWARDED. Both transitions are explicit per Application."
          - "Unfilled-quota reallocation runs (calc:unfilled_quota_reallocation) — chain cascade"
      - from: ANNOUNCED
        to: FINALIZED
        trigger: "POST /scholarships/{scholarshipId}/state with to_status=FINALIZED, OR system tick when now() >= announcement_window_end"
        actor: SchoolAdmin | system
        preconditions:
          - "now() >= announcement_window_end (else ERR_WINDOW_NOT_CLOSED)"
          - "No Objection in PENDING (else ERR_OBJECTION_PENDING)"
        side_effects:
          - "Emit ExternalSyncEvent(kind=ACADEMIC_AFFAIRS_FINALIZED) once for this Scholarship"
          - "Emit ExternalSyncEvent(kind=IM_NOTIFY_AWARD) per AWARDED Application and IM_NOTIFY_REJECT per NOT_AWARDED Application"
          - "AuditEvent(event_type=FINALIZED) emitted"
      - from: FINALIZED
        to: DISBURSED
        trigger: "POST /scholarships/{scholarshipId}/state with to_status=DISBURSED"
        actor: FinanceOfficer
        preconditions:
          - "A DisbursementPlan for this Scholarship exists in EXECUTED state (else ERR_DISBURSEMENT_NOT_EXECUTED)"
        side_effects:
          - "All AWARDED Applications transition to DISBURSED (cascade — each emits AuditEvent and ExternalSyncEvent(kind=FINANCE_DISBURSED))"
          - "DisbursementPlan transitions EXECUTED → ARCHIVED automatically"

  - entity: Application
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, REVOKED, DISBURSED, NOT_AWARDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /scholarships/{scholarshipId}/applications/{applicationId}/submit"
        actor: Student
        preconditions:
          - "Scholarship.status == OPEN (else ERR_WINDOW_NOT_OPEN)"
          - "now() < application_window_end (else ERR_WINDOW_CLOSED)"
          - "Eligibility passes: GPA, major, grade, family-finance per calc:eligibility_check (else ERR_ELIGIBILITY_FAIL)"
          - "uploaded_materials ⊇ Scholarship.required_materials (else ERR_MATERIAL_MISSING)"
          - "If ADVISOR_REC is required, advisor_recommendation_id is a Reviewer with status=ACTIVE (else ERR_ADVISOR_REC_MISSING)"
          - "Student has no other Application against this Scholarship in any non-terminal status (else ERR_DUPLICATE_APPLICATION_SAME)"
          - "Student has no Application against another Scholarship of the SAME category whose application_window collides with this Scholarship's application_window under a 3-day-buffer rule: two scholarships collide iff their intervals (with each end extended by +3 days, treated as closed-closed) intersect at any point. Boundary touching does NOT make them collide because the buffer is one-sided in math: [a.start, a.end + 3d] ∩ [b.start, b.end + 3d] non-empty. (else ERR_DUPLICATE_APPLICATION_CROSS)"
        side_effects:
          - "AuditEvent(event_type=APPLICATION_SUBMITTED)"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /scholarships/{scholarshipId}/applications/{applicationId}/modify"
        actor: Student
        preconditions:
          - "now() < application_window_end (else ERR_WINDOW_CLOSED)"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /scholarships/{scholarshipId}/applications/{applicationId}/withdraw"
        actor: Student
        preconditions:
          - "now() < application_window_end (else ERR_WINDOW_CLOSED)"
        side_effects:
          - "AuditEvent(event_type=APPLICATION_WITHDRAWN)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "Cascade from Scholarship OPEN→REVIEWING (system)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditEvent(event_type=APPLICATION_WITHDRAWN, payload.cause=WINDOW_CLOSED)"
      - from: SUBMITTED
        to: DEPT_PRELIM_PASSED
        trigger: "POST /scholarships/{scholarshipId}/applications/{applicationId}/dept-review with decision=PASS"
        actor: DeptOfficer
        preconditions:
          - "Scholarship.status == REVIEWING (else ERR_INVALID_STATE)"
          - "DeptOfficer's department_code == Application.student_department_code (else ERR_DEPT_SCOPE_MISMATCH)"
          - "Completeness re-check: uploaded_materials ⊇ required_materials AND each is_authentic flag set true in payload (else ERR_MATERIAL_INCOMPLETE)"
        side_effects:
          - "dept_review_comment overwritten with payload.comment"
          - "AuditEvent(event_type=DEPT_REVIEW, payload.decision=PASS)"
      - from: SUBMITTED
        to: DEPT_PRELIM_REJECTED
        trigger: "POST /scholarships/{scholarshipId}/applications/{applicationId}/dept-review with decision=REJECT"
        actor: DeptOfficer
        preconditions:
          - "Scholarship.status == REVIEWING"
          - "DeptOfficer's department_code == Application.student_department_code (else ERR_DEPT_SCOPE_MISMATCH)"
          - "payload.comment is a non-empty string (else ERR_COMMENT_REQUIRED)"
        side_effects:
          - "dept_review_comment overwritten with payload.comment"
          - "AuditEvent(event_type=DEPT_REVIEW, payload.decision=REJECT)"
      - from: DEPT_PRELIM_REJECTED
        to: SUBMITTED
        trigger: "POST /scholarships/{scholarshipId}/applications/{applicationId}/correct"
        actor: Student
        preconditions:
          - "Scholarship.status == REVIEWING (else ERR_INVALID_STATE)"
          - "Each material code listed in payload.replaced_materials is present in uploaded_materials (else ERR_MATERIAL_MISSING)"
        side_effects:
          - "dept_review_comment cleared to null"
      - from: DEPT_PRELIM_PASSED
        to: UNDER_REVIEW
        trigger: "POST /scholarships/{scholarshipId}/applications/{applicationId}/assign-reviewers"
        actor: SchoolAdmin
        preconditions:
          - "Exactly 3 reviewer_ids supplied (else ERR_REVIEWER_COUNT_INVALID)"
          - "Each reviewer passes COI check per calc:coi_check (else ERR_COI_VIOLATION)"
          - "Each reviewer's status == ACTIVE (else ERR_REVIEWER_NOT_ACTIVE)"
          - "No duplicate reviewer_ids in the input (else ERR_REVIEWER_DUPLICATE)"
        side_effects:
          - "3 ReviewerAssignment rows are created (one per reviewer_id)"
      - from: UNDER_REVIEW
        to: REVIEW_COMPLETE
        trigger: "System auto-transition when count of Score rows for this Application equals 3"
        actor: system
        preconditions: []
        side_effects:
          - "Invoke calc:aggregate_application_score (§1.3) — sets aggregated_score_x100 and may flip Score.is_outlier=true on dropped rows"
          - "AuditEvent(event_type=AGGREGATION_DONE)"
      - from: REVIEW_COMPLETE
        to: AWARDED
        trigger: "Cascade from Scholarship REVIEWING→ANNOUNCED via calc:rank_and_award"
        actor: system
        preconditions:
          - "Application's rank within its QuotaAllocation slice (sliced by department_code, grade, special_group) is <= current_slots after dynamic adjustment"
        side_effects:
          - "QuotaAllocation.filled_slots += 1 on that slice"
      - from: REVIEW_COMPLETE
        to: NOT_AWARDED
        trigger: "Cascade from Scholarship REVIEWING→ANNOUNCED via calc:rank_and_award"
        actor: system
        preconditions:
          - "Application's rank > current_slots after dynamic adjustment"
        side_effects: []
      - from: AWARDED
        to: REVOKED
        trigger: "Cascade from Objection PENDING→UPHELD (system)"
        actor: system
        preconditions: []
        side_effects:
          - "revocation_reason := OBJECTION_UPHELD"
          - "QuotaAllocation.filled_slots -= 1 on the application's slice"
          - "Highest-ranked NOT_AWARDED application in the same slice (if any) flips to AWARDED — cascading promotion. Tie-break: lower student_id wins (lexical)."
          - "ExternalSyncEvent(kind=IM_NOTIFY_OBJECTION_RULING)"
      - from: AWARDED
        to: DISBURSED
        trigger: "Cascade from Scholarship FINALIZED→DISBURSED"
        actor: system
        preconditions: []
        side_effects:
          - "DisbursementRecord is created for this Application"
          - "ExternalSyncEvent(kind=FINANCE_DISBURSED)"

  - entity: Objection
    initial_state: PENDING
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: PENDING
        to: UPHELD
        trigger: "POST /scholarships/{scholarshipId}/objections/{objectionId}/rule with decision=UPHOLD"
        actor: SchoolAdmin
        preconditions:
          - "Scholarship.status == ANNOUNCED (else ERR_INVALID_STATE)"
          - "now() < Scholarship.announcement_window_end (else ERR_WINDOW_CLOSED)"
          - "payload.ruling_comment is a non-empty string (else ERR_COMMENT_REQUIRED)"
        side_effects:
          - "Application referenced by Objection transitions AWARDED→REVOKED if currently AWARDED (cross-entity cascade)"
      - from: PENDING
        to: DISMISSED
        trigger: "POST /scholarships/{scholarshipId}/objections/{objectionId}/rule with decision=DISMISS"
        actor: SchoolAdmin
        preconditions:
          - "Scholarship.status == ANNOUNCED"
          - "payload.ruling_comment is a non-empty string (else ERR_COMMENT_REQUIRED)"
        side_effects:
          - "ExternalSyncEvent(kind=IM_NOTIFY_OBJECTION_RULING)"

  - entity: DisbursementPlan
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: DEPT_APPROVED
        trigger: "POST /scholarships/{scholarshipId}/disbursement-plans/{planId}/approve with level=DEPT"
        actor: DeptOfficer
        preconditions:
          - "Scholarship.status == FINALIZED (else ERR_INVALID_STATE)"
          - "total_gross_cents > 0 (else ERR_PLAN_EMPTY)"
        side_effects:
          - "dept_approver_id := X-User-ID"
          - "AuditEvent(event_type=DISBURSEMENT_APPROVED, payload.level=DEPT)"
      - from: DEPT_APPROVED
        to: FINANCE_APPROVED
        trigger: "POST /scholarships/{scholarshipId}/disbursement-plans/{planId}/approve with level=FINANCE"
        actor: FinanceOfficer
        preconditions:
          - "X-User-ID != dept_approver_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "finance_approver_id := X-User-ID"
          - "AuditEvent(event_type=DISBURSEMENT_APPROVED, payload.level=FINANCE)"
      - from: FINANCE_APPROVED
        to: EXECUTED
        trigger: "POST /scholarships/{scholarshipId}/disbursement-plans/{planId}/execute"
        actor: FinanceOfficer
        preconditions:
          - "X-User-ID == finance_approver_id (else ERR_EXECUTOR_MISMATCH)"
        side_effects:
          - "For each AWARDED Application: create DisbursementRecord with channel routing per calc:payment_channel_routing and tax per calc:tax_withholding"
          - "AuditEvent(event_type=DISBURSEMENT_EXECUTED)"
      - from: DEPT_APPROVED
        to: DRAFT
        trigger: "POST /scholarships/{scholarshipId}/disbursement-plans/{planId}/revert"
        actor: DeptOfficer
        preconditions:
          - "X-User-ID == dept_approver_id (else ERR_FORBIDDEN)"
          - "Scholarship.status == FINALIZED (else ERR_INVALID_STATE)"
        side_effects:
          - "dept_approver_id := null"
          - "AuditEvent(event_type=DISBURSEMENT_APPROVED, payload.level=DEPT, payload.action=REVERT)"
          - "Invariant: DisbursementPlan.total_gross_cents and total_tax_cents are unchanged (these were snapshotted at create time)"
      - from: EXECUTED
        to: ARCHIVED
        trigger: "Cascade from Scholarship FINALIZED→DISBURSED (system)"
        actor: system
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1  Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Student submits two applications to the same scholarship simultaneously"
    guarantee: "At most one Application per (scholarship_id, student_id) reaches SUBMITTED; the loser is rejected"
    error_id: ERR_DUPLICATE_APPLICATION_SAME
    http_status: 409
    serialization: "First-writer-wins on (scholarship_id, student_id) uniqueness"

  - scenario: "Two reviewers submit the third score for the same Application at the same time"
    guarantee: "Exactly one Score row is recorded as the third; the other is rejected as over-quota"
    error_id: ERR_SCORE_OVER_QUOTA
    http_status: 409
    serialization: "First-writer-wins on count(Score for application_id) == 3"

  - scenario: "Department officer and finance officer both approve a DisbursementPlan concurrently expecting to be the first approver"
    guarantee: "Exactly one becomes dept_approver_id; the other operation is rejected as invalid level for current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on DisbursementPlan.status"

  - scenario: "Two officers rule on the same Objection at the same time"
    guarantee: "Exactly one ruling is recorded; the loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Objection.status"

  - scenario: "Two assign-reviewers calls run in parallel for the same Application"
    guarantee: "At most one set of 3 ReviewerAssignments exists; the loser is rejected"
    error_id: ERR_REVIEWERS_ALREADY_ASSIGNED
    http_status: 409
    serialization: "First-writer-wins on existence of any ReviewerAssignment for application_id"

# =============================================================================
# §1.3  Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_check
    trigger: "Application DRAFT→SUBMITTED preconditions"
    algorithm: threshold
    formula: |
      pass iff ALL of the following hold:
        (1) Application.student_gpa_x100 >= Scholarship.gpa_threshold_x100             # inclusive
        (2) Scholarship.eligible_majors is empty OR Application.student_major ∈ Scholarship.eligible_majors
        (3) Scholarship.eligible_grades is empty OR Application.student_grade ∈ Scholarship.eligible_grades
        (4) if Scholarship.category == NEED:
              Application.student_family_income_cents is not null AND
              Application.student_family_income_cents <= Scholarship.family_income_ceiling_cents   # inclusive
            else: (no income check)
    input_set: "single Application + parent Scholarship"
    precision: integer comparisons only

  - name: coi_check
    trigger: "POST .../assign-reviewers"
    algorithm: matching
    formula: |
      for each reviewer_id in the proposed set:
        Reviewer r = lookup(reviewer_id)
        violation iff ANY of:
          (a) same-department:    r.department_code == Application.student_department_code
          (b) same-supervisor:    r.id == Application.student_advisor_id
          (c) family-relation:    Application.student_id ∈ r.family_relation_student_ids
        # No duplicates: count(reviewer_ids) == len(set(reviewer_ids)) else ERR_REVIEWER_DUPLICATE
        # Each reviewer's status must be ACTIVE
    input_set: "Application + 3 candidate Reviewer rows"

  - name: aggregate_application_score
    trigger: "UNDER_REVIEW→REVIEW_COMPLETE auto-transition (3rd Score arrival)"
    algorithm: weighted_scoring
    formula: |
      # raw_total_x100 per Score row, in integer-cents-style x100 representation:
      for each Score s of this Application:
        s.raw_total_x100 = sum( s.criterion_scores[c] * Scholarship.rubric_weights[c] for c in rubric_weights.keys() )
        # Since each weight is an integer 0..100 and sum(weights)==100, raw_total_x100 ∈ [0..10000]
      mean   = avg(s.raw_total_x100 for the 3 scores)
      stddev = population_stddev(s.raw_total_x100 for the 3 scores)
      # Variant A (default, when 3 scores present): trimmed-mean
      for each s:
        if stddev > 0 and abs(s.raw_total_x100 - mean) * 100 > Scholarship.outlier_z_threshold_x100 * stddev:
          s.is_outlier = true
        else:
          s.is_outlier = false
      kept = [s for s in scores if not s.is_outlier]
      if len(kept) == 0:                       # everyone trimmed (only possible at stddev==0 edge)
        Application.aggregated_score_x100 = round_half_up(mean)
      else:
        Application.aggregated_score_x100 = round_half_up( avg(s.raw_total_x100 for s in kept) )
    input_set: "all 3 Score rows of this Application"
    constants: { TRIM_RULE: "|z|*100 > outlier_z_threshold_x100" }
    precision: "Final aggregated_score_x100 is an integer; rounding is round_half_up at the final averaging step."
    variants:
      - name: full_mean
        when: "Reviewer pool has exactly 1 active reviewer for an Application's slice (population_stddev undefined or all 3 scores identical so stddev==0)"
        difference: "When stddev == 0 across all 3 scores, no row is marked outlier; aggregated_score_x100 = round_half_up(mean) — equivalent to full simple mean."
      - name: trimmed_mean
        when: "stddev > 0"
        difference: "Outlier rows (|raw_total - mean| * 100 > outlier_z_threshold_x100 * stddev) are dropped before averaging."

  - name: dynamic_quota_adjustment
    trigger: "Scholarship OPEN→REVIEWING side-effect"
    algorithm: aggregation
    formula: |
      # At the moment of OPEN→REVIEWING, count Applications per QuotaAllocation slice key (department_code, grade, special_group)
      # status considered: SUBMITTED, DEPT_PRELIM_PASSED, DEPT_PRELIM_REJECTED  (anything past SUBMITTED that hasn't withdrawn)
      total_demand = sum(initial_slots for every slice s)   # == Scholarship.total_quota
      for each slice s:
        demand_count = count(Applications matching s and status in {SUBMITTED, DEPT_PRELIM_PASSED, DEPT_PRELIM_REJECTED})
        s.current_slots = s.initial_slots   # baseline first
      # Then apply correction: any slice with demand_count < initial_slots donates min(initial_slots - demand_count, initial_slots) "soft" slots into a pool.
      donor_pool = sum( max(0, s.initial_slots - demand_count(s)) for s in slices )
      # Recipients receive proportional to over-demand:
      over_demand_total = sum( max(0, demand_count(s) - s.initial_slots) for s in slices )
      for each slice s with demand_count(s) > s.initial_slots and over_demand_total > 0:
        # integer floor-division allocation; remainder distributed by descending demand_count(s), tie-break lower id (lexical)
        share = floor( donor_pool * max(0, demand_count(s) - s.initial_slots) / over_demand_total )
        s.current_slots = s.initial_slots + share
      for each slice s with demand_count(s) <= s.initial_slots:
        s.current_slots = demand_count(s)   # never award beyond demand
      # Remainder slots from floor-division go to the slice with the largest demand_count (tie-break lower id), one each, until exhausted.
    input_set: "all Applications + all QuotaAllocations of this Scholarship"
    precision: "Integer slots only — floor division with explicit remainder distribution"

  - name: rank_and_award
    trigger: "Scholarship REVIEWING→ANNOUNCED"
    algorithm: weighted_scoring
    formula: |
      for each slice (department_code, grade, special_group):
        candidates = Applications in REVIEW_COMPLETE matching this slice
        sort candidates DESC by aggregated_score_x100
          tie-break 1: ASC by student_gpa_x100  is NOT used   # NO — keep deterministic by id
          tie-break: ASC by Application.id (lexical)
        for i, app in enumerate(candidates, start=1):
          app.final_rank = i
          if i <= slice.current_slots:
            transition app: REVIEW_COMPLETE → AWARDED  (slice.filled_slots += 1)
          else:
            transition app: REVIEW_COMPLETE → NOT_AWARDED
    input_set: "all REVIEW_COMPLETE Applications and their QuotaAllocations"

  - name: unfilled_quota_reallocation
    trigger: "Scholarship REVIEWING→ANNOUNCED — chained immediately after calc:rank_and_award"
    algorithm: waterfall_allocation
    formula: |
      # After rank_and_award, every slice has filled_slots <= current_slots.
      surplus_pool = sum( slice.current_slots - slice.filled_slots for every slice s )
      # Recipient ordering — same scholarship category, same grade preferred:
      recipient_slices = [s for s in slices if there exists at least one NOT_AWARDED Application in s with status REVIEW_COMPLETE-passing rank]
      sort recipient_slices by (s.filled_slots/s.current_slots ASC if current_slots>0 else 1.0, ASC slice.id lexical)
      for s in recipient_slices while surplus_pool > 0:
        candidates = NOT_AWARDED Applications in s sorted DESC by aggregated_score_x100, tie-break ASC by Application.id
        take = min(surplus_pool, len(candidates))
        for app in candidates[:take]:
          app: NOT_AWARDED → AWARDED                      # cascade-promotion
          s.filled_slots += 1
          s.reallocated_from_ids.append( <donor slice id with surplus> )   # bookkeeping
        surplus_pool -= take
    input_set: "all slices + NOT_AWARDED Applications post-rank_and_award"

  - name: tax_withholding
    trigger: "DisbursementPlan FINANCE_APPROVED→EXECUTED — per DisbursementRecord"
    algorithm: tiered_pricing
    formula: |
      # Total tax has TWO independent components, EACH rounded to integer cents then summed.
      #   tax_withheld_cents = base_tax + surcharge
      # gross_cents = Scholarship.per_award_amount_cents
      #
      # Component 1 — Tiered base tax (waterfall). Boundaries: lower-INCLUSIVE, upper-EXCLUSIVE.
      base_tax = 0
      tiers = [
        (0,            500000,   0),     #     [0,        5000.00) → 0%
        (500000,       2000000,  3),     #  [5000.00,    20000.00) → 3%
        (2000000,      5000000,  10),    # [20000.00,    50000.00) → 10%
        (5000000, 1_000_000_000, 20),    # [50000.00,            ∞) → 20%
      ]
      for (lo, hi, rate_percent) in tiers:
        if gross_cents <= lo: break
        slice_amount = min(gross_cents, hi) - lo
        if slice_amount > 0:
          base_tax += round_half_up(slice_amount * rate_percent / 100)   # per-tier rounding

      # Component 2 — flat education-fund surcharge of 0.3% on gross_cents.
      surcharge = round_half_up(gross_cents * 3 / 1000)   # 0.3% = 3/1000

      tax_withheld_cents = base_tax + surcharge   # pinned: SUM TWO INDEPENDENTLY ROUNDED COMPONENTS
      DisbursementRecord.tax_withheld_cents = tax_withheld_cents
      DisbursementRecord.net_cents = gross_cents - tax_withheld_cents
    constants:
      TIER_BOUNDARIES_CENTS: "[0, 500000, 2000000, 5000000, 1000000000]"
      TIER_RATES_PERCENT:    "[0, 3, 10, 20]"
      SURCHARGE_RATE_PER_MILLE: 3
    precision: "Pinned order — round each component INDEPENDENTLY to integer cents using round_half_up, THEN sum the two integers. Forbidden alternative: compute (base_unrounded + surcharge_unrounded) once and round at the end. These can differ by 1 cent at fractional-edge gross values (see variants)."
    variants:
      - name: round_per_component_then_sum
        when: "default — pinned by this scaffold"
        difference: "tax = round_half_up(base_unrounded) + round_half_up(surcharge_unrounded)"
      - name: sum_then_round
        when: "NOT used — explicitly forbidden by this scaffold"
        difference: "tax = round_half_up(base_unrounded + surcharge_unrounded) — at gross=150 cents this yields 1 cent while pinned order yields 0, etc."

  - name: payment_channel_routing
    trigger: "DisbursementPlan EXECUTED — per DisbursementRecord"
    algorithm: threshold
    formula: |
      # Override of DisbursementPlan.payment_channel by per-record net amount:
      if DisbursementRecord.net_cents >= 1_000_000:    # net >= 10000.00
        DisbursementRecord.payment_channel = BANK
      else:
        DisbursementRecord.payment_channel = DisbursementPlan.payment_channel
    constants:
      ROUTING_THRESHOLD_CENTS: 1000000
    precision: "Boundary is >= (1,000,000 cents routes to BANK)"

# =============================================================================
# §1.4  Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-Role and X-User-ID headers present",                                            error_id: ERR_AUTH_MISSING,                http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                  check: "Role is permitted for this endpoint per §1.7 RBAC",                                   error_id: ERR_FORBIDDEN,                   http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,             check: "Path resources exist left-to-right (scholarship, application, etc.)",                 error_id: ERR_NOT_FOUND,                   http_status: 404, applies_to: "all path-bearing endpoints" }
  - { priority: 4,  category: state,                 check: "OCC version match when 'version' in body (PATCH and mutating POSTs that update state)", error_id: ERR_VERSION_MISMATCH,          http_status: 409, applies_to: "all mutating endpoints on entities with common_fields" }
  - { priority: 5,  category: state,                 check: "Parent Scholarship.status compatible with operation per §1.2",                       error_id: ERR_INVALID_STATE,               http_status: 409, applies_to: "Application, Score, Objection, DisbursementPlan endpoints" }
  - { priority: 6,  category: state,                 check: "Target entity in correct state for the requested transition",                        error_id: ERR_INVALID_STATE,               http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 7,  category: business_temporal,     check: "Time window respected (application or announcement window)",                         error_id: ERR_WINDOW_CLOSED,               http_status: 409, applies_to: "Application submit/withdraw/modify, Objection submit" }
  - { priority: 8,  category: business_safety,      check: "Segregation-of-duties: finance approver and dept approver must differ; executor == finance approver", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "DisbursementPlan approve/execute" }
  - { priority: 9,  category: business_safety,      check: "Reviewer COI check passes per calc:coi_check",                                       error_id: ERR_COI_VIOLATION,                http_status: 409, applies_to: "POST .../assign-reviewers" }
  - { priority: 10, category: business_referential, check: "Department scope match: actor's department equals applicant's department",            error_id: ERR_DEPT_SCOPE_MISMATCH,          http_status: 403, applies_to: "POST .../dept-review" }
  - { priority: 11, category: business_referential, check: "Duplicate-application — same scholarship, non-terminal",                              error_id: ERR_DUPLICATE_APPLICATION_SAME,   http_status: 409, applies_to: "POST .../applications (create) and submit" }
  - { priority: 12, category: business_referential, check: "Duplicate-application across same category — student has another Application against a Scholarship of the same category whose window collides under the 3-day buffer rule: [a.start, a.end+3d] ∩ [b.start, b.end+3d] non-empty (closed-closed buffered overlap)", error_id: ERR_DUPLICATE_APPLICATION_CROSS, http_status: 409, applies_to: "POST .../applications/{id}/submit" }
  - { priority: 13, category: business_constraint,  check: "Materials completeness: uploaded_materials ⊇ required_materials",                     error_id: ERR_MATERIAL_MISSING,             http_status: 422, applies_to: "POST .../applications/{id}/submit and .../correct" }
  - { priority: 14, category: business_constraint,  check: "Advisor recommendation reviewer present and ACTIVE (when required by Scholarship)",   error_id: ERR_ADVISOR_REC_MISSING,          http_status: 422, applies_to: "POST .../applications/{id}/submit" }
  - { priority: 15, category: business_constraint,  check: "Eligibility check passes per calc:eligibility_check",                                  error_id: ERR_ELIGIBILITY_FAIL,             http_status: 422, applies_to: "POST .../applications/{id}/submit" }
  - { priority: 16, category: business_constraint,  check: "Reviewer count == 3 and no duplicate reviewer_ids",                                   error_id: ERR_REVIEWER_COUNT_INVALID,       http_status: 422, applies_to: "POST .../assign-reviewers" }
  - { priority: 17, category: business_constraint,  check: "Score.criterion_scores keys == Scholarship.rubric_weights keys (exact set)",          error_id: ERR_SCORE_RUBRIC_MISMATCH,        http_status: 422, applies_to: "POST .../scores" }
  - { priority: 18, category: business_constraint,  check: "Score row count for this Application not already 3 (over-quota)",                    error_id: ERR_SCORE_OVER_QUOTA,             http_status: 409, applies_to: "POST .../scores" }
  - { priority: 19, category: business_constraint,  check: "rubric_weights values sum to exactly 100",                                            error_id: ERR_RUBRIC_WEIGHT_INVALID,        http_status: 422, applies_to: "POST /scholarships and PATCH /scholarships" }
  - { priority: 20, category: business_constraint,  check: "Sum of QuotaAllocation.initial_slots == Scholarship.total_quota at DRAFT→OPEN",       error_id: ERR_QUOTA_MISMATCH,               http_status: 422, applies_to: "POST /scholarships/{id}/state to_status=OPEN" }
  - { priority: 21, category: business_fiscal,      check: "DisbursementPlan total_gross_cents > 0",                                              error_id: ERR_PLAN_EMPTY,                   http_status: 409, applies_to: "POST .../disbursement-plans/{id}/approve level=DEPT" }
  - { priority: 22, category: business_constraint,  check: "Objection submitted within announcement window",                                     error_id: ERR_WINDOW_CLOSED,                http_status: 409, applies_to: "POST .../objections" }
  - { priority: 23, category: business_constraint,  check: "Ruling comment non-empty when ruling an Objection or rejecting at dept-review",      error_id: ERR_COMMENT_REQUIRED,             http_status: 422, applies_to: "POST .../objections/{id}/rule and POST .../dept-review reject" }
  - { priority: 24, category: business_temporal,    check: "Scholarship application_window must NOT overlap with any existing Scholarship of the same category and not in DISBURSED status; interval semantics: half-open intervals [start, end) — touching at boundary (a.end == b.start) is allowed", error_id: ERR_SCHOLARSHIP_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /scholarships and PATCH /scholarships (window edits)" }

# =============================================================================
# §1.5  API Endpoint Table
# =============================================================================
endpoints:
  # ---- Scholarship lifecycle ----
  - { method: POST,   path: "/scholarships",                                                                                     description: "Create a new Scholarship (DRAFT)",                                                  roles: [SchoolAdmin],                       code: 201, input: [code, name, category, per_award_amount_cents, total_quota, gpa_threshold_x100, eligible_majors, eligible_grades, "family_income_ceiling_cents?", required_materials, application_window_start, application_window_end, announcement_window_end, rubric_weights, "outlier_z_threshold_x100?"], output: Scholarship, side_effects: ["status=DRAFT"] }
  - { method: GET,    path: "/scholarships/{scholarshipId}",                                                                     description: "Get a Scholarship",                                                                 roles: [SchoolAdmin, DeptOfficer, FinanceOfficer, Student, Reviewer], code: 200, input: [], output: Scholarship, side_effects: [] }
  - { method: PATCH,  path: "/scholarships/{scholarshipId}",                                                                     description: "Update Scholarship (only while DRAFT)",                                            roles: [SchoolAdmin],                       code: 200, input: ["name?, per_award_amount_cents?, rubric_weights?, required_materials?, outlier_z_threshold_x100?, version"], output: Scholarship, side_effects: ["Re-validate rubric weights sum == 100"] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/state",                                                              description: "Transition Scholarship status",                                                     roles: [SchoolAdmin],                       code: 200, input: [to_status, "version"], output: Scholarship, side_effects: ["State transition per §1.2 + cascades"] }

  # ---- QuotaAllocation ----
  - { method: POST,   path: "/scholarships/{scholarshipId}/quota-allocations",                                                  description: "Create a QuotaAllocation row (only while Scholarship.status==DRAFT)",                 roles: [SchoolAdmin],                       code: 201, input: [department_code, grade, "special_group?", initial_slots], output: QuotaAllocation, side_effects: ["current_slots=initial_slots, filled_slots=0"] }
  - { method: GET,    path: "/scholarships/{scholarshipId}/quota-allocations",                                                  description: "List QuotaAllocations for a Scholarship",                                          roles: [SchoolAdmin, DeptOfficer],          code: 200, input: ["limit?, offset?"], output: "QuotaAllocation[]", side_effects: [] }

  # ---- Reviewer pool ----
  - { method: POST,   path: "/reviewers",                                                                                        description: "Create a Reviewer (pool entry)",                                                   roles: [SchoolAdmin],                       code: 201, input: [full_name, department_code, "family_relation_student_ids?"], output: Reviewer, side_effects: ["status=ACTIVE"] }
  - { method: GET,    path: "/reviewers/{reviewerId}",                                                                           description: "Get a Reviewer",                                                                   roles: [SchoolAdmin, DeptOfficer],          code: 200, input: [], output: Reviewer, side_effects: [] }
  - { method: PATCH,  path: "/reviewers/{reviewerId}",                                                                           description: "Update Reviewer (status, family_relation_student_ids)",                            roles: [SchoolAdmin],                       code: 200, input: ["status?, family_relation_student_ids?, version"], output: Reviewer, side_effects: [] }

  # ---- Application ----
  - { method: POST,   path: "/scholarships/{scholarshipId}/applications",                                                       description: "Create an Application (DRAFT)",                                                    roles: [Student],                           code: 201, input: [student_department_code, student_advisor_id, student_major, student_grade, student_gpa_x100, "student_family_income_cents?", "student_special_group?", uploaded_materials, "advisor_recommendation_id?"], output: Application, side_effects: ["status=DRAFT, student_id=X-User-ID"] }
  - { method: GET,    path: "/scholarships/{scholarshipId}/applications/{applicationId}",                                       description: "Get an Application",                                                               roles: [SchoolAdmin, DeptOfficer, Reviewer, Student], code: 200, input: [], output: Application, side_effects: [] }
  - { method: PATCH,  path: "/scholarships/{scholarshipId}/applications/{applicationId}",                                       description: "Update Application form fields (only while DRAFT)",                                roles: [Student],                           code: 200, input: ["student_major?, student_grade?, student_gpa_x100?, student_family_income_cents?, uploaded_materials?, advisor_recommendation_id?, version"], output: Application, side_effects: [] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/applications/{applicationId}/submit",                                description: "Submit an Application (DRAFT→SUBMITTED)",                                          roles: [Student],                           code: 200, input: ["version"], output: Application, side_effects: ["Eligibility + duplicate + materials checks"] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/applications/{applicationId}/withdraw",                              description: "Withdraw an Application (SUBMITTED→WITHDRAWN)",                                    roles: [Student],                           code: 200, input: ["version"], output: Application, side_effects: [] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/applications/{applicationId}/modify",                                description: "Send Application back to DRAFT to edit (SUBMITTED→DRAFT)",                         roles: [Student],                           code: 200, input: ["version"], output: Application, side_effects: [] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/applications/{applicationId}/dept-review",                           description: "Department preliminary review",                                                    roles: [DeptOfficer],                       code: 200, input: [decision, comment, "is_authentic_flags?", "version"], output: Application, side_effects: ["Updates dept_review_comment + transitions per §1.2"] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/applications/{applicationId}/correct",                               description: "Student corrects after rejection (DEPT_PRELIM_REJECTED→SUBMITTED)",                roles: [Student],                           code: 200, input: ["replaced_materials, version"], output: Application, side_effects: ["Clears dept_review_comment"] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/applications/{applicationId}/assign-reviewers",                      description: "Assign 3 reviewers (DEPT_PRELIM_PASSED→UNDER_REVIEW)",                              roles: [SchoolAdmin],                       code: 200, input: ["reviewer_ids, version"], output: Application, side_effects: ["3 ReviewerAssignment rows created"] }

  # ---- Score ----
  - { method: POST,   path: "/scholarships/{scholarshipId}/applications/{applicationId}/scores",                                description: "Submit a reviewer score (1 of 3)",                                                 roles: [Reviewer],                           code: 201, input: [criterion_scores, "comment?"], output: Score, side_effects: ["Auto-aggregate when 3rd score arrives"] }
  - { method: GET,    path: "/scholarships/{scholarshipId}/applications/{applicationId}/scores",                                description: "List Scores for an Application",                                                  roles: [SchoolAdmin, DeptOfficer],          code: 200, input: ["limit?, offset?"], output: "Score[]", side_effects: [] }

  # ---- Objection ----
  - { method: POST,   path: "/scholarships/{scholarshipId}/objections",                                                         description: "Submit an Objection during announcement window",                                  roles: [Student],                           code: 201, input: [application_id, reason_code, description], output: Objection, side_effects: ["status=PENDING"] }
  - { method: GET,    path: "/scholarships/{scholarshipId}/objections/{objectionId}",                                            description: "Get an Objection",                                                                 roles: [SchoolAdmin, Student],              code: 200, input: [], output: Objection, side_effects: [] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/objections/{objectionId}/rule",                                       description: "Rule on an Objection (PENDING→UPHELD/DISMISSED)",                                  roles: [SchoolAdmin],                       code: 200, input: [decision, ruling_comment, "version"], output: Objection, side_effects: ["Cross-entity cascade per §1.2"] }

  # ---- DisbursementPlan ----
  - { method: POST,   path: "/scholarships/{scholarshipId}/disbursement-plans",                                                  description: "Create a DisbursementPlan (DRAFT)",                                                roles: [FinanceOfficer],                    code: 201, input: [payment_channel], output: DisbursementPlan, side_effects: ["Aggregates AWARDED applications → total_gross_cents"] }
  - { method: GET,    path: "/scholarships/{scholarshipId}/disbursement-plans/{planId}",                                          description: "Get a DisbursementPlan",                                                          roles: [SchoolAdmin, DeptOfficer, FinanceOfficer], code: 200, input: [], output: DisbursementPlan, side_effects: [] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/disbursement-plans/{planId}/approve",                                  description: "Multi-level approval (DRAFT→DEPT_APPROVED→FINANCE_APPROVED)",                     roles: [DeptOfficer, FinanceOfficer],       code: 200, input: ["level, version"], output: DisbursementPlan, side_effects: ["Records approver id; SOD check on finance level"] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/disbursement-plans/{planId}/revert",                                   description: "Revert a DEPT_APPROVED plan back to DRAFT (only by dept_approver_id)",             roles: [DeptOfficer],                       code: 200, input: ["version"], output: DisbursementPlan, side_effects: ["Clears dept_approver_id; emits audit event; total_gross_cents and total_tax_cents are preserved"] }
  - { method: POST,   path: "/scholarships/{scholarshipId}/disbursement-plans/{planId}/execute",                                  description: "Execute plan (FINANCE_APPROVED→EXECUTED)",                                         roles: [FinanceOfficer],                    code: 200, input: ["version"], output: DisbursementPlan, side_effects: ["Creates DisbursementRecord per AWARDED Application; channel routing + tax"] }
  - { method: GET,    path: "/scholarships/{scholarshipId}/disbursement-plans/{planId}/records",                                  description: "List DisbursementRecords for a plan",                                              roles: [SchoolAdmin, FinanceOfficer],       code: 200, input: ["limit?, offset?"], output: "DisbursementRecord[]", side_effects: [] }

  # ---- Audit + external sync (read-only views) ----
  - { method: GET,    path: "/audit-events",                                                                                     description: "List AuditEvents (filterable)",                                                    roles: [SchoolAdmin],                       code: 200, input: ["event_type?, target_entity?, target_id?, limit?, offset?"], output: "AuditEvent[]", side_effects: [] }
  - { method: GET,    path: "/external-sync-events",                                                                              description: "List ExternalSyncEvents emitted",                                                  roles: [SchoolAdmin],                       code: 200, input: ["kind?, application_id?, scholarship_id?, limit?, offset?"], output: "ExternalSyncEvent[]", side_effects: [] }

  # ---- Test-driving system endpoints (required for testability per §1.5) ----
  - { method: POST,   path: "/_clock/advance",                                                                                    description: "Advance the system clock for time-gated transitions (test-only)",                  roles: [SchoolAdmin],                       code: 200, input: ["to (ISO 8601 datetime)"], output: null, side_effects: ["Sets system 'now' to provided value"] }
  - { method: POST,   path: "/_sweep/run",                                                                                        description: "Run periodic sweep (auto-transitions for any Scholarship whose window has elapsed)", roles: [SchoolAdmin],                     code: 200, input: [], output: null, side_effects: ["Triggers any pending auto-transitions per §1.2"] }

# =============================================================================
# §1.6  Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_AUTH_MISSING,                    http: 401, condition: "Authentication header(s) missing or invalid" }
  - { id: ERR_FORBIDDEN,                       http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND,                       http: 404, condition: "Resource not found (or outside path scope)" }
  - { id: ERR_VERSION_MISMATCH,                http: 409, condition: "'version' in body does not match current entity version" }
  - { id: ERR_INVALID_STATE,                   http: 409, condition: "Target entity in wrong state for the requested operation" }
  - { id: ERR_WINDOW_NOT_OPEN,                 http: 409, condition: "Operation requires Scholarship.status==OPEN or now() >= application_window_start" }
  - { id: ERR_WINDOW_CLOSED,                   http: 409, condition: "Time window for this operation has elapsed" }
  - { id: ERR_WINDOW_NOT_CLOSED,               http: 409, condition: "Auto-transition attempted before its triggering window elapsed" }
  - { id: ERR_RUBRIC_WEIGHT_INVALID,           http: 422, condition: "Scholarship.rubric_weights values do not sum to exactly 100" }
  - { id: ERR_QUOTA_MISMATCH,                  http: 422, condition: "Sum of QuotaAllocation.initial_slots != Scholarship.total_quota at OPEN transition" }
  - { id: ERR_ELIGIBILITY_FAIL,                http: 422, condition: "Application fails eligibility per calc:eligibility_check (GPA / major / grade / family income)" }
  - { id: ERR_MATERIAL_MISSING,                http: 422, condition: "uploaded_materials missing one or more entries from Scholarship.required_materials" }
  - { id: ERR_MATERIAL_INCOMPLETE,             http: 422, condition: "Materials present but one or more is_authentic flags false during dept-review PASS attempt" }
  - { id: ERR_ADVISOR_REC_MISSING,             http: 422, condition: "ADVISOR_REC required but advisor_recommendation_id missing or reviewer not ACTIVE" }
  - { id: ERR_DUPLICATE_APPLICATION_SAME,      http: 409, condition: "Student already has a non-terminal Application against this Scholarship" }
  - { id: ERR_DUPLICATE_APPLICATION_CROSS,     http: 409, condition: "Student already applied to another Scholarship of the same category with overlapping window" }
  - { id: ERR_COMMENT_REQUIRED,                http: 422, condition: "Comment string required but missing or empty (dept-review reject, objection ruling)" }
  - { id: ERR_DEPT_SCOPE_MISMATCH,             http: 403, condition: "Acting DeptOfficer's department_code does not match Application.student_department_code" }
  - { id: ERR_COI_VIOLATION,                   http: 409, condition: "Reviewer assignment violates COI rule (same-department, same-supervisor, family-relation)" }
  - { id: ERR_REVIEWER_COUNT_INVALID,          http: 422, condition: "assign-reviewers given a list whose length is not exactly 3" }
  - { id: ERR_REVIEWER_DUPLICATE,              http: 422, condition: "assign-reviewers list contains the same reviewer_id more than once" }
  - { id: ERR_REVIEWER_NOT_ACTIVE,             http: 409, condition: "Reviewer in assignment is not in ACTIVE status" }
  - { id: ERR_REVIEWERS_ALREADY_ASSIGNED,      http: 409, condition: "assign-reviewers attempted but ReviewerAssignments already exist for this Application" }
  - { id: ERR_SCORE_RUBRIC_MISMATCH,           http: 422, condition: "Score.criterion_scores keys do not exactly match Scholarship.rubric_weights keys" }
  - { id: ERR_SCORE_OVER_QUOTA,                http: 409, condition: "Attempt to submit a 4th Score for an Application (or duplicate from same reviewer)" }
  - { id: ERR_REVIEW_NOT_COMPLETE,             http: 409, condition: "Scholarship REVIEWING→ANNOUNCED attempted while some non-rejected Application has not reached REVIEW_COMPLETE" }
  - { id: ERR_OBJECTION_PENDING,               http: 409, condition: "Scholarship ANNOUNCED→FINALIZED attempted with at least one PENDING Objection" }
  - { id: ERR_DISBURSEMENT_NOT_EXECUTED,       http: 409, condition: "Scholarship FINALIZED→DISBURSED attempted before a DisbursementPlan reached EXECUTED" }
  - { id: ERR_PLAN_EMPTY,                      http: 409, condition: "DisbursementPlan approval attempted while total_gross_cents == 0" }
  - { id: ERR_SOD_VIOLATION,                   http: 403, condition: "Segregation-of-duties: finance approver equals dept approver, or executor differs from finance approver" }
  - { id: ERR_EXECUTOR_MISMATCH,               http: 403, condition: "execute called by a user other than finance_approver_id" }
  - { id: ERR_BAD_REQUEST,                     http: 400, condition: "Malformed request body or missing required field" }
  - { id: ERR_SCHOLARSHIP_WINDOW_OVERLAP,      http: 409, condition: "New or edited Scholarship.application_window collides with another Scholarship of the same category whose status != DISBURSED; intervals are half-open [start, end)" }

# =============================================================================
# §1.7  RBAC Matrix
# =============================================================================
roles:
  - name: SchoolAdmin
    description: "Central scholarship office administrator. Configures scholarships, opens/closes windows, assigns reviewers, rules on objections, and inspects audit logs."
    identity: opaque
    exclusive_operations:
      - "POST /scholarships — create scholarship"
      - "PATCH /scholarships/{id} — update scholarship (DRAFT only)"
      - "POST /scholarships/{id}/state — transition lifecycle"
      - "POST /scholarships/{id}/quota-allocations — define quota slice"
      - "POST /reviewers — create reviewer"
      - "PATCH /reviewers/{id} — update reviewer"
      - "POST .../applications/{id}/assign-reviewers — assign reviewers"
      - "POST .../objections/{id}/rule — rule on objection"
      - "GET /audit-events / GET /external-sync-events — read audit + sync log"
      - "POST /_clock/advance, POST /_sweep/run — test-driving endpoints"
    shared_operations:
      - "GET /scholarships/{id}"
      - "GET .../quota-allocations"
      - "GET .../applications/{id}, /scores, /disbursement-plans, /objections"

  - name: DeptOfficer
    description: "Department-level reviewer/officer. Performs preliminary completeness & authenticity review and acts as the first-level disbursement approver."
    identity: opaque
    exclusive_operations:
      - "POST .../applications/{id}/dept-review — preliminary review"
      - "POST .../disbursement-plans/{id}/approve level=DEPT — first-level approval"
    shared_operations:
      - "GET /scholarships/{id}, /quota-allocations, /applications, /scores, /disbursement-plans"

  - name: FinanceOfficer
    description: "Finance officer. Drafts disbursement plans, approves at the FINANCE level (segregated from DeptOfficer), and executes the plan."
    identity: opaque
    exclusive_operations:
      - "POST .../disbursement-plans — create plan"
      - "POST .../disbursement-plans/{id}/approve level=FINANCE — finance approval"
      - "POST .../disbursement-plans/{id}/execute — execute plan"
    shared_operations:
      - "GET /scholarships/{id}, /disbursement-plans, /records"

  - name: Student
    description: "Applicant. Creates and submits Applications, withdraws, modifies, corrects after rejection, and submits Objections."
    identity: opaque
    exclusive_operations:
      - "POST .../applications — create"
      - "PATCH .../applications/{id} — update form (DRAFT only)"
      - "POST .../applications/{id}/submit | withdraw | modify | correct"
      - "POST .../objections — submit objection"
    shared_operations:
      - "GET .../applications/{id}, /scholarships/{id}, /objections/{id}"
    # ownership: a Student's X-User-ID equals Application.student_id when the Student created the application.

  - name: Reviewer
    description: "Member of the reviewer pool. Submits scores for Applications they are assigned to."
    identity: entity_backed:Reviewer
    exclusive_operations:
      - "POST .../applications/{id}/scores — submit score (must have ReviewerAssignment)"
    shared_operations:
      - "GET .../applications/{id}, /scholarships/{id}"
