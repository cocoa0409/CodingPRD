              as: Technologist
              as_user_id: "${tech_id}"
              captures: { amd_exam_id: $.data.id }
            - call: "POST /exams/${amd_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { amd_exam_v: $.data.version }
            - call: "POST /exams/${amd_exam_id}/notification-letters"
              payload: { expected_exam_version: "${amd_exam_v}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { amd_letter_id: $.data.id }
            - call: "POST /notification-letters/${amd_letter_id}/send"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /facilities/${fac_id}/compliance-runs"
