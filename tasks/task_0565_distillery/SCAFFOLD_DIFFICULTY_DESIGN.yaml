            - { call: "POST /dsp/customers", payload: { name: "Guest B", email: "gb@x.com", state_code: "CA" }, as: TastingRoomStaff, captures: { c2: $.data.id } }
            - { call: "POST /dsp/tour-bookings", payload: { customer_id: "${c1}", distillery_id: "${dist_id}", start_time: "2026-06-01T10:00:00Z", end_time: "2026-06-01T11:00:00Z", party_size: 15 }, as: TastingRoomStaff, captures: { t1: $.data.id } }
            - { call: "POST /dsp/tour-bookings/${t1}/confirm", payload: {}, as: TastingRoomStaff }
            - { call: "POST /dsp/tour-bookings", payload: { customer_id: "${c2}", distillery_id: "${dist_id}", start_time: "2026-06-01T10:20:00Z", end_time: "2026-06-01T11:00:00Z", party_size: 10 }, as: TastingRoomStaff, captures: { t2: $.data.id } }
          trigger:
            - { call: "POST /dsp/tour-bookings/${t2}/confirm", payload: {}, as: TastingRoomStaff, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_TOUR_OVERLAP (not ERR_TOUR_CAPACITY)"
            - "HTTP status == 409"

