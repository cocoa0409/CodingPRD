          assert:
            - "The first trigger call violates both rules — FT_SPOIL has donation_eligible false AND the 2026-06-20T08:00:00Z pickup is far past 2026-06-10T22:00:00Z (captured_at + 12 h) — and returns 422 with error_id ERR_CHANNEL_INELIGIBLE_FOOD."
            - "The first call's stream clause is satisfied (a SPOILAGE capture at a PREP station is PRE_CONSUMER), so the only failing clause of priority 75 is donation_eligible; the error is not a stream rejection in disguise."
            - "The second trigger call routes the donation-eligible FT_PREP entry instead, which repairs priority 75 and leaves priority 85 violated (pickup 2026-06-20T08:00:00Z is past 2026-06-11T10:00:00Z = captured_at + 24 h), and returns 422 with error_id ERR_DONATION_WINDOW_EXPIRED."
