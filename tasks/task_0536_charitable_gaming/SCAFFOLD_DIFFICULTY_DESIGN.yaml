  - rule_id: compensating_invariant
    instances:
      - name: prize_allowance_reserve_release_conserved
        grounds:
          - state_machines.Occasion.SCHEDULED_to_CANCELLED
          - calculations.license_prize_consumption
          - entities.License.fields.prize_allowance_remaining_cents
        distinguishing_aspect: |
          Creating a SCHEDULED occasion (reserve 50000) then cancelling it (release 50000) leaves
          License.prize_allowance_remaining_cents unchanged at 1000000 — the prize-allowance pool is conserved.
        test_recipe:
          setup:
            - "Eligible org, ACTIVE BINGO license (prize_allowance_remaining_cents == 1000000)"
            - "One SCHEDULED occasion planned_prize_pool 50000 (remaining drops to 950000)"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Foresters", ein: "18-1818181", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "q@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T22:00:00Z", venue_name: "Hall", planned_gross_cents: 200000, planned_prize_pool_cents: 50000, planned_expenses_cents: 20000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
          trigger:
            - { call: "POST /occasions/${occ_id}/cancel", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
          assert:
            - "before cancel: License.${lic_id}.prize_committed_cents == 50000 and prize_allowance_remaining_cents == 950000"
            - "after cancel: License.${lic_id}.prize_committed_cents == 0 and prize_allowance_remaining_cents == 1000000"
            - "Occasion.${occ_id}.status == CANCELLED"

      - name: violation_points_raise_waive_conserved
        grounds:
          - state_machines.Violation.OPEN_to_WAIVED
          - calculations.violation_points_rollup
          - entities.License.fields.total_violation_points_active
        distinguishing_aspect: |
          Recording a LATE_REPORT Violation (+3) then waiving it (-3) restores License.total_violation_points_active
          to 0 — violation points are a conserved quantity, distinct from the prize-allowance pool of instance 1.
        test_recipe:
          setup:
            - "Eligible org, ACTIVE BINGO license; a MANUAL LATE_REPORT violation recorded (total_violation_points_active == 3)"
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Maccabees", ein: "19-1919191", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "r@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /violations", payload: { license_id: "${lic_id}", violation_type: "LATE_REPORT" }, as: Regulator, captures: { vio_id: "$.data.id" } }
          trigger:
            - { call: "POST /violations/${vio_id}/waive", payload: {}, as: Regulator }
          assert:
            - "before waive: License.${lic_id}.total_violation_points_active == 3"
            - "after waive: License.${lic_id}.total_violation_points_active == 0"
            - "Violation.${vio_id}.status == WAIVED and License.${lic_id}.status == ACTIVE"
