              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "trigger 1: HTTP 200 with quoted_total_cents == 40000 — no purchase order is attached, so only the credit line is consulted and JobPurchaseOrder.${po_id}.committed_cents stays 0"
            - "trigger 2: HTTP 402 with data.error_id == \"ERR_PO_LIMIT_EXCEEDED\" (40000 against a 30000 cap); the order stays DRAFT and committed_cents stays 0"
            - "trigger 3: HTTP 200 with quoted_total_cents == 20000, JobPurchaseOrder.${po_id}.committed_cents == 20000 and status still OPEN (20000 < 30000)"
            - "ContractorAccount.${acct_id}.credit_used_cents == 60000 counts both confirmed orders, proving the refused one never joined the exposure"

  - section: errors
    instances:
      - name: every_not_found_error_id_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_MATERIAL_NOT_FOUND]
          - errors[ERR_PRICE_SCHEDULE_NOT_FOUND]
          - errors[ERR_INVENTORY_LOT_NOT_FOUND]
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - errors[ERR_PO_NOT_FOUND]
          - errors[ERR_PREBUY_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_ORDER_LINE_NOT_FOUND]
          - errors[ERR_TRUCK_NOT_FOUND]
          - errors[ERR_LOAD_NOT_FOUND]
          - errors[ERR_TICKET_NOT_FOUND]
          - errors[ERR_CONTAINER_RETURN_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: "One sweep proves each of the thirteen 404 identifiers is distinct and reachable: the same syntactically valid UUID resolves to a different error_id per resource family, so no handler falls back to a generic not-found."
        test_recipe:
          setup:
            - "No domain rows are needed; every request uses the syntactically valid but unused UUID 00000000-0000-0000-0000-00000000dead."
          setup_api_calls:
