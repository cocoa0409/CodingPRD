  - section: calculations
    instances:
      - name: deposit_floor_and_pct_selection
        claim_type: constants_applied
        grounds:
          - "calculations.permit_fee_quote"
          - "entities.Permit.fields.deposit_required_cents"
        distinguishing_aspect: "A 3-hour no-lights resident permit totals 6000; 25% would be 1500, so the 5000 floor governs: deposit == 5000 (max branch), while total itself (6000) does not clamp it (min branch not taken)."
        test_recipe:
          setup: ["Resident org; application 2026-08-10 18:00-21:00 (3h) no lights; window allocated"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
