      - name: consent_qualified_value_rounds_half_up_before_the_petition_sum
        claim_type: precision
        grounds:
          - calculations.petition_sufficiency.precision
          - calculations.petition_sufficiency.formula
        distinguishing_aspect: |
          A 50.00% share of an odd 1,000,001-cent parcel is 500,000.5 cents, so round_half_up must
          give 500,001 — and because per-consent rounding happens BEFORE summation that same
          500,001 is the petition's qualified_signature_assessed_value_cents, putting
          signature_value_pct at exactly 50.00 and satisfying the 50.00 statutory threshold.
          A truncating implementation stamps 500,000 and is one cent short.
        test_recipe:
          setup:
            - "One TERRITORY_CERTIFIED PETITION_MAJORITY case holding a single 1,000,001-cent parcel (1.00 acre, 4 dwelling units) with a CIRCULATING petition; logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_pr: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_pr}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_pr: $.data.id }
