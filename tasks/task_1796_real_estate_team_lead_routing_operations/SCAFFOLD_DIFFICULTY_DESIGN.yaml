      - name: agent_at_exact_capacity_excluded_from_pool
        grounds:
          - calculations.agent_selector
          - entities.Agent.fields.active_lead_count
        distinguishing_aspect: |
          Boundary on an integer count metric via POST /crm/leads/{id}/route
