scaffold_corner_design:

  # =====================================================================
  # SECTION: entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_performer_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Performer, endpoints]
        distinguishing_aspect: "POST /performers with all required fields returns 201 and the stored stage_name/act_type/genre plus system id/created_at/version=1."
        test_recipe:
          setup: ["A travel zone exists for home_zone_id."]
          setup_api_calls:
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
          trigger:
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { pid: $.data.id, ver: $.data.version }
          assert:
            - "response code == 201"
            - "Performer.${pid}.stage_name == DJ A"
            - "Performer.${pid}.availability_status == AVAILABLE"
            - "Performer.${pid}.reliability_score == 100"
            - "Performer.${pid}.version == 1"

      - name: get_booking_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Booking, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /bookings/{unknown-uuid} returns ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BookingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_booking_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Booking, "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /bookings omitting event_start_utc returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Client, performer, package, zone all exist."]
          setup_api_calls:
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_miles_from_home: 0 }
              as: BookingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_booking_default_contracted_minutes_from_package
        claim_type: Defaults
        grounds: [entities.Booking.fields.contracted_set_minutes, entities.PackageOffering.fields.included_set_minutes]
        distinguishing_aspect: "Omitting contracted_set_minutes defaults it to package.included_set_minutes (120)."
        test_recipe:
          setup: ["Package included_set_minutes 120."]
          setup_api_calls:
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0 }
              as: BookingAgent
              captures: { cm: $.data.contracted_set_minutes }
          assert:
            - "Booking contracted_set_minutes == 120"

      - name: create_booking_computed_status_ignores_input
        claim_type: System Fields
        grounds: [entities.Booking.fields.status, entities.Booking.fields.quote_total_cents]
        distinguishing_aspect: "Server-set Booking.status is INQUIRY at create regardless of any client-supplied value; quote_total_cents is 0 until hold."
        test_recipe:
          setup: ["Client, performer, package, zone exist."]
          setup_api_calls:
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { st: $.data.status, q: $.data.quote_total_cents }
          assert:
            - "Booking status == INQUIRY"
            - "Booking quote_total_cents == 0"

      - name: create_performer_invalid_enum_act_type_rejected
        claim_type: Type Constraints
        grounds: [entities.Performer.fields.act_type, "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /performers with act_type not in the enum returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A home zone exists."]
          setup_api_calls:
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
          trigger:
            - call: "POST /performers"
              payload: { stage_name: "X", act_type: "ORCHESTRA", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: blackout_window_immutable_only_id_created_at
        claim_type: Immutability
        grounds: [entities.BlackoutWindow]
        distinguishing_aspect: "BlackoutWindow has common_fields:false — it exposes only id and created_at (no version, no update endpoint)."
        test_recipe:
          setup: ["A performer exists."]
          setup_api_calls:
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
          trigger:
            - call: "POST /performers/${perf}/blackouts"
              payload: { start_utc: "2026-08-01T10:00:00Z", end_utc: "2026-08-01T14:00:00Z" }
              as: StudioAdmin
              captures: { bwid: $.data.id }
          assert:
            - "response code == 201"
            - "BlackoutWindow.${bwid}.id is present"
            - "BlackoutWindow.${bwid} has no version field"

      - name: foreign_key_performer_unknown_zone_rejected
        claim_type: Parent Relationships
        grounds: [entities.Performer.fields.home_zone_id, "validations[priority=5]", "errors[ERR_REFERENCED_ENTITY_NOT_FOUND]"]
        distinguishing_aspect: "POST /performers with a home_zone_id that resolves to no TravelZone returns ERR_REFERENCED_ENTITY_NOT_FOUND (404)."
        test_recipe:
          setup: ["No travel zone with the supplied id exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "00000000-0000-4000-8000-000000000000", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_REFERENCED_ENTITY_NOT_FOUND"

      - name: list_bookings_pagination_envelope
        claim_type: Listing
        grounds: [entities.Booking, response_envelope]
        distinguishing_aspect: "GET /bookings returns a paginated array envelope carrying total_count and has_more."
        test_recipe:
          setup: ["At least one booking exists."]
          setup_api_calls:
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
          trigger:
            - call: "GET /bookings"
              payload: { limit: 10, offset: 0 }
              as: BookingAgent
          assert:
            - "response_type == array"
            - "meta.total_count >= 1"
            - "has_more == false"

  # =====================================================================
  # SECTION: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: hold_from_inquiry_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.Booking.INQUIRY_to_HOLD, entities.Performer.fields.availability_status]
        distinguishing_aspect: "POST /bookings/{id}/hold from INQUIRY moves booking to HOLD and the performer to ON_HOLD."
        test_recipe:
          setup: ["Booking in INQUIRY with an AVAILABLE performer."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
          trigger:
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { st: $.data.status }
            - call: "GET /performers/${perf}"
              payload: {}
              as: BookingAgent
              captures: { av: $.data.availability_status }
          assert:
            - "Booking.${bk}.status == HOLD"
            - "Booking.${bk}.quote_total_cents == 250000"
            - "Performer.${perf}.availability_status == ON_HOLD"

      - name: hold_from_already_held_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.INQUIRY_to_HOLD, "validations[priority=8]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling hold a second time on a booking already in HOLD returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Booking already in HOLD."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
          trigger:
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_from_settled_terminal_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Booking.PERFORMED_to_SETTLED, "validations[priority=8]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A SETTLED booking is terminal — POST /bookings/{id}/cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Booking driven to SETTLED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { bkv_hold: $.data.version }
            - call: "POST /bookings/${bk}/issue-contract"
              payload: { expected_booking_version: "${bkv_hold}" }
              as: BookingAgent
            - call: "GET /bookings/${bk}/contracts"
              payload: {}
              as: BookingAgent
              captures: { ctid: "$.data[0].id" }
            - call: "POST /contracts/${ctid}/sign"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 62500 }
              as: BookingAgent
              captures: { dep: $.data.id }
            - call: "POST /payments/${dep}/capture"
              payload: {}
              as: BookingAgent
            - call: "POST /payments"
              payload: { booking_id: "${bk}", kind: "BALANCE", amount_cents: 187500 }
              as: BookingAgent
              captures: { bal: $.data.id }
            - call: "POST /payments/${bal}/capture"
              payload: {}
              as: BookingAgent
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-08-01T20:00:00Z" }
              as: StudioAdmin
            - call: "POST /bookings/${bk}/start-set"
              payload: {}
              as: BookingAgent
            - call: "POST /bookings/${bk}/complete-set"
              payload: { actual_set_minutes: 120 }
              as: BookingAgent
            - call: "POST /bookings/${bk}/settle"
              payload: {}
              as: BookingAgent
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: BookingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Booking.${bk}.status == SETTLED"

      - name: contract_decline_from_issued_branch_b
        claim_type: Valid Transition
        grounds: [state_machines.ContractDocument.ISSUED_to_DECLINED, entities.ContractDocument.fields.status]
        distinguishing_aspect: "POST /contracts/{id}/decline from ISSUED moves the contract to DECLINED (branch B of the sign/decline fork) without confirming the booking."
        test_recipe:
          setup: ["Booking at CONTRACT_SENT with an ISSUED contract."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { bkv_hold: $.data.version }
            - call: "POST /bookings/${bk}/issue-contract"
              payload: { expected_booking_version: "${bkv_hold}" }
              as: BookingAgent
            - call: "GET /bookings/${bk}/contracts"
              payload: {}
              as: BookingAgent
              captures: { ctid: "$.data[0].id" }
          trigger:
            - call: "POST /contracts/${ctid}/decline"
              payload: {}
              as: Client
              as_user_id: "${cli}"
              captures: { st: $.data.status }
          assert:
            - "ContractDocument.${ctid}.status == DECLINED"

      - name: void_captured_payment_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.PaymentRecord.AUTHORIZED_to_VOID, "validations[priority=20]", "errors[ERR_PAYMENT_NOT_VOIDABLE]"]
        distinguishing_aspect: "Voiding a payment already CAPTURED returns ERR_PAYMENT_NOT_VOIDABLE (409); the void transition only leaves AUTHORIZED."
        test_recipe:
          setup: ["A CAPTURED deposit payment on a held booking."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
