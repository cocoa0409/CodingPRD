              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c2@x.com", full_name: "C Two", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl2_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl2_id}/background-checks"
              payload: { provider_ref: "ext-2" }
              as: PlatformAdmin
              captures: { bc2_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc2_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl2_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", cleaner_id: "${cl_id}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk1_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T10:30:00Z", cleaner_id: "${cl2_id}" }
              as: Customer
