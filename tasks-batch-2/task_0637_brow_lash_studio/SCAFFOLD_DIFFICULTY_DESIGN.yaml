# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Brow & Lash Studio (task_0637) — 9 rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_forfeiture_noshow_vs_late_cancel
        grounds:
          - calculations.deposit_forfeiture
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - state_machines.Appointment.BOOKED_to_LATE_CANCELLED
          - entities.Appointment.fields.deposit_forfeited_cents
        distinguishing_aspect: |
          Same $120 FULL_SET cash deposit (2400c) forfeits in full (2400c) on the NO_SHOW
          variant but exactly half (1200c) on the LATE_CANCELLED variant — divergent
          numeric results on the Appointment domain from one deposit base.
        test_recipe:
          setup:
            - "Studio with deposit_rate_pct=0.20, late_cancel_cutoff_hours=24; FULL_SET service base_price_cents=12000, requires_patch_test=false; one master tech with valid sanitation; member with valid patch test not required; two cash-paid BOOKED FULL_SET appointments at the same future start on the same tech is impossible, so use two techs."
            - "Clock at 2026-06-10T10:00:00Z; appointment start 2026-06-10T20:00:00Z (10h away, within 24h cutoff)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow", deposit_rate_pct: 0.20, late_cancel_cutoff_hours: 24 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Nia", skill_level: 3, station_number: 2 }
              as: StudioManager
              captures: { tech2_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech2_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T09:30:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt_noshow_id: $.data.id, dep_ns: $.data.deposit_cents }
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T20:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt_late_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_noshow_id}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt_late_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Appointment.${appt_noshow_id}.deposit_cents == 2400"
            - "Appointment.${appt_noshow_id}.status == NO_SHOW"
            - "Appointment.${appt_noshow_id}.deposit_forfeited_cents == 2400"
            - "Appointment.${appt_late_id}.status == LATE_CANCELLED"
            - "Appointment.${appt_late_id}.deposit_forfeited_cents == 1200"

      - name: cycle_rollover_within_cap_vs_over_cap
        grounds:
          - calculations.cycle_rollover
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - entities.Membership.fields.credit_balance
          - entities.CreditLedgerEntry.fields.reason
        distinguishing_aspect: |
          Two memberships on a plan with allotment=4, cap=4: one enrolled with 3 credits
          carries all 3 (within_cap) → balance 7 with no ROLLOVER_FORFEIT entry; the other
          enrolled with 6 carries only 4 (over_cap) → balance 8 with a -2 ROLLOVER_FORFEIT
          entry. Divergent results on the Membership domain, distinct from deposit_forfeiture.
        test_recipe:
          setup:
            - "Plan PREMIER allotment=4, rollover_cap_multiplier=1.0 (cap 4); membership A enrolled initial_credits=3, membership B enrolled initial_credits=6; both ACTIVE."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "PREMIER", monthly_credit_allotment: 4, monthly_fee_cents: 9900, rollover_cap_multiplier: 1.0 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "A", email: "a@x.com" }
              as: FrontDesk
              captures: { member_a_id: $.data.id }
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "B", email: "b@x.com" }
              as: FrontDesk
              captures: { member_b_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${member_a_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z", initial_credits: 3 }
              as: FrontDesk
              captures: { ms_a_id: $.data.id, ms_a_v: $.data.version }
            - call: "POST /memberships"
              payload: { member_id: "${member_b_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z", initial_credits: 6 }
              as: FrontDesk
              captures: { ms_b_id: $.data.id, ms_b_v: $.data.version }
          trigger:
            - call: "POST /memberships/${ms_a_id}/close-cycle"
              payload: { expected_membership_version: "${ms_a_v}" }
              as: StudioManager
            - call: "POST /memberships/${ms_b_id}/close-cycle"
              payload: { expected_membership_version: "${ms_b_v}" }
              as: StudioManager
          assert:
            - "Membership.${ms_a_id}.credit_balance == 7"
            - "Membership.${ms_b_id}.credit_balance == 8"
            - "A CreditLedgerEntry with reason==ROLLOVER_FORFEIT and delta==-2 exists for membership ${ms_b_id}"
            - "No CreditLedgerEntry with reason==ROLLOVER_FORFEIT exists for membership ${ms_a_id}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: retail_total_per_line_round_then_sum
        grounds:
          - calculations.retail_order_total
          - entities.RetailOrder.fields.subtotal_cents
          - entities.MembershipPlan.fields.loyalty_discount_pct
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: two add-on lines of 125c×1 at 10% loyalty round
          per-line to 113c each summing to 226c, whereas the rejected sum-then-round reading
          yields 225c. The scaffold pins per-line-then-sum, so subtotal_cents == 226.
        test_recipe:
          setup:
            - "Member on PREMIER plan (loyalty 0.10) with a BOOKED appointment; retail order of two 125c qty-1 lines."
            - "Tech load < 3 and service STANDARD so no peak surcharge — isolates the rounding-order distinction."
            - "Clock 2026-06-10T10:00:00Z; TINT (STANDARD) appointment, patch test not required."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "PREMIER", monthly_credit_allotment: 4, monthly_fee_cents: 9900, loyalty_discount_pct: 0.10 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "TINT", name: "Tint", duration_minutes: 30, base_price_cents: 4000, credit_cost: 2, category: "STANDARD", requires_patch_test: false }
              as: StudioManager
              captures: { tint_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 1, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z" }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${tint_st_id}", start_utc: "2026-06-10T13:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /retail-orders"
              payload: { member_id: "${member_id}", appointment_id: "${appt_id}", lines: [ { sku: "SERUM", unit_price_cents: 125, quantity: 1 }, { sku: "GEL", unit_price_cents: 125, quantity: 1 } ] }
              as: FrontDesk
              captures: { order_id: $.data.id }
          assert:
            - "RetailOrder.${order_id}.subtotal_cents == 226"
            - "RetailOrder.${order_id}.peak_surcharge_cents == 0"
            - "RetailOrder.${order_id}.total_cents == 226"

      - name: credit_gate_evaluation_order_before_consume
        grounds:
          - calculations.credit_balance_and_book_gate
          - validations[priority=13]
          - entities.Membership.fields.credit_balance
          - state_machines.Appointment.BOOKED_to_COMPLETED
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the balance gate reads the ledger sum BEFORE the
          CONSUME append, so a membership with balance exactly 4 books a FULL_SET (cost 4)
          to balance 0 (gate passes on '>= required'), whereas balance 3 is rejected with
          ERR_INSUFFICIENT_CREDITS and no CONSUME entry is appended — distinct mode from the
          rounding-order instance.
        test_recipe:
          setup:
            - "Membership ACTIVE balance 4 (enrolled initial_credits=4) on ESSENTIAL plan; FULL_SET credit_cost=4, requires_patch_test=false; master tech sanitized."
            - "Clock 2026-06-10T10:00:00Z."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "ESSENTIAL", monthly_credit_allotment: 4, monthly_fee_cents: 6900 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z", initial_credits: 4 }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T20:00:00Z", pay_with_credits: true, membership_id: "${ms_id}", expected_membership_version: "${ms_v}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          assert:
            - "Appointment.${appt_id}.status == BOOKED"
            - "Appointment.${appt_id}.credits_charged == 4"
            - "Membership.${ms_id}.credit_balance == 0"
            - "A CreditLedgerEntry with reason==CONSUME and delta==-4 exists for membership ${ms_id}"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_cyclic_suspend_reactivate
        grounds:
          - state_machines.Membership.ACTIVE_to_SUSPENDED
          - state_machines.Membership.SUSPENDED_to_ACTIVE
          - calculations.noshow_strike_count
        distinguishing_aspect: |
          Membership exhibits a cycle: it auto-transitions ACTIVE→SUSPENDED when the third
          no-show strike lands, then SUSPENDED→ACTIVE on reactivate once strikes age out of
          the 90-day window — a loop on the Membership entity, not a linear pipeline.
        test_recipe:
          setup:
            - "Studio threshold=3, window=90 days. Member with 2 prior NO_SHOW appointments dated within the window; a third future BOOKED appointment exists; clock advanced so the third can be marked no-show."
            - "After 3rd no-show, membership SUSPENDED; then clock advanced > 90 days so all three strikes age out, then reactivate."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow", noshow_strike_window_days: 90, noshow_strike_threshold: 3, late_cancel_cutoff_hours: 24 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "ESSENTIAL", monthly_credit_allotment: 4, monthly_fee_cents: 6900 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "TINT", name: "Tint", duration_minutes: 30, base_price_cents: 4000, credit_cost: 2, category: "STANDARD", requires_patch_test: false }
              as: StudioManager
              captures: { tint_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 1, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-05-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z" }
              as: FrontDesk
              captures: { ms_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${tint_st_id}", start_utc: "2026-05-01T08:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${tint_st_id}", start_utc: "2026-05-01T08:30:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt2_id: $.data.id }
            - call: "POST /appointments/${appt2_id}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${tint_st_id}", start_utc: "2026-06-01T08:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt3_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt3_id}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: StudioManager
            - call: "POST /memberships/${ms_id}/reactivate"
              payload: {}
              as: StudioManager
              captures: { ms_status_after: $.data.status }
          assert:
            - "Immediately after the third mark-no-show, Membership.${ms_id}.status == SUSPENDED"
            - "After advancing the clock to 2026-09-15 (all three strikes older than 90 days) and reactivating, Membership.${ms_id}.status == ACTIVE"
            - "Member.${member_id}.noshow_strike_count == 0 at clock 2026-09-15"

      - name: appointment_fork_join_completed_vs_noshow
        grounds:
          - state_machines.Appointment.BOOKED_to_COMPLETED
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - state_machines.Appointment.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Appointment branches from BOOKED into COMPLETED / NO_SHOW / LATE_CANCELLED / CANCELLED
          with divergent side-effect sets (COMPLETED updates last_premium_completed_utc and
          forfeits nothing; NO_SHOW forfeits full deposit and adds a strike) — a fork on the
          Appointment entity, distinct from the Membership cycle.
        test_recipe:
          setup:
            - "Two cash FULL_SET (PREMIUM) BOOKED appointments for one member on two techs; clock past their starts."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow", noshow_strike_threshold: 3 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Nia", skill_level: 3, station_number: 2 }
              as: StudioManager
              captures: { tech2_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech2_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T12:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt_done_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T12:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt_ns_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:30:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /appointments/${appt_done_id}/complete"
              payload: {}
              as: LashTech
              as_user_id: "${tech1_id}"
            - call: "POST /appointments/${appt_ns_id}/mark-no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "Appointment.${appt_done_id}.status == COMPLETED"
            - "Appointment.${appt_done_id}.deposit_forfeited_cents == 0"
            - "Member.${member_id}.last_premium_completed_utc == 2026-06-10T12:00:00Z"
            - "Appointment.${appt_ns_id}.status == NO_SHOW"
            - "Appointment.${appt_ns_id}.deposit_forfeited_cents == 2400"
            - "Member.${member_id}.noshow_strike_count == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: noshow_suspends_membership_cancels_future_appts_ends_schedule
        grounds:
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - state_machines.Membership.ACTIVE_to_SUSPENDED
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - state_machines.RecurringFillSchedule.ACTIVE_to_ENDED
        distinguishing_aspect: |
          Depth-3 chain from one trigger: mark-no-show (3rd strike) → Membership auto-SUSPENDED
          → that suspension auto-cancels the member's future BOOKED appointments. Each hop is
          caused by the previous hop, not by the no-show directly.
        test_recipe:
          setup:
            - "Member with 2 prior in-window NO_SHOWs and an ACTIVE membership; a future BOOKED credit appointment exists; a third appointment is about to be no-showed."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow", noshow_strike_threshold: 3, noshow_strike_window_days: 90 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "PREMIER", monthly_credit_allotment: 8, monthly_fee_cents: 9900 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "TINT", name: "Tint", duration_minutes: 30, base_price_cents: 4000, credit_cost: 2, category: "STANDARD", requires_patch_test: false }
              as: StudioManager
