            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { al_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "DOM-CI2", channel_type: DOMESTIC_FRESH, destination_market: DOMESTIC, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 100, price_cents_per_box: 500, priority_rank: 2, accepts_grades: ["FANCY", "CHOICE", "STANDARD"] }, as: PackinghouseAdmin }
