              captures: { cm1: $.data.id }
            - { call: "POST /coatings/color-matches/${cm1}/approve", payload: {}, as: QCInspector, as_user_id: "qc-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T10:00:00Z" }, as: PlantManager }
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4600 }, as: ProductionOperator, captures: { k1: $.data.id } }
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4600 }, as: ProductionOperator, captures: { k2: $.data.id } }
