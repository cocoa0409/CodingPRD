              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "WATER_QUALITY", study_title: "Temperature study", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { study: $.data.id }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "START" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { fw: $.data.fieldwork_status }
          trigger:
            - call: "POST /relicensing/studies/${study}/report"
              payload: { report_note: "premature report" }
              as: Licensee
              as_user_id: "u_lic_report"
              captures: { err: $.data.error_id }
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "COMPLETE" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/report"
              payload: { report_note: "final report" }
              as: Licensee
              as_user_id: "u_lic_report"
              captures: { rv: $.data.review_status, by: $.data.report_submitted_by_user_id }
          assert:
            - "${fw} == IN_PROGRESS at the first attempt"
            - "${err} == ERR_STUDY_STATE_INVALID with HTTP 409"
            - "the rejected call left ResourceStudy.${study}.review_status == NOT_SUBMITTED and report_submitted_at == null"
            - "${rv} == UNDER_REVIEW and ${by} == u_lic_report after fieldwork completed"

      - name: plan_determination_from_draft_rejected
        claim_type: invalid_transitions
        grounds:
