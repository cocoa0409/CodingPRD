  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_assign_requires_subscriber_enrollment_active
        grounds:
          - state_machines.RestorationCase.OPEN_to_ASSIGNED
          - state_machines.Subscriber.ACTIVE_to_SUSPENDED
          - validations[priority=10]
          - errors[ERR_ENROLLMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair #1: RestorationCase -> Subscriber. The case is a perfectly legal OPEN row and the
          specialist is AVAILABLE and correctly tiered, yet assign is rejected purely because the
          OWNING SUBSCRIBER's enrollment_status is SUSPENDED (ERR_ENROLLMENT_NOT_ACTIVE, 409).
        test_recipe:
          setup:
            - "Verified subscriber with one confirmed-fraud alert, hence one OPEN case with required_specialist_tier TIER1."
            - "One TIER2 specialist, AVAILABLE, active_case_count 0."
            - "The subscriber is then SUSPENDED (enrollment_status SUSPENDED, monitoring_status PAUSED)."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ADVANTAGE", monthly_fee_cents: 1999, insurance_limit_cents: 500000, max_family_members: 2, child_monitoring_included: false, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
