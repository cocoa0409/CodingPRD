              as: FranchiseeOperator
              as_user_id: "${fr_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "Territory.${ter_ms_id}.status is still PENDING_REALLOCATION and franchisee_id == ${fr_id}"
            - "the same reclaim as FranchiseAdmin returns 200 and sets status RECLAIMED"

      - name: missing_role_header_returns_unauthenticated
        claim_type: auth_header_required
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - response_envelope.error
        distinguishing_aspect: "The priority-1 header check precedes every other gate, so a request with an undeclared role name is refused with 401 ERR_UNAUTHENTICATED and a well-formed error envelope rather than any business error."
        test_recipe:
