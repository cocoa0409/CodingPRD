              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "GET /episodes/${ep2_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep2_v: $.data.version }
            - call: "POST /episodes/${ep2_id}/logistics-orders"
              payload: { expected_episode_version: "${ep2_v}", order_type: "PATIENT_TRANSPORT", vehicle_id: "${veh_id}", mileage_miles: 9, window_start: "2026-08-02T16:00:00Z", window_end: "2026-08-02T17:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { lo2_id: $.data.id }
          trigger:
            - call: "POST /logistics-orders/${lo1_id}/confirm"
              payload: {}
              as: DischargeCoordinator
              as_user_id: "dc-alpha"
            - call: "POST /logistics-orders/${lo1_id}/cancel"
              payload: { reason_code: "CLINICAL_CHANGE" }
              as: DischargeCoordinator
              as_user_id: "dc-alpha"
            - call: "POST /logistics-orders/${lo2_id}/confirm"
              payload: {}
              as: DischargeCoordinator
              as_user_id: "dc-alpha"
          assert:
            - "LogisticsOrder.${lo1_id}.cost_cents == 35800 and LogisticsOrder.${lo2_id}.cost_cents == 33100"
            - "immediately after the confirm: Episode.${ep1_id}.logistics_committed_cents == 35800"
            - "immediately after the cancel: Episode.${ep1_id}.logistics_committed_cents == 0"
            - "LogisticsOrder.${lo1_id}.status == CANCELLED and LogisticsOrder.${lo1_id}.cancel_reason == CLINICAL_CHANGE"
            - "the second confirm returns HTTP 200, proving the buffered vehicle window was released"
            - "LogisticsOrder.${lo2_id}.status == CONFIRMED and Episode.${ep2_id}.logistics_committed_cents == 33100"
            - "the sum of logistics_committed_cents over both episodes equals the sum of cost_cents over orders in {CONFIRMED, COMPLETED}, i.e. 33100"
