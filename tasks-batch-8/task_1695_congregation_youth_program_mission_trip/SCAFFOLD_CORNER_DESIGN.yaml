        grounds:
          - errors[ERR_UNPAID_BALANCES_REMAIN]
          - state_machines.Payment.POSTED_to_REFUNDED
        distinguishing_aspect: "Fiscal checks run LAST at lock: a registration that CONFIRMED while covered, then had its only payment refunded (covered 0 < deposit 50000), blocks lock with ERR_UNPAID_BALANCES_REMAIN — reachable only because refunds can lapse the deposit after confirmation."
        test_recipe:
          setup: ["Trip T IN_STATE; reg1 CONFIRMED after paying 50000; payment then refunded; 1 cleared chaperone; beds 10; registration closed"]
