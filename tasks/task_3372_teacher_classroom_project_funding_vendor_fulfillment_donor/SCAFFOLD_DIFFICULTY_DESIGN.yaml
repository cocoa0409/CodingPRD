  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: fraud_confirm_cascade_suspends_and_claws_back
        grounds:
          - calculations.fraud_clawback
          - state_machines.Teacher.VERIFIED_to_SUSPENDED
          - state_machines.Project.FUNDED_to_CANCELLED
          - state_machines.Donation.CAPTURED_to_REFUNDED
          - state_machines.PurchaseOrder.SHIPPED_to_DIVERSION_REPORTED
        distinguishing_aspect: |
          Depth-4 transitive cascade originating from fraud resolution: resolving
          the FraudCase CONFIRMED suspends the Teacher (1); the suspension cancels
          the teacher's FUNDED Project (2); the cancellation refunds both CAPTURED
          donations (3); each refund claws its matched_cents back into the
          MatchCampaign's budget (4). Each link is caused by the previous one, not
          by the original resolve call.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; FUNDED project (goal 10959: one 5000c donation matched 1:1 by an ACTIVE STATE-TX campaign, then one 959c plain donation); its single PO is SHIPPED; a diversion report has opened an OPEN FraudCase."
          setup_api_calls:
            - *dd_clock
            - *dd_school
            - *dd_teacher
            - *dd_verify
            - *dd_vendor
            - *dd_item
            - *dd_project
            - *dd_add
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/match-campaigns"
              payload: { sponsor_name: "Acme Foundation", match_ratio: 1.0, budget_cents: 100000, target_type: "STATE", target_value: "TX", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { mc1: $.data.id }
            - call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 5000, match_campaign_id: "${mc1}" }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 959 }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn2: $.data.id }
            - call: "GET /giving/purchase-orders"
              payload: { project_id: "${p1}" }
              as: PlatformAdmin
              captures: { po1: "$.data[0].id" }
            - call: "POST /giving/purchase-orders/${po1}/advance"
              payload: { action: "SHIP", tracking_number: "1Z999AA10123456784" }
              as: Vendor
              as_user_id: "${v1}"
            - call: "POST /giving/purchase-orders/${po1}/advance"
              payload: { action: "REPORT_DIVERSION", reason: "Materials listed for resale online" }
              as: PlatformAdmin
            - call: "GET /giving/fraud-cases"
              payload: { teacher_id: "${t1}" }
              as: PlatformAdmin
              captures: { fc1: "$.data[0].id" }
          trigger:
            - call: "POST /giving/fraud-cases/${fc1}/resolve"
              payload: { outcome: "CONFIRMED" }
              as: PlatformAdmin
          assert:
            - "Teacher.${t1}.employment_status == SUSPENDED (link 1)"
            - "Project.${p1}.status == CANCELLED (link 2 — FUNDED is in the cascade's cancelled set)"
            - "Donation.${dn1}.status == REFUNDED with refund_reason == FRAUD_CLAWBACK (link 3)"
            - "Donation.${dn2}.status == REFUNDED with refund_reason == FRAUD_CLAWBACK"
            - "MatchCampaign.${mc1}.matched_so_far_cents == 0 and remaining_budget_cents == 100000 (link 4 — 5000c clawed back)"
            - "Donor.${d1}.lifetime_refunded_cents == 5959 (5000 + 959)"
            - "PurchaseOrder.${po1}.status == DIVERSION_REPORTED (evidence PO is not cancelled)"

      - name: expiration_sweep_two_phase_cascade
        grounds:
          - calculations.expiration_sweep
          - state_machines.Project.FUNDING_to_EXPIRED
          - state_machines.Donation.CAPTURED_to_CHOICE_PENDING
          - state_machines.Donation.CHOICE_PENDING_to_REFUNDED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (the ops-run sweep, not fraud
          resolution): sweep expires the FUNDING project (1); expiry moves the
          CAPTURED donation to CHOICE_PENDING with a 14-day deadline (2); a second
          sweep at the choice deadline auto-refunds it and recomputes the donor's
          lifetime_refunded_cents (3). Both boundaries are inclusive (<= now).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; FUNDING project (goal 10959, window 30 days, deadline 2026-10-01T00:00:00Z) holding one 5000c donation from Dana."
          setup_api_calls:
