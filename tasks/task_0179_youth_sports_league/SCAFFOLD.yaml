scenario: "Youth Sports League (Little League): player registration, age verification (birth certificate), team draft (evaluation tiering), league schedule, referee assignment, rainout makeup, playoff elimination, parent volunteers."
domain_name: "youth-sports-league"
api_prefix: "/league"

complexity_profile:
  primary_archetype: "temporal_windowing"
  secondary_archetype: "quota_allocation"
  complexity_layers:
    - "cascading_side_effects"
    - "derived_field_reconciliation"
    - "rate_threshold_triggers"
    - "scheduled_deferred_actions"
    - "optimistic_concurrency"

  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"

  role_model: "hierarchical_override"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable season label e.g. "Spring 2026 Minors"
        constraints: "1..120 chars, unique within domain"
      - name: age_division
        type: enum
        source: input
        description: Age bracket for the season
        constraints: "one of {TBALL, MINORS, MAJORS, INTERMEDIATE, JUNIORS}"
      - name: min_birth_date
        type: datetime
        source: input
        description: Earliest birth date (inclusive) for an eligible player; cutoff anchor for age verification
      - name: max_birth_date
        type: datetime
        source: input
        description: Latest birth date (inclusive) for an eligible player
      - name: regular_season_start
        type: datetime
        source: input
        description: First date a regular-season game may be scheduled (00:00:00.000 of that date, league timezone fixed to UTC)
      - name: regular_season_end
        type: datetime
        source: input
        description: Last date a regular-season game may be scheduled (23:59:59.999 of that date)
      - name: playoff_cutoff_date
        type: datetime
        source: input
        description: Boundary used by the playoff bracket seeding sweep
      - name: status
        type: enum
        source: system
        description: Season lifecycle state
        default: "DRAFT_OPEN"
        constraints: "one of {DRAFT_OPEN, REGULAR_SEASON, PLAYOFFS, CLOSED}"
      - name: rainout_window_days
        type: integer
        source: input
        description: Number of days after a postponed game's original date during which a makeup slot must fall
        default: 14
        constraints: "1..60"
      - name: volunteer_hours_required_per_family
        type: number
        source: input
        description: Required volunteer hours per registered family per season
        default: 6.0
        constraints: ">= 0, <= 100, two decimals"

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: Foreign key to Season the player is registering for
      - name: first_name
        type: string
        source: input
        description: Given name
        constraints: "1..80 chars"
      - name: last_name
        type: string
        source: input
        description: Family name
        constraints: "1..80 chars"
      - name: birth_date
        type: datetime
        source: input
        description: Player date of birth (date-only semantics, midnight UTC)
      - name: guardian_id
        type: string
        source: input
        description: Foreign key to Guardian primarily responsible for this player
      - name: birth_certificate_uri
        type: string
        source: input
        description: Opaque URI to uploaded birth certificate image; required for AGE_VERIFIED transition
      - name: evaluation_score
        type: number
        source: input
        description: 0..100 skill evaluation score recorded during tryouts; used for draft tiering
        constraints: "0..100, one decimal, REQUIRED before EVALUATED"
      - name: evaluation_tier
        type: enum
        source: computed
        description: Tier derived from evaluation_score (see calc tier_classification)
        default: null
        constraints: "one of {TIER_A, TIER_B, TIER_C, TIER_D}; null while UNEVALUATED"
      - name: status
        type: enum
        source: system
        description: Player registration lifecycle
        default: "PENDING_VERIFICATION"
        constraints: "one of {PENDING_VERIFICATION, AGE_VERIFIED, EVALUATED, DRAFTED, WITHDRAWN}"
      - name: team_id
        type: string
        source: system
        description: Team the player has been drafted onto; null until DRAFTED
        default: null
      - name: draft_pick_overall
        type: integer
        source: system
        description: Overall pick number 1..N when drafted; null otherwise
        default: null

  - name: Guardian
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Guardian full legal name
        constraints: "1..160 chars"
      - name: email
        type: string
        source: input
        description: Contact email, unique within domain
        constraints: "valid email, unique"
      - name: phone
        type: string
        source: input
        description: E.164 phone number
      - name: volunteer_hours_logged
        type: number
        source: computed
        description: Cumulative approved volunteer hours across all VolunteerShift rows owned by this guardian in the active season
        default: 0.0
        constraints: ">= 0, two decimals"
      - name: volunteer_status
        type: enum
        source: computed
        description: Derived from volunteer_hours_logged vs season requirement (see calc volunteer_status_classification)
        default: "DEFICIENT"
        constraints: "one of {DEFICIENT, ON_TRACK, FULFILLED}"

  - name: Team
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: Foreign key to the owning Season
      - name: name
        type: string
        source: input
        description: Team name e.g. "Red Sox"
        constraints: "1..80 chars, unique within (season_id)"
      - name: head_coach_id
        type: string
        source: input
        description: Foreign key to Coach assigned as head coach
      - name: draft_position
        type: integer
        source: input
        description: Snake-draft order seat 1..N within the season
        constraints: "1..32, unique within (season_id)"
      - name: roster_count
        type: integer
        source: computed
        description: Count of Players with status IN {DRAFTED} and team_id == this.id
        default: 0
      - name: tier_a_count
        type: integer
        source: computed
        description: Count of drafted Players on this team with evaluation_tier == TIER_A
        default: 0
      - name: wins
        type: integer
        source: computed
        description: Count of completed Games where this team was the winner
        default: 0
      - name: losses
        type: integer
        source: computed
        description: Count of completed Games where this team was the loser
        default: 0
      - name: playoff_seed
        type: integer
        source: system
        description: Bracket seed assigned at PLAYOFFS transition; null in regular season
        default: null
      - name: playoff_status
        type: enum
        source: system
        description: Playoff elimination state
        default: "NOT_QUALIFIED"
        constraints: "one of {NOT_QUALIFIED, QUALIFIED, ELIMINATED, CHAMPION}"

  - name: Coach
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Coach full name
      - name: email
        type: string
        source: input
        description: Coach email, unique within domain
        constraints: "valid email, unique"
      - name: background_check_passed
        type: boolean
        source: input
        description: True if background check is on file; required for head-coach assignment
        default: false

  - name: Referee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Referee full name
      - name: email
        type: string
        source: input
        description: Referee email, unique within domain
        constraints: "valid email, unique"
      - name: certification_level
        type: enum
        source: input
        description: Referee qualification tier
        constraints: "one of {LEVEL_1, LEVEL_2, LEVEL_3}"
      - name: weekly_assignment_cap
        type: integer
        source: input
        description: Maximum number of Game.assignments this referee accepts per ISO week
        default: 5
        constraints: "1..20"
      - name: active
        type: boolean
        source: input
        description: Whether the referee is accepting new assignments
        default: true

  - name: Game
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: Foreign key to Season
      - name: home_team_id
        type: string
        source: input
        description: Foreign key to home Team
      - name: away_team_id
        type: string
        source: input
        description: Foreign key to away Team; must differ from home_team_id
      - name: game_type
        type: enum
        source: input
        description: REGULAR or PLAYOFF
        constraints: "one of {REGULAR, PLAYOFF}"
      - name: field_id
        type: string
        source: input
        description: Identifier of the physical field/diamond used (string token, no Field entity)
        constraints: "1..40 chars; treated as opaque resource id for overlap checks"
      - name: scheduled_start
        type: datetime
        source: input
        description: Game start time (UTC, ISO8601, three fractional digits)
      - name: scheduled_end
        type: datetime
        source: computed
        description: scheduled_start + 90 minutes (fixed duration constant)
      - name: original_scheduled_start
        type: datetime
        source: system
        description: Snapshot of scheduled_start at first creation; preserved across rainout reschedules
      - name: referee_id
        type: string
        source: system
        description: Assigned referee; null until referee assignment endpoint succeeds
        default: null
      - name: status
        type: enum
        source: system
        description: Game lifecycle state
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, POSTPONED, RESCHEDULED, COMPLETED, FORFEITED, CANCELLED}"
      - name: home_score
        type: integer
        source: input
        description: Final runs scored by home; populated on COMPLETED transition
        default: null
      - name: away_score
        type: integer
        source: input
        description: Final runs scored by away; populated on COMPLETED transition
        default: null
      - name: bracket_round
        type: integer
        source: system
        description: Playoff round number 1..R (1=quarterfinals etc.); null for REGULAR games
        default: null

  - name: VolunteerShift
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: Foreign key to Season
      - name: guardian_id
        type: string
        source: input
        description: Foreign key to Guardian owning the shift
      - name: game_id
        type: string
        source: input
        description: Optional foreign key to Game this shift covers (null for non-game shifts)
        default: null
      - name: role
        type: enum
        source: input
        description: Volunteer role for the shift
        constraints: "one of {SCOREKEEPER, CONCESSIONS, FIELD_PREP, UMPIRE_ASSIST, SETUP_TEARDOWN}"
      - name: scheduled_start
        type: datetime
        source: input
        description: Shift start (UTC)
      - name: scheduled_end
        type: datetime
        source: input
        description: Shift end (UTC)
      - name: hours_credited
        type: number
        source: computed
        description: (scheduled_end - scheduled_start) in hours, two decimals; written on APPROVED transition only
        default: 0.0
      - name: status
        type: enum
        source: system
        description: Shift lifecycle
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, CHECKED_IN, APPROVED, NO_SHOW, CANCELLED}"

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: entity_type
        type: string
        source: system
        description: Name of the entity affected
      - name: entity_id
        type: string
        source: system
        description: Id of the affected entity
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of the actor
      - name: actor_id
        type: string
        source: system
        description: X-User-ID of the actor
      - name: action
        type: string
        source: system
        description: Action keyword e.g. "PLAYER_DRAFTED", "GAME_POSTPONED"
      - name: details
        type: object
        source: system
        description: Free-form structured detail payload

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Season
    initial_state: DRAFT_OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT_OPEN
        to: REGULAR_SEASON
        trigger: "POST /league/seasons/{id}/start-regular-season"
        actor: LeagueAdmin
        preconditions:
          - "Every Team in this season has roster_count >= 8"
          - "At least 4 Teams exist in this season"
          - "All Players with status != WITHDRAWN have status == DRAFTED"
        side_effects:
          - "Season.status := REGULAR_SEASON"
          - "Players with status == EVALUATED but not DRAFTED at this point are auto-set to WITHDRAWN (triggers calc tier_classification re-evaluation no-op; logs AuditEvent.action='PLAYER_AUTO_WITHDRAWN')"
      - from: REGULAR_SEASON
        to: PLAYOFFS
        trigger: "POST /league/seasons/{id}/start-playoffs"
        actor: LeagueAdmin
        preconditions:
          - "now() >= Season.playoff_cutoff_date (use POST /_clock/advance to drive time in tests)"
          - "Every regular-season Game has status IN {COMPLETED, FORFEITED, CANCELLED}"
        side_effects:
          - "Season.status := PLAYOFFS"
          - "For each Team in season, recompute wins/losses (calc team_record)"
          - "Run calc playoff_seeding to assign Team.playoff_seed to top 4 teams and Team.playoff_status := QUALIFIED for those; remaining teams get playoff_status := ELIMINATED"
          - "Generate bracket Games (game_type=PLAYOFF, bracket_round=1) pairing seeds 1v4 and 2v3 (status=SCHEDULED); scheduled_start defaults to Season.playoff_cutoff_date + 7 days, field_id 'TBD'"
      - from: PLAYOFFS
        to: CLOSED
        trigger: "POST /league/seasons/{id}/close"
        actor: LeagueAdmin
        preconditions:
          - "Exactly one Team in this season has playoff_status == CHAMPION"
          - "All other Teams have playoff_status == ELIMINATED"
        side_effects:
          - "Season.status := CLOSED"

  - entity: Player
    initial_state: PENDING_VERIFICATION
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING_VERIFICATION
        to: AGE_VERIFIED
        trigger: "POST /league/players/{id}/verify-age"
        actor: LeagueAdmin
        preconditions:
          - "Player.birth_certificate_uri is non-null"
          - "Player.birth_date is within [Season.min_birth_date, Season.max_birth_date] inclusive on both ends"
          - "Season.status == DRAFT_OPEN"
        side_effects:
          - "Player.status := AGE_VERIFIED"
      - from: AGE_VERIFIED
        to: EVALUATED
        trigger: "POST /league/players/{id}/record-evaluation"
        actor: LeagueAdmin
        preconditions:
          - "Body provides evaluation_score in [0, 100]"
          - "Season.status == DRAFT_OPEN"
        side_effects:
          - "Player.evaluation_score := input.evaluation_score"
          - "Player.evaluation_tier := result of calc tier_classification(evaluation_score)"
          - "Player.status := EVALUATED"
      - from: EVALUATED
        to: DRAFTED
        trigger: "POST /league/teams/{team_id}/draft-pick"
        actor: Coach
        preconditions:
          - "Season.status == DRAFT_OPEN"
          - "Acting Coach.id == Team.head_coach_id (ownership)"
          - "Team.draft_position is the current snake-draft seat (calc draft_seat_resolver)"
          - "Player.season_id == Team.season_id"
          - "If Team.tier_a_count >= 3 and Player.evaluation_tier == TIER_A, reject (calc tier_quota enforces 3 TIER_A players per roster max)"
        side_effects:
          - "Player.team_id := Team.id"
          - "Player.draft_pick_overall := next overall pick number"
          - "Player.status := DRAFTED"
          - "Team.roster_count := Team.roster_count + 1 (calc team_roster_aggregates)"
          - "Team.tier_a_count := recompute via calc team_roster_aggregates"
      - from: PENDING_VERIFICATION
        to: WITHDRAWN
        trigger: "POST /league/players/{id}/withdraw"
        actor: Guardian
        preconditions:
          - "Acting Guardian.id == Player.guardian_id"
          - "Player.status != DRAFTED (cannot withdraw post-draft via this transition)"
        side_effects:
          - "Player.status := WITHDRAWN"
      - from: AGE_VERIFIED
        to: WITHDRAWN
        trigger: "POST /league/players/{id}/withdraw"
        actor: Guardian
        preconditions:
          - "Acting Guardian.id == Player.guardian_id"
        side_effects:
          - "Player.status := WITHDRAWN"
      - from: EVALUATED
        to: WITHDRAWN
        trigger: "POST /league/players/{id}/withdraw"
        actor: Guardian
        preconditions:
          - "Acting Guardian.id == Player.guardian_id"
        side_effects:
          - "Player.status := WITHDRAWN"

  - entity: Game
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FORFEITED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: POSTPONED
        trigger: "POST /league/games/{id}/postpone"
        actor: LeagueAdmin
        preconditions:
          - "Season.status IN {REGULAR_SEASON, PLAYOFFS}"
          - "Body provides reason in {RAIN, FIELD_UNAVAILABLE, SAFETY}"
        side_effects:
          - "Game.status := POSTPONED"
          - "Game.referee_id := null (frees the referee for that slot; cascade depth 1)"
          - "Any VolunteerShift with game_id == this.id and status == SCHEDULED transitions to CANCELLED (cascade depth 2 — see Guardian.volunteer_hours_logged recompute below)"
          - "For each cancelled VolunteerShift, Guardian.volunteer_hours_logged recomputed via calc guardian_volunteer_hours (cascade depth 3)"
          - "Guardian.volunteer_status recomputed via calc volunteer_status_classification (cascade depth 4)"
      - from: POSTPONED
        to: RESCHEDULED
        trigger: "POST /league/games/{id}/reschedule"
        actor: LeagueAdmin
        preconditions:
          - "Body provides new scheduled_start"
          - "new scheduled_start > Game.original_scheduled_start (strict)"
          - "new scheduled_start <= Game.original_scheduled_start + Season.rainout_window_days days (boundary: <=, inclusive end-of-day)"
          - "new (scheduled_start, scheduled_end) does not overlap any other Game on same field_id (calc field_overlap_check; touching boundary [a,b)/[b,c) is allowed)"
          - "If referee_id supplied, new (scheduled_start, scheduled_end) does not overlap any other Game assigned to that referee with a 30-minute buffer on each side (calc referee_overlap_check)"
        side_effects:
          - "Game.scheduled_start := new value"
          - "Game.scheduled_end := scheduled_start + 90 minutes"
          - "Game.status := SCHEDULED (re-enters scheduled state; loops allow further postpone/reschedule cycles)"
          - "Game.referee_id := body.referee_id if supplied else null"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /league/games/{id}/record-result"
        actor: LeagueAdmin
        preconditions:
          - "Body provides home_score and away_score, both integers >= 0"
          - "home_score != away_score (no ties allowed in Little League)"
          - "Game.referee_id is non-null"
          - "now() >= Game.scheduled_end"
        side_effects:
          - "Game.home_score := input.home_score; Game.away_score := input.away_score"
          - "Game.status := COMPLETED"
          - "Winner Team.wins := wins + 1 (calc team_record)"
          - "Loser Team.losses := losses + 1 (calc team_record)"
          - "If game_type == PLAYOFF: Loser Team.playoff_status := ELIMINATED (cascade depth 1); if bracket_round was the final round (Round R = ceil(log2(qualified_count))), Winner Team.playoff_status := CHAMPION (cascade depth 2 — terminal)"
          - "If game_type == PLAYOFF and not the final round: generate next-round Game pairing winner with the other bracket-half winner (calc playoff_bracket_advance) — only created when both predecessor games are COMPLETED (cascade depth 3)"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "POST /league/games/{id}/forfeit"
        actor: LeagueAdmin
        preconditions:
          - "Body provides forfeiting_team_id in {home_team_id, away_team_id}"
        side_effects:
          - "Game.status := FORFEITED"
          - "Non-forfeiting team awarded the win (calc team_record): wins + 1"
          - "Forfeiting team: losses + 1"
          - "If game_type == PLAYOFF: Forfeiting team Team.playoff_status := ELIMINATED; advancement same as COMPLETED rules"
      - from: POSTPONED
        to: CANCELLED
        trigger: "POST /league/games/{id}/cancel"
        actor: LeagueAdmin
        preconditions:
          - "Game has been POSTPONED for more than Season.rainout_window_days days (now() > original_scheduled_start + rainout_window_days)"
        side_effects:
          - "Game.status := CANCELLED"
          - "Both teams: neither win nor loss recorded (no team_record update)"

  - entity: VolunteerShift
    initial_state: SCHEDULED
    terminal_states: [APPROVED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /league/volunteer-shifts/{id}/check-in"
        actor: Guardian
        preconditions:
          - "Acting Guardian.id == VolunteerShift.guardian_id"
          - "now() >= scheduled_start - 30 minutes (boundary: >=, strict 30-minute grace window before start)"
          - "now() <= scheduled_end + 30 minutes (boundary: <=, inclusive)"
        side_effects:
          - "VolunteerShift.status := CHECKED_IN"
      - from: CHECKED_IN
        to: APPROVED
        trigger: "POST /league/volunteer-shifts/{id}/approve"
        actor: LeagueAdmin
        preconditions:
          - "now() >= scheduled_end"
        side_effects:
          - "VolunteerShift.hours_credited := (scheduled_end - scheduled_start) in hours, two decimals (calc shift_hours)"
          - "VolunteerShift.status := APPROVED"
          - "Guardian.volunteer_hours_logged := recompute via calc guardian_volunteer_hours"
          - "Guardian.volunteer_status := recompute via calc volunteer_status_classification (cascade depth 2)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /league/volunteer-shifts/{id}/mark-no-show"
        actor: LeagueAdmin
        preconditions:
          - "now() > scheduled_end + 30 minutes (no check-in within grace window)"
        side_effects:
          - "VolunteerShift.status := NO_SHOW"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "DELETE /league/volunteer-shifts/{id} (logical cancel) or cascade from Game.POSTPONED"
        actor: Guardian | system
        preconditions:
          - "If actor=Guardian: acting Guardian.id == VolunteerShift.guardian_id"
          - "If actor=system: cascade from Game POSTPONED transition"
        side_effects:
          - "VolunteerShift.status := CANCELLED"

  - entity: Team
    initial_state: NOT_QUALIFIED
    terminal_states: [CHAMPION]
    transitions:
      - from: NOT_QUALIFIED
        to: QUALIFIED
        trigger: "system: triggered by Season DRAFT_OPEN→PLAYOFFS transition (playoff_seeding sweep)"
        actor: system
        preconditions:
          - "Team is among the top 4 by calc playoff_seeding output"
        side_effects:
          - "Team.playoff_seed := assigned seed 1..4"
          - "Team.playoff_status := QUALIFIED"
      - from: NOT_QUALIFIED
        to: ELIMINATED
        trigger: "system: triggered by Season DRAFT_OPEN→PLAYOFFS (non-qualifying teams)"
        actor: system
        preconditions:
          - "Team is NOT among top 4 by calc playoff_seeding"
        side_effects:
          - "Team.playoff_status := ELIMINATED"
      - from: QUALIFIED
        to: ELIMINATED
        trigger: "system: PLAYOFF Game COMPLETED or FORFEITED — losing team"
        actor: system
        preconditions:
          - "Team is the loser of a PLAYOFF Game just transitioned to COMPLETED or FORFEITED"
        side_effects:
          - "Team.playoff_status := ELIMINATED"
      - from: QUALIFIED
        to: CHAMPION
        trigger: "system: PLAYOFF Game COMPLETED — winner of final round"
        actor: system
        preconditions:
          - "Team is the winner of a PLAYOFF Game with bracket_round == final round"
        side_effects:
          - "Team.playoff_status := CHAMPION (terminal)"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two coaches simultaneously draft different players for the same Team while it is the team's turn (draft seat resolver currently points to Team T)."
    guarantee: "At most one draft pick per snake-draft seat; the second attempt is rejected because the seat has already advanced."
    error_id: ERR_NOT_TEAMS_TURN
    http_status: 409
    serialization: "First-writer-wins on draft seat advancement; the seat advances atomically as part of the DRAFTED transition."

  - scenario: "Two referees assigned to the same Game simultaneously."
    guarantee: "At most one referee is bound to a Game; second assignment rejected."
    error_id: ERR_GAME_REFEREE_ALREADY_ASSIGNED
    http_status: 409
    serialization: "First-writer-wins on Game.referee_id (compare-and-set from null)."

  - scenario: "Two games rescheduled to overlapping windows on the same field at the same time."
    guarantee: "At most one Game occupies a (field_id, [scheduled_start, scheduled_end)) window; second reschedule rejected."
    error_id: ERR_FIELD_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on field occupancy; checked inside the reschedule transaction."

  - scenario: "A guardian withdraws a player while a coach drafts that same player."
    guarantee: "Exactly one of withdraw or draft succeeds."
    error_id: ERR_INVALID_PLAYER_STATE
    http_status: 409
    serialization: "First-writer-wins on Player.status."

  - scenario: "Stale write on Game reschedule with mismatched version."
    guarantee: "Optimistic-concurrency loser is rejected; the up-to-date version must be re-fetched."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Compare-and-set on Game.version when client supplies version in PATCH/reschedule payload."

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: tier_classification
    trigger: "On Player AGE_VERIFIED→EVALUATED transition, given evaluation_score input"
    algorithm: threshold
    formula: |
      if evaluation_score >= 85.0:
          tier = "TIER_A"
      elif evaluation_score >= 70.0:
          tier = "TIER_B"
      elif evaluation_score >= 50.0:
          tier = "TIER_C"
      else:
          tier = "TIER_D"
      return tier
    input_set: "Single evaluation_score value supplied in transition body"
    constants:
      TIER_A_MIN: 85.0
      TIER_B_MIN: 70.0
      TIER_C_MIN: 50.0
    precision: "Score is one decimal; comparisons use >= (boundary points include 85.0, 70.0, 50.0)."

  - name: team_roster_aggregates
    trigger: "On Player.status transition to DRAFTED, and on the cascade from Season DRAFT_OPEN→REGULAR_SEASON auto-withdraw step"
    algorithm: aggregation
    formula: |
      Team.roster_count = count(Player p where p.team_id == Team.id and p.status == "DRAFTED")
      Team.tier_a_count = count(Player p where p.team_id == Team.id and p.status == "DRAFTED" and p.evaluation_tier == "TIER_A")
    input_set: "All Player rows where team_id matches the target Team and status == DRAFTED. WITHDRAWN players are excluded even if they still carry a team_id from before withdrawal (in practice withdrawn players never reach DRAFTED, but the filter is explicit)."
    constants:
      TIER_A_CAP: 3
    precision: "Integer counts. The cap of 3 TIER_A players per team is enforced as a precondition on the DRAFTED transition (>= 3 means TIER_A draft is blocked)."

  - name: draft_seat_resolver
    trigger: "Read on every POST /league/teams/{team_id}/draft-pick request to identify whose turn it is"
    algorithm: chronological
    formula: |
      # Snake draft: order is positions 1,2,...,N for round 1; N,N-1,...,1 for round 2; repeat.
      N = count(Team in season)
      picks_so_far = count(Player p where p.season_id == season_id and p.status == "DRAFTED")
      round_index = picks_so_far // N        # zero-based round
      seat_index_in_round = picks_so_far % N  # zero-based seat
      if round_index % 2 == 0:
          current_seat = seat_index_in_round + 1            # ascending 1..N
      else:
          current_seat = N - seat_index_in_round            # descending N..1
      return current_seat
    input_set: "All Player rows with status == DRAFTED in this season, sorted by draft_pick_overall ASC."
    constants: {}
    precision: "Integer arithmetic. Tie-break is unnecessary because draft_pick_overall is strictly monotonic; concurrency_rules.NOT_TEAMS_TURN handles racing claimants on the same seat."

  - name: field_overlap_check
    trigger: "On Game create (when scheduling new game) and Game POSTPONED→RESCHEDULED transition"
    algorithm: interval_merge
    formula: |
      # All existing Games on the same field_id with status IN {SCHEDULED, COMPLETED, FORFEITED, POSTPONED is excluded
      # because postponed games have surrendered their slot}.
      # New interval [new_start, new_end) collides with existing [a, b) iff new_start < b and a < new_end.
      # Touching at the boundary is ALLOWED: [10:00, 11:30) and [11:30, 13:00) do not overlap.
      for each existing Game g where g.field_id == new.field_id and g.status IN {"SCHEDULED", "COMPLETED", "FORFEITED"} and g.id != new.id:
          if new.scheduled_start < g.scheduled_end and g.scheduled_start < new.scheduled_end:
              return COLLISION
      return OK
    input_set: "All Games on the same field_id excluding the game being edited and excluding POSTPONED games (their slots are freed at postpone time; CANCELLED games likewise free their slot)."
    constants:
      GAME_DURATION_MINUTES: 90
    precision: "Half-open intervals [start, end). Comparisons use strict less-than at boundaries. scheduled_end is always scheduled_start + 90 minutes."

  - name: referee_overlap_check
    trigger: "On POST /league/games/{id}/assign-referee and on Game reschedule when referee_id is supplied"
    algorithm: interval_merge
    formula: |
      # Referee buffer: a 30-minute gap is required around any assignment.
      # Existing assignment [a, b) blocks any new assignment [new_start, new_end) where
      #   new_start < b + 30min  AND  a - 30min < new_end.
      # i.e. the new interval expanded by [-0, +0] collides with the existing interval expanded by [-30min, +30min].
      BUFFER = 30 minutes
      for each existing Game g where g.referee_id == ref_id and g.status IN {"SCHEDULED", "COMPLETED"} and g.id != target.id:
          if target.scheduled_start < (g.scheduled_end + BUFFER) and (g.scheduled_start - BUFFER) < target.scheduled_end:
              return COLLISION
          # Weekly cap: count of g in same ISO week (Monday-Sunday in UTC) where status != CANCELLED
      week_count = count of Games with this referee in same ISO week (UTC), excluding CANCELLED and the target itself
      if week_count + 1 > Referee.weekly_assignment_cap:
          return CAP_EXCEEDED
      return OK
    input_set: "All Games with the same referee_id excluding CANCELLED. ISO week = UTC Monday 00:00:00.000 through Sunday 23:59:59.999."
    constants:
      BUFFER_MINUTES: 30
    precision: "Half-open intervals on the game side, expanded by +/-30 minutes on the existing-game side. Strict less-than at expanded boundaries. ISO week boundary is inclusive Monday 00:00:00 UTC."

  - name: team_record
    trigger: "On Game SCHEDULED→COMPLETED and SCHEDULED→FORFEITED transitions; on Season REGULAR_SEASON→PLAYOFFS sweep to ensure consistency"
    algorithm: aggregation
    formula: |
      Team.wins = count(Game g where (g.home_team_id == Team.id and g.home_score > g.away_score and g.status == "COMPLETED")
                                   or (g.away_team_id == Team.id and g.away_score > g.home_score and g.status == "COMPLETED")
                                   or (g.status == "FORFEITED" and g.forfeiting_team_id != Team.id and (g.home_team_id == Team.id or g.away_team_id == Team.id)))
      Team.losses = count(Game g where (g.home_team_id == Team.id and g.home_score < g.away_score and g.status == "COMPLETED")
                                     or (g.away_team_id == Team.id and g.away_score < g.home_score and g.status == "COMPLETED")
                                     or (g.status == "FORFEITED" and g.forfeiting_team_id == Team.id))
    input_set: "All Games in season with status IN {COMPLETED, FORFEITED}. CANCELLED games contribute zero. Playoff games count toward wins/losses too."
    constants: {}
    precision: "Integer counts. Game must have strictly home_score != away_score (precondition on COMPLETED transition)."

  - name: playoff_seeding
    trigger: "On Season REGULAR_SEASON→PLAYOFFS transition"
    algorithm: weighted_scoring
    formula: |
      # Winning percentage = wins / (wins + losses); CANCELLED games excluded.
      # If (wins + losses) == 0, win_pct = 0.0 (boundary edge).
      # Sort teams by:
      #   1. win_pct DESC (round to 4 decimals before comparison)
      #   2. head_to_head_wins DESC among tied teams (count of COMPLETED Games tied team beat any other tied team)
      #   3. runs_scored - runs_allowed DESC (run differential in COMPLETED games)
      #   4. lexicographic Team.name ASC as final tie-break
      # Top 4 receive playoff_seed in sorted order (1..4); remainder ELIMINATED.
    input_set: "All Teams in season; metrics computed from COMPLETED games only (FORFEITED games count toward win/loss but contribute zero runs to the differential)."
    constants:
      PLAYOFF_BRACKET_SIZE: 4
    precision: "win_pct rounded to 4 decimal places (banker-half-up). Run differential computed from raw integer scores; FORFEITED games contribute 0 to both runs_scored and runs_allowed for the differential metric only."

  - name: playoff_bracket_advance
    trigger: "On PLAYOFF Game SCHEDULED→COMPLETED or SCHEDULED→FORFEITED — fires only when both predecessor games of the next round are terminal"
    algorithm: topological
    formula: |
      # bracket_round 1: 1v4, 2v3 (seeds)
      # bracket_round 2 (final): winner(1v4) vs winner(2v3)
      # Final round R = ceil(log2(qualified_count)) where qualified_count == PLAYOFF_BRACKET_SIZE (4) here, so R == 2.
      # On terminal transition of a bracket_round=r game (r < R):
      #   find its sibling (the other game in the same round with the same pair of source seeds)
      #   if sibling.status IN {"COMPLETED", "FORFEITED"}:
      #       create new Game with game_type=PLAYOFF, bracket_round=r+1, home/away = the two winners,
      #       status=SCHEDULED, scheduled_start = max(this.scheduled_end, sibling.scheduled_end) + 7 days,
      #       field_id="TBD"
      #   else: defer creation until sibling completes
    input_set: "Predecessor PLAYOFF games in the same bracket_round whose winners feed the same next-round slot."
    constants:
      ROUND_GAP_DAYS: 7
    precision: "All datetimes are UTC. Round-counting uses integer ceil(log2(qualified_count))."

  - name: guardian_volunteer_hours
    trigger: "On VolunteerShift CHECKED_IN→APPROVED and on cascade from Game POSTPONED (which cancels SCHEDULED shifts)"
    algorithm: aggregation
    formula: |
      Guardian.volunteer_hours_logged = sum(VolunteerShift.hours_credited
        for VolunteerShift v where v.guardian_id == Guardian.id
                              and v.season_id == active_season_id
                              and v.status == "APPROVED")
      # Round to 2 decimals at the END of the sum (not per row).
      Guardian.volunteer_hours_logged = round(sum, 2, half_up)
    input_set: "VolunteerShifts owned by guardian in active season with status == APPROVED. CHECKED_IN, SCHEDULED, NO_SHOW, CANCELLED shifts contribute zero. Active season = the most recent Season with status != CLOSED."
    constants: {}
    precision: "Sum first, then round to 2 decimals using half-up. Rounding order matters: rounding per row before summing yields different totals for shifts with sub-cent fractional hours."

  - name: volunteer_status_classification
    trigger: "On Guardian.volunteer_hours_logged recomputation (calc guardian_volunteer_hours) and on Season volunteer_hours_required_per_family change"
    algorithm: threshold
    formula: |
      required = Season.volunteer_hours_required_per_family
      logged = Guardian.volunteer_hours_logged
      if logged >= required:
          status = "FULFILLED"
      elif logged >= required * 0.5:
          status = "ON_TRACK"
      else:
          status = "DEFICIENT"
      return status
    input_set: "Guardian.volunteer_hours_logged compared to active Season.volunteer_hours_required_per_family."
    constants:
      ON_TRACK_FRACTION: 0.5
    precision: "Comparisons use >=. Boundary precision: required * 0.5 computed at full precision then compared with >= (a guardian with exactly half the required hours is ON_TRACK, not DEFICIENT)."

  - name: shift_hours
    trigger: "On VolunteerShift CHECKED_IN→APPROVED transition"
    algorithm: aggregation
    formula: |
      delta_seconds = (scheduled_end - scheduled_start).total_seconds()
      hours = delta_seconds / 3600.0
      hours_credited = round(hours, 2, half_up)
    input_set: "Single VolunteerShift's scheduled_start and scheduled_end."
    constants: {}
    precision: "Two decimals, half-up. A 90-minute shift credits 1.50 hours."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (Ordered by Priority)
# ---------------------------------------------------------------------------
validations:
  # AUTH
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all except /_clock/advance and /healthz"

  - priority: 2
    category: auth
    check: "Role permitted for endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all authenticated endpoints"

  - priority: 3
    category: auth
    check: "If role is entity-backed (Coach, Referee, Guardian), X-User-ID resolves to an existing entity of that type; ownership checks applied where declared"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all authenticated endpoints whose roles include an entity-backed role"

  # EXISTENCE — left-to-right in URL path
  - priority: 10
    category: existence
    check: "Path-referenced Season exists"
    error_id: ERR_SEASON_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {season_id} in path"

  - priority: 11
    category: existence
    check: "Path-referenced Team exists"
    error_id: ERR_TEAM_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {team_id} in path"

  - priority: 12
    category: existence
    check: "Path-referenced Player exists"
    error_id: ERR_PLAYER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {player_id} or /players/{id} in path"

  - priority: 13
    category: existence
    check: "Path-referenced Game exists"
    error_id: ERR_GAME_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {game_id} or /games/{id} in path"

  - priority: 14
    category: existence
    check: "Path-referenced VolunteerShift exists"
    error_id: ERR_SHIFT_NOT_FOUND
    http_status: 404
    applies_to: "/volunteer-shifts/{id}/*"

  - priority: 15
    category: existence
    check: "Body-referenced foreign keys (guardian_id, head_coach_id, home_team_id, away_team_id, referee_id, etc.) exist"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create/update endpoints"

  # STATE PRECONDITIONS
  - priority: 20
    category: state
    check: "Target entity is in a valid source state for the requested transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 21
    category: state
    check: "Season is in DRAFT_OPEN for draft / verify-age / record-evaluation operations"
    error_id: ERR_SEASON_NOT_DRAFT_OPEN
    http_status: 409
    applies_to: "POST /players/{id}/verify-age, POST /players/{id}/record-evaluation, POST /teams/{id}/draft-pick"

  - priority: 22
    category: state
    check: "Player.status is in valid source state for transition (e.g., must be EVALUATED to be DRAFTED)"
    error_id: ERR_INVALID_PLAYER_STATE
    http_status: 409
    applies_to: "POST /players/{id}/*, POST /teams/{id}/draft-pick"

  # BUSINESS_SAFETY — youth/safety/compliance gates
  - priority: 30
    category: business_safety
    check: "Birth certificate URI provided before age verification"
    error_id: ERR_BIRTH_CERT_REQUIRED
    http_status: 422
    applies_to: "POST /players/{id}/verify-age"

  - priority: 31
    category: business_safety
    check: "Player birth date falls within [Season.min_birth_date, Season.max_birth_date] inclusive (boundary points are eligible)"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /players/{id}/verify-age"

  - priority: 32
    category: business_safety
    check: "Head coach has background_check_passed == true at time of Team creation or head-coach reassignment"
    error_id: ERR_COACH_NO_BACKGROUND_CHECK
    http_status: 422
    applies_to: "POST /league/teams, PATCH /league/teams/{id}"

  # BUSINESS_TEMPORAL — interval and scheduling
  - priority: 40
    category: business_temporal
    check: "Reschedule new_start strictly greater than original_scheduled_start and <= original_scheduled_start + rainout_window_days"
    error_id: ERR_RAINOUT_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /games/{id}/reschedule"

  - priority: 41
    category: business_temporal
    check: "Game (new) does not overlap any other Game on same field_id (half-open [start, end), touching boundaries allowed)"
    error_id: ERR_FIELD_OVERLAP
    http_status: 409
    applies_to: "POST /league/games, POST /games/{id}/reschedule"

  - priority: 42
    category: business_temporal
    check: "Referee not double-booked: no existing assignment within 30-minute buffer on either side"
    error_id: ERR_REFEREE_OVERLAP
    http_status: 409
    applies_to: "POST /games/{id}/assign-referee, POST /games/{id}/reschedule"

  - priority: 43
    category: business_temporal
    check: "Game scheduled_start falls within [Season.regular_season_start, Season.regular_season_end] for REGULAR games"
    error_id: ERR_GAME_OUT_OF_SEASON_WINDOW
    http_status: 422
    applies_to: "POST /league/games, POST /games/{id}/reschedule (REGULAR only)"

  - priority: 44
    category: business_temporal
    check: "VolunteerShift check-in occurs in window [scheduled_start - 30min, scheduled_end + 30min] inclusive"
    error_id: ERR_CHECK_IN_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /volunteer-shifts/{id}/check-in"

  # BUSINESS_CONSTRAINT — quotas, caps, uniqueness
  - priority: 50
    category: business_constraint
    check: "Draft pick respects current team's snake-draft seat"
    error_id: ERR_NOT_TEAMS_TURN
    http_status: 409
    applies_to: "POST /teams/{id}/draft-pick"

  - priority: 51
    category: business_constraint
    check: "Tier-A cap: a team may roster at most 3 TIER_A players"
    error_id: ERR_TIER_A_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /teams/{id}/draft-pick"

  - priority: 52
    category: business_constraint
    check: "Referee weekly assignment cap not exceeded"
    error_id: ERR_REFEREE_WEEKLY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /games/{id}/assign-referee, POST /games/{id}/reschedule"

  - priority: 53
    category: business_constraint
    check: "home_team_id != away_team_id"
    error_id: ERR_INVALID_GAME_OPPONENTS
    http_status: 422
    applies_to: "POST /league/games"

  - priority: 54
    category: business_constraint
    check: "Team.draft_position unique within season; Team.name unique within season"
    error_id: ERR_TEAM_DUPLICATE
    http_status: 422
    applies_to: "POST /league/teams, PATCH /league/teams/{id}"

  - priority: 55
    category: business_constraint
    check: "Acting Coach owns the target team for draft-pick (Coach.id == Team.head_coach_id)"
    error_id: ERR_NOT_TEAM_OWNER
    http_status: 403
    applies_to: "POST /teams/{id}/draft-pick"

  - priority: 56
    category: business_constraint
    check: "Acting Guardian owns the target player for withdraw / acting Guardian owns the target shift"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /players/{id}/withdraw, /volunteer-shifts/{id}/*"

  # BUSINESS_REFERENTIAL
  - priority: 60
    category: business_referential
    check: "Game cannot be COMPLETED while referee_id is null"
    error_id: ERR_GAME_REFEREE_REQUIRED
    http_status: 422
    applies_to: "POST /games/{id}/record-result"

  - priority: 61
    category: business_referential
    check: "Score validity: home_score >= 0, away_score >= 0, home_score != away_score"
    error_id: ERR_INVALID_SCORE
    http_status: 422
    applies_to: "POST /games/{id}/record-result"

  - priority: 62
    category: business_referential
    check: "Season cannot start playoffs unless all regular games are terminal (COMPLETED, FORFEITED, CANCELLED)"
    error_id: ERR_REGULAR_SEASON_INCOMPLETE
    http_status: 409
    applies_to: "POST /seasons/{id}/start-playoffs"

  - priority: 63
    category: business_referential
    check: "Season cannot start regular season until min team count (4) and min roster size (8 each) reached"
    error_id: ERR_SEASON_NOT_READY
    http_status: 409
    applies_to: "POST /seasons/{id}/start-regular-season"

  # OCC
  - priority: 70
    category: business_constraint
    check: "If client supplies version, it must match current entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT and transition endpoints accepting version"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # Seasons
  - method: POST
    path: "/league/seasons"
    description: "Create a season."
    roles: [LeagueAdmin]
    code: 201
    input: [name, age_division, min_birth_date, max_birth_date, regular_season_start, regular_season_end, playoff_cutoff_date, rainout_window_days?, volunteer_hours_required_per_family?]
    output: Season
    side_effects: ["Season created in DRAFT_OPEN status."]

  - method: GET
    path: "/league/seasons/{id}"
    description: "Read a season."
    roles: [LeagueAdmin, Coach, Referee, Guardian]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: POST
    path: "/league/seasons/{id}/start-regular-season"
    description: "Transition DRAFT_OPEN→REGULAR_SEASON."
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: Season
    side_effects: ["Auto-withdraws non-drafted EVALUATED players; locks team rosters."]

  - method: POST
    path: "/league/seasons/{id}/start-playoffs"
    description: "Transition REGULAR_SEASON→PLAYOFFS."
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: Season
    side_effects: ["Computes playoff seeds, sets Team.playoff_status, generates round-1 bracket games."]

  - method: POST
    path: "/league/seasons/{id}/close"
    description: "Transition PLAYOFFS→CLOSED."
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: Season
    side_effects: []

  # Players
  - method: POST
    path: "/league/players"
    description: "Register a new player (PENDING_VERIFICATION)."
    roles: [Guardian, LeagueAdmin]
    code: 201
    input: [season_id, first_name, last_name, birth_date, guardian_id, birth_certificate_uri?]
    output: Player
    side_effects: []

  - method: GET
    path: "/league/players/{id}"
    description: "Read a player."
    roles: [LeagueAdmin, Coach, Guardian]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: GET
    path: "/league/players"
    description: "List players with filter."
    roles: [LeagueAdmin, Coach]
    code: 200
    input: [season_id?, status?, evaluation_tier?, limit?, offset?]
    output: Player[]
    side_effects: []

  - method: POST
    path: "/league/players/{id}/verify-age"
    description: "Verify age, transition PENDING_VERIFICATION→AGE_VERIFIED."
    roles: [LeagueAdmin]
    code: 200
    input: [birth_certificate_uri?]
    output: Player
    side_effects: []

  - method: POST
    path: "/league/players/{id}/record-evaluation"
    description: "Record evaluation score, transition AGE_VERIFIED→EVALUATED; tier computed."
    roles: [LeagueAdmin]
    code: 200
    input: [evaluation_score]
    output: Player
    side_effects: ["Computes evaluation_tier via tier_classification."]

  - method: POST
    path: "/league/players/{id}/withdraw"
    description: "Withdraw a player from registration (transition to WITHDRAWN)."
    roles: [Guardian, LeagueAdmin]
    code: 200
    input: []
    output: Player
    side_effects: []

  # Teams
  - method: POST
    path: "/league/teams"
    description: "Create a team in DRAFT_OPEN season."
    roles: [LeagueAdmin]
    code: 201
    input: [season_id, name, head_coach_id, draft_position]
    output: Team
    side_effects: []

  - method: GET
    path: "/league/teams/{id}"
    description: "Read a team."
    roles: [LeagueAdmin, Coach, Referee, Guardian]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: POST
    path: "/league/teams/{id}/draft-pick"
    description: "Coach drafts a player onto this team."
    roles: [Coach, LeagueAdmin]
    code: 200
    input: [player_id]
    output: Player
    side_effects: ["Recomputes team_roster_aggregates; advances draft seat."]

  # Coaches
  - method: POST
    path: "/league/coaches"
    description: "Register a coach."
    roles: [LeagueAdmin]
    code: 201
    input: [full_name, email, background_check_passed?]
    output: Coach
    side_effects: []

  # Referees
  - method: POST
    path: "/league/referees"
    description: "Register a referee."
    roles: [LeagueAdmin]
    code: 201
    input: [full_name, email, certification_level, weekly_assignment_cap?]
    output: Referee
    side_effects: []

  # Guardians
  - method: POST
    path: "/league/guardians"
    description: "Register a guardian."
    roles: [LeagueAdmin, Guardian]
    code: 201
    input: [full_name, email, phone]
    output: Guardian
    side_effects: []

  - method: GET
    path: "/league/guardians/{id}"
    description: "Read a guardian (includes derived volunteer_status)."
    roles: [LeagueAdmin, Guardian]
    code: 200
    input: []
    output: Guardian
    side_effects: []

  # Games
  - method: POST
    path: "/league/games"
    description: "Schedule a regular-season game."
    roles: [LeagueAdmin]
    code: 201
    input: [season_id, home_team_id, away_team_id, field_id, scheduled_start, game_type?]
    output: Game
    side_effects: ["Sets original_scheduled_start; runs field_overlap_check."]

  - method: GET
    path: "/league/games/{id}"
    description: "Read a game."
    roles: [LeagueAdmin, Coach, Referee, Guardian]
    code: 200
    input: []
    output: Game
    side_effects: []

  - method: GET
    path: "/league/games"
    description: "List games with filter (by season, team, status, date range, field_id)."
    roles: [LeagueAdmin, Coach, Referee, Guardian]
    code: 200
    input: [season_id?, team_id?, referee_id?, status?, from_date?, to_date?, field_id?, limit?, offset?]
    output: Game[]
    side_effects: []

  - method: POST
    path: "/league/games/{id}/assign-referee"
    description: "Assign a referee to a SCHEDULED game."
    roles: [LeagueAdmin]
    code: 200
    input: [referee_id, version?]
    output: Game
    side_effects: ["Runs referee_overlap_check and weekly cap check."]

  - method: POST
    path: "/league/games/{id}/postpone"
    description: "Postpone a SCHEDULED game (rainout etc.)."
    roles: [LeagueAdmin]
    code: 200
    input: [reason, version?]
    output: Game
    side_effects: ["Cascades: cancel linked SCHEDULED VolunteerShifts; null referee_id; recompute guardian volunteer aggregates."]

  - method: POST
    path: "/league/games/{id}/reschedule"
    description: "Reschedule a POSTPONED game to a new slot."
    roles: [LeagueAdmin]
    code: 200
    input: [scheduled_start, referee_id?, field_id?, version?]
    output: Game
    side_effects: ["Runs field_overlap_check and referee_overlap_check; re-enters SCHEDULED."]

  - method: POST
    path: "/league/games/{id}/cancel"
    description: "Cancel a POSTPONED game whose rainout window has elapsed."
    roles: [LeagueAdmin]
    code: 200
    input: [version?]
    output: Game
    side_effects: []

  - method: POST
    path: "/league/games/{id}/record-result"
    description: "Record final score; transitions SCHEDULED→COMPLETED."
    roles: [LeagueAdmin]
    code: 200
    input: [home_score, away_score, version?]
    output: Game
    side_effects: ["Updates team_record; cascades playoff_bracket_advance for PLAYOFF games."]

  - method: POST
    path: "/league/games/{id}/forfeit"
    description: "Mark a SCHEDULED game forfeited by one team."
    roles: [LeagueAdmin]
    code: 200
    input: [forfeiting_team_id, version?]
    output: Game
    side_effects: ["Updates team_record; cascades playoff advancement if PLAYOFF."]

  # Volunteer shifts
  - method: POST
    path: "/league/volunteer-shifts"
    description: "Schedule a volunteer shift."
    roles: [Guardian, LeagueAdmin]
    code: 201
    input: [season_id, guardian_id, role, scheduled_start, scheduled_end, game_id?]
    output: VolunteerShift
    side_effects: []

  - method: GET
    path: "/league/volunteer-shifts/{id}"
    description: "Read a shift."
    roles: [Guardian, LeagueAdmin]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: []

  - method: POST
    path: "/league/volunteer-shifts/{id}/check-in"
    description: "Guardian checks in for a SCHEDULED shift."
    roles: [Guardian]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: []

  - method: POST
    path: "/league/volunteer-shifts/{id}/approve"
    description: "LeagueAdmin approves a CHECKED_IN shift; credits hours."
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: ["Recomputes Guardian.volunteer_hours_logged and volunteer_status."]

  - method: POST
    path: "/league/volunteer-shifts/{id}/mark-no-show"
    description: "LeagueAdmin marks a SCHEDULED shift as no-show after grace window."
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: []

  - method: DELETE
    path: "/league/volunteer-shifts/{id}"
    description: "Guardian cancels a SCHEDULED shift (logical CANCELLED transition)."
    roles: [Guardian]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: []

  # Time-driving endpoint (test infrastructure)
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock to the supplied ISO8601 timestamp (test-only)."
    roles: [LeagueAdmin]
    code: 200
    input: [to]
    output: null
    side_effects: ["Subsequent now() reads return the advanced timestamp; required to drive any time-gated transition (record-result, mark-no-show, approve, start-playoffs, cancel)."]

  - method: GET
    path: "/league/audit-events"
    description: "List audit events with filter (entity_type, entity_id, action)."
    roles: [LeagueAdmin]
    code: 200
    input: [entity_type?, entity_id?, action?, limit?, offset?]
    output: AuditEvent[]
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-Role or X-User-ID header missing."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for endpoint or entity-backed ownership check failed."

  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting Guardian is not the owner of the target Player or VolunteerShift."

  - id: ERR_NOT_TEAM_OWNER
    http: 403
    condition: "Acting Coach is not the head coach of the target Team."

  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "Season id does not resolve."

  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "Team id does not resolve."

  - id: ERR_PLAYER_NOT_FOUND
    http: 404
    condition: "Player id does not resolve."

  - id: ERR_GAME_NOT_FOUND
    http: 404
    condition: "Game id does not resolve."

  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "VolunteerShift id does not resolve."

  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A body-supplied foreign key does not resolve (guardian, coach, referee, team, etc.)."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic invalid source state for transition (used when no more specific state error applies)."

  - id: ERR_INVALID_PLAYER_STATE
    http: 409
    condition: "Player.status is not in the valid source state for the requested transition (e.g., draft-pick requires EVALUATED)."

  - id: ERR_SEASON_NOT_DRAFT_OPEN
    http: 409
    condition: "Operation requires Season.status == DRAFT_OPEN; Season is elsewhere."

  - id: ERR_BIRTH_CERT_REQUIRED
    http: 422
    condition: "Birth certificate URI not provided before age verification."

  - id: ERR_AGE_INELIGIBLE
    http: 422
    condition: "Player birth_date is outside [min_birth_date, max_birth_date] inclusive."

  - id: ERR_COACH_NO_BACKGROUND_CHECK
    http: 422
    condition: "Head coach lacks background_check_passed."

  - id: ERR_TIER_A_CAP_EXCEEDED
    http: 422
    condition: "Drafting a TIER_A player would push Team.tier_a_count beyond cap of 3."

  - id: ERR_NOT_TEAMS_TURN
    http: 409
    condition: "Draft pick attempted while another team's seat is current."

  - id: ERR_RAINOUT_WINDOW_EXCEEDED
    http: 422
    condition: "Reschedule target date is after Game.original_scheduled_start + Season.rainout_window_days."

  - id: ERR_FIELD_OVERLAP
    http: 409
    condition: "New or rescheduled game collides with another game on the same field (half-open interval, touching allowed)."

  - id: ERR_REFEREE_OVERLAP
    http: 409
    condition: "Referee assignment conflicts with existing assignment within 30-minute buffer."

  - id: ERR_REFEREE_WEEKLY_CAP_EXCEEDED
    http: 422
    condition: "Referee weekly_assignment_cap would be exceeded."

  - id: ERR_GAME_REFEREE_ALREADY_ASSIGNED
    http: 409
    condition: "Game.referee_id is non-null when attempting to assign a referee."

  - id: ERR_GAME_REFEREE_REQUIRED
    http: 422
    condition: "Recording a result requires a referee assigned."

  - id: ERR_INVALID_SCORE
    http: 422
    condition: "home_score / away_score invalid (negative or equal)."

  - id: ERR_INVALID_GAME_OPPONENTS
    http: 422
    condition: "home_team_id equals away_team_id."

  - id: ERR_GAME_OUT_OF_SEASON_WINDOW
    http: 422
    condition: "Regular game scheduled outside [regular_season_start, regular_season_end]."

  - id: ERR_CHECK_IN_OUTSIDE_WINDOW
    http: 422
    condition: "Volunteer shift check-in outside the 30-minute grace window."

  - id: ERR_TEAM_DUPLICATE
    http: 422
    condition: "Team.name or draft_position duplicated within season."

  - id: ERR_REGULAR_SEASON_INCOMPLETE
    http: 409
    condition: "Cannot start playoffs while any regular-season Game is non-terminal."

  - id: ERR_SEASON_NOT_READY
    http: 409
    condition: "Cannot start regular season: < 4 teams or any team with roster_count < 8."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH/PUT/transition."

  - id: ERR_VALIDATION
    http: 422
    condition: "Generic body shape / type validation failure (missing required, wrong type, out-of-range integer)."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: LeagueAdmin
    description: "League operations — schedules games, verifies age, records evaluations, runs playoff/regular-season transitions, approves shifts."
    identity: "opaque"
    exclusive_operations:
      - "POST /league/seasons (and lifecycle transitions: start-regular-season, start-playoffs, close)"
      - "POST /league/teams"
      - "POST /league/coaches"
      - "POST /league/referees"
      - "POST /league/players/{id}/verify-age"
      - "POST /league/players/{id}/record-evaluation"
      - "POST /league/games (create)"
      - "POST /league/games/{id}/assign-referee"
      - "POST /league/games/{id}/postpone"
      - "POST /league/games/{id}/reschedule"
      - "POST /league/games/{id}/cancel"
      - "POST /league/games/{id}/record-result"
      - "POST /league/games/{id}/forfeit"
      - "POST /league/volunteer-shifts/{id}/approve"
      - "POST /league/volunteer-shifts/{id}/mark-no-show"
      - "POST /_clock/advance"
      - "GET /league/audit-events"
    shared_operations:
      - "POST /league/players (with Guardian)"
      - "POST /league/guardians (with Guardian)"
      - "POST /league/players/{id}/withdraw (with Guardian)"
      - "POST /league/volunteer-shifts (with Guardian)"
      - "POST /league/teams/{id}/draft-pick (with Coach, when overriding)"
      - "All GET reads"

  - name: Coach
    description: "Head coach of a Team — drafts players for own team."
    identity: "entity_backed:Coach"
    exclusive_operations: []
    shared_operations:
      - "POST /league/teams/{id}/draft-pick (own team only)"
      - "GET /league/players (read)"
      - "GET /league/teams/{id}, /league/games (own team context)"

  - name: Referee
    description: "Referee — reads own assignments."
    identity: "entity_backed:Referee"
    exclusive_operations: []
    shared_operations:
      - "GET /league/games (own assignments via referee_id filter)"
      - "GET /league/games/{id}"
      - "GET /league/seasons/{id}"

  - name: Guardian
    description: "Parent/guardian — registers/withdraws own children, schedules and manages own volunteer shifts."
    identity: "entity_backed:Guardian"
    exclusive_operations:
      - "POST /league/volunteer-shifts/{id}/check-in (own shift)"
      - "DELETE /league/volunteer-shifts/{id} (own shift, SCHEDULED only)"
    shared_operations:
      - "POST /league/players (own child)"
      - "POST /league/guardians (self-register)"
      - "POST /league/players/{id}/withdraw (own child)"
      - "POST /league/volunteer-shifts (own)"
      - "GET /league/players/{id} (own children)"
      - "GET /league/guardians/{id} (self)"
      - "GET /league/games (read schedule)"
