              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "${camp_id}", suitability_floor_tier: "MEDIUM_RISK", inclusion_list_id: "${inc_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { seg_id: $.data.id }
            - call: "POST /pre-bid-segments/${seg_id}/sync"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /methodology-versions/${mv_view_id}/audit-conclusion"
              payload: { outcome: "DEFICIENT", audit_finding_rate: 0.18, deficiency_note: "Viewability SDK sampling not reproducible" }
              as: AccreditationAuditor
              as_user_id: "auditor-2"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_ver: $.data.version }
          trigger:
            - call: "POST /refund-claims"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", batch_ids: ["${batch_id}"], expected_campaign_version: "${camp_ver}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { claim_id: $.data.id, provisional: $.data.provisional_credit_cents }
            - call: "POST /refund-claims/${claim_id}/review"
              payload: {}
              as: DisputeOfficer
              as_user_id: "officer-1"
            - call: "POST /refund-claims/${claim_id}/approve"
              payload: { decision_note: "Attempting to settle a defect-free decertified batch" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { e_nocredit: $.data.error_id }
            - call: "POST /pre-bid-segments/${seg_id}/sync"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e_remediation: $.data.error_id }
            - call: "POST /refund-claims/${claim_id}/reject"
              payload: { reject_reason_code: "BATCH_RESCORED", decision_note: "No creditable impressions after recomputation" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { final_state: $.data.claim_state }
          assert:
            - "Setup end state: MethodologyVersion.${mv_view_id}.accreditation_status == SUSPENDED with decertified_batch_count == 1; MeasurementBatch.${batch_id}.scoring_status == DECERTIFIED; Campaign.${camp_id}.status == UNDER_REMEDIATION with certified_measured_impressions == 0 and coverage_status == UNKNOWN; PreBidSegment.${seg_id}.sync_status == STALE with stale_reason CAMPAIGN_UNDER_REMEDIATION"
            - "Trigger 1: HTTP 201 - a DECERTIFIED batch IS claimable; ${provisional} == 8750 under the gross basis (10000 * 875 / 1000)"
            - "Trigger 2: HTTP 200 and RefundClaim.${claim_id}.claim_state == UNDER_REVIEW"
            - "Trigger 3: HTTP 409 and ${e_nocredit} == ERR_NO_CREDITABLE_IMPRESSIONS - the net basis is min(10000, 0 confirmed IVT + max(0, 10000 measurable - 10000 qualified)) == 0 because there was no suitability breach, no IVT and no viewability shortfall"
            - "After trigger 3: claim_state is still UNDER_REVIEW, Advertiser.${adv_id}.credit_received_cents_total == 0 and settled_claim_count == 0"
            - "Trigger 4: HTTP 409 and ${e_remediation} == ERR_CAMPAIGN_UNDER_REMEDIATION - re-syncing is blocked by the campaign, not by the list, whose status is still PUBLISHED"
            - "Trigger 5: HTTP 200 and ${final_state} == REJECTED with reject_reason_code BATCH_RESCORED; MeasurementBatch.${batch_id}.settlement_status == CLOSED_NO_CREDIT and Campaign.${camp_id}.open_claim_count == 0"

      - name: entity_backed_role_without_a_user_id_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - errors[ERR_UNAUTHENTICATED]
          - rbac.Advertiser
        distinguishing_aspect: |
          Authentication in this API is two-part: X-User-Role always, plus
          X-User-ID whenever the role is one of the two entity-backed ones
          (Advertiser, Publisher) whose ownership check at priority 3 needs an
          identity. A request carrying a valid role header but no X-User-ID must
          fail at priority 1 with 401 - not 403 at priority 3, and not succeed
          because the role alone is in the endpoint's list. The PlatformAdmin
          control call proves the ID is not required for non-entity roles.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one advertiser and one publisher exist. The trigger calls marked 'no X-User-ID' send only the X-User-Role header."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              captures: { e_adv: $.data.error_id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/news" }
              as: Publisher
              captures: { e_pub: $.data.error_id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: PlatformAdmin
              captures: { camp_id: $.data.id }
          assert:
            - "Trigger 1 (X-User-Role: Advertiser, no X-User-ID): HTTP 401 and ${e_adv} == ERR_UNAUTHENTICATED - priority 1 runs before the priority 3 ownership check, so the answer is not ERR_NOT_RESOURCE_OWNER"
            - "Trigger 2 (X-User-Role: Publisher, no X-User-ID): HTTP 401 and ${e_pub} == ERR_UNAUTHENTICATED"
            - "After triggers 1-2: GET /campaigns returns total_count == 0 and GET /pages returns total_count == 0"
            - "Trigger 3 (X-User-Role: PlatformAdmin, no X-User-ID needed): HTTP 201; Campaign.${camp_id}.advertiser_id == ${adv_id} and status == ACTIVE"

      - name: fiscal_and_appeal_error_family_already_driven_by_the_depth_fixtures
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: rejected_claim_over_exhausted_cap_returns_state_error_not_fiscal_error
          rationale: |
            ERR_CREDIT_CAP_EXCEEDED and ERR_INVALID_CLAIM_STATE are both raised
            by that §1.8 instance, ERR_APPEAL_ROUNDS_EXHAUSTED and
            ERR_SEGREGATION_OF_DUTIES by appeal_sod_breach_outranks_round_exhaustion,
            ERR_BATCH_ALREADY_ADJUDICATED by ivt_retract_restores_impression_conservation_with_no_drift,
            ERR_METHODOLOGY_NOT_ACCREDITED by batch_scoring_blocked_by_suspended_methodology_version,
            ERR_METHODOLOGY_WINDOW_OVERLAP by methodology_windows_are_half_open_and_family_scoped,
            ERR_BATCH_WINDOW_COLLISION by batch_windows_are_closed_with_a_sixty_second_buffer_per_page_and_format,
            ERR_LIST_NOT_PUBLISHED by segment_sync_blocked_by_draft_inventory_list,
            ERR_APPEAL_PENDING by claim_review_blocked_by_live_appeal_on_a_cited_page and
            ERR_IMPRESSION_COUNTS_INCONSISTENT by inconsistent_counts_outrank_window_collision_on_batch_intake.
            Every one of those fixtures asserts the error_id explicitly, so the
            catalog is fully triggered without duplicating the depth work here.

  # From Table 7 (RBAC)
  - section: rbac
    instances:
      - name: every_role_is_locked_out_of_the_other_roles_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - rbac.PlatformAdmin
          - rbac.Advertiser
          - rbac.Publisher
          - rbac.ClassificationAnalyst
          - rbac.DisputeOfficer
          - rbac.AccreditationAuditor
          - rbac.MeasurementOperator
          - validations.priority_2
        distinguishing_aspect: |
          Seven roles, seven trespasses, one error id - and every probe uses an
          unresolvable literal {id} where the endpoint takes one, because the
          role check at priority 2 must fire BEFORE path existence at priority 4.
          An implementation that loads the entity first answers 404 and leaks
          existence information to a caller who is not entitled to ask.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; PlatformAdmin registers one publisher and one page so the classification probe can carry a resolvable page and a live OCC token - everything else the probes name is unresolvable on purpose."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { seed_pub: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${seed_pub}", url: "https://beacon.example.com/news" }
              as: PlatformAdmin
              captures: { seed_page: $.data.id, seed_page_ver: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "bbbbbbbb-0000-0000-0000-000000000001"
              captures: { r1: $.data.error_id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "bbbbbbbb-0000-0000-0000-000000000001", list_type: "INCLUSION", name: "Not mine to make" }
              as: Publisher
              as_user_id: "bbbbbbbb-0000-0000-0000-000000000002"
              captures: { r2: $.data.error_id }
            - call: "POST /page-classifications"
              payload: { page_id: "${seed_page}", methodology_version_id: "bbbbbbbb-0000-0000-0000-000000000004", expected_page_version: "${seed_page_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: Publisher
              as_user_id: "bbbbbbbb-0000-0000-0000-000000000002"
              captures: { r3: $.data.error_id }
            - call: "POST /appeals/bbbbbbbb-0000-0000-0000-000000000005/decide"
              payload: { outcome: "UPHELD", decision_note: "Not my channel" }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { r4: $.data.error_id }
            - call: "POST /measurement-batches/bbbbbbbb-0000-0000-0000-000000000006/score"
              payload: {}
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { r5: $.data.error_id }
            - call: "POST /refund-claims/bbbbbbbb-0000-0000-0000-000000000007/approve"
              payload: { decision_note: "Not my channel either" }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { r6: $.data.error_id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-ROGUE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { r7: $.data.error_id }
            - call: "POST /publishers"
              payload: { name: "Auditor's own publisher", primary_domain: "auditor.example.com" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { r8: $.data.error_id }
            - call: "POST /publishers"
              payload: { name: "Lantern Media", primary_domain: "lantern.example.com", sourced_traffic_pct: 0.10 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
          assert:
            - "All eight trespass triggers return HTTP 403 with error_id ERR_UNAUTHORIZED_ROLE: ${r1}, ${r2}, ${r3}, ${r4}, ${r5}, ${r6}, ${r7} and ${r8} are all ERR_UNAUTHORIZED_ROLE"
            - "None of them returns 404 even though the appeal, batch, claim and methodology ids they name are unresolvable - priority 2 strictly precedes priorities 4 and 5"
            - "Trigger 3 also leaves the seeded page untouched: Page.${seed_page}.classification_state == UNCLASSIFIED and version == ${seed_page_ver}, so the refused write did not consume the OCC token"
            - "The logical clock is still 2026-08-10T00:00:00Z after trigger 1, so the refused clock move had no effect"
            - "Trigger 9: HTTP 201 - the same operation from PlatformAdmin succeeds, so the refusals above are about the role and not about the payloads; Publisher.${pub_id}.publisher_status == ACTIVE"

      - name: advertiser_scope_is_its_own_aggregate_only
        claim_type: peer_roles
        grounds:
          - rbac.Advertiser
          - validations.priority_3
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          Advertisers are peers, not a hierarchy: the ownership check resolves
          the advertiser_id THROUGH the target (Campaign.advertiser_id for a
          read, the body's advertiser_id for a create) and compares it with
          X-User-ID. Two symmetric probes - reading a peer's campaign and
          creating a list under a peer's id - must both be 403, while
          PlatformAdmin reads the same campaign unrestricted, which proves the
          rule is scoped to entity-backed callers.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; advertisers A1 and A2; A1 owns one campaign."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /advertisers"
              payload: { name: "Rival Brands", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { a2: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${a1}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${a1}"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${a2}"
              captures: { e_read: $.data.error_id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${a1}", list_type: "EXCLUSION", name: "Planted Blocklist" }
              as: Advertiser
              as_user_id: "${a2}"
              captures: { e_write: $.data.error_id }
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { admin_read: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${a2}", list_type: "EXCLUSION", name: "Own Blocklist" }
              as: Advertiser
              as_user_id: "${a2}"
              captures: { own_list: $.data.id }
          assert:
            - "Trigger 1: HTTP 403 and ${e_read} == ERR_NOT_RESOURCE_OWNER (not 404 - the campaign exists, the caller is simply not its owner)"
            - "Trigger 2: HTTP 403 and ${e_write} == ERR_NOT_RESOURCE_OWNER; GET /inventory-lists filtered by advertiser_id == ${a1} returns total_count == 0"
            - "Trigger 3: HTTP 200 and ${admin_read} == ${camp_id} - PlatformAdmin reads are unrestricted by ownership"
            - "Trigger 4: HTTP 201 - the same shape of write under the caller's OWN advertiser_id succeeds; InventoryList.${own_list}.advertiser_id == ${a2}"

      - name: publisher_scope_is_its_own_aggregate_only
        claim_type: peer_roles
        grounds:
          - rbac.Publisher
          - validations.priority_3
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          The publisher-side twin of the same rule, and it must bite on the
          appeal channel too: a rival publisher filing an appeal against P1's
          classification is refused at priority 3, BEFORE the classification's
          own eligibility (priority 19) or the filing window (priority 32) are
          consulted - so the 403 must not degrade into a 409 that would confirm
          the target is appealable.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; publishers P1 and P2; P1 owns a page classified HUMAN ['GAMBLING'] and CONFIRMED by analyst-2, so it is appealable by its owner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Lantern Media", primary_domain: "lantern.example.com", sourced_traffic_pct: 0.10 }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${p1}", url: "https://beacon.example.com/odds" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "HUMAN", category_codes: ["GAMBLING"], ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_id: $.data.id }
            - call: "POST /page-classifications/${cls_id}/review"
              payload: { decision: "CONFIRM", review_note: "Sportsbook odds page" }
              as: ClassificationAnalyst
              as_user_id: "analyst-2"
          trigger:
            - call: "GET /publishers/${p1}/scorecard"
              payload: {}
              as: Publisher
              as_user_id: "${p2}"
              captures: { e_scorecard: $.data.error_id }
            - call: "POST /appeals"
              payload: { classification_id: "${cls_id}", reason_code: "CATEGORY_MISREAD", evidence_note: "Filed by a publisher who does not own the page" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { e_appeal: $.data.error_id }
            - call: "POST /appeals"
              payload: { classification_id: "${cls_id}", reason_code: "CATEGORY_MISREAD", evidence_note: "Editorial coverage of odds, no wagering offered" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { appeal_id: $.data.id }
            - call: "GET /publishers/${p1}/scorecard"
              payload: {}
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { officer_view: $.data.publisher_id }
          assert:
            - "Trigger 1: HTTP 403 and ${e_scorecard} == ERR_NOT_RESOURCE_OWNER"
            - "Trigger 2: HTTP 403 and ${e_appeal} == ERR_NOT_RESOURCE_OWNER - not ERR_CLASSIFICATION_SUPERSEDED and not ERR_APPEAL_WINDOW_CLOSED; Page.${page_id}.appeal_count is still 0 and classification_state is still HUMAN_CONFIRMED"
            - "Trigger 3: HTTP 201 from the owning publisher; Appeal.${appeal_id}.appeal_state == FILED and Page.${page_id}.classification_state == APPEALED"
            - "Trigger 4: HTTP 200 and ${officer_view} == ${p1} - the scorecard is a shared read for DisputeOfficer, which is not ownership-scoped"

      - name: audit_conclusion_requires_a_second_auditor_identity
        claim_type: segregation_of_duties
        grounds:
          - rbac.AccreditationAuditor
          - validations.priority_11
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The accreditation SoD is identity-level, not role-level: auditor-1 has
          exactly the right ROLE for the conclusion and is refused solely because
          X-User-ID equals the version's authored_by_user_id. The refusal is 403
          ERR_SEGREGATION_OF_DUTIES, not ERR_UNAUTHORIZED_ROLE, and auditor-2
          performing the identical call succeeds - which is what separates an
          identity check from a role check.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; VIEW-2026.1 authored by auditor-1, PROVISIONAL, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_id: $.data.id, mv_ver: $.data.version, authored_by: $.data.authored_by_user_id }
          trigger:
            - call: "POST /methodology-versions/${mv_id}/audit-conclusion"
              payload: { outcome: "PASSED", audit_finding_rate: 0.01 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { e_sod: $.data.error_id }
            - call: "POST /methodology-versions/${mv_id}/audit-conclusion"
              payload: { outcome: "PASSED", audit_finding_rate: 0.01 }
              as: AccreditationAuditor
              as_user_id: "auditor-2"
              captures: { status_after: $.data.accreditation_status, lead: $.data.lead_auditor_user_id }
          assert:
            - "Setup: ${authored_by} == auditor-1 and ${mv_ver} == 1"
            - "Trigger 1: HTTP 403 and ${e_sod} == ERR_SEGREGATION_OF_DUTIES; accreditation_status is still PROVISIONAL, audit_outcome is null, lead_auditor_user_id is null and version is still ${mv_ver}"
            - "Trigger 2 (byte-identical payload, different X-User-ID): HTTP 200, ${status_after} == ACCREDITED, ${lead} == auditor-2, audit_finding_rate == 0.01 and version == ${mv_ver} + 1"

      - name: appeal_decision_requires_an_officer_who_did_not_touch_the_classification
        claim_type: segregation_of_duties
        excluded_because:
          difficulty_instance: appeal_sod_breach_outranks_round_exhaustion
          rationale: |
            The second segregation-of-duties surface - a DisputeOfficer whose
            X-User-ID equals the classification's reviewed_by_user_id or
            classifier_user_id may not decide the appeal - is built by the §1.8
            instance, which additionally proves that this check (priority 10)
            outranks the round cap (priority 26) and then lets a clean officer
            decide the same appeal. A standalone corner instance would repeat that
            fixture with the priority conflict removed.

  # From Cross-Cutting Complexity Layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: page_occ_token_advances_on_every_write_that_touches_the_page
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[classification-create-stale-page]
          - errors[ERR_STALE_PAGE_VERSION]
          - endpoints[POST /page-classifications]
        distinguishing_aspect: |
          The page token advances on classification AND on review, so a client
          that classified once and then merely watched the review happen holds a
          token that is two generations old. The fixture replays the very same
          stale value twice - once after one intervening write and once after
          two - and both must be 412 ERR_STALE_PAGE_VERSION, while the current
          value succeeds. A version that only bumps on classification lets the
          second replay through.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one publisher; one fresh page at version 1; SUIT-2026.1 effective."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/news" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, ver_1: $.data.version }
          trigger:
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${ver_1}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_1: $.data.id }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${ver_1}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { e_stale_1: $.data.error_id }
            - call: "POST /page-classifications/${cls_1}/review"
              payload: { decision: "CONFIRM", review_note: "Model call agreed" }
              as: ClassificationAnalyst
              as_user_id: "analyst-2"
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${ver_1}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { e_stale_2: $.data.error_id }
            - call: "GET /pages/${page_id}"
              payload: {}
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { ver_now: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${ver_now}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
