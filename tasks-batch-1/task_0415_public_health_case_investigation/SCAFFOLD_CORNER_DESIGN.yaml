  - section: endpoints
    instances:
      - name: list_cases_paginated_envelope_total_count_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/surveillance/cases
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /surveillance/cases with limit=2 over 3 cases returns response_type array, 2 items,
          total_count 3, has_more true (offset/limit pagination envelope).
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1; three cases opened."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-1", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-2", symptom_onset_date: "2026-03-11T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-3", symptom_onset_date: "2026-03-12T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "GET /surveillance/cases?program_id=${prog}&limit=2&offset=0"
              as: EpiAnalyst
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "len(response.data) == 2"
            - "response.meta.total_count == 3"
            - "response.meta.has_more == true"

