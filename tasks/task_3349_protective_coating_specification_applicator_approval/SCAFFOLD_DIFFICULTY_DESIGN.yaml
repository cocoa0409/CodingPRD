            - "CoatingSystem SW-INV-100 ACTIVE; applicator CERTIFIED under a streak-0 program (min score 300)."
            - "BRIDGE project (budget 500000) with ISSUED spec and a COMPLETED work order."
            - "Warranty issued with exposure_cents 200003 (ACTIVE, manufacturer_fault_pct 50), CLAIMED, investigation in EVIDENCE_GATHERING."
