# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3113_fertility_benefit_network_management_treatment_bundle_administration
#
# One instance block per §0.5 Difficulty Rule; ≥ 2 instances per rule, ≥ 18 total.
# Every `grounds:` reference resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every `${var}` traces to a `captures:` binding on an earlier line of the same
# instance. Every formula-derived assert is a literal computed from the
# §1.3 formula at authoring time.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥ 2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: member_cost_share_provisional_vs_final_cents_delta
        grounds:
          - calculations.member_cost_share
          - entities.Claim.fields.member_cost_share_cents
          - entities.Preauthorization.fields.member_cost_share_pct
          - validations[priority=6]
          - concurrency_rules[claim-pay-stale-auth]
        distinguishing_aspect: "For one MEDICATION claim the PROVISIONAL reading of `member_cost_share_cents` (kept on the claim from creation) is 4480 while the FINAL reading (computed at adjudication) is 0 — same auth.member_cost_share_pct of 20, same allowed_cents of 20000, same accumulator — because only FINAL nets COST_DIFFERENCE_CAP_CENTS and floors the specialty differential."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. CONCURRENT_BUNDLE employer E1 with an ACTIVE IVF_RETRIEVAL_TRANSFER entitlement of 3 cycles and a 1000000-cent pharmacy pool."
            - "Advocate A1 licensed in TX and specialized in STANDARD_IVF; member M1 in INTAKE, then assigned A1 and taken CARE_ACTIVE."
            - "Clinic C1 CONTRACTED on an ACTIVE contract whose bundle_rates[IVF_RETRIEVAL_TRANSFER] is 1450000."
            - "Plan P1 CLINIC_SELECTED on C1; a second-cycle Preauthorization AUTH1 created at 20 percent member cost share, APPROVED with a criteria score of 100; this is plan cycle sequence 2."
            - "A MEDICATION Claim CL1 of 20000 billed cents in claim_status RECEIVED, carrying the PROVISIONAL member share and accumulator_before_cents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /employer-accounts"
              payload: { employer_name: "E1", plan_year: 2026, funding_type: "SELF_FUNDED", allocation_method: "CONCURRENT_BUNDLE", enrollment_limit: 50 }
              as: PlanAdministrator
              captures: { e1: $.data.id }
            - call: "POST /bundle-entitlements"
              payload: { employer_account_id: "${e1}", bundle_type: "IVF_RETRIEVAL_TRANSFER", lifetime_max_cycles: 3, max_cycles_per_year: 3, max_transfers_per_cycle: 2, pharmacy_pool_cents: 1000000, copay_max: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { b1: $.data.id }
            - call: "POST /bundle-entitlements/${b1}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /care-advocates"
              payload: { full_name: "A1", states_licensed: ["TX"], specializations: ["STANDARD_IVF"], caseload_limit: 5, credentials_expire_on: "2027-12-31T00:00:00Z" }
              as: PlanAdministrator
              captures: { adv1: $.data.id }
            - call: "POST /members"
              payload: { employer_account_id: "${e1}", external_ref: "M1", full_name: "M1", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
            - call: "POST /members/${m1}/complete-intake"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv1}"
            - call: "POST /clinics"
              payload: { legal_name: "C1", npi: "1000000001", state_code: "TX", network_tier: "PREFERRED", min_live_birth_rate_bps: 0, max_multiple_birth_rate_bps: 10000, required_quality_report_count: 0, maturity_report_threshold: 2, bundles_offered: ["IVF_RETRIEVAL_TRANSFER"] }
              as: NetworkManager
              captures: { c1: $.data.id }
            - call: "POST /clinics/${c1}/contracts"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", bundle_rates: { IVF_RETRIEVAL_TRANSFER: 1450000 } }
              as: NetworkManager
              captures: { ct1: $.data.id }
            - call: "POST /clinic-contracts/${ct1}/activate"
              payload: { expected_clinic_version: "${c1v}" }
              as: NetworkManager
            - call: "POST /treatment-plans"
              payload: { member_id: "${m1}", bundle_entitlement_id: "${b1}", pathway_type: "STANDARD_IVF", planned_cycles: 3 }
              as: CareAdvocate
              as_user_id: "${adv1}"
              captures: { p1: $.data.id }
            - call: "GET /clinics/${c1}"
              payload: {}
              as: NetworkManager
              captures: { c1v: $.data.version }
            - call: "POST /treatment-plans/${p1}/select-clinic"
              payload: { clinic_id: "${c1}", expected_member_version: "${m1v}" }
              as: CareAdvocate
              as_user_id: "${adv1}"
              captures: { p1v: $.data.version }
            - call: "GET /members/${m1}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv1}"
              captures: { m1v: $.data.version }
            - call: "POST /treatment-plans/${p1}/preauthorizations"
              payload: { cycle_sequence_index: 2, criteria_inputs: { age_years: 32, amh_ng_ml: 2.4, prior_cycles: 0, prior_live_birth: false, fsh_iu_l: 6 }, member_cost_share_pct: 20 }
              as: CareAdvocate
              as_user_id: "${adv1}"
              captures: { auth1: $.data.id }
            - call: "POST /preauthorizations/${auth1}/decide"
              payload: { decision: "APPROVE", expected_treatment_plan_version: "${p1v}" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { ph1: $.data.id }
            - call: "POST /treatment-plans/${p1}/treatment-cycles"
              payload: { preauthorization_id: "${ph1}", retrieval_date: "2026-09-05T00:00:00Z", transfer_date: "2026-09-10T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${c1}"
              captures: { cyc1: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${m1}", preauthorization_id: "${ph1}", treatment_cycle_id: "${cyc1}", service_category: "MEDICATION", billed_cents: 20000, service_date_iso: "2026-09-20T00:00:00Z" }
              as: ClaimsProcessor
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /claims/${cl1}/adjudicate"
              payload: {}
              as: ClaimsProcessor
              captures: { cl1_v: $.data.version }
          assert:
            - "Claim.${cl1}.member_cost_share_cents == 0"
            - "Claim.${cl1}.member_cost_share_cents == 4480 is false — 4480 is the PROVISIONAL reading the same inputs produce without COST_DIFFERENCE_CAP_CENTS"
            - "Claim.${cl1}.allowed_cents == 20000 and Claim.${cl1}.plan_paid_cents == 20000"
            - "Claim.${cl1}.claim_status == ADJUDICATED and Claim.${cl1}.adjudication_basis == BUNDLE_COMPONENT_RULE"
            - "Claim.${cl1}.member_accumulator_before_cents == 0 and Claim.${cl1}.member_accumulator_after_cents == 0"
            - "Claim.${cl1}.version > ${cl1_v} - 1"

      - name: network_quality_amended_workset_divergence
        grounds:
          - calculations.network_quality_score
          - entities.Clinic.fields.composite_quality_bps
          - state_machines.OutcomeRecord.RECORDED_to_AMENDED
          - state_machines.OutcomeRecord.RECORDED_to_VOIDED
          - errors[ERR_DUPLICATE_OPERATION]
        distinguishing_aspect: "On the Clinic domain the AMENDED variant recomputes the whole workset in place, so amending a non-live-birth record into a live birth moves `live_birth_rate_bps` from 5000 to 7500 — whereas an implementation that APPENDS the amendment instead of replacing yields 4000, a divergence the same formula's VOIDED variant does not produce because voiding removes the record from both numerator and denominator at once."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. CONCURRENT_BUNDLE employer E2, bundle B2, advocate A2, members M2..M5, clinic C2 CONTRACTED with maturity_report_threshold 2, min_live_birth_rate_bps 4000, max_multiple_birth_rate_bps 10000."
            - "Four plans on C2, each with an APPROVED authorization and one cycle driven to OUTCOME_RECORDED, all four outcomes reported to C2: records O1 (live birth, singleton), O2 (no live birth), O3 (no live birth), O4 (no live birth). live_birth_rate_bps is 2500 after the four reports."
            - "O1, O2, O3 have been AMENDED to no-live-birth so the standing workset is four records with zero live births; live_birth_rate_bps is 0 and clinic_status is PROBATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /employer-accounts"
              payload: { employer_name: "E2", plan_year: 2026, funding_type: "SELF_FUNDED", allocation_method: "CONCURRENT_BUNDLE", enrollment_limit: 50 }
              as: PlanAdministrator
              captures: { e2: $.data.id }
            - call: "POST /bundle-entitlements"
              payload: { employer_account_id: "${e2}", bundle_type: "IVF_RETRIEVAL_TRANSFER", lifetime_max_cycles: 8, max_cycles_per_year: 8, max_transfers_per_cycle: 2, pharmacy_pool_cents: 1000000, copay_max: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { b2: $.data.id }
            - call: "POST /bundle-entitlements/${b2}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /care-advocates"
              payload: { full_name: "A2", states_licensed: ["TX"], specializations: ["STANDARD_IVF"], caseload_limit: 5, credentials_expire_on: "2027-12-31T00:00:00Z" }
              as: PlanAdministrator
              captures: { adv2: $.data.id }
            - call: "POST /clinics"
              payload: { legal_name: "C2", npi: "1000000002", state_code: "TX", network_tier: "STANDARD", min_live_birth_rate_bps: 4000, max_multiple_birth_rate_bps: 10000, required_quality_report_count: 0, maturity_report_threshold: 2, bundles_offered: ["IVF_RETRIEVAL_TRANSFER"] }
              as: NetworkManager
              captures: { c2: $.data.id }
            - call: "POST /clinics/${c2}/contracts"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", bundle_rates: { IVF_RETRIEVAL_TRANSFER: 1450000 } }
              as: NetworkManager
              captures: { ct2: $.data.id }
            - call: "GET /clinics/${c2}"
              payload: {}
              as: NetworkManager
              captures: { c2v: $.data.version }
            - call: "POST /clinic-contracts/${ct2}/activate"
              payload: { expected_clinic_version: "${c2v}" }
              as: NetworkManager
            - call: "POST /members"
              payload: { employer_account_id: "${e2}", external_ref: "M2", full_name: "M2", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { m2: $.data.id }
            - call: "POST /members/${m2}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
            - call: "POST /members/${m2}/complete-intake"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv2}"
            - call: "POST /treatment-plans"
              payload: { member_id: "${m2}", bundle_entitlement_id: "${b2}", pathway_type: "STANDARD_IVF", planned_cycles: 1 }
              as: CareAdvocate
              as_user_id: "${adv2}"
              captures: { p2: $.data.id }
            - call: "GET /members/${m2}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv2}"
              captures: { m2v: $.data.version }
            - call: "POST /treatment-plans/${p2}/select-clinic"
              payload: { clinic_id: "${c2}", expected_member_version: "${m2v}" }
              as: CareAdvocate
              as_user_id: "${adv2}"
              captures: { p2v: $.data.version }
            - call: "POST /treatment-plans/${p2}/preauthorizations"
              payload: { cycle_sequence_index: 1, criteria_inputs: { age_years: 32, amh_ng_ml: 2.4, prior_cycles: 0, prior_live_birth: false, fsh_iu_l: 6 }, member_cost_share_pct: 20 }
              as: CareAdvocate
              as_user_id: "${adv2}"
              captures: { a2_1: $.data.id }
            - call: "POST /preauthorizations/${a2_1}/decide"
              payload: { decision: "APPROVE", expected_treatment_plan_version: "${p2v}" }
              as: ClinicalReviewer
              as_user_id: "rev-2"
              captures: { ph2_1: $.data.id }
            - call: "POST /treatment-plans/${p2}/treatment-cycles"
              payload: { preauthorization_id: "${ph2_1}", retrieval_date: "2026-09-05T00:00:00Z", transfer_date: "2026-09-10T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${c2}"
              captures: { cy2_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-26T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /treatment-cycles/${cy2_1}/record-outcome"
              payload: { live_birth: true, births_count: 1, multiple_birth: false, gestational_weeks: 39 }
              as: ClinicCoordinator
              as_user_id: "${c2}"
            - call: "POST /clinics/${c2}/report-outcome"
              payload: { treatment_cycle_id: "${cy2_1}", live_birth: true, births_count: 1, multiple_birth: false, gestational_weeks: 39, expected_treatment_cycle_version: "${cy2_1v}" }
              as: ClinicCoordinator
              as_user_id: "${c2}"
              captures: { o1: $.data.id }
            - call: "GET /treatment-cycles/${cy2_1}"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${c2}"
              captures: { cy2_1v: $.data.version }
            - call: "POST /outcome-records/${o1}/amend"
              payload: { live_birth: false, births_count: 0, multiple_birth: false, gestational_weeks: 39, amendment_reason: "chart correction" }
              as: NetworkManager
              captures: { o1_v: $.data.version }
          trigger:
            - call: "POST /outcome-records/${o1}/amend"
              payload: { live_birth: true, births_count: 1, multiple_birth: false, gestational_weeks: 39, amendment_reason: "reinstated after review" }
              as: NetworkManager
              captures: { o1_final: $.data.version }
          assert:
            - "Clinic.${c2}.cycles_reported == 1"
            - "Clinic.${c2}.live_birth_rate_bps == 10000"
            - "Clinic.${c2}.multiple_birth_rate_bps == 0"
            - "Clinic.${c2}.live_birth_rate_bps != 5000 — appending instead of replacing the amended record's outcome would halve the rate"
            - "OutcomeRecord.${o1}.outcome_status == AMENDED and OutcomeRecord.${o1}.amendment_reason == \"reinstated after review\""
            - "OutcomeRecord.${o1}.version > ${o1_v}"
            - "NetworkManager POST /outcome-records/${o1}/void returns ERR_DUPLICATE_OPERATION is false — voiding is permitted after an amendment"
# ===========================================================================
  # Rule 2 — combinatorial_formula (≥ 2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: clinic_bundle_price_copay_max_manager_fee_rounding_mode_b
        grounds:
          - calculations.clinic_bundle_price
          - entities.ClinicContract.fields.bundle_rates
          - entities.BundleEntitlement.fields.copay_max
          - entities.TreatmentPlan.fields.selected_bundle_price_cents
          - validations[priority=7]
        distinguishing_aspect: "Mode (b) nested-rounding order: the 8 percent manager fee is rounded BEFORE the 25000-cent copay reduction is netted out of it — 1250000 at 8 percent rounds to 100000, then 100000 - 25000 = 75000, so the pinned price is 1175000; summing or rounding after the netting would give 1175000 only by coincidence and 1174999 when the rate is chosen so the fee lands on a half-cent, which the sibling instance at rate 1250000 is not — the sibling pins the FEE-ROUNDING order via a non-terminating percentage."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. CONCURRENT_BUNDLE employer E3 with bundle B3 (IVF_RETRIEVAL_TRANSFER, copay_max true, 6 cycles, 1000000-cent pharmacy pool)."
            - "Clinic C3 CONTRACTED on an ACTIVE contract whose bundle_rates[IVF_RETRIEVAL_TRANSFER] is 1250000."
            - "Member M6 INTAKE with required_track STANDARD_IVF, advocate A3 assigned, then CARE_ACTIVE."
            - "Plan P3 in PLAN_DRAFT, showing CLINIC_SELECTED with selected_bundle_price_cents 1175000 after the select-clinic call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /employer-accounts"
              payload: { employer_name: "E3", plan_year: 2026, funding_type: "SELF_FUNDED", allocation_method: "CONCURRENT_BUNDLE", enrollment_limit: 50 }
              as: PlanAdministrator
              captures: { e3: $.data.id }
            - call: "POST /bundle-entitlements"
              payload: { employer_account_id: "${e3}", bundle_type: "IVF_RETRIEVAL_TRANSFER", lifetime_max_cycles: 6, max_cycles_per_year: 6, max_transfers_per_cycle: 2, pharmacy_pool_cents: 1000000, copay_max: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { b3: $.data.id }
            - call: "POST /bundle-entitlements/${b3}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /care-advocates"
              payload: { full_name: "A3", states_licensed: ["TX"], specializations: ["STANDARD_IVF"], caseload_limit: 5, credentials_expire_on: "2027-12-31T00:00:00Z" }
              as: PlanAdministrator
              captures: { adv3: $.data.id }
            - call: "POST /members"
              payload: { employer_account_id: "${e3}", external_ref: "M6", full_name: "M6", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { m6: $.data.id }
            - call: "POST /members/${m6}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
            - call: "POST /members/${m6}/complete-intake"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv3}"
            - call: "POST /clinics"
              payload: { legal_name: "C3", npi: "1000000003", state_code: "TX", network_tier: "PREFERRED", min_live_birth_rate_bps: 0, max_multiple_birth_rate_bps: 10000, required_quality_report_count: 0, maturity_report_threshold: 2, bundles_offered: ["IVF_RETRIEVAL_TRANSFER"] }
              as: NetworkManager
              captures: { c3: $.data.id }
            - call: "POST /clinics/${c3}/contracts"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", bundle_rates: { IVF_RETRIEVAL_TRANSFER: 1250000 } }
              as: NetworkManager
              captures: { ct3: $.data.id }
            - call: "GET /clinics/${c3}"
              payload: {}
              as: NetworkManager
              captures: { c3v: $.data.version }
            - call: "POST /clinic-contracts/${ct3}/activate"
              payload: { expected_clinic_version: "${c3v}" }
              as: NetworkManager
            - call: "POST /treatment-plans"
              payload: { member_id: "${m6}", bundle_entitlement_id: "${b3}", pathway_type: "STANDARD_IVF", planned_cycles: 2 }
              as: CareAdvocate
              as_user_id: "${adv3}"
              captures: { p3: $.data.id }
            - call: "GET /members/${m6}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv3}"
              captures: { m6v: $.data.version }
          trigger:
            - call: "POST /treatment-plans/${p3}/select-clinic"
              payload: { clinic_id: "${c3}", expected_member_version: "${m6v}" }
              as: CareAdvocate
              as_user_id: "${adv3}"
              captures: { p3v: $.data.version }
          assert:
            - "TreatmentPlan.${p3}.selected_bundle_price_cents == 1175000"
            - "TreatmentPlan.${p3}.plan_status == CLINIC_SELECTED"
            - "TreatmentPlan.${p3}.selected_bundle_price_cents != 1250000 — the manager fee is netted out at CLINIC_SELECTED, not deferred to approval"
            - "TreatmentPlan.${p3}.selected_bundle_price_cents != 1150000 — subtracting the raw 8 percent before rounding floats the result by 2500 cents"
            - "Member.${m6}.clinic_id == ${c3} after the same call"
            - "TreatmentPlan.${p3}.version == 1 and the select-clinic response's version equals 1"

      - name: pharmacy_pool_waterfall_remainder_absorption_mode_b
        grounds:
          - calculations.pharmacy_pool_allocation
          - entities.MedicationOrder.fields.plan_paid_cents
          - entities.BundleEntitlement.fields.pharmacy_remaining_cents
          - state_machines.MedicationOrder.DISPENSING_to_CANCELLED
          - errors[ERR_PHARMACY_POOL_EXHAUSTED]
        distinguishing_aspect: "Dispensing a 420000-cent fill against a 500000-cent pool must allocate the pool remainder EXACTLY — plan_paid_cents 420000, ingredient bucket 344400, dispensing-fee bucket 75600, with ingredient + fee == claimable to the cent and pharmacy_remaining_cents landing on exactly 80000 — rather than letting the rounding remainder drift into either bucket, which is what an implementation that rounds both buckets independently does (344400 + 75600 = 420000 only when the fee bucket absorbs the remainder)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. CONCURRENT_BUNDLE employer E4 with bundle B4 (IVF_RETRIEVAL_TRANSFER, pharmacy_pool_cents 500000, copay_max false, 4 cycles)."
            - "Clinic C4 CONTRACTED with an ACTIVE contract at rate 1450000; member M7 CARE_ACTIVE on advocate A4."
            - "Plan P4 with an APPROVED medication authorization PH4 (member_cost_share_pct 10); a MedicationOrder MO4 of 420000 acquisition cents in pharmacy_status PRESCRIBED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /employer-accounts"
              payload: { employer_name: "E4", plan_year: 2026, funding_type: "SELF_FUNDED", allocation_method: "CONCURRENT_BUNDLE", enrollment_limit: 50 }
              as: PlanAdministrator
              captures: { e4: $.data.id }
            - call: "POST /bundle-entitlements"
              payload: { employer_account_id: "${e4}", bundle_type: "IVF_RETRIEVAL_TRANSFER", lifetime_max_cycles: 4, max_cycles_per_year: 4, max_transfers_per_cycle: 2, pharmacy_pool_cents: 500000, copay_max: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { b4: $.data.id }
            - call: "POST /bundle-entitlements/${b4}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /care-advocates"
              payload: { full_name: "A4", states_licensed: ["TX"], specializations: ["STANDARD_IVF"], caseload_limit: 5, credentials_expire_on: "2027-12-31T00:00:00Z" }
              as: PlanAdministrator
              captures: { adv4: $.data.id }
            - call: "POST /members"
              payload: { employer_account_id: "${e4}", external_ref: "M7", full_name: "M7", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { m7: $.data.id }
            - call: "POST /members/${m7}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
            - call: "POST /members/${m7}/complete-intake"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv4}"
            - call: "POST /clinics"
