              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_CONTRACT_NOT_ACTIVE"

      - name: clock_out_invalid_clock_range_returns_invalid_clock_range
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_INVALID_CLOCK_RANGE]
          - state_machines.TimeEntry.OPEN_to_COMPLETED
        distinguishing_aspect: "clock-out with clock_out_min <= clock_in_min (480 <= 480) returns ERR_INVALID_CLOCK_RANGE (422); entry stays OPEN."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew, a ROUTINE visit started, one OPEN TimeEntry clocked in at 480."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${visit_id}", crew_id: "${crew_id}", clock_in_min: 480 }
              as: FieldSupervisor
              captures: { te_id: $.data.id }
          trigger:
            - call: "POST /time-entries/${te_id}/clock-out"
              payload: { clock_out_min: 480 }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_CLOCK_RANGE"
            - "TimeEntry.${te_id}.status == OPEN (unchanged)"

      - name: dispatch_strip_wax_on_carpet_returns_floor_ineligible
        claim_type: Conditional validation
        grounds:
          - validations[priority=9]
          - errors[ERR_FLOOR_INELIGIBLE]
          - entities.Site.fields.floor_type
          - state_machines.PeriodicJob.REQUESTED_to_DISPATCHED
        distinguishing_aspect: "STRIP_WAX dispatch requires VCT/TERRAZZO; dispatching a REQUESTED STRIP_WAX job on a CARPET site returns ERR_FLOOR_INELIGIBLE (409) — conditional on job_type."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (floor_type=CARPET), AVAILABLE crew, one REQUESTED STRIP_WAX PeriodicJob."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /periodic-jobs"
              payload: { site_id: "${site_id}", job_type: "STRIP_WAX", quoted_hours: 2, requested_date: "2026-06-12" }
              as: AccountManager
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /periodic-jobs/${job_id}/dispatch"
              payload: { crew_id: "${crew_id}", service_date: "2026-06-12", planned_start_min: 480, planned_end_min: 600 }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_FLOOR_INELIGIBLE"
            - "PeriodicJob.${job_id}.status == REQUESTED (unchanged)"

      - name: existence_before_state_path_404_wins_on_unknown_visit
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Priority-4 path existence outranks priority-7 state: POST /visits/{nonexistent}/start returns ERR_NOT_FOUND (404), not a state error."
        test_recipe:
          setup:
            - "Empty DB (no visits), a FieldSupervisor actor."
          setup_api_calls: []
          trigger:
            - call: "POST /visits/visit_missing/start"
              payload: {}
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_NOT_FOUND (priority 4 wins over priority 7)"

      - name: shift_capacity_boundary_excluded
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors[ERR_SHIFT_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / shift_capacity_threshold_at_and_over_on_clock_out
          rationale: "The 480-OK / 481-fail shift-capacity boundary is the asserted outcome of the named §1.8 boundary instance."

      - name: crew_double_book_overlap_excluded
        claim_type: Temporal validation
        grounds:
          - validations[priority=11]
          - errors[ERR_CREW_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / visit_crew_overlap_half_open_adjacency_allowed
          rationale: "Half-open Visit interval overlap vs adjacency is the asserted outcome of the named §1.8 temporal-overlap instance."

      - name: schedule_window_touching_conflict_excluded
        claim_type: Temporal validation
        grounds:
          - validations[priority=12]
          - errors[ERR_SCHEDULE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / schedule_window_closed_interval_touching_conflict
          rationale: "Closed-interval schedule-window touching conflict is the asserted outcome of the named §1.8 instance."

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: suspend_account_then_create_site_blocked
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/accounts/{accountId}/suspend
          - endpoints.POST_/sites
          - entities.Account.fields.status
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - validations[priority=8]
        distinguishing_aspect: "POST /accounts/{id}/suspend flips status SUSPENDED; a subsequent POST /sites under that account is blocked with ERR_ACCOUNT_NOT_ACTIVE (409) — suspend gates new sites."
        test_recipe:
          setup:
            - "One account, then SUSPENDED."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/suspend"
              payload: {}
              as: AccountManager
              captures: { st: $.data.status }
          trigger:
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "Account.${acct_id}.status == SUSPENDED after suspend"
            - "HTTP status == 409 for the create-site"
            - "data.error_id == ERR_ACCOUNT_NOT_ACTIVE"

      - name: supply_order_fulfill_action_transitions_to_fulfilled
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/supply-orders/{supplyOrderId}/fulfill
          - entities.SupplyOrder.fields.status
        distinguishing_aspect: "POST /supply-orders/{id}/fulfill moves a REQUESTED order to FULFILLED (200); the SupplyOrder lifecycle endpoint not touched by §1.8."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, one REQUESTED SupplyOrder."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /supply-orders"
              payload: { site_id: "${site_id}", sku: "PAPER_TOWEL", quantity: 5 }
              as: FieldSupervisor
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /supply-orders/${order_id}/fulfill"
              payload: {}
              as: FieldSupervisor
              captures: { st: $.data.status }
          assert:
            - "HTTP status == 200"
            - "SupplyOrder.${order_id}.status == FULFILLED"

      - name: cancel_supply_order_from_fulfilled_returns_invalid_state
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/supply-orders/{supplyOrderId}/cancel
          - state_machines.SupplyOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Supply order cancel is defined only from REQUESTED; cancelling a FULFILLED order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, one SupplyOrder fulfilled."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /supply-orders"
              payload: { site_id: "${site_id}", sku: "TRASH_LINER", quantity: 10 }
              as: FieldSupervisor
              captures: { order_id: $.data.id }
            - call: "POST /supply-orders/${order_id}/fulfill"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /supply-orders/${order_id}/cancel"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "SupplyOrder.${order_id}.status == FULFILLED (unchanged)"

      - name: cancel_periodic_job_from_requested_succeeds
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/periodic-jobs/{periodicJobId}/cancel
          - state_machines.PeriodicJob.REQUESTED_to_CANCELLED
          - entities.PeriodicJob.fields.status
        distinguishing_aspect: "POST /periodic-jobs/{id}/cancel moves a REQUESTED job to CANCELLED (200); the cancel transition not asserted as a success path in §1.8."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, one REQUESTED PeriodicJob."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "VCT" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /periodic-jobs"
              payload: { site_id: "${site_id}", job_type: "STRIP_WAX", quoted_hours: 2, requested_date: "2026-06-12" }
              as: AccountManager
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /periodic-jobs/${job_id}/cancel"
              payload: {}
              as: AccountManager
              captures: { st: $.data.status }
          assert:
            - "HTTP status == 200"
            - "PeriodicJob.${job_id}.status == CANCELLED"

      - name: list_visits_filtered_by_billing_period
        claim_type: Computed read
        grounds:
          - endpoints.GET_/visits
          - entities.Visit.fields.billing_period_id
        distinguishing_aspect: "GET /visits?billing_period_id=... returns only visits captured into that period (FK reverse-reachability), confirming the billing_period_id capture is queryable."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew, ACTIVE contract, OPEN period 2026-06, one ROUTINE visit COMPLETED into the period."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-10", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${visit_id}", crew_id: "${crew_id}", clock_in_min: 540 }
              as: FieldSupervisor
              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/clock-out"
              payload: { clock_out_min: 600 }
              as: FieldSupervisor
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "GET /visits?billing_period_id=${period_id}"
              payload: {}
              as: AccountManager
          assert:
            - "HTTP status == 200"
            - "total_count == 1 (the captured visit)"
            - "the single returned visit's billing_period_id == ${period_id}"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: response_envelope_error_shape_on_validation_failure
        claim_type: Violation → Error
        grounds:
          - response_envelope.error
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An error response carries response_type='error' and data.{error_id,message} plus meta.{api_request_id,api_request_timestamp} — verifies the §1.0 error envelope shape itself."
        test_recipe:
          setup:
            - "Empty DB; an AccountManager actor."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: AccountManager
              captures: { rt: $.response_type, eid: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP status == 422"
            - "response_type == 'error'"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "data.message is a non-empty string; meta.api_request_id and meta.api_request_timestamp present"

      - name: stale_version_close_excluded
        claim_type: Violation → Error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[period-close-stale-account]
        excluded_because:
          difficulty_instance: compensating_invariant / account_version_monotonic_invariant_close_reopen_close
          rationale: "OCC version semantics on close/reopen and the monotonic Account.version invariant are the asserted outcome of the named §1.8 compensating-invariant instance; the stale-version 412 path is the failure edge of that same version contract."

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: field_supervisor_cannot_create_account_returns_forbidden
        claim_type: peer_roles
        grounds:
          - roles.AccountManager
          - roles.FieldSupervisor
          - endpoints.POST_/accounts
          - errors[ERR_FORBIDDEN]
          - validations[priority=2]
        distinguishing_aspect: "POST /accounts is AccountManager-exclusive; a FieldSupervisor calling it returns ERR_FORBIDDEN (403) — peer role cannot touch the other's exclusive op."
        test_recipe:
          setup:
            - "A FieldSupervisor actor."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_FORBIDDEN"

      - name: client_contact_cannot_create_visit_returns_forbidden
        claim_type: peer_roles
        grounds:
          - roles.ClientContact
          - roles.FieldSupervisor
          - endpoints.POST_/visits
          - errors[ERR_FORBIDDEN]
          - validations[priority=2]
        distinguishing_aspect: "POST /visits is FieldSupervisor-exclusive; a ClientContact calling it returns ERR_FORBIDDEN (403) — distinct role pair from instance one."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (contact_user_id=cc-1), AVAILABLE crew."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: ClientContact
              as_user_id: "cc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_FORBIDDEN"

      - name: client_contact_raise_complaint_wrong_site_returns_not_site_contact
        claim_type: Segregation of duties
        grounds:
          - roles.ClientContact
          - validations[priority=3]
          - errors[ERR_NOT_SITE_CONTACT]
          - entities.Site.fields.contact_user_id
        distinguishing_aspect: "A ClientContact whose X-User-ID != Site.contact_user_id raising a complaint for that site returns ERR_NOT_SITE_CONTACT (403) — ownership check, not the generic FORBIDDEN."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site whose contact_user_id is cc-1."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { site_id: "${site_id}", severity: "MINOR", description: "Not my site" }
              as: ClientContact
              as_user_id: "cc-999"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_NOT_SITE_CONTACT (cc-999 != site.contact_user_id cc-1)"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request to a business endpoint with no/unknown X-User-Role header returns ERR_UNAUTHENTICATED (401), priority-1 auth gate ahead of all role/existence checks."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /accounts"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED (no/unknown X-User-Role)"

  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_each_period_write_excluded
