            - "captured snap_status == DRAFT after a fresh tier-B report (base 60, no debits) is delivered on the ACQUIRED case"

      - name: claim_net_proceeds_deductions
        claim_type: correct_result
        grounds: [calculations.calc_death_claim_net]
        excluded_because:
          difficulty_instance: death_settlement_maturity_chain
          rationale: "Net proceeds (gross 10000000 - unpaid 50000 = 9950000) asserted literally as the failure-free path of the named difficulty instance."

      - name: variant_selection_by_portfolio_method
        claim_type: variant_selection
        grounds: [calculations.calc_policy_value]
        excluded_because:
          difficulty_instance: policy_value_prospective_vs_investment
          rationale: "Variant selection and divergence asserted by the named difficulty instance."

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no X-User-Role header fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) even when the path id does not exist (auth precedes existence)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: "", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not ERR_NOT_FOUND)"

      - name: role_not_in_endpoint_roles_unauthorized
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Underwriter calling the Broker-only POST /api/cases is rejected ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
          setup: ["broker, insured, policy exist"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Underwriter, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_FORBIDDEN_FOR_ROLE"

      - name: broker_cannot_counter_other_brokers_case
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_CASE_OWNER]"]
        distinguishing_aspect: "Ownership: broker B countering an offer on broker A's case is rejected ERR_NOT_CASE_OWNER (403) even though the offer is PENDING and the payload is well-formed."
        test_recipe:
          setup: ["TX chain to MARKETED under broker A with a PENDING offer; broker B registered"]
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
