              payload: {}
              as: Wizard
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"
            - "response status code == 401"

      - name: forbidden_role_beats_existence_on_missing_order
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A role lacking permission for the operation hitting a non-existent order id returns the priority-2 ERR_FORBIDDEN_ROLE (403), not the priority-3 404 — authorization precedes existence."
        test_recipe:
          setup:
            - "Empty DB; BillingSpecialist (not permitted to cancel) targets a non-existent order id."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
