            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W0", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { w0_id: $.data.id } }
