              as: MissionOps
              captures: { m3_id: $.data.id }
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PL50", mass_kg: 50, volume_m3: 1.0, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { ct_v: $.data.version }
          trigger:
            - call: "POST /rideshare/contracts/${ct_id}/rebook"
              payload: { to_mission_id: "${m2_id}", expected_contract_version: "${ct_v}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ct_v2: $.data.version }
            - call: "POST /rideshare/contracts/${ct_id}/rebook"
              payload: { to_mission_id: "${m3_id}", expected_contract_version: "${ct_v2}" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "rebook 1 returns 200: rebookings_remaining == 0, total_rebooking_fees_cents == 0, target_mission_id == ${m2_id}"
            - "rebook 2 returns 200: total_rebooking_fees_cents == 7500000 (25% of 30000000; 49 days falls in the 31..60 bracket)"
            - "after rebook 2, target_mission_id == ${m3_id} and rebookings_remaining == 0"
            - "LaunchContract.${ct_id}.quoted_price_cents == 30000000 throughout (rebooking never re-quotes)"

      - name: delay_flagged_rebooking_charges_no_fee_and_keeps_rights
        claim_type: Variant Selection
        grounds:
          - calculations.rebooking_fee
          - entities.LaunchContract.fields.rebook_eligible
          - calculations.delay_cascade_assessment
        distinguishing_aspect: "The rebook_eligible waiver takes precedence over rights: a contract flagged by the delay cascade rebooks to a covered mission with fee 0, rights UNTOUCHED at 1, and the flag cleared — a third fee path distinct from rights consumption and the bracketed fee."
        test_recipe:
