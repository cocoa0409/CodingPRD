          Interval semantics A on resource entity CapacityBlock: for a CENTER_BASED provider the
          block interval is treated as half-open and NON-exclusive, so two reservations whose windows
          merely touch (09:00-12:00 and 12:00-15:00) both count toward reserved_slots, and admission
          compares only the seat SUM against total_slots. Different interval semantics and a
