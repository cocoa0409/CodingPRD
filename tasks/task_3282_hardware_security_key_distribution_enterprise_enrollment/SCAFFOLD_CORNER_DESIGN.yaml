          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Imm Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgi1: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-I1", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgi1}/subscriptions"
              payload: { tier: "BASIC", refresh_interval_days: 30, replacement_credits_total: 50, coverage_cents_total: 200 }
              as: ProcurementAdmin
              as_user_id: "proca1"
            - call: "POST /v1/organizations/${orgi1}/purchase-orders"
              payload: { lines: [{ model_code: "M-I1", quantity: 1 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { poi1: $.data.id, poi1_v: $.data.version }
          trigger:
            - call: "POST /v1/organizations/${orgi1}/purchase-orders/${poi1}/approve"
              payload: { expected_purchase_order_version: "${poi1_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { poi1_st: $.data.status, poi1_final: $.data.final_total_cents }
            - call: "GET /v1/organizations/${orgi1}/subscriptions"
              payload: {}
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { subi1_cov: "$.data[0].coverage_cents_remaining", subi1_used: "$.data[0].credits_used" }
          assert:
            - "poi1_st == APPROVED and poi1_final == 0 (coverage 100 fully covers base 100)"
            - "subi1_cov == 100 and subi1_used == 1 (visible immediately after the same request)"

  # ===========================================================================
  # Section: errors (domain-critical phishable-path rule)
  # ===========================================================================
  - section: errors
    instances:
      - name: totp_grant_forbidden_under_phishing_resistant_policy
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_PHISHABLE_PATH_FORBIDDEN]"]
        distinguishing_aspect: "TOTP temporary access is a phishable recovery path: forbidden for PHISHING_RESISTANT orgs (422), allowed for STANDARD orgs."
        test_recipe:
          setup: ["ORG_HP (PHISHING_RESISTANT) with account ACCT_HP; ORG_HS (STANDARD) with account ACCT_HS"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "HP Org", assurance_tier: "STANDARD", authentication_policy: "PHISHING_RESISTANT", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orghp: $.data.id }
            - call: "POST /v1/organizations"
              payload: { legal_name: "HS Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orghs: $.data.id }
            - call: "POST /v1/organizations/${orghp}/employees"
              payload: { employee_ref: "E-HP", location: "HQ", directory_user_id: "u-hp" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { accthp: $.data.identity_account_id }
            - call: "POST /v1/organizations/${orghs}/employees"
              payload: { employee_ref: "E-HS", location: "HQ", directory_user_id: "u-hs" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { accths: $.data.identity_account_id }
          trigger:
            - call: "POST /v1/identity-accounts/${accthp}/temporary-access"
              payload: { method: "TOTP", duration_hours: 4 }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { err_hp: $.data.error_id }
            - call: "POST /v1/identity-accounts/${accths}/temporary-access"
              payload: { method: "TOTP", duration_hours: 4 }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { g_hs: $.data.status }
          assert:
            - "err_hp == ERR_PHISHABLE_PATH_FORBIDDEN"
            - "g_hs == ACTIVE (TOTP allowed under STANDARD policy)"

      - name: high_assurance_attestation_requires_supply_chain_cert
        claim_type: conditional_validation
        grounds: ["validations[priority=7]", "state_machines.SecurityKey"]
        distinguishing_aspect: "HIGH_ASSURANCE org: attesting a key whose order shipped without a supply-chain cert is impossible (ship itself demands the cert); conversely a STANDARD org key attests with no cert. Verified end-to-end: HA ship without cert -> ERR_PHISHABLE_PATH_FORBIDDEN; HA ship with cert -> IN_TRANSIT."
        test_recipe:
          setup: ["ORG_HA (HIGH_ASSURANCE, approved firmware ['5.4.3']); KeyModel M-HA; two APPROVED orders PO_HA1 and PO_HA2"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "HA2 Org", assurance_tier: "HIGH_ASSURANCE", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], approved_firmware_versions: ["5.4.3"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgha: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-HA", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgha}/purchase-orders"
              payload: { lines: [{ model_code: "M-HA", quantity: 1 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { poha1: $.data.id, poha1_v: $.data.version }
            - call: "POST /v1/organizations/${orgha}/purchase-orders/${poha1}/approve"
              payload: { expected_purchase_order_version: "${poha1_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgha}/purchase-orders"
              payload: { lines: [{ model_code: "M-HA", quantity: 1 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { poha2: $.data.id, poha2_v: $.data.version }
            - call: "POST /v1/organizations/${orgha}/purchase-orders/${poha2}/approve"
              payload: { expected_purchase_order_version: "${poha2_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
          trigger:
            - call: "POST /v1/organizations/${orgha}/purchase-orders/${poha1}/ship"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { err_ha: $.data.error_id }
            - call: "POST /v1/organizations/${orgha}/purchase-orders/${poha2}/ship"
              payload: { supply_chain_cert_id: "SCC-2026-001" }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { poha2_st: $.data.status, poha2_cert: $.data.supply_chain_cert_id }
          assert:
            - "err_ha == ERR_PHISHABLE_PATH_FORBIDDEN (HIGH_ASSURANCE ship without cert)"
            - "poha2_st == IN_TRANSIT and poha2_cert == SCC-2026-001"

      - name: attestation_failure_auto_quarantines_high_assurance_order
        claim_type: cascade_side_effect
        grounds: ["state_machines.SecurityKey", "state_machines.PurchaseOrder.RECEIVED_to_QUARANTINED"]
        distinguishing_aspect: "HIGH_ASSURANCE attestation of unapproved firmware fails the key AND auto-quarantines its RECEIVED order (cascade), revoking all keys of the order."
        test_recipe:
          setup: ["ORG_QA (HIGH_ASSURANCE, approved firmware ['5.4.3']); KeyModel M-QA; order PO_QA driven to RECEIVED (shipped with cert SCC-OK) with two PRE_REGISTERED keys, one carrying firmware 9.9.9 (unapproved)"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "QA Org", assurance_tier: "HIGH_ASSURANCE", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], approved_firmware_versions: ["5.4.3"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgqa: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-QA", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgqa}/purchase-orders"
              payload: { lines: [{ model_code: "M-QA", quantity: 2 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { poqa: $.data.id, poqa_v: $.data.version }
            - call: "POST /v1/organizations/${orgqa}/purchase-orders/${poqa}/approve"
              payload: { expected_purchase_order_version: "${poqa_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgqa}/purchase-orders/${poqa}/ship"
              payload: { supply_chain_cert_id: "SCC-OK" }
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgqa}/purchase-orders/${poqa}/receive"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgqa}/purchase-orders/${poqa}/keys"
              payload: { keys: [{ serial_number: "QA-1", firmware_version: "5.4.3" }, { serial_number: "QA-2", firmware_version: "9.9.9" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { kqa1: "$.data[0].id", kqa2: "$.data[1].id" }
          trigger:
            - call: "POST /v1/organizations/${orgqa}/security-keys/${kqa2}/attest"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { kqa2_att: $.data.attestation_status }
            - call: "GET /v1/organizations/${orgqa}/purchase-orders"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { poqa_st: "$.data[0].status" }
            - call: "GET /v1/organizations/${orgqa}/security-keys"
              payload: { purchase_order_id: "${poqa}" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { kqa1_hw: "$.data[0].hardware_status", kqa2_hw: "$.data[1].hardware_status" }
          assert:
            - "kqa2_att == FAILED (unapproved firmware)"
            - "poqa_st == QUARANTINED (auto-quarantine cascade)"
            - "kqa1_hw == REVOKED and kqa2_hw == REVOKED (whole order revoked)"

  # ===========================================================================
  # Corners already exercised by §1.8 instances (stubs, no test_recipe)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_enrollment_cycle_edges
        claim_type: valid_transition
        grounds: ["state_machines.EnrollmentCeremony"]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / enrollment_expiring_active_cycle_once_per_period"
          rationale: "The EXPIRING -> ACTIVE cyclic edge, its once-per-period cap, and the sweep-driven ACTIVE -> EXPIRING edge are asserted there."
      - name: corner_quarantine_cascade_edges
        claim_type: cascade_side_effect
        grounds: ["state_machines.PurchaseOrder.RECEIVED_to_QUARANTINED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / quarantine_cascades_order_key_enrollment_account"
          rationale: "Full depth-4 quarantine cascade asserted there."

  - section: calculations
    instances:
      - name: corner_dual_variant_totals
        claim_type: variant_divergence
        grounds: ["calculations.purchase_order_total", "calculations.backup_key_compliance"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / purchase_order_provisional_vs_final_total"
          rationale: "Both dual-variant calculations asserted with exact literals in §1.8."
      - name: corner_boundary_tier_and_grant_expiry
        claim_type: boundary_condition
        grounds: ["calculations.purchase_order_total", "calculations.temporary_access_expiry"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / volume_tier_boundary_49_vs_50_units"
          rationale: "Tier boundary 49/50 and grant expiry at exactly expires_at asserted in §1.8."

  - section: validations
    instances:
      - name: corner_priority_pairs
        claim_type: priority_ordering
        grounds: ["validations"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / ship_in_wrong_state_and_missing_cert_state_wins"
          rationale: "Both dual-failure priority pairs asserted in §1.8."

  - section: cross_cutting_layers
    instances:
      - name: corner_occ_purchase_order
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[purchase-approve-stale-order]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / activate_with_stale_version_and_bad_protocol_state_occ_wins"
          rationale: "OCC stale-version mechanics asserted for both OCC endpoints across §1.8 instances and the enrollment-side corner occ_stale_version_on_enrollment_activation."

