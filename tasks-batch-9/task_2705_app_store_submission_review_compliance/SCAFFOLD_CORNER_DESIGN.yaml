            - "Submission.${sub_id}.state == PRE_REVIEW_PASSED and review_window_id is null"

      - name: aggregate_pool_capacity_of_exactly_ten_passes_and_eleven_is_refused
        claim_type: Constants Applied
        grounds:
          - calculations.review_pool_concurrency.formula
          - calculations.review_pool_concurrency.constants.POOL_MAX_CONCURRENT_SLOTS
          - errors.ERR_REVIEW_POOL_OVERSUBSCRIBED
        distinguishing_aspect: "Overlap is legal but aggregate slots are capped: a second overlapping POOL_A window of 5 slots brings the total to exactly 10 and is created, while a third window of even 1 slot would make 11 and is refused with ERR_REVIEW_POOL_OVERSUBSCRIBED."
