  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_witness_segregation
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.Box.IN_DESTRUCTION_to_DESTROYED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WITNESS_SEGREGATION]
        distinguishing_aspect: |
          Category pair (state, business_safety): a destruction-certificate
          POST on a box still in AWAITING_DISPOSITION (state violation) that
          ALSO names the recorder as witness (safety violation) MUST return
          ERR_INVALID_STATE (409, priority 5), not ERR_WITNESS_SEGREGATION
          (422, priority 6).
        test_recipe:
          setup:
            - "Client + agreement (retention_days 5); batch with one shelved box and one 100-page document, delivered at 2026-05-10"
            - "Clock advanced to 2026-05-15 -> sweep moves the box to AWAITING_DISPOSITION (NOT yet IN_DESTRUCTION)"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Prio One", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 5, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /shelf-slots", payload: { shelf_code: "SH-G1", zone: "GENERAL", capacity_grams: 2000 }, as: PlatformAdmin, captures: { slot: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "CONTRACT", pages: 100, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/pass-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /documents/${d1}/index-records", payload: { metadata_json: { title: "T1", record_date: "2026-01-01", subject: "S1" }, ocr_text_ref: "ocr://t1" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /batches/${bid}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /boxes/${box1}/destruction-certificates", payload: { witness_user_id: "ds-1", method: "SHRED" }, as: DestructionSpecialist, as_user_id: "ds-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE  (box not IN_DESTRUCTION; priority 5 state beats priority 6 business_safety)"
            - "http status == 409, not 422"
            - "Box.${box1}.status remains AWAITING_DISPOSITION; no DestructionCertificate created"

      - name: vault_zone_safety_beats_shelf_capacity
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_VAULT_ZONE_REQUIRED]
          - errors[ERR_SHELF_OVER_CAPACITY]
        distinguishing_aspect: |
          Category pair (business_safety, business_constraint) — different
          pair from (state, business_safety): shelving a PHI box of a HIPAA
          client onto a GENERAL slot that is ALSO over capacity MUST return
          ERR_VAULT_ZONE_REQUIRED (422, priority 8), not ERR_SHELF_OVER_CAPACITY
          (409, priority 11).
        test_recipe:
          setup:
            - "HIPAA client (hipaa_covered true) + agreement; batch INTAKE with one box (600g) containing a PHI document"
            - "GENERAL shelf slot with capacity_grams 100 (both vault-zone and capacity rules would fail)"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "HIPAA Clinic", hipaa_covered: true }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /shelf-slots", payload: { shelf_code: "SH-TINY", zone: "GENERAL", capacity_grams: 100 }, as: PlatformAdmin, captures: { slot: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "MEDICAL_RECORD", pages: 40, contains_phi: true, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /boxes/${box1}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VAULT_ZONE_REQUIRED  (priority 8 business_safety beats priority 11 business_constraint)"
            - "http status == 422, not 409"
            - "Box.${box1}.status remains RECEIVED; ShelfSlot.${slot}.occupied_weight_grams == 0"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: rush_admission_boundary_at_limit
        grounds:
          - calculations.rush_capacity_window
          - errors[ERR_RUSH_CAPACITY_FULL]
        distinguishing_aspect: |
          Boundary on the rush-admission metric via POST /batches: admission
          succeeds while admitted_rush < 3, so the 3rd RUSH batch (bringing the
          count to exactly 3) is admitted and the 4th is rejected — the
          >= comparison at the limit is the pinned behavior.
        test_recipe:
          setup:
            - "Client + STANDARD agreement; zero existing batches (admitted_rush = 0)"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Rush Bound", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "RUSH" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { b1: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "RUSH" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { b2: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "RUSH" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { b3: $.data.id } }
          trigger:
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "RUSH" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bstd: $.data.id } }
          assert:
            - "batches b1, b2, b3 all created (admitted_rush was 0, 1, 2 — all < 3)"
            - "4th RUSH create: ${err} == ERR_RUSH_CAPACITY_FULL (admitted_rush 3 >= 3)"
            - "STANDARD batch ${bstd} still created — the window never counts or blocks STANDARD priority"

      - name: shelf_capacity_equality_admitted_over_by_one_rejected
        grounds:
          - state_machines.Box.RECEIVED_to_STORED
          - entities.ShelfSlot.fields.occupied_weight_grams
          - errors[ERR_SHELF_OVER_CAPACITY]
        distinguishing_aspect: |
          Boundary on the shelf-weight metric via POST
          /boxes/{id}/shelf-assignments (different metric and endpoint from
          rush admission): occupied 400 + box 600 == capacity 1000 is ADMITTED
          (reject only when the sum is strictly greater), while adding a 1-gram
          box on top (1001 > 1000) is rejected.
        test_recipe:
          setup:
            - "Client + agreement (max_boxes 5); batch INTAKE with boxes A (400g), B (600g), C (1g)"
            - "GENERAL shelf slot capacity_grams 1000"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Shelf Bound", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /shelf-slots", payload: { shelf_code: "SH-EQ", zone: "GENERAL", capacity_grams: 1000 }, as: PlatformAdmin, captures: { slot: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-A", intake_weight_grams: 400 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { boxA: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-B", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { boxB: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-C", intake_weight_grams: 1 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { boxC: $.data.id } }
            - { call: "POST /boxes/${boxA}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /boxes/${boxB}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "GET /shelf-slots/${slot}", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { occ: $.data.occupied_weight_grams } }
            - { call: "POST /boxes/${boxC}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
          assert:
            - "Box B admitted at exact equality: ${occ} == 1000 (400 + 600, >= semantics admit equality)"
            - "Box C (1 gram over): ${err} == ERR_SHELF_OVER_CAPACITY (1001 > 1000)"
            - "Box.${boxA}.status == STORED and Box.${boxB}.status == STORED; Box.${boxC}.status remains RECEIVED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: scan_session_gated_by_batch_state
        grounds:
          - state_machines.ScanSession
          - state_machines.Batch.SCANNING_to_QA
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair ScanSession x Batch: opening or committing a scan session
          is gated on the parent Batch being in SCANNING; after the batch
          advances to QA, a new session open on the same scanner is rejected
          with ERR_INVALID_STATE even though the scanner itself is free.
        test_recipe:
          setup:
            - "Client + agreement; batch with one 100-page document scanned and committed; batch advanced to QA (session committed, so submit-qa passes)"
          setup_api_calls:
