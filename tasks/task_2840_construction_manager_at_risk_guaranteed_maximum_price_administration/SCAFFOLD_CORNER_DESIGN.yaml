  # ===================================================================
  # §1.7 declares five roles under role_model segregation_of_duties. This section walks
  # the two Table-7 bullets (each role can perform its own exclusive + shared operations;
  # each role is denied every other role's exclusive operations) and the
  # "Segregation of duties" role-model row. The unauthenticated / unauthorized /
  # invalid-request precedence ladder is already asserted by the §1.9 validations-section
  # instance error_precedence_unauthenticated_then_unauthorized_then_invalid_request.
  - section: rbac
    instances:
      - name: every_role_can_perform_its_own_exclusive_operations
        claim_type: role_permitted_operations
        grounds:
          - roles.ProgramAdmin
          - roles.ConstructionManager
          - roles.ProcurementOfficer
          - roles.OwnerRepresentative
          - roles.IndependentAuditor
        distinguishing_aspect: |
          All five roles are load-bearing: no single actor can drive a project from registration to
          audit. This instance walks one exclusive operation per role in the order the workflow
          demands them and shows each succeeding, which is the positive half of the RBAC matrix and
          the precondition for every denial claim being meaningful rather than vacuous.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z, advanced to 2026-08-15T00:00:00Z"
