      - name: budget_creation_depends_on_the_referenced_soil_test_row
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=34]
          - validations[priority=40]
          - errors.ERR_NO_VALID_SOIL_TEST
          - errors.ERR_ZERO_ALLOWABLE_RATE
          - calculations.soil_test_p_index
        distinguishing_aspect: |
          Three budgets differ only in soil_test_id. A VERY_HIGH index zeroes the phosphorus
          multiplier and the whole budget collapses to a zero rate (priority 40); a test sampled
          in 2021 is stale under the 4-year window (priority 34, which precedes 40); the MEDIUM
          test yields the canonical 10800 gal/acre budget.
        test_recipe:
          setup:
            - "Willow Creek Dairy with a COVERED permit, a DRAFT 2026 plan and field North 40 at slope 4.0"
            - "Three soil tests on that field: 42 ppm sampled 2026-03-15, 100 ppm sampled 2026-03-15, and 42 ppm sampled 2021-06-01"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
