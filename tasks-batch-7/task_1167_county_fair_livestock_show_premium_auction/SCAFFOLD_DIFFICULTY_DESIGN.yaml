  - rule_id: compensating_invariant
    instances:
      - name: premium_pool_conserved_across_accrue_and_void
        grounds:
          - calculations.premium_pool_reconciliation
          - state_machines.PremiumAward.ACCRUED_to_FORFEITED
          - entities.Fair.fields.available_premium_pool_cents
        distinguishing_aspect: |
          Conserved quantity: premium budget cents. Forward action (placing accrues
          12000, pool 100000 -> 88000) paired with its compensating action (placing
          void forfeits the award, pool 88000 -> 100000) leaves
          budget == available_pool + outstanding_reservations exactly invariant.
        test_recipe:
          setup:
            - "Fair budget 100000 in SHOWING; steer entry placed rank 1 (class size 1, large_class_min_entries 8 so no bonus); award ACCRUED 12000"
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair R9A", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, large_class_min_entries: 8, large_class_bonus_rate: 0.10, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_OPEN }, as: FairBoardAdmin }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ann A", organization: FFA }, as: FairBoardAdmin, captures: { exh_a: $.data.id } }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_STEER, tag_number: "S-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}", captures: { entry_a: $.data.id } }
            - { call: "POST /v1/entries/${entry_a}/verify", payload: { decision: APPROVE }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_LOCKED }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: WEIGH_IN }, as: FairBoardAdmin }
            - { call: "GET /v1/entries/${entry_a}", as: FairBoardAdmin, captures: { ev1: $.data.version } }
            - { call: "POST /v1/weigh-tickets", payload: { entry_id: "${entry_a}", weight_lbs: 1200, weighed_at: "2026-07-01T10:00:00Z", expected_entry_version: "${ev1}" }, as: WeighMaster }
            - { call: "POST /v1/classes", payload: { fair_id: "${fair_id}", species: MARKET_STEER, class_code: "STEER-A", weight_min_lbs: 1000, weight_max_lbs: 1500, capacity: 5 }, as: FairBoardAdmin, captures: { class_a: $.data.id } }
            - { call: "POST /v1/entries/${entry_a}/classify", payload: { class_id: "${class_a}" }, as: ShowClerk }
            - { call: "POST /v1/judges", payload: { fair_id: "${fair_id}", full_name: "Judge Jo", qualified_species: [MARKET_STEER] }, as: FairBoardAdmin, captures: { judge_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: SHOWING }, as: FairBoardAdmin }
            - { call: "POST /v1/ring-slots", payload: { fair_id: "${fair_id}", class_id: "${class_a}", ring_name: "MAIN", starts_at: "2026-07-10T09:00:00Z", ends_at: "2026-07-10T10:00:00Z" }, as: ShowClerk, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /v1/ring-slots/${slot_id}/assign-judge", payload: { judge_id: "${judge_id}", expected_ring_slot_version: "${slot_v}" }, as: ShowClerk }
            - { call: "POST /v1/ring-slots/${slot_id}/start", as: ShowClerk }
          trigger:
            - { call: "POST /v1/ring-slots/${slot_id}/placings", payload: { placings: [ { entry_id: "${entry_a}", rank: 1, award: NONE } ] }, as: Judge, as_user_id: "${judge_id}" }
            - { call: "GET /v1/fairs/${fair_id}", as: FairBoardAdmin, captures: { pool_after_accrue: $.data.available_premium_pool_cents } }
            - { call: "GET /v1/placings?entry_id=${entry_a}", as: FairBoardAdmin, captures: { placing_id: "$.data[0].id" } }
            - { call: "POST /v1/placings/${placing_id}/void", payload: { reason: "misheard tag" }, as: Judge, as_user_id: "${judge_id}" }
            - { call: "GET /v1/fairs/${fair_id}", as: FairBoardAdmin, captures: { pool_after_void: $.data.available_premium_pool_cents } }
            - { call: "GET /v1/premium-awards?entry_id=${entry_a}", as: FairBoardAdmin, captures: { aw_status: "$.data[0].status" } }
          assert:
            - "After accrual: available_premium_pool_cents == 88000 (100000 - 12000)"
            - "After void: available_premium_pool_cents == 100000 (compensation returns the reservation; budget invariant holds)"
            - "PremiumAward.status == FORFEITED"
