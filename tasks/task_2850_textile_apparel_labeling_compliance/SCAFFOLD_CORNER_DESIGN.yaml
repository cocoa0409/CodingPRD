            - "${h1_after} == \"WITHDRAWN\" and ${h1_reason} == \"AUTO_PARENT_WITHDRAWN\" - the child records the cascade literal, not the operator note"
            - "Second withdrawal: HTTP 409 and ${e_terminal} == \"ERR_LABEL_STATE_INVALID\" at priority 45, because WITHDRAWN is terminal"
            - "Republish of the sibling: HTTP 200 with ${l2_after} == \"PUBLISHED\" and ${l2_from} == \"2026-08-01T00:00:00Z\" - the identical window is now free"
            - "The WITHDRAWN listing returns total_count == 2, covering both the parent and its cascaded hangtag"

  - section: errors
    instances:
      - name: every_unknown_id_returns_its_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BRAND_NOT_FOUND
          - errors.ERR_STYLE_NOT_FOUND
          - errors.ERR_MATERIAL_INPUT_NOT_FOUND
          - errors.ERR_LAB_TEST_NOT_FOUND
          - errors.ERR_ORIGIN_DETERMINATION_NOT_FOUND
          - errors.ERR_LABEL_SPEC_NOT_FOUND
          - errors.ERR_IMPORT_SHIPMENT_NOT_FOUND
          - errors.ERR_COMPLIANCE_AUDIT_NOT_FOUND
          - errors.ERR_AUDIT_FINDING_NOT_FOUND
          - errors.ERR_MARKET_REQUIREMENT_NOT_FOUND
        distinguishing_aspect: "Each of the ten 404s is raised by the entity that owns the unresolved id, never by a generic catch-all: the same well-formed UUID produces a different error_id on each path, and the market 404 is raised from a body value rather than a path segment, because MarketRequirement is addressed only by code."
        test_recipe:
          setup:
            - "No rows of any kind exist except one brand, which is needed only to prove the style create fails on the market code rather than on the brand."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
          trigger:
            - call: "GET /labeling/brands/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { e_brand: $.data.error_id }
            - call: "GET /labeling/styles/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { e_style: $.data.error_id }
            - call: "GET /labeling/material-inputs/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { e_input: $.data.error_id }
            - call: "GET /labeling/lab-tests/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { e_test: $.data.error_id }
            - call: "GET /labeling/origin-determinations/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { e_origin: $.data.error_id }
            - call: "GET /labeling/label-specs/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { e_label: $.data.error_id }
            - call: "GET /labeling/import-shipments/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { e_ship: $.data.error_id }
            - call: "GET /labeling/compliance-audits/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { e_audit: $.data.error_id }
            - call: "GET /labeling/audit-findings/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { e_finding: $.data.error_id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-ZZ-1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["ZZ"], net_weight_grams: 320.0 }
              as: ComplianceAdmin
              captures: { e_market: $.data.error_id }
          assert:
            - "All ten calls return HTTP 404"
            - "${e_brand} == \"ERR_BRAND_NOT_FOUND\", ${e_style} == \"ERR_STYLE_NOT_FOUND\", ${e_input} == \"ERR_MATERIAL_INPUT_NOT_FOUND\", ${e_test} == \"ERR_LAB_TEST_NOT_FOUND\", ${e_origin} == \"ERR_ORIGIN_DETERMINATION_NOT_FOUND\""
            - "${e_label} == \"ERR_LABEL_SPEC_NOT_FOUND\", ${e_ship} == \"ERR_IMPORT_SHIPMENT_NOT_FOUND\", ${e_audit} == \"ERR_COMPLIANCE_AUDIT_NOT_FOUND\", ${e_finding} == \"ERR_AUDIT_FINDING_NOT_FOUND\""
            - "${e_market} == \"ERR_MARKET_REQUIREMENT_NOT_FOUND\" - the unregistered market code in target_market_codes is a 404, not a 422"
            - "No style row is created by the last call: GET /labeling/brands/${brand_id}/styles returns total_count == 0"

      - name: a_missing_or_unknown_role_header_is_unauthenticated_before_any_other_check
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=10]
        distinguishing_aspect: "Priority 10 answers first, so a request with no X-User-Role, no X-User-ID or a role string outside the seven declared roles is 401 even when the path id does not exist and the body is malformed - the authentication gate never leaks a 404 or a 400."
        test_recipe:
          setup:
            - "No rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /labeling/brands/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: "(request sent with no X-User-Role header)"
              captures: { e_norole: $.data.error_id }
            - call: "GET /labeling/brands/2f1a9b7c-0000-4000-8000-000000000000"
              payload: {}
              as: "(request sent with X-User-Role: ComplianceAdmin but a blank X-User-ID)"
              captures: { e_nouser: $.data.error_id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "2f1a9b7c-0000-4000-8000-000000000000", style_code: "NL-X", product_class: "NOT_A_CLASS", target_market_codes: [], net_weight_grams: -1.0 }
              as: "(request sent with X-User-Role: SuperUser, which is not one of the seven declared roles)"
              captures: { e_badrole: $.data.error_id }
          assert:
            - "All three calls return HTTP 401 with ${e_norole} == ${e_nouser} == ${e_badrole} == \"ERR_UNAUTHENTICATED\""
            - "The third call is 401 rather than 400 or 404, even though its brand_id is unknown and product_class, target_market_codes and net_weight_grams are all invalid"

      - name: a_brand_admin_cannot_touch_a_style_of_another_brand
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BRAND_SCOPE_VIOLATION
          - validations[priority=25]
        distinguishing_aspect: "Brand scoping is resolved through the resource's brand chain, not through a body field: the intruding BrandAdmin is a perfectly valid actor for the endpoint and supplies a well-formed body, yet both a read of the foreign style and a write beneath it are 403 - while the owning BrandAdmin succeeds on the identical call."
        test_recipe:
          setup:
            - "Market US is registered. Brand B1 owns style NL-4410; brand B2 owns nothing."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /labeling/brands"
              payload: { legal_name: "Harborline Brands Inc", party_type: "BRAND_OWNER", rn_number: "RN67890", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${b1_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${b1_id}"
              captures: { style_id: $.data.id }
          trigger:
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${b2_id}"
              captures: { e_write: $.data.error_id }
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: BrandAdmin
              as_user_id: "${b2_id}"
              captures: { e_read: $.data.error_id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${b1_id}", style_code: "NL-9999", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0 }
              as: BrandAdmin
              as_user_id: "${b2_id}"
              captures: { e_create: $.data.error_id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${b1_id}"
              captures: { ok_id: $.data.id }
          assert:
            - "The first three calls return HTTP 403 with ${e_write} == ${e_read} == ${e_create} == \"ERR_BRAND_SCOPE_VIOLATION\""
            - "The third call proves scoping also covers a brand_id supplied in the body, not only one reached through a path id"
            - "The fourth call returns HTTP 201 with a non-null ${ok_id} - the same request from the owning brand is accepted"
            - "GET /labeling/material-inputs?style_id=${style_id} returns total_count == 1"

      - name: duplicate_market_code_style_code_entry_number_reservation_and_finding_are_all_rejected
        claim_type: error_triggerable
        grounds:
