            - "SubscriptionTerm.${term_id}.credit_equivalency_earned == 2"

      - name: integrity_void_cascade
        grounds:
          - state_machines.IntegrityCase.UNDER_INVESTIGATION_to_SUBSTANTIATED
          - state_machines.AssessmentAttempt.SCORED_MASTERED_to_VOIDED
          - state_machines.TranscriptRecord.ISSUED_to_VOIDED
          - state_machines.AidDisbursement.SCHEDULED_to_HELD
          - entities.Student.fields.integrity_strike_count
