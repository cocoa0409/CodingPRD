        grounds:
          - validations.priority_26
          - calculations.furnace_posture_derivation
          - entities.Furnace.fields.posture
          - errors.ERR_OVER_PULL_LIMIT
        distinguishing_aspect: |
          On a RESTRICTED furnace (refractory_remaining_pct 14.29 <= 15.00) the ceiling tightens from
          345.00 to design pull itself: 310.00 tpd is refused although it is well under 1.15 x 300.00, while
          300.00 tpd is accepted.
