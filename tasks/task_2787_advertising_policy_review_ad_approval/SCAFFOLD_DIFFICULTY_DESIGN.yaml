            - "Exactly 2 ViolationLedgerEntry rows exist for the advertiser, with contiguous entry_index 1 and 2"

      - name: cloaking_destination_check_cascades_five_hops_from_an_auto_approved_creative
        grounds:
          - calculations.destination_check_result
          - state_machines.AdCreative.destination_status.DESTINATION_CLEARED_to_CLOAKING_CONFIRMED
          - state_machines.AdCreative.review_status.AUTO_APPROVED_to_DISAPPROVED
          - calculations.disapproval_points_assessment
          - calculations.enforcement_severity_index
          - calculations.serving_eligibility_gate
        distinguishing_aspect: |
          Depth 5 from a completely different triggering transition than the manual-review
          cascade: a POST of a USER-agent destination check. (1) UA divergence against the
          stored CRAWLER check sets destination_status to CLOAKING_CONFIRMED, (2) that write
          forces review_status from AUTO_APPROVED to DISAPPROVED and mints a system notice
          whose only assessment line is the CLOAKING integrity line, (3) the notice writes
          a ledger entry, (4) the ledger entry recomputes the advertiser, (5) the recomputed
          severity_index 27.50 mints a RESTRICTION and re-derives account_status. The
          creative reaches this from AUTO_APPROVED with zero human review, and its
          risk_score_final jumps from 0.00 to 40.00 purely from the destination penalty.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 8.00, requires_certification true, requires_disclaimer true, auto 0.85, manual 0.40, sla 72, default_queue REGULATED_CERT) with a US override ALLOWED_WITH_DISCLAIMER, severity_multiplier 1.20."
            - "One advertiser with both verification axes VERIFIED so screening can reach AUTO_APPROVED."
            - "One creative declaring FIN_CREDIT, targeting US only, display_url host www.summitcredit.example, political_flag false."
            - "The creative is submitted and screened with FIN_CREDIT at confidence 0.30, which is below the manual threshold, so the run outcome is AUTO_APPROVED with no ReviewTask and risk_score_provisional 0.00."
            - "A first destination check with user_agent_variant CRAWLER resolves to CLEARED, moving destination_status to DESTINATION_CLEARED and making the creative serving_eligible."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 8.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.85, confidence_manual_threshold: 0.40, review_sla_hours: 72, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${fin_id}/country-overrides"
              payload: { country_code: "US", disposition: "ALLOWED_WITH_DISCLAIMER", severity_multiplier: 1.20 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Summit Credit Partners", country_code: "US", industry_code: "CONSUMER_CREDIT" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED", evidence_ref: "kyc-2026-0044" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED", evidence_ref: "reg-2026-0044" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Balance transfer offer", body_text: "Move your balance and pay no fee for twelve months.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.summitcredit.example/transfer", display_url: "https://www.summitcredit.example/transfer", disclaimer_text: "APR 12.9%-27.9%. Terms apply." }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.30, matched_snippet: "balance transfer" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
              captures: { run_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "INITIAL", user_agent_variant: "CRAWLER", fetched_final_url: "https://www.summitcredit.example/transfer", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk_crawler_id: "$.data.id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "RECHECK", user_agent_variant: "USER", fetched_final_url: "https://payday-offers.example/win", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk_user_id: "$.data.id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { notice_id: "$.data[0].id" }
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}/violation-ledger-entries"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
              captures: { act_id: "$.data[0].id" }
          assert:
            - "Before the trigger: ScreeningRun.${run_id}.outcome == AUTO_APPROVED, provisional_risk_score == 0.00, zero ReviewTask rows exist for the creative"
            - "Before the trigger: DestinationCheck.${chk_crawler_id}.result == CLEARED, AdCreative.${cr_id}.destination_status == DESTINATION_CLEARED, review_status == AUTO_APPROVED, serving_eligible == true"
            - "DestinationCheck.${chk_user_id}.result == CLOAKING and mismatch_detail == UA_DIVERGENCE"
            - "Hop 1: AdCreative.${cr_id}.destination_status == CLOAKING_CONFIRMED"
            - "Hop 2: AdCreative.${cr_id}.review_status == DISAPPROVED and DisapprovalNotice.${notice_id}.reason_codes == [CLOAKING] with decided_by_reviewer_id == null"
            - "Hop 2: DisapprovalNotice.${notice_id}.assessment_lines has exactly 1 element, { policy_rule_code: null, reason_code: CLOAKING, line_points: 24.00 }, because the 0.30 classifier row was BELOW_THRESHOLD and contributes no finding line"
            - "Hop 2: DisapprovalNotice.${notice_id}.assessed_points == 24.00 and appeal_deadline_at == 2026-08-04T00:00:00Z"
            - "Hop 3: exactly 1 ViolationLedgerEntry exists with reason DISAPPROVAL_ASSESSED, delta_points == 24.00, balance_after == 24.00, entry_index == 1"
            - "Hop 4: Advertiser.${adv_id}.violation_points_raw == 24.00, violation_points_decayed == 24.00, severity_index == 27.50"
            - "Hop 5: EnforcementAction.${act_id}.action_type == RESTRICTION, origin == SYSTEM_CASCADE, status == ACTIVE, source_notice_id == ${notice_id}, effective_until == 2026-09-30T00:00:00Z"
            - "Hop 5: Advertiser.${adv_id}.account_status == RESTRICTED"
            - "AdCreative.${cr_id}.risk_score_final == 40.00 (0.00 provisional plus the 40.00 cloaking penalty) while risk_score_provisional stays 0.00"
            - "AdCreative.${cr_id}.serving_eligible == false and blocking_reason_codes == [REVIEW_NOT_APPROVED, DESTINATION_NOT_CLEARED, ACCOUNT_ENFORCEMENT] in exactly that order"

