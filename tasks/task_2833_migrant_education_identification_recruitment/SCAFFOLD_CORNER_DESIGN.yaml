# ===========================================================================
# 1.9 Scaffold Corner Design (Breadth Claim Index)
#
# Walk of references/claim-extraction-guide.md's nine sections against this
# scaffold's 1.1-1.7 surface. Every `section:` value is one of the guide's nine
# section names and every `claim_type:` value is a row of that section's table -
# no invented categories.
#
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# `excluded_because:` stubs naming the covering 1.8 instance, with no
# test_recipe. All other instances carry a fully executable chain.
#
# The logical clock starts at 2026-08-01T00:00:00Z on every server start; any
# instance depending on another instant sets it with
# POST /mep/_clock/set_current_utc.
# ===========================================================================

scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: corner_area_creation_returns_every_declared_field_with_defaults
        claim_type: Creation
        grounds:
          - entities.AgriculturalArea
          - endpoints[POST /mep/areas]
          - response_envelope
        distinguishing_aspect: "POST /mep/areas with only the required fields returns 201, an envelope with meta.api_request_id and response_type object, and a data object carrying every declared AgriculturalArea field including recruiter_capacity 1, status OPEN and assigned_primary_slots_used 0."
        test_recipe:
          setup:
            - "empty database, logical clock at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls: []
          trigger:
            - call: "POST /mep/areas"
              payload: { name: "Delta Row Crops", state_code: "CA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-05-15", peak_season_end_date: "2026-09-15" }
              as: StateProgramAdmin
              captures: { area_id: $.data.id, area_v: $.data.version }
          assert:
            - "HTTP status is 201"
            - "the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "AgriculturalArea.${area_id}.name == 'Delta Row Crops', state_code == 'CA', primary_activity == AGRICULTURE"
            - "AgriculturalArea.${area_id}.peak_season_start_date == 2026-05-15 and peak_season_end_date == 2026-09-15"
            - "AgriculturalArea.${area_id}.recruiter_capacity == 1 (declared default), status == OPEN (declared default), assigned_primary_slots_used == 0"
            - "AgriculturalArea.${area_id}.id is a server-minted string, version == 1, created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"

      - name: corner_student_get_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Student
          - endpoints[POST /mep/students]
          - endpoints[GET /mep/students/{student_id}]
        distinguishing_aspect: "GET /mep/students/{student_id} returns exactly the row POST /mep/students wrote - same id, same input fields, same computed pfs_score - and does not mutate version."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea and one ACTIVE Recruiter"
            - "one ENROLLED Student created with school_days_interrupted 5, credit_deficit 3 and both placement flags true, and no QualifyingMove at all"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 9, school_days_interrupted: 5, math_below_grade: true, reading_below_grade: true, credit_deficit: 3 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id, stu_v: $.data.version }
          trigger:
            - call: "GET /mep/students/${stu_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { got_id: $.data.id, got_score: $.data.pfs_score }
          assert:
            - "HTTP status is 200 and data.id == ${stu_id}"
            - "Student.${stu_id}.full_name == 'Mateo Reyes', birth_date == 2010-03-20, current_state_code == 'WA', area_id == ${area_id}"
            - "Student.${stu_id}.schooling_status == ENROLLED, grade_level == 9, school_days_interrupted == 5, credit_deficit == 3, math_below_grade == true, reading_below_grade == true"
            - "Student.${stu_id}.pfs_score == 41 (no verified move so move_band_points == 0, plus interruption 4, academic 28, credit 9) and pfs_flag == false"
            - "Student.${stu_id}.version == ${stu_v} - the GET did not bump it"

      - name: corner_students_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /mep/students]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three students in one area, GET /mep/students?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter, and exactly three ENROLLED Students in that area"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Student One", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_1_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Student Two", birth_date: "2011-04-21", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_2_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Student Three", birth_date: "2012-05-22", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_3_id: $.data.id }
          trigger:
            - call: "GET /mep/students"
              payload: { area_id: "${area_id}", limit: 2, offset: 0 }
              as: ServiceCoordinator
              captures: { page_1_first: "$.data[0].id", page_1_second: "$.data[1].id" }
            - call: "GET /mep/students"
              payload: { area_id: "${area_id}", limit: 2, offset: 2 }
              as: ServiceCoordinator
              captures: { page_2_first: "$.data[0].id" }
          assert:
            - "both responses carry response_type == array plus limit, offset, total_count and has_more"
            - "first page: 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "second page: 1 row, total_count == 3, offset == 2, has_more == false"
            - "the three returned ids across both pages are exactly {${stu_1_id}, ${stu_2_id}, ${stu_3_id}} with no repeats"

      - name: corner_student_get_with_unknown_id_returns_student_not_found
        claim_type: Not Found
        grounds:
          - validations[priority 3 ERR_STUDENT_NOT_FOUND]
          - errors[ERR_STUDENT_NOT_FOUND]
          - endpoints[GET /mep/students/{student_id}]
        distinguishing_aspect: "GET /mep/students/00000000-0000-0000-0000-000000000000 returns 404 with error_id ERR_STUDENT_NOT_FOUND and an error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "empty database, logical clock at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls: []
          trigger:
            - call: "GET /mep/students/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StateProgramAdmin
          assert:
            - "HTTP status is 404"
            - "response_type == error and data.error_id == ERR_STUDENT_NOT_FOUND"
            - "data.message is a non-empty string and no Student row was created"

      - name: corner_student_create_without_full_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority 4 ERR_INVALID_REQUEST]
          - entities.Student.fields.full_name
          - endpoints[POST /mep/students]
        distinguishing_aspect: "POST /mep/students omitting the required full_name returns 422 ERR_INVALID_REQUEST and persists nothing, while the same call with full_name present succeeds - so the failure is attributable to that single required field."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea and one ACTIVE Recruiter"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
          trigger:
            - call: "POST /mep/students"
              payload: { birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
          assert:
            - "the call without full_name: HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "the call with full_name: HTTP 201 and Student.${stu_id}.full_name == 'Mateo Reyes'"
            - "GET /mep/students filtered by area_id ${area_id} returns exactly 1 row - the rejected request persisted nothing"

      - name: corner_student_create_applies_every_declared_default
        claim_type: Defaults
        grounds:
          - entities.Student.fields.schooling_status
          - entities.Student.fields.school_days_interrupted
          - entities.Student.fields.credit_deficit
          - entities.Student.fields.eligibility_status
          - entities.Student.fields.service_status
          - endpoints[POST /mep/students]
        distinguishing_aspect: "POST /mep/students with only the four required fields applies every declared default exactly: schooling_status ENROLLED, grade_level null, school_days_interrupted 0, credit_deficit 0, all three booleans false, eligibility_status NOT_ELIGIBLE, service_status UNSERVED, and all four decimal ledgers 0.00."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea and one ACTIVE Recruiter"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
          trigger:
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
          assert:
            - "Student.${stu_id}.schooling_status == ENROLLED and grade_level is null"
            - "Student.${stu_id}.school_days_interrupted == 0, credit_deficit == 0, math_below_grade == false, reading_below_grade == false, has_hs_credential == false, primary_language_not_english == false"
            - "Student.${stu_id}.eligibility_status == NOT_ELIGIBLE, service_status == UNSERVED, prior_record_student_id is null, eligibility_expires_on is null"
            - "Student.${stu_id}.pfs_score == 0, pfs_variant == INTERRUPTION_WEIGHTED, pfs_flag == false"
            - "Student.${stu_id}.total_service_hours_ledger == 0.00, transferred_credits_count == 0.00, locally_accrued_credits == 0.00, total_awarded_credits == 0.00"

      - name: corner_move_student_age_at_move_is_computed_from_birth_date
        claim_type: Computed Fields
        grounds:
          - entities.QualifyingMove.fields.student_age_at_move
          - endpoints[POST /mep/qualifying-moves]
          - calculations.qc_sample_selection
        distinguishing_aspect: "student_age_at_move is computed on POST /mep/qualifying-moves from Student.birth_date and move_date and is not an input field: a student born 2010-03-20 moving on 2026-06-15 is stamped 16, and the same student moving on 2028-02-01 is stamped 17."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default for the first move, then advanced to 2028-03-01 for the second"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter, one ENROLLED Student born 2010-03-20"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_1_id: $.data.id, age_1: $.data.student_age_at_move }
            - call: "POST /mep/_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "WA", to_state_code: "OR", move_date: "2028-02-01", work_type: "FISHING", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 305.25 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_2_id: $.data.id, age_2: $.data.student_age_at_move }
          assert:
            - "QualifyingMove.${move_1_id}.student_age_at_move == 16 (2010-03-20 to 2026-06-15) and status == RECORDED, adjudicated_on is null"
            - "QualifyingMove.${move_2_id}.student_age_at_move == 17 (2010-03-20 to 2028-02-01, birthday not yet reached)"
            - "QualifyingMove.${move_1_id}.distance_miles == 820.50 and QualifyingMove.${move_2_id}.distance_miles == 305.25, both at 2 decimal places"
            - "the age is not an input field: neither payload supplied student_age_at_move and both rows carry a server-computed value"

      - name: corner_area_system_fields_are_server_minted_and_version_bumps_on_write
        claim_type: System Fields
        grounds:
          - entities.AgriculturalArea
          - endpoints[POST /mep/areas]
          - endpoints[PATCH /mep/areas/{area_id}]
        distinguishing_aspect: "id, created_at, updated_at and version are system-generated on POST /mep/areas (version 1, created_at == updated_at == the clock) and a later PATCH moves version to 2 and updated_at to the new clock while created_at and id stay fixed."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default, later advanced to 2026-08-02T00:00:00Z"
            - "one OPEN AgriculturalArea"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id, v1: $.data.version, created_1: $.data.created_at }
          trigger:
            - call: "POST /mep/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: StateProgramAdmin
            - call: "PATCH /mep/areas/${area_id}"
              payload: { recruiter_capacity: 5 }
              as: StateProgramAdmin
              captures: { v2: $.data.version, updated_2: $.data.updated_at }
          assert:
            - "on create: AgriculturalArea.${area_id}.version == 1, created_at == 2026-08-01T00:00:00Z, updated_at == 2026-08-01T00:00:00Z"
            - "after the PATCH: AgriculturalArea.${area_id}.version == 2 and updated_at == 2026-08-02T00:00:00Z"
            - "after the PATCH: AgriculturalArea.${area_id}.created_at is still 2026-08-01T00:00:00Z and id is still ${area_id}"
            - "after the PATCH: AgriculturalArea.${area_id}.recruiter_capacity == 5 and name is still 'Yakima Valley'"

      - name: corner_area_create_rejects_out_of_range_and_out_of_set_values
        claim_type: Type Constraints
        grounds:
          - validations[priority 4 ERR_INVALID_REQUEST]
          - entities.AgriculturalArea.fields.recruiter_capacity
          - entities.AgriculturalArea.fields.primary_activity
          - entities.AgriculturalArea.fields.state_code
          - entities.AgriculturalArea.fields.peak_season_start_date
        distinguishing_aspect: "POST /mep/areas returns 422 ERR_INVALID_REQUEST for recruiter_capacity 13 (above the declared max 12), for primary_activity LIVESTOCK (outside {AGRICULTURE, FISHING}), for state_code 'Wa' (not two uppercase letters) and for peak_season_start_date after peak_season_end_date, and 201 for the corrected request."
        test_recipe:
          setup:
            - "empty database, logical clock at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls: []
          trigger:
            - call: "POST /mep/areas"
              payload: { name: "Bad Capacity", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 13 }
              as: StateProgramAdmin
            - call: "POST /mep/areas"
              payload: { name: "Bad Activity", state_code: "WA", primary_activity: "LIVESTOCK", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
            - call: "POST /mep/areas"
              payload: { name: "Bad State Code", state_code: "Wa", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
            - call: "POST /mep/areas"
              payload: { name: "Inverted Season", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-09-30", peak_season_end_date: "2026-06-01", recruiter_capacity: 3 }
              as: StateProgramAdmin
            - call: "POST /mep/areas"
              payload: { name: "Good Area", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 12 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
          assert:
            - "recruiter_capacity 13: HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "primary_activity LIVESTOCK: HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "state_code 'Wa': HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "peak_season_start_date 2026-09-30 after peak_season_end_date 2026-06-01: HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "the corrected request: HTTP 201 with AgriculturalArea.${area_id}.recruiter_capacity == 12 (the inclusive maximum)"
            - "GET /mep/areas/${area_id} succeeds and it is the only AgriculturalArea that exists"

      - name: corner_interview_record_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.InterviewRecord
          - endpoints[POST /mep/interview-records]
          - endpoints[GET /mep/interview-records/{interview_id}]
        distinguishing_aspect: "InterviewRecord declares common_fields false, so its response carries id and created_at but no updated_at and no version, and section 1.5 exposes no PATCH for it - the row can only be created and read."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter, one ENROLLED Student with one RECORDED move"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
          trigger:
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", interview_kind: "INITIAL", conducted_on: "2026-06-20", informant_relationship: "PARENT", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Parent confirms apple harvest work.", corroboration_count: 1 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_id: $.data.id }
            - call: "GET /mep/interview-records/${int_id}"
              payload: {}
              as: QualityControlReviewer
              as_user_id: "${rec_a_id}"
              captures: { read_id: $.data.id }
          assert:
