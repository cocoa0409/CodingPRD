            - "Member SUSPENDED (no covering span at clock); a DRAFT WHEELCHAIR trip."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-04T00:00:00Z" }
              as: Coordinator
            - call: "POST /members"
