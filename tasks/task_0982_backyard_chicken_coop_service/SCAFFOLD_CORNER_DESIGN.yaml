# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_0982_backyard_chicken_coop_service
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: household_creation_defaults
        claim_type: creation
        grounds: [entities.HouseholdAccount.fields.status, entities.HouseholdAccount.fields.wallet_credit_cents]
        distinguishing_aspect: "Creating a household applies system defaults: status ACTIVE, wallet_credit_cents 0, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /coopcare/households"
              payload: { name: "H Def", email: "hdef@x.com", address: "20 Hen Ln", zone_code: "SUBURBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, st: $.data.status, wal: $.data.wallet_credit_cents, ver: $.data.version }
          assert:
            - "HouseholdAccount.${hh_id}.status == ACTIVE"
            - "HouseholdAccount.${hh_id}.wallet_credit_cents == 0"
            - "HouseholdAccount.${hh_id}.version == 1"
            - "response envelope has meta.api_request_id and response_type == object"

      - name: household_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.HouseholdAccount.fields.zone_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "zone_code has source input and no default; omitting it must fail with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /coopcare/households"
              payload: { name: "H Bad", email: "hbad@x.com", address: "21 Hen Ln" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: household_invalid_enum_zone_rejected
        claim_type: type_constraints
        grounds: [entities.HouseholdAccount.fields.zone_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "zone_code is enum URBAN|SUBURBAN|RURAL; the value NOWHERE is outside the declared set and is rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /coopcare/households"
              payload: { name: "H Enum", email: "henum@x.com", address: "22 Hen Ln", zone_code: "NOWHERE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: visit_computed_coverage_client_input_ignored
        claim_type: computed_fields
        grounds: [entities.ServiceVisit.fields.coverage, entities.ServiceVisit.fields.provisional_price_cents]
        distinguishing_aspect: "coverage and provisional_price_cents are source computed; a client-supplied coverage: BILLABLE is ignored and the server computes SUBSCRIPTION_COVERED when the plan covers the visit."
        test_recipe:
          setup:
            - "URBAN household; plan included_cleanings_per_period=2; subscription ACTIVE (period 2026-05-01)"
            - "Coop INSTALLED via SETUP_INSTALL visit"
          setup_api_calls:
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "CI2", monthly_fee_cents: 1000, included_cleanings_per_period: 2, included_health_checks_per_period: 0, supply_discount_pct: 0, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /coopcare/households"
              payload: { name: "H CI", email: "hci@x.com", address: "23 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/subscriptions"
              payload: { household_id: "${hh_id}", plan_id: "${plan_id}", current_period_start: "2026-05-01T00:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 4 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_install: $.data.id }
            - call: "POST /coopcare/service-visits/${v_install}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_install}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_install}/complete"
              payload: { observed_flock_size: 4, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "COOP_CLEANING", scheduled_start: "2026-05-10T09:00:00Z", scheduled_end: "2026-05-10T10:00:00Z", coverage: "BILLABLE", provisional_price_cents: 1 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { visit_id: $.data.id, cov: $.data.coverage, prov: $.data.provisional_price_cents }
          assert:
            - "ServiceVisit.${visit_id}.coverage == SUBSCRIPTION_COVERED (client-supplied BILLABLE ignored)"
            - "ServiceVisit.${visit_id}.provisional_price_cents == 8000 (client-supplied 1 ignored; 8000*1.0 + flock tier 0)"

      - name: visit_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_VISIT_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but unknown visit id returns the error envelope with ERR_VISIT_NOT_FOUND and http 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /coopcare/service-visits/11111111-2222-4333-8444-555555555555"
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VISIT_NOT_FOUND"
            - "http status == 404"
            - "error envelope has meta.api_request_id and response_type == error"

      - name: service_visit_listing_pagination_defaults
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, endpoints.GET_/coopcare/service-visits]
        distinguishing_aspect: "List endpoint honors envelope pagination: default limit 10; with 3 visits total, limit=2 returns 2 items with total_count 3 and has_more true; offset=2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "URBAN household with PLANNED coop; three SETUP_INSTALL visits created (all REQUESTED)"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Page", email: "hpage@x.com", address: "24 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 4 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-11T09:00:00Z", scheduled_end: "2026-06-11T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-12T09:00:00Z", scheduled_end: "2026-06-12T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
          trigger:
            - call: "GET /coopcare/service-visits"
              payload: { household_id: "${hh_id}", limit: 2, offset: 0 }
              as: Dispatcher
          assert:
            - "page 1 returns exactly 2 items with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 item with has_more == false"

      - name: subscription_period_end_computed
        claim_type: computed_fields
        grounds: [entities.Subscription.fields.current_period_end]
        distinguishing_aspect: "current_period_end is computed as start + 1 calendar month: start 2026-05-01 yields end 2026-06-01 (exclusive half-open period)."
        test_recipe:
          setup: ["plan exists; URBAN household exists"]
          setup_api_calls:
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "PE1", monthly_fee_cents: 1000, included_cleanings_per_period: 1, included_health_checks_per_period: 1, supply_discount_pct: 0, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /coopcare/households"
              payload: { name: "H PE", email: "hpe@x.com", address: "25 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /coopcare/subscriptions"
              payload: { household_id: "${hh_id}", plan_id: "${plan_id}", current_period_start: "2026-05-01T00:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { sub_id: $.data.id, pend: $.data.current_period_end, used: $.data.used_cleanings }
          assert:
            - "Subscription.${sub_id}.current_period_end == 2026-06-01T00:00:00Z"
            - "Subscription.${sub_id}.used_cleanings == 0 and used_health_checks == 0"
            - "Subscription.${sub_id}.status == ACTIVE"

      - name: coop_site_create_household_not_found
        claim_type: parent_relationships
        grounds: [entities.CoopSite.fields.household_id, "errors[ERR_HOUSEHOLD_NOT_FOUND]"]
        distinguishing_aspect: "CoopSite.household_id is FK -> HouseholdAccount.id; creating a coop for a nonexistent household fails with ERR_HOUSEHOLD_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "11111111-2222-4333-8444-555555555555", site_label: "ghost", coop_capacity_hens: 4 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HOUSEHOLD_NOT_FOUND"
            - "http status == 404"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: visit_created_initial_state_requested
        claim_type: initial_state
        grounds: [state_machines.ServiceVisit]
        distinguishing_aspect: "A newly created ServiceVisit starts in REQUESTED with assigned_technician_id null and reschedule_count 0."
        test_recipe:
          setup: ["URBAN household with PLANNED coop"]
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Init", email: "hinit@x.com", address: "26 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 4 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
          trigger:
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { visit_id: $.data.id, st: $.data.status }
          assert:
            - "ServiceVisit.${visit_id}.status == REQUESTED"
            - "ServiceVisit.${visit_id}.assigned_technician_id == null"
            - "ServiceVisit.${visit_id}.reschedule_count == 0"

      - name: visit_complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceVisit.ON_SITE_to_COMPLETED, "errors[ERR_VISIT_NOT_ON_SITE]"]
        distinguishing_aspect: "complete is declared only from ON_SITE; invoking it from SCHEDULED is an invalid-from transition returning ERR_VISIT_NOT_ON_SITE with no side effects."
        test_recipe:
          setup: ["URBAN household; PLANNED coop; SETUP_INSTALL visit assigned to tech-1 (SCHEDULED)"]
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Inv", email: "hinv@x.com", address: "27 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 4 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /coopcare/service-visits/${visit_id}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
          trigger:
            - call: "POST /coopcare/service-visits/${visit_id}/complete"
              payload: { observed_flock_size: 4, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VISIT_NOT_ON_SITE"
            - "ServiceVisit.${visit_id}.status stays SCHEDULED"
            - "ServiceVisit.${visit_id}.final_price_cents stays null"

      - name: invoice_paid_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Invoice, "errors[ERR_INVOICE_NOT_ISSUED]"]
        distinguishing_aspect: "PAID is terminal: dispute on a PAID invoice is rejected ERR_INVOICE_NOT_ISSUED and no further transitions are possible."
        test_recipe:
          setup:
            - "URBAN household; order 1 line x 1000 cents PLACED at default clock"
            - "Invoice [2026-05-01, 2026-06-01) generated, ISSUED, then PAID"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Term", email: "hterm@x.com", address: "28 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/products"
              payload: { sku: "BED-1", name: "Pine Shavings", category: "BEDDING", unit_price_cents: 1000 }
              as: PlatformAdmin
            - call: "POST /coopcare/supply-orders"
              payload: { household_id: "${hh_id}" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { order_id: $.data.id }
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "BED-1", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/place"
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/invoices"
              payload: { household_id: "${hh_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /coopcare/invoices/${inv_id}/issue"
              as: BillingAdmin
            - call: "POST /coopcare/invoices/${inv_id}/mark-paid"
              as: BillingAdmin
          trigger:
            - call: "POST /coopcare/invoices/${inv_id}/dispute"
              as: Customer
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVOICE_NOT_ISSUED"
            - "Invoice.${inv_id}.status stays PAID"

      - name: route_cancel_with_committed_stops_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.SittingRoute.PLANNED_to_CANCELLED, "errors[ERR_ROUTE_NOT_EMPTY]"]
        distinguishing_aspect: "route cancel requires committed_stops == 0; a route holding one PENDING stop is rejected ERR_ROUTE_NOT_EMPTY."
        test_recipe:
          setup:
            - "URBAN household with INSTALLED grade-B coop; PUBLISHED route 2026-07-10; engagement CONFIRMED (route committed_stops == 1)"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H RC", email: "hrc@x.com", address: "29 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 6 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_i: $.data.id }
            - call: "POST /coopcare/service-visits/${v_i}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_i}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_i}/complete"
              payload: { observed_flock_size: 6, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "PREDATOR_PROOFING", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_p: $.data.id }
            - call: "POST /coopcare/service-visits/${v_p}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_p}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_p}/complete"
              payload: { observed_flock_size: 6, actual_duration_minutes: 90 }
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/sitting-routes"
              payload: { technician_id: "tech-9", route_date: "2026-07-10T00:00:00Z", zone_code: "URBAN", max_stops: 4 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /coopcare/sitting-routes/${route_id}/publish"
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", start_date: "2026-07-10T00:00:00Z", end_date: "2026-07-11T00:00:00Z", daily_window_start: "08:00" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /coopcare/sitting-engagements/${eng_id}/quote"
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements/${eng_id}/confirm"
              as: Customer
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /coopcare/sitting-routes/${route_id}/cancel"
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROUTE_NOT_EMPTY (committed_stops == 1)"
            - "SittingRoute.${route_id}.status stays PUBLISHED"

      - name: order_auto_fulfilled_on_visit_completion
        claim_type: side_effect_execution
        grounds: [state_machines.SupplyOrder.PLACED_to_FULFILLED, state_machines.ServiceVisit.ON_SITE_to_COMPLETED]
        distinguishing_aspect: "The completion of a fulfillment visit auto-transitions the linked PLACED order to FULFILLED in the same request."
        test_recipe:
          setup:
            - "URBAN household; PLANNED coop; SETUP_INSTALL visit SCHEDULED for tech-1"
            - "Order with fulfillment_visit_id = that visit, one line, PLACED"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H AF", email: "haf@x.com", address: "30 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 4 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /coopcare/service-visits/${visit_id}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/products"
              payload: { sku: "FEED-C", name: "Grower Feed", category: "FEED", unit_price_cents: 700 }
              as: PlatformAdmin
            - call: "POST /coopcare/supply-orders"
              payload: { household_id: "${hh_id}", fulfillment_visit_id: "${visit_id}" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { order_id: $.data.id }
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-C", quantity: 2 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/place"
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/service-visits/${visit_id}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /coopcare/service-visits/${visit_id}/complete"
              payload: { observed_flock_size: 4, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
          assert:
            - "ServiceVisit.${visit_id}.status == COMPLETED"
            - "SupplyOrder.${order_id}.status == FULFILLED (auto-transition fired by the completion)"
            - "CoopSite.${coop_id}.status == INSTALLED"

