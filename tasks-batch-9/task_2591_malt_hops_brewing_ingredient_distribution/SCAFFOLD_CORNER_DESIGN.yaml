            - "the ledger identity still holds: allocated_lbs 5000 == remaining 0 + committed 5000 + carried_forward_out 0 + defaulted 0 + resold 0"

      - name: credit_limit_breach_is_reported_while_the_posture_is_only_watch
        claim_type: violation_to_error
        grounds:
