scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: booking_settlement_provisional_vs_final_on_booking
        grounds:
          - calculations.booking_settlement_charge
          - entities.Booking.fields.provisional_total_cents
          - entities.Booking.fields.final_total_cents
          - state_machines.Booking.ACTIVE_to_LATE
          - state_machines.Booking.LATE_to_RETURNED
        distinguishing_aspect: |
          On the Booking domain, PROVISIONAL total (74592, fixed at request, no late fee)
          diverges from FINAL total (104592, at return after a 2-day-late detection adds a
          30000 late fee), so provisional_total_cents != final_total_cents on the same booking.
        test_recipe:
          setup:
            - "Verified renter, ACTIVE booking on a listing base_daily_rate_cents=10000, deposit 50000, declared_value 90000, window 2026-06-01..2026-06-08 (7 nights, weekly discount, 2 weekend days) -> rental_subtotal 66600, provisional_total 74592."
            - "Logical clock advanced to 2026-06-10 and late sweep run so the booking is LATE with late_days=2, late_fee_cents=30000, then returned."
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_dvc1@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_dvc1@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Camera", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/handoffs"
              payload: { type: "PICKUP", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T09:30:00Z" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { pu_handoff_id: $.data.id }
            - call: "POST /handoffs/${pu_handoff_id}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/condition-reports"
              payload: { phase: "PICKUP", photo_urls: ["u1"], recorded_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/pickup"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: Platform
            - call: "POST /_ops/detect-late-returns"
              payload: {}
              as: Platform
            - call: "POST /bookings/${booking_id}/handoffs"
              payload: { type: "RETURN", slot_start: "2026-06-10T09:00:00Z", slot_end: "2026-06-10T09:30:00Z" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { ret_handoff_id: $.data.id }
            - call: "POST /handoffs/${ret_handoff_id}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/condition-reports"
              payload: { phase: "RETURN", photo_urls: ["u2"], recorded_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/return"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { final_total: $.data.final_total_cents, prov_total: $.data.provisional_total_cents }
          assert:
            - "Booking.${booking_id}.provisional_total_cents == 74592"
            - "Booking.${booking_id}.final_total_cents == 104592"
            - "Booking.${booking_id}.late_fee_cents == 30000"

      - name: deposit_settlement_provisional_vs_final_on_deposit
        grounds:
          - calculations.deposit_settlement
          - entities.Claim.fields.provisional_capture_cents
          - entities.Claim.fields.deposit_capture_cents
          - state_machines.Claim.UNDER_REVIEW_to_PARTIALLY_APPROVED
        distinguishing_aspect: |
          On the Deposit domain, PROVISIONAL capture (min(claimed 40000, held 50000)=40000, at OPEN)
          diverges from FINAL capture (min(approved 15000, held 50000)=15000, at partial resolve),
          so provisional_capture_cents=40000 != deposit_capture_cents=15000.
        test_recipe:
          setup:
            - "A RETURNED booking (base 10000, deposit 50000) with a Deposit HELD=50000 and a PENDING Payout."
            - "An owner claim of claimed_amount_cents=40000 opened (provisional_capture 40000), moved UNDER_REVIEW, then resolved PARTIAL with approved_amount_cents=15000."
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_dvc2@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_dvc2@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Camera", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/handoffs"
              payload: { type: "PICKUP", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T09:30:00Z" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { pu_handoff_id: $.data.id }
            - call: "POST /handoffs/${pu_handoff_id}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/condition-reports"
              payload: { phase: "PICKUP", photo_urls: ["u1"], recorded_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/pickup"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/handoffs"
              payload: { type: "RETURN", slot_start: "2026-06-08T09:00:00Z", slot_end: "2026-06-08T09:30:00Z" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { ret_handoff_id: $.data.id }
            - call: "POST /handoffs/${ret_handoff_id}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/condition-reports"
              payload: { phase: "RETURN", photo_urls: ["u2"], recorded_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/return"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/claims"
              payload: { claim_type: "DAMAGE", claimed_amount_cents: 40000, description: "scratch" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { claim_id: $.data.id, prov_cap: $.data.provisional_capture_cents }
            - call: "POST /claims/${claim_id}/review"
              payload: {}
              as: Platform
            - call: "GET /bookings/${booking_id}/deposit"
              payload: {}
              as: Platform
              captures: { dep_v: "$.data[0].version" }
          trigger:
            - call: "POST /claims/${claim_id}/resolve"
              payload: { decision: "PARTIAL", approved_amount_cents: 15000, expected_deposit_version: "${dep_v}" }
              as: Platform
              captures: { final_cap: $.data.deposit_capture_cents }
          assert:
            - "Claim.${claim_id}.provisional_capture_cents == 40000"
            - "Claim.${claim_id}.deposit_capture_cents == 15000"
            - "Claim.${claim_id}.status == PARTIALLY_APPROVED"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a) and (b)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dynamic_daily_pricing_tier_weekend_demand_mode_a
        grounds:
          - calculations.dynamic_daily_pricing
          - entities.Listing.fields.demand_multiplier_bps
          - entities.Booking.fields.rental_subtotal_cents
        distinguishing_aspect: |
          Mode (a): >=3 interacting inputs (base_daily_rate, demand_multiplier, weekend surcharge,
          duration-discount tier) with non-linear branches — 7-night window at base 10000, demand 1.0x
          yields 5 weekday days @9000 + 2 weekend days @10800 (weekly 10% discount applied) = 66600.
        test_recipe:
          setup:
            - "Verified renter and an ACTIVE listing base_daily_rate_cents=10000, demand_multiplier_bps=10000, deposit 50000, declared_value 90000."
            - "A booking for 2026-06-01..2026-06-08 (7 nights: 06-06 Sat, 06-07 Sun are weekend)."
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_cfa@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_cfa@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Camera", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1, demand_multiplier_bps: 10000 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.billable_days == 7"
            - "Booking.${booking_id}.rental_subtotal_cents == 66600"
            - "Booking.${booking_id}.renter_service_fee_cents == 7992"
            - "Booking.${booking_id}.provisional_total_cents == 74592"

      - name: late_fee_round_per_day_then_sum_mode_b
        grounds:
          - calculations.late_fee_accrual
          - entities.Booking.fields.late_fee_cents
          - state_machines.Booking.ACTIVE_to_LATE
        distinguishing_aspect: |
          Mode (b): per-day late penalty is round_half_up(333*1.5)=round(499.5)=500 rounded ONCE per late
          day then multiplied by 3 late days = 1500; the forbidden sum-then-round order (499.5*3=1498.5 ->
          1499) differs by 1 cent, so pinning round-per-day-then-sum is observable as late_fee_cents=1500.
        test_recipe:
          setup:
            - "Verified renter, ACTIVE booking on a listing with base_daily_rate_cents=333 (chosen so 1.5x = 499.5 rounds), deposit 50000, declared_value 90000, window 2026-06-01..2026-06-08."
            - "Logical clock advanced to 2026-06-11 (3 whole days past end 06-08) and the late sweep run."
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_cfb@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_cfb@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Tripod", category: "tool", declared_value_cents: 90000, base_daily_rate_cents: 333, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/handoffs"
              payload: { type: "PICKUP", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T09:30:00Z" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { pu_handoff_id: $.data.id }
            - call: "POST /handoffs/${pu_handoff_id}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/condition-reports"
              payload: { phase: "PICKUP", photo_urls: ["u1"], recorded_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/pickup"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: Platform
          trigger:
            - call: "POST /_ops/detect-late-returns"
              payload: {}
              as: Platform
              captures: { late_count: $.data.marked_late_count }
          assert:
            - "Booking.${booking_id}.status == LATE"
            - "Booking.${booking_id}.late_days == 3"
            - "Booking.${booking_id}.late_fee_cents == 1500"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_extension_cycle_returns_to_active
        grounds:
          - state_machines.Booking.ACTIVE_to_EXTENSION_REQUESTED
          - state_machines.Booking.EXTENSION_REQUESTED_to_ACTIVE
          - entities.Booking.fields.status
          - entities.Booking.fields.billable_days
        distinguishing_aspect: |
          Cyclic shape on Booking: ACTIVE -> EXTENSION_REQUESTED -> ACTIVE returns to the SAME state
          with a re-priced window (billable_days 7 -> 14, rental_subtotal 66600 -> 133200), which a
          linear pipeline cannot express.
        test_recipe:
          setup:
            - "Verified renter, ACTIVE booking on base 10000 listing, window 2026-06-01..2026-06-08 (7 nights)."
            - "Renter requests extension to 2026-06-15; owner approves."
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_ext@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_ext@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Camera", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/handoffs"
              payload: { type: "PICKUP", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T09:30:00Z" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { pu_handoff_id: $.data.id }
            - call: "POST /handoffs/${pu_handoff_id}/complete"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/condition-reports"
              payload: { phase: "PICKUP", photo_urls: ["u1"], recorded_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/pickup"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/extensions"
              payload: { new_end_date: "2026-06-15T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/extension-decision"
              payload: { decision: "APPROVE" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { st: $.data.status, days: $.data.billable_days }
          assert:
            - "Booking.${booking_id}.status == ACTIVE"
            - "Booking.${booking_id}.billable_days == 14"
            - "Booking.${booking_id}.rental_subtotal_cents == 133200"

      - name: claim_branching_denied_leaves_deposit_untouched
        grounds:
          - state_machines.Claim.OPEN_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_DENIED
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.deposit_capture_cents
        distinguishing_aspect: |
          Branching fork on Claim: UNDER_REVIEW forks to {APPROVED, PARTIALLY_APPROVED, DENIED} with
          divergent side-effects — the DENIED branch captures 0 and leaves the deposit HELD=50000 intact,
          unlike the APPROVED branch which would capture.
        test_recipe:
          setup:
            - "A RETURNED booking with Deposit HELD=50000, a claim claimed 30000 opened and moved UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_clb@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_clb@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Camera", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /bookings/${booking_id}/handoffs"
