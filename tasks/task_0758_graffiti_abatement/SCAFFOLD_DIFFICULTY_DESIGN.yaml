scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_provisional_vs_final_on_costrecovery
        grounds:
          - calculations.abatement_cost
          - entities.CostRecovery.fields.estimated_cost_cents
          - entities.CostRecovery.fields.final_cost_cents
          - state_machines.CostRecovery.PENDING_to_ASSESSED
        distinguishing_aspect: "On the CostRecovery domain, the provisional variant (est labor 2.5h, reserved 3.0L) yields 22828 cents while the final variant (actual labor 3.0h, consumed 3.0L) yields 26565 cents — a 3737-cent divergence from identical material and rates."
        test_recipe:
          setup:
            - "PRIVATE site with owner; certified crew; PAINT material unit_cost_cents=1200, quantity_available=10.0."
            - "HIGH/WALL report triaged, dispatched (est_labor 2.5, reserve 3.0L) -> CostRecovery PENDING estimated_cost_cents=22828; before+after photos taken; work order started."
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy Owner", mailing_address: "1 Elm St", contact_email: "ivy@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple Ave", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag on wall" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.5, material_lines: [ { material_id: "${mat_id}", quantity: 3.0 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "GET /abatement/cost-recoveries?work_order_id=${wo_id}"
              payload: {}
              as: AbatementCoordinator
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/before.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "AFTER", url: "http://p/after.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /abatement/work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 3.0 }
              as: CrewLead
              as_user_id: "${crew_id}"
          assert:
            - "CostRecovery.${cr_id}.estimated_cost_cents == 22828"
            - "CostRecovery.${cr_id}.final_cost_cents == 26565"
            - "CostRecovery.${cr_id}.final_cost_cents != CostRecovery.${cr_id}.estimated_cost_cents"

      - name: hotspot_rolling_vs_confirmed_on_site
        grounds:
          - calculations.hotspot_severity_index
          - entities.Site.fields.hotspot_severity_index_rolling
          - entities.Site.fields.hotspot_severity_index_confirmed
        distinguishing_aspect: "On the Site domain, the rolling variant counts all three in-window reports (HIGH4+MEDIUM2+LOW1 = 7) while the confirmed variant counts only the one REMEDIATED report (HIGH = 4)."
        test_recipe:
          setup:
            - "PRIVATE site with owner, certified crew, ample PAINT material."
            - "Three reports on the site: HIGH, MEDIUM, LOW (rolling index 7)."
            - "The HIGH report is fully remediated to REMEDIATED (confirmed index 4)."
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy Owner", mailing_address: "1 Elm St", contact_email: "ivy@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple Ave", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "big tag" }
              as: IntakeClerk
              captures: { rep_high: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "FENCE", severity: "MEDIUM", description: "fence tag" }
              as: IntakeClerk
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "SIDEWALK", severity: "LOW", description: "small mark" }
              as: IntakeClerk
            - call: "POST /abatement/reports/${rep_high}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_high}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0, material_lines: [ { material_id: "${mat_id}", quantity: 1.0 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/b.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "AFTER", url: "http://p/a.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /abatement/work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 2.0 }
              as: CrewLead
              as_user_id: "${crew_id}"
          assert:
            - "Site.${site_id}.hotspot_severity_index_rolling == 7"
            - "Site.${site_id}.hotspot_severity_index_confirmed == 4"
            - "Site.${site_id}.hotspot_severity_index_rolling != Site.${site_id}.hotspot_severity_index_confirmed"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_nonlinear_hotspot_multiplier
        grounds:
          - calculations.priority_score
          - entities.Report.fields.priority_score
          - state_machines.Report.SUBMITTED_to_TRIAGED
        distinguishing_aspect: "Mode (a): priority_score combines >=3 inputs (base 50 * visibility 1.2, offensive +40, public +5) then multiplies by the HOTSPOT posture 1.5 -> 157.50; a purely additive read would give 105, so the non-linear posture factor is decisive."
        test_recipe:
          setup:
            - "PUBLIC site; three reports drive report_count_90d to 3 so the site is HOTSPOT."
            - "The scored report is HIGH / WALL / is_offensive=true on this PUBLIC HOTSPOT site."
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Public Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "FENCE", severity: "LOW", description: "f1" }
              as: IntakeClerk
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "WEB", surface_type: "FENCE", severity: "LOW", description: "f2" }
              as: IntakeClerk
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", is_offensive: true, description: "hateful tag" }
              as: IntakeClerk
              captures: { rep_c: $.data.id }
          trigger:
            - call: "POST /abatement/reports/${rep_c}/triage"
              payload: {}
              as: IntakeClerk
          assert:
            - "Report.${rep_c}.priority_score == 157.50"
            - "Report.${rep_c}.status == TRIAGED"

      - name: abatement_cost_per_line_rounding_order
        grounds:
          - calculations.abatement_cost
          - entities.CostRecovery.fields.material_cost_cents
          - entities.CostRecovery.fields.estimated_cost_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned to round-per-reservation-then-sum — round(2.5*1333)=3333 + round(1.5*777)=1166 -> material 4499; the sum-then-round alternative (3332.5+1165.5=4498.0) would give 4498, so the pinned order changes the cent."
        test_recipe:
          setup:
            - "PRIVATE site with owner, certified crew; two materials P1 unit_cost 1333 and P2 unit_cost 777, both ample."
            - "A HIGH report is triaged, then dispatched with est_labor 2.0h and two reservations (2.5 of P1, 1.5 of P2)."
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy Owner", mailing_address: "1 Elm St", contact_email: "ivy@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple Ave", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "P1", category: "PAINT", unit: "LITERS", unit_cost_cents: 1333, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat1: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "P2", category: "SOLVENT", unit: "LITERS", unit_cost_cents: 777, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat2: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "CHEMICAL", estimated_labor_hours: 2.0, material_lines: [ { material_id: "${mat1}", quantity: 2.5 }, { material_id: "${mat2}", quantity: 1.5 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "GET /abatement/cost-recoveries?work_order_id=${wo_id}"
              payload: {}
              as: AbatementCoordinator
              captures: { cr_id: "$.data[0].id" }
          assert:
            - "CostRecovery.${cr_id}.material_cost_cents == 4499"
            - "CostRecovery.${cr_id}.estimated_cost_cents == 20124"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_revision_cycle_in_progress_back_to_triaged
        grounds:
          - state_machines.Report.IN_PROGRESS_to_TRIAGED
          - state_machines.WorkOrder.IN_PROGRESS_to_RECALLED
          - entities.Report.fields.status
        distinguishing_aspect: "Report follows a cycle TRIAGED->DISPATCHED->IN_PROGRESS->TRIAGED: recalling the in-progress work order returns the Report to the prior non-terminal TRIAGED state, which no linear pipeline permits."
        test_recipe:
          setup:
            - "A report is dispatched and started (Report IN_PROGRESS, WorkOrder IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PUBLIC", address: "5 Public Way", latitude: 41.0, longitude: -73.0 }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0 }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/b.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /abatement/work-orders/${wo_id}/recall"
              payload: { reason: "wrong site" }
              as: AbatementCoordinator
          assert:
            - "Report.${rep_id}.status == TRIAGED"
            - "WorkOrder.${wo_id}.status == RECALLED"

      - name: workorder_branch_fork_recall_vs_complete_divergent_effects
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_RECALLED
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.CostRecovery.PENDING_to_VOID
        distinguishing_aspect: "From IN_PROGRESS the WorkOrder forks: the RECALLED arm voids the CostRecovery and reverts the Report to TRIAGED, whereas the COMPLETED arm would set Report REMEDIATED and CostRecovery ASSESSED — divergent side-effect sets on the same fork."
        test_recipe:
          setup:
            - "A report dispatched with a reservation and started (WorkOrder IN_PROGRESS, CostRecovery PENDING)."
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy Owner", mailing_address: "1 Elm St", contact_email: "ivy@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple Ave", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0, material_lines: [ { material_id: "${mat_id}", quantity: 2.0 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "GET /abatement/cost-recoveries?work_order_id=${wo_id}"
              payload: {}
              as: AbatementCoordinator
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/b.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /abatement/work-orders/${wo_id}/recall"
              payload: { reason: "abort" }
              as: AbatementCoordinator
          assert:
            - "WorkOrder.${wo_id}.status == RECALLED"
            - "Report.${rep_id}.status == TRIAGED"
            - "CostRecovery.${cr_id}.status == VOID"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: completion_cascade_workorder_report_costrecovery_site
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.Report.IN_PROGRESS_to_REMEDIATED
          - state_machines.CostRecovery.PENDING_to_ASSESSED
          - entities.Site.fields.outstanding_recovery_cents
        distinguishing_aspect: "Depth-3 chain: completing the WorkOrder sets Report REMEDIATED (hop1), which drives CostRecovery to ASSESSED (hop2), which credits Site.outstanding_recovery_cents by 26565 (hop3); each hop is caused by the previous."
        test_recipe:
          setup:
            - "PRIVATE site with owner, certified crew, PAINT material; HIGH report triaged and dispatched (est 2.5h, reserve 3.0L); before+after photos; started."
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy Owner", mailing_address: "1 Elm St", contact_email: "ivy@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple Ave", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.5, material_lines: [ { material_id: "${mat_id}", quantity: 3.0 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "GET /abatement/cost-recoveries?work_order_id=${wo_id}"
              payload: {}
              as: AbatementCoordinator
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/b.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "AFTER", url: "http://p/a.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /abatement/work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 3.0 }
              as: CrewLead
              as_user_id: "${crew_id}"
          assert:
            - "Report.${rep_id}.status == REMEDIATED"
            - "CostRecovery.${cr_id}.status == ASSESSED"
            - "Site.${site_id}.outstanding_recovery_cents == 26565"

      - name: notice_expire_cascade_costrecovery_site_lien
        grounds:
          - state_machines.Notice.SENT_to_EXPIRED
          - state_machines.CostRecovery.ASSESSED_to_LIEN_PENDING
          - entities.Site.fields.lien_count
        distinguishing_aspect: "Depth-2 chain from a different trigger (notice expiry): expiring the notice escalates the linked CostRecovery ASSESSED->LIEN_PENDING (hop1), which increments Site.lien_count to 1 (hop2)."
        test_recipe:
          setup:
            - "PRIVATE site fully remediated so CostRecovery is ASSESSED; a COST_RECOVERY_NOTICE is issued (cure_days 30, sent_at at the default clock 2026-03-01)."
            - "Clock advanced to 2026-04-01 (past the 2026-03-31 cure_deadline)."
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy Owner", mailing_address: "1 Elm St", contact_email: "ivy@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple Ave", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
