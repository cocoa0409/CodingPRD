              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { err: "$.data.error_id" }
            - call: "GET /plants/${p1}/clay-pits"
              payload: { material_type: "CLAY" }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { a_avail_1: "$.data[0].available_tons", a_comm_1: "$.data[0].committed_tons", a_status: "$.data[0].status" }
            - call: "GET /plants/${p1}/clay-pits"
              payload: { material_type: "SHALE" }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { b_avail_1: "$.data[0].available_tons", b_comm_1: "$.data[0].committed_tons" }
            - call: "GET /plants/${p1}/kiln-cars"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { c1_status: "$.data[0].status" }
          assert:
            - "${f1_status} == QUALIFIED - qualification never looks at reserve size, only at pit status and share total"
            - "${err} == ERR_CLAY_RESERVE_INSUFFICIENT with HTTP 422 because pit B needs 16.00 tons and holds ${b_avail_0} == 10.00"
            - "${a_avail_0} == 5000.00 and ${a_avail_1} == 5000.00 with ${a_comm_1} == 0.00 - the sufficient pit was never debited"
            - "${b_avail_1} == 10.00 and ${b_comm_1} == 0.00"
