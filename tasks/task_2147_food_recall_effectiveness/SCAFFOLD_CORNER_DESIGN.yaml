          rationale: "The named §1.8 instance already replays all four hops end to end."

  - section: consistency_model
    instances:
      - name: cost_ledger_recomputation_is_visible_immediately_after_adjudication
        claim_type: immediate
        grounds: ["calculations.recall_cost_accumulation", "state_machines.CostEntry.PENDING_to_ACCEPTED", "entities.Recall.fields.total_loaded_cost_cents"]
        distinguishing_aspect: "The consistency model is immediate: the adjudicate response itself already shows status ACCEPTED, and the very next read of the recall — with no checkpoint, no delay and no other write — shows total_loaded_cost_cents 108500 and insurable_loaded_cost_cents 108500."
        test_recipe:
          setup: ["One FDA Recall in DRAFT with one PENDING LOGISTICS cost entry of 100000 cents."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "LOGISTICS", amount_cents: 100000, description: "Freight recovery" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce_id: $.data.id }
            - call: "GET /recalls/${r_id}"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { total_before: $.data.total_loaded_cost_cents }
          trigger:
            - call: "POST /cost-entries/${ce_id}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { st: $.data.status }
            - call: "GET /recalls/${r_id}"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { total_after: $.data.total_loaded_cost_cents, insurable_after: $.data.insurable_loaded_cost_cents }
          assert:
            - "${total_before} == 0"
            - "${st} == ACCEPTED"
            - "${total_after} == 108500"
            - "${insurable_after} == 108500"
            - "GET /recalls/${r_id}/cost-entries?status=ACCEPTED -> total_count == 1"
