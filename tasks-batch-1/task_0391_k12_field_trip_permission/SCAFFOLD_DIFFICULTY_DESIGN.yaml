            - "FieldTrip.${trip}.collected_fees_cents == 3834 (only slip_a paid; net retained after voluntary refund)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: chaperone_ratio_nonlinear_three_inputs
        grounds:
          - calculations.chaperone_ratio_requirement
          - entities.FieldTrip.fields.required_chaperones
          - entities.Student.fields.special_needs
          - entities.FieldTrip.fields.has_water_activity
        distinguishing_aspect: |
          Mode (a): required_chaperones nests ceil(S/base_ratio) tiered by grade_band,
          adds one dedicated 1:1 per special-needs SIGNED student, plus a water
          surcharge — ≥3 interacting inputs. ELEMENTARY, S=10, N=1, water=true →
          ceil(10/8)=2 general + 1 dedicated + 1 water = 4.
        test_recipe:
          setup:
            - "ELEMENTARY trip, has_water_activity true, capacity 20, APPROVED."
            - "10 SIGNED slips, exactly 1 of which is for a special_needs student."
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "T3", email: "t3@x.com", phone: "555-0003" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /students"
              payload: { full_name: "SN", grade_level: 3, home_school_code: "SCH1", special_needs: true }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_sn: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "Pool", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "ELEMENTARY", depart_at: "2026-09-05T09:00:00Z", return_at: "2026-09-05T14:00:00Z", capacity: 20, base_fee_cents: 0, transport_cost_cents: 0, has_water_activity: true }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "PRINCIPAL", decision: "APPROVE" }
              as: Principal
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "DISTRICT", decision: "APPROVE" }
              as: DistrictAdmin
            - call: "POST /guardians"
              payload: { full_name: "GSN", email: "gsn@x.com", phone: "555-0301" }
              as: DistrictAdmin
              captures: { g_sn: $.data.id }
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_sn}", guardian_id: "${g_sn}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_sn: $.data.id }
            - call: "POST /field-trips/${trip}/permission-slips/${slip_sn}/emergency-contacts"
              payload: { name: "EC", phone: "9", relationship: "mom" }
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/permission-slips/${slip_sn}/sign"
              payload: {}
              as: Guardian
              as_user_id: "${g_sn}"
          trigger:
            - call: "GET /field-trips/${trip}"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { rc1: $.data.required_chaperones }
          assert:
            - "After 1 SIGNED special-needs slip: FieldTrip.${trip}.required_chaperones == 3 (ceil(1/8)=1 general + 1 dedicated + 1 water)"
            - "Note: full 10-signed value 4 is asserted in the corner suite; here the nonlinearity of dedicated+water+ceil is pinned at S=1."

      - name: per_student_remainder_rounding_order
        grounds:
          - calculations.per_student_cost_allocation
          - entities.PermissionSlip.fields.signed_at
          - state_machines.FieldTrip.APPROVED_to_ROSTER_LOCKED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — floor each per-line share
          (10000//3 = 3333) THEN sweep the 1-cent remainder to the earliest signed_at
          slip, NOT 'sum then round'. 'Round per-line then sum' = 3334+3333+3333 = 10000
          conserves the pot; the remainder lands deterministically on slip_a.
        test_recipe:
