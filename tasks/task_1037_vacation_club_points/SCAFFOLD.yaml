# =============================================================================
# task_1037 — Vacation-Club & Points Travel (Marriott Vacations style)
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  1037. Vacation-Club & Points Travel (Marriott Vacations style): points/tier &
  banking/borrowing, resort inventory & reservation window, maintenance fee &
  special assessment, exchange & rental, transfer/resale, guest certificate,
  waitlist, statement

domain_name: vacation-club-points
api_prefix: /club

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (member, resort/unit-type, reservation,
  # bucket, statement, transfer, listing, waitlist, guest-certificate). URLs are
  # root-level collections under /club with FK ids in bodies, not deep nesting.

  state_machine_shape: parallel
  # Statement carries two independent status axes (payment_status × aging_status);
  # Member is cyclic (ACTIVE⇄SUSPENDED). Reservation/Waitlist/Transfer/Listing/
  # GuestCertificate/PointsBucket add branching + system-driven terminals.

  relationship_patterns:
    - one_to_many          # Member→PointsBucket, Resort→UnitType, Member→Statement
    - cross_aggregate      # Reservation references Member + UnitType + PointsBucket
    - self_referential     # Transfer references two Members (from/to)

  role_model: peer_roles
  # Member (customer, entity-backed) owns account actions; ClubAdmin (opaque
  # operator) owns inventory, statement generation, and the ops/clock surface.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: full_name, type: string, source: input, description: "Owner full name" }
      - { name: email, type: string, source: input, description: "Owner email" }
      - { name: owned_points, type: integer, source: input, description: "Annual points ownership size; drives tier and each use-year allotment", constraints: ">= 0" }
      - { name: tier, type: enum, source: computed, description: "STANDARD | SILVER | GOLD | PLATINUM — derived from owned_points thresholds" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }
      - { name: current_use_year, type: integer, source: system, description: "Calendar year of the logical clock at member creation; year of the initial PointsBucket" }
      - { name: current_statement_id, type: string, source: system, description: "Id of the most recently generated Statement for this member; null until first generation" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: PointsBucket
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: use_year, type: integer, source: system, description: "Calendar year this bucket's points belong to" }
      - { name: annual_allotment, type: integer, source: system, description: "Points granted for this use year; = member.owned_points at bucket creation" }
      - { name: banked_in, type: integer, source: system, description: "Points received into this bucket from the prior use-year's bank action", default: 0 }
      - { name: banked_out, type: integer, source: system, description: "Points sent forward from this bucket to next use year via bank", default: 0 }
      - { name: borrowed_in, type: integer, source: system, description: "Points pulled into this bucket from the next use year via borrow", default: 0 }
      - { name: borrowed_out, type: integer, source: system, description: "Points lent from this bucket to the prior use year (prior borrowed from here)", default: 0 }
      - { name: transferred_in, type: integer, source: system, description: "Points received from a completed member-to-member Transfer", default: 0 }
      - { name: transferred_out, type: integer, source: system, description: "Points sent out by a completed Transfer from this bucket", default: 0 }
      - { name: points_used, type: integer, source: system, description: "Running counter: points reserved/committed by active reservations, issued guest-cert fees, and escrowed PENDING transfers from this bucket", default: 0 }
      - { name: points_available, type: enum, source: computed, description: "annual_allotment + banked_in + borrowed_in + transferred_in - banked_out - borrowed_out - transferred_out - points_used; never negative" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: "OPEN" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Resort
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Resort name" }
      - { name: region, type: string, source: input, description: "Region / market label" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: UnitType
    parent: Resort
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: resort_id, type: string, source: system, description: "FK -> Resort.id; owning resort" }
      - { name: name, type: string, source: input, description: "Unit category, e.g. '2BR Villa'" }
      - { name: total_units, type: integer, source: input, description: "Aggregate inventory capacity: max concurrent reservations occupying any single night", constraints: ">= 1" }
      - { name: points_weekday_low, type: integer, source: input, description: "Points per weekday night in LOW season", constraints: ">= 1" }
      - { name: points_weekend_low, type: integer, source: input, description: "Points per weekend (Fri/Sat) night in LOW season", constraints: ">= 1" }
      - { name: points_weekday_high, type: integer, source: input, description: "Points per weekday night in HIGH season", constraints: ">= 1" }
      - { name: points_weekend_high, type: integer, source: input, description: "Points per weekend (Fri/Sat) night in HIGH season", constraints: ">= 1" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; booking member" }
      - { name: unit_type_id, type: string, source: input, description: "FK -> UnitType.id; booked unit category" }
      - { name: points_bucket_id, type: string, source: input, description: "FK -> PointsBucket.id; bucket that pays the points cost" }
      - { name: check_in, type: datetime, source: input, description: "ISO date (YYYY-MM-DD) of first night" }
      - { name: check_out, type: datetime, source: input, description: "ISO date (YYYY-MM-DD); nights are [check_in, check_out), half-open" }
      - { name: nights, type: integer, source: computed, description: "Count of nights = (check_out - check_in) in days" }
      - { name: points_cost, type: integer, source: computed, description: "Sum over nights of the UnitType point chart by season and day-class; see calculations.reservation_point_cost" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | COMPLETED | CANCELLED", default: "HELD" }
      - { name: refunded_points, type: integer, source: system, description: "Points returned to the paying bucket on cancel; set by cancellation refund policy", default: 0 }
      - { name: guest_certificate_id, type: string, source: system, description: "Id of the attached GuestCertificate; null when none" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: GuestCertificate
    parent: Reservation
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; certificate's reservation" }
      - { name: guest_name, type: string, source: input, description: "Name of the guest permitted to occupy" }
      - { name: fee_points, type: integer, source: system, description: "Points fee charged to the reservation's bucket at issuance = GUEST_CERT_FEE_POINTS" }
      - { name: status, type: enum, source: system, description: "ISSUED | USED | REVOKED", default: "ISSUED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Waitlist
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; waiting member" }
      - { name: unit_type_id, type: string, source: input, description: "FK -> UnitType.id; desired unit category" }
      - { name: points_bucket_id, type: string, source: input, description: "FK -> PointsBucket.id; bucket that pays if promoted to a reservation" }
      - { name: check_in, type: datetime, source: input, description: "ISO date of desired first night" }
      - { name: check_out, type: datetime, source: input, description: "ISO date; half-open [check_in, check_out)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PROMOTED | CANCELLED | EXPIRED", default: "ACTIVE" }
      - { name: promoted_reservation_id, type: string, source: system, description: "Id of the HELD Reservation created on promotion; null otherwise" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; promotion order key (earliest first)" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Statement
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; billed member" }
      - { name: billing_year, type: integer, source: system, description: "Calendar year of the logical clock at generation" }
      - { name: issue_date, type: datetime, source: system, description: "ISO date; = logical clock at generation" }
      - { name: due_date, type: datetime, source: system, description: "ISO date; = issue_date + STATEMENT_DUE_DAYS" }
      - { name: maintenance_fee_cents, type: integer, source: computed, description: "round_half_up(owned_points * MAINT_RATE_PER_POINT_USD) in cents" }
      - { name: club_dues_cents, type: integer, source: computed, description: "round_half_up(owned_points * CLUB_DUES_RATE_PER_POINT_USD) in cents" }
      - { name: special_assessment_cents, type: integer, source: input, description: "One-off special assessment levied by admin at generation", default: 0 }
      - { name: total_due_cents, type: integer, source: computed, description: "maintenance_fee_cents + club_dues_cents + special_assessment_cents (sum of individually-rounded lines)" }
      - { name: amount_paid_cents, type: integer, source: system, description: "Cumulative payments applied", default: 0 }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PARTIALLY_PAID | PAID", default: "UNPAID" }
      - { name: aging_status, type: enum, source: system, description: "CURRENT | PAST_DUE", default: "CURRENT" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: from_member_id, type: string, source: input, description: "FK -> Member.id; sending member" }
      - { name: to_member_id, type: string, source: input, description: "FK -> Member.id; receiving member" }
      - { name: points, type: integer, source: input, description: "Points to move from sender's current-use-year bucket to receiver's", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED | REJECTED", default: "PENDING" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Listing
    parent: Reservation
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the reservation offered on the exchange/rental market" }
      - { name: listing_type, type: enum, source: input, description: "EXCHANGE | RENTAL" }
      - { name: ask_amount_cents, type: integer, source: input, description: "Rental cash ask in cents; 0 for EXCHANGE", default: 0 }
      - { name: status, type: enum, source: system, description: "LISTED | WITHDRAWN | EXPIRED", default: "LISTED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    field: account_status
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic: suspension for delinquency, reinstatement on payoff."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — POST /_ops/run_billing_cycle when member has a Statement with aging_status=PAST_DUE and clock now > due_date + GRACE_DAYS"
        actor: system
        preconditions:
          - "Member.account_status == ACTIVE"
          - "Exists Statement for member with aging_status == PAST_DUE and payment_status != PAID and now > due_date + GRACE_DAYS"
        side_effects:
          - "CASCADE-A link 2: caused by the statement reaching PAST_DUE. Set account_status = SUSPENDED."
          - "CASCADE-A link 3: every Reservation of this member with status == HELD -> CANCELLED with a FULL refund (refunded_points = points_cost): paying PointsBucket.points_used -= points_cost; UnitType nightly occupancy released; any ISSUED GuestCertificate -> REVOKED (bucket.points_used -= fee_points); any LISTED Listing on it -> WITHDRAWN."
          - "CASCADE-A link 4: for each unit-type freed above, promote the earliest-created ACTIVE Waitlist entry that now fits (see calculations.waitlist_promotion)."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /club/statements/{id}/pay that clears all PAST_DUE balances"
        actor: Member
        preconditions:
          - "Member.account_status == SUSPENDED"
          - "After this payment the member has no Statement with aging_status == PAST_DUE and payment_status != PAID"
        side_effects:
          - "Set account_status = ACTIVE. No reservations are auto-restored."

  - entity: Statement
    field: payment_status
    initial_state: UNPAID
    terminal_states: [PAID]
    note: "Parallel axis 1 of 2 on Statement (payment). Evolves independently of aging_status."
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /club/statements/{id}/pay with amount_cents < remaining balance"
        actor: Member
        preconditions:
          - "0 < amount_cents < (total_due_cents - amount_paid_cents)"
        side_effects:
          - "amount_paid_cents += amount_cents"
      - from: [UNPAID, PARTIALLY_PAID]
        to: PAID
        trigger: "POST /club/statements/{id}/pay that brings amount_paid_cents >= total_due_cents"
        actor: Member
        preconditions:
          - "amount_paid_cents + amount_cents >= total_due_cents"
        side_effects:
          - "amount_paid_cents += amount_cents"
          - "aging_status -> CURRENT (payment clears delinquency on the aging axis)"
          - "If this was the member's only PAST_DUE statement and member is SUSPENDED, member.account_status -> ACTIVE (see Member machine)."

  - entity: Statement
    field: aging_status
    initial_state: CURRENT
    terminal_states: []
    note: "Parallel axis 2 of 2 on Statement (aging). Evolves independently of payment_status; driven only by the ops clock and payoff."
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "system — POST /_ops/run_billing_cycle when now > due_date and payment_status != PAID"
        actor: system
        preconditions:
          - "aging_status == CURRENT"
          - "now > due_date"
          - "payment_status != PAID"
        side_effects:
          - "CASCADE-A link 1: set aging_status = PAST_DUE. This is what later triggers Member ACTIVE->SUSPENDED in the same run."
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /club/statements/{id}/pay reaching PAID"
        actor: Member
        preconditions:
          - "payment reaches amount_paid_cents >= total_due_cents"
        side_effects: []

  - entity: Reservation
    field: status
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /club/reservations/{id}/confirm"
        actor: Member
        preconditions:
          - "Reservation.status == HELD"
          - "CROSS-ENTITY (Reservation->Member): booking Member.account_status == ACTIVE (else ERR_MEMBER_SUSPENDED)"
          - "Paying PointsBucket.status == OPEN"
        side_effects:
          - "Set status = CONFIRMED. Points remain reserved (points_used unchanged)."
      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /club/reservations/{id}/cancel"
        actor: Member
        preconditions:
          - "Reservation.status in {HELD, CONFIRMED}"
        side_effects:
          - "CASCADE-B link 1: refund per calculations.reservation_cancellation_refund; set refunded_points; paying PointsBucket.points_used -= refunded_points."
          - "Release the reservation's nightly occupancy on the UnitType (frees capacity)."
          - "Any ISSUED GuestCertificate -> REVOKED (bucket.points_used -= fee_points); any LISTED Listing -> WITHDRAWN."
          - "CASCADE-B link 2: promote the earliest-created ACTIVE Waitlist entry on that UnitType that now fits -> PROMOTED, which creates a new HELD Reservation reserving points on the promoted member's bucket (link 3)."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system — POST /_ops/run_billing_cycle when now >= check_out"
        actor: system
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "now >= check_out"
        side_effects:
          - "Set status = COMPLETED."
          - "Any ISSUED GuestCertificate on this reservation -> USED."

  - entity: Waitlist
    field: status
    initial_state: ACTIVE
    terminal_states: [PROMOTED, CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: PROMOTED
        trigger: "system — capacity frees on the UnitType (from a cancel or suspension cascade) and this is the promotable entry"
        actor: system
        preconditions:
          - "Waitlist.status == ACTIVE"
          - "CROSS-ENTITY (Waitlist->UnitType): every night in [check_in, check_out) has free capacity on the UnitType"
          - "Promoting member.account_status == ACTIVE and paying PointsBucket has points_available >= projected reservation points_cost"
        side_effects:
          - "Set status = PROMOTED; create a HELD Reservation (promoted_reservation_id) for the member; reserve its points_cost on the paying bucket; occupy the nights."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /club/waitlist-entries/{id}/cancel"
        actor: Member
        preconditions:
          - "Waitlist.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /_ops/run_billing_cycle when now >= check_in and still ACTIVE"
        actor: system
        preconditions:
          - "Waitlist.status == ACTIVE"
          - "now >= check_in"
        side_effects: []

  - entity: Transfer
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /club/transfers/{id}/accept with outcome=ACCEPT"
        actor: Member
        preconditions:
          - "Transfer.status == PENDING"
          - "CROSS-ENTITY: both from_member and to_member account_status == ACTIVE"
        side_effects:
          - "Sender bucket: points_used -= points (release escrow) and transferred_out += points."
          - "Receiver current-use-year bucket: transferred_in += points."
          - "INVARIANT compensating_points_transfer: (sender_member_total_available + receiver_member_total_available) unchanged across the pair."
      - from: PENDING
        to: REJECTED
        trigger: "POST /club/transfers/{id}/accept with outcome=REJECT"
        actor: Member
        preconditions:
          - "Transfer.status == PENDING"
        side_effects:
          - "Sender bucket: points_used -= points (release escrow). No points move."

  - entity: Listing
    field: status
    initial_state: LISTED
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: LISTED
        to: WITHDRAWN
        trigger: "system — the underlying Reservation is CANCELLED (cancel or suspension cascade)"
        actor: system
        preconditions:
          - "Listing.status == LISTED"
        side_effects: []
      - from: LISTED
        to: EXPIRED
        trigger: "system — POST /_ops/run_billing_cycle when now >= reservation.check_in"
        actor: system
        preconditions:
          - "Listing.status == LISTED"
          - "now >= reservation.check_in"
        side_effects: []

  - entity: GuestCertificate
    field: status
    initial_state: ISSUED
    terminal_states: [USED, REVOKED]
    transitions:
      - from: ISSUED
        to: USED
        trigger: "system — reservation reaches COMPLETED via run_billing_cycle"
        actor: system
        preconditions:
          - "GuestCertificate.status == ISSUED"
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "system — reservation CANCELLED (cancel or suspension cascade)"
        actor: system
        preconditions:
          - "GuestCertificate.status == ISSUED"
        side_effects:
          - "Paying PointsBucket.points_used -= fee_points (refund the guest-cert fee)."

  - entity: PointsBucket
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system — POST /_ops/run_billing_cycle when clock now.year > use_year"
        actor: system
        preconditions:
          - "PointsBucket.status == OPEN"
          - "now.year > use_year"
        side_effects:
          - "Bank/borrow and new reservations against this bucket are thereafter rejected with ERR_BUCKET_CLOSED."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: statement-generate-stale-member
    parent_entity: Member
    write_endpoint: "POST /club/members/{id}/statements"
    occ_field: "expected_member_version"
    description: |
      Generating a Statement recomputes the member's current billing document and
      supersedes any prior draft for the period, stamping member.current_statement_id
      and advancing member.version. A generate request carrying a member version that
      has advanced since the client last observed it is rejected: another writer has
      already generated the current-period statement and the caller's view is stale.
      Generation is a legitimate supersede (no state precondition blocks a second
      generate), so OCC on member.version is the only guard against a stale double
      generate.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: member_tier
    trigger: "Member create; read"
    algorithm: threshold
    formula: |
      tier = PLATINUM if owned_points >= 13000
           else GOLD   if owned_points >= 7000
           else SILVER if owned_points >= 4000
           else STANDARD
    input_set: "Member.owned_points only"
    constants: { SILVER_MIN: 4000, GOLD_MIN: 7000, PLATINUM_MIN: 13000 }
    precision: "integer thresholds, inclusive lower bound (>=)"

  - name: reservation_point_cost
    trigger: "POST /club/reservations (HELD create); waitlist promotion projected cost"
    algorithm: tiered_pricing
    formula: |
      nights = (check_out - check_in).days           # half-open [check_in, check_out)
      cost = 0
      for each night date d in [check_in, check_out):
        season   = HIGH if month(d) in HIGH_SEASON_MONTHS else LOW
        dayclass = WEEKEND if weekday(d) in {FRI, SAT} else WEEKDAY
        cost += UnitType.points_{dayclass}_{season}      # 1 of 4 chart cells
      # >=3 interacting inputs (nights x season x dayclass); non-linear cell selection per night.
    input_set: "UnitType point chart + the specific night dates of the reservation"
    constants: { HIGH_SEASON_MONTHS: [6, 7, 8, 12], WEEKEND_WEEKDAYS: [FRI, SAT] }
    precision: "integer points; no rounding"

  - name: reservation_cancellation_refund
    trigger: "POST /club/reservations/{id}/cancel; cascade cancel (suspension)"
    algorithm: threshold
    formula: |
      days_out = (date(check_in) - date(now)).days      # whole days from clock to check-in
      if days_out >= FULL_REFUND_DAYS:      variant=FULL;    refunded = points_cost
      elif days_out >= PARTIAL_REFUND_DAYS: variant=PARTIAL; refunded = floor(points_cost * PARTIAL_REFUND_RATIO)
      else:                                 variant=NONE;    refunded = 0
      # bucket.points_used -= refunded  (forfeited remainder stays used)
    input_set: "The reservation's points_cost and days_out at cancel time"
    constants: { FULL_REFUND_DAYS: 60, PARTIAL_REFUND_DAYS: 15, PARTIAL_REFUND_RATIO: 0.5 }
    precision: "integer points; floor on the partial share"
    variants:
      - { name: FULL,    when: "days_out >= 60", difference: "100% of points_cost returned" }
      - { name: PARTIAL, when: "15 <= days_out < 60", difference: "floor(50%) returned; remainder forfeited" }
      - { name: NONE,    when: "days_out < 15", difference: "0 returned; whole cost forfeited" }

  - name: banking_transfer_value
    trigger: "POST /club/points-buckets/{id}/bank"
    algorithm: threshold
    formula: |
      # points leave the source bucket at par regardless of timing:
      source.banked_out += points
      bank_deadline = date(source.use_year, 1, 1) + BANK_DEADLINE_DAYS days
      if date(now) <= bank_deadline:  variant=STANDARD; credited = points
      else:                           variant=LATE;     credited = floor(points * LATE_BANK_RATIO)
      next_bucket.banked_in += credited
    input_set: "points, source.use_year, clock now"
    constants: { BANK_DEADLINE_DAYS: 273, LATE_BANK_RATIO: 0.5 }
    precision: "integer points; floor on late credit"
    variants:
      - { name: STANDARD, when: "now <= use-year Jan 1 + 273 days", difference: "credited to next year at par (1:1)" }
      - { name: LATE,     when: "now  > use-year Jan 1 + 273 days", difference: "credited at floor(points * 0.5)" }

  - name: banking_borrowing_caps
    trigger: "POST /club/points-buckets/{id}/bank; POST /club/points-buckets/{id}/borrow"
    algorithm: threshold
    formula: |
      # bank cap: points <= floor(BANK_CAP_PCT   * source.annual_allotment)  else ERR_BANK_CAP_EXCEEDED
      #           points <= source.points_available                         else ERR_INSUFFICIENT_POINTS
      # borrow cap: points <= floor(BORROW_CAP_PCT * source.annual_allotment) else ERR_BORROW_CAP_EXCEEDED
      #             points <= next_bucket.points_available                    else ERR_INSUFFICIENT_POINTS
    input_set: "requested points vs allotment cap and available balance"
    constants: { BANK_CAP_PCT: 0.5, BORROW_CAP_PCT: 0.5 }
    precision: "integer points; floor on the cap"

  - name: maintenance_statement_total
    trigger: "POST /club/members/{id}/statements"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: round EACH line to cents independently, THEN sum.
      maintenance_fee_cents = round_half_up(owned_points * MAINT_RATE_PER_POINT_USD * 100)
      club_dues_cents       = round_half_up(owned_points * CLUB_DUES_RATE_PER_POINT_USD * 100)
      special_assessment_cents = input special_assessment_cents (default 0)
      total_due_cents = maintenance_fee_cents + club_dues_cents + special_assessment_cents
      # NOT round((maint_rate+dues_rate)*owned_points) — the per-line rounding can differ by 1 cent.
    input_set: "Member.owned_points and the special_assessment_cents input"
    constants: { MAINT_RATE_PER_POINT_USD: 0.0653, CLUB_DUES_RATE_PER_POINT_USD: 0.0089 }
    precision: "cents, round_half_up, per-line then sum"

  - name: bucket_available_points
    trigger: "any PointsBucket mutation (bank, borrow, transfer, reserve, refund)"
    algorithm: aggregation
    formula: |
      points_available = annual_allotment + banked_in + borrowed_in + transferred_in
                       - banked_out - borrowed_out - transferred_out - points_used
      # clamped at 0 (never negative)
    input_set: "the bucket's own counters"
    precision: "integer points"

  - name: unit_type_night_occupancy
    trigger: "reservation create/confirm/cancel/complete; capacity checks; promotion"
    algorithm: aggregation
    formula: |
      For a UnitType U and a candidate range [ci, co):
        for each night d in [ci, co):
          occ(d) = count of Reservation R where R.unit_type_id==U,
                   R.status in {HELD, CONFIRMED, COMPLETED}, and d in [R.check_in, R.check_out)
        available iff for every night d: occ(d) < U.total_units
      # aggregate capacity per night; adjacency (co == other.ci) does NOT overlap.
    input_set: "active reservations on U intersected with the candidate nights"
    precision: "integer counts"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id exists (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND (per resource)"
    http_status: 404
    applies_to: "all endpoints referencing ids"

  - priority: 4
    category: business_referential
    check: "Member role acting on own resource: X-User-ID equals the resource's owning member_id (Reservation.member_id, PointsBucket.member_id, Transfer.from_member_id for initiate / Transfer.to_member_id for accept, Statement.member_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "member-owned mutations"

  - priority: 5
    category: business_constraint
    check: "Field/format validity: check_out > check_in, dates parseable, points >= 1, amount_cents >= 1, enum values legal"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "create/mutation bodies"

  - priority: 6
    category: state
    check: "Target resource in a legal state for the transition, incl. cross-entity: bucket OPEN; booking/confirming member ACTIVE (ERR_MEMBER_SUSPENDED); listing requires Reservation CONFIRMED"
    error_id: "ERR_INVALID_STATE | ERR_MEMBER_SUSPENDED | ERR_BUCKET_CLOSED"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 7
    category: business_temporal
    check: "Reservation check_in within the booking window: 0 < (check_in - now).days <= window_days, where window_days = PRIORITY_WINDOW_DAYS if member.tier in {GOLD, PLATINUM} else STANDARD_WINDOW_DAYS"
    error_id: ERR_OUTSIDE_BOOKING_WINDOW
    http_status: 422
    applies_to: "POST /club/reservations, POST /club/waitlist-entries"

  - priority: 8
    category: business_constraint
    check: "Inventory & overlap: every requested night has free UnitType capacity (ERR_NO_INVENTORY); the member has no other active reservation overlapping the requested nights (ERR_MEMBER_DATE_OVERLAP)"
    error_id: "ERR_NO_INVENTORY | ERR_MEMBER_DATE_OVERLAP"
    http_status: 409
    applies_to: "POST /club/reservations"

  - priority: 9
    category: business_fiscal
    check: "Points sufficiency & caps: bucket points_available covers points_cost / transfer / guest-cert fee (ERR_INSUFFICIENT_POINTS); bank/borrow within caps (ERR_BANK_CAP_EXCEEDED / ERR_BORROW_CAP_EXCEEDED)"
    error_id: "ERR_INSUFFICIENT_POINTS | ERR_BANK_CAP_EXCEEDED | ERR_BORROW_CAP_EXCEEDED"
    http_status: 422
    applies_to: "reservations, transfers, guest-certificates, bank, borrow"

  - priority: 10
    category: business_constraint
    check: "OCC: expected_member_version matches Member.version on statement generation"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /club/members/{id}/statements"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- System / clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an arbitrary UTC instant. Server startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [ClubAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced/rewound to to_iso8601; all window/expiry/aging rules read this clock."]

  - method: POST
    path: "/_ops/run_billing_cycle"
    description: "Advance the billing/ops epoch at the current clock: mark overdue statements PAST_DUE, suspend delinquent members (cascade), complete past-checkout reservations, expire past waitlist/listings, close ended use-year buckets."
    roles: [ClubAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "Statement CURRENT->PAST_DUE where now > due_date and not PAID (CASCADE-A link 1)."
      - "Member ACTIVE->SUSPENDED where a PAST_DUE statement is now > due_date + GRACE_DAYS (CASCADE-A links 2-4)."
      - "Reservation CONFIRMED->COMPLETED where now >= check_out; its ISSUED GuestCertificate->USED."
      - "Waitlist ACTIVE->EXPIRED where now >= check_in; Listing LISTED->EXPIRED where now >= reservation.check_in."
      - "PointsBucket OPEN->CLOSED where now.year > use_year."

  # ---- Member ----
  - method: POST
    path: "/club/members"
    description: "Onboard an owner. Computes tier; creates the initial OPEN PointsBucket for the clock's current use year with annual_allotment = owned_points."
    roles: [ClubAdmin]
    code: 201
    input: [full_name, email, owned_points]
    output: Member
    side_effects: ["account_status=ACTIVE; current_use_year=now.year; create PointsBucket(use_year=now.year, annual_allotment=owned_points, status=OPEN)."]

  - method: GET
    path: "/club/members/{id}"
    description: "Get a member."
    roles: [Member, ClubAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/club/members/{id}/points-buckets"
    description: "List the member's PointsBuckets (reverse-reachability for PointsBucket.member_id)."
    roles: [Member, ClubAdmin]
    code: 200
    input: ["use_year?", "status?", "limit?", "offset?"]
    output: PointsBucket[]
    side_effects: []

  - method: GET
    path: "/club/members/{id}/statements"
    description: "List the member's Statements (reverse-reachability for Statement.member_id)."
    roles: [Member, ClubAdmin]
    code: 200
    input: ["aging_status?", "payment_status?", "limit?", "offset?"]
    output: Statement[]
    side_effects: []

  - method: GET
    path: "/club/members/{id}/transfers"
    description: "List Transfers where the member is sender or receiver (reverse-reachability for Transfer.from_member_id and Transfer.to_member_id)."
    roles: [Member, ClubAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Transfer[]
    side_effects: []

  # ---- PointsBucket ----
  - method: GET
    path: "/club/points-buckets/{id}"
    description: "Get a points bucket (observe balances)."
    roles: [Member, ClubAdmin]
    code: 200
    input: []
    output: PointsBucket
    side_effects: []

  - method: POST
    path: "/club/points-buckets/{id}/bank"
    description: "Bank points forward to the next use year. Auto-creates the next-year bucket if absent. STANDARD at par before deadline, LATE at 50% after."
    roles: [Member]
    code: 200
    input: [points]
    output: PointsBucket
    side_effects:
      - "If the next use-year (use_year+1) bucket is absent it is created OPEN with annual_allotment = member.owned_points."
      - "source.banked_out += points; source.points_used unaffected; next_bucket.banked_in += credited (par or floor(0.5))."
      - "Enforces banking_borrowing_caps and OPEN status."

  - method: POST
    path: "/club/points-buckets/{id}/borrow"
    description: "Borrow points from the next use year into this bucket. Auto-creates the next-year bucket if absent."
    roles: [Member]
    code: 200
    input: [points]
    output: PointsBucket
    side_effects:
      - "If the next use-year (use_year+1) bucket is absent it is created OPEN with annual_allotment = member.owned_points."
      - "this.borrowed_in += points; next_bucket.borrowed_out += points."
      - "Enforces BORROW_CAP_PCT of allotment and next_bucket.points_available; OPEN status."

  # ---- Resort / UnitType ----
  - method: POST
    path: "/club/resorts"
    description: "Create a resort."
    roles: [ClubAdmin]
    code: 201
    input: [name, region]
    output: Resort
    side_effects: []

  - method: GET
    path: "/club/resorts/{id}"
    description: "Get a resort."
    roles: [Member, ClubAdmin]
    code: 200
    input: []
    output: Resort
    side_effects: []

  - method: POST
    path: "/club/resorts/{id}/unit-types"
    description: "Create a unit type with capacity and seasonal point chart."
    roles: [ClubAdmin]
    code: 201
    input: [name, total_units, points_weekday_low, points_weekend_low, points_weekday_high, points_weekend_high]
    output: UnitType
    side_effects: []

  - method: GET
    path: "/club/resorts/{id}/unit-types"
    description: "List unit types of a resort (reverse-reachability for UnitType.resort_id)."
    roles: [Member, ClubAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: UnitType[]
    side_effects: []

  - method: GET
    path: "/club/unit-types/{id}"
    description: "Get a unit type."
    roles: [Member, ClubAdmin]
    code: 200
    input: []
    output: UnitType
    side_effects: []

  # ---- Reservation ----
  - method: POST
    path: "/club/reservations"
    description: "Create a HELD reservation. Validates window, inventory, member overlap, points; computes points_cost; reserves points on the paying bucket."
    roles: [Member]
    code: 201
    input: [member_id, unit_type_id, points_bucket_id, check_in, check_out]
    output: Reservation
    side_effects:
      - "status=HELD; points_cost computed; paying PointsBucket.points_used += points_cost; occupy nights on UnitType."

  - method: GET
    path: "/club/reservations/{id}"
    description: "Get a reservation."
    roles: [Member, ClubAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/club/reservations"
    description: "List/filter reservations (reverse-reachability for Reservation.member_id, unit_type_id, points_bucket_id)."
    roles: [Member, ClubAdmin]
    code: 200
    input: ["member_id?", "unit_type_id?", "points_bucket_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/club/reservations/{id}/confirm"
    description: "Confirm a HELD reservation (HELD->CONFIRMED). Requires member ACTIVE and bucket OPEN."
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status=CONFIRMED."]

  - method: POST
    path: "/club/reservations/{id}/cancel"
    description: "Cancel a HELD/CONFIRMED reservation. Refund per policy, free capacity, revoke guest cert, withdraw listing, promote waitlist (CASCADE-B)."
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status=CANCELLED; refunded_points set; bucket.points_used -= refunded_points; nights released."
      - "ISSUED GuestCertificate->REVOKED (fee refunded); LISTED Listing->WITHDRAWN; earliest fitting ACTIVE Waitlist entry promoted."

  # ---- Guest Certificate ----
  - method: POST
    path: "/club/reservations/{id}/guest-certificates"
    description: "Issue a guest certificate on a HELD/CONFIRMED reservation; charges GUEST_CERT_FEE_POINTS to the paying bucket."
    roles: [Member]
    code: 201
    input: [guest_name]
    output: GuestCertificate
    side_effects: ["status=ISSUED; fee_points=GUEST_CERT_FEE_POINTS; bucket.points_used += fee_points; reservation.guest_certificate_id set."]

  - method: GET
    path: "/club/reservations/{id}/guest-certificates"
    description: "List a reservation's guest certificates (reverse-reachability for GuestCertificate.reservation_id)."
    roles: [Member, ClubAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GuestCertificate[]
    side_effects: []

  # ---- Listing (exchange / rental) ----
  - method: POST
    path: "/club/reservations/{id}/listings"
    description: "List a CONFIRMED reservation on the exchange or rental market."
    roles: [Member]
    code: 201
    input: [listing_type, "ask_amount_cents?"]
    output: Listing
    side_effects: ["status=LISTED. Requires Reservation.status == CONFIRMED (cross-entity)."]

  - method: GET
    path: "/club/reservations/{id}/listings"
    description: "List a reservation's market listings (reverse-reachability for Listing.reservation_id)."
    roles: [Member, ClubAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  # ---- Waitlist ----
  - method: POST
    path: "/club/waitlist-entries"
    description: "Join the waitlist for a UnitType/date-range when inventory is full. Subject to the booking window."
    roles: [Member]
    code: 201
    input: [member_id, unit_type_id, points_bucket_id, check_in, check_out]
    output: Waitlist
    side_effects: ["status=ACTIVE."]

  - method: GET
    path: "/club/waitlist-entries/{id}"
    description: "Get a waitlist entry."
    roles: [Member, ClubAdmin]
    code: 200
    input: []
    output: Waitlist
    side_effects: []

  - method: GET
    path: "/club/waitlist-entries"
    description: "List/filter waitlist entries (reverse-reachability for Waitlist.member_id, unit_type_id, points_bucket_id)."
    roles: [Member, ClubAdmin]
    code: 200
    input: ["member_id?", "unit_type_id?", "points_bucket_id?", "status?", "limit?", "offset?"]
    output: Waitlist[]
    side_effects: []

  - method: POST
    path: "/club/waitlist-entries/{id}/cancel"
    description: "Leave the waitlist (ACTIVE->CANCELLED)."
    roles: [Member]
    code: 200
    input: []
    output: Waitlist
    side_effects: ["status=CANCELLED."]

  # ---- Statement ----
  - method: POST
    path: "/club/members/{id}/statements"
    description: "Generate (supersede) the member's current-period Statement. OCC-guarded on member.version; bumps member.version and sets current_statement_id."
    roles: [ClubAdmin]
    code: 201
    input: [expected_member_version, "special_assessment_cents?"]
    output: Statement
    side_effects:
      - "Create Statement (issue_date=now, due_date=now+STATEMENT_DUE_DAYS, computed fees); set member.current_statement_id; increment Member.version by 1."

  - method: POST
    path: "/club/statements/{id}/pay"
    description: "Apply a payment. Advances payment_status; on full payoff clears aging to CURRENT and may reinstate a SUSPENDED member."
    roles: [Member]
    code: 200
    input: [amount_cents]
    output: Statement
    side_effects:
      - "amount_paid_cents += amount_cents; payment_status recomputed; on PAID aging_status->CURRENT and member ACTIVE if no other PAST_DUE."

  # ---- Transfer ----
  - method: POST
    path: "/club/transfers"
    description: "Initiate a points transfer (transfer/resale) from sender's current-use-year bucket to receiver. Escrows points on sender."
    roles: [Member]
    code: 201
    input: [from_member_id, to_member_id, points]
    output: Transfer
    side_effects: ["status=PENDING; sender current-use-year bucket.points_used += points (escrow); requires sender points_available >= points and both members ACTIVE."]

  - method: POST
    path: "/club/transfers/{id}/accept"
    description: "Receiver accepts or rejects a PENDING transfer (outcome=ACCEPT|REJECT)."
    roles: [Member]
    code: 200
    input: [outcome]
    output: Transfer
    side_effects:
      - "ACCEPT -> COMPLETED: sender bucket points_used -= points, transferred_out += points; receiver current-use-year bucket transferred_in += points."
      - "REJECT -> REJECTED: sender bucket points_used -= points (release escrow)."

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Member acting on a resource it does not own" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body, missing required field, bad enum, check_out<=check_in, non-positive points/amount" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member_id does not exist" }
  - { id: ERR_RESORT_NOT_FOUND, http: 404, condition: "resort_id does not exist" }
  - { id: ERR_UNIT_TYPE_NOT_FOUND, http: 404, condition: "unit_type_id does not exist" }
  - { id: ERR_POINTS_BUCKET_NOT_FOUND, http: 404, condition: "bucket_id / points_bucket_id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "reservation_id does not exist" }
  - { id: ERR_WAITLIST_NOT_FOUND, http: 404, condition: "waitlist_id does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "statement_id does not exist" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "transfer_id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition illegal from current state (incl. listing on a non-CONFIRMED reservation, confirm on non-HELD, accept on non-PENDING)" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Booking/confirming/transferring requires member account_status ACTIVE" }
  - { id: ERR_BUCKET_CLOSED, http: 409, condition: "Bank/borrow/reserve against a CLOSED PointsBucket" }
  - { id: ERR_OUTSIDE_BOOKING_WINDOW, http: 422, condition: "check_in not within (now, now + window_days]; window by tier" }
  - { id: ERR_NO_INVENTORY, http: 409, condition: "Some requested night has no free UnitType capacity" }
  - { id: ERR_MEMBER_DATE_OVERLAP, http: 409, condition: "Member already has an active reservation overlapping the requested nights" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "Paying bucket points_available cannot cover the cost/transfer/fee" }
  - { id: ERR_BANK_CAP_EXCEEDED, http: 422, condition: "Bank request exceeds floor(BANK_CAP_PCT * annual_allotment)" }
  - { id: ERR_BORROW_CAP_EXCEEDED, http: 422, condition: "Borrow request exceeds floor(BORROW_CAP_PCT * annual_allotment)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_member_version != Member.version on statement generation" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A vacation-club owner acting on their own account: reservations, bank/borrow, guest certificates, listings, waitlist, transfers, statement payment."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /club/points-buckets/{id}/bank"
      - "POST /club/points-buckets/{id}/borrow"
      - "POST /club/reservations"
      - "POST /club/reservations/{id}/confirm"
      - "POST /club/reservations/{id}/cancel"
      - "POST /club/reservations/{id}/guest-certificates"
      - "POST /club/reservations/{id}/listings"
      - "POST /club/waitlist-entries"
      - "POST /club/waitlist-entries/{id}/cancel"
