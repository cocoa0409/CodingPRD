          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 101, limit 0 and offset -1 each return HTTP 400 ERR_INVALID_PAGINATION on a list endpoint, while limit 100 and offset 0 are accepted and the omitted case falls back to the declared default limit 10."
        test_recipe:
          setup:
