# =============================================================================
# PRD Benchmark Seed Tables — Otolaryngology Practice Operations
# task_2999_otolaryngology_practice_allergy_testing_balloon_sinuplasty
# §1.0–§1.7. Difficulty index lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# breadth index lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2999. Otolaryngology Practice, Allergy Testing & Balloon Sinuplasty (ear, nose
  and throat practice): allergy testing panel selection, skin versus serum
  testing protocols and reaction management, immunotherapy vial mixing,
  labeling, dosing escalation and observation requirements, in-office balloon
  procedure candidacy documentation and payer policy criteria, audiology
  services integration with hearing aid dispensing and trial periods, scope
  reprocessing and endoscopy suite compliance, pediatric tube and tonsil
  surgery scheduling coordinated with a surgery center, sleep study referral
  and appliance coordination, supply and implant tracking

domain_name: ent-practice-ops

# Flat topology: every entity is a top-level collection addressed by its own
# id; parent linkage is expressed with foreign keys in request bodies, never
# with nested URL segments.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency          # OCC on Patient.version and DiagnosticStudy.version (§1.2.1)
    - cascading_side_effects          # reaction -> dose -> patient -> orders/bookings (depth 4)
    - dual_variant_calculation        # candidacy (POLICY_STRICT vs CLINICAL_BROAD), risk (PROVISIONAL vs POST_REACTION), refund (IN_TRIAL vs POST_TRIAL)
    - version_pinning_on_approval     # SinuplastyCase.pinned_policy_version vs PayerPolicy.version

  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                     # ReactionEvent points at EITHER an AllergyTestOrder OR an ImmunotherapyDose

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: PayerPolicy
    parent: null
    common_fields: true
    fields:
      - name: payer_name
        type: string
        source: input
        description: Insurer or plan sponsor name.
        constraints: 1..120 chars
      - name: plan_code
        type: string
        source: input
        description: Practice-wide unique plan code.
        constraints: "unique across all PayerPolicy rows; ^[A-Z0-9-]{3,20}$"
      - name: requires_prior_auth
        type: boolean
        source: input
        description: When true, balloon sinuplasty candidacy is evaluated with the POLICY_STRICT variant and an authorization submission is mandatory before scheduling.
        default: true
      - name: min_medical_management_days
        type: integer
        source: input
        description: Minimum medical-management days the plan requires before a balloon procedure is covered.
        default: 28
        constraints: 0..180
      - name: requires_ct_within_months
        type: integer
        source: input
        description: CT sinus study must be dated within this many months of the authorization submission instant to count as a met criterion.
        default: 12
        constraints: 1..60
      - name: min_documented_criteria
        type: integer
        source: input
        description: Minimum number of admissible candidacy criteria codes the plan requires.
        default: 3
        constraints: 1..6
      - name: max_balloon_devices
        type: integer
        source: input
        description: Maximum balloon devices the plan will cover on one case.
        default: 2
        constraints: 1..6
      - name: covered_pct_bps
        type: integer
        source: input
        description: Plan coverage share in basis points applied per billed allergy unit.
        default: 8000
        constraints: 0..10000
      - name: allergy_serum_covered
        type: boolean
        source: input
        description: When false, a SERUM_IGE conversion is denied for members of this plan.
        default: true
      - name: observation_floor_minutes
        type: integer
        source: input
        description: Plan-mandated minimum post-administration observation minutes.
        default: 20
        constraints: 0..120
      - name: device_trial_days
        type: integer
        source: input
        description: Length of the hearing-aid / oral-appliance trial window in whole days.
        default: 30
        constraints: 1..120
      - name: restock_fee_bps
        type: integer
        source: input
        description: Restocking fee rate in basis points of device price, charged on an in-trial return.
        default: 1500
        constraints: 0..10000
      - name: restock_fee_floor_cents
        type: integer
        source: input
        description: Absolute floor for the restocking fee in cents.
        default: 12500
        constraints: 0..500000
      - name: auth_validity_days
        type: integer
        source: input
        description: Days an approved authorization remains valid, measured from the approval instant.
        default: 90
        constraints: 1..365
      - name: appliance_covered
        type: boolean
        source: input
        description: When false, an ORAL_APPLIANCE dispense is denied for members of this plan.
        default: true

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: payer_policy_id
        type: string
        source: input
        description: "FK -> PayerPolicy.id; the plan whose criteria, coverage and trial windows govern every workflow for this patient."
      - name: mrn
        type: string
        source: input
        description: Medical record number.
        constraints: "unique across all Patient rows; ^MRN-[0-9]{5}$"
      - name: full_name
        type: string
        source: input
        description: Patient legal name.
        constraints: 1..120 chars
      - name: date_of_birth
        type: string
        source: input
        description: Birth date, ISO 8601 calendar date (YYYY-MM-DD).
        constraints: must be on or before the logical clock date
      - name: age_months
        type: integer
        source: computed
        description: "Whole months between date_of_birth and the logical clock date: (clock.year - dob.year) * 12 + (clock.month - dob.month) - (1 if clock.day < dob.day else 0). Recomputed on every read and on every mutation of this row."
      - name: antihistamine_last_dose_at
        type: datetime
        source: input
        description: Instant of the patient's last antihistamine dose; null when the patient reports none.
        default: null
      - name: epinephrine_on_file
        type: boolean
        source: input
        description: True when a current epinephrine auto-injector prescription is documented in the chart.
        default: false
      - name: dermatographism
        type: boolean
        source: computed
        description: True when the patient has documented dermatographism, which forbids skin testing. Set false at creation and flipped to true only by the DERMATOGRAPHISM_DETECTED abort cascade; never accepted from a request body.
        default: false
      - name: prior_systemic_reaction_count
        type: integer
        source: input
        description: Count of historical systemic reactions carried in from the intake questionnaire.
        default: 0
        constraints: 0..10
      - name: sensitized_antigen_count
        type: integer
        source: computed
        description: Sum of positive_antigen_count over this patient's AllergyTestOrder rows whose status is READ, capped at 20.
      - name: risk_score
        type: integer
        source: computed
        description: Anaphylaxis risk score from calculations.patient_anaphylaxis_risk_score, clamped to 0..100.
      - name: risk_score_variant
        type: enum
        source: computed
        description: Which risk variant produced the stored risk_score.
        default: PROVISIONAL
        constraints: "PROVISIONAL | POST_REACTION"
      - name: supervision_tier
        type: enum
        source: computed
        description: STANDARD until risk_score >= 60, then PHYSICIAN_PRESENT.
        default: STANDARD
        constraints: "STANDARD | PHYSICIAN_PRESENT"
      - name: immunotherapy_escalation_step
        type: integer
        source: computed
        description: Next immunotherapy schedule step to use for this patient, maintained by the dose lifecycle.
        default: 1
        constraints: 1..12
      - name: immunotherapy_status
        type: enum
        source: computed
        description: NONE until a vial is label-verified; BUILD_UP while escalation step <= 6; MAINTENANCE while step >= 7; HELD after a systemic immunotherapy reaction until the next dose clears observation.
        default: NONE
        constraints: "NONE | BUILD_UP | MAINTENANCE | HELD"
      - name: last_dose_administered_at
        type: datetime
        source: computed
        description: administered_at of this patient's most recent ImmunotherapyDose whose status is in {ADMINISTERED, CLEARED, REACTION_HELD}; null when none. Used by the gap-rollback step of calculations.immunotherapy_next_dose_volume.
        default: null

  - name: AllergyTestOrder
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient being tested."
      - name: panel_code
        type: enum
        source: input
        description: Predefined antigen panel; fixes antigen_count via calculations.allergy_panel_billing constants.
        constraints: "ENV_36 | FOOD_24 | MOLD_12 | VENOM_5"
      - name: method
        type: enum
        source: input
        description: Testing protocol requested at order time; a conversion moves this to SERUM_IGE.
        constraints: "SKIN_PRICK | INTRADERMAL | SERUM_IGE"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.AllergyTestOrder.
        default: ORDERED
        constraints: "ORDERED | ADMINISTERED | SERUM_PENDING | READ | ABORTED"
      - name: antigen_count
        type: integer
        source: computed
        description: PANEL_ANTIGEN_COUNT[panel_code].
      - name: billed_units
        type: integer
        source: computed
        description: antigen_count for SKIN_PRICK and INTRADERMAL; ceil(antigen_count / 4) for SERUM_IGE.
      - name: practice_charge_cents
        type: integer
        source: computed
        description: Gross practice charge from calculations.allergy_panel_billing; 0 until the order reaches READ.
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: Patient share from calculations.allergy_panel_billing; 0 until the order reaches READ.
        default: 0
      - name: observation_required_minutes
        type: integer
        source: computed
        description: Observation minutes required after administration, from calculations.observation_minutes_required with context SKIN_PRICK / INTRADERMAL / SERUM_IGE.
        default: 0
      - name: ordered_by_user_id
        type: string
        source: system
        description: X-User-ID of the Otolaryngologist who created the order.
      - name: administered_by_user_id
        type: string
        source: system
        description: X-User-ID of the AllergyNurse who administered the panel; null before administration.
        default: null
      - name: administered_at
        type: datetime
        source: system
        description: Logical-clock instant of administration; null before administration.
        default: null
      - name: positive_antigen_count
        type: integer
        source: input
        description: Number of antigens read as positive; supplied when readings are recorded.
        default: 0
        constraints: 0..antigen_count
      - name: worst_systemic_grade
        type: integer
        source: computed
        description: Maximum systemic_grade over ReactionEvent rows whose allergy_test_order_id is this order.
        default: 0
        constraints: 0..4
      - name: abort_reason
        type: enum
        source: computed
        description: Why the order was aborted; null unless status is ABORTED.
        default: null
        constraints: "SYSTEMIC_REACTION | DERMATOGRAPHISM_DETECTED"

  - name: ReactionEvent
    parent: null
    common_fields: false
    fields:
      - name: allergy_test_order_id
        type: string
        source: input
        description: "FK -> AllergyTestOrder.id; null when this reaction belongs to an immunotherapy dose."
        default: null
      - name: immunotherapy_dose_id
        type: string
        source: input
        description: "FK -> ImmunotherapyDose.id; null when this reaction belongs to an allergy test order."
        default: null
      - name: systemic_grade
        type: integer
        source: input
        description: World Allergy Organization systemic reaction grade.
        constraints: 0..4
      - name: local_wheal_mm
        type: number
        source: input
        description: Largest local wheal diameter in millimetres.
        default: 0
        constraints: 0..80, one decimal place
      - name: onset_minutes
        type: integer
        source: input
        description: Minutes between administration and reaction onset.
        constraints: 0..240
      - name: epinephrine_given
        type: boolean
        source: input
        description: True when intramuscular epinephrine was administered.
        default: false
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the AllergyNurse who recorded the event.
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant at which the event was recorded; append-only, never edited.

  - name: ImmunotherapyVial
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; a vial is patient-specific and may never be administered to another patient."
      - name: supply_lot_id
        type: string
        source: input
        description: "FK -> SupplyLot.id; the ALLERGEN_CONCENTRATE lot the vial was compounded from."
      - name: dilution_code
        type: enum
        source: input
        description: Colour-coded dilution of the compounded vial; band-checked against the escalation step.
        constraints: "YELLOW_1_10 | BLUE_1_100 | GREEN_1_1000 | SILVER_1_10000"
      - name: label_text
        type: string
        source: input
        description: "Vial label text; must equal exactly '<patient.mrn>|<dilution_code>|<expires_at date>' where the date part is the YYYY-MM-DD prefix of expires_at."
      - name: volume_ml_initial
        type: number
        source: input
        description: Compounded volume in millilitres.
        default: 5.00
        constraints: 1.00..10.00, two decimal places
      - name: volume_ml_remaining
        type: number
        source: computed
        description: Millilitres still in the vial; decremented by each administered dose and zeroed on discard.
      - name: volume_ml_dispensed_total
        type: number
        source: computed
        description: Sum of volume_ml over this vial's ImmunotherapyDose rows whose status is in {ADMINISTERED, CLEARED, REACTION_HELD}.
        default: 0
      - name: volume_ml_wasted
        type: number
        source: computed
        description: Millilitres written off by a discard; 0 while the vial is usable.
        default: 0
      - name: expires_at
        type: datetime
        source: input
        description: Beyond-use instant of the compounded vial.
        constraints: must be strictly after the logical clock instant at creation and at most 365 days after it
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.ImmunotherapyVial.
        default: MIXED
        constraints: "MIXED | LABEL_VERIFIED | IN_USE | EXHAUSTED | DISCARDED"
      - name: mixed_by_user_id
        type: string
        source: system
        description: X-User-ID of the AllergyNurse who compounded the vial.
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the AllergyNurse who verified the label; null before verification and never equal to mixed_by_user_id.
        default: null
      - name: requires_supervised_administration
        type: boolean
        source: computed
        description: Set true when the owning patient's supervision_tier becomes PHYSICIAN_PRESENT; forces a supervising_user_id on every dose drawn from this vial.
        default: false
      - name: discard_reason
        type: enum
        source: computed
        description: Why the vial was discarded; null unless status is DISCARDED.
        default: null
        constraints: "SUPERSEDED | BEYOND_USE_DATE | CONTAMINATION"

  - name: ImmunotherapyDose
    parent: null
    common_fields: true
    fields:
      - name: immunotherapy_vial_id
        type: string
        source: input
        description: "FK -> ImmunotherapyVial.id; the vial the dose was drawn from. The dose inherits the vial's patient_id."
      - name: escalation_step_at_dose
        type: integer
        source: computed
        description: Effective schedule step resolved by calculations.immunotherapy_next_dose_volume at administration time.
        constraints: 1..12
      - name: volume_ml
        type: number
        source: computed
        description: Administered volume in millilitres from calculations.immunotherapy_next_dose_volume; client-supplied values are ignored.
      - name: observation_required_minutes
        type: integer
        source: computed
        description: Observation minutes required before this dose may be cleared, from calculations.observation_minutes_required with context IMMUNO_DOSE.
      - name: administered_at
        type: datetime
        source: system
        description: Logical-clock instant of administration.
      - name: administered_by_user_id
        type: string
        source: system
        description: X-User-ID of the AllergyNurse who administered the dose.
      - name: supervising_user_id
        type: string
        source: input
        description: X-User-ID of the supervising Otolaryngologist; required when the vial's requires_supervised_administration is true.
        default: null
      - name: observation_cleared_at
        type: datetime
        source: system
        description: Logical-clock instant at which observation was cleared; null until cleared.
        default: null
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.ImmunotherapyDose.
        default: ADMINISTERED
        constraints: "ADMINISTERED | CLEARED | REACTION_HELD | VOIDED"
      - name: reaction_grade
        type: integer
        source: computed
        description: Maximum systemic_grade over ReactionEvent rows whose immunotherapy_dose_id is this dose.
        default: 0
        constraints: 0..4
      - name: gap_days_at_dose
        type: integer
        source: computed
        description: Whole days between patient.last_dose_administered_at and this dose's administered_at, floor-divided; 0 for a first dose.
        default: 0

  - name: SinuplastyCase
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the candidate for in-office balloon sinuplasty."
      - name: laterality
        type: enum
        source: input
        description: Side(s) planned.
        constraints: "LEFT | RIGHT | BILATERAL"
      - name: sinuses
        type: array
        source: input
        description: Sinuses planned for dilation; array of distinct enum members.
        constraints: "non-empty subset of {MAXILLARY, FRONTAL, SPHENOID}"
      - name: planned_device_count
        type: integer
        source: computed
        description: length(sinuses) * (2 if laterality == BILATERAL else 1).
      - name: ct_study_date
        type: string
        source: input
        description: Date of the CT sinus study (YYYY-MM-DD); null when no CT is on file.
        default: null
      - name: documented_therapies
        type: array
        source: input
        description: "Medical-management entries supplied at documentation; each item is { therapy_code: INCS | ABX | SALINE | ORAL_STEROID, start_date: YYYY-MM-DD, end_date: YYYY-MM-DD }."
        default: []
      - name: documented_criteria_codes
        type: array
        source: input
        description: Candidacy criteria the physician asserts; array of distinct enum members from {CT_OPACIFICATION, SNOT22_GE_20, FAILED_INCS, FAILED_ABX, FAILED_SALINE, ENDOSCOPY_FINDING}.
        default: []
      - name: evaluation_variant
        type: enum
        source: computed
        description: POLICY_STRICT when the governing PayerPolicy.requires_prior_auth is true, otherwise CLINICAL_BROAD.
        constraints: "POLICY_STRICT | CLINICAL_BROAD"
      - name: criteria_met_count
        type: integer
        source: computed
        description: Admissible criteria count from calculations.sinuplasty_candidacy_evaluation under evaluation_variant.
        default: 0
      - name: contiguous_management_days
        type: integer
        source: computed
        description: Longest merged medical-management span in whole inclusive days, from calculations.sinuplasty_candidacy_evaluation.
        default: 0
      - name: cumulative_management_days
        type: integer
        source: computed
        description: Sum of all documented therapy spans in whole inclusive days, from calculations.sinuplasty_candidacy_evaluation.
        default: 0
      - name: candidacy_status
        type: enum
        source: computed
        description: UNDETERMINED while status is DRAFT; ELIGIBLE / INELIGIBLE once documentation is recorded.
        default: UNDETERMINED
        constraints: "UNDETERMINED | ELIGIBLE | INELIGIBLE"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.SinuplastyCase.
        default: DRAFT
        constraints: "DRAFT | DOCUMENTED | AUTH_SUBMITTED | INFO_REQUESTED | AUTHORIZED | DENIED | SCHEDULED | COMPLETED | AUTH_EXPIRED"
      - name: revision_round
        type: integer
        source: computed
        description: Number of resubmissions after an INFO_REQUESTED decision; capped at 2.
        default: 0
        constraints: 0..2
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the PayerLiaison who filed the current authorization submission; null before the first submission.
        default: null
      - name: pinned_policy_version
        type: integer
        source: computed
        description: PayerPolicy.version observed at the moment of the authorization submission; frozen for the life of the authorization.
        default: null
      - name: authorized_device_count
        type: integer
        source: computed
        description: Devices the payer approved; set to min(planned_device_count, policy.max_balloon_devices) when the decision is APPROVED.
        default: 0
      - name: auth_expires_at
        type: datetime
        source: computed
        description: Approval instant plus policy.auth_validity_days; null unless an approval has been recorded.
        default: null
      - name: payer_reference
        type: string
        source: input
        description: Payer-side reference number captured with a decision.
        default: null
      - name: documented_by_user_id
        type: string
        source: system
        description: X-User-ID of the Otolaryngologist who recorded the candidacy documentation.
        default: null

  - name: DiagnosticStudy
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient studied."
      - name: study_type
        type: enum
        source: input
        description: Audiometry for hearing evaluation; HSAT / PSG for sleep referral.
        constraints: "AUDIOMETRY | SLEEP_HSAT | SLEEP_PSG"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.DiagnosticStudy.
        default: ORDERED
        constraints: "ORDERED | PERFORMED | INTERPRETED"
      - name: pta_db_hl
        type: number
        source: input
        description: Four-frequency pure-tone average in dB HL; required for AUDIOMETRY results, forbidden otherwise.
        default: null
        constraints: 0..120, one decimal place
      - name: word_recognition_pct
        type: number
        source: input
        description: Word recognition score percentage; required for AUDIOMETRY results, forbidden otherwise.
        default: null
        constraints: 0..100, one decimal place
      - name: ahi
        type: number
        source: input
        description: Apnea-hypopnea index; required for SLEEP_HSAT and SLEEP_PSG results, forbidden otherwise.
        default: null
        constraints: 0..120, one decimal place
      - name: recommendation
        type: enum
        source: computed
        description: Device pathway derived by calculations.study_recommendation at interpretation.
        default: null
        constraints: "HEARING_AID | ORAL_APPLIANCE | CPAP | OBSERVATION"
      - name: performed_at
        type: datetime
        source: system
        description: Logical-clock instant results were recorded; null before that.
        default: null
      - name: performed_by_user_id
        type: string
        source: system
        description: X-User-ID of the Audiologist who recorded results.
        default: null
      - name: interpreted_by_user_id
        type: string
        source: system
        description: X-User-ID of the clinician who interpreted the study; never equal to performed_by_user_id.
        default: null
      - name: superseded_dispense_count
        type: integer
        source: computed
        description: Number of DeviceDispense rows created against this study that a later dispense superseded.
        default: 0

  - name: DeviceDispense
    parent: null
    common_fields: true
    fields:
      - name: diagnostic_study_id
        type: string
        source: input
        description: "FK -> DiagnosticStudy.id; the interpreted study that justifies the device."
      - name: supply_lot_id
        type: string
        source: input
        description: "FK -> SupplyLot.id; the HEARING_AID or ORAL_APPLIANCE lot the unit came from."
      - name: device_type
        type: enum
        source: input
        description: Must match the study recommendation (HEARING_AID for HEARING_AID, ORAL_APPLIANCE for ORAL_APPLIANCE).
        constraints: "HEARING_AID | ORAL_APPLIANCE"
      - name: device_serial
        type: string
        source: input
        description: Manufacturer serial of the dispensed unit.
        constraints: "unique across all DeviceDispense rows; ^[A-Z]{2}[0-9]{6}$"
      - name: ear
        type: enum
        source: input
        description: Fitted side; NA for oral appliances.
        constraints: "LEFT | RIGHT | BOTH | NA"
      - name: price_cents
        type: integer
        source: input
        description: Retail price of the unit in cents.
        constraints: 1..2000000
      - name: dispensed_at
        type: datetime
        source: system
        description: Logical-clock instant of dispensing; day one of the trial window.
      - name: trial_end_at
        type: datetime
        source: computed
        description: dispensed_at plus policy.device_trial_days whole days; a return at exactly this instant is POST_TRIAL.
      - name: fit_status
        type: enum
        source: system
        description: Fitting dimension of state_machines.DeviceDispense.
        default: FITTED
        constraints: "FITTED | ADJUSTED | FINALIZED | RETURNED"
      - name: billing_status
        type: enum
        source: system
        description: Financial dimension of state_machines.DeviceDispense, advancing independently of fit_status.
        default: INVOICED
        constraints: "INVOICED | REFUND_PENDING | REFUNDED | RETAINED"
      - name: adjustment_count
        type: integer
        source: computed
        description: Number of recorded fitting adjustments.
        default: 0
      - name: days_used
        type: integer
        source: computed
        description: floor((return instant - dispensed_at) / 86400 seconds) + 1; 0 until a return is recorded.
        default: 0
      - name: refund_variant
        type: enum
        source: computed
        description: IN_TRIAL when the return instant is strictly before trial_end_at, otherwise POST_TRIAL.
        default: null
        constraints: "IN_TRIAL | POST_TRIAL"
      - name: restock_fee_cents
        type: integer
        source: computed
        description: Restocking fee from calculations.device_trial_refund; 0 until a return is recorded.
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: Refund owed from calculations.device_trial_refund; 0 until a return is recorded.
        default: 0
      - name: dispensed_by_user_id
        type: string
        source: system
        description: X-User-ID of the Audiologist who dispensed the unit.
      - name: settled_by_user_id
        type: string
        source: system
        description: X-User-ID of the PracticeAdmin who settled the refund; never equal to dispensed_by_user_id.
        default: null

  - name: EndoscopeAsset
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: Manufacturer serial of the flexible endoscope.
        constraints: "unique across all EndoscopeAsset rows; ^SC-[0-9]{4}$"
      - name: model
        type: string
        source: input
        description: Scope model designation.
        constraints: 1..60 chars
      - name: status
        type: enum
        source: system
        description: Reprocessing lifecycle state; see state_machines.EndoscopeAsset.
        default: READY
        constraints: "READY | IN_USE | SOILED | REPROCESSING | QUARANTINED | RETIRED"
      - name: cycle_count
        type: integer
        source: computed
        description: Number of high-level-disinfection cycles that completed with a PASS outcome.
        default: 0
      - name: last_reprocessed_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent PASS reprocessing completion; null for a never-reprocessed scope.
        default: null
      - name: hld_expires_at
        type: datetime
        source: computed
        description: last_reprocessed_at plus HLD_SHELF_LIFE_HOURS (168); null while last_reprocessed_at is null, in which case the scope is treated as shelf-valid until first use.
        default: null
      - name: mec_test_due
        type: boolean
        source: computed
        description: True when (cycle_count + 1) modulo MEC_TEST_INTERVAL (10) equals 0, i.e. the next completion must carry a minimum-effective-concentration result.
        default: false
      - name: consecutive_mec_failures
        type: integer
        source: computed
        description: Count of consecutive reprocessing completions with a FAIL outcome; reset to 0 by a PASS.
        default: 0
        constraints: 0..2
      - name: reprocessing_started_by_user_id
        type: string
        source: computed
        description: X-User-ID of the SterileProcessingTech who started the open reprocessing run; null when no run is open.
        default: null
      - name: last_used_by_user_id
        type: string
        source: computed
        description: physician_user_id of the ProcedureBooking that most recently put the scope IN_USE.
        default: null

  - name: SupplyLot
    parent: null
    common_fields: true
    fields:
      - name: item_type
        type: enum
        source: input
        description: What the lot holds; gates which workflow may consume it.
        constraints: "BALLOON_DEVICE | TYMPANOSTOMY_TUBE | ALLERGEN_CONCENTRATE | HEARING_AID | ORAL_APPLIANCE"
      - name: lot_number
        type: string
        source: input
        description: Manufacturer lot number.
        constraints: "unique across all SupplyLot rows; ^LOT-[0-9]{4}$"
      - name: quantity_received
        type: integer
        source: input
        description: Units received into inventory when the lot was booked in.
        constraints: 1..1000
      - name: quantity_on_hand
        type: integer
        source: computed
        description: Units physically present, reserved units included.
      - name: quantity_reserved
        type: integer
        source: computed
        description: Units held by ProcedureBooking rows in status SCHEDULED or IN_PROGRESS.
        default: 0
      - name: quantity_consumed
        type: integer
        source: computed
        description: Units implanted or dispensed and therefore permanently gone.
        default: 0
      - name: quantity_wasted
        type: integer
        source: computed
        description: Units written off by an adjustment with reason WASTE or QUARANTINE.
        default: 0
      - name: available_quantity
        type: integer
        source: computed
        description: quantity_on_hand - quantity_reserved.
      - name: expires_at
        type: datetime
        source: input
        description: Lot expiry instant; a lot may not be reserved or consumed at or after this instant.
      - name: status
        type: enum
        source: system
        description: ACTIVE while available_quantity > 0; EXHAUSTED when available_quantity reaches 0; QUARANTINED after a QUARANTINE adjustment.
        default: ACTIVE
        constraints: "ACTIVE | EXHAUSTED | QUARANTINED"

  - name: SurgeryCenterBlock
    parent: null
    common_fields: true
    fields:
      - name: center_name
        type: string
        source: input
        description: Ambulatory surgery center that owns the block.
        constraints: 1..120 chars
      - name: block_start_at
        type: datetime
        source: input
        description: Inclusive start of the reserved block window.
      - name: block_end_at
        type: datetime
        source: input
        description: Exclusive end of the reserved block window; must be strictly after block_start_at.
      - name: max_concurrent_cases
        type: integer
        source: input
        description: Number of rooms the center staffs for this block; the aggregate concurrency ceiling.
        default: 2
        constraints: 1..6
      - name: overnight_capable
        type: boolean
        source: input
        description: True when the center can hold a child for overnight observation.
        default: false
      - name: booked_case_count
        type: integer
        source: computed
        description: Count of this block's ProcedureBooking rows whose status is in {SCHEDULED, IN_PROGRESS, COMPLETED}.
        default: 0
      - name: booked_minutes
        type: integer
        source: computed
        description: Sum of duration_minutes over this block's ProcedureBooking rows whose status is in {SCHEDULED, IN_PROGRESS, COMPLETED}.
        default: 0
      - name: capacity_minutes
        type: integer
        source: computed
        description: floor((block_end_at - block_start_at) / 60 seconds) * max_concurrent_cases.
      - name: utilization_bps
        type: integer
        source: computed
        description: round_half_up(booked_minutes * 10000 / capacity_minutes) from calculations.surgery_block_utilization.
        default: 0
      - name: status
        type: enum
        source: system
        description: Posture gating child bookings; see state_machines.SurgeryCenterBlock.
        default: OPEN
        constraints: "OPEN | FULL | CLOSED"

  - name: ProcedureBooking
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient on the schedule."
      - name: sinuplasty_case_id
        type: string
        source: input
        description: "FK -> SinuplastyCase.id; required for procedure_type BALLOON_SINUPLASTY, null otherwise."
        default: null
      - name: endoscope_asset_id
        type: string
        source: input
        description: "FK -> EndoscopeAsset.id; required for procedure_type BALLOON_SINUPLASTY and DIAGNOSTIC_ENDOSCOPY, null otherwise."
        default: null
      - name: surgery_center_block_id
        type: string
        source: input
        description: "FK -> SurgeryCenterBlock.id; required when venue is SURGERY_CENTER, null otherwise."
        default: null
      - name: supply_lot_id
        type: string
        source: input
        description: "FK -> SupplyLot.id; required when planned_device_count > 0, null otherwise."
        default: null
      - name: procedure_type
        type: enum
        source: input
        description: What is being performed.
        constraints: "BALLOON_SINUPLASTY | DIAGNOSTIC_ENDOSCOPY | TYMPANOSTOMY_TUBES | TONSILLECTOMY"
      - name: venue
        type: enum
        source: input
        description: Where it is performed; the in-office endoscopy suite or the partner surgery center.
        constraints: "IN_OFFICE_SUITE | SURGERY_CENTER"
      - name: start_at
        type: datetime
        source: input
        description: Scheduled start instant.
      - name: end_at
        type: datetime
        source: input
        description: Scheduled end instant; must be strictly after start_at.
      - name: duration_minutes
        type: integer
        source: computed
        description: floor((end_at - start_at) / 60 seconds).
      - name: physician_user_id
        type: string
        source: input
        description: X-User-ID of the Otolaryngologist of record for this booking.
      - name: planned_device_count
        type: integer
        source: input
        description: Implants or balloon devices to be reserved from supply_lot_id.
        default: 0
        constraints: 0..6
      - name: devices_used_count
        type: integer
        source: input
        description: Devices actually consumed, supplied at completion; may not exceed planned_device_count.
        default: 0
        constraints: 0..6
      - name: overnight_observation_required
        type: boolean
        source: computed
        description: True when procedure_type is TONSILLECTOMY and patient.age_months < PEDIATRIC_OVERNIGHT_AGE_MONTHS (36).
        default: false
      - name: requires_physician_presence
        type: boolean
        source: computed
        description: Set true when the patient's supervision_tier becomes PHYSICIAN_PRESENT while this booking is SCHEDULED; forces attending_physician_user_id at start.
        default: false
      - name: attending_physician_user_id
        type: string
        source: input
        description: X-User-ID of the attending physician present at start; required when requires_physician_presence is true.
        default: null
      - name: scope_reassignment_required
        type: boolean
        source: computed
        description: Set true when the referenced scope is retired while this booking is SCHEDULED.
        default: false
      - name: supply_shortfall_flag
        type: boolean
        source: computed
        description: Set true when the referenced SupplyLot becomes EXHAUSTED while this booking is SCHEDULED and planned_device_count > 0.
        default: false
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.ProcedureBooking.
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED"
      - name: cancel_reason
        type: enum
        source: input
        description: Why the booking was cancelled; null unless status is CANCELLED.
        default: null
        constraints: "PATIENT_REQUEST | CLINICAL_HOLD | SUPPLY_SHORTAGE | SCOPE_UNAVAILABLE"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Branching fork-join: the ORDERED node forks into a skin arm and a serum
  # --- arm whose side-effect sets differ, and both arms rejoin at READ.
  - entity: AllergyTestOrder
    initial_state: ORDERED
    terminal_states: [READ, ABORTED]
    transitions:
      - from: ORDERED
        to: ADMINISTERED
        trigger: "POST /allergy-test-orders/{orderId}/administer"
        actor: AllergyNurse
        preconditions:
          - "order.status == ORDERED"
          - "order.method IN {SKIN_PRICK, INTRADERMAL}"
          - "patient.dermatographism == false"
          - "patient.antihistamine_last_dose_at IS NULL OR (clock - patient.antihistamine_last_dose_at) >= WASHOUT_HOURS[order.method] (72 hours for both skin methods)"
          - "patient.epinephrine_on_file == true whenever patient.risk_score >= 45"
        side_effects:
          - "order.administered_at := clock; order.administered_by_user_id := X-User-ID"
          - "order.observation_required_minutes := calculations.observation_minutes_required with context = order.method"
        note: "Skin arm of the fork. The washout check is business_temporal (priority 11) and the epinephrine check is business_safety (priority 10), so a request violating both returns ERR_EPINEPHRINE_NOT_ON_FILE."
      - from: ORDERED
        to: SERUM_PENDING
        trigger: "POST /allergy-test-orders/{orderId}/convert-to-serum"
        actor: AllergyNurse
        preconditions:
          - "order.status == ORDERED"
          - "order.method != SERUM_IGE"
          - "policy.allergy_serum_covered == true for the patient's PayerPolicy"
        side_effects:
          - "order.method := SERUM_IGE"
          - "order.billed_units := ceil(order.antigen_count / 4)"
          - "order.observation_required_minutes := 0 — the SERUM_IGE context returns exactly 0 and bypasses policy.observation_floor_minutes"
        note: "Serum arm of the fork: no observation window, quarter-batched billing units, and the wheal-based dermatographism abort cannot fire on this arm."
      - from: ADMINISTERED
        to: READ
        trigger: "POST /allergy-test-orders/{orderId}/readings"
        actor: AllergyNurse | Otolaryngologist
        preconditions:
          - "order.status == ADMINISTERED"
          - "(clock - order.administered_at) >= order.observation_required_minutes"
          - "payload.positive_antigen_count <= order.antigen_count"
          - "payload.positive_antigen_count < order.antigen_count (an all-positive skin panel takes the ABORTED branch instead)"
        side_effects:
          - "order.billed_units, order.practice_charge_cents, order.patient_responsibility_cents := calculations.allergy_panel_billing"
          - "patient.sensitized_antigen_count recomputed as the capped sum over the patient's READ orders"
          - "patient.risk_score recomputed by calculations.patient_anaphylaxis_risk_score under patient.risk_score_variant"
          - "patient.supervision_tier recomputed (PHYSICIAN_PRESENT once risk_score >= 60)"
      - from: SERUM_PENDING
        to: READ
        trigger: "POST /allergy-test-orders/{orderId}/readings"
        actor: AllergyNurse | Otolaryngologist
        preconditions:
          - "order.status == SERUM_PENDING"
          - "payload.positive_antigen_count <= order.antigen_count"
        side_effects:
          - "order.billed_units, order.practice_charge_cents, order.patient_responsibility_cents := calculations.allergy_panel_billing with the SERUM_IGE unit price and quarter-batched units"
          - "patient.sensitized_antigen_count recomputed; patient.risk_score recomputed; patient.supervision_tier recomputed"
        note: "Join node of the fork. Reached with no observation wait, which is what distinguishes it from the ADMINISTERED arm."
      - from: ADMINISTERED
        to: ABORTED
        trigger: "POST /allergy-test-orders/{orderId}/readings with payload.positive_antigen_count == order.antigen_count"
        actor: AllergyNurse | Otolaryngologist
        preconditions:
          - "order.status == ADMINISTERED"
          - "order.method IN {SKIN_PRICK, INTRADERMAL}"
        side_effects:
          - "order.abort_reason := DERMATOGRAPHISM_DETECTED; order.practice_charge_cents := 0; order.patient_responsibility_cents := 0"
          - "hop 2 — caused by the abort: patient.dermatographism := true, which permanently blocks the skin arm of every later order for this patient"
        note: "An all-positive skin panel is a dermatographism artefact, not a result: nothing is billed and the patient is flagged."
      - from: ADMINISTERED
        to: ABORTED
        trigger: "POST /reaction-events with allergy_test_order_id set and systemic_grade >= 2"
        actor: AllergyNurse
        preconditions:
          - "order.status == ADMINISTERED"
          - "the ReactionEvent carries allergy_test_order_id == order.id"
        side_effects:
          - "order.worst_systemic_grade := max(order.worst_systemic_grade, event.systemic_grade); order.abort_reason := SYSTEMIC_REACTION"
          - "order.practice_charge_cents := 0; order.patient_responsibility_cents := 0"
          - "hop 2 — caused by the abort: patient.risk_score_variant := POST_REACTION and patient.risk_score recomputed under that variant"
          - "hop 3 — caused by the risk_score change reaching >= 60: patient.supervision_tier := PHYSICIAN_PRESENT"

  - entity: ImmunotherapyVial
    initial_state: MIXED
    terminal_states: [EXHAUSTED, DISCARDED]
    transitions:
      - from: MIXED
        to: LABEL_VERIFIED
        trigger: "POST /immunotherapy-vials/{vialId}/label-verification"
        actor: AllergyNurse
        preconditions:
          - "vial.status == MIXED"
          - "X-User-ID != vial.mixed_by_user_id (segregation of duties)"
          - "payload.label_text_confirmation == vial.label_text"
          - "clock < vial.expires_at"
        side_effects:
          - "vial.verified_by_user_id := X-User-ID"
          - "patient.immunotherapy_status := BUILD_UP when patient.immunotherapy_escalation_step <= 6, else MAINTENANCE"
      - from: LABEL_VERIFIED
        to: IN_USE
        trigger: "system — first successful POST /immunotherapy-doses drawn from this vial"
        actor: system
        preconditions:
          - "vial.status == LABEL_VERIFIED"
        side_effects:
          - "vial.volume_ml_remaining := vial.volume_ml_initial - dose.volume_ml; vial.volume_ml_dispensed_total := dose.volume_ml"
      - from: IN_USE
        to: EXHAUSTED
        trigger: "system — evaluated after every dose administration and every dose void"
        actor: system
        preconditions:
          - "vial.volume_ml_remaining < MIN_DOSE_ML (0.05)"
        side_effects:
          - "no volume moves; the vial simply stops being a valid dose source"
      - from: MIXED
        to: DISCARDED
        trigger: "POST /immunotherapy-vials/{vialId}/discard"
        actor: AllergyNurse
        preconditions:
          - "vial.status IN {MIXED, LABEL_VERIFIED, IN_USE}"
          - "payload.discard_reason IN {BEYOND_USE_DATE, CONTAMINATION}"
        side_effects:
          - "vial.volume_ml_wasted := vial.volume_ml_remaining; vial.volume_ml_remaining := 0.00; vial.discard_reason := payload.discard_reason"
        note: "Same transition is declared from LABEL_VERIFIED and IN_USE; the conserved-volume identity volume_ml_initial == volume_ml_remaining + volume_ml_dispensed_total + volume_ml_wasted must still hold afterwards."
      - from: LABEL_VERIFIED
        to: DISCARDED
        trigger: "system — a newly created ImmunotherapyVial for the same patient supersedes this one"
        actor: system
        preconditions:
          - "vial.status IN {LABEL_VERIFIED, IN_USE}"
          - "the new vial's patient_id == this vial's patient_id"
        side_effects:
          - "vial.discard_reason := SUPERSEDED; vial.volume_ml_wasted := vial.volume_ml_remaining; vial.volume_ml_remaining := 0.00"
          - "patient.version increments by 1 (the OCC observation point of concurrency_rules.vial-create-stale-patient)"
      - from: IN_USE
        to: DISCARDED
        trigger: "POST /immunotherapy-vials/{vialId}/discard or the supersede side effect above"
        actor: AllergyNurse | system
        preconditions:
          - "vial.status == IN_USE"
        side_effects:
          - "vial.volume_ml_wasted := vial.volume_ml_remaining; vial.volume_ml_remaining := 0.00"

  - entity: ImmunotherapyDose
    initial_state: ADMINISTERED
    terminal_states: [CLEARED, VOIDED]
    transitions:
      - from: ADMINISTERED
        to: CLEARED
        trigger: "POST /immunotherapy-doses/{doseId}/clear-observation"
        actor: AllergyNurse
        preconditions:
          - "dose.status == ADMINISTERED"
          - "(clock - dose.administered_at) >= dose.observation_required_minutes"
          - "dose.reaction_grade <= 1"
        side_effects:
          - "dose.observation_cleared_at := clock"
          - "patient.immunotherapy_escalation_step := min(12, dose.escalation_step_at_dose + 1)"
          - "patient.immunotherapy_status := BUILD_UP when the new step <= 6 else MAINTENANCE"
          - "vial transitions IN_USE -> EXHAUSTED when vial.volume_ml_remaining < 0.05"
      - from: ADMINISTERED
        to: REACTION_HELD
        trigger: "POST /reaction-events with immunotherapy_dose_id set and systemic_grade >= 2"
        actor: AllergyNurse
        preconditions:
          - "dose.status == ADMINISTERED"
        side_effects:
          - "hop 1: dose.status := REACTION_HELD; dose.reaction_grade := max(dose.reaction_grade, event.systemic_grade)"
          - "hop 2 — caused by hop 1: patient.immunotherapy_escalation_step := max(1, dose.escalation_step_at_dose - 2); patient.immunotherapy_status := HELD; patient.risk_score_variant := POST_REACTION; patient.risk_score recomputed under the POST_REACTION variant"
          - "hop 3 — caused by the hop-2 risk_score change reaching >= 60: patient.supervision_tier := PHYSICIAN_PRESENT, and every AllergyTestOrder of this patient in status ORDERED has observation_required_minutes recomputed"
          - "hop 4 — caused by the hop-3 supervision_tier change: every ImmunotherapyVial of this patient in {LABEL_VERIFIED, IN_USE} gets requires_supervised_administration := true, and every ProcedureBooking of this patient in status SCHEDULED gets requires_physician_presence := true"
        note: "Four-hop transitive cascade; each hop is caused by the preceding hop's mutation, not by the original POST."
      - from: ADMINISTERED
        to: VOIDED
        trigger: "POST /immunotherapy-doses/{doseId}/void"
        actor: AllergyNurse
        preconditions:
          - "dose.status == ADMINISTERED"
          - "dose.observation_cleared_at IS NULL"
          - "(clock - dose.administered_at) <= VOID_WINDOW_MINUTES (15)"
        side_effects:
          - "vial.volume_ml_remaining += dose.volume_ml; vial.volume_ml_dispensed_total -= dose.volume_ml"
          - "vial transitions EXHAUSTED -> IN_USE when the returned volume brings volume_ml_remaining back to >= 0.05"
          - "patient.last_dose_administered_at := administered_at of the patient's most recent remaining dose whose status is in {ADMINISTERED, CLEARED, REACTION_HELD}, else null"
          - "patient.immunotherapy_escalation_step is left untouched (the void neither advances nor reduces the schedule)"
        note: "Compensating action for the extract-volume invariant; see calculations.immunotherapy_vial_volume_ledger."

  # --- Cyclic: INFO_REQUESTED -> AUTH_SUBMITTED closes a revision loop, and
  # --- AUTH_EXPIRED -> AUTH_SUBMITTED closes a second, longer loop.
  - entity: SinuplastyCase
    initial_state: DRAFT
    terminal_states: [DENIED, COMPLETED]
    transitions:
      - from: DRAFT
        to: DOCUMENTED
        trigger: "POST /sinuplasty-cases/{caseId}/documentation"
        actor: Otolaryngologist
        preconditions:
          - "case.status == DRAFT"
          - "payload.documented_therapies is a non-empty array"
          - "every therapy item has start_date <= end_date"
        side_effects:
          - "case.documented_therapies, case.documented_criteria_codes, case.ct_study_date := payload"
          - "case.documented_by_user_id := X-User-ID"
          - "case.evaluation_variant, case.criteria_met_count, case.contiguous_management_days, case.cumulative_management_days, case.candidacy_status := calculations.sinuplasty_candidacy_evaluation"
      - from: DOCUMENTED
        to: AUTH_SUBMITTED
        trigger: "POST /sinuplasty-cases/{caseId}/authorization-submissions"
        actor: PayerLiaison
        preconditions:
          - "case.status == DOCUMENTED"
          - "policy.requires_prior_auth == true"
          - "case.candidacy_status == ELIGIBLE"
        side_effects:
          - "case.submitted_by_user_id := X-User-ID"
          - "case.pinned_policy_version := PayerPolicy.version as read at this instant"
      - from: AUTH_SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /sinuplasty-cases/{caseId}/payer-decisions with decision INFO_REQUESTED"
        actor: PayerLiaison
        preconditions:
          - "case.status == AUTH_SUBMITTED"
          - "X-User-ID != case.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "case.payer_reference := payload.payer_reference"
      - from: INFO_REQUESTED
        to: AUTH_SUBMITTED
        trigger: "POST /sinuplasty-cases/{caseId}/authorization-submissions"
        actor: PayerLiaison
        preconditions:
          - "case.status == INFO_REQUESTED"
          - "case.revision_round < 2"
        side_effects:
          - "case.revision_round += 1"
          - "case.submitted_by_user_id := X-User-ID; case.pinned_policy_version := PayerPolicy.version as read at this instant"
        note: "Revision loop. The third submission attempt (revision_round already 2) is rejected with ERR_REVISION_LIMIT_REACHED."
      - from: AUTH_SUBMITTED
        to: AUTHORIZED
        trigger: "POST /sinuplasty-cases/{caseId}/payer-decisions with decision APPROVED"
        actor: PayerLiaison
        preconditions:
          - "case.status == AUTH_SUBMITTED"
          - "X-User-ID != case.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "case.authorized_device_count := min(case.planned_device_count, policy.max_balloon_devices)"
          - "case.auth_expires_at := clock + policy.auth_validity_days days"
          - "case.payer_reference := payload.payer_reference"
      - from: AUTH_SUBMITTED
        to: DENIED
        trigger: "POST /sinuplasty-cases/{caseId}/payer-decisions with decision DENIED"
        actor: PayerLiaison
        preconditions:
          - "case.status == AUTH_SUBMITTED"
          - "X-User-ID != case.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "case.authorized_device_count := 0; case.payer_reference := payload.payer_reference"
      - from: AUTHORIZED
        to: AUTH_EXPIRED
        trigger: "system — evaluated at POST /procedure-bookings for a BALLOON_SINUPLASTY on this case"
        actor: system
        preconditions:
          - "case.status == AUTHORIZED"
          - "clock >= case.auth_expires_at"
        side_effects:
          - "case.status := AUTH_EXPIRED is persisted first, then the booking request is rejected with ERR_AUTHORIZATION_EXPIRED (409); no booking row is created"
        note: "Lazy expiry: the case is moved to AUTH_EXPIRED as a durable side effect of the rejected scheduling attempt, so a follow-up GET observes AUTH_EXPIRED."
      - from: AUTH_EXPIRED
        to: AUTH_SUBMITTED
        trigger: "POST /sinuplasty-cases/{caseId}/authorization-submissions"
        actor: PayerLiaison
        preconditions:
          - "case.status == AUTH_EXPIRED"
        side_effects:
          - "case.revision_round := 0; case.authorized_device_count := 0; case.auth_expires_at := null"
          - "case.submitted_by_user_id := X-User-ID; case.pinned_policy_version := PayerPolicy.version as read at this instant"
        note: "Second, longer cycle: an expired authorization re-enters the payer loop with a fresh revision budget."
      - from: AUTHORIZED
        to: SCHEDULED
        trigger: "system — successful POST /procedure-bookings with procedure_type BALLOON_SINUPLASTY referencing this case"
        actor: system
        preconditions:
          - "case.status == AUTHORIZED"
          - "clock < case.auth_expires_at"
          - "booking.planned_device_count == case.authorized_device_count"
        side_effects:
          - "case.status := SCHEDULED"
      - from: DOCUMENTED
        to: SCHEDULED
        trigger: "system — successful POST /procedure-bookings with procedure_type BALLOON_SINUPLASTY referencing this case"
        actor: system
        preconditions:
          - "case.status == DOCUMENTED"
          - "policy.requires_prior_auth == false"
          - "case.candidacy_status == ELIGIBLE"
        side_effects:
          - "case.status := SCHEDULED"
        note: "Self-pay / no-auth path: the CLINICAL_BROAD variant governs candidacy and no payer round trip happens at all."
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system — POST /procedure-bookings/{bookingId}/complete"
        actor: system
        preconditions:
          - "case.status == SCHEDULED"
        side_effects:
          - "case.status := COMPLETED"
      - from: SCHEDULED
        to: AUTHORIZED
        trigger: "system — POST /procedure-bookings/{bookingId}/cancel"
        actor: system
        preconditions:
          - "case.status == SCHEDULED"
          - "case.auth_expires_at IS NOT NULL"
        side_effects:
          - "case.status := AUTHORIZED (compensation: the case returns to the schedulable pool with its original auth_expires_at and pinned_policy_version)"
      - from: SCHEDULED
        to: DOCUMENTED
        trigger: "system — POST /procedure-bookings/{bookingId}/cancel"
        actor: system
        preconditions:
          - "case.status == SCHEDULED"
          - "case.auth_expires_at IS NULL (the self-pay path)"
        side_effects:
          - "case.status := DOCUMENTED"

  - entity: DiagnosticStudy
    initial_state: ORDERED
    terminal_states: [INTERPRETED]
    transitions:
      - from: ORDERED
        to: PERFORMED
        trigger: "POST /diagnostic-studies/{studyId}/results"
        actor: Audiologist
        preconditions:
          - "study.status == ORDERED"
          - "study_type == AUDIOMETRY requires pta_db_hl and word_recognition_pct and forbids ahi"
          - "study_type IN {SLEEP_HSAT, SLEEP_PSG} requires ahi and forbids pta_db_hl and word_recognition_pct"
        side_effects:
          - "study.performed_at := clock; study.performed_by_user_id := X-User-ID"
      - from: PERFORMED
        to: INTERPRETED
        trigger: "POST /diagnostic-studies/{studyId}/interpretation"
        actor: Otolaryngologist | Audiologist
        preconditions:
          - "study.status == PERFORMED"
          - "X-User-ID != study.performed_by_user_id (segregation of duties)"
        side_effects:
          - "study.recommendation := calculations.study_recommendation"
          - "study.interpreted_by_user_id := X-User-ID"

  # --- Parallel dimensions: fit_status and billing_status advance on
  # --- independent triggers, owned by different roles.
  - entity: DeviceDispense
    initial_state: FITTED
    terminal_states: [FINALIZED, RETURNED]
    transitions:
      - from: FITTED
        to: ADJUSTED
        trigger: "POST /device-dispenses/{dispenseId}/adjustments"
        actor: Audiologist
        preconditions:
          - "dispense.fit_status IN {FITTED, ADJUSTED}"
          - "dispense.adjustment_count < MAX_ADJUSTMENTS (3)"
          - "clock < dispense.trial_end_at"
        side_effects:
          - "dispense.adjustment_count += 1; dispense.billing_status is untouched"
        note: "Self-loop from ADJUSTED to ADJUSTED is permitted while adjustment_count < 3; the fourth adjustment is rejected with ERR_ADJUSTMENT_LIMIT_REACHED."
      - from: ADJUSTED
        to: FINALIZED
        trigger: "POST /device-dispenses/{dispenseId}/finalize"
        actor: Audiologist
        preconditions:
          - "dispense.fit_status IN {FITTED, ADJUSTED}"
          - "clock >= dispense.trial_end_at"
          - "dispense.billing_status == INVOICED"
        side_effects:
          - "dispense.billing_status := RETAINED (the financial dimension advances with the fitting dimension only on this transition)"
      - from: FITTED
        to: RETURNED
        trigger: "POST /device-dispenses/{dispenseId}/trial-return"
        actor: Audiologist
        preconditions:
          - "dispense.fit_status IN {FITTED, ADJUSTED}"
          - "dispense.billing_status == INVOICED"
        side_effects:
          - "dispense.days_used, dispense.refund_variant, dispense.restock_fee_cents, dispense.refund_cents := calculations.device_trial_refund"
          - "dispense.billing_status := REFUND_PENDING when refund_variant == IN_TRIAL, or RETAINED when refund_variant == POST_TRIAL"
        note: "Divergent branch on the billing axis: the IN_TRIAL branch owes money and needs a settlement, the POST_TRIAL branch owes nothing and is financially terminal."
      - from: ADJUSTED
        to: RETURNED
        trigger: "POST /device-dispenses/{dispenseId}/trial-return"
        actor: Audiologist
        preconditions:
          - "dispense.fit_status == ADJUSTED"
          - "dispense.billing_status == INVOICED"
        side_effects:
          - "identical to the FITTED -> RETURNED transition; adjustment_count is preserved in the refund record"
      - from: RETURNED
        to: RETURNED
        trigger: "POST /device-dispenses/{dispenseId}/refund-settlement"
        actor: PracticeAdmin
        preconditions:
          - "dispense.fit_status == RETURNED"
          - "dispense.billing_status == REFUND_PENDING"
          - "X-User-ID != dispense.dispensed_by_user_id (segregation of duties)"
        side_effects:
          - "dispense.billing_status := REFUNDED; dispense.settled_by_user_id := X-User-ID"
          - "supply lot: quantity_consumed -= 1 and quantity_wasted += 1 (a returned device is written off, never restocked), leaving quantity_received == quantity_on_hand + quantity_consumed + quantity_wasted unchanged"
        note: "Pure billing-axis transition: fit_status does not move, which is what makes the two dimensions independent."

  # --- Cyclic: READY -> IN_USE -> SOILED -> REPROCESSING -> READY, with a
  # --- QUARANTINED -> REPROCESSING retry arc.
  - entity: EndoscopeAsset
    initial_state: READY
    terminal_states: [RETIRED]
    transitions:
      - from: READY
        to: IN_USE
        trigger: "system — POST /procedure-bookings/{bookingId}/start for a booking referencing this scope"
        actor: system
        preconditions:
          - "scope.status == READY"
          - "scope.last_reprocessed_at IS NULL OR clock < scope.hld_expires_at"
        side_effects:
          - "scope.last_used_by_user_id := booking.physician_user_id"
      - from: IN_USE
        to: SOILED
        trigger: "system — POST /procedure-bookings/{bookingId}/complete"
        actor: system
        preconditions:
          - "scope.status == IN_USE"
        side_effects:
          - "scope.hld_expires_at := null (the previous disinfection is void once the scope is used)"
      - from: SOILED
        to: REPROCESSING
        trigger: "POST /endoscopes/{scopeId}/reprocessing-start"
        actor: SterileProcessingTech
        preconditions:
          - "scope.status IN {SOILED, QUARANTINED}"
        side_effects:
          - "scope.reprocessing_started_by_user_id := X-User-ID"
      - from: QUARANTINED
        to: REPROCESSING
        trigger: "POST /endoscopes/{scopeId}/reprocessing-start"
        actor: SterileProcessingTech
        preconditions:
          - "scope.status == QUARANTINED"
          - "scope.consecutive_mec_failures < 2"
        side_effects:
          - "scope.reprocessing_started_by_user_id := X-User-ID"
        note: "Retry arc that closes the cycle from the quarantine branch."
      - from: REPROCESSING
        to: READY
        trigger: "POST /endoscopes/{scopeId}/reprocessing-completion with leak_test_passed true and, when required, mec_test_passed true"
        actor: SterileProcessingTech
        preconditions:
          - "scope.status == REPROCESSING"
          - "X-User-ID == scope.reprocessing_started_by_user_id (run continuity)"
          - "payload.leak_test_passed == true"
          - "payload.mec_test_passed == true whenever scope.mec_test_due == true"
        side_effects:
          - "scope.cycle_count += 1; scope.last_reprocessed_at := clock; scope.hld_expires_at := clock + HLD_SHELF_LIFE_HOURS (168) hours"
          - "scope.consecutive_mec_failures := 0; scope.mec_test_due recomputed as ((cycle_count + 1) mod 10 == 0); scope.reprocessing_started_by_user_id := null"
      - from: REPROCESSING
        to: QUARANTINED
        trigger: "POST /endoscopes/{scopeId}/reprocessing-completion with leak_test_passed false or mec_test_passed false"
        actor: SterileProcessingTech
        preconditions:
          - "scope.status == REPROCESSING"
          - "X-User-ID == scope.reprocessing_started_by_user_id"
        side_effects:
          - "hop 1: scope.consecutive_mec_failures += 1; scope.cycle_count is NOT incremented; scope.reprocessing_started_by_user_id := null"
      - from: QUARANTINED
        to: RETIRED
        trigger: "system — evaluated immediately after a failing reprocessing completion"
        actor: system
        preconditions:
          - "scope.consecutive_mec_failures == 2"
        side_effects:
          - "hop 2 — caused by hop 1's counter reaching 2: scope.status := RETIRED"
          - "hop 3 — caused by hop 2: every ProcedureBooking referencing this scope whose status is SCHEDULED gets scope_reassignment_required := true, which blocks its start"

  - entity: SupplyLot
    initial_state: ACTIVE
    terminal_states: [QUARANTINED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system — evaluated after a POST /procedure-bookings reservation, a POST /device-dispenses unit draw, and a WRITE_OFF or QUARANTINE POST /supply-lots/{lotId}/adjustments. These are the only three operations that can lower available_quantity."
        actor: system
        preconditions:
          - "lot.available_quantity == 0"
        side_effects:
          - "every ProcedureBooking in status SCHEDULED whose supply_lot_id is this lot and whose planned_device_count > 0 gets supply_shortfall_flag := true"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system — evaluated after a booking cancellation releases a reservation or a RECEIVE adjustment adds units"
        actor: system
        preconditions:
          - "lot.available_quantity > 0"
        side_effects:
          - "every ProcedureBooking in status SCHEDULED whose supply_lot_id is this lot gets supply_shortfall_flag := false"
        note: "Closes the ACTIVE <-> EXHAUSTED loop; the flag on sibling bookings is reversed, so no drift accumulates."
      - from: ACTIVE
        to: QUARANTINED
        trigger: "POST /supply-lots/{lotId}/adjustments with reason QUARANTINE"
        actor: PracticeAdmin
        preconditions:
          - "lot.status IN {ACTIVE, EXHAUSTED}"
        side_effects:
          - "delta := lot.available_quantity; lot.quantity_wasted += delta; lot.quantity_on_hand -= delta"
          - "lot.status := QUARANTINED; existing reservations are left intact so in-flight bookings keep their units"

  # --- Posture-driven and cyclic: OPEN <-> FULL is driven purely by derived
  # --- utilization, and the posture gates child booking creation.
  - entity: SurgeryCenterBlock
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system — evaluated after every booking create, cancel or completion touching this block"
        actor: system
        preconditions:
          - "block.utilization_bps >= 10000"
        side_effects:
          - "no child mutation; the posture itself blocks POST /procedure-bookings with ERR_BLOCK_NOT_OPEN"
      - from: FULL
        to: OPEN
        trigger: "system — evaluated after every booking cancellation touching this block"
        actor: system
        preconditions:
          - "block.utilization_bps < 10000"
        side_effects:
          - "the block accepts new bookings again"
      - from: OPEN
        to: CLOSED
        trigger: "POST /surgery-center-blocks/{blockId}/close"
        actor: PracticeAdmin
        preconditions:
          - "block.status IN {OPEN, FULL}"
        side_effects:
          - "no booking may be created against a CLOSED block; bookings already SCHEDULED keep their slots and may still start"
      - from: FULL
        to: CLOSED
        trigger: "POST /surgery-center-blocks/{blockId}/close"
        actor: PracticeAdmin
        preconditions:
          - "block.status == FULL"
        side_effects:
          - "same as OPEN -> CLOSED"

  - entity: ProcedureBooking
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /procedure-bookings/{bookingId}/start"
        actor: Otolaryngologist
        preconditions:
          - "booking.status == SCHEDULED"
          - "X-User-ID == booking.physician_user_id"
          - "booking.scope_reassignment_required == false"
          - "payload.attending_physician_user_id is present whenever booking.requires_physician_presence == true"
          - "when endoscope_asset_id is set: scope.status == READY and (scope.last_reprocessed_at IS NULL or clock < scope.hld_expires_at)"
          - "when procedure_type == BALLOON_SINUPLASTY: case.pinned_policy_version == PayerPolicy.version (no revision drift since authorization)"
        side_effects:
          - "scope transitions READY -> IN_USE and scope.last_used_by_user_id := booking.physician_user_id"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /procedure-bookings/{bookingId}/complete"
        actor: Otolaryngologist
        preconditions:
          - "booking.status == IN_PROGRESS"
          - "payload.devices_used_count <= booking.planned_device_count"
        side_effects:
          - "lot.quantity_reserved -= booking.planned_device_count; lot.quantity_consumed += payload.devices_used_count; lot.quantity_on_hand -= payload.devices_used_count"
          - "scope transitions IN_USE -> SOILED with hld_expires_at cleared; case transitions SCHEDULED -> COMPLETED"
        note: "available_quantity cannot fall here: the released reservation (planned_device_count) is always at least as large as the consumed count (devices_used_count), so no ACTIVE -> EXHAUSTED transition can originate from a completion. The four-bucket identity quantity_received == quantity_on_hand + quantity_consumed + quantity_wasted is preserved."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /procedure-bookings/{bookingId}/cancel"
        actor: PracticeAdmin | Otolaryngologist
        preconditions:
          - "booking.status == SCHEDULED"
          - "payload.cancel_reason is a declared enum member"
        side_effects:
          - "lot.quantity_reserved -= booking.planned_device_count (units return to available; quantity_received == quantity_on_hand + quantity_consumed + quantity_wasted is unchanged)"
          - "lot transitions EXHAUSTED -> ACTIVE when available_quantity rises above 0"
          - "block.booked_case_count -= 1; block.booked_minutes -= booking.duration_minutes; block.utilization_bps recomputed; block transitions FULL -> OPEN when utilization_bps < 10000"
          - "case transitions SCHEDULED -> AUTHORIZED (or SCHEDULED -> DOCUMENTED on the self-pay path)"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: vial-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /immunotherapy-vials"
    occ_field: "expected_patient_version"
    description: |
      Compounding a new vial for a patient whose version has advanced since the
      client last read it is rejected. A new vial legitimately supersedes the
      patient's current LABEL_VERIFIED or IN_USE vial (which is discarded with
      reason SUPERSEDED), so the write is semantically valid from a fresh view;
      the stale-version check is what stops a compounder from superseding a vial
      they never saw, or from mixing against an escalation step that a cleared
      dose or a recorded reaction has already moved.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: dispense-create-stale-study
    parent_entity: DiagnosticStudy
    write_endpoint: "POST /device-dispenses"
    occ_field: "expected_study_version"
    description: |
      Dispensing a device against a DiagnosticStudy whose version has advanced
      since the client last read it is rejected. A second dispense against the
      same interpreted study is legitimate — it supersedes the earlier unit and
      increments superseded_dispense_count — so the operation cannot be gated by
      state alone; the stale-version check is what stops an audiologist from
      superseding a dispense that is not in their view of the study.
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: patient_age_months
    trigger: "On every Patient read and on every mutation of a Patient row; consumed by observation sizing, risk scoring and pediatric venue routing."
    algorithm: threshold
    formula: |
      dob   := Patient.date_of_birth (calendar date)
      today := logical clock date (UTC)
      age_months := (today.year - dob.year) * 12
                  + (today.month - dob.month)
                  - (1 if today.day < dob.day else 0)
    input_set: "The single Patient row; no other rows participate."
    constants:
      PEDIATRIC_RISK_AGE_MONTHS: 72
      OVERNIGHT_OBSERVATION_AGE_MONTHS: 36
    precision: "Whole months, truncated toward zero by the day-of-month borrow term. No rounding."
    examples:
      - "date_of_birth 2024-03-15, clock 2026-08-01T00:00:00Z -> 28 (day borrow applies: 1 < 15)"
      - "date_of_birth 2023-08-01, clock 2026-08-01T00:00:00Z -> 36 (no borrow; exactly on the OVERNIGHT_OBSERVATION_AGE_MONTHS boundary, so overnight observation is NOT required)"
      - "date_of_birth 2021-02-14, clock 2026-08-05T00:00:00Z -> 65"
      - "date_of_birth 1985-04-12, clock 2026-08-01T00:00:00Z -> 495"

  - name: allergy_panel_billing
    trigger: "On POST /allergy-test-orders/{orderId}/readings when the order moves ADMINISTERED -> READ or SERUM_PENDING -> READ."
    algorithm: tiered_pricing
    formula: |
      antigen_count := PANEL_ANTIGEN_COUNT[order.panel_code]
      unit_cents    := METHOD_UNIT_CENTS[order.method]
      tier_factor   := 1.0000            when antigen_count <= 12
                       0.9250            when 13 <= antigen_count <= 30
                       0.8500            when antigen_count >= 31
      # PINNED ORDER — per-unit rounding happens FIRST, then multiplication:
      per_unit_gross_cents := round_half_up(unit_cents * tier_factor)
      billed_units := antigen_count                       when method IN {SKIN_PRICK, INTRADERMAL}
                      ceil(antigen_count / 4)             when method == SERUM_IGE
      practice_charge_cents := per_unit_gross_cents * billed_units
      per_unit_patient_cents := round_half_up(
          per_unit_gross_cents * (10000 - policy.covered_pct_bps) / 10000)
      patient_responsibility_cents := per_unit_patient_cents * billed_units
    input_set: |
      The single AllergyTestOrder being read, plus the PayerPolicy reached through
      Patient.payer_policy_id. An ABORTED order is never billed (both money fields
      are forced to 0), so orders in status ORDERED, ADMINISTERED, SERUM_PENDING
      and ABORTED contribute nothing.
    constants:
      PANEL_ANTIGEN_COUNT: { ENV_36: 36, FOOD_24: 24, MOLD_12: 12, VENOM_5: 5 }
      METHOD_UNIT_CENTS: { SKIN_PRICK: 1775, INTRADERMAL: 2240, SERUM_IGE: 3310 }
      TIER_SMALL_MAX_ANTIGENS: 12
      TIER_MID_MAX_ANTIGENS: 30
      TIER_FACTOR_SMALL: 1.0000
      TIER_FACTOR_MID: 0.9250
      TIER_FACTOR_LARGE: 0.8500
      SERUM_BATCH_SIZE: 4
    precision: |
      Integer cents, round_half_up. The two multiplications are NOT commutable with
      the rounding: round_half_up per unit and then multiply by billed_units. Rounding
      the extended amount instead would yield 54315 rather than 54324 for ENV_36 /
      SKIN_PRICK, and 25322/5064 rather than 25326/5067 for ENV_36 / SERUM_IGE.
    examples:
      - "ENV_36 + SKIN_PRICK + covered_pct_bps 8000 -> tier 0.8500, per_unit_gross 1509, billed_units 36, practice_charge 54324, per_unit_patient 302, patient_responsibility 10872"
      - "FOOD_24 + SERUM_IGE + covered_pct_bps 5000 -> tier 0.9250, per_unit_gross 3062, billed_units 6, practice_charge 18372, patient_responsibility 9186"
      - "MOLD_12 + INTRADERMAL + covered_pct_bps 7000 -> tier 1.0000, per_unit_gross 2240, billed_units 12, practice_charge 26880, patient_responsibility 8064"
      - "VENOM_5 + SKIN_PRICK + covered_pct_bps 0 -> practice_charge 8875, patient_responsibility 8875"
      - "ENV_36 + SERUM_IGE + covered_pct_bps 8000 -> billed_units 9, practice_charge 25326, patient_responsibility 5067"

  - name: patient_anaphylaxis_risk_score
    trigger: "Recomputed whenever an AllergyTestOrder reaches READ, whenever a ReactionEvent is recorded for this patient, and whenever the patient's PayerPolicy or epinephrine_on_file flag changes."
    algorithm: weighted_scoring
    formula: |
      base := BASE_POINTS
            + PRIOR_REACTION_POINTS * min(prior_systemic_reaction_count, PRIOR_REACTION_CAP)
            + min(SENSITIZATION_CAP, patient.sensitized_antigen_count)
            + (PEDIATRIC_POINTS if patient.age_months < 72 else 0)
            + (0 if patient.epinephrine_on_file else NO_EPI_POINTS)
      # variant-specific event term, see variants below
      score := clamp(0, 100, base + event_term)
    input_set: |
      prior_systemic_reaction_count and sensitized_antigen_count on the Patient row
      (the latter itself derived only from AllergyTestOrder rows in status READ),
      plus, under the POST_REACTION variant, every ReactionEvent whose patient chain
      resolves to this patient — via allergy_test_order_id or immunotherapy_dose_id.
      ReactionEvent rows are append-only, so this input set never shrinks.
    constants:
      BASE_POINTS: 5
      PRIOR_REACTION_POINTS: 15
      PRIOR_REACTION_CAP: 3
      SENSITIZATION_CAP: 20
      PEDIATRIC_POINTS: 8
      NO_EPI_POINTS: 10
      EVENT_GRADE_POINTS: 20
      DECAY_FRESH_DAYS: 30
      DECAY_MID_DAYS: 90
      DECAY_STALE_DAYS: 180
      DECAY_FACTOR_FRESH: 1.00
      DECAY_FACTOR_MID: 0.60
      DECAY_FACTOR_STALE: 0.30
      SUPERVISION_TIER_THRESHOLD: 60
      OBSERVATION_ESCALATION_THRESHOLD: 45
    precision: |
      Integer points. Each event contribution is round_half_up individually and only
      then summed, so rounding cannot accumulate across events. Final clamp to 0..100.
    variants:
      - name: PROVISIONAL
        when: "patient.risk_score_variant == PROVISIONAL — the patient has never had a grade >= 2 systemic reaction recorded."
        difference: "event_term := 0. Recorded grade 0 and grade 1 events are ignored entirely; only the base terms contribute."
      - name: POST_REACTION
        when: "patient.risk_score_variant == POST_REACTION — set permanently the first time a ReactionEvent with systemic_grade >= 2 is recorded for this patient."
        difference: |
          event_term := sum over every ReactionEvent of this patient of
            round_half_up(EVENT_GRADE_POINTS * event.systemic_grade * decay_factor),
          where days_ago := floor((clock - event.occurred_at) / 24h) and
            decay_factor := 1.00 when days_ago <= 30
                            0.60 when 31 <= days_ago <= 90
                            0.30 when 91 <= days_ago <= 180
                            0.00 when days_ago > 180.
          Events are summed in ascending occurred_at order, then created_at ascending
          as the tie-break; id is never consulted.
    examples:
      - "PROVISIONAL, prior 2, sensitized 10, adult, epinephrine on file -> 45 (exactly the OBSERVATION_ESCALATION_THRESHOLD)"
      - "PROVISIONAL, prior 2, sensitized 9, adult, epinephrine on file -> 44 (one point below the threshold)"
      - "PROVISIONAL, prior 2, sensitized 0, adult, epinephrine NOT on file -> 45"
      - "POST_REACTION, prior 2, sensitized 10, adult, epinephrine on file, one grade-3 event 0 days ago -> 100 (105 before the clamp)"
      - "POST_REACTION, prior 2, sensitized 10, adult, epinephrine on file, one grade-1 event 61 days ago -> 57 (45 + round_half_up(20*1*0.60) = 45 + 12)"
      - "PROVISIONAL, prior 0, sensitized 0, adult, epinephrine on file -> 5"
      - "PROVISIONAL, prior 0, sensitized 0, age_months 28, epinephrine on file -> 13"

  - name: observation_minutes_required
    trigger: "On POST /allergy-test-orders/{orderId}/administer, on POST /immunotherapy-doses, and whenever a cascade changes patient.risk_score or patient.supervision_tier for a patient holding orders in status ORDERED."
    algorithm: threshold
    formula: |
      if context == SERUM_IGE:
          return 0            # hard bypass: the policy floor does NOT apply
      base := OBSERVATION_BASE_MINUTES[context]        # SKIN_PRICK 30, INTRADERMAL 40, IMMUNO_DOSE 30
      candidate := base
      if patient.risk_score >= OBSERVATION_ESCALATION_THRESHOLD (45):
          candidate := max(candidate, HIGH_RISK_MINUTES)            # 60
      if context == IMMUNO_DOSE and escalation_step >= LATE_STEP_FLOOR (9):
          candidate := max(candidate, LATE_STEP_MINUTES)            # 45
      if patient.supervision_tier == PHYSICIAN_PRESENT:
          candidate := max(candidate, SUPERVISED_MINUTES)           # 90
      return max(candidate, policy.observation_floor_minutes)
    input_set: |
      The Patient row (risk_score, supervision_tier), the administration context
      (the order's method, or IMMUNO_DOSE together with the dose's
      escalation_step_at_dose), and the PayerPolicy floor. No aggregation over
      sibling rows.
    constants:
      OBSERVATION_BASE_MINUTES: { SKIN_PRICK: 30, INTRADERMAL: 40, IMMUNO_DOSE: 30 }
      OBSERVATION_ESCALATION_THRESHOLD: 45
      HIGH_RISK_MINUTES: 60
      LATE_STEP_FLOOR: 9
      LATE_STEP_MINUTES: 45
      SUPERVISED_MINUTES: 90
    precision: "Whole minutes; nested max, so the result is always one of the declared constants or the policy floor."
    examples:
      - "SKIN_PRICK, risk_score 44, STANDARD tier, policy floor 20 -> 30"
      - "SKIN_PRICK, risk_score 45, STANDARD tier, policy floor 20 -> 60 (boundary is >=, not >)"
      - "INTRADERMAL, risk_score 10, STANDARD tier, policy floor 20 -> 40"
      - "INTRADERMAL, risk_score 10, STANDARD tier, policy floor 45 -> 45 (the plan floor dominates)"
      - "IMMUNO_DOSE at escalation_step 9, risk_score 10, STANDARD tier, policy floor 20 -> 45"
      - "IMMUNO_DOSE at escalation_step 3, risk_score 70, PHYSICIAN_PRESENT tier, policy floor 20 -> 90"
      - "SERUM_IGE conversion, risk_score 100, PHYSICIAN_PRESENT tier, policy floor 120 -> 0"

  - name: immunotherapy_next_dose_volume
    trigger: "On POST /immunotherapy-doses, before any volume is drawn from the vial."
    algorithm: threshold
    formula: |
      pre_step := patient.immunotherapy_escalation_step        # 1..12, the step BEFORE rollback
      gap_days := 0 when patient.last_dose_administered_at IS NULL
                  else floor((clock - patient.last_dose_administered_at) / 24h)
      # (1) the required dilution band is read from the PRE-ROLLBACK step:
      required_dilution := BUILD_UP_DILUTION (BLUE_1_100)      when pre_step <= 6
                           MAINTENANCE_DILUTION (YELLOW_1_10)  when pre_step >= 7
      # (2) the gap rollback is applied EXACTLY ONCE, using the pre-rollback band:
      if pre_step <= 6 and gap_days >= BUILD_UP_GAP_DAYS (14):
          step := max(1, pre_step - BUILD_UP_ROLLBACK_STEPS (2))
      elif pre_step >= 7 and gap_days >= MAINTENANCE_GAP_DAYS (28):
          step := max(1, pre_step - MAINTENANCE_ROLLBACK_STEPS (3))
      else:
          step := pre_step
      # (3) the volume is then read from the post-rollback step:
      volume_ml := floor_to_increment(SCHEDULE_ML[step], MIN_DOSE_ML)
      escalation_step_at_dose := step
      gap_days_at_dose := gap_days
    input_set: |
      The Patient row's immunotherapy_escalation_step and last_dose_administered_at,
      and the referenced ImmunotherapyVial's dilution_code. VOIDED doses do not
      contribute to last_dose_administered_at, so a voided dose neither advances the
      schedule nor resets the gap clock.
    constants:
      SCHEDULE_ML: { 1: 0.05, 2: 0.10, 3: 0.20, 4: 0.30, 5: 0.40, 6: 0.50, 7: 0.05, 8: 0.10, 9: 0.20, 10: 0.30, 11: 0.40, 12: 0.50 }
      BUILD_UP_DILUTION: BLUE_1_100
      MAINTENANCE_DILUTION: YELLOW_1_10
      BUILD_UP_GAP_DAYS: 14
      MAINTENANCE_GAP_DAYS: 28
      BUILD_UP_ROLLBACK_STEPS: 2
      MAINTENANCE_ROLLBACK_STEPS: 3
      MIN_DOSE_ML: 0.05
      MAX_STEP: 12
    precision: |
      Millilitres to 2 decimal places, floored to a 0.05 mL increment. The dilution
      band is decided on the PRE-rollback step and the volume on the POST-rollback
      step — evaluating both on the same step is the wrong answer whenever a rollback
      crosses the step-6/step-7 seam.
    examples:
      - "pre_step 8, gap_days 30, vial YELLOW_1_10 -> required_dilution YELLOW_1_10 (maintenance band from pre_step 8), step 5, volume_ml 0.40. Evaluating the band after rollback would have demanded BLUE_1_100 and rejected the vial."
      - "pre_step 8, gap_days 27, vial YELLOW_1_10 -> step 8, volume_ml 0.10 (27 < 28, no rollback)"
      - "pre_step 2, gap_days 14, vial BLUE_1_100 -> step 1, volume_ml 0.05 (floored at step 1)"
      - "pre_step 6, gap_days 21, vial BLUE_1_100 -> step 4, volume_ml 0.30"
      - "pre_step 7, gap_days 0, vial YELLOW_1_10 -> step 7, volume_ml 0.05"

  - name: sinuplasty_candidacy_evaluation
    trigger: "On POST /sinuplasty-cases/{caseId}/documentation and on GET /sinuplasty-cases/{caseId}/candidacy-evaluation."
    algorithm: interval_merge
    formula: |
      therapies := case.documented_therapies sorted by start_date ASC, then end_date ASC
      span_days(t) := (t.end_date - t.start_date).days + 1          # inclusive both ends
      cumulative_management_days := sum of span_days(t) over all therapies
      # merge pass — adjacency counts as contiguous (gap of 0 calendar days):
      merged := []
      for t in therapies:
          if merged is empty or t.start_date > merged.last.end_date + 1 day:
              append (t.start_date, t.end_date) to merged
          else:
              merged.last.end_date := max(merged.last.end_date, t.end_date)
      contiguous_management_days := max over merged of span_days(m), or 0 when empty
      # criteria admissibility depends on the variant, see below
      criteria_met_count := |admissible_codes|
      candidacy_status := ELIGIBLE when criteria_met_count >= policy.min_documented_criteria
                                    AND management_days_metric >= policy.min_medical_management_days
                          else INELIGIBLE
    input_set: |
      case.documented_therapies, case.documented_criteria_codes and case.ct_study_date
      on the single SinuplastyCase row, plus the PayerPolicy reached through the
      patient. Duplicate criteria codes in the payload are deduplicated before counting.
      A case in status DRAFT has candidacy_status UNDETERMINED and participates in no
      evaluation.
    constants:
      ADMISSIBLE_CRITERIA_CODES: [CT_OPACIFICATION, SNOT22_GE_20, FAILED_INCS, FAILED_ABX, FAILED_SALINE, ENDOSCOPY_FINDING]
      THERAPY_CODE_FOR_CRITERION: { FAILED_INCS: INCS, FAILED_ABX: ABX, FAILED_SALINE: SALINE }
      DAYS_PER_MONTH_FOR_CT_AGE: 30
    precision: "Whole days, inclusive of both endpoints. Calendar-date arithmetic only; times of day are not part of the input."
    variants:
      - name: POLICY_STRICT
        when: "policy.requires_prior_auth == true"
        difference: |
          management_days_metric := contiguous_management_days (the longest merged span
          only — separate courses do not add up). A code in
          THERAPY_CODE_FOR_CRITERION is admissible only when documented_therapies
          contains at least one item with that therapy_code. CT_OPACIFICATION is
          admissible only when case.ct_study_date is within
          policy.requires_ct_within_months * 30 days of the logical clock date.
      - name: CLINICAL_BROAD
        when: "policy.requires_prior_auth == false"
        difference: |
          management_days_metric := cumulative_management_days (every documented course
          adds up regardless of gaps). Every declared member of
          ADMISSIBLE_CRITERIA_CODES counts, with no therapy cross-check and no CT
          recency test.
    examples:
      - "Two courses INCS 2026-06-01..2026-06-14 and ABX 2026-06-20..2026-07-03, criteria [CT_OPACIFICATION, FAILED_INCS, FAILED_ABX], ct_study_date 2026-05-01, clock 2026-08-01, policy min_medical_management_days 28 / min_documented_criteria 3: cumulative_management_days 28, contiguous_management_days 14. POLICY_STRICT -> criteria_met_count 3 but 14 < 28 -> INELIGIBLE. CLINICAL_BROAD -> criteria_met_count 3 and 28 >= 28 -> ELIGIBLE."
      - "Adjacent courses INCS 2026-06-01..2026-06-14 and INCS 2026-06-15..2026-06-28: gap is 0 days, so they merge to 2026-06-01..2026-06-28 and contiguous_management_days is 28, not 14."
      - "POLICY_STRICT with criteria [CT_OPACIFICATION, SNOT22_GE_20, FAILED_ABX] but documented_therapies containing only INCS: FAILED_ABX is inadmissible, criteria_met_count 2 -> INELIGIBLE."
      - "POLICY_STRICT with ct_study_date 2025-06-01, clock 2026-08-01, requires_ct_within_months 12 (360 days): the CT is 426 days old, so CT_OPACIFICATION is inadmissible."

  - name: device_trial_refund
    trigger: "On POST /device-dispenses/{dispenseId}/trial-return."
    algorithm: threshold
    formula: |
      days_used := floor((clock - dispense.dispensed_at) / 24h) + 1
      refund_variant := IN_TRIAL   when clock <  dispense.trial_end_at
                        POST_TRIAL when clock >= dispense.trial_end_at
      if refund_variant == POST_TRIAL:
          restock_fee_cents := 0
          refund_cents      := 0
      else:
          restock_fee_cents := max(policy.restock_fee_floor_cents,
                                   round_half_up(dispense.price_cents * policy.restock_fee_bps / 10000))
          wear_cents        := PER_DAY_WEAR_CENTS * days_used
          refund_cents      := max(0, dispense.price_cents - restock_fee_cents - wear_cents)
    input_set: |
      The single DeviceDispense row plus the PayerPolicy reached through
      DiagnosticStudy -> Patient -> PayerPolicy. dispense.trial_end_at was fixed at
      creation as dispensed_at + policy.device_trial_days days, so a later policy
      PATCH does not move an existing trial window.
    constants:
      PER_DAY_WEAR_CENTS: 350
      MAX_ADJUSTMENTS: 3
    precision: |
      Integer cents, round_half_up on the restocking percentage only; the wear charge
      is exact. The variant boundary is half-open: a return at exactly trial_end_at is
      POST_TRIAL and refunds nothing.
    variants:
      - name: IN_TRIAL
        when: "clock < dispense.trial_end_at"
        difference: "A restocking fee and a per-day wear charge are deducted from the price and the remainder is refundable; billing_status moves to REFUND_PENDING."
      - name: POST_TRIAL
        when: "clock >= dispense.trial_end_at"
        difference: "No refund and no restocking fee are computed at all; the device is retained financially and billing_status moves straight to RETAINED."
    examples:
      - "price_cents 289000, restock_fee_bps 1500, restock_fee_floor_cents 12500, days_used 12, IN_TRIAL -> restock_fee_cents 43350, wear 4200, refund_cents 241450"
      - "price_cents 289000, days_used 30, POST_TRIAL -> restock_fee_cents 0, refund_cents 0"
      - "price_cents 60000, restock_fee_bps 1500, restock_fee_floor_cents 12500, days_used 40, IN_TRIAL -> restock_fee_cents 12500 (the 9000 computed fee is raised to the floor), wear 14000, refund_cents 33500"
      - "dispensed_at 2026-08-05T14:00:00Z, clock 2026-08-16T09:30:00Z -> days_used 11 (10 whole days elapsed, plus the day of dispense)"

  - name: study_recommendation
    trigger: "On POST /diagnostic-studies/{studyId}/interpretation."
    algorithm: threshold
    formula: |
      if study.study_type == AUDIOMETRY:
          recommendation := HEARING_AID when study.pta_db_hl >= PTA_HEARING_AID_DB (40)
                            else OBSERVATION
      else:  # SLEEP_HSAT or SLEEP_PSG
          recommendation := OBSERVATION    when study.ahi < AHI_MILD_FLOOR (5)
                            ORAL_APPLIANCE when AHI_MILD_FLOOR <= study.ahi <= AHI_APPLIANCE_CEILING (30)
                            CPAP           when study.ahi > AHI_APPLIANCE_CEILING
    input_set: "The single DiagnosticStudy row in status PERFORMED; ORDERED studies have no results to interpret."
    constants:
      PTA_HEARING_AID_DB: 40
      AHI_MILD_FLOOR: 5
      AHI_APPLIANCE_CEILING: 30
      DEVICE_TYPE_FOR_RECOMMENDATION: { HEARING_AID: HEARING_AID, ORAL_APPLIANCE: ORAL_APPLIANCE }
    precision: "Integer decibels and integer AHI events per hour; both bounds of the ORAL_APPLIANCE band are inclusive."
    examples:
      - "AUDIOMETRY, pta_db_hl 40 -> HEARING_AID (boundary is >=)"
      - "AUDIOMETRY, pta_db_hl 39 -> OBSERVATION"
      - "SLEEP_HSAT, ahi 5 -> ORAL_APPLIANCE; ahi 4 -> OBSERVATION"
      - "SLEEP_PSG, ahi 30 -> ORAL_APPLIANCE; ahi 31 -> CPAP"

  - name: surgery_block_utilization
    trigger: "Recomputed after every ProcedureBooking create, cancel or completion that references the block."
    algorithm: aggregation
    formula: |
      duration_minutes := floor((block.block_end_at - block.block_start_at) / 60s)
      capacity_minutes := duration_minutes * block.max_concurrent_cases
      booked_minutes   := sum of booking.duration_minutes over the block's bookings
                          whose status IS IN {SCHEDULED, IN_PROGRESS, COMPLETED}
      booked_case_count := count of those same bookings
      utilization_bps  := 0 when capacity_minutes == 0
                          else round_half_up(booked_minutes * 10000 / capacity_minutes)
    input_set: |
      ProcedureBooking rows whose surgery_center_block_id is this block and whose
      status is SCHEDULED, IN_PROGRESS or COMPLETED. CANCELLED bookings are excluded,
      which is what makes the FULL -> OPEN transition reachable.
    constants:
      BLOCK_FULL_BPS: 10000
    precision: "Integer basis points, round_half_up. Incremental add/subtract on create and cancel must agree with a full recompute."
    examples:
      - "block 08:00-12:00 (240 min), max_concurrent_cases 2 -> capacity_minutes 480. booked_minutes 90 -> 1875 bps; 180 -> 3750 bps; 240 -> 5000 bps; 480 -> 10000 bps and the block posture flips to FULL."

  - name: supply_lot_availability
    trigger: "Recomputed after every reservation, consumption, release, receipt, write-off or quarantine touching the lot."
    algorithm: aggregation
    formula: |
      available_quantity := quantity_on_hand - quantity_reserved
      # conserved identity, enforced after EVERY mutation:
      assert quantity_received == quantity_on_hand + quantity_consumed + quantity_wasted
    input_set: |
      The single SupplyLot row. quantity_reserved is the sum of planned_device_count
      over the lot's ProcedureBooking rows in status SCHEDULED or IN_PROGRESS; a
      CANCELLED or COMPLETED booking holds no reservation.
    constants:
      MIN_AVAILABLE_TO_RESERVE: 1
    precision: |
      Whole units, never negative. Every operation that moves units must move them
      between two of the four buckets so the received total is conserved: a booking
      completion moves units from on_hand to consumed, a refund settlement moves one
      unit from consumed to wasted, and a QUARANTINE adjustment moves the available
      remainder from on_hand to wasted.
    examples:
      - "quantity_received 10, on_hand 10, reserved 2, consumed 0, wasted 0 -> available_quantity 8; identity 10 == 10 + 0 + 0 holds."
      - "After completing a 2-device booking with devices_used_count 2: reserved 0, on_hand 8, consumed 2 -> available_quantity 8; identity 10 == 8 + 2 + 0 holds."
      - "After a refund settlement on one dispensed unit: on_hand 8, consumed 1, wasted 1 -> available_quantity 8; identity 10 == 8 + 1 + 1 still holds."
      - "quantity_received 2, on_hand 2, reserved 2 -> available_quantity 0, the lot is EXHAUSTED and a further POST /procedure-bookings against it is rejected."

  - name: immunotherapy_vial_volume_ledger
    trigger: "Recomputed after every dose administration, dose void, and vial discard."
    algorithm: aggregation
    formula: |
      volume_ml_dispensed_total := sum of dose.volume_ml over the vial's
                                   ImmunotherapyDose rows in status
                                   {ADMINISTERED, CLEARED, REACTION_HELD}
      volume_ml_remaining := volume_ml_initial - volume_ml_dispensed_total - volume_ml_wasted
      # conserved identity, enforced after EVERY mutation:
      assert volume_ml_initial == volume_ml_remaining
                                + volume_ml_dispensed_total
                                + volume_ml_wasted
    input_set: |
      The vial's own ImmunotherapyDose rows. A VOIDED dose is excluded, which is
      exactly how the void compensates the draw. Doses are applied in ascending
      administered_at order, with created_at ascending as the tie-break.
    constants:
      MIN_DOSE_ML: 0.05
      DEFAULT_VIAL_ML: 5.00
    precision: |
      Millilitres to 2 decimal places, no rounding needed because every dose is a
      multiple of 0.05 mL. A draw that would leave volume_ml_remaining below zero is
      rejected with ERR_INSUFFICIENT_VIAL_VOLUME before any bucket moves.
    examples:
      - "volume_ml_initial 5.00, one 0.40 mL dose administered -> dispensed_total 0.40, remaining 4.60, wasted 0.00; identity holds."
      - "That dose voided within the 15-minute window -> dispensed_total 0.00, remaining 5.00, wasted 0.00; identity holds and no drift remains."
      - "volume_ml_initial 5.00, dispensed_total 4.70, then discarded for CONTAMINATION -> wasted 0.30, remaining 0.00; identity 5.00 == 0.00 + 4.70 + 0.30 holds."
      - "remaining 0.04 -> below MIN_DOSE_ML, so the vial is EXHAUSTED and no further dose may be drawn."

  - name: scope_reprocessing_due
    trigger: "Recomputed after every reprocessing completion and consulted at POST /procedure-bookings and POST /procedure-bookings/{bookingId}/start."
    algorithm: threshold
    formula: |
      hld_expires_at := last_reprocessed_at + HLD_SHELF_LIFE_HOURS (168) hours,
                        or null when last_reprocessed_at IS NULL
      mec_test_due   := ((cycle_count + 1) mod MEC_TEST_INTERVAL (10) == 0)
      shelf_valid    := last_reprocessed_at IS NULL or clock < hld_expires_at
      turnaround_ok(candidate_start, prior_end) := candidate_start >= prior_end
                        + REPROCESSING_BUFFER_MINUTES (45) minutes
    input_set: |
      The single EndoscopeAsset row, plus — for turnaround_ok — that scope's
      ProcedureBooking rows in status SCHEDULED or IN_PROGRESS. CANCELLED bookings
      release both the interval and the turnaround buffer.
    constants:
      HLD_SHELF_LIFE_HOURS: 168
      MEC_TEST_INTERVAL: 10
      REPROCESSING_BUFFER_MINUTES: 45
      MAX_CONSECUTIVE_MEC_FAILURES: 2
    precision: "Whole hours and whole minutes; the shelf-life boundary is exclusive (clock == hld_expires_at is expired) and the turnaround boundary is inclusive."
    examples:
      - "last_reprocessed_at 2026-08-01T00:00:00Z -> hld_expires_at 2026-08-08T00:00:00Z. At clock 2026-08-07T23:59:00Z the scope is usable; at exactly 2026-08-08T00:00:00Z it is not."
      - "cycle_count 9 -> mec_test_due true (the 10th cycle needs a minimum-effective-concentration test); cycle_count 8 -> false."
      - "Prior booking ends 2026-08-03T10:00:00Z: a next start at 10:30 is rejected, 10:45 is accepted."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
# Domain ordering rationale: identity before shape, shape before existence,
# existence before concurrency, concurrency before state, and — inside the
# business band — patient safety (10) before temporal scheduling (11) before
# referential coherence (12) before contractual constraints (13) before money
# and inventory (14). A single request violating rules at two priorities always
# returns the lower-numbered rule's error_id.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty. A header supplied as an empty string (\"\") counts as absent; a header of whitespace only is also rejected here."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND is listed in the target endpoint's roles."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: request_shape
    check: |
      Request body conforms to the endpoint's input schema: every required field
      present; no unknown fields; types match; enum values are declared members;
      integers inside their declared ranges; ISO-8601 instants are well formed and
      UTC; calendar dates are well formed; regex-constrained strings match
      (mrn ^MRN-[0-9]{5}$, plan_code ^[A-Z0-9-]{3,20}$, serial_number ^SC-[0-9]{4}$,
      lot_number ^LOT-[0-9]{4}$, device_serial ^[A-Z]{2}[0-9]{6}$); array fields are
      non-empty where declared; pagination limit is 1..100 and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every id in the path resolves to a stored row, validated left to right."
    error_id: "ERR_PAYER_POLICY_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_ALLERGY_TEST_ORDER_NOT_FOUND | ERR_REACTION_EVENT_NOT_FOUND | ERR_IMMUNOTHERAPY_VIAL_NOT_FOUND | ERR_IMMUNOTHERAPY_DOSE_NOT_FOUND | ERR_SINUPLASTY_CASE_NOT_FOUND | ERR_DIAGNOSTIC_STUDY_NOT_FOUND | ERR_DEVICE_DISPENSE_NOT_FOUND | ERR_ENDOSCOPE_ASSET_NOT_FOUND | ERR_SUPPLY_LOT_NOT_FOUND | ERR_SURGERY_CENTER_BLOCK_NOT_FOUND | ERR_PROCEDURE_BOOKING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: |
      Every foreign key supplied in the request body resolves to a stored row,
      validated in the order the endpoint's input list declares them. A
      ReactionEvent must carry exactly one of allergy_test_order_id or
      immunotherapy_dose_id — supplying both, or neither, is ERR_INVALID_REQUEST at
      priority 3, while supplying one that does not resolve is a 404 here.
    error_id: "same catalog as priority 4, selected by the referenced entity"
    http_status: 404
    applies_to: "POST /patients, POST /allergy-test-orders, POST /reaction-events, POST /immunotherapy-vials, POST /immunotherapy-doses, POST /sinuplasty-cases, POST /diagnostic-studies, POST /device-dispenses, POST /procedure-bookings"

  - priority: 6
    category: state
    check: |
      Optimistic concurrency: expected_patient_version must equal the referenced
      Patient's current version, and expected_study_version must equal the
      referenced DiagnosticStudy's current version. Checked after existence so a
      stale version on a deleted-or-never-existing parent still reports 404.
    error_id: "ERR_STALE_PATIENT_VERSION | ERR_STALE_STUDY_VERSION"
    http_status: 412
    applies_to: "POST /immunotherapy-vials, POST /device-dispenses"

  - priority: 7
    category: state
    check: |
      The entity named by the path (or, for a create, the primary parent that owns
      the new row's lifecycle) is in one of the transition's declared from-states.
      Covers: an order not in ORDERED at administer or convert-to-serum; an order
      not in {ADMINISTERED, SERUM_PENDING} at readings; a vial not in MIXED at
      label-verification; a vial not in {MIXED, LABEL_VERIFIED, IN_USE} at discard;
      a dose not in ADMINISTERED at clear-observation or void; a case not in DRAFT
      at documentation, not in {DOCUMENTED, INFO_REQUESTED, AUTH_EXPIRED} at an
      authorization submission, not in AUTH_SUBMITTED at a payer decision, and not
      in {AUTHORIZED, DOCUMENTED} when a BALLOON_SINUPLASTY booking is created; a
      study not in ORDERED at results and not in PERFORMED at interpretation; a
      study not in INTERPRETED when a dispense is created; a dispense whose
      fit_status is already FINALIZED or RETURNED at adjustments/finalize/trial-return,
      or whose billing_status is not REFUND_PENDING at refund-settlement; a scope not
      in {SOILED, QUARANTINED} at reprocessing-start and not in REPROCESSING at
      reprocessing-completion; a booking not in SCHEDULED at start or cancel and not
      in IN_PROGRESS at complete; a lot in QUARANTINED when a booking reserves from it.
      The error_id names the entity whose own lifecycle blocked the request.
    error_id: "ERR_ORDER_STATE_INVALID | ERR_VIAL_STATE_INVALID | ERR_DOSE_STATE_INVALID | ERR_CASE_STATE_INVALID | ERR_STUDY_STATE_INVALID | ERR_DISPENSE_STATE_INVALID | ERR_SCOPE_STATE_INVALID | ERR_BOOKING_STATE_INVALID | ERR_LOT_STATE_INVALID | ERR_BLOCK_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint and every create whose parent has a lifecycle"

  - priority: 8
    category: business_constraint
    check: "Practice-wide uniqueness: PayerPolicy.plan_code, Patient.mrn, EndoscopeAsset.serial_number, SupplyLot.lot_number, and DeviceDispense.device_serial are each unique across all rows of their entity, including rows in terminal states."
    error_id: "ERR_DUPLICATE_PLAN_CODE | ERR_DUPLICATE_MRN | ERR_DUPLICATE_SCOPE_SERIAL | ERR_DUPLICATE_LOT_NUMBER | ERR_DUPLICATE_DEVICE_SERIAL"
    http_status: 409
    applies_to: "POST /payer-policies, POST /patients, POST /endoscopes, POST /supply-lots, POST /device-dispenses"

  - priority: 9
    category: auth
    check: |
      Segregation of duties on X-User-ID, evaluated after the row's state is known
      to be legal so a wrong-state request never leaks who performed the earlier
      step: the vial label verifier differs from vial.mixed_by_user_id; the payer
      decision recorder differs from case.submitted_by_user_id; the study
      interpreter differs from study.performed_by_user_id; the refund settler
      differs from dispense.dispensed_by_user_id; the reprocessing completion is
      submitted by the same tech recorded in scope.reprocessing_started_by_user_id;
      a booking is started only by booking.physician_user_id.
    error_id: "ERR_SELF_VERIFICATION_FORBIDDEN | ERR_SELF_DECISION_FORBIDDEN | ERR_SELF_INTERPRETATION_FORBIDDEN | ERR_SELF_SETTLEMENT_FORBIDDEN | ERR_REPROCESSING_TECH_MISMATCH | ERR_PHYSICIAN_MISMATCH"
    http_status: 409
    applies_to: "POST /immunotherapy-vials/{vialId}/label-verification, POST /sinuplasty-cases/{caseId}/payer-decisions, POST /diagnostic-studies/{studyId}/interpretation, POST /device-dispenses/{dispenseId}/refund-settlement, POST /endoscopes/{scopeId}/reprocessing-completion, POST /procedure-bookings/{bookingId}/start"

  - priority: 10
    category: business_safety
    check: |
      Patient-safety gates, checked before any scheduling or temporal rule:
      epinephrine must be on file whenever patient.risk_score >= 45 and a skin test
      or immunotherapy dose is being administered (ERR_EPINEPHRINE_NOT_ON_FILE);
      a patient flagged dermatographism may not receive a skin-method
      administration (ERR_DERMATOGRAPHISM_BLOCKS_SKIN_TEST); a vial's
      label_text_confirmation must equal vial.label_text
      (ERR_VIAL_LABEL_MISMATCH); a vial past its expires_at may not be verified or
      drawn from (ERR_VIAL_EXPIRED); the vial's dilution_code must equal the
      required_dilution derived from the pre-rollback escalation step
      (ERR_DILUTION_MISMATCH); a dose from a vial whose
      requires_supervised_administration is true must supply supervising_user_id
      (ERR_SUPERVISION_REQUIRED); a booking whose requires_physician_presence is
      true must supply attending_physician_user_id at start
      (ERR_ATTENDING_PHYSICIAN_REQUIRED); a booking whose
      overnight_observation_required is true must be venued at a SurgeryCenterBlock
      whose overnight_capable is true (ERR_OVERNIGHT_CAPABILITY_REQUIRED).
    error_id: "ERR_EPINEPHRINE_NOT_ON_FILE | ERR_DERMATOGRAPHISM_BLOCKS_SKIN_TEST | ERR_VIAL_LABEL_MISMATCH | ERR_VIAL_EXPIRED | ERR_DILUTION_MISMATCH | ERR_SUPERVISION_REQUIRED | ERR_ATTENDING_PHYSICIAN_REQUIRED | ERR_OVERNIGHT_CAPABILITY_REQUIRED"
    http_status: 409
    applies_to: "POST /allergy-test-orders/{orderId}/administer, POST /immunotherapy-vials/{vialId}/label-verification, POST /immunotherapy-doses, POST /procedure-bookings, POST /procedure-bookings/{bookingId}/start"

  - priority: 11
    category: business_temporal
    check: |
      Clock-relative windows and interval exclusions:
      the antihistamine washout must be complete before a skin administration
      (ERR_WASHOUT_NOT_COMPLETE, 72 hours);
      the observation window must have elapsed before readings or
      clear-observation (ERR_OBSERVATION_NOT_COMPLETE);
      a dose may only be voided within 15 minutes of administration
      (ERR_VOID_WINDOW_CLOSED);
      a scope's closed booking intervals may not overlap pairwise
      (ERR_SCOPE_INTERVAL_CONFLICT) and consecutive scope bookings must leave a
      45-minute reprocessing turnaround (ERR_REPROCESSING_BUFFER_VIOLATION);
      a booking must lie entirely inside its block's half-open window
      [block_start_at, block_end_at) (ERR_BLOCK_WINDOW_EXCEEDED);
      a scope whose high-level-disinfection shelf life has lapsed may not be used
      (ERR_HLD_EXPIRED);
      a case whose auth_expires_at has been reached may not be scheduled
      (ERR_AUTHORIZATION_EXPIRED — the case is first persisted as AUTH_EXPIRED);
      a dispense may not be finalized before clock >= trial_end_at
      (ERR_TRIAL_NOT_COMPLETE).
    error_id: "ERR_WASHOUT_NOT_COMPLETE | ERR_OBSERVATION_NOT_COMPLETE | ERR_VOID_WINDOW_CLOSED | ERR_SCOPE_INTERVAL_CONFLICT | ERR_REPROCESSING_BUFFER_VIOLATION | ERR_BLOCK_WINDOW_EXCEEDED | ERR_HLD_EXPIRED | ERR_AUTHORIZATION_EXPIRED | ERR_TRIAL_NOT_COMPLETE"
    http_status: 409
    applies_to: "POST /allergy-test-orders/{orderId}/administer, POST /allergy-test-orders/{orderId}/readings, POST /immunotherapy-doses/{doseId}/clear-observation, POST /immunotherapy-doses/{doseId}/void, POST /procedure-bookings, POST /procedure-bookings/{bookingId}/start, POST /device-dispenses/{dispenseId}/finalize"

  - priority: 12
    category: business_referential
    check: |
      Coherence between two referenced rows, and the state of a secondary
      (non-owning) referenced row:
      a DeviceDispense's device_type must equal
      DEVICE_TYPE_FOR_RECOMMENDATION[study.recommendation]
      (ERR_DEVICE_TYPE_NOT_RECOMMENDED);
      a DeviceDispense's supply lot item_type must match its device_type, and a
      booking's supply lot item_type must match its procedure_type
      (ERR_LOT_ITEM_TYPE_MISMATCH);
      a booking's sinuplasty_case_id must reference a case whose patient_id equals
      the booking's patient_id (ERR_CASE_PATIENT_MISMATCH);
      a booking's endoscope must be in status READY at start — a still-serviceable
      non-READY scope (IN_USE, SOILED, REPROCESSING, QUARANTINED) is reported here
      (ERR_SCOPE_NOT_READY), while a RETIRED scope is deliberately left to
      priority 13 so the operator is told to reassign rather than to wait.
    error_id: "ERR_DEVICE_TYPE_NOT_RECOMMENDED | ERR_LOT_ITEM_TYPE_MISMATCH | ERR_CASE_PATIENT_MISMATCH | ERR_SCOPE_NOT_READY"
    http_status: 409
    applies_to: "POST /device-dispenses, POST /procedure-bookings, POST /procedure-bookings/{bookingId}/start"

  - priority: 13
    category: business_constraint
    check: |
      Contractual and configuration constraints:
      a BALLOON_SINUPLASTY booking may not start when
      case.pinned_policy_version != PayerPolicy.version (ERR_POLICY_VERSION_DRIFT);
      a case may not be resubmitted once revision_round has reached 2
      (ERR_REVISION_LIMIT_REACHED);
      a case whose candidacy_status is not ELIGIBLE may not be submitted or
      scheduled (ERR_CANDIDACY_NOT_ELIGIBLE);
      a serum conversion is refused when policy.allergy_serum_covered is false
      (ERR_SERUM_NOT_COVERED);
      an ORAL_APPLIANCE dispense is refused when policy.appliance_covered is false
      (ERR_APPLIANCE_NOT_COVERED);
      a fourth adjustment on one dispense is refused
      (ERR_ADJUSTMENT_LIMIT_REACHED);
      a booking whose scope_reassignment_required is true may not start — its scope
      is RETIRED, which priority 12 deliberately excludes from ERR_SCOPE_NOT_READY
      (ERR_SCOPE_REASSIGNMENT_REQUIRED);
      a TONSILLECTOMY or TYMPANOSTOMY_TUBES booking for a patient with
      age_months < 36 may not be venued IN_OFFICE_SUITE
      (ERR_PEDIATRIC_VENUE_REQUIRED).
    error_id: "ERR_POLICY_VERSION_DRIFT | ERR_REVISION_LIMIT_REACHED | ERR_CANDIDACY_NOT_ELIGIBLE | ERR_SERUM_NOT_COVERED | ERR_APPLIANCE_NOT_COVERED | ERR_ADJUSTMENT_LIMIT_REACHED | ERR_SCOPE_REASSIGNMENT_REQUIRED | ERR_PEDIATRIC_VENUE_REQUIRED"
    http_status: 409
    applies_to: "POST /allergy-test-orders/{orderId}/convert-to-serum, POST /sinuplasty-cases/{caseId}/authorization-submissions, POST /device-dispenses, POST /device-dispenses/{dispenseId}/adjustments, POST /procedure-bookings, POST /procedure-bookings/{bookingId}/start"

  - priority: 14
    category: business_fiscal
    check: |
      Money, volume and inventory ceilings, checked last:
      a booking may not reserve from a lot whose available_quantity is 0, or fewer
      units than planned_device_count (ERR_SUPPLY_EXHAUSTED);
      a dose may not be drawn when vial.volume_ml_remaining < the computed
      volume_ml (ERR_INSUFFICIENT_VIAL_VOLUME);
      a BALLOON_SINUPLASTY booking's planned_device_count may not exceed
      case.authorized_device_count (ERR_DEVICE_COUNT_EXCEEDS_AUTHORIZATION);
      a booking may not push block.booked_minutes past capacity_minutes, nor exceed
      block.max_concurrent_cases at any instant inside its interval
      (ERR_BLOCK_CAPACITY_EXCEEDED);
      no booking may be created against a block whose status is FULL or CLOSED
      (ERR_BLOCK_NOT_OPEN).
    error_id: "ERR_SUPPLY_EXHAUSTED | ERR_INSUFFICIENT_VIAL_VOLUME | ERR_DEVICE_COUNT_EXCEEDS_AUTHORIZATION | ERR_BLOCK_CAPACITY_EXCEEDED | ERR_BLOCK_NOT_OPEN"
    http_status: 409
    applies_to: "POST /immunotherapy-doses, POST /procedure-bookings"

# --- Declared priority-conflict resolutions (used by §1.8 rule 5) -------------
validation_priority_conflicts:
  - name: state_beats_supply_on_booking_create
    endpoint: "POST /procedure-bookings"
    winning_rule: "priority 7 — state (referenced SinuplastyCase is DENIED, not AUTHORIZED or DOCUMENTED); the lower priority number is evaluated first and wins"
    losing_rule: "priority 14 — business_fiscal (referenced SupplyLot has available_quantity 0); armed but never reached on this request"
    winning_error_id: ERR_CASE_STATE_INVALID
    losing_error_id: ERR_SUPPLY_EXHAUSTED
    rationale: "Category pair (state, business_fiscal). A denied case is not schedulable at all, so the request is rejected on lifecycle grounds before inventory is consulted."

  - name: safety_beats_temporal_on_administer
    endpoint: "POST /allergy-test-orders/{orderId}/administer"
    winning_rule: "priority 10 — business_safety (patient.risk_score >= 45 and epinephrine_on_file is false); the lower priority number is evaluated first and wins"
    losing_rule: "priority 11 — business_temporal (antihistamine washout of 72 hours is not complete); armed but never reached on this request"
    winning_error_id: ERR_EPINEPHRINE_NOT_ON_FILE
    losing_error_id: ERR_WASHOUT_NOT_COMPLETE
    rationale: "Category pair (business_safety, business_temporal) — a different pair from the conflict above. A rescue-medication gap is a hard stop; the washout gap is only a scheduling defect that a later appointment cures."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Flat surface: every collection is top-level. Reverse reachability for each FK
# in §1.1 is provided by the filtered-list GETs below (each declares its FK
# filters as optional inputs and returns an array of the child entity).
# =============================================================================
endpoints:

  # --- PayerPolicy -----------------------------------------------------------
  - method: POST
    path: "/payer-policies"
    description: "Register a payer plan whose criteria, coverage share, trial length and authorization validity govern every downstream workflow."
    roles: [PracticeAdmin]
    code: 201
    input: [payer_name, plan_code, "requires_prior_auth?", "min_medical_management_days?", "requires_ct_within_months?", "min_documented_criteria?", "max_balloon_devices?", "covered_pct_bps?", "allergy_serum_covered?", "observation_floor_minutes?", "device_trial_days?", "restock_fee_bps?", "restock_fee_floor_cents?", "auth_validity_days?", "appliance_covered?"]
    output: PayerPolicy
    side_effects:
      - "Creates the row with version 1; unspecified fields take their §1.1 defaults."
      - "Rejects a duplicate plan_code with ERR_DUPLICATE_PLAN_CODE."

  - method: GET
    path: "/payer-policies/{policyId}"
    description: "Read one payer plan, including its current version — the value a client pins when submitting an authorization."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: PayerPolicy
    side_effects: []

  - method: PATCH
    path: "/payer-policies/{policyId}"
    description: "Amend a payer plan's terms. Existing authorizations keep their pinned_policy_version, so an amendment is what makes ERR_POLICY_VERSION_DRIFT reachable."
    roles: [PracticeAdmin]
    code: 200
    input: ["requires_prior_auth?", "min_medical_management_days?", "requires_ct_within_months?", "min_documented_criteria?", "max_balloon_devices?", "covered_pct_bps?", "allergy_serum_covered?", "observation_floor_minutes?", "device_trial_days?", "restock_fee_bps?", "restock_fee_floor_cents?", "auth_validity_days?", "appliance_covered?"]
    output: PayerPolicy
    side_effects:
      - "increments `PayerPolicy.version` by 1"
      - "Does NOT retroactively move any DeviceDispense.trial_end_at or SinuplastyCase.auth_expires_at already stamped."

  # --- Patient ---------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Register a patient under a payer plan. age_months and risk_score are computed immediately."
    roles: [PracticeAdmin]
    code: 201
    input: [payer_policy_id, mrn, full_name, date_of_birth, "antihistamine_last_dose_at?", "epinephrine_on_file?", "prior_systemic_reaction_count?"]
    output: Patient
    side_effects:
      - "Computes age_months per calculations.patient_age_months."
      - "Computes risk_score per calculations.patient_anaphylaxis_risk_score under the PROVISIONAL variant; sets risk_score_variant PROVISIONAL, supervision_tier per the 60-point threshold, immunotherapy_escalation_step 1, immunotherapy_status NONE, sensitized_antigen_count 0, dermatographism false."
      - "Rejects a duplicate mrn with ERR_DUPLICATE_MRN."

  - method: GET
    path: "/patients/{patientId}"
    description: "Read one patient, including version, risk_score, supervision_tier and immunotherapy_escalation_step."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients, optionally filtered by payer plan or immunotherapy posture. Reverse reachability for Patient.payer_policy_id."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["payer_policy_id?", "immunotherapy_status?", "supervision_tier?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: PATCH
    path: "/patients/{patientId}"
    description: "Update the patient-reported clinical facts that feed risk scoring and the washout gate."
    roles: [PracticeAdmin, AllergyNurse]
    code: 200
    input: ["antihistamine_last_dose_at?", "epinephrine_on_file?", "prior_systemic_reaction_count?"]
    output: Patient
    side_effects:
      - "Recomputes risk_score under the patient's current risk_score_variant and re-derives supervision_tier."
      - "increments `Patient.version` by 1"

  # --- AllergyTestOrder ------------------------------------------------------
  - method: POST
    path: "/allergy-test-orders"
    description: "Order an allergy panel. antigen_count is fixed from the panel code; nothing is billed until the order is read."
    roles: [Otolaryngologist, AllergyNurse]
    code: 201
    input: [patient_id, panel_code, method]
    output: AllergyTestOrder
    side_effects:
      - "Sets antigen_count from PANEL_ANTIGEN_COUNT, status ORDERED, billed_units 0, practice_charge_cents 0, patient_responsibility_cents 0, positive_antigen_count 0, worst_systemic_grade 0, ordered_by_user_id from X-User-ID."
      - "Sets observation_required_minutes at creation per calculations.observation_minutes_required with context = method, so an ORDERED order always carries a current figure (exactly 0 for SERUM_IGE). It is re-derived at administer and by the reaction cascade."

  - method: GET
    path: "/allergy-test-orders/{orderId}"
    description: "Read one allergy test order."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: AllergyTestOrder
    side_effects: []

  - method: GET
    path: "/allergy-test-orders"
    description: "List allergy test orders. Reverse reachability for AllergyTestOrder.patient_id."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["patient_id?", "status?", "method?", "panel_code?", "limit?", "offset?"]
    output: AllergyTestOrder[]
    side_effects: []

  - method: POST
    path: "/allergy-test-orders/{orderId}/administer"
    description: "Administer a skin-method panel. Enforces the dermatographism block, the epinephrine gate and the 72-hour antihistamine washout, then sizes the observation window."
    roles: [AllergyNurse]
    code: 200
    input: []
    output: AllergyTestOrder
    side_effects:
      - "ORDERED -> ADMINISTERED; stamps administered_at and administered_by_user_id."
      - "Sets observation_required_minutes per calculations.observation_minutes_required."

  - method: POST
    path: "/allergy-test-orders/{orderId}/convert-to-serum"
    description: "Convert a skin-method order to serum IgE testing. Requires the plan to cover serum testing."
    roles: [AllergyNurse]
    code: 200
    input: []
    output: AllergyTestOrder
    side_effects:
      - "ORDERED -> SERUM_PENDING; sets method SERUM_IGE, billed_units ceil(antigen_count / 4) and observation_required_minutes 0."

  - method: POST
    path: "/allergy-test-orders/{orderId}/readings"
    description: "Record panel readings. Bills the order, refreshes the patient's sensitization count and risk score, or aborts the order when every antigen reads positive."
    roles: [AllergyNurse, Otolaryngologist]
    code: 200
    input: [positive_antigen_count, "max_wheal_mm?"]
    output: AllergyTestOrder
    side_effects:
      - "ADMINISTERED|SERUM_PENDING -> READ, running calculations.allergy_panel_billing."
      - "Recomputes Patient.sensitized_antigen_count, Patient.risk_score and Patient.supervision_tier."
      - "On a skin order with positive_antigen_count == antigen_count: ADMINISTERED -> ABORTED with abort_reason DERMATOGRAPHISM_DETECTED, zero charges, and Patient.dermatographism := true."

  # --- ReactionEvent ---------------------------------------------------------
  - method: POST
    path: "/reaction-events"
    description: "Record an immunologic reaction against exactly one of an allergy test order or an immunotherapy dose. Append-only; grade >= 2 drives the four-hop cascade."
    roles: [AllergyNurse]
    code: 201
    input: ["allergy_test_order_id?", "immunotherapy_dose_id?", systemic_grade, "local_wheal_mm?", onset_minutes, "epinephrine_given?"]
    output: ReactionEvent
    side_effects:
      - "Stamps occurred_at from the logical clock and recorded_by_user_id from X-User-ID."
      - "grade >= 2 on an order: order ADMINISTERED -> ABORTED (SYSTEMIC_REACTION), Patient.risk_score_variant := POST_REACTION, risk_score recomputed, supervision_tier re-derived."
      - "grade >= 2 on a dose: dose ADMINISTERED -> REACTION_HELD, then the escalation rollback, POST_REACTION rescore, supervision_tier flip, ORDERED-order observation resize, vial requires_supervised_administration and booking requires_physician_presence flags — hops 1 through 4 of the reaction cascade."

  - method: GET
    path: "/reaction-events/{eventId}"
    description: "Read one recorded reaction event."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: ReactionEvent
    side_effects: []

  - method: GET
    path: "/reaction-events"
    description: "List reaction events. Reverse reachability for ReactionEvent.allergy_test_order_id and ReactionEvent.immunotherapy_dose_id."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["allergy_test_order_id?", "immunotherapy_dose_id?", "limit?", "offset?"]
    output: ReactionEvent[]
    side_effects: []

  # --- ImmunotherapyVial -----------------------------------------------------
  - method: POST
    path: "/immunotherapy-vials"
    description: "Compound a patient-specific extract vial from an allergen concentrate lot. Carries expected_patient_version because a new vial supersedes the patient's current vial."
    roles: [AllergyNurse]
    code: 201
    input: [patient_id, supply_lot_id, dilution_code, label_text, expires_at, "volume_ml_initial?", expected_patient_version]
    output: ImmunotherapyVial
    side_effects:
      - "Rejects a stale expected_patient_version with ERR_STALE_PATIENT_VERSION (412) per concurrency_rules.vial-create-stale-patient."
      - "Creates the vial in MIXED with mixed_by_user_id from X-User-ID, volume_ml_remaining == volume_ml_initial, volume_ml_dispensed_total 0.00, volume_ml_wasted 0.00."
      - "Supersedes the patient's existing vial in {LABEL_VERIFIED, IN_USE}: that vial moves to DISCARDED with discard_reason SUPERSEDED and its remaining volume moves to volume_ml_wasted."
      - "increments `Patient.version` by 1"

  - method: GET
    path: "/immunotherapy-vials/{vialId}"
    description: "Read one extract vial, including its millilitre ledger and label text."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: ImmunotherapyVial
    side_effects: []

  - method: GET
    path: "/immunotherapy-vials"
    description: "List extract vials. Reverse reachability for ImmunotherapyVial.patient_id and ImmunotherapyVial.supply_lot_id."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["patient_id?", "supply_lot_id?", "status?", "dilution_code?", "limit?", "offset?"]
    output: ImmunotherapyVial[]
    side_effects: []

  - method: POST
    path: "/immunotherapy-vials/{vialId}/label-verification"
    description: "Independent second-person label check. The verifier must differ from the compounder and must retype the label text exactly."
    roles: [AllergyNurse]
    code: 200
    input: [label_text_confirmation]
    output: ImmunotherapyVial
    side_effects:
      - "MIXED -> LABEL_VERIFIED; stamps verified_by_user_id."
      - "Sets Patient.immunotherapy_status to BUILD_UP or MAINTENANCE from the patient's escalation step."

  - method: POST
    path: "/immunotherapy-vials/{vialId}/discard"
    description: "Discard a vial for a beyond-use date or contamination, writing its remaining volume off to waste."
    roles: [AllergyNurse]
    code: 200
    input: [discard_reason]
    output: ImmunotherapyVial
    side_effects:
      - "{MIXED, LABEL_VERIFIED, IN_USE} -> DISCARDED; moves volume_ml_remaining into volume_ml_wasted so the ledger identity still holds."

  # --- ImmunotherapyDose -----------------------------------------------------
  - method: POST
    path: "/immunotherapy-doses"
    description: "Draw and administer the next scheduled dose. Applies the gap rollback, verifies the dilution band against the pre-rollback step, and sizes the observation window."
    roles: [AllergyNurse]
    code: 201
    input: [immunotherapy_vial_id, "supervising_user_id?"]
    output: ImmunotherapyDose
    side_effects:
      - "Runs calculations.immunotherapy_next_dose_volume to set volume_ml, escalation_step_at_dose and gap_days_at_dose."
      - "Runs calculations.observation_minutes_required with context IMMUNO_DOSE to set observation_required_minutes."
      - "Vial LABEL_VERIFIED -> IN_USE on the first draw; decrements volume_ml_remaining and increments volume_ml_dispensed_total; IN_USE -> EXHAUSTED when volume_ml_remaining falls below 0.05."
      - "Stamps administered_at, administered_by_user_id and Patient.last_dose_administered_at."

  - method: GET
    path: "/immunotherapy-doses/{doseId}"
    description: "Read one administered dose."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: ImmunotherapyDose
    side_effects: []

  - method: GET
    path: "/immunotherapy-doses"
    description: "List administered doses. Reverse reachability for ImmunotherapyDose.immunotherapy_vial_id."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["immunotherapy_vial_id?", "status?", "limit?", "offset?"]
    output: ImmunotherapyDose[]
    side_effects: []

  - method: POST
    path: "/immunotherapy-doses/{doseId}/clear-observation"
    description: "Discharge the patient after the observation window and advance the escalation schedule by one step."
    roles: [AllergyNurse]
    code: 200
    input: []
    output: ImmunotherapyDose
    side_effects:
      - "ADMINISTERED -> CLEARED; stamps observation_cleared_at."
      - "Patient.immunotherapy_escalation_step := min(12, escalation_step_at_dose + 1); Patient.immunotherapy_status re-derived."

  - method: POST
    path: "/immunotherapy-doses/{doseId}/void"
    description: "Void a dose drawn in error within 15 minutes, returning its millilitres to the vial. void_reason is an enum: DRAWN_IN_ERROR | WRONG_VIAL | PATIENT_DEFERRED."
    roles: [AllergyNurse]
    code: 200
    input: [void_reason]
    output: ImmunotherapyDose
    side_effects:
      - "ADMINISTERED -> VOIDED; returns volume_ml to vial.volume_ml_remaining and subtracts it from vial.volume_ml_dispensed_total."
      - "Vial EXHAUSTED -> IN_USE when the returned volume restores at least 0.05 mL."
      - "Recomputes Patient.last_dose_administered_at from the patient's remaining non-voided doses."

  # --- SinuplastyCase --------------------------------------------------------
  - method: POST
    path: "/sinuplasty-cases"
    description: "Open a balloon sinuplasty case. planned_device_count is derived from the sinus list and laterality."
    roles: [Otolaryngologist]
    code: 201
    input: [patient_id, laterality, sinuses]
    output: SinuplastyCase
    side_effects:
      - "Sets status DRAFT, candidacy_status UNDETERMINED, revision_round 0, authorized_device_count 0, planned_device_count := len(sinuses) * (2 when laterality == BILATERAL else 1)."
      - "Sets evaluation_variant from the patient's plan: POLICY_STRICT when requires_prior_auth is true, else CLINICAL_BROAD."

  - method: GET
    path: "/sinuplasty-cases/{caseId}"
    description: "Read one sinuplasty case, including pinned_policy_version and auth_expires_at."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: SinuplastyCase
    side_effects: []

  - method: GET
    path: "/sinuplasty-cases"
    description: "List sinuplasty cases. Reverse reachability for SinuplastyCase.patient_id."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["patient_id?", "status?", "candidacy_status?", "limit?", "offset?"]
    output: SinuplastyCase[]
    side_effects: []

  - method: POST
    path: "/sinuplasty-cases/{caseId}/documentation"
    description: "Attach the medical-management history, CT date and criteria codes, then evaluate candidacy under the plan's variant."
    roles: [Otolaryngologist]
    code: 200
    input: [ct_study_date, documented_therapies, documented_criteria_codes]
    output: SinuplastyCase
    side_effects:
      - "DRAFT -> DOCUMENTED; stamps documented_by_user_id."
      - "Runs calculations.sinuplasty_candidacy_evaluation to set criteria_met_count, contiguous_management_days, cumulative_management_days and candidacy_status."

  - method: GET
    path: "/sinuplasty-cases/{caseId}/candidacy-evaluation"
    description: "Recompute and return the candidacy determination without mutating the case — the read used to compare the two evaluation variants."
    roles: [PracticeAdmin, Otolaryngologist, PayerLiaison]
    code: 200
    input: []
    output: "{ evaluation_variant: string, criteria_met_count: integer, admissible_criteria_codes: string[], contiguous_management_days: integer, cumulative_management_days: integer, management_days_metric: integer, min_documented_criteria_required: integer, min_medical_management_days_required: integer, candidacy_status: string }"
    side_effects: []

  - method: POST
    path: "/sinuplasty-cases/{caseId}/authorization-submissions"
    description: "Submit or resubmit the case to the payer, pinning the plan version observed at submission."
    roles: [PayerLiaison]
    code: 200
    input: []
    output: SinuplastyCase
    side_effects:
      - "{DOCUMENTED, INFO_REQUESTED, AUTH_EXPIRED} -> AUTH_SUBMITTED; stamps submitted_by_user_id and pinned_policy_version."
      - "From INFO_REQUESTED: increments revision_round, capped at 2 by ERR_REVISION_LIMIT_REACHED."
      - "From AUTH_EXPIRED: resets revision_round to 0, authorized_device_count to 0 and auth_expires_at to null."

  - method: POST
    path: "/sinuplasty-cases/{caseId}/payer-decisions"
    description: "Record the payer's approval, denial or request for more information. decision is an enum: APPROVED | DENIED | INFO_REQUESTED. The recorder must differ from the submitter."
    roles: [PayerLiaison]
    code: 200
    input: [decision, payer_reference]
    output: SinuplastyCase
    side_effects:
      - "APPROVED: AUTH_SUBMITTED -> AUTHORIZED, sets authorized_device_count := min(planned_device_count, policy.max_balloon_devices) and auth_expires_at := clock + policy.auth_validity_days days."
      - "DENIED: AUTH_SUBMITTED -> DENIED with authorized_device_count 0."
      - "INFO_REQUESTED: AUTH_SUBMITTED -> INFO_REQUESTED, leaving revision_round for the next submission to increment."

  # --- DiagnosticStudy -------------------------------------------------------
  - method: POST
    path: "/diagnostic-studies"
    description: "Order an audiometry, home sleep apnea test or polysomnogram."
    roles: [Otolaryngologist]
    code: 201
    input: [patient_id, study_type]
    output: DiagnosticStudy
    side_effects:
      - "Sets status ORDERED, superseded_dispense_count 0, version 1."

  - method: GET
    path: "/diagnostic-studies/{studyId}"
    description: "Read one diagnostic study, including version — the value a dispense must pin."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: DiagnosticStudy
    side_effects: []

  - method: GET
    path: "/diagnostic-studies"
    description: "List diagnostic studies. Reverse reachability for DiagnosticStudy.patient_id."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["patient_id?", "study_type?", "status?", "recommendation?", "limit?", "offset?"]
    output: DiagnosticStudy[]
    side_effects: []

  - method: POST
    path: "/diagnostic-studies/{studyId}/results"
    description: "Record the measured results. The metric set is fixed by study_type."
    roles: [Audiologist]
    code: 200
    input: ["pta_db_hl?", "word_recognition_pct?", "ahi?"]
    output: DiagnosticStudy
    side_effects:
      - "ORDERED -> PERFORMED; stamps performed_at and performed_by_user_id."
      - "increments `DiagnosticStudy.version` by 1"

  - method: POST
    path: "/diagnostic-studies/{studyId}/interpretation"
    description: "Interpret the study and emit the device recommendation. The interpreter must differ from the performer."
    roles: [Otolaryngologist, Audiologist]
    code: 200
    input: []
    output: DiagnosticStudy
    side_effects:
      - "PERFORMED -> INTERPRETED; sets recommendation per calculations.study_recommendation and stamps interpreted_by_user_id."
      - "increments `DiagnosticStudy.version` by 1"

  # --- DeviceDispense --------------------------------------------------------
  - method: POST
    path: "/device-dispenses"
    description: "Dispense a hearing aid or oral appliance against an interpreted study, opening the trial window. Carries expected_study_version because a second dispense supersedes the first."
    roles: [Audiologist]
    code: 201
    input: [diagnostic_study_id, supply_lot_id, device_type, device_serial, ear, price_cents, expected_study_version]
    output: DeviceDispense
    side_effects:
      - "Rejects a stale expected_study_version with ERR_STALE_STUDY_VERSION (412) per concurrency_rules.dispense-create-stale-study."
      - "Sets fit_status FITTED, billing_status INVOICED, adjustment_count 0, dispensed_at := clock, trial_end_at := clock + policy.device_trial_days days, dispensed_by_user_id from X-User-ID."
      - "Reserves and consumes one unit from the supply lot: quantity_on_hand -= 1 and quantity_consumed += 1; lot ACTIVE -> EXHAUSTED when available_quantity reaches 0."
      - "Supersedes any earlier dispense on the same study: increments DiagnosticStudy.superseded_dispense_count."
      - "increments `DiagnosticStudy.version` by 1"

  - method: GET
    path: "/device-dispenses/{dispenseId}"
    description: "Read one device dispense, including the trial window and refund figures."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: DeviceDispense
    side_effects: []

  - method: GET
    path: "/device-dispenses"
    description: "List device dispenses. Reverse reachability for DeviceDispense.diagnostic_study_id and DeviceDispense.supply_lot_id."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["diagnostic_study_id?", "supply_lot_id?", "fit_status?", "billing_status?", "limit?", "offset?"]
    output: DeviceDispense[]
    side_effects: []

  - method: POST
    path: "/device-dispenses/{dispenseId}/adjustments"
    description: "Record a fitting adjustment during the trial. Capped at three. adjustment_note is free text, 1..200 characters."
    roles: [Audiologist]
    code: 200
    input: ["adjustment_note?"]
    output: DeviceDispense
    side_effects:
      - "{FITTED, ADJUSTED} -> ADJUSTED; increments adjustment_count; billing_status is untouched."

  - method: POST
    path: "/device-dispenses/{dispenseId}/trial-return"
    description: "Accept a device back. Computes the refund under the IN_TRIAL or POST_TRIAL variant. return_reason is an enum: DISSATISFIED | POOR_FIT | MEDICAL_CHANGE."
    roles: [Audiologist]
    code: 200
    input: [return_reason]
    output: DeviceDispense
    side_effects:
      - "{FITTED, ADJUSTED} -> RETURNED; runs calculations.device_trial_refund to set days_used, refund_variant, restock_fee_cents and refund_cents."
      - "billing_status := REFUND_PENDING under IN_TRIAL, or RETAINED under POST_TRIAL."

  - method: POST
    path: "/device-dispenses/{dispenseId}/finalize"
    description: "Close out a kept device once the trial window has elapsed."
    roles: [Audiologist]
    code: 200
    input: []
    output: DeviceDispense
    side_effects:
      - "{FITTED, ADJUSTED} -> FINALIZED; billing_status := RETAINED."

  - method: POST
    path: "/device-dispenses/{dispenseId}/refund-settlement"
    description: "Settle a pending refund. The settler must differ from the dispenser, and the returned unit is written off rather than restocked."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: DeviceDispense
    side_effects:
      - "billing_status REFUND_PENDING -> REFUNDED; stamps settled_by_user_id; fit_status stays RETURNED."
      - "Supply lot: quantity_consumed -= 1 and quantity_wasted += 1, conserving quantity_received."

  # --- EndoscopeAsset --------------------------------------------------------
  - method: POST
    path: "/endoscopes"
    description: "Register a flexible endoscope in the reprocessing register."
    roles: [PracticeAdmin]
    code: 201
    input: [serial_number, model]
    output: EndoscopeAsset
    side_effects:
      - "Sets status READY, cycle_count 0, consecutive_mec_failures 0, last_reprocessed_at null, hld_expires_at null, mec_test_due false."
      - "Rejects a duplicate serial_number with ERR_DUPLICATE_SCOPE_SERIAL."

  - method: GET
    path: "/endoscopes/{scopeId}"
    description: "Read one endoscope, including cycle_count, hld_expires_at and mec_test_due."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: EndoscopeAsset
    side_effects: []

  - method: GET
    path: "/endoscopes"
    description: "List endoscopes by reprocessing posture."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["status?", "mec_test_due?", "limit?", "offset?"]
    output: EndoscopeAsset[]
    side_effects: []

  - method: POST
    path: "/endoscopes/{scopeId}/reprocessing-start"
    description: "Begin a high-level-disinfection run. Records the tech who owns the run."
    roles: [SterileProcessingTech]
    code: 200
    input: []
    output: EndoscopeAsset
    side_effects:
      - "{SOILED, QUARANTINED} -> REPROCESSING; stamps reprocessing_started_by_user_id."

  - method: POST
    path: "/endoscopes/{scopeId}/reprocessing-completion"
    description: "Close a disinfection run with the leak test and, on every tenth cycle, the minimum-effective-concentration test. Must be submitted by the tech who started the run."
    roles: [SterileProcessingTech]
    code: 200
    input: [leak_test_passed, "mec_test_passed?"]
    output: EndoscopeAsset
    side_effects:
      - "On pass: REPROCESSING -> READY; increments cycle_count, stamps last_reprocessed_at and hld_expires_at (+168h), resets consecutive_mec_failures to 0 and re-derives mec_test_due."
      - "On fail: REPROCESSING -> QUARANTINED; increments consecutive_mec_failures without incrementing cycle_count."
      - "At consecutive_mec_failures == 2: QUARANTINED -> RETIRED, then every SCHEDULED ProcedureBooking on this scope gets scope_reassignment_required := true."

  # --- SupplyLot -------------------------------------------------------------
  - method: POST
    path: "/supply-lots"
    description: "Receive a supply or implant lot. quantity_on_hand starts equal to quantity_received."
    roles: [PracticeAdmin]
    code: 201
    input: [item_type, lot_number, quantity_received, expires_at]
    output: SupplyLot
    side_effects:
      - "Sets quantity_on_hand := quantity_received, quantity_reserved 0, quantity_consumed 0, quantity_wasted 0, status ACTIVE."
      - "Rejects a duplicate lot_number with ERR_DUPLICATE_LOT_NUMBER."

  - method: GET
    path: "/supply-lots/{lotId}"
    description: "Read one supply lot, including available_quantity and the four conserved buckets."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: SupplyLot
    side_effects: []

  - method: GET
    path: "/supply-lots"
    description: "List supply lots by item type or status."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["item_type?", "status?", "limit?", "offset?"]
    output: SupplyLot[]
    side_effects: []

  - method: POST
    path: "/supply-lots/{lotId}/adjustments"
    description: "Receive extra units, write units off, or quarantine the remaining available units of a lot. reason is an enum: RECEIVE | WRITE_OFF | QUARANTINE; quantity is required for RECEIVE and WRITE_OFF (1..1000) and ignored for QUARANTINE."
    roles: [PracticeAdmin]
    code: 200
    input: [reason, "quantity?"]
    output: SupplyLot
    side_effects:
      - "RECEIVE: quantity_received += quantity and quantity_on_hand += quantity; lot EXHAUSTED -> ACTIVE when available_quantity rises above 0, clearing supply_shortfall_flag on the lot's SCHEDULED bookings."
      - "WRITE_OFF: hop 1 — quantity_on_hand -= quantity and quantity_wasted += quantity; hop 2 (caused by hop 1) — lot ACTIVE -> EXHAUSTED when available_quantity reaches 0; hop 3 (caused by hop 2) — every ProcedureBooking on this lot whose status is SCHEDULED and whose planned_device_count > 0 gets supply_shortfall_flag := true. This is the supply cascade's origin, and its trigger differs from the reaction cascade's."
      - "QUARANTINE: moves the whole available remainder from quantity_on_hand to quantity_wasted and sets status QUARANTINED; the quantity input is ignored."

  # --- SurgeryCenterBlock ----------------------------------------------------
  - method: POST
    path: "/surgery-center-blocks"
    description: "Publish a surgery-center block. The window is half-open: [block_start_at, block_end_at)."
    roles: [PracticeAdmin]
    code: 201
    input: [center_name, block_start_at, block_end_at, "max_concurrent_cases?", "overnight_capable?"]
    output: SurgeryCenterBlock
    side_effects:
      - "Sets status OPEN, booked_case_count 0, booked_minutes 0, capacity_minutes := duration_minutes * max_concurrent_cases, utilization_bps 0."

  - method: GET
    path: "/surgery-center-blocks/{blockId}"
    description: "Read one block, including booked_minutes, capacity_minutes and utilization_bps."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: SurgeryCenterBlock
    side_effects: []

  - method: GET
    path: "/surgery-center-blocks"
    description: "List surgery-center blocks by posture or overnight capability."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["status?", "overnight_capable?", "limit?", "offset?"]
    output: SurgeryCenterBlock[]
    side_effects: []

  - method: POST
    path: "/surgery-center-blocks/{blockId}/close"
    description: "Close a block to further bookings. Already-scheduled cases keep their slots."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: SurgeryCenterBlock
    side_effects:
      - "{OPEN, FULL} -> CLOSED; later POST /procedure-bookings against this block are rejected with ERR_BLOCK_NOT_OPEN."

  # --- ProcedureBooking ------------------------------------------------------
  - method: POST
    path: "/procedure-bookings"
    description: "Schedule a procedure in the office suite or at the surgery center. Reserves implants, claims a scope interval and consumes block capacity."
    roles: [PracticeAdmin, Otolaryngologist]
    code: 201
    input: [patient_id, procedure_type, venue, start_at, end_at, physician_user_id, "sinuplasty_case_id?", "endoscope_asset_id?", "surgery_center_block_id?", "supply_lot_id?", "planned_device_count?"]
    output: ProcedureBooking
    side_effects:
      - "Sets status SCHEDULED, duration_minutes := floor((end_at - start_at) / 60s), devices_used_count 0, scope_reassignment_required false, supply_shortfall_flag false."
      - "Derives overnight_observation_required (TONSILLECTOMY with patient.age_months < 36) and requires_physician_presence (patient.supervision_tier == PHYSICIAN_PRESENT)."
      - "Reserves planned_device_count units on the supply lot; lot ACTIVE -> EXHAUSTED when available_quantity reaches 0."
      - "Adds duration_minutes to the block's booked_minutes and recomputes utilization_bps; block OPEN -> FULL at 10000 bps."
      - "Moves a BALLOON_SINUPLASTY case AUTHORIZED|DOCUMENTED -> SCHEDULED; an AUTHORIZED case past auth_expires_at is first persisted as AUTH_EXPIRED and the request is then rejected with ERR_AUTHORIZATION_EXPIRED."

  - method: GET
    path: "/procedure-bookings/{bookingId}"
    description: "Read one booking, including scope_reassignment_required and supply_shortfall_flag."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: []

  - method: GET
    path: "/procedure-bookings"
    description: "List bookings. Reverse reachability for ProcedureBooking.patient_id, sinuplasty_case_id, endoscope_asset_id, surgery_center_block_id and supply_lot_id."
    roles: [PracticeAdmin, Otolaryngologist, AllergyNurse, Audiologist, SterileProcessingTech, PayerLiaison]
    code: 200
    input: ["patient_id?", "sinuplasty_case_id?", "endoscope_asset_id?", "surgery_center_block_id?", "supply_lot_id?", "status?", "procedure_type?", "limit?", "offset?"]
    output: ProcedureBooking[]
    side_effects: []

  - method: POST
    path: "/procedure-bookings/{bookingId}/start"
    description: "Start the procedure. Enforces scope readiness and shelf life, physician identity, attending presence, reassignment blocks and policy-version drift."
    roles: [Otolaryngologist]
    code: 200
    input: ["attending_physician_user_id?"]
    output: ProcedureBooking
    side_effects:
      - "SCHEDULED -> IN_PROGRESS; scope READY -> IN_USE and scope.last_used_by_user_id := booking.physician_user_id."

  - method: POST
    path: "/procedure-bookings/{bookingId}/complete"
    description: "Complete the procedure, converting reserved implants into consumed units and soiling the scope."
    roles: [Otolaryngologist]
    code: 200
    input: [devices_used_count]
    output: ProcedureBooking
    side_effects:
      - "IN_PROGRESS -> COMPLETED; releases the reservation and consumes devices_used_count units from the lot, leaving quantity_received == quantity_on_hand + quantity_consumed + quantity_wasted intact."
      - "available_quantity never falls on a completion, so no lot EXHAUSTED transition and no supply_shortfall_flag can originate here."
      - "Scope IN_USE -> SOILED with hld_expires_at cleared; sinuplasty case SCHEDULED -> COMPLETED."

  - method: POST
    path: "/procedure-bookings/{bookingId}/cancel"
    description: "Cancel a scheduled booking, releasing every resource it held."
    roles: [PracticeAdmin, Otolaryngologist]
    code: 200
    input: [cancel_reason]
    output: ProcedureBooking
    side_effects:
      - "SCHEDULED -> CANCELLED; releases the lot reservation (lot EXHAUSTED -> ACTIVE when available_quantity rises above 0, clearing supply_shortfall_flag on siblings)."
      - "Releases the scope interval and its 45-minute turnaround buffer."
      - "Subtracts duration_minutes from the block's booked_minutes and recomputes utilization_bps; block FULL -> OPEN below 10000 bps."
      - "Returns a BALLOON_SINUPLASTY case SCHEDULED -> AUTHORIZED, or SCHEDULED -> DOCUMENTED on the self-pay path."

  # --- Test-driving endpoint (§1.5 priority ladder, rung 3) ------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every window, expiry and elapsed-time rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PracticeAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "Moves the logical clock only. No lazy sweep runs: an expired authorization is still AUTHORIZED until a booking attempt observes it, and an expired HLD shelf life is still observable on the scope row until a start attempt observes it."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- Authentication / authorization / shape ---------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role is missing, an empty string, or whitespace only."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the target endpoint's roles."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Body or query fails the shape gate: missing required field, unknown field, wrong type, undeclared enum member, out-of-range integer, malformed ISO-8601 instant or calendar date, regex mismatch, empty array where non-empty is required, therapy item with start_date after end_date, a ReactionEvent carrying both or neither of allergy_test_order_id and immunotherapy_dose_id, a DiagnosticStudy result payload whose metric set does not match its study_type, pagination limit outside 1..100, or negative offset."

  # --- Not found -------------------------------------------------------------
  - id: ERR_PAYER_POLICY_NOT_FOUND
    http: 404
    condition: "A policyId in the path, or a payer_policy_id in the body, matches no PayerPolicy row."
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "A patientId in the path, or a patient_id in the body, matches no Patient row."
  - id: ERR_ALLERGY_TEST_ORDER_NOT_FOUND
    http: 404
    condition: "An orderId in the path, or an allergy_test_order_id in the body, matches no AllergyTestOrder row."
  - id: ERR_REACTION_EVENT_NOT_FOUND
    http: 404
    condition: "An eventId in the path matches no ReactionEvent row."
  - id: ERR_IMMUNOTHERAPY_VIAL_NOT_FOUND
    http: 404
    condition: "A vialId in the path, or an immunotherapy_vial_id in the body, matches no ImmunotherapyVial row."
  - id: ERR_IMMUNOTHERAPY_DOSE_NOT_FOUND
    http: 404
    condition: "A doseId in the path, or an immunotherapy_dose_id in the body, matches no ImmunotherapyDose row."
  - id: ERR_SINUPLASTY_CASE_NOT_FOUND
    http: 404
    condition: "A caseId in the path, or a sinuplasty_case_id in the body, matches no SinuplastyCase row."
  - id: ERR_DIAGNOSTIC_STUDY_NOT_FOUND
    http: 404
    condition: "A studyId in the path, or a diagnostic_study_id in the body, matches no DiagnosticStudy row."
  - id: ERR_DEVICE_DISPENSE_NOT_FOUND
    http: 404
    condition: "A dispenseId in the path matches no DeviceDispense row."
  - id: ERR_ENDOSCOPE_ASSET_NOT_FOUND
    http: 404
    condition: "A scopeId in the path, or an endoscope_asset_id in the body, matches no EndoscopeAsset row."
  - id: ERR_SUPPLY_LOT_NOT_FOUND
    http: 404
    condition: "A lotId in the path, or a supply_lot_id in the body, matches no SupplyLot row."
  - id: ERR_SURGERY_CENTER_BLOCK_NOT_FOUND
    http: 404
    condition: "A blockId in the path, or a surgery_center_block_id in the body, matches no SurgeryCenterBlock row."
  - id: ERR_PROCEDURE_BOOKING_NOT_FOUND
    http: 404
    condition: "A bookingId in the path matches no ProcedureBooking row."

  # --- Optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "POST /immunotherapy-vials supplies an expected_patient_version that differs from the referenced Patient's current version."
  - id: ERR_STALE_STUDY_VERSION
    http: 412
    condition: "POST /device-dispenses supplies an expected_study_version that differs from the referenced DiagnosticStudy's current version."

  # --- Lifecycle (state precondition on the entity that owns the operation) ---
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "The AllergyTestOrder is not in a declared from-state: administer or convert-to-serum on an order that is not ORDERED, or readings on an order that is neither ADMINISTERED nor SERUM_PENDING."
  - id: ERR_VIAL_STATE_INVALID
    http: 409
    condition: "The ImmunotherapyVial is not in a declared from-state: label-verification on a vial that is not MIXED, discard on a vial already EXHAUSTED or DISCARDED, or a dose drawn from a vial that is neither LABEL_VERIFIED nor IN_USE."
  - id: ERR_DOSE_STATE_INVALID
    http: 409
    condition: "The ImmunotherapyDose is not ADMINISTERED at clear-observation or void — it is already CLEARED, VOIDED or REACTION_HELD."
  - id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "The SinuplastyCase is not in a declared from-state: documentation on a case that is not DRAFT, an authorization submission on a case outside {DOCUMENTED, INFO_REQUESTED, AUTH_EXPIRED}, a payer decision on a case that is not AUTH_SUBMITTED, or a BALLOON_SINUPLASTY booking against a case outside {AUTHORIZED, DOCUMENTED}."
  - id: ERR_STUDY_STATE_INVALID
    http: 409
    condition: "The DiagnosticStudy is not ORDERED at results, not PERFORMED at interpretation, or not INTERPRETED when a DeviceDispense is created against it."
  - id: ERR_DISPENSE_STATE_INVALID
    http: 409
    condition: "The DeviceDispense fit_status is already FINALIZED or RETURNED at adjustments, trial-return or finalize, or its billing_status is not REFUND_PENDING at refund-settlement."
  - id: ERR_SCOPE_STATE_INVALID
    http: 409
    condition: "The EndoscopeAsset is not in {SOILED, QUARANTINED} at reprocessing-start, not REPROCESSING at reprocessing-completion, or is RETIRED."
  - id: ERR_BOOKING_STATE_INVALID
    http: 409
    condition: "The ProcedureBooking is not SCHEDULED at start or cancel, or not IN_PROGRESS at complete."
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "A booking or dispense attempts to draw from a SupplyLot whose status is QUARANTINED."
  - id: ERR_BLOCK_STATE_INVALID
    http: 409
    condition: "POST /surgery-center-blocks/{blockId}/close is called on a block that is already CLOSED."

  # --- Uniqueness ------------------------------------------------------------
  - id: ERR_DUPLICATE_PLAN_CODE
    http: 409
    condition: "plan_code already exists on another PayerPolicy row."
  - id: ERR_DUPLICATE_MRN
    http: 409
    condition: "mrn already exists on another Patient row."
  - id: ERR_DUPLICATE_SCOPE_SERIAL
    http: 409
    condition: "serial_number already exists on another EndoscopeAsset row, including a RETIRED one."
  - id: ERR_DUPLICATE_LOT_NUMBER
    http: 409
    condition: "lot_number already exists on another SupplyLot row."
  - id: ERR_DUPLICATE_DEVICE_SERIAL
    http: 409
    condition: "device_serial already exists on another DeviceDispense row, including a RETURNED one."

  # --- Segregation of duties -------------------------------------------------
  - id: ERR_SELF_VERIFICATION_FORBIDDEN
    http: 409
    condition: "X-User-ID on POST /immunotherapy-vials/{vialId}/label-verification equals vial.mixed_by_user_id."
  - id: ERR_SELF_DECISION_FORBIDDEN
    http: 409
    condition: "X-User-ID on POST /sinuplasty-cases/{caseId}/payer-decisions equals case.submitted_by_user_id."
  - id: ERR_SELF_INTERPRETATION_FORBIDDEN
    http: 409
    condition: "X-User-ID on POST /diagnostic-studies/{studyId}/interpretation equals study.performed_by_user_id."
  - id: ERR_SELF_SETTLEMENT_FORBIDDEN
    http: 409
    condition: "X-User-ID on POST /device-dispenses/{dispenseId}/refund-settlement equals dispense.dispensed_by_user_id."
  - id: ERR_REPROCESSING_TECH_MISMATCH
    http: 409
    condition: "X-User-ID on POST /endoscopes/{scopeId}/reprocessing-completion differs from scope.reprocessing_started_by_user_id — a disinfection run must be closed by the tech who opened it."
  - id: ERR_PHYSICIAN_MISMATCH
    http: 409
    condition: "X-User-ID on POST /procedure-bookings/{bookingId}/start differs from booking.physician_user_id."

  # --- Patient safety (priority 10) ------------------------------------------
  - id: ERR_EPINEPHRINE_NOT_ON_FILE
    http: 409
    condition: "A skin administration or an immunotherapy dose is attempted for a patient whose risk_score is at least 45 and whose epinephrine_on_file is false."
  - id: ERR_DERMATOGRAPHISM_BLOCKS_SKIN_TEST
    http: 409
    condition: "A SKIN_PRICK or INTRADERMAL administration is attempted for a patient whose dermatographism flag is true."
  - id: ERR_VIAL_LABEL_MISMATCH
    http: 409
    condition: "label_text_confirmation does not equal vial.label_text character for character."
  - id: ERR_VIAL_EXPIRED
    http: 409
    condition: "The logical clock has reached or passed vial.expires_at at label-verification or at a dose draw."
  - id: ERR_DILUTION_MISMATCH
    http: 409
    condition: "The vial's dilution_code differs from the required_dilution derived from the patient's pre-rollback escalation step (BLUE_1_100 for steps 1-6, YELLOW_1_10 for steps 7-12)."
  - id: ERR_SUPERVISION_REQUIRED
    http: 409
    condition: "A dose is drawn from a vial whose requires_supervised_administration is true without supplying supervising_user_id."
  - id: ERR_ATTENDING_PHYSICIAN_REQUIRED
    http: 409
    condition: "A booking whose requires_physician_presence is true is started without attending_physician_user_id."
  - id: ERR_OVERNIGHT_CAPABILITY_REQUIRED
    http: 409
    condition: "A booking whose overnight_observation_required is true is placed in a SurgeryCenterBlock whose overnight_capable is false."

  # --- Temporal (priority 11) ------------------------------------------------
  - id: ERR_WASHOUT_NOT_COMPLETE
    http: 409
    condition: "Fewer than 72 hours have elapsed since patient.antihistamine_last_dose_at at a skin administration."
  - id: ERR_OBSERVATION_NOT_COMPLETE
    http: 409
    condition: "Fewer than observation_required_minutes have elapsed since administered_at at readings or clear-observation."
  - id: ERR_VOID_WINDOW_CLOSED
    http: 409
    condition: "More than 15 minutes have elapsed since dose.administered_at at void."
  - id: ERR_SCOPE_INTERVAL_CONFLICT
    http: 409
    condition: "The requested [start_at, end_at] interval overlaps an existing SCHEDULED or IN_PROGRESS booking on the same endoscope, treating both endpoints as inclusive."
  - id: ERR_REPROCESSING_BUFFER_VIOLATION
    http: 409
    condition: "The requested start_at is less than 45 minutes after the end_at of the scope's preceding booking, or the requested end_at is less than 45 minutes before the start_at of the following booking."
  - id: ERR_BLOCK_WINDOW_EXCEEDED
    http: 409
    condition: "The booking is not entirely inside its block's half-open window [block_start_at, block_end_at)."
  - id: ERR_HLD_EXPIRED
    http: 409
    condition: "The logical clock has reached or passed scope.hld_expires_at at booking start — the 168-hour high-level-disinfection shelf life has lapsed."
  - id: ERR_AUTHORIZATION_EXPIRED
    http: 409
    condition: "A BALLOON_SINUPLASTY booking is created for a case whose auth_expires_at the logical clock has reached; the case is persisted as AUTH_EXPIRED before the rejection."
  - id: ERR_TRIAL_NOT_COMPLETE
    http: 409
    condition: "POST /device-dispenses/{dispenseId}/finalize is called before the logical clock reaches trial_end_at."

  # --- Referential coherence (priority 12) -----------------------------------
  - id: ERR_DEVICE_TYPE_NOT_RECOMMENDED
    http: 409
    condition: "device_type does not equal DEVICE_TYPE_FOR_RECOMMENDATION[study.recommendation] — e.g. an ORAL_APPLIANCE dispensed against a HEARING_AID recommendation, or any dispense against a CPAP or OBSERVATION recommendation."
  - id: ERR_LOT_ITEM_TYPE_MISMATCH
    http: 409
    condition: "The lot's item_type does not match what is being drawn: a dispense's device_type, a vial's ALLERGEN_CONCENTRATE requirement, or a booking's procedure_type (BALLOON_SINUPLASTY needs BALLOON_DEVICE, TYMPANOSTOMY_TUBES needs TYMPANOSTOMY_TUBE)."
  - id: ERR_CASE_PATIENT_MISMATCH
    http: 409
    condition: "The booking's sinuplasty_case_id references a case whose patient_id differs from the booking's patient_id."
  - id: ERR_SCOPE_NOT_READY
    http: 409
    condition: "The booking's endoscope is not in status READY at start and is still serviceable — it is IN_USE, SOILED, REPROCESSING or QUARANTINED. A RETIRED endoscope is NOT reported here; retirement is permanent and is reported at priority 13 as ERR_SCOPE_REASSIGNMENT_REQUIRED."

  # --- Contractual constraints (priority 13) ---------------------------------
  - id: ERR_POLICY_VERSION_DRIFT
    http: 409
    condition: "A BALLOON_SINUPLASTY booking is started while case.pinned_policy_version differs from the PayerPolicy's current version — the plan was amended after authorization."
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "An authorization resubmission is attempted from INFO_REQUESTED while revision_round is already 2."
  - id: ERR_CANDIDACY_NOT_ELIGIBLE
    http: 409
    condition: "An authorization submission or a booking is attempted for a case whose candidacy_status is UNDETERMINED or INELIGIBLE."
  - id: ERR_SERUM_NOT_COVERED
    http: 409
    condition: "A serum conversion is attempted for a patient whose plan has allergy_serum_covered false."
  - id: ERR_APPLIANCE_NOT_COVERED
    http: 409
    condition: "An ORAL_APPLIANCE dispense is attempted for a patient whose plan has appliance_covered false."
  - id: ERR_ADJUSTMENT_LIMIT_REACHED
    http: 409
    condition: "A fourth adjustment is attempted on a dispense whose adjustment_count is already 3."
  - id: ERR_SCOPE_REASSIGNMENT_REQUIRED
    http: 409
    condition: "A booking whose scope_reassignment_required is true is started — its endoscope was RETIRED after two consecutive failed reprocessing completions. Priority 12 skips RETIRED scopes so this rule is reachable."
  - id: ERR_PEDIATRIC_VENUE_REQUIRED
    http: 409
    condition: "A TONSILLECTOMY or TYMPANOSTOMY_TUBES booking for a patient whose age_months is below 36 is venued IN_OFFICE_SUITE."

  # --- Money, volume and inventory (priority 14) -----------------------------
  - id: ERR_SUPPLY_EXHAUSTED
    http: 409
    condition: "The referenced SupplyLot has fewer available units than the request needs — available_quantity 0 for a dispense, or below planned_device_count for a booking."
  - id: ERR_INSUFFICIENT_VIAL_VOLUME
    http: 409
    condition: "vial.volume_ml_remaining is less than the computed dose volume_ml."
  - id: ERR_DEVICE_COUNT_EXCEEDS_AUTHORIZATION
    http: 409
    condition: "A BALLOON_SINUPLASTY booking's planned_device_count exceeds case.authorized_device_count."
  - id: ERR_BLOCK_CAPACITY_EXCEEDED
    http: 409
    condition: "The booking would push the block's booked_minutes past capacity_minutes, or would exceed max_concurrent_cases at some instant inside its half-open interval."
  - id: ERR_BLOCK_NOT_OPEN
    http: 409
    condition: "A booking is created against a SurgeryCenterBlock whose status is FULL or CLOSED."

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
# All six roles are `opaque`: X-User-ID is a staff operator identifier that is
# never required to equal any persisted entity's id. The scaffold stores those
# identifiers on rows (mixed_by_user_id, submitted_by_user_id,
# performed_by_user_id, dispensed_by_user_id, reprocessing_started_by_user_id,
# physician_user_id, supervising_user_id, attending_physician_user_id) purely so
# the segregation-of-duties and run-continuity checks at priority 9 have
# something to compare.
# =============================================================================
roles:

  - name: PracticeAdmin
    description: "Practice manager. Owns configuration, the patient and asset registries, inventory, surgery-center blocks, refund settlement and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /payer-policies"
      - "PATCH /payer-policies/{policyId}"
      - "POST /patients"
      - "POST /endoscopes"
      - "POST /supply-lots"
      - "POST /supply-lots/{lotId}/adjustments"
      - "POST /surgery-center-blocks"
      - "POST /surgery-center-blocks/{blockId}/close"
      - "POST /device-dispenses/{dispenseId}/refund-settlement"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "PATCH /patients/{patientId} (with AllergyNurse)"
      - "POST /procedure-bookings (with Otolaryngologist)"
      - "POST /procedure-bookings/{bookingId}/cancel (with Otolaryngologist)"
      - "every GET read endpoint"

  - name: Otolaryngologist
    description: "Treating physician. Orders panels and studies, documents sinuplasty candidacy, interprets studies, and runs procedures."
    identity: opaque
    exclusive_operations:
      - "POST /sinuplasty-cases"
      - "POST /sinuplasty-cases/{caseId}/documentation"
      - "POST /diagnostic-studies"
      - "POST /procedure-bookings/{bookingId}/start"
      - "POST /procedure-bookings/{bookingId}/complete"
    shared_operations:
      - "POST /allergy-test-orders (with AllergyNurse)"
      - "POST /allergy-test-orders/{orderId}/readings (with AllergyNurse)"
      - "POST /diagnostic-studies/{studyId}/interpretation (with Audiologist)"
      - "POST /procedure-bookings (with PracticeAdmin)"
      - "POST /procedure-bookings/{bookingId}/cancel (with PracticeAdmin)"
      - "GET /sinuplasty-cases/{caseId}/candidacy-evaluation (with PracticeAdmin and PayerLiaison)"
      - "every GET read endpoint"

  - name: AllergyNurse
    description: "Allergy clinic nurse. Administers panels, records reactions, compounds and verifies extract vials, and gives immunotherapy doses."
    identity: opaque
    exclusive_operations:
      - "POST /allergy-test-orders/{orderId}/administer"
      - "POST /allergy-test-orders/{orderId}/convert-to-serum"
      - "POST /reaction-events"
      - "POST /immunotherapy-vials"
      - "POST /immunotherapy-vials/{vialId}/label-verification"
      - "POST /immunotherapy-vials/{vialId}/discard"
      - "POST /immunotherapy-doses"
      - "POST /immunotherapy-doses/{doseId}/clear-observation"
      - "POST /immunotherapy-doses/{doseId}/void"
    shared_operations:
      - "POST /allergy-test-orders (with Otolaryngologist)"
      - "POST /allergy-test-orders/{orderId}/readings (with Otolaryngologist)"
      - "PATCH /patients/{patientId} (with PracticeAdmin)"
      - "every GET read endpoint"

  - name: Audiologist
    description: "Audiology and sleep services. Performs studies and dispenses, adjusts, returns and finalizes hearing aids and oral appliances."
    identity: opaque
    exclusive_operations:
      - "POST /diagnostic-studies/{studyId}/results"
      - "POST /device-dispenses"
      - "POST /device-dispenses/{dispenseId}/adjustments"
      - "POST /device-dispenses/{dispenseId}/trial-return"
      - "POST /device-dispenses/{dispenseId}/finalize"
    shared_operations:
      - "POST /diagnostic-studies/{studyId}/interpretation (with Otolaryngologist)"
      - "every GET read endpoint"

  - name: SterileProcessingTech
    description: "Endoscopy suite reprocessing technician. Owns high-level-disinfection runs from start to documented completion."
    identity: opaque
    exclusive_operations:
      - "POST /endoscopes/{scopeId}/reprocessing-start"
      - "POST /endoscopes/{scopeId}/reprocessing-completion"
    shared_operations:
      - "every GET read endpoint"

  - name: PayerLiaison
    description: "Prior-authorization coordinator. Submits and resubmits cases to payers and records payer decisions."
    identity: opaque
    exclusive_operations:
      - "POST /sinuplasty-cases/{caseId}/authorization-submissions"
      - "POST /sinuplasty-cases/{caseId}/payer-decisions"
    shared_operations:
      - "GET /sinuplasty-cases/{caseId}/candidacy-evaluation (with PracticeAdmin and Otolaryngologist)"
      - "every GET read endpoint"

segregation_of_duties:
  - name: vial_mixer_is_not_verifier
    step_a: "POST /immunotherapy-vials (recorded as mixed_by_user_id)"
    step_b: "POST /immunotherapy-vials/{vialId}/label-verification"
    rule: "X-User-ID at step B must differ from mixed_by_user_id."
    error_id: ERR_SELF_VERIFICATION_FORBIDDEN
  - name: case_submitter_is_not_decider
    step_a: "POST /sinuplasty-cases/{caseId}/authorization-submissions (recorded as submitted_by_user_id)"
    step_b: "POST /sinuplasty-cases/{caseId}/payer-decisions"
    rule: "X-User-ID at step B must differ from submitted_by_user_id."
    error_id: ERR_SELF_DECISION_FORBIDDEN
  - name: study_performer_is_not_interpreter
    step_a: "POST /diagnostic-studies/{studyId}/results (recorded as performed_by_user_id)"
    step_b: "POST /diagnostic-studies/{studyId}/interpretation"
    rule: "X-User-ID at step B must differ from performed_by_user_id."
    error_id: ERR_SELF_INTERPRETATION_FORBIDDEN
  - name: dispenser_is_not_settler
    step_a: "POST /device-dispenses (recorded as dispensed_by_user_id)"
    step_b: "POST /device-dispenses/{dispenseId}/refund-settlement"
    rule: "X-User-ID at step B must differ from dispensed_by_user_id."
    error_id: ERR_SELF_SETTLEMENT_FORBIDDEN
  - name: reprocessing_run_continuity
    step_a: "POST /endoscopes/{scopeId}/reprocessing-start (recorded as reprocessing_started_by_user_id)"
    step_b: "POST /endoscopes/{scopeId}/reprocessing-completion"
    rule: "X-User-ID at step B must EQUAL reprocessing_started_by_user_id — the inverse of the other four rules, so a tech cannot document a run they did not run."
    error_id: ERR_REPROCESSING_TECH_MISMATCH
