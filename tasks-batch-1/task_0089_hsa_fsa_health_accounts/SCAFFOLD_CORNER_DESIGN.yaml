scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_participant_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Participant, endpoints]
        distinguishing_aspect: "POST /participants with all required fields returns 201; response carries server-minted id, created_at, version==1, and the default marital_status=SINGLE, hdhp_covered=false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /participants"
              payload: { email: "new@x.com", full_name: "New P", birth_date: "1991-02-03" }
              as: PlanAdmin
              captures: { p_id: $.data.id, ver: $.data.version }
          assert:
            - "Response code 201; Participant.${p_id}.version == 1"
            - "Participant.${p_id}.marital_status == SINGLE and hdhp_covered == false (defaults applied)"

      - name: duplicate_participant_email_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Participant.fields.email, "validations[priority=20]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second participant with an email already in use returns 409 ERR_DUPLICATE_EMAIL."
        test_recipe:
          setup: ["One participant already registered with email dup@x.com."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "dup@x.com", full_name: "First", birth_date: "1990-01-01" }
              as: PlanAdmin
          trigger:
            - call: "POST /participants"
              payload: { email: "dup@x.com", full_name: "Second", birth_date: "1991-01-01" }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409; error_id == ERR_DUPLICATE_EMAIL"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{id} for a non-existent UUID returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response code 404; error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_account_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Account, "errors[ERR_INVALID_REQUEST]", "validations[priority=18]"]
        distinguishing_aspect: "POST /accounts omitting required elected_amount_cents returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A plan year and participant exist."]
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "mr@x.com", full_name: "MR", birth_date: "1990-01-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA" }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response code 400; error_id == ERR_INVALID_REQUEST (elected_amount_cents missing)"

      - name: account_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.Account.fields.funding_status, entities.Account.fields.available_balance_cents]
        distinguishing_aspect: "On POST /accounts the server sets funding_status=PENDING and available_balance_cents=0 itself; these are not client inputs (input schema excludes them)."
        test_recipe:
          setup: ["A plan year and HDHP participant exist."]
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "cf@x.com", full_name: "CF", birth_date: "1990-01-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { fs: $.data.funding_status, abal: $.data.available_balance_cents }
          assert:
            - "Account funding_status == PENDING and compliance_hold == CLEAR on creation"
            - "Account available_balance_cents == 0, contributed_cents == 0, reimbursed_cents == 0 on creation"

      - name: list_accounts_pagination_envelope
        claim_type: Listing
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "GET /accounts returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["A plan year, a participant, and one account exist."]
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "lp@x.com", full_name: "LP", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 100000 }
              as: PlanAdmin
          trigger:
            - call: "GET /accounts?participant_id=${p_id}&limit=10&offset=0"
              payload: {}
              as: PlanAdmin
          assert:
            - "Response envelope meta.total_count == 1 and has_more == false; data is an array of length 1"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: adjudicate_already_denied_claim_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.SUBMITTED_to_DENIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DENIED claim is terminal; a second adjudicate returns 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["A SUBMITTED MEDICAL claim on an ACTIVE HEALTH_FSA has been DENIED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "d@x.com", full_name: "D", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 100000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "MEDICAL", claimed_amount_cents: 50000, substantiated: true }
              as: PlanAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "DENY", denial_reason: "NOT_QUALIFIED" }
              as: Adjudicator
              as_user_id: "adj-1"
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409; error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == DENIED (unchanged)"

      - name: resubmit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.PENDING_SUBSTANTIATION_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resubmit is only valid from PENDING_SUBSTANTIATION; calling it on a SUBMITTED claim returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SUBMITTED claim exists (never sent to PENDING_SUBSTANTIATION)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "rs@x.com", full_name: "RS", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 100000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "MEDICAL", claimed_amount_cents: 50000, substantiated: true }
              as: Participant
              as_user_id: "${p_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/resubmit"
              payload: { substantiated: true }
              as: Participant
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409; error_id == ERR_INVALID_STATE; Claim.${claim_id}.status == SUBMITTED"

      - name: activate_already_active_account_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Account.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE account a second time returns 409 ERR_INVALID_STATE (precondition funding_status==PENDING fails)."
        test_recipe:
          setup: ["An ACTIVE HEALTH_FSA exists."]
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "aa@x.com", full_name: "AA", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 100000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409; error_id == ERR_INVALID_STATE; Account.${acc_id}.funding_status == ACTIVE"

      - name: claim_depletes_then_contribution_reopens_account
        claim_type: side_effect
        grounds: [state_machines.Account.DEPLETED_to_ACTIVE, calculations.Available-Balance, entities.Account.fields.funding_status]
        distinguishing_aspect: "A DEPLETED HSA returns to ACTIVE when a fresh CONTRIBUTION lifts available_balance_cents above 0 (bubble-up funding side effect)."
        test_recipe:
          setup: ["An HSA contributed 100000, a 100000 claim REIMBURSED -> available 0, funding_status DEPLETED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "dep@x.com", full_name: "Dep", birth_date: "1990-01-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 100000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${acc_v1}" }
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-03-01", expense_category: "MEDICAL", claimed_amount_cents: 100000, substantiated: true }
              as: PlanAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${claim_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { batch_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v2: $.data.version }
            - call: "POST /reimbursement-batches/${batch_id}/disburse"
              payload: { expected_account_version: "${acc_v2}" }
              as: FundDisburser
              as_user_id: "disb-1"
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { acc_v3: $.data.version }
          trigger:
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 25000, source: "EMPLOYER", posted_at: "2026-05-01T00:00:00Z", expected_account_version: "${acc_v3}" }
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { fs: $.data.funding_status, abal: $.data.available_balance_cents }
          assert:
            - "Account.${acc_id}.available_balance_cents == 25000 after the new contribution"
            - "Account.${acc_id}.funding_status == ACTIVE (DEPLETED -> ACTIVE reopen)"

      - name: account_depleted_to_active_excluded_via_clawback
        claim_type: side_effect
        grounds: [state_machines.Claim.REIMBURSED_to_VOIDED]
        excluded_because:
          difficulty_instance: compensating_invariant / reimburse_then_clawback_conserves_fsa_election_pool
          rationale: "The REIMBURSED->VOIDED clawback and its balance-restoring cascade are asserted by the named §1.8 instance."

      - name: claim_reimbursed_via_disburse_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.Claim.APPROVED_to_REIMBURSED]
        excluded_because:
          difficulty_instance: transitive_cascade / disburse_cascade_depth3_claim_ledger_account_depletion
          rationale: "The APPROVED->REIMBURSED transition and REIMBURSEMENT ledger append are asserted by the named §1.8 instance."

      - name: batch_partial_settlement_when_later_claim_underfunded
        claim_type: valid_transition
        grounds: [state_machines.ReimbursementBatch.DRAFT_to_PARTIAL, entities.ReimbursementBatch.fields.status, entities.ReimbursementBatch.fields.total_reimbursed_cents]
        distinguishing_aspect: "A batch [C1, C2] whose first claim (40000) reimburses but second (30000) is skipped for insufficient cash settles to PARTIAL with total_reimbursed_cents == 40000."
        test_recipe:
          setup: ["An ACTIVE HEALTH_FSA, elected 50000; C1 (40000) and C2 (30000) both APPROVED while balance was full; batch [C1, C2] created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "pt@x.com", full_name: "PT", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 50000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "MEDICAL", claimed_amount_cents: 40000, substantiated: true }
              as: Participant
              as_user_id: "${p_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /claims/${c1_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-02", expense_category: "DENTAL", claimed_amount_cents: 30000, substantiated: true }
              as: Participant
              as_user_id: "${p_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /claims/${c2_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${c1_id}", "${c2_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { batch_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v: $.data.version }
          trigger:
            - call: "POST /reimbursement-batches/${batch_id}/disburse"
              payload: { expected_account_version: "${acc_v}" }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { st: $.data.status, tot: $.data.total_reimbursed_cents }
          assert:
            - "ReimbursementBatch.${batch_id}.status == PARTIAL and total_reimbursed_cents == 40000"
            - "Claim.${c1_id}.status == REIMBURSED; Claim.${c2_id}.status == APPROVED (skipped, cash 10000 < 30000)"

      - name: reverse_already_reversed_contribution_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Contribution.POSTED_to_REVERSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reversing an already-REVERSED contribution a second time returns 409 ERR_INVALID_STATE (precondition status==POSTED fails)."
        test_recipe:
          setup: ["An ACTIVE HSA with one contribution that has already been REVERSED."]
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "rr@x.com", full_name: "RR", birth_date: "1990-01-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 50000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${acc_v1}" }
              as: PlanAdmin
              captures: { contrib_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { acc_v2: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions/${contrib_id}/reverse"
              payload: { expected_account_version: "${acc_v2}" }
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { acc_v3: $.data.version }
          trigger:
            - call: "POST /accounts/${acc_id}/contributions/${contrib_id}/reverse"
              payload: { expected_account_version: "${acc_v3}" }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409; error_id == ERR_INVALID_STATE; Contribution.${contrib_id}.status == REVERSED (unchanged)"

      - name: resettle_settled_plan_year_returns_invalid_state
        claim_type: invalid_transition
