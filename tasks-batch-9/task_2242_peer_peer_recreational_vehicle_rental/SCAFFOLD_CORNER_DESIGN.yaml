      - name: decreasing_odometer_reading_violates_the_regression_rule
        claim_type: violation_to_error
        grounds:
          - validations[priority 31]
          - errors[ERR_METER_READING_REGRESSION]
          - calculations.metered_overage
        distinguishing_aspect: >-
          A MID_TRIP reading whose odometer_miles (41900) is below the preceding
          PRE_TRIP reading (42000) is rejected 422 ERR_METER_READING_REGRESSION
          even though its generator_hours are non-decreasing — either component
          regressing is enough, and no MeterReading row is persisted.
        test_recipe:
          setup: >-
            Full canonical marketplace with booking B1 CONFIRMED and a single
            PRE_TRIP reading at 42000 miles / 120.0 generator hours.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
