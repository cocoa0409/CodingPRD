              as: Appraiser
              captures: { a17: $.data.id }
            - call: "POST /atl/appraisals/${a17}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-17"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b17}", appraisal_id: "${a17}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app17: $.data.id }
            - call: "POST /atl/applications/${app17}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "underwriter-14"
              captures: { loan17: $.data.id }
          trigger:
            - call: "POST /atl/loans/${loan17}/payments"
              payload: { amount_cents: 100000, payment_type: "REGULAR" }
