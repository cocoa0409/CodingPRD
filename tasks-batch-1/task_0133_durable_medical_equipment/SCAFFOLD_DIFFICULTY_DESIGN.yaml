              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0009", description: "Wheelchair temporal-occ", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: true, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-I1", length_of_need_months: 12, signed_date: "2025-12-15" }
              as: PhysicianUser
              captures: { cmn1_id: $.data.id }
            - call: "POST /cmns/${cmn1_id}/activate"
              payload: { expected_order_version: "${order_v0}" }
              as: PhysicianUser
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-I2", length_of_need_months: 24, signed_date: "2026-02-01" }
              as: PhysicianUser
              captures: { cmn2_id: $.data.id }
          trigger:
            - call: "POST /cmns/${cmn2_id}/activate"
              payload: { expected_order_version: "${order_v0}" }
              as: PhysicianUser
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CMN_SIGNED_AFTER_ORDER (business_temporal priority 13 beats OCC priority 14)"
            - "HTTP status == 422"

