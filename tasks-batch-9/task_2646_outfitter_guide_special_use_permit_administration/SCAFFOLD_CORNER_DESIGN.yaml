            - call: "POST /osup/permit-applications/${app_2}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/use-areas/${ua_id}/allocation-summary"
              payload: {}
              as: PermitSpecialist
          assert:
            - "after the 1-day screen: demand_ratio == 0.0313, because 1/32 = 0.03125 rounds HALF-UP at the fourth decimal; 0.0312 (truncation or half-even) is wrong"
            - "the same read shows pending 1, available 31, allocatable 32 as exact integers — no rounding is applied to day counts"
            - "after issuance the day moves pending -> committed and demand_ratio is UNCHANGED at 0.0313: the numerator is committed + pending, so a transfer between the two terms cannot move the ratio"
            - "after the 3-day screen: committed 1, pending 3, available 28, demand_ratio == 0.1250 — four decimal places with the trailing zero retained, not 0.125"

      - name: outfitter_status_propagation_terminates_and_leaves_prior_permit_count_intact
        claim_type: constraint_propagation
        grounds:
          - calculations.outfitter_status_derivation
          - entities.Outfitter.prior_permit_count
          - entities.Outfitter.active_permit_count
        distinguishing_aspect: |
          The derivation is a first-match-wins ladder with a THIRD branch (held_count) that is easy to
          drop: an outfitter holding only ISSUED permits — none ACTIVE, none SUSPENDED — must read
          PERMITTED, not APPLICANT. Revoking the permits walks the ladder back down to APPLICANT and
          the propagation stops there, while prior_permit_count keeps counting every permit ever
          issued, which is what later feeds prospectus experience_pts.
        test_recipe:
          setup:
            - "Alpine holds two ISSUED permits in two different areas (BRW-01 900 allocatable, WIL-02 2000 allocatable), so the 14-day term-conflict rule never engages"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
