  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: day_entry_same_type_overlap_rejected_but_cross_type_allowed
        grounds:
          - validations[priority=10]
          - entities.CaseDayCountEntry.fields.start_date
        distinguishing_aspect: |
          Per-type closed-interval semantics on the IncidentCase resource: two
          ACTIVE RESTRICTED entries sharing one calendar day (..08-12 vs
          08-12.., touching at 08-12) conflict because intervals are INCLUSIVE
          at both ends. A DAYS_AWAY entry over identical dates is allowed —
          overlap is only evaluated WITHIN day_type.
        test_recipe:
          setup:
            - "Company C, Establishment E, Employee W; case K RECORDABLE (JOB_TRANSFER_RESTRICTION) at clock 2026-08-05"
            - "Existing ACTIVE RESTRICTED entry 2026-08-10..2026-08-12"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Omicron Co", fein: "55-9990001" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Bakery 2", naics_code: "311811", state_code: "IL", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Worker Fourteen", job_title: "Baker", hire_date: "2023-10-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-04T10:00:00Z", description: "Wrist strain", body_part: "wrist", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "JOB_TRANSFER_RESTRICTION", expected_case_version: "${case_v}" }
              as: SafetyOfficer
            - call: "POST /safety/cases/${case_id}/day-entries"
              payload: { day_type: "RESTRICTED", start_date: "2026-08-10", end_date: "2026-08-12" }
              as: SafetyOfficer
          trigger:
            - call: "POST /safety/cases/${case_id}/day-entries"
              payload: { day_type: "RESTRICTED", start_date: "2026-08-12", end_date: "2026-08-15" }
              as: SafetyOfficer
              captures: { err_overlap: $.data.error_id }
            - call: "POST /safety/cases/${case_id}/day-entries"
              payload: { day_type: "DAYS_AWAY", start_date: "2026-08-10", end_date: "2026-08-12" }
              as: SafetyOfficer
              captures: { cross_type_days: $.data.calendar_days }
          assert:
            - "touching RESTRICTED intervals (share 2026-08-12) -> error_id == ERR_DAY_INTERVAL_INVALID"
            - "DAYS_AWAY over identical dates accepted (cross-type overlap permitted); calendar_days == 3"
            - "interval semantics: closed intervals, per-day_type collision domain on the case resource"

      - name: contest_window_working_day_vs_summary_fixed_calendar_window
        grounds:
          - calculations.contest_deadline_calc
          - entities.AnnualSummary.fields.posting_window_open
        distinguishing_aspect: |
          Aggregate-window semantics with DIFFERENT interval arithmetic from
          per-type closed intervals and on different resources: the citation
          contest window uses working-day rollup (weekends skipped; a citation
          created Sat 2026-08-01 rolls day 0 to Monday, landing the same
          2026-08-24T23:59:59Z deadline as one created Mon 2026-08-03), while
          the 300A posting window is a fixed calendar interval
          [2027-02-01T00:00:00Z, 2027-04-30T23:59:59Z] that never shifts.
        test_recipe:
          setup:
            - "Company C, Establishment E; Inspection I"
            - "Citation A created at clock Sat 2026-08-01; Citation B at clock Mon 2026-08-03"
            - "Summary S for (E, 2026) created (DRAFT) exposing window dates"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Pi LLC", fein: "55-1231234" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Dock 4", naics_code: "488320", state_code: "CA", size_class: "STANDARD" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/inspections"
              payload: { establishment_id: "${est_id}", opened_on: "2026-08-01", inspection_type: "REFERRAL", scope: "RECORDS_ONLY" }
              as: SafetyOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /safety/citations"
              payload: { inspection_id: "${insp_id}", standard_cited: "29 CFR 1904.7", violation_type: "OTHER_THAN_SERIOUS", proposed_penalty_usd: 1000, abatement_due_date: "2026-09-01" }
              as: SafetyOfficer
              captures: { cit_a: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/citations"
              payload: { inspection_id: "${insp_id}", standard_cited: "29 CFR 1904.29", violation_type: "SERIOUS", proposed_penalty_usd: 7000, abatement_due_date: "2026-09-01" }
              as: SafetyOfficer
              captures: { cit_b: $.data.id }
            - call: "POST /safety/summaries"
              payload: { establishment_id: "${est_id}", year: 2026 }
              as: RecordkeepingCoordinator
              captures: { sum_id: $.data.id }
          trigger:
            - call: "GET /safety/citations/${cit_a}"
              payload: {}
              as: SafetyOfficer
              captures: { cit_a_deadline: $.data.contest_deadline }
            - call: "GET /safety/citations/${cit_b}"
              payload: {}
              as: SafetyOfficer
              captures: { cit_b_deadline: $.data.contest_deadline }
            - call: "GET /safety/summaries/${sum_id}"
              payload: {}
              as: RecordkeepingCoordinator
              captures: { win_open: $.data.posting_window_open, win_close: $.data.posting_window_close }
          assert:
            - "citation A (created Sat 2026-08-01): contest_deadline == 2026-08-24T23:59:59Z (day 0 rolled to Mon 08-03)"
            - "citation B (created Mon 2026-08-03): contest_deadline == 2026-08-24T23:59:59Z — identical deadline despite different creation dates"
            - "summary.posting_window_open == 2027-02-01T00:00:00Z and posting_window_close == 2027-04-30T23:59:59Z (fixed calendar interval)"
            - "interval arithmetic differs: working-day rollup (citation) vs fixed calendar window (summary)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: day_entry_void_preserves_case_day_totals
        grounds:
          - calculations.day_count_rollup
          - entities.CaseDayCountEntry.fields.status
        distinguishing_aspect: |
          Conserved quantity = per-case sum of ACTIVE calendar_days per
          day_type. Forward: add RESTRICTED entry (4 days). Compensation: void
          the same entry. Invariant: restricted_days_count returns exactly to
          its pre-add value (0); total ACTIVE calendar_days returns to 0 with
          no drift.
        test_recipe:
          setup:
            - "Company C, Establishment E, Employee W; case K RECORDABLE (JOB_TRANSFER_RESTRICTION) at clock 2026-08-03"
            - "Baseline: restricted_days_count == 0, days_away_count == 0"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Rho Corp", fein: "55-4564567" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Press 1", naics_code: "323111", state_code: "NY", size_class: "STANDARD" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Worker Fifteen", job_title: "Pressman", hire_date: "2020-07-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-01T10:00:00Z", description: "Finger pinch", body_part: "finger", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "JOB_TRANSFER_RESTRICTION", expected_case_version: "${case_v}" }
              as: SafetyOfficer
            - call: "GET /safety/cases/${case_id}"
              payload: {}
              as: SafetyOfficer
              captures: { base_restr: $.data.restricted_days_count, base_away: $.data.days_away_count }
          trigger:
            - call: "POST /safety/cases/${case_id}/day-entries"
              payload: { day_type: "RESTRICTED", start_date: "2026-08-04", end_date: "2026-08-07" }
              as: SafetyOfficer
              captures: { entry_id: $.data.id }
            - call: "GET /safety/cases/${case_id}"
              payload: {}
              as: SafetyOfficer
              captures: { mid_restr: $.data.restricted_days_count }
            - call: "POST /safety/cases/${case_id}/day-entries/${entry_id}/void"
              payload: {}
              as: SafetyOfficer
            - call: "GET /safety/cases/${case_id}"
              payload: {}
              as: SafetyOfficer
              captures: { end_restr: $.data.restricted_days_count, end_away: $.data.days_away_count }
          assert:
            - "baseline: restricted_days_count == 0 and days_away_count == 0"
            - "after add: restricted_days_count == 4 (2026-08-04..2026-08-07 inclusive)"
            - "after void: restricted_days_count == 0 and days_away_count == 0 — exact restoration, no drift"

      - name: summary_prepare_bounce_preserves_case_count
        grounds:
          - state_machines.AnnualSummary.PREPARED_to_DRAFT
          - state_machines.AnnualSummary.DRAFT_to_PREPARED
          - calculations.summary_rollup
        distinguishing_aspect: |
          Conserved quantity = recordable case COUNT for (establishment,
          log_year) across the summary DRAFT round-trip — a different conserved
          quantity from day totals. Forward: prepare (captures 2 cases, 4
          restricted days). Perturbation: a recordability-neutral day-entry add
          bounces the summary to DRAFT. Compensation: re-prepare. Invariant:
          total_recordable_cases == 2 before AND after; only the day totals
          change (4 -> 6).
        test_recipe:
          setup:
