      - name: grant_capacity_counts_the_indirect_pool_and_is_the_last_business_check
        claim_type: error_triggerability
        grounds:
          - errors[ERR_GRANT_FUNDS_EXCEEDED]
          - validations[priority=39]
          - calculations.grant_obligation_rollup
          - entities.GrantAward.fields.remaining_cents
        distinguishing_aspect: |
          Priority 39 is stated over remaining_cents recomputed WITH the candidate line, and remaining_cents is net of the
          indirect pool, so capacity is not the raw allocation. On a 100000 award a single 100000 direct line overshoots by
          the whole 8120 pool. The instance then certifies 92000 (obligated 99470, remaining 530) and offers a 500 line —
          smaller than the reported remaining — which must STILL be refused because the extra direct spend drags the pool
          up by 41 cents, leaving remaining at minus 11. A 400 line then fits with remaining 97. An implementation that
          compares the line against remaining_cents, instead of re-running the rollup, accepts the 500 line.
        test_recipe:
          setup:
            - "One STATE_APPROVED ProgramOfStudy and one GrantAward for fiscal_year 2027 with allocation_cents 100000, admin_cap_cents 5000 and an obligation window of 2026-07-01 to 2027-06-30."
            - "Four REQUESTED PROFESSIONAL_DEVELOPMENT Expenditures on that grant with quantity 1 and unit_cost_cents 100000, 92000, 500 and 400, whose federal share is 1.0 so approved_cents equals gross_cents."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
