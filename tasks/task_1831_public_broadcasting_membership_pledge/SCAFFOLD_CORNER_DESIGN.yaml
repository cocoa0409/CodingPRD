              as: MembershipCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${d_id}", membership_id: "${m_id}", drive_id: "${drv_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 6000 }
              as: PhoneVolunteer
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /station/pledges/${p_id}/payments"
              payload: { amount_cents: 6001, expected_pledge_version: "${p_v}" }
              as: PhoneVolunteer
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_PAYMENT_AMOUNT (6001 > 6000 remaining)"

      - name: segregation_of_duties_finalize_by_drafter_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The same X-User-ID that drafted an NFFS report cannot finalize it: ERR_SEGREGATION_OF_DUTIES. Note: finalize is a StationAdmin-only endpoint, so the test uses a StationAdmin user id equal to the recorded drafted_by_user_id."
        test_recipe:
          setup: ["NFFS report drafted; drafted_by_user_id recorded as 'coord-7001'"]
          setup_api_calls:
            - call: "POST /station/nffs-reports"
              payload: { fiscal_year: 2026 }
              as: MembershipCoordinator
              as_user_id: "coord-7001"
              captures: { rpt_id: $.data.id, rpt_drafter: $.data.drafted_by_user_id }
          trigger:
            - call: "POST /station/nffs-reports/${rpt_id}/finalize"
              payload: {}
              as: StationAdmin
              as_user_id: "coord-7001"
              captures: { err_code: $.data.error_id }
          assert:
            - "${rpt_drafter} == coord-7001"
            - "${err_code} == ERR_SEGREGATION_OF_DUTIES (finalizer id equals drafter id)"
            - "NFFSReport.${rpt_id}.status remains DRAFT"

      - name: duplicate_level_code_rejected
        claim_type: violation_to_error
        grounds: [entities.MembershipLevel.fields.code, "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "Creating a second MembershipLevel with an existing code yields ERR_DUPLICATE_CODE (409)."
