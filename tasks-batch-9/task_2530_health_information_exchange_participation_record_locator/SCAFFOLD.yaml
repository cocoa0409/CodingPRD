scenario: |
  Generate task harder than expert level!

  2530. Health Information Exchange Participation & Record Locator (statewide health information
  exchange): participant onboarding with legal agreements and technical conformance testing, patient
  matching across participants with demographic algorithms and threshold tuning, consent model
  administration (opt-in, opt-out, sensitive category segmentation), record locator queries and audit
  logging of every access, event notification subscriptions for admission, discharge and transfer
  alerts, data quality monitoring of feeds with participant scorecards, break-the-glass emergency
  access and post-hoc review, participation fees and public health reporting conduits
domain_name: health-information-exchange-record-locator
api_prefix: "/hie"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  entity_topology_note: |
    PatientRecord nodes are joined by MatchLink edges into IdentityCluster components; IdentityCluster
    references itself through merged_into_cluster_id and ConsentDirective references itself through
    supersedes_directive_id. There is no single ownership tree: PatientRecord belongs to a Participant
    AND to an IdentityCluster, and MatchLink is a junction carrying its own score/lifecycle.
  state_machine_shape: cyclic
  state_machine_shape_note: |
    Participant onboarding loops CONFORMANCE_TESTING -> REMEDIATION -> CONFORMANCE_TESTING and
    CERTIFIED -> SUSPENDED -> CERTIFIED. BreakGlassAccess carries two independent state axes
    (session_status x review_status). MatchLink forks PROPOSED -> {AUTO_LINKED, PENDING_REVIEW,
    REJECTED} with a divergent side-effect set per branch and loops LINKED -> UNLINKED ->
    PENDING_REVIEW. DataFeed loops MONITORED -> DEGRADED -> MONITORED.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  role_model_note: |
    The HieAdmin who executes a participant's legal agreement may not certify it; the HieAdmin who
    tuned the ACTIVE MatchThresholdConfig may not steward links scored by it; the PrivacyOfficer who
    decides a break-the-glass review must be the one who claimed it and must not be the invoking
    clinician.
  consistency_model: immediate
  difficulty_level: beyond_expert
  difficulty_note: |
    Density, not volume, carries the difficulty: one demographic score formula feeds both link routing
    and record-locator cluster resolution; one consent evaluator is re-entered by break-the-glass and
    public-health conduits; one scorecard feeds both feed lifecycle and fee multipliers; and the fee
    engine's per-tier rounding order is observable to the cent.

entities:
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the participating organization
        constraints: "1..200 chars, non-blank"
      - name: org_type
        type: enum
        source: input
        description: organizational category driving conduit eligibility
        constraints: "HOSPITAL | CLINIC | LAB | HEALTH_PLAN | PUBLIC_HEALTH"
      - name: declared_annual_patient_volume
        type: integer
        source: input
        description: self-declared annual unique patient count used for the PROVISIONAL fee basis
        constraints: ">= 0, <= 50000000"
      - name: primary_contact_email
        type: string
        source: input
        description: onboarding contact mailbox
        constraints: "must contain '@'"
      - name: onboarding_status
        type: enum
        source: system
        description: onboarding/participation lifecycle state (see state_machines.Participant)
        default: APPLIED
        constraints: "APPLIED | LEGAL_REVIEW | AGREEMENT_EXECUTED | CONFORMANCE_TESTING | REMEDIATION | CERTIFIED | SUSPENDED | WITHDRAWN | TERMINATED"
      - name: agreement_version
        type: string
        source: input
        description: version label of the executed data use and reciprocal support agreement
        default: null
      - name: agreement_signed_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the agreement was countersigned
        default: null
      - name: agreement_executed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HieAdmin that executed the agreement; segregation-of-duties anchor (not an FK)"
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HieAdmin that certified the participant (not an FK)"
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of the CERTIFY transition
        default: null
      - name: suspension_reason
        type: string
        source: system
        description: "reason recorded on the most recent SUSPEND transition; literal AUTOMATIC_SANCTION_THRESHOLD when the sanction cascade fired"
        default: null
      - name: conformance_attempt_count
        type: integer
        source: computed
        description: total ConformanceTest rows created for this participant across all profiles
        default: 0
      - name: consecutive_failed_attempts
        type: integer
        source: computed
        description: FAILED ConformanceTest rows since the last PASSED/WAIVED result or REMEDIATION re-entry
        default: 0
      - name: remediation_count
        type: integer
        source: computed
        description: number of times the participant entered REMEDIATION
        default: 0
      - name: passed_profiles
        type: array
        source: computed
        description: distinct profiles with at least one PASSED or WAIVED ConformanceTest, sorted ascending
        default: []
      - name: fee_tier
        type: enum
        source: computed
        description: highest fee tier reached by the most recent fee computation for this participant
        default: TIER_1
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: provisional_monthly_fee_cents
        type: integer
        source: computed
        description: participation_fee calculation under the PROVISIONAL variant, refreshed on create
        default: 0
      - name: quality_score
        type: number
        source: computed
        description: participant_quality_score output over qualifying FeedQualitySample rows; null when no sample qualifies
        default: null
      - name: quality_grade
        type: enum
        source: computed
        description: letter grade derived from quality_score; UNGRADED when quality_score is null
        default: UNGRADED
        constraints: "A | B | C | D | UNGRADED"
      - name: sanction_points_active
        type: integer
        source: computed
        description: break_glass_sanction_points output over non-decayed UNJUSTIFIED reviews
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "sum of ParticipationInvoice.total_cents for this participant with status IN {ISSUED, DELINQUENT}"
        default: 0
      - name: active_subscription_count
        type: integer
        source: computed
        description: count of NotificationSubscription rows for this participant with status == ACTIVE
        default: 0

  - name: ConformanceTest
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the organization under test (path-derived)"
      - name: profile
        type: enum
        source: input
        description: conformance profile exercised by this run
        constraints: "QUERY_RESPONDER | ADT_PUBLISHER | DOCUMENT_SOURCE | ADT_SUBSCRIBER | PUBLIC_HEALTH_CONDUIT"
      - name: attempt_number
        type: integer
        source: computed
        description: 1-based ordinal of this run among the participant's runs for the same profile, ordered by created_at ASC
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the booked sandbox window
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the booked sandbox window
        constraints: "must be strictly after scheduled_start"
      - name: status
        type: enum
        source: system
        description: run outcome state (see state_machines.ConformanceTest)
        default: RUNNING
        constraints: "RUNNING | PASSED | FAILED | WAIVED"
      - name: assertions_total
        type: integer
        source: input
        description: number of conformance assertions executed
        default: null
        constraints: ">= 1 when results are submitted"
      - name: assertions_passed
        type: integer
        source: input
        description: number of assertions that passed
        default: null
        constraints: "0 <= assertions_passed <= assertions_total"
      - name: pass_rate
        type: number
        source: computed
        description: conformance_pass_rate output, 4 decimal places
        default: null
      - name: failure_categories
        type: array
        source: input
        description: "reported failure buckets; members of {SECURITY, PATIENT_ID_INTEGRITY, VOCABULARY, TRANSPORT, PAYLOAD_STRUCTURE}"
        default: []
      - name: critical_failure
        type: boolean
        source: computed
        description: "true when failure_categories intersects {SECURITY, PATIENT_ID_INTEGRITY}"
        default: false
      - name: waiver_reason
        type: string
        source: input
        description: HieAdmin justification recorded on a FAILED -> WAIVED transition
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: "X-User-ID that submitted the results (not an FK)"
        default: null

  - name: ConsentPolicy
    parent: null
    common_fields: true
    fields:
      - name: policy_version
        type: string
        source: input
        description: human label of the statewide consent policy version
        constraints: "unique across ConsentPolicy"
      - name: model
        type: enum
        source: input
        description: statewide default consent model
        constraints: "OPT_IN | OPT_OUT"
      - name: sensitive_categories_segmented
        type: array
        source: input
        description: "categories eligible for segmentation; members of {BEHAVIORAL_HEALTH, SUD, HIV, REPRODUCTIVE, GENETIC}"
        default: []
      - name: default_share_for_treatment
        type: boolean
        source: input
        description: whether TREATMENT purpose inherits implied consent under the OPT_OUT model
        default: true
      - name: effective_from
        type: datetime
        source: input
        description: inclusive lower bound of the policy's governing interval
      - name: effective_until
        type: datetime
        source: input
        description: exclusive upper bound of the governing interval; null means open-ended
        default: null
      - name: status
        type: enum
        source: system
        description: policy lifecycle state (see state_machines.ConsentPolicy)
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUPERSEDED"
      - name: activated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the activating PrivacyOfficer (not an FK)"
        default: null
      - name: directive_count
        type: integer
        source: computed
        description: count of ConsentDirective rows whose policy_id is this policy
        default: 0

  - name: MatchThresholdConfig
    parent: null
    common_fields: true
    fields:
      - name: config_label
        type: string
        source: input
        description: operator label for this tuning generation
        constraints: "unique across MatchThresholdConfig"
      - name: auto_link_threshold
        type: number
        source: input
        description: "inclusive lower bound: score >= auto_link_threshold routes a proposal to AUTO_LINKED"
        constraints: "0.0000 < auto_link_threshold <= 1.0000, 4 decimal places"
      - name: review_lower_bound
        type: number
        source: input
        description: "inclusive lower bound: review_lower_bound <= score < auto_link_threshold routes to PENDING_REVIEW"
        constraints: "0.0000 <= review_lower_bound < auto_link_threshold"
      - name: score_variant_mode
        type: enum
        source: input
        description: which match_score variant this generation applies
        constraints: "DETERMINISTIC_FIRST | PROBABILISTIC_ONLY"
      - name: weight_family_name
        type: number
        source: input
        description: probabilistic weight for family_name agreement
      - name: weight_given_name
        type: number
        source: input
        description: probabilistic weight for given_name agreement
      - name: weight_birth_date
        type: number
        source: input
        description: probabilistic weight for birth_date agreement
      - name: weight_ssn_last4
        type: number
        source: input
        description: probabilistic weight for ssn_last4 agreement
      - name: weight_postal_code
        type: number
        source: input
        description: probabilistic weight for postal_code agreement
      - name: weight_phone_digits
        type: number
        source: input
        description: probabilistic weight for phone_digits agreement
      - name: partial_credit_factor
        type: number
        source: input
        description: multiplier applied to a weight when a fuzzy-eligible field shares a 3-character prefix but is not equal
        constraints: "0.0000 <= partial_credit_factor <= 1.0000"
      - name: status
        type: enum
        source: system
        description: tuning generation lifecycle state (see state_machines.MatchThresholdConfig)
        default: DRAFT
        constraints: "DRAFT | ACTIVE | RETIRED"
      - name: tuned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PrivacyOfficer that created this generation (not an FK)"
      - name: activated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PrivacyOfficer that activated this generation; segregation-of-duties anchor for validation priority 18 (not an FK)"
        default: null
      - name: scored_link_count
        type: integer
        source: computed
        description: count of MatchLink rows whose threshold_config_id is this generation
        default: 0

  - name: PatientRecord
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the contributing organization (path-derived)"
      - name: source_mrn
        type: string
        source: input
        description: contributor's local medical record number
        constraints: "unique per participant_id"
      - name: given_name
        type: string
        source: input
        description: patient given name as contributed
      - name: family_name
        type: string
        source: input
        description: patient family name as contributed
      - name: birth_date
        type: string
        source: input
        description: "patient date of birth, ISO 8601 date (YYYY-MM-DD)"
      - name: sex
        type: enum
        source: input
        description: administrative sex as contributed
        constraints: "M | F | O | U"
      - name: ssn_last4
        type: string
        source: input
        description: last four digits of the national identifier
        default: null
        constraints: "exactly 4 digits when present"
      - name: postal_code
        type: string
        source: input
        description: residential postal code as contributed
        default: null
      - name: phone_digits
        type: string
        source: input
        description: digits-only contact phone
        default: null
      - name: sensitive_categories
        type: array
        source: input
        description: "sensitive data categories present in this record; members of {BEHAVIORAL_HEALTH, SUD, HIV, REPRODUCTIVE, GENETIC}"
        default: []
      - name: cluster_id
        type: string
        source: computed
        description: "FK -> IdentityCluster.id; the identity component this record currently belongs to"
        default: null
      - name: prior_cluster_id
        type: string
        source: computed
        description: "FK -> IdentityCluster.id; cluster this record belonged to before the most recent merge re-pointed it; used to restore membership on unlink"
        default: null
      - name: match_state
        type: enum
        source: computed
        description: participation of this record in identity resolution
        default: CLUSTERED
        constraints: "CLUSTERED | QUARANTINED | WITHDRAWN_FROM_INDEX"
      - name: completeness_score
        type: integer
        source: computed
        description: "count of non-null members of {given_name, family_name, birth_date, ssn_last4, postal_code, phone_digits}"

  - name: IdentityCluster
    parent: null
    common_fields: true
    fields:
      - name: primary_record_id
        type: string
        source: computed
        description: "FK -> PatientRecord.id; the member record with the highest completeness_score, tie-break created_at ASC"
      - name: member_record_count
        type: integer
        source: computed
        description: "count of PatientRecord rows with cluster_id == this cluster AND match_state == CLUSTERED"
        default: 1
      - name: participant_count
        type: integer
        source: computed
        description: distinct participant_id count over the same member set as member_record_count
        default: 1
      - name: pending_review_link_count
        type: integer
        source: computed
        description: count of MatchLink rows in status PENDING_REVIEW that touch a member record of this cluster
        default: 0
      - name: status
        type: enum
        source: system
        description: cluster lifecycle state (see state_machines.IdentityCluster)
        default: ACTIVE
        constraints: "ACTIVE | MERGED_AWAY"
      - name: merged_into_cluster_id
        type: string
        source: computed
        description: "FK -> IdentityCluster.id; winner cluster when this cluster was absorbed by a confirmed link (self-referential)"
        default: null
      - name: active_directive_count
        type: integer
        source: computed
        description: count of ConsentDirective rows with cluster_id == this cluster AND status == ACTIVE
        default: 0

  - name: MatchLink
    parent: null
    common_fields: true
    fields:
      - name: left_record_id
        type: string
        source: computed
        description: "FK -> PatientRecord.id; the pre-existing record in the proposal (earlier created_at)"
      - name: right_record_id
        type: string
        source: computed
        description: "FK -> PatientRecord.id; the newly contributed record in the proposal (later created_at)"
      - name: threshold_config_id
        type: string
        source: computed
        description: "FK -> MatchThresholdConfig.id; the generation ACTIVE at proposal time, version-pinned for the life of the link"
      - name: cluster_id
        type: string
        source: computed
        description: "FK -> IdentityCluster.id; winner cluster once the link is AUTO_LINKED or LINKED, else null"
        default: null
      - name: merged_away_cluster_id
        type: string
        source: computed
        description: "FK -> IdentityCluster.id; cluster absorbed by this link's confirmation, restored on unlink"
        default: null
      - name: match_score
        type: number
        source: computed
        description: match_score output under the pinned config's variant, 4 decimal places
      - name: score_variant
        type: enum
        source: computed
        description: which match_score variant produced match_score
        constraints: "DETERMINISTIC | PROBABILISTIC"
      - name: field_agreement_map
        type: object
        source: computed
        description: "per-field agreement value in {0.0, partial_credit_factor, 1.0} keyed by field name"
      - name: status
        type: enum
        source: system
        description: link lifecycle state (see state_machines.MatchLink)
        default: PROPOSED
        constraints: "PROPOSED | AUTO_LINKED | PENDING_REVIEW | LINKED | REJECTED | UNLINKED"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the stewarding HieAdmin (not an FK)"
        default: null
      - name: review_note
        type: string
        source: input
        description: steward's free-text note on a CONFIRM or REJECT decision
        default: null
      - name: unlink_reason
        type: string
        source: input
        description: reason recorded on the compensating unlink action
        default: null

  - name: ConsentDirective
    parent: IdentityCluster
    common_fields: true
    fields:
      - name: cluster_id
        type: string
        source: input
        description: "FK -> IdentityCluster.id; the patient identity this directive governs (path-derived)"
      - name: policy_id
        type: string
        source: computed
        description: "FK -> ConsentPolicy.id; the ACTIVE policy governing the logical clock at recording time"
      - name: directive_type
        type: enum
        source: input
        description: kind of consent expression
        constraints: "OPT_IN | OPT_OUT | SENSITIVE_CATEGORY_RESTRICTION"
      - name: scope
        type: enum
        source: input
        description: breadth of the directive
        constraints: "ALL_PARTICIPANTS | SINGLE_PARTICIPANT"
      - name: scoped_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; required when scope == SINGLE_PARTICIPANT, must be null otherwise"
        default: null
      - name: restricted_categories
        type: array
        source: input
        description: "categories withheld when directive_type == SENSITIVE_CATEGORY_RESTRICTION; members of {BEHAVIORAL_HEALTH, SUD, HIV, REPRODUCTIVE, GENETIC}"
        default: []
      - name: effective_from
        type: datetime
        source: input
        description: instant from which the directive participates in consent evaluation; defaults to the logical clock at recording time
        default: null
      - name: status
        type: enum
        source: system
        description: directive lifecycle state (see state_machines.ConsentDirective)
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED | REVOKED"
      - name: supersedes_directive_id
        type: string
        source: computed
        description: "FK -> ConsentDirective.id; the directive this one displaced (self-referential)"
        default: null
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the recording PrivacyOfficer (not an FK)"
      - name: revocation_reason
        type: string
        source: input
        description: reason recorded on the ACTIVE -> REVOKED transition
        default: null

  - name: RecordLocatorQuery
    parent: null
    common_fields: false
    fields:
      - name: querying_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the organization on whose behalf the query ran"
      - name: clinician_user_id
        type: string
        source: system
        description: "X-User-ID of the querying Clinician or PublicHealthOfficer (not an FK)"
      - name: purpose_of_use
        type: enum
        source: input
        description: asserted purpose driving segmentation and conduit overrides
        constraints: "TREATMENT | PAYMENT | OPERATIONS | PUBLIC_HEALTH | EMERGENCY"
      - name: family_name
        type: string
        source: input
        description: family name submitted for demographic resolution
      - name: given_name
        type: string
        source: input
        description: given name submitted for demographic resolution
      - name: birth_date
        type: string
        source: input
        description: "date of birth submitted for demographic resolution (YYYY-MM-DD)"
      - name: sex
        type: enum
        source: input
        description: administrative sex submitted for demographic resolution
        default: null
        constraints: "M | F | O | U"
      - name: ssn_last4
        type: string
        source: input
        description: last four identifier digits submitted for demographic resolution
        default: null
      - name: postal_code
        type: string
        source: input
        description: postal code submitted for demographic resolution
        default: null
      - name: phone_digits
        type: string
        source: input
        description: digits-only phone submitted for demographic resolution
        default: null
      - name: break_glass_id
        type: string
        source: input
        description: "FK -> BreakGlassAccess.id; emergency session asserted for this query"
        default: null
      - name: cluster_id
        type: string
        source: computed
        description: "FK -> IdentityCluster.id; cluster resolved by consent_disclosure_decision step 1, null when no candidate scored at or above the ACTIVE auto_link_threshold"
        default: null
      - name: top_candidate_score
        type: number
        source: computed
        description: highest match_score achieved by any candidate record against the submitted demographics, 4 decimal places
        default: null
      - name: governing_policy_id
        type: string
        source: computed
        description: "FK -> ConsentPolicy.id; policy whose interval contained the logical clock at query time"
        default: null
      - name: governing_directive_id
        type: string
        source: computed
        description: "FK -> ConsentDirective.id; the OPT_IN/OPT_OUT directive selected by the precedence order, null when the policy default governed"
        default: null
      - name: consent_decision
        type: enum
        source: computed
        description: outcome of consent_disclosure_decision
        constraints: "PERMITTED | PARTIAL_SEGMENTED | DENIED_OPT_OUT | DENIED_SEGMENTED | PERMITTED_EMERGENCY | PERMITTED_PUBLIC_HEALTH | NO_MATCH"
      - name: disclosed_record_count
        type: integer
        source: computed
        description: number of cluster member records released to the caller
        default: 0
      - name: withheld_record_count
        type: integer
        source: computed
        description: number of cluster member records suppressed by consent evaluation
        default: 0
      - name: withheld_categories
        type: array
        source: computed
        description: sorted union of sensitive categories that caused any suppression on this query
        default: []

  - name: AccessAuditEntry
    parent: RecordLocatorQuery
    common_fields: false
    fields:
      - name: query_id
        type: string
        source: computed
        description: "FK -> RecordLocatorQuery.id; the access event that produced this entry"
      - name: record_id
        type: string
        source: computed
        description: "FK -> PatientRecord.id; the record whose disclosure decision this entry records"
      - name: disclosing_participant_id
        type: string
        source: computed
        description: "FK -> Participant.id; the contributor of record_id"
      - name: action
        type: enum
        source: computed
        description: disclosure outcome for this record on this query
        constraints: "DISCLOSED | WITHHELD | BREAK_GLASS_DISCLOSED"
      - name: suppression_reason
        type: enum
        source: computed
        description: why the record was withheld
        default: null
        constraints: "null | OPT_OUT | SENSITIVE_CATEGORY | PURPOSE_RESTRICTED | CONTRIBUTOR_NOT_PARTICIPATING"
      - name: sensitive_category_hit
        type: array
        source: computed
        description: sorted intersection of the record's sensitive_categories with the categories suppressed on this query
        default: []
      - name: reviewed
        type: boolean
        source: computed
        description: true once a break-the-glass post-hoc review decision has covered this entry
        default: false

  - name: BreakGlassAccess
    parent: null
    common_fields: true
    fields:
      - name: cluster_id
        type: string
        source: input
        description: "FK -> IdentityCluster.id; the patient identity the emergency session covers"
      - name: invoking_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the organization the invoking clinician acts for"
      - name: invoking_clinician_user_id
        type: string
        source: system
        description: "X-User-ID of the invoking Clinician; cooldown key component (not an FK)"
      - name: emergency_category
        type: enum
        source: input
        description: asserted emergency justification category
        constraints: "LIFE_THREATENING | UNCONSCIOUS_PATIENT | DISASTER"
      - name: justification_text
        type: string
        source: input
        description: free-text clinical justification retained for post-hoc review
        constraints: ">= 40 characters after trimming"
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant of invocation
      - name: expires_at
        type: datetime
        source: computed
        description: opened_at + BREAK_GLASS_SESSION_MINUTES
      - name: session_status
        type: enum
        source: system
        description: "first independent state axis: whether the session may still authorize disclosure"
        default: OPEN
        constraints: "OPEN | CLOSED | EXPIRED"
      - name: review_status
        type: enum
        source: system
        description: "second independent state axis: post-hoc review progress"
        default: PENDING_REVIEW
        constraints: "PENDING_REVIEW | UNDER_REVIEW | JUSTIFIED | UNJUSTIFIED"
      - name: review_claimed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PrivacyOfficer that claimed the review (not an FK)"
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the PrivacyOfficer that decided the review (not an FK)"
        default: null
      - name: review_note
        type: string
        source: input
        description: reviewer's written rationale for the decision
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the review decision; decay window anchor
        default: null
      - name: disclosed_record_count
        type: integer
        source: computed
        description: sum of RecordLocatorQuery.disclosed_record_count over queries citing this session
        default: 0
      - name: disclosed_sensitive_count
        type: integer
        source: computed
        description: count of AccessAuditEntry rows with action BREAK_GLASS_DISCLOSED and non-empty sensitive_category_hit under this session
        default: 0
      - name: sanction_points_awarded
        type: integer
        source: computed
        description: points contributed to the invoking participant when review_status becomes UNJUSTIFIED, else 0
        default: 0

  - name: NotificationSubscription
    parent: Participant
    common_fields: true
    fields:
      - name: subscriber_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the organization receiving ADT alerts (path-derived)"
      - name: subscription_scope
        type: enum
        source: input
        description: breadth of the alert feed
        constraints: "PATIENT_PANEL | CLUSTER | PUBLIC_HEALTH_CONDUIT"
      - name: cluster_id
        type: string
        source: input
        description: "FK -> IdentityCluster.id; required when subscription_scope == CLUSTER, must be null otherwise"
        default: null
      - name: event_types
        type: array
        source: input
        description: "subscribed ADT event types; non-empty subset of {ADMISSION, DISCHARGE, TRANSFER}"
      - name: delivery_endpoint_url
        type: string
        source: input
        description: subscriber's notification receiver URL
        constraints: "must start with https://"
      - name: activating_conformance_test_id
        type: string
        source: computed
        description: "FK -> ConformanceTest.id; the strictly PASSED ADT_PUBLISHER run that satisfied the activation gate"
        default: null
      - name: status
        type: enum
        source: system
        description: subscription lifecycle state (see state_machines.NotificationSubscription)
        default: PENDING_ACTIVATION
        constraints: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | TERMINATED"
      - name: termination_reason
        type: string
        source: system
        description: "reason recorded on TERMINATED; literal DUPLICATE_AFTER_CLUSTER_MERGE when the merge cascade terminated it"
        default: null

  - name: DataFeed
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the contributing organization (path-derived)"
      - name: feed_type
        type: enum
        source: input
        description: content family carried by this feed
        constraints: "ADT | CCDA | LAB_RESULT"
      - name: generation
        type: integer
        source: computed
        description: 1-based ordinal among the participant's feeds of the same feed_type, ordered by created_at ASC
      - name: status
        type: enum
        source: system
        description: feed monitoring state (see state_machines.DataFeed)
        default: PROVISIONING
        constraints: "PROVISIONING | MONITORED | DEGRADED | SUSPENDED | RETIRED"
      - name: latest_reject_rate
        type: number
        source: computed
        description: "messages_rejected / messages_received of the most recent accepted sample by period_end DESC, tie-break created_at ASC; 4 decimal places"
        default: null
      - name: sample_count
        type: integer
        source: computed
        description: count of FeedQualitySample rows accepted on this feed
        default: 0
      - name: status_reason
        type: string
        source: system
        description: "reason recorded on the most recent status transition; literal PARTICIPANT_SUSPENSION_CASCADE when the sanction cascade suspended it"
        default: null

  - name: FeedQualitySample
    parent: DataFeed
    common_fields: false
    fields:
      - name: data_feed_id
        type: string
        source: input
        description: "FK -> DataFeed.id; the monitored feed this measurement window belongs to (path-derived)"
      - name: period_start
        type: datetime
        source: input
        description: inclusive lower bound of the measurement window
      - name: period_end
        type: datetime
        source: input
        description: exclusive upper bound of the measurement window
        constraints: "must be strictly after period_start"
      - name: messages_received
        type: integer
        source: input
        description: messages accepted at the interface engine during the window
        constraints: ">= 0"
      - name: messages_rejected
        type: integer
        source: input
        description: messages rejected for structural or vocabulary faults
        constraints: "0 <= messages_rejected <= messages_received"
      - name: required_fields_missing_count
        type: integer
        source: input
        description: count of required demographic fields absent across accepted messages
        constraints: ">= 0"
      - name: duplicate_count
        type: integer
        source: input
        description: count of messages detected as duplicates
        constraints: ">= 0"
      - name: timeliness_p95_seconds
        type: integer
        source: input
        description: 95th percentile lag between clinical event and message receipt
        constraints: ">= 0"
      - name: reject_rate
        type: number
        source: computed
        description: "messages_rejected / max(1, messages_received), 4 decimal places"

  - name: ParticipationInvoice
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the billed organization (path-derived)"
      - name: billing_period_start
        type: datetime
        source: input
        description: inclusive lower bound of the billed period
      - name: billing_period_end
        type: datetime
        source: input
        description: exclusive upper bound of the billed period
        constraints: "must be strictly after billing_period_start and at or before the logical clock"
      - name: basis_variant
        type: enum
        source: input
        description: which participation_fee variant computed this invoice
        constraints: "PROVISIONAL | RECONCILED"
      - name: due_date
        type: datetime
        source: input
        description: instant after which the invoice may be declared DELINQUENT
      - name: billable_volume_units
        type: integer
        source: computed
        description: units fed into the tier ladder under the selected basis_variant
      - name: tier_charge_breakdown
        type: object
        source: computed
        description: "per-tier rounded charge in cents keyed TIER_1/TIER_2/TIER_3"
      - name: volume_fee_cents
        type: integer
        source: computed
        description: sum of the per-tier rounded charges
      - name: base_platform_fee_cents
        type: integer
        source: computed
        description: flat monthly platform component taken from BASE_PLATFORM_FEE_CENTS
      - name: quality_grade_snapshot
        type: enum
        source: computed
        description: Participant.quality_grade captured at issuance
        constraints: "A | B | C | D | UNGRADED"
      - name: quality_multiplier
        type: number
        source: computed
        description: multiplier selected from QUALITY_MULTIPLIER by quality_grade_snapshot
      - name: total_cents
        type: integer
        source: computed
        description: participation_fee output, whole cents
      - name: amount_paid_cents
        type: integer
        source: input
        description: cents tendered by the participant
        default: 0
      - name: status
        type: enum
        source: system
        description: invoice lifecycle state (see state_machines.ParticipationInvoice)
        default: ISSUED
        constraints: "ISSUED | PAID | DELINQUENT | WRITTEN_OFF | VOID"
      - name: status_reason
        type: string
        source: system
        description: reason recorded on VOID, DELINQUENT or WRITTEN_OFF transitions
        default: null

state_machines:
  - entity: Participant
    initial_state: APPLIED
    terminal_states: [WITHDRAWN, TERMINATED]
    shape: cyclic
    transitions:
      - from: APPLIED
        to: LEGAL_REVIEW
        trigger: "POST /hie/participants/{id}/onboarding-transitions action=SUBMIT_FOR_LEGAL_REVIEW"
        actor: ParticipantAdmin
        preconditions:
          - "onboarding_status == APPLIED"
          - "X-User-ID == participant.id"
        side_effects:
          - "increments Participant.version by 1"
      - from: LEGAL_REVIEW
        to: AGREEMENT_EXECUTED
        trigger: "POST /hie/participants/{id}/onboarding-transitions action=EXECUTE_AGREEMENT"
        actor: HieAdmin
        preconditions:
          - "onboarding_status == LEGAL_REVIEW"
          - "agreement_version and signed_at both present in the request body"
        side_effects:
          - "sets Participant.agreement_version, Participant.agreement_signed_at"
          - "sets Participant.agreement_executed_by_user_id = X-User-ID (segregation-of-duties anchor consumed by the CERTIFY precondition)"
          - "immediately performs the system transition AGREEMENT_EXECUTED -> CONFORMANCE_TESTING in the same request"
          - "increments Participant.version by 1"
        note: "the response body already reports onboarding_status == CONFORMANCE_TESTING"
      - from: AGREEMENT_EXECUTED
        to: CONFORMANCE_TESTING
        trigger: "system event: completion of the EXECUTE_AGREEMENT transition"
        actor: system
        preconditions:
          - "onboarding_status == AGREEMENT_EXECUTED"
        side_effects:
          - "resets Participant.consecutive_failed_attempts to 0"
      - from: CONFORMANCE_TESTING
        to: CERTIFIED
        trigger: "POST /hie/participants/{id}/onboarding-transitions action=CERTIFY"
        actor: HieAdmin
        preconditions:
          - "onboarding_status == CONFORMANCE_TESTING"
          - "Participant.passed_profiles is a superset of REQUIRED_CERTIFICATION_PROFILES, else ERR_CERTIFICATION_PROFILES_INCOMPLETE"
          - "X-User-ID != Participant.agreement_executed_by_user_id, else ERR_SOD_CERTIFIER_IS_SIGNATORY"
          - "Participant has no ParticipationInvoice in status DELINQUENT, else ERR_PARTICIPATION_FEE_DELINQUENT"
        side_effects:
          - "sets Participant.certified_by_user_id = X-User-ID and Participant.certified_at = logical clock"
          - "increments Participant.version by 1"
      - from: CONFORMANCE_TESTING
        to: REMEDIATION
        trigger: "POST /hie/participants/{id}/onboarding-transitions action=REMEDIATE"
        actor: HieAdmin
        preconditions:
          - "onboarding_status == CONFORMANCE_TESTING"
          - "reason present in the request body"
        side_effects:
          - "increments Participant.remediation_count by 1"
          - "increments Participant.version by 1"
      - from: CONFORMANCE_TESTING
        to: REMEDIATION
        trigger: "system event: conformance_pass_rate sets a third consecutive FAILED result (Participant.consecutive_failed_attempts reaches CONSECUTIVE_FAILURE_LIMIT)"
        actor: system
        preconditions:
          - "onboarding_status == CONFORMANCE_TESTING"
          - "Participant.consecutive_failed_attempts == CONSECUTIVE_FAILURE_LIMIT after the current result is recorded"
        side_effects:
          - "increments Participant.remediation_count by 1"
          - "sets Participant.suspension_reason = null (unchanged) and leaves Participant.passed_profiles intact"
          - "increments Participant.version by 1"
      - from: REMEDIATION
        to: CONFORMANCE_TESTING
        trigger: "POST /hie/participants/{id}/onboarding-transitions action=RESUME_CONFORMANCE"
        actor: ParticipantAdmin
        preconditions:
          - "onboarding_status == REMEDIATION"
          - "X-User-ID == participant.id"
        side_effects:
          - "resets Participant.consecutive_failed_attempts to 0 while preserving Participant.passed_profiles and Participant.conformance_attempt_count"
          - "increments Participant.version by 1"
        note: "closes the onboarding cycle; the participant may re-enter REMEDIATION any number of times"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /hie/participants/{id}/onboarding-transitions action=SUSPEND"
        actor: HieAdmin
        preconditions:
          - "onboarding_status == CERTIFIED"
          - "reason present in the request body"
        side_effects:
          - "sets Participant.suspension_reason = reason"
          - "cascade link 1: every DataFeed of this participant with status IN {PROVISIONING, MONITORED, DEGRADED} -> SUSPENDED with status_reason = PARTICIPANT_SUSPENSION_CASCADE, processed created_at ASC"
          - "cascade link 2: because those feeds left {MONITORED, DEGRADED}, participant_quality_score is re-run over the shrunken qualifying sample set and Participant.quality_score / Participant.quality_grade are rewritten"
          - "fan-out sibling (not part of the depth chain): every NotificationSubscription of this participant with status IN {PENDING_ACTIVATION, ACTIVE} -> SUSPENDED, processed created_at ASC, and Participant.active_subscription_count recomputed"
          - "increments Participant.version by 1"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system event: break_glass_sanction_points raises Participant.sanction_points_active to SANCTION_SUSPENSION_THRESHOLD or above"
        actor: system
        preconditions:
          - "onboarding_status == CERTIFIED"
          - "Participant.sanction_points_active >= SANCTION_SUSPENSION_THRESHOLD"
        side_effects:
          - "sets Participant.suspension_reason = AUTOMATIC_SANCTION_THRESHOLD"
          - "runs the identical DataFeed -> quality-score cascade and NotificationSubscription fan-out declared on the operator-driven SUSPEND transition"
          - "increments Participant.version by 1"
        note: "third and fourth links of the break-the-glass sanction cascade (see calculations.break_glass_sanction_points)"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /hie/participants/{id}/onboarding-transitions action=REINSTATE"
        actor: HieAdmin
        preconditions:
          - "onboarding_status == SUSPENDED"
          - "Participant.sanction_points_active < SANCTION_SUSPENSION_THRESHOLD"
          - "Participant has no ParticipationInvoice in status DELINQUENT, else ERR_PARTICIPATION_FEE_DELINQUENT"
        side_effects:
          - "clears Participant.suspension_reason"
          - "every DataFeed of this participant with status == SUSPENDED and status_reason == PARTICIPANT_SUSPENSION_CASCADE -> MONITORED, processed created_at ASC"
          - "re-runs participant_quality_score; every NotificationSubscription with status == SUSPENDED -> ACTIVE, processed created_at ASC"
          - "increments Participant.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /hie/participants/{id}/onboarding-transitions action=TERMINATE"
        actor: HieAdmin
        preconditions:
          - "onboarding_status == SUSPENDED"
          - "reason present in the request body"
        side_effects:
          - "every PatientRecord of this participant -> match_state WITHDRAWN_FROM_INDEX and cluster_id preserved for audit"
          - "each affected cluster's member_record_count and participant_count are recomputed by cluster_membership_recount"
          - "every NotificationSubscription of this participant -> TERMINATED with termination_reason = PARTICIPANT_TERMINATED"
          - "increments Participant.version by 1"
      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /hie/participants/{id}/onboarding-transitions action=WITHDRAW"
        actor: ParticipantAdmin
        preconditions:
          - "onboarding_status IN {APPLIED, LEGAL_REVIEW, AGREEMENT_EXECUTED, CONFORMANCE_TESTING, REMEDIATION}"
          - "X-User-ID == participant.id"
        side_effects:
          - "every ConformanceTest of this participant in status RUNNING -> FAILED with failure_categories = [TRANSPORT]"
          - "increments Participant.version by 1"
        note: "the same WITHDRAW action is accepted from LEGAL_REVIEW, AGREEMENT_EXECUTED, CONFORMANCE_TESTING and REMEDIATION with identical side effects"

  - entity: ConformanceTest
    initial_state: RUNNING
    terminal_states: [PASSED, WAIVED]
    shape: branching
    transitions:
      - from: RUNNING
        to: PASSED
        trigger: "POST /hie/conformance-tests/{id}/results"
        actor: ParticipantAdmin
        preconditions:
          - "status == RUNNING"
          - "owning Participant.onboarding_status == CONFORMANCE_TESTING"
          - "conformance_pass_rate yields pass_rate >= CONFORMANCE_PASS_RATE_FLOOR AND critical_failure == false"
        side_effects:
          - "sets ConformanceTest.pass_rate, ConformanceTest.critical_failure, ConformanceTest.executed_by_user_id"
          - "appends profile to Participant.passed_profiles (deduplicated, sorted ascending)"
          - "resets Participant.consecutive_failed_attempts to 0"
          - "increments Participant.version by 1"
      - from: RUNNING
        to: FAILED
        trigger: "POST /hie/conformance-tests/{id}/results"
        actor: ParticipantAdmin
        preconditions:
          - "status == RUNNING"
          - "owning Participant.onboarding_status == CONFORMANCE_TESTING"
          - "conformance_pass_rate yields pass_rate < CONFORMANCE_PASS_RATE_FLOOR OR critical_failure == true"
        side_effects:
          - "sets ConformanceTest.pass_rate, ConformanceTest.critical_failure, ConformanceTest.executed_by_user_id"
          - "increments Participant.consecutive_failed_attempts by 1"
          - "when Participant.consecutive_failed_attempts reaches CONSECUTIVE_FAILURE_LIMIT, fires the system transition Participant CONFORMANCE_TESTING -> REMEDIATION"
          - "increments Participant.version by 1"
      - from: FAILED
        to: WAIVED
        trigger: "POST /hie/conformance-tests/{id}/waiver"
        actor: HieAdmin
        preconditions:
          - "status == FAILED"
          - "ConformanceTest.critical_failure == false (critical failures are not waivable)"
        side_effects:
          - "sets ConformanceTest.waiver_reason"
          - "appends profile to Participant.passed_profiles (deduplicated, sorted ascending)"
          - "resets Participant.consecutive_failed_attempts to 0"
          - "increments Participant.version by 1"

  - entity: ConsentPolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /hie/consent-policies/{id}/activation"
        actor: HieAdmin
        preconditions:
          - "status == DRAFT"
          - "the half-open interval [effective_from, effective_until) does not overlap the interval of any ConsentPolicy with status == ACTIVE, else ERR_CONSENT_POLICY_INTERVAL_OVERLAP"
        side_effects:
          - "sets ConsentPolicy.activated_by_user_id = X-User-ID"
          - "every ConsentPolicy with status == ACTIVE whose effective_until is non-null and <= this policy's effective_from -> SUPERSEDED"
          - "increments ConsentPolicy.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: activation of a policy whose effective_from is at or after this policy's non-null effective_until"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "effective_until is not null"
        side_effects:
          - "increments ConsentPolicy.version by 1"

  - entity: MatchThresholdConfig
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: linear
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /hie/match-threshold-configs/{id}/activation"
        actor: HieAdmin
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "sets MatchThresholdConfig.activated_by_user_id = X-User-ID"
          - "the previously ACTIVE generation, if any, -> RETIRED"
          - "already-created MatchLink rows keep their pinned threshold_config_id and are NOT re-scored"
          - "increments MatchThresholdConfig.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "system event: activation of a newer generation"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "increments MatchThresholdConfig.version by 1"

  - entity: MatchLink
    initial_state: PROPOSED
    terminal_states: [REJECTED]
    shape: branching_with_cycle
    transitions:
      - from: PROPOSED
        to: AUTO_LINKED
        trigger: "system event: POST /hie/participants/{id}/patient-records proposes a pair and match_score >= threshold_config.auto_link_threshold"
        actor: system
        preconditions:
          - "match_score >= threshold_config.auto_link_threshold"
          - "both records have match_state == CLUSTERED"
          - "both records' clusters have status == ACTIVE"
        side_effects:
          - "branch-specific: performs the cluster merge immediately - the cluster with the earlier created_at wins (tie-break created_at ASC over IdentityCluster), the loser -> MERGED_AWAY with merged_into_cluster_id = winner"
          - "every PatientRecord whose cluster_id == loser gets prior_cluster_id = loser and cluster_id = winner"
          - "sets MatchLink.cluster_id = winner and MatchLink.merged_away_cluster_id = loser (null when the incoming record had no cluster of its own)"
          - "cluster_membership_recount re-runs on winner and loser"
          - "increments IdentityCluster.version by 1 on both clusters"
      - from: PROPOSED
        to: PENDING_REVIEW
        trigger: "system event: POST /hie/participants/{id}/patient-records proposes a pair and threshold_config.review_lower_bound <= match_score < threshold_config.auto_link_threshold"
        actor: system
        preconditions:
          - "threshold_config.review_lower_bound <= match_score < threshold_config.auto_link_threshold"
        side_effects:
          - "branch-specific: NO cluster mutation occurs; both records keep their existing cluster_id"
          - "increments pending_review_link_count on both touched clusters"
          - "increments IdentityCluster.version by 1 on both clusters"
      - from: PROPOSED
        to: REJECTED
        trigger: "system event: POST /hie/participants/{id}/patient-records proposes a pair and match_score < threshold_config.review_lower_bound"
        actor: system
        preconditions:
          - "match_score < threshold_config.review_lower_bound"
        side_effects:
          - "branch-specific: no cluster mutation and no pending_review_link_count change; the link is retained only as negative-agreement evidence"
      - from: PENDING_REVIEW
        to: LINKED
        trigger: "POST /hie/match-links/{id}/steward-decision decision=CONFIRM"
        actor: HieAdmin
        preconditions:
          - "status == PENDING_REVIEW"
          - "expected_cluster_version == cluster_of(left_record).version (OCC, see concurrency_rules.match-link-confirm-stale-cluster)"
          - "both records' clusters have status == ACTIVE, else ERR_CLUSTER_MERGED_AWAY"
          - "X-User-ID != threshold_config_of(this link).activated_by_user_id, else ERR_SOD_STEWARD_IS_TUNER"
        side_effects:
          - "cascade link 1: MatchLink.status -> LINKED, reviewed_by_user_id = X-User-ID, review_note stored"
          - "cascade link 2: caused by link 1, the two clusters merge - the cluster with the earlier created_at wins, the loser -> MERGED_AWAY with merged_into_cluster_id = winner; every PatientRecord of the loser gets prior_cluster_id = loser and cluster_id = winner; cluster_membership_recount re-runs on both; MatchLink.cluster_id = winner and MatchLink.merged_away_cluster_id = loser"
          - "cascade link 3: caused by link 2, every ConsentDirective with cluster_id == loser is re-pointed to the winner; where the winner already holds an ACTIVE directive with the same (directive_type, scope, scoped_participant_id) triple, the one with the earlier effective_from -> SUPERSEDED (tie-break created_at ASC) and the survivor's supersedes_directive_id is set to the superseded row's id"
          - "cascade link 4: caused by link 3, every NotificationSubscription with subscription_scope == CLUSTER and cluster_id == loser is re-pointed to the winner; where the same subscriber_participant_id already holds a subscription in status IN {PENDING_ACTIVATION, ACTIVE} on the winner whose event_types intersect, the row with the later created_at -> TERMINATED with termination_reason = DUPLICATE_AFTER_CLUSTER_MERGE and Participant.active_subscription_count is recomputed"
          - "increments IdentityCluster.version by 1 on both clusters and MatchLink.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /hie/match-links/{id}/steward-decision decision=REJECT"
        actor: HieAdmin
        preconditions:
          - "status == PENDING_REVIEW"
          - "expected_cluster_version == cluster_of(left_record).version"
          - "X-User-ID != threshold_config_of(this link).activated_by_user_id, else ERR_SOD_STEWARD_IS_TUNER"
        side_effects:
          - "branch-specific: no merge; decrements pending_review_link_count on both clusters"
          - "sets reviewed_by_user_id = X-User-ID and review_note"
          - "increments IdentityCluster.version by 1 on both clusters and MatchLink.version by 1"
      - from: AUTO_LINKED
        to: UNLINKED
        trigger: "POST /hie/match-links/{id}/unlink"
        actor: PrivacyOfficer
        preconditions:
          - "status IN {AUTO_LINKED, LINKED}"
          - "expected_cluster_version == MatchLink.cluster_id -> IdentityCluster.version"
          - "unlink_reason present in the request body"
        side_effects:
          - "compensation: MatchLink.merged_away_cluster_id, when non-null, -> status ACTIVE with merged_into_cluster_id cleared"
          - "every PatientRecord whose prior_cluster_id == MatchLink.merged_away_cluster_id gets cluster_id = prior_cluster_id and prior_cluster_id = null"
          - "cluster_membership_recount re-runs on both clusters, restoring the conserved membership total (see calculations.cluster_membership_recount)"
          - "sets MatchLink.cluster_id = null, MatchLink.merged_away_cluster_id = null, MatchLink.unlink_reason"
          - "increments IdentityCluster.version by 1 on both clusters and MatchLink.version by 1"
      - from: LINKED
        to: UNLINKED
        trigger: "POST /hie/match-links/{id}/unlink"
        actor: PrivacyOfficer
        preconditions:
          - "status IN {AUTO_LINKED, LINKED}"
          - "expected_cluster_version == MatchLink.cluster_id -> IdentityCluster.version"
          - "unlink_reason present in the request body"
        side_effects:
          - "identical compensation set as the AUTO_LINKED -> UNLINKED transition"
      - from: UNLINKED
        to: PENDING_REVIEW
        trigger: "POST /hie/match-links/{id}/steward-decision decision=REOPEN"
        actor: PrivacyOfficer
        preconditions:
          - "status == UNLINKED"
          - "expected_cluster_version == cluster_of(left_record).version"
          - "both records' clusters have status == ACTIVE"
        side_effects:
          - "increments pending_review_link_count on both clusters"
          - "increments IdentityCluster.version by 1 on both clusters and MatchLink.version by 1"
        note: "closes the link cycle LINKED -> UNLINKED -> PENDING_REVIEW -> LINKED"

  - entity: IdentityCluster
    initial_state: ACTIVE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: MERGED_AWAY
        trigger: "system event: a MatchLink reaches AUTO_LINKED or LINKED and this cluster loses the created_at ASC merge contest"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "this cluster's created_at is strictly later than the winner's created_at"
        side_effects:
          - "sets merged_into_cluster_id = winner cluster id"
          - "member_record_count -> 0 and participant_count -> 0 by cluster_membership_recount"
          - "increments IdentityCluster.version by 1"
      - from: MERGED_AWAY
        to: ACTIVE
        trigger: "POST /hie/match-links/{id}/unlink on the link that absorbed this cluster"
        actor: PrivacyOfficer
        preconditions:
          - "status == MERGED_AWAY"
          - "MatchLink.merged_away_cluster_id == this cluster id"
        side_effects:
          - "clears merged_into_cluster_id"
          - "member_record_count and participant_count restored by cluster_membership_recount"
          - "increments IdentityCluster.version by 1"

  - entity: ConsentDirective
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    shape: branching
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: POST /hie/identity-clusters/{id}/consent-directives records a newer directive with the same (directive_type, scope, scoped_participant_id) triple on the same cluster"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the incoming directive's effective_from is at or after this directive's effective_from"
        side_effects:
          - "sets the incoming directive's supersedes_directive_id to this directive's id"
          - "recomputes IdentityCluster.active_directive_count"
          - "increments ConsentDirective.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: cascade link 3 of the MatchLink PENDING_REVIEW -> LINKED merge re-points a duplicate directive onto the winner cluster"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "a competing ACTIVE directive with the same triple exists on the winner cluster and has a later effective_from (tie-break created_at ASC)"
        side_effects:
          - "recomputes IdentityCluster.active_directive_count on the winner cluster"
          - "increments ConsentDirective.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /hie/consent-directives/{id}/revocation"
        actor: PrivacyOfficer
        preconditions:
          - "status == ACTIVE"
          - "revocation_reason present in the request body"
        side_effects:
          - "sets revocation_reason; the directive stops participating in consent_disclosure_decision from this instant"
          - "recomputes IdentityCluster.active_directive_count and increments IdentityCluster.version by 1"
          - "increments ConsentDirective.version by 1"

  - entity: BreakGlassAccess
    initial_state: "session_status=OPEN x review_status=PENDING_REVIEW"
    terminal_states: ["session_status IN {CLOSED, EXPIRED}", "review_status IN {JUSTIFIED, UNJUSTIFIED}"]
    shape: parallel
    parallel_dimensions:
      - axis: session_status
        states: [OPEN, CLOSED, EXPIRED]
      - axis: review_status
        states: [PENDING_REVIEW, UNDER_REVIEW, JUSTIFIED, UNJUSTIFIED]
    parallel_note: |
      The two axes advance independently on the same row: a review may be claimed and decided while the
      session is still OPEN, and the session may EXPIRE while review_status is UNDER_REVIEW. No transition
      on one axis is a precondition of any transition on the other.
    transitions:
      - from: "session_status=OPEN"
        to: "session_status=CLOSED"
        trigger: "POST /hie/break-glass-accesses/{id}/closure"
        actor: Clinician
        preconditions:
          - "session_status == OPEN"
          - "X-User-ID == invoking_clinician_user_id"
        side_effects:
          - "recomputes disclosed_record_count and disclosed_sensitive_count"
          - "leaves review_status untouched"
          - "increments BreakGlassAccess.version by 1"
      - from: "session_status=OPEN"
        to: "session_status=EXPIRED"
        trigger: "system event: the logical clock advances strictly past expires_at (evaluated lazily on any read or write touching this row)"
        actor: system
        preconditions:
          - "session_status == OPEN"
          - "logical clock > expires_at"
        side_effects:
          - "leaves review_status untouched"
          - "the (cluster_id, invoking_clinician_user_id) occupation interval remains [opened_at, expires_at + BREAK_GLASS_COOLDOWN_MINUTES] for overlap purposes"
          - "increments BreakGlassAccess.version by 1"
      - from: "review_status=PENDING_REVIEW"
        to: "review_status=UNDER_REVIEW"
        trigger: "POST /hie/break-glass-accesses/{id}/review-claim"
        actor: PrivacyOfficer
        preconditions:
          - "review_status == PENDING_REVIEW"
          - "X-User-ID != invoking_clinician_user_id"
        side_effects:
          - "sets review_claimed_by_user_id = X-User-ID"
          - "leaves session_status untouched (may still be OPEN)"
          - "increments BreakGlassAccess.version by 1"
      - from: "review_status=UNDER_REVIEW"
        to: "review_status=JUSTIFIED"
        trigger: "POST /hie/break-glass-accesses/{id}/review-decision outcome=JUSTIFIED"
        actor: PrivacyOfficer
        preconditions:
          - "review_status == UNDER_REVIEW"
          - "X-User-ID == review_claimed_by_user_id, else ERR_REVIEW_NOT_CLAIMED_BY_ACTOR"
        side_effects:
          - "sets reviewer_user_id = X-User-ID, decided_at = logical clock, sanction_points_awarded = 0"
          - "every AccessAuditEntry of every query citing this session -> reviewed = true"
          - "Participant.sanction_points_active is recomputed and does not change"
          - "increments BreakGlassAccess.version by 1"
      - from: "review_status=UNDER_REVIEW"
        to: "review_status=UNJUSTIFIED"
        trigger: "POST /hie/break-glass-accesses/{id}/review-decision outcome=UNJUSTIFIED"
        actor: PrivacyOfficer
        preconditions:
          - "review_status == UNDER_REVIEW"
          - "X-User-ID == review_claimed_by_user_id, else ERR_REVIEW_NOT_CLAIMED_BY_ACTOR"
        side_effects:
          - "sets reviewer_user_id = X-User-ID, decided_at = logical clock"
          - "cascade link 1: sanction_points_awarded is computed by break_glass_sanction_points and Participant.sanction_points_active on invoking_participant_id is recomputed"
          - "cascade link 2: caused by link 1, when sanction_points_active >= SANCTION_SUSPENSION_THRESHOLD the invoking Participant fires CERTIFIED -> SUSPENDED with suspension_reason = AUTOMATIC_SANCTION_THRESHOLD"
          - "cascade link 3: caused by link 2, every DataFeed of that participant in status IN {PROVISIONING, MONITORED, DEGRADED} -> SUSPENDED with status_reason = PARTICIPANT_SUSPENSION_CASCADE"
          - "cascade link 4: caused by link 3, participant_quality_score re-runs over the now-shrunken qualifying sample set and rewrites Participant.quality_score / Participant.quality_grade"
          - "every AccessAuditEntry of every query citing this session -> reviewed = true"
          - "increments BreakGlassAccess.version by 1"

  - entity: DataFeed
    initial_state: PROVISIONING
    terminal_states: [RETIRED]
    shape: cyclic
    transitions:
      - from: PROVISIONING
        to: MONITORED
        trigger: "system event: the first FeedQualitySample is accepted on this feed"
        actor: system
        preconditions:
          - "status == PROVISIONING"
          - "sample_count becomes 1"
        side_effects:
          - "sets latest_reject_rate from the accepted sample"
          - "re-runs participant_quality_score because the feed entered the qualifying status set {MONITORED, DEGRADED}"
          - "increments DataFeed.version by 1"
        note: "when that first sample's reject_rate already exceeds FEED_DEGRADED_REJECT_RATE the feed continues along MONITORED -> DEGRADED inside the same request, so the observable end state is DEGRADED with status_reason REJECT_RATE_BREACH"
      - from: MONITORED
        to: DEGRADED
        trigger: "system event: an accepted FeedQualitySample yields reject_rate > FEED_DEGRADED_REJECT_RATE"
        actor: system
        preconditions:
          - "status == MONITORED"
          - "the newly accepted sample's reject_rate > FEED_DEGRADED_REJECT_RATE"
        side_effects:
          - "sets status_reason = REJECT_RATE_BREACH and latest_reject_rate"
          - "re-runs participant_quality_score (DEGRADED remains a qualifying status, so the sample set is unchanged)"
          - "increments DataFeed.version by 1"
      - from: DEGRADED
        to: MONITORED
        trigger: "system event: an accepted FeedQualitySample yields reject_rate <= FEED_DEGRADED_REJECT_RATE"
        actor: system
        preconditions:
          - "status == DEGRADED"
          - "the newly accepted sample's reject_rate <= FEED_DEGRADED_REJECT_RATE"
        side_effects:
          - "clears status_reason and sets latest_reject_rate"
          - "re-runs participant_quality_score"
          - "increments DataFeed.version by 1"
        note: "closes the feed monitoring cycle MONITORED -> DEGRADED -> MONITORED"
      - from: DEGRADED
        to: SUSPENDED
        trigger: "POST /hie/data-feeds/{id}/status-transitions action=SUSPEND"
        actor: HieAdmin
        preconditions:
          - "status IN {PROVISIONING, MONITORED, DEGRADED}"
          - "reason present in the request body"
        side_effects:
          - "sets status_reason = reason"
          - "re-runs participant_quality_score with this feed's samples now excluded from the input set"
          - "increments DataFeed.version by 1"
      - from: MONITORED
        to: SUSPENDED
        trigger: "system event: the owning Participant enters SUSPENDED (operator SUSPEND or the sanction cascade)"
        actor: system
        preconditions:
          - "status IN {PROVISIONING, MONITORED, DEGRADED}"
          - "owning Participant.onboarding_status == SUSPENDED"
        side_effects:
          - "sets status_reason = PARTICIPANT_SUSPENSION_CASCADE"
          - "re-runs participant_quality_score with this feed's samples excluded (cascade link 4 of the sanction chain)"
          - "increments DataFeed.version by 1"
      - from: SUSPENDED
        to: MONITORED
        trigger: "POST /hie/data-feeds/{id}/status-transitions action=RESTORE"
        actor: HieAdmin
        preconditions:
          - "status == SUSPENDED"
          - "owning Participant.onboarding_status != SUSPENDED"
        side_effects:
          - "clears status_reason"
          - "re-runs participant_quality_score with this feed's samples back in the input set"
          - "increments DataFeed.version by 1"
      - from: MONITORED
        to: RETIRED
        trigger: "system event: POST /hie/participants/{id}/data-feeds provisions a newer generation of the same feed_type"
        actor: system
        preconditions:
          - "status IN {PROVISIONING, MONITORED, DEGRADED, SUSPENDED}"
          - "a newer DataFeed with the same participant_id and feed_type was just created"
        side_effects:
          - "sets status_reason = SUPERSEDED_BY_GENERATION"
          - "re-runs participant_quality_score with this feed's samples excluded"
          - "increments DataFeed.version by 1"

  - entity: NotificationSubscription
    initial_state: PENDING_ACTIVATION
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /hie/notification-subscriptions/{id}/lifecycle-transitions action=ACTIVATE"
        actor: ParticipantAdmin
        preconditions:
          - "status == PENDING_ACTIVATION"
          - "the subscriber Participant holds a ConformanceTest with profile == ADT_PUBLISHER and status == PASSED (strictly PASSED: a WAIVED run satisfies certification but NOT this gate), otherwise ERR_SUBSCRIPTION_CONFORMANCE_MISSING"
          - "the subscriber Participant has no ParticipationInvoice in status DELINQUENT, else ERR_PARTICIPATION_FEE_DELINQUENT"
        side_effects:
          - "sets activating_conformance_test_id to that run's id (earliest created_at among qualifying runs)"
          - "increments Participant.active_subscription_count by 1"
          - "increments NotificationSubscription.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /hie/notification-subscriptions/{id}/lifecycle-transitions action=SUSPEND, or the Participant SUSPENDED fan-out"
        actor: HieAdmin
        preconditions:
          - "status IN {PENDING_ACTIVATION, ACTIVE}"
        side_effects:
          - "recomputes Participant.active_subscription_count"
          - "increments NotificationSubscription.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /hie/notification-subscriptions/{id}/lifecycle-transitions action=REACTIVATE, or the Participant REINSTATE cascade"
        actor: ParticipantAdmin
        preconditions:
          - "status == SUSPENDED"
          - "the subscriber Participant.onboarding_status == CERTIFIED"
        side_effects:
          - "recomputes Participant.active_subscription_count"
          - "increments NotificationSubscription.version by 1"
        note: "closes the subscription cycle ACTIVE -> SUSPENDED -> ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /hie/notification-subscriptions/{id}/lifecycle-transitions action=TERMINATE, the cluster-merge duplicate cascade, or the Participant TERMINATED cascade"
        actor: ParticipantAdmin
        preconditions:
          - "status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "sets termination_reason (operator reason, DUPLICATE_AFTER_CLUSTER_MERGE, or PARTICIPANT_TERMINATED)"
          - "recomputes Participant.active_subscription_count"
          - "increments NotificationSubscription.version by 1"

  - entity: ParticipationInvoice
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF, VOID]
    shape: branching
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /hie/participation-invoices/{id}/payment"
        actor: ParticipantAdmin
        preconditions:
          - "status IN {ISSUED, DELINQUENT}"
          - "amount_paid_cents == total_cents, else ERR_PAYMENT_AMOUNT_MISMATCH"
        side_effects:
          - "sets amount_paid_cents"
          - "recomputes Participant.outstanding_balance_cents (this invoice leaves the {ISSUED, DELINQUENT} sum)"
          - "increments ParticipationInvoice.version by 1 and Participant.version by 1"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /hie/participation-invoices/{id}/payment"
        actor: ParticipantAdmin
        preconditions:
          - "status IN {ISSUED, DELINQUENT}"
          - "amount_paid_cents == total_cents"
        side_effects:
          - "identical to the ISSUED -> PAID transition"
      - from: ISSUED
        to: DELINQUENT
        trigger: "POST /hie/participation-invoices/{id}/administrative-transitions action=DECLARE_DELINQUENT"
        actor: HieAdmin
        preconditions:
          - "status == ISSUED"
          - "logical clock > due_date"
        side_effects:
          - "sets status_reason = reason"
          - "Participant.outstanding_balance_cents is unchanged (DELINQUENT stays inside the sum)"
          - "increments ParticipationInvoice.version by 1"
      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "POST /hie/participation-invoices/{id}/administrative-transitions action=WRITE_OFF"
        actor: HieAdmin
        preconditions:
          - "status == DELINQUENT"
          - "reason present in the request body"
        side_effects:
          - "recomputes Participant.outstanding_balance_cents"
          - "increments ParticipationInvoice.version by 1 and Participant.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /hie/participation-invoices/{id}/administrative-transitions action=VOID"
        actor: HieAdmin
        preconditions:
          - "status == ISSUED"
          - "reason present in the request body"
        side_effects:
          - "compensation: recomputes Participant.outstanding_balance_cents, returning it to its pre-issue value (see calculations.participation_fee invariant)"
          - "the voided period stops blocking new invoices for the same window"
          - "increments ParticipationInvoice.version by 1 and Participant.version by 1"

concurrency_rules:
  - rule_id: consent-directive-create-stale-cluster
    parent_entity: IdentityCluster
    write_endpoint: "POST /hie/identity-clusters/{id}/consent-directives"
    occ_field: "expected_cluster_version"
    description: |
      Recording a ConsentDirective against an IdentityCluster whose version has advanced since the
      PrivacyOfficer last read it is rejected. Consent recording is legitimately a create-with-supersede
      operation - a new directive of the same (directive_type, scope, scoped_participant_id) triple
      displaces the prior ACTIVE one - so a request that carries a stale cluster version is acting on a
      consent picture that no longer describes the patient, and the server refuses rather than silently
      superseding a directive the caller never saw.
    error_id: ERR_STALE_CLUSTER_VERSION
    http_status: 412
  - rule_id: match-link-confirm-stale-cluster
    parent_entity: IdentityCluster
    write_endpoint: "POST /hie/match-links/{id}/steward-decision"
    occ_field: "expected_cluster_version"
    description: |
      Stewarding a MatchLink whose left record's cluster has advanced since the HieAdmin opened the
      review queue is rejected. Confirming a link legitimately absorbs one cluster into another, so a
      steward whose view of the cluster predates another confirmation would be merging a membership set
      that has already changed shape; the stale version check turns that into a deterministic 412.
    error_id: ERR_STALE_CLUSTER_VERSION
    http_status: 412
  - rule_id: data-feed-provision-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /hie/participants/{id}/data-feeds"
    occ_field: "expected_participant_version"
    description: |
      Provisioning a DataFeed against a Participant whose version has advanced since the ParticipantAdmin
      last read it is rejected. Feed provisioning is legitimately a create-with-supersede operation - a
      new generation of the same feed_type retires the prior generation - so a stale participant version
      means the caller is about to retire a feed generation it has never observed.
    error_id: ERR_STALE_PARTICIPANT_VERSION
    http_status: 412

calculations:
  - name: match_score
    trigger: "on POST /hie/participants/{id}/patient-records for every candidate pair, and on POST /hie/record-locator-queries step 1 to resolve the target cluster"
    algorithm: weighted_scoring
    formula: |
      # ---- normalization (applied to both sides before comparison) ----
      norm(text)  = trim(lowercase(text))
      norm(digits)= keep only [0-9]
      # ---- per-field agreement ----
      FUZZY_FIELDS = {family_name, given_name, postal_code, phone_digits}
      agreement(f):
        if left.f is null or right.f is null: return 0.0
        if norm(left.f) == norm(right.f):     return 1.0
        if f in FUZZY_FIELDS and first 3 characters of norm(left.f) == first 3 characters of norm(right.f):
                                              return partial_credit_factor
        return 0.0
      # birth_date and ssn_last4 are exact-only: they never earn partial credit.
      # ---- PROBABILISTIC variant ----
      raw = weight_family_name  * agreement(family_name)
          + weight_given_name   * agreement(given_name)
          + weight_birth_date   * agreement(birth_date)
          + weight_ssn_last4    * agreement(ssn_last4)
          + weight_postal_code  * agreement(postal_code)
          + weight_phone_digits * agreement(phone_digits)
      s = round_half_up(raw, 4)
      # non-linear post-processing, applied in exactly this order:
      if agreement(birth_date) == 0.0:                                  # birth-date veto cap
          s = min(s, BIRTH_DATE_VETO_CAP)
      if agreement(ssn_last4) == 1.0 and agreement(family_name) == 1.0:  # strong-identifier floor
          s = max(s, STRONG_IDENTIFIER_FLOOR)
      probabilistic_score = round_half_up(s, 4)
      # ---- DETERMINISTIC variant ----
      deterministic_score =
          1.0000 if (agreement(ssn_last4) == 1.0 and agreement(birth_date) == 1.0)
                 or (agreement(family_name) == 1.0 and agreement(given_name) == 1.0
                     and agreement(birth_date) == 1.0 and agreement(postal_code) == 1.0)
          else 0.0000
      # ---- variant selection ----
      match_score = deterministic_score if threshold_config.score_variant_mode == DETERMINISTIC_FIRST
                    else probabilistic_score
      score_variant = DETERMINISTIC if threshold_config.score_variant_mode == DETERMINISTIC_FIRST
                      else PROBABILISTIC
    input_set: |
      Candidate set for a newly contributed PatientRecord R: every PatientRecord C with
      C.participant_id != R.participant_id AND C.match_state == CLUSTERED AND
      cluster_of(C).status == ACTIVE. Records contributed by the same participant are never paired
      (source_mrn uniqueness already de-duplicates within a contributor). The scoring generation is the
      single MatchThresholdConfig with status == ACTIVE at proposal time; its id is pinned onto the
      resulting MatchLink.threshold_config_id and the link is never re-scored when a newer generation is
      activated. Candidate evaluation order is created_at ASC over C; every candidate produces one
      MatchLink row.
    constants:
      BIRTH_DATE_VETO_CAP: 0.6000
      STRONG_IDENTIFIER_FLOOR: 0.8000
    precision: "4 decimal places, round_half_up; the two roundings (before and after the cap/floor) are both applied"
    variants:
      - name: PROBABILISTIC
        when: "threshold_config.score_variant_mode == PROBABILISTIC_ONLY"
        difference: "weighted partial-credit sum with a birth-date veto cap and a strong-identifier floor; a pair agreeing only on ssn_last4 and birth_date scores 0.5300 under the reference weights"
      - name: DETERMINISTIC
        when: "threshold_config.score_variant_mode == DETERMINISTIC_FIRST"
        difference: "all-or-nothing: the same pair agreeing on ssn_last4 and birth_date scores 1.0000, which routes it to AUTO_LINKED instead of REJECTED"

  - name: participation_fee
    trigger: "on POST /hie/participants (PROVISIONAL variant, writes Participant.provisional_monthly_fee_cents and Participant.fee_tier) and on POST /hie/participants/{id}/participation-invoices (variant selected by basis_variant, writes the invoice's tier_charge_breakdown / volume_fee_cents / total_cents)"
    algorithm: tiered_pricing
    formula: |
      # ---- tier decomposition of the billable volume V ----
      units_tier_1 = min(V, TIER_1_CAP)
      units_tier_2 = min(max(V - TIER_1_CAP, 0), TIER_2_CAP - TIER_1_CAP)
      units_tier_3 = max(V - TIER_2_CAP, 0)
      # ---- PINNED ROUNDING ORDER: round EACH tier charge to whole cents, THEN sum. ----
      # Summing the unrounded tier charges and rounding once at the end is WRONG and is observable:
      # V = 30001 gives 49877 under the pinned order and 49876 under sum-then-round.
      charge_tier_1 = round_half_up(units_tier_1 * TIER_1_RATE_CENTS_PER_UNIT)
      charge_tier_2 = round_half_up(units_tier_2 * TIER_2_RATE_CENTS_PER_UNIT)
      charge_tier_3 = round_half_up(units_tier_3 * TIER_3_RATE_CENTS_PER_UNIT)
      volume_fee_cents = charge_tier_1 + charge_tier_2 + charge_tier_3
      fee_tier = TIER_3 if units_tier_3 > 0 else (TIER_2 if units_tier_2 > 0 else TIER_1)
      # ---- single final rounding after the quality multiplier ----
      total_cents = round_half_up((BASE_PLATFORM_FEE_CENTS + volume_fee_cents) * quality_multiplier)
    input_set: |
      PROVISIONAL: V = ceil(Participant.declared_annual_patient_volume / 12) and
      quality_multiplier = 1.00 unconditionally (no scorecard history is consulted, even when one exists).
      RECONCILED: V = SUM(FeedQualitySample.messages_received) over samples whose
      [period_start, period_end) is fully contained in [billing_period_start, billing_period_end)
      (period_start >= billing_period_start AND period_end <= billing_period_end) and whose owning
      DataFeed has status IN {MONITORED, DEGRADED} at issuance - PROVISIONING, SUSPENDED and RETIRED
      feeds are excluded; and quality_multiplier = QUALITY_MULTIPLIER[Participant.quality_grade] read at
      issuance, with UNGRADED mapping to 1.00. Samples are summed with no ordering dependence; when the
      qualifying set is empty a RECONCILED issuance is refused with ERR_NO_RECONCILIATION_BASIS.
    constants:
      TIER_1_CAP: 24750
      TIER_2_CAP: 99750
      TIER_1_RATE_CENTS_PER_UNIT: 1.75
      TIER_2_RATE_CENTS_PER_UNIT: 1.25
      TIER_3_RATE_CENTS_PER_UNIT: 0.65
      BASE_PLATFORM_FEE_CENTS: 250000
      QUALITY_MULTIPLIER: { A: 0.95, B: 1.00, C: 1.08, D: 1.20, UNGRADED: 1.00 }
    precision: "whole cents; round_half_up applied once per tier and once to the multiplied total"
    variants:
      - name: PROVISIONAL
        when: "basis_variant == PROVISIONAL, and always at participant creation"
        difference: "declared annual volume divided by 12 and rounded up, quality_multiplier forced to 1.00"
      - name: RECONCILED
        when: "basis_variant == RECONCILED"
        difference: "actual messages_received summed over in-period samples from qualifying feeds, multiplied by the grade-derived multiplier; the same participant and period yields 299877 provisional versus 254125 reconciled under the reference fixture"
    invariant: |
      Participant.outstanding_balance_cents == SUM(ParticipationInvoice.total_cents WHERE
      participant_id == Participant.id AND status IN {ISSUED, DELINQUENT}) holds after every issuance,
      payment, write-off and void; issue-then-void returns the field to its exact pre-issue value.

  - name: participant_quality_score
    trigger: "on POST /hie/data-feeds/{id}/quality-samples, on every DataFeed status transition into or out of {MONITORED, DEGRADED}, and on GET /hie/participants/{id}/scorecard"
    algorithm: weighted_scoring
    formula: |
      # ---- component aggregation over the qualifying sample set S (see input_set) ----
      R = sum(s.messages_received for s in S)
      completeness_component = 100 * (1 - sum(s.required_fields_missing_count for s in S) / max(1, R))
      rejection_component    = 100 * (1 - sum(s.messages_rejected          for s in S) / max(1, R))
      duplicate_component    = 100 * (1 - sum(s.duplicate_count            for s in S) / max(1, R))
      avg_p95 = round_half_up(sum(s.timeliness_p95_seconds for s in S) / count(S), 2)
      timeliness_component = 100 if avg_p95 <= 300
                        else  85 if avg_p95 <= 900
                        else  60 if avg_p95 <= 3600
                        else  30
      base_quality_score = round_half_up(0.30 * completeness_component
                                      + 0.30 * rejection_component
                                      + 0.15 * duplicate_component
                                      + 0.25 * timeliness_component, 2)
      # ---- PINNED EVALUATION ORDER for the circular-looking grade/penalty dependency ----
      # grade depends on quality_score, quality_score depends on penalty_points, and penalty_points
      # depends on a grade. The order below resolves it: the penalty is keyed on the PROVISIONAL grade
      # derived from base_quality_score and is NEVER recomputed from the final grade.
      provisional_grade = A if base_quality_score >= 92
                     else B if base_quality_score >= 84
                     else C if base_quality_score >= 70
                     else D
      penalty_points = PENALTY_BY_PROVISIONAL_GRADE[provisional_grade]
      quality_score  = round_half_up(base_quality_score - penalty_points, 2)
      grade = A if quality_score >= 92 else B if quality_score >= 84 else C if quality_score >= 70 else D
      # base 84.60 -> provisional B -> penalty 1 -> quality_score 83.60 -> grade C.
      # Re-deriving the penalty from the final grade (C -> 3) would yield 81.60 and is WRONG.
      if count(S) == 0: quality_score = null; grade = UNGRADED; provisional_grade = UNGRADED;
      penalty_points = 0; and the four components, average_p95_seconds and base_quality_score are all
      reported as 0. A non-empty S whose samples all carry messages_received == 0 is a different case:
      there the max(1, R) guard makes the three ratio components exactly 100 and the participant IS
      graded.
    input_set: |
      S = FeedQualitySample rows whose owning DataFeed has participant_id == this participant AND
      DataFeed.status IN {MONITORED, DEGRADED} (PROVISIONING, SUSPENDED and RETIRED feeds contribute
      nothing), restricted to samples with period_end > (logical clock - QUALITY_WINDOW_DAYS days)
      (exclusive lower bound) AND period_end <= logical clock (inclusive upper bound), then truncated to
      the newest QUALITY_SAMPLE_LIMIT rows ordered by period_end DESC with tie-break created_at ASC.
      When S is empty the participant is UNGRADED and quality_score is null.
    constants:
      QUALITY_WINDOW_DAYS: 90
      QUALITY_SAMPLE_LIMIT: 6
      PENALTY_BY_PROVISIONAL_GRADE: { A: 0, B: 1, C: 3, D: 6 }
      FEED_DEGRADED_REJECT_RATE: 0.0500
    precision: "2 decimal places, round_half_up, on avg_p95, base_quality_score and quality_score"

  - name: consent_disclosure_decision
    trigger: "on POST /hie/record-locator-queries"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 - cluster resolution (reuses match_score against the submitted demographics)
      candidates = PatientRecord rows with match_state == CLUSTERED and cluster_of(record).status == ACTIVE
      score(c)   = match_score(submitted demographics, c) under the ACTIVE MatchThresholdConfig
      top_candidate_score = max(score(c)) over candidates, or null when candidates is empty
      eligible   = { c : score(c) >= active_config.auto_link_threshold }
      if eligible is empty:
          cluster_id = null; consent_decision = NO_MATCH; disclosed = 0; withheld = 0
          # one AccessAuditEntry is still NOT written: there is no record to audit.
          stop
      chosen  = the member of eligible with the highest score(c); tie-break created_at ASC over the record
      cluster = cluster_of(chosen)
      # STEP 2 - governing policy
      policy = the ConsentPolicy with status == ACTIVE and effective_from <= clock
               and (effective_until is null or clock < effective_until)
      if policy is absent: reject with ERR_NO_ACTIVE_CONSENT_POLICY
      # STEP 3 - candidate directive set and precedence
      D = ConsentDirective rows with cluster_id == cluster.id AND status == ACTIVE
                                AND effective_from <= clock
      precedence order over D:
        (1) scope == SINGLE_PARTICIPANT with scoped_participant_id == querying_participant_id first,
            then scope == ALL_PARTICIPANTS; SINGLE_PARTICIPANT rows scoped to any OTHER participant are
            dropped from D entirely
        (2) effective_from DESC
        (3) created_at DESC
      governing = the first row of D whose directive_type IN {OPT_IN, OPT_OUT}, else null
      base_decision = governing.directive_type if governing is not null
                 else (OPT_IN  if policy.model == OPT_OUT and policy.default_share_for_treatment
                       else OPT_OUT)
      # STEP 4 - overrides, evaluated in this order
      emergency = break_glass_id is not null
                  and the session's cluster_id == cluster.id
                  and session_status == OPEN and clock <= expires_at
                  and invoking_clinician_user_id == X-User-ID
      conduit   = purpose_of_use == PUBLIC_HEALTH
                  and querying Participant.org_type == PUBLIC_HEALTH
                  and that participant holds a NotificationSubscription with
                      subscription_scope == PUBLIC_HEALTH_CONDUIT and status == ACTIVE
      # STEP 5 - member set and suppression
      members = PatientRecord rows with cluster_id == cluster.id AND match_state == CLUSTERED,
                ordered created_at ASC
      suppressed_categories =
          union of restricted_categories over rows of D with directive_type ==
          SENSITIVE_CATEGORY_RESTRICTION, intersected with policy.sensitive_categories_segmented
      if purpose_of_use IN {PAYMENT, OPERATIONS}:
          suppressed_categories = suppressed_categories UNION policy.sensitive_categories_segmented
      for each member m (created_at ASC):
          if contributor_of(m).onboarding_status IN {SUSPENDED, WITHDRAWN, TERMINATED}:
              WITHHELD, suppression_reason = CONTRIBUTOR_NOT_PARTICIPATING
          elif emergency:
              BREAK_GLASS_DISCLOSED, suppression_reason = null   # emergency overrides both opt-out and segmentation
          elif base_decision == OPT_OUT and not conduit:
              WITHHELD, suppression_reason = OPT_OUT
          elif m.sensitive_categories intersects suppressed_categories:
              WITHHELD, suppression_reason = (PURPOSE_RESTRICTED if purpose_of_use IN {PAYMENT, OPERATIONS}
                                             else SENSITIVE_CATEGORY)
          else:
              DISCLOSED, suppression_reason = null
      # STEP 6 - decision label
      consent_decision =
          PERMITTED_EMERGENCY     if emergency
          else DENIED_OPT_OUT     if base_decision == OPT_OUT and not conduit and disclosed == 0
          else PERMITTED_PUBLIC_HEALTH if conduit and base_decision == OPT_OUT and withheld == 0
          else PARTIAL_SEGMENTED  if disclosed > 0 and withheld > 0
          else DENIED_SEGMENTED   if disclosed == 0 and withheld > 0
          else PERMITTED
      # STEP 7 - audit: exactly one AccessAuditEntry per member, in the same created_at ASC order,
      # written for WITHHELD members too. withheld_categories = sorted union of sensitive_category_hit.
    input_set: |
      Only cluster members with match_state == CLUSTERED are considered; QUARANTINED and
      WITHDRAWN_FROM_INDEX records are invisible to the locator and produce no audit entry. Only
      directives with status == ACTIVE and effective_from <= logical clock participate; REVOKED and
      SUPERSEDED directives are ignored even when they are the most specific rows on the cluster.
    constants: {}
    precision: "integer counts; scores reuse match_score's 4-decimal precision"
    variants:
      - name: STANDARD
        when: "break_glass_id is null and the conduit override does not apply"
        difference: "opt-out fully denies; segmentation withholds category-tagged members only"
      - name: EMERGENCY_OVERRIDE
        when: "a valid OPEN break-the-glass session covering the resolved cluster is cited"
        difference: "every member is disclosed with action BREAK_GLASS_DISCLOSED regardless of opt-out or segmentation, and the session's disclosed counters are advanced"

  - name: cluster_membership_recount
    trigger: "on PatientRecord creation, on every MatchLink transition into AUTO_LINKED / LINKED / UNLINKED, on IdentityCluster MERGED_AWAY and its restoration, and on Participant TERMINATED"
    algorithm: aggregation
    formula: |
      member_record_count = count(PatientRecord where cluster_id == cluster.id
                                                 and match_state == CLUSTERED)
      participant_count   = count(distinct participant_id over that same member set)
      primary_record_id   = the member with the highest completeness_score, tie-break created_at ASC
      pending_review_link_count = count(MatchLink where status == PENDING_REVIEW
                                        and (left_record_id or right_record_id) is a member)
      active_directive_count = count(ConsentDirective where cluster_id == cluster.id
                                     and status == ACTIVE)
    input_set: |
      Exactly the PatientRecord rows currently pointing at the cluster with match_state == CLUSTERED;
      QUARANTINED and WITHDRAWN_FROM_INDEX rows are excluded from all four counters even though their
      cluster_id is retained for audit. Recount always runs on BOTH clusters of a merge or unmerge, the
      winner first and the loser second.
    constants: {}
    precision: "integers"
    invariant: |
      SUM(IdentityCluster.member_record_count WHERE status == ACTIVE)
        == COUNT(PatientRecord WHERE match_state == CLUSTERED)
      holds after every link confirmation and after its compensating unlink; a confirm/unlink pair must
      leave the total identical and must restore every re-pointed record's cluster_id from
      prior_cluster_id.

  - name: break_glass_sanction_points
    trigger: "on POST /hie/break-glass-accesses/{id}/review-decision, and on any read of Participant.sanction_points_active"
    algorithm: decay_function
    formula: |
      sanction_points_awarded(bga) =
          POINTS_BY_CATEGORY[bga.emergency_category]
          + (SENSITIVE_DISCLOSURE_SURCHARGE if bga.disclosed_sensitive_count > 0 else 0)
        when bga.review_status == UNJUSTIFIED, else 0
      Participant.sanction_points_active =
          SUM(sanction_points_awarded(bga)) over BreakGlassAccess rows with
              invoking_participant_id == participant.id
              AND review_status == UNJUSTIFIED
              AND decided_at > (logical clock - SANCTION_DECAY_DAYS days)   # exclusive lower bound: a
              # decision exactly SANCTION_DECAY_DAYS old has already decayed and contributes 0
      # step decay, not continuous: a row contributes its full points until the boundary, then nothing.
      if Participant.sanction_points_active >= SANCTION_SUSPENSION_THRESHOLD
         and Participant.onboarding_status == CERTIFIED:
             fire the system transition CERTIFIED -> SUSPENDED (cascade link 2)
    input_set: |
      Only UNJUSTIFIED reviews of sessions invoked ON BEHALF OF this participant
      (BreakGlassAccess.invoking_participant_id) count; JUSTIFIED, UNDER_REVIEW and PENDING_REVIEW rows
      contribute 0, and the invoking clinician's own identity is irrelevant to the sum. Rows are summed
      with no ordering dependence.
    constants:
      POINTS_BY_CATEGORY: { LIFE_THREATENING: 6, UNCONSCIOUS_PATIENT: 4, DISASTER: 3 }
      SENSITIVE_DISCLOSURE_SURCHARGE: 2
      SANCTION_DECAY_DAYS: 180
      SANCTION_SUSPENSION_THRESHOLD: 12
      BREAK_GLASS_SESSION_MINUTES: 240
      BREAK_GLASS_COOLDOWN_MINUTES: 60
    precision: "integers; the threshold comparison is >= (11 does not suspend, 12 does)"

  - name: conformance_pass_rate
    trigger: "on POST /hie/conformance-tests/{id}/results"
    algorithm: threshold
    formula: |
      pass_rate = round_half_up(assertions_passed / assertions_total, 4)
      critical_failure = failure_categories intersects CRITICAL_FAILURE_CATEGORIES
      status = PASSED if (pass_rate >= CONFORMANCE_PASS_RATE_FLOOR and critical_failure == false)
               else FAILED
      # 190/200 == 0.9500 PASSES (inclusive); 189/200 == 0.9450 FAILS.
      # A critical failure category FAILS the run even at pass_rate 1.0000.
    input_set: |
      Only the assertion counts submitted on this run; prior attempts on the same profile do not
      contribute. attempt_number is the 1-based ordinal among the participant's runs for the same
      profile ordered by created_at ASC.
    constants:
      CONFORMANCE_PASS_RATE_FLOOR: 0.9500
      CRITICAL_FAILURE_CATEGORIES: [SECURITY, PATIENT_ID_INTEGRITY]
      CONSECUTIVE_FAILURE_LIMIT: 3
      REQUIRED_CERTIFICATION_PROFILES: [ADT_PUBLISHER, DOCUMENT_SOURCE, QUERY_RESPONDER]
    precision: "4 decimal places, round_half_up"

validations:
  - priority: 1
    category: auth
    condition: "X-User-Role header absent or empty on any endpoint"
    error_id: ERR_UNAUTHENTICATED
    applies_to: [all endpoints]
  - priority: 2
    category: auth
    condition: "X-User-Role is not one of HieAdmin, ParticipantAdmin, Clinician, PrivacyOfficer, PublicHealthOfficer, or the role is not listed as permitted for the endpoint in §1.7"
    error_id: ERR_ROLE_NOT_PERMITTED
    applies_to: [all endpoints]
  - priority: 3
    category: auth
    condition: "the endpoint is a multiplexed action endpoint and the caller's role is not permitted for the specific action value (see §1.7 action_permissions): only HieAdmin may CERTIFY, SUSPEND, REINSTATE or TERMINATE a participant; only ParticipantAdmin may SUBMIT_FOR_LEGAL_REVIEW, RESUME_CONFORMANCE or WITHDRAW; only HieAdmin may EXECUTE_AGREEMENT or REMEDIATE; only PrivacyOfficer may issue a match-link REOPEN; only HieAdmin may WRITE_OFF an invoice"
    error_id: ERR_ACTION_NOT_PERMITTED_FOR_ROLE
    applies_to: ["POST /hie/participants/{id}/onboarding-transitions", "POST /hie/match-links/{id}/steward-decision", "POST /hie/data-feeds/{id}/status-transitions", "POST /hie/notification-subscriptions/{id}/lifecycle-transitions", "POST /hie/participation-invoices/{id}/administrative-transitions"]
  - priority: 4
    category: auth
    condition: "the caller's role is entity_backed (ParticipantAdmin, PublicHealthOfficer) and X-User-ID does not equal the participant_id that owns the addressed resource, or does not equal the querying_participant_id / invoking_participant_id in the payload"
    error_id: ERR_PARTICIPANT_SCOPE_VIOLATION
    applies_to: ["POST /hie/participants/{id}/patient-records", "POST /hie/participants/{id}/conformance-tests", "POST /hie/participants/{id}/data-feeds", "POST /hie/participants/{id}/notification-subscriptions", "POST /hie/record-locator-queries", "POST /hie/break-glass-accesses", "POST /hie/participation-invoices/{id}/payment", "GET /hie/participants/{id}/scorecard"]
  - priority: 5
    category: auth
    condition: "purpose_of_use is not permitted for the caller's role: Clinician may use TREATMENT only; ParticipantAdmin may use PAYMENT or OPERATIONS only; PublicHealthOfficer may use PUBLIC_HEALTH or TREATMENT only; PrivacyOfficer and HieAdmin may not submit locator queries at all (caught earlier at priority 2)"
    error_id: ERR_PURPOSE_NOT_PERMITTED_FOR_ROLE
    applies_to: ["POST /hie/record-locator-queries"]
  - priority: 6
    category: schema
    condition: "a required field is missing, a field has the wrong JSON type, an enum value is outside its declared domain, a numeric field is outside its declared range (weights not in [0,1]; thresholds not in [0,1]; counts negative; ssn_last4 not exactly 4 digits; phone_digits not 10 digits; timestamps not ISO-8601 UTC), or an interval has period_start >= period_end / effective_from >= effective_until"
    error_id: ERR_INVALID_REQUEST
    applies_to: [all write endpoints]
  - priority: 7
    category: referential
    condition: "an id in the request path does not resolve to a stored entity"
    error_id: "ERR_PARTICIPANT_NOT_FOUND | ERR_CONFORMANCE_TEST_NOT_FOUND | ERR_CONSENT_POLICY_NOT_FOUND | ERR_THRESHOLD_CONFIG_NOT_FOUND | ERR_PATIENT_RECORD_NOT_FOUND | ERR_CLUSTER_NOT_FOUND | ERR_MATCH_LINK_NOT_FOUND | ERR_DIRECTIVE_NOT_FOUND | ERR_QUERY_NOT_FOUND | ERR_AUDIT_ENTRY_NOT_FOUND | ERR_BREAK_GLASS_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_DATA_FEED_NOT_FOUND | ERR_INVOICE_NOT_FOUND"
    applies_to: [all endpoints with a path id]
  - priority: 8
    category: referential
    condition: "an id supplied in the request body does not resolve to a stored entity (querying_participant_id, invoking_participant_id, cluster_id, scoped_participant_id, break_glass_id)"
    error_id: "ERR_PARTICIPANT_NOT_FOUND | ERR_CLUSTER_NOT_FOUND | ERR_BREAK_GLASS_NOT_FOUND"
    applies_to: ["POST /hie/record-locator-queries", "POST /hie/break-glass-accesses", "POST /hie/identity-clusters/{id}/consent-directives", "POST /hie/participants/{id}/notification-subscriptions"]
  - priority: 9
    category: concurrency
    condition: "expected_cluster_version does not equal the addressed IdentityCluster.version, or expected_participant_version does not equal the addressed Participant.version (see §1.2.1)"
    error_id: "ERR_STALE_CLUSTER_VERSION | ERR_STALE_PARTICIPANT_VERSION"
    applies_to: ["POST /hie/identity-clusters/{id}/consent-directives", "POST /hie/match-links/{id}/steward-decision", "POST /hie/match-links/{id}/unlink", "POST /hie/participants/{id}/data-feeds"]
  - priority: 10
    category: state
    condition: "the requested action is not an outgoing transition of the entity's current non-terminal state, or a declared precondition of the selected transition that carries no error id of its own is unsatisfied (for example action == DECLARE_DELINQUENT while the logical clock is at or before due_date)"
    error_id: ERR_INVALID_STATE_TRANSITION
    applies_to: [all action endpoints]
  - priority: 11
    category: state
    condition: "the entity is already in a terminal state (Participant WITHDRAWN or TERMINATED; ConformanceTest PASSED or WAIVED; ConsentPolicy SUPERSEDED; MatchThresholdConfig RETIRED; MatchLink REJECTED; ConsentDirective SUPERSEDED or REVOKED; DataFeed RETIRED; NotificationSubscription TERMINATED; ParticipationInvoice PAID, WRITTEN_OFF or VOID; BreakGlassAccess session_status IN {CLOSED, EXPIRED} for closure, review_status IN {JUSTIFIED, UNJUSTIFIED} for review actions)"
    error_id: ERR_TERMINAL_STATE
    applies_to: [all action endpoints]
  - priority: 12
    category: state
    condition: "the participant that owns or submits the operation is not CERTIFIED - required for record-locator queries, break-the-glass invocation and notification-subscription activation. Invoice issuance is the conditional exception: it requires only onboarding_status IN {CONFORMANCE_TESTING, CERTIFIED, SUSPENDED, TERMINATED}, because billing begins once the participation agreement has been executed and continues after suspension"
    error_id: ERR_PARTICIPANT_NOT_CERTIFIED
    applies_to: ["POST /hie/record-locator-queries", "POST /hie/break-glass-accesses", "POST /hie/notification-subscriptions/{id}/lifecycle-transitions", "POST /hie/participants/{id}/participation-invoices"]
  - priority: 13
    category: cross_entity
    condition: "the querying participant has no DataFeed of feed_type CCDA with status IN {MONITORED, DEGRADED}; a PROVISIONING, SUSPENDED or RETIRED document feed cannot carry a locator response"
    error_id: ERR_QUERY_FEED_NOT_OPERATIONAL
    applies_to: ["POST /hie/record-locator-queries"]
  - priority: 14
    category: cross_entity
    condition: "the addressed IdentityCluster has status == MERGED_AWAY; directives, break-the-glass sessions and cluster-scoped subscriptions may only attach to an ACTIVE cluster"
    error_id: ERR_CLUSTER_MERGED_AWAY
    applies_to: ["POST /hie/identity-clusters/{id}/consent-directives", "POST /hie/break-glass-accesses", "POST /hie/participants/{id}/notification-subscriptions"]
  - priority: 15
    category: business_governance
    condition: "no ConsentPolicy has status == ACTIVE with effective_from <= clock and (effective_until is null or clock < effective_until)"
    error_id: ERR_NO_ACTIVE_CONSENT_POLICY
    applies_to: ["POST /hie/record-locator-queries", "POST /hie/identity-clusters/{id}/consent-directives"]
  - priority: 16
    category: business_sod
    condition: "the X-User-ID performing action == CERTIFY equals the Participant.agreement_executed_by_user_id recorded at EXECUTE_AGREEMENT; the administrator who countersigned the participation agreement may not also certify the participant"
    error_id: ERR_SOD_CERTIFIER_IS_SIGNATORY
    applies_to: ["POST /hie/participants/{id}/onboarding-transitions"]
  - priority: 17
    category: business_safety
    condition: "a break_glass_id is cited whose session_status is not OPEN, whose cluster_id does not match the resolved cluster, whose invoking_clinician_user_id does not equal X-User-ID, or whose expires_at is earlier than the clock"
    error_id: ERR_BREAK_GLASS_SESSION_NOT_OPEN
    applies_to: ["POST /hie/record-locator-queries", "POST /hie/break-glass-accesses/{id}/closure"]
  - priority: 18
    category: business_sod
    condition: "the X-User-ID recording a steward decision equals the MatchThresholdConfig.activated_by_user_id of the config pinned onto the link; the officer who tuned the matching thresholds may not adjudicate links scored by that generation"
    error_id: ERR_SOD_STEWARD_IS_TUNER
    applies_to: ["POST /hie/match-links/{id}/steward-decision"]
  - priority: 19
    category: business_temporal
    condition: "an OPEN or recently expired BreakGlassAccess exists for the same (cluster_id, invoking_clinician_user_id) whose closed interval [opened_at, expires_at + BREAK_GLASS_COOLDOWN_MINUTES] contains the clock; the interval is CLOSED at both ends, so a re-invocation exactly at expires_at + cooldown still collides"
    error_id: ERR_BREAK_GLASS_COOLDOWN_ACTIVE
    applies_to: ["POST /hie/break-glass-accesses"]
  - priority: 20
    category: business_temporal
    condition: "the submitted ConsentPolicy [effective_from, effective_until) half-open interval overlaps the interval of any existing policy with status IN {DRAFT, ACTIVE}; adjacency is allowed, so a policy starting exactly at an incumbent's effective_until is accepted"
    error_id: ERR_CONSENT_POLICY_INTERVAL_OVERLAP
    applies_to: ["POST /hie/consent-policies"]
  - priority: 21
    category: business_referential
    condition: "activating a NotificationSubscription whose owning participant lacks a ConformanceTest with profile == ADT_PUBLISHER and status == PASSED; a WAIVED ADT_PUBLISHER run satisfies certification but NOT subscription activation"
    error_id: ERR_SUBSCRIPTION_CONFORMANCE_MISSING
    applies_to: ["POST /hie/notification-subscriptions/{id}/lifecycle-transitions"]
  - priority: 22
    category: business_constraint
    condition: "subscription_scope == PUBLIC_HEALTH_CONDUIT and the owning Participant.org_type != PUBLIC_HEALTH"
    error_id: ERR_CONDUIT_ORG_TYPE_INVALID
    applies_to: ["POST /hie/participants/{id}/notification-subscriptions"]
  - priority: 23
    category: business_constraint
    condition: "justification_text has fewer than BREAK_GLASS_JUSTIFICATION_MIN_CHARS (40) characters after trimming, or review_note is shorter than 40 characters when outcome == UNJUSTIFIED"
    error_id: ERR_JUSTIFICATION_TOO_SHORT
    applies_to: ["POST /hie/break-glass-accesses", "POST /hie/break-glass-accesses/{id}/review-decision"]
  - priority: 24
    category: business_constraint
    condition: "a FeedQualitySample has messages_rejected + required_fields_missing_count > messages_received, or duplicate_count > messages_received, or its [period_start, period_end) window overlaps an existing sample on the same feed"
    error_id: ERR_QUALITY_SAMPLE_INVALID
    applies_to: ["POST /hie/data-feeds/{id}/quality-samples"]
  - priority: 25
    category: business_uniqueness
    condition: "a PatientRecord with the same (participant_id, source_mrn) already exists"
    error_id: ERR_DUPLICATE_SOURCE_MRN
    applies_to: ["POST /hie/participants/{id}/patient-records"]
  - priority: 26
    category: business_workflow
    condition: "review-decision is submitted by an X-User-ID other than the BreakGlassAccess.review_claimed_by_user_id set by review-claim, or review-claim is attempted on a session whose review_claimed_by_user_id is already set to another user"
    error_id: ERR_REVIEW_NOT_CLAIMED_BY_ACTOR
    applies_to: ["POST /hie/break-glass-accesses/{id}/review-decision", "POST /hie/break-glass-accesses/{id}/review-claim"]
  - priority: 27
    category: business_constraint
    condition: "subscription_scope == CLUSTER and cluster_id is null, or subscription_scope != CLUSTER and cluster_id is non-null"
    error_id: ERR_SUBSCRIPTION_SCOPE_MISMATCH
    applies_to: ["POST /hie/participants/{id}/notification-subscriptions"]
  - priority: 28
    category: business_constraint
    condition: "a MatchThresholdConfig has weights whose sum differs from 1.0000 by more than 0.0001, or auto_link_threshold <= review_lower_bound, or partial_credit_factor outside (0, 1)"
    error_id: ERR_THRESHOLD_CONFIG_INVALID
    applies_to: ["POST /hie/match-threshold-configs"]
  - priority: 29
    category: business_governance
    condition: "no MatchThresholdConfig has status == ACTIVE at the time a record is contributed or a locator query is scored"
    error_id: ERR_NO_ACTIVE_THRESHOLD_CONFIG
    applies_to: ["POST /hie/participants/{id}/patient-records", "POST /hie/record-locator-queries"]
  - priority: 30
    category: business_temporal
    condition: "the submitted invoice [billing_period_start, billing_period_end) overlaps the period of an existing invoice for the same participant with status IN {ISSUED, PAID, DELINQUENT, WRITTEN_OFF}; VOID invoices are excluded from the overlap test"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    applies_to: ["POST /hie/participants/{id}/participation-invoices"]
  - priority: 31
    category: business_temporal
    condition: "billing_period_end is later than the logical clock; a period that has not fully elapsed cannot be invoiced"
    error_id: ERR_INVOICE_PERIOD_NOT_ELAPSED
    applies_to: ["POST /hie/participants/{id}/participation-invoices"]
  - priority: 32
    category: business_fiscal
    condition: "the participant has any ParticipationInvoice with status == DELINQUENT; delinquent participants may not activate new subscriptions or contribute new feeds"
    error_id: ERR_PARTICIPATION_FEE_DELINQUENT
    applies_to: ["POST /hie/notification-subscriptions/{id}/lifecycle-transitions", "POST /hie/participants/{id}/data-feeds"]
  - priority: 33
    category: business_constraint
    condition: "the submitted amount_paid_cents does not equal the invoice's total_cents minus the invoice's currently stored amount_paid_cents (partial payment and overpayment are both refused)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    applies_to: ["POST /hie/participation-invoices/{id}/payment"]
  - priority: 34
    category: business_constraint
    condition: "basis_variant == RECONCILED and the qualifying FeedQualitySample set for the billing period is empty"
    error_id: ERR_NO_RECONCILIATION_BASIS
    applies_to: ["POST /hie/participants/{id}/participation-invoices"]
  - priority: 35
    category: business_governance
    condition: "a PatientRecord is contributed by a participant whose onboarding_status is not IN {CONFORMANCE_TESTING, CERTIFIED}"
    error_id: ERR_PARTICIPANT_NOT_ONBOARDED_FOR_DATA
    applies_to: ["POST /hie/participants/{id}/patient-records"]
  - priority: 36
    category: business_governance
    condition: "action == CERTIFY and the participant lacks a PASSED or WAIVED ConformanceTest for every profile in REQUIRED_CERTIFICATION_PROFILES"
    error_id: ERR_CERTIFICATION_PROFILES_INCOMPLETE
    applies_to: ["POST /hie/participants/{id}/onboarding-transitions"]
  - priority: 37
    category: business_uniqueness
    condition: "a ConformanceTest is scheduled for a profile that already has a PASSED run for the same participant; a FAILED or WAIVED run may always be re-attempted"
    error_id: ERR_CONFORMANCE_PROFILE_ALREADY_PASSED
    applies_to: ["POST /hie/participants/{id}/conformance-tests"]
  - priority: 38
    category: business_constraint
    condition: "scope == SINGLE_PARTICIPANT and scoped_participant_id is null, or scope == ALL_PARTICIPANTS and scoped_participant_id is non-null, or directive_type == SENSITIVE_CATEGORY_RESTRICTION and restricted_categories is empty"
    error_id: ERR_DIRECTIVE_SCOPE_PARTICIPANT_REQUIRED
    applies_to: ["POST /hie/identity-clusters/{id}/consent-directives"]

endpoints:
  # ---------------------------------------------------------------- participant onboarding
  - method: POST
    path: "/hie/participants"
    description: "Register a candidate participant organization in APPLIED state and compute its PROVISIONAL monthly fee from the declared annual patient volume."
    roles: [HieAdmin]
    code: 201
    input: [legal_name, org_type, declared_annual_patient_volume, primary_contact_email]
    output: Participant
    side_effects:
      - "sets onboarding_status = APPLIED, version = 1, sanction_points_active = 0, outstanding_balance_cents = 0, active_subscription_count = 0, conformance_attempt_count = 0, consecutive_failed_attempts = 0, remediation_count = 0, passed_profiles = []"
      - "runs participation_fee in the PROVISIONAL variant over ceil(declared_annual_patient_volume / 12) and writes provisional_monthly_fee_cents and fee_tier"
      - "sets quality_score = null and quality_grade = UNGRADED (no feeds exist yet)"
  - method: POST
    path: "/hie/participants/{id}/onboarding-transitions"
    description: "Multiplexed onboarding action endpoint. action IN {SUBMIT_FOR_LEGAL_REVIEW, EXECUTE_AGREEMENT, CERTIFY, REMEDIATE, RESUME_CONFORMANCE, SUSPEND, REINSTATE, TERMINATE, WITHDRAW}; per-action role gating is enforced at validation priority 3."
    roles: [HieAdmin, ParticipantAdmin]
    code: 200
    input: [action, "agreement_version?", "signed_at?", "reason?"]
    output: Participant
    side_effects:
      - "drives the Participant state machine transition selected by action and increments version by 1"
      - "EXECUTE_AGREEMENT records agreement_version, agreement_signed_at = signed_at, agreement_executed_by_user_id = X-User-ID and immediately auto-advances AGREEMENT_EXECUTED -> CONFORMANCE_TESTING"
      - "CERTIFY records certified_by_user_id = X-User-ID and certified_at = logical clock after checking REQUIRED_CERTIFICATION_PROFILES coverage and the priority-16 segregation-of-duties rule"
      - "REMEDIATE and RESUME_CONFORMANCE increment remediation_count and reset consecutive_failed_attempts to 0"
      - "SUSPEND writes suspension_reason = reason and fans out: every DataFeed in MONITORED moves to SUSPENDED with status_reason = PARTICIPANT_SUSPENSION_CASCADE, then participant_quality_score re-runs over the shrunken sample set; separately every ACTIVE NotificationSubscription moves to SUSPENDED"
      - "REINSTATE restores SUSPENDED NotificationSubscriptions to ACTIVE and leaves DataFeeds SUSPENDED until explicitly restored"
      - "TERMINATE terminates every non-TERMINATED NotificationSubscription and recounts every cluster the participant contributed records to"
  - method: POST
    path: "/hie/participants/{id}/conformance-tests"
    description: "Schedule a technical conformance run for one certification profile; the run starts in RUNNING."
    roles: [HieAdmin, ParticipantAdmin]
    code: 201
    input: [profile, scheduled_start, scheduled_end]
    output: ConformanceTest
    side_effects:
      - "sets status = RUNNING, attempt_number = 1 + count of the participant's prior runs for the same profile, executed_by_user_id = X-User-ID"
      - "increments Participant.conformance_attempt_count by 1"
  - method: POST
    path: "/hie/conformance-tests/{id}/results"
    description: "Submit assertion counts for a RUNNING conformance run; conformance_pass_rate decides PASSED versus FAILED."
    roles: [HieAdmin]
    code: 200
    input: [assertions_total, assertions_passed, "failure_categories?"]
    output: ConformanceTest
    side_effects:
      - "runs conformance_pass_rate, writing pass_rate, critical_failure and status"
      - "on PASSED: appends profile to Participant.passed_profiles (idempotent set semantics) and resets Participant.consecutive_failed_attempts to 0"
      - "on FAILED: increments Participant.consecutive_failed_attempts; when it reaches CONSECUTIVE_FAILURE_LIMIT the Participant auto-transitions CONFORMANCE_TESTING -> REMEDIATION"
      - "increments Participant.version by 1"
  - method: POST
    path: "/hie/conformance-tests/{id}/waiver"
    description: "Waive a FAILED conformance run so the profile counts as satisfied for certification."
    roles: [HieAdmin]
    code: 200
    input: [waiver_reason]
    output: ConformanceTest
    side_effects:
      - "moves the run FAILED -> WAIVED and records waiver_reason"
      - "appends profile to Participant.passed_profiles and resets consecutive_failed_attempts to 0"
      - "increments Participant.version by 1"
  # ---------------------------------------------------------------- consent policy administration
  - method: POST
    path: "/hie/consent-policies"
    description: "Draft a statewide consent policy generation covering a half-open [effective_from, effective_until) interval."
    roles: [PrivacyOfficer]
    code: 201
    input: [policy_version, model, sensitive_categories_segmented, default_share_for_treatment, effective_from, "effective_until?"]
    output: ConsentPolicy
    side_effects:
      - "sets status = DRAFT, directive_count = 0"
      - "runs the priority-20 half-open interval overlap check against every DRAFT or ACTIVE policy; adjacency (new effective_from == incumbent effective_until) is accepted"
  - method: POST
    path: "/hie/consent-policies/{id}/activation"
    description: "Activate a DRAFT consent policy generation."
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: ConsentPolicy
    side_effects:
      - "moves DRAFT -> ACTIVE and records activated_by_user_id = X-User-ID"
      - "supersedes any ACTIVE policy whose non-null effective_until is at or before this policy's effective_from"
  # ---------------------------------------------------------------- matching threshold administration
  - method: POST
    path: "/hie/match-threshold-configs"
    description: "Draft a matching threshold generation: six field weights that must sum to 1.0000, a partial-credit factor, the auto-link and review bounds, and the score variant mode."
    roles: [PrivacyOfficer]
    code: 201
    input: [config_label, auto_link_threshold, review_lower_bound, score_variant_mode, weight_family_name, weight_given_name, weight_birth_date, weight_ssn_last4, weight_postal_code, weight_phone_digits, partial_credit_factor]
    output: MatchThresholdConfig
    side_effects:
      - "sets status = DRAFT, scored_link_count = 0, tuned_by_user_id = X-User-ID"
      - "runs the priority-28 weight-sum, bound-ordering and partial-credit-range checks"
  - method: POST
    path: "/hie/match-threshold-configs/{id}/activation"
    description: "Activate a DRAFT threshold generation; the incumbent ACTIVE generation retires. Links already scored keep their pinned generation and are never re-scored."
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: MatchThresholdConfig
    side_effects:
      - "moves DRAFT -> ACTIVE, records activated_by_user_id = X-User-ID"
      - "moves the incumbent ACTIVE generation to RETIRED"
  # ---------------------------------------------------------------- patient records and matching
  - method: POST
    path: "/hie/participants/{id}/patient-records"
    description: "Contribute one patient record to the index. Every eligible cross-participant candidate is scored by match_score under the ACTIVE threshold generation and one MatchLink is written per candidate."
    roles: [ParticipantAdmin, HieAdmin]
    code: 201
    input: [source_mrn, given_name, family_name, birth_date, sex, "ssn_last4?", "postal_code?", "phone_digits?", "sensitive_categories?"]
    output: PatientRecord
    side_effects:
      - "sets match_state = CLUSTERED and completeness_score = count of non-null demographic fields among the nine"
      - "creates a fresh IdentityCluster (status = ACTIVE) holding this record alone, then runs cluster_membership_recount on it"
      - "runs match_score against every candidate in created_at ASC order, creating one MatchLink per candidate in PROPOSED and immediately routing it to AUTO_LINKED, PENDING_REVIEW or REJECTED; the ACTIVE config id is pinned onto MatchLink.threshold_config_id and its scored_link_count advances"
      - "an AUTO_LINKED link merges the two clusters immediately: the cluster with the earlier created_at wins, the loser becomes MERGED_AWAY with merged_into_cluster_id set, re-pointed records keep prior_cluster_id, and consent directives and CLUSTER-scoped subscriptions are re-pointed with duplicates SUPERSEDED / TERMINATED"
      - "runs cluster_membership_recount on the winner then the loser"
  - method: POST
    path: "/hie/match-links/{id}/steward-decision"
    description: "Record a data-steward adjudication on a match link. decision IN {CONFIRM, REJECT, REOPEN}; CONFIRM merges the two clusters and cascades onto directives and subscriptions."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: [decision, expected_cluster_version, "review_note?"]
    output: MatchLink
    side_effects:
      - "CONFIRM moves PENDING_REVIEW -> LINKED and fires cascade B in order: (1) link status, (2) cluster merge with the earlier created_at winning and the loser MERGED_AWAY, (3) ConsentDirective re-point with duplicate (directive_type, scope, scoped_participant_id) triples SUPERSEDED and supersedes_directive_id set, (4) CLUSTER-scoped NotificationSubscription re-point with the later-created_at duplicate TERMINATED with termination_reason = DUPLICATE_AFTER_CLUSTER_MERGE"
      - "REJECT moves PENDING_REVIEW -> REJECTED with no cluster effect; REOPEN moves UNLINKED -> PENDING_REVIEW"
      - "records reviewed_by_user_id = X-User-ID and review_note"
      - "runs cluster_membership_recount on the winner then the loser and increments IdentityCluster.version by 1 on both"
      - "enforces the priority-18 segregation-of-duties rule against the pinned threshold generation's activated_by_user_id"
  - method: POST
    path: "/hie/match-links/{id}/unlink"
    description: "Compensating action: undo an AUTO_LINKED or LINKED merge, restoring the absorbed cluster and every re-pointed record."
    roles: [PrivacyOfficer]
    code: 200
    input: [expected_cluster_version, unlink_reason]
    output: MatchLink
    side_effects:
      - "moves AUTO_LINKED or LINKED -> UNLINKED and records unlink_reason"
      - "restores merged_away_cluster_id from MERGED_AWAY to ACTIVE and clears its merged_into_cluster_id"
      - "re-points every PatientRecord whose prior_cluster_id equals the restored cluster back to it and clears prior_cluster_id"
      - "runs cluster_membership_recount on both clusters, preserving SUM(member_record_count WHERE status == ACTIVE) == COUNT(PatientRecord WHERE match_state == CLUSTERED)"
      - "increments IdentityCluster.version by 1 on both clusters"
  # ---------------------------------------------------------------- consent directives
  - method: POST
    path: "/hie/identity-clusters/{id}/consent-directives"
    description: "Record a patient consent directive on an ACTIVE identity cluster. Directives are born ACTIVE and displace any earlier directive sharing the same (directive_type, scope, scoped_participant_id) triple."
    roles: [PrivacyOfficer]
    code: 201
    input: [directive_type, scope, expected_cluster_version, "restricted_categories?", "scoped_participant_id?", "effective_from?"]
    output: ConsentDirective
    side_effects:
      - "sets status = ACTIVE, policy_id = the ACTIVE ConsentPolicy governing the logical clock, recorded_by_user_id = X-User-ID, and effective_from defaulting to the logical clock when omitted"
      - "supersedes the incumbent directive with the same (directive_type, scope, scoped_participant_id) triple, setting the new row's supersedes_directive_id"
      - "increments IdentityCluster.version by 1 and refreshes active_directive_count and ConsentPolicy.directive_count"
  - method: POST
    path: "/hie/consent-directives/{id}/revocation"
    description: "Revoke an ACTIVE consent directive; revoked directives stop participating in disclosure decisions immediately."
    roles: [PrivacyOfficer]
    code: 200
    input: [revocation_reason]
    output: ConsentDirective
    side_effects:
      - "moves ACTIVE -> REVOKED and records revocation_reason"
      - "refreshes IdentityCluster.active_directive_count and increments IdentityCluster.version by 1"
  # ---------------------------------------------------------------- record locator and audit
  - method: POST
    path: "/hie/record-locator-queries"
    description: "Submit a record locator query. Resolves the identity cluster by match_score, evaluates consent_disclosure_decision, and writes one AccessAuditEntry per cluster member whether disclosed or withheld."
    roles: [Clinician, ParticipantAdmin, PublicHealthOfficer]
    code: 201
    input: [querying_participant_id, purpose_of_use, family_name, given_name, birth_date, "sex?", "ssn_last4?", "postal_code?", "phone_digits?", "break_glass_id?"]
    output: RecordLocatorQuery
    side_effects:
      - "records clinician_user_id = X-User-ID"
      - "runs consent_disclosure_decision, writing cluster_id, top_candidate_score, governing_policy_id, governing_directive_id, consent_decision, disclosed_record_count, withheld_record_count and withheld_categories"
      - "writes one immutable AccessAuditEntry per cluster member in created_at ASC order with action IN {DISCLOSED, WITHHELD, BREAK_GLASS_DISCLOSED} and suppression_reason where applicable"
      - "when a valid break_glass_id is cited, advances that session's disclosed_record_count and disclosed_sensitive_count"
  - method: POST
    path: "/hie/break-glass-accesses"
    description: "Open a break-the-glass emergency access session over one identity cluster; the session expires BREAK_GLASS_SESSION_MINUTES after opening and is barred by an active cooldown."
    roles: [Clinician]
    code: 201
    input: [cluster_id, invoking_participant_id, emergency_category, justification_text]
    output: BreakGlassAccess
    side_effects:
      - "sets session_status = OPEN, review_status = PENDING_REVIEW, invoking_clinician_user_id = X-User-ID, opened_at = logical clock, expires_at = opened_at + BREAK_GLASS_SESSION_MINUTES, disclosed_record_count = 0, disclosed_sensitive_count = 0, sanction_points_awarded = 0"
      - "runs the priority-19 closed-interval cooldown check over prior sessions for the same (cluster_id, invoking_clinician_user_id)"
  - method: POST
    path: "/hie/break-glass-accesses/{id}/closure"
    description: "Close an OPEN emergency session; the disclosure counters freeze at their current values."
    roles: [Clinician]
    code: 200
    input: []
    output: BreakGlassAccess
    side_effects: ["moves session_status OPEN -> CLOSED and increments version by 1"]
  - method: POST
    path: "/hie/break-glass-accesses/{id}/review-claim"
    description: "Claim a break-the-glass session for post-hoc privacy review."
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: BreakGlassAccess
    side_effects:
      - "moves review_status PENDING_REVIEW -> UNDER_REVIEW and records review_claimed_by_user_id = X-User-ID"
  - method: POST
    path: "/hie/break-glass-accesses/{id}/review-decision"
    description: "Adjudicate a claimed emergency session. outcome IN {JUSTIFIED, UNJUSTIFIED}; an UNJUSTIFIED finding awards sanction points and can cascade the invoking participant into suspension."
    roles: [PrivacyOfficer]
    code: 200
    input: [outcome, review_note]
    output: BreakGlassAccess
    side_effects:
      - "moves review_status UNDER_REVIEW -> JUSTIFIED or UNJUSTIFIED, records reviewer_user_id = X-User-ID, review_note and decided_at = logical clock"
      - "on UNJUSTIFIED, runs break_glass_sanction_points: writes sanction_points_awarded, recomputes Participant.sanction_points_active over the decay window, and fires cascade A links 2-4 (CERTIFIED -> SUSPENDED at the threshold, every MONITORED DataFeed -> SUSPENDED with status_reason = PARTICIPANT_SUSPENSION_CASCADE, then participant_quality_score re-run over the shrunken sample set rewriting quality_score and quality_grade); ACTIVE NotificationSubscriptions are suspended as a separate fan-out"
      - "increments Participant.version by 1 whenever the sanction sum changes"
  # ---------------------------------------------------------------- data feeds and quality
  - method: POST
    path: "/hie/participants/{id}/data-feeds"
    description: "Provision a data feed of one feed_type for a participant; provisioning a new generation retires the incumbent MONITORED feed of the same type."
    roles: [HieAdmin, ParticipantAdmin]
    code: 201
    input: [feed_type, expected_participant_version]
    output: DataFeed
    side_effects:
      - "sets status = PROVISIONING, sample_count = 0, latest_reject_rate = null, generation = 1 + the highest existing generation for the same (participant_id, feed_type)"
      - "retires the incumbent MONITORED feed of the same feed_type"
      - "increments Participant.version by 1"
  - method: POST
    path: "/hie/data-feeds/{id}/quality-samples"
    description: "Record one immutable measurement window on a data feed; the sample drives the feed's MONITORED/DEGRADED status and the participant's scorecard."
    roles: [HieAdmin]
    code: 201
    input: [period_start, period_end, messages_received, messages_rejected, required_fields_missing_count, duplicate_count, timeliness_p95_seconds]
    output: FeedQualitySample
    side_effects:
      - "computes reject_rate = round_half_up(messages_rejected / max(1, messages_received), 4) and increments DataFeed.sample_count"
      - "moves PROVISIONING -> MONITORED on the first accepted sample, then MONITORED <-> DEGRADED per FEED_DEGRADED_REJECT_RATE, writing DataFeed.latest_reject_rate"
      - "re-runs participant_quality_score over the qualifying window, rewriting Participant.quality_score and Participant.quality_grade and incrementing Participant.version by 1"
  - method: POST
    path: "/hie/data-feeds/{id}/status-transitions"
    description: "Operator control of a feed's lifecycle. action IN {SUSPEND, RESTORE}."
    roles: [HieAdmin]
    code: 200
    input: [action, "reason?"]
    output: DataFeed
    side_effects:
      - "drives the DataFeed transition selected by action and writes status_reason = reason"
      - "re-runs participant_quality_score, because the qualifying sample set only includes MONITORED and DEGRADED feeds"
  # ---------------------------------------------------------------- event notification subscriptions
  - method: POST
    path: "/hie/participants/{id}/notification-subscriptions"
    description: "Create an ADT event notification subscription. subscription_scope IN {PATIENT_PANEL, CLUSTER, PUBLIC_HEALTH_CONDUIT}; CLUSTER scope requires cluster_id and PUBLIC_HEALTH_CONDUIT requires org_type == PUBLIC_HEALTH."
    roles: [ParticipantAdmin, PublicHealthOfficer, HieAdmin]
    code: 201
    input: [subscription_scope, event_types, delivery_endpoint_url, "cluster_id?"]
    output: NotificationSubscription
    side_effects:
      - "sets status = PENDING_ACTIVATION and subscriber_participant_id from the path"
      - "runs the priority-22 conduit org-type check and the priority-27 scope/cluster_id coherence check"
  - method: POST
    path: "/hie/notification-subscriptions/{id}/lifecycle-transitions"
    description: "Multiplexed subscription lifecycle action. action IN {ACTIVATE, SUSPEND, REACTIVATE, TERMINATE}. ACTIVATE requires a PASSED ADT_PUBLISHER conformance run and no delinquent invoice."
    roles: [ParticipantAdmin, PublicHealthOfficer, HieAdmin]
    code: 200
    input: [action, "reason?"]
    output: NotificationSubscription
    side_effects:
      - "drives the NotificationSubscription transition selected by action"
      - "ACTIVATE records activating_conformance_test_id = the participant's strictly PASSED ADT_PUBLISHER run and increments Participant.active_subscription_count"
      - "SUSPEND and TERMINATE decrement Participant.active_subscription_count and write termination_reason = reason on TERMINATE"
  # ---------------------------------------------------------------- participation fees
  - method: POST
    path: "/hie/participants/{id}/participation-invoices"
    description: "Issue a participation-fee invoice for a fully elapsed billing period. basis_variant IN {PROVISIONAL, RECONCILED} selects the participation_fee variant."
    roles: [HieAdmin]
    code: 201
    input: [billing_period_start, billing_period_end, basis_variant, due_date]
    output: ParticipationInvoice
    side_effects:
      - "runs participation_fee in the selected variant, writing billable_volume_units, tier_charge_breakdown, volume_fee_cents, base_platform_fee_cents, quality_grade_snapshot, quality_multiplier and total_cents"
      - "sets status = ISSUED and amount_paid_cents = 0"
      - "increments Participant.outstanding_balance_cents by total_cents and Participant.version by 1"
  - method: POST
    path: "/hie/participation-invoices/{id}/payment"
    description: "Pay an ISSUED or DELINQUENT invoice in full; partial and over payments are refused."
    roles: [ParticipantAdmin, HieAdmin]
    code: 200
    input: [amount_paid_cents]
    output: ParticipationInvoice
    side_effects:
      - "moves ISSUED or DELINQUENT -> PAID, writing amount_paid_cents"
      - "decrements Participant.outstanding_balance_cents by total_cents and increments Participant.version by 1"
  - method: POST
    path: "/hie/participation-invoices/{id}/administrative-transitions"
    description: "Multiplexed invoice administration. action IN {DECLARE_DELINQUENT, WRITE_OFF, VOID}. VOID is the compensating action that restores the participant's outstanding balance exactly."
    roles: [HieAdmin]
    code: 200
    input: [action, "reason?"]
    output: ParticipationInvoice
    side_effects:
      - "drives the ParticipationInvoice transition selected by action and writes status_reason = reason"
      - "DECLARE_DELINQUENT leaves outstanding_balance_cents unchanged (DELINQUENT still counts toward the balance invariant)"
      - "WRITE_OFF and VOID decrement Participant.outstanding_balance_cents by total_cents, restoring the pre-issue value exactly"
      - "increments Participant.version by 1"
  # ---------------------------------------------------------------- test-driving endpoint
  - method: POST
    path: "/hie/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock lazily expires OPEN break-the-glass sessions and re-windows the quality and sanction-decay calculations."
    roles: [HieAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock used by every calculation, interval check and timestamp field"
      - "lazily expires any BreakGlassAccess whose expires_at is strictly before the new clock on the next read or write touching that row"
  # ---------------------------------------------------------------- reads: participants
  - method: GET
    path: "/hie/participants/{id}"
    description: "Fetch one participant with its live onboarding status, scorecard grade, sanction total and outstanding balance."
    roles: [HieAdmin, ParticipantAdmin, PrivacyOfficer, PublicHealthOfficer]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: GET
    path: "/hie/participants"
    description: "List participants, optionally filtered by onboarding status, organization type or fee tier."
    roles: [HieAdmin, PrivacyOfficer]
    code: 200
    input: ["onboarding_status?", "org_type?", "fee_tier?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/hie/participants/{id}/scorecard"
    description: "Computed read: the participant's data-quality scorecard, exposing every component of participant_quality_score including the provisional grade and the penalty points actually applied."
    roles: [HieAdmin, ParticipantAdmin, PrivacyOfficer]
    code: 200
    input: []
    output: "{ participant_id: string, window_start: string, window_end: string, samples_counted: integer, completeness_component: number, rejection_component: number, duplicate_component: number, timeliness_component: number, average_p95_seconds: number, base_quality_score: number, provisional_grade: string, penalty_points: integer, quality_score: number, grade: string }"
    side_effects: []
  - method: GET
    path: "/hie/participants/{id}/conformance-tests"
    description: "List every conformance run scheduled for one participant."
    roles: [HieAdmin, ParticipantAdmin]
    code: 200
    input: ["profile?", "status?"]
    output: ConformanceTest[]
    side_effects: []
  - method: GET
    path: "/hie/conformance-tests/{id}"
    description: "Fetch one conformance run with its pass rate, critical-failure flag and status."
    roles: [HieAdmin, ParticipantAdmin]
    code: 200
    input: []
    output: ConformanceTest
    side_effects: []
  # ---------------------------------------------------------------- reads: governance generations
  - method: GET
    path: "/hie/consent-policies/{id}"
    description: "Fetch one consent policy generation."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: []
    output: ConsentPolicy
    side_effects: []
  - method: GET
    path: "/hie/consent-policies"
    description: "List consent policy generations, optionally filtered by status or model."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: ["status?", "model?"]
    output: ConsentPolicy[]
    side_effects: []
  - method: GET
    path: "/hie/match-threshold-configs/{id}"
    description: "Fetch one matching threshold generation with its weights and bounds."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: []
    output: MatchThresholdConfig
    side_effects: []
  - method: GET
    path: "/hie/match-threshold-configs"
    description: "List matching threshold generations, optionally filtered by status or score variant mode."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: ["status?", "score_variant_mode?"]
    output: MatchThresholdConfig[]
    side_effects: []
  # ---------------------------------------------------------------- reads: index, clusters, links
  - method: GET
    path: "/hie/patient-records/{id}"
    description: "Fetch one contributed patient record with its current cluster, prior cluster and match state."
    roles: [HieAdmin, ParticipantAdmin, PrivacyOfficer]
    code: 200
    input: []
    output: PatientRecord
    side_effects: []
  - method: GET
    path: "/hie/patient-records"
    description: "List contributed patient records; filters cover the contributing participant, the current cluster and the pre-merge cluster."
    roles: [HieAdmin, ParticipantAdmin, PrivacyOfficer]
    code: 200
    input: ["participant_id?", "cluster_id?", "prior_cluster_id?", "match_state?", "source_mrn?"]
    output: PatientRecord[]
    side_effects: []
  - method: GET
    path: "/hie/identity-clusters/{id}"
    description: "Fetch one identity cluster with its membership counters and merge pointer."
    roles: [HieAdmin, PrivacyOfficer, Clinician]
    code: 200
    input: []
    output: IdentityCluster
    side_effects: []
  - method: GET
    path: "/hie/identity-clusters"
    description: "List identity clusters; filters cover the primary member record and the merge winner, so both cluster foreign keys are reverse-reachable."
    roles: [HieAdmin, PrivacyOfficer]
    code: 200
    input: ["primary_record_id?", "merged_into_cluster_id?", "status?"]
    output: IdentityCluster[]
    side_effects: []
  - method: GET
    path: "/hie/match-links/{id}"
    description: "Fetch one match link with its pinned threshold generation, score, variant and field agreement map."
    roles: [HieAdmin, PrivacyOfficer]
    code: 200
    input: []
    output: MatchLink
    side_effects: []
  - method: GET
    path: "/hie/match-links"
    description: "List match links; filters cover both scored records, the pinned threshold generation, the winner cluster and the absorbed cluster."
    roles: [HieAdmin, PrivacyOfficer]
    code: 200
    input: ["left_record_id?", "right_record_id?", "threshold_config_id?", "cluster_id?", "merged_away_cluster_id?", "status?"]
    output: MatchLink[]
    side_effects: []
  # ---------------------------------------------------------------- reads: consent directives
  - method: GET
    path: "/hie/consent-directives/{id}"
    description: "Fetch one consent directive."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: []
    output: ConsentDirective
    side_effects: []
  - method: GET
    path: "/hie/consent-directives"
    description: "List consent directives; filters cover the governed cluster, the governing policy, the scoped participant and the displaced predecessor."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: ["cluster_id?", "policy_id?", "scoped_participant_id?", "supersedes_directive_id?", "status?", "directive_type?"]
    output: ConsentDirective[]
    side_effects: []
  # ---------------------------------------------------------------- reads: queries and audit
  - method: GET
    path: "/hie/record-locator-queries/{id}"
    description: "Fetch one record locator query with its consent decision and disclosure counters."
    roles: [PrivacyOfficer, HieAdmin, ParticipantAdmin]
    code: 200
    input: []
    output: RecordLocatorQuery
    side_effects: []
  - method: GET
    path: "/hie/record-locator-queries"
    description: "List record locator queries; filters cover the querying participant, the resolved cluster, the cited emergency session, the governing policy and the governing directive."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: ["querying_participant_id?", "cluster_id?", "break_glass_id?", "governing_policy_id?", "governing_directive_id?", "consent_decision?"]
    output: RecordLocatorQuery[]
    side_effects: []
  - method: GET
    path: "/hie/access-audit-entries/{id}"
    description: "Fetch one immutable access audit entry."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: []
    output: AccessAuditEntry
    side_effects: []
  - method: GET
    path: "/hie/access-audit-entries"
    description: "List access audit entries; filters cover the originating query, the audited record and the disclosing participant. This is the only discovery channel for audit rows, which are never returned by a write response."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: ["query_id?", "record_id?", "disclosing_participant_id?", "action?"]
    output: AccessAuditEntry[]
    side_effects: []
  # ---------------------------------------------------------------- reads: break-the-glass
  - method: GET
    path: "/hie/break-glass-accesses/{id}"
    description: "Fetch one break-the-glass session with both state dimensions, its disclosure counters and its awarded sanction points."
    roles: [PrivacyOfficer, HieAdmin, Clinician]
    code: 200
    input: []
    output: BreakGlassAccess
    side_effects: []
  - method: GET
    path: "/hie/break-glass-accesses"
    description: "List break-the-glass sessions; filters cover the covered cluster and the invoking participant."
    roles: [PrivacyOfficer, HieAdmin]
    code: 200
    input: ["cluster_id?", "invoking_participant_id?", "session_status?", "review_status?"]
    output: BreakGlassAccess[]
    side_effects: []
  # ---------------------------------------------------------------- reads: subscriptions
  - method: GET
    path: "/hie/notification-subscriptions/{id}"
    description: "Fetch one event notification subscription."
    roles: [HieAdmin, ParticipantAdmin, PublicHealthOfficer, PrivacyOfficer]
    code: 200
    input: []
    output: NotificationSubscription
    side_effects: []
  - method: GET
    path: "/hie/notification-subscriptions"
    description: "List event notification subscriptions; filters cover the subscribing participant, the scoped cluster and the conformance run that unlocked activation."
    roles: [HieAdmin, ParticipantAdmin, PublicHealthOfficer, PrivacyOfficer]
    code: 200
    input: ["subscriber_participant_id?", "cluster_id?", "activating_conformance_test_id?", "status?", "subscription_scope?"]
    output: NotificationSubscription[]
    side_effects: []
  # ---------------------------------------------------------------- reads: feeds, samples, invoices
  - method: GET
    path: "/hie/data-feeds/{id}"
    description: "Fetch one data feed with its generation, status and latest reject rate."
    roles: [HieAdmin, ParticipantAdmin]
    code: 200
    input: []
    output: DataFeed
    side_effects: []
  - method: GET
    path: "/hie/participants/{id}/data-feeds"
    description: "List every data feed provisioned for one participant, including retired generations."
    roles: [HieAdmin, ParticipantAdmin]
    code: 200
    input: ["feed_type?", "status?"]
    output: DataFeed[]
    side_effects: []
  - method: GET
    path: "/hie/data-feeds/{id}/quality-samples"
    description: "List the immutable measurement windows recorded on one data feed."
    roles: [HieAdmin, ParticipantAdmin]
    code: 200
    input: []
    output: FeedQualitySample[]
    side_effects: []
  - method: GET
    path: "/hie/participation-invoices/{id}"
    description: "Fetch one participation invoice with its tier breakdown and quality multiplier snapshot."
    roles: [HieAdmin, ParticipantAdmin]
    code: 200
    input: []
    output: ParticipationInvoice
    side_effects: []
  - method: GET
    path: "/hie/participants/{id}/participation-invoices"
    description: "List every participation invoice issued to one participant."
    roles: [HieAdmin, ParticipantAdmin]
    code: 200
    input: ["status?", "basis_variant?"]
    output: ParticipationInvoice[]
    side_effects: []

errors:
  # ---- authentication and authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header is absent or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is unknown or is not listed in the endpoint's roles"
  - id: ERR_ACTION_NOT_PERMITTED_FOR_ROLE
    http: 403
    condition: "the caller's role may use the multiplexed action endpoint but not the specific action value requested"
  - id: ERR_PARTICIPANT_SCOPE_VIOLATION
    http: 403
    condition: "an entity_backed caller's X-User-ID does not match the participant that owns the addressed resource or that the payload names"
  - id: ERR_PURPOSE_NOT_PERMITTED_FOR_ROLE
    http: 403
    condition: "the submitted purpose_of_use is outside the set permitted for the caller's role"
  - id: ERR_SOD_CERTIFIER_IS_SIGNATORY
    http: 403
    condition: "the administrator certifying a participant is the same user who executed its participation agreement"
  - id: ERR_SOD_STEWARD_IS_TUNER
    http: 403
    condition: "the steward adjudicating a match link is the same user who activated the threshold generation pinned to that link"
  - id: ERR_REVIEW_NOT_CLAIMED_BY_ACTOR
    http: 403
    condition: "a break-the-glass review action is attempted by someone other than the user who claimed the review"
  # ---- schema ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, a type is wrong, an enum value is unknown, a numeric field is out of range, or an interval's start is not strictly before its end"
  # ---- not found ----
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "the referenced participant id does not exist"
  - id: ERR_CONFORMANCE_TEST_NOT_FOUND
    http: 404
    condition: "the referenced conformance run id does not exist"
  - id: ERR_CONSENT_POLICY_NOT_FOUND
    http: 404
    condition: "the referenced consent policy id does not exist"
  - id: ERR_THRESHOLD_CONFIG_NOT_FOUND
    http: 404
    condition: "the referenced matching threshold generation id does not exist"
  - id: ERR_PATIENT_RECORD_NOT_FOUND
    http: 404
    condition: "the referenced patient record id does not exist"
  - id: ERR_CLUSTER_NOT_FOUND
    http: 404
    condition: "the referenced identity cluster id does not exist"
  - id: ERR_MATCH_LINK_NOT_FOUND
    http: 404
    condition: "the referenced match link id does not exist"
  - id: ERR_DIRECTIVE_NOT_FOUND
    http: 404
    condition: "the referenced consent directive id does not exist"
  - id: ERR_QUERY_NOT_FOUND
    http: 404
    condition: "the referenced record locator query id does not exist"
  - id: ERR_AUDIT_ENTRY_NOT_FOUND
    http: 404
    condition: "the referenced access audit entry id does not exist"
  - id: ERR_BREAK_GLASS_NOT_FOUND
    http: 404
    condition: "the referenced break-the-glass session id does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "the referenced notification subscription id does not exist"
  - id: ERR_DATA_FEED_NOT_FOUND
    http: 404
    condition: "the referenced data feed id does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "the referenced participation invoice id does not exist"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_CLUSTER_VERSION
    http: 412
    condition: "expected_cluster_version does not equal the addressed identity cluster's current version"
  - id: ERR_STALE_PARTICIPANT_VERSION
    http: 412
    condition: "expected_participant_version does not equal the addressed participant's current version"
  # ---- state machine ----
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not an outgoing transition of the entity's current state, or a declared precondition of that transition has no error id of its own (for example DECLARE_DELINQUENT before the invoice's due_date)"
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "the addressed entity is already in a terminal state"
  # ---- cross-entity and governance ----
  - id: ERR_PARTICIPANT_NOT_CERTIFIED
    http: 409
    condition: "the operation requires a CERTIFIED participant and the participant is in another onboarding status"
  - id: ERR_PARTICIPANT_NOT_ONBOARDED_FOR_DATA
    http: 409
    condition: "a patient record is contributed by a participant that has not reached CONFORMANCE_TESTING, or an invoice is issued before the participation agreement was executed"
  - id: ERR_CERTIFICATION_PROFILES_INCOMPLETE
    http: 409
    condition: "certification is attempted while at least one profile in REQUIRED_CERTIFICATION_PROFILES lacks a PASSED or WAIVED run"
  - id: ERR_CONFORMANCE_PROFILE_ALREADY_PASSED
    http: 409
    condition: "a conformance run is scheduled for a profile that already has a PASSED run for the same participant"
  - id: ERR_QUERY_FEED_NOT_OPERATIONAL
    http: 409
    condition: "the querying participant has no CCDA data feed in MONITORED or DEGRADED status"
  - id: ERR_CLUSTER_MERGED_AWAY
    http: 409
    condition: "the addressed identity cluster has been absorbed by a merge and is no longer ACTIVE"
  - id: ERR_NO_ACTIVE_CONSENT_POLICY
    http: 409
    condition: "no consent policy generation is ACTIVE and covering the logical clock"
  - id: ERR_NO_ACTIVE_THRESHOLD_CONFIG
    http: 409
    condition: "no matching threshold generation is ACTIVE, so no score can be computed"
  - id: ERR_SUBSCRIPTION_CONFORMANCE_MISSING
    http: 409
    condition: "subscription activation is attempted without a strictly PASSED ADT_PUBLISHER conformance run for the owning participant (a WAIVED run does not satisfy this gate)"
  - id: ERR_BREAK_GLASS_SESSION_NOT_OPEN
    http: 409
    condition: "the cited or addressed break-the-glass session is not OPEN, has expired, covers a different cluster, or belongs to a different clinician"
  - id: ERR_BREAK_GLASS_COOLDOWN_ACTIVE
    http: 409
    condition: "a prior session for the same cluster and clinician is still inside its closed [opened_at, expires_at + cooldown] interval"
  - id: ERR_CONSENT_POLICY_INTERVAL_OVERLAP
    http: 409
    condition: "the submitted policy's half-open effective interval overlaps a DRAFT or ACTIVE generation's interval"
  - id: ERR_DUPLICATE_SOURCE_MRN
    http: 409
    condition: "the contributing participant already has a patient record with this source_mrn"
  - id: ERR_INVOICE_PERIOD_OVERLAP
    http: 409
    condition: "the submitted billing period overlaps a non-VOID invoice for the same participant"
  - id: ERR_NO_RECONCILIATION_BASIS
    http: 409
    condition: "a RECONCILED invoice is requested but no qualifying quality sample falls inside the billing period"
  # ---- fiscal ----
  - id: ERR_PARTICIPATION_FEE_DELINQUENT
    http: 402
    condition: "the participant holds a DELINQUENT participation invoice, which blocks subscription activation and new feed provisioning"
  # ---- business constraints ----
  - id: ERR_CONDUIT_ORG_TYPE_INVALID
    http: 422
    condition: "a PUBLIC_HEALTH_CONDUIT subscription is requested for a participant whose org_type is not PUBLIC_HEALTH"
  - id: ERR_SUBSCRIPTION_SCOPE_MISMATCH
    http: 422
    condition: "subscription_scope and cluster_id disagree - CLUSTER scope without a cluster_id, or a non-CLUSTER scope with one"
  - id: ERR_DIRECTIVE_SCOPE_PARTICIPANT_REQUIRED
    http: 422
    condition: "a directive's scope and scoped_participant_id disagree, or a SENSITIVE_CATEGORY_RESTRICTION carries no restricted_categories"
  - id: ERR_JUSTIFICATION_TOO_SHORT
    http: 422
    condition: "an emergency justification or an UNJUSTIFIED review note is shorter than BREAK_GLASS_JUSTIFICATION_MIN_CHARS after trimming"
  - id: ERR_QUALITY_SAMPLE_INVALID
    http: 422
    condition: "a quality sample's counts exceed messages_received or its window overlaps an existing sample on the same feed"
  - id: ERR_THRESHOLD_CONFIG_INVALID
    http: 422
    condition: "the six weights do not sum to 1.0000 within tolerance, auto_link_threshold is not strictly above review_lower_bound, or partial_credit_factor is outside the open unit interval"
  - id: ERR_INVOICE_PERIOD_NOT_ELAPSED
    http: 422
    condition: "the billing period ends after the logical clock"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "the submitted payment does not settle the invoice's remaining balance exactly"

roles:
  - name: HieAdmin
    description: "Statewide exchange operator: onboards participants, executes agreements, certifies, suspends, runs conformance testing, administers feeds and issues participation invoices."
    identity: "opaque"
    exclusive_operations:
      - "POST /hie/participants"
      - "POST /hie/participants/{id}/onboarding-transitions with action IN {EXECUTE_AGREEMENT, CERTIFY, REMEDIATE, SUSPEND, REINSTATE, TERMINATE}"
      - "POST /hie/conformance-tests/{id}/results"
      - "POST /hie/conformance-tests/{id}/waiver"
      - "POST /hie/data-feeds/{id}/quality-samples"
      - "POST /hie/data-feeds/{id}/status-transitions"
      - "POST /hie/participants/{id}/participation-invoices"
      - "POST /hie/participation-invoices/{id}/administrative-transitions"
      - "POST /hie/_clock/set_current_utc"
    shared_operations:
      - "POST /hie/participants/{id}/conformance-tests"
      - "POST /hie/participants/{id}/patient-records"
      - "POST /hie/participants/{id}/data-feeds"
      - "POST /hie/participants/{id}/notification-subscriptions"
      - "POST /hie/notification-subscriptions/{id}/lifecycle-transitions"
      - "POST /hie/match-links/{id}/steward-decision"
      - "POST /hie/participation-invoices/{id}/payment"
      - "all GET endpoints except GET /hie/participants/{id}/scorecard restricted reads"
  - name: ParticipantAdmin
    description: "Administrator acting for one participant organization: applies for legal review, contributes patient records, provisions feeds, manages its own subscriptions and pays its invoices. X-User-ID is that participant's id."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /hie/participants/{id}/onboarding-transitions with action IN {SUBMIT_FOR_LEGAL_REVIEW, RESUME_CONFORMANCE, WITHDRAW}"
    shared_operations:
      - "POST /hie/participants/{id}/conformance-tests"
      - "POST /hie/participants/{id}/patient-records"
      - "POST /hie/participants/{id}/data-feeds"
      - "POST /hie/participants/{id}/notification-subscriptions"
      - "POST /hie/notification-subscriptions/{id}/lifecycle-transitions"
      - "POST /hie/record-locator-queries with purpose_of_use IN {PAYMENT, OPERATIONS}"
      - "POST /hie/participation-invoices/{id}/payment"
      - "GET /hie/participants/{id}, GET /hie/participants/{id}/scorecard and the participant's own sub-resource lists"
  - name: Clinician
    description: "Treating clinician who submits record locator queries for TREATMENT and invokes break-the-glass emergency access. X-User-ID is an operator identifier recorded on queries and sessions."
    identity: "opaque"
    exclusive_operations:
      - "POST /hie/break-glass-accesses"
      - "POST /hie/break-glass-accesses/{id}/closure"
    shared_operations:
      - "POST /hie/record-locator-queries with purpose_of_use == TREATMENT"
      - "GET /hie/identity-clusters/{id}"
      - "GET /hie/break-glass-accesses/{id}"
  - name: PrivacyOfficer
    description: "Statewide privacy authority: administers consent policy generations and matching thresholds, adjudicates match links, records and revokes patient directives, and performs post-hoc review of emergency access."
    identity: "opaque"
    exclusive_operations:
      - "POST /hie/consent-policies"
      - "POST /hie/consent-policies/{id}/activation"
      - "POST /hie/match-threshold-configs"
      - "POST /hie/match-threshold-configs/{id}/activation"
      - "POST /hie/identity-clusters/{id}/consent-directives"
      - "POST /hie/consent-directives/{id}/revocation"
      - "POST /hie/match-links/{id}/unlink"
      - "POST /hie/match-links/{id}/steward-decision with decision == REOPEN"
      - "POST /hie/break-glass-accesses/{id}/review-claim"
      - "POST /hie/break-glass-accesses/{id}/review-decision"
    shared_operations:
      - "POST /hie/match-links/{id}/steward-decision with decision IN {CONFIRM, REJECT}"
      - "GET /hie/participants, GET /hie/patient-records, GET /hie/identity-clusters, GET /hie/match-links, GET /hie/consent-directives, GET /hie/record-locator-queries, GET /hie/break-glass-accesses"
      - "GET /hie/access-audit-entries and GET /hie/access-audit-entries/{id}, shared with HieAdmin as the operator of record for the statewide audit log"
  - name: PublicHealthOfficer
    description: "Officer of a PUBLIC_HEALTH participant using the public health reporting conduit: queries with purpose_of_use PUBLIC_HEALTH and manages that participant's conduit subscriptions. X-User-ID is that participant's id."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /hie/record-locator-queries with purpose_of_use == PUBLIC_HEALTH"
    shared_operations:
      - "POST /hie/participants/{id}/notification-subscriptions with subscription_scope == PUBLIC_HEALTH_CONDUIT"
      - "POST /hie/notification-subscriptions/{id}/lifecycle-transitions"
      - "GET /hie/participants/{id}"
      - "GET /hie/notification-subscriptions and GET /hie/notification-subscriptions/{id}"
