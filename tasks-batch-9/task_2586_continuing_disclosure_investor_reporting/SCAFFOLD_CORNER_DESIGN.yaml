        excluded_because:
          difficulty_instance: filing_submission_gated_on_engagement_status_with_calendar_ack_as_the_cure
          rationale: >-
            That difficulty instance already runs the full conditional-action matrix for submit —
            refused while the engagement is SUSPENDED, permitted after the calendar acknowledgement
            restores it to ACTIVE, with the identical payload both times.

      - name: official_statement_links_disclosed_event_ids
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/disclosure/official-statements
          - calculations.official_statement_disclosure_lookback
        excluded_because:
          difficulty_instance: official_statement_lookback_strict_five_year_vs_remediated_excluded
          rationale: >-
            The link between an OfficialStatement and the FailureToFileEvent ids it discloses is
