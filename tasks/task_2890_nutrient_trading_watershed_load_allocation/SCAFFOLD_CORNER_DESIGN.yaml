          setup:
            - "Watershed SCR is ACTIVE via APPROVED TMDL-P-2026 with the PRO_RATA run (City WWTP 21888.00, Village WWTP 5472.00); ratios are retirement 0.1000, uncertainty 2.0000, equivalence 1.0000."
