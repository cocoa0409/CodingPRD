              as: LogisticsCoordinator
              captures: { origin_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-2", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { dest_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets/{id}/opening-balance"
              payload: { opening_balance_tons: 5000 }
              as: LogisticsCoordinator
              captures: { origin_ver: $.data.version }
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", shipment_code: "SH-1", mode: "TRUCK", tons: 20, distance_miles: 50, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-06T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { shipment_id: $.data.id }
            - call: "POST /nitrogen-ops/shipments/{id}/book"
              payload: { expected_origin_asset_version: "${origin_ver}" }
              as: LogisticsCoordinator
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/shipments/{id}/depart"
              payload: {}
              as: LogisticsCoordinator
