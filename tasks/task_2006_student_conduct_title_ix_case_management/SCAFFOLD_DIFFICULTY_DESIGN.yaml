              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { d2_id: $.data.id }
          assert:
            - "overlap attempt (from 2026-08-09T23:59:59Z, 1s inside D1's window) rejected: ERR_DIRECTIVE_WINDOW_OVERLAP"
            - "adjacent attempt (from exactly D1.effective_to 2026-08-10T00:00:00Z, gap == 0) accepted: NoContactDirective.${d2_id}.status == ACTIVE"
