              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
          assert:
            - "the first report returns HTTP 200 with active_minutes_total == 45, session_count == 3, last_activity_date == '2026-09-10' and seat_status flipped RESERVED -> ACTIVE"
            - "the back-dated second report returns HTTP 200 with active_minutes_total == 65 and session_count == 4"
            - "last_activity_date is still '2026-09-10' — the field tracks the maximum activity_date, not the write order"
            - "the final read shows identity_status still PENDING_PROVISION and password_state TEMP_SET: telemetry never touches the identity axis"
