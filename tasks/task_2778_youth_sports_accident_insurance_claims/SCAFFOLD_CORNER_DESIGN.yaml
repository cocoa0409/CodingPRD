            - "trigger call 2 returns HTTP 422 with data.error_id == ERR_MINIMUM_PARTICIPANTS_NOT_MET, since [2027-03-01, 2028-03-01) merely abuts policy 1's half-open term"
            - "LeaguePolicy.${pol2_id}.status == QUOTED and LeaguePolicy.${pol3_id}.status == QUOTED, both still at version 1"

      - name: two_rules_violated_at_once_returns_the_higher_priority_error
        claim_type: priority_ordering
