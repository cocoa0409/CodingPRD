# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Airport Snow & Airfield Operations
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: snow_event_create_applies_server_defaults
        claim_type: defaults
        grounds: [entities.SnowEvent.fields.status, entities.SnowEvent.fields.closure_status, entities.SnowEvent.fields.estimated_cost_cents]
        distinguishing_aspect: "A freshly created SnowEvent starts FORECAST / closure_status NONE / airline_acknowledged false / cost and chemical counters 0 / version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /snow-events", payload: { event_code: "SNOW-D1", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { st: $.data.status, cl: $.data.closure_status, ack: $.data.airline_acknowledged, est: $.data.estimated_cost_cents, act: $.data.actual_cost_cents, chem: $.data.chemical_used_lbs, ver: $.data.version } }
          trigger: []
          assert:
            - "st == FORECAST and cl == NONE and ack == false"
            - "est == 0 and act == 0 and chem == 0 and ver == 1"

      - name: snow_event_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.SnowEvent.fields.event_code, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field event_code yields ERR_VALIDATION 400 and nothing is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /snow-events", payload: { season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION and http == 400"
            - "GET /snow-events returns total_count == 0"

      - name: surface_create_with_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.AirfieldSurface.fields.surface_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "surface_type HELIPAD is outside the declared enum {RUNWAY, TAXIWAY, APRON} and is rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /airfield-surfaces", payload: { surface_code: "HEL-01", surface_type: "HELIPAD", length_ft: 100, width_ft: 100, priority_rank: 9 }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION and http == 400"

      - name: surface_area_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.AirfieldSurface.fields.area_sqft]
        distinguishing_aspect: "area_sqft is computed as length_ft x width_ft; a client-supplied area_sqft is ignored and the computed 750000 is returned."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1, area_sqft: 1 }, as: SystemAdmin, captures: { area: $.data.area_sqft } }
          assert:
            - "area == 750000  (5000 x 150; the supplied 1 is ignored)"

      - name: system_fields_input_ignored_on_create
        claim_type: system_fields
        grounds: [entities.SnowEvent]
        distinguishing_aspect: "Client-supplied id and version are ignored: server mints a UUID id and starts version at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /snow-events", payload: { event_code: "SNOW-D2", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000, id: "00000000-0000-0000-0000-000000000000", version: 99 }, as: OpsController, captures: { new_id: $.data.id, ver: $.data.version } }
          assert:
            - "new_id != '00000000-0000-0000-0000-000000000000'  (server-minted UUID)"
            - "ver == 1  (client-supplied 99 ignored)"

      - name: snow_event_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent SnowEvent id returns ERR_EVENT_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /snow-events/00000000-0000-0000-0000-000000000000", as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_NOT_FOUND and http == 404"

      - name: surface_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SURFACE_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent AirfieldSurface id returns ERR_SURFACE_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /airfield-surfaces/00000000-0000-0000-0000-000000000000", as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SURFACE_NOT_FOUND and http == 404"

      - name: report_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent ConditionReport id returns ERR_REPORT_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /condition-reports/00000000-0000-0000-0000-000000000000", as: AirfieldInspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REPORT_NOT_FOUND and http == 404"

      - name: assessment_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ASSESSMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent FrictionAssessment id returns ERR_ASSESSMENT_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /friction-assessments/00000000-0000-0000-0000-000000000000", as: AirfieldInspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ASSESSMENT_NOT_FOUND and http == 404"

      - name: notam_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOTAM_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent Notam id returns ERR_NOTAM_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /notams/00000000-0000-0000-0000-000000000000", as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOTAM_NOT_FOUND and http == 404"

      - name: product_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent ChemicalProduct id returns ERR_PRODUCT_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /chemical-products/00000000-0000-0000-0000-000000000000", as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PRODUCT_NOT_FOUND and http == 404"

      - name: application_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent ChemicalApplication id returns ERR_APPLICATION_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /chemical-applications/00000000-0000-0000-0000-000000000000", as: MaintenanceLead, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_APPLICATION_NOT_FOUND and http == 404"

      - name: shift_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SHIFT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent OperatorShift id returns ERR_SHIFT_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /operator-shifts/00000000-0000-0000-0000-000000000000", as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SHIFT_NOT_FOUND and http == 404"

      - name: shift_create_with_unknown_equipment_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.OperatorShift.fields.equipment_unit_id, "errors[ERR_EQUIPMENT_NOT_FOUND]"]
        distinguishing_aspect: "Body FK equipment_unit_id referencing a non-existent unit is rejected with ERR_EQUIPMENT_NOT_FOUND 404."
        test_recipe:
          setup:
            - "3 READY equipment units; SnowEvent SNOW-EQ ACTIVATED"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-EQ", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-X", event_id: "${ev}", equipment_unit_id: "00000000-0000-0000-0000-000000000000", base_rate_cents_per_hour: 5000, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T12:00:00Z" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EQUIPMENT_NOT_FOUND and http == 404"

      - name: surface_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more; defaults are limit 10 / offset 0."
        test_recipe:
          setup: ["two surfaces registered"]
          setup_api_calls:
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09R", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 2 }, as: SystemAdmin }
          trigger:
            - { call: "GET /airfield-surfaces", payload: { limit: 1 }, as: SystemAdmin, captures: { first_code: "$.data[0].surface_code" } }
          assert:
            - "first_code == 'RWY-09L'  (deterministic order by created_at ASC)"
            - "pagination block reports limit == 1, total_count == 2, has_more == true"
            - "a second call with { limit: 1, offset: 1 } returns 'RWY-09R' with has_more == false"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: event_close_from_forecast_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SnowEvent.status, "errors[ERR_INVALID_EVENT_STATE]"]
        distinguishing_aspect: "CLOSE is not a legal transition from FORECAST; the event remains FORECAST."
        test_recipe:
          setup: ["SnowEvent SNOW-C1 in FORECAST (never activated)"]
          setup_api_calls:
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C1", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "CLOSE" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_EVENT_STATE and http == 409"
            - "GET /snow-events/${ev}.status == FORECAST"

      - name: event_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SnowEvent.status]
        distinguishing_aspect: "CLOSED is terminal: any further event-action is rejected with ERR_INVALID_EVENT_STATE."
        test_recipe:
          setup:
            - "3 READY equipment units; SnowEvent SNOW-C2 driven ACTIVATED -> STANDING_DOWN -> CLOSED (no surfaces, so STAND_DOWN's all-OPEN precondition is vacuously satisfied; no NOTAMs exist)"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C2", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "STAND_DOWN" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "CLOSE" }, as: OpsController, captures: { st_final: $.data.status } }
          trigger:
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ESCALATE" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "st_final == CLOSED"
            - "err == ERR_INVALID_EVENT_STATE and http == 409"
            - "GET /snow-events/${ev}.status == CLOSED  (terminal lockdown)"

      - name: activate_with_readiness_shortfall_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=14]", "errors[ERR_EQUIPMENT_READINESS_SHORTFALL]"]
        distinguishing_aspect: "ACTIVATE with only 2 READY units (constant requires >= 3) is rejected; the event stays FORECAST."
        test_recipe:
          setup: ["exactly 2 READY equipment units"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C3", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EQUIPMENT_READINESS_SHORTFALL and http == 409"
            - "GET /snow-events/${ev}.status == FORECAST and activated_at == null"

      - name: activate_side_effect_sets_activated_at
        claim_type: side_effect_execution
        grounds: [state_machines.SnowEvent.status, entities.SnowEvent.fields.activated_at]
        distinguishing_aspect: "Successful ACTIVATE stamps activated_at with the logical clock time (2026-08-01T00:00:00Z default)."
        test_recipe:
          setup: ["3 READY equipment units"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C4", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController, captures: { st: $.data.status, at: $.data.activated_at } }
          assert:
            - "st == ACTIVATED"
            - "at == '2026-08-01T00:00:00Z'  (logical clock default; no wall-clock fallback)"

      - name: stand_down_blocked_by_uncleared_surface_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=15]", "errors[ERR_SURFACE_NOT_CLEARED]"]
        distinguishing_aspect: "STAND_DOWN while one surface is RESTRICTED is rejected; surfaces must all be OPEN first."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L RESTRICTED; SnowEvent SNOW-C5 ACTIVATED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C5", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController }
          trigger:
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "STAND_DOWN" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SURFACE_NOT_CLEARED and http == 409"
            - "GET /snow-events/${ev}.status == ACTIVATED"

      - name: event_close_blocked_by_active_notam_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=16]", "errors[ERR_ACTIVE_NOTAMS_REMAIN]"]
        distinguishing_aspect: "CLOSE while one NOTAM on the event is still ISSUED is rejected; rescission must come first."
        test_recipe:
          setup:
            - "3 READY units; surface RWY-09L cycled RESTRICTED -> (friction GOOD) -> CLEAR back to OPEN"
            - "NOTAM N1 ISSUED (SURFACE_CONDITION, sourced from the GOOD assessment); SnowEvent SNOW-C6 STANDING_DOWN"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C6", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController, captures: { sv_r: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.60, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_r}" }, as: AirfieldInspector, captures: { fa1: $.data.id } }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "SURFACE_CONDITION", effective_from: "2026-08-02T00:00:00Z", effective_until: "2026-08-03T00:00:00Z", message: "RWY 09L wet snow", source_assessment_id: "${fa1}" }, as: OpsController, captures: { n1: $.data.id } }
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "ISSUE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "CLEAR", event_id: "${ev}" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "STAND_DOWN" }, as: OpsController, captures: { st_sd: $.data.status } }
          trigger:
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "CLOSE" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "st_sd == STANDING_DOWN  (all surfaces OPEN satisfied the stand-down gate)"
            - "err == ERR_ACTIVE_NOTAMS_REMAIN and http == 409"
            - "GET /snow-events/${ev}.status == STANDING_DOWN"

      - name: notam_rescind_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Notam, "errors[ERR_INVALID_NOTAM_STATE]"]
        distinguishing_aspect: "RESCIND is only legal from ISSUED or REISSUE_REQUIRED; from DRAFT it fails with ERR_INVALID_NOTAM_STATE."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L; SnowEvent SNOW-C7 ACTIVATED; NOTAM N1 in DRAFT"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C7", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "RUNWAY_CLOSURE", effective_from: "2026-08-10T00:00:00Z", effective_until: "2026-08-11T00:00:00Z", message: "planned closure" }, as: OpsController, captures: { n1: $.data.id } }
          trigger:
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "RESCIND" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_NOTAM_STATE and http == 409"
            - "GET /notams/${n1}.status == DRAFT"

      - name: notam_rescind_requires_open_surface_rejected
        claim_type: guarded_transition
        grounds: [state_machines.Notam.ISSUED_to_RESCINDED, "errors[ERR_INVALID_SURFACE_STATE]"]
        distinguishing_aspect: "RESCIND of an ISSUED notam while its surface is still RESTRICTED (not OPEN) is rejected — the guard crosses from Notam to AirfieldSurface state."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L RESTRICTED; SnowEvent SNOW-C8 ACTIVATED; friction GOOD; NOTAM N1 ISSUED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C8", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController, captures: { sv_r: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.60, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_r}" }, as: AirfieldInspector, captures: { fa1: $.data.id } }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "SURFACE_CONDITION", effective_from: "2026-08-02T00:00:00Z", effective_until: "2026-08-03T00:00:00Z", message: "wet snow", source_assessment_id: "${fa1}" }, as: OpsController, captures: { n1: $.data.id } }
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "ISSUE" }, as: OpsController, captures: { st_i: $.data.status } }
          trigger:
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "RESCIND" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "st_i == ISSUED"
            - "err == ERR_INVALID_SURFACE_STATE and http == 409  (surface still RESTRICTED, not OPEN)"
            - "GET /notams/${n1}.status == ISSUED"

      - name: shift_complete_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.OperatorShift, "errors[ERR_INVALID_SHIFT_STATE]"]
        distinguishing_aspect: "COMPLETE is only legal from SCHEDULED; a second COMPLETE on the COMPLETED shift fails."
        test_recipe:
          setup: ["3 READY units; SnowEvent SNOW-C9 ACTIVATED; shift OP-Z SCHEDULED then COMPLETED with worked_hours 8"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C9", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-Z", event_id: "${ev}", base_rate_cents_per_hour: 5000, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }, as: OpsController, captures: { sh1: $.data.id } }
            - { call: "POST /operator-shifts/${sh1}/shift-actions", payload: { action: "COMPLETE", worked_hours: 8 }, as: OpsController, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /operator-shifts/${sh1}/shift-actions", payload: { action: "COMPLETE", worked_hours: 8 }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "st1 == COMPLETED"
            - "err == ERR_INVALID_SHIFT_STATE and http == 409"

      - name: application_dispense_before_authorize_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ChemicalApplication, "errors[ERR_INVALID_APPLICATION_STATE]"]
        distinguishing_aspect: "DISPENSE from PROPOSED (skipping AUTHORIZE) fails with ERR_INVALID_APPLICATION_STATE; the state check fires before any segregation-of-duties check."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L; product NAAC-01; SnowEvent SNOW-C10 ACTIVATED; application PROPOSED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "NAAC-01", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 12, seasonal_limit_lbs: 100000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C10", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 50000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { app1: $.data.id } }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "DISPENSE" }, as: MaintenanceLead, as_user_id: "ml-dispenser-2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_APPLICATION_STATE and http == 409"
            - "GET /chemical-applications/${app1}.status == PROPOSED"

      - name: reopen_blocked_by_poor_friction_rejected
        claim_type: guarded_transition
        grounds: [state_machines.AirfieldSurface.status, "validations[priority=10]", "errors[ERR_REOPEN_FRICTION_TOO_LOW]"]
        distinguishing_aspect: "CLOSED -> RESTRICTED (REOPEN) is guarded by the latest REPORTED FrictionAssessment; with mu 0.20 (POOR) the guard rejects with ERR_REOPEN_FRICTION_TOO_LOW."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L CLOSED; SnowEvent SNOW-C11 ACTIVATED; latest friction mu 0.20"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C11", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "CLOSE", event_id: "${ev}" }, as: OpsController, captures: { sv_c: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.20, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_c}" }, as: AirfieldInspector, captures: { ba: $.data.braking_action } }
          trigger:
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "REOPEN", event_id: "${ev}" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "ba == POOR"
            - "err == ERR_REOPEN_FRICTION_TOO_LOW and http == 409"
            - "GET /airfield-surfaces/${s1}.status == CLOSED"

      - name: equipment_readiness_cycle_round_trip
        claim_type: valid_transition
        grounds: [state_machines.EquipmentUnit]
        distinguishing_aspect: "READY -> OUT_OF_SERVICE -> READY is a legal cycle; each action response echoes the new readiness."
        test_recipe:
          setup: ["one equipment unit PLOW-01 READY"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin, captures: { eq1: $.data.id, rd0: $.data.readiness } }
          trigger:
            - { call: "POST /equipment-units/${eq1}/readiness-actions", payload: { action: "TAKE_OUT_OF_SERVICE" }, as: MaintenanceLead, captures: { rd1: $.data.readiness } }
            - { call: "POST /equipment-units/${eq1}/readiness-actions", payload: { action: "RETURN_TO_SERVICE" }, as: MaintenanceLead, captures: { rd2: $.data.readiness } }
          assert:
            - "rd0 == READY and rd1 == OUT_OF_SERVICE and rd2 == READY"

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: condition_code_ice_with_heavy_coverage_downgrades_to_zero
        claim_type: correct_result
        grounds: [calculations.condition_code_derivation]
        distinguishing_aspect: "ICE base code 1 with coverage_pct 60 (> 50) and depth 0.5 (>= 0.25) downgrades to exactly 0 (floored, not negative)."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L; SnowEvent SNOW-K1 ACTIVATED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv0: $.data.version } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-K1", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "POST /condition-reports", payload: { event_id: "${ev}", surface_id: "${s1}", contaminant_type: "ICE", coverage_pct: 60, depth_inches: 0.5, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { code: $.data.condition_code } }
          assert:
            - "code == 0  (base 1 for ICE, minus 1 for coverage > 50 AND depth >= 0.25, floored at 0)"

      - name: braking_action_upper_boundary_good_vs_medium
        claim_type: correct_result
        grounds: [calculations.braking_action_from_mu]
        distinguishing_aspect: "The GOOD lower bound 0.50 is inclusive: mu 0.50 -> GOOD, mu 0.49 -> MEDIUM (distinct from the 0.36 MEDIUM boundary probed in §1.8)."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L; SnowEvent SNOW-K2 ACTIVATED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv0: $.data.version } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-K2", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.50, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { ba_at: $.data.braking_action } }
            - { call: "GET /airfield-surfaces/${s1}", as: AirfieldInspector, captures: { sv1: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.49, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv1}" }, as: AirfieldInspector, captures: { ba_below: $.data.braking_action } }
          assert:
            - "ba_at == GOOD     (0.50 >= 0.50, inclusive)"
            - "ba_below == MEDIUM  (0.49 in [0.36, 0.50))"

      - name: dispatch_order_ranking_with_created_at_tiebreak
        claim_type: correct_result
        grounds: [calculations.dispatch_order]
        distinguishing_aspect: "Eligible surfaces (RESTRICTED/CLOSED) sort by priority_rank ASC; two rank-1 surfaces tie-break by created_at ASC (never by id)."
        test_recipe:
          setup:
            - "3 READY units; SnowEvent SNOW-K3 ACTIVATED"
            - "Surfaces created in order: RWY-18L (rank 2), RWY-09L (rank 1), RWY-09R (rank 1); all three then RESTRICTED"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-18L", surface_type: "RUNWAY", length_ft: 4000, width_ft: 100, priority_rank: 2 }, as: SystemAdmin, captures: { sA: $.data.id } }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { sB: $.data.id } }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09R", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { sC: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-K3", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${sA}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${sB}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${sC}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController }
          trigger:
            - { call: "GET /snow-events/${ev}/dispatch-order", as: OpsController, captures: { d0: "$.data[0].surface_code", d1: "$.data[1].surface_code", d2: "$.data[2].surface_code" } }
          assert:
            - "d0 == 'RWY-09L'  (rank 1, created before RWY-09R)"
            - "d1 == 'RWY-09R'  (rank 1, created_at tie-break)"
            - "d2 == 'RWY-18L'  (rank 2 last)"

      - name: dispatch_order_empty_when_all_surfaces_open
        claim_type: correct_result
        grounds: [calculations.dispatch_order]
        distinguishing_aspect: "Empty eligible set (all surfaces OPEN) yields a 200 with an empty data array — not an error."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L OPEN; SnowEvent SNOW-K4 ACTIVATED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-K4", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "GET /snow-events/${ev}/dispatch-order", as: OpsController }
          assert:
            - "http == 200 and response_type == 'array' and data is empty (total_count == 0)"

      - name: cost_estimate_excludes_cancelled_shift
        claim_type: input_set_filtering
        grounds: [calculations.event_cost_accrual, state_machines.OperatorShift.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "A CANCELLED shift leaves the provisional input set: estimated_cost_cents goes 40000 -> 0 on cancellation."
        test_recipe:
          setup: ["3 READY units; SnowEvent SNOW-K5 ACTIVATED; one SCHEDULED shift OP-C 08:00-16:00 (8h) at 5000 cents/h"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-K5", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-C", event_id: "${ev}", base_rate_cents_per_hour: 5000, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }, as: OpsController, captures: { sh1: $.data.id } }
            - { call: "GET /snow-events/${ev}/cost-summary", as: OpsController, captures: { est_before: $.data.estimated_cost_cents } }
          trigger:
            - { call: "POST /operator-shifts/${sh1}/shift-actions", payload: { action: "CANCEL" }, as: OpsController }
            - { call: "GET /snow-events/${ev}/cost-summary", as: OpsController, captures: { est_after: $.data.estimated_cost_cents } }
          assert:
            - "est_before == 40000  (8 planned hours x 5000, no overtime)"
            - "est_after == 0  (CANCELLED shifts excluded from the provisional input set)"

      - name: provisional_vs_final_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.event_cost_accrual]
        excluded_because:
          difficulty_instance: event_cost_provisional_vs_final_divergence
          rationale: "Variant divergence of event_cost_accrual is asserted with literal totals (497000 vs 486000) in the named §1.8 instance."

      - name: cost_rounding_order_per_line_then_sum
        claim_type: precision
        grounds: [calculations.event_cost_accrual]
        excluded_because:
          difficulty_instance: cost_per_line_rounding_order_pinned
          rationale: "The pinned rounding order (round each line, then sum) is asserted as 1002 != 1001 in the named §1.8 instance."

      - name: chemical_temperature_branch_selection
        claim_type: correct_result
        grounds: [calculations.chemical_application_quantity]
        excluded_because:
          difficulty_instance: chemical_quantity_temperature_branch_nonlinearity
          rationale: "The 1.25/1.10 temperature branches are asserted as 28125 vs 24750 in the named §1.8 instance."

  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails priority-1 authentication with ERR_UNAUTHENTICATED 401 before anything else."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /snow-events", payload: { event_code: "SNOW-V1", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED and http == 401"

      - name: shape_validation_precedes_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "coverage_pct 150 (shape, priority 3) and a non-existent event_id (existence, priority 4) are both violated; ERR_VALIDATION wins."
        test_recipe:
          setup: ["one surface RWY-09L registered (to bind the OCC placeholder); no events exist"]
          setup_api_calls:
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { sv0: $.data.version } }
          trigger:
            - { call: "POST /condition-reports", payload: { event_id: "00000000-0000-0000-0000-000000000000", surface_id: "00000000-0000-0000-0000-000000000000", contaminant_type: "ICE", coverage_pct: 150, depth_inches: 0.5, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION and http == 400  (shape beats existence)"

      - name: existence_left_to_right_event_before_surface
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "With well-formed values but both FK ids bogus, the left-to-right rule reports ERR_EVENT_NOT_FOUND (event_id checked before surface_id)."
        test_recipe:
          setup: ["one surface RWY-09L registered (to bind the OCC placeholder); no events exist"]
          setup_api_calls:
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { sv0: $.data.version } }
          trigger:
            - { call: "POST /condition-reports", payload: { event_id: "00000000-0000-0000-0000-000000000000", surface_id: "00000000-0000-0000-0000-000000000000", contaminant_type: "ICE", coverage_pct: 60, depth_inches: 0.5, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_NOT_FOUND and http == 404"

      - name: notam_inverted_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", entities.Notam.fields.effective_from]
        distinguishing_aspect: "effective_from >= effective_until violates the window shape rule and is rejected at draft creation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /notams", payload: { event_id: "00000000-0000-0000-0000-000000000000", surface_id: "00000000-0000-0000-0000-000000000000", notam_type: "RUNWAY_CLOSURE", effective_from: "2026-08-11T00:00:00Z", effective_until: "2026-08-10T00:00:00Z", message: "inverted" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION and http == 400  (shape check fires before existence)"

      - name: mu_out_of_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", entities.FrictionAssessment.fields.mu_value]
        distinguishing_aspect: "mu_value 1.5 exceeds the declared 0.00..1.00 range and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["one surface registered (to bind the OCC placeholder)"]
          setup_api_calls:
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv0: $.data.version } }
          trigger:
            - { call: "POST /friction-assessments", payload: { event_id: "00000000-0000-0000-0000-000000000000", surface_id: "${s1}", mu_value: 1.5, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION and http == 400  (range check fires before existence)"

      - name: shift_complete_with_zero_worked_hours_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", entities.OperatorShift.fields.worked_hours]
        distinguishing_aspect: "worked_hours must be > 0; completing with 0 is a shape violation, not a state error."
        test_recipe:
          setup: ["3 READY units; SnowEvent SNOW-V2 ACTIVATED; shift OP-W SCHEDULED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-V2", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-W", event_id: "${ev}", base_rate_cents_per_hour: 5000, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }, as: OpsController, captures: { sh1: $.data.id } }
          trigger:
            - { call: "POST /operator-shifts/${sh1}/shift-actions", payload: { action: "COMPLETE", worked_hours: 0 }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION and http == 400"
            - "GET /operator-shifts/${sh1}.status == SCHEDULED"

      - name: report_observed_after_logical_clock_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=3]", entities.ConditionReport.fields.observed_at]
        distinguishing_aspect: "observed_at 2026-09-01 is ahead of the default logical clock 2026-08-01T00:00:00Z and is rejected — deterministic, wall-clock independent."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L; SnowEvent SNOW-V3 ACTIVATED; logical clock untouched at its 2026-08-01T00:00:00Z default"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv0: $.data.version } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-V3", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "POST /condition-reports", payload: { event_id: "${ev}", surface_id: "${s1}", contaminant_type: "DRY_SNOW", coverage_pct: 40, depth_inches: 0.2, observed_at: "2026-09-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION and http == 400  (observed_at may not be in the logical future)"

      - name: authorize_state_vs_fiscal_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=19]"]
        excluded_because:
          difficulty_instance: authorize_state_error_beats_budget_error
          rationale: "The state-vs-fiscal priority conflict is asserted in the named §1.8 instance."

      - name: notam_safety_vs_temporal_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=13]"]
        excluded_because:
          difficulty_instance: notam_issue_safety_error_beats_overlap_error
          rationale: "The safety-vs-temporal priority conflict is asserted in the named §1.8 instance."

  # ===========================================================================
  # From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: success_envelope_shape_on_create
        claim_type: standard_crud
        grounds: [response_envelope.success]
        distinguishing_aspect: "A 201 create response carries meta.api_request_id, meta.api_request_timestamp, response_type 'object', and the entity under data."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /snow-events", payload: { event_code: "SNOW-E1", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
          assert:
            - "http == 201 and response_type == 'object'"
            - "meta.api_request_id is a non-empty string and meta.api_request_timestamp is ISO8601"
            - "data.id == ${ev} and data.status == FORECAST"

      - name: error_envelope_shape_on_failure
        claim_type: standard_crud
        grounds: [response_envelope.error]
        distinguishing_aspect: "An error response carries response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /snow-events/00000000-0000-0000-0000-000000000000", as: OpsController, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "http == 404 and response_type == 'error'"
            - "err == ERR_EVENT_NOT_FOUND and msg is a non-empty string"

      - name: clock_set_endpoint_echoes_logical_time
        claim_type: conditional_action
        grounds: [endpoints.POST_/_clock/set_current_utc]
        distinguishing_aspect: "POST /_clock/set_current_utc advances the logical clock and echoes it; startup default is 2026-08-01T00:00:00Z with no wall-clock fallback."
        test_recipe:
          setup: ["empty database; logical clock untouched"]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: SystemAdmin, captures: { now: $.data.current_utc } }
          assert:
            - "now == '2026-08-10T00:00:00Z'"

      - name: report_supersede_cascade_side_effects
        claim_type: action_endpoint
        grounds: [state_machines.ConditionReport.FILED_to_SUPERSEDED]
        excluded_because:
          difficulty_instance: report_supersede_to_notam_reissue_cascade
          rationale: "The supersede -> NOTAM reissue -> counter cascade side effects are asserted link-by-link in the named §1.8 instance."

      - name: dispense_cascade_side_effects
        claim_type: action_endpoint
        grounds: [state_machines.ChemicalApplication.AUTHORIZED_to_DISPENSED]
        excluded_because:
          difficulty_instance: dispense_threshold_to_product_constraint_cascade
          rationale: "The dispense -> counter -> CONSTRAINED -> auto-reject cascade side effects are asserted link-by-link in the named §1.8 instance."

  # ===========================================================================
  # From Table 6 (Errors) — every catalog error has at least one trigger test
  # ===========================================================================
  - section: errors
    instances:
      - name: authorize_on_constrained_product_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_PRODUCT_CONSTRAINED]"]
        distinguishing_aspect: "AUTHORIZE against a CONSTRAINED product (dispensed 9500 >= 90% of 10000) fails with ERR_PRODUCT_CONSTRAINED even though 500 lbs remain available — the posture gate (priority 7) precedes the pool check (priority 8)."
        test_recipe:
          setup:
            - "3 READY units; surface TWY-A 1000x100 (100 units); product KA-03 base 95, cost 10, seasonal_limit 10000"
            - "SnowEvent SNOW-X1 ACTIVATED; APP1 authorized and dispensed 9500 lbs -> product CONSTRAINED (auto-rejecting APP2); APP3 PROPOSED on the same product"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "TWY-A", surface_type: "TAXIWAY", length_ft: 1000, width_ft: 100, priority_rank: 3 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "KA-03", base_rate_lbs_per_1000sqft: 95, unit_cost_cents_per_lb: 10, seasonal_limit_lbs: 10000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-X1", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 100000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 30 }, as: MaintenanceLead, captures: { app1: $.data.id } }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1" }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 30 }, as: MaintenanceLead }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "DISPENSE" }, as: MaintenanceLead, as_user_id: "ml-dispenser-2" }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 30 }, as: MaintenanceLead, captures: { app3: $.data.id } }
          trigger:
            - { call: "POST /chemical-applications/${app3}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PRODUCT_CONSTRAINED and http == 409"
            - "GET /chemical-applications/${app3}.status == PROPOSED"

      - name: authorize_with_zero_environmental_pool_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ENV_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "With the product pool fully reserved (available == 0), AUTHORIZE fails with ERR_ENV_LIMIT_EXCEEDED 422 — the >0 availability gate, distinct from the inclusive-equality success at exactly-at-cap."
        test_recipe:
          setup:
            - "3 READY units; surface TWY-A 1000x100 (100 units); product KA-04 base 100, cost 10, seasonal_limit 10000"
            - "SnowEvent SNOW-X2 ACTIVATED; APP1 AUTHORIZED at exactly 10000 lbs (pool exhausted, product still ACTIVE because dispensed 0 < 9000)"
            - "APP2 PROPOSED on the same product (raw 10000)"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "TWY-A", surface_type: "TAXIWAY", length_ft: 1000, width_ft: 100, priority_rank: 3 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "KA-04", base_rate_lbs_per_1000sqft: 100, unit_cost_cents_per_lb: 10, seasonal_limit_lbs: 10000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-X2", season_label: "2025-2026", chemical_limit_lbs: 1000000, budget_cents: 100000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 30 }, as: MaintenanceLead, captures: { app1: $.data.id, raw1: $.data.raw_quantity_lbs } }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1", captures: { a1: $.data.authorized_quantity_lbs } }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 30 }, as: MaintenanceLead, captures: { app2: $.data.id } }
          trigger:
            - { call: "POST /chemical-applications/${app2}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1", captures: { err: $.data.error_id } }
          assert:
            - "raw1 == 10000 and a1 == 10000  (APP1 took the whole pool; product stays ACTIVE because nothing dispensed yet)"
            - "err == ERR_ENV_LIMIT_EXCEEDED and http == 422  (min(remaining pools) == 0)"

      - name: authorize_over_budget_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "With the event ACTIVATED, product ACTIVE, and pools available, the fiscal gate fires alone: projected 2475000 cents exceeds budget 200000."
        test_recipe:
          setup:
            - "3 READY units; surface RWY-09L (750000 sqft); product NAAC-HI base 30, unit cost 100, seasonal_limit 1000000"
            - "SnowEvent SNOW-X3 ACTIVATED with budget_cents 200000; application PROPOSED raw 24750 lbs"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "NAAC-HI", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 100, seasonal_limit_lbs: 1000000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-X3", season_label: "2025-2026", chemical_limit_lbs: 1000000, budget_cents: 200000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { app1: $.data.id } }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BUDGET_EXCEEDED and http == 422"
            - "GET /chemical-applications/${app1}.status == PROPOSED  (no reservation leaked)"
            - "GET /chemical-products/${prod}.seasonal_reserved_lbs == 0"

      - name: ratify_with_runways_open_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_RUNWAYS_NOT_CLOSED]"]
        distinguishing_aspect: "RATIFY while a RUNWAY surface is still OPEN fails with ERR_RUNWAYS_NOT_CLOSED even though the airline has acknowledged."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L OPEN; SnowEvent SNOW-X4 ACTIVATED with closure PROPOSED and ACKNOWLEDGED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-X4", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "PROPOSE" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "ACKNOWLEDGE" }, as: AirlineCoordinator, as_user_id: "al-coord-1", captures: { ack: $.data.airline_acknowledged } }
          trigger:
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "RATIFY" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "ack == true"
            - "err == ERR_RUNWAYS_NOT_CLOSED and http == 409"
            - "GET /snow-events/${ev}.closure_status == PROPOSED"

      - name: ratify_without_airline_ack_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_AIRLINE_ACK_REQUIRED]"]
        distinguishing_aspect: "With all RUNWAY surfaces CLOSED but no airline acknowledgment, RATIFY fails with ERR_AIRLINE_ACK_REQUIRED (priority 18, after the runway check)."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L CLOSED; SnowEvent SNOW-X5 ACTIVATED with closure PROPOSED (never acknowledged)"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-X5", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "CLOSE", event_id: "${ev}" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "PROPOSE" }, as: OpsController }
          trigger:
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "RATIFY" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_AIRLINE_ACK_REQUIRED and http == 409"
            - "GET /snow-events/${ev}.closure_status == PROPOSED and airline_acknowledged == false"

      - name: closure_ratify_success_path
        claim_type: satisfaction_pass
        grounds: [state_machines.SnowEvent.closure_status, "validations[priority=17]", "validations[priority=18]"]
        distinguishing_aspect: "The satisfaction counterpart: runways CLOSED + ACKNOWLEDGED -> RATIFY succeeds and closure_status becomes RATIFIED."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L CLOSED; SnowEvent SNOW-X6 ACTIVATED, closure PROPOSED then ACKNOWLEDGED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-X6", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "CLOSE", event_id: "${ev}" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "PROPOSE" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "ACKNOWLEDGE" }, as: AirlineCoordinator, as_user_id: "al-coord-1" }
          trigger:
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "RATIFY" }, as: OpsController, captures: { cl: $.data.closure_status } }
          assert:
            - "cl == RATIFIED"

      - name: shift_with_out_of_service_equipment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_EQUIPMENT_NOT_READY]"]
        distinguishing_aspect: "Scheduling a shift naming an OUT_OF_SERVICE unit fails with ERR_EQUIPMENT_NOT_READY 409."
        test_recipe:
          setup: ["3 units registered, PLOW-01 taken OUT_OF_SERVICE (2 remain READY); SnowEvent SNOW-X7 ACTIVATED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin, captures: { eq1: $.data.id } }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-X7", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /equipment-units/${eq1}/readiness-actions", payload: { action: "TAKE_OUT_OF_SERVICE" }, as: MaintenanceLead }
          trigger:
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-Y", event_id: "${ev}", equipment_unit_id: "${eq1}", base_rate_cents_per_hour: 5000, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EQUIPMENT_NOT_READY and http == 409"

      - name: event_not_active_gate_on_report
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: condition_report_requires_active_event
          rationale: "ERR_EVENT_NOT_ACTIVE is asserted as the failure path of the named §1.8 instance."

      - name: invalid_surface_state_gate_on_issue
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_SURFACE_STATE]"]
        excluded_because:
          difficulty_instance: notam_issue_requires_non_open_surface
          rationale: "ERR_INVALID_SURFACE_STATE on ISSUE is asserted in the named §1.8 instance; the RESCIND-side variant is covered by notam_rescind_requires_open_surface_rejected above."

      - name: unsafe_notam_condition_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNSAFE_NOTAM_CONDITION]"]
        excluded_because:
          difficulty_instance: notam_issue_safety_error_beats_overlap_error
          rationale: "ERR_UNSAFE_NOTAM_CONDITION is asserted (as the priority winner) in the named §1.8 instance."

      - name: shift_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHIFT_OVERLAP]"]
        excluded_because:
          difficulty_instance: operator_shift_half_open_adjacency
          rationale: "ERR_SHIFT_OVERLAP is asserted in the named §1.8 instance."

      - name: notam_window_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOTAM_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: notam_window_closed_interval_touch_conflict
          rationale: "ERR_NOTAM_WINDOW_OVERLAP is asserted in the named §1.8 instance."

      - name: stale_version_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: report_supersede_to_notam_reissue_cascade
          rationale: "OCC success path exercised throughout; explicit ERR_STALE_VERSION 412 coverage lives in the optimistic_concurrency layer instances below (occ_stale_version_on_report_create_rejected, occ_stale_version_on_friction_create_rejected)."

  # ===========================================================================
  # From Table 7 (RBAC)
  # ===========================================================================
  - section: rbac
    instances:
      - name: coordinator_cannot_file_condition_report
        claim_type: role_denial
        grounds: [roles.AirfieldInspector, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "AirlineCoordinator calling the AirfieldInspector-exclusive POST /condition-reports is denied with ERR_UNAUTHORIZED_ROLE 403."
        test_recipe:
          setup: ["one surface registered (to bind the OCC placeholder)"]
          setup_api_calls:
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv0: $.data.version } }
          trigger:
            - { call: "POST /condition-reports", payload: { event_id: "00000000-0000-0000-0000-000000000000", surface_id: "${s1}", contaminant_type: "DRY_SNOW", coverage_pct: 40, depth_inches: 0.2, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirlineCoordinator, as_user_id: "al-coord-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE and http == 403  (role check at priority 2 fires before existence)"

      - name: ops_controller_cannot_register_equipment
        claim_type: role_denial
        grounds: [roles.SystemAdmin, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "OpsController calling the SystemAdmin-exclusive POST /equipment-units is denied with ERR_UNAUTHORIZED_ROLE 403."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE and http == 403"

      - name: ops_controller_cannot_acknowledge_closure
        claim_type: role_denial
        grounds: [roles.AirlineCoordinator, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "closure-actions ACKNOWLEDGE is AirlineCoordinator-scoped; OpsController (who may PROPOSE/RATIFY) is denied on this action specifically."
        test_recipe:
          setup: ["3 READY units; SnowEvent SNOW-R1 ACTIVATED with closure PROPOSED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-R1", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "PROPOSE" }, as: OpsController }
          trigger:
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "ACKNOWLEDGE" }, as: OpsController, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE and http == 403"
            - "GET /snow-events/${ev}.airline_acknowledged == false"

      - name: inspector_cannot_drive_surface_actions
        claim_type: role_denial
        grounds: [roles.OpsController, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "AirfieldInspector calling the OpsController-exclusive surface-actions endpoint is denied with ERR_UNAUTHORIZED_ROLE 403."
        test_recipe:
          setup: ["one surface registered"]
          setup_api_calls:
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "RESTRICT", event_id: "00000000-0000-0000-0000-000000000000" }, as: AirfieldInspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE and http == 403"

      - name: segregation_of_duties_same_user_dispense_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=11]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.ChemicalApplication.fields.authorized_by]
        distinguishing_aspect: "The same X-User-ID that authorized an application may not dispense it: ERR_SEGREGATION_OF_DUTIES 403; a different MaintenanceLead user succeeds."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L; product NAAC-01; SnowEvent SNOW-R2 ACTIVATED; application AUTHORIZED by ml-same"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "NAAC-01", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 12, seasonal_limit_lbs: 100000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-R2", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 50000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { app1: $.data.id } }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-same", captures: { ab: $.data.authorized_by } }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "DISPENSE" }, as: MaintenanceLead, as_user_id: "ml-same", captures: { err: $.data.error_id } }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "DISPENSE" }, as: MaintenanceLead, as_user_id: "ml-other", captures: { st2: $.data.status } }
          assert:
            - "ab == 'ml-same'"
            - "err == ERR_SEGREGATION_OF_DUTIES and http == 403  (same-user dispense blocked)"
            - "st2 == DISPENSED  (a different MaintenanceLead succeeds)"

      - name: airline_coordinator_can_read_notams
        claim_type: role_allowance
        grounds: [roles.AirlineCoordinator]
        distinguishing_aspect: "Shared read: AirlineCoordinator may list NOTAMs (200), which is all the coordination role needs besides ACKNOWLEDGE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /notams", as: AirlineCoordinator, as_user_id: "al-coord-1" }
          assert:
            - "http == 200 and response_type == 'array'"

  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_report_create_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-create-stale-surface]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After report R1 bumps the surface version to 2, a second create still carrying expected_surface_version 1 is rejected 412 — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L (version 1); SnowEvent SNOW-L1 ACTIVATED; report R1 filed (surface version now 2)"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv0: $.data.version } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-L1", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /condition-reports", payload: { event_id: "${ev}", surface_id: "${s1}", contaminant_type: "DRY_SNOW", coverage_pct: 40, depth_inches: 0.2, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /condition-reports", payload: { event_id: "${ev}", surface_id: "${s1}", contaminant_type: "ICE", coverage_pct: 60, depth_inches: 0.5, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_VERSION and http == 412  (${sv0} was current at read time but R1 advanced the surface to version 2)"
            - "GET /condition-reports/${r1}.status == FILED  (no supersession happened)"

      - name: occ_stale_version_on_friction_create_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[friction-create-stale-surface]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC discipline on the second guarded write endpoint: a friction create carrying the pre-RESTRICT version is rejected 412 after the surface action advanced the version."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L (version 1); SnowEvent SNOW-L2 ACTIVATED; surface RESTRICTED (version now 2)"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv0: $.data.version } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-L2", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController, captures: { sv1: $.data.version } }
          trigger:
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.60, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { err: $.data.error_id } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.60, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv1}" }, as: AirfieldInspector, captures: { fa1: $.data.id, st: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION and http == 412  (stale view rejected)"
            - "st == REPORTED  (the same payload with the current version ${sv1} succeeds)"

      - name: derived_current_condition_code_reconciled_on_supersede
        claim_type: derived_field_reconciliation
        grounds: [entities.AirfieldSurface.fields.current_condition_code, calculations.condition_code_derivation]
        distinguishing_aspect: "The denormalized surface.current_condition_code tracks the latest FILED report: 4 after the DRY_SNOW report, then 0 after the ICE report supersedes it."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L; SnowEvent SNOW-L3 ACTIVATED"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv0: $.data.version } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-L3", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "POST /condition-reports", payload: { event_id: "${ev}", surface_id: "${s1}", contaminant_type: "DRY_SNOW", coverage_pct: 40, depth_inches: 0.2, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv0}" }, as: AirfieldInspector, captures: { r1: $.data.id } }
            - { call: "GET /airfield-surfaces/${s1}", as: OpsController, captures: { cc1: $.data.current_condition_code, sv1: $.data.version } }
            - { call: "POST /condition-reports", payload: { event_id: "${ev}", surface_id: "${s1}", contaminant_type: "ICE", coverage_pct: 60, depth_inches: 0.5, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv1}" }, as: AirfieldInspector, captures: { r2: $.data.id } }
            - { call: "GET /airfield-surfaces/${s1}", as: OpsController, captures: { cc2: $.data.current_condition_code } }
          assert:
            - "cc1 == 4  (DRY_SNOW base, no downgrade at coverage 40)"
            - "cc2 == 0  (ICE base 1 downgraded; derived field reconciled to the latest report)"

      - name: constrained_threshold_at_exactly_ninety_percent
        claim_type: rate_threshold_triggers
        grounds: [calculations.seasonal_chemical_counters, state_machines.ChemicalProduct.ACTIVE_to_CONSTRAINED]
        distinguishing_aspect: "The 90% CONSTRAINED trigger is inclusive: dispensing exactly 9000 of a 10000-lb seasonal limit flips the product to CONSTRAINED."
        test_recipe:
          setup:
            - "3 READY units; surface TWY-A 1000x100 (100 units); product KA-90 base 90, cost 10, seasonal_limit 10000"
            - "SnowEvent SNOW-L4 ACTIVATED; application PROPOSED at 30F (raw = 100 x 90 x 1.00 = 9000) and AUTHORIZED"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "TWY-A", surface_type: "TAXIWAY", length_ft: 1000, width_ft: 100, priority_rank: 3 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "KA-90", base_rate_lbs_per_1000sqft: 90, unit_cost_cents_per_lb: 10, seasonal_limit_lbs: 10000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-L4", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 100000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 30 }, as: MaintenanceLead, captures: { app1: $.data.id } }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1" }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "DISPENSE" }, as: MaintenanceLead, as_user_id: "ml-dispenser-2" }
            - { call: "GET /chemical-products/${prod}", as: MaintenanceLead, captures: { pst: $.data.status, disp: $.data.seasonal_dispensed_lbs } }
          assert:
            - "disp == 9000 and pst == CONSTRAINED  (9000 >= 0.9 x 10000, inclusive threshold)"

      - name: cascading_side_effects_depth_probes
        claim_type: cascading_side_effects
        grounds: [state_machines.ConditionReport, state_machines.ChemicalProduct]
        excluded_because:
          difficulty_instance: report_supersede_to_notam_reissue_cascade
          rationale: "Both depth-3 cascades (report supersede chain and dispense threshold chain) are asserted link-by-link in the two named §1.8 instances."

      - name: boundary_probes_mu_and_chemical_caps
        claim_type: rate_threshold_triggers
        grounds: [calculations.braking_action_from_mu, calculations.chemical_application_quantity]
        excluded_because:
          difficulty_instance: friction_mu_threshold_equality_medium
          rationale: "Boundary precision at mu 0.36 and at exact chemical availability is asserted in the named §1.8 instances."

  # ===========================================================================
  # From Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: authorize_response_reflects_mutation_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.ChemicalApplication.PROPOSED_to_AUTHORIZED]
        distinguishing_aspect: "Under immediate consistency, the AUTHORIZE response body itself carries the post-mutation state: status AUTHORIZED, authorized_quantity_lbs 24750, line_cost_cents 297000 — no re-read required."
        test_recipe:
          setup: ["3 READY units; surface RWY-09L (750000 sqft); product NAAC-01 base 30 cost 12 limit 100000; SnowEvent SNOW-M1 ACTIVATED; application PROPOSED raw 24750"]
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "NAAC-01", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 12, seasonal_limit_lbs: 100000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-M1", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 50000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { app1: $.data.id } }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1", captures: { st: $.data.status, qty: $.data.authorized_quantity_lbs, cost: $.data.line_cost_cents } }
          assert:
            - "st == AUTHORIZED and qty == 24750 and cost == 297000  (mutation fully visible in the same response)"
