# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: EngagementManager
    description: "Commercial owner of engagement letters and request intake; may never vote or decide"
    identity: opaque
    exclusive_operations:
      - "POST /engagement-letters"
      - "POST /engagement-letters/{id}/submit"
      - "POST /engagement-letters/{id}/activate"
      - "POST /engagement-letters/{id}/revert-to-draft"
      - "POST /engagement-letters/{id}/terminate"
      - "POST /rated-entities"
      - "POST /rating-requests"
      - "POST /rating-requests/{id}/withdraw"
    shared_operations: ["GET read endpoints"]
  - name: RatingAnalyst
    description: "Analytical staff who serve on teams, vote, and work surveillance; forbidden from commercial and committee-chair operations"
    identity: entity_backed:Analyst
    exclusive_operations:
      - "POST /rating-committees/{id}/votes"
      - "POST /surveillance-reviews"
      - "POST /surveillance-reviews/{id}/start"
      - "POST /surveillance-reviews/{id}/complete"
      - "POST /surveillance-reviews/{id}/reopen"
      - "POST /rating-action-events"
      - "POST /rating-action-events/{id}/apply"
      - "POST /rating-action-events/{id}/cancel"
      - "POST /appearance-reconciliations/{id}/appeal"
    shared_operations: ["GET read endpoints"]
  - name: ComplianceOfficer
    description: "Conflict screening, methodology publication, rotation and look-back compliance; never decides ratings"
    identity: opaque
    exclusive_operations:
      - "POST /methodologies"
      - "POST /methodologies/{id}/publish"
      - "POST /methodologies/{id}/publish-disclosure"
      - "POST /methodologies/{id}/supersede"
      - "POST /team-assignments/{id}/screen"
      - "POST /team-assignments/{id}/return-to-proposed"
      - "POST /team-assignments/{id}/revoke"
      - "POST /conflict-screenings"
      - "POST /appearance-reconciliations"
      - "POST /analysts/{id}/depart"
      - "POST /look-back-reviews"
      - "POST /look-back-reviews/{id}/start"
      - "POST /look-back-reviews/{id}/close"
      - "POST /rating-requests/{id}/open-screening"
      - "POST /rating-requests/{id}/return-to-submitted"
      - "POST /rating-requests/{id}/confirm-team"
    shared_operations: ["GET read endpoints"]
  - name: CommitteeChair
    description: "Convenes committees, proposes teams, publishes ratings; cannot screen conflicts or file appeals"
    identity: opaque
    exclusive_operations:
      - "POST /team-assignments"
      - "POST /team-assignments/{id}/confirm"
      - "POST /rating-committees"
      - "POST /rating-committees/{id}/open-session"
      - "POST /rating-committees/{id}/decide"
      - "POST /rating-committees/{id}/redecide"
      - "POST /rating-committees/{id}/reopen"
      - "POST /rating-decisions/{id}/open-appeal-window"
      - "POST /rating-decisions/{id}/publish"
      - "POST /rating-decisions/{id}/withdraw"
      - "POST /issuer-appeals/{id}/resolve"
      - "POST /appearance-reconciliations/{id}/confirm-breach"
      - "POST /appearance-reconciliations/{id}/clear"
    shared_operations: ["GET read endpoints"]
  - name: CompensationCommittee
    description: "Owns analytical compensation separation from fee generation"
    identity: opaque
    exclusive_operations:
      - "POST /compensation-records"
      - "POST /compensation-records/{id}/approve"
      - "POST /compensation-records/{id}/pay"
      - "POST /compensation-records/{id}/revise"
    shared_operations: ["GET read endpoints"]
  - name: Anonymous
    description: "Unauthenticated issuer-side filer; may only file an appeal against a published-pending decision"
    identity: opaque
    exclusive_operations:
      - "POST /rating-decisions/{id}/appeals"
    shared_operations: []
  - name: PlatformAdmin
    description: "Operational role owning the logical clock and administrative reads; no rating decisions"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: ["GET read endpoints"]