  - rule_id: priority_pair_validation_conflict
    instances:
      - name: quote_line_item_state_error_beats_constraint_error
        grounds:
          - validations[priority=5]
          - validations[priority=6b]
          - errors[ERR_QUOTE_NOT_DRAFT]
          - errors[ERR_INVALID_LINE_ITEM]
        distinguishing_aspect: |
          Category pair state (priority 5) vs business_constraint (priority
          6b): one request that both targets a non-DRAFT quote AND carries a
          zero-quantity line item MUST surface ERR_QUOTE_NOT_DRAFT (409), not
          ERR_INVALID_LINE_ITEM (422).
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case ASSESSED; quote SUBMITTED (no longer DRAFT) with one valid line item"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Lena Marr", client_address: "99 Priority Pl", client_phone: "555-0109" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-600", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 70, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 70, hazard_count: 1, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", expected_case_version: "${case_v}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "LABOR", description: "Install", quantity: 1, unit: "hour", unit_price_cents: 5000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
