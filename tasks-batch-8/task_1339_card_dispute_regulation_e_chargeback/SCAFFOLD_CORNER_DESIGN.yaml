scaffold_corner_design:
  # ==========================================================================
  # Entities (Table 1)
  # ==========================================================================
  - section: entities
    instances:
      - name: create_card_account_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.CardAccount.fields.initial_balance_cents, entities.CardAccount.fields.status]
        distinguishing_aspect: "Omitting initial_balance_cents yields balance_cents == 0, status ACTIVE, and opened_at equal to the logical clock at creation."
        test_recipe:
          setup: ["Clock at 2026-05-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
          trigger:
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Defaults" }
              as: BankAdmin
              captures: { bal: $.data.balance_cents, st: $.data.status, opened: $.data.opened_at }
          assert:
            - "bal == 0 and st == ACTIVE"
            - "opened == 2026-05-01T00:00:00Z (logical clock, not wall clock)"
      - name: get_card_account_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but non-existent account UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /card-accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
      - name: intake_with_unknown_field_returns_invalid_request
        claim_type: required_fields_schema
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /disputes carrying an undeclared body field (received_at is system-computed, never client input) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Old account with one VISA ECOMMERCE txn 5000 posted 2026-07-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Schema", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { sacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${sacct}", merchant_name: "SC", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { stxn: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
          trigger:
            - call: "POST /disputes"
              payload: { card_transaction_id: "${stxn}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5, received_at: "2026-01-01T00:00:00Z" }
              as: Cardholder
              as_user_id: "${sacct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (client cannot smuggle system-computed fields)"
      - name: transaction_seeded_with_backdated_posted_at
        claim_type: creation
        grounds: [entities.CardTransaction.fields.posted_at, entities.CardTransaction.fields.status]
        distinguishing_aspect: "POST /card-transactions echoes the client-supplied posted_at verbatim and initializes status POSTED."
        test_recipe:
          setup: ["Clock at 2026-08-01 default; account exists"]
          setup_api_calls:
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Backdate", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { bdacct: $.data.id }
          trigger:
            - call: "POST /card-transactions"
              payload: { card_account_id: "${bdacct}", merchant_name: "BD", amount_cents: 4321, transaction_type: "ATM_WITHDRAWAL", network: "MASTERCARD", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { posted: $.data.posted_at, st: $.data.status }
          assert:
            - "posted == 2026-07-01T10:00:00Z and st == POSTED"

  # ==========================================================================
  # State Machines (Table 2)
  # ==========================================================================
  - section: state_machines
    instances:
      - name: classify_from_classified_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DisputeCase.RECEIVED_to_CLASSIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "classify is only valid from RECEIVED; a second classify on a CLASSIFIED case fails with ERR_INVALID_STATE (reclassify is the sanctioned path)."
        test_recipe:
          setup: ["Old account, txn 5000, dispute received 2026-08-03, already classified"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "SM1", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { s1acct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${s1acct}", merchant_name: "S1", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { s1tx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${s1tx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${s1acct}"
              captures: { s1case: $.data.id }
            - call: "POST /disputes/${s1case}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
          trigger:
            - call: "POST /disputes/${s1case}/classify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 5 }
              as: DisputeInvestigator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: resolve_from_received_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DisputeCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "resolve before classify (case RECEIVED) fails with ERR_INVALID_STATE; no notifications are created."
        test_recipe:
          setup: ["Old account, txn 5000, dispute received 2026-08-03, NOT classified"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "SM2", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { s2acct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${s2acct}", merchant_name: "S2", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { s2tx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${s2tx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${s2acct}"
              captures: { s2case: $.data.id }
          trigger:
            - call: "POST /disputes/${s2case}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: grant_second_credit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ProvisionalCredit, "endpoints.POST /disputes/{id}/grant-provisional-credit"]
        distinguishing_aspect: "One open credit per case: a second grant while a GRANTED credit exists fails with ERR_INVALID_STATE and balance is unchanged."
        test_recipe:
          setup: ["Old account balance 50000, txn 8000, non-fraud dispute classified, credit 8000 granted"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "SM3", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { s3acct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${s3acct}", merchant_name: "S3", amount_cents: 8000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { s3tx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${s3tx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 8000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${s3acct}"
              captures: { s3case: $.data.id }
            - call: "POST /disputes/${s3case}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
            - call: "POST /disputes/${s3case}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
          trigger:
            - call: "POST /disputes/${s3case}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { err: $.data.error_id }
            - call: "GET /card-accounts/${s3acct}"
              payload: {}
              as: FinanceOfficer
              captures: { bal: $.data.balance_cents }
          assert:
            - "err == ERR_INVALID_STATE and bal == 58000 (single grant only)"
      - name: representment_after_second_presented_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Chargeback.FILED_to_REPRESENTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Representments register only against FILED chargebacks; after second presentment the network offers no further representment step, so the call fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Chargeback in SECOND_PRESENTED (filed 2026-08-05, representment, REJECT)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "SM4", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { s4acct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${s4acct}", merchant_name: "S4", amount_cents: 12000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { s4tx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${s4tx}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 12000, claimed_report_delay_days: 10 }
              as: Cardholder
              as_user_id: "${s4acct}"
              captures: { s4case: $.data.id }
            - call: "POST /disputes/${s4case}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 10 }
              as: DisputeInvestigator
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${s4case}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { s4cb: $.data.id }
            - call: "POST /chargebacks/${s4cb}/representments"
              payload: { merchant_ref: "MR-4", evidence_documents: [{ doc_type: "RECEIPT", reference: "4-1" }] }
              as: ChargebackAnalyst
            - call: "POST /chargebacks/${s4cb}/review-representment"
              payload: { decision: "REJECT" }
              as: ChargebackAnalyst
          trigger:
            - call: "POST /chargebacks/${s4cb}/representments"
              payload: { merchant_ref: "MR-4B", evidence_documents: [{ doc_type: "RECEIPT", reference: "4-2" }] }
              as: ChargebackAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: withdraw_terminal_case_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.DisputeCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A case in terminal RESOLVED_MERCHANT_FAVOR (no-credit NO_ERROR resolution) rejects withdraw with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Non-fraud dispute classified, resolved NO_ERROR without credit on 2026-08-10 -> RESOLVED_MERCHANT_FAVOR"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "SM5", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { s5acct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${s5acct}", merchant_name: "S5", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { s5tx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${s5tx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${s5acct}"
              captures: { s5case: $.data.id }
            - call: "POST /disputes/${s5case}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
            - call: "POST /disputes/${s5case}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
          trigger:
            - call: "POST /disputes/${s5case}/withdraw"
              payload: {}
              as: Cardholder
              as_user_id: "${s5acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: withdraw_auto_reverses_open_credit
        claim_type: side_effect_execution
        grounds: [state_machines.DisputeCase.CLASSIFIED_to_WITHDRAWN, state_machines.ProvisionalCredit.GRANTED_to_REVERSED]
        distinguishing_aspect: "Cardholder withdrawal with an open credit auto-reverses it immediately (no 3-business-day notice wait): balance and outstanding restored, credit REVERSED, case WITHDRAWN."
        test_recipe:
          setup: ["Old account balance 50000, txn 8000, non-fraud dispute classified, credit 8000 granted (balance 58000)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "SM6", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { s6acct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${s6acct}", merchant_name: "S6", amount_cents: 8000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { s6tx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${s6tx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 8000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${s6acct}"
              captures: { s6case: $.data.id }
            - call: "POST /disputes/${s6case}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
            - call: "POST /disputes/${s6case}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { s6pc: $.data.id }
          trigger:
            - call: "POST /disputes/${s6case}/withdraw"
              payload: {}
              as: Cardholder
              as_user_id: "${s6acct}"
              captures: { st: $.data.status }
            - call: "GET /card-accounts/${s6acct}"
              payload: {}
              as: FinanceOfficer
              captures: { bal: $.data.balance_cents, out: $.data.provisional_outstanding_cents }
            - call: "GET /disputes/${s6case}/provisional-credits"
              payload: {}
              as: FinanceOfficer
              captures: { pcst: "$.data[0].status" }
          assert:
            - "st == WITHDRAWN and pcst == REVERSED"
            - "bal == 50000 and out == 0 (immediate reversal, notice wait waived)"

  # ==========================================================================
  # Calculations (Table 3)
  # ==========================================================================
  - section: calculations
    instances:
      - name: provisional_credit_deadline_new_vs_old_account
        claim_type: correct_result
        grounds: [calculations.provisional_credit_deadline, entities.DisputeCase.fields.provisional_credit_due_at]
        distinguishing_aspect: "Business-day deadline computation differs by account age: a new account (opened 2026-07-20, txn posted 2026-07-25) gets 20 business days (2026-08-31T23:59:59Z) while an old account gets 10 (2026-08-17T23:59:59Z) for the same received_at 2026-08-03."
        test_recipe:
          setup:
            - "Old account opened 2026-05-01 with txn posted 2026-07-01; new account opened 2026-07-20 with txn posted 2026-07-25"
            - "Both disputes received 2026-08-03"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Old", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { dacct_old: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${dacct_old}", merchant_name: "OLD", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { dtx_old: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "New", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { dacct_new: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${dacct_new}", merchant_name: "NEW", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-25T10:00:00Z" }
              as: BankAdmin
              captures: { dtx_new: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
          trigger:
            - call: "POST /disputes"
              payload: { card_transaction_id: "${dtx_old}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${dacct_old}"
              captures: { due_old: $.data.provisional_credit_due_at }
            - call: "POST /disputes"
              payload: { card_transaction_id: "${dtx_new}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${dacct_new}"
              captures: { due_new: $.data.provisional_credit_due_at }
          assert:
            - "due_old == 2026-08-17T23:59:59Z (10 business days)"
            - "due_new == 2026-08-31T23:59:59Z (20 business days)"
      - name: granted_late_flag_boundary
        claim_type: correct_result
        grounds: [entities.ProvisionalCredit.fields.granted_late, calculations.provisional_credit_deadline]
        distinguishing_aspect: "granted_late is false when granted on/before provisional_credit_due_at (2026-08-10 grant) and true after (2026-08-20 grant past the 2026-08-17 due date)."
        test_recipe:
          setup: ["Two non-fraud disputes on one old account, both received 2026-08-03, both classified"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Late", initial_balance_cents: 90000 }
              as: BankAdmin
              captures: { lacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${lacct}", merchant_name: "L1", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { ltx1: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${lacct}", merchant_name: "L2", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T11:00:00Z" }
              as: BankAdmin
              captures: { ltx2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${ltx1}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${lacct}"
              captures: { lc1: $.data.id }
            - call: "POST /disputes"
              payload: { card_transaction_id: "${ltx2}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${lacct}"
              captures: { lc2: $.data.id }
            - call: "POST /disputes/${lc1}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
            - call: "POST /disputes/${lc2}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes/${lc1}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { late1: $.data.granted_late }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes/${lc2}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { late2: $.data.granted_late }
          assert:
            - "late1 == false (granted before the 2026-08-17 due date)"
            - "late2 == true (granted after the due date)"
      - name: tier2_liability_cap_applied
