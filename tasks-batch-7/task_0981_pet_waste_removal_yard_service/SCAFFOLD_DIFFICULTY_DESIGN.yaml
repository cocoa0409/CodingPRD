            - call: "POST /api/subscription-plans"
              payload: { plan_code: "MM-I", display_name: "MM", visit_frequency: "DAILY", applies_to_multifamily: true, base_monthly_fee_cents: 50000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_i_mm: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_i}", yard_id: "${y_i}", plan_id: "${pl_i_mm}" }
              as: Customer
              as_user_id: "${cu_i}"
              captures: { sub_i: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/${sub_i}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_i}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PLAN_SCOPE_MISMATCH (business_constraint priority 10 fires before any business_fiscal check would be relevant)"

  # =========================================================================
