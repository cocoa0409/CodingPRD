      - name: version_increments_by_one_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["entities.Customer", "endpoints.POST./customers/{id}/credit-status"]
        distinguishing_aspect: "version starts at 1 and increments by exactly 1 per mutation: two credit-status calls take Customer.version 1 -> 2 -> 3 while updated_at is refreshed each time and created_at never moves."
        test_recipe:
          setup: ["One customer exists at version 1."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators" }
              as: Dispatcher
              captures: { cust_id: $.data.id, v1: $.data.version, created: $.data.created_at }
          trigger:
            - call: "POST /customers/${cust_id}/credit-status"
              payload: { credit_hold: true, reason: "aged receivable" }
              as: BillingClerk
              captures: { v2: $.data.version, u2: $.data.updated_at }
            - call: "POST /customers/${cust_id}/credit-status"
              payload: { credit_hold: false }
              as: BillingClerk
              captures: { v3: $.data.version, created3: $.data.created_at, hold3: $.data.credit_hold }
          assert:
            - "${v1} == 1, ${v2} == 2, ${v3} == 3"
            - "${created3} == ${created}   (created_at never changes)"
            - "${u2} is an ISO 8601 UTC timestamp with three fractional digits"
            - "${hold3} == false"

