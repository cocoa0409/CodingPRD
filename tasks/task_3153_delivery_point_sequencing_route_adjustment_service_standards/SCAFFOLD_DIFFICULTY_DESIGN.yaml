              as: RouteSupervisor
              captures: { adj_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_a}/evaluations/${eval_id}/adjustments/${adj_id}/submit"
              payload: {}
              as: RouteSupervisor
              as_user_id: "sup-maria"
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_a}/evaluations/${eval_id}/adjustments/${adj_id}/approve"
              payload: {}
              as: Postmaster
              as_user_id: "pm-owens"
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/delivery-units/${unit_id}/routes/${route_a}"
              payload: {}
              as: RouteSupervisor
              captures: { count_a_after: $.data.active_delivery_point_count }
            - call: "GET /api/delivery-units/${unit_id}/routes/${route_b}"
              payload: {}
              as: RouteSupervisor
              captures: { count_b_after: $.data.active_delivery_point_count }
          assert:
            - "before the cascade: route A active_delivery_point_count == 2 and route B == 0 (unit-wide sum 2)"
            - "after the EFFECTIVE cascade: CarrierRoute.${route_a}.active_delivery_point_count == 1 AND CarrierRoute.${route_b}.active_delivery_point_count == 1"
            - "invariant: 1 + 1 == 2 — the unit-wide sum is conserved by the transfer (no point created, destroyed, or double-counted)"
            - "DeliveryPoint.${p2}.active_route_id == ${route_b} and DeliveryPoint.${p1}.active_route_id == ${route_a} (exactly one route claims each point)"
