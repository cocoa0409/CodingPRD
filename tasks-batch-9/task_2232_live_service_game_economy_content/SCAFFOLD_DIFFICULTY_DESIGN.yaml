          Half-open windows with a 30-minute buffer appended to the END only: event B starting
          at 02:15 still collides with event A ending at 02:00 (occupied to 02:30), so the
          AGGREGATE load 6000 + 4500 = 10500 exceeds the 10000 CCU ceiling and is refused, while
          an otherwise identical 4000-CCU event lands on exactly 10000 and is admitted.
