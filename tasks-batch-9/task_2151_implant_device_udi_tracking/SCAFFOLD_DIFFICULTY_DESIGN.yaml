              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v1: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v1}" }
              as: ReceivingTech
