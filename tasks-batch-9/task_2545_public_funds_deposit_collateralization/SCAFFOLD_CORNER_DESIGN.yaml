              captures: { err_balance: $.data.error_id }
          assert:
            - "The setup deposit of exactly 100000000 succeeded (total_deposit_balance_cents == statutory_max_deposit_cents is allowed — the check is <=, not <)"
            - "One-cent overshoot: 422 with error_id 'ERR_STATUTORY_DEPOSIT_LIMIT'"
            - "Balance+1 withdrawal: 422 with error_id 'ERR_INSUFFICIENT_LEDGER_BALANCE'"
            - "After both rejections DepositAccount.${acct_id}.ledger_balance_cents == 100000000 and version is unchanged from the value after the setup deposit — a rejected fiscal write leaves no partial ledger effect"
            - "PublicUnit.${unit_id}.total_deposit_balance_cents == 100000000 and total_uninsured_cents == 75000000 are likewise unchanged"
            - "A withdrawal of exactly 100000000 would succeed; the rejected amount differs by a single cent"

      - name: duplicate_identifier_rejected_per_scoping_parent
        claim_type: violation_to_error
        grounds: ["validations[72]", "errors[ERR_DUPLICATE_IDENTIFIER]", entities.CollateralAsset.fields.cusip, entities.PledgeAgreement.fields.agreement_number, entities.SafekeepingReceipt.fields.receipt_number]
        distinguishing_aspect: "All three uniqueness constraints are scoped, not global: cusip and agreement_number are unique per depository_id while receipt_number is unique per pledge_agreement_id, so re-using 'RC-0001' under a SECOND agreement of the same depository must succeed while re-using it under the same agreement is ERR_DUPLICATE_IDENTIFIER (409)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; APPROVED tri-party custodian; APPROVED depository; funded DEMAND DEDICATED account."
            - "Two EXECUTED agreements AG-0001 and AG-0002 on that account; asset CU-0001; receipt RC-0001 already issued under AG-0001."
