      - name: cycle_financials_excludes_stale_supply_plan_from_plan_value
        claim_type: Input Set Filtering
        grounds:
          - calculations.calc_cycle_financials
          - state_machines.SupplyPlan.PLANNED_to_STALE
          - entities.PlanningCycle.fields.plan_value_cents
          - endpoints[POST /sop/items/{item_id}/inventory-policy]
        distinguishing_aspect: |
          plan_value_cents sums {PLANNED, RATIONED, COMMITTED} and excludes STALE, and
          constrained_plan_count counts only {PLANNED, RATIONED} with a binding constraint. One
          inventory-policy reset therefore drives plan_value from 900_000 to 0, gross_gap from
          1_100_000 to the full 2_000_000 commitment, and constrained_plan_count from 1 to 0 —
          the plan's own constrained_units field is NOT zeroed, it is simply out of scope.
        test_recipe:
          setup:
            - "The base family and customer, a MATURE item at 95.0 / 0.20 / 30 (safety_stock_units 330), a 9-hour block inside 2026-09 (900 units), and a cycle over 2026-09..2026-09 with financial_commitment_cents 2_000_000."
            - "One locked forecast of 1000 units and one PLANNED SupplyPlan with constrained_units 900 and constraint_type CAPACITY."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
