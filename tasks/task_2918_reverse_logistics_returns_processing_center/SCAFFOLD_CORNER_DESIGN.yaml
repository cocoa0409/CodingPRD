          - calculations.shrink_ledger_entry_amount
        distinguishing_aspect: "Abandoning a TEST_FAILED work order applies three side effects in one call: total_cost_cents is sealed at 3278 == round_half_up((30 * 95) * 1.15), a REFURB_COST ledger row of -3278 is appended, and the line returns to DISPOSITION_ASSIGNED with refurb_eligible_effective forced false so the decision rules re-resolve it to LIQUIDATE."
