        distinguishing_aspect: "Lab result posting is Agronomist-exclusive; CreditManager is denied."
        test_recipe:
          setup: ["grower, field, soil test SAMPLED"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "RBAC3 Farms", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "RC Field", acres: 50 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
