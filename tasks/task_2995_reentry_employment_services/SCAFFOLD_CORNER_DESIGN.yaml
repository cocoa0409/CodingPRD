    - calculations.participant_engagement_posture
    distinguishing_aspect: 'The suspension cascade reaches across to SessionEnrollment but only for rows still ENROLLED
      on a SCHEDULED session: the ATTENDED row on the past session keeps its seat, so one session''s enrolled_count
      drops to 0 while the other stays at 1.'
    test_recipe:
      setup:
      - Participant p1 with two enrollments
      - ReadinessSession sb on 2026-08-05 13:00-15:00Z (seat_capacity 2) — p1's enrollment there marked ATTENDED at
        clock 2026-08-05T14:00Z
      - ReadinessSession sa on 2026-08-06 13:00-15:00Z (seat_capacity 3) — p1 still ENROLLED and the session still
        SCHEDULED
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
