        claim_type: correct_result
        grounds: ["calculations.order_pricing"]
        excluded_because:
          difficulty_instance: order_pricing_budget_vs_contract_divergence
          rationale: "BUDGET 173895 vs CONTRACT 185670 literals asserted in the named §1.8 instance."
      - name: per_line_rounding_covered
        claim_type: precision
        grounds: ["calculations.invoice_line_rounding"]
        excluded_because:
          difficulty_instance: invoice_per_line_rounding_then_sum
          rationale: "Per-line-then-sum 664323 vs sum-then-round 664319 asserted in the named §1.8 instance."
      - name: freight_evaluation_order_covered
        claim_type: correct_result
        grounds: ["calculations.freight_fee_schedule"]
        excluded_because:
          difficulty_instance: freight_keyed_on_merchandise_not_total
          rationale: "Merchandise-keyed freight (79372, not total-keyed 61910) asserted in the named §1.8 instance."
      - name: trip_fill_variants_covered
        claim_type: variant_divergence
        grounds: ["calculations.trip_fill_efficiency"]
        excluded_because:
          difficulty_instance: trip_fill_projected_vs_realized_divergence
          rationale: "PROJECTED 60.0 vs REALIZED 50.0 asserted in the named §1.8 instance."
