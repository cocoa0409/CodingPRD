# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Every rule carries >= 2 instances (>= 18 total). Every grounds[] ref resolves
# into SCAFFOLD.yaml. Every assert literal was computed against the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: flight_charge_hobbs_vs_tach_diverge
        grounds:
          - calculations.flight_charge
          - entities.Aircraft.fields.billing_basis
          - entities.FlightLog.fields.billed_hours
          - state_machines.FlightLog.DRAFT_to_POSTED
        distinguishing_aspect: |
          Same physical flight (hobbs 100.0->101.7, tach 200.0->201.4) billed on a
          HOBBS-basis aircraft yields total_charge_cents 35700 (billed 1.7h) while a
          TACH-basis aircraft yields 29400 (billed 1.4h) — divergence is on the
          FlightLog/Aircraft domain.
        test_recipe:
          setup:
            - "Two aircraft, identical rates (15000 c/hr) and one DUAL instructor (6000 c/hr); one billing_basis=HOBBS, one billing_basis=TACH."
            - "Student with 100000c deposit; ACTIVE enrollment; two dispatched bookings (one per aircraft, DUAL, 2.0h)."
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Hal Hobbs", email: "hal@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 100000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Iris CFI", email: "iris@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO","XC"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "N100HB", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 100.0, initial_tach: 200.0 }
              as: SchoolAdmin
              captures: { ac_hobbs_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "N200TC", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "TACH", initial_hobbs: 100.0, initial_tach: 200.0 }
              as: SchoolAdmin
              captures: { ac_tach_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "GET /flight-school/aircraft/${ac_hobbs_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_hobbs_id_1: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_hobbs_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${acv_ac_hobbs_id_1}" }
              as: Dispatcher
              captures: { bk_hobbs_id: $.data.id }
            - call: "POST /flight-school/bookings/${bk_hobbs_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /flight-school/bookings/${bk_hobbs_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "GET /flight-school/aircraft/${ac_tach_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_tach_id_2: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_tach_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-02T14:00:00.000Z", end_at: "2026-07-02T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${acv_ac_tach_id_2}" }
              as: Dispatcher
              captures: { bk_tach_id: $.data.id }
            - call: "POST /flight-school/bookings/${bk_tach_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /flight-school/bookings/${bk_tach_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /flight-school/flight-logs"
              payload: { booking_id: "${bk_hobbs_id}", hobbs_start: 100.0, hobbs_end: 101.7, tach_start: 200.0, tach_end: 201.4, landings: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { fl_hobbs_id: $.data.id }
            - call: "POST /flight-school/flight-logs"
              payload: { booking_id: "${bk_tach_id}", hobbs_start: 100.0, hobbs_end: 101.7, tach_start: 200.0, tach_end: 201.4, landings: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { fl_tach_id: $.data.id }
          trigger:
            - call: "POST /flight-school/flight-logs/${fl_hobbs_id}/post"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { hobbs_total: $.data.total_charge_cents }
            - call: "POST /flight-school/flight-logs/${fl_tach_id}/post"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { tach_total: $.data.total_charge_cents }
          assert:
            - "FlightLog.${fl_hobbs_id}.billed_hours == 1.7"
            - "FlightLog.${fl_hobbs_id}.total_charge_cents == 35700"
            - "FlightLog.${fl_tach_id}.billed_hours == 1.4"
            - "FlightLog.${fl_tach_id}.total_charge_cents == 29400"

      - name: deposit_settlement_provisional_vs_final
        grounds:
          - calculations.deposit_settlement
          - entities.Student.fields.deposit_held_cents
          - entities.Student.fields.deposit_consumed_cents
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - state_machines.FlightLog.DRAFT_to_POSTED
        distinguishing_aspect: |
          On the Student deposit domain (distinct from flight_charge's FlightLog
          domain), the provisional variant holds the 42000c estimate at confirm
          (held=42000, balance=58000) while the final variant releases that and
          consumes the 35700c actual at post (held=0, consumed=35700, balance=64300).
        test_recipe:
          setup:
            - "Student with 100000c deposit; ACTIVE enrollment; HOBBS aircraft 15000c/hr; DUAL instructor 6000c/hr."
            - "One DUAL booking, 2.0h estimate (estimated_cost_cents=42000)."
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Dee Pos", email: "dee@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 100000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Iris CFI", email: "iris@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "N100HB", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 100.0, initial_tach: 200.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "GET /flight-school/aircraft/${ac_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_id_3: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${acv_ac_id_3}" }
              as: Dispatcher
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /flight-school/bookings/${bk_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /flight-school/bookings/${bk_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /flight-school/flight-logs"
              payload: { booking_id: "${bk_id}", hobbs_start: 100.0, hobbs_end: 101.7, tach_start: 200.0, tach_end: 201.4, landings: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { fl_id: $.data.id }
            - call: "POST /flight-school/flight-logs/${fl_id}/post"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          assert:
            - "After confirm: Student.${stu_id}.deposit_held_cents == 42000 and deposit_balance_cents == 58000 and deposit_consumed_cents == 0"
            - "After post: Student.${stu_id}.deposit_held_cents == 0 and deposit_consumed_cents == 35700 and deposit_balance_cents == 64300"
            - "Booking.${bk_id}.estimated_cost_cents == 42000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booking_cost_estimate_tiered_surcharge_branches
        grounds:
          - calculations.booking_cost_estimate
          - entities.Aircraft.fields.is_complex
          - entities.Booking.fields.estimated_cost_cents
          - entities.Booking.fields.lesson_type
        distinguishing_aspect: |
          Mode (a) non-linear: estimate combines >=3 inputs (aircraft rate, CFI
          rate, estimated_hours) with a conditional complex-surcharge tier — DUAL
          on a complex aircraft at 2.0h (tier1 10%) gives 36000+3600+14000=53600,
          but at 2.5h (tier2 15%) gives 45000+6750+17500=69250.
        test_recipe:
          setup:
            - "Complex aircraft 18000c/hr; DUAL instructor 7000c/hr; ACTIVE enrollment with 200000c deposit."
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Cy Plex", email: "cy@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 200000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "COMMERCIAL", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Iris CFI", email: "iris@x.com", cfi_rate_cents_per_hour: 7000, authorized_endorsement_codes: ["COMPLEX"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "N1CPX", model: "PA28R", rental_rate_cents_per_hour: 18000, billing_basis: "HOBBS", initial_hobbs: 50.0, initial_tach: 40.0, is_complex: true }
              as: SchoolAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "GET /flight-school/aircraft/${ac_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_id_4: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${acv_ac_id_4}" }
              as: Dispatcher
              captures: { bk_tier1_id: $.data.id }
            - call: "GET /flight-school/aircraft/${ac_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_id_5: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-02T14:00:00.000Z", end_at: "2026-07-02T17:00:00.000Z", estimated_hours: 2.5, expected_aircraft_version: "${acv_ac_id_5}" }
              as: Dispatcher
              captures: { bk_tier2_id: $.data.id }
          assert:
            - "Booking.${bk_tier1_id}.estimated_cost_cents == 53600"
            - "Booking.${bk_tier2_id}.estimated_cost_cents == 69250"

      - name: flight_charge_round_hours_then_cents_order
        grounds:
          - calculations.flight_charge
          - entities.FlightLog.fields.billed_hours
          - entities.FlightLog.fields.aircraft_charge_cents
          - state_machines.FlightLog.DRAFT_to_POSTED
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: raw HOBBS delta 1.25 rounds
          to tenths FIRST (1.3), then 15000*1.3 -> 19500c. Rounding to cents on the
          raw product instead would give 18750c — the scaffold pins round-hours-then-cents.
        test_recipe:
          setup:
            - "HOBBS aircraft 15000c/hr; SOLO booking (no instructor charge) so aircraft portion is isolated; raw hobbs delta 1.25h."
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Ron Round", email: "ron@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 100000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Iris CFI", email: "iris@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "N3RND", model: "C152", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 300.0, initial_tach: 250.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /flight-school/endorsements"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${instr_id}", endorsement_code: "SOLO" }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "GET /flight-school/aircraft/${ac_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_id_6: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", lesson_type: "SOLO", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 1.3, expected_aircraft_version: "${acv_ac_id_6}" }
              as: Dispatcher
              captures: { bk_id: $.data.id }
            - call: "POST /flight-school/bookings/${bk_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /flight-school/bookings/${bk_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /flight-school/flight-logs"
              payload: { booking_id: "${bk_id}", hobbs_start: 300.0, hobbs_end: 301.25, tach_start: 250.0, tach_end: 251.0, landings: 2 }
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { fl_id: $.data.id }
          trigger:
            - call: "POST /flight-school/flight-logs/${fl_id}/post"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          assert:
            - "FlightLog.${fl_id}.billed_hours == 1.3"
            - "FlightLog.${fl_id}.aircraft_charge_cents == 19500"
            - "FlightLog.${fl_id}.instructor_charge_cents == 0"
            - "FlightLog.${fl_id}.total_charge_cents == 19500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: aircraft_cyclic_available_grounded_available
        grounds:
          - state_machines.Aircraft.AVAILABLE_to_GROUNDED
          - state_machines.Aircraft.GROUNDED_to_AVAILABLE
          - state_machines.Squawk.OPEN_to_RESOLVED
          - entities.Aircraft.fields.status
        distinguishing_aspect: |
          Aircraft is a cycle: a grounding Squawk OPEN drives AVAILABLE->GROUNDED,
          and resolving the last OPEN grounding squawk drives GROUNDED->AVAILABLE,
          returning to the initial state — distinct entity from StageCheck's cycle.
        test_recipe:
          setup:
            - "One AVAILABLE aircraft with no open squawks."
          setup_api_calls:
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "N9CYC", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 10.0, initial_tach: 8.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /flight-school/squawks"
              payload: { aircraft_id: "${ac_id}", description: "Oil leak", is_grounding: true }
              as: Mechanic
              captures: { sq_id: $.data.id }
          trigger:
            - call: "POST /flight-school/squawks/${sq_id}/resolve"
              payload: {}
              as: Mechanic
          assert:
            - "After squawk OPEN: Aircraft.${ac_id}.status == GROUNDED and open_squawk_count == 1"
            - "After resolve: Aircraft.${ac_id}.status == AVAILABLE and open_squawk_count == 0"

      - name: stage_check_cyclic_failed_retry_scheduled
        grounds:
          - state_machines.StageCheck.IN_PROGRESS_to_FAILED
          - state_machines.StageCheck.SCHEDULED_to_IN_PROGRESS
          - entities.StageCheck.fields.retry_of_stage_check_id
          - entities.Enrollment.fields.current_stage_index
        distinguishing_aspect: |
          StageCheck loops FAILED->SCHEDULED(retry)->IN_PROGRESS on a different
          entity than Aircraft: a failed stage 1 leaves current_stage_index at 1,
          and a retry StageCheck (retry_of_stage_check_id set) re-enters SCHEDULED.
        test_recipe:
          setup:
            - "ACTIVE enrollment (current_stage_index=1); one SCHEDULED stage check at stage 1; an examiner CFI."
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Stu Stage", email: "stu@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 60000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Ed Examiner", email: "ed@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /flight-school/stage-checks"
              payload: { enrollment_id: "${enr_id}", examiner_instructor_id: "${instr_id}", stage_index: 1 }
              as: SchoolAdmin
              captures: { sc1_id: $.data.id }
            - call: "POST /flight-school/stage-checks/${sc1_id}/begin"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /flight-school/stage-checks/${sc1_id}/fail"
              payload: { result_note: "Steep turns unsat" }
              as: Instructor
              as_user_id: "${instr_id}"
          trigger:
            - call: "POST /flight-school/stage-checks"
