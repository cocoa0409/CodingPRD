            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "QL1", full_name: "Quinn Li", role: QUALITY_LEAD, authority_tier: TIER_3 }, captures: { ql1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: EMAIL, received_at: "2026-08-01T00:00:00Z", raw_message: "Stale pack." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710" }, captures: { cp1: "$.data.id" } }
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Mild." }, captures: { vold: "$.data.version" } }
            - { call: "POST /complaints/${cp1}/quality-hold", as: QualityLead, as_user_id: "${ql1}", payload: { reason: "Brief look." } }
            - { call: "POST /complaints/${cp1}/release-hold", as: QualityLead, as_user_id: "${ql1}", payload: { reason: "Cleared." }, captures: { vnew: "$.data.version" } }
          trigger:
            - { call: "POST /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", remedy_type: COUPON, requested_value_cents: 1500, expected_complaint_version: "${vold}" }, captures: { err: "$.data.error_id" } }
            - { call: "GET /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}" }, captures: { tc0: "$.total_count" } }
            - { call: "POST /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", remedy_type: COUPON, requested_value_cents: 1500, expected_complaint_version: "${vnew}" }, captures: { rm: "$.data.id", py: "$.data.payout_cents" } }
            - { call: "GET /complaints/${cp1}", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { vafter: "$.data.version" } }
            - { call: "POST /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", remedy_type: COUPON, requested_value_cents: 1500, expected_complaint_version: "${vnew}" }, captures: { err2: "$.data.error_id" } }
          assert:
            - "the quality-hold round trip advanced the complaint's version twice, so the version captured at triage is two behind"
            - "the write with the stale version returns HTTP 412 with data.error_id == \"ERR_STALE_COMPLAINT_VERSION\", and GET /remedies?complaint_id=... has total_count == 0 — the refusal wrote nothing"
            - "the same body with the current version is accepted with HTTP 201 and payout_cents 1650 (base 1500, uplift 0.10 giving 150)"
            - "creating the remedy itself advanced the complaint's version again, so vafter is one more than vnew"
            - "replaying the now-consumed version returns HTTP 412 \"ERR_STALE_COMPLAINT_VERSION\" — a version token is single-use"

