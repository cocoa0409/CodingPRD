- section: cross_cutting_complexity_layers
  instances:
  - name: offer_quoting_a_superseded_agreement_version_is_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[offer-create-stale-agreement]
    - errors[ERR_STALE_AGREEMENT_VERSION]
    distinguishing_aspect: |
      OCC claim for concurrency_rules[offer-create-stale-agreement]: the version captured when the agreement was created is stale once the opening PROPOSAL bumps it, so a second offer quoting ${agr_v0} is rejected with 412 and the standing offer is left OPEN.
    test_recipe:
      setup:
      - A carrier with a DRAFT agreement created at version 1, captured as agr_v0.
      - One OPEN PROPOSAL at 0.061250 has already been appended, which advanced the agreement to version 2.
      - The client has not re-read the agreement.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      trigger:
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: COUNTER
          reciprocal_rate_per_mou_usd: 0.058000
          term_months: 24
          poi_financial_responsibility: CLEC
          transit_traffic_allowed: false
        as: CarrierRepresentative
        as_user_id: ${car_id}
        captures:
          e1: $.data.error_id
      assert:
      - response.status == 412 and response.data.error_id == ERR_STALE_AGREEMENT_VERSION
      - InterconnectionAgreement.${agr_id}.version is still 2, negotiation_round is still 1 and status is still PROPOSED
      - NegotiationOffer.${offer1_id}.status is still OPEN with responded_at null
      - GET /interconnection/agreements/${agr_id}/offers returns total_count == 1
  - name: offer_quoting_the_re_read_agreement_version_succeeds_and_bumps_it
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[offer-create-stale-agreement]
    - state_machines.NegotiationOffer.OPEN_to_SUPERSEDED
    distinguishing_aspect: |
      OCC positive branch for the same rule: re-reading the agreement yields version 2, the counter quoting it is accepted, the version advances to 3 and the prior offer is SUPERSEDED with its successor recorded.
    test_recipe:
      setup:
      - A carrier with a DRAFT agreement carrying one OPEN PROPOSAL at 0.061250, so the agreement is at version 2.
      - The client re-read the agreement and captured version 2 as agr_v1.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: GET /interconnection/agreements/${agr_id}
        payload: {}
        as: InterconnectionManager
        captures:
          agr_v1: $.data.version
      trigger:
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v1}
          offer_type: COUNTER
          reciprocal_rate_per_mou_usd: 0.058000
          term_months: 24
          poi_financial_responsibility: CLEC
          transit_traffic_allowed: false
        as: CarrierRepresentative
        as_user_id: ${car_id}
        captures:
          offer2_id: $.data.id
      assert:
      - response.status == 201 and NegotiationOffer.${offer2_id}.status == OPEN with offering_party COUNTERPARTY_SIDE and round_number 2
      - InterconnectionAgreement.${agr_id}.version == 3 and negotiation_round == 2
      - NegotiationOffer.${offer1_id}.status == SUPERSEDED with responded_at stamped 2026-08-01T00:00:00Z
      - 'InterconnectionAgreement.${agr_id}.status == COUNTERED, not EXECUTED: a counter does not execute the agreement'
  - name: factor_filing_quoting_a_superseded_carrier_version_is_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[factor-filing-create-stale-carrier]
    - errors[ERR_STALE_CARRIER_VERSION]
    distinguishing_aspect: |
      OCC claim for concurrency_rules[factor-filing-create-stale-carrier]: a different parent entity and a different occ_field. The carrier version captured at registration is stale once the 2026Q3 filing bumps it, so a 2026Q4 filing quoting ${car_v0} is rejected with 412 even though its quarter slot is free.
    test_recipe:
      setup:
      - A carrier registered at version 1, captured as car_v0.
      - A 2026Q3 filing at PIU 50.00 / PLU 10.00 has already been created, which advanced the carrier to version 2.
      - The client has not re-read the carrier.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/traffic-factor-filings
        payload:
          carrier_id: ${car_id}
          expected_carrier_version: ${car_v0}
          quarter: 2026Q3
          reported_piu_pct: 50.00
          reported_plu_pct: 10.00
        as: AccessBillingAnalyst
        captures:
          ff_id: $.data.id
      trigger:
      - call: POST /interconnection/traffic-factor-filings
        payload:
          carrier_id: ${car_id}
          expected_carrier_version: ${car_v0}
          quarter: 2026Q4
          reported_piu_pct: 45.00
          reported_plu_pct: 15.00
        as: AccessBillingAnalyst
        captures:
          e1: $.data.error_id
      assert:
      - response.status == 412 and response.data.error_id == ERR_STALE_CARRIER_VERSION
      - Carrier.${car_id}.version is still 2
      - GET /interconnection/carriers/${car_id}/traffic-factor-filings returns total_count == 1, holding only the 2026Q3 filing
      - TrafficFactorFiling.${ff_id}.status is still REPORTED with effective_piu_pct 50.00
  - name: cascade_chain_verified_end_to_end
    claim_type: cascading_side_effects
    grounds:
    - state_machines.TrafficFactorFiling.DISPUTED_to_AUDITED
    excluded_because:
      difficulty_instance: transitive_cascade / factor_audit_cascade_batch_to_invoice_to_carrier_to_ledger
      rationale: The named §1.8 instance verifies the four-level audit cascade (batch re-rate -> invoice re-bill -> carrier reserve -> ledger entry) end to end.
  - name: both_calculation_variants_produce_their_expected_results
    claim_type: dual_variant_calculation
    grounds:
    - calculations.reserve_provision.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / reserve_provision_regulatory_versus_gaap_basis_on_carrier
      rationale: The named §1.8 instance asserts the regulatory and GAAP reserve bases and the delta between them on one carrier.
  - name: cumulative_threshold_tested_at_its_boundary
    claim_type: rate_threshold_triggers
    grounds:
    - calculations.trunk_sizing_and_blocking
    excluded_because:
      difficulty_instance: boundary_precision_check / blocking_pct_exactly_three_percent_triggers_augment
      rationale: The named §1.8 instance probes blocking at 2.99 and at exactly 3.00 percent against BLOCKING_THRESHOLD_PCT.
- section: consistency_model
  instances:
  - name: payment_response_already_shows_the_recomputed_invoice_position
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - state_machines.AccessInvoice.UNPAID_to_PARTIALLY_PAID
    distinguishing_aspect: |
      Immediate-consistency claim: the denormalised payment fields are recomputed inside the write, so the POST /payments response itself already reports paid_amount_usd 10.00, open_balance_usd 22.47 and payment_status PARTIALLY_PAID with no re-read.
    test_recipe:
      setup:
      - A carrier with an ISSUED invoice of 32.47 due 2026-10-01 and no payment yet.
      - Logical clock at 2026-09-01T00:00:00Z.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-INT-001
          rate_element: INTERSTATE_SWITCHED_ACCESS
          rate_per_mou_usd: 0.512500
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_int_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_int_id}/approve
