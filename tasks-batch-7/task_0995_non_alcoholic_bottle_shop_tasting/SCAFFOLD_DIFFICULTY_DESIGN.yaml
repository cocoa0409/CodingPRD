  # ==========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_priority
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_AGE_ATTESTATION_REQUIRED]
        distinguishing_aspect: |
          Priority pair (state vs business_safety): Order is already PACKED
          (state violation for submit) AND member is not ATTESTED for an
          ADULT_ONLY_REQUIRED SKU (business_safety violation). Priority 5
          (state) MUST fire before priority 6 (business_safety).
        test_recipe:
          setup:
            - "SKU sku-adult abv=200; lot qty=10"
            - "Member m9 UNVERIFIED (not ATTESTED)"
            - "ShippingStateRule CA allows_dtc=true abv_cap=500"
            - "Order already in PACKED state (via prior submit+pack by an ATTESTED member scenario; for this test, we engineer it by creating the order under a DIFFERENT attested member, then attempting submit as m9)"
            - "Note: actual construction — order is created and submitted by an ATTESTED member m9a (so it reaches PACKED); then m9 (UNVERIFIED) attempts to submit it again with a stale version"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tea9", display_name: "Tea 9", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat9_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat9_id}", sku_code: "sku-a9", title: "A9", base_price_cents: 2000, abv_basis_points: 200 }
              as: PlatformAdmin
              captures:
                sku9_id: "$.data.id"
            - call: "POST /nabs/skus/${sku9_id}/lots"
              payload: { lot_code: "L9", qty_received: 10, unit_cost_cents: 500, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "m9a@x.com", full_name: "M Nine A", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member9a_id: "$.data.id"
            - call: "POST /nabs/members/${member9a_id}/attestations"
              payload: { attested_by_user_id: "staff1", outcome: "APPROVED", attested_on: "2026-05-01", document_reference: "d1" }
              as: ShopStaff
              captures:
                att9_id: "$.data.id"
            - call: "POST /nabs/members/${member9a_id}/attestations/${att9_id}/approve"
              as: ComplianceOfficer
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "CA", allows_dtc: true, min_age_years: 0, abv_cap_basis_points: 500, surcharge_cents_per_order: 0, tax_rate_bps: 0 }
              as: PlatformAdmin
            - call: "POST /nabs/orders"
              payload: { member_id: "${member9a_id}", channel: "DTC", ship_to_state_code: "CA" }
              as: Member
              as_user_id: "${member9a_id}"
              captures:
                order9_id: "$.data.id"
            - call: "POST /nabs/orders/${order9_id}/lines"
              payload: { sku_id: "${sku9_id}", qty: 1 }
              as: Member
              as_user_id: "${member9a_id}"
            - call: "GET /nabs/orders/${order9_id}"
              as: Member
              as_user_id: "${member9a_id}"
              captures:
                order9_v: "$.data.version"
            - call: "POST /nabs/orders/${order9_id}/submit"
              payload: { expected_order_version: "${order9_v}" }
              as: Member
              as_user_id: "${member9a_id}"
            - call: "POST /nabs/orders/${order9_id}/pack"
              as: ShopStaff
            - call: "GET /nabs/orders/${order9_id}"
              as: ShopStaff
              captures:
                order9_v2: "$.data.version"
          trigger:
            # Try to submit again — state is PACKED (not DRAFT); the member is m9a (ATTESTED), so this isolates the state failure.
            # To force both state AND business_safety to be eligible, we instead revoke attestation first, then submit on PACKED order.
            - call: "POST /nabs/members/${member9a_id}/attestations/revoke"
              as: ComplianceOfficer
            - call: "POST /nabs/orders/${order9_id}/submit"
              payload: { expected_order_version: "${order9_v2}" }
              as: Member
              as_user_id: "${member9a_id}"
              captures:
                err9: "$.data.error_id"
          assert:
            - "captured err9 == 'ERR_INVALID_STATE' (state priority 5 beats business_safety priority 6)"

      - name: business_referential_vs_business_fiscal_priority
        grounds:
          - validations[priority=13]
          - validations[priority=17]
          - errors[ERR_DTC_STATE_PROHIBITED]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: |
          Priority pair (business_referential vs business_fiscal): Order is DTC
          to a state with allows_dtc=false (referential violation at priority 13)
