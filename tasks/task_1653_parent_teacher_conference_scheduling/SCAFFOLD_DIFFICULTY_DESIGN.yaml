# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_1653_parent_teacher_conference_scheduling
# All numeric literals pre-computed from SCAFFOLD.yaml §1.3 formulas.
# Standard fixture window (unless overridden): L=20, B=5, travel=30,
# day 2026-10-05 15:00-19:00Z -> 8 slots/teacher starting at
# 15:00, 15:25, 15:50, 16:15, 16:55, 17:20, 17:45, 18:10 (break +15 after 4th).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: teacher_utilization_booked_vs_projected
        grounds:
          - calculations.teacher_utilization_pct
          - entities.Teacher
          - endpoints[GET /conf/teachers/{id}/summary]
        distinguishing_aspect: |
          Same window data yields two different utilization numbers on the Teacher/TimeSlot
          domain: the `booked` variant counts BOOKED slots only (4/8 = 50.00) while the
          `projected` variant adds HELD plus ceil(WAITING * 0.5) expected claims
          ((4 + 0 + ceil(2*0.5))/8 = 62.50).
        test_recipe:
          setup:
            - "Window BOOKING_OPEN with one teacher T1 (8 generated slots, cap 6)"
            - "Family F with students st1..st6, all homeroom-linked to T1"
            - "st1..st4 hold CONFIRMED bookings on slots 0..3 (IN_PERSON, gaps of 5 satisfy the buffer rule)"
            - "st5 and st6 have WAITING waitlist entries for T1"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6, family_conf_cap: 8, cancel_cutoff_hours: 24, waitlist_offer_ttl_hours: 24, no_show_strike_threshold: 3, auto_no_show_grace_hours: 24 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - call: "POST /conf/teachers"
              payload: { full_name: "T One", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true, supports_virtual: true }
              as: SchoolAdmin
              captures: { t1: $.data.id }
            - call: "POST /conf/windows/${w}/publish"
              payload: {}
              as: SchoolAdmin
              captures: { w_v2: $.data.version }
            - call: "POST /conf/windows/${w}/generate-slots"
              payload: { expected_window_version: "${w_v2}" }
              as: SchoolAdmin
            - call: "GET /conf/windows/${w}/slots"
              as: SchoolAdmin
              captures: { s0: "$.data[0].id", s1: "$.data[1].id", s2: "$.data[2].id", s3: "$.data[3].id" }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - call: "POST /conf/families"
              payload: { primary_guardian_name: "G F", email: "f@x.com" }
              as: FrontOfficeStaff
              captures: { fam: $.data.id }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S1", grade_level: 3 }, as: FrontOfficeStaff, captures: { st1: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S2", grade_level: 4 }, as: FrontOfficeStaff, captures: { st2: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S3", grade_level: 5 }, as: FrontOfficeStaff, captures: { st3: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S4", grade_level: 6 }, as: FrontOfficeStaff, captures: { st4: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S5", grade_level: 7 }, as: FrontOfficeStaff, captures: { st5: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S6", grade_level: 8 }, as: FrontOfficeStaff, captures: { st6: $.data.id } }
            - { call: "POST /conf/students/${st1}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${st2}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${st3}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${st4}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${st5}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${st6}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${st1}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}" }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s1}", student_id: "${st2}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}" }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s2}", student_id: "${st3}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}" }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s3}", student_id: "${st4}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}" }
            - { call: "POST /conf/waitlist-entries", payload: { window_id: "${w}", student_id: "${st5}", teacher_id: "${t1}", channel_pref: "EITHER" }, as: FamilyGuardian, as_user_id: "${fam}" }
            - { call: "POST /conf/waitlist-entries", payload: { window_id: "${w}", student_id: "${st6}", teacher_id: "${t1}", channel_pref: "EITHER" }, as: FamilyGuardian, as_user_id: "${fam}" }
          trigger:
            - call: "GET /conf/teachers/${t1}/summary"
              payload: { window_id: "${w}" }
              as: SchoolAdmin
          assert:
            - "response.data.bookable_slots == 8"
            - "response.data.booked_slots == 4"
            - "response.data.held_slots == 0"
            - "response.data.waiting_entries == 2"
            - "response.data.booked_utilization_pct == 50.00"
            - "response.data.projected_utilization_pct == 62.50"
            - "projected_utilization_pct != booked_utilization_pct (identical inputs, different variant semantics)"

      - name: family_risk_strict_vs_weighted
        grounds:
          - calculations.family_attendance_risk
          - entities.Family.fields.attendance_risk_strict
          - entities.Family.fields.attendance_risk_score
        distinguishing_aspect: |
          Same AttendanceRecord set on the Family domain yields strict 1.00 (NO_SHOW only)
          vs weighted 1.75 (1.0*NO_SHOW + 0.5*LATE + 0.25*EXCUSED) — a different entity
          domain from teacher_utilization_booked_vs_projected.
        test_recipe:
          setup:
            - "Window (no_show_strike_threshold 5) progressed to IN_PROGRESS"
            - "Family F with students st1..st3 homeroom-linked to T1, bookings on slots 0..2"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6, family_conf_cap: 8, cancel_cutoff_hours: 24, waitlist_offer_ttl_hours: 24, no_show_strike_threshold: 5, auto_no_show_grace_hours: 24 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T One", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id", s1: "$.data[1].id", s2: "$.data[2].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G F", email: "f@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S1", grade_level: 3 }, as: FrontOfficeStaff, captures: { st1: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S2", grade_level: 4 }, as: FrontOfficeStaff, captures: { st2: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S3", grade_level: 5 }, as: FrontOfficeStaff, captures: { st3: $.data.id } }
            - { call: "POST /conf/students/${st1}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${st2}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${st3}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${st1}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { b1: $.data.id } }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s1}", student_id: "${st2}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { b2: $.data.id } }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s2}", student_id: "${st3}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { b3: $.data.id } }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/lock", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/start", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T15:30:00Z" }, as: SchoolAdmin }
            - { call: "POST /conf/bookings/${b1}/attendance", payload: { outcome: "NO_SHOW" }, as: FrontOfficeStaff }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T15:50:00Z" }, as: SchoolAdmin }
            - { call: "POST /conf/bookings/${b2}/attendance", payload: { outcome: "LATE" }, as: FrontOfficeStaff }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T16:15:00Z" }, as: SchoolAdmin }
            - { call: "POST /conf/bookings/${b3}/attendance", payload: { outcome: "EXCUSED" }, as: FrontOfficeStaff }
          trigger:
            - call: "GET /conf/families/${fam}"
              as: FrontOfficeStaff
          assert:
            - "response.data.attendance_risk_strict == 1.00"
            - "response.data.attendance_risk_score == 1.75"
            - "response.data.no_show_strike_count == 1"
            - "attendance_risk_score != attendance_risk_strict although both derive from the same 3 AttendanceRecords"

  - rule_id: combinatorial_formula
    instances:
      - name: sibling_compactness_tiered_channel_switch
        grounds:
          - calculations.sibling_compactness_score
          - entities.Booking.fields.family_compactness_score
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with non-linear interaction — tiered gap
          penalties (<=15 -> 1, <=45 -> 3, else 8) multiplied by a channel-switch factor.
          Bookings [15:00-15:20 IN_PERSON] + [15:25-15:45 IN_PERSON] + [17:20-17:40 VIRTUAL]
          yield 1 + (8 * 2) = 17.00.
        test_recipe:
          setup:
            - "Window BOOKING_OPEN; teachers T1, T2, T3 (all BOTH channels, 8 slots each)"
            - "Family F with students A (link T1 homeroom), B (link T2 homeroom), C (link T3 homeroom)"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6, family_conf_cap: 8, cancel_cutoff_hours: 24, waitlist_offer_ttl_hours: 24, no_show_strike_threshold: 3, auto_no_show_grace_hours: 24 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true, supports_virtual: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/teachers", payload: { full_name: "T2", email: "t2@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true, supports_virtual: true }, as: SchoolAdmin, captures: { t2: $.data.id } }
            - { call: "POST /conf/teachers", payload: { full_name: "T3", email: "t3@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true, supports_virtual: true }, as: SchoolAdmin, captures: { t3: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/teachers/${t1}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin, captures: { t1s0: "$.data[0].id" } }
            - { call: "GET /conf/teachers/${t2}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin, captures: { t2s1: "$.data[1].id" } }
            - { call: "GET /conf/teachers/${t3}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin, captures: { t3s5: "$.data[5].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G F", email: "f@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "A", grade_level: 2 }, as: FrontOfficeStaff, captures: { stA: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "B", grade_level: 4 }, as: FrontOfficeStaff, captures: { stB: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "C", grade_level: 6 }, as: FrontOfficeStaff, captures: { stC: $.data.id } }
            - { call: "POST /conf/students/${stA}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${stB}/teacher-links", payload: { teacher_id: "${t2}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${stC}/teacher-links", payload: { teacher_id: "${t3}", is_homeroom: true }, as: FrontOfficeStaff }
          trigger:
            - { call: "POST /conf/bookings", payload: { slot_id: "${t1s0}", student_id: "${stA}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { bk1: $.data.id, score1: $.data.family_compactness_score } }
            - { call: "POST /conf/bookings", payload: { slot_id: "${t2s1}", student_id: "${stB}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { score2: $.data.family_compactness_score } }
            - { call: "POST /conf/bookings", payload: { slot_id: "${t3s5}", student_id: "${stC}", channel: "VIRTUAL" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { score3: $.data.family_compactness_score } }
            - { call: "GET /conf/bookings/${bk1}", as: FamilyGuardian, as_user_id: "${fam}", captures: { score1_after: $.data.family_compactness_score } }
          assert:
            - "first booking response family_compactness_score == 0.00 (single booking)"
            - "second booking response family_compactness_score == 1.00 (gap 5 min, same channel, tier 1)"
            - "third booking response family_compactness_score == 17.00 (1 + 8*2: 95-minute tier-3 gap with IN_PERSON->VIRTUAL switch)"
            - "GET of the first booking shows the recomputed family_compactness_score == 17.00 on every family booking in the window"

      - name: interpreter_pay_per_assignment_rounding_order
        grounds:
          - calculations.interpreter_pay_estimate
          - endpoints[GET /conf/interpreters/{id}/summary]
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-assignment-then-sum. Two
          20-minute CONFIRMED assignments at 6000 cents/hour give 2 * round(ceil(20/15)*15*6000/60)
          = 2 * 3000 = 6000 cents; the forbidden sum-then-round order would give
          round(ceil(40/15)*15*6000/60) = 4500 cents.
        test_recipe:
          setup:
            - "Window BOOKING_OPEN; teacher T1; interpreter I (languages [es], max_consecutive 120, base 600, rate 6000)"
            - "Families F1 (stA) and F2 (stB), both students homeroom-linked to T1"
            - "Bookings on slot 0 (F1) and slot 1 (F2), each with interpreter_language 'es'"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6, family_conf_cap: 8, cancel_cutoff_hours: 24, waitlist_offer_ttl_hours: 24, no_show_strike_threshold: 3, auto_no_show_grace_hours: 24 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id", s1: "$.data[1].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/interpreters", payload: { full_name: "I One", languages: ["es"], max_consecutive_minutes: 120, base_minutes_per_window: 600, hourly_rate_cents: 6000 }, as: SchoolAdmin, captures: { interp: $.data.id } }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G1", email: "f1@x.com", preferred_language: "es" }, as: FrontOfficeStaff, captures: { f1: $.data.id } }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G2", email: "f2@x.com", preferred_language: "es" }, as: FrontOfficeStaff, captures: { f2: $.data.id } }
            - { call: "POST /conf/families/${f1}/students", payload: { full_name: "A", grade_level: 3 }, as: FrontOfficeStaff, captures: { stA: $.data.id } }
            - { call: "POST /conf/families/${f2}/students", payload: { full_name: "B", grade_level: 3 }, as: FrontOfficeStaff, captures: { stB: $.data.id } }
            - { call: "POST /conf/students/${stA}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${stB}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${stA}", channel: "IN_PERSON", interpreter_language: "es" }, as: FamilyGuardian, as_user_id: "${f1}", captures: { bk1: $.data.id } }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s1}", student_id: "${stB}", channel: "IN_PERSON", interpreter_language: "es" }, as: FamilyGuardian, as_user_id: "${f2}", captures: { bk2: $.data.id } }
            - { call: "GET /conf/interpreter-requests", payload: { booking_id: "${bk1}" }, as: FrontOfficeStaff, captures: { r1: "$.data[0].id" } }
            - { call: "GET /conf/interpreter-requests", payload: { booking_id: "${bk2}" }, as: FrontOfficeStaff, captures: { r2: "$.data[0].id" } }
            - { call: "POST /conf/interpreter-requests/${r1}/assign", payload: { interpreter_id: "${interp}" }, as: FrontOfficeStaff }
            - { call: "POST /conf/interpreter-requests/${r2}/assign", payload: { interpreter_id: "${interp}" }, as: FrontOfficeStaff }
            - { call: "POST /conf/interpreter-requests/${r1}/accept", payload: {}, as: Interpreter, as_user_id: "${interp}" }
            - { call: "POST /conf/interpreter-requests/${r2}/accept", payload: {}, as: Interpreter, as_user_id: "${interp}" }
          trigger:
            - call: "GET /conf/interpreters/${interp}/summary"
              payload: { window_id: "${w}" }
              as: FrontOfficeStaff
          assert:
            - "response.data.confirmed_assignments == 2"
            - "response.data.committed_minutes_in_window == 40"
            - "response.data.pay_estimate_cents == 6000 (per-assignment rounding pinned; sum-then-round would give 4500)"

      - name: interpreter_capacity_circular_evaluation_order
        grounds:
          - calculations.interpreter_window_capacity
          - validations[priority=13]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: capacity = base - 10*floor(committed/45) consumes
          committed, and the eligibility check adds the candidate to committed. With base 100 and
          4 accepted 20-minute assignments the pinned order yields allowance 10, capacity 90,
          headroom 10, so the 5th assignment (80 + 20 = 100 > 90) is rejected; evaluating capacity
          before accounting committed would wrongly show headroom 20 and allow it.
        test_recipe:
          setup:
            - "Window BOOKING_OPEN; teacher T1; interpreter I (languages [es], max_consecutive 30, base 100, rate 6000)"
            - "Family F with students st1..st5 homeroom-linked to T1"
