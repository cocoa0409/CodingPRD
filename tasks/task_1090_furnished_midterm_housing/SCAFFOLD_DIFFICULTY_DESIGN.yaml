  - rule_id: boundary_precision_check
    instances:
      - name: tax_exempt_30_day_boundary
        grounds:
          - calculations.occupancy_tax
          - entities.TaxAssessment.fields.taxable
          - state_machines.Booking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Metric = assessed_term_days at the TAX_EXEMPT_MIN_DAYS=30 threshold
          (>=): a 29-day booking is taxable (tax 40600) while a 30-day booking
          is exempt (tax 0). Observed at booking confirm (creates TaxAssessment).
        test_recipe:
          setup:
            - "Verified host, two verified tenants, two LISTED units with min_term_days 7, rate 300000, cleaning_included true"
            - "Booking b29 [2026-06-01,2026-06-30] (term 29) and b30 [2026-06-01,2026-07-01] (term 30), each confirmed"
