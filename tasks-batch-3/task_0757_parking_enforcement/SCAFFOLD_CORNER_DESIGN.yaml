          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-RB2", full_name: "O RB2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RBB2", name: "RbacBeat2", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "RB2PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/rb2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
          trigger:
            - { call: "POST /citations/${cit_id}/void", payload: {}, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 403"
            - "response error_id == ERR_UNAUTHORIZED"

      - name: officer_issue_on_other_officers_shift_returns_not_owner
        claim_type: RBAC denial
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: "An EnforcementOfficer issuing a citation on a shift owned by a DIFFERENT officer is rejected with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Officer A owns an OPEN shift; Officer B exists; a vehicle and ACTIVE code exist."]
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-RB3A", full_name: "Officer A" }, as: Admin, captures: { officer_a: "$.data.id" } }
            - { call: "POST /officers", payload: { badge_number: "B-RB3B", full_name: "Officer B" }, as: Admin, captures: { officer_b: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RBB3", name: "RbacBeat3", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "RB3PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_a}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_a}", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/rb3.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 403"
            - "response error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_role_header_returns_unauthenticated
        claim_type: RBAC denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no recognized X-User-Role is rejected with ERR_UNAUTHENTICATED (401) before any authorization or existence check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /officers", payload: { badge_number: "B-RB4", full_name: "Ghost" }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 401"
            - "response error_id == ERR_UNAUTHENTICATED"

  # ------------------------------------------------------------- consistency
  - section: consistency_model
    instances:
      - name: citation_issue_immediately_reflected_in_vehicle_balance
        claim_type: immediate
        grounds: [calculations.vehicle_balance, entities.Vehicle.fields.outstanding_balance_cents]
        distinguishing_aspect: "Issuing a citation (fine 5000) immediately makes the vehicle's outstanding_balance_cents 5000 and unpaid_citation_count 1 in the same request cycle (immediate consistency)."
        test_recipe:
          setup: ["Officer with OPEN shift, ACTIVE EXP_METER code, and a freshly registered vehicle."]
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-CM1", full_name: "O CM1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "CMB1", name: "ConsBeat1", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "CM1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "HANDHELD", evidence_photo_url: "https://ev/cm1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
          assert:
            - "Vehicle.${vehicle_id}.outstanding_balance_cents == 5000"
            - "Vehicle.${vehicle_id}.unpaid_citation_count == 1"

  # ------------------------------------------------------------------ errors
  - section: errors
    instances:
      - name: scofflaw_count_boundary_covered
        claim_type: violation_to_error
        grounds: [calculations.vehicle_scofflaw_status]
        excluded_because:
          difficulty_instance: boundary_precision_check / scofflaw_unpaid_count_threshold
          rationale: "The >=3 unpaid-count boundary flipping scofflaw_status to SCOFFLAW is asserted by the named §1.8 instance."

      - name: clock_default_and_set_covered
        claim_type: violation_to_error
        grounds: [endpoints]
        distinguishing_aspect: "The logical clock starts at the fixed default 2026-03-01T00:00:00Z and POST /_clock/set_current_utc advances it deterministically."
        test_recipe:
          setup: ["Empty DB; logical clock at its startup default 2026-03-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T00:00:00Z" }, as: Admin }
          assert:
            - "response http_status == 200"
