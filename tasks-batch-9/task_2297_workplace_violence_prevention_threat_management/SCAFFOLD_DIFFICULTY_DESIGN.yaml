# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Task 2297 - Workplace Violence Prevention & Threat Management.
# Nine rule_id blocks from SKILL.md 0.5; 21 instances total.
# Every pinned numeric literal below was computed by executing the matching
# calculations[].formula from SCAFFOLD.yaml with Decimal / ROUND_HALF_UP.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: hazard_score_screening_versus_validated_credit_delta
        grounds:
          - calculations.hazard_score
          - entities.HazardAssessment.fields.score_variant
          - entities.HazardAssessment.fields.mitigation_verified
          - state_machines.HazardAssessment.SCREENING_to_VALIDATED
          - entities.WorkArea.fields.current_hazard_score
        distinguishing_aspect: |
          The SCREENING and VALIDATED variants of hazard_score run on the same HazardAssessment
          row of a WorkArea (facility-hazard domain) and differ by exactly the mitigation credit
          25 = min(3,4)*5 + 10: 64.00 / TIER_1_ENGINEERING becomes 39.00 / TIER_2_ADMINISTRATIVE.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Worksite \"North Plant\" with employee_count 20 and one WorkArea \"Front Desk\" (public_access_flag true, night_shift_flag true, lone_worker_flag false, occupancy_cap 8)."
            - "Eleven ACTIVE Employee rows back the entity_backed roles: Sofia Ortiz (SafetyOfficer), Marcus Reed (SiteManager), Dana Kim (ThreatTeamLead, discipline HR), Ivan Petrov (SECURITY), Grace Liu (OPERATIONS), Nora Bell (CLINICAL), Omar Haddad (LEGAL), Priya Nair (HRPartner), Luis Vega (SecurityCoordinator), Ana Torres (reporter) and Karl Frey (subject)."
            - "DRAFT PreventionPlan for the worksite."
            - "One HazardAssessment on \"Front Desk\" created with reported_incident_count 4, proximity_factor HIGH, cash_on_hand_cents 0, min_staff_per_shift 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Front Desk", job_function: "CASH_HANDLING", public_access_flag: true, lone_worker_flag: false, night_shift_flag: true, occupancy_cap: 8 }
              as: ProgramAdmin
              captures: { wa_front_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Sofia Ortiz", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { so_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Marcus Reed", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Dana Kim", job_function: "ADMIN", team_discipline: "HR" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Ivan Petrov", job_function: "ADMIN", team_discipline: "SECURITY" }
              as: ProgramAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Grace Liu", job_function: "ADMIN", team_discipline: "OPERATIONS" }
              as: ProgramAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Nora Bell", job_function: "ADMIN", team_discipline: "CLINICAL" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Omar Haddad", job_function: "ADMIN", team_discipline: "LEGAL" }
              as: ProgramAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Priya Nair", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { hr_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Luis Vega", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Ana Torres", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Karl Frey", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /prevention-plans"
              payload: { worksite_id: "${ws_id}", effective_date: "2026-08-01T00:00:00Z", review_interval_days: 365 }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /hazard-assessments"
              payload: { plan_id: "${plan_id}", work_area_id: "${wa_front_id}", reported_incident_count: 4, proximity_factor: "HIGH", cash_on_hand_cents: 0, min_staff_per_shift: 2, expected_plan_version: "${plan_v}" }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { ha_front_id: $.data.id }
          trigger:
            - call: "POST /hazard-assessments/${ha_front_id}/validate"
              payload: { walkthrough_note: "Badge reader, mirrored counter and panic strip verified on site.", mitigation_credits: 3, barrier_installed: true }
              as: SiteManager
              as_user_id: "${sm_id}"
          assert:
            - "HazardAssessment.${ha_front_id}.hazard_score == 64.00 immediately after the create call, with score_variant == SCREENING, control_tier == TIER_1_ENGINEERING and mitigation_verified == false"
            - "After validate, HazardAssessment.${ha_front_id}.hazard_score == 39.00 and score_variant == VALIDATED"
            - "HazardAssessment.${ha_front_id}.control_tier == TIER_2_ADMINISTRATIVE after validate"
            - "HazardAssessment.${ha_front_id}.mitigation_verified == true after validate"
            - "The variant delta is exactly 64.00 - 39.00 == 25.00"
            - "WorkArea.${wa_front_id}.current_hazard_score == 39.00 after validate"
            - "PreventionPlan.${plan_id}.unmitigated_hazard_count == 0 after validate (it was 1 while the row was SCREENING TIER_1)"
            - "HazardAssessment.${ha_front_id}.validated_by_employee_id == ${sm_id}"
      - name: behavioral_risk_interim_versus_consensus_divergence
        grounds:
          - calculations.behavioral_risk_score
          - entities.ThreatCase.fields.interim_risk_score
          - entities.ThreatCase.fields.consensus_risk_score
          - state_machines.ThreatCase.OPEN_to_ASSESSING
          - state_machines.ThreatCase.DELIBERATION_to_MONITORING
        distinguishing_aspect: |
          The INTERIM and CONSENSUS variants of behavioral_risk_score run on a ThreatCase
          (person-risk domain, a different entity domain from the WorkArea hazard scoring of
          hazard_score_screening_versus_validated_credit_delta): INTERIM ignores every ballot and
          yields 42.00, CONSENSUS blends it 0.35/0.65 with the team score and yields 60.94, a
          divergence of 18.94 that also moves risk_band from MODERATE to HIGH.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Worksite \"North Plant\" with employee_count 20 and one WorkArea \"Front Desk\" (public_access_flag true, night_shift_flag true, lone_worker_flag false, occupancy_cap 8)."
            - "Eleven ACTIVE Employee rows back the entity_backed roles: Sofia Ortiz (SafetyOfficer), Marcus Reed (SiteManager), Dana Kim (ThreatTeamLead, discipline HR), Ivan Petrov (SECURITY), Grace Liu (OPERATIONS), Nora Bell (CLINICAL), Omar Haddad (LEGAL), Priya Nair (HRPartner), Luis Vega (SecurityCoordinator), Ana Torres (reporter) and Karl Frey (subject)."
            - "PreventionPlan for the worksite carries one SCREENING HazardAssessment on the only WorkArea, so hazard_coverage_pct is 100.00; no TrainingModule exists, so training_compliance_pct is vacuously 100.00 and the plan reaches ACTIVE."
            - "IncidentReport (weapon_involved true, injury_level FIRST_AID, incident_type TYPE_3_COWORKER) scores severity_points 50 / CRITICAL and is triaged ESCALATED."
            - "ThreatCase opened on that report; all five required disciplines (HR LEAD, SECURITY, OPERATIONS, CLINICAL, LEGAL) are seated, so quorum_met is true; convene sets interim_risk_score 42.00 and assessment_round 1."
            - "All five voting seats have balloted in round 1, so the case has auto-advanced to DELIBERATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Front Desk", job_function: "CASH_HANDLING", public_access_flag: true, lone_worker_flag: false, night_shift_flag: true, occupancy_cap: 8 }
              as: ProgramAdmin
              captures: { wa_front_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Sofia Ortiz", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { so_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Marcus Reed", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Dana Kim", job_function: "ADMIN", team_discipline: "HR" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Ivan Petrov", job_function: "ADMIN", team_discipline: "SECURITY" }
              as: ProgramAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Grace Liu", job_function: "ADMIN", team_discipline: "OPERATIONS" }
              as: ProgramAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Nora Bell", job_function: "ADMIN", team_discipline: "CLINICAL" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Omar Haddad", job_function: "ADMIN", team_discipline: "LEGAL" }
              as: ProgramAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Priya Nair", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { hr_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Luis Vega", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Ana Torres", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Karl Frey", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /prevention-plans"
              payload: { worksite_id: "${ws_id}", effective_date: "2026-08-01T00:00:00Z", review_interval_days: 365 }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /hazard-assessments"
              payload: { plan_id: "${plan_id}", work_area_id: "${wa_front_id}", reported_incident_count: 4, proximity_factor: "HIGH", cash_on_hand_cents: 0, min_staff_per_shift: 2, expected_plan_version: "${plan_v}" }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { ha_front_id: $.data.id }
            - call: "POST /prevention-plans/${plan_id}/submit"
              payload: { submission_note: "Initial prevention plan for the North Plant front desk." }
              as: SafetyOfficer
              as_user_id: "${so_id}"
            - call: "POST /prevention-plans/${plan_id}/activate"
              payload: { activation_note: "Reviewed on site walkthrough; approved." }
              as: SiteManager
              as_user_id: "${sm_id}"
            - call: "POST /incident-reports"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", reporter_employee_id: "${rep_id}", subject_employee_id: "${subj_id}", channel: "WEB_FORM", occurred_at: "2026-07-30T14:00:00Z", narrative: "Co-worker brandished a box cutter during a shift handover argument.", incident_type: "TYPE_3_COWORKER", weapon_involved: true, injury_level: "FIRST_AID" }
              as: Employee
              as_user_id: "${rep_id}"
              captures: { rep_report_id: $.data.id }
            - call: "POST /incident-reports/${rep_report_id}/triage"
              payload: { disposition: "ESCALATE", triage_note: "Weapon present; convening the threat assessment team." }
              as: SafetyOfficer
              as_user_id: "${so_id}"
            - call: "POST /threat-cases"
              payload: { incident_report_id: "${rep_report_id}", lead_employee_id: "${lead_id}" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${lead_id}", discipline: "HR", role_on_team: "LEAD" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_hr_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${sec_id}", discipline: "SECURITY", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_sec_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${ops_id}", discipline: "OPERATIONS", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_ops_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${clin_id}", discipline: "CLINICAL", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_clin_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${legal_id}", discipline: "LEGAL", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_legal_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/convene"
              payload: { convene_note: "Five disciplines seated; opening round 1." }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "ELEVATED", rationale: "Shift overlap keeps the two employees in contact." }
              as: ThreatTeamMember
              as_user_id: "${ops_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "IMMINENT", rationale: "Weapon on site and no badge control at the front desk." }
              as: ThreatTeamMember
              as_user_id: "${sec_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "ELEVATED", rationale: "Pattern of escalating verbal conflict on file." }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "MONITOR", rationale: "No clinical indicators of imminent harm." }
              as: ThreatTeamMember
              as_user_id: "${clin_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "IMMINENT", rationale: "Conduct is chargeable; restraining order is viable." }
              as: ThreatTeamMember
              as_user_id: "${legal_id}"
          trigger:
            - call: "POST /threat-cases/${case_id}/decide"
              payload: { disposition: "ELEVATED_RISK" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
          assert:
            - "ThreatCase.${case_id}.interim_risk_score == 42.00 and ThreatCase.${case_id}.consensus_risk_score is null while the case is in DELIBERATION"
            - "After decide, ThreatCase.${case_id}.consensus_risk_score == 60.94"
            - "ThreatCase.${case_id}.interim_risk_score is still exactly 42.00 after decide (the INTERIM value is never overwritten)"
            - "The variant divergence is exactly 60.94 - 42.00 == 18.94"
            - "ThreatCase.${case_id}.risk_band == HIGH (the INTERIM value 42.00 alone would have banded MODERATE)"
            - "ThreatCase.${case_id}.disposition == ELEVATED_RISK and ThreatCase.${case_id}.status == MONITORING"
  - rule_id: combinatorial_formula
    instances:
      - name: hazard_score_lone_worker_floor_applied_before_cap
        grounds:
          - calculations.hazard_score
          - entities.HazardAssessment.fields.hazard_score
          - entities.WorkArea.fields.lone_worker_flag
          - endpoints[POST /hazard-assessments]
        distinguishing_aspect: |
          Mode (a): hazard_score combines six additive terms with a nested max()-then-min()
          clamp pair and three conditional branches, and the pinned order matters - the
          lone-worker floor 45 is applied to the raw sum BEFORE the cap 100, so a raw 8 becomes
          45.00 (TIER_2, not the TIER_3 that 8.00 would give) and a raw 110 becomes exactly 100.00
          with the cash term itself already clamped from 24 to 20.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Worksite \"North Plant\" with employee_count 20 and one WorkArea \"Front Desk\" (public_access_flag true, night_shift_flag true, lone_worker_flag false, occupancy_cap 8)."
