  # ------------------------------------------------------------ RBAC
  - section: rbac
    instances:
      - name: design_lead_cannot_advance_program
        claim_type: rbac_exclusive_denied
        grounds:
          - roles
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "ProgramManager-exclusive advance attempted as DesignLead -> 403 ERR_FORBIDDEN_ROLE (role check P2 precedes existence/state)."
        test_recipe:
          setup: ["program QUOTED"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: DesignLead, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (http 403); program stays QUOTED"

      - name: customer_cannot_create_program
        claim_type: rbac_exclusive_denied
        grounds:
          - roles
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Program creation is ProgramManager-exclusive; the entity-backed CustomerRep role is denied even for its own customer_id."
        test_recipe:
          setup: ["customer and aircraft exist"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
          trigger:
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: CustomerRep, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (http 403)"

      - name: finance_clerk_cannot_pay_invoice
        claim_type: rbac_exclusive_denied
        grounds:
          - roles
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Invoice pay is CustomerRep-exclusive; FinanceClerk (who may issue/void) is denied pay -> 403."
        test_recipe:
          setup: ["program BOOKED; DEPOSIT invoice ISSUED"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/invoices", payload: { program_id: "${prog_id}", kind: "DEPOSIT" }, as: FinanceClerk, captures: { inv_id: $.data.id } }
            - { call: "POST /completion/invoices/${inv_id}/issue", payload: {}, as: FinanceClerk }
          trigger:
            - { call: "POST /completion/invoices/${inv_id}/pay", payload: {}, as: FinanceClerk, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (http 403)"

      - name: customer_rep_ownership_enforced
        claim_type: rbac_ownership
        grounds:
          - roles
          - validations[priority=5]
          - errors[ERR_FORBIDDEN_OWNERSHIP]
        distinguishing_aspect: "Entity-backed identity: CustomerRep with X-User-ID of customer B cannot approve a scheme on customer A's program -> 403 ERR_FORBIDDEN_OWNERSHIP (role is valid; ownership fails at P5)."
        test_recipe:
          setup: ["two customers; program belongs to customer A with scheme SUBMITTED"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_a: $.data.id } }
            - { call: "POST /completion/customers", payload: { name: "Borealis Air", contact_email: "ops@borealis.example" }, as: CenterAdmin, captures: { cust_b: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_a}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_a}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, prog_v0: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead }
          trigger:
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_b}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_OWNERSHIP (http 403); scheme remains SUBMITTED"

      - name: weight_signoff_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - roles
          - validations[priority=23]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Person-level segregation of duties: sign-off with an X-User-ID equal to the record's prepared_by_user_id (tech-1) is rejected 403 ERR_SEGREGATION_OF_DUTIES even though the QualityInspector ROLE is correct; a different inspector id (qi-1) succeeds."
        test_recipe:
          setup: ["program QUOTED with APPROVED scheme; WBR FINAL prepared by X-User-ID tech-1 (delta 38.6, in limits)"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
