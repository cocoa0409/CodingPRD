# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against this scaffold's §1.1-§1.7.
# Section values are the guide's nine sections; claim_type values are its per-section rows.
# Corners already asserted by a §1.8 instance carry an excluded_because stub and no test_recipe.
scaffold_corner_design:

  # =======================================================================
  - section: entities
    instances:

      - name: create_release_train_applies_defaults_and_zero_counters
        claim_type: creation
        grounds:
          - entities.ReleaseTrain
          - endpoints[POST /release-trains]
          - state_machines.ReleaseTrain.initial_state
        distinguishing_aspect: "A minimal POST /release-trains omitting max_concurrent_stabilizing returns 201 with phase ACTIVE, max_concurrent_stabilizing 1, frozen_at null, both computed counters 0 and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id, train_v: $.data.version }
          assert:
            - "HTTP 201"
            - "ReleaseTrain.${train_id}.phase == ACTIVE"
            - "ReleaseTrain.${train_id}.max_concurrent_stabilizing == 1"
            - "ReleaseTrain.${train_id}.frozen_at == null"
            - "ReleaseTrain.${train_id}.freeze_exception_count == 0"
            - "ReleaseTrain.${train_id}.open_release_count == 0"
            - "ReleaseTrain.${train_id}.version == 1"
            - "ReleaseTrain.${train_id}.id is a UUID with no type prefix"

      - name: get_feature_flag_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds:
          - entities.FeatureFlag
          - endpoints[GET /feature-flags/{id}]
        distinguishing_aspect: "GET /feature-flags/{id} echoes the stored key/owner/expires_at and the computed DRAFT / COMPLIANT / 0-exposure defaults, and created_by_user_id equals the creating X-User-ID (u-eng-1), not the owner_user_id (u-eng-9)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one flag created by u-eng-1 but owned by a different user id u-eng-9."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-9", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: $.data.id }
          trigger:
            - call: "GET /feature-flags/${flag_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          assert:
            - "HTTP 200"
            - "FeatureFlag.${flag_id}.key == checkout-v2"
            - "FeatureFlag.${flag_id}.owner_user_id == u-eng-9"
            - "FeatureFlag.${flag_id}.created_by_user_id == u-eng-1"
            - "FeatureFlag.${flag_id}.expires_at == 2026-12-01T00:00:00Z"
            - "FeatureFlag.${flag_id}.state == DRAFT"
            - "FeatureFlag.${flag_id}.cleanup_state == COMPLIANT"
            - "FeatureFlag.${flag_id}.current_exposure_pct == 0"
            - "FeatureFlag.${flag_id}.applied_step_count == 0"
            - "FeatureFlag.${flag_id}.kill_switch_engaged == false"
            - "FeatureFlag.${flag_id}.last_sweep_at == null and archived_at == null"

      - name: list_feature_flags_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /feature-flags]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three flags, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, while limit 2 offset 2 returns 1 row with total_count 3 and has_more false; total_count reflects the full filtered set, not the page."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; three DRAFT flags owned by u-eng-1 with distinct keys."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "flag-a", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_a: $.data.id }
            - call: "POST /feature-flags"
              payload: { key: "flag-b", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_b: $.data.id }
            - call: "POST /feature-flags"
              payload: { key: "flag-c", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_c: $.data.id }
          trigger:
            - call: "GET /feature-flags"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /feature-flags"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { last_page_head: "$.data[0].id" }
          assert:
            - "First page: len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: len(data) == 1, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "response_type == array on both pages"
            - "The two pages together return the three created flag ids with no duplicates"

      - name: list_feature_flags_state_filter_narrows_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /feature-flags]
          - entities.FeatureFlag.fields.state
        distinguishing_aspect: "state=DRAFT excludes the ACTIVE_ROLLING_OUT flag and lowers total_count from 2 to 1, proving total_count is computed after filtering rather than over the whole table."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; flag-a is DRAFT, flag-b was lifted to ACTIVE_ROLLING_OUT by starting a 5% / 30-minute soak."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "flag-a", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_a: $.data.id }
            - call: "POST /feature-flags"
              payload: { key: "flag-b", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_b: $.data.id, flag_b_v: $.data.version }
            - call: "POST /feature-flags/${flag_b}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${flag_b_v}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step_b: $.data.id }
            - call: "POST /flag-rollout-steps/${step_b}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
          trigger:
            - call: "GET /feature-flags"
              payload: { state: "DRAFT" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { only_id: "$.data[0].id" }
          assert:
            - "HTTP 200 and total_count == 1"
            - "len(data) == 1 and data[0].id == ${flag_a}"
            - "data[0].state == DRAFT"
            - "${flag_b} does not appear in the filtered page"

      - name: get_release_with_unknown_uuid_returns_release_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_RELEASE_NOT_FOUND]
          - validations[priority=4]
          - endpoints[GET /releases/{id}]
        distinguishing_aspect: "A syntactically valid but unknown UUID in the path yields 404 ERR_RELEASE_NOT_FOUND for the Release family, and the per-entity 404 ids are distinct across Release / ChangeRequest / FeatureFlag / FlagRolloutStep / Deployment / ReleaseTrain."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z. No entity of any type has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "GET /releases/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { e_release: $.data.error_id }
            - call: "GET /release-trains/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { e_train: $.data.error_id }
            - call: "GET /change-requests/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { e_change: $.data.error_id }
            - call: "GET /feature-flags/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { e_flag: $.data.error_id }
            - call: "GET /flag-rollout-steps/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { e_step: $.data.error_id }
            - call: "GET /deployments/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
              captures: { e_dep: $.data.error_id }
          assert:
            - "All six calls return HTTP 404"
            - "error_id values are ERR_RELEASE_NOT_FOUND, ERR_RELEASE_TRAIN_NOT_FOUND, ERR_CHANGE_REQUEST_NOT_FOUND, ERR_FEATURE_FLAG_NOT_FOUND, ERR_ROLLOUT_STEP_NOT_FOUND and ERR_DEPLOYMENT_NOT_FOUND respectively"
            - "response_type == error and data carries error_id plus message on every call"

      - name: create_change_request_missing_required_blast_radius_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
          - endpoints[POST /releases/{id}/change-requests]
        distinguishing_aspect: "declared_blast_radius has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and creates no ChangeRequest row, while the release's committed_change_count stays 0."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; train core-train with Release 2026.08.1 in phase OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Missing blast radius", summary_internal: "no blast radius declared", lines_changed: 40, touched_subsystem_count: 1 }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /releases/${rel_id}/change-requests returns total_count == 0"
            - "Release.${rel_id}.committed_change_count == 0"

      - name: create_feature_flag_omitting_permanent_defaults_to_false
        claim_type: defaults
        grounds:
          - entities.FeatureFlag.fields.permanent
          - entities.Environment.fields.cooldown_minutes
          - entities.Environment.fields.requires_compliance_evidence
        distinguishing_aspect: "Omitted optional inputs take their declared defaults rather than null: FeatureFlag.permanent false, Environment.cooldown_minutes 30 and Environment.requires_compliance_evidence false."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: $.data.id }
            - call: "POST /environments"
              payload: { name: "prod-us", tier: "PROD", deploy_window_start_hour_utc: 2, deploy_window_end_hour_utc: 6 }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { env_id: $.data.id }
          assert:
            - "FeatureFlag.${flag_id}.permanent == false"
            - "Environment.${env_id}.cooldown_minutes == 30"
            - "Environment.${env_id}.requires_compliance_evidence == false"
            - "Environment.${env_id}.blackout_start_at == null and blackout_end_at == null"
            - "Environment.${env_id}.active_deployment_count == 0"
            - "Environment.${env_id}.last_deployment_end_at == null"

      - name: change_request_risk_class_is_computed_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ChangeRequest.fields.risk_score_preliminary
          - entities.ChangeRequest.fields.risk_class
          - calculations.change_risk_score
        distinguishing_aspect: "risk_score_preliminary and risk_class have source computed and are not declared inputs, so a client-supplied risk_class of LOW is ignored and the submit still pins 33 / MEDIUM from the formula."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Release 2026.08.1 OPEN on core-train."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Retry policy rewrite", summary_internal: "Two-subsystem retry rewrite", lines_changed: 300, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT", risk_class: "LOW", risk_score_preliminary: 1 }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_id: $.data.id }
            - call: "POST /change-requests/${cr_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { score: $.data.risk_score_preliminary, klass: $.data.risk_class }
          assert:
            - "ChangeRequest.${cr_id}.risk_class immediately after creation == null (not LOW)"
            - "ChangeRequest.${cr_id}.risk_score_preliminary immediately after creation == null (not 1)"
            - "After submit: ChangeRequest.${cr_id}.risk_score_preliminary == 33"
            - "After submit: ChangeRequest.${cr_id}.risk_class == MEDIUM"
            - "ChangeRequest.${cr_id}.state == RISK_CLASSIFIED"

      - name: release_system_fields_are_server_minted_and_derived_from_train
        claim_type: system_fields
        grounds:
          - entities.Release.fields.freeze_at
          - entities.Release.fields.stabilization_end_at
          - entities.ReleaseTrain.fields.code_freeze_lead_hours
          - entities.ReleaseTrain.fields.stabilization_hours
        distinguishing_aspect: "freeze_at and stabilization_end_at are derived from the parent train's code_freeze_lead_hours 48 and stabilization_hours 72 against cut_at 2026-08-10T00:00:00Z, giving 2026-08-08T00:00:00Z and 2026-08-13T00:00:00Z; id, created_at and version are server-minted with version 1."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; train core-train with code_freeze_lead_hours 48 and stabilization_hours 72."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
          trigger:
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id, rel_v: $.data.version }
          assert:
            - "HTTP 201"
            - "Release.${rel_id}.freeze_at == 2026-08-08T00:00:00Z"
            - "Release.${rel_id}.stabilization_end_at == 2026-08-13T00:00:00Z"
            - "Release.${rel_id}.phase == OPEN"
            - "Release.${rel_id}.version == 1"
            - "Release.${rel_id}.released_at == null and rolled_back_at == null"
            - "Release.${rel_id}.committed_change_count == 0 and verified_change_count == 0"
            - "Release.${rel_id}.risk_budget_consumed_points == 0"
            - "Release.${rel_id}.readiness_score_projected == 100 and readiness_score_attested == null"
            - "ReleaseTrain.${train_id}.open_release_count == 1"

      - name: create_deployment_with_invalid_enum_strategy_is_rejected
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
          - entities.Deployment.fields.strategy
          - entities.Incident.fields.severity
        distinguishing_aspect: "Enum members outside the declared value sets are 400 ERR_INVALID_REQUEST, not 404 or 422: strategy ROLLING on a deployment and severity SEV5 on an incident both fail, and no row is created."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; environment prod-us; Release 2026.08.1 cut at 2026-08-08T00:00:00Z so deployment creation is otherwise legal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /environments"
              payload: { name: "prod-us", tier: "PROD", deploy_window_start_hour_utc: 2, deploy_window_end_hour_utc: 6, cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { env_id: $.data.id }
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
          trigger:
            - call: "POST /releases/${rel_id}/deployments"
              payload: { environment_id: "${env_id}", window_start_at: "2026-08-10T02:00:00Z", window_end_at: "2026-08-10T04:00:00Z", strategy: "ROLLING", abort_error_rate_pct: 25.0, abort_latency_p95_ms: 800 }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { e_strategy: $.data.error_id }
            - call: "POST /incidents"
              payload: { title: "bad severity", severity: "SEV5", detected_at: "2026-08-08T01:00:00Z", release_train_id: "${train_id}" }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { e_severity: $.data.error_id }
          assert:
            - "Both calls return HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /deployments filtered by release_id returns total_count == 0"
            - "GET /incidents filtered by release_train_id returns total_count == 0"

      - name: change_dependency_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.ChangeDependency
          - endpoints[GET /change-requests/{id}/dependencies]
        distinguishing_aspect: "ChangeDependency declares common_fields false, so its rows carry only id and created_at — no version and no updated_at — and §1.5 exposes no update or delete endpoint for the edge; the direction filter distinguishes outgoing from incoming edges."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Release 2026.08.1 OPEN with CR_D and CR_P both submitted."
            - "One dependency edge CR_D -> CR_P exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Extract cache client", summary_internal: "prerequisite", lines_changed: 200, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT" }
              as: Engineer
