        grounds:
          - state_machines.DamageClaim.REPORTED_to_APPROVED_RESHIP
          - state_machines.Reshipment.PENDING_to_DISPATCHED
          - calculations.inventory_conservation
          - calculations.availability_derivation
        distinguishing_aspect: |
          Depth-4 chain from the review trigger: APPROVE_RESHIP creates a
          Reshipment (1); dispatch decrements placement.on_hand_units 1 -> 0 (2);
          the zero balance re-derives Product.availability_status to OUT_OF_STOCK
