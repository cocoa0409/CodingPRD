          - validations.ERR_BUSINESS_OUTSIDE_BOUNDARY
          - state_machines.LodgingBusiness.ASSESSABLE_to_OUTSIDE_BOUNDARY
        distinguishing_aspect: |
          The same signature request violates a priority-75 temporal rule and a priority-80 referential
          rule. Submitted while the drive is still open it yields ERR_BUSINESS_OUTSIDE_BOUNDARY; the
          identical request one day after closes_at yields ERR_PETITION_WINDOW_CLOSED instead, so the
          test pins which of the two the ordered pipeline reports rather than merely that it rejects.
