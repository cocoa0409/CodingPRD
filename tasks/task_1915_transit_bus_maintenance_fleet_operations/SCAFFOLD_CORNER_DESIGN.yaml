          assert:
            - "scope_bus_ids still contains both buses (length 2, ${b2} present despite RETIRED)"
            - "progress_pct == 50.0 (denominator frozen), status == ACTIVE"

      - name: pm_c_close_resets_nested_counters
        claim_type: correct_result
        grounds:
          - state_machines.WorkOrder.PENDING_QA_to_CLOSED
          - calculations.pm_due_status
        distinguishing_aspect: "PM nesting rule: closing a PM_C work order resets last_pm_{a,b,c} to the close odometer/date (C includes B and A tasks) — all three miles_since counters read 0 afterwards."
