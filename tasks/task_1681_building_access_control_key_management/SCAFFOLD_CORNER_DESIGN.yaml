            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id, d_v: $.data.version }
            - call: "PATCH /doors/${d1}"
              payload: { expected_door_version: "${d_v}", propped_threshold_seconds: 300 }
              as: SecurityAdmin
              captures: { d_v2: $.data.version }
          trigger:
            - call: "PATCH /doors/${d1}"
              payload: { expected_door_version: "${d_v}", propped_threshold_seconds: 999 }
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "d_v2 == 2"
            - "err == ERR_STALE_VERSION (http 412)"
            - "GET /doors/${d1} -> propped_threshold_seconds == 300 (stale write not applied)"

