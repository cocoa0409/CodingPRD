- section: validations
  instances:
  - name: auth_missing_role_beats_everything
    claim_type: priority_ordering
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request with an unknown X-User-Role fails at priority 1 with ERR_UNAUTHENTICATED (401), even when the transition itself would also be invalid (priority 6).
    test_recipe:
      setup:
      - one case in INTAKE
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/cases
        payload:
          title: AuthP
          allegation_category: FRAUD
          severity: HIGH
          department: Finance
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          case_id: $.data.id
      trigger:
      - call: POST /api/cases/${case_id}/transition
        payload:
          to_status: CLOSED
        as: UnknownRole
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHENTICATED with HTTP 401 (auth priority 1 precedes state priority 6, so the invalid CLOSED target is never evaluated)
  - name: authorization_beats_existence
    claim_type: priority_ordering
    grounds:
    - validations[priority=3]
    - validations[priority=4]
    - errors[ERR_UNAUTHORIZED_ROLE]
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: 'A role-forbidden call against a nonexistent case id returns ERR_UNAUTHORIZED_ROLE (403), not ERR_NOT_FOUND (404): authorization (priority 3) precedes existence (priority 4),
      avoiding resource-existence leakage.'
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /api/cases/00000000-0000-0000-0000-000000000000/privilege-designations
        payload:
          target_type: INTERVIEW
          target_id: 00000000-0000-0000-0000-000000000001
          privilege_type: ACP
        as: Investigator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHORIZED_ROLE with HTTP 403 (Investigator is not in the endpoint's roles)
  - name: idempotency_key_missing_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=2]
    - errors[ERR_MISSING_IDEMPOTENCY_KEY]
    distinguishing_aspect: Any POST without an Idempotency-Key header fails with ERR_MISSING_IDEMPOTENCY_KEY (400) before role or payload checks.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /api/cases
        payload:
          title: NoKey
          allegation_category: FRAUD
          severity: LOW
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          err: $.data.error_id
      assert:
      - 'request sent with NO Idempotency-Key header: error_id == ERR_MISSING_IDEMPOTENCY_KEY, HTTP 400'
  - name: idempotency_replay_same_payload_returns_original
    claim_type: idempotency
    grounds:
    - validations[priority=2]
    distinguishing_aspect: Replaying a POST with the same Idempotency-Key and an identical payload returns the original response (same case id) and creates no second row.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /api/cases
        payload:
          title: Idem
          allegation_category: FRAUD
          severity: LOW
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          c1: $.data.id
      - call: POST /api/cases
        payload:
          title: Idem
          allegation_category: FRAUD
          severity: LOW
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          c2: $.data.id
      assert:
      - both requests use Idempotency-Key K-1 with identical payloads
      - second response returns the SAME case id (${c1} == ${c2})
      - GET /api/cases returns total_count == 1
  - name: idempotency_replay_mismatch_rejected
    claim_type: idempotency
    grounds:
    - validations[priority=2]
    - errors[ERR_IDEMPOTENCY_REPLAY_MISMATCH]
    distinguishing_aspect: Replaying Idempotency-Key K-2 with a DIFFERENT payload fails with ERR_IDEMPOTENCY_REPLAY_MISMATCH (409).
    test_recipe:
      setup:
      - one case created under Idempotency-Key K-2
      setup_api_calls:
      - call: POST /api/cases
        payload:
          title: IdemA
          allegation_category: FRAUD
          severity: LOW
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          c1: $.data.id
      trigger:
      - call: POST /api/cases
        payload:
          title: IdemB-DIFFERENT
          allegation_category: FRAUD
          severity: LOW
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          err: $.data.error_id
      assert:
      - second request reuses Idempotency-Key K-2 with a changed title
      - error_id == ERR_IDEMPOTENCY_REPLAY_MISMATCH, HTTP 409
  - name: privilege_designation_cross_case_target_rejected
    claim_type: cross_entity_validation
    grounds:
    - errors[ERR_TARGET_CASE_MISMATCH]
    - entities.PrivilegeDesignation.fields.target_id
    distinguishing_aspect: A designation created on case B whose target_id is an interview belonging to case A fails with ERR_TARGET_CASE_MISMATCH (polymorphic target must resolve within the same case).
    test_recipe:
      setup:
      - Case A in FIELDWORK with interview I; Case B in INTAKE
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /api/cases
        payload:
          title: TCaseA
          allegation_category: HARASSMENT
          severity: MEDIUM
          department: Ops
          lead_investigator_id: inv-lead-1
        as: IntakeCoordinator
        captures:
          ca: $.data.id
      - call: POST /api/cases/${ca}/transition
        payload:
          to_status: TRIAGED
          severity: MEDIUM
          department: Ops
        as: IntakeCoordinator
      - call: GET /api/cases/${ca}
        as: Investigator
        captures:
          cav: $.data.version
      - call: POST /api/cases/${ca}/plans
        payload:
          scope_statement: s
          planned_start: '2026-05-02T00:00:00Z'
          planned_end: '2026-05-20T00:00:00Z'
          expected_case_version: ${cav}
        as: Investigator
        captures:
          plan_a: $.data.id
      - call: POST /api/plans/${plan_a}/transition
        payload:
          to_status: SUBMITTED
        as: Investigator
      - call: POST /api/plans/${plan_a}/transition
        payload:
          to_status: APPROVED
        as: InvestigationsManager
        as_user_id: mgr-1
      - call: POST /api/cases/${ca}/interviews
        payload:
          witness_ref: W-1
          interviewer_id: inv-9
          scheduled_start: '2026-05-10T14:00:00Z'
          scheduled_end: '2026-05-10T15:00:00Z'
        as: Investigator
        captures:
          i1: $.data.id
      - call: POST /api/cases
        payload:
          title: TCaseB
          allegation_category: FRAUD
          severity: LOW
          department: Finance
          lead_investigator_id: inv-lead-2
        as: IntakeCoordinator
        captures:
          cb: $.data.id
      trigger:
      - call: POST /api/cases/${cb}/privilege-designations
        payload:
          target_type: INTERVIEW
          target_id: ${i1}
          privilege_type: ACP
