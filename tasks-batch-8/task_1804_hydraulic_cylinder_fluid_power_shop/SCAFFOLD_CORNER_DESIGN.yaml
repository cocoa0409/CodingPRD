  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: teardown_patch_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[teardown-report-patch-stale]"]
        distinguishing_aspect: "After a successful PATCH moves the report to version 2, a second PATCH still carrying expected_teardown_report_version 1 is rejected 412 ERR_STALE_VERSION — sequential, deterministic OCC."
        test_recipe:
          setup: ["WO QUOTE_DRAFT with teardown report at version 1"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-O01", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: false, tube_needed: false, honing_passes: 0, estimated_labor_hours: 1.0 }, as: Technician, as_user_id: "${tech1_id}", captures: { report_id: "$.data.id", report_v: "$.data.version" } }
            - { call: "PATCH /fluid-power/teardown-reports/${report_id}", payload: { expected_teardown_report_version: "${report_v}", estimated_labor_hours: 1.5 }, as: Technician, as_user_id: "${tech1_id}", captures: { report_v2: "$.data.version" } }
          trigger:
            - call: "PATCH /fluid-power/teardown-reports/${report_id}"
              payload: { expected_teardown_report_version: "${report_v2} - 1", estimated_labor_hours: 2.0 }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "first PATCH succeeded: version 1 -> 2 (${report_v2} == 2)"
            - "stale PATCH (expected ${report_v2} - 1 == 1) rejected with ERR_STALE_VERSION (412)"
            - "TeardownReport.${report_id}.estimated_labor_hours remains 1.5 and version remains 2"

      - name: shop_config_patch_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[shop-config-patch-stale]"]
        distinguishing_aspect: "Two sequential config PATCHes: the first (expected version == observed) succeeds and bumps Shop.version; the second carrying the pre-update version fails 412 — OCC on Shop."
        test_recipe:
          setup: ["shop created (version 1)"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin, captures: { shop_id: "$.data.id", shop_v: "$.data.version" } }
            - { call: "PATCH /fluid-power/shops/${shop_id}", payload: { expected_shop_version: "${shop_v}", labor_rate_cents_per_hour: 15000 }, as: ShopAdmin, captures: { shop_v2: "$.data.version" } }
          trigger:
            - call: "PATCH /fluid-power/shops/${shop_id}"
              payload: { expected_shop_version: "${shop_v2} - 1", honing_pass_fee_cents: 4500 }
              as: ShopAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "first PATCH applied (labor_rate_cents_per_hour == 15000, version == 2)"
            - "stale PATCH rejected with ERR_STALE_VERSION (412); honing_pass_fee_cents remains 4000"

      - name: field_schedule_stale_technician_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[field-job-schedule-stale-technician]"]
        distinguishing_aspect: "After job 1's schedule bumps Technician.version to 2, scheduling job 2 (on a free, non-overlapping window) with the stale observed version 1 fails 412 — the write is legitimate under state rules and only OCC rejects it."
        test_recipe:
          setup: ["field technician v1; two REQUESTED jobs with disjoint windows"]
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Field Tech", skills: ["FIELD_SERVICE"] }, as: ShopAdmin, captures: { tech2_id: "$.data.id", tech2_v: "$.data.version" } }
            - { call: "POST /fluid-power/field-service-jobs", payload: { customer_id: "${cust_id}", site_address: "12 Quarry Rd", distance_km: 60, assemblies: [{ hose_type: "WIRE_BRAID_2SN", length_m: 2.0, fitting_price_cents: 1800, crimp_spec_mm: 27.0 }] }, as: ServiceAdvisor, captures: { job1_id: "$.data.id" } }
            - { call: "POST /fluid-power/field-service-jobs", payload: { customer_id: "${cust_id}", site_address: "8 Mill St", distance_km: 40, assemblies: [{ hose_type: "THERMOPLASTIC", length_m: 1.5, fitting_price_cents: 1200, crimp_spec_mm: 19.5 }] }, as: ServiceAdvisor, captures: { job2_id: "$.data.id" } }
            - { call: "POST /fluid-power/field-service-jobs/${job1_id}/schedule", payload: { technician_id: "${tech2_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_technician_version: "${tech2_v}" }, as: ServiceAdvisor }
          trigger:
            - call: "POST /fluid-power/field-service-jobs/${job2_id}/schedule"
              payload: { technician_id: "${tech2_id}", window_start: "2026-08-04T10:00:00Z", window_end: "2026-08-04T12:00:00Z", expected_technician_version: "${tech2_v}" }
              as: ServiceAdvisor
              captures: { err: "$.data.error_id" }
          assert:
            - "rejected with ERR_STALE_VERSION (412): Technician.version advanced to 2 when job 1 was scheduled"
            - "FieldServiceJob.${job2_id}.status remains REQUESTED"

      - name: quote_version_pinning_covered
        claim_type: version_pinning
        grounds: ["entities.Quote.fields.pinned_teardown_version"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / quote_send_requires_fresh_teardown_pin
          rationale: "Pin/stale behavior asserted in the named §1.8 instance; quote_creation_stamps_pin_and_tier_snapshot covers stamping."

