            - "HTTP 200 with ${ms1} == MECH_COMPLETE, ${mods} == 50 and ${dev} == 18.0 (inside TORQUE_TUBE_TOLERANCE_MM 25.0)"
            - "${ready} == false — mc_ready needs electrical_status == TESTED and the block's electrical dimension is still PLANNED"
            - "${bv1} == ${bv0} + 1"
            - "Project.${proj}.blocks_total == 1, blocks_mc_ready_count == 0 and mc_readiness == BLOCKED"

      - name: substation_cannot_skip_directly_from_site_civil_to_energized
        claim_type: invalid_transitions
        grounds:
          - state_machines.Substation
          - validations[priority=8]
          - errors[ERR_SUBSTATION_STEP_NOT_SEQUENTIAL]
        distinguishing_aspect: "Only the immediate successor is accepted: from SITE_CIVIL both ENERGIZED and EQUIPMENT_SET are refused with 409 ERR_SUBSTATION_STEP_NOT_SEQUENTIAL — the priority-8 sequencing check fires ahead of the priority-16 outage-window gate, so the error is never ERR_NO_APPROVED_OUTAGE_WINDOW."
        test_recipe:
          setup:
            - "One project with one substation in its initial SITE_CIVIL state and no outage windows"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Sequence Ridge", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/substations"
              payload: { substation_code: "S1", interconnection_voltage_kv: 138.0, mv_collection_km: 12.5 }
              as: UtilityCoordinator
              captures: { sub: $.data.id, sv0: $.data.version }
          trigger:
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "ENERGIZED", utility_witness_ref: "W-X" }
              as: UtilityCoordinator
              captures: { eid1: $.data.error_id }
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "EQUIPMENT_SET", utility_witness_ref: "W-X" }
              as: UtilityCoordinator
              captures: { eid2: $.data.error_id }
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "STEEL_ERECTED", utility_witness_ref: "W-1" }
              as: UtilityCoordinator
              captures: { st: $.data.status, sv1: $.data.version }
          assert:
            - "both skip attempts return 409 with ${eid1} == ERR_SUBSTATION_STEP_NOT_SEQUENTIAL and ${eid2} == ERR_SUBSTATION_STEP_NOT_SEQUENTIAL"
            - "${eid1} is NOT ERR_NO_APPROVED_OUTAGE_WINDOW even though no window exists — priority 8 outranks priority 16"
            - "after both refusals Substation.${sub}.status == SITE_CIVIL, utility_witness_ref == null and version == ${sv0}"
            - "the single legal step returns 200 with ${st} == STEEL_ERECTED, utility_witness_ref == \"W-1\" and ${sv1} == ${sv0} + 1"

