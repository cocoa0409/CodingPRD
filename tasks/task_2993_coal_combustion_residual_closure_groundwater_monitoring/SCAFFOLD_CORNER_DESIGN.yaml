              payload: { decommissioned_on: "2026-07-02", decommission_reason: "Second background well proposed for abandonment" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/wells/${dg1_id}/decommission"
