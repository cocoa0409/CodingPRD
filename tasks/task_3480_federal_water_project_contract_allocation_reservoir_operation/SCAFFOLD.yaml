# =============================================================================
# SCAFFOLD — task_3480_federal_water_project_contract_allocation_reservoir_operation
# Federal Water Project Contract Allocation & Reservoir Operation
# Difficulty target: beyond expert (dense coupling, not table padding)
# =============================================================================

scenario: |
  Federal Water Project Contract Allocation & Reservoir Operation (Bureau of Reclamation): long-term water service and repayment contracts with districts specifying maximum quantities and repayment obligations, annual allocation announcements based on snowpack, storage and forecast runoff with mid-season revisions, reservoir operation balancing storage, flood control space requirements, downstream delivery and environmental flows, priority structures where senior contract rights are filled before junior allocations in shortage years, environmental compliance including endangered species requirements that constrain releases, hydropower generation revenue and its role in project financing, water transfer and exchange approvals between districts with third-party impact review, drought contingency planning with shortage sharing agreements

domain_name: federal-water-allocation
api_prefix: /water

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite water supply competed for by priority class
  secondary_archetype: compliance_audit      # endangered-species constraints, incident log, third-party review
  complexity_layers:
    - dual_variant_calculation               # priority waterfall vs shortage sharing; projected vs settled revenue
    - cascading_side_effects                 # revision curtailment cascade; compliance-hold contagion
    - optimistic_concurrency                 # OCC on WaterYear.version for announcement creation
    - rate_threshold_triggers                # shortage tier ratios 0.75 / 0.50, strict <
  entity_topology: flat                      # peer collections joined by FKs; no nested ownership tree
  state_machine_shape: cyclic                # transfer review loop; DeliveryOrder additionally carries parallel dimensions
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties          # reviewer district must not be a transfer party; finance vs ops split
  consistency_model: immediate
  entity_count: 15
  state_machine_count: 11
  calculation_count: 12
  endpoint_count: 46
  error_code_count: 34
  role_count: 7

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District legal name" }
      - { name: service_area_acres, type: integer, source: input, description: "Irrigated service area; > 0" }
      - { name: contact_email, type: string, source: input, description: "District operations contact" }

  - name: WaterContract
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; contracting district" }
      - { name: contract_number, type: string, source: input, description: "Unique contract identifier string; duplicates rejected with ERR_DUPLICATE_CONTRACT_NUMBER" }
      - { name: priority_class, type: enum, source: input, description: "SENIOR | JUNIOR; senior rights filled before junior in shortage years" }
      - { name: max_annual_quantity_af, type: integer, source: input, description: "Maximum annual delivery quantity in acre-feet; > 0" }
      - { name: repayment_obligation_cents, type: integer, source: input, description: "Total capital repayment obligation; >= 0" }
      - { name: repaid_credits_cents, type: integer, source: computed, description: "Hydropower revenue credits applied so far; starts 0; increments only on RevenuePeriod settle" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; starts ACTIVE" }

  - name: WaterYear
    parent: null
    common_fields: true
    fields:
      - { name: label, type: integer, source: input, description: "Water year label, e.g. 2027; unique, duplicates rejected with ERR_DUPLICATE_WATER_YEAR" }
      - { name: season_start, type: datetime, source: input, description: "Season start ISO8601; must be before season_end" }
      - { name: season_end, type: datetime, source: input, description: "Season end ISO8601" }
      - { name: status, type: enum, source: system, description: "OPEN | ANNOUNCED | CLOSED; starts OPEN" }
      - { name: current_announcement_id, type: string, source: computed, description: "id of the currently PUBLISHED AllocationAnnouncement; null until first publish" }

  - name: HydrologyObservation
    parent: null
    common_fields: false
    fields:
      - { name: water_year_id, type: string, source: system, description: "FK -> WaterYear.id; taken from the URL path" }
      - { name: observation_type, type: enum, source: input, description: "SNOWPACK_INDEX | RUNOFF_FORECAST_AF | MEASURED_INFLOW_AF" }
      - { name: value, type: integer, source: input, description: "Snowpack percent-of-normal (e.g. 80), forecast acre-feet, or measured inflow acre-feet; >= 0" }
      - { name: observed_on, type: datetime, source: input, description: "Observation timestamp; latest observed_on wins, tie broken by created_at DESC" }

  - name: AllocationAnnouncement
    parent: null
    common_fields: true
    fields:
      - { name: water_year_id, type: string, source: system, description: "FK -> WaterYear.id; taken from the URL path" }
      - { name: sequence_number, type: integer, source: system, description: "Per-water-year monotonic sequence starting at 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED; starts DRAFT" }
      - { name: declared_supply_af, type: integer, source: computed, description: "Declared allocatable supply, computed at publish; null while DRAFT" }
      - { name: shortage_tier, type: enum, source: computed, description: "NONE | TIER_1 | TIER_2, classified at publish; null while DRAFT" }
      - { name: allocation_basis, type: enum, source: computed, description: "PRIORITY_WATERFALL | SHORTAGE_SHARING; SHORTAGE_SHARING when an ACTIVATED ShortageAgreement covers this year at publish/activation time" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of publish; null while DRAFT" }

  - name: AllocationLine
    parent: null
    common_fields: true
    fields:
      - { name: announcement_id, type: string, source: system, description: "FK -> AllocationAnnouncement.id; owning announcement" }
      - { name: contract_id, type: string, source: system, description: "FK -> WaterContract.id; one line per ACTIVE contract per published announcement" }
      - { name: allocated_af, type: integer, source: computed, description: "Allocated acre-feet for this contract under this announcement" }
      - { name: delivered_af, type: integer, source: computed, description: "Total delivered acre-feet; carried forward from predecessor line on revision" }
      - { name: transfer_in_af, type: integer, source: computed, description: "Acre-feet received via EXECUTED transfers; carried forward on revision" }
      - { name: transfer_out_af, type: integer, source: computed, description: "Acre-feet sent via EXECUTED transfers; carried forward on revision" }
      - { name: remaining_af, type: integer, source: computed, description: "allocated_af + transfer_in_af - transfer_out_af - delivered_af - sum(ordered_af - delivered_af over orders with fulfillment_status IN {CONFIRMED, PARTIALLY_DELIVERED}); may go negative after curtailment" }

  - name: Reservoir
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Reservoir name" }
      - { name: capacity_af, type: integer, source: input, description: "Total conservation capacity; > 0" }
      - { name: dead_pool_af, type: integer, source: input, description: "Unusable dead pool; >= 0 and < capacity_af" }
      - { name: flood_control_max_storage_af, type: integer, source: input, description: "Maximum allowed storage during flood-control months (Nov,Dec,Jan,Feb,Mar); > 0" }
      - { name: initial_storage_af, type: integer, source: input, description: "Storage at creation; >= 0 and <= capacity_af" }
      - { name: current_storage_af, type: integer, source: computed, description: "initial + sum(MEASURED_INFLOW_AF observations) - sum(EXECUTED release volumes)" }
      - { name: outlet_capacity_cfs, type: integer, source: input, description: "Maximum combined release rate per day; > 0" }
      - { name: power_conversion_mwh_per_af, type: number, source: input, description: "Hydropower conversion factor MWh per acre-foot; > 0" }
      - { name: compliance_posture, type: enum, source: computed, description: "NORMAL | COMPLIANCE_HOLD; HOLD while any ComplianceIncident on this reservoir is OPEN" }
      - { name: open_incident_count, type: integer, source: computed, description: "Count of ComplianceIncident rows with status OPEN on this reservoir" }
      - { name: total_repayment_obligation_cents, type: integer, source: computed, description: "Sum of repayment_obligation_cents over all WaterContracts (any status)" }
      - { name: unrecovered_balance_cents, type: integer, source: computed, description: "total_repayment_obligation_cents - sum(repaid_credits_cents over all WaterContracts)" }

  - name: ReleaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: reservoir_id, type: string, source: system, description: "FK -> Reservoir.id; taken from the URL path" }
      - { name: purpose, type: enum, source: input, description: "DELIVERY | ENVIRONMENTAL | FLOOD_CONTROL | POWER" }
      - { name: release_cfs, type: integer, source: input, description: "Release rate in cubic feet per second; > 0" }
      - { name: duration_days, type: integer, source: input, description: "Release duration in whole days; > 0" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled release start; must not be before the current logical clock at creation" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start + duration_days days (half-open interval end)" }
      - { name: volume_af, type: integer, source: computed, description: "round_half_up(release_cfs * duration_days * 1.9835) acre-feet" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EXECUTED; starts SCHEDULED" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of execution; null until EXECUTED" }

  - name: EnvironmentalConstraint
    parent: null
    common_fields: true
    fields:
      - { name: reservoir_id, type: string, source: system, description: "FK -> Reservoir.id; taken from the URL path" }
      - { name: species, type: enum, source: input, description: "SALMON | SMELT | STURGEON" }
      - { name: requirement_type, type: enum, source: input, description: "MIN_FLOW | PULSE_FLOW | MAX_RELEASE" }
      - { name: required_min_cfs, type: integer, source: input, description: "Required minimum flow; required for MIN_FLOW and PULSE_FLOW, forbidden for MAX_RELEASE" }
      - { name: max_release_cfs, type: integer, source: input, description: "Maximum permitted release rate; required for MAX_RELEASE, forbidden for MIN_FLOW and PULSE_FLOW" }
      - { name: enforce_start, type: datetime, source: input, description: "Enforcement window start (inclusive); must be before enforce_end" }
      - { name: enforce_end, type: datetime, source: input, description: "Enforcement window end (exclusive); half-open interval" }

  - name: ComplianceIncident
    parent: null
    common_fields: true
    fields:
      - { name: reservoir_id, type: string, source: system, description: "FK -> Reservoir.id; reservoir whose release violated a constraint" }
      - { name: constraint_id, type: string, source: system, description: "FK -> EnvironmentalConstraint.id; the violated constraint" }
      - { name: release_order_id, type: string, source: system, description: "FK -> ReleaseOrder.id; the executed release that violated" }
      - { name: deficit_cfs, type: integer, source: computed, description: "Violation magnitude: required_min_cfs - release_cfs for MIN_FLOW/PULSE_FLOW, release_cfs - max_release_cfs for MAX_RELEASE" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED; starts OPEN" }
      - { name: resolution, type: enum, source: input, description: "FLOW_RESTORED | VARIANCE_GRANTED; set by resolve; null while OPEN" }

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> WaterContract.id; contract being delivered against" }
      - { name: water_year_id, type: string, source: input, description: "FK -> WaterYear.id; operating year of the delivery" }
      - { name: allocation_line_id, type: string, source: computed, description: "FK -> AllocationLine.id; resolved from the current PUBLISHED announcement of the water year for this contract; re-homed to successor lines on revision" }
      - { name: ordered_af, type: integer, source: input, description: "Ordered acre-feet; > 0, else ERR_INVALID_QUANTITY" }
      - { name: delivered_af, type: integer, source: computed, description: "Delivered acre-feet; starts 0" }
      - { name: fulfillment_status, type: enum, source: system, description: "CONFIRMED | PARTIALLY_DELIVERED | DELIVERED | SHORTED; starts CONFIRMED" }
      - { name: compliance_status, type: enum, source: system, description: "CLEARED | FLAGGED; starts FLAGGED when reservoir compliance_posture is COMPLIANCE_HOLD at creation, else CLEARED; evolves independently of fulfillment_status" }

  - name: RevenuePeriod
    parent: null
    common_fields: true
    fields:
      - { name: reservoir_id, type: string, source: input, description: "FK -> Reservoir.id; the singleton project reservoir" }
      - { name: period_month, type: string, source: input, description: "Month key 'YYYY-MM'; one period per (reservoir, month), duplicates rejected with ERR_DUPLICATE_REVENUE_PERIOD" }
      - { name: rate_cents_per_mwh, type: integer, source: input, description: "Contract power rate in cents per MWh; > 0" }
      - { name: projected_mwh, type: number, source: computed, description: "Sum over releases with scheduled_start in period_month and status IN {SCHEDULED, EXECUTED} of volume_af * power_conversion_mwh_per_af; 2 decimals" }
      - { name: projected_revenue_cents, type: integer, source: computed, description: "round_half_up(projected_mwh * rate_cents_per_mwh); computed at creation" }
      - { name: settled_mwh, type: number, source: computed, description: "Same formula restricted to status == EXECUTED at settle time; null until settle; 2 decimals" }
      - { name: settled_revenue_cents, type: integer, source: computed, description: "round_half_up(settled_mwh * rate_cents_per_mwh); null until settle" }
      - { name: status, type: enum, source: system, description: "PROJECTED | SETTLED; starts PROJECTED" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: from_contract_id, type: string, source: input, description: "FK -> WaterContract.id; seller contract; must differ from to_contract_id" }
      - { name: to_contract_id, type: string, source: input, description: "FK -> WaterContract.id; buyer contract" }
      - { name: water_year_id, type: string, source: input, description: "FK -> WaterYear.id; year whose allocation lines are moved" }
      - { name: quantity_af, type: integer, source: input, description: "Acre-feet to move; > 0, else ERR_INVALID_QUANTITY" }
      - { name: price_cents, type: integer, source: input, description: "Consideration between districts; >= 0; default 0", default: 0 }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | REVISION_REQUESTED | APPROVED | REJECTED | EXECUTED | VOIDED; starts UNDER_REVIEW" }
      - { name: revision_count, type: integer, source: system, description: "Number of REQUEST_REVISION rounds consumed; starts 0; hard cap 3" }
      - { name: objection_window_end, type: datetime, source: computed, description: "decision timestamp + 72h, set on APPROVE; null until APPROVED" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of execution; null until EXECUTED" }

  - name: ImpactReview
    parent: null
    common_fields: true
    fields:
      - { name: transfer_request_id, type: string, source: system, description: "FK -> TransferRequest.id; taken from the URL path" }
      - { name: reviewer_district_id, type: string, source: system, description: "FK -> District.id; taken from X-User-ID of the filing DistrictManager; must not be a transfer party" }
      - { name: claimed_impact_af, type: integer, source: input, description: "Claimed third-party impact in acre-feet; > 0, else ERR_INVALID_QUANTITY" }
      - { name: basis, type: enum, source: input, description: "JUNIOR_IMPAIRMENT | RETURN_FLOW | ENVIRONMENTAL" }
      - { name: status, type: enum, source: system, description: "FILED | SUSTAINED | DISMISSED; starts FILED" }
      - { name: resolution_rationale, type: string, source: input, description: "Director rationale at resolve; null while FILED" }

  - name: ShortageAgreement
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Drought contingency sharing agreement name" }
      - { name: tier_1_senior_pct, type: integer, source: input, description: "Percent of max_annual_quantity_af guaranteed to SENIOR contracts in TIER_1; 0..100" }
      - { name: tier_1_junior_pct, type: integer, source: input, description: "Percent guaranteed to JUNIOR contracts in TIER_1; 0..100" }
      - { name: tier_2_senior_pct, type: integer, source: input, description: "Percent guaranteed to SENIOR contracts in TIER_2; 0..100" }
      - { name: tier_2_junior_pct, type: integer, source: input, description: "Percent guaranteed to JUNIOR contracts in TIER_2; 0..100" }
      - { name: quorum_district_count, type: integer, source: input, description: "Ratifications required to reach RATIFIED; >= 1" }
      - { name: signatory_district_ids, type: array, source: system, description: "List of District id values that have ratified (element-wise references, not a single FK); duplicates rejected with ERR_ALREADY_RATIFIED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | RATIFIED | ACTIVATED; starts PROPOSED" }
      - { name: activated_water_year_label, type: integer, source: system, description: "Water year label this agreement was activated against; null until ACTIVATED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WaterYear
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ANNOUNCED
        trigger: "system: first POST /water/allocation-announcements/{id}/publish on any announcement of this year"
        actor: system
        preconditions: []
        side_effects:
          - "WaterYear.current_announcement_id := published announcement id"
          - "increments WaterYear.version by 1"
      - from: ANNOUNCED
        to: ANNOUNCED
        trigger: "system: publish of a later announcement (mid-season revision supersede)"
        actor: system
        preconditions: []
        side_effects:
          - "WaterYear.current_announcement_id := newly published announcement id"
          - "increments WaterYear.version by 1"
      - from: ANNOUNCED
        to: CLOSED
        trigger: "POST /water/water-years/{id}/finalize"
        actor: ReclamationOperator
        preconditions:
          - "WaterYear.current_announcement_id is not null (else ERR_NO_PUBLISHED_ANNOUNCEMENT)"
        side_effects:
          - "increments WaterYear.version by 1"
          - "blocks further announcements, observations, deliveries, transfers for this year"

  - entity: WaterContract
    field: status
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /water/contracts/{id}/suspend"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "increments WaterContract.version by 1"
          - "existing delivery orders and transfers are NOT affected; only new delivery-order creation and transfer participation are blocked"

  - entity: AllocationAnnouncement
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /water/allocation-announcements/{id}/publish"
        actor: ReclamationOperator
        preconditions:
          - "WaterYear.status != CLOSED (else ERR_YEAR_CLOSED)"
        side_effects:
          - "computes declared_supply_af via forecast_declared_supply and shortage_tier via shortage_tier_classification"
          - "allocation_basis := SHORTAGE_SHARING if a ShortageAgreement with status ACTIVATED has activated_water_year_label == WaterYear.label, else PRIORITY_WATERFALL"
          - "creates one AllocationLine per ACTIVE WaterContract via priority_waterfall_allocation or shortage_sharing_allocation, carrying delivered_af / transfer_in_af / transfer_out_af forward from the superseded announcement's line for the same contract"
          - "all other announcements of this year (DRAFT or PUBLISHED) -> SUPERSEDED"
          - "WaterYear -> ANNOUNCED (first publish) with current_announcement_id updated; increments WaterYear.version by 1"
          - "curtailment cascade: delivery orders re-homed to this announcement's lines, then per contract while delivered_af + sum(ordered_af - delivered_af over CONFIRMED/PARTIALLY_DELIVERED orders) > allocated_af, demote the newest active order (DeliveryOrder.created_at DESC, tie ordered_af DESC) to SHORTED; recompute AllocationLine.remaining_af last"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: any other announcement of the same year publishes"
        actor: system
        preconditions: []
        side_effects:
          - "its AllocationLines are retained as historical record"

  - entity: ReleaseOrder
    field: status
    initial_state: SCHEDULED
    terminal_states: [EXECUTED]
    transitions:
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /water/release-orders/{id}/execute"
        actor: ReclamationOperator
        preconditions:
          - "logical clock inside [scheduled_start, scheduled_end) (else ERR_RELEASE_WINDOW_INVALID)"
          - "Reservoir.current_storage_af >= volume_af (else ERR_INSUFFICIENT_STORAGE); storage check runs BEFORE the window check"
        side_effects:
          - "Reservoir.current_storage_af -= volume_af"
          - "executed_at := logical clock"
          - "for each EnvironmentalConstraint whose [enforce_start, enforce_end) contains the execution instant and which this release violates (release_cfs < required_min_cfs, or release_cfs > max_release_cfs): the release still executes and a ComplianceIncident(status=OPEN, deficit_cfs per formula) is created; that creation then sets Reservoir.compliance_posture := COMPLIANCE_HOLD and recomputes open_incident_count"

  - entity: ComplianceIncident
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /water/compliance-incidents/{id}/resolve"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects:
          - "resolution recorded"
          - "if no OPEN incidents remain on the reservoir: Reservoir.compliance_posture := NORMAL, and every DeliveryOrder with compliance_status == FLAGGED -> CLEARED (fulfillment_status untouched)"

  - entity: DeliveryOrder
    field: fulfillment_status
    initial_state: CONFIRMED
    terminal_states: [DELIVERED, SHORTED]
    note: "parallel dimensions: fulfillment_status and compliance_status evolve independently; record-delivery never touches compliance_status and FLAGGED never blocks record-delivery"
    transitions:
      - from: CONFIRMED
        to: PARTIALLY_DELIVERED
        trigger: "POST /water/delivery-orders/{id}/record-delivery with delivered_af < outstanding"
        actor: ReclamationOperator
        preconditions:
          - "delivered_af payload > 0 and <= ordered_af - delivered_af (else ERR_INVALID_QUANTITY)"
        side_effects:
          - "DeliveryOrder.delivered_af += payload"
          - "AllocationLine.delivered_af and remaining_af recomputed"
      - from: [CONFIRMED, PARTIALLY_DELIVERED]
        to: DELIVERED
        trigger: "POST /water/delivery-orders/{id}/record-delivery with delivered_af == outstanding"
        actor: ReclamationOperator
        preconditions: []
        side_effects:
          - "AllocationLine.delivered_af and remaining_af recomputed"
      - from: [CONFIRMED, PARTIALLY_DELIVERED]
        to: SHORTED
        trigger: "system: curtailment cascade on announcement publish (newest active orders first: created_at DESC, tie ordered_af DESC)"
        actor: system
        preconditions: []
        side_effects:
          - "delivered_af already recorded is preserved; undelivered remainder is released from the line reservation"
          - "AllocationLine.remaining_af recomputed after all demotions"

  - entity: DeliveryOrder
    field: compliance_status
    initial_state: CLEARED
    terminal_states: []
    transitions:
      - from: CLEARED
        to: FLAGGED
        trigger: "system: set at creation when Reservoir.compliance_posture == COMPLIANCE_HOLD"
        actor: system
        preconditions: []
        side_effects: []
      - from: FLAGGED
        to: CLEARED
        trigger: "system: reservoir posture returns to NORMAL (last OPEN incident resolved)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RevenuePeriod
    field: status
    initial_state: PROJECTED
    terminal_states: [SETTLED]
    transitions:
      - from: PROJECTED
        to: SETTLED
        trigger: "POST /water/revenue-periods/{id}/settle"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "settled_mwh / settled_revenue_cents computed over EXECUTED releases only"
          - "repayment_credit_distribution: per-contract credit round_half_up(settled_revenue_cents * repayment_obligation_cents / total_repayment_obligation_cents); remainder (settled_revenue_cents - sum(credits)) assigned to the contract with the largest outstanding balance (repayment_obligation_cents - repaid_credits_cents), tie broken by contract_number ASC"
          - "each WaterContract.repaid_credits_cents += its credit"
          - "Reservoir.unrecovered_balance_cents recomputed (decreases by exactly sum(credits))"

  - entity: TransferRequest
    field: status
    initial_state: UNDER_REVIEW
    terminal_states: [REJECTED, EXECUTED, VOIDED]
    note: "cyclic review loop: UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW, bounded at 3 revision rounds"
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /water/transfer-requests/{id}/decide with decision=APPROVE"
        actor: RegionalDirector
        preconditions:
          - "no ImpactReview with status FILED exists on this transfer (else ERR_REVIEW_PENDING)"
        side_effects:
          - "objection_window_end := logical clock + 72h"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /water/transfer-requests/{id}/decide with decision=REJECT"
        actor: RegionalDirector
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /water/transfer-requests/{id}/decide with decision=REQUEST_REVISION"
        actor: RegionalDirector
        preconditions:
          - "revision_count < 3 (else ERR_REVISION_LIMIT_EXCEEDED)"
        side_effects:
          - "revision_count += 1"
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /water/transfer-requests/{id}/resubmit (seller district may amend quantity_af / price_cents)"
        actor: DistrictManager
        preconditions:
          - "X-User-ID == from_contract.district_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "amended quantity_af re-validated against the from-line remaining_af (else ERR_ALLOCATION_EXCEEDED)"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /water/transfer-requests/{id}/execute"
        actor: ReclamationOperator
        preconditions:
          - "logical clock >= objection_window_end (else ERR_OBJECTION_WINDOW_OPEN)"
        side_effects:
          - "on the CURRENT PUBLISHED announcement's lines: from-line.transfer_out_af += quantity_af; to-line.transfer_in_af += quantity_af; both remaining_af recomputed"
          - "executed_at := logical clock"
      - from: [UNDER_REVIEW, REVISION_REQUESTED, APPROVED]
        to: VOIDED
        trigger: "system: an ImpactReview on this transfer is resolved SUSTAINED"
        actor: system
        preconditions: []
        side_effects:
          - "no ledger movement has occurred yet; lines unchanged"

  - entity: ImpactReview
    field: status
    initial_state: FILED
    terminal_states: [SUSTAINED, DISMISSED]
    transitions:
      - from: FILED
        to: SUSTAINED
        trigger: "POST /water/impact-reviews/{id}/resolve with outcome=SUSTAINED"
        actor: RegionalDirector
        preconditions: []
        side_effects:
          - "TransferRequest -> VOIDED (when not already terminal)"
      - from: FILED
        to: DISMISSED
        trigger: "POST /water/impact-reviews/{id}/resolve with outcome=DISMISSED"
        actor: RegionalDirector
        preconditions: []
        side_effects: []

  - entity: ShortageAgreement
    field: status
    initial_state: PROPOSED
    terminal_states: []
    transitions:
      - from: PROPOSED
        to: RATIFIED
        trigger: "system: POST /water/shortage-agreements/{id}/ratify brings signatory_district_ids count >= quorum_district_count"
        actor: system
        preconditions: []
        side_effects: []
      - from: RATIFIED
        to: ACTIVATED
        trigger: "POST /water/shortage-agreements/{id}/activate"
        actor: RegionalDirector
        preconditions:
          - "a WaterYear with the given label exists (else ERR_NOT_FOUND)"
          - "that year has a PUBLISHED announcement with shortage_tier IN {TIER_1, TIER_2} (else ERR_ACTIVATION_CONFLICT)"
          - "no other ShortageAgreement is ACTIVATED with the same activated_water_year_label (else ERR_ACTIVATION_CONFLICT)"
        side_effects:
          - "activated_water_year_label := payload label"
          - "the year's current PUBLISHED announcement has allocation_basis := SHORTAGE_SHARING and its AllocationLines are recomputed in place via shortage_sharing_allocation (carried delivered/transfer totals preserved); affected lines' remaining_af recomputed; curtailment cascade then runs as on publish"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: announcement-create-stale-water-year
    parent_entity: WaterYear
    write_endpoint: "POST /water/water-years/{id}/allocation-announcements"
    occ_field: expected_water_year_version
    description: |
      Creating an AllocationAnnouncement against a WaterYear whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has already created the next draft announcement
      (each create legitimately supersedes the client's plan on publish), so the
      current writer's view of the year is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: release_volume_af
    trigger: "ReleaseOrder creation"
    algorithm: conversion
    formula: |
      volume_af = round_half_up(release_cfs * duration_days * CFS_DAY_TO_AF) to integer acre-feet.
      Rounding happens PER RELEASE at creation; never re-derived from other releases.
    input_set: "the release being created"
    constants:
      CFS_DAY_TO_AF: 1.9835
    precision: "0 decimal places, round_half_up"

  - name: forecast_declared_supply
    trigger: "AllocationAnnouncement publish"
    algorithm: forward_looking
    formula: |
      Let F = value of the latest RUNOFF_FORECAST_AF observation for the year
      (latest by observed_on; tie broken by created_at DESC; missing -> F = 0).
      Let P = value of the latest SNOWPACK_INDEX observation (same ordering; missing -> P = 0).
      F_adjusted = round_half_up(F * P / 100) to integer acre-feet.
      usable_storage = max(0, Reservoir.current_storage_af - Reservoir.dead_pool_af)
      holdback = round_half_up(Reservoir.flood_control_max_storage_af * FC_HOLDBACK_PCT)
                 when the logical-clock month at publish is in FLOOD_MONTHS, else 0.
      declared_supply_af = max(0, usable_storage + F_adjusted - holdback)
      MEASURED_INFLOW_AF observations are NOT part of this formula (they credit storage directly).
    input_set: "HydrologyObservation rows of this WaterYear (any observation order; selection by observed_on DESC, created_at DESC); the singleton Reservoir"
    constants:
      FC_HOLDBACK_PCT: 0.10
      FLOOD_MONTHS: [11, 12, 1, 2, 3]
    precision: "integer acre-feet, round_half_up at each rounding step in the written order"

  - name: shortage_tier_classification
    trigger: "AllocationAnnouncement publish (after forecast_declared_supply)"
    algorithm: threshold
    formula: |
      total_max = sum(WaterContract.max_annual_quantity_af over status == ACTIVE)
      if total_max == 0: shortage_tier = NONE
      else:
        ratio = declared_supply_af / total_max
        shortage_tier = TIER_2 if ratio < TIER_2_RATIO
                        else TIER_1 if ratio < TIER_1_RATIO
                        else NONE
      Boundaries are strict-less-than: ratio exactly 0.75 -> NONE; exactly 0.50 -> TIER_1.
    input_set: "ACTIVE WaterContracts of the project; the just-computed declared_supply_af"
    constants:
      TIER_1_RATIO: 0.75
      TIER_2_RATIO: 0.50
    precision: "ratio compared in exact arithmetic (declared_supply_af * 100 vs TIER_*_RATIO*100 * total_max); no float rounding"

  - name: priority_waterfall_allocation
    trigger: "AllocationAnnouncement publish when allocation_basis == PRIORITY_WATERFALL"
    algorithm: waterfall_allocation
    formula: |
      Order ACTIVE contracts: SENIOR class first, then JUNIOR; within a class by
      WaterContract.created_at ASC, tie broken by contract_number ASC.
      Walk in order; each contract receives min(max_annual_quantity_af, remaining_supply);
      remaining_supply decreases accordingly. A contract exactly at the boundary receives
      the exact remaining supply (>= comparison, not >).
    input_set: "ACTIVE WaterContracts; declared_supply_af of the publishing announcement"
    precision: "integer acre-feet; no rounding"

  - name: shortage_sharing_allocation
    trigger: "AllocationAnnouncement publish when allocation_basis == SHORTAGE_SHARING, and ShortageAgreement activation (in-place recompute)"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned (circular-looking inputs resolved in this exact order):
      (1) declared_supply_af already computed; (2) shortage_tier already classified;
      (3) raw_share_c = round_half_up(max_annual_quantity_c * pct_c(tier)) per contract,
          where pct comes from the ACTIVATED ShortageAgreement columns for the tier and
          the contract's priority_class;
      (4) if sum(raw_shares) > declared_supply_af, reduce JUNIOR lines newest-first
          (WaterContract.created_at DESC, tie contract_number DESC), each to
          max(0, share - outstanding_excess), until the total fits; SENIOR lines are never reduced.
    input_set: "ACTIVE WaterContracts; ACTIVATED ShortageAgreement covering the year; declared_supply_af; shortage_tier"
    precision: "integer acre-feet; per-contract round_half_up happens BEFORE the cap step"
    variants:
      - name: vs_priority_waterfall
        when: "same year, same contracts, same declared supply"
        difference: "guarantee-percentage sharing instead of strict priority; identical inputs yield different per-contract allocated_af"

  - name: allocation_remaining_balance
    trigger: "delivery order create, record-delivery, transfer execute, curtailment cascade, announcement publish"
    algorithm: aggregation
    formula: |
      remaining_af = allocated_af + transfer_in_af - transfer_out_af
                     - delivered_af
                     - sum(ordered_af - delivered_af over DeliveryOrders on this line
                           with fulfillment_status IN {CONFIRMED, PARTIALLY_DELIVERED})
      May go negative after a curtailment revision; a non-positive remaining_af blocks
      any new delivery order (ordered_af >= 1 > remaining_af).
    input_set: "the AllocationLine and its DeliveryOrders in the named states"
    precision: "integer acre-feet"

  - name: revision_curtailment_cascade
    trigger: "announcement publish (and shortage activation recompute)"
    algorithm: chronological
    formula: |
      For each contract line of the new announcement:
        over_commitment = delivered_af + sum(ordered_af - delivered_af over active orders)
        while over_commitment > allocated_af and active orders remain:
          demote the newest active order (created_at DESC, tie ordered_af DESC) to SHORTED
          (its delivered_af is preserved; its undelivered remainder stops reserving)
          recompute over_commitment
      Then recompute remaining_af via allocation_remaining_balance.
    input_set: "DeliveryOrders with fulfillment_status IN {CONFIRMED, PARTIALLY_DELIVERED} re-homed to the new line"
    precision: "integer acre-feet"

  - name: reservoir_storage_balance
    trigger: "MEASURED_INFLOW_AF observation creation; ReleaseOrder execution"
    algorithm: chronological
    formula: |
      current_storage_af = initial_storage_af
                           + sum(value over MEASURED_INFLOW_AF observations, applied at creation)
                           - sum(volume_af over EXECUTED releases, applied at execute)
      Event order is application order (creation / execution instants on the logical clock).
    input_set: "the singleton Reservoir; all HydrologyObservations of type MEASURED_INFLOW_AF (any water year); all EXECUTED ReleaseOrders"
    precision: "integer acre-feet"

  - name: hydropower_revenue
    trigger: "RevenuePeriod creation (projected) and settle (settled)"
    algorithm: aggregation
    formula: |
      Pinned evaluation order (rounding order is observable):
      (1) per release: volume_af is ALREADY an integer (rounded at release creation);
      (2) period_volume = sum(volume_af over included releases);
      (3) mwh = round_half_up(period_volume * Reservoir.power_conversion_mwh_per_af, 2);
      (4) revenue_cents = round_half_up(mwh * rate_cents_per_mwh, 0).
      included releases for projected: status IN {SCHEDULED, EXECUTED} and scheduled_start within period_month;
      included releases for settled: status == EXECUTED and scheduled_start within period_month.
    input_set: "ReleaseOrders of the reservoir whose scheduled_start falls inside period_month (month boundaries inclusive of the 1st 00:00:00, exclusive of next month's 1st)"
    precision: "mwh 2 decimals round_half_up; revenue integer cents round_half_up"
    variants:
      - name: projected_vs_settled
        when: "same period, same releases"
        difference: "input-set filtering only: projected includes still-SCHEDULED releases, settled excludes them; identical data yields different revenue when any release in the month remains SCHEDULED at settle time"

  - name: repayment_credit_distribution
    trigger: "RevenuePeriod settle"
    algorithm: weighted_scoring
    formula: |
      total_obligation = sum(repayment_obligation_cents over ALL WaterContracts any status)
      per contract c (evaluated in contract_number ASC order):
        credit_c = round_half_up(settled_revenue_cents * obligation_c / total_obligation, 0)
      remainder = settled_revenue_cents - sum(credit_c)
      if remainder != 0: assign remainder to the contract with the largest
        outstanding (repayment_obligation_cents - repaid_credits_cents);
        tie broken by contract_number ASC.
      Invariant: sum(repaid_credits_cents) + Reservoir.unrecovered_balance_cents
                 == total_repayment_obligation_cents at all times.
    input_set: "all WaterContracts (any status); the settling RevenuePeriod"
    precision: "integer cents; per-contract rounding BEFORE the remainder step (per-line-then-sum order is pinned)"
    variants:
      - name: per_line_rounding_order
        when: "compared against sum-then-round"
        difference: "rounding each credit before summing leaves a nonzero remainder on non-divisible inputs, which the remainder rule assigns; sum-then-round would silently absorb it"

  - name: env_window_overlap
    trigger: "EnvironmentalConstraint creation with requirement_type == PULSE_FLOW"
    algorithm: interval_merge
    formula: |
      Half-open interval semantics on [enforce_start, enforce_end):
      the new pulse window is rejected iff there exists another PULSE_FLOW constraint on the
      same reservoir with enforce_start < new.enforce_end AND new.enforce_start < enforce_end.
      Adjacency (new.enforce_start == existing.enforce_end or vice versa) is NOT overlap and is allowed.
    input_set: "PULSE_FLOW EnvironmentalConstraints of the same reservoir (MIN_FLOW / MAX_RELEASE constraints never participate)"
    precision: "datetime equality at boundaries is exact"

  - name: outlet_capacity_daily
    trigger: "ReleaseOrder creation"
    algorithm: threshold
    formula: |
      For every calendar day D touched by [scheduled_start, scheduled_end):
        load_D = sum(release_cfs over ReleaseOrders of the same reservoir with
                     status IN {SCHEDULED, EXECUTED} whose [scheduled_start, scheduled_end) touches D)
        reject if load_D + new.release_cfs > Reservoir.outlet_capacity_cfs
      Equality (== outlet_capacity_cfs) is allowed; this is aggregate-capacity semantics,
      not pairwise-interval semantics.
    input_set: "non-terminal ReleaseOrders (SCHEDULED or EXECUTED) of the same reservoir"
    precision: "integer cfs; strict > rejects"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request shape: required fields present, types valid, enum members valid, ranges (pct 0..100, enforce_start < enforce_end, season_start < season_end, initial_storage_af <= capacity_af, dead_pool_af < capacity_af, from_contract_id != to_contract_id, period_month matches 'YYYY-MM')"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutations"
  - priority: 4
    category: existence
    check: "path ids resolve left-to-right, then body FK ids in the endpoint's declared input order; for impact-review creation the reviewer District (X-User-ID) must exist; for MEASURED_INFLOW_AF observations the singleton Reservoir must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: auth
    check: "ownership / segregation of duties: delivery-order create and transfer create/resubmit require X-User-ID == from/contract district_id (ERR_OWNERSHIP_MISMATCH); impact-review filing requires the reviewer district to be neither transfer party (ERR_REVIEWER_CONFLICT)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /water/delivery-orders, POST /water/transfer-requests, POST /water/transfer-requests/{id}/resubmit, POST /water/transfer-requests/{id}/impact-reviews"
  - priority: 6
    category: state
    check: "target resource in a valid state for the requested transition: contract not SUSPENDED for delivery/transfer creation (ERR_CONTRACT_SUSPENDED, from-contract checked before to-contract); water year ANNOUNCED for delivery/transfer creation (OPEN -> ERR_YEAR_NOT_ANNOUNCED; CLOSED -> ERR_YEAR_CLOSED); year not CLOSED for observations/announcements (ERR_YEAR_CLOSED); announcement DRAFT for publish (ERR_INVALID_STATE); release SCHEDULED for execute (ERR_INVALID_STATE); order CONFIRMED/PARTIALLY_DELIVERED for record-delivery (ERR_INVALID_STATE); period PROJECTED for settle (ERR_INVALID_STATE); transfer UNDER_REVIEW for decide / REVISION_REQUESTED for resubmit / APPROVED for execute (ERR_INVALID_STATE); review FILED for resolve (ERR_INVALID_STATE); agreement PROPOSED for ratify / RATIFIED for activate (ERR_INVALID_STATE); finalize requires a PUBLISHED announcement (ERR_NO_PUBLISHED_ANNOUNCEMENT); decide REQUEST_REVISION requires revision_count < 3 (ERR_REVISION_LIMIT_EXCEEDED); reservoir compliance_posture NORMAL for release creation (ERR_COMPLIANCE_HOLD); contract ACTIVE before year check on delivery create"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition and state-gated creation endpoints"
  - priority: 7
    category: business_safety
    check: "environmental / regulatory, in this exact sub-order: (a) MIN_FLOW: release_cfs < required_min_cfs of any MIN_FLOW or PULSE_FLOW constraint whose window intersects [scheduled_start, scheduled_end) -> ERR_ENV_MIN_FLOW_VIOLATION; (b) MAX_RELEASE: release_cfs > max_release_cfs of any MAX_RELEASE constraint whose window intersects -> ERR_MAX_RELEASE_EXCEEDED; (c) flood control: logical-clock month in FLOOD_MONTHS and current_storage_af > flood_control_max_storage_af and purpose != FLOOD_CONTROL -> ERR_FLOOD_CONTROL_REQUIRED; (d) PULSE_FLOW window overlap with an existing PULSE_FLOW constraint on the same reservoir -> ERR_PULSE_WINDOW_OVERLAP"
    error_id: ERR_ENV_MIN_FLOW_VIOLATION
    http_status: 422
    applies_to: "POST /water/reservoirs/{id}/release-orders, POST /water/reservoirs/{id}/environmental-constraints"
  - priority: 8
    category: business_constraint
    check: "constraint satisfaction: outlet_capacity_daily (ERR_OUTLET_CAPACITY_EXCEEDED); execute storage sufficiency ERR_INSUFFICIENT_STORAGE (runs before the window check); singleton reservoir (ERR_RESERVOIR_ALREADY_EXISTS); duplicate contract_number (ERR_DUPLICATE_CONTRACT_NUMBER); duplicate water-year label (ERR_DUPLICATE_WATER_YEAR); duplicate (reservoir, period_month) (ERR_DUPLICATE_REVENUE_PERIOD); duplicate review by same district on same transfer (ERR_DUPLICATE_REVIEW); already-signatory ratify (ERR_ALREADY_RATIFIED); activation conflicts (ERR_ACTIVATION_CONFLICT); quantity > 0 where required (ERR_INVALID_QUANTITY); record-delivery amount <= outstanding (ERR_INVALID_QUANTITY)"
    error_id: ERR_OUTLET_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "creation and execution endpoints"
  - priority: 9
    category: business_temporal
    check: "temporal windows: scheduled_start must not precede the logical clock at creation (ERR_SCHEDULE_IN_PAST); execute requires clock in [scheduled_start, scheduled_end) (ERR_RELEASE_WINDOW_INVALID); transfer execute requires clock >= objection_window_end (ERR_OBJECTION_WINDOW_OPEN); impact-review filing on an APPROVED transfer requires clock < objection_window_end (ERR_OBJECTION_WINDOW_CLOSED)"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "release creation/execution, transfer execute, impact-review filing"
  - priority: 10
    category: business_referential
    check: "cross-entity references consistent: decide APPROVE requires zero ImpactReviews with status FILED on the transfer (ERR_REVIEW_PENDING)"
    error_id: ERR_REVIEW_PENDING
    http_status: 409
    applies_to: "POST /water/transfer-requests/{id}/decide"
  - priority: 11
    category: business_fiscal
    check: "quantity <= remaining_af of the resolved allocation line (delivery create: line of the year's current announcement for the contract; transfer create/resubmit: from-line) -> ERR_ALLOCATION_EXCEEDED"
    error_id: ERR_ALLOCATION_EXCEEDED
    http_status: 422
    applies_to: "POST /water/delivery-orders, POST /water/transfer-requests, POST /water/transfer-requests/{id}/resubmit"

# =============================================================================
# 1.5 API Endpoint Table (46 endpoints)
# =============================================================================
endpoints:
  # --- test-driving clock (outside api_prefix, per platform convention) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any set call the logical clock reads exactly 2026-09-01T00:00:00Z (fixed startup default; never falls back to wall-clock time)."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; nothing else mutates"]

  # --- Districts ---
  - method: POST
    path: "/water/districts"
    description: "Register a water district"
    roles: [SystemAdmin]
    code: 201
    input: [name, service_area_acres, contact_email]
    output: District
    side_effects: []
  - method: GET
    path: "/water/districts/{id}"
    description: "Get a district"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: District
    side_effects: []

  # --- WaterContracts ---
  - method: POST
    path: "/water/contracts"
    description: "Execute a long-term water service / repayment contract; starts ACTIVE"
    roles: [SystemAdmin]
    code: 201
    input: [district_id, contract_number, priority_class, max_annual_quantity_af, repayment_obligation_cents]
    output: WaterContract
    side_effects: ["Reservoir.total_repayment_obligation_cents and unrecovered_balance_cents recompute (if reservoir exists)"]
  - method: GET
    path: "/water/contracts/{id}"
    description: "Get a contract"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: WaterContract
    side_effects: []
  - method: GET
    path: "/water/contracts"
    description: "List/filter contracts"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["district_id?", "status?", "priority_class?", "limit?", "offset?"]
    output: WaterContract[]
    side_effects: []
  - method: POST
    path: "/water/contracts/{id}/suspend"
    description: "Suspend a contract (repayment delinquency); ACTIVE -> SUSPENDED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: WaterContract
    side_effects: ["increments WaterContract.version by 1"]

  # --- WaterYears ---
  - method: POST
    path: "/water/water-years"
    description: "Open a water operating year"
    roles: [ReclamationOperator]
    code: 201
    input: [label, season_start, season_end]
    output: WaterYear
    side_effects: ["status=OPEN, current_announcement_id=null"]
  - method: GET
    path: "/water/water-years/{id}"
    description: "Get a water year"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: WaterYear
    side_effects: []
  - method: POST
    path: "/water/water-years/{id}/finalize"
    description: "Close the water year (ANNOUNCED -> CLOSED)"
    roles: [ReclamationOperator]
    code: 200
    input: []
    output: WaterYear
    side_effects: ["increments WaterYear.version by 1"]

  # --- HydrologyObservations ---
  - method: POST
    path: "/water/water-years/{id}/hydrology-observations"
    description: "Post a snowpack / runoff-forecast / measured-inflow observation"
    roles: [HydrologyOfficer]
    code: 201
    input: [observation_type, value, observed_on]
    output: HydrologyObservation
    side_effects: ["if observation_type == MEASURED_INFLOW_AF: Reservoir.current_storage_af += value (singleton reservoir must exist, else ERR_NOT_FOUND)"]
  - method: GET
    path: "/water/water-years/{id}/hydrology-observations"
    description: "List observations of a water year"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["observation_type?", "limit?", "offset?"]
    output: HydrologyObservation[]
    side_effects: []

  # --- AllocationAnnouncements ---
  - method: POST
    path: "/water/water-years/{id}/allocation-announcements"
    description: "Create a DRAFT allocation announcement (OCC-guarded on the water year)"
    roles: [ReclamationOperator]
    code: 201
    input: [expected_water_year_version]
    output: AllocationAnnouncement
    side_effects: ["increments WaterYear.version by 1", "sequence_number := prior max + 1"]
  - method: GET
    path: "/water/water-years/{id}/allocation-announcements"
    description: "List announcements of a water year"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AllocationAnnouncement[]
    side_effects: []
  - method: POST
    path: "/water/allocation-announcements/{id}/publish"
    description: "Publish an announcement: computes supply/tier/lines, supersedes siblings, runs curtailment cascade"
    roles: [ReclamationOperator]
    code: 200
    input: []
    output: AllocationAnnouncement
    side_effects:
      - "forecast_declared_supply + shortage_tier_classification computed"
      - "AllocationLines created per ACTIVE contract (waterfall or sharing basis)"
      - "other announcements of the year -> SUPERSEDED; WaterYear -> ANNOUNCED with current_announcement_id updated; increments WaterYear.version by 1"
      - "revision_curtailment_cascade demotes over-committed delivery orders to SHORTED"

  # --- AllocationLines ---
  - method: GET
    path: "/water/allocation-lines"
    description: "List/filter allocation lines"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["announcement_id?", "contract_id?", "limit?", "offset?"]
    output: AllocationLine[]
    side_effects: []
  - method: GET
    path: "/water/allocation-lines/{id}"
    description: "Get an allocation line"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: AllocationLine
    side_effects: []

  # --- Reservoirs ---
  - method: POST
    path: "/water/reservoirs"
    description: "Create the project reservoir (singleton; second create -> ERR_RESERVOIR_ALREADY_EXISTS)"
    roles: [SystemAdmin]
    code: 201
    input: [name, capacity_af, dead_pool_af, flood_control_max_storage_af, initial_storage_af, outlet_capacity_cfs, power_conversion_mwh_per_af]
    output: Reservoir
    side_effects: ["current_storage_af := initial_storage_af; compliance_posture := NORMAL"]
  - method: GET
    path: "/water/reservoirs/{id}"
    description: "Get the reservoir with computed storage and finance fields"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: Reservoir
    side_effects: []

  # --- ReleaseOrders ---
  - method: POST
    path: "/water/reservoirs/{id}/release-orders"
    description: "Schedule a reservoir release (env safety, flood gate, outlet capacity, posture gates apply)"
    roles: [ReclamationOperator]
    code: 201
    input: [purpose, release_cfs, duration_days, scheduled_start]
    output: ReleaseOrder
    side_effects: ["status=SCHEDULED; volume_af computed via release_volume_af"]
  - method: GET
    path: "/water/reservoirs/{id}/release-orders"
    description: "List release orders of the reservoir"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["status?", "purpose?", "limit?", "offset?"]
    output: ReleaseOrder[]
    side_effects: []
  - method: POST
    path: "/water/release-orders/{id}/execute"
    description: "Execute a scheduled release inside its window; violations execute anyway and log ComplianceIncidents"
    roles: [ReclamationOperator]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects:
      - "Reservoir.current_storage_af -= volume_af; executed_at stamped"
      - "per violated constraint whose window contains the execution instant: ComplianceIncident(OPEN) created, then Reservoir.compliance_posture := COMPLIANCE_HOLD"

  # --- EnvironmentalConstraints ---
  - method: POST
    path: "/water/reservoirs/{id}/environmental-constraints"
    description: "Register an endangered-species flow constraint (enforceable immediately)"
    roles: [EnvironmentalOfficer]
    code: 201
    input: [species, requirement_type, "required_min_cfs?", "max_release_cfs?", enforce_start, enforce_end]
    output: EnvironmentalConstraint
    side_effects: []
  - method: GET
    path: "/water/reservoirs/{id}/environmental-constraints"
    description: "List environmental constraints of the reservoir"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["requirement_type?", "species?", "limit?", "offset?"]
    output: EnvironmentalConstraint[]
    side_effects: []

  # --- ComplianceIncidents ---
  - method: GET
    path: "/water/compliance-incidents"
    description: "List/filter compliance incidents"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["reservoir_id?", "constraint_id?", "release_order_id?", "status?", "limit?", "offset?"]
    output: ComplianceIncident[]
    side_effects: []
  - method: GET
    path: "/water/compliance-incidents/{id}"
    description: "Get a compliance incident"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: ComplianceIncident
    side_effects: []
  - method: POST
    path: "/water/compliance-incidents/{id}/resolve"
    description: "Resolve an OPEN incident; last-open resolution restores posture and unflags delivery orders"
    roles: [EnvironmentalOfficer]
    code: 200
    input: [resolution]
    output: ComplianceIncident
    side_effects: ["if no OPEN incidents remain: Reservoir.compliance_posture := NORMAL; all FLAGGED DeliveryOrders -> CLEARED"]

  # --- DeliveryOrders ---
  - method: POST
    path: "/water/delivery-orders"
    description: "Order water against the contract's current allocation line"
    roles: [DistrictManager]
    code: 201
    input: [contract_id, water_year_id, ordered_af]
    output: DeliveryOrder
    side_effects: ["fulfillment_status=CONFIRMED; compliance_status per reservoir posture; AllocationLine.remaining_af recomputed"]
  - method: GET
    path: "/water/delivery-orders"
    description: "List/filter delivery orders"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["contract_id?", "allocation_line_id?", "water_year_id?", "fulfillment_status?", "limit?", "offset?"]
    output: DeliveryOrder[]
    side_effects: []
  - method: GET
    path: "/water/delivery-orders/{id}"
    description: "Get a delivery order"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []
  - method: POST
    path: "/water/delivery-orders/{id}/record-delivery"
    description: "Record a delivery measurement against an order"
    roles: [ReclamationOperator]
    code: 200
    input: [delivered_af]
    output: DeliveryOrder
    side_effects: ["delivered_af accumulates; fulfillment_status -> PARTIALLY_DELIVERED or DELIVERED; AllocationLine delivered/remaining recomputed; compliance_status untouched"]

  # --- RevenuePeriods ---
  - method: POST
    path: "/water/revenue-periods"
    description: "Open a monthly hydropower revenue period (projected figures at creation)"
    roles: [FinanceOfficer]
    code: 201
    input: [reservoir_id, period_month, rate_cents_per_mwh]
    output: RevenuePeriod
    side_effects: ["projected_mwh and projected_revenue_cents computed over SCHEDULED+EXECUTED releases in the month"]
  - method: GET
    path: "/water/reservoirs/{id}/revenue-periods"
    description: "List revenue periods of the reservoir"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RevenuePeriod[]
    side_effects: []
  - method: POST
    path: "/water/revenue-periods/{id}/settle"
    description: "Settle the period: recompute on EXECUTED releases only and distribute repayment credits"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RevenuePeriod
    side_effects: ["settled_mwh/settled_revenue_cents computed", "repayment_credit_distribution credits WaterContracts and reduces Reservoir.unrecovered_balance_cents by exactly sum(credits)"]

  # --- TransferRequests ---
  - method: POST
    path: "/water/transfer-requests"
    description: "Propose a water transfer/exchange between two districts' contracts; starts UNDER_REVIEW"
    roles: [DistrictManager]
    code: 201
    input: [from_contract_id, to_contract_id, water_year_id, quantity_af, "price_cents?"]
    output: TransferRequest
    side_effects: ["price_cents defaults to 0"]
  - method: GET
    path: "/water/transfer-requests"
    description: "List/filter transfer requests"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["from_contract_id?", "to_contract_id?", "water_year_id?", "status?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []
  - method: GET
    path: "/water/transfer-requests/{id}"
    description: "Get a transfer request"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: POST
    path: "/water/transfer-requests/{id}/decide"
    description: "Director decision: APPROVE | REJECT | REQUEST_REVISION"
    roles: [RegionalDirector]
    code: 200
    input: [decision, "rationale?"]
    output: TransferRequest
    side_effects: ["APPROVE sets objection_window_end := clock + 72h; REQUEST_REVISION increments revision_count (cap 3)"]
  - method: POST
    path: "/water/transfer-requests/{id}/resubmit"
    description: "Seller resubmits after REQUEST_REVISION, optionally amending quantity/price"
    roles: [DistrictManager]
    code: 200
    input: ["quantity_af?", "price_cents?"]
    output: TransferRequest
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/water/transfer-requests/{id}/execute"
    description: "Execute an APPROVED transfer after its objection window; moves allocation between lines"
    roles: [ReclamationOperator]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["from-line.transfer_out_af += quantity_af; to-line.transfer_in_af += quantity_af; remaining_af recomputed on both"]
  - method: POST
    path: "/water/transfer-requests/{id}/impact-reviews"
    description: "Third-party district files an impact review on a transfer"
    roles: [DistrictManager]
    code: 201
    input: [claimed_impact_af, basis]
    output: ImpactReview
    side_effects: ["reviewer_district_id := X-User-ID"]
  - method: GET
    path: "/water/impact-reviews"
    description: "List/filter impact reviews"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: ["transfer_request_id?", "reviewer_district_id?", "status?", "limit?", "offset?"]
    output: ImpactReview[]
    side_effects: []
  - method: GET
    path: "/water/impact-reviews/{id}"
    description: "Get an impact review"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: ImpactReview
    side_effects: []
  - method: POST
    path: "/water/impact-reviews/{id}/resolve"
    description: "Director resolves a review; SUSTAINED voids the transfer"
    roles: [RegionalDirector]
    code: 200
    input: [outcome, "rationale?"]
    output: ImpactReview
    side_effects: ["outcome == SUSTAINED: TransferRequest -> VOIDED (when not already terminal)"]

  # --- ShortageAgreements ---
  - method: POST
    path: "/water/shortage-agreements"
    description: "Draft a drought contingency shortage-sharing agreement"
    roles: [ReclamationOperator]
    code: 201
    input: [name, tier_1_senior_pct, tier_1_junior_pct, tier_2_senior_pct, tier_2_junior_pct, quorum_district_count]
    output: ShortageAgreement
    side_effects: ["status=PROPOSED, signatory_district_ids=[]"]
  - method: GET
    path: "/water/shortage-agreements/{id}"
    description: "Get a shortage agreement"
    roles: [SystemAdmin, ReclamationOperator, HydrologyOfficer, DistrictManager, EnvironmentalOfficer, FinanceOfficer, RegionalDirector]
    code: 200
    input: []
    output: ShortageAgreement
    side_effects: []
  - method: POST
    path: "/water/shortage-agreements/{id}/ratify"
    description: "Calling district ratifies; reaching quorum flips PROPOSED -> RATIFIED"
    roles: [DistrictManager]
    code: 200
    input: []
    output: ShortageAgreement
    side_effects: ["appends X-User-ID district to signatory_district_ids; auto RATIFIED at quorum"]
  - method: POST
    path: "/water/shortage-agreements/{id}/activate"
    description: "Activate sharing for a shortage-tier water year; recomputes that year's lines in place"
    roles: [RegionalDirector]
    code: 200
    input: [water_year_label]
    output: ShortageAgreement
    side_effects: ["activated_water_year_label set; current PUBLISHED announcement allocation_basis := SHORTAGE_SHARING with in-place line recompute + curtailment cascade"]

# =============================================================================
# 1.6 Error Code Catalog (34)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted on this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, bad type, bad enum member, bad range, malformed period_month, from==to contract, enforce_start >= enforce_end, season_start >= season_end" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "any path id or body FK id does not resolve (message names the entity type); also no singleton reservoir when MEASURED_INFLOW_AF is posted" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_water_year_version does not match the WaterYear's current version on announcement create" }
  - { id: ERR_CONTRACT_SUSPENDED, http: 409, condition: "delivery-order or transfer creation against a SUSPENDED contract (from-contract checked before to-contract)" }
  - { id: ERR_YEAR_NOT_ANNOUNCED, http: 409, condition: "delivery-order or transfer creation in a year with no PUBLISHED announcement (status OPEN)" }
  - { id: ERR_YEAR_CLOSED, http: 409, condition: "observation, announcement creation, publish, delivery, or transfer in a CLOSED year" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "state-machine precondition failed generically (double publish, decide on non-UNDER_REVIEW, settle twice, record-delivery on terminal order, resolve twice, ratify non-PROPOSED, activate non-RATIFIED, suspend non-ACTIVE)" }
  - { id: ERR_NO_PUBLISHED_ANNOUNCEMENT, http: 409, condition: "finalize requested on a year with no PUBLISHED announcement" }
  - { id: ERR_REVISION_LIMIT_EXCEEDED, http: 409, condition: "decide REQUEST_REVISION when revision_count == 3" }
  - { id: ERR_COMPLIANCE_HOLD, http: 409, condition: "release-order creation while reservoir compliance_posture is COMPLIANCE_HOLD" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "DistrictManager acting on a contract whose district_id != X-User-ID" }
  - { id: ERR_REVIEWER_CONFLICT, http: 403, condition: "impact review filed by a district that is a party to the transfer" }
  - { id: ERR_ENV_MIN_FLOW_VIOLATION, http: 422, condition: "release_cfs below required_min_cfs of an intersecting MIN_FLOW or PULSE_FLOW constraint (checked first among safety rules)" }
  - { id: ERR_MAX_RELEASE_EXCEEDED, http: 422, condition: "release_cfs above max_release_cfs of an intersecting MAX_RELEASE constraint" }
  - { id: ERR_FLOOD_CONTROL_REQUIRED, http: 422, condition: "non-FLOOD_CONTROL release created while clock month is a flood month and storage exceeds flood_control_max_storage_af" }
  - { id: ERR_PULSE_WINDOW_OVERLAP, http: 409, condition: "new PULSE_FLOW constraint window overlaps (half-open) an existing PULSE_FLOW window on the same reservoir; adjacency allowed" }
  - { id: ERR_OUTLET_CAPACITY_EXCEEDED, http: 422, condition: "per-day aggregate release_cfs would exceed outlet_capacity_cfs; equality allowed" }
  - { id: ERR_INSUFFICIENT_STORAGE, http: 422, condition: "execute with volume_af > current_storage_af; checked before the window check" }
  - { id: ERR_RESERVOIR_ALREADY_EXISTS, http: 409, condition: "second reservoir creation (singleton project reservoir)" }
  - { id: ERR_DUPLICATE_CONTRACT_NUMBER, http: 409, condition: "contract_number already in use" }
  - { id: ERR_DUPLICATE_WATER_YEAR, http: 409, condition: "water-year label already exists" }
  - { id: ERR_DUPLICATE_REVENUE_PERIOD, http: 409, condition: "a RevenuePeriod for (reservoir, period_month) already exists" }
  - { id: ERR_DUPLICATE_REVIEW, http: 409, condition: "same district files a second review on the same transfer" }
  - { id: ERR_ALREADY_RATIFIED, http: 409, condition: "district ratifies an agreement it already signed" }
  - { id: ERR_ACTIVATION_CONFLICT, http: 409, condition: "activate against a year whose current announcement tier is NONE, or another agreement already ACTIVATED for that label" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "ordered_af / quantity_af / claimed_impact_af / delivered_af <= 0, or record-delivery amount exceeds outstanding" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "release scheduled_start precedes the current logical clock" }
  - { id: ERR_RELEASE_WINDOW_INVALID, http: 422, condition: "execute outside [scheduled_start, scheduled_end); storage check runs first" }
  - { id: ERR_OBJECTION_WINDOW_OPEN, http: 409, condition: "transfer execute before objection_window_end (clock >= window end is allowed at equality)" }
  - { id: ERR_OBJECTION_WINDOW_CLOSED, http: 409, condition: "impact review filed on an APPROVED transfer at or after objection_window_end" }
  - { id: ERR_REVIEW_PENDING, http: 409, condition: "decide APPROVE while any ImpactReview on the transfer is FILED" }
  - { id: ERR_ALLOCATION_EXCEEDED, http: 422, condition: "ordered/transferred acre-feet exceed the resolved allocation line's remaining_af" }

# =============================================================================
# 1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Bureau system administrator; seeds districts, contracts, reservoir; drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /water/districts"
      - "POST /water/contracts"
      - "POST /water/reservoirs"
    shared_operations:
      - "all GET endpoints"
  - name: ReclamationOperator
    description: "River operations desk; runs water years, announcements, releases, delivery recording, transfer execution"
    identity: opaque
    exclusive_operations:
      - "POST /water/water-years, POST /water/water-years/{id}/finalize"
      - "POST /water/water-years/{id}/allocation-announcements, POST /water/allocation-announcements/{id}/publish"
      - "POST /water/reservoirs/{id}/release-orders, POST /water/release-orders/{id}/execute"
      - "POST /water/delivery-orders/{id}/record-delivery"
      - "POST /water/transfer-requests/{id}/execute"
      - "POST /water/shortage-agreements"
    shared_operations:
      - "all GET endpoints"
  - name: HydrologyOfficer
    description: "Hydrology data steward; posts snowpack, runoff forecast, and measured inflow observations"
    identity: opaque
    exclusive_operations:
      - "POST /water/water-years/{id}/hydrology-observations"
    shared_operations:
      - "all GET endpoints"
  - name: DistrictManager
    description: "Acts for one District; X-User-ID equals the District id"
    identity: "entity_backed:District"
    exclusive_operations:
      - "POST /water/delivery-orders (own contracts only)"
      - "POST /water/transfer-requests, POST /water/transfer-requests/{id}/resubmit (as seller)"
      - "POST /water/transfer-requests/{id}/impact-reviews (third-party districts only)"
      - "POST /water/shortage-agreements/{id}/ratify"
    shared_operations:
      - "all GET endpoints"
  - name: EnvironmentalOfficer
    description: "Endangered-species compliance desk; registers constraints and resolves incidents; must not run releases"
    identity: opaque
    exclusive_operations:
      - "POST /water/reservoirs/{id}/environmental-constraints"
      - "POST /water/compliance-incidents/{id}/resolve"
    shared_operations:
      - "all GET endpoints"
  - name: FinanceOfficer
    description: "Repayment and power-revenue accountant; suspends delinquent contracts, settles revenue periods; must not run releases"
    identity: opaque
    exclusive_operations:
      - "POST /water/contracts/{id}/suspend"
      - "POST /water/revenue-periods, POST /water/revenue-periods/{id}/settle"
    shared_operations:
      - "all GET endpoints"
  - name: RegionalDirector
    description: "Deciding official for transfers, impact reviews, and drought-plan activation; separated from filing and execution"
    identity: opaque
    exclusive_operations:
      - "POST /water/transfer-requests/{id}/decide"
      - "POST /water/impact-reviews/{id}/resolve"
      - "POST /water/shortage-agreements/{id}/activate"
    shared_operations:
      - "all GET endpoints"
