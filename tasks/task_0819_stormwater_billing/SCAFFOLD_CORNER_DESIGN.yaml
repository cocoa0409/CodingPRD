  # section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_parcel_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[measurement-create-stale-parcel]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Recording a second measurement with the pre-first-measurement parcel version (now stale) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Parcel created (version 1 captured as pv0); one measurement recorded so version advances to 2."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CC1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 9000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
          trigger:
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 12000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "Parcel.${parcel}.impervious_area_sqft == 9000 (unchanged)"

      - name: segregation_of_duties_refund_by_creator_rejected
        claim_type: conditional_feature_flags
        grounds: ["validations[priority=10]", entities.Payment.fields.created_by_user_id, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "A refund whose X-User-ID equals the payment's created_by_user_id returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["Parcel (eru 6.0) with a bill fully paid by clerk 'clerk-a'."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CC2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /payments"
              payload: { bill_id: "${bill}", account_id: "${acct}", amount_cents: 21500, method: "ACH" }
              as: BillingClerk
              as_user_id: "clerk-a"
              captures: { pay: $.data.id }
          trigger:
            - call: "POST /payments/${pay}/refund"
              payload: {}
              as: BillingClerk
              as_user_id: "clerk-a"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Payment.${pay}.status == APPLIED (unchanged)"

      - name: inspection_double_complete_rejected
        claim_type: rate_threshold_triggers
        grounds: [state_machines.CreditInspection.SCHEDULED_to_COMPLETED, "errors[ERR_INSPECTION_ALREADY_COMPLETED]"]
        distinguishing_aspect: "Completing an inspection twice returns ERR_INSPECTION_ALREADY_COMPLETED (409) on the second call."
        test_recipe:
          setup: ["Parcel with ACTIVE credit and a SCHEDULED inspection completed once (PASS)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CC3", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 9000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "CISTERN", self_reported_score: 80, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
