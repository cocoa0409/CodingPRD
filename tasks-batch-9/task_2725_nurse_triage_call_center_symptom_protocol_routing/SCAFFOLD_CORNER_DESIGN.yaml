      - name: a_practice_under_compliance_review_cannot_activate_a_new_coverage_window
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=53]        # ERR_PRACTICE_COMPLIANCE_HOLD
          - state_machines.CoverageWindow.DRAFT_to_ACTIVE
          - entities.Practice.fields.compliance_posture
        distinguishing_aspect: "A coverage window created after the variance cascade has already run is still DRAFT (it was never in existence when the BLOCKED sweep happened), so the refusal must come from the live posture check on activate rather than from the window's own status — the practice itself stays ACTIVE, so this is a compliance hold and not a suspension."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; practice variance_review_threshold is 1."
            - "An ED_NOW disposition (ordinal 4) determined by nurse_a is verified by nurse_c, then audited with reported_outcome ED_ADMITTED (ordinal 5): a one-ordinal UNDERTRIAGE worth 7 points, which escalates the practice to UNDER_REVIEW."
          setup_api_calls:
