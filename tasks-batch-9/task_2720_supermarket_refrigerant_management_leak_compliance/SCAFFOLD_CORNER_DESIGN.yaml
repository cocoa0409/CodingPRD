      - name: unknown_identifier_on_every_single_resource_read_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STORE_NOT_FOUND
          - errors.ERR_REFRIGERANT_TYPE_NOT_FOUND
          - errors.ERR_SYSTEM_NOT_FOUND
          - errors.ERR_TECHNICIAN_NOT_FOUND
