      - name: relocation_to_the_same_unit_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 86]
          - errors[ERR_SAME_UNIT_RELOCATION]
          - state_machines.ShelterAdmission.location_security_status.COMPROMISED_to_RELOCATED
        distinguishing_aspect: |
          Relocation must actually move the household: naming the current unit with its correct
          version is 422 ERR_SAME_UNIT_RELOCATION, so the OCC check at priority 50 passes and the
          admission stays COMPROMISED with prior_unit_id still null.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one ShelterManager (Dana Whit) exist."
            - "Shelter Cedar House has two STANDARD units, A1 and A2, each of bed_capacity 4."
            - "Client C-4012 (household_size 2, minor_children_count 0) holds a RESERVED admission on A1 for [2026-08-07, 2026-08-12) that has been reported COMPROMISED (source DATA_BREACH)."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Whit", role_type: "SHELTER_MANAGER", max_caseload: 20 }
              as: AgencyAdmin
              captures: { mgr_id: "$.data.id" }
            - call: "POST /shelters"
              payload: { name: "Cedar House", confidential_location: true, nightly_rate_cents: 8500, weekend_surcharge_cents: 2500, child_supplement_cents: 1200 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { shelter_id: "$.data.id" }
            - call: "POST /shelters/${shelter_id}/units"
              payload: { unit_label: "A1", unit_type: "STANDARD", bed_capacity: 4 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_a: "$.data.id" }
            - call: "POST /shelters/${shelter_id}/units"
              payload: { unit_label: "A2", unit_type: "STANDARD", bed_capacity: 4 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_b: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-4012", legal_name: "Sana Ives", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Needs a bed Friday." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "POST /screening-requests"
              payload: { client_id: "${client_id}", hotline_call_id: "${call_id}", requested_shelter_id: "${shelter_id}", requested_entry_date: "2026-08-07" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { sr_id: "$.data.id" }
            - call: "POST /screening-requests/${sr_id}/decide"
              payload: { decision: "APPROVE", assigned_advocate_id: "${adv_id}" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
            - call: "GET /shelter-units/${unit_a}"
              payload: {}
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_a_v1: "$.data.version" }
            - call: "POST /shelter-admissions"
              payload: { screening_request_id: "${sr_id}", shelter_unit_id: "${unit_a}", entry_date: "2026-08-07", planned_exit_date: "2026-08-12", expected_shelter_unit_version: "${unit_a_v1}" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { adm_id: "$.data.id" }
            - call: "POST /shelter-admissions/${adm_id}/report-location-compromise"
              payload: { compromise_source: "DATA_BREACH" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
            - call: "GET /shelter-units/${unit_a}"
              payload: {}
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_a_v2: "$.data.version" }
          trigger:
            - call: "POST /shelter-admissions/${adm_id}/complete-relocation"
              payload: { new_shelter_unit_id: "${unit_a}", expected_shelter_unit_version: "${unit_a_v2}" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 and ${err} == ERR_SAME_UNIT_RELOCATION - not ERR_STALE_UNIT_VERSION, since ${unit_a_v2} is the unit's current version"
            - "ShelterAdmission.${adm_id}.location_security_status is still COMPROMISED with compromise_source DATA_BREACH, prior_unit_id == null and shelter_unit_id == ${unit_a}"
            - "ShelterUnit.${unit_a}: reserved_beds == 2, available_beds == 2, status == HOLD, version == ${unit_a_v2}"
            - "ShelterUnit.${unit_b} is untouched: reserved_beds == 0, available_beds == 4, status == AVAILABLE, version == 1"
            - "Client.${client_id}.confidentiality_posture is still SEALED"
