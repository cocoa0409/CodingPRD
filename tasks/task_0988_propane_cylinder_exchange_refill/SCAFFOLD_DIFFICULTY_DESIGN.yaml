  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: swap_with_return_conserves_site_population
        grounds:
          - state_machines.ExchangeOrder.DRAFT_to_COMPLETED
          - calculations.site_cage_counts
          - entities.HostSite.fields.full_on_hand
        distinguishing_aspect: |
          Conserved quantity = site cylinder population (full+empty+quarantined,
          CONDEMNED excluded): a completed swap-with-return moves full 8->7 and
          empty 3->4 while the population total stays exactly 11; formula:
          full+empty+quarantined is invariant across the complete transition.
        test_recipe:
          setup:
            - "Site S with active policy, 8 FULL + 3 EMPTY fleet cylinders in the cage, 1 EMPTY customer cylinder off-site"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Inv Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
