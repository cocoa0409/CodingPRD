  - section: validations
    instances:
      - name: tap_week_mismatch_zone_differs
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_TAP_WEEK_MISMATCH]
          - entities.FareWeek.fields.zone_code
        distinguishing_aspect: "A tap whose fare day is within the week range but whose FareWeek.zone_code mismatch is still permitted; the in-range/zone check pair: out-of-range date triggers ERR_TAP_WEEK_MISMATCH (date-range branch)."
        test_recipe:
          setup:
            - "Clock 2026-06-09T12:00:00Z."
            - "FareProduct ZONE_X; Rider RM; FundingSource FM loaded 100000; OPEN week WM week_start 2026-06-01 zone ZONE_X (covers 06-01..06-07)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rm@x.com", full_name: "R M", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { rm: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${rm}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${rm}"
              captures: { fm: $.data.id }
            - call: "POST /funding-sources/${fm}/load"
              payload: { amount_cents: 100000 }
              as: Rider
              as_user_id: "${rm}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${rm}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${rm}"
              captures: { wm: $.data.id }
          trigger:
            - call: "POST /taps"
              payload: { rider_id: "${rm}", fare_week_id: "${wm}", funding_source_id: "${fm}", tapped_at: "2026-06-09T09:00:00Z" }
              as: Rider
              as_user_id: "${rm}"
              captures: { err: $.data.error_id }
          assert:
            - "status == 422 and data.error_id == ERR_TAP_WEEK_MISMATCH (2026-06-09 > 2026-06-07)"

      - name: verify_card_bad_token_returns_422
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors[ERR_BAD_VERIFICATION_TOKEN]
        distinguishing_aspect: "Verify with a wrong token -> ERR_BAD_VERIFICATION_TOKEN (422); card stays PENDING_VERIFICATION."
        test_recipe:
          setup:
            - "Rider RT with PENDING_VERIFICATION card CT."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
