              captures: { p_v2: "$.data.version" }
          trigger:
            - call: "GET /registry/workup-cases/${wc_id}"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "${center_id}"
              captures: { wc_v_read: "$.data.version", wc_logistics_read: "$.data.logistics_status" }
            - call: "POST /registry/collection-bookings"
              payload: { workup_case_id: "${wc_id}", collection_center_id: "${center_id}", start_at: "2026-08-11T08:00:00Z", expected_workup_case_version: "${wc_v_read}" }
              as: CollectionCenterOps
