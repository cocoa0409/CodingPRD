        distinguishing_aspect: |
          Rate boundary on a different metric and endpoint (register-shift close,
          not tender award): final rate exactly 1000.0 is COMPLIANT (>= not >);
          999.99 would be BELOW_STANDARD.
        test_recipe:
          setup:
            - "Store, cashier, shift opened at 08:00; clock advanced to 08:30 (1800s elapsed)"
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
