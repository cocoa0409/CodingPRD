              captures: { rf_clf1: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Filter Rights Two", asset_kind: "AUDIO", reference_fingerprint: "fp-clfilter-2", policy_mode: "MONETIZE", claimed_segment_seconds: 30 }
              as: RightsHolder
