              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /citations/${cit}/void"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Citation.${cit}.status == VOID"
            - "Citation.${cit}.adjudicated_amount_cents == 0"

      - name: reversal_conserves_vendor_accrued_share
        grounds:
          - state_machines.Payment.CLEARED_to_REVERSED
          - calculations.vendor_revenue_share
          - entities.VendorContract.fields.accrued_vendor_share_cents
        distinguishing_aspect: |
          Conserved quantity #2 = VendorContract.accrued_vendor_share_cents (a different conserved quantity than
          per-citation owed). Forward=payment clears → accrued += 3000; compensating=reverse → accrued -= 3000,
          leaving accrued back at exactly 0 with no drift.
