            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "GENERAL", general_permit_code: "NWP-29", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 0.30 } ], project_purpose: "Access road", estimated_cost_dollars: 90000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id" } }
          trigger:
