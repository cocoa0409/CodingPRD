        excluded_because:
          difficulty_instance: compensating_invariant / invariant_money_ledger_across_part_payment_and_void
          rationale: "The part-payment and void ledger identity, including the billing_status moves, is the body of that §1.8 instance."

      - name: corner_endpoint_activate_side_effects_issue_initial_assessment
        claim_type: action_endpoint
        grounds:
