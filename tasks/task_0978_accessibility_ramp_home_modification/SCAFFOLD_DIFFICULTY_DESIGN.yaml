              payload: { quote_id: "${quote_id}", quote_line_item_id: "${line_id}", amount_cents: 20000, allocation_type: "LINE_LEVEL" }
              as: FundingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_FUNDING_RESTRICTION_VIOLATION (priority 9 business_referential beats priority 10 business_fiscal even though 20000 > remaining 10000)"
            - "No FundingAllocation created for source ${fs_id}"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: numeric threshold equality (funding
  # posture) vs empty-collection edge (quote submit), distinct endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: funding_exact_equality_yields_fully_funded
        grounds:
          - calculations.funding_gap_calculation
          - entities.Case.fields.funding_posture
          - entities.Case.fields.total_funded_cents
        distinguishing_aspect: |
          Numeric threshold metric: at total_funded 19999 with quoted 20000 the
          posture is PARTIALLY_FUNDED, and approving exactly one more cent to
          reach funded == quoted (equality, not strictly-greater) MUST flip the
          posture to FULLY_FUNDED — pinning the >= boundary of
          funding_gap_calculation's posture bands.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case ASSESSED; DRAFT quote total 20000 (contingency 0, line MATERIAL 2 x 10000)"
            - "FundingSource A PENDING requested 19999 priority 1; FundingSource B PENDING requested 1 priority 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Nora Obb", client_address: "21 Boundary Rd", client_phone: "555-0111" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
