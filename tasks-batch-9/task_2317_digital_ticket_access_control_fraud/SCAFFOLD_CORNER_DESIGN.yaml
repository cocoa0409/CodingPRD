      - name: event_fire_code_ceiling_refuses_the_admit_that_would_exceed_it
        claim_type: triggerability
        grounds:
          - validations[priority=26]
          - validations[priority=27]
          - errors.ERR_EVENT_FIRE_CODE_FULL
          - calculations.live_occupancy
        distinguishing_aspect: |
          The event ceiling is checked with the +1 of the pending admit, not after the fact:
          with fire_code_capacity 1 the first admit is legal (0 + 1 <= 1) and the second is
          refused (1 + 1 > 1). The zone ceiling of 5 is not reached, so priority 26 passes and
          priority 27 is the rule that fires — and the refusal is a safety stop, so it writes
          a DENIED_CAPACITY ScanEvent but opens no incident and books no strike.
        test_recipe:
          setup:
            - "Event DOORS_OPEN with fire_code_capacity 1; AccessZone GA1 with fire_code_capacity 5; Gate G1; Ada and Bob hold bound PAID tickets in GA1; clock 2026-09-12T18:10:00Z; ONLINE session S1 open on G1."
