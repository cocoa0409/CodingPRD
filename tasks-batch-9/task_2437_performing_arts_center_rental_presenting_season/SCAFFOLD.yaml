scenario: |
  Generate task harder than expert level!

  2437. Performing Arts Center Rental & Presenting Season (performing arts center): season programming
  with artist fee negotiation, routing coordination and financial risk assessment per presentation,
  rental client booking with facility fee, labor estimate and deposit requirements, technical rider
  review with capability assessment and additional equipment rental, union labor calls with crew sizes,
  call minimums and overtime rules, ticketing setup with pricing tiers, subscription packages and
  dynamic single-ticket pricing, settlement with rental clients and presented artists including expense
  reconciliation and box office statements, education and community programs tied to presentations,
  capital and equipment reserve funding

domain_name: performing-arts-center-season
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Peer resources (PerformanceSpace, Artist, RentalClient, UnionDepartment, EquipmentItem) are joined
  # to the central Engagement through junction children (EquipmentRentalLine joins TechRider x
  # EquipmentItem; LaborCall joins Engagement x UnionDepartment; SubscriptionPackage spans many
  # Engagements through included_engagement_ids). No single ownership tree covers the model.

  state_machine_shape: parallel
  # Engagement carries three independent state dimensions (lifecycle_status, financial_clearance,
  # ticketing_status) that advance on different triggers. FeeNegotiation is cyclic
  # (OFFERED -> COUNTERED -> OFFERED). TechRider is a branching fork-join
  # (SUBMITTED -> {CAPABLE, GAP_IDENTIFIED} -> CLEARED) with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many        # Engagement -> FeeNegotiation / LaborCall / PriceTier / EducationProgram
    - many_to_many       # TechRider <-> EquipmentItem via EquipmentRentalLine; SubscriptionPackage <-> Engagement
    - polymorphic        # Engagement.artist_id XOR Engagement.rental_client_id by engagement_type
    - cross_aggregate    # ReserveLedgerEntry references Engagement across the finance aggregate

  role_model: segregation_of_duties
  # FinanceController may not finalize a Settlement for an Engagement whose fee was accepted by the
  # same X-User-ID (Engagement.fee_accepted_by_user_id).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 16 entities / 51 endpoints / 34 error codes / 9 calculations (4 carrying variants) / 7 state
  # machines. Above the Expert band of SKILL.md 0.4 because the request asks for a task harder than
  # expert level; the extra surface is spent on cross-entity coupling (every added entity is read by
  # at least two calculations), not on isolated CRUD.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PerformanceSpace
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Hall name (e.g. "Grand Hall").
      - name: seat_capacity
        type: integer
        source: input
        description: Fixed sellable seat count of the hall.
        constraints: ">= 1"
      - name: base_facility_fee_cents
        type: integer
        source: input
        description: Facility fee charged per performance day before discounts.
        constraints: ">= 0"
      - name: load_in_day_fee_cents
        type: integer
        source: input
        description: Facility fee charged per load-in/load-out day before discounts.
        constraints: ">= 0"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: Minutes of mandatory changeover that follow load_out_end_utc before the hall may be re-occupied.
        constraints: ">= 0"
      - name: rigging_capacity_kg
        type: integer
        source: input
        description: Maximum total rigging load the grid supports.
        constraints: ">= 0"
      - name: house_power_amps
        type: integer
        source: input
        description: Available house company-switch amperage.
        constraints: ">= 0"
      - name: dmx_universes
        type: integer
        source: input
        description: Installed DMX universes available to a production.
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: ACTIVE halls may be booked; OFFLINE halls reject new Engagements.
        default: ACTIVE
        constraints: "ACTIVE | OFFLINE"

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Contracting artist/company legal name.
      - name: agency_name
        type: string
        source: input
        description: Booking agency of record.
      - name: guarantee_floor_cents
        type: integer
        source: input
        description: Lowest guarantee the agency will entertain; offers below it are rejected.
        constraints: ">= 0"
      - name: historical_sell_through_pct
        type: number
        source: input
        description: Historical paid sell-through as a 0..1 fraction; drives projected gross and risk score.
        constraints: "0 <= x <= 1, at most 4 decimal places"
      - name: routing_window_start_utc
        type: datetime
        source: input
        description: First instant of the artist's routing availability for this season.
      - name: routing_window_end_utc
        type: datetime
        source: input
        description: Last instant of the artist's routing availability for this season.
      - name: min_days_between_engagements
        type: integer
        source: input
        description: Minimum whole days the routing requires between two Engagements of this Artist.
        constraints: ">= 0"
      - name: lifetime_guarantee_paid_cents
        type: integer
        source: computed
        description: Running total of guarantees plus overage shares paid to this Artist by finalized Settlements.
        default: 0

  - name: RentalClient
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: Renting organization legal name.
      - name: contact_email
        type: string
        source: input
        description: Primary billing contact e-mail.
      - name: credit_rating
        type: enum
        source: input
        description: Credit grade that selects the deposit percentage tier.
        constraints: "A | B | C"
      - name: is_nonprofit
        type: boolean
        source: input
        description: True when the client qualifies for the nonprofit facility-fee discount.
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: Unpaid balance carried by the client; raised/lowered by finalized Settlements and by forfeited deposits.
        default: 0

  - name: UnionDepartment
    parent: null
    common_fields: true
    fields:
      - name: department
        type: enum
        source: input
        description: Union department this rate card covers.
        constraints: "STAGEHANDS | ELECTRICS | AUDIO | WARDROBE (unique)"
      - name: roster_size
        type: integer
        source: input
        description: Total crew members the local can supply at any instant; caps overlapping LaborCall crew.
        constraints: ">= 1"
      - name: straight_hourly_rate_cents
        type: integer
        source: input
        description: Straight-time hourly rate per crew member.
        constraints: ">= 1"
      - name: overtime_multiplier
        type: number
        source: input
        description: Multiplier applied to hours above OVERTIME_THRESHOLD_HOURS.
        default: 1.5
      - name: doubletime_multiplier
        type: number
        source: input
        description: Multiplier applied to hours above DOUBLETIME_THRESHOLD_HOURS.
        default: 2.0
      - name: call_minimum_hours
        type: number
        source: input
        description: Minimum billable hours per crew member per call, regardless of scheduled or actual duration.
        default: 4
      - name: meal_penalty_cents
        type: integer
        source: input
        description: Penalty billed per crew member when an actual call exceeds MEAL_BREAK_LIMIT_HOURS without a break.
        default: 3500

  - name: EquipmentItem
    parent: null
    common_fields: true
    fields:
      - name: category
        type: enum
        source: input
        description: Equipment family used to satisfy a technical capability gap.
        constraints: "POWER_DISTRO | DMX_NODE | RIGGING_HARDWARE | AUDIO_PACKAGE"
      - name: model_name
        type: string
        source: input
        description: Manufacturer/model label.
      - name: on_hand_qty
        type: integer
        source: input
        description: Units the center owns.
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: computed
        description: Sum of qty over EquipmentRentalLine rows with status RESERVED that point at this item.
        default: 0
      - name: daily_rate_cents
        type: integer
        source: input
        description: Rental rate per unit per rental day charged to the engagement.
        constraints: ">= 0"
      - name: replacement_value_cents
        type: integer
        source: input
        description: Replacement value used by the equipment reserve policy.
        constraints: ">= 0"
      - name: reserve_funded
        type: boolean
        source: input
        description: True when rental income for this item is swept to the capital/equipment reserve.
        default: false

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: engagement_type
        type: enum
        source: input
        description: PRESENTED (center takes the artistic and financial risk) or RENTAL (client rents the hall).
        constraints: "PRESENTED | RENTAL"
      - name: space_id
        type: string
        source: input
        description: FK -> PerformanceSpace.id; the hall occupied by this engagement.
      - name: artist_id
        type: string
        source: input
        description: FK -> Artist.id; REQUIRED when engagement_type == PRESENTED, MUST be omitted otherwise.
        default: null
      - name: rental_client_id
        type: string
        source: input
        description: FK -> RentalClient.id; REQUIRED when engagement_type == RENTAL, MUST be omitted otherwise.
        default: null
      - name: title
        type: string
        source: input
        description: Public title of the performance or rental event.
      - name: load_in_start_utc
        type: datetime
        source: input
        description: First instant the production occupies the hall.
      - name: performance_start_utc
        type: datetime
        source: input
        description: Curtain-up instant of the first performance.
      - name: performance_end_utc
        type: datetime
        source: input
        description: Curtain-down instant of the last performance.
      - name: load_out_end_utc
        type: datetime
        source: input
        description: Last instant the production occupies the hall, before changeover buffer.
      - name: performance_day_count
        type: integer
        source: input
        description: Billable performance days used by the facility-fee formula.
        constraints: ">= 1"
      - name: load_in_day_count
        type: integer
        source: input
        description: Billable load-in/load-out days used by the facility-fee formula.
        constraints: ">= 0"
      - name: lifecycle_status
        type: enum
        source: computed
        description: Booking dimension of the engagement lifecycle.
        default: DRAFT
        constraints: "DRAFT | CONFIRMED | PERFORMED | SETTLED | CANCELLED"
      - name: financial_clearance
        type: enum
        source: computed
        description: Financial-risk dimension, advanced only by risk assessment; independent of lifecycle_status.
        default: UNASSESSED
        constraints: "UNASSESSED | CLEARED | ESCALATED | ESCALATED_APPROVED | BLOCKED"
      - name: ticketing_status
        type: enum
        source: computed
        description: Box-office dimension, advanced by price-tier setup, on-sale and closing.
        default: TICKETING_UNSET
        constraints: "TICKETING_UNSET | TIERS_DRAFT | ON_SALE | CLOSED"
      - name: negotiated_fee_cents
        type: integer
        source: computed
        description: Guarantee locked by the ACCEPTED FeeNegotiation; 0 until one is accepted and for RENTAL engagements.
        default: 0
      - name: artist_share_pct
        type: number
        source: computed
        description: Overage split fraction locked by the ACCEPTED FeeNegotiation; 0 until one is accepted.
        default: 0
      - name: facility_fee_cents
        type: integer
        source: computed
        description: Output of facility_fee for RENTAL engagements; always 0 for PRESENTED.
        default: 0
      - name: labor_estimate_total_cents
        type: integer
        source: computed
        description: Sum of LaborCall.estimated_cost_cents over calls of this engagement whose status IN {ESTIMATED, WORKED, RECONCILED}.
        default: 0
      - name: additional_equipment_cost_cents
        type: integer
        source: computed
        description: Sum of EquipmentRentalLine.line_cost_cents with status RESERVED under this engagement's TechRider rows.
        default: 0
      - name: deposit_required_cents
        type: integer
        source: computed
        description: Output of deposit_requirement for RENTAL engagements; always 0 for PRESENTED.
        default: 0
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: Cumulative deposit recorded against this engagement.
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: 0..100 weighted risk score written by the latest risk assessment.
        default: 0
      - name: risk_tier
        type: enum
        source: computed
        description: Band of risk_score written by the latest risk assessment.
        default: LOW
        constraints: "LOW | MODERATE | HIGH | PROHIBITIVE"
      - name: projected_gross_cents
        type: integer
        source: computed
        description: Forward-looking box-office projection (engagement_margin PROJECTED variant).
        default: 0
      - name: projected_margin_cents
        type: integer
        source: computed
        description: Forward-looking margin (engagement_margin PROJECTED variant); may be negative.
        default: 0
      - name: realized_gross_cents
        type: integer
        source: computed
        description: Chronological sum of TicketSale.gross_cents with status SOLD under this engagement's price tiers.
        default: 0
      - name: realized_margin_cents
        type: integer
        source: computed
        description: Chronological margin (engagement_margin REALIZED variant), written when the Settlement is finalized.
        default: 0
      - name: negotiation_round_count
        type: integer
        source: computed
        description: Count of FeeNegotiation rows created under this engagement; capped by MAX_ROUNDS_PER_ENGAGEMENT.
        default: 0
      - name: fee_accepted_by_user_id
        type: string
        source: system
        description: X-User-ID that accepted the winning FeeNegotiation; blocks that same user from finalizing the Settlement.
        default: null
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: Fee retained on cancellation; 0 until lifecycle_status becomes CANCELLED.
        default: 0

  - name: FeeNegotiation
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: FK -> Engagement.id; the PRESENTED engagement this round belongs to.
      - name: round_index
        type: integer
        source: computed
        description: 1-based round number within the engagement; equals engagement.negotiation_round_count after creation.
      - name: status
        type: enum
        source: computed
        description: Round state; a new round supersedes any non-terminal earlier round.
        default: OFFERED
        constraints: "OFFERED | COUNTERED | ACCEPTED | SUPERSEDED"
      - name: offered_fee_cents
        type: integer
        source: input
        description: Guarantee the center currently offers.
        constraints: ">= 0"
      - name: offered_artist_share_pct
        type: number
        source: input
        description: Overage split the center currently offers, as a 0..1 fraction.
        constraints: "0 <= x <= 1, at most 2 decimal places"
      - name: counter_fee_cents
        type: integer
        source: input
        description: Guarantee the artist representative counters with; null until a counter is filed.
        default: null
      - name: counter_artist_share_pct
        type: number
        source: input
        description: Overage split the artist representative counters with; null until a counter is filed.
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: Number of COUNTERED -> OFFERED revisions inside this round; capped by MAX_REVISIONS_PER_ROUND.
        default: 0
      - name: accepted_fee_cents
        type: integer
        source: computed
        description: Guarantee frozen at acceptance (counter_fee_cents when accepted from COUNTERED, else offered_fee_cents).
        default: null
      - name: accepted_share_pct
        type: number
        source: computed
        description: Overage split frozen at acceptance (counter_artist_share_pct when accepted from COUNTERED, else offered_artist_share_pct).
        default: null
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgrammingDirector that opened the round.
      - name: accepted_by_user_id
        type: string
        source: system
        description: X-User-ID that accepted the round; null until ACCEPTED.
        default: null

  - name: TechRider
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: FK -> Engagement.id; engagement whose production this rider describes.
      - name: submitted_rigging_kg
        type: integer
        source: input
        description: Total rigging load the production hangs from the grid.
        constraints: ">= 0"
      - name: requested_power_amps
        type: integer
        source: input
        description: Company-switch amperage the production requests.
        constraints: ">= 0"
      - name: requested_dmx_universes
        type: integer
        source: input
        description: DMX universes the production requests.
        constraints: ">= 0"
      - name: requires_orchestra_pit
        type: boolean
        source: input
        description: True when the production needs the pit lift lowered (adds a STAGEHANDS gap flag when the hall has no pit fee waiver).
      - name: review_status
        type: enum
        source: computed
        description: Capability-review state of the rider.
        default: SUBMITTED
        constraints: "SUBMITTED | CAPABLE | GAP_IDENTIFIED | CLEARED | REJECTED_INFEASIBLE"
      - name: capability_gaps
        type: array
        source: computed
        description: Gap flags produced by technical_capability_assessment; empty on the CAPABLE branch.
        default: []
        constraints: "elements IN {RIGGING_OVER_CAPACITY, RIGGING_NEAR_LIMIT, POWER_SHORTFALL, DMX_SHORTFALL}"
      - name: additional_equipment_cost_cents
        type: integer
        source: computed
        description: Sum of line_cost_cents over this rider's RESERVED EquipmentRentalLine rows; written at clear time.
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the TechnicalDirector that ran the capability review; null until reviewed.
        default: null

  - name: EquipmentRentalLine
    parent: TechRider
    common_fields: true
    fields:
      - name: tech_rider_id
        type: string
        source: system
        description: FK -> TechRider.id; rider whose gap this line covers.
      - name: equipment_item_id
        type: string
        source: input
        description: FK -> EquipmentItem.id; inventory item being reserved.
      - name: covers_gap
        type: enum
        source: input
        description: Gap flag this line is intended to cover; NONE for comfort items that cover nothing.
        constraints: "RIGGING_NEAR_LIMIT | POWER_SHORTFALL | DMX_SHORTFALL | NONE"
      - name: qty
        type: integer
        source: input
        description: Units reserved.
        constraints: ">= 1"
      - name: rental_days
        type: integer
        source: input
        description: Billable rental days for this line.
        constraints: ">= 1"
      - name: line_cost_cents
        type: integer
        source: computed
        description: equipment_item.daily_rate_cents * qty * rental_days.
      - name: status
        type: enum
        source: computed
        description: RESERVED holds inventory; RELEASED returns it (engagement cancellation).
        default: RESERVED
        constraints: "RESERVED | RELEASED"

  - name: LaborCall
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: FK -> Engagement.id; engagement the crew is called for.
      - name: union_department_id
        type: string
        source: input
        description: FK -> UnionDepartment.id; department supplying the crew.
      - name: crew_size
        type: integer
        source: input
        description: Number of crew members called.
        constraints: ">= 1"
      - name: call_start_utc
        type: datetime
        source: input
        description: Call start instant; must sit inside the engagement's load-in/load-out window.
      - name: call_end_utc
        type: datetime
        source: input
        description: Scheduled call end instant; must be strictly after call_start_utc.
      - name: scheduled_hours
        type: number
        source: computed
        description: (call_end_utc - call_start_utc) in hours, 2 decimal places.
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: labor_cost ESTIMATE variant output written at creation.
        default: 0
      - name: actual_hours
        type: number
        source: input
        description: Hours actually worked per crew member, reported after the call.
        default: null
      - name: meal_break_taken
        type: boolean
        source: input
        description: Whether a meal break was given; false triggers the meal penalty above MEAL_BREAK_LIMIT_HOURS.
        default: null
      - name: actual_cost_cents
        type: integer
        source: computed
        description: labor_cost ACTUAL variant output written when hours are reported; 0 until then.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Call lifecycle.
        default: ESTIMATED
        constraints: "ESTIMATED | WORKED | RECONCILED | CANCELLED"

  - name: PriceTier
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: FK -> Engagement.id; engagement whose house this tier slices.
      - name: tier_name
        type: string
        source: input
        description: Tier label, unique per engagement (e.g. "ORCH", "MEZZ").
      - name: seats_allocated
        type: integer
        source: input
        description: Seats assigned to this tier; the sum over ACTIVE tiers may not exceed the hall capacity.
        constraints: ">= 1"
      - name: base_price_cents
        type: integer
        source: input
        description: Undiscounted single-ticket face price.
        constraints: ">= 0"
      - name: price_ceiling_cents
        type: integer
        source: input
        description: Hard cap on the dynamically priced unit price.
        constraints: ">= base_price_cents"
      - name: dynamic_pricing_enabled
        type: boolean
        source: input
        description: When false the dynamic multiplier is pinned to 1.00 for every sale on this tier.
      - name: subscription_eligible
        type: boolean
        source: input
        description: When false a SubscriptionPackage may not hold seats in this tier.
      - name: sold_qty
        type: integer
        source: computed
        description: Sum of qty over TicketSale rows on this tier with status SOLD.
        default: 0
      - name: subscription_held_qty
        type: integer
        source: computed
        description: Seats held by sold subscription orders that include this tier.
        default: 0
      - name: available_qty
        type: integer
        source: computed
        description: seats_allocated - sold_qty - subscription_held_qty.
      - name: gross_cents
        type: integer
        source: computed
        description: Sum of TicketSale.gross_cents over SOLD sales on this tier.
        default: 0
      - name: subscription_revenue_cents
        type: integer
        source: computed
        description: Allocated subscription revenue booked to this tier by subscription_price_allocation.
        default: 0
      - name: status
        type: enum
        source: computed
        description: ACTIVE tiers sell; CLOSED tiers reject sales (set when the engagement closes ticketing or cancels).
        default: ACTIVE
        constraints: "ACTIVE | CLOSED"

  - name: TicketSale
    parent: PriceTier
    common_fields: true
    fields:
      - name: price_tier_id
        type: string
        source: system
        description: FK -> PriceTier.id; tier the seats came from.
      - name: qty
        type: integer
        source: input
        description: Seats sold in this transaction.
        constraints: ">= 1"
      - name: channel
        type: enum
        source: input
        description: Sales channel of record.
        constraints: "WEB | PHONE | WINDOW"
      - name: sell_through_pct_at_sale
        type: number
        source: computed
        description: tier.sold_qty / tier.seats_allocated evaluated BEFORE this sale, 4 decimal places.
      - name: dynamic_multiplier_applied
        type: number
        source: computed
        description: Multiplier selected by dynamic_single_ticket_price for this sale.
      - name: unit_price_cents
        type: integer
        source: computed
        description: Per-seat price after multiplier and ceiling.
      - name: gross_cents
        type: integer
        source: computed
        description: unit_price_cents * qty.
      - name: restoration_fee_cents
        type: integer
        source: computed
        description: CAPITAL_RESTORATION_FEE_CENTS * qty, swept to the capital reserve at settlement.
      - name: status
        type: enum
        source: computed
        description: SOLD until the engagement is cancelled, which refunds every sale.
        default: SOLD
        constraints: "SOLD | REFUNDED"

  - name: SubscriptionPackage
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Package label (e.g. "Season Choose-3").
      - name: package_price_cents
        type: integer
        source: input
        description: Price of one subscription order covering every included engagement.
        constraints: ">= 1"
      - name: included_engagement_ids
        type: array
        source: input
        description: "Array of Engagement.id values forming the package membership junction (not a single-valued FK); every element MUST reference an Engagement with engagement_type == PRESENTED and ticketing_status == ON_SALE."
        constraints: "length >= 2"
      - name: subscription_tier_name
        type: string
        source: input
        description: PriceTier.tier_name that must exist with subscription_eligible == true in every included engagement.
      - name: seats_per_order
        type: integer
        source: input
        description: Seats held per included engagement per sold order.
        constraints: ">= 1"
      - name: sold_count
        type: integer
        source: computed
        description: Number of subscription orders sold for this package.
        default: 0
      - name: allocation_map
        type: object
        source: computed
        description: Per-engagement per-order revenue allocation produced by subscription_price_allocation, keyed by engagement id.
        default: {}

  - name: Settlement
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: FK -> Engagement.id; engagement being settled (at most one Settlement per engagement).
      - name: status
        type: enum
        source: computed
        description: Settlement lifecycle.
        default: DRAFT
        constraints: "DRAFT | EXPENSES_RECONCILED | FINALIZED"
      - name: box_office_gross_cents
        type: integer
        source: computed
        description: Sum of TicketSale.gross_cents (status SOLD) plus subscription_revenue_cents over the engagement's tiers, frozen at draft time.
      - name: restoration_fees_cents
        type: integer
        source: computed
        description: Sum of TicketSale.restoration_fee_cents (status SOLD) over the engagement's tiers, frozen at draft time.
      - name: adjusted_gross_cents
        type: integer
        source: computed
        description: box_office_gross_cents - restoration_fees_cents.
      - name: guarantee_cents
        type: integer
        source: computed
        description: Copy of engagement.negotiated_fee_cents at draft time (0 for RENTAL).
      - name: actual_labor_cents
        type: integer
        source: computed
        description: Sum of LaborCall.actual_cost_cents over calls with status WORKED; ESTIMATED and CANCELLED calls are excluded.
      - name: actual_equipment_cents
        type: integer
        source: computed
        description: Copy of engagement.additional_equipment_cost_cents at draft time.
      - name: actual_marketing_cents
        type: integer
        source: input
        description: Marketing/house-services spend supplied during expense reconciliation.
        default: 0
      - name: reimbursable_expense_cap_cents
        type: integer
        source: computed
        description: Cap selected by the settlement_financials expense tier over adjusted_gross_cents (PRESENTED only).
        default: 0
      - name: reimbursable_expenses_cents
        type: integer
        source: computed
        description: min(eligible expenses, reimbursable_expense_cap_cents) for PRESENTED; 0 for RENTAL.
        default: 0
      - name: artist_share_cents
        type: integer
        source: computed
        description: Overage share paid to the artist (PRESENTED only).
        default: 0
      - name: net_to_center_cents
        type: integer
        source: computed
        description: Center's net position from settlement_financials; may be negative.
        default: 0
      - name: reserve_contribution_cents
        type: integer
        source: computed
        description: Amount swept to the capital/equipment reserve when the settlement is finalized.
        default: 0
      - name: amount_payable_to_artist_cents
        type: integer
        source: computed
        description: guarantee_cents + artist_share_cents (PRESENTED only).
        default: 0
      - name: balance_due_from_client_cents
        type: integer
        source: computed
        description: Charges minus deposit credits for RENTAL; negative means a refund is owed to the client.
        default: 0
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID that finalized the settlement; may not equal engagement.fee_accepted_by_user_id.
        default: null

  - name: EducationProgram
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: FK -> Engagement.id; PRESENTED engagement this program is tied to.
      - name: program_type
        type: enum
        source: input
        description: Program family, which selects the subsidy cap.
        constraints: "STUDENT_MATINEE | MASTERCLASS | COMMUNITY_WORKSHOP"
      - name: participant_capacity
        type: integer
        source: input
        description: Participants the program can host; drives the per-participant subsidy allowance.
        constraints: ">= 1"
      - name: subsidy_requested_cents
        type: integer
        source: input
        description: Subsidy the programming team requests from the reserve.
        constraints: ">= 1"
      - name: subsidy_approved_cents
        type: integer
        source: computed
        description: Output of education_subsidy_allowance; drawn from the reserve at creation.
      - name: status
        type: enum
        source: computed
        description: FUNDED while the engagement stands; CANCELLED_WITH_ENGAGEMENT when the engagement is cancelled and the subsidy is refunded.
        default: FUNDED
        constraints: "FUNDED | CANCELLED_WITH_ENGAGEMENT"

  - name: ReserveLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: entry_type
        type: enum
        source: input
        description: Reason for the movement.
        constraints: "OPENING_BALANCE | MANUAL_ADJUSTMENT | SETTLEMENT_CONTRIBUTION | EDUCATION_SUBSIDY_DRAW | EDUCATION_SUBSIDY_REFUND"
      - name: amount_cents
        type: integer
        source: input
        description: Signed movement; positive credits the reserve, negative debits it.
      - name: engagement_id
        type: string
        source: input
        description: FK -> Engagement.id; engagement that caused the movement, null for center-level adjustments.
        default: null
      - name: memo
        type: string
        source: input
        description: Free-text audit memo.
      - name: balance_after_cents
        type: integer
        source: computed
        description: Running reserve balance after this entry, accumulated over all entries ordered by created_at ASC.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Engagement
    dimension: lifecycle_status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /engagements/{id}/confirm"
        actor: ProgrammingDirector | RentalManager
        preconditions:
          - "engagement.lifecycle_status == DRAFT"
          - "a TechRider of this engagement has review_status == CLEARED"
          - "engagement.financial_clearance IN {CLEARED, ESCALATED_APPROVED}"
          - "if engagement_type == PRESENTED: a FeeNegotiation of this engagement has status == ACCEPTED"
          - "if engagement_type == RENTAL: engagement.deposit_paid_cents >= engagement.deposit_required_cents"
          - "PerformanceSpace.status == ACTIVE"
        side_effects:
          - "engagement.ticketing_status set to TIERS_DRAFT when it is TICKETING_UNSET"
          - "engagement.updated_at refreshed; engagement.version incremented by 1"
      - from: CONFIRMED
        to: PERFORMED
        trigger: "system, evaluated during POST /engagements/{id}/settlements when clock_current_utc >= engagement.performance_end_utc"
        actor: system
        preconditions:
          - "engagement.lifecycle_status == CONFIRMED"
          - "clock_current_utc >= engagement.performance_end_utc"
        side_effects:
          - "engagement.ticketing_status set to CLOSED and every PriceTier of the engagement with status ACTIVE set to CLOSED"
          - "engagement.realized_gross_cents recomputed as the chronological sum of SOLD TicketSale.gross_cents plus PriceTier.subscription_revenue_cents"
          - "engagement.version incremented by 1"
        note: "Auto-transition; there is no explicit mark-performed endpoint."
      - from: PERFORMED
        to: SETTLED
        trigger: "POST /settlements/{id}/finalize"
        actor: FinanceController
        preconditions:
          - "engagement.lifecycle_status == PERFORMED"
          - "settlement.status == EXPENSES_RECONCILED"
          - "X-User-ID != engagement.fee_accepted_by_user_id"
        side_effects:
          - "engagement.realized_margin_cents written from engagement_margin REALIZED variant"
          - "every LaborCall of this engagement with status WORKED set to RECONCILED"
          - "because the settlement produced net_to_center_cents, a ReserveLedgerEntry of type SETTLEMENT_CONTRIBUTION is appended with amount_cents == settlement.reserve_contribution_cents and balance_after_cents recomputed"
          - "because the contribution posted, PRESENTED: Artist.lifetime_guarantee_paid_cents += settlement.amount_payable_to_artist_cents; RENTAL: RentalClient.outstanding_balance_cents += settlement.balance_due_from_client_cents"
          - "engagement.version incremented by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: ProgrammingDirector | RentalManager
        preconditions:
          - "engagement.lifecycle_status == DRAFT"
        side_effects:
          - "CANCEL CASCADE STEP 1: engagement.cancellation_fee_cents set to 0 (nothing is retained before confirmation)"
          - "CANCEL CASCADE STEP 2: every LaborCall of this engagement with status ESTIMATED set to CANCELLED"
          - "CANCEL CASCADE STEP 3: every EquipmentRentalLine with status RESERVED under this engagement's riders set to RELEASED, and each referenced EquipmentItem.reserved_qty recomputed"
          - "CANCEL CASCADE STEP 4: because step 3 released the lines, every TechRider of this engagement keeps its review_status but has additional_equipment_cost_cents recomputed over its RESERVED lines (which is now 0), and engagement.additional_equipment_cost_cents is recomputed the same way"
          - "CANCEL CASCADE STEP 5: because step 2 removed calls from the estimate set, engagement.labor_estimate_total_cents is recomputed over calls whose status IN {ESTIMATED, WORKED, RECONCILED}"
          - "CANCEL CASCADE STEP 6: because steps 4 and 5 both changed deposit inputs, engagement.deposit_required_cents is recomputed by deposit_requirement EXACTLY ONCE, after both (RENTAL only; PRESENTED keeps 0)"
          - "CANCEL CASCADE STEP 7: every EducationProgram with status FUNDED set to CANCELLED_WITH_ENGAGEMENT"
          - "CANCEL CASCADE STEP 8: because each education program left FUNDED, one ReserveLedgerEntry of type EDUCATION_SUBSIDY_REFUND is appended per program with amount_cents == +subsidy_approved_cents, in EducationProgram.created_at ASC order, each recomputing balance_after_cents"
          - "CANCEL CASCADE STEP 9: engagement.ticketing_status set to CLOSED and every PriceTier with status ACTIVE set to CLOSED"
          - "CANCEL CASCADE STEP 10: engagement.version incremented by 1"
          - "PriceTier.subscription_held_qty and PriceTier.subscription_revenue_cents are NOT reversed by cancellation (season subscription refunds are handled outside this API), so seat conservation continues to read seats_allocated == available_qty + sold_qty + subscription_held_qty"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: ProgrammingDirector | RentalManager
        preconditions:
          - "engagement.lifecycle_status == CONFIRMED"
        side_effects:
          - "CANCEL CASCADE STEP 1: engagement.cancellation_fee_cents written by cancellation_fee (retains part of the facility-fee / guarantee exposure)"
          - "CANCEL CASCADE STEP 2: every LaborCall with status ESTIMATED set to CANCELLED"
          - "CANCEL CASCADE STEP 3: every EquipmentRentalLine with status RESERVED set to RELEASED and each EquipmentItem.reserved_qty recomputed"
          - "CANCEL CASCADE STEP 4: rider and engagement additional_equipment_cost_cents recomputed over RESERVED lines (now 0)"
          - "CANCEL CASCADE STEP 5: engagement.labor_estimate_total_cents recomputed over calls whose status IN {ESTIMATED, WORKED, RECONCILED}"
          - "CANCEL CASCADE STEP 6: engagement.deposit_required_cents recomputed EXACTLY ONCE after steps 4 and 5 (RENTAL only)"
          - "CANCEL CASCADE STEP 7: every TicketSale with status SOLD under this engagement set to REFUNDED; each PriceTier.sold_qty, gross_cents and available_qty recomputed; engagement.realized_gross_cents recomputed as SOLD sale gross plus PriceTier.subscription_revenue_cents"
          - "CANCEL CASCADE STEP 8: every EducationProgram with status FUNDED set to CANCELLED_WITH_ENGAGEMENT, each appending an EDUCATION_SUBSIDY_REFUND ReserveLedgerEntry in EducationProgram.created_at ASC order"
          - "CANCEL CASCADE STEP 9: RENTAL only: RentalClient.outstanding_balance_cents += engagement.cancellation_fee_cents - engagement.deposit_paid_cents (a negative result is a credit)"
          - "CANCEL CASCADE STEP 10: engagement.ticketing_status set to CLOSED and every PriceTier with status ACTIVE set to CLOSED"
          - "CANCEL CASCADE STEP 11: engagement.version incremented by 1"
          - "PriceTier.subscription_held_qty and PriceTier.subscription_revenue_cents are NOT reversed by cancellation"

  - entity: Engagement
    dimension: financial_clearance
    initial_state: UNASSESSED
    terminal_states: []
    transitions:
      - from: UNASSESSED
        to: CLEARED
        trigger: "POST /engagements/{id}/assess-risk"
        actor: FinanceController
        preconditions:
          - "engagement.lifecycle_status IN {DRAFT, CONFIRMED}"
          - "payload.expected_engagement_version == engagement.version"
          - "financial_risk_score output risk_tier IN {LOW, MODERATE}"
        side_effects:
          - "engagement.risk_score, risk_tier, projected_gross_cents and projected_margin_cents written by financial_risk_score and engagement_margin PROJECTED"
          - "engagement.version incremented by 1"
      - from: UNASSESSED
        to: ESCALATED
        trigger: "POST /engagements/{id}/assess-risk"
        actor: FinanceController
        preconditions:
          - "engagement.lifecycle_status IN {DRAFT, CONFIRMED}"
          - "payload.expected_engagement_version == engagement.version"
          - "financial_risk_score output risk_tier == HIGH"
          - "payload.override_escalation is absent or false"
        side_effects:
          - "engagement.risk_score, risk_tier, projected_gross_cents, projected_margin_cents written"
          - "engagement.version incremented by 1"
      - from: UNASSESSED
        to: BLOCKED
        trigger: "POST /engagements/{id}/assess-risk"
        actor: FinanceController
        preconditions:
          - "engagement.lifecycle_status IN {DRAFT, CONFIRMED}"
          - "payload.expected_engagement_version == engagement.version"
          - "financial_risk_score output risk_tier == PROHIBITIVE"
        side_effects:
          - "engagement.risk_score and risk_tier written; projected figures written"
          - "engagement.version incremented by 1"
        note: "BLOCKED blocks confirmation; a later re-assessment may leave BLOCKED."
      - from: ESCALATED
        to: ESCALATED_APPROVED
        trigger: "POST /engagements/{id}/assess-risk with override_escalation == true"
        actor: FinanceController
        preconditions:
          - "engagement.financial_clearance == ESCALATED"
          - "payload.expected_engagement_version == engagement.version"
          - "financial_risk_score output risk_tier != PROHIBITIVE"
        side_effects:
          - "engagement.risk_score/risk_tier/projected figures refreshed; engagement.version incremented by 1"
      - from: CLEARED
        to: ESCALATED
        trigger: "system, cascaded from POST /fee-negotiations/{id}/accept"
        actor: system
        preconditions:
          - "engagement.financial_clearance == CLEARED"
          - "engagement.projected_margin_cents < 0 after the accepted guarantee is written"
        side_effects:
          - "engagement.financial_clearance set to ESCALATED and risk_tier set to HIGH"
        note: "Independent of lifecycle_status; a CONFIRMED engagement may hold ESCALATED clearance."
      - from: BLOCKED
        to: CLEARED
        trigger: "POST /engagements/{id}/assess-risk"
        actor: FinanceController
        preconditions:
          - "engagement.financial_clearance == BLOCKED"
          - "payload.expected_engagement_version == engagement.version"
          - "financial_risk_score output risk_tier IN {LOW, MODERATE}"
        side_effects:
          - "engagement.risk_score/risk_tier/projected figures refreshed; engagement.version incremented by 1"

  - entity: Engagement
    dimension: ticketing_status
    initial_state: TICKETING_UNSET
    terminal_states: [CLOSED]
    transitions:
      - from: TICKETING_UNSET
        to: TIERS_DRAFT
        trigger: "POST /engagements/{id}/price-tiers (first tier) or POST /engagements/{id}/confirm"
        actor: BoxOfficeManager | ProgrammingDirector | RentalManager
        preconditions:
          - "engagement.lifecycle_status IN {DRAFT, CONFIRMED}"
        side_effects:
          - "engagement.ticketing_status set to TIERS_DRAFT"
          - "no separate version increment: only the triggering endpoint's own declared increment applies, so POST /engagements/{id}/confirm bumps Engagement.version once in total and POST /engagements/{id}/price-tiers does not bump it at all"
      - from: TIERS_DRAFT
        to: ON_SALE
        trigger: "POST /engagements/{id}/on-sale"
        actor: BoxOfficeManager
        preconditions:
          - "engagement.ticketing_status == TIERS_DRAFT"
          - "engagement.lifecycle_status == CONFIRMED"
          - "at least one PriceTier with status ACTIVE exists for the engagement"
          - "sum of seats_allocated over ACTIVE PriceTier rows <= PerformanceSpace.seat_capacity"
        side_effects:
          - "engagement.projected_gross_cents and projected_margin_cents recomputed by engagement_margin PROJECTED"
          - "engagement.version incremented by 1"
      - from: ON_SALE
        to: CLOSED
        trigger: "system, cascaded from the CONFIRMED -> PERFORMED auto-transition or from POST /engagements/{id}/cancel"
        actor: system
        preconditions:
          - "engagement.ticketing_status == ON_SALE"
        side_effects:
          - "every PriceTier with status ACTIVE set to CLOSED"
      - from: TIERS_DRAFT
        to: CLOSED
        trigger: "system, cascaded from POST /engagements/{id}/cancel"
        actor: system
        preconditions:
          - "engagement.ticketing_status == TIERS_DRAFT"
        side_effects:
          - "every PriceTier with status ACTIVE set to CLOSED"
      - from: TICKETING_UNSET
        to: CLOSED
        trigger: "system, cascaded from POST /engagements/{id}/cancel"
        actor: system
        preconditions:
          - "engagement.ticketing_status == TICKETING_UNSET"
        side_effects:
          - "no PriceTier rows exist, so the tier sweep is a no-op"
        note: "Cancelling an engagement that never reached tier drafting (including every RENTAL engagement, which cannot draft tiers at all) still parks the ticketing dimension in its terminal state, so the cancel cascade never leaves a live ticketing dimension behind."

  - entity: FeeNegotiation
    initial_state: OFFERED
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /fee-negotiations/{id}/counter"
        actor: ArtistRepresentative
        preconditions:
          - "negotiation.status == OFFERED"
          - "X-User-ID == engagement.artist_id"
          - "engagement.lifecycle_status == DRAFT"
        side_effects:
          - "counter_fee_cents and counter_artist_share_pct written; negotiation.version incremented by 1"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /fee-negotiations/{id}/revise-offer"
        actor: ProgrammingDirector
        preconditions:
          - "negotiation.status == COUNTERED"
          - "negotiation.revision_count < MAX_REVISIONS_PER_ROUND"
          - "payload.offered_fee_cents >= Artist.guarantee_floor_cents"
        side_effects:
          - "offered_fee_cents/offered_artist_share_pct overwritten; revision_count incremented by 1; counter fields reset to null"
          - "negotiation.version incremented by 1"
        note: "This edge closes the OFFERED -> COUNTERED -> OFFERED cycle inside one round."
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /fee-negotiations/{id}/accept"
        actor: ArtistRepresentative
        preconditions:
          - "negotiation.status == OFFERED"
          - "X-User-ID == engagement.artist_id"
          - "engagement.financial_clearance != BLOCKED"
          - "no other FeeNegotiation of this engagement has status ACCEPTED"
        side_effects:
          - "accepted_fee_cents = offered_fee_cents; accepted_share_pct = offered_artist_share_pct; accepted_by_user_id = X-User-ID"
          - "engagement.negotiated_fee_cents and artist_share_pct written; engagement.fee_accepted_by_user_id = X-User-ID"
          - "because engagement.negotiated_fee_cents changed, engagement.projected_margin_cents is recomputed by engagement_margin PROJECTED"
          - "because projected_margin_cents became negative while clearance was CLEARED, engagement.financial_clearance flips CLEARED -> ESCALATED and risk_tier is set to HIGH"
          - "engagement.version incremented by 1"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /fee-negotiations/{id}/accept"
        actor: ProgrammingDirector
        preconditions:
          - "negotiation.status == COUNTERED"
          - "engagement.financial_clearance != BLOCKED"
          - "no other FeeNegotiation of this engagement has status ACCEPTED"
        side_effects:
          - "accepted_fee_cents = counter_fee_cents; accepted_share_pct = counter_artist_share_pct; accepted_by_user_id = X-User-ID"
          - "engagement.negotiated_fee_cents/artist_share_pct/fee_accepted_by_user_id written"
          - "because engagement.negotiated_fee_cents changed, engagement.projected_margin_cents is recomputed; a negative result flips CLEARED -> ESCALATED"
          - "engagement.version incremented by 1"
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system, cascaded from POST /engagements/{id}/fee-negotiations (new round)"
        actor: system
        preconditions:
          - "negotiation.status IN {OFFERED, COUNTERED}"
        side_effects:
          - "negotiation.status set to SUPERSEDED; negotiation.version incremented by 1"
      - from: COUNTERED
        to: SUPERSEDED
        trigger: "system, cascaded from POST /engagements/{id}/fee-negotiations (new round)"
        actor: system
        preconditions:
          - "negotiation.status IN {OFFERED, COUNTERED}"
        side_effects:
          - "negotiation.status set to SUPERSEDED; negotiation.version incremented by 1"

  - entity: TechRider
    initial_state: SUBMITTED
    terminal_states: [CLEARED, REJECTED_INFEASIBLE]
    transitions:
      - from: SUBMITTED
        to: CAPABLE
        trigger: "POST /tech-riders/{id}/review"
        actor: TechnicalDirector
        preconditions:
          - "rider.review_status == SUBMITTED"
          - "technical_capability_assessment yields an empty capability_gaps array"
        side_effects:
          - "capability_gaps set to []; reviewed_by_user_id written; rider.version incremented by 1"
      - from: SUBMITTED
        to: GAP_IDENTIFIED
        trigger: "POST /tech-riders/{id}/review"
        actor: TechnicalDirector
        preconditions:
          - "rider.review_status == SUBMITTED"
          - "technical_capability_assessment yields a non-empty capability_gaps array without RIGGING_OVER_CAPACITY"
        side_effects:
          - "capability_gaps written; reviewed_by_user_id written; rider.version incremented by 1"
      - from: SUBMITTED
        to: REJECTED_INFEASIBLE
        trigger: "POST /tech-riders/{id}/review"
        actor: TechnicalDirector
        preconditions:
          - "rider.review_status == SUBMITTED"
          - "submitted_rigging_kg > PerformanceSpace.rigging_capacity_kg"
        side_effects:
          - "capability_gaps set to [RIGGING_OVER_CAPACITY]; reviewed_by_user_id written; rider.version incremented by 1"
        note: "Terminal: an infeasible rider can never be cleared, so the engagement can never be confirmed on it."
      - from: CAPABLE
        to: CLEARED
        trigger: "POST /tech-riders/{id}/clear"
        actor: TechnicalDirector
        preconditions:
          - "rider.review_status == CAPABLE"
        side_effects:
          - "rider.additional_equipment_cost_cents set to 0"
          - "engagement.additional_equipment_cost_cents recomputed (unchanged by this branch)"
          - "rider.version incremented by 1"
        note: "CAPABLE branch of the fork-join: no equipment cost, no deposit change."
      - from: GAP_IDENTIFIED
        to: CLEARED
        trigger: "POST /tech-riders/{id}/clear"
        actor: TechnicalDirector
        preconditions:
          - "rider.review_status == GAP_IDENTIFIED"
          - "every element of capability_gaps other than RIGGING_NEAR_LIMIT is matched by at least one EquipmentRentalLine of this rider with status RESERVED and covers_gap equal to that element"
        side_effects:
          - "rider.additional_equipment_cost_cents set to the sum of line_cost_cents over this rider's RESERVED lines"
          - "because the rider's equipment cost changed, engagement.additional_equipment_cost_cents is recomputed"
          - "because engagement.additional_equipment_cost_cents changed, engagement.deposit_required_cents is recomputed by deposit_requirement (RENTAL only)"
          - "rider.version incremented by 1"
        note: "GAP branch of the fork-join: joins at CLEARED with a strictly larger side-effect set than the CAPABLE branch."

  - entity: LaborCall
    initial_state: ESTIMATED
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: ESTIMATED
        to: WORKED
        trigger: "POST /labor-calls/{id}/report-hours"
        actor: TechnicalDirector
        preconditions:
          - "call.status == ESTIMATED"
          - "engagement.lifecycle_status IN {CONFIRMED, PERFORMED}"
        side_effects:
          - "actual_hours/meal_break_taken stored; actual_cost_cents written by labor_cost ACTUAL variant"
          - "call.version incremented by 1"
      - from: WORKED
        to: RECONCILED
        trigger: "system, cascaded from POST /settlements/{id}/finalize"
        actor: system
        preconditions:
          - "call.status == WORKED"
        side_effects:
          - "call.status set to RECONCILED; call.version incremented by 1"
      - from: ESTIMATED
        to: CANCELLED
        trigger: "system, cascaded from POST /engagements/{id}/cancel"
        actor: system
        preconditions:
          - "call.status == ESTIMATED"
        side_effects:
          - "call.status set to CANCELLED; call.version incremented by 1"
          - "engagement.labor_estimate_total_cents recomputed without this call"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: EXPENSES_RECONCILED
        trigger: "POST /settlements/{id}/reconcile-expenses"
        actor: FinanceController
        preconditions:
          - "settlement.status == DRAFT"
          - "every LaborCall of the engagement with status ESTIMATED has been reported (no call of the engagement remains ESTIMATED)"
        side_effects:
          - "actual_marketing_cents stored; actual_labor_cents recomputed over WORKED calls"
          - "reimbursable_expense_cap_cents, reimbursable_expenses_cents, artist_share_cents, net_to_center_cents, reserve_contribution_cents, amount_payable_to_artist_cents and balance_due_from_client_cents written by settlement_financials"
          - "settlement.version incremented by 1"
      - from: EXPENSES_RECONCILED
        to: FINALIZED
        trigger: "POST /settlements/{id}/finalize"
        actor: FinanceController
        preconditions:
          - "settlement.status == EXPENSES_RECONCILED"
          - "engagement.lifecycle_status == PERFORMED"
          - "X-User-ID != engagement.fee_accepted_by_user_id"
        side_effects:
          - "finalized_by_user_id written; settlement.status set to FINALIZED"
          - "engagement.lifecycle_status set to SETTLED with the full cascade declared on that transition"
          - "settlement.version incremented by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: negotiation-round-open-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{id}/fee-negotiations"
    occ_field: "expected_engagement_version"
    description: |
      Opening a new FeeNegotiation round against an Engagement whose version has advanced since the
      client last read it is rejected. A new round legitimately supersedes any non-terminal earlier
      round, so the operation would otherwise succeed against a stale view and silently discard the
      round the client never saw.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

  - rule_id: risk-assessment-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{id}/assess-risk"
    occ_field: "expected_engagement_version"
    description: |
      Re-running the financial risk assessment overwrites the previous clearance decision, so a client
      holding a stale Engagement version would replace a clearance derived from inputs it never
      observed. The write is rejected when expected_engagement_version does not equal the stored
      Engagement.version.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: facility_fee
    trigger: "POST /engagements (RENTAL only), and recomputed on no other event"
    algorithm: tiered_pricing
    formula: |
      # inputs: space.base_facility_fee_cents, space.load_in_day_fee_cents, space.seat_capacity,
      #         engagement.performance_day_count, engagement.load_in_day_count,
      #         rental_client.is_nonprofit
      base_cents = space.base_facility_fee_cents * engagement.performance_day_count
                 + space.load_in_day_fee_cents  * engagement.load_in_day_count
      if   engagement.performance_day_count >= 5: multi_day_pct = 0.15
      elif engagement.performance_day_count >= 3: multi_day_pct = 0.10
      else:                                       multi_day_pct = 0.00
      nonprofit_pct = 0.20 if rental_client.is_nonprofit else 0.00
      combined_pct  = min(MAX_COMBINED_DISCOUNT_PCT, multi_day_pct + nonprofit_pct)
      discounted_cents = round_half_up(base_cents * (1 - combined_pct))     # round ONCE, here
      capacity_surcharge_cents = max(0, space.seat_capacity - CAPACITY_SURCHARGE_FREE_SEATS)
                                 * CAPACITY_SURCHARGE_CENTS_PER_SEAT       # integer, never rounded
      facility_fee_cents = discounted_cents + capacity_surcharge_cents
      # PRESENTED engagements: facility_fee_cents = 0 (the center is not renting the hall to itself)
    input_set: "The engagement's own day counts; the referenced PerformanceSpace row; the referenced RentalClient row. No sibling engagements participate."
    constants:
      MAX_COMBINED_DISCOUNT_PCT: 0.30
      CAPACITY_SURCHARGE_FREE_SEATS: 1200
      CAPACITY_SURCHARGE_CENTS_PER_SEAT: 25
    precision: "integer cents; the single rounding step is round_half_up applied to the discounted base BEFORE the surcharge is added"

  - name: labor_cost
    trigger: "POST /engagements/{id}/labor-calls (ESTIMATE variant) and POST /labor-calls/{id}/report-hours (ACTUAL variant)"
    algorithm: threshold
    formula: |
      # shared tiering over a per-crew-member hour count `h`
      billable_h = max(h, dept.call_minimum_hours)
      st_h = min(billable_h, OVERTIME_THRESHOLD_HOURS)
      ot_h = min(max(billable_h - OVERTIME_THRESHOLD_HOURS, 0),
                 DOUBLETIME_THRESHOLD_HOURS - OVERTIME_THRESHOLD_HOURS)
      dt_h = max(billable_h - DOUBLETIME_THRESHOLD_HOURS, 0)
      # ROUNDING ORDER IS PINNED: round each rate component to whole cents per crew member,
      # sum the three components per crew member, THEN multiply by crew_size.
      per_crew_cents = round_half_up(st_h * dept.straight_hourly_rate_cents)
                     + round_half_up(ot_h * dept.straight_hourly_rate_cents * dept.overtime_multiplier)
                     + round_half_up(dt_h * dept.straight_hourly_rate_cents * dept.doubletime_multiplier)
      penalty_cents = dept.meal_penalty_cents
                      if (variant == ACTUAL and h > MEAL_BREAK_LIMIT_HOURS and meal_break_taken == false)
                      else 0
      cost_cents = (per_crew_cents + penalty_cents) * call.crew_size
    input_set: "One LaborCall row and its UnionDepartment rate card. ESTIMATE uses h = call.scheduled_hours; ACTUAL uses h = call.actual_hours."
    constants:
      OVERTIME_THRESHOLD_HOURS: 8
      DOUBLETIME_THRESHOLD_HOURS: 12
      MEAL_BREAK_LIMIT_HOURS: 5
    precision: "integer cents; round_half_up per rate component per crew member, then multiply by crew_size — summing all components first and rounding once is a different, forbidden order"
    variants:
      - name: ESTIMATE
        when: "LaborCall creation; writes estimated_cost_cents"
        difference: "h = scheduled_hours derived from call_start_utc/call_end_utc; the meal penalty is never applied even when scheduled_hours > MEAL_BREAK_LIMIT_HOURS"
      - name: ACTUAL
        when: "hours reporting; writes actual_cost_cents"
        difference: "h = reported actual_hours and the meal penalty applies when actual_hours > MEAL_BREAK_LIMIT_HOURS and meal_break_taken == false; for identical durations ACTUAL therefore exceeds ESTIMATE by meal_penalty_cents * crew_size"

  - name: engagement_margin
    trigger: "POST /engagements/{id}/assess-risk and POST /engagements/{id}/on-sale (PROJECTED variant); POST /settlements/{id}/finalize (REALIZED variant)"
    algorithm: forward_looking
    formula: |
      # ---- PROJECTED (forward-looking) ----
      projected_gross_cents = sum over PriceTier t of this engagement with t.status == ACTIVE, ordered by
          t.created_at ASC, of round_half_up(t.base_price_cents * t.seats_allocated * sell_through)
          # per-tier rounding, then sum (pinned)
        where sell_through = artist.historical_sell_through_pct for PRESENTED,
              and 0 for RENTAL (the client keeps the box office)
      fee_basis_cents = engagement.negotiated_fee_cents if an ACCEPTED FeeNegotiation exists,
                        else the offered_fee_cents of the FeeNegotiation with the highest round_index
                        whose status IN {OFFERED, COUNTERED}, else 0
      projected_costs_cents = fee_basis_cents + engagement.labor_estimate_total_cents
                            + engagement.additional_equipment_cost_cents + MARKETING_FLAT_CENTS
      projected_margin_cents = projected_gross_cents - projected_costs_cents
      # ---- REALIZED (chronological) ----
      realized_gross_cents = running sum over TicketSale s with s.status == SOLD on tiers of this
          engagement, processed in s.created_at ASC order, of s.gross_cents
          + sum of PriceTier.subscription_revenue_cents over the engagement's tiers
      realized_margin_cents = realized_gross_cents
                            - (settlement.guarantee_cents + settlement.artist_share_cents
                               + settlement.actual_labor_cents + settlement.actual_equipment_cents
                               + settlement.actual_marketing_cents)
    input_set: "PROJECTED includes only ACTIVE PriceTier rows and excludes every TicketSale; REALIZED includes only SOLD TicketSale rows plus booked subscription revenue and uses reconciled actual costs, excluding MARKETING_FLAT_CENTS."
    constants:
      MARKETING_FLAT_CENTS: 250000
    precision: "integer cents; PROJECTED rounds per tier with round_half_up then sums; REALIZED sums already-integer sale rows"
    variants:
      - name: PROJECTED
        when: "risk assessment and on-sale, before any ticket is sold"
        difference: "uses historical sell-through against ACTIVE tier allocations and a flat marketing allowance"
      - name: REALIZED
        when: "settlement finalization"
        difference: "uses actual SOLD sales in created_at order and reconciled actual costs; for identical tier and cost data the two variants differ whenever actual sell-through differs from historical sell-through or reconciled marketing differs from MARKETING_FLAT_CENTS"

  - name: financial_risk_score
    trigger: "POST /engagements/{id}/assess-risk"
    algorithm: weighted_scoring
    formula: |
      # PRESENTED variant
      fee_exposure_ratio = fee_basis_cents / max(1, projected_gross_cents)      # fee_basis per engagement_margin
      routing_slack_days = min( floor_days(engagement.performance_start_utc - artist.routing_window_start_utc),
                                floor_days(artist.routing_window_end_utc - engagement.performance_end_utc) )
      lead_days          = floor_days(engagement.performance_start_utc - clock_current_utc)
      score = round_half_up( 100 * ( 0.45 * min(1, fee_exposure_ratio)
                                   + 0.25 * (1 - min(1, max(0, routing_slack_days) / ROUTING_SLACK_TARGET_DAYS))
                                   + 0.20 * (1 - min(1, max(0, lead_days) / LEAD_TARGET_DAYS))
                                   + 0.10 * (1 - artist.historical_sell_through_pct) ) )
      # RENTAL variant
      credit_factor = 1.00 if client.credit_rating == "C" else 0.50 if client.credit_rating == "B" else 0.00
      arrears_ratio = client.outstanding_balance_cents / max(1, engagement.deposit_required_cents)
      score = round_half_up( 100 * ( 0.50 * credit_factor
                                   + 0.30 * min(1, arrears_ratio)
                                   + 0.20 * (1 - min(1, max(0, lead_days) / LEAD_TARGET_DAYS)) ) )
      # shared banding (>= boundaries)
      risk_tier = PROHIBITIVE if score >= 75 else HIGH if score >= 55 else MODERATE if score >= 35 else LOW
      clearance = BLOCKED if risk_tier == PROHIBITIVE
                  else ESCALATED_APPROVED if (risk_tier == HIGH and payload.override_escalation == true
                                              and current clearance == ESCALATED)
                  else ESCALATED if risk_tier == HIGH
                  else CLEARED
    input_set: "The engagement row, its Artist or RentalClient row, its ACTIVE PriceTier rows (through projected_gross_cents) and the logical clock."
    constants:
      ROUTING_SLACK_TARGET_DAYS: 14
      LEAD_TARGET_DAYS: 120
      TIER_PROHIBITIVE_MIN: 75
      TIER_HIGH_MIN: 55
      TIER_MODERATE_MIN: 35
    precision: "score is an integer 0..100 produced by a single round_half_up over the weighted sum; band comparisons use >= exactly as written"
    variants:
      - name: PRESENTED
        when: "engagement_type == PRESENTED"
        difference: "weights fee exposure, routing slack, lead time and historical sell-through"
      - name: RENTAL
        when: "engagement_type == RENTAL"
        difference: "weights credit rating, arrears against the required deposit and lead time; routing and sell-through are not inputs"

  - name: deposit_requirement
    trigger: "POST /engagements (RENTAL), and recomputed whenever engagement.labor_estimate_total_cents or engagement.additional_equipment_cost_cents changes"
    algorithm: threshold
    formula: |
      deposit_pct = 0.25 if client.credit_rating == "A" else 0.50 if client.credit_rating == "B" else 1.00
      core_cents  = engagement.facility_fee_cents + engagement.labor_estimate_total_cents
      raw_cents   = round_half_up(deposit_pct * core_cents)
      if client.outstanding_balance_cents > 0:            # strict > ; exactly 0 adds nothing
          raw_cents = raw_cents + engagement.additional_equipment_cost_cents
      rounded_up_cents        = ceil_to_multiple(raw_cents, DEPOSIT_ROUNDING_MULTIPLE_CENTS)
      deposit_required_cents  = max(DEPOSIT_FLOOR_CENTS, rounded_up_cents)
      # PRESENTED engagements: deposit_required_cents = 0
    input_set: "The engagement row (facility fee, labor estimate, equipment cost) and its RentalClient row."
    constants:
      DEPOSIT_FLOOR_CENTS: 50000
      DEPOSIT_ROUNDING_MULTIPLE_CENTS: 100
    precision: "integer cents; round_half_up on the percentage step, then ceil to the next whole 100 cents, then apply the floor"

  - name: technical_capability_assessment
    trigger: "POST /tech-riders/{id}/review"
    algorithm: constraint_propagation
    formula: |
      space = PerformanceSpace of the rider's engagement
      if rider.submitted_rigging_kg > space.rigging_capacity_kg:
          return { review_status: REJECTED_INFEASIBLE, gaps: [RIGGING_OVER_CAPACITY] }
      gaps = []
      near_limit_threshold_kg = round_half_up(RIGGING_NEAR_LIMIT_PCT * space.rigging_capacity_kg)
      if rider.submitted_rigging_kg >= near_limit_threshold_kg: gaps += [RIGGING_NEAR_LIMIT]   # >= boundary
      if rider.requested_power_amps > space.house_power_amps:   gaps += [POWER_SHORTFALL]
      if rider.requested_dmx_universes > space.dmx_universes:   gaps += [DMX_SHORTFALL]
      # gaps are emitted in this fixed order: RIGGING_NEAR_LIMIT, POWER_SHORTFALL, DMX_SHORTFALL
      review_status = GAP_IDENTIFIED if len(gaps) > 0 else CAPABLE
    input_set: "One TechRider row and the PerformanceSpace row of its engagement."
    constants:
      RIGGING_NEAR_LIMIT_PCT: 0.90
    precision: "integer kilograms; the near-limit threshold is round_half_up(0.90 * capacity) and the comparison is >="

  - name: dynamic_single_ticket_price
    trigger: "POST /price-tiers/{id}/ticket-sales"
    algorithm: threshold
    formula: |
      sell_through_before = tier.sold_qty / tier.seats_allocated       # evaluated BEFORE this sale
      if tier.dynamic_pricing_enabled == false:
          multiplier = 1.00
      elif sell_through_before >= DYNAMIC_HIGH_BAND:  multiplier = DYNAMIC_HIGH_MULTIPLIER
      elif sell_through_before >= DYNAMIC_MID_BAND:   multiplier = DYNAMIC_MID_MULTIPLIER
      else:                                          multiplier = 1.00
      unit_price_cents = min(round_half_up(tier.base_price_cents * multiplier), tier.price_ceiling_cents)
      gross_cents = unit_price_cents * qty            # per-unit rounding first, then multiply
      restoration_fee_cents = CAPITAL_RESTORATION_FEE_CENTS * qty
    input_set: "One PriceTier row (its sold_qty before this sale) and the requested qty. Subscription holds do NOT count toward sell_through_before."
    constants:
      DYNAMIC_MID_BAND: 0.60
      DYNAMIC_HIGH_BAND: 0.85
      DYNAMIC_MID_MULTIPLIER: 1.15
      DYNAMIC_HIGH_MULTIPLIER: 1.30
      CAPITAL_RESTORATION_FEE_CENTS: 200
    precision: "integer cents; round_half_up on the per-unit price, then multiply by qty; band comparisons use >= on the ratio computed to 4 decimal places"

  - name: subscription_price_allocation
    trigger: "POST /subscription-packages/{id}/sell"
    algorithm: waterfall_allocation
    formula: |
      # per single order; the result is multiplied by order_qty when revenue is booked
      tiers = [ the PriceTier with tier_name == package.subscription_tier_name in each engagement of
                package.included_engagement_ids ]
      face_total_cents = sum over tiers of (tier.base_price_cents * package.seats_per_order)
      for each tier, in order of its engagement.created_at ASC, then engagement.performance_start_utc ASC:
          face_cents      = tier.base_price_cents * package.seats_per_order
          allocated_cents = floor(package.package_price_cents * face_cents / face_total_cents)
      remainder_cents = package.package_price_cents - sum(allocated_cents)
      # the whole remainder goes to the FIRST tier in the ordering above (earliest engagement.created_at,
      # then earliest performance_start_utc); ids never participate in the ordering
      allocated_cents[first] += remainder_cents
      # booking, per sold order
      tier.subscription_held_qty  += package.seats_per_order * order_qty
      tier.subscription_revenue_cents += allocated_cents[tier] * order_qty
    input_set: "The package row, the designated PriceTier of every included engagement (status ACTIVE, subscription_eligible true), and order_qty."
    constants: {}
    precision: "integer cents; floor per tier, single remainder assignment to the first tier in the pinned order"

  - name: settlement_financials
    trigger: "POST /settlements/{id}/reconcile-expenses"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The expense cap depends on adjusted gross, the reimbursable
      # amount depends on the cap, the artist share depends on the reimbursable amount, and the
      # reserve contribution depends on net_to_center. The reserve contribution is NOT an expense
      # and is NEVER subtracted from net_to_center — that back-edge would make the system circular.
      # ---- PRESENTED ----
      1. adjusted_gross_cents = box_office_gross_cents - restoration_fees_cents
      2. if   adjusted_gross_cents <  EXPENSE_CAP_BAND1_MAX: cap = EXPENSE_CAP_BAND1_CENTS
         elif adjusted_gross_cents <  EXPENSE_CAP_BAND2_MAX: cap = EXPENSE_CAP_BAND2_CENTS
         else: cap = round_half_up(EXPENSE_CAP_HIGH_PCT * adjusted_gross_cents)
         reimbursable_expense_cap_cents = cap
      3. eligible_cents = actual_marketing_cents + actual_equipment_cents      # labor is NOT reimbursable
         reimbursable_expenses_cents = min(eligible_cents, reimbursable_expense_cap_cents)
      4. overage_cents = max(0, adjusted_gross_cents - guarantee_cents - reimbursable_expenses_cents)
         artist_share_cents = round_half_up(engagement.artist_share_pct * overage_cents)
      5. net_to_center_cents = adjusted_gross_cents - guarantee_cents - reimbursable_expenses_cents
                             - artist_share_cents - actual_labor_cents
      6. reserve_pct = RESERVE_HIGH_PCT if net_to_center_cents >= RESERVE_HIGH_BAND_CENTS
                       else RESERVE_BASE_PCT if net_to_center_cents >= 0 else 0
         reserve_contribution_cents = round_half_up(reserve_pct * max(0, net_to_center_cents))
                                    + restoration_fees_cents
      7. amount_payable_to_artist_cents = guarantee_cents + artist_share_cents
         balance_due_from_client_cents  = 0
      # ---- RENTAL ----
      1. adjusted_gross_cents = 0; guarantee_cents = 0; reimbursable_expenses_cents = 0; artist_share_cents = 0
      2. service_charges_cents = round_half_up((1 + SERVICE_MARKUP_PCT)
                                   * (actual_labor_cents + actual_equipment_cents))
      3. charges_cents = engagement.facility_fee_cents + service_charges_cents + actual_marketing_cents
      4. balance_due_from_client_cents = charges_cents - engagement.deposit_paid_cents
      5. net_to_center_cents = charges_cents - actual_labor_cents - actual_equipment_cents
      6. reserve_pct as above; reserve_contribution_cents = round_half_up(reserve_pct * max(0, net_to_center_cents))
      7. amount_payable_to_artist_cents = 0
    input_set: "The frozen draft figures on the Settlement row plus actual_marketing_cents supplied at reconciliation; WORKED LaborCall rows only (ESTIMATED and CANCELLED are excluded); RESERVED EquipmentRentalLine rows only."
    constants:
      EXPENSE_CAP_BAND1_MAX: 2000000
      EXPENSE_CAP_BAND1_CENTS: 300000
      EXPENSE_CAP_BAND2_MAX: 5000000
      EXPENSE_CAP_BAND2_CENTS: 600000
      EXPENSE_CAP_HIGH_PCT: 0.12
      RESERVE_HIGH_BAND_CENTS: 1000000
      RESERVE_HIGH_PCT: 0.10
      RESERVE_BASE_PCT: 0.05
      SERVICE_MARKUP_PCT: 0.15
    precision: "integer cents; round_half_up at each numbered step where a percentage appears, in the order shown"
    variants:
      - name: PRESENTED_SPLIT
        when: "engagement_type == PRESENTED"
        difference: "guarantee plus capped-expense overage split with the artist; labor is a center cost"
      - name: RENTAL_FOUR_WALL
        when: "engagement_type == RENTAL"
        difference: "facility fee plus marked-up services billed to the client; no box-office split and no artist payable"

  - name: education_subsidy_allowance
    trigger: "POST /engagements/{id}/education-programs"
    algorithm: threshold
    formula: |
      base_cents = SUBSIDY_BASE_STUDENT_MATINEE_CENTS   if program_type == STUDENT_MATINEE
                 else SUBSIDY_BASE_MASTERCLASS_CENTS    if program_type == MASTERCLASS
                 else SUBSIDY_BASE_COMMUNITY_CENTS
      allowance_cents        = base_cents + SUBSIDY_PER_PARTICIPANT_CENTS * participant_capacity
      subsidy_approved_cents = min(subsidy_requested_cents, allowance_cents)
      # reserve guard, evaluated against the running balance BEFORE the draw
      reserve_balance_before = balance_after_cents of the ReserveLedgerEntry with the greatest created_at,
                               or 0 when no entry exists
      require reserve_balance_before - subsidy_approved_cents >= EDUCATION_RESERVE_FLOOR_CENTS
              else ERR_RESERVE_INSUFFICIENT
      # side effect: append EDUCATION_SUBSIDY_DRAW with amount_cents = -subsidy_approved_cents
    input_set: "One EducationProgram request, and the single latest ReserveLedgerEntry ordered by created_at ASC."
    constants:
      SUBSIDY_BASE_STUDENT_MATINEE_CENTS: 400000
      SUBSIDY_BASE_MASTERCLASS_CENTS: 150000
      SUBSIDY_BASE_COMMUNITY_CENTS: 250000
      SUBSIDY_PER_PARTICIPANT_CENTS: 1500
      EDUCATION_RESERVE_FLOOR_CENTS: 5000000
    precision: "integer cents; no rounding required (all terms are integers); the floor comparison uses >="

  - name: cancellation_fee
    trigger: "POST /engagements/{id}/cancel from lifecycle_status CONFIRMED"
    algorithm: threshold
    formula: |
      days_to_performance = floor_days(engagement.performance_start_utc - clock_current_utc)
      if   days_to_performance < CANCEL_BAND_NEAR_DAYS:  retained_pct = CANCEL_NEAR_PCT
      elif days_to_performance < CANCEL_BAND_MID_DAYS:   retained_pct = CANCEL_MID_PCT
      else:                                             retained_pct = CANCEL_FAR_PCT
      exposure_cents = engagement.facility_fee_cents + engagement.negotiated_fee_cents
      cancellation_fee_cents = round_half_up(retained_pct * exposure_cents)
      # a DRAFT cancellation always yields 0 and never reaches this formula
    input_set: "The engagement row and the logical clock; sibling engagements do not participate."
    constants:
      CANCEL_BAND_NEAR_DAYS: 30
      CANCEL_BAND_MID_DAYS: 90
      CANCEL_NEAR_PCT: 0.75
      CANCEL_MID_PCT: 0.40
      CANCEL_FAR_PCT: 0.10
    precision: "integer cents, single round_half_up; band comparisons use < exactly as written"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a role declared in 1.7"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 25
    category: auth
    check: "For entity_backed roles, X-User-ID equals the owning foreign key of the target resource (ArtistRepresentative -> engagement.artist_id; RentalClientContact -> engagement.rental_client_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /engagements/{id}/tech-riders, POST /fee-negotiations/{id}/counter, POST /fee-negotiations/{id}/accept, POST /engagements/{id}/record-deposit, GET /artists/{id}, GET /rental-clients/{id}"

  - priority: 28
    category: auth
    check: "X-User-ID of the finalizing FinanceController differs from engagement.fee_accepted_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /settlements/{id}/finalize"

  - priority: 30
    category: existence
    check: "Path-referenced resources exist, validated left to right"
    error_id: "ERR_ENGAGEMENT_NOT_FOUND | ERR_NEGOTIATION_NOT_FOUND | ERR_TECH_RIDER_NOT_FOUND | ERR_LABOR_CALL_NOT_FOUND | ERR_PRICE_TIER_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND | ERR_EQUIPMENT_ITEM_NOT_FOUND | ERR_DEPARTMENT_NOT_FOUND | ERR_SUBSCRIPTION_PACKAGE_NOT_FOUND | ERR_PARTY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 32
    category: existence
    check: "Body-referenced resources exist: space_id, artist_id, rental_client_id, union_department_id, equipment_item_id, included_engagement_ids elements"
    error_id: "ERR_SPACE_NOT_FOUND | ERR_PARTY_NOT_FOUND | ERR_DEPARTMENT_NOT_FOUND | ERR_EQUIPMENT_ITEM_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /engagements, POST /engagements/{id}/labor-calls, POST /tech-riders/{id}/equipment-lines, POST /subscription-packages, POST /reserve-ledger-entries"

  - priority: 35
    category: business_constraint
    check: "Request body satisfies the endpoint's input schema: required fields present, enums in range, numbers within declared bounds, call_end_utc > call_start_utc, load_in_start_utc <= performance_start_utc <= performance_end_utc <= load_out_end_utc"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 40
    category: state
    check: "The target resource is in a state that admits this transition (engagement lifecycle/ticketing dimension, negotiation status, rider review_status, labor call status, settlement status), including: a rider must be GAP_IDENTIFIED to accept equipment lines, and confirmation requires some TechRider of the engagement to be CLEARED"
    error_id: "ERR_ENGAGEMENT_NOT_DRAFT | ERR_ENGAGEMENT_NOT_CONFIRMED | ERR_PERFORMANCE_NOT_COMPLETE | ERR_NEGOTIATION_NOT_OPEN | ERR_RIDER_INVALID_STATE | ERR_LABOR_CALL_INVALID_STATE | ERR_SETTLEMENT_INVALID_STATE | ERR_TICKETING_NOT_ON_SALE | ERR_TIER_CLOSED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 45
    category: state
    check: "expected_engagement_version equals the stored Engagement.version (optimistic concurrency)"
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /engagements/{id}/fee-negotiations, POST /engagements/{id}/assess-risk"

  - priority: 50
    category: business_referential
    check: "The operation matches the engagement_type: fee negotiations, education programs, price tiers, on-sale and subscription membership require PRESENTED; record-deposit and facility-fee settlement require RENTAL; artist_id is present only for PRESENTED and rental_client_id only for RENTAL"
    error_id: ERR_ENGAGEMENT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /engagements, POST /engagements/{id}/fee-negotiations, POST /engagements/{id}/record-deposit, POST /engagements/{id}/education-programs, POST /subscription-packages"

  - priority: 55
    category: business_safety
    check: "The PerformanceSpace of a new engagement has status ACTIVE"
    error_id: ERR_SPACE_OFFLINE
    http_status: 422
    applies_to: "POST /engagements, POST /engagements/{id}/confirm"

  - priority: 60
    category: business_temporal
    check: "The engagement's occupancy interval [load_in_start_utc, load_out_end_utc + space.changeover_buffer_minutes) does not overlap the same interval of another engagement on the same space whose lifecycle_status IN {DRAFT, CONFIRMED, PERFORMED, SETTLED}"
    error_id: ERR_SPACE_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /engagements"

  - priority: 62
    category: business_temporal
    check: "For PRESENTED engagements, [performance_start_utc, performance_end_utc] lies inside the artist's routing window and is at least artist.min_days_between_engagements whole days away from every other non-CANCELLED engagement of that artist"
    error_id: ERR_ROUTING_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /engagements"

  - priority: 64
    category: business_temporal
    check: "A labor call interval [call_start_utc, call_end_utc) lies inside [engagement.load_in_start_utc, engagement.load_out_end_utc)"
    error_id: ERR_CALL_OUTSIDE_ENGAGEMENT_WINDOW
    http_status: 422
    applies_to: "POST /engagements/{id}/labor-calls"

  - priority: 70
    category: business_constraint
    check: "For the labor call's department, the sum of crew_size over calls whose status IN {ESTIMATED, WORKED} and whose [call_start_utc, call_end_utc) interval overlaps the new one (touching endpoints do NOT overlap), plus the new crew_size, is <= department.roster_size"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /engagements/{id}/labor-calls"

  - priority: 71
    category: business_constraint
    check: "The sum of seats_allocated over ACTIVE PriceTier rows of the engagement (including the new one) is <= PerformanceSpace.seat_capacity, and tier_name is unique within the engagement"
    error_id: ERR_SEAT_ALLOCATION_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: "POST /engagements/{id}/price-tiers, POST /engagements/{id}/on-sale"

  - priority: 72
    category: business_constraint
    check: "The requested qty is <= (equipment_item.on_hand_qty - equipment_item.reserved_qty)"
    error_id: ERR_EQUIPMENT_STOCK_UNAVAILABLE
    http_status: 409
    applies_to: "POST /tech-riders/{id}/equipment-lines"

  - priority: 73
    category: business_constraint
    check: "The requested seats are available: for single sales qty <= tier.available_qty; for subscription sales seats_per_order * order_qty <= available_qty of every designated tier (all-or-nothing)"
    error_id: ERR_TIER_SOLD_OUT
    http_status: 409
    applies_to: "POST /price-tiers/{id}/ticket-sales, POST /subscription-packages/{id}/sell"

  - priority: 74
    category: business_constraint
    check: "engagement.negotiation_round_count < MAX_ROUNDS_PER_ENGAGEMENT (3) when opening a round, and negotiation.revision_count < MAX_REVISIONS_PER_ROUND (2) when revising an offer"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /engagements/{id}/fee-negotiations, POST /fee-negotiations/{id}/revise-offer"

  - priority: 75
    category: business_constraint
    check: "The engagement has no TechRider row yet (at most one rider per engagement) and no Settlement row yet (at most one settlement per engagement)"
    error_id: "ERR_DUPLICATE_TECH_RIDER | ERR_DUPLICATE_SETTLEMENT"
    http_status: 409
    applies_to: "POST /engagements/{id}/tech-riders, POST /engagements/{id}/settlements"

  - priority: 76
    category: business_constraint
    check: "offered_fee_cents (and counter/revised offers) is >= artist.guarantee_floor_cents"
    error_id: ERR_GUARANTEE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /engagements/{id}/fee-negotiations, POST /fee-negotiations/{id}/revise-offer"

  - priority: 77
    category: business_constraint
    check: "Every capability gap other than RIGGING_NEAR_LIMIT is covered by a RESERVED EquipmentRentalLine with a matching covers_gap value before the rider may be cleared"
    error_id: ERR_GAP_NOT_COVERED
    http_status: 409
    applies_to: "POST /tech-riders/{id}/clear"

  - priority: 80
    category: business_safety
    check: "engagement.financial_clearance IN {CLEARED, ESCALATED_APPROVED} before confirmation, and financial_clearance != BLOCKED before a fee negotiation may be accepted"
    error_id: "ERR_CLEARANCE_BLOCKED | ERR_CLEARANCE_REQUIRED"
    http_status: 422
    applies_to: "POST /engagements/{id}/confirm, POST /fee-negotiations/{id}/accept"

  - priority: 85
    category: business_fiscal
    check: "The reserve balance after an education subsidy draw is >= EDUCATION_RESERVE_FLOOR_CENTS"
    error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /engagements/{id}/education-programs"

  - priority: 90
    category: business_fiscal
    check: "For RENTAL confirmation, engagement.deposit_paid_cents >= engagement.deposit_required_cents"
    error_id: ERR_DEPOSIT_SHORTFALL
    http_status: 402
    applies_to: "POST /engagements/{id}/confirm"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/performance-spaces"
    description: "Register a hall."
    roles: [CenterAdmin]
    code: 201
    input: [name, seat_capacity, base_facility_fee_cents, load_in_day_fee_cents, changeover_buffer_minutes, rigging_capacity_kg, house_power_amps, dmx_universes, "status?"]
    output: PerformanceSpace
    side_effects: []

  - method: GET
    path: "/performance-spaces/{id}"
    description: "Read a hall with its capability limits and changeover buffer."
    roles: [CenterAdmin, ProgrammingDirector, RentalManager, TechnicalDirector, BoxOfficeManager]
    code: 200
    input: []
    output: PerformanceSpace
    side_effects: []

  - method: POST
    path: "/artists"
    description: "Register a touring artist with routing window and guarantee floor."
    roles: [ProgrammingDirector]
    code: 201
    input: [legal_name, agency_name, guarantee_floor_cents, historical_sell_through_pct, routing_window_start_utc, routing_window_end_utc, min_days_between_engagements]
    output: Artist
    side_effects: []

  - method: GET
    path: "/artists/{id}"
    description: "Read an artist, including lifetime_guarantee_paid_cents."
    roles: [ProgrammingDirector, ArtistRepresentative, FinanceController]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: POST
    path: "/rental-clients"
    description: "Register a rental client."
    roles: [RentalManager]
    code: 201
    input: [org_name, contact_email, credit_rating, is_nonprofit, "outstanding_balance_cents?"]
    output: RentalClient
    side_effects: []

  - method: GET
    path: "/rental-clients/{id}"
    description: "Read a rental client, including outstanding_balance_cents."
    roles: [RentalManager, RentalClientContact, FinanceController]
    code: 200
    input: []
    output: RentalClient
    side_effects: []

  - method: POST
    path: "/union-departments"
    description: "Register a union department rate card."
    roles: [CenterAdmin]
    code: 201
    input: [department, roster_size, straight_hourly_rate_cents, "overtime_multiplier?", "doubletime_multiplier?", "call_minimum_hours?", "meal_penalty_cents?"]
    output: UnionDepartment
    side_effects: []

  - method: GET
    path: "/union-departments/{id}"
    description: "Read a union department rate card."
    roles: [CenterAdmin, TechnicalDirector, FinanceController]
    code: 200
    input: []
    output: UnionDepartment
    side_effects: []

  - method: GET
    path: "/union-departments/{id}/labor-calls"
    description: "List every labor call drawn against this department (reverse lookup for LaborCall.union_department_id)."
    roles: [CenterAdmin, TechnicalDirector, FinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LaborCall[]
    side_effects: []

  - method: POST
    path: "/equipment-items"
    description: "Register an inventory item available for additional rental."
    roles: [CenterAdmin]
    code: 201
    input: [category, model_name, on_hand_qty, daily_rate_cents, replacement_value_cents, "reserve_funded?"]
    output: EquipmentItem
    side_effects: []

  - method: GET
    path: "/equipment-items/{id}"
    description: "Read an inventory item, including reserved_qty."
    roles: [CenterAdmin, TechnicalDirector]
    code: 200
    input: []
    output: EquipmentItem
    side_effects: []

  - method: GET
    path: "/equipment-items/{id}/rental-lines"
    description: "List rental lines that reserve this item (reverse lookup for EquipmentRentalLine.equipment_item_id)."
    roles: [CenterAdmin, TechnicalDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EquipmentRentalLine[]
    side_effects: []

  - method: POST
    path: "/engagements"
    description: "Book a hall for a presented performance or a rental event."
    roles: [ProgrammingDirector, RentalManager]
    code: 201
    input: [engagement_type, space_id, title, "artist_id?", "rental_client_id?", load_in_start_utc, performance_start_utc, performance_end_utc, load_out_end_utc, performance_day_count, load_in_day_count]
    output: Engagement
    side_effects:
      - "space occupancy overlap check against existing engagements on the same space (buffer-extended interval)"
      - "PRESENTED: artist routing window and min_days_between_engagements check"
      - "RENTAL: facility_fee_cents written by facility_fee and deposit_required_cents written by deposit_requirement"
      - "lifecycle_status DRAFT, financial_clearance UNASSESSED, ticketing_status TICKETING_UNSET"

  - method: GET
    path: "/engagements/{id}"
    description: "Read an engagement with all three state dimensions and every derived money field."
    roles: [ProgrammingDirector, RentalManager, ArtistRepresentative, RentalClientContact, TechnicalDirector, BoxOfficeManager, FinanceController, CenterAdmin]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: GET
    path: "/engagements"
    description: "List engagements filtered by hall, artist, client or lifecycle status (reverse lookup for Engagement.space_id / artist_id / rental_client_id)."
    roles: [ProgrammingDirector, RentalManager, FinanceController, BoxOfficeManager, CenterAdmin]
    code: 200
    input: ["space_id?", "artist_id?", "rental_client_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []

  - method: POST
    path: "/engagements/{id}/assess-risk"
    description: "Run the financial risk assessment and write the financial_clearance dimension. Optimistic-concurrency guarded."
    roles: [FinanceController]
    code: 200
    input: [expected_engagement_version, "override_escalation?"]
    output: Engagement
    side_effects:
      - "risk_score, risk_tier, projected_gross_cents, projected_margin_cents written"
      - "financial_clearance advanced per the clearance dimension state machine"
      - "increments Engagement.version by 1"

  - method: POST
    path: "/engagements/{id}/record-deposit"
    description: "Record a rental deposit payment against the engagement."
    roles: [RentalManager, RentalClientContact]
    code: 200
    input: [amount_cents]
    output: Engagement
    side_effects:
      - "deposit_paid_cents increased by amount_cents"
      - "increments Engagement.version by 1"

  - method: POST
    path: "/engagements/{id}/confirm"
    description: "Confirm the booking once the rider is cleared, clearance is granted and the money precondition of the engagement type is met."
    roles: [ProgrammingDirector, RentalManager]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "lifecycle_status DRAFT -> CONFIRMED"
      - "ticketing_status TICKETING_UNSET -> TIERS_DRAFT"
      - "increments Engagement.version by 1"

  - method: POST
    path: "/engagements/{id}/cancel"
    description: "Cancel the engagement and run the full compensation cascade."
    roles: [ProgrammingDirector, RentalManager]
    code: 200
    input: [reason, "cancelled_by_client?"]
    output: Engagement
    side_effects:
      - "lifecycle_status -> CANCELLED; cancellation_fee_cents written by cancellation_fee when cancelling from CONFIRMED"
      - "ESTIMATED labor calls cancelled -> labor_estimate_total_cents recomputed -> deposit_required_cents recomputed"
      - "RESERVED equipment lines released -> EquipmentItem.reserved_qty recomputed"
      - "SOLD ticket sales refunded -> PriceTier.sold_qty / gross_cents / available_qty recomputed -> realized_gross_cents recomputed"
      - "FUNDED education programs cancelled -> EDUCATION_SUBSIDY_REFUND reserve entries appended"
      - "ticketing_status -> CLOSED and ACTIVE price tiers closed"
      - "increments Engagement.version by 1"

  - method: POST
    path: "/engagements/{id}/fee-negotiations"
    description: "Open a new artist fee negotiation round; supersedes any non-terminal earlier round. Optimistic-concurrency guarded."
    roles: [ProgrammingDirector]
    code: 201
    input: [offered_fee_cents, offered_artist_share_pct, expected_engagement_version]
    output: FeeNegotiation
    side_effects:
      - "earlier FeeNegotiation rows with status IN {OFFERED, COUNTERED} set to SUPERSEDED"
      - "engagement.negotiation_round_count incremented; round_index assigned"
      - "increments Engagement.version by 1"

  - method: GET
    path: "/engagements/{id}/fee-negotiations"
    description: "List negotiation rounds of an engagement (reverse lookup for FeeNegotiation.engagement_id)."
    roles: [ProgrammingDirector, ArtistRepresentative, FinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FeeNegotiation[]
    side_effects: []

  - method: POST
    path: "/fee-negotiations/{id}/counter"
    description: "Artist representative counters the standing offer."
    roles: [ArtistRepresentative]
    code: 200
    input: [counter_fee_cents, counter_artist_share_pct]
    output: FeeNegotiation
    side_effects:
      - "status OFFERED -> COUNTERED; counter fields written"

  - method: POST
    path: "/fee-negotiations/{id}/revise-offer"
    description: "Programming director revises the offer after a counter, returning the round to OFFERED."
    roles: [ProgrammingDirector]
    code: 200
    input: [offered_fee_cents, offered_artist_share_pct]
    output: FeeNegotiation
    side_effects:
      - "status COUNTERED -> OFFERED; revision_count incremented; counter fields reset to null"

  - method: POST
    path: "/fee-negotiations/{id}/accept"
    description: "Accept the standing terms of the round and lock the guarantee onto the engagement."
    roles: [ProgrammingDirector, ArtistRepresentative]
    code: 200
    input: []
    output: FeeNegotiation
    side_effects:
      - "status -> ACCEPTED; accepted_fee_cents / accepted_share_pct / accepted_by_user_id written"
      - "engagement.negotiated_fee_cents, artist_share_pct, fee_accepted_by_user_id written"
      - "engagement.projected_margin_cents recomputed; a negative result flips financial_clearance CLEARED -> ESCALATED"
      - "increments Engagement.version by 1"

  - method: POST
    path: "/engagements/{id}/tech-riders"
    description: "Submit the technical rider for the engagement."
    roles: [ArtistRepresentative, RentalClientContact]
    code: 201
    input: [submitted_rigging_kg, requested_power_amps, requested_dmx_universes, requires_orchestra_pit]
    output: TechRider
    side_effects:
      - "review_status SUBMITTED"

  - method: GET
    path: "/engagements/{id}/tech-riders"
    description: "List the engagement's technical riders (reverse lookup for TechRider.engagement_id)."
    roles: [ProgrammingDirector, RentalManager, TechnicalDirector, ArtistRepresentative, RentalClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: TechRider[]
    side_effects: []

  - method: GET
    path: "/tech-riders/{id}"
    description: "Read a rider with its capability gaps and equipment cost."
    roles: [ProgrammingDirector, RentalManager, TechnicalDirector, ArtistRepresentative, RentalClientContact]
    code: 200
    input: []
    output: TechRider
    side_effects: []

  - method: POST
    path: "/tech-riders/{id}/review"
    description: "Run the capability assessment; forks to CAPABLE, GAP_IDENTIFIED or REJECTED_INFEASIBLE."
    roles: [TechnicalDirector]
    code: 200
    input: []
    output: TechRider
    side_effects:
      - "capability_gaps and review_status written by technical_capability_assessment"
      - "reviewed_by_user_id written"

  - method: POST
    path: "/tech-riders/{id}/equipment-lines"
    description: "Reserve additional equipment to cover a capability gap. The rider MUST be in review_status GAP_IDENTIFIED; any other state (including CAPABLE and CLEARED) is rejected with ERR_RIDER_INVALID_STATE, which is why the CAPABLE branch of the review fork can never carry equipment cost."
    roles: [TechnicalDirector]
    code: 201
    input: [equipment_item_id, covers_gap, qty, rental_days]
    output: EquipmentRentalLine
    side_effects:
      - "line_cost_cents computed as equipment_item.daily_rate_cents * qty * rental_days"
      - "EquipmentItem.reserved_qty recomputed over RESERVED lines"
      - "neither TechRider.additional_equipment_cost_cents nor Engagement.additional_equipment_cost_cents changes here; both are written only when the rider is cleared"

  - method: GET
    path: "/tech-riders/{id}/equipment-lines"
    description: "List a rider's equipment lines (reverse lookup for EquipmentRentalLine.tech_rider_id)."
    roles: [TechnicalDirector, ProgrammingDirector, RentalManager, CenterAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EquipmentRentalLine[]
    side_effects: []

  - method: POST
    path: "/tech-riders/{id}/clear"
    description: "Clear the rider (join point of the review fork); the GAP branch also propagates equipment cost."
    roles: [TechnicalDirector]
    code: 200
    input: []
    output: TechRider
    side_effects:
      - "review_status -> CLEARED"
      - "CAPABLE branch: rider.additional_equipment_cost_cents set to 0; engagement.additional_equipment_cost_cents and deposit_required_cents unchanged"
      - "GAP branch: rider.additional_equipment_cost_cents summed -> engagement.additional_equipment_cost_cents recomputed -> engagement.deposit_required_cents recomputed (RENTAL)"
      - "Engagement.version is NOT incremented by clearing a rider"

  - method: POST
    path: "/engagements/{id}/labor-calls"
    description: "Call union crew for a window inside the engagement's occupancy."
    roles: [TechnicalDirector]
    code: 201
    input: [union_department_id, crew_size, call_start_utc, call_end_utc]
    output: LaborCall
    side_effects:
      - "scheduled_hours and estimated_cost_cents written by labor_cost ESTIMATE"
      - "engagement.labor_estimate_total_cents recomputed; deposit_required_cents recomputed (RENTAL)"

  - method: GET
    path: "/engagements/{id}/labor-calls"
    description: "List the engagement's labor calls (reverse lookup for LaborCall.engagement_id)."
    roles: [TechnicalDirector, FinanceController, ProgrammingDirector, RentalManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LaborCall[]
    side_effects: []

  - method: POST
    path: "/labor-calls/{id}/report-hours"
    description: "Report actual hours worked, applying overtime, doubletime and meal-penalty rules."
    roles: [TechnicalDirector]
    code: 200
    input: [actual_hours, meal_break_taken]
    output: LaborCall
    side_effects:
      - "status ESTIMATED -> WORKED; actual_cost_cents written by labor_cost ACTUAL"

  - method: POST
    path: "/engagements/{id}/price-tiers"
    description: "Add a pricing tier to the engagement's house."
    roles: [BoxOfficeManager]
    code: 201
    input: [tier_name, seats_allocated, base_price_cents, price_ceiling_cents, dynamic_pricing_enabled, subscription_eligible]
    output: PriceTier
    side_effects:
      - "engagement.ticketing_status TICKETING_UNSET -> TIERS_DRAFT on the first tier"
      - "available_qty computed as seats_allocated - sold_qty - subscription_held_qty"

  - method: GET
    path: "/engagements/{id}/price-tiers"
    description: "List the engagement's pricing tiers (reverse lookup for PriceTier.engagement_id)."
    roles: [BoxOfficeManager, FinanceController, ProgrammingDirector, RentalManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PriceTier[]
    side_effects: []

  - method: GET
    path: "/price-tiers/{id}"
    description: "Read a pricing tier with its live seat and revenue counters."
    roles: [BoxOfficeManager, FinanceController, ProgrammingDirector]
    code: 200
    input: []
    output: PriceTier
    side_effects: []

  - method: POST
    path: "/engagements/{id}/on-sale"
    description: "Put the engagement on sale."
    roles: [BoxOfficeManager]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "ticketing_status TIERS_DRAFT -> ON_SALE"
      - "projected_gross_cents and projected_margin_cents recomputed by engagement_margin PROJECTED"
      - "increments Engagement.version by 1"

  - method: POST
    path: "/price-tiers/{id}/ticket-sales"
    description: "Sell single tickets at the dynamic price."
    roles: [BoxOfficeManager]
    code: 201
    input: [qty, channel]
    output: TicketSale
    side_effects:
      - "sell_through_pct_at_sale, dynamic_multiplier_applied, unit_price_cents, gross_cents, restoration_fee_cents written by dynamic_single_ticket_price"
      - "tier.sold_qty, gross_cents, available_qty recomputed; engagement.realized_gross_cents recomputed (Engagement.version is NOT incremented by a ticket sale)"

  - method: GET
    path: "/price-tiers/{id}/ticket-sales"
    description: "List sales on a tier (reverse lookup for TicketSale.price_tier_id)."
    roles: [BoxOfficeManager, FinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TicketSale[]
    side_effects: []

  - method: POST
    path: "/subscription-packages"
    description: "Create a season subscription package spanning several presented engagements."
    roles: [BoxOfficeManager]
    code: 201
    input: [name, package_price_cents, included_engagement_ids, subscription_tier_name, seats_per_order]
    output: SubscriptionPackage
    side_effects:
      - "allocation_map written per single order by subscription_price_allocation"

  - method: POST
    path: "/subscription-packages/{id}/sell"
    description: "Sell subscription orders, holding seats and booking allocated revenue in every included engagement."
    roles: [BoxOfficeManager]
    code: 200
    input: [order_qty]
    output: SubscriptionPackage
    side_effects:
      - "sold_count increased by order_qty"
      - "each designated PriceTier.subscription_held_qty += seats_per_order * order_qty -> available_qty recomputed"
      - "each designated PriceTier.subscription_revenue_cents += allocation_map[engagement] * order_qty -> engagement.realized_gross_cents recomputed (Engagement.version is NOT incremented by a subscription sale)"

  - method: POST
    path: "/engagements/{id}/settlements"
    description: "Open the settlement; auto-advances the engagement to PERFORMED when the logical clock has passed performance_end_utc."
    roles: [FinanceController]
    code: 201
    input: []
    output: Settlement
    side_effects:
      - "lifecycle_status CONFIRMED -> PERFORMED (auto) with ticketing_status -> CLOSED and ACTIVE tiers closed"
      - "box_office_gross_cents, restoration_fees_cents, adjusted_gross_cents, guarantee_cents, actual_labor_cents, actual_equipment_cents frozen on the draft"
      - "increments Engagement.version by 1"

  - method: GET
    path: "/engagements/{id}/settlements"
    description: "List the engagement's settlement (reverse lookup for Settlement.engagement_id; 0 or 1 element)."
    roles: [FinanceController, ProgrammingDirector, RentalManager, RentalClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/settlements/{id}/reconcile-expenses"
    description: "Reconcile actual expenses and compute the split, the center's net and the reserve contribution."
    roles: [FinanceController]
    code: 200
    input: [actual_marketing_cents]
    output: Settlement
    side_effects:
      - "status DRAFT -> EXPENSES_RECONCILED"
      - "settlement_financials outputs written for the engagement type's variant"

  - method: POST
    path: "/settlements/{id}/finalize"
    description: "Finalize the settlement, sweep the reserve contribution and close the engagement."
    roles: [FinanceController]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "status -> FINALIZED; finalized_by_user_id written"
      - "engagement.lifecycle_status PERFORMED -> SETTLED; realized_margin_cents written"
      - "WORKED labor calls -> RECONCILED"
      - "SETTLEMENT_CONTRIBUTION reserve entry appended with balance_after_cents recomputed"
      - "PRESENTED: Artist.lifetime_guarantee_paid_cents increased; RENTAL: RentalClient.outstanding_balance_cents increased"
      - "increments Engagement.version by 1"

  - method: GET
    path: "/engagements/{id}/box-office-statement"
    description: "Computed box-office statement for the engagement."
    roles: [BoxOfficeManager, FinanceController]
    code: 200
    input: []
    output: "{ engagement_id: string, tier_count: integer, seats_allocated_total: integer, sold_qty_total: integer, subscription_held_qty_total: integer, single_ticket_gross_cents: integer, subscription_revenue_cents: integer, restoration_fees_cents: integer, box_office_gross_cents: integer, adjusted_gross_cents: integer }"
    side_effects: []

  - method: POST
    path: "/engagements/{id}/education-programs"
    description: "Attach an education or community program to a presented engagement and draw its subsidy from the reserve."
    roles: [ProgrammingDirector]
    code: 201
    input: [program_type, participant_capacity, subsidy_requested_cents]
    output: EducationProgram
    side_effects:
      - "subsidy_approved_cents written by education_subsidy_allowance"
      - "EDUCATION_SUBSIDY_DRAW reserve entry appended with amount_cents = -subsidy_approved_cents and balance_after_cents recomputed"

  - method: GET
    path: "/engagements/{id}/education-programs"
    description: "List the engagement's education programs (reverse lookup for EducationProgram.engagement_id)."
    roles: [ProgrammingDirector, FinanceController, CenterAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EducationProgram[]
    side_effects: []

  - method: POST
    path: "/reserve-ledger-entries"
    description: "Append a center-level reserve movement (opening balance or manual adjustment)."
    roles: [CenterAdmin]
    code: 201
    input: [entry_type, amount_cents, memo, "engagement_id?"]
    output: ReserveLedgerEntry
    side_effects:
      - "balance_after_cents computed as the running total over entries ordered by created_at ASC"

  - method: GET
    path: "/reserve-ledger-entries"
    description: "List every reserve movement, center-level and engagement-scoped, so the append-only ledger can be audited end to end."
    roles: [CenterAdmin, FinanceController]
    code: 200
    input: ["entry_type?", "engagement_id?", "limit?", "offset?"]
    output: ReserveLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/engagements/{id}/reserve-ledger-entries"
    description: "List reserve movements caused by this engagement (reverse lookup for ReserveLedgerEntry.engagement_id)."
    roles: [CenterAdmin, FinanceController]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: ReserveLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [CenterAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "logical clock repositioned; no entity is mutated"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed role acts on a resource whose owning FK differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Settlement finalization attempted by the same X-User-ID that accepted the engagement's fee"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement id in path or body does not exist"
  - id: ERR_SPACE_NOT_FOUND
    http: 404
    condition: "space_id does not exist"
  - id: ERR_PARTY_NOT_FOUND
    http: 404
    condition: "artist_id or rental_client_id does not exist"
  - id: ERR_DEPARTMENT_NOT_FOUND
    http: 404
    condition: "union_department_id does not exist"
  - id: ERR_EQUIPMENT_ITEM_NOT_FOUND
    http: 404
    condition: "equipment_item_id does not exist"
  - id: ERR_NEGOTIATION_NOT_FOUND
    http: 404
    condition: "fee negotiation id does not exist"
  - id: ERR_TECH_RIDER_NOT_FOUND
    http: 404
    condition: "tech rider id does not exist"
  - id: ERR_LABOR_CALL_NOT_FOUND
    http: 404
    condition: "labor call id does not exist"
  - id: ERR_PRICE_TIER_NOT_FOUND
    http: 404
    condition: "price tier id does not exist"
  - id: ERR_SUBSCRIPTION_PACKAGE_NOT_FOUND
    http: 404
    condition: "subscription package id does not exist"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "settlement id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, out-of-range number, or an inverted datetime ordering"
  - id: ERR_ENGAGEMENT_NOT_DRAFT
    http: 409
    condition: "Operation requires lifecycle_status DRAFT (confirm, open negotiation, counter, cancel-from-draft path)"
  - id: ERR_ENGAGEMENT_NOT_CONFIRMED
    http: 409
    condition: "Operation requires lifecycle_status CONFIRMED (on-sale, hours reporting)"
  - id: ERR_PERFORMANCE_NOT_COMPLETE
    http: 409
    condition: "Settlement opening attempted while the logical clock is before performance_end_utc, or the engagement is not CONFIRMED"
  - id: ERR_NEGOTIATION_NOT_OPEN
    http: 409
    condition: "Counter, revise or accept attempted on a round whose status is not the required OFFERED/COUNTERED value"
  - id: ERR_RIDER_INVALID_STATE
    http: 409
    condition: "Review attempted on an already reviewed rider, or clear attempted from a state other than CAPABLE/GAP_IDENTIFIED"
  - id: ERR_LABOR_CALL_INVALID_STATE
    http: 409
    condition: "Hours reported on a call whose status is not ESTIMATED"
  - id: ERR_SETTLEMENT_INVALID_STATE
    http: 409
    condition: "Reconcile attempted on a non-DRAFT settlement, finalize attempted on a settlement that is not EXPENSES_RECONCILED, or a labor call of the engagement is still ESTIMATED at reconcile time"
  - id: ERR_TICKETING_NOT_ON_SALE
    http: 409
    condition: "Sale attempted while the engagement's ticketing_status is not ON_SALE and the target PriceTier is still ACTIVE"
  - id: ERR_TIER_CLOSED
    http: 409
    condition: "Sale attempted on a PriceTier whose status is CLOSED. The tier-scoped check is evaluated before the engagement-scoped ticketing check, so a sale on a CLOSED tier of an engagement whose ticketing_status is also CLOSED returns this code rather than ERR_TICKETING_NOT_ON_SALE"
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not equal the stored Engagement.version"
  - id: ERR_ENGAGEMENT_TYPE_MISMATCH
    http: 422
    condition: "Operation or field combination does not match engagement_type (artist_id on a RENTAL, negotiation on a RENTAL, deposit on a PRESENTED, education program on a RENTAL, non-PRESENTED engagement inside a subscription package)"
  - id: ERR_SPACE_OFFLINE
    http: 422
    condition: "PerformanceSpace.status is OFFLINE"
  - id: ERR_SPACE_OCCUPANCY_CONFLICT
    http: 409
    condition: "Buffer-extended occupancy interval overlaps another engagement on the same hall"
  - id: ERR_ROUTING_WINDOW_VIOLATION
    http: 422
    condition: "Performance falls outside the artist's routing window or too close to another engagement of the same artist"
  - id: ERR_CALL_OUTSIDE_ENGAGEMENT_WINDOW
    http: 422
    condition: "Labor call interval is not contained in the engagement's load-in/load-out window"
  - id: ERR_CREW_CAPACITY_EXCEEDED
    http: 409
    condition: "Overlapping crew demand on a department exceeds roster_size"
  - id: ERR_SEAT_ALLOCATION_EXCEEDS_CAPACITY
    http: 422
    condition: "Sum of ACTIVE tier allocations exceeds hall capacity, or tier_name is duplicated within the engagement"
  - id: ERR_EQUIPMENT_STOCK_UNAVAILABLE
    http: 409
    condition: "Requested equipment qty exceeds on_hand_qty minus reserved_qty"
  - id: ERR_TIER_SOLD_OUT
    http: 409
    condition: "Requested seats exceed available_qty on a tier (single sale or subscription hold)"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 422
    condition: "Round limit (3 per engagement) or revision limit (2 per round) reached"
  - id: ERR_DUPLICATE_TECH_RIDER
    http: 409
    condition: "Engagement already has a TechRider row"
  - id: ERR_DUPLICATE_SETTLEMENT
    http: 409
    condition: "Engagement already has a Settlement row"
  - id: ERR_GUARANTEE_BELOW_FLOOR
    http: 422
    condition: "Offered or revised guarantee is below the artist's guarantee_floor_cents"
  - id: ERR_GAP_NOT_COVERED
    http: 409
    condition: "Rider clear attempted while a capability gap other than RIGGING_NEAR_LIMIT has no matching RESERVED equipment line"
  - id: ERR_CLEARANCE_REQUIRED
    http: 422
    condition: "Confirmation attempted while financial_clearance is UNASSESSED or ESCALATED"
  - id: ERR_CLEARANCE_BLOCKED
    http: 422
    condition: "Confirmation or fee-negotiation acceptance attempted while financial_clearance is BLOCKED"
  - id: ERR_RESERVE_INSUFFICIENT
    http: 402
    condition: "Education subsidy draw would push the reserve below EDUCATION_RESERVE_FLOOR_CENTS"
  - id: ERR_DEPOSIT_SHORTFALL
    http: 402
    condition: "RENTAL confirmation attempted with deposit_paid_cents below deposit_required_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CenterAdmin
    description: "Facility operator: halls, union rate cards, inventory, reserve movements and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /performance-spaces"
      - "POST /union-departments"
      - "POST /equipment-items"
      - "POST /reserve-ledger-entries"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /performance-spaces/{id}"
      - "GET /engagements/{id}"
      - "GET /engagements"
      - "GET /union-departments/{id}"
      - "GET /union-departments/{id}/labor-calls"
      - "GET /equipment-items/{id}"
      - "GET /equipment-items/{id}/rental-lines"
      - "GET /tech-riders/{id}/equipment-lines"
      - "GET /engagements/{id}/education-programs"
      - "GET /engagements/{id}/reserve-ledger-entries"

  - name: ProgrammingDirector
    description: "Curates the presented season: artists, presented engagements, fee offers, education programs."
    identity: opaque
    exclusive_operations:
      - "POST /artists"
      - "POST /engagements/{id}/fee-negotiations"
      - "POST /fee-negotiations/{id}/revise-offer"
      - "POST /engagements/{id}/education-programs"
    shared_operations:
      - "POST /engagements"
      - "POST /engagements/{id}/confirm"
      - "POST /engagements/{id}/cancel"
      - "POST /fee-negotiations/{id}/accept"
      - "GET /performance-spaces/{id}"
      - "GET /artists/{id}"
      - "GET /engagements/{id}"
      - "GET /engagements"
      - "GET /engagements/{id}/fee-negotiations"
      - "GET /engagements/{id}/tech-riders"
      - "GET /tech-riders/{id}"
      - "GET /tech-riders/{id}/equipment-lines"
      - "GET /engagements/{id}/labor-calls"
      - "GET /engagements/{id}/price-tiers"
      - "GET /price-tiers/{id}"
      - "GET /engagements/{id}/settlements"
      - "GET /engagements/{id}/education-programs"

  - name: RentalManager
    description: "Sells and administers hall rentals: rental clients, rental engagements, deposits."
    identity: opaque
    exclusive_operations:
      - "POST /rental-clients"
    shared_operations:
      - "POST /engagements"
      - "POST /engagements/{id}/record-deposit"
      - "POST /engagements/{id}/confirm"
      - "POST /engagements/{id}/cancel"
      - "GET /performance-spaces/{id}"
      - "GET /rental-clients/{id}"
      - "GET /engagements/{id}"
      - "GET /engagements"
      - "GET /engagements/{id}/tech-riders"
      - "GET /tech-riders/{id}"
      - "GET /tech-riders/{id}/equipment-lines"
      - "GET /engagements/{id}/labor-calls"
      - "GET /engagements/{id}/price-tiers"
      - "GET /engagements/{id}/settlements"

  - name: ArtistRepresentative
    description: "Agency side of a presented deal; X-User-ID is the Artist row it represents."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /fee-negotiations/{id}/counter"
    shared_operations:
      - "POST /engagements/{id}/tech-riders"
      - "POST /fee-negotiations/{id}/accept"
      - "GET /artists/{id}"
      - "GET /engagements/{id}"
      - "GET /engagements/{id}/fee-negotiations"
      - "GET /engagements/{id}/tech-riders"
      - "GET /tech-riders/{id}"

  - name: RentalClientContact
    description: "Renting organization's contact; X-User-ID is the RentalClient row it represents."
    identity: "entity_backed:RentalClient"
    exclusive_operations: []
    shared_operations:
      - "POST /engagements/{id}/tech-riders"
      - "POST /engagements/{id}/record-deposit"
      - "GET /rental-clients/{id}"
      - "GET /engagements/{id}"
      - "GET /engagements/{id}/tech-riders"
      - "GET /tech-riders/{id}"
      - "GET /engagements/{id}/settlements"

  - name: TechnicalDirector
    description: "Production department head: rider capability review, equipment reservations, union labor calls."
    identity: opaque
    exclusive_operations:
      - "POST /tech-riders/{id}/review"
      - "POST /tech-riders/{id}/equipment-lines"
      - "POST /tech-riders/{id}/clear"
      - "POST /engagements/{id}/labor-calls"
      - "POST /labor-calls/{id}/report-hours"
    shared_operations:
      - "GET /performance-spaces/{id}"
      - "GET /engagements/{id}"
      - "GET /engagements/{id}/tech-riders"
      - "GET /tech-riders/{id}"
      - "GET /tech-riders/{id}/equipment-lines"
      - "GET /engagements/{id}/labor-calls"
      - "GET /union-departments/{id}"
      - "GET /union-departments/{id}/labor-calls"
      - "GET /equipment-items/{id}"
      - "GET /equipment-items/{id}/rental-lines"

  - name: BoxOfficeManager
    description: "Owns ticketing: price tiers, on-sale, single-ticket sales, subscription packages."
    identity: opaque
    exclusive_operations:
      - "POST /engagements/{id}/price-tiers"
      - "POST /engagements/{id}/on-sale"
      - "POST /price-tiers/{id}/ticket-sales"
      - "POST /subscription-packages"
      - "POST /subscription-packages/{id}/sell"
    shared_operations:
      - "GET /performance-spaces/{id}"
      - "GET /engagements/{id}"
      - "GET /engagements"
      - "GET /engagements/{id}/price-tiers"
      - "GET /price-tiers/{id}"
      - "GET /price-tiers/{id}/ticket-sales"
      - "GET /engagements/{id}/box-office-statement"

  - name: FinanceController
