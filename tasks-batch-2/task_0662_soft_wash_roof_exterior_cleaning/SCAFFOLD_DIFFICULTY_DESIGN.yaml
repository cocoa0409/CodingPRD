  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_interval_overlap_half_open_with_travel_buffer
        grounds:
          - validations[priority=12]
          - entities.CrewAssignment.fields.window_start_utc
          - entities.Route.fields.travel_buffer_minutes
          - errors[ERR_TECH_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource Technician, HALF-OPEN [start,end) interval semantics PADDED by Route.travel_buffer_minutes:
          tech CONFIRMED 14:00-16:00 on a 30-min-buffer route; a second assignment starting 16:15 (within the
          16:00+30min=16:30 buffer) collides → ERR_TECH_DOUBLE_BOOKED. A start at exactly 16:30 would NOT collide
          (half-open + buffer). Distinct interval arithmetic and resource from the WeatherWindow rule.
        test_recipe:
          setup:
            - "Tech CONFIRMED on visit A 14:00-16:00 (120 min) on a route with travel_buffer_minutes=30; a second SCHEDULED visit B same day."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Dispatcher
            - call: "POST /customers"
              payload: { full_name: "OV Owner", email: "ov@x.com", credit_limit_cents: 100000000 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "OV Zone", travel_buffer_minutes: 30 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "OV Tech", ladder_cert_max_stories: 3, insurance_status: "ACTIVE" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /weather-windows"
              payload: { route_id: "${route_id}", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-05-01T23:59:59Z", wind_mph: 5 }
              as: Dispatcher
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "16 Oak", stories: 2, roof_sqft: 2000 }
              as: Dispatcher
              captures: { propA_id: $.data.id, propA_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${propA_id}", soiling_level: "MODERATE", expected_property_version: "${propA_v}" }
              as: Dispatcher
              captures: { qA_id: $.data.id }
            - call: "POST /quotes/${qA_id}/line-items"
              payload: { surface_type: "ROOF", service_type: "ROOF_SOFT_WASH", measured_sqft: 2000 }
              as: Dispatcher
            - call: "POST /quotes/${qA_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${qA_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "17 Oak", stories: 2, roof_sqft: 2000 }
              as: Dispatcher
              captures: { propB_id: $.data.id, propB_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${propB_id}", soiling_level: "MODERATE", expected_property_version: "${propB_v}" }
              as: Dispatcher
              captures: { qB_id: $.data.id }
            - call: "POST /quotes/${qB_id}/line-items"
              payload: { surface_type: "ROOF", service_type: "ROOF_SOFT_WASH", measured_sqft: 2000 }
              as: Dispatcher
            - call: "POST /quotes/${qB_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${qB_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /visits"
              payload: { property_id: "${propA_id}", quote_id: "${qA_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { vA_id: $.data.id, vA_v: $.data.version }
            - call: "POST /visits/${vA_id}/schedule"
              payload: { expected_visit_version: "${vA_v}" }
              as: Dispatcher
            - call: "POST /crew-assignments"
              payload: { visit_id: "${vA_id}", technician_id: "${tech_id}", window_start_utc: "2026-05-01T14:00:00Z" }
              as: Dispatcher
              captures: { asgA_id: $.data.id }
            - call: "POST /crew-assignments/${asgA_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /visits"
              payload: { property_id: "${propB_id}", quote_id: "${qB_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { vB_id: $.data.id, vB_v: $.data.version }
            - call: "POST /visits/${vB_id}/schedule"
              payload: { expected_visit_version: "${vB_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /crew-assignments"
              payload: { visit_id: "${vB_id}", technician_id: "${tech_id}", window_start_utc: "2026-05-01T16:15:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == ERR_TECH_DOUBLE_BOOKED"
            - "A second start at exactly 2026-05-01T16:30:00Z (buffer boundary) would NOT collide"

      - name: weather_window_overlap_closed_interval_touching_endpoints_collide
        grounds:
          - validations[priority=10]
          - entities.WeatherWindow.fields.window_start_utc
          - entities.WeatherWindow.fields.window_end_utc
          - errors[ERR_WEATHER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          DIFFERENT resource (WeatherWindow on a Route) and DIFFERENT interval semantics: CLOSED interval
          [start,end] where touching endpoints COLLIDE. Existing window [10:00,12:00]; a new window starting at
          exactly 12:00 shares the endpoint and is rejected ERR_WEATHER_WINDOW_OVERLAP — opposite of the
          half-open buffered tech rule.
        test_recipe:
          setup:
            - "Route with one existing WeatherWindow covering 2026-05-01T10:00 to 12:00."
          setup_api_calls:
            - call: "POST /routes"
              payload: { name: "WW Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /weather-windows"
              payload: { route_id: "${route_id}", window_start_utc: "2026-05-01T10:00:00Z", window_end_utc: "2026-05-01T12:00:00Z", wind_mph: 5 }
              as: Dispatcher
              captures: { ww1_id: $.data.id }
          trigger:
            - call: "POST /weather-windows"
              payload: { route_id: "${route_id}", window_start_utc: "2026-05-01T12:00:00Z", window_end_utc: "2026-05-01T14:00:00Z", wind_mph: 5 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == ERR_WEATHER_WINDOW_OVERLAP"
            - "A new window starting at 2026-05-01T12:00:01Z (1s after the closed end) would be accepted"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tech_minutes_conserved_reserve_then_release
        grounds:
          - state_machines.CrewAssignment.RESERVED_to_RELEASED
          - entities.Technician.fields.scheduled_minutes
          - calculations.technician_risk_score
        distinguishing_aspect: |
          Conserved quantity = Technician.scheduled_minutes (TIME). Forward (reserve, +120) paired with its
          compensation (release, -120) MUST leave scheduled_minutes exactly equal to its pre-reserve value (0):
          0 → 120 → 0, pinned as scheduled_minutes == sum(duration_minutes over RESERVED/CONFIRMED).
        test_recipe:
          setup:
            - "A SCHEDULED visit (120 min) and a fresh Tech with scheduled_minutes 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
