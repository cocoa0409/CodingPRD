              as: RefundAdjuster
              captures: { batch_mixed: $.data.batch_total_cents }
          assert:
            - "each failure's ${fail_r1_amount} == 96270 — gross round_half_up(250.050*550) == 137528, provisional round_half_up(137528*0.70) == round_half_up(96269.6) == 96270"
            - "the pinned round-each-then-sum batch total ${batch_provisional} == 192540"
            - "the forbidden sum-then-round reading gives round_half_up(275056*0.70) == round_half_up(192539.2) == 192539, so ${batch_provisional} != 192539"
            - "after finalizing ${fail_r1} the mixed batch total ${batch_mixed} == 233798 (137528 finalized plus 96270 provisional)"
            - "ServiceFailure.${fail_r2}.status == OPEN and ServiceFailure.${fail_r2}.refund_amount_cents == 96270"

      - name: forward_capacity_tier_derives_from_raw_value_and_override_is_discarded
        grounds:
          - calculations.forward_capacity
          - entities.LoadMove.fields.forward_capacity_grams
          - entities.LoadMove.fields.load_plan_tier
          - endpoints.POST_/airhub/moves/{move_id}/load-package
        distinguishing_aspect: "Mode (c): the tier label is derived from the RAW forward capacity while the displayed capacity is floored at zero, so a move overbooked by 5000 grams reads forward_capacity_grams 0 and load_plan_tier RESERVE_TIER on the same read, and a manual tier override is discarded by the next recompute."
        test_recipe:
          setup:
            - "Clock 1450. SDF hub, BANK_A with N701UP landed and unloaded, load move M1 (weight_limit_grams 100000) on N702UP, destination buildup G1 (container_limit_grams 70000, hazardous_cap_grams 0) on M1, shift N-A, two GENERAL packages weighing 50000 and 55000 grams, both inducted and secondary-sorted."
