        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One QUOTED policy with a SCHEDULED_EQUIPMENT part and one RATED excavator, so the last trigger's two loss subjects both resolve and only the arity is wrong."
