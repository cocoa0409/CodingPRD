            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a1_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a1_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2026-04-10T05:50:00Z" }
              as: StationManager
