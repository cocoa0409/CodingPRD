          assert:
            - "NoticeOfViolation.${notice_1}.cure_deadline_at == 2026-09-30T00:00:00Z (served_at + 60 days) and cure_eligible == true"
            - "first trigger call: HTTP 409 with error_id ERR_NO_VIOLATION_WINDOW and no Settlement row created"
            - "fourth trigger call: HTTP 201 and Settlement.${stl_1}.violation_days == 1"
            - "Settlement.${stl_1}.base_penalty_cents == 250000 (min(250000 x 1, 500 x 4000) - the day measure now binds), mitigation_factor == 1.0000, adjusted_penalty_cents == 250000"
            - "Settlement.${stl_1}.fee_cap_cents == 250000 (adjusted penalty is in the 100000..999999 tier, multiplier 1.00), allowed_fees_cents == 250000 despite 300000 requested"
            - "Settlement.${stl_1}.state_share_cents == 187500, noticing_party_share_cents == 62500, total_settlement_cents == 500000"

      - name: val_indemnity_cap_checked_only_when_warranty_defense_applied
        claim_type: conditional_validation
        grounds:
          - validations[priority=91]
          - errors[ERR_INDEMNITY_CAP_EXCEEDED]
          - calculations.settlement_money
        distinguishing_aspect: |
          The cap check is conditional on the settlement having actually taken the warranty
          mitigation. Product A's supplier has pass_through_warning_obligation true, so the defense
          applies (mitigation_factor 0.6000, adjusted penalty 1200000) and the 1000000 indemnity cap
          is exceeded - ACCEPT_EXECUTE is refused. Product B's supplier is identical except
          pass_through_warning_obligation false, so no defense applies: the adjusted penalty is the
          full 2000000, which overshoots the same 1000000 cap by even more, yet ACCEPT_EXECUTE
          succeeds because the rule does not apply. A cap check that ignored the condition would
          reject the second case too.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED; the clock is 2026-08-01T00:00:00Z throughout."
            - "Supplier A: warranty ACTIVE, scope ALL_MATERIALS, pass_through_warning_obligation true, indemnity_cap_cents 1000000, window from 2026-01-01 with no end."
            - "Supplier B: identical except pass_through_warning_obligation false."
            - "Products SKU-IND-A and SKU-IND-B each have annual_units 4000 and one ACTIVE component of their own supplier's material; both notices are served 2026-07-01 with earliest_violation_date 2026-05-01 and are escalated to SETTLEMENT_NEGOTIATION with a PROPOSED settlement requesting 500000 in fees."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Alpha Warranty Chemicals", contact_email: "a@alpha.example", warranty_scope: "ALL_MATERIALS", pass_through_warning_obligation: true, indemnity_cap_cents: 1000000, warranty_effective_from: "2026-01-01T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { sup_a: $.data.id }
            - call: "POST /suppliers/${sup_a}/transitions"
              payload: { action: "EXECUTE_WARRANTY" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /suppliers"
              payload: { legal_name: "Beta No Passthrough Chemicals", contact_email: "b@beta.example", warranty_scope: "ALL_MATERIALS", pass_through_warning_obligation: false, indemnity_cap_cents: 1000000, warranty_effective_from: "2026-01-01T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { sup_b: $.data.id }
            - call: "POST /suppliers/${sup_b}/transitions"
              payload: { action: "EXECUTE_WARRANTY" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /materials"
              payload: { material_code: "RM-A", material_class: "RAW_MATERIAL", supplier_id: "${sup_a}" }
              as: ComplianceAnalyst
              captures: { mat_a: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-B", material_class: "RAW_MATERIAL", supplier_id: "${sup_b}" }
              as: ComplianceAnalyst
              captures: { mat_b: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-IND-A", product_name: "Indemnity A", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 4000 }
              as: RegistryAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /products/${prod_a}/components"
              payload: { material_id: "${mat_a}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-IND-B", product_name: "Indemnity B", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 4000 }
              as: RegistryAdmin
              captures: { prod_b: $.data.id }
            - call: "POST /products/${prod_b}/components"
              payload: { material_id: "${mat_b}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /notices"
              payload: { product_id: "${prod_a}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Watch Alliance", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-05-01T00:00:00Z", served_at: "2026-07-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { notice_a: $.data.id }
            - call: "POST /notices/${notice_a}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_a}/transitions"
              payload: { action: "ESCALATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${notice_a}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_a: $.data.version }
            - call: "POST /notices/${notice_a}/settlements"
              payload: { requested_attorney_fees_cents: 500000, expected_notice_version: "${nv_a}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { stl_a: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_b}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Watch Alliance", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-05-01T00:00:00Z", served_at: "2026-07-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { notice_b: $.data.id }
            - call: "POST /notices/${notice_b}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_b}/transitions"
              payload: { action: "ESCALATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${notice_b}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_b: $.data.version }
            - call: "POST /notices/${notice_b}/settlements"
              payload: { requested_attorney_fees_cents: 500000, expected_notice_version: "${nv_b}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { stl_b: $.data.id }
          trigger:
            - call: "POST /settlements/${stl_a}/transitions"
              payload: { action: "ACCEPT_EXECUTE" }
              as: RegulatoryCounsel
              as_user_id: "rc_2"
            - call: "POST /settlements/${stl_b}/transitions"
              payload: { action: "ACCEPT_EXECUTE" }
