  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_half_open_interval_allows_adjacency_rejects_intersection
        grounds:
          - validations.priority_38
          - errors.ERR_SHIFT_OVERLAP
          - entities.Shift.fields.start_at
          - entities.Shift.fields.end_at
          - complexity_profile.temporal_dimension
        distinguishing_aspect: >-
          The Shift interval is half-open, so the boundary case and the failing case are one hour
          apart on the same clock: a shift beginning exactly when the previous one ends is lawful
          because the endpoints only touch, while a shift beginning one hour earlier genuinely
          intersects and is refused. An implementation using closed intervals would reject the
          adjacency; one using date-only comparison would reject both.
        test_recipe:
          setup:
            - "One Texas location, one assigned SERVER employee, and one existing shift on 2026-08-04 running 16:00 to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_1: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-05T00:00:00Z", start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-05T04:00:00Z" }
              as: PayrollPreparer
              captures: { adjacent_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T23:00:00Z", end_at: "2026-08-05T02:00:00Z" }
              as: PayrollPreparer
              captures: { err: $.data.error_id }
          assert:
            - "the first trigger call returns 201 with scheduled_minutes 240, because [16:00, 00:00) and [00:00, 04:00) only touch at the endpoint"
            - "the second trigger call returns 409 with data.error_id == ERR_SHIFT_OVERLAP"
            - "GET /shifts?employee_id=${emp_id} returns exactly 2 rows, ${shift_1} and ${adjacent_id}"
            - "voiding ${adjacent_id} and then re-posting the rejected 23:00 to 02:00 payload still returns ERR_SHIFT_OVERLAP, because the surviving ${shift_1} interval is intersected too and only non-VOIDED shifts are ignored"

      - name: pay_period_inclusive_date_interval_rejects_any_shared_day
        grounds:
          - validations.priority_39
          - validations.priority_43
          - errors.ERR_PAY_PERIOD_OVERLAP
          - entities.PayPeriod.fields.start_date
          - entities.PayPeriod.fields.end_date
        distinguishing_aspect: >-
          A second overlap rule on a different resource with the opposite interval convention: the
          PayPeriod interval is closed and inclusive, so sharing the single day 2026-08-09 is already
          fatal, while the very next start date is fine. Both candidate weeks are exactly seven days
          long, so the length rule at priority 43 stays silent and the overlap rule is unambiguously
          the one under test.
        test_recipe:
          setup:
            - "One Texas location with one existing pay period covering 2026-08-03 to 2026-08-09 inclusive."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_1: $.data.id }
          trigger:
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }
              as: PayrollPreparer
              captures: { err: $.data.error_id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-16T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_2: $.data.id }
          assert:
            - "the first trigger call returns 409 with data.error_id == ERR_PAY_PERIOD_OVERLAP, the single shared day 2026-08-09 being enough"
            - "the first trigger call does not return ERR_PAY_PERIOD_LENGTH, since 2026-08-09 to 2026-08-15 is exactly start plus six days"
            - "the second trigger call returns 201 with status OPEN and every rollup zero"
            - "GET /pay-periods?location_id=${loc_id} returns exactly 2 rows, ${period_1} and ${period_2}"

  - rule_id: compensating_invariant
    instances:
      - name: pool_distribute_then_reverse_conserves_declared_tips
        grounds:
          - state_machines.ShiftTipPool.contribution_status.CONTRIBUTED_to_REVERSED
          - calculations.shift_pool_contribution
          - calculations.pool_distribution
          - entities.PoolAllocation.fields.entry_type
          - entities.Shift.fields.retained_tips_cents
          - entities.Location.fields.pending_pool_cents
        distinguishing_aspect: >-
          The conserved quantity is money: the 48040 cents of tips the three shifts declared must
          equal retained tips plus the card fee plus the net pool at every observable moment, and the
          reversal restores the pre-pool distribution of that same 48040 without deleting a single
          ledger row. The compensation is additive rather than destructive, so the invariant is
          checked twice against the same total and once against the signed ledger, whose net must be
          exactly zero.
        test_recipe:
          setup:
            - "The canonical Texas pool world: an ACTIVE TIPPED_ONLY / TIPS_RECEIVED_PCT / HOURS_WEIGHTED_POINTS policy with cc_fee_pass_through true at an ACTUAL_ONLY location, three CLOSED and DECLARED shifts on 2026-08-04 of 480, 480 and 360 minutes at cc_processing_fee_bps 250 declaring 34020, 14020 and 0 cents."
            - "The pool for 2026-08-04 has been created but not yet distributed, and the pay period has deliberately NOT been computed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Plano Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "TIPS" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_version: $.data.version }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "BARTENDER", title: "Bartender", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1000, pool_share_points: 8, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_bar_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "BUSSER", title: "Busser", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 0, pool_share_points: 5, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_bus_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Sam Server", external_payroll_ref: "V1" }
              as: PayrollAdmin
              captures: { emp_s: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Bea Bartender", external_payroll_ref: "V2" }
              as: PayrollAdmin
              captures: { emp_b: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Cal Busser", external_payroll_ref: "V3" }
              as: PayrollAdmin
              captures: { emp_c: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_s}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_b}", job_role_id: "${role_bar_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_c}", job_role_id: "${role_bus_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "HOURS_WEIGHTED_POINTS", cc_fee_pass_through: true }
              as: PayrollAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_id}/activate"
              payload: { expected_location_version: "${loc_version}" }
              as: ComplianceOfficer
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_s}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 120000, charged_sales_cents: 90000, cc_processing_fee_bps: 250 }
              as: PayrollPreparer
              captures: { shift_s: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_b}", location_id: "${loc_id}", job_role_id: "${role_bar_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 60000, charged_sales_cents: 40000, cc_processing_fee_bps: 250 }
              as: PayrollPreparer
              captures: { shift_b: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_c}", location_id: "${loc_id}", job_role_id: "${role_bus_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-04T22:00:00Z", cc_processing_fee_bps: 250 }
              as: PayrollPreparer
              captures: { shift_c: $.data.id }
            - call: "POST /shifts/${shift_s}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_b}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_c}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_s}/declare-tips"
              payload: { declared_cash_tips_cents: 4000, declared_charged_tips_cents: 30020 }
              as: Employee
              as_user_id: "${emp_s}"
            - call: "POST /shifts/${shift_b}/declare-tips"
              payload: { declared_cash_tips_cents: 2000, declared_charged_tips_cents: 12020 }
              as: Employee
              as_user_id: "${emp_b}"
            - call: "POST /shifts/${shift_c}/declare-tips"
              payload: { declared_cash_tips_cents: 0, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_c}"
            - call: "POST /shift-tip-pools"
              payload: { location_id: "${loc_id}", business_date: "2026-08-04T00:00:00Z" }
              as: PayrollPreparer
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /shift-tip-pools/${pool_id}/distribute"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shift-tip-pools/${pool_id}/reverse"
              payload: { reason: "card fee wrongly passed through" }
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
          assert:
            - "after the distribute the three shifts report retained_tips_cents 28917, 12618 and 0, summing to 41535, and 41535 + 1052 of card fee + 5453 of net pool == 48040, exactly the tips declared"
            - "after the reverse the three shifts report retained_tips_cents 34020, 14020 and 0, summing to 48040 again, with cc_fee_deducted_cents 0 and net_pool_cents 0, so the identity closes on 48040 + 0 + 0"
            - "the signed sum of PoolAllocation.allocated_cents over the pool is 0 after the reverse, the three DISTRIBUTION rows of 2508, 2005 and 940 being cancelled by three REVERSAL rows of -2508, -2005 and -940"
            - "GET /pool-allocations?shift_tip_pool_id=${pool_id}&entry_type=DISTRIBUTION still returns three rows with their original amounts, so compensation never rewrites history"
            - "Location.${loc_id}.pending_pool_cents == 6505 before the distribute and 0 after both trigger calls"
            - "PayPeriod.${period_id}.status is OPEN throughout and GET /pay-lines?pay_period_id=${period_id} returns 0 rows, because this instance never computed the week"

      - name: shift_create_close_then_void_conserves_credited_minutes
        grounds:
          - state_machines.Shift.time_status.CLOSED_to_VOIDED
          - entities.PayPeriod.fields.total_credited_minutes
          - entities.PayPeriod.fields.gross_receipts_cents
          - entities.Shift.fields.scheduled_minutes
          - endpoints.POST_/shifts/{shift_id}/void
        distinguishing_aspect: >-
          A second conserved quantity of a different kind, time rather than money, and a
          compensation that runs through a terminal state instead of a reversible one. The period's
          minute and receipt rollups must return to the exact zero they started from, while the
          voided Shift keeps scheduled_minutes 480 and its declared tips on the record: the rollups
          are compensated, the audit row is not erased.
        test_recipe:
          setup:
            - "One Texas location with one assigned SERVER employee and an OPEN pay period covering 2026-08-03 to 2026-08-09 whose rollups are all zero."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 120000, charged_sales_cents: 0 }
              as: PayrollPreparer
              captures: { shift_id: $.data.id }
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 1000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /shifts/${shift_id}/void"
              payload: { reason: "shift belonged to another employee" }
              as: PayrollPreparer
          assert:
            - "immediately after the create PayPeriod.${period_id}.total_credited_minutes == 0 and gross_receipts_cents == 0, because an OPEN shift is not yet credited time"
            - "after the close PayPeriod.${period_id}.total_credited_minutes == 480 and gross_receipts_cents == 120000"
            - "after the declare PayPeriod.${period_id}.total_credited_minutes is still 480 and Shift.${shift_id}.retained_tips_cents == 1000, there being no pool to contribute to"
            - "after the void PayPeriod.${period_id}.total_credited_minutes == 0 and gross_receipts_cents == 0, back to the values the period was created with"
            - "Shift.${shift_id}.time_status == VOIDED with tip_credit_eligible_minutes 0, non_tip_credit_minutes 0 and retained_tips_cents 0, yet scheduled_minutes is still 480, declared_cash_tips_cents still 1000 and declaration_count still 1"
            - "GET /pay-lines?pay_period_id=${period_id} returns 0 rows and PayPeriod.${period_id}.status is still OPEN, so nothing downstream was created and then had to be unwound"
