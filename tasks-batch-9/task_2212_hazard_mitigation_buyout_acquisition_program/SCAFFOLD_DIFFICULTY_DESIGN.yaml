          - validations.priority_36
          - validations.priority_48
          - validations.priority_31
          - endpoints.POST_demolition-work-orders_work_order_id_start
          - state_machines.DemolitionWorkOrder.ISSUED_to_UTILITY_HOLD
        distinguishing_aspect: |
          PAIR B, declared on POST /demolition-work-orders/{work_order_id}/start: priority 31
          deliberately ADMITS UTILITY_HOLD as a legal from-state so that both priority 36
          (asbestos_survey_status is NOT_PERFORMED) and priority 48 (only WATER is CONFIRMED, so
          ELECTRIC, GAS and SEWER are missing) are live on the same request. The 422 safety check
          must beat the 409 readiness check - the reverse ordering is the natural one to implement,
          which is exactly why it is pinned here.
        test_recipe:
          setup:
            - "One MitigationProject in DRAFT with one parcel and one ACTIVE asbestos-certified DemolitionContractor."
            - "One DemolitionWorkOrder with asbestos_survey_status NOT_PERFORMED whose only UtilityDisconnection child, WATER, is CONFIRMED, so the work order sits in UTILITY_HOLD."
