              captures: { ent_id: $.data.id }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_id}", reason: "Unapproved additive" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /registry/entries/${ent_id}/release"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (http 403) — EntryReviewer may release PENDING entries but not DETAINED ones"
            - "ImportEntry.${ent_id}.disposition_status remains DETAINED"

      - name: class_i_recall_blocks_entry_but_initiated_does_not
        claim_type: cross_entity_validation
        grounds:
          - calculations.active_recall_gate
          - validations[priority=6]
          - errors.ERR_ACTIVE_RECALL_BLOCKS_ENTRY
        distinguishing_aspect: "The safety gate keys on recall state: an INITIATED (unclassified) recall does not block entry filing for the same facility + product_code, but once classified CLASS_I the same filing fails 422 ERR_ACTIVE_RECALL_BLOCKS_ENTRY, while a different product_code still passes."
        test_recipe:
          setup:
            - "Default clock; DOMESTIC facility U; importer; recall RC on (U, PC-BBY-01) created INITIATED"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Wisconsin Dairy Co", facility_kind: "DOMESTIC", country_code: "US", ufi: "UFI-US-2305" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Evergreen Imports", account_code: "IMP-2305" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/recalls"
              payload: { facility_id: "${fac_id}", product_code: "PC-BBY-01", quantity_distributed: 200 }
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { rec_id: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-BBY-01", product_risk_class: "STANDARD", transport_mode: "ROAD", arrival_eta: "2026-09-01T06:00:00Z", declared_units: 10, unit_value_cents: 100, port_code: "US-MSP" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_pre: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_pre}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_pre: $.data.id }
            - call: "POST /registry/recalls/${rec_id}/classify"
              payload: { classification: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "rc-1"
          trigger:
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-BBY-01", product_risk_class: "STANDARD", transport_mode: "ROAD", arrival_eta: "2026-09-01T08:00:00Z", declared_units: 10, unit_value_cents: 100, port_code: "US-MSP" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_post: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_post}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { err_blocked: $.data.error_id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-BBY-99", product_risk_class: "STANDARD", transport_mode: "ROAD", arrival_eta: "2026-09-01T08:00:00Z", declared_units: 10, unit_value_cents: 100, port_code: "US-MSP" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_other: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_other}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_other: $.data.id }
          assert:
            - "before classification (INITIATED): entry ${ent_pre} created 201 — the gate is inactive"
            - "after CLASS_I classification: err_blocked == ERR_ACTIVE_RECALL_BLOCKS_ENTRY (http 422) for the same facility + product_code"
            - "different product_code on the same facility still files: ImportEntry.${ent_other}.review_status == PENDING_SCREENING"

