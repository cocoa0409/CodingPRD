scenario: |
  Generate task harder than expert level!

  2554. School Crossing Guard & Safe Routes to School (municipal school crossing program): intersection warrant analysis using pedestrian counts, gaps in traffic and crash history, guard post assignment, staffing coverage and substitute dispatch for absences, guard training, certification and equipment issuance, route planning with recommended walking routes and hazard mapping, seasonal schedule alignment with the school calendar including early dismissals, complaint intake on speeding and near-miss events with engineering referrals, grant-funded infrastructure project prioritization, program evaluation on walking/biking mode share
domain_name: school-crossing-safe-routes
api_prefix: "/srts"

complexity_profile:
  primary_archetype: Quota / allocation
  secondary_archetype: Temporal windowing
  complexity_layers:
    - Optimistic concurrency
    - Cascading side effects
    - Selector policy
    - Rate / threshold triggers

  entity_topology: graph
  # Junction entities (PostAssignment joins Guard x GuardPost; InfrastructureProject joins
  # GrantProgram x Intersection x Complaint) plus cross-aggregate references
  # (AbsenceReport -> PostAssignment + Guard) make the reference set a graph rather than a
  # tree. Most collections are addressed flat (`/srts/post-assignments`,
  # `/srts/absence-reports`, `/srts/infrastructure-projects`) with foreign keys in the body.

  state_machine_shape: cyclic
  # WarrantStudy loops ANALYZED/NOT_WARRANTED/CONDITIONAL -> COUNTING (recount + appeal),
  # AbsenceReport loops OFFER_OUT -> DISPATCH_PENDING -> OFFER_OUT (re-offer rounds),
  # InfrastructureProject loops FUNDED -> SCORED (funding withdrawal) and
  # DEFERRED -> SCORED (pool replenished), WalkingRoute loops PUBLISHED -> ADVISORY_HOLD ->
  # PUBLISHED, GuardPost loops ACTIVE -> SUSPENDED -> ACTIVE. Guard additionally carries two
  # independent state dimensions (certification_status x duty_status) on the same row.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The TrafficEngineer who authored a WarrantStudy may not be the TrafficEngineer who
  # finalizes its determination (WarrantStudy.authored_by_user_id != X-User-ID at finalize).
  # Scoring a grant project (TrafficEngineer) and awarding money to it (ProgramAdmin) are
  # also split across roles.

  consistency_model: immediate
  # Every derived field is recomputed inside the same request that mutates its source data.
  # The two clock-dependent derived fields (Guard.reliability_score_rolling_90d and
  # AbsenceReport offer expiry) are additionally re-evaluated at read time against the
  # logical clock, and never against real wall-clock time.

  difficulty_level: expert_plus
  # 11 entities / 50 endpoints (19 GET, 31 POST) / 59 error codes / 35 validation rules /
  # 10 calculations (3 of them dual-variant) / 11 state machines / 3 OCC rules / 6 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: School
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: School name.
      - name: district_code
        type: string
        source: input
        description: Municipal district code the school belongs to.
      - name: enrollment_count
        type: integer
        source: input
        description: Enrolled students, used as the denominator of the ENROLLMENT_WEIGHTED mode-share variant.
        constraints: ">= 1"
      - name: session_start_date
        type: string
        source: input
        description: First instructional day (ISO 8601 date, UTC calendar). Lower bound of every PostAssignment window and of the SEASON_TO_DATE reliability window.
      - name: session_end_date
        type: string
        source: input
        description: Last instructional day (ISO 8601 date). Upper bound of every PostAssignment window.
        constraints: "must be >= session_start_date"
      - name: am_window_start_utc
        type: string
        source: input
        description: 'AM crossing window start as "HH:MM" interpreted as a UTC clock time on the given calendar date.'
      - name: am_window_end_utc
        type: string
        source: input
        description: 'AM crossing window end as "HH:MM" (UTC clock time).'
      - name: pm_window_start_utc
        type: string
        source: input
        description: 'PM crossing window start as "HH:MM" (UTC clock time). Shifted by early_dismissal_pm_offset_minutes on dates listed in early_dismissal_dates.'
      - name: pm_window_end_utc
        type: string
        source: input
        description: 'PM crossing window end as "HH:MM" (UTC clock time).'
      - name: early_dismissal_pm_offset_minutes
        type: integer
        source: input
        description: Signed minute offset applied to pm_window_start_utc on every date listed in early_dismissal_dates. Negative values move the PM shift earlier.
        default: -120
      - name: no_school_dates
        type: array
        source: input
        description: Array of ISO 8601 date strings on which no crossing coverage is required; absence reports on these dates are rejected.
        default: []
      - name: early_dismissal_dates
        type: array
        source: input
        description: Array of ISO 8601 date strings on which the PM window is shifted by early_dismissal_pm_offset_minutes.
        default: []
      - name: baseline_walk_bike_mode_share_pct
        type: number
        source: input
        description: Program-baseline walk+bike mode share percent, the subtrahend of mode_share_trend_pct.
        constraints: "0.00 <= value <= 100.00"
      - name: mode_share_surveys
        type: array
        source: system
        description: 'Append-only array of survey objects, each { term_code, survey_date, classrooms_reporting, enrollment_at_survey, walk_count, bike_count, bus_count, car_count, other_count, recorded_at }. Appended by POST /srts/schools/{id}/mode-share-surveys; never mutated in place.'
        default: []
      - name: walk_bike_mode_share_pct
        type: number
        source: computed
        description: RAW_TALLY variant of calculations.walk_bike_mode_share. Null until the first survey is recorded.
      - name: walk_bike_mode_share_weighted_pct
        type: number
        source: computed
        description: ENROLLMENT_WEIGHTED variant of calculations.walk_bike_mode_share. Null until the first survey is recorded.
      - name: mode_share_trend_pct
        type: number
        source: computed
        description: walk_bike_mode_share_pct minus baseline_walk_bike_mode_share_pct, 2 dp. Null until the first survey is recorded.
      - name: latest_survey_term_code
        type: string
        source: computed
        description: term_code of the survey selected by calculations.walk_bike_mode_share's ordering rule. Null until the first survey is recorded.
      - name: active_post_count
        type: integer
        source: computed
        description: Count of GuardPost rows whose intersection_id points at an Intersection of this school and whose status == ACTIVE.
        default: 0
      - name: covered_post_count
        type: integer
        source: computed
        description: Subset of active_post_count whose GuardPost.coverage_status == COVERED.
        default: 0
      - name: uncovered_post_count
        type: integer
        source: computed
        description: 'Subset of active_post_count whose GuardPost.coverage_status IN {UNCOVERED, UNSTAFFED}. Invariant: active_post_count == covered_post_count + uncovered_post_count.'
        default: 0
      - name: coverage_rate_pct
        type: number
        source: computed
        description: See calculations.school_coverage_posture. 100.00 when active_post_count == 0.
        default: 100.00
      - name: coverage_posture
        type: string
        source: computed
        description: Derived aggregate gate over child posts, see calculations.school_coverage_posture.
        default: OPEN
        constraints: "enum {OPEN, RESTRICTED, SUSPENDED}"

  - name: Intersection
    parent: School
    common_fields: true
    entity_kind: resource
    fields:
      - name: school_id
        type: string
        source: input
        description: FK -> School.id; the school this crossing location serves. Immutable after creation.
      - name: cross_streets
        type: string
        source: input
        description: 'Human label for the location, e.g. "Maple Ave & 3rd St".'
      - name: control_type
        type: string
        source: input
        description: Traffic control present at the intersection. Selects which warrant-scoring variant applies (see calculations.warrant_score).
        constraints: "enum {UNCONTROLLED, STOP_SIGN, SIGNALIZED}"
      - name: speed_limit_mph
        type: integer
        source: input
        description: Posted speed limit, input to the tiered speed multiplier of calculations.warrant_score.
        constraints: ">= 5 and <= 65"
      - name: lanes_crossed
        type: integer
        source: input
        description: Number of travel lanes a pedestrian must cross.
        constraints: ">= 1"
      - name: posted_school_zone
        type: boolean
        source: input
        description: Whether a posted school-zone speed reduction exists.
        default: false
      - name: warrant_status
        type: string
        source: system
        description: Warrant lifecycle state, driven exclusively by WarrantStudy transitions.
        default: NOT_STUDIED
        constraints: "enum {NOT_STUDIED, UNDER_STUDY, WARRANTED, CONDITIONAL, NOT_WARRANTED}"
      - name: latest_warrant_score
        type: number
        source: computed
        description: warrant_score of the most recently finalized WarrantStudy on this intersection (ordered by created_at DESC among studies whose status IN {WARRANTED, CONDITIONAL, NOT_WARRANTED}). Null when none exists.
      - name: crash_history
        type: array
        source: system
        description: 'Append-only array of crash objects, each { crash_date, severity, involved_pedestrian, involved_school_age, recorded_at }. Appended by POST /srts/intersections/{id}/crash-records; never mutated in place.'
        default: []
      - name: pedestrian_crash_count_window
        type: integer
        source: computed
        description: Count of crash_history entries with involved_pedestrian == true whose crash_date falls in the 1095-day window ending at the logical clock date (inclusive both ends).
        default: 0
      - name: crash_severity_points
        type: integer
        source: computed
        description: See calculations.project_benefit_cost_score step 1; weighted severity points over the same 1095-day window.
        default: 0
      - name: open_complaint_count
        type: integer
        source: computed
        description: Count of Complaint rows on this intersection whose status IN {RECEIVED, TRIAGED, REFERRED}.
        default: 0

  - name: WarrantStudy
    parent: Intersection
    common_fields: true
    entity_kind: resource
    fields:
      - name: intersection_id
        type: string
        source: input
        description: FK -> Intersection.id; the intersection under study. Immutable after creation.
      - name: count_window_start
        type: string
        source: input
        description: ISO 8601 date, INCLUSIVE lower bound of the observation window. Every count session's session_date must fall inside the window.
      - name: count_window_end
        type: string
        source: input
        description: ISO 8601 date, EXCLUSIVE upper bound of the observation window (half-open interval semantics, see validations priority 58 count-window overlap) and the inclusive anchor date of the 1095-day crash lookback.
        constraints: "must be > count_window_start"
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the TrafficEngineer who created the study. Compared against the finalizing engineer's X-User-ID by the segregation-of-duties check.
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the TrafficEngineer who finalized the determination. Null before finalize.
      - name: status
        type: string
        source: system
        description: Study lifecycle state; see state_machines.WarrantStudy.
        default: DRAFT
        constraints: "enum {DRAFT, COUNTING, ANALYZED, WARRANTED, CONDITIONAL, NOT_WARRANTED}"
      - name: scoring_variant
        type: string
        source: computed
        description: GAP_ADEQUACY when the parent Intersection.control_type == UNCONTROLLED, otherwise EXPOSURE_INDEX. Snapshotted at analyze time.
        constraints: "enum {GAP_ADEQUACY, EXPOSURE_INDEX}"
      - name: count_sessions
        type: array
        source: system
        description: 'Append-only array of count-session objects, each { session_date, period, observed_minutes, child_count, adult_count, vehicle_count, adequate_gaps, voided, recorded_at }. Appended by POST /srts/warrant-studies/{id}/count-sessions. reopen-counting flips voided to true on every existing entry; no entry is ever deleted.'
        default: []
      - name: recount_round
        type: integer
        source: system
        description: Number of times reopen-counting has been applied to this study.
        default: 0
      - name: included_child_count
        type: integer
        source: computed
        description: Sum of child_count over count_sessions entries with voided == false and period IN {AM_ARRIVAL, PM_DISMISSAL}. Null before the first analyze.
      - name: included_adequate_gaps
        type: integer
        source: computed
        description: Sum of adequate_gaps over the same included set as included_child_count. Null before the first analyze.
      - name: included_vehicle_count
        type: integer
        source: computed
        description: Sum of vehicle_count over the same included set as included_child_count. Null before the first analyze.
      - name: pedestrian_crash_count_3yr
        type: integer
        source: computed
        description: Count of parent Intersection.crash_history entries with involved_pedestrian == true and crash_date within [count_window_end - 1095 days, count_window_end], both ends inclusive. Null before the first analyze.
      - name: severe_pedestrian_crash_count_3yr
        type: integer
        source: computed
        description: Subset of pedestrian_crash_count_3yr whose severity IN {SEVERE_INJURY, FATAL}. Null before the first analyze.
      - name: warrant_score
        type: number
        source: computed
        description: See calculations.warrant_score. Null in DRAFT and COUNTING, and reset to null by reopen-counting.
      - name: determination
        type: string
        source: system
        description: Determination pinned at finalize, derived from warrant_score by calculations.warrant_determination. Null before finalize.
        constraints: "enum {WARRANTED, CONDITIONAL, NOT_WARRANTED}"
      - name: reopen_reason
        type: string
        source: system
        description: Free text supplied at the most recent reopen-counting call. Null when recount_round == 0.

  - name: Guard
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: Guard's legal name.
      - name: home_zone_code
        type: string
        source: input
        description: Zone the guard lives in; compared against GuardPost.zone_code as tie-break 1 of the substitute selector.
      - name: hire_date
        type: string
        source: input
        description: ISO 8601 date of hire.
      - name: substitute_pool_optin
        type: boolean
        source: input
        description: Whether the guard has opted into the substitute pool. Part of the substitute selector's eligibility filter.
        default: true
      - name: certification_status
        type: string
        source: system
        description: Certification dimension of the Guard state machine, independent of duty_status.
        default: APPLICANT
        constraints: "enum {APPLICANT, IN_TRAINING, CERTIFIED, SUSPENDED}"
      - name: duty_status
        type: string
        source: system
        description: Duty dimension of the Guard state machine, independent of certification_status.
        default: UNASSIGNED
        constraints: "enum {UNASSIGNED, ASSIGNED, ON_LEAVE}"
      - name: training_hours_completed
        type: number
        source: system
        description: Lifetime training hours, incremented by POST /srts/guards/{id}/training. Feeds the training bonus of both reliability variants.
        default: 0
      - name: hours_since_last_certification
        type: number
        source: system
        description: Training hours accumulated since the most recent certify call; reset to 0 on every successful certify. Gates recertification (>= 4.0 required from CERTIFIED).
        default: 0
      - name: certified_on
        type: string
        source: system
        description: ISO 8601 date of the most recent certification. Null while APPLICANT or IN_TRAINING.
      - name: certification_expires_on
        type: string
        source: system
        description: ISO 8601 date after which the certification is stale. Null while APPLICANT or IN_TRAINING.
      - name: equipment_issued
        type: array
        source: system
        description: 'Append-only array of issuance objects, each { item_type, issued_on, recorded_at }. item_type IN {HIGH_VIS_VEST, STOP_PADDLE, WHISTLE}.'
        default: []
      - name: equipment_complete
        type: boolean
        source: computed
        description: True when equipment_issued contains at least one entry for each of HIGH_VIS_VEST, STOP_PADDLE and WHISTLE.
        default: false
      - name: reliability_score_rolling_90d
        type: number
        source: computed
        description: ROLLING_90D variant of calculations.guard_reliability_score. Re-evaluated on every read of the guard, on absence create/rescind, and on every clock set.
        default: 100.00
      - name: reliability_score_season_to_date
        type: number
        source: computed
        description: SEASON_TO_DATE variant of calculations.guard_reliability_score. Ranking key of the substitute selector.
        default: 100.00
      - name: suspension_reason
        type: string
        source: system
        description: Reason the certification dimension entered SUSPENDED. Null unless certification_status == SUSPENDED.
        constraints: "enum {RELIABILITY_BREACH}"

  - name: GuardPost
    parent: Intersection
    common_fields: true
    entity_kind: resource
    fields:
      - name: intersection_id
        type: string
        source: input
        description: FK -> Intersection.id; the crossing location this post staffs. Immutable after creation.
      - name: post_label
        type: string
        source: input
        description: 'Operational label, e.g. "Maple NW corner".'
      - name: zone_code
        type: string
        source: input
        description: Dispatch zone of the post; compared against Guard.home_zone_code as tie-break 1 of the substitute selector.
      - name: required_shift
        type: string
        source: input
        description: Which crossing window the post must be staffed for. Copied onto every PostAssignment created under the post.
        constraints: "enum {AM, PM, BOTH}"
      - name: status
        type: string
        source: system
        description: Post lifecycle state; see state_machines.GuardPost.
        default: PROPOSED
        constraints: "enum {PROPOSED, ACTIVE, SUSPENDED}"
      - name: suspension_reason
        type: string
        source: system
        description: Reason the post entered SUSPENDED. Null unless status == SUSPENDED.
        constraints: "enum {WARRANT_LAPSED}"
      - name: coverage_status
        type: string
        source: computed
        description: 'UNSTAFFED when no PostAssignment on this post has status IN {SCHEDULED, ACTIVE}; UNCOVERED when at least one such assignment exists and open_gap_count >= 1; COVERED when at least one such assignment exists and open_gap_count == 0.'
        default: UNSTAFFED
        constraints: "enum {UNSTAFFED, COVERED, UNCOVERED}"
      - name: open_gap_count
        type: integer
        source: computed
        description: Count of AbsenceReport rows whose post_assignment_id belongs to this post and whose status IN {DISPATCH_PENDING, OFFER_OUT, UNCOVERED_GAP}.
        default: 0
      - name: activated_at
        type: string
        source: system
        description: Logical-clock timestamp of the most recent activation. Null while PROPOSED.

  - name: PostAssignment
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: guard_post_id
        type: string
        source: input
        description: FK -> GuardPost.id; the post being staffed. Taken from the path, immutable.
      - name: guard_id
        type: string
        source: input
        description: FK -> Guard.id; the guard staffing the post. Immutable.
      - name: shift
        type: string
        source: computed
        description: Copied from the parent GuardPost.required_shift at creation. Governs shift-overlap arithmetic (BOTH conflicts with AM, PM and BOTH; AM conflicts only with AM and BOTH; PM conflicts only with PM and BOTH).
        constraints: "enum {AM, PM, BOTH}"
      - name: start_date
        type: string
        source: input
        description: ISO 8601 date, INCLUSIVE first day of duty.
      - name: end_date
        type: string
        source: input
        description: ISO 8601 date, INCLUSIVE last day of duty (closed-interval semantics, see validations priority 58 assignment overlap).
        constraints: "must be >= start_date"
      - name: status
        type: string
        source: system
        description: Assignment lifecycle state; see state_machines.PostAssignment.
        default: SCHEDULED
        constraints: "enum {SCHEDULED, ACTIVE, ENDED, VACATED, SUPERSEDED}"
      - name: vacated_reason
        type: string
        source: system
        description: Reason the assignment was vacated by a cascade. Null unless status == VACATED.
        constraints: "enum {POST_SUSPENDED, GUARD_SUSPENDED}"
      - name: open_absence_count
        type: integer
        source: computed
        description: Count of AbsenceReport rows on this assignment whose status IN {DISPATCH_PENDING, OFFER_OUT, UNCOVERED_GAP}.
        default: 0
      - name: coverage_state
        type: string
        source: computed
        description: GAP when open_absence_count >= 1, otherwise STAFFED.
        default: STAFFED
        constraints: "enum {STAFFED, GAP}"

  - name: AbsenceReport
    parent: PostAssignment
    common_fields: true
    entity_kind: resource
    fields:
      - name: post_assignment_id
        type: string
        source: input
        description: FK -> PostAssignment.id; the duty day being missed.
      - name: guard_id
        type: string
        source: system
        description: FK -> Guard.id; copied from PostAssignment.guard_id at creation, never supplied by the client.
      - name: absence_date
        type: string
        source: input
        description: ISO 8601 date of the missed duty day. Must lie inside the assignment window and outside School.no_school_dates.
      - name: shift
        type: string
        source: system
        description: Copied from PostAssignment.shift at creation.
        constraints: "enum {AM, PM, BOTH}"
      - name: reason
        type: string
        source: input
        description: Declared reason. UNEXCUSED carries the heavier penalty weight in both reliability variants.
        constraints: "enum {ILLNESS, FAMILY, WEATHER, TRAINING, UNEXCUSED}"
      - name: note
        type: string
        source: input
        description: Optional free-text note.
      - name: status
        type: string
        source: system
        description: Absence lifecycle state; see state_machines.AbsenceReport.
        default: DISPATCH_PENDING
        constraints: "enum {DISPATCH_PENDING, OFFER_OUT, COVERED, UNCOVERED_GAP, RESCINDED}"
      - name: shift_start_utc
        type: string
        source: computed
        description: 'absence_date combined with School.am_window_start_utc when shift IN {AM, BOTH}, or with School.pm_window_start_utc when shift == PM; when absence_date is listed in School.early_dismissal_dates and shift == PM, School.early_dismissal_pm_offset_minutes is added.'
      - name: notice_hours
        type: number
        source: computed
        description: (shift_start_utc - AbsenceReport.created_at) expressed in hours, may be negative. Pinned at creation and never recomputed.
      - name: urgency_tier
        type: string
        source: computed
        description: SAME_DAY when notice_hours < 12, SHORT when 12 <= notice_hours < 48, STANDARD when notice_hours >= 48. Pinned at creation.
        constraints: "enum {SAME_DAY, SHORT, STANDARD}"
      - name: dispatch_attempt_count
        type: integer
        source: system
        description: Number of offers made on this absence; incremented by one on every offer created.
        default: 0
      - name: dispatch_offers
        type: array
        source: system
        description: 'Append-only array of offer objects, each { attempt_number, offered_guard_id, offered_at, offer_expires_at, offer_status }. offer_status IN {OPEN, ACCEPTED, DECLINED, EXPIRED}; only the terminal status of an existing entry is rewritten.'
        default: []
      - name: current_offer_guard_id
        type: string
        source: system
        description: Guard.id of the recipient of the offer whose offer_status == OPEN. Null when status != OFFER_OUT.
      - name: current_offer_expires_at
        type: string
        source: system
        description: Logical-clock expiry of the OPEN offer. Null when status != OFFER_OUT.
      - name: excluded_guard_ids
        type: array
        source: system
        description: Guard.id values that DECLINED or let an offer EXPIRE on this absence; excluded from every later candidate set for this absence.
        default: []
      - name: substitute_guard_id
        type: string
        source: system
        description: Guard.id that accepted the offer. Null unless status == COVERED.
      - name: substitute_cost_cents
        type: integer
        source: computed
        description: See calculations.substitute_cost. Pinned at acceptance; null unless status == COVERED.
      - name: rescind_reason
        type: string
        source: system
        description: Free text supplied at rescind. Null unless status == RESCINDED.

  - name: WalkingRoute
    parent: School
    common_fields: true
    entity_kind: resource
    fields:
      - name: school_id
        type: string
        source: input
        description: FK -> School.id; the school this recommended route serves. Immutable after creation.
      - name: route_code
        type: string
        source: input
        description: Stable code for the corridor. Publishing a route RETIREs any other route of the same school carrying the same route_code.
      - name: route_name
        type: string
        source: input
        description: Human label for the route.
      - name: segments
        type: array
        source: input
        description: 'Ordered array of segment objects, each { segment_order, hazard_type, length_ft, mitigated, intersection_id }. hazard_type IN {NO_SIDEWALK, UNCONTROLLED_CROSSING, HIGH_SPEED_ARTERIAL, RAIL_CROSSING, DRIVEWAY_CONFLICT, POOR_LIGHTING}. segment_order values must be 1..N with no gaps or duplicates. intersection_id, when non-null, must reference an existing Intersection (checked at creation, priority 34) but need NOT belong to this route''s school until publish, where the ownership consistency check at priority 66 rejects it.'
        constraints: "length >= 1"
      - name: segment_count
        type: integer
        source: computed
        description: Number of entries in segments.
      - name: hazard_score
        type: number
        source: computed
        description: See calculations.route_hazard_score. Recomputed at creation and never after (segments are immutable).
      - name: status
        type: string
        source: system
        description: Route lifecycle state; see state_machines.WalkingRoute.
        default: DRAFT
        constraints: "enum {DRAFT, PUBLISHED, ADVISORY_HOLD, RETIRED}"
      - name: published_at
        type: string
        source: system
        description: Logical-clock timestamp of the most recent publish. Null while DRAFT.
      - name: hold_reason
        type: string
        source: system
        description: Reason the route entered ADVISORY_HOLD. Null unless status == ADVISORY_HOLD.
        constraints: "enum {SCHOOL_COVERAGE_SUSPENDED}"

  - name: Complaint
    parent: Intersection
    common_fields: true
    entity_kind: resource
    fields:
      - name: intersection_id
        type: string
        source: input
        description: FK -> Intersection.id; the location complained about. Taken from the path, immutable.
      - name: complaint_type
        type: string
        source: input
        description: Nature of the report.
        constraints: "enum {SPEEDING, NEAR_MISS, FAILURE_TO_YIELD, SIGHT_OBSTRUCTION, SIGNAL_TIMING}"
      - name: reporter_name
        type: string
        source: input
        description: Name given by the reporter.
      - name: reporter_contact
        type: string
        source: input
        description: Optional contact string.
      - name: occurred_at
        type: string
        source: input
        description: ISO 8601 UTC timestamp of the observed event.
      - name: narrative
        type: string
        source: input
        description: Free-text description of the event.
      - name: severity_claim
        type: string
        source: input
        description: Reporter's own severity claim; recorded but never used in any calculation.
        constraints: "enum {LOW, MEDIUM, HIGH}"
      - name: status
        type: string
        source: system
        description: Complaint lifecycle state; see state_machines.Complaint.
        default: RECEIVED
        constraints: "enum {RECEIVED, TRIAGED, REFERRED, RESOLVED, CLOSED_NO_ACTION}"
      - name: disposition
        type: string
        source: system
        description: Triage decision. Null while RECEIVED.
        constraints: "enum {REFER_TO_ENGINEERING, CLOSE_NO_ACTION}"
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the TrafficEngineer who triaged the complaint. Null while RECEIVED.
      - name: triage_note
        type: string
        source: system
        description: Optional note captured at triage.
      - name: referred_project_id
        type: string
        source: system
        description: Back-pointer to the InfrastructureProject whose source_complaint_id equals this complaint's id, set by the system when that project is created. Not an independent reference; children are discovered via GET /srts/infrastructure-projects?source_complaint_id=. Null until a project cites this complaint.

  - name: GrantProgram
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_name
        type: string
        source: input
        description: Grant program name.
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the pool belongs to.
      - name: total_cents
        type: integer
        source: input
        description: Total award pool in cents. Immutable after creation; the conserved quantity of the grant-funds invariant.
        constraints: ">= 1"
      - name: application_deadline
        type: string
        source: input
        description: ISO 8601 date; recorded for reporting only.
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of awarded_cents over InfrastructureProject rows of this program whose status == FUNDED.
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: 'total_cents - committed_cents. Invariant: total_cents == committed_cents + remaining_cents at every observable instant.'
      - name: funded_project_count
        type: integer
        source: computed
        description: Count of InfrastructureProject rows of this program whose status == FUNDED.
        default: 0
      - name: deferred_project_count
        type: integer
        source: computed
        description: Count of InfrastructureProject rows of this program whose status == DEFERRED.
        default: 0
      - name: next_cycle_carryover_cents
        type: integer
        source: computed
        description: Sum of requested_cost_cents over InfrastructureProject rows of this program whose status == DEFERRED.
        default: 0

  - name: InfrastructureProject
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: grant_program_id
        type: string
        source: input
        description: FK -> GrantProgram.id; the pool this project competes in. Immutable.
      - name: intersection_id
        type: string
        source: input
        description: FK -> Intersection.id; the location the project would treat. Immutable.
      - name: source_complaint_id
        type: string
        source: input
        description: FK -> Complaint.id; the referred complaint that motivated the project. Nullable; when supplied the complaint must be in status TRIAGED with disposition == REFER_TO_ENGINEERING and must sit on the same intersection_id.
      - name: project_type
        type: string
        source: input
        description: Countermeasure type.
        constraints: "enum {RRFB, CURB_EXTENSION, SIDEWALK_INFILL, SIGNAL_RETIMING, RAISED_CROSSWALK}"
      - name: scope_summary
        type: string
        source: input
        description: Free-text scope.
      - name: requested_cost_cents
        type: integer
        source: input
        description: Requested award in cents. Denominator input of the cost factor and the amount committed on funding.
        constraints: ">= 1"
      - name: students_benefited
        type: integer
        source: input
        description: Students expected to benefit; input to benefit_points.
        constraints: ">= 0"
      - name: status
        type: string
        source: system
        description: Project lifecycle state; see state_machines.InfrastructureProject.
        default: PROPOSED
        constraints: "enum {PROPOSED, SCORED, FUNDED, DEFERRED}"
      - name: benefit_points
        type: number
        source: computed
        description: See calculations.project_benefit_cost_score step 2, 4 dp. Null while PROPOSED.
      - name: cost_factor
        type: number
        source: computed
        description: See calculations.project_benefit_cost_score step 3, 4 dp. Null while PROPOSED.
      - name: benefit_cost_score
        type: number
        source: computed
        description: benefit_points / cost_factor rounded to 2 dp; the ranking key of the funding selector. Null while PROPOSED.
      - name: referred_complaint_count_at_scoring
        type: integer
        source: computed
        description: Count of Complaint rows on the same intersection whose status IN {TRIAGED, REFERRED, RESOLVED} at the moment of scoring. Null while PROPOSED.
      - name: awarded_cents
        type: integer
        source: system
        description: Cents committed to this project. Equals requested_cost_cents while FUNDED and 0 in every other status.
        default: 0
      - name: funded_at
        type: string
        source: system
        description: Logical-clock timestamp of the most recent funding. Null unless the project has ever been funded.
      - name: withdrawal_reason
        type: string
        source: system
        description: Free text supplied at the most recent funding withdrawal. Null until one occurs.

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: WarrantStudy
    state_field: status
    initial_state: DRAFT
    terminal_states: [WARRANTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: COUNTING
        trigger: "POST /srts/warrant-studies/{id}/count-sessions (first session recorded)"
        actor: TrafficEngineer
        preconditions:
          - "study.status == DRAFT"
          - "session_date >= study.count_window_start AND session_date < study.count_window_end (half-open window)"
          - "period IN {AM_ARRIVAL, MIDDAY, PM_DISMISSAL}"
          - "observed_minutes >= 1; child_count, adult_count, vehicle_count, adequate_gaps all >= 0"
        side_effects:
          - "appends the session object to study.count_sessions with voided = false"
          - "sets study.status = COUNTING"
          - "refreshes study.updated_at and increments study.version by 1"
      - from: COUNTING
        to: COUNTING
        trigger: "POST /srts/warrant-studies/{id}/count-sessions (subsequent sessions)"
        actor: TrafficEngineer
        preconditions:
          - "study.status == COUNTING"
          - "session_date >= study.count_window_start AND session_date < study.count_window_end"
        side_effects:
          - "appends the session object to study.count_sessions with voided = false"
          - "increments study.version by 1"
        note: "Self-loop; any number of sessions may be recorded inside the window."
      - from: COUNTING
        to: ANALYZED
        trigger: "POST /srts/warrant-studies/{id}/analyze"
        actor: TrafficEngineer
        preconditions:
          - "study.status == COUNTING"
          - "count_sessions contains >= 1 entry with voided == false AND period == AM_ARRIVAL"
          - "count_sessions contains >= 1 entry with voided == false AND period == PM_DISMISSAL"
        side_effects:
          - "recomputes study.included_child_count, study.included_adequate_gaps, study.included_vehicle_count over non-voided AM_ARRIVAL and PM_DISMISSAL sessions (MIDDAY excluded)"
          - "recomputes study.pedestrian_crash_count_3yr and study.severe_pedestrian_crash_count_3yr from Intersection.crash_history over the 1095-day window ending at count_window_end"
          - "sets study.scoring_variant from Intersection.control_type"
          - "sets study.warrant_score per calculations.warrant_score"
          - "sets study.status = ANALYZED"
      - from: ANALYZED
        to: WARRANTED
        trigger: "POST /srts/warrant-studies/{id}/finalize (warrant_score >= 60.00)"
        actor: TrafficEngineer
        preconditions:
          - "study.status == ANALYZED"
          - "X-User-ID != study.authored_by_user_id (segregation of duties)"
          - "calculations.warrant_determination yields WARRANTED"
        side_effects:
          - "sets study.determination = WARRANTED, study.finalized_by_user_id = X-User-ID, study.status = WARRANTED"
          - "CASCADE link 1: sets parent Intersection.warrant_status = WARRANTED and Intersection.latest_warrant_score = study.warrant_score"
          - "no post-suspension cascade fires on this branch"
      - from: ANALYZED
        to: CONDITIONAL
        trigger: "POST /srts/warrant-studies/{id}/finalize (40.00 <= warrant_score < 60.00 AND pedestrian_crash_count_3yr >= 1)"
        actor: TrafficEngineer
        preconditions:
          - "study.status == ANALYZED"
          - "X-User-ID != study.authored_by_user_id"
          - "calculations.warrant_determination yields CONDITIONAL"
        side_effects:
          - "sets study.determination = CONDITIONAL, study.finalized_by_user_id = X-User-ID, study.status = CONDITIONAL"
          - "CASCADE link 1: sets parent Intersection.warrant_status = CONDITIONAL and Intersection.latest_warrant_score = study.warrant_score"
          - "CASCADE link 2 (caused by link 1): every GuardPost at that intersection with status == ACTIVE and required_shift IN {PM, BOTH} transitions ACTIVE -> SUSPENDED with suspension_reason = WARRANT_LAPSED, because CONDITIONAL only permits AM staffing; posts with required_shift == AM are untouched"
          - "CASCADE link 3 (caused by link 2): every PostAssignment on each newly SUSPENDED post whose status IN {SCHEDULED, ACTIVE} transitions to VACATED with vacated_reason = POST_SUSPENDED"
          - "CASCADE link 4 (caused by link 3): each Guard whose assignment was vacated and who now holds zero PostAssignment rows with status IN {SCHEDULED, ACTIVE} transitions duty_status ASSIGNED -> UNASSIGNED"
          - "recomputes GuardPost.coverage_status, School.active_post_count / covered_post_count / uncovered_post_count / coverage_rate_pct / coverage_posture"
      - from: ANALYZED
        to: NOT_WARRANTED
        trigger: "POST /srts/warrant-studies/{id}/finalize (warrant_score < 40.00, or 40.00 <= warrant_score < 60.00 with pedestrian_crash_count_3yr == 0)"
        actor: TrafficEngineer
        preconditions:
          - "study.status == ANALYZED"
          - "X-User-ID != study.authored_by_user_id"
          - "calculations.warrant_determination yields NOT_WARRANTED"
        side_effects:
          - "sets study.determination = NOT_WARRANTED, study.finalized_by_user_id = X-User-ID, study.status = NOT_WARRANTED"
          - "CASCADE link 1: sets parent Intersection.warrant_status = NOT_WARRANTED and Intersection.latest_warrant_score = study.warrant_score"
          - "CASCADE link 2 (caused by link 1, because the intersection is no longer warranted): every GuardPost at that intersection with status == ACTIVE transitions ACTIVE -> SUSPENDED with suspension_reason = WARRANT_LAPSED, regardless of required_shift"
          - "CASCADE link 3 (caused by link 2, because the post left ACTIVE): every PostAssignment on each newly SUSPENDED post whose status IN {SCHEDULED, ACTIVE} transitions to VACATED with vacated_reason = POST_SUSPENDED"
          - "CASCADE link 4 (caused by link 3, because the guard lost the assignment): each Guard whose assignment was vacated and who now holds zero PostAssignment rows with status IN {SCHEDULED, ACTIVE} transitions duty_status ASSIGNED -> UNASSIGNED"
          - "recomputes GuardPost.coverage_status (UNSTAFFED once every assignment is terminal), School.active_post_count / covered_post_count / uncovered_post_count / coverage_rate_pct / coverage_posture"
      - from: ANALYZED
        to: COUNTING
        trigger: "POST /srts/warrant-studies/{id}/reopen-counting"
        actor: TrafficEngineer
        preconditions:
          - "study.status IN {ANALYZED, CONDITIONAL, NOT_WARRANTED}"
        side_effects:
          - "sets voided = true on every entry of study.count_sessions"
          - "sets study.warrant_score, study.included_child_count, study.included_adequate_gaps, study.included_vehicle_count, study.pedestrian_crash_count_3yr, study.severe_pedestrian_crash_count_3yr, study.determination to null"
          - "increments study.recount_round by 1 and stores reopen_reason"
          - "sets study.status = COUNTING"
          - "sets parent Intersection.warrant_status = UNDER_STUDY and Intersection.latest_warrant_score = null"
        note: "Recount loop. A study in COUNTING with only voided sessions cannot be analyzed until at least one fresh AM_ARRIVAL and one fresh PM_DISMISSAL session are recorded."
      - from: NOT_WARRANTED
        to: COUNTING
        trigger: "POST /srts/warrant-studies/{id}/reopen-counting (appeal of a negative determination)"
        actor: TrafficEngineer
        preconditions:
          - "study.status IN {ANALYZED, CONDITIONAL, NOT_WARRANTED}"
        side_effects:
          - "identical to the ANALYZED -> COUNTING side-effect set"
        note: "Appeal loop; the same endpoint serves both re-entry points, which is what makes this machine cyclic from two distinct states."
      - from: CONDITIONAL
        to: COUNTING
        trigger: "POST /srts/warrant-studies/{id}/reopen-counting"
        actor: TrafficEngineer
        preconditions:
          - "study.status IN {ANALYZED, CONDITIONAL, NOT_WARRANTED}"
        side_effects:
          - "identical to the ANALYZED -> COUNTING side-effect set"

  - entity: Intersection
    state_field: warrant_status
    initial_state: NOT_STUDIED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: NOT_STUDIED
        to: UNDER_STUDY
        trigger: "POST /srts/warrant-studies (system side effect of study creation)"
        actor: system
        preconditions:
          - "the new WarrantStudy passed every validation including the count-window overlap check"
        side_effects:
          - "sets intersection.warrant_status = UNDER_STUDY"
          - "increments intersection.version by 1 (the OCC anchor of concurrency_rules study-create-stale-intersection)"
      - from: WARRANTED
        to: UNDER_STUDY
        trigger: "POST /srts/warrant-studies (a newer study supersedes the standing determination)"
        actor: system
        preconditions:
          - "the new WarrantStudy passed every validation"
        side_effects:
          - "sets intersection.warrant_status = UNDER_STUDY and intersection.latest_warrant_score = null"
          - "increments intersection.version by 1"
        note: "Standing determinations are not sticky: opening a new study re-opens the question, which is exactly why a stale intersection version must be rejected."
      - from: CONDITIONAL
        to: UNDER_STUDY
        trigger: "POST /srts/warrant-studies or POST /srts/warrant-studies/{id}/reopen-counting"
        actor: system
        preconditions:
          - "the triggering study transition succeeded"
        side_effects:
          - "sets intersection.warrant_status = UNDER_STUDY and intersection.latest_warrant_score = null"
          - "increments intersection.version by 1"
      - from: NOT_WARRANTED
        to: UNDER_STUDY
        trigger: "POST /srts/warrant-studies or POST /srts/warrant-studies/{id}/reopen-counting"
        actor: system
        preconditions:
          - "the triggering study transition succeeded"
        side_effects:
          - "sets intersection.warrant_status = UNDER_STUDY and intersection.latest_warrant_score = null"
          - "increments intersection.version by 1"
      - from: UNDER_STUDY
        to: WARRANTED
        trigger: "POST /srts/warrant-studies/{id}/finalize"
        actor: system
        preconditions:
          - "the finalizing study's determination == WARRANTED"
        side_effects:
          - "sets intersection.warrant_status = WARRANTED and intersection.latest_warrant_score = study.warrant_score"
      - from: UNDER_STUDY
        to: CONDITIONAL
        trigger: "POST /srts/warrant-studies/{id}/finalize"
        actor: system
        preconditions:
          - "the finalizing study's determination == CONDITIONAL"
        side_effects:
          - "sets intersection.warrant_status = CONDITIONAL and intersection.latest_warrant_score = study.warrant_score"
      - from: UNDER_STUDY
        to: NOT_WARRANTED
        trigger: "POST /srts/warrant-studies/{id}/finalize"
        actor: system
        preconditions:
          - "the finalizing study's determination == NOT_WARRANTED"
        side_effects:
          - "sets intersection.warrant_status = NOT_WARRANTED and intersection.latest_warrant_score = study.warrant_score"

  - entity: Guard
    state_field: certification_status
    initial_state: APPLICANT
    terminal_states: []
    shape: cyclic
    note: "Dimension 1 of 2 on the same Guard row. Evolves completely independently of duty_status: a guard may be SUSPENDED while ON_LEAVE, or CERTIFIED while UNASSIGNED, and no transition on this dimension writes duty_status except via the assignment-vacating cascade described below."
    transitions:
      - from: APPLICANT
        to: IN_TRAINING
        trigger: "POST /srts/guards/{id}/training (first training record)"
        actor: CrossingSupervisor
        preconditions:
          - "guard.certification_status IN {APPLICANT, IN_TRAINING, CERTIFIED, SUSPENDED}"
          - "hours > 0"
        side_effects:
          - "adds hours to guard.training_hours_completed and to guard.hours_since_last_certification"
          - "sets guard.certification_status = IN_TRAINING"
          - "recomputes guard.reliability_score_rolling_90d and guard.reliability_score_season_to_date (training bonus changes)"
      - from: IN_TRAINING
        to: IN_TRAINING
        trigger: "POST /srts/guards/{id}/training (subsequent training records)"
        actor: CrossingSupervisor
        preconditions:
          - "hours > 0"
        side_effects:
          - "adds hours to guard.training_hours_completed and guard.hours_since_last_certification"
          - "recomputes both reliability scores"
      - from: IN_TRAINING
        to: CERTIFIED
        trigger: "POST /srts/guards/{id}/certify"
        actor: CrossingSupervisor
        preconditions:
          - "guard.certification_status == IN_TRAINING"
          - "guard.training_hours_completed >= 8.0"
          - "guard.equipment_complete == true"
          - "certification_expires_on > certified_on"
        side_effects:
          - "sets guard.certified_on, guard.certification_expires_on, guard.certification_status = CERTIFIED"
          - "resets guard.hours_since_last_certification to 0"
      - from: CERTIFIED
        to: CERTIFIED
        trigger: "POST /srts/guards/{id}/certify (recertification)"
        actor: CrossingSupervisor
        preconditions:
          - "guard.certification_status == CERTIFIED"
          - "guard.hours_since_last_certification >= 4.0 (refresher hours since the last certification)"
          - "guard.equipment_complete == true"
        side_effects:
          - "overwrites guard.certified_on and guard.certification_expires_on"
          - "resets guard.hours_since_last_certification to 0"
        note: "Self-loop recertification; this is what makes the certification dimension cyclic without adding a state."
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /srts/absence-reports (system side effect when the reliability floor is breached)"
        actor: system
        preconditions:
          - "the AbsenceReport was created successfully"
          - "the recomputed guard.reliability_score_rolling_90d < 75.00 (strict)"
          - "guard.certification_status == CERTIFIED"
        side_effects:
          - "sets guard.certification_status = SUSPENDED and guard.suspension_reason = RELIABILITY_BREACH"
          - "CASCADE: every PostAssignment of this guard with status IN {SCHEDULED, ACTIVE} transitions to VACATED with vacated_reason = GUARD_SUSPENDED"
          - "CASCADE (caused by the previous link): guard.duty_status ASSIGNED -> UNASSIGNED once no non-terminal assignment remains"
          - "CASCADE (caused by the vacated assignments): each affected GuardPost recomputes coverage_status, and each affected School recomputes its post counts and coverage_posture"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /srts/guards/{id}/certify (reinstatement)"
        actor: CrossingSupervisor
        preconditions:
          - "guard.certification_status == SUSPENDED"
          - "guard.reliability_score_rolling_90d >= 75.00 evaluated against the current logical clock"
          - "guard.equipment_complete == true"
        side_effects:
          - "sets guard.certification_status = CERTIFIED, clears guard.suspension_reason to null"
          - "overwrites guard.certified_on and guard.certification_expires_on"
          - "resets guard.hours_since_last_certification to 0"
        note: "Reinstatement becomes reachable only after the logical clock advances far enough that the offending absences fall out of the 90-day window."

  - entity: Guard
    state_field: duty_status
    initial_state: UNASSIGNED
    terminal_states: []
    shape: branching
    note: "Dimension 2 of 2 on the same Guard row, independent of certification_status."
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /srts/guard-posts/{id}/assignments (system side effect)"
        actor: system
        preconditions:
          - "the PostAssignment was created successfully"
          - "guard.duty_status == UNASSIGNED"
        side_effects:
          - "sets guard.duty_status = ASSIGNED"
      - from: ASSIGNED
        to: UNASSIGNED
        trigger: "system, when the guard's last non-terminal PostAssignment becomes ENDED, VACATED or SUPERSEDED"
        actor: system
        preconditions:
          - "guard holds zero PostAssignment rows with status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "sets guard.duty_status = UNASSIGNED"
      - from: UNASSIGNED
        to: ON_LEAVE
        trigger: "POST /srts/guards/{id}/duty-status with duty_action = ON_LEAVE"
        actor: CrossingSupervisor
        preconditions:
          - "guard.duty_status IN {UNASSIGNED, ASSIGNED}"
        side_effects:
          - "sets guard.duty_status = ON_LEAVE, which removes the guard from every future substitute candidate set"
      - from: ASSIGNED
        to: ON_LEAVE
        trigger: "POST /srts/guards/{id}/duty-status with duty_action = ON_LEAVE"
        actor: CrossingSupervisor
        preconditions:
          - "guard.duty_status IN {UNASSIGNED, ASSIGNED}"
        side_effects:
          - "sets guard.duty_status = ON_LEAVE"
          - "leaves every PostAssignment of the guard untouched (the dimensions are independent)"
      - from: ON_LEAVE
        to: ASSIGNED
        trigger: "POST /srts/guards/{id}/duty-status with duty_action = RETURN (guard still holds an assignment)"
        actor: CrossingSupervisor
        preconditions:
          - "guard.duty_status == ON_LEAVE"
          - "guard holds >= 1 PostAssignment with status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "sets guard.duty_status = ASSIGNED"
      - from: ON_LEAVE
        to: UNASSIGNED
        trigger: "POST /srts/guards/{id}/duty-status with duty_action = RETURN (guard holds no assignment)"
        actor: CrossingSupervisor
        preconditions:
          - "guard.duty_status == ON_LEAVE"
          - "guard holds zero PostAssignment rows with status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "sets guard.duty_status = UNASSIGNED"
        note: "Fork on return: the target state is a function of the guard's assignment set, not of the request body."

  - entity: GuardPost
    state_field: status
    initial_state: PROPOSED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /srts/guard-posts/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "post.status IN {PROPOSED, SUSPENDED}"
          - "parent Intersection.warrant_status IN {WARRANTED, CONDITIONAL}"
          - "if Intersection.warrant_status == CONDITIONAL then post.required_shift == AM"
        side_effects:
          - "sets post.status = ACTIVE, post.activated_at = logical clock, clears post.suspension_reason to null"
          - "increments post.version by 1 (OCC anchor of concurrency_rules assignment-create-stale-post)"
          - "recomputes School.active_post_count, covered_post_count, uncovered_post_count, coverage_rate_pct and coverage_posture; a freshly activated post has coverage_status == UNSTAFFED and therefore counts as uncovered"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /srts/guard-posts/{id}/activate (reactivation after a warrant is re-established)"
        actor: ProgramAdmin
        preconditions:
          - "post.status IN {PROPOSED, SUSPENDED}"
          - "parent Intersection.warrant_status IN {WARRANTED, CONDITIONAL}"
          - "if Intersection.warrant_status == CONDITIONAL then post.required_shift == AM"
        side_effects:
          - "identical to the PROPOSED -> ACTIVE side-effect set"
        note: "Reactivation loop."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /srts/warrant-studies/{id}/finalize (system cascade when the intersection stops being warranted for this post's shift)"
        actor: system
        preconditions:
          - "post.status == ACTIVE"
          - "parent Intersection.warrant_status == NOT_WARRANTED, or Intersection.warrant_status == CONDITIONAL and post.required_shift IN {PM, BOTH}"
        side_effects:
          - "sets post.status = SUSPENDED and post.suspension_reason = WARRANT_LAPSED"
          - "CASCADE (caused by leaving ACTIVE): every PostAssignment on the post with status IN {SCHEDULED, ACTIVE} transitions to VACATED with vacated_reason = POST_SUSPENDED"
          - "recomputes post.coverage_status and the owning School's post counts and coverage_posture"

  - entity: PostAssignment
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [ENDED, VACATED, SUPERSEDED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /srts/_clock/set_current_utc (checkpoint sweep)"
        actor: system
        preconditions:
          - "assignment.status == SCHEDULED"
          - "assignment.start_date <= new logical clock date <= assignment.end_date"
        side_effects:
          - "sets assignment.status = ACTIVE"
        note: "Assignments are swept in ascending (start_date, created_at) order so the sweep is deterministic."
      - from: ACTIVE
        to: ENDED
        trigger: "POST /srts/_clock/set_current_utc (checkpoint sweep)"
        actor: system
        preconditions:
          - "assignment.status == ACTIVE"
          - "assignment.end_date < new logical clock date"
        side_effects:
          - "sets assignment.status = ENDED"
          - "CASCADE (caused by the assignment becoming terminal): guard.duty_status ASSIGNED -> UNASSIGNED when the guard holds no other assignment with status IN {SCHEDULED, ACTIVE}"
          - "recomputes the post's coverage_status and the School's post counts and coverage_posture"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "POST /srts/guard-posts/{id}/assignments (a new assignment starts at or before this one)"
        actor: system
        preconditions:
          - "existing.status IN {SCHEDULED, ACTIVE}"
          - "existing.guard_post_id == new.guard_post_id AND shift windows conflict AND date ranges overlap (closed intervals)"
          - "new.start_date <= existing.start_date"
        side_effects:
          - "sets existing.status = SUPERSEDED"
          - "CASCADE: the superseded assignment's guard transitions duty_status ASSIGNED -> UNASSIGNED when no other non-terminal assignment remains"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /srts/guard-posts/{id}/assignments (a new assignment starts at or before this one)"
        actor: system
        preconditions:
          - "existing.status IN {SCHEDULED, ACTIVE}"
          - "new.start_date <= existing.start_date"
        side_effects:
          - "identical to the SCHEDULED -> SUPERSEDED side-effect set"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /srts/guard-posts/{id}/assignments (a new assignment starts strictly after this one — truncation branch)"
        actor: system
        preconditions:
          - "existing.status IN {SCHEDULED, ACTIVE}"
          - "existing.guard_post_id == new.guard_post_id AND shift windows conflict AND date ranges overlap"
          - "new.start_date > existing.start_date"
        side_effects:
          - "sets existing.end_date = new.start_date minus one day; status is left unchanged"
          - "increments existing.version by 1"
        note: "The two supersede branches are the fork of this machine: whether the incumbent is truncated or terminated is decided purely by start_date ordering."
      - from: SCHEDULED
        to: VACATED
        trigger: "system cascade from GuardPost ACTIVE -> SUSPENDED or Guard CERTIFIED -> SUSPENDED"
        actor: system
        preconditions:
          - "assignment.status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "sets assignment.status = VACATED and vacated_reason = POST_SUSPENDED or GUARD_SUSPENDED"
          - "CASCADE: guard.duty_status ASSIGNED -> UNASSIGNED when no other non-terminal assignment remains"
      - from: ACTIVE
        to: VACATED
        trigger: "system cascade from GuardPost ACTIVE -> SUSPENDED or Guard CERTIFIED -> SUSPENDED"
        actor: system
        preconditions:
          - "assignment.status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "identical to the SCHEDULED -> VACATED side-effect set"

  - entity: AbsenceReport
    state_field: status
    initial_state: DISPATCH_PENDING
    terminal_states: [COVERED, RESCINDED]
    shape: cyclic
    transitions:
      - from: DISPATCH_PENDING
        to: OFFER_OUT
        trigger: "POST /srts/absence-reports/{id}/dispatch (candidate pool non-empty)"
        actor: CrossingSupervisor
        preconditions:
          - "absence.status IN {DISPATCH_PENDING, UNCOVERED_GAP}, or absence.status == OFFER_OUT with logical clock > absence.current_offer_expires_at"
          - "the substitute candidate set defined in calculations.substitute_selector is non-empty"
        side_effects:
          - "appends an offer object to absence.dispatch_offers with attempt_number = absence.dispatch_attempt_count + 1, offered_guard_id = the selected guard, offer_expires_at = logical clock + 45 minutes, offer_status = OPEN"
          - "increments absence.dispatch_attempt_count by 1"
          - "sets absence.current_offer_guard_id and absence.current_offer_expires_at"
          - "sets absence.status = OFFER_OUT"
      - from: UNCOVERED_GAP
        to: OFFER_OUT
        trigger: "POST /srts/absence-reports/{id}/dispatch (retry after a gap, pool now non-empty)"
        actor: CrossingSupervisor
        preconditions:
          - "absence.status IN {DISPATCH_PENDING, UNCOVERED_GAP}"
          - "the candidate set is non-empty"
        side_effects:
          - "identical to the DISPATCH_PENDING -> OFFER_OUT side-effect set"
          - "recomputes the post's coverage_status (the gap is still open until the offer is accepted, so coverage_status stays UNCOVERED)"
      - from: OFFER_OUT
        to: OFFER_OUT
        trigger: "POST /srts/absence-reports/{id}/dispatch (the OPEN offer has expired against the logical clock)"
        actor: CrossingSupervisor
        preconditions:
          - "absence.status == OFFER_OUT"
          - "logical clock > absence.current_offer_expires_at"
          - "the candidate set (which now excludes the lapsed recipient) is non-empty"
        side_effects:
          - "rewrites the lapsed offer's offer_status from OPEN to EXPIRED"
          - "appends absence.current_offer_guard_id to absence.excluded_guard_ids"
          - "selects the next candidate, appends a new OPEN offer, increments absence.dispatch_attempt_count by 1, and refreshes current_offer_guard_id / current_offer_expires_at"
        note: "Self-loop; the offer-expiry re-offer round. No state field changes but the offer ledger and the exclusion set advance, which is what makes the loop observable."
      - from: OFFER_OUT
        to: DISPATCH_PENDING
        trigger: "POST /srts/absence-reports/{id}/offer-response with response = DECLINE"
        actor: CrossingGuard
        preconditions:
          - "absence.status == OFFER_OUT"
          - "X-User-ID == absence.current_offer_guard_id"
          - "logical clock <= absence.current_offer_expires_at"
        side_effects:
          - "rewrites the OPEN offer's offer_status to DECLINED"
          - "appends the declining guard's id to absence.excluded_guard_ids"
          - "clears absence.current_offer_guard_id and absence.current_offer_expires_at to null"
          - "sets absence.status = DISPATCH_PENDING"
        note: "Decline loop; dispatch_attempt_count is NOT decremented, so the attempt penalty in calculations.substitute_cost grows with each round."
      - from: OFFER_OUT
        to: COVERED
        trigger: "POST /srts/absence-reports/{id}/offer-response with response = ACCEPT"
        actor: CrossingGuard
        preconditions:
          - "absence.status == OFFER_OUT"
          - "X-User-ID == absence.current_offer_guard_id"
          - "logical clock <= absence.current_offer_expires_at"
        side_effects:
          - "rewrites the OPEN offer's offer_status to ACCEPTED"
          - "sets absence.substitute_guard_id = the accepting guard and absence.status = COVERED"
          - "sets absence.substitute_cost_cents per calculations.substitute_cost"
          - "clears absence.current_offer_guard_id and absence.current_offer_expires_at to null"
          - "CASCADE link 1: the parent PostAssignment's open_absence_count drops by 1 and coverage_state returns to STAFFED when it reaches 0"
          - "CASCADE link 2 (caused by link 1): the GuardPost's open_gap_count drops by 1 and coverage_status returns to COVERED when it reaches 0"
          - "CASCADE link 3 (caused by link 2): the School's covered_post_count / uncovered_post_count / coverage_rate_pct / coverage_posture are recomputed"
          - "CASCADE link 4 (caused by link 3, only when coverage_posture leaves SUSPENDED): every WalkingRoute of that school with status == ADVISORY_HOLD returns to PUBLISHED and hold_reason is cleared to null"
      - from: DISPATCH_PENDING
        to: UNCOVERED_GAP
        trigger: "POST /srts/absence-reports/{id}/dispatch (candidate pool empty)"
        actor: CrossingSupervisor
        preconditions:
          - "absence.status IN {DISPATCH_PENDING, UNCOVERED_GAP}"
          - "the candidate set defined in calculations.substitute_selector is EMPTY"
        side_effects:
          - "sets absence.status = UNCOVERED_GAP; no offer object is appended and dispatch_attempt_count is unchanged"
          - "the post's open_gap_count is unchanged (an UNCOVERED_GAP absence still counts as an open gap), so coverage_status stays UNCOVERED"
        note: "Empty-pool fallback of the selector; returns 200 with the absence, not an error, so the empty-set boundary is directly observable."
      - from: DISPATCH_PENDING
        to: RESCINDED
        trigger: "POST /srts/absence-reports/{id}/rescind"
        actor: CrossingSupervisor
        preconditions:
          - "absence.status IN {DISPATCH_PENDING, OFFER_OUT, UNCOVERED_GAP}"
        side_effects:
          - "sets absence.status = RESCINDED and stores rescind_reason"
          - "rewrites any OPEN offer's offer_status to EXPIRED and clears current_offer_guard_id / current_offer_expires_at"
          - "COMPENSATION link 1: the parent PostAssignment's open_absence_count drops by 1 and coverage_state returns to STAFFED at 0"
          - "COMPENSATION link 2 (caused by link 1): the GuardPost's open_gap_count drops by 1 and coverage_status returns to COVERED at 0"
          - "COMPENSATION link 3 (caused by link 2): the School's covered_post_count / uncovered_post_count / coverage_rate_pct / coverage_posture are recomputed"
          - "COMPENSATION link 4 (caused by link 3): every ADVISORY_HOLD WalkingRoute of that school returns to PUBLISHED once coverage_posture leaves SUSPENDED"
          - "recomputes the guard's reliability_score_rolling_90d and reliability_score_season_to_date, which both exclude RESCINDED absences"
      - from: OFFER_OUT
        to: RESCINDED
        trigger: "POST /srts/absence-reports/{id}/rescind"
        actor: CrossingSupervisor
        preconditions:
          - "absence.status IN {DISPATCH_PENDING, OFFER_OUT, UNCOVERED_GAP}"
        side_effects:
          - "identical to the DISPATCH_PENDING -> RESCINDED side-effect set"
      - from: UNCOVERED_GAP
        to: RESCINDED
        trigger: "POST /srts/absence-reports/{id}/rescind"
        actor: CrossingSupervisor
        preconditions:
          - "absence.status IN {DISPATCH_PENDING, OFFER_OUT, UNCOVERED_GAP}"
        side_effects:
          - "identical to the DISPATCH_PENDING -> RESCINDED side-effect set"

  - entity: School
    state_field: coverage_posture
    initial_state: OPEN
    terminal_states: []
    shape: compound
    note: "Derived aggregate over the school's ACTIVE guard posts; every transition is a system recomputation, never a direct client action."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system recomputation after any change to a GuardPost.coverage_status or GuardPost.status under this school"
        actor: system
        preconditions:
          - "uncovered_post_count >= 1 AND coverage_rate_pct >= 50.00"
        side_effects:
          - "sets school.coverage_posture = RESTRICTED"
      - from: OPEN
        to: SUSPENDED
        trigger: "system recomputation after any change to a GuardPost.coverage_status or GuardPost.status under this school"
        actor: system
        preconditions:
          - "coverage_rate_pct < 50.00 (strict)"
        side_effects:
          - "sets school.coverage_posture = SUSPENDED"
          - "CASCADE (caused by entering SUSPENDED): every WalkingRoute of this school with status == PUBLISHED transitions to ADVISORY_HOLD with hold_reason = SCHOOL_COVERAGE_SUSPENDED"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system recomputation"
        actor: system
        preconditions:
          - "coverage_rate_pct < 50.00"
        side_effects:
          - "sets school.coverage_posture = SUSPENDED"
          - "CASCADE: PUBLISHED WalkingRoutes of this school transition to ADVISORY_HOLD with hold_reason = SCHOOL_COVERAGE_SUSPENDED"
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system recomputation"
        actor: system
        preconditions:
          - "uncovered_post_count >= 1 AND coverage_rate_pct >= 50.00"
        side_effects:
          - "sets school.coverage_posture = RESTRICTED"
          - "CASCADE: every WalkingRoute of this school with status == ADVISORY_HOLD returns to PUBLISHED and hold_reason is cleared"
      - from: RESTRICTED
        to: OPEN
        trigger: "system recomputation"
        actor: system
        preconditions:
          - "uncovered_post_count == 0"
        side_effects:
          - "sets school.coverage_posture = OPEN"
      - from: SUSPENDED
        to: OPEN
        trigger: "system recomputation"
        actor: system
        preconditions:
          - "uncovered_post_count == 0"
        side_effects:
          - "sets school.coverage_posture = OPEN"
          - "CASCADE: every ADVISORY_HOLD WalkingRoute of this school returns to PUBLISHED and hold_reason is cleared"

  - entity: WalkingRoute
    state_field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /srts/walking-routes/{id}/publish"
        actor: SchoolLiaison
        preconditions:
          - "route.status == DRAFT"
          - "every segment with hazard_type == UNCONTROLLED_CROSSING and mitigated == false has a non-null intersection_id whose Intersection.warrant_status IN {WARRANTED, CONDITIONAL}"
          - "every segment with a non-null intersection_id references an Intersection whose school_id == route.school_id"
          - "route.hazard_score <= 25.00"
        side_effects:
          - "sets route.status = PUBLISHED and route.published_at = logical clock"
          - "any OTHER route of the same school with the same route_code and status IN {PUBLISHED, ADVISORY_HOLD} transitions to RETIRED (supersede)"
      - from: PUBLISHED
        to: ADVISORY_HOLD
        trigger: "system cascade when the owning School.coverage_posture enters SUSPENDED"
        actor: system
        preconditions:
          - "route.status == PUBLISHED"
          - "school.coverage_posture == SUSPENDED"
        side_effects:
          - "sets route.status = ADVISORY_HOLD and route.hold_reason = SCHOOL_COVERAGE_SUSPENDED"
      - from: ADVISORY_HOLD
        to: PUBLISHED
        trigger: "system cascade when the owning School.coverage_posture leaves SUSPENDED"
        actor: system
        preconditions:
          - "route.status == ADVISORY_HOLD"
          - "school.coverage_posture IN {OPEN, RESTRICTED}"
        side_effects:
          - "sets route.status = PUBLISHED and clears route.hold_reason to null"
        note: "Hold/release loop; a route may cycle through ADVISORY_HOLD any number of times."
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /srts/walking-routes/{id}/publish on a newer route carrying the same route_code for the same school"
        actor: system
        preconditions:
          - "route.status IN {PUBLISHED, ADVISORY_HOLD}"
          - "another route of the same school with the same route_code was just published"
        side_effects:
          - "sets route.status = RETIRED"
      - from: ADVISORY_HOLD
        to: RETIRED
        trigger: "POST /srts/walking-routes/{id}/publish on a newer route carrying the same route_code for the same school"
        actor: system
        preconditions:
          - "route.status IN {PUBLISHED, ADVISORY_HOLD}"
        side_effects:
          - "sets route.status = RETIRED and clears hold_reason to null"

  - entity: Complaint
    state_field: status
    initial_state: RECEIVED
    terminal_states: [CLOSED_NO_ACTION]
    shape: cyclic
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /srts/complaints/{id}/triage with disposition = REFER_TO_ENGINEERING"
        actor: TrafficEngineer
        preconditions:
          - "complaint.status == RECEIVED"
        side_effects:
          - "sets complaint.status = TRIAGED, disposition = REFER_TO_ENGINEERING, triaged_by_user_id = X-User-ID, triage_note"
          - "the parent Intersection.open_complaint_count is unchanged (TRIAGED still counts as open)"
      - from: RECEIVED
        to: CLOSED_NO_ACTION
        trigger: "POST /srts/complaints/{id}/triage with disposition = CLOSE_NO_ACTION"
        actor: TrafficEngineer
        preconditions:
          - "complaint.status == RECEIVED"
        side_effects:
          - "sets complaint.status = CLOSED_NO_ACTION, disposition = CLOSE_NO_ACTION, triaged_by_user_id = X-User-ID"
          - "decrements the parent Intersection.open_complaint_count by 1"
      - from: TRIAGED
        to: REFERRED
        trigger: "POST /srts/infrastructure-projects citing this complaint via source_complaint_id"
        actor: system
        preconditions:
          - "complaint.status == TRIAGED AND complaint.disposition == REFER_TO_ENGINEERING"
          - "the new project's intersection_id == complaint.intersection_id"
        side_effects:
          - "sets complaint.status = REFERRED and complaint.referred_project_id = the new project's id"
      - from: REFERRED
        to: RESOLVED
        trigger: "POST /srts/infrastructure-projects/{id}/fund (system cascade)"
        actor: system
        preconditions:
          - "complaint.status == REFERRED"
          - "the funded project's source_complaint_id == complaint.id"
        side_effects:
          - "sets complaint.status = RESOLVED"
          - "CASCADE (caused by leaving the open set): decrements the parent Intersection.open_complaint_count by 1"
      - from: RESOLVED
        to: REFERRED
        trigger: "POST /srts/infrastructure-projects/{id}/withdraw-funding (compensating cascade)"
        actor: system
        preconditions:
          - "complaint.status == RESOLVED"
          - "the de-funded project's source_complaint_id == complaint.id"
        side_effects:
          - "sets complaint.status = REFERRED"
          - "COMPENSATION: increments the parent Intersection.open_complaint_count by 1, restoring the pre-funding value exactly"
        note: "Resolution loop; a complaint can be resolved and re-opened any number of times as funding is granted and withdrawn."

  - entity: InfrastructureProject
    state_field: status
    initial_state: PROPOSED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: PROPOSED
        to: SCORED
        trigger: "POST /srts/infrastructure-projects/{id}/score"
        actor: TrafficEngineer
        preconditions:
          - "project.status == PROPOSED"
          - "the project's Intersection.latest_warrant_score is not null (a determination has been finalized)"
        side_effects:
          - "sets project.referred_complaint_count_at_scoring, benefit_points, cost_factor and benefit_cost_score per calculations.project_benefit_cost_score"
          - "sets project.status = SCORED, which enters the project into the funding ranking pool"
      - from: SCORED
        to: FUNDED
        trigger: "POST /srts/infrastructure-projects/{id}/fund"
        actor: ProgramAdmin
        preconditions:
          - "project.status == SCORED"
          - "expected_grant_program_version matches GrantProgram.version"
          - "project is the top-ranked candidate per calculations.grant_funding_selector"
          - "project.requested_cost_cents <= GrantProgram.remaining_cents"
        side_effects:
          - "sets project.status = FUNDED, project.awarded_cents = project.requested_cost_cents, project.funded_at = logical clock"
          - "CASCADE link 1: GrantProgram.committed_cents increases by awarded_cents, remaining_cents decreases by the same amount, funded_project_count increases by 1, and version increments by 1"
          - "CASCADE link 2 (caused by link 1 reaching a zero balance): when GrantProgram.remaining_cents == 0, every other project of the program with status == SCORED transitions SCORED -> DEFERRED"
          - "CASCADE link 3 (caused by link 2): GrantProgram.deferred_project_count and next_cycle_carryover_cents are recomputed from the newly DEFERRED set"
          - "CASCADE (independent of the balance chain): when project.source_complaint_id is non-null, that Complaint transitions REFERRED -> RESOLVED, which in turn decrements Intersection.open_complaint_count by 1"
      - from: FUNDED
        to: SCORED
        trigger: "POST /srts/infrastructure-projects/{id}/withdraw-funding"
        actor: ProgramAdmin
        preconditions:
          - "project.status == FUNDED"
          - "expected_grant_program_version matches GrantProgram.version"
        side_effects:
          - "sets project.status = SCORED, project.awarded_cents = 0, stores withdrawal_reason; funded_at is retained as history"
          - "COMPENSATION link 1: GrantProgram.committed_cents decreases by the released amount, remaining_cents increases by the same amount, funded_project_count decreases by 1, version increments by 1"
          - "COMPENSATION link 2 (caused by link 1 restoring a positive balance): when GrantProgram.remaining_cents > 0, every project of the program with status == DEFERRED transitions DEFERRED -> SCORED"
          - "COMPENSATION link 3 (caused by link 2): GrantProgram.deferred_project_count and next_cycle_carryover_cents are recomputed"
          - "COMPENSATION: when project.source_complaint_id is non-null, that Complaint transitions RESOLVED -> REFERRED and Intersection.open_complaint_count is incremented by 1"
      - from: SCORED
        to: DEFERRED
        trigger: "POST /srts/infrastructure-projects/{id}/fund on a sibling project that exhausts the pool (system cascade)"
        actor: system
        preconditions:
          - "project.status == SCORED"
          - "GrantProgram.remaining_cents == 0 after the sibling award"
        side_effects:
          - "sets project.status = DEFERRED"
          - "the project leaves the funding ranking pool and its requested_cost_cents joins GrantProgram.next_cycle_carryover_cents"
      - from: DEFERRED
        to: SCORED
        trigger: "POST /srts/infrastructure-projects/{id}/withdraw-funding on a sibling project (system cascade)"
        actor: system
        preconditions:
          - "project.status == DEFERRED"
          - "GrantProgram.remaining_cents > 0 after the withdrawal"
        side_effects:
          - "sets project.status = SCORED, re-entering the ranking pool with its previously computed benefit_cost_score"
        note: "Deferral loop; the same project can be deferred and revived repeatedly as the pool balance moves."

concurrency_rules:
  - rule_id: study-create-stale-intersection
    parent_entity: Intersection
    write_endpoint: "POST /srts/warrant-studies"
    occ_field: "expected_intersection_version"
    description: |
      Creating a WarrantStudy against an Intersection whose version has advanced
      since the client last observed it is rejected. A new study legitimately
      supersedes the intersection's prior warrant picture (it rewrites
      latest_warrant_score, warrant_status and study_count on finalization), so
      a writer holding a stale view of the intersection would silently base its
      count window and crash lookback on an outdated warrant history. The stale
      expected_intersection_version makes that staleness explicit and refusable.
    error_id: ERR_STALE_INTERSECTION_VERSION
    http_status: 412
  - rule_id: assignment-create-stale-post
    parent_entity: GuardPost
    write_endpoint: "POST /srts/guard-posts/{id}/assignments"
    occ_field: "expected_guard_post_version"
    description: |
      Creating a PostAssignment against a GuardPost whose version has advanced
      since the client last observed it is rejected. Each new assignment
      legitimately changes the post's staffing picture (coverage_status,
      open_gap_count and the overlap surface every later assignment is checked
      against), so a writer whose expected_guard_post_version is behind the
      stored version is reasoning about a roster that no longer exists.
    error_id: ERR_STALE_GUARD_POST_VERSION
    http_status: 412
  - rule_id: project-fund-stale-grant-program
    parent_entity: GrantProgram
    write_endpoint: "POST /srts/infrastructure-projects/{id}/fund"
    occ_field: "expected_grant_program_version"
    description: |
      Awarding grant funds to an InfrastructureProject when the supplied
      expected_grant_program_version is behind the stored GrantProgram.version
      is rejected. Every award and every withdrawal moves committed_cents and
      remaining_cents and bumps the program version, so a writer holding a stale
      version is deciding against a balance and a ranking pool that have already
      moved. The same OCC field guards
      POST /srts/infrastructure-projects/{id}/withdraw-funding.
    error_id: ERR_STALE_GRANT_PROGRAM_VERSION
    http_status: 412

calculations:
  - name: warrant_score
    trigger: "POST /srts/warrant-studies/{id}/analyze — recomputed from scratch on every analyze call, including analyze after reopen-counting"
    algorithm: weighted_scoring
    input_set: |
      Pedestrian and traffic terms are aggregated over study.count_sessions where
      voided == false AND period IN {AM_ARRIVAL, PM_DISMISSAL}. Sessions with
      period == MIDDAY are EXCLUDED from every term even though they are stored and
      returned, and voided sessions are excluded regardless of period.
        PC = sum(child_count)      over the included sessions
        AG = sum(adequate_gaps)    over the included sessions
        V  = sum(vehicle_count)    over the included sessions
      Crash terms are aggregated over intersection.crash_history where
      involved_pedestrian == true AND crash_date is within the closed window
      [study.count_window_end - 1095 days, study.count_window_end] (BOTH ends
      inclusive; a crash exactly 1095 days before the window end is INCLUDED, a
      crash 1096 days before is excluded).
        CP = count of those crashes
        CS = count of those crashes whose severity IN {SEVERE_INJURY, FATAL}
      Severe crashes are counted in BOTH CP and CS (CS is a subset of CP, not a
      partition), so a single FATAL pedestrian crash contributes 5.0 + 10.0 = 15.0
      to crash_term.
    formula: |
      speed_multiplier = 1.30 if intersection.speed_limit_mph >= 35
                    else 1.15 if intersection.speed_limit_mph >= 30
                    else 1.00

      gap_deficit_ratio = round_half_up(max(0.0, 1.0 - AG / max(1, PC)), 4)
      crash_term        = min(25.0, 5.0 * CP + 10.0 * CS)

      # --- variant GAP_ADEQUACY (control_type == UNCONTROLLED) ---
      exposure_term = min(40.0, PC * V / 10000.0)
      raw           = (45.0 * gap_deficit_ratio + exposure_term + crash_term) * speed_multiplier

      # --- variant EXPOSURE_INDEX (control_type IN {STOP_SIGN, SIGNALIZED}) ---
      exposure_term = min(55.0, PC * V / 8000.0)
      gap_term      = min(20.0, 20.0 * max(0.0, 1.0 - AG / max(1, PC)))
      raw           = (gap_term + exposure_term + crash_term) * speed_multiplier

      warrant_score = round_half_up(min(100.0, raw), 2)
      # Persisted alongside the score on the study:
      #   included_child_count             = PC
      #   included_adequate_gaps           = AG
      #   included_vehicle_count           = V
      #   pedestrian_crash_count_3yr       = CP
      #   severe_pedestrian_crash_count_3yr = CS
    constants:
      CRASH_LOOKBACK_DAYS: 1095
      GAP_WEIGHT_UNCONTROLLED: 45.0
      GAP_WEIGHT_CONTROLLED: 20.0
      EXPOSURE_DIVISOR_UNCONTROLLED: 10000.0
      EXPOSURE_DIVISOR_CONTROLLED: 8000.0
      EXPOSURE_CAP_UNCONTROLLED: 40.0
      EXPOSURE_CAP_CONTROLLED: 55.0
      GAP_CAP_CONTROLLED: 20.0
      CRASH_POINTS_PEDESTRIAN: 5.0
      CRASH_POINTS_SEVERE_EXTRA: 10.0
      CRASH_TERM_CAP: 25.0
      SPEED_MULT_HIGH: 1.30
      SPEED_MULT_MID: 1.15
      SPEED_MULT_BASE: 1.00
      SPEED_THRESHOLD_HIGH_MPH: 35
      SPEED_THRESHOLD_MID_MPH: 30
      SCORE_CAP: 100.0
    precision: "gap_deficit_ratio to 4 decimal places, round_half_up; warrant_score to 2 decimal places, round_half_up. All arithmetic in exact decimal (no binary float accumulation)."
    variants:
      - name: GAP_ADEQUACY
        when: "intersection.control_type == UNCONTROLLED"
        difference: |
          Gap deficiency dominates: the gap term carries weight 45.0 uncapped by an
          independent ceiling, while exposure is divided by 10000 and capped at 40.0.
          An uncontrolled crossing with poor gaps scores far higher than the same
          counts at a controlled crossing.
      - name: EXPOSURE_INDEX
        when: "intersection.control_type IN {STOP_SIGN, SIGNALIZED}"
        difference: |
          Volume exposure dominates: exposure is divided by 8000 (a 25% larger term
          per unit of PC*V) and capped at 55.0, while the gap contribution is
          collapsed to at most 20.0. Identical count sessions and crash history
          therefore produce a materially different score under the two variants —
          the divergence is the point, not an artifact.
    variant_selection: "Chosen solely by intersection.control_type at analyze time; recorded on the study as scoring_variant so a later control_type change does not retroactively rewrite a finalized score."

  - name: warrant_determination
    trigger: "POST /srts/warrant-studies/{id}/analyze, immediately after warrant_score is computed"
    algorithm: threshold
    input_set: "The single WarrantStudy just analyzed — its warrant_score and pedestrian_crash_count_3yr."
    formula: |
      if warrant_score >= 60.00:
          determination = WARRANTED
      elif warrant_score >= 40.00 and pedestrian_crash_count_3yr >= 1:
          determination = CONDITIONAL
      else:
          determination = NOT_WARRANTED
      # Exactly 60.00 is WARRANTED (>= is inclusive at the boundary);
      # 59.99 with one pedestrian crash is CONDITIONAL;
      # 59.99 with zero pedestrian crashes is NOT_WARRANTED.
      # The determination is stored on the study at analyze time. On finalize it
      # is projected onto the parent intersection:
      #   intersection.warrant_status       = study.determination
      #   intersection.latest_warrant_score = study.warrant_score
      # (latest_warrant_score reads the most recently finalized study by
      #  created_at DESC, so re-finalizing an older study never wins.)
    constants:
      WARRANT_THRESHOLD: 60.00
      CONDITIONAL_THRESHOLD: 40.00
      CONDITIONAL_MIN_PEDESTRIAN_CRASHES: 1
    precision: "Comparisons on the already-rounded 2-decimal warrant_score; no re-rounding."

  - name: guard_reliability_score
    trigger: "Recomputed whenever an AbsenceReport for the guard is created, rescinded or covered, and whenever the logical clock advances (which can age absences out of the rolling window)"
    algorithm: decay_function
    input_set: |
      Per variant (see variants). Both variants exclude AbsenceReport rows with
      status == RESCINDED — a rescinded absence never counts against a guard.
      COVERED absences DO still count (the guard was still absent; a substitute
      merely filled in).
    formula: |
      base            = 100.0
      training_bonus  = min(10.0, floor(guard.training_hours_completed / 4) * 1.0)

      # ROLLING_90D variant
      penalty = 4.0 * absence_count + 6.0 * unexcused_count

      # SEASON_TO_DATE variant
      penalty = 2.5 * absence_count + 7.5 * unexcused_count

      score = round_half_up(max(0.0, min(100.0, base - penalty + training_bonus)), 2)
      # unexcused_count counts the subset of absence_count whose reason == UNEXCUSED;
      # an unexcused absence is therefore charged BOTH coefficients
      # (ROLLING_90D: 4.0 + 6.0 = 10.0 per unexcused absence).
    constants:
      BASE_SCORE: 100.0
      ROLLING_WINDOW_DAYS: 90
      ROLLING_ABSENCE_PENALTY: 4.0
      ROLLING_UNEXCUSED_PENALTY: 6.0
      SEASON_ABSENCE_PENALTY: 2.5
      SEASON_UNEXCUSED_PENALTY: 7.5
      TRAINING_BONUS_HOURS_PER_POINT: 4
      TRAINING_BONUS_CAP: 10.0
      SUSPENSION_THRESHOLD: 75.00
    precision: "2 decimal places, round_half_up; training_bonus uses integer floor division on training_hours_completed."
    variants:
      - name: ROLLING_90D
        when: "Stored as guard.reliability_score_rolling_90d. This is the variant the certification state machine reads: CERTIFIED -> SUSPENDED fires when it drops below 75.00 (strict <), and SUSPENDED -> CERTIFIED reinstatement requires >= 75.00."
        difference: |
          Input set is absences whose created_at falls in the closed window
          [logical_clock_now - 90 days, logical_clock_now] — anchored on created_at
          (the logical clock at report time), NOT on absence_date, so a report filed
          for a future school day counts immediately and ages out 90 days after it
          was filed. Coefficients 4.0 / 6.0 make recent unexcused absences bite hard:
          three unexcused absences alone (penalty 30.0) drop an untrained guard to
          70.00 and trip suspension.
      - name: SEASON_TO_DATE
        when: "Stored as guard.reliability_score_season_to_date. This is the ranking key of the substitute selector."
        difference: |
          Input set is absences whose absence_date falls in the closed window
          [school.session_start_date, school.session_end_date] of the school the
          absence belongs to (resolved absence -> post_assignment -> guard_post ->
          intersection -> school), with no reference to the logical clock, so this
          variant never ages anything out mid-season. Coefficients 2.5 / 7.5 forgive
          excused absences more and punish unexcused ones harder, so the two variants
          rank the same guard differently: a guard with three excused absences scores
          72.00 rolling (suspended) but 92.50 season-to-date, while a guard with one
          unexcused absence scores 90.00 rolling and 90.00 season-to-date.
    variant_selection: "Both variants are always maintained on the Guard; consumers pick by purpose — the certification gate reads ROLLING_90D, the substitute selector reads SEASON_TO_DATE. Neither is ever substituted for the other."

  - name: route_hazard_score
    trigger: "POST /srts/walking-routes — computed once at creation from the submitted segments array. segments are immutable, so hazard_score is never recomputed; POST /srts/walking-routes/{id}/publish reads the stored value when it applies the 25.00 ceiling."
    algorithm: aggregation
    input_set: |
      All objects in route.segments, processed in ascending segment_order.
      Segments with mitigated == true contribute exactly 0.00 and are still
      traversed (they do not shift the ordering of the others).
    formula: |
      HAZARD_WEIGHTS = {
        NO_SIDEWALK:            1.25,
        UNCONTROLLED_CROSSING:  3.50,
        HIGH_SPEED_ARTERIAL:    2.75,
        RAIL_CROSSING:          4.00,
        DRIVEWAY_CONFLICT:      0.85,
        POOR_LIGHTING:          0.60,
      }

      # PINNED evaluation order: round EACH segment to 2 decimals FIRST,
      # then sum the already-rounded per-segment values, then round the sum.
      total = 0.00
      for seg in sorted(route.segments, key=segment_order ASC):
          if seg.mitigated:
              seg_score = 0.00
          else:
              seg_score = round_half_up(
                  HAZARD_WEIGHTS[seg.hazard_type] * seg.length_ft / 100.0, 2)
          total = total + seg_score                 # per-segment value is not persisted
      route.hazard_score = round_half_up(total, 2)
    constants:
      WEIGHT_NO_SIDEWALK: 1.25
      WEIGHT_UNCONTROLLED_CROSSING: 3.50
      WEIGHT_HIGH_SPEED_ARTERIAL: 2.75
      WEIGHT_RAIL_CROSSING: 4.00
      WEIGHT_DRIVEWAY_CONFLICT: 0.85
      WEIGHT_POOR_LIGHTING: 0.60
      LENGTH_DIVISOR_FT: 100.0
      HAZARD_SCORE_PUBLISH_CEILING: 25.00
    precision: |
      2 decimal places, round_half_up, applied TWICE — once per segment and once to
      the sum. This is deliberately not equivalent to rounding only the total: three
      NO_SIDEWALK segments of 133 ft each give 1.25*133/100 = 1.6625 -> 1.66 per
      segment -> 4.98, whereas summing raw and rounding once gives 4.9875 -> 4.99.
      The per-segment-first order is normative; 4.98 is the correct answer.

  - name: substitute_cost
    trigger: "POST /srts/absence-reports/{id}/offer-response with response = ACCEPT, at the moment the absence transitions OFFER_OUT -> COVERED"
    algorithm: tiered_pricing
    input_set: |
      The single AbsenceReport being covered — its pinned shift, urgency_tier and
      dispatch_attempt_count.  All school-window and early-dismissal inputs were
      already folded into urgency_tier at creation. Only absences that actually reach COVERED
      carry a substitute_cost_cents; RESCINDED and UNCOVERED_GAP absences leave it
      null.
    formula: |
      # STEP ORDER IS PINNED. The fee tier keys on the value produced by step 6,
      # NOT on the final total produced by step 9 — a total that crosses 4000 does
      # not retroactively promote the fee tier. A single-shift SAME_DAY absence on its
      # second dispatch attempt has subtotal 3746 (fee tier LOW, fee 187) and total
      # 4183; keying the tier on the total instead would give fee 300 and total 4296.

      # 1. shift duration
      shift_hours = 1.50 if absence.shift IN {AM, PM} else 3.00   # BOTH -> 3.00
      # absence.shift is denormalized from GuardPost.required_shift at creation.

      # 2. base
      base_cents = round_half_up(GUARD_HOURLY_RATE_CENTS * shift_hours)

      # 3. notice horizon — READ from the absence, where it was pinned at creation
      #    time by absence.shift_start_utc / notice_hours / urgency_tier:
      #      shift_start_utc = absence_date combined with
      #        school.am_window_start_utc when shift IN {AM, BOTH}, or
      #        school.pm_window_start_utc when shift == PM, plus
      #        school.early_dismissal_pm_offset_minutes when shift == PM and
      #        absence_date is listed in school.early_dismissal_dates
      #      notice_hours = (shift_start_utc - absence.created_at) / 3600.0
      #      urgency_tier = SAME_DAY if notice_hours <  SAME_DAY_HOURS
      #                else SHORT    if notice_hours <  SHORT_HOURS
      #                else STANDARD
      urgency_tier = absence.urgency_tier
      # Exactly 12.0 hours of notice is SHORT, not SAME_DAY (strict <).
      # Exactly 48.0 hours of notice is STANDARD, not SHORT.
      # Negative notice (report filed after the shift began) is SAME_DAY.
      # Because the tier is pinned at creation, advancing the logical clock between
      # the report and the acceptance does NOT re-price the shift.

      # 4-5. surge
      surge_pct    = SURGE_PCT[urgency_tier]
      surge_cents  = round_half_up(base_cents * surge_pct)

      # 6. subtotal — THE FEE-TIER KEY
      subtotal_cents = base_cents + surge_cents

      # 7. administrative fee, keyed on subtotal_cents from step 6
      fee_pct         = ADMIN_FEE_PCT_HIGH if subtotal_cents >= FEE_TIER_THRESHOLD_CENTS
                        else ADMIN_FEE_PCT_LOW
      admin_fee_cents = round_half_up(subtotal_cents * fee_pct)

      # 8. repeat-dispatch penalty — every attempt after the first, including
      #    declines and expired offers, is charged
      attempt_penalty_cents = ATTEMPT_PENALTY_CENTS * max(0, absence.dispatch_attempt_count - 1)

      # 9. total
      total_cents = subtotal_cents + admin_fee_cents + attempt_penalty_cents
      # persisted as absence.substitute_cost_cents. The intermediate components are
      # not stored; the single total is the observable.
    constants:
      GUARD_HOURLY_RATE_CENTS: 1850
      SHIFT_HOURS_SINGLE: 1.50
      SHIFT_HOURS_BOTH: 3.00
      SAME_DAY_HOURS: 12
      SHORT_HOURS: 48
      SURGE_PCT_SAME_DAY: 0.35
      SURGE_PCT_SHORT: 0.15
      SURGE_PCT_STANDARD: 0.00
      FEE_TIER_THRESHOLD_CENTS: 4000
      ADMIN_FEE_PCT_HIGH: 0.08
      ADMIN_FEE_PCT_LOW: 0.05
      ATTEMPT_PENALTY_CENTS: 250
      OFFER_TTL_MINUTES: 45
    precision: "Integer cents throughout; every multiplication is rounded half-up to the nearest whole cent at the step in which it appears, never deferred to the end."

  - name: substitute_selector
    trigger: "POST /srts/absence-reports/{id}/dispatch"
    algorithm: chronological
    input_set: |
      All Guard rows, filtered to the eligible set, then ranked. Eligibility — a
      guard qualifies only if ALL hold:
        - guard.certification_status == CERTIFIED
        - guard.certification_expires_on >= absence.absence_date (inclusive; a
          certification expiring exactly on the absence date is still valid)
        - guard.duty_status IN {UNASSIGNED, ASSIGNED}   (ON_LEAVE is excluded)
        - guard.equipment_complete == true
        - guard.substitute_pool_optin == true
        - guard.id != absence.guard_id                 (the absent guard cannot cover)
        - guard.id NOT IN absence.excluded_guard_ids   (declined or lapsed already)
        - the guard has NO PostAssignment with status IN {SCHEDULED, ACTIVE} whose
          [start_date, end_date] closed interval contains absence.absence_date AND
          whose GuardPost.required_shift conflicts with the absent post's
          required_shift (BOTH conflicts with AM, PM and BOTH; AM conflicts only
          with AM and BOTH; PM conflicts only with PM and BOTH)
      If the eligible set is EMPTY the dispatch does NOT error: the absence moves
      to UNCOVERED_GAP and 200 is returned.
    formula: |
      rank key, applied in order:
        1. guard.reliability_score_season_to_date  DESC
        2. zone_match_flag                          DESC
             zone_match_flag = 1 when guard.home_zone_code == guard_post.zone_code
                               else 0
        3. guard.created_at                         ASC
      The rank-1 guard receives the offer. created_at is the terminal tie-break;
      guard.id is never consulted for ordering.
    constants:
      OFFER_TTL_MINUTES: 45
    precision: "Reliability compared at its stored 2-decimal precision; no re-rounding before comparison."

  - name: project_benefit_cost_score
    trigger: "POST /srts/infrastructure-projects/{id}/score"
    algorithm: weighted_scoring
    input_set: |
      The project's own requested_cost_cents and students_benefited, plus:
        - intersection.latest_warrant_score (must be non-null; a project on an
          intersection with no finalized study cannot be scored)
        - crash records in intersection.crash_history with
          involved_pedestrian == true whose crash_date falls in the closed window
          [clock_date - 1095 days, clock_date] where clock_date is the DATE part of
          the logical clock at scoring time
        - referred_complaint_count = the number of Complaints on the same
          intersection whose status IN {TRIAGED, REFERRED, RESOLVED}
          (RECEIVED and CLOSED_NO_ACTION are excluded)
    formula: |
      crash_severity_points = 3  * count(severity == PROPERTY_DAMAGE_ONLY)
                            + 8  * count(severity == INJURY)
                            + 15 * count(severity == SEVERE_INJURY)
                            + 25 * count(severity == FATAL)

      benefit_points = round_half_up(
            0.40 * intersection.latest_warrant_score
          + 0.25 * min(60.0, crash_severity_points)
          + 0.20 * min(50.0, students_benefited / 10.0)
          + 0.15 * min(30.0, 5.0 * referred_complaint_count)
        , 4)

      cost_factor        = max(1.00, requested_cost_cents / 5000000.0)
      benefit_cost_score = round_half_up(benefit_points / cost_factor, 2)
      # cost_factor floors at 1.00, so projects under $50,000 are never rewarded
      # for being cheap; above it, score falls linearly with cost.
      # referred_complaint_count is frozen onto the project as
      # referred_complaint_count_at_scoring, so a later complaint triage does not
      # silently re-rank an already-scored project until it is re-scored.
    constants:
      CRASH_LOOKBACK_DAYS: 1095
      POINTS_PROPERTY_DAMAGE_ONLY: 3
      POINTS_INJURY: 8
      POINTS_SEVERE_INJURY: 15
      POINTS_FATAL: 25
      WEIGHT_WARRANT: 0.40
      WEIGHT_CRASH: 0.25
      WEIGHT_STUDENTS: 0.20
      WEIGHT_COMPLAINTS: 0.15
      CAP_CRASH_POINTS: 60.0
      CAP_STUDENT_POINTS: 50.0
      CAP_COMPLAINT_POINTS: 30.0
      COMPLAINT_POINTS_EACH: 5.0
      STUDENTS_PER_POINT: 10.0
      COST_FACTOR_DIVISOR_CENTS: 5000000.0
      COST_FACTOR_FLOOR: 1.00
    precision: "benefit_points to 4 decimal places, round_half_up (so weight rounding does not drift before the division); benefit_cost_score to 2 decimal places, round_half_up."

  - name: grant_funding_selector
    trigger: "POST /srts/infrastructure-projects/{id}/fund — evaluated after the OCC check and after the project's own state precondition"
    algorithm: waterfall_allocation
    input_set: |
      Candidate pool = all InfrastructureProjects with
      grant_program_id == the target project's grant_program_id AND
      status == SCORED. PROPOSED, FUNDED and DEFERRED projects are excluded.
      The pool is never empty for a SCORED target, because the target is itself a
      member; a DEFERRED or PROPOSED target is rejected earlier by the priority-40
      state precondition, so the fund path needs no separate empty-pool error.
    formula: |
      rank the candidate pool by:
        1. benefit_cost_score    DESC
        2. requested_cost_cents  ASC     (cheaper project wins an exact score tie)
        3. created_at            ASC      (terminal tie-break; id is never used)

      if target != pool[0]:
          reject ERR_PROJECT_NOT_TOP_RANKED (409)
      if target.requested_cost_cents > program.remaining_cents:
          reject ERR_GRANT_FUNDS_EXHAUSTED (402)
      # requested_cost_cents == remaining_cents is ALLOWED and drives the balance
      # to exactly 0, which is what triggers the SCORED -> DEFERRED sweep.

      award:
        target.awarded_cents      = target.requested_cost_cents
        program.committed_cents  += target.awarded_cents
        program.remaining_cents  -= target.awarded_cents
        program.funded_project_count += 1
        program.version          += 1
      # INVARIANT (never violated at any observable point):
      #   program.total_cents == program.committed_cents + program.remaining_cents

      if program.remaining_cents == 0:
          every remaining SCORED project of the program -> DEFERRED
          program.deferred_project_count      = count(DEFERRED projects)
          program.next_cycle_carryover_cents  = sum(requested_cost_cents
                                                    of DEFERRED projects)
    constants:
      REMAINING_EXHAUSTED_CENTS: 0
    precision: "Integer cents; no rounding occurs in allocation. Strict > comparison for the exhaustion check, so equality funds successfully."

  - name: school_coverage_posture
    trigger: "Recomputed by the system whenever a GuardPost of the school changes coverage_status or status, and whenever an AbsenceReport under the school is created, covered or rescinded"
    algorithm: constraint_propagation
    input_set: |
      All GuardPosts whose Intersection.school_id == school.id and whose
      status == ACTIVE. DRAFT posts are excluded entirely — activating a post can
      therefore move a school from OPEN to RESTRICTED without any absence being
      filed.
    formula: |
      active_post_count   = count(ACTIVE posts of the school)
      uncovered_post_count = count(ACTIVE posts with coverage_status IN
                                   {UNCOVERED, UNSTAFFED})
      covered_post_count   = active_post_count - uncovered_post_count
      # An ACTIVE post with no SCHEDULED/ACTIVE assignment is UNSTAFFED and counts
      # as uncovered exactly like a staffed post whose guard has an open gap:
      # activating a post therefore degrades the posture until it is staffed.
      # PARTITION INVARIANT (never violated at any observable point):
      #   active_post_count == covered_post_count + uncovered_post_count

      coverage_rate_pct = 100.00 if active_post_count == 0
                     else round_half_up(100.0 * covered_post_count
                                        / active_post_count, 2)

      coverage_posture = OPEN       if uncovered_post_count == 0
                    else SUSPENDED  if coverage_rate_pct < 50.00      # strict <
                    else RESTRICTED
      # A school with zero ACTIVE posts is OPEN with coverage_rate_pct 100.00.
      # Exactly 50.00 is RESTRICTED, not SUSPENDED.
      # Entering SUSPENDED puts every PUBLISHED WalkingRoute of the school on
      # ADVISORY_HOLD; leaving SUSPENDED releases them back to PUBLISHED.
    constants:
      SUSPEND_THRESHOLD_PCT: 50.00
      EMPTY_SCHOOL_RATE_PCT: 100.00
    precision: "coverage_rate_pct to 2 decimal places, round_half_up; the posture comparison runs against the rounded value."

  - name: walk_bike_mode_share
    trigger: "POST /srts/schools/{id}/mode-share-surveys — recomputed after every survey append"
    algorithm: projection
    input_set: |
      The single latest survey in school.mode_share_surveys, selected by
      survey_date DESC then recorded_at DESC (recorded_at is the logical clock at
      append time; it is the tie-break when two surveys share a survey_date, and
      the later-recorded survey wins). Earlier surveys are retained in the array
      as history and never averaged in.
    formula: |
      s = latest survey by (survey_date DESC, recorded_at DESC)
      responses = s.walk_count + s.bike_count + s.bus_count + s.car_count + s.other_count

      # --- variant RAW_TALLY ---
      pct = round_half_up(100.0 * (s.walk_count + s.bike_count) / responses, 2)

      # --- variant ENROLLMENT_WEIGHTED ---
      pct = round_half_up(100.0 * (s.walk_count + s.bike_count)
                          / s.enrollment_at_survey, 2)

      school.walk_bike_mode_share_pct          = RAW_TALLY pct
      school.walk_bike_mode_share_weighted_pct = ENROLLMENT_WEIGHTED pct
      school.latest_survey_term_code           = s.term_code
      school.mode_share_trend_pct              = round_half_up(
            school.walk_bike_mode_share_pct
          - school.baseline_walk_bike_mode_share_pct, 2)
      # A survey with responses == 0 is rejected upstream by ERR_INVALID_REQUEST,
      # so the RAW_TALLY denominator is always positive. enrollment_at_survey is
      # constrained >= 1 for the same reason.
    constants:
      TREND_BASIS_VARIANT: RAW_TALLY
    precision: "2 decimal places, round_half_up on both shares and on the trend delta."
    variants:
      - name: RAW_TALLY
        when: "Always computed; stored as school.walk_bike_mode_share_pct. This is the variant the trend delta is built from, because it is comparable across terms with differing participation."
        difference: |
          Denominator is the sum of the five tally buckets actually collected.
          Non-responding students are invisible: they neither help nor hurt the
          share, so a low-participation survey of enthusiastic walkers reports a
          high share.
      - name: ENROLLMENT_WEIGHTED
        when: "Always computed; stored as school.walk_bike_mode_share_weighted_pct. This is the variant program evaluation reports to the grant funder, because it cannot be inflated by low participation."
        difference: |
          Denominator is s.enrollment_at_survey instead of the response count.
          Because enrollment_at_survey is normally larger than the number of
          responses, identical tallies yield a strictly LOWER share under this
          variant, and the gap between the two stored fields is exactly the
          non-response inflation. mode_share_trend_pct is deliberately NOT
          recomputed from this variant.
    variant_selection: "Neither variant is selected over the other — both are computed and stored on every survey append from the same latest-survey inputs, so the divergence is directly observable in one response. Only RAW_TALLY feeds mode_share_trend_pct."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (Ordered by Priority)
# ---------------------------------------------------------------------------
# Priority bands: 10-12 auth, 20 request shape, 30-34 existence,
# 40 state precondition, 42 OCC, 45 segregation of duties,
# 50 safety/compliance, 58 temporal conflict, 60 constraint,
# 66 referential consistency, 72 fiscal capacity.
# Lower number wins when a single request violates several rules.
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 12
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 20
    category: business_constraint
    check: |
      Request shape: every required body field present; every enum-typed field a
      declared member; integers integral and within their declared constraints;
      dates parse as ISO 8601 dates and datetimes as ISO 8601 UTC instants;
      limit an integer in [1, 100] and offset an integer >= 0; session_end_date >=
      session_start_date; count_window_end >= count_window_start; end_date >=
      start_date; walking-route segments non-empty with segment_order exactly
      1..N with no gaps or duplicates and length_ft >= 1; mode-share survey with
      walk+bike+bus+car+other == 0 or enrollment_at_survey < 1 rejected here;
      requested_cost_cents >= 1; total_cents >= 1; training hours > 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 30
    category: existence
    check: "Path resources are resolved left to right; the first unresolvable segment decides the error. /schools/{id} -> ERR_SCHOOL_NOT_FOUND, /intersections/{id} -> ERR_INTERSECTION_NOT_FOUND, /warrant-studies/{id} -> ERR_WARRANT_STUDY_NOT_FOUND, /guards/{id} -> ERR_GUARD_NOT_FOUND, /guard-posts/{id} -> ERR_GUARD_POST_NOT_FOUND, /post-assignments/{id} -> ERR_ASSIGNMENT_NOT_FOUND, /absence-reports/{id} -> ERR_ABSENCE_NOT_FOUND, /walking-routes/{id} -> ERR_ROUTE_NOT_FOUND, /complaints/{id} -> ERR_COMPLAINT_NOT_FOUND, /grant-programs/{id} -> ERR_GRANT_PROGRAM_NOT_FOUND, /infrastructure-projects/{id} -> ERR_PROJECT_NOT_FOUND"
    error_id: ERR_INTERSECTION_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 34
    category: existence
    check: |
      Body foreign keys are resolved after path resources, in the field order
      declared by the endpoint's input list: school_id -> ERR_SCHOOL_NOT_FOUND,
      intersection_id -> ERR_INTERSECTION_NOT_FOUND, guard_id ->
      ERR_GUARD_NOT_FOUND, post_assignment_id -> ERR_ASSIGNMENT_NOT_FOUND,
      grant_program_id -> ERR_GRANT_PROGRAM_NOT_FOUND, source_complaint_id ->
      ERR_COMPLAINT_NOT_FOUND, and every non-null segments[].intersection_id ->
      ERR_INTERSECTION_NOT_FOUND (segments checked in segment_order ASC).
    error_id: ERR_GUARD_NOT_FOUND
    http_status: 404
    applies_to: "POST /srts/intersections, POST /srts/warrant-studies, POST /srts/guard-posts, POST /srts/guard-posts/{id}/assignments, POST /srts/absence-reports, POST /srts/walking-routes, POST /srts/infrastructure-projects"

  - priority: 40
    category: state
    check: "The target resource is in a state from which the requested transition exists. count-sessions requires study.status IN {DRAFT, COUNTING} (ERR_STUDY_NOT_IN_COUNTING) and reopen-counting requires study.status IN {ANALYZED, CONDITIONAL, NOT_WARRANTED} (ERR_STUDY_NOT_REOPENABLE); analyze requires COUNTING (ERR_STUDY_NOT_IN_COUNTING); finalize requires ANALYZED (ERR_STUDY_NOT_ANALYZED); guard-post activate requires status IN {PROPOSED, SUSPENDED} (ERR_POST_NOT_ACTIVATABLE); assignment creation requires post.status == ACTIVE (ERR_POST_NOT_ACTIVE); absence creation requires assignment.status IN {SCHEDULED, ACTIVE} (ERR_ASSIGNMENT_NOT_ACTIVE); dispatch requires absence.status IN {DISPATCH_PENDING, UNCOVERED_GAP} or an expired OFFER_OUT (ERR_ABSENCE_NOT_DISPATCHABLE); offer-response requires OFFER_OUT (ERR_NO_OPEN_OFFER); rescind requires a non-terminal absence (ERR_ABSENCE_NOT_RESCINDABLE); publish requires route.status == DRAFT (ERR_ROUTE_NOT_DRAFT); triage requires complaint.status == RECEIVED (ERR_COMPLAINT_NOT_TRIAGEABLE); score requires project.status == PROPOSED and fund requires SCORED (ERR_PROJECT_NOT_SCORED); withdraw-funding requires FUNDED (ERR_PROJECT_NOT_FUNDED); certify requires guard.certification_status IN {IN_TRAINING, CERTIFIED, SUSPENDED} (ERR_GUARD_NOT_IN_TRAINING)"
    error_id: ERR_PROJECT_NOT_SCORED
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 42
    category: state
    check: "The supplied expected_<parent>_version equals the stored parent version — see §1.2.1. expected_intersection_version on POST /srts/warrant-studies (ERR_STALE_INTERSECTION_VERSION), expected_guard_post_version on POST /srts/guard-posts/{id}/assignments (ERR_STALE_GUARD_POST_VERSION), expected_grant_program_version on the fund and withdraw-funding endpoints (ERR_STALE_GRANT_PROGRAM_VERSION)"
    error_id: ERR_STALE_GRANT_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /srts/warrant-studies, POST /srts/guard-posts/{id}/assignments, POST /srts/infrastructure-projects/{id}/fund, POST /srts/infrastructure-projects/{id}/withdraw-funding"
  - priority: 45
    category: business_constraint
    check: "Segregation of duties: X-User-ID on POST /srts/warrant-studies/{id}/finalize must differ from study.authored_by_user_id — the engineer who opened a warrant study may not be the one who finalizes its determination onto the intersection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /srts/warrant-studies/{id}/finalize"

  - priority: 50
    category: business_safety
    check: "A GuardPost may only be activated when its Intersection.warrant_status IN {WARRANTED, CONDITIONAL}. A CONDITIONAL warrant is not disqualifying here; the morning-only restriction it implies is a separate check (ERR_POST_SHIFT_NOT_PERMITTED) evaluated immediately after this one."
    error_id: ERR_POST_NOT_WARRANTED
    http_status: 409
    applies_to: "POST /srts/guard-posts/{id}/activate"
  - priority: 50
    category: business_safety
    check: "A GuardPost whose Intersection.warrant_status == CONDITIONAL may not declare required_shift IN {PM, BOTH}; checked at post activation, after ERR_POST_NOT_WARRANTED has been cleared"
    error_id: ERR_POST_SHIFT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /srts/guard-posts/{id}/activate"
  - priority: 50
    category: business_safety
    check: "The guard named in an assignment must have certification_status == CERTIFIED"
    error_id: ERR_GUARD_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /srts/guard-posts/{id}/assignments"
  - priority: 50
    category: business_safety
    check: "The guard named in an assignment must have certification_expires_on >= the assignment's end_date — a certification lapsing mid-window is rejected up front. Evaluated after ERR_GUARD_NOT_CERTIFIED and BEFORE the temporal overlap check at priority 58."
    error_id: ERR_GUARD_CERT_EXPIRED
    http_status: 422
    applies_to: "POST /srts/guard-posts/{id}/assignments"
  - priority: 50
    category: business_safety
    check: "The guard named in an assignment must have equipment_complete == true (all of HIGH_VIS_VEST, STOP_PADDLE and WHISTLE issued)"
    error_id: ERR_GUARD_EQUIPMENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /srts/guard-posts/{id}/assignments"
  - priority: 50
    category: business_safety
    check: "The guard named in an assignment must not have duty_status == ON_LEAVE"
    error_id: ERR_GUARD_ON_LEAVE
    http_status: 422
    applies_to: "POST /srts/guard-posts/{id}/assignments"
  - priority: 50
    category: business_safety
    check: "Publishing a route requires that every segment with hazard_type == UNCONTROLLED_CROSSING and mitigated == false references an Intersection whose warrant_status IN {WARRANTED, CONDITIONAL}. Segments are examined in segment_order ASC and the first offender decides. Evaluated BEFORE the school-ownership consistency check at priority 66."
    error_id: ERR_ROUTE_CROSSING_NOT_WARRANTED
    http_status: 422
    applies_to: "POST /srts/walking-routes/{id}/publish"
  - priority: 50
    category: business_safety
    check: "Publishing a route requires route.hazard_score <= 25.00 (equality publishes)"
    error_id: ERR_ROUTE_HAZARD_SCORE_EXCEEDED
    http_status: 422
    applies_to: "POST /srts/walking-routes/{id}/publish"
  - priority: 50
    category: business_safety
    check: "Reinstating a SUSPENDED guard via POST /srts/guards/{id}/certify requires reliability_score_rolling_90d >= 75.00"
    error_id: ERR_RELIABILITY_TOO_LOW
    http_status: 422
    applies_to: "POST /srts/guards/{id}/certify"
  - priority: 50
    category: business_safety
    check: "Initial certification requires training_hours_completed >= 12.0; recertification from CERTIFIED requires hours_since_last_certification >= 4.0"
    error_id: ERR_TRAINING_HOURS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /srts/guards/{id}/certify"

  - priority: 58
    category: business_temporal
    check: |
      Assignment overlap on the guard. Reject when the guard already has a
      PostAssignment with status IN {SCHEDULED, ACTIVE} such that
        new.start_date <= other.end_date AND new.end_date >= other.start_date
      (CLOSED intervals on both sides) AND the two shifts conflict, where BOTH
      conflicts with AM, PM and BOTH, AM conflicts with AM and BOTH, and PM
      conflicts with PM and BOTH. Back-to-back windows are legal: when
      new.start_date == other.end_date + 1 day there is no overlap.
    error_id: ERR_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /srts/guard-posts/{id}/assignments"
  - priority: 58
    category: business_temporal
    check: |
      Warrant count-window overlap on the intersection, with a 30-day cool-off
      buffer and HALF-OPEN comparison. Reject when the intersection already has a
      WarrantStudy (in ANY status, including finalized ones) such that
        new.count_window_start < (other.count_window_end + 30 days)
        AND new.count_window_end > other.count_window_start
      A new window starting exactly 30 days after the prior window's end is
      accepted; 29 days after is rejected.
    error_id: ERR_COUNT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /srts/warrant-studies"
  - priority: 58
    category: business_temporal
    check: "An assignment window must lie entirely inside the school session: start_date >= school.session_start_date AND end_date <= school.session_end_date, with the school resolved through guard_post -> intersection -> school"
    error_id: ERR_ASSIGNMENT_OUTSIDE_SESSION
    http_status: 422
    applies_to: "POST /srts/guard-posts/{id}/assignments"
  - priority: 58
    category: business_temporal
    check: "A count session's session_date must lie inside the study's closed count window [count_window_start, count_window_end]"
    error_id: ERR_SESSION_DATE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /srts/warrant-studies/{id}/count-sessions"
  - priority: 58
    category: business_temporal
    check: "An absence_date must lie inside the parent assignment's closed [start_date, end_date] window"
    error_id: ERR_ABSENCE_OUTSIDE_ASSIGNMENT
    http_status: 422
    applies_to: "POST /srts/absence-reports"
  - priority: 58
    category: business_temporal
    check: "An absence_date must not appear in the owning School.no_school_dates array"
    error_id: ERR_ABSENCE_ON_NON_SCHOOL_DAY
    http_status: 422
    applies_to: "POST /srts/absence-reports"

  - priority: 60
    category: business_constraint
    check: "Analyze requires at least 2 non-voided count sessions with period IN {AM_ARRIVAL, PM_DISMISSAL} and at least 1 of each of those two periods. MIDDAY sessions do not count toward coverage, so a study holding only MIDDAY sessions is rejected here rather than scoring 0."
    error_id: ERR_INSUFFICIENT_COUNT_COVERAGE
    http_status: 422
    applies_to: "POST /srts/warrant-studies/{id}/analyze"
  - priority: 60
    category: business_constraint
    check: "At most one non-terminal AbsenceReport (status NOT IN {COVERED, RESCINDED}) may exist per (post_assignment_id, absence_date) pair; a second report for the same duty day is a duplicate"
    error_id: ERR_ABSENCE_DUPLICATE
    http_status: 409
    applies_to: "POST /srts/absence-reports"
  - priority: 60
    category: business_constraint
    check: "The acting user on offer-response must be the current offer recipient: X-User-ID == absence.current_offer_guard_id"
    error_id: ERR_NOT_OFFER_RECIPIENT
    http_status: 403
    applies_to: "POST /srts/absence-reports/{id}/offer-response"
  - priority: 60
    category: business_constraint
    check: "The open offer must not have lapsed: the logical clock must be <= absence.current_offer_expires_at. Checked after ERR_NOT_OFFER_RECIPIENT so a stranger never learns whether the offer is still live."
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /srts/absence-reports/{id}/offer-response"
  - priority: 60
    category: business_constraint
    check: "A CrossingGuard filing an absence report must be the guard named on the assignment: when X-User-Role == CrossingGuard, X-User-ID must equal assignment.guard_id. CrossingSupervisor may file for any guard."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /srts/absence-reports"
  - priority: 60
    category: business_constraint
    check: "A project may only be funded when it is the top-ranked SCORED candidate of its program per calculations.grant_funding_selector"
    error_id: ERR_PROJECT_NOT_TOP_RANKED
    http_status: 409
    applies_to: "POST /srts/infrastructure-projects/{id}/fund"
  - priority: 60
    category: business_constraint
    check: "Scoring requires the project's Intersection.latest_warrant_score to be non-null — a project cannot be ranked before a warrant determination has been finalized at its intersection"
    error_id: ERR_INTERSECTION_NOT_STUDIED
    http_status: 422
    applies_to: "POST /srts/infrastructure-projects/{id}/score"
  - priority: 60
    category: business_constraint
    check: "The logical clock may only move forward or stay put: to_iso8601 must be >= the current logical clock value"
    error_id: ERR_CLOCK_MOVED_BACKWARD
    http_status: 422
    applies_to: "POST /srts/_clock/set_current_utc"

  - priority: 66
    category: business_referential
    check: "A supplied source_complaint_id must reference a Complaint whose status == TRIAGED with disposition == REFER_TO_ENGINEERING and whose intersection_id equals the project's intersection_id"
    error_id: ERR_COMPLAINT_NOT_REFERABLE
    http_status: 422
    applies_to: "POST /srts/infrastructure-projects"
  - priority: 66
    category: business_referential
    check: "Every non-null segments[].intersection_id on a route must reference an Intersection whose school_id equals the route's school_id. Deliberately NOT enforced at creation — a DRAFT route may cite an out-of-district intersection — so the check runs only at publish, where it sits AFTER the warrant safety gate at priority 50."
    error_id: ERR_ROUTE_SEGMENT_SCHOOL_MISMATCH
    http_status: 422
    applies_to: "POST /srts/walking-routes/{id}/publish"

  - priority: 72
    category: business_fiscal
    check: "requested_cost_cents must be <= GrantProgram.remaining_cents. Equality is allowed and drives remaining_cents to exactly 0. This is the LAST check on the fund path, so a DEFERRED project that also cannot be afforded reports ERR_PROJECT_NOT_SCORED (priority 40), never ERR_GRANT_FUNDS_EXHAUSTED."
    error_id: ERR_GRANT_FUNDS_EXHAUSTED
    http_status: 402
    applies_to: "POST /srts/infrastructure-projects/{id}/fund"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- School ---------------------------------------------------------------
  - method: POST
    path: "/srts/schools"
    description: "Register a school with its instructional calendar, crossing windows and mode-share baseline."
    roles: [ProgramAdmin]
    code: 201
    input: [name, district_code, enrollment_count, session_start_date, session_end_date, am_window_start_utc, am_window_end_utc, pm_window_start_utc, pm_window_end_utc, baseline_walk_bike_mode_share_pct, "early_dismissal_pm_offset_minutes?", "no_school_dates?", "early_dismissal_dates?"]
    output: School
    side_effects:
      - "creates the School with coverage_posture OPEN, coverage_rate_pct 100.00 and all post counters at 0"
      - "mode_share_surveys initialized to an empty array; every mode-share field null"
  - method: GET
    path: "/srts/schools/{id}"
    description: "Read one school, including its derived coverage posture and mode-share figures."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor, SchoolLiaison]
    code: 200
    input: []
    output: School
    side_effects: []
  - method: GET
    path: "/srts/schools/{id}/intersections"
    description: "List the intersections belonging to a school. FK reverse-reachability for Intersection.school_id."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor, SchoolLiaison]
    code: 200
    input: ["limit?", "offset?"]
    output: Intersection[]
    side_effects: []
  - method: GET
    path: "/srts/schools/{id}/walking-routes"
    description: "List the walking routes of a school, optionally filtered by status. FK reverse-reachability for WalkingRoute.school_id."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor, SchoolLiaison, PublicReporter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WalkingRoute[]
    side_effects: []
  - method: POST
    path: "/srts/schools/{id}/mode-share-surveys"
    description: "Append a term travel-tally survey and recompute both mode-share variants and the trend delta."
    roles: [SchoolLiaison, ProgramAdmin]
    code: 200
    input: [term_code, survey_date, classrooms_reporting, enrollment_at_survey, walk_count, bike_count, bus_count, car_count, other_count]
    output: School
    side_effects:
      - "appends the survey object to school.mode_share_surveys with recorded_at = the logical clock"
      - "recomputes school.walk_bike_mode_share_pct, walk_bike_mode_share_weighted_pct, latest_survey_term_code and mode_share_trend_pct per calculations.walk_bike_mode_share"
      - "increments School.version by 1"

  # --- Intersection ---------------------------------------------------------
  - method: POST
    path: "/srts/intersections"
    description: "Register a crossing location under a school."
    roles: [ProgramAdmin]
    code: 201
    input: [school_id, cross_streets, control_type, speed_limit_mph, lanes_crossed, "posted_school_zone?"]
    output: Intersection
    side_effects:
      - "creates the Intersection with warrant_status NOT_STUDIED, latest_warrant_score null, empty crash_history and open_complaint_count 0"
      - "increments School.version by 1"
  - method: GET
    path: "/srts/intersections/{id}"
    description: "Read one intersection, including crash_history and the standing warrant determination."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor, SchoolLiaison]
    code: 200
    input: []
    output: Intersection
    side_effects: []
  - method: POST
    path: "/srts/intersections/{id}/crash-records"
    description: "Append a crash record to the intersection's history and refresh the rolling crash aggregates."
    roles: [TrafficEngineer, ProgramAdmin]
    code: 200
    input: [crash_date, severity, involved_pedestrian, involved_school_age]
    output: Intersection
    side_effects:
      - "appends the crash object to intersection.crash_history with recorded_at = the logical clock"
      - "recomputes intersection.pedestrian_crash_count_window and crash_severity_points over the 1095-day window ending at the logical clock date"
      - "increments Intersection.version by 1"
  - method: GET
    path: "/srts/intersections/{id}/warrant-studies"
    description: "List the warrant studies of an intersection. FK reverse-reachability for WarrantStudy.intersection_id."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WarrantStudy[]
    side_effects: []
  - method: GET
    path: "/srts/intersections/{id}/guard-posts"
    description: "List the guard posts at an intersection. FK reverse-reachability for GuardPost.intersection_id."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GuardPost[]
    side_effects: []
  - method: GET
    path: "/srts/intersections/{id}/complaints"
    description: "List the complaints filed against an intersection. FK reverse-reachability for Complaint.intersection_id."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor, SchoolLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/srts/intersections/{id}/complaints"
    description: "File a speeding or near-miss complaint against an intersection."
    roles: [PublicReporter, SchoolLiaison, ProgramAdmin]
    code: 201
    input: [complaint_type, reporter_name, occurred_at, narrative, severity_claim, "reporter_contact?"]
    output: Complaint
    side_effects:
      - "creates the Complaint with status RECEIVED, disposition null, triaged_by_user_id null"
      - "increments Intersection.open_complaint_count by 1 and Intersection.version by 1"

  # --- WarrantStudy ---------------------------------------------------------
  - method: POST
    path: "/srts/warrant-studies"
    description: "Open a warrant study over a count window at an intersection. Guarded by OCC on the intersection (see concurrency_rules.study-create-stale-intersection)."
    roles: [TrafficEngineer]
    code: 201
    input: [intersection_id, count_window_start, count_window_end, expected_intersection_version]
    output: WarrantStudy
    side_effects:
      - "creates the WarrantStudy in status DRAFT with an empty count_sessions array, recount_round 0 and authored_by_user_id = X-User-ID"
      - "moves the parent Intersection.warrant_status to UNDER_STUDY"
      - "increments Intersection.version by 1"
  - method: GET
    path: "/srts/warrant-studies/{id}"
    description: "Read one warrant study, including every recorded count session and the computed score."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor]
    code: 200
    input: []
    output: WarrantStudy
    side_effects: []
  - method: POST
    path: "/srts/warrant-studies/{id}/count-sessions"
    description: "Append a field count session (pedestrian counts, vehicle volume and adequate traffic gaps) to a study."
    roles: [TrafficEngineer]
    code: 200
    input: [session_date, period, observed_minutes, child_count, adult_count, vehicle_count, adequate_gaps]
    output: WarrantStudy
    side_effects:
      - "appends the session object to study.count_sessions with voided false and recorded_at = the logical clock"
      - "moves study.status DRAFT -> COUNTING on the first session; a study already COUNTING stays COUNTING"
      - "increments WarrantStudy.version by 1"
  - method: POST
    path: "/srts/warrant-studies/{id}/analyze"
    description: "Score the study from its non-voided AM/PM sessions and the intersection's pedestrian crash history, and record a determination."
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: WarrantStudy
    side_effects:
      - "computes and stores scoring_variant, included_child_count, included_adequate_gaps, included_vehicle_count, pedestrian_crash_count_3yr, severe_pedestrian_crash_count_3yr and warrant_score per calculations.warrant_score"
      - "stores determination per calculations.warrant_determination"
      - "moves study.status COUNTING -> ANALYZED and increments WarrantStudy.version by 1"
  - method: POST
    path: "/srts/warrant-studies/{id}/finalize"
    description: "Adopt the study's determination onto the intersection. The engineer who opened the study may not finalize it."
    roles: [TrafficEngineer]
    code: 200
    input: ["engineer_note?"]
    output: WarrantStudy
    side_effects:
      - "moves study.status ANALYZED -> WARRANTED | CONDITIONAL | NOT_WARRANTED to match study.determination and sets finalized_by_user_id = X-User-ID"
      - "projects the determination onto the intersection: warrant_status and latest_warrant_score are rewritten; Intersection.version increments by 1"
      - "CASCADE: every ACTIVE GuardPost of the intersection that the new determination no longer permits (NOT_WARRANTED, or CONDITIONAL with required_shift IN {PM, BOTH}) moves ACTIVE -> SUSPENDED, which vacates its SCHEDULED/ACTIVE assignments, recomputes the school's coverage counters and can put the school's PUBLISHED routes on ADVISORY_HOLD"
      - "increments WarrantStudy.version by 1"
  - method: POST
    path: "/srts/warrant-studies/{id}/reopen-counting"
    description: "Reopen an analyzed or determined study for a recount, voiding every previously recorded session."
    roles: [TrafficEngineer]
    code: 200
    input: [reopen_reason]
    output: WarrantStudy
    side_effects:
      - "flips voided to true on every existing entry of study.count_sessions; no entry is deleted"
      - "clears warrant_score, determination, scoring_variant and the included_* aggregates back to null and increments recount_round by 1"
      - "moves study.status ANALYZED | CONDITIONAL | NOT_WARRANTED -> COUNTING"
      - "moves the parent Intersection.warrant_status back to UNDER_STUDY when it was CONDITIONAL or NOT_WARRANTED, and increments Intersection.version by 1"
      - "increments WarrantStudy.version by 1"

  # --- Guard ----------------------------------------------------------------
  - method: POST
    path: "/srts/guards"
    description: "Enroll a crossing guard applicant."
    roles: [CrossingSupervisor, ProgramAdmin]
    code: 201
    input: [full_name, home_zone_code, hire_date, "substitute_pool_optin?"]
    output: Guard
    side_effects:
      - "creates the Guard with certification_status APPLICANT, duty_status UNASSIGNED, training_hours_completed 0, empty equipment_issued, equipment_complete false and both reliability scores 100.00"
  - method: GET
    path: "/srts/guards/{id}"
    description: "Read one guard, including certification, equipment and both reliability variants."
    roles: [ProgramAdmin, CrossingSupervisor, CrossingGuard]
    code: 200
    input: []
    output: Guard
    side_effects: []
  - method: POST
    path: "/srts/guards/{id}/training"
    description: "Record completed training hours for a guard."
    roles: [CrossingSupervisor, ProgramAdmin]
    code: 200
    input: [training_date, hours, curriculum_code]
    output: Guard
    side_effects:
      - "increases training_hours_completed and hours_since_last_certification by hours"
      - "moves certification_status APPLICANT -> IN_TRAINING on the first record"
      - "recomputes both reliability variants (the training bonus can move them) and increments Guard.version by 1"
  - method: POST
    path: "/srts/guards/{id}/equipment"
    description: "Issue a piece of required crossing equipment to a guard."
    roles: [CrossingSupervisor, ProgramAdmin]
    code: 200
    input: [item_type, issued_on]
    output: Guard
    side_effects:
      - "appends the issuance object to guard.equipment_issued with recorded_at = the logical clock"
      - "sets equipment_complete true once all of HIGH_VIS_VEST, STOP_PADDLE and WHISTLE have been issued"
      - "increments Guard.version by 1"
  - method: POST
    path: "/srts/guards/{id}/certify"
    description: "Certify, recertify or reinstate a guard. Reinstating a suspended guard additionally requires the rolling reliability floor."
    roles: [CrossingSupervisor]
    code: 200
    input: [certified_on, certification_expires_on]
    output: Guard
    side_effects:
      - "sets certification_status CERTIFIED, stores certified_on and certification_expires_on, resets hours_since_last_certification to 0 and clears suspension_reason"
      - "increments Guard.version by 1"
  - method: POST
    path: "/srts/guards/{id}/duty-status"
    description: "Place a guard on leave or return them to duty."
    roles: [CrossingSupervisor]
    code: 200
    input: [duty_action]
    output: Guard
    side_effects:
      - "duty_action ON_LEAVE moves duty_status to ON_LEAVE, which removes the guard from the substitute candidate pool"
      - "duty_action RETURN moves duty_status to ASSIGNED when the guard still holds a SCHEDULED or ACTIVE assignment, otherwise to UNASSIGNED"
      - "increments Guard.version by 1"

  # --- GuardPost ------------------------------------------------------------
  - method: POST
    path: "/srts/guard-posts"
    description: "Propose a guard post at an intersection for a specific crossing shift."
    roles: [CrossingSupervisor, ProgramAdmin]
    code: 201
    input: [intersection_id, post_label, zone_code, required_shift]
    output: GuardPost
    side_effects:
      - "creates the GuardPost in status PROPOSED with coverage_status UNSTAFFED, open_gap_count 0 and activated_at null"
      - "increments Intersection.version by 1"
  - method: GET
    path: "/srts/guard-posts/{id}"
    description: "Read one guard post, including its coverage status and open gap count."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor, SchoolLiaison]
    code: 200
    input: []
    output: GuardPost
    side_effects: []
  - method: POST
    path: "/srts/guard-posts/{id}/activate"
    description: "Activate (or reactivate) a guard post. Requires a standing warrant that permits the post's shift."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: GuardPost
    side_effects:
      - "sets status ACTIVE, activated_at = the logical clock and clears suspension_reason"
      - "CASCADE: the owning School's active_post_count, covered_post_count, uncovered_post_count, coverage_rate_pct and coverage_posture are recomputed, which can put PUBLISHED routes on ADVISORY_HOLD"
      - "increments GuardPost.version by 1"
  - method: POST
    path: "/srts/guard-posts/{id}/assignments"
    description: "Assign a guard to a post for a date window. Guarded by OCC on the post (see concurrency_rules.assignment-create-stale-post)."
    roles: [CrossingSupervisor]
    code: 201
    input: [guard_id, start_date, end_date, expected_guard_post_version]
    output: PostAssignment
    side_effects:
      - "creates the PostAssignment in status SCHEDULED with shift copied from GuardPost.required_shift, open_absence_count 0 and coverage_state STAFFED"
      - "SUPERSEDE: any other SCHEDULED or ACTIVE assignment ON THE SAME POST whose start_date >= the new assignment's start_date moves to SUPERSEDED; one whose start_date is strictly earlier is left in place (truncation branch)"
      - "moves the guard's duty_status UNASSIGNED -> ASSIGNED"
      - "CASCADE: GuardPost.coverage_status moves UNSTAFFED -> COVERED and the owning School's coverage counters and posture are recomputed, releasing ADVISORY_HOLD routes when the school leaves SUSPENDED"
      - "increments GuardPost.version by 1"
  - method: GET
    path: "/srts/post-assignments/{id}"
    description: "Read one post assignment."
    roles: [ProgramAdmin, CrossingSupervisor, CrossingGuard]
    code: 200
    input: []
    output: PostAssignment
    side_effects: []
  - method: GET
    path: "/srts/post-assignments"
    description: "List post assignments filtered by post, guard or status. FK reverse-reachability for PostAssignment.guard_post_id and PostAssignment.guard_id."
    roles: [ProgramAdmin, CrossingSupervisor, CrossingGuard]
    code: 200
    input: ["guard_post_id?", "guard_id?", "status?", "limit?", "offset?"]
    output: PostAssignment[]
    side_effects: []

  # --- AbsenceReport --------------------------------------------------------
  - method: POST
    path: "/srts/absence-reports"
    description: "Report that the assigned guard will miss a duty day, opening a coverage gap."
    roles: [CrossingGuard, CrossingSupervisor]
    code: 201
    input: [post_assignment_id, absence_date, reason, "note?"]
    output: AbsenceReport
    side_effects:
      - "creates the AbsenceReport in status DISPATCH_PENDING with guard_id and shift copied from the assignment, dispatch_attempt_count 0, empty dispatch_offers and excluded_guard_ids, substitute_guard_id and substitute_cost_cents null"
      - "pins shift_start_utc, notice_hours and urgency_tier from the school's crossing windows and early-dismissal configuration"
      - "CASCADE link 1: PostAssignment.open_absence_count increments by 1 and coverage_state becomes GAP"
      - "CASCADE link 2: GuardPost.open_gap_count increments by 1 and coverage_status becomes UNCOVERED"
      - "CASCADE link 3: the School's covered_post_count, uncovered_post_count, coverage_rate_pct and coverage_posture are recomputed"
      - "CASCADE link 4: when the school enters SUSPENDED, every PUBLISHED WalkingRoute of the school moves to ADVISORY_HOLD with hold_reason SCHOOL_COVERAGE_SUSPENDED"
      - "recomputes the reporting guard's reliability_score_rolling_90d and reliability_score_season_to_date; when the rolling score falls below 75.00 the guard moves CERTIFIED -> SUSPENDED, which vacates that guard's SCHEDULED and ACTIVE assignments"
  - method: GET
    path: "/srts/absence-reports/{id}"
    description: "Read one absence report, including the full dispatch offer ledger."
    roles: [ProgramAdmin, CrossingSupervisor, CrossingGuard]
    code: 200
    input: []
    output: AbsenceReport
    side_effects: []
  - method: GET
    path: "/srts/absence-reports"
    description: "List absence reports filtered by assignment, guard or status. FK reverse-reachability for AbsenceReport.post_assignment_id and AbsenceReport.guard_id."
    roles: [ProgramAdmin, CrossingSupervisor, CrossingGuard]
    code: 200
    input: ["post_assignment_id?", "guard_id?", "status?", "limit?", "offset?"]
    output: AbsenceReport[]
    side_effects: []
  - method: POST
    path: "/srts/absence-reports/{id}/dispatch"
    description: "Offer the open duty day to the best-ranked eligible substitute. An empty candidate pool records an uncovered gap rather than failing."
    roles: [CrossingSupervisor]
    code: 200
    input: []
    output: AbsenceReport
    side_effects:
      - "runs calculations.substitute_selector; when the eligible set is non-empty, appends an OPEN offer with offer_expires_at = the logical clock + 45 minutes, increments dispatch_attempt_count by 1, sets current_offer_guard_id / current_offer_expires_at and moves status to OFFER_OUT"
      - "when re-dispatching over a lapsed offer, first rewrites that offer's offer_status to EXPIRED and appends its recipient to excluded_guard_ids"
      - "when the eligible set is empty, moves status to UNCOVERED_GAP and appends no offer"
      - "increments AbsenceReport.version by 1"
  - method: POST
    path: "/srts/absence-reports/{id}/offer-response"
    description: "Accept or decline an open substitute offer. Only the current recipient may respond, and only before the offer lapses."
    roles: [CrossingGuard]
    code: 200
    input: [response]
    output: AbsenceReport
    side_effects:
      - "ACCEPT: rewrites the OPEN offer to ACCEPTED, sets substitute_guard_id, computes substitute_cost_cents per calculations.substitute_cost, moves status to COVERED, and runs the four-link coverage cascade in reverse (assignment gap closes, post returns to COVERED, school counters and posture recompute, ADVISORY_HOLD routes return to PUBLISHED)"
      - "DECLINE: rewrites the OPEN offer to DECLINED, appends the recipient to excluded_guard_ids, clears current_offer_guard_id / current_offer_expires_at and returns status to DISPATCH_PENDING without decrementing dispatch_attempt_count"
      - "increments AbsenceReport.version by 1"
  - method: POST
    path: "/srts/absence-reports/{id}/rescind"
    description: "Withdraw an absence report, closing the coverage gap it opened and reversing every counter it moved."
    roles: [CrossingGuard, CrossingSupervisor]
    code: 200
    input: [rescind_reason]
    output: AbsenceReport
    side_effects:
      - "moves status to RESCINDED, stores rescind_reason and rewrites any OPEN offer to EXPIRED"
      - "COMPENSATION: PostAssignment.open_absence_count, GuardPost.open_gap_count and the School's coverage counters/posture are restored to their pre-report values, and ADVISORY_HOLD routes return to PUBLISHED"
      - "recomputes both reliability variants of the absent guard, which no longer count this report"
      - "increments AbsenceReport.version by 1"

  # --- WalkingRoute ---------------------------------------------------------
  - method: POST
    path: "/srts/walking-routes"
    description: "Draft a recommended walking route as an ordered list of hazard-mapped segments."
    roles: [SchoolLiaison, ProgramAdmin]
    code: 201
    input: [school_id, route_code, route_name, segments]
    output: WalkingRoute
    side_effects:
      - "creates the WalkingRoute in status DRAFT with segment_count and hazard_score computed per calculations.route_hazard_score, published_at and hold_reason null"
      - "increments School.version by 1"
  - method: GET
    path: "/srts/walking-routes/{id}"
    description: "Read one walking route, including per-segment hazard mapping and the aggregate hazard score."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor, SchoolLiaison, PublicReporter]
    code: 200
    input: []
    output: WalkingRoute
    side_effects: []
  - method: POST
    path: "/srts/walking-routes/{id}/publish"
    description: "Publish a draft route as the school's recommended route, superseding any prior route with the same code."
    roles: [SchoolLiaison, ProgramAdmin]
    code: 200
    input: []
    output: WalkingRoute
    side_effects:
      - "sets status PUBLISHED and published_at = the logical clock"
      - "any other route of the same school with the same route_code and status IN {PUBLISHED, ADVISORY_HOLD} moves to RETIRED"
      - "when the owning school's coverage_posture is already SUSPENDED, the freshly published route is immediately placed on ADVISORY_HOLD"
      - "increments WalkingRoute.version by 1"

  # --- Complaint ------------------------------------------------------------
  - method: GET
    path: "/srts/complaints/{id}"
    description: "Read one complaint, including its disposition and referral back-pointer."
    roles: [ProgramAdmin, TrafficEngineer, CrossingSupervisor, SchoolLiaison]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: POST
    path: "/srts/complaints/{id}/triage"
    description: "Triage a received complaint: refer it to engineering or close it with no action."
    roles: [TrafficEngineer]
    code: 200
    input: [disposition, "triage_note?"]
    output: Complaint
    side_effects:
      - "REFER_TO_ENGINEERING: status becomes TRIAGED and the complaint becomes eligible to be cited by an infrastructure project; Intersection.open_complaint_count is unchanged"
      - "CLOSE_NO_ACTION: status becomes CLOSED_NO_ACTION and Intersection.open_complaint_count decrements by 1, incrementing Intersection.version by 1"
      - "stores disposition, triaged_by_user_id = X-User-ID and triage_note; increments Complaint.version by 1"

  # --- GrantProgram / InfrastructureProject ---------------------------------
  - method: POST
    path: "/srts/grant-programs"
    description: "Open a grant funding cycle with a fixed award pool."
    roles: [ProgramAdmin]
    code: 201
    input: [program_name, fiscal_year, total_cents, application_deadline]
    output: GrantProgram
    side_effects:
      - "creates the GrantProgram with committed_cents 0, remaining_cents = total_cents, funded_project_count 0, deferred_project_count 0 and next_cycle_carryover_cents 0"
  - method: GET
    path: "/srts/grant-programs/{id}"
    description: "Read one grant program, including its committed / remaining balance split."
    roles: [ProgramAdmin, TrafficEngineer]
    code: 200
    input: []
    output: GrantProgram
    side_effects: []
  - method: POST
    path: "/srts/infrastructure-projects"
    description: "Propose a grant-funded infrastructure project at an intersection, optionally citing a referred complaint."
    roles: [TrafficEngineer]
    code: 201
    input: [grant_program_id, intersection_id, project_type, scope_summary, requested_cost_cents, students_benefited, "source_complaint_id?"]
    output: InfrastructureProject
    side_effects:
      - "creates the InfrastructureProject in status PROPOSED with benefit_points, cost_factor, benefit_cost_score, referred_complaint_count_at_scoring, awarded_cents 0, funded_at and withdrawal_reason null"
      - "when source_complaint_id is supplied, that Complaint moves TRIAGED -> REFERRED, its referred_project_id is set to the new project and Complaint.version increments by 1"
      - "increments GrantProgram.version by 1"
  - method: GET
    path: "/srts/infrastructure-projects/{id}"
    description: "Read one infrastructure project, including its benefit-cost score and award."
    roles: [ProgramAdmin, TrafficEngineer]
    code: 200
    input: []
    output: InfrastructureProject
    side_effects: []
  - method: GET
    path: "/srts/infrastructure-projects"
    description: "List infrastructure projects filtered by program, intersection, cited complaint or status. FK reverse-reachability for InfrastructureProject.grant_program_id, .intersection_id and .source_complaint_id."
    roles: [ProgramAdmin, TrafficEngineer]
    code: 200
    input: ["grant_program_id?", "intersection_id?", "source_complaint_id?", "status?", "limit?", "offset?"]
    output: InfrastructureProject[]
    side_effects: []
  - method: POST
    path: "/srts/infrastructure-projects/{id}/score"
    description: "Score a proposed project on warrant, crash severity, students benefited and referred complaints, divided by cost."
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: InfrastructureProject
    side_effects:
      - "computes and stores referred_complaint_count_at_scoring, benefit_points, cost_factor and benefit_cost_score per calculations.project_benefit_cost_score"
      - "moves status PROPOSED -> SCORED, entering the project into the program's funding ranking pool"
      - "increments InfrastructureProject.version by 1"
  - method: POST
    path: "/srts/infrastructure-projects/{id}/fund"
    description: "Award grant funds to the top-ranked scored project. Guarded by OCC on the grant program (see concurrency_rules.project-fund-stale-grant-program)."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_grant_program_version, "award_note?"]
    output: InfrastructureProject
    side_effects:
      - "sets status FUNDED, awarded_cents = requested_cost_cents and funded_at = the logical clock"
      - "CASCADE link 1: GrantProgram.committed_cents increases and remaining_cents decreases by awarded_cents, funded_project_count increments by 1 and GrantProgram.version increments by 1"
      - "CASCADE link 2: when remaining_cents reaches exactly 0, every other SCORED project of the program moves SCORED -> DEFERRED"
      - "CASCADE link 3: GrantProgram.deferred_project_count and next_cycle_carryover_cents are recomputed from the DEFERRED set"
      - "CASCADE: when source_complaint_id is set, that Complaint moves REFERRED -> RESOLVED and Intersection.open_complaint_count decrements by 1"
      - "increments InfrastructureProject.version by 1"
  - method: POST
    path: "/srts/infrastructure-projects/{id}/withdraw-funding"
    description: "Withdraw an award, returning the money to the pool and reviving the projects it had deferred. Guarded by OCC on the grant program."
    roles: [ProgramAdmin]
    code: 200
    input: [withdrawal_reason, expected_grant_program_version]
    output: InfrastructureProject
    side_effects:
      - "sets status back to SCORED, awarded_cents 0 and stores withdrawal_reason; funded_at is retained as history"
      - "COMPENSATION link 1: GrantProgram.committed_cents decreases and remaining_cents increases by the released amount, funded_project_count decrements by 1 and GrantProgram.version increments by 1"
      - "COMPENSATION link 2: when remaining_cents becomes greater than 0, every DEFERRED project of the program returns DEFERRED -> SCORED"
      - "COMPENSATION link 3: GrantProgram.deferred_project_count and next_cycle_carryover_cents are recomputed"
      - "COMPENSATION: when source_complaint_id is set, that Complaint moves RESOLVED -> REFERRED and Intersection.open_complaint_count increments by 1"
      - "increments InfrastructureProject.version by 1"

  # --- Test-driving surface -------------------------------------------------
  - method: POST
    path: "/srts/_clock/set_current_utc"
    description: "Set the server's logical UTC clock and run the assignment checkpoint sweep. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. The clock may only move forward or stay put."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, activated_assignment_count: integer, ended_assignment_count: integer }
    side_effects:
      - "sets the logical clock to to_iso8601; every subsequent created_at, updated_at, recorded_at, published_at, activated_at, funded_at and offer_expires_at derives from it"
      - "CHECKPOINT SWEEP: every SCHEDULED PostAssignment whose start_date <= the new clock date moves SCHEDULED -> ACTIVE; every ACTIVE PostAssignment whose end_date < the new clock date moves ACTIVE -> ENDED, releases its guard's duty_status to UNASSIGNED when it was that guard's last non-terminal assignment, and recomputes the post's coverage_status and the school's coverage counters and posture"
      - "recomputes every Guard's reliability_score_rolling_90d, since advancing the clock can age absences out of the 90-day window and lift a suspended guard back above the reliability floor"
      - "recomputes every Intersection's pedestrian_crash_count_window and crash_severity_points against the new window"
      - "returns { current_utc, activated_assignment_count, ended_assignment_count }"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- auth / shape ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or naming a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the endpoint, or a CrossingGuard files an absence report for an assignment that is not theirs"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, malformed date/datetime, out-of-range integer, limit outside [1,100], negative offset, inverted date range, malformed or non-contiguous route segment ordering, or a mode-share survey with zero total responses"
  # --- existence ---
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "No School with the given path id or school_id"
  - id: ERR_INTERSECTION_NOT_FOUND
    http: 404
    condition: "No Intersection with the given path id, intersection_id, or segments[].intersection_id"
  - id: ERR_WARRANT_STUDY_NOT_FOUND
    http: 404
    condition: "No WarrantStudy with the given path id"
  - id: ERR_GUARD_NOT_FOUND
    http: 404
    condition: "No Guard with the given path id or guard_id"
  - id: ERR_GUARD_POST_NOT_FOUND
    http: 404
    condition: "No GuardPost with the given path id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No PostAssignment with the given path id or post_assignment_id"
  - id: ERR_ABSENCE_NOT_FOUND
    http: 404
    condition: "No AbsenceReport with the given path id"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "No WalkingRoute with the given path id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "No Complaint with the given path id or source_complaint_id"
  - id: ERR_GRANT_PROGRAM_NOT_FOUND
    http: 404
    condition: "No GrantProgram with the given path id or grant_program_id"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "No InfrastructureProject with the given path id"
  # --- OCC ---
  - id: ERR_STALE_INTERSECTION_VERSION
    http: 412
    condition: "expected_intersection_version does not equal the stored Intersection.version on POST /srts/warrant-studies"
  - id: ERR_STALE_GUARD_POST_VERSION
    http: 412
    condition: "expected_guard_post_version does not equal the stored GuardPost.version on POST /srts/guard-posts/{id}/assignments"
  - id: ERR_STALE_GRANT_PROGRAM_VERSION
    http: 412
    condition: "expected_grant_program_version does not equal the stored GrantProgram.version on the fund or withdraw-funding endpoint"
  # --- warrant study state / constraints ---
  - id: ERR_STUDY_NOT_IN_COUNTING
    http: 409
    condition: "Appending a count session to a study whose status is not DRAFT or COUNTING, or analyzing a study whose status is not COUNTING"
  - id: ERR_STUDY_NOT_ANALYZED
    http: 409
    condition: "Finalizing a study whose status is not ANALYZED"
  - id: ERR_STUDY_NOT_REOPENABLE
    http: 409
    condition: "Reopening counting on a study whose status is not ANALYZED, CONDITIONAL or NOT_WARRANTED (a WARRANTED study is terminal)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID on finalize equals the study's authored_by_user_id"
  - id: ERR_COUNT_WINDOW_OVERLAP
    http: 409
    condition: "The requested count window overlaps another study's window on the same intersection once that window is extended by the 30-day cool-off buffer"
  - id: ERR_SESSION_DATE_OUTSIDE_WINDOW
    http: 422
    condition: "session_date falls outside the study's closed count window"
  - id: ERR_INSUFFICIENT_COUNT_COVERAGE
    http: 422
    condition: "Analyzing a study with fewer than 2 non-voided AM_ARRIVAL/PM_DISMISSAL sessions, or lacking at least one of each period"
  # --- guard certification / equipment ---
  - id: ERR_GUARD_NOT_IN_TRAINING
    http: 409
    condition: "Certifying a guard whose certification_status is APPLICANT (no training recorded yet)"
  - id: ERR_TRAINING_HOURS_INSUFFICIENT
    http: 422
    condition: "Initial certification with training_hours_completed < 12.0, or recertification with hours_since_last_certification < 4.0"
  - id: ERR_RELIABILITY_TOO_LOW
    http: 422
    condition: "Reinstating a SUSPENDED guard whose reliability_score_rolling_90d is below 75.00"
  - id: ERR_INVALID_DUTY_ACTION
    http: 422
    condition: "duty_action ON_LEAVE on a guard already ON_LEAVE, or RETURN on a guard not ON_LEAVE"
  # --- guard post ---
  - id: ERR_POST_NOT_ACTIVATABLE
    http: 409
    condition: "Activating a GuardPost whose status is not PROPOSED or SUSPENDED"
  - id: ERR_POST_NOT_WARRANTED
    http: 409
    condition: "Activating a GuardPost whose Intersection.warrant_status is not WARRANTED or CONDITIONAL"
  - id: ERR_POST_SHIFT_NOT_PERMITTED
    http: 422
    condition: "Activating a GuardPost with required_shift IN {PM, BOTH} at an intersection whose warrant_status is only CONDITIONAL"
  - id: ERR_POST_NOT_ACTIVE
    http: 409
    condition: "Creating an assignment on a GuardPost whose status is not ACTIVE"
  # --- assignment ---
  - id: ERR_GUARD_NOT_CERTIFIED
    http: 422
    condition: "Assigning a guard whose certification_status is not CERTIFIED"
  - id: ERR_GUARD_CERT_EXPIRED
    http: 422
    condition: "Assigning a guard whose certification_expires_on is earlier than the assignment's end_date"
  - id: ERR_GUARD_EQUIPMENT_INCOMPLETE
    http: 422
    condition: "Assigning a guard whose equipment_complete is false"
  - id: ERR_GUARD_ON_LEAVE
    http: 422
    condition: "Assigning a guard whose duty_status is ON_LEAVE"
  - id: ERR_ASSIGNMENT_OVERLAP
    http: 409
    condition: "The requested date window overlaps another SCHEDULED or ACTIVE assignment of the same guard on a conflicting shift"
  - id: ERR_ASSIGNMENT_OUTSIDE_SESSION
    http: 422
    condition: "The assignment window falls outside the owning school's [session_start_date, session_end_date]"
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "Filing an absence report against an assignment whose status is not SCHEDULED or ACTIVE"
  # --- absence / dispatch ---
  - id: ERR_ABSENCE_OUTSIDE_ASSIGNMENT
    http: 422
    condition: "absence_date falls outside the parent assignment's closed date window"
  - id: ERR_ABSENCE_ON_NON_SCHOOL_DAY
    http: 422
    condition: "absence_date appears in the owning school's no_school_dates"
  - id: ERR_ABSENCE_DUPLICATE
    http: 409
    condition: "A non-terminal AbsenceReport already exists for the same (post_assignment_id, absence_date) pair"
  - id: ERR_ABSENCE_NOT_DISPATCHABLE
    http: 409
    condition: "Dispatching an absence whose status is terminal, or whose status is OFFER_OUT with an offer that has not yet lapsed"
  - id: ERR_NO_OPEN_OFFER
    http: 409
    condition: "Responding to an absence whose status is not OFFER_OUT"
  - id: ERR_NOT_OFFER_RECIPIENT
    http: 403
    condition: "X-User-ID on offer-response does not equal absence.current_offer_guard_id"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "The logical clock has passed absence.current_offer_expires_at when the recipient responds"
  - id: ERR_ABSENCE_NOT_RESCINDABLE
    http: 409
    condition: "Rescinding an absence whose status is already COVERED or RESCINDED"
  # --- walking route ---
  - id: ERR_ROUTE_NOT_DRAFT
    http: 409
    condition: "Publishing a route whose status is not DRAFT"
  - id: ERR_ROUTE_CROSSING_NOT_WARRANTED
    http: 422
    condition: "Publishing a route with an unmitigated UNCONTROLLED_CROSSING segment at an intersection whose warrant_status is not WARRANTED or CONDITIONAL"
  - id: ERR_ROUTE_HAZARD_SCORE_EXCEEDED
    http: 422
    condition: "Publishing a route whose hazard_score exceeds 25.00"
  - id: ERR_ROUTE_SEGMENT_SCHOOL_MISMATCH
    http: 422
    condition: "Publishing a route with a segment whose intersection belongs to a different school"
  # --- complaint ---
  - id: ERR_COMPLAINT_NOT_TRIAGEABLE
    http: 409
    condition: "Triaging a complaint whose status is not RECEIVED"
  - id: ERR_COMPLAINT_NOT_REFERABLE
    http: 422
    condition: "source_complaint_id names a complaint that is not TRIAGED with disposition REFER_TO_ENGINEERING, or that belongs to a different intersection than the project"
  # --- project / grant ---
  - id: ERR_INTERSECTION_NOT_STUDIED
    http: 422
    condition: "Scoring a project whose intersection has no finalized warrant determination (latest_warrant_score is null)"
  - id: ERR_PROJECT_NOT_SCORED
    http: 409
    condition: "Scoring a project whose status is not PROPOSED, or funding a project whose status is not SCORED"
  - id: ERR_PROJECT_NOT_TOP_RANKED
    http: 409
    condition: "Funding a project that is not the top-ranked SCORED candidate of its program"
  - id: ERR_GRANT_FUNDS_EXHAUSTED
    http: 402
    condition: "requested_cost_cents exceeds the program's remaining_cents"
  - id: ERR_PROJECT_NOT_FUNDED
    http: 409
    condition: "Withdrawing funding from a project whose status is not FUNDED"
  # --- clock ---
  - id: ERR_CLOCK_MOVED_BACKWARD
    http: 422
    condition: "to_iso8601 is earlier than the current logical clock value"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "Municipal Safe Routes to School program administrator. Owns the school/intersection registry, post activation and the grant award decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /srts/schools"
      - "POST /srts/intersections"
      - "POST /srts/guard-posts/{id}/activate"
      - "POST /srts/grant-programs"
      - "POST /srts/infrastructure-projects/{id}/fund"
      - "POST /srts/infrastructure-projects/{id}/withdraw-funding"
      - "POST /srts/_clock/set_current_utc"
    shared_operations:
      - "POST /srts/schools/{id}/mode-share-surveys (with SchoolLiaison)"
      - "POST /srts/intersections/{id}/crash-records (with TrafficEngineer)"
      - "POST /srts/intersections/{id}/complaints (with PublicReporter, SchoolLiaison)"
      - "POST /srts/guards, POST /srts/guards/{id}/training, POST /srts/guards/{id}/equipment, POST /srts/guard-posts (with CrossingSupervisor)"
      - "POST /srts/walking-routes, POST /srts/walking-routes/{id}/publish (with SchoolLiaison)"
      - "every GET endpoint"
  - name: TrafficEngineer
    description: "Municipal traffic engineer. Owns warrant analysis, crash data, complaint triage, engineering referrals and project scoring. Subject to segregation of duties: the engineer who opens a warrant study may not finalize its determination."
    identity: "opaque"
    exclusive_operations:
      - "POST /srts/warrant-studies"
      - "POST /srts/warrant-studies/{id}/count-sessions"
      - "POST /srts/warrant-studies/{id}/analyze"
      - "POST /srts/warrant-studies/{id}/finalize"
      - "POST /srts/warrant-studies/{id}/reopen-counting"
      - "POST /srts/complaints/{id}/triage"
      - "POST /srts/infrastructure-projects"
      - "POST /srts/infrastructure-projects/{id}/score"
    shared_operations:
      - "POST /srts/intersections/{id}/crash-records (with ProgramAdmin)"
      - "GET on schools, intersections, warrant studies, guard posts, complaints, walking routes, grant programs and infrastructure projects"
    segregation_of_duties:
      - "POST /srts/warrant-studies/{id}/finalize requires X-User-ID != study.authored_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403). Two distinct TrafficEngineer user ids are therefore needed to move any determination onto an intersection."
  - name: CrossingSupervisor
    description: "Crossing guard supervisor. Owns the guard roster, certification, equipment issuance, post staffing and substitute dispatch."
    identity: "opaque"
    exclusive_operations:
      - "POST /srts/guards/{id}/certify"
      - "POST /srts/guards/{id}/duty-status"
      - "POST /srts/guard-posts/{id}/assignments"
      - "POST /srts/absence-reports/{id}/dispatch"
    shared_operations:
      - "POST /srts/guards, POST /srts/guards/{id}/training, POST /srts/guards/{id}/equipment, POST /srts/guard-posts (with ProgramAdmin)"
      - "POST /srts/absence-reports, POST /srts/absence-reports/{id}/rescind (with CrossingGuard)"
      - "GET on schools, intersections, warrant studies, guards, guard posts, post assignments, absence reports, complaints and walking routes"
  - name: CrossingGuard
    description: "An individual crossing guard. May report their own absences, respond to substitute offers, and read their own roster."
    identity: "entity_backed:Guard"
    exclusive_operations:
      - "POST /srts/absence-reports/{id}/offer-response"
    shared_operations:
      - "POST /srts/absence-reports (with CrossingSupervisor; a CrossingGuard may only file for an assignment whose guard_id == X-User-ID)"
      - "POST /srts/absence-reports/{id}/rescind (with CrossingSupervisor)"
      - "GET /srts/guards/{id}, GET /srts/post-assignments, GET /srts/post-assignments/{id}, GET /srts/absence-reports, GET /srts/absence-reports/{id}"
  - name: SchoolLiaison
    description: "School-side Safe Routes liaison. Owns walking-route drafting and publication and the term travel-tally survey."
    identity: "entity_backed:School"
    exclusive_operations: []
    shared_operations:
      - "POST /srts/schools/{id}/mode-share-surveys (with ProgramAdmin)"
      - "POST /srts/walking-routes, POST /srts/walking-routes/{id}/publish (with ProgramAdmin)"
      - "POST /srts/intersections/{id}/complaints (with PublicReporter, ProgramAdmin)"
      - "GET on schools, intersections, guard posts, complaints and walking routes"
  - name: PublicReporter
    description: "Member of the public reporting a speeding or near-miss event. Write access is limited to complaint intake."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /srts/intersections/{id}/complaints (with SchoolLiaison, ProgramAdmin)"
      - "GET /srts/schools/{id}/walking-routes, GET /srts/walking-routes/{id}"
