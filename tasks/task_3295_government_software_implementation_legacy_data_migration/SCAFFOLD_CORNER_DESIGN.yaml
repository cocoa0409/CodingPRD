      - Milestone.${ms1}.billing_variant == PAYMENT_ON_ACCEPTANCE (default)
  - name: workflow_rework_loop_increments_map_revision
    claim_type: valid_transition
    grounds:
    - state_machines.WorkflowProcess.REWORK_to_MAPPED
    distinguishing_aspect: Each pass through the IN_REVIEW -> REWORK -> MAPPED loop increments map_revision by exactly 1; two loops yield map_revision == 3 (starts
      at 1).
