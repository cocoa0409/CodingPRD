# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2342 - Development Impact Fee Study & Nexus Analysis
#
# Fixture conventions used by every instance below:
#   program  HARBOR: fiscal_year_start_month 7, statutory_expenditure_deadline_years 5,
#            notice_min_days 14, protest_threshold_bp 5000, effective_delay_days 60,
#            admin_charge_bp 300, credit_cap_bp 5000,
#            los_policy EXISTING_DEFICIENCY_EXCLUDED, discount_rate_bp 400,
#            max_deferral_days 730, default_penalty_bp 1000,
#            at_risk_window_days 365, report_grace_days 180   (all defaults)
#   PARKS    existing_los 0.0030, planned_los 0.0040, unit_cost_cents 45,000,000
#   ROADS    existing_los 0.0008, planned_los 0.0006, unit_cost_cents 250,000,000
#   PARKS component 2026..2030: 1200 dwellings x 2.5000 -> growth 3000.0000,
#            planned cost 500,000,000 @ 8000bp less 50,000,000 other funding,
#            capacity 3500, existing tax credit 15,000/unit
#            -> plan 116,667 | standard 135,000 | adopted(PLAN) 101,667 | ratio 1.1667
#   ROADS component 2026..2030: 1200 x 1.0100 + 200,000 sqft/1000 x 3.7500
#            -> growth 1962.0000, planned cost 900,000,000 @ 6500bp less
#            100,000,000, capacity 2000, no tax credit
#            -> plan 247,197 | standard 200,000 | adopted 247,197 | ratio 1.0194
#   SINGLE_FAMILY schedule lines: PARKS 2.5000 -> 254,168 ; ROADS 1.0100 -> 249,669
#   10-dwelling SINGLE_FAMILY application: gross 5,038,370, cap 2,519,185,
#            no credits -> admin 151,151, net_due 5,189,521
#            (PARKS line net 2,617,930 | ROADS line net 2,571,591)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_allocation_plan_based_versus_standard_based_on_identical_facts
        grounds:
          - calculations.cost_per_demand_unit
          - entities.FeeStudy.fields.methodology
          - entities.NexusComponent.fields.plan_based_cost_per_unit_cents
          - entities.NexusComponent.fields.standard_based_cost_per_unit_cents
          - entities.NexusComponent.fields.adopted_cost_per_unit_cents
          - state_machines.NexusComponent.PENDING_to_VALID
        distinguishing_aspect: |
          The two variants live on the NexusComponent cost-allocation calculation and
          are selected by FeeStudy.methodology: with byte-identical component inputs
          the PLAN_BASED study adopts 101,667 cents per demand unit while the
          STANDARD_BASED study adopts 120,000, and each component stores BOTH raw
          figures (116,667 and 135,000) so the divergence is observable on one row.
        test_recipe:
          setup:
            - "One HARBOR fee program at default constants, version 1."
            - "One PARKS facility standard: existing_los 0.0030, planned_los 0.0040, unit_cost_cents 45,000,000."
            - "Two DRAFT fee studies of that program over the same facts, one PLAN_BASED and one STANDARD_BASED."
            - "Each study carries one PARKS nexus component with identical growth and cost inputs, both allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study - Plan Based", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_plan_id: $.data.id }
            - call: "GET /fee-programs/${prog_id}"
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { prog_v2: $.data.version }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study - Standard Based", methodology: "STANDARD_BASED", expected_fee_program_version: "${prog_v2}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_std_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_plan_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_plan_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_std_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_std_id: $.data.id }
          trigger:
            - call: "POST /nexus-components/${comp_plan_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_std_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "NexusComponent.${comp_plan_id}.growth_demand_units == 3000.0000"
            - "NexusComponent.${comp_plan_id}.plan_based_cost_per_unit_cents == 116667"
            - "NexusComponent.${comp_plan_id}.standard_based_cost_per_unit_cents == 135000"
            - "NexusComponent.${comp_plan_id}.adopted_cost_per_unit_cents == 101667"
            - "NexusComponent.${comp_std_id}.plan_based_cost_per_unit_cents == 116667"
            - "NexusComponent.${comp_std_id}.standard_based_cost_per_unit_cents == 135000"
            - "NexusComponent.${comp_std_id}.adopted_cost_per_unit_cents == 120000"
            - "NexusComponent.${comp_plan_id}.adopted_cost_per_unit_cents != NexusComponent.${comp_std_id}.adopted_cost_per_unit_cents"
            - "NexusComponent.${comp_plan_id}.nexus_ratio == 1.1667 and NexusComponent.${comp_std_id}.nexus_ratio == 1.1667"
            - "NexusComponent.${comp_plan_id}.allocation_status == VALID"

      - name: credit_claim_nominal_versus_present_value_valuation
        grounds:
          - calculations.credit_claim_valuation
          - entities.CreditClaim.fields.valuation_method
          - entities.CreditClaim.fields.claimed_credit_cents
          - entities.FeeProgram.fields.discount_rate_bp
        distinguishing_aspect: |
          The second dual-variant pair lives on a different entity (CreditClaim) and a
          different formula family (discounting, not cost allocation): the same
          120,000 cents-per-year tax contribution over 10 years is valued at
          1,200,000 under NOMINAL and 973,307 under PRESENT_VALUE at
          discount_rate_bp 400, and a 1,000,000 improvement over a 3-year horizon
          is valued at 1,000,000 versus 888,996.
        test_recipe:
          setup:
            - "HARBOR program with discount_rate_bp 400 (default) and one EFFECTIVE PLAN_BASED study pricing PARKS and ROADS for SINGLE_FAMILY."
            - "One 10-dwelling SINGLE_FAMILY application filed by developer dev-1 and assessed, net_due_cents 5,189,521."
            - "Logical clock at 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "ROADS", name: "Arterial Roads", demand_unit_label: "trip", existing_los_per_demand_unit: 0.0008, planned_los_per_demand_unit: 0.0006, unit_cost_cents: 250000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_roads_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_parks_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_roads_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 200000, demand_units_per_dwelling: 1.0100, demand_units_per_1000_nonres_sqft: 3.7500, planned_facility_cost_cents: 900000000, planned_growth_share_bp: 6500, planned_capacity_demand_units: 2000, planned_other_funding_cents: 100000000, existing_tax_credit_per_unit_cents: 0 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_roads_id: $.data.id }
            - call: "POST /nexus-components/${comp_parks_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_parks_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 2.5000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 1.0100 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fee-studies/${study_id}/certify-nexus"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_id}/publish-notice"
              payload: { notice_method: "NEWSPAPER", notice_days: 30 }
              as: CouncilClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-14T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_id}/close-protest-window"
              as: CouncilClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_id}/adopt"
              as: CouncilClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-16T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_id}/activate"
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /development-applications"
              payload: { fee_program_id: "${prog_id}", permit_number: "BP-1001", land_use_category: "SINGLE_FAMILY", collection_trigger: "PERMIT", dwelling_units: 10, nonres_sqft: 0 }
              as: Developer
              as_user_id: "dev-1"
              captures: { app_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /development-applications/${app_id}/assess"
              as: PermitOfficer
              as_user_id: "permit-1"
          trigger:
            - call: "POST /development-applications/${app_id}/credit-claims"
              payload: { facility_category_code: "PARKS", credit_type: "EXISTING_TAX_CONTRIBUTION", valuation_method: "NOMINAL", improvement_value_cents: 0, annual_tax_contribution_cents: 120000, contribution_years: 10 }
              as: Developer
              as_user_id: "dev-1"
              captures: { claim_nominal_id: $.data.id }
            - call: "POST /development-applications/${app_id}/credit-claims"
              payload: { facility_category_code: "ROADS", credit_type: "EXISTING_TAX_CONTRIBUTION", valuation_method: "PRESENT_VALUE", improvement_value_cents: 0, annual_tax_contribution_cents: 120000, contribution_years: 10 }
              as: Developer
              as_user_id: "dev-1"
              captures: { claim_pv_id: $.data.id }
          assert:
            - "CreditClaim.${claim_nominal_id}.claimed_credit_cents == 1200000"
            - "CreditClaim.${claim_pv_id}.claimed_credit_cents == 973307"
            - "CreditClaim.${claim_nominal_id}.claimed_credit_cents - CreditClaim.${claim_pv_id}.claimed_credit_cents == 226693"
            - "CreditClaim.${claim_nominal_id}.status == SUBMITTED and CreditClaim.${claim_pv_id}.status == SUBMITTED"
            - "CreditClaim.${claim_nominal_id}.approved_cents == 0 and CreditClaim.${claim_pv_id}.approved_cents == 0"
            - "DevelopmentApplication.${app_id}.net_due_cents == 5189521 (unchanged: submission alone applies no credit)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: plan_based_denominator_takes_the_min_of_growth_and_planned_capacity
        grounds:
          - calculations.cost_per_demand_unit
          - entities.NexusComponent.fields.planned_capacity_demand_units
          - entities.NexusComponent.fields.nexus_ratio
          - validations[priority=49]
        distinguishing_aspect: |
          Mode (a) - the formula nests min() inside a subtraction inside a division:
          with capacity 2500 below growth 3000 the denominator is the capacity, so
          the plan-based cost is 350,000,000/2500 = 140,000 (adopted 125,000) rather
          than the 116,667 the growth denominator would give, and the same component
          simultaneously fails certification because nexus_ratio is 0.8333.
        test_recipe:
          setup:
            - "HARBOR program at default constants."
            - "One PARKS facility standard as in the fixture header."
            - "One DRAFT PLAN_BASED study with a PARKS component whose planned_capacity_demand_units is 2500 against growth_demand_units 3000.0000."
            - "One VALID SINGLE_FAMILY schedule line on that component so certification is not blocked by a missing schedule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 2500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /nexus-components/${comp_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 2.5000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { item_id: $.data.id }
            - call: "POST /fee-studies/${study_id}/certify-nexus"
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "NexusComponent.${comp_id}.growth_demand_units == 3000.0000"
            - "NexusComponent.${comp_id}.plan_based_cost_per_unit_cents == 140000"
            - "NexusComponent.${comp_id}.standard_based_cost_per_unit_cents == 135000"
            - "NexusComponent.${comp_id}.adopted_cost_per_unit_cents == 125000"
            - "NexusComponent.${comp_id}.nexus_ratio == 0.8333"
            - "FeeScheduleItem.${item_id}.fee_per_unit_cents == 312500"
            - "the certify-nexus call returns 409 with error_id ERR_NEXUS_RATIO_INSUFFICIENT"
            - "FeeStudy.${study_id}.status == DRAFT and FeeStudy.${study_id}.certified_by_user_id == null"

      - name: administrative_charge_rounds_per_line_then_sums
        grounds:
          - calculations.application_assessment
          - entities.FeeProgram.fields.admin_charge_bp
          - entities.DevelopmentApplication.fields.admin_charge_cents
          - entities.DevelopmentApplication.fields.assessed_lines
        distinguishing_aspect: |
          Mode (b) - rounding placement: two approved credits (PARKS 2,500,000 and
          ROADS 2,400,000) are capped to 2,519,185 and waterfalled by category code,
          leaving line nets 41,680 and 2,477,505 whose per-line 3% charges round to
          1,250 and 74,325 for an admin total of 75,575 and net_due 2,594,760; the
          aggregate-then-round reading yields 75,576 and 2,594,761, one cent apart.
        test_recipe:
          setup:
            - "HARBOR program with admin_charge_bp 300 and credit_cap_bp 5000 (defaults)."
            - "EFFECTIVE PLAN_BASED study pricing PARKS (254,168) and ROADS (249,669) for SINGLE_FAMILY."
            - "10-dwelling SINGLE_FAMILY application assessed at gross 5,038,370 with net_due 5,189,521."
            - "Two SUBMITTED credit claims on that application: 2,500,000 against PARKS and 2,400,000 against ROADS, both NOMINAL improvement credits."
            - "Logical clock at 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "ROADS", name: "Arterial Roads", demand_unit_label: "trip", existing_los_per_demand_unit: 0.0008, planned_los_per_demand_unit: 0.0006, unit_cost_cents: 250000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_roads_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_parks_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_roads_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 200000, demand_units_per_dwelling: 1.0100, demand_units_per_1000_nonres_sqft: 3.7500, planned_facility_cost_cents: 900000000, planned_growth_share_bp: 6500, planned_capacity_demand_units: 2000, planned_other_funding_cents: 100000000, existing_tax_credit_per_unit_cents: 0 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_roads_id: $.data.id }
            - call: "POST /nexus-components/${comp_parks_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_parks_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 2.5000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 1.0100 }
