            - call: "POST /cgm/patients/${pt}/device-bindings"
              payload: { sensor_unit_id: "${u2}", channel: "READER" }
              as: Patient
              as_user_id: "${pt}"
            - call: "POST /cgm/sensor-units/${u2}/report-early-failure"
              payload: {}
              as: Patient
              as_user_id: "${pt}"
            - call: "POST /cgm/sensor-units/${u1}/warranty-claims"
              payload: { reported_failure_day_index: 13, failure_category: "SENSOR_ERROR", device_data_attached: true }
