            - "QCSample.${s2_id}.sampled_document_count == 40 and discrepancy_rate == 0.0250 with outcome == PASSED"
            - "after the last trigger call Batch.${b1_id}.status == QC_PASSED"
            - "Reviewer.${ra_id}.scorecard_strikes == 1 — one QC_FAILURE from the at-threshold sample; the 1-error pass earns no credit because it is not error-free"
            - "Reviewer.${ra_id}.accuracy_score == 0.9625 (3 errors over 80 sampled documents), above the 0.9000 removal floor"

      - name: budget_cap_equality_permitted_then_exceeded
        grounds:
          - validations[priority=43]
          - calculations.assignment_commitment_amount
          - entities.Matter.fields.committed_spend_cents
        distinguishing_aspect: "EXACT-EQUALITY boundary on a money cap, the opposite sense of the ratio boundary above: committed 85200 against a cap of exactly 85200 is permitted (201), while the next commitment of 21300 crosses it and is refused with 402."
        test_recipe:
          setup:
