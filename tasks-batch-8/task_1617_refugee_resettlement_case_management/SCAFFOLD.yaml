# =============================================================================
# PRD Benchmark Seed Tables — Refugee Resettlement Case Management
# =============================================================================

scenario: |
  Refugee Resettlement Case Management (resettlement agency affiliate): arrival notification & housing/furnishing preparation, airport pickup & initial 30/90-day service benchmarks, benefits enrollment & social security/ID applications, school enrollment & health screening scheduling, employment services & self-sufficiency plan, cultural orientation curriculum delivery, case note documentation & federal reporting, secondary migration & case transfer

domain_name: refugee-resettlement-case-management
api_prefix: ""

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency        # OCC on Case.version guards POST /employment-plans (create-with-supersede)
    - cascading_side_effects        # arrival cascade and transfer-acceptance cascade span 3+ entities
    - derived_field_reconciliation  # Case.posture and Case.topics_completed derive from child entities
    - rate_threshold_triggers       # self-sufficiency income thresholds, benchmark due-date crossings
  entity_topology: flat             # peer collections joined by FK references; creates are all top-level
  state_machine_shape: cyclic       # BenefitApplication re-file loop, ServiceBenchmark rescind loop, FederalReport revision loop, plus CaseTransfer branching
  relationship_patterns:
    - one_to_many                   # Case -> members/setups/benchmarks/applications/plans/sessions/notes/transfers
    - cross_aggregate               # HousingSetup -> HousingUnit; ServiceBenchmark -> CaseNote (evidence)
  role_model: segregation_of_duties # report submitter != reviewer (enforced on user id), plus peer-role resource ownership
  consistency_model: immediate      # every mutation visible in the same request's response

# =============================================================================
# §1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: case_number, type: string, source: input, description: "Agency-assigned case number; unique across all cases (ERR_DUPLICATE_CASE_NUMBER)" }
      - { name: agency_affiliate_code, type: string, source: input, description: "Code of the receiving affiliate office that owns this case" }
      - { name: household_size, type: integer, source: input, description: "Declared household size from the arrival notification; drives housing capacity and income thresholds", constraints: ">= 1" }
      - { name: scheduled_arrival_date, type: datetime, source: input, description: "Scheduled arrival date from the arrival notification, ISO date YYYY-MM-DD" }
      - { name: actual_arrival_date, type: datetime, source: system, description: "Actual arrival date recorded by POST /cases/{id}/arrive; null until arrival", default: null }
      - { name: airport_pickup_completed, type: boolean, source: system, description: "Set true by the arrive transition (airport pickup is recorded as part of arrival)", default: false }
      - { name: status, type: enum, source: system, description: "PRE_ARRIVAL | ARRIVED | TRANSFERRED_OUT", constraints: "initial PRE_ARRIVAL" }
      - { name: posture, type: enum, source: computed, description: "ON_TRACK | AT_RISK | OVERDUE — derived on read from ServiceBenchmark due dates vs the logical clock (see case_posture)" }
      - { name: topics_completed, type: array, source: computed, description: "Sorted unique list of cultural-orientation topics with a COMPLETED OrientationSession for this case" }
      - { name: open_transfer_id, type: string, source: system, description: "id of the INITIATED CaseTransfer freezing this case; null when no open transfer", default: null }

  - name: HouseholdMember
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning case (members may only be added while the case is PRE_ARRIVAL)" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: relationship, type: enum, source: input, description: "PRINCIPAL | SPOUSE | CHILD | OTHER_RELATIVE" }
      - { name: work_eligible, type: boolean, source: input, description: "Whether the member is legally work-eligible per the arrival notification" }
      - { name: age_at_arrival, type: integer, source: computed, description: "Age in whole years on the case's actual_arrival_date; null until arrival", default: null }
      - { name: school_age_at_arrival, type: boolean, source: computed, description: "true iff 5 <= age_at_arrival <= 17; null until arrival", default: null }

  - name: HousingUnit
    parent: null
    common_fields: true
    fields:
      - { name: address, type: string, source: input, description: "Unit street address" }
      - { name: bedrooms, type: integer, source: input, description: "Bedroom count; capacity gate uses ceil(household_size / 2)", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | RESERVED | OCCUPIED — derived on read from this unit's non-terminal HousingSetups vs the logical clock (see housing_unit_status)" }

  - name: HousingSetup
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this housing preparation serves (case must be PRE_ARRIVAL)" }
      - { name: housing_unit_id, type: string, source: input, description: "FK -> HousingUnit.id; the assigned unit" }
      - { name: occupancy_start, type: datetime, source: input, description: "Occupancy window start, ISO date (inclusive)" }
      - { name: occupancy_end, type: datetime, source: input, description: "Occupancy window end, ISO date (exclusive); must be > occupancy_start" }
      - { name: furnishing_items_completed, type: array, source: system, description: "Subset of REQUIRED_FURNISHINGS already completed; starts empty", default: [] }
      - { name: status, type: enum, source: system, description: "PREPARING | READY | OCCUPIED | VACATED", constraints: "initial PREPARING" }

  - name: ServiceBenchmark
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (benchmarks are seeded by the arrive transition)" }
      - { name: service_type, type: enum, source: system, description: "HOME_VISIT | HEALTH_SCREENING | SSN_APPLICATION | BENEFITS_ENROLLMENT | SCHOOL_ENROLLMENT | EMPLOYMENT_PLAN | CULTURAL_ORIENTATION" }
      - { name: due_rule, type: enum, source: system, description: "DAYS_30 | DAYS_90 — offset applied to the arrival basis" }
      - { name: planned_due_date, type: datetime, source: computed, description: "scheduled_arrival_date + due_rule offset (SCHEDULED basis; planning view)" }
      - { name: due_date, type: datetime, source: computed, description: "actual_arrival_date + due_rule offset (ACTUAL basis; compliance view)" }
      - { name: fulfilled_on, type: datetime, source: system, description: "Date the service was delivered; null while PENDING", default: null }
      - { name: evidence_note_id, type: string, source: system, description: "FK -> CaseNote.id; SERVICE_DELIVERY note documenting fulfillment; null for auto-fulfilled CULTURAL_ORIENTATION", default: null }
      - { name: on_time, type: boolean, source: computed, description: "true iff fulfilled_on <= due_date; null while PENDING", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | MET | WAIVED", constraints: "initial PENDING" }
      - { name: waived_reason, type: string, source: system, description: "Waiver reason (manual waive) or TRANSFER (cascade); null unless WAIVED", default: null }

  - name: BenefitApplication
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning case (must be ARRIVED with no open transfer)" }
      - { name: member_id, type: string, source: input, description: "FK -> HouseholdMember.id; the member the application is for (must belong to case_id)" }
      - { name: benefit_type, type: enum, source: input, description: "SSN | STATE_ID | CASH_ASSISTANCE | MEDICAL | FOOD_ASSISTANCE" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | APPROVED | DENIED | APPEALED | WITHDRAWN", constraints: "initial DRAFT" }
      - { name: filed_on, type: datetime, source: system, description: "Logical-clock date of the most recent DRAFT->FILED or APPEALED->FILED transition; null until first filed", default: null }
      - { name: decided_on, type: datetime, source: system, description: "Logical-clock date of the most recent APPROVED/DENIED decision; null until decided, cleared on re-file", default: null }

  - name: EmploymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning case (must be ARRIVED with no open transfer)" }
      - { name: monthly_income_cents, type: integer, source: input, description: "Current gross monthly household earned income in cents", default: 0, constraints: ">= 0" }
      - { name: trailing_3m_income_cents, type: integer, source: input, description: "Gross earned income over the trailing 3 calendar months in cents", default: 0, constraints: ">= 0" }
      - { name: job_start_date, type: datetime, source: input, description: "ISO date of the most recent employment start; null if unemployed", default: null }
      - { name: employed_members_count, type: integer, source: input, description: "Number of household members currently employed", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CERTIFIED | SUPERSEDED | CLOSED_TRANSFERRED", constraints: "initial ACTIVE" }
      - { name: self_sufficient, type: boolean, source: computed, description: "Result of the most recent certification determination; null until first certify", default: null }
      - { name: determination_variant, type: enum, source: system, description: "MONTHLY | ANNUALIZED — variant used by the most recent certification; null until first certify", default: null }
      - { name: certified_on, type: datetime, source: system, description: "Logical-clock date of the successful certification; null unless CERTIFIED", default: null }

  - name: OrientationSession
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case receiving cultural orientation (must be ARRIVED with no open transfer)" }
      - { name: topic, type: enum, source: input, description: "US_LAWS | HEALTHCARE_ACCESS | EDUCATION_SYSTEM | EMPLOYMENT_RIGHTS | HOUSING_SAFETY | BUDGETING" }
      - { name: start_at, type: datetime, source: input, description: "Session start, ISO 8601 datetime" }
      - { name: end_at, type: datetime, source: input, description: "Session end, ISO 8601 datetime; must be > start_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", constraints: "initial SCHEDULED" }
      - { name: completed_on, type: datetime, source: system, description: "Logical-clock date of completion; null unless COMPLETED", default: null }

  - name: CaseNote
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case documented" }
      - { name: note_type, type: enum, source: input, description: "GENERAL | SERVICE_DELIVERY | INCIDENT | TRANSFER" }
      - { name: body, type: string, source: input, description: "Free-text note body" }
      - { name: service_date, type: datetime, source: input, description: "ISO date the documented service occurred; optional", default: null }
      - { name: author_role, type: enum, source: system, description: "CASE_MANAGER | HOUSING_COORDINATOR | EMPLOYMENT_SPECIALIST | AGENCY_DIRECTOR — mapped from X-User-Role" }

  - name: CaseTransfer
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case being transferred (must be ARRIVED, no other INITIATED transfer)" }
      - { name: receiving_affiliate_code, type: string, source: input, description: "Affiliate code of the receiving office (secondary migration destination)" }
      - { name: reason, type: enum, source: input, description: "SECONDARY_MIGRATION | FAMILY_REUNIFICATION | EMPLOYMENT_OPPORTUNITY" }
      - { name: status, type: enum, source: system, description: "INITIATED | COMPLETED | REJECTED | WITHDRAWN", constraints: "initial INITIATED" }
      - { name: initiated_by_user_id, type: string, source: system, description: "X-User-ID of the initiating CaseManager" }
      - { name: responded_by_user_id, type: string, source: system, description: "X-User-ID of the responding AgencyDirector; null until responded", default: null }
      - { name: decision_note, type: string, source: system, description: "Optional note recorded at respond; null until responded", default: null }

  - name: FederalReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Reporting period start, ISO date (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end, ISO date (exclusive); must be > period_start" }
      - { name: cases_arrived_count, type: integer, source: computed, description: "Cases with actual_arrival_date in [period_start, period_end) — snapshot at generation" }
      - { name: benchmarks_met_count, type: integer, source: computed, description: "Benchmarks of included cases with due_date in period and status MET — snapshot" }
      - { name: benchmarks_met_on_time_count, type: integer, source: computed, description: "Subset of benchmarks_met_count with on_time == true — snapshot" }
      - { name: benchmarks_pending_count, type: integer, source: computed, description: "Benchmarks of included cases with due_date in period and status PENDING — snapshot" }
      - { name: benchmarks_waived_count, type: integer, source: computed, description: "Benchmarks of included cases with due_date in period and status WAIVED — snapshot" }
      - { name: per_capita_allocation_cents, type: integer, source: computed, description: "Sum of per-case rounded per-capita allocations (see report_per_capita_allocation) — snapshot" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED", constraints: "initial DRAFT; REJECTED reviews return the report to DRAFT" }
      - { name: revision_count, type: integer, source: system, description: "Number of times the report has been rejected back to DRAFT", default: 0 }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the AgencyDirector who submitted; null while DRAFT, cleared on rejection", default: null }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the FederalOfficer who last reviewed; null until reviewed", default: null }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: PRE_ARRIVAL
    terminal_states: [TRANSFERRED_OUT]
    transitions:
      - from: PRE_ARRIVAL
        to: ARRIVED
        trigger: "POST /cases/{id}/arrive"
        actor: CaseManager
        preconditions:
          - "A HousingSetup with case_id == Case.id exists with status READY (else ERR_HOUSING_NOT_READY)"
        side_effects:
          - "actual_arrival_date := request actual_arrival_date; airport_pickup_completed := true"
          - "Each HouseholdMember of the case: age_at_arrival and school_age_at_arrival computed"
          - "Seed ServiceBenchmarks (see benchmark_due_schedule): HOME_VISIT, HEALTH_SCREENING, SSN_APPLICATION, BENEFITS_ENROLLMENT, CULTURAL_ORIENTATION always; SCHOOL_ENROLLMENT iff >= 1 member with school_age_at_arrival == true; EMPLOYMENT_PLAN iff >= 1 member with work_eligible == true and age_at_arrival >= 18"
          - "The READY HousingSetup for this case transitions to OCCUPIED"
          - "Because that HousingSetup became OCCUPIED, its HousingUnit's derived status recomputes to OCCUPIED"
          - "Increments Case.version by 1"

      - from: ARRIVED
        to: TRANSFERRED_OUT
        trigger: "system (CaseTransfer respond with decision ACCEPTED)"
        actor: system
        preconditions:
          - "The accepted CaseTransfer is INITIATED and its case_id == Case.id"
        side_effects:
          - "open_transfer_id := null"
          - "Because Case became TRANSFERRED_OUT: the non-terminal HousingSetup (PREPARING/READY/OCCUPIED) -> VACATED, and that vacancy recomputes its HousingUnit status (AVAILABLE unless another non-terminal setup covers today)"
          - "Because Case became TRANSFERRED_OUT: EmploymentPlan in ACTIVE -> CLOSED_TRANSFERRED"
          - "Because Case became TRANSFERRED_OUT: BenefitApplications in DRAFT/FILED/DENIED/APPEALED -> WITHDRAWN"
          - "Because Case became TRANSFERRED_OUT: OrientationSessions in SCHEDULED -> CANCELLED"
          - "Because this case's SCHEDULED OrientationSessions were CANCELLED: the CULTURAL_ORIENTATION benchmark, if PENDING, -> WAIVED with waived_reason TRANSFER"
          - "Because Case became TRANSFERRED_OUT: all other PENDING ServiceBenchmarks -> WAIVED with waived_reason TRANSFER"
          - "Increments Case.version by 1"

  - entity: HousingSetup
    initial_state: PREPARING
    terminal_states: [VACATED]
    transitions:
      - from: PREPARING
        to: READY
        trigger: "POST /housing-setups/{id}/ready"
        actor: HousingCoordinator
        preconditions:
          - "furnishing_items_completed contains every member of REQUIRED_FURNISHINGS (else ERR_FURNISHING_INCOMPLETE)"
        side_effects: []

      - from: READY
        to: OCCUPIED
        trigger: "system (Case PRE_ARRIVAL -> ARRIVED)"
        actor: system
        preconditions: []
        side_effects:
          - "HousingUnit derived status recomputes to OCCUPIED while today is within [occupancy_start, occupancy_end)"

      - from: PREPARING
        to: VACATED
        trigger: "POST /housing-setups/{id}/vacate OR system (Case -> TRANSFERRED_OUT)"
        actor: HousingCoordinator | system
        preconditions: []
        side_effects:
          - "HousingUnit derived status recomputes (AVAILABLE unless another non-terminal setup covers today)"

      - from: READY
        to: VACATED
        trigger: "POST /housing-setups/{id}/vacate OR system (Case -> TRANSFERRED_OUT)"
        actor: HousingCoordinator | system
        preconditions: []
        side_effects:
          - "HousingUnit derived status recomputes (AVAILABLE unless another non-terminal setup covers today)"

      - from: OCCUPIED
        to: VACATED
        trigger: "POST /housing-setups/{id}/vacate OR system (Case -> TRANSFERRED_OUT)"
        actor: HousingCoordinator | system
        preconditions: []
        side_effects:
          - "HousingUnit derived status recomputes (AVAILABLE unless another non-terminal setup covers today)"

  - entity: ServiceBenchmark
    initial_state: PENDING
    terminal_states: [WAIVED]
    transitions:
      - from: PENDING
        to: MET
        trigger: "POST /benchmarks/{id}/fulfill"
        actor: CaseManager
        preconditions:
          - "Case has no open transfer (else ERR_CASE_TRANSFER_PENDING)"
          - "evidence_note_id identifies an existing CaseNote with case_id == benchmark.case_id and note_type == SERVICE_DELIVERY (else ERR_EVIDENCE_NOTE_INVALID)"
          - "case.actual_arrival_date <= fulfilled_on <= current logical clock date (else ERR_VALIDATION)"
          - "If service_type == SCHOOL_ENROLLMENT: enrolled_member_ids must equal exactly the set of the case's HouseholdMembers with school_age_at_arrival == true (else ERR_MEMBER_NOT_ELIGIBLE)"
        side_effects:
          - "fulfilled_on := request fulfilled_on; evidence_note_id := request evidence_note_id"
          - "on_time := (fulfilled_on <= due_date) per benchmark_on_time_determination"

      - from: PENDING
        to: MET
        trigger: "system (an OrientationSession completion makes topics_completed cover all six curriculum topics)"
        actor: system
        preconditions:
          - "service_type == CULTURAL_ORIENTATION"
        side_effects:
          - "fulfilled_on := the completing session's completed_on; evidence_note_id := null"
          - "on_time := (fulfilled_on <= due_date)"

      - from: PENDING
        to: WAIVED
        trigger: "POST /benchmarks/{id}/waive OR system (Case -> TRANSFERRED_OUT)"
        actor: AgencyDirector | system
        preconditions:
          - "Case has no open transfer when waived manually (else ERR_CASE_TRANSFER_PENDING)"
        side_effects:
          - "waived_reason := request reason (manual) or TRANSFER (cascade)"

      - from: MET
        to: PENDING
        trigger: "POST /benchmarks/{id}/rescind"
        actor: CaseManager
        preconditions:
          - "evidence_note_id != null (only manually fulfilled benchmarks can be rescinded; else ERR_INVALID_STATE)"
          - "Case has no open transfer (else ERR_CASE_TRANSFER_PENDING)"
        side_effects:
          - "fulfilled_on := null; evidence_note_id := null; on_time := null"

  - entity: BenefitApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /benefit-applications/{id}/transition (to_status FILED)"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "filed_on := current logical clock date"

      - from: FILED
        to: APPROVED
        trigger: "POST /benefit-applications/{id}/transition (to_status APPROVED)"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "decided_on := current logical clock date"

      - from: FILED
        to: DENIED
        trigger: "POST /benefit-applications/{id}/transition (to_status DENIED)"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "decided_on := current logical clock date"

      - from: DENIED
        to: APPEALED
        trigger: "POST /benefit-applications/{id}/transition (to_status APPEALED)"
        actor: CaseManager
        preconditions: []
        side_effects: []

      - from: APPEALED
        to: FILED
        trigger: "POST /benefit-applications/{id}/transition (to_status FILED)"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "filed_on := current logical clock date; decided_on := null (re-file cycle)"
          - "note: the DRAFT -> FILED -> DENIED -> APPEALED -> FILED loop is the appeal cycle"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /benefit-applications/{id}/transition (to_status WITHDRAWN) OR system (Case -> TRANSFERRED_OUT)"
        actor: CaseManager | system
        preconditions: []
        side_effects: []

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /benefit-applications/{id}/transition (to_status WITHDRAWN) OR system (Case -> TRANSFERRED_OUT)"
        actor: CaseManager | system
        preconditions: []
        side_effects: []

      - from: DENIED
        to: WITHDRAWN
        trigger: "system (Case -> TRANSFERRED_OUT)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPEALED
        to: WITHDRAWN
        trigger: "system (Case -> TRANSFERRED_OUT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EmploymentPlan
    initial_state: ACTIVE
    terminal_states: [CERTIFIED, SUPERSEDED, CLOSED_TRANSFERRED]
    transitions:
      - from: ACTIVE
        to: CERTIFIED
        trigger: "POST /employment-plans/{id}/certify"
        actor: EmploymentSpecialist
        preconditions:
          - "self_sufficiency_determination with the requested variant yields self_sufficient == true"
        side_effects:
          - "self_sufficient := true; determination_variant := request variant; certified_on := current logical clock date"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /employment-plans/{id}/certify"
        actor: EmploymentSpecialist
        preconditions:
          - "self_sufficiency_determination with the requested variant yields self_sufficient == false"
        side_effects:
          - "self_sufficient := false; determination_variant := request variant (status remains ACTIVE; may re-certify after income updates)"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new EmploymentPlan is created for the same case)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CLOSED_TRANSFERRED
        trigger: "system (Case -> TRANSFERRED_OUT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OrientationSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /orientation-sessions/{id}/complete"
        actor: CaseManager
        preconditions:
          - "Case has no open transfer (else ERR_CASE_TRANSFER_PENDING)"
        side_effects:
          - "completed_on := current logical clock date"
          - "Because this session became COMPLETED, the case's topics_completed recomputes (topic added)"
          - "Because topics_completed changed: if it now covers all six topics and the CULTURAL_ORIENTATION benchmark is PENDING, that benchmark auto-transitions to MET"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (Case -> TRANSFERRED_OUT)"
        actor: system
        preconditions: []
        side_effects:
          - "Because this case's SCHEDULED sessions were CANCELLED, the PENDING CULTURAL_ORIENTATION benchmark -> WAIVED with waived_reason TRANSFER"

  - entity: CaseTransfer
    initial_state: INITIATED
    terminal_states: [COMPLETED, REJECTED, WITHDRAWN]
    transitions:
      - from: INITIATED
        to: COMPLETED
        trigger: "POST /case-transfers/{id}/respond (decision ACCEPTED)"
        actor: AgencyDirector
        preconditions: []
        side_effects:
          - "responded_by_user_id := X-User-ID; decision_note := request decision_note"
          - "Because the transfer became COMPLETED, its Case transitions ARRIVED -> TRANSFERRED_OUT (full cascade per Case state machine)"

      - from: INITIATED
        to: REJECTED
        trigger: "POST /case-transfers/{id}/respond (decision REJECTED)"
        actor: AgencyDirector
        preconditions: []
        side_effects:
          - "responded_by_user_id := X-User-ID; decision_note := request decision_note"
          - "Case.open_transfer_id := null; increments Case.version by 1 (reject branch: NO service cascade — sessions, applications, plan, setup all unchanged)"

      - from: INITIATED
        to: WITHDRAWN
        trigger: "POST /case-transfers/{id}/withdraw"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "Case.open_transfer_id := null; increments Case.version by 1"

  - entity: FederalReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /federal-reports/{id}/submit"
        actor: AgencyDirector
        preconditions:
          - "Every case counted in cases_arrived_count has at least one CaseNote (else ERR_REPORT_DOCUMENTATION_INCOMPLETE)"
        side_effects:
          - "submitted_by_user_id := X-User-ID"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /federal-reports/{id}/review (decision ACCEPTED)"
        actor: FederalOfficer
        preconditions:
          - "reviewer X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /federal-reports/{id}/review (decision REJECTED)"
        actor: FederalOfficer
        preconditions:
          - "reviewer X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID; submitted_by_user_id := null; revision_count += 1 (revision loop: report may be re-submitted)"

# =============================================================================
# §1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /employment-plans"
    occ_field: "expected_case_version"
    description: |
      Creating an EmploymentPlan against a Case whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created a plan (which legitimately
      supersedes the prior ACTIVE plan) or otherwise mutated the case, so the
      current writer's view of the case is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: benchmark_due_schedule
    trigger: "Case PRE_ARRIVAL -> ARRIVED (benchmark seeding)"
    algorithm: forward_looking
    formula: |
      OFFSET_DAYS: DAYS_30 -> 30 days, DAYS_90 -> 90 days.
      planned_due_date = scheduled_arrival_date + OFFSET_DAYS(due_rule)   # SCHEDULED basis
      due_date         = actual_arrival_date + OFFSET_DAYS(due_rule)      # ACTUAL basis
      Date arithmetic is whole-day on ISO dates; both fields are stored at seeding.
    input_set: |
      Seeded benchmarks: HOME_VISIT (DAYS_30), HEALTH_SCREENING (DAYS_30),
      SSN_APPLICATION (DAYS_30), BENEFITS_ENROLLMENT (DAYS_30),
      CULTURAL_ORIENTATION (DAYS_90) always; SCHOOL_ENROLLMENT (DAYS_30) iff
      >= 1 HouseholdMember with school_age_at_arrival == true;
      EMPLOYMENT_PLAN (DAYS_90) iff >= 1 HouseholdMember with
      work_eligible == true and age_at_arrival >= 18.
    constants:
      DAYS_30_OFFSET: 30
      DAYS_90_OFFSET: 90
    precision: "whole ISO dates, no time component"
    variants:
      - name: SCHEDULED_BASIS
        when: "Pre-arrival planning view (planned_due_date)"
        difference: "Computed from scheduled_arrival_date; diverges from ACTUAL basis whenever actual_arrival_date != scheduled_arrival_date — the same fulfillment date can be late under SCHEDULED and on-time under ACTUAL"
      - name: ACTUAL_BASIS
        when: "Compliance view used by benchmark_on_time_determination (due_date)"
        difference: "Computed from actual_arrival_date"

  - name: benchmark_on_time_determination
    trigger: "ServiceBenchmark PENDING -> MET (manual fulfill or CULTURAL_ORIENTATION auto-fulfill)"
    algorithm: threshold
    formula: |
      on_time = (fulfilled_on <= due_date)
      Boundary: fulfilled_on == due_date counts ON TIME (inclusive <=);
      fulfilled_on == due_date + 1 day is late (on_time == false).
    input_set: "The single benchmark being fulfilled; comparison on ISO dates"
    constants: {}
    precision: "whole ISO dates"

  - name: case_posture
    trigger: "computed on read of Case (GET /cases/{id}) using the current logical clock date"
    algorithm: threshold
    formula: |
      today = current logical clock date
      if any ServiceBenchmark of the case has status == PENDING and due_date < today:
        posture = OVERDUE
      else if any ServiceBenchmark of the case has status == PENDING and due_date <= today + 7 days:
        posture = AT_RISK
      else:
        posture = ON_TRACK
      Boundary: a benchmark due exactly today is AT_RISK, not OVERDUE
      (OVERDUE requires due_date strictly before today).
    input_set: "All ServiceBenchmarks of the case in any status; only PENDING ones participate"
    constants:
      AT_RISK_WINDOW_DAYS: 7
    precision: "whole ISO dates"

  - name: housing_unit_status
    trigger: "computed on read of HousingUnit (GET /housing-units/{id}) using the current logical clock date"
    algorithm: aggregation
    formula: |
      today = current logical clock date
      active_setups = HousingSetups with housing_unit_id == unit.id and status in {PREPARING, READY, OCCUPIED}
      if any active_setup has occupancy_start <= today < occupancy_end: status = OCCUPIED
      else if active_setups is non-empty: status = RESERVED
      else: status = AVAILABLE
      Vacating a setup (or transfer cascade) removes it from active_setups, so the
      unit returns to AVAILABLE when no other non-terminal setup remains.
    input_set: "HousingSetups of the unit with status in {PREPARING, READY, OCCUPIED}; VACATED excluded"
    constants: {}
    precision: "whole ISO dates"

  - name: self_sufficiency_determination
    trigger: "POST /employment-plans/{id}/certify"
    algorithm: threshold
    formula: |
      size = Case.household_size of the plan's case
      threshold_monthly_cents = FPG_MONTHLY_BASE_CENTS + (size - 1) * FPG_MONTHLY_INCREMENT_CENTS
      variant MONTHLY:
        effective = monthly_income_cents - min(monthly_income_cents, EARNED_DISREGARD_MONTHLY_CENTS)
        self_sufficient = (effective >= threshold_monthly_cents)
      variant ANNUALIZED:
        effective3 = trailing_3m_income_cents - min(trailing_3m_income_cents, 3 * EARNED_DISREGARD_MONTHLY_CENTS)
        self_sufficient = (effective3 >= 3 * threshold_monthly_cents)
      Both comparisons are integer cents; boundary is inclusive (>=).
    input_set: "The plan's monthly_income_cents and trailing_3m_income_cents, the case's household_size, and the request's variant"
    constants:
      FPG_MONTHLY_BASE_CENTS: 130000
      FPG_MONTHLY_INCREMENT_CENTS: 45000
      EARNED_DISREGARD_MONTHLY_CENTS: 20000
    precision: "integer cents, exact comparison (>=)"
    variants:
      - name: MONTHLY
        when: "Certify with variant MONTHLY — current-month run-rate test"
        difference: "Uses monthly_income_cents with a single monthly disregard; a recently hired household can pass MONTHLY while failing ANNUALIZED"
      - name: ANNUALIZED
        when: "Certify with variant ANNUALIZED — trailing-quarter run-rate test"
        difference: "Uses trailing_3m_income_cents with a 3x disregard against a 3x threshold; produces the opposite verdict from MONTHLY when current income is high but trailing income is low"

  - name: report_per_capita_allocation
    trigger: "POST /federal-reports (snapshot at generation)"
    algorithm: aggregation
    formula: |
      For each included case (actual_arrival_date in [period_start, period_end)):
        case_months = number of calendar months whose [month_start, next_month_start)
                      overlaps [max(actual_arrival_date, period_start), period_end)
        size_capped = min(household_size, SIZE_CAP)
        raw_cents = PER_CAPITA_ANNUAL_CENTS * size_capped * case_months / 12
        case_allocation_cents = round_half_up(raw_cents to integer cents)
      per_capita_allocation_cents = sum(case_allocation_cents over included cases)
      PINNED ROUNDING ORDER: round each case's allocation to integer cents FIRST,
      then sum. (Summing raw values then rounding once is the forbidden
      alternative; the two orders diverge by >= 1 cent whenever >= 2 cases carry
      fractional-cent remainders.)
    input_set: "Cases with actual_arrival_date in [period_start, period_end), any status (ARRIVED or TRANSFERRED_OUT); PRE_ARRIVAL cases are never included"
    constants:
      PER_CAPITA_ANNUAL_CENTS: 1250000
      SIZE_CAP: 8
    precision: "integer cents, round_half_up per case, then integer sum"

  - name: report_snapshot_counts
    trigger: "POST /federal-reports (snapshot at generation)"
    algorithm: aggregation
    formula: |
      included_cases = cases with actual_arrival_date in [period_start, period_end)
      cases_arrived_count = count(included_cases)
      counted_benchmarks = ServiceBenchmarks whose case_id is in included_cases
                           and due_date in [period_start, period_end)
      benchmarks_met_count          = count(counted_benchmarks with status == MET)
      benchmarks_met_on_time_count  = count(counted_benchmarks with status == MET and on_time == true)
      benchmarks_pending_count      = count(counted_benchmarks with status == PENDING)
      benchmarks_waived_count       = count(counted_benchmarks with status == WAIVED)
      Boundary: due_date == period_end is EXCLUDED (half-open period);
      due_date == period_start is INCLUDED.
    input_set: "Snapshot at generation time; later benchmark transitions do NOT mutate an existing report's counts"
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role is permitted on this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist (validated left-to-right), then body FK ids exist (case_id, member_id, housing_unit_id, evidence_note_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: business_constraint
    check: "Schema and field validity: required fields present; enum values valid; occupancy_end > occupancy_start; end_at > start_at; period_end > period_start; fulfilled_on within [case.actual_arrival_date, current logical clock date]; numeric fields >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "Optimistic concurrency: expected_case_version equals the Case's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /employment-plans"

  - priority: 6
    category: state
    check: "The target resource is in a valid state for the requested transition (wrong from-state; terminal lockdown; case not ARRIVED where required; member creation only while PRE_ARRIVAL; fulfill/waive on a non-PENDING benchmark)"
    error_id: "ERR_INVALID_STATE | ERR_BENCHMARK_NOT_PENDING"
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints"

  - priority: 7
    category: business_safety
    check: "Housing capacity: unit.bedrooms >= ceil(case.household_size / 2) — overcrowding prevention"
    error_id: ERR_HOUSING_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /housing-setups"

  - priority: 8
    category: business_temporal
    check: "Interval conflicts: unit occupancy windows half-open [start, end) must not overlap another non-terminal setup on the same unit; orientation sessions of one case must keep a 30-minute buffer against SCHEDULED/COMPLETED sessions; report periods must not overlap any existing report"
    error_id: "ERR_UNIT_OCCUPANCY_CONFLICT | ERR_SESSION_SCHEDULE_CONFLICT | ERR_REPORT_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "POST /housing-setups, POST /orientation-sessions, POST /federal-reports"

  - priority: 9
    category: business_constraint
    check: "Domain constraints: case must have a READY HousingSetup to arrive (ERR_HOUSING_NOT_READY); at most one non-terminal HousingSetup per case (ERR_SETUP_ALREADY_EXISTS); furnishing item valid and not already completed (ERR_ITEM_ALREADY_FURNISHED); all six furnishing items done before ready (ERR_FURNISHING_INCOMPLETE); orientation topic not already COMPLETED (ERR_TOPIC_ALREADY_DELIVERED) and not already SCHEDULED (ERR_TOPIC_ALREADY_SCHEDULED); no open transfer for frozen operations (ERR_CASE_TRANSFER_PENDING); at most one INITIATED transfer per case (ERR_TRANSFER_ALREADY_OPEN); CASH_ASSISTANCE requires a work_eligible member and SCHOOL_ENROLLMENT fulfillment must list exactly the school-age members (ERR_MEMBER_NOT_ELIGIBLE); case_number unique (ERR_DUPLICATE_CASE_NUMBER)"
    error_id: "ERR_HOUSING_NOT_READY | ERR_SETUP_ALREADY_EXISTS | ERR_ITEM_ALREADY_FURNISHED | ERR_FURNISHING_INCOMPLETE | ERR_TOPIC_ALREADY_DELIVERED | ERR_TOPIC_ALREADY_SCHEDULED | ERR_CASE_TRANSFER_PENDING | ERR_TRANSFER_ALREADY_OPEN | ERR_MEMBER_NOT_ELIGIBLE | ERR_DUPLICATE_CASE_NUMBER"
    http_status: "409 | 422"
    applies_to: "domain endpoints as listed"

  - priority: 10
    category: business_referential
    check: "Evidence linkage: evidence_note_id identifies an existing CaseNote whose case_id matches the benchmark's case and whose note_type is SERVICE_DELIVERY"
    error_id: ERR_EVIDENCE_NOTE_INVALID
    http_status: 422
    applies_to: "POST /benchmarks/{id}/fulfill"

  - priority: 11
    category: business_fiscal
    check: "Reporting audit gates: submit requires every included case to have at least one CaseNote (ERR_REPORT_DOCUMENTATION_INCOMPLETE); reviewer must differ from submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_REPORT_DOCUMENTATION_INCOMPLETE | ERR_SEGREGATION_OF_DUTIES"
    http_status: "422 | 403"
    applies_to: "POST /federal-reports/{id}/submit, POST /federal-reports/{id}/review"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Case ---
  - method: POST
    path: "/cases"
    description: "Register an arrival notification as a new Case"
    roles: [CaseManager]
    code: 201
    input: [case_number, agency_affiliate_code, household_size, scheduled_arrival_date]
    output: Case
    side_effects:
      - "status=PRE_ARRIVAL; airport_pickup_completed=false; open_transfer_id=null; actual_arrival_date=null"

  - method: GET
    path: "/cases/{id}"
    description: "Get a Case including computed posture and topics_completed"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: POST
    path: "/cases/{id}/arrive"
    description: "Record airport pickup and actual arrival; seeds the 30/90-day ServiceBenchmarks and occupies the READY HousingSetup"
    roles: [CaseManager]
    code: 200
    input: [actual_arrival_date]
    output: Case
    side_effects:
      - "Case PRE_ARRIVAL -> ARRIVED per state machine (member ages computed, benchmarks seeded, HousingSetup READY -> OCCUPIED, HousingUnit status recomputes)"
      - "increments Case.version by 1"

  # --- HouseholdMember ---
  - method: POST
    path: "/members"
    description: "Add a HouseholdMember to a PRE_ARRIVAL case"
    roles: [CaseManager]
    code: 201
    input: [case_id, full_name, date_of_birth, relationship, work_eligible]
    output: HouseholdMember
    side_effects:
      - "age_at_arrival and school_age_at_arrival remain null until the case arrives"

  - method: GET
    path: "/cases/{id}/members"
    description: "List HouseholdMembers of a case"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: HouseholdMember[]
    side_effects: []

  # --- HousingUnit ---
  - method: POST
    path: "/housing-units"
    description: "Register a HousingUnit in the agency pool"
    roles: [HousingCoordinator]
    code: 201
    input: [address, bedrooms]
    output: HousingUnit
    side_effects:
      - "derived status reads AVAILABLE until a non-terminal HousingSetup references it"

  - method: GET
    path: "/housing-units/{id}"
    description: "Get a HousingUnit including its derived status"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: HousingUnit
    side_effects: []

  # --- HousingSetup ---
  - method: POST
    path: "/housing-setups"
    description: "Create a HousingSetup assigning a unit and occupancy window to a PRE_ARRIVAL case"
    roles: [HousingCoordinator]
    code: 201
    input: [case_id, housing_unit_id, occupancy_start, occupancy_end]
    output: HousingSetup
    side_effects:
      - "status=PREPARING; furnishing_items_completed=[]; HousingUnit derived status recomputes (RESERVED or OCCUPIED)"

  - method: GET
    path: "/cases/{id}/housing-setups"
    description: "List HousingSetups of a case"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: HousingSetup[]
    side_effects: []

  - method: GET
    path: "/housing-units/{id}/housing-setups"
    description: "List HousingSetups assigned to a unit"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: HousingSetup[]
    side_effects: []

  - method: POST
    path: "/housing-setups/{id}/furnish"
    description: "Mark one REQUIRED_FURNISHINGS item complete on a PREPARING setup"
    roles: [HousingCoordinator]
    code: 200
    input: [item]
    output: HousingSetup
    side_effects:
      - "item appended to furnishing_items_completed"

  - method: POST
    path: "/housing-setups/{id}/ready"
    description: "Mark a PREPARING setup READY (requires all six furnishing items complete)"
    roles: [HousingCoordinator]
    code: 200
    input: []
    output: HousingSetup
    side_effects:
      - "PREPARING -> READY"

  - method: POST
    path: "/housing-setups/{id}/vacate"
    description: "Vacate a non-terminal setup, releasing the unit"
    roles: [HousingCoordinator]
    code: 200
    input: []
    output: HousingSetup
    side_effects:
      - "PREPARING/READY/OCCUPIED -> VACATED; HousingUnit derived status recomputes"

  # --- ServiceBenchmark ---
  - method: GET
    path: "/cases/{id}/benchmarks"
    description: "List ServiceBenchmarks of a case in seeding order (HOME_VISIT, HEALTH_SCREENING, SSN_APPLICATION, BENEFITS_ENROLLMENT, CULTURAL_ORIENTATION, then conditional EMPLOYMENT_PLAN, SCHOOL_ENROLLMENT); filterable"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: ["status?", "service_type?"]
    output: ServiceBenchmark[]
    side_effects: []

  - method: GET
    path: "/benchmarks/{id}"
    description: "Get a single ServiceBenchmark"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: ServiceBenchmark
    side_effects: []

  - method: GET
    path: "/benchmarks"
    description: "List ServiceBenchmarks across cases with filters (audit view; evidence_note_id filter finds the benchmark a given CaseNote evidences, returning an array of length 0 or 1)"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: ["case_id?", "status?", "service_type?", "evidence_note_id?"]
    output: ServiceBenchmark[]
    side_effects: []

  - method: POST
    path: "/benchmarks/{id}/fulfill"
    description: "Fulfill a PENDING benchmark with a SERVICE_DELIVERY evidence note"
    roles: [CaseManager]
    code: 200
    input: [fulfilled_on, evidence_note_id, "enrolled_member_ids?"]
    output: ServiceBenchmark
    side_effects:
      - "PENDING -> MET; fulfilled_on, evidence_note_id, on_time set"

  - method: POST
    path: "/benchmarks/{id}/waive"
    description: "Waive a PENDING benchmark (director authority)"
    roles: [AgencyDirector]
    code: 200
    input: [reason]
    output: ServiceBenchmark
    side_effects:
      - "PENDING -> WAIVED; waived_reason set"

  - method: POST
    path: "/benchmarks/{id}/rescind"
    description: "Rescind a manually fulfilled benchmark back to PENDING (documentation correction)"
    roles: [CaseManager]
    code: 200
    input: []
    output: ServiceBenchmark
    side_effects:
      - "MET -> PENDING; fulfilled_on, evidence_note_id, on_time cleared"

  # --- BenefitApplication ---
  - method: POST
    path: "/benefit-applications"
    description: "Open a BenefitApplication (benefits enrollment / SSN / state ID) for a member of an ARRIVED case"
    roles: [CaseManager]
    code: 201
    input: [case_id, member_id, benefit_type]
    output: BenefitApplication
    side_effects:
      - "status=DRAFT"

  - method: GET
    path: "/benefit-applications/{id}"
    description: "Get a BenefitApplication"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: BenefitApplication
    side_effects: []

  - method: GET
    path: "/benefit-applications"
    description: "List BenefitApplications with filters and pagination"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: ["case_id?", "member_id?", "status?", "limit?", "offset?"]
    output: BenefitApplication[]
    side_effects: []

  - method: POST
    path: "/benefit-applications/{id}/transition"
    description: "Advance a BenefitApplication (FILED, APPROVED, DENIED, APPEALED, WITHDRAWN) per its state machine"
    roles: [CaseManager]
    code: 200
    input: [to_status]
    output: BenefitApplication
    side_effects:
      - "status transition per state machine; filed_on/decided_on stamped from the logical clock"

  # --- EmploymentPlan ---
  - method: POST
    path: "/employment-plans"
    description: "Create the self-sufficiency EmploymentPlan for an ARRIVED case; supersedes any existing ACTIVE plan; OCC-guarded on Case.version"
    roles: [EmploymentSpecialist]
    code: 201
    input: [case_id, expected_case_version]
    output: EmploymentPlan
    side_effects:
      - "status=ACTIVE; any existing ACTIVE EmploymentPlan of the case -> SUPERSEDED"
      - "increments Case.version by 1"

  - method: GET
    path: "/cases/{id}/employment-plans"
    description: "List EmploymentPlans of a case (current and superseded)"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: EmploymentPlan[]
    side_effects: []

  - method: PATCH
    path: "/employment-plans/{id}"
    description: "Update income and employment fields of an ACTIVE plan"
    roles: [EmploymentSpecialist]
    code: 200
    input: ["monthly_income_cents?", "trailing_3m_income_cents?", "job_start_date?", "employed_members_count?"]
    output: EmploymentPlan
    side_effects: []

  - method: POST
    path: "/employment-plans/{id}/certify"
    description: "Run self_sufficiency_determination with the requested variant; CERTIFIED on pass, stays ACTIVE on fail"
    roles: [EmploymentSpecialist]
    code: 200
    input: [variant]
    output: EmploymentPlan
    side_effects:
      - "self_sufficient and determination_variant recorded; ACTIVE -> CERTIFIED iff determination passes; certified_on stamped on pass"

  # --- OrientationSession ---
  - method: POST
    path: "/orientation-sessions"
    description: "Schedule a cultural-orientation session for an ARRIVED case (30-minute buffer rule; one delivery per topic)"
    roles: [CaseManager]
    code: 201
    input: [case_id, topic, start_at, end_at]
    output: OrientationSession
    side_effects:
      - "status=SCHEDULED"

  - method: GET
    path: "/cases/{id}/orientation-sessions"
    description: "List OrientationSessions of a case"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: OrientationSession[]
    side_effects: []

  - method: POST
    path: "/orientation-sessions/{id}/complete"
    description: "Mark a SCHEDULED session delivered; may auto-fulfill the CULTURAL_ORIENTATION benchmark"
    roles: [CaseManager]
    code: 200
    input: []
    output: OrientationSession
    side_effects:
      - "SCHEDULED -> COMPLETED; completed_on := clock; topics_completed recompute; CULTURAL_ORIENTATION benchmark auto-MET when all six topics delivered"

  # --- CaseNote ---
  - method: POST
    path: "/case-notes"
    description: "Append a CaseNote (append-only documentation; author_role taken from X-User-Role)"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector]
    code: 201
    input: [case_id, note_type, body, "service_date?"]
    output: CaseNote
    side_effects: []

  - method: GET
    path: "/cases/{id}/case-notes"
    description: "List CaseNotes of a case"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CaseNote[]
    side_effects: []

  # --- CaseTransfer ---
  - method: POST
    path: "/case-transfers"
    description: "Initiate a secondary-migration case transfer; freezes child mutations on the case while INITIATED"
    roles: [CaseManager]
    code: 201
    input: [case_id, receiving_affiliate_code, reason]
    output: CaseTransfer
    side_effects:
      - "status=INITIATED; initiated_by_user_id := X-User-ID; Case.open_transfer_id := this transfer; increments Case.version by 1"

  - method: GET
    path: "/cases/{id}/case-transfers"
    description: "List CaseTransfers of a case"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: CaseTransfer[]
    side_effects: []

  - method: POST
    path: "/case-transfers/{id}/respond"
    description: "Receiving-side response: ACCEPTED runs the full transfer-out cascade; REJECTED unfreezes the case without side effects"
    roles: [AgencyDirector]
    code: 200
    input: [decision, "decision_note?"]
    output: CaseTransfer
    side_effects:
      - "INITIATED -> COMPLETED (ACCEPTED, with cascade per Case state machine) or INITIATED -> REJECTED (no cascade)"

  - method: POST
    path: "/case-transfers/{id}/withdraw"
    description: "Withdraw an INITIATED transfer, unfreezing the case"
    roles: [CaseManager]
    code: 200
    input: []
    output: CaseTransfer
    side_effects:
      - "INITIATED -> WITHDRAWN; Case.open_transfer_id := null; increments Case.version by 1"

  # --- FederalReport ---
  - method: POST
    path: "/federal-reports"
    description: "Generate a point-in-time federal report snapshot for [period_start, period_end)"
    roles: [AgencyDirector]
    code: 201
    input: [period_start, period_end]
    output: FederalReport
    side_effects:
      - "status=DRAFT; revision_count=0; snapshot fields computed per report_snapshot_counts and report_per_capita_allocation"

  - method: GET
    path: "/federal-reports/{id}"
    description: "Get a FederalReport"
    roles: [CaseManager, HousingCoordinator, EmploymentSpecialist, AgencyDirector, FederalOfficer]
    code: 200
    input: []
    output: FederalReport
    side_effects: []

  - method: POST
    path: "/federal-reports/{id}/submit"
    description: "Submit a DRAFT report (documentation gate: every included case has at least one CaseNote)"
    roles: [AgencyDirector]
    code: 200
    input: []
    output: FederalReport
    side_effects:
      - "DRAFT -> SUBMITTED; submitted_by_user_id := X-User-ID"

  - method: POST
    path: "/federal-reports/{id}/review"
    description: "Federal review: ACCEPTED finalizes; REJECTED returns the report to DRAFT with revision_count + 1; reviewer must differ from submitter"
    roles: [FederalOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: FederalReport
    side_effects:
      - "SUBMITTED -> ACCEPTED or SUBMITTED -> DRAFT per decision; reviewed_by_user_id := X-User-ID; submitted_by_user_id cleared on rejection"

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO 8601). Before any set call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [AgencyDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "logical clock advanced (clock never moves backward within a test)"

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint per the RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference does not identify an existing resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum, inverted date range, or fulfilled_on outside [arrival, clock]" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is in the wrong state for the requested transition (incl. terminal lockdown, member add after arrival, arrive twice, rescind of an auto-fulfilled benchmark)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match the Case's current version (OCC)" }
  - { id: ERR_HOUSING_NOT_READY, http: 409, condition: "Arrival requires a HousingSetup in READY status for the case" }
  - { id: ERR_HOUSING_CAPACITY_INSUFFICIENT, http: 422, condition: "unit.bedrooms < ceil(case.household_size / 2)" }
  - { id: ERR_UNIT_OCCUPANCY_CONFLICT, http: 409, condition: "Occupancy window overlaps another non-terminal HousingSetup on the same unit (half-open intervals; adjacency allowed)" }
  - { id: ERR_SETUP_ALREADY_EXISTS, http: 409, condition: "Case already has a non-terminal HousingSetup" }
  - { id: ERR_FURNISHING_INCOMPLETE, http: 409, condition: "ready requires all six REQUIRED_FURNISHINGS items completed" }
  - { id: ERR_ITEM_ALREADY_FURNISHED, http: 409, condition: "furnish item already present in furnishing_items_completed" }
  - { id: ERR_SESSION_SCHEDULE_CONFLICT, http: 409, condition: "Session violates the 30-minute buffer against another SCHEDULED/COMPLETED session of the same case" }
  - { id: ERR_TOPIC_ALREADY_DELIVERED, http: 409, condition: "A COMPLETED session already delivered this topic for the case" }
  - { id: ERR_TOPIC_ALREADY_SCHEDULED, http: 409, condition: "A SCHEDULED session for this topic already exists for the case" }
  - { id: ERR_CASE_TRANSFER_PENDING, http: 409, condition: "Case has an INITIATED transfer; child mutations are frozen (notes, transfer respond/withdraw, and reads remain allowed)" }
  - { id: ERR_TRANSFER_ALREADY_OPEN, http: 409, condition: "Case already has an INITIATED transfer" }
  - { id: ERR_MEMBER_NOT_ELIGIBLE, http: 422, condition: "CASH_ASSISTANCE for a non-work-eligible member, or SCHOOL_ENROLLMENT fulfill whose enrolled_member_ids do not equal the school-age member set" }
  - { id: ERR_EVIDENCE_NOTE_INVALID, http: 422, condition: "evidence_note_id missing, belongs to another case, or is not a SERVICE_DELIVERY note" }
  - { id: ERR_BENCHMARK_NOT_PENDING, http: 409, condition: "fulfill/waive requires the benchmark to be PENDING" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Report reviewer X-User-ID equals submitted_by_user_id" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report period [start, end) overlaps an existing FederalReport of any status" }
  - { id: ERR_REPORT_DOCUMENTATION_INCOMPLETE, http: 422, condition: "Submit blocked: an included case has no CaseNote" }
  - { id: ERR_DUPLICATE_CASE_NUMBER, http: 409, condition: "case_number already registered" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: CaseManager
    description: "Affiliate case manager; owns the case lifecycle from arrival notification through services, documentation, and transfer initiation"
    identity: "opaque"
    exclusive_operations:
      - "POST /cases"
      - "POST /cases/{id}/arrive"
      - "POST /members"
      - "POST /benchmarks/{id}/fulfill"
      - "POST /benchmarks/{id}/rescind"
      - "POST /benefit-applications"
      - "POST /benefit-applications/{id}/transition"
      - "POST /orientation-sessions"
      - "POST /orientation-sessions/{id}/complete"
      - "POST /case-transfers"
      - "POST /case-transfers/{id}/withdraw"
    shared_operations:
      - "All GET endpoints"
      - "POST /case-notes"

  - name: HousingCoordinator
    description: "Affiliate housing coordinator; owns the housing unit pool and housing preparation/furnishing"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing-units"
      - "POST /housing-setups"
      - "POST /housing-setups/{id}/furnish"
      - "POST /housing-setups/{id}/ready"
      - "POST /housing-setups/{id}/vacate"
    shared_operations:
      - "All GET endpoints"
      - "POST /case-notes"

  - name: EmploymentSpecialist
    description: "Affiliate employment specialist; owns self-sufficiency plans and certification"
    identity: "opaque"
    exclusive_operations:
      - "POST /employment-plans"
      - "PATCH /employment-plans/{id}"
      - "POST /employment-plans/{id}/certify"
    shared_operations:
      - "All GET endpoints"
      - "POST /case-notes"

  - name: AgencyDirector
    description: "Affiliate director; waiver authority, receiving-side transfer response, federal report generation/submission"
    identity: "opaque"
    exclusive_operations:
      - "POST /benchmarks/{id}/waive"
      - "POST /case-transfers/{id}/respond"
      - "POST /federal-reports"
      - "POST /federal-reports/{id}/submit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /case-notes"

  - name: FederalOfficer
    description: "National-office reviewer; reviews submitted federal reports. Segregation of duties: the reviewing X-User-ID must differ from the report's submitted_by_user_id even when the same operator holds both roles"
    identity: "opaque"
    exclusive_operations:
      - "POST /federal-reports/{id}/review"
    shared_operations:
      - "All GET endpoints"
