  # ---------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (two instances, different entities)
  # ---------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: fund_parallel_dimensions_lifecycle_independent_of_spending_posture
        grounds:
          - state_machines.Fund.DRAFT_to_ACTIVE
          - state_machines.Fund.NORMAL_to_SPENDING_SUSPENDED
          - state_machines.Fund.SPENDING_SUSPENDED_to_EXCEPTION_ACTIVE
        distinguishing_aspect: |
          Fund carries two parallel state dimensions: fund_status (DRAFT/ACTIVE/TERMINATED)
          evolves via lifecycle calls while spending_posture (NORMAL/SPENDING_SUSPENDED/
          EXCEPTION_ACTIVE) evolves via system events — the fund stays ACTIVE the whole time
          its posture cycles NORMAL -> SPENDING_SUSPENDED -> EXCEPTION_ACTIVE.
        test_recipe:
          setup:
            - "Pool with allocation, policy (rate 500, window 4, floor 0, cap 10000, FY2026) ADOPTED, engaged manager, ACTIVE fund FPD (CORPUS 10000000 unitized at Q1, HGV 10000000)"
            - "Q2 finalized at price 40000 (MV 4000000 < HGV) so posture auto-flipped to SPENDING_SUSPENDED while fund_status stayed ACTIVE"
            - "An underwater exception for (fund, 2026) is ENDORSED"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool PD", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { pd_pool: $.data.id, pd_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${pd_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
