  - rule_id: compensating_invariant
    instances:
      - name: licensee_unit_ledger_conserved_through_revoke_settlement
        grounds:
          - entities.DataLicensee.fields.granted_units
          - entities.DataLicensee.fields.available_units
          - entities.DataLicensee.fields.reserved_units
          - entities.DataLicensee.fields.consumed_units
          - state_machines.RightsWindow.ACTIVE_to_REVOKED
          - calculations.feed_session_billing
        distinguishing_aspect: |
          Conserved quantity: the licensee's DATA UNITS. granted_units == available_units +
          reserved_units + consumed_units holds at every step - 5000 == 4100 + 900 + 0 while the
          session is open and 5000 == 4700 + 0 + 300 after the rights-window revocation settles
          it - so the compensation released exactly the 600 unconsumed units and no more.
