# ===========================================================================
# §1.8 Scaffold Difficulty Design — Nuclear Refueling Outage Management
# Nine §0.5 Difficulty Rules × 2 differentiated instances = 18 instances.
# Every numeric literal in every `assert:` was computed by executing the
# corresponding §1.3 `formula:` against its `constants:` in Decimal
# (ROUND_HALF_UP, 2 dp).
# ===========================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: pool_headroom_nominal_admits_where_full_core_protected_rejects
        grounds:
          - calculations.pool_cell_admission
          - calculations.pool_cell_ledger
          - entities.PoolCellReservation.fields.availability_variant
          - entities.SpentFuelPool.fields.protected_cells_available
          - validations[priority=22]
        distinguishing_aspect: |
          The two variants live in the SpentFuelPool capacity domain: for one identical pool
          state (cells_available 300, protected_cells_available 107) and one identical
          cells_requested of 200, the FULL_CORE_PROTECTED variant selected by purpose
          DISCHARGE rejects with ERR_POOL_CAPACITY_EXCEEDED while the NOMINAL variant
          selected by purpose CONTINGENCY admits, and the delta between the two headrooms is
          exactly full_core_offload_reserve_cells (193).
        test_recipe:
          setup:
            - "Spent fuel pool UNIT_1-SFP: cells_total 1200, cells_baseline_occupied 900, full_core_offload_reserve_cells 193 — so cells_occupied 900, cells_reserved 0, cells_available 300, protected_cells_available 107."
            - "Outage UNIT_1 / 2R26 in PLANNING with an APPROVED CoreLoadPattern, so the DISCHARGE attempt reaches the priority-22 capacity check rather than stopping at the priority-7 core-load-pattern guard."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /spent-fuel-pools"
              payload: { station_unit: "UNIT_1", cells_total: 1200, cells_baseline_occupied: 900, full_core_offload_reserve_cells: 193 }
              as: StationAdmin
              captures: { pool_id: "$.data.id", pool_v1: "$.data.version" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: OutageDirector
              as_user_id: "od-alpha"
          trigger:
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 200, purpose: "DISCHARGE", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { err_protected: "$.data.error_id" }
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 200, purpose: "CONTINGENCY", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { res_id: "$.data.id" }
          assert:
            - "The DISCHARGE trigger returns HTTP 409 with ${err_protected} == ERR_POOL_CAPACITY_EXCEEDED"
            - "The CONTINGENCY trigger returns HTTP 201 and PoolCellReservation.${res_id}.availability_variant == NOMINAL"
            - "PoolCellReservation.${res_id}.status == RESERVED and PoolCellReservation.${res_id}.cells_requested == 200"
            - "SpentFuelPool.${pool_id}.cells_reserved == 200"
            - "SpentFuelPool.${pool_id}.cells_available == 100"
            - "SpentFuelPool.${pool_id}.protected_cells_available == -93"
            - "SpentFuelPool.${pool_id}.cells_occupied == 900 — a reservation never moves cells into occupied"
            - "The rejected DISCHARGE request left SpentFuelPool.${pool_id}.version unchanged at ${pool_v1}, so the CONTINGENCY request accepted the same expected_spent_fuel_pool_version"

      - name: performance_index_gross_versus_emergent_adjusted_diverge
        grounds:
          - calculations.outage_performance_review
          - calculations.outage_emergent_hours_rollup
          - state_machines.Outage.ONLINE_to_REVIEWED
          - entities.Outage.fields.outage_performance_index
          - entities.Outage.fields.adjusted_performance_index
        distinguishing_aspect: |
          The two variants live in the Outage performance domain (not the pool capacity domain
          of the sibling instance): from one identical set of stored actuals the gross variant
          scores 94.84 and the emergent-adjusted variant scores 99.00, because subtracting
          approved_emergent_hours 90.00 from actual_duration_hours 780 flips the duration term
          from a +8.33% overrun to a -4.17% underrun, which the one-sided penalty then zeroes.
        test_recipe:
          setup:
            - "Outage UNIT_2 / 2R28: duration_target_hours 720, dose_budget_total_mrem 1000, cost_budget_usd 40000000, required_badged_workers 0."
            - "One APPROVED radiological work permit has committed 750.00 mrem against the outage, so dose_committed_mrem is 750.00 (a -25.00% underrun that the one-sided penalty ignores)."
            - "One emergent work item of 90 estimated hours has been dispositioned APPROVED, so approved_emergent_hours is 90.00."
            - "Every work order of the outage has reached COMPLETE, one startup test has been SATISFIED, and the outage has bubbled up to ONLINE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_2", area_code: "RA-1", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_2", designation: "2R28", duration_target_hours: 720, dose_budget_total_mrem: 1000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: OutageDirector
              as_user_id: "od-alpha"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MODIFICATION", title: "Feedwater heater replacement", estimated_hours: 200, estimated_cost_usd: 1200000, estimated_dose_mrem: 300, regulatory_commitment: true, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
            - call: "POST /work-orders/${wo_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "FW heater replacement", planned_start_offset_hours: 0, planned_duration_hours: 200, work_order_id: "${wo_id}" }
              as: OutagePlanner
              captures: { act_id: "$.data.id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /outages/${o_id}/commence-execution"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 5, shielding_factor: 0, planned_start_offset_hours: 0, planned_duration_hours: 5 }
              as: RadProtectionPlanner
              captures: { rwp_id: "$.data.id" }
            - call: "POST /rwps/${rwp_id}/approve"
              payload: { alara_review_reference: "ALARA-2R28-001" }
              as: RadProtectionManager
            - call: "POST /schedule-activities/${act_id}/start"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_id}/emergent-items"
              payload: { description: "Cracked support lug on tube sheet", estimated_hours: 90, estimated_cost_usd: 400000, estimated_dose_mrem: 150, discovered_during_inspection: true }
              as: OutagePlanner
              captures: { ewi_id: "$.data.id" }
            - call: "POST /emergent-items/${ewi_id}/dispose"
              payload: { disposition: "APPROVED", disposition_note: "Repair required before startup" }
              as: OutageDirector
              captures: { ewo_id: "$.data.created_work_order_id" }
            - call: "POST /schedule-activities/${act_id}/complete"
              payload: {}
              as: OutagePlanner
            - call: "GET /schedule-activities"
              payload: { work_order_id: "${ewo_id}" }
              as: OutagePlanner
              captures: { eact_id: "$.data[0].id" }
            - call: "POST /schedule-activities/${eact_id}/start"
              payload: {}
              as: OutagePlanner
            - call: "POST /schedule-activities/${eact_id}/complete"
              payload: {}
              as: OutagePlanner
            - call: "POST /outages/${o_id}/startup-tests"
              payload: { test_code: "CRD-DROP", sequence_index: 1, hold_point_type: "STATION", predicted_reactivity_pcm: 500 }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { st_id: "$.data.id" }
            - call: "POST /outages/${o_id}/authorize-startup"
              payload: {}
              as: OutageDirector
            - call: "POST /startup-tests/${st_id}/satisfy"
              payload: { measured_reactivity_pcm: 520 }
              as: RegulatoryAffairs
              as_user_id: "ra-alpha"
          trigger:
            - call: "POST /outages/${o_id}/post-outage-review"
              payload: { actual_duration_hours: 780, actual_cost_usd: 42000000, review_notes: "Emergent tube-sheet repair drove the duration overrun" }
              as: OutageDirector
          assert:
            - "Outage.${o_id}.status == REVIEWED"
            - "Outage.${o_id}.approved_emergent_hours == 90.00"
            - "Outage.${o_id}.dose_committed_mrem == 750.00"
            - "Outage.${o_id}.duration_variance_pct == 8.33"
            - "Outage.${o_id}.adjusted_duration_variance_pct == -4.17"
            - "Outage.${o_id}.dose_variance_pct == -25.00"
            - "Outage.${o_id}.cost_variance_pct == 5.00"
            - "Outage.${o_id}.outage_performance_index == 94.84"
            - "Outage.${o_id}.adjusted_performance_index == 99.00"
            - "Outage.${o_id}.outage_performance_index != Outage.${o_id}.adjusted_performance_index — the divergence is exactly 4.16 index points from the same stored data"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: rwp_dose_rounds_per_worker_before_multiplying_by_crew
        grounds:
          - calculations.rwp_committed_dose
          - entities.RadiologicalWorkPermit.fields.per_worker_dose_mrem
          - entities.RadiologicalWorkPermit.fields.collective_dose_mrem
          - entities.RadiologicalWorkPermit.fields.committed_dose_mrem
          - entities.RadiologicalWorkPermit.fields.alara_review_required
        distinguishing_aspect: |
          This instance pins ROUNDING ORDER inside a fixed operand set: rounding the per-worker
          figure to 109.42 before multiplying by the 3-person crew yields collective 328.26 and
          committed 393.91, whereas multiplying the unrounded 109.4225 first and rounding the
          product yields 328.27 and 393.92 — a divergence of 0.01 mrem on both fields with no
          operand changed.
        test_recipe:
          setup:
            - "Radiological area RA-2 with dose_rate_mrem_per_hr 23 and survey_buffer_hours 2."
            - "Outage UNIT_1 / 2R26 in PLANNING with one SCOPED work order to hang the permit from; no permit has been approved, so no dose is committed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "RA-2", dose_rate_mrem_per_hr: 23, occupancy_limit_workers: 8, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Steam generator eddy current inspection", estimated_hours: 48, estimated_cost_usd: 300000, estimated_dose_mrem: 100, regulatory_commitment: false, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
          trigger:
            - call: "POST /work-orders/${wo_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 3, shielding_factor: 0.135, planned_start_offset_hours: 10, planned_duration_hours: 5.5 }
              as: RadProtectionPlanner
              captures: { rwp_id: "$.data.id" }
          assert:
            - "RadiologicalWorkPermit.${rwp_id}.per_worker_dose_mrem == 109.42"
            - "RadiologicalWorkPermit.${rwp_id}.collective_dose_mrem == 328.26"
            - "RadiologicalWorkPermit.${rwp_id}.contingency_dose_mrem == 65.65"
            - "RadiologicalWorkPermit.${rwp_id}.committed_dose_mrem == 393.91"
            - "RadiologicalWorkPermit.${rwp_id}.collective_dose_mrem != 328.27 — the multiply-then-round order is wrong"
            - "RadiologicalWorkPermit.${rwp_id}.committed_dose_mrem != 393.92 — the multiply-then-round order is wrong"
            - "RadiologicalWorkPermit.${rwp_id}.alara_review_required == true because collective_dose_mrem 328.26 >= 300"
            - "RadiologicalWorkPermit.${rwp_id}.status == DRAFT and Outage.${o_id}.dose_committed_mrem == 0.00 — drafting commits nothing"

      - name: scope_contingency_tier_selected_from_base_not_from_total
        grounds:
          - calculations.outage_scope_cost_rollup
          - state_machines.WorkOrder.PLANNED_to_APPROVED
          - entities.Outage.fields.scope_contingency_usd
          - entities.Outage.fields.total_scope_cost_usd
        distinguishing_aspect: |
          This instance pins OPERAND SELECTION rather than rounding order: the tiered
          contingency rate must be looked up from approved_scope_cost_usd (4800000.00, below
          the 5000000 tier-1 ceiling, so 0.08), not from the resulting total_scope_cost_usd
          (5184000.00, which sits above the ceiling and would select 0.12 and produce
          576000.00 / 5376000.00).
        test_recipe:
          setup:
            - "Outage UNIT_1 / 2R26 in PLANNING with cost_budget_usd 40000000."
            - "Work order WO-1 (estimated_cost_usd 3000000) is already APPROVED; work order WO-2 (estimated_cost_usd 1800000) is PLANNED and about to be approved, which brings the base to exactly 4800000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MODIFICATION", title: "Reactor head vent modification", estimated_hours: 300, estimated_cost_usd: 3000000, estimated_dose_mrem: 300, regulatory_commitment: true, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo1_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo1_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MODIFICATION", title: "Main generator stator rewedge", estimated_hours: 240, estimated_cost_usd: 1800000, estimated_dose_mrem: 0, regulatory_commitment: true, requires_rad_work: false }
              as: OutagePlanner
              captures: { wo2_id: "$.data.id" }
            - call: "POST /work-orders/${wo2_id}/plan"
              payload: {}
              as: OutagePlanner
          trigger:
            - call: "POST /work-orders/${wo2_id}/approve-scope"
              payload: {}
              as: OutageDirector
          assert:
            - "Outage.${o_id}.approved_scope_cost_usd == 4800000.00"
            - "Outage.${o_id}.scope_contingency_usd == 384000.00"
            - "Outage.${o_id}.total_scope_cost_usd == 5184000.00"
            - "Outage.${o_id}.scope_contingency_usd != 576000.00 — selecting the tier from the total is wrong"
            - "Outage.${o_id}.total_scope_cost_usd != 5376000.00 — selecting the tier from the total is wrong"
            - "WorkOrder.${wo2_id}.status == APPROVED"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: work_order_revision_cycle_traverses_approved_planned_twice
        grounds:
          - state_machines.WorkOrder.APPROVED_to_PLANNED
          - state_machines.WorkOrder.PLANNED_to_APPROVED
          - calculations.outage_scope_cost_rollup
          - entities.WorkOrder.fields.return_reason
        distinguishing_aspect: |
          This instance exercises a CYCLE: the pair APPROVED -> PLANNED -> APPROVED is traversed
          twice on the same WorkOrder row, and the outage cost rollup must fall to 0.00 on each
          return and climb back to 1200000.00 on each re-approval, ending at WorkOrder.version 7.
        test_recipe:
          setup:
            - "Outage UNIT_1 / 2R26 in PLANNING with cost_budget_usd 40000000 and no schedule activities, so schedule_posture stays ON_TRACK throughout."
            - "Work order WO-1 (estimated_cost_usd 1200000) has been created, planned and approved once — version 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MODIFICATION", title: "Condenser tube plugging modification", estimated_hours: 200, estimated_cost_usd: 1200000, estimated_dose_mrem: 300, regulatory_commitment: true, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
            - call: "POST /work-orders/${wo_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
          trigger:
            - call: "POST /work-orders/${wo_id}/return-to-planning"
              payload: { return_reason: "Vendor drawing revision B received" }
              as: OutageDirector
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { cost_after_first_return: "$.data.approved_scope_cost_usd" }
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo_id}/return-to-planning"
              payload: { return_reason: "Second vendor drawing revision C received" }
              as: OutageDirector
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
          assert:
            - "${cost_after_first_return} == 0.00 — a returned work order leaves the rollup base"
            - "WorkOrder.${wo_id}.status == APPROVED after the second re-approval"
            - "WorkOrder.${wo_id}.return_reason == \"Second vendor drawing revision C received\""
            - "WorkOrder.${wo_id}.version == 7 — create 1, plan 2, approve 3, return 4, approve 5, return 6, approve 7"
            - "Outage.${o_id}.approved_scope_cost_usd == 1200000.00"
            - "Outage.${o_id}.scope_contingency_usd == 96000.00"
            - "Outage.${o_id}.total_scope_cost_usd == 1296000.00"

      - name: supplemental_worker_fork_join_needs_both_branches
        grounds:
          - state_machines.SupplementalWorker.REQUESTED_to_SCREENING
          - state_machines.SupplementalWorker.SCREENING_to_BADGE_READY
          - state_machines.SupplementalWorker.BADGE_READY_to_BADGED
          - calculations.outage_badging_rollup
          - errors[ERR_WORKER_STATE_INVALID]
        distinguishing_aspect: |
          This instance exercises a BRANCHING fork-join rather than a cycle: the training branch
          and the background branch each land the worker in SCREENING independently, and the
          join to BADGE_READY fires only when background_status == CLEAR AND training_status ==
          COMPLETE — badging after the training branch alone must fail with
          ERR_WORKER_STATE_INVALID.
        test_recipe:
          setup:
            - "Outage UNIT_1 / 2R26 with required_training_modules 4 and required_badged_workers 0."
            - "One SupplementalWorker in REQUESTED with background_status PENDING, training_status PENDING and training_modules_completed 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/supplemental-workers"
              payload: { full_name: "R. Ostrander", craft: "PIPEFITTER", sponsoring_contractor: "Bartlett Nuclear" }
              as: ContractorCoordinator
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /supplemental-workers/${w_id}/training-completion"
              payload: { modules_completed: 4 }
              as: AccessAuthority
            - call: "POST /supplemental-workers/${w_id}/badge"
              payload: { badge_number: "B-1001" }
              as: AccessAuthority
              captures: { err_join: "$.data.error_id" }
            - call: "POST /supplemental-workers/${w_id}/background-result"
              payload: { outcome: "CLEAR" }
              as: AccessAuthority
            - call: "POST /supplemental-workers/${w_id}/badge"
              payload: { badge_number: "B-1001" }
              as: AccessAuthority
          assert:
            - "After the training-completion call SupplementalWorker.${w_id}.status == SCREENING, training_status == COMPLETE, training_modules_completed == 4, background_status == PENDING"
            - "The first badge call returns HTTP 409 with ${err_join} == ERR_WORKER_STATE_INVALID — one branch alone never reaches BADGE_READY"
            - "After the background-result call SupplementalWorker.${w_id}.status == BADGE_READY and background_status == CLEAR"
            - "After the second badge call SupplementalWorker.${w_id}.status == BADGED and badge_number == \"B-1001\""
            - "Outage.${o_id}.badged_worker_count == 1"

  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: emergent_approval_cascade_defers_discretionary_and_voids_permit
        grounds:
          - state_machines.EmergentWorkItem.REPORTED_to_APPROVED
          - state_machines.WorkOrder.PLANNED_to_DEFERRED
          - state_machines.ScheduleActivity.NOT_STARTED_to_CANCELLED
          - state_machines.RadiologicalWorkPermit.DRAFT_to_VOIDED
          - calculations.outage_critical_path
          - calculations.outage_schedule_posture
          - calculations.outage_emergent_hours_rollup
          - calculations.outage_scope_cost_rollup
        distinguishing_aspect: |
          A six-hop chain fanning ACROSS four entity types from one request: dispose(APPROVED)
          mints a WorkOrder (hop 1), mints a ScheduleActivity behind the discovering activity
          (hop 2), recomputes the critical path to 740.00 (hop 3), moves schedule_posture to
          AT_RISK (hop 4), auto-defers the DISCRETIONARY work order (hop 5) and cancels its
          activity plus voids its permit (hop 6). The ordering is load-bearing: the step-8
          recompute drops the projected duration back to 500.00, yet schedule_posture must
          remain the AT_RISK value fixed at step 5.
        test_recipe:
          setup:
            - "Rad area RA-3: dose_rate_mrem_per_hr 25, survey_buffer_hours 2."
            - "Outage UNIT_1 / 2R26: duration_target_hours 720, dose_budget_total_mrem 1000, cost_budget_usd 40000000, required_badged_workers 0, APPROVED CoreLoadPattern."
            - "WO1 MODIFICATION 300h / 900000 USD / 300 mrem / regulatory — priority_score 82.00, CRITICAL, APPROVED. WO3 MAINTENANCE 150h / 250000 USD / 600 mrem — priority_score 44.00, DISCRETIONARY, left in PLANNED."
            - "Activities: A1 (no work order, offset 0, 200h) -> A2 (WO1, offset 200, 300h) -> A3 (WO3, offset 500, 150h). Pre-trigger critical path: projected 650.00, risk-adjusted 752.50, schedule_posture ON_TRACK."
            - "RWP3 on WO3 in DRAFT with committed_dose_mrem 180.00; nothing is committed to the outage dose ledger yet."
            - "The outage is SCOPE_LOCKED (never EXECUTION), so no activity has started and every activity is still NOT_STARTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "RA-3", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 1000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MODIFICATION", title: "Reactor coolant pump seal replacement", estimated_hours: 300, estimated_cost_usd: 900000, estimated_dose_mrem: 300, regulatory_commitment: true, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo1_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo1_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Turbine building lighting refurbishment", estimated_hours: 150, estimated_cost_usd: 250000, estimated_dose_mrem: 600, regulatory_commitment: false, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo3_id: "$.data.id" }
            - call: "POST /work-orders/${wo3_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "Cooldown and depressurize", planned_start_offset_hours: 0, planned_duration_hours: 200 }
              as: OutagePlanner
              captures: { a1_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "RCP seal replacement", planned_start_offset_hours: 200, planned_duration_hours: 300, work_order_id: "${wo1_id}", predecessor_activity_id: "${a1_id}" }
              as: OutagePlanner
              captures: { a2_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "Lighting refurbishment", planned_start_offset_hours: 500, planned_duration_hours: 150, work_order_id: "${wo3_id}", predecessor_activity_id: "${a2_id}" }
              as: OutagePlanner
              captures: { a3_id: "$.data.id" }
            - call: "POST /work-orders/${wo3_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 2, shielding_factor: 0.5, planned_start_offset_hours: 500, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { rwp3_id: "$.data.id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo3_id}/emergent-items"
              payload: { description: "Cracked conduit hanger behind panel 4B", estimated_hours: 90, estimated_cost_usd: 400000, estimated_dose_mrem: 150, discovered_during_inspection: true }
              as: OutagePlanner
              captures: { ewi_id: "$.data.id" }
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { posture_before: "$.data.schedule_posture", projected_before: "$.data.projected_duration_hours" }
          trigger:
            - call: "POST /emergent-items/${ewi_id}/dispose"
              payload: { disposition: "APPROVED", disposition_note: "Repair before restoring lighting scope" }
              as: OutageDirector
              captures: { ewo_id: "$.data.created_work_order_id" }
          assert:
            - "${posture_before} == ON_TRACK and ${projected_before} == 650.00 — the pre-trigger baseline"
            - "hop 1: WorkOrder.${ewo_id}.origin == EMERGENT, status == APPROVED, wo_type == MAINTENANCE, estimated_hours == 90, priority_score == 49.00, priority == HIGH"
            - "hop 2: exactly one ScheduleActivity has work_order_id == ${ewo_id}, with planned_start_offset_hours == 650, planned_duration_hours == 90 and predecessor_activity_id == ${a3_id}"
            - "hop 3+4: Outage.${o_id}.schedule_posture == AT_RISK — step 5 saw projected 740.00 against the 792.00 AT_RISK ceiling"
            - "hop 5: WorkOrder.${wo3_id}.status == DEFERRED and deferral_reason == SCHEDULE_POSTURE_AUTO_DEFERRAL"
            - "hop 6: ScheduleActivity.${a3_id}.execution_status == CANCELLED"
            - "hop 6: RadiologicalWorkPermit.${rwp3_id}.status == VOIDED and void_reason == WORK_ORDER_DEFERRED"
            - "GET /rwps/${rwp3_id}/dose-transactions returns 0 rows — a DRAFT permit holds no committed dose, so voiding it appends no RELEASE row"
            - "Outage.${o_id}.dose_committed_mrem == 0.00 and dose_budget_remaining_mrem == 1000.00"
            - "step 8: Outage.${o_id}.projected_duration_hours == 500.00 and risk_adjusted_duration_hours == 595.00 — the CANCELLED A3 leaves the input set, so the minted activity re-roots at path_length 90.00"
            - "step 8: Outage.${o_id}.critical_path_activity_id == ${a2_id}"
            - "Outage.${o_id}.schedule_posture is still AT_RISK even though 500.00 <= 720 — posture is fixed at step 5 and is NOT re-evaluated after the auto-deferrals"
            - "Outage.${o_id}.approved_emergent_hours == 90.00"
            - "Outage.${o_id}.approved_scope_cost_usd == 1300000.00, scope_contingency_usd == 104000.00, total_scope_cost_usd == 1404000.00 — the deferred WO3 left the base and the minted APPROVED work order joined it"
            - "ScheduleActivity.${a3_id}'s successor keeps its own constraint_status: a CANCELLED predecessor never satisfies the CLEAR predicate"

      - name: rwp_approval_cascade_holds_other_drafts_for_alara
        grounds:
          - state_machines.RadiologicalWorkPermit.DRAFT_to_APPROVED
          - state_machines.RadiologicalWorkPermit.DRAFT_to_HELD_FOR_ALARA
          - calculations.outage_dose_ledger
          - calculations.outage_alara_posture
          - entities.DoseTransaction
        distinguishing_aspect: |
          A four-hop chain confined to the DOSE domain (rather than the schedule domain of the
          sibling instance), and it fans out SELECTIVELY: the ledger append drives the posture
          out of NORMAL, and the hold cascade then filters sibling DRAFT permits by the 200 mrem
          ALARA_RESTRICTED_HOLD_MREM threshold, so the 432.00 permit is held while the 180.00
          permit is left untouched by the very same hop.
        test_recipe:
          setup:
            - "Rad area RA-4: dose_rate_mrem_per_hr 25, survey_buffer_hours 2."
            - "Outage UNIT_1 / 2R26: dose_budget_total_mrem 1000, SCOPE_LOCKED, with one APPROVED work order WO1."
            - "Three DRAFT permits on WO1: RWP_A committed 750.00 (window offset 0, 5h), RWP_B committed 432.00 (offset 20, 6h), RWP_C committed 180.00 (offset 40, 6h). Outage.alara_posture is NORMAL and dose_committed_mrem is 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "RA-4", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 1000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Reactor cavity inspection campaign", estimated_hours: 200, estimated_cost_usd: 500000, estimated_dose_mrem: 400, regulatory_commitment: true, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo1_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo1_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo1_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 5, shielding_factor: 0, planned_start_offset_hours: 0, planned_duration_hours: 5 }
              as: RadProtectionPlanner
              captures: { rwp_a_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 3, shielding_factor: 0.2, planned_start_offset_hours: 20, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { rwp_b_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 2, shielding_factor: 0.5, planned_start_offset_hours: 40, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { rwp_c_id: "$.data.id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
          trigger:
            - call: "POST /rwps/${rwp_a_id}/approve"
              payload: { alara_review_reference: "ALARA-2R26-007" }
              as: RadProtectionManager
          assert:
            - "RadiologicalWorkPermit.${rwp_a_id}.status == APPROVED and committed_dose_mrem == 750.00"
            - "hop 1: GET /rwps/${rwp_a_id}/dose-transactions returns exactly 1 row with direction COMMIT, amount_mrem 750.00 and reason RWP_APPROVED"
            - "hop 2: Outage.${o_id}.dose_committed_mrem == 750.00 and dose_budget_remaining_mrem == 250.00"
            - "hop 3: Outage.${o_id}.alara_posture == RESTRICTED"
            - "hop 4: RadiologicalWorkPermit.${rwp_b_id}.status == HELD_FOR_ALARA because 432.00 > 200"
            - "hop 4: RadiologicalWorkPermit.${rwp_c_id}.status == DRAFT because 180.00 <= 200 — the same hop skips it"
            - "RadiologicalWorkPermit.${rwp_b_id}.committed_dose_mrem == 432.00 and RadiologicalWorkPermit.${rwp_c_id}.committed_dose_mrem == 180.00"
            - "GET /rwps/${rwp_b_id}/dose-transactions returns 0 rows — being held commits nothing"

  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: cross_entity_state_beats_dose_budget_on_rwp_approve
        grounds:
          - validations[priority=7]
          - validations[priority=23]
          - errors[ERR_OUTAGE_STATE_INVALID]
          - errors[ERR_DOSE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Priority 7 (cross-entity state) versus priority 23 (fiscal) on the same request: the
          outage is still in PLANNING and the permit's committed_dose_mrem 750.00 exceeds
          dose_budget_remaining_mrem 100.00, so both rules are violated at once and the state
          rule 16 places higher must win.
        test_recipe:
          setup:
            - "Outage UNIT_1 / 2R26 with dose_budget_total_mrem 100 deliberately left in PLANNING (lock-scope is never called), so dose_budget_remaining_mrem is 100.00."
            - "WO1 is APPROVED, so the ERR_WORK_ORDER_NOT_APPROVED guard that shares priority 7 does not fire and the outage-status guard is the only priority-7 violation."
            - "RWP_A on WO1 in DRAFT with committed_dose_mrem 750.00 and alara_review_required true; the trigger supplies alara_review_reference so the priority-11 rule is satisfied and exactly two rules are in conflict."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "RA-5", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 100, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Containment liner inspection", estimated_hours: 120, estimated_cost_usd: 300000, estimated_dose_mrem: 400, regulatory_commitment: true, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo1_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo1_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo1_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 5, shielding_factor: 0, planned_start_offset_hours: 0, planned_duration_hours: 5 }
              as: RadProtectionPlanner
              captures: { rwp_a_id: "$.data.id" }
          trigger:
            - call: "POST /rwps/${rwp_a_id}/approve"
              payload: { alara_review_reference: "ALARA-2R26-011" }
              as: RadProtectionManager
              captures: { err_id: "$.data.error_id" }
          assert:
            - "The trigger returns HTTP 409 with ${err_id} == ERR_OUTAGE_STATE_INVALID"
            - "${err_id} != ERR_DOSE_BUDGET_EXCEEDED — priority 7 outranks priority 23"
            - "Outage.${o_id}.status == PLANNING and Outage.${o_id}.dose_budget_remaining_mrem == 100.00"
            - "RadiologicalWorkPermit.${rwp_a_id}.status == DRAFT and committed_dose_mrem == 750.00"
            - "Outage.${o_id}.dose_committed_mrem == 0.00 and alara_posture == NORMAL"
            - "GET /rwps/${rwp_a_id}/dose-transactions returns 0 rows"

      - name: safety_function_capacity_beats_predecessor_outage_mismatch
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - calculations.safety_function_oos_capacity
          - errors[ERR_SAFETY_FUNCTION_CAPACITY_EXCEEDED]
          - errors[ERR_PREDECESSOR_OUTAGE_MISMATCH]
        distinguishing_aspect: |
          A different, ADJACENT priority pair (13 versus 14) on a different endpoint from the
          sibling instance, and the two rules sit in different HTTP families: the safety rule
          returns 409 while the referential rule returns 422, so a wrong ordering is visible in
          the status code as well as the error_id.
        test_recipe:
          setup:
            - "Safety function SF1: trains_total 3, min_trains_required 2, so max_concurrent_oos_trains is 1."
            - "Outage O1 owns activity A1 with oos_safety_function_id SF1, oos_train_label A, planned_start_offset_hours 100 and planned_duration_hours 50 — the CLOSED window [100, 150]."
            - "A separate Outage O2 owns activity FOREIGN, used only as an out-of-outage predecessor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /safety-functions"
              payload: { station_unit: "UNIT_1", function_code: "DECAY_HEAT_REMOVAL", trains_total: 3, min_trains_required: 2 }
              as: StationAdmin
              captures: { sf_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o1_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_2", designation: "2R27", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o2_id: "$.data.id" }
            - call: "POST /outages/${o2_id}/schedule-activities"
              payload: { label: "Foreign outage activity", planned_start_offset_hours: 0, planned_duration_hours: 10 }
              as: OutagePlanner
              captures: { foreign_act_id: "$.data.id" }
            - call: "POST /outages/${o1_id}/schedule-activities"
              payload: { label: "RHR train A out of service", planned_start_offset_hours: 100, planned_duration_hours: 50, oos_safety_function_id: "${sf_id}", oos_train_label: "A" }
              as: OutagePlanner
              captures: { a1_id: "$.data.id" }
          trigger:
            - call: "POST /outages/${o1_id}/schedule-activities"
              payload: { label: "RHR train B out of service", planned_start_offset_hours: 150, planned_duration_hours: 20, oos_safety_function_id: "${sf_id}", oos_train_label: "B", predecessor_activity_id: "${foreign_act_id}" }
              as: OutagePlanner
              captures: { err_id: "$.data.error_id" }
          assert:
            - "The trigger returns HTTP 409 with ${err_id} == ERR_SAFETY_FUNCTION_CAPACITY_EXCEEDED"
            - "${err_id} != ERR_PREDECESSOR_OUTAGE_MISMATCH and the status is not 422 — priority 13 outranks priority 14"
            - "SafetyFunction.${sf_id}.max_concurrent_oos_trains == 1"
            - "GET /schedule-activities?outage_id=${o1_id} returns exactly 1 row, ${a1_id} — the rejected request persisted nothing"
            - "The closed windows [100, 150] and [150, 170] touch at 150, and the DISTINCT oos_train_label count {A, B} is 2 > 1"

  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: alara_ratio_exactly_one_quarter_is_restricted
        grounds:
          - calculations.outage_alara_posture
          - calculations.outage_dose_ledger
          - state_machines.RadiologicalWorkPermit.DRAFT_to_HELD_FOR_ALARA
        distinguishing_aspect: |
          The ALARA_RESTRICTED_RATIO comparison is inclusive and is evaluated on the UNROUNDED
          quotient. Two outages differing by a single mrem of budget straddle the boundary:
          250 / 1000 == 0.25 exactly lands in RESTRICTED, while 251 / 1001 == 0.2507... is the
          first value that stays NORMAL. The posture difference is then observable through the
          hold cascade, which fires in the first outage and not in the second.
        test_recipe:
          setup:
            - "Rad areas RA-6 and RA-7, both dose_rate_mrem_per_hr 25 and survey_buffer_hours 2 — one per outage so no cross-outage rad-area window conflict can intrude."
            - "Outage O1: dose_budget_total_mrem 1000, SCOPE_LOCKED, APPROVED work order, permit RWP_A1 committed 750.00 in DRAFT, permit RWP_B1 committed 432.00 in DRAFT."
            - "Outage O2: dose_budget_total_mrem 1001, otherwise identical, permits RWP_A2 committed 750.00 and RWP_B2 committed 432.00 in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "RA-6", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra1_id: "$.data.id" }
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_2", area_code: "RA-7", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra2_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 1000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o1_id: "$.data.id", o1_v1: "$.data.version" }
            - call: "POST /outages/${o1_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o1_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp1_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp1_id}/approve"
              payload: {}
