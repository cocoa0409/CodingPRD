          setup:
            - "form F1 active; agent A-1001; interaction ${i1} not customer-flagged and interaction ${i2} customer-flagged, both consent VERIFIED; OPEN plan with per_agent_target_volume 4 and a 25/50/25 source mix (caps RANDOM 1, TARGETED 2, CUSTOMER_FLAGGED 1)"
