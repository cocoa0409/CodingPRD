  # ===========================================================================
  # Section 5 — Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: asset_report_maps_serials_to_po
        claim_type: computed_read
        grounds: ['endpoints[GET /api/orders/{id}/asset-report]', entities.Asset.fields.serial_number, entities.Order.fields.po_number]
        distinguishing_aspect: "The asset report returns one row per minted asset binding serial_number -> po_number, with the program-prefixed asset_tag and destination_employee_ref — the contract consumed by the customer's asset management system."
        test_recipe:
          setup: ["account with program P (asset_tag_prefix 'FE', custom image 'img-std'); template published; locked program; locked configuration; order qty 2 built; assets minted"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "EE1", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { ee1_a: $.data.id } }
            - { call: "POST /api/accounts/${ee1_a}/programs", payload: { name: "P1", asset_tag_prefix: "FE", custom_image_ref: "img-std" }, as: AccountManager, captures: { ee1_p: $.data.id } }
