  - section: cross_cutting_layers
    instances:
      - name: occ_stale_capital_plan_version_rejected
        claim_type: stale_version
        grounds: ["concurrency_rules[scenario-run-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Running a scenario with an expected_capital_plan_version captured before a prior run (which bumped the plan version) fails with ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["Plan P DRAFT with one deficiency and two scenarios S1, S2; capture plan version before running S1"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "G1", contact_email: "g1@g1.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
