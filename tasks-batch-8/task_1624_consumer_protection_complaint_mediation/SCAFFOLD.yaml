# =============================================================================
# PRD Benchmark Scaffold — Consumer Protection Complaint Mediation
# State attorney general consumer unit: intake & jurisdiction, business
# notification & deadlines, voluntary mediation, settlement documentation,
# enforcement referral for pattern violators, restitution tracking,
# publication/statistics & business rating, unresolved closure, scam alerts.
# =============================================================================

scenario: |
  Consumer Protection Complaint Mediation (state attorney general consumer unit): complaint intake & jurisdiction/authority determination, business notification & response deadline, voluntary mediation process & settlement documentation, referral to enforcement for pattern violations, restitution tracking & consumer notification, complaint publication/statistics & business rating, unresolved case closure & alternative options, scam alert & public education

domain_name: consumer-protection-mediation
api_prefix: /consumer-protection

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # regulatory gates, cooling-off, segregation of duties, audit event log
  secondary_archetype: multi_party_negotiation  # consumer/business/mediator offer rounds with quorum-style dual confirmation
  complexity_layers:
    - optimistic_concurrency                 # OCC on Complaint.version guards offer/settlement supersede writes
    - scheduled_actions                      # logical clock drives deadline/overdue, offer expiry, embargo sweeps
    - rate_threshold_triggers                # pattern_score bands (60/100) gate mediation vs mandatory referral
    - dual_variant_calculation               # rating (LIFETIME vs ROLLING_12M), allocation (CHRONOLOGICAL vs PRO_RATA)
  entity_topology: flat                      # peer entities joined by FK references; no nested URL ownership
  state_machine_shape: cyclic                # negotiation loops, appeal reopen, referral return, breach re-mediation
  relationship_patterns:
    - one_to_many                            # Business -> Complaints -> Responses/Offers/Sessions/Settlements
    - self_referential                       # SettlementOffer.parent_offer_id chains negotiation rounds
    - cross_aggregate                        # RestitutionPayment allocates across Settlements of one Business
  role_model: segregation_of_duties          # acceptor != closer; referrer != reviewer; drafter != publisher
  consistency_model: immediate               # all mutations + derived fields visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consumer full legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across Consumers", constraints: "unique" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of residence" }
      - { name: phone, type: string, source: input, required: false, description: "Optional contact phone" }

  - name: Business
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name; unique per home_state", constraints: "unique with (legal_name, home_state)" }
      - { name: dba_name, type: string, source: input, required: false, description: "Doing-business-as name" }
      - { name: home_state, type: string, source: input, description: "Two-letter state of incorporation; drives out-of-state deadline extension" }
      - { name: operates_in_states, type: array, source: input, description: "Array of two-letter state codes where the business transacts; jurisdiction factor" }
      - { name: naics_code, type: string, source: input, description: "Industry classification code" }
      - { name: size_tier, type: enum, source: input, default: SMALL, description: "SMALL | MEDIUM | LARGE; pattern-score multiplier" }
      - { name: rating_method, type: enum, source: input, default: LIFETIME, description: "LIFETIME | ROLLING_12M; selects rating variant; changeable by UnitDirector" }
      - { name: watch_status, type: enum, source: computed, default: CLEAR, description: "CLEAR | WATCHLIST | FLAGGED; derived from pattern_score bands 60/100" }
      - { name: pattern_score, type: integer, source: computed, default: 0, description: "Weighted terminal-complaint score, rolling 730-day window, clamp [0,1000]" }
      - { name: published_complaint_count, type: integer, source: computed, default: 0, description: "Complaints of this business with publication_status == PUBLISHED" }
      - { name: rating_score, type: integer, source: computed, default: 100, description: "max(0, 100 - published demerits) per active rating_method variant" }
      - { name: rating_tier, type: enum, source: computed, default: A, description: "A (>=90) | B (>=70) | C (>=40) | D (<40)" }
      - { name: overdue_response_count, type: integer, source: computed, default: 0, description: "Lifetime count of complaints that ever flipped to RESPONSE_OVERDUE" }
      - { name: next_filing_seq, type: integer, source: system, default: 1, description: "Per-business monotonic counter sourcing Complaint.filing_seq; deterministic allocation/tie-break order" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id; must equal X-User-ID when caller role is Consumer" }
      - { name: business_id, type: string, source: input, description: "FK -> Business.id; respondent business" }
      - { name: incident_date, type: string, source: input, description: "YYYY-MM-DD of alleged incident; filing-window anchor" }
      - { name: incident_state, type: string, source: input, description: "Two-letter state where the transaction occurred" }
      - { name: category, type: enum, source: input, description: "DECEPTIVE_PRACTICE | REFUND_REFUSAL | DEFECTIVE_PRODUCT | BILLING_DISPUTE | WARRANTY_DENIED | CONTRACT_VIOLATION | OTHER" }
      - { name: description, type: string, source: input, description: "Free-text complaint narrative" }
      - { name: amount_in_dispute_cents, type: integer, source: input, description: "Claimed loss; >= 0" }
      - { name: publication_consent, type: boolean, source: input, default: true, description: "If false, complaint is SUPPRESSED from publication at closure" }
      - { name: filing_seq, type: integer, source: system, description: "Per-business monotonic sequence assigned from Business.next_filing_seq at creation" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: case_status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | ACCEPTED | BUSINESS_NOTIFIED | RESPONSE_RECEIVED | RESPONSE_OVERDUE | MEDIATION_OFFERED | MEDIATION_ACTIVE | MEDIATION_IMPASSE | SETTLEMENT_PENDING | SETTLED | REFERRED_ENFORCEMENT | CLOSED_UNRESOLVED | DECLINED" }
      - { name: publication_status, type: enum, source: system, default: UNPUBLISHED, description: "UNPUBLISHED | EMBARGOED | PUBLISHED | SUPPRESSED | REDACTED; independent axis from case_status" }
      - { name: decline_reason, type: enum, source: system, description: "NO_JURISDICTION | OUT_OF_AUTHORITY | DUPLICATE | WITHDRAWN; null unless DECLINED" }
      - { name: appeal_used, type: boolean, source: system, default: false, description: "True after the single permitted appeal reopens the complaint" }
      - { name: jurisdiction_factors, type: object, source: computed, description: "{incident_in_state, business_operates_in_state, within_filing_window} booleans evaluated at creation" }
      - { name: accepted_by_officer_id, type: string, source: system, description: "X-User-ID of IntakeOfficer who screened ACCEPTED; segregation-of-duties anchor" }
      - { name: closed_by_officer_id, type: string, source: system, description: "X-User-ID of officer who closed unresolved; must differ from accepted_by_officer_id" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock at terminal closure; null while open; cleared on referral return" }
      - { name: response_deadline, type: datetime, source: computed, description: "notified_at + 30d (in-state) or +45d (out-of-state); see response_deadline_calc" }
      - { name: response_received_at, type: datetime, source: system, description: "Latest business-response submission timestamp" }
      - { name: response_attempts, type: integer, source: system, default: 0, description: "Count of BusinessResponse rows created; hard cap 3" }
      - { name: latest_response_id, type: string, source: system, description: "Most recent BusinessResponse id; null until first response" }
      - { name: ever_response_overdue, type: boolean, source: system, default: false, description: "Set true by deadline sweep; pattern-score penalty input; never reset" }
      - { name: active_settlement_id, type: string, source: system, description: "Current non-superseded Settlement id; null until settlement created" }

  - name: ComplaintEvent
    parent: null
    common_fields: false
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: event_type, type: enum, source: system, description: "CREATED | STATE_CHANGED | RESPONSE_FILED | RESPONSE_REVIEWED | SESSION_SCHEDULED | SESSION_CONFIRMED | SESSION_COMPLETED | OFFER_TENDERED | OFFER_ACCEPTED | OFFER_RESCINDED | SETTLEMENT_CREATED | SETTLEMENT_EXECUTED | SETTLEMENT_BREACHED | PAYMENT_ALLOCATED | PAYMENT_RETURNED | PAYMENT_DISBURSED | REFERRAL_FILED | REFERRAL_RETURNED | CASE_CLOSED | PUBLISHED | REDACTED" }
      - { name: from_status, type: string, source: system, description: "Prior case_status or publication_status; null for non-transition events" }
      - { name: to_status, type: string, source: system, description: "New status; null for non-transition events" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor, or 'system' for sweeps" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor, or 'system'" }
      - { name: note, type: string, source: system, description: "Machine-generated detail (e.g., allocation breakdown)" }

  - name: BusinessResponse
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: business_id, type: string, source: system, description: "FK -> Business.id; copied from complaint at creation" }
      - { name: response_text, type: string, source: input, description: "Business's written response" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission" }
      - { name: is_late, type: boolean, source: computed, description: "submitted_at > complaint.response_deadline" }
      - { name: response_status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | SUFFICIENT | INSUFFICIENT_RETURNED" }
      - { name: attempt_number, type: integer, source: system, description: "1-based ordinal of this response on the complaint" }

  - name: Mediator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Mediator name" }
      - { name: employee_ref, type: string, source: input, description: "HR reference; unique", constraints: "unique" }
      - { name: mediator_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }
      - { name: conflicted_business_ids, type: array, source: input, default: [], description: "Business ids this mediator must not be assigned to (conflict of interest)" }
      - { name: max_concurrent_cases, type: integer, source: input, default: 10, description: "Cap on sessions in PROPOSED or CONFIRMED" }
      - { name: active_case_count, type: integer, source: computed, default: 0, description: "Live count of own MediationSessions with session_status in {PROPOSED, CONFIRMED}; invariant anchor" }

  - name: MediationRoom
    parent: null
    common_fields: true
    fields:
      - { name: room_name, type: string, source: input, description: "Room name; unique", constraints: "unique" }
      - { name: capacity, type: integer, source: input, description: "Seat count" }
      - { name: location, type: string, source: input, description: "Office location" }
      - { name: room_status, type: enum, source: system, default: OPERATIONAL, description: "OPERATIONAL | OUT_OF_SERVICE" }

  - name: MediationSession
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: mediator_id, type: string, source: input, description: "FK -> Mediator.id; must equal X-User-ID when caller role is Mediator" }
      - { name: room_id, type: string, source: input, description: "FK -> MediationRoom.id" }
      - { name: starts_at, type: datetime, source: input, description: "Session start; must be strictly after current logical time" }
      - { name: ends_at, type: datetime, source: input, description: "Session end; must be strictly after starts_at" }
      - { name: session_status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | CONFIRMED | DECLINED | CANCELLED | COMPLETED | NO_SHOW" }
      - { name: consumer_confirmed, type: boolean, source: system, default: false, description: "Consumer party confirmed attendance" }
      - { name: business_confirmed, type: boolean, source: system, default: false, description: "Business party confirmed attendance" }
      - { name: outcome, type: enum, source: input, description: "PROGRESS | IMPASSE | SETTLEMENT_REACHED; required only on complete with result COMPLETED", constraints: "null until completion" }

  - name: SettlementOffer
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: parent_offer_id, type: string, source: system, description: "FK -> SettlementOffer.id; the TENDERED offer this one supersedes; null for the first offer on a complaint" }
      - { name: offer_seq, type: integer, source: system, description: "Per-complaint monotonic sequence from 1" }
      - { name: offered_by_role, type: enum, source: input, description: "CONSUMER | BUSINESS; must match caller role" }
      - { name: offered_by_id, type: string, source: system, description: "X-User-ID of tendering party" }
      - { name: restitution_amount_cents, type: integer, source: input, description: "Offered consumer restitution; >= 0" }
      - { name: non_monetary_terms, type: string, source: input, required: false, description: "Non-monetary commitments" }
      - { name: offer_status, type: enum, source: system, default: TENDERED, description: "TENDERED | ACCEPTED | REJECTED | WITHDRAWN | EXPIRED | SUPERSEDED | RESCINDED" }
      - { name: tendered_at, type: datetime, source: system, description: "Logical clock at tender" }
      - { name: expires_at, type: datetime, source: computed, description: "tendered_at + 14 days; offer is open while now <= expires_at" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical clock at acceptance; null until ACCEPTED" }
      - { name: cooling_off_until, type: datetime, source: computed, description: "accepted_at + 72 hours; null until ACCEPTED; rescission allowed while now < cooling_off_until" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: source_offer_id, type: string, source: system, description: "FK -> SettlementOffer.id; the ACCEPTED offer documented" }
      - { name: business_id, type: string, source: system, description: "FK -> Business.id; copied from complaint" }
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; copied from complaint" }
      - { name: restitution_amount_cents, type: integer, source: system, description: "Copied from source offer; >= 0" }
      - { name: mediation_fee_cents, type: integer, source: computed, description: "Tiered fee keyed on restitution_amount_cents ONLY (settlement_fee_calc); owed to unit, not part of outstanding" }
      - { name: total_due_cents, type: integer, source: computed, description: "restitution_amount_cents + mediation_fee_cents" }
      - { name: fulfilled_cents, type: integer, source: computed, default: 0, description: "Sum of allocated payment cents (payments in ALLOCATED/DISBURSED) against this settlement" }
      - { name: outstanding_cents, type: integer, source: computed, description: "restitution_amount_cents - fulfilled_cents while status in {DRAFT, EXECUTED, FULFILLED, BREACHED}; forced to 0 on SUPERSEDED" }
      - { name: settlement_status, type: enum, source: system, default: DRAFT, description: "DRAFT | EXECUTED | FULFILLED | BREACHED | SUPERSEDED" }
      - { name: executed_at, type: datetime, source: system, description: "Logical clock at execution; null until EXECUTED" }
      - { name: due_date, type: datetime, source: computed, description: "executed_at + 30 days; null until EXECUTED; breach eligible when now > due_date and outstanding_cents > 0" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical clock when outstanding_cents reached 0; null until FULFILLED" }

  - name: RestitutionPayment
    parent: null
    common_fields: true
    fields:
      - { name: business_id, type: string, source: input, description: "FK -> Business.id; must equal X-User-ID when caller role is Business" }
      - { name: amount_cents, type: integer, source: input, description: "Lump-sum payment; > 0" }
      - { name: allocation_method, type: enum, source: input, default: CHRONOLOGICAL, description: "CHRONOLOGICAL | PRO_RATA; selects allocation variant, fixed at pledge" }
      - { name: payment_status, type: enum, source: system, default: PLEDGED, description: "PLEDGED | ALLOCATED | DISBURSED | RETURNED" }
      - { name: allocations, type: array, source: computed, description: "[{settlement_id, complaint_id, filing_seq, allocated_cents}] computed at mark-received; [] while PLEDGED; emptied on RETURNED" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at mark-received; null until ALLOCATED" }

  - name: EnforcementReferral
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: business_id, type: string, source: system, description: "FK -> Business.id; copied from complaint" }
      - { name: referred_by_user_id, type: string, source: system, description: "X-User-ID of referring staff" }
      - { name: referred_by_role, type: string, source: system, description: "Role of referring staff" }
      - { name: reason, type: string, source: input, description: "Pattern-violation narrative" }
      - { name: pattern_score_at_referral, type: integer, source: computed, description: "Business.pattern_score snapshot at referral time" }
      - { name: referral_status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | ACCEPTED | RETURNED_TO_MEDIATION" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "EnforcementAttorney X-User-ID; must differ from referred_by_user_id" }

  - name: ScamAlert
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Alert headline" }
      - { name: body, type: string, source: input, description: "Public education content" }
      - { name: scam_category, type: enum, source: input, description: "PHISHING | IMPERSONATION | ADVANCE_FEE | FAKE_CHARITY | TECH_SUPPORT | ROMANCE | OTHER" }
      - { name: severity, type: enum, source: input, description: "LOW | ELEVATED | HIGH | CRITICAL" }
      - { name: related_business_id, type: string, source: input, required: false, description: "FK -> Business.id; optional named business" }
      - { name: related_complaint_id, type: string, source: input, required: false, description: "FK -> Complaint.id; optional originating complaint" }
      - { name: education_topics, type: array, source: input, required: false, description: "Consumer-education topic tags" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of drafter; publisher must differ (segregation of duties)" }
      - { name: alert_status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | ARCHIVED" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock at publication; null until PUBLISHED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Complaint
    field: case_status
    initial_state: RECEIVED
    terminal_states: [SETTLED, CLOSED_UNRESOLVED, DECLINED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /consumer-protection/complaints/{complaintId}/screen with decision=ACCEPT"
        actor: IntakeOfficer
        preconditions:
          - "case_status == RECEIVED"
          - "jurisdiction factors pass: incident_state == 'OR' OR business.operates_in_states contains 'OR' (else ERR_NO_JURISDICTION)"
        side_effects:
          - "accepted_by_officer_id = X-User-ID"
          - "ComplaintEvent STATE_CHANGED written"
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /consumer-protection/complaints/{complaintId}/screen with decision=DECLINE"
        actor: IntakeOfficer
        preconditions:
          - "case_status == RECEIVED"
          - "decline_reason in {NO_JURISDICTION, OUT_OF_AUTHORITY, DUPLICATE} supplied"
        side_effects:
          - "decline_reason set; closed_at = now"
          - "publication axis: UNPUBLISHED (terminal; declined complaints never publish)"
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /consumer-protection/complaints/{complaintId}/withdraw"
        actor: Consumer
        preconditions:
          - "case_status == RECEIVED"
          - "caller is complaint consumer (ownership)"
        side_effects:
          - "decline_reason = WITHDRAWN; closed_at = now"
      - from: DECLINED
        to: RECEIVED
        trigger: "POST /consumer-protection/complaints/{complaintId}/appeal"
        actor: Consumer
        preconditions:
          - "case_status == DECLINED"
          - "appeal_used == false (else ERR_APPEAL_ALREADY_USED)"
          - "decline_reason != WITHDRAWN"
        side_effects:
          - "appeal_used = true; decline_reason = null; closed_at = null"
      - from: ACCEPTED
        to: BUSINESS_NOTIFIED
        trigger: "POST /consumer-protection/complaints/{complaintId}/notify-business"
        actor: IntakeOfficer
        preconditions:
          - "case_status == ACCEPTED"
        side_effects:
          - "response_deadline computed per response_deadline_calc (30d in-state, 45d out-of-state)"
          - "ComplaintEvent STATE_CHANGED written"
      - from: BUSINESS_NOTIFIED
        to: RESPONSE_OVERDUE
        trigger: "system (POST /consumer-protection/_clock/set_current_utc sweep when now > response_deadline and no response received)"
        actor: system
        preconditions:
          - "case_status == BUSINESS_NOTIFIED AND now > response_deadline"
        side_effects:
          - "ever_response_overdue = true (never reset)"
          - "CASCADE hop 2: Business.overdue_response_count += 1"
          - "CASCADE hop 3: when a flip makes Business.overdue_response_count cross a pattern band boundary the Business watch fields are re-evaluated at next terminal closure (pattern_score counts ever_response_overdue at closure)"
      - from: BUSINESS_NOTIFIED
        to: RESPONSE_RECEIVED
        trigger: "POST /consumer-protection/complaints/{complaintId}/business-responses"
        actor: Business
        preconditions:
          - "case_status == BUSINESS_NOTIFIED"
          - "response_attempts < 3 (else ERR_RESUBMISSION_CAP_REACHED)"
          - "caller business owns complaint (ownership)"
        side_effects:
          - "BusinessResponse row created (attempt_number = response_attempts + 1, is_late = submitted_at > response_deadline)"
          - "response_received_at = now; response_attempts += 1; latest_response_id = new row"
      - from: RESPONSE_OVERDUE
        to: RESPONSE_RECEIVED
        trigger: "POST /consumer-protection/complaints/{complaintId}/business-responses (late response)"
        actor: Business
        preconditions:
          - "case_status == RESPONSE_OVERDUE"
          - "response_attempts < 3"
        side_effects:
          - "BusinessResponse created with is_late == true"
          - "response_received_at = now; response_attempts += 1; latest_response_id = new row"
      - from: RESPONSE_RECEIVED
        to: BUSINESS_NOTIFIED
        trigger: "POST /consumer-protection/business-responses/{responseId}/review with verdict=INSUFFICIENT"
        actor: IntakeOfficer
        preconditions:
          - "latest BusinessResponse.response_status == SUBMITTED"
        side_effects:
          - "BusinessResponse.response_status = INSUFFICIENT_RETURNED"
          - "case_status reverts to BUSINESS_NOTIFIED awaiting resubmission (deadline unchanged)"
      - from: RESPONSE_RECEIVED
        to: MEDIATION_OFFERED
        trigger: "POST /consumer-protection/complaints/{complaintId}/offer-mediation"
        actor: IntakeOfficer
        preconditions:
          - "case_status == RESPONSE_RECEIVED"
          - "latest BusinessResponse.response_status == SUFFICIENT (else ERR_INVALID_STATE)"
          - "Business.watch_status != FLAGGED (else ERR_PATTERN_REFERRAL_REQUIRED)"
        side_effects: []
      - from: RESPONSE_OVERDUE
        to: MEDIATION_OFFERED
        trigger: "POST /consumer-protection/complaints/{complaintId}/offer-mediation"
        actor: IntakeOfficer
        preconditions:
          - "case_status == RESPONSE_OVERDUE"
          - "Business.watch_status != FLAGGED (else ERR_PATTERN_REFERRAL_REQUIRED)"
        side_effects: []
      - from: MEDIATION_OFFERED
        to: MEDIATION_ACTIVE
        trigger: "system (a MediationSession on this complaint reaches CONFIRMED via dual party confirmation)"
        actor: system
        preconditions:
          - "a session of this complaint transitions PROPOSED -> CONFIRMED"
        side_effects: []
      - from: MEDIATION_IMPASSE
        to: MEDIATION_ACTIVE
        trigger: "system (a new MediationSession on this complaint reaches CONFIRMED — re-engagement loop)"
        actor: system
        preconditions:
          - "a session of this complaint transitions PROPOSED -> CONFIRMED"
        side_effects: []
      - from: MEDIATION_ACTIVE
        to: MEDIATION_IMPASSE
        trigger: "POST /consumer-protection/mediation-sessions/{sessionId}/complete with outcome=IMPASSE"
        actor: Mediator
        preconditions:
          - "session CONFIRMED and owned by caller"
        side_effects: []
      - from: MEDIATION_ACTIVE
        to: SETTLEMENT_PENDING
        trigger: "POST /consumer-protection/settlements/{settlementId}/execute"
        actor: Mediator
        preconditions:
          - "settlement DRAFT, cooling-off elapsed (now >= source offer cooling_off_until)"
        side_effects:
          - "active_settlement_id = settlement id"
      - from: MEDIATION_IMPASSE
        to: SETTLEMENT_PENDING
        trigger: "POST /consumer-protection/settlements/{settlementId}/execute"
        actor: Mediator
        preconditions:
          - "settlement DRAFT, cooling-off elapsed"
        side_effects:
          - "active_settlement_id = settlement id"
      - from: SETTLEMENT_PENDING
        to: SETTLED
        trigger: "system (allocation drives active Settlement.outstanding_cents to 0 at mark-received) OR execute when restitution_amount_cents == 0"
        actor: system
        preconditions:
          - "active settlement FULFILLED, OR (settlement EXECUTED AND restitution_amount_cents == 0)"
        side_effects:
          - "closed_at = now"
          - "publication axis: UNPUBLISHED -> EMBARGOED if publication_consent else UNPUBLISHED -> SUPPRESSED"
          - "Business.pattern_score recomputed (terminal closure enters rolling window)"
      - from: SETTLEMENT_PENDING
        to: MEDIATION_IMPASSE
        trigger: "POST /consumer-protection/settlements/{settlementId}/mark-breached"
        actor: "IntakeOfficer or UnitDirector"
        preconditions:
          - "settlement EXECUTED, now > due_date, outstanding_cents > 0"
        side_effects:
          - "settlement BREACHED; negotiation reopens"
      - from: [ACCEPTED, BUSINESS_NOTIFIED, RESPONSE_RECEIVED, RESPONSE_OVERDUE, MEDIATION_OFFERED, MEDIATION_ACTIVE, MEDIATION_IMPASSE]
        to: REFERRED_ENFORCEMENT
        trigger: "POST /consumer-protection/complaints/{complaintId}/refer-enforcement"
        actor: "IntakeOfficer or Mediator or UnitDirector"
        preconditions:
          - "case_status in the listed from-set"
        side_effects:
          - "EnforcementReferral created (PENDING_REVIEW, pattern_score_at_referral snapshot)"
          - "closed_at = now"
          - "publication axis: UNPUBLISHED -> EMBARGOED if publication_consent else UNPUBLISHED -> SUPPRESSED"
          - "Business.pattern_score recomputed (REFERRED_ENFORCEMENT weight 25 enters window)"
      - from: REFERRED_ENFORCEMENT
        to: MEDIATION_IMPASSE
        trigger: "POST /consumer-protection/enforcement-referrals/{referralId}/review with decision=RETURN"
        actor: EnforcementAttorney
        preconditions:
          - "referral PENDING_REVIEW; reviewer != referred_by_user_id"
        side_effects:
          - "closed_at = null"
          - "publication axis: EMBARGOED -> UNPUBLISHED (revert; nothing was published yet)"
          - "Business.pattern_score recomputed (complaint leaves terminal window set)"
      - from: [RESPONSE_RECEIVED, RESPONSE_OVERDUE, MEDIATION_OFFERED, MEDIATION_ACTIVE, MEDIATION_IMPASSE]
        to: CLOSED_UNRESOLVED
        trigger: "POST /consumer-protection/complaints/{complaintId}/close-unresolved"
        actor: IntakeOfficer
        preconditions:
          - "case_status in the listed from-set"
          - "X-User-ID != accepted_by_officer_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
          - "no SettlementOffer on this complaint in {TENDERED, ACCEPTED}"
          - "no Settlement on this complaint in {DRAFT, EXECUTED, BREACHED}"
          - "no MediationSession on this complaint in {PROPOSED, CONFIRMED}"
          - "alternative_options non-empty subset of {SMALL_CLAIMS, PRIVATE_ATTORNEY, BBB, FEDERAL_AGENCY, CLASS_ACTION}"
        side_effects:
          - "closed_by_officer_id = X-User-ID; closed_at = now; closure_summary stored"
          - "publication axis: UNPUBLISHED -> EMBARGOED if publication_consent else UNPUBLISHED -> SUPPRESSED"
          - "Business.pattern_score recomputed (CLOSED_UNRESOLVED weight 15, plus 5 if ever_response_overdue)"

  - entity: Complaint
    field: publication_status
    initial_state: UNPUBLISHED
    terminal_states: [SUPPRESSED, REDACTED]
    transitions:
      - from: UNPUBLISHED
        to: EMBARGOED
        trigger: "system (terminal closure of case_status with publication_consent == true)"
        actor: system
        preconditions:
          - "case_status enters {SETTLED, CLOSED_UNRESOLVED, REFERRED_ENFORCEMENT}"
        side_effects:
          - "embargo anchor = closed_at; publishable when now >= closed_at + 10 days"
      - from: UNPUBLISHED
        to: SUPPRESSED
        trigger: "system (terminal closure with publication_consent == false)"
        actor: system
        preconditions:
          - "case_status enters terminal set AND publication_consent == false"
        side_effects: []
      - from: EMBARGOED
        to: PUBLISHED
        trigger: "system (POST /consumer-protection/_clock/set_current_utc sweep when now >= closed_at + 10 days)"
        actor: system
        preconditions:
          - "publication_status == EMBARGOED AND now >= closed_at + 10 days (inclusive boundary)"
        side_effects:
          - "CASCADE hop 2: Business.published_complaint_count += 1; Business.rating_score/rating_tier recomputed per active rating_method"
          - "CASCADE hop 3: rating_tier flips band when recomputed rating_score crosses 90/70/40 boundary"
          - "ComplaintEvent PUBLISHED written"
      - from: PUBLISHED
        to: REDACTED
        trigger: "POST /consumer-protection/complaints/{complaintId}/retract-publication"
        actor: Consumer
        preconditions:
          - "publication_status == PUBLISHED"
          - "caller is complaint consumer (ownership)"
        side_effects:
          - "Business.published_complaint_count -= 1; rating recomputed (demerit removed)"
      - from: EMBARGOED
        to: UNPUBLISHED
        trigger: "system (referral RETURNED_TO_MEDIATION reverts closure)"
        actor: system
        preconditions:
          - "linked referral decision == RETURN"
        side_effects: []

  - entity: BusinessResponse
    field: response_status
    initial_state: SUBMITTED
    terminal_states: [SUFFICIENT, INSUFFICIENT_RETURNED]
    transitions:
      - from: SUBMITTED
        to: SUFFICIENT
        trigger: "POST /consumer-protection/business-responses/{responseId}/review with verdict=SUFFICIENT"
        actor: IntakeOfficer
        preconditions:
          - "response_status == SUBMITTED"
        side_effects:
          - "complaint remains RESPONSE_RECEIVED; mediation offer becomes available"
      - from: SUBMITTED
        to: INSUFFICIENT_RETURNED
        trigger: "POST /consumer-protection/business-responses/{responseId}/review with verdict=INSUFFICIENT"
        actor: IntakeOfficer
        preconditions:
          - "response_status == SUBMITTED"
        side_effects:
          - "complaint RESPONSE_RECEIVED -> BUSINESS_NOTIFIED (cyclic resubmission; response_attempts persists; cap 3 enforced at next submission)"

  - entity: Mediator
    field: mediator_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /consumer-protection/mediators/{mediatorId}/deactivate"
        actor: UnitDirector
        preconditions:
          - "mediator_status == ACTIVE"
        side_effects:
          - "existing sessions unchanged; new session creation rejected ERR_REFERENCED_ENTITY_INACTIVE"

  - entity: MediationRoom
    field: room_status
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: OUT_OF_SERVICE
        trigger: "POST /consumer-protection/mediation-rooms/{roomId}/take-out-of-service"
        actor: UnitDirector
        preconditions:
          - "room_status == OPERATIONAL"
        side_effects:
          - "new session creation rejected ERR_REFERENCED_ENTITY_INACTIVE"

  - entity: MediationSession
    field: session_status
    initial_state: PROPOSED
    terminal_states: [DECLINED, CANCELLED, COMPLETED, NO_SHOW]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /consumer-protection/mediation-sessions/{sessionId}/confirm (second of the two party confirmations)"
        actor: "Consumer or Business"
        preconditions:
          - "session_status == PROPOSED"
          - "both consumer_confirmed and business_confirmed true after this call"
          - "caller is a party to the complaint (ownership); each party may confirm only its own side"
        side_effects:
          - "complaint MEDIATION_OFFERED -> MEDIATION_ACTIVE, or MEDIATION_IMPASSE -> MEDIATION_ACTIVE"
          - "active_case_count unchanged (PROPOSED and CONFIRMED both count)"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /consumer-protection/mediation-sessions/{sessionId}/decline"
        actor: "Consumer or Business"
        preconditions:
          - "session_status == PROPOSED"
        side_effects:
          - "Mediator.active_case_count -= 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /consumer-protection/mediation-sessions/{sessionId}/cancel"
        actor: "Mediator or UnitDirector"
        preconditions:
          - "session_status in {PROPOSED, CONFIRMED}"
        side_effects:
          - "Mediator.active_case_count -= 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /consumer-protection/mediation-sessions/{sessionId}/cancel"
        actor: "Mediator or UnitDirector"
        preconditions:
          - "session_status in {PROPOSED, CONFIRMED}"
        side_effects:
          - "Mediator.active_case_count -= 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /consumer-protection/mediation-sessions/{sessionId}/complete with outcome"
        actor: Mediator
        preconditions:
          - "session_status == CONFIRMED"
          - "caller mediator owns session (X-User-ID == mediator_id)"
          - "now >= starts_at"
        side_effects:
          - "Mediator.active_case_count -= 1"
          - "outcome=IMPASSE -> complaint MEDIATION_ACTIVE -> MEDIATION_IMPASSE"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /consumer-protection/mediation-sessions/{sessionId}/complete with outcome omitted and no_show=true"
        actor: Mediator
        preconditions:
          - "session_status == CONFIRMED; caller owns session; now >= starts_at"
        side_effects:
          - "Mediator.active_case_count -= 1"

  - entity: SettlementOffer
    field: offer_status
    initial_state: TENDERED
    terminal_states: [REJECTED, WITHDRAWN, EXPIRED, SUPERSEDED, RESCINDED]
    transitions:
      - from: TENDERED
        to: SUPERSEDED
        trigger: "system (a new SettlementOffer is created on the same complaint — OCC-guarded write)"
        actor: system
        preconditions:
          - "another offer TENDERED on same complaint"
        side_effects:
          - "new offer parent_offer_id = superseded offer id; offer_seq = superseded seq + 1"
      - from: TENDERED
        to: ACCEPTED
        trigger: "POST /consumer-protection/settlement-offers/{offerId}/accept"
        actor: "Consumer or Business"
        preconditions:
          - "offer_status == TENDERED"
          - "caller is the counter-party (offered_by_role == CONSUMER requires Business caller, and vice versa)"
          - "Complaint.case_status in {MEDIATION_ACTIVE, MEDIATION_IMPASSE}"
          - "now <= expires_at"
        side_effects:
          - "accepted_at = now; cooling_off_until = accepted_at + 72 hours"
      - from: TENDERED
        to: REJECTED
        trigger: "POST /consumer-protection/settlement-offers/{offerId}/reject"
        actor: "Consumer or Business"
        preconditions:
          - "offer_status == TENDERED; caller is the counter-party"
        side_effects: []
      - from: TENDERED
        to: WITHDRAWN
        trigger: "POST /consumer-protection/settlement-offers/{offerId}/withdraw"
        actor: "Consumer or Business"
        preconditions:
          - "offer_status == TENDERED; caller is the tendering party (X-User-ID == offered_by_id)"
        side_effects: []
      - from: TENDERED
        to: EXPIRED
        trigger: "system (POST /consumer-protection/_clock/set_current_utc sweep when now > expires_at)"
        actor: system
        preconditions:
          - "offer_status == TENDERED AND now > expires_at"
        side_effects: []
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /consumer-protection/settlement-offers/{offerId}/rescind"
        actor: Consumer
        preconditions:
          - "offer_status == ACCEPTED; caller is complaint consumer"
          - "now < cooling_off_until (else ERR_RESCISSION_WINDOW_EXPIRED)"
          - "no Settlement sourced from this offer in {EXECUTED, FULFILLED, BREACHED}"
        side_effects:
          - "any DRAFT Settlement sourced from this offer -> SUPERSEDED (compensation), its outstanding written to 0"

  - entity: Settlement
    field: settlement_status
    initial_state: DRAFT
    terminal_states: [FULFILLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /consumer-protection/settlements/{settlementId}/execute"
        actor: Mediator
        preconditions:
          - "settlement_status == DRAFT"
          - "now >= source offer cooling_off_until (else ERR_COOLING_OFF_ACTIVE)"
        side_effects:
          - "executed_at = now; due_date = executed_at + 30 days"
          - "complaint MEDIATION_ACTIVE|MEDIATION_IMPASSE -> SETTLEMENT_PENDING"
          - "if restitution_amount_cents == 0: complaint SETTLEMENT_PENDING -> SETTLED in the same request (closure side effects fire)"
      - from: EXECUTED
        to: FULFILLED
        trigger: "system (mark-received allocation drives outstanding_cents to 0)"
        actor: system
        preconditions:
          - "allocation reduces outstanding_cents to exactly 0"
        side_effects:
          - "fulfilled_at = now"
          - "CASCADE: complaint SETTLEMENT_PENDING -> SETTLED (closure side effects: closed_at, publication embargo or suppression, pattern recompute)"
      - from: FULFILLED
        to: EXECUTED
        trigger: "system (mark-returned reverses an allocation; complaint not yet SETTLED guard applies)"
        actor: system
        preconditions:
          - "a RETURNED payment had allocated cents to this settlement AND its complaint is not SETTLED (else ERR_INVALID_STATE)"
        side_effects:
          - "fulfilled_at = null"
      - from: EXECUTED
        to: BREACHED
        trigger: "POST /consumer-protection/settlements/{settlementId}/mark-breached"
        actor: "IntakeOfficer or UnitDirector"
        preconditions:
          - "settlement_status == EXECUTED"
          - "now > due_date AND outstanding_cents > 0 (else ERR_BREACH_NOT_DUE)"
        side_effects:
          - "complaint SETTLEMENT_PENDING -> MEDIATION_IMPASSE (negotiation reopens)"
      - from: [DRAFT, EXECUTED, BREACHED]
        to: SUPERSEDED
        trigger: "system (a new Settlement is created on the same complaint — OCC-guarded write; or rescind voids a DRAFT)"
        actor: system
        preconditions:
          - "new settlement created on same complaint, or source offer rescinded (DRAFT only)"
        side_effects:
          - "outstanding_cents forced to 0 (write-off); fulfilled_cents preserved; complaint.active_settlement_id repointed on supersede"

  - entity: RestitutionPayment
    field: payment_status
    initial_state: PLEDGED
    terminal_states: [DISBURSED, RETURNED]
    transitions:
      - from: PLEDGED
        to: ALLOCATED
        trigger: "POST /consumer-protection/restitution-payments/{paymentId}/mark-received"
        actor: IntakeOfficer
        preconditions:
          - "payment_status == PLEDGED"
          - "amount_cents <= sum of outstanding_cents over this business's settlements in {EXECUTED, BREACHED} with outstanding > 0 (else ERR_RESTITUTION_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "received_at = now; allocations computed per allocation_method (restitution_allocation_calc)"
          - "CASCADE hop 2: each allocation mutates Settlement.fulfilled_cents/outstanding_cents"
          - "CASCADE hop 3: settlement reaching outstanding 0 -> FULFILLED"
          - "CASCADE hop 4: complaint of a FULFILLED settlement SETTLEMENT_PENDING -> SETTLED, publication axis UNPUBLISHED -> EMBARGOED/SUPPRESSED, closed_at stamped, pattern recompute"
          - "ComplaintEvent PAYMENT_ALLOCATED per affected complaint"
      - from: ALLOCATED
        to: RETURNED
        trigger: "POST /consumer-protection/restitution-payments/{paymentId}/mark-returned"
        actor: IntakeOfficer
        preconditions:
          - "payment_status == ALLOCATED"
          - "no complaint receiving an allocation is SETTLED (else ERR_INVALID_STATE)"
        side_effects:
          - "allocations reversed: each Settlement.fulfilled_cents decremented, outstanding_cents restored; any FULFILLED settlement -> EXECUTED (fulfilled_at null)"
          - "allocations emptied; ComplaintEvent PAYMENT_RETURNED per affected complaint"
      - from: ALLOCATED
        to: DISBURSED
        trigger: "POST /consumer-protection/restitution-payments/{paymentId}/disburse"
        actor: IntakeOfficer
        preconditions:
          - "payment_status == ALLOCATED"
        side_effects:
          - "consumer notification: ComplaintEvent PAYMENT_DISBURSED written per allocated complaint"

  - entity: EnforcementReferral
    field: referral_status
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED, RETURNED_TO_MEDIATION]
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /consumer-protection/enforcement-referrals/{referralId}/review with decision=ACCEPT"
        actor: EnforcementAttorney
        preconditions:
          - "referral_status == PENDING_REVIEW"
          - "X-User-ID != referred_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; complaint remains REFERRED_ENFORCEMENT"
      - from: PENDING_REVIEW
        to: RETURNED_TO_MEDIATION
        trigger: "POST /consumer-protection/enforcement-referrals/{referralId}/review with decision=RETURN"
        actor: EnforcementAttorney
        preconditions:
          - "referral_status == PENDING_REVIEW"
          - "X-User-ID != referred_by_user_id"
        side_effects:
          - "complaint REFERRED_ENFORCEMENT -> MEDIATION_IMPASSE; closed_at null; publication EMBARGOED -> UNPUBLISHED; pattern recompute"

  - entity: ScamAlert
    field: alert_status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /consumer-protection/scam-alerts/{alertId}/publish"
        actor: UnitDirector
        preconditions:
          - "alert_status == DRAFT"
          - "X-User-ID != drafted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "no other alert with same (title, related_business_id) in {DRAFT, PUBLISHED} (ERR_DUPLICATE_ACTIVE_ALERT)"
        side_effects:
          - "published_at = now"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /consumer-protection/scam-alerts/{alertId}/archive"
        actor: UnitDirector
        preconditions:
          - "alert_status == PUBLISHED"
        side_effects: []

  - entity: Business
    field: watch_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: [CLEAR, WATCHLIST, FLAGGED]
        to: CLEAR
        trigger: "system (pattern_score recompute on terminal closure or referral return: score < 60)"
        actor: system
        preconditions: ["recomputed pattern_score < 60"]
        side_effects: []
      - from: [CLEAR, WATCHLIST, FLAGGED]
        to: WATCHLIST
        trigger: "system (pattern_score recompute: 60 <= score < 100)"
        actor: system
        preconditions: ["recomputed pattern_score in [60, 100)"]
        side_effects: []
      - from: [CLEAR, WATCHLIST, FLAGGED]
        to: FLAGGED
        trigger: "system (pattern_score recompute: score >= 100)"
        actor: system
        preconditions: ["recomputed pattern_score >= 100 (inclusive boundary)"]
        side_effects:
          - "offer-mediation on this business's complaints becomes ERR_PATTERN_REFERRAL_REQUIRED until band drops"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-complaint
    parent_entity: Complaint
    write_endpoint: "POST /consumer-protection/complaints/{complaintId}/settlement-offers"
    occ_field: expected_complaint_version
    description: |
      Creating a SettlementOffer against a Complaint whose version has advanced
      since the client last observed it is rejected. Creating an offer legitimately
      supersedes the complaint's currently TENDERED offer and bumps the complaint
      version, so a writer holding a stale view must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-create-stale-complaint
    parent_entity: Complaint
    write_endpoint: "POST /consumer-protection/complaints/{complaintId}/settlements"
    occ_field: expected_complaint_version
    description: |
      Creating a Settlement against a Complaint whose version has advanced since
      the client last observed it is rejected. Creating a settlement legitimately
      supersedes the complaint's existing DRAFT/EXECUTED/BREACHED settlement and
      bumps the complaint version, so a writer holding a stale view must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: filing_window_check
    trigger: "POST /consumer-protection/complaints (creation)"
    algorithm: threshold
    formula: |
      elapsed_days = (date(filed_at) - incident_date).days
      eligible iff elapsed_days <= FILING_WINDOW_DAYS   # exactly 365 is eligible; 366 rejected
    input_set: "the complaint being created"
    constants:
      FILING_WINDOW_DAYS: 365
    precision: "whole days; incident_date parsed as YYYY-MM-DD; filed_at is logical clock date"

  - name: response_deadline_calc
    trigger: "Complaint ACCEPTED -> BUSINESS_NOTIFIED (notify-business)"
    algorithm: threshold
    formula: |
      days = RESPONSE_BASE_DAYS if business.home_state == complaint.incident_state
             else RESPONSE_BASE_DAYS + OUT_OF_STATE_EXTENSION_DAYS
      response_deadline = notified_at + days
      timely iff response.submitted_at <= response_deadline   # exact deadline instant is timely
      overdue sweep flips complaint only when now > response_deadline (strictly greater)
    input_set: "the complaint being notified and its business"
    constants:
      RESPONSE_BASE_DAYS: 30
      OUT_OF_STATE_EXTENSION_DAYS: 15
    precision: "second precision on ISO8601 timestamps"

  - name: offer_expiry_calc
    trigger: "SettlementOffer creation (compute) and clock sweep (apply)"
    algorithm: threshold
    formula: |
      expires_at = tendered_at + OFFER_TTL_DAYS
      offer open while now <= expires_at; sweep sets EXPIRED only when now > expires_at
    input_set: "offers in TENDERED"
    constants:
      OFFER_TTL_DAYS: 14
    precision: "second precision"

  - name: cooling_off_calc
    trigger: "SettlementOffer acceptance (compute); settlement execute and rescind (evaluate)"
    algorithm: threshold
    formula: |
      cooling_off_until = accepted_at + COOLING_OFF_HOURS
      cooling-off ACTIVE while now < cooling_off_until (strictly less)
      at exactly now == cooling_off_until: rescission rejected (ERR_RESCISSION_WINDOW_EXPIRED),
      settlement execution allowed
    input_set: "the ACCEPTED offer and its sourced settlement"
    constants:
      COOLING_OFF_HOURS: 72
    precision: "second precision"

  - name: pattern_score_calc
    trigger: "any complaint of the business enters a terminal case_status (closed_at set), or a referral RETURN clears closed_at"
    algorithm: threshold
    formula: |
      eligible = complaints of this business with closed_at != null
                 AND case_status in {SETTLED, CLOSED_UNRESOLVED, REFERRED_ENFORCEMENT}
                 AND closed_at within [now - PATTERN_WINDOW_DAYS, now]
      raw = SUM( weight(case_status) ) + OVERDUE_PENALTY * count(eligible with ever_response_overdue == true)
            weights: SETTLED 10, CLOSED_UNRESOLVED 15, REFERRED_ENFORCEMENT 25
      size_mult = SMALL 1.0 | MEDIUM 0.75 | LARGE 0.5
      pattern_score = clamp( round_half_up(raw * size_mult, 0), 0, SCORE_CAP )
      watch band: score >= FLAGGED_MIN -> FLAGGED; score >= WATCHLIST_MIN -> WATCHLIST; else CLEAR
    input_set: "Business's complaints in terminal states within the rolling 730-day window; DECLINED complaints excluded; overdue penalty counted once per complaint"
    constants:
      W_SETTLED: 10
      W_UNRESOLVED: 15
      W_REFERRED: 25
      OVERDUE_PENALTY: 5
      PATTERN_WINDOW_DAYS: 730
      WATCHLIST_MIN: 60
      FLAGGED_MIN: 100
      SCORE_CAP: 1000
    precision: "round_half_up to integer AFTER size multiplier (single rounding point)"
    variants:
      - name: by_size_tier
        when: "business.size_tier differs"
        difference: "same raw sum yields different score (x1.0 vs x0.75 vs x0.5); e.g. raw 30 -> 30 (SMALL), 23 (MEDIUM: round_half_up(22.5)), 15 (LARGE)"

  - name: business_rating_calc
    trigger: "complaint publication_status -> PUBLISHED, PUBLISHED -> REDACTED, or POST /consumer-protection/businesses/{businessId}/rating-method"
    algorithm: aggregation
    formula: |
      base = published complaints of this business (publication_status == PUBLISHED only;
             EMBARGOED / SUPPRESSED / REDACTED / UNPUBLISHED excluded)
      demerit(outcome): SETTLED 5, CLOSED_UNRESOLVED 15, REFERRED_ENFORCEMENT 25
      rating_score = max(0, 100 - effective_demerit_sum)
      rating_tier: >= 90 A; >= 70 B; >= 40 C; else D (inclusive lower bounds)
    input_set: "complaints with publication_status == PUBLISHED; outcome read from case_status"
    constants:
      DEMERIT_SETTLED: 5
      DEMERIT_UNRESOLVED: 15
      DEMERIT_REFERRED: 25
      TIER_A_MIN: 90
      TIER_B_MIN: 70
      TIER_C_MIN: 40
      RECENCY_WINDOW_DAYS: 365
      OLD_WEIGHT: 0.25
    precision: "ROLLING_12M: round_half_up(weighted demerit sum) to integer BEFORE subtracting from 100"
    variants:
      - name: LIFETIME
        when: "business.rating_method == LIFETIME (default)"
        difference: "effective_demerit_sum = SUM(demerit) over ALL published complaints regardless of age"
      - name: ROLLING_12M
        when: "business.rating_method == ROLLING_12M"
        difference: "per-complaint demerit weighted 1.0 if published_at within [now-365d, now], else 0.25; same published set yields a different score (e.g. one 15-demerit complaint 14 months old contributes round input 3.75)"

  - name: restitution_allocation_calc
    trigger: "POST /consumer-protection/restitution-payments/{paymentId}/mark-received"
    algorithm: waterfall_allocation
    formula: |
      obligations = settlements of this business with settlement_status in {EXECUTED, BREACHED}
                    AND outstanding_cents > 0
      order: complaint.filing_seq ASC (filing_seq is unique per business; no tie possible; never use id)
      gate: amount_cents <= SUM(outstanding_cents) else ERR_RESTITUTION_EXCEEDS_OUTSTANDING
    input_set: "this business's open settlements (EXECUTED or BREACHED, outstanding > 0), ordered by complaint filing_seq ASC"
    constants: {}
    precision: "integer cents; per-line round_half_up BEFORE remainder reconciliation (pinned rounding order)"
    variants:
      - name: CHRONOLOGICAL
        when: "payment.allocation_method == CHRONOLOGICAL (default)"
        difference: "fill obligations in filing_seq ASC, each fully before the next; leftover partial fills the last touched obligation; e.g. 10000 over (6000 seq1, 5000 seq2) -> (6000, 4000)"
      - name: PRO_RATA
        when: "payment.allocation_method == PRO_RATA"
        difference: |
          share_i = round_half_up(amount * outstanding_i / total_outstanding) per line, THEN reconcile:
          if SUM(shares) < amount: add 1 cent per line in filing_seq ASC, cycling, until exhausted;
          if SUM(shares) > amount: remove 1 cent per line in filing_seq DESC until balanced.
          Same inputs (10000 over 6000/5000) -> (5455, 4545), diverging from CHRONOLOGICAL's (6000, 4000).

  - name: settlement_fee_calc
    trigger: "POST /consumer-protection/complaints/{complaintId}/settlements (creation)"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER (pinned; the prose 'fee on the settlement value' is resolved as
      keyed on the restitution subtotal ONLY, never on the fee-inclusive total):
        1. restitution = source offer restitution_amount_cents
        2. bracket = tier of restitution
        3. mediation_fee_cents =
             restitution <  TIER1_LIMIT                    -> 0
             TIER1_LIMIT <= restitution <  TIER2_LIMIT     -> round_half_up(TIER2_RATE * restitution)
             restitution >= TIER2_LIMIT                    -> round_half_up(TIER2_RATE * TIER2_LIMIT + TIER3_RATE * (restitution - TIER2_LIMIT))
        4. total_due_cents = restitution + mediation_fee_cents
      If the fee were (wrongly) computed on the total, restitution 600000 would give
      fee 11110 / total 611110; the pinned order gives fee 11000 / total 611000.
    input_set: "the settlement being created and its source ACCEPTED offer"
    constants:
      TIER1_LIMIT: 100000
      TIER2_LIMIT: 500000
      TIER2_RATE: 0.02
      TIER3_RATE: 0.01
    precision: "integer cents, round_half_up at the fee step only"

  - name: publication_stats_calc
    trigger: "GET /consumer-protection/businesses/{businessId}/complaint-statistics"
    algorithm: aggregation
    formula: |
      published = complaints of business with publication_status == PUBLISHED
      published_total = count(published)
      settled_count   = count(published with case_status == SETTLED)
      unresolved_count= count(published with case_status == CLOSED_UNRESOLVED)
      referred_count  = count(published with case_status == REFERRED_ENFORCEMENT)
      average_days_to_close = round_half_up( avg( (closed_at - filed_at).days ) ) over published; 0 when empty
    input_set: "publication_status == PUBLISHED only; EMBARGOED complaints are invisible to statistics until the sweep publishes them"
    constants: {}
    precision: "average rounded half-up to whole days"

  - name: mediator_caseload_calc
    trigger: "session create / confirm-noop / decline / cancel / complete"
    algorithm: aggregation
    formula: |
      Mediator.active_case_count == count(MediationSession with mediator_id = mediator.id
                                          AND session_status in {PROPOSED, CONFIRMED})
      INVARIANT: create (+1) paired with decline/cancel/complete (-1) restores the prior count;
      confirm transitions PROPOSED -> CONFIRMED and leaves the count unchanged.
    input_set: "sessions of the mediator in {PROPOSED, CONFIRMED}"
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "entity-backed ownership: Consumer acts only on own complaints/offers/sessions; Business only on complaints against it and own payments; Mediator only own sessions"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 4
    category: existence
    check: "path identifiers resolve left-to-right; body FK targets exist"
    error_id: "ERR_{ENTITY}_NOT_FOUND"
    http_status: 404
    applies_to: "all pathed endpoints"
  - priority: 5
    category: business_constraint
    check: "request shape: required fields present, types and enum members valid; amount fields strictly positive where required (amount_cents > 0; restitution_amount_cents >= 0; ends_at > starts_at)"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_AMOUNT"
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 6
    category: state
    check: "target entity in a valid from-state per §1.2 for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "regulatory gates: filing window at complaint creation; jurisdiction at screen-accept; segregation of duties (close-unresolved vs acceptor; referral reviewer vs referrer; alert publisher vs drafter); FLAGGED business blocks offer-mediation; mediator conflict-of-interest"
    error_id: "ERR_FILING_WINDOW_EXPIRED / ERR_NO_JURISDICTION / ERR_SEGREGATION_OF_DUTIES / ERR_PATTERN_REFERRAL_REQUIRED / ERR_MEDIATOR_CONFLICT_OF_INTEREST"
    http_status: 422
    applies_to: "complaint create, screen, close-unresolved, referral review, alert publish, offer-mediation, session create"
  - priority: 8
    category: business_constraint
    check: "uniqueness and capacity: duplicate complaint (same consumer+business+incident_date+category not DECLINED); registration uniqueness; OCC stale version; mediator/room interval conflicts; mediator caseload cap; duplicate active alert at publish; resubmission cap; appeal single-use"
    error_id: "ERR_DUPLICATE_COMPLAINT / ERR_UNIQUENESS_VIOLATION / ERR_STALE_VERSION / ERR_MEDIATOR_TIME_CONFLICT / ERR_ROOM_TIME_CONFLICT / ERR_MEDIATOR_CASELOAD_FULL / ERR_DUPLICATE_ACTIVE_ALERT / ERR_RESUBMISSION_CAP_REACHED / ERR_APPEAL_ALREADY_USED"
    http_status: "409 / 412 / 422"
    applies_to: "create and action endpoints as listed per error"
  - priority: 9
    category: business_referential
    check: "referenced configuration entities usable: Mediator ACTIVE, MediationRoom OPERATIONAL"
    error_id: ERR_REFERENCED_ENTITY_INACTIVE
    http_status: 422
    applies_to: "session create"
  - priority: 10
    category: business_temporal
    check: "clock rules: session starts_at > now; settlement execute requires now >= cooling_off_until; rescind requires now < cooling_off_until; mark-breached requires now > due_date"
    error_id: "ERR_SESSION_IN_PAST / ERR_COOLING_OFF_ACTIVE / ERR_RESCISSION_WINDOW_EXPIRED / ERR_BREACH_NOT_DUE"
    http_status: 422
    applies_to: "session create, settlement execute, offer rescind, settlement mark-breached"
  - priority: 11
    category: business_fiscal
    check: "payment amount must not exceed total open outstanding across the business's eligible settlements at mark-received"
    error_id: ERR_RESTITUTION_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "restitution mark-received"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/consumer-protection/_clock/set_current_utc"
    description: "Set the server's logical clock. Default at startup is exactly 2026-08-01T00:00:00Z (never wall-clock). On each set, the system sweeps in order: (1) BUSINESS_NOTIFIED complaints with now > response_deadline -> RESPONSE_OVERDUE (ever_response_overdue=true, Business.overdue_response_count += 1); (2) TENDERED offers with now > expires_at -> EXPIRED; (3) EMBARGOED complaints with now >= closed_at + 10 days -> PUBLISHED (Business published count + rating recompute). Complaints processed in (filed_at ASC, filing_seq ASC) order."
    roles: [UnitDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["ordered sweep per description; ComplaintEvents written for each transition"]

  # --- Registrations ---
  - method: POST
    path: "/consumer-protection/consumers"
    description: "Register a Consumer (self-service)"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, state_code, "phone?"]
    output: Consumer
    side_effects: ["ERR_UNIQUENESS_VIOLATION on duplicate email"]
  - method: GET
    path: "/consumer-protection/consumers/{consumerId}"
    description: "Get a Consumer"
    roles: [Consumer, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: Consumer
    side_effects: []
  - method: POST
    path: "/consumer-protection/businesses"
    description: "Register a Business"
    roles: [Anonymous]
    code: 201
    input: [legal_name, home_state, operates_in_states, naics_code, "dba_name?", "size_tier?", "rating_method?"]
    output: Business
    side_effects: ["ERR_UNIQUENESS_VIOLATION on duplicate (legal_name, home_state); computed fields initialized: watch CLEAR, pattern_score 0, rating 100/A, next_filing_seq 1"]
  - method: GET
    path: "/consumer-protection/businesses"
    description: "List businesses (public directory); pagination envelope"
    roles: [Anonymous, Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: Business[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/businesses/{businessId}"
    description: "Get a Business"
    roles: [Anonymous, Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: Business
    side_effects: []
  - method: POST
    path: "/consumer-protection/businesses/{businessId}/rating-method"
    description: "Switch rating_method (LIFETIME <-> ROLLING_12M) and recompute rating fields in the same request"
    roles: [UnitDirector]
    code: 200
    input: [rating_method]
    output: Business
    side_effects: ["rating_score/rating_tier recomputed under the new variant"]
  - method: GET
    path: "/consumer-protection/businesses/{businessId}/rating"
    description: "Computed read: current rating view"
    roles: [Anonymous, Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: "{ rating_score: integer, rating_tier: string, rating_method: string, published_complaint_count: integer, pattern_score: integer, watch_status: string }"
    side_effects: []
  - method: GET
    path: "/consumer-protection/businesses/{businessId}/complaint-statistics"
    description: "Computed read: published-complaint statistics (publication_stats_calc)"
    roles: [Anonymous, Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: "{ published_total: integer, settled_count: integer, unresolved_count: integer, referred_count: integer, average_days_to_close: integer }"
    side_effects: []

  # --- Mediators & rooms ---
  - method: POST
    path: "/consumer-protection/mediators"
    description: "Register a Mediator"
    roles: [UnitDirector]
    code: 201
    input: [full_name, employee_ref, "max_concurrent_cases?", "conflicted_business_ids?"]
    output: Mediator
    side_effects: ["ERR_UNIQUENESS_VIOLATION on duplicate employee_ref"]
  - method: GET
    path: "/consumer-protection/mediators/{mediatorId}"
    description: "Get a Mediator"
    roles: [Mediator, IntakeOfficer, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: Mediator
    side_effects: []
  - method: POST
    path: "/consumer-protection/mediators/{mediatorId}/deactivate"
    description: "Mediator ACTIVE -> INACTIVE"
    roles: [UnitDirector]
    code: 200
    input: []
    output: Mediator
    side_effects: []
  - method: GET
    path: "/consumer-protection/mediation-rooms"
    description: "List mediation rooms"
    roles: [Mediator, IntakeOfficer, UnitDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: MediationRoom[]
    side_effects: []
  - method: POST
    path: "/consumer-protection/mediation-rooms"
    description: "Register a MediationRoom"
    roles: [UnitDirector]
    code: 201
    input: [room_name, capacity, location]
    output: MediationRoom
    side_effects: ["ERR_UNIQUENESS_VIOLATION on duplicate room_name"]
  - method: GET
    path: "/consumer-protection/mediation-rooms/{roomId}"
    description: "Get a MediationRoom"
    roles: [Mediator, IntakeOfficer, UnitDirector]
    code: 200
    input: []
    output: MediationRoom
    side_effects: []
  - method: POST
    path: "/consumer-protection/mediation-rooms/{roomId}/take-out-of-service"
    description: "Room OPERATIONAL -> OUT_OF_SERVICE"
    roles: [UnitDirector]
    code: 200
    input: []
    output: MediationRoom
    side_effects: []

  # --- Complaints ---
  - method: POST
    path: "/consumer-protection/complaints"
    description: "File a complaint. Runs filing_window_check (ERR_FILING_WINDOW_EXPIRED when (filed_at - incident_date).days > 365), duplicate check, computes jurisdiction_factors and filing_seq."
    roles: [Consumer]
    code: 201
    input: [consumer_id, business_id, incident_date, incident_state, category, description, amount_in_dispute_cents, "publication_consent?"]
    output: Complaint
    side_effects:
      - "filing_seq = Business.next_filing_seq; Business.next_filing_seq += 1"
      - "filed_at = logical clock; case_status RECEIVED; publication_status UNPUBLISHED"
      - "jurisdiction_factors computed {incident_in_state: incident_state=='OR', business_operates_in_state: 'OR' in business.operates_in_states, within_filing_window}"
      - "ComplaintEvent CREATED"
  - method: GET
    path: "/consumer-protection/complaints"
    description: "List complaints; Consumer/Business callers are restricted to their own (consumer_id/business_id filter must equal their id, else ERR_NOT_RESOURCE_OWNER); pagination envelope"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["consumer_id?", "business_id?", "case_status?", "publication_status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/complaints/{complaintId}"
    description: "Get a Complaint; Consumer/Business callers must own it"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/screen"
    description: "Jurisdiction/authority determination: RECEIVED -> ACCEPTED (decision=ACCEPT, jurisdiction enforced) or -> DECLINED (decision=DECLINE with decline_reason)"
    roles: [IntakeOfficer]
    code: 200
    input: [decision, "decline_reason?"]
    output: Complaint
    side_effects: ["ACCEPT stamps accepted_by_officer_id; DECLINE stamps decline_reason + closed_at"]
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/appeal"
    description: "Consumer appeal: DECLINED -> RECEIVED, once per complaint, not after WITHDRAWN"
    roles: [Consumer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["appeal_used = true; closed_at = null; decline_reason = null"]
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/withdraw"
    description: "Consumer withdraws before screening: RECEIVED -> DECLINED (WITHDRAWN)"
    roles: [Consumer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["decline_reason = WITHDRAWN; closed_at = now"]
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/notify-business"
    description: "ACCEPTED -> BUSINESS_NOTIFIED; computes response_deadline"
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["response_deadline per response_deadline_calc; ComplaintEvent STATE_CHANGED"]
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/business-responses"
    description: "Business submits a response; complaint BUSINESS_NOTIFIED|RESPONSE_OVERDUE -> RESPONSE_RECEIVED; creates BusinessResponse (is_late computed)"
    roles: [Business]
    code: 201
    input: [response_text]
    output: BusinessResponse
    side_effects: ["complaint transition + response_attempts increment per state machine; ERR_RESUBMISSION_CAP_REACHED at 3 attempts"]
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/offer-mediation"
    description: "RESPONSE_RECEIVED (latest response SUFFICIENT) or RESPONSE_OVERDUE -> MEDIATION_OFFERED; blocked when Business FLAGGED"
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["ERR_PATTERN_REFERRAL_REQUIRED when Business.watch_status == FLAGGED"]
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/close-unresolved"
    description: "Close without resolution; records alternative options; segregation of duties vs accepted_by_officer_id"
    roles: [IntakeOfficer]
    code: 200
    input: [alternative_options, closure_summary]
    output: Complaint
    side_effects: ["case CLOSED_UNRESOLVED; closed_at; publication axis EMBARGOED or SUPPRESSED; pattern recompute"]
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/retract-publication"
    description: "Consumer retracts a published complaint: PUBLISHED -> REDACTED; business stats/rating recomputed"
    roles: [Consumer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["Business.published_complaint_count -= 1; rating recompute"]
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/refer-enforcement"
    description: "Refer to enforcement (pattern violations); creates EnforcementReferral; complaint -> REFERRED_ENFORCEMENT"
    roles: [IntakeOfficer, Mediator, UnitDirector]
    code: 201
    input: [reason]
    output: EnforcementReferral
    side_effects: ["referral PENDING_REVIEW with pattern_score_at_referral snapshot; complaint closure side effects (closed_at, publication axis, pattern recompute)"]

  # --- Business responses ---
  - method: GET
    path: "/consumer-protection/business-responses"
    description: "List business responses (FK reverse-reachability)"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["complaint_id?", "business_id?", "limit?", "offset?"]
    output: BusinessResponse[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/business-responses/{responseId}"
    description: "Get a BusinessResponse"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: BusinessResponse
    side_effects: []
  - method: POST
    path: "/consumer-protection/business-responses/{responseId}/review"
    description: "Intake review: SUBMITTED -> SUFFICIENT | INSUFFICIENT_RETURNED (latter reverts complaint to BUSINESS_NOTIFIED)"
    roles: [IntakeOfficer]
    code: 200
    input: [verdict]
    output: BusinessResponse
    side_effects: ["verdict=INSUFFICIENT triggers complaint RESPONSE_RECEIVED -> BUSINESS_NOTIFIED"]

  # --- Mediation sessions ---
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/mediation-sessions"
    description: "Propose a session. Gates: complaint in {MEDIATION_OFFERED, MEDIATION_ACTIVE, MEDIATION_IMPASSE}; caller Mediator with mediator_id == X-User-ID; mediator ACTIVE, not conflicted with the complaint's business, caseload < cap; room OPERATIONAL; starts_at > now; mediator buffer conflict rule (half-open intervals + 30-minute turnover: conflict iff starts_at < existing.ends_at + 30m AND existing.starts_at < ends_at + 30m over own sessions in {PROPOSED, CONFIRMED}); room closed-interval rule (conflict iff starts_at <= existing.ends_at AND existing.starts_at <= ends_at; sharing the exact boundary instant conflicts; no buffer) over room sessions in {PROPOSED, CONFIRMED}."
    roles: [Mediator]
    code: 201
    input: [mediator_id, room_id, starts_at, ends_at]
    output: MediationSession
    side_effects: ["Mediator.active_case_count += 1; ComplaintEvent SESSION_SCHEDULED"]
  - method: GET
    path: "/consumer-protection/mediation-sessions"
    description: "List mediation sessions (FK reverse-reachability)"
    roles: [Consumer, Business, Mediator, IntakeOfficer, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["complaint_id?", "mediator_id?", "room_id?", "limit?", "offset?"]
    output: MediationSession[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/mediation-sessions/{sessionId}"
    description: "Get a MediationSession"
    roles: [Consumer, Business, Mediator, IntakeOfficer, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: MediationSession
    side_effects: []
  - method: POST
    path: "/consumer-protection/mediation-sessions/{sessionId}/confirm"
    description: "Party confirmation; each party sets only its own flag; both flags -> CONFIRMED and complaint advances to MEDIATION_ACTIVE"
    roles: [Consumer, Business]
    code: 200
    input: []
    output: MediationSession
    side_effects: ["on second confirmation: session CONFIRMED; complaint MEDIATION_OFFERED|MEDIATION_IMPASSE -> MEDIATION_ACTIVE; ComplaintEvent SESSION_CONFIRMED"]
  - method: POST
    path: "/consumer-protection/mediation-sessions/{sessionId}/decline"
    description: "Either party declines a PROPOSED session"
    roles: [Consumer, Business]
    code: 200
    input: []
    output: MediationSession
    side_effects: ["Mediator.active_case_count -= 1"]
  - method: POST
    path: "/consumer-protection/mediation-sessions/{sessionId}/cancel"
    description: "Mediator (owner) or UnitDirector cancels a PROPOSED/CONFIRMED session"
    roles: [Mediator, UnitDirector]
    code: 200
    input: []
    output: MediationSession
    side_effects: ["Mediator.active_case_count -= 1"]
  - method: POST
    path: "/consumer-protection/mediation-sessions/{sessionId}/complete"
    description: "Owning mediator completes a CONFIRMED session (now >= starts_at); outcome IMPASSE drives complaint to MEDIATION_IMPASSE; omit outcome with no_show=true for NO_SHOW"
    roles: [Mediator]
    code: 200
    input: ["outcome?", "no_show?"]
    output: MediationSession
    side_effects: ["Mediator.active_case_count -= 1; outcome=IMPASSE -> complaint MEDIATION_ACTIVE -> MEDIATION_IMPASSE"]

  # --- Settlement offers ---
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/settlement-offers"
    description: "Tender an offer (OCC on complaint). Complaint must be MEDIATION_ACTIVE or MEDIATION_IMPASSE. Supersedes the complaint's currently TENDERED offer (old -> SUPERSEDED, becomes parent_offer_id)."
    roles: [Consumer, Business]
    code: 201
    input: [offered_by_role, restitution_amount_cents, expected_complaint_version, "non_monetary_terms?"]
    output: SettlementOffer
    side_effects:
      - "increments Complaint.version by 1"
      - "existing TENDERED offer -> SUPERSEDED; parent_offer_id set; offer_seq = previous + 1"
      - "tendered_at = now; expires_at = now + 14 days"
      - "ComplaintEvent OFFER_TENDERED"
  - method: GET
    path: "/consumer-protection/settlement-offers"
    description: "List settlement offers (FK reverse-reachability)"
    roles: [Consumer, Business, Mediator, IntakeOfficer, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["complaint_id?", "parent_offer_id?", "offer_status?", "limit?", "offset?"]
    output: SettlementOffer[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/settlement-offers/{offerId}"
    description: "Get a SettlementOffer"
    roles: [Consumer, Business, Mediator, IntakeOfficer, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: []
  - method: POST
    path: "/consumer-protection/settlement-offers/{offerId}/accept"
    description: "Counter-party accepts a TENDERED offer; sets accepted_at and cooling_off_until (+72h)"
    roles: [Consumer, Business]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: ["ComplaintEvent OFFER_ACCEPTED"]
  - method: POST
    path: "/consumer-protection/settlement-offers/{offerId}/reject"
    description: "Counter-party rejects a TENDERED offer"
    roles: [Consumer, Business]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: []
  - method: POST
    path: "/consumer-protection/settlement-offers/{offerId}/withdraw"
    description: "Tendering party withdraws its own TENDERED offer"
    roles: [Consumer, Business]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: []
  - method: POST
    path: "/consumer-protection/settlement-offers/{offerId}/rescind"
    description: "Consumer rescinds an ACCEPTED offer within cooling-off (now < cooling_off_until); voids sourced DRAFT settlement"
    roles: [Consumer]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: ["sourced DRAFT settlement -> SUPERSEDED with outstanding written to 0; ComplaintEvent OFFER_RESCINDED"]

  # --- Settlements ---
  - method: POST
    path: "/consumer-protection/complaints/{complaintId}/settlements"
    description: "Mediator documents the latest ACCEPTED (non-rescinded) offer as a Settlement (OCC on complaint). Selector: the ACCEPTED offer with the highest offer_seq on this complaint. Computes mediation_fee_cents and total_due_cents per settlement_fee_calc; supersedes existing DRAFT/EXECUTED/BREACHED settlement."
    roles: [Mediator]
    code: 201
    input: [expected_complaint_version]
    output: Settlement
    side_effects:
      - "increments Complaint.version by 1"
      - "restitution_amount_cents copied from source offer; fee/total computed"
      - "existing settlement in {DRAFT, EXECUTED, BREACHED} -> SUPERSEDED (outstanding written to 0)"
      - "complaint.active_settlement_id = new settlement"
      - "ComplaintEvent SETTLEMENT_CREATED"
  - method: GET
    path: "/consumer-protection/settlements"
    description: "List settlements (FK reverse-reachability)"
    roles: [Consumer, Business, Mediator, IntakeOfficer, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["complaint_id?", "business_id?", "consumer_id?", "source_offer_id?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/settlements/{settlementId}"
    description: "Get a Settlement"
    roles: [Consumer, Business, Mediator, IntakeOfficer, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: POST
    path: "/consumer-protection/settlements/{settlementId}/execute"
    description: "DRAFT -> EXECUTED after cooling-off; stamps executed_at and due_date (+30d); complaint -> SETTLEMENT_PENDING (or SETTLED directly when restitution == 0)"
    roles: [Mediator]
    code: 200
    input: []
    output: Settlement
    side_effects: ["complaint transition per state machine; ComplaintEvent SETTLEMENT_EXECUTED"]
  - method: POST
    path: "/consumer-protection/settlements/{settlementId}/mark-breached"
    description: "EXECUTED -> BREACHED when now > due_date and outstanding_cents > 0; complaint returns to MEDIATION_IMPASSE"
    roles: [IntakeOfficer, UnitDirector]
    code: 200
    input: []
    output: Settlement
    side_effects: ["complaint SETTLEMENT_PENDING -> MEDIATION_IMPASSE; ComplaintEvent SETTLEMENT_BREACHED"]

  # --- Restitution payments ---
  - method: POST
    path: "/consumer-protection/businesses/{businessId}/restitution-payments"
    description: "Business pledges a lump-sum restitution payment (PLEDGED); allocation_method fixed here"
    roles: [Business]
    code: 201
    input: [business_id, amount_cents, "allocation_method?"]
    output: RestitutionPayment
    side_effects: ["ERR_INVALID_AMOUNT when amount_cents <= 0"]
  - method: GET
    path: "/consumer-protection/restitution-payments"
    description: "List restitution payments (FK reverse-reachability)"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["business_id?", "limit?", "offset?"]
    output: RestitutionPayment[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/restitution-payments/{paymentId}"
    description: "Get a RestitutionPayment"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: RestitutionPayment
    side_effects: []
  - method: POST
    path: "/consumer-protection/restitution-payments/{paymentId}/mark-received"
    description: "PLEDGED -> ALLOCATED; runs restitution_allocation_calc; fiscal gate ERR_RESTITUTION_EXCEEDS_OUTSTANDING"
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: RestitutionPayment
    side_effects: ["allocation cascade per state machine (settlements -> FULFILLED -> complaints SETTLED -> publication embargo)"]
  - method: POST
    path: "/consumer-protection/restitution-payments/{paymentId}/mark-returned"
    description: "ALLOCATED -> RETURNED; reverses allocations (compensating action); blocked when any affected complaint is SETTLED"
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: RestitutionPayment
    side_effects: ["fulfilled/outstanding restored; FULFILLED settlements revert to EXECUTED"]
  - method: POST
    path: "/consumer-protection/restitution-payments/{paymentId}/disburse"
    description: "ALLOCATED -> DISBURSED; writes consumer notification events"
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: RestitutionPayment
    side_effects: ["ComplaintEvent PAYMENT_DISBURSED per allocated complaint"]

  # --- Enforcement referrals ---
  - method: GET
    path: "/consumer-protection/enforcement-referrals"
    description: "List enforcement referrals (FK reverse-reachability)"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["complaint_id?", "business_id?", "referral_status?", "limit?", "offset?"]
    output: EnforcementReferral[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/enforcement-referrals/{referralId}"
    description: "Get an EnforcementReferral"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: EnforcementReferral
    side_effects: []
  - method: POST
    path: "/consumer-protection/enforcement-referrals/{referralId}/review"
    description: "Enforcement review: ACCEPT (case stays with enforcement) or RETURN (case returns to mediation, closure reverted)"
    roles: [EnforcementAttorney]
    code: 200
    input: [decision]
    output: EnforcementReferral
    side_effects: ["RETURN: complaint -> MEDIATION_IMPASSE, closed_at null, publication EMBARGOED -> UNPUBLISHED, pattern recompute"]

  # --- Scam alerts ---
  - method: POST
    path: "/consumer-protection/scam-alerts"
    description: "Draft a scam alert (public education)"
    roles: [IntakeOfficer, UnitDirector]
    code: 201
    input: [title, body, scam_category, severity, "related_business_id?", "related_complaint_id?", "education_topics?"]
    output: ScamAlert
    side_effects: ["drafted_by_user_id = X-User-ID"]
  - method: GET
    path: "/consumer-protection/scam-alerts"
    description: "List scam alerts (public education feed)"
    roles: [Anonymous, Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["related_business_id?", "related_complaint_id?", "alert_status?", "limit?", "offset?"]
    output: ScamAlert[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/scam-alerts/{alertId}"
    description: "Get a ScamAlert"
    roles: [Anonymous, Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: ScamAlert
    side_effects: []
  - method: POST
    path: "/consumer-protection/scam-alerts/{alertId}/publish"
    description: "Publish a DRAFT alert; publisher != drafter; no duplicate active (title, related_business_id)"
    roles: [UnitDirector]
    code: 200
    input: []
    output: ScamAlert
    side_effects: ["published_at = now"]
  - method: POST
    path: "/consumer-protection/scam-alerts/{alertId}/archive"
    description: "PUBLISHED -> ARCHIVED"
    roles: [UnitDirector]
    code: 200
    input: []
    output: ScamAlert
    side_effects: []

  # --- Audit events ---
  - method: GET
    path: "/consumer-protection/complaint-events"
    description: "Append-only audit trail per complaint (FK reverse-reachability)"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: ["complaint_id?", "limit?", "offset?"]
    output: ComplaintEvent[]
    side_effects: []
  - method: GET
    path: "/consumer-protection/complaint-events/{eventId}"
    description: "Get a single ComplaintEvent"
    roles: [Consumer, Business, IntakeOfficer, Mediator, EnforcementAttorney, UnitDirector]
    code: 200
    input: []
    output: ComplaintEvent
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource (consumer/business/mediator scoping, counter-party checks, list filter mismatch)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum member, or ends_at <= starts_at" }
  - { id: ERR_INVALID_AMOUNT, http: 400, condition: "amount_cents <= 0 on payment pledge; restitution_amount_cents < 0 on offer" }
  - { id: ERR_CONSUMER_NOT_FOUND, http: 404, condition: "consumerId / consumer_id does not resolve" }
  - { id: ERR_BUSINESS_NOT_FOUND, http: 404, condition: "businessId / business_id does not resolve" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "complaintId does not resolve" }
  - { id: ERR_MEDIATOR_NOT_FOUND, http: 404, condition: "mediatorId / mediator_id does not resolve" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "roomId / room_id does not resolve" }
  - { id: ERR_RESPONSE_NOT_FOUND, http: 404, condition: "responseId does not resolve" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "sessionId does not resolve" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "offerId does not resolve" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlementId does not resolve" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "paymentId does not resolve" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "referralId does not resolve" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "alertId does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition (incl. terminal lockdown, review of non-latest response, mark-returned with SETTLED complainant, rescind with executed settlement)" }
  - { id: ERR_DUPLICATE_COMPLAINT, http: 409, condition: "Same (consumer_id, business_id, incident_date, category) as an existing complaint whose case_status != DECLINED" }
  - { id: ERR_UNIQUENESS_VIOLATION, http: 409, condition: "Duplicate consumer email, business (legal_name, home_state), mediator employee_ref, or room_name" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_complaint_version does not match current Complaint.version (OCC on offer/settlement creation)" }
  - { id: ERR_MEDIATOR_TIME_CONFLICT, http: 409, condition: "Mediator calendar conflict under half-open + 30-minute buffer rule over sessions in {PROPOSED, CONFIRMED}" }
  - { id: ERR_ROOM_TIME_CONFLICT, http: 409, condition: "Room conflict under closed-interval rule (shared boundary instant counts as conflict; no buffer) over sessions in {PROPOSED, CONFIRMED}" }
  - { id: ERR_MEDIATOR_CASELOAD_FULL, http: 409, condition: "Mediator.active_case_count >= max_concurrent_cases at session creation" }
  - { id: ERR_DUPLICATE_ACTIVE_ALERT, http: 409, condition: "Another ScamAlert with same (title, related_business_id) in {DRAFT, PUBLISHED} at publish time" }
  - { id: ERR_FILING_WINDOW_EXPIRED, http: 422, condition: "(filed_at - incident_date).days > 365 at complaint creation" }
  - { id: ERR_NO_JURISDICTION, http: 422, condition: "screen decision=ACCEPT while incident_state != 'OR' AND 'OR' not in business.operates_in_states" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same X-User-ID on both sides of a duty pair: complaint acceptor vs closer; referral referrer vs reviewer; alert drafter vs publisher" }
  - { id: ERR_PATTERN_REFERRAL_REQUIRED, http: 422, condition: "offer-mediation attempted while Business.watch_status == FLAGGED (pattern_score >= 100)" }
  - { id: ERR_MEDIATOR_CONFLICT_OF_INTEREST, http: 422, condition: "Complaint's business_id is in mediator.conflicted_business_ids" }
  - { id: ERR_REFERENCED_ENTITY_INACTIVE, http: 422, condition: "Session references an INACTIVE mediator or OUT_OF_SERVICE room" }
  - { id: ERR_RESUBMISSION_CAP_REACHED, http: 422, condition: "Business response attempted when complaint.response_attempts == 3" }
  - { id: ERR_APPEAL_ALREADY_USED, http: 422, condition: "Second appeal on a complaint" }
  - { id: ERR_SESSION_IN_PAST, http: 422, condition: "starts_at <= current logical time at session creation" }
  - { id: ERR_COOLING_OFF_ACTIVE, http: 422, condition: "Settlement execute while now < source offer cooling_off_until" }
  - { id: ERR_RESCISSION_WINDOW_EXPIRED, http: 422, condition: "Rescind attempted when now >= cooling_off_until" }
  - { id: ERR_BREACH_NOT_DUE, http: 422, condition: "mark-breached while now <= due_date OR outstanding_cents == 0" }
  - { id: ERR_RESTITUTION_EXCEEDS_OUTSTANDING, http: 422, condition: "mark-received amount exceeds total open outstanding across the business's eligible settlements; payment stays PLEDGED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; registration and public education/statistics only"
    identity: opaque
    exclusive_operations:
      - "POST /consumer-protection/consumers"
      - "POST /consumer-protection/businesses"
    shared_operations:
      - "GET businesses, business rating, complaint statistics, scam alerts (public reads)"
  - name: Consumer
    description: "Complainant; files and drives the consumer side of mediation"
    identity: "entity_backed:Consumer"
    exclusive_operations:
      - "POST /consumer-protection/complaints"
      - "POST /consumer-protection/complaints/{id}/appeal"
      - "POST /consumer-protection/complaints/{id}/withdraw"
      - "POST /consumer-protection/complaints/{id}/retract-publication"
      - "POST /consumer-protection/settlement-offers/{id}/rescind"
    shared_operations:
      - "session confirm/decline, offer tender/accept/reject/withdraw (own complaints only)"
      - "read own complaints, responses, sessions, offers, settlements, payments, referrals, events"
  - name: Business
    description: "Respondent business; responds, mediates, tenders offers, pledges restitution"
    identity: "entity_backed:Business"
    exclusive_operations:
      - "POST /consumer-protection/complaints/{id}/business-responses"
      - "POST /consumer-protection/businesses/{id}/restitution-payments"
    shared_operations:
      - "session confirm/decline, offer tender/accept/reject/withdraw (complaints against it only)"
      - "read complaints against it and related resources"
  - name: IntakeOfficer
    description: "Unit intake staff; screens jurisdiction, manages deadlines and responses, records payments, closes cases, drafts alerts"
    identity: opaque
    exclusive_operations:
      - "POST /consumer-protection/complaints/{id}/screen"
      - "POST /consumer-protection/complaints/{id}/notify-business"
      - "POST /consumer-protection/complaints/{id}/offer-mediation"
      - "POST /consumer-protection/complaints/{id}/close-unresolved"
      - "POST /consumer-protection/business-responses/{id}/review"
      - "restitution mark-received / mark-returned / disburse"
    shared_operations:
      - "refer-enforcement, scam-alert drafting, staff reads"
  - name: Mediator
    description: "Neutral mediator; schedules and completes sessions, documents settlements"
    identity: "entity_backed:Mediator"
    exclusive_operations:
      - "POST /consumer-protection/complaints/{id}/mediation-sessions"
      - "POST /consumer-protection/mediation-sessions/{id}/complete"
      - "POST /consumer-protection/complaints/{id}/settlements"
      - "POST /consumer-protection/settlements/{id}/execute"
    shared_operations:
      - "session cancel (own sessions), refer-enforcement, staff reads"
  - name: EnforcementAttorney
    description: "Enforcement division reviewer; decides referrals; segregation of duties vs referrer"
    identity: opaque
    exclusive_operations:
      - "POST /consumer-protection/enforcement-referrals/{id}/review"
    shared_operations:
      - "staff reads"
  - name: UnitDirector
    description: "Unit leadership; administers mediators/rooms, switches rating method, publishes alerts, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /consumer-protection/_clock/set_current_utc"
      - "mediator register/deactivate; room register/take-out-of-service"
      - "POST /consumer-protection/businesses/{id}/rating-method"
      - "scam-alert publish/archive"
      - "settlement mark-breached"
    shared_operations:
      - "refer-enforcement, session cancel, staff reads"
