              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "GBR", end_use: "CIVILIAN", quantity: 1 }
              as: TradeOpsSpecialist
              captures: { det: $.data.provisional_determination }
          assert:
            - "det == \"LICENSE_REQUIRED\""

      - name: ear99_military_end_use_requires_license
        claim_type: correct_result
        grounds: [calculations.license_determination]
        distinguishing_aspect: "EAR99 normally escapes licensing, but MILITARY end_use flips the determination to LICENSE_REQUIRED."
        test_recipe:
          setup: ["EAR99 CLASSIFIED product; clean party"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-023", name: "Bolt Mil", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Fort Defense LLC", country_code: "POL", city: "Warsaw", party_type: "END_USER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
          trigger:
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "POL", end_use: "MILITARY", quantity: 1 }
              as: TradeOpsSpecialist
              captures: { det: $.data.provisional_determination }
          assert:
            - "det == \"LICENSE_REQUIRED\""

      - name: surcharge_high_tier_at_exact_boundary
        claim_type: threshold_boundary
        grounds: [calculations.order_total_value]
        distinguishing_aspect: "goods_value_cents exactly 100000 takes the HIGH tier (>= boundary): surcharge round(100000*0.035)=3500, total 103500."
        test_recipe:
          setup: ["EAR99 product unit 25000 CLASSIFIED; clean party"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-024", name: "Press", controlled_content_pct: 0, unit_value_cents: 25000 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
