      - name: lab_capacity_third_allowed_fourth_rejected
        claim_type: boundary_edge
        grounds:
          - calculations.lab_overlap_and_capacity_check
          - errors.ERR_LAB_CAPACITY_EXCEEDED
        distinguishing_aspect: "Aggregate capacity boundary: the manufacturer's 3rd concurrent LAB_TESTING model is allowed (capacity is >= 3, not > 3); the 4th fails with ERR_LAB_CAPACITY_EXCEEDED even on a free bench."
        test_recipe:
          setup:
            - "Manufacturer M with four SUBMITTED models M1..M4; M1..M3 each booked onto distinct benches (B1..B3) with disjoint windows."
          setup_api_calls:
