# =============================================================================
# CERT Training Program — benchmark seed tables (v1)
# Difficulty target: BEYOND Expert (§0.4 Expert band deliberately exceeded on
# endpoint/error surface; density is carried by cross-entity coupling, not volume)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2164. Community Emergency Response Team Training Program (local CERT program): cohort recruitment & course scheduling, curriculum module completion & skills demonstration, graduation & credential/ID issuance, refresher training requirement & currency tracking, activation roster & call-out procedure, equipment/backpack issuance & inventory, exercise participation & after-action learning, coordination with emergency management

domain_name: cert-training-program
api_prefix: "/"

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # graph: three junction entities (ModuleCompletion, ExerciseParticipation,
  # RosterAssignment) realise many-to-many edges; CurriculumModule is
  # self-referential through prerequisite_module_id; ClassSession is a
  # 4-way cross-aggregate join (Cohort x CurriculumModule x Facility x Instructor).

  state_machine_shape: cyclic
  # Credential cycles ACTIVE -> GRACE -> EXPIRED -> ACTIVE (reinstatement) and
  # ACTIVE -> SUSPENDED -> ACTIVE; ModuleCompletion cycles
  # SKILLS_PENDING -> FAILED -> SKILLS_PENDING (bounded retake loop);
  # Trainee carries TWO parallel state dimensions (enrollment_status x
  # currency_status) that advance independently; Cohort reverts
  # GRADUATION_REVIEW -> IN_SESSION on evidence withdrawal.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Two independent SoD walls: (1) the Instructor who delivered a ClassSession
  # may not sign that session's skills demonstrations; (2) the coordinator
  # user who moved a Cohort into GRADUATION_REVIEW may not mint the
  # Credentials for that cohort's trainees.

  consistency_model: immediate

  difficulty_level: beyond_expert
  entity_count: 15
  endpoint_count: 60
  error_code_count: 54
  calculation_count: 8
  state_machine_count: 11

# =============================================================================
# Table 0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Local CERT program name" }
      - { name: sponsor_agency, type: string, source: input, description: "Sponsoring emergency-management agency" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction identifier, e.g. CA-ALA-01" }
      - { name: equipment_budget_cents, type: integer, source: input, description: "Ceiling on value of equipment that may be on issue at once", constraints: "integer >= 0" }
      - { name: equipment_committed_cents, type: integer, source: computed, default: 0, description: "= SUM(EquipmentAsset.unit_value_cents) over assets referenced by an EquipmentIssuance whose status == ISSUED" }
      - { name: active_member_count, type: integer, source: computed, default: 0, description: "= COUNT(Trainee where program_id == this.id AND enrollment_status IN {ENROLLED, GRADUATED})" }
      - { name: pending_graduation_count, type: integer, source: computed, default: 0, description: "= COUNT(Cohort where program_id == this.id AND status == GRADUATION_REVIEW)" }

  - name: Cohort
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: cohort_code, type: string, source: input, description: "Human cohort label", constraints: "unique within program_id" }
      - { name: seat_capacity, type: integer, source: input, description: "Confirmed-seat ceiling", constraints: "integer >= 1" }
      - { name: seats_confirmed, type: integer, source: computed, default: 0, description: "= COUNT(Trainee where cohort_id == this.id AND enrollment_status IN {ENROLLED, GRADUATED})" }
      - { name: seats_waitlisted, type: integer, source: computed, default: 0, description: "= COUNT(Trainee where cohort_id == this.id AND enrollment_status == WAITLISTED)" }
      - { name: session_window_start, type: datetime, source: input, description: "Earliest permitted ClassSession.starts_at for this cohort (ISO 8601 UTC)" }
      - { name: session_window_end, type: datetime, source: input, description: "Latest permitted ClassSession.ends_at for this cohort (ISO 8601 UTC)" }
      - { name: delivered_contact_hours, type: number, source: computed, default: 0, description: "= SUM(CurriculumModule.contact_hours) over ClassSession rows of this cohort with status == DELIVERED; 1 decimal" }
      - { name: next_waitlist_position, type: integer, source: system, default: 1, description: "Monotone counter; assigned to the next Trainee that lands on WAITLISTED, then incremented. Never decremented." }
      - { name: graduation_reviewer_user_id, type: string, source: system, description: "Opaque X-User-ID of the ProgramCoordinator that moved this cohort into GRADUATION_REVIEW. NOT a foreign key to any entity; null before that transition." }
      - { name: status, type: enum, source: system, default: RECRUITING, description: "RECRUITING | SCHEDULED | IN_SESSION | GRADUATION_REVIEW | CLOSED | CANCELLED" }

  - name: CurriculumModule
    parent: null
    common_fields: true
    fields:
      - { name: module_code, type: string, source: input, description: "Module short code", constraints: "globally unique" }
      - { name: title, type: string, source: input, description: "Module title" }
      - { name: contact_hours, type: number, source: input, description: "Classroom hours the module is worth", constraints: "> 0, at most 1 decimal place" }
      - { name: is_core, type: boolean, source: input, default: true, description: "Core modules count toward the graduation requirement" }
      - { name: requires_skills_demo, type: boolean, source: input, default: false, description: "Completion needs an evaluator-signed skills demonstration to reach PASSED" }
      - { name: refresher_eligible, type: boolean, source: input, default: false, description: "Contact hours from this module count toward credential refresher currency" }
      - { name: sequence_index, type: integer, source: input, description: "Ordering hint within the curriculum", constraints: "integer >= 1" }
      - { name: prerequisite_module_id, type: string, source: input, description: "FK -> CurriculumModule.id; self-referential prerequisite edge; null for entry modules" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: room_code, type: string, source: input, description: "Room identifier", constraints: "globally unique" }
      - { name: capacity_seats, type: integer, source: input, description: "Physical seat count of the room", constraints: "integer >= 1" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | CLOSED" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: certification_expires_on, type: datetime, source: input, description: "Instructor teaching-certification expiry (ISO 8601 UTC)" }
      - { name: max_daily_contact_hours, type: number, source: input, default: 8, description: "Aggregate teaching hours this instructor may be booked for within one UTC calendar day", constraints: "> 0" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: ClassSession
    parent: Cohort
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id" }
      - { name: module_id, type: string, source: input, description: "FK -> CurriculumModule.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id" }
      - { name: starts_at, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: computed, description: "= starts_at + (CurriculumModule.contact_hours * 60) minutes; never client-supplied" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock instant at which the session was marked DELIVERED; null otherwise" }
      - { name: recorded_completion_count, type: integer, source: computed, default: 0, description: "= COUNT(ModuleCompletion where class_session_id == this.id AND status != VOIDED)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | DELIVERED | CANCELLED" }

  - name: Trainee
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id" }
      - { name: full_name, type: string, source: input, description: "Applicant name" }
      - { name: email, type: string, source: input, description: "Contact email", constraints: "unique within program_id" }
      - { name: deployment_hold, type: boolean, source: input, default: false, description: "Administrative bar on call-out selection; set at application time and cleared/raised by cascades" }
      - { name: enrollment_status, type: enum, source: system, default: APPLIED, description: "Dimension 1 of 2. APPLIED | WAITLISTED | ENROLLED | GRADUATED | WITHDRAWN" }
      - { name: currency_status, type: enum, source: system, default: NOT_CREDENTIALED, description: "Dimension 2 of 2, independent of enrollment_status. NOT_CREDENTIALED | CURRENT | LAPSING | LAPSED | REVOKED" }
      - { name: waitlist_position, type: integer, source: system, description: "Position stamped from Cohort.next_waitlist_position when the trainee lands on WAITLISTED; null otherwise; retained after promotion for audit" }
      - { name: earned_contact_hours, type: number, source: computed, default: 0, description: "= SUM(ModuleCompletion.credited_contact_hours) over rows with status == PASSED; 1 decimal" }
      - { name: passed_core_count, type: integer, source: computed, default: 0, description: "= COUNT(ModuleCompletion where trainee_id == this.id AND status == PASSED AND CurriculumModule.is_core == true)" }
      - { name: readiness_score, type: number, source: computed, default: 0, description: "Certified-variant readiness score, 0.00-100.00, refreshed on every completion/exercise/credential mutation touching this trainee" }
      - { name: equipment_liability_cents, type: integer, source: computed, default: 0, description: "= SUM(EquipmentIssuance.settlement_cents) over rows with status == LOST_WRITTEN_OFF" }
      - { name: last_deployed_at, type: datetime, source: system, description: "Logical-clock instant of the most recent RosterAssignment DEPLOYED transition; null if never deployed" }
      - { name: last_qualifying_activity_at, type: datetime, source: computed, description: "Latest of: any PASSED ModuleCompletion.updated_at, any CREDITED ExerciseParticipation.updated_at, any RELEASED RosterAssignment.updated_at; null if none" }

  - name: ModuleCompletion
    parent: Trainee
    common_fields: true
    fields:
      - { name: trainee_id, type: string, source: input, description: "FK -> Trainee.id" }
      - { name: class_session_id, type: string, source: input, description: "FK -> ClassSession.id" }
      - { name: module_id, type: string, source: system, description: "FK -> CurriculumModule.id; copied from the class session at creation" }
      - { name: evaluator_id, type: string, source: system, description: "FK -> Instructor.id; the SkillsEvaluator that signed the demonstration; null until then" }
      - { name: attendance_minutes, type: integer, source: input, description: "Minutes the trainee was present", constraints: "integer >= 0" }
      - { name: attendance_ratio, type: number, source: computed, description: "= attendance_minutes / (CurriculumModule.contact_hours * 60), rounded half-up to 4 decimals" }
      - { name: demo_score, type: number, source: system, description: "Skills-demonstration score 0-100 supplied by the evaluator; null until signed" }
      - { name: attempt_number, type: integer, source: system, default: 1, description: "Skills-demonstration attempt counter; incremented on each FAILED -> SKILLS_PENDING retake" }
      - { name: credited_contact_hours, type: number, source: computed, default: 0, description: "= CurriculumModule.contact_hours when status == PASSED, else 0" }
      - { name: status, type: enum, source: system, description: "RECORDED | SKILLS_PENDING | PASSED | FAILED | VOIDED" }

  - name: Credential
    parent: Trainee
    common_fields: true
    fields:
      - { name: trainee_id, type: string, source: input, description: "FK -> Trainee.id" }
      - { name: credential_number, type: string, source: system, description: "= <Cohort.cohort_code>-<4-digit issuance sequence within that cohort, ordered by issuance, starting 0001>" }
      - { name: issued_on, type: datetime, source: system, description: "Logical-clock instant of first issuance; immutable across renewals" }
      - { name: term_start_on, type: datetime, source: system, description: "Start of the CURRENT term; equals issued_on at issuance, reset to the logical clock on each renewal/reinstatement" }
      - { name: expires_on, type: datetime, source: computed, description: "= term_start_on + new_term_days (see calculation credential_renewal_terms)" }
      - { name: grace_ends_on, type: datetime, source: computed, description: "= expires_on + GRACE_PERIOD_DAYS days" }
      - { name: reinstatement_count, type: integer, source: system, default: 0, description: "Number of completed renewals/reinstatements; incremented AFTER renewal_tier is resolved" }
      - { name: renewal_tier, type: enum, source: computed, description: "STANDARD | WATCH | PROBATION — resolved from reinstatement_count as observed BEFORE the in-flight renewal increments it" }
      - { name: required_refresher_hours, type: number, source: computed, description: "Hours the trainee must accrue in the current term; derived from renewal_tier" }
      - { name: refresher_hours_in_term, type: number, source: computed, default: 0, description: "Refresher hours accrued inside [term_start_on, logical_now); 1 decimal" }
      - { name: issued_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the coordinator that minted the credential. NOT a foreign key to any entity." }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | GRACE | EXPIRED | SUSPENDED | REVOKED" }

  - name: EquipmentAsset
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: asset_tag, type: string, source: input, description: "Physical asset tag", constraints: "globally unique" }
      - { name: kit_type, type: enum, source: input, description: "BACKPACK_STANDARD | BACKPACK_ADVANCED | RADIO_KIT" }
      - { name: unit_value_cents, type: integer, source: input, description: "Replacement value in cents", constraints: "integer >= 1" }
      - { name: issue_count, type: integer, source: system, default: 0, description: "Number of times this asset has been issued; primary sort key of the issuance selector" }
      - { name: condition, type: enum, source: system, default: NEW, description: "NEW | SERVICEABLE | DAMAGED | WRITTEN_OFF" }
      - { name: status, type: enum, source: system, default: IN_STOCK, description: "IN_STOCK | ISSUED | RETIRED | LOST" }

  - name: EquipmentIssuance
    parent: Trainee
    common_fields: true
    fields:
      - { name: trainee_id, type: string, source: input, description: "FK -> Trainee.id" }
      - { name: asset_id, type: string, source: system, description: "FK -> EquipmentAsset.id; chosen by the server-side issuance selector, never client-supplied" }
      - { name: kit_type, type: enum, source: input, description: "BACKPACK_STANDARD | BACKPACK_ADVANCED | RADIO_KIT — the pool the selector draws from" }
      - { name: issued_on, type: datetime, source: system, description: "Logical-clock instant of issuance" }
      - { name: returned_on, type: datetime, source: system, description: "Logical-clock instant of return; null unless status == RETURNED" }
      - { name: lost_reported_on, type: datetime, source: system, description: "Logical-clock instant of the loss report; null unless status == LOST_WRITTEN_OFF" }
      - { name: months_held, type: integer, source: computed, description: "= floor((lost_reported_on - issued_on) in whole days / 30); null until a loss is reported" }
      - { name: residual_pct, type: number, source: computed, description: "= max(0.40, 1.00 - DEPRECIATION_PCT_PER_MONTH * months_held), 4 decimals; null until a loss is reported" }
      - { name: settlement_cents, type: integer, source: computed, default: 0, description: "Line settlement for this issuance; see calculation equipment_loss_settlement" }
      - { name: settlement_variant, type: enum, source: computed, description: "DEPRECIATED_WRITEOFF | FULL_REPLACEMENT; null until a loss is reported" }
      - { name: issued_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the logistics officer. NOT a foreign key to any entity." }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | RETURNED | LOST_WRITTEN_OFF" }

  - name: Exercise
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: title, type: string, source: input, description: "Exercise title" }
      - { name: exercise_type, type: enum, source: input, description: "TABLETOP | FUNCTIONAL | FULL_SCALE" }
      - { name: starts_at, type: datetime, source: input, description: "Exercise start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Exercise end (ISO 8601 UTC)", constraints: "must be strictly after starts_at" }
      - { name: base_credit_hours, type: number, source: input, description: "Base refresher hours a participant earns", constraints: "> 0, at most 1 decimal" }
      - { name: aar_summary, type: string, source: system, description: "After-action report body; null until the AAR is submitted" }
      - { name: accepted_participant_count, type: integer, source: computed, default: 0, description: "= COUNT(ExerciseParticipation where exercise_id == this.id AND status == CREDITED)" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | RUNNING | COMPLETED | AAR_SUBMITTED | AAR_ACCEPTED | CANCELLED" }

  - name: ExerciseParticipation
    parent: Exercise
    common_fields: true
    fields:
      - { name: exercise_id, type: string, source: input, description: "FK -> Exercise.id" }
      - { name: trainee_id, type: string, source: input, description: "FK -> Trainee.id" }
      - { name: role_played, type: enum, source: input, description: "TEAM_LEADER | SEARCH_RESCUE | MEDICAL | LOGISTICS | OBSERVER" }
      - { name: role_multiplier, type: number, source: computed, description: "TEAM_LEADER 1.50 | SEARCH_RESCUE 1.25 | MEDICAL 1.25 | LOGISTICS 1.00 | OBSERVER 0.50" }
      - { name: hours_credited, type: number, source: computed, default: 0, description: "0 until the AAR is accepted; then = round_half_up(Exercise.base_credit_hours * role_multiplier, 1)" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | CREDITED | VOIDED" }

  - name: Activation
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: incident_number, type: string, source: input, description: "Incident identifier from emergency management", constraints: "unique within program_id" }
      - { name: requesting_agency, type: string, source: input, description: "Requesting agency name" }
      - { name: severity, type: enum, source: input, description: "ROUTINE | URGENT | CRITICAL" }
      - { name: requested_responders, type: integer, source: input, description: "Responder headcount requested", constraints: "integer >= 1" }
      - { name: rostered_count, type: integer, source: computed, default: 0, description: "= COUNT(RosterAssignment where activation_id == this.id AND status IN {NOTIFIED, ACCEPTED, DEPLOYED, RELEASED})" }
      - { name: accepted_count, type: integer, source: computed, default: 0, description: "= COUNT(RosterAssignment where activation_id == this.id AND status IN {ACCEPTED, DEPLOYED, RELEASED})" }
      - { name: deployed_count, type: integer, source: computed, default: 0, description: "= COUNT(RosterAssignment where activation_id == this.id AND status IN {DEPLOYED, RELEASED})" }
      - { name: response_deadline_at, type: datetime, source: computed, description: "= roster-build instant + severity response window (see constants); null before the roster is built" }
      - { name: fill_status, type: enum, source: computed, default: UNFILLED, description: "UNFILLED when rostered_count == 0 | PARTIAL when 0 < rostered_count < requested_responders | FILLED when rostered_count >= requested_responders" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | ROSTERED | ACTIVATED | DEMOBILIZED | CANCELLED" }

  - name: RosterAssignment
    parent: Activation
    common_fields: true
    fields:
      - { name: activation_id, type: string, source: input, description: "FK -> Activation.id" }
      - { name: trainee_id, type: string, source: input, description: "FK -> Trainee.id" }
      - { name: selection_rank, type: integer, source: system, description: "1-based rank the roster selector assigned; MANUAL_ADD rows get rank = (max existing rank on the activation) + 1" }
      - { name: notified_at, type: datetime, source: system, description: "Logical-clock instant the call-out notice was stamped" }
      - { name: responded_at, type: datetime, source: system, description: "Logical-clock instant of ACCEPTED/DECLINED; null otherwise" }
      - { name: source, type: enum, source: system, description: "AUTO_ROSTER | MANUAL_ADD" }
      - { name: status, type: enum, source: system, default: NOTIFIED, description: "NOTIFIED | ACCEPTED | DECLINED | NO_RESPONSE | DEPLOYED | RELEASED | WITHDRAWN" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Cohort
    state_field: status
    initial_state: RECRUITING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: RECRUITING
        to: SCHEDULED
        trigger: "POST /cohorts/{cohortId}/advance with to_status = SCHEDULED"
        actor: ProgramCoordinator
        preconditions:
          - "Every CurriculumModule with is_core == true AND status == ACTIVE has at least one ClassSession on this cohort with status == SCHEDULED"
        side_effects: ["Cohort.seat_capacity becomes immutable for the remainder of the cohort lifecycle"]

      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /cohorts/{cohortId}/advance with to_status = IN_SESSION"
        actor: ProgramCoordinator
        preconditions: ["logical clock >= Cohort.session_window_start"]
        side_effects: []

      - from: IN_SESSION
        to: GRADUATION_REVIEW
        trigger: "POST /cohorts/{cohortId}/advance with to_status = GRADUATION_REVIEW"
        actor: ProgramCoordinator
        preconditions:
          - "Every CurriculumModule with is_core == true AND status == ACTIVE has at least one ClassSession on this cohort with status == DELIVERED"
          - "Cohort.seats_confirmed >= 1"
        side_effects:
          - "Cohort.graduation_reviewer_user_id := the request's X-User-ID"
          - "Program.pending_graduation_count += 1"

      - from: GRADUATION_REVIEW
        to: IN_SESSION
        trigger: "system — automatic revert when a ModuleCompletion void or a ClassSession cancellation leaves a core CurriculumModule without a DELIVERED ClassSession on this cohort, or drops any GRADUATED Trainee of this cohort back to ENROLLED"
        actor: system
        preconditions: []
        side_effects:
          - "Cohort.graduation_reviewer_user_id := null"
          - "Program.pending_graduation_count -= 1"
        note: "Cycle edge. Makes GRADUATION_REVIEW non-terminal and re-opens the segregation-of-duties wall on credential issuance."

      - from: GRADUATION_REVIEW
        to: CLOSED
        trigger: "POST /cohorts/{cohortId}/advance with to_status = CLOSED"
        actor: ProgramCoordinator
        preconditions:
          - "No Trainee of this cohort remains in enrollment_status ENROLLED (each is GRADUATED or WITHDRAWN)"
          - "No ModuleCompletion of this cohort's trainees is in status SKILLS_PENDING"
        side_effects: []

      - from: RECRUITING
        to: CANCELLED
        trigger: "POST /cohorts/{cohortId}/advance with to_status = CANCELLED"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Every ClassSession of this cohort with status == SCHEDULED transitions to CANCELLED"
          - "Every Trainee of this cohort with enrollment_status IN {APPLIED, WAITLISTED, ENROLLED} transitions to WITHDRAWN"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cohorts/{cohortId}/advance with to_status = CANCELLED"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Every ClassSession of this cohort with status == SCHEDULED transitions to CANCELLED"
          - "Every Trainee of this cohort with enrollment_status IN {APPLIED, WAITLISTED, ENROLLED} transitions to WITHDRAWN"

  # --- Trainee, parallel dimension 1 of 2 -----------------------------------
  - entity: Trainee
    state_field: enrollment_status
    initial_state: APPLIED
    terminal_states: [WITHDRAWN]
    note: "Dimension 1 of 2 on the SAME Trainee row. enrollment_status and currency_status advance independently: a GRADUATED trainee may be LAPSED, and a WITHDRAWN trainee may still be CURRENT until the credential is revoked."
    transitions:
      - from: APPLIED
        to: ENROLLED
        trigger: "POST /trainees/{traineeId}/enrollment with action = ENROLL, when Cohort.seats_confirmed < Cohort.seat_capacity"
        actor: ProgramCoordinator
        preconditions:
          - "Cohort.status IN {RECRUITING, SCHEDULED, IN_SESSION}"
          - "Cohort.seats_confirmed < Cohort.seat_capacity"
        side_effects:
          - "Cohort.seats_confirmed += 1"
          - "Program.active_member_count += 1"

      - from: APPLIED
        to: WAITLISTED
        trigger: "POST /trainees/{traineeId}/enrollment with action = ENROLL, when Cohort.seats_confirmed >= Cohort.seat_capacity"
        actor: ProgramCoordinator
        preconditions: ["Cohort.status IN {RECRUITING, SCHEDULED, IN_SESSION}"]
        side_effects:
          - "Trainee.waitlist_position := Cohort.next_waitlist_position"
          - "Cohort.next_waitlist_position += 1"
          - "Cohort.seats_waitlisted += 1"

      - from: WAITLISTED
        to: ENROLLED
        trigger: "system — automatic waitlist promotion fired by a Trainee ENROLLED -> WITHDRAWN release on the same cohort"
        actor: system
        preconditions: ["Cohort.seats_confirmed < Cohort.seat_capacity after the release"]
        side_effects:
          - "Cohort.seats_waitlisted -= 1"
          - "Cohort.seats_confirmed += 1"
          - "Program.active_member_count += 1"
        note: "Promotion selector: candidate set = Trainee where cohort_id == this cohort AND enrollment_status == WAITLISTED; rank by waitlist_position ASC; tie-break created_at ASC; exactly ONE trainee is promoted per release; when the candidate set is empty no promotion occurs and the seat stays free."

      - from: ENROLLED
        to: GRADUATED
        trigger: "POST /trainees/{traineeId}/enrollment with action = GRADUATE"
        actor: ProgramCoordinator
        preconditions:
          - "Cohort.status == GRADUATION_REVIEW"
          - "Trainee.passed_core_count == COUNT(CurriculumModule where is_core == true AND status == ACTIVE)"
          - "No ModuleCompletion of this trainee is in status SKILLS_PENDING"
        side_effects: ["Trainee.readiness_score recomputed with the certified variant of trainee_readiness_score"]

      - from: GRADUATED
        to: ENROLLED
        trigger: "system — automatic demotion when Trainee.passed_core_count drops below COUNT(core ACTIVE CurriculumModule) as a consequence of a ModuleCompletion void or a ClassSession cancellation"
        actor: system
        preconditions: []
        side_effects:
          - "The Trainee's Credential, if status == ACTIVE, transitions to SUSPENDED (link 3 of the completion-void cascade)"
        note: "Cycle edge. GRADUATED is therefore NOT terminal."

      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /trainees/{traineeId}/enrollment with action = WITHDRAW"
        actor: ProgramCoordinator | Trainee
        preconditions:
          - "No EquipmentIssuance of this trainee has status == ISSUED"
          - "No RosterAssignment of this trainee has status IN {NOTIFIED, ACCEPTED, DEPLOYED}"
        side_effects:
          - "Cohort.seats_confirmed -= 1"
          - "Program.active_member_count -= 1"
          - "Waitlist promotion selector runs on the cohort (see WAITLISTED -> ENROLLED)"

      - from: GRADUATED
        to: WITHDRAWN
        trigger: "POST /trainees/{traineeId}/enrollment with action = WITHDRAW"
        actor: ProgramCoordinator | Trainee
        preconditions:
          - "No EquipmentIssuance of this trainee has status == ISSUED"
          - "No RosterAssignment of this trainee has status IN {NOTIFIED, ACCEPTED, DEPLOYED}"
        side_effects:
          - "Cohort.seats_confirmed -= 1"
          - "Program.active_member_count -= 1"
          - "Waitlist promotion selector runs on the cohort"

      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /trainees/{traineeId}/enrollment with action = WITHDRAW"
        actor: ProgramCoordinator | Trainee
        preconditions: []
        side_effects: []

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /trainees/{traineeId}/enrollment with action = WITHDRAW"
        actor: ProgramCoordinator | Trainee
        preconditions: []
        side_effects: ["Cohort.seats_waitlisted -= 1"]

  # --- Trainee, parallel dimension 2 of 2 -----------------------------------
  - entity: Trainee
    state_field: currency_status
    initial_state: NOT_CREDENTIALED
    terminal_states: [REVOKED]
    note: "Dimension 2 of 2 on the SAME Trainee row. Driven entirely by the Credential machine; never advanced by an enrollment action."
    transitions:
      - from: NOT_CREDENTIALED
        to: CURRENT
        trigger: "system — automatic on Credential issuance (POST /credentials)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CURRENT
        to: LAPSING
        trigger: "system — automatic during POST /_ops/run-currency-sweep, mirroring Credential ACTIVE -> GRACE"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSING
        to: LAPSED
        trigger: "system — automatic during POST /_ops/run-currency-sweep, mirroring Credential GRACE -> EXPIRED"
        actor: system
        preconditions: []
        side_effects: []
      - from: CURRENT
        to: LAPSED
        trigger: "system — automatic when the trainee's Credential transitions ACTIVE -> SUSPENDED"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSING
        to: CURRENT
        trigger: "system — automatic on Credential GRACE -> ACTIVE renewal"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: CURRENT
        trigger: "system — automatic on Credential EXPIRED -> ACTIVE reinstatement or SUSPENDED -> ACTIVE reinstatement"
        actor: system
        preconditions: []
        side_effects: []
      - from: CURRENT
        to: REVOKED
        trigger: "system — automatic on Credential -> REVOKED"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSING
        to: REVOKED
        trigger: "system — automatic on Credential -> REVOKED"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: REVOKED
        trigger: "system — automatic on Credential -> REVOKED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Credential
    state_field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    note: "Cyclic machine: ACTIVE -> GRACE -> EXPIRED -> ACTIVE and ACTIVE -> SUSPENDED -> ACTIVE are both closed loops."
    transitions:
      - from: ACTIVE
        to: GRACE
        trigger: "system — automatic during POST /_ops/run-currency-sweep when logical clock >= Credential.expires_on and logical clock < Credential.grace_ends_on"
        actor: system
        preconditions: []
        side_effects: ["Trainee.currency_status CURRENT -> LAPSING"]

      - from: GRACE
        to: EXPIRED
        trigger: "system — automatic during POST /_ops/run-currency-sweep when logical clock >= Credential.grace_ends_on"
        actor: system
        preconditions: []
        side_effects:
          - "Trainee.currency_status LAPSING -> LAPSED"
          - "Every RosterAssignment of this trainee with status IN {NOTIFIED, ACCEPTED} whose Activation.status IN {REQUESTED, ROSTERED, ACTIVATED} transitions to WITHDRAWN"
          - "Each affected Activation recomputes rostered_count, accepted_count and fill_status"

      - from: GRACE
        to: ACTIVE
        trigger: "POST /credentials/{credentialId}/status with action = RENEW"
        actor: ProgramCoordinator
        preconditions:
          - "Trainee.enrollment_status == GRADUATED"
          - "Credential.refresher_hours_in_term >= Credential.required_refresher_hours (>= , not >)"
        side_effects:
          - "renewal_tier resolved from reinstatement_count as observed BEFORE this renewal"
          - "term_start_on := logical clock; expires_on and grace_ends_on recomputed by credential_renewal_terms"
          - "reinstatement_count += 1 (AFTER renewal_tier is resolved)"
          - "refresher_hours_in_term resets to 0 for the new term"
          - "Trainee.currency_status LAPSING -> CURRENT"
          - "Trainee.readiness_score recomputed"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /credentials/{credentialId}/status with action = RENEW"
        actor: ProgramCoordinator
        preconditions:
          - "Trainee.enrollment_status == GRADUATED"
          - "Credential.refresher_hours_in_term >= Credential.required_refresher_hours"
        side_effects:
          - "Same side-effect set as GRACE -> ACTIVE"
          - "Trainee.currency_status LAPSED -> CURRENT"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /credentials/{credentialId}/status with action = RENEW (early renewal)"
        actor: ProgramCoordinator
        preconditions:
          - "Trainee.enrollment_status == GRADUATED"
          - "Credential.refresher_hours_in_term >= Credential.required_refresher_hours"
        side_effects: ["Same side-effect set as GRACE -> ACTIVE; Trainee.currency_status stays CURRENT"]

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /credentials/{credentialId}/status with action = SUSPEND, OR system when the trainee is demoted GRADUATED -> ENROLLED"
        actor: ProgramCoordinator | system
        preconditions: []
        side_effects:
          - "Trainee.currency_status CURRENT -> LAPSED"
          - "Every RosterAssignment of this trainee with status IN {NOTIFIED, ACCEPTED} whose Activation.status IN {REQUESTED, ROSTERED, ACTIVATED} transitions to WITHDRAWN"
          - "Each affected Activation recomputes rostered_count, accepted_count and fill_status"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /credentials/{credentialId}/status with action = REINSTATE"
        actor: ProgramCoordinator
        preconditions:
          - "Trainee.enrollment_status == GRADUATED"
          - "Trainee.passed_core_count == COUNT(CurriculumModule where is_core == true AND status == ACTIVE)"
        side_effects:
          - "Trainee.currency_status LAPSED -> CURRENT"
          - "Trainee.readiness_score recomputed"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE loop. reinstatement_count is NOT incremented here; only RENEW increments it."

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /credentials/{credentialId}/status with action = REVOKE"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Trainee.currency_status -> REVOKED"
          - "Every RosterAssignment of this trainee with status IN {NOTIFIED, ACCEPTED} transitions to WITHDRAWN; each affected Activation recomputes its counts and fill_status"

      - from: GRACE
        to: REVOKED
        trigger: "POST /credentials/{credentialId}/status with action = REVOKE"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["Same as ACTIVE -> REVOKED"]

      - from: EXPIRED
        to: REVOKED
        trigger: "POST /credentials/{credentialId}/status with action = REVOKE"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["Same as ACTIVE -> REVOKED"]

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /credentials/{credentialId}/status with action = REVOKE"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["Same as ACTIVE -> REVOKED"]

  - entity: ClassSession
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /class-sessions/{sessionId}/deliver"
        actor: Instructor
        preconditions:
          - "X-User-ID == ClassSession.instructor_id"
          - "Cohort.status == IN_SESSION"
          - "logical clock >= ClassSession.starts_at"
          - "Instructor.certification_expires_on > logical clock"
        side_effects:
          - "ClassSession.delivered_at := logical clock"
          - "Cohort.delivered_contact_hours += CurriculumModule.contact_hours"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /class-sessions/{sessionId}/cancel"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["The facility and instructor interval occupied by this session is released for overlap checks"]

      - from: DELIVERED
        to: CANCELLED
        trigger: "POST /class-sessions/{sessionId}/cancel"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "LINK 1: Cohort.delivered_contact_hours -= CurriculumModule.contact_hours"
          - "LINK 2 (caused by link 1's session invalidation): every ModuleCompletion with class_session_id == this session and status IN {RECORDED, SKILLS_PENDING, PASSED, FAILED} transitions to VOIDED"
          - "LINK 3 (caused by link 2): each voided completion recomputes its Trainee.earned_contact_hours, Trainee.passed_core_count, Trainee.last_qualifying_activity_at and Trainee.readiness_score"
          - "LINK 4 (caused by link 3): if the cohort is in GRADUATION_REVIEW and this cancellation leaves a core CurriculumModule without a DELIVERED ClassSession on the cohort, the Cohort reverts GRADUATION_REVIEW -> IN_SESSION and Cohort.graduation_reviewer_user_id := null"
          - "LINK 5 (caused by link 4): Program.pending_graduation_count -= 1"
        note: "Cascade chain B. Each link is caused by the preceding link, not directly by the cancel action."

  - entity: ModuleCompletion
    state_field: status
    initial_state: RECORDED
    terminal_states: [VOIDED]
    note: "Cyclic: SKILLS_PENDING -> FAILED -> SKILLS_PENDING is a bounded retake loop capped at MAX_DEMO_ATTEMPTS."
    transitions:
      - from: RECORDED
        to: SKILLS_PENDING
        trigger: "system — automatic at creation when the session's CurriculumModule.requires_skills_demo == true"
        actor: system
        preconditions: ["ModuleCompletion.attendance_ratio >= MIN_ATTENDANCE_RATIO"]
        side_effects: []

      - from: RECORDED
        to: PASSED
        trigger: "system — automatic at creation when the session's CurriculumModule.requires_skills_demo == false"
        actor: system
        preconditions: ["ModuleCompletion.attendance_ratio >= MIN_ATTENDANCE_RATIO"]
        side_effects:
          - "ModuleCompletion.credited_contact_hours := CurriculumModule.contact_hours"
          - "Trainee.earned_contact_hours += credited_contact_hours"
          - "Trainee.passed_core_count += 1 when CurriculumModule.is_core == true"
          - "Trainee.last_qualifying_activity_at and Trainee.readiness_score recomputed"
          - "When CurriculumModule.refresher_eligible == true and the trainee has a Credential with status IN {ACTIVE, GRACE, EXPIRED, SUSPENDED}, that Credential.refresher_hours_in_term += credited_contact_hours"

      - from: SKILLS_PENDING
        to: PASSED
        trigger: "POST /module-completions/{completionId}/skills-demo with outcome = PASS"
        actor: SkillsEvaluator
        preconditions:
          - "X-User-ID != ClassSession.instructor_id (segregation of duties)"
          - "demo_score >= DEMO_PASS_SCORE"
        side_effects:
          - "ModuleCompletion.evaluator_id := X-User-ID; ModuleCompletion.demo_score := demo_score"
          - "Same ledger side-effect set as RECORDED -> PASSED"

      - from: SKILLS_PENDING
        to: FAILED
        trigger: "POST /module-completions/{completionId}/skills-demo with outcome = FAIL, or with outcome = PASS and demo_score < DEMO_PASS_SCORE"
        actor: SkillsEvaluator
        preconditions: ["X-User-ID != ClassSession.instructor_id (segregation of duties)"]
        side_effects: ["ModuleCompletion.evaluator_id := X-User-ID; ModuleCompletion.demo_score := demo_score"]

      - from: FAILED
        to: SKILLS_PENDING
        trigger: "POST /module-completions/{completionId}/skills-demo (retake) — the request first reopens the demonstration, then evaluates it within the same request"
        actor: SkillsEvaluator
        preconditions:
          - "ModuleCompletion.attempt_number < MAX_DEMO_ATTEMPTS"
          - "X-User-ID != ClassSession.instructor_id (segregation of duties)"
        side_effects:
          - "ModuleCompletion.attempt_number += 1"
          - "ModuleCompletion.evaluator_id := null and ModuleCompletion.demo_score := null before the new evaluation is applied"
        note: "Closes the SKILLS_PENDING -> FAILED -> SKILLS_PENDING loop."

      - from: PASSED
        to: VOIDED
        trigger: "POST /module-completions/{completionId}/void"
        actor: ProgramCoordinator
        preconditions: ["Cohort.status != CLOSED"]
        side_effects:
          - "LINK 1: ModuleCompletion.credited_contact_hours := 0"
          - "LINK 2 (caused by link 1): Trainee.earned_contact_hours -= the voided hours; Trainee.passed_core_count -= 1 when the module is core; Trainee.readiness_score recomputed; and when passed_core_count now falls below COUNT(core ACTIVE CurriculumModule) while enrollment_status == GRADUATED, the Trainee transitions GRADUATED -> ENROLLED"
          - "LINK 3 (caused by link 2's demotion): the trainee's Credential with status == ACTIVE transitions to SUSPENDED and Trainee.currency_status CURRENT -> LAPSED"
          - "LINK 4 (caused by link 3's suspension): every RosterAssignment of this trainee with status IN {NOTIFIED, ACCEPTED} whose Activation.status IN {REQUESTED, ROSTERED, ACTIVATED} transitions to WITHDRAWN"
          - "LINK 5 (caused by link 4): each affected Activation recomputes rostered_count, accepted_count, deployed_count and fill_status; a FILLED activation may drop to PARTIAL or UNFILLED"
          - "LINK 6 (caused by link 2's demotion): when the Cohort is in GRADUATION_REVIEW it reverts to IN_SESSION and Program.pending_graduation_count -= 1"
        note: "Cascade chain A, depth 5. Each link is caused by the preceding link."

      - from: RECORDED
        to: VOIDED
        trigger: "POST /module-completions/{completionId}/void"
        actor: ProgramCoordinator
        preconditions: ["Cohort.status != CLOSED"]
        side_effects: []

      - from: SKILLS_PENDING
        to: VOIDED
        trigger: "POST /module-completions/{completionId}/void"
        actor: ProgramCoordinator
        preconditions: ["Cohort.status != CLOSED"]
        side_effects: []

      - from: FAILED
        to: VOIDED
        trigger: "POST /module-completions/{completionId}/void"
        actor: ProgramCoordinator
        preconditions: ["Cohort.status != CLOSED"]
        side_effects: []

  - entity: Activation
    state_field: status
    initial_state: REQUESTED
    terminal_states: [DEMOBILIZED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ROSTERED
        trigger: "POST /activations/{activationId}/roster"
        actor: EmergencyManager
        preconditions:
          - "Activation.status == REQUESTED"
          - "The roster selector's candidate set is non-empty (see calculation activation_roster_selection)"
        side_effects:
          - "One RosterAssignment row per selected Trainee is created with status NOTIFIED, source AUTO_ROSTER, selection_rank 1..N in selector order, notified_at := logical clock"
          - "Activation.response_deadline_at := logical clock + RESPONSE_WINDOW_MINUTES[severity]"
          - "Activation.rostered_count and Activation.fill_status recomputed"

      - from: ROSTERED
        to: ACTIVATED
        trigger: "POST /activations/{activationId}/advance with to_status = ACTIVATED"
        actor: EmergencyManager
        preconditions: ["Activation.accepted_count >= 1"]
        side_effects: []

      - from: ACTIVATED
        to: DEMOBILIZED
        trigger: "POST /activations/{activationId}/advance with to_status = DEMOBILIZED"
        actor: EmergencyManager
        preconditions: ["No RosterAssignment of this activation has status == DEPLOYED"]
        side_effects:
          - "Every RosterAssignment with status == NOTIFIED transitions to NO_RESPONSE"
          - "Every RosterAssignment with status == ACCEPTED transitions to WITHDRAWN"
          - "Activation counts and fill_status recomputed"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /activations/{activationId}/advance with to_status = CANCELLED"
        actor: EmergencyManager
        preconditions: []
        side_effects: []

      - from: ROSTERED
        to: CANCELLED
        trigger: "POST /activations/{activationId}/advance with to_status = CANCELLED"
        actor: EmergencyManager
        preconditions: []
        side_effects:
          - "Every RosterAssignment with status IN {NOTIFIED, ACCEPTED} transitions to WITHDRAWN"
          - "Activation counts and fill_status recomputed"

  - entity: RosterAssignment
    state_field: status
    initial_state: NOTIFIED
    terminal_states: [DECLINED, NO_RESPONSE, RELEASED, WITHDRAWN]
    transitions:
      - from: NOTIFIED
        to: ACCEPTED
        trigger: "POST /roster-assignments/{assignmentId}/respond with response = ACCEPT"
        actor: Trainee
        preconditions:
          - "X-User-ID == RosterAssignment.trainee_id"
          - "Activation.status == ROSTERED"
          - "logical clock < Activation.response_deadline_at"
          - "The trainee's Credential.status IN {ACTIVE, GRACE}"
        side_effects:
          - "RosterAssignment.responded_at := logical clock"
          - "Activation.accepted_count and Activation.fill_status recomputed"

      - from: NOTIFIED
        to: DECLINED
        trigger: "POST /roster-assignments/{assignmentId}/respond with response = DECLINE"
        actor: Trainee
        preconditions:
          - "X-User-ID == RosterAssignment.trainee_id"
          - "Activation.status == ROSTERED"
          - "logical clock < Activation.response_deadline_at"
        side_effects:
          - "RosterAssignment.responded_at := logical clock"
          - "Activation.rostered_count and Activation.fill_status recomputed"

      - from: NOTIFIED
        to: NO_RESPONSE
        trigger: "system — automatic during POST /_ops/run-currency-sweep when logical clock >= Activation.response_deadline_at"
        actor: system
        preconditions: []
        side_effects: ["Activation.rostered_count and Activation.fill_status recomputed"]

      - from: ACCEPTED
        to: DEPLOYED
        trigger: "POST /roster-assignments/{assignmentId}/advance with to_status = DEPLOYED"
        actor: EmergencyManager
        preconditions: ["Activation.status == ACTIVATED"]
        side_effects:
          - "Trainee.last_deployed_at := logical clock"
          - "Activation.deployed_count recomputed"

      - from: DEPLOYED
        to: RELEASED
        trigger: "POST /roster-assignments/{assignmentId}/advance with to_status = RELEASED"
        actor: EmergencyManager
        preconditions: []
        side_effects:
          - "Trainee.last_qualifying_activity_at and Trainee.readiness_score recomputed"
          - "Activation.deployed_count recomputed"

      - from: NOTIFIED
        to: WITHDRAWN
        trigger: "system — automatic on Credential SUSPENDED/EXPIRED/REVOKED cascade, or on Activation ROSTERED -> CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["Activation.rostered_count, accepted_count and fill_status recomputed"]

      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "system — automatic on Credential SUSPENDED/EXPIRED/REVOKED cascade, on Activation ROSTERED -> CANCELLED, or on Activation ACTIVATED -> DEMOBILIZED"
        actor: system
        preconditions: []
        side_effects: ["Activation.rostered_count, accepted_count and fill_status recomputed"]

  - entity: Exercise
    state_field: status
    initial_state: PLANNED
    terminal_states: [AAR_ACCEPTED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RUNNING
        trigger: "POST /exercises/{exerciseId}/advance with to_status = RUNNING"
        actor: EmergencyManager
        preconditions:
          - "logical clock >= Exercise.starts_at"
          - "At least one ExerciseParticipation with status == REGISTERED exists"
        side_effects: []

      - from: RUNNING
        to: COMPLETED
        trigger: "POST /exercises/{exerciseId}/advance with to_status = COMPLETED"
        actor: EmergencyManager
        preconditions: ["logical clock >= Exercise.ends_at"]
        side_effects: []

      - from: COMPLETED
        to: AAR_SUBMITTED
        trigger: "POST /exercises/{exerciseId}/advance with to_status = AAR_SUBMITTED and aar_summary supplied"
        actor: EmergencyManager
        preconditions: ["aar_summary is present and at least AAR_MIN_SUMMARY_CHARS characters long"]
        side_effects: ["Exercise.aar_summary := aar_summary"]

      - from: AAR_SUBMITTED
        to: AAR_ACCEPTED
        trigger: "POST /exercises/{exerciseId}/advance with to_status = AAR_ACCEPTED"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Every ExerciseParticipation of this exercise with status == REGISTERED transitions to CREDITED with hours_credited computed by exercise_hours_credit"
          - "Each crediting adds hours_credited to that trainee's Credential.refresher_hours_in_term when the Credential's term window contains the crediting instant"
          - "Each crediting recomputes the trainee's last_qualifying_activity_at and readiness_score"
          - "Exercise.accepted_participant_count recomputed"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /exercises/{exerciseId}/advance with to_status = CANCELLED"
        actor: EmergencyManager
        preconditions: []
        side_effects: ["Every ExerciseParticipation with status == REGISTERED transitions to VOIDED"]

      - from: RUNNING
        to: CANCELLED
        trigger: "POST /exercises/{exerciseId}/advance with to_status = CANCELLED"
        actor: EmergencyManager
        preconditions: []
        side_effects: ["Every ExerciseParticipation with status == REGISTERED transitions to VOIDED"]

  - entity: ExerciseParticipation
    state_field: status
    initial_state: REGISTERED
    terminal_states: [CREDITED, VOIDED]
    transitions:
      - from: REGISTERED
        to: CREDITED
        trigger: "system — automatic on Exercise AAR_SUBMITTED -> AAR_ACCEPTED"
        actor: system
        preconditions: []
        side_effects: ["ExerciseParticipation.hours_credited := round_half_up(Exercise.base_credit_hours * role_multiplier, 1)"]
      - from: REGISTERED
        to: VOIDED
        trigger: "system — automatic on Exercise -> CANCELLED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EquipmentIssuance
    state_field: status
    initial_state: ISSUED
    terminal_states: [RETURNED, LOST_WRITTEN_OFF]
    transitions:
      - from: ISSUED
        to: RETURNED
        trigger: "POST /equipment-issuances/{issuanceId}/return"
        actor: LogisticsOfficer
        preconditions: ["EquipmentIssuance.status == ISSUED"]
        side_effects:
          - "EquipmentIssuance.returned_on := logical clock"
          - "EquipmentAsset.condition := the supplied condition (SERVICEABLE or DAMAGED)"
          - "EquipmentAsset.status := IN_STOCK when condition == SERVICEABLE, RETIRED when condition == DAMAGED"
          - "Program.equipment_committed_cents -= EquipmentAsset.unit_value_cents"

      - from: ISSUED
        to: LOST_WRITTEN_OFF
        trigger: "POST /equipment-issuances/{issuanceId}/report-lost"
        actor: LogisticsOfficer
        preconditions: ["EquipmentIssuance.status == ISSUED"]
        side_effects:
          - "EquipmentIssuance.lost_reported_on := logical clock; months_held, residual_pct, settlement_variant and settlement_cents computed by equipment_loss_settlement"
          - "EquipmentAsset.status := LOST; EquipmentAsset.condition := WRITTEN_OFF"
          - "Program.equipment_committed_cents -= EquipmentAsset.unit_value_cents"
          - "Trainee.equipment_liability_cents recomputed as the sum of settlement_cents over that trainee's LOST_WRITTEN_OFF issuances"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: issuance-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /equipment-issuances"
    occ_field: "expected_program_version"
    description: |
      Issuing a kit against a Program whose version has advanced since the client
      last observed it is rejected with a stale-version conflict. Issuing another
      kit is a legitimately repeatable operation — a second sequential request
      observes a state in which it would itself succeed — so the equipment budget
      ceiling can only be evaluated against a view of Program.equipment_committed_cents
      the client has actually seen. A request carrying a version older than the
      Program's current version is refused.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: roster-manual-add-stale-activation
    parent_entity: Activation
    write_endpoint: "POST /activations/{activationId}/roster-assignments"
    occ_field: "expected_activation_version"
    description: |
      Manually adding a responder to an Activation whose version has advanced
      since the client last observed it is rejected with a stale-version conflict.
      Adding a responder is legitimately repeatable — a second sequential request
      observes a roster that still admits another member and would succeed — so a
      client whose view of rostered_count and fill_status predates an earlier add
      is refused rather than allowed to over-fill the roster.
    error_id: ERR_STALE_ACTIVATION_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: trainee_readiness_score
    trigger: "Recomputed on every ModuleCompletion transition into or out of PASSED, on every ExerciseParticipation REGISTERED -> CREDITED, on Trainee ENROLLED -> GRADUATED, on Credential renewal/reinstatement, and on RosterAssignment DEPLOYED -> RELEASED. Also returned on demand by GET /trainees/{traineeId}/readiness."
    algorithm: weighted_scoring
    formula: |
      # --- pinned evaluation order; only step 9 rounds -----------------------
      1. core_hours_total = SUM(CurriculumModule.contact_hours
                                WHERE is_core == true AND status == ACTIVE)
      2. core_hours_earned = variant-specific (see variants below)
      3. core_ratio = 0.0 if core_hours_total == 0
                      else min(1.0, core_hours_earned / core_hours_total)
      4. demo_avg = 0.0 if the variant's demo set is empty
                    else SUM(demo scores in the set) / COUNT(the set)
      5. days_since = floor(whole days between Trainee.last_qualifying_activity_at
                            and the logical clock)
         recency_factor = 0.50                       if last_qualifying_activity_at is null
                        = 1.00 if days_since <= 90
                        = 0.90 if 90  < days_since <= 180
                        = 0.75 if 180 < days_since <= 365
                        = 0.50 if days_since > 365
      6. exercise_bonus = min(EXERCISE_BONUS_CAP,
                              EXERCISE_BONUS_PER_CREDITED
                              * COUNT(ExerciseParticipation
                                      WHERE trainee_id == this.id AND status == CREDITED))
      7. base = READINESS_CORE_WEIGHT * core_ratio
                + READINESS_DEMO_WEIGHT * (demo_avg / 100.0)
      8. raw = base * recency_factor + exercise_bonus
      9. score = round_half_up(min(100.00, max(0.00, raw)), 2)
      # Intermediate rounding at steps 3, 4, 7 or 8 is FORBIDDEN.
    input_set: "ModuleCompletion rows of this trainee filtered per variant; ExerciseParticipation rows with status == CREDITED; CurriculumModule rows with status == ACTIVE. VOIDED, RECORDED and FAILED completions never contribute in either variant."
    constants:
      READINESS_CORE_WEIGHT: 60.0
      READINESS_DEMO_WEIGHT: 40.0
      RECENCY_TIER_1_DAYS: 90
      RECENCY_TIER_2_DAYS: 180
      RECENCY_TIER_3_DAYS: 365
      RECENCY_FACTOR_TIER_1: 1.00
      RECENCY_FACTOR_TIER_2: 0.90
      RECENCY_FACTOR_TIER_3: 0.75
      RECENCY_FACTOR_STALE: 0.50
      EXERCISE_BONUS_PER_CREDITED: 2.5
      EXERCISE_BONUS_CAP: 10.0
      IMPUTED_PENDING_DEMO_SCORE: 70
    precision: "2 decimal places, round_half_up, applied once at step 9"
    variants:
      - name: certified
        when: "Persisted into Trainee.readiness_score and used as the primary sort key of activation_roster_selection. This is the only variant that ever reaches Trainee.readiness_score."
        difference: |
          core_hours_earned counts ONLY ModuleCompletion rows with status == PASSED on
          core modules. The demo set is the demo_score of PASSED completions whose module
          has requires_skills_demo == true.
      - name: provisional
        when: "Returned as provisional_readiness_score by GET /trainees/{traineeId}/readiness, used by the coordinator's graduation-review dashboard. Never persisted."
        difference: |
          In addition to the certified inclusion set, ModuleCompletion rows with status ==
          SKILLS_PENDING on core modules contribute HALF of their module's contact_hours to
          core_hours_earned, and enter the demo set with an imputed score of
          IMPUTED_PENDING_DEMO_SCORE (70). Identical stored data therefore yields a strictly
          higher score than the certified variant whenever any SKILLS_PENDING completion exists.

  - name: equipment_loss_settlement
    trigger: "POST /equipment-issuances/{issuanceId}/report-lost (EquipmentIssuance ISSUED -> LOST_WRITTEN_OFF)"
    algorithm: decay_function
    formula: |
      # --- per LOST_WRITTEN_OFF issuance line L ------------------------------
      months_held(L)  = floor(whole_days_between(L.issued_on, L.lost_reported_on) / 30)
      residual_pct(L) = round_half_up(max(RESIDUAL_FLOOR_PCT,
                                          1.00 - DEPRECIATION_PCT_PER_MONTH * months_held(L)), 4)
      settlement_variant(L) = FULL_REPLACEMENT
                                when the trainee has no Credential, or the trainee's
                                Credential.status IN {SUSPENDED, REVOKED} at the report instant
                            = DEPRECIATED_WRITEOFF otherwise
      settlement_cents(L)   = EquipmentAsset.unit_value_cents                    (FULL_REPLACEMENT)
                            = round_half_up(EquipmentAsset.unit_value_cents
                                            * residual_pct(L), 0)                (DEPRECIATED_WRITEOFF)

      # --- ROUNDING ORDER IS PINNED -----------------------------------------
      Trainee.equipment_liability_cents = SUM over lines L of settlement_cents(L)
      Each line is rounded to whole cents FIRST and the rounded lines are then summed.
      Summing the unrounded products and rounding the total once is FORBIDDEN and yields a
      different figure (two lines at x.5 cents each differ by 1 cent between the two orders).
    input_set: "EquipmentIssuance rows of this trainee with status == LOST_WRITTEN_OFF, ordered created_at ASC for audit. RETURNED and ISSUED rows contribute 0."
    constants:
      DEPRECIATION_PCT_PER_MONTH: 0.015
      RESIDUAL_FLOOR_PCT: 0.40
      DAYS_PER_DEPRECIATION_MONTH: 30
    precision: "residual_pct to 4 decimal places round_half_up; settlement_cents to whole cents round_half_up, per line, before summation"
    variants:
      - name: depreciated_writeoff
        when: "The trainee's Credential.status IN {ACTIVE, GRACE, EXPIRED} at the loss-report instant."
        difference: "Applies straight-line monthly depreciation with a 40% residual floor, so an older kit settles for less than its replacement value."
      - name: full_replacement
        when: "The trainee has no Credential, or Credential.status IN {SUSPENDED, REVOKED} at the loss-report instant."
        difference: "Depreciation is not applied at all; the line settles at the asset's full unit_value_cents. Identical assets, identical hold duration, materially different totals."

  - name: credential_renewal_terms
    trigger: "Credential issuance (POST /credentials) and every POST /credentials/{credentialId}/status with action = RENEW"
    algorithm: constraint_propagation
    formula: |
      # The term length looks circular: the extension depends on the surplus, the surplus
      # depends on the requirement, the requirement depends on the tier, and the tier
      # depends on a counter that THIS SAME OPERATION increments. The order below is
      # normative; no second pass is ever performed.
      1. base_term_days := CREDENTIAL_BASE_TERM_DAYS
         (always 365 — NEVER the previously extended term length)
      2. r := Credential.reinstatement_count as observed BEFORE this operation
         renewal_tier := STANDARD   if r == 0
                       := WATCH     if 1 <= r <= 2
                       := PROBATION if r >= 3
      3. required_refresher_hours := RENEWAL_TIER_HOURS[renewal_tier]
      4. GATE: refresher_hours_in_term >= required_refresher_hours   (>= , not >)
         On failure: ERR_REFRESHER_HOURS_INSUFFICIENT, nothing below executes.
      5. surplus_hours := max(0.0, refresher_hours_in_term - required_refresher_hours)
      6. extension_days := min(EXTENSION_DAYS_CAP,
                               floor(surplus_hours) * EXTENSION_DAYS_PER_SURPLUS_HOUR)
      7. new_term_days := base_term_days + extension_days
      8. term_start_on := logical clock
         expires_on    := term_start_on + new_term_days days
         grace_ends_on := expires_on + GRACE_PERIOD_DAYS days
      9. reinstatement_count += 1        (strictly AFTER step 2 has read it)
      10. refresher_hours_in_term := 0.0 (new term starts empty)
      # At issuance only steps 1, 2, 3, 8 run with r == 0, extension_days == 0 and
      # refresher_hours_in_term == 0.0; steps 4-7, 9 and 10 are skipped.
      # ANTI-RULE: required_refresher_hours MUST NOT be recomputed from new_term_days,
      # nor from the incremented reinstatement_count.
    input_set: "The single Credential row being issued or renewed; its refresher_hours_in_term as produced by refresher_currency_hours."
    constants:
      CREDENTIAL_BASE_TERM_DAYS: 365
      GRACE_PERIOD_DAYS: 60
      RENEWAL_TIER_HOURS_STANDARD: 8.0
      RENEWAL_TIER_HOURS_WATCH: 12.0
      RENEWAL_TIER_HOURS_PROBATION: 16.0
      EXTENSION_DAYS_PER_SURPLUS_HOUR: 5
      EXTENSION_DAYS_CAP: 90
    precision: "whole days; hours compared at 1 decimal place"

  - name: refresher_currency_hours
    trigger: "Recomputed whenever a ModuleCompletion of the trainee reaches or leaves PASSED, whenever an ExerciseParticipation of the trainee reaches CREDITED, and at the start of every POST /credentials/{credentialId}/status request"
    algorithm: aggregation
    formula: |
      window = [Credential.term_start_on, logical_clock)          # half-open: term_start_on
                                                                  # included, now excluded
      exercise_part = SUM(ExerciseParticipation.hours_credited)
                      over rows WHERE trainee_id == Credential.trainee_id
                            AND status == CREDITED
                            AND updated_at IN window
      module_part   = SUM(ModuleCompletion.credited_contact_hours)
                      over rows WHERE trainee_id == Credential.trainee_id
                            AND status == PASSED
                            AND CurriculumModule.refresher_eligible == true
                            AND updated_at IN window
      refresher_hours_in_term = round_half_up(exercise_part + module_part, 1)
    input_set: "Only CREDITED ExerciseParticipation rows and PASSED ModuleCompletion rows on refresher-eligible modules; REGISTERED, VOIDED, RECORDED, SKILLS_PENDING and FAILED rows contribute 0. Rows dated before term_start_on are excluded even if never counted in a previous term."
    constants:
      REFRESHER_WINDOW_LOWER_BOUND: "inclusive"
      REFRESHER_WINDOW_UPPER_BOUND: "exclusive"
    precision: "1 decimal place, round_half_up, applied once to the total (never per row)"

  - name: activation_roster_selection
    trigger: "POST /activations/{activationId}/roster (Activation REQUESTED -> ROSTERED)"
    algorithm: waterfall_allocation
    formula: |
      # (a) ELIGIBILITY FILTER — candidate set
      candidate(T) :=
            T.program_id == Activation.program_id
        AND T.enrollment_status == GRADUATED
        AND T.deployment_hold == false
        AND EXISTS Credential C WHERE C.trainee_id == T.id
                                  AND C.status IN {ACTIVE, GRACE}
        AND NOT EXISTS RosterAssignment R WHERE R.trainee_id == T.id
                                  AND R.status IN {NOTIFIED, ACCEPTED, DEPLOYED}
                                  AND R.Activation.status IN {REQUESTED, ROSTERED, ACTIVATED}
        AND (Activation.severity != CRITICAL OR C.status == ACTIVE)

      # (b) RANKING — waterfall over two buckets, then an explicit within-bucket sort
      bucket 1 = candidates whose Credential.status == ACTIVE
      bucket 2 = candidates whose Credential.status == GRACE
      Bucket 1 is exhausted before ANY bucket-2 candidate is selected.
      Within a bucket: ORDER BY T.readiness_score DESC,
                       then T.last_deployed_at ASC with NULL FIRST (never-deployed wins),
                       then T.created_at ASC

      # (c) TIE-BREAK — T.created_at ASC is the final tie-break. Trainee.id is NEVER a
      #     sort input, not even as a last resort.

      # (d) FALLBACK
      take_count = min(Activation.requested_responders, |candidate set|)
      |candidate set| == 0  -> reject with ERR_NO_ELIGIBLE_RESPONDERS (409); the Activation
                               stays REQUESTED and fill_status stays UNFILLED
      0 < |candidate set| < requested_responders -> roster every candidate, Activation moves
                               to ROSTERED, fill_status becomes PARTIAL
      |candidate set| >= requested_responders    -> roster exactly requested_responders,
                               fill_status becomes FILLED
      selection_rank = 1-based index of the trainee in the order above.
    input_set: "Trainee rows of the activation's program in enrollment_status GRADUATED; their Credential rows; their RosterAssignment rows on non-terminal activations."
    constants:
      RESPONSE_WINDOW_MINUTES_ROUTINE: 240
      RESPONSE_WINDOW_MINUTES_URGENT: 120
      RESPONSE_WINDOW_MINUTES_CRITICAL: 60
    precision: "integer counts; readiness_score compared at 2 decimal places"

  - name: equipment_issuance_selection
    trigger: "POST /equipment-issuances"
    algorithm: waterfall_allocation
    formula: |
      # (a) ELIGIBILITY FILTER
      candidate(A) := A.program_id == Trainee.program_id
                  AND A.kit_type == request.kit_type
                  AND A.status == IN_STOCK
                  AND A.condition IN {NEW, SERVICEABLE}
      # (b) RANKING
      ORDER BY A.issue_count ASC, then A.unit_value_cents ASC
      # (c) TIE-BREAK
      then A.created_at ASC (final; EquipmentAsset.id is NEVER a sort input)
      # (d) FALLBACK
      |candidate set| == 0 -> ERR_NO_ASSET_AVAILABLE (409); no issuance row is created and
                              Program.equipment_committed_cents is unchanged
      # BUDGET GATE — evaluated AFTER the asset is selected and BEFORE it is committed:
      Program.equipment_committed_cents + A.unit_value_cents
          <= Program.equipment_budget_cents      (<= , not <)
      otherwise ERR_EQUIPMENT_BUDGET_EXCEEDED (409); no issuance row is created
      # COMMIT
      A.status := ISSUED; A.issue_count += 1
      Program.equipment_committed_cents += A.unit_value_cents
    input_set: "EquipmentAsset rows of the trainee's program with status == IN_STOCK and condition IN {NEW, SERVICEABLE}; ISSUED, RETIRED and LOST assets are excluded."
    constants: {}
    precision: "whole cents"

  - name: exercise_hours_credit
    trigger: "Exercise AAR_SUBMITTED -> AAR_ACCEPTED, applied to every ExerciseParticipation of that exercise with status == REGISTERED"
    algorithm: aggregation
    formula: |
      role_multiplier = 1.50 if role_played == TEAM_LEADER
                      = 1.25 if role_played == SEARCH_RESCUE
                      = 1.25 if role_played == MEDICAL
                      = 1.00 if role_played == LOGISTICS
                      = 0.50 if role_played == OBSERVER
      hours_credited  = round_half_up(Exercise.base_credit_hours * role_multiplier, 1)
    input_set: "ExerciseParticipation rows of the exercise with status == REGISTERED; VOIDED and already-CREDITED rows are skipped."
    constants:
      ROLE_MULTIPLIER_TEAM_LEADER: 1.50
      ROLE_MULTIPLIER_SEARCH_RESCUE: 1.25
      ROLE_MULTIPLIER_MEDICAL: 1.25
      ROLE_MULTIPLIER_LOGISTICS: 1.00
      ROLE_MULTIPLIER_OBSERVER: 0.50
    precision: "1 decimal place, round_half_up, per participation row"

  - name: instructor_daily_contact_load
    trigger: "POST /class-sessions, before the session is persisted"
    algorithm: aggregation
    formula: |
      day(S) = the UTC calendar date of S.starts_at
      load   = SUM(CurriculumModule.contact_hours)
               over ClassSession rows WHERE instructor_id == S.instructor_id
                     AND status IN {SCHEDULED, DELIVERED}
                     AND the UTC calendar date of starts_at == day(S)
      GATE: load + candidate module.contact_hours <= Instructor.max_daily_contact_hours
            (<= , not <)
      otherwise ERR_INSTRUCTOR_DAILY_LOAD_EXCEEDED (409)
    input_set: "ClassSession rows of that instructor with status IN {SCHEDULED, DELIVERED} whose starts_at falls on the same UTC calendar date; CANCELLED sessions are excluded and free their hours."
    constants:
      INSTRUCTOR_DAY_BOUNDARY: "UTC calendar date of starts_at"
    precision: "1 decimal place on hours"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The request's X-User-Role appears in the target endpoint's roles list in Table 5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource named by a path segment exists, validated left-to-right; the first missing one determines the error. Per-entity error ids: ERR_PROGRAM_NOT_FOUND, ERR_COHORT_NOT_FOUND, ERR_TRAINEE_NOT_FOUND, ERR_CLASS_SESSION_NOT_FOUND, ERR_MODULE_COMPLETION_NOT_FOUND, ERR_CREDENTIAL_NOT_FOUND, ERR_ISSUANCE_NOT_FOUND, ERR_EQUIPMENT_ASSET_NOT_FOUND, ERR_EXERCISE_NOT_FOUND, ERR_PARTICIPATION_NOT_FOUND, ERR_ACTIVATION_NOT_FOUND, ERR_ROSTER_ASSIGNMENT_NOT_FOUND, ERR_INSTRUCTOR_NOT_FOUND"
    error_id: ERR_TRAINEE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying path parameters"

  - priority: 4
    category: business_constraint
    check: "Request body shape: every required field present, types match, enum values are members of the declared set, numeric bounds honored (seat_capacity >= 1, requested_responders >= 1, unit_value_cents >= 1, attendance_minutes >= 0, contact_hours > 0, demo_score in [0,100]), datetimes are ISO 8601 UTC, limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the order the fields appear in the endpoint's input list"
    error_id: ERR_COHORT_NOT_FOUND
    http_status: 404
    applies_to: "POST /cohorts, POST /class-sessions, POST /trainees, POST /module-completions, POST /credentials, POST /equipment-assets, POST /equipment-issuances, POST /exercises, POST /exercise-participations, POST /activations, POST /activations/{activationId}/roster-assignments, POST /curriculum-modules"

  - priority: 6
    category: business_constraint
    check: "Uniqueness: Cohort.cohort_code unique within program_id; Trainee.email unique within program_id; Activation.incident_number unique within program_id"
    error_id: ERR_DUPLICATE_SCOPED_KEY
    http_status: 409
    applies_to: "POST /cohorts, POST /trainees, POST /activations"

  - priority: 7
    category: business_constraint
    check: "Global uniqueness: CurriculumModule.module_code, Facility.room_code, EquipmentAsset.asset_tag"
    error_id: ERR_DUPLICATE_GLOBAL_KEY
    http_status: 409
    applies_to: "POST /curriculum-modules, POST /facilities, POST /equipment-assets"

  - priority: 8
    category: auth
    check: "An entity_backed role acting on a resource it does not own is rejected: Trainee whose X-User-ID != RosterAssignment.trainee_id / Trainee.id; Instructor whose X-User-ID != ClassSession.instructor_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /roster-assignments/{assignmentId}/respond, POST /class-sessions/{sessionId}/deliver, POST /trainees/{traineeId}/enrollment (when acting as Trainee)"

  - priority: 10
    category: state
    check: "Optimistic concurrency: expected_program_version equals Program.version (POST /equipment-issuances); expected_activation_version equals Activation.version (POST /activations/{activationId}/roster-assignments)"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /equipment-issuances, POST /activations/{activationId}/roster-assignments"

  - priority: 20
    category: state
    check: "The requested transition is declared in Table 2 from the resource's current state; an undeclared (from, to) pair is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all POST action endpoints that advance a state machine"

  - priority: 22
    category: state
    check: "Enrollment actions require Cohort.status IN {RECRUITING, SCHEDULED, IN_SESSION}"
    error_id: ERR_COHORT_NOT_ACCEPTING
    http_status: 409
    applies_to: "POST /trainees, POST /trainees/{traineeId}/enrollment with action = ENROLL"

  - priority: 23
    category: state
    check: "Graduating a trainee and minting a credential require Cohort.status == GRADUATION_REVIEW (cross-entity: Trainee and Credential depend on Cohort)"
    error_id: ERR_COHORT_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /trainees/{traineeId}/enrollment with action = GRADUATE, POST /credentials"

  - priority: 24
    category: state
    check: "Recording a ModuleCompletion requires the referenced ClassSession.status == DELIVERED (cross-entity: ModuleCompletion depends on ClassSession)"
    error_id: ERR_SESSION_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /module-completions"

  - priority: 26
    category: state
    check: "Operations that assume a live credential require the trainee's Credential.status IN {ACTIVE, GRACE} (cross-entity: EquipmentIssuance and RosterAssignment depend on Credential)"
    error_id: ERR_CREDENTIAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /equipment-issuances, POST /roster-assignments/{assignmentId}/respond with response = ACCEPT"

  - priority: 28
    category: state
    check: "Responding to a call-out requires Activation.status == ROSTERED"
    error_id: ERR_ACTIVATION_NOT_ROSTERED
    http_status: 409
    applies_to: "POST /roster-assignments/{assignmentId}/respond"

  - priority: 30
    category: business_safety
    check: "Segregation of duties. (i) The SkillsEvaluator's X-User-ID must differ from the ClassSession.instructor_id of the completion's session. (ii) The coordinator's X-User-ID minting a Credential must differ from Cohort.graduation_reviewer_user_id of the trainee's cohort."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /module-completions/{completionId}/skills-demo, POST /credentials"

  - priority: 32
    category: business_safety
    check: "Instructor.certification_expires_on must be strictly after ClassSession.ends_at at scheduling time, and strictly after the logical clock at delivery time"
    error_id: ERR_INSTRUCTOR_CERT_EXPIRED
    http_status: 409
    applies_to: "POST /class-sessions, POST /class-sessions/{sessionId}/deliver"

  - priority: 34
    category: business_safety
    check: "Instructor.status must be ACTIVE and Facility.status must be ACTIVE when a session is scheduled"
    error_id: ERR_RESOURCE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /class-sessions"

  - priority: 36
    category: business_safety
    check: "A skills-demonstration retake on a FAILED completion requires attempt_number < MAX_DEMO_ATTEMPTS (3)"
    error_id: ERR_DEMO_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /module-completions/{completionId}/skills-demo"

  - priority: 40
    category: business_temporal
    check: "Facility overlap. A candidate ClassSession S conflicts with an existing ClassSession E sharing facility_id and having E.status IN {SCHEDULED, DELIVERED} when the BUFFERED candidate interval [S.starts_at - FACILITY_TURNOVER_BUFFER_MINUTES, S.ends_at + FACILITY_TURNOVER_BUFFER_MINUTES) intersects the unbuffered [E.starts_at, E.ends_at). The buffer is applied to BOTH ends of the candidate only, so exactly-adjacent sessions (S.starts_at == E.ends_at) DO conflict. FACILITY_TURNOVER_BUFFER_MINUTES = 30."
    error_id: ERR_FACILITY_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /class-sessions"

  - priority: 42
    category: business_temporal
    check: "Instructor overlap. A candidate ClassSession S conflicts with an existing ClassSession E sharing instructor_id and having E.status IN {SCHEDULED, DELIVERED} only when the UNBUFFERED half-open intervals [S.starts_at, S.ends_at) and [E.starts_at, E.ends_at) intersect. No buffer is applied, so exact adjacency (S.starts_at == E.ends_at) is ALLOWED. Aggregate per-UTC-calendar-day capacity is enforced separately at priority 66."
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /class-sessions"

  - priority: 44
    category: business_temporal
    check: "ClassSession.starts_at >= Cohort.session_window_start AND computed ends_at <= Cohort.session_window_end"
    error_id: ERR_SESSION_OUTSIDE_COHORT_WINDOW
    http_status: 409
    applies_to: "POST /class-sessions"

  - priority: 46
    category: business_temporal
    check: "A call-out response requires logical clock < Activation.response_deadline_at (strictly before)"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /roster-assignments/{assignmentId}/respond"

  - priority: 50
    category: business_referential
    check: "When the scheduled CurriculumModule has a non-null prerequisite_module_id, that prerequisite must already have a ClassSession on the same cohort with status IN {SCHEDULED, DELIVERED} whose ends_at <= the candidate's starts_at"
    error_id: ERR_PREREQUISITE_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /class-sessions"

  - priority: 52
    category: business_referential
    check: "When the completed module has a non-null prerequisite_module_id, the trainee must already hold a ModuleCompletion on that prerequisite with status == PASSED"
    error_id: ERR_PREREQUISITE_NOT_PASSED
    http_status: 409
    applies_to: "POST /module-completions"

  - priority: 54
    category: business_referential
    check: "A supplied prerequisite_module_id must not create a cycle in the CurriculumModule prerequisite graph (including self-reference)"
    error_id: ERR_CURRICULUM_CYCLE
    http_status: 409
    applies_to: "POST /curriculum-modules, PATCH /curriculum-modules/{moduleId}"

  - priority: 56
    category: business_referential
    check: "Withdrawing a Trainee requires that no EquipmentIssuance of that trainee has status == ISSUED"
    error_id: ERR_EQUIPMENT_OUTSTANDING
    http_status: 409
    applies_to: "POST /trainees/{traineeId}/enrollment with action = WITHDRAW"

  - priority: 58
    category: business_referential
    check: "Withdrawing a Trainee requires that no RosterAssignment of that trainee has status IN {NOTIFIED, ACCEPTED, DEPLOYED}"
    error_id: ERR_ROSTER_COMMITMENT_OUTSTANDING
    http_status: 409
    applies_to: "POST /trainees/{traineeId}/enrollment with action = WITHDRAW"

  - priority: 60
    category: business_constraint
    check: "ModuleCompletion.attendance_ratio >= MIN_ATTENDANCE_RATIO (0.80, >= not >) computed as attendance_minutes / (contact_hours * 60)"
    error_id: ERR_ATTENDANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /module-completions"

  - priority: 62
    category: business_constraint
    check: "At most one ModuleCompletion per (trainee_id, module_id) may exist with status != VOIDED"
    error_id: ERR_DUPLICATE_COMPLETION
    http_status: 409
    applies_to: "POST /module-completions"

  - priority: 64
    category: business_constraint
    check: "Facility.capacity_seats >= Cohort.seats_confirmed at scheduling time"
    error_id: ERR_FACILITY_CAPACITY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /class-sessions"

  - priority: 66
    category: business_constraint
    check: "Aggregate instructor day capacity per instructor_daily_contact_load: existing SCHEDULED+DELIVERED contact hours on the same UTC calendar date plus the candidate module's contact_hours must be <= Instructor.max_daily_contact_hours (<= not <)"
    error_id: ERR_INSTRUCTOR_DAILY_LOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /class-sessions"

  - priority: 68
    category: business_constraint
    check: "The activation_roster_selection candidate set must be non-empty"
    error_id: ERR_NO_ELIGIBLE_RESPONDERS
    http_status: 409
    applies_to: "POST /activations/{activationId}/roster"

  - priority: 69
    category: business_constraint
    check: "A trainee manually added to a roster must satisfy the same eligibility filter as activation_roster_selection clause (a)"
    error_id: ERR_TRAINEE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /activations/{activationId}/roster-assignments"

  - priority: 70
    category: business_constraint
    check: "The equipment_issuance_selection candidate set must be non-empty for the requested kit_type"
    error_id: ERR_NO_ASSET_AVAILABLE
    http_status: 409
    applies_to: "POST /equipment-issuances"

  - priority: 71
    category: business_constraint
    check: "A trainee may hold at most one EquipmentIssuance with status == ISSUED per kit_type"
    error_id: ERR_TRAINEE_ALREADY_ISSUED_KIT
    http_status: 409
    applies_to: "POST /equipment-issuances"

  - priority: 74
    category: business_constraint
    check: "Credential renewal requires refresher_hours_in_term >= required_refresher_hours (>= not >), with required_refresher_hours resolved from the PRE-increment reinstatement_count"
    error_id: ERR_REFRESHER_HOURS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /credentials/{credentialId}/status with action = RENEW"

  - priority: 76
    category: business_constraint
    check: "Graduating a trainee requires passed_core_count == COUNT(CurriculumModule where is_core == true AND status == ACTIVE) and no ModuleCompletion of that trainee in status SKILLS_PENDING"
    error_id: ERR_CORE_MODULES_INCOMPLETE
    http_status: 422
    applies_to: "POST /trainees/{traineeId}/enrollment with action = GRADUATE, POST /credentials"

  - priority: 78
    category: business_constraint
    check: "A Credential may be minted only for a Trainee whose enrollment_status == GRADUATED and who has no existing Credential row"
    error_id: ERR_CREDENTIAL_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /credentials"

  - priority: 80
    category: business_fiscal
    check: "Program.equipment_committed_cents + selected asset unit_value_cents <= Program.equipment_budget_cents (<= not <)"
    error_id: ERR_EQUIPMENT_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /equipment-issuances"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/programs"
    description: "Create a local CERT program"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, sponsor_agency, jurisdiction_code, equipment_budget_cents]
    output: Program
    side_effects: ["equipment_committed_cents, active_member_count and pending_graduation_count initialised to 0", "version initialised to 1"]

  - method: GET
    path: "/programs/{programId}"
    description: "Read a program including its committed-equipment ledger"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: PATCH
    path: "/programs/{programId}"
    description: "Adjust the program's equipment budget or sponsor agency"
    roles: [ProgramCoordinator]
    code: 200
    input: ["equipment_budget_cents?", "sponsor_agency?"]
    output: Program
    side_effects: ["increments Program.version by 1"]

  - method: POST
    path: "/cohorts"
    description: "Open a recruitment cohort under a program"
    roles: [ProgramCoordinator]
    code: 201
    input: [program_id, cohort_code, seat_capacity, session_window_start, session_window_end]
    output: Cohort
    side_effects: ["status initialised to RECRUITING", "seats_confirmed, seats_waitlisted, delivered_contact_hours initialised to 0", "next_waitlist_position initialised to 1"]

  - method: GET
    path: "/cohorts"
    description: "List cohorts, filtered by program and status (reverse-reachability for Cohort.program_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []

  - method: GET
    path: "/cohorts/{cohortId}"
    description: "Read one cohort including its seat ledger and graduation reviewer"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: Cohort
    side_effects: []

  - method: POST
    path: "/cohorts/{cohortId}/advance"
    description: "Advance the cohort lifecycle: to_status in {SCHEDULED, IN_SESSION, GRADUATION_REVIEW, CLOSED, CANCELLED}"
    roles: [ProgramCoordinator]
    code: 200
    input: [to_status]
    output: Cohort
    side_effects: ["Table 2 Cohort side effects, including stamping graduation_reviewer_user_id on IN_SESSION -> GRADUATION_REVIEW and Program.pending_graduation_count adjustment"]

  - method: POST
    path: "/curriculum-modules"
    description: "Define a curriculum module, optionally with a self-referential prerequisite"
    roles: [ProgramCoordinator]
    code: 201
    input: ["module_code", "title", "contact_hours", "sequence_index", "is_core?", "requires_skills_demo?", "refresher_eligible?", "prerequisite_module_id?", "status?"]
    output: CurriculumModule
    side_effects: ["prerequisite graph is checked for cycles before insert"]

  - method: GET
    path: "/curriculum-modules"
    description: "List curriculum modules (reverse-reachability for CurriculumModule.prerequisite_module_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["prerequisite_module_id?", "is_core?", "status?", "limit?", "offset?"]
    output: CurriculumModule[]
    side_effects: []

  - method: PATCH
    path: "/curriculum-modules/{moduleId}"
    description: "Re-point a module's prerequisite edge, retire it, or rename it. The prerequisite graph is re-checked for cycles on every change."
    roles: [ProgramCoordinator]
    code: 200
    input: ["title?", "prerequisite_module_id?", "status?"]
    output: CurriculumModule
    side_effects: ["prerequisite graph re-checked for cycles", "increments CurriculumModule.version by 1"]

  - method: POST
    path: "/facilities"
    description: "Register a training facility room"
    roles: [ProgramCoordinator]
    code: 201
    input: ["name", "room_code", "capacity_seats", "status?"]
    output: Facility
    side_effects: []

  - method: POST
    path: "/instructors"
    description: "Register an instructor, who may also act as a SkillsEvaluator"
    roles: [ProgramCoordinator]
    code: 201
    input: ["full_name", "certification_expires_on", "max_daily_contact_hours?", "status?"]
    output: Instructor
    side_effects: []

  - method: PATCH
    path: "/instructors/{instructorId}"
    description: "Update instructor certification expiry, daily teaching cap or status"
    roles: [ProgramCoordinator]
    code: 200
    input: ["certification_expires_on?", "max_daily_contact_hours?", "status?"]
    output: Instructor
    side_effects: ["increments Instructor.version by 1"]

  - method: POST
    path: "/class-sessions"
    description: "Schedule a class session; ends_at is derived from the module's contact_hours and both overlap rules plus the aggregate instructor day cap are enforced here"
    roles: [ProgramCoordinator]
    code: 201
    input: [cohort_id, module_id, facility_id, instructor_id, starts_at]
    output: ClassSession
    side_effects: ["ends_at computed as starts_at + contact_hours*60 minutes", "status initialised to SCHEDULED"]

  - method: GET
    path: "/class-sessions"
    description: "List class sessions (reverse-reachability for ClassSession.cohort_id, module_id, facility_id and instructor_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["cohort_id?", "module_id?", "facility_id?", "instructor_id?", "status?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []

  - method: GET
    path: "/class-sessions/{sessionId}"
    description: "Read one class session"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: ClassSession
    side_effects: []

  - method: POST
    path: "/class-sessions/{sessionId}/deliver"
    description: "The assigned instructor marks the session delivered"
    roles: [Instructor]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["delivered_at stamped", "Cohort.delivered_contact_hours increased by the module's contact_hours"]

  - method: POST
    path: "/class-sessions/{sessionId}/cancel"
    description: "Cancel a scheduled or delivered session; cancelling a DELIVERED session fires cascade chain B"
    roles: [ProgramCoordinator]
    code: 200
    input: ["reason?"]
    output: ClassSession
    side_effects: ["Cascade chain B links 1-5 as declared in Table 2"]

  - method: POST
    path: "/trainees"
    description: "Record a CERT applicant against a cohort"
    roles: [ProgramCoordinator]
    code: 201
    input: ["program_id", "cohort_id", "full_name", "email", "deployment_hold?"]
    output: Trainee
    side_effects: ["enrollment_status initialised to APPLIED and currency_status to NOT_CREDENTIALED"]

  - method: GET
    path: "/trainees"
    description: "List trainees (reverse-reachability for Trainee.program_id and Trainee.cohort_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["program_id?", "cohort_id?", "enrollment_status?", "currency_status?", "limit?", "offset?"]
    output: Trainee[]
    side_effects: []

  - method: GET
    path: "/trainees/{traineeId}"
    description: "Read one trainee including both state dimensions and the certified readiness score"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: Trainee
    side_effects: []

  - method: POST
    path: "/trainees/{traineeId}/enrollment"
    description: "Enrollment-dimension action: action in {ENROLL, WITHDRAW, GRADUATE}"
    roles: [ProgramCoordinator, Trainee]
    code: 200
    input: [action]
    output: Trainee
    side_effects: ["Table 2 Trainee.enrollment_status side effects including the cohort seat ledger and the waitlist promotion selector"]

  - method: GET
    path: "/trainees/{traineeId}/readiness"
    description: "Computed read exposing BOTH variants of trainee_readiness_score side by side"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output:
      certified_readiness_score: number
      provisional_readiness_score: number
      core_hours_total: number
      core_hours_earned_certified: number
      core_hours_earned_provisional: number
      core_ratio_certified: number
      core_ratio_provisional: number
      demo_avg_certified: number
      demo_avg_provisional: number
      recency_factor: number
      exercise_bonus: number
    side_effects: []

  - method: POST
    path: "/module-completions"
    description: "Record a trainee's attendance at a delivered class session"
    roles: [Instructor]
    code: 201
    input: [trainee_id, class_session_id, attendance_minutes]
    output: ModuleCompletion
    side_effects: ["module_id copied from the session", "attendance_ratio computed", "auto-transition RECORDED -> SKILLS_PENDING or RECORDED -> PASSED per the module's requires_skills_demo flag, with the full PASSED ledger side-effect set"]

  - method: GET
    path: "/module-completions"
    description: "List module completions (reverse-reachability for ModuleCompletion.trainee_id, module_id, class_session_id and evaluator_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["trainee_id?", "module_id?", "class_session_id?", "evaluator_id?", "status?", "limit?", "offset?"]
    output: ModuleCompletion[]
    side_effects: []

  - method: POST
    path: "/module-completions/{completionId}/skills-demo"
    description: "A SkillsEvaluator signs a skills demonstration; outcome in {PASS, FAIL}. On a FAILED completion the same call performs the bounded retake (FAILED -> SKILLS_PENDING -> PASSED/FAILED)"
    roles: [SkillsEvaluator]
    code: 200
    input: [outcome, demo_score]
    output: ModuleCompletion
    side_effects: ["evaluator_id and demo_score stamped", "attempt_number incremented on a retake", "PASSED ledger side-effect set when the outcome resolves to PASSED"]

  - method: POST
    path: "/module-completions/{completionId}/void"
    description: "Void a recorded completion; voiding a PASSED core completion fires cascade chain A"
    roles: [ProgramCoordinator]
    code: 200
    input: ["reason?"]
    output: ModuleCompletion
    side_effects: ["Cascade chain A links 1-6 as declared in Table 2"]

  - method: POST
    path: "/credentials"
    description: "Mint the CERT credential/ID card for a graduated trainee. Blocked when the acting coordinator is the same user that put the cohort into GRADUATION_REVIEW."
    roles: [ProgramCoordinator]
    code: 201
    input: [trainee_id]
    output: Credential
    side_effects: ["credential_number minted from the cohort code plus a 4-digit issuance sequence", "issued_on and term_start_on stamped from the logical clock", "expires_on/grace_ends_on/renewal_tier/required_refresher_hours computed by credential_renewal_terms", "Trainee.currency_status NOT_CREDENTIALED -> CURRENT"]

  - method: GET
    path: "/credentials"
    description: "List credentials (reverse-reachability for Credential.trainee_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["trainee_id?", "status?", "limit?", "offset?"]
    output: Credential[]
    side_effects: []

  - method: POST
    path: "/credentials/{credentialId}/status"
    description: "Credential lifecycle action: action in {RENEW, SUSPEND, REINSTATE, REVOKE}"
    roles: [ProgramCoordinator]
    code: 200
    input: [action]
    output: Credential
    side_effects: ["refresher_hours_in_term refreshed by refresher_currency_hours before the action is evaluated", "Table 2 Credential side effects including the currency-dimension mirror and roster withdrawal cascades"]

  - method: POST
    path: "/equipment-assets"
    description: "Add a kit asset to the program inventory"
    roles: [LogisticsOfficer]
    code: 201
    input: [program_id, asset_tag, kit_type, unit_value_cents]
    output: EquipmentAsset
    side_effects: ["status initialised to IN_STOCK, condition to NEW, issue_count to 0"]

  - method: GET
    path: "/equipment-assets"
    description: "List inventory assets (reverse-reachability for EquipmentAsset.program_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["program_id?", "kit_type?", "status?", "limit?", "offset?"]
    output: EquipmentAsset[]
    side_effects: []

  - method: POST
    path: "/equipment-issuances"
    description: "Issue a kit to a graduated trainee. The server selects the asset via equipment_issuance_selection; the caller never names it. OCC-guarded on the program's version."
    roles: [LogisticsOfficer]
    code: 201
    input: [trainee_id, kit_type, expected_program_version]
    output: EquipmentIssuance
    side_effects: ["selected EquipmentAsset.status -> ISSUED and issue_count += 1", "Program.equipment_committed_cents += asset unit_value_cents", "increments Program.version by 1"]

  - method: GET
    path: "/equipment-issuances"
    description: "List issuances (reverse-reachability for EquipmentIssuance.trainee_id and asset_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["trainee_id?", "asset_id?", "status?", "limit?", "offset?"]
    output: EquipmentIssuance[]
    side_effects: []

  - method: POST
    path: "/equipment-issuances/{issuanceId}/return"
    description: "Return an issued kit; condition in {SERVICEABLE, DAMAGED}"
    roles: [LogisticsOfficer]
    code: 200
    input: [condition]
    output: EquipmentIssuance
    side_effects: ["returned_on stamped", "asset returns to IN_STOCK (SERVICEABLE) or moves to RETIRED (DAMAGED)", "Program.equipment_committed_cents -= asset unit_value_cents", "increments Program.version by 1"]

  - method: POST
    path: "/equipment-issuances/{issuanceId}/report-lost"
    description: "Write off a lost kit; settlement_variant and settlement_cents computed by equipment_loss_settlement"
    roles: [LogisticsOfficer]
    code: 200
    input: ["note?"]
    output: EquipmentIssuance
    side_effects: ["lost_reported_on stamped; months_held, residual_pct, settlement_variant and settlement_cents computed", "asset moves to LOST/WRITTEN_OFF", "Program.equipment_committed_cents -= asset unit_value_cents", "Trainee.equipment_liability_cents recomputed as the per-line-rounded sum", "increments Program.version by 1"]

  - method: POST
    path: "/exercises"
    description: "Schedule a drill or exercise for the program"
    roles: [EmergencyManager]
    code: 201
    input: [program_id, title, exercise_type, starts_at, ends_at, base_credit_hours]
    output: Exercise
    side_effects: ["status initialised to PLANNED"]

  - method: GET
    path: "/exercises"
    description: "List exercises (reverse-reachability for Exercise.program_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: Exercise[]
    side_effects: []

  - method: POST
    path: "/exercises/{exerciseId}/advance"
    description: "Advance the exercise lifecycle: to_status in {RUNNING, COMPLETED, AAR_SUBMITTED, AAR_ACCEPTED, CANCELLED}. AAR_ACCEPTED is coordinator-only."
    roles: [EmergencyManager, ProgramCoordinator]
    code: 200
    input: ["to_status", "aar_summary?"]
    output: Exercise
    side_effects: ["On AAR_SUBMITTED -> AAR_ACCEPTED every REGISTERED participation is CREDITED with exercise_hours_credit and the credited hours flow into each trainee's Credential.refresher_hours_in_term, last_qualifying_activity_at and readiness_score"]

  - method: POST
    path: "/exercise-participations"
    description: "Register a trainee for an exercise"
    roles: [EmergencyManager]
    code: 201
    input: [exercise_id, trainee_id, role_played]
    output: ExerciseParticipation
    side_effects: ["role_multiplier resolved; status initialised to REGISTERED; hours_credited stays 0 until the AAR is accepted"]

  - method: GET
    path: "/exercise-participations"
    description: "List participations (reverse-reachability for ExerciseParticipation.exercise_id and trainee_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["exercise_id?", "trainee_id?", "status?", "limit?", "offset?"]
    output: ExerciseParticipation[]
    side_effects: []

  - method: POST
    path: "/activations"
    description: "Emergency management opens a CERT call-out request"
    roles: [EmergencyManager]
    code: 201
    input: [program_id, incident_number, requesting_agency, severity, requested_responders]
    output: Activation
    side_effects: ["status initialised to REQUESTED, fill_status to UNFILLED"]

  - method: GET
    path: "/activations"
    description: "List activations (reverse-reachability for Activation.program_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["program_id?", "status?", "fill_status?", "limit?", "offset?"]
    output: Activation[]
    side_effects: []

  - method: GET
    path: "/activations/{activationId}"
    description: "Read one activation including its roster counts and fill_status"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: Activation
    side_effects: []

  - method: POST
    path: "/activations/{activationId}/roster"
    description: "Build the call-out roster with activation_roster_selection (waterfall over credential buckets, then readiness/last-deployment ranking)"
    roles: [EmergencyManager]
    code: 200
    input: []
    output: Activation
    side_effects: ["RosterAssignment rows created NOTIFIED with selection_rank 1..N", "response_deadline_at stamped from the severity response window", "rostered_count and fill_status recomputed", "increments Activation.version by 1"]

  - method: POST
    path: "/activations/{activationId}/roster-assignments"
    description: "Manually add one responder to an existing roster. OCC-guarded on the activation's version."
    roles: [EmergencyManager]
    code: 201
    input: [trainee_id, expected_activation_version]
    output: RosterAssignment
    side_effects: ["RosterAssignment created NOTIFIED with source MANUAL_ADD and selection_rank = max existing rank + 1", "rostered_count and fill_status recomputed", "increments Activation.version by 1"]

  - method: POST
    path: "/activations/{activationId}/advance"
    description: "Advance the activation lifecycle: to_status in {ACTIVATED, DEMOBILIZED, CANCELLED}"
    roles: [EmergencyManager]
    code: 200
    input: [to_status]
    output: Activation
    side_effects: ["Table 2 Activation side effects including bulk roster-assignment transitions"]

  - method: GET
    path: "/roster-assignments"
    description: "List roster assignments (reverse-reachability for RosterAssignment.activation_id and trainee_id)"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: ["activation_id?", "trainee_id?", "status?", "limit?", "offset?"]
    output: RosterAssignment[]
    side_effects: []

  - method: POST
    path: "/roster-assignments/{assignmentId}/respond"
    description: "The notified trainee accepts or declines the call-out; response in {ACCEPT, DECLINE}"
    roles: [Trainee]
    code: 200
    input: [response]
    output: RosterAssignment
    side_effects: ["responded_at stamped", "Activation.accepted_count, rostered_count and fill_status recomputed"]

  - method: POST
    path: "/roster-assignments/{assignmentId}/advance"
    description: "Emergency management deploys or releases an accepted responder: to_status in {DEPLOYED, RELEASED}"
    roles: [EmergencyManager]
    code: 200
    input: [to_status]
    output: RosterAssignment
    side_effects: ["Trainee.last_deployed_at stamped on DEPLOYED", "Trainee.last_qualifying_activity_at and readiness_score recomputed on RELEASED", "Activation.deployed_count recomputed"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time."
    roles: [ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects: ["all deadline, expiry, recency and depreciation arithmetic reads this clock"]

  - method: POST
    path: "/_ops/run-currency-sweep"
    description: "Test-driving endpoint: run the periodic currency/call-out sweep for a program at the current logical clock. Applies Credential ACTIVE -> GRACE and GRACE -> EXPIRED, mirrors the Trainee currency dimension, and expires overdue RosterAssignment notifications to NO_RESPONSE."
    roles: [ProgramCoordinator]
    code: 200
    input: [program_id]
    output:
      swept_credential_count: integer
      graced_count: integer
      expired_count: integer
      no_response_count: integer
    side_effects: ["Credential and Trainee.currency_status transitions", "RosterAssignment NOTIFIED -> NO_RESPONSE and affected Activation count recomputation"]

  - method: GET
    path: "/curriculum-modules/{moduleId}"
    description: "Read one curriculum module including its self-referential prerequisite edge"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: CurriculumModule
    side_effects: []
  - method: GET
    path: "/module-completions/{completionId}"
    description: "Read one module completion including attendance ratio, demo score and attempt counter"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: ModuleCompletion
    side_effects: []
  - method: GET
    path: "/credentials/{credentialId}"
    description: "Read one credential including term window, renewal tier and refresher hours"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: Credential
    side_effects: []
  - method: GET
    path: "/equipment-assets/{assetId}"
    description: "Read one inventory asset including its issue counter and condition"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: []
  - method: GET
    path: "/equipment-issuances/{issuanceId}"
    description: "Read one issuance including its settlement variant and settled cents"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: EquipmentIssuance
    side_effects: []
  - method: GET
    path: "/exercises/{exerciseId}"
    description: "Read one exercise including its AAR summary and credited participant count"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: Exercise
    side_effects: []
  - method: GET
    path: "/exercise-participations/{participationId}"
    description: "Read one exercise participation including its role multiplier and credited hours"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: ExerciseParticipation
    side_effects: []
  - method: GET
    path: "/roster-assignments/{assignmentId}"
    description: "Read one roster assignment including selection rank and response timestamps"
    roles: [ProgramCoordinator, Instructor, SkillsEvaluator, LogisticsOfficer, EmergencyManager, Trainee, Auditor]
    code: 200
    input: []
    output: RosterAssignment
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not listed in the target endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "An entity_backed role acts on a resource whose owning id differs from X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, enum value outside the declared set, numeric bound violated, malformed ISO 8601 datetime, or pagination parameter outside limit in [1,100] / offset >= 0" }

  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "No Program with the given id" }
  - { id: ERR_COHORT_NOT_FOUND, http: 404, condition: "No Cohort with the given id" }
  - { id: ERR_CURRICULUM_MODULE_NOT_FOUND, http: 404, condition: "No CurriculumModule with the given id" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "No Facility with the given id" }
  - { id: ERR_INSTRUCTOR_NOT_FOUND, http: 404, condition: "No Instructor with the given id" }
  - { id: ERR_CLASS_SESSION_NOT_FOUND, http: 404, condition: "No ClassSession with the given id" }
  - { id: ERR_TRAINEE_NOT_FOUND, http: 404, condition: "No Trainee with the given id" }
  - { id: ERR_MODULE_COMPLETION_NOT_FOUND, http: 404, condition: "No ModuleCompletion with the given id" }
  - { id: ERR_CREDENTIAL_NOT_FOUND, http: 404, condition: "No Credential with the given id" }
  - { id: ERR_ISSUANCE_NOT_FOUND, http: 404, condition: "No EquipmentIssuance with the given id" }
  - { id: ERR_EQUIPMENT_ASSET_NOT_FOUND, http: 404, condition: "No EquipmentAsset with the given id" }
  - { id: ERR_EXERCISE_NOT_FOUND, http: 404, condition: "No Exercise with the given id" }
  - { id: ERR_PARTICIPATION_NOT_FOUND, http: 404, condition: "No ExerciseParticipation with the given id" }
  - { id: ERR_ACTIVATION_NOT_FOUND, http: 404, condition: "No Activation with the given id" }
  - { id: ERR_ROSTER_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No RosterAssignment with the given id" }

  - { id: ERR_DUPLICATE_SCOPED_KEY, http: 409, condition: "Cohort.cohort_code, Trainee.email or Activation.incident_number already used inside the same program" }
  - { id: ERR_DUPLICATE_GLOBAL_KEY, http: 409, condition: "CurriculumModule.module_code, Facility.room_code or EquipmentAsset.asset_tag already used" }

  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version does not equal the Program's current version on POST /equipment-issuances" }
  - { id: ERR_STALE_ACTIVATION_VERSION, http: 412, condition: "expected_activation_version does not equal the Activation's current version on POST /activations/{activationId}/roster-assignments" }

  - { id: ERR_INVALID_STATE, http: 409, condition: "The requested (from, to) transition is not declared in Table 2 for the resource's current state" }
  - { id: ERR_COHORT_NOT_ACCEPTING, http: 409, condition: "An enrollment action is attempted while Cohort.status is not in {RECRUITING, SCHEDULED, IN_SESSION}" }
  - { id: ERR_COHORT_NOT_IN_REVIEW, http: 409, condition: "A graduation action or credential mint is attempted while the trainee's Cohort.status is not GRADUATION_REVIEW" }
  - { id: ERR_SESSION_NOT_DELIVERED, http: 409, condition: "A ModuleCompletion is recorded against a ClassSession whose status is not DELIVERED" }
  - { id: ERR_CREDENTIAL_NOT_ACTIVE, http: 409, condition: "The trainee's Credential.status is not in {ACTIVE, GRACE} when a kit issuance or a call-out acceptance is attempted" }
  - { id: ERR_ACTIVATION_NOT_ROSTERED, http: 409, condition: "A call-out response is attempted while Activation.status is not ROSTERED" }

  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The SkillsEvaluator's X-User-ID equals the session's instructor_id, or the credential-minting coordinator's X-User-ID equals the cohort's graduation_reviewer_user_id" }
  - { id: ERR_INSTRUCTOR_CERT_EXPIRED, http: 409, condition: "Instructor.certification_expires_on is not strictly after the session's ends_at at scheduling time, or not strictly after the logical clock at delivery time" }
  - { id: ERR_RESOURCE_NOT_ACTIVE, http: 409, condition: "Instructor.status != ACTIVE or Facility.status != ACTIVE at scheduling time" }
  - { id: ERR_DEMO_ATTEMPTS_EXHAUSTED, http: 409, condition: "A skills-demonstration retake is attempted when attempt_number has already reached MAX_DEMO_ATTEMPTS (3)" }

  - { id: ERR_FACILITY_DOUBLE_BOOKED, http: 409, condition: "The candidate session's 30-minute-buffered interval intersects another SCHEDULED/DELIVERED session in the same facility; exactly-adjacent sessions DO collide" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "The candidate session's unbuffered half-open interval intersects another SCHEDULED/DELIVERED session of the same instructor; exact adjacency does NOT collide" }
  - { id: ERR_SESSION_OUTSIDE_COHORT_WINDOW, http: 409, condition: "starts_at is before Cohort.session_window_start or the computed ends_at is after Cohort.session_window_end" }
  - { id: ERR_RESPONSE_WINDOW_CLOSED, http: 409, condition: "The logical clock has reached Activation.response_deadline_at when a responder answers the call-out" }

  - { id: ERR_PREREQUISITE_NOT_SCHEDULED, http: 409, condition: "The module's prerequisite has no earlier SCHEDULED/DELIVERED session on the same cohort" }
  - { id: ERR_PREREQUISITE_NOT_PASSED, http: 409, condition: "The trainee has no PASSED ModuleCompletion on the module's prerequisite" }
  - { id: ERR_CURRICULUM_CYCLE, http: 409, condition: "The supplied prerequisite_module_id would create a cycle in the prerequisite graph" }
  - { id: ERR_EQUIPMENT_OUTSTANDING, http: 409, condition: "A withdrawal is attempted while the trainee still holds an EquipmentIssuance with status == ISSUED" }
  - { id: ERR_ROSTER_COMMITMENT_OUTSTANDING, http: 409, condition: "A withdrawal is attempted while the trainee holds a RosterAssignment with status in {NOTIFIED, ACCEPTED, DEPLOYED}" }

  - { id: ERR_ATTENDANCE_INSUFFICIENT, http: 422, condition: "attendance_minutes / (contact_hours * 60) is strictly below MIN_ATTENDANCE_RATIO (0.80)" }
  - { id: ERR_DUPLICATE_COMPLETION, http: 409, condition: "A non-VOIDED ModuleCompletion already exists for this (trainee_id, module_id) pair" }
  - { id: ERR_FACILITY_CAPACITY_INSUFFICIENT, http: 409, condition: "Facility.capacity_seats is below Cohort.seats_confirmed at scheduling time" }
  - { id: ERR_INSTRUCTOR_DAILY_LOAD_EXCEEDED, http: 409, condition: "The instructor's SCHEDULED+DELIVERED contact hours on that UTC calendar date plus the candidate module's contact hours exceed max_daily_contact_hours" }
  - { id: ERR_NO_ELIGIBLE_RESPONDERS, http: 409, condition: "The activation_roster_selection candidate set is empty" }
  - { id: ERR_TRAINEE_NOT_ELIGIBLE, http: 409, condition: "A manually added responder fails the activation_roster_selection eligibility filter" }
  - { id: ERR_NO_ASSET_AVAILABLE, http: 409, condition: "The equipment_issuance_selection candidate pool for the requested kit_type is empty" }
  - { id: ERR_TRAINEE_ALREADY_ISSUED_KIT, http: 409, condition: "The trainee already holds an EquipmentIssuance with status == ISSUED for that kit_type" }
  - { id: ERR_REFRESHER_HOURS_INSUFFICIENT, http: 422, condition: "Credential.refresher_hours_in_term is strictly below required_refresher_hours at renewal" }
  - { id: ERR_CORE_MODULES_INCOMPLETE, http: 422, condition: "The trainee has not PASSED every core ACTIVE CurriculumModule, or still holds a SKILLS_PENDING completion" }
  - { id: ERR_CREDENTIAL_ALREADY_ISSUED, http: 409, condition: "The trainee already has a Credential row" }
  - { id: ERR_EQUIPMENT_BUDGET_EXCEEDED, http: 409, condition: "Program.equipment_committed_cents plus the selected asset's unit_value_cents would exceed Program.equipment_budget_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramCoordinator
    description: "Runs the local CERT program: recruitment, scheduling, graduation review, credential issuance and lifecycle, AAR acceptance, and the operational sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "PATCH /programs/{programId}"
      - "POST /cohorts"
      - "POST /cohorts/{cohortId}/advance"
      - "POST /curriculum-modules"
      - "POST /facilities"
      - "POST /instructors"
      - "PATCH /instructors/{instructorId}"
      - "POST /class-sessions"
      - "POST /class-sessions/{sessionId}/cancel"
      - "POST /trainees"
      - "POST /module-completions/{completionId}/void"
      - "POST /credentials"
      - "POST /credentials/{credentialId}/status"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-currency-sweep"
    shared_operations:
      - "POST /trainees/{traineeId}/enrollment (shared with Trainee)"
      - "POST /exercises/{exerciseId}/advance (shared with EmergencyManager; AAR_ACCEPTED is coordinator-driven)"
      - "All GET endpoints"
    note: "Segregation of duties: the coordinator user id stamped on Cohort.graduation_reviewer_user_id may not mint credentials for that cohort's trainees."

  - name: Instructor
    description: "Delivers class sessions and records trainee attendance."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /class-sessions/{sessionId}/deliver"
      - "POST /module-completions"
    shared_operations:
      - "All GET endpoints"
    note: "X-User-ID must equal ClassSession.instructor_id for the session being delivered."

  - name: SkillsEvaluator
    description: "Independent evaluator that signs skills demonstrations. Backed by the same Instructor roster, acting under a different hat."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /module-completions/{completionId}/skills-demo"
    shared_operations:
      - "All GET endpoints"
    note: "Segregation of duties: X-User-ID must differ from the ClassSession.instructor_id of the completion being signed."

  - name: LogisticsOfficer
    description: "Owns the equipment/backpack inventory: asset registration, issuance, return and loss write-off."
    identity: "opaque"
    exclusive_operations:
      - "POST /equipment-assets"
      - "POST /equipment-issuances"
      - "POST /equipment-issuances/{issuanceId}/return"
      - "POST /equipment-issuances/{issuanceId}/report-lost"
    shared_operations:
      - "All GET endpoints"

  - name: EmergencyManager
    description: "Agency-side counterpart: opens activations, builds and manages call-out rosters, schedules exercises and submits after-action reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /activations"
      - "POST /activations/{activationId}/roster"
      - "POST /activations/{activationId}/roster-assignments"
      - "POST /activations/{activationId}/advance"
      - "POST /roster-assignments/{assignmentId}/advance"
      - "POST /exercises"
      - "POST /exercise-participations"
    shared_operations:
      - "POST /exercises/{exerciseId}/advance (shared with ProgramCoordinator)"
      - "All GET endpoints"

  - name: Trainee
    description: "CERT member/applicant. Responds to call-outs and may withdraw from a cohort."
    identity: "entity_backed:Trainee"
    exclusive_operations:
      - "POST /roster-assignments/{assignmentId}/respond"
    shared_operations:
      - "POST /trainees/{traineeId}/enrollment (shared with ProgramCoordinator; a Trainee may only act on its own record and only with action = WITHDRAW)"
      - "All GET endpoints"

  - name: Auditor
    description: "Read-only oversight role for the sponsoring agency."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
