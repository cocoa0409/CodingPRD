        distinguishing_aspect: "SILVER discount on base 12345: discount = round_half_up(1234.5) = 1235, tuition_invoice_cents = 12345 - 1235 = 11110."
        test_recipe:
          setup: ["SILVER contract; student ENROLLED into base 12345 cohort, no add-ons."]
          setup_api_calls:
            - call: "POST /corporate-contracts"
              payload: { company_name: "Round", contracted_seats: 3, discount_tier: "SILVER" }
