            - { call: "POST /school/security-plans/${sp}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/families", payload: { family_name: "Fam AA", primary_email: "aa@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_a: $.data.id } }
            - { call: "POST /school/families", payload: { family_name: "Fam BB", primary_email: "bb@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_b: $.data.id } }
