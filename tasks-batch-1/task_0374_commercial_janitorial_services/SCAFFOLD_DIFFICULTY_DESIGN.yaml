  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_referential_on_visit_start
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.Visit.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREW_INACTIVE]
        distinguishing_aspect: |
          Pair: state (priority 7, ERR_INVALID_STATE) vs business_referential
          (priority 8, ERR_CREW_INACTIVE). Starting a visit that is already COMPLETED
          while its crew is also INACTIVE fails both; the state check wins and the
          response is ERR_INVALID_STATE, not ERR_CREW_INACTIVE.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, a crew that becomes INACTIVE."
            - "A ROUTINE visit completed (terminal COMPLETED), then the crew deactivated."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${visit_id}", crew_id: "${crew_id}", clock_in_min: 540 }
              as: FieldSupervisor
              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/clock-out"
              payload: { clock_out_min: 600 }
              as: FieldSupervisor
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: FieldSupervisor
            - call: "POST /crew/${crew_id}/deactivate"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE (priority 7 wins over priority 8 ERR_CREW_INACTIVE)"

      - name: state_before_safety_on_periodic_dispatch
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.PeriodicJob.REQUESTED_to_DISPATCHED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FLOOR_INELIGIBLE]
        distinguishing_aspect: |
          A DIFFERENT pair than instance one: state (priority 7, ERR_INVALID_STATE)
          vs business_safety (priority 9, ERR_FLOOR_INELIGIBLE). Dispatching a
          CANCELLED STRIP_WAX job on an ineligible CARPET floor fails both; the state
          check wins → ERR_INVALID_STATE, not ERR_FLOOR_INELIGIBLE.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site with floor_type=CARPET (strip/wax ineligible), AVAILABLE crew."
            - "A STRIP_WAX PeriodicJob that has been CANCELLED (terminal)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /periodic-jobs"
              payload: { site_id: "${site_id}", job_type: "STRIP_WAX", quoted_hours: 2, requested_date: "2026-06-12" }
              as: AccountManager
              captures: { job_id: $.data.id }
            - call: "POST /periodic-jobs/${job_id}/cancel"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /periodic-jobs/${job_id}/dispatch"
              payload: { crew_id: "${crew_id}", service_date: "2026-06-12", planned_start_min: 480, planned_end_min: 600 }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE (priority 7 wins over priority 9 ERR_FLOOR_INELIGIBLE)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: shift_capacity_threshold_at_and_over_on_clock_out
        grounds:
          - validations[priority=10]
          - state_machines.TimeEntry.OPEN_to_COMPLETED
          - entities.CrewMember.fields.shift_capacity_min
          - errors[ERR_SHIFT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Numeric-threshold boundary on the clock-out endpoint: with
          shift_capacity_min=480, a cumulative daily total of exactly 480 is allowed
          (<=), but 481 is rejected with ERR_SHIFT_CAPACITY_EXCEEDED. The crossing is
          one minute (480 OK vs 481 fail) — a >= vs > metric, distinct from instance
          two's interval-adjacency metric.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, an AVAILABLE crew with shift_capacity_min=480."
            - "Two ROUTINE visits for that crew on 2026-06-16, both started (IN_PROGRESS)."
            - "Visit A has one COMPLETED TimeEntry clocked 00:00→07:59 (479 min). Visit B has an OPEN TimeEntry clocked in at 07:59."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew", shift_capacity_min: 480 }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 0, planned_end_min: 479, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { vA_id: $.data.id }
            - call: "POST /visits/${vA_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${vA_id}", crew_id: "${crew_id}", clock_in_min: 0 }
              as: FieldSupervisor
              captures: { teA_id: $.data.id }
            - call: "POST /time-entries/${teA_id}/clock-out"
              payload: { clock_out_min: 479 }
              as: FieldSupervisor
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 479, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { vB_id: $.data.id }
            - call: "POST /visits/${vB_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${vB_id}", crew_id: "${crew_id}", clock_in_min: 479 }
              as: FieldSupervisor
              captures: { teB_id: $.data.id }
          trigger:
            - call: "POST /time-entries/${teB_id}/clock-out"
              payload: { clock_out_min: 481 }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_SHIFT_CAPACITY_EXCEEDED (479 + 2 = 481 > 480)"
            - "A clock_out_min of 480 (479 + 1 = 480 == cap) would instead succeed (<= boundary)"

      - name: crew_double_book_adjacency_allowed_on_visit_create
        grounds:
          - validations[priority=11]
          - entities.Visit.fields.planned_start_min
          - entities.Visit.fields.planned_end_min
          - errors[ERR_CREW_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Half-open interval boundary on POST /visits (a DIFFERENT endpoint and
          metric than the shift threshold): an existing SCHEDULED visit on
          [600,660) means a new visit starting exactly at 660 (adjacency, end==start)
          is ALLOWED, but one starting at 659 overlaps and is rejected with
          ERR_CREW_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew."
            - "One SCHEDULED ROUTINE visit for that crew on 2026-06-16 occupying [600,660)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 600, planned_end_min: 660, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 659, planned_end_min: 720, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_CREW_DOUBLE_BOOKED ([659,720) overlaps [600,660))"
            - "A new visit on [660,720) (adjacent, end==start) would instead succeed (201)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_start_blocked_by_inactive_crew
        grounds:
          - state_machines.Visit.SCHEDULED_to_IN_PROGRESS
          - entities.CrewMember.fields.status
          - errors[ERR_CREW_INACTIVE]
          - validations[priority=8]
        distinguishing_aspect: |
          Visit -> CrewMember dependency: a SCHEDULED Visit cannot transition to
          IN_PROGRESS when its assigned CrewMember.status == INACTIVE; the visit's
          own state is valid (SCHEDULED) so the rejection is driven solely by the
          sibling CrewMember's state → ERR_CREW_INACTIVE.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, a crew that is then deactivated to INACTIVE."
            - "A SCHEDULED ROUTINE visit assigned to that crew."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { visit_id: $.data.id }
            - call: "POST /crew/${crew_id}/deactivate"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_CREW_INACTIVE (Visit SCHEDULED, blocked by crew INACTIVE)"
            - "Visit.${visit_id}.status == SCHEDULED (unchanged)"

      - name: contract_activate_blocked_by_suspended_account
        grounds:
          - state_machines.ServiceContract.DRAFT_to_ACTIVE
          - entities.Account.fields.status
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - validations[priority=8]
        distinguishing_aspect: |
          A DIFFERENT entity pair than instance one — ServiceContract -> Account: a
          DRAFT contract cannot activate when its owning Account.status == SUSPENDED;
          the contract is in a valid DRAFT state, so the block comes solely from the
          ancestor Account → ERR_ACCOUNT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "An account that is then SUSPENDED, with an ACTIVE site created before suspension."
            - "A DRAFT ServiceContract for that site."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /accounts/${acct_id}/suspend"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_ACCOUNT_NOT_ACTIVE (contract DRAFT, blocked by Account SUSPENDED)"
            - "ServiceContract.${contract_id}.status == DRAFT (unchanged)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: visit_crew_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=11]
          - entities.Visit.fields.planned_start_min
          - entities.Visit.fields.planned_end_min
          - errors[ERR_CREW_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Half-open interval semantics on the Visit resource (crew/service_date):
          [planned_start_min, planned_end_min) — adjacency (end==start) is allowed,
          only a true overlap is rejected. This differs geometrically from instance
          two's closed-interval schedule windows on a different resource entity.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew."
            - "An existing SCHEDULED visit on 2026-06-16 occupying [600,660) for that crew."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 600, planned_end_min: 660, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { v1_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 660, planned_end_min: 720, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { v_adjacent_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 630, planned_end_min: 690, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "The adjacent visit on [660,720) was created successfully (201) — adjacency allowed"
            - "HTTP status == 409 for the [630,690) overlap"
            - "data.error_id == ERR_CREW_DOUBLE_BOOKED"

      - name: schedule_window_closed_interval_touching_conflict
        grounds:
          - validations[priority=12]
          - entities.RecurringSchedule.fields.window_start_min
          - entities.RecurringSchedule.fields.window_end_min
          - errors[ERR_SCHEDULE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Closed interval semantics on the RecurringSchedule resource (crew/weekday):
          [window_start_min, window_end_min] — a shared boundary minute (touching
          windows, end==start) IS a conflict, the opposite adjacency rule from the
          half-open Visit intervals; on a different resource entity.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew."
            - "An existing ACTIVE schedule for that crew on weekday 0 occupying window [600,660]."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /schedules"
              payload: { site_id: "${site_id}", weekday: 0, window_start_min: 600, window_end_min: 660, assigned_crew_id: "${crew_id}" }
              as: FieldSupervisor
              captures: { sched1_id: $.data.id }
          trigger:
            - call: "POST /schedules"
              payload: { site_id: "${site_id}", weekday: 0, window_start_min: 660, window_end_min: 720, assigned_crew_id: "${crew_id}" }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_SCHEDULE_WINDOW_CONFLICT (windows touch at 660 → closed-interval conflict)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_line_sum_equals_period_total_across_close_reopen
        grounds:
          - state_machines.BillingPeriod.OPEN_to_CLOSED
          - state_machines.BillingPeriod.CLOSED_to_REOPENED
          - entities.InvoiceLine.fields.amount_cents
          - entities.BillingPeriod.fields.total_cents
          - calculations.compute_period_total
        distinguishing_aspect: |
          Conserved quantity = sum of emitted InvoiceLine.amount_cents. On close the
          emitted lines (BASE + PERIODIC + CALLBACK_CREDIT + HOLDBACK) sum exactly to
          BillingPeriod.total_cents; the compensating reopen deletes those lines, so
          after reopen the InvoiceLine ledger is empty (sum 0) with zero drift — the
          invariant is sum(InvoiceLine.amount_cents) == total_cents while CLOSED, and
          == 0 after the compensating reopen.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, ACTIVE contract (base 300000), an OPEN period for 2026-06."
            - "Period CLOSED once (InvoiceLines emitted: BASE 300000 only, no periodic/credit/holdback)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { ver0: $.data.version }
            - call: "POST /billing-periods/${period_id}/close"
              payload: { expected_account_version: "${ver0}" }
              as: AccountManager
              captures: { closed_total: $.data.total_cents }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { ver1: $.data.version }
          trigger:
            - call: "POST /billing-periods/${period_id}/reopen"
              payload: { expected_account_version: "${ver1}" }
              as: AccountManager
            - call: "GET /billing-periods/${period_id}/invoice-lines"
              payload: {}
              as: AccountManager
              captures: { lines_after: $.data }
          assert:
            - "While CLOSED, sum of InvoiceLine.amount_cents == BillingPeriod.total_cents == 300000"
            - "After reopen, GET /billing-periods/${period_id}/invoice-lines returns an empty array (lines deleted, sum 0, no drift)"

      - name: account_version_monotonic_invariant_close_reopen_close
        grounds:
          - state_machines.BillingPeriod.OPEN_to_CLOSED
          - state_machines.BillingPeriod.CLOSED_to_REOPENED
          - state_machines.BillingPeriod.REOPENED_to_CLOSED
          - entities.Account.fields.version
          - concurrency_rules[period-close-stale-account]
        distinguishing_aspect: |
          A different conserved quantity than the InvoiceLine ledger — the monotonic
          Account.version counter. Each forward (close) and compensating (reopen) act
          increments Account.version by exactly 1, so after close→reopen→close the
          version equals its starting value + 3 with no skipped or repeated step; the
          invariant is Account.version == version_at_open + (number of close/reopen acts).
        test_recipe:
          setup:
            - "ACTIVE account (record version after period open as v_open), ACTIVE site, ACTIVE contract, OPEN period 2026-06."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { v_open: $.data.version }
            - call: "POST /billing-periods/${period_id}/close"
              payload: { expected_account_version: "${v_open}" }
              as: AccountManager
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { v_after_close: $.data.version }
            - call: "POST /billing-periods/${period_id}/reopen"
              payload: { expected_account_version: "${v_after_close}" }
              as: AccountManager
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { v_after_reopen: $.data.version }
          trigger:
            - call: "POST /billing-periods/${period_id}/close"
              payload: { expected_account_version: "${v_after_reopen}" }
              as: AccountManager
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { v_final: $.data.version }
          assert:
            - "Account.${acct_id}.version increments by exactly 1 per act: v_after_close == v_open + 1"
            - "v_after_reopen == v_open + 2"
            - "v_final == v_open + 3 (close→reopen→close, monotonic, no drift)"
