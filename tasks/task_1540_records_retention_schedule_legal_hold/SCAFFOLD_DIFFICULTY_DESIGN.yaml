              as: PlatformAdmin
              captures: { w3: "$.data.id" }
          assert:
            - "Shared-boundary window rejected: err == ERR_FREEZE_WINDOW_OVERLAP (2026-09-10T00:00:00Z belongs to both closed intervals)"
            - "Window starting one second later is created: ${w3} exists with status ACTIVE"
            - "W1 ${w1} remains ACTIVE and unchanged"

