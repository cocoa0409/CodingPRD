          The accept action is the CustomerContact's only write, and it is gated
          on ISSUED: accepting while the quote is still DRAFT returns
          409 ERR_QUOTE_STATE with accepted_by_name left null, while the same
          call after issuance moves the quote to ACCEPTED, records the signer and
          takes version from 2 to 3 without recomputing any money field.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01, account A, product PANEL-CL-10, jobsite J1 (SOIL)."
