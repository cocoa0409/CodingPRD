# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3002_flat_pack_self_serve_warehouse_home_assembly
# Breadth probe: every testable claim of §1.1–§1.7 not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners §1.8 covers appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: store_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints.POST_/api/stores
        distinguishing_aspect: "Creating a store with only name and code returns 201 with low_stock_threshold defaulted to 5, system id/created_at/updated_at present, version 1 — the threshold is never client-required."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_store
              call: "POST /api/stores"
              payload: { name: "Renton", code: "ST-001" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Store.${store_id}.low_stock_threshold == 5 (default applied)"
            - "Store.${store_id}.version == 1 and id/created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: article_create_computed_carton_fields_and_roundtrip
        claim_type: Computed Fields
        grounds:
          - entities.Article.fields.carton_count
          - entities.Article.fields.is_multi_carton
          - endpoints.GET_/api/articles/{id}
        distinguishing_aspect: "A fresh article reports carton_count 0 and is_multi_carton false; after registering two cartons GET shows carton_count 2 and is_multi_carton true while article_number and price round-trip unchanged."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
            - call: "POST /api/articles"
              payload: { article_number: "904.111.22", name: "BILLY", category: "FURNITURE", pick_policy: "SELF_SERVE", price_cents: 8900 }
              as: PlatformAdmin
              captures: { art_id: $.data.id, cc0: $.data.carton_count, mc0: $.data.is_multi_carton }
          trigger:
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "12", bin: "03", weight_kg: 18, volume_m3: 0.09 }
              as: PlatformAdmin
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 2, aisle: "12", bin: "04", weight_kg: 14, volume_m3: 0.07 }
              as: PlatformAdmin
            - call: "GET /api/articles/${art_id}"
              payload: {}
              as: StoreOps
              captures: { cc2: $.data.carton_count, mc2: $.data.is_multi_carton, an: $.data.article_number, pr: $.data.price_cents }
          assert:
            - "at creation carton_count == 0 and is_multi_carton == false"
            - "after two cartons: carton_count == 2 and is_multi_carton == true"
            - "Article.${art_id}.article_number == \"904.111.22\" and price_cents == 8900"
            - "family_price_cents and lowest_price_365d_cents are null (defaults)"

      - name: customer_create_defaults_not_member_zero_points
        claim_type: Defaults
        grounds:
          - entities.Customer.fields.member_status
          - entities.Customer.fields.points_balance
          - endpoints.POST_/api/customers
        distinguishing_aspect: "A customer created with only email and full_name starts member_status NONE, member_since null, points_balance 0 — membership is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - &k_cust
              call: "POST /api/customers"
              payload: { email: "n@example.com", full_name: "Non Member" }
              as: StoreOps
              captures: { cust_id: $.data.id, ms: $.data.member_status, pts: $.data.points_balance }
          assert:
            - "the response status is 201"
            - "Customer.${cust_id}.member_status == NONE and member_since is null"
            - "Customer.${cust_id}.points_balance == 0"

      - name: enroll_flips_member_status_and_stamps_member_since
        claim_type: System Fields
        grounds:
          - entities.Customer.fields.member_since
          - endpoints.POST_/api/customers/{id}/enroll
        distinguishing_aspect: "Enrollment sets member_status ACTIVE and stamps member_since with the logical clock time 2026-09-01T00:00:00Z — the timestamp comes from the server, not the request body."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One non-member customer."
          setup_api_calls:
            - *k_clock
            - *k_cust
          trigger:
            - &k_enroll
              call: "POST /api/customers/${cust_id}/enroll"
              payload: {}
              as: StoreOps
              captures: { ms: $.data.member_status, since: $.data.member_since }
          assert:
            - "member_status == ACTIVE"
            - "member_since == \"2026-09-01T00:00:00Z\" (server-stamped from the logical clock)"

      - name: order_get_with_unknown_id_returns_order_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/orders/{id}
          - errors.ERR_ORDER_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated order id returns the entity-specific 404 ERR_ORDER_NOT_FOUND, not a generic 400 or 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /api/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "http status == 404 and error_id == ERR_ORDER_NOT_FOUND"

      - name: orders_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/orders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three orders on one customer, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count reflects the whole filtered set, and defaults are limit 10 / offset 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N with three DRAFT orders."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /api/orders?customer_id=${cust_id}&limit=2&offset=0"
              payload: {}
              as: StoreOps
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /api/orders?customer_id=${cust_id}&limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /api/orders?customer_id=${cust_id} with no params returns 3 rows (defaults limit 10, offset 0)"
            - "GET /api/orders?customer_id=${cust_id}&status=DRAFT returns 3 rows; status=PAID returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: checkout_from_paid_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.DRAFT_to_PAID
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Checkout is only legal from DRAFT: repeating it on a PAID order fails with ERR_INVALID_STATE and no double stock decrement occurs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article A (price 500) with carton and on_hand 5. Order with 1 line qty 1 already checked out (PAID; on_hand 4)."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - &k_art_a
              call: "POST /api/articles"
              payload: { article_number: "ART-A", name: "Shelf", category: "ACCESSORY", pick_policy: "SELF_SERVE", price_cents: 500 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - &k_carton_a
              call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "01", bin: "01", weight_kg: 5, volume_m3: 0.05 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - &k_stock5
              call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 5 }
              as: StoreOps
              captures: { bs_id: $.data.id, bs_v: $.data.version }
            - &k_order
              call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - &k_line1
              call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - &k_checkout
              call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "GET /api/bin-stock/${bs_id}"
              payload: {}
              as: StoreOps
              captures: { oh: $.data.on_hand }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "BinStock.${bs_id}.on_hand == 4 (the failed checkout did not decrement again)"

      - name: fulfill_fulfilled_reservation_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.StockReservation.ACTIVE_to_FULFILLED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Terminal lockdown: fulfilling an already-FULFILLED reservation fails with ERR_INVALID_STATE and does not decrement stock a second time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. FULL_SERVE article B (price 3000) with carton (30 kg) and on_hand 3. Standalone reservation qty 1 fulfilled once (on_hand 2, reserved 0)."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "BULKY-1", name: "Sofa", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 3000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "01", weight_kg: 30, volume_m3: 0.4 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 3 }
              as: StoreOps
              captures: { bs_id: $.data.id }
            - call: "POST /api/reservations"
              payload: { store_id: "${store_id}", article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /api/reservations/${res_id}/fulfill"
              payload: {}
              as: StoreOps
          trigger:
            - call: "POST /api/reservations/${res_id}/fulfill"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
            - call: "GET /api/bin-stock/${bs_id}"
              payload: {}
              as: StoreOps
              captures: { oh: $.data.on_hand, rsv: $.data.reserved }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "BinStock.${bs_id}.on_hand == 2 and reserved == 0 (no double decrement)"

      - name: fulfill_after_expiry_transitions_expired_and_rejects
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.StockReservation.ACTIVE_to_FULFILLED
          - calculations.reservation_expiry
          - errors.ERR_RESERVATION_EXPIRED
        distinguishing_aspect: "At now >= expires_at the fulfill is rejected with ERR_RESERVATION_EXPIRED and the reservation itself transitions to EXPIRED, releasing its reserved stock — the failure is observable both as an error and as a state change."
        test_recipe:
          setup:
            - "Logical clock set to 2026-09-01T00:00:00Z, reservation created (expires 2026-09-02T00:00:00Z), then clock advanced past expiry. FULL_SERVE article with on_hand 3, reserved 1 before expiry."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "BULKY-1", name: "Sofa", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 3000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "01", weight_kg: 30, volume_m3: 0.4 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 3 }
              as: StoreOps
              captures: { bs_id: $.data.id }
            - call: "POST /api/reservations"
              payload: { store_id: "${store_id}", article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/reservations/${res_id}/fulfill"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
            - call: "GET /api/reservations/${res_id}"
              payload: {}
              as: StoreOps
              captures: { rst: $.data.status }
            - call: "GET /api/bin-stock/${bs_id}"
              payload: {}
              as: StoreOps
              captures: { oh: $.data.on_hand, rsv: $.data.reserved }
          assert:
            - "error_id == ERR_RESERVATION_EXPIRED with http 409"
            - "StockReservation.${res_id}.status == EXPIRED (lazy expiry on fulfill)"
            - "BinStock.${bs_id}.on_hand == 3 and reserved == 0 (reservation released, nothing sold)"

      - name: booking_start_from_waitlisted_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.DeliveryBooking.CONFIRMED_to_OUT_FOR_DELIVERY
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "start is legal only from CONFIRMED: a WAITLISTED booking cannot go out for delivery — ERR_INVALID_STATE, and the order's delivery_status stays WAITLISTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. FULL_SERVE article W90 (carton 90 kg / 1.0 m3) stock 4. Slot capacity 100 kg / 5 m3 with a CONFIRMED 90 kg booking; a second order's 90 kg booking is WAITLISTED."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "W90", name: "Piano", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 9000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "90", weight_kg: 90, volume_m3: 1.0 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 4 }
              as: StoreOps
            - call: "POST /api/delivery-slots"
              payload: { store_id: "${store_id}", service_date: "2026-09-10", vehicle_id: "VAN-1", zone: "ZONE_A", capacity_weight_kg: 100, capacity_volume_m3: 5 }
              as: DeliveryCoordinator
              captures: { slot_id: $.data.id, sv: $.data.version }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/lines"
              payload: { article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o1}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o1}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "ELEVATOR", floor: 1, expected_slot_version: "${sv}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { b1: $.data.id }
            - call: "GET /api/delivery-slots/${slot_id}"
              payload: {}
              as: DeliveryCoordinator
              captures: { sv2: $.data.version }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o2: $.data.id }
            - call: "POST /api/orders/${o2}/lines"
              payload: { article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o2}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o2}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "ELEVATOR", floor: 1, expected_slot_version: "${sv2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { b2: $.data.id, b2_st: $.data.status }
          trigger:
            - call: "POST /api/delivery-bookings/${b2}/start"
              payload: {}
              as: DeliveryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "precondition sanity: DeliveryBooking.${b2}.status == WAITLISTED (90 + 90 > 100 kg)"
            - "error_id == ERR_INVALID_STATE with http 409"
            - "Order.${o2}.delivery_status remains WAITLISTED"

      - name: job_complete_from_requested_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.AssemblyJob.IN_PROGRESS_to_COMPLETED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "complete requires IN_PROGRESS: completing a REQUESTED job fails with ERR_INVALID_STATE and billed_minutes stays null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article ASM requires_assembly, standard 30, stock 5. FULFILLED order with a REQUESTED job (not yet dispatched)."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - &k_asm_art
              call: "POST /api/articles"
              payload: { article_number: "ASM-1", name: "Wardrobe", category: "FURNITURE", pick_policy: "SELF_SERVE", price_cents: 1000, requires_assembly: true }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - &k_asm_carton
              call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "10", bin: "04", weight_kg: 20, volume_m3: 0.2 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 5 }
              as: StoreOps
            - &k_std30
              call: "POST /api/assembly-standards"
              payload: { article_id: "${art_id}", minutes_per_unit: 30 }
              as: PlatformAdmin
            - *k_order
            - *k_line1
            - *k_checkout
            - &k_pickup
              call: "POST /api/orders/${order_id}/pickup-complete"
              payload: {}
              as: StoreOps
            - &k_job
              call: "POST /api/orders/${order_id}/assembly-jobs"
              payload: { provider_id: "CREW-A", window_start: "2026-09-10T10:00:00Z", window_end: "2026-09-10T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-jobs/${job_id}/complete"
              payload: { actual_minutes: 25 }
              as: AssemblyProvider
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "AssemblyJob.${job_id}.status remains REQUESTED and billed_minutes is null"

      - name: claim_ship_from_submitted_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.SparePartClaim.APPROVED_to_SHIPPED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "ship is legal only from APPROVED: shipping a SUBMITTED claim fails with ERR_INVALID_STATE and the claim remains SUBMITTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer N. Article A exists. One SUBMITTED claim (part value 500)."
          setup_api_calls:
            - *k_clock
            - *k_cust
            - *k_art_a
            - *k_carton_a
            - &k_claim
              call: "POST /api/spare-part-claims"
              payload: { article_id: "${art_id}", part_number: "P-100", part_value_cents: 500, reason: "cam lock cracked" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /api/spare-part-claims/${claim_id}/ship"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "SparePartClaim.${claim_id}.status remains SUBMITTED"

      - name: settle_with_ungraded_lines_returns_ungraded_lines
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ReturnRequest.GRADING_to_SETTLED
          - errors.ERR_UNGRADED_LINES
        distinguishing_aspect: "Settle requires every line graded: with one of two lines ungraded the settle fails with ERR_UNGRADED_LINES and no restock or refund occurs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article A (price 500) stock 5. Order qty 2 checked out and FULFILLED. Receipted return with two lines of qty 1; only the first line graded."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_art_a
            - *k_carton_a
            - *k_stock5
            - *k_order
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_id}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - *k_checkout
            - *k_pickup
            - call: "POST /api/returns"
              payload: { order_id: "${order_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /api/returns/${ret_id}/lines"
              payload: { article_id: "${art_id}", qty: 1, assembly_state: "UNOPENED", order_line_id: "${line_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rl1: $.data.id }
            - call: "POST /api/returns/${ret_id}/lines"
              payload: { article_id: "${art_id}", qty: 1, assembly_state: "UNOPENED", order_line_id: "${line_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/returns/${ret_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/returns/${ret_id}/lines/${rl1}/grade"
              payload: { condition_grade: "LIKE_NEW" }
              as: StoreOps
          trigger:
            - call: "POST /api/returns/${ret_id}/settle"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
            - call: "GET /api/bin-stock/${bs_id}"
              payload: {}
              as: StoreOps
              captures: { oh: $.data.on_hand }
          assert:
            - "error_id == ERR_UNGRADED_LINES with http 409"
            - "ReturnRequest.${ret_id}.status remains GRADING (auto-moved by the first grade)"
            - "BinStock.${bs_id}.on_hand == 3 (no partial restock from the failed settle)"

      - name: order_close_from_paid_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.FULFILLED_to_CLOSED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "close requires FULFILLED or DELIVERED: closing a merely PAID order fails with ERR_INVALID_STATE and credits no points."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member customer M. Article A stock 5. Order qty 1 checked out (PAID), pickup not completed."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_enroll
            - *k_art_a
            - *k_carton_a
            - *k_stock5
            - *k_order
            - *k_line1
            - *k_checkout
          trigger:
            - call: "POST /api/orders/${order_id}/close"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "Order.${order_id}.status remains PAID and Customer.${cust_id}.points_balance == 0"

      - name: checkout_fullserve_line_autocreates_reservation
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Order.DRAFT_to_PAID
          - entities.StockReservation.fields.order_line_id
          - entities.BinStock.fields.reserved
        distinguishing_aspect: "Checkout of a CARRYOUT order with a FULL_SERVE line auto-creates an ACTIVE reservation bound to the order line with expires_at = now + 24h, moving stock from available to reserved without touching on_hand."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. FULL_SERVE article B with carton, on_hand 3. CARRYOUT order with one line qty 1."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "BULKY-1", name: "Sofa", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 3000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "01", weight_kg: 30, volume_m3: 0.4 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 3 }
              as: StoreOps
              captures: { bs_id: $.data.id }
            - *k_order
            - *k_line1
          trigger:
            - *k_checkout
            - call: "GET /api/reservations?order_line_id=${line_id}"
              payload: {}
              as: StoreOps
            - call: "GET /api/bin-stock/${bs_id}"
              payload: {}
              as: StoreOps
              captures: { oh: $.data.on_hand, rsv: $.data.reserved }
          assert:
            - "exactly one StockReservation exists with order_line_id == ${line_id}, status ACTIVE, qty 1"
            - "reservation expires_at == \"2026-09-02T00:00:00Z\" (created 2026-09-01T00:00:00Z + 24h)"
            - "BinStock.${bs_id}.on_hand == 3 and reserved == 1 (reserved, not yet sold)"
            - "Order.${order_id}.status == PAID"

      - name: order_cancel_compensates_stock_reservations_and_points
        claim_type: Compensation
        grounds:
          - state_machines.Order.PAID_to_CANCELLED
          - state_machines.StockReservation.ACTIVE_to_CANCELLED
        distinguishing_aspect: "Cancelling a PAID CARRYOUT order unwinds every checkout side effect: SELF_PICK units restock, the auto-created PICKUP_COUNTER reservation is CANCELLED, and redeemed points return to the customer's balance."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member customer M. SELF_SERVE article A (price 500, stock 5) and FULL_SERVE article B (price 3000, stock 3). M has points_balance 1000 (seeded via a prior closed order of 100000 cents). Order with 1 x A and 1 x B checked out with redeem_points 700 (cap floor(3500 x 0.20) = 700)."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_enroll
            - *k_art_a
            - *k_carton_a
            - *k_stock5
            - call: "POST /api/articles"
              payload: { article_number: "BULKY-1", name: "Sofa", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 3000 }
              as: PlatformAdmin
              captures: { art_b: $.data.id }
            - call: "POST /api/articles/${art_b}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "01", weight_kg: 30, volume_m3: 0.4 }
              as: PlatformAdmin
              captures: { carton_b: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_b}", on_hand: 3 }
              as: StoreOps
              captures: { bs_b: $.data.id }
            # seed 1000 points: closed order of total 100000 (qty 1 of a 100000-cent article)
            - call: "POST /api/articles"
              payload: { article_number: "BIG-1", name: "Kitchen", category: "FURNITURE", pick_policy: "SELF_SERVE", price_cents: 100000 }
              as: PlatformAdmin
              captures: { art_big: $.data.id }
            - call: "POST /api/articles/${art_big}/cartons"
              payload: { carton_seq: 1, aisle: "99", bin: "01", weight_kg: 10, volume_m3: 0.1 }
              as: PlatformAdmin
              captures: { carton_big: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_big}", on_hand: 2 }
              as: StoreOps
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_seed: $.data.id }
            - call: "POST /api/orders/${o_seed}/lines"
              payload: { article_id: "${art_big}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o_seed}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o_seed}/pickup-complete"
              payload: {}
              as: StoreOps
            - call: "POST /api/orders/${o_seed}/close"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            # target order: 1 x A (500) + 1 x B (3000)
            - *k_order
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_b}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_b: $.data.id }
            - call: "POST /api/orders/${order_id}/checkout"
              payload: { redeem_points: 700 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { tot: $.data.total_cents, pd: $.data.points_discount_cents }
          trigger:
            - call: "POST /api/orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_st: $.data.status }
            - call: "GET /api/bin-stock/${bs_id}"
              payload: {}
              as: StoreOps
              captures: { oh_a: $.data.on_hand }
            - call: "GET /api/bin-stock/${bs_b}"
              payload: {}
              as: StoreOps
              captures: { oh_b: $.data.on_hand, rsv_b: $.data.reserved }
            - call: "GET /api/reservations?order_line_id=${line_b}"
              payload: {}
              as: StoreOps
            - call: "GET /api/customers/${cust_id}"
              payload: {}
              as: StoreOps
              captures: { pts: $.data.points_balance }
          assert:
            - "checkout sanity: total_cents == 2800 and points_discount_cents == 700 (cap floor(3500 x 0.20)); balance was 1000 - 700 = 300"
            - "Order.${order_id}.status == CANCELLED"
            - "SELF_PICK restock: BinStock.${bs_id}.on_hand == 5"
            - "reservation compensation: BinStock.${bs_b}.on_hand == 3 and reserved == 0; the auto-reservation's status == CANCELLED"
            - "points re-credited: Customer.${cust_id}.points_balance == 1000"

  # ===========================================================================
  - section: calculations
    instances:
      - name: signal_threshold_boundary_in_stock_vs_low_stock
        claim_type: Correct Result
        grounds:
          - calculations.stock_availability_and_signal
          - endpoints.GET_/api/stores/{id}/articles/{article_id}/signal
        distinguishing_aspect: "With the default threshold 5, available == 5 signals IN_STOCK while available == 4 (one unit lower, reached by an OCC-guarded adjustment) signals LOW_STOCK — the >= comparison is inclusive at the threshold."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001 (threshold 5). Article A single carton, on_hand 5."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_art_a
            - *k_carton_a
            - *k_stock5
          trigger:
            - call: "GET /api/stores/${store_id}/articles/${art_id}/signal"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sig5: $.data.signal, av5: $.data.available_units, th: $.data.threshold_used }
            - call: "POST /api/bin-stock/${bs_id}/adjust"
              payload: { delta_on_hand: -1, expected_stock_version: "${bs_v}" }
              as: StoreOps
            - call: "GET /api/stores/${store_id}/articles/${art_id}/signal"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sig4: $.data.signal, av4: $.data.available_units }
          assert:
            - "at available 5: signal == IN_STOCK, available_units == 5, threshold_used == 5"
            - "at available 4: signal == LOW_STOCK, available_units == 4"
            - "note: the adjustment carries the version captured at stock creation; nothing mutated the row in between"

      - name: signal_multi_carton_min_over_cartons
        claim_type: Input Set Filtering
        grounds:
          - calculations.stock_availability_and_signal
          - entities.Article.fields.is_multi_carton
        distinguishing_aspect: "Article availability is the MINIMUM over cartons, not the sum: a two-carton article with carton availabilities 7 and 4 signals LOW_STOCK at available_units 4 even though 11 physical boxes sit on shelves."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001 (threshold 5). Two-carton article MC; carton 1 on_hand 7, carton 2 on_hand 4."
          setup_api_calls:
            - *k_clock
            - *k_store
            - call: "POST /api/articles"
              payload: { article_number: "MC-1", name: "Combo Desk", category: "FURNITURE", pick_policy: "SELF_SERVE", price_cents: 5000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "20", bin: "01", weight_kg: 10, volume_m3: 0.1 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 2, aisle: "20", bin: "02", weight_kg: 8, volume_m3: 0.08 }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${c1}", on_hand: 7 }
              as: StoreOps
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${c2}", on_hand: 4 }
              as: StoreOps
          trigger:
            - call: "GET /api/stores/${store_id}/articles/${art_id}/signal"
              payload: {}
              as: StoreOps
              captures: { sig: $.data.signal, av: $.data.available_units }
          assert:
            - "available_units == 4 (min over cartons, not 7 and not 11)"
            - "signal == LOW_STOCK (4 < threshold 5) despite carton 1 alone exceeding the threshold"

      - name: family_price_applies_only_to_members
        claim_type: Correct Result
        grounds:
          - calculations.order_pricing
          - entities.Article.fields.family_price_cents
        distinguishing_aspect: "An article with family_price_cents 799 vs price_cents 999 bills a member 799 per unit but a non-member 999 — membership pricing is conditional on member_status at checkout, and unit_price_cents is frozen on the line."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member M and non-member N. Article FP (price 999, family_price 799, ACCESSORY), stock 10."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/customers"
              payload: { email: "m2@example.com", full_name: "Member Two" }
              as: StoreOps
              captures: { mem_id: $.data.id }
            - call: "POST /api/customers/${mem_id}/enroll"
              payload: {}
              as: StoreOps
            - call: "POST /api/articles"
              payload: { article_number: "FP-1", name: "Mug", category: "ACCESSORY", pick_policy: "SELF_SERVE", price_cents: 999, family_price_cents: 799 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "03", bin: "02", weight_kg: 1, volume_m3: 0.01 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 10 }
              as: StoreOps
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${mem_id}"
              captures: { o_mem: $.data.id }
            - call: "POST /api/orders/${o_mem}/lines"
              payload: { article_id: "${art_id}", qty: 2 }
              as: Customer
              as_user_id: "${mem_id}"
              captures: { line_mem: $.data.id }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_non: $.data.id }
            - call: "POST /api/orders/${o_non}/lines"
              payload: { article_id: "${art_id}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_non: $.data.id }
          trigger:
            - call: "POST /api/orders/${o_mem}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${mem_id}"
              captures: { tot_mem: $.data.total_cents }
            - call: "POST /api/orders/${o_non}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { tot_non: $.data.total_cents }
          assert:
            - "member order total_cents == 1598 (2 x 799); OrderLine.${line_mem}.unit_price_cents == 799"
            - "non-member order total_cents == 1998 (2 x 999); OrderLine.${line_non}.unit_price_cents == 999"
            - "discount_cents == 0 on both (family price is a price basis, not a food discount)"

      - name: points_redemption_capped_at_twenty_percent
        claim_type: Constants Applied
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.points_discount_cents
        distinguishing_aspect: "A member with 1000 points redeeming 500 on a 1000-cent order is capped at floor(1000 x 0.20) = 200 points — the cap binds below both the request and the balance."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member M with points_balance 1000 (seeded by a closed 100000-cent order). Article A (price 500) stock 10. Target order qty 2 (subtotal 1000)."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_enroll
            - *k_art_a
            - *k_carton_a
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 10 }
              as: StoreOps
              captures: { bs_id: $.data.id }
            - call: "POST /api/articles"
              payload: { article_number: "BIG-1", name: "Kitchen", category: "FURNITURE", pick_policy: "SELF_SERVE", price_cents: 100000 }
              as: PlatformAdmin
              captures: { art_big: $.data.id }
            - call: "POST /api/articles/${art_big}/cartons"
              payload: { carton_seq: 1, aisle: "99", bin: "01", weight_kg: 10, volume_m3: 0.1 }
              as: PlatformAdmin
