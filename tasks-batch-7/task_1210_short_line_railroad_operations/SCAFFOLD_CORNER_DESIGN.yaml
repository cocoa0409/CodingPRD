      - name: inspection_overdue_boundary_seconds
        claim_type: threshold_boundary
        grounds: [calculations.inspection_overdue, entities.TrackSegment.fields.is_overdue]
        distinguishing_aspect: "CLASS_3 (3-day frequency) created at the default clock: at exactly 2026-05-04T00:00:00Z the segment is NOT overdue (strictly-greater comparison); one second later the sweep restricts it."
        test_recipe:
          setup: ["CLASS_3 segment created at the default clock 2026-05-01T00:00:00Z, never inspected"]
          setup_api_calls:
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 25-28", milepost_start: 25, milepost_end: 28, fra_class: CLASS_3 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /rail/track-segments/${seg_id}"
              payload: {}
              as: SystemAdmin
              captures: { st_at: $.data.status, od_at: $.data.is_overdue }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:01Z" }
              as: SystemAdmin
            - call: "GET /rail/track-segments/${seg_id}"
              payload: {}
              as: SystemAdmin
              captures: { st_after: $.data.status, od_after: $.data.is_overdue }
          assert:
            - "captured st_at == IN_SERVICE and od_at == false (exactly at the deadline is not overdue)"
            - "captured st_after == RESTRICTED and od_after == true (one second past the deadline)"

      - name: effective_speed_monitor_defect_cap
        claim_type: correct_result
        grounds: [calculations.effective_speed_limit, entities.TrackSegment.fields.effective_speed_mph]
        distinguishing_aspect: "A MONITOR defect caps a CLASS_4 segment to 25 mph (min(60, 25)) but leaves status IN_SERVICE — only CRITICAL restricts."
        test_recipe:
          setup: ["CLASS_4 segment with a filed MONITOR defect"]
          setup_api_calls:
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 29-34", milepost_start: 29, milepost_end: 34, fra_class: CLASS_4 }
