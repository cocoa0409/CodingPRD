          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z. ORTHOPEDIC_SURGERY class at base_rate_per_million 24800.00; every insured is MARICOPA_AZ (venue factor 1.00) at high_severity_procedure_pct 30, so all three price off the same 24800.00 manual premium ladder except for the step factor."
