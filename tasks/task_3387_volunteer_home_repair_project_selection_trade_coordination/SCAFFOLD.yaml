    roles: [Any]
    code: 200
    input: ["project_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: "TradeWorkOrder[]"
    side_effects: []

  - method: GET
    path: "/rebuild/trade-work-orders/{workOrderId}"
    description: "Get one work order"
    roles: [Any]
    code: 200
    input: []
    output: TradeWorkOrder
    side_effects: []

  - method: POST
    path: "/rebuild/trade-work-orders/{workOrderId}/schedule"
    description: "Set the visit window (half-open [visit_start, visit_end)); credential, overlap, and day-capacity checks"
    roles: [AffiliateStaff]
    code: 200
    input: [visit_start, visit_end]
    output: TradeWorkOrder
