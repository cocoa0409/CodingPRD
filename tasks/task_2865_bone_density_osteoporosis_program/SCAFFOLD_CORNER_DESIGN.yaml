              payload: {}
              as: ProgramAdmin
          assert:
            - "CalibrationEvent.${cal1_id}.required_phantom_runs == 3"
            - "CalibrationEvent.${cal1_id}.baseline_run_count == 3"
            - "CalibrationEvent.${cal1_id}.new_run_count == 3"
            - "CalibrationEvent.${cal1_id}.baseline_mean_bmd_g_cm2 == 1.0000"
            - "CalibrationEvent.${cal1_id}.new_mean_bmd_g_cm2 == 1.0090"
            - "CalibrationEvent.${cal1_id}.percent_difference == 0.90"
            - "CalibrationEvent.${cal1_id}.outcome_code == WITHIN_TOLERANCE_NO_FACTOR"
            - "CalibrationEvent.${cal1_id}.proposed_cross_cal_factor == 1.0000"
            - "CalibrationEvent.${cal1_id}.status == APPROVED"
            - "Densitometer.${dev_b_id}.cross_cal_factor == 1.0"
            - "Densitometer.${dev_b_id}.calibration_generation == 2"
            - "Densitometer.${dev_b_id}.status == ACTIVE after the first adjudication"
            - "Densitometer.${dev_b_id}.consecutive_qc_pass_count == 0"
            - "CalibrationEvent.${cal2_id}.percent_difference == 6.00"
            - "CalibrationEvent.${cal2_id}.outcome_code == REJECTED_EXCESSIVE_DRIFT"
            - "CalibrationEvent.${cal2_id}.proposed_cross_cal_factor == null"
            - "CalibrationEvent.${cal2_id}.status == REJECTED"
            - "Densitometer.${dev_b_id}.status == CROSS_CAL_PENDING after the second adjudication"
