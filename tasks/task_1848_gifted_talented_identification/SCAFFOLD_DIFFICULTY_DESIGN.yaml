            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ABILITY", percentile: 99, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 90, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 88, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "SCORING" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/finalize-scoring", payload: {}, as: GiftedCoordinator }
          trigger:
            - { call: "POST /gifted/cases/${case_id}/placements", payload: { site_id: "${site_id}", service_model: "PULL_OUT", start_on: "2026-09-01" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_CASE_STATE (http 409): placement offers require an IDENTIFIED case"
            - "no ServicePlacement row is created for the case (GET /gifted/cases/${case_id}/placements returns empty list)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: cycle_windows_overlap_half_open_adjacency
        grounds:
          - validations[priority=11]
          - entities.ScreeningCycle.fields.screening_open_on
        distinguishing_aspect: |
          Half-open interval semantics on the grade-band calendar resource: a second ELEMENTARY
          cycle whose window [2026-11-01, 2027-03-01) intersects [2026-08-15, 2026-12-15) is
          rejected, while an exactly adjacent window [2026-12-15, 2027-04-01) is accepted
          (touching endpoints do not overlap), and an overlapping window in a different band
          (MIDDLE) is accepted (the resource is band-scoped).
        test_recipe:
          setup:
            - "one ELEMENTARY cycle exists with window [2026-08-15, 2026-12-15)"
          setup_api_calls:
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id } }
          trigger:
            - { call: "POST /gifted/screening-cycles", payload: { name: "Winter ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-11-01", screening_close_on: "2027-03-01", referral_close_on: "2026-12-15" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Spring ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-12-15", screening_close_on: "2027-04-01", referral_close_on: "2027-01-31" }, as: GiftedCoordinator, captures: { cyc_c: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Winter MS", school_year: "2026-2027", grade_band: "MIDDLE", screening_open_on: "2026-11-01", screening_close_on: "2027-03-01", referral_close_on: "2026-12-15" }, as: GiftedCoordinator, captures: { cyc_d: $.data.id } }
          assert:
            - "overlapping same-band cycle: err == ERR_CYCLE_WINDOW_OVERLAP (http 409)"
            - "adjacent same-band cycle (open == prior close): created 201, status DRAFT (half-open adjacency is allowed)"
            - "overlapping different-band cycle: created 201 (the protected resource is per grade_band)"

      - name: placement_open_ended_period_overlap
        grounds:
          - validations[priority=11]
          - entities.ServicePlacement.fields.end_on
        distinguishing_aspect: |
          Different interval semantics on a different resource: a student's service periods are
          open-ended intervals [start_on, end_on) with end_on == null meaning infinity. A new
          placement offer for a student holding an ACTIVE (open-ended) placement overlaps any
          future start date and is rejected — unlike the bounded half-open cycle windows where
          adjacency is permitted.
        test_recipe:
          setup:
            - "clock 2026-08-20; site; student honored via TRANSFER_HONOR -> IDENTIFIED"
            - "PULL_OUT placement offered and accepted -> ACTIVE, start_on 2026-09-01, end_on null"
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site L", code: "SL", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-L", legal_name: "Stu L", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-l" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/placements", payload: { site_id: "${site_id}", service_model: "PULL_OUT", start_on: "2026-09-01" }, as: GiftedCoordinator, captures: { plc: $.data.id } }
            - { call: "POST /gifted/placements/${plc}/accept", payload: {}, as: ParentGuardian, as_user_id: "guard-l" }
          trigger:
            - { call: "POST /gifted/cases/${case_id}/placements", payload: { site_id: "${site_id}", service_model: "CLUSTER", start_on: "2027-01-01" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PLACEMENT_PERIOD_OVERLAP (http 409): the ACTIVE placement's open-ended period (end_on null = infinity) overlaps any future start"
            - "ServicePlacement.${plc} remains ACTIVE with end_on == null"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: seat_inventory_conserved_across_accept_withdraw
        grounds:
          - calculations.seat_availability
          - state_machines.ServicePlacement.OFFERED_to_ACTIVE
          - state_machines.ServicePlacement.ACTIVE_to_EXITED
        distinguishing_aspect: |
          Conserved quantity = ACTIVE seat count: occupied(site, model) = |placements with
          status ACTIVE|, invariant 0 <= occupied <= capacity. The forward action (accept:
          occupied 0 -> 1) paired with its compensating action (withdraw: occupied 1 -> 0)
          leaves pull_out_occupied exactly at its pre-accept value — zero drift.
        test_recipe:
          setup:
            - "clock 2026-08-20; site pull_out_capacity 2; student honored via TRANSFER_HONOR"
            - "PULL_OUT placement offered (OFFERED holds no seat: occupied still 0)"
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site I", code: "SI", pull_out_capacity: 2, cluster_capacity: 2, acceleration_capacity: 2 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-I", legal_name: "Stu I", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-i" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/placements", payload: { site_id: "${site_id}", service_model: "PULL_OUT", start_on: "2026-09-01" }, as: GiftedCoordinator, captures: { plc: $.data.id } }
            - { call: "GET /gifted/school-sites/${site_id}", as: GiftedCoordinator, captures: { occ_before: $.data.pull_out_occupied } }
          trigger:
            - { call: "POST /gifted/placements/${plc}/accept", payload: {}, as: ParentGuardian, as_user_id: "guard-i" }
            - { call: "GET /gifted/school-sites/${site_id}", as: GiftedCoordinator, captures: { occ_mid: $.data.pull_out_occupied } }
            - { call: "POST /gifted/placements/${plc}/withdraw", payload: {}, as: GiftedCoordinator }
            - { call: "GET /gifted/school-sites/${site_id}", as: GiftedCoordinator, captures: { occ_after: $.data.pull_out_occupied } }
          assert:
            - "occ_before == 0 (OFFERED consumes no seat); occ_mid == 1 (accept consumed one); occ_after == 0 (withdraw released exactly the accepted seat)"
            - "the accept/withdraw round trip conserves seat inventory: occ_after == occ_before"
            - "ServicePlacement.${plc}.status == EXITED with end_on == 2026-08-20"

      - name: interim_projection_conserved_across_decision
        grounds:
          - calculations.disproportionality_risk_ratio
          - state_machines.GiftedCase.AWAITING_COMMITTEE_to_IDENTIFIED
        distinguishing_aspect: |
          Conserved quantity = the INTERIM projected-identification total (a partition sum over
          demographic groups), a different conserved quantity than seat inventory:
          total_identified = |IDENTIFIED| + |AWAITING_COMMITTEE| + |APPEAL_PENDING| per cycle and
          sum over groups of group_metrics.identified == total_identified. The forward action
          (committee QUALIFY moves a case AWAITING_COMMITTEE -> IDENTIFIED) paired with its
          projection-side compensation (the case was already counted as projected) leaves the
          INTERIM total unchanged: 2 before, 2 after.
        test_recipe:
          setup:
            - "clock 2026-08-20; site; two grade-3 WHITE students: W1 honored via TRANSFER_HONOR (IDENTIFIED), W2 scored into the band (AWAITING_COMMITTEE, composite 94)"
            - "cycle in REVIEW with a BAND_REVIEW open on W2's case"
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site J", code: "SJ", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-J1", legal_name: "Stu J1", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-j1" }, as: GiftedCoordinator, captures: { stu1: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu1}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-J2", legal_name: "Stu J2", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-j2" }, as: GiftedCoordinator, captures: { stu2: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu2}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case2: $.data.id } }
            - { call: "POST /gifted/cases/${case2}/measure-scores", payload: { measure_type: "ABILITY", percentile: 99, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case2}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 90, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case2}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 88, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "SCORING" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case2}/finalize-scoring", payload: {}, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "REVIEW" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case2}/committee-reviews", payload: { review_kind: "BAND_REVIEW", grounds: "band" }, as: GiftedCoordinator, captures: { rev: $.data.id } }
          trigger:
            - { call: "GET /gifted/screening-cycles/${cyc}/disproportionality-report?variant=INTERIM", as: GiftedCoordinator, captures: { tot_before: $.data.total_identified } }
            - { call: "POST /gifted/committee-reviews/${rev}/votes", payload: { verdict: "QUALIFY" }, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /gifted/committee-reviews/${rev}/votes", payload: { verdict: "QUALIFY" }, as: CommitteeMember, as_user_id: "cm-2" }
            - { call: "GET /gifted/screening-cycles/${cyc}/disproportionality-report?variant=INTERIM", as: GiftedCoordinator, captures: { tot_after: $.data.total_identified } }
          assert:
            - "tot_before == 2 (1 IDENTIFIED + 1 AWAITING_COMMITTEE projected); tot_after == 2 (2 IDENTIFIED): the INTERIM projection total is conserved across the QUALIFY decision"
            - "both reports: sum over group_metrics.identified == total_identified == 2 (partition conservation), group_metrics[WHITE].enrolled == 2"
            - "GiftedCase.${case2}.status == IDENTIFIED after the second vote"
