  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: negotiation_cycle_bounded_at_three_offer_rounds_fourth_offer_rejected
        grounds:
          - state_machines.Application.OFFER_ISSUED_to_COUNTERED
          - state_machines.Application.COUNTERED_to_OFFER_ISSUED
          - entities.Application.fields.negotiation_round_count
          - entities.PreservationProgram.fields.max_negotiation_rounds
          - entities.NegotiationRound
          - validations[priority=21]
          - endpoints[POST /applications/{id}/counters]
        distinguishing_aspect: |
          CYCLIC shape with a hard loop bound. OFFER_ISSUED -> COUNTERED -> OFFER_ISSUED is
          traversed twice, so the entity re-enters a state it has already occupied and the
          only thing preventing an infinite loop is the monotone negotiation_round_count
          measured against PreservationProgram.max_negotiation_rounds == 3. A linear reading
          of the machine would either forbid the second COUNTERED -> OFFER_ISSUED hop or
          allow it forever; the append-only NegotiationRound ledger records all six hops
          while the counter advances only on OFFER-kind rows.
        test_recipe:
          setup:
            - "Program P1 (max_negotiation_rounds 3) with its three funding sources; round R1 OPEN."
            - "Application AP1 on Parcel PA1 is RANKED with certified_easement_value_cents 175,550,000. Clock is 2026-10-05."
            - "Three offer/counter pairs are exchanged: offer 150,000,000 -> counter 160,000,000 -> offer 162,000,000 -> counter 168,000,000 -> offer 170,000,000 -> counter 175,000,000. Every offer is at or below the certified value and every counter strictly exceeds the standing offer, so no fiscal validation fires."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - *c_appraisal_a
            - *c_clk_0820
            - *c_appr_submit_a
            - *c_appr_certify_a
            - *c_clk_1001
            - *c_rank_receipt_r1
            - *c_clk_1005
            - call: "GET /applications/${app_a_id}"
              payload: {}
              as: ProgramAdmin
