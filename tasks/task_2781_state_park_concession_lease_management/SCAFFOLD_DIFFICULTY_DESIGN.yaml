  - rule_id: boundary_precision_check
    instances:

      - name: proposal_at_exact_minimum_franchise_fee_is_responsive
        grounds:
          - validations[priority=42]
          - entities.Prospectus.fields.minimum_franchise_fee_pct
          - entities.Proposal.fields.offered_franchise_fee_pct
          - errors[ERR_FEE_BELOW_MINIMUM]
        distinguishing_aspect: |
          Metric: the offered franchise fee percentage against the prospectus minimum on
          POST /proposals. An offer of exactly 4.00 against a 4.00 minimum is responsive
          (the comparison is >=, not >), while 3.99 — one hundredth below — is refused with
          ERR_FEE_BELOW_MINIMUM at 422.
        test_recipe:
          setup:
            - "A park, an approved opportunity and an ISSUED prospectus whose minimum_franchise_fee_pct is exactly 4.00 and minimum_annual_guarantee_cents is 6,000,000."
            - "Two eligible offerors so that the duplicate-proposal rule (one proposal per prospectus per offeror) does not interfere."
            - "The clock is at 2027-01-05, inside the submission window that closes 2027-02-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
