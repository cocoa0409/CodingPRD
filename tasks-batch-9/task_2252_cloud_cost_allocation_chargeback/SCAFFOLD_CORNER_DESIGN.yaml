              - "At 2026-08-12T00:00:00Z: HTTP 201, data.status == \"OPEN\", data.filed_by_business_unit_id == ${bu_id}, data.review_round == 0."
              - "The invoice's dispute_status is then \"DISPUTED\" and the absorbed record moved to DISPUTED_HOLD."

        - name: publishing_a_chargeback_run_to_a_showback_only_unit_is_rejected
          claim_type: Violation → Error
          grounds: "§1.4 priority 62 ERR_BU_NOT_CHARGEBACK_ENABLED (422) on publish and issue; §1.1 BusinessUnit.chargeback_enabled defaults to false; §1.2 AllocationRun COMPUTED_FINAL -> PUBLISHED precondition on chargeback_enabled."
          distinguishing_aspect: "Conditional validation driven by a feature flag on a related entity: the identical publish call flips from 422 to 200 after a PATCH toggles the flag, with no change to the run or its lines."
