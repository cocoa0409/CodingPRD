scaffold_corner_design:
  # ===========================================================================
  # Section 1 — entities
  # ===========================================================================
  - section: entities
    instances:
      - name: booking_create_applies_defaults_and_computes_duration
        claim_type: creation_defaults_computed
        grounds:
          - entities.ShootBooking.fields.wants_virtual_tour
          - entities.ShootBooking.fields.license_tier
          - entities.ShootBooking.fields.shoot_duration_minutes
          - entities.ShootBooking.fields.scheduled_end_utc
          - calculations.shoot_duration
        distinguishing_aspect: "Create with optional fields omitted: defaults applied (wants_virtual_tour=false, license_tier=MLS_COMPLIANT, is_twilight=false), STANDARD/20 -> shoot_duration_minutes=60 and scheduled_end_utc=start+60min; state=DRAFT; version=1; server mints id and created_at."
        test_recipe:
          setup: ["Market DEN exists; agent A registered; clock at 2026-08-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
          trigger:
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-DEF", market_id: "${mkt}", property_address: "1 Default Dr", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-10T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk: $.data.id }
          assert:
            - "response.code == 201"
            - "ShootBooking.${bk}.state == DRAFT and version == 1"
            - "ShootBooking.${bk}.wants_virtual_tour == false and license_tier == MLS_COMPLIANT and is_twilight == false"
            - "ShootBooking.${bk}.shoot_duration_minutes == 60"
            - "ShootBooking.${bk}.scheduled_end_utc == 2026-08-10T15:00:00Z"
            - "ShootBooking.${bk}.client_agent_id == ${agent}"
            - "ShootBooking.${bk}.reschedule_count == 0 and revisions_used == 0 and weather_credit_cents == 0"

      - name: booking_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.ShootBooking.fields.property_address
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field property_address on booking create is rejected with ERR_INVALID_REQUEST (400); no booking is persisted."
        test_recipe:
          setup: ["Market DEN; agent A"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
          trigger:
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-BAD", market_id: "${mkt}", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-10T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: booking_create_invalid_enum_equipment_package_rejected
        claim_type: type_constraints
        grounds:
          - entities.ShootBooking.fields.equipment_package
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "equipment_package must be one of STANDARD|PREMIUM|LUXURY; 'GOLD' is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Market DEN; agent A"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
          trigger:
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-ENUM", market_id: "${mkt}", property_address: "2 Enum Ave", equipment_package: "GOLD", photo_count: 20, scheduled_start_utc: "2026-08-10T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: get_nonexistent_booking_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but non-existent booking id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB; clock set"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "GET /shoot-bookings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: reschedule_event_is_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.RescheduleEvent
        distinguishing_aspect: "RescheduleEvent (common_fields: false) has no PATCH/PUT/DELETE endpoint and no version field; it is an append-only audit record readable only via GET list."
        test_recipe:
          setup: ["Any booking with one reschedule event (covered by difficulty instances)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${mkt}", full_name: "Pat Photo", email: "pat@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
              captures: { photog: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-IMM", market_id: "${mkt}", property_address: "3 Immutable Way", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-05T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk: $.data.id }
            - call: "POST /shoot-bookings/${bk}/submit"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "GET /shoot-bookings/${bk}/checklist-items"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { i0: "$.data[0].id", i1: "$.data[1].id", i2: "$.data[2].id", i3: "$.data[3].id", i4: "$.data[4].id" }
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i0}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i1}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i2}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i3}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i4}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${bk}/assign"
              payload: { photographer_id: "${photog}" }
              as: Coordinator
            - call: "POST /shoot-bookings/${bk}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /shoot-bookings/${bk}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk_v: $.data.version }
            - call: "POST /shoot-bookings/${bk}/reschedule"
              payload: { expected_booking_version: "${bk_v}", kind: "CLIENT", new_start_utc: "2026-08-06T14:00:00Z", reason_code: "SELLER_DELAY" }
              as: ClientAgent
              as_user_id: "${agent}"
          trigger:
            - call: "GET /shoot-bookings/${bk}/reschedule-events"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
          assert:
            - "list contains exactly 1 RescheduleEvent with kind == CLIENT, old_start_utc == 2026-08-05T14:00:00Z, new_start_utc == 2026-08-06T14:00:00Z, credit_applied_cents == 0 (CLIENT kind earns no weather credit)"
            - "RescheduleEvent has id and created_at but no version field"

      - name: photographer_list_filter_by_market_and_pagination
        claim_type: listing
        grounds:
          - entities.Photographer.fields.market_id
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /photographers?market_id=X returns only photographers in that market; response envelope carries limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Two markets DEN + ATX; two photographers in DEN, one in ATX"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { den: $.data.id }
            - call: "POST /markets"
              payload: { market_code: "ATX", display_name: "Austin", pricing_multiplier_bps: 12500, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { atx: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${den}", full_name: "P One", email: "p1@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
            - call: "POST /photographers"
              payload: { market_id: "${den}", full_name: "P Two", email: "p2@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
            - call: "POST /photographers"
              payload: { market_id: "${atx}", full_name: "P Three", email: "p3@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
          trigger:
            - call: "GET /photographers?market_id=${den}&limit=1&offset=0"
              payload: {}
              as: Coordinator
          assert:
            - "response.meta exists; data is array of length 1 (limit honored)"
            - "pagination block: total_count == 2 for market DEN and has_more == true"
            - "every returned Photographer.market_id == ${den}"

  # ===========================================================================
  # Section 2 — state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: deliver_from_confirmed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ShootBooking
          - errors[ERR_BOOKING_NOT_IN_EDIT]
        distinguishing_aspect: "deliver is only legal from IN_EDIT or REVISION_REQUESTED; calling it while CONFIRMED (no mark-shot yet) is rejected and no AssetBundle is created."
        test_recipe:
          setup: ["Booking in CONFIRMED via full pipeline"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${mkt}", full_name: "Pat Photo", email: "pat@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
              captures: { photog: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-INV1", market_id: "${mkt}", property_address: "9 State St", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-05T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk: $.data.id }
            - call: "POST /shoot-bookings/${bk}/submit"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "GET /shoot-bookings/${bk}/checklist-items"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { i0: "$.data[0].id", i1: "$.data[1].id", i2: "$.data[2].id", i3: "$.data[3].id", i4: "$.data[4].id" }
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i0}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i1}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i2}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i3}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i4}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${bk}/assign"
              payload: { photographer_id: "${photog}" }
              as: Coordinator
            - call: "POST /shoot-bookings/${bk}/confirm"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /shoot-bookings/${bk}/deliver"
              payload: { photo_asset_count: 20 }
              as: Photographer
              as_user_id: "${photog}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BOOKING_NOT_IN_EDIT (409)"
            - "GET /shoot-bookings/${bk}/asset-bundles returns empty array (no bundle materialized)"

      - name: terminal_booking_rejects_all_further_transitions
        claim_type: terminal_lockdown
        grounds:
          - state_machines.ShootBooking
          - errors[ERR_BOOKING_NOT_CANCELLABLE]
        distinguishing_aspect: "From ACCEPTED (terminal), cancel and reschedule are rejected; from CANCELLED_BY_CLIENT (terminal), submit is rejected — terminal states have no outbound transitions."
        test_recipe:
          setup: ["Booking fully accepted (terminal ACCEPTED)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${mkt}", full_name: "Pat Photo", email: "pat@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
              captures: { photog: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-TERM", market_id: "${mkt}", property_address: "4 Final Ct", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-05T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk: $.data.id }
            - call: "POST /shoot-bookings/${bk}/submit"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "GET /shoot-bookings/${bk}/checklist-items"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { i0: "$.data[0].id", i1: "$.data[1].id", i2: "$.data[2].id", i3: "$.data[3].id", i4: "$.data[4].id" }
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i0}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i1}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i2}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i3}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i4}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "POST /shoot-bookings/${bk}/assign"
              payload: { photographer_id: "${photog}" }
              as: Coordinator
            - call: "POST /shoot-bookings/${bk}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T14:30:00Z" }
              as: OpsAdmin
            - call: "POST /shoot-bookings/${bk}/mark-shot"
              payload: {}
              as: Photographer
              as_user_id: "${photog}"
            - call: "POST /shoot-bookings/${bk}/deliver"
              payload: { photo_asset_count: 20 }
              as: Photographer
              as_user_id: "${photog}"
            - call: "POST /shoot-bookings/${bk}/accept"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
          trigger:
            - call: "POST /shoot-bookings/${bk}/cancel"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { err1: $.data.error_id }
            - call: "GET /shoot-bookings/${bk}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk_v: $.data.version }
            - call: "POST /shoot-bookings/${bk}/reschedule"
              payload: { expected_booking_version: "${bk_v}", kind: "CLIENT", new_start_utc: "2026-08-20T14:00:00Z", reason_code: "SELLER_DELAY" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_BOOKING_NOT_CANCELLABLE (409)"
            - "err2 == ERR_BOOKING_NOT_RESCHEDULABLE (409)"
            - "ShootBooking.${bk}.state == ACCEPTED after both rejections"

      - name: readiness_regression_uncheck_flips_ready_back_to_draft
        claim_type: side_effect_execution
        grounds:
          - calculations.readiness_aggregate
          - state_machines.ShootBooking
        distinguishing_aspect: "Checking all 5 items auto-advances AWAITING_READINESS -> READY; unchecking one item while READY regresses the booking to DRAFT (the readiness aggregate uses exact equality over required items, not >=)."
        test_recipe:
          setup: ["Booking submitted; all 5 items checked (state READY)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-REGR", market_id: "${mkt}", property_address: "5 Regress Rd", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-10T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk: $.data.id }
            - call: "POST /shoot-bookings/${bk}/submit"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "GET /shoot-bookings/${bk}/checklist-items"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { i0: "$.data[0].id", i1: "$.data[1].id", i2: "$.data[2].id", i3: "$.data[3].id", i4: "$.data[4].id" }
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i0}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i1}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i2}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i3}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i4}"
              payload: { checked: true }
              as: ClientAgent
              as_user_id: "${agent}"
          trigger:
            - call: "GET /shoot-bookings/${bk}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { st_ready: $.data.state }
            - call: "PATCH /shoot-bookings/${bk}/checklist-items/${i2}"
              payload: { checked: false }
              as: ClientAgent
              as_user_id: "${agent}"
          assert:
            - "st_ready == READY (auto-advanced after the 5th check)"
            - "After uncheck: ShootBooking.${bk}.state == DRAFT"
            - "ReadinessChecklistItem.${i2}.checked == false and checked_at_utc == null"

      - name: authorization_attempt_cap_refuses_drone_addon
        claim_type: side_effect_execution
        grounds:
          - state_machines.AirspaceAuthorization
          - state_machines.AddOn.ACTIVE_to_REFUSED
          - errors[ERR_AUTHORIZATION_ATTEMPTS_EXHAUSTED]
        distinguishing_aspect: "After 3 rejections (attempts 1,2,3), a further resubmit is rejected with ERR_AUTHORIZATION_ATTEMPTS_EXHAUSTED and the covered drone AddOn transitions ACTIVE -> REFUSED; the booking then auto-confirms since no drone add-on remains ACTIVE."
        test_recipe:
