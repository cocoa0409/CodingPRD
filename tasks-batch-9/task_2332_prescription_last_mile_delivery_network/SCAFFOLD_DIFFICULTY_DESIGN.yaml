  - rule_id: transitive_cascade
    instances:
      - name: cold_breach_forced_outcome_cascade_depth_four
        grounds:
          - state_machines.Delivery.OUT_FOR_DELIVERY_to_RETURN_PENDING_cold_breach
          - calculations.reattempt_ladder
          - calculations.plan_grant_commitment_and_absorption
          - entities.PlanGrant.fields.committed_cents
        cascade_depth: 4
        cascade_chain: |
          POST /deliveries/{id}/attempts (elapsed_since_pickup 130 min on a cold bag)
            L1 forced outcome COLD_BREACH -> Delivery.custody_status := RETURN_PENDING
              L2 BECAUSE the delivery entered RETURN_PENDING with a cold handling class
                 -> ExceptionCase(COLD_BREACH, OPEN) is opened
                L3 BECAUSE a COLD_BREACH case was opened
                   -> FeeAllocation.status := VOIDED, Delivery.settlement_status := VOIDED,
                      Delivery.fee_subtotal_cents := 0
                  L4 BECAUSE that allocation was VOIDED
                     -> PlanGrant.committed_cents 150 -> 0, remaining_cents 0 -> 150,
                        status EXHAUSTED -> ACTIVE
          Each link is caused by the previous link, not by the attempt call. The assignment
          release, courier counters and window-slot release are fan-out from L1 and are not
          counted toward the depth.
