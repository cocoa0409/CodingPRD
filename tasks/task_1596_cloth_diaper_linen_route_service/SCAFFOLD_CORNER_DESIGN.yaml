# =============================================================================
# §1.9 Scaffold Corner Design — Cloth Diaper & Linen Route Service
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: plan_defaults_applied_on_create
        claim_type: defaults
        grounds: [entities.SubscriptionPlan.fields.overage_cap_items, entities.SubscriptionPlan.fields.service_bags_per_week, entities.SubscriptionPlan.fields.kit_reserve_pct]
        distinguishing_aspect: "Omitting overage_cap_items, service_bags_per_week and kit_reserve_pct at plan creation applies the declared defaults 20 / 1 / 10."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/subscription-plans", payload: { tier_code: "MINIMAL", weekly_quota: 50, weekly_fee_cents: 2500, overage_rate_cents: 5, deposit_cents: 10000, weight_policy: "COUNT_BASIS" }, as: PlatformAdmin, captures: { plan_id: "$.data.id", cap: "$.data.overage_cap_items", bags: "$.data.service_bags_per_week", reserve: "$.data.kit_reserve_pct" } }
          trigger:
            - { call: "GET /api/subscription-plans/${plan_id}", as: PlatformAdmin }
          assert:
            - "SubscriptionPlan.${plan_id}.overage_cap_items == 20"
            - "SubscriptionPlan.${plan_id}.service_bags_per_week == 1"
            - "SubscriptionPlan.${plan_id}.kit_reserve_pct == 10"

      - name: create_customer_missing_required_email_returns_400
        claim_type: required_fields
        grounds: [entities.Customer.fields.email, "validations[priority=1]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/customers without the required email is rejected with ERR_INVALID_REQUEST before any FK or business check runs."
        test_recipe:
          setup: ["one service zone exists"]
          setup_api_calls:
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/customers", payload: { full_name: "No Email", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_INVALID_REQUEST (missing required field email; priority 1 fires before existence checks)"

      - name: get_customer_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent customer UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["one customer exists (so the miss is by id, not by empty collection)"]
          setup_api_calls:
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { full_name: "Ex Ists", email: "ex@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /api/customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlatformAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_NOT_FOUND"

      - name: create_customer_computed_deposit_input_ignored
        claim_type: computed_fields
        grounds: [entities.Customer.fields.deposit_held_cents]
        distinguishing_aspect: "Client-supplied computed field deposit_held_cents is ignored at creation; the ledger initializes to 0 regardless."
        test_recipe:
          setup: ["one service zone"]
          setup_api_calls:
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/customers", payload: { full_name: "Ig Nored", email: "ig@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM", deposit_held_cents: 99999 }, as: PlatformAdmin, captures: { cust_id: "$.data.id", held: "$.data.deposit_held_cents" } }
          assert:
            - "Customer.${cust_id}.deposit_held_cents == 0 (input value 99999 ignored; computed ledger field)"

      - name: system_fields_use_logical_clock_default
        claim_type: system_fields
        grounds: [entities.ServiceZone, endpoints.POST_/api/_clock/set_current_utc]
        distinguishing_aspect: "With no clock-set call, server-stamped created_at reads the fixed default 2026-08-01T00:00:00Z (never wall clock) and version starts at 1."
        test_recipe:
          setup: ["empty DB; logical clock never set"]
          setup_api_calls:
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-DEFAULT", service_weekdays: ["MON"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id", created: "$.data.created_at", ver: "$.data.version" } }
          trigger:
            - { call: "GET /api/service-zones/${zone_id}", as: PlatformAdmin, captures: { created2: "$.data.created_at" } }
          assert:
            - "ServiceZone.${zone_id}.created_at == 2026-08-01T00:00:00Z (fixed startup default)"
            - "ServiceZone.${zone_id}.version == 1 and id is a server-minted UUID"

      - name: plan_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "GET /api/subscription-plans?limit=1 over 2 plans returns exactly 1 row with total_count == 2 and has_more == true per the fixed envelope."
        test_recipe:
          setup: ["two plans exist"]
          setup_api_calls:
            - { call: "POST /api/subscription-plans", payload: { tier_code: "P1", weekly_quota: 50, weekly_fee_cents: 2500, overage_rate_cents: 5, deposit_cents: 10000, weight_policy: "COUNT_BASIS" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "P2", weekly_quota: 60, weekly_fee_cents: 3000, overage_rate_cents: 6, deposit_cents: 12000, weight_policy: "WEIGHT_BASIS" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /api/subscription-plans?limit=1&offset=0", as: PlatformAdmin }
          assert:
            - "response data length == 1 (limit honored)"
            - "pagination total_count == 2 and has_more == true"

      - name: create_pool_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.InventoryPool.fields.size_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "size_code JUMBO is outside NEWBORN|SMALL|MEDIUM|LARGE|XL and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON"], stop_cutoff_hours: 24 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/inventory-pools", payload: { size_code: "JUMBO" }, as: PlatformAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: zone_service_days_per_week_computed
        claim_type: computed_fields
        grounds: [entities.ServiceZone.fields.service_days_per_week]
        distinguishing_aspect: "service_days_per_week derives from len(service_weekdays): 3 weekdays -> 3, and the input is not directly settable."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-TRI", service_weekdays: ["MON", "WED", "FRI"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id", days: "$.data.service_days_per_week" } }
          trigger:
            - { call: "GET /api/service-zones/${zone_id}", as: PlatformAdmin }
          assert:
            - "ServiceZone.${zone_id}.service_days_per_week == 3"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: subscription_initial_states_after_create
        claim_type: initial_state
        grounds: [state_machines.Subscription.service_status, state_machines.Subscription.billing_status]
        distinguishing_aspect: "A freshly created subscription starts at service_status PENDING_START and billing_status CURRENT with missed_stop_count 0."
        test_recipe:
          setup: ["plan, zone, funded MEDIUM pool, customer"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, deposit_cents: 18000, weight_policy: "COUNT_BASIS" }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: "$.data.id" } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "Ini Tial", email: "in2@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: "$.data.id", svc: "$.data.service_status", bil: "$.data.billing_status", missed: "$.data.missed_stop_count" } }
          assert:
            - "Subscription.${sub_id}.service_status == PENDING_START and billing_status == CURRENT"
            - "Subscription.${sub_id}.missed_stop_count == 0"

      - name: terminated_subscription_event_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Subscription.service_status, "validations[priority=6]", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Any lifecycle event on a TERMINATED subscription (e.g. ACTIVATE) is rejected with ERR_ALREADY_TERMINAL rather than ERR_INVALID_STATE."
        test_recipe:
          setup: ["subscription fully terminated (kit ISSUED -> RETURNED 88 -> SETTLED, no invoices)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, deposit_cents: 18000, weight_policy: "COUNT_BASIS" }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: "$.data.id" } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "Ter Minal", email: "tm@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: "$.data.id" } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "RETURN", items_returned_count: 88 }, as: PlantOperator }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "SETTLE" }, as: PlantOperator }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "TERMINATE" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_ALREADY_TERMINAL"

      - name: miss_on_completed_stop_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RouteStop]
        distinguishing_aspect: "MISS is declared only from PLANNED; firing it on a COMPLETED stop fails with ERR_INVALID_STATE and missed_stop_count does not change."
        test_recipe:
          setup: ["route 2026-08-03 IN_PROGRESS; stop already COMPLETED (clean 80)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, deposit_cents: 18000, weight_policy: "COUNT_BASIS" }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: "$.data.id" } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "Mi Ss", email: "mi@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: "$.data.id" } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/routes", payload: { service_zone_id: "${zone_id}", route_date: "2026-08-03" }, as: PlatformAdmin, captures: { route_id: "$.data.id" } }
            - { call: "GET /api/route-stops?route_id=${route_id}&subscription_id=${sub_id}", as: PlatformAdmin, captures: { stop_id: "$.data[0].id" } }
            - { call: "POST /api/routes/${route_id}/sequence", as: PlatformAdmin }
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "LOCK" }, as: PlatformAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "START" }, as: PlatformAdmin, captures: { route_v: "$.data.version" } }
            - { call: "POST /api/route-stops/${stop_id}/complete", payload: { soiled_bags_collected: 1, clean_items_delivered: 80, expected_route_version: "${route_v}" }, as: RouteDriver }
          trigger:
            - { call: "POST /api/route-stops/${stop_id}/events", payload: { event_type: "MISS", miss_reason: "NO_BAG_OUT" }, as: RouteDriver, captures: { err_id: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE (COMPLETED is terminal for the stop; no MISS edge exists)"
            - "Subscription.${sub_id}.missed_stop_count remains 0"

      - name: route_complete_with_open_stop_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.Route.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "Compound gate: route COMPLETE while any stop is still PLANNED is rejected; only when every stop is terminal does COMPLETE succeed."
        test_recipe:
          setup: ["route 2026-08-03 IN_PROGRESS with its single stop still PLANNED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, deposit_cents: 18000, weight_policy: "COUNT_BASIS" }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: "$.data.id" } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "Co Mpound", email: "co@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: "$.data.id" } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/routes", payload: { service_zone_id: "${zone_id}", route_date: "2026-08-03" }, as: PlatformAdmin, captures: { route_id: "$.data.id" } }
            - { call: "GET /api/route-stops?route_id=${route_id}&subscription_id=${sub_id}", as: PlatformAdmin, captures: { stop_id: "$.data[0].id" } }
            - { call: "POST /api/routes/${route_id}/sequence", as: PlatformAdmin }
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "LOCK" }, as: PlatformAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "START" }, as: PlatformAdmin, captures: { route_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "COMPLETE" }, as: PlatformAdmin, captures: { err_id: "$.data.error_id" } }
            - { call: "POST /api/route-stops/${stop_id}/events", payload: { event_type: "SKIP" }, as: RouteDriver }
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "COMPLETE" }, as: PlatformAdmin, captures: { route_status: "$.data.status" } }
          assert:
            - "COMPLETE with a PLANNED stop -> $.data.error_id == ERR_INVALID_STATE"
            - "after SKIP makes every stop terminal: COMPLETE -> Route.${route_id}.status == COMPLETED"

      - name: kit_settle_blocked_until_cases_closed
        claim_type: side_effect_execution
        grounds: [state_machines.StarterKit.ISSUED_to_RETURNED, state_machines.StarterKit.RETURNED_to_SETTLED]
        distinguishing_aspect: "RETURN of 80 of 88 items auto-creates an OPEN LostItemCase for the shortage of 8 and blocks SETTLE until that case is CHARGED and SETTLED; the charge is 2400 cents (8 x 300 at age 0)."
        test_recipe:
          setup: ["ACTIVE subscription, kit ISSUED (88 MEDIUM items), deposit held 18000"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, deposit_cents: 18000, weight_policy: "COUNT_BASIS" }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: "$.data.id" } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "Ki Tsettle", email: "ks@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: "$.data.id" } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
          trigger:
