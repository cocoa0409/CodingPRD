            - "HealthVisit.${visit_id}.reopen_count == 0"
            - "HealthVisit.${visit_id}.closed_at == 2026-08-03T09:30:00.000Z"
            - "School.${sch_id}.occupied_cot_count == 0"

      - name: nurse_cannot_assess_another_nurses_encounter
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.SchoolNurse
