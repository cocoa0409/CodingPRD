# ---------------------------------------------------------------------------
# 1.8 Scaffold Difficulty Design (Test Targeting Index) for
#     task_2856_faculty_startup_package_lab_setup
#
# Machine-readable index of every §0.5 difficulty feature the sibling
# SCAFFOLD.yaml claims. Nine rule_id blocks x 2 instances = 18 instances.
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1-§1.7; every `${var}`
# is bound by an earlier `captures:`; every numeric assert is a literal
# computed against the declared formulas and constants.
#
# Shared BASE fixture (repeated verbatim in each instance that uses it):
#   clock 2026-08-01T00:00:00Z; COLLEGE pool 900_000_000, DEPARTMENT pool
#   400_000_000, DEAN_OFFICE pool 300_000_000; faculty Dr Ada Reyes;
#   package 45/35/20 with proposed_total_cents 72_000_000 scheduled across
#   six tranches (EQUIPMENT 25_000_000 + 15_000_000 FY2027, EQUIPMENT
#   8_000_000 FY2028, RENOVATION 12_000_000, PERSONNEL 9_600_000,
#   DISCRETIONARY 2_400_000); submitted, endorsed, approved, activated.
#   Reserved after approval: DEPARTMENT 32_400_000, COLLEGE 25_200_000,
#   DEAN_OFFICE 14_400_000 (= cost_share_split(72_000_000)).
# ---------------------------------------------------------------------------
scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: renovation_scope_estimate_vs_final_actual_divergence
        grounds:
          - calculations.renovation_cost_allocation
          - entities.RenovationProject.fields.subsidy_estimate_cents
          - entities.RenovationProject.fields.package_charge_estimate_cents
          - entities.RenovationProject.fields.subsidy_final_cents
          - entities.RenovationProject.fields.package_charge_final_cents
          - entities.RenovationProject.fields.cost_variance_cents
          - state_machines.RenovationProject.transitions.BID_to_AWARDED
          - state_machines.RenovationProject.transitions.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Cost accounting on a RenovationProject: the SCOPE_ESTIMATE variant subsidises
          awarded_cents (12_000_000 * 25% = 3_000_000 subsidy, 9_000_000 charged to the package)
          while the FINAL_ACTUAL variant subsidises min(actual, awarded + 10% tolerance) =
          13_200_000 * 25% = 3_300_000 yet charges the package the WHOLE actual 13_500_000, so the
          same project yields subsidy 3_000_000 vs 3_300_000 and package charge 9_000_000 vs
          10_200_000, a cost_variance_cents of exactly 1_200_000.
        test_recipe:
          setup:
            - "BASE fixture: three funding units, one ACTIVE faculty, one ACTIVE package with six tranches, spend_status SPENDING, clock 2026-08-01T00:00:00Z."
            - "One WET lab room registered (no assignment needed: the award only moves the room to UNDER_RENOVATION)."
            - "A MODERATE-tier RenovationProject on that room with estimate_cents 12_000_000 and two phases whose budgets sum to the awarded 12_000_000."
            - "Both phases run to COMPLETE with actual costs 7_000_000 and 6_500_000, i.e. an overrun of 1_500_000 against the award, of which only 1_200_000 is inside the 10% tolerance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { col_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${col_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { dept_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${col_id}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { dean_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${dept_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { fac_id: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${fac_id}", package_kind: "INITIAL", dean_unit_id: "${dean_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 72000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { pkg_id: $.data.id }
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 25000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", carryforward_policy: "CAPPED", carryforward_cap_pct: 50 }
              as: DeanOffice
              captures: { tr_eq_a: $.data.id }
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 15000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "FULL" }
              as: DeanOffice
              captures: { tr_eq_b: $.data.id }
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2028, amount_cents: 8000000, available_on: "2027-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { tr_eq_c: $.data.id }
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "RENOVATION", fiscal_year: 2027, amount_cents: 12000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { tr_ren: $.data.id }
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "PERSONNEL", fiscal_year: 2027, amount_cents: 9600000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "FULL" }
              as: DeanOffice
              captures: { tr_pers: $.data.id }
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "DISCRETIONARY", fiscal_year: 2027, amount_cents: 2400000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { tr_disc: $.data.id }
            - call: "POST /startup-packages/${pkg_id}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "U-DEANOFFICE-1"
            - call: "POST /startup-packages/${pkg_id}/endorse"
              payload: {}
              as: DepartmentChair
              as_user_id: "${dept_id}"
            - call: "POST /startup-packages/${pkg_id}/approve"
              payload: {}
              as: Dean
              as_user_id: "${col_id}"
            - call: "POST /faculty/${fac_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /startup-packages/${pkg_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /lab-spaces"
              payload: { building_code: "CHEM", room_number: "204", net_sq_ft: 900, space_class: "WET", power_kw_capacity: 100.00, chilled_water_available: true, fume_hood_count: 2, floor_load_psf: 250 }
              as: FacilitiesManager
              captures: { space_id: $.data.id }
            - call: "POST /renovation-projects"
              payload: { package_id: "${pkg_id}", space_id: "${space_id}", scope_tier: "MODERATE", estimate_cents: 12000000 }
              as: FacilitiesManager
              captures: { proj_id: $.data.id }
            - call: "POST /renovation-projects/${proj_id}/phases"
              payload: { sequence_no: 1, name: "Demolition and utilities", planned_start: "2026-08-10T00:00:00Z", planned_end: "2026-09-30T00:00:00Z", budget_cents: 6000000 }
              as: FacilitiesManager
              captures: { ph1_id: $.data.id }
            - call: "POST /renovation-projects/${proj_id}/phases"
              payload: { sequence_no: 2, name: "Casework and fume hood", planned_start: "2026-10-02T00:00:00Z", planned_end: "2026-11-30T00:00:00Z", budget_cents: 6000000 }
              as: FacilitiesManager
              captures: { ph2_id: $.data.id }
            - call: "POST /renovation-projects/${proj_id}/solicit-bids"
              payload: {}
              as: FacilitiesManager
          trigger:
            - call: "POST /renovation-projects/${proj_id}/award"
              payload: { awarded_cents: 12000000 }
              as: Dean
              as_user_id: "${col_id}"
            - call: "POST /renovation-projects/${proj_id}/phases/${ph1_id}/start"
              payload: {}
              as: FacilitiesManager
            - call: "POST /renovation-projects/${proj_id}/phases/${ph1_id}/complete"
              payload: { actual_cost_cents: 7000000 }
              as: FacilitiesManager
            - call: "POST /renovation-projects/${proj_id}/phases/${ph2_id}/start"
              payload: {}
              as: FacilitiesManager
            - call: "POST /renovation-projects/${proj_id}/phases/${ph2_id}/complete"
              payload: { actual_cost_cents: 6500000 }
              as: FacilitiesManager
            - call: "POST /renovation-projects/${proj_id}/substantial-completion"
              payload: {}
              as: FacilitiesManager
          assert:
            - "immediately after the award call, RenovationProject.${proj_id}.subsidy_estimate_cents == 3000000 and RenovationProject.${proj_id}.package_charge_estimate_cents == 9000000"
            - "immediately after the award call, CommitmentTranche.${tr_ren}.encumbered_cents == 9000000 and CommitmentTranche.${tr_ren}.available_balance_cents == 3000000"
            - "after substantial-completion, RenovationProject.${proj_id}.actual_total_cents == 13500000"
            - "after substantial-completion, RenovationProject.${proj_id}.subsidy_final_cents == 3300000"
            - "after substantial-completion, RenovationProject.${proj_id}.package_charge_final_cents == 10200000"
            - "after substantial-completion, RenovationProject.${proj_id}.cost_variance_cents == 1200000"
            - "RenovationProject.${proj_id}.subsidy_final_cents != RenovationProject.${proj_id}.subsidy_estimate_cents (3300000 != 3000000: the two variants diverge on the same project)"
            - "CommitmentTranche.${tr_ren}.disbursed_cents == 10200000 and CommitmentTranche.${tr_ren}.encumbered_cents == 0 and CommitmentTranche.${tr_ren}.available_balance_cents == 1800000"
            - "FundingUnit.${dept_id}.disbursed_cents == 4590000 and FundingUnit.${col_id}.disbursed_cents == 3570000 and FundingUnit.${dean_id}.disbursed_cents == 2040000"
            - "FundingUnit.${dept_id}.committed_cents == 0 (the award encumbrance is fully settled)"
            - "RenovationProject.${proj_id}.status == COMPLETED and LabSpace.${space_id}.status == ASSIGNED"

      - name: separation_departure_recapture_vs_internal_transfer_divergence
        grounds:
          - calculations.separation_settlement
          - entities.StartupPackage.fields.settlement_variant
          - entities.StartupPackage.fields.recaptured_unspent_cents
          - entities.StartupPackage.fields.transferred_balance_cents
          - entities.StartupPackage.fields.college_holdback_cents
          - state_machines.Faculty.transitions.DEPARTURE_NOTICE_to_DEPARTED
          - state_machines.Faculty.transitions.DEPARTURE_NOTICE_to_TRANSFERRED_INTERNAL
        distinguishing_aspect: |
          Settlement accounting on a Faculty/StartupPackage pair - a different entity domain from
          the RenovationProject cost accounting of the first instance: two faculty members holding
          byte-identical 24_000_003-cent packages settle on the same day, and DEPARTURE_RECAPTURE
          reports recaptured_unspent_cents 24_000_003 / transferred 0 / holdback 0 while
          INTERNAL_TRANSFER reports holdback 3_600_000 / transferred 20_400_003 /
          recaptured_unspent_cents 3_600_000, yet BOTH unwind the three original funder pools by
          the identical largest-remainder split (10_800_001 / 8_400_001 / 4_800_001).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one COLLEGE unit, two DEPARTMENT units (Chemistry as home, Biochemistry as internal-transfer target with its own 100_000_000 pool), one DEAN_OFFICE unit."
            - "Two faculty members in Chemistry, each with an ACTIVE 45/35/20 package of proposed_total_cents 24_000_003 scheduled as a single EQUIPMENT FY2027 tranche; nothing is ever spent, so unspent == 24_000_003 in both packages."
            - "Both receive a departure notice effective 2026-09-01, one with intent DEPARTURE and one with intent INTERNAL_TRANSFER targeting Biochemistry; the clock is then advanced to 2026-09-01T00:00:00Z so both separations are due."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { col2_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${col2_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { dept2_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Biochemistry", unit_type: "DEPARTMENT", parent_unit_id: "${col2_id}", cost_share_pool_cents: 100000000 }
              as: DeanOffice
              captures: { deptB_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${col2_id}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { dean2_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ben Okafor", rank: "ASSOCIATE", funding_unit_id: "${dept2_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { fac_dep_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Chen Wei", rank: "ASSOCIATE", funding_unit_id: "${dept2_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { fac_xfer_id: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${fac_dep_id}", package_kind: "INITIAL", dean_unit_id: "${dean2_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 24000003, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { pkg_dep_id: $.data.id }
            - call: "POST /startup-packages/${pkg_dep_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 24000003, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { tr_dep: $.data.id }
            - call: "POST /startup-packages/${pkg_dep_id}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "U-DEANOFFICE-1"
            - call: "POST /startup-packages/${pkg_dep_id}/endorse"
              payload: {}
              as: DepartmentChair
              as_user_id: "${dept2_id}"
            - call: "POST /startup-packages/${pkg_dep_id}/approve"
              payload: {}
              as: Dean
              as_user_id: "${col2_id}"
            - call: "POST /faculty/${fac_dep_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /startup-packages/${pkg_dep_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /startup-packages"
              payload: { faculty_id: "${fac_xfer_id}", package_kind: "INITIAL", dean_unit_id: "${dean2_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 24000003, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { pkg_xfer_id: $.data.id }
            - call: "POST /startup-packages/${pkg_xfer_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 24000003, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { tr_xfer: $.data.id }
            - call: "POST /startup-packages/${pkg_xfer_id}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "U-DEANOFFICE-1"
            - call: "POST /startup-packages/${pkg_xfer_id}/endorse"
              payload: {}
              as: DepartmentChair
              as_user_id: "${dept2_id}"
            - call: "POST /startup-packages/${pkg_xfer_id}/approve"
              payload: {}
              as: Dean
              as_user_id: "${col2_id}"
            - call: "POST /faculty/${fac_xfer_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /startup-packages/${pkg_xfer_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /faculty/${fac_dep_id}/departure-notice"
              payload: { departure_intent: "DEPARTURE", departure_effective_on: "2026-09-01" }
              as: DeanOffice
            - call: "POST /faculty/${fac_xfer_id}/departure-notice"
              payload: { departure_intent: "INTERNAL_TRANSFER", departure_effective_on: "2026-09-01", target_funding_unit_id: "${deptB_id}" }
              as: DeanOffice
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DeanOffice
          trigger:
            - call: "POST /faculty/${fac_dep_id}/separate"
              payload: {}
              as: DeanOffice
            - call: "POST /faculty/${fac_xfer_id}/separate"
              payload: {}
              as: DeanOffice
          assert:
            - "Faculty.${fac_dep_id}.appointment_status == DEPARTED and Faculty.${fac_xfer_id}.appointment_status == TRANSFERRED_INTERNAL"
            - "StartupPackage.${pkg_dep_id}.settlement_variant == DEPARTURE_RECAPTURE"
            - "StartupPackage.${pkg_dep_id}.recaptured_unspent_cents == 24000003"
            - "StartupPackage.${pkg_dep_id}.transferred_balance_cents == 0"
            - "StartupPackage.${pkg_dep_id}.college_holdback_cents == 0"
            - "StartupPackage.${pkg_xfer_id}.settlement_variant == INTERNAL_TRANSFER"
            - "StartupPackage.${pkg_xfer_id}.college_holdback_cents == 3600000"
            - "StartupPackage.${pkg_xfer_id}.transferred_balance_cents == 20400003"
            - "StartupPackage.${pkg_xfer_id}.recaptured_unspent_cents == 3600000"
            - "StartupPackage.${pkg_dep_id}.recaptured_unspent_cents != StartupPackage.${pkg_xfer_id}.recaptured_unspent_cents (24000003 != 3600000: the two variants diverge on identical input)"
            - "CommitmentTranche.${tr_dep}.status == RECAPTURED and CommitmentTranche.${tr_dep}.recaptured_cents == 24000003 and CommitmentTranche.${tr_dep}.available_balance_cents == 0"
            - "CommitmentTranche.${tr_xfer}.status == RECAPTURED and CommitmentTranche.${tr_xfer}.recaptured_cents == 24000003 and CommitmentTranche.${tr_xfer}.available_balance_cents == 0"
            - "FundingUnit.${dept2_id}.reserved_cents == 0 and FundingUnit.${col2_id}.reserved_cents == 0 and FundingUnit.${dean2_id}.reserved_cents == 0"
            - "FundingUnit.${dept2_id}.refunded_cents == 21600002 (2 x 10800001: both variants unwind the department identically)"
            - "FundingUnit.${col2_id}.refunded_cents == 16800002 and FundingUnit.${dean2_id}.refunded_cents == 9600002"
            - "FundingUnit.${deptB_id}.cost_share_pool_cents == 120400003 (100000000 + 20400003 transferred in; only the INTERNAL_TRANSFER variant credits a receiving unit)"

  # =========================================================================
  # Rule 2 - combinatorial formulas across different modes
  #          instance (a) = mode (b) nested rounding order
  #          instance (b) = mode (c) pinned evaluation order
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: staff_encumbrance_round_per_month_then_multiply
        grounds:
          - calculations.staff_encumbrance_rounding
          - calculations.cost_share_split
          - entities.StaffAppointment.fields.committed_months
          - entities.StaffAppointment.fields.encumbered_cents
          - state_machines.StaffAppointment.transitions.PROPOSED_to_ACTIVE
        distinguishing_aspect: |
          Mode (b), nested rounding where the order changes the cents: the scaffold pins
          round_half_up(583333 * 0.77) = 449166 per month and only then multiplies by 12
          committed months, giving encumbered_cents == 5389992; the rejected
          round_half_up(583333 * 0.77 * 12) order gives 5389997, five cents more, so the assertion
          discriminates the two orders directly.
        test_recipe:
          setup:
            - "BASE fixture: three funding units, ACTIVE faculty, ACTIVE package with six tranches, spend_status SPENDING, clock 2026-08-01T00:00:00Z; PERSONNEL FY2027 tranche OPEN with 9_600_000 available."
            - "One LAB_MANAGER appointment at fte 0.77 and monthly_cost_cents 583333 running 2026-09-01 .. 2027-08-31, i.e. exactly 12 committed months, whose fte-weighted monthly charge has a fractional cent (449166.41)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { col_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${col_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { dept_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${col_id}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { dean_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${dept_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { fac_id: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${fac_id}", package_kind: "INITIAL", dean_unit_id: "${dean_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 72000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { pkg_id: $.data.id }
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 25000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", carryforward_policy: "CAPPED", carryforward_cap_pct: 50 }
              as: DeanOffice
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 15000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "FULL" }
              as: DeanOffice
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2028, amount_cents: 8000000, available_on: "2027-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
            - call: "POST /startup-packages/${pkg_id}/tranches"
              payload: { category: "RENOVATION", fiscal_year: 2027, amount_cents: 12000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
