# =============================================================================
# Task 0993 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: statement_provisional_vs_final_variant_divergence
        grounds:
          - calculations.statement_net_amount
          - state_machines.BillingStatement.PROVISIONAL_to_FINALIZED
          - entities.BillingStatement.fields.box_charge_cents
        distinguishing_aspect: |
          Same run data, two variants on the BillingStatement domain: the
          provisional variant bills planned_box_count (2 boxes x 3000 = 6000)
          while the final variant bills kitted_box_count (1 box x 3000 = 3000),
          so the stored box_charge_cents changes 6000 -> 3000 at finalize.
        test_recipe:
          setup:
            - "client with credit_balance_cents == 1000000"
            - "component CMP-DV1 with 500 units on hand; plan PL-DV1 ACTIVE, price 3000, BOM qty 1"
            - "2 ACTIVE subscribers (zone 2); run 2026-05 LOCKED (planned 2), KITTING, completed with actual_kitted_count 1 (one QUEUED shipment excess-cancelled)"
            - "BillingStatement for (client, 2026-05) PROVISIONAL with box_charge_cents == 6000 (planned basis)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "DV1 Client", billing_email: "dv1@acme.test" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - { call: "POST /clients/${cl_id}/credit-adjustments", payload: { amount_cents: 1000000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-DV1", name: "DV1 widget", unit_cost_cents: 100, reorder_point_units: 0 }
              as: WarehouseOps
              captures: { cp_id: $.data.id, cp_v: $.data.version }
            - { call: "POST /components/${cp_id}/receipts", payload: { quantity: 500, expected_component_version: "${cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${cl_id}", name: "DV1 Box", sku: "PL-DV1", price_per_box_cents: 3000, shipping_weight_grams: 1000 }
              as: ClientOps
              as_user_id: "${cl_id}"
              captures: { pl_id: $.data.id, pl_v: $.data.version }
            - call: "POST /box-plans/${pl_id}/kit-revisions"
              payload: { expected_box_plan_version: "${pl_v}" }
              as: ClientOps
              as_user_id: "${cl_id}"
              captures: { rv_id: $.data.id }
            - call: "PUT /kit-revisions/${rv_id}/bom-lines"
              payload: { lines: [{ component_id: "${cp_id}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${cl_id}"
            - { call: "POST /kit-revisions/${rv_id}/approve", as: ClientOps, as_user_id: "${cl_id}" }
            - { call: "POST /box-plans/${pl_id}/activate", as: ClientOps, as_user_id: "${cl_id}" }
            - call: "POST /box-plans/${pl_id}/import-batches"
              payload: { rows: [{ email: "dv1a@x.test", zone: 2 }, { email: "dv1b@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${cl_id}"
              captures: { ib_id: $.data.id }
            - { call: "POST /import-batches/${ib_id}/commit", as: ClientOps, as_user_id: "${cl_id}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${pl_id}", period: "2026-05" }
              as: WarehouseOps
              captures: { rn_id: $.data.id }
            - { call: "POST /assembly-runs/${rn_id}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${rn_id}/start-kitting", as: WarehouseOps }
            - { call: "POST /assembly-runs/${rn_id}/complete-kitting", payload: { actual_kitted_count: 1 }, as: WarehouseOps }
            - call: "GET /clients/${cl_id}/billing-statements"
              as: BillingAdmin
              captures: { st_id: "$.data[0].id", st_box_pre: "$.data[0].box_charge_cents" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /billing-statements/${st_id}/finalize"
              as: BillingAdmin
              captures: { st_box_post: $.data.box_charge_cents, st_net: $.data.net_cents }
            - call: "GET /clients/${cl_id}"
              as: BillingAdmin
              captures: { cl_bal: $.data.credit_balance_cents }
          assert:
            - "pre-finalize captured box_charge_cents (${st_box_pre}) == 6000 (provisional: planned 2 x 3000, tier 0)"
            - "post-finalize box_charge_cents (${st_box_post}) == 3000 (final: kitted 1 x 3000)"
            - "BillingStatement.${st_id}.net_cents == 3000 and status == FINALIZED"
            - "Client.${cl_id}.credit_balance_cents == 997000 (1000000 - 3000 debited)"

      - name: availability_instantaneous_vs_forward_looking
        grounds:
          - calculations.component_availability
          - entities.Component.fields.available_units
          - entities.Component.fields.projected_available_units
        distinguishing_aspect: |
          Different entity domain (Component inventory, not billing): identical
          on_hand/reserved data yields available_units == 500 under the
          instantaneous variant while the forward-looking variant subtracts
          DRAFT-run demand (qty 2 x 3 ACTIVE subscribers) giving 494.
        test_recipe:
          setup:
            - "component CMP-DV2 with 500 on hand, reorder_point 0"
            - "plan PL-DV2 ACTIVE, BOM qty_per_box 2; 3 ACTIVE subscribers"
            - "one AssemblyRun in DRAFT for period 2026-05 (never locked)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "DV2 Client", billing_email: "dv2@acme.test" }
              as: PlatformAdmin
              captures: { cl2_id: $.data.id }
            - call: "POST /components"
              payload: { sku: "CMP-DV2", name: "DV2 widget", unit_cost_cents: 100, reorder_point_units: 0 }
              as: WarehouseOps
              captures: { cp2_id: $.data.id, cp2_v: $.data.version }
            - { call: "POST /components/${cp2_id}/receipts", payload: { quantity: 500, expected_component_version: "${cp2_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${cl2_id}", name: "DV2 Box", sku: "PL-DV2", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${cl2_id}"
              captures: { pl2_id: $.data.id, pl2_v: $.data.version }
            - call: "POST /box-plans/${pl2_id}/kit-revisions"
              payload: { expected_box_plan_version: "${pl2_v}" }
              as: ClientOps
              as_user_id: "${cl2_id}"
              captures: { rv2_id: $.data.id }
            - call: "PUT /kit-revisions/${rv2_id}/bom-lines"
              payload: { lines: [{ component_id: "${cp2_id}", qty_per_box: 2 }] }
              as: ClientOps
              as_user_id: "${cl2_id}"
            - { call: "POST /kit-revisions/${rv2_id}/approve", as: ClientOps, as_user_id: "${cl2_id}" }
            - { call: "POST /box-plans/${pl2_id}/activate", as: ClientOps, as_user_id: "${cl2_id}" }
            - call: "POST /box-plans/${pl2_id}/import-batches"
              payload: { rows: [{ email: "dv2a@x.test", zone: 1 }, { email: "dv2b@x.test", zone: 1 }, { email: "dv2c@x.test", zone: 1 }] }
              as: ClientOps
              as_user_id: "${cl2_id}"
              captures: { ib2_id: $.data.id }
            - { call: "POST /import-batches/${ib2_id}/commit", as: ClientOps, as_user_id: "${cl2_id}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${pl2_id}", period: "2026-05" }
              as: WarehouseOps
              captures: { rn2_id: $.data.id }
          trigger:
            - call: "GET /components/${cp2_id}"
              as: WarehouseOps
              captures: { cp2_avail: $.data.available_units, cp2_proj: $.data.projected_available_units, cp2_stock: $.data.stock_status }
          assert:
            - "Component.${cp2_id}.available_units == 500 (instantaneous variant ignores the DRAFT run)"
            - "Component.${cp2_id}.projected_available_units == 494 (500 - 2 x 3 DRAFT-run demand)"
            - "Component.${cp2_id}.stock_status == OK"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: postage_tiered_multi_input_express_remote
        grounds:
          - calculations.shipment_postage
          - state_machines.ShippingWave.SCHEDULED_to_MANIFESTED
          - entities.Shipment.fields.postage_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — service_level
          selects base and min-charge (nested max), zone selects the per-slab
          rate multiplied by ceil(weight/500), and a conditional branch adds
          the EXPRESS remote surcharge only when zone >= 5. Pinned inputs
          (EXPRESS, zone 6, 200 g) yield exactly 1190 cents.
        test_recipe:
          setup:
            - "client CF1 with wallet 100000; component CMP-CF1 stocked 10; plan PL-CF1 ACTIVE, price 1000, shipping_weight_grams 200, BOM qty 1"
            - "1 ACTIVE subscriber in zone 6; run 2026-05 LOCKED -> KITTING -> KITTED with actual 1; the single shipment is STAGED"
            - "wave WV-CF1: UPS EXPRESS pickup 2026-05-10T10:00:00Z-2026-05-10T11:00:00Z, shipment assigned"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "CF1 Client", billing_email: "cf1@acme.test" }
              as: PlatformAdmin
              captures: { cf1_cl: $.data.id }
            - { call: "POST /clients/${cf1_cl}/credit-adjustments", payload: { amount_cents: 100000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-CF1", name: "CF1 widget", unit_cost_cents: 50, reorder_point_units: 0 }
              as: WarehouseOps
              captures: { cf1_cp: $.data.id, cf1_cp_v: $.data.version }
            - { call: "POST /components/${cf1_cp}/receipts", payload: { quantity: 10, expected_component_version: "${cf1_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${cf1_cl}", name: "CF1 Box", sku: "PL-CF1", price_per_box_cents: 1000, shipping_weight_grams: 200 }
              as: ClientOps
              as_user_id: "${cf1_cl}"
              captures: { cf1_pl: $.data.id, cf1_pl_v: $.data.version }
            - call: "POST /box-plans/${cf1_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${cf1_pl_v}" }
              as: ClientOps
              as_user_id: "${cf1_cl}"
              captures: { cf1_rv: $.data.id }
            - call: "PUT /kit-revisions/${cf1_rv}/bom-lines"
              payload: { lines: [{ component_id: "${cf1_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${cf1_cl}"
            - { call: "POST /kit-revisions/${cf1_rv}/approve", as: ClientOps, as_user_id: "${cf1_cl}" }
            - { call: "POST /box-plans/${cf1_pl}/activate", as: ClientOps, as_user_id: "${cf1_cl}" }
            - call: "POST /box-plans/${cf1_pl}/import-batches"
              payload: { rows: [{ email: "cf1a@x.test", zone: 6 }] }
              as: ClientOps
              as_user_id: "${cf1_cl}"
              captures: { cf1_ib: $.data.id }
            - { call: "POST /import-batches/${cf1_ib}/commit", as: ClientOps, as_user_id: "${cf1_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${cf1_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { cf1_rn: $.data.id }
            - { call: "POST /assembly-runs/${cf1_rn}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${cf1_rn}/start-kitting", as: WarehouseOps }
            - { call: "POST /assembly-runs/${cf1_rn}/complete-kitting", payload: { actual_kitted_count: 1 }, as: WarehouseOps }
            - call: "GET /assembly-runs/${cf1_rn}/shipments"
              as: WarehouseOps
              captures: { cf1_sh: "$.data[0].id" }
            - call: "POST /shipping-waves"
              payload: { carrier: "UPS", service_level: "EXPRESS", pickup_start: "2026-05-10T10:00:00Z", pickup_end: "2026-05-10T11:00:00Z" }
              as: WarehouseOps
              captures: { cf1_wv: $.data.id }
            - { call: "POST /shipping-waves/${cf1_wv}/assign-shipments", payload: { shipment_ids: ["${cf1_sh}"] }, as: WarehouseOps }
          trigger:
            - { call: "POST /shipping-waves/${cf1_wv}/manifest", as: WarehouseOps }
            - call: "GET /shipments/${cf1_sh}"
              as: WarehouseOps
              captures: { cf1_postage: $.data.postage_cents, cf1_label: $.data.label_status, cf1_track: $.data.tracking_code }
          assert:
            - "Shipment.${cf1_sh}.postage_cents == 1190  (slabs ceil(200/500)=1; 745 + 120x1 = 865; max(990, 865) = 990; EXPRESS zone 6 >= 5 adds 200)"
            - "Shipment.${cf1_sh}.label_status == PURCHASED and tracking_code is non-null"

      - name: statement_per_line_rounding_order
        grounds:
          - calculations.statement_net_amount
          - entities.BillingStatement.fields.discount_pct
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          Three runs of 67 kitted boxes at 199 cents with the 5% tier give
          3 x round_half_up(199 x 67 x 0.95) = 3 x 12666 = 37998; the rejected
          sum-then-round interpretation would give round_half_up(37999.05) =
          37999. Different mode from the postage instance (mode a).
        test_recipe:
          setup:
            - "client CF2 with wallet 200000; component CMP-CF2 stocked 1000 (shared by all three BOMs, qty_per_box 1)"
            - "three ACTIVE plans PL-RR-A/PL-RR-B/PL-RR-C, each price 199 cents, weight 300 g, each with 67 ACTIVE subscribers (zone 2)"
            - "one run per plan for period 2026-05, each LOCKED -> KITTING -> KITTED with actual_kitted_count 67 (no excess)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "CF2 Client", billing_email: "cf2@acme.test" }
              as: PlatformAdmin
              captures: { cf2_cl: $.data.id }
            - { call: "POST /clients/${cf2_cl}/credit-adjustments", payload: { amount_cents: 200000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-CF2", name: "CF2 widget", unit_cost_cents: 10, reorder_point_units: 0 }
              as: WarehouseOps
              captures: { cf2_cp: $.data.id, cf2_cp_v: $.data.version }
            - { call: "POST /components/${cf2_cp}/receipts", payload: { quantity: 1000, expected_component_version: "${cf2_cp_v}" }, as: WarehouseOps }
            # --- plan A ---
            - call: "POST /box-plans"
              payload: { client_id: "${cf2_cl}", name: "RR Box A", sku: "PL-RR-A", price_per_box_cents: 199, shipping_weight_grams: 300 }
              as: ClientOps
              as_user_id: "${cf2_cl}"
              captures: { cf2_pla: $.data.id, cf2_pla_v: $.data.version }
            - call: "POST /box-plans/${cf2_pla}/kit-revisions"
              payload: { expected_box_plan_version: "${cf2_pla_v}" }
              as: ClientOps
              as_user_id: "${cf2_cl}"
              captures: { cf2_rva: $.data.id }
            - call: "PUT /kit-revisions/${cf2_rva}/bom-lines"
              payload: { lines: [{ component_id: "${cf2_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${cf2_cl}"
            - { call: "POST /kit-revisions/${cf2_rva}/approve", as: ClientOps, as_user_id: "${cf2_cl}" }
            - { call: "POST /box-plans/${cf2_pla}/activate", as: ClientOps, as_user_id: "${cf2_cl}" }
            - call: "POST /box-plans/${cf2_pla}/import-batches"
              payload: { rows: [{ email: "rra01@x.test", zone: 2 }, { email: "rra02@x.test", zone: 2 }, { email: "rra03@x.test", zone: 2 }, { email: "rra04@x.test", zone: 2 }, { email: "rra05@x.test", zone: 2 }, { email: "rra06@x.test", zone: 2 }, { email: "rra07@x.test", zone: 2 }, { email: "rra08@x.test", zone: 2 }, { email: "rra09@x.test", zone: 2 }, { email: "rra10@x.test", zone: 2 }, { email: "rra11@x.test", zone: 2 }, { email: "rra12@x.test", zone: 2 }, { email: "rra13@x.test", zone: 2 }, { email: "rra14@x.test", zone: 2 }, { email: "rra15@x.test", zone: 2 }, { email: "rra16@x.test", zone: 2 }, { email: "rra17@x.test", zone: 2 }, { email: "rra18@x.test", zone: 2 }, { email: "rra19@x.test", zone: 2 }, { email: "rra20@x.test", zone: 2 }, { email: "rra21@x.test", zone: 2 }, { email: "rra22@x.test", zone: 2 }, { email: "rra23@x.test", zone: 2 }, { email: "rra24@x.test", zone: 2 }, { email: "rra25@x.test", zone: 2 }, { email: "rra26@x.test", zone: 2 }, { email: "rra27@x.test", zone: 2 }, { email: "rra28@x.test", zone: 2 }, { email: "rra29@x.test", zone: 2 }, { email: "rra30@x.test", zone: 2 }, { email: "rra31@x.test", zone: 2 }, { email: "rra32@x.test", zone: 2 }, { email: "rra33@x.test", zone: 2 }, { email: "rra34@x.test", zone: 2 }, { email: "rra35@x.test", zone: 2 }, { email: "rra36@x.test", zone: 2 }, { email: "rra37@x.test", zone: 2 }, { email: "rra38@x.test", zone: 2 }, { email: "rra39@x.test", zone: 2 }, { email: "rra40@x.test", zone: 2 }, { email: "rra41@x.test", zone: 2 }, { email: "rra42@x.test", zone: 2 }, { email: "rra43@x.test", zone: 2 }, { email: "rra44@x.test", zone: 2 }, { email: "rra45@x.test", zone: 2 }, { email: "rra46@x.test", zone: 2 }, { email: "rra47@x.test", zone: 2 }, { email: "rra48@x.test", zone: 2 }, { email: "rra49@x.test", zone: 2 }, { email: "rra50@x.test", zone: 2 }, { email: "rra51@x.test", zone: 2 }, { email: "rra52@x.test", zone: 2 }, { email: "rra53@x.test", zone: 2 }, { email: "rra54@x.test", zone: 2 }, { email: "rra55@x.test",