  - rule_id: cross_entity_state_dependency
    instances:
      - name: spend_qualify_requires_vendor_verified
        grounds:
          - state_machines.SpendEntry.PENDING_REVIEW_to_QUALIFIED
          - state_machines.Vendor.UNVERIFIED_to_VERIFIED
          - errors[ERR_VENDOR_RESIDENCY_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair SpendEntry -> Vendor: a review-QUALIFY on a
          PENDING_REVIEW entry is gated by the VENDOR's residency_status —
          UNVERIFIED blocks with ERR_VENDOR_RESIDENCY_NOT_VERIFIED; flipping
          the vendor to VERIFIED unblocks the very same request with no change
          to the spend entry itself.
