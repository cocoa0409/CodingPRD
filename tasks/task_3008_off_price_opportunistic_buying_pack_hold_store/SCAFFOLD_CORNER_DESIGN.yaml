            - "the FIFO variant would have produced 34500 (3 * 11500) — the merge policy, not the unit count, drives the value"
            - "ShrinkCase.${sc_mx_id}.status == CONFIRMED"

      - name: cluster_allocation_largest_remainder_and_capacity_spill
        claim_type: Correct Result
