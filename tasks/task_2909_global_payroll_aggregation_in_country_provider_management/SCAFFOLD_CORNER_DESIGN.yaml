  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_cycle_version_on_run_creation_is_refused_then_retried
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.gtn-run-create-stale-cycle
          - errors.ERR_STALE_CYCLE_VERSION
        distinguishing_aspect: "The version read before lock-inputs is exactly one behind: presenting it gives ERR_STALE_CYCLE_VERSION (412) with nothing written, and the same body with the freshly read version succeeds and pushes PayrollCycle.version one further, so the OCC field is checked against the live value rather than a monotonic floor."
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement"
            - "cycle 2026-08 created (version 1 captured as c1_v0), then a VALIDATED extract and lock-inputs which bumps the version to 2 (captured as c1_v1)"
