              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_g1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_g1: $.data.version }
            - call: "POST /referrals/${ref_g1}/accept"
              payload: { expected_unit_version: "${v_g1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_g1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_g1: $.data.id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-G2", gestational_age_weeks: 34.0, birth_weight_grams: 2000, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_g2: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_g2: $.data.version }
            - call: "POST /referrals/${ref_g2}/accept"
              payload: { expected_unit_version: "${v_g2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_g2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_g2: $.data.id }
            - call: "POST /surge-escalations"
              payload: { unit_id: "${unit_a}", requested_beds: 6, effective_from: "2026-08-02T00:00:00Z", effective_to: "2026-08-03T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { esc_1: $.data.id }
            - call: "POST /surge-escalations"
              payload: { unit_id: "${unit_a}", requested_beds: 6, effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-08-06T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { esc_2: $.data.id }
          trigger:
            - call: "POST /surge-escalations/${esc_1}/authorize"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /surge-escalations/${esc_2}/authorize"
              payload: {}
