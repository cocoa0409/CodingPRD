- rule_id: priority_pair_validation_conflict
  instances:
  - name: withdraw_state_error_beats_temporal_error
    grounds:
    - validations[priority=6]
    - validations[priority=10]
    - errors[ERR_INVALID_STATE]
    - errors[ERR_WITHDRAWAL_WINDOW_EXPIRED]
    distinguishing_aspect: 'Error-category pair (state, business_temporal): a withdrawal against a DENIED claim made 15 months after entitlement
      violates both the state gate (not ENTITLED) and the 12-month window; the higher-priority state check must win with ERR_INVALID_STATE.'
    test_recipe:
      setup:
      - 'Worker wp: born 1964-06, 3 earnings years; RETIREMENT claim entitled 2026-06 but DENIED at adjudication'
      - Logical clock advanced to 2027-10-01 — 16 months after entitlement, outside the withdrawal window
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Priority Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wp: $.data.id
          wp_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wp}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wp}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wp}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${wp}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wp}
        captures:
          cp: $.data.id
      - call: POST /ssa/claims/${cp}/deny
        payload:
          denial_reason: insufficient insured status
        as: ClaimsSpecialist
        as_user_id: spec-1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2027-10-01T00:00:00Z'
        as: ProgramAdministrator
      trigger:
      - call: POST /ssa/claims/${cp}/withdraw
        payload:
          repaid_amount_cents: 0
        as: Claimant
        as_user_id: ${wp}
        captures:
          err: $.data.error_id
      assert:
      - Response is 409 with error_id == ERR_INVALID_STATE (state priority 6 beats business_temporal priority 10)
      - BenefitClaim.${cp}.status remains DENIED; no payment rows are touched
  - name: correction_duplicate_constraint_beats_time_bar
    grounds:
    - validations[priority=9]
    - validations[priority=10]
    - errors[ERR_DUPLICATE_PENDING_CORRECTION]
    - errors[ERR_CORRECTION_TIME_BARRED]
    distinguishing_aspect: 'Error-category pair (business_constraint, business_temporal) — a different pair than (state, business_temporal): filing
      a second correction for a year that already has a PENDING_REVIEW request, after the statute deadline, violates both; the constraint check
      wins with ERR_DUPLICATE_PENDING_CORRECTION.'
    test_recipe:
      setup:
      - 'Worker wq2: born 1964-06; no earnings row for 2022'
      - 'At clock 2026-03-01 (before the 2022 statute deadline 2026-04-15): correction A for 2022 is PENDING_REVIEW'
      - Clock advanced to 2026-09-01 — past the deadline, so a new filing is also time-barred
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Dup Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wq2: $.data.id
          wq2_ver: $.data.version
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-01T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /ssa/correction-requests
        payload:
          worker_id: ${wq2}
          tax_year: 2022
          claimed_earnings_cents: 500000
          evidence_type: WAGE_STATEMENT
        as: Claimant
        as_user_id: ${wq2}
        captures:
          cor_a: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdministrator
      trigger:
      - call: POST /ssa/correction-requests
        payload:
          worker_id: ${wq2}
          tax_year: 2022
          claimed_earnings_cents: 600000
          evidence_type: TAX_RETURN
        as: Claimant
        as_user_id: ${wq2}
        captures:
          err: $.data.error_id
      assert:
      - Response is 409 with error_id == ERR_DUPLICATE_PENDING_CORRECTION (constraint priority 9 beats temporal priority 10)
      - CorrectionRequest.${cor_a} remains PENDING_REVIEW; no second request is persisted
- rule_id: boundary_precision_check
  instances:
  - name: claiming_age_exactly_62_boundary
    grounds:
    - validations[priority=12]
    - calculations.age_adjustment
    - errors[ERR_AGE_INELIGIBLE]
    distinguishing_aspect: 'Metric: claiming age in whole months at the approve endpoint. 744 months (exactly 62 years 0 months) is eligible;
      743 months is rejected with ERR_AGE_INELIGIBLE — the boundary is inclusive at 744.'
    test_recipe:
      setup:
      - 'Worker wa: born 1964-06 -> entitlement 2026-06 is exactly 744 months'
      - 'Worker wb: born 1964-07 -> entitlement 2026-06 is 743 months'
