        excluded_because:
          difficulty_instance: verify_placement_safety_priority_50_beats_temporal_priority_59
          rationale: "That §1.8 instance already exercises the segregation-of-duties refusal in its strongest form: a StoreManager who placed the label is refused as verifier with ERR_SEGREGATION_OF_DUTIES even though the verification window has also expired, which simultaneously proves the placer/verifier comparison and its priority over the temporal rule. A separate §1.9 instance would only repeat the same call with a weaker assertion set."

