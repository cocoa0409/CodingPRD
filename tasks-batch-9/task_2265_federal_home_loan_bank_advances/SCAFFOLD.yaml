    side_effects:
      - "drives state_machines.CollateralAsset.status UNDER_REVIEW|SUSPENDED -> ELIGIBLE, or -> INELIGIBLE when force_ineligible is true"
      - "computes effective_listing_mode, discount_factor_bps (calculations.asset_discount_factor), collateral_basis_cents, lendable_value_cents"
      - "recomputes MemberBank.lendable_collateral_value_cents and borrowing_capacity_cents, then runs calculations.collateral_posture_recompute"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_COLLATERAL_ASSET_NOT_FOUND, ERR_INVALID_STATE, ERR_PLEDGE_AGREEMENT_NOT_EXECUTED, ERR_CRITICAL_FINDINGS_OPEN, ERR_SECURITIES_REQUIRE_DELIVERY, ERR_DOCUMENTATION_MISSING, ERR_LTV_EXCEEDS_MAX, ERR_DELINQUENT_ASSET_INELIGIBLE]

  - method: PATCH
    path: /fhlb/collateral-assets/{collateral_asset_id}/documentation
    roles: [CollateralCustodian]
    input: ["documentation_status?", "custody_location?", "delinquency_days?", "market_value_cents?", "ltv_bps?", "appraisal_date?"]
    output: CollateralAsset
    side_effects:
      - "drives state_machines.CollateralAsset.status ELIGIBLE|INELIGIBLE|SUSPENDED -> UNDER_REVIEW"
      - "sets discount_factor_bps = 0 and lendable_value_cents = 0, recomputes collateral_basis_cents and effective_listing_mode"
      - "recomputes MemberBank.lendable_collateral_value_cents and borrowing_capacity_cents, then runs calculations.collateral_posture_recompute"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_COLLATERAL_ASSET_NOT_FOUND, ERR_INVALID_STATE]

  - method: POST
    path: /fhlb/collateral-assets/{collateral_asset_id}/substitute
    roles: [TreasuryOfficer]
    input: [expected_member_bank_version, asset_class, market_value_cents, appraisal_date, "unpaid_principal_balance_cents?", "ltv_bps?", "delinquency_days?", "documentation_status?", "custody_location?"]
    output: CollateralAsset
    side_effects:
      - "creates a replacement CollateralAsset with replaces_asset_id = {collateral_asset_id}, status UNDER_REVIEW; the replacement is the response body"
      - "drives state_machines.CollateralAsset.status ELIGIBLE|SUSPENDED|INELIGIBLE -> SUBSTITUTED on the outgoing asset and zeroes its lendable_value_cents"
      - "moves every RECEIVED or EXCEPTION SafekeepingReceipt of the outgoing asset to RETURNED"
      - "recomputes MemberBank.lendable_collateral_value_cents and borrowing_capacity_cents, then runs calculations.collateral_posture_recompute"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_COLLATERAL_ASSET_NOT_FOUND, ERR_MEMBER_SCOPE_VIOLATION, ERR_STALE_MEMBER_VERSION, ERR_INVALID_STATE, ERR_SUBSTITUTION_REDUCES_LENDABLE_VALUE]

