          Numeric metric: lead_days >= 7 gives full refund, lead_days 6 gives 50%. With deposit
          450 (DAYCARE SMALL STANDARD) at lead exactly 7 the refund is 450; at lead 6 it is 225.
          This instance pins lead == 7 (cancel endpoint) for the full-refund boundary.
