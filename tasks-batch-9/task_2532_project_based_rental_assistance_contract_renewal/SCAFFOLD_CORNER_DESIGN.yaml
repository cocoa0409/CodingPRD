            - "${uhap_after} == 19 and ${ev_after} == 0 and ${released_after} == 1, summing to the unchanged assisted_unit_count 20"
            - "${c2_status} == ACTIVE and ${c2_hap} == 127000 — move-out leaves certifications untouched"
            - "${included} == 2 and ${requested} == 145952 (84500 for the full-month household plus 61452 for 15 of 31 days)"
            - "TenantHousehold.${t1_id}.status == ACTIVE"

      - name: a_rejected_utility_allowance_analysis_can_be_resubmitted_and_the_loop_terminates_in_approval
        claim_type: cyclic
        grounds:
          - state_machines.UtilityAllowanceAnalysis.SUBMITTED_to_REJECTED
          - state_machines.UtilityAllowanceAnalysis.REJECTED_to_SUBMITTED
          - state_machines.UtilityAllowanceAnalysis.SUBMITTED_to_APPROVED
          - validations[priority=34]
          - errors[ERR_UA_ANALYSIS_IN_FLIGHT]
        distinguishing_aspect: "state_machine_shape is cyclic, and this is the analysis loop rather than the study loop: SUBMITTED -> REJECTED -> SUBMITTED can repeat with no round counter at all, yet the loop is bounded by a different mechanism — while the row sits SUBMITTED or APPROVED no OTHER analysis on the same property may enter the loop (409 ERR_UA_ANALYSIS_IN_FLIGHT). The computed fields are frozen at creation, so a rejection does not re-derive proposed_allowance_cents."
        test_recipe:
          setup: ["Owner, one property with baseline 11500, two DRAFT FACTOR_BASED analyses A (+0.09, effective 2026-09-01) and B (+0.05, effective 2026-10-01)."]
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/utility-allowance-analyses"
              payload: { property_id: "${property_id}", method: "FACTOR_BASED", effective_date: "2026-09-01", utility_rate_change_pct: 0.09 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { ua_a_id: $.data.id, ua_a_proposed: $.data.proposed_allowance_cents }
            - call: "POST /pbra/utility-allowance-analyses"
              payload: { property_id: "${property_id}", method: "FACTOR_BASED", effective_date: "2026-10-01", utility_rate_change_pct: 0.05 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { ua_b_id: $.data.id, ua_b_proposed: $.data.proposed_allowance_cents }
          trigger:
            - call: "POST /pbra/utility-allowance-analyses/${ua_a_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { a_state_1: $.data.state }
            - call: "POST /pbra/utility-allowance-analyses/${ua_b_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/utility-allowance-analyses/${ua_a_id}/decide"
              payload: { decision: "REJECT", reason: "Attach the utility company rate schedule" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { a_state_2: $.data.state, a_approver_2: $.data.approver_user_id }
            - call: "POST /pbra/utility-allowance-analyses/${ua_a_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { a_state_3: $.data.state, a_proposed_3: $.data.proposed_allowance_cents }
            - call: "POST /pbra/utility-allowance-analyses/${ua_a_id}/decide"
              payload: { decision: "REJECT", reason: "Still missing the rate schedule" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { a_state_4: $.data.state }
            - call: "POST /pbra/utility-allowance-analyses/${ua_a_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { a_state_5: $.data.state }
            - call: "POST /pbra/utility-allowance-analyses/${ua_a_id}/decide"
              payload: { decision: "ACCEPT" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { a_state_6: $.data.state, a_approver_6: $.data.approver_user_id }
          assert:
            - "${ua_a_proposed} == 12535 and ${ua_b_proposed} == 12075"
            - "${a_state_1} == SUBMITTED"
            - "The submit on ${ua_b_id} returns HTTP 409 with error_id ERR_UA_ANALYSIS_IN_FLIGHT and leaves UtilityAllowanceAnalysis.${ua_b_id}.state == DRAFT"
            - "${a_state_2} == REJECTED, ${a_state_3} == SUBMITTED, ${a_state_4} == REJECTED, ${a_state_5} == SUBMITTED, ${a_state_6} == APPROVED — two full loops with no round limit"
            - "${a_proposed_3} == 12535 and UtilityAllowanceAnalysis.${ua_a_id}.change_pct == 0.0900 — resubmission never re-derives the computed fields"
            - "${a_approver_2} == null and ${a_approver_6} == ca-reviewer-1 — approver_user_id is written only on ACCEPT"
            - "Property.${property_id}.current_utility_allowance_cents == 11500 — an APPROVED analysis moves nothing until it is applied"

