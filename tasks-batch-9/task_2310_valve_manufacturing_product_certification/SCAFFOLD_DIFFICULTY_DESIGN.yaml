            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-04", facility_code: "FAC-1", scope_valve_types: ["BALL"], lead_auditor_user_id: "aud-1", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
            - call: "POST /valve-mfg/valve-units"
