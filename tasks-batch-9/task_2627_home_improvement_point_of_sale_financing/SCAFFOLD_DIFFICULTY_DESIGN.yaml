              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_tx: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "CA-RCF-40011", state_code: "CA", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_ca: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses/${lic_ca}/verification"
              payload: { outcome: "VERIFIED", verification_note: "CA board record matched" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-submission"
              payload: { attestation_ref: "ATT-2026-0801" }
              as: Merchant
              as_user_id: "${merch_id}"
          trigger:
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "First attempt" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/licenses/${lic_tx}/verification"
              payload: { outcome: "REJECTED", verification_note: "Licence number does not match the state board record" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "Second attempt" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120-R2", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_tx2: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses/${lic_tx2}/verification"
              payload: { outcome: "VERIFIED", verification_note: "Corrected licence number matched" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "Third attempt" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
          assert:
            - "WRONG STATE ON THE OTHER ENTITY: trigger step 1 returns HTTP 422 with error_id ERR_LICENSE_NOT_VERIFIED — the TX licence is UNVERIFIED and the VERIFIED licence is for CA"
            - "trigger step 2 returns HTTP 200 with MerchantLicense.${lic_tx}.verification_status == REJECTED and verified_by_user_id == uw-1"
            - "STILL WRONG: trigger step 3 returns HTTP 422 with error_id ERR_LICENSE_NOT_VERIFIED — a REJECTED licence does not satisfy the gate either"
            - "trigger step 4 returns HTTP 201, NOT ERR_LICENSE_COVERAGE_OVERLAP: the identical 2026-01-01 -> 2027-06-30 ROOFING/TX interval is free again because the overlapping licence is REJECTED and no longer participates"
            - "trigger step 5 returns HTTP 200 with MerchantLicense.${lic_tx2}.verification_status == VERIFIED and verified_on == 2026-08-01T00:00:00Z"
            - "GATE SATISFIED: trigger step 6 returns HTTP 200 with Merchant.${merch_id}.enrollment_status == APPROVED, approved_by_user_id == uw-1, approved_on == 2026-08-01T00:00:00Z"
            - "VERSION UNTOUCHED BY FAILURES: Merchant.${merch_id}.version == 3 (1 at registration, 2 at submission, 3 at the successful APPROVE) — the two rejected decisions incremented nothing"
            - "Merchant.${merch_id}.enrollment_status was still PENDING_REVIEW immediately after trigger steps 1 and 3"
            - "Merchant.${merch_id}.risk_tier == STANDARD, portfolio_grade == A, reserve_coverage_bps == 10000 after approval"

