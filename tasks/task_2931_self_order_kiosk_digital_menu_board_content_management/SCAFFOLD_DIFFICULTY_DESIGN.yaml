            - "${four_units} == 4, ${four_supply} == LOW and ${four_avail} == LIMITED (the threshold itself is LOW: 0 < 4 <= 4)"
            - "the LOW threshold equals round_half_up(20 * 2000 / 10000) == 4, so a threshold of 5 or of 3 both fail this test"
