            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employer with admin_fee_pct 0.085 and overage_billing_enabled true; ACTIVE plan with annual_use_limit_days 1, copay_center_cents_per_day 1500, overage_rate_center_cents_per_day 20000 and no_show_charge_cents 12000."
            - "One employee with three ACTIVE CHILD dependents."
