scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: allowable_increase_banked_vs_standard
        grounds:
          - calculations.allowable_increase
          - entities.Unit.fields.banked_pct
          - entities.Unit.fields.current_lawful_rent_cents
        distinguishing_aspect: >
          On the SAME unit (lawful 300000, banked_pct 0.05, AGA 2026 = 0.03), the BANKED
          variant admits proposed 324000 while the STANDARD variant caps at 309000 — the
          divergence is on the Unit rent domain, distinct from the Penalty domain in the
          other instance.
        test_recipe:
          setup:
            - "Landlord and a STABILIZED unit with base/lawful 300000 exist."
            - "AGA 2025 = 0.05 and AGA 2026 = 0.03 are published."
            - "A prior 2025 rent-adjustment taking 0% banks the unused 0.05, so banked_pct == 0.05."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Acme Rentals", email: "acme@x.com", business_license_no: "BL-100" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/aga-determinations"
              payload: { effective_year: 2025, cpi_pct: 0.051, aga_pct: 0.05, effective_from: "2025-01-01", effective_to: "2025-12-31" }
              as: RentBoardClerk
            - call: "POST /rent-board/aga-determinations"
              payload: { effective_year: 2026, cpi_pct: 0.032, aga_pct: 0.03, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RentBoardClerk
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "1 Main St #2", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id, u_v1: $.data.version }
            - call: "POST /rent-board/units/${u_id}/rent-adjustments"
              payload: { effective_date: "2025-06-01", proposed_new_rent_cents: 300000, apply_banked: false, expected_unit_version: "${u_v1}" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_v2: $.data.version }
          trigger:
            - call: "POST /rent-board/units/${u_id}/rent-adjustments"
              payload: { effective_date: "2026-06-01", proposed_new_rent_cents: 324000, apply_banked: true, expected_unit_version: "${u_v2}" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_v3: $.data.version }
          assert:
            - "Unit.${u_id}.current_lawful_rent_cents == 324000"
            - "Unit.${u_id}.banked_pct == 0.0"
            - "Under the STANDARD variant the same proposed 324000 would exceed the 309000 cap (ERR_INCREASE_EXCEEDS_ALLOWABLE)."

      - name: overcharge_treble_vs_interest
        grounds:
          - calculations.overcharge_penalty
          - entities.Penalty.fields.assessed_amount_cents
          - entities.Penalty.fields.willful
        distinguishing_aspect: >
          Same overcharge base (10 months × 13400 = 134000 cents) yields 402000 under the
          WILLFUL treble variant vs 135010 under the NON_WILLFUL base+interest variant —
          divergence on the Penalty domain, distinct from the Unit-rent divergence above.
        test_recipe:
          setup:
            - "A landlord and a unit exist."
            - "Two OVERCHARGE penalties are assessed with identical base (months 10, monthly 13400), one willful, one not."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Beta Holdings", email: "beta@x.com", business_license_no: "BL-200" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "22 Oak Ave #1", bedrooms: 1, base_rent_cents: 250000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /rent-board/penalties"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", penalty_type: "OVERCHARGE", months_overcharged: 10, monthly_overcharge_cents: 13400, willful: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pen_w: $.data.id }
            - call: "POST /rent-board/penalties"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", penalty_type: "OVERCHARGE", months_overcharged: 10, monthly_overcharge_cents: 13400, willful: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pen_n: $.data.id }
          assert:
            - "Penalty.${pen_w}.assessed_amount_cents == 402000"
            - "Penalty.${pen_n}.assessed_amount_cents == 135010"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: capital_passthrough_tiered_cap_mode_a
        grounds:
          - calculations.petition_passthrough
          - entities.Unit.fields.bedrooms
          - entities.Unit.fields.base_rent_cents
          - state_machines.Petition.HEARING_SCHEDULED_to_GRANTED
        distinguishing_aspect: >
          Mode (a): min(amortized cost 40000, tiered cap 18000) with the cap tier selected by
          bedrooms (2 -> 0.06) — ≥3 inputs (cost, months, base_rent, bedrooms), nested min +
          conditional tier selection; result 18000 is the capped value, not the raw amortization.
        test_recipe:
          setup:
            - "Landlord + 2-bedroom unit (base 300000) + officer exist."
            - "A CAPITAL_IMPROVEMENT petition (cost 4,800,000, amortize 120mo) is UNDER_REVIEW with a scheduled hearing."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Cap Owners", email: "cap@x.com", business_license_no: "BL-300" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Ruiz", email: "ruiz@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "5 Elm St #3", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 4800000, amortization_months: 120 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/petitions/${pet_id}/review"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
            - call: "POST /rent-board/petitions/${pet_id}/hearings"
              payload: { officer_id: "${o_id}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: RentBoardClerk
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /rent-board/hearings/${h_id}/decide"
              payload: { decision: "GRANT" }
              as: HearingOfficer
              as_user_id: "${o_id}"
          assert:
            - "Petition.${pet_id}.granted_amount_cents == 18000"
            - "Petition.${pet_id}.status == GRANTED"
            - "Unit.${u_id}.current_lawful_rent_cents == 318000"

      - name: overcharge_interest_rounding_order_mode_b
        grounds:
          - calculations.overcharge_penalty
          - entities.Penalty.fields.assessed_amount_cents
        distinguishing_aspect: >
          Mode (b): interest = round_half_up(13400 × 0.0075)=101 per month × 10 = 1010 (round-per-month-then-sum),
          giving assessed 135010; sum-then-round would give 1005 → 135005. The scaffold pins per-month-then-sum.
        test_recipe:
          setup:
            - "A landlord and a unit exist."
            - "A NON_WILLFUL OVERCHARGE penalty with months 10, monthly 13400 is assessed."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Delta Prop", email: "delta@x.com", business_license_no: "BL-400" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "9 Pine Rd #4", bedrooms: 3, base_rent_cents: 400000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /rent-board/penalties"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", penalty_type: "OVERCHARGE", months_overcharged: 10, monthly_overcharge_cents: 13400, willful: false }
              as: ComplianceOfficer
              as_user_id: "co-9"
              captures: { pen_id: $.data.id }
          assert:
            - "Penalty.${pen_id}.assessed_amount_cents == 135010"
            - "sum-then-round would incorrectly yield 135005."

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: petition_revision_cycle
        grounds:
          - state_machines.Petition.UNDER_REVIEW_to_NEEDS_REVISION
          - state_machines.Petition.NEEDS_REVISION_to_SUBMITTED
          - entities.Petition.fields.revision_count
        distinguishing_aspect: >
          Cyclic loop on Petition: UNDER_REVIEW -> NEEDS_REVISION -> SUBMITTED, with
          revision_count incremented to 1 on resubmission (a genuine A->B->A cycle, not a linear pipeline).
        test_recipe:
          setup:
            - "A CAPITAL_IMPROVEMENT petition is UNDER_REVIEW then sent to NEEDS_REVISION."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Echo LLC", email: "echo@x.com", business_license_no: "BL-500" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Kim", email: "kim@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "11 Birch Ln #1", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 1200000, amortization_months: 60 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/petitions/${pet_id}/review"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
            - call: "POST /rent-board/petitions/${pet_id}/request-revision"
              payload: { reason: "insufficient invoices" }
              as: HearingOfficer
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
          assert:
            - "Petition.${pet_id}.status == SUBMITTED"
            - "Petition.${pet_id}.revision_count == 1"

      - name: buyout_fork_rescind_branch
        grounds:
          - state_machines.Buyout.FILED_to_RESCINDED
          - state_machines.Buyout.FILED_to_COMPLETED
          - entities.Buyout.fields.status
        distinguishing_aspect: >
          Branching fork on Buyout: from FILED the RESCINDED branch releases escrow and LEAVES
          the tenancy ACTIVE, whereas the COMPLETED branch also ENDS the tenancy — divergent
          side-effect sets from one state (a different entity than the cyclic Petition).
        test_recipe:
          setup:
            - "Landlord, tenant, unit, ACTIVE tenancy exist; a buyout (relocation 1,000,000) is FILED at the default clock."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Fox Realty", email: "fox@x.com", business_license_no: "BL-600" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Jamie Tenant", email: "jamie@x.com", phone: "555-0100" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "3 Cedar Ct #2", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-04-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ten_id: $.data.id }
            - call: "POST /rent-board/buyouts"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", tenant_id: "${t_id}", offer_amount_cents: 5000000, relocation_amount_cents: 1000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { b_id: $.data.id }
            - call: "POST /rent-board/buyouts/${b_id}/file"
              payload: { disclosure_acknowledged: true }
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /rent-board/buyouts/${b_id}/rescind"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
          assert:
            - "Buyout.${b_id}.status == RESCINDED"
            - "Landlord.${l_id}.escrow_committed_cents == 0"
            - "Tenancy.${ten_id}.status == ACTIVE"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: hearing_grant_cascade_depth3
        grounds:
          - state_machines.Hearing.SCHEDULED_to_HELD
          - state_machines.Petition.HEARING_SCHEDULED_to_GRANTED
          - entities.Unit.fields.current_lawful_rent_cents
          - entities.Tenancy.fields.monthly_rent_cents
        distinguishing_aspect: >
          Depth-3 chain from POST /hearings/{id}/decide(GRANT): Hearing->HELD triggers
          Petition->GRANTED (link1), which raises Unit.current_lawful_rent_cents by 18000 (link2),
          which cascades to the ACTIVE Tenancy.monthly_rent_cents (link3): 300000 -> 318000.
        test_recipe:
          setup:
            - "Landlord + 2BR unit (300000) + tenant + ACTIVE tenancy (monthly 300000) + officer."
            - "A CAPITAL petition (cost 4,800,000/120mo) is UNDER_REVIEW with a scheduled hearing."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Golf Estates", email: "golf@x.com", business_license_no: "BL-700" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Robin Lee", email: "robin@x.com", phone: "555-0200" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Diaz", email: "diaz@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "7 Maple Dr #2", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-04-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ten_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 4800000, amortization_months: 120 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/petitions/${pet_id}/review"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
            - call: "POST /rent-board/petitions/${pet_id}/hearings"
              payload: { officer_id: "${o_id}", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: RentBoardClerk
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /rent-board/hearings/${h_id}/decide"
              payload: { decision: "GRANT" }
              as: HearingOfficer
              as_user_id: "${o_id}"
          assert:
            - "Petition.${pet_id}.status == GRANTED"
            - "Unit.${u_id}.current_lawful_rent_cents == 318000"
            - "Tenancy.${ten_id}.monthly_rent_cents == 318000"

      - name: service_decrease_cascade_depth2
        grounds:
          - state_machines.ServiceClaim.INVESTIGATING_to_SUBSTANTIATED
          - calculations.service_decrease
          - entities.Unit.fields.current_lawful_rent_cents
          - entities.Tenancy.fields.monthly_rent_cents
        distinguishing_aspect: >
          Depth-2 chain from POST /service-claims/{id}/decide(SUBSTANTIATE): claim substantiation
          lowers Unit.current_lawful_rent_cents by 75000 (link1) which cascades to the ACTIVE
          Tenancy.monthly_rent_cents (link2): 300000 -> 225000. Different trigger from the hearing cascade.
        test_recipe:
          setup:
            - "Landlord + unit (300000) + tenant + ACTIVE tenancy; a SUBSTANTIAL HEAT service claim is INVESTIGATING."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Hotel Props", email: "hotel@x.com", business_license_no: "BL-800" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Sam Park", email: "sam@x.com", phone: "555-0300" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Blake", email: "blake@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "8 Walnut St #5", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-04-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ten_id: $.data.id }
            - call: "POST /rent-board/service-claims"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", claim_type: "HEAT", severity: "SUBSTANTIAL" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /rent-board/service-claims/${sc_id}/investigate"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /rent-board/service-claims/${sc_id}/decide"
              payload: { disposition: "SUBSTANTIATE" }
              as: HearingOfficer
              as_user_id: "${o_id}"
          assert:
            - "ServiceClaim.${sc_id}.decrease_amount_cents == 75000"
            - "Unit.${u_id}.current_lawful_rent_cents == 225000"
            - "Tenancy.${ten_id}.monthly_rent_cents == 225000"

  # ===================================================================
  # Rule 5 — Validation priority conflicts across different category pairs
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stabilization_state_outranks_occupancy_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=15]
        distinguishing_aspect: >
          On POST /tenancies against an EXEMPT unit that is also occupied, ERR_UNIT_NOT_STABILIZED
          (state, pri 7) is returned over ERR_UNIT_OCCUPIED (business_temporal, pri 15) — the pair
          is state vs business_temporal.
        test_recipe:
          setup:
            - "Unit has an ACTIVE tenancy occupying 2026-06-01..2027-06-01 and has been made EXEMPT via an approved SUBSTANTIAL_REHAB exemption."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "India Corp", email: "india@x.com", business_license_no: "BL-900" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Alex Fox", email: "alex@x.com", phone: "555-0400" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "4 Ash Blvd #2", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-06-01", end_date: "2027-06-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ten_id: $.data.id }
            - call: "POST /rent-board/exemptions"
              payload: { unit_id: "${u_id}", exemption_type: "SUBSTANTIAL_REHAB" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ex_id: $.data.id }
            - call: "POST /rent-board/exemptions/${ex_id}/decide"
              payload: { decision: "APPROVE", effective_date: "2026-06-15" }
              as: ComplianceOfficer
              as_user_id: "co-5"
          trigger:
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-08-01", end_date: "2027-08-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNIT_NOT_STABILIZED (not ERR_UNIT_OCCUPIED)"

      - name: disclosure_safety_outranks_relocation_fiscal
        grounds:
          - validations[priority=11]
          - validations[priority=17]
        distinguishing_aspect: >
          On POST /buyouts/{id}/file with disclosure_acknowledged=false AND relocation below the
          500000 floor, ERR_DISCLOSURE_REQUIRED (business_safety, pri 11) is returned over
          ERR_RELOCATION_BELOW_MINIMUM (business_fiscal, pri 17) — the pair is business_safety vs business_fiscal.
        test_recipe:
          setup:
            - "Landlord, tenant, unit, ACTIVE tenancy, and a DRAFT buyout with relocation 100000 (< 500000 floor)."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Juliet Homes", email: "juliet@x.com", business_license_no: "BL-1000" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Chris Ray", email: "chris@x.com", phone: "555-0500" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/units"
