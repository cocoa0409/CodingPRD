            - "APP_A (80.00 tpy) screened onto the ENHANCED track, status ENHANCED_REVIEW (never advanced)."
            - "Its only CumulativeImpactAssessment is in DRAFT (never submitted for QA), so the governing assessment is not ACCEPTED."
