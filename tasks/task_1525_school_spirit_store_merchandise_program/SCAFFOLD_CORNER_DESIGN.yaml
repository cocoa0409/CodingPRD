          assert:
            - "err == ERR_PREORDER_NOT_CANCELLABLE (campaign locked past OPEN)"

      - name: lock_without_eligible_vendor_returns_no_vendor
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ELIGIBLE_VENDOR]", calculations.vendor_quote_selector]
        distinguishing_aspect: "Goal met but zero vendors exist: the selector's empty-pool fallback is ERR_NO_ELIGIBLE_VENDOR and the campaign STAYS OPEN (no state change on failure)."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED; variant M; campaign goal 1 OPEN with one PAID preorder; NO vendors; clock past closes"]
