# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3263_node_split_planning_bandwidth_reclamation_speed_tier
# Depth probe: 2+ instances per Difficulty Rule (19 instances total).
# Every recipe replays from empty DB using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: utilization_peak_pct95_vs_sustained_avg_same_samples
        grounds:
          - calculations.sg_utilization
          - entities.ServiceGroup.fields.utilization_method
          - entities.ServiceGroup.fields.posture
        distinguishing_aspect: |
          Same four samples on two service groups of one node: PEAK_PCT95 yields
          load 410 / 89.9% / CRITICAL while SUSTAINED_AVG yields load 357 / 78.3% /
          ELEVATED — two valid aggregations of identical data diverge, and only the
          PEAK_PCT95 group auto-creates a SYSTEM capacity action.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z"
            - "Node NE-100: spectrum 168 MHz = DATA 48 + DATA 24 (capacity 304+152=456 Mbps) + LEGACY_VIDEO 24x4"
            - "SG-P (PEAK_PCT95, homes 500) and SG-S (SUSTAINED_AVG, homes 100), warn 70 / crit 85"
            - "Both groups received samples 300, 320, 400, 410 Mbps measured 2026-09-30T18:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-100", homes_passed: 1000, downstream_spectrum_mhz: 168, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-P", homes_passed: 500, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sgp: $.data.id }
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-S", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "SUSTAINED_AVG" }
              as: CapacityEngineer
              captures: { sgs: $.data.id }
            - call: "POST /service-groups/${sgp}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:00:00Z", downstream_mbps: 300, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "POST /service-groups/${sgp}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:05:00Z", downstream_mbps: 320, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "POST /service-groups/${sgp}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:10:00Z", downstream_mbps: 400, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "POST /service-groups/${sgp}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:15:00Z", downstream_mbps: 410, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "POST /service-groups/${sgs}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:00:00Z", downstream_mbps: 300, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "POST /service-groups/${sgs}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:05:00Z", downstream_mbps: 320, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "POST /service-groups/${sgs}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:10:00Z", downstream_mbps: 400, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "POST /service-groups/${sgs}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:15:00Z", downstream_mbps: 410, upstream_mbps: 10 }
              as: PlatformAdmin
          trigger:
            - call: "GET /service-groups/${sgp}"
              as: Any
            - call: "GET /service-groups/${sgs}"
              as: Any
            - call: "GET /service-groups/${sgp}/capacity-actions"
              as: Any
            - call: "GET /service-groups/${sgs}/capacity-actions"
              as: Any
          assert:
            - "ServiceGroup.${sgp}.current_load_mbps == 410 (nearest-rank P95 over 4 samples: rank ceil(0.95*4)=4)"
            - "ServiceGroup.${sgp}.current_utilization_pct == 89.9 and posture == CRITICAL"
            - "ServiceGroup.${sgs}.current_load_mbps == 357 (floor of 357.5 sustained mean) and current_utilization_pct == 78.3 and posture == ELEVATED"
            - "GET /service-groups/${sgp}/capacity-actions returns exactly 1 action with origin SYSTEM, status PROPOSED, action_type SPECTRUM_RECLAIM (node has 4 VIDEO_ACTIVE blocks)"
            - "GET /service-groups/${sgs}/capacity-actions returns an empty list"

      - name: complaint_evidence_vs_recency_weighted_same_signals
        grounds:
          - calculations.complaint_cause_scores
          - state_machines.CongestionComplaint.INVESTIGATING_to_CLASSIFIED
        distinguishing_aspect: |
          Two complaints with identical signals (70/60/50) on a premise with a prior
          IN_HOME resolution: EVIDENCE_WEIGHTED classifies PLANT (raw argmax) while
          RECENCY_WEIGHTED classifies IN_HOME (0.6-weighted scores 42.0/76.0/30.0 after
          the +40 prior-cause boost) — same inputs, different entity domain than
          utilization, different outcome.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; node NE-C (spectrum 72 = DATA 48 + VIDEO 24, capacity 304); SG-C warn 70 crit 85 PEAK_PCT95 homes 200"
            - "Premise P-1 with a prior complaint resolved as IN_HOME (signals 10/80/10, EVIDENCE_WEIGHTED)"
            - "Two fresh complaints B and C with signals plant 70 / home 60 / destination 50"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-C", homes_passed: 500, downstream_spectrum_mhz: 72, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-C", homes_passed: 200, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-1", address: "1 Main St" }
              as: ProvisioningAgent
              captures: { cp: $.data.id }
            - call: "POST /customer-premises/${cp}/congestion-complaints"
              payload: { description: "first: pixelation", plant_signal: 10, home_signal: 80, destination_signal: 10 }
              as: CustomerCare
              captures: { ccA: $.data.id }
            - call: "POST /congestion-complaints/${ccA}/classify"
              payload: { scoring_variant: "EVIDENCE_WEIGHTED", cause_category: "IN_HOME" }
              as: CustomerCare
            - call: "POST /congestion-complaints/${ccA}/resolve"
              payload: { resolution_note: "rewired drop" }
              as: CustomerCare
            - call: "POST /customer-premises/${cp}/congestion-complaints"
              payload: { description: "second: buffering", plant_signal: 70, home_signal: 60, destination_signal: 50 }
              as: CustomerCare
              captures: { ccB: $.data.id }
            - call: "POST /customer-premises/${cp}/congestion-complaints"
              payload: { description: "third: buffering again", plant_signal: 70, home_signal: 60, destination_signal: 50 }
              as: CustomerCare
              captures: { ccC: $.data.id }
          trigger:
            - call: "POST /congestion-complaints/${ccB}/classify"
              payload: { scoring_variant: "EVIDENCE_WEIGHTED", cause_category: "PLANT" }
              as: CustomerCare
            - call: "POST /congestion-complaints/${ccC}/classify"
              payload: { scoring_variant: "RECENCY_WEIGHTED", cause_category: "IN_HOME" }
              as: CustomerCare
          assert:
            - "Complaint.${ccB}.status == CLASSIFIED and cause_category == PLANT and score_plant == 70.0 and score_in_home == 60.0 and score_destination == 50.0"
            - "Complaint.${ccC}.status == CLASSIFIED and cause_category == IN_HOME and score_plant == 42.0 and score_in_home == 76.0 and score_destination == 30.0"
            - "identical raw signals produce different classified causes purely from the scoring variant"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: node_split_homes_waterfall_with_clamps
        grounds:
          - calculations.node_split_homes_allocation
          - state_machines.NodeSplitProject.IN_CONSTRUCTION_to_COMPLETED
        distinguishing_aspect: |
          Mode (a) combinatorial: the waterfall over H=1000 homes, k=3 children with
          min 200 / max 400 yields 333/333/334 — floor-division base, per-child clamp,
          and a remainder-bearing last child interact non-linearly; clamping any early
          child shifts every later allocation.
        test_recipe:
          setup:
            - "Node NE-S (1000 homes, spectrum 48 = DATA 48, capacity 304) with single service group SG-SPLIT of 1000 homes"
            - "NODE_SPLIT capacity action APPROVED then IN_PROGRESS; project with child_count 3, min 200, max 400, permit GRANTED, window 2026-11-01..2026-11-10, IN_CONSTRUCTION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-S", homes_passed: 1000, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-SPLIT", homes_passed: 1000, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "NODE_SPLIT", expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/node-split-projects"
              payload: { child_count: 3, min_homes_per_child: 200, max_homes_per_child: 400 }
              as: NetworkPlanner
              captures: { nsp: $.data.id }
            - call: "POST /node-split-projects/${nsp}/adjudicate-permit"
              payload: { decision: "GRANTED" }
              as: FranchiseAdmin
              captures: { nsp_v: $.data.version }
            - call: "POST /node-split-projects/${nsp}/schedule"
              payload: { window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-10T00:00:00Z", expected_node_split_project_version: "${nsp_v}" }
              as: NetworkPlanner
            - call: "POST /capacity-actions/${ca}/begin"
              as: CapacityEngineer
            - call: "POST /node-split-projects/${nsp}/begin-construction"
              as: FieldOpsCoordinator
          trigger:
            - call: "POST /node-split-projects/${nsp}/cutover"
              as: FieldOpsCoordinator
          assert:
            - "NodeSplitProject.${nsp}.status == COMPLETED"
            - "NodeSplitProject.${nsp}.child_allocations == [333, 333, 334] (floor(1000/3)=333, floor(667/2)=333, remainder 334; all inside [200,400])"
            - "sum(child_allocations) == 1000 == parent homes before cutover (homes conserved)"
            - "NodeSplitProject.${nsp}.child_service_group_ids has exactly 3 entries"

      - name: spectrum_reclaim_per_block_rounding_order
        grounds:
          - calculations.sg_downstream_capacity
          - state_machines.SpectrumBlock.RECLAIM_PENDING_to_DATA_ACTIVE
          - state_machines.CapacityAction.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) nested rounding: reclaiming 21-MHz and 15-MHz video blocks adds
          floor(21/6)*38 + floor(15/6)*38 = 114 + 76 = 190 Mbps (capacity 380 -> 570);
          summing MHz first would give floor(36/6)*38 = 228 — the pinned per-block
          truncation order decides the result.
        test_recipe:
          setup:
            - "Node NE-R: spectrum 120 = VIDEO 21 + VIDEO 15 + VIDEO 24 + DATA 60 (capacity 380); SG-R warn 70 crit 85, PEAK_PCT95, homes 100"
            - "One sample of 480 Mbps -> CRITICAL (auto SYSTEM action created and then superseded)"
            - "MANUAL SPECTRUM_RECLAIM action targeting the 21-MHz and 15-MHz blocks, APPROVED, IN_PROGRESS; two waves executed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-R", homes_passed: 300, downstream_spectrum_mhz: 120, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 21 }
              as: CapacityEngineer
              captures: { v21: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 15 }
              as: CapacityEngineer
              captures: { v15: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 60 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-R", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /service-groups/${sg}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:00:00Z", downstream_mbps: 480, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "GET /service-groups/${sg}"
              as: Any
              captures: { sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "SPECTRUM_RECLAIM", target_block_ids: ["${v21}", "${v15}"], expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/begin"
              as: CapacityEngineer
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-R1", address: "2 Oak Ave" }
              as: ProvisioningAgent
              captures: { cp1: $.data.id }
            - call: "POST /customer-premises/${cp1}/equipment"
              payload: { model: "MB8600", docsis_version: "3.0", capability_class: "D30", max_downstream_mbps: 400, video_legacy: true }
              as: ProvisioningAgent
              captures: { cpe1: $.data.id }
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-R2", address: "4 Oak Ave" }
              as: ProvisioningAgent
              captures: { cp2: $.data.id }
            - call: "POST /customer-premises/${cp2}/equipment"
              payload: { model: "MB8600", docsis_version: "3.0", capability_class: "D30", max_downstream_mbps: 400, video_legacy: true }
              as: ProvisioningAgent
              captures: { cpe2: $.data.id }
            - call: "POST /capacity-actions/${ca}/migration-waves"
              payload: { wave_code: "W1", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-02T00:00:00Z", target_cpe_ids: ["${cpe1}"] }
              as: NetworkPlanner
              captures: { w1: $.data.id }
            - call: "POST /capacity-actions/${ca}/migration-waves"
              payload: { wave_code: "W2", window_start: "2026-10-10T00:00:00Z", window_end: "2026-10-11T00:00:00Z", target_cpe_ids: ["${cpe2}"] }
              as: NetworkPlanner
              captures: { w2: $.data.id }
            - call: "POST /migration-waves/${w1}/execute"
              as: FieldOpsCoordinator
            - call: "POST /migration-waves/${w2}/execute"
              as: FieldOpsCoordinator
          trigger:
            - call: "POST /capacity-actions/${ca}/complete"
              as: CapacityEngineer
            - call: "GET /service-groups/${sg}"
              as: Any
          assert:
            - "CapacityAction.${ca}.status == COMPLETED"
            - "SpectrumBlock.${v21}.status == DATA_ACTIVE and SpectrumBlock.${v15}.status == DATA_ACTIVE"
            - "ServiceGroup.${sg}.downstream_capacity_mbps == 570 (380 + 114 + 76; NOT 608 from summed-MHz rounding)"
            - "ServiceGroup.${sg}.current_utilization_pct == 84.2 (480*100/570 round_half_up 1dp) and posture == ELEVATED"

      - name: tier_projection_pinned_evaluation_order
        grounds:
          - calculations.tier_provisioning_projection
          - validations[priority=10]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency resolved by pinned order: capacity
          (760) is read first, then current load (600), then the tier increment is
          added, then the >= comparison against crit*capacity — tier DS 46 lands
          exactly on 64600 >= 64600 and is rejected while DS 45 (64500 < 64600)
          validates and generates its config file.
        test_recipe:
          setup:
            - "Node NE-B: spectrum 168 = DATA 60 + DATA 60 (capacity 760) + VIDEO 24x2; SG-B warn 70 crit 85 PEAK_PCT95 homes 300, one sample 600 -> load 600, pct 78.9, ELEVATED"
            - "Tier T46 (DS 46) and T45 (DS 45), both min_capability D40, min_upstream LEGACY"
            - "Premise CP1 and CP2 each with a D40 modem (max 1000, video_legacy false)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-B", homes_passed: 800, downstream_spectrum_mhz: 168, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 60 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 60 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-B", homes_passed: 300, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /service-groups/${sg}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:00:00Z", downstream_mbps: 600, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "POST /speed-tiers"
              payload: { tier_code: "T46", downstream_mbps: 46, upstream_mbps: 10, min_capability_class: "D40", min_upstream_config: "LEGACY" }
              as: PlatformAdmin
              captures: { t46: $.data.id }
            - call: "POST /speed-tiers"
              payload: { tier_code: "T45", downstream_mbps: 45, upstream_mbps: 10, min_capability_class: "D40", min_upstream_config: "LEGACY" }
              as: PlatformAdmin
              captures: { t45: $.data.id }
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-B1", address: "6 Elm St" }
              as: ProvisioningAgent
              captures: { cp1: $.data.id, cp1_v: $.data.version }
            - call: "POST /customer-premises/${cp1}/equipment"
              payload: { model: "XB8", docsis_version: "4.0", capability_class: "D40", max_downstream_mbps: 1000, video_legacy: false }
              as: ProvisioningAgent
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-B2", address: "8 Elm St" }
              as: ProvisioningAgent
              captures: { cp2: $.data.id, cp2_v: $.data.version }
            - call: "POST /customer-premises/${cp2}/equipment"
              payload: { model: "XB8", docsis_version: "4.0", capability_class: "D40", max_downstream_mbps: 1000, video_legacy: false }
              as: ProvisioningAgent
            - call: "POST /customer-premises/${cp1}/provisioning-requests"
              payload: { speed_tier_id: "${t46}", expected_customer_premise_version: "${cp1_v}" }
              as: ProvisioningAgent
              captures: { pr1: $.data.id }
            - call: "POST /customer-premises/${cp2}/provisioning-requests"
              payload: { speed_tier_id: "${t45}", expected_customer_premise_version: "${cp2_v}" }
              as: ProvisioningAgent
              captures: { pr2: $.data.id }
          trigger:
            - call: "POST /provisioning-requests/${pr1}/validate"
              as: ProvisioningAgent
            - call: "POST /provisioning-requests/${pr2}/validate"
              as: ProvisioningAgent
          assert:
            - "validate of ${pr1} responds 422 with error_id ERR_CAPACITY_EXCEEDED ((600+46)*100 == 64600 >= 85*760 == 64600; >= rejects on the exact line)"
            - "ProvisioningRequest.${pr1}.status == FAILED and failure_reason == ERR_CAPACITY_EXCEEDED"
            - "validate of ${pr2} responds 200; ProvisioningRequest.${pr2}.status == VALIDATED"
            - "ProvisioningRequest.${pr2}.config_file_content == \"TIER=T45;DS=45;US=10;CPE=D40\""

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: capacity_action_revise_rework_cycle
        grounds:
          - state_machines.CapacityAction.PROPOSED_to_APPROVED
          - state_machines.CapacityAction.APPROVED_to_PROPOSED
          - state_machines.CapacityAction.APPROVED_to_IN_PROGRESS
          - state_machines.CapacityAction.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          CapacityAction runs a rework cycle PROPOSED->APPROVED->PROPOSED->APPROVED->
          IN_PROGRESS->COMPLETED on an upgrade action — the APPROVED->PROPOSED revise
          edge makes the machine non-linear, unlike a pure forward pipeline.
        test_recipe:
          setup:
            - "Node NE-U: spectrum 48 = DATA 48 (capacity 304), upstream LEGACY; SG-U homes 100 warn 70 crit 85 PEAK_PCT95"
            - "MANUAL MID_SPLIT_UPGRADE action on SG-U"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-U", homes_passed: 300, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-U", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "MID_SPLIT_UPGRADE", target_upstream_config: "MID_SPLIT", expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
          trigger:
            - call: "POST /capacity-actions/${ca}/revise"
              payload: { note: "need updated BOM" }
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/begin"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/complete"
              as: CapacityEngineer
            - call: "GET /optical-nodes/${on}"
              as: Any
          assert:
            - "revise responds 200 with status PROPOSED (cycle edge traversed)"
            - "second approve responds 200 with status APPROVED"
            - "CapacityAction.${ca}.status == COMPLETED after begin+complete"
            - "OpticalNode.${on}.upstream_config == MID_SPLIT"
            - "GET /service-groups/${sg} shows upstream_capacity_mbps == 108"

      - name: provisioning_request_failed_retry_cycle_after_equipment_swap
        grounds:
          - state_machines.ProvisioningRequest.PENDING_to_FAILED
          - state_machines.ProvisioningRequest.FAILED_to_PENDING
          - state_machines.ProvisioningRequest.PENDING_to_VALIDATED
          - state_machines.CustomerEquipment.ACTIVE_to_RETIRED
        distinguishing_aspect: |
          ProvisioningRequest runs a PENDING->FAILED->PENDING->VALIDATED->ACTIVE retry
          cycle on a different entity than CapacityAction: validate fails on a D31
          modem against a D40 tier, a swap installs a D40 unit, retry re-enters
          PENDING and the second validate succeeds.
        test_recipe:
          setup:
            - "Node NE-P: spectrum 48 = DATA 48 (capacity 304); SG-P homes 100 warn 70 crit 85; no samples (load 0)"
            - "Tier GIG: DS 200, min D40, min_upstream LEGACY; premise CP1 with D31 modem (max 400)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-P", homes_passed: 300, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-P", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /speed-tiers"
              payload: { tier_code: "GIG", downstream_mbps: 200, upstream_mbps: 20, min_capability_class: "D40", min_upstream_config: "LEGACY" }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-P1", address: "9 Pine St" }
              as: ProvisioningAgent
              captures: { cp: $.data.id, cp_v: $.data.version }
            - call: "POST /customer-premises/${cp}/equipment"
              payload: { model: "SB8200", docsis_version: "3.1", capability_class: "D31", max_downstream_mbps: 400, video_legacy: false }
              as: ProvisioningAgent
              captures: { cpe1: $.data.id }
            - call: "POST /customer-premises/${cp}/provisioning-requests"
              payload: { speed_tier_id: "${tier}", expected_customer_premise_version: "${cp_v}" }
              as: ProvisioningAgent
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /provisioning-requests/${pr}/validate"
              as: ProvisioningAgent
            - call: "POST /equipment/${cpe1}/swap"
              payload: { model: "XB8", docsis_version: "4.0", capability_class: "D40", max_downstream_mbps: 1000 }
              as: ProvisioningAgent
              captures: { cpe2: $.data.id }
            - call: "POST /provisioning-requests/${pr}/retry"
              as: ProvisioningAgent
            - call: "POST /provisioning-requests/${pr}/validate"
              as: ProvisioningAgent
            - call: "POST /provisioning-requests/${pr}/activate"
              as: ProvisioningAgent
          assert:
            - "first validate responds 422 ERR_CAPABILITY_INSUFFICIENT; ProvisioningRequest.${pr}.status == FAILED with failure_reason ERR_CAPABILITY_INSUFFICIENT"
            - "swap retires ${cpe1} (status RETIRED) and returns new ACTIVE D40 unit ${cpe2}"
            - "retry responds 200 with status PENDING and failure_reason null"
            - "second validate responds 200 with status VALIDATED and config_file_content == \"TIER=GIG;DS=200;US=20;CPE=D40\""
            - "activate responds 200 with status ACTIVE; CustomerPremise.${cp}.provisioned_downstream_mbps == 200 and current_tier_id == ${tier}"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cutover_cascade_project_to_children_to_retirement_to_action
        grounds:
          - state_machines.NodeSplitProject.IN_CONSTRUCTION_to_COMPLETED
          - state_machines.ServiceGroup.posture_SPLIT_RETIRED
          - state_machines.CapacityAction.IN_PROGRESS_to_COMPLETED
          - calculations.node_split_homes_allocation
        distinguishing_aspect: |
          Depth-4 cascade from the cutover trigger: cutover mutates NodeSplitProject
          -> creates child OpticalNode and 2 child ServiceGroups while zeroing the
          parent ServiceGroup -> retires the parent OpticalNode -> auto-completes the
          parent CapacityAction; each hop is caused by the previous mutation, not by
          the original request.
        test_recipe:
          setup:
            - "Node NE-X: 800 homes, spectrum 48 = DATA 48 (capacity 304); SG-X 800 homes"
            - "NODE_SPLIT action IN_PROGRESS; project child_count 2, min 300, max 500, permit GRANTED, scheduled 2026-11-01..2026-11-05, IN_CONSTRUCTION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-X", homes_passed: 800, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-X", homes_passed: 800, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "NODE_SPLIT", expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/node-split-projects"
              payload: { child_count: 2, min_homes_per_child: 300, max_homes_per_child: 500 }
              as: NetworkPlanner
              captures: { nsp: $.data.id }
            - call: "POST /node-split-projects/${nsp}/adjudicate-permit"
              payload: { decision: "GRANTED" }
              as: FranchiseAdmin
              captures: { nsp_v: $.data.version }
            - call: "POST /node-split-projects/${nsp}/schedule"
              payload: { window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-05T00:00:00Z", expected_node_split_project_version: "${nsp_v}" }
              as: NetworkPlanner
            - call: "POST /capacity-actions/${ca}/begin"
              as: CapacityEngineer
            - call: "POST /node-split-projects/${nsp}/begin-construction"
              as: FieldOpsCoordinator
          trigger:
            - call: "POST /node-split-projects/${nsp}/cutover"
              as: FieldOpsCoordinator
            - call: "GET /node-split-projects/${nsp}"
              as: Any
            - call: "GET /capacity-actions/${ca}"
              as: Any
            - call: "GET /optical-nodes/${on}"
              as: Any
            - call: "GET /service-groups/${sg}"
              as: Any
            - call: "GET /franchise-areas/${fa}"
              as: Any
          assert:
            - "NodeSplitProject.${nsp}.status == COMPLETED and child_allocations == [400, 400]"
            - "NodeSplitProject.${nsp}.child_node_id is non-null and child_service_group_ids has 2 entries"
            - "CapacityAction.${ca}.status == COMPLETED (auto-completion cascade, no manual complete call)"
            - "OpticalNode.${on}.status == SPLIT_RETIRED"
            - "ServiceGroup.${sg}.posture == SPLIT_RETIRED and homes_passed == 0"
            - "FranchiseArea.${fa}.homes_built_progress == 800 (children 400+400; conserved across the cascade)"

      - name: reclaim_completion_cascade_blocks_capacity_posture
        grounds:
          - state_machines.CapacityAction.IN_PROGRESS_to_COMPLETED
          - state_machines.SpectrumBlock.RECLAIM_PENDING_to_DATA_ACTIVE
          - calculations.sg_downstream_capacity
          - state_machines.ServiceGroup.CRITICAL_to_ELEVATED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger than cutover: completing the
          reclaim action flips RECLAIM_PENDING blocks to DATA_ACTIVE, which recomputes
          ServiceGroup.downstream_capacity_mbps 380->570, which de-escalates posture
          CRITICAL->ELEVATED — block mutation caused by completion, capacity mutation
          caused by block mutation, posture mutation caused by capacity mutation.
        test_recipe:
          setup:
            - "Node NE-R2: spectrum 96 = VIDEO 24 + VIDEO 24 + DATA 48 (capacity 304); SG-R2 load 350 (one sample) -> 115.1% CRITICAL"
            - "SPECTRUM_RECLAIM action targeting the first VIDEO 24 block only (one VIDEO_ACTIVE remains), IN_PROGRESS, one wave executed"
