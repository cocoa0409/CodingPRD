            - "Replaying the identical CUE trigger then returns HTTP 201 and PlaylistItem.${it2_id}.playout_status == CUED"

      - name: full_power_restore_refused_while_an_escalated_rf_fault_is_open
        grounds:
          - state_machines.Transmitter.REDUCED_POWER_to_FULL_POWER
          - state_machines.TechnicalFault.ACKNOWLEDGED_to_ESCALATED
          - validations[priority=45]
          - errors[ERR_RF_FAULT_BLOCKS_RESTORE]
          - entities.TechnicalFault.fields.severity
          - calculations.multiplex_bitrate_allocation
        distinguishing_aspect: |
          Entity pair (Transmitter, TechnicalFault): the transmitter's own power
          axis REDUCED_POWER -> FULL_POWER is gated by the lifecycle state of a
          child TechnicalFault row, and specifically only by the CRITICAL severity
          that the fault acquires when it is escalated 120 s after detection — the
          same restore attempt is legal while the fault is merely MAJOR/ACKNOWLEDGED
          and legal again once the fault reaches RESOLVED, so the refusal is
          produced by a severity value that lives on the other entity and is itself
          derived from elapsed logical time rather than from any operator input.
        test_recipe:
          setup:
            - "Transmitter FAC-1, authorized_erp_kw 50, FULL_POWER. MUX-A total_capacity_kbps 20000, pilot_reserved_kbps 500, so at derate 1.00 effective == floor(20000*1.00) - 500 == 19500."
            - "The clock is set to 2026-08-01T12:00:00Z and the transmitter is taken to REDUCED_POWER at current_power_pct 90 (90 >= POWER_REDUCTION_THRESHOLD_PCT 80, so no regulatory notification is required); 90 >= 50 gives derate 0.75 and effective == floor(20000*0.75) - 500 == 15000 - 500 == 14500."
            - "An RF_POWER_FAULT is opened against the transmitter at detected_utc 12:00:00Z with severity MAJOR, then acknowledged at 12:00:30Z."
            - "The clock is advanced to 2026-08-01T12:02:00Z, so fault duration == 120 s == the 120 s escalation threshold, and the fault is escalated: state ESCALATED, severity one step up from MAJOR, i.e. CRITICAL."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /transmitters"
              payload: { facility_id: "FAC-1", call_sign: "WXYZ", authorized_erp_kw: 50 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx_id}", name: "MUX-A", total_capacity_kbps: 20000, pilot_reserved_kbps: 500, live_encoder_units_total: 2 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "GET /transmitters/${tx_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_v1: "$.data.version" }
            - call: "POST /transmitters/${tx_id}/power-state"
              payload: { target_state: "REDUCED_POWER", power_pct: 90, reason: "antenna maintenance" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_v2: "$.data.version" }
            - call: "POST /technical-faults"
              payload: { transmitter_id: "${tx_id}", fault_code: "RF_POWER_FAULT", severity: "MAJOR", detected_utc: "2026-08-01T12:00:00Z", notes: "forward power sag on the main line" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { fault_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:30Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /technical-faults/${fault_id}/state"
              payload: { target_state: "ACKNOWLEDGED", notes: "engineer on the line with the site" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:02:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /technical-faults/${fault_id}/state"
              payload: { target_state: "ESCALATED", notes: "no recovery after acknowledgement" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
          trigger:
            - call: "POST /transmitters/${tx_id}/power-state"
              payload: { target_state: "FULL_POWER", reason: "maintenance complete" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
          assert:
            - "HTTP 409 with error_id == ERR_RF_FAULT_BLOCKS_RESTORE"
            - "TechnicalFault.${fault_id}.state == ESCALATED"
            - "TechnicalFault.${fault_id}.severity == CRITICAL"
            - "Transmitter.${tx_id}.operational_state == REDUCED_POWER"
            - "Transmitter.${tx_id}.current_power_pct == 90"
            - "Transmitter.${tx_id}.version == ${tx_v2} (the refused call performed no write)"
            - "The REDUCED_POWER write published derate_factor 0.75 on the transmitter, so GET /multiplexes/${mux_id} returns effective_capacity_kbps == floor(20000*0.75) - 500 == 14500"
            - "After POST /technical-faults/${fault_id}/state with { target_state: MITIGATED, mitigation_code: SWITCH_TO_BACKUP } and then { target_state: RESOLVED, cleared_utc: 2026-08-01T12:03:00Z }, TechnicalFault.${fault_id}.state == RESOLVED"
            - "Replaying the byte-identical FULL_POWER trigger then returns HTTP 200, Transmitter.${tx_id}.operational_state == FULL_POWER and Transmitter.${tx_id}.current_power_pct == 100 (set by the transition, not supplied by the caller)"
            - "Transmitter.${tx_id}.derate_factor == 1.00 and GET /multiplexes/${mux_id} then returns effective_capacity_kbps == floor(20000*1.00) - 500 == 19500"

  # ===========================================================================
  # RULE 8 — Resource / temporal overlap
  # Three DIFFERENT interval semantics on three DIFFERENT resource entities:
  #   (a) NetworkFeedWindow per Channel  -> guard-expanded CLOSED interval,
  #       touching guarded endpoints COLLIDE;
  #   (b) PlaylistItem timeline per Playlist -> HALF-OPEN [start, end),
  #       touching endpoints are MANDATORY, one second of back-lap collides;
  #   (c) EmergencyOverride per Channel -> OPEN-ENDED interval with no end
  #       instant at all, so the resource is held until an explicit release.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: guarded_feed_windows_collide_when_their_guard_bands_merely_touch
        grounds:
          - validations[priority=37]
          - errors[ERR_FEED_WINDOW_OVERLAP]
          - entities.NetworkFeedWindow.fields.guard_seconds
          - entities.NetworkFeedWindow.fields.join_utc
          - entities.NetworkFeedWindow.fields.breakaway_utc
        distinguishing_aspect: |
          Resource == the Channel's network feed path, and its occupancy interval
          is the CLOSED interval [join_utc - guard_seconds, breakaway_utc +
          guard_seconds]: a second window whose guarded start instant is exactly
          equal to the first window's guarded end instant (12:10:02Z touching
          12:10:02Z) must be rejected, and moving it one single second later
          (guarded start 12:10:03Z) must be accepted — so the collision is decided
          by guard-expanded endpoints that are themselves invisible in the
          submitted join_utc/breakaway_utc values, and by closed rather than
          half-open comparison at those endpoints.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER, MUX-A (total 20000, pilot 500, live_encoder_units_total 2), ACTIVE channel 12.1 (SD_480I, floor 2000, requested 6000, priority_rank 1)."
            - "Playlist for 2026-08-01, schedule_start_utc 12:00:00Z, window 1800 s, three adjacent 600 s PROGRAM items at 12:00:00Z, 12:10:00Z and 12:20:00Z; status ARMED."
            - "Feed window W1 on channel 12.1: join_utc 12:00:00Z, breakaway_utc 12:10:00Z, guard_seconds 2, live_encoder_units 1. Its guarded occupancy is [11:59:58Z, 12:10:02Z]."
            - "The logical clock stands at 2026-08-01T11:00:00Z, before every window, so no window has joined yet."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Mac Control", role_class: "MASTER_CONTROL", override_authority: "CRAWL_AND_CUTIN", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { mco_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Quinn QC", role_class: "QC", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { qc_id: "$.data.id" }
            - call: "POST /transmitters"
              payload: { facility_id: "FAC-1", call_sign: "WXYZ", authorized_erp_kw: 50 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx_id}", name: "MUX-A", total_capacity_kbps: 20000, pilot_reserved_kbps: 500, live_encoder_units_total: 2 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_id: "$.data.id", mux_v1: "$.data.version" }
            - call: "POST /channels"
