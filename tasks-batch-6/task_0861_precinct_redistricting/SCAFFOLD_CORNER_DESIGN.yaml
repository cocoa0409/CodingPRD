          trigger:
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkB}", expected_plan_version: "${pv0}" }
              as: Cartographer
          assert: ["response error_id == ERR_STALE_PLAN_VERSION"]

      - name: plan_fork_deep_copies_districts_and_assignments
        claim_type: derived_field_reconciliation
        grounds:
          - 'entities.RedistrictingPlan.fields.parent_plan_id'
          - 'endpoints."POST /jurisdictions/{jurisdictionId}/plans"'
        distinguishing_aspect: "Forking P2 from P1 (parent_plan_id=P1) copies P1's two districts and both ACTIVE assignments, so P2's max_abs_deviation_pct equals P1's 4.90 immediately."
        test_recipe:
          setup: ["F1 plan P1 fully assigned (+4.90/-4.90)"]
          setup_api_calls:
