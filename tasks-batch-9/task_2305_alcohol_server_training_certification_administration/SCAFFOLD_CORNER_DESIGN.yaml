            - "GET /employer-locations/${loc1} as ProgramAdmin returns 200 (the restriction is ownership-scoped, not global)"

  # =========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: occ_enrollment_create_rejects_the_session_version_the_client_last_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.enrollment-create-stale-session
          - endpoints.POST_/enrollments
          - errors.ERR_STALE_SESSION_VERSION
        distinguishing_aspect: |
          Ari's enrollment bumps ClassSession.version, so Bo's request carrying the version
          captured at session creation returns ERR_STALE_SESSION_VERSION (412) even though a
          seat is free; re-reading the roster and retrying succeeds, and the version has
          advanced exactly once per accepted write.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction, an APPROVED ON_PREMISE course, a CERTIFIED trainer, and a capacity-20 SCHEDULED session."
            - "Ari has already claimed a seat using the version captured at session creation."
