scaffold_corner_design:

  # -----------------------------------------------------------------
  # Entities — creation, required fields, not-found, computed fields
  # -----------------------------------------------------------------
  - section: entities
    instances:
      - name: create_family_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Family.fields.account_email
          - entities.Family.fields.child_count
        distinguishing_aspect: "POST /enrichment/families with account_email + primary_contact_name returns 201; child_count 0 and version 1 are system-set."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /enrichment/families"
              payload: { account_email: "new@x.com", primary_contact_name: "New" }
              as: StudioAdmin
              captures: { fam_id: $.data.id, cc: $.data.child_count, v: $.data.version }
          assert:
            - "http_status == 201"
            - "Family.${fam_id}.child_count == 0"
            - "Family.${fam_id}.version == 1"

      - name: create_child_missing_birth_date_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Child.fields.birth_date
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /enrichment/children without birth_date (a source:input field with no default) returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A family exists."]
          setup_api_calls:
            - call: "POST /enrichment/families"
              payload: { account_email: "c@x.com", primary_contact_name: "C" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "NoDob" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: get_nonexistent_membership_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Membership
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /enrichment/memberships/{id} with an unknown UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /enrichment/memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: family_child_count_recomputed_on_child_add
        claim_type: Computed Fields
        grounds:
          - entities.Family.fields.child_count
          - entities.Child.fields.status
        distinguishing_aspect: "Family.child_count is computed: after adding two ENROLLED_ELIGIBLE children it reads 2, ignoring any client-supplied value."
        test_recipe:
          setup: ["A family with two children added."]
          setup_api_calls:
            - call: "POST /enrichment/families"
              payload: { account_email: "cc@x.com", primary_contact_name: "CC" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "A", birth_date: "2024-01-01" }
              as: StudioAdmin
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "B", birth_date: "2024-02-01" }
              as: StudioAdmin
          trigger:
            - call: "GET /enrichment/families/${fam_id}"
              payload: {}
              as: StudioAdmin
              captures: { cc: $.data.child_count }
          assert:
            - "Family.${fam_id}.child_count == 2"

      - name: program_age_band_max_le_min_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Program.fields.max_age_months
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /enrichment/programs with max_age_months <= min_age_months violates the band constraint and returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /enrichment/programs"
              payload: { name: "Bad", level_index: 0, min_age_months: 24, max_age_months: 24, tuition_cents: 2500 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: session_capacity_exceeds_room_physical_capacity_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ClassSession.fields.capacity
          - entities.Room.fields.physical_capacity
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /enrichment/sessions with capacity > Room.physical_capacity returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A program, a room with physical_capacity 4, and a certified instructor."]
          setup_api_calls:
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Small", physical_capacity: 4 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 10 }
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: immutable_makeup_credit_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.MakeupCredit
        distinguishing_aspect: "MakeupCredit is common_fields:false — it carries id + created_at only, no version field, and no direct update endpoint exists."
        test_recipe:
          setup: ["A membership holds one credit from a cancelled session."]
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "im@x.com", primary_contact_name: "Im" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Kid", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "CORE", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v0}" }
              as: FrontDeskStaff
            - call: "POST /enrichment/sessions/${sess_id}/cancel"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "GET /enrichment/memberships/${mem_id}/makeup-credits"
              payload: {}
              as: FrontDeskStaff
              captures: { cstat: "$.data[0].status" }
          assert:
            - "MakeupCredit list length == 1"
            - "MakeupCredit[0].status == AVAILABLE"

  # -----------------------------------------------------------------
  # State Machines — invalid transitions, terminal lockdown, initial
  # -----------------------------------------------------------------
  - section: state_machines
    instances:
      - name: pay_already_paid_invoice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Invoice.OPEN_to_PAID
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Paying an invoice already in PAID state returns ERR_INVALID_STATE 409 (OPEN_to_PAID is the only pay transition)."
        test_recipe:
          setup: ["An ACTIVE membership with one enrolled child; renew emits an OPEN invoice that is then paid."]
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "pa@x.com", primary_contact_name: "Pa" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Kid", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "CORE", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v0}" }
              as: FrontDeskStaff
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/memberships/${mem_id}/renew"
              payload: {}
              as: FrontDeskStaff
              captures: { inv_id: $.data.id }
            - call: "POST /enrichment/invoices/${inv_id}/pay"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /enrichment/invoices/${inv_id}/pay"
              payload: {}
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: hold_already_cancelled_session_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_HELD
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Holding a session already in terminal CANCELLED returns ERR_INVALID_STATE 409 — no transitions leave CANCELLED."
        test_recipe:
          setup: ["A CANCELLED level-0 session."]
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id }
            - call: "POST /enrichment/sessions/${sess_id}/cancel"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:30:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /enrichment/sessions/${sess_id}/hold"
              payload: { attendance: [] }
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: hold_before_start_time_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_HELD
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Holding a SCHEDULED session before logical clock reaches start_at violates the 'clock >= start_at' precondition and returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A SCHEDULED level-0 session starting 2026-05-10T09:00; clock left at 2026-05-01."]
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /enrichment/sessions/${sess_id}/hold"
              payload: { attendance: [] }
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: child_withdraw_sets_withdrawn_and_cancels_enrollment
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Child.ENROLLED_ELIGIBLE_to_WITHDRAWN
          - entities.Child.fields.status
          - entities.Enrollment.fields.status
        distinguishing_aspect: "POST /enrichment/children/{id}/withdraw sets status WITHDRAWN, cancels the child's ENROLLED enrollment, and decrements the session enrolled_count from 1 to 0."
        test_recipe:
          setup: ["One ENROLLED child on a capacity-5 level-0 session."]
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "wd@x.com", primary_contact_name: "Wd" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Kid", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "CORE", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v0}" }
              as: FrontDeskStaff
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrichment/children/${kid_id}/withdraw"
              payload: {}
              as: FrontDeskStaff
              captures: { st: $.data.status }
          assert:
            - "Child.${kid_id}.status == WITHDRAWN"
            - "Enrollment.${enr_id}.status == CANCELLED"
            - "ClassSession.${sess_id}.enrolled_count == 0"

      - name: error_session_cancel_excused_credit_cascade
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / session_cancel_excused_credit_balance_cascade_depth3
          rationale: "The cancel-branch EXCUSED+credit cascade and divergent side-effect set are asserted by the named §1.8 instance."

      - name: error_membership_freeze_reactivate_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.Membership.FROZEN_to_ACTIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / membership_active_freeze_reactivate_cycle
          rationale: "The ACTIVE<->FROZEN cycle and credit preservation are asserted by the named §1.8 instance."

  # -----------------------------------------------------------------
  # Calculations — constants, precision, variant selection
  # -----------------------------------------------------------------
  - section: calculations
    instances:
      - name: single_child_membership_no_sibling_discount
        claim_type: Correct Result
        grounds:
          - calculations.sibling_discount
          - calculations.membership_cycle_invoice
          - entities.Invoice.fields.sibling_discount_cents
        distinguishing_aspect: "n==1 selects rate 0.00: a CORE membership with one 4000-cent child line yields subtotal 7000, sibling_discount 0, total 7000."
        test_recipe:
          setup: ["CORE membership, one child ENROLLED RECURRING on a 4000-cent level-0 session."]
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 4000, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "s1@x.com", primary_contact_name: "S" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Only", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "CORE", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v0}" }
              as: FrontDeskStaff
          trigger:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/memberships/${mem_id}/renew"
              payload: {}
              as: FrontDeskStaff
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 7000"
            - "Invoice.${inv_id}.sibling_discount_cents == 0"
            - "Invoice.${inv_id}.total_cents == 7000"

      - name: trial_enrollment_never_grants_makeup_credit_on_cancel
        claim_type: Input Set Filtering
        grounds:
          - calculations.makeup_credit_valuation
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
          - entities.Enrollment.fields.kind
        distinguishing_aspect: "Cancelling a session whose only enrollment is a TRIAL mints zero credits: makeup_credit_balance stays 0 because TRIAL is excluded from the EXCUSED/credit cascade."
        test_recipe:
          setup: ["A level-0 session with one TRIAL enrollment; capacity 5 so trial is accepted."]
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
