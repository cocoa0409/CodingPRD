# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2598 — Therapeutic Recreation Activity Program
#
# Nine rule_ids x 2 differentiated instances = 18 instances. Every instance grounds only in
# elements declared in SCAFFOLD.yaml §1.1–§1.7. Every numeric assert literal below was computed
# by executing the relevant §1.3 formula against the pinned setup values.
#
# Clock convention: the logical clock starts at 2026-08-01T00:00:00Z (§1.5
# POST /recreation/_clock/set_current_utc) and is only ever moved forward, because
# validations priority 23 forbids rewinding it.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: plan_attainment_credited_vs_offered_diverge
        grounds:
          - calculations.plan_attainment
          - entities.ActivityPlan.fields.credited_attainment_pct
          - entities.ActivityPlan.fields.offered_attainment_pct
          - entities.ParticipationRecord.fields.outcome
          - state_machines.ParticipationRecord.PLANNED_to_REFUSED
        distinguishing_aspect: |
          This dual-variant lives in the ActivityPlan / ParticipationRecord domain: a single
          documented REFUSED record drives offered_attainment_pct to 100.0 while
          credited_attainment_pct stays 0.0, because the regulatory variant counts the offer and
          the clinical variant counts only engaged attendance.
        test_recipe:
          setup:
            - "one ADMITTED resident, assessed MILD_IMPAIRMENT + ASSIST_1 so supervision_tier == TIER_1"
            - "one ACTIVE ActivityPlan whose 28-day cycle opens 2026-08-01T00:00:00Z with domain_frequency_targets SOCIAL 1 and every other domain 0"
            - "one SOCIAL program session on 2026-08-03 with the resident enrolled, session IN_PROGRESS, logical clock at 2026-08-03T14:00:00Z"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Rose Alvarez", room_number: "201A", admission_date: "2026-01-15" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MILD_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["SOCIAL"], preferred_group_size: "SMALL", effective_date: "2026-07-20" }
              as: RecreationTherapist
              captures: { asmt_id: $.data.id }
            - call: "GET /recreation/residents/${res_id}"
              as: RecreationTherapist
              captures: { res_ver: $.data.version }
            - call: "POST /recreation/activity-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", cycle_start_at: "2026-08-01T00:00:00Z", domain_frequency_targets: { SOCIAL: 1, COGNITIVE: 0, PHYSICAL: 0, SPIRITUAL: 0, CREATIVE: 0 }, expected_resident_version: "${res_ver}" }
              as: RecreationTherapist
              captures: { plan_id: $.data.id }
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "ACTIVATE" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Coffee Social", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Great Room", capacity: 20, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-03T14:00:00Z", ends_at: "2026-08-03T15:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { rec_id: $.data.id }
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T14:00:00Z" }
              as: ActivityDirector
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "START" }
              as: ActivityAide
          trigger:
            - call: "PATCH /recreation/participation/${rec_id}"
              payload: { outcome: "REFUSED", refusal_reason: "FATIGUE" }
              as: ActivityAide
          assert:
            - "ParticipationRecord.${rec_id}.outcome == REFUSED"
            - "ActivityPlan.${plan_id}.offered_attainment_pct == 100.0"
            - "ActivityPlan.${plan_id}.credited_attainment_pct == 0.0"
            - "ActivityPlan.${plan_id}.status == ACTIVE"
            - "Resident.${res_id}.refusal_streak == 1"
            - "Resident.${res_id}.engagement_index == 0.0"
      - name: volunteer_scheduled_vs_credited_hours_diverge
        grounds:
          - calculations.volunteer_hours
          - entities.Volunteer.fields.scheduled_hours_week
          - entities.Volunteer.fields.credited_service_hours
          - state_machines.VolunteerAssignment.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          This dual-variant lives in the Volunteer domain, not the plan domain: the same single
          2.00-hour assignment reads scheduled_hours_week 2.0 / credited_service_hours 0.0 while
          CONFIRMED and flips to scheduled_hours_week 0.0 / credited_service_hours 2.0 the instant
          the session is documented, because the forward-looking variant drops COMPLETED rows and
          the earned-service variant counts only COMPLETED rows on DOCUMENTED sessions.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T10:00:00Z, inside the ISO week Monday 2026-08-03 .. Sunday 2026-08-09"
            - "one CLEARED volunteer with screening_level FULL, holding one CONFIRMED assignment on a 2-hour session that starts 2026-08-05T10:00:00Z"
            - "the session is IN_PROGRESS with its single enrolled resident already documented ATTENDED, so CLOSE_DOCUMENTATION will be admitted"
            - "immediately before the trigger, Volunteer.scheduled_hours_week == 2.0 and Volunteer.credited_service_hours == 0.0"
          setup_api_calls:
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: ActivityDirector
            - call: "POST /recreation/residents"
              payload: { full_name: "Ana Reyes", room_number: "118B", admission_date: "2026-02-02" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["CREATIVE"], preferred_group_size: "SMALL", effective_date: "2026-07-20" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Watercolor Studio", domain: "CREATIVE", staffing_ratio_denominator: 4, max_group_size: 8, max_supervision_tier: "TIER_2", volunteer_eligible: true, required_screening_level: "FULL" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Art Room", capacity: 8, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-05T10:00:00Z", ends_at: "2026-08-05T12:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { rec_id: $.data.id }
            - call: "POST /recreation/volunteers"
              payload: { full_name: "Dana Kim", volunteer_type: "ADULT_COMMUNITY" }
              as: VolunteerCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /recreation/volunteers/${vol_id}/screening"
              payload: { event_type: "BACKGROUND_CHECK_CLEARED", cleared_on: "2026-07-01" }
              as: VolunteerCoordinator
            - call: "POST /recreation/volunteers/${vol_id}/screening"
              payload: { event_type: "ORIENTATION_COMPLETED", completed_on: "2026-07-05" }
              as: VolunteerCoordinator
            - call: "POST /recreation/volunteer-assignments"
              payload: { volunteer_id: "${vol_id}", session_id: "${sess_id}", role_type: "GROUP_ASSISTANT" }
              as: VolunteerCoordinator
              captures: { asg_id: $.data.id }
            - call: "PATCH /recreation/volunteer-assignments/${asg_id}"
              payload: { status: "CONFIRMED" }
              as: VolunteerCoordinator
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:00:00Z" }
              as: ActivityDirector
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "START" }
              as: ActivityAide
            - call: "PATCH /recreation/participation/${rec_id}"
              payload: { outcome: "ATTENDED", engagement_level: "ACTIVE" }
              as: ActivityAide
          trigger:
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "CLOSE_DOCUMENTATION" }
              as: ActivityAide
          assert:
            - "ActivitySession.${sess_id}.status == DOCUMENTED"
            - "VolunteerAssignment.${asg_id}.status == COMPLETED"
            - "VolunteerAssignment.${asg_id}.hours == 2.0"
            - "Volunteer.${vol_id}.scheduled_hours_week == 0.0"
            - "Volunteer.${vol_id}.credited_service_hours == 2.0"
  - rule_id: combinatorial_formula
    instances:
      - name: session_staffing_sum_then_ceil_pinned
        mode: b
        grounds:
          - calculations.session_staffing_requirement
          - entities.ActivitySession.fields.weighted_supervision_load
          - entities.ActivitySession.fields.required_staff_count
          - validations.priority_50_ERR_STAFFING_RATIO_EXCEEDED
        distinguishing_aspect: |
          Mode (b) — order-of-operations pinning. The rounding boundary is pinned at exactly one
          place: each enrolled resident's TIER_WEIGHT is divided by the program's
          staffing_ratio_denominator, the quotients are summed at full precision, and a single
          ceil is taken at the very end. Rounding per tier first and then summing yields 3
          instead of 2, which would wrongly reject the fourth enrollment.
        test_recipe:
          setup:
            - "one PHYSICAL program with staffing_ratio_denominator 4, max_group_size 10, max_supervision_tier TIER_3"
            - "one session with assigned_staff_count 2 in a room of capacity 10 and buffer_minutes 0"
            - "four assessed residents whose derived supervision_tier values are TIER_1, TIER_1, TIER_2, TIER_3"
            - "the first three residents are already enrolled; the fourth enrollment is the trigger"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Chair Exercise", domain: "PHYSICAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Activity Hall", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-06T10:00:00Z", ends_at: "2026-08-06T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/residents"
              payload: { full_name: "Tier One A", room_number: "301A", admission_date: "2026-03-01" }
              as: ActivityDirector
              captures: { r1_id: $.data.id }
            - call: "POST /recreation/residents/${r1_id}/assessments"
              payload: { cognitive_level: "MILD_IMPAIRMENT", functional_mobility: "INDEPENDENT", interest_domains: ["PHYSICAL"], preferred_group_size: "LARGE", effective_date: "2026-07-20" }
              as: RecreationTherapist
            - call: "POST /recreation/residents"
              payload: { full_name: "Tier One B", room_number: "301B", admission_date: "2026-03-02" }
              as: ActivityDirector
              captures: { r2_id: $.data.id }
            - call: "POST /recreation/residents/${r2_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "ASSIST_1", interest_domains: ["PHYSICAL"], preferred_group_size: "LARGE", effective_date: "2026-07-20" }
              as: RecreationTherapist
            - call: "POST /recreation/residents"
              payload: { full_name: "Tier Two C", room_number: "302A", admission_date: "2026-03-03" }
              as: ActivityDirector
              captures: { r3_id: $.data.id }
            - call: "POST /recreation/residents/${r3_id}/assessments"
              payload: { cognitive_level: "MODERATE_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["PHYSICAL"], preferred_group_size: "LARGE", effective_date: "2026-07-20" }
              as: RecreationTherapist
            - call: "POST /recreation/residents"
              payload: { full_name: "Tier Three D", room_number: "302B", admission_date: "2026-03-04" }
              as: ActivityDirector
              captures: { r4_id: $.data.id }
            - call: "POST /recreation/residents/${r4_id}/assessments"
              payload: { cognitive_level: "SEVERE_IMPAIRMENT", functional_mobility: "ASSIST_2", interest_domains: ["PHYSICAL"], preferred_group_size: "LARGE", effective_date: "2026-07-20" }
              as: RecreationTherapist
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${r1_id}" }
              as: ActivityAide
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${r2_id}" }
              as: ActivityAide
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${r3_id}" }
              as: ActivityAide
          trigger:
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${r4_id}" }
              as: ActivityAide
              captures: { rec4_id: $.data.id }
          assert:
            - "the fourth enrollment returns 201 and creates ${rec4_id}, it is NOT rejected with ERR_STAFFING_RATIO_EXCEEDED"
            - "ActivitySession.${sess_id}.enrolled_count == 4"
            - "ActivitySession.${sess_id}.weighted_supervision_load == 6.5"
            - "ActivitySession.${sess_id}.required_staff_count == 2"
            - "required_staff_count != 3, the value the forbidden per-tier rounding order (ceil(1.0/4) + ceil(1.0/4) + ceil(1.5/4) + ceil(3.0/4) == 1 + 1 + 1 + 1, summed per resident, or ceil(2.0/4) + ceil(1.5/4) + ceil(3.0/4) == 1 + 1 + 1 grouped per tier) would produce"
      - name: survey_provision_score_pinned_five_step_order
        mode: c
        grounds:
          - calculations.survey_provision_score
          - entities.SurveyPacket.fields.provision_score
          - entities.SurveyPacket.fields.deficiency_flags
          - state_machines.SurveyPacket.OPEN_to_COMPILED
        distinguishing_aspect: |
          Mode (c) — multi-step pipeline with a pinned step order, a different mode from the
          companion instance and a different formula family (weighted scoring over a survey
          window rather than a staffing ratio). The five steps must run base_score →
          domain_coverage_penalty → refusal_penalty → deficiency_flags → provision_score, and the
          F248 flag must be evaluated against preliminary_score, not against base_score.
        test_recipe:
          setup:
            - "one ADMITTED resident with an ACTIVE-then-UNDER_REVISION plan whose 28-day cycle opens 2026-08-01T00:00:00Z and whose domain_frequency_targets are SOCIAL 2 and every other domain 0"
            - "exactly one delivered SOCIAL session inside the window, documented REFUSED, so offered_sessions_delivered is 1 against offered_sessions_targeted 2"
            - "the plan is moved UNDER_REVISION with review_reason THERAPIST_REQUEST before compilation, so the F249 unaddressed-refusal test can fire on the open refusal"
            - "the logical clock is advanced to 2026-08-05T12:00:00Z and one OPEN SurveyPacket is opened for window_start 2026-08-01 .. window_end 2026-08-05, so window_end <= the calendar date of current_utc and the packet is compilable"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Hal Whitcomb", room_number: "210A", admission_date: "2026-01-05" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MILD_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["SOCIAL"], preferred_group_size: "SMALL", effective_date: "2026-07-20" }
              as: RecreationTherapist
              captures: { asmt_id: $.data.id }
            - call: "GET /recreation/residents/${res_id}"
              as: RecreationTherapist
              captures: { res_ver: $.data.version }
            - call: "POST /recreation/activity-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", cycle_start_at: "2026-08-01T00:00:00Z", domain_frequency_targets: { SOCIAL: 2, COGNITIVE: 0, PHYSICAL: 0, SPIRITUAL: 0, CREATIVE: 0 }, expected_resident_version: "${res_ver}" }
              as: RecreationTherapist
              captures: { plan_id: $.data.id }
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "ACTIVATE" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Reminiscence Circle", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Parlor", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-04T14:00:00Z", ends_at: "2026-08-04T15:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { rec_id: $.data.id }
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T14:00:00Z" }
              as: ActivityDirector
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "START" }
              as: ActivityAide
            - call: "PATCH /recreation/participation/${rec_id}"
              payload: { outcome: "REFUSED", refusal_reason: "FATIGUE" }
              as: ActivityAide
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "REVISE", review_reason: "THERAPIST_REQUEST" }
              as: RecreationTherapist
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: ActivityDirector
            - call: "POST /recreation/survey-packets"
              payload: { window_start: "2026-08-01", window_end: "2026-08-05" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkt_id: $.data.id }
          trigger:
            - call: "POST /recreation/survey-packets/${pkt_id}/compile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
          assert:
            - "SurveyPacket.${pkt_id}.status == COMPILED"
            - "SurveyPacket.${pkt_id}.offered_sessions_targeted == 2"
            - "SurveyPacket.${pkt_id}.offered_sessions_delivered == 1"
            - "SurveyPacket.${pkt_id}.base_score == 50.0"
            - "SurveyPacket.${pkt_id}.domain_coverage_penalty == 0.0"
            - "SurveyPacket.${pkt_id}.refusal_penalty == 2.0"
            - "SurveyPacket.${pkt_id}.preliminary_score == 48.0"
            - "SurveyPacket.${pkt_id}.deficiency_flags == [\"F248_INSUFFICIENT_FREQUENCY\", \"F249_UNADDRESSED_REFUSAL\"]"
            - "SurveyPacket.${pkt_id}.provision_score == 42.0"
            - "provision_score != 45.0, the value produced by the forbidden order that tests F248 against base_score 50.0 before the penalties are subtracted and therefore raises only one flag"
  - rule_id: non_linear_state_machine
    instances:
      - name: activity_plan_revision_cycle_round_trip
        grounds:
          - state_machines.ActivityPlan
          - state_machines.ActivityPlan.ACTIVE_to_UNDER_REVISION
          - state_machines.ActivityPlan.UNDER_REVISION_to_ACTIVE
          - entities.ActivityPlan.fields.revision_count
          - entities.Resident.fields.enrollment_gate
        distinguishing_aspect: |
          Exercises the cyclic shape: ACTIVE -> UNDER_REVISION -> ACTIVE returns the plan to a
          state it has already occupied, and the round trip must leave revision_count permanently
          incremented while every gate field the outbound leg raised is lowered again. A linear
          implementation that treats UNDER_REVISION as terminal, or that resets revision_count on
          re-entry to ACTIVE, fails here.
        test_recipe:
          setup:
            - "one ADMITTED resident with a governing assessment"
            - "one ActivityPlan taken DRAFT -> ACTIVE -> UNDER_REVISION with review_reason THERAPIST_REQUEST"
            - "immediately before the trigger: ActivityPlan.revision_count == 1, Resident.enrollment_gate == THERAPIST_REVIEW, Resident.care_plan_review_due == true"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Iris Nakamura", room_number: "112A", admission_date: "2026-04-11" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MILD_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["SOCIAL", "CREATIVE"], preferred_group_size: "SMALL", effective_date: "2026-07-20" }
              as: RecreationTherapist
              captures: { asmt_id: $.data.id }
            - call: "GET /recreation/residents/${res_id}"
              as: RecreationTherapist
              captures: { res_ver: $.data.version }
            - call: "POST /recreation/activity-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", cycle_start_at: "2026-08-01T00:00:00Z", domain_frequency_targets: { SOCIAL: 2, COGNITIVE: 0, PHYSICAL: 0, SPIRITUAL: 0, CREATIVE: 1 }, expected_resident_version: "${res_ver}" }
              as: RecreationTherapist
              captures: { plan_id: $.data.id }
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "ACTIVATE" }
              as: RecreationTherapist
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "REVISE", review_reason: "THERAPIST_REQUEST" }
              as: RecreationTherapist
          trigger:
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "REACTIVATE" }
              as: RecreationTherapist
          assert:
            - "ActivityPlan.${plan_id}.status == ACTIVE"
            - "ActivityPlan.${plan_id}.revision_count == 1"
            - "ActivityPlan.${plan_id}.review_reason == NONE"
            - "Resident.${res_id}.enrollment_gate == NONE"
            - "Resident.${res_id}.care_plan_review_due == false"
      - name: outing_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Outing
          - state_machines.Outing.PLANNING_to_TRANSPORT_BOOKED
          - state_machines.OutingConsent.REQUESTED_to_GRANTED
          - entities.Outing.fields.consent_status
          - entities.Outing.fields.logistics_status
        distinguishing_aspect: |
          A different non-linear shape on a different entity: the Outing carries two independent
          state dimensions. A consent decision advances only consent_status
          (COLLECTING -> CONSENT_COMPLETE) and must leave logistics_status parked at
          TRANSPORT_BOOKED; an implementation that collapses the two dimensions into a single
          status column cannot hold both values at once.
        test_recipe:
          setup:
