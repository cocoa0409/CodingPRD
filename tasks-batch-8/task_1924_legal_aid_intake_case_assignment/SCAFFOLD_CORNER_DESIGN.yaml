        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]"]
        distinguishing_aspect: "An application create with BOTH an invalid case_type enum AND a nonexistent client_id returns ERR_INVALID_REQUEST (shape, priority 5), not ERR_NOT_FOUND (body-FK existence, priority 6)."
        test_recipe:
