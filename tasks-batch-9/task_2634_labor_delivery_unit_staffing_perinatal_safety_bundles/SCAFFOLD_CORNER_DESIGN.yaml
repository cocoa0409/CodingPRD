              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { day_staff_id: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${day_staff_id}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "${day_staff_id}"
              captures: { day_shift_id: $.data.id }
            - call: POST /shift-assignments/${day_shift_id}/cancel
              payload: {}
              as: ChargeNurse
              as_user_id: "${day_staff_id}"
              captures: { cancelled_status: $.data.status, cancelled_v: $.data.version }
          trigger:
            - call: POST /shift-assignments/${day_shift_id}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${day_staff_id}"
              captures: { err_activate: $.data.error_id }
            - call: POST /shift-assignments/${day_shift_id}/cancel
