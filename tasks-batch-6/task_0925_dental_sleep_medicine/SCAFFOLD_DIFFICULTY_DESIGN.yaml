# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Dental Sleep Medicine — 9 rules x 2 instances = 18 instances.
# Every ${var} is bound by a captures: block earlier in the same instance.
# Every numeric assertion below was executed against the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: hsat_recording_time_vs_psg_sleep_time_severity_index
        grounds:
          - calculations.severity_index
          - calculations.severity_band
          - entities.SleepStudy.fields.severity_index
          - state_machines.SleepStudy.ORDERED_to_DIAGNOSTIC_VALID
        distinguishing_aspect: |
          The dual variant lives on the SleepStudy domain: identical respiratory_events,
          recording_minutes and sleep_minutes produce 15.0 under the HSAT recording-time
          denominator and 30.0 under the PSG sleep-time denominator, which lands the same
          recording in MODERATE on one modality and SEVERE on the other.
        test_recipe:
          setup:
            - "One medical payer, one sleep physician, one patient."
            - "Two DIAGNOSTIC studies ordered on that patient, one HSAT and one PSG, both still ORDERED."
            - "Logical clock at 2026-05-01."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL", prior_auth_required: false }
              as: PlatformAdmin
              captures: { payer_med_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000001", full_name: "Dr Sleep", provider_type: "SLEEP_PHYSICIAN" }
              as: PlatformAdmin
              captures: { phys_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-001", full_name: "Pat One", date_of_birth: "1975-03-02", medical_payer_id: "${payer_med_id}", epworth_score: 14 }
              as: ClinicCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep-studies"
              payload: { patient_id: "${pat_id}", ordering_physician_id: "${phys_id}", modality: "HSAT", study_purpose: "DIAGNOSTIC" }
              as: SleepPhysician
              as_user_id: "${phys_id}"
              captures: { hsat_id: $.data.id }
            - call: "POST /sleep-studies"
              payload: { patient_id: "${pat_id}", ordering_physician_id: "${phys_id}", modality: "PSG", study_purpose: "DIAGNOSTIC" }
              as: SleepPhysician
              as_user_id: "${phys_id}"
              captures: { psg_id: $.data.id }
          trigger:
            - call: "POST /sleep-studies/${hsat_id}/results"
              payload: { performed_on: "2026-04-10", respiratory_events: 120, recording_minutes: 480, sleep_minutes: 240, artifact_pct: 0, attended: true }
              as: SleepPhysician
              as_user_id: "${phys_id}"
            - call: "POST /sleep-studies/${psg_id}/results"
              payload: { performed_on: "2026-04-10", respiratory_events: 120, recording_minutes: 480, sleep_minutes: 240, artifact_pct: 0, attended: true }
              as: SleepPhysician
              as_user_id: "${phys_id}"
          assert:
            - "SleepStudy.${hsat_id}.severity_index == 15.0"
            - "SleepStudy.${hsat_id}.severity_band == MODERATE"
            - "SleepStudy.${hsat_id}.status == DIAGNOSTIC_VALID"
            - "SleepStudy.${psg_id}.severity_index == 30.0"
            - "SleepStudy.${psg_id}.severity_band == SEVERE"
            - "SleepStudy.${psg_id}.status == DIAGNOSTIC_VALID"
            - "SleepStudy.${psg_id}.severity_index != SleepStudy.${hsat_id}.severity_index although every posted input was identical"

      - name: adherence_window_denominator_vs_recorded_denominator
        grounds:
          - calculations.adherence_rate
          - entities.AdherenceDownload.fields.rate_of_window
          - entities.AdherenceDownload.fields.rate_of_recorded
          - entities.AdherenceDownload.fields.compliant
        distinguishing_aspect: |
          The second dual variant sits on the AdherenceDownload domain, not on SleepStudy:
          one and the same download row yields 0.6667 on the payer's full-window denominator
          and 0.8333 on the clinic's recorded-nights denominator, and only the window figure
          decides compliant, which is therefore false on a download that reads as compliant.
        test_recipe:
          setup:
            - "A patient with a SEVERE HSAT diagnosis, an ACCEPTED referral, an accepted lab order and a fabricated appliance carrying a microrecorder."
            - "No adherence rows yet."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL", prior_auth_required: false }
              as: PlatformAdmin
              captures: { payer_med_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000001", full_name: "Dr Sleep", provider_type: "SLEEP_PHYSICIAN" }
              as: PlatformAdmin
              captures: { phys_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000002", full_name: "Dr Dent", provider_type: "DENTIST", dme_supplier_number: "DME-001" }
              as: PlatformAdmin
              captures: { dent_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000003", full_name: "ACME Lab", provider_type: "DENTAL_LAB" }
              as: PlatformAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-001", full_name: "Pat One", date_of_birth: "1975-03-02", medical_payer_id: "${payer_med_id}", epworth_score: 14 }
              as: ClinicCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep-studies"
              payload: { patient_id: "${pat_id}", ordering_physician_id: "${phys_id}", modality: "HSAT", study_purpose: "DIAGNOSTIC" }
              as: SleepPhysician
              as_user_id: "${phys_id}"
              captures: { study_id: $.data.id }
            - call: "POST /sleep-studies/${study_id}/results"
              payload: { performed_on: "2026-04-10", respiratory_events: 240, recording_minutes: 480, artifact_pct: 0 }
              as: SleepPhysician
              as_user_id: "${phys_id}"
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_physician_id: "${phys_id}", treating_dentist_id: "${dent_id}", diagnostic_study_id: "${study_id}", cpap_history: "FAILURE", cpap_nights_used: 45, cpap_documented_on: "2026-03-01" }
              as: SleepPhysician
              as_user_id: "${phys_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/respond"
              payload: { decision: "ACCEPTED" }
              as: Dentist
              as_user_id: "${dent_id}"
            - call: "POST /lab-orders"
              payload: { referral_id: "${ref_id}", lab_provider_id: "${lab_id}", appliance_kind: "CUSTOM_FABRICATED", capture_method: "DIGITAL_SCAN", max_protrusive_mm: 8.00, promised_turnaround_days: 14 }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { lo_id: $.data.id }
            - call: "POST /lab-orders/${lo_id}/submit"
              payload: { promised_turnaround_days: 14 }
              as: Dentist
              as_user_id: "${dent_id}"
            - call: "POST /lab-orders/${lo_id}/ship"
              payload: { shipped_on: "2026-05-15" }
              as: LabTechnician
              as_user_id: "${lab_id}"
            - call: "POST /lab-orders/${lo_id}/receive"
              payload: { fit_outcome: "ACCEPTED" }
              as: Dentist
              as_user_id: "${dent_id}"
            - call: "POST /appliance-lots"
              payload: { manufacturer: "SomnoCorp", lot_code: "LOT-A" }
              as: PlatformAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /appliances"
              payload: { lab_order_id: "${lo_id}", lot_id: "${lot_id}", serial_number: "SN-0001", has_microrecorder: true }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /adherence-downloads"
              payload: { appliance_id: "${app_id}", source: "OBJECTIVE_MICRORECORDER", window_start: "2026-07-08", window_end: "2026-08-06", nights_recorded: 24, nights_at_or_above_min_hours: 20, mean_hours_per_worn_night: 5.2 }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { dl_id: $.data.id }
          assert:
            - "AdherenceDownload.${dl_id}.rate_of_window == 0.6667"
            - "AdherenceDownload.${dl_id}.rate_of_recorded == 0.8333"
            - "AdherenceDownload.${dl_id}.compliant == false"
            - "AdherenceDownload.${dl_id}.rate_of_recorded > AdherenceDownload.${dl_id}.rate_of_window on one and the same row"

  - rule_id: combinatorial_formula
    instances:

      - name: titration_increment_nested_min_with_side_effect_branch
        grounds:
          - calculations.titration_applied_increment
          - calculations.cumulative_advancement
          - calculations.starting_advancement_mm
          - state_machines.TitrationVisit.SCHEDULED_to_APPLIED
        distinguishing_aspect: |
          Mode (a): three inputs interact non-linearly — the request is first capped by
          MAX_INCREMENT_PER_VISIT_MM, the capped value is then checked against the remaining
          protrusive range, and the whole result is switched by an entity-state input
          (side_effect_severity). A request of 2.00 mm therefore advances the device by exactly
          1.00 mm, neither by 2.00 nor by the 3.25 mm of range still available.
