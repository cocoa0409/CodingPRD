# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_3067_alternative_data_underwriting_model_bank_partner_loan
#
# Depth probe: 2 instances per §0.5 Difficulty Rule (9 rules = 18 instances).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 elements.
#
# Shared fixture conventions (inlined into each instance; no cross-instance refs):
#   - Logical clock default is 2026-09-01T00:00:00Z; instances that need a
#     different clock set it explicitly.
#   - Standard scoring model "ADU-BUREAU": variables [{bureau_score, w=1, min 300,
#     max 850}], floor 0, ceiling 1000 -> score = round_half_up(100*(b-300)/550).
#   - Standard applicant "clean": income 12000000, debt 200000, BACHELOR, EMPLOYED,
#     months_employed 12, avg_balance 500000, nsf 0, net_cashflow 100000,
#     bureau 575 -> score exactly 50; DTI 20.0; standard approved min(req, 6000000).
#   - Standard credit box: min 0, max 1000, states [TX], loans 100000..10000000,
#     cap 2/mo, APR 12.0, window 2026-01-01..2027-12-31.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_cashflow_stress_multiplier_changes_score
        grounds:
          - calculations.risk_score
        distinguishing_aspect: |
          Entity domain: Applicant/Application scoring. Two models with the SAME
          bureau variable, one carrying a bank_account_* cash-flow variable and one
          not, score the identical applicant differently: the cash-flow model applies
          the 0.9 stress multiplier to the cash-flow contribution (95) while the
          bureau-only model has nothing to stress and its single-variable score (50)
          differs from the stressed model's combined-and-stressed score (95 vs the
          unstressed 100 the same data would produce without the multiplier).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Model M1 ACTIVE with variables [{bureau_score,w1,300,850},{bank_account_avg_balance_cents,w1,0,1000000}] (cash-flow model)."
            - "One applicant: bureau 575, avg_balance 500000, clean cash-flow flags (nsf 0, months_employed 12)."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-CF-1", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }, { name: "bank_account_avg_balance_cents", weight: 1, min: 0, max: 1000000 }], calibration_note: "cf model", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m1_id: $.data.id }
            - call: "POST /platform/model-versions/${m1_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m1_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr1_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr1_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m1_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/applicants"
              payload: { full_name: "Casey Stress", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap1_id: $.data.id }
          trigger:
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap1_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app1_id: $.data.id, app1_score: $.data.risk_score }
          assert:
            - "Application.${app1_id}.risk_score == 95 — bureau contributes 50, cash-flow contributes 100*(500000/1000000)*0.9 == 45, total 95"
            - "risk_score != 100 — the unstressed value the identical data would produce without the 0.9 cash-flow multiplier"
            - "Application.${app1_id}.model_version_id == ${m1_id}"

      - name: approved_amount_manual_review_haircut_shrinks_principal
        grounds:
          - calculations.approved_amount
        distinguishing_aspect: |
          Entity domain: Application underwriting amount (NOT scoring). Two
          applicants with byte-identical financials request 5000000; the one whose
          verifications all passed instantly is approved 5000000 (capacity ratio
          0.40 -> supportable 6000000), while the one routed through the manual
          document-review fallback is approved 3600000 (capacity ratio 0.32 ->
          supportable 3600000) — same formula, different variant, different cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Model ACTIVE with bureau-only variables (score for bureau 575 == 50, passes boxes)."
            - "Applicant A (instant path): clean flags. Applicant B (manual path): bank_account_nsf_count_90d == 3 so the INCOME instant check fails; both applicants otherwise identical (income 12000000, debt 200000, bureau 575)."
            - "One ACTIVE bank partner with an ACTIVE credit box covering TX, score range [0,1000], amount range [100000, 10000000]."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-B-1", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "bureau only", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m1_id: $.data.id }
            - call: "POST /platform/model-versions/${m1_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m1_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr1_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr1_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m1_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/partners"
              payload: { legal_name: "First Test Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { bank_id: $.data.id, bank_v0: $.data.version }
            - call: "POST /platform/partners/${bank_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${bank_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { box1_id: $.data.id }
            - call: "POST /platform/partners/${bank_id}/credit-boxes/${box1_id}/activate"
              payload: { expected_partner_version: "${bank_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/applicants"
              payload: { full_name: "Instant Ivy", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_instant_id: $.data.id }
            - call: "POST /platform/applicants"
              payload: { full_name: "Manual Manny", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 3, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_manual_id: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_instant_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_instant_id: $.data.id }
            - call: "GET /platform/applications/${app_instant_id}/verifications"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { vi_inc: "$.data[0].id", vi_idn: "$.data[1].id" }
            - call: "POST /platform/applications/${app_instant_id}/verifications/${vi_inc}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_instant_id}/verifications/${vi_idn}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_manual_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_manual_id: $.data.id }
            - call: "GET /platform/applications/${app_manual_id}/verifications"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { vm_inc: "$.data[0].id", vm_idn: "$.data[1].id" }
            - call: "POST /platform/applications/${app_manual_id}/verifications/${vm_inc}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_manual_id}/verifications/${vm_idn}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_manual_id}/verifications/${vm_inc}/manual-decision"
              payload: { outcome: "PASS" }
              as: VerificationOfficer
              as_user_id: "vo-two"
          trigger:
            - call: "GET /platform/applications/${app_instant_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { amt_instant: $.data.approved_amount_cents }
            - call: "GET /platform/applications/${app_manual_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { amt_manual: $.data.approved_amount_cents }
          assert:
            - "Application.${app_instant_id}.status == UNDERWRITTEN and approved_amount_cents == 5000000 (capacity 0.40: supportable 6000000 >= request 5000000)"
            - "Application.${app_manual_id}.status == UNDERWRITTEN and approved_amount_cents == 3600000 (capacity 0.32: floor(1000000*0.32)-200000 == 120000; 120000*30 == 3600000)"
            - "Application.${app_instant_id}.approved_amount_cents != Application.${app_manual_id}.approved_amount_cents despite identical financial inputs"
            - "Verification.${vm_inc}.status == MANUAL_PASSED and reviewer_id == \"vo-two\""

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: allocation_selector_multi_input_first_failure_reason_order
        grounds:
          - calculations.allocation_selector
        distinguishing_aspect: |
          Mode (a): a >= 3-input selection with conditional branches on entity state.
          The referral partner fails for exactly one reason at a time as inputs vary
          — with a TX-only box and an applicant in CA the channel records
          STATE_NOT_ALLOWED and skips the later score/amount/cap checks; the same
          partner with the applicant in TX but a capped-out month records
          VOLUME_CAP_REACHED — and both times the waterfall CONTINUES and lands on a
          whole-loan buyer, proving eligibility is computed per candidate, not globally.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Model ACTIVE (bureau-only; bureau 575 -> score 50)."
            - "Referral bank R: ACTIVE, box allowed_states [TX], score [0,1000], amounts [100000,10000000], cap 1."
            - "Whole-loan buyer W: ACTIVE, box allowed_states [TX, CA], score [0,1000], amounts [100000,10000000], cap 10."
            - "Applicant in CA with clean flags; application channel PARTNER_REFERRAL under R, request 5000000."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-B-2", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "bureau only", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m1_id: $.data.id }
            - call: "POST /platform/model-versions/${m1_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m1_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr1_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr1_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m1_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/partners"
              payload: { legal_name: "Referral Bank R", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { bank_r_id: $.data.id, bank_r_v0: $.data.version }
            - call: "POST /platform/partners/${bank_r_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${bank_r_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 1, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { box_r_id: $.data.id }
            - call: "POST /platform/partners/${bank_r_id}/credit-boxes/${box_r_id}/activate"
              payload: { expected_partner_version: "${bank_r_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners"
              payload: { legal_name: "Whole Buyer W", partner_type: "LOAN_BUYER", home_state: "DE" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { buyer_w_id: $.data.id, buyer_w_v0: $.data.version }
            - call: "POST /platform/partners/${buyer_w_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${buyer_w_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX", "CA"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { box_w_id: $.data.id }
            - call: "POST /platform/partners/${buyer_w_id}/credit-boxes/${box_w_id}/activate"
              payload: { expected_partner_version: "${buyer_w_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/applicants"
              payload: { full_name: "Cali Carol", state_code: "CA", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_ca_id: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_ca_id}", channel: "PARTNER_REFERRAL", referral_partner_id: "${bank_r_id}", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_ca_id: $.data.id }
            - call: "GET /platform/applications/${app_ca_id}/verifications"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { v_ca_inc: "$.data[0].id", v_ca_idn: "$.data[1].id" }
            - call: "POST /platform/applications/${app_ca_id}/verifications/${v_ca_inc}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_ca_id}/verifications/${v_ca_idn}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
          trigger:
            - call: "POST /platform/applications/${app_ca_id}/allocate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { alloc_id: $.data.id }
          assert:
            - "AllocationDecision.${alloc_id}.channel == WHOLE_LOAN_SALE and chosen_partner_id == ${buyer_w_id}"
            - "AllocationDecision.${alloc_id}.reason_codes contains STATE_NOT_ALLOWED for the referral candidate ${bank_r_id} before any buyer evaluation"
            - "AllocationDecision.${alloc_id}.reason_codes does NOT contain SCORE_BELOW_BOX or SCORE_ABOVE_BOX — the score check never ran for R after the state check failed (first-failure ordering)"
            - "Application.${app_ca_id}.status == APPROVED and a Loan exists with holder_partner_id == ${buyer_w_id} and allocation_channel == WHOLE_LOAN_SALE"
            - "Loan.principal_cents == 5000000 and Loan.apr == 12.0 (buyer's box)"

      - name: payment_waterfall_bucket_order_and_no_post_split_rounding
        grounds:
          - calculations.payment_waterfall
        distinguishing_aspect: |
          Mode (b): pinned ordering — each bucket debit is an exact integer-cent
          subtraction in the pinned order (late fees -> interest -> principal) and the
          total is never re-rounded after the split. A payment of exactly
          late_fee + scheduled_interest zeroes buckets 1-2 and touches principal not
          at all; one cent less leaves the loan DELINQUENT even though only a single
          cent of interest is short, proving the bucket boundary and the all-fees-and-
          interest-covered cure rule interact at exact cent precision.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Model ACTIVE (bureau-only; bureau 575 -> score 50)."
            - "Bank B ACTIVE with box TX, score [0,1000], amounts [100000,10000000], APR 12.0, cap 10."
            - "Applicant TX clean flags, income 12000000, debt 200000, bureau 575; application DIRECT request 5000000 -> approved 5000000 -> allocated PARTNER_RETAINED to B; Loan principal 5000000, monthly_payment_cents 166072 (round_half_up amortization at APR 12.0, 36 months)."
            - "Loan advanced one unpaid period: status DELINQUENT, days_delinquent 30, late_fee_accrued_cents == 1500 (min(0.05*166072, 1500) -> capped)."
            - "scheduled_interest_cents for the current period == round_half_up(5000000 * 0.01) == 50000."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-B-3", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "bureau only", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m1_id: $.data.id }
            - call: "POST /platform/model-versions/${m1_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m1_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr1_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr1_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m1_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/partners"
              payload: { legal_name: "Waterfall Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { bank_id: $.data.id, bank_v0: $.data.version }
            - call: "POST /platform/partners/${bank_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${bank_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { box_id: $.data.id }
            - call: "POST /platform/partners/${bank_id}/credit-boxes/${box_id}/activate"
              payload: { expected_partner_version: "${bank_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/applicants"
              payload: { full_name: "Waterfall Wanda", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_id: $.data.id }
            - call: "GET /platform/applications/${app_id}/verifications"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { v_inc: "$.data[0].id", v_idn: "$.data[1].id" }
            - call: "POST /platform/applications/${app_id}/verifications/${v_inc}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_id}/verifications/${v_idn}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_id}/allocate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pad-one"
            - call: "GET /platform/loans"
              payload: { application_id: "${app_id}" }
              as: ServicingAgent
              as_user_id: "sa-one"
              captures: { loan_id: "$.data[0].id" }
            - call: "POST /platform/loans/${loan_id}/advance-servicing"
              payload: {}
              as: ServicingAgent
              as_user_id: "sa-one"
              captures: { loan_v_del: $.data.version }
          trigger:
            - call: "POST /platform/loans/${loan_id}/payments"
              payload: { amount_cents: 51500, expected_loan_version: "${loan_v_del}" }
              as: ServicingAgent
              as_user_id: "sa-one"
              captures: { loan_v_post: $.data.version }
          assert:
            - "Loan.${loan_id}.late_fee_accrued_cents == 0 (1500 paid from bucket 1)"
            - "Loan.${loan_id}.scheduled_interest_cents == 0 (50000 paid from bucket 2)"
            - "Loan.${loan_id}.outstanding_principal_cents == 5000000 — bucket 3 untouched because the payment exactly equalled bucket1+bucket2 (1500+50000 == 51500)"
            - "Loan.${loan_id}.status == CURRENT and days_delinquent == 0"
            - "a ServicingEvent PAYMENT_APPLIED with amount_cents == 51500 exists on the loan"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: credit_box_supersede_cycle_replaces_active_box
        grounds:
          - state_machines.CreditBox.DRAFT_to_ACTIVE
          - state_machines.CreditBox.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Entity: CreditBox — cyclic configuration replacement. Activating DRAFT box
          B2 while B1 is ACTIVE transitions B1 ACTIVE -> SUPERSEDED and moves
          Partner.active_credit_box_id from B1 to B2; activating a third DRAFT box B3
          repeats the cycle on B2, so the partner walks a supersede chain
          B1 -> B2 -> B3 while never holding two ACTIVE boxes.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Bank P ACTIVE with three DRAFT credit boxes B1, B2, B3 (identical fields, distinct rows); B1 already ACTIVE (partner version advanced past B1's activation)."
          setup_api_calls:
            - call: "POST /platform/partners"
              payload: { legal_name: "Supersede Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /platform/partners/${p_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${p_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { b1_id: $.data.id }
            - call: "POST /platform/partners/${p_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX", "CA"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { b2_id: $.data.id }
            - call: "POST /platform/partners/${p_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX", "CA", "NV"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { b3_id: $.data.id }
            - call: "POST /platform/partners/${p_id}/credit-boxes/${b1_id}/activate"
              payload: { expected_partner_version: "${p_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${p_id}/credit-boxes/${b2_id}/activate"
              payload: { expected_partner_version: "${p_v0} + 2" }
              as: PartnerAdmin
              as_user_id: "pa-one"
          trigger:
            - call: "POST /platform/partners/${p_id}/credit-boxes/${b3_id}/activate"
              payload: { expected_partner_version: "${p_v0} + 3" }
              as: PartnerAdmin
              as_user_id: "pa-one"
          assert:
            - "CreditBox.${b1_id}.status == SUPERSEDED"
            - "CreditBox.${b2_id}.status == SUPERSEDED"
            - "CreditBox.${b3_id}.status == ACTIVE"
            - "Partner.${p_id}.active_credit_box_id == ${b3_id}"
            - "exactly one CreditBox of Partner.${p_id} is ACTIVE (the supersede chain permits no parallel ACTIVE boxes)"

      - name: verification_manual_review_loop_returns_application_to_underwritten
        grounds:
          - state_machines.Application.VERIFICATION_PENDING_to_DOCS_REQUIRED
          - state_machines.Application.DOCS_REQUIRED_to_UNDERWRITTEN
        distinguishing_aspect: |
          Entity: Application — branching with a review loop. An application whose
          INCOME instant check fails detours VERIFICATION_PENDING -> DOCS_REQUIRED
          and can only return to UNDERWRITTEN through the manual-review branch
          (MANUAL_PASSED by a different officer); the sibling IDENTITY verification
          may already be INSTANT_PASSED while the application waits in DOCS_REQUIRED,
          proving the two verification rows branch independently and join on the
          last-passed rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Model ACTIVE (bureau-only; bureau 575 -> score 50)."
            - "Applicant TX, clean except bank_account_nsf_count_90d == 3 (INCOME instant check will fail); application DIRECT request 5000000 is VERIFICATION_PENDING."
            - "IDENTITY verification already INSTANT_PASSED by officer vo-one; INCOME verification INSTANT_FAILED by officer vo-one."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-B-4", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "bureau only", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m1_id: $.data.id }
            - call: "POST /platform/model-versions/${m1_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m1_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr1_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr1_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m1_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/applicants"
              payload: { full_name: "Loop Larry", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 3, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_id: $.data.id }
            - call: "GET /platform/applications/${app_id}/verifications"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { v_inc: "$.data[0].id", v_idn: "$.data[1].id" }
            - call: "POST /platform/applications/${app_id}/verifications/${v_idn}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_id}/verifications/${v_inc}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
          trigger:
            - call: "POST /platform/applications/${app_id}/verifications/${v_inc}/manual-decision"
              payload: { outcome: "PASS" }
              as: VerificationOfficer
              as_user_id: "vo-two"
          assert:
            - "before the trigger, Application.${app_id}.status == DOCS_REQUIRED while Verification.${v_idn}.status == INSTANT_PASSED"
            - "Verification.${v_inc}.status == MANUAL_PASSED and reviewer_id == \"vo-two\""
            - "Application.${app_id}.status == UNDERWRITTEN (join fires on the last non-passed verification)"
            - "Application.${app_id}.approved_amount_cents == 3600000 (manual-review haircut variant applies because a MANUAL_PASSED verification exists)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: offboard_cascades_partner_to_boxes_to_pools
        grounds:
          - state_machines.Partner.ACTIVE_to_OFFBOARDED
        distinguishing_aspect: |
          Trigger: POST /platform/partners/{id}/offboard. Depth-2 cascade: offboarding
          the trust partner mutates its CreditBoxes (ACTIVE -> SUPERSEDED, DRAFT ->
          RETIRED) and that same offboard mutation cascades into every OPEN
          SecuritizationPool the trust owns (OPEN -> CLOSED) — three entity types
          changed by one request, each hop caused by the previous hop's effect.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Trust partner T (SECURITIZATION_TRUST) ACTIVE with one ACTIVE credit box B1 and one DRAFT credit box B2, and one OPEN SecuritizationPool P1 (target 100000000, allocated 0). T holds no loans (funded_balance_cents == 0)."
