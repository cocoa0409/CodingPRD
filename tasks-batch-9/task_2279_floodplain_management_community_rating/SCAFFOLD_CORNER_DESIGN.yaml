              as_user_id: "snc-01"
          trigger:
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_PANEL_NOT_PENDING'"
            - "FirmPanel.${panel_id}.status == EFFECTIVE"
            - "FirmPanel.${panel_id}.supersedes_panel_id == null"
            - "FirmPanel.${panel_id}.activated_at == '2026-08-01T00:00:00Z'"

