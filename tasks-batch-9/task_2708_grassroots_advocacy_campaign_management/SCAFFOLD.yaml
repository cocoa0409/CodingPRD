scenario: |
  2708. Grassroots Advocacy Campaign Management (advocacy organization campaign team): campaign goal
  definition with target decision makers, timeline and success metrics, supporter list building through
  petitions, events and digital acquisition with consent capture, message testing, segmentation and
  multi-channel activation across email, text and phone with frequency governance,
  constituent-to-legislator matching by district with action tracking and thank-you loops, coalition
  partner coordination with shared branding and message discipline, in-district meeting scheduling,
  story collection and spokesperson training, media and social amplification aligned to legislative
  calendar milestones, campaign outcome analysis and supporter retention
domain_name: grassroots-advocacy-campaign-management
api_prefix: /advocacy

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  secondary_layers:
    - selector_policy
    - derived_field_reconciliation
    - version_pinning_on_approval

  entity_topology: flat
  entity_topology_note: |
    Thirteen peer collections live directly under the /advocacy namespace; every relationship is
    expressed as a foreign key in the request body, never as URL nesting. The only nested read paths
    are reverse-reachability sub-resources (campaign -> milestones / coalition-partners,
    supporter -> consent-events / spokesperson-profiles).

  state_machine_shape: cyclic
  state_machine_shape_note: |
    MessageVariant cycles DRAFT -> IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW with a hard
    revision-round ceiling; ActionRecord cycles MATCHED -> DISPUTED -> MATCHED and forks
    RECORDED -> {MATCHED, UNMATCHED}; Activation carries two independent state dimensions
    (approval_state and delivery_state) that advance on separate triggers; Campaign carries an
    independent status dimension plus a derived posture dimension computed from its children;
    DistrictMeeting branches REQUESTED -> {CONFIRMED, DECLINED} then CONFIRMED -> {HELD, NO_SHOW}.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  relationship_patterns_note: |
    many_to_many: PartnerEndorsement is the junction between CoalitionPartner and MessageVariant.
    self_referential: MessageVariant.derived_from_variant_id records revision lineage.
    cross_aggregate: Activation reads Segment membership, MessageVariant lock state and Milestone
    windows; ActionRecord binds Supporter, Legislator and Activation.

  role_model: segregation_of_duties
  role_model_note: |
    Six peer roles own disjoint resource families; on top of that, the operator who submits a
    MessageVariant for review (recorded as submitted_by_user_id from X-User-ID) may never be the
    operator who records the review decision, even when that operator legitimately holds the
    ComplianceOfficer role.

  consistency_model: immediate

difficulty_level: expert_plus
difficulty_level_note: |
  Above the Expert band on purpose: 13 entities, 70 endpoints (69 under /advocacy plus the logical
  clock), 50 error codes, 13 calculation rules (2 carrying divergent variants), 11 state-machine
  blocks over 9 entities (Campaign and Activation each split into two parallel dimensions), 24
  ordered validations and two OCC-guarded create paths (39 writes and 31 reads). Density, not
  volume, carries the difficulty: every activation decision reads Segment membership, ConsentEvent
  replay, Supporter frequency ledgers, MessageVariant lock state, CoalitionPartner quorum, Milestone
  windows and the Campaign posture computed from all of them.

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Campaign
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Campaign display name.
        constraints: non-empty, max 160 chars
      - name: goal_statement
        type: string
        source: input
        description: One-sentence campaign goal (what the decision makers must do).
        constraints: non-empty, max 400 chars
      - name: bill_reference
        type: string
        source: input
        description: Legislative vehicle the campaign targets, e.g. "HB-1420".
        constraints: non-empty, max 40 chars
      - name: target_chamber
        type: enum
        source: input
        description: Chamber whose members are the target decision makers.
        constraints: one of {HOUSE, SENATE, BOTH}
      - name: start_date
        type: datetime
        source: input
        description: Inclusive start of the campaign timeline (ISO 8601 UTC).
      - name: end_date
        type: datetime
        source: input
        description: Inclusive end of the campaign timeline (ISO 8601 UTC); must be strictly after start_date.
      - name: success_metric_target_actions
        type: integer
        source: input
        description: Success metric - number of constituent actions the campaign commits to deliver.
        constraints: ">= 0"
      - name: success_metric_target_supporters
        type: integer
        source: input
        description: Success metric - number of distinct acting supporters the campaign commits to mobilize.
        constraints: ">= 0"
      - name: funded_total_cents
        type: integer
        source: input
        description: Total coalition-funded campaign budget in cents, split across ACTIVE coalition partners by share weight.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Lifecycle dimension of the campaign, advanced only by launch/close.
        default: DRAFT
        constraints: one of {DRAFT, ACTIVE, CLOSED}
      - name: posture_override
        type: enum
        source: input
        description: Operator override applied on top of the derived posture; set through POST /advocacy/campaigns/{campaign_id}/posture-overrides.
        default: NONE
        constraints: one of {NONE, FORCE_OPEN, FORCE_FROZEN}
      - name: posture
        type: enum
        source: computed
        description: Derived gating dimension recomputed by calculation campaign_posture after every child mutation; gates activation and action-record writes.
        default: OPEN
        constraints: one of {OPEN, RESTRICTED, FROZEN}
      - name: blocked_activation_count
        type: integer
        source: computed
        description: Count of Activation rows of this campaign whose approval_state == BLOCKED.
        default: 0
      - name: opposed_priority_legislator_count
        type: integer
        source: computed
        description: Count of Legislator rows of this campaign with priority_tier == PRIMARY and stance IN {LEAN_OPPOSE, OPPOSE}.
        default: 0
      - name: total_actions_logged
        type: integer
        source: computed
        description: Count of ActionRecord rows of this campaign with status IN {MATCHED, ACKNOWLEDGED, THANKED}.
        default: 0
      - name: distinct_acting_supporter_count
        type: integer
        source: computed
        description: Count of distinct Supporter ids appearing on ActionRecord rows of this campaign with status IN {MATCHED, ACKNOWLEDGED, THANKED}.
        default: 0
      - name: committed_share_total_cents
        type: integer
        source: computed
        description: Sum of CoalitionPartner.committed_cents over partners of this campaign with status == ACTIVE; conserved quantity of invariant coalition_funding_conservation.
        default: 0

  - name: Milestone
    parent: Campaign
    common_fields: true
    entity_kind: configuration
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign whose legislative calendar carries this milestone.
      - name: kind
        type: enum
        source: input
        description: Legislative calendar event kind.
        constraints: one of {COMMITTEE_HEARING, FLOOR_VOTE, RECESS, SIGNING}
      - name: label
        type: string
        source: input
        description: Human label for the milestone, e.g. "House floor vote".
        constraints: non-empty, max 120 chars
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the milestone window (ISO 8601 UTC).
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the milestone window (ISO 8601 UTC); windows are half-open [window_start, window_end).
      - name: is_blackout
        type: boolean
        source: computed
        description: True exactly when kind == RECESS; blackout windows forbid overlapping activation send windows.
        default: false
      - name: pressure_multiplier
        type: number
        source: computed
        description: "Multiplier stamped onto ActionRecord.pressure_multiplier for actions taken inside this window: COMMITTEE_HEARING 1.5, FLOOR_VOTE 2.0, RECESS 0.5, SIGNING 1.0."
      - name: status
        type: enum
        source: computed
        description: Position of the logical clock relative to the half-open window; recomputed on every read and on reschedule.
        default: SCHEDULED
        constraints: one of {SCHEDULED, IN_WINDOW, PASSED}
      - name: reschedule_count
        type: integer
        source: computed
        description: Number of times this milestone has been rescheduled.
        default: 0

  - name: Legislator
    parent: Campaign
    common_fields: true
    entity_kind: resource
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign targeting this decision maker.
      - name: full_name
        type: string
        source: input
        description: Legislator name.
        constraints: non-empty, max 120 chars
      - name: district_code
        type: string
        source: input
        description: District identifier used for constituent-to-legislator matching, e.g. "HD-14".
        constraints: non-empty, max 16 chars
      - name: chamber
        type: enum
        source: input
        description: Chamber this legislator sits in.
        constraints: one of {HOUSE, SENATE}
      - name: stance
        type: enum
        source: input
        description: Current whip-count stance on the campaign's bill.
        default: UNDECIDED
        constraints: one of {SUPPORT, LEAN_SUPPORT, UNDECIDED, LEAN_OPPOSE, OPPOSE}
      - name: initial_stance
        type: enum
        source: system
        description: Stance snapshot taken at creation; never mutated, used by outcome analysis to compute stance_shift_net.
        constraints: one of {SUPPORT, LEAN_SUPPORT, UNDECIDED, LEAN_OPPOSE, OPPOSE}
      - name: contact_pressure_score
        type: number
        source: computed
        description: Output of calculation district_pressure_index; 2 decimal places, round_half_up.
        default: 0.00
      - name: priority_tier
        type: enum
        source: computed
        description: "Tier derived from contact_pressure_score: PRIMARY when >= 60.00, SECONDARY when >= 30.00 and < 60.00, MONITOR otherwise."
        default: MONITOR
        constraints: one of {PRIMARY, SECONDARY, MONITOR}
      - name: constituent_action_count
        type: integer
        source: computed
        description: Count of ActionRecord rows pointing at this legislator with status IN {MATCHED, ACKNOWLEDGED, THANKED}.
        default: 0
      - name: meeting_held_count
        type: integer
        source: computed
        description: Count of DistrictMeeting rows for this legislator with status == HELD.
        default: 0

  - name: Supporter
    parent: Campaign
    common_fields: true
    entity_kind: resource
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign that acquired this supporter.
      - name: full_name
        type: string
        source: input
        description: Supporter name.
        constraints: non-empty, max 120 chars
      - name: email
        type: string
        source: input
        description: Email address used for EMAIL activations.
        constraints: non-empty, must contain "@"
      - name: phone
        type: string
        source: input
        description: E.164 phone number used for SMS and PHONE activations; required when initial_consent_channels contains SMS or PHONE.
        default: null
      - name: district_code
        type: string
        source: input
        description: District the supporter lives in; drives constituent-to-legislator matching.
        constraints: non-empty, max 16 chars
      - name: acquisition_source
        type: enum
        source: input
        description: How the supporter entered the list.
        constraints: one of {PETITION, EVENT, DIGITAL_AD, REFERRAL}
      - name: email_consent_state
        type: enum
        source: computed
        description: Output of calculation consent_state_resolution for channel EMAIL.
        default: NONE
        constraints: one of {NONE, GRANTED, REVOKED}
      - name: sms_consent_state
        type: enum
        source: computed
        description: Output of calculation consent_state_resolution for channel SMS.
        default: NONE
        constraints: one of {NONE, GRANTED, REVOKED}
      - name: phone_consent_state
        type: enum
        source: computed
        description: Output of calculation consent_state_resolution for channel PHONE.
        default: NONE
        constraints: one of {NONE, GRANTED, REVOKED}
      - name: suppressed
        type: boolean
        source: computed
        description: True exactly when email_consent_state, sms_consent_state and phone_consent_state are all REVOKED.
        default: false
      - name: consent_event_count
        type: integer
        source: computed
        description: Count of ConsentEvent rows for this supporter.
        default: 0
      - name: touches_reserved
        type: integer
        source: computed
        description: Outstanding frequency-governance reservations - number of Activation rows with delivery_state IN {SCHEDULED, SENDING} that list this supporter in target_supporter_ids. Conserved side of invariant touch_reservation_conservation.
        default: 0
      - name: touches_consumed
        type: integer
        source: computed
        description: Frequency-governance consumption counter - incremented once per delivered activation touch and once per thank-you touch; never decremented.
        default: 0
      - name: action_count
        type: integer
        source: computed
        description: Count of ActionRecord rows of this supporter with status IN {MATCHED, ACKNOWLEDGED, THANKED}.
        default: 0
      - name: thanked_count
        type: integer
        source: computed
        description: Count of ActionRecord rows of this supporter with status == THANKED.
        default: 0
      - name: engagement_score
        type: number
        source: computed
        description: Rolling decay-weighted variant of calculation supporter_value_score; 2 decimal places, round_half_up. Feeds Segment membership through rule_min_engagement_score.
        default: 0.00
      - name: retention_score
        type: number
        source: computed
        description: Campaign-final undecayed variant of calculation supporter_value_score; 2 decimal places, round_half_up. Feeds outcome analysis retention cohorts.
        default: 0.00

  - name: ConsentEvent
    parent: Supporter
    common_fields: false
    entity_kind: event
    fields:
      - name: supporter_id
        type: string
        source: input
        description: FK -> Supporter.id; the supporter whose consent this event records.
      - name: channel
        type: enum
        source: input
        description: Channel scope of the event; ALL applies to EMAIL, SMS and PHONE at once.
        constraints: one of {EMAIL, SMS, PHONE, ALL}
      - name: action
        type: enum
        source: input
        description: Direction of the consent change.
        constraints: one of {GRANT, REVOKE}
      - name: lawful_basis
        type: enum
        source: input
        description: Documented lawful basis for a GRANT; ignored (and stored as null) for REVOKE.
        default: null
        constraints: one of {EXPRESS_WRITTEN, OPT_IN_FORM, EVENT_CARD, VERBAL_RECORDED}
      - name: source_reference
        type: string
        source: input
        description: Provenance handle for the consent artifact, e.g. petition sheet id or web form id.
        constraints: non-empty, max 120 chars
      - name: sequence_no
        type: integer
        source: system
        description: Per-supporter monotonic insertion counter starting at 1; the deterministic tie-break for consent replay when two events share created_at.
      - name: effective_at
        type: datetime
        source: system
        description: Logical-clock instant at which the event was recorded; equals created_at.

  - name: Segment
    parent: Campaign
    common_fields: true
    entity_kind: resource
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign whose supporter list this segment slices.
      - name: name
        type: string
        source: input
        description: Segment display name.
        constraints: non-empty, max 120 chars
      - name: rule_required_channel
        type: enum
        source: input
        description: Channel whose consent state must be GRANTED for a supporter to be a member.
        constraints: one of {EMAIL, SMS, PHONE}
      - name: rule_district_codes
        type: array
        source: input
        description: District allow-list; an empty array means every district qualifies.
        default: []
      - name: rule_min_engagement_score
        type: number
        source: input
        description: Inclusive engagement_score floor for membership (supporter qualifies when engagement_score >= this value).
        default: 0.00
      - name: rule_sources
        type: array
        source: input
        description: Acquisition-source allow-list drawn from {PETITION, EVENT, DIGITAL_AD, REFERRAL}; an empty array means every source qualifies.
        default: []
      - name: member_supporter_ids
        type: array
        source: computed
        description: Ordered membership snapshot produced by calculation segment_membership; ordered by Supporter.created_at ASC.
        default: []
      - name: member_count
        type: integer
        source: computed
        description: Length of member_supporter_ids.
        default: 0
      - name: active_activation_count
        type: integer
        source: computed
        description: Count of Activation rows referencing this segment with delivery_state IN {SCHEDULED, SENDING}; every change bumps Segment.version, which is what the OCC guard on activation creation observes.
        default: 0
      - name: last_refreshed_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent POST /advocacy/segments/{segment_id}/refresh; null until first refresh.
        default: null

  - name: MessageVariant
    parent: Campaign
    common_fields: true
    entity_kind: resource
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign this message belongs to.
      - name: derived_from_variant_id
        type: string
        source: input
        description: FK -> MessageVariant.id; self-referential revision lineage pointer, null for an original draft.
        default: null
      - name: test_cell
        type: string
        source: input
        description: Message-test cell label; variants sharing a test_cell compete in one test, e.g. "ECONOMIC_FRAME".
        constraints: non-empty, max 60 chars
      - name: headline
        type: string
        source: input
        description: Message headline shown to supporters.
        constraints: non-empty, max 160 chars
      - name: body
        type: string
        source: input
        description: Message body copy.
        constraints: non-empty, max 2000 chars
      - name: channel_scope
        type: array
        source: input
        description: Channels this message is cleared for, drawn from {EMAIL, SMS, PHONE}; an Activation channel must appear here.
        constraints: non-empty array
      - name: status
        type: enum
        source: system
        description: Review and message-discipline lifecycle state.
        default: DRAFT
        constraints: one of {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED, LOCKED, RETIRED}
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID captured on the most recent submit; the segregation-of-duties check compares it to the reviewer's X-User-ID.
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID captured on the most recent review decision.
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: 1 plus the number of IN_REVIEW -> CHANGES_REQUESTED transitions this variant has taken; the cycle terminates at MAX_REVISION_ROUNDS.
        default: 1
      - name: required_endorsement_quorum
        type: integer
        source: computed
        description: Output of calculation endorsement_quorum - max(1, ceil(0.5 * count of CoalitionPartner with status == ACTIVE in the same campaign)).
        default: 1
      - name: endorsement_count
        type: integer
        source: computed
        description: Count of PartnerEndorsement rows for this variant with status == ACTIVE.
        default: 0
      - name: test_winner
        type: boolean
        source: computed
        description: True only for the variant selected by POST /advocacy/campaigns/{campaign_id}/message-test-resolutions in its test_cell.
        default: false
      - name: attributed_action_count
        type: integer
        source: computed
        description: Count of ActionRecord rows whose activation_id belongs to an Activation carrying this variant and whose status IN {MATCHED, ACKNOWLEDGED, THANKED}.
        default: 0
      - name: realized_reach_total
        type: integer
        source: computed
        description: Sum of Activation.realized_reach over activations of this variant with delivery_state IN {SENT, PARTIAL}.
        default: 0
      - name: send_cost_total_cents
        type: integer
        source: computed
        description: Sum of Activation.send_cost_cents over activations of this variant with delivery_state IN {SENT, PARTIAL}.
        default: 0
      - name: response_rate_bps
        type: integer
        source: computed
        description: Output of calculation variant_test_metrics - response rate in basis points; 0 when realized_reach_total == 0.
        default: 0
      - name: cost_per_action_cents
        type: integer
        source: computed
        description: Output of calculation variant_test_metrics - floor(send_cost_total_cents / attributed_action_count), or the sentinel 999999 when attributed_action_count == 0.
        default: 999999

  - name: CoalitionPartner
    parent: Campaign
    common_fields: true
    entity_kind: resource
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign this partner joined.
      - name: org_name
        type: string
        source: input
        description: Partner organization name.
        constraints: non-empty, max 160 chars
      - name: tier
        type: enum
        source: input
        description: Coalition tier that fixes the partner's funding share weight.
        constraints: one of {ANCHOR, CORE, ALLY}
      - name: branding_asset_ref
        type: string
        source: input
        description: Shared-branding asset handle the partner supplies for co-branded materials.
        constraints: non-empty, max 120 chars
      - name: share_weight
        type: integer
        source: computed
        description: "Weight derived from tier: ANCHOR 5, CORE 3, ALLY 1."
      - name: committed_cents
        type: integer
        source: computed
        description: Output of calculation coalition_cost_share; 0 for a WITHDRAWN partner.
        default: 0
      - name: status
        type: enum
        source: system
        description: Coalition membership state.
        default: ACTIVE
        constraints: one of {ACTIVE, WITHDRAWN}
      - name: active_endorsement_count
        type: integer
        source: computed
        description: Count of PartnerEndorsement rows for this partner with status == ACTIVE.
        default: 0

  - name: PartnerEndorsement
    parent: MessageVariant
    common_fields: true
    entity_kind: resource
    fields:
      - name: partner_id
        type: string
        source: input
        description: FK -> CoalitionPartner.id; the endorsing partner.
      - name: message_variant_id
        type: string
        source: input
        description: FK -> MessageVariant.id; the message being endorsed.
      - name: discipline_pledge
        type: boolean
        source: input
        description: Partner's pledge to hold message discipline; must be true.
        constraints: must equal true
      - name: talking_points_ack
        type: boolean
        source: input
        description: Partner's acknowledgement of the shared talking points; must be true.
        constraints: must equal true
      - name: endorsed_variant_version
        type: integer
        source: system
        description: MessageVariant.version pinned at endorsement time; lets a reader tell whether the endorsed copy is still the current copy.
      - name: status
        type: enum
        source: system
        description: Endorsement state.
        default: ACTIVE
        constraints: one of {ACTIVE, REVOKED}
      - name: revoked_reason
        type: string
        source: input
        description: Reason recorded on revocation; null while ACTIVE.
        default: null

  - name: Activation
    parent: Campaign
    common_fields: true
    entity_kind: resource
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign this send wave belongs to.
      - name: segment_id
        type: string
        source: input
        description: FK -> Segment.id; the audience slice this wave targets.
      - name: message_variant_id
        type: string
        source: input
        description: FK -> MessageVariant.id; the message copy this wave sends.
      - name: milestone_id
        type: string
        source: input
        description: FK -> Milestone.id; optional legislative-calendar anchor that unlocks the frequency surge grant.
        default: null
      - name: channel
        type: enum
        source: input
        description: Delivery channel of this wave; must appear in the variant's channel_scope.
        constraints: one of {EMAIL, SMS, PHONE}
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the send window (ISO 8601 UTC).
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the send window (ISO 8601 UTC); channel saturation treats [window_start, window_end] as a CLOSED interval.
      - name: min_viable_reach
        type: integer
        source: input
        description: Minimum projected reach the wave must retain to stay approvable.
        default: 1
        constraints: ">= 1"
      - name: approval_state
        type: enum
        source: system
        description: Message-discipline / compliance dimension; advances independently of delivery_state.
        default: PENDING
        constraints: one of {PENDING, CLEARED, BLOCKED}
      - name: delivery_state
        type: enum
        source: system
        description: Send-execution dimension; advances independently of approval_state.
        default: SCHEDULED
        constraints: one of {SCHEDULED, SENDING, SENT, PARTIAL, ABORTED}
      - name: effective_touch_cap
        type: integer
        source: computed
        description: Output of calculation frequency_headroom step 3 - BASE_TOUCH_CAP_PER_SUPPORTER plus the surge grant pinned at evaluation time; stored so the snapshot is auditable.
      - name: target_supporter_ids
        type: array
        source: computed
        description: Ordered snapshot of the supporters this wave will touch, ordered by Supporter.created_at ASC; recomputed only while delivery_state == SCHEDULED.
        default: []
      - name: projected_reach
        type: integer
        source: computed
        description: Forward-looking variant of calculation activation_reach - length of target_supporter_ids.
        default: 0
      - name: realized_reach
        type: integer
        source: computed
        description: Chronological variant of calculation activation_reach, written at completion; null until then.
        default: null
      - name: delivered_count
        type: integer
        source: input
        description: Number of touches the channel vendor reported as delivered, supplied on completion.
        default: null
      - name: bounced_count
        type: integer
        source: input
        description: Number of touches the channel vendor reported as bounced, supplied on completion.
        default: null
      - name: send_cost_cents
        type: integer
        source: computed
        description: CHANNEL_UNIT_COST_CENTS[channel] multiplied by delivered_count, written at completion.
        default: 0
      - name: suppressed_by_consent_count
        type: integer
        source: computed
        description: Number of delivered touches excluded from realized_reach because the supporter's channel consent was no longer GRANTED at completion.
        default: 0
      - name: abort_reason
        type: string
        source: input
        description: Reason recorded when the wave is aborted; null otherwise.
        default: null

  - name: ActionRecord
    parent: Supporter
    common_fields: true
    entity_kind: resource
    fields:
      - name: supporter_id
        type: string
        source: input
        description: FK -> Supporter.id; the constituent who took the action.
      - name: activation_id
        type: string
        source: input
        description: FK -> Activation.id; the wave that prompted the action, null for an organic action.
        default: null
      - name: legislator_id
        type: string
        source: computed
        description: FK -> Legislator.id; filled by the district-matching selector, null while UNMATCHED.
        default: null
      - name: channel
        type: enum
        source: input
        description: Channel the constituent used to contact the office.
        constraints: one of {EMAIL, SMS, PHONE}
      - name: status
        type: enum
        source: system
        description: Action lifecycle state; RECORDED is resolved to MATCHED or UNMATCHED inside the creating request.
        default: RECORDED
        constraints: one of {RECORDED, MATCHED, UNMATCHED, ACKNOWLEDGED, THANKED, DISPUTED, VOIDED}
      - name: pressure_multiplier
        type: number
        source: computed
        description: Milestone pressure multiplier snapshot chosen by calculation milestone_multiplier_snapshot at creation; 1.0 when no milestone window contains created_at.
        default: 1.0
      - name: thank_channel
        type: enum
        source: input
        description: Channel used for the thank-you touch, supplied on the thank call; null until then.
        default: null
        constraints: one of {EMAIL, SMS, PHONE}
      - name: acknowledged_at
        type: datetime
        source: system
        description: Logical-clock instant the legislator office acknowledgement was logged; null until then.
        default: null
      - name: thanked_at
        type: datetime
        source: system
        description: Logical-clock instant the thank-you touch was recorded; null until then.
        default: null
      - name: dispute_reason
        type: string
        source: input
        description: Reason recorded when the action is disputed; null otherwise.
        default: null

  - name: Spokesperson
    parent: Supporter
    common_fields: true
    entity_kind: resource
    fields:
      - name: supporter_id
        type: string
        source: input
        description: FK -> Supporter.id; the supporter whose story this profile carries.
      - name: story_summary
        type: string
        source: input
        description: Collected personal story used in media and legislator meetings.
        constraints: non-empty, max 1000 chars
      - name: publication_consent
        type: enum
        source: input
        description: How far the story may travel; CERTIFIED training requires PUBLIC.
        default: WITHHELD
        constraints: one of {WITHHELD, INTERNAL, PUBLIC}
      - name: training_state
        type: enum
        source: system
        description: Spokesperson training ladder state.
        default: UNTRAINED
        constraints: one of {UNTRAINED, TRAINED, CERTIFIED}
      - name: training_sessions_completed
        type: integer
        source: computed
        description: Number of successful training advancements applied to this profile.
        default: 0
      - name: media_ready
        type: boolean
        source: computed
        description: True exactly when training_state == CERTIFIED and publication_consent == PUBLIC.
        default: false

  - name: DistrictMeeting
    parent: Campaign
    common_fields: true
    entity_kind: resource
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign booking the meeting.
      - name: legislator_id
        type: string
        source: input
        description: FK -> Legislator.id; the office being met; overlap arithmetic is per legislator.
      - name: lead_spokesperson_id
        type: string
        source: input
        description: FK -> Spokesperson.id; the constituent spokesperson leading the meeting.
      - name: location_district_code
        type: string
        source: input
        description: District the in-district meeting is held in; must equal the legislator's district_code.
        constraints: non-empty, max 16 chars
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the meeting (ISO 8601 UTC).
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the meeting (ISO 8601 UTC); overlap uses half-open [window_start, window_end) plus a travel buffer.
      - name: status
        type: enum
        source: system
        description: Meeting lifecycle state.
        default: REQUESTED
        constraints: one of {REQUESTED, CONFIRMED, DECLINED, HELD, NO_SHOW}
      - name: attendee_count
        type: integer
        source: input
        description: Number of constituents who actually attended, supplied on completion; 0 routes the meeting to NO_SHOW.
        default: null
      - name: pressure_credit
        type: number
        source: computed
        description: MEETING_PRESSURE_CREDIT when status == HELD, otherwise 0.00.
        default: 0.00
      - name: decline_reason
        type: string
        source: input
        description: Reason recorded when the office declines; null otherwise.
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Campaign
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /advocacy/campaigns/{campaign_id}/launch"
        actor: CampaignDirector
        preconditions:
          - "Campaign.status == DRAFT"
          - "at least one Legislator row exists with campaign_id == Campaign.id, else ERR_NO_TARGET_LEGISLATOR"
        side_effects:
          - "Campaign.status := ACTIVE"
          - "recompute Campaign.posture via calculation campaign_posture"
          - "increments Campaign.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /advocacy/campaigns/{campaign_id}/close"
        actor: CampaignDirector
        preconditions:
          - "Campaign.status == ACTIVE"
          - "no Activation of this campaign has delivery_state == SENDING, else ERR_ACTIVATION_IN_FLIGHT"
        side_effects:
          - "Campaign.status := CLOSED"
          - "CASCADE hop 1: every Activation of this campaign with delivery_state == SCHEDULED := ABORTED with abort_reason 'CAMPAIGN_CLOSED'"
          - "CASCADE hop 2: because those activations left SCHEDULED, each supporter listed in their target_supporter_ids has touches_reserved decremented by 1 per aborted activation, and Segment.active_activation_count for their segments is decremented (bumping Segment.version)"
          - "CASCADE hop 3: because those activations became ABORTED, every ActionRecord with activation_id in that set and status IN {RECORDED, MATCHED, ACKNOWLEDGED} := VOIDED (status THANKED is preserved)"
          - "CASCADE hop 4: because those action records became VOIDED, contact_pressure_score and priority_tier are recomputed for each affected Legislator"
          - "every DistrictMeeting of this campaign with status == REQUESTED := DECLINED with decline_reason 'CAMPAIGN_CLOSED'"
          - "recompute retention_score for every Supporter of this campaign (campaign_final variant of supporter_value_score)"
          - "Campaign.posture := FROZEN (a CLOSED campaign is FROZEN even when posture_override == FORCE_OPEN)"
          - "increments Campaign.version by 1"
        note: "Closing is the campaign-wrap trigger: it flushes in-flight waves, freezes the posture and finalizes retention scoring for outcome analysis."

  - entity: Campaign
    dimension: posture
    initial_state: OPEN
    terminal_states: []
    shape: posture_driven
    note: |
      posture is never set directly; it is the output of calculation campaign_posture, recomputed at
      the end of every request that changes Activation.approval_state, Legislator.priority_tier,
      Legislator.stance, Campaign.status or Campaign.posture_override. The transitions below name the
      derived edges so tests can assert them.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: calculation campaign_posture re-evaluates to RESTRICTED after a child mutation"
        actor: system
        preconditions:
          - "Campaign.status == ACTIVE"
          - "Campaign.posture_override == NONE"
          - "blocked_activation_count == 1 OR opposed_priority_legislator_count >= 1"
          - "blocked_activation_count < 2"
        side_effects:
          - "Campaign.posture := RESTRICTED"
          - "SMS and PHONE activation creation, clearance and send-start are refused with ERR_CAMPAIGN_RESTRICTED while EMAIL waves continue"
          - "the frequency surge grant available to milestone-anchored waves drops from 2 to 1 (see calculation frequency_headroom step 2)"
          - "increments Campaign.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: calculation campaign_posture re-evaluates to FROZEN after a child mutation"
        actor: system
        preconditions:
          - "Campaign.posture_override == NONE"
          - "blocked_activation_count >= 2"
        side_effects:
          - "Campaign.posture := FROZEN"
          - "activation creation, clearance, send-start, action-record creation, thank-you touches and meeting creation are all refused with ERR_CAMPAIGN_FROZEN"
          - "increments Campaign.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: calculation campaign_posture re-evaluates to OPEN after a compensating mutation (activation abort, endorsement re-grant, legislator tier downgrade)"
        actor: system
        preconditions:
          - "Campaign.status == ACTIVE"
          - "Campaign.posture_override == NONE"
          - "blocked_activation_count == 0 AND opposed_priority_legislator_count == 0"
        side_effects:
          - "Campaign.posture := OPEN"
          - "increments Campaign.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /advocacy/campaigns/{campaign_id}/posture-overrides with posture_override FORCE_OPEN"
        actor: CampaignDirector
        preconditions:
          - "Campaign.status != CLOSED (a CLOSED campaign stays FROZEN)"
        side_effects:
          - "Campaign.posture_override := FORCE_OPEN"
          - "Campaign.posture := OPEN irrespective of blocked_activation_count and opposed_priority_legislator_count; blocked_activation_count itself is NOT cleared and the blocked activations stay BLOCKED"
          - "increments Campaign.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "POST /advocacy/campaigns/{campaign_id}/posture-overrides with posture_override FORCE_OPEN"
        actor: CampaignDirector
        preconditions:
          - "Campaign.status != CLOSED (a CLOSED campaign stays FROZEN)"
        side_effects:
          - "Campaign.posture_override := FORCE_OPEN"
          - "Campaign.posture := OPEN irrespective of blocked_activation_count and opposed_priority_legislator_count"
          - "increments Campaign.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "POST /advocacy/campaigns/{campaign_id}/posture-overrides with posture_override FORCE_FROZEN"
        actor: CampaignDirector
        preconditions: []
        side_effects:
          - "Campaign.posture_override := FORCE_FROZEN"
          - "Campaign.posture := FROZEN"
          - "increments Campaign.version by 1"

  - entity: Milestone
    dimension: status
    initial_state: SCHEDULED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: SCHEDULED
        to: IN_WINDOW
        trigger: "system: logical clock reaches window_start (recomputed on every read and after POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc >= window_start AND current_utc < window_end"
        side_effects:
          - "Milestone.status := IN_WINDOW"
          - "ActionRecords created from now on inside this window are stamped with this milestone's pressure_multiplier"
      - from: IN_WINDOW
        to: PASSED
        trigger: "system: logical clock reaches window_end"
        actor: system
        preconditions:
          - "current_utc >= window_end"
        side_effects:
          - "Milestone.status := PASSED"
      - from: PASSED
        to: SCHEDULED
        trigger: "POST /advocacy/milestones/{milestone_id}/reschedule"
        actor: CampaignDirector
        preconditions:
          - "new window_end is strictly after new window_start, else ERR_INVALID_WINDOW"
          - "the new window lies inside [Campaign.start_date, Campaign.end_date], else ERR_WINDOW_OUTSIDE_CAMPAIGN"
          - "Campaign.status == ACTIVE, else ERR_CAMPAIGN_NOT_ACTIVE"
        side_effects:
          - "Milestone.window_start / window_end := new values; reschedule_count incremented by 1"
          - "Milestone.status recomputed from the logical clock against the new half-open window"
          - "CASCADE hop 1: because the window moved, every Activation of the same campaign with delivery_state == SCHEDULED is re-validated against blackout milestones"
          - "CASCADE hop 2: because a re-validated wave now intersects a RECESS window, its approval_state := BLOCKED"
          - "CASCADE hop 3: because a wave became BLOCKED, Campaign.blocked_activation_count is recomputed and calculation campaign_posture re-runs"
          - "increments Milestone.version by 1"
        note: "A RECESS milestone moved on top of an already-scheduled send window is the classic blackout collision; the wave is blocked rather than silently sent."

  - entity: MessageVariant
    dimension: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /advocacy/message-variants/{variant_id}/submit"
        actor: MessageStrategist
        preconditions:
          - "MessageVariant.status == DRAFT"
          - "Campaign.status == ACTIVE, else ERR_CAMPAIGN_NOT_ACTIVE"
        side_effects:
          - "MessageVariant.status := IN_REVIEW"
          - "MessageVariant.submitted_by_user_id := X-User-ID of this request"
          - "increments MessageVariant.version by 1"
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /advocacy/message-variants/{variant_id}/submit (resubmission after edits)"
        actor: MessageStrategist
        preconditions:
          - "MessageVariant.status == CHANGES_REQUESTED"
          - "MessageVariant.revision_round <= MAX_REVISION_ROUNDS, else ERR_REVISION_LIMIT_REACHED"
          - "Campaign.status == ACTIVE"
        side_effects:
          - "MessageVariant.status := IN_REVIEW"
          - "MessageVariant.submitted_by_user_id := X-User-ID of this request"
          - "increments MessageVariant.version by 1"
        note: "This is the revision cycle edge; the loop terminates when revision_round would exceed MAX_REVISION_ROUNDS."
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /advocacy/message-variants/{variant_id}/review-decisions with decision REQUEST_CHANGES"
        actor: ComplianceOfficer
        preconditions:
          - "MessageVariant.status == IN_REVIEW"
          - "X-User-ID != MessageVariant.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "MessageVariant.status := CHANGES_REQUESTED"
          - "MessageVariant.revision_round incremented by 1"
          - "MessageVariant.reviewed_by_user_id := X-User-ID of this request"
          - "increments MessageVariant.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /advocacy/message-variants/{variant_id}/review-decisions with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "MessageVariant.status == IN_REVIEW"
          - "X-User-ID != MessageVariant.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "MessageVariant.status := APPROVED"
          - "MessageVariant.reviewed_by_user_id := X-User-ID of this request"
          - "increments MessageVariant.version by 1"
      - from: APPROVED
        to: LOCKED
        trigger: "POST /advocacy/message-variants/{variant_id}/lock"
        actor: MessageStrategist
        preconditions:
          - "MessageVariant.status == APPROVED"
          - "MessageVariant.endorsement_count >= MessageVariant.required_endorsement_quorum, else ERR_ENDORSEMENT_QUORUM_NOT_MET"
        side_effects:
          - "MessageVariant.status := LOCKED (message discipline is now enforced: the copy may not be edited and activations may be cleared against it)"
          - "increments MessageVariant.version by 1"
      - from: LOCKED
        to: CHANGES_REQUESTED
        trigger: "POST /advocacy/message-variants/{variant_id}/reopen, or system: endorsement_count drops below required_endorsement_quorum"
        actor: MessageStrategist | system
        preconditions:
          - "MessageVariant.status == LOCKED"
          - "MessageVariant.revision_round <= MAX_REVISION_ROUNDS for the operator-triggered form, else ERR_REVISION_LIMIT_REACHED"
          - "no Activation carrying this variant has delivery_state == SENDING for the operator-triggered form, else ERR_ACTIVATION_IN_FLIGHT"
        side_effects:
          - "MessageVariant.status := CHANGES_REQUESTED; revision_round incremented by 1"
          - "CASCADE hop 1: because the variant left LOCKED, every Activation carrying it with delivery_state == SCHEDULED and approval_state IN {PENDING, CLEARED} gets approval_state := BLOCKED"
          - "CASCADE hop 2: because those waves became BLOCKED, Campaign.blocked_activation_count is recomputed and calculation campaign_posture re-runs"
          - "increments MessageVariant.version by 1"
      - from: APPROVED
        to: RETIRED
        trigger: "system: POST /advocacy/campaigns/{campaign_id}/message-test-resolutions selects a different variant in the same test_cell"
        actor: system
        preconditions:
          - "MessageVariant.status == APPROVED"
          - "MessageVariant.test_cell == the resolved cell AND MessageVariant.id != the winner id"
        side_effects:
          - "MessageVariant.status := RETIRED; test_winner := false"
          - "CASCADE hop 1: because the variant retired, every Activation carrying it with delivery_state == SCHEDULED gets approval_state := BLOCKED"
          - "CASCADE hop 2: because those waves became BLOCKED, Campaign.blocked_activation_count is recomputed and calculation campaign_posture re-runs"
          - "increments MessageVariant.version by 1"
        note: "RETIRED is terminal: a retired loser can never be resubmitted, relocked or endorsed again."
      - from: LOCKED
        to: RETIRED
        trigger: "system: POST /advocacy/campaigns/{campaign_id}/message-test-resolutions selects a different variant in the same test_cell"
        actor: system
        preconditions:
          - "MessageVariant.status == LOCKED"
          - "MessageVariant.test_cell == the resolved cell AND MessageVariant.id != the winner id"
        side_effects:
          - "MessageVariant.status := RETIRED; test_winner := false"
          - "CASCADE hop 1: because the variant retired, every Activation carrying it with delivery_state == SCHEDULED gets approval_state := BLOCKED"
          - "CASCADE hop 2: because those waves became BLOCKED, Campaign.blocked_activation_count is recomputed and calculation campaign_posture re-runs"
          - "increments MessageVariant.version by 1"
        note: "Message discipline retires the losing copy even when it was locked and already in market - the whole point of resolving a test is that only the winner keeps running; its ACTIVE endorsements are left intact for the audit trail."

  - entity: Activation
    dimension: approval_state
    initial_state: PENDING
    terminal_states: []
    shape: cyclic
    note: "approval_state and delivery_state are two independent dimensions on the same Activation row; each advances on its own triggers and neither is derivable from the other."
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /advocacy/activations/{activation_id}/clear"
        actor: ComplianceOfficer
        preconditions:
          - "Activation.approval_state == PENDING"
          - "Activation.delivery_state == SCHEDULED, else ERR_INVALID_STATE_TRANSITION"
          - "Campaign.posture != FROZEN, else ERR_CAMPAIGN_FROZEN"
          - "Campaign.posture != RESTRICTED when Activation.channel IN {SMS, PHONE}, else ERR_CAMPAIGN_RESTRICTED"
          - "MessageVariant.status == LOCKED, else ERR_VARIANT_NOT_LOCKED"
          - "Activation.window does not intersect any RECESS Milestone window of the campaign, else ERR_BLACKOUT_WINDOW"
          - "Activation.projected_reach >= Activation.min_viable_reach, else ERR_REACH_BELOW_MINIMUM"
        side_effects:
          - "Activation.approval_state := CLEARED"
          - "increments Activation.version by 1"
      - from: BLOCKED
        to: CLEARED
        trigger: "POST /advocacy/activations/{activation_id}/clear (re-clearance after remediation)"
        actor: ComplianceOfficer
        preconditions:
          - "Activation.approval_state == BLOCKED"
          - "Activation.delivery_state == SCHEDULED"
          - "every precondition of the PENDING -> CLEARED edge holds again"
        side_effects:
          - "Activation.approval_state := CLEARED"
          - "Campaign.blocked_activation_count decremented by 1; calculation campaign_posture re-runs (RESTRICTED may fall back to OPEN)"
          - "increments Activation.version by 1"
        note: "This is the cyclic edge on the approval dimension: CLEARED -> BLOCKED -> CLEARED is reachable within one wave's life."
      - from: PENDING
        to: BLOCKED
        trigger: "system: cascade from consent revocation, segment shrinkage, milestone reschedule, variant reopen/retire or partner withdrawal"
        actor: system
        preconditions:
          - "Activation.delivery_state == SCHEDULED"
          - "the recomputed projected_reach < min_viable_reach, OR the variant left LOCKED, OR the window now intersects a RECESS milestone window"
        side_effects:
          - "Activation.approval_state := BLOCKED"
          - "Campaign.blocked_activation_count incremented by 1; calculation campaign_posture re-runs"
          - "increments Activation.version by 1"
      - from: CLEARED
        to: BLOCKED
        trigger: "system: same cascade set as PENDING -> BLOCKED"
        actor: system
        preconditions:
          - "Activation.delivery_state == SCHEDULED"
          - "the recomputed projected_reach < min_viable_reach, OR the variant left LOCKED, OR the window now intersects a RECESS milestone window"
        side_effects:
          - "Activation.approval_state := BLOCKED (a cleared wave loses its clearance retroactively)"
          - "Campaign.blocked_activation_count incremented by 1; calculation campaign_posture re-runs"
          - "increments Activation.version by 1"

  - entity: Activation
    dimension: delivery_state
    initial_state: SCHEDULED
    terminal_states: [SENT, PARTIAL, ABORTED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: SENDING
        trigger: "POST /advocacy/activations/{activation_id}/start-send"
        actor: CampaignDirector | FieldOrganizer
        preconditions:
          - "Activation.delivery_state == SCHEDULED"
          - "Activation.approval_state == CLEARED, else ERR_INVALID_STATE_TRANSITION"
          - "Campaign.posture != FROZEN, else ERR_CAMPAIGN_FROZEN"
          - "Campaign.posture != RESTRICTED when Activation.channel IN {SMS, PHONE}, else ERR_CAMPAIGN_RESTRICTED"
          - "window_start <= current_utc <= window_end, else ERR_OUTSIDE_SEND_WINDOW"
        side_effects:
          - "Activation.delivery_state := SENDING"
          - "target_supporter_ids is frozen: cascades no longer recompute it (only SCHEDULED waves recompute)"
          - "increments Activation.version by 1"
      - from: SENDING
        to: SENT
        trigger: "POST /advocacy/activations/{activation_id}/complete with bounced_count 0 and delivered_count equal to the target count"
        actor: CampaignDirector | FieldOrganizer
        preconditions:
          - "Activation.delivery_state == SENDING"
          - "delivered_count + bounced_count == length(target_supporter_ids), else ERR_DELIVERY_TALLY_MISMATCH"
          - "bounced_count == 0 AND delivered_count == length(target_supporter_ids)"
        side_effects:
          - "Activation.delivery_state := SENT"
          - "Activation.realized_reach := chronological variant of calculation activation_reach (delivered supporters whose channel consent is still GRANTED and who are not suppressed at completion)"
          - "Activation.suppressed_by_consent_count := delivered_count - realized_reach"
          - "Activation.send_cost_cents := CHANNEL_UNIT_COST_CENTS[channel] * delivered_count"
          - "for each of the first delivered_count supporters of target_supporter_ids (created_at ASC): touches_consumed incremented by 1 and touches_reserved decremented by 1"
          - "for the remaining target supporters: touches_reserved decremented by 1 with no consumption"
          - "Segment.active_activation_count decremented by 1 (bumps Segment.version)"
          - "recompute MessageVariant.realized_reach_total, send_cost_total_cents, response_rate_bps and cost_per_action_cents"
          - "increments Activation.version by 1"
      - from: SENDING
        to: PARTIAL
        trigger: "POST /advocacy/activations/{activation_id}/complete with bounced_count > 0 or delivered_count below the target count"
        actor: CampaignDirector | FieldOrganizer
        preconditions:
          - "Activation.delivery_state == SENDING"
          - "delivered_count + bounced_count == length(target_supporter_ids), else ERR_DELIVERY_TALLY_MISMATCH"
          - "bounced_count > 0 OR delivered_count < length(target_supporter_ids)"
        side_effects:
          - "Activation.delivery_state := PARTIAL"
          - "same ledger, cost, realized_reach and variant-metric side effects as SENDING -> SENT"
          - "increments Activation.version by 1"
        note: "delivered_count == 0 with bounced_count == length(target_supporter_ids) is the zero-delivery boundary: PARTIAL, realized_reach 0, send_cost_cents 0."
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /advocacy/activations/{activation_id}/abort"
        actor: CampaignDirector | ComplianceOfficer
        preconditions:
          - "Activation.delivery_state == SCHEDULED"
        side_effects:
          - "Activation.delivery_state := ABORTED; abort_reason stored"
          - "every supporter in target_supporter_ids has touches_reserved decremented by 1 (compensating action of the create-time reservation)"
          - "Segment.active_activation_count decremented by 1 (bumps Segment.version)"
          - "if approval_state == BLOCKED, Campaign.blocked_activation_count decremented by 1 and calculation campaign_posture re-runs"
          - "increments Activation.version by 1"
      - from: SENDING
        to: ABORTED
        trigger: "POST /advocacy/activations/{activation_id}/abort"
        actor: CampaignDirector | ComplianceOfficer
        preconditions:
          - "Activation.delivery_state == SENDING"
        side_effects:
          - "Activation.delivery_state := ABORTED; abort_reason stored"
          - "CASCADE hop 1: every supporter in target_supporter_ids has touches_reserved decremented by 1, restoring the touch ledger to its pre-create value"
          - "CASCADE hop 2: because the wave became ABORTED, every ActionRecord with activation_id == this activation and status IN {RECORDED, MATCHED, ACKNOWLEDGED} := VOIDED; records already in THANKED are left untouched (conditional cascade)"
          - "CASCADE hop 3: because those action records became VOIDED, each referenced Legislator has constituent_action_count and contact_pressure_score recomputed by calculation district_pressure_index"
          - "CASCADE hop 4: because a recomputed contact_pressure_score fell below PRESSURE_TIER_PRIMARY_MIN, that Legislator's priority_tier is downgraded"
          - "CASCADE hop 5: because a legislator left PRIMARY, Campaign.opposed_priority_legislator_count is recomputed and calculation campaign_posture re-runs"
          - "Segment.active_activation_count decremented by 1 (bumps Segment.version)"
          - "recompute engagement_score and retention_score for every supporter whose action records were voided"
          - "increments Activation.version by 1"
        note: "This is the deepest compensating cascade in the scaffold and the observable proof of invariant touch_reservation_conservation."

  - entity: ActionRecord
    dimension: status
    initial_state: RECORDED
    terminal_states: [UNMATCHED, THANKED, VOIDED]
    shape: branching_with_cycle
    transitions:
      - from: RECORDED
        to: MATCHED
        trigger: "system: district-matching selector inside POST /advocacy/action-records finds a legislator"
        actor: system
        preconditions:
          - "at least one Legislator has campaign_id == Supporter.campaign_id AND district_code == Supporter.district_code"
        side_effects:
          - "ActionRecord.status := MATCHED; legislator_id := selector winner (see calculation legislator_match_selector)"
          - "ActionRecord.pressure_multiplier := milestone multiplier snapshot"
          - "Legislator.constituent_action_count incremented by 1; contact_pressure_score and priority_tier recomputed"
          - "Supporter.action_count incremented by 1; engagement_score and retention_score recomputed"
          - "Campaign.total_actions_logged, distinct_acting_supporter_count and opposed_priority_legislator_count recomputed; calculation campaign_posture re-runs"
      - from: RECORDED
        to: UNMATCHED
        trigger: "system: district-matching selector inside POST /advocacy/action-records finds no legislator (empty candidate pool)"
        actor: system
        preconditions:
          - "no Legislator has campaign_id == Supporter.campaign_id AND district_code == Supporter.district_code"
        side_effects:
          - "ActionRecord.status := UNMATCHED; legislator_id stays null"
          - "no pressure, engagement or campaign counter changes (an unmatched action is recorded for audit only)"
        note: "Empty-pool fallback of the selector: the request still returns 201, the record is terminal UNMATCHED."
      - from: MATCHED
        to: ACKNOWLEDGED
        trigger: "POST /advocacy/action-records/{action_record_id}/acknowledge"
        actor: FieldOrganizer
        preconditions:
          - "ActionRecord.status == MATCHED"
          - "Campaign.posture != FROZEN, else ERR_CAMPAIGN_FROZEN"
        side_effects:
          - "ActionRecord.status := ACKNOWLEDGED; acknowledged_at := current_utc"
          - "increments ActionRecord.version by 1"
      - from: ACKNOWLEDGED
        to: THANKED
        trigger: "POST /advocacy/action-records/{action_record_id}/thank"
        actor: FieldOrganizer
        preconditions:
          - "ActionRecord.status == ACKNOWLEDGED, else ERR_INVALID_STATE_TRANSITION"
          - "Campaign.posture != FROZEN, else ERR_CAMPAIGN_FROZEN"
          - "Supporter.suppressed == false, else ERR_SUPPORTER_SUPPRESSED"
          - "the supporter's consent state for thank_channel == GRANTED, else ERR_CONSENT_MISSING"
          - "Supporter.touches_consumed + Supporter.touches_reserved < BASE_TOUCH_CAP_PER_SUPPORTER, else ERR_FREQUENCY_CAP_EXHAUSTED"
        side_effects:
          - "ActionRecord.status := THANKED; thank_channel and thanked_at stored"
          - "Supporter.touches_consumed incremented by 1 (a thank-you is a governed touch, consumed without a prior reservation)"
          - "Supporter.thanked_count incremented by 1; retention_score recomputed (engagement_score is unchanged because the thank-you is not a constituent action)"
          - "increments ActionRecord.version by 1"
      - from: MATCHED
        to: DISPUTED
        trigger: "POST /advocacy/action-records/{action_record_id}/dispute"
        actor: FieldOrganizer
        preconditions:
          - "ActionRecord.status == MATCHED"
        side_effects:
          - "ActionRecord.status := DISPUTED; dispute_reason stored"
          - "the record leaves the pressure input set: Legislator.constituent_action_count and contact_pressure_score recomputed, priority_tier re-derived"
          - "Supporter.action_count, engagement_score and retention_score recomputed"
          - "Campaign counters recomputed; calculation campaign_posture re-runs"
          - "increments ActionRecord.version by 1"
      - from: ACKNOWLEDGED
        to: DISPUTED
        trigger: "POST /advocacy/action-records/{action_record_id}/dispute"
        actor: FieldOrganizer
        preconditions:
          - "ActionRecord.status == ACKNOWLEDGED"
        side_effects:
          - "identical to the MATCHED -> DISPUTED edge; acknowledged_at is preserved"
          - "increments ActionRecord.version by 1"
      - from: DISPUTED
        to: MATCHED
        trigger: "POST /advocacy/action-records/{action_record_id}/dispute-resolutions with outcome REINSTATED"
        actor: ComplianceOfficer
        preconditions:
          - "ActionRecord.status == DISPUTED"
        side_effects:
          - "ActionRecord.status := MATCHED (the cycle closes; acknowledged_at, if any, is preserved but the record returns to MATCHED)"
          - "the record re-enters the pressure input set: Legislator counters and contact_pressure_score recomputed to exactly their pre-dispute values, priority_tier re-derived"
          - "Supporter.action_count, engagement_score and retention_score recomputed"
          - "increments ActionRecord.version by 1"
        note: "MATCHED -> DISPUTED -> MATCHED is the cycle; the invariant pressure_score_conservation says the round trip leaves contact_pressure_score bit-identical."
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /advocacy/action-records/{action_record_id}/dispute-resolutions with outcome VOIDED"
        actor: ComplianceOfficer
        preconditions:
          - "ActionRecord.status == DISPUTED"
        side_effects:
          - "ActionRecord.status := VOIDED (terminal)"
          - "Legislator, Supporter and Campaign counters recomputed with the record permanently excluded"
          - "increments ActionRecord.version by 1"
      - from: MATCHED
        to: VOIDED
        trigger: "system: cascade hop 2 of an activation abort or campaign close"
        actor: system
        preconditions:
          - "the parent Activation just became ABORTED"
        side_effects:
          - "ActionRecord.status := VOIDED"
          - "Legislator, Supporter and Campaign counters recomputed"
      - from: ACKNOWLEDGED
        to: VOIDED
        trigger: "system: cascade hop 2 of an activation abort or campaign close"
        actor: system
        preconditions:
          - "the parent Activation just became ABORTED"
        side_effects:
          - "ActionRecord.status := VOIDED"
          - "Legislator, Supporter and Campaign counters recomputed"

  - entity: DistrictMeeting
    dimension: status
    initial_state: REQUESTED
    terminal_states: [DECLINED, HELD, NO_SHOW]
    shape: branching
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /advocacy/district-meetings/{meeting_id}/response with decision CONFIRM"
        actor: FieldOrganizer
        preconditions:
          - "DistrictMeeting.status == REQUESTED"
          - "Spokesperson.training_state == CERTIFIED for lead_spokesperson_id, else ERR_SPOKESPERSON_NOT_CERTIFIED"
          - "Campaign.status == ACTIVE, else ERR_CAMPAIGN_NOT_ACTIVE"
        side_effects:
          - "DistrictMeeting.status := CONFIRMED"
          - "increments DistrictMeeting.version by 1"
        note: "Cross-entity guard: the meeting cannot be confirmed on an untrained spokesperson even though the request was accepted while the profile was still TRAINED."
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /advocacy/district-meetings/{meeting_id}/response with decision DECLINE"
        actor: FieldOrganizer
        preconditions:
          - "DistrictMeeting.status == REQUESTED"
        side_effects:
          - "DistrictMeeting.status := DECLINED; decline_reason stored"
          - "the legislator's calendar interval is released, so a later meeting may occupy the window (DECLINED rows leave the overlap input set)"
          - "increments DistrictMeeting.version by 1"
      - from: CONFIRMED
        to: HELD
        trigger: "POST /advocacy/district-meetings/{meeting_id}/complete with attendee_count >= 1"
        actor: FieldOrganizer
        preconditions:
          - "DistrictMeeting.status == CONFIRMED"
          - "current_utc >= window_end, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "DistrictMeeting.status := HELD; attendee_count stored; pressure_credit := MEETING_PRESSURE_CREDIT"
          - "Legislator.meeting_held_count incremented by 1; contact_pressure_score and priority_tier recomputed by calculation district_pressure_index"
          - "Campaign.opposed_priority_legislator_count recomputed; calculation campaign_posture re-runs"
          - "the lead spokesperson's Supporter.retention_score recomputed (meeting-lead bonus applies to the campaign_final variant only)"
          - "increments DistrictMeeting.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /advocacy/district-meetings/{meeting_id}/complete with attendee_count == 0"
        actor: FieldOrganizer
        preconditions:
          - "DistrictMeeting.status == CONFIRMED"
          - "current_utc >= window_end"
        side_effects:
          - "DistrictMeeting.status := NO_SHOW; attendee_count := 0; pressure_credit stays 0.00"
          - "no legislator or supporter counters change"
          - "increments DistrictMeeting.version by 1"
        note: "attendee_count == 0 versus == 1 is the zero-quantity boundary on this endpoint."

  - entity: CoalitionPartner
    dimension: status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    shape: linear
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /advocacy/coalition-partners/{partner_id}/withdraw"
        actor: CampaignDirector
        preconditions:
          - "CoalitionPartner.status == ACTIVE"
        side_effects:
          - "CoalitionPartner.status := WITHDRAWN; committed_cents := 0"
          - "calculation coalition_cost_share re-runs over the remaining ACTIVE partners so Campaign.committed_share_total_cents still equals Campaign.funded_total_cents (invariant coalition_funding_conservation)"
          - "CASCADE hop 1: every PartnerEndorsement of this partner with status == ACTIVE := REVOKED with revoked_reason 'PARTNER_WITHDRAWN'"
          - "CASCADE hop 2: because those endorsements were revoked, each affected MessageVariant has endorsement_count decremented and required_endorsement_quorum recomputed by calculation endorsement_quorum"
          - "CASCADE hop 3: because endorsement_count fell below required_endorsement_quorum on a LOCKED variant, that variant transitions LOCKED -> CHANGES_REQUESTED"
          - "CASCADE hop 4: because the variant left LOCKED, its SCHEDULED activations get approval_state := BLOCKED"
          - "CASCADE hop 5: because waves became BLOCKED, Campaign.blocked_activation_count is recomputed and calculation campaign_posture re-runs"
          - "increments CoalitionPartner.version by 1"

  - entity: PartnerEndorsement
    dimension: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    shape: linear
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /advocacy/partner-endorsements/{endorsement_id}/revoke, or system: cascade hop 1 of a partner withdrawal"
        actor: PartnerDelegate | system
        preconditions:
          - "PartnerEndorsement.status == ACTIVE"
          - "for the operator-triggered form, X-User-ID == PartnerEndorsement.partner_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "PartnerEndorsement.status := REVOKED; revoked_reason stored"
          - "CoalitionPartner.active_endorsement_count decremented by 1"
          - "CASCADE hop 1: MessageVariant.endorsement_count decremented by 1 (bumps MessageVariant.version)"
          - "CASCADE hop 2: because endorsement_count fell below required_endorsement_quorum while the variant was LOCKED, the variant transitions LOCKED -> CHANGES_REQUESTED"
          - "CASCADE hop 3: because the variant left LOCKED, every Activation carrying it with delivery_state == SCHEDULED gets approval_state := BLOCKED"
          - "CASCADE hop 4: because waves became BLOCKED, Campaign.blocked_activation_count is recomputed and calculation campaign_posture re-runs"
          - "increments PartnerEndorsement.version by 1"

  - entity: Spokesperson
    dimension: training_state
    initial_state: UNTRAINED
    terminal_states: []
    shape: linear
    transitions:
      - from: UNTRAINED
        to: TRAINED
        trigger: "POST /advocacy/spokespersons/{spokesperson_id}/training-advancements with to_level TRAINED"
        actor: FieldOrganizer
        preconditions:
          - "Spokesperson.training_state == UNTRAINED, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "Spokesperson.training_state := TRAINED; training_sessions_completed incremented by 1"
          - "Supporter.engagement_score and retention_score recomputed (story bonus rises from 0.0 to 1.0)"
          - "every Segment whose membership predicate the supporter now satisfies or stops satisfying is recomputed (bumping that Segment.version)"
          - "increments Spokesperson.version by 1"
      - from: TRAINED
        to: CERTIFIED
        trigger: "POST /advocacy/spokespersons/{spokesperson_id}/training-advancements with to_level CERTIFIED"
        actor: FieldOrganizer
        preconditions:
          - "Spokesperson.training_state == TRAINED, else ERR_INVALID_STATE_TRANSITION"
          - "Spokesperson.publication_consent == PUBLIC, else ERR_STORY_CONSENT_REQUIRED"
        side_effects:
          - "Spokesperson.training_state := CERTIFIED; training_sessions_completed incremented by 1; media_ready := true"
          - "Supporter.engagement_score and retention_score recomputed (story bonus rises from 1.0 to 3.0)"
          - "every Segment whose membership predicate the supporter now satisfies or stops satisfying is recomputed (bumping that Segment.version)"
          - "increments Spokesperson.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: activation-create-stale-segment
    parent_entity: Segment
    write_endpoint: "POST /advocacy/activations"
    occ_field: "expected_segment_version"
    description: |
      Creating an Activation against a Segment whose version has advanced since the client last
      observed it is rejected with a stale-version error. The product deliberately permits many waves
      on one segment, so a second create is legitimate on its own terms; what the guard catches is
      that the audience snapshot the client sized its wave against (member_supporter_ids,
      member_count, active_activation_count) is no longer the audience the server holds - a supporter
      may have been added, a consent may have been revoked, or another wave may have taken
      reservations that shrink the frequency headroom.
    error_id: ERR_STALE_SEGMENT_VERSION
    http_status: 412

  - rule_id: endorsement-create-stale-variant
    parent_entity: MessageVariant
    write_endpoint: "POST /advocacy/partner-endorsements"
    occ_field: "expected_variant_version"
    description: |
      Endorsing a MessageVariant whose version has advanced since the client last observed it is
      rejected with a stale-version error. Every coalition partner may legitimately endorse the same
      variant, so a later endorsement is a normal product operation; the guard exists because the
      copy under endorsement may have changed (a review decision, a lock, a reopen or another
      partner's endorsement all bump the variant's version), and message discipline requires a
      partner to endorse the exact revision it reviewed - which is why the accepted endorsement pins
      endorsed_variant_version.
    error_id: ERR_STALE_VARIANT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: consent_state_resolution
    trigger: "on POST /advocacy/supporters (initial_consent_channels), on POST /advocacy/consent-events, and whenever a supporter's consent fields are read by another calculation"
    algorithm: projection
    formula: |
      # Replay the append-only ConsentEvent log for one supporter, per channel.
      for channel C in {EMAIL, SMS, PHONE}:
        candidates = [e for e in ConsentEvent
                      if e.supporter_id == supporter.id and e.channel in {C, "ALL"}]
        if candidates is empty:
          state[C] = "NONE"
        else:
          # latest wins; created_at DESC, then sequence_no DESC as the deterministic tie-break
          winner = sort(candidates, key=(created_at DESC, sequence_no DESC))[0]
          state[C] = "GRANTED" if winner.action == "GRANT" else "REVOKED"
      supporter.email_consent_state = state["EMAIL"]
      supporter.sms_consent_state   = state["SMS"]
      supporter.phone_consent_state = state["PHONE"]
      supporter.suppressed = (state["EMAIL"] == "REVOKED"
                              and state["SMS"] == "REVOKED"
                              and state["PHONE"] == "REVOKED")
    input_set: "every ConsentEvent row of the supporter; no status filter exists because the log is append-only and immutable"
    constants: {}
    precision: "exact enum resolution; no arithmetic"
    note: |
      A channel-scoped GRANT recorded after an ALL-scoped REVOKE re-grants that channel only, because
      the per-channel event is the later event for that channel. sequence_no exists because the logical
      clock does not advance between two calls, so created_at alone can tie.

  - name: segment_membership
    trigger: "on POST /advocacy/segments, on POST /advocacy/segments/{segment_id}/refresh, and as cascade hop 2 of any mutation that changes a supporter's consent states, engagement_score, suppressed flag or spokesperson training level"
    algorithm: aggregation
    formula: |
      members = [s for s in Supporter
                 if s.campaign_id == segment.campaign_id
                 and consent_state(s, segment.rule_required_channel) == "GRANTED"
                 and s.suppressed == false
                 and (segment.rule_district_codes == [] or s.district_code in segment.rule_district_codes)
                 and s.engagement_score >= segment.rule_min_engagement_score
                 and (segment.rule_sources == [] or s.acquisition_source in segment.rule_sources)]
      segment.member_supporter_ids = [s.id for s in sort(members, key=created_at ASC)]
      segment.member_count = length(segment.member_supporter_ids)
    input_set: "all Supporter rows of the same campaign; a supporter with consent state NONE or REVOKED on the required channel is excluded, and engagement_score uses the rolling variant (never the retention variant)"
    constants: {}
    precision: "integer count; membership order is created_at ASC with no further tie-break needed because created_at is minted per insertion"
    note: "member_count changing bumps Segment.version, which is exactly what the OCC guard on activation creation observes."

  - name: endorsement_quorum
    trigger: "on POST /advocacy/coalition-partners, on POST /advocacy/coalition-partners/{partner_id}/withdraw, and on every read of a MessageVariant"
    algorithm: threshold
    formula: |
      active_partners = count(CoalitionPartner
                              where campaign_id == variant.campaign_id and status == "ACTIVE")
      variant.required_endorsement_quorum = max(1, ceil(0.5 * active_partners))
    input_set: "CoalitionPartner rows of the same campaign with status == ACTIVE; WITHDRAWN partners are excluded"
    constants:
      QUORUM_FRACTION: 0.5
      QUORUM_FLOOR: 1
    precision: "integer; ceil is applied to the exact product, so 3 active partners require 2 endorsements and 4 active partners require 2"

  - name: coalition_cost_share
    trigger: "on POST /advocacy/coalition-partners and on POST /advocacy/coalition-partners/{partner_id}/withdraw"
    algorithm: waterfall_allocation
    formula: |
      # MODE (b) of the combinatorial rule: the rounding ORDER is pinned, not left to the reader.
      # PINNED: floor each partner line first, then distribute the leftover cents one at a time.
      # REJECTED alternative (do NOT implement): round_half_up each line then sum, which can produce
      # a committed total of 100001 or 99999 against funded_total_cents == 100000.
      actives = sort([p for p in CoalitionPartner
                      if p.campaign_id == campaign.id and p.status == "ACTIVE"],
                     key=created_at ASC)
      W = sum(p.share_weight for p in actives)          # ANCHOR 5, CORE 3, ALLY 1
      if W == 0:
        for p in actives: p.committed_cents = 0
        campaign.committed_share_total_cents = 0
      else:
        for p in actives:
          p.committed_cents = floor(campaign.funded_total_cents * p.share_weight / W)
        remainder = campaign.funded_total_cents - sum(p.committed_cents for p in actives)
        queue = sort(actives, key=(share_weight DESC, created_at ASC))
        i = 0
        while remainder > 0:
          queue[i % length(queue)].committed_cents += 1
          remainder -= 1
          i += 1
        campaign.committed_share_total_cents = sum(p.committed_cents for p in actives)
      for p in CoalitionPartner where status == "WITHDRAWN": p.committed_cents = 0
    input_set: "CoalitionPartner rows of the campaign with status == ACTIVE, ordered by created_at ASC; WITHDRAWN partners are removed from the split and zeroed"
    constants:
      SHARE_WEIGHT_ANCHOR: 5
      SHARE_WEIGHT_CORE: 3
      SHARE_WEIGHT_ALLY: 1
    precision: "integer cents; floor per line then single-cent waterfall, ordered by share_weight DESC then created_at ASC"
    note: |
      Worked example - funded_total_cents 100000 with ANCHOR/CORE/ALLY: floors are 55555 + 33333 +
      11111 = 99999, remainder 1 goes to the ANCHOR (highest share_weight), giving 55556/33333/11111.
      After the ANCHOR withdraws: 75000/25000 with remainder 0. The sum is 100000 both times, which is
      the conserved quantity of invariant coalition_funding_conservation.

  - name: district_pressure_index
    trigger: "on RECORDED -> MATCHED, on any transition into or out of DISPUTED / VOIDED, on DistrictMeeting CONFIRMED -> HELD, and on POST /advocacy/legislators/{legislator_id}/stance-updates"
    algorithm: weighted_scoring
    formula: |
      # MODE (a) of the combinatorial rule: five inputs, two nested caps and a branch on stance.
      counted = [a for a in ActionRecord
                 if a.legislator_id == legislator.id
                 and a.status in {"MATCHED", "ACKNOWLEDGED", "THANKED"}]
      weighted_actions = sum(CHANNEL_PRESSURE_WEIGHT[a.channel] * a.pressure_multiplier
                            for a in counted)                       # unrounded
      action_component  = min(ACTION_PRESSURE_CAP, weighted_actions * ACTION_PRESSURE_FACTOR)
      meeting_component = min(MEETING_PRESSURE_CAP,
                              MEETING_PRESSURE_CREDIT * legislator.meeting_held_count)
      stance_bonus = STANCE_BONUS[legislator.stance]
      legislator.contact_pressure_score = round_half_up(
          min(PRESSURE_SCORE_CEILING, action_component + meeting_component + stance_bonus), 2)
      legislator.priority_tier = ("PRIMARY"   if legislator.contact_pressure_score >= 60.00 else
                                  "SECONDARY" if legislator.contact_pressure_score >= 30.00 else
                                  "MONITOR")
      legislator.constituent_action_count = length(counted)
    input_set: "ActionRecord rows pointing at this legislator with status IN {MATCHED, ACKNOWLEDGED, THANKED}; UNMATCHED, DISPUTED and VOIDED rows are excluded, and DistrictMeeting rows contribute only through meeting_held_count (status == HELD)"
    constants:
      CHANNEL_PRESSURE_WEIGHT: { EMAIL: 1.0, SMS: 1.5, PHONE: 3.0 }
      ACTION_PRESSURE_FACTOR: 2.0
      ACTION_PRESSURE_CAP: 60.0
      MEETING_PRESSURE_CREDIT: 12.0
      MEETING_PRESSURE_CAP: 24.0
      PRESSURE_SCORE_CEILING: 100.0
      STANCE_BONUS: { SUPPORT: 0.0, LEAN_SUPPORT: 10.0, UNDECIDED: 10.0, LEAN_OPPOSE: 4.0, OPPOSE: 0.0 }
      PRESSURE_TIER_PRIMARY_MIN: 60.00
      PRESSURE_TIER_SECONDARY_MIN: 30.00
    precision: "2 decimal places, round_half_up, applied exactly once after both caps and the stance bonus are summed; never round the per-action products"
    note: |
      Worked example - stance UNDECIDED, four PHONE actions stamped with a FLOOR_VOTE multiplier 2.0
      and one EMAIL action stamped 1.0: weighted_actions = 4*3.0*2.0 + 1*1.0*1.0 = 25.0,
      action_component = min(60.0, 50.0) = 50.0, meeting_component = 0.0, stance_bonus = 10.0,
      score = 60.00 exactly -> PRIMARY. Drop the EMAIL action and the score is 58.00 -> SECONDARY.

  - name: milestone_multiplier_snapshot
    trigger: "on POST /advocacy/action-records, before the district-matching selector runs"
    algorithm: threshold
    formula: |
      containing = [m for m in Milestone
                    if m.campaign_id == supporter.campaign_id
                    and m.window_start <= current_utc < m.window_end]     # half-open
      if containing is empty:
        record.pressure_multiplier = 1.0
      else:
        winner = sort(containing, key=(pressure_multiplier DESC, created_at ASC))[0]
        record.pressure_multiplier = winner.pressure_multiplier
    input_set: "Milestone rows of the supporter's campaign whose half-open window contains the logical clock; the snapshot is written once and never recomputed, so a later reschedule does not retroactively rescore existing actions"
    constants:
      MILESTONE_PRESSURE_MULTIPLIER: { COMMITTEE_HEARING: 1.5, FLOOR_VOTE: 2.0, RECESS: 0.5, SIGNING: 1.0 }
      DEFAULT_MULTIPLIER: 1.0
    precision: "one decimal place, taken verbatim from the constant table"

  - name: legislator_match_selector
    trigger: "on POST /advocacy/action-records, immediately after milestone_multiplier_snapshot"
    algorithm: constraint_propagation
    formula: |
      # Selector policy: eligibility filter, ranking expression, tie-break, empty-pool fallback.
      candidates = [l for l in Legislator
                    if l.campaign_id == supporter.campaign_id
                    and l.district_code == supporter.district_code]
      if candidates is empty:
        record.status = "UNMATCHED"; record.legislator_id = null      # empty-pool fallback
      else:
        chamber_rank(l) = 0 if (campaign.target_chamber == "BOTH" and l.chamber == "HOUSE")
                          else 0 if l.chamber == campaign.target_chamber
                          else 1
        winner = sort(candidates, key=(chamber_rank ASC,
                                       contact_pressure_score ASC,
                                       created_at ASC))[0]
        record.status = "MATCHED"; record.legislator_id = winner.id
    input_set: "Legislator rows of the supporter's campaign whose district_code equals the supporter's district_code; no stance or tier filter applies"
    constants:
      BOTH_CHAMBER_PREFERENCE: HOUSE
    precision: "exact id selection; ranking spreads pressure by preferring the lowest current contact_pressure_score, and ties fall back to created_at ASC - never to id"

  - name: frequency_headroom
    trigger: "on POST /advocacy/activations, evaluated before activation_reach"
    algorithm: threshold
    formula: |
      # MODE (c) of the combinatorial rule: the dependency looks circular because the surge grant
      # reads Campaign.posture while this very request may change Campaign.posture through the
      # blocked/reach cascade. The evaluation ORDER is therefore pinned and NOT re-entered:
      #   step 1: posture_at_evaluation = Campaign.posture as persisted BEFORE this request
      #   step 2: surge_grant =
      #             2 if (milestone_id is not null
      #                   and milestone.kind in {"COMMITTEE_HEARING", "FLOOR_VOTE"}
      #                   and milestone.window_start <= activation.window_start
      #                   and activation.window_end <= milestone.window_end
      #                   and posture_at_evaluation == "OPEN")
      #             1 if (the same milestone conditions hold and posture_at_evaluation == "RESTRICTED")
      #             0 otherwise
      #   step 3: effective_touch_cap = BASE_TOUCH_CAP_PER_SUPPORTER + surge_grant
      #   step 4: activation_reach runs against effective_touch_cap and writes projected_reach
      #   step 5: only now is Campaign.posture recomputed; step 2 is never re-evaluated with the
      #           new posture, and effective_touch_cap is persisted as the audit snapshot
      activation.effective_touch_cap = BASE_TOUCH_CAP_PER_SUPPORTER + surge_grant
    input_set: "the persisted Campaign.posture prior to this request, plus the bound Milestone when milestone_id is supplied; a milestone whose window does not fully contain the send window grants nothing"
    constants:
      BASE_TOUCH_CAP_PER_SUPPORTER: 3
      SURGE_GRANT_OPEN: 2
      SURGE_GRANT_RESTRICTED: 1
      SURGE_GRANT_NONE: 0
    precision: "integer cap"

  - name: activation_reach
    trigger: "on POST /advocacy/activations (projected variant), as cascade hop 3 of any segment-membership change while delivery_state == SCHEDULED (projected variant), and on POST /advocacy/activations/{activation_id}/complete (realized variant)"
    algorithm: forward_looking
    formula: |
      # PROJECTED (forward-looking): who the wave may touch given consent AND frequency headroom.
      eligible = [s for s in segment.member_supporter_ids (resolved to Supporter rows, created_at ASC)
                  if consent_state(s, activation.channel) == "GRANTED"
                  and s.suppressed == false
                  and (s.touches_consumed + s.touches_reserved) < activation.effective_touch_cap]
      activation.target_supporter_ids = [s.id for s in eligible]
      activation.projected_reach = length(eligible)
      # each newly targeted supporter takes one reservation:
      for s in eligible: s.touches_reserved += 1
    input_set: "the segment's member_supporter_ids snapshot at evaluation time, filtered by channel consent, the suppressed flag and the strict frequency headroom comparison (< effective_touch_cap, never <=)"
    constants:
      CHANNEL_UNIT_COST_CENTS: { EMAIL: 2, SMS: 15, PHONE: 60 }
    precision: "integer counts; ordering by Supporter.created_at ASC fixes which supporters the vendor tally applies to"
    variants:
      - name: projected_reach_forward_looking
        when: "at creation, and on every recompute while delivery_state == SCHEDULED"
        difference: "counts supporters who MAY be touched: consent as of now plus remaining frequency headroom under effective_touch_cap, including the surge grant. Reservations are taken here."
      - name: realized_reach_chronological
        when: "at POST /advocacy/activations/{activation_id}/complete"
        difference: |
          Replays the delivery tally in target order and counts only touches that both landed and are
          still lawful at completion:
            delivered_set = first delivered_count entries of target_supporter_ids (created_at ASC)
            realized_reach = count(s in delivered_set
                                   where consent_state(s, channel) == "GRANTED" and s.suppressed == false)
            suppressed_by_consent_count = delivered_count - realized_reach
            send_cost_cents = CHANNEL_UNIT_COST_CENTS[channel] * delivered_count
          Identical wave data therefore yields projected_reach 4 and realized_reach 3 when one targeted
          supporter revokes the channel between start-send and completion: the vendor still billed the
          touch (send_cost_cents uses delivered_count) but the wave did not lawfully reach that person.

  - name: supporter_value_score
    trigger: "engagement variant on every ActionRecord status change, DistrictMeeting CONFIRMED -> HELD and ConsentEvent append; retention variant on POST /advocacy/campaigns/{campaign_id}/close"
    algorithm: decay_function
    formula: |
      base = SOURCE_BONUS[supporter.acquisition_source]
      for a in ActionRecord where a.supporter_id == supporter.id
                              and a.status in {"MATCHED", "ACKNOWLEDGED", "THANKED"}:
        age_days = floor((current_utc - a.created_at) / 86400)
        decay    = 1.00 if age_days <= 7 else (0.75 if age_days <= 30 else 0.50)
        base += CHANNEL_PRESSURE_WEIGHT[a.channel] * decay          # engagement variant only
      story = STORY_BONUS[highest Spokesperson.training_state of this supporter, else NONE]
      supporter.engagement_score = round_half_up(min(ENGAGEMENT_CAP, base + story), 2)
    input_set: "ActionRecord rows of this supporter with status IN {MATCHED, ACKNOWLEDGED, THANKED}; DISPUTED, VOIDED and UNMATCHED rows contribute nothing, and the age is measured against the logical clock at evaluation time"
    constants:
      SOURCE_BONUS: { PETITION: 1.0, EVENT: 2.0, DIGITAL_AD: 0.5, REFERRAL: 1.5 }
      CHANNEL_PRESSURE_WEIGHT: { EMAIL: 1.0, SMS: 1.5, PHONE: 3.0 }
      DECAY_FRESH_MAX_DAYS: 7
      DECAY_FRESH_FACTOR: 1.00
      DECAY_MID_MAX_DAYS: 30
      DECAY_MID_FACTOR: 0.75
      DECAY_STALE_FACTOR: 0.50
      STORY_BONUS: { NONE: 0.0, UNTRAINED: 0.0, TRAINED: 1.0, CERTIFIED: 3.0 }
      THANK_BONUS: 2.0
      MEETING_LEAD_BONUS: 5.0
      ENGAGEMENT_CAP: 50.0
      RETENTION_CAP: 80.0
    precision: "2 decimal places, round_half_up, applied once after the cap; the decay factor is selected by an integer day count so an action aged 7 days keeps factor 1.00 and one aged 8 days drops to 0.75"
    variants:
      - name: engagement_score_rolling
        when: "continuously, while the campaign is ACTIVE; this is the variant segment_membership filters on"
        difference: "Applies the age decay against the current logical clock and caps at ENGAGEMENT_CAP 50.0. Thank-you loops and meeting leadership contribute nothing, so the score reflects only recent contactability."
      - name: retention_score_final
        when: "once, at campaign close, written to Supporter.retention_score"
        difference: |
          Drops the decay entirely (every action counts at factor 1.00), adds THANK_BONUS 2.0 for each
          ActionRecord in status THANKED and MEETING_LEAD_BONUS 5.0 for each DistrictMeeting in status
          HELD whose lead_spokesperson_id resolves to a Spokesperson profile of this supporter, and caps at RETENTION_CAP 80.0.
          Worked example - an EVENT-sourced supporter with one PHONE and one EMAIL action, both aged
          46 days, no story training, no thanks, no meetings: engagement = 2.0 + 3.0*0.50 + 1.0*0.50 =
          4.00 while retention = 2.0 + 3.0 + 1.0 = 6.00. Same rows, different answer.

  - name: variant_test_metrics
    trigger: "on POST /advocacy/activations/{activation_id}/complete and on POST /advocacy/campaigns/{campaign_id}/message-test-resolutions"
    algorithm: aggregation
    formula: |
      waves = [a for a in Activation
               if a.message_variant_id == variant.id and a.delivery_state in {"SENT", "PARTIAL"}]
      variant.realized_reach_total = sum(a.realized_reach for a in waves)
      variant.send_cost_total_cents = sum(a.send_cost_cents for a in waves)
      variant.attributed_action_count = count(ActionRecord
              where activation_id in [a.id for a in waves]
              and status in {"MATCHED", "ACKNOWLEDGED", "THANKED"})
      variant.response_rate_bps = (0 if variant.realized_reach_total == 0
                                   else round_half_up(10000 * variant.attributed_action_count
                                                      / variant.realized_reach_total, 0))
      variant.cost_per_action_cents = (NO_ACTION_CPA_SENTINEL_CENTS
                                       if variant.attributed_action_count == 0
                                       else floor(variant.send_cost_total_cents
                                                  / variant.attributed_action_count))
    input_set: "Activation rows of this variant with delivery_state IN {SENT, PARTIAL}; SCHEDULED, SENDING and ABORTED waves are excluded, and attributed actions exclude DISPUTED / VOIDED / UNMATCHED rows"
    constants:
      BPS_SCALE: 10000
      NO_ACTION_CPA_SENTINEL_CENTS: 999999
      MIN_TEST_REACH: 3
    precision: "response_rate_bps is an integer basis-point value rounded half-up; cost_per_action_cents floors (never rounds), and the sentinel 999999 replaces the undefined divide-by-zero rather than null"
    note: |
      Zero-quantity boundary: a completed wave with delivered_count 0 contributes reach 0 and cost 0,
      so response_rate_bps stays 0 and cost_per_action_cents is the sentinel - the operation still
      succeeds and no division is attempted. A variant with realized_reach_total below MIN_TEST_REACH 3
      cannot win a message-test resolution (ERR_REACH_BELOW_MINIMUM).

  - name: campaign_posture
    trigger: "as the last hop of every mutation that changes Activation.approval_state, Legislator.priority_tier, Legislator.stance, Campaign.status or Campaign.posture_override"
    algorithm: threshold
    formula: |
      # Evaluated in this exact order; the first matching branch wins.
      campaign.blocked_activation_count = count(Activation where campaign_id == campaign.id
                                                and approval_state == "BLOCKED")
      campaign.opposed_priority_legislator_count = count(Legislator where campaign_id == campaign.id
                                                and priority_tier == "PRIMARY"
                                                and stance in {"LEAN_OPPOSE", "OPPOSE"})
      if campaign.status == "CLOSED":                       posture = "FROZEN"
      elif campaign.posture_override == "FORCE_FROZEN":     posture = "FROZEN"
      elif campaign.posture_override == "FORCE_OPEN":       posture = "OPEN"
      elif campaign.blocked_activation_count >= POSTURE_FROZEN_BLOCKED_MIN:
                                                            posture = "FROZEN"
      elif (campaign.blocked_activation_count >= POSTURE_RESTRICTED_BLOCKED_MIN
            or campaign.opposed_priority_legislator_count >= POSTURE_RESTRICTED_OPPOSED_MIN):
                                                            posture = "RESTRICTED"
      else:                                                 posture = "OPEN"
      campaign.posture = posture
      campaign.total_actions_logged = count(ActionRecord where campaign_id == campaign.id
                                            and status in {"MATCHED","ACKNOWLEDGED","THANKED"})
      campaign.distinct_acting_supporter_count = count(distinct supporter_id over those rows)
    input_set: "all Activation rows of the campaign for the blocked count and all Legislator rows for the opposed-PRIMARY count; the two override branches and the CLOSED branch dominate both counts"
    constants:
      POSTURE_FROZEN_BLOCKED_MIN: 2
      POSTURE_RESTRICTED_BLOCKED_MIN: 1
      POSTURE_RESTRICTED_OPPOSED_MIN: 1
    precision: "enum derivation over integer counts; posture is derived on every write and never accepted as request input"
    note: |
      Because the posture is a pure derivation, aborting the second BLOCKED wave drops the campaign
      from FROZEN back to RESTRICTED with no explicit unfreeze call, and moving the only opposed
      PRIMARY legislator back to UNDECIDED returns it to OPEN. FORCE_OPEN is the one branch that can
      mask real blockers, and it still cannot un-freeze a CLOSED campaign.

  - name: campaign_outcome_analysis
    trigger: "on GET /advocacy/campaigns/{campaign_id}/outcome-report and on POST /advocacy/campaigns/{campaign_id}/close"
    algorithm: aggregation
    formula: |
      supporter_total        = count(Supporter where campaign_id == campaign.id)
      consented_reachable    = count(Supporter where campaign_id == campaign.id and suppressed == false)
      action_total           = count(ActionRecord where campaign_id == campaign.id
                                     and status in {"MATCHED", "ACKNOWLEDGED", "THANKED"})
      thanked_total          = count(ActionRecord where campaign_id == campaign.id and status == "THANKED")
      thank_loop_closure_bps = (0 if action_total == 0
                                else round_half_up(10000 * thanked_total / action_total, 0))
      primary_flip_count     = count(Legislator where campaign_id == campaign.id
                                     and priority_tier == "PRIMARY"
                                     and stance in {"SUPPORT", "LEAN_SUPPORT"})
      retained_supporter_count = count(Supporter where campaign_id == campaign.id
                                       and retention_score >= RETENTION_COHORT_MIN)
      touch_ledger_balanced  = (sum(s.touches_reserved for s in Supporter where campaign_id == campaign.id)
                                == sum(a.projected_reach for a in Activation
                                       where campaign_id == campaign.id
                                       and delivery_state in {"SCHEDULED", "SENDING"}))
      committed_share_total_cents == campaign.funded_total_cents  # reported as coalition_funding_balanced
    input_set: "every Supporter, ActionRecord, Legislator, Activation and CoalitionPartner row of the campaign; ActionRecord rows in UNMATCHED, DISPUTED or VOIDED are excluded from action_total"
    constants:
      BPS_SCALE: 10000
      RETENTION_COHORT_MIN: 10.00
    precision: "integer counts and integer basis points; the two boolean reconciliation flags are exact equality checks over integer ledgers"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (Ordered by Priority)
#
# Domain ordering rationale: this is an advocacy-compliance domain, so the
# ladder is auth -> existence -> request shape -> ownership -> stale-version
# -> campaign gating -> lifecycle -> separation of duties -> CONSENT AND
# LAWFUL BASIS (the regulatory core, and therefore above every scheduling or
# capacity concern) -> temporal windows -> constraint satisfaction ->
# uniqueness -> cross-entity readiness -> scope agreement -> capacity and
# budget last. A single request that violates several rules always returns
# the lowest-numbered priority's error_id.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id in the URL path exists, validated left-to-right in path order"
    error_id: "ERR_CAMPAIGN_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_LEGISLATOR_NOT_FOUND | ERR_SUPPORTER_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_VARIANT_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_ENDORSEMENT_NOT_FOUND | ERR_ACTIVATION_NOT_FOUND | ERR_ACTION_RECORD_NOT_FOUND | ERR_SPOKESPERSON_NOT_FOUND | ERR_MEETING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "every FK supplied in the request body exists, validated in the field order declared by the endpoint's input list"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying a body FK"

  - priority: 5
    category: existence
    check: "request body is well-formed: no unknown fields, all required fields present, enums within their declared value sets, integers non-negative where declared, cents integral and timestamps parseable as ISO-8601 UTC (the ORDER of two parseable window bounds is NOT checked here - that belongs to priority 15, so a well-typed but inverted window reaches ERR_INVALID_WINDOW)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 6
    category: auth
    check: "for entity_backed roles the acting X-User-ID owns the addressed resource: a PartnerDelegate may only act on CoalitionPartner rows whose id equals X-User-ID and on endorsements owned by that partner, and a Supporter may only act on their own ConsentEvent and story rows"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /advocacy/consent-events, POST /advocacy/partner-endorsements, POST /advocacy/partner-endorsements/{endorsement_id}/revoke, POST /advocacy/spokespersons"

  - priority: 7
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_SEGMENT_VERSION | ERR_STALE_VARIANT_VERSION"
    http_status: 412
    applies_to: "POST /advocacy/activations, POST /advocacy/partner-endorsements"

  - priority: 8
    category: state
    check: "the owning Campaign.status is ACTIVE"
    error_id: ERR_CAMPAIGN_NOT_ACTIVE
    http_status: 409
    applies_to: "all write endpoints below Campaign except POST /advocacy/campaigns, POST /advocacy/campaigns/{campaign_id}/launch, POST /advocacy/campaigns/{campaign_id}/close, POST /advocacy/campaigns/{campaign_id}/posture-overrides, POST /advocacy/legislators and POST /advocacy/milestones while the campaign is DRAFT (the target list and the legislative calendar are built before launch, which is also what makes launch reachable at all: launch requires at least one Legislator row); both are still refused once the campaign is CLOSED"

  - priority: 9
    category: business_safety
    check: "the owning Campaign.posture is not FROZEN"
    error_id: ERR_CAMPAIGN_FROZEN
    http_status: 409
    applies_to: "POST /advocacy/activations, POST /advocacy/activations/{activation_id}/clear, POST /advocacy/activations/{activation_id}/start-send, POST /advocacy/action-records, POST /advocacy/action-records/{action_record_id}/thank, POST /advocacy/district-meetings, POST /advocacy/partner-endorsements, POST /advocacy/message-variants/{variant_id}/lock"

  - priority: 10
    category: business_safety
    check: "when the owning Campaign.posture is RESTRICTED, only EMAIL waves remain open: creating, clearing or starting an SMS or PHONE activation is refused while EMAIL waves proceed"
    error_id: ERR_CAMPAIGN_RESTRICTED
    http_status: 409
    applies_to: "POST /advocacy/activations, POST /advocacy/activations/{activation_id}/clear, POST /advocacy/activations/{activation_id}/start-send"

  - priority: 11
    category: state
    check: "the requested transition is declared for the entity's current state in §1.2, including terminal-state lockdown and cycle limits"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 12
    category: business_safety
    check: "segregation of duties on X-User-ID: the MessageStrategist who submitted a variant may not decide its review, the CampaignDirector who created an activation may not clear it, and the FieldOrganizer who filed an ActionRecord may not resolve its dispute"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /advocacy/message-variants/{variant_id}/review-decisions, POST /advocacy/activations/{activation_id}/clear, POST /advocacy/action-records/{action_record_id}/dispute-resolutions"

  - priority: 13
    category: business_safety
    check: "contactability of the target supporter, evaluated strictly in this internal order - (a) Supporter.suppressed == false, else ERR_SUPPORTER_SUPPRESSED, (b) the resolved consent state of the addressed channel is GRANTED, else ERR_CONSENT_MISSING; the addressed channel is ActionRecord.channel on POST /advocacy/action-records, thank_channel on the thank-you touch and EMAIL on POST /advocacy/district-meetings, while the channel-less spokesperson intake requires at least one of EMAIL, SMS or PHONE to be GRANTED"
    error_id: "ERR_CONSENT_MISSING | ERR_SUPPORTER_SUPPRESSED"
    http_status: 422
    applies_to: "POST /advocacy/action-records, POST /advocacy/district-meetings, POST /advocacy/spokespersons"

  - priority: 14
    category: business_safety
    check: "the lawful_basis supplied with a GRANT consent event is one of EXPRESS_WRITTEN, OPT_IN_FORM, EVENT_CARD or VERBAL_RECORDED, and a REVOKE event carries no lawful_basis"
    error_id: ERR_LAWFUL_BASIS_INVALID
    http_status: 422
    applies_to: "POST /advocacy/consent-events, POST /advocacy/supporters"

  - priority: 15
    category: business_temporal
    check: "window_start is strictly before window_end and both are aligned to whole minutes"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /advocacy/milestones, POST /advocacy/milestones/{milestone_id}/reschedule, POST /advocacy/activations, POST /advocacy/district-meetings"

  - priority: 16
    category: business_temporal
    check: "the window falls entirely inside the owning campaign's [start_date, end_date] span"
    error_id: ERR_WINDOW_OUTSIDE_CAMPAIGN
    http_status: 422
    applies_to: "POST /advocacy/milestones, POST /advocacy/milestones/{milestone_id}/reschedule, POST /advocacy/activations, POST /advocacy/district-meetings"

  - priority: 17
    category: business_temporal
    check: "the send window does not intersect any Milestone of kind RECESS belonging to the same campaign (blackout period for outbound waves)"
    error_id: ERR_BLACKOUT_WINDOW
    http_status: 409
    applies_to: "POST /advocacy/activations"

  - priority: 18
    category: business_constraint
    check: "the requested meeting does not collide with another REQUESTED, CONFIRMED or HELD meeting for the same legislator once the 30-minute travel buffer is applied to both sides of the existing interval"
    error_id: ERR_MEETING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /advocacy/district-meetings"

  - priority: 19
    category: business_constraint
    check: "no more than CHANNEL_CONCURRENCY_CAP 2 activations on the same (campaign, channel) hold overlapping closed send windows while in delivery_state SCHEDULED or SENDING"
    error_id: ERR_CHANNEL_WINDOW_SATURATED
    http_status: 409
    applies_to: "POST /advocacy/activations"

  - priority: 20
    category: business_constraint
    check: "uniqueness: at most one ACTIVE endorsement per (partner_id, variant_id) pair and at most one Spokesperson profile per (supporter_id, campaign_id) pair"
    error_id: "ERR_DUPLICATE_ENDORSEMENT | ERR_DUPLICATE_SPOKESPERSON"
    http_status: 409
    applies_to: "POST /advocacy/partner-endorsements, POST /advocacy/spokespersons"

  - priority: 21
    category: business_constraint
    check: "a variant has not exhausted MAX_REVISION_ROUNDS 3: the CHANGES_REQUESTED -> IN_REVIEW resubmission is refused once revision_round has reached 3"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /advocacy/message-variants/{variant_id}/submit"

  - priority: 22
    category: business_referential
    check: "cross-entity readiness of the referenced collaborator: an activation's variant must be LOCKED, a district meeting's spokesperson must be CERTIFIED, a variant lock requires at least required_endorsement_quorum ACTIVE endorsements, and an endorsement create or revoke requires the named CoalitionPartner to still be ACTIVE"
    error_id: "ERR_VARIANT_NOT_LOCKED | ERR_SPOKESPERSON_NOT_CERTIFIED | ERR_ENDORSEMENT_QUORUM_NOT_MET | ERR_PARTNER_WITHDRAWN"
    http_status: 409
    applies_to: "POST /advocacy/activations, POST /advocacy/district-meetings, POST /advocacy/message-variants/{variant_id}/lock, POST /advocacy/partner-endorsements, POST /advocacy/partner-endorsements/{endorsement_id}/revoke"

  - priority: 23
    category: business_referential
    check: "scope agreement between co-referenced rows: all FKs in one request resolve to the same campaign, the activation channel appears in the variant's channel_scope, and a meeting's lead supporter lives in the addressed legislator's district"
    error_id: "ERR_CAMPAIGN_MISMATCH | ERR_CHANNEL_NOT_IN_VARIANT_SCOPE | ERR_DISTRICT_MISMATCH"
    http_status: 422
    applies_to: "POST /advocacy/activations, POST /advocacy/partner-endorsements, POST /advocacy/district-meetings, POST /advocacy/action-records, POST /advocacy/segments"

  - priority: 24
    category: business_fiscal
    check: "capacity and reach floors, evaluated strictly in this internal order - (a) segment member_count == 0 -> ERR_SEGMENT_EMPTY, (b) projected_reach == 0 because every member is at or above effective_touch_cap -> ERR_FREQUENCY_CAP_EXHAUSTED, (c) projected_reach < min_viable_reach -> ERR_REACH_BELOW_MINIMUM, (d) delivered_count > projected_reach at completion -> ERR_DELIVERY_TALLY_MISMATCH"
    error_id: "ERR_SEGMENT_EMPTY | ERR_FREQUENCY_CAP_EXHAUSTED | ERR_REACH_BELOW_MINIMUM | ERR_DELIVERY_TALLY_MISMATCH"
    http_status: 409
    applies_to: "POST /advocacy/activations, POST /advocacy/activations/{activation_id}/complete, POST /advocacy/campaigns/{campaign_id}/message-test-resolutions"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
#
# Thirteen flat collections under /advocacy, plus one logical-clock driver.
# Every list endpoint accepts limit/offset and returns the envelope's
# total_count / has_more. Every FK declared in §1.1 is reverse-reachable
# either through a filtered list or through a campaign/supporter sub-resource.
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock (test-driving endpoint, /_ namespace) ------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit ISO-8601 UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the server reads that default and never falls back to real wall-clock time. Every window, decay bucket and milestone comparison in this domain is evaluated against this clock."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist, PartnerDelegate, Supporter]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects:
      - "recomputes Milestone.status for every milestone (SCHEDULED / IN_WINDOW / PASSED)"
      - "changes the decay bucket used by the engagement variant of supporter_value_score on its next evaluation"

  # --- Campaign ------------------------------------------------------------
  - method: POST
    path: "/advocacy/campaigns"
    description: "Creates a campaign in DRAFT with its goal, target chamber, timeline, success metrics and coalition-funded budget."
    roles: [CampaignDirector]
    code: 201
    input: [name, goal_statement, bill_reference, target_chamber, start_date, end_date, success_metric_target_actions, success_metric_target_supporters, funded_total_cents]
    output: Campaign
    side_effects:
      - "status := DRAFT, posture := OPEN, posture_override := NONE"
      - "all computed counters initialise to 0 and committed_share_total_cents to 0"

  - method: GET
    path: "/advocacy/campaigns/{campaign_id}"
    description: "Reads one campaign with its derived posture, counters and committed coalition total."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist, PartnerDelegate]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/advocacy/campaigns"
    description: "Lists campaigns, optionally filtered by lifecycle status or derived posture."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["status?", "posture?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: POST
    path: "/advocacy/campaigns/{campaign_id}/launch"
    description: "Launches a DRAFT campaign into ACTIVE; requires at least one target legislator."
    roles: [CampaignDirector]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "status DRAFT -> ACTIVE"
      - "recompute posture via calculation campaign_posture"

  - method: POST
    path: "/advocacy/campaigns/{campaign_id}/close"
    description: "Closes an ACTIVE campaign, flushing scheduled waves and finalising retention scores."
    roles: [CampaignDirector]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "status ACTIVE -> CLOSED and posture := FROZEN"
      - "cascade: SCHEDULED activations -> ABORTED, touch reservations released, dependent action records -> VOIDED, legislator pressure recomputed"
      - "REQUESTED district meetings -> DECLINED"
      - "retention_score written for every Supporter (retention_score_final variant)"

  - method: POST
    path: "/advocacy/campaigns/{campaign_id}/posture-overrides"
    description: "Latches or clears the operator posture override (NONE, FORCE_OPEN, FORCE_FROZEN); a CLOSED campaign stays FROZEN regardless."
    roles: [CampaignDirector]
    code: 200
    input: [posture_override, override_reason]
    output: Campaign
    side_effects:
      - "posture_override := requested value"
      - "recompute posture via calculation campaign_posture"

  - method: POST
    path: "/advocacy/campaigns/{campaign_id}/message-test-resolutions"
    description: "Resolves a message test by declaring one variant of a test_cell the winner; the winner must be LOCKED and carry realized reach at or above MIN_TEST_REACH 3."
    roles: [MessageStrategist]
    code: 200
    input: [test_cell, winning_message_variant_id]
    output: MessageVariant
    side_effects:
      - "recompute variant_test_metrics for every variant in the test_cell"
      - "test_winner := true on the winner and false on every other variant of the cell"
      - "losing variants in status APPROVED or LOCKED are RETIRED"

  - method: GET
    path: "/advocacy/campaigns/{campaign_id}/outcome-report"
    description: "Computed read: campaign outcome analysis, retention cohort size, thank-you loop closure and the two ledger reconciliation flags."
    roles: [CampaignDirector, ComplianceOfficer]
    code: 200
    input: []
    output:
      supporter_total: integer
      consented_reachable_total: integer
      action_total: integer
      thanked_total: integer
      thank_loop_closure_bps: integer
      primary_flip_count: integer
      retained_supporter_count: integer
      committed_share_total_cents: integer
      funded_total_cents: integer
      coalition_funding_balanced: boolean
      touch_reservation_total: integer
      open_wave_projected_reach_total: integer
      touch_ledger_balanced: boolean
    side_effects: []

  - method: GET
    path: "/advocacy/campaigns/{campaign_id}/milestones"
    description: "Reverse-reachability read: the legislative-calendar milestones of one campaign, with each milestone's clock-relative status."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []

  - method: GET
    path: "/advocacy/campaigns/{campaign_id}/coalition-partners"
    description: "Reverse-reachability read: the coalition partners of one campaign with their derived share weights and committed cents."
    roles: [CampaignDirector, ComplianceOfficer, MessageStrategist, PartnerDelegate]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CoalitionPartner[]
    side_effects: []

  # --- Milestone -----------------------------------------------------------
  - method: POST
    path: "/advocacy/milestones"
    description: "Adds a legislative-calendar milestone to a campaign; RECESS milestones become blackout windows."
    roles: [CampaignDirector]
    code: 201
    input: [campaign_id, kind, label, window_start, window_end]
    output: Milestone
    side_effects:
      - "is_blackout := (kind == RECESS) and pressure_multiplier taken from MILESTONE_PRESSURE_MULTIPLIER"
      - "status derived from the logical clock against the half-open window"

  - method: GET
    path: "/advocacy/milestones/{milestone_id}"
    description: "Reads one milestone with its clock-relative status and pressure multiplier."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: []
    output: Milestone
    side_effects: []

  - method: GET
    path: "/advocacy/milestones"
    description: "Lists legislative-calendar milestones across campaigns for calendar planning, filterable by campaign, kind and blackout flag."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["campaign_id?", "kind?", "is_blackout?", "status?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []

  - method: POST
    path: "/advocacy/milestones/{milestone_id}/reschedule"
    description: "Moves a milestone window, re-deriving its status; already-stamped action multipliers are not retroactively changed."
    roles: [CampaignDirector]
    code: 200
    input: [window_start, window_end]
    output: Milestone
    side_effects:
      - "window moved, reschedule_count incremented, status re-derived (PASSED -> SCHEDULED is the cycle edge)"

  # --- Legislator ----------------------------------------------------------
  - method: POST
    path: "/advocacy/legislators"
    description: "Registers a target decision maker in a district and chamber with an opening whip-count stance."
    roles: [CampaignDirector, FieldOrganizer]
    code: 201
    input: [campaign_id, full_name, district_code, chamber, "stance?"]
    output: Legislator
    side_effects:
      - "initial_stance snapshot captured from stance (default UNDECIDED)"
      - "contact_pressure_score := 0.00 and priority_tier := MONITOR"

  - method: GET
    path: "/advocacy/legislators/{legislator_id}"
    description: "Reads one legislator with the derived contact pressure score and priority tier."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: []
    output: Legislator
    side_effects: []

  - method: GET
    path: "/advocacy/legislators"
    description: "Lists target legislators, filterable by campaign, district, chamber, stance or derived priority tier."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["campaign_id?", "district_code?", "chamber?", "stance?", "priority_tier?", "limit?", "offset?"]
    output: Legislator[]
    side_effects: []

  - method: POST
    path: "/advocacy/legislators/{legislator_id}/stance-updates"
    description: "Records a whip-count stance change; the stance bonus feeds the district pressure index and may move the campaign posture."
    roles: [CampaignDirector, FieldOrganizer]
    code: 200
    input: [stance, evidence_note]
    output: Legislator
    side_effects:
      - "stance updated, contact_pressure_score and priority_tier recomputed via district_pressure_index"
      - "campaign posture recomputed via campaign_posture"

  # --- Supporter -----------------------------------------------------------
  - method: POST
    path: "/advocacy/supporters"
    description: "Adds a supporter acquired through a petition, event, digital ad or referral, optionally capturing initial consent for one or more channels in the same request."
    roles: [FieldOrganizer, CampaignDirector]
    code: 201
    input: [campaign_id, full_name, email, district_code, acquisition_source, "phone?", "initial_consent_channels?", "lawful_basis?", "consent_source_reference?"]
    output: Supporter
    side_effects:
      - "one ConsentEvent with action GRANT is appended per entry of initial_consent_channels, in the listed order, each taking the next sequence_no"
      - "consent states resolved via consent_state_resolution and consent_event_count updated"
      - "engagement_score initialised from SOURCE_BONUS[acquisition_source]"

  - method: GET
    path: "/advocacy/supporters/{supporter_id}"
    description: "Reads one supporter with resolved per-channel consent states, suppression flag, touch ledger and both value scores."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: []
    output: Supporter
    side_effects: []

  - method: GET
    path: "/advocacy/supporters"
    description: "Lists supporters, filterable by campaign, district, acquisition source or suppression state."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["campaign_id?", "district_code?", "acquisition_source?", "suppressed?", "limit?", "offset?"]
    output: Supporter[]
    side_effects: []

  - method: GET
    path: "/advocacy/supporters/{supporter_id}/consent-events"
    description: "Reverse-reachability read: the append-only consent log of one supporter, ordered created_at ASC then sequence_no ASC."
    roles: [ComplianceOfficer, CampaignDirector, Supporter]
    code: 200
    input: ["channel?", "limit?", "offset?"]
    output: ConsentEvent[]
    side_effects: []

  - method: GET
    path: "/advocacy/supporters/{supporter_id}/spokesperson-profiles"
    description: "Reverse-reachability read: the spokesperson profiles of one supporter (0 or 1 rows)."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, Supporter]
    code: 200
    input: ["limit?", "offset?"]
    output: Spokesperson[]
    side_effects: []

  # --- ConsentEvent --------------------------------------------------------
  - method: POST
    path: "/advocacy/consent-events"
    description: "Appends an immutable consent grant or revocation for one channel (or ALL) with its documented lawful basis and provenance reference."
    roles: [ComplianceOfficer, FieldOrganizer, Supporter]
    code: 201
    input: [supporter_id, channel, action, source_reference, "lawful_basis?"]
    output: ConsentEvent
    side_effects:
      - "sequence_no assigned as the supporter's next monotonic counter value, effective_at := logical clock"
      - "supporter consent states and suppressed flag re-resolved via consent_state_resolution"
      - "cascade: every Segment of the campaign is re-evaluated (segment_membership), bumping Segment.version, and every SCHEDULED Activation of those segments has projected_reach and touch reservations recomputed"

  - method: GET
    path: "/advocacy/consent-events"
    description: "Lists consent events across supporters for compliance audit, filterable by supporter, channel or direction."
    roles: [ComplianceOfficer, CampaignDirector]
    code: 200
    input: ["supporter_id?", "channel?", "action?", "limit?", "offset?"]
    output: ConsentEvent[]
    side_effects: []

  - method: GET
    path: "/advocacy/consent-events/{consent_event_id}"
    description: "Reads one immutable consent event with its sequence number, lawful basis and provenance reference - the atom of a consent audit."
    roles: [ComplianceOfficer, CampaignDirector, Supporter]
    code: 200
    input: []
    output: ConsentEvent
    side_effects: []

  # --- Segment -------------------------------------------------------------
  - method: POST
    path: "/advocacy/segments"
    description: "Defines a segmentation rule over the campaign's supporter list and materialises its membership snapshot."
    roles: [MessageStrategist, CampaignDirector]
    code: 201
    input: [campaign_id, name, rule_required_channel, "rule_district_codes?", "rule_min_engagement_score?", "rule_sources?"]
    output: Segment
    side_effects:
      - "member_supporter_ids and member_count computed via segment_membership"

  - method: GET
    path: "/advocacy/segments/{segment_id}"
    description: "Reads one segment with its membership snapshot, member count and version (the version an activation must pin)."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: []
    output: Segment
    side_effects: []

  - method: GET
    path: "/advocacy/segments"
    description: "Lists segments, filterable by campaign or required consent channel."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["campaign_id?", "rule_required_channel?", "limit?", "offset?"]
    output: Segment[]
    side_effects: []

  - method: POST
    path: "/advocacy/segments/{segment_id}/refresh"
    description: "Re-materialises a segment's membership against current consent and engagement data; bumps the segment version that pinned activations depend on."
    roles: [MessageStrategist, CampaignDirector]
    code: 200
    input: []
    output: Segment
    side_effects:
      - "member_supporter_ids / member_count recomputed, last_refreshed_at := logical clock"
      - "version incremented, which invalidates any expected_segment_version a caller already holds"

  # --- MessageVariant ------------------------------------------------------
  - method: POST
    path: "/advocacy/message-variants"
    description: "Drafts a message variant for a test cell, optionally pointing at the variant it was derived from."
    roles: [MessageStrategist]
    code: 201
    input: [campaign_id, test_cell, headline, body, channel_scope, "derived_from_variant_id?"]
    output: MessageVariant
    side_effects:
      - "status := DRAFT, revision_round := 1"
      - "required_endorsement_quorum computed via endorsement_quorum"

  - method: GET
    path: "/advocacy/message-variants/{variant_id}"
    description: "Reads one message variant with its review state, endorsement tally, quorum requirement and test metrics."
    roles: [CampaignDirector, ComplianceOfficer, MessageStrategist, PartnerDelegate]
    code: 200
    input: []
    output: MessageVariant
    side_effects: []

  - method: GET
    path: "/advocacy/message-variants"
    description: "Lists message variants, filterable by campaign, review status, test cell, revision lineage or test-winner flag."
    roles: [CampaignDirector, ComplianceOfficer, MessageStrategist, PartnerDelegate]
    code: 200
    input: ["campaign_id?", "derived_from_variant_id?", "status?", "test_cell?", "test_winner?", "limit?", "offset?"]
    output: MessageVariant[]
    side_effects: []

  - method: POST
    path: "/advocacy/message-variants/{variant_id}/submit"
    description: "Submits a DRAFT or CHANGES_REQUESTED variant for message-discipline review; resubmission is refused once revision_round reaches MAX_REVISION_ROUNDS 3."
    roles: [MessageStrategist]
    code: 200
    input: ["submission_note?"]
    output: MessageVariant
    side_effects:
      - "status -> IN_REVIEW and submitted_by_user_id := X-User-ID (the value the segregation-of-duties check compares against)"

  - method: POST
    path: "/advocacy/message-variants/{variant_id}/review-decisions"
    description: "Records a review decision (APPROVE or REQUEST_CHANGES) on an IN_REVIEW variant; the submitter may not review their own submission."
    roles: [ComplianceOfficer, CampaignDirector]
    code: 200
    input: [decision, review_note]
    output: MessageVariant
    side_effects:
      - "APPROVE -> status APPROVED; REQUEST_CHANGES -> status CHANGES_REQUESTED with revision_round incremented"
      - "reviewed_by_user_id := X-User-ID"

  - method: POST
    path: "/advocacy/message-variants/{variant_id}/lock"
    description: "Locks an APPROVED variant for sending; requires at least required_endorsement_quorum ACTIVE partner endorsements."
    roles: [MessageStrategist, CampaignDirector]
    code: 200
    input: []
    output: MessageVariant
    side_effects:
      - "status APPROVED -> LOCKED, making the copy eligible for activation"

  - method: POST
    path: "/advocacy/message-variants/{variant_id}/reopen"
    description: "Reopens a LOCKED variant back to CHANGES_REQUESTED when copy must change; refused with ERR_ACTIVATION_IN_FLIGHT while any activation of the variant is SENDING, while SCHEDULED waves are cascaded to approval_state BLOCKED."
    roles: [MessageStrategist, CampaignDirector]
    code: 200
    input: [reopen_reason]
    output: MessageVariant
    side_effects:
      - "status LOCKED -> CHANGES_REQUESTED with revision_round incremented"
      - "cascade: every Activation carrying this variant with delivery_state == SCHEDULED and approval_state IN {PENDING, CLEARED} gets approval_state := BLOCKED, then Campaign.blocked_activation_count and posture are recomputed"
      - "version incremented, which invalidates any expected_variant_version a caller already holds"

  # --- CoalitionPartner ----------------------------------------------------
  - method: POST
    path: "/advocacy/coalition-partners"
    description: "Adds a coalition partner in a funding tier with its shared-branding asset; re-splits the campaign budget across active partners."
    roles: [CampaignDirector]
    code: 201
    input: [campaign_id, org_name, tier, branding_asset_ref]
    output: CoalitionPartner
    side_effects:
      - "share_weight derived from tier (ANCHOR 5 / CORE 3 / ALLY 1)"
      - "coalition_cost_share re-run for every ACTIVE partner of the campaign, conserving funded_total_cents"
      - "endorsement_quorum re-run for every MessageVariant of the campaign"

  - method: GET
    path: "/advocacy/coalition-partners/{partner_id}"
    description: "Reads one coalition partner with its derived share weight, committed cents and active endorsement count."
    roles: [CampaignDirector, ComplianceOfficer, MessageStrategist, PartnerDelegate]
    code: 200
    input: []
    output: CoalitionPartner
    side_effects: []

  - method: GET
    path: "/advocacy/coalition-partners"
    description: "Lists coalition partners, filterable by campaign, tier or membership status."
    roles: [CampaignDirector, ComplianceOfficer, MessageStrategist, PartnerDelegate]
    code: 200
    input: ["campaign_id?", "tier?", "status?", "limit?", "offset?"]
    output: CoalitionPartner[]
    side_effects: []

  - method: POST
    path: "/advocacy/coalition-partners/{partner_id}/withdraw"
    description: "Withdraws a partner from the coalition, triggering the five-hop cascade through endorsements, quorum, variant locks and campaign posture."
    roles: [CampaignDirector, PartnerDelegate]
    code: 200
    input: [withdraw_reason]
    output: CoalitionPartner
    side_effects:
      - "status ACTIVE -> WITHDRAWN, committed_cents := 0 and the remaining ACTIVE partners re-split funded_total_cents"
      - "cascade (5 hops): this partner's ACTIVE endorsements -> REVOKED, affected variants' endorsement_count and required_endorsement_quorum recomputed, LOCKED variants that fall below quorum -> CHANGES_REQUESTED, their SCHEDULED activations get approval_state := BLOCKED, Campaign.blocked_activation_count and posture recomputed"

  # --- PartnerEndorsement --------------------------------------------------
  - method: POST
    path: "/advocacy/partner-endorsements"
    description: "Records a coalition partner's endorsement of a specific message variant, pinning the variant version the partner actually read."
    roles: [PartnerDelegate, CampaignDirector]
    code: 201
    input: [partner_id, message_variant_id, discipline_pledge, talking_points_ack, expected_variant_version]
    output: PartnerEndorsement
    side_effects:
      - "endorsed_variant_version := MessageVariant.version at endorsement time"
      - "variant endorsement_count incremented and quorum satisfaction re-evaluated"

  - method: GET
    path: "/advocacy/partner-endorsements/{endorsement_id}"
    description: "Reads one endorsement with the pinned variant version and its current status."
    roles: [CampaignDirector, ComplianceOfficer, MessageStrategist, PartnerDelegate]
    code: 200
    input: []
    output: PartnerEndorsement
    side_effects: []

  - method: GET
    path: "/advocacy/partner-endorsements"
    description: "Lists endorsements, filterable by endorsing partner, endorsed variant or status."
    roles: [CampaignDirector, ComplianceOfficer, MessageStrategist, PartnerDelegate]
    code: 200
    input: ["partner_id?", "message_variant_id?", "status?", "limit?", "offset?"]
    output: PartnerEndorsement[]
    side_effects: []

  - method: POST
    path: "/advocacy/partner-endorsements/{endorsement_id}/revoke"
    description: "Revokes an ACTIVE endorsement, triggering the four-hop cascade through quorum, variant lock and scheduled waves."
    roles: [PartnerDelegate, CampaignDirector]
    code: 200
    input: [revoked_reason]
    output: PartnerEndorsement
    side_effects:
      - "status ACTIVE -> REVOKED and the variant's endorsement_count decremented"
      - "cascade (4 hops): a LOCKED variant that falls below required_endorsement_quorum -> CHANGES_REQUESTED, its SCHEDULED activations get approval_state := BLOCKED, Campaign.blocked_activation_count and posture recomputed"

  # --- Activation ----------------------------------------------------------
  - method: POST
    path: "/advocacy/activations"
    description: "Schedules a multi-channel send wave against a segment using a LOCKED variant, pinning the segment version the reach was computed from; optionally anchored to a legislative milestone for a frequency surge grant."
    roles: [CampaignDirector, MessageStrategist]
    code: 201
    input: [campaign_id, segment_id, message_variant_id, channel, window_start, window_end, expected_segment_version, "milestone_id?", "min_viable_reach?"]
    output: Activation
    side_effects:
      - "effective_touch_cap pinned via frequency_headroom (base 3 plus the surge grant read from the pre-request posture)"
      - "target_supporter_ids and projected_reach computed via the projected_reach_forward_looking variant"
      - "one touch reservation taken per targeted supporter (touches_reserved incremented)"
      - "Segment.active_activation_count incremented, bumping Segment.version"
      - "approval_state := PENDING, delivery_state := SCHEDULED"

  - method: GET
    path: "/advocacy/activations/{activation_id}"
    description: "Reads one activation with both state dimensions, the pinned touch cap, projected and realized reach, vendor tallies and send cost."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: []
    output: Activation
    side_effects: []

  - method: GET
    path: "/advocacy/activations"
    description: "Lists activations, filterable by campaign, segment, variant, milestone anchor, channel or either state dimension."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["campaign_id?", "segment_id?", "message_variant_id?", "milestone_id?", "channel?", "approval_state?", "delivery_state?", "limit?", "offset?"]
    output: Activation[]
    side_effects: []

  - method: POST
    path: "/advocacy/activations/{activation_id}/clear"
    description: "Compliance clearance of a PENDING or BLOCKED wave; the user who created the wave may not clear it."
    roles: [ComplianceOfficer]
    code: 200
    input: [clearance_note]
    output: Activation
    side_effects:
      - "approval_state -> CLEARED"
      - "campaign posture recomputed (a wave leaving BLOCKED can un-freeze the campaign)"

  - method: POST
    path: "/advocacy/activations/{activation_id}/block"
    description: "Blocks a wave on message-discipline or compliance grounds; two blocked waves on one campaign freeze the posture."
    roles: [ComplianceOfficer]
    code: 200
    input: [block_reason]
    output: Activation
    side_effects:
      - "approval_state -> BLOCKED and blocked_activation_count incremented on the campaign"
      - "campaign posture recomputed via campaign_posture"

  - method: POST
    path: "/advocacy/activations/{activation_id}/start-send"
    description: "Starts delivery of a CLEARED wave whose send window contains the logical clock."
    roles: [CampaignDirector, FieldOrganizer]
    code: 200
    input: []
    output: Activation
    side_effects:
      - "delivery_state SCHEDULED -> SENDING; target_supporter_ids is frozen from this point on"

  - method: POST
    path: "/advocacy/activations/{activation_id}/complete"
    description: "Closes a SENDING wave with the channel vendor's delivered and bounced tallies, computing realized reach against consent as it stands now."
    roles: [CampaignDirector, FieldOrganizer]
    code: 200
    input: [delivered_count, bounced_count]
    output: Activation
    side_effects:
      - "delivery_state -> SENT when bounced_count == 0 and delivered_count equals the target count, otherwise PARTIAL"
      - "realized_reach, suppressed_by_consent_count and send_cost_cents written via the realized_reach_chronological variant"
      - "touch reservations converted to consumption: touches_reserved decremented and touches_consumed incremented for each delivered supporter"
      - "variant_test_metrics recomputed for the wave's message variant"

  - method: POST
    path: "/advocacy/activations/{activation_id}/abort"
    description: "Aborts a SCHEDULED or SENDING wave, releasing every outstanding touch reservation."
    roles: [CampaignDirector, ComplianceOfficer]
    code: 200
    input: [abort_reason]
    output: Activation
    side_effects:
      - "delivery_state -> ABORTED and every outstanding touch reservation released (touches_reserved decremented)"
      - "Segment.active_activation_count decremented, bumping Segment.version"
      - "dependent ActionRecord rows in {RECORDED, MATCHED, ACKNOWLEDGED} -> VOIDED and legislator pressure recomputed"

  # --- ActionRecord --------------------------------------------------------
  - method: POST
    path: "/advocacy/action-records"
    description: "Logs a constituent action, stamping the milestone pressure multiplier and running the district-matching selector inside the same request; an empty district pool yields UNMATCHED, not an error."
    roles: [FieldOrganizer, CampaignDirector]
    code: 201
    input: [supporter_id, channel, "activation_id?"]
    output: ActionRecord
    side_effects:
      - "pressure_multiplier stamped via milestone_multiplier_snapshot"
      - "status resolved to MATCHED (legislator_id filled by legislator_match_selector) or UNMATCHED"
      - "district_pressure_index recomputed for the matched legislator, then campaign_posture"
      - "supporter engagement_score recomputed (engagement_score_rolling variant)"

  - method: GET
    path: "/advocacy/action-records/{action_record_id}"
    description: "Reads one action record with its matched legislator, stamped multiplier and lifecycle state."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: []
    output: ActionRecord
    side_effects: []

  - method: GET
    path: "/advocacy/action-records"
    description: "Lists action records, filterable by supporter, prompting activation, matched legislator, channel or status."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["supporter_id?", "activation_id?", "legislator_id?", "channel?", "status?", "limit?", "offset?"]
    output: ActionRecord[]
    side_effects: []

  - method: POST
    path: "/advocacy/action-records/{action_record_id}/acknowledge"
    description: "Records the legislator office's acknowledgement of a MATCHED action."
    roles: [FieldOrganizer, CampaignDirector]
    code: 200
    input: ["acknowledgement_note?"]
    output: ActionRecord
    side_effects:
      - "status MATCHED -> ACKNOWLEDGED and acknowledged_at := logical clock"

  - method: POST
    path: "/advocacy/action-records/{action_record_id}/thank"
    description: "Closes the thank-you loop on an ACKNOWLEDGED action; the thank channel must carry GRANTED consent and consumes one frequency touch."
    roles: [FieldOrganizer, CampaignDirector]
    code: 200
    input: [thank_channel]
    output: ActionRecord
    side_effects:
      - "status ACKNOWLEDGED -> THANKED, thanked_at := logical clock"
      - "supporter touches_consumed incremented by 1 and thanked_count incremented"

  - method: POST
    path: "/advocacy/action-records/{action_record_id}/dispute"
    description: "Disputes a MATCHED or ACKNOWLEDGED action (for example a duplicate or a mis-districted contact), removing it from every pressure and engagement aggregate."
    roles: [ComplianceOfficer, FieldOrganizer]
    code: 200
    input: [dispute_reason]
    output: ActionRecord
    side_effects:
      - "status -> DISPUTED, so the row leaves the counted input set of district_pressure_index and supporter_value_score"
      - "legislator pressure, priority tier and campaign posture recomputed"

  - method: POST
    path: "/advocacy/action-records/{action_record_id}/dispute-resolutions"
    description: "Resolves a dispute as REINSTATED (back to MATCHED) or VOIDED (terminal); the user who filed the action may not resolve its dispute."
    roles: [ComplianceOfficer, CampaignDirector]
    code: 200
    input: [outcome, resolution_note]
    output: ActionRecord
    side_effects:
      - "REINSTATED -> status MATCHED with the original pressure_multiplier and legislator_id intact, restoring the legislator's pressure score to its exact pre-dispute value"
      - "VOIDED -> terminal status VOIDED with no further transitions"
      - "legislator pressure, supporter engagement and campaign posture recomputed"

  # --- Spokesperson --------------------------------------------------------
  - method: POST
    path: "/advocacy/spokespersons"
    description: "Collects a supporter's personal story and opens a spokesperson training profile."
    roles: [FieldOrganizer, CampaignDirector, Supporter]
    code: 201
    input: [supporter_id, story_summary, "publication_consent?"]
    output: Spokesperson
    side_effects:
      - "training_state := UNTRAINED, training_sessions_completed := 0, media_ready := false"

  - method: GET
    path: "/advocacy/spokespersons/{spokesperson_id}"
    description: "Reads one spokesperson profile with its training state and media readiness."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, Supporter]
    code: 200
    input: []
    output: Spokesperson
    side_effects: []

  - method: GET
    path: "/advocacy/spokespersons"
    description: "Lists spokesperson profiles, filterable by supporter, training state, publication consent or media readiness."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["supporter_id?", "training_state?", "publication_consent?", "media_ready?", "limit?", "offset?"]
    output: Spokesperson[]
    side_effects: []

  - method: POST
    path: "/advocacy/spokespersons/{spokesperson_id}/training-advancements"
    description: "Advances the training ladder to TRAINED or CERTIFIED; CERTIFIED requires publication_consent PUBLIC."
    roles: [FieldOrganizer, CampaignDirector]
    code: 200
    input: [to_level, session_reference]
    output: Spokesperson
    side_effects:
      - "training_state advanced, training_sessions_completed incremented, media_ready re-derived"
      - "supporter engagement_score recomputed because STORY_BONUS changed"

  # --- DistrictMeeting -----------------------------------------------------
  - method: POST
    path: "/advocacy/district-meetings"
    description: "Requests an in-district meeting with a legislator office, led by a CERTIFIED spokesperson living in that district; overlap arithmetic applies a 30-minute travel buffer per legislator."
    roles: [FieldOrganizer, CampaignDirector]
    code: 201
    input: [campaign_id, legislator_id, lead_spokesperson_id, location_district_code, window_start, window_end]
    output: DistrictMeeting
    side_effects:
      - "status := REQUESTED and pressure_credit := 0.00"

  - method: GET
    path: "/advocacy/district-meetings/{meeting_id}"
    description: "Reads one district meeting with its status, attendance and pressure credit."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: []
    output: DistrictMeeting
    side_effects: []

  - method: GET
    path: "/advocacy/district-meetings"
    description: "Lists district meetings, filterable by campaign, legislator, lead spokesperson, district or status."
    roles: [CampaignDirector, ComplianceOfficer, FieldOrganizer, MessageStrategist]
    code: 200
    input: ["campaign_id?", "legislator_id?", "lead_spokesperson_id?", "location_district_code?", "status?", "limit?", "offset?"]
    output: DistrictMeeting[]
    side_effects: []

  - method: POST
    path: "/advocacy/district-meetings/{meeting_id}/response"
    description: "Records the legislator office's response to a REQUESTED meeting (CONFIRM or DECLINE)."
    roles: [FieldOrganizer, CampaignDirector]
    code: 200
    input: [decision, "decline_reason?"]
    output: DistrictMeeting
    side_effects:
      - "status REQUESTED -> CONFIRMED, or -> DECLINED with decline_reason recorded"

  - method: POST
    path: "/advocacy/district-meetings/{meeting_id}/complete"
    description: "Closes a CONFIRMED meeting with the attendance count; attendee_count 0 routes the meeting to NO_SHOW and grants no pressure credit."
    roles: [FieldOrganizer, CampaignDirector]
    code: 200
    input: [attendee_count]
    output: DistrictMeeting
    side_effects:
      - "attendee_count >= 1 -> status HELD, pressure_credit := 12.00, legislator meeting_held_count incremented and district_pressure_index recomputed"
      - "attendee_count == 0 -> status NO_SHOW, pressure_credit stays 0.00 and no legislator counter changes"
      - "campaign posture recomputed after any pressure change"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own (PartnerDelegate X-User-ID != partner_id, Supporter X-User-ID != supporter_id)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID performing a review, clearance or dispute resolution equals the X-User-ID that performed the preceding submit, activation creation or action filing"

  # existence
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign_id in the path or body does not resolve to a Campaign"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "milestone_id in the path or body does not resolve to a Milestone"
  - id: ERR_LEGISLATOR_NOT_FOUND
    http: 404
    condition: "legislator_id in the path or body does not resolve to a Legislator"
  - id: ERR_SUPPORTER_NOT_FOUND
    http: 404
    condition: "supporter_id in the path or body does not resolve to a Supporter"
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "segment_id in the path or body does not resolve to a Segment"
  - id: ERR_VARIANT_NOT_FOUND
    http: 404
    condition: "variant_id in the path, or message_variant_id / derived_from_variant_id / winning_message_variant_id in the body, does not resolve to a MessageVariant"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "partner_id in the path or body does not resolve to a CoalitionPartner"
  - id: ERR_ENDORSEMENT_NOT_FOUND
    http: 404
    condition: "endorsement_id in the path does not resolve to a PartnerEndorsement"
  - id: ERR_ACTIVATION_NOT_FOUND
    http: 404
    condition: "activation_id in the path or body does not resolve to an Activation"
  - id: ERR_ACTION_RECORD_NOT_FOUND
    http: 404
    condition: "action_record_id in the path does not resolve to an ActionRecord"
  - id: ERR_SPOKESPERSON_NOT_FOUND
    http: 404
    condition: "spokesperson_id in the path, or lead_spokesperson_id in the body, does not resolve to a Spokesperson"
  - id: ERR_MEETING_NOT_FOUND
    http: 404
    condition: "meeting_id in the path does not resolve to a DistrictMeeting"

  # request shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body: unknown field, missing required field, enum value outside its declared set, negative integer where non-negative is required, non-integral cents or unparseable timestamp; two parseable but inverted window bounds are ERR_INVALID_WINDOW at priority 15, not this code"

  # concurrency
  - id: ERR_STALE_SEGMENT_VERSION
    http: 412
    condition: "expected_segment_version supplied to POST /advocacy/activations does not equal the Segment's current version"
  - id: ERR_STALE_VARIANT_VERSION
    http: 412
    condition: "expected_variant_version supplied to POST /advocacy/partner-endorsements does not equal the MessageVariant's current version"

  # lifecycle and state
  - id: ERR_CAMPAIGN_NOT_ACTIVE
    http: 409
    condition: "a write below a campaign is attempted while the campaign is DRAFT or CLOSED, excluding the planning writes POST /advocacy/legislators and POST /advocacy/milestones, which are legal while the campaign is DRAFT and refused once it is CLOSED"
  - id: ERR_CAMPAIGN_FROZEN
    http: 409
    condition: "an activation, clearance, send-start, endorsement, variant lock or meeting request is attempted while the campaign posture is FROZEN"
  - id: ERR_CAMPAIGN_RESTRICTED
    http: 409
    condition: "an SMS or PHONE activation is created, cleared or started while the campaign posture is RESTRICTED"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared for the entity's current state, including any attempt to leave a terminal state (CLOSED, RETIRED, SENT, PARTIAL, ABORTED, VOIDED, DECLINED, HELD, NO_SHOW, REVOKED, WITHDRAWN, UNMATCHED)"
  - id: ERR_NO_TARGET_LEGISLATOR
    http: 409
    condition: "POST /advocacy/campaigns/{campaign_id}/launch on a campaign with no Legislator rows"
  - id: ERR_ACTIVATION_IN_FLIGHT
    http: 409
    condition: "a campaign close is attempted while any Activation of the campaign has delivery_state == SENDING, or a LOCKED variant reopen is attempted while one of the activations carrying that variant has delivery_state == SENDING (SCHEDULED waves do not block the reopen - they are cascaded to approval_state BLOCKED instead)"
  - id: ERR_OUTSIDE_SEND_WINDOW
    http: 409
    condition: "POST /advocacy/activations/{activation_id}/start-send while the logical clock is outside the wave's closed send window"
  - id: ERR_PARTNER_WITHDRAWN
    http: 409
    condition: "an endorsement is created or revoked for a CoalitionPartner whose status is WITHDRAWN"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "a CHANGES_REQUESTED variant is resubmitted after revision_round has reached MAX_REVISION_ROUNDS 3"
  - id: ERR_NO_ELIGIBLE_VARIANT
    http: 409
    condition: "a message-test resolution names a test_cell in which no variant is LOCKED, or names a winner that is not in the given test_cell"

  # consent and lawful basis (regulatory core)
  - id: ERR_CONSENT_MISSING
    http: 422
    condition: "the addressed channel's resolved consent state for the supporter is NONE or REVOKED while at least one other channel is still GRANTED (action record, thank-you touch, meeting request), or a spokesperson intake is attempted for a supporter with no GRANTED channel at all; a supporter with all three channels REVOKED is ERR_SUPPORTER_SUPPRESSED instead, because priority 13 checks the suppression flag first"
  - id: ERR_SUPPORTER_SUPPRESSED
    http: 422
    condition: "the target supporter is suppressed (EMAIL, SMS and PHONE all REVOKED) and any contact-bearing write is attempted"
  - id: ERR_LAWFUL_BASIS_INVALID
    http: 422
    condition: "a GRANT consent event omits lawful_basis or supplies a value outside {EXPRESS_WRITTEN, OPT_IN_FORM, EVENT_CARD, VERBAL_RECORDED}, or a REVOKE event supplies a lawful_basis"
  - id: ERR_STORY_CONSENT_REQUIRED
    http: 422
    condition: "CERTIFIED training advancement is attempted on a spokesperson profile whose publication_consent is not PUBLIC"

  # temporal
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_start is not strictly before window_end, or either bound is not aligned to a whole minute"
  - id: ERR_WINDOW_OUTSIDE_CAMPAIGN
    http: 422
    condition: "a milestone, activation or meeting window is not fully contained in the campaign's [start_date, end_date] span"
  - id: ERR_BLACKOUT_WINDOW
    http: 409
    condition: "an activation send window intersects a RECESS milestone of the same campaign"

  # constraint satisfaction
  - id: ERR_MEETING_WINDOW_CONFLICT
    http: 409
    condition: "the requested meeting overlaps an existing REQUESTED, CONFIRMED or HELD meeting for the same legislator once the 30-minute travel buffer is applied to both sides of the existing interval"
  - id: ERR_CHANNEL_WINDOW_SATURATED
    http: 409
    condition: "a third activation on the same (campaign, channel) would hold a closed send window overlapping two existing SCHEDULED or SENDING waves"
  - id: ERR_DUPLICATE_ENDORSEMENT
    http: 409
    condition: "an ACTIVE endorsement already exists for the same (partner_id, message_variant_id) pair"
  - id: ERR_DUPLICATE_SPOKESPERSON
    http: 409
    condition: "a Spokesperson profile already exists for the same (supporter_id, campaign_id) pair"

  # cross-entity readiness and scope
  - id: ERR_VARIANT_NOT_LOCKED
    http: 409
    condition: "an activation names a MessageVariant whose status is not LOCKED"
  - id: ERR_SPOKESPERSON_NOT_CERTIFIED
    http: 409
    condition: "a district meeting names a lead spokesperson whose training_state is not CERTIFIED"
  - id: ERR_ENDORSEMENT_QUORUM_NOT_MET
    http: 409
    condition: "a variant lock is attempted while endorsement_count is below required_endorsement_quorum"
  - id: ERR_CAMPAIGN_MISMATCH
    http: 422
    condition: "two or more FKs in one request resolve to different campaigns (for example a segment and a variant from different campaigns, or an endorsement's partner and variant)"
  - id: ERR_CHANNEL_NOT_IN_VARIANT_SCOPE
    http: 422
    condition: "an activation channel does not appear in the named variant's channel_scope"
  - id: ERR_DISTRICT_MISMATCH
    http: 422
    condition: "a meeting's location_district_code differs from the legislator's district_code, or the lead spokesperson's supporter lives in a different district"

  # capacity and fiscal
  - id: ERR_SEGMENT_EMPTY
    http: 409
    condition: "an activation targets a segment whose member_count is 0"
  - id: ERR_FREQUENCY_CAP_EXHAUSTED
    http: 409
    condition: "projected_reach evaluates to 0 because every segment member already sits at or above effective_touch_cap"
  - id: ERR_REACH_BELOW_MINIMUM
    http: 409
    condition: "projected_reach is greater than 0 but strictly below min_viable_reach, or a message-test winner's realized_reach_total is below MIN_TEST_REACH 3"
  - id: ERR_DELIVERY_TALLY_MISMATCH
    http: 409
    condition: "delivered_count reported at completion exceeds projected_reach, or delivered_count + bounced_count exceeds projected_reach"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: CampaignDirector
    description: "Owns campaign definition, timeline, coalition composition and the posture override; the accountable operator for launch, close and outcome analysis."
    identity: opaque
    exclusive_operations:
      - "POST /advocacy/campaigns"
      - "POST /advocacy/campaigns/{campaign_id}/launch"
      - "POST /advocacy/campaigns/{campaign_id}/close"
      - "POST /advocacy/campaigns/{campaign_id}/posture-overrides"
      - "POST /advocacy/milestones"
      - "POST /advocacy/milestones/{milestone_id}/reschedule"
      - "POST /advocacy/coalition-partners"
    shared_operations:
      - "POST /advocacy/legislators and POST /advocacy/legislators/{legislator_id}/stance-updates (with FieldOrganizer)"
      - "POST /advocacy/supporters (with FieldOrganizer)"
      - "POST /advocacy/segments and POST /advocacy/segments/{segment_id}/refresh (with MessageStrategist)"
      - "POST /advocacy/activations (with MessageStrategist), start-send and complete (with FieldOrganizer), abort (with ComplianceOfficer)"
      - "POST /advocacy/message-variants/{variant_id}/lock and /reopen (with MessageStrategist)"
      - "POST /advocacy/message-variants/{variant_id}/review-decisions and action-record dispute-resolutions (with ComplianceOfficer)"
      - "POST /advocacy/partner-endorsements and /revoke, POST /advocacy/coalition-partners/{partner_id}/withdraw (with PartnerDelegate)"
      - "all action-record, spokesperson and district-meeting writes (with FieldOrganizer)"
      - "every GET in §1.5 except that consent-event reads are shared with ComplianceOfficer and Supporter"

  - name: FieldOrganizer
    description: "Runs the field program: list building, action logging, thank-you loops, story collection, spokesperson training and in-district meetings."
    identity: opaque
    exclusive_operations:
      - "POST /advocacy/action-records/{action_record_id}/acknowledge"
      - "POST /advocacy/action-records/{action_record_id}/thank"
      - "POST /advocacy/spokespersons/{spokesperson_id}/training-advancements"
      - "POST /advocacy/district-meetings/{meeting_id}/response"
      - "POST /advocacy/district-meetings/{meeting_id}/complete"
    shared_operations:
      - "POST /advocacy/supporters and POST /advocacy/consent-events"
      - "POST /advocacy/legislators and stance-updates"
      - "POST /advocacy/action-records and /dispute"
      - "POST /advocacy/spokespersons and POST /advocacy/district-meetings"
      - "POST /advocacy/activations/{activation_id}/start-send and /complete"
      - "reads of campaigns, milestones, legislators, supporters, segments, activations, action records, spokespersons and district meetings"
    denied_operations:
      - "POST /advocacy/campaigns and every campaign lifecycle call (ERR_ROLE_NOT_PERMITTED)"
      - "POST /advocacy/activations (creation), /clear and /block"
      - "POST /advocacy/message-variants and every review or lock call"

  - name: ComplianceOfficer
    description: "Independent compliance authority over consent records, message review, wave clearance and action disputes; the segregation-of-duties counterweight to the operators who submit work."
    identity: opaque
    exclusive_operations:
      - "POST /advocacy/activations/{activation_id}/clear"
      - "POST /advocacy/activations/{activation_id}/block"
    shared_operations:
      - "POST /advocacy/consent-events (with FieldOrganizer and Supporter)"
      - "POST /advocacy/message-variants/{variant_id}/review-decisions (with CampaignDirector)"
      - "POST /advocacy/action-records/{action_record_id}/dispute (with FieldOrganizer) and /dispute-resolutions (with CampaignDirector)"
      - "POST /advocacy/activations/{activation_id}/abort (with CampaignDirector)"
      - "GET /advocacy/campaigns/{campaign_id}/outcome-report, GET /advocacy/consent-events and every other read"
    denied_operations:
      - "POST /advocacy/campaigns, /launch, /close, /posture-overrides"
      - "POST /advocacy/activations (creation), /start-send, /complete"
      - "POST /advocacy/message-variants (creation), /submit, /lock"

  - name: MessageStrategist
    description: "Owns message testing and segmentation: drafts and submits variants, defines segments and schedules waves; may never review or clear its own work."
    identity: opaque
    exclusive_operations:
      - "POST /advocacy/message-variants"
      - "POST /advocacy/message-variants/{variant_id}/submit"
      - "POST /advocacy/campaigns/{campaign_id}/message-test-resolutions"
    shared_operations:
      - "POST /advocacy/segments and POST /advocacy/segments/{segment_id}/refresh (with CampaignDirector)"
      - "POST /advocacy/activations (with CampaignDirector)"
      - "POST /advocacy/message-variants/{variant_id}/lock and /reopen (with CampaignDirector)"
      - "reads of campaigns, milestones, legislators, supporters, segments, variants, partners, endorsements, activations, action records, spokespersons and district meetings"
    denied_operations:
      - "POST /advocacy/message-variants/{variant_id}/review-decisions (ERR_ROLE_NOT_PERMITTED - review is compliance's, not the author's)"
      - "POST /advocacy/activations/{activation_id}/clear and /block"
      - "POST /advocacy/consent-events and every action-record write"

  - name: PartnerDelegate
    description: "A coalition partner organisation acting for itself: endorses message copy, revokes its endorsements and may withdraw its own membership."
    identity: "entity_backed:CoalitionPartner"
    exclusive_operations: []
    shared_operations:
      - "POST /advocacy/partner-endorsements and POST /advocacy/partner-endorsements/{endorsement_id}/revoke (with CampaignDirector)"
      - "POST /advocacy/coalition-partners/{partner_id}/withdraw (with CampaignDirector)"
      - "GET of campaigns, coalition partners, message variants and partner endorsements"
    denied_operations:
      - "any endorsement or withdrawal whose partner_id differs from X-User-ID (ERR_NOT_RESOURCE_OWNER)"
      - "every supporter, consent, segment, activation, action-record, spokesperson and meeting write"
      - "GET /advocacy/campaigns/{campaign_id}/outcome-report"

  - name: Supporter
    description: "A constituent acting for themselves: records their own consent changes and offers their own story."
    identity: "entity_backed:Supporter"
    exclusive_operations: []
    shared_operations:
      - "POST /advocacy/consent-events for their own supporter_id (with ComplianceOfficer and FieldOrganizer)"
      - "POST /advocacy/spokespersons for their own supporter_id (with FieldOrganizer and CampaignDirector)"
      - "GET /advocacy/supporters/{supporter_id}/consent-events and /spokesperson-profiles for their own row"
      - "POST /_clock/set_current_utc"
    denied_operations:
      - "any consent event or story whose supporter_id differs from X-User-ID (ERR_NOT_RESOURCE_OWNER)"
      - "every campaign, milestone, legislator, segment, variant, partner, activation, action-record and meeting write"
      - "GET /advocacy/campaigns, /advocacy/legislators, /advocacy/activations and the outcome report"

role_model_note: |
  segregation_of_duties is enforced on X-User-ID within a role as well as across roles: a
  MessageStrategist may submit a variant but the ComplianceOfficer or CampaignDirector who decides the
  review must be a different X-User-ID from the submitter; the CampaignDirector X-User-ID that created
  an activation may not be the ComplianceOfficer clearance identity; and the FieldOrganizer X-User-ID
  that filed an action record may not resolve that record's dispute. All three checks return
  ERR_SEGREGATION_OF_DUTIES (403) at validation priority 12, after role permission and before any
  state precondition.
