      - name: appeal_codes_fire_on_the_wrong_benefit_state_and_after_the_window
        claim_type: error_triggerability
        grounds:
          - validations[priority=96]
          - validations[priority=98]
          - errors[ERR_APPEAL_NOT_APPLICABLE]
          - errors[ERR_APPEAL_WINDOW_EXPIRED]
        distinguishing_aspect: |
          The polymorphic case type is gated in BOTH directions on the same enrollment as it
          changes state: appealing while the benefit is ACTIVE and complaining once it is
          DE_ENROLLED are both ERR_APPEAL_NOT_APPLICABLE, while the mirror pairings succeed.
          The 30-day appeal window is then closed at millisecond resolution - an appeal at
          exactly appeal_deadline_at is accepted and one millisecond later
          ERR_APPEAL_WINDOW_EXPIRED fires.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE carrier, one dwelling, one ACTIVE VOICE enrollment E1 for subscriber S1."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
