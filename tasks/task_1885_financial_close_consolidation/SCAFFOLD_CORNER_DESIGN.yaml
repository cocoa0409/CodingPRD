# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1885 Financial Close & Consolidation.
#
# Breadth probe: enumerates the testable claims of SCAFFOLD.yaml §1.1–§1.7 NOT
# already exercised by §1.8. Corners already covered by a §1.8 difficulty
# instance are emitted as `excluded_because:` stubs (no test_recipe).
#
# Reuses the same fixture conventions as §1.8: Period P1 = 2026-01-01 ..
# 2026-01-31 (period_end 2026-01-31T00:00:00Z); logical clock set explicitly.
# Instance names are unique across BOTH design files.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_period_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.ClosePeriod.fields.materiality_threshold_minor", "endpoints.\"POST /close/periods\""]
        distinguishing_aspect: "POST /close/periods omitting the required materiality_threshold_minor is rejected as a malformed request; no period is persisted."
        test_recipe:
          setup: ["Empty DB; logical clock at default"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
          trigger:
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "response is an error envelope (response_type == error) with a 400-class error_id; no ClosePeriod created"

      - name: entity_defaults_is_elimination_counterparty_true
        claim_type: defaults
        grounds: ["entities.Entity.fields.is_elimination_counterparty"]
        distinguishing_aspect: "Omitting is_elimination_counterparty on entity create applies the declared default true."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
          trigger:
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { flag: $.data.is_elimination_counterparty }
          assert:
            - "created Entity.is_elimination_counterparty == true (default applied when omitted)"

      - name: entity_computed_consolidation_tier_ignores_input
        claim_type: computed_fields
        grounds: ["entities.Entity.fields.consolidation_tier"]
        distinguishing_aspect: "consolidation_tier is computed from the parent chain (root=0, child=1); it is not client-settable and reflects the hierarchy depth."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/entities"
              payload: { entity_code: "ROOT", name: "Root", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { root_id: $.data.id, root_tier: $.data.consolidation_tier }
          trigger:
            - call: "POST /close/entities"
              payload: { entity_code: "CHILD", name: "Child", functional_currency: EUR, ownership_pct: 80, translation_method: CURRENT_RATE, parent_entity_id: "${root_id}" }
              as: Controller
              captures: { child_tier: $.data.consolidation_tier }
          assert:
            - "root Entity.consolidation_tier == 0"
            - "child Entity.consolidation_tier == 1 (computed from parent chain, not from any input field)"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.\"GET /close/entities/{id}\""]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
          trigger:
            - call: "GET /close/entities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: entity_parent_reference_validated_and_tier_computed
        claim_type: type_constraints
        grounds: ["entities.Entity.fields.parent_entity_id", "entities.Entity.fields.consolidation_tier", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "parent_entity_id is validated as a referential link: a dangling parent id is rejected, and a valid multi-level chain (A<-B<-C) computes consolidation_tier 0/1/2 respectively, which drives bottom-up translation order."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/entities"
              payload: { entity_code: "A", name: "A", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { a_id: $.data.id, a_tier: $.data.consolidation_tier }
            - call: "POST /close/entities"
              payload: { entity_code: "B", name: "B", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE, parent_entity_id: "${a_id}" }
              as: Controller
              captures: { b_id: $.data.id, b_tier: $.data.consolidation_tier }
          trigger:
            - call: "POST /close/entities"
              payload: { entity_code: "C", name: "C", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE, parent_entity_id: "${b_id}" }
              as: Controller
              captures: { c_tier: $.data.consolidation_tier }
            - call: "POST /close/entities"
              payload: { entity_code: "ORPHAN", name: "Orphan", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE, parent_entity_id: "00000000-0000-0000-0000-000000000000" }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "A.consolidation_tier == 0, B.consolidation_tier == 1, C.consolidation_tier == 2 (chain depth computed)"
            - "create with a dangling parent_entity_id rejected with ERR_NOT_FOUND (parent must resolve to an existing Entity)"

      - name: close_event_append_only_no_version_field
        claim_type: immutability
        grounds: ["entities.CloseEvent"]
        distinguishing_aspect: "CloseEvent declares common_fields: false → it carries only id and created_at (no updated_at, no version), and exposes no mutation endpoint — the audit log is append-only."
        test_recipe:
          setup: ["Period opened (generates a PERIOD_OPENED event)"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
          trigger:
            - call: "GET /close/periods/${per_id}/events"
              payload: {}
              as: Auditor
              captures: { ev0_id: "$.data[0].id" }
          assert:
            - "at least one CloseEvent exists (PERIOD_OPENED)"
            - "CloseEvent rows expose id and created_at but NO version and NO updated_at (common_fields false)"
            - "no PUT/PATCH/DELETE endpoint exists for CloseEvent in §1.5 — append-only"

  # ===========================================================================
  # Section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: je_approve_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.JournalEntry"]
        distinguishing_aspect: "Approving a JE still in DRAFT (never submitted) is not a permitted transition → ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["Period opened; one entity-period; one RECLASS JE left in DRAFT"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: USD, lines: [ { line_no: 1, account_code: "6100", direction: DEBIT, amount_minor: 1000 }, { line_no: 2, account_code: "6150", direction: CREDIT, amount_minor: 1000 } ] }
              as: Preparer
              captures: { je_id: $.data.id }
          trigger:
            - call: "POST /close/journal-entries/${je_id}/approve"
              payload: {}
              as: Approver
              as_user_id: "approver-1"
              captures: { err: $.data.error_id }
          assert:
            - "approve from DRAFT rejected with ERR_INVALID_STATE"
            - "JournalEntry.${je_id}.status remains DRAFT"

      - name: terminal_state_lockdown_posted_je
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.JournalEntry"]
        distinguishing_aspect: "POSTED is terminal for the approval dimension: submit/approve/reject/rework on a POSTED JE all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Period opened; one RECLASS JE driven to POSTED"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: USD, lines: [ { line_no: 1, account_code: "6100", direction: DEBIT, amount_minor: 1000 }, { line_no: 2, account_code: "6150", direction: CREDIT, amount_minor: 1000 } ] }
              as: Preparer
              captures: { je_id: $.data.id }
            - { call: "POST /close/journal-entries/${je_id}/submit", payload: {}, as: Preparer }
            - { call: "POST /close/journal-entries/${je_id}/approve", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/journal-entries/${je_id}/post", payload: {}, as: Preparer }
          trigger:
            - call: "POST /close/journal-entries/${je_id}/rework"
              payload: {}
              as: Preparer
              captures: { err: $.data.error_id }
          assert:
            - "rework on POSTED rejected with ERR_INVALID_STATE (POSTED is terminal for the lifecycle dimension)"
            - "JournalEntry.${je_id}.status remains POSTED"

      - name: doc_state_parallel_dimension_independent_of_status
        claim_type: parallel_dimensions
        grounds: ["state_machines.JournalEntry", "entities.JournalEntry.fields.doc_state"]
        distinguishing_aspect: "doc_state (DOC_MISSING/DOC_ATTACHED/DOC_VERIFIED) evolves independently of the approval status dimension: attaching a doc to a DRAFT JE moves doc_state to DOC_ATTACHED while status stays DRAFT."
        test_recipe:
          setup: ["Period opened; one entity-period; one MANUAL JE in DRAFT"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/journal-entries"
              payload: { je_type: MANUAL, entry_date: "2026-01-20T00:00:00Z", functional_currency: USD, lines: [ { line_no: 1, account_code: "6100", direction: DEBIT, amount_minor: 1000 }, { line_no: 2, account_code: "6150", direction: CREDIT, amount_minor: 1000 } ] }
              as: Preparer
              captures: { je_id: $.data.id, ds0: $.data.doc_state }
          trigger:
            - call: "POST /close/journal-entries/${je_id}/documents"
              payload: { file_name: "invoice.pdf", content_hash: "abc123", doc_category: INVOICE }
              as: Preparer
              captures: { doc_id: $.data.id }
            - call: "GET /close/journal-entries/${je_id}"
              payload: {}
              as: Preparer
              captures: { ds1: $.data.doc_state, st1: $.data.status }
          assert:
            - "on create: doc_state == DOC_MISSING and status == DRAFT"
            - "after attach: doc_state == DOC_ATTACHED while status STILL == DRAFT (parallel dimensions move independently)"

      - name: soft_locked_entity_period_blocks_new_je
        claim_type: precondition_enforcement
        grounds: ["state_machines.EntityPeriod", "errors[ERR_PERIOD_LOCKED]"]
        distinguishing_aspect: "A mutation on a SOFT_LOCKED entity-period (new JE create) is rejected with ERR_PERIOD_LOCKED; the posture gate blocks child writes."
        test_recipe:
          setup: ["Period opened; entity-period driven to SOFT_LOCKED via readiness + soft-lock"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: USD, to_currency: USD, rate_kind: PERIOD_END, rate: 1.0, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            - { call: "POST /close/entity-periods/${ep_id}/translate", payload: {}, as: Controller }
            - { call: "POST /close/entity-periods/${ep_id}/mark-reconciled", payload: {}, as: Preparer }
            - { call: "POST /close/entity-periods/${ep_id}/ready", payload: {}, as: Preparer }
            - call: "GET /close/periods/${per_id}"
              payload: {}
              as: Controller
              captures: { per_v: $.data.version }
            - { call: "POST /close/periods/${per_id}/soft-lock", payload: { expected_close_period_version: "${per_v}" }, as: Controller }
          trigger:
            - call: "POST /close/entity-periods/${ep_id}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: USD, lines: [ { line_no: 1, account_code: "6100", direction: DEBIT, amount_minor: 100 }, { line_no: 2, account_code: "6150", direction: CREDIT, amount_minor: 100 } ] }
              as: Preparer
              captures: { err: $.data.error_id }
          assert:
            - "JE create on SOFT_LOCKED entity-period rejected with ERR_PERIOD_LOCKED"

      - name: reopen_hard_closed_period_returns_period_hard_locked
        claim_type: precondition_enforcement
        grounds: ["state_machines.ClosePeriod", "errors[ERR_PERIOD_HARD_LOCKED]"]
        distinguishing_aspect: "Reopen is only legal from SOFT_CLOSED; attempting to reopen a HARD_CLOSED (UNDER_REVIEW) period returns ERR_PERIOD_HARD_LOCKED."
        test_recipe:
          setup: ["Period driven to UNDER_REVIEW (hard-locked) with all entities HARD_LOCKED, no out-of-tolerance elim residual, no required flux outstanding"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: USD, to_currency: USD, rate_kind: PERIOD_END, rate: 1.0, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            - { call: "POST /close/entity-periods/${ep_id}/translate", payload: {}, as: Controller }
            - { call: "POST /close/entity-periods/${ep_id}/mark-reconciled", payload: {}, as: Preparer }
            - { call: "POST /close/entity-periods/${ep_id}/ready", payload: {}, as: Preparer }
            - call: "GET /close/periods/${per_id}"
              payload: {}
              as: Controller
              captures: { per_v1: $.data.version }
            - { call: "POST /close/periods/${per_id}/soft-lock", payload: { expected_close_period_version: "${per_v1}" }, as: Controller }
            - call: "GET /close/periods/${per_id}"
              payload: {}
              as: Controller
              captures: { per_v2: $.data.version }
            - { call: "POST /close/periods/${per_id}/hard-lock", payload: { expected_close_period_version: "${per_v2}" }, as: Controller }
            - call: "GET /close/periods/${per_id}"
              payload: {}
              as: Controller
              captures: { per_v3: $.data.version, posture: $.data.close_posture }
          trigger:
            - call: "POST /close/periods/${per_id}/reopen"
              payload: { expected_close_period_version: "${per_v3}", reopened_reason: "late adjustment" }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "reopen on HARD_CLOSED period rejected with ERR_PERIOD_HARD_LOCKED"
            - "ClosePeriod.${per_id}.close_posture remains HARD_CLOSED"

      - name: waive_critical_task_returns_task_not_waivable
        claim_type: violation_to_error
        grounds: ["state_machines.CloseTask", "errors[ERR_TASK_NOT_WAIVABLE]"]
        distinguishing_aspect: "Waiving a critical-path task (TRANSLATE) is rejected with ERR_TASK_NOT_WAIVABLE even by the Controller."
        test_recipe:
          setup: ["Period opened; a TRANSLATE task created (no deps → READY)"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/periods/${per_id}/tasks"
              payload: { entity_period_id: "${ep_id}", task_key: "TRANSLATE", title: "Run translation", assignee_user_id: "prep-1", due_offset_hours: 72 }
              as: Controller
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /close/tasks/${t_id}/waive"
              payload: {}
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "waive on TRANSLATE rejected with ERR_TASK_NOT_WAIVABLE"
            - "CloseTask.${t_id}.status remains READY"

      - name: task_dependency_dangling_reference_rejected
        claim_type: violation_to_error
        grounds: ["entities.CloseTask.fields.depends_on_task_ids", "errors[ERR_TASK_DEPENDENCY_CYCLE]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "depends_on_task_ids must reference existing tasks in the same period and keep the graph acyclic; a dependency on a non-existent task id is rejected (dangling deps make the DAG unsatisfiable). The acyclic invariant is enforced at write time."
        test_recipe:
          setup: ["Period opened; one entity-period; one real task T1"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/periods/${per_id}/tasks"
              payload: { entity_period_id: "${ep_id}", task_key: "SL_CUTOFF", title: "T1", assignee_user_id: "prep-1", due_offset_hours: 24 }
              as: Controller
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /close/periods/${per_id}/tasks"
              payload: { entity_period_id: "${ep_id}", task_key: "ACCRUALS", title: "T2 dangling dep", depends_on_task_ids: [ "00000000-0000-0000-0000-000000000000" ], assignee_user_id: "prep-1", due_offset_hours: 48 }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "task create with a dependency on a non-existent task id is rejected (dangling reference → ERR_NOT_FOUND for the referenced id, validated before DAG construction)"
            - "the valid task T1 remains; the invalid T2 is not persisted"

