            - "the filing's filed_iso_week equals the logical clock's Monday"

      - name: validation_lease_application_requires_term_months
        claim_type: conditional_validation
        grounds: ["validations[priority=10]", "errors[ERR_LEASE_TERM_REQUIRED]"]
        distinguishing_aspect: "The term rule applies only to requested_kind LEASE: a LEASE application without requested_term_months is refused with ERR_LEASE_TERM_REQUIRED 422, while an identical REVOLVING application with no term is accepted."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
