      - name: a_rejected_call_is_a_full_rollback_with_no_version_bump_anywhere
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_PROJECT_PHASE
          - endpoints.POST_/exhibit-projects/{id}/closeout
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          The closeout action is the widest write in the API - it settles five money
          buckets, stamps two deliverable flags and moves the phase to
          WARRANTY_CLOSED - so it is the most likely place for an implementation to
          apply part of its work before discovering that the phase precondition fails.
          The instance calls it from FABRICATION and then re-reads the project, the
          drawing and the zone to show that nothing moved and, critically, that no
          version counter advanced: a rejected write must not consume an optimistic
          concurrency token, otherwise a client that retries correctly after fixing
          the phase gets ERR_STALE_PROJECT_VERSION for a write that never happened.
