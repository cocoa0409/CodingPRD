              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /hmda/submissions/${sub_id}/certify"
              payload: { attestation_text: "Cycle one attestation." }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
