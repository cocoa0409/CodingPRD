        distinguishing_aspect: "A second estimate create carrying the pre-first-create application version is rejected 412; with a fresh version it succeeds and supersedes the first estimate."
        test_recipe:
          setup: ["Application in AWAITING_COST_ESTIMATE; client holds application version v from a GET."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "OC1", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
