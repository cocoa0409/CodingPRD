  - rule_id: priority_pair_validation_conflict
    instances:

      - name: enrollment_state_gate_outranks_annual_cap_fiscal_check
        grounds:
          - validations.enrollment-must-be-live-for-triage-approval
          - validations.annual-cap-available
          - errors.ERR_ENROLLMENT_NOT_ACTIVE
          - errors.ERR_ANNUAL_CAP_EXHAUSTED
          - calculations.claim_eligibility_assessment
          - endpoints.POST /claims/{claimId}/triage-decision
        distinguishing_aspect: |
          Both violations sit on the SAME request against the SAME claim, and the test proves the
          low-priority one is genuinely live by first collecting ERR_ANNUAL_CAP_EXHAUSTED on its own
          (cap exhausted, coverage still ACTIVE) and only then suspending the enrollment. The second
          identical call must flip to ERR_ENROLLMENT_NOT_ACTIVE / 409 - priority 30 cross_entity_state
          beats priority 70 business_fiscal - and the 422 must NOT be returned even though the cap is
          still exhausted.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Sewer Guard Basic product (per_occurrence_cap_cents == annual_cap_cents == 600000, permit_covered false, restoration_covered_scope NONE)."
            - "One OR premises enrolled DIRECT_BILL on 2026-08-05; the nightly run at 2026-09-10T08:00:00.000Z activated coverage."
            - "Claim A was approved, dispatched, accepted and COMPLETED for labor 500000 + materials 150000, paying exactly 600000 and driving the enrollment to ANNUAL_CAP_EXHAUSTED."
            - "Claim B is filed AFTER that transition, so the hop-4 sibling cascade has already run and cannot deny it: Claim B sits in TRIAGE with eligibility_assessment CAP_EXHAUSTED."
            - "A control triage approval on Claim B is attempted while coverage is still ACTIVE, capturing the error it produces."
            - "Only then is MISSED_PAYMENT recorded with effective_date 2026-09-10, the clock advanced to 2026-10-10T00:00:00.000Z and the nightly run executed, moving coverage ACTIVE -> SUSPENDED_NONPAY (past_due_since + NONPAY_SUSPENSION_DAYS 30 == 2026-10-10, and NONPAY_LAPSE_DAYS 60 is not yet reached)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Sewer Guard Basic", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 600000, annual_cap_cents: 600000, permit_covered: false, restoration_covered_scope: "NONE", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /contractors"
              payload: { name: "Alder Plumbing", state_code: "OR", license_number: "OR-PL-4471", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 18000, sla_compliance_pct: 92, max_open_dispatches: 5, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_a_id: $.data.id }
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Claim A: curb stop sheared." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_a_id: $.data.id }
            - call: "POST /claims/${claim_a_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Covered curb-stop segment." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_a_v: $.data.version }
            - call: "POST /claims/${claim_a_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim_a_v}", contractor_id: "${c_a_id}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d_a_id: $.data.id }
            - call: "POST /dispatches/${d_a_id}/events"
              payload: { event_type: "ACCEPT" }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
            - call: "POST /dispatches/${d_a_id}/events"
              payload: { event_type: "COMPLETE", labor_cents: 500000, materials_cents: 150000 }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { cap_after_a: $.data.cap_status, coverage_after_a: $.data.coverage_status }
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "METER_TO_HOME", urgency: "ROUTINE", incident_description: "Claim B: second break on the meter-to-home run." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_b_id: $.data.id, claim_b_eligibility: $.data.eligibility_assessment, claim_b_status: $.data.status }
            - call: "POST /claims/${claim_b_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Control attempt while coverage is still ACTIVE." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { control_error: $.data.error_id }
            - call: "POST /enrollments/${enrollment_id}/billing-events"
              payload: { event_type: "MISSED_PAYMENT", effective_date: "2026-09-10", memo: "Direct-bill invoice returned unpaid." }
              as: BillingOps
              as_user_id: "bill-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { coverage_before_trigger: $.data.coverage_status, cap_before_trigger: $.data.cap_status }
          trigger:
            - call: "POST /claims/${claim_b_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Same approval, now with coverage suspended." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { conflict_error: $.data.error_id }
          assert:
            - "${cap_after_a} == ANNUAL_CAP_EXHAUSTED and ${coverage_after_a} == ACTIVE"
            - "${claim_b_status} == TRIAGE and ${claim_b_eligibility} == CAP_EXHAUSTED  # filed after the cascade, so it survived in TRIAGE"
            - "control - ${control_error} == ERR_ANNUAL_CAP_EXHAUSTED with HTTP 422  # the priority-70 violation is genuinely live on its own"
            - "${coverage_before_trigger} == SUSPENDED_NONPAY and ${cap_before_trigger} == ANNUAL_CAP_EXHAUSTED  # BOTH violations now hold"
            - "${conflict_error} == ERR_ENROLLMENT_NOT_ACTIVE with HTTP 409  # priority 30 wins"
            - "${conflict_error} != ERR_ANNUAL_CAP_EXHAUSTED and the response status is NOT 422"
            - "Claim.${claim_b_id}.status == TRIAGE and Claim.${claim_b_id}.version == 1  # both rejections were side-effect free"
            - "Claim.${claim_b_id}.triage_decided_by_user_id == null and triage_decided_at == null"
            - "Claim.${claim_b_id}.eligibility_assessment == COVERAGE_INACTIVE  # the eligibility ladder's own step (1) agrees with the validation priority order"
            - "Enrollment.${enrollment_id}.coverage_status == SUSPENDED_NONPAY and coverage_status != LAPSED  # 2026-10-10 is past NONPAY_SUSPENSION_DAYS 30 but not NONPAY_LAPSE_DAYS 60"

      - name: contractor_licence_safety_check_outranks_certification_referential_check
        grounds:
