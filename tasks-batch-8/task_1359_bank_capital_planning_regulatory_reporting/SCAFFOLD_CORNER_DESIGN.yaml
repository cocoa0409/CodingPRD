              as: CapitalAnalyst
              captures: { i4: $.data.id, hc4: $.data.t2_haircut_pct }
            - call: "POST /banks/${b}/capital-instruments"
              payload: { instrument_class: "T2", instrument_subtype: "SUBORDINATED_DEBT", outstanding_amount_cents: 1000000000, issuance_date: "2020-07-01", maturity_date: "2031-07-01", contractual_rate_bps: 500 }
              as: CapitalAnalyst
              captures: { i5: $.data.id, hc5: $.data.t2_haircut_pct }
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports"
              payload: {}
