  - method: POST
    path: /dispute-cases/{id}/withdraw
    purpose: "Vacate an entered award, compensating the claim back to its pre-award settlement exactly"
    roles: [IDREntity]
    input: [withdrawal_reason]
    output: DisputeCase
    side_effects:
      - "status = WITHDRAWN, idr_award_cents = null, awarded_at = null"
      - "Claim allowed_amount_cents, plan_paid_cents, patient_responsibility_cents, balance_bill_amount_cents, written_off_cents restored from the pre_award_* snapshots; the snapshots are cleared to null"
      - "Claim.status returns to IDR_PENDING"
      - "ComplianceLedgerEntry appended with event_type == IDR_AWARD_WITHDRAWN"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DISPUTE_CASE_NOT_FOUND, ERR_INVALID_DISPUTE_STATE]
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Test-driving endpoint - set the logical clock that stamps every timestamp and drives every date-window status; defaults to 2026-08-01T00:00:00Z before the first call"
    roles: [FacilityAdministrator, ComplianceOfficer, RegistrationClerk, EmergencyPhysician, HospitalTransferCoordinator, PayerRepresentative, IDREntity]
    input: [current_utc]
    output:
      current_utc: string
    side_effects:
      - "the logical clock is set; PayerContract.status, TransferAgreement.status, AmbulanceMOU.status and Facility.signage_attestation_status are re-evaluated on the next read or write"
      - "no entity version is incremented"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: GET
    path: /_clock
    purpose: "Test-driving endpoint - read the current logical clock"
    roles: [FacilityAdministrator, ComplianceOfficer, RegistrationClerk, EmergencyPhysician, HospitalTransferCoordinator, PayerRepresentative, IDREntity]
    input: []
    output:
      current_utc: string
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED]

errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers missing or role unrecognized"
    trigger: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the seven declared roles"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role not permitted for this operation"
    trigger: "the acting role is not in the endpoint's roles list"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The same operator may not perform both halves of this control"
    trigger: "signage attester equals the publisher of the currently published template, or an EMERGENT_WAIVER is recorded by the same operator who registered the encounter"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body or query parameters are malformed"
    trigger: "missing required field, invalid enum member, out-of-range number, end_utc <= start_utc, effective_end_date < effective_start_date, coverage_end_at <= coverage_start_at, code outside the declared category, limit or offset out of range"
  - error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    message: "Facility not found"
    trigger: "unknown facility id in the path"
  - error_id: ERR_DISCLOSURE_TEMPLATE_NOT_FOUND
    http_status: 404
    message: "Disclosure template not found"
    trigger: "unknown disclosure template id in the path"
  - error_id: ERR_PAYER_CONTRACT_NOT_FOUND
    http_status: 404
    message: "Payer contract not found"
    trigger: "unknown payer_contract_id in the path or in the claim-creation body"
  - error_id: ERR_PHYSICIAN_SHIFT_NOT_FOUND
    http_status: 404
    message: "Physician shift not found"
    trigger: "unknown physician shift id in the path"
  - error_id: ERR_VOLUME_FORECAST_NOT_FOUND
    http_status: 404
    message: "Volume forecast not found"
    trigger: "unknown volume forecast id in the path or in the coverage-summary volume_forecast_id query parameter"
  - error_id: ERR_TRANSFER_AGREEMENT_NOT_FOUND
    http_status: 404
    message: "Transfer agreement not found"
    trigger: "unknown transfer_agreement_id in the path or in the transfer-order body"
  - error_id: ERR_AMBULANCE_MOU_NOT_FOUND
    http_status: 404
    message: "Ambulance MOU not found"
    trigger: "unknown ambulance_mou_id in the path or in the transfer-order body"
  - error_id: ERR_ENCOUNTER_NOT_FOUND
    http_status: 404
    message: "Encounter not found"
    trigger: "unknown encounter id in the path"
  - error_id: ERR_ANCILLARY_ORDER_NOT_FOUND
    http_status: 404
    message: "Ancillary order not found"
    trigger: "unknown ancillary order id in the path"
  - error_id: ERR_TRANSFER_ORDER_NOT_FOUND
    http_status: 404
    message: "Transfer order not found"
    trigger: "unknown transfer order id in the path"
  - error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    message: "Claim not found"
    trigger: "unknown claim id in the path"
  - error_id: ERR_DISPUTE_CASE_NOT_FOUND
    http_status: 404
    message: "Dispute case not found"
    trigger: "unknown dispute case id in the path"
  - error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    message: "Facility version is stale; re-read the facility and retry"
    trigger: "expected_facility_version != Facility.version on PATCH /facilities/{id} or POST /disclosure-templates/{id}/publish"
  - error_id: ERR_STALE_ENCOUNTER_VERSION
    http_status: 412
    message: "Encounter version is stale; re-read the encounter and retry"
    trigger: "expected_encounter_version != Encounter.version on POST /encounters/{id}/transfer-orders"
  - error_id: ERR_TEMPLATE_NOT_PUBLISHABLE
    http_status: 409
    message: "Only a DRAFT disclosure template can be published"
    trigger: "publish attempted on a PUBLISHED or RETIRED template"
  - error_id: ERR_DISCLOSURE_DECISION_ALREADY_RECORDED
    http_status: 409
    message: "A disclosure decision has already been recorded for this encounter"
    trigger: "disclosure_state is not DISCLOSURE_PRESENTED when a decision is posted"
  - error_id: ERR_INVALID_ENCOUNTER_STATE
    http_status: 409
    message: "Encounter clinical state does not permit this operation"
    trigger: "the requested clinical transition has no matching from-state, including operations on a TRANSFERRED or DISCHARGED encounter and claim creation before disposition"
  - error_id: ERR_INVALID_ANCILLARY_ORDER_STATE
    http_status: 409
    message: "Ancillary order is not in ORDERED status"
    trigger: "resolve attempted on an order already RESULTED or CANCELLED"
  - error_id: ERR_INVALID_TRANSFER_ORDER_STATE
    http_status: 409
    message: "Transfer order status does not permit this transition"
    trigger: "accept or decline on a non-REQUESTED order, or complete on a non-ACCEPTED order"
  - error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    message: "Claim status does not permit this operation"
    trigger: "adjudicating a non-DRAFT claim, or opening a dispute on a claim that is not ADJUDICATED"
  - error_id: ERR_INVALID_DISPUTE_STATE
    http_status: 409
    message: "Dispute case status does not permit this operation"
    trigger: "a facility offer outside OPEN_NEGOTIATION, a counteroffer outside OFFER_PENDING, IDR initiation outside OPEN_NEGOTIATION, an award outside IDR_INITIATED, or a withdrawal outside AWARDED"
  - error_id: ERR_MSE_NOT_COMPLETE
    http_status: 409
    message: "The medical screening examination must be complete before observation or transfer"
    trigger: "observation admission or transfer-order creation while clinical_state is ARRIVED or MSE_IN_PROGRESS"
  - error_id: ERR_TRANSFER_CERTIFICATION_REQUIRED
    http_status: 422
    message: "Physician certification that transfer benefits outweigh risks is required"
    trigger: "clinical_benefit_certified == false on transfer-order creation"
  - error_id: ERR_STABILIZATION_REQUIRED
    http_status: 422
    message: "An unstable patient may not be discharged and may only be transferred under an unstable-accepting agreement with critical-care transport"
    trigger: "discharge with stabilization_status == UNSTABLE, or a transfer of an UNSTABLE encounter using an agreement with accepts_unstable == false or an MOU whose level_of_care != CRITICAL_CARE"
  - error_id: ERR_WAIVER_NOT_EMERGENT
    http_status: 422
    message: "An emergent disclosure waiver requires acuity level 4 or 5"
    trigger: "decision == EMERGENT_WAIVER on an encounter with acuity_level < 4"
  - error_id: ERR_FACILITY_POSTURE_BLOCKED
    http_status: 409
    message: "Facility compliance posture blocks this operation"
    trigger: "posture SUSPENDED on registration, observation admission or any ancillary order, or posture RESTRICTED with the ordered code in restricted_service_codes"
  - error_id: ERR_NO_PUBLISHED_DISCLOSURE
    http_status: 409
    message: "The facility has no published disclosure template to present at registration"
    trigger: "registration while Facility.current_published_template_id is null"
  - error_id: ERR_SIGNAGE_ELEMENTS_INCOMPLETE
    http_status: 422
    message: "Attested signage elements do not cover every required element"
    trigger: "attested_elements omits an element required by the licensure category or by the published template"
  - error_id: ERR_OUT_OF_SCOPE_SERVICE
    http_status: 422
    message: "Ordered service is outside the facility's licensed on-site scope"
    trigger: "imaging code not in imaging_scope, lab code not in lab_scope, or pharmacy code above pharmacy_scope_tier"
  - error_id: ERR_AGREEMENT_WINDOW_CONFLICT
    http_status: 409
    message: "Transfer agreement window collides with an existing agreement for the same hospital and service line"
    trigger: "the new inclusive window overlaps, touches or is adjacent to any existing agreement's window (gap < 1 day)"
  - error_id: ERR_CLINICIAN_DOUBLE_BOOKED
    http_status: 409
    message: "Clinician already has an overlapping coverage block"
    trigger: "the new half-open [start_utc, end_utc) interval intersects another shift of the same clinician_user_id"
  - error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 422
    message: "Transfer agreement is not active on the current date"
    trigger: "the referenced agreement's status is EXPIRED or PENDING at order creation or acceptance"
  - error_id: ERR_MOU_WINDOW_NOT_COVERING
    http_status: 422
    message: "Ambulance MOU coverage window does not cover the requested transport time"
    trigger: "requested_at outside the half-open [coverage_start_at, coverage_end_at) window, including exactly at coverage_end_at"
  - error_id: ERR_PAYER_CONTRACT_NOT_ACTIVE
    http_status: 422
    message: "Payer contract is not active on the current date"
    trigger: "contract status is not ACTIVE at claim creation or adjudication"
  - error_id: ERR_TRANSFER_CAPABILITY_INSUFFICIENT
    http_status: 422
    message: "Receiving hospital does not cover this service line at the required capability tier"
    trigger: "agreement.service_line != encounter.presenting_service_line, or capability_tier below the acuity's required tier"
  - error_id: ERR_MOU_LEVEL_INSUFFICIENT
    http_status: 422
    message: "Ambulance level of care is insufficient for this acuity"
    trigger: "acuity 4 with a BLS MOU, or acuity 5 with a BLS or ALS MOU"
  - error_id: ERR_IDR_NOT_ELIGIBLE
    http_status: 422
    message: "Claim is not eligible for independent dispute resolution"
    trigger: "the claim's payer contract has idr_eligible == false"
  - error_id: ERR_OBSERVATION_CAPACITY_EXCEEDED
    http_status: 409
    message: "No licensed observation bed is available"
    trigger: "observation_beds_occupied == observation_bed_count at admission"
  - error_id: ERR_AMBULANCE_CAPACITY_EXCEEDED
    http_status: 409
    message: "No ambulance unit is available under this MOU"
    trigger: "the referenced MOU has units_available == 0"
  - error_id: ERR_COVERAGE_CAPACITY_EXCEEDED
    http_status: 409
    message: "Concurrent physician coverage cap exceeded"
    trigger: "adding the shift would make more than max_concurrent_physicians PHYSICIAN shifts overlap some instant"
  - error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    message: "Open-negotiation rounds are exhausted"
    trigger: "a facility offer when round_index has already reached 3"
  - error_id: ERR_NEGOTIATION_NOT_EXHAUSTED
    http_status: 422
    message: "Open negotiation must be exhausted before initiating IDR"
    trigger: "IDR initiation while round_index < 3"
  - error_id: ERR_AWARD_OUT_OF_RANGE
    http_status: 422
    message: "Award must fall between the last offer and the last counteroffer, inclusive"
    trigger: "award_cents outside the inclusive band bounded by last_offer_cents and last_counteroffer_cents"
  - error_id: ERR_DUPLICATE_TEMPLATE_VERSION
    http_status: 409
    message: "Template version label already used at this facility"
    trigger: "version_label collides with an existing template of the same facility"
  - error_id: ERR_CLAIM_ALREADY_EXISTS
    http_status: 409
    message: "A claim already exists for this encounter"
    trigger: "a second claim creation on the same encounter"

roles:
  - name: FacilityAdministrator
    identity: opaque
    description: "Owns facility configuration: licensure fields, ancillary scope, observation bed count, coverage caps, disclosure template drafting and publication, coverage blocks, volume forecasts, transfer agreements and ambulance MOUs"
    exclusive_operations:
      - "POST /facilities"
      - "PATCH /facilities/{id}"
      - "POST /facilities/{id}/disclosure-templates"
      - "POST /disclosure-templates/{id}/publish"
      - "POST /facilities/{id}/physician-shifts"
      - "POST /facilities/{id}/volume-forecasts"
      - "POST /facilities/{id}/ambulance-mous"
    shared_operations:
      - "POST /facilities/{id}/payer-contracts (with ComplianceOfficer)"
      - "POST /facilities/{id}/transfer-agreements (with HospitalTransferCoordinator)"
      - "all facility, encounter, order, claim and dispute reads"
  - name: ComplianceOfficer
    identity: opaque
    description: "Second line of defence: files signage attestations, records payer contracts, opens claims and dispute cases, submits facility offers, initiates IDR and reads the compliance ledger; may never publish a template whose signage it attests"
    exclusive_operations:
      - "POST /facilities/{id}/signage-attestations"
      - "POST /encounters/{id}/claims"
      - "POST /claims/{id}/dispute-cases"
      - "POST /dispute-cases/{id}/initiate-idr"
    shared_operations:
      - "POST /facilities/{id}/payer-contracts (with FacilityAdministrator)"
      - "POST /dispute-cases/{id}/offers (facility side; PayerRepresentative posts the counteroffer)"
      - "GET /facilities/{id}/compliance-ledger-entries (with FacilityAdministrator)"
      - "GET /facilities/{id}/coverage-summary (with FacilityAdministrator)"
  - name: RegistrationClerk
    identity: opaque
    description: "Front-desk operator: registers patients, presents the pinned disclosure and records the patient's disclosure decision"
    exclusive_operations:
      - "POST /facilities/{id}/encounters"
      - "POST /encounters/{id}/disclosure-decision"
    shared_operations:
      - "GET /encounters, GET /encounters/{id}, GET /facilities/{id}, GET /facilities/{id}/disclosure-templates, GET /disclosure-templates/{id}"
  - name: EmergencyPhysician
    identity: opaque
    description: "Clinical operator: performs and completes the medical screening examination, admits to observation, discharges, orders ancillaries and certifies transfers"
    exclusive_operations:
      - "POST /encounters/{id}/begin-mse"
      - "POST /encounters/{id}/complete-mse"
      - "POST /encounters/{id}/observation"
      - "POST /encounters/{id}/discharge"
      - "POST /encounters/{id}/ancillary-orders"
      - "POST /ancillary-orders/{id}/resolve"
      - "POST /encounters/{id}/transfer-orders"
    shared_operations:
      - "encounter, ancillary-order, transfer-order, transfer-agreement and ambulance-MOU reads"
  - name: HospitalTransferCoordinator
    identity: opaque
    description: "Receiving-hospital counterparty: accepts, declines or completes transfer orders and may record transfer agreements"
    exclusive_operations:
      - "POST /transfer-orders/{id}/accept"
      - "POST /transfer-orders/{id}/decline"
      - "POST /transfer-orders/{id}/complete"
    shared_operations:
      - "POST /facilities/{id}/transfer-agreements (with FacilityAdministrator)"
      - "GET /transfer-orders, GET /transfer-orders/{id}, transfer-agreement reads"
  - name: PayerRepresentative
    identity: opaque
    description: "Health plan operator: adjudicates claims and posts payer counteroffers during open negotiation"
    exclusive_operations:
      - "POST /claims/{id}/adjudicate"
    shared_operations:
      - "POST /dispute-cases/{id}/offers (payer side; ComplianceOfficer posts the facility offer)"
      - "GET /claims, GET /claims/{id}, GET /claims/{id}/dispute-cases, GET /dispute-cases/{id}, payer-contract and facility reads"
  - name: IDREntity
    identity: opaque
    description: "Certified independent dispute resolution entity: enters and, when vacated, withdraws the binding award"
    exclusive_operations:
      - "POST /dispute-cases/{id}/award"
      - "POST /dispute-cases/{id}/withdraw"
    shared_operations:
      - "GET /claims, GET /claims/{id}, GET /claims/{id}/dispute-cases, GET /dispute-cases/{id}"
