          - "errors[ERR_UNAUTHORIZED]"
          - "errors[ERR_PLAN_NOT_FOUND]"
        distinguishing_aspect: "Publishing an unknown plan as SalesRep violates both the role rule (priority 20) and the existence rule (priority 40); the answer must be ERR_UNAUTHORIZED 403, never ERR_PLAN_NOT_FOUND 404."
        test_recipe:
          setup:
            - "A Season in PLANNING exists; no SeasonPlan with the probed id exists"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
