  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: trade_executed_then_reversed_preserves_total_faab
        grounds:
          - state_machines.Trade.PENDING_VETO_to_EXECUTED
          - entities.League.fields.total_faab_pool_cents
          - entities.Team.fields.faab_balance_cents
        distinguishing_aspect: |
          Conserved quantity: League.total_faab_pool_cents = sum over all Team.faab_balance_cents
          for teams in this league. After a Trade executes with faab_offered_cents=2000 transferring
          from team_A to team_B, and a counter-Trade then executes transferring the SAME 2000 cents
          back, the sum is invariant. (Note: counter-trade requires VetoVotes to time out / be vetoed
          appropriately — for the test, both trades execute under non-vetoed paths.) Different
          conserved quantity from instance B (player count).
