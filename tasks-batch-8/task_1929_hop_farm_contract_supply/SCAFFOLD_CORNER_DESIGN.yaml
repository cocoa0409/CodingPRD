          assert:
            - "captured err == ERR_FINAL_TEST_REQUIRED and captured st == DELIVERED"

      - name: claim_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "An adjuster whose X-User-ID equals filed_by_user_id is rejected; a different adjuster id reviews successfully."
        test_recipe:
          setup: ["claim FILED by FarmManager user grower-1 on a GROWING plan"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/insurance-claims", payload: { planting_plan_id: "${p_id}", price_election_cents_per_lb: 300 }, as: FarmManager, as_user_id: "grower-1", captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /api/insurance-claims/${claim_id}/begin-review", payload: {}, as: InsuranceAdjuster, as_user_id: "grower-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/insurance-claims/${claim_id}/begin-review", payload: {}, as: InsuranceAdjuster, as_user_id: "adjuster-9", captures: { st: $.data.status } }
          assert:
            - "captured err == ERR_SEGREGATION_OF_DUTIES (same person cannot file and review)"
            - "captured st == UNDER_REVIEW (different adjuster proceeds)"

      - name: duplicate_open_claim_rejected
        claim_type: violation_to_error
        grounds:
