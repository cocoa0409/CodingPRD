        claim_type: Violation → Error
        grounds:
          - concurrency_rules[rate-schedule-activate-stale-contract]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on the contract: after a first schedule activation bumps FacilityContract.version from 1 to 2, a second activation carrying expected_contract_version 1 is rejected with 412 ERR_STALE_VERSION, and succeeds when resent with the fresh version."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cap ST; facility; ACTIVE contract (version captured at creation); DRAFT schedules S1 and S2 with in-cap rates."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "ST", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
            - call: "POST /comm-services/facilities"
              payload: { name: "OCC Facility", state_code: "ST", video_booth_count: 2, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
