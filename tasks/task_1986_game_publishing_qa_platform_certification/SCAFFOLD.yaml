  - status?
  - severity?
  - fixed_in_build_id?
  output: CertFinding[]
  side_effects: []
- method: POST
  path: /qa-cert/cert-findings/{findingId}/transition
  description: mark fixed in a newer build (CertificationLead); verify passed=true -> VERIFIED / passed=false -> OPEN (PlatformReviewer)
  roles:
  - CertificationLead
  - PlatformReviewer
  code: 200
  input:
  - to_status
  - build_id?
  - passed?
  output: CertFinding
  side_effects:
  - Last VERIFIED finding closes the REJECTED package (REJECTED -> CLOSED)
- method: POST
  path: /qa-cert/age-rating-filings
