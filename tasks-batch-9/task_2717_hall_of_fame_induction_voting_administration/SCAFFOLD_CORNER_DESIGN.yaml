              captures: { e2: "$.data.id" }
            - call: "POST /electors/${e1}/credential"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /electors/${e2}/credential"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
