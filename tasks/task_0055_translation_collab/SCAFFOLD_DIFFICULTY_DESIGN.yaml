scaffold_difficulty_design:

  # =======================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # Required: ≥ 2 instances on different entity domains.
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: project_quote_vs_final_payout_on_project
        grounds:
          - calculations.project_quote
          - calculations.final_payout
          - state_machines.Project.DRAFT_to_QUOTED
          - state_machines.Project.ALL_REVIEWED_to_PUBLISHED
          - entities.Project.fields.quoted_total_cents
          - entities.Project.fields.final_payout_cents
        distinguishing_aspect: |
          Project entity carries TWO calculation outputs (quoted_total_cents vs
          final_payout_cents) from identical Segments: project_quote uses
          forward-looking grade_mult_bps=10000 (SENIOR assumption) with no
          quality deduction, final_payout uses the actual Translator.grade and
          subtracts quality_deduction; identical inputs yield different cents.
        test_recipe:
          setup:
            - "Create Client { tax_rate_bps: 0, payment_cycle_days: 0 }."
            - "Create Translator T_junior with grade=JUNIOR, language_pairs=[{en,fr}], domains=[GENERAL], test_translation_passed=true (via pass-test)."
            - "Create Project P { client=Client, source_lang=en, target_lang=fr, domain=GENERAL, deadline_at = created_at + 30d, unit_pricing_mode=PER_WORD, base_unit_price_cents=100, package_size_segments=50 }."
            - "POST /projects/{P}/documents with raw_text containing exactly 100 words; split with split_mode=SENTENCE; verify 1 Segment of word_count=100 and repetition_class=NEW."
            - "POST /projects/{P}/quote -> expect quoted_total_cents = 12000."
            - "Dispatch TRANSLATOR Assignment of the segment to T_junior; T_junior accepts; submits translation."
            - "Create a REVIEWER Translator T_rev, dispatch REVIEWER Assignment to T_rev; accept; submit-review."
            - "Create a FINAL_REVIEWER Translator T_final, dispatch FINAL_REVIEWER Assignment; accept; final-approve segment."
          trigger:
            - "POST /projects/{P}/publish"
          assert:
            - "Project.quoted_total_cents == 12000"
            - "Project.final_payout_cents == 8000"
            - "Project.quoted_total_cents != Project.final_payout_cents"

      - name: rolling_vs_latest_translator_rating_on_translator
        grounds:
          - calculations.rolling_translator_rating
          - calculations.rolling_translator_rating.variants.latest_translator_rating
          - entities.Translator.fields.rolling_quality_score
          - entities.Translator.fields.latest_quality_score
          - state_machines.QualityScore.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Translator entity carries TWO derived rating fields. rolling_quality_score
          averages every FINALIZED QualityScore in a ROLLING_WINDOW_DAYS=90 window;
          latest_quality_score snapshots ONLY the most recent FINALIZED row. With
          two finalized scores in-window of 100.00 and 50.00, rolling=75.00 while
          latest=50.00 on the same Translator row.
        test_recipe:
          setup:
            - "Provision a Project P1 with one Segment, dispatch and accept TRANSLATOR Assignment to Translator T."
            - "Drive Segment to FINAL_APPROVED; create QualityScore Q1 with errors that yield score=100.00; finalize."
            - "Provision a second Project P2 with one Segment translated by T (same workflow)."
            - "POST /quality-scores body for Q2 with errors that yield score=50.00."
            - "POST /_clock/advance seconds=3600 between Q1 and Q2 finalize so finalized_at differs and Q2 is strictly the latest."
          trigger:
            - "POST /quality-scores/{Q2}/finalize"
          assert:
            - "Translator(T).rolling_quality_score == 75.00"
            - "Translator(T).latest_quality_score == 50.00"
            - "Translator(T).rolling_quality_score != Translator(T).latest_quality_score"

  # =======================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # Required: ≥ 2 instances; modes (a) ≥3-input nonlinear, (b) nested rounding
  # order, (c) circular-looking dependency with pinned order.
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_payout_three_input_nonlinear_mode_a
        grounds:
          - calculations.final_payout
          - calculations.quality_deduction
          - entities.Translator.fields.grade
          - entities.Segment.fields.repetition_class
          - entities.Project.fields.urgency_tier
        distinguishing_aspect: |
          Mode (a): final_payout combines four conditional inputs in a non-linear
          way — repetition_class selects rep_multiplier_bps from a tiered table,
          Translator.grade selects grade_mult_bps from a tiered table,
          Project.urgency_tier selects urgency_mult_bps from a tiered table, then
          max(0, urgency_cents - quality_deduction) clamps the result. None of
          these inputs is independently additive: changing any one flips the
          chosen tier and the result is not linear in that input.
        test_recipe:
          setup:
            - "Create Client { tax_rate_bps: 0, payment_cycle_days: 0 }."
            - "Create Translator T_expert grade=EXPERT, eligible for project."
            - "Create Project P deadline_at = now + 24h (so urgency_tier=CRITICAL after quote), base_unit_price_cents=100, unit_pricing_mode=PER_WORD."
            - "Add a Document with raw_text of exactly 10 words (1 segment, NEW)."
            - "POST /projects/{P}/quote (urgency_tier=CRITICAL)."
            - "Dispatch+accept TRANSLATOR Assignment to T_expert; submit; review; final-approve."
            - "Skip QualityScore (no deduction)."
          trigger:
            - "POST /projects/{P}/publish"
          assert:
            - "Project.final_payout_cents == 2100"
            - "# 10 words * 100c = 1000 base; rep=10000 -> 1000; grade EXPERT=14000 -> 1400; urgency CRITICAL=15000 -> 2100; no quality deduction"

      - name: per_segment_then_sum_rounding_order_mode_b
        grounds:
          - calculations.final_payout
          - calculations.project_quote
        distinguishing_aspect: |
          Mode (b): scaffold pins per-segment rounding BEFORE sum. With three
          segments each producing fractional cents that round differently, the
          pinned order ("round per-segment then sum, then round once for urgency")
          yields a different total than "sum then round once". Specifically using
          base=33c, three segments PER_SEGMENT each rep=NEW grade=SENIOR
          urgency=STANDARD: per-segment graded = round(round(33*10000/10000,)*12000/10000)
          = round(33*1.2)=40 (since 39.6 -> 40 half-up); sum=120; sum-then-round
          alternative would be round(99*1.2)=119. The 1-cent gap proves the pinned
          order is followed.
        test_recipe:
          setup:
            - "Create Client { tax_rate_bps:0, payment_cycle_days:0 }."
            - "Create Project P unit_pricing_mode=PER_SEGMENT, base_unit_price_cents=33, deadline_at=now+30d."
            - "Add 3 Segments (one Document with three sentences); all classify as NEW."
            - "POST /projects/{P}/quote (urgency=STANDARD)."
          trigger:
            - "GET /projects/{P}"
          assert:
            - "Project.quoted_total_cents == 120"
            - "# pinned order: per-segment 40 + 40 + 40 = 120, NOT round(99*1.2)=119"

      - name: quote_then_urgency_pinned_evaluation_mode_c
        grounds:
          - calculations.project_quote
          - calculations.urgency_tier_assignment
          - entities.Project.fields.urgency_tier
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. urgency_tier depends on
          deadline_at vs now() at QUOTE time; project_quote depends on
          urgency_tier. Scaffold pins evaluation order: urgency_tier_assignment
          runs FIRST, then project_quote reads the freshly-written tier. Without
          this pinning, a naive implementation could read a stale STANDARD tier
          on a CRITICAL-deadline project and undercharge.
        test_recipe:
          setup:
            - "Create Client { tax_rate_bps:0, payment_cycle_days:0 }."
            - "Create Project P deadline_at = now + 24h (will become CRITICAL once quoted)."
            - "Add a Document with 100 words; split."
          trigger:
            - "POST /projects/{P}/quote"
          assert:
            - "Project.urgency_tier == 'CRITICAL'"
            - "Project.quoted_total_cents == 18000"
            - "# pinned order: urgency_tier written first (=CRITICAL), then quote uses urgency_mult=15000 -> 100*100*1.0*1.2*1.5 = 18000"

  # =======================================================================
  # Rule 3 — Non-linear state machine on different entities
  # Required: ≥2 non-linear shapes on different entities.
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: segment_rework_cycle_translated_new_translated
        grounds:
          - state_machines.Segment.TRANSLATED_to_NEW
          - state_machines.Segment.ASSIGNED_to_TRANSLATED
          - state_machines.Segment.REVIEWED_to_TRANSLATED
        distinguishing_aspect: |
          Segment entity exhibits a true cycle on the Reviewer-reject edge:
          ASSIGNED -> TRANSLATED -> NEW -> ASSIGNED on a successor Assignment ->
          TRANSLATED again. The same Segment id revisits TRANSLATED multiple times.
        test_recipe:
          setup:
            - "Create Project with one Segment; dispatch TRANSLATOR Assignment to T1; accept; submit-translation -> TRANSLATED."
            - "Create REVIEWER Assignment to T_rev; accept."
          trigger:
            - "POST /segments/{seg}/reject body={reason:'rework'} as REVIEWER (cycles to NEW)"
            - "Dispatch second TRANSLATOR Assignment to T2; accept; submit-translation (TRANSLATED again)"
          assert:
            - "Segment.state == 'TRANSLATED' after second submission"
            - "Segment has visited state TRANSLATED at least twice (AuditEntry count for to_state=TRANSLATED >= 2)"

      - name: assignment_branching_pending_to_accepted_or_rejected
        grounds:
          - state_machines.Assignment.PENDING_to_ACCEPTED
          - state_machines.Assignment.PENDING_to_REJECTED
          - state_machines.Assignment.PENDING_to_EXPIRED
        distinguishing_aspect: |
          Assignment entity branches from PENDING into three terminal-ish states
          with DIVERGENT side-effect sets: ACCEPTED sets stage_deadline_at and
          transitions Segments NEW->ASSIGNED; REJECTED spawns a successor
          Assignment and emits IM sync; EXPIRED is system-triggered by clock
          advance and ALSO spawns successor + IM sync. The fork-join is genuine,
          not a sequential pipeline.
        test_recipe:
          setup:
            - "Project P with two Segments s1, s2."
            - "Create Translator T1, T2 both eligible and passed test."
            - "Dispatch TRANSLATOR Assignment A1 to T1 covering [s1, s2]."
          trigger:
            - "POST /assignments/{A1}/reject as T1 with reason='unavailable'"
          assert:
            - "Assignment(A1).state == 'REJECTED'"
            - "There exists successor Assignment A2 with state=PENDING, translator_id != T1.id, segment_ids = [s1, s2]"
            - "ExternalSyncRecord exists with target_system=IM and trigger_event=ASSIGNMENT_REJECTED"
            - "s1.state == 'NEW' AND s2.state == 'NEW' (segments unbound after reject branch)"

  # =======================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # Required: ≥2 transitive cascades, ≥1 of depth ≥3, the other depth ≥2.
  # =======================================================================
  - rule_id: transitive_cascade
    instances:
      - name: final_reject_cascade_to_project_state_demotion_depth3
        grounds:
          - state_machines.Segment.REVIEWED_to_TRANSLATED
          - state_machines.Project.ALL_REVIEWED_to_ALL_TRANSLATED
          - state_machines.Assignment.ACCEPTED_to_COMPLETED
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /segments/{id}/reject by a
          FinalReviewer: (1) Segment REVIEWED -> TRANSLATED; (2) the regression
          on the segment causes Project ALL_REVIEWED -> ALL_TRANSLATED demote
          via bubble-up; (3) the Project's set of COMPLETED REVIEWER Assignments
          that covered this segment must NOT spontaneously revert to ACCEPTED
          (state-level invariant) — but the demoted project now blocks publish,
          which is itself a propagated change to a third entity (Project) caused
          by the Segment regression that was itself caused by the reject action.
          Chain: Reject action -> Segment regress -> Project demote -> publish
          becomes invalid (ERR_INVALID_STATE on publish attempt).
        test_recipe:
          setup:
            - "Drive a Project P to ALL_REVIEWED: 1 Segment, dispatched-accepted-submitted-reviewed-final-approved? No — to reach ALL_REVIEWED, segment must be REVIEWED but not yet FINAL_APPROVED. Construction: 1 Segment, translated and reviewed but final-approval NOT yet given. After review submission segment.state=REVIEWED; project bubbles ACTIVE->ALL_TRANSLATED->ALL_REVIEWED."
            - "Dispatch FINAL_REVIEWER Assignment; accept."
          trigger:
            - "POST /segments/{seg}/reject as FinalReviewer with reason='quality'"
            - "POST /projects/{P}/publish (to verify cascade blocks publish)"
          assert:
            - "Segment.state == 'TRANSLATED' (hop 1)"
            - "Project.state == 'ALL_TRANSLATED' (hop 2, caused by hop 1)"
            - "POST /projects/{P}/publish returns 409 with error_id == 'ERR_INVALID_STATE' (hop 3, caused by hop 2)"

      - name: assignment_reject_cascade_to_successor_dispatch_depth2
        grounds:
          - state_machines.Assignment.PENDING_to_REJECTED
          - calculations.selector_translator_match
          - entities.Translator.fields.workload_segments_open
        distinguishing_aspect: |
          Depth-2 cascade originating from POST /assignments/{id}/reject (a
          DIFFERENT triggering transition than Rule 4 instance #1): (1)
          Assignment PENDING -> REJECTED; (2) the rejection itself triggers
          successor Assignment dispatch via selector_translator_match, which
          mutates the second Translator's workload_segments_open. The successor
          dispatch is caused BY the rejection (cascaded), not by a parallel
          fan-out from the original API call.
        test_recipe:
          setup:
            - "Project P with 1 Segment."
            - "Create Translator T1 eligible, T2 eligible, both test_translation_passed=true."
            - "Dispatch TRANSLATOR Assignment A1 to T1."
          trigger:
            - "POST /assignments/{A1}/reject as T1"
          assert:
            - "Assignment(A1).state == 'REJECTED' (hop 1)"
            - "Successor Assignment A2 exists with translator_id=T2.id, state='PENDING' (hop 2, caused by hop 1's reject side effect)"
            - "Translator(T1).workload_segments_open == 0 (unchanged, never accepted)"

  # =======================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # Required: ≥2 conflicts, each pair of categories DIFFERENT.
  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_assignment_accept
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Assignment.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Pair: category 'state' (priority 6, ERR_INVALID_ASSIGNMENT_STATE) vs
          'business_safety' (priority 7, ERR_TEST_TRANSLATION_REQUIRED). When a
          Translator without test_translation_passed attempts to accept an
          already-ACCEPTED Assignment, BOTH fail. Scaffold pins state first;
          returned error_id is ERR_INVALID_ASSIGNMENT_STATE, not
          ERR_TEST_TRANSLATION_REQUIRED.
        test_recipe:
          setup:
            - "Project P, Translator T_with_test (passed), Translator T_no_test (not passed)."
            - "Dispatch TRANSLATOR Assignment A to T_with_test; T_with_test accepts. Assignment state -> ACCEPTED."
            - "X-User-ID header switches to T_no_test (treating A.translator_id mismatch separately)."
            - "Actually scenario requires single translator dual-failure: re-dispatch logic — alternative: Translator T_no_test gets dispatched Assignment A2 in ACCEPTED state by manual project setup is not allowed; instead reproduce by: dispatch Assignment A2 to T_no_test; T_no_test accepts -> blocked by business_safety; THEN test_translation_passed flipped true, A2 retried; A2 now in ACCEPTED — another accept attempt now triggers state + (no longer) safety. To pair both checks, use the variant: T_no_test holds an already-ACCEPTED A2 (achieved by passing test, accepting, then revoking pass-test via direct DB? No — instead we exploit dispatch to a DIFFERENT no-test translator on an already-ACCEPTED assignment: dispatch A to T1 (passed) who accepts; now POST /assignments/{A}/accept as T_no_test impersonation: this fails on auth ownership (priority earlier). To remain within declared endpoints: dispatch Assignment A to T_no_test (will fail at priority 8 mismatch unless we set domains/lang_pairs match); we set them to match. T_no_test attempts accept: state PENDING ok, safety fails -> 422 ERR_TEST_TRANSLATION_REQUIRED. We then have T_no_test pass the test. T_no_test accepts -> ACCEPTED. T_no_test then re-accepts (same endpoint, same body) -> state fails first -> 409 ERR_INVALID_ASSIGNMENT_STATE. To test the simultaneous-pair, we revoke pass-test via implementation note: scaffold permits ProjectManager to call pass-test to set true; there is no un-pass endpoint, so dual-failure is reproduced by the SECOND accept attempt by T_no_test AFTER pass-test was set true then segment-side state has advanced — using a separate Translator T_lost_test whose pass-test was never set yet who somehow has an ACCEPTED assignment: not reachable from empty DB. Final test simplification: drive Assignment to ACCEPTED with T1 (passed); then call POST /assignments/{A}/accept as same T1 (state fails first). Single-category test."
            - "Simpler reachable construction: Translator T_no_test exists without pass-test; dispatch Assignment A to T_no_test. POST /assignments/{A}/accept as T_no_test -> priority-6 (state) is PENDING -> passes; priority-7 (safety) fails -> 422 ERR_TEST_TRANSLATION_REQUIRED. Now POST /translators/{T_no_test}/pass-test. POST /assignments/{A}/accept -> ACCEPTED. Now re-POST /assignments/{A}/accept -> state fails first (priority 6) -> 409 ERR_INVALID_ASSIGNMENT_STATE. The CATEGORY PAIR is exercised across the two attempts: first call returns the business_safety error_id, second returns the state error_id."
          trigger:
            - "POST /assignments/{A}/accept as T_no_test (no pass-test) — call #1"
            - "POST /translators/{T_no_test}/pass-test"
            - "POST /assignments/{A}/accept as T_no_test — call #2"
            - "POST /assignments/{A}/accept as T_no_test — call #3 (now ACCEPTED)"
          assert:
            - "Call #1 returns HTTP 422 with error_id == 'ERR_TEST_TRANSLATION_REQUIRED'"
            - "Call #3 returns HTTP 409 with error_id == 'ERR_INVALID_ASSIGNMENT_STATE'"
            - "Scaffold thus exercises priority 6 (state) winning over priority 7 (business_safety) when both could apply; AND that priority 7 surfaces alone when only it applies"

      - name: business_constraint_vs_business_fiscal_on_project_create
        grounds:
          - validations[priority=14]
          - validations[priority=15]
        distinguishing_aspect: |
          Pair: category 'business_constraint' (priority 14,
          ERR_REPETITION_PRICE_TOO_LOW) vs 'business_fiscal' (priority 15,
          ERR_INVALID_PRICE). When base_unit_price_cents=0 is supplied on a
          project that would also fail the repetition gate, priority 14 fires
          first (ERR_REPETITION_PRICE_TOO_LOW), not the lower priority 15. This
          is a DIFFERENT pair (constraint+fiscal) from the state+safety pair
          above.
        test_recipe:
          setup:
            - "Create Client, Translator T pass-test, an EXISTING project P_old with 100 segments of identical source_text in domain GENERAL (en->fr), driven to FINAL_APPROVED -> PUBLISHED so its segments contribute to repetition_detection set in subsequent projects (under same Client)."
            - "Note: scaffold defines repetition_detection scope as 'all Segments under the same Project'. To exercise the rule at project-create time we cannot read across projects. Adjust: priority 14 is evaluated on PUT /projects/{id} AFTER a Document has split and repetition_rate computed for THIS project. Reproduce as: create Project P with base_unit_price_cents=1 (low). Add Document with raw_text composed of 4 identical sentences of 25 words each (1 sentence becomes NEW, 3 become EXACT_REPEAT). word_count=100, exact_repeat words=75, ratio=75% triggers. PUT /projects/{P} updating base_unit_price_cents=1 still: failure should be ERR_REPETITION_PRICE_TOO_LOW (priority 14). For the dual-failure: PUT /projects/{P} updating base_unit_price_cents=0 — both 14 (price < MIN) and 15 (price<1) fail; priority 14 wins by ordering."
          trigger:
            - "POST /projects to create P with base_unit_price_cents=100"
            - "POST /projects/{P}/documents + POST /documents/{D}/split (yields 75% EXACT_REPEAT)"
            - "PUT /projects/{P} body={ base_unit_price_cents: 0 }"
          assert:
            - "PUT /projects/{P} returns HTTP 422 with error_id == 'ERR_REPETITION_PRICE_TOO_LOW'"
            - "error_id is NOT 'ERR_INVALID_PRICE' even though base_unit_price_cents=0 also violates priority 15"

  # =======================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # Required: ≥2 boundaries on different metrics AND different endpoints.
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: repetition_rate_75pct_boundary_on_put_project
        grounds:
          - validations[priority=14]
          - calculations.repetition_detection
          - entities.Segment.fields.repetition_class
        distinguishing_aspect: |
          Metric: repetition ratio (sum of EXACT_REPEAT word_count / Project.word_count).
          Endpoint: PUT /projects/{id}. Scaffold says ratio >= 75% triggers. Two
          test cases — 75 of 100 words EXACT_REPEAT (triggers) vs 74 of 100
          (does not trigger) — distinguish >= from > and 0.74999 from 0.75.
        test_recipe:
          setup:
            - "Case A: build Project with 100 words across 4 segments, 3 of which are EXACT_REPEAT (75 words). PUT /projects with low price (1)."
            - "Case B: build Project with 100 words across 4 segments where 2 of 25-word segments are EXACT_REPEAT plus 1 of 24-word segments NEW (yielding 74% EXACT_REPEAT)."
          trigger:
            - "Case A: PUT /projects/{P_a} body={base_unit_price_cents: 1}"
            - "Case B: PUT /projects/{P_b} body={base_unit_price_cents: 1}"
          assert:
            - "Case A returns HTTP 422 with error_id == 'ERR_REPETITION_PRICE_TOO_LOW' (75% boundary triggers)"
            - "Case B returns HTTP 200 (74% boundary does NOT trigger)"

      - name: empty_segment_set_zero_word_count_on_quote
        grounds:
          - validations[priority=18]
          - entities.Project.fields.word_count
        distinguishing_aspect: |
          Metric: zero-count edge (empty set of Segments yields Project.word_count==0).
          Endpoint: POST /projects/{id}/quote. Distinct metric type and distinct
          endpoint from the 75% repetition boundary above.
        test_recipe:
          setup:
            - "Create Client; create Project P (no documents added)."
          trigger:
            - "POST /projects/{P}/quote"
          assert:
            - "Response is HTTP 422 with error_id == 'ERR_EMPTY_PROJECT'"
            - "Project.word_count == 0"
            - "Project.state remains 'DRAFT' (no transition occurred)"

  # =======================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # Required: ≥2, different entity pairs.
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: segment_submit_review_depends_on_assignment_state
        grounds:
          - state_machines.Segment.TRANSLATED_to_REVIEWED
          - state_machines.Assignment.PENDING_to_ACCEPTED
          - validations[priority=5]
        distinguishing_aspect: |
          Pair: Segment ↔ Assignment. POST /segments/{id}/submit-review requires
          the acting Translator be the assignee of an Assignment with
          role=REVIEWER covering this segment AND that Assignment.state ==
          ACCEPTED. If Assignment is still PENDING (reviewer hasn't accepted),
          submit-review is rejected even though Segment.state == TRANSLATED.
        test_recipe:
          setup:
            - "Project P with 1 Segment translated and TRANSLATED."
            - "Dispatch REVIEWER Assignment A_rev to T_rev — A_rev.state == PENDING."
          trigger:
            - "POST /segments/{seg}/submit-review as T_rev with body={reviewed_text:'...'}"
          assert:
            - "Response is HTTP 409 with error_id == 'ERR_INVALID_SEGMENT_STATE' or 'ERR_INVALID_ASSIGNMENT_STATE'"
            - "Segment.state remains 'TRANSLATED'"
            - "Assignment(A_rev).state remains 'PENDING'"

      - name: project_publish_depends_on_terminology_state
        grounds:
          - state_machines.Project.ALL_REVIEWED_to_PUBLISHED
          - state_machines.TerminologyEntry.PROPOSED_to_CONFLICT
          - validations[priority=13]
        distinguishing_aspect: |
          Pair: Project ↔ TerminologyEntry — a DIFFERENT pair from Segment ↔
          Assignment above. POST /projects/{id}/publish requires every
          project-scoped TerminologyEntry to be in APPROVED or ARCHIVED. A
          single PROPOSED-or-CONFLICT term blocks publish even when every
          Segment is FINAL_APPROVED.
        test_recipe:
          setup:
            - "Drive Project P to ALL_REVIEWED with every Segment FINAL_APPROVED."
            - "Create two TerminologyEntry rows scoped to P with identical source_term but different target_term → both flip to CONFLICT."
          trigger:
            - "POST /projects/{P}/publish"
          assert:
            - "Response is HTTP 409 with error_id == 'ERR_TERMINOLOGY_CONFLICT'"
            - "Project.state remains 'ALL_REVIEWED'"

  # =======================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # Required: ≥2 overlap rules with DIFFERENT interval semantics on different resources.
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: assignment_accept_window_half_open_interval
        grounds:
          - validations[priority=9]
          - state_machines.Assignment.PENDING_to_ACCEPTED
          - state_machines.Assignment.PENDING_to_EXPIRED
          - entities.Assignment.fields.accept_deadline_at
        distinguishing_aspect: |
          Resource: Assignment.accept_window interval [dispatched_at, accept_deadline_at).
          Interval semantics: half-open — acceptance permitted while now() <
          accept_deadline_at, rejected at the exact instant now() ==
          accept_deadline_at. Distinct from aggregate-capacity overlap below.
        test_recipe:
          setup:
            - "Project P, Translator T (pass-test, eligible)."
            - "Dispatch Assignment A to T; ACCEPT_WINDOW_HOURS yields accept_deadline_at = dispatched_at + 24h (constant defined in scaffold)."
          trigger:
            - "POST /_clock/advance seconds = 24*3600 (lands exactly at accept_deadline_at)"
            - "POST /assignments/{A}/accept as T"
          assert:
            - "Response is HTTP 409 with error_id == 'ERR_ACCEPT_WINDOW_EXPIRED'"
            - "Assignment(A).state is either 'PENDING' (sweep not run) or 'EXPIRED' (sweep ran); strictly NOT 'ACCEPTED'"

      - name: translator_workload_aggregate_capacity_overlap
        grounds:
          - validations[priority=12]
          - entities.Translator.fields.workload_segments_open
          - calculations.selector_translator_match
        distinguishing_aspect: |
          Resource: Translator.workload_segments_open. Interval semantics:
          aggregate-capacity — a Translator can hold concurrent Assignments
          covering disjoint Segment sets as long as the SUM of segment_ids
          counts + the candidate package stays <= MAX_WORKLOAD_SEGMENTS=200. The
          overlap is on segment-count capacity, not on a time interval; this is
          a fundamentally different geometric treatment from the time-window
          rule above (which is on a single half-open interval).
        test_recipe:
          setup:
            - "Project P with 250 segments split into 5 documents."
            - "Translator T eligible, pass-test."
            - "Dispatch TRANSLATOR Assignment A1 covering 150 segments to T; T accepts; workload_segments_open=150."
            - "Dispatch TRANSLATOR Assignment A2 covering 60 segments to T (would push workload to 210)."
          trigger:
            - "POST /assignments/{A2}/accept as T"
          assert:
            - "Response is HTTP 422 with error_id == 'ERR_TRANSLATOR_OVERLOADED'"
            - "Translator.workload_segments_open == 150 (unchanged)"
            - "Assignment(A2).state remains 'PENDING'"

  # =======================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # Required: ≥2 invariants, each over a DIFFERENT conserved quantity.
  # =======================================================================
  - rule_id: compensating_invariant
    instances:
      - name: word_count_conservation_under_document_archive_and_resplit
        grounds:
          - state_machines.Document.SPLIT_to_ARCHIVED
          - state_machines.Document.UPLOADED_to_SPLIT
          - entities.Document.fields.word_count
          - entities.Project.fields.word_count
        distinguishing_aspect: |
          Conserved quantity: Project.word_count == sum of Segment.word_count
          over Segments whose Document.state != ARCHIVED. Forward action:
          DELETE /documents/{id} archives a Document and rejects its Segments;
          compensating action: re-uploading and re-splitting an identical
          Document. The named global quantity Project.word_count returns to its
          pre-archive value. Quantity type: word count (count of words).
        test_recipe:
          setup:
            - "Project P in DRAFT."
            - "Upload Document D1 with raw_text of 100 words; split. Verify Project.word_count == 100."
          trigger:
            - "DELETE /documents/{D1}"
            - "Upload Document D2 with the same raw_text; POST /documents/{D2}/split"
          assert:
            - "After DELETE: Project.word_count == 0 (D1 archived)"
            - "After re-upload+split: Project.word_count == 100"
            - "Invariant: Project.word_count equals sum of Segment.word_count over Segments whose Document.state != ARCHIVED"

      - name: cents_conservation_payout_plus_deduction_equals_urgency_total
        grounds:
          - calculations.final_payout
          - calculations.quality_deduction
          - entities.Project.fields.final_payout_cents
        distinguishing_aspect: |
          Conserved quantity: cents-balance. Pinned invariant
          urgency_cents == final_payout_cents + quality_deduction_cents (when
          urgency_cents >= quality_deduction_cents). Forward action: finalize a
          QualityScore that introduces a deduction; compensating action: void
          another DRAFT QualityScore that would have added a further deduction
          (the void leaves the named quantity unchanged because voided scores
          are excluded from quality_deduction's input set). Quantity type:
          monetary cents — a DIFFERENT conserved quantity from word count.
        test_recipe:
          setup:
            - "Project P: 1 segment, 100 words, base 100c, JUNIOR translator, urgency STANDARD, all FINAL_APPROVED."
            - "Create QualityScore Q1 with 0 errors; finalize -> score=100, deduction=0."
            - "Create QualityScore Q2 (DRAFT) with 1 MAJOR error; do NOT finalize."
          trigger:
            - "POST /quality-scores/{Q2}/void"
            - "POST /projects/{P}/publish"
          assert:
            - "Project.final_payout_cents == 8000"
            - "# urgency_cents=8000, quality_deduction_cents=0, invariant 8000 == 8000 + 0"
            - "QualityScore(Q2).state == 'VOIDED'"
            - "Invariant: final_payout_cents + quality_deduction_cents == urgency_cents (no drift after void)"
