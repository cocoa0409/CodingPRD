# =============================================================================
# Task 959 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: zone_create_applies_active_default
        claim_type: defaults
        grounds: [entities.Zone.fields.active]
        distinguishing_aspect: "Omitting `active` on zone creation stores the default true."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id, z_active: $.data.active, z_version: $.data.version } }
          trigger:
            - { call: "GET /v1/zones/${zone_id}", as: Dispatcher, captures: { z_active_get: $.data.active } }
          assert:
            - "Zone.active == true on create response and on read-back"
            - "Zone.version == 1 at creation"

      - name: customer_create_system_fields_initialized
        claim_type: system_fields
        grounds: [entities.Customer.fields.account_credit_cents]
        distinguishing_aspect: "Server-minted id/version and system default account_credit_cents=0 on creation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id, credit: $.data.account_credit_cents, ver: $.data.version } }
          trigger:
            - { call: "GET /v1/customers/${cust_id}", as: Dispatcher, captures: { credit2: $.data.account_credit_cents } }
          assert:
            - "Customer.id is a server-minted UUID; version == 1; account_credit_cents == 0 on create and read-back"

      - name: create_ebike_missing_battery_wh_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Bike.fields.battery_wh, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Conditional required field: bike_type=EBIKE without battery_wh is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["one INDIVIDUAL customer"]
          setup_api_calls:
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "EBIKE" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (400); no bike persisted (GET /v1/customers/${cust_id}/bikes returns empty array)"

      - name: create_bike_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Bike.fields.bike_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Enum closure: bike_type=TRIKE is outside {MECHANICAL, EBIKE} and rejected."
        test_recipe:
          setup: ["one INDIVIDUAL customer"]
          setup_api_calls:
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "TRIKE" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (400)"

      - name: get_request_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/service-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: request_list_pagination_fields
        claim_type: listing
        grounds: [response_envelope.pagination_fields]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more."
        test_recipe:
          setup: ["one customer with two bikes and two QUOTED requests"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike1: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike2: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike1}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike2}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T13:00:00Z", window_end: "2026-05-02T14:00:00Z" }, as: Dispatcher }
          trigger:
            - { call: "GET /v1/service-requests", payload: { customer_id: "${cust_id}" }, as: Dispatcher }
          assert:
            - "Response meta pagination: total_count == 2 with default limit 10, has_more == false; a limit=1 query returns 1 item with has_more == true"

      - name: quoted_total_computed_by_server
        claim_type: computed_fields
        grounds: [entities.ServiceRequest.fields.quoted_total_cents, calculations.provisional_quote]
        distinguishing_aspect: "quoted_total_cents is server-computed at creation: INDIVIDUAL BASIC job in a 2500-callout zone quotes 7992 (7400 subtotal, 0 surcharge, 592 tax)."
        test_recipe:
          setup: ["zone 2500, BASIC tier, INDIVIDUAL customer, mechanical bike"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
          trigger:
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { quoted: $.data.quoted_total_cents } }
          assert:
            - "quoted_total_cents == 7992 (2500 callout + 4900 base; subtotal 7400 < 10000 so surcharge 0; tax round_half_up(7400*0.08)=592)"

  - section: state_machines
    instances:
      - name: request_created_in_initial_states
        claim_type: initial_state
        grounds: [state_machines.ServiceRequest.work_status, state_machines.ServiceRequest.billing_status]
        distinguishing_aspect: "New request starts work_status=QUOTED and billing_status=ESTIMATED (both parallel dimensions)."
        test_recipe:
          setup: ["zone, BASIC tier, customer, bike"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
          trigger:
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { ws: $.data.work_status, bs: $.data.billing_status } }
          assert:
            - "work_status == QUOTED and billing_status == ESTIMATED"

      - name: start_service_from_quoted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceRequest.work_status, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "START_SERVICE requires ON_SITE; from QUOTED it fails with ERR_INVALID_STATE and no state change."
        test_recipe:
          setup: ["one QUOTED request"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
          trigger:
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "START_SERVICE" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409); GET shows work_status still QUOTED"

      - name: cancel_from_terminal_cancelled_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.ServiceRequest.work_status, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Terminal CANCELLED is a lockdown state: a second CANCEL fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["one QUOTED request, then cancelled once"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "CANCEL", cancel_reason: "changed mind" }, as: Dispatcher, captures: { ws1: $.data.work_status } }
          trigger:
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "CANCEL" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "First CANCEL: work_status == CANCELLED"
            - "Second CANCEL: error_id == ERR_INVALID_STATE (409); idempotency via rejection, not silent success"

      - name: route_day_lock_unlock_revert
        claim_type: valid_transition
        grounds: [state_machines.RouteDay.OPEN_to_LOCKED, state_machines.RouteDay.LOCKED_to_OPEN]
        distinguishing_aspect: "Branching revert: OPEN -> LOCKED -> OPEN works and only OPEN accepts new stops."
        test_recipe:
          setup: ["van with mechanic; one route day"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
          trigger:
            - { call: "POST /v1/route-days/${rd_id}/events", payload: { event_type: "LOCK" }, as: Dispatcher, captures: { st1: $.data.status } }
            - { call: "POST /v1/route-days/${rd_id}/events", payload: { event_type: "UNLOCK" }, as: Dispatcher, captures: { st2: $.data.status } }
          assert:
            - "status sequence OPEN -> LOCKED -> OPEN (revert branch)"

      - name: stop_done_requires_completed_request
        claim_type: precondition_enforcement
        grounds: [state_machines.RouteStop.ARRIVED_to_DONE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Guarded transition: RouteStop DONE is rejected while the linked request is IN_SERVICE (not COMPLETED)."
        test_recipe:
          setup: ["dispatched request, stop ARRIVED, service started (IN_SERVICE)"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /v1/route-stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "START_SERVICE" }, as: Mechanic, as_user_id: "${mech_id}" }
          trigger:
            - { call: "POST /v1/route-stops/${stop_id}/events", payload: { event_type: "DONE" }, as: Mechanic, as_user_id: "${mech_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409); stop remains ARRIVED"

      - name: hold_parts_resume_cycle_corner
        claim_type: valid_transition
        grounds: [state_machines.ServiceRequest.IN_SERVICE_to_ON_HOLD_PARTS]
        excluded_because:
          difficulty_instance: service_request_parallel_dims_and_parts_hold_cycle
          rationale: "The IN_SERVICE <-> ON_HOLD_PARTS cycle is exercised twice in the named §1.8 instance."

  - section: calculations
    instances:
      - name: warranty_deadline_inclusive_allows_callback
        claim_type: threshold_boundary
        grounds: [calculations.warranty_window]
        distinguishing_aspect: "Warranty threshold is inclusive: callback at exactly completed_at + labor_warranty_days (2026-05-31T00:00:00Z) succeeds."
        test_recipe:
          setup:
            - "Job COMPLETED at the default logical clock 2026-05-01T00:00:00Z (BASIC tier, labor_warranty_days 30, no parts)"
            - "Logical clock then set to exactly the deadline 2026-05-31T00:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /v1/route-stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "START_SERVICE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "COMPLETE", labor_minutes: 40 }, as: Mechanic, as_user_id: "${mech_id}", captures: { completed_at: $.data.completed_at } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/service-requests/${req_id}/callbacks", payload: { window_start: "2026-05-31T10:00:00Z", window_end: "2026-05-31T11:00:00Z", issue_note: "brake rubs again" }, as: Dispatcher, captures: { cb_id: $.data.id, cb_kind: $.data.request_kind, cb_of: $.data.callback_of_id } }
          assert:
            - "201 created at the exact deadline second (inclusive <=): request_kind == CALLBACK, callback_of_id == ${req_id}"
            - "completed_at == 2026-05-01T00:00:00Z (stamped from the logical clock, not wall clock)"

      - name: warranty_deadline_plus_one_second_rejected
        claim_type: threshold_boundary
        grounds: [calculations.warranty_window, "errors[ERR_WARRANTY_EXPIRED]"]
        distinguishing_aspect: "One second past the inclusive deadline the callback fails with ERR_WARRANTY_EXPIRED."
        test_recipe:
          setup:
            - "Job COMPLETED at 2026-05-01T00:00:00Z (BASIC, 30 warranty days); clock set to 2026-05-31T00:00:01Z"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
