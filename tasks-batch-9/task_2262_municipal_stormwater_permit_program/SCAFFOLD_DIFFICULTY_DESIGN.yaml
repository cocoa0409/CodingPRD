      - name: stale_term_version_outranks_pending_sample_block_on_compile
        grounds:
          - validations[priority=60]
          - validations[priority=84]
          - concurrency_rules.OCC_REPORT_COMPILE
          - errors.ERR_PERMIT_TERM_VERSION_CONFLICT
          - errors.ERR_PENDING_SAMPLES_IN_WINDOW
        distinguishing_aspect: |
          concurrency (60) versus state (84) on compile: the caller sends the pre-activation
          PermitTerm version while an unvalidated WET_WEATHER_SAMPLE sits inside the reporting
          window. The OCC rejection must win, so a client that fixes only the pending sample
          still cannot compile — it must re-read the version first.
        test_recipe:
          setup:
            - "PermitTerm created (version 1) then activated (version 2), so the version captured at creation is stale"
            - "all six control measures and outfall OF-01"
            - "one WET_WEATHER_SAMPLE observed 2026-06-15T12:00:00Z left in validation_status PENDING"
            - "a DRAFT AnnualReport for 2026-01-01..2026-12-31"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id, stale_term_v: $.data.version }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-01", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000, sweeping_capacity_lane_miles_per_month: 40.00 }
              as: StormwaterProgramManager
              captures: { of1_id: $.data.id }
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls/${of1_id}/observations"
              payload: { observation_type: "WET_WEATHER_SAMPLE", observed_at: "2026-06-15T12:00:00Z", pollutant_concentration_mg_per_l: 0.45, runoff_volume_kl: 40000 }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
              captures: { samp_id: $.data.id }
            - call: "POST /stormwater/annual-reports"
              payload: { permit_term_id: "${term_id}", reporting_period_start: "2026-01-01", reporting_period_end: "2026-12-31" }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /stormwater/annual-reports/${report_id}/compile"
              payload: { expected_permit_term_version: "${stale_term_v}" }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id ERR_PERMIT_TERM_VERSION_CONFLICT, not ERR_PENDING_SAMPLES_IN_WINDOW (409): priority 60 outranks priority 84"
            - "AnnualReport.${report_id}.status == DRAFT, compiled_at == null, invalidation_count == 0"
            - "OutfallObservation.${samp_id}.validation_status == PENDING and PermitTerm.${term_id}.last_compiled_at == null"
            - "re-reading the current version and retrying with it then returns ERR_PENDING_SAMPLES_IN_WINDOW (409), so both blocks must be cleared in order"

  - rule_id: boundary_precision_check
    instances:

      - name: eru_half_up_at_exact_half_shifts_the_whole_cent_ladder
        grounds:
          - calculations.stormwater_utility_fee
          - entities.StormwaterAccount.fields.eru_units
          - entities.StormwaterAccount.fields.gross_fee_cents
          - entities.StormwaterAccount.fields.class_surcharge_cents
          - endpoints.POST /stormwater/accounts
        distinguishing_aspect: |
          Metric: money in whole cents, plus the 2-decimal round_half_up on eru_units that feeds
          it. Endpoint: POST /stormwater/accounts. 12044 sqft gives 4.014666 -> 4.01 while 12045
          sqft gives exactly 4.015 -> 4.02, and that single hundredth of an ERU moves the tier-3
          component from 65 to 131 cents and the surcharge from 1715.95 -> 1716 to 1719.25 -> 1719.
        test_recipe:
          setup:
            - "ACTIVE permit term with eru_sqft 3000 and all six control measures"
            - "three RESIDENTIAL_MULTI parcels straddling the tier-2/tier-3 break at 4.00 ERU"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
          trigger:
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-12000", owner_name: "Twelve Hundred Flats", parcel_class: "RESIDENTIAL_MULTI", impervious_area_sqft: 12000 }
              as: UtilityBillingClerk
              captures: { acct_lo_id: $.data.id }
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-12044", owner_name: "Fourth Street Flats", parcel_class: "RESIDENTIAL_MULTI", impervious_area_sqft: 12044 }
              as: UtilityBillingClerk
              captures: { acct_mid_id: $.data.id }
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-12045", owner_name: "Fifth Street Flats", parcel_class: "RESIDENTIAL_MULTI", impervious_area_sqft: 12045 }
              as: UtilityBillingClerk
              captures: { acct_hi_id: $.data.id }
          assert:
            - "StormwaterAccount.${acct_lo_id}: eru_units == 4.00, gross_fee_cents == 34254 (9633 + 24621 + 0), class_surcharge_cents == 1713, gross_billable_cents == 35967"
            - "StormwaterAccount.${acct_mid_id}: eru_units == 4.01 (12044/3000 = 4.014666 rounds down), gross_fee_cents == 34319 (9633 + 24621 + 65), class_surcharge_cents == 1716 from 1715.95, gross_billable_cents == 36035"
            - "StormwaterAccount.${acct_hi_id}: eru_units == 4.02 (12045/3000 = 4.015 rounds UP under round_half_up), gross_fee_cents == 34385 (9633 + 24621 + 131), class_surcharge_cents == 1719 from 1719.25, gross_billable_cents == 36104"
            - "every money field is an integer number of cents: no response carries a fractional cent"
            - "banker's rounding on eru_units would give 4.02 -> 4.02 but 4.015 -> 4.02 as well only by luck; truncation would give 4.01 and a 36035 bill, which is wrong"
            - "PermitTerm.${term_id}.projected_annual_revenue_cents == 108106, the sum 35967 + 36035 + 36104"

      - name: pollutant_load_holds_four_decimals_per_sample_and_treats_equality_as_attaining
        grounds:
          - calculations.outfall_annual_pollutant_load
          - calculations.sweeping_load_reduction_credit
          - entities.Outfall.fields.tmdl_status
          - endpoints.POST /stormwater/outfalls/{id}/load-assessments
        distinguishing_aspect: |
          Metric: pounds of pollutant at 4 decimals per sample and 2 decimals for the totals,
          plus the strict greater-than comparison against the waste load allocation. Endpoint:
          POST /stormwater/outfalls/{id}/load-assessments. Two independent boundaries are pinned:
          1.1023 + 5.0927 = 6.1950 -> 6.20 (carrying full precision to the end gives 6.19), and a
          net load of exactly 50.00 against a 50.00 allocation is ATTAINING, not EXCEEDING.
        test_recipe:
          setup:
            - "ACTIVE permit term with tmdl_applicable true, tmdl_wla_lb_per_year 50.00 and all six control measures"
            - "outfall OF-A with one VALIDATED 2026 sample of 0.63 mg/L over 36000 kL"
            - "outfall OF-B with two VALIDATED 2026 samples: 0.10 over 5000 kL and 0.11 over 21000 kL"
            - "samples are recorded by ops-01 and validated by mgr-01 so the segregation rule is satisfied"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: true, tmdl_pollutant: "TOTAL_PHOSPHORUS", tmdl_wla_lb_per_year: 50.00, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-A", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000, sweeping_capacity_lane_miles_per_month: 40.00 }
              as: StormwaterProgramManager
              captures: { ofa_id: $.data.id }
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-B", receiving_water: "Bell Slough", drainage_area_acres: 9.00, priority_tier: "LOW", baseline_concentration_mg_per_l: 0.10, design_runoff_kl: 5000, sweeping_capacity_lane_miles_per_month: 10.00 }
              as: StormwaterProgramManager
              captures: { ofb_id: $.data.id }
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls/${ofa_id}/observations"
              payload: { observation_type: "WET_WEATHER_SAMPLE", observed_at: "2026-03-10T09:00:00Z", pollutant_concentration_mg_per_l: 0.63, runoff_volume_kl: 36000 }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
              captures: { sa1_id: $.data.id }
            - call: "POST /stormwater/observations/${sa1_id}/validate"
              payload: { decision: "VALIDATE" }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
            - call: "POST /stormwater/outfalls/${ofb_id}/observations"
              payload: { observation_type: "WET_WEATHER_SAMPLE", observed_at: "2026-04-02T09:00:00Z", pollutant_concentration_mg_per_l: 0.10, runoff_volume_kl: 5000 }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
              captures: { sb1_id: $.data.id }
            - call: "POST /stormwater/observations/${sb1_id}/validate"
              payload: { decision: "VALIDATE" }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
            - call: "POST /stormwater/outfalls/${ofb_id}/observations"
              payload: { observation_type: "WET_WEATHER_SAMPLE", observed_at: "2026-05-18T09:00:00Z", pollutant_concentration_mg_per_l: 0.11, runoff_volume_kl: 21000 }
              as: MunicipalOperationsSupervisor
