# =============================================================================
# §1.9 Scaffold Corner Design — cattle-feedlot-closeout
# Breadth probe: enumerative coverage of testable claims from §1.1–§1.7 that
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already cover. Section and
# claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: owner_create_applies_defaults
        claim_type: creation
        grounds: [entities.Owner, "endpoints[POST /feedlot/owners]"]
        distinguishing_aspect: "A valid POST /feedlot/owners returns 201 with server-minted id, status ACTIVE, outstanding_balance_cents 0, version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-ENT", billing_email: "ent@x.com" }
              as: FeedyardManager
              captures: { st: $.data.status, bal: $.data.outstanding_balance_cents, v: $.data.version }
          assert:
            - "st == ACTIVE and bal == 0 and v == 1"

      - name: lot_create_derives_counters_and_defaults
        claim_type: defaults
        grounds: [entities.Lot.fields.commingle_allowed, entities.Lot.fields.head_count_current, entities.Lot.fields.provisional_cog_cents_per_cwt]
        distinguishing_aspect: "Omitting commingle_allowed defaults it to false; head_count_current derives as head_count_in; provisional COG is null while projected gain is zero (default clock 2026-08-01 equals arrival)."
        test_recipe:
          setup: ["Owner exists"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-ENT2", billing_email: "ent2@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-ENT2", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { hc: $.data.head_count_current, cm: $.data.commingle_allowed, st: $.data.status, pc: $.data.provisional_cog_cents_per_cwt }
          assert:
            - "hc == 5 (computed from head_count_in, total_deaths 0, head_shipped 0)"
            - "cm == false (default applied)"
            - "st == OPEN"
            - "pc is null (days_on_feed 0 -> projected gain 0 -> null, not an error)"

      - name: lot_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Lot.fields.head_count_current]
        distinguishing_aspect: "Client-supplied values for computed fields are ignored: posting head_count_current 999 still yields the server-computed value 5."
        test_recipe:
          setup: ["Owner exists"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-ENT3", billing_email: "ent3@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-ENT3", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01", head_count_current: 999 }
              as: FeedyardManager
              captures: { hc: $.data.head_count_current }
          assert:
            - "hc == 5 (input value 999 for the computed field was ignored)"

      - name: pen_code_uniqueness_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_PEN_CODE]"]
        distinguishing_aspect: "pen_code is unique yard-wide: a second pen with the same code fails with ERR_DUPLICATE_PEN_CODE."
        test_recipe:
          setup: ["Pen K-01 exists"]
          setup_api_calls:
            - call: "POST /feedlot/pens"
              payload: { pen_code: "K-01", capacity_head: 50 }
              as: FeedyardManager
          trigger:
            - call: "POST /feedlot/pens"
              payload: { pen_code: "K-01", capacity_head: 80 }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_PEN_CODE"

      - name: lot_number_uniqueness_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_LOT_NUMBER]"]
        distinguishing_aspect: "lot_number is unique yard-wide, even across different owners."
        test_recipe:
          setup: ["Two owners exist; lot L-DUP exists under the first"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-DUP1", billing_email: "d1@x.com" }
              as: FeedyardManager
              captures: { o1: $.data.id }
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-DUP2", billing_email: "d2@x.com" }
              as: FeedyardManager
              captures: { o2: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o1}", lot_number: "L-DUP", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
          trigger:
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o2}", lot_number: "L-DUP", sex_class: "HEIFER", head_count_in: 3, in_weight_total_lbs: 2100, purchase_cost_cents: 420000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_LOT_NUMBER"

      - name: get_unknown_lot_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_LOT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent lot id returns 404 ERR_LOT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /feedlot/lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LOT_NOT_FOUND (http 404)"

      - name: assignment_body_fk_unknown_pen_returns_404
        claim_type: parent_relationships
        grounds: ["validations[priority=4]", entities.PenAssignment.fields.pen_id]
        distinguishing_aspect: "Body foreign keys are validated for existence: an assignment naming a nonexistent pen_id fails with ERR_PEN_NOT_FOUND (404), not a generic 400."
        test_recipe:
          setup: ["Owner and lot exist"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-FK", billing_email: "fk@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-FK", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", lot_id: "${l_id}", head_count: 5, start_date: "2026-08-01" }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PEN_NOT_FOUND (http 404; body FKs are checked at existence priority 4)"

      - name: list_pagination_envelope_shape
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /feedlot/pens]"]
        distinguishing_aspect: "List endpoints honor limit/offset with the fixed envelope: 3 pens, limit=2 offset=2 returns exactly 1 row with total_count 3 and has_more false, inside the standard meta envelope."
        test_recipe:
          setup: ["Three pens P-ENUM-1/2/3 exist"]
          setup_api_calls:
            - call: "POST /feedlot/pens"
              payload: { pen_code: "P-ENUM-1", capacity_head: 50 }
              as: FeedyardManager
            - call: "POST /feedlot/pens"
              payload: { pen_code: "P-ENUM-2", capacity_head: 50 }
              as: FeedyardManager
            - call: "POST /feedlot/pens"
              payload: { pen_code: "P-ENUM-3", capacity_head: 50 }
              as: FeedyardManager
          trigger:
            - call: "GET /feedlot/pens?limit=2&offset=2"
              as: Any
              captures: { last_code: "$.data[0].pen_code" }
          assert:
            - "response data has exactly 1 pen (the third, created_at ASC order)"
            - "last_code == P-ENUM-3"
            - "pagination fields present: total_count == 3, has_more == false, limit == 2, offset == 2"
            - "meta.api_request_id and meta.api_request_timestamp present; response_type == array"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: fail_sale_from_open_lot_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Lot.MARKETED_to_OPEN, "errors[ERR_LOT_NOT_MARKETED]"]
        distinguishing_aspect: "fail-sale is only legal from MARKETED: on an OPEN lot it fails with ERR_LOT_NOT_MARKETED and the lot stays OPEN."
        test_recipe:
          setup: ["Lot L-SM1 OPEN with 5 head"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM1", billing_email: "sm1@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-SM1", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /feedlot/lots/${l_id}/fail-sale"
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LOT_NOT_MARKETED"

      - name: settled_lot_terminal_lockdown_market_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Lot, "errors[ERR_LOT_NOT_OPEN]"]
        distinguishing_aspect: "SETTLED is terminal: after full close-out and invoice payment, marketing the lot fails with ERR_LOT_NOT_OPEN."
        test_recipe:
          setup: ["Lot L-SM2 fully settled: shipped 2026-08-02, close-out confirmed (invoice 90c), invoice paid exactly"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM2", billing_email: "sm2@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-SM2", sex_class: "HEIFER", head_count_in: 2, in_weight_total_lbs: 1400, purchase_cost_cents: 280000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
            - call: "POST /feedlot/lots/${l_id}/ship"
              payload: { ship_date: "2026-08-02", out_weight_total_lbs: 1500 }
              as: FeedyardManager
              captures: { lot_v: $.data.version }
            - call: "POST /feedlot/close-outs"
              payload: { lot_id: "${l_id}", pricing_basis: "PER_CARCASS", grid_base_price_cents_per_cwt: 18537, expected_lot_version: "${lot_v}" }
              as: RiskManager
              captures: { co_id: $.data.id }
            - call: "POST /feedlot/close-outs/${co_id}/confirm"
              payload:
                carcass_records:
                  - { hot_carcass_weight_lbs: 763, quality_grade: "CHOICE", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 812, quality_grade: "SELECT", yield_grade: 4 }
              as: RiskManager
            - call: "GET /feedlot/lots/${l_id}/invoices"
              as: Any
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /feedlot/invoices/${inv_id}/payments"
              payload: { amount_cents: 90, payment_date: "2026-08-02" }
              as: BillingClerk
              captures: { pay_status: $.data.status }
          trigger:
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "pay_status == PAID (lot is now SETTLED)"
            - "err == ERR_LOT_NOT_OPEN"

      - name: pen_maintenance_blocks_new_assignment
        claim_type: precondition_enforcement
        grounds: [state_machines.Pen, "validations[priority=7]", "errors[ERR_PEN_IN_MAINTENANCE]"]
        distinguishing_aspect: "A pen in MAINTENANCE refuses new assignments with ERR_PEN_IN_MAINTENANCE."
        test_recipe:
          setup: ["Pen M-01 in MAINTENANCE; lot L-SM3 OPEN with 5 head"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM3", billing_email: "sm3@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "M-01", capacity_head: 50 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "PATCH /feedlot/pens/${p_id}"
              payload: { status: "MAINTENANCE" }
              as: FeedyardManager
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-SM3", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${l_id}", head_count: 5, start_date: "2026-08-01" }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PEN_IN_MAINTENANCE"

      - name: occupied_pen_cannot_enter_maintenance
        claim_type: precondition_enforcement
        grounds: [state_machines.Pen.EMPTY_to_MAINTENANCE, "errors[ERR_PEN_OCCUPIED]"]
        distinguishing_aspect: "An OCCUPIED pen cannot enter maintenance: PATCH to MAINTENANCE fails with ERR_PEN_OCCUPIED."
        test_recipe:
          setup: ["Pen M-02 OCCUPIED by lot L-SM4 (5 head)"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM4", billing_email: "sm4@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "M-02", capacity_head: 50 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-SM4", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${l_id}", head_count: 5, start_date: "2026-08-01" }
              as: FeedyardManager
          trigger:
            - call: "PATCH /feedlot/pens/${p_id}"
              payload: { status: "MAINTENANCE" }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PEN_OCCUPIED"

      - name: owner_patch_same_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Owner, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "PATCHing an ACTIVE owner to ACTIVE (no-op transition) is rejected with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Owner ACTIVE"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM5", billing_email: "sm5@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
          trigger:
            - call: "PATCH /feedlot/owners/${o_id}"
              payload: { status: "ACTIVE" }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: assignment_end_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PenAssignment.ACTIVE_to_ENDED, "errors[ERR_ASSIGNMENT_ALREADY_ENDED]"]
        distinguishing_aspect: "Ending an already-ENDED assignment fails with ERR_ASSIGNMENT_ALREADY_ENDED."
        test_recipe:
          setup: ["Lot L-SM6 with 5 head assigned to pen M-03 since 2026-08-01; assignment ended 2026-08-05"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM6", billing_email: "sm6@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "M-03", capacity_head: 50 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-SM6", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${l_id}", head_count: 5, start_date: "2026-08-01" }
              as: FeedyardManager
              captures: { a_id: $.data.id }
            - call: "POST /feedlot/assignments/${a_id}/end"
              payload: { end_date: "2026-08-05" }
              as: FeedyardManager
          trigger:
            - call: "POST /feedlot/assignments/${a_id}/end"
              payload: { end_date: "2026-08-06" }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ASSIGNMENT_ALREADY_ENDED"

      - name: claim_pay_before_decide_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.InsuranceClaim.APPROVED_to_PAID, "errors[ERR_CLAIM_INVALID_STATE]"]
        distinguishing_aspect: "pay on an UNDER_REVIEW claim fails with ERR_CLAIM_INVALID_STATE (segregation-of-duties cannot fire first: decided_by_user_id is still null)."
        test_recipe:
          setup: ["Lot L-SM7 (5 head, purchase 700000c); insured death loss of 1 head on 2026-08-01 (value 140000c); claim 100000c filed, still UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM7", billing_email: "sm7@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-SM7", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-01", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 100000 }
              as: CattleHealthTech
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /feedlot/insurance-claims/${c_id}/pay"
              as: ClaimsTreasurer
              as_user_id: "tre-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLAIM_INVALID_STATE"

      - name: claim_second_appeal_rejected
        claim_type: boundary_value
        grounds: [state_machines.InsuranceClaim.DENIED_to_UNDER_REVIEW, "errors[ERR_APPEAL_LIMIT_REACHED]"]
        distinguishing_aspect: "appeal_count boundary: the first appeal (count 0 -> 1) succeeds; a second appeal after re-denial (count already 1) fails with ERR_APPEAL_LIMIT_REACHED."
        test_recipe:
          setup: ["Claim on insured loss has been denied once and appealed once (appeal_count == 1), then denied again"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM8", billing_email: "sm8@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-SM8", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-01", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 100000 }
              as: CattleHealthTech
              captures: { c_id: $.data.id }
            - call: "POST /feedlot/insurance-claims/${c_id}/decide"
              payload: { decision: "DENY" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /feedlot/insurance-claims/${c_id}/appeal"
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /feedlot/insurance-claims/${c_id}/decide"
              payload: { decision: "DENY" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
          trigger:
            - call: "POST /feedlot/insurance-claims/${c_id}/appeal"
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_APPEAL_LIMIT_REACHED"

      - name: hedge_offset_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.HedgePosition.OPEN_to_OFFSET, "errors[ERR_HEDGE_NOT_OPEN]"]
        distinguishing_aspect: "Offsetting an already-OFFSET hedge fails with ERR_HEDGE_NOT_OPEN and does not change realized P&L again."
        test_recipe:
          setup: ["Lot L-SM9 (80 head, avg 1000 lbs -> marketable 1200 cwt); hedge of 1 contract at 19000c offset at 18900c"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM9", billing_email: "sm9@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-SM9", sex_class: "STEER", head_count_in: 80, in_weight_total_lbs: 80000, purchase_cost_cents: 9600000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id, lot_v: $.data.version }
            - call: "POST /feedlot/hedges"
