# =============================================================================
# §1.9 Scaffold Corner Design — task_3010 Subscribe & Save
# Breadth probe: every testable claim in §1.1–§1.7 not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. §1.8-covered corners appear as
# excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: customer_create_applies_default_delivery_day_and_system_fields
        claim_type: Defaults
        grounds:
          - entities.Customer.fields.preferred_delivery_day
          - endpoints.POST_/sns/customers
        distinguishing_aspect: "Omitting preferred_delivery_day yields 15, account_status ACTIVE, version 1, and server-stamped id/created_at/updated_at."
        test_recipe:
          setup: ["Logical clock at default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &k_clock
              call: "POST /sns/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sns/customers"
              payload: { email: "k@x.com", full_name: "K Customer", region: "US-WEST" }
              as: PlatformAdmin
              captures: { kc_id: $.data.id }
          assert:
            - "Customer.${kc_id}.preferred_delivery_day == 15"
            - "Customer.${kc_id}.account_status == ACTIVE"
            - "Customer.${kc_id}.credit_balance_cents == 0"
            - "Customer.${kc_id}.version == 1"
            - "response carries non-null id, created_at, updated_at and meta.api_request_id"

      - name: product_create_computed_fields_before_stock_and_price
        claim_type: Computed Fields
        grounds:
          - entities.Product.fields.availability_status
          - entities.Product.fields.current_price_cents
          - calculations.availability_derivation
        distinguishing_aspect: "A product with no price events and no stock reports current_price_cents null and availability_status OUT_OF_STOCK — both computed, never client-supplied."
        test_recipe:
          setup: ["Logical clock default. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /sns/products"
              payload: { sku: "K-C1", name: "Corner Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { kp_id: $.data.id }
          assert:
            - "Product.${kp_id}.current_price_cents is null"
            - "Product.${kp_id}.availability_status == OUT_OF_STOCK"
            - "Product.${kp_id}.subscription_eligible == true and discontinued == false (defaults)"

      - name: subscription_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_SUBSCRIPTION_NOT_FOUND]
          - endpoints.GET_/sns/subscriptions/{id}
        distinguishing_aspect: "GET with a well-formed but absent UUID yields 404 ERR_SUBSCRIPTION_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Logical clock default. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /sns/subscriptions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { knf_err: $.data.error_id }
          assert:
            - "knf_err == \"ERR_SUBSCRIPTION_NOT_FOUND\""
            - "HTTP status is 404 and response_type == error"

      - name: price_event_is_append_only_without_version_or_update
        claim_type: Immutability
        grounds:
          - entities.PriceEvent
        distinguishing_aspect: "PriceEvent has common_fields: false — the created record carries id and created_at but no version and no updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Logical clock default. One product."]
          setup_api_calls:
            - *k_clock
            - &k_prod0
              call: "POST /sns/products"
              payload: { sku: "K-PE", name: "PE Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { kpe_prod: $.data.id }
          trigger:
            - call: "POST /sns/products/${kpe_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { kpe_id: $.data.id }
          assert:
            - "the PriceEvent response has no version key and no updated_at key"
            - "PriceEvent.${kpe_id}.price_cents == 1000 and product_id == ${kpe_prod}"

      - name: cadence_advance_month_end_clamps_oct31_to_nov30
        claim_type: Computed Fields
        grounds:
          - calculations.next_delivery_date_compute
          - entities.Subscription.fields.next_delivery_date
        distinguishing_aspect: "A subscription starting 2026-10-31 with cadence 1 advances to 2026-11-30 (not the invalid 2026-11-31) after the October plan generation — month-end clamping."
        test_recipe:
          setup: ["Logical clock default. Customer, stocked priced product, one subscription cadence 1 start 2026-10-31."]
          setup_api_calls:
            - *k_clock
            - &kc5_cust
              call: "POST /sns/customers"
              payload: { email: "kc5@x.com", full_name: "K Clamp", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { kc5_cust: $.data.id }
            - &kc5_prod
              call: "POST /sns/products"
              payload: { sku: "K-C5", name: "Clamp Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { kc5_prod: $.data.id }
            - call: "POST /sns/products/${kc5_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${kc5_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { kc5_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${kc5_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${kc5_cust}", product_id: "${kc5_prod}", cadence_months: 1, quantity: 1, start_date: "2026-10-31" }
              as: Customer
              as_user_id: "${kc5_cust}"
              captures: { kc5_sub: $.data.id }
          trigger:
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-10" }
              as: PlatformAdmin
          assert:
            - "after generation, Subscription.${kc5_sub}.next_delivery_date == \"2026-11-30\""
            - "the generated plan's delivery_date == \"2026-10-10\" (preferred day 10 in October)"

      - name: subscriptions_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/sns/customers/{id}/subscriptions
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three subscriptions with limit=2 return total_count 3 and has_more true; offset=2 returns the last row with has_more false."
        test_recipe:
          setup: ["Logical clock default. Customer with three ACTIVE subscriptions on a stocked priced product."]
          setup_api_calls:
            - *k_clock
            - &kc6_cust
              call: "POST /sns/customers"
              payload: { email: "kc6@x.com", full_name: "K Page", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { kc6_cust: $.data.id }
            - &kc6_prod
              call: "POST /sns/products"
              payload: { sku: "K-C6", name: "Page Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { kc6_prod: $.data.id }
            - call: "POST /sns/products/${kc6_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${kc6_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { kc6_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${kc6_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${kc6_cust}", product_id: "${kc6_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${kc6_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${kc6_cust}", product_id: "${kc6_prod}", cadence_months: 2, quantity: 1, start_date: "2026-09-11" }
              as: Customer
              as_user_id: "${kc6_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${kc6_cust}", product_id: "${kc6_prod}", cadence_months: 3, quantity: 1, start_date: "2026-09-12" }
              as: Customer
              as_user_id: "${kc6_cust}"
          trigger:
            - call: "GET /sns/customers/${kc6_cust}/subscriptions"
              payload: { limit: 2, offset: 0 }
              as: Customer
              as_user_id: "${kc6_cust}"
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "a second call with limit 2 offset 2 returns exactly 1 row with total_count == 3 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: subscription_created_in_active_with_start_date_as_next_delivery
        claim_type: Initial State
        grounds:
          - state_machines.Subscription
          - entities.Subscription.fields.subscribe_price_cents
        distinguishing_aspect: "A new subscription starts ACTIVE, next_delivery_date equals start_date, and subscribe_price_cents snapshots the current 1000-cent price."
        test_recipe:
          setup: ["Logical clock default. Customer, stocked product priced 1000."]
          setup_api_calls:
            - *k_clock
            - &ks1_cust
              call: "POST /sns/customers"
              payload: { email: "ks1@x.com", full_name: "K State", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { ks1_cust: $.data.id }
            - &ks1_prod
              call: "POST /sns/products"
              payload: { sku: "K-S1", name: "State Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks1_prod: $.data.id }
            - call: "POST /sns/products/${ks1_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${ks1_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks1_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${ks1_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
          trigger:
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${ks1_cust}", product_id: "${ks1_prod}", cadence_months: 2, quantity: 3, start_date: "2026-09-20" }
              as: Customer
              as_user_id: "${ks1_cust}"
              captures: { ks1_sub: $.data.id }
          assert:
            - "Subscription.${ks1_sub}.status == ACTIVE"
            - "Subscription.${ks1_sub}.next_delivery_date == \"2026-09-20\""
            - "Subscription.${ks1_sub}.subscribe_price_cents == 1000"
            - "Subscription.${ks1_sub}.price_cap_cents is null"

      - name: pause_from_pending_cancel_returns_subscription_not_active
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
        distinguishing_aspect: "Pause is only declared from ACTIVE; a PENDING_CANCEL subscription rejects pause with ERR_SUBSCRIPTION_NOT_ACTIVE and no state change."
        test_recipe:
          setup: ["Logical clock default. Customer, stocked priced product, one subscription moved to PENDING_CANCEL via cancel."]
          setup_api_calls:
            - *k_clock
            - &ks2_cust
              call: "POST /sns/customers"
              payload: { email: "ks2@x.com", full_name: "K Pause", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { ks2_cust: $.data.id }
            - &ks2_prod
              call: "POST /sns/products"
              payload: { sku: "K-S2", name: "Pause Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks2_prod: $.data.id }
            - call: "POST /sns/products/${ks2_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${ks2_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks2_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${ks2_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${ks2_cust}", product_id: "${ks2_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${ks2_cust}"
              captures: { ks2_sub: $.data.id }
            - call: "POST /sns/subscriptions/${ks2_sub}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${ks2_cust}"
          trigger:
            - call: "POST /sns/subscriptions/${ks2_sub}/pause"
              payload: {}
              as: Customer
              as_user_id: "${ks2_cust}"
              captures: { ks2_err: $.data.error_id }
          assert:
            - "ks2_err == \"ERR_SUBSCRIPTION_NOT_ACTIVE\" with HTTP 409"
            - "Subscription.${ks2_sub}.status == PENDING_CANCEL (unchanged)"

      - name: lock_a_locked_plan_returns_plan_not_open
        claim_type: Idempotency
        grounds:
          - state_machines.DeliveryPlan.OPEN_to_LOCKED
          - errors[ERR_PLAN_NOT_OPEN]
        distinguishing_aspect: "The second lock of an already LOCKED plan fails with ERR_PLAN_NOT_OPEN — the trigger is not declared from LOCKED."
        test_recipe:
          setup: ["Logical clock default. Customer, stocked priced product, one subscription, plan generated and locked."]
          setup_api_calls:
            - *k_clock
            - &ks3_cust
              call: "POST /sns/customers"
              payload: { email: "ks3@x.com", full_name: "K Lock", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { ks3_cust: $.data.id }
            - &ks3_prod
              call: "POST /sns/products"
              payload: { sku: "K-S3", name: "Lock Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks3_prod: $.data.id }
            - call: "POST /sns/products/${ks3_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${ks3_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks3_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${ks3_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${ks3_cust}", product_id: "${ks3_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${ks3_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { ks3_plan: "$.data[0].id" }
            - call: "POST /sns/delivery-plans/${ks3_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${ks3_cust}"
          trigger:
            - call: "POST /sns/delivery-plans/${ks3_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${ks3_cust}"
              captures: { ks3_err: $.data.error_id }
          assert:
            - "ks3_err == \"ERR_PLAN_NOT_OPEN\" with HTTP 409"
            - "DeliveryPlan.${ks3_plan}.plan_status == LOCKED (unchanged)"

      - name: ship_open_plan_returns_plan_not_locked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DeliveryPlan.LOCKED_to_SHIPPED
          - errors[ERR_PLAN_NOT_LOCKED]
        distinguishing_aspect: "Ship requires LOCKED; an OPEN plan rejects ship with ERR_PLAN_NOT_LOCKED and no inventory movement."
        test_recipe:
          setup: ["Logical clock default. Customer, stocked priced product, one subscription, plan generated but not locked."]
          setup_api_calls:
            - *k_clock
            - &ks4_cust
              call: "POST /sns/customers"
              payload: { email: "ks4@x.com", full_name: "K Ship", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { ks4_cust: $.data.id }
            - &ks4_prod
              call: "POST /sns/products"
              payload: { sku: "K-S4", name: "Ship Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks4_prod: $.data.id }
            - call: "POST /sns/products/${ks4_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${ks4_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks4_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${ks4_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${ks4_cust}", product_id: "${ks4_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${ks4_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { ks4_plan: "$.data[0].id" }
          trigger:
            - call: "POST /sns/delivery-plans/${ks4_plan}/ship"
              payload: {}
              as: PlatformAdmin
              captures: { ks4_err: $.data.error_id }
          assert:
            - "ks4_err == \"ERR_PLAN_NOT_LOCKED\" with HTTP 409"
            - "InventoryPlacement.${ks4_pl}.reserved_units == 0 and shipped_units == 0"

      - name: damage_claim_on_shipped_but_not_delivered_plan_rejected
        claim_type: Precondition Enforcement
        grounds:
          - errors[ERR_PLAN_NOT_DELIVERED]
        distinguishing_aspect: "Claim create requires DELIVERED; a SHIPPED plan rejects the claim with ERR_PLAN_NOT_DELIVERED."
        test_recipe:
          setup: ["Logical clock default. Full chain through ship; plan is SHIPPED, not yet DELIVERED."]
          setup_api_calls:
            - *k_clock
            - &ks5_cust
              call: "POST /sns/customers"
              payload: { email: "ks5@x.com", full_name: "K Claim", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { ks5_cust: $.data.id }
            - &ks5_prod
              call: "POST /sns/products"
              payload: { sku: "K-S5", name: "Claim Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks5_prod: $.data.id }
            - call: "POST /sns/products/${ks5_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${ks5_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks5_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${ks5_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${ks5_cust}", product_id: "${ks5_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${ks5_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { ks5_plan: "$.data[0].id" }
            - call: "POST /sns/delivery-plans/${ks5_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${ks5_cust}"
            - call: "POST /sns/delivery-plans/${ks5_plan}/ship"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sns/delivery-plans/${ks5_plan}/lines"
              payload: {}
              as: Customer
              as_user_id: "${ks5_cust}"
              captures: { ks5_line: "$.data[0].id" }
          trigger:
            - call: "POST /sns/delivery-plans/${ks5_plan}/damage-claims"
              payload: { damaged_line_ids: ["${ks5_line}"] }
              as: Customer
              as_user_id: "${ks5_cust}"
              captures: { ks5_err: $.data.error_id }
          assert:
            - "ks5_err == \"ERR_PLAN_NOT_DELIVERED\" with HTTP 409"

      - name: review_of_completed_claim_returns_claim_not_reviewable
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DamageClaim
          - errors[ERR_CLAIM_NOT_REVIEWABLE]
        distinguishing_aspect: "A claim COMPLETED by an APPROVE_REFUND review is terminal for review; a second review returns ERR_CLAIM_NOT_REVIEWABLE."
        test_recipe:
          setup: ["Logical clock default. Full chain through delivery; claim reported and approved for refund (COMPLETED)."]
          setup_api_calls:
            - *k_clock
            - &ks6_cust
              call: "POST /sns/customers"
              payload: { email: "ks6@x.com", full_name: "K Review", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { ks6_cust: $.data.id }
            - &ks6_prod
              call: "POST /sns/products"
              payload: { sku: "K-S6", name: "Review Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks6_prod: $.data.id }
            - call: "POST /sns/products/${ks6_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${ks6_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ks6_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${ks6_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${ks6_cust}", product_id: "${ks6_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${ks6_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { ks6_plan: "$.data[0].id" }
            - call: "POST /sns/delivery-plans/${ks6_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${ks6_cust}"
            - call: "POST /sns/delivery-plans/${ks6_plan}/ship"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sns/delivery-plans/${ks6_plan}/mark-delivered"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sns/delivery-plans/${ks6_plan}/lines"
              payload: {}
              as: Customer
              as_user_id: "${ks6_cust}"
              captures: { ks6_line: "$.data[0].id" }
            - call: "POST /sns/delivery-plans/${ks6_plan}/damage-claims"
              payload: { damaged_line_ids: ["${ks6_line}"] }
              as: Customer
              as_user_id: "${ks6_cust}"
