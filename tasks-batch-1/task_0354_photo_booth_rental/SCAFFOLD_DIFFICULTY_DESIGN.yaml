            - "Booking.${bk_id}.amount_paid - Booking.${bk_id}.amount_refunded == 0"
            - "Booking.${bk_id}.payment_status == REFUNDED"

      - name: cancel_confirmed_booth_capacity_conservation
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.booth_selector
          - validations[priority=42]
          - state_machines.Booking.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Conserved quantity = booth interval-capacity (a non-money quantity, distinct from instance 1's
