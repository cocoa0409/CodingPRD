      - name: the_zone_create_ladder_reports_invalid_request_then_not_found_then_duplicate_then_phase
        claim_type: priority_ordering
        grounds:
          - validations.priority_6
          - validations.priority_8
          - validations.priority_28
          - validations.priority_38
        distinguishing_aspect: |
          One endpoint, four requests, four different error ids, and the ordering is
          counter-intuitive at the last step: creating a zone is forbidden outright in
          phase FABRICATION, yet a request that ALSO duplicates an existing zone code
          must report ERR_DUPLICATE_CODE, because scoped uniqueness sits at priority
          28 and the phase gate at 38. An implementation that checks the cheap phase
          gate first - the natural order, since it needs no extra query - returns
          ERR_INVALID_PROJECT_PHASE on request 3 and passes request 4 by accident.
          Requests 1 and 2 pin the other two rungs: a case_slot_capacity of 25 breaks
          the declared 1..20 range and outranks both the duplicate code and the phase,
          and an unknown project id outranks them too while still being outranked by
          the malformed body.
