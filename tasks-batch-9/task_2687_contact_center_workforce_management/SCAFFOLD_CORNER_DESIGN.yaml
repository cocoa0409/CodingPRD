  - section: validations
    instances:
      - name: overlapping_shift_publication_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=115]
          - state_machines.ScheduleShift.publication_status.DRAFT_to_PUBLISHED
          - errors.ERR_SHIFT_OVERLAP
        distinguishing_aspect: |
          The overlap rule at priority 115 has to be reachable, which it only is because the
          min-rest rule at 110 explicitly skips an OVERLAPPING neighbour. Publishing an 08:00-16:00
          shift and then a 12:00-16:00 shift for the same agent on the same date yields
          ERR_SHIFT_OVERLAP (409), NOT ERR_MIN_REST_VIOLATION (422): the pair has a negative gap,
          so an implementation that feeds overlapping neighbours into the rest comparison returns
          the 422 and fails. The refused shift stays DRAFT and no hour ledger moves.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; cycle W37-OVL over 2026-09-07..2026-09-13."
            - "Agreement LA-CORE: min_rest_hours 11, max_weekly_hours 45, max_consecutive_days 6."
            - "One VOICE_EN agent, FG-A intervals generated for 2026-09-07, posture REQUIREMENTS_LOCKED."
            - "Two Monday VOICE_EN templates: T-A 08:00 for 480 minutes and T-B 12:00 for 240 minutes."
