        distinguishing_aspect: "POST /work-orders/{id}/schedule with expected_work_order_version one behind current fails 412 ERR_STALE_WORK_ORDER_VERSION; rescheduling with the post-schedule version succeeds."
        test_recipe:
          setup: ["FL regulation; policyholder + policy; shop; claim routed, work order ACCEPTED at version 2"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
