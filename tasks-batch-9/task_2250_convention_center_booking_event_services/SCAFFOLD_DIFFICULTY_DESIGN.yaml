      - name: blackout_buffer_clearance_admits_three_day_gap_and_refuses_two_day_gap
        grounds:
          - validations[priority=72]
          - errors.ERR_MAINTENANCE_BLACKOUT_CONFLICT
          - entities.MaintenanceBlackout.fields.buffer_days
          - state_machines.MaintenanceBlackout.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          A third interval semantics: MaintenanceBlackout uses SEPARATION rather than
          intersection, and the separation must exceed buffer_days on BOTH sides. With an
          APPROVED capital-project window of 2027-12-01 through 2027-12-10 and buffer_days 2,
          a booking whose move_out_end_date is 2027-11-28 clears by 3 days and is admitted,
          while one ending 2027-11-29 clears by exactly 2 and is refused. Plain interval
          intersection would admit both since neither booking touches the window.
        test_recipe:
          setup:
            - "Ballroom B has daily_base_rate_cents 1200000"
            - "a CAPITAL_PROJECT MaintenanceBlackout on Ballroom B covering 2027-12-01 through 2027-12-10 with buffer_days 2 has been approved"
