              payload: { expected_drop_version: "${drop_v_after_finalize}", attribution_variant: "LAST_TOUCH_MAIL", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { closed_err: "$.data.error_id" }
          assert:
            - "immediately after the matchback create: Drop.${drop_id}.measurement_status == MATCHBACK_OPEN and Drop.${drop_id}.production_status == MAILED"
            - "MatchbackRun.${run_id}.attributed_demand_cents == 20000  # the cascade MAIL of 2026-09-20 is the only qualifying touch"
            - "${prod_after_deliver} == DELIVERED"
            - "${meas_after_deliver} == MATCHBACK_OPEN  # deliver leaves the measurement dimension exactly where it was"
            - "after finalize: MatchbackRun.${run_id}.status == FINALIZED and finalized_at == 2026-09-20T00:00:00Z"
            - "after finalize: Drop.${drop_id}.measurement_status == MATCHBACK_CLOSED"
            - "after finalize: Drop.${drop_id}.production_status == DELIVERED  # finalize leaves the production dimension exactly where it was"
            - "${closed_err} == ERR_INVALID_MEASUREMENT_STATE with HTTP 409  # legal production dimension, closed measurement dimension"
            - "${drop_v_after_deliver} > ${drop_v_after_mail} and ${drop_v_after_finalize} > ${drop_v_after_deliver}  # both dimensions share one version counter"

      - name: merge_purge_fork_completed_and_failed_branches_differ_in_side_effects
        grounds:
          - state_machines.MergePurgeRun.PENDING_to_COMPLETED
          - state_machines.MergePurgeRun.PENDING_to_FAILED
          - calculations.merge_purge_net_mailable_names
          - calculations.segment_rfm_score
          - entities.MergePurgeRun.fields.net_mailable_names
          - entities.ProspectListRental.fields.net_names_delivered
          - concurrency_rules[merge-purge-create-stale-plan]
        distinguishing_aspect: |
          Entity = MergePurgeRun, shape BRANCHING: one endpoint forks on the computed
          net_mailable_names. The FAILED branch (net 0, because the only leaf segment
          is SUPPRESS_ONLY and the rental is a 100%-overlap list) leaves the rental in
          DELIVERED; the COMPLETED branch of the second run over a widened housefile
          (net 30000) promotes that same rental DELIVERED -> NETTED and writes
          net_names_delivered. The FAILED run is terminal: a later COMPLETED run does
          NOT move it to SUPERSEDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card."
            - "One leaf segment S_DORMANT (recency_days 900, orders_12mo 0, ltv_cents 1000 -> rfm_score 0, DORMANT, contact_strategy SUPPRESS_ONLY) with housefile_count 8000."
            - "One rental R1 delivered with gross_names 5000 and housefile_overlap_bps 10000 (every name already on the housefile), coop_model_score 640."
            - "Plan P1 budget 20000000 in DRAFT."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_DORMANT", recency_days: 900, orders_12mo: 0, ltv_cents: 1000, housefile_count: 8000, avg_order_value_cents: 5000, historical_response_rate_bps: 100 }
              as: CirculationPlanner
              captures: { seg_dormant_id: "$.data.id", seg_dormant_strategy: "$.data.contact_strategy" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-A", requested_gross_names: 5000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 10000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { rental_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${rental_id}/model"
              payload: { coop_model_score: 640 }
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${rental_id}/order"
              payload: {}
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${rental_id}/deliver"
              payload: { delivered_gross_names: 5000 }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: ["${rental_id}"] }
              as: ListBroker
              captures: { run_failed_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_ACTIVE", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_active_id: "$.data.id" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: ListBroker
              captures: { plan_v2: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v2}", input_rental_ids: ["${rental_id}"] }
              as: ListBroker
              captures: { run_completed_id: "$.data.id" }
          assert:
            - "${seg_dormant_strategy} == SUPPRESS_ONLY  # rfm_score 0 -> DORMANT default"
            - "MergePurgeRun.${run_failed_id}.status == FAILED"
            - "MergePurgeRun.${run_failed_id}.housefile_leaf_segment_count == 1"
            - "MergePurgeRun.${run_failed_id}.gross_input_names == 13000  # 8000 housefile + 5000 rental"
            - "MergePurgeRun.${run_failed_id}.suppressed_names == 8000"
            - "MergePurgeRun.${run_failed_id}.duplicates_removed == 5000  # floor(5000 * 10000 / 10000), no inter-list penalty on the first rental"
            - "MergePurgeRun.${run_failed_id}.net_mailable_names == 0"
            - "MergePurgeRun.${run_failed_id}.observed_plan_version == ${plan_v1}"
            - "MergePurgeRun.${run_failed_id}.processing_order == [${rental_id}]"
            - "immediately after the FAILED run: ProspectListRental.${rental_id}.status == DELIVERED  # the NETTED promotion is a COMPLETED-branch-only side effect"
            - "MergePurgeRun.${run_completed_id}.status == COMPLETED"
            - "MergePurgeRun.${run_completed_id}.housefile_leaf_segment_count == 2"
            - "MergePurgeRun.${run_completed_id}.gross_input_names == 43000  # 8000 + 30000 + 5000"
            - "MergePurgeRun.${run_completed_id}.suppressed_names == 8000 and duplicates_removed == 5000"
            - "MergePurgeRun.${run_completed_id}.net_mailable_names == 30000"
            - "after the COMPLETED run: ProspectListRental.${rental_id}.status == NETTED"
            - "after the COMPLETED run: ProspectListRental.${rental_id}.net_names_delivered == 0  # a 100%-overlap list nets nothing"
            - "after the COMPLETED run: ProspectListRental.${rental_id}.unit_cost_cents_per_name == 9  # round_half_up(8500 / 1000)"
            - "after the COMPLETED run: MergePurgeRun.${run_failed_id}.status == FAILED  # still FAILED, NOT SUPERSEDED - FAILED is terminal"
            - "MergePurgeRun.${run_failed_id}.gross_input_names == MergePurgeRun.${run_failed_id}.net_mailable_names + suppressed_names + duplicates_removed"
            - "MergePurgeRun.${run_completed_id}.gross_input_names == MergePurgeRun.${run_completed_id}.net_mailable_names + suppressed_names + duplicates_removed"

  # ===========================================================================
  # RULE 4 — transitive_cascade  (2 instances, different triggers, depth 5 / 4)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: mail_drop_cascades_five_hops_to_plan_budget_via_fatigue_suppression
        grounds:
          - state_machines.Drop.production_status.PRESORTED_to_MAILED
          - calculations.contact_fatigue_score
          - calculations.drop_cost_per_book
          - calculations.plan_profitability_rollup
          - state_machines.CirculationLine.ALLOCATED_to_SUPPRESSED
          - entities.ContactEvent.fields.weighted_points
          - entities.HousefileSegment.fields.fatigue_score
          - entities.HousefileSegment.fields.suppressed_at
          - entities.CirculationPlan.fields.uncommitted_budget_cents
        distinguishing_aspect: |
          Trigger = POST /drops/{id}/mail, depth 5, and each hop is caused strictly by
          the previous hop's write: (1) mailing drop 1 CREATES a MAIL ContactEvent
          because drop 1 has an allocated housefile line; (2) that new row makes the
          segment's recomputed fatigue_score 120; (3) 120 crossing the threshold 100
          flips contact_strategy to SUPPRESS_ONLY; (4) that flip SUPPRESSES the same
          segment's still-PLANNED line on drop 2; (5) that line leaving ALLOCATED
          credits 1180000 cents back to the plan and re-derives drop 2's quantities
          and the plan's planned_* aggregates. Removing hop 2 (do not recompute) makes
          hops 3-5 unobservable, which is what makes the chain transitive rather than
          five parallel effects of one trigger.
        test_recipe:
          setup:
            - "Logical clock stepped 2026-08-01 -> 2026-09-20T00:00:00Z."
            - "Season FW26 on the default rate card (fatigue_suppression_threshold 100, fatigue_window_days 90, min_inhome_gap_days 21)."
            - "Segment S_PREMIUM (30000 names, 620 bps, AOV 18500)."
            - "Plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run; drop 1 (page_count 64, in_home 2026-09-15) with an S_PREMIUM line for 20000 books and drop 2 (page_count 64, in_home 2026-10-20, i.e. 35 days later so the 21-day buffer is satisfied) with an S_PREMIUM line for 5000 books; both drops allocated at the provisional 236."
            - "Plan costed by u-planner-1, submitted by u-planner-1, approved by u-director-9; drop 1 presorted as a single 20000-piece FIVE_DIGIT batch (postage_total 800000, cost_per_book 221); drop 2 left PLANNED."
            - "Two manual MAIL ContactEvent rows already on S_PREMIUM dated 2026-09-20, so its fatigue_score sits at 80 - one MAIL touch short of the threshold."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_PREMIUM", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_premium_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_premium_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { l1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 2, in_home_date: "2026-10-20", page_count: 64 }
              as: CirculationPlanner
              captures: { d2_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d2_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_premium_id}", requested_quantity: 5000 }
              as: CirculationPlanner
              captures: { l2_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d2_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/drops/${d1_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/presort"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_premium_id}", channel: "MAIL", contact_date: "2026-09-20", source: "MANUAL" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_premium_id}", channel: "MAIL", contact_date: "2026-09-20", source: "MANUAL" }
              as: MarketingAnalyst
              captures: { seg_score_before: "$.data.weighted_points" }
            - call: "GET /catalog-circulation/housefile-segments/${seg_premium_id}"
              payload: {}
              as: CirculationPlanner
              captures: { fatigue_before: "$.data.fatigue_score", strategy_before: "$.data.contact_strategy" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/mail"
              payload: {}
              as: CirculationPlanner
            - call: "GET /catalog-circulation/housefile-segments/${seg_premium_id}/contact-events"
              payload: { channel: "MAIL" }
              as: CirculationPlanner
              captures: { mail_event_list: "$.data" }
          assert:
            - "${fatigue_before} == 80 and ${strategy_before} == PREMIUM_FULL and ${seg_score_before} == 40  # each same-day MAIL scores 40 at 10000 bps decay"
            - "HOP 1: ${mail_event_list} holds exactly 3 ContactEvent rows for S_PREMIUM - the two manual rows plus one created by the mail cascade"
            - "HOP 1: the newest ContactEvent for S_PREMIUM has channel == MAIL, contact_date == 2026-09-15, source == DROP_MAIL_CASCADE and drop_id == ${d1_id}"
            - "HOP 1: that ContactEvent.channel_weight == 40, decay_factor_bps == 10000, weighted_points == 40  # 5 days ago is inside the <=14-day band"
            - "HOP 2: HousefileSegment.${seg_premium_id}.fatigue_score == 120"
            - "HOP 3: HousefileSegment.${seg_premium_id}.contact_strategy == SUPPRESS_ONLY"
            - "HOP 3: HousefileSegment.${seg_premium_id}.suppressed_at == 2026-09-20T00:00:00Z"
            - "HOP 4: CirculationLine.${l2_id}.status == SUPPRESSED"
            - "HOP 4: CirculationLine.${l2_id}.allocated_quantity == 0 and mailable_quantity == 0 and forecast_demand_cents == 0 and gross_margin_cents == 0 and contribution_cents == 0"
            - "HOP 4: CirculationLine.${l1_id}.status == ALLOCATED  # its parent drop is MAILED, not PLANNED, so hop 4 spares it"
            - "HOP 5: CirculationLine.${l2_id}.committed_cost_cents == 0"
            - "HOP 5: CirculationPlan.${plan_id}.committed_cost_cents == 4720000  # was 5900000, the 1180000 of line 2 credited back"
            - "HOP 5: CirculationPlan.${plan_id}.uncommitted_budget_cents == 15280000"
            - "HOP 5: 20000000 == CirculationPlan.${plan_id}.committed_cost_cents + CirculationPlan.${plan_id}.uncommitted_budget_cents"
            - "HOP 5: Drop.${d2_id}.requested_quantity_total == 0 and Drop.${d2_id}.planned_quantity == 0"
            - "HOP 5: Drop.${d2_id}.cost_per_book_cents == 236 and Drop.${d2_id}.print_rebate_bps == 0"
            - "HOP 5: CirculationPlan.${plan_id}.planned_cost_cents == 4420000  # 20000 * the presorted 221; line 2 has left the roll-up input set"
            - "HOP 5: CirculationPlan.${plan_id}.planned_demand_cents == 22940000"
            - "HOP 5: CirculationPlan.${plan_id}.planned_contribution_cents == 5214800"
            - "CirculationPlan.${plan_id}.status == APPROVED  # the automatic COSTED -> DRAFT edge does not fire from APPROVED"
            - "Drop.${d1_id}.production_status == MAILED and Drop.${d1_id}.mailed_at == 2026-09-20T00:00:00Z"
            - "Drop.${d2_id}.production_status == PLANNED  # the cascade never advances another drop's production dimension"

      - name: rental_cancel_cascades_four_hops_and_makes_merge_purge_run_stale
        grounds:
          - state_machines.ProspectListRental.DELIVERED_to_CANCELLED
          - state_machines.MergePurgeRun.COMPLETED_to_STALE
          - state_machines.CirculationLine.ALLOCATED_to_VOIDED
          - state_machines.CirculationPlan.COSTED_to_DRAFT
          - calculations.merge_purge_net_mailable_names
          - calculations.drop_cost_per_book
          - calculations.plan_profitability_rollup
          - calculations.rental_expected_response_rate
          - entities.ProspectListRental.fields.net_names_delivered
        distinguishing_aspect: |
          Trigger = POST /prospect-list-rentals/{id}/cancel — a DIFFERENT trigger from
          the mail cascade, entering the graph from the rental side rather than the
          production side, at depth 4: (1) cancelling R1 zeroes its names and drags
          the COMPLETED MergePurgeRun to STALE with recomputed aggregates
          (55000/5000/50000 -> 30000/0/30000); (2) because R1 no longer supplies any
          mailable names, its ALLOCATED RENTAL line is VOIDED and its 4900000 cents
          are credited back; (3) because that line left the drop, drop 1's
          requested_quantity_total and planned_quantity fall to 10000 and cost per
          book is re-derived; (4) because those drop figures moved, the plan's
          planned_* aggregates are recomputed and the COSTED plan falls back to DRAFT.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card (prospect_base_response_bps 110, prospect_avg_order_value_cents 11800)."
