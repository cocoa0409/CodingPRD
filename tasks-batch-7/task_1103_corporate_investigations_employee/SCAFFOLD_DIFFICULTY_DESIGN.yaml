            - { call: "POST /api/plans/${p1}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${p1}/transition", payload: { to_status: REJECTED, rejection_reason: "scope too narrow" }, as: InvestigationsManager, as_user_id: "mgr-1" }
          trigger:
