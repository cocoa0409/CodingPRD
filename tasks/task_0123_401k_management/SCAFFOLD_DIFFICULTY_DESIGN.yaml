# =============================================================================
# 401(k) Retirement Plan Management — Scaffold Difficulty Design (Test Targeting Index)
#
# Single top-level key per §1.8. Every `grounds:` entry references a declared
# element in SCAFFOLD.yaml (§1.1–§1.6). All numeric `assert:` values were
# computed by executing the relevant calculations[].formula against the pinned
# setup inputs (see per-instance comments).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: safe_harbor_vs_tiered_match_on_contribution_record
        grounds:
          - calculations.employer_match
          - entities.Plan.fields.match_formula_type
          - entities.Plan.fields.tiered_brackets
          - entities.ContributionRecord.fields.employer_match_cents
          - endpoints.POST_/plans/{planId}/participants/{participantId}/contribution-records
        distinguishing_aspect: |
          Operates on the ContributionRecord money-flow domain. Identical
          (gross_pay_cents=500000, elected_deferral_pct=6) inputs produce
          employer_match_cents=20000 under SAFE_HARBOR_BASIC vs 11250 under
          TIERED with brackets [{up_to:3,rate:50},{up_to:6,rate:25}] — a
          forward-vs-tiered split on the cost-accounting entity.
        test_recipe:
          setup:
            - "Create Plan_A: match_formula_type=SAFE_HARBOR_BASIC, vesting_schedule_type=CLIFF, cliff_years=3, plan_year=2026"
            - "Create Plan_B: match_formula_type=TIERED, tiered_brackets=[{employee_deferral_pct_up_to:3,match_rate_pct:50},{employee_deferral_pct_up_to:6,match_rate_pct:25}], vesting_schedule_type=CLIFF, cliff_years=3, plan_year=2026"
            - "Activate both plans; advance both clocks to 2026-06-01"
            - "Enroll and activate Participant_A in Plan_A and Participant_B in Plan_B, both with elected_deferral_pct=6, annual_compensation_cents=6000000, hire_date=2022-01-01"
          trigger:
            - "POST /plans/{Plan_A.id}/participants/{Participant_A.id}/contribution-records with {pay_period_end:'2026-06-15', gross_pay_cents:500000}"
            - "POST /plans/{Plan_B.id}/participants/{Participant_B.id}/contribution-records with {pay_period_end:'2026-06-15', gross_pay_cents:500000}"
          assert:
            - "ContributionRecord_A.employee_amount_cents == 30000"
            - "ContributionRecord_A.employer_match_cents == 20000"
            - "ContributionRecord_B.employee_amount_cents == 30000"
            - "ContributionRecord_B.employer_match_cents == 11250"

      - name: cliff_vs_graded_vested_balance_on_participant
        grounds:
          - calculations.vested_percent
          - entities.Plan.fields.vesting_schedule_type
          - entities.Plan.fields.cliff_years
          - entities.Plan.fields.graded_percentages
          - entities.Participant.fields.vested_pct_snapshot
          - entities.VestingSnapshot.fields.vested_balance_cents
          - endpoints.POST_/plans/{planId}/participants/{participantId}/vesting-snapshots
        distinguishing_aspect: |
          Operates on the Participant vested-balance domain (different entity
          domain than the ContributionRecord money-flow above). With identical
          service_years_completed=4 and total_account_balance_cents=10000000,
          CLIFF (cliff_years=3) yields vested_pct=100.0 and vested_balance_cents=10000000,
          while GRADED with graded_percentages=[0,0,20,40,60,80,100] yields
          vested_pct=60.0 and vested_balance_cents=6000000.
        test_recipe:
          setup:
            - "Create Plan_C: vesting_schedule_type=CLIFF, cliff_years=3, match_formula_type=SAFE_HARBOR_BASIC"
            - "Create Plan_D: vesting_schedule_type=GRADED, graded_percentages=[0,0,20,40,60,80,100], match_formula_type=SAFE_HARBOR_BASIC"
            - "Activate both; advance both clocks to 2026-01-15"
            - "Enroll+activate Participant_C in Plan_C and Participant_D in Plan_D, both with hire_date=2022-01-01, annual_compensation_cents=6000000, elected_deferral_pct=0"
            - "Force total_account_balance_cents = 10000000 on each by posting a single ContributionRecord and then PATCHing or by an initial seed (POST one contribution-record with elected_deferral_pct=0 and reset via test fixture: see test_helpers seed_participant_balance)"
          trigger:
            - "POST /plans/{Plan_C.id}/participants/{Participant_C.id}/vesting-snapshots"
            - "POST /plans/{Plan_D.id}/participants/{Participant_D.id}/vesting-snapshots"
          assert:
            - "VestingSnapshot_C.service_years_completed == 4"
            - "VestingSnapshot_C.vested_pct == 100.0"
            - "VestingSnapshot_C.vested_balance_cents == 10000000"
            - "VestingSnapshot_D.service_years_completed == 4"
            - "VestingSnapshot_D.vested_pct == 60.0"
            - "VestingSnapshot_D.vested_balance_cents == 6000000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: max_loan_amount_three_input_non_linear
        # Mode (a): formula with 3 inputs and non-linear interaction
        # (vested_balance_cents, ABSOLUTE_LOAN_CAP_CENTS, highest-outstanding-in-365-days).
        grounds:
          - calculations.max_loan_amount
          - calculations.vested_percent
          - entities.Loan.fields.requested_amount_cents
          - entities.Loan.fields.approved_amount_cents
          - endpoints.POST_/plans/{planId}/participants/{participantId}/loans
          - endpoints.POST_/plans/{planId}/participants/{participantId}/loans/{loanId}/approve
        distinguishing_aspect: |
          Mode (a): non-linear three-input formula. max_loan_cents =
          max(0, min(vested_balance_cents // 2, 5000000) − hi_outstanding_cents).
          With vested_balance_cents=8000000 (no prior loans) → max=4000000;
          add a prior SATISFIED loan whose hi_outstanding in window was 1500000 →
          max drops to 2500000. The two arms (floor 50%-of-vested vs $50k cap)
          and the windowed reduction interact non-linearly: doubling the
          vested balance does NOT double the max when the absolute cap binds.
        test_recipe:
          setup:
            - "Create Plan_E: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-03-01"
            - "Enroll+activate Participant_E with hire_date=2024-01-01, annual_compensation_cents=10000000, elected_deferral_pct=0"
            - "Seed Participant_E.total_account_balance_cents = 16000000 (vested_pct will be 100.0 because service_years=2 >= cliff_years=1, so vested_balance_cents = 8000000)"
            # Wait — recompute: vested_pct=100% means vested_balance = 16000000 not 8000000.
            # Re-pin: seed total_account_balance_cents = 16000000; vested_pct = 100 → vested_balance = 16000000;
            # 16000000//2 = 8000000; min(8000000, 5000000) = 5000000.
          trigger:
            - "POST /plans/{Plan_E.id}/participants/{Participant_E.id}/loans with {requested_amount_cents:5000000, term_months:12}"
            - "POST /plans/{Plan_E.id}/participants/{Participant_E.id}/loans with {requested_amount_cents:5000001, term_months:12}"
          assert:
            - "First POST → 201; Loan.requested_amount_cents == 5000000"
            - "Second POST → 422 with error_id == 'ERR_LOAN_EXCEEDS_MAX' (cap binds at ABSOLUTE_LOAN_CAP_CENTS=5000000 even though 50%-of-vested=8000000)"

      - name: monthly_payment_rounding_remainder_on_last_installment
        # Mode (b): nested rounding where order matters. The scaffold pins
        # "round_half_up(approved/term) per installment; LAST installment
        # absorbs remainder so sum = approved exactly." Round-then-sum
        # vs sum-then-round produce different cents on installments 1..N-1.
        grounds:
          - calculations.max_loan_amount
          - entities.Loan.fields.monthly_payment_cents
          - entities.LoanRepayment.fields.payment_amount_cents
          - endpoints.POST_/plans/{planId}/participants/{participantId}/loans/{loanId}/repayments
        distinguishing_aspect: |
          Mode (b): pinned rounding order. For approved_amount_cents=1000000,
          term_months=12: round_half_up(1000000/12)=83333. If implementer
          rounds-then-sums, 11 installments of 83333 = 916663; the LAST
          installment MUST equal 1000000 − 916663 = 83337 to satisfy the
          invariant total_repaid == approved_amount_cents. A naive
          implementation that pays 83333 twelve times under-pays by 4
          cents and never reaches outstanding_principal_cents == 0 →
          loan never transitions to SATISFIED.
        test_recipe:
          setup:
            - "Create Plan_F: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_F with hire_date=2024-01-01, annual_compensation_cents=10000000, elected_deferral_pct=0"
            - "Seed Participant_F.total_account_balance_cents = 4000000"
            - "POST loan request {requested_amount_cents:1000000, term_months:12}; POST .../approve"
          trigger:
            - "POST 11 repayments of payment_amount_cents=83333"
            - "POST the 12th repayment of payment_amount_cents=83337"
          assert:
            - "After 11th repayment: Loan.outstanding_principal_cents == 83337, Loan.status == 'ACTIVE'"
            - "After 12th repayment: Loan.outstanding_principal_cents == 0, Loan.status == 'SATISFIED'"
            - "A separate attempt to pay 83338 as the 12th installment → 422 ERR_LOAN_OVERPAYMENT"

      - name: employer_match_pinned_after_per_row_employee_when_ytd_cap_binds
        # Mode (c): circular-looking dependency. employer_match depends on
        # ytd_employer (cumulative); the new row's employer_match itself
        # mutates ytd_employer for *subsequent* rows. Scaffold pins:
        # per-row employee first, then per-row employer using ONLY
        # already-POSTED rows' ytd_employer (the new row is not its own input).
        grounds:
          - calculations.employer_match
          - calculations.contribution_annual_limit_check
          - entities.Participant.fields.cumulative_employer_match_cents
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (c): the scaffold pins the evaluation order so that the
          employer-cap is computed against ytd_employer-BEFORE-this-row, not
          ytd_employer-INCLUDING-this-row. With EMPLOYER_ANNUAL_LIMIT_CENTS=
          4600000 and ytd_employer=4590000, a new row whose unbounded
          employer_match=20000 is silently CAPPED to 10000 (=4600000−4590000),
          not rejected. Without a pinned order, an implementer could compute
          "employer cap binds → reject" instead of "employer cap binds → cap".
        test_recipe:
          setup:
            - "Create Plan_G: SAFE_HARBOR_BASIC, CLIFF cliff_years=1, plan_year=2026; activate"
            - "Enroll+activate Participant_G with elected_deferral_pct=5, annual_compensation_cents=500000000 (artificially high so the employer-cap binds before the employee-cap)"
            - "Advance Plan_G clock to 2026-01-01"
            - "Test fixture: seed cumulative_employer_match_cents=4590000 by directly posting a manufactured ContributionRecord via the test seed helper (or by posting enough normal contribution rows to reach within $100 of the cap)"
          trigger:
            - "POST /plans/{Plan_G.id}/participants/{Participant_G.id}/contribution-records with {pay_period_end:'2026-12-30', gross_pay_cents:500000}"
          assert:
            - "Response is 201 (NOT 422)"
            - "ContributionRecord.employer_match_cents == 10000 (capped, not the unbounded 20000)"
            - "Participant.cumulative_employer_match_cents == 4600000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_branching_on_default_vs_satisfied
        grounds:
          - state_machines.Loan
          - state_machines.Loan.transitions.ACTIVE_to_SATISFIED
          - state_machines.Loan.transitions.ACTIVE_to_DEFAULTED
          - endpoints.POST_/plans/{planId}/_clock/advance
          - endpoints.POST_/plans/{planId}/participants/{participantId}/loans/{loanId}/repayments
        distinguishing_aspect: |
          Loan state machine is branching fork-join: from ACTIVE the system
          forks to {SATISFIED, DEFAULTED} with divergent side-effect sets —
          SATISFIED has no balance debit; DEFAULTED triggers a deemed-distribution
          cascade (Participant.total_account_balance_cents -= outstanding).
          Entity = Loan.
        test_recipe:
          setup:
            - "Create Plan_H: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_H1 and Participant_H2 with hire_date=2024-01-01"
            - "Seed both balances to 4000000"
            - "Both: POST loan {requested_amount_cents:1000000, term_months:10}; POST .../approve"
          trigger:
            - "Participant_H1: POST 10 repayments of 100000 each (round_half_up(1000000/10)=100000 exactly)"
            - "Participant_H2: POST no repayments; POST /plans/{Plan_H.id}/_clock/advance with new_date='2026-05-15' (> origination_date+30+90 = 2026-01-01+30+90 = 2026-05-01)"
          assert:
            - "Loan_H1.status == 'SATISFIED', Loan_H1.outstanding_principal_cents == 0, Participant_H1.total_account_balance_cents == 4000000 (no debit)"
            - "Loan_H2.status == 'DEFAULTED', Loan_H2.outstanding_principal_cents == 0, Participant_H2.total_account_balance_cents == 3000000 (debited by deemed-distribution 1000000)"

      - name: participant_branching_active_suspended_terminated
        grounds:
          - state_machines.Participant
          - state_machines.Participant.transitions.ACTIVE_to_SUSPENDED
          - state_machines.Participant.transitions.SUSPENDED_to_ACTIVE
          - state_machines.Participant.transitions.ACTIVE_to_TERMINATED
          - state_machines.HardshipWithdrawal.transitions.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Participant is a *different entity* from Loan and exhibits branching
          fork with revert: from ACTIVE the machine forks to {SUSPENDED, TERMINATED};
          SUSPENDED branches back to ACTIVE via system clock-driven revert
          (cycle ACTIVE→SUSPENDED→ACTIVE). TERMINATED branch has divergent
          side effects (overdue-RMD cascade), the SUSPENDED branch does not.
        test_recipe:
          setup:
            - "Create Plan_I: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_I with hire_date=2024-01-01"
            - "Seed Participant_I.total_account_balance_cents = 1000000"
            - "POST hardship-withdrawals {requested_amount_cents:200000, hardship_reason_code:'MEDICAL'}"
          trigger:
            - "POST hardship .../approve"
            - "POST /plans/{Plan_I.id}/_clock/advance with new_date='2026-08-01' (>= 2026-01-01 + 180 days = 2026-06-30)"
          assert:
            - "After approve: Participant_I.status == 'SUSPENDED', deferral_suspended_until == '2026-06-30'"
            - "After clock advance to 2026-08-01: Participant_I.status == 'ACTIVE', deferral_suspended_until is null (system revert)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: hardship_approve_three_hop_cascade
        # Depth 3: hardship approve → participant balance debit (hop 1) →
        # participant status SUSPENDED with deferral_suspended_until (hop 2) →
        # subsequent contribution POST in window rejected (hop 3).
        grounds:
          - state_machines.HardshipWithdrawal.transitions.REQUESTED_to_APPROVED
          - state_machines.Participant.transitions.ACTIVE_to_SUSPENDED
          - validations[priority=8]
          - endpoints.POST_/plans/{planId}/participants/{participantId}/hardship-withdrawals/{withdrawalId}/approve
          - endpoints.POST_/plans/{planId}/participants/{participantId}/contribution-records
        distinguishing_aspect: |
          Trigger: hardship approve. Hop 1: HardshipWithdrawal status flip
          causes Participant.total_account_balance_cents debit. Hop 2: that
          balance change ITSELF triggers Participant.status ACTIVE→SUSPENDED
          and sets deferral_suspended_until=current_date+180. Hop 3: the new
          deferral_suspended_until value ITSELF causes any subsequent POST
          contribution-records inside the window to reject with
          ERR_DEFERRAL_SUSPENDED. Three causally-chained hops, not a fan-out.
        test_recipe:
          setup:
            - "Create Plan_J: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_J with hire_date=2024-01-01, elected_deferral_pct=5, annual_compensation_cents=6000000"
            - "Seed Participant_J.total_account_balance_cents = 500000"
            - "POST hardship {requested_amount_cents:200000, hardship_reason_code:'MEDICAL'}"
          trigger:
            - "POST hardship .../approve"
            - "POST contribution-records {pay_period_end:'2026-03-15', gross_pay_cents:500000}"
          assert:
            - "Participant_J.total_account_balance_cents == 300000 (hop 1: debit by 200000)"
            - "Participant_J.status == 'SUSPENDED' and deferral_suspended_until == '2026-06-30' (hop 2: status+suspension date)"
            - "Contribution POST returns 409 ERR_DEFERRAL_SUSPENDED (hop 3: causally driven by deferral_suspended_until set in hop 2)"

      - name: terminate_overdue_rmd_cascade_depth_two
        # Trigger: Participant terminate. Hop 1: status flip to TERMINATED.
        # Hop 2: terminate causes any SCHEDULED RMDSchedule with due_date <
        # current_date to flip to MISSED. Different trigger from hardship.
        grounds:
          - state_machines.Participant.transitions.ACTIVE_to_TERMINATED
          - state_machines.RMDSchedule
          - entities.RMDSchedule.fields.status
          - endpoints.POST_/plans/{planId}/participants/{participantId}/terminate
        distinguishing_aspect: |
          Trigger: Participant terminate (different from hardship trigger
          above). Hop 1: Participant.status → TERMINATED. Hop 2: that status
          change ITSELF cascades to overdue SCHEDULED RMDSchedule rows,
          flipping them to MISSED. Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Create Plan_K: SAFE_HARBOR_BASIC, CLIFF cliff_years=1, rmd_age=73; activate"
            - "Advance clock to '2026-02-01' (NO RMDs exist yet, so no MISSED transition fires)"
            - "Enroll+activate Participant_K with date_of_birth='1951-06-15', hire_date='2020-01-01', annual_compensation_cents=6000000, elected_deferral_pct=0"
            - "Seed Participant_K.total_account_balance_cents = 50000000"
            - "POST rmd-schedules {rmd_year:2024} → first-year RMD because age_attained=2024-1951=73=rmd_age; due_date='2025-04-01'; status='SCHEDULED'; row is past-due at creation but NOT auto-flipped (only /_clock/advance flips, and the clock did not move after creation)"
          trigger:
            - "POST /plans/{Plan_K.id}/participants/{Participant_K.id}/terminate"
          assert:
            - "Participant_K.status == 'TERMINATED' (hop 1)"
            - "RMDSchedule (rmd_year=2024).status == 'MISSED' (hop 2: caused by participant status flip in same request — the terminate cascade ran, not the clock-advance path)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_loan_request
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors.ERR_PLAN_NOT_ACTIVE
          - errors.ERR_LOAN_EXCEEDS_MAX
          - endpoints.POST_/plans/{planId}/participants/{participantId}/loans
        distinguishing_aspect: |
          Pair {state, business_fiscal}: POST /loans against a FROZEN plan
          (state failure, priority 4) with a requested_amount_cents that ALSO
          exceeds max_loan_amount (business_fiscal failure, priority 10) must
          return ERR_PLAN_NOT_ACTIVE (state wins by priority), NOT
          ERR_LOAN_EXCEEDS_MAX. This pins the state-vs-fiscal ordering.
        test_recipe:
          setup:
            - "Create Plan_L: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_L with hire_date=2024-01-01"
            - "Seed Participant_L.total_account_balance_cents = 1000000 (vested_balance=1000000, max_loan = min(500000, 5000000) = 500000)"
            - "POST /plans/{Plan_L.id}/freeze (Plan_L now FROZEN; Participant_L auto-SUSPENDED with deferral_suspended_until='9999-12-31')"
          trigger:
            - "POST /plans/{Plan_L.id}/participants/{Participant_L.id}/loans with {requested_amount_cents:99999999, term_months:12} (both: plan is FROZEN AND amount > max_loan=500000)"
          assert:
            - "Response error_id == 'ERR_PLAN_NOT_ACTIVE' (state, priority 4) — NOT 'ERR_LOAN_EXCEEDS_MAX' (priority 10)"

      - name: business_safety_vs_business_temporal_contribution
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_DUPLICATE_PAY_PERIOD
          - errors.ERR_DEFERRAL_SUSPENDED
        distinguishing_aspect: |
          Pair {business_temporal, business_safety} — a DIFFERENT pair from
          {state, business_fiscal} above. Posting a contribution that is BOTH
          a duplicate pay-period (temporal failure, priority 7) AND while
          deferrals are suspended (safety failure, priority 8) must return
          ERR_DUPLICATE_PAY_PERIOD (priority 7 wins).
        test_recipe:
          setup:
            - "Create Plan_M: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_M with hire_date=2024-01-01, elected_deferral_pct=5, annual_compensation_cents=6000000"
            - "Seed Participant_M.total_account_balance_cents = 500000"
            - "POST contribution {pay_period_end:'2026-02-15', gross_pay_cents:500000} (first contribution succeeds)"
            - "POST hardship {requested_amount_cents:200000, hardship_reason_code:'MEDICAL'}; POST .../approve (now Participant_M.deferral_suspended_until = '2026-06-30')"
          trigger:
            - "POST contribution {pay_period_end:'2026-02-15', gross_pay_cents:500000} again (duplicate + suspended both fail)"
          assert:
            - "Response error_id == 'ERR_DUPLICATE_PAY_PERIOD' (priority 7) — NOT 'ERR_DEFERRAL_SUSPENDED' (priority 8)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: cliff_vesting_boundary_at_exact_year
        # Boundary on the CLIFF metric: service_years_completed >= cliff_years
        # uses >= not >. service_days = (current_date - hire_date).days; the
        # scaffold pins floor(service_days/365). For hire='2024-01-01',
        # clock='2026-12-30' → 1094 days → floor=2 → 0%; one day later,
        # clock='2026-12-31' → 1095 days → floor=3 → 100%.
        grounds:
          - calculations.vested_percent
          - entities.Plan.fields.cliff_years
          - entities.Participant.fields.vested_pct_snapshot
          - endpoints.POST_/plans/{planId}/participants/{participantId}/vesting-snapshots
          - endpoints.POST_/plans/{planId}/_clock/advance
        distinguishing_aspect: |
          Numeric threshold boundary on CLIFF vesting. Reached through
          POST .../vesting-snapshots. With cliff_years=3 and service_days=1095
          (exactly 3*365 days from hire_date='2024-01-01' → clock='2026-12-31'),
          floor(1095/365)=3 → vested_pct=100.0; one day earlier
          (clock='2026-12-30', service_days=1094) → floor=2 → vested_pct=0.0.
          The off-by-one between `>=` and `>` decides 0% vs 100% — a $0 vs
          full-balance outcome.
        test_recipe:
          setup:
            - "Create Plan_N: vesting_schedule_type=CLIFF, cliff_years=3, match_formula_type=SAFE_HARBOR_BASIC; activate (clock auto-initialized to today)"
            - "POST /_clock/advance to '2024-01-01' (clock-monotonicity check: today must be < 2024-01-01? In test environment we set the implementation's clock initial value below 2024-01-01; if today's date in test container is later, the scaffold permits ERR_CLOCK_NOT_MONOTONIC — test instead uses hire_date='2024-01-01' with clock advanced from whatever initial value the activate call set up)"
            - "Enroll+activate Participant_N with hire_date='2024-01-01', annual_compensation_cents=6000000, elected_deferral_pct=0"
            - "Seed Participant_N.total_account_balance_cents = 1000000"
          trigger:
            - "POST /_clock/advance to '2026-12-30' (service_days = 1094)"
            - "POST .../vesting-snapshots → snapshot_a"
            - "POST /_clock/advance to '2026-12-31' (service_days = 1095)"
            - "POST .../vesting-snapshots → snapshot_b"
          assert:
            - "snapshot_a.service_years_completed == 2 and snapshot_a.vested_pct == 0.0 and snapshot_a.vested_balance_cents == 0"
            - "snapshot_b.service_years_completed == 3 and snapshot_b.vested_pct == 100.0 and snapshot_b.vested_balance_cents == 1000000"

      - name: contribution_records_empty_collection_for_new_participant
        # Different metric (collection-emptiness, not numeric threshold) on a
        # different endpoint (GET contribution-records). Just-enrolled participant
        # has zero contribution rows; GET must return [] with total_count=0,
        # not 404 or error.
        grounds:
          - entities.ContributionRecord
          - endpoints.GET_/plans/{planId}/participants/{participantId}/contribution-records
          - entities.Participant.fields.cumulative_employee_contribution_cents
          - entities.Participant.fields.total_account_balance_cents
        distinguishing_aspect: |
          Empty-collection edge on a *different* metric (collection size) than
          the numeric vesting threshold above, and reached through a *different*
          endpoint (GET contribution-records vs POST vesting-snapshots).
          cumulative_employee_contribution_cents MUST equal 0 (not null);
          total_account_balance_cents MUST equal 0; list endpoint returns
          data=[] with total_count=0 and has_more=false.
        test_recipe:
          setup:
            - "Create Plan_O: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll Participant_O (do NOT activate; no contributions ever posted)"
          trigger:
            - "GET /plans/{Plan_O.id}/participants/{Participant_O.id}"
            - "GET /plans/{Plan_O.id}/participants/{Participant_O.id}/contribution-records"
          assert:
            - "Participant_O.cumulative_employee_contribution_cents == 0"
            - "Participant_O.total_account_balance_cents == 0"
            - "GET contribution-records response: data == [], total_count == 0, has_more == false"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_freeze_blocked_by_active_loan
        grounds:
          - state_machines.Plan.transitions.ACTIVE_to_FROZEN
          - state_machines.Loan
          - entities.Loan.fields.outstanding_principal_cents
          - errors.ERR_FREEZE_PRECONDITION_VIOLATED
        distinguishing_aspect: |
          Cross-entity pair {Plan, Loan}: Plan.ACTIVE→FROZEN is blocked if
          ANY Loan for ANY Participant in this plan is in ACTIVE status with
          outstanding_principal_cents > 0. Plan's valid transitions depend on
          Loan state.
        test_recipe:
          setup:
            - "Create Plan_P: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_P with hire_date=2024-01-01"
            - "Seed Participant_P.total_account_balance_cents = 4000000"
            - "POST loan {requested_amount_cents:500000, term_months:10}; POST .../approve (Loan_P is now ACTIVE with outstanding=500000)"
          trigger:
            - "POST /plans/{Plan_P.id}/freeze"
          assert:
            - "Response: 409 with error_id == 'ERR_FREEZE_PRECONDITION_VIOLATED'"
            - "Plan_P.status remains 'ACTIVE'"

      - name: participant_terminate_blocked_by_active_loan
        grounds:
          - state_machines.Participant.transitions.ACTIVE_to_TERMINATED
          - state_machines.Loan
          - entities.Loan.fields.status
          - errors.ERR_PARTICIPANT_NOT_IN_VALID_STATE
        distinguishing_aspect: |
          Cross-entity pair {Participant, Loan} — DIFFERENT pair from
          {Plan, Loan} above. Participant.ACTIVE→TERMINATED is blocked if
          this participant has any Loan in ACTIVE status (regardless of
          outstanding balance — the existence of an ACTIVE loan is the gate).
        test_recipe:
          setup:
            - "Create Plan_Q: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_Q with hire_date=2024-01-01"
            - "Seed Participant_Q.total_account_balance_cents = 4000000"
            - "POST loan {requested_amount_cents:500000, term_months:10}; POST .../approve"
          trigger:
            - "POST /plans/{Plan_Q.id}/participants/{Participant_Q.id}/terminate"
          assert:
            - "Response: 409 with error_id == 'ERR_PARTICIPANT_NOT_IN_VALID_STATE'"
            - "Participant_Q.status remains 'ACTIVE'"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: contribution_pay_period_exact_day_uniqueness
        # Interval semantics: closed-point (single date) match per
        # (participant_id, pay_period_end). Adjacent dates DO NOT collide.
        grounds:
          - validations[priority=7]
          - entities.ContributionRecord.fields.pay_period_end
          - errors.ERR_DUPLICATE_PAY_PERIOD
          - endpoints.POST_/plans/{planId}/participants/{participantId}/contribution-records
        distinguishing_aspect: |
          Closed-point interval semantics on ContributionRecord: two rows
          collide only when pay_period_end is exactly equal. Adjacent dates
          (one day apart) do NOT collide. Two rows for '2026-02-15' →
          409; '2026-02-15' + '2026-02-16' → both succeed.
        test_recipe:
          setup:
            - "Create Plan_R: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_R with hire_date=2024-01-01, elected_deferral_pct=5, annual_compensation_cents=6000000"
            - "Seed Participant_R.total_account_balance_cents = 0"
          trigger:
            - "POST contribution {pay_period_end:'2026-02-15', gross_pay_cents:500000} → first call"
            - "POST contribution {pay_period_end:'2026-02-16', gross_pay_cents:500000} → second call"
            - "POST contribution {pay_period_end:'2026-02-15', gross_pay_cents:500000} → third call (duplicate of first)"
          assert:
            - "First call 201; second call 201; third call 409 ERR_DUPLICATE_PAY_PERIOD"
            - "Adjacent pay_period_end values 02-15 and 02-16 do NOT collide (proves point-not-range semantics)"

      - name: loan_existence_window_one_outstanding
        # Different interval semantics: existence-interval on Loan. A Loan
        # occupies a participant's loan-slot from REQUESTED through any
        # non-terminal state. The interval is half-open: [creation, terminal).
        # Once a loan reaches REJECTED/SATISFIED/DEFAULTED, the next loan
        # request succeeds — proves the interval CLOSES at terminal state.
        grounds:
          - validations[priority=9]
          - entities.Loan.fields.status
          - errors.ERR_LOAN_ALREADY_OUTSTANDING
          - endpoints.POST_/plans/{planId}/participants/{participantId}/loans
        distinguishing_aspect: |
          Existence-interval semantics on Loan (different geometry from
          ContributionRecord's point-equality). A participant can hold at
          most one Loan whose status ∈ {REQUESTED, ACTIVE} at any instant —
          the interval is half-open [creation, terminal_transition). Once
          the first loan reaches a terminal state (REJECTED/SATISFIED/
          DEFAULTED), the slot reopens and a new loan succeeds. Aggregate-
          existence-of-non-terminal, not date-equality.
        test_recipe:
          setup:
            - "Create Plan_S: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_S with hire_date=2024-01-01"
            - "Seed Participant_S.total_account_balance_cents = 4000000"
          trigger:
            - "POST loan_1 {requested_amount_cents:200000, term_months:10} → REQUESTED"
            - "POST loan_2 {requested_amount_cents:100000, term_months:10} → second simultaneous request"
            - "POST loan_1/reject (terminal state)"
            - "POST loan_3 {requested_amount_cents:100000, term_months:10} → after the slot reopened"
          assert:
            - "loan_1 → 201"
            - "loan_2 → 409 ERR_LOAN_ALREADY_OUTSTANDING (slot occupied by REQUESTED loan_1)"
            - "loan_1/reject → 200, loan_1.status == 'REJECTED'"
            - "loan_3 → 201 (slot reopened because terminal state closes the existence interval)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: loan_lifecycle_preserves_participant_total_balance
        # Conserved quantity: Participant.total_account_balance_cents.
        # Forward action: approve loan (no balance change — only outstanding
        # principal is tracked). Compensating action: repay in full (also no
        # balance change — repayments come from outside the account, modeled
        # as principal reduction only). Invariant: balance unchanged across
        # the full {approve → all repayments → SATISFIED} lifecycle.
        grounds:
          - state_machines.Loan.transitions.REQUESTED_to_ACTIVE
          - state_machines.Loan.transitions.ACTIVE_to_SATISFIED
          - entities.Participant.fields.total_account_balance_cents
          - entities.Loan.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Conserved quantity: Participant.total_account_balance_cents. The
          full loan lifecycle (approve → N repayments → SATISFIED) MUST leave
          total_account_balance_cents identical to its pre-approve value.
          Formula: balance_after = balance_before + 0 (repayments are
          outside-funds, not balance debits). A drifted implementation that
          debits balance at approve and credits at SATISFIED would also
          pass — but only if it credits the EXACT debited amount.
        test_recipe:
          setup:
            - "Create Plan_T: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_T with hire_date=2024-01-01"
            - "Seed Participant_T.total_account_balance_cents = 3000000"
            - "Record balance_before := 3000000"
            - "POST loan {requested_amount_cents:500000, term_months:5}; POST .../approve"
            - "POST 5 repayments of 100000 each (round_half_up(500000/5)=100000 exactly)"
          trigger:
            - "GET /plans/{Plan_T.id}/participants/{Participant_T.id} after the final repayment"
          assert:
            - "Loan_T.status == 'SATISFIED', Loan_T.outstanding_principal_cents == 0"
            - "Participant_T.total_account_balance_cents == 3000000 (== balance_before; conserved quantity unchanged)"

      - name: contribution_year_totals_match_sum_of_records
        # Different conserved quantity: cumulative_employee_contribution_cents
        # and cumulative_employer_match_cents on Participant. Invariant: after
        # any sequence of contribution POSTs (with no hardship/loan in between),
        # the cumulative fields equal the sum of the underlying rows for that
        # year. This guards against a forward action (POST contribution) being
        # paired with a compensating "recompute totals" that drifts.
        grounds:
          - entities.Participant.fields.cumulative_employee_contribution_cents
          - entities.Participant.fields.cumulative_employer_match_cents
          - entities.ContributionRecord.fields.employee_amount_cents
          - entities.ContributionRecord.fields.employer_match_cents
          - calculations.employer_match
          - endpoints.POST_/plans/{planId}/participants/{participantId}/contribution-records
        distinguishing_aspect: |
          Different conserved quantity from total_account_balance_cents:
          here it is the (cumulative_employee_contribution_cents,
          cumulative_employer_match_cents) PAIR. Invariant after each POST:
          cumulative_employee_contribution_cents == SUM(employee_amount_cents
          for all POSTED ContributionRecord this year) and same for employer.
          Forward action = POST contribution; compensating "action" is the
          implicit aggregate refresh; they MUST agree to the cent.
        test_recipe:
          setup:
            - "Create Plan_U: SAFE_HARBOR_BASIC, CLIFF cliff_years=1; activate; advance clock to 2026-01-01"
            - "Enroll+activate Participant_U with hire_date=2024-01-01, elected_deferral_pct=6, annual_compensation_cents=6000000"
          trigger:
            - "POST contribution {pay_period_end:'2026-01-15', gross_pay_cents:500000}"
            - "POST contribution {pay_period_end:'2026-01-31', gross_pay_cents:500000}"
            - "POST contribution {pay_period_end:'2026-02-15', gross_pay_cents:500000}"
            - "GET /plans/{Plan_U.id}/participants/{Participant_U.id}/contribution-records (collect rows)"
            - "GET /plans/{Plan_U.id}/participants/{Participant_U.id}"
          assert:
            - "Each contribution row: employee_amount_cents == 30000 (500000*0.06) and employer_match_cents == 20000 (Safe Harbor: 3*1+2*0.5=4% of 500000 = 20000)"
            - "Participant_U.cumulative_employee_contribution_cents == 90000 (== 3*30000 == sum of rows)"
            - "Participant_U.cumulative_employer_match_cents == 60000 (== 3*20000 == sum of rows)"
            - "Participant_U.total_account_balance_cents == 150000 (== 90000 + 60000)"
