      - name: commit_depends_on_hotel_participation_state_at_commit_time
        grounds:
          - validations[priority 17 ERR_HOTEL_NOT_PARTICIPATING]
          - state_machines.RoomBlockCommitment.OFFERED_to_COMMITTED
          - endpoints[POST /hotels/{id}/participation]
          - entities.Hotel.fields.participation_status
        distinguishing_aspect: |
          The commitment is legitimately OFFERED - the offer was made while the hotel was PARTICIPATING - and
          the acting SalesManager is fully authorised, yet the commit must fail because the HOTEL entity moved
          to SUSPENDED in between. Participation is re-checked at commit time, not captured at invite or offer
          time; reinstating the hotel makes the same commit call succeed and only then do the room counters and
          block_coverage_pct move.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; Harborview Grand PARTICIPATING with committable_rooms 600"
            - "opportunity QUALIFIED with peak_rooms_requested 1000; commitment for Harborview is OFFERED at 500 rooms / 214.33 / cutoff 30"
            - "the bureau then SUSPENDS Harborview - the existing OFFERED row is untouched"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
