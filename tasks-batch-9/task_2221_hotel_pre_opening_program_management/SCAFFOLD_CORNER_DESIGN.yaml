            - "after the receipt of order A at clock date 2026-10-05, inside the half-open window: committed_cents 300000, spent_cents 400000, available_cents 300000 — the receipt moves value between the two derived sums without changing available_cents"
            - "after the cancellation of order B: committed_cents 0, spent_cents 400000, available_cents 600000"
