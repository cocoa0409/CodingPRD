            - "the response error_id is ERR_OFFER_OUT_OF_PARITY and NOT ERR_INSUFFICIENT_POINTS"
            - "PortalInventoryOffer.${o_id}.portal_price_cents == 56000"
            - "PortalInventoryOffer.${o_id}.parity_status == OUT_OF_PARITY"
            - "PortalInventoryOffer.${o_id}.seats_committed == 0"
            - "PortalInventoryOffer.${o_id}.status == OPEN"
            - "no RedemptionOrder row exists with account_id ${a_id}"

  - rule_id: boundary_precision_check
    instances:
      - name: boundary_rotation_cap_headroom_exhausts_mid_transaction
        grounds:
          - calculations.transaction_points_award
          - entities.EarningCategoryRotation.fields.capped_spend_cents
          - entities.Transaction.fields.rotation_eligible_cents
        distinguishing_aspect: |
          Metric: a cumulative per-account spend cap in cents, crossed by a transaction that
          straddles it. Endpoint: POST /rewards/transactions. The third transaction sits exactly at
          zero headroom, so its rotation_eligible_cents is 0 and its bonus leg is 0 while its base
          leg still pays — a zero-quantity edge on the bonus leg only, not a rejection.
        test_recipe:
          setup:
            - "One CORE account and one MAPPED GROCERY category at base_multiplier 1.0."
