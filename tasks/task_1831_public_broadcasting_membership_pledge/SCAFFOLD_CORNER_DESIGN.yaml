      - name: membership_coordinator_cannot_finalize_nffs
        claim_type: rbac_denial
        grounds: [roles.MembershipCoordinator, roles.StationAdmin, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Finalize is StationAdmin-exclusive; the MembershipCoordinator who may draft cannot finalize — segregation-of-duties role model enforced at two layers (role + user id)."
        test_recipe:
          setup: ["NFFS report drafted by coordinator"]
          setup_api_calls:
            - call: "POST /station/nffs-reports"
              payload: { fiscal_year: 2026 }
              as: MembershipCoordinator
