    distinguishing_aspect: "Rounding is applied per step, not once at the end: gross_value 63500.00 x 0.00195313 = 124.023755 rounds to 124.02 first, and 0.046 of 124.02 is 5.70 - an implementation that taxes the unrounded 124.023755 gets 5.71 and a net of 118.31."
