      - name: proof_score_partial_weights
        claim_type: correct_result
        grounds: [calculations.claim_proof_score]
        distinguishing_aspect: "Serial-only proofs on an unverified claimant yield exactly 30 (W_SERIAL); photo adds 15 more on resubmit."
        test_recipe:
          setup: ["TRANSIT program, LOW policy, location, item, claimant"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
