              payload: { store_id: "${s2_id}", item_id: "${item_all}", on_hand_units: 7, size_on_hand: [{ size_code: "XS", units: 1 }, { size_code: "S", units: 1 }, { size_code: "M", units: 1 }, { size_code: "L", units: 1 }, { size_code: "XL", units: 1 }, { size_code: "XXL", units: 1 }, { size_code: "XXXL", units: 1 }], min_units: 4, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 10 }
