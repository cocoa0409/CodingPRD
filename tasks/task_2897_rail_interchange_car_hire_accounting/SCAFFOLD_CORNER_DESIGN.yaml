          setup:
            - "Railroads BN, CX and NS (all ACTIVE); car type XM; junction JCT-CHI; CX-owned car CX 100001 delivered to BN 2026-08-24T00:00:00Z and returned 2026-08-28T00:00:00Z, producing one CLOSED BN movement. NS never touched the car. Clock 2026-08-28T00:00:00Z."
