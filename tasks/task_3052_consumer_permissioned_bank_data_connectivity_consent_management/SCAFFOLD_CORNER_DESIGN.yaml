scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: institution_creation_applies_defaults_and_system_fields
        claim_type: creation_defaults
        grounds:
          - entities.Institution.fields.migration_state
          - entities.Institution.fields.status
          - entities.Institution.fields.connectivity_mode
        distinguishing_aspect: "A created Institution starts with migration_state=NOT_STARTED, status=ACTIVE, connectivity_mode=LEGACY_MODE and version=1; system fields id/created_at are minted by the server."
        test_recipe:
          setup: ["Empty database; clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /institutions"
              payload: { name: "Default Fields Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, st: $.data.status, mig: $.data.migration_state, mode: $.data.connectivity_mode, v: $.data.version }
          assert:
            - "migration_state == NOT_STARTED, status == ACTIVE, connectivity_mode == LEGACY_MODE, version == 1"
            - "created_at == 2026-09-01T00:00:00.000Z (server-minted from the logical clock default)"

      - name: connection_input_reauth_cooldown_default_applied
        claim_type: defaults
        grounds:
          - entities.Connection.fields.reauth_cooldown_seconds
        distinguishing_aspect: "Omitting reauth_cooldown_seconds on connection creation applies the default 0, so a later reauth is never cooldown-blocked."
        test_recipe:
          setup: ["Standard healthy stack: institution+agreement, APPROVED BROAD recipient, LOW [BALANCE] tier, ACTIVE consent"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "DefaultCool Bank", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "CoolApp", declared_use_case: "cooldown defaults", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "CoolTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_q", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_q
              captures: { consent_id: $.data.id }
          trigger:
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_q", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_q
              captures: { conn_id: $.data.id, cd: $.data.reauth_cooldown_seconds, st: $.data.status }
          assert:
            - "reauth_cooldown_seconds == 0 (default applied when omitted)"
            - "status == PENDING_AUTH (initial state), consecutive_failures == 0, version == 1"

      - name: institution_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints."GET /institutions/{institutionId}"
        distinguishing_aspect: "GET on a random UUID that matches no institution returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /institutions/11111111-2222-3333-4444-555555555555"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status == 404 and error_id == ERR_NOT_FOUND"

      - name: consent_list_pagination_envelope
        claim_type: listing_pagination
        grounds:
          - response_envelope
          - endpoints."GET /consents"
        distinguishing_aspect: "List responses carry the fixed envelope: meta.api_request_id, response_type=array, and pagination fields limit/offset/total_count/has_more with default limit 10."
        test_recipe:
          setup: ["One APPROVED recipient with one ACTIVE consent"]
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "PageApp", declared_use_case: "pagination", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "PageTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_r", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_r
          trigger:
            - call: "GET /consents"
              as: PlatformAdmin
          assert:
            - "response body has meta.api_request_id and response_type == array"
            - "pagination fields limit == 10, offset == 0, total_count == 1, has_more == false are present"

      - name: immutable_datascopegrant_has_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.DataScopeGrant
        distinguishing_aspect: "DataScopeGrant (common_fields: false) carries only id and created_at; no update/delete endpoints exist for it and it is only observable via GET /consents/{id}/grants."
        test_recipe:
          setup: ["One ACTIVE consent with scopes [BALANCE, TRANSACTIONS]"]
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "GrantApp", declared_use_case: "grants", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "GrantTier", scopes_included: ["BALANCE", "TRANSACTIONS"], rate_class: "MEDIUM" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_s", data_scopes: ["BALANCE", "TRANSACTIONS"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_s
              captures: { consent_id: $.data.id }
          trigger:
            - call: "GET /consents/${consent_id}/grants"
              as: PlatformAdmin
          assert:
            - "Exactly 2 DataScopeGrant rows exist with scopes BALANCE and TRANSACTIONS"
            - "Each grant row exposes id, created_at, consent_id, scope — and no version/updated_at fields"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: revoke_already_revoked_consent_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ConsentRecord.ACTIVE_to_REVOKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REVOKED is terminal for ConsentRecord; a second revoke returns 409 ERR_INVALID_STATE and emits no further webhooks."
        test_recipe:
          setup: ["ACTIVE consent with one ACTIVE connection"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "DoubleRevoke Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "RevokeApp", declared_use_case: "revocation", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "RevokeTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_t", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_t
              captures: { consent_id: $.data.id }
            - call: "POST /consents/${consent_id}/revoke"
              payload: {}
              as: Consumer
              as_user_id: cons_t
          trigger:
            - call: "POST /consents/${consent_id}/revoke"
              payload: {}
              as: Consumer
              as_user_id: cons_t
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409 and error_id == ERR_INVALID_STATE"
            - "ConsentRecord.${consent_id}.status remains REVOKED and revoked_at is unchanged"

      - name: refresh_disconnected_connection_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RefreshJob.QUEUED_to_SUCCEEDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Refresh requires the connection in {ACTIVE, MIGRATING}; a DISCONNECTED connection fails the state gate before any other business check."
        test_recipe:
          setup: ["Connection created and completed, then its consent revoked (connection DISCONNECTED)"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "DiscBank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "DiscApp", declared_use_case: "disconnect", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "DiscTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_u", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_u
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_u", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_u
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_u
            - call: "POST /consents/${consent_id}/revoke"
              payload: {}
              as: Consumer
              as_user_id: cons_u
          trigger:
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL" }
              as: Consumer
              as_user_id: cons_u
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409 and error_id == ERR_INVALID_STATE (DISCONNECTED is terminal)"
            - "No new RefreshJob row is created for the rejected refresh"

      - name: reauth_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Connection.REAUTH_REQUIRED_to_ACTIVE
        distinguishing_aspect: "POST /connections/{id}/reauth is only valid from REAUTH_REQUIRED or BROKEN; calling it on an ACTIVE connection is rejected."
        test_recipe:
          setup: ["One ACTIVE connection"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "ActiveReauth Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "ActiveReauthApp", declared_use_case: "state gate", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "ActiveReauthTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_v", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_v
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_v", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_v
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_v
          trigger:
            - call: "POST /connections/${conn_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_v
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409 and error_id == ERR_INVALID_STATE"
            - "Connection remains ACTIVE with consecutive_failures == 0"

      - name: institution_broken_cascades_reauth_prompts_to_all_active_connections
        claim_type: cascade_down
        grounds:
          - state_machines.Institution.DEGRADED_to_BROKEN
          - state_machines.Connection.ACTIVE_to_REAUTH_REQUIRED
        distinguishing_aspect: "When the institution crosses to BROKEN, every non-terminal connection is pushed to REAUTH_REQUIRED and each recipient gets an INSTITUTION_BROKEN webhook — one institution-level event, many child transitions."
        test_recipe:
          setup: ["Institution with agreement; two consumers each with an ACTIVE connection at the institution (two consents, two connections)"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "CascadeBreak Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "BreakApp", declared_use_case: "outage handling", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "BreakTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v1: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_w1", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v1}" }
              as: Consumer
              as_user_id: cons_w1
              captures: { consent1_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_w1", consent_id: "${consent1_id}", method: "CREDENTIALS", reauth_cooldown_seconds: 0 }
              as: Consumer
              as_user_id: cons_w1
              captures: { conn1_id: $.data.id }
            - call: "POST /connections/${conn1_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_w1
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v2: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_w2", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v2}" }
              as: Consumer
              as_user_id: cons_w2
              captures: { consent2_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_w2", consent_id: "${consent2_id}", method: "CREDENTIALS", reauth_cooldown_seconds: 0 }
              as: Consumer
              as_user_id: cons_w2
              captures: { conn2_id: $.data.id }
            - call: "POST /connections/${conn2_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_w2
          trigger:
            - call: "POST /connections/${conn1_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_w1
            - call: "POST /connections/${conn1_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_w1
            - call: "POST /connections/${conn1_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_w1
            - call: "POST /connections/${conn1_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_w1
            - call: "POST /connections/${conn1_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_w1
            - call: "POST /connections/${conn1_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_w1
            - call: "POST /connections/${conn1_id}/refresh"
              payload: { kind: "FULL", failure_reason: "INSTITUTION_DOWN" }
              as: Consumer
              as_user_id: cons_w1
            - call: "POST /connections/${conn1_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_w1
              captures: { err_blocked: $.data.error_id }
          assert:
            - "After the 5th INSTITUTION_DOWN event, Institution.${inst_id}.status == BROKEN (5 >= BROKEN_THRESHOLD)"
            - "Connection.${conn1_id} (ACTIVE when the 5th event landed) and Connection.${conn2_id} (still ACTIVE — it never failed) are both pushed to REAUTH_REQUIRED by the institution-level breakage cascade"
            - "Exactly 2 INSTITUTION_BROKEN WebhookEvents exist for recipient ${rec_id} (one per prompted connection)"
            - "The final reauth attempt is rejected: err_blocked == ERR_PARENT_NOT_OPERABLE (reauth is blocked while the institution itself is BROKEN)"

      - name: complete_auth_on_broken_consent_rejected_consent_not_active
        claim_type: guarded_transition
        grounds:
          - state_machines.Connection.PENDING_AUTH_to_ACTIVE
          - validations[priority=7]
        distinguishing_aspect: "Connection complete_auth is guarded by the consent being ACTIVE: a PENDING_AUTH connection whose consent was revoked mid-flow cannot activate."
        test_recipe:
          setup: ["PENDING_AUTH connection; consent revoked after connection creation"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "MidFlow Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "MidFlowApp", declared_use_case: "mid-flow revoke", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "MidFlowTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
