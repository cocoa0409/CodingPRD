              payload: { risk_factors: [], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_c_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /opo/eligibility-screenings/${scr_c}/decision"
              payload: { decision: "RULED_OUT", ruled_out_reason: "AGE_CRITERIA" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /opo/hospital-partners/${hosp_id}"
              payload: {}
              as: OpoAdmin
              captures: { total: $.data.referral_count, timely: $.data.timely_referral_count, untimely: $.data.untimely_referral_count, rate: $.data.timely_referral_rate, posture: $.data.partner_posture }
          assert:
            - "${flag_a} == TIMELY, ${flag_b} == UNTIMELY with ${lag_b} == 90"
            - "${total} == 3: the non-ventilated and the ruled-out referral are both counted"
            - "${timely} == 2 and ${untimely} == 1"
            - "${rate} == 66.67 (200/3 rounded half up at 2 decimals)"
            - "${posture} == GOOD_STANDING because referral_count 3 < MIN_POSTURE_SAMPLE 4"

      - name: partner_posture_demotes_when_the_lifetime_rate_crosses_seventy_five
        claim_type: threshold
        grounds:
          - calculations.hospital_timeliness_posture.constants
          - calculations.hospital_timeliness_posture.formula
        distinguishing_aspect: |
          The posture tiers are walked exactly on their floors with the sample floor already met:
          3 timely of 4 is 75.00 == RECERT_TIMELY_PASS and stays GOOD_STANDING, and one more untimely
          referral makes it 3 of 5 == 60.00 == RECERT_TIMELY_PROBATION, which is WATCH rather than
          PROBATION because both comparisons are inclusive.
