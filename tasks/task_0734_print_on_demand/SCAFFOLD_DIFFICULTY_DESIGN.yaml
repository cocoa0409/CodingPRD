scaffold_difficulty_design:

  # ==========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances across different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: creator_profit_provisional_vs_final_on_consumer_fault_reprint
        grounds:
          - calculations.creator_profit
          - calculations.creator_profit.variants.provisional
          - calculations.creator_profit.variants.final
          - state_machines.Order.CAPTURED_to_CAPTURED  # implicit — via capture -> route side effect
          - state_machines.FulfillmentJob.SHIPPED_to_FAILED
          - state_machines.FulfillmentJob.FAILED_to_REPRINT_REQUESTED
          - state_machines.FulfillmentJob.REPRINT_REQUESTED_to_QUEUED
        distinguishing_aspect: |
          Same Order — provisional creator_net_cents (captured at POST /pod/orders) equals gross_markup = 2000c;
          final creator_net_cents (recomputed on DELIVERED after CONSUMER_FAULT reprint) equals gross_markup
          minus final_partner_absorb = 2000 - 1000 = 1000c. Divergence is exactly 1000c on the Order entity domain.
        test_recipe:
          setup:
            - "Clock set to 2026-06-01T00:00:00Z."
            - "One FulfillmentPartner in US with cost_multiplier_bps=10000 and max_backlog_hours=168."
            - "APPAREL Product base_cost_cents=2000; a Variant with base_cost_delta_cents=0, active=true."
            - "One Creator, VERIFIED, with a Storefront markup_bps=5000."
            - "One APPROVED Design and one PUBLISHED Listing."
            - "One Order (item_count=2, is_sample=false); provisional creator_net_cents recorded as 2000."
            - "Order authorized then captured; FulfillmentJob created and routed to Partner A."
            - "Job proceeds IN_PRINT -> SHIPPED; then partner marks it FAILED; admin opens a CONSUMER_FAULT/DAMAGED reprint request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/fulfillment-partners"
              payload: { name: "US Print A", country_code: "US", cost_multiplier_bps: 10000, max_backlog_hours: 168 }
              as: PlatformAdmin
              captures: { fp_a_id: $.data.id }
            - call: "POST /pod/products"
              payload: { sku: "T-CLASSIC", category: "APPAREL", base_cost_cents: 2000, dimensions_json: { width_px: 3000, height_px: 3600, dpi: 300 } }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /pod/products/${prod_id}/variants"
              payload: { color: "BLACK", size: "M" }
              as: PlatformAdmin
              captures: { var_id: $.data.id }
            - call: "POST /pod/creators/register"
              payload: { email: "alice@example.com", display_name: "Alice Prints", payout_country_code: "US" }
              as: Anonymous
              captures: { creator_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /pod/storefronts"
              payload: { creator_id: "${creator_id}", slug: "alice-prints", integration_channel: "NATIVE", markup_bps: 5000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sf_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/designs"
              payload: { file_hash: "hash_a_dvcp_1" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { design_id: $.data.id }
            - call: "POST /pod/designs/${design_id}/mockup"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /pod/designs/${design_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pod/listings"
              payload: { storefront_id: "${sf_id}", design_id: "${design_id}", variant_id: "${var_id}", title: "Classic Tee" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /pod/listings/${listing_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /pod/orders"
              payload: { storefront_id: "${sf_id}", listing_id: "${listing_id}", buyer_email: "buyer@example.com", ship_country_code: "US", item_count: 2, is_sample: false }
              as: Anonymous
              captures: { order_id: $.data.id, provisional_net: $.data.creator_net_cents }
            - call: "POST /pod/orders/${order_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pod/orders/${order_id}/capture"
              payload: {}
              as: PlatformAdmin
            - call: "GET /pod/fulfillment-jobs"
              payload: {}
              as: PlatformAdmin
              captures: { job_id: "$.data[0].id" }
            - call: "POST /pod/orders/${order_id}/mark-in-print"
              payload: {}
              as: FulfillmentPartner
              as_user_id: "${fp_a_id}"
            - call: "POST /pod/orders/${order_id}/mark-shipped"
              payload: {}
              as: FulfillmentPartner
              as_user_id: "${fp_a_id}"
            - call: "POST /pod/fulfillment-jobs/${job_id}/mark-failed"
              payload: {}
              as: FulfillmentPartner
              as_user_id: "${fp_a_id}"
            - call: "POST /pod/fulfillment-jobs/${job_id}/reprint-requests"
              payload: { fault_category: "CONSUMER_FAULT", reason_code: "DAMAGED" }
              as: PlatformAdmin
              captures: { reprint_id: $.data.id }
          trigger:
            - call: "POST /pod/reprint-requests/${reprint_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pod/orders/${order_id}/mark-in-print"
              payload: {}
              as: FulfillmentPartner
              as_user_id: "${fp_a_id}"
            - call: "POST /pod/orders/${order_id}/mark-shipped"
              payload: {}
              as: FulfillmentPartner
              as_user_id: "${fp_a_id}"
            - call: "POST /pod/orders/${order_id}/mark-delivered"
              payload: {}
              as: FulfillmentPartner
              as_user_id: "${fp_a_id}"
          assert:
            - "provisional_net == 2000"
            - "Order.${order_id}.creator_net_cents == 1000"
            - "Order.${order_id}.creator_net_cents != provisional_net"
            - "FulfillmentJob.${job_id}.reprint_generation == 1"

      - name: reprint_risk_score_incremental_vs_full_recompute
        grounds:
          - calculations.creator_reprint_risk_score
          - calculations.creator_reprint_risk_score.variants.incremental
          - calculations.creator_reprint_risk_score.variants.full_recompute
          - entities.Creator.fields.reprint_strike_count
        distinguishing_aspect: |
          Same Creator, different entity domain (Creator, not Order). Incremental variant leaves
          reprint_strike_count == 4 after four CONSUMER_FAULT approvals within a fresh 90-day window;
          full_recompute variant run after the clock advances 91 days re-walks the window, drops
          all four (now outside the 90-day tail), and yields reprint_strike_count == 0. Divergence 4.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
