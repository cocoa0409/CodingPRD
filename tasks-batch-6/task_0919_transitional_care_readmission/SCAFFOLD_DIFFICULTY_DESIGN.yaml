  - rule_id: compensating_invariant
    instances:
      - name: discrepancy_disposition_then_reopen_conserves_bucket_total
        grounds:
          - calculations.medrec_conservation_counters
          - state_machines.MedDiscrepancy.UNRESOLVED_to_RESOLVED
          - state_machines.MedDiscrepancy.UNRESOLVED_to_DEFERRED
          - state_machines.MedDiscrepancy.RESOLVED_to_UNRESOLVED
          - entities.MedReconciliation.fields.discrepancy_count
        distinguishing_aspect: |
          The conserved quantity is the reconciliation's line-item population -
          discrepancy_count must equal resolved_count plus unresolved_count plus
          deferred_count after EVERY disposition and every reopen, so the
          forward action and its compensating reopen leave the total at exactly
          3 with no drift.
        test_recipe:
          setup:
            - "A HIGH-tier episode whose MedReconciliation holds three UNRESOLVED line items - LOW, MODERATE and HIGH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Nora Vance", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-C101", full_name: "Sam Ito", date_of_birth: "1943-03-03" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref1_id: $.data.id }
            - call: "POST /tcm/referrals/${ref1_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep1_id: $.data.created_episode_id }
            - call: "POST /tcm/episodes/${ep1_id}/med-reconciliations"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { mr1_id: $.data.id, mr1_v0: $.data.version }
            - call: "POST /tcm/med-reconciliations/${mr1_id}/discrepancies"
              payload: { medication_name: "metformin", discrepancy_type: "DOSE_MISMATCH", severity: "LOW", expected_med_reconciliation_version: "${mr1_v0}" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { d_low_id: $.data.id }
            - call: "GET /tcm/med-reconciliations/${mr1_id}"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { mr1_v1: $.data.version }
            - call: "POST /tcm/med-reconciliations/${mr1_id}/discrepancies"
              payload: { medication_name: "lisinopril", discrepancy_type: "OMISSION", severity: "MODERATE", expected_med_reconciliation_version: "${mr1_v1}" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { d_mod_id: $.data.id }
            - call: "GET /tcm/med-reconciliations/${mr1_id}"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { mr1_v2: $.data.version }
            - call: "POST /tcm/med-reconciliations/${mr1_id}/discrepancies"
              payload: { medication_name: "apixaban", discrepancy_type: "DUPLICATION", severity: "HIGH", expected_med_reconciliation_version: "${mr1_v2}" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { d_high_id: $.data.id }
          trigger:
            - call: "POST /tcm/discrepancies/${d_low_id}/disposition"
              payload: { disposition: "RESOLVED", resolution_note: "dose verified" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /tcm/discrepancies/${d_mod_id}/disposition"
              payload: { disposition: "DEFERRED", resolution_note: "deferred to PCP visit" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /tcm/discrepancies/${d_low_id}/reopen"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "GET /tcm/med-reconciliations/${mr1_id}"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { mr1_count: $.data.discrepancy_count, mr1_unres: $.data.unresolved_count }
          assert:
            - "After the RESOLVED disposition: discrepancy_count == 3, resolved_count == 1, unresolved_count == 2, deferred_count == 0, blocking_unresolved_count == 1"
            - "After the DEFERRED disposition: discrepancy_count == 3, resolved_count == 1, unresolved_count == 1, deferred_count == 1, blocking_unresolved_count == 1"
            - "After the reopen: discrepancy_count == 3, resolved_count == 0, unresolved_count == 2, deferred_count == 1, blocking_unresolved_count == 1"
            - "discrepancy_count == resolved_count + unresolved_count + deferred_count holds at all three checkpoints"
            - "MedDiscrepancy.${d_low_id}.status == UNRESOLVED and MedDiscrepancy.${d_mod_id}.status == DEFERRED"
            - "MedReconciliation.${mr1_id}.status == IN_REVIEW throughout"

