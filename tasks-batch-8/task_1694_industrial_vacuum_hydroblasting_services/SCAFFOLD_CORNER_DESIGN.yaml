            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_safe_after: $.data.safety_status } }
          assert:
            - "job_exec == QUOTED and job_safe == CLEAR at creation"
            - "inc_status == REPORTED (initial state)"
            - "job_safe_after == CLEAR — NEAR_MISS severity does not trigger stop-work"

      - name: job_cancel_conditional_cascade_skips_terminal_children
        claim_type: side_effect_execution
        grounds:
          - state_machines.Job.MOBILIZED_to_CANCELLED
          - state_machines.Assignment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Conditional cascade on job cancel: the RELEASED assignment (terminal) is untouched while the CONFIRMED one is cancelled, and the ISSUED permit is revoked."
        test_recipe:
          setup: ["MOBILIZED job with two units: assignment A CONFIRMED, assignment B CONFIRMED then RELEASED; one HOT_WORK permit ISSUED"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_a: $.data.id } }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-02", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_b: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "conditional cascade" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_a}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_a: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_b}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_b: $.data.id } }
            - { call: "POST /v1/assignments/${asg_a}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/assignments/${asg_b}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/assignments/${asg_b}/release", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/permits", payload: { job_id: "${job_id}", permit_type: "HOT_WORK", space_id: "B-201", valid_from: "2026-07-31T00:00:00Z", valid_until: "2026-08-05T18:00:00Z" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { perm_id: $.data.id } }
          trigger:
            - { call: "POST /v1/jobs/${job_id}/cancel", payload: {}, as: ProjectManager }
          assert:
            - "Assignment.${asg_a}.status == CANCELLED (was CONFIRMED)"
            - "Assignment.${asg_b}.status == RELEASED (terminal child untouched by the cascade)"
            - "Permit.${perm_id}.status == REVOKED (was ISSUED)"
            - "Job.${job_id}.execution_status == CANCELLED"

      - name: daily_close_expires_permits_past_validity
        claim_type: valid_transition
        grounds:
          - state_machines.Permit.ACTIVE_to_EXPIRED
          - "endpoints[POST /v1/sites/{siteId}/daily-close]"
        distinguishing_aspect: "Ops-run checkpoint: with the logical clock advanced past valid_until, daily-close sweeps the ACTIVE permit to EXPIRED and reports it in expired_permit_ids."
        test_recipe:
          setup: ["MOBILIZED job; HOT_WORK permit ACTIVE with window [2026-07-31, 2026-08-01T04:00]; clock advanced to 2026-08-02T00:00"]
