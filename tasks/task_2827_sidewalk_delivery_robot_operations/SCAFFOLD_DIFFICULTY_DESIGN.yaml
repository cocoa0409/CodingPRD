          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with insurer_notify_threshold_cents at its 25000 default and open_incident_count 1"
            - "IncidentReport filed by RemoteOperator user op-1 with severity SERIOUS and estimated_damage_cents 30000, so insurer_notification_required is true and municipal_due_by_utc is 2026-08-06T09:00:00.000Z"
