      - name: roll_run_delinquency_referral_void_cure_cascade_depth4
        grounds:
          - state_machines.AmortizationInstallment.BILLED_to_DELINQUENT
          - state_machines.Assessment.SENIOR_RECORDED_to_LIEN_SALE_REFERRED
          - state_machines.AssessmentTransfer.QUOTED_to_VOID_STALE
          - state_machines.Application.UNDER_REVIEW_to_NEEDS_CURE
          - entities.Property.fields.tax_delinquency_count_36m
          - calculations.delinquency_penalty_accrual
        distinguishing_aspect: |
          Depth 4 from a COMPLETELY different trigger than the complaint cascade — a county roll run:
          installments BILLED -> DELINQUENT (link 1) -> Assessment lien_status LIEN_SALE_REFERRED
          (link 2) -> the parcel's QUOTED AssessmentTransfer VOID_STALE and
          Property.tax_delinquency_count_36m 0 -> 1 (link 3) -> the parcel's OTHER, still
          UNDER_REVIEW Application NEEDS_CURE with cure_reason_codes ['TAX_DELINQUENCY'] (link 4).
          The cascade crosses four entity types and one of the links is a sibling application that
          the roll run never names.
