  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shapes
        claim_type: standard_crud
        grounds: ["response_envelope.success", "response_envelope.error"]
        distinguishing_aspect: "Envelope contract: a successful create returns meta.api_request_id + meta.api_request_timestamp, response_type 'object', and data carrying the entity; an error returns response_type 'error' with data.error_id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /reslife/dorms", payload: { name: "Envelope Hall", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id" } }
            - { call: "GET /reslife/dorms/11111111-2222-3333-4444-555555555555", payload: {}, as: SchoolAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "create response has meta.api_request_id (non-null), meta.api_request_timestamp (ISO8601), response_type == 'object'"
