              captures: { case_destroyed: $.data.destroyed_evidence_count, case_posture: $.data.evidence_posture }
            - call: "GET /jurisdictions/${jur_id}/policy-initiatives"
              as: PolicyDirector
              captures: { pol_count1: "$.data[0].pattern_case_count" }
          assert:
            - "initiative pattern_case_count before the response == 0 (initial derivation found no qualifying cases)"
            - "link 1: EvidenceItem.location_status == REPORTED_DESTROYED"
            - "link 2: Case.destroyed_evidence_count == 1 AND Case.evidence_posture == FULLY_COMPROMISED (no custody-confirmed items)"
            - "link 3: PolicyInitiative.pattern_case_count == 1 (re-derived from the Case mutation, jurisdiction-matched, topic EVIDENCE_PRESERVATION)"
            - "the trigger response itself only reports the RecordsRequest (FULFILLED) — links 1-3 are observed via their own reads"

