        claim_type: initial_state
        grounds:
          - state_machines.ConsignmentItem.lifecycle_state.initial_state
          - state_machines.ConsignmentItem.inventory_state.initial_state
          - endpoints[POST /consignment-items]
        distinguishing_aspect: "A brand-new ConsignmentItem carries BOTH declared initial states at once — lifecycle_state INTAKE_SUBMITTED and inventory_state PENDING_CUSTODY — with every derived price column still null and consignor_id copied from the agreement rather than from the request body."
        test_recipe:
