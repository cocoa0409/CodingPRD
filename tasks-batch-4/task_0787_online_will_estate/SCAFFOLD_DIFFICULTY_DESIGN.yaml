scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: gross_vs_net_probate_estate
        grounds:
          - calculations.gross_vs_net_probate_estate
          - entities.Asset.fields.funding_status
          - entities.Asset.fields.assigned_beneficiary_id
          - endpoints["GET /v1/subscriptions/{id}/estate-summary"]
        distinguishing_aspect: |
          Over the identical set of three Asset rows, the gross algorithm sums all values (180000)
          while the net-probate algorithm excludes FUNDED and beneficiary-designated assets (30000);
          two divergent totals on the Asset domain.
        test_recipe:
          setup:
            - "PLUS subscription ACTIVE for a member; assets A1=100000 FUNDED, A2=50000 UNFUNDED designated to a beneficiary, A3=30000 UNFUNDED undesignated."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL","TRUST","POA","HEALTHCARE_DIRECTIVE"], max_documents: 10, allows_trust: true }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "m1@x.com", full_name: "M One", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/beneficiaries"
              payload: { subscription_id: "${sub_id}", full_name: "Child A", relationship: "CHILD", allocation_pct: 100 }
              as: Member
              as_user_id: "${m_id}"
              captures: { ben_id: "$.data.id" }
            - call: "POST /v1/assets"
              payload: { subscription_id: "${sub_id}", asset_type: "REAL_ESTATE", description: "House", estimated_value_cents: 100000, funding_status: "FUNDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/assets"
              payload: { subscription_id: "${sub_id}", asset_type: "BANK", description: "Account", estimated_value_cents: 50000, funding_status: "UNFUNDED", assigned_beneficiary_id: "${ben_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/assets"
              payload: { subscription_id: "${sub_id}", asset_type: "PERSONAL", description: "Jewelry", estimated_value_cents: 30000, funding_status: "UNFUNDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /v1/subscriptions/${sub_id}/estate-summary"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "estate_summary.gross_estate_value_cents == 180000"
            - "estate_summary.net_probate_estate_cents == 30000"
            - "estate_summary.total_assigned_value_cents == 50000"

      - name: renewal_quote_vs_final_charge
        grounds:
          - calculations.renewal_provisional_quote
          - calculations.renewal_final_charge
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Subscription.fields.renewal_count
        distinguishing_aspect: |
          The renewal provisional quote stored as pending_charge_cents (20000, no loyalty) diverges from the
          final settled charge (18000 after the 10% first-renewal loyalty discount); paid_to_date rises by 18000,
          not 20000 — a dual-variant on the Subscription domain, distinct from the Asset-domain estate variant.
        test_recipe:
          setup:
            - "PLUS INDIVIDUAL subscription ACTIVE with period 2026-06-01..2027-06-01; clock advanced to 2027-05-15 (renewal window open); renewal initiated (provisional quote 20000 pending)."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "m2@x.com", full_name: "M Two", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/subscriptions/${sub_id}/renew"
              as: Member
              as_user_id: "${m_id}"
              captures: { quote_cents: "$.data.pending_charge_cents" }
          trigger:
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
              captures: { paid_after: "$.data.paid_to_date_cents", rc: "$.data.renewal_count" }
          assert:
            - "captured quote_cents (provisional) == 20000"
            - "Subscription.${sub_id}.renewal_count == 1"
            - "Subscription.${sub_id}.paid_to_date_cents == 38000"
            - "Subscription.${sub_id}.pending_charge_cents == 0"
            - "final settled charge == 18000 (38000 - 20000 signup), strictly below the 20000 quote by the 10% loyalty discount"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: signup_price_bundle_addon_tiered
        grounds:
          - calculations.signup_price
          - entities.Subscription.fields.bundle_type
          - entities.Subscription.fields.attorney_support
          - entities.Subscription.fields.price_cents
        distinguishing_aspect: |
          Mode (a): price_cents = round((base 20000 + attorney add-on 15000) * COUPLE multiplier 1.6) = 56000 —
          three inputs (base, conditional add-on, tiered bundle multiplier) combine non-linearly in one formula.
        test_recipe:
          setup:
            - "PLUS plan in catalog; a registered member; no subscription yet."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "m3@x.com", full_name: "M Three", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "COUPLE", spouse_name: "Sp Three", attorney_support: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
          assert:
            - "Subscription.${sub_id}.price_cents == 56000"
            - "Subscription.${sub_id}.pending_charge_cents == 56000"

      - name: estate_distribution_residual_rounding
        grounds:
          - calculations.estate_distribution
          - entities.Beneficiary.fields.allocation_pct
          - entities.Beneficiary.fields.allocated_cents
        distinguishing_aspect: |
          Mode (b): with gross 100001 and three primaries 33.34/33.33/33.33, floor-per-beneficiary then
          residual-to-earliest-created_at yields 33341/33330/33330 (sum 100001); round-each-then-sum would total
          100000 — the pinned rounding order is what makes it well-defined. A different mode from signup_price (a).
        test_recipe:
          setup:
            - "ACTIVE subscription; primaries B1(33.34, created first), B2(33.33), B3(33.33); a single asset of 100001 cents (gross estate = 100001)."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "m4@x.com", full_name: "M Four", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/beneficiaries"
              payload: { subscription_id: "${sub_id}", full_name: "B One", relationship: "CHILD", allocation_pct: 33.34 }
              as: Member
              as_user_id: "${m_id}"
              captures: { ben1: "$.data.id" }
            - call: "POST /v1/beneficiaries"
              payload: { subscription_id: "${sub_id}", full_name: "B Two", relationship: "CHILD", allocation_pct: 33.33 }
              as: Member
              as_user_id: "${m_id}"
              captures: { ben2: "$.data.id" }
            - call: "POST /v1/beneficiaries"
              payload: { subscription_id: "${sub_id}", full_name: "B Three", relationship: "CHILD", allocation_pct: 33.33 }
              as: Member
              as_user_id: "${m_id}"
              captures: { ben3: "$.data.id" }
            - call: "POST /v1/assets"
              payload: { subscription_id: "${sub_id}", asset_type: "INVESTMENT", description: "Portfolio", estimated_value_cents: 100001, funding_status: "UNFUNDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /v1/subscriptions/${sub_id}/beneficiaries"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Beneficiary.${ben1}.allocated_cents == 33341"
            - "Beneficiary.${ben2}.allocated_cents == 33330"
            - "Beneficiary.${ben3}.allocated_cents == 33330"
            - "sum of allocated_cents == 100001 (floor-then-residual-by-created_at, not round-each-then-sum = 100000)"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: document_generated_review_cycle
        grounds:
          - state_machines.EstateDocument.GENERATED_to_IN_REVIEW
          - state_machines.EstateDocument.IN_REVIEW_to_GENERATED
          - entities.EstateDocument.fields.status
        distinguishing_aspect: |
          EstateDocument returns GENERATED->IN_REVIEW->GENERATED (a cycle, not a forward-only pipeline) when the
          attorney requests changes; the entity revisits GENERATED.
        test_recipe:
          setup:
            - "ACTIVE PLUS subscription with attorney_support=true; a WILL document GENERATED, submitted for review (IN_REVIEW), attorney has started the review (review IN_REVIEW)."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL","TRUST","POA","HEALTHCARE_DIRECTIVE"], max_documents: 10, allows_trust: true }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "m5@x.com", full_name: "M Five", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL", attorney_support: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q_id: "$.data.id" }
            - call: "POST /v1/questionnaires/${q_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c", q4: "d", q5: "e" } }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/documents"
              payload: { questionnaire_id: "${q_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { doc_id: "$.data.id" }
            - call: "POST /v1/documents/${doc_id}/submit-review"
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /v1/documents/${doc_id}/attorney-reviews"
              as: Member
              as_user_id: "${m_id}"
              captures: { rev_id: "$.data[0].id" }
            - call: "POST /v1/attorney-reviews/${rev_id}/decision"
              payload: { action: "START_REVIEW" }
              as: Attorney
          trigger:
            - call: "POST /v1/attorney-reviews/${rev_id}/decision"
              payload: { action: "REQUEST_CHANGES", notes: "Fix clause 3" }
              as: Attorney
          assert:
            - "EstateDocument.${doc_id}.status == GENERATED"
            - "AttorneyReview.${rev_id}.status == CHANGES_REQUESTED"

      - name: attorney_review_changes_cycle
        grounds:
          - state_machines.AttorneyReview.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.AttorneyReview.CHANGES_REQUESTED_to_IN_REVIEW
          - entities.AttorneyReview.fields.status
        distinguishing_aspect: |
          AttorneyReview loops IN_REVIEW->CHANGES_REQUESTED->IN_REVIEW after the member re-submits; the review row
          revisits IN_REVIEW — a cycle on the AttorneyReview entity, distinct from the EstateDocument cycle.
        test_recipe:
          setup:
            - "As in document_generated_review_cycle up to CHANGES_REQUESTED (review CHANGES_REQUESTED, document GENERATED); then member re-submits the document (document IN_REVIEW again, review still CHANGES_REQUESTED)."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL","TRUST","POA","HEALTHCARE_DIRECTIVE"], max_documents: 10, allows_trust: true }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "m6@x.com", full_name: "M Six", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL", attorney_support: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q_id: "$.data.id" }
            - call: "POST /v1/questionnaires/${q_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c", q4: "d", q5: "e" } }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/documents"
              payload: { questionnaire_id: "${q_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { doc_id: "$.data.id" }
            - call: "POST /v1/documents/${doc_id}/submit-review"
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /v1/documents/${doc_id}/attorney-reviews"
              as: Member
              as_user_id: "${m_id}"
              captures: { rev_id: "$.data[0].id" }
            - call: "POST /v1/attorney-reviews/${rev_id}/decision"
              payload: { action: "START_REVIEW" }
              as: Attorney
            - call: "POST /v1/attorney-reviews/${rev_id}/decision"
              payload: { action: "REQUEST_CHANGES", notes: "Revise" }
              as: Attorney
            - call: "POST /v1/documents/${doc_id}/submit-review"
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/attorney-reviews/${rev_id}/decision"
              payload: { action: "START_REVIEW" }
              as: Attorney
          assert:
            - "AttorneyReview.${rev_id}.status == IN_REVIEW"
            - "EstateDocument.${doc_id}.status == IN_REVIEW"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_subscription_revokes_docs_and_grants
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - state_machines.EstateDocument.EXECUTED_to_REVOKED
          - state_machines.ShareGrant.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Depth-3 chain from cancel: cancel Subscription (A) -> EstateDocument REVOKED (B, caused by A) -> that
          document's ACTIVE ShareGrant REVOKED (C, caused by B). Each hop is caused by the previous, not by cancel directly.
        test_recipe:
          setup:
            - "ACTIVE subscription with an EXECUTED WILL document and one ACTIVE ShareGrant on that document."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "m7@x.com", full_name: "M Seven", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/beneficiaries"
              payload: { subscription_id: "${sub_id}", full_name: "Heir", relationship: "CHILD", allocation_pct: 100 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q_id: "$.data.id" }
            - call: "POST /v1/questionnaires/${q_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c", q4: "d", q5: "e" } }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/documents"
              payload: { questionnaire_id: "${q_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { doc_id: "$.data.id" }
            - call: "POST /v1/documents/${doc_id}/execute"
              payload: { witnesses_count: 2 }
              as: Notary
            - call: "POST /v1/share-grants"
              payload: { document_id: "${doc_id}", grantee_email: "exec@x.com", scope: "VIEW", expires_at: "2027-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { grant_id: "$.data.id" }
          trigger:
            - call: "POST /v1/subscriptions/${sub_id}/cancel"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Subscription.${sub_id}.status == CANCELLED"
            - "EstateDocument.${doc_id}.status == REVOKED"
            - "ShareGrant.${grant_id}.status == REVOKED"

      - name: execute_supersedes_prior_and_revokes_grants
        grounds:
          - state_machines.EstateDocument.GENERATED_to_EXECUTED
          - state_machines.EstateDocument.EXECUTED_to_SUPERSEDED
          - state_machines.ShareGrant.ACTIVE_to_REVOKED
          - entities.EstateDocument.fields.superseded_by_id
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (execute): executing WILL v2 (A) -> new doc EXECUTED -> prior EXECUTED
          WILL v1 SUPERSEDED (B, caused by reaching EXECUTED) -> v1's ACTIVE ShareGrant REVOKED (C, caused by B).
        test_recipe:
          setup:
            - "ACTIVE subscription; WILL v1 EXECUTED with an ACTIVE ShareGrant; a second WILL v2 GENERATED."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "m8@x.com", full_name: "M Eight", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/beneficiaries"
              payload: { subscription_id: "${sub_id}", full_name: "Heir", relationship: "CHILD", allocation_pct: 100 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q1_id: "$.data.id" }
            - call: "POST /v1/questionnaires/${q1_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c", q4: "d", q5: "e" } }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/documents"
              payload: { questionnaire_id: "${q1_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { doc1_id: "$.data.id" }
            - call: "POST /v1/documents/${doc1_id}/execute"
              payload: { witnesses_count: 2 }
              as: Notary
            - call: "POST /v1/share-grants"
              payload: { document_id: "${doc1_id}", grantee_email: "exec@x.com", scope: "VIEW", expires_at: "2027-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { grant1_id: "$.data.id" }
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q2_id: "$.data.id" }
