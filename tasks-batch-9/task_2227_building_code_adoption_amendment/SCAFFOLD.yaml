  - method: POST
    path: /code-cycles/{code_cycle_id}/status
    description: Advance or abandon a code cycle
    roles:
    - CouncilAdmin
    code: 200
    input:
    - to_status
    output: CodeCycle
    side_effects:
    - see state_machines.CodeCycle
    - RULEMAKING recomputes calculations.cycle_cost_ledger
    - ABANDONED dissolves child committees
  - method: POST
    path: /code-cycles/{code_cycle_id}/discipline-committees
    description: Seat a discipline committee on a cycle
    roles:
