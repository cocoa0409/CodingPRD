            - "the same action=CLOSE_NO_FINDING against ${eng_clean_id} returns 200 with status == \"CLOSED_NO_FINDING\", recovery_amount_cents == 0, base_recovery_cents == 0, interest_cents == 0, audit_cost_shift_cents == 0, penalty_multiplier == 1.00 and recovery_invoice_id == null"
            - "action=ISSUE_FINDINGS against ${eng_clean_id} returns 422 with data.error_id == \"ERR_NO_AUDIT_FINDINGS\""
