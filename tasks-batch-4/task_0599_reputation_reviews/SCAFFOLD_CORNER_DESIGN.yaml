      - name: dashboard_reports_sentiment_breakdown_and_derived_fields
        claim_type: computed_read
        grounds:
          - endpoints
          - calculations.review_sentiment
          - entities.Location.fields.sentiment_positive_count
          - entities.Location.fields.sentiment_neutral_count
        distinguishing_aspect: "With reviews rated 5, 3 and 2 the dashboard reports sentiment_positive_count 1, sentiment_neutral_count 1, sentiment_negative_count 1, avg_rating 3.33 and open_escalation_count 1 in a single computed read."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with no listings and three ingested reviews rated 5, 3 and 2."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
