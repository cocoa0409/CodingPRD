          - state_machines.ConsolidationCase.transitions.RETURNED_to_DRAFT
          - validations.priority_35_ERR_REVISION_LIMIT_EXCEEDED
        distinguishing_aspect: "The SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED loop is bounded by REVISION_LIMIT, and the loop is only exercised meaningfully when the recomputed savings after revision still clear the floor."
        excluded_because:
          difficulty_instance: case_return_revise_resubmit_cycle_then_approved
          rationale: "That §1.8 instance already drives the full cycle twice, asserts returned_count 1 then 2, resubmits with a revised receiving branch, and lands on APPROVE; a separate §1.9 cyclic instance would only re-walk the same loop with fewer assertions."

      - name: cascade_down_from_case_execution_reaches_grandchildren
        claim_type: cascade_down
        grounds:
          - state_machines.ConsolidationCase.transitions.NOTICE_FILED_to_CLOSURE_EXECUTED
          - state_machines.Branch.transitions.CLOSURE_SCHEDULED_to_CLOSED
          - state_machines.PropertyDisposition.transitions.PENDING_to_MARKETED
        distinguishing_aspect: "One request must propagate case -> branch -> property disposition -> savings recomputation -> governance flag, with every hop's ordering observable in the single response."
        excluded_because:
          difficulty_instance: execute_closure_four_hop_cascade_flips_case_to_savings_watch
          rationale: "That §1.8 instance asserts all four documented hops end to end (branch CLOSED and zeroed, receiving/market ledgers credited, disposition MARKETED with the marketing carry, and the governance flag flipping to SAVINGS_WATCH with flagged_case_count incremented); a plain cascade_down instance is a strict subset."

      - name: compensation_reverses_every_execute_closure_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ConsolidationCase.transitions.CLOSURE_EXECUTED_to_UNWOUND
          - state_machines.PropertyDisposition.transitions.MARKETED_to_PENDING
        distinguishing_aspect: "The unwind must restore branch deposits, receiving transferred_in, market absorbed/runoff ledgers, the notice, the disposition carry and the governance flag with zero drift."
        excluded_because:
          difficulty_instance: unwind_closure_restores_market_deposit_ledger_exactly
          rationale: "That §1.8 instance already asserts every reversal target exactly (pre-close deposits restored, receiving and market ledgers back to their pre-execution values, notice WITHDRAWN, disposition back to PENDING at 3000000 carry, governance_flag NONE and flagged_case_count decremented)."

  - section: calculations
    instances:
      - name: receiving_branch_selector_picks_highest_deposits_with_created_at_tiebreak
        claim_type: correct_result
        grounds:
          - calculations.receiving_branch_selector
          - endpoints[POST /distribution/consolidation-cases]
        distinguishing_aspect: "Omitting receiving_branch_id runs the selector over four peers at once: the DRIVE_UP peer is type-excluded even though it has the largest book, the 2000000000 peer is below the 50% absorb floor, and the two remaining peers tie on both deposits and transactions so the created_at ASC tie-break decides — never id."
        test_recipe:
          setup:
            - "Harbor Metro holds a closing branch RB-101 with deposits 4800000000 (absorb floor = 2400000000)."
            - "Peers, created in this order: RB-102 (FULL_SERVICE, 9600000000, 8100 txn), RB-104 (LIMITED_SERVICE, 9600000000, 8100 txn — a perfect tie created later), RB-105 (FULL_SERVICE, 2000000000 — below the floor), RB-106 (DRIVE_UP, 20000000000 — the biggest book but a type-excluded format)."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id, b101_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-102", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 8100, digital_adoption_bps: 6100, annual_noninterest_expense_cents: 52000000, annual_revenue_cents: 96000000, fte_count: 14, atm_count: 3, opened_on: "1998-07-15" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b102_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-104", branch_type: "LIMITED_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 9600000000, monthly_transaction_count: 8100, digital_adoption_bps: 5900, annual_noninterest_expense_cents: 44000000, annual_revenue_cents: 80000000, fte_count: 8, atm_count: 1, opened_on: "2011-04-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b104_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-105", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 2000000000, monthly_transaction_count: 3000, digital_adoption_bps: 4800, annual_noninterest_expense_cents: 30000000, annual_revenue_cents: 26000000, fte_count: 6, atm_count: 1, opened_on: "2014-09-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b105_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-106", branch_type: "DRIVE_UP", tenure_class: "OWNED", deposit_balance_cents: 20000000000, monthly_transaction_count: 9000, digital_adoption_bps: 6400, annual_noninterest_expense_cents: 20000000, annual_revenue_cents: 90000000, fte_count: 3, atm_count: 4, opened_on: "2001-02-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b106_id: $.data.id }
          trigger:
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b101_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-12-01", expected_branch_version: "${b101_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id, chosen: $.data.receiving_branch_id }
          assert:
            - "${chosen} == ${b102_id} (RB-102 wins the deposits/transaction tie on created_at ASC over the identically-stocked RB-104)"
            - "${chosen} != ${b106_id} even though RB-106 holds 20000000000: DRIVE_UP is not in {FULL_SERVICE, LIMITED_SERVICE}"
            - "${chosen} != ${b105_id}: 2000000000 < 4800000000 * 5000 / 10000 == 2400000000"
            - "ConsolidationCase.${case_id}.status == DRAFT and Branch.${b101_id}.status == UNDER_REVIEW"
            - "Branch.${b104_id}.status == ACTIVE and Branch.${b106_id}.status == ACTIVE (losing candidates are untouched)"

      - name: no_eligible_receiving_branch_when_every_peer_is_one_cent_below_absorb_floor
        claim_type: input_set_filtering
        grounds:
          - calculations.receiving_branch_selector
          - validations.priority_43_ERR_NO_ELIGIBLE_RECEIVING_BRANCH
          - errors[ERR_NO_ELIGIBLE_RECEIVING_BRANCH]
        distinguishing_aspect: "The absorb floor is inclusive at exactly 50% of the closing book, so a peer holding 2399999999 against a floor of 2400000000 empties the candidate set by one cent and the case creation fails with ERR_NO_ELIGIBLE_RECEIVING_BRANCH 422 — leaving the closing branch ACTIVE."
        test_recipe:
          setup:
            - "Harbor Metro holds RB-101 with deposits 4800000000 and exactly one peer RB-107 with 2399999999 (one cent under the 2400000000 floor)."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id, b101_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-107", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 2399999999, monthly_transaction_count: 4000, digital_adoption_bps: 5000, annual_noninterest_expense_cents: 31000000, annual_revenue_cents: 34000000, fte_count: 7, atm_count: 1, opened_on: "2009-05-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b107_id: $.data.id }
          trigger:
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b101_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-12-01", expected_branch_version: "${b101_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { err_no_recv: $.data.error_id }
          assert:
            - "${err_no_recv} == ERR_NO_ELIGIBLE_RECEIVING_BRANCH with HTTP 422"
            - "Branch.${b101_id}.status == ACTIVE and version == ${b101_v} (the failed creation left no UNDER_REVIEW side effect)"
            - "no ConsolidationCase exists with closing_branch_id == ${b101_id}"

      - name: branch_score_trailing_blend_renormalizes_a_two_snapshot_prefix
        claim_type: precision
        grounds:
          - calculations.branch_performance_score
          - endpoints[POST /distribution/branches/{branchId}/performance-snapshots]
        distinguishing_aspect: "With only two snapshots the 50/30/20 weight vector is truncated to [5000, 3000] and renormalized over W = 8000, not padded to 10000: (5000*9400 + 3000*4535) / 8000 = 7575.625 -> 7576, and the pre-rounded per-snapshot composites are blended with exactly one further rounding step."
        test_recipe:
          setup:
            - "A TRAILING_BLEND branch RB-201 has two snapshots: 2026-Q1 (period_end 2026-03-31, composite 4535) then 2026-Q2 (period_end 2026-06-30, composite 9400)."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-201", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01", scoring_variant: "TRAILING_BLEND" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b201_id: $.data.id }
            - call: "POST /distribution/branches/${b201_id}/performance-snapshots"
              payload: { period_label: "2026-Q1", period_end_date: "2026-03-31", deposits_cents: 4800000000, transaction_count: 5400, digital_active_bps: 5400, revenue_cents: 40000000, noninterest_expense_cents: 30000000 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { snap_q1_id: $.data.id, q1_composite: $.data.composite_score_bps }
          trigger:
            - call: "POST /distribution/branches/${b201_id}/performance-snapshots"
              payload: { period_label: "2026-Q2", period_end_date: "2026-06-30", deposits_cents: 12000000000, transaction_count: 9000, digital_active_bps: 6000, revenue_cents: 40000000, noninterest_expense_cents: 20000000 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { snap_q2_id: $.data.id, q2_composite: $.data.composite_score_bps }
          assert:
            - "${q1_composite} == 4535 (factors 4000 / 6000 / 5400, efficiency 7500 bps, profitability 3750)"
            - "${q2_composite} == 9400 (factors 10000 / 10000 / 6000, efficiency 5000 bps, profitability 10000)"
            - "Branch.${b201_id}.performance_score_bps == 7576 and performance_band == CORE"
            - "GET /distribution/branches/${b201_id}/performance-score returns performance_score_bps 7576 with contributing_snapshot_count == 2"
            - "the naive un-renormalized blend 0.5*9400 + 0.3*4535 == 6061 must NOT be returned"

      - name: performance_score_query_variant_overrides_persisted_variant_without_writing
        claim_type: variant_selection
        grounds:
          - calculations.branch_performance_score.variants
          - endpoints[GET /distribution/branches/{branchId}/performance-score]
        distinguishing_aspect: "The persisted Branch.scoring_variant governs the value written by snapshot ingestion, while ?scoring_variant on the read endpoint computes the other variant on the fly: the same two snapshots yield 9400/CORE persisted (POINT_IN_TIME) and 7576/CORE on a TRAILING_BLEND read, and the read must not overwrite the stored figure."
        test_recipe:
          setup:
            - "Branch RB-202 is created with scoring_variant POINT_IN_TIME and receives the same two snapshots (composites 4535 then 9400)."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-202", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01", scoring_variant: "POINT_IN_TIME" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b202_id: $.data.id }
            - call: "POST /distribution/branches/${b202_id}/performance-snapshots"
              payload: { period_label: "2026-Q1", period_end_date: "2026-03-31", deposits_cents: 4800000000, transaction_count: 5400, digital_active_bps: 5400, revenue_cents: 40000000, noninterest_expense_cents: 30000000 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
            - call: "POST /distribution/branches/${b202_id}/performance-snapshots"
              payload: { period_label: "2026-Q2", period_end_date: "2026-06-30", deposits_cents: 12000000000, transaction_count: 9000, digital_active_bps: 6000, revenue_cents: 40000000, noninterest_expense_cents: 20000000 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
          trigger:
            - call: "GET /distribution/branches/${b202_id}/performance-score?scoring_variant=TRAILING_BLEND"
              payload: {}
              as: ConsolidationApprover
              as_user_id: "u_approver_1"
              captures: { queried_score: $.data.performance_score_bps, queried_variant: $.data.scoring_variant }
          assert:
            - "${queried_score} == 7576 and ${queried_variant} == TRAILING_BLEND with contributing_snapshot_count == 2"
            - "Branch.${b202_id}.performance_score_bps == 9400 and performance_band == CORE (the POINT_IN_TIME value persisted by the last snapshot is untouched by the read)"
            - "Branch.${b202_id}.scoring_variant == POINT_IN_TIME and Branch.${b202_id}.version is unchanged by the GET"
            - "GET /distribution/branches/${b202_id}/performance-score with no query parameter returns 9400 (falls back to the persisted variant)"

      - name: property_disposition_net_owned_fork_subtracts_book_value_and_zeroes_carry
        claim_type: correct_result
        grounds:
          - calculations.property_disposition_net
          - calculations.property_carry_cost
          - state_machines.PropertyDisposition.transitions.SALE_PENDING_to_DISPOSED
        distinguishing_aspect: "The OWNED fork subtracts book value (140000000 - 6000000 - 90000000 = 44000000) and never touches buyout_offer_cents, while settling drops annual_carry_cents from 4200000 to 0 and re-lifts case net savings from 14120000 to 18320000 — yet the governance flag raised at execution is not cleared by a settlement."
        test_recipe:
          setup:
            - "Closing branch RB-301 is OWNED; the case is executed on 2026-11-01 with a single OWNED PropertyDisposition (book 90000000, list 150000000)."
            - "At execution the disposition moved PENDING -> MARKETED so its carry was 1800000 + 2400000 = 4200000, dropping case net savings to 14120000 and flagging SAVINGS_WATCH."
            - "The disposition has since been contracted at 140000000 with 6000000 of selling costs, so it sits in SALE_PENDING."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
