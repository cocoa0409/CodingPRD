  - name: abuse_routing_violation_on_proxied_take_action
    claim_type: Violation → Error
    grounds:
    - validations[priority=17]
    - errors.ERR_ABUSE_ROUTING_VIOLATION
    distinguishing_aspect: take-action on a PARTIAL zone's report (routing_mode PROXIED) fails with ERR_ABUSE_ROUTING_VIOLATION; the same report forwards successfully to the origin host.
    test_recipe:
      setup:
