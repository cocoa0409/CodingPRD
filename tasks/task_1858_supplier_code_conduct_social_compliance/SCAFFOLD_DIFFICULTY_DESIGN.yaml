            - { call: "POST /corrective-action-plans/${cap_id}/resubmit", payload: { actions: [{ description: "Install guards v2 with milestones", owner: "EHS", due_date: "2026-10-15T00:00:00Z" }] }, as: SupplierContact, as_user_id: "${sup_id}", captures: { cs3: $.data.status } }
            - { call: "POST /corrective-action-plans/${cap_id}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer, captures: { cs4: $.data.status } }
