  - rule_id: resource_temporal_overlap
    instances:
      - name: creator_studio_booking_half_open_intervals_allow_adjacency_but_not_intersection
        grounds:
          - validations.priority_19_ERR_CREATOR_DOUBLE_BOOKED
          - entities.CreativeAssignment.fields.booking_start_date
          - entities.CreativeAssignment.fields.booking_end_date
          - errors.ERR_CREATOR_DOUBLE_BOOKED
        distinguishing_aspect: |
          Resource: the Creator's studio time. Interval semantics: half-open [start, end) intersection,
          so previous_end == new_start is legal while a one-day overlap, a fully contained interval and a
          straddling interval are all refused. The set of blocking rows is also status-filtered, so
          terminating an assignment frees its slot.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "creator 'Wanda Writer' (SCRIPT) with one PROPOSED assignment booked [2026-08-01, 2026-09-01) on a GREENLIT title"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EditorInChief
            - call: "POST /comics/creators"
              payload: { full_name: "Wanda Writer", crafts: ["SCRIPT"], default_page_rate_cents: 12000 }
              as: EditorInChief
              captures: { cr_w: $.data.id }
            - call: "POST /comics/titles"
              payload: { name: "Nebula Knights", planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500 }
              as: EditorInChief
              captures: { t1: $.data.id }
            - call: "POST /comics/titles/${t1}/greenlight"
              payload: {}
              as: EditorInChief
              captures: { tv1: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 500, booking_start_date: "2026-08-01", booking_end_date: "2026-09-01", expected_title_version: "${tv1}" }
              as: EditorInChief
              captures: { a1: $.data.id }
            - call: "GET /comics/titles/${t1}"
              payload: {}
              as: EditorInChief
              captures: { tv2: $.data.version }
          trigger:
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 500, booking_start_date: "2026-08-31", booking_end_date: "2026-10-01", expected_title_version: "${tv2}" }
              as: EditorInChief
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 500, booking_start_date: "2026-08-10", booking_end_date: "2026-08-20", expected_title_version: "${tv2}" }
              as: EditorInChief
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 500, booking_start_date: "2026-07-01", booking_end_date: "2026-12-01", expected_title_version: "${tv2}" }
              as: EditorInChief
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 500, booking_start_date: "2026-09-01", booking_end_date: "2026-10-01", expected_title_version: "${tv2}" }
              as: EditorInChief
              captures: { a2: $.data.id }
            - call: "POST /comics/creative-assignments/${a2}/terminate"
              payload: { reason: "creator withdrew" }
              as: EditorInChief
            - call: "GET /comics/titles/${t1}"
              payload: {}
              as: EditorInChief
              captures: { tv3: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 11000, royalty_share_bps: 500, booking_start_date: "2026-09-01", booking_end_date: "2026-10-01", expected_title_version: "${tv3}" }
              as: EditorInChief
              captures: { a3: $.data.id }
          assert:
            - "the [2026-08-31, 2026-10-01) attempt -> 409 ERR_CREATOR_DOUBLE_BOOKED (one day of intersection)"
            - "the [2026-08-10, 2026-08-20) attempt -> 409 ERR_CREATOR_DOUBLE_BOOKED (fully contained)"
            - "the [2026-07-01, 2026-12-01) attempt -> 409 ERR_CREATOR_DOUBLE_BOOKED (straddling)"
            - "the [2026-09-01, 2026-10-01) attempt -> 201 (touching intervals are legal because the existing end date is exclusive)"
            - "after terminating that adjacent assignment the identical [2026-09-01, 2026-10-01) window is bookable again -> 201, because only PROPOSED/COUNTERED/ACCEPTED/ACTIVE rows block"
            - "GET /comics/creators/${cr_w}/creative-assignments returns exactly 3 rows (a1 PROPOSED, a2 TERMINATED, a3 PROPOSED) — none of the three refused attempts persisted"
            - "each refused attempt left Title.${t1}.version unchanged, so ${tv2} stays valid for the following attempt"

      - name: on_sale_slot_requires_a_symmetric_21_day_gap_in_both_directions
        grounds:
          - validations.priority_20_ERR_ON_SALE_CADENCE_CONFLICT
          - entities.Issue.fields.target_on_sale_date
          - errors.ERR_ON_SALE_CADENCE_CONFLICT
        distinguishing_aspect: |
          A different resource (the title's on-sale calendar slot, held by Issue rather than by Creator)
          with different interval semantics: no interval is stored at all, only a symmetric minimum
          distance of 21 days measured with abs() against every non-cancelled sibling, so a date is
          refused for being too soon *before* an existing issue exactly as for being too soon after it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "GREENLIT title 'Nebula Knights' with Issue #1 targeted at 2026-10-14 and no other issues"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ManagingEditor
            - call: "POST /comics/titles"
              payload: { name: "Nebula Knights", planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500 }
              as: EditorInChief
              captures: { t1: $.data.id }
            - call: "POST /comics/titles/${t1}/greenlight"
              payload: {}
              as: EditorInChief
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-10-14" }
              as: ManagingEditor
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 2, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-11-03" }
              as: ManagingEditor
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 2, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-11-04" }
              as: ManagingEditor
              captures: { i2: $.data.id }
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 3, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-10-24" }
              as: ManagingEditor
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 3, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-09-23" }
              as: ManagingEditor
              captures: { i3: $.data.id }
          assert:
            - "the 2026-11-03 attempt -> 409 ERR_ON_SALE_CADENCE_CONFLICT (20 days after issue #1, one short of the bound)"
            - "the 2026-11-04 attempt -> 201 (exactly 21 days is allowed, the bound is inclusive)"
            - "the 2026-10-24 attempt -> 409 ERR_ON_SALE_CADENCE_CONFLICT: it is 10 days after issue #1 and 11 days before issue #2, so it collides on both sides at once"
            - "the 2026-09-23 attempt -> 201 (21 days *before* issue #1 clears the same symmetric bound)"
            - "GET /comics/titles/${t1}/issues returns exactly 3 rows with target_on_sale_date values [2026-09-23, 2026-10-14, 2026-11-04] and issue_number values 3, 1, 2 — issue_number ordering is deliberately independent of the on-sale calendar"
            - "the refused 2026-10-24 attempt did not consume issue_number 3, which the later successful call reuses"

      - name: collected_edition_blackout_anchor_moves_when_a_later_issue_joins_the_title
        grounds:
          - validations.priority_18_ERR_CANNIBALIZATION_WINDOW_CONFLICT
          - entities.ReleaseWindow.fields.release_date
          - entities.Issue.fields.target_on_sale_date
          - endpoints.POST_/comics/issues/{id}/release-windows
        distinguishing_aspect: |
          A third resource (the collected edition's sales window, held by ReleaseWindow) with one-sided,
          strictly-after interval semantics whose anchor is not a stored date at all but the maximum
          target_on_sale_date over the title's non-cancelled issues. Adding a later issue therefore slides
          the blackout forward and retroactively invalidates dates that were legal moments earlier, which
          neither the half-open booking rule nor the symmetric cadence rule can express.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "GREENLIT title with Issue #1 on sale 2026-10-14 and Issue #2 on sale 2026-12-02, so the blackout anchor is 2026-12-02 and the window closes after 2027-03-02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SalesDirector
            - call: "POST /comics/titles"
              payload: { name: "Nebula Knights", planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500 }
              as: EditorInChief
              captures: { t1: $.data.id }
            - call: "POST /comics/titles/${t1}/greenlight"
              payload: {}
              as: EditorInChief
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-10-14" }
              as: ManagingEditor
              captures: { i1: $.data.id }
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 2, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-12-02" }
              as: ManagingEditor
              captures: { i2: $.data.id }
          trigger:
            - call: "POST /comics/issues/${i2}/release-windows"
              payload: { channel: "COLLECTED", release_date: "2027-02-01", expected_net_receipts_cents: 90000 }
              as: SalesDirector
            - call: "POST /comics/issues/${i2}/release-windows"
              payload: { channel: "COLLECTED", release_date: "2027-03-10", expected_net_receipts_cents: 90000 }
              as: SalesDirector
              captures: { rw_first: $.data.release_date }
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 3, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-12-23" }
              as: ManagingEditor
              captures: { i3: $.data.id }
            - call: "POST /comics/issues/${i2}/release-windows"
              payload: { channel: "COLLECTED", release_date: "2027-03-15", expected_net_receipts_cents: 90000 }
              as: SalesDirector
            - call: "POST /comics/issues/${i2}/release-windows"
              payload: { channel: "COLLECTED", release_date: "2027-03-24", expected_net_receipts_cents: 90000 }
              as: SalesDirector
              captures: { rw_second: $.data.release_date }
          assert:
            - "the 2027-02-01 COLLECTED call -> 409 ERR_CANNIBALIZATION_WINDOW_CONFLICT (inside the 2026-12-02 + 90 day blackout)"
            - "the 2027-03-10 COLLECTED call -> 201 with ${rw_first} == 2027-03-10T00:00:00Z (after the 2027-03-02 close)"
            - "adding issue #3 at 2026-12-23 succeeds (21 days after issue #2) and moves the anchor to 2026-12-23, closing the blackout only after 2027-03-23"
            - "the 2027-03-15 COLLECTED call -> 409 ERR_CANNIBALIZATION_WINDOW_CONFLICT even though it is later than the window accepted before issue #3 existed"
            - "the 2027-03-24 COLLECTED call -> 201 with ${rw_second} == 2027-03-24T00:00:00Z"
            - "the already stored 2027-03-10 row is untouched by the anchor move: GET /comics/issues/${i2}/release-windows?channel=COLLECTED returns 2 rows [2027-03-10, 2027-03-24]"
            - "the anchor is title-wide, not issue-wide: a COLLECTED window on issue #1 at 2027-03-15 is refused with the same error"

  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_restores_the_retailer_units_and_balance_ledger_exactly
        grounds:
          - state_machines.RetailerOrder.FOC_LOCKED_to_CANCELLED
          - calculations.retailer_discount_tier
          - calculations.order_units_rollup
          - entities.Retailer.fields.cumulative_units_ytd
          - entities.Retailer.fields.open_balance_cents
          - entities.Issue.fields.total_ordered_units
        distinguishing_aspect: |
          Conserved quantity: the retailer's YTD unit ledger and open balance. Cancelling an INVOICED
          order must recompute both back to their exact pre-lock values (2440 units, 0 cents) and demote
          the tier BASIC -> ENTRY, while leaving a second retailer's still-locked order and its
          contribution to the issue rollup untouched — proving a full recompute rather than a decrement.
        test_recipe:
          setup:
            - "logical clock advanced 2026-08-01 -> 2026-08-21 -> 2026-09-23"
            - "Issue #1 (on sale 2026-10-14) with covers STANDARD 399, 1:10 incentive 399, 1:25 incentive 599 capped at 4, an IN_PROGRESS SCRIPT stage, SOLICITED via a PUBLISHED 2026-08 catalog"
            - "retailer A 'Panel Palace' opening_units_ytd 2440 with a 100-copy order, retailer B 'Splash Page' opening_units_ytd 0 with a 200-copy order, both ack true and credit_limit 1000000"
            - "both orders FOC_LOCKED at 2026-09-23 (A total_units 114 -> cumulative 2554 BASIC; B total_units 224 -> cumulative 224 ENTRY; issue.total_ordered_units 338) and A's order then INVOICED for 26453"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ManagingEditor
            - call: "POST /comics/creators"
              payload: { full_name: "Wanda Writer", crafts: ["SCRIPT"], default_page_rate_cents: 12000 }
              as: EditorInChief
              captures: { cr_w: $.data.id }
