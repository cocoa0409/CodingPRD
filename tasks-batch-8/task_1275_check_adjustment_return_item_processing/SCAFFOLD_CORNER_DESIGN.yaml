  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bank/accounts/00000000-0000-0000-0000-000000000000"
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHENTICATED' (headers stripped by the test harness for this call)"
      - name: item_processor_cannot_create_account
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHORIZED_ROLE]", "roles[ItemProcessor]"]
        distinguishing_aspect: "ItemProcessor is not in POST /bank/accounts roles: the call fails with ERR_UNAUTHORIZED_ROLE (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bank/accounts"
              payload: { customer_name: "Bad", account_number: "A-2032" }
              as: ItemProcessor
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHORIZED_ROLE'"
      - name: analyst_cannot_write_off_claim
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHORIZED_ROLE]", "roles[ComplianceOfficer]"]
        distinguishing_aspect: "Write-off is exclusive to ComplianceOfficer: AdjustmentAnalyst gets ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["a DENIED claim exists (encoding flow, settled DENIED)"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB RB", routing_number: "222000040" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Beth", account_number: "A-2033" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-RB", amount_cents: 100000, encoded_amount_cents: 90000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" }
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-1", expected_adjustment_case_version: "${case_v}" }
              as: OperationsAdmin
            - call: "GET /bank/adjustment-cases/${case_id}/claims"
              as: OperationsAdmin
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /bank/adjustment-claims/${claim_id}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
            - call: "POST /bank/adjustment-claims/${claim_id}/acknowledge"
              as: OperationsAdmin
            - call: "POST /bank/adjustment-claims/${claim_id}/settle"
              payload: { outcome: "DENIED" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /bank/adjustment-claims/${claim_id}/write-off"
              payload: { write_off_reason: "role test" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHORIZED_ROLE'"
      - name: customer_forbidden_from_others_account
        claim_type: violation_to_error
        grounds: ["errors[ERR_FORBIDDEN_OWNERSHIP]", "roles[Customer]"]
        distinguishing_aspect: "Customer role (entity-backed by DepositorAccount) reading another account's record gets ERR_FORBIDDEN_OWNERSHIP (403); reading its own succeeds."
        test_recipe:
          setup: ["two accounts A and B"]
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { customer_name: "CustA", account_number: "A-2034" }
              as: OperationsAdmin
              captures: { acct_a: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "CustB", account_number: "A-2035" }
              as: OperationsAdmin
              captures: { acct_b: $.data.id }
          trigger:
            - call: "GET /bank/accounts/${acct_b}"
              as: Customer
              as_user_id: "${acct_a}"
              captures: { err: $.data.error_id }
            - call: "GET /bank/accounts/${acct_a}"
              as: Customer
              as_user_id: "${acct_a}"
              captures: { own: $.data.id }
          assert:
            - "err == 'ERR_FORBIDDEN_OWNERSHIP'"
            - "own == acct_a id"
      - name: customer_creates_own_recredit_request
        claim_type: valid_transition
        grounds: ["roles[Customer]", state_machines.RecreditRequest]
        distinguishing_aspect: "Customer can file a recredit request for its own account (X-User-ID == depositor_account_id): request is created SUBMITTED."
        test_recipe:
          setup: ["customer account with a PAID item"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB CU", routing_number: "222000041" }
