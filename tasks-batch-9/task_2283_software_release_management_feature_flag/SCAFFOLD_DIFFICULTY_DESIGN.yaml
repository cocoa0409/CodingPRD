          - state_machines.Release.OPEN_to_FROZEN
          - state_machines.ChangeRequest.RISK_CLASSIFIED_to_DEFERRED
          - state_machines.ChangeRequest.APPROVED_to_BLOCKED_BY_DEPENDENCY
          - calculations.release_readiness_score
          - entities.Release.fields.risk_budget_consumed_points
        distinguishing_aspect: |
          A single POST /release-trains/{id}/freeze-state FREEZE propagates five hops through four
          distinct entity types plus the dependency graph — ReleaseTrain -> Release -> ChangeRequest
          (deferral) -> ChangeRequest (dependent blocking via ChangeDependency) -> Release ledger and
          readiness — landing risk_budget_consumed_points at 0 and readiness_score_projected at 95.
        test_recipe:
          setup:
