            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-CE3", description: "Mixer", item_category: "APPLIANCE", declared_value_cents: 12000, volume_cu_ft: 2 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-CE3", climate_class: "STANDARD", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 100 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/handling-claims", payload: { claim_type: "DAMAGE", description: "Scratched in vault", replacement_cost_cents: 12000, item_age_years: 1 }, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /api/pack-out-jobs/${job}/transition", payload: { action: "STRUCTURE_START" }, as: ProjectManager }
            - { call: "POST /api/pack-out-jobs/${job}/transition", payload: { action: "STRUCTURE_COMPLETE" }, as: ProjectManager }
            - { call: "POST /api/pack-out-jobs/${job}/pack-back-schedules", payload: { crew_id: "crew-2", service_date: "2026-09-15", window_start_hour: 8, window_end_hour: 10 }, as: ProjectManager, captures: { sch: $.data.id } }
          trigger:
            - { call: "POST /api/pack-back-schedules/${sch}/transition", payload: { action: "CONFIRM" }, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPEN_CLAIM_BLOCKS_PACKBACK (open FILED claim on the eligible item vetoes CONFIRM)"
            - "PackBackSchedule.${sch}.status remains REQUESTED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: half-open crew windows (adjacency free)
  # vs aggregate concurrent-count capacity on subcontractors. Different interval
  # semantics on different resource entities.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_window_half_open_adjacency
        grounds:
          - validations[priority=9]
          - state_machines.PackBackSchedule.REQUESTED_to_CONFIRMED
          - errors[ERR_CREW_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = PackBackSchedule crew window; semantics = half-open
          [start, end) interval: [8,12) vs [12,16) is adjacent and LEGAL, while
          [11,13) overlaps [8,12) and is rejected. Resource and semantics differ
          from the subcontractor aggregate-count rule.
        test_recipe:
          setup:
            - "Job with structure COMPLETE and one IN_STORAGE eligible item; schedule A crew-7 2026-09-10 08-12 CONFIRMED"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-RO1", property_address: "30 Redwood Rd", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-RO1", description: "Ottoman", item_category: "FURNITURE", declared_value_cents: 3000, volume_cu_ft: 8 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-RO1", climate_class: "STANDARD", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 100 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician }
            - { call: "POST /api/pack-out-jobs/${job}/transition", payload: { action: "STRUCTURE_START" }, as: ProjectManager }
            - { call: "POST /api/pack-out-jobs/${job}/transition", payload: { action: "STRUCTURE_COMPLETE" }, as: ProjectManager }
            - { call: "POST /api/pack-out-jobs/${job}/pack-back-schedules", payload: { crew_id: "crew-7", service_date: "2026-09-10", window_start_hour: 8, window_end_hour: 12 }, as: ProjectManager, captures: { sch_a: $.data.id } }
            - { call: "POST /api/pack-back-schedules/${sch_a}/transition", payload: { action: "CONFIRM" }, as: ProjectManager, captures: { sta: $.data.status } }
          trigger:
            - { call: "POST /api/pack-out-jobs/${job}/pack-back-schedules", payload: { crew_id: "crew-7", service_date: "2026-09-10", window_start_hour: 12, window_end_hour: 16 }, as: ProjectManager, captures: { sch_b: $.data.id } }
            - { call: "POST /api/pack-back-schedules/${sch_b}/transition", payload: { action: "CONFIRM" }, as: ProjectManager, captures: { stb: $.data.status } }
            - { call: "POST /api/pack-out-jobs/${job}/pack-back-schedules", payload: { crew_id: "crew-7", service_date: "2026-09-10", window_start_hour: 11, window_end_hour: 13 }, as: ProjectManager, captures: { sch_c: $.data.id } }
            - { call: "POST /api/pack-back-schedules/${sch_c}/transition", payload: { action: "CONFIRM" }, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "schedule A CONFIRMED (08-12)"
            - "schedule B CONFIRMED (12-16): adjacency start==end is NOT an overlap under half-open semantics"
            - "schedule C (11-13) rejected: error_id == ERR_CREW_WINDOW_OVERLAP (11 < 12 overlaps A's window)"
      - name: subcontractor_concurrent_capacity_aggregate
        grounds:
          - validations[priority=9]
          - state_machines.SpecialtyReferral.DRAFT_to_DISPATCHED
          - entities.Subcontractor.fields.active_referral_count
          - errors[ERR_SUBCONTRACTOR_AT_CAPACITY]
        distinguishing_aspect: |
          Resource = Subcontractor; semantics = aggregate concurrent-count capacity
          (count of DISPATCHED/IN_CUSTODY/QA_REJECTED referrals <
          max_concurrent_referrals) — no interval geometry at all. Different
          resource entity and different interval semantics than the crew-window
          half-open adjacency rule.
        test_recipe:
          setup:
            - "Subcontractor (specialty ART_CONSERVATION, max_concurrent_referrals 1); two ARTWORK items X and Y triaged SALVAGEABLE; referral R1 for X already DISPATCHED (count == 1)"
          setup_api_calls:
            - { call: "POST /api/subcontractors", payload: { name: "FineArt Pros", specialty_types: ["ART_CONSERVATION"], max_concurrent_referrals: 1 }, as: ProjectManager, captures: { sub: $.data.id } }
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-RO2", property_address: "32 Walnut Ave", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Gallery", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-RO2X", description: "Oil painting X", item_category: "ARTWORK", declared_value_cents: 500000, volume_cu_ft: 3 }, as: InventoryTechnician, captures: { item_x: $.data.id, item_x_v: $.data.version } }
            - { call: "POST /api/items/${item_x}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_x_v}" }, as: InventoryTechnician }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-RO2Y", description: "Oil painting Y", item_category: "ARTWORK", declared_value_cents: 400000, volume_cu_ft: 3 }, as: InventoryTechnician, captures: { item_y: $.data.id, item_y_v: $.data.version } }
            - { call: "POST /api/items/${item_y}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_y_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item_x}/specialty-referrals", payload: { subcontractor_id: "${sub}", specialty_type: "ART_CONSERVATION", quoted_cost_cents: 5000 }, as: ProjectManager, captures: { ref1: $.data.id } }
            - { call: "POST /api/specialty-referrals/${ref1}/transition", payload: { action: "DISPATCH" }, as: ProjectManager, captures: { r1st: $.data.status } }
            - { call: "POST /api/items/${item_y}/specialty-referrals", payload: { subcontractor_id: "${sub}", specialty_type: "ART_CONSERVATION", quoted_cost_cents: 6000 }, as: ProjectManager, captures: { ref2: $.data.id } }
          trigger:
            - { call: "POST /api/specialty-referrals/${ref2}/transition", payload: { action: "DISPATCH" }, as: ProjectManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/specialty-referrals/${ref1}/transition", payload: { action: "RECEIVE" }, as: SubcontractorContact, as_user_id: "${sub}" }
            - { call: "POST /api/specialty-referrals/${ref1}/transition", payload: { action: "RETURN" }, as: SubcontractorContact, as_user_id: "${sub}" }
            - { call: "POST /api/specialty-referrals/${ref2}/transition", payload: { action: "DISPATCH" }, as: ProjectManager, captures: { r2st: $.data.status } }
            - { call: "GET /api/subcontractors/${sub}", payload: {}, as: ProjectManager, captures: { cnt: $.data.active_referral_count } }
          assert:
            - "R2 first DISPATCH rejected: error_id == ERR_SUBCONTRACTOR_AT_CAPACITY (1 >= max 1 — aggregate count boundary)"
            - "After R1 DISPATCHED -> IN_CUSTODY -> RETURNED (slot freed), R2 DISPATCH succeeds: status DISPATCHED"
            - "Subcontractor.${sub}.active_referral_count == 1 at the end (only R2 occupies a slot)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: physical volume (vault occupancy) vs
  # monetary claim-credit liability. Different conserved quantities.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: vault_occupancy_activate_release_compensation
        grounds:
          - calculations.vault_occupancy
          - state_machines.StoragePlacement.ACTIVE_to_RELEASED
          - entities.Vault.fields.occupied_cu_ft
        distinguishing_aspect: |
          Conserved quantity = physical volume: activate(+100) paired with its
          compensating release(-100) returns Vault.occupied_cu_ft to exactly its
          pre-activation value 0, and occupied_cu_ft always equals the sum of
          volumes over ACTIVE placements.
        test_recipe:
          setup:
            - "CLIMATE_CONTROLLED vault (capacity 500, occupied_cu_ft 0); one cleaned GENERAL item vol 100"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-CI1", property_address: "34 Hickory St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-CI1", description: "Armoire", item_category: "GENERAL", declared_value_cents: 7000, volume_cu_ft: 100 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-CI1", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 500, monthly_rate_cents_per_cu_ft: 200 }, as: ProjectManager, captures: { vault: $.data.id, occ0: $.data.occupied_cu_ft } }
          trigger:
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { plc: $.data.id } }
            - { call: "GET /api/vaults/${vault}", payload: {}, as: InventoryTechnician, captures: { occ1: $.data.occupied_cu_ft } }
            - { call: "POST /api/storage-placements/${plc}/release", payload: {}, as: InventoryTechnician }
            - { call: "GET /api/vaults/${vault}", payload: {}, as: InventoryTechnician, captures: { occ2: $.data.occupied_cu_ft, post2: $.data.posture } }
          assert:
            - "occupied_cu_ft before == 0, after activate == 100, after release == 0 (forward+compensating pair leaves the conserved quantity unchanged)"
            - "placement ${plc} status == RELEASED with release_reason == MANUAL"
            - "Vault.${vault}.posture == OPEN after release"
      - name: claim_credit_approve_void_compensation
        grounds:
          - state_machines.HandlingClaim.APPROVED_to_VOIDED
          - entities.CarrierInvoice.fields.claim_credit_cents
          - calculations.handling_claim_settlement
        distinguishing_aspect: |
          Conserved quantity = monetary claim-credit liability (different from
          physical volume): APPROVE creates a 72000-cent pending settlement;
          its compensating VOID cancels it; a subsequently submitted invoice must
          show claim_credit_cents == 0 and balance_cents == total_cents with no
          residual drift.
        test_recipe:
          setup:
            - "ACV job; one REGISTERED item with a DAMAGE claim (replacement 80000, age 1): APPROVE computes 80000*90/100 = 72000 (floor 24000 not binding); then VOID"
            - "A FINALIZED statement (final_total 0) exists so an invoice can be created with adjustment 2000"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-CI2", property_address: "36 Chestnut Blvd", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Study", room_type: "OTHER" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-CI2", description: "Camera", item_category: "ELECTRONICS", declared_value_cents: 80000, volume_cu_ft: 1 }, as: InventoryTechnician, captures: { item: $.data.id } }
            - { call: "POST /api/items/${item}/handling-claims", payload: { claim_type: "LOSS", description: "Misplaced during transport", replacement_cost_cents: 80000, item_age_years: 1 }, as: ProjectManager, as_user_id: "pm-1", captures: { claim: $.data.id } }
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "SUBMIT_REVIEW" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "APPROVE" }, as: ClaimsAdjuster, as_user_id: "adj-1", captures: { settle_amt: $.data.settlement_amount_cents } }
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "VOID" }, as: ClaimsAdjuster, as_user_id: "adj-1", captures: { cst: $.data.status } }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { job_v: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v}" }, as: BillingClerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk }
          trigger:
            - { call: "POST /api/pack-out-jobs/${job}/carrier-invoices", payload: { adjustment_cents: 2000 }, as: BillingClerk, captures: { inv: $.data.id } }
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "SUBMIT" }, as: BillingClerk, captures: { credit: $.data.claim_credit_cents, bal: $.data.balance_cents } }
          assert:
            - "claim ${claim} settled at 72000 on APPROVE then status == VOIDED after the compensating VOID"
            - "CarrierInvoice.${inv}.claim_credit_cents == 0 (voided approval contributes nothing; no sweep occurred)"
            - "CarrierInvoice.${inv}.balance_cents == 2100 == total_cents (storage 0 + adjustment 2000 + fee 100) — the approve/void pair left zero monetary drift"
