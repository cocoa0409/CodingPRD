  # =========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: workshop_room_half_open_with_15min_buffer
        grounds:
          - validations[priority=12]
          - errors[ERR_WORKSHOP_OVERLAP]
          - entities.Workshop.fields.start_at
          - entities.Workshop.fields.end_at
          - entities.Workshop.fields.room_id
        distinguishing_aspect: |
          Workshop overlap uses HALF-OPEN interval [start_at, end_at) plus a
          15-minute BUFFER on either side. A second workshop in the same
          STUDIO_A whose start_at is exactly 5 minutes after the first
          workshop's end_at (inside the 15-min buffer) is REJECTED, even
          though the raw intervals are disjoint.
        test_recipe:
          setup:
            - "First workshop 2026-05-01T10:00Z–2026-05-01T12:00Z in STUDIO_A already scheduled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /workshops"
              payload: { title: "Repot 101", topic: "REPOTTING", room_id: "STUDIO_A", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T12:00:00Z", capacity: 10 }
              as: Manager
              captures: { w1_id: "$.data.id" }
          trigger:
            # Second workshop 12:05Z-13:00Z — inside 15-min buffer.
            - call: "POST /workshops"
              payload: { title: "Light 101", topic: "LIGHT_101", room_id: "STUDIO_A", start_at: "2026-05-01T12:05:00Z", end_at: "2026-05-01T13:00:00Z", capacity: 5 }
              as: Manager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_WORKSHOP_OVERLAP"

      - name: delivery_driver_closed_interval_and_daily_capacity_aggregate
        grounds:
          - validations[priority=13]
          - errors[ERR_DELIVERY_OVERLAP]
          - entities.DeliveryDriver.fields.daily_capacity_minutes
          - entities.DeliveryAssignment.fields.window_start_at
          - entities.DeliveryAssignment.fields.window_end_at
        distinguishing_aspect: |
          Delivery overlap uses CLOSED interval [window_start_at, window_end_at]
          AND aggregate daily-capacity minutes on the driver. Different resource
          entity (DeliveryDriver, not Workshop room) and different interval
          semantics (closed + aggregate vs half-open + buffer): a request whose
          window doesn't intersect any existing SCHEDULED window can still be
          rejected because the driver's aggregate scheduled minutes would exceed
          daily_capacity_minutes.
        test_recipe:
          setup:
            - "Driver Ulla with daily_capacity_minutes=180. Two orders already dispatched to Ulla using 120 minutes on 2026-04-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "uma@example.com", full_name: "Uma", delivery_zone: "ZONE_A", address_line: "16 Vine" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /delivery-drivers"
              payload: { name: "Ulla", daily_capacity_minutes: 180 }
              as: Manager
              captures: { driver_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Palm", light_tag: "BRIGHT_INDIRECT", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 3000, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-26T00:00:00Z" }
              as: ShopStaff
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-27T00:00:00Z" }
              as: ShopStaff
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1_id: "$.data.id" }
            - call: "POST /orders/${o1_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o1_id}/dispatch"
              payload: { driver_id: "${driver_id}", window_start_at: "2026-04-02T09:00:00Z", window_end_at: "2026-04-02T10:00:00Z" }
              as: ShopStaff
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o2_id: "$.data.id" }
            - call: "POST /orders/${o2_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o2_id}/dispatch"
              payload: { driver_id: "${driver_id}", window_start_at: "2026-04-02T14:00:00Z", window_end_at: "2026-04-02T15:00:00Z" }
              as: ShopStaff
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o3_id: "$.data.id" }
            - call: "POST /orders/${o3_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            # Third window is disjoint from both existing windows (16:00-17:00 doesn't intersect 09:00-10:00 or 14:00-15:00)
            # But 120 + 60 = 180 already at cap; adding 60 more overflows.
            - call: "POST /orders/${o3_id}/dispatch"
              payload: { driver_id: "${driver_id}", window_start_at: "2026-04-02T16:00:00Z", window_end_at: "2026-04-02T17:00:00Z" }
              as: ShopStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_DELIVERY_OVERLAP"

  # =========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_preserves_customer_points_balance_invariant
        grounds:
          - state_machines.Order.PENDING+PAID_to_CANCELLED+REFUNDED
          - entities.LoyaltyLedger.fields.reason
          - entities.LoyaltyLedger.fields.delta_points
          - entities.Customer.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity: Customer.points_balance == sum(LoyaltyLedger.
          delta_points where customer_id = C). When a paid PENDING order is
          cancelled, the compensating LoyaltyLedger REVERSAL entry (delta =
          -order.points_provisional) restores sum(delta_points) exactly to
          its pre-order value. The invariant is on points_balance.
        test_recipe:
          setup:
            - "Fresh Customer with no ledger. Order created + paid at BRONZE; provisional accrual entry added."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "vera@example.com", full_name: "Vera", delivery_zone: "ZONE_A", address_line: "17 Willow" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Basil", light_tag: "DIRECT", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 8000, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id", o_v: "$.data.version", provisional: "$.data.points_provisional" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_v_after_pay: "$.data.version" }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { expected_order_version: "${o_v_after_pay}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { final_balance: "$.data.points_balance", final_lifetime: "$.data.lifetime_points_earned" }
          assert:
            # provisional = floor(8000/100 * 1.0) = 80. After cancel + REVERSAL: sum(delta) = 80 - 80 = 0.
            - "provisional == 80"
            - "final_balance == 0"
            - "Customer.${cust_id}.wallet_credit_cents == 9700"

      - name: warranty_approve_preserves_stockunit_cardinality_invariant
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - entities.StockUnit.fields.sale_status
          - entities.Plant.fields.available_count
        distinguishing_aspect: |
          Conserved quantity DIFFERENT from Instance 1: for a given Plant,
          total(StockUnit rows for Plant P) == available_count + sum(count of
          StockUnits in {RESERVED, SOLD, SHRINK, RETURNED}). A warranty
          approval flips one SOLD unit to SHRINK; the sum on the RHS is
          unchanged (SOLD-1, SHRINK+1) — the invariant preserves the physical
          unit cardinality even though the buckets shift. Different conserved
          quantity (physical-unit cardinality vs points_balance).
        test_recipe:
          setup:
            - "Plant with 3 StockUnits: after checkout of 1 unit → RESERVED, delivery → SOLD, warranty approve → SHRINK. Total rows must stay 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "wren@example.com", full_name: "Wren", delivery_zone: "ZONE_A", address_line: "18 Elder" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /delivery-drivers"
              payload: { name: "Xan" }
              as: Manager
              captures: { driver_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Cactus", light_tag: "DIRECT", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 4000, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
              captures: { su_1_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-26T00:00:00Z" }
              as: ShopStaff
              captures: { su_2_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-27T00:00:00Z" }
              as: ShopStaff
              captures: { su_3_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/dispatch"
              payload: { driver_id: "${driver_id}", window_start_at: "2026-04-05T09:00:00Z", window_end_at: "2026-04-05T11:00:00Z" }
              as: ShopStaff
              captures: { delivery_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T10:00:00Z" }
              as: Manager
            - call: "POST /deliveries/${delivery_id}/deliver"
              payload: {}
              as: DeliveryDriver
              as_user_id: "${driver_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: Manager
            - call: "GET /order-lines"
              payload: { order_id: "${order_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { orderline_id: "$.data[0].id" }
            - call: "POST /warranty-claims"
              payload: { orderline_id: "${orderline_id}", customer_id: "${cust_id}", reason: "MORTALITY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { warranty_id: "$.data.id" }
          trigger:
            - call: "POST /warranty-claims/${warranty_id}/approve"
              payload: {}
              as: Horticulturist
            - call: "GET /plants/${plant_id}/stock-units"
              payload: {}
              as: Manager
              captures: { unit_count: "$.data" }
          assert:
            # Physical rows preserved: 3 total StockUnits still exist under this Plant.
            # available_count reflects only FOR_SALE + HEALTHY/RECOVERING units — should be 2 (su_2, su_3).
            - "Plant.${plant_id}.available_count == 2"
            - "StockUnit.${su_1_id}.sale_status == SHRINK"
            - "StockUnit.${su_1_id}.shrink_reason == WARRANTY_RETURN"
            - "count(StockUnit where plant_id=${plant_id}) == 3"
