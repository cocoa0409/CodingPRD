            - "The FIRST trigger call returns 422 with error_id ERR_BASELINE_NO_DATA; GET /baseline-periods/${may_period} still returns status OPEN with baseline_entry_count 0 — an empty window is refused, not frozen as zeros."
            - "The SECOND trigger call succeeds with status SUBMITTED, baseline_entry_count == 1, baseline_waste_grams == 500, baseline_waste_kg == 0.500, baseline_cost_cents == 320 and submitted_at == 2026-08-01T00:00:00Z."
            - "The SECOND trigger call returns baseline_meals_served == 100 and baseline_intensity_kg_per_1k_meals == 5.000: only the 2026-06-30 shift is inside the window, so the 700 g capture and the 100 meals of 2026-07-01 are excluded even though they are one calendar day away."
            - "A 1200 g / 200 meals / 6.000 freeze would mean the end_date was treated as exclusive-of-nothing (both days pulled in); a 0-entry freeze would mean end_date was treated as exclusive. Neither is correct."

      - name: donation_shelf_life_endpoint_is_inclusive_to_the_second
        grounds: "§1.4 validations[priority=85] ERR_DONATION_WINDOW_EXPIRED (inclusive endpoint: pickup_window_start <= captured_at + FoodType.donation_shelf_life_hours); §1.1 FoodType.donation_shelf_life_hours."
        distinguishing_aspect: "Metric: a datetime edge at ONE-SECOND resolution, on POST /consignment-lines — the finest granularity of the four instances and the only one where the compared quantity is an instant rather than a number. The edge is INCLUSIVE: a pickup at exactly captured_at + 24 h is accepted, one second later is refused, and both calls route the SAME entry so the only difference in the universe is the consignment's pickup_window_start."
