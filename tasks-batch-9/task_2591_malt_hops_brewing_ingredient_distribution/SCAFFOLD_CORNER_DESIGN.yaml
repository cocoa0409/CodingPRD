              as: AllocationManager
              captures: { ny_p27: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2028, contract_open_date: "2028-01-15T00:00:00Z", harvest_report_due_date: "2028-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { ny_p28: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2029, contract_open_date: "2029-01-15T00:00:00Z", harvest_report_due_date: "2029-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { ny_p29: $.data.id }
            - call: "POST /crop-year-programs"
