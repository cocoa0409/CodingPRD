            - { call: "POST /stewardship/succession-notices", payload: { easement_id: "${e_id}", successor_owner_name: "B", successor_contact_email: "b@x.com", transfer_on: "2026-08-31" }, as: Landowner, as_user_id: "${lo_id}", captures: { sn30: $.data.id } }
          assert:
            - "transfer 2026-08-30 (29 days out): err29 == ERR_NOTICE_WINDOW_VIOLATION (422)"
            - "transfer 2026-08-31 (exactly 30 days out): accepted, notice created in NOTICE_GIVEN"

      - name: violation_against_permitted_use_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_USE_PERMITTED_NOT_VIOLABLE]"]
        distinguishing_aspect: "A violation may only target PROHIBITED or DISCRETIONARY cells; AGRICULTURE is PERMITTED, so opening a violation on it is rejected."
        test_recipe:
          setup: ["RECORDED easement"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-VP", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
          trigger:
            - { call: "POST /stewardship/violations", payload: { easement_id: "${e_id}", detected_by_user_id: "coord-9", violation_type: AGRICULTURE, severity: MINOR, detected_on: "2026-08-02" }, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_USE_PERMITTED_NOT_VIOLABLE (422)"

      - name: use_auth_on_prohibited_cell_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_USE_NOT_DISCRETIONARY]"]
        distinguishing_aspect: "Use authorizations exist only for DISCRETIONARY cells; requesting one for PROHIBITED SUBDIVISION is rejected."
        test_recipe:
          setup: ["RECORDED easement with ACTIVE landowner"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-UP", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
          trigger:
            - { call: "POST /stewardship/use-authorizations", payload: { easement_id: "${e_id}", use_type: SUBDIVISION, justification: "split lot" }, as: Landowner, as_user_id: "${lo_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_USE_NOT_DISCRETIONARY (422)"

      - name: duplicate_active_use_authorization_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_USE_CURRENTLY_AUTHORIZED]"]
        distinguishing_aspect: "A second REQUESTED authorization for the same (easement, use_type) collides with the existing active one."
        test_recipe:
          setup: ["RECORDED easement; landowner already holds a REQUESTED TIMBER_HARVEST authorization"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-DU", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/use-authorizations", payload: { easement_id: "${e_id}", use_type: TIMBER_HARVEST, justification: "first" }, as: Landowner, as_user_id: "${lo_id}", captures: { ua1: $.data.id } }
          trigger:
            - { call: "POST /stewardship/use-authorizations", payload: { easement_id: "${e_id}", use_type: TIMBER_HARVEST, justification: "second" }, as: Landowner, as_user_id: "${lo_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_USE_CURRENTLY_AUTHORIZED (409)"

      - name: duplicate_baseline_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_BASELINE_ALREADY_EXISTS]"]
        distinguishing_aspect: "Exactly one BaselineReport per easement ever, even while the first is still DRAFT."
        test_recipe:
          setup: ["DRAFT easement already has a baseline"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-DB", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
          trigger:
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-2", condition_narrative: "n2", photo_point_count: 6 }, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BASELINE_ALREADY_EXISTS (409)"

      - name: second_inflight_amendment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_AMENDMENT_ALREADY_IN_FLIGHT]"]
        distinguishing_aspect: "With amendment A in flight and a fresh easement version, amendment B passes OCC but is rejected by the in-flight uniqueness rule."
        test_recipe:
          setup: ["RECORDED easement; amendment A created (now SUBMITTED)"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-IA", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { ev: $.data.version } }
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: SUBDIVISION, new_level: DISCRETIONARY } ], affected_acreage: 10 }, as: StewardshipCoordinator, captures: { am_a: $.data.id } }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { ev2: $.data.version } }
          trigger:
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev2}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: SUBDIVISION, new_level: PROHIBITED } ], affected_acreage: 5 }, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_AMENDMENT_ALREADY_IN_FLIGHT (409); SUBDIVISION -> PROHIBITED equals... no: B's change differs from A's but the in-flight rule is per easement, not per cell"

      - name: second_fund_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_FUND_ALREADY_EXISTS]"]
        distinguishing_aspect: "One EndowmentFund per easement ever."
        test_recipe:
          setup: ["easement already has a fund"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-DF", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 1000 }, as: TrustAdmin, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 300, principal_floor_cents: 2000 }, as: TrustAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FUND_ALREADY_EXISTS (409)"

      - name: board_draw_above_market_value_rejected
        claim_type: boundary
        grounds: [calculations.waterfall_draw_allocation, "errors[ERR_DRAW_EXCEEDS_AUTHORITY]"]
        distinguishing_aspect: "Even a TrustBoardReviewer cannot draw more than market_value_cents: a 600000 draw against MV 500000 is rejected ERR_DRAW_EXCEEDS_AUTHORITY; a 400001 draw (1 cent over unitized capacity 400000) is allowed only via the invasion branch for the board."
        test_recipe:
          setup: ["ACTIVE fund MV=500000, floor=100000, year 1 (policy allowance 0)"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-DX", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 100000 }, as: TrustAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 500000 }, as: TrustAdmin }
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { fv: $.data.version } }
          trigger:
            - { call: "POST /stewardship/endowment-funds/${f_id}/draws", payload: { amount_cents: 600000, purpose: ENFORCEMENT, expected_fund_version: "${fv}" }, as: TrustBoardReviewer, captures: { err: $.data.error_id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/draws", payload: { amount_cents: 400001, purpose: ENFORCEMENT, expected_fund_version: "${fv}" }, as: TrustBoardReviewer, captures: { tx2: $.data.id, inv2: $.data.from_principal_invasion_cents, exc2: $.data.from_excess_cents } }
          assert:
            - "600000 > MV: err == ERR_DRAW_EXCEEDS_AUTHORITY (402)"
            - "the rejected draw consumed no version, so the 400001 retry with the same expected_fund_version succeeds"
            - "400001 split: from_policy_allowance_cents == 0, from_excess_cents == 400000, from_principal_invasion_cents == 1 (a single cent into principal)"

  - section: endpoints
