# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1859: Physician Call Schedule & Locum Coverage
# Enumerative breadth over §1.1–§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_program_success_with_defaults
        claim_type: creation
        grounds:
          - "entities.CallProgram"
        distinguishing_aspect: "Minimal required-field create returns 201 with DRAFT status, version 1, zeroed computed ledgers, and all documented defaults applied."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Sep", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-10", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id, prog_status: $.data.status, prog_version: $.data.version }
          assert:
            - "status == DRAFT (captured ${prog_status}) and version == 1 (captured ${prog_version})"
            - "payroll_reserved_cents == 0 and payroll_accrued_cents == 0"
            - "defaults applied: swap_cutoff_hours == 48, credentialing_lead_hours == 120, primary_rate_cents == 50000, backup_rate_cents == 20000, weekend_multiplier == 1.25, holiday_multiplier == 1.5, backup_activation_multiplier == 2.0, moonlight_premium_multiplier == 1.15, moonlight_premium_threshold_hours == 40, weekday_call_points == 1.0, weekend_call_points == 2.0, holiday_call_points == 3.0, backup_point_multiplier == 0.5, equity_band_points == 4.0, holiday_dates == []"

      - name: create_program_missing_budget_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.CallProgram.fields.payroll_budget_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required payroll_budget_cents yields ERR_INVALID_REQUEST (400) and nothing is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Sep", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-10" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_INVALID_REQUEST (captured ${err}); no program persisted (GET /api/call-programs returns empty)"

      - name: create_program_all_zero_counts_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.CallProgram.fields.holiday_backup_required"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "All six required slot counts at 0 violates the 'at least one > 0' constraint -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/call-programs"
              payload: { name: "Empty Program", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-10", payroll_budget_cents: 1000000, weekday_primary_required: 0, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_INVALID_REQUEST (captured ${err})"

      - name: create_program_period_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.CallProgram.fields.period_end"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "period_end < period_start violates the range constraint -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/call-programs"
              payload: { name: "Backwards", service_line: "CARDIOLOGY", period_start: "2026-09-10", period_end: "2026-09-08", payroll_budget_cents: 1000000 }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_INVALID_REQUEST (captured ${err})"

      - name: create_physician_default_moonlight_cap_applied
        claim_type: defaults
        grounds:
          - "entities.Physician.fields.moonlight_cap_hours"
        distinguishing_aspect: "Omitting moonlight_cap_hours applies the default 96 and initial status ACTIVE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p_id: $.data.id, cap: $.data.moonlight_cap_hours, st: $.data.status }
          assert:
            - "moonlight_cap_hours == 96 (captured ${cap})"
            - "status == ACTIVE (captured ${st}) and version == 1"

      - name: get_nonexistent_program_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_PROGRAM_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_PROGRAM_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/call-programs/00000000-0000-0000-0000-000000000000"
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_PROGRAM_NOT_FOUND (captured ${err}), http 404"

      - name: physician_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "limit/offset windowing over 3 physicians: page 1 has 2 items with has_more true and total_count 3; page 2 has 1 item with has_more false."
        test_recipe:
          setup: ["three physicians registered"]
          setup_api_calls:
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr B", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr C", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
          trigger:
            - call: "GET /api/physicians?limit=2&offset=0"
              as: SchedulerAdmin
            - call: "GET /api/physicians?limit=2&offset=2"
              as: SchedulerAdmin
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

      - name: slot_date_type_holiday_precedence_over_weekend
        claim_type: computed_fields
        grounds:
          - "entities.CallSlot.fields.date_type"
          - "calculations.slot_generation_plan"
        distinguishing_aspect: "2026-09-12 is a Saturday listed in holiday_dates: HOLIDAY precedence means holiday_primary_required (1) drives slot count, not weekend_primary_required (2), and date_type computes to HOLIDAY."
        test_recipe:
          setup: ["program covering only Saturday 2026-09-12 with holiday_dates [2026-09-12], holiday_primary_required 1, weekend_primary_required 2"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Holiday Saturday", service_line: "CARDIOLOGY", period_start: "2026-09-12", period_end: "2026-09-12", holiday_dates: ["2026-09-12"], payroll_budget_cents: 1000000, weekday_primary_required: 0, weekend_primary_required: 2, holiday_primary_required: 1, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
          trigger:
            - call: "GET /api/call-slots?program_id=${prog_id}"
              as: SchedulerAdmin
              captures: { dt: $.data.0.date_type, ws: $.data.0.window_start }
          assert:
            - "exactly 1 slot created (holiday count wins over weekend count 2)"
            - "slot date_type == HOLIDAY (captured ${dt}), date == 2026-09-12"
            - "window_start == 2026-09-12T07:00:00Z (captured ${ws}) and window_end == 2026-09-13T07:00:00Z"

      - name: create_physician_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Physician"
        distinguishing_aspect: "Client-sent id/created_at/version are ignored: server mints its own UUID and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF", id: "11111111-1111-1111-1111-111111111111", version: 99, created_at: "2020-01-01T00:00:00Z" }
              as: SchedulerAdmin
              captures: { p_id: $.data.id, p_version: $.data.version }
          assert:
            - "returned id != 11111111-1111-1111-1111-111111111111 (captured ${p_id} is server-minted)"
            - "version == 1 (captured ${p_version}) and created_at != 2020-01-01T00:00:00Z"

  - section: state_machines
    instances:
      - name: generate_from_generated_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.CallProgram.DRAFT_to_GENERATED"
          - "errors[ERR_PROGRAM_NOT_DRAFT]"
        distinguishing_aspect: "generate is only valid from DRAFT; a second generate on the GENERATED program fails with ERR_PROGRAM_NOT_DRAFT."
        test_recipe:
          setup: ["program generated once (GENERATED)"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
          trigger:
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_PROGRAM_NOT_DRAFT (captured ${err}); program remains GENERATED"

      - name: publish_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.CallProgram.GENERATED_to_PUBLISHED"
          - "errors[ERR_PROGRAM_NOT_GENERATED]"
        distinguishing_aspect: "publish requires GENERATED; from DRAFT it fails with ERR_PROGRAM_NOT_GENERATED."
        test_recipe:
          setup: ["program created, never generated"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_PROGRAM_NOT_GENERATED (captured ${err}); program remains DRAFT"

      - name: cancel_assignment_twice_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.CallAssignment.SCHEDULED_to_CANCELLED"
          - "errors[ERR_ASSIGNMENT_NOT_SCHEDULED]"
        distinguishing_aspect: "CANCELLED is terminal: a second cancel fails with ERR_ASSIGNMENT_NOT_SCHEDULED and creates no second gap."
        test_recipe:
          setup: ["PUBLISHED 1-slot program (2026-09-08); P1 assigned; assignment already cancelled once"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/call-assignments/${a_id}/cancel"
              as: SchedulerAdmin
          trigger:
            - call: "POST /api/call-assignments/${a_id}/cancel"
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
            - call: "GET /api/coverage-gaps?slot_id=${slot_id}"
              as: SchedulerAdmin
          assert:
            - "second cancel rejected with ERR_ASSIGNMENT_NOT_SCHEDULED (captured ${err})"
            - "exactly 1 CoverageGap exists for the slot (no duplicate gap from the rejected call)"

      - name: execute_executed_swap_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.SwapRequest.APPROVED_to_EXECUTED"
          - "errors[ERR_SWAP_NOT_APPROVED]"
        distinguishing_aspect: "EXECUTED is terminal: re-executing the same swap fails with ERR_SWAP_NOT_APPROVED and no second replacement assignment appears."
        test_recipe:
          setup: ["PUBLISHED 1-slot program (2026-09-08); P1 assigned; swap posted, claimed by P2, approved, executed"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr B", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p2_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/swap-requests"
              payload: { assignment_id: "${a_id}" }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /api/swap-requests/${sw_id}/claim"
              as: Physician
              as_user_id: "${p2_id}"
            - call: "POST /api/swap-requests/${sw_id}/approve"
              as: ChiefOfStaff
            - call: "POST /api/swap-requests/${sw_id}/execute"
              as: SchedulerAdmin
          trigger:
            - call: "POST /api/swap-requests/${sw_id}/execute"
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
            - call: "GET /api/call-assignments?source_swap_id=${sw_id}"
              as: SchedulerAdmin
          assert:
            - "rejected with ERR_SWAP_NOT_APPROVED (captured ${err})"
            - "exactly 1 replacement assignment exists for the swap (no double execution)"

      - name: activate_backup_on_primary_slot_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.CallAssignment.SCHEDULED_to_ACTIVATED"
          - "errors[ERR_ACTIVATION_REQUIRES_BACKUP_SLOT]"
        distinguishing_aspect: "activate-backup on an assignment whose slot is PRIMARY fails with ERR_ACTIVATION_REQUIRES_BACKUP_SLOT even inside the activation window."
        test_recipe:
          setup: ["PUBLISHED 1-slot PRIMARY program (2026-09-08); P1 assigned; clock inside the call window (2026-09-08T10:00:00Z)"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: SchedulerAdmin
          trigger:
            - call: "POST /api/call-assignments/${a_id}/activate-backup"
              payload: { reason: "SURGE" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_ACTIVATION_REQUIRES_BACKUP_SLOT (captured ${err}); assignment remains SCHEDULED with activated_at null"

      - name: window_cancel_after_approval_does_not_restore_assignments
        claim_type: side_effect_execution
        grounds:
          - "state_machines.UnavailabilityWindow.APPROVED_to_CANCELLED"
        distinguishing_aspect: "Cancelling an APPROVED window is pinned to NOT resurrect the assignments its approval cascade-cancelled: the assignment stays CANCELLED and the gap stays OPEN."
        test_recipe:
          setup: ["PUBLISHED 1-slot program (2026-09-08); P1 assigned; P1's window 2026-09-08..2026-09-08 approved (assignment cascade-cancelled, gap open)"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/unavailability-windows"
              payload: { physician_id: "${p1_id}", start_date: "2026-09-08", end_date: "2026-09-08", kind: "CME" }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { win_id: $.data.id, win_status: $.data.status }
            - call: "POST /api/unavailability-windows/${win_id}/approve"
              as: SchedulerAdmin
          trigger:
            - call: "POST /api/unavailability-windows/${win_id}/cancel"
              as: Physician
              as_user_id: "${p1_id}"
              captures: { win_final: $.data.status }
            - call: "GET /api/call-assignments/${a_id}"
              as: SchedulerAdmin
              captures: { a_status: $.data.status }
          assert:
            - "window was REQUESTED at creation (captured ${win_status}) — initial state claim"
            - "window is CANCELLED after cancel (captured ${win_final})"
            - "assignment remains CANCELLED (captured ${a_status}); the gap remains OPEN — no automatic restoration"

      - name: requisition_cancel_reopens_gap_and_cancels_case
        claim_type: side_effect_execution
        grounds:
          - "state_machines.LocumRequisition.CREDENTIALING_to_CANCELLED"
          - "state_machines.CredentialingCase.IN_PROGRESS_to_CANCELLED"
          - "state_machines.CoverageGap.REQUISITIONED_to_OPEN"
        distinguishing_aspect: "Cancelling a CREDENTIALING requisition cascades: active case -> CANCELLED and gap REQUISITIONED -> OPEN."
        test_recipe:
          setup: ["PUBLISHED 1-slot program (2026-09-08) with shortfall gap; requisition in CREDENTIALING with LOCUM candidate; one checklist item completed"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Locum", specialty: "CARDIOLOGY", employment_type: "LOCUM" }
              as: SchedulerAdmin
              captures: { l1_id: $.data.id }
            - call: "GET /api/coverage-gaps?program_id=${prog_id}&status=OPEN"
              as: SchedulerAdmin
              captures: { gap_id: $.data.0.id }
            - call: "POST /api/locum-requisitions"
              payload: { gap_id: "${gap_id}" }
              as: SchedulerAdmin
              captures: { req_id: $.data.id }
            - call: "POST /api/locum-requisitions/${req_id}/propose-candidate"
              payload: { candidate_physician_id: "${l1_id}" }
              as: SchedulerAdmin
            - call: "POST /api/locum-requisitions/${req_id}/begin-credentialing"
              as: CredentialingOfficer
            - call: "GET /api/credentialing-cases?requisition_id=${req_id}"
              as: CredentialingOfficer
              captures: { case_id: $.data.0.id }
            - call: "POST /api/credentialing-cases/${case_id}/complete-item"
              payload: { item: "license_verification" }
              as: CredentialingOfficer
          trigger:
            - call: "POST /api/locum-requisitions/${req_id}/cancel"
              as: SchedulerAdmin
              captures: { req_status: $.data.status }
            - call: "GET /api/credentialing-cases/${case_id}"
              as: CredentialingOfficer
