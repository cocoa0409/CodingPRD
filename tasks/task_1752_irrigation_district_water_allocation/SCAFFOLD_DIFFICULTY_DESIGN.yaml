            - call: "GET /district/water-accounts/${acct2}"
              as: DistrictAdmin
              captures: { acct2_status_after: "$.data.status" }
          assert:
            - "Invoice1: status == PAID via the direct branch; WaterAccount.${acct1}.status == ACTIVE at all times (no suspension side effect)"
            - "Invoice2 swept to DELINQUENT (swept_count == 1), then LIEN_FILED with WaterAccount.${acct2}.status == SUSPENDED"
            - "After lien-path payment: AssessmentInvoice.${inv2}.status == PAID with total_amount == 275.00 (250.00 + 25.00 penalty)"
            - "WaterAccount.${acct2}.status == ACTIVE again (lien released) — the branch's compensating side effect fired"

  # ===========================================================================
  # Rule 4 — transitive_cascade from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: maintenance_window_activation_cascade
        grounds:
          - state_machines.MaintenanceWindow.PLANNED_to_ACTIVE
          - state_machines.CanalReach.IN_SERVICE_to_SHUTDOWN
          - state_machines.TurnoutOrder.SCHEDULED_to_CANCELLED
          - state_machines.RiderWorkOrder.ASSIGNED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain triggered by window activation: MaintenanceWindow ->
          ACTIVE causes CanalReach -> SHUTDOWN, which causes the overlapping
          SCHEDULED TurnoutOrder -> CANCELLED, which itself releases 4.13 af of
          committed_af on the SeasonAllocation and cancels the ASSIGNED
          RiderWorkOrder — each link caused by the previous mutation.
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account 5.0 acres SENIOR -> entitlement 10.00; order 5 cfs x 10h (4.13 af) SCHEDULED on reach, work order ASSIGNED; committed_af == 4.13"
            - "PLANNED maintenance window 2026-07-10T12:00 to 2026-07-10T20:00 on the same reach (created after the order so order creation passed the window check); clock inside the window"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Cascade C", parcel_number: "APN-008", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach MW", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-07-10T08:00:00Z", requested_end_at: "2026-07-10T18:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /district/turnout-orders/${order_id}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order_id}"
              as: DistrictAdmin
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /district/maintenance-windows"
              payload: { canal_reach_id: "${reach_id}", start_at: "2026-07-10T12:00:00Z", end_at: "2026-07-10T20:00:00Z", reason: "flume repair" }
              as: DistrictAdmin
              captures: { win_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T12:30:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /district/maintenance-windows/${win_id}/activate"
              payload: {}
              as: DistrictAdmin
              captures: { win_status: "$.data.status" }
            - call: "GET /district/canal-reaches/${reach_id}"
              as: DistrictAdmin
              captures: { reach_status: "$.data.status" }
            - call: "GET /district/turnout-orders/${order_id}"
              as: DistrictAdmin
              captures: { order_status: "$.data.status" }
            - call: "GET /district/rider-work-orders/${wo_id}"
              as: DistrictAdmin
              captures: { wo_status: "$.data.status" }
            - call: "GET /district/season-allocations/${alloc_id}"
              as: DistrictAdmin
              captures: { alloc_committed: "$.data.committed_af" }
          assert:
            - "MaintenanceWindow.${win_id}.status == ACTIVE"
            - "CanalReach.${reach_id}.status == SHUTDOWN (link 1)"
            - "TurnoutOrder.${order_id}.status == CANCELLED (link 2, caused by the shutdown)"
            - "RiderWorkOrder.${wo_id}.status == CANCELLED (link 3, caused by the order cancellation)"
            - "SeasonAllocation.${alloc_id}.committed_af == 0.00 (4.13 af released by the cancellation)"

      - name: drought_effectuation_cascade
        grounds:
          - state_machines.DroughtDeclaration.PROPOSED_to_EFFECTIVE
          - state_machines.SeasonAllocation.ACTIVE_to_CURTAILED
          - state_machines.TurnoutOrder.SCHEDULED_to_CANCELLED
          - state_machines.RiderWorkOrder.ASSIGNED_to_CANCELLED
          - calculations.curtailed_entitlement
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (drought effectuation, not
          window activation): EFFECTIVE curtails the JUNIOR allocation to 6.00,
          which makes committed 8.26 exceed available, which cancels the
          latest-start order B (selector: requested_start_at DESC), which
          cancels B's ASSIGNED work order and releases 4.13 af of committed.
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; JUNIOR account (priority 1922-05-01) 5.0 acres -> base 10.00"
            - "Order A 2026-06-01 08:00-18:00 (4.13 af) SCHEDULED; order B 2026-06-03 08:00-18:00 (4.13 af) SCHEDULED; committed 8.26; both work orders ASSIGNED"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Junior J", parcel_number: "APN-009", irrigated_acres: 5.0, water_right_priority_date: "1922-05-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach DR", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_a: "$.data.id" }
            - call: "GET /district/water-accounts/${acct_id}"
              as: DistrictAdmin
              captures: { acct_v2: "$.data.version" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-03T08:00:00Z", requested_end_at: "2026-06-03T18:00:00Z", expected_water_account_version: "${acct_v2}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_b: "$.data.id" }
            - call: "POST /district/turnout-orders/${order_a}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "POST /district/turnout-orders/${order_b}/schedule"
              payload: { rider_user_id: "rider-2" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order_b}"
              as: DistrictAdmin
              captures: { wo_b: "$.data[0].id" }
            - call: "POST /district/drought-declarations"
              payload: { season_id: "${season_id}", stage: "STAGE_2" }
              as: DistrictAdmin
              captures: { drought_id: "$.data.id" }
          trigger:
            - call: "POST /district/drought-declarations/${drought_id}/effectuate"
              payload: {}
              as: DistrictAdmin
              captures: { drought_status: "$.data.status" }
            - call: "GET /district/season-allocations/${alloc_id}"
              as: DistrictAdmin
              captures: { alloc_status: "$.data.status", alloc_eff: "$.data.effective_entitlement_af", alloc_committed: "$.data.committed_af" }
            - call: "GET /district/turnout-orders/${order_a}"
              as: DistrictAdmin
              captures: { order_a_status: "$.data.status" }
            - call: "GET /district/turnout-orders/${order_b}"
              as: DistrictAdmin
              captures: { order_b_status: "$.data.status" }
            - call: "GET /district/rider-work-orders/${wo_b}"
              as: DistrictAdmin
              captures: { wo_b_status: "$.data.status" }
          assert:
            - "DroughtDeclaration.${drought_id}.status == EFFECTIVE"
            - "SeasonAllocation.${alloc_id}.status == CURTAILED and effective_entitlement_af == 6.00 (10.00 x (1 - 0.40), JUNIOR STAGE_2)"
            - "TurnoutOrder.${order_b}.status == CANCELLED (latest requested_start_at cancelled first) with RiderWorkOrder.${wo_b}.status == CANCELLED"
            - "TurnoutOrder.${order_a}.status == SCHEDULED (survives: committed 4.13 <= 6.00 after one cancellation)"
            - "SeasonAllocation.${alloc_id}.committed_af == 4.13"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict across different category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_create_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - errors[ERR_INSUFFICIENT_ALLOCATION]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: one request violates both
          (account SUSPENDED via lien AND requested 4.13 af > 2.00 available);
          the pinned ordering returns ERR_ACCOUNT_NOT_ACTIVE (state, priority 6)
          over ERR_INSUFFICIENT_ALLOCATION (fiscal, priority 10).
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account 1.0 acre -> entitlement 2.00 (available 2.00)"
            - "Account's invoice ISSUED due 2026-08-05, swept DELINQUENT, lien filed -> account SUSPENDED"
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Dual D", parcel_number: "APN-010", irrigated_acres: 1.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach PC", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { inv_id: "$.data.id" }
            - call: "POST /district/assessment-invoices/${inv_id}/issue"
              payload: { due_date: "2026-08-05T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/run-delinquency-sweep"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/assessment-invoices/${inv_id}/file-lien"
              payload: {}
              as: DistrictAdmin
            - call: "GET /district/water-accounts/${acct_id}"
              as: DistrictAdmin
              captures: { acct_v_current: "$.data.version", acct_status: "$.data.status" }
          trigger:
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-08-20T08:00:00Z", requested_end_at: "2026-08-20T18:00:00Z", expected_water_account_version: "${acct_v_current}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "WaterAccount.${acct_id}.status == SUSPENDED before the trigger"
            - "error_id == ERR_ACCOUNT_NOT_ACTIVE with http 409 (state beats fiscal), NOT ERR_INSUFFICIENT_ALLOCATION (422)"
            - "SeasonAllocation.${alloc_id}.committed_af remains 0.00 (no water committed by the rejected request)"

      - name: schedule_temporal_beats_capacity
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_WINDOW_TIME_CONFLICT]
          - errors[ERR_REACH_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint: scheduling one
          order violates both (window overlaps a PLANNED maintenance window AND
          6.0 cfs exceeds reach capacity 5.0); the pinned sub-order returns
          ERR_WINDOW_TIME_CONFLICT (temporal, priority 8) over
          ERR_REACH_CAPACITY_EXCEEDED (capacity, priority 9) — a different
          category pair than state-vs-fiscal.
        test_recipe:
          setup:
            - "Season OPEN announced 2.0; account 100.0 acres -> entitlement 200.00; reach max_capacity_cfs 5.0"
