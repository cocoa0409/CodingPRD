              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "r7", email: "r7@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t1", description: "d", vulnerability_class: "RCE" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep1: $.data.id }
            - call: "POST /api/reports/${rep1}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep1}/validate"
              payload: { impact: 9, exploitability: 8, affected_scope: 5 }
              as: Triager
            - call: "POST /api/remediation-tickets"
              payload: { report_id: "${rep1}", external_ref: "ENG-1" }
              as: ProgramAdmin
              captures: { tick1: $.data.id }
            - call: "POST /api/remediation-tickets/${tick1}/transition"
              payload: { action: "START" }
              as: ProgramAdmin
            - call: "POST /api/remediation-tickets/${tick1}/transition"
              payload: { action: "FIX" }
              as: ProgramAdmin
            - call: "POST /api/remediation-tickets/${tick1}/transition"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t2", description: "d", vulnerability_class: "SQLI" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep2: $.data.id }
            - call: "POST /api/reports/${rep2}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep2}/validate"
              payload: { impact: 8, exploitability: 7, affected_scope: 6 }
