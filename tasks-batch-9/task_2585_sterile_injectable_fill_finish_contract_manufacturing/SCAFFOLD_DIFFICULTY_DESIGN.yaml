            - "MediaFill MF-1 in FS-1, executed with units_filled 6000 and participating_operator_names ['OP-A', 'OP-B'], then read with contaminated_units 1 so its status is INVESTIGATION_REQUIRED and read_at is 2026-09-01T00:00:00Z."
            - "PersonnelQualification rows PENDING for OP-A (ASEPTIC_INTERVENTION, media_fill_id MF-1) and OP-Z (ASEPTIC_INTERVENTION, media_fill_id MF-1)."
          setup_api_calls:
