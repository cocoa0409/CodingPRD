          - validations.p15
        distinguishing_aspect: |
          ERR_INVALID_DATE_RANGE covers the whole ordering lattice of a
          conference envelope, not just end > start: an inverted event window,
          an abstract deadline after event start, a review deadline before the
          abstract deadline and a program freeze after event start each land on
          the same 422 code, while the canonical envelope is accepted. All four
          are refused at p15 before any row is written.
