            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${mlg_id}", component_role: "ENZYME", quantity_used: 10.0, expected_reagent_lot_version: "${rl_v}" }
              as: ProductionOperator
              captures: { err_role_mismatch: $.data.error_id }
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${mlg_id}", component_role: "ANTIBODY", quantity_used: 100.0, expected_reagent_lot_version: "${rl_v}" }
              as: ProductionOperator
              captures: { comp_id: $.data.id, comp_status: $.data.status }
