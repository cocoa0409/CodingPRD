            - "ViolationNotice.${n1}.delivered_at_utc is still \"2026-08-27T00:00:00Z\" and compliance_days is still 30: the extension does not re-derive the interval from scratch"
            - "GET /fire-district/violation-notices with parcel_id ${p1} still returns total_count == 1: no second notice or second interval is created"
