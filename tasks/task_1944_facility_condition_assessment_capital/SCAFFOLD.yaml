  - method: GET
    path: "/fca/facilities"
    description: List facilities, optionally filtered by client_id
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []
