            - "trigger 1 returns 409 ERR_NO_REMAN_PACK_AVAILABLE: refurb_soh_pct 84.99 < 85.00 empties the pool and NEW substitution is disabled"
            - "trigger 1 leaves WarrantyClaim.${claim_id}.adjudication_status == SUBMITTED and BatteryPack.${pack_below_id}.status == STOCK"
            - "after trigger 2: WarrantyProgram.${prog_id}.reman_available_count == 2 and reman_stock_state == AVAILABLE"
            - "trigger 3 returns 200: WarrantyClaim.${claim_id}.adjudication_status == APPROVED_PACK and replacement_pack_id == ${pack_edge_id}"
            - "BatteryPack.${pack_edge_id}.status == RESERVED  # 85.00 is INSIDE the floor"
