              as: ComplianceOfficer
            - call: POST /export-packets/${packet_id}/transition
              payload: { action: REJECT, rejection_reason: "valuation query" }
              as: ComplianceOfficer
            - call: POST /export-packets/${packet_id}/transition
              payload: { action: REOPEN }
              as: ComplianceOfficer
            - call: POST /export-packets/${packet_id}/transition
              payload: { action: ATTACH_TITLE, title_document_ref: TTL-3 }
              as: ComplianceOfficer
            - call: POST /export-packets/${packet_id}/transition
              payload: { action: FILE_CUSTOMS, customs_entry_ref: CBP-3 }
              as: ComplianceOfficer
            - call: POST /export-packets/${packet_id}/transition
              payload: { action: REJECT, rejection_reason: "third strike" }
              as: ComplianceOfficer
            - call: POST /export-packets/${packet_id}/transition
              payload: { action: REOPEN }
              as: ComplianceOfficer
              captures: { err_id: "$.data.error_id" }
          assert:
            - the first REOPEN returns 200 with status == "PREPARING", reopen_count == 1, title_document_ref is null and customs_entry_ref is null
            - the second REOPEN returns 200 with reopen_count == 2
            - the third REOPEN returns 422 with data.error_id == "ERR_MAX_PACKET_REOPENS_EXCEEDED"
            - after the refusal status == "CUSTOMS_REJECTED", reopen_count == 2, title_document_ref == "TTL-3" and customs_entry_ref == "CBP-3"

      - name: parallel_invoice_axes_move_independently
        claim_type: parallel_dimensions
        excluded_because:
          grounds: state_machines.Invoice (payment_status and release_status are independent axes)
          difficulty_instance: invoice_payment_axis_regresses_while_release_axis_holds
          rationale: >
            That §1.8 instance already drives payment_status backwards from PAID
            to PARTIALLY_PAID through a reversal while release_status stays at
            RELEASE_AUTHORIZED, which is exactly the independent-axes claim.

      - name: auction_close_cascades_down_to_every_assigned_lot
        claim_type: cascade_down
        excluded_because:
          grounds: endpoints[POST /auctions/{auction_id}/close]
          difficulty_instance: auction_close_fans_out_hammer_sale_invoice_and_counters
          rationale: >
            That §1.8 instance closes an auction holding one bid-carrying lot
            and one bidless lot and verifies the four declared cascade depths in
            one call, covering the cascade-down pattern end to end.

      - name: settlement_reversal_restores_every_derived_total
        claim_type: compensation
        excluded_because:
          grounds: state_machines.ConsignorSettlement.POSTED_to_REVERSED
          difficulty_instance: abandonment_cascades_invoice_sale_settlement_lot_consignment
          rationale: >
            That §1.8 instance reconciles advance_outstanding_cents and
            lifetime_net_proceeds_cents before and after the reversal, proving
            the compensating path leaves no drift.

      - name: deposit_ledger_stays_reconciled_across_holds_and_releases
        claim_type: ledger_sync
        excluded_because:
          grounds: entities.Bidder.fields.deposit_held_cents
          difficulty_instance: deposit_conservation_across_hold_cancel_and_decline
          rationale: >
            That §1.8 instance walks a hold, a cancellation and a credit decline
            while asserting deposit_available + deposit_held + forfeited equals
            deposit_total_cents at every step.

      - name: counteroffer_cycle_returns_the_sale_to_provisional
        claim_type: cyclic
        excluded_because:
          grounds: state_machines.Sale.CONSIGNOR_COUNTERED_to_PROVISIONAL
          difficulty_instance: sale_counteroffer_cycle_returns_to_provisional_then_no_sale_at_lap_limit
          rationale: >
            That §1.8 instance laps the counteroffer cycle three times and hits
            ERR_MAX_COUNTER_ROUNDS_EXCEEDED, covering both the loop-back edge
            and its termination condition.

