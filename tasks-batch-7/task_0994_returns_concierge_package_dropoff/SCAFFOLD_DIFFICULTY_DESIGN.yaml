# =============================================================================
# Task 994 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 3 instances = 27 instances (beyond-expert density).
# All times rely on the logical clock default 2026-05-01T00:00:00Z unless a
# /_clock/set_current_utc call appears in the chain.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: refund_provisional_vs_final_free_returns_divergence
        grounds:
          - calculations.refund_settlement
          - calculations.item_deduction_tiered
          - entities.ReturnOrder.fields.refund_estimate_cents
          - entities.ReturnOrder.fields.refund_final_cents
        distinguishing_aspect: |
          ReturnOrder domain: provisional estimate (declared condition, free_returns
          ignored) yields 9000 while final settlement (inspected condition,
          free_returns applied) yields 10000 for identical line data.
        test_recipe:
          setup:
            - "Plan P_FREE: free_returns=true, pickup_enabled=true, boxless_enabled=true, oversize_enabled=true, monthly 29900, included 200, overage 200, surcharges 1500/700; merchant M; OPEN cycle covering 2026-05-01; shopper S"
            - "Order O: HOME_PICKUP, one item qty=2 unit=5000 declared LIGHT_USE dim 40 weight 800 -> provisional estimate 9000"
            - "Order fulfilled via pickup path and item inspected LIGHT_USE"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 29900, included_returns: 200, overage_fee_cents: 200, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: true, oversize_surcharge_cents: 1500, pickup_fee_cents: 700 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Free", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin, captures: { bc_id: $.data.id } }
            - { call: "POST /v1/shoppers", payload: { email: "s1@x.com", full_name: "S One", postal_code: "10001" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "A", quantity: 2, unit_price_cents: 5000, declared_condition: LIGHT_USE, longest_side_cm: 40, weight_grams: 800 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id, ro_est: $.data.refund_estimate_cents } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "Z1", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { appt_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${appt_id}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${appt_id}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { item_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/return-items/${item_id}/inspect", payload: { condition: LIGHT_USE, note: "ok" }, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/refund-projection", payload: {}, as: PlatformAdmin, captures: { proj_final: $.data.final_cents, proj_payable: $.data.payable_cents, proj_status: $.data.refund_status } }
          assert:
            - "captured ro_est == 9000 (provisional: round_half_up(10000 * 0.10) = 1000 deducted; free_returns ignored)"
            - "ReturnOrder.${ro_id}.refund_final_cents == 10000 (final: free_returns waives LIGHT_USE deduction)"
            - "proj_final == 10000 and proj_payable == 10000 and proj_status == POSTED"
            - "ReturnOrder.${ro_id}.status == REFUND_POSTED"

      - name: billing_preview_vs_close_inflight_divergence
        grounds:
          - calculations.billing_cycle_charge
          - entities.BillingCycle.fields.in_flight_count
          - entities.BillingCycle.fields.total_cents
        distinguishing_aspect: |
          BillingCycle domain (different domain from the refund instance): the
          PROVISIONAL preview counts fulfilled + in-flight orders (4) while FINAL
          close counts fulfilled only (3); identical underlying data yields
          total_cents 190000 (preview) vs 150000 (close).
        test_recipe:
          setup:
            - "Plan P_B: monthly 100000, included 2, overage 50000, pickup true, boxless true, oversize true, free_returns false, surcharges 0/0; merchant MB; OPEN cycle [2026-04-01, 2026-07-01)"
            - "Three orders fulfilled to REFUND_POSTED via pickup path (item NEW unit 1000 qty 1); one further order left INITIATED (in-flight)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100000, included_returns: 2, overage_fee_cents: 50000, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Bill", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin, captures: { bc_id: $.data.id } }
            - { call: "POST /v1/shoppers", payload: { email: "sb@x.com", full_name: "S Bill", postal_code: "10002" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZB", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            # fulfilled order 1
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "B1", quantity: 1, unit_price_cents: 1000, declared_condition: NEW, longest_side_cm: 10, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro1}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap1: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap1}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap1}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro1}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro1}/items", payload: {}, as: PlatformAdmin, captures: { it1: "$.data[0].id" } }
            - { call: "POST /v1/return-items/${it1}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
            # fulfilled order 2
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "B2", quantity: 1, unit_price_cents: 1000, declared_condition: NEW, longest_side_cm: 10, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro2: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro2}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap2: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap2}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap2}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro2}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro2}/items", payload: {}, as: PlatformAdmin, captures: { it2: "$.data[0].id" } }
            - { call: "POST /v1/return-items/${it2}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
            # fulfilled order 3
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "B3", quantity: 1, unit_price_cents: 1000, declared_condition: NEW, longest_side_cm: 10, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro3: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro3}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap3: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap3}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap3}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro3}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro3}/items", payload: {}, as: PlatformAdmin, captures: { it3: "$.data[0].id" } }
            - { call: "POST /v1/return-items/${it3}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
            # in-flight order 4 (stays INITIATED)
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "B4", quantity: 1, unit_price_cents: 1000, declared_condition: NEW, longest_side_cm: 10, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro4: $.data.id } }
          trigger:
            - { call: "GET /v1/billing-cycles/${bc_id}/charge-preview", payload: {}, as: PlatformAdmin, captures: { prev_total: $.data.total_cents, prev_overage: $.data.overage_count, prev_variant: $.data.variant } }
            - { call: "POST /v1/billing-cycles/${bc_id}/close", payload: {}, as: PlatformAdmin, captures: { close_total: $.data.total_cents, close_overage: $.data.overage_count, close_gross: $.data.gross_cents } }
          assert:
            - "prev_variant == PROVISIONAL and prev_overage == 2 and prev_total == 190000 (counted 4 -> overage 2 -> fee 100000 -> gross 200000 -> 5% discount 10000)"
            - "close_overage == 1 and close_gross == 150000 and close_total == 150000 (counted 3 -> overage 1 -> fee 50000 -> gross 150000 -> no discount)"
            - "BillingCycle.${bc_id}.status == CLOSING"

      - name: zone_load_confirmed_vs_demand_projection_divergence
        grounds:
          - calculations.zone_window_load
          - entities.CourierZone.fields.confirmed_load
          - entities.CourierZone.fields.demand_load
        distinguishing_aspect: |
          CourierZone domain (third distinct domain): with two SCHEDULED and one
          retryable FAILED appointment overlapping the clock instant,
          confirmed_load == 2 while demand_load == 3 for identical zone data.
        test_recipe:
          setup:
            - "Plan with pickup_enabled=true; merchant MC; OPEN cycle; shopper SC; zone ZC capacity 5"
            - "Three HOME_PICKUP orders with appointments overlapping 2026-05-01T01:00:00Z; appointment A3 driven EN_ROUTE -> FAILED (attempt_count 1)"
            - "Clock set to 2026-05-01T01:00:00Z (inside all three windows)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Zone", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sz@x.com", full_name: "S Zone", postal_code: "10003" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZC", window_capacity: 5 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "Z1", quantity: 1, unit_price_cents: 500, declared_condition: NEW, longest_side_cm: 10, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { zro1: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${zro1}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "Z2", quantity: 1, unit_price_cents: 500, declared_condition: NEW, longest_side_cm: 10, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { zro2: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${zro2}", zone_id: "${zone_id}", window_start: "2026-05-01T01:00:00Z", window_end: "2026-05-01T03:00:00Z" }, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "Z3", quantity: 1, unit_price_cents: 500, declared_condition: NEW, longest_side_cm: 10, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { zro3: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${zro3}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T01:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap3: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap3}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap3}/fail", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T01:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /v1/courier-zones/${zone_id}", payload: {}, as: PlatformAdmin, captures: { z_conf: $.data.confirmed_load, z_dem: $.data.demand_load } }
          assert:
            - "z_conf == 2 (SCHEDULED appointments 1 and 2 only; FAILED excluded)"
            - "z_dem == 3 (adds the FAILED appointment with attempt_count 1 < 3)"
            - "z_dem - z_conf == 1 (divergence on identical underlying appointment rows)"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: item_deduction_condition_tier_plan_flag_interplay
        grounds:
          - calculations.item_deduction_tiered
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: condition tier
          (DAMAGED vs DEFECTIVE) x plan free_returns flag x the DAMAGED-never-waived
          override produce deduction 2000 on line A and 0 on line B (final 4500).
        test_recipe:
          setup:
            - "Plan free_returns=true, pickup true; merchant; OPEN cycle; shopper"
            - "Order with items A (unit 4000 qty 1 declared NEW, will inspect DAMAGED) and B (unit 2500 qty 1 declared LIGHT_USE, will inspect DEFECTIVE); fulfilled to INSPECTING via pickup path"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: true, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Tier", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "st@x.com", full_name: "S Tier", postal_code: "10004" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZT", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "TA", quantity: 1, unit_price_cents: 4000, declared_condition: NEW, longest_side_cm: 20, weight_grams: 200 }, { sku: "TB", quantity: 1, unit_price_cents: 2500, declared_condition: LIGHT_USE, longest_side_cm: 20, weight_grams: 200 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it_a: "$.data[0].id", it_b: "$.data[1].id" } }
          trigger:
            - { call: "POST /v1/return-items/${it_a}/inspect", payload: { condition: DAMAGED }, as: PlatformAdmin }
            - { call: "POST /v1/return-items/${it_b}/inspect", payload: { condition: DEFECTIVE }, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}", payload: {}, as: PlatformAdmin, captures: { ro_final: $.data.refund_final_cents, ro_status: $.data.status } }
          assert:
            - "ReturnItem.${it_a}.deduction_cents == 2000 (DAMAGED: 50% of 4000, never waived by free_returns)"
            - "ReturnItem.${it_b}.deduction_cents == 0 (DEFECTIVE: 0% tier)"
            - "ro_final == 4500 and ro_status == REFUND_POSTED"

      - name: refund_per_line_rounding_then_sum_pinned
        grounds:
          - calculations.refund_settlement
          - calculations.item_deduction_tiered
        distinguishing_aspect: |
          Mode (b) — nested rounding order: two lines of 3333 cents at LIGHT_USE 10%
          round per line (333 + 333 = 666 deduction -> refund 6000); the forbidden
          sum-then-round order would give 667 -> 5999. The scaffold pins per-line.
        test_recipe:
          setup:
            - "Plan free_returns=false, pickup true; merchant; OPEN cycle; shopper"
            - "Order with two items, each unit_price_cents 3333 qty 1 declared NEW; fulfilled to INSPECTING; both inspected LIGHT_USE"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Round", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sr@x.com", full_name: "S Round", postal_code: "10005" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZR", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "R1", quantity: 1, unit_price_cents: 3333, declared_condition: NEW, longest_side_cm: 15, weight_grams: 100 }, { sku: "R2", quantity: 1, unit_price_cents: 3333, declared_condition: NEW, longest_side_cm: 15, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it_1: "$.data[0].id", it_2: "$.data[1].id" } }
          trigger:
            - { call: "POST /v1/return-items/${it_1}/inspect", payload: { condition: LIGHT_USE }, as: PlatformAdmin }
            - { call: "POST /v1/return-items/${it_2}/inspect", payload: { condition: LIGHT_USE }, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/refund-projection", payload: {}, as: PlatformAdmin, captures: { proj_final: $.data.final_cents } }
          assert:
            - "ReturnItem.${it_1}.deduction_cents == 333 (round_half_up(3333 * 0.10))"
            - "ReturnItem.${it_2}.deduction_cents == 333"
            - "proj_final == 6000 (per-line-then-sum; sum-then-round would yield 5999)"

      - name: billing_discount_tier_evaluated_on_gross_pinned
        grounds:
          - calculations.billing_cycle_charge
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned: discount tier is keyed on
          gross (base + overage + surcharge) BEFORE discount; with gross exactly
          200000 the 5% tier applies, discount 10000, total 190000. Evaluating the
          tier on net would be ill-defined; the pinned order fixes the value.
        test_recipe:
