# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 claims not covered by §1.8.
# excluded_because stubs cite §1.8 instance names verbatim.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_owner_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Owner
          - endpoints.POST_/owners
        distinguishing_aspect: "POST /owners with full_name+email returns 201; id, version=1, status=ACTIVE, deposit_held_cents=0, account_balance_cents=0, standing_score=0 all system-set."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /owners"
              payload: { full_name: "Zoe Rider", email: "zoe@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Owner.${own_id}.version == 1"
            - "Owner.${own_id}.status == ACTIVE"
            - "Owner.${own_id}.deposit_held_cents == 0"
            - "Owner.${own_id}.account_balance_cents == 0"
            - "Owner.${own_id}.standing_score == 0"

      - name: create_horse_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Horse.fields.name
          - endpoints.POST_/horses
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /horses omitting required 'name' returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["owner exists"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Amy Rider", email: "amy2@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
          trigger:
            - call: "POST /horses"
              payload: { owner_id: "${own_id}" }
              as: BarnManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_horse_unknown_owner_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Horse.fields.owner_id
          - validations[priority=5]
          - errors[ERR_OWNER_NOT_FOUND]
        distinguishing_aspect: "POST /horses with a non-existent owner_id returns ERR_OWNER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /horses"
              payload: { owner_id: "00000000-0000-0000-0000-000000000000", name: "Ghost" }
              as: BarnManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_OWNER_NOT_FOUND"

      - name: get_owner_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Owner
          - endpoints.GET_/owners/{id}
          - errors[ERR_OWNER_NOT_FOUND]
        distinguishing_aspect: "GET /owners/{id} on a random UUID returns ERR_OWNER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /owners/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BarnManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_OWNER_NOT_FOUND"

      - name: create_stall_pasture_capacity_two_succeeds
        claim_type: Type Constraints
        grounds:
          - entities.Stall.fields.kind
          - entities.Stall.fields.capacity
          - endpoints.POST_/stalls
        distinguishing_aspect: "POST /stalls kind=PASTURE capacity=2 succeeds (PASTURE allows capacity>=1), occupied_count initialized 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stalls"
              payload: { label: "PX", kind: "PASTURE", capacity: 2, daily_rate_cents: 1000 }
              as: BarnManager
              captures: { pid: $.data.id }
          assert:
            - "response.status == 201"
            - "Stall.${pid}.occupied_count == 0"
            - "Stall.${pid}.capacity == 2"

      - name: stall_kind_capacity_two_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Stall.fields.capacity
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /stalls kind=STALL capacity=2 violates the STALL-capacity==1 rule and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stalls"
              payload: { label: "SX", kind: "STALL", capacity: 2, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: computed_charge_fields_default_zero_on_draft
        claim_type: Computed Fields
        grounds:
          - entities.BoardingAgreement.fields.provisional_charge_cents
          - entities.BoardingAgreement.fields.final_charge_cents
        distinguishing_aspect: "A freshly-created DRAFT agreement has provisional_charge_cents and final_charge_cents both 0 (computed, input ignored)."
        test_recipe:
          setup: ["owner+horse+stall exist"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Cal Rider", email: "cal@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /stalls"
              payload: { label: "DR-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Drift" }
              as: BarnManager
              captures: { horse_id: $.data.id }
          trigger:
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
          assert:
            - "BoardingAgreement.${ba_id}.status == DRAFT"
            - "BoardingAgreement.${ba_id}.provisional_charge_cents == 0"
            - "BoardingAgreement.${ba_id}.final_charge_cents == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sign_already_signed_waiver_returns_not_signable
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LiabilityWaiver.PENDING_to_SIGNED
          - errors[ERR_WAIVER_NOT_SIGNABLE]
        distinguishing_aspect: "Signing a waiver already SIGNED (not PENDING/EXPIRED) returns ERR_WAIVER_NOT_SIGNABLE (409); no side effects."
        test_recipe:
          setup: ["owner with a SIGNED waiver"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Eli Rider", email: "eli@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
          trigger:
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_WAIVER_NOT_SIGNABLE"

      - name: lesson_completed_then_cancel_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Lesson.SCHEDULED_to_COMPLETED
          - state_machines.Lesson.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A COMPLETED (terminal) lesson cannot be CANCELLED; the transition returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["owner+horse with ACTIVE boarding; one COMPLETED lesson"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Fen Rider", email: "fen@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "L-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Fable" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /lessons"
              payload: { horse_id: "${horse_id}", instructor_name: "Pat", lesson_fee_cents: 8000, starts_at: "2026-06-02T10:00:00.000Z", ends_at: "2026-06-02T11:00:00.000Z" }
              as: BarnManager
              captures: { les_id: $.data.id }
            - call: "POST /lessons/${les_id}/transition"
              payload: { target_status: "COMPLETED" }
              as: Instructor
          trigger:
            - call: "POST /lessons/${les_id}/transition"
              payload: { target_status: "CANCELLED" }
              as: BarnManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Lesson.${les_id}.status == COMPLETED"

      - name: lesson_completed_full_fee_branch
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Lesson.SCHEDULED_to_COMPLETED
          - calculations.lesson_fee
          - entities.Lesson.fields.billed_fee_cents
        distinguishing_aspect: "Completing a lesson sets billed_fee_cents to the full lesson_fee_cents (8000), the COMPLETED branch."
        test_recipe:
          setup: ["owner+horse with ACTIVE boarding; one SCHEDULED lesson fee 8000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Gia Rider", email: "gia@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "M-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Gem" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /lessons"
              payload: { horse_id: "${horse_id}", instructor_name: "Pat", lesson_fee_cents: 8000, starts_at: "2026-06-02T10:00:00.000Z", ends_at: "2026-06-02T11:00:00.000Z" }
              as: BarnManager
              captures: { les_id: $.data.id }
          trigger:
            - call: "POST /lessons/${les_id}/transition"
              payload: { target_status: "COMPLETED" }
              as: Instructor
              captures: { st: $.data.status }
          assert:
            - "Lesson.${les_id}.status == COMPLETED"
            - "Lesson.${les_id}.billed_fee_cents == 8000"

      - name: show_entry_scratched_keeps_fee_billable
        claim_type: Valid Transition
        grounds:
          - state_machines.ShowEntry.SUBMITTED_to_CONFIRMED
          - state_machines.ShowEntry.CONFIRMED_to_SCRATCHED
          - entities.ShowEntry.fields.status
        distinguishing_aspect: "A CONFIRMED show entry can be SCRATCHED (remains terminal SCRATCHED, fee still billable)."
        test_recipe:
          setup: ["owner with SIGNED waiver; horse; CONFIRMED show entry"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Hana Rider", email: "hana@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Hero" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /show-entries"
              payload: { horse_id: "${horse_id}", event_name: "Gala", event_date: "2026-07-01T00:00:00.000Z", entry_fee_cents: 5000 }
              as: BarnManager
              captures: { se_id: $.data.id }
            - call: "POST /show-entries/${se_id}/transition"
              payload: { target_status: "CONFIRMED" }
              as: BarnManager
          trigger:
            - call: "POST /show-entries/${se_id}/transition"
              payload: { target_status: "SCRATCHED" }
              as: BarnManager
              captures: { st: $.data.status }
          assert:
            - "ShowEntry.${se_id}.status == SCRATCHED"

      - name: service_visit_cancel_releases_window_allows_reschedule
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_CANCELLED
          - state_machines.ServiceVisit.REQUESTED_to_SCHEDULED
        distinguishing_aspect: "Cancelling a SCHEDULED visit frees the horse's window so a previously-overlapping visit can then be SCHEDULED successfully."
        test_recipe:
          setup: ["horse with a SCHEDULED visit [09:00,10:00) and a REQUESTED overlapping visit at 09:30; first is cancelled"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Ivo Rider", email: "ivo@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Iris" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /service-visits"
              payload: { horse_id: "${horse_id}", visit_type: "FARRIER", scheduled_at: "2026-06-05T09:00:00.000Z", duration_minutes: 60, fee_cents: 12000 }
              as: BarnManager
              captures: { sv1: $.data.id }
            - call: "POST /service-visits/${sv1}/transition"
              payload: { target_status: "SCHEDULED" }
              as: BarnManager
            - call: "POST /service-visits"
              payload: { horse_id: "${horse_id}", visit_type: "VET", scheduled_at: "2026-06-05T09:30:00.000Z", duration_minutes: 60, fee_cents: 20000 }
              as: BarnManager
              captures: { sv2: $.data.id }
            - call: "POST /service-visits/${sv1}/transition"
              payload: { target_status: "CANCELLED" }
              as: BarnManager
          trigger:
            - call: "POST /service-visits/${sv2}/transition"
              payload: { target_status: "SCHEDULED" }
              as: BarnManager
              captures: { st: $.data.status }
          assert:
            - "ServiceVisit.${sv1}.status == CANCELLED"
            - "ServiceVisit.${sv2}.status == SCHEDULED"

      - name: stall_full_blocks_second_activation
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.BoardingAgreement.DRAFT_to_ACTIVE
          - validations[priority=13]
          - errors[ERR_STALL_FULL]
          - entities.Stall.fields.occupied_count
        distinguishing_aspect: "With a capacity-1 STALL already occupied (occupied_count==1), activating a second agreement on it returns ERR_STALL_FULL (409)."
        test_recipe:
          setup: ["one ACTIVE agreement on a cap-1 stall; a second DRAFT agreement on the same stall for a second horse of the same owner"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Jed Rider", email: "jed@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "N-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Juno2" }
              as: BarnManager
              captures: { h1: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Kilo" }
              as: BarnManager
              captures: { h2: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${h1}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba1: $.data.id }
            - call: "POST /boarding-agreements/${ba1}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${h2}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba2: $.data.id }
          trigger:
            - call: "POST /boarding-agreements/${ba2}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STALL_FULL"
            - "BoardingAgreement.${ba2}.status == DRAFT"

      - name: waiver_supersede_marks_old_superseded
        claim_type: Side Effect Execution
        grounds:
          - state_machines.LiabilityWaiver.SIGNED_to_SUPERSEDED
          - entities.LiabilityWaiver.fields.superseded_by_id
        distinguishing_aspect: "Creating a new waiver for an owner who already has a SIGNED waiver flips the old one to SUPERSEDED with superseded_by_id set to the new waiver's id."
        test_recipe:
          setup: ["owner with a SIGNED waiver; a second waiver created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Kim Rider", email: "kim@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_old: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_old}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
          trigger:
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_new: $.data.id }
            - call: "GET /owners/${own_id}/waivers"
              payload: {}
              as: BarnManager
          assert:
            - "LiabilityWaiver.${wv_old}.status == SUPERSEDED"
            - "LiabilityWaiver.${wv_old}.superseded_by_id == ${wv_new}"

      - name: error_boarding_not_active_on_turnout
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_BOARDING_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / boarding_activation_requires_signed_waiver"
          rationale: "ERR_BOARDING_NOT_ACTIVE is the same cross-entity-state family as the boarding/lesson gating already probed; the turnout variant is a direct sibling of the §1.8 boarding-state dependency."

  # ===========================================================================
  - section: calculations
    instances:
      - name: lesson_no_show_half_fee_even_cents
        claim_type: Correct Result
        grounds:
          - calculations.lesson_fee
          - state_machines.Lesson.SCHEDULED_to_NO_SHOW
          - entities.Lesson.fields.billed_fee_cents
        distinguishing_aspect: "A NO_SHOW on a fee-8000 lesson bills round_half_up(8000*0.5)=4000 (even-cents case, no rounding ambiguity)."
        test_recipe:
          setup: ["owner+horse with ACTIVE boarding; one SCHEDULED lesson fee 8000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Lia Rider", email: "lia@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "O-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Lux" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
