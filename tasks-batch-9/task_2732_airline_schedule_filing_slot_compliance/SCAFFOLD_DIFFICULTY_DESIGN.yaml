      - name: open_obligation_count_is_conserved_across_create_then_dispatch
        grounds:
          - state_machines.PassengerNotificationObligation.PENDING_to_DISPATCHED
          - calculations.notification_compensation_cents
          - entities.FlightLeg.fields.open_obligation_count
          - endpoints.POST_flight_legs_booking_snapshot
        distinguishing_aspect: |
          A third kind of conserved quantity — an outstanding-obligation counter, neither money nor an
          allocation. Pinned invariant: FlightLeg.open_obligation_count == COUNT of
          PassengerNotificationObligation rows for that leg whose status is PENDING. Creating the
          obligation raises it 0 -> 1 and dispatching it lowers it back to exactly 0, while the
          obligation row itself stays in the database with its compensation frozen at 561132 cents. An
          implementation that counts all obligations regardless of status, or that deletes rows instead
          of transitioning them, cannot satisfy both halves.
