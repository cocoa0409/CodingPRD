              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 2018, market_value_usd: 320000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 70000.00, proposed_lowest_floor_elevation_ft: 20.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /floodplain/permits/${permit_id}/submit"
