# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task: task_3147_reverse_marketplace_nurse_hiring_employer_application_flow
#
# Depth probe: 2 instances per Difficulty Rule (§0.5), each grounded in
# SCAFFOLD.yaml §1.1–§1.7 and transcribable verbatim by the unit-test-generator.
# Clock default: 2026-09-01T00:00:00Z before any set_current_utc call.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: placement_fee_provisional_vs_guarantee_refund
        grounds:
          - calculations.placement_fee_rule
          - state_machines.Placement.GUARANTEE_ACTIVE_to_TERMINATED_IN_GUARANTEE
          - entities.Invoice.fields.amount_credited_cents
          - entities.Employer.fields.credit_balance_cents
        distinguishing_aspect: |
          Two variants of the same placement fee produce different observable
          amounts for identical fee inputs: PROVISIONAL bills the full
          3,536,000 cents at acceptance; GUARANTEE_REFUND later credits
          2,652,000 cents back for the same invoice when the placement is
          terminated 15 days into a 60-day guarantee — Invoice.amount_due_cents
          stays 3536000 while amount_credited_cents becomes 2652000 and the
          invoice lands in PARTIALLY_CREDITED, not SETTLED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "PER_PLACEMENT employer (bps 2000, guarantee 60 days) with an OPEN ICU requisition (openings_total 2, shift DAY, rate 8000)."
            - "ACTIVE nurse (ICU, CA, DAY) with a VERIFIED license; application interviewed; screening COMPLETE; SIGNED_CONTRACT document APPROVED; offer ISSUED at 8500 cents/hr with start_date 2026-09-15."
          setup_api_calls:
            - &clock0
              call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &emp_pp
              call: "POST /marketplace/employers"
              payload: { legal_name: "Bayview Medical", facility_state: "CA", fee_model: "PER_PLACEMENT", subscription_tier: "BASIC", sla_response_hours: 48, guarantee_days: 60, placement_fee_bps: 2000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - &nurse_icu
              call: "POST /marketplace/nurses"
              payload: { full_name: "Nora Icu", email: "nora@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 8, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-nora"
              captures: { nurse_id: $.data.id, nurse_v: $.data.version }
            - &lic_nora
              call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_id}", license_number: "RN-CA-100", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { lic_id: $.data.id }
            - &submit_nora
              call: "POST /marketplace/nurses/${nurse_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
            - &verify_nora
              call: "POST /marketplace/license-verifications/${lic_id}/verify"
              payload: {}
              as: PlatformAdmin
            - &req_icu
              call: "POST /marketplace/requisitions"
              payload: { employer_id: "${emp_id}", specialty: "ICU", unit_name: "ICU-4West", required_certs: [], facility_state: "CA", distance_from_facility_miles: 20, shift: "DAY", offered_hourly_rate_cents: 8000, openings_total: 2 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - &app_icu
              call: "POST /marketplace/applications"
              payload: { requisition_id: "${req_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 8500, proposed_shift: "DAY", expected_nurse_version: "${nurse_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { app_id: $.data.id }
            - &review_nora
              call: "POST /marketplace/applications/${app_id}/review"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
            - &iv_nora
              call: "POST /marketplace/applications/${app_id}/interviews"
              payload: { starts_at: "2026-09-02T10:00:00Z", ends_at: "2026-09-02T11:00:00Z" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { iv_id: $.data.id }
            - &clock_iv_done
              call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - &iv_complete
              call: "POST /marketplace/interviews/${iv_id}/complete"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - &scr_open
              call: "POST /marketplace/screenings"
              payload: { application_id: "${app_id}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { scr_id: $.data.id }
            - &scr_cred
              call: "POST /marketplace/screenings/${scr_id}/verify-credentials"
              payload: {}
              as: PlatformAdmin
            - &scr_bg
              call: "POST /marketplace/screenings/${scr_id}/clear-background"
              payload: {}
              as: PlatformAdmin
            - &doc_sign
              call: "POST /marketplace/onboarding-documents"
              payload: { application_id: "${app_id}", doc_type: "SIGNED_CONTRACT" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { doc_id: $.data.id }
            - &doc_ok
              call: "POST /marketplace/onboarding-documents/${doc_id}/approve"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - &offer_issue
              call: "POST /marketplace/applications/${app_id}/offers"
              payload: { offered_hourly_rate_cents: 8500, start_date: "2026-09-15", expected_requisition_version: "${req_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { offer_id: $.data.id }
            - &offer_accept
              call: "POST /marketplace/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { placement_id: $.data.id }
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/placements/${placement_id}/terminate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "Invoice for placement ${placement_id}: amount_due_cents == 3536000 (PROVISIONAL: round_half_up(8500*2080*2000/10000))"
            - "after terminate at 2026-09-30 (15 days served of 60): Invoice.amount_credited_cents == 2652000 (GUARANTEE_REFUND: round_half_up(3536000*45/60))"
            - "Invoice.status == PARTIALLY_CREDITED"
            - "Employer.${emp_id}.credit_balance_cents == 2652000"
            - "Placement.${placement_id}.status == TERMINATED_IN_GUARANTEE"

      - name: match_score_base_vs_strict_cert_pool
        grounds:
          - calculations.match_score_rule
          - entities.Match.fields.match_score
          - entities.Match.fields.suppressed
        distinguishing_aspect: |
          The dual variant operates on the Match entity domain (not the fee
          domain): with an empty required_certs the BASE variant keeps a
          cert-less nurse in the pool at score 65, while the STRICT variant —
          engaged the moment required_certs is non-empty — EXCLUDES the same
          nurse from the pool entirely rather than penalizing by 20, so the
          same nurse data yields a present 65-point Match row in one context
          and zero Match rows in the other.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE ICU nurse in CA: 8 years experience, desired_shift DAY, max_commute_miles 40, NO certifications."
            - "Two requisitions from one employer, identical except required_certs: R1 (no certs) and R2 (required_certs [CCRN])."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - call: "POST /marketplace/requisitions"
              payload: { employer_id: "${emp_id}", specialty: "ICU", unit_name: "ICU-5East", required_certs: ["CCRN"], facility_state: "CA", distance_from_facility_miles: 20, shift: "DAY", offered_hourly_rate_cents: 8000, openings_total: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { req2_id: $.data.id }
          trigger:
            - call: "POST /marketplace/requisitions/${req_id}/generate-matches"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /marketplace/requisitions/${req2_id}/generate-matches"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "GET /marketplace/requisitions/${req_id}/matches returns exactly 1 row: Match(nurse ${nurse_id}).match_score == 95 (40 geo + 25*min(8,10)/10=20 exp + 20 shift-exact + 15 commute + 0 cert penalty)"
            - "GET /marketplace/requisitions/${req2_id}/matches returns 0 rows (STRICT variant excludes the CCRN-less nurse rather than scoring 95-20=75)"
            - "the two requisitions differ only in required_certs — identical nurse data yields a row vs no row"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: match_score_multi_input_nonlinear
        grounds:
          - calculations.match_score_rule
          - entities.Nurse.fields.years_experience
          - entities.Nurse.fields.desired_shift
        distinguishing_aspect: |
          Mode (a): the score has 5 inputs with non-linear interaction — the
          experience term is capped by min(years,10)/10 and the shift term
          branches on a ROTATING partial-credit conditional; a ROTATING
          nurse earns the 10-point partial credit against a DAY requisition
          while a NIGHT nurse earns 0 against the same requisition, and a
          14-year nurse earns no more than a 10-year nurse (cap saturation).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Three ACTIVE ICU nurses, all CA, max_commute 40: A (8y, DAY), B (14y, ROTATING), C (14y, NIGHT)."
            - "One OPEN ICU requisition: shift DAY, no required certs, CA, distance 20."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - call: "POST /marketplace/nurses"
              payload: { full_name: "Bea Rot", email: "bea@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 14, desired_shift: "ROTATING", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-bea"
              captures: { nurse_b_id: $.data.id }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_b_id}", license_number: "RN-CA-200", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${nurse_b_id}"
              captures: { lic_b_id: $.data.id }
            - call: "POST /marketplace/nurses/${nurse_b_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_b_id}"
            - call: "POST /marketplace/license-verifications/${lic_b_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/nurses"
              payload: { full_name: "Cid Night", email: "cid@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 14, desired_shift: "NIGHT", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-cid"
              captures: { nurse_c_id: $.data.id }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_c_id}", license_number: "RN-CA-300", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${nurse_c_id}"
              captures: { lic_c_id: $.data.id }
            - call: "POST /marketplace/nurses/${nurse_c_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_c_id}"
            - call: "POST /marketplace/license-verifications/${lic_c_id}/verify"
              payload: {}
              as: PlatformAdmin
            - *req_icu
            - call: "POST /marketplace/requisitions/${req_id}/generate-matches"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /marketplace/requisitions/${req_id}/matches"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "nurse A (${nurse_id}) match_score == 95 (40 geo + 25*min(8,10)/10=20 + 20 shift-exact + 15 commute)"
            - "nurse B (${nurse_b_id}) match_score == 90 (40 + 25*min(14,10)/10=25 + 10 ROTATING-partial + 15)"
            - "nurse C (${nurse_c_id}) match_score == 80 (40 + 25 + 0 shift: NIGHT vs DAY earns no partial credit + 15)"
            - "ranked order is A(95), B(90), C(80) by match_score DESC"
            - "the 14-year nurses earn the same 25-point experience term a 10-year nurse would (cap saturation)"

      - name: guarantee_refund_rounding_order_pinned
        grounds:
          - calculations.placement_fee_rule
          - entities.Invoice.fields.amount_credited_cents
        distinguishing_aspect: |
          Mode (b): nested rounding — the refund rounds the final quotient
          round_half_up(amount_due * numerator / guarantee_days) ONCE; rounding
          the intermediate fraction first is forbidden. With fee 3,536,000 and
          15 days served of 60 the pinned order yields exactly 2,652,000 cents;
          the assertion locks this literal so an implementation that rounds the
          fraction to a shorter precision first cannot silently agree.
        test_recipe:
          setup:
            - "Identical setup to placement_fee_provisional_vs_guarantee_refund: PER_PLACEMENT fee 3536000 issued at acceptance; clock advanced to 2026-09-30 (15 days into a 60-day guarantee starting 2026-09-15)."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - *app_icu
            - *review_nora
            - *iv_nora
            - *clock_iv_done
            - *iv_complete
            - *scr_open
            - *scr_cred
            - *scr_bg
            - *doc_sign
            - *doc_ok
            - *offer_issue
            - *offer_accept
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/placements/${placement_id}/terminate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "Invoice.amount_credited_cents == 2652000 exactly — round_half_up(3536000 * 45 / 60) computed as a single rounding of the quotient"
            - "Invoice.amount_due_cents remains 3536000 (the provisional bill is never rewritten; only the credit accumulates)"
            - "Invoice.status == PARTIALLY_CREDITED because 2652000 < 3536000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_counter_cycle_with_single_deadline_extension
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_UNDER_REVIEW
          - calculations.response_deadline_rule
          - entities.Application.fields.revision_count
          - entities.Application.fields.deadline_extended
        distinguishing_aspect: |
          Cyclic shape on Application: UNDER_REVIEW loops back to UNDER_REVIEW
          via counter (up to revision_count 2), and the cycle carries a
          once-only side effect — the FIRST counter extends
          response_deadline_at by 48h and flips deadline_extended, the SECOND
          counter leaves the deadline unchanged, and a THIRD counter is
          rejected ERR_TERMS_MISMATCH.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Application created 2026-09-01T00:00:00Z with deadline 2026-09-04T00:00:00Z; nurse moved it to UNDER_REVIEW."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - *app_icu
            - *review_nora
          trigger:
            - call: "POST /marketplace/applications/${app_id}/counter"
              payload: { proposed_hourly_rate_cents: 8700 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /marketplace/applications/${app_id}/counter"
              payload: { proposed_hourly_rate_cents: 9000 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /marketplace/applications/${app_id}/counter"
              payload: { proposed_hourly_rate_cents: 9100 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "after first counter: Application.revision_count == 1 and response_deadline_at == 2026-09-06T00:00:00Z (+48h once)"
            - "after second counter: Application.revision_count == 2 and response_deadline_at STILL == 2026-09-06T00:00:00Z and deadline_extended == true"
            - "third counter: err3 == ERR_TERMS_MISMATCH (revision cap 2)"
            - "application status remains UNDER_REVIEW throughout the loop"

      - name: screening_parallel_axes_compound_overall
        grounds:
          - state_machines.Screening
          - entities.Screening.fields.overall_status
          - entities.Screening.fields.credential_status
          - entities.Screening.fields.background_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity (Screening): the credential
          axis and the background axis evolve independently, and the compound
          overall_status is derived from the PAIR — clearing background first
          leaves overall IN_PROGRESS, verifying credentials second flips it to
          COMPLETE; failing the credential axis after the background cleared
          still yields BLOCKED (order-independence of the derivation).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Application in UNDER_REVIEW; Screening opened (PENDING/PENDING)."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - *app_icu
            - *review_nora
            - *scr_open
          trigger:
            - call: "POST /marketplace/screenings/${scr_id}/clear-background"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/screenings/${scr_id}/verify-credentials"
              payload: {}
              as: PlatformAdmin
          assert:
            - "after clear-background alone: Screening.background_status == CLEARED, credential_status == PENDING, overall_status == IN_PROGRESS"
            - "after verify-credentials: Screening.credential_status == VERIFIED and overall_status == COMPLETE"
            - "the two axes moved independently — overall flipped only when BOTH reached their positive terminal"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: offer_accept_fill_cascade_three_hops
        grounds:
          - state_machines.Offer.ISSUED_to_ACCEPTED
          - state_machines.Requisition.OPEN_to_FILLED
          - state_machines.Nurse.ACTIVE_to_HIRED
          - calculations.openings_conservation_rule
        distinguishing_aspect: |
          Depth-3 transitive cascade: accepting the offer (link 1) creates the
          Placement and bumps requisition.openings_filled to openings_total
          (link 2), whose mutation itself transitions the requisition
          OPEN->FILLED, which itself cascades the OTHER live application on
          the same requisition to WITHDRAWN and its SCHEDULED interview to
          CANCELLED (link 3) — each hop caused by the previous hop, not by the
          original accept.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PER_PLACEMENT employer; requisition openings_total == 1."
            - "Nurse A fully cleared with an ISSUED offer (rate 8500, start 2026-09-15)."
            - "Nurse B (also ACTIVE ICU) has a second application on the SAME requisition in INTERVIEWING with a SCHEDULED interview on 2026-09-03."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - call: "POST /marketplace/nurses"
              payload: { full_name: "Bree Two", email: "bree@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 5, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-bree"
              captures: { nurse_b_id: $.data.id, nurse_b_v: $.data.version }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_b_id}", license_number: "RN-CA-201", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${nurse_b_id}"
              captures: { lic_b_id: $.data.id }
            - call: "POST /marketplace/nurses/${nurse_b_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_b_id}"
            - call: "POST /marketplace/license-verifications/${lic_b_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/requisitions"
              payload: { employer_id: "${emp_id}", specialty: "ICU", unit_name: "ICU-4West", required_certs: [], facility_state: "CA", distance_from_facility_miles: 20, shift: "DAY", offered_hourly_rate_cents: 8000, openings_total: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { req1_id: $.data.id, req1_v: $.data.version }
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req1_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 8500, proposed_shift: "DAY", expected_nurse_version: "${nurse_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /marketplace/applications/${app_a_id}/review"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
            - call: "POST /marketplace/applications/${app_a_id}/interviews"
              payload: { starts_at: "2026-09-02T10:00:00Z", ends_at: "2026-09-02T11:00:00Z" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { iv_a_id: $.data.id }
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/interviews/${iv_a_id}/complete"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /marketplace/screenings"
              payload: { application_id: "${app_a_id}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { scr_a_id: $.data.id }
            - call: "POST /marketplace/screenings/${scr_a_id}/verify-credentials"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/screenings/${scr_a_id}/clear-background"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/onboarding-documents"
              payload: { application_id: "${app_a_id}", doc_type: "SIGNED_CONTRACT" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { doc_a_id: $.data.id }
            - call: "POST /marketplace/onboarding-documents/${doc_a_id}/approve"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req1_id}", nurse_id: "${nurse_b_id}", proposed_hourly_rate_cents: 8200, proposed_shift: "DAY", expected_nurse_version: "${nurse_b_v}" }
              as: Employer
