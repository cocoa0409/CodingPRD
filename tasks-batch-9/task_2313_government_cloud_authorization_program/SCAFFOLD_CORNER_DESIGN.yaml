        not nulls awaiting a later read'
      - the decision response already carries letter_reference (${letter}) and status 'AUTHORIZED' (${pkg_status}) minted
        in the same call
      - 'the cascade is queryable immediately: GET /authorizations?offering_id=${offering_id} returns total_count == 1 with
        authorization_status ''AUTHORIZED'' (${auth_status}) on the first attempt'
      - 'the first monitoring period is queryable immediately: total_count == 1 with period_month ''2026-03'' (${period_month})
