      - name: free_page_allowance_boundary_at_twenty_and_twenty_one_pages
        grounds:
          - calculations.records_request_fee_assessment
          - entities.PublicRecordsRequest.fields.total_assessed_cents
          - entities.PublicRecordsRequest.fields.fee_status
        distinguishing_aspect: |
          FREE_PAGE_ALLOWANCE is 20 inclusive: an ACTUAL_COST assessment of a
          single PAPER line with 20 pages and zero staff minutes totals exactly
          0 cents (and the request still becomes ASSESSED), while 21 pages totals
          exactly 15 cents. One page across the boundary is the difference
          between a zero-fee and a billable request.
        test_recipe:
          setup:
            - "Two non-commercial public records requests, one to be assessed at 20 pages and one at 21 pages, both PAPER with zero staff minutes."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "Ben Oyelaran", requester_email: "ben@example.org", subject_description: "Twenty pages of permits", commercial_purpose: false }
              as: Anonymous
              as_user_id: "public-02"
              captures: { req20: $.data.id }
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "Ben Oyelaran", requester_email: "ben@example.org", subject_description: "Twenty-one pages of permits", commercial_purpose: false }
              as: Anonymous
              as_user_id: "public-02"
              captures: { req21: $.data.id }
          trigger:
            - call: "POST /clerk/records-requests/${req20}/assess-fee"
              payload: { fee_schedule_variant: "ACTUAL_COST", fee_lines: [ { page_count: 20, staff_minutes: 0, delivery_medium: "PAPER" } ] }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req21}/assess-fee"
              payload: { fee_schedule_variant: "ACTUAL_COST", fee_lines: [ { page_count: 21, staff_minutes: 0, delivery_medium: "PAPER" } ] }
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "PublicRecordsRequest.${req20}.total_assessed_cents == 0"
            - "PublicRecordsRequest.${req20}.fee_balance_cents == 0"
            - "PublicRecordsRequest.${req20}.net_cash_cents == 0"
            - "PublicRecordsRequest.${req21}.total_assessed_cents == 15"
            - "PublicRecordsRequest.${req21}.fee_balance_cents == 15"
            - "PublicRecordsRequest.${req21}.total_assessed_cents - PublicRecordsRequest.${req20}.total_assessed_cents == 15"
            - "PublicRecordsRequest.${req20}.due_on == 2026-08-10 and PublicRecordsRequest.${req21}.due_on == 2026-08-10"

      - name: publication_volume_tier_boundary_inverts_the_billing_order_at_fifty_thousand_cents
        grounds:
          - calculations.publication_invoice_total
          - entities.PublicationNotice.fields.discount_pct
          - entities.PublicationNotice.fields.invoice_total_cents
          - entities.PublicationNotice.fields.gross_cost_cents
        distinguishing_aspect: |
          The 50000-cent volume tier is entered at exactly 50000: 99.99 column
          inches bills gross 49995 at discount_pct 0.00 for an invoice of 49995,
          while 100.00 column inches bills gross 50000 at discount_pct 0.05 for
          an invoice of 47500. The larger advertisement costs the city LESS —
          47500 < 49995 — which only a boundary-aware implementation reproduces.
        test_recipe:
          setup:
            - "Two venues so both meetings can start at 2026-09-15T18:00:00Z, each producing a DRAFT MEETING_AGENDA notice with required_publication_count 1 and publication_deadline_on 2026-09-14."
          setup_api_calls:
