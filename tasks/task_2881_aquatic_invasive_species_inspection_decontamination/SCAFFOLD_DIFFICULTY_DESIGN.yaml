  - rule_id: resource_temporal_overlap
    instances:
      - name: station_hours_windows_are_half_open_so_adjacency_is_allowed
        grounds:
          - validations.priority_26_ERR_HOURS_WINDOW_OVERLAP
          - entities.StationHours.fields.opens_at
          - entities.StationHours.fields.closes_at
          - endpoints.POST_/inspection-stations/{id}/hours
        distinguishing_aspect: |
          Resource: the InspectionStation's operating calendar. Interval semantics:
          HALF-OPEN [opens_at, closes_at), capacity 1, adjacency EXPLICITLY
          ALLOWED - a window starting exactly when another ends is accepted
          because the overlap test is new.opens_at < existing.closes_at AND
          existing.opens_at < new.closes_at, which is false at a shared endpoint.
          Retreating the new start by one minute makes both comparisons true and
          the same request is refused. This is the opposite convention to the
          quarantine-hold and decon-bay resources in the sibling instances, so an
          implementation with one shared overlap helper cannot satisfy all three.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Station 'Placid Access' created with exactly one StationHours row [2026-08-01T06:00:00Z, 2026-08-01T14:00:00Z) at staffing_level SINGLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Placid Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "LOW", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Placid Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-08-01T06:00:00Z", closes_at: "2026-08-01T14:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
              captures: { hrs1_id: $.data.id }
          trigger:
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-08-01T14:00:00Z", closes_at: "2026-08-01T20:00:00Z", staffing_level: "DOUBLE" }
              as: ProgramAdmin
          assert:
            - "the trigger returns 201: the second window opens exactly when the first closes, which is not an overlap"
            - "GET /inspection-stations/${st_id}/hours returns 2 rows"
            - "the new row has opens_at 2026-08-01T14:00:00Z, closes_at 2026-08-01T20:00:00Z and staffing_level DOUBLE"
            - "control: a further window [2026-08-01T13:59:00Z, 2026-08-01T20:00:00Z) is refused with 409 ERR_HOURS_WINDOW_OVERLAP because it overlaps the first row by one minute"
            - "control: a further window [2026-08-01T20:00:00Z, 2026-08-02T02:00:00Z) is accepted, chaining adjacency a second time"
            - "control: a duplicate of the first window [2026-08-01T06:00:00Z, 2026-08-01T14:00:00Z) is refused with 409 ERR_HOURS_WINDOW_OVERLAP"

      - name: quarantine_hold_on_a_vessel_is_closed_at_both_ends
        grounds:
          - validations.priority_27_ERR_WATERCRAFT_ALREADY_QUARANTINED
          - entities.Watercraft.fields.quarantine_hold_until
          - calculations.quarantine_hold_hours
          - endpoints.POST_/quarantine-orders
        distinguishing_aspect: |
          Resource: the Watercraft itself, which may carry at most ONE live hold.
          Interval semantics: CLOSED at the upper end - the rule rejects while the
          clock is at or before hold_until - so adjacency is FORBIDDEN and a second
          order at exactly 2026-08-10T09:00:00Z is refused, while the same request
          one second later succeeds. The occupancy set is also state-filtered:
