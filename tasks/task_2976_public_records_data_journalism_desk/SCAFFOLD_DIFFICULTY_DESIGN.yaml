            - "trigger call 2: HTTP 201; EnclaveSession.${s2_id}.status == \"BOOKED\" (11:30 is NOT < 11:30, the span is half-open)"
            - "after trigger call 2: SecureEnclave.${enclave_id}.booked_session_count == 2"
            - "trigger call 3: EnclaveSession.${s1_id}.status == \"CLOSED\", documents_returned_count == 5, and SecureEnclave.${enclave_id}.booked_session_count == 1"
            - "trigger call 4: HTTP 201; EnclaveSession.${s3_id}.status == \"BOOKED\" - the [10:00, 10:30) window is free because S1 is CLOSED and S2's own span starts at 11:30, which is not < 10:30 + 30 minutes"
            - "after trigger call 4: SecureEnclave.${enclave_id}.booked_session_count == 2"
            - "EnclaveSession.${s1_id}.cancellation_reason_code == null (it was closed, never cancelled)"

      - name: reviewer_closed_window_aggregate_capacity_at_the_touching_endpoint
        grounds:
          - calculations.reviewer_capacity_window
          - validations[priority=200]
          - entities.ExpertReviewer.fields.max_concurrent_assignments
          - entities.ExpertReviewer.fields.active_assignment_count
        distinguishing_aspect: |
          Reviewer windows are CLOSED intervals measured against an AGGREGATE count, which is the exact
          opposite of the enclave rule: a candidate starting at the instant an existing window ends still
          overlaps it (<= on both sides), and two existing overlapping windows exhaust
          max_concurrent_assignments 2 even though no single pair is forbidden. Shifting the candidate by
          one millisecond drops the overlap count to 1 and the booking is accepted, leaving
          active_assignment_count at 3 - proving the ceiling constrains overlap, not the reviewer's total.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk, one Agency, one submitted RecordsRequest, one Investigation with one AnalysisRun and three Findings f1, f2, f3."
            - "One ExpertReviewer with max_concurrent_assignments 2 and no conflicts."
            - "Two ASSIGNED assignments: A1 on f1 over the closed window [2026-09-01T00:00:00Z, 2026-09-05T00:00:00Z] and A2 on f2 over [2026-09-03T00:00:00Z, 2026-09-07T00:00:00Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
