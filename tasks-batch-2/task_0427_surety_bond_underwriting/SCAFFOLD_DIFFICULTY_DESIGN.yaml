              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "BID", requested_penal_sum_cents: 8000000, term_months: 12 }
              as: Underwriter
              captures: { app1_id: $.data.id }
            - call: "POST /surety/applications/${app1_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app1_id}" }
              as: Underwriter
              captures: { bond1_id: $.data.id }
            - call: "POST /surety/bonds/${bond1_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "BID", requested_penal_sum_cents: 3000000, term_months: 12 }
              as: Underwriter
