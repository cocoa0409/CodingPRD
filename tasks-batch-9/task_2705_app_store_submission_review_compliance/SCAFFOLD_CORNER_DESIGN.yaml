# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_2705_app_store_submission_review_compliance
#
# Breadth probe over the §1.1-§1.7 surface of SCAFFOLD.yaml: required-field and
# type validation, state-machine invalid-from and terminal lockdown, precondition
# enforcement, every cascade hop, every calculation boundary, the §1.4 priority
# pairs, every §1.6 error code, the §1.7 RBAC denials, the four §1.2.1 OCC rules
# and the immediate consistency model.
#
# CONVENTIONS used by every test_recipe below:
#  * The logical clock starts at the §1.5 mandatory default 2026-08-01T00:00:00Z;
#    the first setup call re-asserts it so the fixture is explicit and monotonic.
#  * `as_user_id` for the three entity_backed roles (PublisherAdmin,
#    ReleaseManager, ComplianceOfficer) is the owning PublisherAccount.id per
#    §1.7 `identity: entity_backed:PublisherAccount`, and supplies BOTH
#    X-User-ID and X-Publisher-Account-Id.
#  * `as_user_id` for the four opaque roles (PlatformReviewer,
#    PlatformAppealBoard, PlatformPolicyAdmin, Auditor) is a stable operator
#    handle ("rev-01", "rev-02", "board-07", "ppa-01", "aud-01").
#  * YAML anchors name reusable §1.5 calls; `*anchor` replays the identical call.
#  * No `excluded_because:` stubs are emitted: every corner below carries a full
#    executable test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: publisher_account_create_returns_active_with_full_standing_and_two_credits
        claim_type: Creation
        grounds:
          - entities.PublisherAccount
          - endpoints.POST_/publisher-accounts
        distinguishing_aspect: "A PublisherAccount created with membership_paid_through_at strictly after the clock comes back 201 with program_status ACTIVE, both standing variants at 100.00, expedite_credits_remaining 2, an empty settlement_finalized_periods array and version 1 - none of which are client-supplied."
        test_recipe:
          setup:
            - "Empty database. Logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          trigger:
            - &c_acct
              call: "POST /publisher-accounts"
              payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "PublisherAccount.${acct_id}.program_status == ACTIVE"
            - "PublisherAccount.${acct_id}.standing_score_rolling_365 == 100.00"
            - "PublisherAccount.${acct_id}.standing_score_lifetime == 100.00"
            - "PublisherAccount.${acct_id}.expedite_credits_remaining == 2"
            - "PublisherAccount.${acct_id}.rejection_strike_count == 0"
            - "PublisherAccount.${acct_id}.settlement_finalized_periods == []"
            - "PublisherAccount.${acct_id}.enforcement_reason_code is null"
            - "PublisherAccount.${acct_id}.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: publisher_account_create_with_lapsed_paid_through_starts_expired
        claim_type: Creation
        grounds:
          - entities.PublisherAccount.fields.program_status
          - endpoints.POST_/publisher-accounts
        distinguishing_aspect: "The same endpoint stamps program_status EXPIRED (not ACTIVE) when membership_paid_through_at is at or before the clock - 2026-07-01T00:00:00Z against a clock of 2026-08-01T00:00:00Z."
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /publisher-accounts"
              payload: { legal_name: "Lapsed Labs GmbH", contact_email: "billing@lapsed.example", membership_paid_through_at: "2026-07-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { lapsed_acct_id: $.data.id }
          assert:
            - "the response status is 201"
            - "PublisherAccount.${lapsed_acct_id}.program_status == EXPIRED"
            - "PublisherAccount.${lapsed_acct_id}.enforcement_reason_code is null"
            - "PublisherAccount.${lapsed_acct_id}.commerce_program_tier == STANDARD"

      - name: publisher_account_create_omitting_commerce_program_tier_defaults_to_standard
        claim_type: Defaults
        grounds:
          - entities.PublisherAccount.fields.commerce_program_tier
          - endpoints.POST_/publisher-accounts
        distinguishing_aspect: "commerce_program_tier is optional in the §1.5 input list; omitting it yields exactly STANDARD, which is the 0.30 base-rate branch of calculations.commission_settlement_cents."
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /publisher-accounts"
              payload: { legal_name: "Default Tier Studios", contact_email: "dev@defaulttier.example", membership_paid_through_at: "2027-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { dt_acct_id: $.data.id }
          assert:
            - "the response status is 201"
            - "PublisherAccount.${dt_acct_id}.commerce_program_tier == STANDARD"

      - name: app_record_create_starts_draft_not_distributed_and_restricted_with_two_reason_codes
        claim_type: Creation
        grounds:
          - entities.AppRecord
          - endpoints.POST_/app-records
          - calculations.compliance_posture
        distinguishing_aspect: "A brand-new AppRecord on an account with no signing material comes back listing_state DRAFT, distribution_state NOT_DISTRIBUTED and compliance_posture RESTRICTED with posture_reason_codes exactly [NO_ACTIVE_DISTRIBUTION_CERT, COMPLIANCE_INDEX_BELOW_FLOOR] in the R2-then-R3 order the formula pins - the empty mapping set scores 0.00, not 100.00."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. PublisherAccount Northwind ACTIVE, no SigningCredential, no GuidelineRule."
          setup_api_calls:
            - *c_clock
            - *c_acct
          trigger:
            - call: "POST /app-records"
              payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.bare", platform: "IOS", display_name: "Northwind Bare", primary_category: "FINANCE" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { bare_app_id: $.data.id }
          assert:
            - "the response status is 201"
            - "AppRecord.${bare_app_id}.listing_state == DRAFT"
            - "AppRecord.${bare_app_id}.distribution_state == NOT_DISTRIBUTED"
            - "AppRecord.${bare_app_id}.compliance_posture == RESTRICTED"
            - "AppRecord.${bare_app_id}.posture_reason_codes == [\"NO_ACTIVE_DISTRIBUTION_CERT\", \"COMPLIANCE_INDEX_BELOW_FLOOR\"]"
            - "AppRecord.${bare_app_id}.feature_compliance_index == 0.00"
            - "AppRecord.${bare_app_id}.live_submission_id is null"
            - "AppRecord.${bare_app_id}.released_share_pct == 0.00 and held_back_share_pct == 100.00"
            - "AppRecord.${bare_app_id}.rollback_count == 0 and version == 1"

      - name: signing_credential_status_is_server_set_to_pending_activation
        claim_type: System Fields
        grounds:
          - entities.SigningCredential.fields.status
          - entities.SigningCredential.fields.blocked_submission_count
          - endpoints.POST_/signing-credentials
        distinguishing_aspect: "POST /signing-credentials does not accept `status` in its §1.5 input list; the created DISTRIBUTION_CERT is always PENDING_ACTIVATION with revocation_reason null, compromised_at null and blocked_submission_count 0, and the call bumps PublisherAccount.version from 1 to 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. PublisherAccount Northwind at version 1."
          setup_api_calls:
            - *c_clock
            - *c_acct
          trigger:
            - &c_cert
              call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", entitlements: ["IN_APP_PURCHASE", "EXTERNAL_PAYMENT_LINK"] }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { cert_id: $.data.id }
          assert:
            - "the response status is 201"
            - "SigningCredential.${cert_id}.status == PENDING_ACTIVATION"
            - "SigningCredential.${cert_id}.revocation_reason is null"
            - "SigningCredential.${cert_id}.compromised_at is null"
            - "SigningCredential.${cert_id}.blocked_submission_count == 0"
            - "SigningCredential.${cert_id}.linked_cert_id is null"
            - "SigningCredential.${cert_id}.version == 1"
            - "GET /publisher-accounts/${acct_id} reports version == 2"
      - name: app_record_display_name_of_thirty_one_characters_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.AppRecord.fields.display_name
          - validations.priority_28_schema
          - errors.ERR_VALIDATION
        distinguishing_aspect: "display_name is bounded 1..30; a 31-character value is rejected 422 ERR_VALIDATION and no AppRecord row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. PublisherAccount Northwind ACTIVE at version 1."
          setup_api_calls:
            - *c_clock
            - *c_acct
          trigger:
            - call: "POST /app-records"
              payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.toolong", platform: "IOS", display_name: "Northwind Wallet Pro Max Editio", primary_category: "FINANCE" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 422 and error.error_id == ERR_VALIDATION"
            - "GET /app-records?publisher_account_id=${acct_id} reports pagination.total_count == 0"

      - name: publisher_account_create_without_contact_email_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.PublisherAccount.fields.contact_email
          - endpoints.POST_/publisher-accounts
          - errors.ERR_VALIDATION
        distinguishing_aspect: "contact_email is a non-defaulted input field of POST /publisher-accounts; omitting it returns 422 ERR_VALIDATION rather than creating an account with a null contact."
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /publisher-accounts"
              payload: { legal_name: "No Contact Ltd", membership_paid_through_at: "2027-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the response status is 422 and error.error_id == ERR_VALIDATION"
            - "GET /publisher-accounts reports pagination.total_count == 0"

      - name: signing_credential_create_without_key_custody_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.SigningCredential.fields.key_custody
          - endpoints.POST_/signing-credentials
          - errors.ERR_VALIDATION
        distinguishing_aspect: "key_custody is required on POST /signing-credentials; omitting it returns 422 ERR_VALIDATION and leaves PublisherAccount.version at 1 because the OCC write never lands."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. PublisherAccount Northwind ACTIVE at version 1."
          setup_api_calls:
            - *c_clock
            - *c_acct
          trigger:
            - call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 422 and error.error_id == ERR_VALIDATION"
            - "GET /publisher-accounts/${acct_id} reports version == 1"

      - name: app_record_index_and_posture_are_rederived_when_the_last_mapping_passes
        claim_type: Computed Fields
        grounds:
          - entities.AppRecord.fields.feature_compliance_index
          - entities.AppRecord.fields.compliance_posture
          - calculations.feature_compliance_index
          - calculations.compliance_posture
          - endpoints.POST_/feature-mappings/{id}/self-review
        distinguishing_aspect: "Driving the single FeatureMapping IN_PROGRESS -> PASSED moves feature_compliance_index from 25.00 to 100.00 in the same response and flips compliance_posture RESTRICTED -> OPEN with posture_reason_codes emptied; the index is never client-writable."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "PublisherAccount Northwind ACTIVE; an ACTIVE IOS DISTRIBUTION_CERT and an ACTIVE IOS PROVISIONING_PROFILE linked to it."
            - "AppRecord Northwind Wallet (IOS, FINANCE) owned by that account."
            - "One EFFECTIVE PRIVACY GuidelineRule 5.1.1 (severity_weight 4, remediation_grace_days 30) with requires_feature_mapping true."
            - "One FeatureMapping app->rule in self_review_status IN_PROGRESS, so feature_compliance_index == 25.00 and compliance_posture == RESTRICTED with posture_reason_codes [COMPLIANCE_INDEX_BELOW_FLOOR]."
            - "One OPEN ReviewCapacityWindow for IOS/POOL_A covering 2026-08-01T00:00:00Z..2026-09-01T00:00:00Z with 5 slots."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - &c_acct_reread
              call: "GET /publisher-accounts/${acct_id}"
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { acct_v2: $.data.version }
            - &c_cert_act
              call: "POST /signing-credentials/${cert_id}/activate"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - &c_prof
              call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", linked_cert_id: "${cert_id}", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - &c_prof_act
              call: "POST /signing-credentials/${prof_id}/activate"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - &c_app
              call: "POST /app-records"
              payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { app_id: $.data.id }
            - &c_rule
              call: "POST /guideline-rules"
              payload: { rule_code: "5.1.1", title: "Data Collection and Storage", category: "PRIVACY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { rule_id: $.data.id }
            - &c_rule_pub
              call: "POST /guideline-rules/${rule_id}/publish"
              payload: {}
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - &c_map
              call: "POST /feature-mappings"
              payload: { app_record_id: "${app_id}", guideline_rule_id: "${rule_id}", feature_code: "ACCOUNT_DELETION" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
              captures: { map_id: $.data.id }
            - &c_map_start
              call: "POST /feature-mappings/${map_id}/self-review"
              payload: { outcome: "START" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - &c_window
              call: "POST /review-capacity-windows"
              payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", capacity_slots: 5 }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { win_id: $.data.id }
          trigger:
            - &c_map_pass
              call: "POST /feature-mappings/${map_id}/self-review"
              payload: { outcome: "PASS", evidence_ref: "audit/acct-deletion-2026-08.pdf" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200"
            - "FeatureMapping.${map_id}.self_review_status == PASSED"
            - "FeatureMapping.${map_id}.attested_by_user_id == ${acct_id}"
            - "FeatureMapping.${map_id}.attested_at == 2026-08-01T00:00:00Z"
            - "AppRecord.${app_id}.feature_compliance_index == 100.00"
            - "AppRecord.${app_id}.compliance_posture == OPEN"
            - "AppRecord.${app_id}.posture_reason_codes == []"
      - name: signing_credential_get_returns_the_stored_entitlement_set_and_validity_interval
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/signing-credentials/{id}
          - entities.SigningCredential.fields.entitlements
        distinguishing_aspect: "GET /signing-credentials/{id} echoes the exact entitlements array and the not_before/not_after pair that were stored at creation, with status ACTIVE after activation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind account with one ACTIVE IOS DISTRIBUTION_CERT carrying two entitlements."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_cert_act
          trigger:
            - call: "GET /signing-credentials/${cert_id}"
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the response status is 200 and response_type is object"
            - "data.entitlements == [\"IN_APP_PURCHASE\", \"EXTERNAL_PAYMENT_LINK\"]"
            - "data.not_before == 2026-07-01T00:00:00Z and data.not_after == 2027-07-01T00:00:00Z"
            - "data.credential_type == DISTRIBUTION_CERT and data.key_custody == HSM and data.status == ACTIVE"

      - name: signing_credentials_list_filters_by_status_and_reports_the_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/signing-credentials
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With one ACTIVE DISTRIBUTION_CERT and one PENDING_ACTIVATION PROVISIONING_PROFILE on the account, GET /signing-credentials?status=ACTIVE returns exactly one row, total_count 1 and has_more false, while the unfiltered list returns total_count 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind account with an ACTIVE DISTRIBUTION_CERT and a PENDING_ACTIVATION PROVISIONING_PROFILE linked to it."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
          trigger:
            - call: "GET /signing-credentials?publisher_account_id=${acct_id}&status=ACTIVE"
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the response status is 200 and response_type is array"
            - "pagination.total_count == 1 and pagination.has_more == false"
            - "pagination.limit == 20 and pagination.offset == 0"
            - "data[0].id == ${cert_id}"
            - "GET /signing-credentials?publisher_account_id=${acct_id} reports pagination.total_count == 2"

      - name: app_record_get_with_an_unknown_uuid_returns_app_record_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/app-records/{id}
          - errors.ERR_APP_RECORD_NOT_FOUND
          - validations.priority_25_existence
        distinguishing_aspect: "A syntactically valid UUID that names no AppRecord returns 404 ERR_APP_RECORD_NOT_FOUND, not 422 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /app-records/00000000-0000-4000-8000-000000000001"
              as: Auditor
              as_user_id: "aud-01"
          assert:
            - "the response status is 404 and error.error_id == ERR_APP_RECORD_NOT_FOUND"

      - name: submission_get_with_an_unknown_uuid_returns_submission_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/submissions/{id}
          - errors.ERR_SUBMISSION_NOT_FOUND
        distinguishing_aspect: "The Submission existence check fires on GET /submissions/{id} with 404 ERR_SUBMISSION_NOT_FOUND even though the caller is a platform role that skips the tenancy check at priority 20."
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /submissions/00000000-0000-4000-8000-000000000002"
              as: PlatformReviewer
              as_user_id: "rev-01"
          assert:
            - "the response status is 404 and error.error_id == ERR_SUBMISSION_NOT_FOUND"

      - name: guideline_rule_safety_category_derives_weight_five_and_grace_fourteen_days
        claim_type: Computed Fields
        grounds:
          - entities.GuidelineRule.fields.severity_weight
          - entities.GuidelineRule.fields.remediation_grace_days
          - endpoints.POST_/guideline-rules
        distinguishing_aspect: "severity_weight and remediation_grace_days are absent from the POST /guideline-rules input list and are derived purely from category: SAFETY yields 5 and 14, and the rule starts DRAFT with published_at null and impacted_app_count 0."
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /guideline-rules"
              payload: { rule_code: "1.1.4", title: "Objectionable Content", category: "SAFETY", version_label: "2026.08", effective_from: "2026-07-15T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { safety_rule_id: $.data.id }
          assert:
            - "the response status is 201"
            - "GuidelineRule.${safety_rule_id}.severity_weight == 5"
            - "GuidelineRule.${safety_rule_id}.remediation_grace_days == 14"
            - "GuidelineRule.${safety_rule_id}.status == DRAFT"
            - "GuidelineRule.${safety_rule_id}.published_at is null"
            - "GuidelineRule.${safety_rule_id}.impacted_app_count == 0"
            - "GuidelineRule.${safety_rule_id}.requires_feature_mapping == true"

      - name: guideline_rule_create_with_an_undeclared_category_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.GuidelineRule.fields.category
          - validations.priority_28_schema
          - errors.ERR_VALIDATION
        distinguishing_aspect: "category is a closed enum {SAFETY, PRIVACY, COMMERCE, LEGAL, DESIGN}; the value ACCESSIBILITY returns 422 ERR_VALIDATION and no rule is drafted."
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /guideline-rules"
              payload: { rule_code: "9.9.9", title: "Accessibility Baseline", category: "ACCESSIBILITY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the response status is 422 and error.error_id == ERR_VALIDATION"
            - "GET /guideline-rules reports pagination.total_count == 0"

