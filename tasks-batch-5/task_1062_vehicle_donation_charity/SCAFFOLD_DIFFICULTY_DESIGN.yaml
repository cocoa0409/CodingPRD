        grounds:
          - state_machines.AuctionLot.SOLD_to_VOIDED
          - state_machines.Donation.ACCRUED_to_PENDING
          - entities.CharityAffiliate.fields.pledged_balance_cents
          - entities.CharityAffiliate.fields.remitted_balance_cents
          - entities.ProceedsLedgerEntry.fields.entry_type
          - calculations.charity_balance_projection
