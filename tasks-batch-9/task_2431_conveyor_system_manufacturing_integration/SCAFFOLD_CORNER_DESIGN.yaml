# ===========================================================================
# §1.9 Scaffold Corner Design — breadth walk of references/claim-extraction-guide.md
# against this scaffold's §1.1-§1.7 surface. Depth probes live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already asserted there are emitted as
# `excluded_because:` stubs with no test_recipe.
#
# Shared fixture vocabulary (every instance re-derives it from empty DB):
#   Fixture A  required_throughput_cph 1250, contract_base 240000000 -> contract_value 243600000,
#              IB-01 BELT 1500 cph / 96% (source 10000 bps) -> TR-02 ROLLER 1400 cph / 95%,
#              DETERMINISTIC eff 1400 (bottleneck TR-02), DEGRADED eff 1330 (bottleneck TR-02, 95%),
#              fat_target 1313, ramp targets 625 / 938 / 1250, retention 12180000, PREMIUM SLA 240 min.
#   Logical clock starts at 2026-08-01T00:00:00Z; every fixture instant is >= that.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  # From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:
      - name: project_creation_returns_201_with_stored_inputs_and_seeded_ledgers
        claim_type: creation
        grounds:
          - endpoints[POST /projects]
          - entities.Project.fields.contract_value_cents
          - entities.Project.fields.response_sla_minutes
          - calculations.contract_value_recompute
        distinguishing_aspect: |
          POST /projects with all eight declared inputs returns 201 and every input is echoed verbatim while
          the three seeded ledgers (contract, facility share, spares) are populated in the same response.
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectDirector
              as_user_id: "pd-001"
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_e1: $.data.id }
          assert:
            - "the response is 201 with response_type object and meta.api_request_id present"
            - "Project.${proj_e1}.customer_name == 'Northstar Grocers' and Project.${proj_e1}.facility_code == 'DC-ATL-04'"
            - "Project.${proj_e1}.required_throughput_cph == 1250 and Project.${proj_e1}.contract_base_cents == 240000000"
            - "Project.${proj_e1}.escalation_fee_cents == 3600000 and Project.${proj_e1}.contract_value_cents == 243600000"
            - "Project.${proj_e1}.response_sla_minutes == 240"
            - "Project.${proj_e1}.legacy_share_bps == 10000 and Project.${proj_e1}.in_transition_share_bps == 0 and Project.${proj_e1}.cutover_share_bps == 0"
            - "Project.${proj_e1}.spares_allocated_cents == 0 and Project.${proj_e1}.spares_unallocated_cents == 5000000"
            - "Project.${proj_e1}.design_version == 1 and Project.${proj_e1}.version == 1"

      - name: segment_retrieval_returns_stored_rating_and_class
        claim_type: retrieval
        grounds:
          - endpoints[GET /segments/{id}]
          - entities.ConveyorSegment.fields.rated_capacity_cph
        distinguishing_aspect: |
          GET /segments/{id} returns exactly the ConveyorSegment row written by POST /segments, including
          equipment_class MERGE, rated_capacity_cph 1751 and the pre-simulation defaults flow_share_bps 0.
        test_recipe:
          setup:
            - "Project in DESIGN with one MERGE segment created as a source carrying 10000 bps."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Harbor Freight Lines", facility_code: "DC-SEA-02", customer_rep_user_id: "cust-rep-31", required_throughput_cph: 1200, contract_base_cents: 200000000, authorized_ceiling_cents: 260000000, spares_budget_cents: 3000000, service_tier: "BASIC" }
              as: ProjectDirector
              as_user_id: "pd-002"
              captures: { proj_e2: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e2}", segment_code: "MG-X", equipment_class: "MERGE", rated_capacity_cph: 1751, availability_pct: 89, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_e2: $.data.id }
          trigger:
            - call: "GET /segments/${seg_e2}"
              payload: {}
              as: ShopSupervisor
          assert:
            - "the response is 200 with response_type object"
            - "ConveyorSegment.${seg_e2}.segment_code == 'MG-X' and ConveyorSegment.${seg_e2}.equipment_class == MERGE"
            - "ConveyorSegment.${seg_e2}.rated_capacity_cph == 1751 and ConveyorSegment.${seg_e2}.availability_pct == 89"
            - "ConveyorSegment.${seg_e2}.source_share_bps == 10000 and ConveyorSegment.${seg_e2}.inbound_link_count == 0"
            - "ConveyorSegment.${seg_e2}.flow_share_bps == 0 and ConveyorSegment.${seg_e2}.derated_capacity_cph == 0 (no simulation has run yet)"

      - name: spare_part_lines_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /projects/{id}/spare-part-lines]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three SparePartLine rows on one project, limit=2&offset=0 returns 2 rows with total_count 3 and
          has_more true, and limit=2&offset=2 returns the remaining 1 row with has_more false.
        test_recipe:
          setup:
            - "Project with exactly three SparePartLine rows and no provisioning run yet."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Lakeside Foods", facility_code: "DC-MSP-01", customer_rep_user_id: "cust-rep-12", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-003"
              captures: { proj_e3: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_e3}", part_no: "BR-1000", criticality: "CRITICAL", unit_cost_cents: 850000, min_stock_qty: 2, lead_time_days: 90 }
              as: ProjectDirector
              as_user_id: "pd-003"
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_e3}", part_no: "MT-2000", criticality: "MAJOR", unit_cost_cents: 1255000, min_stock_qty: 2, lead_time_days: 60 }
              as: ProjectDirector
              as_user_id: "pd-003"
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_e3}", part_no: "BL-3000", criticality: "MINOR", unit_cost_cents: 100000, min_stock_qty: 1, lead_time_days: 10 }
              as: ProjectDirector
              as_user_id: "pd-003"
          trigger:
            - call: "GET /projects/${proj_e3}/spare-part-lines?limit=2&offset=0"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-003"
            - call: "GET /projects/${proj_e3}/spare-part-lines?limit=2&offset=2"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-003"
          assert:
            - "the first response is 200 with response_type array, total_count == 3, has_more == true and exactly 2 elements"
            - "the second response has total_count == 3, has_more == false and exactly 1 element"
            - "GET /projects/${proj_e3}/spare-part-lines?criticality=MINOR returns total_count == 1 with part_no 'BL-3000'"

      - name: segment_read_with_unknown_id_returns_segment_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /segments/{id}]
          - errors[ERR_SEGMENT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A well-formed UUID that matches no ConveyorSegment row yields 404 ERR_SEGMENT_NOT_FOUND rather than
          an empty 200 body.
        test_recipe:
          setup:
            - "Empty database (no segment has ever been created)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectDirector
              as_user_id: "pd-004"
          trigger:
            - call: "GET /segments/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: DesignEngineer
              captures: { err_e4: $.data.error_id }
          assert:
            - "the response is 404 with response_type error and error_id ERR_SEGMENT_NOT_FOUND"

      - name: project_creation_missing_service_tier_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /projects]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          service_tier has source input with no default, so omitting it from POST /projects must return 400
          ERR_INVALID_REQUEST and persist no Project row.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectDirector
              as_user_id: "pd-005"
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Midway Grocers", facility_code: "DC-ORD-05", customer_rep_user_id: "cust-rep-55", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000 }
              as: ProjectDirector
              as_user_id: "pd-005"
              captures: { err_e5: $.data.error_id }
          assert:
            - "the response is 400 with error_id ERR_INVALID_REQUEST"
            - "no Project row was created (a subsequent GET on any id is unnecessary — the response carries no data.id)"

      - name: fabrication_lot_created_defaults_to_planned_with_zero_attempts
        claim_type: defaults
        grounds:
          - endpoints[POST /fabrication-lots]
          - entities.FabricationLot.fields.status
          - entities.FabricationLot.fields.fat_attempt_count
          - entities.FabricationLot.fields.fat_target_cph
        distinguishing_aspect: |
          A newly created FabricationLot takes its declared defaults status PLANNED and fat_attempt_count 0,
          while fat_target_cph is snapshotted at 1313 = ceil(1250 * 105 / 100).
        test_recipe:
          setup:
            - "Fixture A project frozen (DESIGN_FROZEN) with staging bay BAY-1 of concurrent_capacity 2."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-006"
              captures: { proj_e6: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e6}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_e6a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e6}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_e6b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_e6}", from_segment_id: "${seg_e6a}", to_segment_id: "${seg_e6b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_e6}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_e6}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-006"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-1", concurrent_capacity: 2 }
              as: ShopSupervisor
              captures: { bay_e6: $.data.id }
          trigger:
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_e6}", lot_code: "LOT-100", staging_bay_id: "${bay_e6}", segment_codes: ["IB-01", "TR-02"], occupancy_start_utc: "2026-08-02T00:00:00Z", occupancy_end_utc: "2026-08-05T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_e6: $.data.id }
          assert:
            - "the response is 201 and FabricationLot.${lot_e6}.status == PLANNED"
            - "FabricationLot.${lot_e6}.fat_attempt_count == 0"
            - "FabricationLot.${lot_e6}.fat_target_cph == 1313"
            - "FabricationLot.${lot_e6}.version == 1"

      - name: spare_part_line_requested_and_weighted_target_computed_at_creation
        claim_type: computed_fields
        grounds:
          - endpoints[POST /spare-part-lines]
          - entities.SparePartLine.fields.requested_cents
          - entities.SparePartLine.fields.weighted_target_cents
        distinguishing_aspect: |
          For a MAJOR line with unit_cost_cents 645003 and min_stock_qty 2, requested_cents is 1290006 and
          weighted_target_cents is round_half_up(1290006 * 6000 / 10000) == 774004, computed at creation and
          before any provisioning run.
        test_recipe:
          setup:
            - "Project with spares_budget_cents 3500000 and no spare part lines."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Lakeside Foods", facility_code: "DC-MSP-01", customer_rep_user_id: "cust-rep-12", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 3500000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-007"
              captures: { proj_e7: $.data.id }
          trigger:
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_e7}", part_no: "GB-4400", criticality: "MAJOR", unit_cost_cents: 645003, min_stock_qty: 2, lead_time_days: 30 }
              as: ProjectDirector
              as_user_id: "pd-007"
              captures: { spl_e7: $.data.id }
          assert:
            - "the response is 201 and SparePartLine.${spl_e7}.requested_cents == 1290006"
            - "SparePartLine.${spl_e7}.weighted_target_cents == 774004"
            - "SparePartLine.${spl_e7}.allocated_cents == 0 and SparePartLine.${spl_e7}.status == DRAFT"
            - "Project.${proj_e7}.spares_allocated_cents == 0 and Project.${proj_e7}.spares_unallocated_cents == 3500000"

      - name: flow_link_creation_refreshes_inbound_and_outbound_link_counts
        claim_type: computed_fields
        grounds:
          - endpoints[POST /flow-links]
          - entities.ConveyorSegment.fields.inbound_link_count
          - entities.ConveyorSegment.fields.outbound_link_count
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          FlowLink is the many-to-many junction of the segment graph: creating one edge raises the upstream
          segment's outbound_link_count to 1 and the downstream segment's inbound_link_count to 1 in the same
          request, with no other counter touched.
        test_recipe:
          setup:
            - "Project in DESIGN with three segments IB-01 (source 10000 bps), TR-02 and TR-03 and no links."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-008"
              captures: { proj_e8: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e8}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_e8a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e8}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_e8b: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e8}", segment_code: "TR-03", equipment_class: "ROLLER", rated_capacity_cph: 1300, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_e8c: $.data.id }
          trigger:
            - call: "POST /flow-links"
              payload: { project_id: "${proj_e8}", from_segment_id: "${seg_e8a}", to_segment_id: "${seg_e8b}", split_share_bps: 10000 }
              as: DesignEngineer
              captures: { link_e8: $.data.id }
          assert:
            - "the response is 201 and FlowLink.${link_e8}.split_share_bps == 10000"
            - "ConveyorSegment.${seg_e8a}.outbound_link_count == 1 and ConveyorSegment.${seg_e8a}.inbound_link_count == 0"
            - "ConveyorSegment.${seg_e8b}.inbound_link_count == 1 and ConveyorSegment.${seg_e8b}.outbound_link_count == 0"
            - "ConveyorSegment.${seg_e8c}.inbound_link_count == 0 and ConveyorSegment.${seg_e8c}.outbound_link_count == 0"
            - "GET /flow-links?to_segment_id=${seg_e8b} returns total_count == 1"

      - name: project_design_frozen_at_stamped_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - endpoints[POST /projects/{id}/design-freeze]
          - entities.Project.fields.design_frozen_at
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          design_frozen_at has source system: it is null while delivery_status is DESIGN and becomes exactly the
          logical-clock instant 2026-08-03T09:15:00Z set immediately before the freeze, never a wall-clock value.
        test_recipe:
          setup:
            - "Fixture A project in DESIGN with a COMPLETE DEGRADED_AVAILABILITY run at design_version 1."
            - "Logical clock moved to 2026-08-03T09:15:00Z after the simulation."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-009"
              captures: { proj_e9: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e9}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_e9a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e9}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_e9b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_e9}", from_segment_id: "${seg_e9a}", to_segment_id: "${seg_e9b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_e9}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:15:00Z" }
              as: ProjectDirector
              as_user_id: "pd-009"
          trigger:
            - call: "POST /projects/${proj_e9}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-009"
          assert:
            - "the response is 200 and Project.${proj_e9}.delivery_status == DESIGN_FROZEN"
            - "Project.${proj_e9}.design_frozen_at == '2026-08-03T09:15:00Z'"
            - "Project.${proj_e9}.commercial_status == CLEAN (the other dimension is untouched)"

      - name: segment_creation_with_unknown_equipment_class_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.ConveyorSegment.fields.equipment_class
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          equipment_class is constrained to BELT | ROLLER | SORTATION | MERGE, so 'SPIRAL' must be rejected with
          400 ERR_INVALID_REQUEST and must not bump Project.design_version.
        test_recipe:
          setup:
            - "Project in DESIGN with design_version 1 and no segments."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-010"
              captures: { proj_e10: $.data.id }
          trigger:
            - call: "POST /segments"
              payload: { project_id: "${proj_e10}", segment_code: "SP-09", equipment_class: "SPIRAL", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { err_e10: $.data.error_id }
          assert:
            - "the response is 400 with error_id ERR_INVALID_REQUEST"
            - "Project.${proj_e10}.design_version == 1 and Project.${proj_e10}.version == 1"
            - "GET /projects/${proj_e10}/segments returns total_count == 0"

      - name: flow_link_is_immutable_with_no_version_field_and_no_patch_endpoint
        claim_type: immutability
        grounds:
          - entities.FlowLink.common_fields
          - endpoints[GET /flow-links/{id}]
        distinguishing_aspect: |
          FlowLink declares common_fields false: its read response carries no `version` and no `updated_at`
          field, and §1.5 declares no PATCH or DELETE on /flow-links/{id} — the edge is replaced by design
          revision, never edited.
        test_recipe:
          setup:
            - "Project in DESIGN with two segments and one FlowLink between them."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-011"
              captures: { proj_e11: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e11}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_e11a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e11}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_e11b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_e11}", from_segment_id: "${seg_e11a}", to_segment_id: "${seg_e11b}", split_share_bps: 10000 }
              as: DesignEngineer
              captures: { link_e11: $.data.id }
          trigger:
            - call: "GET /flow-links/${link_e11}"
              payload: {}
              as: DesignEngineer
          assert:
            - "the response is 200 and data contains id, created_at, project_id, from_segment_id, to_segment_id, split_share_bps"
            - "data contains no `version` key and no `updated_at` key (FlowLink.common_fields == false)"
            - "§1.5 declares no PATCH /flow-links/{id} and no DELETE /flow-links/{id}"

      - name: fabrication_lot_with_segment_code_of_another_project_returns_segment_not_found
        claim_type: parent_relationships
        grounds:
          - entities.FabricationLot.fields.segment_codes
          - validations[priority=6]
          - errors[ERR_SEGMENT_NOT_FOUND]
        distinguishing_aspect: |
          Every element of segment_codes must resolve inside FabricationLot.project_id: a code that exists only
          on a different project yields 404 ERR_SEGMENT_NOT_FOUND and creates no lot.
        test_recipe:
