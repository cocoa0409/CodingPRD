          - "endpoints[POST /kiosk-ops/pack-lots]"
          - "entities.HostStore.fields.refrigerated_case_capacity_packs"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / host_store_case_capacity_aggregate_overlap_rejected
          rationale: "The store-level aggregate is only observable with two kiosks sharing one case, which that §1.8 instance builds in full and asserts against ERR_CASE_CAPACITY_EXCEEDED rather than the per-plan ERR_PACK_CAP_EXCEEDED"
      - name: error_no_settleable_sales_on_issue
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NO_SETTLEABLE_SALES]"
          - "endpoints[POST /kiosk-ops/settlement-statements/{id}/issue]"
        excluded_because:
          difficulty_instance: boundary_precision_check / settlement_issue_with_empty_reconciled_feed_set_rejected
          rationale: "That §1.8 boundary instance issues a statement whose closed period contains only SUBMITTED and REJECTED feeds, which is exactly and only how ERR_NO_SETTLEABLE_SALES is reachable"
