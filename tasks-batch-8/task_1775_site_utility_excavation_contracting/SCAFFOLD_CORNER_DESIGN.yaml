  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: audit_trail_records_mutations
        claim_type: computed_read
        grounds:
          - entities.AuditEvent
        distinguishing_aspect: "The audit sub-resource supports entity_type filtering and chronological order: after three mutations, entity_type=LocateTicket returns exactly the 2 ticket events in created_at ASC."
        test_recipe:
          setup: ["Project P; ticket T created and submitted"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-AUD2", contract_ref: "C-500", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
