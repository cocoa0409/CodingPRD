          - state_machines.DescentMilestone.SCHEDULED_to_MISSED
          - state_machines.DescentPlan.CERTIFIED_to_BREACHED
          - state_machines.Team.WATCH_to_PROBATION
          - state_machines.Wrestler.ELIGIBLE_to_RESTRICTED
          - calculations.team_compliance_posture
        distinguishing_aspect: |
          Different trigger (a season-wide compliance sweep, not an audit finalize) and a different
          hop sequence that crosses into the aggregate/ledger dimension:
          DescentMilestone -> DescentPlan -> HealthFlag -> Team.open_flag_severity_total ->
          Wrestler.eligibility_status. The last hop only fires because two pre-existing hydration
          flags (severity 1 each) put the ledger at 2, so the breach flag's severity 3 pushes the
          total to exactly the PROBATION threshold of 5 — the cascade depth depends on prior state,
          not on the trigger payload. certification_status is untouched throughout.
