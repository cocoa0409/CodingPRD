      - name: transfer_create_with_stale_store_version_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[transfer-request-create-stale-store]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on Store.version: after the first transfer creation bumps the store version, a second create with the previously observed expected_store_version is rejected 412 — deterministic with strictly sequential requests."
        test_recipe:
          setup: ["Logical clock default; territory with OPEN store S1 (owner FR1); buyers FR2 and FR3 exist; first transfer created with the store's creation version."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-CC-2", region: "CC", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
