            - "${cand_a_status_draft} == DRAFT and ${cand_b_status_draft} == DRAFT  # creation never evaluates spacing, so both conflicting drafts can exist"
            - "inside the window - ${collide_error} == ERR_DROP_WINDOW_CONFLICT with HTTP 422  # abs(2026-08-25 - 2026-08-05) == 20 whole days < 21"
            - "inside the window - MarketingCampaign.${cand_a_id}.status == DRAFT, submitted_by_user_id == null and revision_count == 0  # the refused submission is side-effect free and did NOT count as a revision"
            - "on the edge - ${cand_b_status} == PARTNER_REVIEW with ${cand_b_submitter} == mops-001 and ${cand_b_revisions} == 0  # gap_days exactly 21 is permitted"
