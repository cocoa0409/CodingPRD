  - rule_id: compensating_invariant
    instances:
      - name: write_off_reversal_restores_bottle_conservation_without_editing_history
        grounds:
          - state_machines.SpoilageWriteOff.APPROVED_to_REVERSED
          - state_machines.InventoryLot.DEPLETED_to_ON_HAND
          - entities.DepletionEntry.common_fields
          - calculations.lot_depletion_cogs
          - endpoints["POST /beverage-program/spoilage-write-offs/{write_off_id}/reverse"]
        distinguishing_aspect: |
          The invariant is physical bottle conservation across an approve/reverse pair: bottles, bin
          occupancy, entry availability_state, the parent ListVersion's out_of_stock_entry_count and the venue COGS ledger
          must all land exactly where they started, and the audit trail must grow rather than shrink —
          the SPOILAGE DepletionEntry is never edited or deleted, a REVERSAL entry with negated bottles
          and negated cogs_cents is appended beside it, and the two sum to zero. A test that only
          re-reads the lot passes on an implementation that "fixes" history by mutating the original
          append-only row, so the entry count and the original row's immutability are asserted too.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with bin A1 (capacity 48) holding one 12-bottle RED lot at 2400 cents received 2026-08-10, so bin utilization_pct is 25.00."
            - "A published ListVersion with one bottle-only RED entry (par_bottles 6), availability_state AVAILABLE."
            - "A 12-bottle CORKED write-off submitted by the VenueSommelier and approved by the Controller (segregation of duties satisfied)."
