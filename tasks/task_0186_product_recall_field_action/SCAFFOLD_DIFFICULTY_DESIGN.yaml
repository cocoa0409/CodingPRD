# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Product Recall & Field Action — Expert
# Nine §0.5 rules, >= 2 instances each (>= 18 total).
# Every setup_api_calls / trigger entry is a structured call against §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Recall domain: classification depends solely on injury_reported ---
      - name: classification_injury_flag_drives_class_i_vs_ii
        grounds:
          - calculations.classification_rule
          - entities.Recall.fields.classification
          - entities.Recall.fields.injury_reported
        distinguishing_aspect: >
          On a SERIOUS-severity recall, flipping injury_reported true vs false is the
          ONLY input difference yet yields CLASS_I vs CLASS_II respectively — a
          classification calculation on the Recall entity domain.
        test_recipe:
          setup:
            - "Two FDA products, each with one lot and one affected lot on a fresh recall."
            - "Recall R1: hazard_severity SERIOUS, injury_reported true -> CLASS_I."
            - "Recall R2: hazard_severity SERIOUS, injury_reported false -> CLASS_II."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-INJ-A", name: "Pump A", regulator: "FDA", unit_list_price_cents: 10000 }
              as: PlatformAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-INJ-B", name: "Pump B", regulator: "FDA", unit_list_price_cents: 10000 }
              as: PlatformAdmin
              captures: { prod_b: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_a}", lot_code: "L-A1", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot_a: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_b}", lot_code: "L-B1", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot_b: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod_a}", reason: "burn hazard", hazard_severity: "SERIOUS", injury_reported: true }
              as: RecallCoordinator
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /recalls/${r1}/affected-lots"
              payload: { lot_id: "${lot_a}", expected_recall_version: "${r1_v}" }
              as: RecallCoordinator
            - call: "POST /recalls"
              payload: { product_id: "${prod_b}", reason: "burn hazard", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /recalls/${r2}/affected-lots"
              payload: { lot_id: "${lot_b}", expected_recall_version: "${r2_v}" }
              as: RecallCoordinator
          trigger:
            - call: "POST /recalls/${r1}/classify"
              payload: {}
              as: RecallCoordinator
              captures: { r1_class: $.data.classification }
            - call: "POST /recalls/${r2}/classify"
              payload: {}
              as: RecallCoordinator
              captures: { r2_class: $.data.classification }
          assert:
            - "Recall.${r1}.classification == CLASS_I"
            - "Recall.${r2}.classification == CLASS_II"

      # --- Disposition domain: refund basis produces different cents ---------
      - name: refund_basis_sale_vs_list_diverges
        grounds:
          - calculations.refund_amount_rule
          - entities.Disposition.fields.refund_amount_cents
          - entities.Disposition.fields.refund_basis
        distinguishing_aspect: >
          Two settled refunds on identical CLASS_II units differ in cents purely
          because one uses refund_basis SALE_PRICE (paid 12000) and the other
          LIST_PRICE (10000) — a refund calculation on the Disposition entity
          domain, distinct from classification on Recall.
        test_recipe:
          setup:
            - "FDA product, list price 10000c; lot [1..100]; two units sold at 12000c each to two customers."
            - "Recall CLASS_II (SERIOUS, no injury) announced & in MONITORING; two affected units returned."
            - "Disposition D_SALE refund_basis SALE_PRICE; D_LIST refund_basis LIST_PRICE; both REFUND type."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-RB", name: "Heater", regulator: "FDA", unit_list_price_cents: 10000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "L1", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust S", contact_channel: "EMAIL", contact_address: "s@x.com" }
              as: FieldServiceAgent
              captures: { cust_s: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust L", contact_channel: "EMAIL", contact_address: "l@x.com" }
              as: FieldServiceAgent
              captures: { cust_l: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 10, customer_id: "${cust_s}", sale_price_cents: 12000 }
              as: FieldServiceAgent
              captures: { unit_s: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 11, customer_id: "${cust_l}", sale_price_cents: 12000 }
              as: FieldServiceAgent
              captures: { unit_l: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "fire", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep_init: $.data.id }
            - call: "POST /regulatory-reports/${rep_init}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              captures: { rc_v_ann: $.data.version }
            - call: "GET /recalls/${rc}"
              payload: {}
              as: FieldServiceAgent
              captures: { rcv_d1: $.data.version }
            - call: "POST /dispositions"
              payload: { recall_id: "${rc}", unit_id: "${unit_s}", disposition_type: "REFUND", refund_basis: "SALE_PRICE", expected_recall_version: "${rcv_d1}" }
              as: FieldServiceAgent
              captures: { d_sale: $.data.id, rc_v_d1: $.data.version }
            - call: "GET /recalls/${rc}"
              payload: {}
              as: FieldServiceAgent
              captures: { rcv_d2: $.data.version }
            - call: "POST /dispositions"
              payload: { recall_id: "${rc}", unit_id: "${unit_l}", disposition_type: "REFUND", refund_basis: "LIST_PRICE", expected_recall_version: "${rcv_d2}" }
              as: FieldServiceAgent
              captures: { d_list: $.data.id }
            - call: "POST /dispositions/${d_sale}/receive-return"
              payload: {}
              as: FieldServiceAgent
            - call: "POST /dispositions/${d_list}/receive-return"
              payload: {}
              as: FieldServiceAgent
            - call: "POST /dispositions/${d_sale}/accrue-refund"
              payload: {}
              as: FinanceClerk
            - call: "POST /dispositions/${d_list}/accrue-refund"
              payload: {}
              as: FinanceClerk
          trigger:
            - call: "POST /dispositions/${d_sale}/settle-refund"
              payload: {}
              as: FinanceClerk
              captures: { sale_amt: $.data.refund_amount_cents }
            - call: "POST /dispositions/${d_list}/settle-refund"
              payload: {}
              as: FinanceClerk
              captures: { list_amt: $.data.refund_amount_cents }
          assert:
            - "Disposition.${d_sale}.refund_amount_cents == 12000"
            - "Disposition.${d_list}.refund_amount_cents == 10000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Mode (a): 3-input branched notification window --------------------
      - name: notification_window_three_input_branch
        grounds:
          - calculations.notification_window_rule
          - entities.Recall.fields.notification_deadline_hours
          - entities.Product.fields.regulator
        distinguishing_aspect: >
          notification_deadline_hours is selected by a non-linear branch over THREE
          inputs (classification, regulator, injury_reported): a CPSC+injury recall
          short-circuits to 24h even at CLASS_III, whereas an FDA CLASS_II is 72h —
          mode (a) multi-input non-linear interaction.
        test_recipe:
          setup:
            - "CPSC product with a CLASS_III-shaped recall (MINOR severity) but injury_reported true -> fast-track 24h."
            - "FDA product with a CLASS_II-shaped recall (SERIOUS, no injury) -> 72h."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-NW-CPSC", name: "Toy", regulator: "CPSC", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_c: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-NW-FDA", name: "Syrup", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_f: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_c}", lot_code: "LC", serial_start: 1, serial_end: 50 }
              as: RecallCoordinator
              captures: { lot_c: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_f}", lot_code: "LF", serial_start: 1, serial_end: 50 }
              as: RecallCoordinator
              captures: { lot_f: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod_c}", reason: "choking", hazard_severity: "MINOR", injury_reported: true }
              as: RecallCoordinator
              captures: { r_c: $.data.id, r_c_v: $.data.version }
            - call: "POST /recalls/${r_c}/affected-lots"
              payload: { lot_id: "${lot_c}", expected_recall_version: "${r_c_v}" }
              as: RecallCoordinator
            - call: "POST /recalls"
              payload: { product_id: "${prod_f}", reason: "contamination", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { r_f: $.data.id, r_f_v: $.data.version }
            - call: "POST /recalls/${r_f}/affected-lots"
              payload: { lot_id: "${lot_f}", expected_recall_version: "${r_f_v}" }
              as: RecallCoordinator
          trigger:
            - call: "POST /recalls/${r_c}/classify"
              payload: {}
              as: RecallCoordinator
              captures: { c_hours: $.data.notification_deadline_hours, c_class: $.data.classification }
            - call: "POST /recalls/${r_f}/classify"
              payload: {}
              as: RecallCoordinator
              captures: { f_hours: $.data.notification_deadline_hours }
          assert:
            - "Recall.${r_c}.classification == CLASS_III"
            - "Recall.${r_c}.notification_deadline_hours == 24"
            - "Recall.${r_f}.notification_deadline_hours == 72"

      # --- Mode (c): pinned evaluation order in effectiveness recompute ------
      - name: effectiveness_recompute_pinned_eval_order
        grounds:
          - calculations.effectiveness_recompute
          - entities.Recall.fields.effectiveness_pct
          - entities.Recall.fields.recovered_unit_count
        distinguishing_aspect: >
          effectiveness_pct looks circular (it gates termination yet is recomputed
          from the same disposition set) so the formula PINS a 3-step order:
          affected_unit_count first, then recovered_unit_count, then the ratio;
          recovering 1 of 3 affected units yields exactly 33.33 — mode (c) explicit
          evaluation order, distinct from the mode (a) window branch.
        test_recipe:
          setup:
            - "FDA product; lot [1..100]; three affected units sold to three customers."
            - "Recall CLASS_II announced & MONITORING; exactly one unit RETURNED, two still PENDING."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-EFF", name: "Blender", regulator: "FDA", unit_list_price_cents: 8000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "LE", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { name: "C1", contact_channel: "EMAIL", contact_address: "c1@x.com" }
              as: FieldServiceAgent
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { name: "C2", contact_channel: "EMAIL", contact_address: "c2@x.com" }
              as: FieldServiceAgent
              captures: { c2: $.data.id }
            - call: "POST /customers"
              payload: { name: "C3", contact_channel: "EMAIL", contact_address: "c3@x.com" }
              as: FieldServiceAgent
              captures: { c3: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 1, customer_id: "${c1}", sale_price_cents: 8000 }
              as: FieldServiceAgent
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 2, customer_id: "${c2}", sale_price_cents: 8000 }
              as: FieldServiceAgent
              captures: { u2: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 3, customer_id: "${c3}", sale_price_cents: 8000 }
              as: FieldServiceAgent
              captures: { u3: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "blade", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              captures: { rc_v_ann: $.data.version }
            - call: "GET /recalls/${rc}"
              payload: {}
              as: FieldServiceAgent
              captures: { rcv_d3: $.data.version }
            - call: "POST /dispositions"
              payload: { recall_id: "${rc}", unit_id: "${u1}", disposition_type: "RETURN", expected_recall_version: "${rcv_d3}" }
              as: FieldServiceAgent
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /dispositions/${d1}/receive-return"
              payload: {}
              as: FieldServiceAgent
            - call: "GET /recalls/${rc}/effectiveness"
              payload: {}
              as: RecallCoordinator
              captures: { eff: $.data.effectiveness_pct, rec: $.data.recovered_unit_count, aff: $.data.affected_unit_count }
          assert:
            - "Recall.${rc}.affected_unit_count == 3"
            - "Recall.${rc}.recovered_unit_count == 1"
            - "Recall.${rc}.effectiveness_pct == 33.33"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- Disposition: parallel dimensions evolve independently -------------
      - name: disposition_parallel_logistics_and_financial
        grounds:
          - state_machines.Disposition.logistics:PENDING_to_logistics:RETURNED
          - state_machines.Disposition.financial:NOT_OWED_to_financial:OWED
          - entities.Disposition.fields.logistics_status
          - entities.Disposition.fields.financial_status
        distinguishing_aspect: >
          One Disposition row carries two independent state axes: logistics
          (PENDING->RETURNED) and financial (NOT_OWED->OWED->REFUNDED) advance via
          different endpoints and roles, so the row is in a parallel-dimension
          machine on the Disposition entity.
        test_recipe:
          setup:
            - "Recall CLASS_II announced & MONITORING with one affected returned unit; REFUND disposition."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-PAR", name: "Kettle", regulator: "FDA", unit_list_price_cents: 7000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "LP", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { name: "CP", contact_channel: "EMAIL", contact_address: "cp@x.com" }
              as: FieldServiceAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 5, customer_id: "${cust}", sale_price_cents: 7000 }
              as: FieldServiceAgent
              captures: { unit: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "leak", hazard_severity: "TEMPORARY" }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              captures: { rc_v_ann: $.data.version }
            - call: "GET /recalls/${rc}"
              payload: {}
              as: FieldServiceAgent
              captures: { rcv_d4: $.data.version }
            - call: "POST /dispositions"
              payload: { recall_id: "${rc}", unit_id: "${unit}", disposition_type: "REFUND", refund_basis: "SALE_PRICE", expected_recall_version: "${rcv_d4}" }
              as: FieldServiceAgent
              captures: { d: $.data.id }
            - call: "POST /dispositions/${d}/receive-return"
              payload: {}
              as: FieldServiceAgent
          trigger:
            - call: "POST /dispositions/${d}/accrue-refund"
              payload: {}
              as: FinanceClerk
              captures: { fin: $.data.financial_status, log: $.data.logistics_status }
          assert:
            - "Disposition.${d}.logistics_status == RETURNED"
            - "Disposition.${d}.financial_status == OWED"

      # --- QuarantineHold: cyclic lift/reimpose loop -------------------------
      - name: quarantine_hold_cyclic_lift_reimpose
        grounds:
          - state_machines.QuarantineHold.ACTIVE_to_LIFTED
          - state_machines.QuarantineHold.LIFTED_to_ACTIVE
          - entities.QuarantineHold.fields.lifted_count
        distinguishing_aspect: >
          A QuarantineHold cycles ACTIVE->LIFTED->ACTIVE on the same row, with
          lifted_count incrementing only on the ACTIVE->LIFTED leg — a cyclic
          machine on the QuarantineHold entity, a different entity than Disposition.
        test_recipe:
          setup:
            - "Recall CLASS_II in MONITORING; one ACTIVE QuarantineHold on its affected lot."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-QH", name: "Drill", regulator: "CPSC", unit_list_price_cents: 9000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "LQ", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "shock", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/begin-monitoring"
              payload: {}
              as: RecallCoordinator
            - call: "GET /quarantine-holds"
              payload: {}
              as: RecallCoordinator
              captures: { hold: $.data.0.id }
            - call: "POST /quarantine-holds/${hold}/lift"
              payload: {}
              as: RecallCoordinator
          trigger:
            - call: "POST /quarantine-holds/${hold}/reimpose"
              payload: {}
              as: RecallCoordinator
              captures: { st: $.data.status, lc: $.data.lifted_count }
          assert:
            - "QuarantineHold.${hold}.status == ACTIVE"
            - "QuarantineHold.${hold}.lifted_count == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- Depth-3: announce -> create hold (ACTIVE) -> lot HELD -------------
      - name: announce_cascade_recall_hold_lot
        grounds:
          - state_machines.Recall.CLASSIFIED_to_ANNOUNCED
          - state_machines.QuarantineHold.ACTIVE_to_LIFTED
          - entities.QuarantineHold.fields.status
          - entities.Lot.fields.quarantine_status
        distinguishing_aspect: >
          ANNOUNCE on the Recall (A) creates an ACTIVE QuarantineHold (B); the
          hold's ACTIVE state (B) in turn forces its target Lot.quarantine_status
          to HELD (C). Each hop is caused by the prior hop, depth 3, triggered by
          the announce transition.
        test_recipe:
          setup:
            - "Recall CLASS_II classified with INITIAL report submitted; one affected lot currently RELEASED, zero holds."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-CAS1", name: "Saw", regulator: "CPSC", unit_list_price_cents: 9000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "LC1", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "kickback", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
          trigger:
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
            - call: "GET /quarantine-holds"
              payload: {}
              as: RecallCoordinator
              captures: { hold: $.data.0.id, hold_status: $.data.0.status }
            - call: "GET /lots/${lot}"
              payload: {}
              as: RecallCoordinator
              captures: { lot_qs: $.data.quarantine_status }
          assert:
            - "exactly one QuarantineHold exists with recall_id == ${rc} and lot_id == ${lot}, status ACTIVE"
            - "QuarantineHold.${hold}.status == ACTIVE"
            - "Lot.${lot}.quarantine_status == HELD"

      # --- Depth-2: settle-refund -> disposition REFUNDED -> recall ledger ---
      - name: settle_refund_cascade_disposition_recall_ledger
        grounds:
          - state_machines.Disposition.financial:OWED_to_financial:REFUNDED
          - calculations.refund_ledger_recompute
          - entities.Recall.fields.total_refund_cents
        distinguishing_aspect: >
          settle-refund flips the Disposition financial axis OWED->REFUNDED (A);
