              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_ACTIVE_LOTTERY_EXISTS (409) — not ERR_STALE_VERSION: ${cv2} was re-read after run ${run1} bumped the campaign version"

      - name: list_pagination_defaults_and_envelope_shape
        claim_type: standard_crud
        grounds:
          - response_envelope
        distinguishing_aspect: "Default pagination (limit 10, offset 0) over 12 units returns 10 items with total_count 12 and has_more true; offset 10 returns the remaining 2 with has_more false; single-resource GET uses response_type object; a 404 uses the error envelope with data.error_id and data.message."
