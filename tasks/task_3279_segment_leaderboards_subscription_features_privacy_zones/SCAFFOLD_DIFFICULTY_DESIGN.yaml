            - call: "GET /v1/activities/${a1_up}"
              as: Athlete
              as_user_id: "${v_cas}"
              captures: { a1_hidden: $.data.auto_hidden, a1_fs: $.data.flag_status }
          assert:
            - "Athlete.${v_cas}.safety_score == 50 (five upheld flags x -10)"
            - "Activity.${a1_up}.flag_status == CONFIRMED and auto_hidden == true (hop 3 fired at the score < 50 crossing on the 5th uphold)"
            - "Activity.${a2_up}.auto_hidden == true and Activity.${a3_up}.auto_hidden == true (cascade covers every COMPLETED activity)"
            - "SegmentEffort.${e1_up}.flag_status == EXCLUDED with exclusion_reason == FLAG_UPHELD"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_temporal_on_challenge_join
        grounds:
          - "validations[priority=5]"
          - "validations[priority=8]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_WINDOW_VIOLATION]"
        distinguishing_aspect: |
          Pair state (priority 5) vs business_temporal (priority 8): joining a
          DRAFT challenge whose window is already past violates both — the state
          error ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Athlete PO owns club PC (OPEN); athlete PM is ACTIVE member"
            - "Challenge PCH created with window 2026-08-01..2026-08-31 and left DRAFT (never started)"
            - "Clock advanced to 2026-09-10 (window is in the past AND challenge is DRAFT)"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "po_pri@x.com", display_name: "PO Pri", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { po_pri: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "pm_pri@x.com", display_name: "PM Pri", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { pm_pri: $.data.id }
            - call: "POST /v1/clubs"
              payload: { owner_id: "${po_pri}", name: "Priority Club", sport_type: "RUN", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${po_pri}"
              captures: { club_pri: $.data.id }
            - call: "POST /v1/clubs/${club_pri}/memberships"
              payload: { athlete_id: "${pm_pri}" }
              as: Athlete
              as_user_id: "${pm_pri}"
            - call: "POST /v1/clubs/${club_pri}/challenges"
              payload: { name: "August DRAFT", goal_type: "DISTANCE_M", goal_target: 10000, start_date: "2026-08-01", end_date: "2026-08-31", join_mode: "OPEN" }
              as: Athlete
              as_user_id: "${po_pri}"
              captures: { ch_pri: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/challenges/${ch_pri}/participations"
              payload: { athlete_id: "${pm_pri}" }
              as: Athlete
              as_user_id: "${pm_pri}"
              captures: { err_pri: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 5 beats business_temporal priority 8 even though the window is also past)"
            - "HTTP status == 409"

      - name: safety_vs_referential_on_segment_ops
        grounds:
          - "validations[priority=7]"
          - "validations[priority=14]"
          - "errors[ERR_SAFETY_VIOLATION]"
          - "errors[ERR_INCONSISTENT_REFERENCE]"
        distinguishing_aspect: |
          Pair business_safety (priority 7) vs business_referential (priority
          14): a hazardous (hazard_index 1) RETIRED segment with zero efforts is
          re-activated while an event-creation attempt against that same
          hazardous segment would fail referentially — the activation surfaces
          the safety error first; different category pair than state_vs_temporal.
        test_recipe:
          setup:
            - "Athlete SO owns segment SS: RIDE, hazard_index 1, cycled DRAFT -> ACTIVE impossible (safety) — segment created, retired path taken via DRAFT -> RETIRED, so status RETIRED with effort_count 0 and hazard_index 1"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "so_pri@x.com", display_name: "SO Pri", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { so_pri: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${so_pri}", name: "Hazard Hill", sport_type: "RIDE", start_lat: 41.00, start_lng: -126.00, end_lat: 41.01, end_lng: -126.00, distance_m: 2000, city: "Hazardtown", hazard_index: 1 }
              as: Athlete
              as_user_id: "${so_pri}"
              captures: { seg_hz: $.data.id }
            - call: "POST /v1/segments/${seg_hz}/retire"
              payload: {}
              as: Athlete
              as_user_id: "${so_pri}"
          trigger:
            - call: "POST /v1/segments/${seg_hz}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${so_pri}"
              captures: { err_hz: $.data.error_id }
          assert:
            - "error_id == ERR_SAFETY_VIOLATION (business_safety priority 7 fires on hazard_index > 0 before any referential evaluation at priority 14)"
            - "HTTP status == 422"
            - "Segment.${seg_hz}.status remains RETIRED"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: free_tier_cap_third_plan_allowed
        grounds:
          - calculations.free_tier_weekly_route_cap
          - "errors[ERR_FREE_TIER_ROUTE_CAP]"
        distinguishing_aspect: |
          Numeric-count boundary on RoutePlan creation: FREE athlete's 3rd plan
          in a week (existing count == 2) succeeds; the 4th (existing == 3)
          fails — exact >= 3 semantics on a count metric.
        test_recipe:
          setup:
            - "Athlete FB with NO subscription (FREE tier) already holds 2 RoutePlans with week_start 2026-09-07"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "fb_cap@x.com", display_name: "FB Cap", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { fb_cap: $.data.id }
            - call: "POST /v1/athletes/${fb_cap}/route_plans"
              payload: { name: "Plan One", waypoints: [{lat: 37.0, lng: -122.0}, {lat: 37.1, lng: -122.0}], distance_m: 10000, week_start: "2026-09-07" }
              as: Athlete
              as_user_id: "${fb_cap}"
            - call: "POST /v1/athletes/${fb_cap}/route_plans"
              payload: { name: "Plan Two", waypoints: [{lat: 37.0, lng: -122.0}, {lat: 37.1, lng: -122.0}], distance_m: 10000, week_start: "2026-09-07" }
              as: Athlete
              as_user_id: "${fb_cap}"
          trigger:
            - call: "POST /v1/athletes/${fb_cap}/route_plans"
              payload: { name: "Plan Three", waypoints: [{lat: 37.0, lng: -122.0}, {lat: 37.1, lng: -122.0}], distance_m: 10000, week_start: "2026-09-07" }
              as: Athlete
              as_user_id: "${fb_cap}"
              captures: { plan3: $.data.id }
            - call: "POST /v1/athletes/${fb_cap}/route_plans"
              payload: { name: "Plan Four", waypoints: [{lat: 37.0, lng: -122.0}, {lat: 37.1, lng: -122.0}], distance_m: 10000, week_start: "2026-09-07" }
              as: Athlete
              as_user_id: "${fb_cap}"
              captures: { err_cap: $.data.error_id }
          assert:
            - "Third plan created (HTTP 201): existing count 2 < 3"
            - "Fourth plan rejected with error_id == ERR_FREE_TIER_ROUTE_CAP (existing count 3 >= 3)"
            - "HTTP status of fourth create == 402"

      - name: heatmap_min_count_boundary
        grounds:
          - calculations.heatmap_contribution
          - entities.HeatmapCell.fields.contribution_count
        distinguishing_aspect: |
          Different metric (heatmap cell contribution count) reached through a
          DIFFERENT endpoint (GET /v1/heatmap): a cell with 2 contributions is
          invisible; the 3rd contribution surfaces it — integer >= 3 boundary
          on a collection-visibility metric, not a route-plan count.
        test_recipe:
          setup:
            - "Segment HS: RIDE 1000m, city Heatville, ACTIVE, hazard 0"
            - "Athletes H1 and H2 each completed one RIDE activity matching HS (no opt-out) -> cell (Heatville, RIDE) has 2 contributions"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "hc_hm@x.com", display_name: "HC Hm", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { hc_hm: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${hc_hm}", name: "Heat Segment", sport_type: "RIDE", start_lat: 42.00, start_lng: -127.00, end_lat: 42.01, end_lng: -127.00, distance_m: 1000, city: "Heatville" }
              as: Athlete
              as_user_id: "${hc_hm}"
              captures: { seg_hm: $.data.id }
            - call: "POST /v1/segments/${seg_hm}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${hc_hm}"
            - call: "POST /v1/athletes"
              payload: { email: "h1_hm@x.com", display_name: "H1 Hm", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { h1_hm: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "h2_hm@x.com", display_name: "H2 Hm", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { h2_hm: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "h3_hm@x.com", display_name: "H3 Hm", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { h3_hm: $.data.id }
            - call: "POST /v1/athletes/${h1_hm}/activities"
              payload: { device_source: "wahoo-elemnt", sport_type: "RIDE", started_at: "2026-09-01T06:00:00Z", duration_s: 300, distance_m: 1000, track_points: [{lat: 42.00, lng: -127.00, t_offset_s: 0}, {lat: 42.01, lng: -127.00, t_offset_s: 300}], start_lat: 42.00, start_lng: -127.00, end_lat: 42.01, end_lng: -127.00, idempotency_key: "hm-1" }
              as: Athlete
              as_user_id: "${h1_hm}"
            - call: "POST /v1/athletes/${h2_hm}/activities"
              payload: { device_source: "wahoo-elemnt", sport_type: "RIDE", started_at: "2026-09-01T07:00:00Z", duration_s: 300, distance_m: 1000, track_points: [{lat: 42.00, lng: -127.00, t_offset_s: 0}, {lat: 42.01, lng: -127.00, t_offset_s: 300}], start_lat: 42.00, start_lng: -127.00, end_lat: 42.01, end_lng: -127.00, idempotency_key: "hm-2" }
              as: Athlete
              as_user_id: "${h2_hm}"
          trigger:
            - call: "GET /v1/heatmap?city=Heatville&sport_type=RIDE"
              as: Athlete
              as_user_id: "${h1_hm}"
              captures: { cells_before: $.data }
            - call: "POST /v1/athletes/${h3_hm}/activities"
              payload: { device_source: "wahoo-elemnt", sport_type: "RIDE", started_at: "2026-09-01T08:00:00Z", duration_s: 300, distance_m: 1000, track_points: [{lat: 42.00, lng: -127.00, t_offset_s: 0}, {lat: 42.01, lng: -127.00, t_offset_s: 300}], start_lat: 42.00, start_lng: -127.00, end_lat: 42.01, end_lng: -127.00, idempotency_key: "hm-3" }
              as: Athlete
              as_user_id: "${h3_hm}"
            - call: "GET /v1/heatmap?city=Heatville&sport_type=RIDE"
              as: Athlete
              as_user_id: "${h1_hm}"
              captures: { cells_after: $.data }
          assert:
            - "Before the 3rd activity: GET /v1/heatmap?city=Heatville returns [] (contribution_count 2 < MIN_CELL_COUNT 3)"
            - "After the 3rd activity: exactly 1 cell with city == Heatville, sport_type == RIDE, contribution_count == 3 (boundary >= 3 is inclusive)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: challenge_join_requires_club_membership
        grounds:
          - state_machines.ChallengeParticipation
          - entities.ClubMembership.fields.status
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: |
          Pair ChallengeParticipation x ClubMembership: joining an ACTIVE OPEN
          challenge is rejected unless the athlete's ClubMembership in the
          challenge's club is ACTIVE — a PENDING membership blocks the join.
        test_recipe:
          setup:
            - "Athlete XO owns club XC with join_policy APPROVAL"
            - "Athlete XM joined XC but membership is still PENDING (never approved)"
            - "Challenge XCH in XC is ACTIVE with join_mode OPEN, window 2026-09-01..2026-09-30"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "xo_dep@x.com", display_name: "XO Dep", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { xo_dep: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "xm_dep@x.com", display_name: "XM Dep", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { xm_dep: $.data.id }
            - call: "POST /v1/clubs"
              payload: { owner_id: "${xo_dep}", name: "Approval Club", sport_type: "RUN", join_policy: "APPROVAL" }
              as: Athlete
              as_user_id: "${xo_dep}"
              captures: { club_dep: $.data.id }
            - call: "POST /v1/clubs/${club_dep}/memberships"
              payload: { athlete_id: "${xm_dep}" }
              as: Athlete
              as_user_id: "${xm_dep}"
              captures: { mbr_dep: $.data.id }
            - call: "POST /v1/clubs/${club_dep}/challenges"
              payload: { name: "Members Only 10k", goal_type: "DISTANCE_M", goal_target: 10000, start_date: "2026-09-01", end_date: "2026-09-30", join_mode: "OPEN" }
              as: Athlete
              as_user_id: "${xo_dep}"
              captures: { ch_dep: $.data.id }
            - call: "POST /v1/clubs/${club_dep}/challenges/${ch_dep}/start"
              payload: {}
              as: Athlete
              as_user_id: "${xo_dep}"
          trigger:
            - call: "POST /v1/challenges/${ch_dep}/participations"
              payload: { athlete_id: "${xm_dep}" }
              as: Athlete
              as_user_id: "${xm_dep}"
              captures: { err_dep: $.data.error_id }
          assert:
            - "Join rejected: error_id == ERR_FORBIDDEN, HTTP 403 (ClubMembership.${mbr_dep}.status == PENDING blocks challenge participation)"
            - "No ChallengeParticipation row created for athlete ${xm_dep} in challenge ${ch_dep}"

      - name: beacon_requires_subscription_and_contact
        grounds:
          - state_machines.BeaconSession
          - entities.Subscription.fields.status
          - "errors[ERR_SUBSCRIPTION_REQUIRED]"
        distinguishing_aspect: |
          Pair BeaconSession x Subscription (different pair than challenge x
          membership): beacon creation by an athlete whose only subscription is
          CANCELLED fails the fiscal gate; adding an ACTIVE subscription but no
          SafetyContact then fails the safety gate — one resource gated by two
          different foreign states.
        test_recipe:
          setup:
            - "Athlete B has a CANCELLED subscription and zero safety contacts"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "b_beac@x.com", display_name: "B Beac", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { b_beac: $.data.id }
            - call: "POST /v1/athletes/${b_beac}/subscriptions"
              payload: { plan: "SUMMIT_MONTHLY", started_at: "2026-08-01T00:00:00Z", expires_at: "2026-12-01T00:00:00Z" }
              as: Athlete
              as_user_id: "${b_beac}"
              captures: { sub_beac: $.data.id }
            - call: "POST /v1/subscriptions/${sub_beac}/cancel"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/athletes/${b_beac}/beacon_sessions"
              payload: {}
              as: Athlete
              as_user_id: "${b_beac}"
              captures: { err_beac1: $.data.error_id }
            - call: "POST /v1/athletes/${b_beac}/subscriptions"
              payload: { plan: "SUMMIT_ANNUAL", started_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: Athlete
              as_user_id: "${b_beac}"
              captures: { sub_beac2: $.data.id }
            - call: "POST /v1/athletes/${b_beac}/beacon_sessions"
              payload: {}
              as: Athlete
              as_user_id: "${b_beac}"
              captures: { err_beac2: $.data.error_id }
            - call: "POST /v1/athletes/${b_beac}/safety_contacts"
              payload: { contact_email: "sos@x.com", label: "SOS" }
              as: Athlete
              as_user_id: "${b_beac}"
            - call: "POST /v1/athletes/${b_beac}/beacon_sessions"
              payload: {}
              as: Athlete
              as_user_id: "${b_beac}"
              captures: { beac_ok: $.data.id }
          assert:
            - "First beacon create: error_id == ERR_SUBSCRIPTION_REQUIRED, HTTP 402 (subscription CANCELLED)"
            - "Second beacon create (ACTIVE subscription, no contacts): error_id == ERR_SAFETY_VIOLATION, HTTP 422"
            - "Third beacon create (subscription + contact): succeeds, status == LIVE"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: segment_spatial_overlap_gate
        grounds:
          - calculations.segment_overlap_check
          - "errors[ERR_SEGMENT_OVERLAP]"
        distinguishing_aspect: |
          Geometric interval semantics on the Segment resource: activation is
          rejected only when BOTH endpoints of a same-sport ACTIVE segment sit
          within 50m (strict <) of the candidate's endpoints — one endpoint at
          30m and the other at 100m passes.
        test_recipe:
          setup:
            - "Athlete G owns ACTIVE segment G1: RIDE, start (43.000,-128.000), end (43.010,-128.000)"
            - "G also owns DRAFT segment G2: RIDE, start (43.0001,-128.000) ~11m from G1.start, end (43.011,-128.000) ~111m from G1.end"
            - "G also owns DRAFT segment G3: RIDE, start (43.0001,-128.000), end (43.0101,-128.000) — both endpoints ~11m from G1's"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "g_ov@x.com", display_name: "G Ov", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { g_ov: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${g_ov}", name: "Overlap Base", sport_type: "RIDE", start_lat: 43.000, start_lng: -128.000, end_lat: 43.010, end_lng: -128.000, distance_m: 1100, city: "Overtown" }
              as: Athlete
              as_user_id: "${g_ov}"
              captures: { seg_g1: $.data.id }
            - call: "POST /v1/segments/${seg_g1}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${g_ov}"
            - call: "POST /v1/segments"
              payload: { creator_id: "${g_ov}", name: "Overlap Half", sport_type: "RIDE", start_lat: 43.0001, start_lng: -128.000, end_lat: 43.011, end_lng: -128.000, distance_m: 1200, city: "Overtown" }
              as: Athlete
              as_user_id: "${g_ov}"
              captures: { seg_g2: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${g_ov}", name: "Overlap Full", sport_type: "RIDE", start_lat: 43.0001, start_lng: -128.000, end_lat: 43.0101, end_lng: -128.000, distance_m: 1100, city: "Overtown" }
              as: Athlete
              as_user_id: "${g_ov}"
              captures: { seg_g3: $.data.id }
          trigger:
            - call: "POST /v1/segments/${seg_g2}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${g_ov}"
              captures: { g2_state: $.data.status }
            - call: "POST /v1/segments/${seg_g3}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${g_ov}"
              captures: { err_g3: $.data.error_id }
          assert:
            - "Segment.${seg_g2}.status == ACTIVE (only start overlaps; end 111m > 50m)"
            - "Segment.${seg_g3} activation rejected: error_id == ERR_SEGMENT_OVERLAP, HTTP 409 (both endpoints within 50m)"

      - name: event_time_overlap_half_open
        grounds:
          - calculations.event_time_overlap_check
          - "errors[ERR_EVENT_TIME_OVERLAP]"
        distinguishing_aspect: |
          Different resource (VirtualEvent) and different interval semantics
          (half-open 1-hour time windows, adjacency allowed) versus the
          segment's geometric both-endpoints rule: an event at 10:00 overlaps
          the 09:00 event; an event at exactly 10:00+3600s == 10:00 wait — the
          back-to-back 10:00 start equals existing_end and is allowed.
        test_recipe:
          setup:
            - "Athlete EO owns club EC (OPEN); segment ES ACTIVE hazard 0 (created by EO)"
            - "Event E1 PUBLISHED at 2026-09-05T09:00:00Z (occupies [09:00, 10:00))"
            - "Clock pinned at 2026-09-01T00:00:00Z (startup default; all events in the future)"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "eo_ov@x.com", display_name: "EO Ov", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { eo_ov: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${eo_ov}", name: "Event Sprint", sport_type: "RIDE", start_lat: 44.00, start_lng: -129.00, end_lat: 44.01, end_lng: -129.00, distance_m: 1000, city: "Eventville" }
              as: Athlete
              as_user_id: "${eo_ov}"
              captures: { seg_ev: $.data.id }
            - call: "POST /v1/segments/${seg_ev}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${eo_ov}"
            - call: "POST /v1/clubs"
              payload: { owner_id: "${eo_ov}", name: "Event Club", sport_type: "RIDE", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${eo_ov}"
              captures: { club_ev: $.data.id }
            - call: "POST /v1/clubs/${club_ev}/events"
              payload: { name: "Nine AM Race", segment_id: "${seg_ev}", scheduled_at: "2026-09-05T09:00:00Z", capacity: 10 }
              as: Athlete
              as_user_id: "${eo_ov}"
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /v1/clubs/${club_ev}/events"
              payload: { name: "Ten AM Race", segment_id: "${seg_ev}", scheduled_at: "2026-09-05T10:00:00Z", capacity: 10 }
              as: Athlete
              as_user_id: "${eo_ov}"
              captures: { ev2: $.data.id }
            - call: "POST /v1/clubs/${club_ev}/events"
              payload: { name: "Nine Thirty Race", segment_id: "${seg_ev}", scheduled_at: "2026-09-05T09:30:00Z", capacity: 10 }
              as: Athlete
              as_user_id: "${eo_ov}"
              captures: { err_ev: $.data.error_id }
          assert:
            - "Event at 10:00 created successfully (half-open: new_start == existing_end is allowed)"
            - "Event at 09:30 rejected: error_id == ERR_EVENT_TIME_OVERLAP, HTTP 409 (intersects [09:00,10:00))"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rsvp_count_invariant
        grounds:
          - state_machines.EventRSVP
          - entities.VirtualEvent.fields.rsvp_count
        distinguishing_aspect: |
          Conserved quantity: VirtualEvent.rsvp_count. A forward create (GOING)
          paired with its compensating decline returns rsvp_count exactly to
          its pre-create value; a subsequent decline + rejoin pair also nets to
          zero. count(GOING RSVPs) == rsvp_count at every step.
        test_recipe:
          setup:
            - "Athlete IO owns club IC (OPEN) with ACTIVE segment IS; event IE PUBLISHED capacity 5 at 2026-09-06T09:00:00Z"
            - "Athlete IM is an ACTIVE member of IC; IE.rsvp_count == 0"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "io_inv@x.com", display_name: "IO Inv", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { io_inv: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "im_inv@x.com", display_name: "IM Inv", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { im_inv: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${io_inv}", name: "Invariant Sprint", sport_type: "RIDE", start_lat: 45.00, start_lng: -130.00, end_lat: 45.01, end_lng: -130.00, distance_m: 1000, city: "Invville" }
              as: Athlete
              as_user_id: "${io_inv}"
              captures: { seg_inv: $.data.id }
            - call: "POST /v1/segments/${seg_inv}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${io_inv}"
            - call: "POST /v1/clubs"
              payload: { owner_id: "${io_inv}", name: "Invariant Club", sport_type: "RIDE", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${io_inv}"
              captures: { club_inv: $.data.id }
            - call: "POST /v1/clubs/${club_inv}/memberships"
              payload: { athlete_id: "${im_inv}" }
              as: Athlete
              as_user_id: "${im_inv}"
            - call: "POST /v1/clubs/${club_inv}/events"
              payload: { name: "Invariant Race", segment_id: "${seg_inv}", scheduled_at: "2026-09-06T09:00:00Z", capacity: 5 }
              as: Athlete
              as_user_id: "${io_inv}"
              captures: { ev_inv: $.data.id }
          trigger:
            - call: "POST /v1/events/${ev_inv}/rsvps"
              payload: { athlete_id: "${im_inv}" }
              as: Athlete
              as_user_id: "${im_inv}"
              captures: { rsvp_inv: $.data.id }
            - call: "GET /v1/events/${ev_inv}"
              as: Athlete
              as_user_id: "${io_inv}"
              captures: { cnt_1: $.data.rsvp_count }
            - call: "POST /v1/events/${ev_inv}/rsvps/${rsvp_inv}/decline"
              payload: {}
              as: Athlete
              as_user_id: "${im_inv}"
            - call: "GET /v1/events/${ev_inv}"
              as: Athlete
              as_user_id: "${io_inv}"
              captures: { cnt_2: $.data.rsvp_count }
            - call: "POST /v1/events/${ev_inv}/rsvps/${rsvp_inv}/rejoin"
              payload: {}
              as: Athlete
              as_user_id: "${im_inv}"
            - call: "GET /v1/events/${ev_inv}"
              as: Athlete
              as_user_id: "${io_inv}"
              captures: { cnt_3: $.data.rsvp_count }
          assert:
            - "After create: VirtualEvent.${ev_inv}.rsvp_count == 1"
            - "After decline (compensation): rsvp_count == 0 (exactly the pre-create value)"
            - "After rejoin: rsvp_count == 1 and EventRSVP.${rsvp_inv}.status == GOING"

      - name: safety_score_invariant
        grounds:
          - state_machines.Flag
          - entities.Athlete.fields.safety_score
        distinguishing_aspect: |
          Different conserved quantity (Athlete.safety_score, not a count): an
          uphold (-10) followed by a reject (+5) on a second flag nets to -5,
          NOT to zero — the invariant is the pinned per-outcome arithmetic
          bounded to [0,100]: score_final == clamp(100 - 10*upheld + 5*rejected).
          With 1 uphold and 1 reject: exactly 95.
        test_recipe:
          setup:
            - "Athlete T (safety_score 100) and athlete W exist"
            - "Segment ST: RUN 1000m ACTIVE; T has two COMPLETED RUN activities each with a 100s effort on ST (E1, E2)"
            - "W flagged both efforts (flags FL1 on E1, FL2 on E2)"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "t_inv@x.com", display_name: "T Inv", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { t_inv: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "w_inv@x.com", display_name: "W Inv", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { w_inv: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${w_inv}", name: "Score Run 1k", sport_type: "RUN", start_lat: 46.00, start_lng: -131.00, end_lat: 46.01, end_lng: -131.00, distance_m: 1000, city: "Scoreville" }
              as: Athlete
              as_user_id: "${w_inv}"
              captures: { seg_inv2: $.data.id }
            - call: "POST /v1/segments/${seg_inv2}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${w_inv}"
            - call: "POST /v1/athletes/${t_inv}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T06:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 46.00, lng: -131.00, t_offset_s: 0}, {lat: 46.01, lng: -131.00, t_offset_s: 100}], start_lat: 46.00, start_lng: -131.00, end_lat: 46.01, end_lng: -131.00, idempotency_key: "sc-1", effort_hints: [{segment_id: "${seg_inv2}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${t_inv}"
              captures: { act_sc1: $.data.id }
            - call: "POST /v1/athletes/${t_inv}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T07:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 46.00, lng: -131.00, t_offset_s: 0}, {lat: 46.01, lng: -131.00, t_offset_s: 100}], start_lat: 46.00, start_lng: -131.00, end_lat: 46.01, end_lng: -131.00, idempotency_key: "sc-2", effort_hints: [{segment_id: "${seg_inv2}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${t_inv}"
              captures: { act_sc2: $.data.id }
            - call: "GET /v1/efforts?activity_id=${act_sc1}"
              as: Athlete
              as_user_id: "${t_inv}"
              captures: { eff_sc1: "$.data[0].id" }
            - call: "GET /v1/efforts?activity_id=${act_sc2}"
              as: Athlete
              as_user_id: "${t_inv}"
              captures: { eff_sc2: "$.data[0].id" }
            - call: "POST /v1/efforts/${eff_sc1}/flags"
              payload: { reporter_id: "${w_inv}", reason: "IMPOSSIBLE_TIME" }
              as: Athlete
              as_user_id: "${w_inv}"
              captures: { fl_sc1: $.data.id }
            - call: "POST /v1/efforts/${eff_sc2}/flags"
              payload: { reporter_id: "${w_inv}", reason: "VEHICLE_ASSISTED" }
              as: Athlete
              as_user_id: "${w_inv}"
              captures: { fl_sc2: $.data.id }
          trigger:
            - call: "POST /v1/flags/${fl_sc1}/uphold"
              payload: {}
              as: Moderator
            - call: "GET /v1/athletes/${t_inv}"
              as: Athlete
              as_user_id: "${t_inv}"
              captures: { score_mid: $.data.safety_score }
            - call: "POST /v1/flags/${fl_sc2}/reject"
              payload: {}
              as: Moderator
            - call: "GET /v1/athletes/${t_inv}"
              as: Athlete
              as_user_id: "${t_inv}"
              captures: { score_end: $.data.safety_score }
          assert:
            - "After uphold: Athlete.${t_inv}.safety_score == 90 (100 - 10)"
            - "After reject on the other flag: safety_score == 95 (90 + 5, not 100 — the invariant is the pinned per-outcome arithmetic, not round-trip zero)"
            - "SegmentEffort.${eff_sc1}.flag_status == EXCLUDED and SegmentEffort.${eff_sc2}.flag_status == ELIGIBLE"
