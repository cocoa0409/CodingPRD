# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  -  SKILL.md Section 1.9 (Scaffold Corner Design)
#
# Task 2311: Multiemployer Plan Withdrawal Liability (contributing employer)
#
# Breadth probe. One instance per applicable row of
# references/claim-extraction-guide.md, walked against Sections 1.1-1.7 of
# SCAFFOLD.yaml. Instances whose claim is already fully driven by a depth probe
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an excluded_because stub naming the
# difficulty instance that subsumes them and no test_recipe.
#
# All fixtures assume the mandatory default logical clock 2026-08-01T00:00:00Z
# unless an instance advances it with POST /_clock/set_current_utc, which only
# ever moves strictly forward.
#
# Actor identities used throughout:
#   fa-001  FundAdministrator      act-001  PlanActuary (certifier)
#   tr-001  PlanTrustee (issuer)   tr-002  PlanTrustee (review decider)
#   arb-001 Arbitrator             ${emp_id} EmployerRepresentative (entity-backed)
# =============================================================================

scaffold_corner_design:

  # =======================================================================
  # SECTION: entities - field surface, defaults, enum guards, listing and parentage
  # for the twelve rows of this domain under a flat topology.
  # =======================================================================
  - section: entities
    instances:

      - name: plan_creation_returns_every_declared_field_with_zeroed_counters
        claim_type: Creation
        grounds:
          - "entities.Plan.fields.employer_count"
          - "entities.Plan.fields.issued_assessment_count"
          - "endpoints[POST /plans]"
          - "response_envelope.success"
        distinguishing_aspect: |
          A plan is the root of the whole graph and its two computed counters are the
          only entity fields that are derived from rows that do not exist yet. If the
          implementation seeds them from the request body, or omits them from the create
          response and only fills them on a later GET, this fails.
        test_recipe:
          setup:
            - "No rows exist. The logical clock is at the mandatory default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { name: "Stagehands Local 22 Pension Fund", industry: "ENTERTAINMENT", allocation_method: "ROLLING_5", de_minimis_variant: "PLAN_ELECTED_HIGH", interest_rate_bps: 650, unattributable_uvb_cents: 25000000, mass_withdrawal_declared: true }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
          assert:
            - "HTTP 201 and meta.response_type == \"object\"."
            - "data.name == \"Stagehands Local 22 Pension Fund\", data.industry == \"ENTERTAINMENT\", data.allocation_method == \"ROLLING_5\", data.de_minimis_variant == \"PLAN_ELECTED_HIGH\", data.interest_rate_bps == 650, data.unattributable_uvb_cents == 25000000, data.mass_withdrawal_declared == true."
            - "data.employer_count == 0 and data.issued_assessment_count == 0."
            - "data.id is a non-empty string, data.version == 1, data.created_at == \"2026-08-01T00:00:00Z\", data.updated_at == \"2026-08-01T00:00:00Z\"."

      - name: plan_creation_omitting_optional_fields_applies_the_declared_defaults
        claim_type: Defaults
        grounds:
          - "entities.Plan.fields.industry"
          - "entities.Plan.fields.allocation_method"
          - "entities.Plan.fields.de_minimis_variant"
          - "entities.Plan.fields.unattributable_uvb_cents"
          - "entities.Plan.fields.mass_withdrawal_declared"
        distinguishing_aspect: |
          Every default on Plan changes a downstream formula: industry picks the rule
          variant, allocation_method picks one of four gross-share formulas, and
          de_minimis_variant picks the cap/phase-out pair. A server that defaults
          allocation_method to MODIFIED_PRESUMPTIVE (the commoner real-world election)
          instead of the declared PRESUMPTIVE silently changes every later assessment.
        test_recipe:
          setup:
            - "No rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { name: "Bakery Drivers Joint Pension Trust", interest_rate_bps: 700 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
          assert:
            - "HTTP 201."
            - "data.industry == \"GENERAL\", data.allocation_method == \"PRESUMPTIVE\", data.de_minimis_variant == \"STATUTORY\"."
            - "data.unattributable_uvb_cents == 0 and data.mass_withdrawal_declared == false."
            - "data.employer_count == 0 and data.issued_assessment_count == 0."

      - name: employer_creation_missing_required_ein_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Employer.fields.ein"
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          ein is required with no default and is also the uniqueness key at priority 12.
          A server that treats a missing ein as an empty string would accept the first
          such employer and then reject the second one with ERR_DUPLICATE_EIN, which is
          the wrong error at the wrong priority.
        test_recipe:
          setup:
            - "A plan and a controlled group exist."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
          trigger:
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", obligation_start_year: 2021 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "No Employer row is created: GET /employers?plan_id=${plan_id} returns total_count == 0."
            - "GET /plans/${plan_id} still reports employer_count == 0."

      - name: plan_creation_with_an_unknown_industry_value_is_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Plan.fields.industry"
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          The industry enum is closed at four members and drives the rules_variant
          branch. An implementation that stores unknown strings verbatim would later fall
          through to GENERAL_RULES and silently grant a construction employer the 70%
          decline test.
        test_recipe:
          setup:
            - "No rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { name: "Maritime Trades Fund", industry: "MARITIME", interest_rate_bps: 700 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "No Plan row is created."

      - name: contribution_record_with_an_inverted_plan_year_interval_is_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.ContributionRecord.fields.plan_year_end"
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          plan_year_start <= plan_year_end is a body-shape rule at priority 3, so it must
          fire before the priority-11 overlap scan and before the priority-7 stale-version
          check. An implementation that normalises the interval by swapping the endpoints
          would accept the row and then spread contributions over the wrong plan years.
        test_recipe:
          setup:
            - "A plan, a controlled group and one employer at version 1 exist."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
          trigger:
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2025, plan_year_end: 2021, contribution_base_units: 250000, contribution_amount_cents: 250000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "GET /contribution-records?employer_id=${emp_id} returns total_count == 0."
            - "GET /employers/${emp_id} still reports version == 1: a rejected write never bumps the OCC counter."

      - name: employer_get_by_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_EMPLOYER_NOT_FOUND]"
        distinguishing_aspect: |
          The 404 must be raised by the path-id resolution pass at priority 4, not by an
          empty-database shortcut: one real employer already exists, so a server that
          returns the only row it has, or a 200 with a null body, fails.
        test_recipe:
          setup:
            - "A plan, a controlled group and one employer exist."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
          trigger:
            - call: "GET /employers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_EMPLOYER_NOT_FOUND\"."
            - "GET /employers/${emp_id} still returns HTTP 200 for the real row."

      - name: valuation_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "endpoints[GET /plan-year-valuations]"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: |
          total_count must count the whole filtered set, not the returned page, and
          has_more must be derived from offset + len(data) < total_count. The second page
          is deliberately short (one row against limit 2) so an implementation that
          computes has_more as len(data) == limit gets the right answer on page 1 and the
          wrong answer on page 2.
        test_recipe:
          setup:
            - "One plan with three certified valuations for plan years 2021, 2022 and 2023."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2021, measurement_window_start: "2021-01-01T00:00:00Z", measurement_window_end: "2021-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2022, measurement_window_start: "2022-01-01T00:00:00Z", measurement_window_end: "2022-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2023, measurement_window_start: "2023-01-01T00:00:00Z", measurement_window_end: "2023-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
          trigger:
            - call: "GET /plan-year-valuations"
              payload: { plan_id: "${plan_id}", limit: 2, offset: 0 }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { first_page_head: "$.data[0].plan_year" }
            - call: "GET /plan-year-valuations"
              payload: { plan_id: "${plan_id}", limit: 2, offset: 2 }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { second_page_head: "$.data[0].plan_year" }
          assert:
            - "First call: HTTP 200, meta.response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0."
            - "Second call: HTTP 200, len(data) == 1, total_count == 3, has_more == false, limit == 2, offset == 2."
            - "The three plan_year values returned across the two pages are exactly {2021, 2022, 2023} with no row repeated."

      - name: employer_retrieval_returns_the_stored_registration_fields
        claim_type: Retrieval
        grounds:
          - "endpoints[GET /employers/{employer_id}]"
          - "entities.Employer.fields.status"
          - "entities.Employer.fields.outstanding_liability_cents"
        distinguishing_aspect: |
          The direct-attribution dollar fields are inputs that only one of the four
          allocation methods reads, so they are easy to drop on the read path. The
          computed posture fields must also come back at their initial values rather than
          as nulls.
        test_recipe:
          setup:
            - "A plan, a controlled group and one employer carrying both direct-attribution amounts."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 3, directly_attributed_vested_benefits_cents: 500000000, directly_attributed_assets_cents: 200000000 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
          trigger:
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: PlanTrustee
              as_user_id: "tr-001"
          assert:
            - "HTTP 200."
            - "data.plan_id == ${plan_id}, data.controlled_group_id == ${cg_id}, data.legal_name == \"Meridian Steel Erectors LLC\", data.ein == \"410000101\", data.obligation_start_year == 2021."
            - "data.covered_work_status == \"PERFORMING\", data.cba_count == 3, data.directly_attributed_vested_benefits_cents == 500000000, data.directly_attributed_assets_cents == 200000000."
            - "data.status == \"CONTRIBUTING\", data.outstanding_liability_cents == 0, data.credit_watch == false, data.delinquency_strikes == 0, data.ceased_cba_count == 0, data.obligation_end_year == null, data.version == 1."

      - name: contribution_record_system_fields_stamp_the_employer_version_at_apply
        claim_type: System Fields
        grounds:
          - "entities.ContributionRecord.fields.employer_version_at_apply"
          - "concurrency_rules.contribution-record-stale-employer"
          - "endpoints[POST /contribution-records]"
        distinguishing_aspect: |
          employer_version_at_apply must record the Employer.version AFTER the write bumps
          it, not the value the client sent in expected_employer_version. Filing a second
          record makes the two numbers differ (sent 2, stamped 3), so an implementation
          that echoes the request field passes on the first record and fails here.
        test_recipe:
          setup:
            - "A plan, a controlled group and one employer. One contribution record for plan years 2016-2020 has already been filed, so the employer is at version 2."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2016, plan_year_end: 2020, contribution_base_units: 100000, contribution_amount_cents: 100000000, contribution_rate_cents_per_cbu: 400, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v2: "$.data.version" }
          trigger:
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2021, plan_year_end: 2025, contribution_base_units: 250000, contribution_amount_cents: 250000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v2}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { rec2_id: "$.data.id" }
          assert:
            - "HTTP 201 with data.employer_version_at_apply == 3 while the request carried expected_employer_version == 2."
            - "data.status == \"CERTIFIED\", data.supersedes_record_id == null, data.version == 1, data.created_at == \"2026-08-01T00:00:00Z\"."
            - "GET /employers/${emp_id} now reports version == 3."
            - "The two intervals 2016-2020 and 2021-2025 merely touch, so no ERR_CONTRIBUTION_PERIOD_OVERLAP is raised."

      - name: withdrawal_event_computed_rules_variant_follows_the_plan_industry
        claim_type: Computed Fields
        grounds:
          - "entities.WithdrawalEvent.fields.rules_variant"
          - "calculations.withdrawal_type_determination"
          - "state_machines.WithdrawalEvent.transitions.REPORTED_to_COMPLETE_DETERMINED"
        distinguishing_aspect: |
          rules_variant is derived from Plan.industry two hops away (event -> employer ->
          plan) and is fixed at creation. An implementation that leaves it at the
          GENERAL_RULES default and only consults Plan.industry inside determine would
          return the right determined_type but the wrong audit field.
        test_recipe:
          setup:
            - "A CONSTRUCTION plan whose employer is still performing covered work, plus the certified plan-year-2025 valuation that withdrawal determination requires."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers Building Trades Fund", industry: "CONSTRUCTION", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2025, measurement_window_start: "2025-01-01T00:00:00Z", measurement_window_end: "2025-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
          trigger:
            - call: "POST /withdrawal-events"
              payload: { employer_id: "${emp_id}", cessation_date: "2026-06-30T00:00:00Z", withdrawal_plan_year: 2026, reported_cause: "COVERED_WORK_CEASED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { we_id: "$.data.id" }
            - call: "POST /withdrawal-events/${we_id}/determine"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
          assert:
            - "Creation: HTTP 201 with data.rules_variant == \"CONSTRUCTION_RULES\", data.status == \"REPORTED\", data.determined_type == \"NONE\", data.partial_withdrawal_fraction == 0.0000, data.determined_at == null."
            - "Determination: HTTP 200 with data.rules_variant == \"CONSTRUCTION_RULES\", data.determined_type == \"COMPLETE\", data.partial_withdrawal_fraction == 1.0000, data.status == \"COMPLETE_DETERMINED\", data.determined_at == \"2026-08-01T00:00:00Z\"."
            - "GET /employers/${emp_id} reports status == \"COMPLETE_WITHDRAWN\" and obligation_end_year == 2026."

      - name: employer_creation_with_an_unknown_plan_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_PLAN_NOT_FOUND]"
          - "entities.Employer.fields.plan_id"
        distinguishing_aspect: |
          Body foreign keys are validated in the order §1.5 declares them, so an unknown
          plan_id must surface ERR_PLAN_NOT_FOUND even though controlled_group_id is
          valid. A server that validates FKs in map-iteration order, or that only checks
          the first FK it happens to dereference, gets a coin flip here.
        test_recipe:
          setup:
            - "A controlled group exists; no plan with the probed id exists."
          setup_api_calls:
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
          trigger:
            - call: "POST /employers"
              payload: { plan_id: "00000000-0000-0000-0000-0000000000a1", controlled_group_id: "${cg_id}", legal_name: "Orphan Fabricators Inc", ein: "410000199", obligation_start_year: 2021 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_PLAN_NOT_FOUND\"."
            - "GET /employers returns total_count == 0."

      - name: asset_sale_with_an_unknown_buyer_controlled_group_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_CONTROLLED_GROUP_NOT_FOUND]"
          - "complexity_profile.entity_topology"
        distinguishing_aspect: |
          The topology is flat, so AssetSaleTransaction reaches sideways to an Employer and
          to a ControlledGroup that need not be related to each other. The seller resolves
          and the buyer does not: the second FK in the declared order must still be
          checked, and its own error code (not the employer's) must come back.
        test_recipe:
          setup:
            - "A plan, a controlled group and one employer exist; no controlled group with the probed id exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
          trigger:
            - call: "POST /asset-sale-transactions"
              payload: { seller_employer_id: "${emp_id}", buyer_controlled_group_id: "00000000-0000-0000-0000-0000000000b2", closing_date: "2026-05-01T00:00:00Z", closing_plan_year: 2026, purchase_price_cents: 300000000, bond_amount_cents: 30000000, buyer_assumes_contribution_obligation: true, workforce_continuity_pct: 0.8, asset_continuity_pct: 0.6, customer_continuity_pct: 0.6 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_CONTROLLED_GROUP_NOT_FOUND\"."
            - "GET /asset-sale-transactions?seller_employer_id=${emp_id} returns total_count == 0."

  # =======================================================================
  # SECTION: state_machines - the twelve declared machines, including the three
  # parallel dimensions of LiabilityAssessment and the cyclic Arbitration.
  # =======================================================================
  - section: state_machines
    instances:

      - name: valuation_certify_moves_a_draft_to_certified_and_stamps_the_certifier
        claim_type: Valid Transition
        grounds:
          - "state_machines.PlanYearValuation.transitions.DRAFT_to_CERTIFIED"
          - "entities.PlanYearValuation.fields.certified_by_user_id"
          - "entities.PlanYearValuation.fields.unallocated_uvb_cents"
        distinguishing_aspect: |
          Certification is the only hop that seeds the conserved PLAN_UVB_ALLOCATION pair
          and the only place certified_by_user_id is captured, and that id is later the
          segregation-of-duties key for issuance. A server that certifies without
          recording the actor cannot enforce priority 9 at all.
        test_recipe:
          setup:
            - "A plan and one DRAFT valuation for plan year 2021 created with certify_on_create omitted."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2021, measurement_window_start: "2021-01-01T00:00:00Z", measurement_window_end: "2021-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: false }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { val_id: "$.data.id" }
          trigger:
            - call: "POST /plan-year-valuations/${val_id}/certify"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
          assert:
            - "HTTP 200 with data.status == \"CERTIFIED\"."
            - "data.certified_by_user_id == \"act-001\" and data.certified_at == \"2026-08-01T00:00:00Z\"."
            - "data.certify_on_create_used == false: the audit flag distinguishes the two-step path from the one-shot path."
            - "data.allocated_uvb_cents == 0 and data.unallocated_uvb_cents == 10000000000, so allocated + unallocated == uvb_total_cents."
            - "data.version == 2."

      - name: certifying_the_same_valuation_twice_is_rejected
        claim_type: Idempotency
        grounds:
          - "state_machines.PlanYearValuation.transitions.DRAFT_to_CERTIFIED"
          - "validations[priority=8]"
          - "errors[ERR_VALUATION_ALREADY_CERTIFIED]"
        distinguishing_aspect: |
          A re-certification would re-stamp certified_by_user_id and could hand issuance
          authority to a different actuary, so the second call must be a 409 rather than a
          no-op 200. An implementation that treats certify as idempotent would let a
          colluding pair of users slip past the segregation-of-duties check.
        test_recipe:
          setup:
            - "A plan and one valuation for plan year 2021 that has already been certified by act-001."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2021, measurement_window_start: "2021-01-01T00:00:00Z", measurement_window_end: "2021-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: false }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { val_id: "$.data.id" }
            - call: "POST /plan-year-valuations/${val_id}/certify"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
          trigger:
            - call: "POST /plan-year-valuations/${val_id}/certify"
              payload: {}
              as: PlanActuary
              as_user_id: "act-002"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_VALUATION_ALREADY_CERTIFIED\"."
            - "GET /plan-year-valuations/${val_id} still reports certified_by_user_id == \"act-001\", certified_at == \"2026-08-01T00:00:00Z\" and version == 2."

      - name: a_new_valuation_and_a_new_withdrawal_event_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - "state_machines.PlanYearValuation.initial_state"
          - "state_machines.WithdrawalEvent.initial_state"
          - "entities.WithdrawalEvent.fields.determined_type"
        distinguishing_aspect: |
          Both rows are created by endpoints that can also do work (certify_on_create,
          and determination one call later), so the untouched initial state is easy to
          over-write. Every decline-test audit field must start at its zero value rather
          than null, because the 70% test writes all of them at once and a partially
          populated row would hide which pass produced which number.
        test_recipe:
          setup:
            - "A plan, a controlled group and one employer exist."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
          trigger:
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2021, measurement_window_start: "2021-01-01T00:00:00Z", measurement_window_end: "2021-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: false }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { val_id: "$.data.id" }
            - call: "POST /withdrawal-events"
              payload: { employer_id: "${emp_id}", cessation_date: "2026-06-30T00:00:00Z", withdrawal_plan_year: 2026, reported_cause: "CONTRIBUTION_OBLIGATION_CEASED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { we_id: "$.data.id" }
          assert:
            - "Valuation: HTTP 201 with data.status == \"DRAFT\", data.certified_by_user_id == null, data.certified_at == null, data.certify_on_create_used == false, data.allocated_uvb_cents == 0, data.unallocated_uvb_cents == 0."
            - "Withdrawal event: HTTP 201 with data.status == \"REPORTED\", data.determined_type == \"NONE\", data.rules_variant == \"GENERAL_RULES\", data.ceased_cba_count == 0."
            - "Withdrawal event: data.high_base_year_average_cbu == 0.0000, data.testing_period_average_cbu == 0.0000, data.decline_ratio == 0.000000, data.base_year_one == null, data.base_year_two == null, data.partial_withdrawal_fraction == 0.0000."

      - name: a_no_withdrawal_event_is_terminal_and_rejects_determine_and_assessment
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.WithdrawalEvent.terminal_states"
          - "calculations.withdrawal_type_determination"
          - "errors[ERR_WITHDRAWAL_ALREADY_DETERMINED]"
          - "errors[ERR_NO_WITHDRAWAL_DETERMINED]"
        distinguishing_aspect: |
          NO_WITHDRAWAL is reached by a successful determination that finds nothing, so the
          row looks 'processed' while carrying determined_type NONE. Both doors out of it
          must be shut, and with two DIFFERENT codes: re-determination is a state error on
          the event, assessment creation is a semantic refusal to price a non-withdrawal.
        test_recipe:
          setup:
            - "A CONSTRUCTION plan whose employer has already CEASED covered work, plus the certified plan-year-2025 valuation. The event was determined once and landed in NO_WITHDRAWAL because construction rules require continued covered work."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers Building Trades Fund", industry: "CONSTRUCTION", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "CEASED", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2025, measurement_window_start: "2025-01-01T00:00:00Z", measurement_window_end: "2025-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /withdrawal-events"
              payload: { employer_id: "${emp_id}", cessation_date: "2026-06-30T00:00:00Z", withdrawal_plan_year: 2026, reported_cause: "CONTRIBUTION_OBLIGATION_CEASED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { we_id: "$.data.id" }
            - call: "POST /withdrawal-events/${we_id}/determine"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
              captures: { we_status: "$.data.status" }
          trigger:
            - call: "POST /withdrawal-events/${we_id}/determine"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
              captures: { err_redetermine: "$.data.error_id" }
            - call: "POST /liability-assessments"
              payload: { withdrawal_event_id: "${we_id}" }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { err_assess: "$.data.error_id" }
          assert:
            - "Setup determination: data.determined_type == \"NONE\", data.partial_withdrawal_fraction == 0.0000, data.status == \"NO_WITHDRAWAL\"; GET /employers/${emp_id} still reports status == \"CONTRIBUTING\" and obligation_end_year == null."
            - "Re-determination: HTTP 409 with data.error_id == \"ERR_WITHDRAWAL_ALREADY_DETERMINED\"."
            - "Assessment creation: HTTP 409 with data.error_id == \"ERR_NO_WITHDRAWAL_DETERMINED\", not ERR_WITHDRAWAL_NOT_DETERMINED."
            - "GET /liability-assessments?withdrawal_event_id=${we_id} returns total_count == 0."

      - name: assessment_creation_before_determination_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.WithdrawalEvent.transitions.REPORTED_to_COMPLETE_DETERMINED"
          - "validations[priority=8]"
          - "errors[ERR_WITHDRAWAL_NOT_DETERMINED]"
        distinguishing_aspect: |
          Everything the assessment needs (valuations, contribution history) is already in
          place, so the only thing standing between the request and a priced assessment is
          the REPORTED status. This separates ERR_WITHDRAWAL_NOT_DETERMINED from its
          look-alike ERR_NO_WITHDRAWAL_DETERMINED, which the sibling instance covers.
        test_recipe:
          setup:
            - "The full baseline: plan, controlled group, employer, certified valuations 2021-2025, one contribution record for 2021-2025, and a REPORTED withdrawal event for plan year 2026 that has NOT been determined."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2021, measurement_window_start: "2021-01-01T00:00:00Z", measurement_window_end: "2021-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2022, measurement_window_start: "2022-01-01T00:00:00Z", measurement_window_end: "2022-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2023, measurement_window_start: "2023-01-01T00:00:00Z", measurement_window_end: "2023-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2024, measurement_window_start: "2024-01-01T00:00:00Z", measurement_window_end: "2024-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2025, measurement_window_start: "2025-01-01T00:00:00Z", measurement_window_end: "2025-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2021, plan_year_end: 2025, contribution_base_units: 250000, contribution_amount_cents: 250000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "POST /withdrawal-events"
              payload: { employer_id: "${emp_id}", cessation_date: "2026-06-30T00:00:00Z", withdrawal_plan_year: 2026, reported_cause: "CONTRIBUTION_OBLIGATION_CEASED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { we_id: "$.data.id" }
          trigger:
            - call: "POST /liability-assessments"
              payload: { withdrawal_event_id: "${we_id}" }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_WITHDRAWAL_NOT_DETERMINED\"."
            - "GET /withdrawal-events/${we_id} still reports status == \"REPORTED\" and determined_at == null."

      - name: a_draft_assessment_starts_in_three_dimensions_and_rejects_a_review_request
        claim_type: Initial State
        grounds:
          - "state_machines.LiabilityAssessment.initial_state"
          - "complexity_profile.state_machine_shape"
          - "errors[ERR_ASSESSMENT_NOT_ISSUED]"
        distinguishing_aspect: |
          The assessment carries three independent state fields, and a DRAFT row must sit
          at the initial value of all three at once while already carrying the full
