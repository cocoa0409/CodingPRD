          - entities.SORReconciliationRun.fields.field_mismatch_count
        distinguishing_aspect: "One run exercises all three diff buckets at once: 1 matched, 1 FIELD_MISMATCH (wrong servicer), 1 PLATFORM_ONLY (unknown MIN), 1 REGISTRY_ONLY (loan absent from records); match_rate = 1 / max(1, 3 + 1) = 0.2500."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Members A (org 1000000) and B (org 1000001) ACTIVE with signers."
            - "A registers loans L1 (serial 1, min 100000000000000016) and L2 (serial 2, min 100000000000000024)."
            - "L2's servicing transferred A -> B (so B is L2's servicer; A remains investor)."
            - "B submits a run with 3 records: L1 with correct orgs (match), L2 with servicer org 1000000 (mismatch — B services it), unknown min 999999999999999999 (platform-only). A is not involved; L2 appears in records so no registry_only for B's portfolio... L2 serviced by B IS in records. B's portfolio: L2 (servicer). Registry_only = 0."
