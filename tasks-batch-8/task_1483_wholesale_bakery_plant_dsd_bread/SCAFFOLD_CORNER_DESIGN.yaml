            - call: "POST /bakery/store-orders/${ord}/request-amendment"
              payload: { lines: [ { product_id: "${pa}", qty: 130 } ], expected_store_order_version: "${ov2}" }
              as: StoreReceiver
              as_user_id: "${st}"
              captures: { err: $.data.error_id }
          assert:
            - "v3 == 3  # first amendment succeeded and bumped version"
            - "err == ERR_STALE_VERSION  # stale expected version rejected deterministically"

      - name: occ_plan_create_supersede_and_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-plant]", state_machines.ProductionPlan.DRAFT_to_SUPERSEDED, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Plan create with a stale plant version -> 412; with the fresh version it succeeds and the previous DRAFT flips to SUPERSEDED."
        test_recipe:
          setup: ["Plant at version 1; plan1 created (DRAFT, plant -> version 2)"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv1: $.data.version } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv1}" }, as: Planner, captures: { pl1: $.data.id } }
          trigger:
            - call: "POST /bakery/production-plans"
              payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv1}" }
              as: Planner
              captures: { err: $.data.error_id }
            - { call: "GET /bakery/plants/${p}", as: Any, captures: { pv2: $.data.version } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv2}" }, as: Planner, captures: { pl3: $.data.id } }
            - { call: "GET /bakery/production-plans/${pl1}", as: Any, captures: { pl1st: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION  # expected version read before plan1 was created"
            - "ProductionPlan.${pl3}.status == DRAFT"
            - "pl1st == SUPERSEDED"

      - name: close_day_suspends_high_stale_ratio_store
        claim_type: ops_run_checkpoint
        grounds: [calculations.store_stale_ratio_suspension, state_machines.Store, endpoints]
        distinguishing_aspect: "Ops-run checkpoint: after settle (lifetime_delivered 100) and a verified return of 20 units, close_day computes stale_ratio 0.20 > 0.15 and flips the store to SUSPENDED; day_index advances to 1."
        test_recipe:
          setup: ["Baseline chain; stop DELIVERED 100/100; stale return of 20 units VERIFIED; route COMPLETED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 500, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/drivers", payload: { plant_id: "${p}", name: "Driver One" }, as: PlantAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 100 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${ord}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:50:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/release", payload: {}, as: QALead, as_user_id: "qa-1" }
            - { call: "POST /bakery/routes", payload: { plant_id: "${p}", driver_id: "${drv}", route_date: "2026-08-10", window_start_at: "2026-08-10T08:00:00Z", window_end_at: "2026-08-10T12:00:00Z", truck_capacity_units: 500 }, as: Planner, captures: { rt: $.data.id } }
            - { call: "POST /bakery/route-stops", payload: { route_id: "${rt}", store_order_id: "${ord}", planned_units: 100, batch_ids: [ "${bt}" ] }, as: Planner, captures: { stp: $.data.id } }
            - { call: "POST /bakery/routes/${rt}/start-loading", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /bakery/routes/${rt}/dispatch", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/route-stops/${stp}/deliver", payload: { delivered_units: 100, on_shelf_units_observed: 0 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/stale-returns", payload: { store_id: "${st}", route_stop_id: "${stp}", lines: [ { batch_id: "${bt}", qty: 20 } ] }, as: Driver, as_user_id: "${drv}", captures: { sre: $.data.id } }
            - { call: "POST /bakery/stale-returns/${sre}/verify", payload: { verified_lines: [ { batch_id: "${bt}", qty: 20 } ] }, as: QALead, as_user_id: "qa-1" }
            - { call: "POST /bakery/routes/${rt}/complete", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /bakery/routes/${rt}/settle", payload: {}, as: Planner }
          trigger:
            - { call: "POST /bakery/plants/${p}/close_day", payload: {}, as: PlantAdmin, captures: { di: $.data.day_index } }
            - { call: "GET /bakery/stores/${st}", as: Any, captures: { sstat: $.data.status, ratio: $.data.stale_ratio } }
          assert:
            - "di == 1"
            - "ratio == 0.2  # 20 stale / 100 delivered"
            - "sstat == SUSPENDED  # 0.20 > 0.15"

      - name: batch_reject_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Batch.RELEASED_to_REJECTED]
        excluded_because:
          difficulty_instance: batch_reject_cascade_plan_stop_order
          rationale: "The 3-hop cascade (plan shortfall -> stop flag -> order SHORTED) is asserted end-to-end in the named §1.8 instance."

      - name: dual_variant_calculations_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.stale_credit, calculations.surcharge_passthrough]
        excluded_because:
          difficulty_instance: stale_credit_provisional_vs_verified
          rationale: "Both variants of both dual-variant calculations are asserted in §1.8 (stale_credit_provisional_vs_verified, surcharge_provisional_vs_final)."

