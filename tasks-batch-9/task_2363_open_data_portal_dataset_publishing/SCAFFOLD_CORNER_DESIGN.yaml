# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index) — task 2363
# Breadth walk of references/claim-extraction-guide.md against §1.1–§1.7.
# Section names and claim_type values are taken from that guide; corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as excluded_because
# stubs. Logical clock starts at 2026-08-01T00:00:00Z unless a call moves it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: dataset_creation_returns_declared_priority_and_initial_states
        claim_type: creation
        grounds:
          - entities.Dataset
          - endpoints.POST /open-data/datasets
          - calculations.dataset_priority_score
          - response_envelope.success
        distinguishing_aspect: "A dataset created with all required fields returns the full row in the success envelope: both state dimensions at their initial values and the AS_DECLARED priority already computed (0.45*92 + 0.35*96 + 0.20*0 = 75.00)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "One department (code DOT) registered; no dataset exists yet"
            - "No DatasetRequest is linked to the new dataset, so community_pressure is 0"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
          trigger:
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly Traffic Counts published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
          assert:
            - "Response is 201 with response_type == object and meta.api_request_id present"
            - "response.data.publication_status == INVENTORIED and response.data.currency_status == CURRENT"
            - "response.data.priority_score == 75.00, priority_score_variant == AS_DECLARED, priority_tier == TIER_1"
            - "response.data.engagement_index == 0.00 and observed_demand_score == 0.00"
            - "response.data.live_row_count == 0, version_index_high_water == 0, staleness_alert_count == 0"
            - "response.data.high_value_committed == false and public_access_suspended == false"
            - "response.data.id is a bare UUID with no type prefix; version == 1; created_at == updated_at"

      - name: license_retrieval_returns_stored_flags_and_reuse_class
        claim_type: retrieval
        grounds:
          - entities.LicenseTerm
          - endpoints.GET /open-data/licenses/{licenseId}
          - calculations.license_reuse_permission_class
        distinguishing_aspect: "GET by id returns the licence exactly as stored, including the reuse_permission_class derived at creation (attribution_required=true, commercial_use_allowed=true, share_alike=false → ATTRIBUTION) and retired=false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "One licence CC-BY-4.0 created with attribution_required=true, commercial_use_allowed=true, share_alike=false"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "GET /open-data/licenses/${lic_id}"
              as: Anonymous
          assert:
            - "Response is 200 with response_type == object"
            - "response.data.code == CC-BY-4.0 and response.data.name == Creative Commons Attribution 4.0"
            - "response.data.attribution_required == true, commercial_use_allowed == true, share_alike == false"
            - "response.data.reuse_permission_class == ATTRIBUTION"
            - "response.data.retired == false and response.data.version == 1"

      - name: dataset_listing_filters_by_status_and_paginates
        claim_type: listing
        grounds:
          - entities.Dataset
          - endpoints.GET /open-data/datasets
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three datasets exist in one department and one has been screened, so a publication_status=INVENTORIED filter with limit=1 must report total_count 2 (the filtered count, not 3) and has_more true."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT with three INVENTORIED datasets: 'weekly-traffic-counts', 'bike-counts-daily', 'crash-reports-weekly'"
            - "'crash-reports-weekly' is then screened, leaving two INVENTORIED datasets"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly Traffic Counts published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_a_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Bike Counts Daily", slug: "bike-counts-daily", description: "Bike Counts Daily published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 70, policy_value_score: 65 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_b_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Crash Reports Weekly", slug: "crash-reports-weekly", description: "Crash Reports Weekly published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 84, policy_value_score: 88 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_c_id: "$.data.id" }
            - call: "POST /open-data/datasets/${ds_c_id}/screen"
              as: DataCoordinator
              as_user_id: "${dept_id}"
          trigger:
            - call: "GET /open-data/datasets"
              payload: { department_id: "${dept_id}", publication_status: "INVENTORIED", limit: 1, offset: 0 }
              as: Anonymous
          assert:
            - "Response is 200 with response_type == array"
            - "response.total_count == 2 (the screened dataset is filtered out)"
            - "response.has_more == true, response.limit == 1, response.offset == 0"
            - "response.data has exactly 1 element and every returned element has publication_status == INVENTORIED"
            - "Requesting offset 2 with the same filter returns 0 elements and has_more == false"

      - name: dataset_retrieval_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Dataset
          - validations[priority=3]
          - errors.ERR_DATASET_NOT_FOUND
          - response_envelope.error
        distinguishing_aspect: "A well-formed UUID that matches no Dataset row must produce the error envelope with ERR_DATASET_NOT_FOUND at 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT exists; NO dataset has ever been created"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
          trigger:
            - call: "GET /open-data/datasets/2f9b6c41-0d3a-4f7e-9b21-8c5d4e6a7b30"
              as: Anonymous
          assert:
            - "Response is 404 with response_type == error"
            - "response.data.error_id == ERR_DATASET_NOT_FOUND and response.data.message is a non-empty string"
            - "No Dataset row is created as a side effect of the lookup"

      - name: dataset_creation_missing_required_policy_value_score_returns_400
        claim_type: required_fields
        grounds:
          - entities.Dataset.fields.policy_value_score
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "policy_value_score has source input with no default, so omitting it must fail schema validation with ERR_INVALID_REQUEST (400) before any state or scope rule is consulted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT registered"
            - "The request body carries every required dataset field EXCEPT policy_value_score"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
          trigger:
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly traffic counts published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
          assert:
            - "Response is 400 with error_id ERR_INVALID_REQUEST"
            - "No Dataset row is created (GET /open-data/datasets with department_id filter returns total_count 0)"

      - name: license_creation_omitting_flags_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.LicenseTerm.fields.attribution_required
          - entities.LicenseTerm.fields.commercial_use_allowed
          - entities.LicenseTerm.fields.share_alike
          - calculations.license_reuse_permission_class
        distinguishing_aspect: "All three boolean flags are optional with declared defaults false/true/false, and those defaults feed the first clause of the first-match ladder, so an omit-everything licence must classify as UNRESTRICTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "No licence exists yet"
            - "The request supplies only code and name"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
          trigger:
            - call: "POST /open-data/licenses"
              payload: { code: "CC0-1.0", name: "Public Domain Dedication" }
              as: PortalAdmin
          assert:
            - "Response is 201"
            - "response.data.attribution_required == false (declared default)"
            - "response.data.commercial_use_allowed == true (declared default)"
            - "response.data.share_alike == false (declared default)"
            - "response.data.reuse_permission_class == UNRESTRICTED"
            - "response.data.attribution_text_template is null and retired == false"

      - name: dataset_priority_fields_are_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Dataset.fields.priority_score
          - entities.Dataset.fields.priority_tier
          - calculations.dataset_priority_score
        distinguishing_aspect: "priority_score / priority_tier / priority_score_variant all carry source computed, so client-supplied values must be discarded and the formula result (75.00 / TIER_1 / AS_DECLARED) stored instead."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT registered"
            - "The create body smuggles priority_score=99.99, priority_tier=TIER_3 and engagement_index=88.00"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
          trigger:
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly Traffic Counts published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96, priority_score: 99.99, priority_tier: "TIER_3", engagement_index: 88.00 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
          assert:
            - "Response is 201"
            - "response.data.priority_score == 75.00 (the smuggled 99.99 is ignored)"
            - "response.data.priority_tier == TIER_1 (the smuggled TIER_3 is ignored)"
            - "response.data.engagement_index == 0.00 (the smuggled 88.00 is ignored)"
            - "response.data.priority_score_variant == AS_DECLARED"

      - name: member_registration_mints_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.CommunityMember
          - endpoints.POST /open-data/members/register
          - calculations.member_reputation_score
        distinguishing_aspect: "id / created_at / updated_at / version are system-minted and reputation_score, vote_weight and status are computed, so a body that supplies all of them must still come back with a server UUID, version 1 and the base reputation 50.00 / weight 2 / ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "No community member exists"
            - "The body smuggles id, created_at, version, reputation_score and vote_weight"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
          trigger:
            - call: "POST /open-data/members/register"
              payload: { email: "ana@civic.example", display_name: "Ana Reuser", organization: "Civic Data Lab", id: "11111111-1111-4111-8111-111111111111", created_at: "2020-01-01T00:00:00.000Z", version: 42, reputation_score: 100.00, vote_weight: 3 }
              as: Anonymous
          assert:
            - "Response is 201"
            - "response.data.id is a server-minted bare UUID and is NOT 11111111-1111-4111-8111-111111111111"
            - "response.data.created_at == 2026-08-01T00:00:00.000Z (logical clock, not the supplied 2020 value) and version == 1"
            - "response.data.reputation_score == 50.00, vote_weight == 2, status == ACTIVE"
            - "response.data.accepted_issue_count == 0, rejected_issue_count == 0, approved_showcase_count == 0, decay_epochs == 0"
            - "response.data.last_credited_at is null"

      - name: dataset_creation_with_unknown_update_frequency_returns_4XX
        claim_type: type_constraints
        grounds:
          - entities.Dataset.fields.update_frequency
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "update_frequency is a closed enum (DAILY|WEEKLY|MONTHLY|QUARTERLY|ANNUAL|IRREGULAR); FORTNIGHTLY is not a member and must be rejected at 400 rather than stored verbatim."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT registered"
            - "The body sets update_frequency to FORTNIGHTLY, which is not a declared enum member"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
          trigger:
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly Traffic Counts published by the department", update_frequency: "FORTNIGHTLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
          assert:
            - "Response is 400 with error_id ERR_INVALID_REQUEST"
            - "No Dataset row is created"
            - "A second attempt that differs only by update_frequency == WEEKLY returns 201"

      - name: dataset_creation_with_unknown_department_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Dataset.fields.department_id
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_DEPARTMENT_NOT_FOUND
        distinguishing_aspect: "The body FK check (priority 5) runs BEFORE the DataCoordinator department-scope check (priority 6), so an unknown department_id yields ERR_DEPARTMENT_NOT_FOUND at 404 even though the acting coordinator's identity also fails to match any real department."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT exists but the body references a different, non-existent department id"
            - "The acting DataCoordinator's X-User-ID equals that same non-existent id"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
          trigger:
            - call: "POST /open-data/datasets"
              payload: { department_id: "7c3f1a55-9e28-4d61-b0f4-3a5d2c9e8b47", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly traffic counts", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
              as_user_id: "7c3f1a55-9e28-4d61-b0f4-3a5d2c9e8b47"
          assert:
            - "Response is 404 with error_id ERR_DEPARTMENT_NOT_FOUND"
            - "error_id is NOT ERR_DEPARTMENT_SCOPE_VIOLATION (403) — the referential check outranks the scope check"
            - "No Dataset row is created"

      - name: fulfilled_request_transfers_community_pressure_across_aggregates
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - state_machines.DatasetRequest.ACCEPTED_to_FULFILLED
          - calculations.dataset_priority_score
          - endpoints.POST /open-data/dataset-requests/{requestId}/fulfill
        distinguishing_aspect: "Fulfilment is the cross-aggregate edge of the graph topology: a DatasetRequest with weighted_vote_total 4 contributes community_pressure min(100, 4*4) = 16 to the linked dataset only once linked_dataset_id is set, lifting the published dataset's AS_OBSERVED score from 33.60 to 36.80."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT with licence CC-BY-4.0; dataset 'weekly-traffic-counts' PUBLISHED with no usage epochs, so priority_score is 33.60 (AS_OBSERVED, engagement 0.00) and priority_tier is TIER_3"
            - "Two community members (reputation 50.00, vote_weight 2 each) registered"
            - "A DatasetRequest filed by the first member and upvoted by both, giving weighted_vote_total 4 and demand_signal 20.00"
            - "The request has been taken UNDER_REVIEW and then ACCEPTED with a decision note"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly Traffic Counts published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
            - call: "POST /open-data/datasets/${ds_id}/screen"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records"
              payload: { dataset_id: "${ds_id}", license_id: "${lic_id}", data_dictionary_field_count: 9, provenance_detail_lines: 24, contact_email: "datasets@dot.city.gov", declared_update_frequency: "WEEKLY", attribution_element_count: 6 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { md_id: "$.data.id" }
            - call: "POST /open-data/metadata-records/${md_id}/submit"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records/${md_id}/decide"
              payload: { decision: "ACCEPT" }
              as: PortalAdmin
            - call: "POST /open-data/privacy-assessments"
              payload: { dataset_id: "${ds_id}", declared_quasi_identifier_count: 2, declared_smallest_cell_size: 20, population_size: 100000 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
              captures: { pa_id: "$.data.id" }
            - call: "PATCH /open-data/privacy-assessments/${pa_id}"
              payload: { verified_smallest_cell_size: 20 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/submit"
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/decide"
              payload: { decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "pr-chief-1"
            - call: "POST /open-data/datasets/${ds_id}/mark-ready"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/datasets/${ds_id}/publish"
              payload: { initial_row_count: 50000 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/members/register"
              payload: { email: "ana@civic.example", display_name: "Ana Reuser", organization: "Civic Data Lab" }
              as: Anonymous
              captures: { mem_a_id: "$.data.id" }
            - call: "POST /open-data/members/register"
              payload: { email: "ben@civic.example", display_name: "Ben Mapper", organization: "Civic Data Lab" }
              as: Anonymous
              captures: { mem_b_id: "$.data.id" }
            - call: "POST /open-data/dataset-requests"
              payload: { requester_member_id: "${mem_a_id}", title: "Signal timing plans", rationale: "Needed to audit corridor delays" }
              as: CommunityMember
              as_user_id: "${mem_a_id}"
              captures: { req_id: "$.data.id" }
            - call: "POST /open-data/dataset-requests/${req_id}/votes"
              payload: { member_id: "${mem_a_id}" }
              as: CommunityMember
              as_user_id: "${mem_a_id}"
            - call: "POST /open-data/dataset-requests/${req_id}/votes"
              payload: { member_id: "${mem_b_id}" }
              as: CommunityMember
              as_user_id: "${mem_b_id}"
