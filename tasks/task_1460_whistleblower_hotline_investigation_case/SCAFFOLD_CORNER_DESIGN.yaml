            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: INCONCLUSIVE, rationale: "First draft written against the initially observed case version.", expected_case_version: "${cv1}" }, as: Investigator, as_user_id: "${s_inv}", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: UNSUBSTANTIATED, rationale: "Second writer still carrying the pre-draft case version value.", expected_case_version: "${cv1}" }, as: Investigator, as_user_id: "${s_inv}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_STALE_VERSION (http 412)"
            - "Determination.${d1} remains DRAFT (no supersede side effect from the rejected call)"

