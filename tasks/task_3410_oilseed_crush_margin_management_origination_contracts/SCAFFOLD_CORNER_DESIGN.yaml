          trigger:
            - call: "POST /api/origination-contracts/${k_ctr_nq_id}/pricing-elections"
              payload: { bushels: 100, expected_contract_version: "${k_ctr_nq_v}" }
              as: OriginationMerchandiser
              captures: { k_err16: $.data.error_id }
          assert:
            - "response 422 with error_id ERR_NO_MARKET_QUOTE"
            - "OriginationContract.${k_ctr_nq_id}.pricing_status remains UNPRICED with priced_bushels == 0"

      - name: run_start_without_inventory_rejected
        claim_type: Violation → Error
        grounds: [state_machines.CrushRun.SCHEDULED_to_RUNNING, errors.ERR_INSUFFICIENT_PLANT_INVENTORY]
        distinguishing_aspect: "A SCHEDULED run of 5000 bu cannot start while the plant holds 0 bushels -> 422 ERR_INSUFFICIENT_PLANT_INVENTORY; the run stays SCHEDULED."
        test_recipe:
          setup: ["ACTIVE plant, quotes 1200/55/17, run 5000 bu for 2026-09-10 SCHEDULED; no bean deliveries to the plant."]
          setup_api_calls:
            - *k_clock
            - *k_plant
            - *k_qb
            - *k_qo
            - *k_qm
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${k_plant_id}", run_date: "2026-09-10T00:00:00Z", planned_bushels: 5000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { k_run_ni: $.data.id, k_run_ni_v: $.data.version }
            - call: "POST /api/crush-runs/${k_run_ni}/schedule"
              payload: { expected_run_version: "${k_run_ni_v}" }
              as: PlantScheduler
          trigger:
            - call: "POST /api/crush-runs/${k_run_ni}/transitions"
              payload: { to_status: "RUNNING" }
              as: PlantScheduler
              captures: { k_err17: $.data.error_id }
          assert:
            - "response 422 with error_id ERR_INSUFFICIENT_PLANT_INVENTORY (0 < 5000)"
            - "CrushRun.${k_run_ni}.status remains SCHEDULED and plant bean_inventory_bushels == 0"

