              captures: { e_already_active: $.data.error_id }
            - call: POST /bundle-activations/${act_id}/close-debrief
              payload: { debrief_notes: "Premature debrief attempt recorded during the corner sweep for score-null coverage." }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
