            - "A SETUP BudgetLine authorized 1000000 with one OseOrder of 400000 for 5 pallets (window 2026-09-05..2026-09-15) that was cancelled, so the line is back to committed_cents 0 and available_cents 1000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
