scenario: "650. Window & Door Replacement (Renewal by Andersen style): in-home consultation & measure, product/style configuration & energy rating, quote & financing/rebate (25C), custom manufacture & lead time, install crew & scheduling, permit & inspection, callback/service & warranty, referral"
domain_name: "window-door-replacement"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation       # estimate quote vs final invoice; provisional vs confirmed 25C rebate
    - cascading_side_effects         # quote accept -> manufacture -> install schedule -> permit; cancellation reversals
    - optimistic_concurrency         # OCC on Quote.version for accept-with-supersede
    - scheduled_actions              # logical clock drives lead-time readiness, install windows, inspection deadlines

  entity_topology: hybrid
  # Project is the aggregate root (tree: Project -> Consultation -> Opening). Crew is a
  # peer resource referenced by InstallJob across the tree (cross-aggregate association),
  # and Referral cross-links two Projects (referrer/referred). Hence hybrid.

  state_machine_shape: branching
  # Quote forks ACCEPTED -> {manufacture path} and REJECTED -> revision loop back to DRAFT.
  # Project is compound (state derived from child stages). InstallJob carries a temporal
  # scheduling dimension. ServiceTicket has a revision cycle (REOPENED).

  relationship_patterns:
    - one_to_many        # Project -> Openings, Project -> Quotes, Project -> ServiceTickets
    - cross_aggregate    # InstallJob -> Crew, ManufactureOrder -> Quote
    - self_referential   # Referral links Project (referrer) to Project (referred)

  role_model: peer_roles
  # SalesConsultant owns consultation/quote; OperationsCoordinator owns manufacture/install/permit;
  # ServiceTech owns callbacks/warranty; Homeowner is the customer (entity_backed); PlatformAdmin opaque.

  consistency_model: immediate

# =====================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

