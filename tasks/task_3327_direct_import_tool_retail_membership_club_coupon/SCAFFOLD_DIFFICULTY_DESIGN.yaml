            - "StoreAllocation.${alloc_id}.status == PLANNED (unchanged)"
            - "Container.${cont_id}.unallocated_quantities[${item_id}] == 5"

      - name: customs_clearance_depends_on_recall_state
        grounds:
          - state_machines.Container.AT_PORT_to_CLEARED
          - errors[ERR_CONTAINER_QUARANTINE_BLOCK]
        distinguishing_aspect: |
          Different entity pair (Container -> Recall via Item): a container at
          port holding an item whose recall just went ACTIVE with severity
          HAZARD cannot clear customs; closing the recall (quarantine lifted)
          makes the identical transition succeed.
        test_recipe:
          setup:
            - "Item ACTIVE; PO issued; container AT_PORT holding item"
            - "HAZARD recall ACTIVATED on the item"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "XD2", name: "Compressor", brand_tier: "MID", origin_country: "CN", unit_retail_cents: 20000, member_price_cents: 19000, floor_margin_pct: 0.10, lead_time_days: 45, unit_weight_kg: 20.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
