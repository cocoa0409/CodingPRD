              captures: { e_double_register: $.data.error_id }
            - call: "POST /matches/${m_id}/broadcast"
              payload: { action: "RESUME" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { e_resume: $.data.error_id }
          assert:
            - "trigger 1 returns 409 with data.error_id == ERR_INVALID_BROADCAST_STATE — END requires LIVE or SUSPENDED, and the match's broadcast_status is NONE"
            - "trigger 2 returns 422 with data.error_id == ERR_BROADCAST_SCHOOL_MISMATCH and Match.${m_id}.broadcast_status is still NONE"
            - "trigger 3 returns 200 with data.broadcast_status == SCHEDULED, data.broadcast_school_id == ${s_a_id}, data.broadcast_start_at == 2026-10-01T18:00:00.000Z, data.broadcast_end_at == 2026-10-01T19:00:00.000Z and data.spectator_strikes == 0"
            - "trigger 4 returns 409 with data.error_id == ERR_INVALID_BROADCAST_STATE — REGISTER requires broadcast_status NONE"
            - "trigger 5 returns 409 with data.error_id == ERR_INVALID_BROADCAST_STATE — RESUME requires SUSPENDED, not SCHEDULED"
            - "Match.${m_id}.play_status is still SCHEDULED and result_status is still AWAITING_REPORTS throughout — the broadcast dimension moves independently"

