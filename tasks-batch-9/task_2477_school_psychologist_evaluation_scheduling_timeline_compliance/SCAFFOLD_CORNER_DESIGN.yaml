# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2477 — School Psychologist Evaluation Scheduling & Timeline Compliance
# Breadth walk of references/claim-extraction-guide.md against §1.1–§1.7.
# Corners already carried by §1.8 appear as excluded_because stubs.
# Every call below is a §1.5 endpoint; the logical clock is always set first.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: school_create_returns_persisted_building
        claim_type: creation
        grounds:
          - entities.School
          - endpoints["POST /psych-services/schools"]
          - response_envelope.success
        distinguishing_aspect: "A fully specified School create returns 201 with every input field echoed, a prefix-free UUID id, version 1 and created_at == updated_at inside the success envelope."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /psych-services/schools"
              payload: { name: "Aspen Elementary", building_code: "AS20", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 3, enrollment_count: 500 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id present"
            - "data.name == \"Aspen Elementary\", data.building_code == \"AS20\", data.grade_band == \"ELEMENTARY\", data.concurrent_meeting_capacity == 3, data.enrollment_count == 500"
            - "data.id is a bare UUID with no type prefix and data.version == 1"
            - "data.created_at == data.updated_at (no mutation has happened yet)"

      - name: school_get_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints["GET /psych-services/schools/{school_id}"]
          - entities.School
        distinguishing_aspect: "GET by id returns exactly the stored row, including the defaulted fields, and does not bump version."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School created with building_code BR21 and capacity 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Birchwood Middle", building_code: "BR21", grade_band: "MIDDLE", concurrent_meeting_capacity: 2, enrollment_count: 610 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /psych-services/schools/${s1}"
              payload: {}
              as: PsychServicesSupervisor
          assert:
            - "HTTP 200 with data.id == ${s1}"
            - "data.building_code == \"BR21\", data.grade_band == \"MIDDLE\", data.concurrent_meeting_capacity == 2, data.enrollment_count == 610"
            - "data.version == 1 — a read never mutates the row"

      - name: referral_list_pagination_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /psych-services/referrals"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three referrals at one building, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School; three Referrals filed at that School, none consented."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Cypress High", building_code: "CY22", grade_band: "HIGH", concurrent_meeting_capacity: 2, enrollment_count: 900 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-01", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-02", referral_type: "INITIAL", requested_domains: ["ACADEMIC"] }
              as: IntakeCoordinator
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-03", referral_type: "INITIAL", requested_domains: ["ADAPTIVE"] }
              as: IntakeCoordinator
          trigger:
            - call: "GET /psych-services/referrals?school_id=${s1}&limit=2&offset=0"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "HTTP 200 with response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "GET /psych-services/referrals?school_id=${s1}&limit=2&offset=2 returns len(data) == 1, total_count == 3, has_more == false"
            - "GET /psych-services/referrals?school_id=${s1} without limit/offset returns all 3 rows (default limit 10, offset 0) with has_more == false"

      - name: evaluation_list_filter_by_psychologist_and_status
        claim_type: listing
        grounds:
          - endpoints["GET /psych-services/evaluations"]
          - entities.Evaluation.fields.assessment_status
          - entities.Evaluation.fields.psychologist_id
        distinguishing_aspect: "Filtering interacts with pagination: psychologist_id + assessment_status narrows three Evaluations to one, and total_count reflects the filtered set, not the table."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School; two ACTIVE SSP psychologists covering it."
            - "Three consented INITIAL 1-domain referrals: evaluation 1 assigned to A, evaluation 2 assigned to B, evaluation 3 left in PENDING_ASSIGNMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Dogwood Elementary", building_code: "DW23", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 380 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Tara Voss", employee_number: "E-2001", credential_type: "SSP", assigned_school_ids: ["${s1}"] }
              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Uri Bell", employee_number: "E-2002", credential_type: "SSP", assigned_school_ids: ["${s1}"] }
              as: DistrictAdmin
              captures: { pb: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-04", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-04" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-05", referral_type: "INITIAL", requested_domains: ["ACADEMIC"] }
              as: IntakeCoordinator
              captures: { r2: $.data.id }
            - call: "POST /psych-services/referrals/${r2}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-05" }
              as: IntakeCoordinator
              captures: { eval2: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval2}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver2: $.data.version }
            - call: "POST /psych-services/evaluations/${eval2}/assign"
              payload: { expected_evaluation_version: "${ver2}", psychologist_id: "${pb}" }
              as: PsychServicesSupervisor
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-06", referral_type: "INITIAL", requested_domains: ["ADAPTIVE"] }
              as: IntakeCoordinator
              captures: { r3: $.data.id }
            - call: "POST /psych-services/referrals/${r3}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-06" }
              as: IntakeCoordinator
              captures: { eval3: $.data.active_evaluation_id }
          trigger:
            - call: "GET /psych-services/evaluations?psychologist_id=${pa}&assessment_status=ASSIGNED"
              payload: {}
              as: PsychServicesSupervisor
          assert:
            - "HTTP 200 with len(data) == 1, total_count == 1, has_more == false, and data[0].id == ${eval1}"
            - "GET /psych-services/evaluations?assessment_status=PENDING_ASSIGNMENT returns exactly one row whose id == ${eval3}"
            - "GET /psych-services/evaluations returns total_count == 3 (the unfiltered table)"
            - "GET /psych-services/evaluations?psychologist_id=${pb} returns exactly one row whose id == ${eval2}"

      - name: evaluation_get_unknown_id_returns_evaluation_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors.ERR_EVALUATION_NOT_FOUND
          - endpoints["GET /psych-services/evaluations/{evaluation_id}"]
        distinguishing_aspect: "A well-formed but unknown UUID on the Evaluation read returns the entity-specific 404, not a generic error."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; no Evaluation rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "GET /psych-services/evaluations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_EVALUATION_NOT_FOUND\""
            - "The same unknown id on GET /psych-services/eligibility-meetings/00000000-0000-4000-8000-000000000000 returns ERR_MEETING_NOT_FOUND — each collection reports its own 404"

      - name: psychologist_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - entities.Psychologist.fields.assigned_school_ids
        distinguishing_aspect: "assigned_school_ids has source: input with no default, so omitting it is a 422 shape failure that happens before any FK resolution."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Elmhurst Middle", building_code: "EH24", grade_band: "MIDDLE", concurrent_meeting_capacity: 2, enrollment_count: 520 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Vic Marsh", employee_number: "E-2003", credential_type: "SSP" }
              as: DistrictAdmin
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "No id is returned and no Psychologist row is created"
            - "Re-issuing the same payload plus assigned_school_ids: [\"${s1}\"] returns HTTP 201"

      - name: referral_create_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Referral.fields.primary_language
          - entities.Referral.fields.interpreter_required
          - entities.Referral.fields.bilingual_evaluation_required
          - entities.Referral.fields.intervention_team_summary
        distinguishing_aspect: "Omitting every optional Referral input yields primary_language \"en\", both boolean flags false and intervention_team_summary the empty string — not null."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Fernbank Elementary", building_code: "FB25", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 300 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-07", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
          assert:
            - "HTTP 201 with data.primary_language == \"en\", data.interpreter_required == false, data.bilingual_evaluation_required == false, data.intervention_team_summary == \"\""
            - "data.status == \"INTAKE_RECEIVED\", data.active_evaluation_id == null, data.consent_received_at == null, data.last_consent_event_type == null, data.prior_evaluation_id == null"
            - "data.version == 1"

      - name: psychologist_create_applies_capacity_and_computed_zero_state
        claim_type: defaults
        grounds:
          - entities.Psychologist.fields.weekly_capacity_points
          - entities.Psychologist.fields.languages_certified
          - entities.Psychologist.fields.open_case_points
          - entities.Psychologist.fields.caseload_status
        distinguishing_aspect: "A psychologist created with no caseload has weekly_capacity_points 20 and languages_certified [\"en\"] by default, status ACTIVE, and all four derived caseload fields at their zero state (0 / BALANCED / 0.00 / 0.00) rather than null."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Glenrose High", building_code: "GR26", grade_band: "HIGH", concurrent_meeting_capacity: 2, enrollment_count: 1000 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /psych-services/psychologists"
              payload: { full_name: "Wren Case", employee_number: "E-2004", credential_type: "PHD", assigned_school_ids: ["${s1}"] }
              as: DistrictAdmin
              captures: { pa: $.data.id }
          assert:
            - "HTTP 201 with data.weekly_capacity_points == 20 and data.languages_certified == [\"en\"]"
            - "data.status == \"ACTIVE\", data.open_case_points == 0, data.caseload_status == \"BALANCED\""
            - "data.pressure_index_assigned_basis == 0.00 and data.pressure_index_clock_weighted == 0.00"

      - name: protocol_order_computed_costs_ignored_input_from_client
        claim_type: computed_fields
        grounds:
          - calculations.protocol_order_total_cost
          - entities.ProtocolOrder.fields.total_cost_cents
          - entities.ProtocolOrder.fields.handling_fee_cents
          - entities.ProtocolOrder.fields.auto_approved
        distinguishing_aspect: "Every money field on ProtocolOrder is source: computed, so client-supplied unit_price_cents / total_cost_cents are ignored and a 5-booklet order below the tier-1 quantity picks up the flat handling fee and auto-approves."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one AssessmentInstrument with protocol_unit_cost_cents 2000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "Vineland-3", instrument_code: "VIN3", protocol_stock_count: 0, protocol_units_per_administration: 1, protocol_unit_cost_cents: 2000, license_seat_total: 1, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /psych-services/protocol-orders"
              payload: { instrument_id: "${inst}", quantity_requested: 5, rush_flag: false, unit_price_cents: 1, total_cost_cents: 1 }
              as: PsychServicesSupervisor
              captures: { order1: $.data.id }
          assert:
            - "HTTP 201 with data.unit_price_cents == 2000 (tier multiplier 1.00 below TIER1_MIN_QTY) — the client's 1 is ignored"
            - "data.base_cents == 10000, data.contract_discount_cents == 700, data.rush_surcharge_cents == 0, data.handling_fee_cents == 1250"
            - "data.total_cost_cents == 10550 — the client's 1 is ignored"
            - "data.auto_approved == true and data.status == \"APPROVED\" (10550 <= 40000), with decided_by_user_id == null"
            - "AssessmentInstrument.${inst}.protocol_stock_count == 0 — ordering never credits stock"

      - name: referral_create_system_fields_ignored_input
        claim_type: system_fields
        grounds:
          - entities.Referral.fields.status
          - entities.Referral.fields.active_evaluation_id
          - entities.Referral.fields.consent_received_at
        distinguishing_aspect: "status, active_evaluation_id, consent_received_at, id and version are all source: system, so values sent by the client are discarded rather than persisted or rejected."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Hollybrook Middle", building_code: "HB27", grade_band: "MIDDLE", concurrent_meeting_capacity: 2, enrollment_count: 470 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-08", referral_type: "INITIAL", requested_domains: ["COGNITIVE"], status: "COMPLETED", active_evaluation_id: "00000000-0000-4000-8000-000000000000", consent_received_at: "2020-01-01T00:00:00Z", version: 99 }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
          assert:
            - "HTTP 201 with data.status == \"INTAKE_RECEIVED\" (the client's COMPLETED is discarded)"
            - "data.active_evaluation_id == null and data.consent_received_at == null"
            - "data.version == 1 and data.id != \"00000000-0000-4000-8000-000000000000\""

      - name: referral_duplicate_requested_domain_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.Referral.fields.requested_domains
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "requested_domains must be a duplicate-free non-empty subset of the four declared domains; a repeated domain is a 422 rather than being silently de-duplicated (it would otherwise inflate caseload_points)."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Ironwood High", building_code: "IW28", grade_band: "HIGH", concurrent_meeting_capacity: 2, enrollment_count: 870 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-09", referral_type: "INITIAL", requested_domains: ["COGNITIVE", "COGNITIVE"] }
              as: IntakeCoordinator
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\" and no Referral row created"
            - "requested_domains: [] is likewise rejected with ERR_INVALID_REQUEST (non-empty constraint)"
            - "requested_domains: [\"COGNITIVE\", \"ACADEMIC\"] returns HTTP 201 with data.requested_domains of length 2"

      - name: reevaluation_referral_without_prior_evaluation_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.Referral.fields.prior_evaluation_id
          - relationship_patterns.self_referential
        distinguishing_aspect: "prior_evaluation_id must be present exactly when referral_type == REEVALUATION: omitting it on a REEVALUATION and supplying it on an INITIAL are both 422s from the same shape rule."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School; one consented INITIAL referral whose Evaluation id can serve as a prior_evaluation_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Juniper Elementary", building_code: "JN29", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 330 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-10", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-10" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
          trigger:
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-10", referral_type: "REEVALUATION", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\" — a REEVALUATION with no prior_evaluation_id is malformed"
            - "The same payload plus prior_evaluation_id: \"${eval1}\" returns HTTP 201 with data.prior_evaluation_id == ${eval1}"
            - "An INITIAL referral that DOES carry prior_evaluation_id: \"${eval1}\" is rejected with ERR_INVALID_REQUEST"

      - name: referral_create_unknown_school_returns_school_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors.ERR_SCHOOL_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so Referral.school_id is a body FK: an unknown building is a 404 on the referenced entity, not a 422 shape error."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; no School rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /psych-services/referrals"
              payload: { school_id: "00000000-0000-4000-8000-000000000000", student_local_id: "STU-11", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
          assert:
            - "HTTP 404 with data.error_id == \"ERR_SCHOOL_NOT_FOUND\" and no Referral row created"

      - name: psychologist_assigned_school_array_element_must_resolve
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - entities.Psychologist.fields.assigned_school_ids
          - relationship_patterns.many_to_many
        distinguishing_aspect: "assigned_school_ids is a membership set rather than a single FK, so EVERY element is resolved: one good id plus one unknown id still fails with ERR_SCHOOL_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; exactly one School exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Kestrel Middle", building_code: "KS30", grade_band: "MIDDLE", concurrent_meeting_capacity: 2, enrollment_count: 500 }
              as: DistrictAdmin
