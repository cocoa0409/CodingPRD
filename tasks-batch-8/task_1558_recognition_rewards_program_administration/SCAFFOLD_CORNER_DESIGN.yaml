            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-12-31", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 600, reason_code: DELIVERY, message: "g", idempotency_key: "sm-aex-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin, captures: { award: $.data.award_id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:01Z" }, as: HRAdmin }
            - { call: "GET /api/awards/${award}", payload: {}, as: HRAdmin, captures: { a_st: $.data.status, a_rem: $.data.points_remaining } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { e_avail: $.data.available_points, e_exp: $.data.lifetime_expired_points } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { b_com: $.data.committed_points } }
          assert:
            - "${a_st} == EXPIRED and ${a_rem} == 0"
            - "${e_avail} == 0 and ${e_exp} == 600"
            - "${b_com} == 0 (budget window ends 2027-12-31, so still OPEN at sweep time and released)"

      - name: budget_auto_close_after_period_end
        claim_type: automatic_transition
        grounds: [state_machines.PointBudget.ANY_to_CLOSED]
        distinguishing_aspect: "When the logical date reaches period_end_date the budget auto-closes (posture CLOSED) after the expiry sweep; submissions selecting that window afterwards get ERR_BUDGET_NOT_FOUND."
        test_recipe:
          setup: ["budget window [2026-01-01, 2026-09-01); one pending 100-point nomination inside it"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 }, nomination_review_sla_days: 14 }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
