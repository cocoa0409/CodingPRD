    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: StateRegulatoryProfile
    side_effects: ["status -> ACTIVE"]

  # --- RateIndication ---
  - method: POST
    path: "/rate-indications"
    description: "Create a RateIndication (DRAFT); both calculation variants computed at creation"
    roles: [ProductActuary]
    code: 201
    input: [product_id, "scope_state_code?", variant, earned_premium_cents, incurred_loss_cents, paid_loss_cents, exposure_units, trend_factor, countrywide_change_pct, expected_product_version]
    output: RateIndication
    side_effects:
      - "increments Product.version by 1"
      - "indicated_change_pct and alternate_change_pct computed per indicated_rate_change"
      - "prepared_by_user_id = caller X-User-ID"

  - method: GET
    path: "/rate-indications/{indicationId}"
    description: "Get a RateIndication"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: []
    output: RateIndication
    side_effects: []

  - method: GET
    path: "/rate-indications"
    description: "List RateIndications"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: "RateIndication[]"
    side_effects: []

  - method: POST
    path: "/rate-indications/{indicationId}/submit-review"
    description: "Submit indication for actuarial review"
    roles: [ProductActuary]
    code: 200
    input: []
    output: RateIndication
    side_effects: ["status DRAFT -> IN_ACTUARIAL_REVIEW"]

  - method: POST
    path: "/rate-indications/{indicationId}/approve"
    description: "Approve an indication (segregation of duties enforced)"
    roles: [ProductActuary]
    code: 200
    input: []
    output: RateIndication
    side_effects: ["status IN_ACTUARIAL_REVIEW -> APPROVED; approved_by_user_id set"]

  - method: POST
    path: "/rate-indications/{indicationId}/return"
    description: "Return an indication to DRAFT for revision"
    roles: [ProductActuary]
    code: 200
    input: []
    output: RateIndication
    side_effects: ["status IN_ACTUARIAL_REVIEW -> DRAFT; review_round += 1"]

  - method: POST
    path: "/rate-indications/{indicationId}/lock"
    description: "Lock an approved indication; supersedes any other LOCKED indication of the same (product_id, scope_state_code)"
    roles: [ProductActuary]
    code: 200
    input: []
    output: RateIndication
    side_effects:
      - "status APPROVED -> LOCKED"
      - "prior LOCKED indication of same scope -> SUPERSEDED"
      - "countrywide scope (scope_state_code null): Product.current_locked_indication_id updated; increments Product.version by 1"

  # --- RateFiling ---
  - method: POST
    path: "/filings"
    description: "Create a RateFiling (DRAFT); profile resolved from (product_id, state_code)"
    roles: [FilingAnalyst]
    code: 201
    input: [product_id, state_code, filing_type, proposed_change_pct, proposed_effective_date, indication_id]
    output: RateFiling
    side_effects:
      - "status=DRAFT; profile_id resolved (no ACTIVE profile -> ERR_PROFILE_INACTIVE; none found -> ERR_NOT_FOUND)"
      - "indication must exist and be LOCKED (ERR_INDICATION_NOT_LOCKED)"
      - "ERR_DUPLICATE_OPEN_FILING if a filing in DRAFT | READY | SUBMITTED | UNDER_OBJECTION | APPROVED | DEEMED_APPROVED exists for (product_id, state_code)"

  - method: GET
    path: "/filings/{filingId}"
    description: "Get a RateFiling"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: []
    output: RateFiling
    side_effects: []

  - method: GET
    path: "/filings"
