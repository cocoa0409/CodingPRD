      - name: appeal_granted_branch_returns_the_request_to_awaiting_and_settles_the_filing_fee
        claim_type: branching
        grounds:
          - state_machines.Appeal.FILED_to_GRANTED
          - state_machines.RecordsRequest.APPEAL_FILED_to_AWAITING_AGENCY_RESPONSE
          - calculations.desk_fee_budget_ledger
          - calculations.statutory_deadline
        distinguishing_aspect: |
          The appeal decision is a fork and this is the GRANTED prong, which must be observably different
          from the DENIED prong on four axes: the request returns to AWAITING_AGENCY_RESPONSE rather than
          reaching LITIGATION_AUTHORIZED, litigation_exposure_count stays 0, security_posture stays OPEN,
          and the filing fee SETTLES (committed -> spent) rather than being released. Filing and deciding
          on the same date accrues 0 tolled days, so due_at_tolled must be identical to due_at_strict.
        test_recipe:
          setup:
            - "Desk (total 500000), Agency (OMBUDS venue, appeal_decision_days 20, BUSINESS_DAYS)."
            - "RecordsRequest submitted on 2026-08-03 and DENIED with denial_reason_code EXEMPT_PRIVACY (no fee was determined, so nothing was committed on the request)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 365 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
