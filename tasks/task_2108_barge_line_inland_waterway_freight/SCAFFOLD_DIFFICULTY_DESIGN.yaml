          - entities.CargoClaim.fields.settlement_deductible_cents
          - entities.CargoClaim.fields.settlement_franchise_cents
          - entities.FreightContract.fields.claim_settlement_basis
          - state_machines.CargoClaim.UNDER_REVIEW_to_ASSESSED
        distinguishing_aspect: |
          This dual variant lives in the CARGO-LOSS domain on CargoClaim, not in
          billing: the same 13-ton outturn shortfall against a 8.500-ton trade
          tolerance yields 99000 cents when the tolerance is read as a deductible
          subtracted from the loss and 286000 cents when it is read as a franchise
          that, once breached, makes the whole loss compensable.
        test_recipe:
          setup:
            - "Same reference data as the billing scenario, one barge only: contract for 1700 tons over 400 miles, laytime 12 hours, declared value 22000 cents/ton, claim_settlement_basis DEDUCTIBLE."
            - "Barge BL-1001 loaded to 1700 tons, discharged at 1687 tons, assignment discharge_status COMPLETED and contract movement_status DISCHARGED."
            - "Logical clock advanced to 2026-08-22T00:00:00Z, inside the 30-day claim filing window; a SHORTAGE claim for 13 tons capped at 300000 cents is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
