              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
