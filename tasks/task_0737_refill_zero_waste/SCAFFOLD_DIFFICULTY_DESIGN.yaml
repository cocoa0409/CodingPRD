            - { call: "POST /v1/orders", payload: { member_id: "${m_a}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o_a: "$.data.id" } }
            - { call: "POST /v1/orders/${o_a}/lines", payload: { product_id: "${p_pea}", container_id: "${cc}", estimated_gross_g: 300 }, as: StoreClerk, captures: { l_a: "$.data.id" } }
