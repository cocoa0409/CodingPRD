          trigger:
            - call: "POST /orders/${order}/cancel"
              payload: { refund_destination: "WALLET" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "after pay, Customer.${cust}.store_credit_cents == 9701 (20000 - 10299)"
            - "after cancel-to-wallet, Customer.${cust}.store_credit_cents == 20000 (conserved to pre-pay value)"
            - "Order.${order}.refund_cents == 10299"

      - name: surge_capacity_conserved_schedule_then_cancel
        grounds:
          - calculations.surge_day_remaining_capacity
          - validations[priority=17]
          - state_machines.ProductionJob.to_CANCELLED
          - errors[ERR_SURGE_CAPACITY_FULL]
        distinguishing_aspect: |
          Conserved quantity = surge-day remaining capacity (units). A capacity_per_day of 5 fully consumed by order1
          (qty 5) rejects order2 (qty 1) with ERR_SURGE_CAPACITY_FULL; cancelling order1 frees its 5 units so order2's
          retry succeeds — remaining capacity returns to 5. A different conserved quantity (units) than store credit (money).
        test_recipe:
          setup:
            - "Clock at 2026-06-05, inside a PHOTOBOOK surge window [2026-06-01,2026-06-10) with capacity_per_day 5."
            - "One approved PHOTOBOOK project; order1 (qty 5) paid so the day is full; order2 (qty 1) placed but unpaid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /surge-windows"
              payload: { name: "Peak", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-10T00:00:00Z", turnaround_extra_days: 0, capacity_per_day: 5, product_type_scope: "PHOTOBOOK" }
              as: CatalogAdmin
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addr: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 5, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { order1: $.data.id }
            - call: "POST /orders/${order1}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 1, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { order2: $.data.id }
          trigger:
            - call: "POST /orders/${order2}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err_full: $.data.error_id }
            - call: "POST /orders/${order1}/cancel"
              payload: { refund_destination: "CARD" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${order2}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { o2_fulfil: $.data.fulfillment_status }
          assert:
            - "first pay of order2 (qty 1 into a full day) -> error_id == ERR_SURGE_CAPACITY_FULL, http 409"
            - "after cancelling order1, retry pay of order2 -> Order.${order2}.fulfillment_status == IN_PRODUCTION (capacity restored to 5)"
            - "Order.${order2}.payment_status == PAID"
