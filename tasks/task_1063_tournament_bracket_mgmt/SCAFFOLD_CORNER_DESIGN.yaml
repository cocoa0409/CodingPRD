  # ---------------- Consistency model ----------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_registration
        claim_type: immediate
        grounds: [endpoints, entities.Registration]
        distinguishing_aspect: "A registration created by POST /registrations is immediately visible via GET /registrations/{id} in the same client sequence (immediate consistency)."
        test_recipe:
          setup: ["Tournament REGISTRATION_OPEN; a player exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "22 A", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
