  - section: endpoints
    instances:
      - name: clock_endpoint_pins_created_at_and_moves_time_forward
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/royalties/_clock/set_current_utc
          - global_constants.LOGICAL_CLOCK_STARTUP_DEFAULT
          - response_envelope.success
        distinguishing_aspect: |
          The logical clock is the only source of "now" in the domain: before any set call every
          created_at is the startup default 2026-08-01T00:00:00Z, and derived timestamps are computed
          from it (claim_window_closes_at 2026-08-29T00:00:00Z for a period ending 2026-06-30). After
          a set call, newly derived timestamps move but ALREADY-STORED ones do not — the setter
          rewrites nothing retroactively. The endpoint returns a null data payload inside a normal
          success envelope.
        test_recipe:
          setup:
            - "Empty database; the clock has never been set."
          setup_api_calls: []
          trigger:
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { p1: "$.data.id", c1: "$.data.created_at", cw1: "$.data.claim_window_closes_at" }
            - call: "POST /royalties/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: RoyaltyAdmin
              captures: { body: "$.data" }
            - call: "POST /royalties/periods"
              payload: { label: "2026-07", usage_start: "2026-07-01", usage_end: "2026-07-31" }
              as: RoyaltyAdmin
              captures: { p2: "$.data.id", c2: "$.data.created_at", cw2: "$.data.claim_window_closes_at" }
            - call: "GET /royalties/periods/${p1}"
              payload: {}
              as: RoyaltyAdmin
              captures: { c1b: "$.data.created_at", cw1b: "$.data.claim_window_closes_at" }
          assert:
            - "The first period has created_at 2026-08-01T00:00:00Z — the startup default, not wall-clock time — and claim_window_closes_at 2026-08-29T00:00:00Z."
            - "The clock call returns HTTP 200 with response_type \"object\" and a data payload of null, plus the usual meta.api_request_id."
            - "The second period, created after the set, has created_at 2026-09-15T12:00:00Z and claim_window_closes_at 2026-09-29T00:00:00Z (usage_end 2026-07-31 at midnight plus 60 days) — the window is derived from usage_end, NOT from the new clock."
            - "Re-reading the first period shows created_at and claim_window_closes_at unchanged; setting the clock does not rewrite stored timestamps."

