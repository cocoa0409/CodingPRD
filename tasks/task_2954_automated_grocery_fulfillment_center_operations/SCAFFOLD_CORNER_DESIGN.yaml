      - name: auth_ladder_walks_unauthenticated_then_unknown_role_then_forbidden_then_identity
        claim_type: other_roles_operations_forbidden
        grounds:
          - validations[priority=1].ERR_UNAUTHENTICATED
          - validations[priority=2].ERR_UNKNOWN_ROLE
          - validations[priority=3].ERR_FORBIDDEN_ROLE
          - validations[priority=4].ERR_CUSTOMER_IDENTITY_UNKNOWN
          - validations[priority=7].ERR_ORDER_NOT_OWNED
        distinguishing_aspect: "The five auth checks fire in strict priority order on the same endpoint: no headers gives ERR_UNAUTHENTICATED (401) even though the body is also invalid, a bogus role gives ERR_UNKNOWN_ROLE (401) before any endpoint lookup, a real but unlisted role gives ERR_FORBIDDEN_ROLE (403) before any id is resolved, a Customer whose X-User-ID is not a CustomerAccount gives ERR_CUSTOMER_IDENTITY_UNKNOWN (403), and only a resolvable customer acting on someone else's order reaches ERR_ORDER_NOT_OWNED (403)."
        test_recipe:
          setup:
            - "Route R1, AMBIENT zone A1, SKU AMB-1 (700 cents, 100 units). Customer Ada owns an order with one 2-unit AMB-1 line; customer Bo exists on the same route and owns nothing."
          setup_api_calls:
