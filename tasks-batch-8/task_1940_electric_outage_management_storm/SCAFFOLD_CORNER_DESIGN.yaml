              as: Dispatcher
              captures: { cr_l: $.data.id }
            - { call: "POST /om/crews/${cr_l}/start_shift", payload: {}, as: Dispatcher }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot}", damage_class: "MINOR", estimated_repair_minutes: 10, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da: $.data.id }
            - { call: "POST /om/damage-assessments/${da}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot}", work_type: "REPAIR", required_crew_type: "LINE", requires_switching_order: false }
              as: Dispatcher
              captures: { wo: $.data.id }
            - { call: "POST /om/work-orders/${wo}/ready", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /om/work-orders/${wo}/assign", payload: { crew_id: "${cr_l}" }, as: Dispatcher, captures: { ex: $.data.execution_status, asg: $.data.assigned_crew_id } }
            - { call: "GET /om/crews/${cr_l}", payload: {}, as: Dispatcher, captures: { cst: $.data.crew_status } }
          assert:
            - "Assign response: ${ex} == DISPATCHED and ${asg} == ${cr_l}"
            - "Immediate crew read: ${cst} == EN_ROUTE (side effects visible in the next request, same logical instant)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: mutation_after_event_close_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EVENT_CLOSED]
          - state_machines.StormEvent.DEMOBILIZING_to_CLOSED
        distinguishing_aspect: "After CLOSED, any event-scoped mutation (outage create) is rejected with ERR_EVENT_CLOSED."
        test_recipe:
          setup: ["Event carried DECLARED -> ACTIVE -> DEMOBILIZING (zero outages, vacuous) -> CLOSED"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm X16", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - { call: "POST /om/storm-events/${ev_id}/begin_demobilization", payload: {}, as: EmergencyDirector }
            - { call: "POST /om/storm-events/${ev_id}/close", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
          trigger:
            - { call: "POST /om/outages", payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_EVENT_CLOSED; no outage is created on the closed event"

      - name: start_without_on_site_crew_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CREW_NOT_ON_SITE]
          - state_machines.WorkOrder.DISPATCHED_to_IN_PROGRESS
        distinguishing_aspect: "start while the assigned crew is still EN_ROUTE (arrive never called) is rejected with ERR_CREW_NOT_ON_SITE."
        test_recipe:
          setup: ["Outage confirmed; assessment accepted; REPAIR work order DISPATCHED to LINE crew (EN_ROUTE, not yet ON_SITE)"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
