              as: LegalCounsel
              captures: { case_id: $.data.id }
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${pa}", inclusion_rationale: "A in scope" }
              as: VendorAuditor
              captures: { si_a: $.data.id }
            - call: "POST /sam/audit-scope-items/${si_a}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${pb}", inclusion_rationale: "B in scope" }
              as: VendorAuditor
              captures: { si_b: $.data.id }
            - call: "POST /sam/audit-scope-items/${si_b}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/data-submissions"
              payload: { audit_case_id: "${case_id}", submission_label: "B-only package", covered_scope_item_ids: ["${si_b}"] }
              as: SAMManager
              as_user_id: "sam-mgr-1"
              captures: { sub: $.data.id }
            - call: "POST /sam/data-submissions/${sub}/submit-for-review"
              payload: {}
              as: SAMManager
            - call: "POST /sam/data-submissions/${sub}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /sam/audit-scope-items/${si_b}/exclude"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "EVIDENCE_COLLECTION" }
              as: LegalCounsel
          trigger:
            - call: "POST /sam/data-submissions/${sub}/release"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EMPTY_SUBMISSION_PACKAGE (covered CONFIRMED count == 0: item ${si_b} is EXCLUDED)"
            - "DataSubmission.${sub}.status == APPROVED (unchanged by failed release)"

