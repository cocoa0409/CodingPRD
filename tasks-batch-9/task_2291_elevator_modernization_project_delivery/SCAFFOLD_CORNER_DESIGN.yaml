        claim_type: derived_field_reconciliation
        grounds:
          - entities.ElevatorGroup.fields.cars_in_service
          - entities.ModernizationProject.fields.active_outage_count
          - calculations.project_downtime_posture
        distinguishing_aspect: "cars_in_service and active_outage_count move on different events: activation drops the single car out of service and lifts the outage count to 1, completing the window returns the count to 0 while the car stays OUTAGE_ACTIVE, and only begin-testing restores cars_in_service to 1 because a TESTING car counts as in service."
        test_recipe:
          setup:
            - "One group BANK-A with min_cars_in_service 0 and a single car delivered to PROCURING with an INSTALLED controller and a noticed window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "EXCELLENT" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv1: $.data.version }
            - call: "POST /scope-options"
              payload: { car_id: "${c1_id}", tier: "CONTROLLER_ONLY", base_price_cents: 5000000, expected_project_version: "${pv1}" }
              as: ProjectManager
              captures: { so1_id: $.data.id }
            - call: "POST /scope-options/${so1_id}/submit"
              as: ProjectManager
            - call: "POST /scope-options/${so1_id}/approve"
              as: BuildingRepresentative
              as_user_id: "${p_id}"
            - call: "POST /procurement-orders"
              payload: { scope_option_id: "${so1_id}", item_type: "CONTROLLER", lead_time_days: 30, required_staging_sqft: 400 }
              as: ProjectManager
              captures: { po1_id: $.data.id }
            - call: "POST /procurement-orders/${po1_id}/issue"
              as: ProjectManager
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv2: $.data.version }
            - call: "POST /staging-reservations"
              payload: { procurement_order_id: "${po1_id}", sqft: 400, hold_start: "2026-08-05T00:00:00Z", hold_end: "2026-08-20T00:00:00Z", expected_project_version: "${pv2}" }
              as: ServiceManager
              captures: { sr1_id: $.data.id }
            - call: "POST /procurement-orders/${po1_id}/receive"
              payload: { staging_reservation_id: "${sr1_id}" }
              as: ServiceManager
            - call: "POST /procurement-orders/${po1_id}/install"
              as: ServiceManager
            - call: "POST /outage-windows"
              payload: { car_id: "${c1_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-12T18:00:00Z", temporary_service_plan: "ADJACENT_CAR" }
              as: ProjectManager
              captures: { ow1_id: $.data.id }
            - call: "POST /outage-windows/${ow1_id}/send-notice"
              as: ProjectManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /outage-windows/${ow1_id}/activate"
              as: ServiceManager
            - call: "POST /outage-windows/${ow1_id}/complete"
              as: ServiceManager
            - call: "POST /elevator-cars/${c1_id}/begin-testing"
              as: ServiceManager
          assert:
            - "Before activation ElevatorGroup.${g_id}.car_count == 1, cars_in_service == 1 and ModernizationProject.${p_id}.active_outage_count == 0"
            - "After activation ElevatorGroup.${g_id}.cars_in_service == 0, ModernizationProject.${p_id}.active_outage_count == 1 and ElevatorCar.${c1_id}.work_status == OUTAGE_ACTIVE"
            - "After completion ModernizationProject.${p_id}.active_outage_count == 0 while ElevatorGroup.${g_id}.cars_in_service is still 0 and the car is still OUTAGE_ACTIVE"
            - "After begin-testing ElevatorCar.${c1_id}.work_status == TESTING and ElevatorGroup.${g_id}.cars_in_service == 1 - a TESTING car counts as in service"
            - "ModernizationProject.${p_id}.downtime_posture == OPEN at every one of the three checkpoints, since min_cars_in_service is 0 and staging pressure is 400 of 1200"
            - "ModernizationProject.${p_id}.version strictly increases across the three calls"

      - name: cascade_from_scope_rescind_through_procurement_staging_and_posture
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ScopeOption.APPROVED_to_SUPERSEDED
          - calculations.project_downtime_posture
        excluded_because:
          difficulty_instance: transitive_cascade / scope_rescind_unwinds_procurement_staging_posture_and_outage
          rationale: "The named §1.8 instance walks the full four-link chain end to end and asserts each intermediate row."

      - name: cascade_from_failed_reinspection_through_window_car_and_project
        claim_type: cascading_side_effects
        grounds:
          - state_machines.InspectionAppointment.SCHEDULED_to_FAILED
          - state_machines.OutageWindow.COMPLETED_to_ACTIVE
        excluded_because:
          difficulty_instance: transitive_cascade / failed_reinspection_reopens_window_freezes_project_and_reverts_closeout
          rationale: "The named §1.8 instance asserts the reopened window, the extension hours, the reverted car and the CLOSEOUT-to-EXECUTION project bubble."

      - name: dual_variant_condition_score_bases_diverge
        claim_type: dual_variant_calculation
        grounds:
          - calculations.car_condition_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / condition_score_observed_only_vs_imputed_failed
          rationale: "The named §1.8 instance asserts both variant literals on one survey and the tier each selects."

      - name: dual_variant_warranty_credit_bases_diverge
        claim_type: dual_variant_calculation
        grounds:
          - calculations.warranty_unexpired_credit.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / warranty_credit_thirty_360_vs_actual_calendar
          rationale: "The named §1.8 instance asserts the provisional THIRTY_360 credit at enrollment and the final ACTUAL_CALENDAR credit at activation, plus the delta between them."

  - section: consistency_model
    instances:
      - name: countersign_response_reflects_the_new_car_and_project_state_immediately
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.EquipmentSurvey.SUBMITTED_to_COUNTERSIGNED
        distinguishing_aspect: "The declared model is immediate: the countersign response already carries final_score 82.75, and a read of the car and the project in the same test - with no intervening write - shows condition_score 82.75, work_status SURVEYED and status SCOPING, with no lag window."
        test_recipe:
          setup:
            - "One SUBMITTED survey rating EXCELLENT / GOOD / FAIR on the project's only car."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "EXCELLENT", machine_condition: "GOOD", door_equipment_condition: "FAIR" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
              captures: { final: $.data.final_score }
            - call: "GET /elevator-cars/${c1_id}"
              as: ProjectManager
            - call: "GET /projects/${p_id}/posture"
              as: ProjectManager
          assert:
            - "The countersign response itself carries status == COUNTERSIGNED and final_score == 82.75 - no second read is needed to see the promotion"
            - "The immediately following GET /elevator-cars/${c1_id} returns work_status == SURVEYED, condition_score == 82.75 and recommended_scope_tier == CONTROLLER_ONLY"
            - "The immediately following GET /projects/${p_id}/posture returns downtime_posture == OPEN, active_outage_count == 0, staging_committed_sqft == 0, groups_below_floor == 0"
            - "GET /projects/${p_id} returns status == SCOPING and car_count == 1 with no intervening write"
