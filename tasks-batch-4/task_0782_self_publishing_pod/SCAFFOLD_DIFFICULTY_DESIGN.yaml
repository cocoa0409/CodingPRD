# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls / trigger call resolves to a
# §1.5 endpoint; every ${var} is bound by an earlier captures block; every
# formula-derived assert is a pre-computed literal.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: royalty_print_variant_vs_ebook_variant
        grounds:
          - calculations.royalty_per_unit
          - entities.ChannelPrice.fields.royalty_per_unit_cents
          - entities.Format.fields.format_type
        distinguishing_aspect: "The two variants live on the ChannelPrice domain but branch on Format.format_type: PRINT royalty = round(1500*(1-0.40)-325)=575 subtracts manufacturing cost, while EBOOK royalty = round(999*0.70-30)=669 subtracts a per-MB delivery fee — same channel, different algorithm, different number."
        test_recipe:
          setup:
            - "Channel AMZ (print+ebook, std discount 0.40, ebook 0.70 in [299,999], delivery 15c/MB, reserve 0.15)."
            - "One publisher, one title, a PRINT format (6x9, BW, 200pg => print_cost 325) and an EBOOK format (file_size 2.0 MB)."
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Dual Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmtP: "$.data.id", vP: "$.data.version" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "EBOOK", file_size_mb: 2.0 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmtE: "$.data.id", vE: "$.data.version" }
          trigger:
            - call: "POST /formats/${fmtP}/prices"
              payload: { expected_format_version: "${vP}", channel_id: "${amz}", territory: "US", list_price_cents: 1500, effective_from: "2026-01-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { priceP: "$.data.id", royP: "$.data.royalty_per_unit_cents" }
            - call: "POST /formats/${fmtE}/prices"
              payload: { expected_format_version: "${vE}", channel_id: "${amz}", territory: "US", list_price_cents: 999, effective_from: "2026-01-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { priceE: "$.data.id", royE: "$.data.royalty_per_unit_cents" }
          assert:
            - "ChannelPrice.${priceP}.royalty_per_unit_cents == 575"
            - "ChannelPrice.${priceE}.royalty_per_unit_cents == 669"
            - "ChannelPrice.${priceP}.royalty_per_unit_cents != ChannelPrice.${priceE}.royalty_per_unit_cents"

      - name: statement_provisional_net_vs_final_net
        grounds:
          - calculations.statement_rollup
          - entities.RoyaltyStatement.fields.provisional_net_cents
          - entities.RoyaltyStatement.fields.net_payable_cents
          - entities.RoyaltyStatement.fields.reserve_released_cents
        distinguishing_aspect: "On the RoyaltyStatement domain (distinct from the ChannelPrice royalty domain), the provisional forward variant reads 977 = 1150-173 while the final chronological variant locks 1322 = 1150-173+345 because it credits the prior period's matured reserve — same period data, two algorithms, 345c apart."
        test_recipe:
          setup:
            - "AMZ channel, publisher, title, PRINT format with an ACTIVE US price of royalty 575 (list 1500)."
            - "Statement P1 [03-01,03-31] with one SALE of 4 units (gross 2300, reserve 345); statement P2 [04-01,04-30] with one SALE of 2 units (gross 1150, reserve 173)."
            - "Clock advanced past both periods; P1 issued so its reserve is matured for P2."
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Ledger Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id", v1: "$.data.version" }
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${v1}", channel_id: "${amz}", territory: "US", list_price_cents: 1500, effective_from: "2026-01-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { price: "$.data.id" }
            - call: "POST /publishers/${pub}/royalty-statements"
              payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { stmt1: "$.data.id" }
            - call: "POST /sales-lines"
              payload: { format_id: "${fmt}", channel_id: "${amz}", territory: "US", units: 4, line_type: "SALE", sale_date: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { sale1: "$.data.id" }
            - call: "POST /publishers/${pub}/royalty-statements"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { stmt2: "$.data.id" }
            - call: "POST /sales-lines"
              payload: { format_id: "${fmt}", channel_id: "${amz}", territory: "US", units: 2, line_type: "SALE", sale_date: "2026-04-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { sale2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /royalty-statements/${stmt1}/issue"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /royalty-statements/${stmt2}"
              payload: {}
              as: PlatformAdmin
              captures: { prov2: "$.data.provisional_net_cents" }
            - call: "POST /royalty-statements/${stmt2}/issue"
              payload: {}
              as: PlatformAdmin
              captures: { net2: "$.data.net_payable_cents", rel2: "$.data.reserve_released_cents" }
          assert:
            - "GET of stmt2 while ACCRUING shows RoyaltyStatement.${stmt2}.provisional_net_cents == 977"
            - "After issue RoyaltyStatement.${stmt2}.reserve_released_cents == 345"
            - "After issue RoyaltyStatement.${stmt2}.net_payable_cents == 1322"
            - "RoyaltyStatement.${stmt1}.reserve_held_cents == 345"

  - rule_id: combinatorial_formula
    instances:
      - name: print_cost_tiered_rate_plus_trim_surcharge
        grounds:
          - calculations.print_cost_per_unit
          - entities.Format.fields.print_cost_cents
          - entities.Format.fields.interior_color
        distinguishing_aspect: "Mode (a): print_cost has >=3 interacting inputs with non-linear tier selection — BW/6x9 => 85+200*1.2 = 325, while PREMIUM_COLOR/8.5x11 => 85+100*(10.0+0.5) = 1135, the trim surcharge and color tier compounding."
        test_recipe:
          setup:
            - "One publisher and title; no channel needed (print_cost is computed at format create)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Cost Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
          trigger:
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmtA: "$.data.id", pcA: "$.data.print_cost_cents" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "8.5x11", interior_color: "PREMIUM_COLOR", page_count: 100 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmtB: "$.data.id", pcB: "$.data.print_cost_cents" }
          assert:
            - "Format.${fmtA}.print_cost_cents == 325"
            - "Format.${fmtB}.print_cost_cents == 1135"

      - name: reserve_round_per_line_then_sum
        grounds:
          - calculations.statement_rollup
          - calculations.sales_line_amounts
          - entities.RoyaltyStatement.fields.reserve_held_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned. Two SALE lines each gross 1150 => per-line reserve round(172.5)=173, summed to 346; the naive sum-then-round round(2300*0.15)=345 differs by 1c, and the statement MUST report 346."
        test_recipe:
          setup:
            - "AMZ channel (reserve 0.15), publisher, title, PRINT format, ACTIVE US price royalty 575."
            - "Statement period [03-01,03-31] with two SALE lines of 2 units each (gross 1150 per line)."
            - "Clock advanced to 2026-04-01 so the period has ended."
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Round Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id", v1: "$.data.version" }
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${v1}", channel_id: "${amz}", territory: "US", list_price_cents: 1500, effective_from: "2026-01-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { price: "$.data.id" }
            - call: "POST /publishers/${pub}/royalty-statements"
              payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { stmt: "$.data.id" }
            - call: "POST /sales-lines"
              payload: { format_id: "${fmt}", channel_id: "${amz}", territory: "US", units: 2, line_type: "SALE", sale_date: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /sales-lines"
              payload: { format_id: "${fmt}", channel_id: "${amz}", territory: "US", units: 2, line_type: "SALE", sale_date: "2026-03-11T00:00:00Z" }
              as: PlatformAdmin
              captures: { s2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /royalty-statements/${stmt}/issue"
              payload: {}
              as: PlatformAdmin
              captures: { rh: "$.data.reserve_held_cents", gr: "$.data.gross_royalty_cents" }
          assert:
            - "SalesLine.${s1}.reserve_held_cents == 173"
            - "RoyaltyStatement.${stmt}.gross_royalty_cents == 2300"
            - "RoyaltyStatement.${stmt}.reserve_held_cents == 346"
            - "RoyaltyStatement.${stmt}.reserve_held_cents != 345"

  - rule_id: non_linear_state_machine
    instances:
      - name: format_revision_cycle_locked_back_to_draft
        grounds:
          - state_machines.Format.CONTENT_LOCKED_to_DRAFT
          - state_machines.Proof.ORDERED_to_REVISION_REQUESTED
          - entities.Format.fields.status
        distinguishing_aspect: "Format is cyclic: a request-revision on its ORDERED proof drives Format CONTENT_LOCKED -> DRAFT, re-opening the same node it left, which a linear pipeline can never do."
        test_recipe:
          setup:
            - "Publisher, title, PRINT format with INTERIOR and COVER assets VALIDATED, format LOCKED, one proof ORDERED."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Cycle Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "INTERIOR", file_ref: "s3://int.pdf", file_format: "PDF", declared_page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { aInt: "$.data.id" }
            - call: "POST /assets/${aInt}/validate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "COVER", file_ref: "s3://cov.jpg", file_format: "JPG", paper_type: "WHITE", declared_spine_mm: 11.44 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { aCov: "$.data.id" }
            - call: "POST /assets/${aCov}/validate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /formats/${fmt}/lock"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /formats/${fmt}/proofs"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { proof: "$.data.id" }
          trigger:
            - call: "POST /proofs/${proof}/request-revision"
              payload: { revision_notes: "fix chapter 3" }
              as: Publisher
              as_user_id: "${pub}"
            - call: "GET /formats/${fmt}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt_status: "$.data.status" }
          assert:
            - "Proof.${proof}.status == REVISION_REQUESTED"
            - "Format.${fmt}.status == DRAFT"

      - name: distribution_request_approve_vs_reject_branch
        grounds:
          - state_machines.DistributionRequest.REQUESTED_to_APPROVED
          - state_machines.DistributionRequest.REQUESTED_to_REJECTED
          - entities.DistributionRequest.fields.reason
        distinguishing_aspect: "DistributionRequest branches from REQUESTED: the APPROVED branch leaves reason null and stays reachable to LIVE, while the REJECTED branch captures a reason and is terminal — divergent side-effect sets on the same source state."
        test_recipe:
          setup:
            - "AMZ channel, publisher, title, PRINT format LOCKED (interior+cover validated), with ACTIVE US and UK prices in bounds; two REQUESTED distribution requests (US and UK)."
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Branch Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "INTERIOR", file_ref: "s3://int.pdf", file_format: "PDF", declared_page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { aInt: "$.data.id" }
            - call: "POST /assets/${aInt}/validate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "COVER", file_ref: "s3://cov.jpg", file_format: "JPG", paper_type: "WHITE", declared_spine_mm: 11.44 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { aCov: "$.data.id" }
            - call: "POST /assets/${aCov}/validate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /formats/${fmt}/lock"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "GET /formats/${fmt}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { va: "$.data.version" }
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${va}", channel_id: "${amz}", territory: "US", list_price_cents: 1500, effective_from: "2026-01-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
            - call: "GET /formats/${fmt}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { vb: "$.data.version" }
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${vb}", channel_id: "${amz}", territory: "UK", list_price_cents: 1500, effective_from: "2026-01-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /formats/${fmt}/distribution-requests"
              payload: { channel_id: "${amz}", territory: "US" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { dr1: "$.data.id" }
            - call: "POST /formats/${fmt}/distribution-requests"
              payload: { channel_id: "${amz}", territory: "UK" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { dr2: "$.data.id" }
          trigger:
            - call: "POST /distribution-requests/${dr1}/approve"
              payload: {}
              as: Reviewer
              captures: { dr1s: "$.data.status" }
            - call: "POST /distribution-requests/${dr2}/reject"
              payload: { reason: "cover art too low res" }
              as: Reviewer
              captures: { dr2s: "$.data.status", dr2r: "$.data.reason" }
          assert:
            - "DistributionRequest.${dr1}.status == APPROVED"
            - "DistributionRequest.${dr2}.status == REJECTED"
            - "DistributionRequest.${dr2}.reason == 'cover art too low res'"
            - "DistributionRequest.${dr1}.reason is null"

  - rule_id: transitive_cascade
    instances:
      - name: publish_cascades_dr_live_then_title_live
        grounds:
          - state_machines.Format.CONTENT_LOCKED_to_PUBLISHED
          - state_machines.DistributionRequest.APPROVED_to_LIVE
          - state_machines.Title.DRAFT_to_LIVE
          - state_machines.Isbn
        distinguishing_aspect: "Depth-3 transitive chain from POST publish: Format->PUBLISHED (link1) causes the APPROVED DistributionRequest->LIVE (link2), and that DR->LIVE in turn causes Title DRAFT->LIVE (link3); each hop is caused by the previous, not by publish directly."
        test_recipe:
          setup:
            - "AMZ channel; publisher with a pool ISBN; title; PRINT format with interior+cover VALIDATED, ISBN assigned, LOCKED, ACTIVE US price, proof APPROVED; a distribution request created and APPROVED while the format is still CONTENT_LOCKED (so it waits in APPROVED)."
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /publishers/${pub}/isbns"
              payload: { isbn_13: "9780000000010" }
              as: PlatformAdmin
              captures: { isbn: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Cascade Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "INTERIOR", file_ref: "s3://int.pdf", file_format: "PDF", declared_page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { aInt: "$.data.id" }
            - call: "POST /assets/${aInt}/validate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "COVER", file_ref: "s3://cov.jpg", file_format: "JPG", paper_type: "WHITE", declared_spine_mm: 11.44 }
              as: Publisher
