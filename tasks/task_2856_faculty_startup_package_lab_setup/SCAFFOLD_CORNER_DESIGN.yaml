        distinguishing_aspect: "Closes the triggerability gap for ERR_PROJECT_NOT_FOUND. The catalog carries five entity-specific 404s alongside the generic ERR_RESOURCE_NOT_FOUND, so a renovation-project lookup must answer with its own id rather than the generic one."
