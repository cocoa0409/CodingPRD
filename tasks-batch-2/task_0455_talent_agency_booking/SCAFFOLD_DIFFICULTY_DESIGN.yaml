              as: Agent
              captures: { hold_id: $.data.id }
            - call: "GET /talents/${talent_id}"
              payload: {}
              as: Agent
              captures: { tv1: $.data.version }
            - call: "POST /bookings"
              payload: { deal_memo_id: "${dm_id}", talent_id: "${talent_id}", casting_call_id: "${call_id}", availability_hold_id: "${hold_id}", start_date: "2026-03-15T00:00:00Z", end_date: "2026-03-19T00:00:00Z", expected_talent_version: "${tv1}" }
              as: Agent
              captures: { booking_id: $.data.id }
            - call: "GET /talents/${talent_id}"
              payload: {}
              as: Agent
              captures: { tv2: $.data.version }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_talent_version: "${tv2}" }
              as: Agent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: Agent
            - call: "POST /bookings/${booking_id}/complete"
              payload: {}
              as: Agent
            - call: "POST /payments"
              payload: { booking_id: "${booking_id}", talent_id: "${talent_id}", gross_amount_cents: 1000000 }
              as: Agent
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /residual-schedules"
              payload: { payment_id: "${pay_id}", booking_id: "${booking_id}", period_index: 1 }
              as: Agent
              captures: { res1_id: $.data.id }
            - call: "POST /residual-schedules"
              payload: { payment_id: "${pay_id}", booking_id: "${booking_id}", period_index: 3 }
              as: Agent
              captures: { res3_id: $.data.id }
          assert:
            - "ResidualSchedule.${res1_id}.residual_amount_cents == 150000"
            - "ResidualSchedule.${res3_id}.residual_amount_cents == 75000"

      - name: payment_net_rounding_order_pinned
        grounds:
          - calculations.payment_net_to_talent
          - entities.Payment.fields.commission_withheld_cents
          - entities.Payment.fields.net_to_talent_cents
          - entities.Talent.fields.union_status
        distinguishing_aspect: |
          Mode (b): with gross 100002 for a SAG talent at 10% commission and 18.5%
          P&H, rounding each component first (commission 10000, P&H 18500) then
          subtracting yields net 71502, whereas summing then rounding once yields
          71501; the scaffold pins per-component rounding, so net must be 71502.
        test_recipe:
          setup:
            - "SAG talent, COMPLETED booking; payment posted with gross_amount_cents 100002."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /casting-directors"
              payload: { display_name: "Dana", studio: "BigPic" }
