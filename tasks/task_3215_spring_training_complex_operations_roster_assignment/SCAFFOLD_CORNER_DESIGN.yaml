              as: ComplexDirector
              captures: { gm: $.data.id, gm_observed: $.data.version }
            - call: "POST /camp-ops/games/${gm}/publish"
              payload: { expected_game_version: "${gm_observed}" }
              as: ComplexDirector
            - call: "POST /camp-ops/games/${gm}/participations"
              payload: { game_schedule_id: "${gm}", player_id: "${p1}", squad_side: "HOME_SQUAD", throw_count: 0 }
              as: FieldCoordinator
              captures: { g1: $.data.id }
            - call: "POST /camp-ops/games/${gm}/participations"
              payload: { game_schedule_id: "${gm}", player_id: "${p2}", squad_side: "HOME_SQUAD", throw_count: 0 }
              as: FieldCoordinator
