            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "C", effectiveness_pct: 0.5 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ctl: $.data.id } }
