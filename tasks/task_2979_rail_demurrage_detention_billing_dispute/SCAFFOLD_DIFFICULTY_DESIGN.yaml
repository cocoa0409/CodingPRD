  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: decide_cascades_charge_to_invoice_to_customer_four_hops
        grounds:
          - calculations.dispute_credit_allocation
          - calculations.invoice_rollup_and_status_derivation
          - entities.DemurrageCharge.fields.credit_applied_cents
          - entities.Invoice.fields.total_net_cents
          - entities.Customer.fields.credit_balance_cents
          - entities.Customer.fields.dispute_posture
        distinguishing_aspect: |
          Four hops from one write, and the last hop is not a sum of the third:
          DemurrageDispute -> DemurrageCharge (per-line credit 30908) ->
          Invoice (total_credit 30908, total_net 16642, derived status ADJUSTED,
          version +1) -> Customer (credit_balance_cents 30908 AND
          dispute_posture back to CLEAR, version +1). The Customer hop carries a
          money aggregate and an enum re-derivation that reads the dispute's NEW
          status, so an implementation that cascades money but forgets the
          posture leaves the customer stuck UNDER_REVIEW forever.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15T10:00:00Z"
            - "one ISSUED single-charge Invoice for the customer: charge A gross 47550, total_gross_cents 47550, total_credit_cents 0, status ISSUED"
            - "one WHOLE_INVOICE dispute in status UNDER_REVIEW with claimed_credit_cents 47550, one SWITCH_LIST evidence row, first_level_adjudicator_id adj-r4i1-a"
            - "Customer.credit_balance_cents is 0 and dispute_posture is UNDER_REVIEW because the dispute is open"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
