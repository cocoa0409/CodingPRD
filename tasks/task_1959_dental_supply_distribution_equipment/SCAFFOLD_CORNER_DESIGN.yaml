          setup: ["Practice P; product C price 10000"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Ic", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-25", name: "Bibs", kind: "CONSUMABLE", unit_price_cents: 10000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 3 } ] }, as: SalesRep, captures: { o: $.data.id, tot1: $.data.total_cents } }
            - { call: "GET /api/orders/${o}", payload: {}, as: DistributionAdmin, captures: { tot2: $.data.total_cents } }
          assert:
            - "Create response total_cents == 30000 and immediate GET returns the identical 30000"
