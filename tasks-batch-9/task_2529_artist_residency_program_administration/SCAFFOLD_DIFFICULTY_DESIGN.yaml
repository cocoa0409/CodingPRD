      - name: studio_shared_headcount_aggregate_capacity_exceeded
        grounds: "§1.4 P68 ERR_STUDIO_CAPACITY_EXCEEDED (business_constraint, 409, scoped to Studio.max_concurrent_residents > 1) and P46's exemption clause for shared studios; §1.1 Studio.max_concurrent_residents, Studio.active_assignment_count"
        distinguishing_aspect: |
          AGGREGATE per-day concurrency on a SHARED studio - a third interval semantics, and the only
          one where NO PAIRWISE OVERLAP IS ILLEGAL. On a 2-person studio each of the three windows is
          individually acceptable and each PAIR is acceptable; the request is rejected only because
          three windows cover one common date. The arithmetic is a per-day census
          (concurrent_active_assignments(window) + 1 <= max_concurrent_residents), not the buffered
          pairwise predicate of instance 1, and P46 explicitly exempts shared studios so the two
          rules can never both fire on the same studio. The second call proves the constraint is
          about the DAYS and not about the count of assignments: a third resident is welcome as soon
          as the window moves off the crowded dates, even though active_assignment_count then
          reaches 3 on a studio whose limit is 2.
        test_recipe:
          setup: |
            CHAIN-SHORT: one cycle, three applicants, three invited 8-week SCULPT residencies A, B
            and C all scheduled from 2026-11-02 (session_end_date 2026-12-27). One SHARED studio
            S-02 with max_concurrent_residents 2, capability_tags ["WELDING","KILN"] and
            ventilation_class LOCAL. A books the whole session 2026-11-02 .. 2026-12-27 and B books
            a short 2026-11-10 .. 2026-11-20 window; both succeed, because two concurrent residents
            are exactly the limit. C then asks for windows inside and outside the crowded stretch.
