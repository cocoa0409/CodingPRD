      - name: member_scan_sessions_subresource_lists_only_own_sessions
        claim_type: listing
        grounds: [endpoints, entities.ScanSession.fields.member_id]
        distinguishing_aspect: "GET /members/{id}/scan-sessions scopes to the member's sessions only (FK reverse reachability for ScanSession.member_id)."
        test_recipe:
          setup: ["Club, members A and B, clock 12:00; one session for A only"]
