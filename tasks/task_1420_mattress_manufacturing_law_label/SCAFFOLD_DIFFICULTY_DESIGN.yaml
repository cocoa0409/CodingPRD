  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sag_threshold_inclusive_1_5
        grounds:
          - validations[priority=10]
          - errors[ERR_SAG_BELOW_THRESHOLD]
          - entities.WarrantyClaim.fields.measured_sag_inches
        distinguishing_aspect: |
          Metric: sag depth in inches on POST /plant/warranty-claims. The SAG_DEFECT
          threshold is inclusive (>= 1.5): exactly 1.5 files successfully while 1.49
          is rejected with ERR_SAG_BELOW_THRESHOLD — one hundredth of an inch decides.
        test_recipe:
          setup:
            - "Two DELIVERED units u1,u2 (delivered 2026-08-02T00:00:00Z) under the same retailer"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-BP1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["UNDER PENALTY OF LAW THIS TAG NOT TO BE REMOVED"], prop65_warning_required: false }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp_id: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp_id}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 1000, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "CA", quantity: 2, unit_price_cents: 200000, foam_mass_required_kg: 20, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
            - { call: "POST /plant/production-orders/${o_id}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/start-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/complete-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/qc-pass", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "GET /plant/units", payload: {}, as: PlantManager, captures: { u1: "$.data[0].id", u2: "$.data[1].id" } }
            - { call: "POST /plant/shipments", payload: { order_id: "${o_id}", unit_ids: ["${u1}", "${u2}"] }, as: LogisticsCoordinator, as_user_id: log-1, captures: { s_id: $.data.id } }
            - { call: "POST /plant/shipments/${s_id}/dispatch", payload: {}, as: LogisticsCoordinator, as_user_id: log-1 }
            - { call: "POST /plant/shipments/${s_id}/deliver", payload: {}, as: LogisticsCoordinator, as_user_id: log-1 }
          trigger:
            - { call: "POST /plant/warranty-claims", payload: { unit_id: "${u1}", retailer_id: "${r_id}", claim_type: "SAG_DEFECT", measured_sag_inches: 1.5 }, as: Retailer, as_user_id: "${r_id}", captures: { cl_ok: $.data.id } }
            - { call: "POST /plant/warranty-claims", payload: { unit_id: "${u2}", retailer_id: "${r_id}", claim_type: "SAG_DEFECT", measured_sag_inches: 1.49 }, as: Retailer, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "WarrantyClaim.${cl_ok}.status == FILED"
            - "${err} == ERR_SAG_BELOW_THRESHOLD"

      - name: cure_certify_exact_boundary
        grounds:
          - calculations.cure_eligibility_time
          - errors[ERR_CURE_INCOMPLETE]
          - entities.FoamBatch.fields.cure_eligible_at
        distinguishing_aspect: |
          Metric: logical-clock timestamp on POST /plant/foam-batches/{id}/certify-cured
          (different endpoint than the sag boundary). The check is inclusive
          (clock >= cure_eligible_at): one second before eligibility fails with
          ERR_CURE_INCOMPLETE; exactly AT cure_eligible_at certifies.
        test_recipe:
          setup:
            - "STANDARD batch curing since 2026-08-01T00:00:00Z at NORMAL temp; cure_eligible_at = 2026-08-02T00:00:00Z"
          setup_api_calls:
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 500, chamber_id: "CH-BND" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1, captures: { elig: $.data.cure_eligible_at } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T23:59:59Z" }, as: PlantManager }
          trigger:
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1, captures: { err: $.data.error_id } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1, captures: { st: $.data.status } }
          assert:
            - "${elig} == 2026-08-02T00:00:00Z"
            - "${err} == ERR_CURE_INCOMPLETE"
            - "${st} == CURED"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shipment_requires_active_law_label
        grounds:
          - state_machines.Shipment
          - validations[priority=6]
          - errors[ERR_LABEL_NOT_ACTIVE]
          - entities.Shipment.fields.order_id
        distinguishing_aspect: |
          Pair Shipment → LawLabel: shipment creation is gated on the existence of an
          ACTIVE LawLabel for (order.model_id, destination_state). After the label is
          superseded by a cert revoke (order already COMPLETE, so not held) and a fresh
          cert restores cert validity, shipment create still fails with
          ERR_LABEL_NOT_ACTIVE until a new label is generated/approved/activated.
        test_recipe:
          setup:
            - "COMPLETE order dest CA with units MANUFACTURED; label was ACTIVE then superseded via cert revoke; a NEW approved cert makes the model cert-clean again (model back to CERT_REVIEW accepts new certificates)"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-XD1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
