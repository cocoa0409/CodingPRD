# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of the claim-extraction guide against SCAFFOLD.yaml §1.1-§1.7.
# excluded_because stubs cite §1.8 instances by name. Clock default 2026-05-01.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_terminal_returns_all_fields
        claim_type: Creation
        grounds: [entities.Terminal.fields.demurrage_daily_rate_cents, entities.Terminal.fields.slot_capacity_per_window]
        distinguishing_aspect: "POST /terminals with all required fields returns 201 with echoed inputs plus system id/created_at/version and default slot_capacity_per_window=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /terminals", payload: { name: "Berth 55", code: "B55", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id", cap: "$.data.slot_capacity_per_window" } }
          assert:
            - "response http_status == 201"
            - "Terminal.${term_id}.demurrage_daily_rate_cents == 12500"
            - "Terminal.${term_id}.slot_capacity_per_window == 1"
            - "Terminal.${term_id}.version == 1"

      - name: booking_missing_required_linehaul_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Booking.fields.linehaul_base_cents
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /bookings omitting the required linehaul_base_cents returns ERR_VALIDATION (400) and creates nothing."
        test_recipe:
          setup: ["A terminal exists."]
          setup_api_calls:
            - { call: "POST /terminals", payload: { name: "Berth 56", code: "B56", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
          trigger:
            - { call: "POST /bookings", payload: { container_number: "MSCUX", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_VALIDATION"
            - "response http_status == 400"

      - name: booking_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_BOOKING_NOT_FOUND]
        distinguishing_aspect: "GET /bookings/{unknown-uuid} returns ERR_BOOKING_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /bookings/00000000-0000-4000-8000-000000000000", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_BOOKING_NOT_FOUND"
            - "response http_status == 404"

      - name: booking_container_size_default_applied
        claim_type: Defaults
        grounds: [entities.Booking.fields.container_size]
        distinguishing_aspect: "POST /bookings omitting container_size applies the default D40."
        test_recipe:
          setup: ["A terminal exists."]
          setup_api_calls:
            - { call: "POST /terminals", payload: { name: "Berth 57", code: "B57", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
          trigger:
            - { call: "POST /bookings", payload: { container_number: "MSCUY", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
          assert:
            - "Booking.${bkg_id}.container_size == D40"
            - "Booking.${bkg_id}.status == DRAFT"

      - name: booking_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Booking.fields.status, entities.Booking.fields.demurrage_actual_cents]
        distinguishing_aspect: "id/created_at/version and computed demurrage_actual_cents are server-generated; a client-supplied status is ignored and DRAFT is set."
        test_recipe:
          setup: ["A terminal exists."]
          setup_api_calls:
            - { call: "POST /terminals", payload: { name: "Berth 58", code: "B58", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
          trigger:
            - { call: "POST /bookings", payload: { container_number: "MSCUZ", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
          assert:
            - "Booking.${bkg_id}.status == DRAFT"
            - "Booking.${bkg_id}.demurrage_actual_cents == 0"
            - "Booking.${bkg_id}.version == 1"

      - name: weigh_ticket_is_overweight_computed
        claim_type: Computed Fields
        grounds: [entities.WeighTicket.fields.is_overweight]
        excluded_because:
          difficulty_instance: overweight_weight_boundary_at_and_over_limit
          rationale: "is_overweight computation and its strict '>' boundary are asserted in the named §1.8 boundary instance."

  - section: state_machines
    instances:
      - name: confirm_twice_second_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Booking.DRAFT_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming an already-CONFIRMED booking returns ERR_INVALID_STATE (409); no version change on the second call."
        test_recipe:
          setup: ["A DRAFT booking confirmed once."]
          setup_api_calls:
            - { call: "POST /terminals", payload: { name: "Berth 59", code: "B59", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU10", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "Booking.${bkg_id}.status == CONFIRMED"

      - name: cancel_already_canceled_booking_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Booking.DRAFT_to_CANCELED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a CANCELED (terminal) booking returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT booking canceled once."]
          setup_api_calls:
            - { call: "POST /terminals", payload: { name: "Berth 60", code: "B60", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU11", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/cancel", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /bookings/${bkg_id}/cancel", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "Booking.${bkg_id}.status == CANCELED"

      - name: release_chassis_from_confirmed_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Booking.CHASSIS_ASSIGNED_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "release-chassis on a CONFIRMED booking (no chassis assigned) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CONFIRMED booking with no chassis assigned."]
          setup_api_calls:
            - { call: "POST /terminals", payload: { name: "Berth 61", code: "B61", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU12", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /bookings/${bkg_id}/release-chassis", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "Booking.${bkg_id}.status == CONFIRMED"

      - name: leg_completion_branch_divergent_excluded
        claim_type: branching
        grounds: [state_machines.Leg.DISPATCHED_to_COMPLETED]
        excluded_because:
          difficulty_instance: leg_completion_branch_divergent
          rationale: "PICKUP vs RETURN completion fork is exercised by the named §1.8 non-linear instance."

      - name: street_turn_transfers_chassis_to_export_booking
        claim_type: branching
        grounds: [state_machines.Leg.DISPATCHED_to_COMPLETED, entities.Leg.fields.linked_export_booking_id, entities.Booking.fields.chassis_id]
        distinguishing_aspect: "STREET_TURN completion (branch C) empties the import booking WITHOUT returning the chassis and reassigns that still-OUT chassis to the linked EXPORT booking (CONFIRMED -> CHASSIS_ASSIGNED)."
        test_recipe:
          setup: ["Import booking DELIVERED with chassis OUT; export booking CONFIRMED; STREET_TURN leg linking them dispatched."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Berth 62", code: "B62", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHXST", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del ST", license_number: "LST" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "IMP1", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkgI_id: "$.data.id" } }
            - { call: "POST /bookings/${bkgI_id}/confirm", payload: {}, as: Dispatcher, captures: { bkgI_v: "$.data.version" } }
            - { call: "POST /bookings/${bkgI_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkgI_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkgI_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-15T06:00:00Z", window_end: "2026-05-30T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkgI_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-15T08:00:00Z", window_end: "2026-05-15T12:00:00Z" }, as: Dispatcher, captures: { leg_pick_id: "$.data.id" } }
            - { call: "POST /legs/${leg_pick_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_pick_id}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /bookings", payload: { container_number: "EXP1", direction: "EXPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 40000 }, as: Dispatcher, captures: { bkgE_id: "$.data.id" } }
            - { call: "POST /bookings/${bkgE_id}/confirm", payload: {}, as: Dispatcher }
            - { call: "POST /legs", payload: { booking_id: "${bkgI_id}", driver_id: "${drv_id}", leg_type: "STREET_TURN", linked_export_booking_id: "${bkgE_id}", window_start: "2026-05-16T08:00:00Z", window_end: "2026-05-16T12:00:00Z" }, as: Dispatcher, captures: { leg_st_id: "$.data.id" } }
            - { call: "POST /legs/${leg_st_id}/dispatch", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /legs/${leg_st_id}/complete", payload: {}, as: Dispatcher }
          assert:
            - "Booking.${bkgI_id}.status == EMPTY_RETURNED"
            - "Chassis.${chx_id}.status == OUT"
            - "Booking.${bkgE_id}.chassis_id == ${chx_id}"
            - "Booking.${bkgE_id}.status == CHASSIS_ASSIGNED"

  - section: calculations
    instances:
      - name: invoice_min_charge_floor_applies
        claim_type: Correct Result
        grounds: [calculations.invoice_total, entities.Invoice.fields.total_charge_cents]
        distinguishing_aspect: "Booking linehaul 30000 (<100000, no discount) -> fuel round(30000*0.22)=6600; subtotal 36600 < MIN_CHARGE 50000, so total_charge_cents == 50000 (max floor engaged)."
        test_recipe:
          setup: ["Booking linehaul 30000 driven to DELIVERED with 0 demurrage / 0 per-diem; invoice generated."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Berth 63", code: "B63", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHXG", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del Floor", license_number: "LF" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU13", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 30000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-06T06:00:00Z", window_end: "2026-05-20T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-06T08:00:00Z", window_end: "2026-05-06T12:00:00Z" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
            - { call: "POST /legs/${leg_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/complete", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /invoices", payload: { booking_id: "${bkg_id}" }, as: Biller, captures: { inv_id: "$.data.id" } }
          assert:
            - "Invoice.${inv_id}.fuel_surcharge_cents == 6600"
            - "Invoice.${inv_id}.total_charge_cents == 50000"

      - name: per_diem_free_day_boundary
        claim_type: threshold
        grounds: [calculations.per_diem_accrued, entities.Chassis.fields.per_diem_provisional_cents]
        distinguishing_aspect: "Per-diem free-day boundary: chassis OUT since 2026-05-15 with free_days=4 reads per_diem_provisional_cents==0 at 2026-05-19 (4 days out) and ==8500 at 2026-05-20 (5 days out) — a distinct metric from the demurrage-day boundary."
        test_recipe:
          setup: ["Chassis (rate 8500, free 4) OUT at 2026-05-15 via pickup dispatch."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Berth 64", code: "B64", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHXH", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del PD", license_number: "LPD" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU14", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-15T06:00:00Z", window_end: "2026-05-30T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-15T08:00:00Z", window_end: "2026-05-15T12:00:00Z" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
            - { call: "POST /legs/${leg_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-19T00:00:00Z" }, as: Dispatcher }
          trigger:
            - { call: "GET /chassis/${chx_id}", payload: {}, as: Dispatcher, captures: { pp_at_free: "$.data.per_diem_provisional_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: Dispatcher }
            - { call: "GET /chassis/${chx_id}", payload: {}, as: Dispatcher, captures: { pp_after_free: "$.data.per_diem_provisional_cents" } }
          assert:
            - "captured pp_at_free == 0"
            - "captured pp_after_free == 8500"

      - name: demurrage_estimate_vs_actual_excluded
        claim_type: Variant Divergence
        grounds: [calculations.demurrage_accrued]
        excluded_because:
          difficulty_instance: demurrage_estimate_vs_actual_on_booking
          rationale: "Estimate/actual divergence is the subject of the named §1.8 dual-variant instance."

  - section: validations
    instances:
      - name: missing_auth_header_returns_401
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no/unknown X-User-Role header returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Auth headers omitted on the request."]
          setup_api_calls: []
          trigger:
            - { call: "POST /terminals", payload: { name: "NoAuth", code: "NA", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "with the X-User-Role header stripped, captured err == ERR_UNAUTHENTICATED"
            - "response http_status == 401"

      - name: biller_cannot_dispatch_leg_returns_unauthorized
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Biller (billing-only) calling POST /legs/{id}/dispatch returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A PLANNED pickup leg on an APPOINTED booking exists."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Berth 65", code: "B65", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHXI", pool_scac: "POOL", per_diem_rate_cents: 8500 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del RB", license_number: "LRB" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU15", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-06T06:00:00Z", window_end: "2026-05-20T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-06T08:00:00Z", window_end: "2026-05-06T12:00:00Z" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
          trigger:
            - { call: "POST /legs/${leg_id}/dispatch", payload: {}, as: Biller, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_UNAUTHORIZED"
            - "Leg.${leg_id}.status == PLANNED"

      - name: dispatcher_cannot_create_invoice_returns_unauthorized
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Dispatcher (non-billing) calling POST /invoices returns ERR_UNAUTHORIZED (403) — peer-role isolation."
        test_recipe:
          setup: ["A DELIVERED booking exists (invoiceable)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Berth 66", code: "B66", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHXJ", pool_scac: "POOL", per_diem_rate_cents: 8500 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del DI", license_number: "LDI" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU16", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
