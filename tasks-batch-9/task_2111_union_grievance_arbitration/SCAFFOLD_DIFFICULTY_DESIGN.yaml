            - "Identical fixture to arbitration_estimated_vs_actual_cost_diverge through hearing scheduling."
            - "Case file advanced to BRIEFS_FILED so an award may be recorded."
            - "Clock moved to 2026-11-14T00:00:00Z, after the hearing window closed on 2026-10-06T17:00:00Z."
