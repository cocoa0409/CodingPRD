        distinguishing_aspect: "Activating a new lease on a lot FROZEN by an open conversion vote returns ERR_LOT_FROZEN (409). Uses a vacant lot frozen indirectly is impossible, so it tests activate on a frozen-occupied path via a PENDING lease created before open then activated after freeze."
