      - name: corner_unit_price_unavailable_gate_is_keyed_on_the_uom_rule_alone
        claim_type: conditional_validation
        grounds:
          - validations.priority_54
          - errors.ERR_UNIT_PRICE_UNAVAILABLE
          - calculations.unit_price_display
        distinguishing_aspect: "A net_content_qty of 0 leaves the three unit-price fields null instead of dividing by zero, distribution still succeeds because unit_price_required is false, and the refusal to task the line is keyed on unit_price_uom_rule — switching the rule to PER_SINGLE_ITEM lifts the block even though the line's stored (stale, still null) display fields never change."
        test_recipe:
          setup:
            - "Jurisdiction with unit_price_required false and the default PER_UNIT_MEASURE_CANONICAL rule; one store, one aisle, certified sm1 and la1."
            - "A DRAFT file with a zero-content line and a normal line."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-NV", name: "Nevada", unit_price_required: false, grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_b: $.data.id, uom_rule: $.data.unit_price_uom_rule, required_flag: $.data.unit_price_required }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S002", name: "Desert Road", jurisdiction_id: "${jur_b}" }
              as: PricingAdmin
              captures: { store_b: $.data.id }
            - call: "POST /price-integrity/stores/${store_b}/associates"
              payload: { employee_number: "E-SM2", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm2: $.data.id }
            - call: "POST /price-integrity/associates/${sm2}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_b}/associates"
              payload: { employee_number: "E-LA2", full_name: "Lin Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la2: $.data.id }
            - call: "POST /price-integrity/associates/${la2}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_b}/aisles"
              payload: { aisle_code: "B01", category_code: "MEAT", assigned_associate_id: "${la2}" }
              as: PricingAdmin
              captures: { ai_b1: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-2", jurisdiction_id: "${jur_b}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_b}"] }
              as: PricingAdmin
              captures: { file_2: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_2}/lines"
              payload: { item_upc: "00000000008001", item_description: "Variable weight brisket", category_code: "MEAT", old_retail_cents: 0, new_retail_cents: 1299, net_content_qty: 0, net_content_uom: "LB" }
              as: PricingAdmin
              captures: { line_zero: $.data.id, up_zero: $.data.unit_price_display_cents, bq_zero: $.data.unit_price_basis_qty, bu_zero: $.data.unit_price_basis_uom }
            - call: "POST /price-integrity/price-change-files/${file_2}/lines"
              payload: { item_upc: "00000000008002", item_description: "Ground chuck 2 LB", category_code: "MEAT", old_retail_cents: 899, new_retail_cents: 800, net_content_qty: 2, net_content_uom: "LB" }
              as: PricingAdmin
              captures: { line_ok: $.data.id, up_ok: $.data.unit_price_display_cents, bq_ok: $.data.unit_price_basis_qty, bu_ok: $.data.unit_price_basis_uom }
          trigger:
            - call: "POST /price-integrity/price-change-files/${file_2}/distribute"
              as: PricingAdmin
              captures: { f2_status: $.data.status, ver_1: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_2}/label-tasks"
              payload: { store_id: "${store_b}", price_change_line_id: "${line_zero}", aisle_id: "${ai_b1}", assigned_associate_id: "${la2}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_price_change_file_version: "${ver_1}" }
              as: StoreManager
              as_user_id: "${sm2}"
              captures: { err_unavail: $.data.error_id }
            - call: "POST /price-integrity/price-change-files/${file_2}/label-tasks"
              payload: { store_id: "${store_b}", price_change_line_id: "${line_ok}", aisle_id: "${ai_b1}", assigned_associate_id: "${la2}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_price_change_file_version: "${ver_1}" }
              as: StoreManager
              as_user_id: "${sm2}"
              captures: { lt_ok: $.data.id }
            - call: "PATCH /price-integrity/jurisdictions/${jur_b}"
              payload: { unit_price_uom_rule: "PER_SINGLE_ITEM" }
              as: PricingAdmin
              captures: { uom_rule_2: $.data.unit_price_uom_rule }
            - call: "GET /price-integrity/price-change-lines/${line_zero}"
              as: PricingAdmin
              captures: { up_zero_2: $.data.unit_price_display_cents, bq_zero_2: $.data.unit_price_basis_qty }
            - call: "GET /price-integrity/price-change-files/${file_2}"
              as: PricingAdmin
              captures: { ver_2: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_2}/label-tasks"
              payload: { store_id: "${store_b}", price_change_line_id: "${line_zero}", aisle_id: "${ai_b1}", assigned_associate_id: "${la2}", scheduled_start_at: "2026-08-02T12:00:00Z", scheduled_end_at: "2026-08-02T14:00:00Z", expected_price_change_file_version: "${ver_2}" }
              as: StoreManager
              as_user_id: "${sm2}"
              captures: { lt_zero: $.data.id, due_zero: $.data.due_at }
          assert:
            - "${uom_rule} == PER_UNIT_MEASURE_CANONICAL (default) and ${required_flag} == false (explicitly set)"
            - "The zero-content line is created (HTTP 201) with ${up_zero} == null, ${bq_zero} == null and ${bu_zero} == null — the basis_qty == 0 guard stops before the division"
            - "${up_ok} == 400, ${bq_ok} == 2 and ${bu_ok} == LB for the normal line (800 / 2 LB)"
            - "${f2_status} == DISTRIBUTED — the unit-price distribution precondition is skipped because unit_price_required is false, so the null-priced line does not block the file"
            - "Tasking the zero-content line: HTTP 422 with ${err_unavail} == ERR_UNIT_PRICE_UNAVAILABLE"
            - "Tasking the normal line with the identical window and assignee: HTTP 201 — the rule is per line, not per file"
            - "After the PATCH, ${uom_rule_2} == PER_SINGLE_ITEM while ${up_zero_2} == null and ${bq_zero_2} == null: PATCH /jurisdictions re-derives signage and posture only, never unit prices"
            - "Tasking the same zero-content line now succeeds: HTTP 201 with ${due_zero} == 2026-08-05T00:00:00Z == 2026-08-03T00:00:00Z + 48h, proving the gate reads the live unit_price_uom_rule and not the line's stored fields"

