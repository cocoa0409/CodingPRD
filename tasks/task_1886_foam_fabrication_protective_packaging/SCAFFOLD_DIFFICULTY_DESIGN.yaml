            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 500 }, as: SalesEngineer, captures: { ord_id: $.data.id } }
            - { call: "POST /api/production-orders/${ord_id}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer }
            - { call: "POST /api/production-orders/${ord_id}/start", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /api/production-orders/${ord_id}/hold", payload: {}, as: QualityEngineer, captures: { hold_state: $.data.quality_hold, fab_during_hold: $.data.fab_status } }
            - { call: "POST /api/production-orders/${ord_id}/complete", payload: {}, as: PlantManager, captures: { blocked_err: $.data.error_id } }
            - { call: "POST /api/production-orders/${ord_id}/release-hold", payload: {}, as: QualityEngineer }
            - { call: "POST /api/production-orders/${ord_id}/complete", payload: {}, as: PlantManager, captures: { final_fab: $.data.fab_status } }
          assert:
            - "hold sets quality_hold == ON_HOLD while fab_status stays IN_PROGRESS (dimensions independent)"
            - "complete while ON_HOLD fails with ERR_INVALID_STATE"
            - "after release-hold, complete succeeds: fab_status == COMPLETED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: supersede_cascade_cancels_orders_and_deamortizes
        grounds:
          - state_machines.CutProgram.LOCKED_to_OBSOLETE
          - state_machines.ProductionOrder.CONFIRMED_to_CANCELLED
          - entities.Tooling.fields.amortized_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /api/cut-programs with supersedes: the
          create obsoletes the old LOCKED program (link 1); the program's
          obsolescence cancels the CONFIRMED order referencing it (link 2); the
          order's cancellation de-amortizes the die (link 3). Each link is caused
          by the previous link, not by the original request.
        test_recipe:
          setup:
            - "Approved spec + LOCKED DIE program P1 with IN_SERVICE tooling T1"
            - "Order O1 qty 500 CONFIRMED on P1 (T1.amortized_cents == 125000)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp1: $.data.id } }
            - { call: "POST /api/cut-programs/${cp1}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp1}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp1}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp1}", qty: 500 }, as: SalesEngineer, captures: { o1: $.data.id } }
            - { call: "POST /api/production-orders/${o1}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v2: $.data.version } }
          trigger:
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v2}", supersedes_cut_program_id: "${cp1}" }, as: DesignEngineer, captures: { cp2: $.data.id } }
            - { call: "GET /api/cut-programs/${cp1}", as: DesignEngineer, captures: { cp1_status: $.data.status } }
            - { call: "GET /api/production-orders/${o1}", as: SalesEngineer, captures: { o1_status: $.data.fab_status } }
            - { call: "GET /api/toolings/${tool_id}", as: DesignEngineer, captures: { tool_amortized: $.data.amortized_cents } }
          assert:
            - "CutProgram.${cp2}.status == DRAFT (new program created)"
            - "CutProgram.${cp1}.status == OBSOLETE (link 1: superseded by create)"
            - "ProductionOrder.${o1}.fab_status == CANCELLED (link 2: caused by program obsolescence)"
            - "Tooling.${tool_id}.amortized_cents == 0 (link 3: caused by order cancellation de-amortizing 125000)"

      - name: release_ship_triggers_replenishment_below_reorder
        grounds:
          - state_machines.ReleaseOrder.ALLOCATED_to_SHIPPED
          - calculations.replenishment_calc
          - entities.InventoryProgram.fields.on_hand_qty
        distinguishing_aspect: |
          Depth-2 chain triggered by POST /api/release-orders/{id}/ship (distinct
          from the supersede trigger): ship mutates the program's stock fields
          (link 1: on_hand 1000 -> 150); that on_hand mutation crossing strictly
          below reorder_point 200 itself triggers auto-creation of a REPLENISHMENT
          production order qty 850 (link 2).
        test_recipe:
          setup:
            - "Approved spec + LOCKED DIE program; program PROG (CURRENT, max 1000, reorder 200, min 50) ACTIVE with on_hand 1000"
