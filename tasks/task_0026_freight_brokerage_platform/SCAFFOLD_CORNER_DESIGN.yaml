        test_recipe:
          setup:
            - "Clock pinned. Shipper s_id exists; carrier c_id PENDING."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
