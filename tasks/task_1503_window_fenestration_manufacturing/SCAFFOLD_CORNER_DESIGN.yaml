# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of §1.1–§1.7 claims not
# already exercised by §1.8. claim_type values follow the claim-extraction
# guide's per-section tables. Stubs mark corners already covered in §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: dealer_created_with_credit_active_default
        claim_type: defaults
        grounds: [entities.Dealer.fields.credit_status]
        distinguishing_aspect: "Omitting nothing but required fields: new Dealer starts credit_status ACTIVE and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { d: $.data.id, cs: $.data.credit_status, v: $.data.version } }
          assert:
            - "credit_status == ACTIVE (system default)"
            - "version == 1; id is a bare UUID; created_at == 2026-08-01T00:00:00Z logical default clock"

      - name: order_defaults_ship_to_from_dealer_and_initial_states
        claim_type: defaults
        grounds: [entities.WindowOrder.fields.ship_to_state_code, entities.WindowOrder.fields.production_status, entities.WindowOrder.fields.compliance_status]
        distinguishing_aspect: "ship_to_state_code omitted -> defaults from Dealer; production_status DRAFT and compliance_status PENDING on creation."
        test_recipe:
          setup: ["Dealer MN exists"]
          setup_api_calls:
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
          trigger:
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { o: $.data.id, st: $.data.ship_to_state_code, ps: $.data.production_status, cs: $.data.compliance_status } }
          assert:
            - "ship_to_state_code == 'MN' inherited from dealer"
            - "production_status == DRAFT; compliance_status == PENDING; totals all 0; promised_date null"

      - name: energy_label_auto_created_unevaluated_without_rule
        claim_type: computed_fields
        grounds: [entities.EnergyLabel.fields.compliance, calculations.energy_code_rule_selection]
        distinguishing_aspect: "Line creation cascade-creates a PROVISIONAL EnergyLabel; with NO rule for the ship-to state, compliance == UNEVALUATED and applied rule null."
        test_recipe:
          setup: ["V200, GP1, dealer WI (no WI energy rule); DRAFT order"]
          setup_api_calls:
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "LakeLine", ship_to_state_code: "WI" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { line: $.data.id } }
            - { call: "GET /fenestration/order-lines/${line}/energy-label", as: PlantManager, captures: { basis: $.data.0.basis, comp: $.data.0.compliance, rule: $.data.0.applied_energy_code_rule_id, u: $.data.0.u_factor } }
          assert:
            - "EnergyLabel exists (array length 1), basis == PROVISIONAL, status == PROVISIONAL"
            - "compliance == UNEVALUATED and applied_energy_code_rule_id == null (no WI rule)"
            - "u_factor == 0.28 (catalog), shgc == 0.40"

      - name: get_nonexistent_order_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fenestration/orders/00000000-0000-0000-0000-000000000000", as: PlantManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND, http 404"]

      - name: line_create_rejects_invalid_shape_enum
        claim_type: type_constraints
        grounds:
          - entities.OrderLine.fields.shape
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Enum membership: shape 'HEXAGON' is not in {RECTANGLE, ARCH, CIRCLE, TRAPEZOID} -> 400."
        test_recipe:
          setup: ["V200, GP1, dealer, DRAFT order"]
          setup_api_calls:
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "HEXAGON", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST; no line persisted (GET /fenestration/orders/${ord}/lines empty)"]

      - name: circle_shape_requires_equal_dimensions
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - entities.OrderLine.fields.shape
        distinguishing_aspect: "CIRCLE with width 30 height 36 rejected; CIRCLE 30x30 accepted and priced with area factor 0.785 (glazing round(30*30/144*0.785,2) == 4.91 sqft)."
        test_recipe:
          setup: ["V200, GP1, dealer, DRAFT order"]
          setup_api_calls:
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "CIRCLE", width_in: 30, height_in: 36, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { err: $.data.error_id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "CIRCLE", width_in: 30, height_in: 30, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { glaz: $.data.glazing_sqft, tot: $.data.line_total_cents } }
          assert:
            - "First attempt: error_id == ERR_INVALID_REQUEST (CIRCLE width != height)"
            - "Second: glazing_sqft == 4.91 and line_total_cents == 130419 (60*1500*1.40=126000 + 4.91*900=4419)"

      - name: orders_list_pagination_and_dealer_filter
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, endpoints.GET_/fenestration/orders]
        distinguishing_aspect: "Pagination envelope: 3 orders for dealer A + 1 for dealer B; dealer_id filter + limit 2 yields total_count 3, has_more true, then offset 2 yields 1 row."
        test_recipe:
          setup: ["Dealers A and B; 3 orders on A, 1 on B"]
          setup_api_calls:
            - { call: "POST /fenestration/dealers", payload: { name: "A", ship_to_state_code: "MN" }, as: PlantManager, captures: { dA: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "B", ship_to_state_code: "WI" }, as: PlantManager, captures: { dB: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dA}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dA}", order_date: "2026-08-03T00:00:00Z" }, as: PlantManager }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dA}", order_date: "2026-08-04T00:00:00Z" }, as: PlantManager }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dB}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "GET /fenestration/orders", payload: { dealer_id: "${dA}", limit: 2, offset: 0 }, as: PlantManager }
            - { call: "GET /fenestration/orders", payload: { dealer_id: "${dA}", limit: 2, offset: 2 }, as: PlantManager }
          assert:
            - "Page 1: 2 rows, meta pagination total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 row, has_more == false; all rows dealer_id == ${dA}"

      - name: wave_create_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.ProductionWave.fields.allocated_units]
        distinguishing_aspect: "Client-supplied computed field allocated_units: 99 in the create body is ignored; server initializes 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500, allocated_units: 99 }, as: ProductionLead, captures: { au: $.data.allocated_units, v: $.data.version } }
          assert:
            - "allocated_units == 0 (client input for computed field ignored)"
            - "status == PLANNED; version == 1"

      - name: ig_unit_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.IGUnit.fields.status, entities.IGUnit.fields.remake_of_id]
        distinguishing_aspect: "IG units are system-created only at wave release — there is no public create endpoint; status/remake_of_id are system-owned."
        test_recipe:
          setup: ["covered implicitly: every §1.8 production chain shows units appear only after wave release"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fenestration/ig-units", payload: {}, as: ProductionLead }
          assert:
            - "GET /fenestration/ig-units on empty DB returns empty array with total_count 0 (no fabrication path exists outside wave release)"

  - section: state_machines
    instances:
      - name: confirm_order_without_lines_returns_error
        claim_type: precondition_enforcement
        grounds:
          - state_machines.WindowOrder.DRAFT_to_CONFIRMED
          - errors[ERR_ORDER_HAS_NO_LINES]
        distinguishing_aspect: "Confirm requires >= 1 non-CANCELLED line; empty order confirm -> ERR_ORDER_HAS_NO_LINES."
        test_recipe:
          setup: ["dealer; empty DRAFT order"]
          setup_api_calls:
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ORDER_HAS_NO_LINES; order stays DRAFT"]

      - name: double_confirm_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.WindowOrder.DRAFT_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Repeating the confirm trigger on an already-CONFIRMED order fails with ERR_INVALID_STATE (no silent idempotent success)."
        test_recipe:
          setup: ["dealer; order with one line; already confirmed"]
          setup_api_calls:
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager }
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE on second confirm"]

      - name: cancelled_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WindowOrder.DRAFT_to_CANCELLED]
        distinguishing_aspect: "CANCELLED is terminal: confirm on a cancelled order -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["dealer; order with line; cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager }
            - { call: "POST /fenestration/orders/${ord}/cancel", as: PlantManager }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE (CANCELLED is terminal)"]

      - name: qc_check_on_queued_unit_returns_not_ready
        claim_type: invalid_transition
        grounds:
          - state_machines.IGUnit.GAS_FILLED_to_QC_PASSED
          - errors[ERR_IG_NOT_READY_FOR_QC]
        distinguishing_aspect: "qc-check from QUEUED (skipping GLASS_CUT/SEALED/GAS_FILLED) -> ERR_IG_NOT_READY_FOR_QC."
        test_recipe:
          setup: ["MN rule, V200, GP1, dealer; qty1 line in production; unit QUEUED (never advanced)"]
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { line: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager }
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: ProductionLead, captures: { wave: $.data.id } }
            - { call: "POST /fenestration/production-waves/${wave}/open", as: ProductionLead }
            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { wv: $.data.version } }
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ord}", expected_wave_version: "${wv}" }, as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/lock", as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/release", as: ProductionLead }
            - { call: "GET /fenestration/order-lines/${line}/ig-units", as: ProductionLead, captures: { u0: $.data.0.id } }
          trigger:
            - { call: "POST /fenestration/ig-units/${u0}/qc-check", payload: { argon_measured_pct: 95 }, as: ProductionLead, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_IG_NOT_READY_FOR_QC; unit stays QUEUED"]

      - name: advance_terminal_broken_unit_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.IGUnit.SEALED_to_BROKEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "BROKEN is terminal for the unit itself: advance on a BROKEN unit -> ERR_INVALID_STATE (only the remake continues)."
        test_recipe:
          setup: ["MN rule, V200, GP1, dealer; qty1 line in production; unit broken at QUEUED"]
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { line: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager }
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: ProductionLead, captures: { wave: $.data.id } }
            - { call: "POST /fenestration/production-waves/${wave}/open", as: ProductionLead }
            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { wv: $.data.version } }
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ord}", expected_wave_version: "${wv}" }, as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/lock", as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/release", as: ProductionLead }
            - { call: "GET /fenestration/order-lines/${line}/ig-units", as: ProductionLead, captures: { u0: $.data.0.id } }
            - { call: "POST /fenestration/ig-units/${u0}/report-breakage", payload: { break_cause: "HANDLING" }, as: ProductionLead }
          trigger:
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE; BROKEN is terminal for the unit"]

