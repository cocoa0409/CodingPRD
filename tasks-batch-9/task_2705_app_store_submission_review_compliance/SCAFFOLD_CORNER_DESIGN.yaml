          - calculations.disclosure_accuracy_score.variants.SELF_REVIEW_PROVISIONAL
        distinguishing_aspect: "risk_component is 100 * (1 - 0.9500) == 5.00 and it enters with weight -0.20, so a build that queues on a perfect standing but an imperfect privacy label scores 50.00 - 1.00 == 49.00 - still NORMAL, but measurably below the pristine case."
