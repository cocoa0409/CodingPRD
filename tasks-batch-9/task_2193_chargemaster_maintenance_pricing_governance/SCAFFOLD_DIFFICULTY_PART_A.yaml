              as: RevenueIntegrityAnalyst
              captures: { rflat_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc300_id}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-08-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
