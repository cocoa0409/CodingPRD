      - name: hardness_projection_strict_threshold
        grounds:
          - calculations.hardness_projection
          - entities.ShelfLifeStudy.fields.hardness_limit_n
        distinguishing_aspect: |
          A different metric (texture newtons) on a different endpoint (shelf-life pulls):
          the failure predicate is STRICTLY greater-than, so a study whose projection lands
          exactly on its limit (152.86 == 152.86) stays ACTIVE while an identical study with
          limit 150.00 auto-transitions to FAILED.
        test_recipe:
          setup:
            - "revision RS APPROVED (claims []); two ACTIVE studies S1 (limit 152.86) and S2 (limit 150.00), chambers CH-A/CH-B, start 2026-08-01, expiry 2026-10-30 (90 shelf days), pull interval 7"
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED", allergens_handled: ["MILK"] }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "FS", bar_weight_g: 60 }, as: FormulationScientist, captures: { fs: "$.data.id" } }
            - { call: "POST /mfg/formulas/${fs}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 19, claim_tags: [] }, as: FormulationScientist, captures: { rs: "$.data.id" } }
            - { call: "POST /mfg/revisions/${rs}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rs}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${rs}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rs}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/shelf-life-studies", payload: { revision_id: "${rs}", chamber_id: "CH-A", shelf_position: "P1", start_utc: "2026-08-01T00:00:00Z", expiry_utc: "2026-10-30T00:00:00Z", hardness_limit_n: 152.86, pull_interval_days: 7 }, as: LabTechnician, captures: { st1: "$.data.id" } }
            - { call: "POST /mfg/shelf-life-studies", payload: { revision_id: "${rs}", chamber_id: "CH-B", shelf_position: "P1", start_utc: "2026-08-01T00:00:00Z", expiry_utc: "2026-10-30T00:00:00Z", hardness_limit_n: 150.0, pull_interval_days: 7 }, as: LabTechnician, captures: { st2: "$.data.id" } }
            - { call: "POST /mfg/shelf-life-studies/${st1}/pulls", payload: { hardness_n: 50.0, recorded_utc: "2026-08-01T00:00:00Z" }, as: LabTechnician }
            - { call: "POST /mfg/shelf-life-studies/${st2}/pulls", payload: { hardness_n: 50.0, recorded_utc: "2026-08-01T00:00:00Z" }, as: LabTechnician }
            - { call: "POST /mfg/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /mfg/shelf-life-studies/${st1}/pulls", payload: { hardness_n: 58.0, recorded_utc: "2026-08-08T00:00:00Z" }, as: LabTechnician }
            - { call: "POST /mfg/shelf-life-studies/${st2}/pulls", payload: { hardness_n: 58.0, recorded_utc: "2026-08-08T00:00:00Z" }, as: LabTechnician }
            - { call: "GET /mfg/shelf-life-studies/${st1}/projection", payload: {}, as: LabTechnician, captures: { p1: "$.data.projected_hardness_at_expiry_n", w1: "$.data.will_fail", n1: "$.data.pulls_used" } }
            - { call: "GET /mfg/shelf-life-studies/${st1}", payload: {}, as: LabTechnician, captures: { st1_status: "$.data.status" } }
            - { call: "GET /mfg/shelf-life-studies/${st2}", payload: {}, as: LabTechnician, captures: { st2_status: "$.data.status" } }
          assert:
            - "projection == 152.86 (50.0 + (58.0-50.0)/7 * 90, round_half_up 2dp)"
            - "S1 (limit 152.86): projected == limit does NOT fail — status stays ACTIVE, will_fail == false, pulls_used == 2"
            - "S2 (limit 150.00): identical pulls auto-transition the study to FAILED"

