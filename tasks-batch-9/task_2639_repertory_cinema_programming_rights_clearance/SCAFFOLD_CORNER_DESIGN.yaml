      - name: booking_counter_loops_through_rounds_and_stops_at_the_ceiling
        claim_type: cyclic
        grounds:
          - state_machines.Booking[COUNTERED -> COUNTERED]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
          - validations[priority=21]
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_counter_self_loop_negotiation_cycle
          rationale: "The named 1.8 instance drives the COUNTERED -> COUNTERED self-loop to MAX_NEGOTIATION_ROUNDS and asserts the ERR_NEGOTIATION_ROUNDS_EXHAUSTED termination, so the cyclic-shape claim is already covered."

      - name: kdm_revoke_cascades_from_key_through_showtime_to_ticket_orders
        claim_type: cross_entity
        grounds:
          - state_machines.KdmKey[ISSUED -> REVOKED]
          - state_machines.Showtime[KEY_PENDING -> UNVERIFIED]
          - state_machines.TicketOrder[RESERVED -> VOID]
        excluded_because:
          difficulty_instance: transitive_cascade / kdm_revoke_pulls_sales_and_refunds_depth_three
          rationale: "The named 1.8 instance asserts all three hops of the revoke cascade, including the sale_status close and the void of unpaid holds."

