            - "adult_max_weekly_minutes == 2700 — an untouched default is not reset or nulled by the PATCH"
            - "League.${league_id}.version == 2 and ${league_v1} == 1"
            - "PATCH /team-houses returned 200 with turnaround_buffer_minutes == 30, name still Vanguard House, timezone still America/Los_Angeles and concurrent_seat_capacity still 5"
            - "TeamHouse.${house_id}.version == 2 and ${house_v1} == 1"
            - "GET /team-houses/${house_id} as CoachingStaff returns the same four values, so the PATCH was persisted and not just echoed"
            - "GET /organizations/${org_id}/team-houses returns total_count == 1, holding ${house_id} with organization_id == ${org_id}"

  # ===========================================================================
  # Every id in SCAFFOLD.yaml §1.6 is triggered by at least one instance across
  # §1.8 + §1.9; this section pins the *shape* of the failure response and the
  # guarantee that a refused call writes nothing.
  - section: errors
    instances:

      - name: error_envelope_shape_is_uniform_across_status_classes
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_PLAYER_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_DISTRIBUTION_NOT_CALCULATED]
          - errors[ERR_ORGANIZATION_VERSION_STALE]
          - errors[ERR_UNAUTHORIZED]
          - response_envelope.error
        distinguishing_aspect: |
          One recipe walks a 404, a 422, a 409, a 412 and a 403 and requires the same envelope from
          all five: response_type "error", a non-empty meta.api_request_id and
          meta.api_request_timestamp, and a data object holding exactly error_id and message with no
          leaked entity fields. It then proves each refusal was atomic — the malformed player was
          not created, the stale roster move does not exist, and the DRAFT distribution kept its
          status and version.
        test_recipe:
          setup:
            - "One league, one organization, one adult player on an ACTIVE contract, and one DRAFT prize distribution"
            - "The organization's version is bumped once so a previously captured version becomes stale"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Mina Okafor", birth_date: "2001-05-14", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { p1_id: $.data.id }
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${p1_id}", base_salary_cents: 12500000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 20, tax_residency_code: "US-CA" }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /contract-offers/${o1_id}/accept"
              payload: { effective_at: "2026-08-05T00:00:00Z" }
              as: PlayerAgent
              as_user_id: "${p1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /prize-distributions"
              payload: { organization_id: "${org_id}", league_id: "${league_id}", tournament_name: "Summer Invitational", placement: 1, gross_prize_cents: 10000000, tournament_end_at: "2026-08-20T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "finance-1"
              captures: { dist_id: $.data.id, dist_v1: $.data.version }
            - call: "GET /organizations/${org_id}"
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_v_stale: $.data.version }
            - call: "PATCH /organizations/${org_id}"
              payload: { annual_salary_budget_cents: 55000000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /players/00000000-0000-0000-0000-0000000000ff"
              as: Scout
              as_user_id: "scout-7"
              captures: { e404: $.data.error_id }
            - call: "POST /players"
              payload: { full_name: "Iris Vale", birth_date: "2003-02-02" }
              as: Scout
              as_user_id: "scout-7"
              captures: { e422: $.data.error_id }
            - call: "POST /prize-distributions/${dist_id}/approve"
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { e409: $.data.error_id }
            - call: "POST /roster-moves"
              payload: { organization_id: "${org_id}", player_id: "${p1_id}", move_type: "RELEASE", contract_id: "${c1_id}", effective_at: "2026-08-10T00:00:00Z", expected_organization_version: "${org_v_stale}" }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { e412: $.data.error_id }
            - call: "POST /leagues"
              payload: { name: "Rogue League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z" }
              as: Scout
              as_user_id: "scout-7"
              captures: { e403: $.data.error_id }
            - call: "GET /players"
              payload: { limit: 10, offset: 0 }
              as: Scout
              as_user_id: "scout-7"
            - call: "GET /roster-moves"
              payload: { organization_id: "${org_id}", limit: 10, offset: 0 }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "GET /prize-distributions/${dist_id}"
              as: FinanceOfficer
              as_user_id: "finance-1"
            - call: "GET /leagues"
              payload: { limit: 10, offset: 0 }
              as: LeagueAdmin
              as_user_id: "admin-1"
          assert:
            - "GET /players/00000000-0000-0000-0000-0000000000ff returned 404 with ${e404} == ERR_PLAYER_NOT_FOUND"
            - "POST /players without region_code returned 422 with ${e422} == ERR_INVALID_REQUEST"
            - "POST /prize-distributions/${dist_id}/approve on a DRAFT distribution returned 409 with ${e409} == ERR_DISTRIBUTION_NOT_CALCULATED"
            - "POST /roster-moves with the pre-PATCH ${org_v_stale} returned 412 with ${e412} == ERR_ORGANIZATION_VERSION_STALE"
            - "POST /leagues as Scout returned 403 with ${e403} == ERR_UNAUTHORIZED"
            - "All five responses carry response_type == error, a non-empty meta.api_request_id and a parseable ISO-8601 meta.api_request_timestamp"
            - "All five data objects contain exactly the keys error_id and message, message is a non-empty string, and no entity field (id, version, created_at) leaks into data"
            - "GET /players returns total_count == 1 (only ${p1_id}) — the 422 created nothing"
            - "GET /roster-moves for ${org_id} returns total_count == 0 — the 412 created nothing"
            - "GET /prize-distributions/${dist_id} still reports distribution_status DRAFT with version == ${dist_v1} — the 409 mutated nothing"
            - "GET /leagues returns total_count == 1 (only ${league_id}) — the 403 created nothing"

  # ===========================================================================
  - section: rbac
    instances:

      - name: role_exclusive_operations_are_refused_to_every_other_role
        claim_type: Exclusive Operation Denial
        grounds:
          - roles[LeagueAdmin].exclusive_operations
          - roles[Scout].exclusive_operations
          - roles[GeneralManager].exclusive_operations
          - roles[SponsorshipManager].exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Seven writes are attempted by a role that does not appear in the endpoint's roles list —
          including an unrecognised role name and a FinanceOfficer reaching for the LeagueAdmin-only
          approval — and every one is refused with ERR_UNAUTHORIZED at priority 2, before the state
          check that would otherwise have produced ERR_DISTRIBUTION_NOT_CALCULATED. The same
          operations performed by their owning role succeed, and the shared read GET /players works
          for two different roles.
