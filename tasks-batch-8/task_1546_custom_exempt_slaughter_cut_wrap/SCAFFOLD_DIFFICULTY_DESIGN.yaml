            - { call: "POST /locker/appointments", payload: { customer_id: "${cA}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${cA}", captures: { apptA: $.data.id } }
            - { call: "POST /locker/appointments/${apptA}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${cA}" }
            - { call: "GET /locker/appointments/${apptA}/animals", payload: {}, as: PlantOperator, captures: { anA: "$.data[0].id" } }
            - { call: "POST /locker/animals/${anA}/receive", payload: { tag_id: "TAG-A", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${anA}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${anA}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${anA}/shares", payload: { owner_customer_id: "${cA}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${cA}", captures: { sA: $.data.id } }
            - { call: "POST /locker/animals/${anA}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/shares/${sA}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${cA}", captures: { csA: $.data.id } }
            - { call: "POST /locker/cut-sheets/${csA}/submit", payload: {}, as: Customer, as_user_id: "${cA}" }
            - { call: "POST /locker/appointments", payload: { customer_id: "${cB}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${cB}", captures: { apptB: $.data.id } }
            - { call: "POST /locker/appointments/${apptB}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${cB}" }
            - { call: "GET /locker/appointments/${apptB}/animals", payload: {}, as: PlantOperator, captures: { anB: "$.data[0].id" } }
            - { call: "POST /locker/animals/${anB}/receive", payload: { tag_id: "TAG-B", live_weight_lbs: 280.0 }, as: PlantOperator }
