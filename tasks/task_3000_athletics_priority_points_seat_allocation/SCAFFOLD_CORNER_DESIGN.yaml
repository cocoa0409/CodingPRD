        distinguishing_aspect: |
          One PlatformAdmin request rewrites four entities: the Section's capacity,
          requirement and history; the Seat inventory; the SeatAssignment's price;
          and the payment axis of a row that was already settled. The
          discriminating detail is that the row moves PAID -> INVOICED while
          amount_paid_cents is preserved and occupancy_status stays ASSIGNED, so
          the two parallel axes provably move independently. The price is the
          proration of the NEW requirement, not of the old one:
          round_half_up(500000 x 7 / 12) == 291667, and requirement_cents is
          overwritten in place by that share per the §1.3 formula. pricing_mode
