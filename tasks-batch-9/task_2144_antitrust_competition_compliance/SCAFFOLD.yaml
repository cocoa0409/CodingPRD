    code: 200
    input: [response]
    output: CompetitorContact
    side_effects: ["status := UNDER_REVIEW", "remediation_response recorded"]

  - method: POST
    path: "/compliance/competitor-contacts/{id}/clearance"
    description: "Counsel clears the contact and refunds its exposure charge"
    roles: [AntitrustCounsel]
    code: 200
    input: [notes]
    output: CompetitorContact
    side_effects:
      - "status := CLEARED"
      - "COMPENSATION: BusinessUnit.exposure_points -= exposure_points_charged; exposure_points_charged := 0.00; posture recomputed; BusinessUnit.version += 1"

  - method: POST
