      - name: version_increments_on_mutations
        claim_type: optimistic_concurrency
        grounds: [entities.Engagement.fields.status, "concurrency_rules[report-create-stale-engagement]"]
        distinguishing_aspect: "Engagement.version walks 1 (create) -> 2 (submit) -> 3 (accept) -> 4 (report creation bumps parent), one increment per mutation."
        test_recipe:
          setup: ["client and two appraisers exist"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "100 Main St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1 }
              as: EngagementManager
              captures: { eng_id: $.data.id, v1: $.data.version }
            - call: "POST /engagements/${eng_id}/submit"
              payload: {}
              as: EngagementManager
              captures: { v2: $.data.version }
            - call: "POST /engagements/${eng_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { v3: $.data.version }
            - call: "POST /engagements/${eng_id}/reports"
              payload: { expected_engagement_version: "${v3}" }
              as: StaffAppraiser
              as_user_id: "${aa_id}"
            - call: "GET /engagements/${eng_id}"
              as: EngagementManager
              captures: { v4: $.data.version }
          assert:
            - "version after create == 1, after submit == 2, after accept == 3, after report create == 4"

      - name: dual_variant_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.fee_quote, calculations.noi_variants]
        excluded_because:
          difficulty_instance: fee_tiered_vs_per_sf_diverge
