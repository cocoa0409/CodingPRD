            - "the 2027 call: HTTP status is 201 with total_budget == 10625.00 ((300 + 200 + 150 + 200) * 12.5)"

      - name: work_order_charged_to_plan_of_another_block_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=97]
          - errors[ERR_PLAN_BLOCK_MISMATCH]
          - entities.WorkOrder.fields.farming_plan_id
        distinguishing_aspect: "Validity depends on a second entity's foreign key: a work order for block B-14 that cites B-12's APPROVED plan returns ERR_PLAN_BLOCK_MISMATCH at HTTP 409 (not ERR_PLAN_NOT_APPROVED, which is satisfied), and B-12's plan ledger stays at committed_cost 0.00."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with blocks B-12 (12.5 acres, planted 2018) and B-14 (4.0 acres, planted 2020)."
            - "APPROVED FarmingPlan P12 for B-12 plan_year 2026 (total_budget 14687.50); B-14 has no plan."
            - "PIECE_RATE crew CR1 with all four task capabilities."
