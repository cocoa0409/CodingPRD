            - call: "POST /applicants/${ap1}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /applicants"
              payload: { full_name: "A2", email: "to2b@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { ap2: $.data.id }
            - call: "POST /applicants/${ap2}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${ap1}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${ap1}"
              captures: { sub1: $.data.id }
            - call: "POST /subscriptions/${sub1}/assign-vehicle"
              payload: { vehicle_id: "${v1}", expected_vehicle_version: "${v1_v0}" }
              as: FleetOperator
