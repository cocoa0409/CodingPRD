  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_budget_finalize
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[budget-finalize-stale-proposal]", "validations[priority=4]"]
        distinguishing_aspect: "Two strictly sequential finalizes carrying the same expected_proposal_version: the first succeeds (version advances), the second is rejected 412 ERR_STALE_VERSION — re-finalize from BUDGET_LOCKED would otherwise legitimately supersede."
        test_recipe:
          setup: ["opportunity (no cost-share), eligible PI, 54% rate; proposal with one line; version captured"]
          setup_api_calls:
