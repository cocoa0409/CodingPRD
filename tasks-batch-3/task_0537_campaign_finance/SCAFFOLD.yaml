    output: LobbyingActivity
    side_effects: []
  - method: GET
    path: "/disclosure/activities"
    description: "Public-search disclosure across lobbying activities."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: ["registrant_id?", "client_id?", "min_amount_cents?", "status?", "limit?", "offset?"]
    output: LobbyingActivity[]
    side_effects: []
  - method: POST
    path: "/disclosure/activities/{id}/void"
    description: "Void a recorded activity: RECORDED -> VOIDED; registrant spend totals recomputed (compensating)."
    roles: [LobbyRegistrant]
    code: 200
    input: []
    output: LobbyingActivity
    side_effects:
      - "status RECORDED->VOIDED"
      - "LobbyingRegistrant.total_committed_spend_cents (and total_certified if applicable) recomputed; increments LobbyingRegistrant.version by 1"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_FORBIDDEN_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the target resource"
  - id: ERR_COMMITTEE_NOT_FOUND
    http: 404
    condition: "committee id in path does not exist"
  - id: ERR_CONTRIBUTION_NOT_FOUND
    http: 404
    condition: "contribution id in path does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "report id in path does not exist"
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "reporting-period id (path or body period_id) does not exist"
  - id: ERR_REGISTRANT_NOT_FOUND
    http: 404
    condition: "registrant id in path does not exist"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client id (path or body client_id) does not exist"
  - id: ERR_ACTIVITY_NOT_FOUND
    http: 404
    condition: "activity id in path does not exist"
  - id: ERR_LOBBYING_PERIOD_NOT_FOUND
    http: 404
    condition: "lobbying-period id (path or body period_id) does not exist"
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required field, wrong type, or invalid enum member"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "amount_cents <= 0"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_committee_version does not match the committee's current version"
  - id: ERR_COMMITTEE_NOT_PENDING
    http: 409
    condition: "approve requires committee.status == PENDING"
  - id: ERR_COMMITTEE_NOT_ACTIVE
    http: 409
    condition: "operation (suspend, or contribution/expenditure/report create) requires committee.status == ACTIVE"
  - id: ERR_CONTRIBUTION_NOT_RECORDED
    http: 409
    condition: "deposit requires settlement_status == RECORDED"
  - id: ERR_CONTRIBUTION_NOT_DEPOSITED
    http: 409
    condition: "refund requires settlement_status == DEPOSITED"
  - id: ERR_CONTRIBUTION_NOT_VOIDABLE
    http: 409
    condition: "void requires settlement_status IN {RECORDED, DEPOSITED}"
  - id: ERR_CONTRIBUTION_REVIEW_INVALID
    http: 409
    condition: "flag requires review_status == UNREVIEWED; clear requires review_status == FLAGGED"
  - id: ERR_REPORT_NOT_DRAFT
    http: 409
    condition: "file requires report.status == DRAFT"
  - id: ERR_REPORT_NOT_FILED
    http: 409
    condition: "amend or audit-open requires report.status == FILED"
  - id: ERR_REPORT_NOT_UNDER_AUDIT
    http: 409
    condition: "audit-close requires report.status == UNDER_AUDIT"
  - id: ERR_PENALTY_NOT_ASSESSED
    http: 409
    condition: "penalty waive requires report.penalty_status == ASSESSED"
  - id: ERR_PERIOD_NOT_OPEN
    http: 409
    condition: "close requires period.status == OPEN"
  - id: ERR_PERIOD_NOT_CLOSED
    http: 409
    condition: "filing requires covered ReportingPeriod.status == CLOSED"
  - id: ERR_REGISTRANT_NOT_ACTIVE
    http: 409
    condition: "client/activity create or terminate requires registrant.status == ACTIVE"
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "activity create requires client.status == ACTIVE"
  - id: ERR_ACTIVITY_NOT_VOIDABLE
    http: 409
    condition: "void requires activity.status == RECORDED"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "new reporting period conflicts with an existing one in scope (interval semantics per period type)"
  - id: ERR_ACTIVITY_OVERLAP
    http: 409
    condition: "new activity date collides with another RECORDED activity for the same (registrant, client)"
  - id: ERR_PROHIBITED_SOURCE
    http: 409
    condition: "contributor_type is prohibited for this committee_type"
  - id: ERR_CONTRIBUTION_LIMIT_EXCEEDED
    http: 409
    condition: "per-contributor per-cycle aggregate would exceed the limit"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Treasurer
    description: "Committee officer; owns a committee's finance surface."
    identity: "entity_backed:Committee"
    exclusive_operations:
      - "POST /disclosure/committees (register; no owner check pre-creation)"
      - "POST /disclosure/committees/{id}/terminate"
      - "POST /disclosure/committees/{id}/contributions"
      - "POST /disclosure/contributions/{id}/deposit"
      - "POST /disclosure/contributions/{id}/refund"
      - "POST /disclosure/committees/{id}/expenditures"
      - "POST /disclosure/committees/{id}/reports"
      - "POST /disclosure/reports/{id}/file"
      - "POST /disclosure/reports/{id}/amend"
    shared_operations:
      - "all GET endpoints"

  - name: RegulatorAuditor
    description: "Agency operator; approval, compliance void/flag/clear, period lifecycle, audit, penalty waive, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /disclosure/_clock/set_current_utc"
      - "POST /disclosure/committees/{id}/approve"
      - "POST /disclosure/committees/{id}/suspend"
      - "POST /disclosure/contributions/{id}/void"
      - "POST /disclosure/contributions/{id}/flag"
      - "POST /disclosure/contributions/{id}/clear"
      - "POST /disclosure/reporting-periods"
      - "POST /disclosure/reporting-periods/{id}/close"
      - "POST /disclosure/reports/{id}/audit-open"
      - "POST /disclosure/reports/{id}/audit-close"
      - "POST /disclosure/reports/{id}/penalty/waive"
      - "POST /disclosure/lobbying-periods"
      - "POST /disclosure/lobbying-periods/{id}/close"
    shared_operations:
      - "all GET endpoints"

  - name: LobbyRegistrant
    description: "Lobbying registrant; owns a registrant's clients and activities."
    identity: "entity_backed:LobbyingRegistrant"
    exclusive_operations:
      - "POST /disclosure/registrants (register; no owner check pre-creation)"
      - "POST /disclosure/registrants/{id}/terminate"
      - "POST /disclosure/registrants/{id}/clients"
      - "POST /disclosure/clients/{id}/deactivate"
      - "POST /disclosure/registrants/{id}/activities"
      - "POST /disclosure/activities/{id}/void"
    shared_operations:
      - "all GET endpoints"

  - name: PublicViewer
    description: "Read-only public-search disclosure user."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints"
