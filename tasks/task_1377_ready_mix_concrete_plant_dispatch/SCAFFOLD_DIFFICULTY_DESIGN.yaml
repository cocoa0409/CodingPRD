            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 16.0, pour_date: "2026-08-17", pour_window_start: "07:00", pour_window_end: "14:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l1_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l1_id}/batch", payload: { batch_time: "2026-08-17T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l1_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T10:20:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l1_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T11:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l1_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "GET /v1/orders/${o_id}", payload: {}, as: Dispatcher, captures: { o_v2: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v2}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l2_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/loads/${l2_id}/batch", payload: { batch_time: "2026-08-17T11:15:00Z" }, as: BatchOperator, captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/loads/${l2_id}/batch", payload: { batch_time: "2026-08-17T11:30:00Z" }, as: BatchOperator }
          assert:
            - "L2 batch at 11:15: error_id == ERR_TRUCK_OVERLAP (75 min < 90 min buffer)"
            - "L2 batch at 11:30 (exactly 90 min): succeeds — Load.${l2_id}.status == BATCHED (closed interval, equality allowed)"
            - "Truck.${t1_id}.status == ON_DELIVERY after the successful batch"

  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: load_volume_conservation_return_washout
        grounds:
          - state_machines.Load.POURING_to_RETURNED
          - state_machines.Load.RETURNED_to_WASHED_OUT
          - entities.Load.fields.discharged_qty_yd3
          - validations[priority=8]
        distinguishing_aspect: |
          Conserved quantity is cubic yards: the return pair must satisfy
          discharged_qty_yd3 + returned_qty_yd3 == qty_yd3 exactly — 5.0 + 3.5 = 8.5
          is rejected with ERR_VOLUME_NOT_CONSERVED, while 5.0 + 3.0 = 8.0 leaves the
          load's volume account balanced through RETURNED -> WASHED_OUT.
        test_recipe:
          setup:
            - "Standard catalog; order qty 8.0 pour 2026-08-15; one 8.0 yd3 load POURING on T1"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /v1/loads/${l_id}/return", payload: { discharged_qty_yd3: 5.0, returned_qty_yd3: 3.5, disposition: "RECYCLED" }, as: Driver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/loads/${l_id}/return", payload: { discharged_qty_yd3: 5.0, returned_qty_yd3: 3.0, disposition: "RECYCLED" }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/washout", payload: { washout_water_gal: 120 }, as: BatchOperator }
            - { call: "GET /v1/loads/${l_id}/return-record", payload: {}, as: Dispatcher, captures: { rr_qty: "$.data[0].returned_qty_yd3", rr_wash: "$.data[0].washout_water_gal" } }
          assert:
            - "First return (5.0 + 3.5 = 8.5 != 8.0): error_id == ERR_VOLUME_NOT_CONSERVED; load stays POURING"
            - "Second return (5.0 + 3.0 == 8.0): Load.${l_id}.status == RETURNED, discharged_qty_yd3 == 5.0, returned_qty_yd3 == 3.0"
            - "After washout: Load.${l_id}.status == WASHED_OUT, ReturnRecord.washout_water_gal == 120, Truck.${t1_id}.status == AVAILABLE"
            - "Invariant holds end-to-end: discharged 5.0 + returned 3.0 == batched 8.0"

      - name: invoice_total_line_conservation_through_adjust
        grounds:
          - state_machines.Invoice.DISPUTED_to_ISSUED
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.line_items
        distinguishing_aspect: |
          Conserved quantity is money (cents), not volume: after dispute, each adjust
          keeps total_cents == sum(line_items.amount_cents) and
          new_total == old_total + sum(adjustments) — 159300 +1000 -300 lands exactly
          at 160000, which is then the only payable amount.
        test_recipe:
          setup:
            - "Standard catalog (2026-08 index 115.0); delivered order qty 8.0 with one 90-minute load; invoice issued at 159300"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-08", index_points: 115.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "GET /v1/invoices", payload: { order_id: "${o_id}" }, as: Dispatcher, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /v1/invoices/${inv_id}/issue", payload: {}, as: PlantManager }
            - { call: "POST /v1/invoices/${inv_id}/dispute", payload: {}, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /v1/invoices/${inv_id}/adjust", payload: { adjustment_lines: [ { description: "after-hours premium", amount_cents: 1000 } ] }, as: PlantManager }
            - { call: "POST /v1/invoices/${inv_id}/dispute", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /v1/invoices/${inv_id}/adjust", payload: { adjustment_lines: [ { description: "goodwill credit", amount_cents: -300 } ] }, as: PlantManager }
            - { call: "POST /v1/invoices/${inv_id}/pay", payload: { amount_cents: 160000 }, as: Customer, as_user_id: "${c_id}" }
          assert:
            - "After +1000: Invoice.${inv_id}.total_cents == 160300 == 159300 + 1000 and == sum(line_items.amount_cents)"
            - "After -300: Invoice.${inv_id}.total_cents == 160000 == 160300 - 300 (no drift across the cycle)"
            - "Pay of exactly 160000 succeeds: Invoice.${inv_id}.status == PAID"
