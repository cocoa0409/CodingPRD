  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: gift_liability_conserved_across_check_in_and_cancel
        grounds:
          - calculations.gift_liability_ledger
          - state_machines[TourBooking]
          - entities.TourChannel.gift_liability_cents
        distinguishing_aspect: |
          Conserved quantity: TourChannel.gift_liability_cents must equal, at every instant,
          the sum of gift_value_cents over that channel's bookings in status CHECKED_IN or
          TOURED. Two gifted check-ins raise it 0 -> 12500 -> 25000 and the two cancellations
          take it back 25000 -> 12500 -> 0 with no drift, while each booking row KEEPS
          gift_issued true and gift_value_cents 12500 -- the compensation happens in the
          ledger, never by rewriting history on the booking.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery (capacity 4) with two ACTIVE representatives so both tours can be checked in."
