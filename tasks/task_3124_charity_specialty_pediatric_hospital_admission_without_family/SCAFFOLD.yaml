    code: 200
    input: [new_screening_date]
    output: OutreachScreening
    side_effects: ["booked_screening_count += 1; screening_date := new_screening_date; version += 1"]

  # --- PhilanthropicFund / FundAllocation ---
  - method: POST
    path: "/charity-care/philanthropic-funds"
    description: "Create a philanthropic fund for a fiscal year"
    roles: [PhilanthropyOfficer]
    code: 201
    input: [fund_name, fiscal_year, total_committed_cents]
    output: PhilanthropicFund
    side_effects: ["allocated_cents := 0; available_cents := total_committed_cents; status := OPEN"]

  - method: GET
    path: "/charity-care/philanthropic-funds"
    description: "List funds"
    roles: [NetworkAdmin, PhilanthropyOfficer, CareCoordinator]
    code: 200
    input: ["fiscal_year?", "status?", "limit?", "offset?"]
    output: "PhilanthropicFund[]"
    side_effects: []

  - method: GET
    path: "/charity-care/philanthropic-funds/{fundId}"
    description: "Get one fund"
    roles: [NetworkAdmin, PhilanthropyOfficer, CareCoordinator]
    code: 200
    input: []
    output: PhilanthropicFund
    side_effects: []

  - method: POST
    path: "/charity-care/philanthropic-funds/{fundId}/lock"
    description: "Lock a fund (no new commits while locked)"
    roles: [PhilanthropyOfficer]
    code: 200
    input: []
    output: PhilanthropicFund
    side_effects: ["version += 1"]

  - method: POST
    path: "/charity-care/philanthropic-funds/{fundId}/unlock"
    description: "Unlock a fund"
    roles: [PhilanthropyOfficer]
    code: 200
    input: []
    output: PhilanthropicFund
    side_effects: ["version += 1"]

  - method: POST
    path: "/charity-care/philanthropic-funds/{fundId}/close"
    description: "Close a locked fund (terminal; no PLEDGED allocations may remain)"
    roles: [PhilanthropyOfficer]
    code: 200
    input: []
    output: PhilanthropicFund
    side_effects: ["version += 1"]

  - method: POST
    path: "/charity-care/philanthropic-funds/{id}/allocations"
    description: "Pledge an allocation from a fund to a hospital, optionally restricted to a program or designated to a care plan"
    roles: [PhilanthropyOfficer]
    code: 201
    input: [hospital_id, amount_cents, "program_id?", "care_plan_id?"]
    output: FundAllocation
    side_effects: ["status := PLEDGED; fund balances unchanged until commit"]

  - method: GET
    path: "/charity-care/philanthropic-funds/{id}/allocations"
    description: "List allocations of a fund"
    roles: [NetworkAdmin, PhilanthropyOfficer, CareCoordinator]
    code: 200
    input: ["status?", "hospital_id?", "limit?", "offset?"]
    output: "FundAllocation[]"
    side_effects: []


  - method: GET
    path: "/charity-care/fund-allocations"
    description: "List allocations across funds (filtered list form for FK reverse-reachability)"
    roles: [NetworkAdmin, PhilanthropyOfficer, CareCoordinator]
    code: 200
    input: ["fund_id?", "hospital_id?", "program_id?", "care_plan_id?", "status?", "limit?", "offset?"]
    output: "FundAllocation[]"
    side_effects: []

  - method: GET
    path: "/charity-care/fund-allocations/{allocationId}"
    description: "Get one allocation"
    roles: [NetworkAdmin, PhilanthropyOfficer, CareCoordinator]
    code: 200
    input: []
    output: FundAllocation
    side_effects: []

  - method: POST
    path: "/charity-care/fund-allocations/{allocationId}/commit"
    description: "Commit a pledged allocation (OCC-guarded on the fund; boundary: equality of amount and available commits to zero)"
    roles: [PhilanthropyOfficer]
    code: 200
    input: [expected_fund_version]
    output: FundAllocation
    side_effects: ["allocation_weight computed; fund.allocated_cents += amount; fund.available_cents -= amount; fund.version += 1; care plan funding_status recompute when care_plan_id set"]

  - method: POST
    path: "/charity-care/fund-allocations/{allocationId}/withdraw"
    description: "Withdraw a pledged allocation (no fund impact)"
    roles: [PhilanthropyOfficer]
    code: 200
    input: []
    output: FundAllocation
    side_effects: ["version += 1"]

  - method: POST
    path: "/charity-care/fund-allocations/{allocationId}/release"
    description: "Release a committed allocation back to the fund (compensating action)"
    roles: [PhilanthropyOfficer]
    code: 200
    input: []
    output: FundAllocation
    side_effects: ["fund.allocated_cents -= amount; fund.available_cents += amount; fund.version += 1; care plan funding_status recompute when care_plan_id set"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or out-of-enum value in request body" }
  - { id: ERR_HOSPITAL_NOT_FOUND, http: 404, condition: "Hospital id does not exist" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Program id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id does not exist" }
  - { id: ERR_REFERRAL_SOURCE_NOT_FOUND, http: 404, condition: "Referral source id does not exist" }
  - { id: ERR_SCREENING_NOT_FOUND, http: 404, condition: "Screening id does not exist" }
  - { id: ERR_CLINIC_NOT_FOUND, http: 404, condition: "Outreach clinic id does not exist" }
  - { id: ERR_FUND_NOT_FOUND, http: 404, condition: "Philanthropic fund id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Fund allocation id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not exist" }
  - { id: ERR_BILLING_ACCOUNT_NOT_FOUND, http: 404, condition: "Billing account id does not exist" }
  - { id: ERR_CARE_PLAN_NOT_FOUND, http: 404, condition: "Care plan id does not exist" }
  - { id: ERR_STAGE_NOT_FOUND, http: 404, condition: "Staged procedure id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "Travel support grant id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "Insurance policy id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_CONDITION_OUT_OF_SCOPE, http: 422, condition: "Application condition_category does not match the program's category, or is OTHER" }
  - { id: ERR_AGE_INELIGIBLE, http: 422, condition: "Patient age at submission outside [min_age_months, max_age_months) of the program" }
  - { id: ERR_INTERNATIONAL_NOT_ACCEPTED, http: 422, condition: "International referral targeted a program with accepts_international == false" }
  - { id: ERR_REVIEWER_CONFLICT, http: 403, condition: "Deciding member is the member who requested info on the current round (segregation of duties)" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "Weighted vote quorum on the current round not met, or both accept and deny weights nonzero" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Program must be ACTIVE for this operation" }
  - { id: ERR_HOSPITAL_NOT_OPEN, http: 409, condition: "Hospital must be OPEN for this operation" }
  - { id: ERR_HOSPITAL_HAS_OPEN_APPLICATIONS, http: 409, condition: "Hospital close blocked by non-terminal applications" }
  - { id: ERR_HOSPITAL_CAPACITY_REACHED, http: 409, condition: "Hospital admissions_ytd == annual_capacity; no more acceptances this calendar year" }
  - { id: ERR_AGE_WINDOW_VIOLATION, http: 422, condition: "Patient age at scheduled_date outside [min_age_months, max_age_months) of the stage" }
  - { id: ERR_STAGE_IN_PAST, http: 422, condition: "scheduled_date is before the logical clock's current date" }
  - { id: ERR_STAGE_ALREADY_IN_FLIGHT, http: 409, condition: "Another stage of the same care plan is already SCHEDULED" }
  - { id: ERR_STAGE_NOT_DUE, http: 409, condition: "Complete attempted before scheduled_date (logical clock)" }
  - { id: ERR_STAGES_IN_FLIGHT, http: 409, condition: "Discharge blocked by a SCHEDULED stage" }
  - { id: ERR_PLAN_FUNDING_UNRESOLVED, http: 409, condition: "Discharge blocked while funding_status == PARTIALLY_FUNDED" }
  - { id: ERR_PLAN_HAS_STAGE_IN_FLIGHT, http: 409, condition: "Allocation release blocked: designated care plan is ACTIVE_TREATMENT with a SCHEDULED stage" }
  - { id: ERR_SCREENING_DATE_OUTSIDE_CLINIC, http: 409, condition: "screening_date outside the clinic's closed [start_date, end_date] interval" }
  - { id: ERR_CLINIC_LOCATION_CONFLICT, http: 409, condition: "Another clinic within 25.0 miles has a padded-interval (end + 7 days) overlap with this clinic" }
  - { id: ERR_CLINIC_CAPACITY_REACHED, http: 409, condition: "booked_screening_count == screening_capacity" }
  - { id: ERR_CLINIC_NOT_IN_PROGRESS, http: 409, condition: "record-outcome requires clinic IN_PROGRESS" }
  - { id: ERR_CLINIC_STILL_RUNNING, http: 409, condition: "complete requires logical clock past end_date" }
  - { id: ERR_CONVERSION_WINDOW_CLOSED, http: 409, condition: "Screening conversion attempted after conversion_deadline" }
  - { id: ERR_SCREENING_MISMATCH, http: 422, condition: "screening_id references a screening of another hospital, wrong condition category, or not COMPLETED" }
  - { id: ERR_FUND_NOT_OPEN, http: 409, condition: "Fund must be OPEN to commit allocations" }
  - { id: ERR_INSUFFICIENT_FUND_BALANCE, http: 402, condition: "fund.available_cents < allocation.amount_cents at commit" }
  - { id: ERR_PLEDGED_ALLOCATIONS_EXIST, http: 409, condition: "Fund close blocked by PLEDGED allocations" }
  - { id: ERR_NO_BILLABLE_COVERAGE, http: 409, condition: "Claim submission/adjudication requires a VERIFIED insurance policy with coverage_exists on the account" }
  - { id: ERR_OPEN_CLAIMS_EXIST, http: 409, condition: "Settle blocked by SUBMITTED claims (open_claim_cents > 0)" }
  - { id: ERR_NO_FAMILY_BILLING_VIOLATION, http: 422, condition: "Reserved guard: any operation that would leave family_balance_cents != 0 is rejected and swept to charity write-off instead" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Network-level administrator: hospitals, programs, referral sources, clock"
    identity: opaque
    exclusive_operations:
      - "POST /charity-care/hospitals and hospital lifecycle actions (suspend/reopen/close)"
      - "POST /charity-care/hospitals/{id}/programs and program lifecycle actions"
      - "POST /charity-care/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /charity-care/referral-sources"

  - name: IntakeCoordinator
    description: "Hospital intake staff: submits applications, resubmits info, withdraws, attaches insurance"
    identity: opaque
    exclusive_operations:
      - "POST /charity-care/applications/{id}/resubmit-info"
      - "POST /charity-care/applications/{id}/withdraw"
    shared_operations:
      - "POST /charity-care/applications (with ReferringPhysician)"
      - "POST /charity-care/applications/{id}/insurance-policies (with BillingSpecialist)"
      - "GET endpoints per §1.5"

  - name: ReferringPhysician
    description: "External community physician / partner user who submits applications against their own referral source identity"
    identity: "entity_backed:ReferralSource"
    exclusive_operations: []
    shared_operations:
      - "POST /charity-care/applications (referral_source_id must equal the caller's X-User-ID)"
      - "GET /charity-care/hospitals, /programs, /referral-sources per §1.5"

  - name: ReviewCommitteeMember
    description: "Committee member: opens rounds, requests info, votes, decides. Segregation of duties: the member who requested info on the current round cannot decide it."
    identity: opaque
    exclusive_operations:
      - "POST /charity-care/applications/{id}/open-review"
      - "POST /charity-care/applications/{id}/request-info"
      - "POST /charity-care/applications/{id}/vote"
      - "POST /charity-care/applications/{id}/decide"
    shared_operations:
      - "GET endpoints per §1.5"

  - name: BillingSpecialist
    description: "Billing staff: claims, adjudication, denial, settlement. May never create a family-facing balance."
    identity: opaque
    exclusive_operations:
      - "POST /charity-care/billing-accounts/{id}/claims"
      - "POST /charity-care/claims/{id}/adjudicate"
      - "POST /charity-care/claims/{id}/deny"
      - "POST /charity-care/billing-accounts/{id}/settle"
    shared_operations:
      - "POST /charity-care/applications/{id}/insurance-policies (with IntakeCoordinator)"
      - "GET endpoints per §1.5"

  - name: CareCoordinator
    description: "Care continuity staff: staged procedures, discharge, travel support grants"
    identity: opaque
    exclusive_operations:
      - "POST /charity-care/care-plans/{id}/staged-procedures and all stage actions"
      - "POST /charity-care/care-plans/{id}/discharge"
      - "POST /charity-care/applications/{id}/travel-support-grants"
    shared_operations:
      - "GET endpoints per §1.5"

  - name: OutreachPlanner
    description: "Outreach staff: clinic proposal/confirm/complete/cancel, screening booking/outcome/no-show/rebook"
    identity: opaque
    exclusive_operations:
      - "POST /charity-care/hospitals/{id}/outreach-clinics and clinic actions"
      - "POST /charity-care/outreach-clinics/{id}/screenings and screening actions"
    shared_operations:
      - "GET endpoints per §1.5"

  - name: PhilanthropyOfficer
    description: "Philanthropy staff: funds, allocations, commit/withdraw/release"
    identity: opaque
    exclusive_operations:
      - "POST /charity-care/philanthropic-funds and fund lifecycle actions"
      - "POST /charity-care/philanthropic-funds/{id}/allocations and allocation actions"
    shared_operations:
      - "GET endpoints per §1.5"
