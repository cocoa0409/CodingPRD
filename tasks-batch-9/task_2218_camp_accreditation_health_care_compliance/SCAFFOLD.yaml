    side_effects: []

  - method: GET
    path: "/accreditation/visits"
    description: "list visits; cycle_id and lead_visitor_id are the reverse-reachability channels from AccreditationCycle and Visitor"
    roles: [CampDirector, AccreditationOfficer, Visitor]
    code: 200
    input: ["cycle_id?", "lead_visitor_id?", "status?", "limit?", "offset?"]
    output: AccreditationVisit[]
