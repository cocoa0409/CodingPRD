          trigger:
            - call: "POST /review-cases/${rc_id}/appeal"
              payload: { appeal_grounds: "the committee applied the hazard-recognition criterion to a hazard that was not visible", appeal_grounds_code: "CRITERIA_MISAPPLICATION" }
              as: SafetyManager
