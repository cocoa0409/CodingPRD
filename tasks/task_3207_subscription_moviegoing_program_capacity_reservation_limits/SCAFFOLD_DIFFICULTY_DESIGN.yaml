  # =====================================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bucket_credit_conservation_on_cancel_refund
        grounds:
          - calculations.cancellation_credit_refund
          - entities.ReservationCreditBucket.fields.credits_available
        distinguishing_aspect: |
          Conserved quantity: weekly credit supply. Invariant:
          credits_used_after_cancel = credits_used_at_creation - 1 for a
          within-window cancel on an OPEN bucket — debit-then-refund leaves
          base_granted + rollover_in - credits_used unchanged versus before the
          reservation was ever made.
        test_recipe:
          setup:
            - "Clock 2026-09-01; plan ALIST_BASIC PUBLISHED; member m18 ACTIVE with subscription s18"
            - "Showtime st18 ON_SALE at 2026-09-06T19:00:00Z; week-0 bucket pristine (credits_used == 0)"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_BASIC", tier: "BASIC", monthly_fee_cents: 1999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: false, max_future_reservations: 5, loyalty_points_multiplier_pct: 100, concession_discount_pct: 0 }
              as: ProgramAdmin
              captures: { plan18: $.data.id }
            - call: "POST /cinemas/subscription-plans/${plan18}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "T18", timezone: "America/Chicago" }
              as: ProgramAdmin
              captures: { th18: $.data.id }
            - call: "POST /cinemas/theaters/${th18}/auditoriums"
              payload: { label: "Aud 1", seat_count: 10, supported_formats: ["STANDARD"] }
              as: ProgramAdmin
              captures: { aud18: $.data.id }
            - call: "POST /cinemas/showtimes"
              payload: { auditorium_id: "${aud18}", film_title: "F18", studio_code: "WB", format: "STANDARD", starts_at: "2026-09-06T19:00:00Z", runtime_minutes: 120, base_price_cents: 1200, premium_surcharge_cents: 0, opening_weekend: false }
              as: ProgramAdmin
              captures: { st18: $.data.id, st18_v: $.data.version }
            - call: "POST /cinemas/showtimes/${st18}/open_sales"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "m18@x.com", full_name: "M Eighteen" }
              as: MemberServices
              captures: { m18: $.data.id }
            - call: "POST /cinemas/members/${m18}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${m18}/subscriptions"
              payload: { plan_id: "${plan18}" }
              as: MemberServices
              captures: { s18: $.data.id }
          trigger:
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s18}", showtime_id: "${st18}", expected_showtime_version: "${st18_v}" }
              as: Member
              as_user_id: "${m18}"
              captures: { r18: $.data.id, b18: $.data.bucket_id }
            - call: "GET /cinemas/credit-buckets/${b18}"
              payload: {}
              as: ProgramAdmin
              captures: { used_mid: $.data.credits_used }
            - call: "POST /cinemas/reservations/${r18}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m18}"
            - call: "GET /cinemas/credit-buckets/${b18}"
              payload: {}
              as: ProgramAdmin
              captures: { used_after: $.data.credits_used, avail_after: $.data.credits_available }
          assert:
            - "credits_used after create == 1 (debit)"
            - "credits_used after within-window cancel == 0 (compensating refund restores the supply)"
            - "credits_available == 3 — identical to the pre-reservation state; no drift"

      - name: auditorium_seat_conservation_on_showtime_cancel
        grounds:
          - state_machines.Showtime.ON_SALE_to_CANCELLED
          - entities.Showtime.fields.seats_held_subscription
        distinguishing_aspect: |
          Conserved quantity: physical seat occupation (a different quantity than
          credits). Invariant: seats_held_subscription + seats_held_paid +
          seats_available == auditorium.seat_count before AND after a force-
          majeure showtime cancel — cancelling with N subscriber holds returns
          all N seats, leaving seats_held_* == 0 and seats_available == seat_count.
