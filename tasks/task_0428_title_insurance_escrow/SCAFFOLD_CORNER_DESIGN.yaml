  - section: endpoints
    instances:
      - name: fk_reverse_list_exceptions_for_commitment
        claim_type: fk_reverse_reachability
        grounds: [entities.Exception.fields.commitment_id, endpoints]
        distinguishing_aspect: "GET /title/commitments/{id}/exceptions returns the Exception[] children of that commitment (cascade-created/raised children are discoverable here)."
        test_recipe:
          setup: ["A commitment with two RAISED exceptions."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C31", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/exceptions"
              payload: { exception_type: "STANDARD", description: "Survey" }
              as: TitleOfficer
            - call: "POST /title/commitments/${c_id}/exceptions"
              payload: { exception_type: "SPECIAL", description: "Easement" }
              as: TitleOfficer
          trigger:
            - call: "GET /title/commitments/${c_id}/exceptions"
              as: TitleOfficer
          assert:
            - "the response array has total_count 2; both exceptions have commitment_id == ${c_id}"

      - name: fk_reverse_filter_policies_by_commitment
        claim_type: fk_reverse_reachability
        grounds: [entities.Policy.fields.commitment_id, endpoints]
        distinguishing_aspect: "GET /title/policies?commitment_id={id} returns the Policy[] realizing that commitment (reverse-reachability for Policy.commitment_id)."
        test_recipe:
          setup: ["An order with an ISSUED commitment and one PENDING policy bound to it."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
