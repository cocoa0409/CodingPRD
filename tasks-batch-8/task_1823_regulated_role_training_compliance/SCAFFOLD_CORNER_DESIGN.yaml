            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://ev-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-EV", name: "EV Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-EV-1", full_name: "EV Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
          trigger:
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 90, evidence_type: "CERTIFICATE", evidence_uri: "uri://cert" }, as: Employee, as_user_id: "${emp}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 90, evidence_type: "PROCTORED_CERTIFICATE" }, as: Employee, as_user_id: "${emp}", captures: { err2: "$.data.error_id" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 90, evidence_type: "PROCTORED_CERTIFICATE", evidence_uri: "uri://proc/123" }, as: Employee, as_user_id: "${emp}", captures: { ok_st: "$.data.review_status", ok_passed: "$.data.passed" } }
          assert:
            - "err1 == \"ERR_EVIDENCE_TYPE_INSUFFICIENT\" (CERTIFICATE below required PROCTORED_CERTIFICATE)"
            - "err2 == \"ERR_EVIDENCE_URI_MISSING\" (tier sufficient but uri absent)"
            - "ok_st == \"PENDING_REVIEW\" and ok_passed == true"

      - name: duplicate_active_requirement_rejected_then_allowed_after_retire
        claim_type: violation_to_error
        grounds:
