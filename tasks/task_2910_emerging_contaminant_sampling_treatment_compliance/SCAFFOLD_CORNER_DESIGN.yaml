              as: UtilityAdmin
              captures: { ep6_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-07", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep7_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep6_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-C1" }
              as: SamplingTechnician
              captures: { s6_id: "$.data.id" }
            - call: "POST /samples/${s6_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s6_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s6_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 2.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r6_id: "$.data.id" }
            - call: "POST /lab-results/${r6_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /samples"
              payload: { entry_point_id: "${ep7_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-C2" }
              as: SamplingTechnician
              captures: { s7_id: "$.data.id" }
            - call: "POST /samples/${s7_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s7_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s7_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 1.99, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-21T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r7_id: "$.data.id" }
            - call: "POST /lab-results/${r7_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /entry-points/${ep6_id}"
