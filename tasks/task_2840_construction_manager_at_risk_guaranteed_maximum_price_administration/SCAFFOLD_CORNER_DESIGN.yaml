        grounds:
          - errors.ERR_BOND_CLAIM_STATE_INVALID
          - validations.priority_67
          - state_machines.Subcontract.bond_claim_status
        distinguishing_aspect: |
          The surety axis is initialised from bond_required, so a subcontract written with
          bond_required false starts at NOT_APPLICABLE and rejects every bond-claim action for
          life - there is no path that ever opens it. On a bonded subcontract the same code also
          guards ordering: SETTLE straight from NONE is refused because SETTLE is reachable only
          from ACKNOWLEDGED.
