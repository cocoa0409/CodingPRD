              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-15", lines: [ { product_id: "${pl_id}", ordered_qty: 7 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { total: $.data.total_price_cents }
          assert:
            - "total_price_cents == 960 (ceil(7/12)=1 case x 12 x 80) — LUM relief denied without the agreement commitment"
      - name: order_price_rounding_scope
        claim_type: precision
        grounds: [calculations.order_price]
        excluded_because:
          difficulty_instance: order_price_per_line_case_ceiling
          rationale: "Per-line vs order-level rounding divergence is asserted by the named §1.8 instance (9560 vs 8060)."
      - name: rebate_formula_composition
        claim_type: correct_result
        grounds: [calculations.rebate_amount]
        excluded_because:
          difficulty_instance: rebate_validated_formula_tier_bonus_multiplier
