              as: ComplianceAnalyst
            - call: "POST /gpo/compliance-measurements/${meas2}/finalize"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /gpo/price-activations/${a1}/approve"
              payload: {}
              as: ContractManager
              as_user_id: "CM-2"
            - call: "POST /gpo/price-activations/${a1}/activate"
              payload: {}
              as: ContractManager
              as_user_id: "CM-1"
          assert:
            - "${a1_price} == 9000 — the exception was priced at creation under TIER_0 (tier price 10000), so nothing about the activation itself is invalid"
            - "the first endorse returns error_id ERR_REQUALIFICATION_IN_PROGRESS with HTTP 409 and PriceActivation.${a1}.status is still DRAFT and endorsed_by_user_id is still null"
            - "${a1_status_after_endorse} == ENDORSED once the commitment is back to ACTIVE — only the OTHER entity changed"
            - "the approve attempted during the second requalification window returns error_id ERR_REQUALIFICATION_IN_PROGRESS with HTTP 409 and PriceActivation.${a1}.status is still ENDORSED and approved_by_user_id is still null"
            - "Commitment.${k1}.requalification_round == 2 and election_status == ACTIVE at the end"
            - "PriceActivation.${a1}.status == ACTIVE with endorsed_by_user_id CM-1, approved_by_user_id CM-2 and computed_price_cents 9000"
            - "ContractItem.${i1}.active_activation_count == 1"

      - name: distributor_file_intake_depends_on_member_not_suspended
        grounds:
          - state_machines.DistributorFile.null_to_RECEIVED
          - state_machines.Commitment.election_status.null_to_ELECTED
          - entities.Member.fields.status
          - errors.ERR_MEMBER_NOT_ACTIVE
        distinguishing_aspect: |
          A third entity pair (DistributorFile, Member) with a third error: intake of a new
          file is refused while Member.status is SUSPENDED, and so is a new commitment
          election for that member — but a file that was already RECEIVED and VALIDATING
