    side_effects: ["program_accreditation_status recompute; increments AccreditationCitation.version by 1"]

  - method: POST
    path: "/residency-programs/accreditation-citations/{id}/submit-response"
    description: "RESPONSE_DRAFTED -> RESPONSE_SUBMITTED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: AccreditationCitation
    side_effects: ["increments AccreditationCitation.version by 1"]

  - method: POST
    path: "/residency-programs/accreditation-citations/{id}/resolve"
    description: "RESPONSE_SUBMITTED -> RESOLVED"
    roles: [DesignatedInstitutionalOfficial]
    code: 200
    input: [resolution_note]
    output: AccreditationCitation
    side_effects: ["program_accreditation_status recompute; increments AccreditationCitation.version by 1"]

  - method: POST
    path: "/residency-programs/accreditation-citations/{id}/escalate"
    description: "RESPONSE_SUBMITTED -> ESCALATED"
    roles: [DesignatedInstitutionalOfficial]
    code: 200
    input: [escalation_reason]
    output: AccreditationCitation
    side_effects: ["program_accreditation_status recompute; increments AccreditationCitation.version by 1"]

  # --- AnnualSurvey ---
  - method: POST
    path: "/residency-programs/annual-surveys"
    description: "Create the annual ACGME survey record (OPEN); one per (program, year)"
    roles: [ProgramCoordinator]
    code: 201
    input: [program_id, academic_year_id]
    output: AnnualSurvey
    side_effects: []

  - method: GET
    path: "/residency-programs/annual-surveys"
    description: "List annual surveys"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: ["program_id?", "academic_year_id?", "status?", "limit?", "offset?"]
    output: "AnnualSurvey[]"
    side_effects: []

  - method: GET
    path: "/residency-programs/annual-surveys/{id}"
    description: "Get one annual survey"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: []
    output: AnnualSurvey
    side_effects: []

  - method: POST
    path: "/residency-programs/annual-surveys/{id}/close"
    description: "Close a survey with response rates and area results; auto-creates citations (response-rate < 70.00, flagged areas); recomputes program accreditation_status"
    roles: [DesignatedInstitutionalOfficial]
    code: 200
    input: [resident_response_rate, faculty_response_rate, area_results]
    output: AnnualSurvey
    side_effects: ["flagged_area_count computed; citations auto-created; program_accreditation_status recompute; increments AnnualSurvey.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / ownership / segregation of duties ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Resident-role call targets a row whose resident FK differs from X-User-ID" }
  - { id: ERR_COMMITTEE_ROLE_CONFLICT, http: 403, condition: "CCC finalize chair's X-User-ID is among the period's evaluator_ids" }
  - { id: ERR_DISMISSAL_CONFIRMATION_CONFLICT, http: 403, condition: "confirm-dismissal X-User-ID equals the ProbationCase recommended_by" }

  # --- generic ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id (path or body) does not exist; validated left-to-right" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, wrong type, enum outside declared set" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

  # --- academic year / blocks ---
  - { id: ERR_INVALID_YEAR_SPAN, http: 422, condition: "Academic year span (end_date - start_date) != 364 days" }
  - { id: ERR_ACADEMIC_YEAR_NOT_PLANNING, http: 409, condition: "Year activate or block regeneration requires status PLANNING" }
  - { id: ERR_ACADEMIC_YEAR_NOT_ACTIVE, http: 409, condition: "Operation requires the block's year in status ACTIVE (e.g., assignment create) or year close from ACTIVE" }
  - { id: ERR_UNATTESTED_LOGS_EXIST, http: 409, condition: "Year close blocked: SUBMITTED duty-hour logs exist for program residents" }

  # --- complement / funding ---
  - { id: ERR_NO_APPROVED_COMPLEMENT, http: 409, condition: "Resident create: no APPROVED or LOCKED ComplementApproval for (program, entry year, pgy_level)" }
  - { id: ERR_COMPLEMENT_EXCEEDED, http: 409, condition: "Resident activate: filled_headcount + 1 > approved_positions" }
  - { id: ERR_FUNDING_CAP_EXCEEDED, http: 402, condition: "Resident activate: round_half_up((filled_funded_census + 1.0) * resident_year_stipend_cents) > annual_funding_budget_cents" }
  - { id: ERR_COMPLEMENT_NOT_EDITABLE, http: 409, condition: "PUT on a ComplementApproval not in DRAFT or REJECTED" }
  - { id: ERR_COMPLEMENT_NOT_SUBMITTABLE, http: 409, condition: "submit requires status DRAFT or REJECTED" }
  - { id: ERR_COMPLEMENT_NOT_SUBMITTED, http: 409, condition: "approve/reject requires status SUBMITTED" }
  - { id: ERR_COMPLEMENT_NOT_APPROVED, http: 409, condition: "lock requires status APPROVED" }
  - { id: ERR_COMPLEMENT_ALREADY_APPROVED, http: 409, condition: "approve: another row for the same (program, year, pgy_level) is APPROVED or LOCKED" }
  - { id: ERR_PROGRAM_PROBATIONARY, http: 403, condition: "complement approve barred while program.accreditation_status == PROBATIONARY" }

  # --- resident lifecycle / standing ---
  - { id: ERR_RESIDENT_NOT_INCOMING, http: 409, condition: "activate requires lifecycle_status INCOMING" }
  - { id: ERR_RESIDENT_NOT_ACTIVE, http: 409, condition: "operation requires lifecycle_status ACTIVE" }
  - { id: ERR_RESIDENT_NOT_ON_LEAVE, http: 409, condition: "return-from-leave requires lifecycle_status ON_LEAVE" }
  - { id: ERR_STANDING_NOT_CLEAR, http: 409, condition: "graduate requires standing_status GOOD_STANDING" }
  - { id: ERR_CASE_REQUIREMENTS_UNMET, http: 409, condition: "graduate: at least one CaseRequirement has requirement_met false" }
  - { id: ERR_NO_FINALIZED_CCC_REVIEW, http: 409, condition: "graduate: no FINALIZED CCCReview exists for the resident" }

  # --- rotation / assignment ---
  - { id: ERR_ROTATION_NOT_ACTIVE, http: 409, condition: "Rotation is RETIRED (retire requires ACTIVE; assignment requires ACTIVE rotation)" }
  - { id: ERR_ROTATION_HAS_OPEN_ASSIGNMENTS, http: 409, condition: "retire blocked: PLANNED or CONFIRMED assignments reference the rotation" }
  - { id: ERR_PGY_INELIGIBLE, http: 422, condition: "resident.pgy_level < rotation.min_pgy_level" }
  - { id: ERR_PROBATION_NIGHT_FLOAT_BLOCKED, http: 403, condition: "ON_PROBATION resident cannot be assigned to an is_night_float rotation" }
  - { id: ERR_BLOCK_ASSIGNMENT_CONFLICT, http: 409, condition: "resident already has a non-CANCELLED assignment in the same schedule block (unit-slot semantics)" }
  - { id: ERR_ROTATION_CAPACITY_FULL, http: 409, condition: "non-CANCELLED assignments for (rotation, block) == rotation.max_residents_per_block" }
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http: 400, condition: "Referenced entities belong to different programs (resident vs block's year vs rotation, or evaluation/CCC/survey year mismatch)" }
  - { id: ERR_ASSIGNMENT_NOT_PLANNED, http: 409, condition: "confirm requires status PLANNED" }
  - { id: ERR_ASSIGNMENT_NOT_CONFIRMED, http: 409, condition: "complete requires status CONFIRMED" }
  - { id: ERR_ASSIGNMENT_NOT_CANCELLABLE, http: 409, condition: "cancel requires status PLANNED or CONFIRMED" }

  # --- duty hours ---
  - { id: ERR_DATE_OUT_OF_ACTIVE_YEAR, http: 422, condition: "started_at / performed_date not inside any ACTIVE AcademicYear of the program" }
  - { id: ERR_SHIFT_LENGTH_VIOLATION, http: 422, condition: "duty log duration > 28.00 hours" }
  - { id: ERR_LOG_TIME_OVERLAP, http: 409, condition: "duty log overlaps another non-VOID log of the same resident" }
  - { id: ERR_LOG_NOT_SUBMITTED, http: 409, condition: "attest requires status SUBMITTED" }
  - { id: ERR_LOG_NOT_VOIDABLE, http: 409, condition: "void requires status SUBMITTED or ATTESTED" }
  - { id: ERR_VIOLATION_NOT_OPEN, http: 409, condition: "acknowledge requires FLAGGED; resolve/dismiss require FLAGGED or ACKNOWLEDGED" }
  - { id: ERR_JUSTIFICATION_REQUIRED, http: 400, condition: "dismiss justification must be >= 10 characters" }

  # --- moonlighting ---
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "start_date must be strictly before end_date" }
  - { id: ERR_MOONLIGHTING_OVERLAP, http: 409, condition: "half-open [start_date, end_date) overlaps another SUBMITTED/APPROVED/ACTIVE request of the resident" }
  - { id: ERR_STANDING_BLOCKS_MOONLIGHTING, http: 403, condition: "moonlighting create/approve requires resident standing GOOD_STANDING" }
  - { id: ERR_PROJECTED_HOURS_EXCEED_80, http: 422, condition: "moonlighting approve: rolling projected average + candidate hours_per_week > 80.00" }
  - { id: ERR_MOONLIGHTING_NOT_SUBMITTABLE, http: 409, condition: "submit requires status DRAFT" }
  - { id: ERR_MOONLIGHTING_NOT_APPROVABLE, http: 409, condition: "approve requires status SUBMITTED" }
  - { id: ERR_MOONLIGHTING_NOT_DENIABLE, http: 409, condition: "deny requires status SUBMITTED" }
  - { id: ERR_MOONLIGHTING_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires status DRAFT or SUBMITTED" }
  - { id: ERR_MOONLIGHTING_NOT_REVOKABLE, http: 409, condition: "revoke requires status APPROVED or ACTIVE" }

  # --- evaluations / CCC ---
  - { id: ERR_INCOMPLETE_RATINGS, http: 422, condition: "competency_ratings / milestone_levels must cover exactly the 6 competencies with levels 1..5" }
  - { id: ERR_CCC_REVIEW_EXISTS, http: 409, condition: "a non-FINALIZED CCCReview already exists for (resident, year, period)" }
  - { id: ERR_CCC_NOT_OPEN, http: 409, condition: "begin-deliberation requires status OPEN" }
  - { id: ERR_CCC_NOT_IN_DELIBERATION, http: 409, condition: "finalize/reopen requires status IN_DELIBERATION" }
  - { id: ERR_INSUFFICIENT_EVALUATIONS, http: 409, condition: "finalize requires >= 3 MilestoneEvaluations for (resident, year, period)" }
  - { id: ERR_INVALID_OUTCOME, http: 422, condition: "outcome outside the declared enum for the action" }

  # --- case logs / requirements ---
  - { id: ERR_REQUIREMENT_EXISTS, http: 409, condition: "CaseRequirement already exists for (program, procedure_category)" }
  - { id: ERR_CASE_LOG_NOT_LOGGED, http: 409, condition: "verify/reject require status LOGGED; resubmit requires status REJECTED" }
  - { id: ERR_CASE_LOG_NOT_VERIFIED, http: 409, condition: "void requires status VERIFIED" }

  # --- remediation / probation ---
  - { id: ERR_REMEDIATION_NOT_ACTIVE, http: 409, condition: "complete/cancel require status ACTIVE" }
  - { id: ERR_OPEN_PROBATION_EXISTS, http: 409, condition: "probation create: a case in ACTIVE or DISMISSAL_RECOMMENDED already exists for the resident" }
  - { id: ERR_PROBATION_NOT_ACTIVE, http: 409, condition: "lift/recommend-dismissal require status ACTIVE" }
  - { id: ERR_PROBATION_NOT_RECOMMENDED, http: 409, condition: "confirm-dismissal requires status DISMISSAL_RECOMMENDED" }

  # --- citations / survey ---
  - { id: ERR_CITATION_NOT_DRAFTABLE, http: 409, condition: "draft-response requires status OPEN or ESCALATED" }
  - { id: ERR_CITATION_RESPONSE_NOT_DRAFTED, http: 409, condition: "submit-response requires status RESPONSE_DRAFTED" }
  - { id: ERR_CITATION_NOT_RESOLVABLE, http: 409, condition: "resolve requires status RESPONSE_SUBMITTED" }
  - { id: ERR_CITATION_NOT_ESCALATABLE, http: 409, condition: "escalate requires status RESPONSE_SUBMITTED" }
  - { id: ERR_SURVEY_NOT_OPEN, http: 409, condition: "close requires status OPEN" }
  - { id: ERR_INVALID_SURVEY_RATE, http: 422, condition: "response rates / compliance_pct outside 0.00..100.00" }
  - { id: ERR_SURVEY_EXISTS, http: 409, condition: "an AnnualSurvey already exists for (program, academic_year)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DesignatedInstitutionalOfficial
    description: "DIO: institutional GME authority; program creation, complement approval/rejection/lock, citation resolution/escalation, survey close, final dismissal confirmation"
    identity: opaque
    exclusive_operations:
      - "POST /residency-programs"
      - "POST /residency-programs/complement-approvals/{id}/approve|reject|lock"
      - "POST /residency-programs/accreditation-citations (+ resolve/escalate)"
      - "POST /residency-programs/annual-surveys/{id}/close"
      - "POST /residency-programs/probation-cases/{id}/confirm-dismissal"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: ProgramDirector
    description: "PD: complement drafting, resident status actions, moonlighting decisions, remediation/probation management, citation responses, case requirements, violation resolution"
    identity: opaque
    exclusive_operations:
      - "POST /residency-programs/complement-approvals (+ PUT, submit)"
      - "POST /residency-programs/residents/{id}/place-on-leave|return-from-leave|graduate|transfer"
      - "POST /residency-programs/moonlighting-requests/{id}/approve|deny|revoke"
      - "POST /residency-programs/remediation-plans (+ complete/cancel)"
      - "POST /residency-programs/probation-cases (+ lift/recommend-dismissal)"
      - "POST /residency-programs/accreditation-citations/{id}/draft-response|submit-response"
      - "POST /residency-programs/case-requirements"
      - "POST /residency-programs/duty-hour-violations/{id}/resolve|dismiss"
      - "POST /residency-programs/procedure-case-logs/{id}/void"
    shared_operations:
      - "all GET endpoints"
      - "POST /residency-programs/milestone-evaluations (ratings weigh 2.0)"
      - "POST /residency-programs/duty-hour-logs/{id}/void"
      - "POST /_clock/set_current_utc"

  - name: ProgramCoordinator
    description: "Coordinator: academic years, block diagrams, rotation catalog, assignments, resident enrollment/activation, surveys, violation acknowledgement"
    identity: opaque
    exclusive_operations:
      - "POST /residency-programs/academic-years (+ activate/close/regenerate-blocks)"
      - "POST /residency-programs/rotations (+ PUT, retire)"
      - "POST /residency-programs/rotation-assignments (+ confirm/complete/cancel)"
      - "POST /residency-programs/residents (+ activate)"
      - "POST /residency-programs/annual-surveys"
      - "POST /residency-programs/duty-hour-violations/{id}/acknowledge"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: Resident
    description: "Resident (entity-backed): own duty-hour logs, own procedure case logs, own moonlighting requests"
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /residency-programs/duty-hour-logs (+ attest, void)"
      - "POST /residency-programs/procedure-case-logs (+ resubmit)"
      - "POST /residency-programs/moonlighting-requests (+ submit, withdraw)"
    shared_operations:
      - "all GET endpoints"

  - name: FacultyEvaluator
    description: "Faculty: submits milestone evaluations (weight 1.0), verifies/rejects procedure case logs"
    identity: opaque
    exclusive_operations:
      - "POST /residency-programs/procedure-case-logs/{id}/verify|reject"
    shared_operations:
      - "all GET endpoints"
      - "POST /residency-programs/milestone-evaluations"

  - name: CCCChair
    description: "Clinical Competency Committee chair: opens, deliberates, finalizes, and reopens CCC reviews; barred from finalizing a review of a period they evaluated (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /residency-programs/ccc-reviews (+ begin-deliberation, finalize, reopen)"
    shared_operations:
      - "all GET endpoints"
