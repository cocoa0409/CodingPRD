  - rule_id: cross_entity_state_dependency
    instances:

      - name: reservation_requires_open_program_not_merely_approved_project
        grounds:
          - state_machines.RebateProject.APPROVED_to_RESERVED
          - state_machines.Program.OPEN_to_SUSPENDED
          - state_machines.Program.SUSPENDED_to_OPEN
          - errors.ERR_PROGRAM_NOT_OPEN
          - validations.priority_8
        distinguishing_aspect: |
          Entity pair (RebateProject, Program): the dependent entity is fully
          ready — APPROVED, funded, income-verified — and the blocker is the
          state of its GRANDPARENT program, which no field on the project
          records. Suspending the program does not touch the project row at
          all, so the only way to fail this is to read program.status at
          reservation time.
