      - name: charter_adoption_enforces_quorum_before_function_coverage
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DisclosureCommitteeCharter.DRAFT_to_ADOPTED
          - validations[priority=21]
          - validations[priority=22]
          - errors[ERR_QUORUM_NOT_MET]
          - errors[ERR_FUNCTION_COVERAGE_GAP]
          - entities.DisclosureCommitteeCharter.fields.active_voting_member_count
          - entities.DisclosureCommitteeCharter.fields.covered_functions
        distinguishing_aspect: |
          Each ADOPT precondition fails with its own code and neither one masks the other: charter P
          (min_quorum_count 3) with two voting seats returns ERR_QUORUM_NOT_MET, while charter Q
          (min_quorum_count 2, required_functions [FINANCE, LEGAL, OPERATIONS]) satisfies quorum with
          two voting FINANCE seats and therefore fails one rule later with
          ERR_FUNCTION_COVERAGE_GAP. Both charters stay DRAFT with adopted_at_utc null.
        test_recipe:
          setup:
            - "Charter P: min_quorum_count 3, required_functions [FINANCE], two ACTIVE voting FINANCE seats."
            - "Charter Q: min_quorum_count 2, required_functions [FINANCE, LEGAL, OPERATIONS], two ACTIVE voting FINANCE seats and no LEGAL or OPERATIONS seat."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Charter P", version_label: "P-1", min_quorum_count: 3, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_p_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_p_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { p_fin1_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_p_id}/members"
              payload: { full_name: "Owen Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { p_fin2_id: $.data.id }
            - call: "POST /disclosure/charters"
              payload: { name: "Charter Q", version_label: "Q-1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL", "OPERATIONS"] }
              as: ComplianceAdmin
              captures: { charter_q_id: $.data.id }
