            - "All five duplicate rejections carry http 409 and created nothing: GET /allocation/stores?program_id=${prog_id} still has total_count == 1 and GET /allocation/promo-events?program_id=${prog_id} still has total_count == 1"
      - name: size_array_rejections_keep_four_codes_apart_and_in_priority_order
        claim_type: error_triggerable
        grounds:
          - validations[priority:16]
          - validations[priority:17]
          - validations[priority:18]
          - validations[priority:19]
          - errors.ERR_SIZE_CURVE_INVALID
          - errors.ERR_SIZE_UNITS_MISMATCH
          - errors.ERR_SIZE_CODE_UNKNOWN
          - errors.ERR_ITEM_CLASS_MISMATCH
        distinguishing_aspect: |
          Four different codes guard the size arrays and they are easy to conflate, so each is triggered
          alone and then two of them are triggered together to pin the order. The curve code fires three
          ways - a repeated size_code, a curve one basis point short of 10000 and one basis point over -
          which forces the sum comparison to be exact equality rather than a tolerance. The reconciliation
          code and the unknown-code check are then triggered on BOTH endpoints that accept a size array
          (position create and receipt create) and on the adjust endpoint, and the deciding call carries both
          faults at once: 10 declared units against 5 + 4 in an array that also names an unknown size must
          answer ERR_SIZE_UNITS_MISMATCH, because rung 17 precedes rung 18.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with store 0101 and size profile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500 (APPAREL_TOP)"
            - "SKU-1001 (APPAREL_TOP, SEASONAL) is on TOP-4SZ, and the curve has no XXL and no XXS"
            - "No StorePosition and no Receipt exist yet, so every rejection below must leave the program empty of both"
            - "The logical clock is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
