            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${w2_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv2: $.data.id, inv2_status: $.data.status } }
          assert:
