      - "$.data.included_cohort_count == 0, $.data.excluded_cohort_count == 3 and $.data.worst_cohort_code == null"
      - "$.data.pooled_frr_bps == null, $.data.max_frr_bps == null and $.data.min_frr_bps == null"
      - each CohortMetric row has included_in_ratio == false
      - "MethodProfile.${p_doc_id}.bias_state == CLEARED with restricted_at == null and version == 1"
