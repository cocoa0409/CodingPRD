  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: quota_reserve_then_withdraw_conserves_region_slot_count
        grounds:
          - state_machines.LicenseApplication.DRAFT_to_SUBMITTED
          - state_machines.LicenseApplication.SUBMITTED_to_WITHDRAWN
          - calculations.quota_availability
          - entities.LicenseApplication.fields.quota_slot_held
        distinguishing_aspect: |
          Conserved quantity = region available quota slots. The forward action
          (submit reserves: available 2 -> 1) paired with its compensating action
          (withdraw from SUBMITTED releases: available 1 -> 2) leaves
          available == cap == floor(50000/25000) == 2 unchanged, with quota_slot_held
          flipping true then false (net zero held slots).
        test_recipe:
          setup:
            - "Region CTY_LA cap=2 for ON_47, no slots used. One application la_id SUBMITTED (holds 1 slot, available now 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { app_owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${app_owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${app_owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { la_id: $.data.id }
            - call: "POST /license-applications/${la_id}/submit"
              payload: { expected_region_version: "${reg_v}" }
              as: Applicant
              as_user_id: "${app_owner_id}"
          trigger:
            - call: "POST /license-applications/${la_id}/withdraw"
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { la_status: $.data.status }
            - call: "GET /quota-regions/${reg_id}/quota-status"
              payload: { license_class_code: "ON_47" }
              as: Director
              as_user_id: "dir-1"
              captures: { avail_after: $.data.available, used_after: $.data.used }
          assert:
            - "LicenseApplication.${la_id}.status == WITHDRAWN"
            - "LicenseApplication.${la_id}.quota_slot_held == false"
            - "quota-status.available == 2"
            - "quota-status.used == 0"

      - name: fine_charge_then_payment_conserves_outstanding_fine_ledger
        grounds:
          - state_machines.Violation.ALLEGED_to_SUSTAINED
          - calculations.fine_assessment
          - entities.License.fields.outstanding_fine_cents
          - entities.AdministrativeAction.fields.fine_paid_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = the fine ledger identity
          License.outstanding_fine_cents == sum(AdministrativeAction.fine_cents) -
          sum(fine_paid_cents). The forward charge (sustain SERIOUS at dp0 -> fine
          75000, outstanding 75000) paired with the compensating full payment
          (pay-fine 75000) restores outstanding_fine_cents to 0 with
          fine_paid_cents == fine_cents == 75000 (ledger nets to zero).
        test_recipe:
          setup:
            - "An ISSUED License lic_id with one SUSTAINED SERIOUS Violation -> AdministrativeAction act_id, fine_cents=75000, outstanding_fine_cents=75000."
          setup_api_calls:
