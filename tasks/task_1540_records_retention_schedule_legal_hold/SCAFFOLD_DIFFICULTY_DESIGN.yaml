              captures: { base_count: "$.data.active_hold_count", base_posture: "$.data.disposition_posture" }
          trigger:
            - call: "POST /ig/legal-holds/${h}/scope-items"
              payload: { record_ids: ["${r}"] }
              as: LegalCounsel
              captures: { item: "$.data[0].id" }
            - call: "GET /ig/records/${r}"
              payload: {}
              as: RecordsManager
              captures: { mid_count: "$.data.active_hold_count", mid_susp: "$.data.auto_delete_suspended", mid_posture: "$.data.disposition_posture" }
            - call: "GET /ig/hold-scope-items?record_id=${r}&status=ACTIVE"
              payload: {}
              as: RecordsManager
              captures: { mid_active_items: "$.data[0].id" }
            - call: "DELETE /ig/legal-holds/${h}/scope-items/${item}"
              payload: {}
              as: LegalCounsel
            - call: "GET /ig/records/${r}"
              payload: {}
              as: RecordsManager
              captures: { end_count: "$.data.active_hold_count", end_susp: "$.data.auto_delete_suspended", end_posture: "$.data.disposition_posture" }
            - call: "GET /ig/legal-holds/${h}"
              payload: {}
              as: LegalCounsel
              captures: { end_scope_ct: "$.data.active_scope_count" }
          assert:
            - "Baseline: base_count == 0 and base_posture == ELIGIBLE"
            - "After expansion: mid_count == 1, mid_susp == true, mid_posture == HELD, and exactly one ACTIVE scope item references ${r}"
            - "After exclusion (the compensating action): end_count == 0 == baseline, end_susp == false, end_posture == ELIGIBLE"
            - "LegalHold.${h}.active_scope_count == 1 (only R2 remains); invariant active_hold_count == |ACTIVE scope items| holds at every step"

      - name: hold_issue_release_conserves_custodian_obligations
        grounds:
          - calculations.obligation_reconciliation
          - state_machines.LegalHold.DRAFT_to_ISSUED
          - state_machines.LegalHold.ISSUED_to_RELEASED
          - entities.Custodian.fields.open_obligation_count
        distinguishing_aspect: |
          Conserved quantity = per-custodian open obligation count (different from
          record hold coverage): Custodian.open_obligation_count == |assignments in
          PENDING or ESCALATED| must return to baseline after an issue + full-ack +
          release pair — release of ACKNOWLEDGED assignments changes neither count.
        test_recipe:
          setup:
            - "Program (ack_deadline_days 14); class; jurisdiction; ACTIVE 120-month rule; record; custodians C1, C2 with open_obligation_count 0"
            - "Hold with custodian_ids [C1, C2] and scope [R] exists as DRAFT"
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "Obligation Program", fiscal_year_end_month: 12, fiscal_year_end_day: 31, ack_deadline_days: 14 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-120", retention_months: 120, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "Rec", source_system: "MAIL", event_date: "2026-01-15T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { r: "$.data.id" }
            - call: "POST /ig/custodians"
              payload: { program_id: "${p}", email: "c1@x.com", full_name: "Cust One", department: "Legal" }
              as: RecordsManager
              captures: { c1: "$.data.id" }
            - call: "POST /ig/custodians"
              payload: { program_id: "${p}", email: "c2@x.com", full_name: "Cust Two", department: "HR" }
              as: RecordsManager
              captures: { c2: "$.data.id" }
            - call: "POST /ig/legal-holds"
              payload: { program_id: "${p}", matter_ref: "M-OBL", title: "Hold", reason: "Investigation", custodian_ids: ["${c1}", "${c2}"], record_ids: ["${r}"] }
              as: LegalCounsel
              captures: { h: "$.data.id" }
          trigger:
            - call: "POST /ig/legal-holds/${h}/issue"
              payload: {}
              as: LegalCounsel
            - call: "GET /ig/custodians/${c1}"
              payload: {}
              as: RecordsManager
              captures: { c1_issued: "$.data.open_obligation_count" }
            - call: "GET /ig/custodians/${c2}"
              payload: {}
              as: RecordsManager
              captures: { c2_issued: "$.data.open_obligation_count" }
            - call: "GET /ig/hold-custodians?hold_id=${h}&custodian_id=${c1}"
              payload: {}
              as: RecordsManager
              captures: { a1: "$.data[0].id" }
            - call: "GET /ig/hold-custodians?hold_id=${h}&custodian_id=${c2}"
              payload: {}
              as: RecordsManager
              captures: { a2: "$.data[0].id" }
            - call: "POST /ig/hold-custodians/${a1}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1}"
            - call: "GET /ig/custodians/${c1}"
              payload: {}
              as: RecordsManager
              captures: { c1_acked: "$.data.open_obligation_count" }
            - call: "POST /ig/hold-custodians/${a2}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c2}"
            - call: "GET /ig/legal-holds/${h}"
              payload: {}
              as: LegalCounsel
              captures: { hv: "$.data.version" }
            - call: "POST /ig/legal-holds/${h}/release"
              payload: { release_reason: "litigation hold closed", expected_legal_hold_version: "${hv}" }
              as: LegalCounsel
            - call: "GET /ig/custodians/${c1}"
              payload: {}
              as: RecordsManager
              captures: { c1_end: "$.data.open_obligation_count" }
            - call: "GET /ig/custodians/${c2}"
              payload: {}
              as: RecordsManager
              captures: { c2_end: "$.data.open_obligation_count" }
            - call: "GET /ig/hold-custodians?custodian_id=${c2}&status=PENDING"
              payload: {}
              as: RecordsManager
          assert:
            - "After issue: c1_issued == 1 and c2_issued == 1 (baseline 0 + one PENDING assignment each)"
            - "After C1 acks (on time, was_late false): c1_acked == 0 — ACKNOWLEDGED is not an open obligation"
            - "After release: c1_end == 0 and c2_end == 0 — the issue+release pair conserves the per-custodian obligation totals"
            - "Zero PENDING assignments remain for C2 (obligations reconciled to the empty set)"
