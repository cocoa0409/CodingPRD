                billing_period_end: "2026-09-01T00:00:00Z"
                expected_matter_version: "${matter_v2}"
                line_items:
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L110", narrative: "clean L110", hours: 1.00, rate_cents: 90000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { inv_f: $.data.id }
