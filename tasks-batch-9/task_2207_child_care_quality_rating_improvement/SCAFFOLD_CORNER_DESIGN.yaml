            - { call: "POST /coaching-allocations/${alid}/accept", payload: {}, as: Provider, as_user_id: "${pid}" }
            - { call: "POST /coaching-allocations/${alid}/sessions", payload: { scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: Coach, as_user_id: "coach_1", captures: { sid1: $.data.id } }
          trigger:
            - { call: "POST /coaching-allocations/${alid}/sessions", payload: { scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T14:00:00Z" }, as: Coach, as_user_id: "coach_1" }
          assert:
