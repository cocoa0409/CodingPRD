  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: analysis_submit_blocked_by_position_duties_validation_state
        grounds:
          - validations[priority=11]
          - errors.ERR_DUTIES_NOT_CORROBORATED
          - calculations.duties_corroboration
          - entities.Position.fields.duties_validation_status
        distinguishing_aspect: |
          Entity pair ExemptionAnalysis -> Position: the analysis transition is legal on its own
          terms (the analysis is DRAFT and the actor is its analyst) yet is refused because a
          *different* entity, the Position, is still PENDING for lack of an attested INCUMBENT
          interview. Attesting the missing interview then makes the identical request succeed,
