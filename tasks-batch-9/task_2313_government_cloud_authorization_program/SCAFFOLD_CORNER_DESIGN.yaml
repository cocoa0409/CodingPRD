      rationale: The at-threshold and threshold-minus-one-second readings of is_overdue are asserted there.
  - name: the_surcharge_tier_is_keyed_on_labor_cost_alone
    claim_type: tiered_pricing
    grounds:
    - calculations.engagement_cost_rollup
    excluded_because:
      difficulty_instance: engagement_surcharge_tier_keys_on_labor_cost_not_on_total_cost
      rationale: The circular-looking definition is resolved there on inputs where keying the tier on total_cost_usd would
        pick a different rate.
