            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_id}", seller_party_id: "${own_id}", buyer_party_id: "${dev_id}", channel: "PRIVATE", units: 22, conveyance_mode: "WHOLE", agreed_price_cents: 30000000 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { mtx_id: $.data.id }
