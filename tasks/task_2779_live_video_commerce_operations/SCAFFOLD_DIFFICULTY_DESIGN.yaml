# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# domain: live-video-commerce-operations   (sibling of SCAFFOLD.yaml)
#
# Nine §0.5 Difficulty Rules x >= 2 differentiated instances = 22 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only; deleting this file
# leaves the declared behaviour identical.
#
# Shared canonical setup fragments are declared once as YAML anchors inside the
# first instance (&c_clock_t0 ... &c_cart2) and aliased by later instances, so
# every chain still expands to a complete empty-DB -> precondition sequence.
# Base chain end state (after *c_cart2):
#   clock 2026-08-10T18:10:00Z | Host ada-vance CERTIFIED, commission 0.08
#   Product SKU-ROBE base 4000 / cost 1500 / on_hand 50, SUBSTANTIATED
#   Show "Silk Sunday" 18:00-20:00Z LIVE (went_live_at 17:50Z)
#   LineupSlot seq 1 (snapshot cost 1500) | FlashOffer 3500, 18:00-19:00Z,
#   max_qty 10, ACTIVE | StreamChannel FLAGSHIP_APP PROVISIONED->LIVE @1500ms
#   DisclosureRecord PAID_ENDORSEMENT ACKNOWLEDGED (on time)
#   two Viewers with one OPEN cart each
#
# Every numeric assert below was computed by executing the §1.3 formulas with
# their declared constants and round_half_up.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: show_margin_provisional_vs_final_diverge
        grounds:
          - calculations.show_margin_analysis
          - calculations.order_totals
          - calculations.cart_bundle_tier
          - entities.Show.fields.margin_provisional_cents
          - entities.Show.fields.margin_final_cents
          - entities.LineupSlot.fields.unit_cost_snapshot_cents
          - state_machines.Order.AUTHORIZED_to_CAPTURED
        distinguishing_aspect: |
          The conserved-input variant pair is REVENUE RECOGNITION: on one identical
          two-order data set PROVISIONAL counts AUTHORIZED+CAPTURED revenue at the
          slot's frozen unit_cost_snapshot_cents with zero return provision and
          reports margin_cents == 4838, while FINAL counts CAPTURED revenue only,
          revalues COGS at the product's CURRENT unit_cost_cents, deducts
          RETURN_PROVISION_PCT and takes commission on the net-of-returns figure,
          reporting margin_cents == 2151 — a 2687-cent divergence from the same rows.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T18:10:00Z; show LIVE with an ACTIVE 3500-cent offer (max_qty 10) on a slot whose unit_cost_snapshot_cents is 1500."
            - "Viewer 1 checks out 2 units (subtotal 7000 -> TIER1 5%, effective 3325, merchandise 6650, tax 582, shipping 599, total 7831)."
            - "Viewer 2 checks out 1 unit (subtotal 3500 -> no tier, effective 3500, merchandise 3500, tax 306, shipping 599, total 4405)."
            - "Order 1 is CAPTURED (commission 532 stamped); order 2 stays AUTHORIZED."
            - "After the PROVISIONAL read the product's unit_cost_cents is revised 1500 -> 1800, so FINAL revalues COGS."
          setup_api_calls:
            - &c_clock_t0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_host
              call: "POST /hosts"
              payload: { full_name: "Ada Vance", handle: "ada-vance", commission_pct: 0.08 }
              as: ShowProducer
              captures: { h1: $.data.id }
            - &c_cert
              call: "POST /hosts/${h1}/disclosure-certifications"
              payload: { certified_until: "2026-12-31T23:59:59Z" }
              as: ComplianceOfficer
              as_user_id: "co-cert-1"
            - &c_viewer1
              call: "POST /viewers"
              payload: { display_name: "Vera One", email: "vera.one@example.com" }
              as: PlatformAdmin
              captures: { v1: $.data.id }
            - &c_viewer2
              call: "POST /viewers"
              payload: { display_name: "Val Two", email: "val.two@example.com" }
              as: PlatformAdmin
              captures: { v2: $.data.id }
            - &c_product
              call: "POST /products"
              payload: { sku: "SKU-ROBE", title: "Silk Wrap Robe", base_price_cents: 4000, unit_cost_cents: 1500, on_hand_qty: 50, claim_text: "Machine washable mulberry silk" }
              as: MerchandisingManager
              captures: { p1: $.data.id }
            - &c_substantiate
              call: "POST /products/${p1}/claim-substantiations"
              payload: { decision: "SUBSTANTIATED", evidence_ref: "LAB-88" }
              as: ComplianceOfficer
              as_user_id: "co-claims-1"
            - &c_show
              call: "POST /shows"
              payload: { title: "Silk Sunday", scheduled_start_at: "2026-08-10T18:00:00Z", scheduled_end_at: "2026-08-10T20:00:00Z" }
              as: ShowProducer
              captures: { sh1: $.data.id }
            - &c_booking
              call: "POST /host-bookings"
              payload: { show_id: "${sh1}", host_id: "${h1}", role: "PRIMARY", call_time_at: "2026-08-10T17:00:00Z", release_time_at: "2026-08-10T20:30:00Z", fee_cents: 50000 }
              as: ShowProducer
              captures: { b1: $.data.id }
            - &c_disclosure
              call: "POST /disclosure-records"
              payload: { show_id: "${sh1}", host_booking_id: "${b1}", disclosure_type: "PAID_ENDORSEMENT", required_script_code: "SCRIPT-PAID-01" }
              as: ShowProducer
              captures: { d1: $.data.id }
            - &c_confirm
              call: "POST /host-bookings/${b1}/confirm"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - &c_ack
              call: "POST /disclosure-records/${d1}/acknowledge"
              payload: { script_code_spoken: "SCRIPT-PAID-01" }
              as: Host
              as_user_id: "${h1}"
            - &c_slot
              call: "POST /lineup-slots"
              payload: { show_id: "${sh1}", product_id: "${p1}", slot_sequence: 1, planned_start_at: "2026-08-10T18:05:00Z", planned_end_at: "2026-08-10T18:35:00Z", planned_qty: 20 }
              as: MerchandisingManager
              captures: { sl1: $.data.id, sl1_v: $.data.version }
            - &c_offer
              call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl1}", offer_price_cents: 3500, window_start_at: "2026-08-10T18:00:00Z", window_end_at: "2026-08-10T19:00:00Z", max_qty: 10, expected_lineup_slot_version: "${sl1_v}" }
              as: MerchandisingManager
              captures: { o1: $.data.id }
            - &c_channel
              call: "POST /stream-channels"
              payload: { show_id: "${sh1}", platform: "FLAGSHIP_APP", target_latency_ms: 1500, is_primary: true }
              as: ShowProducer
              captures: { ch1: $.data.id }
            - &c_provision
              call: "POST /stream-channels/${ch1}/provision"
              payload: {}
              as: ShowProducer
            - &c_health_ok
              call: "POST /stream-channels/${ch1}/health-reports"
              payload: { latency_ms: 1500, dropped_frame_pct: 0.0 }
              as: ShowProducer
            - &c_ready
              call: "POST /shows/${sh1}/ready"
              payload: {}
              as: ShowProducer
            - &c_clock_prelive
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T17:50:00Z" }
              as: PlatformAdmin
            - &c_golive
              call: "POST /shows/${sh1}/go-live"
              payload: {}
              as: ShowProducer
            - &c_clock_live
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T18:10:00Z" }
              as: PlatformAdmin
            - &c_activate
              call: "POST /flash-offers/${o1}/activate"
              payload: {}
              as: MerchandisingManager
            - &c_cart1
              call: "POST /carts"
              payload: { show_id: "${sh1}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1: $.data.id }
            - &c_cart2
              call: "POST /carts"
              payload: { show_id: "${sh1}" }
              as: Viewer
              as_user_id: "${v2}"
              captures: { ct2: $.data.id }
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 2 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { it1: $.data.id }
            - call: "POST /carts/${ct2}/items"
              payload: { flash_offer_id: "${o1}", qty: 1 }
              as: Viewer
              as_user_id: "${v2}"
              captures: { it2: $.data.id }
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
            - call: "POST /carts/${ct1}/checkout"
              payload: { expected_cart_version: "${ct1_v}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ord1: $.data.id }
            - call: "GET /carts/${ct2}"
              payload: {}
              as: Viewer
              as_user_id: "${v2}"
              captures: { ct2_v: $.data.version }
            - call: "POST /carts/${ct2}/checkout"
              payload: { expected_cart_version: "${ct2_v}" }
              as: Viewer
              as_user_id: "${v2}"
              captures: { ord2: $.data.id }
            - call: "POST /orders/${ord1}/capture"
              payload: {}
              as: MerchandisingManager
          trigger:
            - call: "GET /shows/${sh1}/analytics"
              payload: { variant: "PROVISIONAL" }
              as: ShowProducer
            - call: "POST /products/${p1}/inventory-adjustments"
              payload: { reason: "COST_REVISION", unit_cost_cents: 1800 }
              as: MerchandisingManager
            - call: "GET /shows/${sh1}/analytics"
              payload: { variant: "FINAL" }
              as: ShowProducer
          assert:
            - "Order.${ord1}.merchandise_cents == 6650 and Order.${ord1}.tax_cents == 582 and Order.${ord1}.shipping_cents == 599 and Order.${ord1}.total_cents == 7831"
            - "Order.${ord2}.merchandise_cents == 3500 and Order.${ord2}.tax_cents == 306 and Order.${ord2}.total_cents == 4405"
            - "Order.${ord1}.host_commission_accrued_cents == 532"
            - "PROVISIONAL response: order_count == 2, merchandise_revenue_cents == 10150, cogs_cents == 4500, return_provision_cents == 0, host_commission_cents == 812, margin_cents == 4838"
            - "PROVISIONAL response: gross_merchandise_cents == 6650 (only the CAPTURED order is in Show.gross_merchandise_cents)"
            - "Show.${sh1}.margin_provisional_cents == 4838 (stamped by the PROVISIONAL read)"
            - "FINAL response: order_count == 1, merchandise_revenue_cents == 6650, cogs_cents == 3600, return_provision_cents == 399, host_commission_cents == 500, margin_cents == 2151"
            - "FINAL margin_cents 2151 != PROVISIONAL margin_cents 4838 on identical order rows"
            - "Show.${sh1}.margin_final_cents == null after the FINAL read (only the ENDED->SETTLED transition stamps it)"

      - name: host_score_live_window_vs_attributed_72h
        grounds:
          - calculations.host_effectiveness_score
          - calculations.replay_attributed_revenue
          - entities.Host.fields.effectiveness_score_live
          - entities.Host.fields.effectiveness_score_attributed
          - entities.LineupSlot.fields.replay_conversions_count
        distinguishing_aspect: |
          The conserved-input variant pair is ATTRIBUTION WINDOW, not revenue
          recognition: with 2 live orders, 4 carts, 1 answered question and 2 replay
          conversions fixed, LIVE_WINDOW puts effective_orders = 2 (conversion
          component 50, score 48) while ATTRIBUTED_72H adds REPLAY_ORDER_WEIGHT 0.5
          per replay conversion for effective_orders = 3.0 (conversion component 75,
          score 61) — the divergence is driven purely by replay rows the first
          variant discards, and the numerator, not the cost basis, moves.
        test_recipe:
          setup:
            - "Base chain: show LIVE at 18:10Z, two viewers with one cart each, ACTIVE 3500-cent offer."
            - "Viewer 1 checks out 2 units, viewer 2 checks out 1 unit; both orders stay AUTHORIZED (never captured)."
            - "Each viewer opens a second, empty cart, so the show has 4 carts total (unique_cart_count denominator = 4)."
            - "Viewer 1 asks one question that is approved, routed and ANSWERED by the host while LIVE."
            - "Show ends at 19:30Z; the slot's replay marker is published; two replay conversions of 4000 cents are recorded at +4h (weight 1.0) and +30h (weight 0.6)."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_viewer2
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - *c_activate
            - *c_cart1
            - *c_cart2
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 2 }
              as: Viewer
              as_user_id: "${v1}"
            - call: "POST /carts/${ct2}/items"
              payload: { flash_offer_id: "${o1}", qty: 1 }
              as: Viewer
              as_user_id: "${v2}"
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
            - call: "POST /carts/${ct1}/checkout"
              payload: { expected_cart_version: "${ct1_v}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ord1: $.data.id }
            - call: "GET /carts/${ct2}"
              payload: {}
              as: Viewer
              as_user_id: "${v2}"
              captures: { ct2_v: $.data.version }
            - call: "POST /carts/${ct2}/checkout"
              payload: { expected_cart_version: "${ct2_v}" }
              as: Viewer
              as_user_id: "${v2}"
              captures: { ord2: $.data.id }
            - call: "POST /carts"
              payload: { show_id: "${sh1}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct3: $.data.id }
            - call: "POST /carts"
              payload: { show_id: "${sh1}" }
              as: Viewer
              as_user_id: "${v2}"
              captures: { ct4: $.data.id }
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "QUESTION", body: "Does the silk shrink?" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { q1: $.data.id }
            - call: "POST /interactions/${q1}/moderate"
              payload: { action: "APPROVE" }
              as: Moderator
              as_user_id: "mod-1"
            - call: "POST /interactions/${q1}/route"
              payload: {}
              as: Moderator
              as_user_id: "mod-1"
            - call: "POST /interactions/${q1}/host-action"
              payload: { action: "ANSWER", answer_body: "Cold wash only, no shrinkage." }
              as: Host
              as_user_id: "${h1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T19:30:00Z" }
              as: PlatformAdmin
            - call: "POST /shows/${sh1}/end"
              payload: {}
              as: ShowProducer
            - call: "POST /lineup-slots/${sl1}/replay-marker"
              payload: { marker_offset_sec: 600, product_link_url: "https://shop.example.com/robe" }
              as: MerchandisingManager
            - call: "POST /lineup-slots/${sl1}/replay-marker/publish"
              payload: {}
              as: MerchandisingManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lineup-slots/${sl1}/replay-conversions"
              payload: { viewer_id: "${v1}", net_revenue_cents: 4000, occurred_at: "2026-08-10T23:30:00Z" }
              as: MerchandisingManager
            - call: "POST /lineup-slots/${sl1}/replay-conversions"
              payload: { viewer_id: "${v2}", net_revenue_cents: 4000, occurred_at: "2026-08-12T01:30:00Z" }
              as: MerchandisingManager
          trigger:
            - call: "GET /hosts/${h1}/performance"
              payload: { variant: "LIVE_WINDOW", show_id: "${sh1}" }
              as: ShowProducer
            - call: "GET /hosts/${h1}/performance"
              payload: { variant: "ATTRIBUTED_72H", show_id: "${sh1}" }
              as: ShowProducer
          assert:
            - "Both responses report live_orders_count == 2, unique_cart_count == 4, replay_conversions_count == 2, answered_questions_count == 1, poll_votes_count == 0, late_ack_count == 0"
            - "LIVE_WINDOW response: conversion_component == 50, engagement_component == 10, compliance_component == 100, effectiveness_score == 48"
            - "ATTRIBUTED_72H response: conversion_component == 75, engagement_component == 10, compliance_component == 100, effectiveness_score == 61"
            - "Host.${h1}.effectiveness_score_live == 48 and Host.${h1}.effectiveness_score_attributed == 61"
            - "LineupSlot.${sl1}.replay_conversions_count == 2 and LineupSlot.${sl1}.replay_attributed_revenue_cents == 6400 (4000 at weight 1.0 plus 2400 at weight 0.6)"
            - "Show.${sh1}.replay_attributed_revenue_cents == 6400"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: simulcast_index_three_input_nonlinear
        grounds:
          - calculations.simulcast_readiness_index
          - entities.StreamChannel.fields.readiness_index
          - entities.Show.fields.simulcast_readiness_index
          - entities.StreamChannel.fields.platform
        distinguishing_aspect: |
          Mode (a) — three independent inputs interact NON-LINEARLY: per-channel
          latency, dropped_frame_pct and the CROSS-CHANNEL latency spread are each
          clamped by max(0, ...) before a single round_half_up of their sum, and a
          platform-conditional branch exempts PARTNER_APP from the drift term.
          Consequences no additive formula can produce: reporting health on channel 2
          changes channel 1's index (90 -> 88) without channel 1 reporting again, a
          PARTNER_APP channel scores 74 where a byte-identical SOCIAL_A channel scores
          72, and the show index is min() over channels, so it stays 0 while any
          PROVISIONED channel has never reported.
        test_recipe:
          setup:
            - "Show in DRAFT with three PROVISIONED channels and no health reports yet: FLAGSHIP_APP (primary), SOCIAL_A, PARTNER_APP, all target_latency_ms 1500."
            - "Constants: LATENCY_TARGET_MS 1500, LATENCY_STEP_MS 50, FRAME_PENALTY_FACTOR 400, SIMULCAST_DRIFT_TOLERANCE_MS 800, DRIFT_STEP_MS 100."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - call: "POST /stream-channels"
              payload: { show_id: "${sh1}", platform: "SOCIAL_A", target_latency_ms: 1500 }
              as: ShowProducer
              captures: { ch2: $.data.id }
            - call: "POST /stream-channels/${ch2}/provision"
              payload: {}
              as: ShowProducer
            - call: "POST /stream-channels"
              payload: { show_id: "${sh1}", platform: "PARTNER_APP", target_latency_ms: 1500 }
              as: ShowProducer
              captures: { ch3: $.data.id }
            - call: "POST /stream-channels/${ch3}/provision"
              payload: {}
              as: ShowProducer
          trigger:
            - call: "POST /stream-channels/${ch1}/health-reports"
              payload: { latency_ms: 1600, dropped_frame_pct: 0.02 }
              as: ShowProducer
            - call: "POST /stream-channels/${ch2}/health-reports"
              payload: { latency_ms: 2600, dropped_frame_pct: 0.01 }
              as: ShowProducer
            - call: "POST /stream-channels/${ch3}/health-reports"
              payload: { latency_ms: 2600, dropped_frame_pct: 0.01 }
              as: ShowProducer
          assert:
            - "After report 1: StreamChannel.${ch1}.readiness_index == 90 (latency 2 + frames 8 + drift 0)"
            - "After report 1: Show.${sh1}.simulcast_readiness_index == 0 because ${ch2} and ${ch3} are PROVISIONED with latency_ms null"
            - "After report 2: StreamChannel.${ch1}.readiness_index == 88 — the spread 2600-1600 = 1000 adds a drift penalty of 2 to a channel that did not report"
            - "After report 2: StreamChannel.${ch2}.readiness_index == 72 (latency 22 + frames 4 + drift 2)"
            - "After report 3: StreamChannel.${ch3}.readiness_index == 74 — identical latency/frames to ${ch2} but PARTNER_APP takes drift 0"
            - "After report 3: StreamChannel.${ch1}.readiness_index == 88 and StreamChannel.${ch2}.readiness_index == 72"
            - "After report 3: Show.${sh1}.simulcast_readiness_index == 72 (min over the three channels, not an average of 78)"
            - "All three channels remain status PROVISIONED (every index >= CHANNEL_FAIL_INDEX 40)"

      - name: order_totals_per_line_tax_then_sum
        grounds:
          - calculations.order_totals
          - calculations.cart_bundle_tier
          - calculations.flash_offer_effective_unit_price
          - entities.CartItem.fields.line_tax_cents
          - entities.Order.fields.tax_cents
        distinguishing_aspect: |
          Mode (b) — the SAME inputs aggregated in a different ORDER give a different
          cent total: tax is round_half_up PER LINE and the rounded line taxes are then
          summed (292 + 185 = 477), whereas rounding once over the summed merchandise
          (round_half_up(5444 * 0.0875) = 476) is explicitly not the rule. The same
          basket also proves the tier is applied at add time only: line A keeps its
          3333 lock while line B, which lifted the cart over TIER1_FLOOR_CENTS, prices
          at 2111.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with two products: SKU-ROBE (base 4000) on slot 1 and SKU-SASH (base 2500) on slot 2, both SUBSTANTIATED."
            - "Two ACTIVE offers on distinct products: 3333 cents (max_qty 5) and 2222 cents (max_qty 5), windows 18:00-19:00Z."
            - "Viewer 1 holds one unit of each: line A added first (subtotal 3333, no tier), line B second (subtotal 5555, TIER1 5%)."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl1}", offer_price_cents: 3333, window_start_at: "2026-08-10T18:00:00Z", window_end_at: "2026-08-10T19:00:00Z", max_qty: 5, expected_lineup_slot_version: "${sl1_v}" }
              as: MerchandisingManager
              captures: { oA: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-SASH", title: "Silk Sash", base_price_cents: 2500, unit_cost_cents: 900, on_hand_qty: 40, claim_text: "Hand rolled hem" }
              as: MerchandisingManager
              captures: { p2: $.data.id }
            - call: "POST /products/${p2}/claim-substantiations"
              payload: { decision: "SUBSTANTIATED", evidence_ref: "LAB-89" }
              as: ComplianceOfficer
              as_user_id: "co-claims-1"
            - call: "POST /lineup-slots"
              payload: { show_id: "${sh1}", product_id: "${p2}", slot_sequence: 2, planned_start_at: "2026-08-10T18:40:00Z", planned_end_at: "2026-08-10T19:00:00Z", planned_qty: 10 }
              as: MerchandisingManager
              captures: { sl2: $.data.id, sl2_v: $.data.version }
            - call: "POST /flash-offers"
