scenario: "Clinical Ladder & Nursing Certification Program (Magnet hospital nursing program): ladder level criteria & application portfolio, review committee scoring & advancement decision, differential pay activation & anniversary review, certification exam reimbursement & bonus, project/committee participation tracking, maintenance requirement & demotion policy, budget forecast for differentials, retention outcome analysis"
domain_name: clinical-ladder-nursing-certification
api_prefix: /clinical-ladder

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - name: employee_code
        type: string
        source: input
        description: Unique hospital HR employee code, e.g. "RN-1042"
        constraints: "Unique across all Nurse rows; immutable after creation"
      - name: full_name
        type: string
        source: input
        description: Nurse's legal full name
      - name: hire_date
        type: datetime
        source: input
        description: Original hire date; drives tenure-year computation in maintenance scoring
      - name: home_unit
        type: string
        source: input
        description: "Cost-center unit code, e.g. ICU-4W; drives budget attribution in forecast rollups"
      - name: current_level
        type: enum
        source: computed
        description: Current clinical-ladder level; mutated only by advancement/demotion transitions
        default: CN_I
        constraints: "One of {CN_I, CN_II, CN_III, CN_IV}; CN_I is the floor"
      - name: differential_status
        type: enum
        source: computed
        description: "Whether the ladder differential is currently paid. Evolves independently of current_level (parallel dimension): demotion sets it SUSPENDED while level recomputes; a subsequent advancement approval flips it back to ACTIVE."
        default: INACTIVE
        constraints: "One of {INACTIVE, ACTIVE, SUSPENDED, TERMINATED}"
      - name: differential_activated_at
        type: datetime
        source: system
        description: UTC timestamp of most recent INACTIVE/SUSPENDED -> ACTIVE flip; null while never activated; drives the anniversary-review window
        constraints: "Null when differential_status == INACTIVE and never previously ACTIVE"
      - name: tenure_years
        type: number
        source: computed
        description: "Floor((current_utc - hire_date) / 365.25 days), recomputed on every read via logical clock; 2 decimal places, round_half_up not applied (floor of whole years first)"
      - name: retention_risk_score
        type: number
        source: computed
        description: "Decay-function score 0..100 fed by demotions, lapsed maintenance, and time-since-advancement; consumed by retention outcome analysis"

  - name: LadderCriterion
    parent: null
    common_fields: true
    fields:
      - name: target_level
        type: enum
        source: input
        description: Level this criterion set admits applicants into
        constraints: "One of {CN_II, CN_III, CN_IV}; unique per (target_level, effective_from) window overlap"
      - name: min_portfolio_score
        type: integer
        source: input
        description: Aggregate weighted committee score at or above which the portfolio is advancement-eligible
        constraints: "1 <= value <= 400"
      - name: min_participation_points
        type: integer
        source: input
        description: Participation points the nurse must hold in the 24-month lookback window at submission time
        constraints: "0 <= value <= 200"
      - name: required_certification_track
        type: enum
        source: input
        description: Certification track the nurse must hold CURRENT in for this level
        constraints: "One of {NONE, BASIC, SPECIALTY, ADVANCED}"
      - name: differential_monthly_cents
        type: integer
        source: input
        description: Base monthly differential paid while differential_status == ACTIVE at this level
        constraints: ">= 0; CN_IV must be strictly greater than CN_III must be strictly greater than CN_II across overlapping active criterion sets"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of this criterion set's validity window (UTC)
      - name: effective_until
        type: datetime
        source: input
        description: "Exclusive end of validity window; null means open-ended. [effective_from, effective_until) is half-open."
        constraints: "Null or strictly greater than effective_from"

  - name: ParticipationEvent
    parent: Nurse
    common_fields: true
    fields:
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; owner of the participation record"
      - name: event_kind
        type: enum
        source: input
        description: Category of professional engagement
        constraints: "One of {COMMITTEE_SEAT, QI_PROJECT, PEER_EDUCATION, EBP_RESEARCH, PRECEPTORSHIP}"
      - name: points
        type: integer
        source: input
        description: Points awarded for the event
        constraints: "1 <= points <= 40; COMMITTEE_SEAT capped at 20 per event"
      - name: occurred_on
        type: datetime
        source: input
        description: Date the engagement occurred; drives the 24-month rolling lookback window
      - name: status
        type: enum
        source: computed
        description: Lifecycle of the record
        default: PENDING_VERIFICATION
        constraints: "One of {PENDING_VERIFICATION, VERIFIED, VOIDED}"

  - name: Certification
    parent: Nurse
    common_fields: true
    fields:
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; holder of the certification"
      - name: track
        type: enum
        source: input
        description: Certification tier track
        constraints: "One of {BASIC, SPECIALTY, ADVANCED}"
      - name: certifying_body
        type: string
        source: input
        description: Issuing body, e.g. ANCC
      - name: exam_fee_cents
        type: integer
        source: input
        description: Fee the nurse paid for the exam; reimbursement claim anchors to this amount
        constraints: "> 0"
      - name: obtained_on
        type: datetime
        source: input
        description: Exam pass / credential grant date
      - name: expires_on
        type: datetime
        source: input
        description: Credential expiry; expiry auto-lapses the certification via ops-run sweep
        constraints: "Strictly greater than obtained_on"
      - name: status
        type: enum
        source: computed
        description: "CURRENT until expiry sweep; LAPSED thereafter; REVOKED only via ProgramAdmin action"
        default: CURRENT
        constraints: "One of {CURRENT, LAPSED, REVOKED}"
      - name: renewal_of_id
        type: string
        source: input
        description: "FK -> Certification.id; when this row renews an earlier certification of the same nurse+track. Null for first-time credentials."
        constraints: "When set, target must be same nurse_id and same track"

  - name: ReimbursementClaim
    parent: Certification
    common_fields: true
    fields:
      - name: certification_id
        type: string
        source: input
        description: "FK -> Certification.id; the exam whose fee is claimed"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Amount requested by the nurse
        constraints: "> 0"
      - name: approved_amount_cents
        type: integer
        source: computed
        description: "min(claimed_amount_cents, remaining cap under the per-nurse fiscal-year ceiling at decision time); computed by calc_reimbursement_cap"
        constraints: "0 <= value <= claimed_amount_cents"
      - name: status
        type: enum
        source: computed
        description: Claim lifecycle
        default: SUBMITTED
        constraints: "One of {SUBMITTED, APPROVED, PAID, DENIED}"
      - name: denial_reason
        type: string
        source: input
        description: Required when transitioning to DENIED; null otherwise
      - name: fiscal_year
        type: integer
        source: computed
        description: "Fiscal year derived from logical-clock UTC at claim submission: FY = year of July-anchored calendar (month >= 7 -> year+1 else year)"

  - name: CertificationBonus
    parent: Certification
    common_fields: true
    fields:
      - name: certification_id
        type: string
        source: input
        description: "FK -> Certification.id; credential earning the bonus"
      - name: bonus_amount_cents
        type: integer
        source: computed
        description: "Track-tiered one-time bonus computed by calc_certification_bonus; server-side only"
      - name: status
        type: enum
        source: computed
        description: Bonus lifecycle
        default: ACCRUED
        constraints: "One of {ACCRUED, PAID, CLAWED_BACK}"
      - name: clawback_reason
        type: string
        source: input
        description: Required when clawing back (certification revoked within 12 months of bonus payment)

  - name: Application
    parent: Nurse
    common_fields: true
    fields:
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; the applicant"
      - name: target_level
        type: enum
        source: input
        description: Level applied for; must be exactly one rung above applicant's current_level at submission
        constraints: "One of {CN_II, CN_III, CN_IV}"
      - name: portfolio_narrative
        type: string
        source: input
        description: Free-text portfolio body submitted by the nurse
      - name: criterion_id
        type: string
        source: computed
        description: "FK -> LadderCriterion.id; the criterion set pinned at submission (version-pinning on approval layer): the active criterion whose [effective_from, effective_until) contains the submission timestamp"
      - name: status
        type: enum
        source: computed
        description: "Cyclic lifecycle: RETURNED_FOR_REVISION loops back to DRAFT without consuming the application"
        default: DRAFT
        constraints: "One of {DRAFT, SUBMITTED, IN_REVIEW, RETURNED_FOR_REVISION, APPROVED, DENIED, WITHDRAWN}"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock timestamp of latest DRAFT/RETURNED_FOR_REVISION -> SUBMITTED transition; null until first submission
      - name: review_cycle
        type: integer
        source: computed
        description: "Number of completed submit->decision loops; increments on each RETURNED_FOR_REVISION and each final decision; caps resubmission count"
        default: 0
        constraints: "0 <= review_cycle <= 3"
      - name: aggregate_score
        type: integer
        source: computed
        description: "Weighted committee score computed by calc_committee_score once quorum reached; null before scoring closes"
      - name: participation_snapshot_points
        type: integer
        source: computed
        description: "Participation points in the 24-month lookback window frozen at submission by calc_participation_window; revalidation at decision time uses this snapshot, not a live recompute"

  - name: ReviewAssignment
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; portfolio under review"
      - name: reviewer_nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; committee member assigned to score. Segregation of duties: reviewer_nurse_id MUST differ from Application.nurse_id."
      - name: dimension_scores
        type: object
        source: input
        description: "{leadership: 0..100, clinical_expertise: 0..100, professional_development: 0..100, outcomes: 0..100}; all four required at score submission"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock time of scoring submission; null while assignment is pending
      - name: status
        type: enum
        source: computed
        description: Assignment lifecycle
        default: PENDING
        constraints: "One of {PENDING, SCORED, RECUSED, EXPIRED}"

  - name: AdvancementDecision
    parent: Application
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the decided application. Append-only: one decision row per resolved review cycle."
      - name: decided_by_admin_id
        type: string
        source: input
        description: Opaque X-User-ID of the deciding ProgramAdmin; segregation-of-duties audit anchor
      - name: outcome
        type: enum
        source: input
        description: Decision rendered
        constraints: "One of {APPROVE, DENY}"
      - name: criterion_version_snapshot
        type: integer
        source: system
        description: LadderCriterion.version captured at decision time; tamper-evidence that the decision used the criterion set pinned at submission
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock timestamp of decision

  - name: AnniversaryReview
    parent: Nurse
    common_fields: true
    fields:
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; subject of the annual maintenance review"
      - name: review_year
        type: integer
        source: input
        description: Calendar year of the anniversary cycle (anniversary = differential_activated_at month/day)
      - name: maintenance_score
        type: integer
        source: computed
        description: "Composite score 0..100 from calc_maintenance_score over verified participation + certification currency + tenure; computed at review close"
      - name: outcome
        type: enum
        source: computed
        description: Review verdict; DEMOTE fires the demotion cascade
        default: OPEN
        constraints: "One of {OPEN, SUSTAIN, DEMOTE, LAPSE}"
      - name: resolution_reason
        type: string
        source: input
        description: ProgramAdmin-provided rationale; required on DEMOTE and LAPSE

  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - name: unit
        type: string
        source: input
        description: "Cost-center unit code matching Nurse.home_unit; one BudgetLine per (unit, fiscal_year)"
        constraints: "Unique per (unit, fiscal_year)"
      - name: fiscal_year
        type: integer
        source: input
        description: July-anchored fiscal year this budget covers
      - name: allocated_cents
        type: integer
        source: input
        description: Total ladder-program budget allocated to the unit for the fiscal year
        constraints: ">= 0"
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum over nurses in unit of active monthly differential annualized + approved-unpaid reimbursement + accrued-unpaid bonuses; maintained by calc_budget_commitment on every financial mutation"
      - name: forecast_cents
        type: integer
        source: computed
        description: "Dual-variant forecast by calc_budget_forecast: provisional variant uses forward_looking projection, final variant uses chronological actuals + committed only"
      - name: forecast_variant
        type: enum
        source: system
        description: Which variant forecast_cents currently holds; flips to FINAL when fiscal year closes
        default: PROVISIONAL
        constraints: "One of {PROVISIONAL, FINAL}"

  - name: RetentionSnapshot
    parent: null
    common_fields: false
    fields:
      - name: captured_at
        type: datetime
        source: system
        description: Logical-clock time the snapshot was taken by the ops-run sweep
      - name: unit
        type: string
        source: input
        description: Cost-center unit aggregated; "ALL" for hospital-wide rollup
      - name: headcount_by_level
        type: object
        source: computed
        description: "{CN_I: n, CN_II: n, CN_III: n, CN_IV: n} counts of nurses at snapshot time"
      - name: avg_retention_risk_score
        type: number
        source: computed
        description: Mean retention_risk_score over the snapshot population; 2 decimals round_half_up
      - name: demotion_rate
        type: number
        source: computed
        description: "Demotions in trailing 12 months / headcount at snapshot; 4 decimals round_half_up; denominator-zero rule pinned in calc_retention_rollup"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /clinical-ladder/applications/{id}/submit"
        actor: Nurse
        preconditions:
          - "Application.status == DRAFT"
          - "acting Nurse.id == Application.nurse_id"
          - "Application.target_level is exactly one rung above Nurse.current_level (CN_I->CN_II, CN_II->CN_III, CN_III->CN_IV)"
          - "an active LadderCriterion exists whose target_level == Application.target_level and effective_from <= clock.now < (effective_until or infinity)"
          - "calc_participation_window(nurse, 24-month lookback) >= criterion.min_participation_points"
          - "nurse holds a Certification with status == CURRENT whose track >= criterion.required_certification_track (track order NONE < BASIC < SPECIALTY < ADVANCED)"
        side_effects:
          - "sets Application.criterion_id to the matched LadderCriterion.id (version-pinning)"
          - "sets Application.submitted_at = clock.now"
          - "freezes Application.participation_snapshot_points = calc_participation_window result"
          - "increments Application.version by 1"
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /clinical-ladder/applications/{id}/assignments (first ReviewAssignment created)"
        actor: ProgramAdmin
        preconditions:
          - "Application.status == SUBMITTED"
        side_effects:
          - "creates ReviewAssignment row(s) with status PENDING"
          - "increments Application.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /clinical-ladder/applications/{id}/decide with outcome=APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "Application.status == IN_REVIEW"
          - "scored ReviewAssignment count >= QUORUM (3) and no PENDING assignments remain"
          - "calc_committee_score(application) >= criterion.min_portfolio_score where criterion is the pinned Application.criterion_id"
          - "pinned LadderCriterion.version == its version at submission-time pin (re-validation on stale reference)"
          - "acting ProgramAdmin's X-User-ID differs from every scored ReviewAssignment.reviewer_nurse_id's mapped identity (segregation of duties: scorer may not decide)"
        side_effects:
          - "creates AdvancementDecision row (append-only) with criterion_version_snapshot"
          - "Nurse.current_level := Application.target_level"
          - "Nurse.differential_status := ACTIVE (from INACTIVE) and Nurse.differential_activated_at := clock.now"
          - "increments Application.review_cycle by 1"
          - "recomputes Nurse.retention_risk_score via calc_retention_risk (advancement resets the decay baseline)"
          - "recomputes BudgetLine.committed_cents for Nurse.home_unit via calc_budget_commitment (cascade into budget)"
      - from: IN_REVIEW
        to: DENIED
        trigger: "POST /clinical-ladder/applications/{id}/decide with outcome=DENY"
        actor: ProgramAdmin
        preconditions:
          - "Application.status == IN_REVIEW"
          - "scored ReviewAssignment count >= QUORUM (3) and no PENDING assignments remain"
        side_effects:
          - "creates AdvancementDecision row"
          - "increments Application.review_cycle by 1"
          - "recomputes Nurse.retention_risk_score via calc_retention_risk (denial increments risk)"
      - from: IN_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /clinical-ladder/applications/{id}/return-for-revision"
        actor: ProgramAdmin
        preconditions:
          - "Application.status == IN_REVIEW"
          - "Application.review_cycle < 3 (cycle cap)"
        side_effects:
          - "marks every PENDING ReviewAssignment on this application EXPIRED (cascade down; SCORED ones remain for audit)"
          - "increments Application.review_cycle by 1"
      - from: RETURNED_FOR_REVISION
        to: DRAFT
        trigger: "system auto-transition immediately after RETURNED_FOR_REVISION side effects complete"
        actor: system
        preconditions: []
        side_effects:
          - "clears Application.submitted_at to null (resubmission re-pins criterion and re-snapshots participation)"
          - "increments Application.version by 1"
        note: "This makes the machine cyclic: DRAFT->SUBMITTED->IN_REVIEW->RETURNED_FOR_REVISION->DRAFT, up to review_cycle cap 3."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /clinical-ladder/applications/{id}/withdraw"
        actor: Nurse
        preconditions:
          - "Application.status == DRAFT"
          - "acting Nurse.id == Application.nurse_id"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /clinical-ladder/applications/{id}/withdraw"
        actor: Nurse
        preconditions:
          - "Application.status == SUBMITTED"
          - "acting Nurse.id == Application.nurse_id"
        side_effects: []

  - entity: ReviewAssignment
    initial_state: PENDING
    terminal_states: [SCORED, RECUSED, EXPIRED]
    transitions:
      - from: PENDING
        to: SCORED
        trigger: "POST /clinical-ladder/review-assignments/{id}/score"
        actor: Nurse
        preconditions:
          - "ReviewAssignment.status == PENDING"
          - "acting Nurse.id == ReviewAssignment.reviewer_nurse_id"
          - "parent Application.status == IN_REVIEW (guarded cross-entity)"
          - "score submitted within REVIEW_WINDOW_DAYS of assignment creation (business_temporal)"
        side_effects:
          - "sets dimension_scores and submitted_at"
          - "when the SCORED count on the parent Application reaches QUORUM and no PENDING remain, recomputes Application.aggregate_score via calc_committee_score (bubble up)"
      - from: PENDING
        to: RECUSED
        trigger: "POST /clinical-ladder/review-assignments/{id}/recuse"
        actor: Nurse
        preconditions:
          - "ReviewAssignment.status == PENDING"
          - "acting Nurse.id == ReviewAssignment.reviewer_nurse_id"
        side_effects:
          - "parent Application remains IN_REVIEW; a replacement ReviewAssignment may be created"
      - from: PENDING
        to: EXPIRED
        trigger: "system sweep POST /clinical-ladder/_ops/run_cycle when now > assignment.created_at + REVIEW_WINDOW_DAYS, or application return-for-revision cascade"
        actor: system
        preconditions:
          - "ReviewAssignment.status == PENDING"
        side_effects:
          - "no score recorded; assignment excluded from quorum count"

  - entity: ParticipationEvent
    initial_state: PENDING_VERIFICATION
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /clinical-ladder/participation-events/{id}/verify"
        actor: ProgramAdmin
        preconditions:
          - "ParticipationEvent.status == PENDING_VERIFICATION"
        side_effects:
          - "recomputes Nurse.retention_risk_score via calc_retention_risk (verified engagement lowers risk)"
      - from: PENDING_VERIFICATION
        to: VOIDED
        trigger: "POST /clinical-ladder/participation-events/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "ParticipationEvent.status == PENDING_VERIFICATION"
        side_effects: []

  - entity: Certification
    initial_state: CURRENT
    terminal_states: [LAPSED, REVOKED]
    transitions:
      - from: CURRENT
        to: LAPSED
        trigger: "system sweep POST /clinical-ladder/_ops/run_cycle when clock.now >= Certification.expires_on"
        actor: system
        preconditions:
          - "Certification.status == CURRENT"
        side_effects:
          - "recomputes Nurse.retention_risk_score via calc_retention_risk (lapse increments risk)"
          - "if the lapsed certification is the holder's only CURRENT credential at-or-above the nurse's current-level requirement, opens an AnniversaryReview with outcome OPEN flagged for early maintenance check (cross-entity)"
      - from: CURRENT
        to: REVOKED
        trigger: "POST /clinical-ladder/certifications/{id}/revoke"
        actor: ProgramAdmin
        preconditions:
          - "Certification.status == CURRENT"
        side_effects:
          - "every CertificationBonus on this certification with status == PAID and paid within trailing 12 months transitions to CLAWED_BACK (compensation cascade)"
          - "recomputes BudgetLine.committed_cents for holder's home_unit (clawback releases commitment)"
          - "recomputes Nurse.retention_risk_score"

  - entity: ReimbursementClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /clinical-ladder/reimbursement-claims/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "ReimbursementClaim.status == SUBMITTED"
          - "certification.status == CURRENT at decision time (business_temporal re-check)"
          - "calc_reimbursement_cap(nurse, fiscal_year, claimed_amount_cents) > 0 (per-nurse FY ceiling not exhausted)"
          - "approving ProgramAdmin X-User-ID != claiming nurse id (segregation of duties)"
        side_effects:
          - "sets approved_amount_cents = calc_reimbursement_cap result"
          - "recomputes BudgetLine.committed_cents for the claiming nurse's home_unit (cascade)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /clinical-ladder/reimbursement-claims/{id}/deny"
        actor: ProgramAdmin
        preconditions:
          - "ReimbursementClaim.status == SUBMITTED"
          - "denial_reason provided"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /clinical-ladder/reimbursement-claims/{id}/pay"
        actor: PayrollOfficer
        preconditions:
          - "ReimbursementClaim.status == APPROVED"
          - "BudgetLine for (nurse.home_unit, claim.fiscal_year) exists and actuals-based guard holds: (sum of PAID claim approved_amount_cents in this fiscal year for this unit) + (sum of PAID bonus bonus_amount_cents accrued in this fiscal year for this unit) + approved_amount_cents of this claim <= BudgetLine.allocated_cents"
        side_effects:
          - "recomputes BudgetLine.committed_cents (paid claims leave the committed pool)"

  - entity: CertificationBonus
    initial_state: ACCRUED
    terminal_states: [PAID, CLAWED_BACK]
    transitions:
      - from: ACCRUED
        to: PAID
        trigger: "POST /clinical-ladder/certification-bonuses/{id}/pay"
        actor: PayrollOfficer
        preconditions:
          - "CertificationBonus.status == ACCRUED"
          - "parent Certification.status == CURRENT"
          - "BudgetLine for (nurse.home_unit, current fiscal year) exists and actuals-based guard holds: (unit FY PAID claims) + (unit FY PAID bonuses) + this bonus_amount_cents <= BudgetLine.allocated_cents"
        side_effects:
          - "recomputes BudgetLine.committed_cents"
      - from: ACCRUED
        to: CLAWED_BACK
        trigger: "POST /clinical-ladder/certification-bonuses/{id}/claw-back or Certification revoke cascade"
        actor: ProgramAdmin
        preconditions:
          - "CertificationBonus.status in {ACCRUED, PAID}"
          - "clawback_reason provided when invoked directly"
        side_effects:
          - "recomputes BudgetLine.committed_cents"
        note: "PAID -> CLAWED_BACK is a revert edge making this machine branching-with-revert."
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /clinical-ladder/certification-bonuses/{id}/claw-back or Certification revoke cascade"
        actor: ProgramAdmin
        preconditions:
          - "CertificationBonus.status == PAID"
          - "bonus paid_at within trailing 12 months OR parent Certification revoked"
        side_effects:
          - "recomputes BudgetLine.committed_cents"
          - "recomputes Nurse.retention_risk_score (clawback raises risk)"

  - entity: AnniversaryReview
    initial_state: OPEN
    terminal_states: [SUSTAIN, DEMOTE, LAPSE]
    transitions:
      - from: OPEN
        to: SUSTAIN
        trigger: "POST /clinical-ladder/anniversary-reviews/{id}/close with outcome=SUSTAIN"
        actor: ProgramAdmin
        preconditions:
          - "AnniversaryReview.status == OPEN"
          - "calc_maintenance_score(nurse, review_year) >= MAINTENANCE_THRESHOLD (60)"
        side_effects:
          - "sets maintenance_score"
          - "extends Nurse differential (differential_activated_at anniversary rolls forward one year)"
      - from: OPEN
        to: DEMOTE
        trigger: "POST /clinical-ladder/anniversary-reviews/{id}/close with outcome=DEMOTE"
        actor: ProgramAdmin
        preconditions:
          - "AnniversaryReview.status == OPEN"
          - "resolution_reason provided"
        side_effects:
          - "sets maintenance_score"
          - "Nurse.current_level drops one rung (CN_IV->CN_III, CN_III->CN_II, CN_II->CN_I; CN_I demotion is rejected at validation with ERR_CANNOT_DEMOTE_FLOOR)"
          - "Nurse.differential_status := SUSPENDED (parallel dimension: pay halts while level recomputes)"
          - "recomputes Nurse.retention_risk_score (demotion is the largest single increment)"
          - "recomputes BudgetLine.committed_cents for home_unit (demoted differential is lower)"
      - from: OPEN
        to: LAPSE
        trigger: "system sweep POST /clinical-ladder/_ops/run_cycle when review remains OPEN past review_year-12-31"
        actor: system
        preconditions:
          - "AnniversaryReview.status == OPEN"
        side_effects:
          - "Nurse.differential_status := TERMINATED (failure to complete review kills pay entirely, distinct from DEMOTE's SUSPENDED)"
          - "recomputes BudgetLine.committed_cents"
          - "recomputes Nurse.retention_risk_score"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version; serial-observable only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: application-decide-stale-version
    parent_entity: Application
    write_endpoint: "POST /clinical-ladder/applications/{id}/decide"
    occ_field: "expected_application_version"
    description: |
      Deciding an Application whose version has advanced since the deciding
      admin last observed it is rejected. This captures the case where another
      writer has just returned the application for revision (which legitimately
      mutates Application.status and review_cycle) and the current decider's
      view of the application is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: budget-line-update-stale-version
    parent_entity: BudgetLine
    write_endpoint: "PUT /clinical-ladder/budget-lines/{id}"
    occ_field: "expected_budget_line_version"
    description: |
      Updating a BudgetLine's allocation whose version has advanced since the
      client last observed it is rejected. This captures the case where a
      reimbursement approval cascade has just recomputed committed_cents on
      the same line and the current writer's allocation edit would be based on
      a stale committed baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: criterion-create-stale-nurse
    parent_entity: Nurse
    write_endpoint: "POST /clinical-ladder/applications"
    occ_field: "expected_nurse_version"
    description: |
      Creating an Application against a Nurse whose version has advanced since
      the applicant last observed their record is rejected. This captures the
      case where an anniversary demotion has just changed Nurse.current_level
      (legitimately superseding the level the applicant saw) and the new
      application's target_level arithmetic is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: calc_participation_window
    trigger: "Application submit (snapshot), application eligibility precheck"
    algorithm: aggregation
    formula: |
      window_start = clock.now - 24 months (same day-of-month; if the prior month
      lacks that day, clamp to last day of that month)
      eligible = ParticipationEvent where nurse_id == applicant
                 AND status == VERIFIED
                 AND window_start <= occurred_on < clock.now   # half-open
      result = sum(eligible.points)
    input_set: "ParticipationEvent rows of the nurse; PENDING_VERIFICATION and VOIDED excluded; occurred_on at exactly clock.now excluded (half-open upper bound), occurred_on exactly at window_start included"
    constants:
      LOOKBACK_MONTHS: 24
    precision: "integer sum, no rounding"
    variants:
      - name: snapshot
        when: "frozen onto Application.participation_snapshot_points at submit"
        difference: "uses the submit-time clock position; later verification of pending events does NOT retroactively raise the snapshot"
      - name: live
        when: "eligibility precheck at submit time before freezing"
        difference: "identical formula evaluated at the current clock position; divergence between snapshot and live is itself observable when events verify between submit and decision"

  - name: calc_committee_score
    trigger: "last ReviewAssignment reaches SCORED (bubble up), and again at decide (re-validation)"
    algorithm: weighted_scoring
    formula: |
      weights = { leadership: 0.30, clinical_expertise: 0.30,
                  professional_development: 0.20, outcomes: 0.20 }
      per_reviewer = sum(dim * weights[dim] for dim in weights)   # 0..100 float
      aggregate = round_half_up( sum(per_reviewer over SCORED assignments) / count(SCORED) )  # integer 0..100; round HALF-UP to nearest integer, exactly once at the final step
      # Boundary: aggregate >= criterion.min_portfolio_score passes (inclusive)
    input_set: "ReviewAssignment rows where application_id matches AND status == SCORED; RECUSED and EXPIRED excluded"
    constants:
      QUORUM: 3
      W_LEADERSHIP: 0.30
      W_CLINICAL: 0.30
      W_PROFDEV: 0.20
      W_OUTCOMES: 0.20
    precision: "per-reviewer kept at full float precision; final aggregate rounded half-up to integer exactly once (no per-reviewer pre-rounding)"
    variants: []

  - name: calc_reimbursement_cap
    trigger: "ReimbursementClaim approve"
    algorithm: threshold
    formula: |
      fy_ceiling = NURSE_FY_REIMBURSEMENT_CAP_CENTS
      already = sum(approved_amount_cents of ReimbursementClaim where
                    certification.nurse_id == this nurse AND fiscal_year == claim.fiscal_year
                    AND status IN {APPROVED, PAID})
      remaining = fy_ceiling - already
      result = max(0, min(claimed_amount_cents, remaining))
      # Boundary: remaining == 0 -> approve rejected (ERR_REIMBURSEMENT_CAP_EXHAUSTED);
      # claimed == remaining exactly -> full approval, result == claimed (inclusive boundary)
    input_set: "Claims on certifications of the same nurse in the same July-anchored fiscal year; DENIED claims excluded"
    constants:
      NURSE_FY_REIMBURSEMENT_CAP_CENTS: 150000
    precision: "integer cents, exact"
    variants: []

  - name: calc_certification_bonus
    trigger: "Certification creation (status CURRENT) -> bonus accrual"
    algorithm: tiered_pricing
    formula: |
      base = { BASIC: 50000, SPECIALTY: 100000, ADVANCED: 175000 }[track]
      multiplier = 1.5 if certification.renewal_of_id is null (first-time) else 1.0 (renewal)
      tenure_bonus = 25000 if nurse.tenure_years >= 10 else 0
      result = round_half_up(base * multiplier) + tenure_bonus
      # Rounding order pinned: round the multiplied base FIRST to integer cents, THEN add tenure_bonus
    input_set: "single Certification row + its holder Nurse row"
    constants:
      BONUS_BASIC_CENTS: 50000
      BONUS_SPECIALTY_CENTS: 100000
      BONUS_ADVANCED_CENTS: 175000
      TENURE_BONUS_CENTS: 25000
      TENURE_BONUS_YEARS: 10
    precision: "integer cents; round_half_up applied to (base * multiplier) before adding tenure_bonus"
    variants: []

  - name: calc_maintenance_score
    trigger: "AnniversaryReview close (any outcome); also drives system SUSTAIN precheck"
    algorithm: combinatorial
    formula: |
      # Level requirement resolution (pinned): requirement(nurse) = required_certification_track of the
      # active LadderCriterion whose target_level == nurse.current_level; if no such criterion exists
      # (always the case for CN_I, whose rung has no admission criterion), requirement = NONE.
      # Track order: NONE < BASIC < SPECIALTY < ADVANCED.
      participation_component = min(40, calc_participation_window.live * 2)          # 20 pts -> saturates
      certification_component = 40 if nurse holds >=1 CURRENT cert with track >= requirement(nurse)
                                else (20 if nurse holds >=1 CURRENT cert with track == BASIC else 0)
      tenure_component = min(20, nurse.tenure_years * 2)                              # 10 years -> saturates
      score = participation_component + certification_component + tenure_component    # 0..100
      # Non-linear interaction: certification_component is conditional on a level-keyed lookup,
      # participation_component saturates via nested min, tenure_component saturates via nested min.
      # Boundary: score >= MAINTENANCE_THRESHOLD (60) -> SUSTAIN eligible; 59 fails (strict inclusive-at-60).
    input_set: "Nurse + ParticipationEvent (VERIFIED, 24-month window at review close) + Certification (CURRENT) + hire_date tenure"
    constants:
      MAINTENANCE_THRESHOLD: 60
      PARTICIPATION_CAP: 40
      TENURE_CAP: 20
    precision: "integer components, integer sum"
    variants: []

  - name: calc_budget_forecast
    trigger: "BudgetLine recompute on every financial mutation; ops-run fiscal-year close flips variant"
    algorithm: dual_variant
    formula: |
      months_remaining = number of calendar months left in the fiscal year including the current month
      active_diff_annual = sum over nurses in unit with differential_status == ACTIVE of
                           criterion.differential_monthly_cents keyed by nurse.current_level
      committed_one_time = sum(approved-unpaid reimbursement) + sum(ACCRUED bonuses)
      # --- PROVISIONAL (forward_looking) ---
      provisional = committed_cents + active_diff_annual * (months_remaining / 12)
                  + pending_pipeline where pending_pipeline =
                    sum over SUBMITTED claims of claimed_amount_cents * PIPELINE_YIELD
      # --- FINAL (chronological) ---
      final = committed_cents + actuals_paid where actuals_paid =
              sum(PAID reimbursements + PAID bonuses with paid date inside the fiscal year)
      # The two variants diverge for identical inputs: provisional includes pipeline yield and
      # forward differential projection; final counts only actuals. Order of evaluation pinned:
      # compute committed_cents first, then add the variant-specific term.
    input_set: "BudgetLine.unit nurses, their differentials, claims and bonuses; fiscal year window [Jul 1, Jun 30]"
    constants:
      PIPELINE_YIELD: 0.80
    precision: "2 decimals intermediate for the months_remaining fraction; final round_half_up to integer cents"
    variants:
      - name: provisional
        when: "fiscal year open (BudgetLine.forecast_variant == PROVISIONAL)"
        difference: "adds months_remaining-prorated differential projection and 0.80-weighted SUBMITTED-claim pipeline"
      - name: final
        when: "fiscal year closed by ops-run sweep (forecast_variant := FINAL)"
        difference: "excludes pipeline entirely; adds only actually-PAID one-time amounts within the fiscal year"

  - name: calc_budget_commitment
    trigger: "every mutation to differential status, claim approval/payment, bonus accrual/payment/clawback"
    algorithm: aggregation
    formula: |
      active_diff_annual = sum over nurses in unit with differential_status == ACTIVE of
                           criterion(differential_monthly_cents keyed by nurse.current_level)
      unpaid_claims = sum(approved_amount_cents where claim.status == APPROVED and claim.fiscal_year == line.fiscal_year)
      accrued_bonuses = sum(bonus_amount_cents where bonus.status == ACCRUED and bonus created within fiscal year)
      committed_cents = active_diff_annual + unpaid_claims + accrued_bonuses
    input_set: "per-unit; PAID claims/bonuses and CLAWED_BACK/TERMINATED items excluded"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: calc_retention_risk
    trigger: "advancement, denial, demotion, lapse, clawback, certification lapse, participation verification"
    algorithm: decay_function
    formula: |
      # Step-decay with event bumps; evaluation order pinned: decay first, then add event bumps, then clamp.
      days_since_last_advancement = (clock.now - coalesce(last advancement decision date, nurse.hire_date)) in days
      decayed_base = max(0, previous_score - floor(days_since_last_advancement / 365) * DECAY_PER_YEAR)
      bumps = 15 * demotions_trailing_24m + 10 * certification_lapses_trailing_24m
            + 8 * application_denials_trailing_24m + 5 * bonus_clawbacks_trailing_24m
            - 6 * verified_participation_events_trailing_12m - 20 * advancements_trailing_24m
      score = clamp(decayed_base + bumps, 0, 100)
      # Pinned: certification_lapses counts only CURRENT->LAPSED sweep transitions; a REVOKED
      # certification does NOT add the lapse bump (its risk impact flows through the clawback term).
      # demotions counts AnniversaryReview closed DEMOTE; application_denials counts decisions DENY;
      # advancements counts decisions APPROVE; bonus_clawbacks counts CertificationBonus -> CLAWED_BACK.
      # Trailing windows: [clock.now - N months, clock.now) half-open, ordered by event timestamp ASC
      # with created_at ASC tie-break for identical timestamps (never id).
    input_set: "Nurse's own AdvancementDecision outcomes, Certification lapses, CertificationBonus clawbacks, ParticipationEvent verifications within trailing windows"
    constants:
      DECAY_PER_YEAR: 10
      CAP_MAX: 100
      CAP_MIN: 0
    precision: "integer score"
    variants: []

  - name: calc_retention_rollup
    trigger: "RetentionSnapshot capture during ops-run sweep"
    algorithm: aggregation
    formula: |
      population = Nurse rows where home_unit == unit (or all when unit == "ALL")
      headcount_by_level[L] = count(population with current_level == L) for L in {CN_I..CN_IV}
      avg_retention_risk_score = round_half_up(mean(retention_risk_score over population), 2)
      demotions_12m = count(AnniversaryReview closed DEMOTE with decided/closed date in [now-12m, now))
      demotion_rate = if headcount == 0 then 0.0000
                      else round_half_up(demotions_12m / headcount, 4)
      # Zero-denominator rule pinned: empty population yields 0.0000, not an error
    input_set: "all Nurse rows in scope; closed AnniversaryReview rows in trailing 12 months"
    constants: {}
    precision: "avg score 2 decimals round_half_up; demotion_rate 4 decimals round_half_up"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-referenced resource exists (validated left-to-right: application before assignment, certification before claim)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 5
    category: state
    check: "OCC expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clinical-ladder/applications, POST /clinical-ladder/applications/{id}/decide, PUT /clinical-ladder/budget-lines/{id}"
  - priority: 6
    category: business_referential
    check: "Ownership: entity-backed actor id matches the resource's owner FK (Nurse acts only on own applications/events/certifications; reviewer acts only on own assignments)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "Nurse-scoped action endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: application decider is not a scored reviewer on the same application; claim approver is not the claiming nurse; reviewer is not the applicant"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "decide, approve, assignment creation endpoints"
  - priority: 8
    category: business_constraint
    check: "Application target_level is exactly one rung above nurse.current_level; skip-rung and same-rung applications rejected"
    error_id: ERR_LADDER_RUNG_VIOLATION
    http_status: 422
    applies_to: "POST /clinical-ladder/applications"
  - priority: 9
    category: business_temporal
    check: "An active LadderCriterion exists covering the target level at the current clock position ([effective_from, effective_until) half-open; null until = open-ended)"
    error_id: ERR_NO_ACTIVE_CRITERION
    http_status: 422
    applies_to: "POST /clinical-ladder/applications, POST /clinical-ladder/applications/{id}/submit"
  - priority: 10
    category: business_temporal
    check: "Overlapping LadderCriterion validity windows for the same target_level rejected ([effective_from, effective_until) geometric overlap; adjacency a.until == b.from is NOT overlap)"
    error_id: ERR_CRITERION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /clinical-ladder/ladder-criteria"
  - priority: 11
    category: business_constraint
    check: "Differential amounts strictly increase with level across active criteria: CN_IV > CN_III > CN_II differential_monthly_cents among currently-active sets"
    error_id: ERR_DIFFERENTIAL_MONOTONICITY
    http_status: 422
    applies_to: "POST /clinical-ladder/ladder-criteria"
  - priority: 12
    category: business_constraint
    check: "Reviewer assignment quorum not exceeded: count of PENDING+SCORED assignments on application < QUORUM before creating another (unless replacing a RECUSED/EXPIRED one)"
    error_id: ERR_QUORUM_EXCEEDED
    http_status: 422
    applies_to: "POST /clinical-ladder/applications/{id}/assignments"
  - priority: 13
    category: business_constraint
    check: "Reviewer duplicate: no second PENDING/SCORED assignment for the same (application, reviewer) pair"
    error_id: ERR_DUPLICATE_REVIEWER
    http_status: 409
    applies_to: "POST /clinical-ladder/applications/{id}/assignments"
  - priority: 14
    category: business_temporal
    check: "Review scoring within REVIEW_WINDOW_DAYS (14) of assignment creation; late scoring rejected (assignment swept to EXPIRED)"
    error_id: ERR_REVIEW_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /clinical-ladder/review-assignments/{id}/score"
  - priority: 15
    category: business_constraint
    check: "Participation points within [1,40]; COMMITTEE_SEAT kind additionally capped at 20"
    error_id: ERR_PARTICIPATION_POINTS_RANGE
    http_status: 422
    applies_to: "POST /clinical-ladder/participation-events"
  - priority: 16
    category: business_temporal
    check: "Certification expires_on strictly greater than obtained_on"
    error_id: ERR_CERTIFICATION_DATE_ORDER
    http_status: 422
    applies_to: "POST /clinical-ladder/certifications"
  - priority: 17
    category: business_referential
    check: "Certification renewal_of_id, when provided, resolves to a certification of the same nurse and same track"
    error_id: ERR_RENEWAL_MISMATCH
    http_status: 422
    applies_to: "POST /clinical-ladder/certifications"
  - priority: 18
    category: business_temporal
    check: "Same-track currency overlap: a nurse may not hold two CURRENT certifications of the same track whose [obtained_on, expires_on) intervals overlap; renewal via renewal_of_id is permitted only when the renewed certification is already LAPSED or its expires_on <= the new obtained_on (adjacent expiry == new start is NOT overlap)"
    error_id: ERR_CERTIFICATION_OVERLAP
    http_status: 409
    applies_to: "POST /clinical-ladder/certifications"
  - priority: 19
    category: business_constraint
    check: "Reimbursement claim amount positive and not exceeding certification.exam_fee_cents minus amounts already approved-or-paid against the same certification"
    error_id: ERR_CLAIM_EXCEEDS_FEE
    http_status: 422
    applies_to: "POST /clinical-ladder/reimbursement-claims"
  - priority: 20
    category: business_fiscal
    check: "Per-nurse fiscal-year reimbursement ceiling: calc_reimbursement_cap > 0 at approval time (cap exhausted => reject)"
    error_id: ERR_REIMBURSEMENT_CAP_EXHAUSTED
    http_status: 402
    applies_to: "POST /clinical-ladder/reimbursement-claims/{id}/approve"
  - priority: 21
    category: business_fiscal
    check: "Unit budget guard at payment: (unit fiscal-year PAID claims + PAID bonuses + amount being paid) <= BudgetLine.allocated_cents; a missing BudgetLine for the unit/FY also fails this guard"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /clinical-ladder/reimbursement-claims/{id}/pay, POST /clinical-ladder/certification-bonuses/{id}/pay"
  - priority: 22
    category: business_constraint
    check: "Anniversary demotion cannot drop CN_I further (floor); such close-with-DEMOTE rejected"
    error_id: ERR_CANNOT_DEMOTE_FLOOR
    http_status: 422
    applies_to: "POST /clinical-ladder/anniversary-reviews/{id}/close"
  - priority: 23
    category: business_constraint
    check: "SUSTAIN requires calc_maintenance_score >= MAINTENANCE_THRESHOLD (60, inclusive)"
    error_id: ERR_MAINTENANCE_SCORE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /clinical-ladder/anniversary-reviews/{id}/close"
  - priority: 24
    category: business_constraint
    check: "Application review_cycle cap: return-for-revision allowed only while review_cycle < 3"
    error_id: ERR_REVIEW_CYCLE_EXHAUSTED
    http_status: 422
    applies_to: "POST /clinical-ladder/applications/{id}/return-for-revision"
  - priority: 25
    category: business_temporal
    check: "Decide re-validation: pinned criterion still unmodified since submission (LadderCriterion.version unchanged) and certification still CURRENT"
    error_id: ERR_STALE_REFERENCE
    http_status: 409
    applies_to: "POST /clinical-ladder/applications/{id}/decide, POST /clinical-ladder/reimbursement-claims/{id}/approve"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Nurses ---
  - method: POST
    path: /clinical-ladder/nurses
    description: Register a nurse in the program
    roles: [ProgramAdmin]
    code: 201
    input: [employee_code, full_name, hire_date, home_unit]
    output: Nurse
    side_effects: [initializes current_level=CN_I, differential_status=INACTIVE, retention_risk_score=0]
  - method: GET
    path: /clinical-ladder/nurses
    description: List nurses with pagination and optional filters
    roles: [ProgramAdmin, PayrollOfficer, RetentionAnalyst]
    code: 200
    input: ["home_unit?", "current_level?", "differential_status?", "limit?", "offset?"]
    output: Nurse[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/nurses/{id}
    description: Fetch one nurse including computed fields
    roles: [ProgramAdmin, PayrollOfficer, RetentionAnalyst, Nurse]
    code: 200
    input: []
    output: Nurse
    side_effects: []
  - method: GET
    path: /clinical-ladder/nurses/{id}/participation-events
    description: Reverse-reachability list of a nurse's participation events
    roles: [ProgramAdmin, Nurse, RetentionAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ParticipationEvent[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/nurses/{id}/certifications
    description: Reverse-reachability list of a nurse's certifications
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/nurses/{id}/applications
    description: Reverse-reachability list of a nurse's applications
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/nurses/{id}/anniversary-reviews
    description: Reverse-reachability list of a nurse's anniversary reviews
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: AnniversaryReview[]
    side_effects: []

  # --- Ladder criteria ---
  - method: POST
    path: /clinical-ladder/ladder-criteria
    description: Publish a criterion set for a target level with a validity window
    roles: [ProgramAdmin]
    code: 201
    input: [target_level, min_portfolio_score, min_participation_points, required_certification_track, differential_monthly_cents, effective_from, effective_until]
    output: LadderCriterion
    side_effects: [validates window overlap and differential monotonicity]
  - method: GET
    path: /clinical-ladder/ladder-criteria
    description: List criterion sets
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: ["target_level?", "limit?", "offset?"]
    output: LadderCriterion[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/ladder-criteria/{id}
    description: Fetch one criterion set
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: []
    output: LadderCriterion
    side_effects: []

  # --- Participation events ---
  - method: POST
    path: /clinical-ladder/participation-events
    description: Nurse logs a participation event (enters PENDING_VERIFICATION)
    roles: [Nurse]
    code: 201
    input: [nurse_id, event_kind, points, occurred_on]
    output: ParticipationEvent
    side_effects: []
  - method: GET
    path: /clinical-ladder/participation-events
    description: Filtered list across nurses (multi-FK collapse form)
    roles: [ProgramAdmin, RetentionAnalyst]
    code: 200
    input: ["nurse_id?", "event_kind?", "status?", "limit?", "offset?"]
    output: ParticipationEvent[]
    side_effects: []
  - method: POST
    path: /clinical-ladder/participation-events/{id}/verify
    description: Admin verifies a pending event
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ParticipationEvent
    side_effects: [recomputes nurse retention_risk_score]
  - method: POST
    path: /clinical-ladder/participation-events/{id}/void
    description: Admin voids a pending event
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ParticipationEvent
    side_effects: []

  # --- Certifications, claims, bonuses ---
  - method: POST
    path: /clinical-ladder/certifications
    description: Register an earned certification; accrues a CertificationBonus as side effect
    roles: [ProgramAdmin]
    code: 201
    input: [nurse_id, track, certifying_body, exam_fee_cents, obtained_on, expires_on, "renewal_of_id?"]
    output: Certification
    side_effects: [creates CertificationBonus ACCRUED via calc_certification_bonus, recomputes BudgetLine.committed_cents]
  - method: GET
    path: /clinical-ladder/certifications
    description: Filtered list of certifications (multi-FK collapse form)
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: ["nurse_id?", "renewal_of_id?", "track?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/certifications/{id}
    description: Fetch one certification
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: GET
    path: /clinical-ladder/certifications/{id}/reimbursement-claims
    description: Reverse-reachability list of claims on a certification
    roles: [ProgramAdmin, PayrollOfficer, Nurse]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/certifications/{id}/certification-bonuses
    description: Reverse-reachability list of bonuses on a certification
    roles: [ProgramAdmin, PayrollOfficer, Nurse]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CertificationBonus[]
    side_effects: []
  - method: POST
    path: /clinical-ladder/certifications/{id}/revoke
    description: Revoke a current certification; claws back bonuses paid within 12 months
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: [clawback cascade on CertificationBonus, BudgetLine recompute, retention risk recompute]

  - method: POST
    path: /clinical-ladder/reimbursement-claims
    description: Nurse files an exam-fee reimbursement claim
    roles: [Nurse]
    code: 201
    input: [certification_id, claimed_amount_cents]
    output: ReimbursementClaim
    side_effects: [computes fiscal_year from logical clock]
  - method: GET
    path: /clinical-ladder/reimbursement-claims/{id}
    description: Fetch one claim
    roles: [ProgramAdmin, PayrollOfficer, Nurse]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []
  - method: POST
    path: /clinical-ladder/reimbursement-claims/{id}/approve
    description: Approve claim under per-nurse FY cap; sets approved_amount_cents
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: [runs calc_reimbursement_cap, recomputes BudgetLine.committed_cents]
  - method: POST
    path: /clinical-ladder/reimbursement-claims/{id}/deny
    description: Deny a claim with reason
    roles: [ProgramAdmin]
    code: 200
    input: [denial_reason]
    output: ReimbursementClaim
    side_effects: []
  - method: POST
    path: /clinical-ladder/reimbursement-claims/{id}/pay
    description: Payroll disburses an approved claim under the unit budget guard
    roles: [PayrollOfficer]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: [recomputes BudgetLine.committed_cents]

  - method: POST
    path: /clinical-ladder/certification-bonuses/{id}/pay
    description: Payroll pays an accrued bonus under the unit budget guard
    roles: [PayrollOfficer]
    code: 200
    input: []
    output: CertificationBonus
    side_effects: [recomputes BudgetLine.committed_cents]
  - method: POST
    path: /clinical-ladder/certification-bonuses/{id}/claw-back
    description: Admin claws back an accrued or paid bonus
    roles: [ProgramAdmin]
    code: 200
    input: [clawback_reason]
    output: CertificationBonus
    side_effects: [recomputes BudgetLine.committed_cents and nurse retention_risk_score]

  # --- Applications and review ---
  - method: POST
    path: /clinical-ladder/applications
    description: Nurse drafts a ladder application (OCC on Nurse.version)
    roles: [Nurse]
    code: 201
    input: [nurse_id, target_level, portfolio_narrative, expected_nurse_version]
    output: Application
    side_effects: [increments Nurse.version by 1]
  - method: GET
    path: /clinical-ladder/applications
    description: Filtered list of applications (multi-FK collapse form)
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: ["nurse_id?", "criterion_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/applications/{id}
    description: Fetch one application
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: /clinical-ladder/applications/{id}/submit
    description: Submit a draft/returned application; pins criterion and participation snapshot
    roles: [Nurse]
    code: 200
    input: []
    output: Application
    side_effects: [pins criterion_id, freezes participation_snapshot_points, sets submitted_at]
  - method: POST
    path: /clinical-ladder/applications/{id}/withdraw
    description: Applicant withdraws from DRAFT or SUBMITTED
    roles: [Nurse]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: /clinical-ladder/applications/{id}/assignments
    description: Admin assigns a committee reviewer (first assignment moves app to IN_REVIEW)
    roles: [ProgramAdmin]
    code: 201
    input: [reviewer_nurse_id]
    output: ReviewAssignment
    side_effects: [application SUBMITTED -> IN_REVIEW on first assignment]
  - method: GET
    path: /clinical-ladder/applications/{id}/assignments
    description: Reverse-reachability list of an application's review assignments
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReviewAssignment[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/applications/{id}/decisions
    description: Reverse-reachability list of an application's append-only decisions
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: ["limit?", "offset?"]
    output: AdvancementDecision[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/review-assignments
    description: Filtered list of review assignments (multi-FK collapse form; reviewer-scoped reverse reachability)
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: ["application_id?", "reviewer_nurse_id?", "status?", "limit?", "offset?"]
    output: ReviewAssignment[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/review-assignments/{id}
    description: Fetch one review assignment
    roles: [ProgramAdmin, Nurse]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []
  - method: POST
    path: /clinical-ladder/review-assignments/{id}/score
    description: Assigned reviewer submits four-dimension scores
    roles: [Nurse]
    code: 200
    input: [dimension_scores]
    output: ReviewAssignment
    side_effects: [on quorum completion, computes Application.aggregate_score via calc_committee_score]
  - method: POST
    path: /clinical-ladder/review-assignments/{id}/recuse
    description: Assigned reviewer recuses themselves
    roles: [Nurse]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []
  - method: POST
    path: /clinical-ladder/applications/{id}/return-for-revision
    description: Admin returns an in-review application; expires pending assignments; cycles to DRAFT
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Application
    side_effects: [cascades EXPIRED onto PENDING assignments, increments review_cycle, auto-transitions to DRAFT]
  - method: POST
    path: /clinical-ladder/applications/{id}/decide
    description: Admin renders APPROVE/DENY decision (OCC on Application.version); APPROVE activates differential
    roles: [ProgramAdmin]
    code: 200
    input: [outcome, expected_application_version]
    output: Application
    side_effects: [creates AdvancementDecision, mutates Nurse level/differential, recomputes budget commitment and retention risk, increments Application.version by 1]

  # --- Anniversary reviews ---
  - method: POST
    path: /clinical-ladder/anniversary-reviews
    description: Admin opens an anniversary maintenance review for a nurse
    roles: [ProgramAdmin]
    code: 201
    input: [nurse_id, review_year]
    output: AnniversaryReview
    side_effects: []
  - method: POST
    path: /clinical-ladder/anniversary-reviews/{id}/close
    description: Close a review with SUSTAIN or DEMOTE; DEMOTE triggers the demotion cascade
    roles: [ProgramAdmin]
    code: 200
    input: [outcome, "resolution_reason?"]
    output: AnniversaryReview
    side_effects: [computes maintenance_score; on DEMOTE drops nurse level, suspends differential, recomputes budget and risk]

  # --- Budget & retention analytics ---
  - method: POST
    path: /clinical-ladder/budget-lines
    description: Create a unit fiscal-year budget line
    roles: [ProgramAdmin]
    code: 201
    input: [unit, fiscal_year, allocated_cents]
    output: BudgetLine
    side_effects: [initializes committed_cents and forecast_cents via calc_budget_commitment/forecast]
  - method: GET
    path: /clinical-ladder/budget-lines
    description: List budget lines
    roles: [ProgramAdmin, PayrollOfficer]
    code: 200
    input: ["unit?", "fiscal_year?", "limit?", "offset?"]
    output: BudgetLine[]
    side_effects: []
  - method: GET
    path: /clinical-ladder/budget-lines/{id}
    description: Fetch one budget line with current forecast
    roles: [ProgramAdmin, PayrollOfficer]
    code: 200
    input: []
    output: BudgetLine
    side_effects: []
  - method: PUT
    path: /clinical-ladder/budget-lines/{id}
    description: Update allocation (OCC on BudgetLine.version)
    roles: [ProgramAdmin]
    code: 200
    input: [allocated_cents, expected_budget_line_version]
    output: BudgetLine
    side_effects: [increments BudgetLine.version by 1, recomputes forecast_cents]
  - method: GET
    path: /clinical-ladder/retention-snapshots
    description: List captured retention snapshots
    roles: [RetentionAnalyst, ProgramAdmin]
    code: 200
    input: ["unit?", "limit?", "offset?"]
    output: RetentionSnapshot[]
    side_effects: []

  # --- Test-driving / ops endpoints ---
  - method: POST
    path: /clinical-ladder/_clock/set_current_utc
    description: "Set the logical clock. Default at server start is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: []
  - method: POST
    path: /clinical-ladder/_ops/run_cycle
    description: "Ops-run sweep at the current logical clock: lapses expired certifications, expires stale review assignments, lapses overdue anniversary reviews, closes fiscal-year budget lines (forecast_variant := FINAL), captures RetentionSnapshot rows"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ swept_certifications: integer, expired_assignments: integer, lapsed_reviews: integer, closed_budget_lines: integer, snapshots_captured: integer }"
    side_effects: [runs all time-driven transitions and snapshot capture]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted to invoke the endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing or malformed (wrong type, bad enum value)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state from which the requested transition exists"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent entity's current version"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Entity-backed actor id does not match the resource owner FK"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Same person attempted two segregated steps (decider was a scored reviewer; approver is the claimant; reviewer is the applicant)"
  - id: ERR_LADDER_RUNG_VIOLATION
    http: 422
    condition: "Application target level is not exactly one rung above nurse's current level"
  - id: ERR_NO_ACTIVE_CRITERION
    http: 422
    condition: "No active LadderCriterion covers the target level at the current clock position"
  - id: ERR_CRITERION_WINDOW_OVERLAP
    http: 409
    condition: "New criterion's validity window overlaps an existing criterion for the same target level (half-open adjacency excluded)"
  - id: ERR_DIFFERENTIAL_MONOTONICITY
    http: 422
    condition: "Differential amounts across active criteria violate CN_IV > CN_III > CN_II"
  - id: ERR_QUORUM_EXCEEDED
    http: 422
    condition: "Assignment would exceed quorum of non-terminal reviewers on the application"
  - id: ERR_DUPLICATE_REVIEWER
    http: 409
    condition: "Reviewer already holds a PENDING or SCORED assignment on this application"
  - id: ERR_REVIEW_WINDOW_EXPIRED
    http: 422
    condition: "Score submitted after the 14-day review window"
  - id: ERR_PARTICIPATION_POINTS_RANGE
    http: 422
    condition: "Points outside [1,40] or COMMITTEE_SEAT above 20"
  - id: ERR_CERTIFICATION_DATE_ORDER
    http: 422
    condition: "expires_on not strictly greater than obtained_on"
  - id: ERR_RENEWAL_MISMATCH
    http: 422
    condition: "renewal_of_id resolves to a different nurse or different track"
  - id: ERR_CERTIFICATION_OVERLAP
    http: 409
    condition: "Nurse would hold two CURRENT same-track certifications with overlapping [obtained_on, expires_on) intervals"
  - id: ERR_CLAIM_EXCEEDS_FEE
    http: 422
    condition: "Claimed amount exceeds exam fee remaining on the certification"
  - id: ERR_REIMBURSEMENT_CAP_EXHAUSTED
    http: 402
    condition: "Per-nurse fiscal-year reimbursement ceiling reached"
  - id: ERR_BUDGET_EXCEEDED
    http: 402
    condition: "Unit budget guard fails at payment time"
  - id: ERR_CANNOT_DEMOTE_FLOOR
    http: 422
    condition: "Demotion requested for a CN_I nurse"
  - id: ERR_MAINTENANCE_SCORE_INSUFFICIENT
    http: 422
    condition: "SUSTAIN requested but maintenance score below threshold"
  - id: ERR_REVIEW_CYCLE_EXHAUSTED
    http: 422
    condition: "Return-for-revision requested when review_cycle already 3"
  - id: ERR_STALE_REFERENCE
    http: 409
    condition: "Pinned criterion modified since submission, or certification no longer CURRENT at decision time"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Nurse
    description: "A program participant; acts on own applications, participation events, certifications, and claims; also serves as committee reviewer on others' applications"
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /clinical-ladder/participation-events"
      - "POST /clinical-ladder/applications"
      - "POST /clinical-ladder/applications/{id}/submit"
      - "POST /clinical-ladder/applications/{id}/withdraw"
      - "POST /clinical-ladder/review-assignments/{id}/score"
      - "POST /clinical-ladder/review-assignments/{id}/recuse"
      - "POST /clinical-ladder/reimbursement-claims"
    shared_operations:
      - "GET /clinical-ladder/nurses/{id}"
      - "GET sub-resources and filtered lists for own data"
      - "GET /clinical-ladder/ladder-criteria*"
  - name: ProgramAdmin
    description: "Nursing professional-development administrator; runs criteria, verification, assignments, decisions, reviews, certifications, budget lines, and ops sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /clinical-ladder/nurses"
      - "POST /clinical-ladder/ladder-criteria"
      - "POST /clinical-ladder/participation-events/{id}/verify"
      - "POST /clinical-ladder/participation-events/{id}/void"
      - "POST /clinical-ladder/certifications"
      - "POST /clinical-ladder/certifications/{id}/revoke"
      - "POST /clinical-ladder/reimbursement-claims/{id}/approve"
      - "POST /clinical-ladder/reimbursement-claims/{id}/deny"
      - "POST /clinical-ladder/certification-bonuses/{id}/claw-back"
      - "POST /clinical-ladder/applications/{id}/assignments"
      - "POST /clinical-ladder/applications/{id}/return-for-revision"
      - "POST /clinical-ladder/applications/{id}/decide"
      - "POST /clinical-ladder/anniversary-reviews"
      - "POST /clinical-ladder/anniversary-reviews/{id}/close"
      - "POST /clinical-ladder/budget-lines"
      - "PUT /clinical-ladder/budget-lines/{id}"
      - "POST /clinical-ladder/_clock/set_current_utc"
      - "POST /clinical-ladder/_ops/run_cycle"
    shared_operations:
      - "All GET endpoints"
  - name: PayrollOfficer
    description: "Disburses approved reimbursements and accrued bonuses under the unit budget guard"
    identity: opaque
    exclusive_operations:
      - "POST /clinical-ladder/reimbursement-claims/{id}/pay"
      - "POST /clinical-ladder/certification-bonuses/{id}/pay"
    shared_operations:
      - "GET /clinical-ladder/nurses*"
      - "GET /clinical-ladder/budget-lines*"
      - "GET claim/bonus detail endpoints"
  - name: RetentionAnalyst
    description: "Read-only analyst for retention snapshots and participation aggregates"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /clinical-ladder/retention-snapshots"
      - "GET /clinical-ladder/nurses*"
      - "GET /clinical-ladder/participation-events"
