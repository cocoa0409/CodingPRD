            - "after WAIVE, Invoice.${invA_id}.late_fee_cents == 0 and total_amount_cents == 39000"
            - "after WAIVE, Membership.${mem1_id}.balance_due_cents == 39000, exactly the pre-assessment value with zero drift"
            - "after WAIVE, Invoice.${invA_id}.status is still PAST_DUE and Membership.${mem1_id}.billing_status is still PAST_DUE"
