          Cyclic shape on TerminalAppointmentSlot (a different entity than
          Dispute): a booking drives OPEN -> FULL at booked_count == capacity;
          cancelling the booking oscillates the slot back FULL -> OPEN; a
          later release drives OPEN -> RELEASED (terminal) — the cycle is
