            - "RatingPresentation.${p2_id}.status is still SCHEDULED"
            - "RatingPresentation.${p1_id}.cancellation_reason is null"
            - "a second advance to 2026-08-03T13:00:00.000Z promotes ${p2_id} to HELD and leaves ${p1_id} HELD (no double promotion, no version churn beyond one increment each)"

      - name: activating_a_second_undertaking_supersedes_the_first
        claim_type: cross_entity
        grounds:
          - state_machines.ContinuingDisclosureUndertaking.ACTIVE_to_SUPERSEDED
          - endpoints[POST /bond-offerings/undertakings/{id}/activate]
        distinguishing_aspect: |
          Activating undertaking B mutates undertaking A, an entity whose id never appears in
