scaffold_corner_design:
  # =================================================================
  # Section: entities — creation, defaults, computed/system fields, not-found
  # =================================================================
  - section: entities
    instances:
      - name: patient_create_applies_common_fields_and_ignores_system_input
        claim_type: creation
        grounds: [entities.Patient]
        distinguishing_aspect: "POST /patients with all required fields returns 201 with server-minted id, version 1; a client-supplied id field is not accepted (not in input schema) and response id is a UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /charity-care/patients"
              payload: { full_name: "New Nate", date_of_birth: "1990-01-01", ssn_last4: "0001", mrn: "MRN-NEW-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
          assert:
            - "response has id (UUID), created_at, updated_at, version == 1"
            - "Patient.${pat}.contact_email == null (optional field omitted keeps default)"
      - name: account_create_computes_patient_responsibility
        claim_type: computed_fields
        grounds: [entities.PatientAccount.fields.patient_responsibility_cents]
        distinguishing_aspect: "patient_responsibility_cents is computed as total_charges - insurance_paid; any client attempt to set it is rejected as unknown field (not in input schema)."
        test_recipe:
          setup: ["patient exists"]
          setup_api_calls:
            - call: "POST /charity-care/patients"
              payload: { full_name: "Comp Carla", date_of_birth: "1980-02-02", ssn_last4: "0002", mrn: "MRN-COMP-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat}", encounter_date: "2026-01-10", total_charges_cents: 500000, insurance_paid_cents: 125000 }
              as: BillingAdministrator
              captures: { acc: $.data.id }
          assert:
            - "PatientAccount.${acc}.patient_responsibility_cents == 375000"
            - "PatientAccount.${acc}.adjusted_balance_cents == 375000 and effective_payments_cents == 0"
            - "PatientAccount.${acc}.collection_posture == NOT_IN_COLLECTIONS (initial state)"
            - "PatientAccount.${acc}.first_statement_at == null"
      - name: account_zero_responsibility_resolves_immediately
        claim_type: computed_fields
        grounds: [entities.PatientAccount.fields.collection_posture]
        distinguishing_aspect: "An account created with insurance covering all charges enters RESOLVED directly from creation (amount_outstanding_cents == 0)."
        test_recipe:
          setup: ["patient exists"]
          setup_api_calls:
            - call: "POST /charity-care/patients"
              payload: { full_name: "Zero Zack", date_of_birth: "1980-02-03", ssn_last4: "0003", mrn: "MRN-ZERO-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat}", encounter_date: "2026-01-10", total_charges_cents: 300000, insurance_paid_cents: 300000 }
              as: BillingAdministrator
              captures: { acc: $.data.id }
          assert:
            - "PatientAccount.${acc}.patient_responsibility_cents == 0"
            - "PatientAccount.${acc}.collection_posture == RESOLVED"
      - name: get_patient_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PATIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID yields ERR_PATIENT_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /charity-care/patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PATIENT_NOT_FOUND and http status 404"
      - name: application_create_duplicate_open_application_rejected
        claim_type: creation
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_OPEN_APPLICATION]"]
        distinguishing_aspect: "A second application for a patient who already has one in DRAFT is rejected with ERR_DUPLICATE_OPEN_APPLICATION."
        test_recipe:
          setup: ["patient with one DRAFT application"]
          setup_api_calls:
            - call: "POST /charity-care/patients"
              payload: { full_name: "Dup Dana", date_of_birth: "1991-01-01", ssn_last4: "0004", mrn: "MRN-DUP-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 1000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
          trigger:
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 1000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_OPEN_APPLICATION"
      - name: screening_second_run_rejected
        claim_type: creation
        grounds: ["validations[priority=12]", "errors[ERR_SCREENING_ALREADY_EXISTS]"]
        distinguishing_aspect: "PresumptiveScreening is 1:1 with its application; a second POST presumptive-screening fails with ERR_SCREENING_ALREADY_EXISTS."
        test_recipe:
          setup: ["ACTIVE policy; PRESUMPTIVE application UNDER_REVIEW with one completed screening"]
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2026", fpl_base_cents: 1500000, fpl_increment_cents: 500000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /charity-care/policies/${pol_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/patients"
              payload: { full_name: "Screen Sam", date_of_birth: "1992-01-01", ssn_last4: "0005", mrn: "MRN-SCR-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "PRESUMPTIVE", reported_annual_income_cents: 1000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "Screen Sam", relationship: "SELF", age: 34 }
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/begin-review"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/presumptive-screening"
              payload: { income_band_score: 80, payment_history_score: 80, utilization_score: 80 }
              as: FinancialCounselor
          trigger:
            - call: "POST /charity-care/applications/${app}/presumptive-screening"
              payload: { income_band_score: 10, payment_history_score: 10, utilization_score: 10 }
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SCREENING_ALREADY_EXISTS"
            - "the original screening's propensity_score == 80.00 remains unchanged"
      - name: household_member_added_and_counted
        claim_type: creation
        grounds: [entities.HouseholdMember, entities.AssistanceApplication.fields.household_size]
        distinguishing_aspect: "Each POST members increments household_size; SELF + SPOUSE + CHILD gives household_size == 3."
        test_recipe:
          setup: ["patient with DRAFT application"]
          setup_api_calls:
            - call: "POST /charity-care/patients"
              payload: { full_name: "House Helen", date_of_birth: "1985-01-01", ssn_last4: "0006", mrn: "MRN-HH-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 4000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
          trigger:
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "House Helen", relationship: "SELF", age: 41 }
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "Spouse Hank", relationship: "SPOUSE", age: 43 }
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "Child Hope", relationship: "CHILD", age: 9 }
              as: FinancialCounselor
            - call: "GET /charity-care/applications/${app}"
              as: FinancialCounselor
          assert:
            - "AssistanceApplication.${app}.household_size == 3"
      - name: immutable_household_member_has_no_update_endpoint
        claim_type: immutability
        grounds: [entities.HouseholdMember]
        distinguishing_aspect: "HouseholdMember has common_fields: false — no version/updated_at — and the API surface exposes no PATCH/PUT for it."
        test_recipe:
          setup: ["patient with DRAFT application and one member"]
          setup_api_calls:
            - call: "POST /charity-care/patients"
              payload: { full_name: "Immute Ivan", date_of_birth: "1985-02-01", ssn_last4: "0007", mrn: "MRN-IMM-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 1000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
          trigger:
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "Immute Ivan", relationship: "SELF", age: 41 }
              as: FinancialCounselor
              captures: { mem_id: $.data.id }
          assert:
            - "member response contains id and created_at but no version field"
            - "GET /charity-care/applications/${app}/members returns the member in a length-1 array"

  # =================================================================
  # Section: state_machines — valid/invalid transitions, terminal lockdown, initial state
  # =================================================================
  - section: state_machines
    instances:
      - name: submit_from_non_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AssistanceApplication, "errors[ERR_APPLICATION_NOT_DRAFT]"]
        distinguishing_aspect: "submit from SUBMITTED (already submitted) fails with ERR_APPLICATION_NOT_DRAFT."
        test_recipe:
          setup: ["ACTIVE policy; application already SUBMITTED"]
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2026", fpl_base_cents: 1500000, fpl_increment_cents: 500000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /charity-care/policies/${pol_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/patients"
              payload: { full_name: "State Stan", date_of_birth: "1986-01-01", ssn_last4: "0008", mrn: "MRN-ST-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 1000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "State Stan", relationship: "SELF", age: 40 }
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/submit"
              payload: {}
              as: FinancialCounselor
          trigger:
            - call: "POST /charity-care/applications/${app}/submit"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPLICATION_NOT_DRAFT"
      - name: begin_review_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AssistanceApplication, "errors[ERR_APPLICATION_NOT_SUBMITTED]"]
        distinguishing_aspect: "begin-review from DRAFT fails with ERR_APPLICATION_NOT_SUBMITTED."
        test_recipe:
          setup: ["patient with DRAFT application (no policy needed since submit never happens)"]
          setup_api_calls:
            - call: "POST /charity-care/patients"
              payload: { full_name: "Skip Sylvia", date_of_birth: "1986-02-01", ssn_last4: "0009", mrn: "MRN-SKIP-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 1000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
          trigger:
            - call: "POST /charity-care/applications/${app}/begin-review"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPLICATION_NOT_SUBMITTED"
      - name: withdraw_from_terminal_denied_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.AssistanceApplication, "errors[ERR_APPLICATION_TERMINAL]"]
        distinguishing_aspect: "A DENIED application is terminal: withdraw fails with ERR_APPLICATION_TERMINAL."
        test_recipe:
          setup: ["ACTIVE policy; application DENIED via INELIGIBLE determination (income 6000000 => 400.0000% > 300)"]
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2026", fpl_base_cents: 1500000, fpl_increment_cents: 500000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /charity-care/policies/${pol_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/patients"
              payload: { full_name: "Term Tina", date_of_birth: "1987-01-01", ssn_last4: "0010", mrn: "MRN-TERM-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat}", encounter_date: "2026-01-10", total_charges_cents: 100000, insurance_paid_cents: 0 }
              as: BillingAdministrator
              captures: { acc: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 6000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "Term Tina", relationship: "SELF", age: 39 }
              as: FinancialCounselor
              captures: { mem: $.data.id }
            - call: "POST /charity-care/applications/${app}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/begin-review"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "TAX_RETURN", period_start: "2025-01-01", period_end: "2025-12-31", amount_cents: 6000000, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d1: $.data.id }
            - call: "POST /charity-care/documents/${d1}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "IDENTITY", period_start: "2026-01-01", period_end: "2026-01-01", amount_cents: 0, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d2: $.data.id }
            - call: "POST /charity-care/documents/${d2}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "GET /charity-care/applications/${app}"
              as: FinancialCounselor
              captures: { app_v: $.data.version }
            - call: "POST /charity-care/determinations"
              payload: { application_id: "${app}", basis: "VERIFIED_APPLICATION", covered_account_ids: ["${acc}"], expected_application_version: "${app_v}" }
              as: AssistanceReviewer
              captures: { det: $.data.id }
            - call: "POST /charity-care/determinations/${det}/finalize"
              payload: {}
              as: AssistanceReviewer
          trigger:
            - call: "POST /charity-care/applications/${app}/withdraw"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "AssistanceApplication.${app}.status == DENIED after INELIGIBLE finalize"
            - "withdraw on DENIED: error_id == ERR_APPLICATION_TERMINAL"
      - name: finalize_preliminary_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DiscountDetermination, "errors[ERR_DETERMINATION_NOT_PRELIMINARY]"]
        distinguishing_aspect: "Second finalize of an already-FINAL determination fails with ERR_DETERMINATION_NOT_PRELIMINARY (idempotency of the finalize trigger)."
        test_recipe:
          setup: ["ACTIVE policy; FINAL determination exists (TIER_FULL, income 2000000)"]
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
