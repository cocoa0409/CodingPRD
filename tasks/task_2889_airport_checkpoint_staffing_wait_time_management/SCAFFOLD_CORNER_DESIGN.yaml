      - name: checkpoint_suspension_cascades_down_to_open_lanes_and_assignments
        claim_type: cascade_down
        grounds:
          - state_machines.Checkpoint
          - state_machines.Lane
          - state_machines.LaneAssignment
        distinguishing_aspect: "Suspending the checkpoint pauses only lanes currently OPEN, flips only CHECKED_IN assignment rows to REASSIGN_PENDING, and must leave the break axis and the officer's committed_duty_minutes untouched — a cascade that is selective on state in three places at once."
        test_recipe:
          setup:
