  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_client_not_verified
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.Appointment.HELD_to_CANCELLED
        distinguishing_aspect: |
          Category pair state (priority 4, ERR_INVALID_STATE) vs business_safety
          (priority 5, ERR_CLIENT_NOT_VERIFIED): confirming a CANCELLED appointment
          whose client is ALSO still UNVERIFIED triggers both checks; the
          higher-priority ERR_INVALID_STATE wins, not ERR_CLIENT_NOT_VERIFIED.
        test_recipe:
          setup:
            - "One Artist; one Chair; one UNVERIFIED Client; one appointment cancelled while HELD (cancel needs no verification)."
            - "Confirming the now-CANCELLED appointment with the still-unverified client fails both the state check and the verified check."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "P5 Artist", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "P5 Chair", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair_id: $.data.id, chair_v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "P5 Client", email: "p5@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap_id: $.data.id, ap_v: $.data.version }
            - call: "POST /studio/appointments/${ap_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/appointments/${ap_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "trigger response HTTP status == 409"

      - name: confirm_verified_beats_waiver_missing
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Appointment.HELD_to_CONFIRMED
