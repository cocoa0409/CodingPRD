            - call: "POST /oversight/agreements"
              payload: { partner_id: "${pa_id}", kyc_owner: "BANK", dispute_owner: "BANK", marketing_owner: "BANK", oversight_rights_level: "STANDARD", audit_access_notice_days: 30, termination_triggers: ["VOLUNTARY"], monthly_growth_cap_pct: 20.00, concentration_cap_pct: 10.00, max_end_user_balance_cents: 100000, reserve_requirement_bps: 900, effective_date: "2026-08-01T00:00:00Z", expected_partner_version: "${pa_v_exec}" }
              as: ProgramOfficer
