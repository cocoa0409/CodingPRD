scaffold_corner_design:
  # =====================================================================
  # Section: entities — creation, defaults, required fields, types,
  # not-found, listing/pagination, computed-field protection
  # =====================================================================
  - section: entities
    instances:
      - name: subscriber_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Subscriber.fields.status, entities.Subscriber.fields.balance_due_cents]
        distinguishing_aspect: "Subscriber created without service_address gets system defaults: status ACTIVE, balances 0, service_address null, version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/subscribers"
              payload: { display_name: "D", email: "d@x.com" }
              as: ServiceRep
              captures: { sub_d: $.data.id, sub_d_status: $.data.status, sub_d_bal: $.data.balance_due_cents }
          trigger:
            - call: "GET /api/subscribers/${sub_d}"
              as: ServiceRep
          assert:
            - "Create response: status == ACTIVE, balance_due_cents == 0, unapplied_cash_cents == 0, service_address == null, version == 1"
            - "GET returns the same stored values"

      - name: subscriber_create_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Subscriber.fields.balance_due_cents]
        distinguishing_aspect: "Client-supplied computed fields (balance_due_cents: 999) are ignored — the server-derived 0 is stored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/subscribers"
              payload: { display_name: "CI", email: "ci2@x.com", balance_due_cents: 999 }
              as: ServiceRep
              captures: { ci_bal: $.data.balance_due_cents }
          assert:
            - "Response balance_due_cents == 0 — client input for a computed field is discarded"

      - name: subscription_plan_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.SubscriptionPlan.fields.base_weekly_rate_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required base_weekly_rate_cents fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/subscription-plans"
              payload: { name: "X", plan_type: "PRINT", issues_per_week: 7, min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { err_miss: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: subscription_plan_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.SubscriptionPlan.fields.plan_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "plan_type 'WEEKLY' is not in {PRINT, DIGITAL, BUNDLE} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/subscription-plans"
              payload: { name: "X", plan_type: "WEEKLY", issues_per_week: 7, base_weekly_rate_cents: 100, min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { err_enum: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: get_subscriber_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/subscribers/00000000-0000-4000-8000-000000000000"
              as: ServiceRep
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: subscriber_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /api/subscribers"]
        distinguishing_aspect: "List endpoint honors limit/offset and returns the fixed envelope pagination fields with correct total_count/has_more."
        test_recipe:
          setup: ["Three subscribers exist"]
          setup_api_calls:
            - { call: "POST /api/subscribers", payload: { display_name: "P1", email: "p1@x.com" }, as: ServiceRep }
            - { call: "POST /api/subscribers", payload: { display_name: "P2", email: "p2@x.com" }, as: ServiceRep }
            - { call: "POST /api/subscribers", payload: { display_name: "P3", email: "p3@x.com" }, as: ServiceRep }
          trigger:
            - call: "GET /api/subscribers"
              payload: { limit: 2, offset: 0 }
              as: ServiceRep
              captures: { pg1_total: $.data }
            - call: "GET /api/subscribers"
              payload: { limit: 2, offset: 2 }
              as: ServiceRep
          assert:
            - "Page 1: exactly 2 items, total_count == 3, has_more == true; envelope carries meta.api_request_id and response_type == array"
            - "Page 2 (offset 2): exactly 1 item, has_more == false"

  # =====================================================================
  # Section: state_machines — valid transitions, side effects, invalid
  # transitions, terminal lockdown, auto-transitions, compound bubble-up
  # =====================================================================
  - section: state_machines
    instances:
      - name: subscription_activation_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.Subscription.PENDING_START_to_ACTIVE]
        distinguishing_aspect: "Daily cycle activates a PENDING_START print subscription whose start_date == today: billing ACTIVE, delivery DELIVERING, first charge generated with due_date = period_start + 14."
        test_recipe:
          setup: ["Print subscription with start_date 2026-08-03 created while clock is 2026-08-03"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "ACT", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_act: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "A", email: "act@x.com", service_address: "1 Oak St" }, as: ServiceRep, captures: { sub_act: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_act}", plan_id: "${plan_act}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_act: $.data.id, subsc_act_pre: $.data.billing_status }
          trigger:
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_act}"
              as: ServiceRep
              captures: { subsc_act_b: $.data.billing_status, subsc_act_d: $.data.delivery_status }
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_act}" }
              as: ServiceRep
              captures: { act_ch_amt: "$.data[0].amount_cents", act_ch_due: "$.data[0].due_date" }
          assert:
            - "Before cycle: billing_status == PENDING_START (initial state)"
            - "After cycle: billing_status == ACTIVE and delivery_status == DELIVERING (print-capable)"
            - "First charge: amount_cents == 600, period_start == 2026-08-03, due_date == 2026-08-17 (TERMS_DAYS 14)"

      - name: save_offer_accept_rescues_cancel_pending
        claim_type: side_effect_execution
        grounds: [state_machines.Subscription.ACTIVE_to_CANCEL_PENDING, state_machines.SaveOffer.OFFERED_to_ACCEPTED]
        distinguishing_aspect: "Cancel from ACTIVE creates the default CANCEL_FLOW offer (0.25, 8 weeks, +7d expiry); accept flips the subscription back to ACTIVE and stamps the discount window."
        test_recipe:
          setup: ["ACTIVE print subscription since 2026-08-03"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "SO", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_so: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "SO", email: "so@x.com", service_address: "2 Oak St" }, as: ServiceRep, captures: { sub_so: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_so}", plan_id: "${plan_so}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_so: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_so}/cancel"
              payload: { reason: "too expensive" }
              as: ServiceRep
              captures: { subsc_so_cp: $.data.billing_status }
            - call: "GET /api/save-offers"
              payload: { subscription_id: "${subsc_so}" }
              as: ServiceRep
              captures: { offer_so: "$.data[0].id", offer_so_pct: "$.data[0].discount_pct", offer_so_exp: "$.data[0].expires_at" }
          trigger:
            - { call: "POST /api/save-offers/${offer_so}/accept", payload: {}, as: ServiceRep }
            - call: "GET /api/subscriptions/${subsc_so}"
              as: ServiceRep
              captures: { subsc_so_after: $.data.billing_status, subsc_so_disc: $.data.save_discount_pct, subsc_so_until: $.data.save_discount_until }
          assert:
            - "Cancel: billing_status == CANCEL_PENDING; auto offer OFFERED with discount_pct == 0.25, duration_weeks == 8, expires_at == 2026-08-10, origin == CANCEL_FLOW"
            - "Accept: offer ACCEPTED; subscription billing_status == ACTIVE; save_discount_pct == 0.25; save_discount_until == 2026-09-28"

      - name: save_offer_decline_churns_subscription
        claim_type: valid_transition
        grounds: [state_machines.SaveOffer.OFFERED_to_DECLINED, state_machines.Subscription.CANCEL_PENDING_to_CANCELLED]
        distinguishing_aspect: "Declining the cancel-flow offer completes the churn fork: offer DECLINED, subscription CANCELLED with delivery NOT_DELIVERED and ended_at set — the divergent branch from the accept fork."
        test_recipe:
          setup: ["ACTIVE print subscription since 2026-08-03, cancel requested (CANCEL_PENDING with OFFERED offer)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "SD", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_sd: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "SD", email: "sd@x.com", service_address: "3 Oak St" }, as: ServiceRep, captures: { sub_sd: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_sd}", plan_id: "${plan_sd}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_sd: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_sd}/cancel"
              payload: { reason: "moving" }
              as: ServiceRep
            - call: "GET /api/save-offers"
              payload: { subscription_id: "${subsc_sd}" }
              as: ServiceRep
              captures: { offer_sd: "$.data[0].id" }
          trigger:
            - call: "POST /api/save-offers/${offer_sd}/decline"
              payload: {}
              as: ServiceRep
              captures: { offer_sd_st: $.data.status }
            - call: "GET /api/subscriptions/${subsc_sd}"
              as: ServiceRep
              captures: { subsc_sd_b: $.data.billing_status, subsc_sd_d: $.data.delivery_status, subsc_sd_end: $.data.ended_at }
          assert:
            - "Offer status == DECLINED"
            - "Subscription: billing_status == CANCELLED, delivery_status == NOT_DELIVERED, ended_at == 2026-08-03"

      - name: save_offer_expiry_auto_cancels
        claim_type: valid_transition
        grounds: [state_machines.SaveOffer.OFFERED_to_EXPIRED, state_machines.Subscription.CANCEL_PENDING_to_CANCELLED]
        distinguishing_aspect: "System auto-transition: at expires_at (inclusive boundary, expires_at <= today) the daily cycle expires the OFFERED offer and churns the CANCEL_PENDING subscription without any user action."
        test_recipe:
          setup: ["CANCEL_PENDING subscription whose offer expires_at == 2026-08-10; clock advanced to exactly 2026-08-10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "SE", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_se: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "SE", email: "se@x.com" }, as: ServiceRep, captures: { sub_se: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_se}", plan_id: "${plan_se}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_se: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_se}/cancel"
              payload: { reason: "quit" }
              as: ServiceRep
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
          trigger:
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/save-offers"
              payload: { subscription_id: "${subsc_se}" }
              as: ServiceRep
              captures: { offer_se_st: "$.data[0].status" }
            - call: "GET /api/subscriptions/${subsc_se}"
              as: ServiceRep
              captures: { subsc_se_b: $.data.billing_status }
          assert:
            - "Offer status == EXPIRED at exactly expires_at (2026-08-10 <= today)"
            - "Subscription billing_status == CANCELLED (churn confirmed by expiry)"

      - name: plan_change_on_cancelled_subscription_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Subscription, "errors[ERR_SUBSCRIPTION_NOT_ACTIVE]"]
        distinguishing_aspect: "CANCELLED is terminal: a plan-change on a cancelled subscription is rejected with ERR_SUBSCRIPTION_NOT_ACTIVE even with a current OCC version."
        test_recipe:
          setup: ["Subscription CANCELLED via cancel + decline; two plans exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "TL1", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_tl1: $.data.id }
            - call: "POST /api/subscription-plans"
              payload: { name: "TL2", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 700, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_tl2: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "TL", email: "tl@x.com", service_address: "4 Oak St" }, as: ServiceRep, captures: { sub_tl: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_tl}", plan_id: "${plan_tl1}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_tl: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_tl}/cancel"
              payload: { reason: "quit" }
              as: ServiceRep
            - call: "GET /api/save-offers"
              payload: { subscription_id: "${subsc_tl}" }
              as: ServiceRep
              captures: { offer_tl: "$.data[0].id" }
            - { call: "POST /api/save-offers/${offer_tl}/decline", payload: {}, as: ServiceRep }
            - call: "GET /api/subscriptions/${subsc_tl}"
              as: ServiceRep
              captures: { subsc_tl_v: $.data.version }
          trigger:
            - call: "POST /api/subscriptions/${subsc_tl}/plan-change"
              payload: { new_plan_id: "${plan_tl2}", effective_date: "2026-08-17", expected_subscription_version: "${subsc_tl_v}" }
              as: ServiceRep
              captures: { err_tl: $.data.error_id }
          assert:
            - "error_id == ERR_SUBSCRIPTION_NOT_ACTIVE (409) — terminal lockdown despite correct version"

      - name: complaint_credit_after_deny_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DeliveryComplaint, "errors[ERR_COMPLAINT_NOT_OPEN]"]
        distinguishing_aspect: "From terminal DENIED, the credit transition is not in the transition list -> ERR_COMPLAINT_NOT_OPEN."
        test_recipe:
          setup: ["Print subscription ACTIVE since 2026-08-03; one complaint filed 2026-08-03 and DENIED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "CD", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_cd: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "CD", email: "cd@x.com", service_address: "5 Oak St" }, as: ServiceRep, captures: { sub_cd: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_cd}", plan_id: "${plan_cd}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_cd: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/complaints"
              payload: { subscription_id: "${subsc_cd}", service_date: "2026-08-03", complaint_type: "DAMAGED" }
              as: ServiceRep
              captures: { complaint_cd: $.data.id }
            - { call: "POST /api/complaints/${complaint_cd}/deny", payload: { reason: "photo shows delivery" }, as: ServiceRep }
          trigger:
            - call: "POST /api/complaints/${complaint_cd}/credit"
              payload: { amount_cents: 100 }
              as: ServiceRep
              captures: { err_cd: $.data.error_id }
          assert:
            - "error_id == ERR_COMPLAINT_NOT_OPEN (409); complaint remains DENIED; no CreditMemo created"

      - name: payment_reverse_requires_cleared_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Payment.CLEARED_to_REVERSED, "errors[ERR_PAYMENT_NOT_CLEARED]"]
        distinguishing_aspect: "Reverse on an INITIATED payment violates the CLEARED precondition -> ERR_PAYMENT_NOT_CLEARED."
        test_recipe:
          setup: ["One INITIATED payment"]
          setup_api_calls:
            - { call: "POST /api/subscribers", payload: { display_name: "PR", email: "pr@x.com" }, as: ServiceRep, captures: { sub_pr: $.data.id } }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_pr}", amount_cents: 500, method: "CARD" }
              as: ServiceRep
              captures: { pay_pr: $.data.id }
          trigger:
            - call: "POST /api/payments/${pay_pr}/reverse"
              payload: {}
              as: CirculationDirector
              captures: { err_pr: $.data.error_id }
          assert:
            - "error_id == ERR_PAYMENT_NOT_CLEARED (409); payment stays INITIATED"

      - name: subscriber_compound_bubble_to_lapsed_and_close
        claim_type: valid_transition
        grounds: [state_machines.Subscriber, state_machines.Subscription.SUSPENDED_to_LAPSED]
        distinguishing_aspect: "Compound shape: when the subscriber's only subscription lapses (aging > 45 days), the parent Subscriber bubbles ACTIVE -> LAPSED; close then succeeds only because written-off charges leave a settled ledger."
        test_recipe:
          setup: ["Subscription backdated to 2026-05-04; first charge due 2026-05-18 is 75 days past due at the default clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /api/subscription-plans"
              payload: { name: "BL", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_bl: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "BL", email: "bl@x.com" }, as: ServiceRep, captures: { sub_bl: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_bl}", plan_id: "${plan_bl}", start_date: "2026-05-04" }
              as: ServiceRep
              captures: { subsc_bl: $.data.id }
          trigger:
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_bl}"
              as: ServiceRep
              captures: { subsc_bl_b: $.data.billing_status }
            - call: "GET /api/subscribers/${sub_bl}"
              as: ServiceRep
              captures: { sub_bl_st: $.data.status, sub_bl_bal: $.data.balance_due_cents }
            - call: "POST /api/subscribers/${sub_bl}/close"
              payload: {}
              as: ServiceRep
              captures: { sub_bl_closed: $.data.status }
          assert:
            - "After cycle: subscription LAPSED; all its charges WRITTEN_OFF"
            - "Bubble-up: subscriber status == LAPSED, balance_due_cents == 0 (write-offs excluded from the aggregation)"
            - "Close succeeds: status == CLOSED"

      - name: hold_cancel_active_rejected
        claim_type: invalid_transition
        grounds: [state_machines.VacationHold.SCHEDULED_to_CANCELLED, "errors[ERR_HOLD_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancel is only listed from SCHEDULED; an ACTIVE hold rejects with ERR_HOLD_NOT_CANCELLABLE (early termination must use resume)."
        test_recipe:
          setup: ["ACTIVE print subscription; hold [2026-08-03, 2026-08-07) activated by the 2026-08-03 cycle"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "HC", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_hc: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "HC", email: "hc@x.com", service_address: "6 Oak St" }, as: ServiceRep, captures: { sub_hc: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_hc}", plan_id: "${plan_hc}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_hc: $.data.id }
            - call: "POST /api/subscriptions/${subsc_hc}/vacation-holds"
              payload: { start_date: "2026-08-03", end_date: "2026-08-07", resolution: "CREDIT" }
              as: ServiceRep
              captures: { hold_hc: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
          trigger:
            - call: "POST /api/vacation-holds/${hold_hc}/cancel"
              payload: {}
              as: ServiceRep
              captures: { err_hc: $.data.error_id }
          assert:
            - "error_id == ERR_HOLD_NOT_CANCELLABLE (409); hold remains ACTIVE"

      - name: rack_report_dispute_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.RackSalesReport.SUBMITTED_to_DISPUTED, state_machines.RackSalesReport.DISPUTED_to_SUBMITTED]
        excluded_because:
          difficulty_instance: "compensating_invariant / rack_copies_conservation_through_dispute_cycle"
          rationale: "The dispute -> correct -> resubmit cycle (including its state flips) is exercised by the named §1.8 instance."

  # =====================================================================
  # Section: calculations — correct results, ordering, input-set filtering,
  # constants, threshold boundaries
  # =====================================================================
  - section: calculations
    instances:
      - name: waterfall_allocation_oldest_due_first
        claim_type: correct_result
        grounds: [calculations.payment_waterfall_allocation, entities.Payment.fields.allocations]
        distinguishing_aspect: "Waterfall order is due_date ASC: a 700-cent clearing covers the oldest charge fully (600) and the newer one partially (100), recorded in allocation order."
        test_recipe:
          setup: ["Subscription ACTIVE since 2026-08-03; two unpaid 600-cent charges (due 2026-08-17 and 2026-08-24)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "WF", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_wf: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "WF", email: "wf@x.com" }, as: ServiceRep, captures: { sub_wf: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_wf}", plan_id: "${plan_wf}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_wf: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_wf}", amount_cents: 700, method: "CHECK" }
              as: ServiceRep
              captures: { pay_wf: $.data.id }
          trigger:
            - call: "POST /api/payments/${pay_wf}/mark-cleared"
              payload: {}
              as: ServiceRep
              captures: { wf_alloc: $.data.allocations }
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_wf}" }
              as: ServiceRep
              captures: { wf_ch1_st: "$.data[0].status", wf_ch2_st: "$.data[1].status", wf_ch2_paid: "$.data[1].paid_amount_cents" }
          assert:
            - "allocations == [{charge_id: <charge1>, amount_cents: 600}, {charge_id: <charge2>, amount_cents: 100}] in that order"
            - "charge1 status == PAID; charge2 status == PARTIALLY_PAID with paid_amount_cents == 100"

      - name: waterfall_overpayment_to_unapplied
        claim_type: correct_result
        grounds: [calculations.payment_waterfall_allocation, entities.Subscriber.fields.unapplied_cash_cents]
        distinguishing_aspect: "Overpayment: 1500 against 1200 of charges pays both fully and parks the 300 remainder in unapplied_cash_cents, driving balance_due_cents to -300."
        test_recipe:
          setup: ["Two unpaid 600-cent charges (balance 1200)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "OP", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_op: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "OP", email: "op@x.com" }, as: ServiceRep, captures: { sub_op: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_op}", plan_id: "${plan_op}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_op: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_op}", amount_cents: 1500, method: "CASH" }
              as: ServiceRep
              captures: { pay_op: $.data.id }
          trigger:
            - { call: "POST /api/payments/${pay_op}/mark-cleared", payload: {}, as: ServiceRep }
            - call: "GET /api/subscribers/${sub_op}"
              as: ServiceRep
              captures: { op_bal: $.data.balance_due_cents, op_unap: $.data.unapplied_cash_cents }
          assert:
            - "unapplied_cash_cents == 300"
            - "balance_due_cents == -300 (0 outstanding minus 300 unapplied)"

      - name: lapse_threshold_strictly_greater_boundaries
        claim_type: constants_applied
        grounds: [calculations.lapse_cycle_evaluation]
        distinguishing_aspect: "Lapse thresholds are strict (>): exactly 7 days past due stays ACTIVE, 8 flips GRACE; exactly 21 stays GRACE, 22 flips SUSPENDED; exactly 45 stays SUSPENDED, 46 flips LAPSED with write-off."
        test_recipe:
          setup: ["Subscription started 2026-07-06; first charge due 2026-07-20; nothing ever paid"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-06T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "LT", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_lt: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "LT", email: "lt@x.com" }, as: ServiceRep, captures: { sub_lt: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_lt}", plan_id: "${plan_lt}", start_date: "2026-07-06" }
              as: ServiceRep
              captures: { subsc_lt: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-27T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_lt}"
              as: ServiceRep
              captures: { lt_d7: $.data.billing_status }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-28T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_lt}"
              as: ServiceRep
              captures: { lt_d8: $.data.billing_status }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_lt}"
              as: ServiceRep
              captures: { lt_d21: $.data.billing_status }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_lt}"
              as: ServiceRep
              captures: { lt_d22: $.data.billing_status }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_lt}"
              as: ServiceRep
              captures: { lt_d45: $.data.billing_status }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_lt}"
              as: ServiceRep
              captures: { lt_d46: $.data.billing_status }
          assert:
            - "7 days past due (2026-07-27): ACTIVE; 8 days (2026-07-28): GRACE"
            - "21 days (2026-08-10): still GRACE; 22 days (2026-08-11): SUSPENDED"
            - "45 days (2026-09-03): still SUSPENDED; 46 days (2026-09-04): LAPSED and charges WRITTEN_OFF"

      - name: settlement_held_days_reduce_delivered_copies
        claim_type: input_set_filtering
        grounds: [calculations.carrier_settlement]
        distinguishing_aspect: "Held delivery days are excluded from delivered_copies: a 2-day hold inside the week reduces a full-week assignment from 7 to 5 copies (gross 250, bonus 13 = round_half_up(12.5), net 263)."
        test_recipe:
          setup:
            - "NET carrier (rate 50) with one route; subscription ACTIVE since 2026-07-27 with a full open assignment"
            - "CREDIT hold [2026-08-05, 2026-08-07) covers exactly 2 delivery days of the 2026-08-03 week"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-27T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "SH", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 700, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_sh: $.data.id }
            - call: "POST /api/carriers"
              payload: { display_name: "CH", compensation_model: "PER_COPY_NET_OF_COMPLAINTS", per_copy_rate_cents: 50 }
              as: DistrictManager
              captures: { car_sh: $.data.id }
            - call: "POST /api/routes"
              payload: { route_code: "RSH", carrier_id: "${car_sh}", max_stops: 10 }
              as: DistrictManager
              captures: { route_sh: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "SH", email: "sh@x.com", service_address: "7 Oak St" }, as: ServiceRep, captures: { sub_sh: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_sh}", plan_id: "${plan_sh}", start_date: "2026-07-27" }
              as: ServiceRep
              captures: { subsc_sh: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_sh}", route_id: "${route_sh}", start_date: "2026-07-27" }
              as: DistrictManager
            - call: "POST /api/subscriptions/${subsc_sh}/vacation-holds"
              payload: { start_date: "2026-08-05", end_date: "2026-08-07", resolution: "CREDIT" }
              as: ServiceRep
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
          trigger:
            - call: "GET /api/carriers/${car_sh}/settlement"
              payload: { week_start_date: "2026-08-03" }
              as: DistrictManager
              captures: { sh_copies: $.data.delivered_copies, sh_gross: $.data.gross_cents, sh_bonus: $.data.bonus_cents, sh_net: $.data.net_cents }
          assert:
            - "delivered_copies == 5 (7 overlap days minus 2 held days)"
            - "gross_cents == 250; bonus_cents == 13 (round_half_up(250 * 0.05) = 13, 0 complaints <= 2); deduction_cents == 0; net_cents == 263"

      - name: audit_totals_status_filtering
        claim_type: input_set_filtering
        grounds: [calculations.audit_circulation_totals]
        distinguishing_aspect: "Paid-circulation input set excludes SUSPENDED and CANCELLED: of four subscriptions (ACTIVE print, SUSPENDED print, GRACE digital, CANCELLED bundle) only the ACTIVE print and GRACE digital count -> paid_print 1, paid_digital 1."
        test_recipe:
          setup:
            - "sub1: PRINT, kept paid and ACTIVE through 2026-09-08; sub2: PRINT, never paid -> SUSPENDED on 2026-09-08"
            - "sub3: DIGITAL started 2026-08-17, 8 days past due -> GRACE on 2026-09-08; sub4: BUNDLE cancelled (declined save) back on 2026-08-03"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "AP", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_ap: $.data.id }
            - call: "POST /api/subscription-plans"
              payload: { name: "AD", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 400, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_ad: $.data.id }
            - call: "POST /api/subscription-plans"
              payload: { name: "AB", plan_type: "BUNDLE", issues_per_week: 7, base_weekly_rate_cents: 900, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_ab: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "S1", email: "s1@x.com", service_address: "1 Elm St" }, as: ServiceRep, captures: { sub_a1: $.data.id } }
            - { call: "POST /api/subscribers", payload: { display_name: "S2", email: "s2@x.com", service_address: "2 Elm St" }, as: ServiceRep, captures: { sub_a2: $.data.id } }
            - { call: "POST /api/subscribers", payload: { display_name: "S3", email: "s3@x.com" }, as: ServiceRep, captures: { sub_a3: $.data.id } }
            - { call: "POST /api/subscribers", payload: { display_name: "S4", email: "s4@x.com", service_address: "4 Elm St" }, as: ServiceRep, captures: { sub_a4: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_a1}", plan_id: "${plan_ap}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_a1: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_a2}", plan_id: "${plan_ap}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_a2: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_a4}", plan_id: "${plan_ab}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_a4: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_a4}/cancel"
              payload: { reason: "quit" }
              as: ServiceRep
            - call: "GET /api/save-offers"
              payload: { subscription_id: "${subsc_a4}" }
              as: ServiceRep
              captures: { offer_a4: "$.data[0].id" }
            - { call: "POST /api/save-offers/${offer_a4}/decline", payload: {}, as: ServiceRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_a3}", plan_id: "${plan_ad}", start_date: "2026-08-17" }
              as: ServiceRep
              captures: { subsc_a3: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_a1}", amount_cents: 3000, method: "CARD" }
              as: ServiceRep
              captures: { pay_a1: $.data.id }
            - { call: "POST /api/payments/${pay_a1}/mark-cleared", payload: {}, as: ServiceRep }
          trigger:
            - call: "POST /api/audit-reports"
              payload: { period_start: "2026-08-01", period_end: "2026-09-30" }
              as: CirculationDirector
              captures: { aud_s_print: $.data.paid_print_subscribers, aud_s_dig: $.data.paid_digital_subscribers, aud_s_sc: $.data.single_copy_copies }
          assert:
            - "paid_print_subscribers == 1 (only the ACTIVE print sub; SUSPENDED print and CANCELLED bundle excluded)"
            - "paid_digital_subscribers == 1 (the GRACE digital sub counts as paid; bundle sub is CANCELLED)"
            - "single_copy_copies == 0 (no RECONCILED rack reports in period)"

      - name: proration_variant_correctness
        claim_type: variant_divergence
        grounds: [calculations.vacation_proration_credit]
        excluded_because:
          difficulty_instance: "dual_variant_calc / proration_per_day_vs_per_issue_divergence"
          rationale: "Both variants computed and asserted there."

      - name: settlement_variant_correctness
        claim_type: variant_divergence
        grounds: [calculations.carrier_settlement]
        excluded_because:
          difficulty_instance: "dual_variant_calc / carrier_settlement_gross_vs_net_divergence"
          rationale: "Both compensation variants computed and asserted there."

  # =====================================================================
  # Section: validations — violation->error, priority ordering, temporal,
  # aggregate, conditional, cross-entity
  # =====================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected at priority 1 before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/subscribers"
              payload: { display_name: "NA", email: "na@x.com" }
              captures: { err_na: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"

      - name: not_own_resource_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_OWN_RESOURCE]"]
        distinguishing_aspect: "A Subscriber-role caller reading another subscriber's subscription is rejected ERR_NOT_OWN_RESOURCE (403) — ownership compares X-User-ID to the resource's subscriber chain."
        test_recipe:
          setup: ["Two subscribers; a subscription belonging to the first"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "OW", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 400, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_ow: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "O1", email: "o1@x.com" }, as: ServiceRep, captures: { sub_o1: $.data.id } }
            - { call: "POST /api/subscribers", payload: { display_name: "O2", email: "o2@x.com" }, as: ServiceRep, captures: { sub_o2: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_o1}", plan_id: "${plan_ow}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_ow: $.data.id }
          trigger:
            - call: "GET /api/subscriptions/${subsc_ow}"
              as: Subscriber
              as_user_id: "${sub_o2}"
              captures: { err_ow: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_OWN_RESOURCE, http 403"

      - name: complaint_credit_not_found_returns_404
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]"]
        distinguishing_aspect: "Existence (p4) precedes state (p6): crediting a non-existent complaint id returns ERR_NOT_FOUND, not ERR_COMPLAINT_NOT_OPEN."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/complaints/00000000-0000-4000-8000-000000000000/credit"
              payload: { amount_cents: 100 }
              as: ServiceRep
              captures: { err_cnf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: complaint_window_closed_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_COMPLAINT_WINDOW_CLOSED]"]
        distinguishing_aspect: "A complaint whose service_date is 8 days before today (outside the 7-day filing window) is rejected; service_date exactly 7 days ago is accepted."
        test_recipe:
          setup: ["Print subscription ACTIVE since 2026-08-03; clock at 2026-08-11"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "CW", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_cw: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "CW", email: "cw@x.com", service_address: "8 Oak St" }, as: ServiceRep, captures: { sub_cw: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_cw}", plan_id: "${plan_cw}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_cw: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: CirculationDirector }
          trigger:
            - call: "POST /api/complaints"
              payload: { subscription_id: "${subsc_cw}", service_date: "2026-08-03", complaint_type: "MISSED" }
              as: ServiceRep
              captures: { err_cw: $.data.error_id }
            - call: "POST /api/complaints"
              payload: { subscription_id: "${subsc_cw}", service_date: "2026-08-04", complaint_type: "MISSED" }
              as: ServiceRep
              captures: { ok_cw: $.data.id }
          assert:
            - "service_date 2026-08-03 (8 days back): error_id == ERR_COMPLAINT_WINDOW_CLOSED (409)"
            - "service_date 2026-08-04 (exactly 7 days back): created (201) — window is inclusive"

      - name: digital_only_plan_blocks_hold
        claim_type: conditional_validation
        grounds: ["validations[priority=9]", "errors[ERR_DIGITAL_ONLY_PLAN]"]
        distinguishing_aspect: "Conditional on plan config: a vacation hold on a DIGITAL (issues_per_week 0) subscription is rejected ERR_DIGITAL_ONLY_PLAN — delivery features do not exist for digital."
        test_recipe:
          setup: ["ACTIVE DIGITAL subscription since 2026-08-03"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "DG", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 400, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_dg: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "DG", email: "dg@x.com" }, as: ServiceRep, captures: { sub_dg: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_dg}", plan_id: "${plan_dg}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_dg: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
          trigger:
            - call: "POST /api/subscriptions/${subsc_dg}/vacation-holds"
              payload: { start_date: "2026-08-10", end_date: "2026-08-12", resolution: "CREDIT" }
              as: ServiceRep
              captures: { err_dg: $.data.error_id }
          assert:
            - "error_id == ERR_DIGITAL_ONLY_PLAN (409)"

      - name: service_address_required_for_print
        claim_type: cross_entity_validation
        grounds: ["validations[priority=9]", "errors[ERR_SERVICE_ADDRESS_REQUIRED]"]
        distinguishing_aspect: "Cross-entity referential fit: a print-capable plan requires the linked Subscriber's service_address; without it subscription creation fails ERR_SERVICE_ADDRESS_REQUIRED."
        test_recipe:
          setup: ["Subscriber with no service_address; ACTIVE PRINT plan"]
          setup_api_calls:
            - call: "POST /api/subscription-plans"
              payload: { name: "SA", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_sa: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "SA", email: "sa@x.com" }, as: ServiceRep, captures: { sub_sa: $.data.id } }
          trigger:
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_sa}", plan_id: "${plan_sa}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { err_sa: $.data.error_id }
          assert:
            - "error_id == ERR_SERVICE_ADDRESS_REQUIRED (409); no subscription persisted"

      - name: goodwill_monthly_cap_enforced
        claim_type: aggregate_validation
        grounds: [calculations.goodwill_cap_tracking, "errors[ERR_GOODWILL_CAP_EXCEEDED]"]
        distinguishing_aspect: "Aggregate validation: two 2000-cent goodwill credits succeed (4000 <= 5000); a third 2000-cent credit in the same calendar month pushes the aggregate over the cap -> ERR_GOODWILL_CAP_EXCEEDED."
        test_recipe:
          setup: ["One subscriber; clock inside a single calendar month (2026-08)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - { call: "POST /api/subscribers", payload: { display_name: "GC", email: "gc@x.com" }, as: ServiceRep, captures: { sub_gc: $.data.id } }
            - { call: "POST /api/credit-memos", payload: { subscriber_id: "${sub_gc}", amount_cents: 2000, reason: "g1" }, as: ServiceRep }
            - { call: "POST /api/credit-memos", payload: { subscriber_id: "${sub_gc}", amount_cents: 2000, reason: "g2" }, as: ServiceRep }
          trigger:
            - call: "POST /api/credit-memos"
              payload: { subscriber_id: "${sub_gc}", amount_cents: 2000, reason: "g3" }
              as: ServiceRep
              captures: { err_gc: $.data.error_id }
          assert:
            - "error_id == ERR_GOODWILL_CAP_EXCEEDED (409): 4000 + 2000 > MONTHLY_GOODWILL_CAP_CENTS 5000"

      - name: complaint_credit_cap_enforced
        claim_type: violation_to_error
        grounds: [calculations.goodwill_cap_tracking, "errors[ERR_CREDIT_EXCEEDS_COMPLAINT_CAP]"]
        distinguishing_aspect: "Per-credit cap: a complaint credit of 2500 exceeds COMPLAINT_CREDIT_CAP_CENTS 2000 -> ERR_CREDIT_EXCEEDS_COMPLAINT_CAP."
        test_recipe:
          setup: ["Print subscription ACTIVE since 2026-08-03 with an OPEN complaint for 2026-08-03"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "CC2", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_cc2: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "CC2", email: "cc2@x.com", service_address: "9 Oak St" }, as: ServiceRep, captures: { sub_cc2: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_cc2}", plan_id: "${plan_cc2}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_cc2: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/complaints"
              payload: { subscription_id: "${subsc_cc2}", service_date: "2026-08-03", complaint_type: "LATE" }
              as: ServiceRep
              captures: { complaint_cc2: $.data.id }
          trigger:
            - call: "POST /api/complaints/${complaint_cc2}/credit"
              payload: { amount_cents: 2500 }
              as: ServiceRep
              captures: { err_cc2: $.data.error_id }
          assert:
            - "error_id == ERR_CREDIT_EXCEEDS_COMPLAINT_CAP (409); complaint remains OPEN"

      - name: route_at_capacity_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=10]", "errors[ERR_ROUTE_AT_CAPACITY]", entities.DeliveryRoute.fields.assigned_stop_count]
        distinguishing_aspect: "Aggregate capacity: with max_stops 1 the first assignment succeeds (count 1), the second is rejected ERR_ROUTE_AT_CAPACITY (count >= max_stops)."
        test_recipe:
          setup: ["Route with max_stops 1; two ACTIVE print subscriptions"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "RC", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_rc: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "R1", email: "r1@x.com", service_address: "10 Oak St" }, as: ServiceRep, captures: { sub_rc1: $.data.id } }
            - { call: "POST /api/subscribers", payload: { display_name: "R2", email: "r2@x.com", service_address: "11 Oak St" }, as: ServiceRep, captures: { sub_rc2: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_rc1}", plan_id: "${plan_rc}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_rc1: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_rc2}", plan_id: "${plan_rc}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_rc2: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/routes"
              payload: { route_code: "RCAP", max_stops: 1 }
              as: DistrictManager
              captures: { route_rc: $.data.id }
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_rc1}", route_id: "${route_rc}", start_date: "2026-08-03" }
              as: DistrictManager
          trigger:
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_rc2}", route_id: "${route_rc}", start_date: "2026-08-03" }
              as: DistrictManager
              captures: { err_rc: $.data.error_id }
          assert:
            - "error_id == ERR_ROUTE_AT_CAPACITY (409); route assigned_stop_count stays 1"

      - name: assignment_into_inactive_route_rejected
        claim_type: violation_to_error
        grounds: [state_machines.DeliveryRoute.ACTIVE_to_INACTIVE, "errors[ERR_ROUTE_INACTIVE]"]
        distinguishing_aspect: "Assignments into an INACTIVE route are rejected ERR_ROUTE_INACTIVE; existing assignments survive deactivation."
        test_recipe:
          setup: ["Route created then deactivated; one ACTIVE print subscription"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "IR", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_ir: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "IR", email: "ir@x.com", service_address: "12 Oak St" }, as: ServiceRep, captures: { sub_ir: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_ir}", plan_id: "${plan_ir}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_ir: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/routes"
              payload: { route_code: "RIR", max_stops: 5 }
              as: DistrictManager
              captures: { route_ir: $.data.id }
            - call: "PATCH /api/routes/${route_ir}"
              payload: { status: "INACTIVE" }
              as: DistrictManager
          trigger:
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_ir}", route_id: "${route_ir}", start_date: "2026-08-03" }
              as: DistrictManager
              captures: { err_ir: $.data.error_id }
          assert:
            - "error_id == ERR_ROUTE_INACTIVE (409)"

      - name: audit_period_overlap_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_AUDIT_PERIOD_OVERLAP]"]
        distinguishing_aspect: "A new audit report whose period intersects an existing report's period is rejected ERR_AUDIT_PERIOD_OVERLAP."
        test_recipe:
          setup: ["Existing DRAFT audit report for [2026-08-01, 2026-08-31]"]
          setup_api_calls:
            - call: "POST /api/audit-reports"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31" }
              as: CirculationDirector
          trigger:
            - call: "POST /api/audit-reports"
              payload: { period_start: "2026-08-15", period_end: "2026-09-15" }
              as: CirculationDirector
              captures: { err_ao: $.data.error_id }
          assert:
            - "error_id == ERR_AUDIT_PERIOD_OVERLAP (409)"

      - name: report_week_conflict_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_REPORT_WEEK_CONFLICT]"]
        distinguishing_aspect: "One report per rack per Monday-anchored week: a second report for the same rack and week_start_date is rejected ERR_REPORT_WEEK_CONFLICT."
        test_recipe:
          setup: ["Rack with an existing report for week 2026-08-03"]
          setup_api_calls:
            - call: "POST /api/rack-locations"
              payload: { location_name: "WC", address: "3 Rt 9", price_per_copy_cents: 150 }
              as: DistrictManager
              captures: { rack_wc: $.data.id }
            - call: "POST /api/rack-sales-reports"
              payload: { rack_location_id: "${rack_wc}", week_start_date: "2026-08-03", copies_delivered: 20, copies_returned: 2 }
              as: DistrictManager
          trigger:
            - call: "POST /api/rack-sales-reports"
              payload: { rack_location_id: "${rack_wc}", week_start_date: "2026-08-03", copies_delivered: 30, copies_returned: 5 }
              as: DistrictManager
              captures: { err_wc: $.data.error_id }
          assert:
            - "error_id == ERR_REPORT_WEEK_CONFLICT (409)"

      - name: duplicate_complaint_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_COMPLAINT]"]
        distinguishing_aspect: "Uniqueness per (subscription, service_date) among non-DENIED complaints: the second filing for the same date is rejected ERR_DUPLICATE_COMPLAINT."
        test_recipe:
          setup: ["Print subscription ACTIVE since 2026-08-03 with an OPEN complaint for 2026-08-03"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "DC", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_dc: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "DC", email: "dc@x.com", service_address: "13 Oak St" }, as: ServiceRep, captures: { sub_dc: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_dc}", plan_id: "${plan_dc}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_dc: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/complaints"
              payload: { subscription_id: "${subsc_dc}", service_date: "2026-08-03", complaint_type: "MISSED" }
              as: ServiceRep
          trigger:
            - call: "POST /api/complaints"
              payload: { subscription_id: "${subsc_dc}", service_date: "2026-08-03", complaint_type: "LATE" }
              as: ServiceRep
              captures: { err_dc: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_COMPLAINT (409) — different complaint_type does not dodge the uniqueness rule"

  # =====================================================================
  # Section: endpoints — filtered lists, computed reads, batch summary
  # =====================================================================
  - section: endpoints
    instances:
      - name: billing_charges_filter_by_fk
        claim_type: computed_read
        grounds: ["endpoints.GET /api/billing-charges"]
        distinguishing_aspect: "Filtered list returns only the FK-matching rows: charges of subscription A are absent from subscription B's filtered list."
        test_recipe:
          setup: ["Two subscriptions on the same plan, each with one generated charge"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "FK", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_fk: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "FA", email: "fa@x.com" }, as: ServiceRep, captures: { sub_fa: $.data.id } }
            - { call: "POST /api/subscribers", payload: { display_name: "FB", email: "fb@x.com" }, as: ServiceRep, captures: { sub_fb: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_fa}", plan_id: "${plan_fk}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_fa: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_fb}", plan_id: "${plan_fk}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_fb: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
          trigger:
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_fa}" }
              as: ServiceRep
          assert:
            - "Filtered list for subscription A returns exactly 1 charge whose subscription_id == ${subsc_fa}; subscription B's charge is absent"

      - name: daily_cycle_output_summary
        claim_type: computed_read
        grounds: ["endpoints.POST /api/ops/run-daily-cycle"]
        distinguishing_aspect: "The batch endpoint returns its declared summary counts: one activation and one generated charge for the prepared state, zeros elsewhere."
        test_recipe:
          setup: ["One PENDING_START subscription with start_date == today (2026-08-01 default clock); nothing else in the system"]
          setup_api_calls:
            - call: "POST /api/subscription-plans"
              payload: { name: "CS", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 500, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_cs: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "CS", email: "cs@x.com" }, as: ServiceRep, captures: { sub_cs: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_cs}", plan_id: "${plan_cs}", start_date: "2026-08-01" }
              as: ServiceRep
              captures: { subsc_cs: $.data.id }
          trigger:
            - call: "POST /api/ops/run-daily-cycle"
              payload: {}
              as: CirculationDirector
              captures: { cs_acts: $.data.activated_subscriptions, cs_charges: $.data.charges_generated, cs_holds: $.data.holds_completed, cs_offers: $.data.offers_expired }
          assert:
            - "activated_subscriptions == 1 and charges_generated == 1"
            - "holds_completed == 0, offers_expired == 0, plan_changes_applied == 0"

      - name: settlement_empty_week_zeros
        claim_type: computed_read
        grounds: [calculations.carrier_settlement, "endpoints.GET /api/carriers/{id}/settlement"]
        distinguishing_aspect: "Empty input set: a carrier with no routes yields an all-zero settlement (bonus formula on gross 0 yields 0; no divide-by-empty behavior)."
        test_recipe:
          setup: ["One carrier, no routes"]
          setup_api_calls:
            - call: "POST /api/carriers"
              payload: { display_name: "EZ", compensation_model: "PER_COPY_GROSS", per_copy_rate_cents: 50 }
              as: DistrictManager
              captures: { car_ez: $.data.id }
          trigger:
            - call: "GET /api/carriers/${car_ez}/settlement"
              payload: { week_start_date: "2026-08-03" }
              as: DistrictManager
              captures: { ez_net: $.data.net_cents, ez_copies: $.data.delivered_copies }
          assert:
            - "delivered_copies == 0, complaint_count == 0, gross_cents == 0, bonus_cents == 0, deduction_cents == 0, net_cents == 0"

  # =====================================================================
  # Section: errors — triggerability sweep for codes not exercised above
  # =====================================================================
  - section: errors
    instances:
      - name: void_applied_credit_memo_rejected
        claim_type: violation_to_error
        grounds: [state_machines.CreditMemo.ISSUED_to_VOIDED, "errors[ERR_CREDIT_MEMO_LOCKED]"]
        distinguishing_aspect: "Void requires applied_cents == 0: a memo already auto-applied to an open charge is locked -> ERR_CREDIT_MEMO_LOCKED."
        test_recipe:
          setup: ["Subscriber with a 600-cent open charge; a 300-cent goodwill credit auto-applied at issuance"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "VM", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_vm: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "VM", email: "vm@x.com" }, as: ServiceRep, captures: { sub_vm: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_vm}", plan_id: "${plan_vm}", start_date: "2026-08-03" }
              as: ServiceRep
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/credit-memos"
              payload: { subscriber_id: "${sub_vm}", amount_cents: 300, reason: "goodwill" }
              as: ServiceRep
              captures: { cm_vm: $.data.id, cm_vm_applied: $.data.applied_cents }
          trigger:
            - call: "POST /api/credit-memos/${cm_vm}/void"
              payload: {}
              as: CirculationDirector
              captures: { err_vm: $.data.error_id }
          assert:
            - "Memo issued with applied_cents == 300 (auto-apply at issuance)"
            - "Void rejected: error_id == ERR_CREDIT_MEMO_LOCKED (409)"

      - name: reconcile_draft_report_rejected
        claim_type: violation_to_error
        grounds: [state_machines.RackSalesReport.SUBMITTED_to_RECONCILED, "errors[ERR_REPORT_NOT_RECONCILABLE]"]
        distinguishing_aspect: "Reconcile from DRAFT (skipping submit) violates the SUBMITTED precondition -> ERR_REPORT_NOT_RECONCILABLE."
        test_recipe:
          setup: ["One DRAFT rack report"]
          setup_api_calls:
            - call: "POST /api/rack-locations"
              payload: { location_name: "RD", address: "4 Rt 9", price_per_copy_cents: 150 }
              as: DistrictManager
              captures: { rack_rd: $.data.id }
            - call: "POST /api/rack-sales-reports"
              payload: { rack_location_id: "${rack_rd}", week_start_date: "2026-08-03", copies_delivered: 10, copies_returned: 1 }
              as: DistrictManager
              captures: { rep_rd: $.data.id }
          trigger:
            - call: "POST /api/rack-sales-reports/${rep_rd}/reconcile"
              payload: {}
              as: CirculationDirector
              captures: { err_rd: $.data.error_id }
          assert:
            - "error_id == ERR_REPORT_NOT_RECONCILABLE (409)"

      - name: submit_after_reconcile_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RackSalesReport.DRAFT_to_SUBMITTED, "errors[ERR_REPORT_NOT_SUBMITTABLE]"]
        distinguishing_aspect: "RECONCILED is terminal for the submit transition: re-submitting a reconciled report fails ERR_REPORT_NOT_SUBMITTABLE."
        test_recipe:
          setup: ["One RECONCILED rack report"]
          setup_api_calls:
            - call: "POST /api/rack-locations"
              payload: { location_name: "SR", address: "6 Rt 9", price_per_copy_cents: 150 }
              as: DistrictManager
              captures: { rack_sr: $.data.id }
            - call: "POST /api/rack-sales-reports"
              payload: { rack_location_id: "${rack_sr}", week_start_date: "2026-08-03", copies_delivered: 10, copies_returned: 1 }
              as: DistrictManager
              captures: { rep_sr: $.data.id }
            - { call: "POST /api/rack-sales-reports/${rep_sr}/submit", payload: {}, as: DistrictManager }
            - { call: "POST /api/rack-sales-reports/${rep_sr}/reconcile", payload: {}, as: CirculationDirector }
          trigger:
            - call: "POST /api/rack-sales-reports/${rep_sr}/submit"
              payload: {}
              as: DistrictManager
              captures: { err_sr: $.data.error_id }
          assert:
            - "error_id == ERR_REPORT_NOT_SUBMITTABLE (409)"

      - name: patch_submitted_report_rejected
        claim_type: invalid_transition
        grounds: ["endpoints.PATCH /api/rack-sales-reports/{id}", "errors[ERR_REPORT_NOT_EDITABLE]"]
        distinguishing_aspect: "Correction window: PATCH is editable only in DRAFT/DISPUTED; a SUBMITTED report rejects edits with ERR_REPORT_NOT_EDITABLE."
        test_recipe:
          setup: ["One SUBMITTED rack report"]
          setup_api_calls:
            - call: "POST /api/rack-locations"
              payload: { location_name: "PS", address: "7 Rt 9", price_per_copy_cents: 150 }
              as: DistrictManager
              captures: { rack_ps: $.data.id }
            - call: "POST /api/rack-sales-reports"
              payload: { rack_location_id: "${rack_ps}", week_start_date: "2026-08-03", copies_delivered: 10, copies_returned: 1 }
              as: DistrictManager
              captures: { rep_ps: $.data.id }
            - { call: "POST /api/rack-sales-reports/${rep_ps}/submit", payload: {}, as: DistrictManager }
          trigger:
            - call: "PATCH /api/rack-sales-reports/${rep_ps}"
              payload: { copies_returned: 3 }
              as: DistrictManager
              captures: { err_ps: $.data.error_id }
          assert:
            - "error_id == ERR_REPORT_NOT_EDITABLE (409); copies_returned stays 1"

      - name: certify_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AuditReport.DRAFT_to_CERTIFIED, "errors[ERR_AUDIT_NOT_DRAFT]"]
        distinguishing_aspect: "Certify requires DRAFT: re-certifying a CERTIFIED report fails ERR_AUDIT_NOT_DRAFT."
        test_recipe:
          setup: ["One CERTIFIED audit report (no in-period rack reports, so certification is unblocked)"]
          setup_api_calls:
            - call: "POST /api/audit-reports"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31" }
              as: CirculationDirector
              captures: { aud_ct: $.data.id }
            - { call: "POST /api/audit-reports/${aud_ct}/certify", payload: {}, as: CirculationDirector }
          trigger:
            - call: "POST /api/audit-reports/${aud_ct}/certify"
              payload: {}
              as: CirculationDirector
              captures: { err_ct: $.data.error_id }
          assert:
            - "error_id == ERR_AUDIT_NOT_DRAFT (409)"

      - name: submit_uncertified_audit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AuditReport.CERTIFIED_to_SUBMITTED, "errors[ERR_AUDIT_NOT_CERTIFIED]"]
        distinguishing_aspect: "Submit requires CERTIFIED: submitting a DRAFT report fails ERR_AUDIT_NOT_CERTIFIED — approval chain cannot skip a step."
        test_recipe:
          setup: ["One DRAFT audit report"]
          setup_api_calls:
            - call: "POST /api/audit-reports"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31" }
              as: CirculationDirector
              captures: { aud_su: $.data.id }
          trigger:
            - call: "POST /api/audit-reports/${aud_su}/submit"
              payload: {}
              as: CirculationDirector
              captures: { err_su: $.data.error_id }
          assert:
            - "error_id == ERR_AUDIT_NOT_CERTIFIED (409)"

      - name: write_off_paid_charge_rejected
        claim_type: violation_to_error
        grounds: [state_machines.BillingCharge.OPEN_to_WRITTEN_OFF, "errors[ERR_CHARGE_NOT_OPEN]"]
        distinguishing_aspect: "Write-off requires OPEN/PARTIALLY_PAID: a PAID charge rejects with ERR_CHARGE_NOT_OPEN."
        test_recipe:
          setup: ["Subscription with its first charge fully paid (PAID)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "WO", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_wo: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "WO", email: "wo@x.com" }, as: ServiceRep, captures: { sub_wo: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_wo}", plan_id: "${plan_wo}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_wo: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_wo}", amount_cents: 600, method: "CARD" }
              as: ServiceRep
              captures: { pay_wo: $.data.id }
            - { call: "POST /api/payments/${pay_wo}/mark-cleared", payload: {}, as: ServiceRep }
            - call: "GET /api/billing-charges"
              payload: { subscription_id: "${subsc_wo}" }
              as: ServiceRep
              captures: { ch_wo: "$.data[0].id" }
          trigger:
            - call: "POST /api/billing-charges/${ch_wo}/write-off"
              payload: {}
              as: CirculationDirector
              captures: { err_wo: $.data.error_id }
          assert:
            - "error_id == ERR_CHARGE_NOT_OPEN (409)"

      - name: double_mark_cleared_rejected
        claim_type: idempotency
        grounds: [state_machines.Payment.INITIATED_to_CLEARED, "errors[ERR_PAYMENT_NOT_INITIATED]"]
        distinguishing_aspect: "Non-idempotent trigger: the second mark-cleared on an already CLEARED payment fails ERR_PAYMENT_NOT_INITIATED instead of double-applying allocations."
        test_recipe:
          setup: ["One CLEARED payment"]
          setup_api_calls:
            - { call: "POST /api/subscribers", payload: { display_name: "DM", email: "dm@x.com" }, as: ServiceRep, captures: { sub_dm: $.data.id } }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_dm}", amount_cents: 500, method: "CARD" }
              as: ServiceRep
              captures: { pay_dm: $.data.id }
            - { call: "POST /api/payments/${pay_dm}/mark-cleared", payload: {}, as: ServiceRep }
          trigger:
            - call: "POST /api/payments/${pay_dm}/mark-cleared"
              payload: {}
              as: ServiceRep
              captures: { err_dm: $.data.error_id }
          assert:
            - "error_id == ERR_PAYMENT_NOT_INITIATED (409); allocations applied exactly once"

      - name: resume_scheduled_hold_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.VacationHold, "errors[ERR_HOLD_NOT_ACTIVE]"]
        distinguishing_aspect: "Resume requires ACTIVE: resuming a SCHEDULED (not yet started) hold fails ERR_HOLD_NOT_ACTIVE."
        test_recipe:
          setup: ["ACTIVE print subscription with a SCHEDULED hold starting 2026-08-10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "RS", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_rs: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "RS", email: "rs@x.com", service_address: "14 Oak St" }, as: ServiceRep, captures: { sub_rs: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_rs}", plan_id: "${plan_rs}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_rs: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/subscriptions/${subsc_rs}/vacation-holds"
              payload: { start_date: "2026-08-10", end_date: "2026-08-14", resolution: "CREDIT" }
              as: ServiceRep
              captures: { hold_rs: $.data.id }
          trigger:
            - call: "POST /api/vacation-holds/${hold_rs}/resume"
              payload: {}
              as: ServiceRep
              captures: { err_rs: $.data.error_id }
          assert:
            - "error_id == ERR_HOLD_NOT_ACTIVE (409); hold stays SCHEDULED"

      - name: end_ended_assignment_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RouteAssignment.ACTIVE_to_ENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Ending an already ENDED assignment is outside the transition list -> ERR_INVALID_STATE; the route's stop count is decremented exactly once."
        test_recipe:
          setup: ["One ENDED route assignment"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "EE", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_ee: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "EE", email: "ee@x.com", service_address: "15 Oak St" }, as: ServiceRep, captures: { sub_ee: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_ee}", plan_id: "${plan_ee}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_ee: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "POST /api/routes"
              payload: { route_code: "REE", max_stops: 5 }
              as: DistrictManager
              captures: { route_ee: $.data.id }
            - call: "POST /api/route-assignments"
              payload: { subscription_id: "${subsc_ee}", route_id: "${route_ee}", start_date: "2026-08-03" }
              as: DistrictManager
              captures: { asg_ee: $.data.id }
            - call: "POST /api/route-assignments/${asg_ee}/end"
              payload: { end_date: "2026-08-10" }
              as: DistrictManager
          trigger:
            - call: "POST /api/route-assignments/${asg_ee}/end"
              payload: { end_date: "2026-08-11" }
              as: DistrictManager
              captures: { err_ee: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); route assigned_stop_count == 0 (decremented once by the first end)"

  # =====================================================================
  # Section: rbac — allow/deny per role, hierarchical override
  # =====================================================================
  - section: rbac
    instances:
      - name: subscriber_cannot_create_subscription_plan
        claim_type: rbac_deny
        grounds: [roles.Subscriber, "validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Subscriber (entity-backed self-service role) is denied the Director-exclusive plan-creation endpoint with ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
          setup: ["One subscriber exists (identity for the caller)"]
          setup_api_calls:
            - { call: "POST /api/subscribers", payload: { display_name: "RB1", email: "rb1@x.com" }, as: ServiceRep, captures: { sub_rb1: $.data.id } }
          trigger:
            - call: "POST /api/subscription-plans"
              payload: { name: "NOPE", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 100, min_weekly_rate_cents: 0 }
              as: Subscriber
              as_user_id: "${sub_rb1}"
              captures: { err_rb1: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE, http 403"

      - name: service_rep_cannot_reverse_payment
        claim_type: rbac_deny
        grounds: [roles.ServiceRep, "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Payment reversal is Director-exclusive (financial override): ServiceRep is denied at priority 2 even though the payment is in the reversible CLEARED state."
        test_recipe:
          setup: ["One CLEARED payment"]
          setup_api_calls:
            - { call: "POST /api/subscribers", payload: { display_name: "RB2", email: "rb2@x.com" }, as: ServiceRep, captures: { sub_rb2: $.data.id } }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_rb2}", amount_cents: 500, method: "CARD" }
              as: ServiceRep
              captures: { pay_rb2: $.data.id }
            - { call: "POST /api/payments/${pay_rb2}/mark-cleared", payload: {}, as: ServiceRep }
          trigger:
            - call: "POST /api/payments/${pay_rb2}/reverse"
              payload: {}
              as: ServiceRep
              captures: { err_rb2: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403); payment stays CLEARED (role check precedes state mutation)"

      - name: district_manager_cannot_issue_goodwill_credit
        claim_type: rbac_deny
        grounds: [roles.DistrictManager, "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Peer-role isolation: DistrictManager owns distribution resources and is denied the ServiceRep-owned goodwill credit endpoint."
        test_recipe:
          setup: ["One subscriber"]
          setup_api_calls:
            - { call: "POST /api/subscribers", payload: { display_name: "RB3", email: "rb3@x.com" }, as: ServiceRep, captures: { sub_rb3: $.data.id } }
          trigger:
            - call: "POST /api/credit-memos"
              payload: { subscriber_id: "${sub_rb3}", amount_cents: 100, reason: "dm attempt" }
              as: DistrictManager
              captures: { err_rb3: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403)"

      - name: director_override_hierarchical_ops
        claim_type: rbac_allow
        grounds: [roles.CirculationDirector]
        distinguishing_aspect: "Hierarchical override: CirculationDirector successfully performs ServiceRep-owned operations (subscriber create, payment clear) in addition to its exclusive ones."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /api/subscribers", payload: { display_name: "RB4", email: "rb4@x.com" }, as: CirculationDirector, captures: { sub_rb4: $.data.id } }
            - call: "POST /api/payments"
              payload: { subscriber_id: "${sub_rb4}", amount_cents: 500, method: "ACH" }
              as: CirculationDirector
              captures: { pay_rb4: $.data.id }
          trigger:
            - call: "POST /api/payments/${pay_rb4}/mark-cleared"
              payload: {}
              as: CirculationDirector
              captures: { pay_rb4_st: $.data.status }
          assert:
            - "All three calls succeed under CirculationDirector; final payment status == CLEARED"

  # =====================================================================
  # Section: cross_cutting_layers — optimistic concurrency (OCC) per §1.2.1
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: plan_change_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-plan-change-stale-version]", "validations[priority=7]"]
        distinguishing_aspect: "Stale-version rejection on plan-change: after one plan-change advances Subscription.version, a second request replaying the previously observed version is rejected ERR_STALE_VERSION (412) and the first staged change survives."
        test_recipe:
          setup: ["ACTIVE print subscription since 2026-08-03; a second plan to change into; version v observed before any plan-change"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "OCC1", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_o1: $.data.id }
            - call: "POST /api/subscription-plans"
              payload: { name: "OCC2", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 700, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_o2: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "O", email: "occ@x.com", service_address: "16 Oak St" }, as: ServiceRep, captures: { sub_o: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_o}", plan_id: "${plan_o1}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_o: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_o}"
              as: ServiceRep
              captures: { subsc_o_v: $.data.version }
            - call: "POST /api/subscriptions/${subsc_o}/plan-change"
              payload: { new_plan_id: "${plan_o2}", effective_date: "2026-08-17", expected_subscription_version: "${subsc_o_v}" }
              as: ServiceRep
          trigger:
            - call: "POST /api/subscriptions/${subsc_o}/plan-change"
              payload: { new_plan_id: "${plan_o2}", effective_date: "2026-08-24", expected_subscription_version: "${subsc_o_v} - 1" }
              as: ServiceRep
              captures: { err_occ: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412)"
            - "Subscription.pending_plan_effective_date == 2026-08-17 — the first (current-version) change is untouched"

      - name: save_offer_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[save-offer-create-stale-version]", "validations[priority=7]"]
        distinguishing_aspect: "Stale-version rejection on the superseding save-offer create: a create replaying the version observed before another offer's creation is rejected ERR_STALE_VERSION (412), and the existing OFFERED offer is not auto-expired."
        test_recipe:
          setup: ["ACTIVE print subscription since 2026-08-03; version v observed before any manual offer"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "OCC3", plan_type: "PRINT", issues_per_week: 7, base_weekly_rate_cents: 600, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_o3: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "O2", email: "occ2@x.com", service_address: "17 Oak St" }, as: ServiceRep, captures: { sub_o2: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_o2}", plan_id: "${plan_o3}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_o2: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
            - call: "GET /api/subscriptions/${subsc_o2}"
              as: ServiceRep
              captures: { subsc_o2_v: $.data.version }
            - call: "POST /api/subscriptions/${subsc_o2}/save-offers"
              payload: { discount_pct: 0.3, duration_weeks: 8, expected_subscription_version: "${subsc_o2_v}" }
              as: ServiceRep
              captures: { offer_o1: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/${subsc_o2}/save-offers"
              payload: { discount_pct: 0.4, duration_weeks: 12, expected_subscription_version: "${subsc_o2_v} - 1" }
              as: ServiceRep
              captures: { err_occ2: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412)"
            - "Offer ${offer_o1} remains OFFERED (no supersede fired)"

      - name: cascading_side_effects_coverage
        claim_type: cascading_side_effects
        grounds: [state_machines.Payment.CLEARED_to_REVERSED, state_machines.DeliveryComplaint.OPEN_to_CREDITED]
        excluded_because:
          difficulty_instance: "transitive_cascade / payment_reversal_depth3_cascade"
          rationale: "Depth-3 cascades (both triggers) are exercised end-to-end by the two §1.8 transitive_cascade instances."

      - name: rate_threshold_triggers_coverage
        claim_type: rate_threshold_triggers
        grounds: [calculations.effective_weekly_rate, calculations.lapse_cycle_evaluation]
        excluded_because:
          difficulty_instance: "boundary_precision_check / rate_stepup_inclusive_week_boundary"
          rationale: "Threshold boundaries exercised by §1.8 rate_stepup_inclusive_week_boundary (tenure) and the corner instance lapse_threshold_strictly_greater_boundaries (aging)."

      - name: dual_variant_calculation_coverage
        claim_type: dual_variant_calculation
        grounds: [calculations.vacation_proration_credit, calculations.carrier_settlement]
        excluded_because:
          difficulty_instance: "dual_variant_calc / proration_per_day_vs_per_issue_divergence"
          rationale: "Both dual-variant calculations asserted by the two §1.8 dual_variant_calc instances."

  # =====================================================================
  # Section: consistency_model — immediate visibility
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_cancel
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the cancel mutation and all its side effects (CANCEL_PENDING, created OFFERED offer) are visible to the very next read with no reconciliation lag."
        test_recipe:
          setup: ["ACTIVE subscription since 2026-08-03"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CirculationDirector }
            - call: "POST /api/subscription-plans"
              payload: { name: "IV", plan_type: "DIGITAL", issues_per_week: 0, base_weekly_rate_cents: 400, proration_method: "PER_DAY", min_weekly_rate_cents: 0 }
              as: CirculationDirector
              captures: { plan_iv: $.data.id }
            - { call: "POST /api/subscribers", payload: { display_name: "IV", email: "iv@x.com" }, as: ServiceRep, captures: { sub_iv: $.data.id } }
            - call: "POST /api/subscriptions"
              payload: { subscriber_id: "${sub_iv}", plan_id: "${plan_iv}", start_date: "2026-08-03" }
              as: ServiceRep
              captures: { subsc_iv: $.data.id }
            - { call: "POST /api/ops/run-daily-cycle", payload: {}, as: CirculationDirector }
          trigger:
            - call: "POST /api/subscriptions/${subsc_iv}/cancel"
              payload: { reason: "check" }
              as: ServiceRep
              captures: { iv_billing: $.data.billing_status }
            - call: "GET /api/save-offers"
              payload: { subscription_id: "${subsc_iv}" }
              as: ServiceRep
              captures: { iv_offer_st: "$.data[0].status" }
          assert:
            - "Cancel response itself shows billing_status == CANCEL_PENDING"
            - "Immediate follow-up list shows the auto-created offer with status == OFFERED — no eventual-consistency lag"
