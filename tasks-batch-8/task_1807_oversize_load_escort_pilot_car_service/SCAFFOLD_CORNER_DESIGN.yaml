          assert:
            - "http 400 ERR_INVALID_REQUEST; RouteLeg.${leg_id}.police_confirmed remains false"

      - name: height_pole_equipment_missing_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_HEIGHT_POLE_EQUIPMENT_MISSING]"]
        distinguishing_aspect: "The pole requirement binds only FRONT positions on pole-required legs: a pole-less escort is rejected for FRONT, and a pole whose max (170) is below the load height (180) is rejected — while a REAR offer to a pole-less escort succeeds."
        test_recipe:
          setup: ["Booked TX job width 195 / height 180 (pole required); escorts: E_plain (no pole), E_short (pole max 170), E_rear (no pole)"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Pole Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Plain", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { e_plain: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Short Pole", certified_state_codes: ["TX"], has_height_pole: true, height_pole_max_inches: 170 }, as: Dispatcher, captures: { e_short: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Rear Plain", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { e_rear: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Tall wide load", width_inches: 195, height_inches: 180, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 200 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
          trigger:
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "FRONT", escort_id: "${e_plain}" }, as: Dispatcher, captures: { err1: $.data.error_id } }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "FRONT", escort_id: "${e_short}" }, as: Dispatcher, captures: { err2: $.data.error_id } }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${e_rear}" }, as: Dispatcher, captures: { asg_rear: $.data.id } }
          assert:
            - "err1 == ERR_HEIGHT_POLE_EQUIPMENT_MISSING (422): FRONT on a pole-required leg without a pole"
            - "err2 == ERR_HEIGHT_POLE_EQUIPMENT_MISSING (422): pole max 170 < job height 180"
            - "REAR offer to the pole-less escort succeeds (201, assignment ${asg_rear} OFFERED) — the equipment rule is position-conditional"

      - name: error_state_and_fiscal_pair_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=17]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_accept_quote
          rationale: "state-vs-fiscal priority asserted by the named §1.8 instance; safety-vs-temporal by safety_beats_temporal_on_assignment."

