      - name: validation_conflict2_inventory_pool_not_found_beats_mandatory_referral_open
        claim_type: priority_conflict
        grounds: [validations.priority_13, validations.priority_28, validations.documented_conflict_2]
        distinguishing_aspect: "Referential existence (priority 13) is checked before the medical-safety band, so a confirm-fit that is BOTH blocked by an open mandatory red flag and aimed at a non-existent (NEO, L, OPEN) pool returns 404 ERR_INVENTORY_POOL_NOT_FOUND, not 409 ERR_MANDATORY_REFERRAL_OPEN."
        test_recipe:
          setup:
            - "Only the (NEO, M, OPEN) pool exists. The patient's screening reports VERTIGO, producing a mandatory red flag (open_mandatory_flag_count 1, Patient REFERRAL_REQUIRED). A new order is then placed for an (NEO, L, OPEN) configuration that has no pool row."
