              payload: { name: "Rt", home_state_code: "CA", sales_tax_rate_bps: 875, resale_exempt_threshold_cents: 500000, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Rt A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "At", list_price_cents: 500000, insured_value_cents: 500000 }
