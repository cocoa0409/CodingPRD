            - call: "POST /network/agents/${agent_id}/activate"
              payload: {}
              as: NetworkAdministrator
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-TX-21", legal_name: "Brazos Valley Transport LLC", home_terminal_city: "Waco", revenue_split_pct: 0.68, oa_enrolled: true, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
