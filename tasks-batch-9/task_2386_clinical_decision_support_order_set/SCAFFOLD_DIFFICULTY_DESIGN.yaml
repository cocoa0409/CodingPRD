              captures: { chair_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Lam", npi: "1000000004", specialty: "CARDIOLOGY", authorized_roles: ["SpecialtyApprover"] }
              as: SystemAdmin
              captures: { rev1_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Nunes", npi: "1000000005", specialty: "CARDIOLOGY", authorized_roles: ["SpecialtyApprover"] }
              as: SystemAdmin
              captures: { rev2_id: $.data.id }
            - call: "POST /cds/content-requests"
              payload:
                title: "Renal dosing interruptive alert"
                request_type: "ALERT"
                clinical_domain: "NEPHROLOGY"
                urgency: "ROUTINE"
                evidence_grade: "B"
                clinical_sponsor_id: "${sponsor_id}"
                patient_safety_flag: false
                evidence_citations:
                  - { citation: "KDIGO 2025", peer_reviewed: true }
                  - { citation: "AJKD 2025;85:12", peer_reviewed: true }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /cds/content-requests/${cr_id}/triage"
              payload: { decision: "ACCEPT" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /cds/content-requests/${cr_id}/alerts"
              payload:
                name: "Renal dose adjustment required"
                firing_criteria: { trigger_event: "NEW_MEDICATION_ORDER", expression: "eGFR < 30 AND new_order(renally_cleared_drug)" }
