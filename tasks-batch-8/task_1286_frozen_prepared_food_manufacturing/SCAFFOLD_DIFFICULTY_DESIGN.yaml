          - "errors[ERR_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          Boundary on the load_kg metric via the cycle-create endpoint: load exactly
          equal to capacity_kg (2000) is accepted (inclusive <=), while 2001 is rejected
          with ERR_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "APPROVED recipe; order; batch B COOKED; cell FC-1 (capacity 2000, min 200, rate 400, sanitation 30)"
          setup_api_calls:
