scenario: "Portable Storage Container (PODS style): container size & inventory, delivery to site & placement, monthly rental & hold, transport (local/long-distance) move, access & redelivery, contents protection, packing-supplies add-on, late/overdue"
domain_name: portable-storage-container
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - resource_temporal_overlap

  entity_topology: flat
  # Peer entities linked by FK (Customer, RentalAgreement, ContainerUnit, Depot,
  # Crew, Truck, jobs, orders, charges). No deep nesting in URL paths; cross-aggregate
  # FK references dominate. Inventory is a shared finite pool competed for via reserve/commit/release.

  state_machine_shape: parallel
  # RentalAgreement carries two independent state dimensions: lifecycle_status
  # (QUOTED→RESERVED→ACTIVE→ON_HOLD→ACTIVE→CLOSING→CLOSED) AND billing_status
  # (CURRENT→PAST_DUE→DELINQUENT→CURRENT) that evolve independently on the same row.
  # ContainerUnit, DeliveryJob, MoveOrder add cyclic / branching shapes.

  relationship_patterns:
    - one_to_many        # Customer 1:N RentalAgreement; RentalAgreement 1:N Charge/AccessVisit
    - cross_aggregate    # ContainerUnit references DepotInventory pool, RentalAgreement, Depot
    - flat_fk            # all child entities link by FK; no nested ownership tree

  role_model: peer_roles
  # Customer owns own agreements (entity_backed). DispatchOperator schedules delivery/move/access
  # and manages inventory. BillingClerk posts charges and runs late-fee sweeps. PlatformAdmin
  # opaque operator seeds catalog + depots + crews + trucks + clock.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ContainerModel
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only; never used in business decisions."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: size_code
        type: enum
        source: input
        description: "Container size identifier."
        constraints: "one of {C8, C12, C16}; unique across ContainerModel"
      - name: cubic_feet
        type: integer
        source: input
        description: "Usable volume, used for nothing but display."
        constraints: ">= 1"
      - name: monthly_rate_cents
        type: integer
        source: input
        description: "Base monthly rental rate for one container of this size, in cents."
        constraints: ">= 0"
      - name: delivery_fee_cents
        type: integer
        source: input
        description: "Flat fee charged on initial delivery of a container of this size, in cents."
        constraints: ">= 0"
      - name: footprint_sqft
        type: integer
        source: input
        description: "Ground footprint, used in placement clearance validation."
        constraints: ">= 1"

  - name: ProtectionPlan
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: tier_code
        type: enum
        source: input
        description: "Protection tier identifier."
        constraints: "one of {NONE, BASIC, PLUS, PREMIER}; unique across ProtectionPlan"
      - name: base_premium_cents
        type: integer
        source: input
        description: "Fixed monthly premium floor component, in cents."
        constraints: ">= 0"
      - name: rate_bps
        type: integer
        source: input
        description: "Premium rate in basis points applied to declared value."
        constraints: ">= 0"
      - name: min_premium_cents
        type: integer
        source: input
        description: "Floor: monthly premium is never below this, in cents."
        constraints: ">= 0"
      - name: coverage_cap_cents
        type: integer
        source: input
        description: "Maximum declared_value_cents this tier accepts."
        constraints: ">= 0; NONE tier has coverage_cap_cents = 0"

  - name: Depot
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Depot display name."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code where the depot is located."
        constraints: "length 2; uppercase"
      - name: service_radius_miles
        type: integer
        source: input
        description: "Local-move radius; moves at or under this are LOCAL, above are LONG_DISTANCE."
        constraints: ">= 0"

  - name: DepotInventory
    parent: null
    common_fields: true
    fields:
      - name: depot_id
        type: string
        source: input
        description: "FK -> Depot.id"
      - name: size_code
        type: enum
        source: input
        description: "Container size this inventory row tracks."
        constraints: "one of {C8, C12, C16}; (depot_id, size_code) is unique"
      - name: total_units
        type: integer
        source: input
        description: "Physical containers of this size owned at this depot."
        constraints: ">= 0"
      - name: reserved_units
        type: integer
        source: computed
        description: "Count of ContainerUnit in RESERVED status drawn from this row."
        default: 0
        constraints: ">= 0"
      - name: committed_units
        type: integer
        source: computed
        description: "Count of ContainerUnit in DELIVERED/IN_TRANSIT/ON_SITE status drawn from this row."
        default: 0
        constraints: ">= 0"
      - name: available_units
        type: integer
        source: computed
        description: "total_units - reserved_units - committed_units; see calc inventory_availability."
        constraints: ">= 0"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique across Customer."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Customer full name."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code of the customer billing address."
        constraints: "length 2; uppercase"
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: "Conserved-quantity ledger mirror: sum of all PAYMENT Charge.amount_cents across this customer's agreements; see calc customer_payment_ledger."
        default: 0
      - name: open_balance_cents
        type: integer
        source: computed
        description: "Sum across this customer's non-CLOSED agreements of agreement.balance_due_cents; see calc customer_payment_ledger."
        default: 0

  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: depot_id
        type: string
        source: input
        description: "FK -> Depot.id; depot the container is drawn from."
      - name: size_code
        type: enum
        source: input
        description: "Requested container size."
        constraints: "one of {C8, C12, C16}"
      - name: protection_tier_code
        type: enum
        source: input
        description: "Selected contents-protection tier."
        default: NONE
        constraints: "one of {NONE, BASIC, PLUS, PREMIER}"
      - name: declared_value_cents
        type: integer
        source: input
        description: "Declared value of stored contents, drives protection premium."
        default: 0
        constraints: ">= 0; must be <= ProtectionPlan.coverage_cap_cents for the selected tier"
      - name: proration_method
        type: enum
        source: input
        description: "First-cycle proration variant selector."
        default: CALENDAR_DAY
        constraints: "one of {CALENDAR_DAY, FIXED_30}"
      - name: site_address
        type: string
        source: input
        description: "Delivery site street address."
      - name: site_clearance_sqft
        type: integer
        source: input
        description: "Customer-attested clear ground area at the site, in square feet."
        constraints: ">= 0"
      - name: lifecycle_status
        type: enum
        source: computed
        description: "Lifecycle state dimension."
        default: QUOTED
        constraints: "one of {QUOTED, RESERVED, ACTIVE, ON_HOLD, CLOSING, CLOSED, CANCELLED}"
      - name: billing_status
        type: enum
        source: computed
        description: "Independent billing state dimension, evolves separately from lifecycle_status."
        default: CURRENT
        constraints: "one of {CURRENT, PAST_DUE, DELINQUENT}"
      - name: delivery_anchor_date
        type: datetime
        source: computed
        description: "Date the container was placed on site; sets the billing cycle anchor. Null until delivered."
      - name: monthly_premium_cents
        type: integer
        source: computed
        description: "Monthly protection premium locked at activation; see calc protection_premium."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "Outstanding balance: sum of POSTED debit Charges minus PAYMENT Charges; see calc agreement_balance."
        default: 0
      - name: last_charged_cycle_date
        type: datetime
        source: computed
        description: "Anchor date of the most recent monthly RENTAL_CYCLE charge posted. Null until first cycle billed."
      - name: days_overdue
        type: integer
        source: computed
        description: "Days the oldest unpaid POSTED debit is past its due date as of current clock; see calc late_fee."
        default: 0

  - name: ContainerUnit
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id; the agreement this physical unit serves."
      - name: depot_inventory_id
        type: string
        source: input
        description: "FK -> DepotInventory.id; the inventory pool this unit is drawn from."
      - name: size_code
        type: enum
        source: computed
        description: "Mirror of the inventory row's size_code."
        constraints: "one of {C8, C12, C16}"
      - name: status
        type: enum
        source: computed
        description: "Physical-unit lifecycle."
        default: RESERVED
        constraints: "one of {RESERVED, DELIVERED, ON_SITE, IN_TRANSIT, RETURNED, RELEASED}"
      - name: current_depot_id
        type: string
        source: computed
        description: "FK -> Depot.id; depot the unit currently belongs to (changes on long-distance move)."

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: depot_id
        type: string
        source: input
        description: "FK -> Depot.id; home depot the crew dispatches from."
      - name: name
        type: string
        source: input
        description: "Crew display name."
      - name: setup_buffer_minutes
        type: integer
        source: input
        description: "Mandatory teardown/travel buffer appended after each DeliveryJob window."
        default: 30
        constraints: ">= 0"

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - name: depot_id
        type: string
        source: input
        description: "FK -> Depot.id; home depot the truck is based at."
      - name: plate
        type: string
        source: input
        description: "License plate, unique across Truck."
        constraints: "unique; non-empty"
      - name: max_concurrent_containers
        type: integer
        source: input
        description: "Aggregate hauling capacity: total containers the truck may carry across overlapping MoveOrders."
        default: 1
        constraints: ">= 1"

  - name: DeliveryJob
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id"
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; crew assigned to perform the placement."
      - name: container_unit_id
        type: string
        source: input
        description: "FK -> ContainerUnit.id; the reserved unit being delivered."
      - name: job_kind
        type: enum
        source: input
        description: "Whether this is the initial placement or a redelivery after access."
        default: INITIAL_DELIVERY
        constraints: "one of {INITIAL_DELIVERY, REDELIVERY}"
      - name: window_start
        type: datetime
        source: input
        description: "Scheduled start of the on-site placement window, ISO 8601 UTC."
      - name: window_end
        type: datetime
        source: input
        description: "Scheduled end of the on-site placement window; window is half-open [start, end)."
        constraints: "window_end > window_start"
      - name: status
        type: enum
        source: computed
        description: "Job lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"

  - name: MoveOrder
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id"
      - name: truck_id
        type: string
        source: input
        description: "FK -> Truck.id; truck hauling the move."
      - name: container_unit_id
        type: string
        source: input
        description: "FK -> ContainerUnit.id; the on-site unit being transported."
      - name: origin_depot_id
        type: string
        source: input
        description: "FK -> Depot.id; depot governing local-vs-long-distance classification."
      - name: destination_state_code
        type: string
        source: input
        description: "Two-letter destination state code."
        constraints: "length 2; uppercase"
      - name: distance_miles
        type: integer
        source: input
        description: "Quoted road distance for the move."
        constraints: ">= 0"
      - name: move_class
        type: enum
        source: computed
        description: "LOCAL if distance_miles <= origin depot service_radius_miles, else LONG_DISTANCE."
        constraints: "one of {LOCAL, LONG_DISTANCE}"
      - name: window_start
        type: datetime
        source: input
        description: "Scheduled truck dispatch time, ISO 8601 UTC."
      - name: window_end
        type: datetime
        source: input
        description: "Scheduled truck release time; window is closed [start, end] (back-to-back allowed)."
        constraints: "window_end > window_start"
      - name: quoted_cost_cents
        type: integer
        source: computed
        description: "Transport price locked at scheduling; see calc move_pricing."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Move lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_TRANSIT, COMPLETED, CANCELLED}"

  - name: AccessVisit
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id"
      - name: container_unit_id
        type: string
        source: input
        description: "FK -> ContainerUnit.id; unit being accessed."
      - name: access_kind
        type: enum
        source: input
        description: "Where the customer accesses contents."
        default: ON_SITE
        constraints: "one of {ON_SITE, DEPOT_PICKUP}"
      - name: requested_for
        type: datetime
        source: input
        description: "Requested access date/time, ISO 8601 UTC."
      - name: redelivery_required
        type: boolean
        source: computed
        description: "True when access_kind == DEPOT_PICKUP (the unit must be redelivered afterward)."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Visit lifecycle."
        default: REQUESTED
        constraints: "one of {REQUESTED, FULFILLED, CANCELLED}"

  - name: PackingSupplyOrder
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id"
      - name: lines
        type: array
        source: input
        description: "Array of supply line objects {sku, qty, unit_price_cents, bulk_threshold, bulk_pct}."
        constraints: "non-empty; each qty >= 1; each unit_price_cents >= 0"
      - name: tax_rate_bps
        type: integer
        source: input
        description: "Sales tax in basis points applied to the summed line nets."
        default: 825
        constraints: ">= 0"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of per-line nets; see calc packing_supplies_total."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax computed once on subtotal_cents; see calc packing_supplies_total."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + tax_cents."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Order lifecycle."
        default: PLACED
        constraints: "one of {PLACED, CANCELLED}"

  - name: Charge
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RentalAgreement.id; the agreement this ledger row belongs to."
      - name: charge_type
        type: enum
        source: computed
        description: "Ledger category."
        constraints: "one of {DELIVERY_FEE, RENTAL_PRORATION, RENTAL_CYCLE, PROTECTION_PREMIUM, PACKING_SUPPLIES, MOVE, ACCESS_FEE, LATE_FEE, PAYMENT, ADJUSTMENT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed amount in cents: positive for debits owed by customer, negative for PAYMENT/ADJUSTMENT credits."
      - name: due_date
        type: datetime
        source: computed
        description: "Date this debit is due; null for PAYMENT/ADJUSTMENT. Drives days_overdue and late_fee."
      - name: settled
        type: boolean
        source: computed
        description: "True once a PAYMENT has covered this debit in chronological order; see calc agreement_balance."
        default: false

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RentalAgreement
    initial_state: QUOTED
    terminal_states: [CLOSED, CANCELLED]
    note: "lifecycle_status dimension. The billing_status dimension is a SEPARATE machine below; the two evolve independently on the same row (parallel)."
    transitions:
      - from: QUOTED
        to: RESERVED
        trigger: "POST /rental-agreements/{id}/reserve"
        actor: DispatchOperator
        preconditions:
          - "lifecycle_status == QUOTED"
          - "DepotInventory(depot_id, size_code).available_units >= 1 (inventory_availability)"
          - "declared_value_cents <= ProtectionPlan(protection_tier_code).coverage_cap_cents"
        side_effects:
          - "create one ContainerUnit in status RESERVED drawn from DepotInventory(depot_id, size_code)"
          - "DepotInventory.reserved_units += 1; recompute DepotInventory.available_units (inventory_availability)"
          - "increments RentalAgreement.version by 1; refresh updated_at"
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /delivery-jobs/{id}/complete (job_kind == INITIAL_DELIVERY)"
        actor: DispatchOperator
        preconditions:
          - "lifecycle_status == RESERVED"
          - "the DeliveryJob.status == SCHEDULED and job_kind == INITIAL_DELIVERY"
          - "the ContainerUnit.status == RESERVED"
        side_effects:
          - "ContainerUnit.status RESERVED -> DELIVERED -> ON_SITE; DepotInventory.reserved_units -= 1, committed_units += 1; recompute available_units (inventory_availability)"
          - "set delivery_anchor_date = DeliveryJob.window_start date; lifecycle_status -> ACTIVE"
          - "post DELIVERY_FEE Charge = ContainerModel.delivery_fee_cents"
          - "lock monthly_premium_cents (protection_premium); post first RENTAL_PRORATION Charge (rental_proration) and PROTECTION_PREMIUM Charge; set last_charged_cycle_date = delivery_anchor_date"
          - "recompute balance_due_cents (agreement_balance); recompute Customer.open_balance_cents (customer_payment_ledger)"
          - "increments RentalAgreement.version by 1"
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /rental-agreements/{id}/hold"
        actor: Customer
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "billing_status == CURRENT (an agreement that is PAST_DUE or DELINQUENT cannot be placed on hold)"
        side_effects:
          - "lifecycle_status -> ON_HOLD; monthly RENTAL_CYCLE billing is suspended while ON_HOLD"
          - "increments RentalAgreement.version by 1"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /rental-agreements/{id}/resume"
        actor: Customer
        preconditions:
          - "lifecycle_status == ON_HOLD"
        side_effects:
          - "lifecycle_status -> ACTIVE; monthly RENTAL_CYCLE billing resumes from next anchor"
          - "increments RentalAgreement.version by 1"
        note: "Cyclic: ACTIVE -> ON_HOLD -> ACTIVE loop allowed any number of times."
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /rental-agreements/{id}/request-closeout"
        actor: Customer
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "no MoveOrder for this agreement in status SCHEDULED or IN_TRANSIT"
          - "no DeliveryJob for this agreement in status SCHEDULED"
        side_effects:
          - "lifecycle_status -> CLOSING; create one final REDELIVERY-class pickup obligation (ContainerUnit must be RETURNED before CLOSED)"
          - "increments RentalAgreement.version by 1"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /rental-agreements/{id}/close"
        actor: BillingClerk
        preconditions:
          - "lifecycle_status == CLOSING"
          - "the ContainerUnit.status == RETURNED"
          - "balance_due_cents == 0 (final settlement paid; agreement_balance FINAL variant)"
        side_effects:
          - "lifecycle_status -> CLOSED; ContainerUnit.status RETURNED -> RELEASED"
          - "DepotInventory.committed_units -= 1; recompute available_units (inventory_availability)"
          - "recompute Customer.open_balance_cents (customer_payment_ledger)"
          - "increments RentalAgreement.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /rental-agreements/{id}/cancel"
        actor: Customer
        preconditions:
          - "lifecycle_status == QUOTED"
        side_effects:
          - "lifecycle_status -> CANCELLED"
          - "increments RentalAgreement.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /rental-agreements/{id}/cancel"
        actor: Customer
        preconditions:
          - "lifecycle_status == RESERVED"
        side_effects:
          - "lifecycle_status -> CANCELLED; the RESERVED ContainerUnit.status -> RELEASED (compensation)"
          - "DepotInventory.reserved_units -= 1; recompute available_units (inventory_availability) — restores pool to pre-reserve count (compensating_invariant inventory_conservation)"
          - "increments RentalAgreement.version by 1"

  - entity: RentalAgreement
    initial_state: CURRENT
    terminal_states: []
    note: "billing_status dimension (parallel with lifecycle_status). Driven by the late-fee sweep and payments; cyclic CURRENT->PAST_DUE->DELINQUENT->CURRENT."
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /_billing/run-late-sweep (system sweep at current clock)"
        actor: BillingClerk
        preconditions:
          - "billing_status == CURRENT"
          - "days_overdue > GRACE_DAYS (5) and days_overdue <= DELINQUENT_DAYS (20) (late_fee threshold)"
        side_effects:
          - "billing_status -> PAST_DUE; post one LATE_FEE Charge (late_fee, tier1); recompute balance_due_cents (agreement_balance)"
      - from: PAST_DUE
        to: DELINQUENT
        trigger: "POST /_billing/run-late-sweep"
        actor: BillingClerk
        preconditions:
          - "billing_status == PAST_DUE"
          - "days_overdue > DELINQUENT_DAYS (20) (late_fee tier2)"
        side_effects:
          - "billing_status -> DELINQUENT; post one additional LATE_FEE Charge (late_fee, tier2 escalation delta); recompute balance_due_cents (agreement_balance)"
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /rental-agreements/{id}/payments"
        actor: Customer
        preconditions:
          - "billing_status == PAST_DUE"
          - "after applying the PAYMENT, balance_due_cents == 0 (agreement_balance)"
        side_effects:
          - "post PAYMENT Charge (negative amount); mark covered debits settled in created_at order (agreement_balance)"
          - "billing_status -> CURRENT; recompute days_overdue (late_fee); recompute Customer.lifetime_paid_cents and open_balance_cents (customer_payment_ledger)"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /rental-agreements/{id}/payments"
        actor: Customer
        preconditions:
          - "billing_status == DELINQUENT"
          - "after applying the PAYMENT, balance_due_cents == 0 (agreement_balance)"
        side_effects:
          - "post PAYMENT Charge; mark debits settled in created_at order; billing_status -> CURRENT"
          - "recompute days_overdue, Customer.lifetime_paid_cents and open_balance_cents (customer_payment_ledger)"
        note: "Cyclic: agreement can re-enter PAST_DUE/DELINQUENT on a later sweep after returning to CURRENT."

  - entity: ContainerUnit
    initial_state: RESERVED
    terminal_states: [RELEASED]
    note: "Branching from ON_SITE: a DEPOT_PICKUP access path (ON_SITE->IN_TRANSIT->RESERVED@depot... redelivery) vs a MOVE path; divergent side-effect sets."
    transitions:
      - from: RESERVED
        to: DELIVERED
        trigger: "POST /delivery-jobs/{id}/complete (INITIAL_DELIVERY)"
        actor: DispatchOperator
        preconditions:
          - "status == RESERVED"
          - "DeliveryJob.job_kind == INITIAL_DELIVERY and DeliveryJob.status == SCHEDULED"
        side_effects:
          - "status RESERVED -> DELIVERED (transient) -> ON_SITE in the same transition; DepotInventory.reserved_units -= 1, committed_units += 1 (inventory_availability)"
      - from: ON_SITE
        to: IN_TRANSIT
        trigger: "POST /move-orders/{id}/dispatch OR POST /access-visits/{id}/fulfill (access_kind == DEPOT_PICKUP)"
        actor: DispatchOperator
        preconditions:
          - "status == ON_SITE"
          - "triggering MoveOrder.status == SCHEDULED, or triggering AccessVisit.access_kind == DEPOT_PICKUP and AccessVisit.status == REQUESTED"
        side_effects:
          - "status ON_SITE -> IN_TRANSIT"
          - "if MoveOrder long-distance: on completion current_depot_id will change to destination depot (cross-entity)"
      - from: IN_TRANSIT
        to: ON_SITE
        trigger: "POST /move-orders/{id}/complete OR POST /delivery-jobs/{id}/complete (REDELIVERY)"
        actor: DispatchOperator
        preconditions:
          - "status == IN_TRANSIT"
        side_effects:
          - "status IN_TRANSIT -> ON_SITE; for a completed LONG_DISTANCE MoveOrder set current_depot_id = destination depot of the move"
      - from: ON_SITE
        to: RETURNED
        trigger: "POST /container-units/{id}/return-to-depot (final closeout pickup)"
        actor: DispatchOperator
        preconditions:
          - "status == ON_SITE"
          - "parent RentalAgreement.lifecycle_status == CLOSING"
        side_effects:
          - "status ON_SITE -> RETURNED; unit physically back at a depot, still committed_units until agreement CLOSED"
      - from: RETURNED
        to: RELEASED
        trigger: "POST /rental-agreements/{id}/close"
        actor: BillingClerk
        preconditions:
          - "status == RETURNED"
          - "parent RentalAgreement.lifecycle_status == CLOSING and balance_due_cents == 0"
        side_effects:
          - "status RETURNED -> RELEASED; DepotInventory.committed_units -= 1 (inventory_availability); pool restored (compensating_invariant inventory_conservation)"

  - entity: DeliveryJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Linear with revert-to-cancel; the COMPLETE transition drives cross-entity cascades into RentalAgreement and ContainerUnit."
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /delivery-jobs/{id}/complete"
        actor: DispatchOperator
        preconditions:
          - "status == SCHEDULED"
          - "the assigned ContainerUnit is in the state the job_kind expects (RESERVED for INITIAL_DELIVERY, IN_TRANSIT for REDELIVERY)"
        side_effects:
          - "status -> COMPLETED"
          - "if INITIAL_DELIVERY: cascade RentalAgreement RESERVED->ACTIVE (which itself posts DELIVERY_FEE, RENTAL_PRORATION, PROTECTION_PREMIUM charges and recomputes balance — transitive_cascade delivery_activation_chain)"
          - "if REDELIVERY: cascade ContainerUnit IN_TRANSIT->ON_SITE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /delivery-jobs/{id}/cancel"
        actor: DispatchOperator
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "status -> CANCELLED; frees the crew window (resource_temporal_overlap crew check no longer sees this job)"

  - entity: MoveOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Linear forward with cancel revert; completion mutates ContainerUnit and (long-distance) DepotInventory across depots."
    transitions:
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /move-orders/{id}/dispatch"
        actor: DispatchOperator
        preconditions:
          - "status == SCHEDULED"
          - "the ContainerUnit.status == ON_SITE"
          - "parent RentalAgreement.lifecycle_status == ACTIVE"
        side_effects:
          - "status -> IN_TRANSIT; cascade ContainerUnit ON_SITE->IN_TRANSIT (cross_entity_state_dependency move_requires_unit_on_site)"
          - "post MOVE Charge = quoted_cost_cents (move_pricing) if not already posted at scheduling"
      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /move-orders/{id}/complete"
        actor: DispatchOperator
        preconditions:
          - "status == IN_TRANSIT"
        side_effects:
          - "status -> COMPLETED; cascade ContainerUnit IN_TRANSIT->ON_SITE"
          - "if move_class == LONG_DISTANCE: ContainerUnit.current_depot_id -> destination depot; the old DepotInventory.committed_units -= 1 and the destination DepotInventory.committed_units += 1 (transitive_cascade move_completion_chain; inventory_conservation invariant holds globally)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /move-orders/{id}/cancel"
        actor: DispatchOperator
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "status -> CANCELLED; if a MOVE Charge was posted at scheduling, post a compensating ADJUSTMENT Charge = -quoted_cost_cents (compensating_invariant agreement_balance_conservation); recompute balance_due_cents"

  - entity: AccessVisit
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    note: "Linear; DEPOT_PICKUP branch requires a redelivery DeliveryJob afterward (cross-entity guard)."
    transitions:
      - from: REQUESTED
        to: FULFILLED
        trigger: "POST /access-visits/{id}/fulfill"
        actor: DispatchOperator
        preconditions:
          - "status == REQUESTED"
          - "parent RentalAgreement.lifecycle_status == ACTIVE"
          - "the ContainerUnit.status == ON_SITE"
        side_effects:
          - "status -> FULFILLED; post ACCESS_FEE Charge"
          - "if access_kind == DEPOT_PICKUP: cascade ContainerUnit ON_SITE->IN_TRANSIT and set redelivery_required = true (a REDELIVERY DeliveryJob must then bring it back)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /access-visits/{id}/cancel"
        actor: Customer
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "status -> CANCELLED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reserve-stale-agreement
    parent_entity: RentalAgreement
    write_endpoint: "POST /rental-agreements/{id}/reserve"
    occ_field: "expected_agreement_version"
    description: |
      Reserving a container against a RentalAgreement whose version has advanced
      since the client last observed it is rejected. A reserve draws a unit from the
      finite DepotInventory pool and is a legitimately repeatable CREATE-with-effect;
      if the agreement's version is stale the operator's view of the pool draw is
      out of date and the reserve is rejected on the stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payment-stale-agreement
    parent_entity: RentalAgreement
    write_endpoint: "POST /rental-agreements/{id}/payments"
    occ_field: "expected_agreement_version"
    description: |
      Posting a payment against a RentalAgreement whose version has advanced since
      the client last read its balance is rejected. A late-fee sweep can post a new
      LATE_FEE Charge and bump the agreement version between the client's balance read
      and the payment; the payment carrying the stale version is rejected so the client
      re-reads the now-larger balance before paying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: inventory_availability
    trigger: "on reserve, delivery completion, cancel, close, and long-distance move completion (any change to ContainerUnit count drawn from a DepotInventory row)"
    algorithm: aggregation
    formula: |
      reserved_units  = count(ContainerUnit where depot_inventory_id == row.id and status == RESERVED)
      committed_units = count(ContainerUnit where depot_inventory_id == row.id and status in {DELIVERED, ON_SITE, IN_TRANSIT, RETURNED})
      available_units = total_units - reserved_units - committed_units
    input_set: "ContainerUnit rows linked to this DepotInventory; RETURNED counts as committed until the agreement is CLOSED (then RELEASED, which drops out of both sums)."
    constants: {}
    precision: "integer counts, no rounding"
    variants: []

  - name: rental_proration
    trigger: "on RentalAgreement RESERVED->ACTIVE (delivery completion)"
    algorithm: forward_looking
    formula: |
      monthly      = ContainerModel(size_code).monthly_rate_cents
      d            = delivery day-of-month of delivery_anchor_date
      days_in_month = number of calendar days in the delivery month
      days_billed  = days_in_month - d + 1          # delivery day inclusive through last day of month
      VARIANT CALENDAR_DAY: proration_cents = round_half_up(monthly * days_billed / days_in_month)
      VARIANT FIXED_30    : proration_cents = round_half_up(monthly * days_billed / 30)
    input_set: "single agreement; days_billed counts the delivery day inclusive through the last day of the delivery calendar month; full monthly RENTAL_CYCLE charges then post on the 1st of each subsequent month while ACTIVE."
    constants: {FIXED_DIVISOR: 30}
    precision: "round_half_up to whole cents"
    variants:
      - name: CALENDAR_DAY
        when: "RentalAgreement.proration_method == CALENDAR_DAY"
        difference: "divides by the actual number of days in the delivery calendar month (28/29/30/31)"
      - name: FIXED_30
        when: "RentalAgreement.proration_method == FIXED_30"
        difference: "always divides by 30 regardless of the calendar month; diverges from CALENDAR_DAY in any 31-day or February month"

  - name: move_pricing
    trigger: "on MoveOrder creation (POST /move-orders); locks quoted_cost_cents"
    algorithm: tiered_pricing
    formula: |
      move_class = LOCAL if distance_miles <= Depot(origin_depot_id).service_radius_miles else LONG_DISTANCE
      if move_class == LOCAL:
          quoted_cost_cents = LOCAL_BASE_CENTS + LOCAL_PER_MILE_CENTS * distance_miles
      else:  # LONG_DISTANCE, marginal tiered bands + fuel surcharge + per-container handling
          b1 = min(distance_miles, 500)
          b2 = max(0, min(distance_miles, 1500) - 500)
          b3 = max(0, distance_miles - 1500)
          mileage_cents = BAND1_CENTS*b1 + BAND2_CENTS*b2 + BAND3_CENTS*b3
          fuel_cents    = round_half_up(mileage_cents * FUEL_SURCHARGE_PCT)
          handling_cents = HANDLING_PER_CONTAINER_CENTS * 1     # one ContainerUnit per MoveOrder
          quoted_cost_cents = mileage_cents + fuel_cents + handling_cents
    input_set: "single MoveOrder; one ContainerUnit; bands are MARGINAL (each band rate applies only to miles within that band)."
    constants:
      LOCAL_BASE_CENTS: 8900
      LOCAL_PER_MILE_CENTS: 350
      BAND1_CENTS: 180
      BAND2_CENTS: 140
      BAND3_CENTS: 110
      FUEL_SURCHARGE_PCT: 0.12
      HANDLING_PER_CONTAINER_CENTS: 12500
    precision: "round_half_up to whole cents; fuel computed once on the summed mileage_cents (sum-then-round)"
    variants:
      - name: LOCAL
        when: "distance_miles <= origin depot service_radius_miles"
        difference: "flat base + linear per-mile; no fuel surcharge, no tier bands"
      - name: LONG_DISTANCE
        when: "distance_miles > origin depot service_radius_miles"
        difference: "marginal tiered bands + fuel surcharge + per-container handling; boundary at exactly service_radius_miles is LOCAL (<=)"

  - name: protection_premium
    trigger: "on RentalAgreement RESERVED->ACTIVE; locks monthly_premium_cents"
    algorithm: weighted_scoring
    formula: |
      plan = ProtectionPlan(protection_tier_code)
      raw  = plan.base_premium_cents + round_half_up(plan.rate_bps * declared_value_cents / 10000)
      monthly_premium_cents = max(raw, plan.min_premium_cents)
    input_set: "single agreement + its selected ProtectionPlan; declared_value_cents must already be <= plan.coverage_cap_cents (validated at reserve)."
    constants: {BPS_DIVISOR: 10000}
    precision: "round_half_up to whole cents"
    variants: []

  - name: late_fee
    trigger: "on POST /_billing/run-late-sweep for each ACTIVE/ON_HOLD agreement with an unpaid POSTED debit; computes days_overdue and the LATE_FEE Charge"
    algorithm: threshold
    formula: |
      oldest_due = min(due_date over POSTED debit Charges where settled == false)
      days_overdue = floor(current_clock_date - oldest_due) in whole days  # 0 if all settled
      if days_overdue <= GRACE_DAYS: late_fee_cents = 0
      else:
          eff   = days_overdue - GRACE_DAYS
          d1    = min(eff, TIER1_SPAN_DAYS)            # days in tier1 window
          d2    = max(0, eff - TIER1_SPAN_DAYS)        # days in tier2 escalation
          gross = LATE_FLAT_CENTS + DAILY1_CENTS*d1 + DAILY2_CENTS*d2
          cap   = round_half_up(balance_due_cents * LATE_CAP_PCT)
          late_fee_cents = min(gross, cap)
      # The PAST_DUE sweep posts the tier1 amount; the DELINQUENT sweep posts only the
      # incremental delta (current late_fee_cents minus already-posted LATE_FEE total).
    input_set: "single agreement; only POSTED debit Charges with settled == false enter oldest_due; PAYMENT/ADJUSTMENT rows excluded."
    constants:
      GRACE_DAYS: 5
      DELINQUENT_DAYS: 20
      TIER1_SPAN_DAYS: 10
      LATE_FLAT_CENTS: 2500
      DAILY1_CENTS: 200
      DAILY2_CENTS: 500
      LATE_CAP_PCT: 0.50
    precision: "round_half_up to whole cents on the cap; day counts are integer floors"
    variants: []

  - name: packing_supplies_total
    trigger: "on POST /packing-supply-orders"
    algorithm: aggregation
    formula: |
      for each line {qty, unit_price_cents, bulk_threshold, bulk_pct}:
          gross_i = qty * unit_price_cents
          disc_i  = round_half_up(gross_i * bulk_pct) if qty >= bulk_threshold else 0
          net_i   = gross_i - disc_i
      subtotal_cents = sum(net_i)                                   # SUM the per-line nets
      tax_cents      = round_half_up(subtotal_cents * tax_rate_bps / 10000)   # tax ONCE on the sum
      total_cents    = subtotal_cents + tax_cents
    input_set: "single PackingSupplyOrder; per-line discount rounded at the line, but tax is computed exactly once on the summed subtotal (sum-then-tax), NOT per line."
    constants: {BPS_DIVISOR: 10000}
    precision: "round_half_up to whole cents; pinned order is round-discount-per-line, sum nets, then round-tax-once-on-sum"
    variants: []

  - name: agreement_balance
    trigger: "after any Charge is posted/reversed and on close (FINAL); recompute RentalAgreement.balance_due_cents and per-Charge settled flags"
    algorithm: chronological
    formula: |
      order Charges by created_at ASC, ties broken by created_at then nothing else (created_at is unique per posting)
      running_credit = sum(-amount_cents for PAYMENT/ADJUSTMENT credit rows posted so far)
      VARIANT PROVISIONAL (lifecycle_status in {ACTIVE, ON_HOLD}):
          consider only POSTED debit Charges of type in {DELIVERY_FEE, RENTAL_PRORATION, RENTAL_CYCLE, PROTECTION_PREMIUM, PACKING_SUPPLIES, ACCESS_FEE}
      VARIANT FINAL (lifecycle_status in {CLOSING, CLOSED}):
          consider ALL POSTED debit Charges including MOVE and LATE_FEE
      balance_due_cents = sum(debit amount_cents in scope) - sum(credit -amount_cents)
      mark a debit settled == true when cumulative credits in created_at order cover it fully.
    input_set: "all Charges for the agreement; debit scope depends on lifecycle phase (PROVISIONAL excludes MOVE and LATE_FEE; FINAL includes them)."
    constants: {}
    precision: "integer cents; settlement walks debits oldest-first by created_at ASC"
    variants:
      - name: PROVISIONAL
        when: "lifecycle_status in {ACTIVE, ON_HOLD}"
        difference: "excludes MOVE and LATE_FEE debits from balance_due_cents — these are not collectible until closeout"
      - name: FINAL
        when: "lifecycle_status in {CLOSING, CLOSED}"
        difference: "includes every POSTED debit; diverges from PROVISIONAL by exactly the sum of MOVE + LATE_FEE debits"

  - name: customer_payment_ledger
    trigger: "after any PAYMENT Charge posts, on delivery activation, and on agreement close; recompute Customer.lifetime_paid_cents and open_balance_cents"
    algorithm: aggregation
    formula: |
      lifetime_paid_cents = sum(-amount_cents for Charge.charge_type == PAYMENT across ALL agreements of this customer)
      open_balance_cents  = sum(agreement.balance_due_cents for agreements where lifecycle_status in {RESERVED, ACTIVE, ON_HOLD, CLOSING})
    input_set: "all Charges and agreements belonging to this Customer; CLOSED and CANCELLED agreements drop out of open_balance_cents."
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of {Customer, DispatchOperator, BillingClerk, PlatformAdmin}; X-User-ID present for entity-backed roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per the RBAC matrix; for Customer-owned operations X-User-ID must equal the agreement's customer_id."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every referenced resource in the path and body FKs exists, validated left-to-right (agreement, customer, depot, inventory, unit, crew, truck, job, order, visit)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Request body conforms to schema: required fields present, enums in allowed set, integers non-negative, window_end > window_start, lines non-empty."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: business_referential
    check: "(depot_id, size_code) of the agreement maps to an existing DepotInventory row; ContainerUnit referenced by a job/move/visit belongs to the same agreement."
    error_id: ERR_INVENTORY_ROW_MISSING
    http_status: 422
    applies_to: "POST /rental-agreements/{id}/reserve, POST /delivery-jobs, POST /move-orders, POST /access-visits"
  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition (state-machine from-state precondition)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_agreement_version equals the current RentalAgreement.version on reserve and payment endpoints."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rental-agreements/{id}/reserve, POST /rental-agreements/{id}/payments"
  - priority: 8
    category: business_safety
    check: "Placement clearance: RentalAgreement.site_clearance_sqft >= ContainerModel(size_code).footprint_sqft before an INITIAL_DELIVERY DeliveryJob may be scheduled."
    error_id: ERR_INSUFFICIENT_CLEARANCE
    http_status: 422
    applies_to: "POST /delivery-jobs"
  - priority: 9
    category: business_safety
    check: "Declared value within coverage: declared_value_cents <= ProtectionPlan(protection_tier_code).coverage_cap_cents at reserve."
    error_id: ERR_DECLARED_VALUE_OVER_CAP
    http_status: 422
    applies_to: "POST /rental-agreements/{id}/reserve"
  - priority: 10
    category: business_temporal
    check: "Crew availability: the DeliveryJob window [start,end) extended by the crew's setup_buffer_minutes must not overlap any other SCHEDULED job on the same crew (half-open + buffer interval semantics)."
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-jobs"
  - priority: 11
    category: business_temporal
    check: "Truck capacity: the sum of containers across SCHEDULED/IN_TRANSIT MoveOrders on the same truck whose closed window [start,end] intersects this move's window must not exceed Truck.max_concurrent_containers (closed-interval aggregate-capacity semantics)."
    error_id: ERR_TRUCK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /move-orders"
  - priority: 12
    category: business_constraint
    check: "Closeout block: request-closeout rejected when any MoveOrder for the agreement is SCHEDULED/IN_TRANSIT or any DeliveryJob is SCHEDULED."
    error_id: ERR_OPEN_LOGISTICS
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/request-closeout"
  - priority: 13
    category: business_constraint
    check: "Hold block: an agreement whose billing_status is PAST_DUE or DELINQUENT cannot be placed ON_HOLD."
    error_id: ERR_BILLING_NOT_CURRENT
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/hold"
  - priority: 14
    category: business_fiscal
    check: "Close fiscal gate: agreement cannot move CLOSING->CLOSED while balance_due_cents (FINAL variant) > 0."
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/close"
  - priority: 15
    category: business_fiscal
    check: "Inventory floor: a reserve is rejected when DepotInventory.available_units < 1 (would drive available_units negative)."
    error_id: ERR_NO_INVENTORY
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/reserve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- catalog / config (PlatformAdmin) ----
  - method: POST
    path: "/container-models"
    description: "Create a container size model."
    roles: [PlatformAdmin]
    code: 201
    input: ["size_code", "cubic_feet", "monthly_rate_cents", "delivery_fee_cents", "footprint_sqft"]
    output: ContainerModel
    side_effects: []
  - method: GET
    path: "/container-models"
    description: "List container models (paginated)."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?", "size_code?"]
    output: ContainerModel[]
    side_effects: []
  - method: GET
    path: "/container-models/{id}"
    description: "Get a container model."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: ContainerModel
    side_effects: []
  - method: POST
    path: "/protection-plans"
    description: "Create a contents-protection plan tier."
    roles: [PlatformAdmin]
    code: 201
    input: ["tier_code", "base_premium_cents", "rate_bps", "min_premium_cents", "coverage_cap_cents"]
    output: ProtectionPlan
    side_effects: []
  - method: GET
    path: "/protection-plans"
    description: "List protection plans (paginated)."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?", "tier_code?"]
    output: ProtectionPlan[]
    side_effects: []
  - method: GET
    path: "/protection-plans/{id}"
    description: "Get a protection plan."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: ProtectionPlan
    side_effects: []
  # ---- depots, inventory, crews, trucks ----
  - method: POST
    path: "/depots"
    description: "Create a depot."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "state_code", "service_radius_miles"]
    output: Depot
    side_effects: []
  - method: GET
    path: "/depots/{id}"
    description: "Get a depot."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: Depot
    side_effects: []
  - method: POST
    path: "/depot-inventory"
    description: "Create an inventory row tracking containers of one size at a depot."
    roles: [PlatformAdmin]
    code: 201
    input: ["depot_id", "size_code", "total_units"]
    output: DepotInventory
    side_effects: ["initialize reserved_units=0, committed_units=0, available_units=total_units (inventory_availability)"]
  - method: GET
    path: "/depot-inventory"
    description: "List inventory rows; filter by depot_id or size_code."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?", "depot_id?", "size_code?"]
    output: DepotInventory[]
    side_effects: []
  - method: GET
    path: "/depot-inventory/{id}"
    description: "Get an inventory row with live availability counts."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: DepotInventory
    side_effects: []
  - method: POST
    path: "/crews"
    description: "Create a delivery crew."
    roles: [PlatformAdmin]
    code: 201
    input: ["depot_id", "name", "setup_buffer_minutes?"]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Get a crew."
    roles: [PlatformAdmin, DispatchOperator]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews"
    description: "List crews; filter by depot_id (FK reverse-reachability for Crew.depot_id)."
    roles: [PlatformAdmin, DispatchOperator]
    code: 200
    input: ["limit?", "offset?", "depot_id?"]
    output: Crew[]
    side_effects: []
  - method: POST
    path: "/trucks"
    description: "Create a transport truck."
    roles: [PlatformAdmin]
    code: 201
    input: ["depot_id", "plate", "max_concurrent_containers?"]
    output: Truck
    side_effects: []
  - method: GET
    path: "/trucks/{id}"
    description: "Get a truck."
    roles: [PlatformAdmin, DispatchOperator]
    code: 200
    input: []
    output: Truck
    side_effects: []
  - method: GET
    path: "/trucks"
    description: "List trucks; filter by depot_id (FK reverse-reachability for Truck.depot_id)."
    roles: [PlatformAdmin, DispatchOperator]
    code: 200
    input: ["limit?", "offset?", "depot_id?"]
    output: Truck[]
    side_effects: []
  # ---- customers ----
  - method: POST
    path: "/customers"
    description: "Register a customer."
    roles: [PlatformAdmin, Customer]
    code: 201
    input: ["email", "full_name", "state_code"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer with computed ledger mirrors."
    roles: [PlatformAdmin, BillingClerk, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}/rental-agreements"
    description: "List a customer's rental agreements (FK reverse-reachability for RentalAgreement.customer_id)."
    roles: [PlatformAdmin, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []
  # ---- rental agreements (core) ----
  - method: POST
    path: "/rental-agreements"
    description: "Create a quote (QUOTED) for a customer at a depot for a size with protection selection."
    roles: [Customer, DispatchOperator]
    code: 201
    input: ["customer_id", "depot_id", "size_code", "protection_tier_code?", "declared_value_cents?", "proration_method?", "site_address", "site_clearance_sqft"]
    output: RentalAgreement
    side_effects: ["set lifecycle_status=QUOTED, billing_status=CURRENT"]
  - method: GET
    path: "/rental-agreements/{id}"
    description: "Get a rental agreement with both state dimensions and computed balances."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: []
  - method: GET
    path: "/rental-agreements"
    description: "List rental agreements; filter by customer_id or depot_id."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "depot_id?", "lifecycle_status?"]
    output: RentalAgreement[]
    side_effects: []
  - method: POST
    path: "/rental-agreements/{id}/reserve"
    description: "Reserve a container from inventory (QUOTED->RESERVED)."
    roles: [DispatchOperator]
    code: 200
    input: ["expected_agreement_version"]
    output: RentalAgreement
    side_effects: ["create ContainerUnit RESERVED; DepotInventory.reserved_units += 1 (inventory_availability)", "increments RentalAgreement.version by 1"]
  - method: POST
    path: "/rental-agreements/{id}/hold"
    description: "Place an ACTIVE agreement ON_HOLD (suspends monthly billing)."
    roles: [Customer]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["lifecycle_status ACTIVE->ON_HOLD", "increments RentalAgreement.version by 1"]
  - method: POST
    path: "/rental-agreements/{id}/resume"
    description: "Resume an ON_HOLD agreement (ON_HOLD->ACTIVE)."
    roles: [Customer]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["lifecycle_status ON_HOLD->ACTIVE", "increments RentalAgreement.version by 1"]
  - method: POST
    path: "/rental-agreements/{id}/request-closeout"
    description: "Begin closeout (ACTIVE->CLOSING)."
    roles: [Customer]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["lifecycle_status ACTIVE->CLOSING", "increments RentalAgreement.version by 1"]
  - method: POST
    path: "/rental-agreements/{id}/close"
    description: "Finalize and close (CLOSING->CLOSED) once unit RETURNED and balance settled."
    roles: [BillingClerk]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["lifecycle_status CLOSING->CLOSED; ContainerUnit RETURNED->RELEASED; DepotInventory.committed_units -= 1 (inventory_availability)", "recompute Customer.open_balance_cents (customer_payment_ledger)", "increments RentalAgreement.version by 1"]
  - method: POST
    path: "/rental-agreements/{id}/cancel"
    description: "Cancel a QUOTED or RESERVED agreement; releases a reserved unit if present (compensation)."
    roles: [Customer]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["lifecycle_status -> CANCELLED; RESERVED ContainerUnit -> RELEASED; DepotInventory.reserved_units -= 1 (inventory_availability)", "increments RentalAgreement.version by 1"]
  - method: POST
    path: "/rental-agreements/{id}/payments"
    description: "Post a customer payment against the agreement balance."
    roles: [Customer]
    code: 201
    input: ["amount_cents", "expected_agreement_version"]
    output: Charge
    side_effects: ["post PAYMENT Charge (negative); settle debits oldest-first (agreement_balance); billing_status PAST_DUE/DELINQUENT->CURRENT if balance==0", "recompute Customer.lifetime_paid_cents and open_balance_cents (customer_payment_ledger)", "increments RentalAgreement.version by 1"]
  - method: GET
    path: "/rental-agreements/{id}/charges"
    description: "List the agreement's ledger Charges (FK reverse-reachability for Charge.agreement_id), ordered created_at ASC."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?", "charge_type?"]
    output: Charge[]
    side_effects: []
  - method: GET
    path: "/rental-agreements/{id}/container-units"
    description: "List the agreement's container units (FK reverse-reachability for ContainerUnit.agreement_id)."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: ContainerUnit[]
    side_effects: []
  - method: GET
    path: "/rental-agreements/{id}/delivery-jobs"
    description: "List the agreement's delivery jobs (FK reverse-reachability for DeliveryJob.agreement_id)."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: DeliveryJob[]
    side_effects: []
  - method: GET
    path: "/rental-agreements/{id}/move-orders"
    description: "List the agreement's move orders (FK reverse-reachability for MoveOrder.agreement_id)."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: MoveOrder[]
    side_effects: []
  - method: GET
    path: "/rental-agreements/{id}/access-visits"
    description: "List the agreement's access visits (FK reverse-reachability for AccessVisit.agreement_id)."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: AccessVisit[]
    side_effects: []
  - method: GET
    path: "/rental-agreements/{id}/packing-supply-orders"
    description: "List the agreement's packing-supply orders (FK reverse-reachability for PackingSupplyOrder.agreement_id)."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: PackingSupplyOrder[]
    side_effects: []
  # ---- container units ----
  - method: GET
    path: "/container-units/{id}"
    description: "Get a container unit with current status and depot."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: ContainerUnit
    side_effects: []
  - method: GET
    path: "/container-units"
    description: "List container units; filter by depot_inventory_id, agreement_id, or current_depot_id (FK reverse-reachability for ContainerUnit.depot_inventory_id, agreement_id, current_depot_id)."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "depot_inventory_id?", "agreement_id?", "current_depot_id?"]
    output: ContainerUnit[]
    side_effects: []
  - method: POST
    path: "/container-units/{id}/return-to-depot"
    description: "Final closeout pickup: flip an ON_SITE unit to RETURNED while its agreement is CLOSING."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: ContainerUnit
    side_effects: ["status ON_SITE->RETURNED (requires parent RentalAgreement.lifecycle_status == CLOSING)"]
  # ---- delivery jobs ----
  - method: POST
    path: "/delivery-jobs"
    description: "Schedule a delivery (or redelivery) job on a crew window."
    roles: [DispatchOperator]
    code: 201
    input: ["agreement_id", "crew_id", "container_unit_id", "job_kind?", "window_start", "window_end"]
    output: DeliveryJob
    side_effects: ["validate placement clearance and crew window (ERR_INSUFFICIENT_CLEARANCE, ERR_CREW_WINDOW_CONFLICT)"]
  - method: GET
    path: "/delivery-jobs/{id}"
    description: "Get a delivery job."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: DeliveryJob
    side_effects: []
  - method: GET
    path: "/delivery-jobs"
    description: "List delivery jobs; filter by crew_id or agreement_id (FK reverse-reachability for DeliveryJob.crew_id and container_unit_id)."
    roles: [PlatformAdmin, DispatchOperator]
    code: 200
    input: ["limit?", "offset?", "crew_id?", "agreement_id?", "container_unit_id?"]
    output: DeliveryJob[]
    side_effects: []
  - method: POST
    path: "/delivery-jobs/{id}/complete"
    description: "Complete a delivery job; cascades activation (INITIAL_DELIVERY) or redelivery (REDELIVERY)."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: DeliveryJob
    side_effects: ["SCHEDULED->COMPLETED; INITIAL_DELIVERY cascades RentalAgreement RESERVED->ACTIVE (posts DELIVERY_FEE, RENTAL_PRORATION, PROTECTION_PREMIUM; recompute balances)", "REDELIVERY cascades ContainerUnit IN_TRANSIT->ON_SITE"]
  - method: POST
    path: "/delivery-jobs/{id}/cancel"
    description: "Cancel a scheduled delivery job."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: DeliveryJob
    side_effects: ["SCHEDULED->CANCELLED; frees the crew window"]
  # ---- move orders ----
  - method: POST
    path: "/move-orders"
    description: "Schedule a transport move on a truck; locks quoted_cost_cents (move_pricing) and posts MOVE Charge."
    roles: [DispatchOperator]
    code: 201
    input: ["agreement_id", "truck_id", "container_unit_id", "origin_depot_id", "destination_state_code", "distance_miles", "window_start", "window_end"]
    output: MoveOrder
    side_effects: ["compute move_class and quoted_cost_cents (move_pricing); validate truck capacity (ERR_TRUCK_CAPACITY_EXCEEDED); post MOVE Charge = quoted_cost_cents; recompute balance_due_cents (agreement_balance PROVISIONAL excludes it)"]
  - method: GET
    path: "/move-orders/{id}"
    description: "Get a move order with computed class and cost."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: MoveOrder
    side_effects: []
  - method: GET
    path: "/move-orders"
    description: "List move orders; filter by truck_id or agreement_id (FK reverse-reachability for MoveOrder.truck_id, container_unit_id, origin_depot_id)."
    roles: [PlatformAdmin, DispatchOperator]
    code: 200
    input: ["limit?", "offset?", "truck_id?", "agreement_id?", "container_unit_id?", "origin_depot_id?"]
    output: MoveOrder[]
    side_effects: []
  - method: POST
    path: "/move-orders/{id}/dispatch"
    description: "Dispatch a scheduled move (SCHEDULED->IN_TRANSIT)."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: MoveOrder
    side_effects: ["SCHEDULED->IN_TRANSIT; cascade ContainerUnit ON_SITE->IN_TRANSIT"]
  - method: POST
    path: "/move-orders/{id}/complete"
    description: "Complete an in-transit move (IN_TRANSIT->COMPLETED)."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: MoveOrder
    side_effects: ["IN_TRANSIT->COMPLETED; cascade ContainerUnit IN_TRANSIT->ON_SITE; if LONG_DISTANCE move current_depot_id and shift committed_units between DepotInventory rows (inventory_availability)"]
  - method: POST
    path: "/move-orders/{id}/cancel"
    description: "Cancel a scheduled move; reverses the MOVE Charge with a compensating ADJUSTMENT."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: MoveOrder
    side_effects: ["SCHEDULED->CANCELLED; post ADJUSTMENT Charge = -quoted_cost_cents; recompute balance_due_cents (agreement_balance)"]
  # ---- access visits ----
  - method: POST
    path: "/access-visits"
    description: "Request access to stored contents (on-site or depot pickup)."
    roles: [Customer]
    code: 201
    input: ["agreement_id", "container_unit_id", "access_kind?", "requested_for"]
    output: AccessVisit
    side_effects: ["set redelivery_required = (access_kind == DEPOT_PICKUP)"]
  - method: GET
    path: "/access-visits/{id}"
    description: "Get an access visit."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: AccessVisit
    side_effects: []
  - method: GET
    path: "/access-visits"
    description: "List access visits; filter by agreement_id or container_unit_id (FK reverse-reachability for AccessVisit.container_unit_id)."
    roles: [PlatformAdmin, DispatchOperator]
    code: 200
    input: ["limit?", "offset?", "agreement_id?", "container_unit_id?"]
    output: AccessVisit[]
    side_effects: []
  - method: POST
    path: "/access-visits/{id}/fulfill"
    description: "Fulfill an access visit; posts ACCESS_FEE; DEPOT_PICKUP moves unit IN_TRANSIT."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: AccessVisit
    side_effects: ["REQUESTED->FULFILLED; post ACCESS_FEE Charge; DEPOT_PICKUP cascades ContainerUnit ON_SITE->IN_TRANSIT and sets redelivery_required"]
  - method: POST
    path: "/access-visits/{id}/cancel"
    description: "Cancel a requested access visit."
    roles: [Customer]
    code: 200
    input: []
    output: AccessVisit
    side_effects: ["REQUESTED->CANCELLED"]
  # ---- packing supplies ----
  - method: POST
    path: "/packing-supply-orders"
    description: "Place a packing-supplies add-on order; computes subtotal/tax/total (packing_supplies_total) and posts a PACKING_SUPPLIES Charge."
    roles: [Customer]
    code: 201
    input: ["agreement_id", "lines", "tax_rate_bps?"]
    output: PackingSupplyOrder
    side_effects: ["compute subtotal_cents, tax_cents, total_cents (packing_supplies_total); post PACKING_SUPPLIES Charge = total_cents; recompute balance_due_cents (agreement_balance)"]
  - method: GET
    path: "/packing-supply-orders/{id}"
    description: "Get a packing-supply order."
    roles: [PlatformAdmin, DispatchOperator, BillingClerk, Customer]
    code: 200
    input: []
    output: PackingSupplyOrder
    side_effects: []
  # ---- billing sweep + clock (operator/test-driving) ----
  - method: POST
    path: "/_billing/run-late-sweep"
    description: "Test-driving / operator sweep: for every agreement, recompute days_overdue and post/escalate LATE_FEE Charges, advancing billing_status (late_fee)."
    roles: [BillingClerk]
    code: 200
    input: []
    output: null
    side_effects: ["per agreement: recompute days_overdue (late_fee); CURRENT->PAST_DUE posts tier1 LATE_FEE; PAST_DUE->DELINQUENT posts tier2 delta; recompute balance_due_cents"]
  - method: POST
    path: "/_billing/run-monthly-cycle"
    description: "Test-driving / operator sweep: post the next RENTAL_CYCLE Charge for every ACTIVE agreement whose last_charged_cycle_date precedes the current cycle (skips ON_HOLD)."
    roles: [BillingClerk]
    code: 200
    input: []
    output: null
    side_effects: ["per ACTIVE agreement: post RENTAL_CYCLE Charge = monthly_rate_cents + monthly_premium_cents; advance last_charged_cycle_date; recompute balance_due_cents"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC instant (drives due-date and overdue arithmetic)."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["server clock set to to_iso8601 for all subsequent created_at, due_date, and days_overdue computations"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role, or missing X-User-ID for an entity-backed role."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the endpoint, or Customer acting on an agreement whose customer_id != X-User-ID."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path or body-referenced resource does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad enum, negative integer, window_end<=window_start, or empty lines."
  - id: ERR_INVENTORY_ROW_MISSING
    http: 422
    condition: "No DepotInventory row exists for (depot_id, size_code), or a referenced ContainerUnit does not belong to the agreement."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in the from-state required by the requested transition."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_agreement_version does not equal the current RentalAgreement.version (OCC)."
  - id: ERR_INSUFFICIENT_CLEARANCE
    http: 422
    condition: "site_clearance_sqft < ContainerModel.footprint_sqft on an INITIAL_DELIVERY job."
  - id: ERR_DECLARED_VALUE_OVER_CAP
    http: 422
    condition: "declared_value_cents > selected ProtectionPlan.coverage_cap_cents at reserve."
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "Delivery window (extended by crew setup_buffer_minutes) overlaps another SCHEDULED job on the same crew."
  - id: ERR_TRUCK_CAPACITY_EXCEEDED
    http: 409
    condition: "Containers across overlapping SCHEDULED/IN_TRANSIT moves on the truck would exceed Truck.max_concurrent_containers."
  - id: ERR_OPEN_LOGISTICS
    http: 409
    condition: "request-closeout while a MoveOrder is SCHEDULED/IN_TRANSIT or a DeliveryJob is SCHEDULED."
  - id: ERR_BILLING_NOT_CURRENT
    http: 409
    condition: "hold requested while billing_status is PAST_DUE or DELINQUENT."
  - id: ERR_OUTSTANDING_BALANCE
    http: 409
    condition: "close requested while FINAL balance_due_cents > 0."
  - id: ERR_NO_INVENTORY
    http: 409
    condition: "reserve requested while DepotInventory.available_units < 1."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Owns rental agreements; can quote, hold/resume, request closeout, cancel, pay, order packing supplies, and request access on own agreements."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /rental-agreements/{id}/hold"
      - "POST /rental-agreements/{id}/resume"
      - "POST /rental-agreements/{id}/request-closeout"
      - "POST /rental-agreements/{id}/cancel"
      - "POST /rental-agreements/{id}/payments"
      - "POST /access-visits"
      - "POST /access-visits/{id}/cancel"
      - "POST /packing-supply-orders"
    shared_operations:
      - "POST /customers"
      - "POST /rental-agreements"
      - "GET /rental-agreements/{id} and its sub-resource lists (own agreements)"
      - "GET catalog/inventory reads"
  - name: DispatchOperator
    description: "Manages inventory draw, delivery, moves, and access fulfillment; cannot post payments or close agreements."
    identity: "opaque"
    exclusive_operations:
      - "POST /rental-agreements/{id}/reserve"
      - "POST /delivery-jobs and /complete and /cancel"
      - "POST /move-orders and /dispatch /complete /cancel"
      - "POST /access-visits/{id}/fulfill"
    shared_operations:
      - "POST /rental-agreements"
      - "GET reads across agreements, units, jobs, moves, visits, crews, trucks"
  - name: BillingClerk
    description: "Runs billing sweeps and finalizes closeouts; posts no inventory or logistics changes."
    identity: "opaque"
    exclusive_operations:
      - "POST /rental-agreements/{id}/close"
      - "POST /_billing/run-late-sweep"
      - "POST /_billing/run-monthly-cycle"
    shared_operations:
      - "GET reads across customers, agreements, charges"
  - name: PlatformAdmin
    description: "Seeds catalog, depots, inventory, crews, trucks, and controls the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /container-models"
      - "POST /protection-plans"
      - "POST /depots"
      - "POST /depot-inventory"
      - "POST /crews"
      - "POST /trucks"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /customers"
      - "GET reads (all)"
