      - name: job_advance_illegal_target_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BuildJob, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "advance with target_state BUYOFF_PASSED from IN_BUILD is not in the legal advance set (only BOOKED->IN_BUILD and BUYOFF_PASSED->READY_TO_SHIP are actor-driven; BUYOFF_PASSED is system-only) and fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["CLASS_103 job IN_BUILD (machine reservation in place)"]
          setup_api_calls:
            - call: "POST /customers"
