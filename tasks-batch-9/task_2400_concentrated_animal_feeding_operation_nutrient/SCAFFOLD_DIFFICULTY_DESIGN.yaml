              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/incident-reports"
              payload: { operation_id: "${op_id}", incident_type: "DISCHARGE", subject_storage_id: "${st_id}", discovered_at: "2026-08-10T06:00:00Z", description: "Berm seepage reached the county drainage ditch", released_gallons: 1500, reached_water: true }
              as: Operator
              as_user_id: "${op_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /cafo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T06:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /cafo/incident-reports/${inc_id}/record-oral-notification"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "IncidentReport.${inc_id}.requires_oral_notification == true"
            - "IncidentReport.${inc_id}.oral_notification_deadline_at == 2026-08-11T06:00:00Z and written_report_deadline_at == 2026-08-15T06:00:00Z"
            - "IncidentReport.${inc_id}.oral_notified_at == 2026-08-11T06:00:00Z"
            - "IncidentReport.${inc_id}.notification_late == false at exactly the deadline"
            - "IncidentReport.${inc_id}.incident_status == NOTIFIED"
            - "Operation.${op_id}.open_discharge_incident_count == 1 and compliance_posture == SUSPENDED"

