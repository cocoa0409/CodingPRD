  - method: POST
    path: "/program-proposals/{proposalId}/votes"
    entity: CommitteeVote
    purpose: "Cast one committee ballot on the proposal's current review_round. The author may not vote on their own proposal. Each accepted ballot increments the parent ProgramProposal.version, which is what makes a stale tally detectable."
    roles: [CommitteeMember]
    input: [member_volunteer_id, format_fit_score, diversity_score, quality_score, recommendation, "rationale?"]
    output: CommitteeVote
    status: 201
    errors: [ERR_VALIDATION, ERR_NOT_COMMITTEE_MEMBER, ERR_SELF_VOTE_FORBIDDEN, ERR_VOTER_INELIGIBLE, ERR_DUPLICATE_VOTE, ERR_PROPOSAL_NOT_IN_REVIEW, ERR_VOLUNTEER_NOT_FOUND, ERR_PROPOSAL_NOT_FOUND, ERR_UNAUTHORIZED]
