  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: stale_version_occ_on_amendment_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[amendment-create-stale-lease]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on LeaseAgreement.version: after amendment A1 is created (lease version advanced), a second create carrying the same expected_lease_version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["ACTIVE lease; client observes version l_v via GET"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "OCC Co", contact_email: "occ@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-9905", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "GET /lease-agreements/${l_id}", payload: {}, as: CustomerRep, as_user_id: "${c_id}", captures: { l_v: $.data.version } }
          trigger:
            - { call: "POST /lease-agreements/${l_id}/amendments", payload: { expected_lease_version: "${l_v}", proposed_throughput_fee_per_bbl: 0.55 }, as: CustomerRep, as_user_id: "${c_id}", captures: { am1_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/amendments", payload: { expected_lease_version: "${l_v}", proposed_min_monthly_throughput_bbl: 200 }, as: CustomerRep, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "first create succeeded: am1_id is a non-null UUID and LeaseAmendment.${am1_id}.base_lease_version == observed version"
            - "second create: err == ERR_STALE_VERSION and response status == 412"

      - name: amendment_approval_stale_base_rejected
        claim_type: version_pinning
        grounds: ["state_machines.LeaseAmendment.PROPOSED_to_APPROVED", "validations[priority=12]", "errors[ERR_AMENDMENT_STALE_BASE]"]
        distinguishing_aspect: "Approval is pinned to the lease version observed at proposal: A1 (base V) is rejected ERR_AMENDMENT_STALE_BASE once A2's creation advanced the lease; A2 (base V+1) approves and applies proposed_committed_capacity_bbl == 75000."
        test_recipe:
          setup: ["ACTIVE lease (committed_capacity_bbl 50000); amendments A1 then A2 proposed against consecutive versions"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Amend Co", contact_email: "am@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-9906", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "GET /lease-agreements/${l_id}", payload: {}, as: CustomerRep, as_user_id: "${c_id}", captures: { l_v1: $.data.version } }
            - { call: "POST /lease-agreements/${l_id}/amendments", payload: { expected_lease_version: "${l_v1}", proposed_throughput_fee_per_bbl: 0.55 }, as: CustomerRep, as_user_id: "${c_id}", captures: { am1_id: $.data.id } }
            - { call: "GET /lease-agreements/${l_id}", payload: {}, as: CustomerRep, as_user_id: "${c_id}", captures: { l_v2: $.data.version } }
            - { call: "POST /lease-agreements/${l_id}/amendments", payload: { expected_lease_version: "${l_v2}", proposed_committed_capacity_bbl: 75000 }, as: CustomerRep, as_user_id: "${c_id}", captures: { am2_id: $.data.id } }
          trigger:
            - { call: "POST /lease-amendments/${am1_id}/approve", payload: {}, as: TerminalManager, captures: { err: $.data.error_id } }
            - { call: "POST /lease-amendments/${am2_id}/approve", payload: {}, as: TerminalManager }
            - { call: "GET /lease-agreements/${l_id}", payload: {}, as: TerminalManager }
          assert:
            - "approve A1: err == ERR_AMENDMENT_STALE_BASE (base pinned at proposal no longer matches)"
            - "LeaseAmendment.${am1_id}.status remains PROPOSED"
            - "approve A2 succeeds: LeaseAmendment.${am2_id}.status == APPROVED"
            - "LeaseAgreement.${l_id}.committed_capacity_bbl == 75000 (proposal applied)"

