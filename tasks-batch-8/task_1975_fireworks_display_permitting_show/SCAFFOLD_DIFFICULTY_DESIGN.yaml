            - { call: "POST /pyro/displays/${ev}/weather-readings", payload: { wind_speed_mph: 5.0, gust_mph: 12.0, wind_direction_deg: 180, precipitation: false, source: "NWS" }, as: CrewMember, as_user_id: "${crew}" }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { ev_go_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/go-no-go", payload: { decision: "GO", expected_display_event_version: "${ev_go_v}" }, as: Operator, as_user_id: "${op}" }
          trigger:
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "EXPEND", quantity: 12, display_event_id: "${ev}" }, as: Operator, as_user_id: "${op}" }
            - { call: "GET /pyro/batches/${b1}", payload: {}, as: Operator, as_user_id: "${op}", captures: { m1: $.data.qty_at_magazine, s1: $.data.qty_at_show, e1: $.data.qty_expended } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "RETURN", quantity: 8, display_event_id: "${ev}" }, as: Operator, as_user_id: "${op}" }
            - { call: "GET /pyro/batches/${b1}", payload: {}, as: Operator, as_user_id: "${op}", captures: { m2: $.data.qty_at_magazine, s2: $.data.qty_at_show, e2: $.data.qty_expended, rem2: $.data.quantity_remaining } }
          assert:
            - "after CHECK_OUT 20: (qty_at_magazine, qty_at_show, qty_expended) == (30, 20, 0)"
            - "after EXPEND 12: (30, 8, 12); fired_count == 12 on the event"
            - "after RETURN 8: (38, 0, 12), quantity_remaining == 38"
            - "partition conserved at every step: 30+20+0 == 30+8+12 == 38+0+12 == 50 == quantity_units"
