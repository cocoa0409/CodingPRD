      - name: rubric_score_with_stale_observation_version_is_rejected_then_supersede_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rubric-score-create-stale-observation]
          - errors[ERR_STALE_OBSERVATION_VERSION]
          - entities.RubricScore.fields.observation_version_after
          - entities.RubricScore.fields.superseded
        distinguishing_aspect: "Re-posting the PLANNING domain with the version observed before the first score returns ERR_STALE_OBSERVATION_VERSION (412) and changes nothing; re-posting with the current version legitimately supersedes the earlier row and bumps the observation's version again."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one certified evaluator, one cycle, one CONDUCTED observation."
            - "One PLANNING rubric score already recorded, so the observation's version has advanced past the value captured at conduct."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
