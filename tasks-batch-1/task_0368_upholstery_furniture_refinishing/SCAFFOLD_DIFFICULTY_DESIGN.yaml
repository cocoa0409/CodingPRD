  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: production_blocked_by_ordered_materialorder
        grounds:
          - validations[priority=22]
          - state_machines.WorkOrder.APPROVED_to_IN_PRODUCTION
          - state_machines.MaterialOrder.ORDERED_to_RECEIVED
          - errors[ERR_MATERIALS_OUTSTANDING]
        distinguishing_aspect: |
          Entity pair WorkOrder->MaterialOrder: WorkOrder's APPROVED->IN_PRODUCTION transition is blocked
          while ANY MaterialOrder of the order is still ORDERED (ERR_MATERIALS_OUTSTANDING); receiving it
          unblocks the transition.
