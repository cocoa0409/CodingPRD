  # ===========================================================================
  - section: rbac
    instances:

      - name: analytics_role_cannot_perform_any_mutating_operation
        claim_type: Role denial
        grounds:
          - roles.Analytics
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The Analytics principal carries no exclusive or mutating operation, so a complex field-maintenance action is refused with 403 ERR_UNAUTHORIZED while its read endpoints still succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
          trigger:
            - call: "POST /camp-ops/complexes/${cx}/field-maintenance"
              payload: { maintenance_action: "CLOSED" }
              as: Analytics
              captures: { err: $.data.error_id }
            - call: "GET /camp-ops/complexes/${cx}"
              payload: {}
              as: Analytics
          assert:
            - "the mutating call returns status 403 with error_id ERR_UNAUTHORIZED"
            - "Complex.${cx}.field_maintenance_status is still OPEN"
            - "the read call returns status 200 with the Complex entity"

      - name: field_coordinator_cannot_create_a_community_agreement
        claim_type: Role denial
        grounds:
          - roles.FieldCoordinator
          - roles.CommunityLiaison
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Peer roles are exclusive: a FieldCoordinator cannot create a community agreement (a CommunityLiaison exclusive) and a CommunityLiaison cannot create a workout group."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
          trigger:
            - call: "POST /camp-ops/community-agreements"
              payload: { complex_id: "${cx}", stadium_name: "Sloan Park", lease_start_date: "2026-01-01T00:00:00Z", lease_end_date: "2026-03-31T23:59:59Z", annual_rent_cents: 250000, sponsorship_minor_league_base_cents: 100000, sponsorship_major_league_base_cents: 250000, ticket_price_cents: 400, ticket_sellout_capacity: 120 }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /camp-ops/complexes/${cx}/workout-groups"
              payload: { complex_id: "${cx}", roster_bucket: "MAJOR", group_name: "Pitchers Group A", facility_kind: "FIELD", capacity_units: 40 }
              as: CommunityLiaison
              captures: { err2: $.data.error_id }
          assert:
            - "the FieldCoordinator agreement create returns status 403 with error_id ERR_UNAUTHORIZED"
            - "the CommunityLiaison workout-group create returns status 403 with error_id ERR_UNAUTHORIZED"
            - "a GET on the complex by either role still succeeds because both are in its read roster"

      - name: a_player_may_only_acknowledge_their_own_invitation
        claim_type: Role denial
        grounds:
          - roles.Player
          - state_machines.CampInvitation.transitions.ISSUED_to_ACKNOWLEDGED
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The Player role is entity-backed, so a Player whose id does not match the invitation's player_id is refused with 403 ERR_UNAUTHORIZED while the owning player succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex with two players, each holding an issued invitation."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Owner Player", idp_number: "IDP-63101", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { p_own: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Other Player", idp_number: "IDP-63102", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { p_other: $.data.id }
            - call: "POST /camp-ops/players/${p_own}/camp-invitations"
              payload: { player_id: "${p_own}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /camp-ops/camp-invitations/${inv}/acknowledge"
              payload: {}
              as: Player
              as_user_id: "${p_other}"
              captures: { err: $.data.error_id }
            - call: "POST /camp-ops/camp-invitations/${inv}/acknowledge"
              payload: {}
              as: Player
              as_user_id: "${p_own}"
          assert:
            - "the other player's acknowledge returns status 403 with error_id ERR_UNAUTHORIZED"
            - "CampInvitation.${inv}.invitation_status is still ISSUED after the refusal"
            - "the owning player's acknowledge succeeds and sets invitation_status ACKNOWLEDGED"

      - name: roster_manager_cannot_break_a_player_out_of_camp
        claim_type: Role denial
        grounds:
          - roles.RosterManager
          - roles.MinorLeagueCoordinator
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Camp break-out logistics are exclusive to the MinorLeagueCoordinator, so a RosterManager's break-out call is refused with 403 even though it owns the initialize and finalize steps of the same record."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex with one finalized NRI_RELEASED roster record."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Breakout Role", idp_number: "IDP-63201", position_code: "OF", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/players/${pl}/roster-record"
              payload: { player_id: "${pl}" }
              as: RosterManager
              captures: { rr: $.data.id }
            - call: "POST /camp-ops/players/${pl}/roster-record/decide"
              payload: { decision_type: "NONROSTER_RELEASE" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl}/roster-record/finalize-decision"
              payload: {}
              as: RosterManager
              as_user_id: "rm-authorizer"
          trigger:
            - call: "POST /camp-ops/roster-records/${rr}/break-out-camp"
              payload: { level: "AAA" }
              as: RosterManager
              captures: { err: $.data.error_id }
            - call: "POST /camp-ops/roster-records/${rr}/break-out-camp"
              payload: { level: "AAA" }
              as: MinorLeagueCoordinator
          assert:
            - "the RosterManager break-out returns status 403 with error_id ERR_UNAUTHORIZED"
            - "the record is still NRI_RELEASED after the refusal"
            - "the MinorLeagueCoordinator break-out succeeds and sets current_roster_status ASSIGNED_AAA"

  # ===========================================================================
  - section: cross_cutting
    instances:

      - name: cascading_closure_depth_is_already_exercised
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Complex.transitions.NORMAL_to_CLOSED
          - state_machines.WorkoutGroup.transitions.PUBLISHED_to_DISBANDED
          - state_machines.GroupAssignment.transitions.PROVISIONAL_to_WITHDRAWN
        excluded_because:
          difficulty_instance: complex_closure_cascade_withdraws_assignments_disbands_groups_and_resets_profiles
