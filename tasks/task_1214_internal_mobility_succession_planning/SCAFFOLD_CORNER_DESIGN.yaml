        grounds: ["errors[ERR_NOT_REPORTING_MANAGER]"]
        excluded_because: { difficulty_instance: "foreign_manager_after_deadline_referential_beats_temporal", rationale: "Hold by a foreign manager asserts ERR_NOT_REPORTING_MANAGER (also covered in isolation by consent_by_wrong_manager_within_window_returns_not_reporting_manager)." }
