            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 20000, expected_work_order_version: "${wo_v2}" }, as: Auditor, as_user_id: "${aud}", captures: { al3: "$.data.id" } }
