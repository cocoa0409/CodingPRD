            - call: "POST /finops/allocation-runs/${run_id}/publish"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-2"
          assert:
            - "The first publish (by controller-1, the creator) returns ERR_SEGREGATION_OF_DUTIES with HTTP 403 (priority 50 wins)"
            - "The first publish does NOT return ERR_POOL_NOT_SEALED, even though SharedCostPool.${pool_id}.status == OPEN"
            - "The second publish (by controller-2) returns ERR_POOL_NOT_SEALED with HTTP 409 - the lower-priority rule only becomes observable once the SoD rule passes"
            - "AllocationRun.${run_id}.status is still COMPUTED_FINAL and published_by_user_id is still null after both refusals"
            - "No ChargebackInvoice was created: GET /finops/chargeback-invoices?allocation_run_id=${run_id} returns total_count == 0"
