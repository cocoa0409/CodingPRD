  - section: rbac
    instances:

      - name: role_exclusive_writes_are_rejected_for_every_other_role
        claim_type: peer_roles
        grounds:
          - roles.RecruitingCoordinator.exclusive_operations
          - roles.ConflictsCounsel.exclusive_operations
          - roles.CommitteeChair.exclusive_operations
          - roles.Candidate.exclusive_operations
          - roles.SystemAdmin.exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          §1.7 declares five roles with DISJOINT exclusive_operations sets, and the cheapest
          wrong implementation is a single 'any authenticated writer' gate that passes every
          happy-path test in the suite. Seven probes cross the boundaries in seven different
          directions - a chair reaching for the coordinator's approach, a coordinator reaching
          for the conflicts desk and for the candidate's own book, counsel reaching for
          diligence review and for offer drafting, a chair reaching for the admin's freeze -
          and each must be 403 ERR_UNAUTHORIZED rather than 401 (the role IS recognised) and
          rather than 404 (every path resolves). Every probe also targets a row whose state
          would otherwise permit the call, so no refusal can be blamed on rung 7.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup, one SearchFirm and one ACTIVE SearchFirmEngagement."
            - "One Candidate in DILIGENCE whose LateralQuestionnaire is SUBMITTED with one ACTIVE ClientBookEntry 'Northwind Holdings' carrying three VERIFIED HISTORICAL records."
