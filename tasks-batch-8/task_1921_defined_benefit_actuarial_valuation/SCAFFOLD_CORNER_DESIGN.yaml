      assert:
      - AssetStatement.${stmt_id}.market_value_end == 100000.00 (50000 + 10000 - 3000 + 43000 roll-forward)
      - AssetValuation.${av_id}.unrecognized_gain == 27000.00 (2/3 x 40500)
      - AssetValuation.${av_id}.smoothed_value == 80000.00 (pre-corridor 73000.00 clamped UP to the 0.80 x 100000 floor)
