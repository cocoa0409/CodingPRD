      - name: deduction_settle_gated_on_customer_trading_status_corner_stub_validations
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_53
          - entities.Customer.fields.trading_status
        excluded_because:
          difficulty_instance: deduction_settle_gated_on_customer_trading_status
          rationale: |
            The cross_entity_validation corner is priority 53 reading a sibling aggregate root:
            settling a deduction depends on the Customer's trading_status, not on anything in
            the deduction or its promotion. The difficulty instance drives that gate from both
            sides — settle succeeds at ACTIVE and fails at CREDIT_HOLD with
            ERR_CUSTOMER_CREDIT_HOLD — on one fixture.

  - section: endpoints
    instances:
      - name: program_create_read_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/trade-marketing/programs
          - endpoints.GET_/trade-marketing/programs/{programId}
          - endpoints.GET_/trade-marketing/programs
        distinguishing_aspect: |
          The create response, the single read and the filtered list must all agree on the
          same row, and the fiscal_year filter must exclude the sibling program: two programs
          exist but GET /programs?fiscal_year=2026 returns exactly one.
        test_recipe:
          setup:
            - "An empty ledger with the clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
          trigger:
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_2026_id: $.data.id, created_status: $.data.status }
            - call: "POST /trade-marketing/programs"
