              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-09-30T00:00:00.000Z", planned_input_kg: 50.0 }
              as: PlantOperator
