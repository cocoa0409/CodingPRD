              as: RevenueManager
            - call: "POST /sailings/${sail_p}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_a: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_b: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cy Danes", email: "cy@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_c: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_p}", cabin_category_id: "${cat_ia}", guest_id: "${g_a}", occupancy_adults: 1 }
              as: ReservationAgent
              captures: { bk_p1: $.data.id }
            - call: "GET /sailings/${sail_p}"
              payload: {}
              as: RevenueManager
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_p}", cabin_category_id: "${cat_ia}", guest_id: "${g_b}", occupancy_adults: 2 }
