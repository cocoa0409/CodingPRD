              payload: {}
              as: TelematicsIngest
          trigger:
            - call: "POST /api/litigation-holds"
              payload: { fleet_id: "${fleet_id}", scope: "EVENT", event_id: "${ev_hc}", reason: "subpoena expected" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { hold_hc: $.data.id }
            - call: "POST /api/footage-clips/${cl_hc}/purge"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { purge_err: $.data.error_id }
          assert:
            - "FootageClip.${cl_hc}.retention_class == LITIGATION_HOLD  (cascade link 1)"
            - "purge_err == ERR_LITIGATION_HOLD_ACTIVE with HTTP 409  (cascade link 2: the reclassified clip now rejects purge)"
            - "FootageClip.${cl_hc}.upload_status == UPLOADED (purge did not happen)"
            - "Fleet.${fleet_id}.retention_used_mb == 5 (bytes unchanged by the hold)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_privacy_business_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_INVALID_STATE
          - errors.ERR_INWARD_FOOTAGE_RESTRICTED
        distinguishing_aspect: |
          Pair state(6) vs business_safety(7): a CONFIRM attempted on an
          already-DISMISSED event whose only clip is INWARD and which has just
          become inward-restricted by a policy swap must return
          ERR_INVALID_STATE, not ERR_INWARD_FOOTAGE_RESTRICTED.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup with policy P1 ACTIVE (inward enabled); event with an INWARD clip IN_REVIEW, then DISMISSED; a second policy P2 (inward_capture_enabled false) created and activated, so the inward gate would now fail."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "DISTRACTION", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_pp: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_pp}", camera_angle: "INWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_pp: $.data.id }
            - call: "POST /api/footage-clips/${cl_pp}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_pp}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_pp}"
              payload: {}
              as: SafetyManager
              captures: { ev_pp_v: $.data.version }
            - call: "POST /api/safety-events/${ev_pp}/review"
              payload: { action: "DISMISS", rationale: "not actionable", expected_event_version: "${ev_pp_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { ev_pp_v2: $.data.version }
            - call: "POST /api/camera-policies"
              payload: { fleet_id: "${fleet_id}", name: "Privacy-First Policy", retention_days_standard: 30, retention_days_collision: 180, daily_upload_cap_mb: 100, inward_capture_enabled: false, distraction_detection_enabled: true, seatbelt_detection_enabled: true, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol2_id: $.data.id }
            - call: "POST /api/camera-policies/${pol2_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/safety-events/${ev_pp}/review"
              payload: { action: "CONFIRM", rationale: "reconsidered", expected_event_version: "${ev_pp_v2}" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { err_pp: $.data.error_id }
          assert:
            - "HTTP 409 and err_pp == ERR_INVALID_STATE  (DISMISSED has no CONFIRM transition; state check at priority 6 wins)"
            - "err_pp != ERR_INWARD_FOOTAGE_RESTRICTED  (the priority-7 privacy gate never runs)"
            - "SafetyEvent.${ev_pp}.status == DISMISSED and review_count == 1"

      - name: temporal_error_beats_referential_eligibility
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_EXONERATION_WINDOW_EXPIRED
          - errors.ERR_CLAIM_REQUIRES_CONFIRMED_COLLISION
        distinguishing_aspect: |
          Pair business_temporal(8) vs business_referential(9): a claim filed 31
          days after confirmation on a CONFIRMED but non-COLLISION event must
          return ERR_EXONERATION_WINDOW_EXPIRED, not
          ERR_CLAIM_REQUIRES_CONFIRMED_COLLISION.
        test_recipe:
          setup:
            - "Base setup; one MEDIUM HARSH_BRAKE event CONFIRMED at clock 2026-09-01T00:00:00Z; clock then advanced 31 days."
          setup_api_calls:
