          setup:
            - "The SOLARIS 120-room conversion OPEN since 2026-11-01 at royalty 5.25 / marketing 2.50."
            - "Two surviving revenue periods: 2026-11 on 320000.16 (31000.01) and 2026-12 on 480000.16 (47000.01), ledger total 78000.02."
            - "The owner's auditor finds that November double-counted a group block; the restated figure is 250000.00."
