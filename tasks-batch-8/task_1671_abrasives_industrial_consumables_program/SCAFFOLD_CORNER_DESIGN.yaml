              payload: { customer_ref: "PLANT-CX", contract_number: "C-CX", term_start: "2026-01-01", term_end: "2026-08-01", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
              captures: { c_st0: $.data.status }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { swept: $.data.contracts_expired }
            - call: "GET /api/contracts/${c_id}"
              as: ProgramAdmin
              captures: { c_st1: $.data.status }
          assert:
            - "Contract is ACTIVE after activation at clock 2026-08-01 (term_end 2026-08-01 not yet passed)"
            - "At clock 2026-08-02: contracts_expired == 1 and Contract.status == EXPIRED"

      - name: release_on_hold_pick_and_create_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Release.SCHEDULED_to_ON_HOLD"
          - "errors[ERR_SUBSTITUTION_PENDING]"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "While a blanket order's substitution is PENDING, new releases are rejected with ERR_SUBSTITUTION_PENDING and its ON_HOLD releases cannot be picked (ERR_INVALID_STATE_TRANSITION)."
        test_recipe:
          setup: ["Products P1/P2; contract ACTIVE with lines for both; blanket order for P1 committed 50 OPEN; release qty 5 SCHEDULED; P1 discontinued with replacement P2 (order PENDING, release ON_HOLD)"]
          setup_api_calls:
