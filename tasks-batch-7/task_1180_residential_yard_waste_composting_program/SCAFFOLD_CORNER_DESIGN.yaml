        distinguishing_aspect: "Boundary on spend vs budget: audience 1000 x 100 cents == budget 100000 launches (<=); audience 1001 x 100 = 100100 > budget fails with ERR_CAMPAIGN_BUDGET_EXCEEDED."
        test_recipe:
          setup: ["two DRAFT campaigns: C1 budget 100000 audience 1000 cost 100; C2 budget 100000 audience 1001 cost 100"]
          setup_api_calls:
