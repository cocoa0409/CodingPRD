      - name: system_fields_are_server_stamped_and_version_increments_on_every_write
        claim_type: system_fields
        grounds:
          - entities.SponsorshipProgram
          - endpoints.POST /sharps/sponsors/{id}/programs
          - endpoints.POST /sharps/programs/{id}/funding-adjustments
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: "created_at freezes at the creation instant while updated_at re-reads the logical clock on the funding adjustment (2026-08-01T00:00:00Z vs 2026-08-05T09:30:00Z) and version goes 1 -> 2; an implementation that stamps wall-clock time or leaves version at 1 fails."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; MANUFACTURER sponsor with program NW-2026 (500000-cent ceiling, 5000-cent per-kit allowance) created at that instant."
            - "Clock then advanced to 2026-08-05T09:30:00Z with no other writes in between."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog_nw: $.data.id, prog_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sharps/programs/${prog_nw}/funding-adjustments"
              payload: { delta_cents: 10000, expected_program_version: "${prog_v1}", memo: "Q3 top-up" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
          assert:
            - "HTTP status == 200"
            - "${prog_v1} == 1"
            - "SponsorshipProgram.${prog_nw}.version == 2"
            - "SponsorshipProgram.${prog_nw}.created_at == \"2026-08-01T00:00:00Z\""
            - "SponsorshipProgram.${prog_nw}.updated_at == \"2026-08-05T09:30:00Z\""
            - "SponsorshipProgram.${prog_nw}.funding_ceiling_cents == 510000"
            - "SponsorshipProgram.${prog_nw}.available_cents == 510000"
            - "SponsorshipProgram.${prog_nw}.reserved_cents == 0 and SponsorshipProgram.${prog_nw}.committed_cents == 0"
            - "SponsorshipProgram.${prog_nw}.status == \"ACTIVE\""
            - "SponsorshipProgram.${prog_nw}.id is unchanged from the creation response"
            - "GET /sharps/ledger-entries?sponsorship_program_id=${prog_nw} returns exactly 1 entry with entry_type == \"FUNDING_ADJUSTMENT\", amount_cents == 10000, sequence_no == 1"

