              as: Reporter
              as_user_id: "${rep}"
              captures: { rvw: $.data.id }
            - call: "POST /standards-desk/review-assignments"
              payload: { review_id: "${rvw}", reviewer_id: "${rev}", starts_at: "2026-08-03T09:00:00Z", ends_at: "2026-08-03T10:00:00Z", expected_reviewer_version: "${rev_v1}" }
              as: StandardsEditor
              as_user_id: "${sed}"
              captures: { asg: $.data.id }
