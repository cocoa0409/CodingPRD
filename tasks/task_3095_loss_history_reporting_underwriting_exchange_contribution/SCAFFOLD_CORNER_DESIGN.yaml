            - call: "POST /carriers/${cb2_id}/inquiries"
              payload: { subject_name: "Fay Farrell", subject_dob: "1979-06-17", subject_address: "24 Fern St, Denton TX", subject_driver_license: "FAY2-1", permissible_purpose: "UNDERWRITING" }
