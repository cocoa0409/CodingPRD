scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc: two calculations whose two valid readings
  # diverge, on DIFFERENT entity domains (Quote costing vs RentalRamp pricing).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_per_line_vs_aggregate_rounding_divergence
        grounds:
          - calculations.quote_total_calculation
          - entities.QuoteLineItem.fields.extended_price_cents
          - entities.Quote.fields.subtotal_cents
          - entities.Quote.fields.total_cents
        distinguishing_aspect: |
          On the Quote entity domain, quote_total_calculation pins
          line_item_rounding (round each extended_price_cents before summing);
          the aggregate_rounding variant (sum raw quantity*price, then round)
          yields 1332/1465 for the same inputs, while the pinned per-line order
          yields 1333/1466 — a 1-cent divergence on subtotal and total.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case in ASSESSED state with one COMPLETED INITIAL assessment"
            - "DRAFT Quote exists with contingency_pct 10.0 (default)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Dana Cole", client_address: "11 Ramp Way", client_phone: "555-0101" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-100", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 2 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 50, hazard_count: 2, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", expected_case_version: "${case_v}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Aluminum panel A", quantity: 1.5, unit: "sqft", unit_price_cents: 333, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
              captures: { line_a_ext: $.data.extended_price_cents }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Aluminum panel B", quantity: 2.5, unit: "sqft", unit_price_cents: 333, tax_rate_pct: 0.0, sort_order: 2 }
              as: ProjectManager
              captures: { line_b_ext: $.data.extended_price_cents }
            - call: "GET /cases/${case_id}/quotes/${quote_id}"
              as: Any
          assert:
            - "QuoteLineItem A extended_price_cents == 500 (round_half_up(1.5*333=499.5) per line)"
            - "QuoteLineItem B extended_price_cents == 833 (round_half_up(2.5*333=832.5) per line)"
            - "Quote.${quote_id}.material_cost_cents == 1333"
            - "Quote.${quote_id}.subtotal_cents == 1333 (aggregate-rounding variant would give 1332)"
            - "Quote.${quote_id}.contingency_cents == 133 (round_half_up(1333*0.10))"
            - "Quote.${quote_id}.total_cents == 1466 (aggregate-rounding variant would give 1465)"

      - name: rental_calendar_month_vs_fixed_block_duration_divergence
        grounds:
          - calculations.rental_rate_calculation
          - entities.RentalRamp.fields.monthly_rate_cents
          - entities.RentalRamp.fields.deposit_cents
        distinguishing_aspect: |
          On the RentalRamp/InventoryUnit entity domain (distinct from instance
          1's Quote domain), rental_rate_calculation's tier table reads
          duration in calendar months: 2026-05-01 to 2026-08-01 is exactly
          3 months -> tier 1 (100% of base). A fixed 30-day-block reading
          yields 92/30 = 3.07 -> 4 months -> tier 2 (90%), i.e. 27000 vs the
          pinned calendar-month result 30000.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "InventoryUnit with monthly_rate_cents 30000, purchase_price_cents 500000, status AVAILABLE"
            - "Case in INTAKE state (no assessments, so purchase_required is not indicated)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /inventory-units"
              payload: { unit_tag: "U-100", ramp_type: "MODULAR_ALUMINUM", length_feet: 24, width_inches: 36, weight_capacity_lbs: 800, monthly_rate_cents: 30000, purchase_price_cents: 500000 }
              as: LogisticsCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /cases"
              payload: { client_name: "Eli Ford", client_address: "22 Slope Rd", client_phone: "555-0102" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/rental-ramps"
              payload: { inventory_unit_id: "${unit_id}", rental_start: "2026-05-01T00:00:00Z", rental_end: "2026-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ramp_id: $.data.id }
            - call: "GET /cases/${case_id}/rental-ramps/${ramp_id}"
              as: Any
          assert:
            - "RentalRamp.${ramp_id}.monthly_rate_cents == 30000 (calendar-month tier 1; 30-day-block reading would give 27000)"
            - "RentalRamp.${ramp_id}.deposit_cents == 60000 (min(2*30000, 500000*0.20))"
            - "RentalRamp.${ramp_id}.status == RESERVED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rental_tiered_rate_with_deposit_cap_interaction
        grounds:
          - calculations.rental_rate_calculation
          - entities.InventoryUnit.fields.monthly_rate_cents
          - entities.InventoryUnit.fields.purchase_price_cents
        distinguishing_aspect: |
          Mode (a) — three-plus inputs with non-linear interaction: duration
          (5 months) selects tier 2 (0.90 multiplier) against base rate 30000,
          and the deposit then passes through nested min(2*27000=54000,
          100000*0.20=20000) so the purchase-price cap branch wins at 20000;
          changing any one of base rate, duration, or purchase price moves the
          result non-linearly.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "InventoryUnit base rate 30000, purchase price 100000, AVAILABLE"
            - "Case in INTAKE state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /inventory-units"
              payload: { unit_tag: "U-200", ramp_type: "PORTABLE_THRESHOLD", length_feet: 8, width_inches: 32, weight_capacity_lbs: 600, monthly_rate_cents: 30000, purchase_price_cents: 100000 }
              as: LogisticsCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /cases"
              payload: { client_name: "Fran Gila", client_address: "33 Threshold Ln", client_phone: "555-0103" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/rental-ramps"
              payload: { inventory_unit_id: "${unit_id}", rental_start: "2026-05-01T00:00:00Z", rental_end: "2026-10-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ramp_id: $.data.id }
          assert:
            - "RentalRamp.${ramp_id}.monthly_rate_cents == 27000 (round_half_up(30000*0.90), tier 2 for 4-6 months)"
            - "RentalRamp.${ramp_id}.deposit_cents == 20000 (purchase-price cap branch: min(54000, 20000))"

      - name: quote_tax_rounded_per_line_before_subtotal
        grounds:
          - calculations.quote_total_calculation
          - entities.QuoteLineItem.fields.tax_cents
          - entities.Quote.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters, distinct from
          instance 1's mode (a): the scaffold pins round-per-line for
          tax_cents, so two 105-cent lines at 10% produce tax 11+11=22, while
          the sum-then-round order produces round_half_up(210*0.10)=21; the
          pinned order MUST yield 22.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case in ASSESSED state"
            - "DRAFT Quote exists (contingency default 10.0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Gus Hale", client_address: "44 Grab Bar St", client_phone: "555-0104" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "caps-200", assessor_role: "CAPS", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 40, hazard_count: 3 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 40, hazard_count: 3, recommended_modifications: ["GRAB_BARS"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", expected_case_version: "${case_v}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "LABOR", description: "Install hour", quantity: 1, unit: "hour", unit_price_cents: 105, is_taxable: true, tax_rate_pct: 10.0, sort_order: 1 }
              as: ProjectManager
              captures: { line_a_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Anchors", quantity: 1, unit: "each", unit_price_cents: 105, is_taxable: true, tax_rate_pct: 10.0, sort_order: 2 }
              as: ProjectManager
              captures: { line_b_id: $.data.id }
            - call: "GET /cases/${case_id}/quotes/${quote_id}"
              as: Any
          assert:
            - "QuoteLineItem.${line_a_id}.tax_cents == 11 (round_half_up(105*0.10)=round_half_up(10.5))"
            - "QuoteLineItem.${line_b_id}.tax_cents == 11"
            - "Sum of per-line tax_cents == 22 (sum-then-round order would give 21)"
            - "Quote.${quote_id}.subtotal_cents == 210"
            - "Quote.${quote_id}.contingency_cents == 21"
            - "Quote.${quote_id}.total_cents == 231"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: cycle (InventoryUnit) and branching
  # fork-join with divergent side effects (Quote), on different entities.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: inventory_unit_maintenance_deployment_cycle
        grounds:
          - state_machines.InventoryUnit.AVAILABLE_to_MAINTENANCE
          - state_machines.InventoryUnit.MAINTENANCE_to_AVAILABLE
          - state_machines.InventoryUnit.AVAILABLE_to_RESERVED
          - state_machines.InventoryUnit.RESERVED_to_DEPLOYED
        distinguishing_aspect: |
          InventoryUnit has a true cycle AVAILABLE -> MAINTENANCE -> AVAILABLE
          followed by re-entry into AVAILABLE -> RESERVED -> DEPLOYED; the same
          unit must be re-eligible for reservation after completing the
          maintenance loop, which no linear pipeline can express.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "InventoryUnit created (AVAILABLE)"
            - "Case exists (INTAKE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /inventory-units"
              payload: { unit_tag: "U-300", ramp_type: "SUITCASE", length_feet: 6, width_inches: 30, weight_capacity_lbs: 500, monthly_rate_cents: 20000, purchase_price_cents: 400000 }
              as: LogisticsCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /cases"
              payload: { client_name: "Hana Ives", client_address: "55 Loop Ave", client_phone: "555-0105" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /inventory-units/${unit_id}/maintenance"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /inventory-units/${unit_id}"
              as: Any
              captures: { unit_status_maint: $.data.status }
            - call: "POST /inventory-units/${unit_id}/return-to-service"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /inventory-units/${unit_id}"
              as: Any
              captures: { unit_status_back: $.data.status }
            - call: "POST /cases/${case_id}/rental-ramps"
              payload: { inventory_unit_id: "${unit_id}", rental_start: "2026-05-01T00:00:00Z", rental_end: "2026-06-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ramp_id: $.data.id }
            - call: "GET /inventory-units/${unit_id}"
              as: Any
              captures: { unit_status_reserved: $.data.status }
            - call: "POST /cases/${case_id}/rental-ramps/${ramp_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /inventory-units/${unit_id}"
              as: Any
              captures: { unit_status_deployed: $.data.status }
          assert:
            - "InventoryUnit status after maintenance == MAINTENANCE"
            - "InventoryUnit status after return-to-service == AVAILABLE (cycle closes)"
            - "InventoryUnit status after rental create == RESERVED (unit re-enters the cycle)"
            - "InventoryUnit status after deliver == DEPLOYED"
            - "RentalRamp.${ramp_id}.status == DELIVERED"

      - name: quote_review_fork_approve_commit_vs_reject_release
        grounds:
          - state_machines.Quote.UNDER_REVIEW_to_APPROVED
          - state_machines.Quote.UNDER_REVIEW_to_REJECTED
          - state_machines.FundingAllocation.PENDING_to_COMMITTED
        distinguishing_aspect: |
          Quote has a branching fork at UNDER_REVIEW with divergent
          side-effect sets: APPROVED commits all PENDING FundingAllocations and
          decrements FundingSource.remaining_cents, whereas REJECTED releases
          them and leaves remaining_cents unchanged; this instance exercises
          the APPROVED branch and asserts the commit-specific effects.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case ASSESSED; DRAFT quote with one MATERIAL line 1 x 30000, contingency_pct 0.0 (total 30000)"
            - "FundingSource APPROVED with approved_cents 50000 (remaining 50000)"
            - "Quote SUBMITTED and UNDER_REVIEW; PENDING QUOTE_LEVEL allocation of 30000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Ira Judd", client_address: "66 Fork Blvd", client_phone: "555-0106" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-300", assessor_role: "BOTH", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 55, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 55, hazard_count: 1, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", contingency_pct: 0.0, expected_case_version: "${case_v1}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Ramp kit", quantity: 1, unit: "each", unit_price_cents: 30000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "VA_BENEFIT", program_name: "VA HISA", requested_cents: 50000, priority_rank: 1 }
              as: FundingCoordinator
              captures: { fs_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/approve"
              payload: { approved_cents: 50000, expected_case_version: "${case_v2}" }
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/quotes/${quote_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /cases/${case_id}/quotes/${quote_id}/start-review"
              payload: {}
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/allocations"
              payload: { quote_id: "${quote_id}", amount_cents: 30000, allocation_type: "QUOTE_LEVEL" }
              as: FundingCoordinator
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/quotes/${quote_id}/approve"
              payload: {}
              as: FundingCoordinator
            - call: "GET /cases/${case_id}/quotes/${quote_id}"
              as: Any
            - call: "GET /cases/${case_id}/funding-sources/${fs_id}"
              as: Any
          assert:
            - "Quote.${quote_id}.status == APPROVED"
            - "Quote.${quote_id}.decided_at is set (non-null)"
            - "FundingAllocation.${alloc_id}.status == COMMITTED"
            - "FundingAllocation.${alloc_id}.committed_at is set (non-null)"
            - "FundingSource.${fs_id}.remaining_cents == 20000 (50000 - 30000; the REJECTED branch would leave it 50000)"

  # ===========================================================================
  # Rule 4 — transitive_cascade: depth-3 chain from inspection pass;
  # depth-2 chain from case cancel. Different triggering transitions.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_pass_cascades_job_case_warranty
        grounds:
          - state_machines.Inspection.PENDING_to_PASSED
          - state_machines.Case.INSTALLED_to_INSPECTED
          - state_machines.Case.INSPECTED_to_WARRANTY_ACTIVE
          - state_machines.InstallationJob.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Depth-3 transitive chain originating from POST inspections/pass:
          Inspection PENDING->PASSED causes InstallationJob.inspection_status
          ->PASSED and Case ->INSPECTED (link 1), and the INSPECTED entry
          itself triggers Case ->WARRANTY_ACTIVE (link 2), each hop caused by
          the previous link rather than by the original call in parallel.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case fully funded (approved 20000 == quote total 20000) with quote APPROVED"
            - "InstallationJob COMPLETED (actual_end set) via order-materials -> start -> punch-list -> complete"
            - "FINAL Inspection scheduled for 2026-05-02 against the completed job, status PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Jules Karr", client_address: "77 Cascade Ct", client_phone: "555-0107" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-400", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 45, hazard_count: 4 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 45, hazard_count: 4, recommended_modifications: ["RAMP", "RAILS"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", contingency_pct: 0.0, expected_case_version: "${case_v1}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Ramp system", quantity: 2, unit: "each", unit_price_cents: 10000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "MEDICAID_WAIVER", program_name: "HCBS Waiver", requested_cents: 20000, priority_rank: 1 }
              as: FundingCoordinator
              captures: { fs_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/approve"
              payload: { approved_cents: 20000, expected_case_version: "${case_v2}" }
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/quotes/${quote_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /cases/${case_id}/quotes/${quote_id}/start-review"
              payload: {}
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/allocations"
              payload: { quote_id: "${quote_id}", amount_cents: 20000, allocation_type: "QUOTE_LEVEL" }
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/quotes/${quote_id}/approve"
              payload: {}
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/installation-jobs"
              payload: { quote_id: "${quote_id}", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-10T00:00:00Z", crew_lead_id: "crew-1" }
              as: ProjectManager
              captures: { job_id: $.data.id }
            - call: "POST /cases/${case_id}/installation-jobs/${job_id}/order-materials"
              payload: {}
              as: ProjectManager
            - call: "POST /cases/${case_id}/installation-jobs/${job_id}/start"
              payload: {}
              as: CrewLead
            - call: "POST /cases/${case_id}/installation-jobs/${job_id}/punch-list"
              payload: {}
              as: CrewLead
            - call: "POST /cases/${case_id}/installation-jobs/${job_id}/complete"
              payload: {}
              as: CrewLead
