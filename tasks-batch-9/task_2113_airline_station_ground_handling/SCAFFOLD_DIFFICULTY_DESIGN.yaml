              as: DutyOfficer
              captures: { err_at_bound: $.data.error_id }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:49:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
              captures: { ok_id: $.data.id, ok_minutes: $.data.occupied_minutes, ok_status: $.data.status }
          assert:
            - "${err_at_bound} == ERR_CERT_NOT_CURRENT"
            - "HTTP status of the window_start == expires_at attempt is 422"
            - "${ok_status} == RESERVED"
            - "${ok_minutes} == 41"
            - "Turn.${t1_id}.assigned_agent_count == 1"
            - "Turn.${t1_id}.status == SCHEDULED"
            - "Agent.${a1_id}.assigned_duty_minutes == 41"

      - name: staffing_coverage_inclusive_boundary_at_100_pct
        grounds:
