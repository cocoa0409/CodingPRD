              payload: { source_assessment_id: "${assess_a}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${wa_ver}" }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { plan_1: $.data.id }
            - call: "POST /descent-plans/${plan_1}/certify"
              payload: {}
              as: StateOffice
              captures: { p1_milestones: $.data.milestone_count }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T12:00:00Z" }
              as: StateOffice
            - call: "POST /seasons/${season_id}/compliance-run"
              payload: {}
              as: StateOffice
            - call: "GET /descent-plans/${plan_1}"
              payload: {}
              as: StateOffice
              captures: { s1_status: $.data.status, s1_missed: $.data.missed_milestone_count, s1_breaches: $.data.breach_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T12:00:00Z" }
              as: StateOffice
            - call: "POST /seasons/${season_id}/compliance-run"
              payload: {}
              as: StateOffice
            - call: "GET /descent-plans/${plan_1}"
              payload: {}
              as: StateOffice
              captures: { s2_status: $.data.status, s2_missed: $.data.missed_milestone_count, s2_breaches: $.data.breach_count }
            - call: "POST /descent-plans/${plan_1}/revise"
              payload: { plan_start_date: "2026-11-16" }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { rev_status: $.data.status, rev_missed: $.data.missed_milestone_count, rev_count: $.data.revision_count }
            - call: "GET /descent-plans/${plan_1}/milestones"
              payload: {}
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { m2_index: "$.data[2].week_index", m2_date: "$.data[2].effective_date", m2_weight: "$.data[2].allowable_weight_lbs", m7_date: "$.data[7].effective_date", m7_weight: "$.data[7].allowable_weight_lbs" }
            - call: "POST /seasons/${season_id}/compliance-run"
              payload: {}
              as: StateOffice
            - call: "GET /descent-plans/${plan_1}"
              payload: {}
              as: StateOffice
              captures: { s3_status: $.data.status, s3_missed: $.data.missed_milestone_count, s3_breaches: $.data.breach_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-16T12:00:00Z" }
              as: StateOffice
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: StateOffice
              captures: { wa_ver_2: $.data.version }
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_a}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-23", expected_wrestler_version: "${wa_ver_2}" }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { plan_2: $.data.id, p2_supersedes: $.data.supersedes_plan_id }
            - call: "POST /descent-plans/${plan_2}/certify"
              payload: {}
              as: StateOffice
            - call: "POST /seasons/${season_id}/compliance-run"
              payload: {}
              as: StateOffice
            - call: "GET /descent-plans/${plan_2}"
              payload: {}
              as: StateOffice
              captures: { p2_status: $.data.status, p2_missed: $.data.missed_milestone_count, p2_breaches: $.data.breach_count }
            - call: "GET /descent-plans/${plan_1}"
              payload: {}
              as: StateOffice
              captures: { p1_final_status: $.data.status, p1_final_missed: $.data.missed_milestone_count }
          assert:
            - "${p1_milestones} == 6 — the baseline schedule is 159.6, 157.2, 154.8, 152.5, 150.2, 147.9 on 2026-11-02, 11-09, 11-16, 11-23, 11-30 and 12-07"
            - "At limit-1: ${s1_status} == 'CERTIFIED', ${s1_missed} == 1 and ${s1_breaches} == 0 — only week 0 was due (its grace window [11-02, 11-05) had closed with no weigh-in), and one miss is strictly below plan_breach_limit 2"
            - "At the limit: ${s2_status} == 'BREACHED', ${s2_missed} == 2 and ${s2_breaches} == 1 — the comparison is >=, so the threshold fires exactly at 2 rather than at 3"
            - "GET /descent-plans/${plan_1}/milestones after the second run shows week 0 and week 1 'MISSED' with evaluated_recorded_weight_lbs null (an empty candidate set is a miss, not a skip) and weeks 2-5 still 'SCHEDULED'"
            - "The revision does NOT launder the counter: ${rev_status} == 'CERTIFIED', ${rev_count} == 1 but ${rev_missed} == 2 — still exactly the value it had while breached"
            - "The regenerated schedule continues the week numbering instead of restarting it: ${m2_index} == 2, ${m2_date} == '2026-11-16', ${m2_weight} == 159.6 (re-anchored on the unchanged alpha 159.6), and the list now holds 8 rows ending at ${m7_date} == '2026-12-21' with ${m7_weight} == 147.9; no milestone was WAIVED because none was scheduled strictly before the new start date"
            - "The next compliance run re-breaches the plan with zero newly due milestones: ${s3_status} == 'BREACHED', ${s3_missed} == 2 and ${s3_breaches} == 2 — the cumulative counter, not fresh misses, drives the transition"
            - "Only a new plan resets the counter: ${p2_supersedes} == the ${plan_1} id, ${p2_status} == 'CERTIFIED', ${p2_missed} == 0 and ${p2_breaches} == 0 after a compliance run in which its first milestone (2026-11-23) is not yet due"
            - "${p1_final_status} == 'SUPERSEDED' and ${p1_final_missed} == 2 — the superseded plan keeps its history and, being terminal, is no longer an input to milestone_evaluation"

      - name: cascading_side_effects_layer_covered_by_difficulty_design
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / audit_fail_five_hop_suspension_cascade"
          rationale: "The declared cascading_side_effects layer is exercised end-to-end at maximum depth by the §1.8 five-hop audit-FAIL chain (audit FAIL -> assessor SUSPENDED -> assessments VOIDED -> wrestlers SUSPENDED with figures nulled -> plans CANCELLED -> entries SCRATCHED), including its ordering sensitivity and its INCONCLUSIVE no-op arm. A separate §1.9 instance would restate the same chain with a shallower fixture."

      - name: cascade_ordering_and_partial_application_covered_by_difficulty_design
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / compliance_run_breach_flag_probation_cascade"
          rationale: "The second cascade shape — a bulk trigger whose per-plan side effects accumulate into a team-level ledger and then into a wrestler-level eligibility change — is covered there, together with the ordering claim that the ledger is recomputed once after all breaches rather than per breach."

      - name: dual_variant_calculation_layer_covered_by_difficulty_design
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / descent_schedule_variant_divergence_on_plan"
          rationale: "Both declared dual-variant calculations are covered in §1.8: descent_schedule_projection (WEEKLY_STEP vs LINEAR_RATE, same alpha and target, divergent milestone counts) and audit_discrepancy_score (WORST_CASE FAIL vs SAMPLE_MEAN PASS on the same sample set, i.e. the delta on switch decides whether the whole suspension cascade runs)."

  - section: consistency_model
    instances:
      - name: immediate_consistency_every_cascade_hop_visible_without_re_reading
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Appeal
          - state_machines.Assessment
          - endpoints[POST /appeals/{id}/decide]
        distinguishing_aspect: "One UPHELD decision fires a three-hop chain across four entities plus an entry scratch; the declared model is immediate, so the deciding response and the reads taken right after it — with no intervening write, no retry and no delay — already show every hop, including the derived counters (Event.entry_count, Assessor.voided_assessment_count) and the filtered list projections."
        test_recipe:
          setup:
            - "Open season, one team, assessor A1 and assessor A2 (both CERTIFIED with 8 training hours); wrestler A certified from A1's 159.6 lbs / 14.0% assessment (min class 150) with a CERTIFIED WEEKLY_STEP plan targeting 150 and an ENTERED entry at 150 in a 2026-12-12 tournament; the coach's appeal against A1's assessment is UNDER_REVIEW with A2 as reviewer, a retest has been ordered, and A2's retest at 165.0 lbs / 8.0% has been finalized (min class 165), leaving the appeal RETEST_COMPLETED."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_1: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_1: $.data.id }
            - call: "POST /assessors/${assessor_1}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /assessors"
              payload: { full_name: "Priya Nair", credential_number: "AS-1002", certified_methods: ["SKINFOLD"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_2: $.data.id }
            - call: "POST /assessors/${assessor_2}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /teams/${team_1}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { wrestler_a: $.data.id }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_1}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_1}"
              captures: { assess_1: $.data.id }
            - call: "POST /assessments/${assess_1}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_1}"
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: StateOffice
              captures: { wa_ver: $.data.version }
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_1}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${wa_ver}" }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { plan_1: $.data.id }
            - call: "POST /descent-plans/${plan_1}/certify"
              payload: {}
              as: StateOffice
            - call: "POST /seasons/${season_id}/events"
              payload: { name: "State Qualifier", event_type: "TOURNAMENT", event_date: "2026-12-12" }
              as: StateOffice
              captures: { event_1: $.data.id }
            - call: "POST /events/${event_1}/entries"
              payload: { wrestler_id: "${wrestler_a}", weight_class_lbs: 150, season_win_count: 4 }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { entry_1: $.data.id }
            - call: "POST /assessments/${assess_1}/appeals"
              payload: { team_id: "${team_1}", reason: "Skinfold caliper sites disputed" }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { appeal_1: $.data.id }
            - call: "POST /appeals/${appeal_1}/assign-reviewer"
              payload: { reviewing_assessor_id: "${assessor_2}" }
              as: StateOffice
            - call: "POST /appeals/${appeal_1}/order-retest"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_2}"
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_2}", method: "SKINFOLD", assessed_at: "2026-11-01T15:00:00Z", measured_weight_lbs: 165.0, body_fat_pct: 8.0, urine_specific_gravity: 1.018, appeal_id: "${appeal_1}", retest_of_assessment_id: "${assess_1}" }
              as: Assessor
              as_user_id: "${assessor_2}"
              captures: { retest_1: $.data.id }
            - call: "POST /assessments/${retest_1}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_2}"
              captures: { retest_min: $.data.minimum_certified_weight_lbs, retest_class: $.data.min_weight_class_lbs }
            - call: "GET /appeals/${appeal_1}"
              payload: {}
              as: StateOffice
              captures: { pre_appeal_status: $.data.status }
            - call: "GET /assessments/${assess_1}"
              payload: {}
              as: StateOffice
              captures: { pre_contested_status: $.data.status }
            - call: "GET /descent-plans/${plan_1}"
              payload: {}
              as: StateOffice
              captures: { pre_plan_status: $.data.status }
          trigger:
            - call: "POST /appeals/${appeal_1}/decide"
              payload: { outcome: "UPHELD", decision_note: "Retest supersedes the disputed skinfold reading" }
              as: Assessor
              as_user_id: "${assessor_2}"
              captures: { decided_status: $.data.status, decided_note: $.data.decision_note }
            - call: "GET /assessments/${assess_1}"
              payload: {}
              as: StateOffice
              captures: { post_contested_status: $.data.status, post_void_reason: $.data.void_reason }
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: StateOffice
              captures: { post_source: $.data.source_assessment_id, post_class: $.data.min_weight_class_lbs, post_cert: $.data.certification_status }
            - call: "GET /descent-plans/${plan_1}"
              payload: {}
              as: StateOffice
              captures: { post_plan_status: $.data.status, post_cancel_reason: $.data.cancel_reason }
            - call: "GET /entries/${entry_1}"
              payload: {}
              as: StateOffice
              captures: { post_entry_status: $.data.status, post_scratch_reason: $.data.scratch_reason }
            - call: "GET /events/${event_1}"
              payload: {}
              as: StateOffice
              captures: { post_entry_count: $.data.entry_count }
            - call: "GET /assessors/${assessor_1}"
              payload: {}
              as: StateOffice
              captures: { post_voided_count: $.data.voided_assessment_count, post_assessor_status: $.data.status }
            - call: "GET /descent-plans?wrestler_id=${wrestler_a}&status=CANCELLED"
              payload: {}
              as: StateOffice
              captures: { cancelled_first: "$.data[0].id" }
          assert:
            - "Before the decision the fixture is exactly at the fork: ${pre_appeal_status} == 'RETEST_COMPLETED', ${pre_contested_status} == 'VALIDATED' (a retest carrying appeal_id does NOT supersede the assessment it contests, so the UPHELD from-state still exists) and ${pre_plan_status} == 'CERTIFIED'"
            - "${retest_min} == 163.2 and ${retest_class} == 165 — the retest raises the wrestler's minimum above the plan's target of 150, which is what makes hop 3 fire"
            - "The single decide call returns the terminal appeal in its own response: ${decided_status} == 'UPHELD' and ${decided_note} == 'Retest supersedes the disputed skinfold reading' — no second call is needed to observe the outcome"
            - "Hop 1 is visible on the first read after the decision, with no delay and no retry: ${post_contested_status} == 'VOIDED' and ${post_void_reason} == 'APPEAL_UPHELD:' + the ${appeal_1} id"
            - "Hop 2 is visible: ${post_source} == the ${retest_1} id and ${post_class} == 165"
            - "Hop 3 is visible: ${post_plan_status} == 'CANCELLED' with ${post_cancel_reason} == 'MINIMUM_RAISED', because 150 < 165"
            - "The entry cascade is visible in the same breath: ${post_entry_status} == 'SCRATCHED' with ${post_scratch_reason} set, and the derived counter has already been decremented — ${post_entry_count} == 0"
            - "${post_voided_count} == 1 on the original assessor while ${post_assessor_status} == 'CERTIFIED' — an upheld appeal voids one assessment but never suspends the assessor (that is the audit chain), so immediate visibility must not be confused with over-cascading"
            - "${post_cert} == 'CERTIFIED' and Season.certified_wrestler_count is still 1: the appeal-upheld chain has exactly three hops plus the entry scratch and does not touch the certification dimension"
            - "Filtered list projections are consistent immediately too: ${cancelled_first} == the ${plan_1} id, GET /entries?event_id=${event_1}&status=SCRATCHED returns total_count == 1, and GET /assessments?wrestler_id=${wrestler_a}&status=VOIDED returns total_count == 1"
