  # =========================================================================
  # Rule 6 — boundary-precision checks on different metrics and endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: certification_expiring_exactly_on_the_session_date_is_still_valid
        grounds:
          - calculations.staff_certification_validity
          - validations[priority=41]
          - entities.StaffCertification.fields.expires_on
          - entities.StaffAssignment.fields.qualified_at_session_date
        distinguishing_aspect: |
          Metric 1: a DATE threshold compared with >= on POST
          /recreation/staff-assignments/{assignment_id}/confirm. A CPR certification
          expiring on 2026-06-10 is valid for a session starting 2026-06-10T14:00Z,
          while one expiring 2026-06-09 is not — a one-day swing flips the outcome.
        test_recipe:
          setup:
            - "A program requiring the CPR certification, with one OPEN session starting 2026-06-10T14:00Z."
            - "Staffer ST1 holds a CPR certification expiring exactly on 2026-06-10; staffer ST2 holds one expiring 2026-06-09."
            - "Both staffers already hold PROPOSED assignments on the session, both of which passed the AT_ASSIGNMENT check against the 2026-05-01 clock."
          setup_api_calls:
            - call: "POST /recreation/activity-programs"
              payload: { name: "Adaptive Aquatics", activity_type: "AQUATICS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: ["CPR"], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/staff-members"
              payload: { full_name: "Dana Edge", role_title: "Recreation Therapist" }
              as: ProgramAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /recreation/staff-certifications"
              payload: { staff_member_id: "${st1}", certification_type: "CPR", issued_on: "2024-06-10", expires_on: "2026-06-10" }
              as: ProgramAdmin
              captures: { cert1: "$.data.id" }
            - call: "POST /recreation/staff-members"
              payload: { full_name: "Eli Edge", role_title: "Program Aide" }
              as: ProgramAdmin
              captures: { st2: "$.data.id" }
            - call: "POST /recreation/staff-certifications"
              payload: { staff_member_id: "${st2}", certification_type: "CPR", issued_on: "2024-06-09", expires_on: "2026-06-09" }
              as: ProgramAdmin
              captures: { cert2: "$.data.id" }
            - call: "POST /recreation/program-sessions/${sess}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /recreation/staff-assignments"
              payload: { session_id: "${sess}", staff_member_id: "${st1}", assignment_role: "GROUP" }
              as: ProgramAdmin
              captures: { asg1: "$.data.id", asg1_qa: "$.data.qualified_at_assignment" }
            - call: "POST /recreation/staff-assignments"
              payload: { session_id: "${sess}", staff_member_id: "${st2}", assignment_role: "GROUP" }
              as: ProgramAdmin
              captures: { asg2: "$.data.id", asg2_qa: "$.data.qualified_at_assignment" }
          trigger:
            - call: "POST /recreation/staff-assignments/${asg1}/confirm"
              payload: {}
              as: ActivityLead
              as_user_id: "${st1}"
              captures: { asg1_status: "$.data.status", asg1_qs: "$.data.qualified_at_session_date" }
            - call: "POST /recreation/staff-assignments/${asg2}/confirm"
              payload: {}
              as: ActivityLead
              as_user_id: "${st2}"
              captures: { err: "$.data.error_id" }
          assert:
            - "StaffAssignment.${asg1}.qualified_at_assignment == true and StaffAssignment.${asg2}.qualified_at_assignment == true"
            - "StaffAssignment.${asg1}.status == CONFIRMED and StaffAssignment.${asg1}.qualified_at_session_date == true"
            - "The second confirm returns HTTP 422 with data.error_id == ERR_STAFF_CERT_EXPIRES_BEFORE_SESSION"
            - "StaffAssignment.${asg2}.status == PROPOSED and StaffAssignment.${asg2}.qualified_at_session_date == false"

      - name: empty_roster_requires_zero_group_staff_not_the_minimum_of_one
        grounds:
          - calculations.required_group_staff_count
          - calculations.session_staffing_gap
          - entities.ProgramSession.fields.required_group_staff_planned
        distinguishing_aspect: |
          Metric 2, a different one from the date threshold and reached through a
          different endpoint (GET /recreation/program-sessions/{id}/staffing-summary):
