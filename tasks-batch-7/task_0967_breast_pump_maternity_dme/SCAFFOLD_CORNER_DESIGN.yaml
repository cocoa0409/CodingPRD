        grounds: ["errors[ERR_PRESCRIPTION_NOT_VERIFIED]"]
        excluded_because:
          difficulty_instance: qualify_requires_prescription_verified
          rationale: "Asserted as the failure path of the named difficulty instance."
      - name: err_prior_auth_required_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRIOR_AUTH_REQUIRED]"]
        excluded_because:
          difficulty_instance: shipment_blocked_until_prior_auth_approved
          rationale: "Asserted as the failure path of the named difficulty instance."
      - name: err_resupply_window_not_open_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESUPPLY_WINDOW_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: resupply_minimum_gap_buffer
          rationale: "Asserted as the failure path of the named difficulty instance."
      - name: err_garment_allowance_exceeded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_GARMENT_ALLOWANCE_EXCEEDED]"]
        excluded_because:
