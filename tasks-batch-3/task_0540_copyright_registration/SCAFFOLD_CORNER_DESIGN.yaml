  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: recordation_occ_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[recordation-create-stale-work]", entities.Work.fields.version]
        distinguishing_aspect: "Recordation with expected_work_version equal to current Work.version succeeds and bumps Work.version by 1."
        test_recipe:
          setup: ["A freshly created Work (version 1)"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id, w_v: $.data.version }
          trigger:
            - call: "POST /copyright/recordations"
              payload: { work_id: "${w_id}", transferor_name: "A", transferee_name: "Bob", execution_date: "2026-05-01T00:00:00Z", expected_work_version: "${w_v}" }
              as: Examiner
              captures: { rec_id: $.data.id }
          assert:
            - "Recordation.${rec_id}.status == RECORDED"
            - "Work.${w_id}.version == 2"
            - "Work.${w_id}.current_owner_name == Bob"

      - name: recordation_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[recordation-create-stale-work]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first recordation bumps Work.version to 2, a second recordation still carrying the original expected_work_version (1) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Work version 1; first recordation applied (version -> 2)"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /copyright/recordations"
              payload: { work_id: "${w_id}", transferor_name: "A", transferee_name: "Bob", execution_date: "2026-05-01T00:00:00Z", expected_work_version: "${w_v}" }
              as: Examiner
          trigger:
            - call: "POST /copyright/recordations"
              payload: { work_id: "${w_id}", transferor_name: "Bob", transferee_name: "Cara", execution_date: "2026-05-02T00:00:00Z", expected_work_version: "${w_v}" }
              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: recordation_cascade_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.License.ACTIVE_to_UNDER_REVIEW]
        excluded_because:
          difficulty_instance: recordation_transfer_depth3
          rationale: "The depth-3 recordation cascade is exercised end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_on_create
        claim_type: immediate
        grounds: [entities.Work]
        distinguishing_aspect: "A created Work is immediately readable via GET /copyright/works/{id} in the same test with identical field values (immediate consistency)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "Echo", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /copyright/works/${w_id}"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { t: $.data.title }
          assert:
            - "Work.${w_id}.title == Echo"
