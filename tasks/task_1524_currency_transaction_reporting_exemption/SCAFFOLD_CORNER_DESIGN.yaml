        distinguishing_aspect: "fee = max(150, round_half_up(amount*0.005)): 10000 -> 150 (floor binds), 30000 -> 150 (floor exactly met), 30100 -> 151 (round_half_up of 150.5 rounds up)."
        test_recipe:
