                pay_id: $.data.id
                a_cur: $.data.applied_current_cents
                a_med: $.data.applied_medical_cents
                a_arr: $.data.applied_arrears_cents
                a_int: $.data.applied_interest_cents
                a_gen: $.data.applied_genetic_cost_cents
                a_unapplied: $.data.unapplied_credit_cents
