          assert:
            - "the route's version starts at 1 on creation and the ACTIVATE returns 2"
            - "the inventory-position create returns version 3, so each accepted route write advanced it by one"
            - "the replenishment order's version read at creation was ${po_ver0} and the SUBMIT returns ${po_ver_submitted}, one higher"
            - "the pledge carrying the pre-SUBMIT ${po_ver0} captures ${pledge_stale_error} == ERR_STALE_VERSION with http 412"

