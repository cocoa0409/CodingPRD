  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: mission_window_buffered_overlap
        grounds:
          - calculations.mission_window_conflict
          - validations[priority=9]
        distinguishing_aspect: |
          Resource: Field (one field at a time). Semantics: half-open intervals
          with a 30-minute BUFFER pad on each side; adjacency of the *padded*
          intervals is rejected if they overlap, permitted only when padded_end
          == padded_start exactly. A mission whose raw window starts 15 minutes
          after a prior mission ends (within the buffer) must conflict.
        test_recipe:
          setup:
            - "Plan P; Grower G; Field F; Pilot H"
            - "M1 on F authorized for 2026-06-02 08:00-10:00 (padded: 07:30-10:30)"
            - "M2 on F planned for 2026-06-02 10:15-12:00 (raw gap 15 min after M1 ends; padded 09:45-12:30 -> overlaps M1's padded [07:30,10:30))"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "OvFarms", contact_email: "ov@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 500, airspace_class: "G", insurance_policy_no: "POL-OV" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot P", part107_certificate_no: "P107-P", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 100 }
              as: FlightCoordinator
              captures: { m1_id: $.data.id }
            - call: "POST /ag-drone/missions/${m1_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T10:15:00Z", scheduled_end: "2026-06-02T12:00:00Z", acres_planned: 100 }
              as: FlightCoordinator
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /ag-drone/missions/${m2_id}/authorize"
              payload: {}
              as: FlightCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSION_WINDOW_CONFLICT   # padded overlap (M2 starts 10:15, M1 padded end 10:30)"

      - name: authorization_window_strict_end_containment
        grounds:
          - calculations.authorization_window_check
          - validations[priority=6]
        distinguishing_aspect: |
          Resource: AirspaceAuthorization (a different resource entity from
          Field). Semantics: single-interval CONTAINMENT with INCLUSIVE start
          and STRICT end (mission landing exactly at effective_until is
          rejected, even though a naive closed-interval check would allow it).
          Distinct from buffered overlap (no padding, but strict end and
          full-containment rather than mere overlap detection).
        test_recipe:
          setup:
            - "Plan P; Grower G; Field F airspace_class=C (laanc_required=true)"
            - "Auth on F: effective_from=2026-06-02T08:00:00Z, effective_until=2026-06-02T11:00:00Z, ACTIVE"
            - "Mission M on F with scheduled_start=09:00, scheduled_end=11:00 (ends exactly at effective_until)"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "AW Farms", contact_email: "aw@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "C", insurance_policy_no: "POL-AW" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot Q", part107_certificate_no: "P107-Q", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/airspace-authorizations"
              payload: { field_id: "${field_id}", authorization_ref: "LAANC-STRICT", max_altitude_ft: 400, effective_from: "2026-06-02T08:00:00Z", effective_until: "2026-06-02T11:00:00Z" }
              as: OpsAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", authorization_id: "${auth_id}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z", acres_planned: 50 }
              as: FlightCoordinator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AUTH_WINDOW_INSUFFICIENT   # scheduled_end == effective_until violates strict < containment"

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_approve_pay_conserves_liability_cap
        grounds:
          - state_machines.InsuranceClaim
          - entities.Grower.fields.liability_coverage_cents
          - entities.InsuranceClaim.fields.approved_amount_cents
        distinguishing_aspect: |
          Conserved quantity: per-mission approved exposure. Invariant: for
          any mission, sum of approved_amount_cents over APPROVED+PAID claims
          <= grower.liability_coverage_cents. Forward action: approve(A).
          Compensating action: deny on a sibling claim does NOT decrement
          prior approvals (deny sets approved=0 for that claim only), and a
          second approve that would push cumulative over the cap must be
          rejected — the cap is never breached.
