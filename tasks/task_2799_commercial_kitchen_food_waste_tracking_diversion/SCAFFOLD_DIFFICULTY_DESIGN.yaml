              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /diversion-consignments/${consignment_id}/stage"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /diversion-consignments/${consignment_id}/dispatch"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /hauler-tickets"
              payload: { consignment_id: "${consignment_id}", ticket_number: "GLC-1", gross_weight_grams: 1000, ticket_date: "2026-06-11" }
              as: HaulerOperator
              as_user_id: "${hauler_id}"
              captures: { ticket_1: "$.data.id" }
            - call: "POST /hauler-tickets/${ticket_1}/dispute"
              payload: { dispute_note: "weighbridge printout unreadable" }
              as: SiteSustainabilityManager
