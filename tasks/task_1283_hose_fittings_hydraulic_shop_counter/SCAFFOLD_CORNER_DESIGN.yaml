                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
                lines: [ { coupling_id: "${coup_id}", quantity: 3 } ]
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "GET /api/couplings/${coup_id}"
              as: ShopManager
              captures: { reserved_after_confirm: $.data.reserved_qty }
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/cancel"
              payload: {}
              as: CounterSales
            - call: "GET /api/couplings/${coup_id}"
              as: ShopManager
          assert:
            - "reserved_qty after confirm == 3 and available_qty == 5"
            - "after cancel: Coupling.${coup_id}.reserved_qty == 0 and available_qty == 8 and on_hand_qty == 8"

      - name: dispatch_completion_installs_order
        claim_type: conditional_action
        grounds: [state_machines.ServiceDispatch.ON_SITE_to_COMPLETED, state_machines.AssemblyOrder.TAGGED_to_COMPLETED, entities.EquipmentAsset.fields.installed_assembly_order_id]
        distinguishing_aspect: "Completing a dispatch with installed_assembly_order_id drives the referenced TAGGED order to COMPLETED and stamps the asset (install cascade through the field-service path rather than the counter path)."
        test_recipe:
          setup:
            - "Clock default 2026-08-01; customer (default interval 365); asset; TAGGED order for that asset; dispatch VAN-9 advanced twice to ON_SITE"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "FieldInstallCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "EX-99", machine_type: "excavator" }
              as: ShopManager
              captures: { asset_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8FI", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                equipment_asset_id: "${asset_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.0, actual_labor_minutes: 10 }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "PASSED" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/tag"
              payload: { tag_serial: "TAG-FIELD1" }
              as: ShopTechnician
            - call: "POST /api/service-dispatches"
              payload: { customer_id: "${cust_id}", equipment_asset_id: "${asset_id}", van_id: "VAN-9", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T10:00:00Z" }
              as: CounterSales
              captures: { disp_id: $.data.id }
            - call: "POST /api/service-dispatches/${disp_id}/advance"
              payload: {}
              as: FieldTechnician
            - call: "POST /api/service-dispatches/${disp_id}/advance"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /api/service-dispatches/${disp_id}/complete"
              payload: { installed_assembly_order_id: "${order_id}" }
              as: FieldTechnician
            - call: "GET /api/assembly-orders/${order_id}"
              as: CounterSales
            - call: "GET /api/equipment-assets/${asset_id}"
              as: ShopManager
          assert:
            - "ServiceDispatch.${disp_id}.status == COMPLETED"
            - "AssemblyOrder.${order_id}.status == COMPLETED"
            - "EquipmentAsset.${asset_id}.installed_assembly_order_id == ${order_id}"
            - "EquipmentAsset.${asset_id}.installed_at == 2026-08-01T00:00:00Z"
            - "EquipmentAsset.${asset_id}.next_due_date == 2027-08-01T00:00:00Z (install + 365d default interval)"

      - name: confirm_response_immediately_reflects_mutation
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.cut_waste_allocation]
        distinguishing_aspect: "The confirm response itself carries the mutated state (immediate consistency, no re-read needed): status CONFIRMED, scrap_charged_mm 150, waste_surcharge_cents 120 for a cut of 49850mm off a 50000mm reel at 800c/m."
        test_recipe:
          setup: ["Customer; reel 50000mm at 800c/m; DRAFT order cut 49850mm (remnant 150mm < MIN_REMNANT_MM)"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "ImmCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8IM", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 49850
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
              captures: { resp_status: $.data.status, resp_scrap: $.data.scrap_charged_mm, resp_waste: $.data.waste_surcharge_cents }
          assert:
            - "confirm response status == CONFIRMED (mutation visible in the same response)"
            - "confirm response scrap_charged_mm == 150"
            - "confirm response waste_surcharge_cents == 120 (round_half_up(150/1000 * 800))"
