scenario: |
  818. Backflow & Cross-Connection Control: device inventory by service connection,
  annual-test requirement & tester certification, test-report submission & pass/fail,
  non-compliance & shutoff notice, hazard survey & risk tier, repair/replacement,
  reminders, water-utility reporting

domain_name: backflow-prevention
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - scheduled_actions
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths. Every child is
  # reachable by a filtered-list GET on its own collection (e.g. GET /devices?service_connection_id=...).

  state_machine_shape: compound
  # ServiceConnection.compliance_posture is a derived aggregate (COMPLIANT/AT_RISK/
  # NON_COMPLIANT/SHUTOFF) gating child operations; BackflowDevice is cyclic
  # (ACTIVE <-> NEEDS_REPAIR); TestReport / ShutoffNotice / RepairOrder are branching.

  relationship_patterns:
    - one_to_many          # ServiceConnection -> BackflowDevice / HazardSurvey / ShutoffNotice
    - cross_aggregate      # TestReport references both BackflowDevice and Tester

  role_model: peer_roles
  # UtilityAdmin (operator), Tester (submits tests), PremisesOwner (owns a connection).
  # Non-overlapping resource ownership with a Tester->Admin approval hand-off on test reports.

  consistency_model: immediate
  # All mutations atomic per request; derived fields (posture, penalty, counts) recomputed
  # synchronously as read-time / transition-time side effects.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceConnection
    parent: null
    common_fields: true
    fields:
      - name: account_number
        type: string
        source: input
        description: "Utility account number for the premises; unique across all connections."
        constraints: "unique; non-empty"
      - name: address
        type: string
        source: input
        description: "Service address of the premises."
      - name: owner_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the PremisesOwner who owns this connection; ownership checks compare X-User-ID to this field. NOT a foreign key to any entity."
      - name: hazard_class
        type: enum
        source: input
        description: "Premises cross-connection hazard classification."
        constraints: "one of {HIGH_HAZARD, LOW_HAZARD}"
      - name: compliance_posture
        type: enum
        source: computed
        default: COMPLIANT
        description: "Derived aggregate posture gating child operations. Recomputed on every relevant transition and on read. one of {COMPLIANT, AT_RISK, NON_COMPLIANT, SHUTOFF}. See calc connection_compliance_posture."
      - name: risk_tier
        type: enum
        source: computed
        default: LOW
        description: "Effective risk tier copied from the latest FINALIZED HazardSurvey's effective_risk_tier. one of {LOW, MODERATE, HIGH}. Drives penalty risk_multiplier and shutoff grace_days."
      - name: water_service_active
        type: boolean
        source: computed
        default: true
        description: "true while water is flowing; set false when a ShutoffNotice is ENFORCED, true again on restore. Sole driver of the SHUTOFF posture."
      - name: protected_device_count
        type: integer
        source: computed
        default: 0
        description: "Conserved count of BackflowDevice rows on this connection whose status IN {ACTIVE, NEEDS_REPAIR}. Invariant under repair-order REPLACEMENT (old->REPLACED, new ACTIVE)."
      - name: overdue_device_count
        type: integer
        source: computed
        default: 0
        description: "Count of BackflowDevice rows on this connection with status IN {ACTIVE, NEEDS_REPAIR} AND current_utc > next_test_due_date (strict). Recomputed on read against the logical clock."
      - name: open_notice_count
        type: integer
        source: computed
        default: 0
        description: "Count of ShutoffNotice rows on this connection with status == ISSUED. Conserved under an issue+rescind pair."
      - name: total_penalty_cents
        type: integer
        source: computed
        default: 0
        description: "Sum over overdue devices of the per-device rounded daily penalty; see calc non_compliance_penalty. Recomputed on read against the logical clock."

  - name: BackflowDevice
    parent: null
    common_fields: true
    fields:
      - name: service_connection_id
        type: string
        source: input
        description: "FK -> ServiceConnection.id; the connection this assembly protects."
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial; unique across all devices."
        constraints: "unique; non-empty"
      - name: device_type
        type: enum
        source: input
        description: "Assembly type. one of {RP, DC, PVB, DCDA} (RP=reduced-pressure, DC=double-check, PVB=pressure-vacuum-breaker, DCDA=double-check-detector)."
      - name: hazard_rating
        type: enum
        source: input
        description: "Protection level the assembly provides. one of {HIGH, LOW}. Sets the device hazard floor used by effective_risk_tier."
      - name: test_interval_months
        type: integer
        source: input
        default: 12
        description: "Months between required tests; annual default."
        constraints: ">= 1"
      - name: install_date
        type: datetime
        source: input
        description: "ISO 8601 UTC installation date; baseline for the from_install due-date variant."
      - name: last_pass_date
        type: datetime
        source: computed
        default: null
        description: "test_date of the most recently ACCEPTED PASS TestReport for this device; null until the first passing accepted test. Baseline for the from_last_pass due-date variant."
      - name: next_test_due_date
        type: datetime
        source: computed
        description: "Next required test date; see calc device_next_test_due_date (from_install before any pass, from_last_pass after)."
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Lifecycle state. one of {ACTIVE, NEEDS_REPAIR, REPLACED, REMOVED}."

  - name: Tester
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Certified tester full name."
      - name: certification_number
        type: string
        source: input
        description: "State certification number; unique across all testers."
        constraints: "unique; non-empty"
      - name: cert_effective_date
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the certification validity window (inclusive)."
      - name: cert_expiry_date
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the certification validity window (inclusive). current_utc > cert_expiry_date auto-expires the tester."
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "one of {ACTIVE, SUSPENDED, EXPIRED}. EXPIRED is set by the clock side effect when current_utc > cert_expiry_date."

  - name: TestAppointment
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> BackflowDevice.id; the device to be tested on site."
      - name: tester_id
        type: string
        source: input
        description: "FK -> Tester.id; the tester who will perform the test and owns this appointment."
      - name: scheduled_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the on-site test window (inclusive)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the on-site test window (exclusive). Must be strictly after scheduled_start."
      - name: status
        type: enum
        source: computed
        default: BOOKED
        description: "one of {BOOKED, CANCELLED}."

  - name: TestReport
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> BackflowDevice.id; the device that was tested."
      - name: tester_id
        type: string
        source: input
        description: "FK -> Tester.id; the tester who performed the test and owns this report."
      - name: test_date
        type: datetime
        source: input
        description: "ISO 8601 UTC date the test was performed; must fall within the tester's certification window."
      - name: relief_valve_differential_psid
        type: number
        source: input
        description: "Relief-valve opening differential in psid; required/relevant only for RP devices (ignored for others)."
        constraints: ">= 0"
      - name: check_valve_1_psid
        type: number
        source: input
        description: "First check-valve holding differential in psid."
        constraints: ">= 0"
      - name: check_valve_2_psid
        type: number
        source: input
        description: "Second check-valve holding differential in psid; relevant for DC/DCDA (ignored otherwise)."
        constraints: ">= 0"
      - name: result
        type: enum
        source: computed
        description: "Computed pass/fail from the readings and device_type; see calc test_report_result. one of {PASS, FAIL}."
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "one of {SUBMITTED, ACCEPTED, REJECTED}."
      - name: rejection_reason
        type: string
        source: input
        default: null
        description: "Reviewer note supplied on reject; null unless status == REJECTED."

  - name: HazardSurvey
    parent: null
    common_fields: true
    fields:
      - name: service_connection_id
        type: string
        source: input
        description: "FK -> ServiceConnection.id; the surveyed connection."
      - name: premise_use_score
        type: integer
        source: input
        description: "Hazard points from premises use (0-40)."
        constraints: "0 <= x <= 40"
      - name: chemical_exposure_score
        type: integer
        source: input
        description: "Hazard points from chemical exposure (0-40)."
        constraints: "0 <= x <= 40"
      - name: auxiliary_supply_score
        type: integer
        source: input
        description: "Hazard points from presence of an auxiliary water supply (0-40)."
        constraints: "0 <= x <= 40"
      - name: assessed_risk_tier
        type: enum
        source: computed
        description: "Tier from the questionnaire alone; see calc connection_risk_tier (assessed variant). one of {LOW, MODERATE, HIGH}."
      - name: effective_risk_tier
        type: enum
        source: computed
        description: "max(assessed_risk_tier, device hazard floor); see calc connection_risk_tier (effective variant). one of {LOW, MODERATE, HIGH}."
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "one of {DRAFT, FINALIZED, SUPERSEDED}."

  - name: ShutoffNotice
    parent: null
    common_fields: true
    fields:
      - name: service_connection_id
        type: string
        source: input
        description: "FK -> ServiceConnection.id; the connection served the notice."
      - name: reason
        type: enum
        source: input
        description: "one of {OVERDUE_TEST, FAILED_TEST, UNREPAIRED_DEVICE}."
      - name: issued_date
        type: datetime
        source: computed
        description: "logical clock value at issuance."
      - name: grace_days
        type: integer
        source: computed
        description: "Cure window length selected from the connection risk_tier; see calc shutoff_grace_days."
      - name: enforcement_due_date
        type: datetime
        source: computed
        description: "issued_date + grace_days; enforcement is permitted only when current_utc >= this value."
      - name: status
        type: enum
        source: computed
        default: ISSUED
        description: "one of {ISSUED, RESCINDED, ENFORCED}."

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> BackflowDevice.id; the device to repair or replace."
      - name: order_type
        type: enum
        source: input
        description: "one of {REPAIR, REPLACEMENT}."
      - name: description
        type: string
        source: input
        description: "Free-text problem/work description."
      - name: replacement_serial_number
        type: string
        source: input
        default: null
        description: "Serial for the new assembly; required at completion when order_type == REPLACEMENT."
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "one of {OPEN, COMPLETED, CANCELLED}."

  - name: Reminder
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> BackflowDevice.id; the device the reminder concerns."
      - name: reminder_type
        type: enum
        source: computed
        description: "one of {UPCOMING_DUE, OVERDUE}."
      - name: generated_date
        type: datetime
        source: computed
        description: "logical clock value when the reminder batch produced this row."
      - name: days_until_due
        type: integer
        source: computed
        description: "next_test_due_date minus current_utc in whole days at generation time; negative when overdue."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceConnection
    initial_state: COMPLIANT
    terminal_states: []
    note: "compound/posture_driven — state is the derived compliance_posture, recomputed by calc connection_compliance_posture on every relevant child transition and on read."
    transitions:
      - from: COMPLIANT
        to: AT_RISK
        trigger: "system: recompute when a device enters the upcoming-due window (0 <= days_until_due <= REMINDER_LEAD_DAYS)"
        actor: system
        preconditions: ["water_service_active == true", "overdue_device_count == 0", "no device status == NEEDS_REPAIR", "open_notice_count == 0", "at least one device with 0 <= days_until_due <= 30"]
        side_effects: ["compliance_posture := AT_RISK"]
      - from: COMPLIANT
        to: NON_COMPLIANT
        trigger: "system: recompute after a device becomes NEEDS_REPAIR, becomes overdue, or a notice is ISSUED"
        actor: system
        preconditions: ["water_service_active == true", "overdue_device_count > 0 OR some device status == NEEDS_REPAIR OR open_notice_count > 0"]
        side_effects: ["compliance_posture := NON_COMPLIANT"]
      - from: AT_RISK
        to: NON_COMPLIANT
        trigger: "system: recompute after a device becomes overdue/NEEDS_REPAIR or a notice is ISSUED"
        actor: system
        preconditions: ["water_service_active == true", "overdue_device_count > 0 OR some device status == NEEDS_REPAIR OR open_notice_count > 0"]
        side_effects: ["compliance_posture := NON_COMPLIANT"]
      - from: NON_COMPLIANT
        to: COMPLIANT
        trigger: "system: recompute after the last blocking condition clears (repair completed, notice rescinded, device brought current)"
        actor: system
        preconditions: ["water_service_active == true", "overdue_device_count == 0", "no device status == NEEDS_REPAIR", "open_notice_count == 0", "no device in upcoming-due window"]
        side_effects: ["compliance_posture := COMPLIANT"]
      - from: NON_COMPLIANT
        to: AT_RISK
        trigger: "system: recompute after blocking conditions clear but a device is still within the upcoming-due window"
        actor: system
        preconditions: ["water_service_active == true", "overdue_device_count == 0", "no device status == NEEDS_REPAIR", "open_notice_count == 0", "some device with 0 <= days_until_due <= 30"]
        side_effects: ["compliance_posture := AT_RISK"]
      - from: NON_COMPLIANT
        to: SHUTOFF
        trigger: "POST /shutoff-notices/{id}/enforce"
        actor: UtilityAdmin
        preconditions: ["target ShutoffNotice.status == ISSUED", "current_utc >= ShutoffNotice.enforcement_due_date"]
        side_effects: ["ShutoffNotice.status := ENFORCED", "water_service_active := false", "compliance_posture := SHUTOFF"]
      - from: SHUTOFF
        to: COMPLIANT
        trigger: "POST /service-connections/{id}/restore"
        actor: UtilityAdmin
        preconditions: ["compliance_posture == SHUTOFF", "overdue_device_count == 0", "no device status == NEEDS_REPAIR", "open_notice_count == 0"]
        side_effects: ["water_service_active := true", "recompute compliance_posture (COMPLIANT or AT_RISK)"]

  - entity: BackflowDevice
    initial_state: ACTIVE
    terminal_states: [REPLACED, REMOVED]
    note: "cyclic ACTIVE <-> NEEDS_REPAIR (revision loop) plus branching terminal exits."
    transitions:
      - from: ACTIVE
        to: NEEDS_REPAIR
        trigger: "system: cascade link 1 of test-accept-FAIL (POST /test-reports/{id}/accept where result == FAIL)"
        actor: system
        preconditions: ["device.status == ACTIVE", "accepted TestReport.result == FAIL"]
        side_effects:
          - "BackflowDevice.status := NEEDS_REPAIR"
          - "cascade link 2: recompute ServiceConnection.compliance_posture -> NON_COMPLIANT (a device is now NEEDS_REPAIR)"
          - "cascade link 3: because posture is NON_COMPLIANT, auto-issue a ShutoffNotice{reason: FAILED_TEST, status: ISSUED}; increment ServiceConnection.open_notice_count by 1"
          - "increment ServiceConnection.version by 1"
      - from: NEEDS_REPAIR
        to: ACTIVE
        trigger: "system: cascade link 1 of repair completion (POST /repair-orders/{id}/complete where order_type == REPAIR)"
        actor: system
        preconditions: ["device.status == NEEDS_REPAIR", "RepairOrder.order_type == REPAIR"]
        side_effects:
          - "BackflowDevice.status := ACTIVE"
          - "cascade link 2: recompute ServiceConnection.compliance_posture (NON_COMPLIANT clears if no other blocker)"
          - "cascade link 3: because no device is NEEDS_REPAIR and overdue_device_count == 0, auto-rescind any ISSUED ShutoffNotice with reason IN {FAILED_TEST, UNREPAIRED_DEVICE}; decrement ServiceConnection.open_notice_count"
          - "increment ServiceConnection.version by 1"
      - from: NEEDS_REPAIR
        to: REPLACED
        trigger: "system: repair completion with order_type == REPLACEMENT (POST /repair-orders/{id}/complete)"
        actor: system
        preconditions: ["device.status == NEEDS_REPAIR", "RepairOrder.order_type == REPLACEMENT", "RepairOrder.replacement_serial_number present"]
        side_effects:
          - "old BackflowDevice.status := REPLACED"
          - "create a new BackflowDevice{status: ACTIVE, service_connection_id: same, serial_number: replacement_serial_number, device_type/hazard_rating/test_interval_months copied, install_date: current_utc}"
          - "ServiceConnection.protected_device_count unchanged (old -1 leaves count, new +1 enters count) — compensating invariant"
          - "recompute ServiceConnection.compliance_posture and open_notice_count auto-rescind as in the REPAIR path"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /devices/{id}/remove"
        actor: UtilityAdmin
        preconditions: ["device.status IN {ACTIVE, NEEDS_REPAIR}", "ServiceConnection.compliance_posture != SHUTOFF"]
        side_effects: ["BackflowDevice.status := REMOVED", "decrement ServiceConnection.protected_device_count by 1", "recompute ServiceConnection.compliance_posture"]
      - from: NEEDS_REPAIR
        to: REMOVED
        trigger: "POST /devices/{id}/remove"
        actor: UtilityAdmin
        preconditions: ["device.status IN {ACTIVE, NEEDS_REPAIR}", "ServiceConnection.compliance_posture != SHUTOFF"]
        side_effects: ["BackflowDevice.status := REMOVED", "decrement ServiceConnection.protected_device_count by 1", "recompute ServiceConnection.compliance_posture"]

  - entity: Tester
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /testers/{id}/suspend"
        actor: UtilityAdmin
        preconditions: ["tester.status == ACTIVE"]
        side_effects: ["Tester.status := SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /testers/{id}/reinstate"
        actor: UtilityAdmin
        preconditions: ["tester.status == SUSPENDED", "current_utc <= cert_expiry_date"]
        side_effects: ["Tester.status := ACTIVE"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock side effect of POST /_clock/set_current_utc when current_utc > cert_expiry_date"
        actor: system
        preconditions: ["current_utc > cert_expiry_date"]
        side_effects: ["Tester.status := EXPIRED"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: clock side effect of POST /_clock/set_current_utc when current_utc > cert_expiry_date"
        actor: system
        preconditions: ["current_utc > cert_expiry_date"]
        side_effects: ["Tester.status := EXPIRED"]

  - entity: TestAppointment
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /test-appointments/{id}/cancel"
        actor: Tester
        preconditions: ["appointment.status == BOOKED"]
        side_effects: ["TestAppointment.status := CANCELLED (frees the tester and premises time windows)"]

  - entity: TestReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    note: "branching SUBMITTED -> {ACCEPTED, REJECTED} with divergent side-effect sets; ACCEPTED further branches on result PASS vs FAIL."
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /test-reports/{id}/accept"
        actor: UtilityAdmin
        preconditions: ["report.status == SUBMITTED"]
        side_effects:
          - "if result == PASS: set BackflowDevice.last_pass_date := report.test_date; recompute BackflowDevice.next_test_due_date via from_last_pass variant; recompute ServiceConnection.compliance_posture; if an ISSUED ShutoffNotice with reason == OVERDUE_TEST exists and the device is no longer overdue, auto-rescind it and decrement open_notice_count"
          - "if result == FAIL: fire the ACTIVE->NEEDS_REPAIR cascade on the device (link1 device NEEDS_REPAIR; link2 posture NON_COMPLIANT; link3 auto-issue ShutoffNotice reason FAILED_TEST, increment open_notice_count); increment ServiceConnection.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /test-reports/{id}/reject"
        actor: UtilityAdmin
        preconditions: ["report.status == SUBMITTED", "rejection_reason present"]
        side_effects: ["TestReport.status := REJECTED", "rejection_reason stored", "no device / connection state change"]

  - entity: HazardSurvey
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /hazard-surveys/{id}/finalize"
        actor: UtilityAdmin
        preconditions: ["survey.status == DRAFT", "expected_service_connection_version == ServiceConnection.version"]
        side_effects:
          - "compute assessed_risk_tier and effective_risk_tier (calc connection_risk_tier)"
          - "ServiceConnection.risk_tier := effective_risk_tier"
          - "any prior FINALIZED HazardSurvey on the same connection -> status := SUPERSEDED"
          - "recompute ServiceConnection.compliance_posture"
          - "increment ServiceConnection.version by 1"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: a newer HazardSurvey on the same connection is finalized"
        actor: system
        preconditions: ["survey.status == FINALIZED", "a newer survey on the same connection transitioned to FINALIZED"]
        side_effects: ["HazardSurvey.status := SUPERSEDED"]

  - entity: ShutoffNotice
    initial_state: ISSUED
    terminal_states: [RESCINDED, ENFORCED]
    note: "branching ISSUED -> {RESCINDED, ENFORCED} with divergent side effects."
    transitions:
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /shutoff-notices/{id}/rescind (or system auto-rescind on repair completion)"
        actor: UtilityAdmin
        preconditions: ["notice.status == ISSUED", "ServiceConnection has no device with status == NEEDS_REPAIR", "ServiceConnection.overdue_device_count == 0"]
        side_effects: ["ShutoffNotice.status := RESCINDED", "decrement ServiceConnection.open_notice_count by 1", "recompute ServiceConnection.compliance_posture"]
      - from: ISSUED
        to: ENFORCED
        trigger: "POST /shutoff-notices/{id}/enforce"
        actor: UtilityAdmin
        preconditions: ["notice.status == ISSUED", "current_utc >= notice.enforcement_due_date"]
        side_effects: ["ShutoffNotice.status := ENFORCED", "ServiceConnection.water_service_active := false", "ServiceConnection.compliance_posture := SHUTOFF", "decrement ServiceConnection.open_notice_count by 1"]

  - entity: RepairOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    note: "branching OPEN -> {COMPLETED, CANCELLED}; COMPLETED side effects diverge on order_type."
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /repair-orders/{id}/complete"
        actor: UtilityAdmin
        preconditions: ["order.status == OPEN", "target BackflowDevice.status == NEEDS_REPAIR", "if order_type == REPLACEMENT then replacement_serial_number present"]
        side_effects: ["RepairOrder.status := COMPLETED", "fire the device NEEDS_REPAIR->ACTIVE cascade (order_type REPAIR) or NEEDS_REPAIR->REPLACED cascade (order_type REPLACEMENT)"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: UtilityAdmin
        preconditions: ["order.status == OPEN"]
        side_effects: ["RepairOrder.status := CANCELLED", "no device state change"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: survey-finalize-stale-connection
    parent_entity: ServiceConnection
    write_endpoint: "POST /hazard-surveys/{id}/finalize"
    occ_field: "expected_service_connection_version"
    description: |
      Finalizing a HazardSurvey against a ServiceConnection whose version has
      advanced since the client last observed it is rejected as stale. Finalizing
      a survey legitimately supersedes the connection's prior effective survey and
      rewrites ServiceConnection.risk_tier, so a second finalize that still carries
      the pre-supersede version reflects an outdated view of the connection and is
      refused. Reduces the supersede race to a deterministic stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: device_next_test_due_date
    trigger: "on BackflowDevice creation and on POST /test-reports/{id}/accept when result == PASS"
    algorithm: scheduled_actions
    formula: |
      def add_months(base_iso, n):
          # add n calendar months; keep day-of-month; clamp to last day if overflow
          y, m, d = base_iso.year, base_iso.month, base_iso.day
          total = (m - 1) + n
          ny, nm = y + total // 12, total % 12 + 1
          nd = min(d, last_day_of_month(ny, nm))
          return datetime(ny, nm, nd)  # time-of-day copied from base

      if last_pass_date is None:
          next_test_due_date = add_months(install_date, test_interval_months)   # from_install
      else:
          next_test_due_date = add_months(last_pass_date, test_interval_months) # from_last_pass
    input_set: "single BackflowDevice; branches on whether last_pass_date is null"
    constants: {}
    precision: "date arithmetic; day-of-month clamped to end of target month"
    variants:
      - name: from_install
        when: "device has no ACCEPTED PASS report yet (last_pass_date is null)"
        difference: "baseline is install_date"
      - name: from_last_pass
        when: "device has at least one ACCEPTED PASS report (last_pass_date set)"
        difference: "baseline is last_pass_date; produces a strictly later due date than from_install once a pass exists"

  - name: connection_risk_tier
    trigger: "on POST /hazard-surveys/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      RANK = {LOW: 0, MODERATE: 1, HIGH: 2}
      weighted = round(premise_use_score*0.3 + chemical_exposure_score*0.4 + auxiliary_supply_score*0.3, 2)
      if   weighted >= 70: base = HIGH
      elif weighted >= 40: base = MODERATE
      else:                base = LOW
      # conditional floors (non-linear branches on individual inputs)
      if   chemical_exposure_score >= 35: floor = HIGH
      elif auxiliary_supply_score  >= 30: floor = MODERATE
      else:                               floor = LOW
      assessed_risk_tier  = tier with max(RANK[base], RANK[floor])
      # effective adds the device hazard floor across ACTIVE/NEEDS_REPAIR devices on the connection
      device_floor = HIGH if any device (status IN {ACTIVE,NEEDS_REPAIR}) has hazard_rating == HIGH else LOW
      effective_risk_tier = tier with max(RANK[assessed_risk_tier], RANK[device_floor])
    input_set: "one HazardSurvey plus all BackflowDevice rows on its connection with status IN {ACTIVE, NEEDS_REPAIR}"
    constants:
      WEIGHT_PREMISE: 0.3
      WEIGHT_CHEMICAL: 0.4
      WEIGHT_AUXILIARY: 0.3
      HIGH_WEIGHTED_THRESHOLD: 70
      MODERATE_WEIGHTED_THRESHOLD: 40
      CHEMICAL_HIGH_FLOOR: 35
      AUXILIARY_MODERATE_FLOOR: 30
    precision: "weighted score round_half_up to 2 decimals; tiers are enum ranks"
    variants:
      - name: assessed
        when: "questionnaire only"
        difference: "ignores devices; = max(base tier, questionnaire floor)"
      - name: effective
        when: "connection-level effective tier written to ServiceConnection.risk_tier"
        difference: "= max(assessed, device hazard floor); diverges upward from assessed when a HIGH-rated device is present"

  - name: non_compliance_penalty
    trigger: "read-time recompute on GET /service-connections and GET /service-connections/{id}; drives total_penalty_cents"
    algorithm: aggregation
    formula: |
      MULT = {LOW: 1.0, MODERATE: 1.5, HIGH: 2.0}[connection.risk_tier]
      total_penalty_cents = 0
      for device in connection devices where status IN {ACTIVE, NEEDS_REPAIR} and current_utc > next_test_due_date:
          days_overdue = floor((current_utc - next_test_due_date) / 1 day)   # whole days, >= 1
          raw = BASE_DAILY_RATE_CENTS * MULT * days_overdue
          device_penalty_cents = round_half_up(raw)          # ROUND PER DEVICE FIRST
          total_penalty_cents += device_penalty_cents        # THEN SUM
      # pinned order: round each device to whole cents, then sum — NOT sum-then-round
    input_set: "connection devices with status IN {ACTIVE, NEEDS_REPAIR} and current_utc > next_test_due_date (strict)"
    constants:
      BASE_DAILY_RATE_CENTS: 333
    precision: "round_half_up to whole cents PER DEVICE, then integer-sum"

  - name: connection_compliance_posture
    trigger: "recompute on every child transition listed in §1.2 and on read of the connection"
    algorithm: threshold
    formula: |
      if not water_service_active:                                   posture = SHUTOFF
      elif overdue_device_count > 0
           or any device status == NEEDS_REPAIR
           or open_notice_count > 0:                                 posture = NON_COMPLIANT
      elif any device (status IN {ACTIVE,NEEDS_REPAIR}) with
           0 <= days_until_due <= REMINDER_LEAD_DAYS:                posture = AT_RISK
      else:                                                          posture = COMPLIANT
      # days_until_due = whole days from current_utc to next_test_due_date
    input_set: "one ServiceConnection and its devices/notices, evaluated against the logical clock"
    constants:
      REMINDER_LEAD_DAYS: 30
    precision: "integer day counts; boundaries inclusive at 0 and 30"

  - name: test_report_result
    trigger: "on POST /test-reports (computed at submission from readings and device_type)"
    algorithm: threshold
    formula: |
      if device_type == RP:
          result = PASS if (relief_valve_differential_psid >= MIN_RELIEF_DIFFERENTIAL_PSID
                            and check_valve_1_psid >= MIN_CHECK_PSID) else FAIL
      elif device_type in {DC, DCDA}:
          result = PASS if (check_valve_1_psid >= MIN_CHECK_PSID
                            and check_valve_2_psid >= MIN_CHECK_PSID) else FAIL
      else:  # PVB
          result = PASS if check_valve_1_psid >= MIN_CHECK_PSID else FAIL
    input_set: "single TestReport"
    constants:
      MIN_RELIEF_DIFFERENTIAL_PSID: 2.0
      MIN_CHECK_PSID: 1.0
    precision: "psid compared with >= (a reading exactly at the threshold PASSES)"

  - name: shutoff_grace_days
    trigger: "on ShutoffNotice creation (manual issue or cascade auto-issue)"
    algorithm: threshold
    formula: |
      grace_days = {LOW: 30, MODERATE: 14, HIGH: 7}[connection.risk_tier]
      issued_date = current_utc
      enforcement_due_date = issued_date + grace_days days
    input_set: "one ShutoffNotice and its connection risk_tier"
    constants:
      GRACE_LOW: 30
      GRACE_MODERATE: 14
      GRACE_HIGH: 7
    precision: "integer days added to issued_date"

  - name: utility_report_aggregate
    trigger: "on GET /utility-report"
    algorithm: aggregation
    formula: |
      pool = all ServiceConnections (optionally filtered by hazard_class == query.hazard_class)
      total_connections   = count(pool)
      compliant_count      = count(pool where compliance_posture == COMPLIANT)
      non_compliant_count  = count(pool where compliance_posture IN {NON_COMPLIANT, SHUTOFF})
      if total_connections == 0:
          compliance_rate = 0.00                                   # empty-set boundary, no division
      else:
          compliance_rate = round(compliant_count / total_connections * 100, 2)
    input_set: "all ServiceConnections (posture recomputed at read time), optional hazard_class filter"
    constants: {}
    precision: "compliance_rate round_half_up to 2 decimals; 0.00 when pool empty"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7; for entity_backed/ownership operations X-User-ID matches the owning identity (Tester.id for tester writes, ServiceConnection.owner_user_id for owner writes)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every referenced resource in the path and body FKs exists, validated left-to-right; returns the entity-specific not-found error (ERR_CONNECTION_NOT_FOUND, ERR_DEVICE_NOT_FOUND, ERR_TESTER_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_SURVEY_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_REPAIR_ORDER_NOT_FOUND)"
    error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource id or FK"
  - priority: 4
    category: state
    check: "target resource is in a state that permits this transition; returns the endpoint-specific state error: device testable = status IN {ACTIVE, NEEDS_REPAIR} for POST /test-reports and POST /test-appointments -> ERR_DEVICE_NOT_TESTABLE; accept/reject a non-SUBMITTED report -> ERR_REPORT_NOT_PENDING; finalize a non-DRAFT survey -> ERR_SURVEY_NOT_DRAFT; rescind/enforce a non-ISSUED notice -> ERR_NOTICE_NOT_ISSUED; complete/cancel a non-OPEN order -> ERR_REPAIR_NOT_OPEN; complete an order whose device is not NEEDS_REPAIR -> ERR_DEVICE_NOT_REPAIRABLE; cancel a non-BOOKED appointment -> ERR_APPOINTMENT_NOT_BOOKED; remove a device not in {ACTIVE, NEEDS_REPAIR} -> ERR_DEVICE_NOT_REMOVABLE; restore a connection not in SHUTOFF -> ERR_NOT_SHUTOFF"
    error_id: ERR_DEVICE_NOT_TESTABLE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "the tester on a POST /test-reports or POST /test-appointments is certified: Tester.status == ACTIVE and cert_effective_date <= test/appointment date <= cert_expiry_date"
    error_id: ERR_TESTER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /test-reports, POST /test-appointments"
  - priority: 6
    category: business_referential
    check: "cross-connection posture gate: a device cannot be REMOVED while its ServiceConnection.compliance_posture == SHUTOFF"
    error_id: ERR_CONNECTION_SHUTOFF
    http_status: 409
    applies_to: "POST /devices/{id}/remove"
  - priority: 7
    category: business_referential
    check: "a ShutoffNotice can be RESCINDED only when the connection has no NEEDS_REPAIR device and overdue_device_count == 0"
    error_id: ERR_NOTICE_RESCIND_BLOCKED
    http_status: 409
    applies_to: "POST /shutoff-notices/{id}/rescind"
  - priority: 8
    category: business_temporal
    check: "enforcement is permitted only when current_utc >= enforcement_due_date"
    error_id: ERR_ENFORCEMENT_NOT_DUE
    http_status: 409
    applies_to: "POST /shutoff-notices/{id}/enforce"
  - priority: 9
    category: business_temporal
    check: "appointment interval must be well-formed: scheduled_end strictly after scheduled_start"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /test-appointments"
  - priority: 10
    category: business_temporal
    check: "tester overlap: the new appointment's [scheduled_start, scheduled_end) must not overlap any BOOKED appointment for the same tester_id (half-open; back-to-back adjacency where start == other end is allowed)"
    error_id: ERR_TESTER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /test-appointments"
  - priority: 11
    category: business_temporal
    check: "premises buffer: for two BOOKED appointments on devices sharing a ServiceConnection, the gap between their intervals must be >= PREMISES_BUFFER_MINUTES (60); intervals closer than the buffer (including adjacency) are rejected"
    error_id: ERR_PREMISES_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /test-appointments"
  - priority: 12
    category: business_constraint
    check: "replacement completion requires replacement_serial_number when order_type == REPLACEMENT"
    error_id: ERR_REPLACEMENT_SERIAL_REQUIRED
    http_status: 422
    applies_to: "POST /repair-orders/{id}/complete"
  - priority: 13
    category: business_constraint
    check: "unique account_number on ServiceConnection create; unique serial_number on BackflowDevice create and on replacement completion; unique certification_number on Tester create"
    error_id: ERR_DUPLICATE_VALUE
    http_status: 409
    applies_to: "POST /service-connections, POST /devices, POST /testers, POST /repair-orders/{id}/complete"
  - priority: 14
    category: business_constraint
    check: "request body fields present, correct types, enums in range, integer score fields within 0..40, expected_service_connection_version present on finalize"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 15
    category: state
    check: "optimistic concurrency: on POST /hazard-surveys/{id}/finalize the supplied expected_service_connection_version must equal the connection's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hazard-surveys/{id}/finalize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- ServiceConnection ----
  - method: POST
    path: "/service-connections"
    description: "Register a new service connection."
    roles: [UtilityAdmin]
    code: 201
    input: [account_number, address, owner_user_id, hazard_class]
    output: ServiceConnection
    side_effects: ["create ServiceConnection with compliance_posture=COMPLIANT, risk_tier=LOW, water_service_active=true, all counts 0"]
  - method: GET
    path: "/service-connections"
    description: "List service connections; posture/penalty/counts recomputed at read time."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: ["owner_user_id?", "compliance_posture?", "hazard_class?", "limit?", "offset?"]
    output: ServiceConnection[]
    side_effects: []
  - method: GET
    path: "/service-connections/{id}"
    description: "Fetch one connection with recomputed compliance_posture, total_penalty_cents and counts."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: []
    output: ServiceConnection
    side_effects: ["recompute compliance_posture, overdue_device_count, total_penalty_cents against the logical clock"]
  - method: POST
    path: "/service-connections/{id}/restore"
    description: "Restore water service after a SHUTOFF once the connection is compliant again."
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: ServiceConnection
    side_effects: ["water_service_active := true", "recompute compliance_posture (SHUTOFF -> COMPLIANT/AT_RISK)"]

  # ---- BackflowDevice ----
  - method: POST
    path: "/devices"
    description: "Add a backflow device to a service connection."
    roles: [UtilityAdmin]
    code: 201
    input: [service_connection_id, serial_number, device_type, hazard_rating, "test_interval_months?", install_date]
    output: BackflowDevice
    side_effects: ["compute next_test_due_date via from_install variant", "increment ServiceConnection.protected_device_count", "recompute ServiceConnection.compliance_posture"]
  - method: GET
    path: "/devices"
    description: "List/filter devices (reverse-reachability for BackflowDevice.service_connection_id)."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: ["service_connection_id?", "status?", "limit?", "offset?"]
    output: BackflowDevice[]
    side_effects: []
  - method: GET
    path: "/devices/{id}"
    description: "Fetch one device with recomputed next_test_due_date and status."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: []
    output: BackflowDevice
    side_effects: []
  - method: POST
    path: "/devices/{id}/remove"
    description: "Retire a device from service."
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: BackflowDevice
    side_effects: ["status := REMOVED", "decrement ServiceConnection.protected_device_count", "recompute ServiceConnection.compliance_posture"]

  # ---- Tester ----
  - method: POST
    path: "/testers"
    description: "Register a certified tester."
    roles: [UtilityAdmin]
    code: 201
    input: [name, certification_number, cert_effective_date, cert_expiry_date]
    output: Tester
    side_effects: ["create Tester with status=ACTIVE"]
  - method: GET
    path: "/testers"
    description: "List testers."
    roles: [UtilityAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Tester[]
    side_effects: []
  - method: GET
    path: "/testers/{id}"
    description: "Fetch one tester."
    roles: [UtilityAdmin, Tester]
    code: 200
    input: []
    output: Tester
    side_effects: []
  - method: POST
    path: "/testers/{id}/suspend"
    description: "Suspend a tester's certification."
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: Tester
    side_effects: ["status := SUSPENDED"]
  - method: POST
    path: "/testers/{id}/reinstate"
    description: "Reinstate a suspended tester whose certification is still valid."
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: Tester
    side_effects: ["status := ACTIVE"]

  # ---- TestAppointment ----
  - method: POST
    path: "/test-appointments"
    description: "Book an on-site test appointment; subject to tester-overlap and premises-buffer checks."
    roles: [Tester]
    code: 201
    input: [device_id, tester_id, scheduled_start, scheduled_end]
    output: TestAppointment
    side_effects: ["create TestAppointment with status=BOOKED"]
  - method: GET
    path: "/test-appointments"
    description: "List/filter appointments (reverse-reachability for device_id and tester_id)."
    roles: [UtilityAdmin, Tester]
    code: 200
    input: ["device_id?", "tester_id?", "status?", "limit?", "offset?"]
    output: TestAppointment[]
    side_effects: []
  - method: GET
    path: "/test-appointments/{id}"
    description: "Fetch one appointment."
    roles: [UtilityAdmin, Tester]
    code: 200
    input: []
    output: TestAppointment
    side_effects: []
  - method: POST
    path: "/test-appointments/{id}/cancel"
    description: "Cancel a booked appointment; frees the tester and premises windows."
    roles: [Tester, UtilityAdmin]
    code: 200
    input: []
    output: TestAppointment
    side_effects: ["status := CANCELLED"]

  # ---- TestReport ----
  - method: POST
    path: "/test-reports"
    description: "Submit a backflow test report; result computed at submission."
    roles: [Tester]
    code: 201
    input: [device_id, tester_id, test_date, "relief_valve_differential_psid?", check_valve_1_psid, "check_valve_2_psid?"]
    output: TestReport
    side_effects: ["compute result (calc test_report_result)", "create TestReport with status=SUBMITTED"]
  - method: GET
    path: "/test-reports"
    description: "List/filter test reports (reverse-reachability for device_id and tester_id)."
    roles: [UtilityAdmin, Tester]
    code: 200
    input: ["device_id?", "tester_id?", "status?", "result?", "limit?", "offset?"]
    output: TestReport[]
    side_effects: []
  - method: GET
    path: "/test-reports/{id}"
    description: "Fetch one test report."
    roles: [UtilityAdmin, Tester]
    code: 200
    input: []
    output: TestReport
    side_effects: []
  - method: POST
    path: "/test-reports/{id}/accept"
    description: "Accept a submitted report; PASS updates last_pass_date and due date, FAIL fires the NEEDS_REPAIR cascade."
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: TestReport
    side_effects: ["status := ACCEPTED", "PASS: set device.last_pass_date, recompute next_test_due_date (from_last_pass), recompute posture, auto-rescind OVERDUE_TEST notice if device now current", "FAIL: device ACTIVE->NEEDS_REPAIR cascade (posture NON_COMPLIANT, auto-issue FAILED_TEST notice), increment ServiceConnection.version"]
  - method: POST
    path: "/test-reports/{id}/reject"
    description: "Reject a submitted report with a reason."
    roles: [UtilityAdmin]
    code: 200
    input: [rejection_reason]
    output: TestReport
    side_effects: ["status := REJECTED", "store rejection_reason"]

  # ---- HazardSurvey ----
  - method: POST
    path: "/hazard-surveys"
    description: "Create a draft hazard survey for a connection."
    roles: [UtilityAdmin, PremisesOwner]
    code: 201
    input: [service_connection_id, premise_use_score, chemical_exposure_score, auxiliary_supply_score]
    output: HazardSurvey
    side_effects: ["create HazardSurvey with status=DRAFT"]
  - method: GET
    path: "/hazard-surveys"
    description: "List/filter hazard surveys (reverse-reachability for service_connection_id)."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: ["service_connection_id?", "status?", "limit?", "offset?"]
    output: HazardSurvey[]
    side_effects: []
  - method: GET
    path: "/hazard-surveys/{id}"
    description: "Fetch one hazard survey."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: []
    output: HazardSurvey
    side_effects: []
  - method: POST
    path: "/hazard-surveys/{id}/finalize"
    description: "Finalize a draft survey; computes risk tiers, supersedes the prior finalized survey, rewrites connection risk_tier. OCC-guarded on the connection version."
    roles: [UtilityAdmin]
    code: 200
    input: [expected_service_connection_version]
    output: HazardSurvey
    side_effects: ["compute assessed/effective risk tiers", "ServiceConnection.risk_tier := effective_risk_tier", "prior FINALIZED survey -> SUPERSEDED", "recompute compliance_posture", "increments ServiceConnection.version by 1"]

  # ---- ShutoffNotice ----
  - method: POST
    path: "/shutoff-notices"
    description: "Manually issue a shutoff notice; grace_days/enforcement_due_date computed from connection risk_tier."
    roles: [UtilityAdmin]
    code: 201
    input: [service_connection_id, reason]
    output: ShutoffNotice
    side_effects: ["compute grace_days and enforcement_due_date (calc shutoff_grace_days)", "status=ISSUED", "increment ServiceConnection.open_notice_count", "recompute compliance_posture"]
  - method: GET
    path: "/shutoff-notices"
    description: "List/filter shutoff notices (reverse-reachability for service_connection_id)."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: ["service_connection_id?", "status?", "limit?", "offset?"]
    output: ShutoffNotice[]
    side_effects: []
  - method: GET
    path: "/shutoff-notices/{id}"
    description: "Fetch one shutoff notice."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: []
    output: ShutoffNotice
    side_effects: []
  - method: POST
    path: "/shutoff-notices/{id}/rescind"
    description: "Rescind an issued notice once the connection has no outstanding repair/overdue condition."
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: ShutoffNotice
    side_effects: ["status := RESCINDED", "decrement ServiceConnection.open_notice_count", "recompute compliance_posture"]
  - method: POST
    path: "/shutoff-notices/{id}/enforce"
    description: "Enforce an issued notice once its enforcement_due_date has been reached; shuts off water."
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: ShutoffNotice
    side_effects: ["status := ENFORCED", "ServiceConnection.water_service_active := false", "compliance_posture := SHUTOFF", "decrement ServiceConnection.open_notice_count"]

  # ---- RepairOrder ----
  - method: POST
    path: "/repair-orders"
    description: "Open a repair or replacement order against a device."
    roles: [PremisesOwner, UtilityAdmin]
    code: 201
    input: [device_id, order_type, description, "replacement_serial_number?"]
    output: RepairOrder
    side_effects: ["create RepairOrder with status=OPEN"]
  - method: GET
    path: "/repair-orders"
    description: "List/filter repair orders (reverse-reachability for device_id)."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: ["device_id?", "status?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: GET
    path: "/repair-orders/{id}"
    description: "Fetch one repair order."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: POST
    path: "/repair-orders/{id}/complete"
    description: "Complete an open order; REPAIR returns device to ACTIVE, REPLACEMENT retires it and installs a new device."
    roles: [UtilityAdmin]
    code: 200
    input: ["replacement_serial_number?"]
    output: RepairOrder
    side_effects: ["status := COMPLETED", "REPAIR: device NEEDS_REPAIR->ACTIVE cascade (posture recompute, auto-rescind notice)", "REPLACEMENT: device NEEDS_REPAIR->REPLACED, create new ACTIVE device (protected_device_count conserved), posture recompute"]
  - method: POST
    path: "/repair-orders/{id}/cancel"
    description: "Cancel an open repair order."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status := CANCELLED"]

  # ---- Reminder ----
  - method: POST
    path: "/reminders/generate"
    description: "Batch-generate reminders for devices due within the lead window or overdue; evaluated against the logical clock."
    roles: [UtilityAdmin]
    code: 201
    input: []
    output: "{ generated_count: integer, upcoming_count: integer, overdue_count: integer }"
    side_effects: ["for each device status IN {ACTIVE, NEEDS_REPAIR}: create Reminder UPCOMING_DUE (0 <= days_until_due <= 30) or OVERDUE (days_until_due < 0)"]
  - method: GET
    path: "/reminders"
    description: "List/filter reminders (reverse-reachability for device_id)."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: ["device_id?", "reminder_type?", "limit?", "offset?"]
    output: Reminder[]
    side_effects: []
  - method: GET
    path: "/reminders/{id}"
    description: "Fetch one reminder."
    roles: [UtilityAdmin, PremisesOwner]
    code: 200
    input: []
    output: Reminder
    side_effects: []

  # ---- Utility reporting ----
  - method: GET
    path: "/utility-report"
    description: "Aggregate compliance report across all connections; compliance_rate is 0.00 when there are no connections."
    roles: [UtilityAdmin]
    code: 200
    input: ["hazard_class?"]
    output: "{ total_connections: integer, compliant_count: integer, non_compliant_count: integer, compliance_rate: number }"
    side_effects: ["recompute posture for each connection at read time"]

  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [UtilityAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advance logical clock", "any Tester with cert_expiry_date < current_utc -> status EXPIRED", "due-date/overdue/posture computations use this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not recognized"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation, or ownership check failed (tester_id != X-User-ID, or connection.owner_user_id != X-User-ID)"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing/invalid required field, wrong type, enum out of range, score outside 0..40, or missing expected_service_connection_version on finalize"
  - id: ERR_INVALID_TIME_RANGE
    http: 400
    condition: "appointment scheduled_end is not strictly after scheduled_start"
  - id: ERR_CONNECTION_NOT_FOUND
    http: 404
    condition: "referenced ServiceConnection id does not exist"
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "referenced BackflowDevice id does not exist"
  - id: ERR_TESTER_NOT_FOUND
    http: 404
    condition: "referenced Tester id does not exist"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "referenced TestAppointment id does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "referenced TestReport id does not exist"
  - id: ERR_SURVEY_NOT_FOUND
    http: 404
    condition: "referenced HazardSurvey id does not exist"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "referenced ShutoffNotice id does not exist"
  - id: ERR_REPAIR_ORDER_NOT_FOUND
    http: 404
    condition: "referenced RepairOrder id does not exist"
  - id: ERR_DEVICE_NOT_TESTABLE
    http: 409
    condition: "POST /test-reports or /test-appointments for a device whose status is not in {ACTIVE, NEEDS_REPAIR}"
  - id: ERR_DEVICE_NOT_REMOVABLE
    http: 409
    condition: "POST /devices/{id}/remove when device status not in {ACTIVE, NEEDS_REPAIR}"
  - id: ERR_REPORT_NOT_PENDING
    http: 409
    condition: "accept/reject a TestReport whose status is not SUBMITTED"
  - id: ERR_SURVEY_NOT_DRAFT
    http: 409
    condition: "finalize a HazardSurvey whose status is not DRAFT"
  - id: ERR_NOTICE_NOT_ISSUED
    http: 409
    condition: "rescind/enforce a ShutoffNotice whose status is not ISSUED"
  - id: ERR_REPAIR_NOT_OPEN
    http: 409
    condition: "complete/cancel a RepairOrder whose status is not OPEN"
  - id: ERR_DEVICE_NOT_REPAIRABLE
    http: 409
    condition: "complete a RepairOrder whose target device status is not NEEDS_REPAIR"
  - id: ERR_APPOINTMENT_NOT_BOOKED
    http: 409
    condition: "cancel a TestAppointment whose status is not BOOKED"
  - id: ERR_NOT_SHUTOFF
    http: 409
    condition: "restore a ServiceConnection whose compliance_posture is not SHUTOFF"
  - id: ERR_TESTER_NOT_CERTIFIED
    http: 422
    condition: "tester on a report/appointment is not ACTIVE or the date falls outside [cert_effective_date, cert_expiry_date]"
  - id: ERR_CONNECTION_SHUTOFF
    http: 409
    condition: "device remove attempted while the connection compliance_posture == SHUTOFF"
  - id: ERR_NOTICE_RESCIND_BLOCKED
    http: 409
    condition: "rescind attempted while the connection still has a NEEDS_REPAIR device or overdue_device_count > 0"
  - id: ERR_ENFORCEMENT_NOT_DUE
    http: 409
    condition: "enforce attempted before current_utc >= enforcement_due_date"
  - id: ERR_TESTER_DOUBLE_BOOKED
    http: 409
    condition: "new appointment's half-open interval overlaps an existing BOOKED appointment for the same tester"
  - id: ERR_PREMISES_BUFFER_CONFLICT
    http: 409
    condition: "new appointment is closer than PREMISES_BUFFER_MINUTES (60) to an existing BOOKED appointment on a device of the same connection"
  - id: ERR_REPLACEMENT_SERIAL_REQUIRED
    http: 422
    condition: "complete a REPLACEMENT order without a replacement_serial_number"
  - id: ERR_DUPLICATE_VALUE
    http: 409
    condition: "account_number, serial_number, or certification_number already exists"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_service_connection_version on finalize does not match the connection's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: UtilityAdmin
    description: "Water-utility operator: registers connections/devices/testers, reviews test reports, issues/rescinds/enforces shutoff notices, finalizes surveys, completes repairs, runs reminders and reporting."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-connections"
      - "POST /service-connections/{id}/restore"
      - "POST /devices"
      - "POST /devices/{id}/remove"
      - "POST /testers"
      - "POST /testers/{id}/suspend"
      - "POST /testers/{id}/reinstate"
      - "POST /test-reports/{id}/accept"
      - "POST /test-reports/{id}/reject"
      - "POST /hazard-surveys/{id}/finalize"
      - "POST /shutoff-notices"
      - "POST /shutoff-notices/{id}/rescind"
      - "POST /shutoff-notices/{id}/enforce"
      - "POST /repair-orders/{id}/complete"
      - "POST /reminders/generate"
      - "GET /utility-report"
      - "GET /testers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /service-connections"
      - "GET /service-connections/{id}"
      - "GET /devices"
      - "GET /devices/{id}"
      - "GET /testers/{id}"
      - "GET /test-appointments"
      - "GET /test-appointments/{id}"
      - "POST /test-appointments/{id}/cancel"
      - "GET /test-reports"
      - "GET /test-reports/{id}"
      - "POST /hazard-surveys"
      - "GET /hazard-surveys"
      - "GET /hazard-surveys/{id}"
      - "GET /shutoff-notices"
      - "GET /shutoff-notices/{id}"
      - "POST /repair-orders"
      - "GET /repair-orders"
      - "GET /repair-orders/{id}"
      - "POST /repair-orders/{id}/cancel"
      - "GET /reminders"
      - "GET /reminders/{id}"
  - name: Tester
    description: "Certified backflow tester: books/cancels their own on-site appointments and submits test reports for the devices they service."
    identity: "entity_backed:Tester"
    exclusive_operations:
      - "POST /test-appointments"
      - "POST /test-reports"
    shared_operations:
      - "GET /testers/{id}"
      - "GET /test-appointments"
      - "GET /test-appointments/{id}"
      - "POST /test-appointments/{id}/cancel"
      - "GET /test-reports"
      - "GET /test-reports/{id}"
  - name: PremisesOwner
    description: "Owner/operator of a premises: reads their own connection, devices, notices, surveys and reminders, requests repairs, drafts hazard surveys. Ownership is X-User-ID == ServiceConnection.owner_user_id."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /service-connections"
      - "GET /service-connections/{id}"
      - "GET /devices"
      - "GET /devices/{id}"
      - "POST /hazard-surveys"
      - "GET /hazard-surveys"
      - "GET /hazard-surveys/{id}"
      - "GET /shutoff-notices"
      - "GET /shutoff-notices/{id}"
      - "POST /repair-orders"
      - "GET /repair-orders"
      - "GET /repair-orders/{id}"
      - "POST /repair-orders/{id}/cancel"
      - "GET /reminders"
      - "GET /reminders/{id}"
