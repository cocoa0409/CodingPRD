# =============================================================================
# PRD Benchmark Scaffold
# Task: task_3437_electric_van_production_ramp_fleet_service_network
# Electric Van Production Ramp & Fleet Service Network
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Electric Van Production Ramp & Fleet Service Network (Rivian): production line
  ramp with supplier readiness, battery module supply and quality gate
  progression, fleet customer program with vehicle configuration, telematics
  integration and delivery scheduling to depots, service network build-out
  through mobile service vans and limited service centers with parts
  distribution, charging infrastructure coordination at customer depots
  including electrical capacity and installation timelines, software update
  deployment with fleet-wide validation and staged rollout, warranty and uptime
  commitments for commercial customers whose vehicles are in daily route
  service, battery health monitoring and end-of-life planning, direct sales
  model interacting with state franchise laws

domain_name: "electric-van-fleet-ops"
api_prefix: "/evfleet"

complexity_profile:
  primary_archetype: Workflow orchestration      # quality gates, staged rollouts, multi-step delivery pipeline
  secondary_archetype: Quota / allocation        # depot kW headroom, weekly ramp capacity, parts stock reservation
  complexity_layers:
    - optimistic_concurrency       # OCC on Depot / VehicleOrder / UptimeContract versions
    - cascading_side_effects       # supplier downgrade -> quarantine + order risk flags; campaign rollback -> vehicle recall
    - dual_variant_calculation     # uptime credit ROUTE_DAY vs VEHICLE_HOUR; battery EOL REFURBISH vs RECOVERY
    - rate_threshold_triggers      # SOH EOL threshold, supplier tier breakpoints, rollout success-rate gates

  entity_topology: flat            # peer entities linked by FK references; flat POST bodies carry parent ids
  state_machine_shape: cyclic      # rework loop (BatteryModule), redesign loop (ChargingProject), pause/resume (SoftwareCampaign); Vehicle carries parallel dimensions

  relationship_patterns:
    - one_to_many        # FleetCustomer -> Depot -> ChargingProject; Supplier -> BatteryModule
    - cross_aggregate    # VehicleOrder references Depot + Supplier; Vehicle references Order + BatteryModule
    - polymorphic        # ServiceVisit targets exactly one of ServiceCenter | MobileVan

  role_model: segregation_of_duties  # registrar may not inspect own module; diagnostician may not adjudicate own claim
  consistency_model: immediate       # all mutations + cascades visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FleetCustomer
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        required: true
        description: "Legal name of the commercial fleet customer"
      - name: contact_email
        type: string
        source: input
        required: true
        description: "Primary operations contact email"
      - name: account_tier
        type: enum
        source: input
        required: true
        description: "Commercial tier of the account"
        constraints: "one of {STANDARD, PRIORITY}"

  - name: Depot
    parent: null
    common_fields: true
    fields:
      - name: fleet_customer_id
        type: string
        source: input
        required: true
        description: "FK -> FleetCustomer.id; owning customer"
      - name: name
        type: string
        source: input
        required: true
        description: "Depot display name"
      - name: state_code
        type: string
        source: input
        required: true
        description: "Two-letter US state the depot sits in; drives franchise-law review"
        constraints: "2 uppercase letters"
      - name: address
        type: string
        source: input
        required: true
        description: "Street address of the depot"
      - name: total_capacity_kw
        type: number
        source: input
        required: true
        description: "Total electrical service capacity of the depot in kW"
        constraints: "> 0"
      - name: committed_capacity_kw
        type: number
        source: computed
        description: "Sum of requested_capacity_kw over ChargingProjects at this depot in {SURVEY, UTILITY_REVIEW, PERMITTING, INSTALLATION} plus commissioned_capacity_kw over COMMISSIONED projects; maintained by depot_capacity_allocation"

  - name: ChargingProject
    parent: null
    common_fields: true
    fields:
      - name: depot_id
        type: string
        source: input
        required: true
        description: "FK -> Depot.id; depot receiving the charging build-out"
      - name: requested_capacity_kw
        type: number
        source: input
        required: true
        description: "New charging capacity this project will install, in kW"
        constraints: "> 0"
      - name: install_window_start
        type: datetime
        source: input
        required: true
        description: "Planned installation window start (inclusive closed bound)"
      - name: install_window_end
        type: datetime
        source: input
        required: true
        description: "Planned installation window end (inclusive closed bound)"
      - name: crew_count
        type: integer
        source: input
        required: true
        description: "Electrician crew size demanded during the install window; overlapping projects at one depot may not exceed MAX_DEPOT_CREW in aggregate"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "ChargingProject state machine state"
        constraints: "one of {SURVEY, UTILITY_REVIEW, REDESIGN, PERMITTING, INSTALLATION, COMMISSIONED, CANCELLED}"
        default: SURVEY
      - name: utility_denial_reason
        type: string
        source: system
        description: "Recorded reason when the utility denies capacity (transition UTILITY_REVIEW -> REDESIGN)"
        default: null
      - name: commissioned_capacity_kw
        type: number
        source: system
        description: "Set equal to requested_capacity_kw when the project reaches COMMISSIONED; null before"
        default: null

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        required: true
        description: "Supplier legal name (battery module / component source)"
      - name: contact_email
        type: string
        source: input
        required: true
        description: "Supplier operations contact"
      - name: readiness_tier
        type: enum
        source: computed
        description: "Tier computed by supplier_readiness_scoring from the latest readiness audit; UNAUDITED until the first audit"
        constraints: "one of {UNAUDITED, A, B, C}"
        default: UNAUDITED
      - name: last_on_time_pct
        type: number
        source: system
        description: "On-time delivery percentage from the latest audit"
        default: null
      - name: last_first_pass_yield_pct
        type: number
        source: system
        description: "First-pass quality yield percentage from the latest audit"
        default: null
      - name: open_corrective_actions
        type: integer
        source: system
        description: "Open corrective-action count from the latest audit"
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProductionPlanner who registered the supplier; segregation-of-duties reference for audits"

  - name: BatteryModule
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        required: true
        description: "FK -> Supplier.id; source supplier of this module lot"
      - name: module_serial
        type: string
        source: input
        required: true
        description: "Manufacturer serial of the battery module lot"
      - name: pack_kwh
        type: enum
        source: input
        required: true
        description: "Energy capacity class of the module"
        constraints: "one of {52, 77}"
      - name: quality_status
        type: enum
        source: system
        description: "BatteryModule quality-gate state machine state"
        constraints: "one of {REGISTERED, IN_QA, PASSED, FAILED, REWORK, QUARANTINED, ALLOCATED, SCRAPPED}"
        default: REGISTERED
      - name: failure_count
        type: integer
        source: system
        description: "Number of IN_QA -> FAILED outcomes; reaching MODULE_MAX_FAILURES auto-scraps the module"
        default: 0
      - name: registered_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProductionPlanner who registered the module; segregation-of-duties reference for inspection"
      - name: last_inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityInspector who last inspected the module"
        default: null

  - name: VehicleOrder
    parent: null
    common_fields: true
    fields:
      - name: fleet_customer_id
        type: string
        source: input
        required: true
        description: "FK -> FleetCustomer.id; ordering customer"
      - name: depot_id
        type: string
        source: input
        required: true
        description: "FK -> Depot.id; delivery destination depot"
      - name: battery_supplier_id
        type: string
        source: input
        required: true
        description: "FK -> Supplier.id; nominated battery module supplier for this order"
      - name: quantity
        type: integer
        source: input
        required: true
        description: "Number of vans ordered"
        constraints: "1..500"
      - name: battery_pack_kwh
        type: enum
        source: input
        required: true
        description: "Battery pack configuration for every van on the order"
        constraints: "one of {52, 77}"
      - name: telematics_tier
        type: enum
        source: input
        required: true
        description: "Telematics provisioning tier for every van on the order"
        constraints: "one of {STANDARD, ADVANCED}"
      - name: delivery_method
        type: enum
        source: input
        required: true
        description: "DIRECT_DELIVERY = manufacturer delivers to depot (franchise-law sensitive); CUSTOMER_PICKUP = customer collects (exempt)"
        constraints: "one of {DIRECT_DELIVERY, CUSTOMER_PICKUP}"
      - name: requires_depot_charging
        type: boolean
        source: input
        required: true
        description: "When true, van commissioning at the depot is gated on commissioned charging capacity (charging_demand_gate)"
      - name: status
        type: enum
        source: system
        description: "VehicleOrder state machine state"
        constraints: "one of {DRAFT, SUBMITTED, FRANCHISE_HOLD, CONFIRMED, IN_PRODUCTION, FULFILLED, CANCELLED}"
        default: DRAFT
      - name: exemption_document_ref
        type: string
        source: input
        description: "Franchise-law exemption document reference supplied at compliance review; required to approve a DIRECT_DELIVERY order whose depot sits in a franchise-blocked state"
        default: null
      - name: promised_delivery_date
        type: string
        source: computed
        description: "ISO date promised to the customer; computed by delivery_promise_calculation at CONFIRMED; pushed +14 days when supply_risk_flag is set by a supplier downgrade cascade"
        default: null
      - name: supply_risk_flag
        type: boolean
        source: system
        description: "True while the nominated battery supplier sits at readiness_tier C"
        default: false
      - name: registered_count
        type: integer
        source: computed
        description: "Number of Vehicles registered against this order; drives CONFIRMED -> IN_PRODUCTION -> FULFILLED auto-transitions"
        default: 0
      - name: hold_count
        type: integer
        source: computed
        description: "Number of this order's Vehicles with software_hold == true; recomputed on every child Vehicle mutation (derived field reconciliation)"
        default: 0

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vehicle_order_id
        type: string
        source: input
        required: true
        description: "FK -> VehicleOrder.id; order this VIN fulfills"
      - name: battery_module_id
        type: string
        source: input
        required: true
        description: "FK -> BatteryModule.id; allocated module (must be PASSED and pack-matched at registration)"
      - name: vin
        type: string
        source: input
        required: true
        description: "Vehicle identification number; globally unique"
        constraints: "unique across all Vehicles"
      - name: delivery_status
        type: enum
        source: system
        description: "Delivery dimension of the Vehicle parallel state machine"
        constraints: "one of {ASSEMBLED, IN_TRANSIT, AT_DEPOT, COMMISSIONED}"
        default: ASSEMBLED
      - name: telematics_status
        type: enum
        source: system
        description: "Telematics dimension of the Vehicle parallel state machine"
        constraints: "one of {OFFLINE, PROVISIONED, ACTIVE, SUSPENDED}"
        default: OFFLINE
      - name: software_version
        type: string
        source: system
        description: "Firmware baseline installed at registration; advanced by successful campaign results"
        default: "1.0.0"
      - name: software_hold
        type: boolean
        source: system
        description: "Set true by a campaign ROLLED_BACK cascade; blocks delivery advance past IN_TRANSIT"
        default: false
      - name: current_soh_pct
        type: number
        source: system
        description: "Latest battery state-of-health percentage reported via telematics"
        default: 100.0
      - name: battery_eol_status
        type: enum
        source: system
        description: "NONE until a report below SOH_EOL_THRESHOLD arrives; then EOL_REVIEW (sticky)"
        constraints: "one of {NONE, EOL_REVIEW}"
        default: NONE
      - name: eol_valuation_refurbish_cents
        type: integer
        source: computed
        description: "battery_eol_valuation REFURBISH variant output, computed when EOL_REVIEW is entered"
        default: null
      - name: eol_valuation_recovery_cents
        type: integer
        source: computed
        description: "battery_eol_valuation RECOVERY variant output, computed when EOL_REVIEW is entered"
        default: null
      - name: last_battery_report_at
        type: datetime
        source: system
        description: "measured_at of the latest accepted battery-health report"
