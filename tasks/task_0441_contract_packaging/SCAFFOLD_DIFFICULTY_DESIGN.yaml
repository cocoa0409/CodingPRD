  - rule_id: transitive_cascade
    instances:
      - name: start_consume_depletes_lot_then_recomputes_on_hand_depth3
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_RUNNING
          - state_machines.ComponentLot.AVAILABLE_to_DEPLETED
          - entities.Component.fields.on_hand_qty
          - calculations.inventory_on_hand
        distinguishing_aspect: |
          Depth-3 cascade from the run START trigger: start mutates ComponentLot.remaining_qty
          (link 1); the lot hitting 0 itself flips ComponentLot.status AVAILABLE->DEPLETED
          (link 2 caused by link 1); the DEPLETED status itself drops the lot out of the
          available variant, recomputing Component.on_hand_qty (link 3 caused by link 2).
        test_recipe:
          setup:
            - "Component ALMOND single lot remaining exactly 210; recipe consumes exactly 210 -> lot depletes to 0"
          setup_api_calls:
