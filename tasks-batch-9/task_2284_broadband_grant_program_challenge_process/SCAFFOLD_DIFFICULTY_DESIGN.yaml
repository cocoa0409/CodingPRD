            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SERVICE_DENIAL_LETTER", collected_at: "2026-06-01T00:00:00Z", description: "Written service denial from the incumbent.", expected_challenge_version: "${ch_v1}" }
              as: Challenger
              as_user_id: "comm-1"
            - call: "GET /broadband/challenges/${ch_id}"
              payload: {}
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_v2: $.data.version }
            - call: "POST /broadband/challenges/${ch_id}/evidence"
