      - name: state_machine_compensation_clear_findings_restores_suspended_reclassification_request
        claim_type: compensation
        grounds:
          - state_machines.ReclassificationRequest.SUSPENDED_PENDING_AUDIT_to_UNDER_REVIEW
          - state_machines.Merchant.UNDER_REVIEW_to_VERIFIED
          - entities.ReclassificationRequest.fields.prior_status_before_suspension
        distinguishing_aspect: "clear-findings is the exact inverse of the audit-open suspension: the request that was UNDER_REVIEW when it was suspended returns to UNDER_REVIEW, prior_status_before_suspension is nulled, and the merchant returns to VERIFIED with no drift."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one US/USD acquirer; MCC 5411 and 7995."
            - "One VERIFIED grocery merchant with a reclassification request that has been moved to UNDER_REVIEW by CategoryAnalyst CAN-1."
            - "A MerchantCategoryAudit then opened on the merchant and moved to FIELDWORK, which suspended the request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "7995", description: "Gambling Transactions", business_type_key: "GAMBLING", program_eligibility: [], requires_documentation: true, high_risk: true }
              as: NetworkAdmin
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id, mer_v0: $.data.version }
            - call: "POST /reclassification-requests"
              payload: { merchant_id: "${mer_id}", requested_mcc: "7995", justification: "Gaming line of business added", expected_merchant_version: "${mer_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { req_id: $.data.id }
            - call: "POST /reclassification-requests/${req_id}/review"
              payload: {}
              as: CategoryAnalyst
              as_user_id: "CAN-1"
            - call: "POST /merchant-category-audits"
              payload: { merchant_id: "${mer_id}", trigger_reason: "RECLASS_SUSPICION" }
              as: ComplianceAuditor
              as_user_id: "CA-1"
              captures: { audit_id: $.data.id }
            - call: "GET /reclassification-requests/${req_id}"
              payload: {}
              as: CategoryAnalyst
              as_user_id: "CAN-1"
              captures: { req_status_suspended: $.data.status, req_prior: $.data.prior_status_before_suspension }
            - call: "POST /merchant-category-audits/${audit_id}/start-fieldwork"
              payload: { fieldwork_start: "2026-09-03T09:00:00Z", fieldwork_end: "2026-09-04T17:00:00Z" }
              as: ComplianceAuditor
              as_user_id: "CA-1"
          trigger:
            - call: "POST /merchant-category-audits/${audit_id}/clear-findings"
              payload: { findings_note: "Category confirmed correct, no misrepresentation" }
              as: ComplianceAuditor
              as_user_id: "CA-1"
          assert:
            - "${req_status_suspended} == SUSPENDED_PENDING_AUDIT"
            - "${req_prior} == UNDER_REVIEW"
            - "HTTP status == 200"
            - "response data.status == FINDINGS_CLEARED"
            - "MerchantCategoryAudit.${audit_id}.penalty_assessed_cents == 0"
            - "MerchantCategoryAudit.${audit_id}.correct_mcc == null"
            - "ReclassificationRequest.${req_id}.status == UNDER_REVIEW"
            - "ReclassificationRequest.${req_id}.prior_status_before_suspension == null"
            - "ReclassificationRequest.${req_id}.reviewer_user_id == CAN-1"
            - "Merchant.${mer_id}.mcc_status == VERIFIED"
            - "Merchant.${mer_id}.mcc_status_before_review == null"
            - "Merchant.${mer_id}.assigned_mcc == 5411"

      - name: state_machine_conditional_cascade_clear_findings_restores_pending_verification_not_verified
        claim_type: conditional_cascade
        grounds:
