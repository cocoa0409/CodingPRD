scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: case_creation_success_full_readback
        claim_type: creation
        grounds: [entities.Case, calculations.calc_case_exposure_score]
        distinguishing_aspect: "POST /api/cases with all required fields returns 201 with server-minted report_number, status RECEIVED, version 1, received_at from the default logical clock, and the computed initial exposure score - computed/system fields populated without client input."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
          trigger:
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_ASSAULT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id, rn: $.data.report_number, st: $.data.status, exp: $.data.exposure_score }
          assert:
            - "response 201; Case.${case_id}.status == RECEIVED (initial state) and version == 1"
            - "report_number matches RPT-2026-0001 (first case received in clock year 2026)"
            - "received_at == 2026-08-01T00:00:00Z (default logical clock, no wall-clock fallback)"
            - "exposure_score == 40 (CATEGORY_BASE[SEXUAL_ASSAULT], no priors/violations/directives) and interim_suspension_eligible == false - computed field in the same response (immediate consistency)"

      - name: case_creation_missing_required_categories_rejected
        claim_type: required_fields
        grounds: [entities.Case.fields.categories, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field categories yields ERR_INVALID_REQUEST (400) and no case row is created."
        test_recipe:
          setup: ["three profiles exist"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
          trigger:
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected error_id == ERR_INVALID_REQUEST (400)"
            - "GET /api/cases returns total_count == 0 afterwards (no partial creation)"

      - name: case_creation_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Case.fields.categories, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An unknown category enum member (BOGUS) is rejected ERR_INVALID_REQUEST; type constraints enforced at intake."
        test_recipe:
          setup: ["three profiles exist"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
          trigger:
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["BOGUS"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected error_id == ERR_INVALID_REQUEST (400)"

      - name: case_creation_empty_categories_rejected
        claim_type: type_constraints
        grounds: [entities.Case.fields.categories, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "categories: [] violates the non-empty-array constraint -> ERR_INVALID_REQUEST; an empty set is not a valid allegation."
        test_recipe:
          setup: ["three profiles exist"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
          trigger:
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: [], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected error_id == ERR_INVALID_REQUEST (400)"

      - name: party_profile_advisor_eligible_default_false
        claim_type: defaults
        grounds: [entities.PartyProfile.fields.advisor_eligible]
        distinguishing_aspect: "Omitting advisor_eligible applies the documented default false, excluding the profile from the university-appointment selector pool."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/party-profiles", payload: { full_name: "No Flag", university_id: "U-NF-1", role_type: "EXTERNAL", email: "nf@example.edu" }, as: CaseAdministrator, captures: { nf_id: $.data.id, nf_flag: $.data.advisor_eligible } }
          assert:
            - "PartyProfile.${nf_id}.advisor_eligible == false (default applied, not null)"

      - name: party_profile_duplicate_university_id_rejected
        claim_type: type_constraints
        grounds: [entities.PartyProfile.fields.university_id, "errors[ERR_DUPLICATE_RESOURCE]"]
        distinguishing_aspect: "university_id uniqueness is enforced across PartyProfile rows -> ERR_DUPLICATE_RESOURCE (409) on the second insert."
        test_recipe:
          setup: ["one profile with university_id U-C-1 exists"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "First", university_id: "U-C-1", role_type: "STUDENT", email: "a@example.edu" }, as: CaseAdministrator }
          trigger:
            - { call: "POST /api/party-profiles", payload: { full_name: "Second", university_id: "U-C-1", role_type: "STAFF", email: "b@example.edu" }, as: CaseAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "rejected error_id == ERR_DUPLICATE_RESOURCE (409)"

      - name: case_creation_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Case.fields.exposure_score, entities.Case.fields.active_supportive_measure_count]
        distinguishing_aspect: "Client-supplied exposure_score/active_supportive_measure_count values in the create body are ignored; the server computes 15 (OTHER_SEX_BASED base) and 0 regardless."
        test_recipe:
          setup: ["three profiles exist"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
          trigger:
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["OTHER_SEX_BASED"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL", exposure_score: 999, active_supportive_measure_count: 7 }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id, exp: $.data.exposure_score, cnt: $.data.active_supportive_measure_count }
          assert:
            - "Case.${case_id}.exposure_score == 15 and active_supportive_measure_count == 0 - client values 999/7 ignored"

      - name: case_creation_system_fields_input_ignored
        claim_type: system_fields
        distinguishing_aspect: "Client-supplied id/version/report_number in the create body are ignored; the server mints its own UUID, version 1, and report_number."
        grounds: [entities.Case]
        test_recipe:
          setup: ["three profiles exist"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
          trigger:
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "IN_PERSON", id: "00000000-0000-0000-0000-000000000000", version: 42, report_number: "HACKED" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id, rn: $.data.report_number, ver: $.data.version }
          assert:
            - "Case.${case_id}.id != 00000000-0000-0000-0000-000000000000 (server-minted UUID)"
            - "version == 1 and report_number == RPT-2026-0001 - forged inputs ignored"

      - name: notice_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.Notice]
        distinguishing_aspect: "Notice is an append-only common_fields:false entity: its read response carries id/created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["case in INVESTIGATION (formal complaint auto-created an ALLEGATIONS notice)"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
          trigger:
            - { call: "GET /api/cases/${case_id}/notices", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { n_type: "$.data[0].notice_type", n_ver: "$.data[0].version" } }
          assert:
            - "the auto-created ALLEGATIONS notice exists with recipient_side BOTH and sent_at == 2026-08-01T00:00:00Z"
            - "notice object has NO version and NO updated_at keys (common_fields: false); lead_time_sufficient == true for non-event types"

      - name: case_list_pagination_defaults
        claim_type: listing
        grounds: [entities.Case, response_envelope]
        distinguishing_aspect: "With 12 cases stored, an unparameterized GET /api/cases returns exactly 10 rows (default limit), total_count 12, has_more true - envelope pagination defaults enforced."
        test_recipe:
          setup: ["three profiles; twelve cases created"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-01T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-02T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-03T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-04T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-05T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-06T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-07T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-08T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-09T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-10T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-11T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-12T00:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "GET /api/cases", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /api/cases?limit=2&offset=10", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          assert:
            - "default page: data length == 10, total_count == 12, has_more == true (pagination defaults limit=10)"
            - "limit=2&offset=10: data length == 2, total_count == 12, has_more == false"

      - name: case_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields ERR_NOT_FOUND (404) with the standard error envelope."
        test_recipe:
          setup: ["one coordinator profile exists"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
          trigger:
            - { call: "GET /api/cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { err: $.data.error_id } }
          assert:
            - "404 with error_id == ERR_NOT_FOUND and envelope meta.api_request_id present"

      - name: case_create_body_fk_not_found_rejected
        claim_type: parent_relationships
        grounds: [entities.Case.fields.complainant_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body FK (complainant_id) referencing a non-existent PartyProfile is rejected ERR_NOT_FOUND (404) - referential integrity on input references, not just path ids."
        test_recipe:
          setup: ["respondent and coordinator profiles exist"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
          trigger:
            - call: "POST /api/cases"
              payload: { complainant_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected error_id == ERR_NOT_FOUND (404)"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: dismiss_from_received_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Case, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "RECEIVED is not a from-state for dismiss (jurisdiction review must happen first): ERR_INVALID_STATE_TRANSITION, case stays RECEIVED, no DISMISSAL notice created."
        test_recipe:
          setup: ["case in RECEIVED"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
          trigger:
