# =============================================================================
# §1.9 Scaffold Corner Design — Non-Traded REIT Fundraising & Repurchase
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against this scaffold's §1.1-§1.7 surface and emits one instance per
# applicable row. Corners already asserted by a named SCAFFOLD_DIFFICULTY_DESIGN
# instance appear as `excluded_because:` stubs with no test_recipe.
#
# Every recipe drives an empty database through §1.5 calls only. The logical
# clock starts at its declared default 2026-08-01T00:00:00Z; any instance that
# needs another instant moves it with POST /_clock/set_current_utc.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: offering_creation_returns_all_declared_fields_with_axis_defaults
        claim_type: creation
        grounds:
          - entities.Offering
          - endpoints[POST /offerings]
          - entities.Offering.fields.registration_status
          - entities.Offering.fields.escrow_status
          - entities.Offering.fields.repurchase_plan_status
        distinguishing_aspect: |
          One POST must return every declared Offering field in the success
          envelope, with all three independent status axes at their declared
          initial values and all three computed money totals at 0 — not merely
          the echoed inputs.
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its declared 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /offerings"
              payload: { name: "Wayfarer Diversified REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 7 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
          assert:
            - "Offering.${off_id}.name == \"Wayfarer Diversified REIT\""
            - "Offering.${off_id}.minimum_offering_amount_cents == 25000000"
            - "Offering.${off_id}.maximum_offering_amount_cents == 90000000000"
            - "Offering.${off_id}.escrow_deadline_date == \"2026-12-31\""
            - "Offering.${off_id}.initial_offering_price_cents == 1000"
            - "Offering.${off_id}.rescission_window_days == 7"
            - "Offering.${off_id}.registration_status == \"DRAFT\""
            - "Offering.${off_id}.escrow_status == \"COLLECTING\""
            - "Offering.${off_id}.repurchase_plan_status == \"ACTIVE\""
            - "Offering.${off_id}.repurchase_plan_suspension_reason == null"
            - "Offering.${off_id}.escrow_balance_cents == 0"
            - "Offering.${off_id}.gross_proceeds_cents == 0"
            - "Offering.${off_id}.aggregate_nav_cents == 0"
            - "Offering.${off_id}.version == 1"

      - name: offering_retrieval_returns_stored_offering_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /offerings/{offering_id}]
          - entities.Offering
        distinguishing_aspect: |
          A single-resource GET is a pure read: it returns the same field values
          the create call returned, leaves version at 1, and reports
          response_type 'object' rather than an array.
        test_recipe:
          setup:
            - "One Offering created with rescission_window_days 7 and no other activity."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Wayfarer Diversified REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 7 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
          trigger:
            - call: "GET /offerings/${off_id}"
              as: TransferAgent
              captures: { read_back_name: $.data.name }
          assert:
            - "read_back_name == \"Wayfarer Diversified REIT\""
            - "response.response_type == \"object\""
            - "Offering.${off_id}.rescission_window_days == 7"
            - "Offering.${off_id}.registration_status == \"DRAFT\""
            - "Offering.${off_id}.aggregate_nav_cents == 0"
            - "Offering.${off_id}.version == 1"

      - name: investor_listing_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /investors]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          total_count must describe the whole filtered set (3) while data carries
          only the requested page (2 then 1), and has_more must flip from true to
          false across the two pages — a per-page count would leave has_more true
          on the last page.
        test_recipe:
          setup:
            - "Three investor accounts created in a known order, no other rows."
          setup_api_calls:
            - call: "POST /investors"
              payload: { legal_name: "Ada Fennimore", email: "ada.fennimore@example.com", state_code: "TX", net_worth_cents: 400000000, annual_income_cents: 80000000 }
              as: SponsorOperator
              captures: { inv_1_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Bo Whitlock", email: "bo.whitlock@example.com", state_code: "TX", net_worth_cents: 400000000, annual_income_cents: 80000000 }
              as: SponsorOperator
              captures: { inv_2_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Cyd Marchetti", email: "cyd.marchetti@example.com", state_code: "TX", net_worth_cents: 400000000, annual_income_cents: 80000000 }
              as: SponsorOperator
              captures: { inv_3_id: $.data.id }
          trigger:
            - call: "GET /investors"
              payload: { limit: 2, offset: 0 }
              as: TransferAgent
              captures: { page_one_first_id: "$.data[0].id" }
            - call: "GET /investors"
              payload: { limit: 2, offset: 2 }
              as: TransferAgent
              captures: { page_two_first_id: "$.data[0].id" }
          assert:
            - "page_one response_type == \"array\" with exactly 2 rows"
            - "page_one total_count == 3"
            - "page_one has_more == true"
            - "page_two contains exactly 1 row"
            - "page_two total_count == 3"
            - "page_two has_more == false"
            - "page_one_first_id == ${inv_1_id}"
            - "page_two_first_id == ${inv_3_id}"

      - name: unknown_offering_id_returns_resource_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=4].error_id
          - endpoints[GET /offerings/{offering_id}]
        distinguishing_aspect: |
          A syntactically valid but unstored UUID on the path must return
          ERR_RESOURCE_NOT_FOUND with HTTP 404 and an error envelope — not an
          empty object, not 200 with null data.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /offerings/00000000-0000-4000-8000-000000000000"
              as: SponsorOperator
              captures: { not_found_error: $.data.error_id }
          assert:
            - "not_found_error == \"ERR_RESOURCE_NOT_FOUND\""
            - "response http status == 404"
            - "response.response_type == \"error\""

      - name: missing_required_field_on_offering_creation_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3].error_id
          - endpoints[POST /offerings]
        distinguishing_aspect: |
          minimum_offering_amount_cents carries no default, so omitting it is a
          schema failure (400) that must be reported before any business rule —
          the row must not be created with a zero or null minimum.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /offerings"
              payload: { name: "Halfbuilt REIT", maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { missing_field_error: $.data.error_id }
          assert:
            - "missing_field_error == \"ERR_INVALID_REQUEST\""
            - "response http status == 400"
            - "GET /offerings returns total_count == 0"

      - name: omitted_optional_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Offering.fields.rescission_window_days
          - entities.ShareClass.fields.converts_to_share_class_code
          - entities.SellingAgreement.fields.suitability_documentation_required
          - endpoints[POST /selling-agreements]
        distinguishing_aspect: |
          Three different defaults on three entities must all materialise from an
          absent key: rescission_window_days 5, converts_to_class_code null and
          suitability_documentation_required true — the last is a boolean whose
          default is true, so 'absent means false' is wrong.
        test_recipe:
          setup:
            - "An Offering and a ShareClass created without their optional keys."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Default Harbor REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Default Harbor Placement", crd_number: "CRD-180001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
          trigger:
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 700 }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
          assert:
            - "Offering.${off_id}.rescission_window_days == 5"
            - "ShareClass.${sc_id}.converts_to_class_code == null"
            - "ShareClass.${sc_id}.status == \"ACTIVE\""
            - "ShareClass.${sc_id}.shares_outstanding_e4 == 0"
            - "SellingAgreement.${sa_id}.suitability_documentation_required == true"
            - "SellingAgreement.${sa_id}.status == \"PENDING\""
            - "SellingAgreement.${sa_id}.open_minor_finding_count == 0"
            - "SellingAgreement.${sa_id}.open_major_finding_count == 0"

      - name: investor_concentration_limit_computed_from_state_dependent_basis
        claim_type: computed_fields
        grounds:
          - calculations.investor_concentration_limit
          - entities.Investor.fields.concentration_limit_cents
          - endpoints[POST /investors]
        distinguishing_aspect: |
          Two investors with identical net worth (100000000) and income
          (60000000) get different computed limits purely from state_code: OH is a
          strict state and measures 10% of the LESSER figure (6000000), TX
          measures 10% of net worth (10000000). The field is computed, never
          client-supplied.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /investors"
              payload: { legal_name: "Otis Havercamp", email: "otis.havercamp@example.com", state_code: "OH", net_worth_cents: 100000000, annual_income_cents: 60000000 }
              as: SponsorOperator
              captures: { inv_oh_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Tess Ballantyne", email: "tess.ballantyne@example.com", state_code: "TX", net_worth_cents: 100000000, annual_income_cents: 60000000 }
              as: SponsorOperator
              captures: { inv_tx_id: $.data.id }
          assert:
            - "Investor.${inv_oh_id}.concentration_limit_cents == 6000000"
            - "Investor.${inv_tx_id}.concentration_limit_cents == 10000000"
            - "Investor.${inv_oh_id}.suitability_status == \"INCOMPLETE\""
            - "Investor.${inv_oh_id}.suitability_documentation_reference == null"
            - "Investor.${inv_oh_id}.account_status == \"ACTIVE\""
            - "Investor.${inv_oh_id}.cumulative_invested_cents == 0"
            - "Investor.${inv_oh_id}.total_shares_e4 == 0"
            - "Investor.${inv_oh_id}.cumulative_distributions_received_cents == 0"
            - "Investor.${inv_oh_id}.cumulative_early_repurchase_deduction_cents == 0"

      - name: system_fields_minted_and_version_increments_on_each_mutation
        claim_type: system_fields
        grounds:
          - entities.Investor
          - endpoints[POST /investors/{investor_id}/suitability-documentation]
          - entities.Investor.fields.suitability_documentation_reference
        distinguishing_aspect: |
          id, created_at, updated_at and version are all server-minted: version
          starts at 1 on create and reaches exactly 2 after one mutation, id and
          created_at are unchanged by that mutation, and suitability_status flips
          only because the endpoint's side effect says so.
        test_recipe:
          setup:
            - "One INCOMPLETE investor account at version 1."
          setup_api_calls:
            - call: "POST /investors"
              payload: { legal_name: "Ruth Enderby", email: "ruth.enderby@example.com", state_code: "TX", net_worth_cents: 400000000, annual_income_cents: 80000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id, inv_v1: $.data.version, inv_created_at: $.data.created_at }
          trigger:
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-ENDERBY-2026-08" }
              as: ComplianceOfficer
              captures: { inv_v2: $.data.version }
          assert:
            - "inv_v1 == 1"
            - "inv_v2 == 2"
            - "Investor.${inv_id}.id == ${inv_id}"
            - "Investor.${inv_id}.created_at == ${inv_created_at}"
            - "Investor.${inv_id}.updated_at > ${inv_created_at} or equals it under the same logical instant, and is present in the response"
            - "Investor.${inv_id}.suitability_status == \"DOCUMENTED\""
            - "Investor.${inv_id}.suitability_documentation_reference == \"SUIT-ENDERBY-2026-08\""

      - name: type_constraint_violations_rejected_as_invalid_request
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3].description
          - entities.ShareClass.fields.class_code
          - entities.Offering.fields.maximum_offering_amount_cents
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three different shapes of type/range failure all resolve to the single
          schema error at priority 3: an enum member outside {T,S,D,I}, an
          inverted money interval (maximum < minimum) and a pagination limit of 0
          — none of them may be silently coerced.
        test_recipe:
          setup:
            - "One Offering exists so that the share-class body has a resolvable parent."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Typecheck REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "X", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { bad_enum_error: $.data.error_id }
            - call: "POST /offerings"
              payload: { name: "Inverted REIT", minimum_offering_amount_cents: 90000000000, maximum_offering_amount_cents: 25000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { inverted_range_error: $.data.error_id }
            - call: "GET /investors"
              payload: { limit: 0 }
              as: TransferAgent
              captures: { bad_limit_error: $.data.error_id }
          assert:
            - "bad_enum_error == \"ERR_INVALID_REQUEST\""
            - "inverted_range_error == \"ERR_INVALID_REQUEST\""
            - "bad_limit_error == \"ERR_INVALID_REQUEST\""
            - "GET /share-classes returns total_count == 0"
            - "GET /offerings returns total_count == 1"

      - name: stockholder_vote_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.StockholderVote
          - entities.StockholderVote.fields.voting_shares_e4
          - endpoints[POST /stockholder-votes]
          - state_machines.LiquidityEvent.BOARD_APPROVED_to_VOTE_OPEN
        distinguishing_aspect: |
          StockholderVote is declared common_fields: false — it must expose only
          id and created_at (no version, no updated_at), §1.5 must offer no
          update or delete route for it, and voting_shares_e4 must be the
          snapshot taken at casting time rather than a live read of the
          investor's holdings.
        test_recipe:
          setup:
            - "Offering 'Ballotwright REIT' EFFECTIVE, escrow BROKEN off a single 30000000-cent class I subscription (300000000 e4)."
            - "August NAV PUBLISHED at 1000 cents; clock at 2026-09-02."
            - "A LiquidityEvent driven to VOTE_OPEN, which snapshots record_date_shares_e4."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Ballotwright REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 5 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Ballotwright Placement", crd_number: "CRD-190001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100, suitability_documentation_required: true }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Wren Castellanos", email: "wren.castellanos@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-WREN-2026-08" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 30000000 }
              as: SponsorOperator
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: SponsorOperator
            - call: "GET /share-classes/${sc_id}"
              as: SponsorOperator
              captures: { sc_v: $.data.version }
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", gross_asset_value_cents: 30000000, other_liabilities_cents: 0, expected_share_class_version: "${sc_v}" }
              as: SponsorOperator
              captures: { nav_id: $.data.id }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: SponsorOperator
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_CONFIRMED", advisor_opinion_reference: "IVA-2026-08-BW" }
              as: IndependentValuationAdvisor
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SponsorOperator
            - call: "POST /liquidity-events"
              payload: { offering_id: "${off_id}", event_type: "LISTING", proposed_effective_date: "2027-03-01" }
              as: SponsorOperator
              captures: { le_id: $.data.id }
            - call: "POST /liquidity-events/${le_id}/status"
              payload: { action: "BOARD_APPROVE" }
              as: BoardCommittee
            - call: "POST /liquidity-events/${le_id}/status"
              payload: { action: "OPEN_VOTE" }
              as: SponsorOperator
          trigger:
            - call: "POST /stockholder-votes"
              payload: { liquidity_event_id: "${le_id}", choice: "FOR" }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { vote_id: $.data.id }
          assert:
            - "StockholderVote.${vote_id}.investor_id == ${inv_id}"
            - "StockholderVote.${vote_id}.choice == \"FOR\""
            - "StockholderVote.${vote_id}.voting_shares_e4 == 300000000"
            - "StockholderVote.${vote_id} exposes id and created_at and NO version field"
            - "§1.5 declares no PUT, PATCH or DELETE route under /stockholder-votes"
            - "LiquidityEvent.${le_id}.record_date_shares_e4 == 300000000"
            - "LiquidityEvent.${le_id}.status == \"VOTE_OPEN\""

      - name: cross_reference_integrity_resolves_body_foreign_keys_in_declared_order
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=4].check
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints[POST /subscriptions]
        distinguishing_aspect: |
          With a flat topology every relationship is a body foreign key, so a
          subscription body naming four parents must resolve them in the declared
          order offering_id, share_class_id, investor_id, selling_agreement_id —
          a body with two bad ids reports the offering, and the fully valid body
          then succeeds against the very same endpoint.
        test_recipe:
          setup:
            - "Offering 'Crossref REIT' EFFECTIVE with one zero-load class I, an ACTIVE selling agreement and one DOCUMENTED investor."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Crossref REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 5 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Crossref Placement", crd_number: "CRD-200002" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100, suitability_documentation_required: true }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Ines Broadwater", email: "ines.broadwater@example.com", state_code: "TX", net_worth_cents: 400000000, annual_income_cents: 80000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-INES-2026-08" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /subscriptions"
