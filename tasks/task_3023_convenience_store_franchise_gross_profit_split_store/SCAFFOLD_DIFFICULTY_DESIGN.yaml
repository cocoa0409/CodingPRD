            - call: "POST /franchise/settlements/${setL_id}/revenue-lines"
              payload: { category: "MERCHANDISE", gross_sales_cents: 30000000, cost_of_goods_cents: 22000000, expected_settlement_version: "${setL_v1}" }
              as: FranchisorAdmin
              captures: { setL_v2: $.data.version }
            - call: "POST /franchise/settlements/${setL_id}/revenue-lines"
              payload: { category: "FUEL", gross_sales_cents: 20000000, cost_of_goods_cents: 18500000, expected_settlement_version: "${setL_v2}" }
              as: FranchisorAdmin
              captures: { setL_v3: $.data.version }
            - call: "POST /franchise/settlements/${setL_id}/revenue-lines"
