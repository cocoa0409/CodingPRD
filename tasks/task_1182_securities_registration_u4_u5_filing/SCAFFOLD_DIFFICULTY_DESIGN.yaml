            - "status at exactly 2026-10-01T12:00:00Z == EXPIRED (>= boundary; parent request still DRAFT so flip applies)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depths >=3 and >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: u5_termination_three_hop_cascade
        grounds:
          - state_machines.RegistrationRequest.ACTIVE_to_TERMINATED
          - state_machines.AffiliationRequest.APPROVED_to_REVOKED
          - state_machines.RenewalInvoice.ISSUED_to_VOID
        distinguishing_aspect: |
          Depth-3 chain from the U5 filing trigger: POST termination-filings
          terminates the RegistrationRequest (hop 1); that termination revokes
          the APPROVED AffiliationRequest built on it (hop 2); and the
          revocation itself voids the ISSUED RenewalInvoice hanging on the
          request (hop 3 — invoice void is a consequence of the termination
          cascade context, chained through the revocation link's side-effect
          list). Each link is caused by the previous link, not by the POST.
        test_recipe:
          setup:
            - "Firms F1 and F2; applicant X with ACTIVE registration R1 at F1 (approved 2026-06-02, ACTIVE 2026-06-03)"
            - "APPROVED affiliation AF at F2 built on R1; ISSUED RenewalInvoice INV on R1 for cycle 2027"
            - "Clock at 2026-08-01T00:00:00Z; termination_date 2026-07-31"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1401", legal_name: "Cascade One" }
              as: SystemOperator
              captures: { firm_c1_id: $.data.id }
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1402", legal_name: "Cascade Two" }
              as: SystemOperator
              captures: { firm_c2_id: $.data.id }
