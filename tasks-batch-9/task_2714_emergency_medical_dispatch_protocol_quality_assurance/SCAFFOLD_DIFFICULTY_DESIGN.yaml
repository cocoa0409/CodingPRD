              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-M01", full_name: "Zaid Marchetti" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /coaching-plans"
              payload: { dispatcher_id: "${d1_id}", expected_dispatcher_version: "${d1_v}", severity: "ADVISORY", focus_area: "CASE_ENTRY" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { plan1_id: $.data.id }
            - call: "POST /coaching-plans/${plan1_id}/retraining-sessions"
              payload: { protocol_version_id: "${pv_id}", starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T11:00:00Z", modality: "CLASSROOM" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sessa_id: $.data.id }
            - call: "POST /retraining-sessions/${sessa_id}/complete"
              payload: { attendance_confirmed: true }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "GET /dispatchers/${d1_id}"
              payload: {}
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { d1_v2: $.data.version }
            - call: "POST /coaching-plans"
              payload: { dispatcher_id: "${d1_id}", expected_dispatcher_version: "${d1_v2}", severity: "STANDARD", focus_area: "PRE_ARRIVAL_INSTRUCTIONS" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { plan2_id: $.data.id }
          trigger:
            - call: "POST /coaching-plans/${plan2_id}/retraining-sessions"
