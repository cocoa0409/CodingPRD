# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource referenced in path or body does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, unknown field, type mismatch, or constraint violation on a single field"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which this transition is allowed"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the current parent version (see §1.2.1)"

  - id: ERR_OVERPAYMENT
    http: 422
    condition: "PaymentApplication.amount_cents exceeds remaining outstanding"

  - id: ERR_BALANCE_NONZERO
    http: 422
    condition: "Lien satisfy refused because Property.account_balance_cents != 0"

  - id: ERR_BALANCE_BELOW_THRESHOLD
    http: 422
    condition: "Foreclosure refused because Property.account_balance_cents < Community.lien_threshold_cents at the time of call"

  - id: ERR_PROPERTY_SUSPENDED
    http: 422
    condition: "ACC approval refused because Property.compliance_posture == SUSPENDED"

  - id: ERR_ACC_REVISION_LIMIT
    http: 422
    condition: "request-revision refused because ACCRequest.revision_count == 3"

  - id: ERR_INVALID_ELECTION_WINDOW
    http: 422
    condition: "Election open refused: closes_at - opens_at < 14 days OR current_utc >= opens_at"

  - id: ERR_ELECTION_NOT_OPEN
    http: 422
    condition: "Vote rejected: election.status != OPEN or current_utc >= closes_at"

  - id: ERR_VOTER_INELIGIBLE
    http: 422
    condition: "Voter has is_eligible_voter == false at vote time or owns no Property in this Community"

  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "An existing Vote with state == CAST already exists for (election_id, owner_id)"

  - id: ERR_DUPLICATE_RESERVE_STUDY
    http: 409
    condition: "A ReserveStudy already exists for (community_id, fiscal_year)"

  - id: ERR_DUPLICATE_OWNER_EMAIL
    http: 409
    condition: "Owner.email already used within this Community"

  - id: ERR_DUPLICATE_UNIT_LABEL
    http: 409
    condition: "Property.unit_label already used within this Community"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "BoardPresident who certifies is the same X-User-ID as the BoardSecretary who issued OPEN"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: Platform operator; bootstraps communities and owners; controls test clock
    identity: opaque
    exclusive_operations:
      - "POST /hoa/communities"
      - "POST /hoa/owners"
      - "POST /hoa/properties"
      - "POST /hoa/_clock/set_current_utc"
    shared_operations:
      - "POST /hoa/reserve-components (with BoardPresident)"
      - "All GETs"

  - name: BoardPresident
    description: HOA board president; senior board officer (election certification, waivers, foreclosure, reserve study)
    identity: opaque
    exclusive_operations:
      - "POST /hoa/assessments/{id}/waive"
      - "POST /hoa/elections/{id}/certify"
      - "POST /hoa/elections/{id}/invalidate"
      - "POST /hoa/liens/{id}/initiate-foreclosure"
      - "POST /hoa/reserve-studies"
    shared_operations:
      - "POST /hoa/reserve-components (with PlatformAdmin)"
      - "All GETs"

  - name: BoardSecretary
    description: Board secretary; records-keeper (violations adjudication, elections process, lien recording)
    identity: opaque
    exclusive_operations:
      - "POST /hoa/violations"
      - "POST /hoa/violations/{id}/uphold"
      - "POST /hoa/violations/{id}/dismiss"
      - "POST /hoa/elections"
      - "POST /hoa/elections/{id}/open"
      - "POST /hoa/elections/{id}/close"
      - "POST /hoa/liens/{id}/satisfy"
    shared_operations:
      - "All GETs"

  - name: Treasurer
    description: Treasury officer; runs the ledger (assessments, payments)
    identity: opaque
    exclusive_operations:
      - "POST /hoa/assessments"
      - "POST /hoa/payments/{id}/reverse"
    shared_operations:
      - "POST /hoa/payments (with HomeOwner)"
      - "GET /hoa/assessments/{id}/projected-balance (with HomeOwner)"
      - "All GETs"

  - name: ACCMember
    description: Member of the Architectural Control Committee
    identity: opaque
    exclusive_operations:
      - "POST /hoa/acc-requests/{id}/approve"
      - "POST /hoa/acc-requests/{id}/reject"
      - "POST /hoa/acc-requests/{id}/request-revision"
    shared_operations:
      - "All GETs (scoped to ACC + general)"

  - name: HomeOwner
    description: Property owner; X-User-ID equals Owner.id; ownership checks compare against Property.owner_id
    identity: entity_backed:Owner
    exclusive_operations:
      - "POST /hoa/acc-requests"
      - "POST /hoa/acc-requests/{id}/resubmit"
      - "POST /hoa/acc-requests/{id}/withdraw"
      - "POST /hoa/violations/{id}/contest"
      - "POST /hoa/violations/{id}/pay-fine"
      - "POST /hoa/votes"
      - "POST /hoa/votes/{id}/retract"
    shared_operations:
      - "POST /hoa/payments (with Treasurer)"
      - "GET /hoa/assessments/{id}/projected-balance (with Treasurer)"
      - "GETs on own resources"
