              as: Applicator
              as_user_id: "${a1}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plans/${pl1}/applications"
              payload: { product_epa_number: "1234-56", gallons_applied: 0.00, concentration_pct: 0.01, expected_treatment_plan_version: "${v1}" }
