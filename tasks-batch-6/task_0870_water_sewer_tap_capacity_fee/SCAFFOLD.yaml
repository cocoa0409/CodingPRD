  - method: POST
    path: "/inspections/{id}/fail"
    description: Mark an inspection failed.
    roles: [FieldInspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status -> FAILED", "cascade backflow -> FAILED if backflow inspection"]
  - method: POST
    path: "/inspections/{id}/cancel"
    description: Cancel a requested/scheduled inspection.
    roles: [FieldInspector]
    code: 200
