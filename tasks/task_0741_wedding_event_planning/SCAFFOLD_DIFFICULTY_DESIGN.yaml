# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules × 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls / trigger call resolves to a
# §1.5 endpoint; every ${var} is bound by an earlier captures block.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: budget_committed_vs_projected_spend
        grounds:
          - calculations.budget_rollup
          - entities.EventProject.fields.committed_spend_cents
          - entities.EventProject.fields.projected_spend_cents
          - state_machines.VendorBooking.PROPOSED_to_BOOKED
        distinguishing_aspect: "On the EventProject budget domain, committed_spend (BOOKED at contracted) and projected_spend (adds a PROPOSED booking at estimated) yield 3000000 vs 5000000 for the same booking set."
        test_recipe:
          setup:
            - "Event FULL, budget 10,000,000; contract COUNTERSIGNED; event confirmed to BOOKING."
            - "Vendor with a VERIFIED COI expiring after the event date."
            - "Booking A BOOKED at contracted 3,000,000; Booking B left PROPOSED with estimated 2,000,000."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "A & B", event_date: "2026-09-15T00:00:00Z", venue_name: "Grand Hall", package_type: "FULL", total_budget_cents: 10000000, guest_count_estimate: 150 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
            - call: "POST /planning/vendors"
              payload: { name: "Blooms", category: "FLORAL", contact_email: "b@x.com" }
              as: Planner
              captures: { vd_id: $.data.id }
            - call: "POST /planning/cois"
              payload: { vendor_id: "${vd_id}", policy_number: "P-1", coverage_amount_cents: 100000000, coverage_expiry_date: "2027-01-01T00:00:00Z" }
              as: Planner
              captures: { coi_id: $.data.id }
            - call: "POST /planning/cois/${coi_id}/verify"
              payload: {}
              as: Planner
            - call: "POST /planning/vendor-bookings"
              payload: { event_id: "${ev_id}", vendor_id: "${vd_id}", service_description: "Florals", estimated_cost_cents: 1500000 }
              as: Planner
              captures: { vb_a: $.data.id }
            - call: "POST /planning/vendor-bookings/${vb_a}/book"
              payload: { contracted_cost_cents: 3000000 }
              as: Planner
            - call: "POST /planning/vendor-bookings"
              payload: { event_id: "${ev_id}", vendor_id: "${vd_id}", service_description: "Rentals", estimated_cost_cents: 2000000 }
              as: Planner
              captures: { vb_b: $.data.id }
          trigger:
            - call: "GET /planning/events/${ev_id}"
              payload: {}
              as: Planner
              captures: { committed: $.data.committed_spend_cents, projected: $.data.projected_spend_cents }
          assert:
            - "EventProject.${ev_id}.committed_spend_cents == 3000000"
            - "EventProject.${ev_id}.projected_spend_cents == 5000000"
            - "EventProject.${ev_id}.budget_balance_cents == 7000000"
            - "committed != projected (variant divergence: PROPOSED booking B counted at estimate only in projected)"

      - name: headcount_estimated_vs_confirmed
        grounds:
          - calculations.catering_headcount
          - entities.EventProject.fields.estimated_headcount
          - entities.EventProject.fields.confirmed_headcount
          - state_machines.Guest.INVITED_to_ACCEPTED
        distinguishing_aspect: "On the Guest domain, estimated_headcount (INVITED+ACCEPTED) is 9 while confirmed_headcount (ACCEPTED only) is 7 for the same guest set — a different entity domain than the budget dual-variant."
        test_recipe:
          setup:
            - "Event created (DRAFT is fine — guest ops do not require BOOKING)."
            - "G1 party 4 ACCEPTED; G2 party 2 left INVITED; G3 party 3 ACCEPTED; G4 party 5 DECLINED."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "C & D", event_date: "2026-09-15T00:00:00Z", venue_name: "Garden", package_type: "PARTIAL", total_budget_cents: 5000000, guest_count_estimate: 20 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G1", party_size: 4 }
              as: Planner
              captures: { g1: $.data.id }
            - call: "POST /planning/guests/${g1}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G2", party_size: 2 }
              as: Planner
              captures: { g2: $.data.id }
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G3", party_size: 3 }
              as: Planner
              captures: { g3: $.data.id }
            - call: "POST /planning/guests/${g3}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G4", party_size: 5 }
              as: Planner
              captures: { g4: $.data.id }
            - call: "POST /planning/guests/${g4}/rsvp"
              payload: { rsvp_status: "DECLINED" }
              as: Planner
          trigger:
            - call: "GET /planning/events/${ev_id}"
              payload: {}
              as: Planner
              captures: { est: $.data.estimated_headcount, conf: $.data.confirmed_headcount }
          assert:
            - "EventProject.${ev_id}.estimated_headcount == 9"
            - "EventProject.${ev_id}.confirmed_headcount == 7"
            - "estimated != confirmed (INVITED party G2=2 present in estimated only)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: planner_fee_full_budget_tiered
        grounds:
          - calculations.planner_fee
          - entities.Contract.fields.planner_fee_cents
          - entities.EventProject.fields.total_budget_cents
        distinguishing_aspect: "Mode (a): planner_fee for FULL branches on package_type, selects the 15% tier because 5,000,000 < 10,000,000 <= 15,000,000, and adds BASE_FULL — three inputs with tier selection = 2,300,000."
        test_recipe:
          setup:
            - "Event FULL, budget 10,000,000, guest_count_estimate 150; create its contract."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "E & F", event_date: "2026-10-01T00:00:00Z", venue_name: "Estate", package_type: "FULL", total_budget_cents: 10000000, guest_count_estimate: 150 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
          trigger:
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id, fee: $.data.planner_fee_cents }
          assert:
            - "Contract.${ct_id}.planner_fee_cents == 2300000"
            - "Contract.${ct_id}.package_type == FULL"

      - name: deposit_round_per_line_then_sum
        grounds:
          - calculations.vendor_payment_split
          - calculations.budget_rollup
          - entities.EventProject.fields.total_deposits_due_cents
          - entities.VendorBooking.fields.deposit_cents
        distinguishing_aspect: "Mode (b): total_deposits_due rounds each booking's 30% deposit (round_half_up(100005*0.30)=30002) then sums to 60004; sum-then-round would give 60003, so the pinned rounding order is observable."
        test_recipe:
          setup:
            - "Event FULL budget 100,000,000; contract COUNTERSIGNED; confirmed to BOOKING; vendor with VERIFIED COI."
            - "Two bookings each BOOKED at contracted 100,005."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "G & H", event_date: "2026-09-15T00:00:00Z", venue_name: "Loft", package_type: "FULL", total_budget_cents: 100000000, guest_count_estimate: 100 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
            - call: "POST /planning/vendors"
              payload: { name: "Catering Co", category: "CATERING", contact_email: "c@x.com" }
              as: Planner
              captures: { vd_id: $.data.id }
            - call: "POST /planning/cois"
              payload: { vendor_id: "${vd_id}", policy_number: "P-2", coverage_amount_cents: 100000000, coverage_expiry_date: "2027-01-01T00:00:00Z" }
              as: Planner
              captures: { coi_id: $.data.id }
            - call: "POST /planning/cois/${coi_id}/verify"
              payload: {}
              as: Planner
            - call: "POST /planning/vendor-bookings"
              payload: { event_id: "${ev_id}", vendor_id: "${vd_id}", service_description: "Dinner", estimated_cost_cents: 100000 }
              as: Planner
              captures: { vb_a: $.data.id }
            - call: "POST /planning/vendor-bookings/${vb_a}/book"
              payload: { contracted_cost_cents: 100005 }
              as: Planner
              captures: { dep_a: $.data.deposit_cents }
            - call: "POST /planning/vendor-bookings"
              payload: { event_id: "${ev_id}", vendor_id: "${vd_id}", service_description: "Cake", estimated_cost_cents: 100000 }
              as: Planner
              captures: { vb_b: $.data.id }
            - call: "POST /planning/vendor-bookings/${vb_b}/book"
              payload: { contracted_cost_cents: 100005 }
              as: Planner
          trigger:
            - call: "GET /planning/events/${ev_id}"
              payload: {}
              as: Planner
              captures: { tdd: $.data.total_deposits_due_cents }
          assert:
            - "VendorBooking.${vb_a}.deposit_cents == 30002"
            - "VendorBooking.${vb_a}.balance_cents == 70003"
            - "EventProject.${ev_id}.total_deposits_due_cents == 60004"
            - "sum-then-round (60003) is NOT produced; per-line rounding is pinned"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_revision_cycle
        grounds:
          - state_machines.Contract.SENT_to_DRAFT
          - state_machines.Contract.DRAFT_to_SENT
          - entities.Contract.fields.revision_count
        distinguishing_aspect: "Contract cycles DRAFT->SENT->DRAFT->SENT (revision loop); revision_count reaches 1 and status returns to SENT — a cycle, not a linear pipeline."
        test_recipe:
          setup:
            - "Event created; contract created and SENT."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "I & J", event_date: "2026-09-15T00:00:00Z", venue_name: "Pier", package_type: "DAY_OF", total_budget_cents: 3000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
          trigger:
            - call: "POST /planning/contracts/${ct_id}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
              captures: { st: $.data.status, rc: $.data.revision_count }
          assert:
            - "Contract.${ct_id}.status == SENT"
            - "Contract.${ct_id}.revision_count == 1"

      - name: guest_rsvp_accept_decline_cycle
        grounds:
          - state_machines.Guest.ACCEPTED_to_DECLINED
          - state_machines.Guest.DECLINED_to_ACCEPTED
          - entities.Guest.fields.rsvp_status
        distinguishing_aspect: "Guest cycles ACCEPTED->DECLINED->ACCEPTED on a different entity than Contract; the second accept lands back at ACCEPTED, proving the cycle."
        test_recipe:
          setup:
            - "Event created; one guest party 2 currently ACCEPTED."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "K & L", event_date: "2026-09-15T00:00:00Z", venue_name: "Barn", package_type: "PARTIAL", total_budget_cents: 4000000, guest_count_estimate: 50 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G", party_size: 2 }
              as: Planner
              captures: { g: $.data.id }
            - call: "POST /planning/guests/${g}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
          trigger:
            - call: "POST /planning/guests/${g}/rsvp"
              payload: { rsvp_status: "DECLINED" }
              as: Planner
            - call: "POST /planning/guests/${g}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
              captures: { st: $.data.rsvp_status }
          assert:
            - "Guest.${g}.rsvp_status == ACCEPTED"
            - "EventProject.${ev_id}.confirmed_headcount == 2 (re-accept restores the confirmed count)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_cascade_booking_payment_depth3
        grounds:
          - state_machines.EventProject.BOOKING_to_CANCELLED
          - state_machines.VendorBooking.BOOKED_to_CANCELLED
          - state_machines.VendorPayment.SCHEDULED_to_VOID
        distinguishing_aspect: "Depth-3 chain: event cancel -> booking CANCELLED (caused by event) -> that booking's SCHEDULED payments VOID (caused by the booking transition, not by the event)."
        test_recipe:
          setup:
            - "Event BOOKING; vendor with VERIFIED COI; booking A BOOKED at 2,000,000 with two SCHEDULED payments."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "M & N", event_date: "2026-09-15T00:00:00Z", venue_name: "Hall", package_type: "FULL", total_budget_cents: 10000000, guest_count_estimate: 120 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
            - call: "POST /planning/vendors"
              payload: { name: "Photo Co", category: "PHOTO", contact_email: "p@x.com" }
              as: Planner
              captures: { vd_id: $.data.id }
            - call: "POST /planning/cois"
              payload: { vendor_id: "${vd_id}", policy_number: "P-3", coverage_amount_cents: 100000000, coverage_expiry_date: "2027-01-01T00:00:00Z" }
              as: Planner
              captures: { coi_id: $.data.id }
            - call: "POST /planning/cois/${coi_id}/verify"
              payload: {}
              as: Planner
            - call: "POST /planning/vendor-bookings"
              payload: { event_id: "${ev_id}", vendor_id: "${vd_id}", service_description: "Photography", estimated_cost_cents: 1800000 }
              as: Planner
              captures: { vb_a: $.data.id }
            - call: "POST /planning/vendor-bookings/${vb_a}/book"
              payload: { contracted_cost_cents: 2000000 }
              as: Planner
          trigger:
            - call: "POST /planning/events/${ev_id}/cancel"
              payload: {}
              as: Planner
              captures: { est: $.data.status }
          assert:
            - "EventProject.${ev_id}.status == CANCELLED"
            - "VendorBooking.${vb_a}.status == CANCELLED"
            - "VendorPayment[vendor_booking_id=${vb_a}].status == VOID for every payment of the booking"
            - "Contract.${ct_id}.status == VOID"
            - "EventProject.${ev_id}.committed_spend_cents == 0 (budget restored by the booking-cancel link)"

      - name: guest_decline_unseat_cascade_depth2
        grounds:
          - state_machines.Guest.ACCEPTED_to_DECLINED
          - entities.SeatAssignment.fields.seats_used
          - entities.Table.fields.occupied_seats
        distinguishing_aspect: "Depth-2 chain from a different trigger (RSVP decline): guest ACCEPTED->DECLINED -> its SeatAssignment deleted -> Table.occupied_seats decremented by seats_used."
        test_recipe:
          setup:
            - "Event created; table capacity 5; guest party 3 ACCEPTED and seated (occupied_seats 3)."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "O & P", event_date: "2026-09-15T00:00:00Z", venue_name: "Club", package_type: "PARTIAL", total_budget_cents: 4000000, guest_count_estimate: 40 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/tables"
              payload: { event_id: "${ev_id}", table_label: "T1", capacity: 5 }
              as: Planner
              captures: { tb: $.data.id }
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G", party_size: 3 }
              as: Planner
              captures: { g: $.data.id }
            - call: "POST /planning/guests/${g}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
            - call: "POST /planning/seat-assignments"
              payload: { event_id: "${ev_id}", guest_id: "${g}", table_id: "${tb}" }
              as: Planner
              captures: { sa: $.data.id }
          trigger:
            - call: "POST /planning/guests/${g}/rsvp"
              payload: { rsvp_status: "DECLINED" }
              as: Planner
          assert:
            - "Guest.${g}.rsvp_status == DECLINED"
            - "SeatAssignment ${sa} no longer exists (GET /planning/seat-assignments?guest_id=${g} returns empty)"
            - "Table.${tb}.occupied_seats == 0"
            - "EventProject.${ev_id}.confirmed_headcount == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: seat_guest_not_accepted_beats_capacity
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - state_machines.Guest.INVITED_to_ACCEPTED
        distinguishing_aspect: "state (priority 9, ERR_GUEST_NOT_ACCEPTED) is returned over business_constraint (priority 13, ERR_TABLE_CAPACITY_EXCEEDED) when a still-INVITED guest is seated at a full table — the pair is state vs business_constraint."
        test_recipe:
          setup:
            - "Event created; table capacity 1 filled by an ACCEPTED guest (occupied 1); a second guest party 1 left INVITED."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "Q & R", event_date: "2026-09-15T00:00:00Z", venue_name: "Loft2", package_type: "PARTIAL", total_budget_cents: 3000000, guest_count_estimate: 10 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/tables"
              payload: { event_id: "${ev_id}", table_label: "T1", capacity: 1 }
              as: Planner
              captures: { tb: $.data.id }
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "GA", party_size: 1 }
              as: Planner
              captures: { ga: $.data.id }
            - call: "POST /planning/guests/${ga}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
            - call: "POST /planning/seat-assignments"
              payload: { event_id: "${ev_id}", guest_id: "${ga}", table_id: "${tb}" }
              as: Planner
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "GB", party_size: 1 }
              as: Planner
              captures: { gb: $.data.id }
          trigger:
            - call: "POST /planning/seat-assignments"
              payload: { event_id: "${ev_id}", guest_id: "${gb}", table_id: "${tb}" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GUEST_NOT_ACCEPTED"
            - "HTTP status == 409 (not ERR_TABLE_CAPACITY_EXCEEDED, though capacity is also violated)"

      - name: book_coi_not_verified_beats_budget
        grounds:
          - validations[priority=11]
          - validations[priority=14]
          - state_machines.VendorBooking.PROPOSED_to_BOOKED
        distinguishing_aspect: "business_safety (priority 11, ERR_COI_NOT_VERIFIED) is returned over business_fiscal (priority 14, ERR_BUDGET_EXCEEDED) when booking with an unverified COI AND an over-budget cost — the pair is business_safety vs business_fiscal."
        test_recipe:
          setup:
            - "Event BOOKING, budget only 1,000,000; vendor whose COI is still PENDING (not verified)."
            - "Booking PROPOSED; book attempted at contracted 5,000,000 (both COI-invalid and over budget)."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "S & T", event_date: "2026-09-15T00:00:00Z", venue_name: "Hall2", package_type: "FULL", total_budget_cents: 1000000, guest_count_estimate: 60 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
            - call: "POST /planning/vendors"
              payload: { name: "Rentals Inc", category: "RENTAL", contact_email: "r@x.com" }
              as: Planner
              captures: { vd_id: $.data.id }
            - call: "POST /planning/cois"
              payload: { vendor_id: "${vd_id}", policy_number: "P-4", coverage_amount_cents: 100000000, coverage_expiry_date: "2027-01-01T00:00:00Z" }
              as: Planner
              captures: { coi_id: $.data.id }
