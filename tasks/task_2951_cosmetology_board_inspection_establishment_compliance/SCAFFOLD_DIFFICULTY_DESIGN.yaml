  - rule_id: compensating_invariant
    instances:
      - name: dismissed_citation_conserves_fine_cents_and_demerit_points_to_zero
        grounds:
          - state_machines.Citation.HEARING_SCHEDULED_to_DISMISSED
          - calculations.citation_total_due_cents
          - calculations.establishment_demerit_and_posture
          - entities.LedgerEntry.fields.entry_reason
          - entities.Citation.fields.outstanding_fine_cents
          - entities.Establishment.fields.outstanding_fine_total_cents
        distinguishing_aspect: |
          Conserved quantity: money, in the FINE_CENTS ledger. A DISMISSED decision must post an
          equal-and-opposite CITATION_DISMISSAL_REVERSAL of -54000 and an INSPECTION_DEMERIT_REVERSAL
          of -80.00 rather than editing or deleting the original rows, so the ledger sums must return
          to exactly 0 while both original rows remain readable. An implementation that mutates the
          assessment row, or that zeroes outstanding_fine_cents without a compensating entry, fails
          the row-count and history checks even though the balances look right.
        test_recipe:
          setup:
            - "One CRITICAL violation code FSP-300 (base_points 4.0, fine_cents_base 30000) is published."
            - "One establishment 'Marina Spa' with license_status PENDING_INSPECTION and demerit_balance 0.00."
            - "A ROUTINE inspection by inspector 'insp-014' is finalized with one FSP-300 finding observed 4 times and not corrected on site: 4.0 * 5.0 * 4 * 1.0 = 80.00, outcome FAIL, demerit_balance_before_finalize 0.00."
            - "A citation is issued on it: base 30000, excess points 50.00, surcharge 20000, tier 1.00, assessed 50000, admin fee 8% = 4000, total 54000."
            - "The citation has been contested and a hearing scheduled before presiding officer 'ho-001', who is not the inspector."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z throughout, so the contest is inside the 30-day window."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "FSP-300", category: "FOOT_SPA", severity: "CRITICAL", base_points: 4.0, fine_cents_base: 30000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Marina Spa", establishment_type: "ESTHETICS_SPA", county_code: "NCN", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-04T09:00:00Z", window_end_at: "2026-08-04T17:00:00Z", inspector_user_id: "insp-014" }
              as: Inspector
              as_user_id: "insp-014"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-014"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_id}", observed_count: 4, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-014"
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-014"
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { insp_v: $.data.version }
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { cit_id: $.data.id }
            - call: "POST /cosmetology/citations/${cit_id}/contest"
              payload: { grounds: "the foot spa screens were replaced before the inspection window opened" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/citations/${cit_id}/hearings"
              payload: { presiding_officer_user_id: "ho-001", scheduled_at: "2026-08-25T14:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { hearing_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/hearings/${hearing_id}/decision"
              payload: { decision: "DISMISSED", rationale: "replacement invoices predate the window; the finding cannot stand" }
              as: HearingOfficer
              as_user_id: "ho-001"
          assert:
            - "Hearing.${hearing_id}.status == DECIDED and Hearing.${hearing_id}.decided_at == 2026-08-01T00:00:00.000Z"
            - "Citation.${cit_id}.status == DISMISSED"
            - "Citation.${cit_id}.assessed_fine_cents == 50000 and Citation.${cit_id}.total_due_cents == 54000"
            - "Citation.${cit_id}.outstanding_fine_cents == 0"
            - "GET /cosmetology/ledger-entries?citation_id=${cit_id}&ledger_type=FINE_CENTS returns total_count == 2, one row with entry_reason CITATION_ASSESSMENT and delta_cents == 54000 and one with entry_reason CITATION_DISMISSAL_REVERSAL and delta_cents == -54000, summing to 0"
            - "GET /cosmetology/ledger-entries?establishment_id=${est_id}&ledger_type=DEMERIT_POINTS returns total_count == 2, one row with entry_reason INSPECTION_DEMERIT_ASSESSMENT and delta_points == 80.00 and one with entry_reason INSPECTION_DEMERIT_REVERSAL and delta_points == -80.00, summing to 0.00"
            - "Establishment.${est_id}.demerit_balance == 0.00"
            - "Establishment.${est_id}.compliance_posture == CLEAR"
            - "Establishment.${est_id}.outstanding_fine_total_cents == 0"
            - "Establishment.${est_id}.delinquent_fine_total_cents == 0"
            - "Establishment.${est_id}.open_critical_citation_count == 0"
            - "Inspection.${insp_id}.final_adjusted_score == 80.00 and Inspection.${insp_id}.status == FINALIZED"

      - name: reinstatement_conserves_sanction_points_without_restoring_terminated_rental
        grounds:
          - calculations.practitioner_sanction_points
          - state_machines.Practitioner.SUSPENDED_to_ACTIVE
          - entities.Practitioner.fields.sanction_points
          - entities.Practitioner.fields.suspension_cause_points
          - entities.LedgerEntry.fields.delta_points
          - entities.BoothRental.fields.status
        distinguishing_aspect: |
          A different conserved quantity - sanction points in the SANCTION_POINTS ledger - reversed by
          a different trigger. REINSTATE must post exactly one -20.00 REINSTATEMENT_SANCTION_REVERSAL
          derived from the suspension_cause_points snapshot (not from
          SUBSTANTIATED_SANCTION_POINTS), driving the sum to 0.00. Crucially the compensation is
          scoped to that one quantity: the rental terminated by the suspension stays TERMINATED and
          the workstation posting stays STALE_POSTING, so an implementation that "undoes the
          suspension" wholesale over-compensates.
        test_recipe:
          setup:
            - "One school 'Lakeside Institute' with required_clock_hours 16.0."
            - "One ACTIVE NAIL_TECHNICIAN 'Vera Iles' credited with 16.00 school hours, licence effective 2026-08-01T00:00:00Z."
            - "One establishment 'Aqua Nails' with NAIL_TABLE workstation number 1, an ACTIVE booth rental for Vera Iles and Vera Iles posted there, so posting_status is COMPLIANT."
            - "Two infection incidents naming Vera Iles have been notified and resolved SUBSTANTIATED, so her sanction_points is 20.00, she is SUSPENDED with suspension_cause_points 20.00, the rental is TERMINATED and the posting is STALE_POSTING."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Lakeside Institute", county_code: "NCJ", required_clock_hours: 16.0, accreditation_status: "ACCREDITED" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { school_id: $.data.id }
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Vera Iles", license_type: "NAIL_TECHNICIAN", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-06", discipline: "SANITATION", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "reg-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-07", discipline: "DISINFECTION", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "reg-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "GRANT_EXAM_ELIGIBILITY" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "ISSUE_LICENSE", effective_at: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Aqua Nails", establishment_type: "NAIL_SALON", county_code: "NCC", station_capacity: 6 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "NAIL_TABLE" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_id}", practitioner_id: "${prac_id}", rental_type: "BOOTH_RENTER_INDEPENDENT_CONTRACTOR", term_start_at: "2026-08-01T00:00:00Z", monthly_rent_cents: 88000, expected_workstation_version: "${ws_v1}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { rental_id: $.data.id }
            - call: "POST /cosmetology/workstations/${ws_id}/posting"
              payload: { posted_practitioner_id: "${prac_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/booth-rentals/${rental_id}/activation"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/infection-incidents"
              payload: { establishment_id: "${est_id}", case_count: 1, onset_date: "2026-07-25", suspected_practitioner_id: "${prac_id}", narrative: "one client with a nail bed infection" }
              as: Inspector
              as_user_id: "insp-015"
              captures: { inc1_id: $.data.id }
            - call: "POST /cosmetology/infection-incidents/${inc1_id}/notification"
              payload: { health_authority_reference: "PH-2026-2001" }
              as: HealthAuthorityLiaison
              as_user_id: "ha-001"
            - call: "POST /cosmetology/infection-incidents/${inc1_id}/resolution"
              payload: { resolution: "SUBSTANTIATED", findings_summary: "unsanitised nippers traced to this practitioner" }
              as: HealthAuthorityLiaison
              as_user_id: "ha-001"
            - call: "POST /cosmetology/infection-incidents"
              payload: { establishment_id: "${est_id}", case_count: 1, onset_date: "2026-07-27", suspected_practitioner_id: "${prac_id}", narrative: "second client with the same presentation" }
              as: Inspector
              as_user_id: "insp-015"
              captures: { inc2_id: $.data.id }
            - call: "POST /cosmetology/infection-incidents/${inc2_id}/notification"
              payload: { health_authority_reference: "PH-2026-2002" }
              as: HealthAuthorityLiaison
              as_user_id: "ha-001"
            - call: "POST /cosmetology/infection-incidents/${inc2_id}/resolution"
              payload: { resolution: "SUBSTANTIATED", findings_summary: "same implement set, same practitioner" }
              as: HealthAuthorityLiaison
              as_user_id: "ha-001"
          trigger:
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "REINSTATE", reason: "remedial infection-control course completed and audited" }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "HTTP status is 200"
            - "Practitioner.${prac_id}.license_status == ACTIVE"
            - "Practitioner.${prac_id}.sanction_points == 0.00"
            - "Practitioner.${prac_id}.suspension_cause_points is null"
            - "GET /cosmetology/ledger-entries?practitioner_id=${prac_id}&ledger_type=SANCTION_POINTS returns total_count == 3: two INFECTION_SANCTION_ASSESSMENT rows of +10.00 and exactly one REINSTATEMENT_SANCTION_REVERSAL row of -20.00, summing to 0.00"
            - "BoothRental.${rental_id}.status == TERMINATED"
            - "Workstation.${ws_id}.posted_practitioner_id == ${prac_id}"
            - "Workstation.${ws_id}.posting_status == STALE_POSTING"
            - "InfectionIncident.${inc1_id}.status == RESOLVED_SUBSTANTIATED and InfectionIncident.${inc2_id}.status == RESOLVED_SUBSTANTIATED"
            - "Establishment.${est_id}.demerit_balance == 0.00"
