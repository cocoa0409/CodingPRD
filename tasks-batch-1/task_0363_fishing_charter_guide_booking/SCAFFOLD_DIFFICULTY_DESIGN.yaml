# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Fishing Charter & Guide Booking — Expert. 9 rule_ids, >= 2 instances each.
# Every grounds: ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are literals pre-computed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_weather_waiver_vs_lead_time_tier
        grounds:
          - calculations.cancellation_refund_cents
          - state_machines.Booking.transitions.RESERVED_CONFIRMED_to_CANCELLED
          - state_machines.Charter.transitions.SCHEDULED_to_WEATHER_HOLD
          - entities.Booking.fields.weather_waiver
        distinguishing_aspect: |
          On the Booking refund domain, the same paid deposit (5000c) yields a full
          5000c refund under the weather_waiver variant but only 2500c under the
          lead-time-tier variant at 48h lead — the two variants diverge on identical
          deposit input.
        test_recipe:
          setup:
            - "Marina OPEN; one ACTIVE slot; boat IN_SERVICE; charter SCHEDULED with a booking whose deposit_paid_cents=5000."
            - "Charter A is put on WEATHER_HOLD so its booking gains weather_waiver=true; Charter B (twin) stays SCHEDULED with depart_at 48h ahead of the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Pelican Bay", slot_count: 4, turnaround_buffer_minutes: 30 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "A1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_a_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "A2", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_b_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Reel Deal", length_ft: 32, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_a_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Reel Deal II", length_ft: 32, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_b_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap A", uscg_license_grade: "MASTER_100", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_a_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap B", uscg_license_grade: "MASTER_100", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_b_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cust 1", email: "c1@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            # ---- Charter A: will go on weather hold ----
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_a_id}", trip_type: "INSHORE", depart_at: "2026-07-10T12:00:00Z", return_at: "2026-07-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { chA_id: $.data.id, chA_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${chA_id}", role_slot: "CAPTAIN", captain_id: "${cap_a_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_a_id}", charter_id: "${chA_id}", expected_charter_version: "${chA_v}" }
              as: DockMaster
              captures: { chA_v2: $.data.id }
            - call: "GET /charters/${chA_id}"
              as: FleetManager
              captures: { chA_v3: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${chA_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${chA_v3}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bkA_id: $.data.id, bkA_dep: $.data.deposit_due_cents }
            - call: "POST /bookings/${bkA_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /charters/${chA_id}/schedule"
              as: FleetManager
            - call: "POST /charters/${chA_id}/weather-hold"
              as: Captain
              as_user_id: "${cap_a_id}"
            # ---- Charter B: stays SCHEDULED, depart 48h after clock ----
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_b_id}", trip_type: "INSHORE", depart_at: "2026-07-03T00:00:00Z", return_at: "2026-07-03T04:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { chB_id: $.data.id, chB_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${chB_id}", role_slot: "CAPTAIN", captain_id: "${cap_b_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_b_id}", charter_id: "${chB_id}", expected_charter_version: "${chB_v}" }
              as: DockMaster
            - call: "GET /charters/${chB_id}"
              as: FleetManager
              captures: { chB_v3: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${chB_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${chB_v3}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bkB_id: $.data.id }
            - call: "POST /bookings/${bkB_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /charters/${chB_id}/schedule"
              as: FleetManager
          trigger:
            - call: "POST /bookings/${bkA_id}/cancel"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { refundA: $.data.refund_cents }
            - call: "POST /bookings/${bkB_id}/cancel"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { refundB: $.data.refund_cents }
          assert:
            - "Booking.${bkA_id}.refund_cents == 5000"
            - "Booking.${bkB_id}.refund_cents == 2500"
            - "Booking.${bkA_id}.weather_waiver == true"
            - "Booking.${bkB_id}.weather_waiver == false"

      - name: gratuity_percent_vs_flat_mode
        grounds:
          - calculations.gratuity_cents
          - state_machines.Booking.transitions.CONFIRMED_to_SETTLED
          - entities.Booking.fields.gratuity_input_mode
        distinguishing_aspect: |
          On the crew-compensation domain, two CONFIRMED bookings on the SAME settled
          charter with identical seat_subtotal 20000c yield gratuity 3600c (PERCENT 18)
          versus 5000c (FLAT 5000) — variant selection by gratuity_input_mode drives
          the divergence.
        test_recipe:
          setup:
            - "Charter SCHEDULED, clock past depart, sailed then settled; two CONFIRMED bookings, one PERCENT@18, one FLAT@5000, each seat_subtotal 20000c (base 10000, party 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T11:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Tip Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "T1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Tipper", length_ft: 30, passenger_capacity: 8 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap T", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Pct Cust", email: "pct@x.com" }
              as: Customer
              captures: { cust_p_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Flat Cust", email: "flat@x.com" }
              as: Customer
              captures: { cust_f_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2026-07-10T12:00:00Z", return_at: "2026-07-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 8 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { ch_v2: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_p_id}", party_size: 2, gratuity_input_mode: "PERCENT", gratuity_input_value: 18, expected_charter_version: "${ch_v2}" }
              as: Customer
              as_user_id: "${cust_p_id}"
              captures: { bk_p_id: $.data.id }
            - call: "POST /bookings/${bk_p_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_p_id}"
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { ch_v3: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_f_id}", party_size: 2, gratuity_input_mode: "FLAT", gratuity_input_value: 5000, expected_charter_version: "${ch_v3}" }
              as: Customer
              as_user_id: "${cust_f_id}"
              captures: { bk_f_id: $.data.id }
            - call: "POST /bookings/${bk_f_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_f_id}"
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
            - call: "POST /charters/${ch_id}/sail"
              as: Captain
              as_user_id: "${cap_id}"
          trigger:
            - call: "POST /charters/${ch_id}/settle"
              as: FleetManager
          assert:
            - "Booking.${bk_p_id}.gratuity_cents == 3600"
            - "Booking.${bk_f_id}.gratuity_cents == 5000"
            - "Booking.${bk_p_id}.status == SETTLED"
            - "Booking.${bk_f_id}.status == SETTLED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: seat_subtotal_split_surcharge_group_floor_before_multiply
        grounds:
          - calculations.seat_subtotal_cents
          - calculations.deposit_due_cents
          - entities.Charter.fields.split_charter
          - entities.Booking.fields.party_size
        distinguishing_aspect: |
          Mode (a) — three inputs (base_seat_price 10000, split_charter true, party_size 4)
          with conditional branches; the per-seat group discount is floor()ed BEFORE the
          party_size multiply, pinning seat_subtotal to 41400c (floor(11500*0.9)=10350; *4),
          NOT 41400 via any other order.
        test_recipe:
          setup:
            - "Split charter, base_seat_price 10000c, a booking with party_size 4 (>= GROUP_THRESHOLD 4)."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Combo Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Splitter", length_ft: 30, passenger_capacity: 10 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Group Cust", email: "grp@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2026-08-01T12:00:00Z", return_at: "2026-08-01T16:00:00Z", base_seat_price_cents: 10000, seats_total: 10, split_charter: true }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 4, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.seat_subtotal_cents == 41400"
            - "Booking.${bk_id}.deposit_due_cents == 10350"

      - name: gratuity_tip_base_floor_per_addon_line_then_sum
        grounds:
          - calculations.addon_line_total_cents
          - calculations.gratuity_cents
          - entities.AddOnLine.fields.line_total_cents
          - state_machines.Charter.transitions.SAILED_to_SETTLED
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: each add-on line's bulk discount
          is floor()ed PER LINE (ROD_RENTAL x10 -> 21250c, BAIT x3 -> 2400c) and only then
          summed into tip_base 43650c; the 18% tip is 7857c. Floor-then-sum, never
          sum-then-floor (which would mis-credit the discount).
        test_recipe:
          setup:
            - "Charter sailed & about to settle; one CONFIRMED booking (base 10000, party 2 -> seat_subtotal 20000) with two add-on lines: ROD_RENTAL x10 (bulk) and BAIT x3; gratuity PERCENT 18."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T11:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Addon Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "B1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Gearboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap G", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Gear Cust", email: "gear@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2026-08-05T12:00:00Z", return_at: "2026-08-05T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { ch_v2: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, gratuity_input_mode: "PERCENT", gratuity_input_value: 18, expected_charter_version: "${ch_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /add-on-lines"
              payload: { booking_id: "${bk_id}", addon_kind: "ROD_RENTAL", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_rod_id: $.data.id }
            - call: "POST /add-on-lines"
              payload: { booking_id: "${bk_id}", addon_kind: "BAIT", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_bait_id: $.data.id }
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
            - call: "POST /charters/${ch_id}/sail"
              as: Captain
              as_user_id: "${cap_id}"
          trigger:
            - call: "POST /charters/${ch_id}/settle"
              as: FleetManager
          assert:
            - "AddOnLine.${line_rod_id}.line_total_cents == 21250"
            - "AddOnLine.${line_bait_id}.line_total_cents == 2400"
            - "Booking.${bk_id}.gratuity_cents == 7857"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: charter_weather_hold_reschedule_cycle
        grounds:
          - state_machines.Charter.transitions.SCHEDULED_to_WEATHER_HOLD
          - state_machines.Charter.transitions.WEATHER_HOLD_to_SCHEDULED
          - entities.Charter.fields.weather_reschedule_count
        distinguishing_aspect: |
          Charter is a true cycle: SCHEDULED -> WEATHER_HOLD -> SCHEDULED returns the
          entity to SCHEDULED while weather_reschedule_count increments 0 -> 1, proving a
          loop edge (not a forward-only pipeline) on the Charter entity.
        test_recipe:
          setup:
            - "Charter SCHEDULED with a captain, a held slot, and a paid booking; clock before depart."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Cycle Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "C1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Cycler", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap C", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cyc Cust", email: "cyc@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2026-09-10T12:00:00Z", return_at: "2026-09-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { ch_v2: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
            - call: "POST /charters/${ch_id}/weather-hold"
              as: Captain
              as_user_id: "${cap_id}"
          trigger:
            - call: "POST /charters/${ch_id}/reschedule"
              payload: { depart_at: "2026-09-12T12:00:00Z", return_at: "2026-09-12T16:00:00Z" }
              as: FleetManager
              captures: { final_status: $.data.status }
          assert:
            - "Charter.${ch_id}.status == SCHEDULED"
            - "Charter.${ch_id}.weather_reschedule_count == 1"
            - "Charter.${ch_id}.depart_at == 2026-09-12T12:00:00Z"

      - name: crew_assignment_lock_unlock_cycle
        grounds:
          - state_machines.CrewAssignment.transitions.TENTATIVE_to_LOCKED
          - state_machines.CrewAssignment.transitions.LOCKED_to_TENTATIVE
          - entities.CrewAssignment.fields.status
        distinguishing_aspect: |
          On a different entity (CrewAssignment), the LOCKED -> TENTATIVE edge fired by a
          weather-hold returns the assignment from LOCKED back to TENTATIVE, a cycle edge
          distinct from the Charter loop and not a forward-only chain.
        test_recipe:
          setup:
            - "Charter SCHEDULED (crew assignment LOCKED) then put on WEATHER_HOLD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Crew Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "D1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Crewboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap D", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Crew Cust", email: "crew@x.com" }
              as: Customer
