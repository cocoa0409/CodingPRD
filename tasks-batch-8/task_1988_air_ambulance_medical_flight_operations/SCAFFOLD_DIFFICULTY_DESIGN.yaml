            - { call: "POST /air-ambulance/mission-requests/${req3_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req3_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 50, planned_launch_iso: "2026-08-03T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m3_id: "$.data.id" } }
