        claim_type: boundary
        grounds: [calculations.music_budget_check, "errors[ERR_MUSIC_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Spend exactly to budget (35000 + 5000 == 40000) succeeds; one cent more (40001) → ERR_MUSIC_BUDGET_EXCEEDED."
