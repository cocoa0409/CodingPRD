  - rule_id: priority_pair_validation_conflict
    instances:
      - name: evaluate_test_state_error_outranks_target_market_referential_error
        grounds:
          - validations[priority=51]
          - validations[priority=64]
          - entities.CertificationApplication.fields.state
          - entities.TargetMarket.fields.state
          - concurrency_rules[application-create-stale-institution]
        distinguishing_aspect: |
          This pair conflicts a STATE rule (priority 51, 409) against a BUSINESS_REFERENTIAL
          rule (priority 64, 422) on the review surface, and the winner is the lower-numbered
          state rule. The other conflict pair sits on the credit surface and conflicts
          BUSINESS_SAFETY (priority 60, 409) against BUSINESS_FISCAL (priority 80, 422), so it
          proves ordering between two business categories rather than state-before-business.
        test_recipe:
          setup:
            - "One institution with NO target market at all, so no APPROVED target market exists and validation 64 is violated."
            - "One certification application still in DRAFT, so validation 51 is violated as well."
            - "Both violations are live on the same request; the state rule is the lower priority number."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Delta Community Capital Fund", ein: "110000009", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 500000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "GET /cdfi/institutions/${inst_id}"
              payload: {}
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { inst_v: $.data.version }
            - call: "POST /cdfi/institutions/${inst_id}/certification-applications"
              payload: { expected_institution_version: "${inst_v}", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", financing_activity_pct_claimed: 72.50, development_services_description: "Credit counseling, homebuyer education and business technical assistance." }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /cdfi/certification-applications/${app_id}/evaluate-test"
              payload: { test_code: "TARGET_MARKET", verdict: "PASSED" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_APPLICATION_NOT_UNDER_REVIEW"
            - "response data.error_id != ERR_TARGET_MARKET_NOT_APPROVED"
            - "CertificationApplication.${app_id}.state == DRAFT"
            - "CertificationApplication.${app_id}.test_target_market_state == PENDING"
      - name: loan_decision_ta_safety_error_outranks_product_cap_fiscal_error
        grounds:
          - validations[priority=60]
          - validations[priority=80]
          - entities.LoanProduct.fields.requires_ta_completion
          - entities.LoanProduct.fields.product_cap_cents
          - entities.TAEngagement.fields.state
          - state_machines.Loan.UNDERWRITING_to_APPROVED
        distinguishing_aspect: |
          This pair conflicts BUSINESS_SAFETY (priority 60, 409) against BUSINESS_FISCAL
          (priority 80, 422) - two business categories on the same approval request - and the
          safety error wins. The other conflict pair proves a STATE rule outranks a
          BUSINESS_REFERENTIAL rule, a different ordering claim on a different surface.
        test_recipe:
          setup:
            - "One institution with a product whose requires_ta_completion is true and whose product_cap_cents is only 1,000,000."
            - "A GEOCODED borrower with credit_score 740 whose only technical-assistance engagement was closed as NO_SHOW, so no COMPLETED and competency_verified engagement exists."
            - "One loan for 2,000,000 cents already UNDERWRITING at grade A with dti_pct 14.83, so approving 2,000,000 would also breach the 1,000,000 product cap."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Delta Community Capital Fund", ein: "110000010", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 500000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "TA-Gated Microloan", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: ["REPORTS_TO_BUREAUS"], requires_ta_completion: true, product_cap_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
