          - calculations.idle_and_rightsizing_evaluation.constants.MIN_RUN_RATE_CENTS
          - state_machines.CloudResource.ACTIVE_to_FLAGGED_IDLE
          - state_machines.CloudResource.ACTIVE_to_RIGHTSIZE_PENDING
