            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 5, self_reported_acuity: "HIGH", expected_family_version: "${fam_v2}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr2_id: $.data.id }
          assert:
