          - entities.AccountingPeriod.fields.status
          - errors[ERR_PERIOD_NOT_OPEN]
        distinguishing_aspect: |
          JournalEntry's DRAFT->POSTED depends on AccountingPeriod.status == OPEN: a fresh DRAFT entry
          in a period that has moved to CLOSING is rejected with ERR_PERIOD_NOT_OPEN. Entity pair =
          JournalEntry -> AccountingPeriod.
