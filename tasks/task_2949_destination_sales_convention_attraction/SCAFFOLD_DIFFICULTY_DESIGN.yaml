              as: SalesManager
            - call: "GET /hotels/${hotel_a_id}"
              payload: {}
              as: SalesManager
              captures: { harbor_peak_before: $.data.committed_peak_rooms, harbor_nights_before: $.data.committed_room_nights }
            - call: "GET /opportunities/${opp_id}"
