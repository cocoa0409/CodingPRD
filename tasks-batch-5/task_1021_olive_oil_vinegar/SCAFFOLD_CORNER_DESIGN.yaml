            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: ShopStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FUSTI_EXPIRED"

      - name: pay_insufficient_volume_returns_error
        claim_type: Violation to Error
        grounds: ["validations[priority=18]", calculations.fusti_selection, "errors[ERR_INSUFFICIENT_VOLUME]"]
        distinguishing_aspect: "Paying an order whose REFILL line (5000ml) exceeds every eligible fusti's available volume (100ml), with no allergen conflict, returns ERR_INSUFFICIENT_VOLUME."
