            - { call: "POST /dealership/service-bays", payload: { bay_code: "C2", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:01:00Z" }, as: DealershipAdmin }
          trigger:
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin, captures: { noshow: $.data.bookings_no_show } }
            - { call: "GET /dealership/service-bookings/${bk_id}", payload: {}, as: ServiceAdvisor, captures: { bst: $.data.status } }
          assert:
            - "sweep bookings_no_show == 1"
            - "booking status == NO_SHOW"
            - "RO work_status == OPEN (demoted)"
      - name: sweep_promotes_build_cycle_and_closes_pool
        claim_type: automatic_transition
        grounds: [state_machines.FactoryOrder.COMMITTED_to_IN_PRODUCTION, state_machines.FactoryOrder.IN_PRODUCTION_to_SHIPPED, state_machines.FactoryBuildSlot.OPEN_to_CLOSED]
        distinguishing_aspect: "One sweep applies at most one build-cycle promotion per order: at 2026-09-01 the COMMITTED September order moves to IN_PRODUCTION (not straight to SHIPPED); the sweep at 2026-09-15 ships it; the sweep in October closes the pool."
        test_recipe:
          setup: ["pool 2026-09 STANDARD cap 2; committed order created at default clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-09", vocation_group: "STANDARD", capacity: 2 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
          trigger:
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin, captures: { started: $.data.orders_started } }
            - { call: "GET /dealership/factory-orders/${order_id}", payload: {}, as: SalesManager, captures: { st1: $.data.status } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin, captures: { shipped: $.data.orders_shipped } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin, captures: { closed: $.data.slot_pools_closed } }
            - { call: "GET /dealership/factory-build-slots/${slot_id}", payload: {}, as: SalesManager, captures: { pst: $.data.status } }
          assert:
            - "at 2026-09-01 sweep: orders_started == 1 and order status == IN_PRODUCTION"
            - "at 2026-09-15 sweep: orders_shipped == 1 and order status == SHIPPED"
            - "at 2026-10-01 sweep: slot_pools_closed == 1 and pool status == CLOSED"
      - name: claim_submit_and_close_terminal_states
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WarrantyClaim, "errors[ERR_CLAIM_STATE]"]
        distinguishing_aspect: "CLOSED (from DENIED) and PAID (full payment) are terminal: appeal on CLOSED and post-payment on PAID both fail with ERR_CLAIM_STATE / ERR_PAYMENT_AMOUNT_MISMATCH."
        test_recipe:
          setup: ["full RO chain to INVOICED (RETAIL, one eligible labor line 16500); claim 16500/0 submitted"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "TermCl", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042804", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, warranty_eligible: true, description: "l" }, as: ServiceAdvisor }
