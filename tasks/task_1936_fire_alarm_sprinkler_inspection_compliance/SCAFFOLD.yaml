  - method: POST
    path: "/fire-compliance/impairments/{id}/close"
    description: "Close impairment (marshal)"
    roles: [FireMarshal]
    code: 200
    input: []
    output: Impairment
    side_effects: ["increments Impairment.version by 1"]

  # ---- MarshalReport ----
  - method: GET
    path: "/fire-compliance/inspection-events/{id}/marshal-reports"
    description: "List marshal reports of an event (1:1 active + revisions)"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "MarshalReport[]"
    side_effects: []
  - method: GET
    path: "/fire-compliance/marshal-reports/{id}"
    description: "Fetch one report"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: []
    output: MarshalReport
    side_effects: []
  - method: POST
    path: "/fire-compliance/marshal-reports/{id}/submit"
    description: "Submit report to portal"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: MarshalReport
    side_effects: ["is_late computation", "compliance_score_recompute when late", "increments MarshalReport.version by 1"]
  - method: POST
    path: "/fire-compliance/marshal-reports/{id}/accept"
    description: "Marshal accepts report"
    roles: [FireMarshal]
    code: 200
    input: []
    output: MarshalReport
    side_effects: ["portal_submission_id stamped", "increments MarshalReport.version by 1"]
  - method: POST
    path: "/fire-compliance/marshal-reports/{id}/reject"
    description: "Marshal rejects report"
    roles: [FireMarshal]
    code: 200
    input: []
    output: MarshalReport
    side_effects: ["increments MarshalReport.version by 1"]
  - method: POST
    path: "/fire-compliance/inspection-events/{id}/marshal-reports"
    description: "Create a revision report for a REJECTED report on this event"
    roles: [ContractorAdmin]
    code: 201
    input: [revision_of_id]
    output: MarshalReport
    side_effects: ["prior report remains REJECTED; new report DRAFT"]

  # ---- BackflowTest ----
  - method: POST
    path: "/fire-compliance/systems/{id}/backflow-tests"
    description: "Record a backflow test"
    roles: [ContractorAdmin]
    code: 201
    input: [device_id, tester_technician_id, tested_at, result]
    output: BackflowTest
    side_effects: ["license check (7)", "FAILED_OPEN auto-transition when result == FAIL"]
  - method: GET
    path: "/fire-compliance/systems/{id}/backflow-tests"
    description: "List backflow tests of a system"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BackflowTest[]"
    side_effects: []
  - method: GET
    path: "/fire-compliance/backflow-tests/{id}"
    description: "Fetch one backflow test"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: []
    output: BackflowTest
    side_effects: []
  - method: POST
    path: "/fire-compliance/backflow-tests/{id}/invoice"
    description: "Invoice a PASS backflow test"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: BackflowTest
    side_effects: ["unpaid_balance_cents = 40000", "increments BackflowTest.version by 1"]
  - method: POST
    path: "/fire-compliance/backflow-tests/{id}/record-payment"
    description: "Record payment; computes compounded late penalty"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: BackflowTest
    side_effects: ["backflow_late_penalty", "unpaid_balance_cents -> 0", "increments BackflowTest.version by 1"]

  # ---- FirePumpTest ----
  - method: POST
    path: "/fire-compliance/systems/{id}/fire-pump-tests"
    description: "Record a fire pump test (CHURN or ANNUAL_FLOW)"
    roles: [ContractorAdmin]
    code: 201
    input: [test_kind, tester_technician_id, tested_at, result, "coordinated_event_id?"]
    output: FirePumpTest
    side_effects: ["license check (7)", "FAILED_OPEN auto-transition when result == FAIL"]
  - method: GET
    path: "/fire-compliance/systems/{id}/fire-pump-tests"
    description: "List fire pump tests of a system"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "FirePumpTest[]"
    side_effects: []
  - method: GET
    path: "/fire-compliance/fire-pump-tests/{id}"
    description: "Fetch one fire pump test"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: []
    output: FirePumpTest
    side_effects: []
  - method: POST
    path: "/fire-compliance/fire-pump-tests/{id}/attest"
    description: "Attest a PASS pump test"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: FirePumpTest
    side_effects: ["coordination validation for ANNUAL_FLOW", "increments FirePumpTest.version by 1"]

  # ---- FalseAlarmCase ----
  - method: POST
    path: "/fire-compliance/properties/{id}/false-alarm-cases"
    description: "Record a false alarm"
    roles: [FireMarshal]
    code: 201
    input: [alarm_occurred_at, cause_code]
    output: FalseAlarmCase
    side_effects: ["chargeable computation", "sequence_number computation"]
  - method: GET
    path: "/fire-compliance/properties/{id}/false-alarm-cases"
    description: "List false alarm cases of a property"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FalseAlarmCase[]"
    side_effects: []
  - method: GET
    path: "/fire-compliance/false-alarm-cases/{id}"
    description: "Fetch one case"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: []
    output: FalseAlarmCase
    side_effects: []
  - method: POST
    path: "/fire-compliance/false-alarm-cases/{id}/assess"
    description: "Assess fee"
    roles: [FireMarshal]
    code: 200
    input: []
    output: FalseAlarmCase
    side_effects: ["false_alarm_fee", "compliance_score_recompute when NEGLIGENCE", "increments FalseAlarmCase.version by 1"]
  - method: POST
    path: "/fire-compliance/false-alarm-cases/{id}/waive"
    description: "Waive fee"
    roles: [FireMarshal]
    code: 200
    input: []
    output: FalseAlarmCase
    side_effects: ["fee zeroed; waived true", "increments FalseAlarmCase.version by 1"]
  - method: POST
    path: "/fire-compliance/false-alarm-cases/{id}/record-payment"
    description: "Record fee payment"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: FalseAlarmCase
    side_effects: ["increments FalseAlarmCase.version by 1"]

  # ---- ModificationPermit ----
  - method: POST
    path: "/fire-compliance/systems/{id}/modification-permits"
    description: "Apply for a modification permit (OCC-guarded on ProtectedSystem.version)"
    roles: [ContractorAdmin]
    code: 201
    input: [project_valuation_cents, expected_system_version]
    output: ModificationPermit
    side_effects: ["permit_fee_tiers", "increments ProtectedSystem.version by 1"]
  - method: GET
    path: "/fire-compliance/systems/{id}/modification-permits"
    description: "List permits of a system"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ModificationPermit[]"
    side_effects: []
  - method: GET
    path: "/fire-compliance/modification-permits/{id}"
    description: "Fetch one permit"
    roles: [FireMarshal, ContractorAdmin]
    code: 200
    input: []
    output: ModificationPermit
    side_effects: []
  - method: POST
    path: "/fire-compliance/modification-permits/{id}/issue"
    description: "Issue permit"
    roles: [FireMarshal]
    code: 200
    input: []
    output: ModificationPermit
    side_effects: ["increments ModificationPermit.version by 1"]
  - method: POST
    path: "/fire-compliance/modification-permits/{id}/commence-work"
    description: "Attest work commencement; auto-creates UNPLANNED impairment"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: ModificationPermit
    side_effects: ["auto-create UNPLANNED Impairment on system", "impairment_status_derive", "increments ModificationPermit.version by 1"]
  - method: POST
    path: "/fire-compliance/modification-permits/{id}/close"
    description: "Close permit after post-modification inspection"
    roles: [FireMarshal]
    code: 200
    input: []
    output: ModificationPermit
    side_effects: ["device next_due re-seed", "increments ModificationPermit.version by 1"]
  - method: POST
    path: "/fire-compliance/modification-permits/{id}/cite-unpermitted-work"
    description: "Cite unpermitted work; doubles fee"
    roles: [FireMarshal]
    code: 200
    input: [unpermitted_work_detected]
    output: ModificationPermit
    side_effects: ["permit_fee_cents doubled", "compliance_score_recompute (-100)", "increments ModificationPermit.version by 1"]

  # ---- Cross-entity filtered-list GETs (FK reverse-reachability, §1.5) ----
  - method: GET
    path: "/fire-compliance/devices"
    description: "Filtered list of devices (system_id? replaced_by_device_id?)"
    roles: [FireMarshal, ContractorAdmin, Technician]
