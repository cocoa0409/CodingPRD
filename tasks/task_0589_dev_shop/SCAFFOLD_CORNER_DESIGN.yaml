            - "Milestone.${m1_id}.status == BILLED"

  # =========================================================================
  - section: errors
    instances:
      - name: error_sprint_overlap_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_SPRINT_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / sprint_half_open_interval_adjacency_allowed_overlap_rejected
          rationale: "Asserted as the second trigger call of the named §1.8 instance."

      - name: error_retainer_window_conflict_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETAINER_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / retainer_closed_interval_with_cooldown_buffer_conflict_rejected
          rationale: "Asserted as the first trigger call of the named §1.8 instance."

      - name: error_budget_hours_exceeded_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUDGET_HOURS_EXCEEDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sprint_not_active_state_error_beats_budget_hours_fiscal_error
          rationale: "The fiscal rule is the losing check of that §1.8 priority conflict; a standalone trigger differs only by leaving the sprint ACTIVE, which the unit-test-generator derives from the same recipe."

      - name: error_not_ticket_assignee_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_TICKET_ASSIGNEE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / not_ticket_assignee_referential_error_beats_work_date_temporal_error
          rationale: "Asserted as the winning error of the named §1.8 instance."

      - name: error_milestone_not_completed_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_MILESTONE_NOT_COMPLETED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / milestone_invoice_issue_requires_completed_milestone_cross_entity_invoice_milestone
          rationale: "Asserted as the trigger outcome of the named §1.8 instance."

      - name: error_sprint_not_active_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_SPRINT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ticket_start_requires_active_sprint_cross_entity_ticket_sprint
          rationale: "Asserted as the first trigger call of the named §1.8 instance."

