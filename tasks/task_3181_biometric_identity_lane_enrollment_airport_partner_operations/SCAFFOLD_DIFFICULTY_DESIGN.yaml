  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: agreement_terminate_cascades_lanes_then_capacity_zero
        grounds:
          - state_machines.PartnerAgreement.ACTIVE_to_TERMINATED
          - state_machines.Lane
          - calculations.lane_capacity_check
        distinguishing_aspect: |
          Depth-3 cascade: terminate agreement → every non-CLOSED lane closes
          (link 2) → each lane closure triggers lane_capacity recompute ending
          at 0 (link 3). Verified by observing lane_capacity drop from 10 to 0
          and both lanes in CLOSED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Airport ORD, ACTIVE agreement (staffing 4 seats → limit 16), two OPEN lanes with capacity_hours 6 and 4 (lane_capacity 10)."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "ORD", name: "Chicago O'Hare", city: "Chicago", state_code: "IL" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /lanes"
              payload: { airport_id: "${ap_id}", agreement_id: "${agr_id}", terminal: "T1", position_index: 1, open_time: "05:00", close_time: "22:00", capacity_hours: 6 }
              as: OpsAdmin
              captures: { lane1: $.data.id }
            - call: "POST /lanes/${lane1}/open"
              payload: {}
              as: OpsAdmin
            - call: "POST /lanes"
              payload: { airport_id: "${ap_id}", agreement_id: "${agr_id}", terminal: "T3", position_index: 2, open_time: "05:00", close_time: "22:00", capacity_hours: 4 }
              as: OpsAdmin
              captures: { lane2: $.data.id }
            - call: "POST /lanes/${lane2}/open"
              payload: {}
              as: OpsAdmin
            - call: "GET /partner-agreements/${agr_id}"
              payload: {}
              as: PartnerManager
              captures: { cap_before: $.data.lane_capacity }
          trigger:
            - call: "POST /partner-agreements/${agr_id}/terminate"
              payload: {}
              as: PartnerManager
            - call: "GET /partner-agreements/${agr_id}"
              payload: {}
              as: PartnerManager
              captures: { cap_after: $.data.lane_capacity }
            - call: "GET /lanes/${lane1}"
              payload: {}
              as: OpsAdmin
              captures: { l1_status: $.data.status }
            - call: "GET /lanes/${lane2}"
              payload: {}
              as: OpsAdmin
              captures: { l2_status: $.data.status }
          assert:
            - "Precondition: ${cap_before} == 10"
            - "After terminate: ${cap_after} == 0 (each lane closure recomputed capacity)"
            - "${l1_status} == CLOSED and ${l2_status} == CLOSED"
            - "A subsequent POST /lanes/${lane1}/open is rejected with ERR_AGREEMENT_NOT_ACTIVE (409) — agreement TERMINATED blocks reopen"

      - name: dispute_confirmed_cascades_member_termination_then_retention_log
        grounds:
          - state_machines.IdentityDispute.INVESTIGATING_to_RESOLVED_CONFIRMED
          - state_machines.Member.SUSPENDED_to_TERMINATED
          - state_machines.Subscription
          - entities.BiometricRetentionLog
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger: resolve dispute CONFIRMED
          → member SUSPENDED → TERMINATED (link 2) → subscription CANCELLED
          and family dissolved (link 3) → deletion_due_at set with
          BiometricRetentionLog(DELETION_SCHEDULED) appended (link 4).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Member M ACTIVE (enrollment-center enrollment) with INDIVIDUAL subscription."
            - "Officer 'co-open' opens a dispute (member auto-suspended), officer 'co-resolve' investigates and resolves CONFIRMED."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "ATL", name: "Hartsfield Jackson", city: "Atlanta", state_code: "GA" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "ATL Center", ambassador_capacity: 4 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "victim@x.com", full_name: "Vic Tim", date_of_birth: "1985-07-07" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "P9999999", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/complete"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions"
              payload: { member_id: "${m_id}", plan: "INDIVIDUAL", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /identity-disputes"
              payload: { member_id: "${m_id}", enrollment_id: "${enr_id}", reason: "IDENTITY_TAKEOVER" }
              as: ComplianceOfficer
              as_user_id: "co-open"
              captures: { disp_id: $.data.id }
            - call: "POST /identity-disputes/${disp_id}/investigate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-resolve"
          trigger:
            - call: "POST /identity-disputes/${disp_id}/resolve"
              payload: { outcome: "RESOLVED_CONFIRMED", resolution_note: "Document fraud confirmed via issuer check" }
              as: ComplianceOfficer
              as_user_id: "co-resolve"
            - call: "GET /members/${m_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { m_status: $.data.status, m_due: $.data.deletion_due_at }
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: OpsAdmin
              captures: { sub_status: $.data.status }
            - call: "GET /biometric-retention-logs"
              payload: { member_id: "${m_id}" }
              as: ComplianceOfficer
              captures: { log_action: "$.data[0].action" }
          assert:
            - "${m_status} == TERMINATED"
            - "${sub_status} == CANCELLED (cascade hop 3)"
            - "${m_due} == 2026-10-01T00:00:00Z (trigger + 30 days)"
            - "${log_action} == DELETION_SCHEDULED (cascade hop 4)"
            - "IdentityDispute.${disp_id}.resolved_by == \"co-resolve\""

