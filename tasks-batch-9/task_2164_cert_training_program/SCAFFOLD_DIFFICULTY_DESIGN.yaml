  - rule_id: cross_entity_state_dependency
    instances:
      - name: completion_requires_its_class_session_to_be_delivered
        grounds:
          - validations[priority=24]
          - state_machines.ClassSession.SCHEDULED_to_DELIVERED
          - errors[ERR_SESSION_NOT_DELIVERED]
        distinguishing_aspect: |
          Cross-entity pair #1 is ModuleCompletion -> ClassSession: whether a completion may be created
          at all is decided by the SESSION's status, not by anything on the trainee. The identical request
          is rejected while the session is SCHEDULED and accepted once it is DELIVERED.
        test_recipe:
          setup:
            - "Cohort C-2026A IN_SESSION with Tara ENROLLED"
            - "Session A for CERT-101 exists but is still SCHEDULED"
            - "Logical clock at 2026-08-03T12:00:00Z, already past the session start"
