scaffold_corner_design:

  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_hospitalist_applies_defaults
        claim_type: defaults
        grounds: ["entities.Hospitalist.fields.max_census_cap", "entities.Hospitalist.fields.employment_status"]
        distinguishing_aspect: "Omitting optional fields applies defaults: max_census_cap 16, night_eligible true, employment_status ACTIVE, current_census 0, distribution_eligible true, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H Def", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
          trigger:
            - { call: "GET /hospitalists/${h1}", as: GroupAdmin }
          assert:
            - "Hospitalist.${h1}.max_census_cap == 16 and night_eligible == true"
            - "Hospitalist.${h1}.employment_status == ACTIVE"
            - "Hospitalist.${h1}.current_census == 0 and pending_offers == 0 and distribution_eligible == true"
            - "Hospitalist.${h1}.version == 1"

      - name: create_patient_observation_initializes_obs_fields
        claim_type: computed_fields
        grounds: ["entities.Patient.fields.observation_status", "entities.Patient.fields.observation_started_at"]
        distinguishing_aspect: "stay_type OBSERVATION initializes observation_status OBS_ACTIVE with observation_started_at == admitted_at; INPATIENT initializes NONE with null start."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "C001", acuity: "LOW", admit_source: "ED", stay_type: "OBSERVATION", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { pobs: $.data.id, os1: $.data.observation_status } }
            - { call: "POST /patients", payload: { mrn: "C002", acuity: "LOW", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { pin: $.data.id, os2: $.data.observation_status } }
          trigger:
            - { call: "GET /patients/${pobs}", as: GroupAdmin }
          assert:
            - "Patient.${pobs}.observation_status == OBS_ACTIVE and observation_started_at == 2026-05-01T08:00:00Z"
            - "Patient.${pin}.observation_status == NONE and observation_started_at == null"
            - "both patients admission_status == ADMITTED (parallel axis independent of obs axis)"

      - name: create_patient_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Patient.fields.los_alert_flag"]
        distinguishing_aspect: "Client-supplied id/version/los_alert_flag in the create payload are ignored; server-minted values win."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "C003", acuity: "MEDIUM", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z", id: "00000000-0000-0000-0000-000000000000", version: 99, los_alert_flag: true }, as: GroupAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "GET /patients/${p1}", as: GroupAdmin }
          assert:
            - "Patient.${p1}.id != 00000000-0000-0000-0000-000000000000 (server-minted)"
            - "Patient.${p1}.version == 1 and los_alert_flag == false (input ignored)"

      - name: get_patient_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields the error envelope with ERR_NOT_FOUND and HTTP 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /patients/11111111-2222-4333-8444-555555555555", as: GroupAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404, response_type == error"

      - name: create_patient_missing_required_mrn_returns_invalid_request
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=3]"]
        distinguishing_aspect: "Omitting required mrn yields ERR_INVALID_REQUEST (400) before any existence or state check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /patients", payload: { acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT" }, as: GroupAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: create_patient_invalid_enum_acuity_rejected
        claim_type: type_constraints
        grounds: ["entities.Patient.fields.acuity", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "acuity 'CRITICAL' is outside {HIGH, MEDIUM, LOW} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /patients", payload: { mrn: "C004", acuity: "CRITICAL", admit_source: "ED", stay_type: "INPATIENT" }, as: GroupAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: list_hospitalists_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "limit/offset paginate with total_count and has_more; default limit is 10 when params omitted."
        test_recipe:
          setup: ["three hospitalists H1..H3"]
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "ICU" }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Three", specialty: "ICU" }, as: GroupAdmin, captures: { h3: $.data.id } }
          trigger:
            - { call: "GET /hospitalists", payload: { limit: 2, offset: 0 }, as: GroupAdmin }
            - { call: "GET /hospitalists", payload: { limit: 2, offset: 2 }, as: GroupAdmin }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"
            - "omitted params -> default limit 10, offset 0"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: admission_accept_from_queued_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Admission.OFFERED_to_ACCEPTED", "errors[ERR_ADMISSION_INVALID_STATE]"]
        distinguishing_aspect: "Accept on a QUEUED admission (empty selector pool) fails with ERR_ADMISSION_INVALID_STATE regardless of caller."
        test_recipe:
          setup:
            - "H1 exists but has no shift -> selector pool empty; P1 admission stays QUEUED"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "S001", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, st: $.data.status } }
          trigger:
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "Admission.${a1}.status == QUEUED after create (empty pool fallback, no offer)"
            - "error_id == ERR_ADMISSION_INVALID_STATE (state priority fires before offer-ownership)"

      - name: discharge_execute_from_planned_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DischargeOrder.ORDERED_to_EXECUTED", "errors[ERR_DISCHARGE_ORDER_INVALID_STATE]"]
        distinguishing_aspect: "Execute on a PLANNED order (no STAT consult present) fails with ERR_DISCHARGE_ORDER_INVALID_STATE alone."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1; discharge order PLANNED only; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "S002", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients/${p1}/discharge-orders", payload: { target_discharge_at: "2026-05-02T15:00:00Z" }, as: Hospitalist, as_user_id: "${h1}", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /discharge-orders/${d1}/execute", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DISCHARGE_ORDER_INVALID_STATE; order remains PLANNED; patient remains ADMITTED"

      - name: consult_complete_from_open_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ConsultRequest.ACKNOWLEDGED_to_COMPLETED", "errors[ERR_CONSULT_INVALID_STATE]"]
        distinguishing_aspect: "Complete requires ACKNOWLEDGED; from OPEN it fails with ERR_CONSULT_INVALID_STATE."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1; consult C1 OPEN (ROUTINE); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "S003", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "NEPHROLOGY", priority: "ROUTINE", reason: "AKI eval" }, as: Hospitalist, as_user_id: "${h1}", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /consult-requests/${c1}/complete", payload: {}, as: ConsultingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONSULT_INVALID_STATE; consult remains OPEN"

      - name: consult_reopen_after_window_expires_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ConsultRequest.COMPLETED_to_REOPENED", "errors[ERR_CONSULT_REOPEN_WINDOW_EXPIRED]", "calculations.consult_sla"]
        distinguishing_aspect: "Reopen at completed_at + 24h exactly is allowed (<=); one millisecond later is rejected."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1; consult C1 acknowledged 10:05 and completed 2026-05-01T10:10:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "S004", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T09:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "CARDIOLOGY", priority: "ROUTINE", reason: "murmur" }, as: Hospitalist, as_user_id: "${h1}", captures: { c1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:05:00Z" }, as: GroupAdmin }
            - { call: "POST /consult-requests/${c1}/acknowledge", payload: {}, as: ConsultingSpecialist }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:10:00Z" }, as: GroupAdmin }
            - { call: "POST /consult-requests/${c1}/complete", payload: {}, as: ConsultingSpecialist }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:10:00.001Z" }, as: GroupAdmin }
            - { call: "POST /consult-requests/${c1}/reopen", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONSULT_REOPEN_WINDOW_EXPIRED (now > completed_at + 24h by 1ms)"
            - "ConsultRequest.${c1}.status remains COMPLETED"

      - name: handoff_accept_by_submitter_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Handoff.SUBMITTED_to_ACCEPTED", "errors[ERR_HANDOFF_SELF_ACCEPT]"]
        distinguishing_aspect: "When the receiving hospitalist IS the submitting hospitalist (receiver == shift owner), accept passes ownership but fails the self-accept safety rule."
        test_recipe:
          setup:
            - "H1 ACTIVE shift S1 holds P1; handoff HF submitted with receiving_hospitalist_id == H1 (self as receiver); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "S005", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /shifts/${s1}/handoffs", payload: { receiving_hospitalist_id: "${h1}", patient_ids: ["${p1}"] }, as: Hospitalist, as_user_id: "${h1}", captures: { hf: $.data.id } }
            - { call: "POST /handoffs/${hf}/submit", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
          trigger:
            - { call: "POST /handoffs/${hf}/accept", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HANDOFF_SELF_ACCEPT; handoff remains SUBMITTED"

      - name: report_finalize_from_finalized_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ProductivityReport.PROVISIONAL_to_FINALIZED", "errors[ERR_REPORT_INVALID_STATE]"]
        distinguishing_aspect: "Finalize on an already FINALIZED report fails with ERR_REPORT_INVALID_STATE (finalize allowed only from PROVISIONAL|REOPENED)."
        test_recipe:
          setup:
            - "H1; report R1 for an empty period FINALIZED"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /productivity-reports/generate", payload: { hospitalist_id: "${h1}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: GroupAdmin, captures: { r1: $.data.id } }
            - { call: "POST /productivity-reports/${r1}/finalize", payload: {}, as: GroupAdmin }
          trigger:
            - { call: "POST /productivity-reports/${r1}/finalize", payload: {}, as: GroupAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_INVALID_STATE; report remains FINALIZED"

      - name: encounter_void_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Encounter.RECORDED_to_VOIDED", "errors[ERR_ENCOUNTER_ALREADY_VOIDED]"]
        distinguishing_aspect: "Second void on a VOIDED encounter fails with ERR_ENCOUNTER_ALREADY_VOIDED; no report side effects fire twice."
        test_recipe:
          setup:
            - "H1; P1; encounter E1 RECORDED"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "S006", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "SUBSEQUENT_VISIT", occurred_on: "2026-05-01", wrvu_value: 1.2 }, as: Hospitalist, as_user_id: "${h1}", captures: { e1: $.data.id } }
            - { call: "POST /encounters/${e1}/void", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
          trigger:
            - { call: "POST /encounters/${e1}/void", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENCOUNTER_ALREADY_VOIDED; encounter remains VOIDED"

      - name: shift_close_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Shift.ACTIVE_to_CLOSED", "errors[ERR_SHIFT_INVALID_STATE]"]
        distinguishing_aspect: "Close on a SCHEDULED (never activated) shift fails with ERR_SHIFT_INVALID_STATE before the handoff gate is consulted."
        test_recipe:
          setup:
            - "H1 with shift S1 SCHEDULED"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /shifts/${s1}/close", payload: {}, as: GroupAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHIFT_INVALID_STATE; shift remains SCHEDULED"

      - name: patient_discharged_rejects_new_consult
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Patient.ADMITTED_to_DISCHARGED", "errors[ERR_PATIENT_NOT_ADMITTED]"]
        distinguishing_aspect: "After the admission axis reaches DISCHARGED, consult creation is rejected with ERR_PATIENT_NOT_ADMITTED."
        test_recipe:
          setup:
            - "H1 ACTIVE shift held P1; P1 discharged via executed order; clock 2026-05-01T09:30:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "S007", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients/${p1}/discharge-orders", payload: { target_discharge_at: "2026-05-02T15:00:00Z" }, as: Hospitalist, as_user_id: "${h1}", captures: { d1: $.data.id } }
            - { call: "POST /discharge-orders/${d1}/order", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "POST /discharge-orders/${d1}/execute", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
          trigger:
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "SURGERY", priority: "ROUTINE", reason: "post-discharge question" }, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PATIENT_NOT_ADMITTED"

      - name: handoff_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.Handoff"]
        distinguishing_aspect: "New handoff starts DRAFT with completeness computed at creation: required 1, covered 1, open 0, score 1.0, version 1."
        test_recipe:
          setup:
            - "H1 ACTIVE shift S1 holds P1; H2 receiver; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "S008", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
          trigger:
            - { call: "POST /shifts/${s1}/handoffs", payload: { receiving_hospitalist_id: "${h2}", patient_ids: ["${p1}"] }, as: Hospitalist, as_user_id: "${h1}", captures: { hf: $.data.id, st: $.data.status } }
          assert:
            - "Handoff.${hf}.status == DRAFT and version == 1"
            - "required_patient_count == 1, covered_patient_count == 1, open_item_count == 0, completeness_score == 1.0"

      - name: assignment_accept_side_effects
        claim_type: side_effect_execution
        grounds: ["state_machines.Admission.OFFERED_to_ACCEPTED", "entities.Hospitalist.fields.current_census"]
        distinguishing_aspect: "Admission accept executes every declared side effect: assignment created ACTIVE, census +1, pending_offers returns to 0, admission ACCEPTED with assignment_id."
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00; P1 admission OFFERED to H1; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "S009", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
          trigger:
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id, ast: $.data.status } }
            - { call: "GET /hospitalists/${h1}", as: GroupAdmin, captures: { cen: $.data.current_census, pen: $.data.pending_offers } }
            - { call: "GET /assignments/${asg}", as: GroupAdmin, captures: { gst: $.data.status, gcf: $.data.continuity_flag } }
          assert:
            - "Admission.${a1}.status == ACCEPTED and assignment_id == ${asg}"
            - "Assignment.${asg}.status == ACTIVE, continuity_flag == false, assigned_at set"
            - "Hospitalist.${h1}.current_census == 1 and pending_offers == 0"

      - name: consult_escalation_on_monitor_run
        claim_type: valid_transition
        grounds: ["state_machines.ConsultRequest.OPEN_to_ESCALATED", "calculations.consult_sla"]
        distinguishing_aspect: "Monitor-run auto-transition: an OPEN STAT consult past its deadline becomes ESCALATED with escalation_count 1 and appears in escalated_consult_ids."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1; STAT consult created at clock 10:00 (deadline 10:15); clock advanced to 10:16"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "S010", acuity: "HIGH", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T09:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "CARDIOLOGY", priority: "STAT", reason: "troponin rising" }, as: Hospitalist, as_user_id: "${h1}", captures: { c1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:16:00Z" }, as: GroupAdmin }
          trigger:
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin, captures: { esc: $.data.escalated_consult_ids } }
            - { call: "GET /consult-requests/${c1}", as: GroupAdmin, captures: { cst: $.data.status, ec: $.data.escalation_count } }
          assert:
            - "ConsultRequest.${c1}.status == ESCALATED and escalation_count == 1"
            - "monitor-run response escalated_consult_ids contains ${c1}"

      - name: stub_shift_close_handoff_gate
        claim_type: guarded_transition
        grounds: ["state_machines.Shift.ACTIVE_to_CLOSED", "errors[ERR_SHIFT_HANDOFF_MISSING]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / shift_close_requires_accepted_handoff"
          rationale: "DRAFT/SUBMITTED rejection and ACCEPTED success are both asserted in the named difficulty instance."

      - name: stub_coverage_window_full_open_cycle
        claim_type: valid_transition
        grounds: ["state_machines.CoverageWindow.OPEN_to_FULL", "state_machines.CoverageWindow.FULL_to_OPEN"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / coverage_window_capacity_pool"
          rationale: "The FULL auto-transition at capacity and the FULL -> OPEN reopen on withdraw are asserted step-by-step in the named difficulty instance."

  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: throughput_cutoff_exact_boundary
        claim_type: boundary_edge
        grounds: ["calculations.discharge_throughput_target"]
        distinguishing_aspect: "executed_at exactly equal to the 11:00:00Z cutoff meets the target (<=); one second later misses it."
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00 holds P1 and P2; both discharge orders ORDERED with target_discharge_at 2026-05-02T15:00:00Z (cutoff 2026-05-02T11:00:00Z)"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-03T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "K001", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients", payload: { mrn: "K002", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:05:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}" }
            - { call: "POST /patients/${p1}/discharge-orders", payload: { target_discharge_at: "2026-05-02T15:00:00Z" }, as: Hospitalist, as_user_id: "${h1}", captures: { d1: $.data.id } }
            - { call: "POST /discharge-orders/${d1}/order", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "POST /patients/${p2}/discharge-orders", payload: { target_discharge_at: "2026-05-02T15:00:00Z" }, as: Hospitalist, as_user_id: "${h1}", captures: { d2: $.data.id } }
            - { call: "POST /discharge-orders/${d2}/order", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T11:00:00Z" }, as: GroupAdmin }
            - { call: "POST /discharge-orders/${d1}/execute", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { m1: $.data.meets_throughput_target } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T11:00:01Z" }, as: GroupAdmin }
            - { call: "POST /discharge-orders/${d2}/execute", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { m2: $.data.meets_throughput_target } }
          assert:
            - "DischargeOrder.${d1}.meets_throughput_target == true (executed exactly at cutoff)"
            - "DischargeOrder.${d2}.meets_throughput_target == false (one second past cutoff)"

      - name: los_alert_threshold_strict_greater
        claim_type: boundary_edge
        grounds: ["calculations.los_monitoring", "entities.Patient.fields.los_alert_flag"]
        distinguishing_aspect: "MEDIUM INPATIENT threshold is 4 * 1.5 = 6 midnights; 6 midnights does NOT alert (strictly greater), 7 does."
        test_recipe:
          setup:
            - "P1 MEDIUM INPATIENT admitted 2026-05-01T12:00:00Z"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "K003", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T12:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-07T12:00:00Z" }, as: GroupAdmin }
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin }
            - { call: "GET /patients/${p1}", as: GroupAdmin, captures: { mid6: $.data.los_midnights, flag6: $.data.los_alert_flag } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T12:00:00Z" }, as: GroupAdmin }
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin }
            - { call: "GET /patients/${p1}", as: GroupAdmin, captures: { mid7: $.data.los_midnights, flag7: $.data.los_alert_flag } }
          assert:
            - "at 6 midnights: los_midnights == 6 and los_alert_flag == false (6 > 6 is false)"
            - "at 7 midnights: los_midnights == 7 and los_alert_flag == true (7 > 6)"

      - name: obs_conversion_at_exactly_48h
        claim_type: boundary_edge
        grounds: ["calculations.observation_status_monitor"]
        distinguishing_aspect: "Observation elapsed 47:59:59 does not convert; exactly 48:00:00 converts (>= threshold, equality converts)."
        test_recipe:
          setup:
            - "P1 OBSERVATION admitted 2026-05-01T08:00:00Z (observation_started_at pinned)"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "K004", acuity: "LOW", admit_source: "ED", stay_type: "OBSERVATION", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T07:59:59Z" }, as: GroupAdmin }
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin, captures: { conv1: $.data.obs_converted_patient_ids } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T08:00:00Z" }, as: GroupAdmin }
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin, captures: { conv2: $.data.obs_converted_patient_ids } }
            - { call: "GET /patients/${p1}", as: GroupAdmin, captures: { os: $.data.observation_status, sty: $.data.stay_type } }
          assert:
            - "at 47:59:59 elapsed: obs_converted_patient_ids empty; Patient stays OBS_ACTIVE"
            - "at exactly 48:00:00 elapsed: obs_converted_patient_ids contains ${p1}"
            - "Patient.${p1}.observation_status == OBS_CONVERTED and stay_type == INPATIENT"

      - name: leveling_forward_vs_chronological_diverge
        claim_type: variant_divergence
        grounds: ["calculations.census_leveling_projection"]
        distinguishing_aspect: "One pending OFFER makes forward and chronological deviations diverge for H2 (0.0 vs -1.0) while the group average stays anchored to current census."
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00 census 2 (P1, P2); H2 ACTIVE shift 07:00-19:00 census 0; P3 admission OFFERED to H2 pending; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h2}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s2}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "K005", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients", payload: { mrn: "K006", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:05:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}" }
            - { call: "POST /patients", payload: { mrn: "K007", acuity: "HIGH", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:10:00Z" }, as: GroupAdmin, captures: { p3: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p3}" }, as: GroupAdmin, captures: { a3: $.data.id, off3: $.data.offered_to_hospitalist_id } }
          trigger:
            - { call: "GET /reports/census-leveling", as: GroupAdmin, captures: { avg: $.data.group_avg_census } }
          assert:
            - "group_avg_census == 1.0"
            - "rows[H2]: current_census == 0, projected_census == 1, deviation_forward == 0.0, deviation_chronological == -1.0 (variants diverge on identical inputs)"
            - "rows[H1]: deviation_forward == 1.0 and deviation_chronological == 1.0"

      - name: encounter_estimated_wrvu_constants
        claim_type: constants_applied
        grounds: ["calculations.productivity_wrvu_total", "entities.Encounter.fields.estimated_wrvu"]
        distinguishing_aspect: "Per-line estimate uses ESTIMATED_WRVU x ADJUST_FACTOR rounded to 2dp: 2.65 / 1.27 / 1.91 / 1.59 for the four encounter types."
        test_recipe:
          setup:
            - "H1; P1; one encounter of each type on 2026-05-04"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: GroupAdmin }
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "K008", acuity: "MEDIUM", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-04T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "ADMISSION_HCP", occurred_on: "2026-05-04", wrvu_value: 2.5 }, as: Hospitalist, as_user_id: "${h1}", captures: { e1: $.data.estimated_wrvu } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "SUBSEQUENT_VISIT", occurred_on: "2026-05-04", wrvu_value: 1.2 }, as: Hospitalist, as_user_id: "${h1}", captures: { e2: $.data.estimated_wrvu } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "DISCHARGE_DAY", occurred_on: "2026-05-04", wrvu_value: 1.8 }, as: Hospitalist, as_user_id: "${h1}", captures: { e3: $.data.estimated_wrvu } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "CONSULT_NOTE", occurred_on: "2026-05-04", wrvu_value: 1.5 }, as: Hospitalist, as_user_id: "${h1}", captures: { e4: $.data.estimated_wrvu } }
          assert:
            - "estimated_wrvu values == 2.65, 1.27, 1.91, 1.59 in creation order"

      - name: distribution_tie_break_shift_created_at
        claim_type: correct_result
        grounds: ["calculations.admission_distribution_score"]
        distinguishing_aspect: "Equal score, equal census, equal shift start_at -> the tie falls to the covering shift's created_at ASC (earliest-created shift wins); never id."
        test_recipe:
          setup:
            - "H_A and H_C both cap 16 census 0; both DAY shifts start 07:00 (H_A's shift created one logical second earlier); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H A", specialty: "ICU" }, as: GroupAdmin, captures: { h_a: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H C", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h_c: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T06:00:00Z" }, as: GroupAdmin }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_a}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s_a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T06:00:01Z" }, as: GroupAdmin }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_c}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s_c: $.data.id } }
            - { call: "POST /shifts/${s_a}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s_c}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "K009", acuity: "LOW", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off: $.data.offered_to_hospitalist_id, sc: $.data.distribution_score } }
          assert:
            - "Admission.${a1}.offered_to_hospitalist_id == ${h_a} (shift created_at tie-break, not id)"
            - "Admission.${a1}.distribution_score == 1.0"

      - name: distribution_empty_pool_stays_queued
        claim_type: correct_result
        grounds: ["calculations.admission_distribution_score"]
        distinguishing_aspect: "Selector fallback: empty candidate pool leaves the admission QUEUED with null offer and null score — no error is raised."
        test_recipe:
          setup:
            - "P1 exists; no hospitalist has an ACTIVE shift"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "K010", acuity: "LOW", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, st: $.data.status } }
          assert:
            - "Admission.${a1}.status == QUEUED, offered_to_hospitalist_id == null, distribution_score == null"
            - "HTTP 201 (empty pool is a documented fallback, not an error)"

      - name: distribution_excludes_decliner
        claim_type: correct_result
        grounds: ["calculations.admission_distribution_score", "state_machines.Admission.OFFERED_to_QUEUED"]
        distinguishing_aspect: "After H_A declines, the re-run excludes H_A despite H_A's superior tie-break, and the admission is offered to H_B in the same request chain."
        test_recipe:
          setup:
            - "H_A ACTIVE shift 06:00-18:00; H_B ACTIVE shift 07:00-19:00; both cap 16 census 0; P1 admission offered to H_A (earlier shift start); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H A", specialty: "ICU" }, as: GroupAdmin, captures: { h_a: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H B", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h_b: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_a}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s_a: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_b}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s_b: $.data.id } }
            - { call: "POST /shifts/${s_a}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s_b}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "K011", acuity: "LOW", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off0: $.data.offered_to_hospitalist_id } }
          trigger:
            - { call: "POST /admissions/${a1}/decline", payload: {}, as: Hospitalist, as_user_id: "${h_a}", captures: { st: $.data.status, off1: $.data.offered_to_hospitalist_id } }
