            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "Our supplier feed mapped the wrong attribute set onto the listing.", corrective_measures: ["Corrected the mapping"], preventive_measures: ["Nightly diff against the catalogue"], expected_enforcement_action_version: "${a1_ver}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_poa: $.data.error_id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The cited attribute was accurate at the time of the report." }
              as: AppealReviewer
