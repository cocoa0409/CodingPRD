        distinguishing_aspect: "Uniqueness is on the triple (naic_code, assessable_line, base_year): a second registration of 20001 / PERSONAL_AUTO / 2025 returns ERR_MEMBER_DUPLICATE_LINE (409) while the same NAIC for base_year 2026 is accepted."
