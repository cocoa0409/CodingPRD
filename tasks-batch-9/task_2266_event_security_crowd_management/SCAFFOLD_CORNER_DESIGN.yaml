      - the guard reusing the SUBCONTRACTOR's SC-3001 returns 409 with data.error_id == "ERR_DUPLICATE_LICENSE_NUMBER"
      - the subcontractor reusing SC-3001 returns 409 with data.error_id == "ERR_DUPLICATE_LICENSE_NUMBER"
      - the subcontractor reusing the GUARD's GC-4001 returns 409 with data.error_id == "ERR_DUPLICATE_LICENSE_NUMBER"
