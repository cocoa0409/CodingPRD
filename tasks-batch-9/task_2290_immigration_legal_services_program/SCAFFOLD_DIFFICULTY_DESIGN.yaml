  # =====================================================================
  # RULE 3 - non_linear_state_machine
  # Two DIFFERENT entities: CaseMatter (parallel_dimensions + a repeatable
  # representation cycle) and Accreditation (cyclic renewal re-entry).
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: matter_representation_cycle_twice_while_filing_dimension_stays_frozen
        grounds:
          - state_machines.CaseMatter.STAFFED_to_COVERAGE_GAP
          - state_machines.CaseMatter.COVERAGE_GAP_to_STAFFED
          - state_machines.CaseAssignment.ACTIVE_to_SUSPENDED
          - state_machines.CaseAssignment.SUSPENDED_to_ACTIVE
          - state_machines.Declaration.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.Declaration.REVISION_REQUESTED_to_DRAFT
          - entities.CalendarEvent.fields.coverage_gap_flag
        distinguishing_aspect: |
          The representation dimension is driven twice around the full
          STAFFED -> COVERAGE_GAP -> STAFFED cycle by suspending and re-activating the SAME
          LEAD assignment, and each entry into COVERAGE_GAP fires the collateral hops again
          (Declaration.revision_round 0 -> 1 -> 2, near-term CalendarEvent re-flagged) while
          re-activation only compensates the flags and never the declaration - meanwhile
          filing_status must remain EVIDENCE_GATHERING across all six representation
          mutations, so an implementation with a single linear status column, or one that
          restores the declaration on re-activation, or one that lets the cycle touch
          filing_status, fails.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z (COVERAGE_GAP_LOOKAHEAD_DAYS is 14, so 2026-09-10 is inside the window and 2026-10-15 is outside it)."
            - "Non-detained ADJUSTMENT_OF_STATUS matter (forum USCIS) STAFFED by a STAFF_ATTORNEY LEAD with supervision_required false."
            - "One REQUIRED EvidenceItem exists so the matter can be parked in filing_status EVIDENCE_GATHERING."
            - "One Declaration prepared by the LEAD is IN_REVIEW with revision_round 0."
            - "Two SCHEDULED CalendarEvents on the matter: 2026-09-10 (inside the lookahead) and 2026-10-15 (outside it)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 20, reserved_detained_slots: 4 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-500001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Dov Halberstam", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 10, max_supervisees: 5, weekly_capacity_hours: 40, bar_number: "TX-500002" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Ivo Petrov", preferred_language_code: "en", country_of_birth_code: "BG", date_of_birth: "1991-06-14", household_size: 1, annual_household_income_cents: 2000000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
            - call: "PATCH /clients/${client_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: ProgramDirector
              captures: { i_id: "$.data.id" }
            - call: "POST /intake-screenings/${i_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${i_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "GET /case-matters"
              payload: { intake_id: "${i_id}" }
              as: ProgramDirector
              captures: { m_id: "$.data[0].id", m_ver1: "$.data[0].version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${m_id}", representative_id: "${atty_a_id}", role_on_case: "LEAD", expected_matter_version: "${m_ver1}" }
