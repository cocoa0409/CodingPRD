      - name: capacity_variants_diverge_on_one_owner_row
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: owner_capacity_standalone_vs_portfolio_adjusted_diverges_in_both_directions
          rationale: "That dual_variant_calc instance already computes both owner_capacity_score variants on two owner rows and asserts the signed delta in both directions, which is the whole variant-divergence claim."

      - name: capacity_snapshot_reconciles_after_the_profile_switch
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: owner_profile_update_cascades_score_recompute_to_stale_financial_review
          rationale: "That transitive_cascade instance already re-derives both capacity variants after the profile write and reconciles the application's frozen review snapshot against the new live scores."

      - name: marketing_fund_total_rounds_before_summation
        claim_type: precision
        excluded_because:
          difficulty_instance: marketing_fund_total_rounds_per_period_then_sums
          rationale: "That combinatorial_formula instance already pins the rounding order across periods and shows the one-cent divergence between per-period rounding and rounding a single unrounded sum."

      - name: capacity_band_threshold_boundary
        claim_type: threshold
        excluded_because:
          difficulty_instance: financial_review_passes_at_exactly_capacity_band_adequate
          rationale: "That boundary_precision_check instance already probes the ADEQUATE band edge at exactly the threshold and one cent below it, covering the threshold-boundary claim for a threshold-algorithm rule."

      - name: fee_ledger_running_total_after_a_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: revenue_correction_conserves_the_fee_ledger
          rationale: "That compensating_invariant instance already asserts the four running totals after an append and again after a superseding correction, including that the superseded entry leaves the array but not the totals."

