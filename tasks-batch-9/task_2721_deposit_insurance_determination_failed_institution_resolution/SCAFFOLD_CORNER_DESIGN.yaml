            - call: "POST /deposit-accounts/${sr_acct_id}/ownership-interests"
              payload: { depositor_record_id: "${sr_dep_id}", interest_role: "CO_OWNER", designated_share_bps: 0 }
              as: ClaimsAgent
              captures: { sr_err_low: $.data.error_id }
            - call: "GET /deposit-accounts/${sr_acct_id}/ownership-interests"
              as: ClaimsAgent
            - call: "GET /deposit-accounts/${sr_acct_id}"
              as: ClaimsAgent
          assert:
            - "trigger[0]: HTTP 400, data.error_id == 'ERR_INVALID_REQUEST'"
