  - rule_id: resource_temporal_overlap
    instances:
      - name: tank_window_buffer_gap_semantics
        grounds:
          - calculations.tank_window_conflict_check
          - concurrency_rules[window-create-stale-tank]
        distinguishing_aspect: |
          Resource Tank with buffer-gap interval semantics: touching adjacency
          is forbidden — a new window must start >= existing.end + 24h. Exactly
          24h gap passes; 12h gap is ERR_WINDOW_BUFFER_VIOLATION; intersecting
          is ERR_WINDOW_OVERLAP (distinct errors, distinct checks).
        test_recipe:
          setup:
            - "terminal with tank (5000 m3); existing PLANNED window [2026-05-02T00:00:00Z, 2026-05-10T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { t1_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { t1_gas: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${t1_term}", tank_number: "T-101", capacity_m3: 5000, current_product_id: "${t1_gas}" }
              as: TerminalAdmin
              captures: { t1_tank: $.data.id, t1_tank_v: $.data.version }
            - call: "POST /ops/service-windows"
              payload: { tank_id: "${t1_tank}", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", expected_tank_version: "${t1_tank_v}" }
              as: TerminalOperator
              captures: { t1_w1: $.data.id }
            - call: "GET /ops/tanks/${t1_tank}"
              payload: {}
              as: TerminalOperator
              captures: { t1_tank_v2: $.data.version }
          trigger:
            - name: overlapping_window_rejected
              call: "POST /ops/service-windows"
              payload: { tank_id: "${t1_tank}", planned_start: "2026-05-05T00:00:00Z", planned_end: "2026-05-06T00:00:00Z", expected_tank_version: "${t1_tank_v2}" }
              as: TerminalOperator
