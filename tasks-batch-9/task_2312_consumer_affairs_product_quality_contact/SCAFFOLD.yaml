    roles: [CareAgent, CareSupervisor]
    code: 201
    input: [consumer_id, channel, received_at, raw_message, "handle_or_address?"]
    output: Contact
    side_effects:
      - "status initialised to OPEN; intake_agent_ref stamped from X-User-ID"
  - method: GET
    path: /contacts
    description: List contacts with filters.
    roles: [CareAgent, CareSupervisor, QualityLead]
    code: 200
    input: ["consumer_id?", "channel?", "status?", "limit?", "offset?"]
    output: Contact[]
    side_effects: []
  - method: GET
    path: /contacts/{id}
    description: Fetch one contact.
    roles: [CareAgent, CareSupervisor, QualityLead]
    code: 200
    input: []
    output: Contact
    side_effects: []
  - method: POST
    path: /contacts/{id}/close-no-complaint
