              captures: { sys_vjb_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_vj_id}", mrn: "VJ-1000", last_name: "Halvorsen", first_name: "Ingrid", dob: "1984-02-19", sex: "F", ssn_last4: "5757", postal_code: "55401", phone: "6125550101", clinical_element_count: 4 }
              as: IdentityAnalyst
              captures: { rec_vj_id: $.data.id, rec_vj_v1: $.data.version }
            - call: "POST /mpi/overlay-corrections"
              payload: { record_id: "${rec_vj_id}", overlay_type: "DEMOGRAPHIC_OVERWRITE", corrected_field_snapshot: { first_name: "Ingrid", phone: "6125550999" }, affected_clinical_element_count: 3, encounter_from_date: "2026-07-20", encounter_to_date: "2026-07-22", expected_record_version: "${rec_vj_v1}" }
