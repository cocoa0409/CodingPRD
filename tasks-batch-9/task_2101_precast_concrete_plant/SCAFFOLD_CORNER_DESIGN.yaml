scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: create_project_returns_zeroed_counters
        claim_type: Creation
        grounds:
          - entities.Project.fields.total_piece_count
          - entities.Project.fields.committed_cost_cents
          - endpoints[POST /projects]
        distinguishing_aspect: "A freshly created Project returns 201 with all six derived counters at 0 and committed_cost_cents at 0, plus a server-minted id and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /projects"
              payload: { name: "Riverfront Garage", jobsite_city: "Nashville", erection_start_date: "2026-09-15" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { proj_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Project.${proj_id}.total_piece_count == 0"
            - "Project.${proj_id}.held_piece_count == 0"
            - "Project.${proj_id}.cleared_piece_count == 0"
            - "Project.${proj_id}.scrapped_piece_count == 0"
            - "Project.${proj_id}.erected_piece_count == 0"
            - "Project.${proj_id}.committed_cost_cents == 0"
            - "Project.${proj_id}.version == 1"
            - "Project.${proj_id}.name == 'Riverfront Garage'"

      - name: create_casting_bed_applies_status_default_and_zero_committed_force
        claim_type: Defaults
        grounds:
          - entities.CastingBed.fields.status
          - entities.CastingBed.fields.committed_strand_force_kips
          - entities.CastingBed.fields.cumulative_cycle_count
        distinguishing_aspect: "Omitting the optional status input yields AVAILABLE, and both derived bed counters start at 0.00 / 0; supplying status DOWN is honoured."
        test_recipe:
          setup: ["Steam zone Z1 exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /steam-zones"
              payload: { zone_code: "Z1", boiler_capacity_bhp: 100, therm_rate_cents_per_therm: 95 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /casting-beds"
              payload: { bed_code: "B1", steam_zone_id: "${zone_id}", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed1_id: $.data.id }
            - call: "POST /casting-beds"
              payload: { bed_code: "B9", steam_zone_id: "${zone_id}", bed_type: "FLAT_BED_RC", length_ft: 200, max_strand_force_kips: 0.01, turnaround_buffer_hours: 0, status: "DOWN" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed9_id: $.data.id }
          assert:
            - "CastingBed.${bed1_id}.status == AVAILABLE"
            - "CastingBed.${bed1_id}.committed_strand_force_kips == 0.00"
            - "CastingBed.${bed1_id}.cumulative_cycle_count == 0"
            - "CastingBed.${bed9_id}.status == DOWN"
            - "GET /steam-zones/${zone_id}/casting-beds returns exactly 2 rows"

      - name: create_piece_computes_permit_flag_and_mints_system_fields
        claim_type: Computed Fields
        grounds:
          - entities.Piece.fields.requires_haul_permit
          - entities.Piece.fields.production_status
          - entities.Piece.fields.qc_status
          - calculations.shipment_load_metrics
        distinguishing_aspect: "requires_haul_permit is derived at creation from the piece's own dimensions (true only when width > 8.50 or height > 13.50 or length > 53.00), and the two status dimensions start at PLANNED/PENDING with version 1."
        test_recipe:
          setup: ["Project P1 and QUALIFIED mix M40-STD exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /projects"
              payload: { name: "Riverfront Garage", jobsite_city: "Nashville", erection_start_date: "2026-09-15" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { proj_id: $.data.id }
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix_id: $.data.id }
            - call: "POST /mix-designs/${mix_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
          trigger:
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "LEGAL-1", erection_sequence_no: 10, length_ft: 53.00, width_ft: 8.50, height_ft: 13.50, weight_lb: 22000, concrete_volume_cy: 8.00 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { legal_id: $.data.id }
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "TALL-1", erection_sequence_no: 20, length_ft: 53.00, width_ft: 8.50, height_ft: 13.51, weight_lb: 22000, concrete_volume_cy: 8.00 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { tall_id: $.data.id }
          assert:
            - "Piece.${legal_id}.requires_haul_permit == false"
            - "Piece.${tall_id}.requires_haul_permit == true"
            - "Piece.${legal_id}.production_status == PLANNED"
            - "Piece.${legal_id}.qc_status == PENDING"
            - "Piece.${legal_id}.qc_hold_reason == null"
            - "Piece.${legal_id}.bed_run_id == null"
            - "Piece.${legal_id}.allocated_cost_cents == null"
            - "Piece.${legal_id}.repair_count == 0"
            - "Piece.${legal_id}.version == 1"
            - "Project.${proj_id}.total_piece_count == 2"

      - name: list_pieces_paginates_and_filters_by_project_and_status
        claim_type: Listing
        grounds:
          - endpoints[GET /pieces]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /pieces honours limit/offset with total_count and has_more, and the project_id and production_status filters narrow the result set without changing total_count semantics for the filtered query."
        test_recipe:
          setup: ["Project P1 has three PLANNED pieces."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /projects"
              payload: { name: "Riverfront Garage", jobsite_city: "Nashville", erection_start_date: "2026-09-15" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { proj_id: $.data.id }
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix_id: $.data.id }
            - call: "POST /mix-designs/${mix_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "DT-101", erection_sequence_no: 10, length_ft: 53.10, width_ft: 9.50, height_ft: 13.70, weight_lb: 48200, concrete_volume_cy: 12.50 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "DT-102", erection_sequence_no: 20, length_ft: 53.10, width_ft: 9.50, height_ft: 13.70, weight_lb: 48200, concrete_volume_cy: 12.50 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "DT-103", erection_sequence_no: 30, length_ft: 53.10, width_ft: 9.50, height_ft: 13.70, weight_lb: 48200, concrete_volume_cy: 12.50 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
          trigger:
            - call: "GET /pieces"
              payload: { project_id: "${proj_id}", limit: 2, offset: 0 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "GET /pieces"
              payload: { project_id: "${proj_id}", limit: 2, offset: 2 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "GET /pieces"
              payload: { production_status: "CAST" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
          assert:
            - "first page: response_type == 'array', 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 row, total_count == 3, has_more == false"
            - "the production_status=CAST query returns 0 rows with total_count == 0 and has_more == false"

      - name: piece_recast_replacement_self_reference_is_queryable
        claim_type: Parent Relationships
        grounds:
          - entities.Piece.fields.replaces_piece_id
          - endpoints[GET /pieces]
        distinguishing_aspect: "Piece.replaces_piece_id is a self-referential FK: a replacement piece stores the scrapped piece's id and is discoverable through GET /pieces filtered by replaces_piece_id."
        test_recipe:
          setup: ["Project P1 has one original piece DT-101."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /projects"
              payload: { name: "Riverfront Garage", jobsite_city: "Nashville", erection_start_date: "2026-09-15" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { proj_id: $.data.id }
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix_id: $.data.id }
            - call: "POST /mix-designs/${mix_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "DT-101", erection_sequence_no: 10, length_ft: 53.10, width_ft: 9.50, height_ft: 13.70, weight_lb: 48200, concrete_volume_cy: 12.50 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { orig_id: $.data.id }
          trigger:
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "DT-101R1", erection_sequence_no: 10, length_ft: 53.10, width_ft: 9.50, height_ft: 13.70, weight_lb: 48200, concrete_volume_cy: 12.50, replaces_piece_id: "${orig_id}" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { repl_id: $.data.id }
            - call: "GET /pieces"
              payload: { replaces_piece_id: "${orig_id}" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
          assert:
            - "Piece.${repl_id}.replaces_piece_id == ${orig_id}"
            - "Piece.${orig_id}.replaces_piece_id == null"
            - "the filtered query returns exactly 1 row whose id == ${repl_id}"
            - "two pieces of the same project may share erection_sequence_no 10; only piece_mark is unique per project"

      - name: unresolvable_path_and_body_ids_return_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_MIX_DESIGN_NOT_FOUND]
          - errors[ERR_PLANT_RESOURCE_NOT_FOUND]
          - errors[ERR_BED_RUN_NOT_FOUND]
          - errors[ERR_CYLINDER_SET_NOT_FOUND]
          - errors[ERR_PIECE_NOT_FOUND]
          - errors[ERR_HAUL_PERMIT_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_REPAIR_DISPOSITION_NOT_FOUND]
        distinguishing_aspect: "Every id that fails to resolve - whether it arrives in the path or in the request body - returns the 404 code of the entity family it belongs to, and no partial state is written."
        test_recipe:
          setup:
            - "Project P1 and QUALIFIED mix M40-STD exist so that the only unresolvable value in each trigger is the one under test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /projects"
              payload: { name: "Riverfront Garage", jobsite_city: "Nashville", erection_start_date: "2026-09-15" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { proj_id: $.data.id }
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix_id: $.data.id }
            - call: "POST /mix-designs/${mix_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /steam-zones"
              payload: { zone_code: "Z1", boiler_capacity_bhp: 100, therm_rate_cents_per_therm: 95 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
            - call: "POST /casting-beds"
              payload: { bed_code: "B1", steam_zone_id: "${zone_id}", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed_id: $.data.id }
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "DT-101", erection_sequence_no: 10, length_ft: 53.10, width_ft: 9.50, height_ft: 13.70, weight_lb: 48200, concrete_volume_cy: 12.50 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { pc1_id: $.data.id }
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { e_project: $.data.error_id }
            - call: "GET /mix-designs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { e_mix: $.data.error_id }
            - call: "POST /casting-beds"
              payload: { bed_code: "BX", steam_zone_id: "00000000-0000-4000-8000-000000000000", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { e_zone: $.data.error_id }
            - call: "POST /pieces/${pc1_id}/assign-run"
              payload: { bed_run_id: "00000000-0000-4000-8000-000000000000" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { e_run: $.data.error_id }
            - call: "POST /cylinder-sets/00000000-0000-4000-8000-000000000000/breaks"
              payload: { load_lbf: 43983, diameter_in: 4.00 }
              as: QCTechnician
              as_user_id: "qc-alice"
              captures: { e_set: $.data.error_id }
            - call: "GET /pieces/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { e_piece: $.data.error_id }
            - call: "POST /shipments"
              payload: { project_id: "${proj_id}", scheduled_departure: "2026-08-05T13:00:00Z", haul_permit_id: "00000000-0000-4000-8000-000000000000" }
              as: YardForeman
              as_user_id: "yf-dana"
              captures: { e_permit: $.data.error_id }
            - call: "POST /shipments/00000000-0000-4000-8000-000000000000/dispatch"
              payload: {}
              as: YardForeman
              as_user_id: "yf-dana"
              captures: { e_ship: $.data.error_id }
            - call: "POST /repair-dispositions/00000000-0000-4000-8000-000000000000/disposition"
              payload: { disposition: "USE_AS_IS" }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { e_ncr: $.data.error_id }
            - call: "POST /pieces"
              payload: { project_id: "00000000-0000-4000-8000-000000000000", mix_design_id: "${mix_id}", piece_mark: "GHOST", erection_sequence_no: 99, length_ft: 20.00, width_ft: 4.00, height_ft: 3.00, weight_lb: 5000, concrete_volume_cy: 2.00 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { e_proj_body: $.data.error_id }
          assert:
            - "${e_project} == ERR_PROJECT_NOT_FOUND with HTTP 404"
            - "${e_mix} == ERR_MIX_DESIGN_NOT_FOUND with HTTP 404"
            - "${e_zone} == ERR_PLANT_RESOURCE_NOT_FOUND with HTTP 404"
            - "${e_run} == ERR_BED_RUN_NOT_FOUND with HTTP 404"
            - "${e_set} == ERR_CYLINDER_SET_NOT_FOUND with HTTP 404"
            - "${e_piece} == ERR_PIECE_NOT_FOUND with HTTP 404"
            - "${e_permit} == ERR_HAUL_PERMIT_NOT_FOUND with HTTP 404"
            - "${e_ship} == ERR_SHIPMENT_NOT_FOUND with HTTP 404"
            - "${e_ncr} == ERR_REPAIR_DISPOSITION_NOT_FOUND with HTTP 404"
            - "${e_proj_body} == ERR_PROJECT_NOT_FOUND with HTTP 404"
            - "Piece.${pc1_id}.production_status == PLANNED and bed_run_id == null (the failed assign-run wrote nothing)"
            - "Project.${proj_id}.total_piece_count == 1 (the GHOST piece was never created)"

      - name: create_mix_design_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - endpoints[POST /mix-designs]
        distinguishing_aspect: "Omitting required_release_psi from POST /mix-designs returns ERR_VALIDATION (400) and creates nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION with HTTP 400"
            - "GET /bed-runs returns total_count 0, confirming no side effects"

      - name: invalid_enum_and_inverted_interval_return_validation
        claim_type: Type Constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - entities.MixDesign.fields.strength_class
          - entities.BedRun.fields.scheduled_end
        distinguishing_aspect: "A strength_class outside {C40,C50,C60,C70} and a bed run whose scheduled_end is not strictly after scheduled_start both return ERR_VALIDATION at priority 5, before any existence or state rule runs."
        test_recipe:
          setup: ["QUALIFIED mix M40-STD, steam zone Z1 and bed B1 exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix_id: $.data.id }
            - call: "POST /mix-designs/${mix_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /steam-zones"
              payload: { zone_code: "Z1", boiler_capacity_bhp: 100, therm_rate_cents_per_therm: 95 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
            - call: "POST /casting-beds"
              payload: { bed_code: "B1", steam_zone_id: "${zone_id}", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed_id: $.data.id }
          trigger:
            - call: "POST /mix-designs"
              payload: { code: "M99-X", strength_class: "C99", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { e_enum: $.data.error_id }
            - call: "POST /bed-runs"
              payload: { bed_id: "${bed_id}", mix_design_id: "${mix_id}", scheduled_start: "2026-08-04T06:00:00Z", scheduled_end: "2026-08-04T06:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { e_interval: $.data.error_id }
            - call: "POST /bed-runs"
              payload: { bed_id: "00000000-0000-4000-8000-000000000000", mix_design_id: "${mix_id}", scheduled_start: "2026-08-04T06:00:00Z", scheduled_end: "2026-08-04T05:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { e_order: $.data.error_id }
          assert:
            - "${e_enum} == ERR_VALIDATION with HTTP 400"
            - "${e_interval} == ERR_VALIDATION with HTTP 400 (equal endpoints are not a valid window)"
            - "${e_order} == ERR_VALIDATION with HTTP 400, NOT ERR_PLANT_RESOURCE_NOT_FOUND, because schema validation at priority 5 runs before body-FK existence at priority 6"

  # =========================================================================
  - section: state_machines
    instances:

      - name: mix_design_qualify_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.MixDesign.DRAFT_to_QUALIFIED
          - errors[ERR_MIX_DESIGN_INVALID_STATE]
          - validations[priority=8]
