              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB154-P01", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "PATCH /parcels/${p1_id}"
              payload: { expected_parcel_version: "${p1_v}", usage_class: "COMMERCIAL", trips_per_day: 10 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { p1_v2: $.data.version }
            - call: "PATCH /parcels/${p1_id}"
              payload: { expected_parcel_version: "${p1_v2}", frontage_feet: 300 }
              as: AssociationSecretary
              as_user_id: "sec-1"
            - call: "GET /parcels/${p1_id}"
              payload: {}
              as: AssessmentClerk
              as_user_id: "clerk-1"
          assert:
            - "creation returns frontage_share_units 290.0 and trip_share_units 208.0 (6 * 25 + 290 * 0.20) with version 1 and status ACTIVE"
            - "the first PATCH returns HTTP 200 with usage_class COMMERCIAL, trips_per_day 10, frontage_feet still 290, frontage_share_units 507.5 (290 * 1.75), trip_share_units 308.0 (10 * 25 + 290 * 0.20) and version 2"
            - "the second PATCH sends frontage_feet only and returns usage_class COMMERCIAL retained, frontage_share_units 525.0 (300 * 1.75), trip_share_units 310.0 (10 * 25 + 300 * 0.20) and version 3"
            - "the GET returns exactly the same field values as the second PATCH response, including deed_book_page DB154-P01, covenant_recorded true, parent_parcel_id null and version 3"

      - name: subdivide_bulk_action_creates_children_and_retires_the_parent
        claim_type: bulk_action
        grounds:
          - endpoints[POST /parcels/{parcel_id}/subdivide]
          - state_machines.Parcel.ACTIVE_to_SUBDIVIDED
          - calculations.parcel_share_units
        distinguishing_aspect: "One request creates three children in a single response envelope keyed parent_parcel and children, each child defaulting to UNDEVELOPED with 0 trips and covenant_recorded false, and the parent flips to SUBDIVIDED with a single version bump rather than one per child."
        test_recipe:
          setup:
            - "One Association with one RoadSegment and one ACTIVE parcel of 300 frontage feet (RESIDENTIAL_YEAR_ROUND, 5 trips per day), no charges and no roll."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Three Lot Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Three Lot Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB155-P01", frontage_feet: 300, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 5, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { parent_id: $.data.id }
          trigger:
            - call: "POST /parcels/${parent_id}/subdivide"
              payload: { children: [ { deed_book_page: "DB155-P01A", frontage_feet: 180 }, { deed_book_page: "DB155-P01B", frontage_feet: 70 }, { deed_book_page: "DB155-P01C", frontage_feet: 50 } ] }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { child_a: "$.data.children[0].id" }
            - call: "GET /parcels"
              payload: { parent_parcel_id: "${parent_id}" }
              as: AssociationSecretary
              as_user_id: "sec-1"
          assert:
            - "the subdivide response is a single envelope with keys parent_parcel and children, and children has length 3 in the submitted order 180 / 70 / 50"
            - "parent_parcel reads status SUBDIVIDED, frontage_feet 300 unchanged and version 2 - one bump for the whole bulk action"
            - "every child reads status PENDING_CONNECTION, usage_class UNDEVELOPED, trips_per_day 0, covenant_recorded false, parent_parcel_id equal to the parent id and version 1"
            - "child frontage_share_units are 45.0, 17.5 and 12.5 (frontage * 0.25) and trip_share_units are 36.0, 14.0 and 10.0 (0 * 25 + frontage * 0.20)"
            - "GET /parcels?parent_parcel_id=... returns total_count 3, so the children are addressable by the parent link and no fourth row was created"

      - name: ballot_cross_reference_links_proposal_and_member_with_a_weight_snapshot
