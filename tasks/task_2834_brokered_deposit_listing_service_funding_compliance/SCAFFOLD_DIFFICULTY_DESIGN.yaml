              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Gate Bank NA", cert_id: "CERT-2834-16", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 1000000000 }
