            - call: "POST /shows"
              payload: { artist_id: "${lk_ar_id}", venue_id: "${lk_vn_id}", event_at: "2026-12-23T02:00:00.000Z", load_in_at: "2026-12-22T14:00:00.000Z", load_out_at: "2026-12-23T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0, rescheduled_from_show_id: "${lk_sh_a}" }
              as: TalentBuyer
              captures: { lk_sh_b: $.data.id, lk_sh_b_from: $.data.rescheduled_from_show_id, lk_sh_b_transferred_gross_0: $.data.transferred_in_gross_cents, lk_sh_b_transferred_paid_0: $.data.transferred_in_paid_tickets }
            - call: "POST /cancellation-events/${lk_ce_id}/reschedule"
              payload: { replacement_show_id: "${lk_sh_b}" }
              as: TalentBuyer
              captures: { lk_ce_status_1: $.data.status, lk_ce_replacement_1: $.data.replacement_show_id }
            - call: "GET /shows/${lk_sh_b}"
              payload: {}
              as: TalentBuyer
              captures: { lk_sh_b_transferred_gross_1: $.data.transferred_in_gross_cents, lk_sh_b_transferred_paid_1: $.data.transferred_in_paid_tickets, lk_sh_b_status: $.data.show_status, lk_sh_b_own_gross: $.data.gross_sold_cents }
            - call: "GET /shows/${lk_sh_a}"
