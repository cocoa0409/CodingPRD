  # ===========================================================================
  # Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: coating_bundle_discount_applies_only_from_two_coatings
        claim_type: Constants Applied
        grounds: [calculations.lens_upcharge, entities.Order.fields.lens_upcharge_cents]
        distinguishing_aspect: "COATING_BUNDLE_PCT 0.15 is gated on len(coatings) >= 2: one coating (AR 4000) gives lens_upcharge 10000 with no discount, while two coatings (AR 4000 + BLUE 3000) give 6000 + 7000 - floor(7000*0.15)=1050 == 11950."
        test_recipe:
          setup: ["Self-pay customer, VERIFIED low-power Rx, frame 9500, M160 (6000), coatings AR (4000) and BLUE (3000)."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C08", name: "Durand", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M160", category: "MATERIAL", base_price_cents: 6000, material_index: 1.60 }
              as: PlatformAdmin
              captures: { m160_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "AR", category: "COATING", base_price_cents: 4000 }
              as: PlatformAdmin
              captures: { ar_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "BLUE", category: "COATING", base_price_cents: 3000 }
              as: PlatformAdmin
              captures: { blue_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Coa Ting", email: "coat@x.com", dob: "1990-01-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -2.00, od_cylinder: 0.00, os_sphere: -2.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
          trigger:
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m160_id}", coating_option_ids: ["${ar_id}"], delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_one: $.data.id }
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m160_id}", coating_option_ids: ["${ar_id}", "${blue_id}"], delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_two: $.data.id }
          assert:
            - "Order.${ord_one}.lens_upcharge_cents == 10000"
            - "Order.${ord_two}.lens_upcharge_cents == 11950"
            - "Order.${ord_two}.subtotal_cents == 21450"
            - "Order.${ord_two}.discount_cents == 0"

      - name: high_power_surcharge_clamps_at_its_cap
        claim_type: threshold
        grounds: [calculations.lens_upcharge]
        distinguishing_aspect: "HIGH_POWER_CAP_CENTS 6000 clamps the surcharge: at rx_power 13.00 the raw product is (13.00-6.00)*1000 == 7000, so min() must clamp to 6000 and lens_upcharge_cents lands at 20000 + 4000 + 0 + 6000 == 30000, not 31000."
        test_recipe:
          setup: ["Self-pay customer with a VERIFIED Rx of od_sphere -12.00 / od_cylinder -2.00 (rx_power 13.00), frame 9500, M174 (20000), coating AR (4000)."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C09", name: "Wilkie", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
