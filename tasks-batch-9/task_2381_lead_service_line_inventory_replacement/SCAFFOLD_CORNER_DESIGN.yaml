            - "The adjacent call returns HTTP 201"
            - "GET /lsl/progress-reports filtered by water_system_id returns total_count == 2"

      - name: scheduling_while_corrosion_control_is_being_reoptimized_is_rejected
        claim_type: priority_ordering
        grounds:
          - validations.priority_65_ERR_CCT_NOT_OPTIMIZED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / schedule_prefers_corrosion_control_safety_over_moratorium_conflict
          rationale: "That instance triggers the corrosion-control safety gate and the moratorium conflict in the same schedule call and pins ERR_CCT_NOT_OPTIMIZED as the winner at priority 65 over 75."

      - name: booking_an_uncertified_method_is_rejected
        claim_type: priority_ordering
        grounds:
          - validations.priority_70_ERR_CREW_METHOD_NOT_CERTIFIED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / appointment_create_prefers_uncertified_method_over_crew_window_conflict
          rationale: "That instance books a WATER_SAMPLING window on a crew certified only for VISUAL_INSPECTION inside an already-occupied slot and pins ERR_CREW_METHOD_NOT_CERTIFIED as the winner at priority 70 over 75."

      - name: overlapping_crew_windows_are_rejected_with_a_travel_buffer
        claim_type: temporal_validation
        grounds:
          - validations.priority_75_ERR_CREW_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_window_overlap_uses_half_open_interval_plus_45_minute_travel_buffer
          rationale: "That instance walks the exact half-open boundary at existing.window_end + 45 minutes, accepting the touching window and rejecting the one a minute earlier."

      - name: street_excavation_capacity_is_enforced_per_calendar_date
        claim_type: aggregate_validation
        grounds:
          - validations.priority_78_ERR_EXCAVATION_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / street_project_excavation_capacity_uses_closed_inclusive_date_overlap
          rationale: "That instance fills a street project to max_concurrent_excavations on a single shared date and pins ERR_EXCAVATION_CAPACITY_EXCEEDED for the window that touches it while accepting the disjoint window."

      - name: arriving_with_an_inactive_crew_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_60_ERR_CREW_INACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / appointment_arrive_depends_on_verification_crew_status
          rationale: "That instance deactivates the crew between booking and arrival, pins ERR_CREW_INACTIVE, reactivates it and shows the same arrive then succeeding."

      - name: certifying_with_an_unvalidated_stratum_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_60_ERR_UNVALIDATED_SAMPLING_STRATUM
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / publication_certify_depends_on_sampling_batch_state
          rationale: "That instance covers both halves of the rule — zero batches and a REJECTED batch — and then validates the batch so the same certify call succeeds."

      - name: ordering_before_publication_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_60_ERR_INVENTORY_NOT_PUBLISHED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / replacement_order_creation_depends_on_water_system_inventory_status
          rationale: "That instance opens an order against an ELIGIBLE line while the system is at VALIDATION_PENDING with posture OPEN, pins ERR_INVENTORY_NOT_PUBLISHED, then publishes and shows the identical create succeeding."

      - name: funding_a_draft_order_reports_the_consent_gap_first
        claim_type: priority_ordering
        grounds:
          - validations.priority_52_ERR_CONSENT_NOT_RESOLVED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / funding_plan_on_draft_order_prefers_consent_error_over_fiscal_error
          rationale: "That instance commits funding on an order whose consent was never resolved AND whose water system has no candidate funding at all, pinning ERR_CONSENT_NOT_RESOLVED at priority 52 over the priority-90 fiscal error."

