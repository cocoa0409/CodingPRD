# =============================================================================
# SCAFFOLD — Poultry Processing Plant Line Operations (further-processing plant)
# =============================================================================

scenario: |
  Poultry Processing Plant Line Operations (poultry further-processing plant): live receiving & shackle rate, evisceration/chilling line yield & condemnation coding, deboning line labor & product mix by order, cold chain & fresh-vs-frozen routing, water/chiller usage & regulatory limit, line-speed waiver & staffing constraint, product traceability by shift/lot, sanitation shift & pre-op inspection

domain_name: poultry-plant-line-operations
api_prefix: /poultry

complexity_profile:
  primary_archetype: compliance_audit      # regulatory water/chiller limits, condemnation certification, sanitation/pre-op gates, shift+lot traceability
  secondary_archetype: quota_allocation    # deboning labor budget per shift, shackle capacity per shift, waiver speed caps
  complexity_layers:
    - optimistic_concurrency               # OCC on ProductionShift / ProductOrder / ProcessingLine versions
    - cascading_side_effects               # certify -> run reconcile -> lot yield -> routing flip; breach -> suspend -> pause -> hold
    - dual_variant_calculation             # provisional vs certified yield; birds-basis vs weight-basis water intensity
    - rate_threshold_triggers              # water limit auto-suspend; staffing ratio bands; yield routing threshold
  entity_topology: flat                    # peer entities joined by foreign keys; no nested creation paths except waiver creation under its line
  state_machine_shape: parallel            # ProductOrder allocation_status x fulfillment_status; cyclic machines on Shift / CondemnationRecord / LineSpeedWaiver / PreOpInspection / SanitationRun / FlockLot
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties        # sanitation completer may not pass pre-op; condemnation recorder may not certify own record
  consistency_model: immediate             # all mutations and cascades are atomic within the request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ProcessingLine
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: line_code, type: string, source: input, description: "Unique plant line code, e.g. EV-1 or DB-1", constraints: "unique across plant" }
      - { name: line_type, type: enum, source: input, description: "EVISCERATION lines run flock lots; DEBONING lines run deboning batches", constraints: "EVISCERATION | DEBONING" }
      - { name: rated_speed_bpm, type: integer, source: input, description: "Mechanical rated line speed in birds per minute (evisceration) or birds-equivalent per minute (deboning)", constraints: "> 0" }

  - name: ProductionShift
    parent: null
    common_fields: true
    fields:
      - { name: shift_date, type: string, source: input, description: "Calendar date YYYY-MM-DD of the shift" }
      - { name: shift_code, type: enum, source: input, description: "Shift slot", constraints: "DAY_A | DAY_B | NIGHT" }
      - { name: shackle_capacity_birds, type: integer, source: input, description: "Maximum birds that may be booked into this shift across all flock lots", constraints: "> 0" }
      - { name: labor_hours_budget, type: number, source: input, description: "Deboning labor hours budgeted for this shift", constraints: ">= 0" }
      - { name: shacklers_present, type: integer, source: input, default: 0, description: "Live-hang shacklers staffed (set via staffing endpoint)", constraints: ">= 0" }
      - { name: eviscerators_present, type: integer, source: input, default: 0, description: "Evisceration crew staffed", constraints: ">= 0" }
      - { name: deboners_present, type: integer, source: input, default: 0, description: "Deboning crew staffed", constraints: ">= 0" }
      - { name: qa_techs_present, type: integer, source: input, default: 0, description: "QA technicians staffed", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> RUNNING <-> SUSPENDED cycle -> CLOSED", constraints: "SCHEDULED | RUNNING | SUSPENDED | CLOSED" }
      - { name: suspend_reason, type: enum, source: system, default: NONE, description: "Why the shift is suspended; NONE when not suspended", constraints: "NONE | MANUAL | WATER_LIMIT_BREACH | REGULATORY_HOLD" }
      - { name: process_water_gallons, type: number, source: computed, default: 0, description: "Sum of gallons over UtilityMeterReading of meter_type PROCESS_WATER for this shift" }
      - { name: chiller_water_gallons, type: number, source: computed, default: 0, description: "Sum of gallons over UtilityMeterReading of meter_type CHILLER_WATER for this shift" }
      - { name: birds_processed, type: integer, source: computed, default: 0, description: "Sum of birds_hung over this shift's LineRuns in status COMPLETED or RECONCILED" }
      - { name: chilled_weight_lb, type: number, source: computed, default: 0, description: "Sum of carcass_weight_lb over this shift's LineRuns in status COMPLETED or RECONCILED" }
      - { name: water_rate_birds_basis, type: number, source: computed, description: "process_water_gallons * 1000 / birds_processed; null while birds_processed == 0" }
      - { name: water_rate_weight_basis, type: number, source: computed, description: "process_water_gallons * 100 / chilled_weight_lb; null while chilled_weight_lb == 0" }
      - { name: water_breach_active, type: boolean, source: computed, default: false, description: "True when water_rate_birds_basis > WATER_LIMIT_GAL_PER_1000_BIRDS (strictly greater; equality is compliant)" }
      - { name: chiller_limit_breached, type: boolean, source: computed, default: false, description: "True when chiller_water_gallons * 1000 / birds_processed > CHILLER_LIMIT_GAL_PER_1000_BIRDS; blocks FRESH routing" }
      - { name: labor_hours_remaining, type: number, source: computed, description: "labor_hours_budget - sum(estimated_labor_hours over batches SCHEDULED|IN_PROGRESS|ON_HOLD) - sum(actual_labor_hours over batches COMPLETED)" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock time of SCHEDULED -> RUNNING; null until opened" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock time of transition to CLOSED; null until closed" }

  - name: SanitationRun
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> ProductionShift.id; the shift being sanitized" }
      - { name: line_id, type: string, source: input, description: "FK -> ProcessingLine.id; the line being sanitized" }
      - { name: window_start, type: datetime, source: input, description: "Planned sanitation window start (must be < window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Planned sanitation window end" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> COMPLETED -> VERIFIED; COMPLETED -> FAILED_RECHECK -> IN_PROGRESS re-wash cycle", constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | VERIFIED | FAILED_RECHECK" }
      - { name: completer_user_id, type: string, source: system, description: "X-User-ID that moved the run to COMPLETED; used by pre-op segregation-of-duties" }
      - { name: verifier_user_id, type: string, source: system, description: "X-User-ID that moved the run to VERIFIED or FAILED_RECHECK" }

  - name: PreOpInspection
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> ProductionShift.id" }
      - { name: line_id, type: string, source: input, description: "FK -> ProcessingLine.id" }
      - { name: status, type: enum, source: system, description: "PENDING -> PASSED | FAILED; FAILED -> CORRECTING -> PENDING re-inspection cycle", constraints: "PENDING | PASSED | FAILED | CORRECTING" }
      - { name: findings, type: string, source: input, description: "Inspector findings note; required when failing", constraints: "optional except FAILED" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID that recorded the latest PASSED or FAILED result" }
      - { name: cycle_count, type: integer, source: system, default: 0, description: "Increments each time the inspection returns from CORRECTING to PENDING" }

  - name: LineSpeedWaiver
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProcessingLine.id; line the waiver applies to" }
      - { name: max_speed_bpm, type: integer, source: input, description: "Maximum authorized speed under this waiver", constraints: "> regulatory base cap to be useful" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open window start; must be < effective_to" }
      - { name: effective_to, type: datetime, source: input, description: "Half-open window end (exclusive); adjacency with another waiver is allowed" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED -> ACTIVE -> EXPIRED | REVOKED; SUBMITTED -> DENIED -> SUBMITTED resubmission cycle; DRAFT/SUBMITTED -> SUPERSEDED when a new overlapping waiver is created on the line", constraints: "DRAFT | SUBMITTED | APPROVED | ACTIVE | DENIED | REVOKED | EXPIRED | SUPERSEDED" }
      - { name: denial_count, type: integer, source: system, default: 0, description: "Increments on each SUBMITTED -> DENIED transition" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of the USDAInspector who approved" }

  - name: FlockLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Grower lot code; unique", constraints: "unique" }
      - { name: grower_name, type: string, source: input, description: "Grower / farm name" }
      - { name: booked_head_count, type: integer, source: input, description: "Birds booked against the receiving shift's shackle capacity", constraints: "> 0" }
      - { name: expected_avg_live_weight_lb, type: number, source: input, description: "Expected average live weight per bird", constraints: "> 0" }
      - { name: receiving_shift_id, type: string, source: input, description: "FK -> ProductionShift.id; shift this lot is booked into" }
      - { name: status, type: enum, source: system, description: "BOOKED -> RECEIVED -> ON_LINE -> CHILLED -> SETTLED; SETTLED -> REOPENED -> SETTLED regrade cycle", constraints: "BOOKED | RECEIVED | ON_LINE | CHILLED | SETTLED | REOPENED" }
      - { name: head_count_received, type: integer, source: input, description: "Actual birds received (recorded at receive)", constraints: "> 0 at receive" }
      - { name: doa_count, type: integer, source: input, description: "Dead-on-arrival birds (never hung)", constraints: ">= 0" }
      - { name: total_live_weight_lb, type: number, source: input, description: "Scale weight of the received load", constraints: "> 0 at receive" }
      - { name: birds_hung_total, type: integer, source: computed, default: 0, description: "Sum of birds_hung over this lot's LineRuns in COMPLETED or RECONCILED" }
      - { name: condemned_accounted, type: integer, source: computed, default: 0, description: "Sum of effective_count over condemnation records in DRAFT or CERTIFIED (DISPUTED excluded) on this lot's runs" }
      - { name: carcasses_to_chill, type: integer, source: computed, default: 0, description: "birds_hung_total - condemned_accounted (bird accountability invariant)" }
      - { name: carcass_weight_total_lb, type: number, source: computed, default: 0, description: "Sum of carcass_weight_lb over this lot's runs in COMPLETED or RECONCILED" }
      - { name: provisional_yield_pct, type: number, source: computed, description: "Provisional variant of flock_yield_pct (eviscerated basis, provisional condemnations); null until first run completes" }
      - { name: certified_yield_pct, type: number, source: computed, description: "Certified variant of flock_yield_pct (live basis, certified condemnations); computed at settle and recomputed on later certification changes; null until first settle" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock time of latest CHILLED|REOPENED -> SETTLED" }

  - name: LineRun
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> ProductionShift.id" }
      - { name: line_id, type: string, source: input, description: "FK -> ProcessingLine.id; must be an EVISCERATION line" }
      - { name: flock_lot_id, type: string, source: input, description: "FK -> FlockLot.id; lot.receiving_shift_id must equal shift_id" }
      - { name: planned_speed_bpm, type: integer, source: input, description: "Planned line speed; must be <= effective_max_line_speed at creation", constraints: "> 0" }
      - { name: current_speed_bpm, type: integer, source: system, description: "Live speed; set at start to planned_speed_bpm, mutated by set-speed, auto-clamped on waiver revoke or staffing reduction" }
      - { name: speed_clamped, type: boolean, source: system, default: false, description: "True after an automatic clamp reduced current_speed_bpm" }
      - { name: status, type: enum, source: system, description: "QUEUED -> RUNNING -> COMPLETED -> RECONCILED; RUNNING -> PAUSED -> RUNNING on shift suspend/resume; QUEUED -> CANCELLED on shift close", constraints: "QUEUED | RUNNING | PAUSED | COMPLETED | RECONCILED | CANCELLED" }
      - { name: birds_hung, type: integer, source: input, description: "Birds shackled onto the line (recorded at complete)", constraints: "> 0 at complete" }
      - { name: carcass_weight_lb, type: number, source: input, description: "Post-chill carcass weight for the run (recorded at complete)", constraints: "> 0 at complete" }
      - { name: auto_paused, type: boolean, source: system, default: false, description: "True when paused by a shift suspension; only auto_paused runs resume automatically" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock time of QUEUED -> RUNNING" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time of RUNNING -> COMPLETED" }

  - name: CondemnationRecord
    parent: null
    common_fields: true
    fields:
      - { name: line_run_id, type: string, source: input, description: "FK -> LineRun.id; run must be COMPLETED or RECONCILED" }
      - { name: condemnation_code, type: enum, source: input, description: "USDA condemnation cause code", constraints: "SEPTICEMIA | AIR_SACCULITIS | BRUISING | CONTAMINATION | MACHINE_DAMAGE" }
      - { name: carcass_count, type: integer, source: input, description: "Condemned carcasses under this code", constraints: "> 0" }
      - { name: amended_carcass_count, type: integer, source: input, description: "Amended count supplied on recertify after dispute", constraints: "> 0 when provided" }
      - { name: effective_count, type: integer, source: computed, description: "amended_carcass_count if set, else carcass_count" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the QATechnician who recorded the record" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the USDAInspector who last certified" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CERTIFIED -> DISPUTED -> CERTIFIED regrade cycle", constraints: "DRAFT | CERTIFIED | DISPUTED" }

  - name: UtilityMeterReading
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> ProductionShift.id" }
      - { name: meter_type, type: enum, source: input, description: "Which meter the reading is from", constraints: "PROCESS_WATER | CHILLER_WATER" }
      - { name: gallons, type: number, source: input, description: "Incremental gallons since the previous reading of this meter on this shift", constraints: "> 0" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock time the reading was posted" }

  - name: ProductOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Customer name" }
      - { name: product_code, type: enum, source: input, description: "Deboned product mix item", constraints: "WINGS | BREAST_FILLET | THIGH_MEAT | TENDERLOIN | WHOLE_BIRD" }
      - { name: pounds_ordered, type: number, source: input, description: "Ordered net pounds", constraints: "> 0" }
      - { name: temperature_requirement, type: enum, source: input, description: "FRESH requires fresh routing; FROZEN forces frozen; FLEXIBLE lets the routing_decision calculation choose", constraints: "FRESH | FROZEN | FLEXIBLE" }
      - { name: due_at, type: datetime, source: input, description: "Customer due time; deboning batches may not be created after it" }
      - { name: fulfillment_status, type: enum, source: system, description: "Parallel dimension 1: PENDING -> IN_PRODUCTION -> FULFILLED; PENDING|IN_PRODUCTION -> CANCELLED", constraints: "PENDING | IN_PRODUCTION | FULFILLED | CANCELLED" }
      - { name: allocation_status, type: enum, source: system, description: "Parallel dimension 2 (evolves independently of fulfillment_status): UNALLOCATED -> PARTIALLY_ALLOCATED -> ALLOCATED, driven by filled_lb vs pounds_ordered", constraints: "UNALLOCATED | PARTIALLY_ALLOCATED | ALLOCATED" }
      - { name: filled_lb, type: number, source: computed, default: 0, description: "Sum of net_weight_lb over this order's COMPLETED batches (per-batch rounding pinned in order_fill_weight)" }

  - name: DeboningBatch
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ProductOrder.id" }
      - { name: flock_lot_id, type: string, source: input, description: "FK -> FlockLot.id; lot must be CHILLED before the batch starts" }
      - { name: shift_id, type: string, source: input, description: "FK -> ProductionShift.id; debits this shift's labor budget" }
      - { name: line_id, type: string, source: input, description: "FK -> ProcessingLine.id; must be a DEBONING line" }
      - { name: crew_count, type: integer, source: input, description: "Deboners assigned to this batch", constraints: "> 0" }
      - { name: input_weight_lb, type: number, source: input, description: "Chilled carcass weight fed to the batch", constraints: "> 0" }
      - { name: estimated_labor_hours, type: number, source: computed, description: "round_half_up(input_weight_lb / 500.0, 2); debited at creation" }
      - { name: actual_output_weight_lb, type: number, source: input, description: "Measured deboned output (recorded at complete)", constraints: "> 0 at complete" }
      - { name: actual_labor_hours, type: number, source: input, description: "Actual labor consumed (recorded at complete)", constraints: "> 0 at complete" }
      - { name: net_weight_lb, type: number, source: computed, description: "round_half_up(actual_output_weight_lb * (1 - TRIM_ALLOWANCE_PCT), 2); per-batch rounding pinned before order summation" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> COMPLETED; IN_PROGRESS <-> ON_HOLD; SCHEDULED -> CANCELLED", constraints: "SCHEDULED | IN_PROGRESS | ON_HOLD | COMPLETED | CANCELLED" }

  - name: FinishedLot
    parent: null
    common_fields: true
    fields:
      - { name: deboning_batch_id, type: string, source: system, description: "FK -> DeboningBatch.id; created by the batch completion cascade" }
      - { name: order_id, type: string, source: system, description: "FK -> ProductOrder.id; copied from the batch" }
      - { name: trace_code, type: string, source: computed, description: "flock lot_code + '/' + shift_code + '/' + deboning_batch_id — shift/lot traceability handle" }
      - { name: net_weight_lb, type: number, source: computed, description: "Copied from the batch's net_weight_lb at creation" }
      - { name: routing_status, type: enum, source: system, description: "UNROUTED until trace-lock; routing_decision sets FRESH or FROZEN at TRACE_LOCKED and may later flip FRESH -> FROZEN on yield recompute", constraints: "UNROUTED | FRESH | FROZEN" }
      - { name: status, type: enum, source: system, description: "OPEN -> TRACE_LOCKED -> SHIPPED; TRACE_LOCKED|SHIPPED -> RECALLED", constraints: "OPEN | TRACE_LOCKED | SHIPPED | RECALLED" }
      - { name: locked_at, type: datetime, source: system, description: "Logical-clock time of trace-lock" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock time of ship" }

  - name: ChillChainLog
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: finished_lot_id, type: string, source: input, description: "FK -> FinishedLot.id" }
      - { name: location, type: enum, source: input, description: "Cold-chain location of the temperature observation", constraints: "CHILLER | BLAST_FREEZER | COLD_STORAGE | DOCK" }
      - { name: temperature_c, type: number, source: input, description: "Observed product temperature in Celsius", constraints: "-40..20" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock time the log was posted" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ProductionShift
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /poultry/shifts/{id}/transition {to_status: RUNNING}"
        actor: ShiftSupervisor
        preconditions:
          - "from-state SCHEDULED (ERR_SHIFT_NOT_OPENABLE)"
          - "at least one LineRun in QUEUED for this shift (ERR_NO_RUNS_QUEUED) — checked FIRST among the gates"
          - "for every line referenced by a QUEUED run: at least one SanitationRun VERIFIED for (shift,line) (ERR_SANITATION_NOT_VERIFIED) — checked before pre-op"
          - "for every line referenced by a QUEUED run: at least one PreOpInspection PASSED for (shift,line) (ERR_PREOP_NOT_PASSED)"
        side_effects:
          - "started_at = logical clock now"
      - from: RUNNING
        to: SUSPENDED
        trigger: "POST /poultry/shifts/{id}/transition {to_status: SUSPENDED, reason_code} OR system auto-transition when a UtilityMeterReading makes water_rate_birds_basis > WATER_LIMIT_GAL_PER_1000_BIRDS (reason WATER_LIMIT_BREACH). Manual suspends take reason_code in {MANUAL, REGULATORY_HOLD}; WATER_LIMIT_BREACH is system-only"
        actor: ShiftSupervisor | QATechnician | USDAInspector | system
        preconditions:
          - "from-state RUNNING (ERR_SHIFT_NOT_RUNNING)"
        side_effects:
          - "suspend_reason = reason_code (WATER_LIMIT_BREACH on auto-suspend)"
          - "every LineRun of this shift in RUNNING -> PAUSED with auto_paused = true (cascade link 1)"
          - "every DeboningBatch of this shift in IN_PROGRESS -> ON_HOLD (cascade link 2)"
      - from: SUSPENDED
        to: RUNNING
        trigger: "POST /poultry/shifts/{id}/transition {to_status: RUNNING, resolution_note}"
        note: "Ambiguity pin: a transition request to RUNNING from a state that is neither SCHEDULED nor SUSPENDED is classified by payload — carrying resolution_note makes it a resume attempt (ERR_SHIFT_NOT_SUSPENDED); without resolution_note it is an open attempt (ERR_SHIFT_NOT_OPENABLE)"
        actor: ShiftSupervisor | QATechnician
        preconditions:
          - "from-state SUSPENDED (ERR_SHIFT_NOT_SUSPENDED)"
          - "resolution_note present, >= 10 chars (ERR_INVALID_REQUEST)"
          - "if suspend_reason == WATER_LIMIT_BREACH: actor must be QATechnician (ERR_INSUFFICIENT_PERMISSIONS) — regulatory water clearance"
        side_effects:
          - "every LineRun with auto_paused == true -> RUNNING, auto_paused reset false"
          - "suspend_reason = NONE"
          - "note: DeboningBatches in ON_HOLD stay ON_HOLD; they resume only via batch advance"
      - from: RUNNING
        to: CLOSED
        trigger: "POST /poultry/shifts/{id}/transition {to_status: CLOSED}"
        actor: ShiftSupervisor
        preconditions:
          - "from-state RUNNING or SUSPENDED (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "no LineRun of this shift in RUNNING or PAUSED (ERR_RUNS_NOT_TERMINAL)"
        side_effects:
          - "every LineRun in QUEUED -> CANCELLED (conditional cascade)"
          - "closed_at = logical clock now; labor_hours_remaining released (COMPLETED/SCHEDULED-batch accounting unchanged; CANCELLED batches release estimates)"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /poultry/shifts/{id}/transition {to_status: CLOSED}"
        actor: ShiftSupervisor
        preconditions:
          - "no LineRun of this shift in RUNNING or PAUSED (ERR_RUNS_NOT_TERMINAL)"
        side_effects:
          - "every LineRun in QUEUED -> CANCELLED"
          - "closed_at = logical clock now"

  - entity: SanitationRun
    initial_state: SCHEDULED
    terminal_states: [VERIFIED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /poultry/sanitation-runs/{id}/advance {to_status: IN_PROGRESS}"
        actor: SanitationLead
        preconditions:
          - "parent shift status in {SCHEDULED, SUSPENDED} — never during RUNNING production (ERR_INVALID_STATE_TRANSITION)"
          - "no LineRun of this shift+line in RUNNING (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /poultry/sanitation-runs/{id}/advance {to_status: COMPLETED}"
        actor: SanitationLead
        preconditions: []
        side_effects:
          - "completer_user_id = X-User-ID (segregation-of-duties anchor for pre-op)"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /poultry/sanitation-runs/{id}/advance {to_status: VERIFIED}"
        actor: QATechnician
        preconditions:
          - "from-state COMPLETED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "verifier_user_id = X-User-ID"
      - from: COMPLETED
        to: FAILED_RECHECK
        trigger: "POST /poultry/sanitation-runs/{id}/advance {to_status: FAILED_RECHECK}"
        actor: QATechnician
        preconditions: []
        side_effects:
          - "verifier_user_id = X-User-ID"
      - from: FAILED_RECHECK
        to: IN_PROGRESS
        trigger: "POST /poultry/sanitation-runs/{id}/advance {to_status: IN_PROGRESS}"
        actor: SanitationLead
        preconditions:
          - "parent shift status in {SCHEDULED, SUSPENDED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
        note: "re-wash cycle"

  - entity: PreOpInspection
    initial_state: PENDING
    terminal_states: [PASSED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /poultry/pre-op-inspections/{id}/advance {to_status: PASSED}"
        actor: QATechnician
        preconditions:
          - "at least one SanitationRun VERIFIED exists for (shift_id, line_id) (ERR_SANITATION_NOT_VERIFIED)"
          - "segregation of duties: X-User-ID != completer_user_id of every COMPLETED-or-later SanitationRun for (shift_id, line_id) (ERR_SOD_PREOP_SANITATION)"
        side_effects:
          - "inspector_user_id = X-User-ID"
      - from: PENDING
        to: FAILED
        trigger: "POST /poultry/pre-op-inspections/{id}/advance {to_status: FAILED, findings}"
        actor: QATechnician
        preconditions:
          - "findings present (ERR_INVALID_REQUEST)"
        side_effects:
          - "inspector_user_id = X-User-ID"
      - from: FAILED
        to: CORRECTING
        trigger: "POST /poultry/pre-op-inspections/{id}/advance {to_status: CORRECTING}"
        actor: SanitationLead | QATechnician
        preconditions: []
        side_effects: []
      - from: CORRECTING
        to: PENDING
        trigger: "POST /poultry/pre-op-inspections/{id}/advance {to_status: PENDING}"
        actor: QATechnician
        preconditions: []
        side_effects:
          - "cycle_count += 1 (re-inspection cycle)"

  - entity: LineSpeedWaiver
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /poultry/waivers/{id}/advance {to_status: SUBMITTED}"
        actor: PlantManager
        preconditions: []
        side_effects: []
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /poultry/waivers/{id}/advance {to_status: SUBMITTED}"
        actor: PlantManager
        preconditions: []
        side_effects: []
        note: "resubmission cycle after denial"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /poultry/waivers/{id}/advance {to_status: APPROVED}"
        actor: USDAInspector
        preconditions:
          - "logical clock now < effective_to (ERR_WAIVER_WINDOW_EXPIRED)"
          - "no other waiver for the same line in APPROVED or ACTIVE whose [effective_from, effective_to) half-open window intersects this one; touching endpoints (a.effective_to == b.effective_from) do NOT intersect (ERR_WAIVER_WINDOW_OVERLAP)"
        side_effects:
          - "approved_by = X-User-ID"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /poultry/waivers/{id}/advance {to_status: DENIED, reason}"
        actor: USDAInspector
        preconditions: []
        side_effects:
          - "denial_count += 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "system (evaluated on POST /_clock/set_current_utc and lazily on waiver/speed reads when logical clock >= effective_from and < effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "effective_max_line_speed for this line now uses this waiver's max_speed_bpm"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock >= effective_to, evaluated on clock-set and lazily on reads)"
        actor: system
        preconditions: []
        side_effects:
          - "effective speed recomputed for RUNNING runs of this line; runs above the new cap clamped and flagged speed_clamped = true"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /poultry/waivers/{id}/advance {to_status: REVOKED, reason}"
        actor: USDAInspector
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /poultry/waivers/{id}/advance {to_status: REVOKED, reason}"
        actor: USDAInspector
        preconditions: []
        side_effects:
          - "effective speed recomputed for RUNNING runs of this line; current_speed_bpm clamped down to the new effective cap where needed; speed_clamped = true on clamped runs"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new waiver created on the same line whose window overlaps this DRAFT/SUBMITTED waiver supersedes it)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (same supersede rule as DRAFT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FlockLot
    initial_state: BOOKED
    terminal_states: []
    transitions:
      - from: BOOKED
        to: RECEIVED
        trigger: "POST /poultry/flock-lots/{id}/receive"
        actor: ReceivingClerk
        preconditions:
          - "from-state BOOKED (ERR_FLOCK_LOT_NOT_RECEIVABLE)"
        side_effects:
          - "head_count_received, doa_count, total_live_weight_lb recorded"
      - from: RECEIVED
        to: ON_LINE
        trigger: "system (first LineRun of this lot enters RUNNING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_LINE
        to: CHILLED
        trigger: "system (evaluated on POST /_clock/set_current_utc and lazily on lot reads and batch creation: all of the lot's LineRuns in COMPLETED|RECONCILED|CANCELLED with at least one COMPLETED, AND logical clock >= max(completed_at over COMPLETED|RECONCILED runs) + LOT_CHILL_HOURS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHILLED
        to: SETTLED
        trigger: "POST /poultry/flock-lots/{id}/advance {to_status: SETTLED}"
        actor: ShiftSupervisor
        preconditions:
          - "from-state CHILLED or REOPENED (ERR_INVALID_STATE_TRANSITION)"
          - "all CondemnationRecords on this lot's runs are CERTIFIED, and at least one run is RECONCILED (ERR_LOT_NOT_SETTLABLE)"
        side_effects:
          - "certified_yield_pct computed (flock_yield_pct certified variant); settled_at = now"
      - from: REOPENED
        to: SETTLED
        trigger: "POST /poultry/flock-lots/{id}/advance {to_status: SETTLED}"
        actor: ShiftSupervisor
        preconditions:
          - "all CondemnationRecords on this lot's runs are CERTIFIED (ERR_LOT_NOT_SETTLABLE)"
        side_effects:
          - "certified_yield_pct recomputed; settled_at = now"
      - from: SETTLED
        to: REOPENED
        trigger: "POST /poultry/flock-lots/{id}/advance {to_status: REOPENED}"
        actor: USDAInspector
        preconditions:
          - "from-state SETTLED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
        note: "regrade cycle: while REOPENED, records may be disputed and recertified; certified_yield_pct recomputes on each certification change"

  - entity: LineRun
    initial_state: QUEUED
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /poultry/line-runs/{id}/advance {to_status: RUNNING}"
        actor: LineOperator
        preconditions:
          - "enclosing shift status == RUNNING (ERR_SHIFT_NOT_RUNNING)"
          - "flock lot status == RECEIVED or ON_LINE (ERR_RUN_NOT_STARTABLE)"
          - "planned_speed_bpm <= effective_max_line_speed(line, shift, now) (ERR_LINE_SPEED_NOT_AUTHORIZED)"
          - "at least one PreOpInspection PASSED and one SanitationRun VERIFIED for (shift,line) (ERR_PREOP_NOT_PASSED / ERR_SANITATION_NOT_VERIFIED)"
        side_effects:
          - "current_speed_bpm = planned_speed_bpm; started_at = now"
          - "if first running run of the lot: lot RECEIVED -> ON_LINE (bubble up)"
      - from: RUNNING
        to: PAUSED
        trigger: "system (shift RUNNING -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "auto_paused = true"
      - from: PAUSED
        to: RUNNING
        trigger: "system (shift SUSPENDED -> RUNNING)"
        actor: system
        preconditions:
          - "auto_paused == true"
        side_effects:
          - "auto_paused = false"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /poultry/line-runs/{id}/advance {to_status: COMPLETED, birds_hung, carcass_weight_lb}"
        actor: LineOperator
        preconditions:
          - "from-state RUNNING (ERR_INVALID_STATE_TRANSITION)"
          - "birds_hung > 0 and carcass_weight_lb > 0 (ERR_INVALID_REQUEST)"
          - "birds_hung <= lot.head_count_received - lot.doa_count - lot.birds_hung_total (ERR_CONDEMNATION_COUNT_EXCEEDS_HUNG)"
        side_effects:
          - "completed_at = now; lot.birds_hung_total, lot.carcass_weight_total_lb, shift.birds_processed, shift.chilled_weight_lb updated"
          - "lot.provisional_yield_pct recomputed (flock_yield_pct provisional variant)"
          - "shift water rates recomputed; if water_rate_birds_basis now exceeds limit, no auto-suspend (breach is evaluated on readings, not completions)"
      - from: COMPLETED
        to: RECONCILED
        trigger: "system (all CondemnationRecords of this run are CERTIFIED; evaluated on each certification)"
        actor: system
        preconditions:
          - "every CondemnationRecord of the run in CERTIFIED (zero records satisfies this vacuously at next certification event; a run with zero records is reconciled by an explicit certification event on the run only — see note)"
        side_effects:
          - "run totals roll up to lot certified aggregates"
        note: "a run with zero condemnation records is reconciled automatically at completion (no certification events will ever occur)"
      - from: QUEUED
        to: CANCELLED
        trigger: "system (shift close)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CondemnationRecord
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /poultry/condemnation-records/{id}/advance {to_status: CERTIFIED}"
        actor: USDAInspector
        preconditions:
          - "segregation of duties: X-User-ID != recorded_by_user_id (ERR_SOD_CONDEMNATION_SELF_CERTIFY)"
          - "certification gate: sum(effective_count over the run's CERTIFIED records) + this record's effective_count <= run.birds_hung (equality allowed; DRAFT/DISPUTED records do not participate) (ERR_CONDEMNATION_COUNT_EXCEEDS_HUNG)"
        side_effects:
          - "certified_by_user_id = X-User-ID (cascade link 1: run condemned_accounted updated)"
          - "cascade link 2: if all records of the run now CERTIFIED, run COMPLETED -> RECONCILED"
          - "cascade link 3: if lot SETTLED or REOPENED, lot.certified_yield_pct recomputed"
          - "cascade link 4: on certified_yield_pct decrease, FinishedLots of this lot in TRACE_LOCKED with routing_status FRESH whose order is FLEXIBLE flip FRESH -> FROZEN when certified_yield_pct < FRESH_YIELD_THRESHOLD_PCT"
      - from: DISPUTED
        to: CERTIFIED
        trigger: "POST /poultry/condemnation-records/{id}/advance {to_status: CERTIFIED, amended_carcass_count?}"
        actor: USDAInspector
        preconditions:
          - "segregation of duties: X-User-ID != recorded_by_user_id (ERR_SOD_CONDEMNATION_SELF_CERTIFY)"
          - "run condemned_accounted + effective_count (after amendment) <= run.birds_hung (ERR_CONDEMNATION_COUNT_EXCEEDS_HUNG)"
        side_effects:
          - "same cascade chain as DRAFT -> CERTIFIED"
      - from: CERTIFIED
        to: DISPUTED
        trigger: "POST /poultry/condemnation-records/{id}/advance {to_status: DISPUTED, reason}"
        actor: PlantManager
        preconditions:
          - "reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "compensating bookkeeping: DISPUTED records are excluded from condemned_accounted; run.carcasses_to_chill rises by effective_count; run RECONCILED -> stays RECONCILED (state retained); lot aggregates recomputed"

  - entity: ProductOrder
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    note: "parallel dimensions: fulfillment_status (PENDING -> IN_PRODUCTION -> FULFILLED | CANCELLED) and allocation_status (UNALLOCATED -> PARTIALLY_ALLOCATED -> ALLOCATED) evolve independently on the same row"
    transitions:
      - from: PENDING
        to: IN_PRODUCTION
        trigger: "system (first DeboningBatch of this order enters IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "system (sum of net_weight_lb over the order's SHIPPED finished lots >= pounds_ordered, evaluated on each ship)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /poultry/orders/{id}/cancel"
        actor: OrderPlanner
        preconditions:
          - "no batch of this order in IN_PROGRESS or ON_HOLD (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "every SCHEDULED batch of this order -> CANCELLED (cascade down), releasing estimated_labor_hours back to the shift"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /poultry/orders/{id}/cancel"
        actor: OrderPlanner
        preconditions:
          - "no batch of this order in IN_PROGRESS or ON_HOLD (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "every SCHEDULED batch of this order -> CANCELLED, releasing estimated_labor_hours"

  - entity: DeboningBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /poultry/deboning-batches/{id}/advance {to_status: IN_PROGRESS}"
        actor: LineOperator
        preconditions:
          - "enclosing shift status == RUNNING (ERR_SHIFT_NOT_RUNNING)"
          - "flock lot status == CHILLED or SETTLED or REOPENED (ERR_LOT_NOT_CHILLED)"
        side_effects:
          - "if order fulfillment_status == PENDING: order -> IN_PRODUCTION (bubble up)"
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /poultry/deboning-batches/{id}/advance {to_status: ON_HOLD} OR system (shift suspension)"
        actor: LineOperator | system
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /poultry/deboning-batches/{id}/advance {to_status: IN_PROGRESS}"
        actor: LineOperator
        preconditions:
          - "enclosing shift status == RUNNING (ERR_SHIFT_NOT_RUNNING)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /poultry/deboning-batches/{id}/advance {to_status: COMPLETED, actual_output_weight_lb, actual_labor_hours}"
        actor: LineOperator
        preconditions:
          - "from-state IN_PROGRESS (ERR_BATCH_NOT_ADVANCEABLE)"
          - "actual_output_weight_lb > 0 and actual_labor_hours > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "net_weight_lb computed (order_fill_weight per-batch rounding)"
          - "creates FinishedLot (status OPEN, routing UNROUTED, trace_code computed) — cascade-created child, discoverable via GET /poultry/finished-lots?deboning_batch_id="
          - "order.filled_lb and allocation_status recomputed"
          - "shift labor ledger: estimated released, actual debited"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /poultry/deboning-batches/{id}/advance {to_status: CANCELLED} OR system (order cancel cascade)"
        actor: LineOperator | system
        preconditions: []
        side_effects:
          - "compensation: estimated_labor_hours released back to shift.labor_hours_remaining (labor invariant)"

  - entity: FinishedLot
    initial_state: OPEN
    terminal_states: [SHIPPED, RECALLED]
    transitions:
      - from: OPEN
        to: TRACE_LOCKED
        trigger: "POST /poultry/finished-lots/{id}/trace-lock"
        actor: QATechnician
        preconditions:
          - "every CondemnationRecord on the source flock lot's runs is CERTIFIED (ERR_TRACE_LOCK_BLOCKED_UNCERTIFIED)"
          - "if order.temperature_requirement == FRESH: shift.chiller_limit_breached must be false (ERR_CHILLER_LIMIT_FRESH_BLOCKED — regulatory safety, checked first)"
          - "if order.temperature_requirement == FRESH: chill compliance must hold (ERR_CHILL_NOT_COMPLIANT)"
        side_effects:
          - "routing_status set by routing_decision calculation (FRESH | FROZEN); locked_at = now"
      - from: TRACE_LOCKED
        to: SHIPPED
        trigger: "POST /poultry/finished-lots/{id}/advance {to_status: SHIPPED}"
        actor: ShiftSupervisor
        preconditions: []
        side_effects:
          - "shipped_at = now; order fulfillment re-evaluated (-> FULFILLED when shipped net >= pounds_ordered)"
      - from: TRACE_LOCKED
        to: RECALLED
        trigger: "POST /poultry/finished-lots/{id}/advance {to_status: RECALLED, reason}"
        actor: QATechnician | USDAInspector
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: RECALLED
        trigger: "POST /poultry/finished-lots/{id}/advance {to_status: RECALLED, reason}"
        actor: QATechnician | USDAInspector
        preconditions: []
        side_effects: []

  - entity: ProcessingLine
    initial_state: null
    terminal_states: []
    transitions: []
    note: "configuration entity; no lifecycle. Waiver windows and run/batch schedules are the temporal resources attached to a line."

  - entity: UtilityMeterReading
    initial_state: null
    terminal_states: []
    transitions: []
    note: "append-only event; posting one re-evaluates water_rate_birds_basis and may auto-suspend the shift (RUNNING -> SUSPENDED with WATER_LIMIT_BREACH) including its run-pause and batch-hold cascade."

  - entity: ChillChainLog
    initial_state: null
    terminal_states: []
    transitions: []
    note: "append-only event feeding chill compliance inside routing_decision."

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: shift-staffing-stale-version
    parent_entity: ProductionShift
    write_endpoint: "POST /poultry/shifts/{id}/staffing"
    occ_field: expected_shift_version
    description: |
      A staffing update submitted against a ProductionShift whose version has
      advanced since the client last observed it is rejected. The shift's
      staffing fields feed effective_max_line_speed and the water/projection
      denominators, so a writer holding a stale view of the shift must re-read
      before writing. Stated in OCC terms: expected_shift_version must equal
      the shift's current version.
    error_id: ERR_STALE_SHIFT_VERSION
    http_status: 412

  - rule_id: order-amend-stale-version
    parent_entity: ProductOrder
    write_endpoint: "PUT /poultry/orders/{id}"
    occ_field: expected_order_version
    description: |
      Amending a ProductOrder whose version has advanced since the client last
      observed it is rejected; the client must re-read the order. Two
      sequential amendments each legitimately succeed under product semantics,
      so the second is rejected purely on the stale version.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: waiver-create-supersede-stale-line
    parent_entity: ProcessingLine
    write_endpoint: "POST /poultry/lines/{id}/waivers"
    occ_field: expected_line_version
    description: |
      Creating a waiver on a ProcessingLine whose version has advanced since
      the client last observed it is rejected. Waiver creation legitimately
      supersedes a prior DRAFT/SUBMITTED waiver with an overlapping window on
      the same line (which bumps the line version), so a creator holding a
      stale line version must re-read before creating.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_max_line_speed
    description: "Maximum authorized speed (bpm) for a run on a line within a shift, combining line rating, regulatory base cap, ACTIVE waiver cap, and staffing band."
    trigger: "LineRun creation, set-speed, run start, waiver activation/expiry/revocation, staffing update"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (breaks the circular-looking speed <-> staffing dependency):
      (1) REQUIRED_AT_RATED is a FIXED table keyed on line.line_type only — it never
          depends on current or requested speed:
            EVISCERATION: {shacklers: 10, eviscerators: 20, qa_techs: 2}
            DEBONING:     {deboners: 12, qa_techs: 1}
      (2) staffing_ratio = min over the required positions of (present / required),
          using the shift's staffing fields; positions with required headcount present
          in the table but zero present count as 0.
      (3) staffing_cap: ratio >= 1.0  -> floor(line.rated_speed_bpm * 1.0)
                        0.9 <= ratio < 1.0 -> floor(line.rated_speed_bpm * 0.9)
                        ratio < 0.9   -> REGULATORY_BASE_CAP_BPM[line_type] (waiver void)
      (4) regulatory_cap = max_speed_bpm of the line's waiver in ACTIVE status whose
          [effective_from, effective_to) covers now, else REGULATORY_BASE_CAP_BPM[line_type].
          If several ACTIVE waivers cover now (should be impossible after overlap check),
          the one with the LATEST effective_from wins; tie-break: latest created_at.
      (5) effective_max_line_speed = min(line.rated_speed_bpm, regulatory_cap, staffing_cap)
      set-speed validation: new_speed_bpm <= effective_max_line_speed (equality allowed).
    constants:
      REGULATORY_BASE_CAP_BPM: { EVISCERATION: 175, DEBONING: 45 }
      STAFFING_BAND_FULL: 1.0
      STAFFING_BAND_REDUCED: 0.9
      REDUCED_BAND_SPEED_FACTOR: 0.9
    precision: "integer bpm; floor for staffing_cap"
    variants:
      - name: waiver_active
        when: "an ACTIVE waiver covers now for the line"
        difference: "regulatory_cap = waiver.max_speed_bpm (e.g. 195 vs base 175)"
      - name: no_waiver
        when: "no ACTIVE waiver covers now"
        difference: "regulatory_cap = REGULATORY_BASE_CAP_BPM"

  - name: flock_yield_pct
    description: "Evisceration/chilling yield of a flock lot, in two divergent variants over the same recorded data."
    trigger: "provisional: run completion and any condemnation create/dispute/recertify; certified: lot settle and any later certification change while SETTLED|REOPENED"
    algorithm: aggregation
    formula: |
      Shared inputs (runs in COMPLETED|RECONCILED only):
        H = lot.birds_hung_total; W = lot.carcass_weight_total_lb
        L = lot.total_live_weight_lb; N = lot.head_count_received
        avg_live = L / N
        avg_carcass = W / H (null-safe: variant undefined while H == 0)
        P = sum(effective_count over records in DRAFT or DISPUTED)
        C = sum(effective_count over records in CERTIFIED)
      provisional_yield_pct = round_half_up( (H - P) * (avg_live * 0.88) / L * 100, 2 )
      certified_yield_pct   = round_half_up( (W - C * avg_carcass) / L * 100, 2 )
    constants:
      EVISCERATED_BASIS_ALLOWANCE: 0.88
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "at run completion and while condemnations are uncertified"
        difference: "eviscerated-basis estimate using 0.88 allowance and provisional (DRAFT|DISPUTED) condemnation counts"
      - name: certified
        when: "at lot settle and on later certification changes"
        difference: "live-basis actual using measured carcass weight and CERTIFIED counts only; same data, different result from provisional"

  - name: shift_water_intensity
    description: "Regulatory water usage intensity of a shift; two denominators (per 1000 birds vs per 100 lb chilled weight) can disagree on compliance for identical readings."
    trigger: "UtilityMeterReading posted; birds_processed/chilled_weight_lb change (run completion)"
    algorithm: threshold
    formula: |
      birds_basis  = process_water_gallons * 1000 / birds_processed   (null while birds_processed == 0)
      weight_basis = process_water_gallons * 100  / chilled_weight_lb (null while chilled_weight_lb == 0)
      Breach rule (operational, birds_basis only): water_breach_active = (birds_basis > WATER_LIMIT_GAL_PER_1000_BIRDS)
        — STRICTLY greater; a rate exactly equal to the limit is compliant.
      Chiller rule: chiller_limit_breached = (chiller_water_gallons * 1000 / birds_processed > CHILLER_LIMIT_GAL_PER_1000_BIRDS)
      Breach evaluation happens on reading posts (and lazily on reads); run completions recompute
      the denominators but do NOT themselves suspend the shift.
      Auto-suspend: a PROCESS_WATER reading that flips water_breach_active false->true while the
      shift is RUNNING triggers RUNNING -> SUSPENDED (reason WATER_LIMIT_BREACH) with the
      run-pause / batch-hold cascade.
    input_set: "UtilityMeterReadings of the shift filtered by meter_type; runs in COMPLETED|RECONCILED for denominators"
    constants:
      WATER_LIMIT_GAL_PER_1000_BIRDS: 1500.0
      WATER_LIMIT_GAL_PER_100LB: 200.0
      CHILLER_LIMIT_GAL_PER_1000_BIRDS: 800.0
    precision: "2 decimal places, round_half_up, for reported rates; breach compares the unrounded rate"
    variants:
      - name: birds_basis
        when: "operational compliance and auto-suspend"
        difference: "denominator birds_processed; limit 1500.0 gal/1000 birds"
      - name: weight_basis
        when: "permit reporting"
        difference: "denominator chilled_weight_lb; limit 200.0 gal/100 lb; identical readings can be breaching on birds_basis and compliant on weight_basis"

  - name: order_fill_weight
    description: "Order fulfillment quantity with pinned per-batch rounding."
    trigger: "DeboningBatch completion; order read of filled_lb/allocation_status"
    algorithm: aggregation
    formula: |
      Per batch: net_weight_lb = round_half_up(actual_output_weight_lb * (1 - TRIM_ALLOWANCE_PCT), 2)
      Order: filled_lb = sum of net_weight_lb over the order's COMPLETED batches.
      PINNED ROUNDING ORDER: round each batch first, THEN sum. (Summing raw outputs and
      rounding once is the rejected alternative and yields different cents.)
      allocation_status: filled_lb == 0 -> UNALLOCATED; 0 < filled_lb < pounds_ordered ->
      PARTIALLY_ALLOCATED; filled_lb >= pounds_ordered -> ALLOCATED (equality allocates).
    input_set: "batches of the order in COMPLETED status"
    constants:
      TRIM_ALLOWANCE_PCT: 0.02
    precision: "2 decimal places, round_half_up, applied per batch"

  - name: routing_decision
    description: "Fresh-vs-frozen routing of a FinishedLot at trace-lock, chaining certified yield, chill compliance, and the chiller water limit."
    trigger: "POST /poultry/finished-lots/{id}/trace-lock; re-evaluated (flip FRESH->FROZEN only) on certified_yield_pct recompute"
    algorithm: threshold
    formula: |
      source_run_completed_at = max(completed_at over the source flock lot's runs in
        COMPLETED|RECONCILED); tie-break: latest created_at.
      chill_compliant = exists ChillChainLog of this finished lot with temperature_c <= 4.0
        and recorded_at <= source_run_completed_at + 8h, AND now >= source_run_completed_at + 2h.
      Decision at trace-lock:
        order.temperature_requirement == FRESH:
          chiller_limit_breached -> reject ERR_CHILLER_LIMIT_FRESH_BLOCKED (regulatory, first)
          not chill_compliant   -> reject ERR_CHILL_NOT_COMPLIANT
          else routing_status = FRESH
        FROZEN: routing_status = FROZEN
        FLEXIBLE: if (not chill_compliant) or chiller_limit_breached -> FROZEN
                  elif flock_lot.certified_yield_pct >= FRESH_YIELD_THRESHOLD_PCT -> FRESH
                  else -> FROZEN (yield exactly at the threshold routes FRESH)
      Post-lock flip: when certified_yield_pct is recomputed lower, TRACE_LOCKED lots of that
      flock lot with routing_status FRESH on FLEXIBLE orders flip to FROZEN if the new
      certified_yield_pct < FRESH_YIELD_THRESHOLD_PCT. Never flips FROZEN->FRESH; never
      touches SHIPPED or RECALLED lots.
    input_set: "ChillChainLogs of the finished lot; source flock lot runs in COMPLETED|RECONCILED; the shift's chiller_limit_breached flag; lot certified_yield_pct"
    constants:
      CHILL_TARGET_TEMP_C: 4.0
      CHILL_DEADLINE_HOURS: 8
      MIN_CHILL_HOURS: 2
      FRESH_YIELD_THRESHOLD_PCT: 72.0
      LOT_CHILL_HOURS: 4
    precision: "temperature compared at 1 decimal; times compared at second precision"

  - name: labor_budget_balance
    description: "Shift deboning labor ledger with a compensating invariant."
    trigger: "batch create (debit estimate), batch complete (swap estimate for actual), batch cancel (release estimate), order cancel cascade"
    algorithm: aggregation
    formula: |
      estimated_labor_hours = round_half_up(input_weight_lb / 500.0, 2)
      labor_hours_remaining = labor_hours_budget
        - sum(estimated_labor_hours over batches of the shift in SCHEDULED|IN_PROGRESS|ON_HOLD)
        - sum(actual_labor_hours over batches of the shift in COMPLETED)
      Creation gate: estimated_labor_hours <= labor_hours_remaining else ERR_LABOR_BUDGET_EXCEEDED.
      INVARIANT (labor hours conserved): create followed by cancel of the same SCHEDULED
      batch leaves labor_hours_remaining exactly unchanged.
    input_set: "batches of the shift by status as above"
    constants:
      POUNDS_PER_LABOR_HOUR: 500.0
    precision: "2 decimal places, round_half_up"

  - name: bird_accountability
    description: "Per-run bird-count conservation across condemnation certify/dispute pairs."
    trigger: "condemnation create/certify/dispute/recertify; run completion"
    algorithm: aggregation
    formula: |
      run_condemned = sum(effective_count over the run's records in DRAFT|CERTIFIED)  (DISPUTED excluded)
      carcasses_to_chill = birds_hung - run_condemned  (lot level: birds_hung_total - condemned_accounted)
      Certification gate: (sum of effective_count over the run's CERTIFIED records, including
        the record being certified at its new effective_count) <= birds_hung; equality allowed,
        else ERR_CONDEMNATION_COUNT_EXCEEDS_HUNG. DRAFT and DISPUTED records do not participate
        in the gate (they only feed condemned_accounted for provisional reporting).
      INVARIANT (bird count conserved): certify (+N) then dispute (-N) of the same record
      leaves carcasses_to_chill exactly unchanged; birds_hung == run_condemned + carcasses_to_chill at all times.
    input_set: "condemnation records of the run in DRAFT|CERTIFIED"
    precision: "integer carcasses"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role permitted for this operation, including per-action role splits on advance/transition endpoints (e.g. waiver APPROVED requires USDAInspector; water-breach resume requires QATechnician)", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path and body-referenced resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 3.5, category: state, check: "OCC: expected_<parent>_version equals the parent entity's current version, BEFORE any business validation", error_id: "ERR_STALE_SHIFT_VERSION / ERR_STALE_ORDER_VERSION / ERR_STALE_LINE_VERSION", http_status: 412, applies_to: "POST /poultry/shifts/{id}/staffing, PUT /poultry/orders/{id}, POST /poultry/lines/{id}/waivers" }
  - { priority: 4, category: state, check: "Target entity's own state-machine from-state, AND the enclosing ProductionShift's status where the operation executes inside a shift (e.g. set-speed/start require shift RUNNING -> ERR_SHIFT_NOT_RUNNING; terminal shift -> ERR_SHIFT_TERMINAL; machine-specific errors ERR_SHIFT_NOT_OPENABLE, ERR_SHIFT_NOT_SUSPENDED, ERR_FLOCK_LOT_NOT_RECEIVABLE, ERR_BATCH_NOT_ADVANCEABLE, ERR_ORDER_NOT_AMENDABLE, else ERR_INVALID_STATE_TRANSITION)", error_id: "ERR_SHIFT_NOT_RUNNING et al.", http_status: 409, applies_to: "state-changing endpoints" }
  - { priority: 5, category: business_safety, check: "Regulatory/safety gates: line speed authorized (waiver+staffing cap), segregation of duties (pre-op vs sanitation completer; condemnation recorder vs certifier), chiller-limit fresh block", error_id: "ERR_LINE_SPEED_NOT_AUTHORIZED / ERR_SOD_PREOP_SANITATION / ERR_SOD_CONDEMNATION_SELF_CERTIFY / ERR_CHILLER_LIMIT_FRESH_BLOCKED", http_status: 403, applies_to: "set-speed, run start, pre-op advance, condemnation advance, trace-lock" }
  - { priority: 6, category: business_referential, check: "Linked-entity consistency: run line is EVISCERATION / batch line is DEBONING (ERR_LINE_TYPE_MISMATCH); run lot.receiving_shift_id == run.shift_id (ERR_LOT_SHIFT_MISMATCH); lot RECEIVED for run start (ERR_RUN_NOT_STARTABLE); lot CHILLED+ for batch start (ERR_LOT_NOT_CHILLED); all records CERTIFIED for settle/trace-lock (ERR_LOT_NOT_SETTLABLE / ERR_TRACE_LOCK_BLOCKED_UNCERTIFIED); open-production gates (ERR_PREOP_NOT_PASSED, ERR_SANITATION_NOT_VERIFIED, ERR_NO_RUNS_QUEUED, ERR_RUNS_NOT_TERMINAL); order cancel with active batches (ERR_ORDER_NOT_CANCELLABLE)", error_id: "ERR_LINE_TYPE_MISMATCH et al.", http_status: 409, applies_to: "creation and transition endpoints with cross-entity gates" }
  - { priority: 7, category: business_temporal, check: "Time-window rules vs logical clock: batch create after order due_at (ERR_ORDER_WINDOW_CLOSED); waiver approve with expired window (ERR_WAIVER_WINDOW_EXPIRED); chill compliance window at trace-lock (ERR_CHILL_NOT_COMPLIANT)", error_id: "ERR_ORDER_WINDOW_CLOSED / ERR_WAIVER_WINDOW_EXPIRED / ERR_CHILL_NOT_COMPLIANT", http_status: 409, applies_to: "batch create, waiver approve, trace-lock" }
  - { priority: 8, category: business_constraint, check: "Capacity/overlap/accountability constraints: shift shackle capacity on flock booking (ERR_SHIFT_CAPACITY_EXCEEDED, equality allowed); waiver window overlap at approve (ERR_WAIVER_WINDOW_OVERLAP, half-open adjacency allowed); condemnation counts within birds hung (ERR_CONDEMNATION_COUNT_EXCEEDS_HUNG, equality allowed)", error_id: "ERR_SHIFT_CAPACITY_EXCEEDED / ERR_WAIVER_WINDOW_OVERLAP / ERR_CONDEMNATION_COUNT_EXCEEDS_HUNG", http_status: 422, applies_to: "flock create, waiver approve, condemnation advance, run complete" }
  - { priority: 9, category: business_fiscal, check: "Labor budget: estimated_labor_hours <= shift.labor_hours_remaining at batch creation", error_id: ERR_LABOR_BUDGET_EXCEEDED, http_status: 402, applies_to: "POST /poultry/deboning-batches" }

# =============================================================================
# Section 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Processing lines ---
  - { method: POST, path: "/poultry/lines", description: "Register a processing line", roles: [PlantManager], code: 201, input: [line_code, line_type, rated_speed_bpm], output: ProcessingLine, side_effects: [] }
  - { method: GET, path: "/poultry/lines/{id}", description: "Get a processing line", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: ProcessingLine, side_effects: [] }
  - { method: GET, path: "/poultry/lines/{id}/waivers", description: "List waivers of a line (FK reverse reachability)", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: "LineSpeedWaiver[]", side_effects: [] }
  - { method: GET, path: "/poultry/lines/{id}/sanitation-runs", description: "List sanitation runs of a line", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: "SanitationRun[]", side_effects: [] }
  - { method: GET, path: "/poultry/lines/{id}/pre-op-inspections", description: "List pre-op inspections of a line", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: "PreOpInspection[]", side_effects: [] }
  - { method: POST, path: "/poultry/lines/{id}/waivers", description: "Create a line-speed waiver (DRAFT). Supersedes any DRAFT/SUBMITTED waiver on the same line with an overlapping window. OCC on the line version.", roles: [PlantManager], code: 201, input: [max_speed_bpm, effective_from, effective_to, expected_line_version], output: LineSpeedWaiver, side_effects: ["increments ProcessingLine.version by 1", "overlapping DRAFT/SUBMITTED waivers of the line -> SUPERSEDED"] }

  # --- Production shifts ---
  - { method: POST, path: "/poultry/shifts", description: "Create a production shift (SCHEDULED; staffing counts start at 0)", roles: [PlantManager], code: 201, input: [shift_date, shift_code, shackle_capacity_birds, labor_hours_budget], output: ProductionShift, side_effects: [] }
  - { method: GET, path: "/poultry/shifts/{id}", description: "Get a shift including computed water rates, labor balance, staffing", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: ProductionShift, side_effects: [] }
  - { method: POST, path: "/poultry/shifts/{id}/staffing", description: "Set shift staffing counts (OCC on shift version)", roles: [ShiftSupervisor], code: 200, input: [shacklers_present, eviscerators_present, deboners_present, qa_techs_present, expected_shift_version], output: ProductionShift, side_effects: ["increments ProductionShift.version by 1", "recompute effective_max_line_speed for RUNNING runs of the shift; clamp current_speed_bpm down where above the new cap and set speed_clamped = true"] }
  - { method: POST, path: "/poultry/shifts/{id}/transition", description: "Shift lifecycle: to_status RUNNING (open or resume), SUSPENDED (manual), CLOSED. Resume from WATER_LIMIT_BREACH requires QATechnician and resolution_note >= 10 chars.", roles: [ShiftSupervisor, QATechnician, USDAInspector], code: 200, input: [to_status, "reason_code?", "resolution_note?"], output: ProductionShift, side_effects: ["state machine side effects incl. run PAUSE/resume cascade and batch hold cascade", "increments ProductionShift.version by 1"] }
  - { method: GET, path: "/poultry/shifts/{id}/sanitation-runs", description: "List sanitation runs of a shift", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: "SanitationRun[]", side_effects: [] }
  - { method: GET, path: "/poultry/shifts/{id}/pre-op-inspections", description: "List pre-op inspections of a shift", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: "PreOpInspection[]", side_effects: [] }
  - { method: GET, path: "/poultry/shifts/{id}/flock-lots", description: "List flock lots booked into a shift", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: "FlockLot[]", side_effects: [] }
  - { method: GET, path: "/poultry/shifts/{id}/utility-readings", description: "List utility meter readings of a shift", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: ["meter_type?"], output: "UtilityMeterReading[]", side_effects: [] }

  # --- Sanitation runs ---
  - { method: POST, path: "/poultry/sanitation-runs", description: "Schedule a sanitation run for a shift+line", roles: [SanitationLead], code: 201, input: [shift_id, line_id, window_start, window_end], output: SanitationRun, side_effects: [] }
  - { method: GET, path: "/poultry/sanitation-runs/{id}", description: "Get a sanitation run", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: SanitationRun, side_effects: [] }
  - { method: POST, path: "/poultry/sanitation-runs/{id}/advance", description: "Sanitation lifecycle: IN_PROGRESS and COMPLETED by SanitationLead; VERIFIED and FAILED_RECHECK by QATechnician", roles: [SanitationLead, QATechnician], code: 200, input: [to_status], output: SanitationRun, side_effects: ["completer_user_id / verifier_user_id recorded"] }

  # --- Pre-op inspections ---
  - { method: POST, path: "/poultry/pre-op-inspections", description: "Create a pre-operational inspection (PENDING) for a shift+line", roles: [QATechnician], code: 201, input: [shift_id, line_id], output: PreOpInspection, side_effects: [] }
  - { method: GET, path: "/poultry/pre-op-inspections/{id}", description: "Get a pre-op inspection", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: PreOpInspection, side_effects: [] }
  - { method: POST, path: "/poultry/pre-op-inspections/{id}/advance", description: "Pre-op lifecycle: PASSED/FAILED/PENDING by QATechnician (SoD vs sanitation completer on PASSED); CORRECTING by SanitationLead or QATechnician", roles: [QATechnician, SanitationLead], code: 200, input: [to_status, "findings?"], output: PreOpInspection, side_effects: ["cycle_count increments on CORRECTING -> PENDING"] }

  # --- Line-speed waivers ---
  - { method: GET, path: "/poultry/waivers/{id}", description: "Get a waiver", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: LineSpeedWaiver, side_effects: [] }
  - { method: POST, path: "/poultry/waivers/{id}/advance", description: "Waiver lifecycle: SUBMITTED by PlantManager (also DENIED -> SUBMITTED resubmission); APPROVED/DENIED/REVOKED by USDAInspector", roles: [PlantManager, USDAInspector], code: 200, input: [to_status, "reason?"], output: LineSpeedWaiver, side_effects: ["on APPROVED: overlap + window-expiry checks", "on REVOKED from ACTIVE: RUNNING runs of the line clamp to recomputed cap, speed_clamped = true"] }

  # --- Flock lots (live receiving) ---
  - { method: POST, path: "/poultry/flock-lots", description: "Book a flock lot into a shift (capacity check: sum of booked_head_count over all lots of the shift + new <= shackle_capacity_birds; equality allowed)", roles: [ReceivingClerk], code: 201, input: [lot_code, grower_name, booked_head_count, expected_avg_live_weight_lb, receiving_shift_id], output: FlockLot, side_effects: [] }
  - { method: GET, path: "/poultry/flock-lots/{id}", description: "Get a flock lot including yields and accountability fields", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: FlockLot, side_effects: [] }
  - { method: POST, path: "/poultry/flock-lots/{id}/receive", description: "Receive a booked lot: record head count, DOA, live weight (BOOKED -> RECEIVED)", roles: [ReceivingClerk], code: 200, input: [head_count_received, doa_count, total_live_weight_lb], output: FlockLot, side_effects: [] }
  - { method: POST, path: "/poultry/flock-lots/{id}/advance", description: "Lot lifecycle: SETTLED by ShiftSupervisor (yield certification); REOPENED by USDAInspector (regrade cycle)", roles: [ShiftSupervisor, USDAInspector], code: 200, input: [to_status], output: FlockLot, side_effects: ["SETTLED: certified_yield_pct (re)computed", "REOPENED: enables dispute/recertify cycle"] }

  # --- Line runs (evisceration/chilling) ---
  - { method: POST, path: "/poultry/line-runs", description: "Queue a flock lot onto an EVISCERATION line within a shift; planned speed must be within effective cap", roles: [ShiftSupervisor], code: 201, input: [shift_id, line_id, flock_lot_id, planned_speed_bpm], output: LineRun, side_effects: [] }
  - { method: GET, path: "/poultry/line-runs", description: "List line runs with filters (FK reverse reachability) and pagination", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: ["shift_id?", "line_id?", "flock_lot_id?", "limit?", "offset?"], output: "LineRun[]", side_effects: [] }
  - { method: GET, path: "/poultry/line-runs/{id}", description: "Get a line run", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: LineRun, side_effects: [] }
  - { method: POST, path: "/poultry/line-runs/{id}/set-speed", description: "Change current speed of a RUNNING run; new_speed_bpm <= effective_max_line_speed (equality allowed)", roles: [LineOperator], code: 200, input: [new_speed_bpm], output: LineRun, side_effects: ["current_speed_bpm updated; speed_clamped reset to false"] }
  - { method: POST, path: "/poultry/line-runs/{id}/advance", description: "Run lifecycle: RUNNING (start) or COMPLETED (with birds_hung, carcass_weight_lb)", roles: [LineOperator], code: 200, input: [to_status, "birds_hung?", "carcass_weight_lb?"], output: LineRun, side_effects: ["start: lot RECEIVED -> ON_LINE", "complete: aggregates + provisional yield recompute"] }
  - { method: GET, path: "/poultry/line-runs/{id}/condemnation-records", description: "List condemnation records of a run", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: "CondemnationRecord[]", side_effects: [] }

  # --- Condemnation records ---
  - { method: POST, path: "/poultry/condemnation-records", description: "Record condemnation coding for a COMPLETED/RECONCILED run (DRAFT)", roles: [QATechnician], code: 201, input: [line_run_id, condemnation_code, carcass_count], output: CondemnationRecord, side_effects: ["run/lot condemned aggregates recomputed (DRAFT counts toward provisional yield)"] }
  - { method: GET, path: "/poultry/condemnation-records/{id}", description: "Get a condemnation record", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: CondemnationRecord, side_effects: [] }
  - { method: POST, path: "/poultry/condemnation-records/{id}/advance", description: "CERTIFIED by USDAInspector (SoD vs recorder; optional amended_carcass_count on recertify); DISPUTED by PlantManager (reason required)", roles: [USDAInspector, PlantManager], code: 200, input: [to_status, "amended_carcass_count?", "reason?"], output: CondemnationRecord, side_effects: ["certification cascade: run totals -> run auto-reconcile -> lot certified yield -> FRESH->FROZEN routing flip on TRACE_LOCKED lots of FLEXIBLE orders"] }

  # --- Utility readings ---
  - { method: POST, path: "/poultry/utility-readings", description: "Post an incremental water/chiller meter reading; may auto-suspend the shift on breach", roles: [QATechnician], code: 201, input: [shift_id, meter_type, gallons], output: UtilityMeterReading, side_effects: ["shift water aggregates recomputed", "on birds-basis breach while RUNNING: shift -> SUSPENDED (WATER_LIMIT_BREACH), runs -> PAUSED, batches -> ON_HOLD"] }

  # --- Product orders ---
  - { method: POST, path: "/poultry/orders", description: "Create a customer order (PENDING / UNALLOCATED)", roles: [OrderPlanner], code: 201, input: [customer_name, product_code, pounds_ordered, temperature_requirement, due_at], output: ProductOrder, side_effects: [] }
  - { method: GET, path: "/poultry/orders/{id}", description: "Get an order including filled_lb and both status dimensions", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: ProductOrder, side_effects: [] }
  - { method: PUT, path: "/poultry/orders/{id}", description: "Amend an order while fulfillment_status == PENDING (OCC on order version)", roles: [OrderPlanner], code: 200, input: ["pounds_ordered?", "due_at?", "temperature_requirement?", expected_order_version], output: ProductOrder, side_effects: ["increments ProductOrder.version by 1"] }
  - { method: POST, path: "/poultry/orders/{id}/cancel", description: "Cancel an order; cascades CANCELLED to SCHEDULED batches and releases labor estimates", roles: [OrderPlanner], code: 200, input: [], output: ProductOrder, side_effects: ["SCHEDULED batches -> CANCELLED; labor released"] }

  # --- Deboning batches ---
  - { method: POST, path: "/poultry/deboning-batches", description: "Schedule a deboning batch for an order on a DEBONING line; debits shift labor budget; order due_at must be in the future", roles: [ShiftSupervisor], code: 201, input: [order_id, flock_lot_id, shift_id, line_id, crew_count, input_weight_lb], output: DeboningBatch, side_effects: ["estimated_labor_hours debited from shift.labor_hours_remaining"] }
  - { method: GET, path: "/poultry/deboning-batches", description: "List deboning batches with filters (FK reverse reachability) and pagination", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: ["order_id?", "flock_lot_id?", "shift_id?", "line_id?", "limit?", "offset?"], output: "DeboningBatch[]", side_effects: [] }
  - { method: GET, path: "/poultry/deboning-batches/{id}", description: "Get a deboning batch", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: DeboningBatch, side_effects: [] }
  - { method: POST, path: "/poultry/deboning-batches/{id}/advance", description: "Batch lifecycle: IN_PROGRESS (start/resume), ON_HOLD, COMPLETED (with actual_output_weight_lb, actual_labor_hours), CANCELLED (from SCHEDULED)", roles: [LineOperator], code: 200, input: [to_status, "actual_output_weight_lb?", "actual_labor_hours?"], output: DeboningBatch, side_effects: ["start: order PENDING -> IN_PRODUCTION", "complete: net_weight_lb computed; FinishedLot created (OPEN); order allocation recomputed"] }

  # --- Finished lots (traceability) ---
  - { method: GET, path: "/poultry/finished-lots", description: "List finished lots with filters (FK reverse reachability)", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: ["deboning_batch_id?", "order_id?"], output: "FinishedLot[]", side_effects: [] }
  - { method: GET, path: "/poultry/finished-lots/{id}", description: "Get a finished lot including trace_code and routing_status", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: FinishedLot, side_effects: [] }
  - { method: POST, path: "/poultry/finished-lots/{id}/trace-lock", description: "Trace-lock a finished lot: requires all source-lot condemnations CERTIFIED; computes routing_status via routing_decision", roles: [QATechnician], code: 200, input: [], output: FinishedLot, side_effects: ["routing_status set (FRESH|FROZEN); locked_at = now"] }
  - { method: POST, path: "/poultry/finished-lots/{id}/advance", description: "SHIPPED by ShiftSupervisor; RECALLED by QATechnician or USDAInspector (reason required)", roles: [ShiftSupervisor, QATechnician, USDAInspector], code: 200, input: [to_status, "reason?"], output: FinishedLot, side_effects: ["ship: order fulfillment re-evaluated (-> FULFILLED when shipped net >= pounds_ordered)"] }

  # --- Chill chain ---
  - { method: POST, path: "/poultry/chill-chain-logs", description: "Append a cold-chain temperature observation for a finished lot", roles: [QATechnician], code: 201, input: [finished_lot_id, location, temperature_c], output: ChillChainLog, side_effects: [] }
  - { method: GET, path: "/poultry/finished-lots/{id}/chill-chain-logs", description: "List chill-chain logs of a finished lot", roles: [PlantManager, ShiftSupervisor, ReceivingClerk, LineOperator, QATechnician, SanitationLead, USDAInspector, OrderPlanner], code: 200, input: [], output: "ChillChainLog[]", side_effects: [] }

  # --- Test-driving endpoints ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (ISO8601). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Setting the clock evaluates time-based system transitions: waiver APPROVED->ACTIVE and ACTIVE->EXPIRED, flock lot ON_LINE->CHILLED.", roles: [PlantManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["evaluates all clock-driven system transitions"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation or this transition action (incl. water-breach resume by non-QA)" }
  # --- Generic ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, invalid enum value, unknown field, window_start >= window_end, findings/resolution_note missing where required" }
  # --- OCC ---
  - { id: ERR_STALE_SHIFT_VERSION, http: 412, condition: "expected_shift_version does not match the shift's current version" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match the order's current version" }
  - { id: ERR_STALE_LINE_VERSION, http: 412, condition: "expected_line_version does not match the line's current version" }
  # --- Shift lifecycle ---
  - { id: ERR_SHIFT_NOT_OPENABLE, http: 409, condition: "Open-production attempted on a shift not in SCHEDULED" }
  - { id: ERR_SHIFT_TERMINAL, http: 409, condition: "Mutation attempted on a CLOSED shift" }
  - { id: ERR_SHIFT_NOT_RUNNING, http: 409, condition: "Operation requires the enclosing shift in RUNNING (run start/set-speed, batch start/resume, suspend)" }
  - { id: ERR_SHIFT_NOT_SUSPENDED, http: 409, condition: "Resume attempted on a shift not in SUSPENDED" }
  - { id: ERR_RUNS_NOT_TERMINAL, http: 409, condition: "Shift close attempted while runs are RUNNING or PAUSED" }
  - { id: ERR_NO_RUNS_QUEUED, http: 409, condition: "Open-production attempted with zero QUEUED runs (empty-set edge)" }
  # --- Sanitation / pre-op gates ---
  - { id: ERR_PREOP_NOT_PASSED, http: 409, condition: "No PASSED pre-op inspection for (shift,line) when required" }
  - { id: ERR_SANITATION_NOT_VERIFIED, http: 409, condition: "No VERIFIED sanitation run for (shift,line) when required" }
  # --- Segregation of duties ---
  - { id: ERR_SOD_PREOP_SANITATION, http: 403, condition: "Pre-op PASSED by the same X-User-ID that completed sanitation for that shift+line" }
  - { id: ERR_SOD_CONDEMNATION_SELF_CERTIFY, http: 403, condition: "Condemnation record certified by its recorder" }
  # --- Line speed / waivers ---
  - { id: ERR_LINE_SPEED_NOT_AUTHORIZED, http: 403, condition: "Requested speed exceeds effective_max_line_speed (line rating, waiver cap, staffing band)" }
  - { id: ERR_WAIVER_WINDOW_OVERLAP, http: 422, condition: "Approve would overlap another APPROVED/ACTIVE waiver on the line (half-open windows; adjacency allowed)" }
  - { id: ERR_WAIVER_WINDOW_EXPIRED, http: 409, condition: "Approve attempted when logical clock is at/after effective_to" }
  # --- Generic state machine ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "to_status not reachable from the entity's current state (advance endpoints), or terminal-state lockdown violated" }
  # --- Flock lots / receiving ---
  - { id: ERR_FLOCK_LOT_NOT_RECEIVABLE, http: 409, condition: "Receive attempted on a lot not in BOOKED" }
  - { id: ERR_SHIFT_CAPACITY_EXCEEDED, http: 422, condition: "Booking would push the shift's total booked birds above shackle_capacity_birds (strictly greater rejects; equality allowed)" }
  - { id: ERR_LOT_NOT_SETTLABLE, http: 409, condition: "Settle attempted with uncertified condemnation records or no RECONCILED run" }
  # --- Runs ---
  - { id: ERR_RUN_NOT_STARTABLE, http: 409, condition: "Run start attempted while flock lot not RECEIVED/ON_LINE" }
  - { id: ERR_LOT_SHIFT_MISMATCH, http: 422, condition: "Run's flock lot is booked into a different shift than the run" }
  - { id: ERR_LINE_TYPE_MISMATCH, http: 422, condition: "LineRun on a DEBONING line or DeboningBatch on an EVISCERATION line" }
  # --- Condemnation ---
  - { id: ERR_CONDEMNATION_COUNT_EXCEEDS_HUNG, http: 422, condition: "Certified/draft condemnation totals would exceed birds hung (or birds remaining to hang at run completion); equality allowed" }
  # --- Deboning / orders ---
  - { id: ERR_LOT_NOT_CHILLED, http: 409, condition: "Batch start attempted before the source lot reached CHILLED" }
  - { id: ERR_BATCH_NOT_ADVANCEABLE, http: 409, condition: "Batch transition not allowed from its current state" }
  - { id: ERR_LABOR_BUDGET_EXCEEDED, http: 402, condition: "Batch estimated labor exceeds the shift's labor_hours_remaining" }
  - { id: ERR_ORDER_WINDOW_CLOSED, http: 409, condition: "Batch create attempted after the order's due_at" }
  - { id: ERR_ORDER_NOT_AMENDABLE, http: 409, condition: "Order amend attempted after fulfillment left PENDING" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Order cancel attempted while batches are IN_PROGRESS or ON_HOLD" }
  # --- Traceability / cold chain ---
  - { id: ERR_TRACE_LOCK_BLOCKED_UNCERTIFIED, http: 409, condition: "Trace-lock attempted while source-lot condemnation records are not all CERTIFIED" }
  - { id: ERR_CHILL_NOT_COMPLIANT, http: 409, condition: "FRESH trace-lock without a compliant chill log (temp <= 4.0C within 8h of run completion; lock no earlier than 2h after)" }
  - { id: ERR_CHILLER_LIMIT_FRESH_BLOCKED, http: 409, condition: "FRESH trace-lock while the shift's chiller water limit is breached" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant manager; owns configuration (lines, shifts), waiver drafting, condemnation disputes, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /poultry/lines"
      - "POST /poultry/shifts"
      - "POST /poultry/lines/{id}/waivers"
      - "POST /poultry/waivers/{id}/advance to SUBMITTED"
      - "POST /poultry/condemnation-records/{id}/advance to DISPUTED"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: ShiftSupervisor
    description: "Shift supervisor; owns staffing, shift lifecycle, run queueing, batch scheduling, lot settle, shipping"
    identity: opaque
    exclusive_operations:
      - "POST /poultry/shifts/{id}/staffing"
      - "POST /poultry/shifts/{id}/transition (RUNNING open/resume, SUSPENDED manual, CLOSED)"
      - "POST /poultry/line-runs"
      - "POST /poultry/deboning-batches"
      - "POST /poultry/flock-lots/{id}/advance to SETTLED"
      - "POST /poultry/finished-lots/{id}/advance to SHIPPED"
    shared_operations: ["all GET endpoints"]
  - name: ReceivingClerk
    description: "Live-receiving clerk; books and receives flock lots"
    identity: opaque
    exclusive_operations:
      - "POST /poultry/flock-lots"
      - "POST /poultry/flock-lots/{id}/receive"
    shared_operations: ["all GET endpoints"]
  - name: LineOperator
    description: "Line operator; starts/completes line runs, adjusts speed, advances deboning batches"
    identity: opaque
    exclusive_operations:
      - "POST /poultry/line-runs/{id}/advance"
      - "POST /poultry/line-runs/{id}/set-speed"
      - "POST /poultry/deboning-batches/{id}/advance"
    shared_operations: ["all GET endpoints"]
  - name: QATechnician
    description: "QA technician; pre-op inspections, sanitation verification, condemnation recording, utility readings, chill-chain logs, trace-lock, recall, water-breach resume clearance"
    identity: opaque
    exclusive_operations:
      - "POST /poultry/pre-op-inspections"
      - "POST /poultry/pre-op-inspections/{id}/advance to PASSED/FAILED/PENDING"
      - "POST /poultry/condemnation-records"
      - "POST /poultry/utility-readings"
      - "POST /poultry/chill-chain-logs"
      - "POST /poultry/finished-lots/{id}/trace-lock"
    shared_operations:
      - "POST /poultry/sanitation-runs/{id}/advance to VERIFIED/FAILED_RECHECK"
      - "POST /poultry/shifts/{id}/transition to SUSPENDED, and resume from WATER_LIMIT_BREACH"
      - "POST /poultry/finished-lots/{id}/advance to RECALLED"
      - "all GET endpoints"
  - name: SanitationLead
    description: "Sanitation crew lead; schedules and works sanitation runs, takes corrective actions"
    identity: opaque
    exclusive_operations:
      - "POST /poultry/sanitation-runs"
      - "POST /poultry/sanitation-runs/{id}/advance to IN_PROGRESS/COMPLETED"
    shared_operations:
      - "POST /poultry/pre-op-inspections/{id}/advance to CORRECTING"
      - "all GET endpoints"
  - name: USDAInspector
    description: "USDA inspector; approves/denies/revokes line-speed waivers, certifies condemnation records, reopens settled lots, may suspend shifts and recall lots"
    identity: opaque
    exclusive_operations:
      - "POST /poultry/waivers/{id}/advance to APPROVED/DENIED/REVOKED"
      - "POST /poultry/condemnation-records/{id}/advance to CERTIFIED"
      - "POST /poultry/flock-lots/{id}/advance to REOPENED"
    shared_operations:
      - "POST /poultry/shifts/{id}/transition to SUSPENDED (regulatory hold)"
      - "POST /poultry/finished-lots/{id}/advance to RECALLED"
      - "all GET endpoints"
  - name: OrderPlanner
    description: "Order planner; owns customer orders and amendments"
    identity: opaque
    exclusive_operations:
      - "POST /poultry/orders"
      - "PUT /poultry/orders/{id}"
      - "POST /poultry/orders/{id}/cancel"
    shared_operations: ["all GET endpoints"]
