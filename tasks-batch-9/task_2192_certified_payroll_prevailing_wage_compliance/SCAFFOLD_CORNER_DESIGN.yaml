      - name: patching_a_program_to_lapsed_updates_only_registration_status
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH /apprentice-programs/{id}
          - entities.ApprenticeProgram.registration_status
        distinguishing_aspect: "The only PATCH in the surface accepts exactly one mutable field. Sponsor, trade, ratio and period_count are untouched by the call and the row's version advances to 2, which is what later lets a lapse invalidate apprentice lines without rewriting the program's terms."
        test_recipe:
          setup:
            - "One REGISTERED ELEC program allowing 25 apprentice hours per 100 journey hours across 4 periods."
          setup_api_calls:
            - call: "POST /apprentice-programs"
              payload: { registration_number: "AP-ELEC-77", sponsor_name: "Alameda Electrical JATC", trade_code: "ELEC", registration_status: "REGISTERED", allowed_apprentice_hours_per_100_journey: 25, period_count: 4 }
              as: PortalAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "PATCH /apprentice-programs/${prog_id}"
              payload: { registration_status: "LAPSED" }
              as: PortalAdmin
          assert:
            - "response.status == 200"
            - "ApprenticeProgram.${prog_id}.registration_status == LAPSED"
            - "ApprenticeProgram.${prog_id}.trade_code == ELEC"
            - "ApprenticeProgram.${prog_id}.allowed_apprentice_hours_per_100_journey == 25"
            - "ApprenticeProgram.${prog_id}.period_count == 4"
            - "ApprenticeProgram.${prog_id}.version == 2"

