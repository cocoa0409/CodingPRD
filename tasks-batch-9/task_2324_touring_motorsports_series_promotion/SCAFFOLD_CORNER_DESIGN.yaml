          - validations[order=27]
          - validations[order=45]
        distinguishing_aspect: "ERR_SAFETY_PLAN_MISSING is only reachable on a stop that never had a plan, which by construction can never have opened sales; ERR_PENDING_ORDERS_OUTSTANDING is only reachable while sales are still ON_SALE, because close-sales voids every PENDING order. ERR_DUPLICATE_CHILD is a single code that guards two different singleton children of a stop: the SafetyPlan and the non-DISPUTED EventSettlement."
