scenario: |
  1010. Luggage & Travel-Goods Store: SKU & warranty registration, repair
  (wheel/handle/zipper) service, monogram/personalization, loyalty & trade-in,
  TSA/airline-size guide, gift, special order, recall
domain_name: luggage-travel-goods
api_prefix: /store

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # All entities are peer collections mounted under /store; parent links are
  # foreign keys carried in the request body, never nested resource paths.
  # Children (RepairLine, SalesOrderLine) are reached by filtered-list GETs.

  state_machine_shape: parallel
  # RepairOrder is cyclic (IN_REPAIR<->PARTS_HOLD); SalesOrder carries two
  # independent axes (payment_status x fulfillment_status); WarrantyClaim is
  # cyclic (UNDER_REVIEW<->NEEDS_INFO). Non-linear on several distinct entities.

  relationship_patterns:
    - one_to_many        # Customer -> SalesOrders; RepairOrder -> RepairLines
    - cross_aggregate    # RepairOrder -> WarrantyClaim; SalesOrderLine -> MonogramStation

  role_model: hierarchical_override
  # Manager is a superset of Associate plus fiscal/compliance exclusives;
  # Customer is entity-backed self-service on its own resources.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Merchant SKU code; unique across active (non-DISCONTINUED) products"
        constraints: "uniqueness scoped to status IN {ACTIVE, RECALLED}"
      - name: name
        type: string
        source: input
        description: "Model display name"
      - name: category
        type: enum
        source: input
        description: "Product family"
        constraints: "one of {HARD_SHELL, SOFT_SIDE, BACKPACK, DUFFEL, ACCESSORY}"
      - name: msrp_cents
        type: integer
        source: input
        description: "List price in integer cents; base for trade-in valuation"
        constraints: ">= 0"
      - name: warranty_months
        type: integer
        source: input
        description: "Warranty coverage length in whole months from purchase_date"
        constraints: ">= 0"
      - name: length_mm
        type: integer
        source: input
        description: "External length in millimetres (for airline-fit)"
        constraints: ">= 0"
      - name: width_mm
        type: integer
        source: input
        description: "External width in millimetres"
        constraints: ">= 0"
      - name: height_mm
        type: integer
        source: input
        description: "External height in millimetres"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see state machine Product"
        default: ACTIVE
        constraints: "one of {ACTIVE, RECALLED, DISCONTINUED}"

  - name: Airline
    parent: null
    common_fields: false
    fields:
      - name: iata_code
        type: string
        source: input
        description: "Airline IATA code, e.g. 'UA'"
      - name: name
        type: string
        source: input
        description: "Carrier display name"
      - name: carry_on_max_length_mm
        type: integer
        source: input
        description: "Max carry-on length in mm (inclusive limit)"
        constraints: ">= 0"
      - name: carry_on_max_width_mm
        type: integer
        source: input
        description: "Max carry-on width in mm (inclusive limit)"
        constraints: ">= 0"
      - name: carry_on_max_height_mm
        type: integer
        source: input
        description: "Max carry-on height in mm (inclusive limit)"
        constraints: ">= 0"
      - name: checked_linear_limit_mm
        type: integer
        source: input
        description: "Max checked linear (L+W+H) dimension in mm (inclusive limit)"
        constraints: ">= 0"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Contact email; unique across customers"
        constraints: "globally unique"
      - name: full_name
        type: string
        source: input
        description: "Customer name"
      - name: tier
        type: enum
        source: computed
        description: "Loyalty tier derived from lifetime_spend_cents crossing TIER_THRESHOLDS = { BRONZE:0, SILVER:50000, GOLD:150000, PLATINUM:500000 } (cents). tier = highest tier whose threshold <= lifetime_spend_cents."
        default: BRONZE
        constraints: "one of {BRONZE, SILVER, GOLD, PLATINUM}"
      - name: lifetime_spend_cents
        type: integer
        source: computed
        description: "Running sum of net merchandise on CAPTURED sales orders (net of loyalty discount, excl tax & gift wrap); decremented on refund"
        default: 0
      - name: points_balance
        type: integer
        source: computed
        description: "Loyalty points; credited on payment capture, debited on refund. Invariant: points_balance == sum(earned on CAPTURED orders) - sum(reversed on REFUNDED orders)"
        default: 0
      - name: store_credit_cents
        type: integer
        source: computed
        description: "Store credit; credited on trade-in ACCEPT, debited on trade-in VOID. Invariant: store_credit_cents == sum(offer_amount_cents of ACCEPTED, not VOIDED trade-ins)"
        default: 0

  - name: WarrantyRegistration
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the registered model"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the owner"
      - name: serial_number
        type: string
        source: input
        description: "Unit serial; unique per product_id"
        constraints: "uniqueness scoped to product_id"
      - name: purchase_date
        type: datetime
        source: input
        description: "Date of purchase; warranty clock starts here"
      - name: warranty_expiry
        type: datetime
        source: computed
        description: "purchase_date + Product.warranty_months (see calc warranty_expiry)"
      - name: status
        type: enum
        source: system
        description: "Registration lifecycle; see state machine WarrantyRegistration"
        default: ACTIVE
        constraints: "one of {ACTIVE, RECALL_FLAGGED, VOID}"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> WarrantyRegistration.id; the claimed registration"
      - name: expected_warranty_registration_version
        type: integer
        source: input
        description: "OCC guard: WarrantyRegistration.version the client last observed"
      - name: defect_type
        type: enum
        source: input
        description: "Reported defect"
        constraints: "one of {WHEEL, HANDLE, ZIPPER, SHELL, LINING, OTHER}"
      - name: description
        type: string
        source: input
        description: "Free-text defect description"
      - name: resolution
        type: enum
        source: system
        description: "Set when resolved"
        default: null
        constraints: "one of {REPAIR, REPLACE, REJECT} or null while open"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle; see state machine WarrantyClaim"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, NEEDS_INFO, RESOLVED, REJECTED, SUPERSEDED}"

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; who requested the repair"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the item being repaired"
      - name: claim_id
        type: string
        source: input
        description: "FK -> WarrantyClaim.id; set when this repair is warranty-covered; null for paid repairs"
        default: null
      - name: bench_id
        type: string
        source: input
        description: "FK -> ServiceBench.id; assigned at schedule time; null until scheduled"
        default: null
      - name: pay_mode
        type: enum
        source: computed
        description: "CUSTOMER_PAY when claim_id null; WARRANTY_COVERED when claim_id set and claim.resolution==REPAIR"
        constraints: "one of {CUSTOMER_PAY, WARRANTY_COVERED}"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Amount the customer owes; see calc repair_quote (0 for WARRANTY_COVERED)"
        default: 0
      - name: warranty_cost_cents
        type: integer
        source: computed
        description: "Internal cost recorded for WARRANTY_COVERED repairs; 0 for CUSTOMER_PAY"
        default: 0
      - name: bench_start
        type: datetime
        source: input
        description: "Scheduled bench window start; set at schedule"
        default: null
      - name: bench_end
        type: datetime
        source: input
        description: "Scheduled bench window end (exclusive); set at schedule"
        default: null
      - name: status
        type: enum
        source: system
        description: "Repair lifecycle; see state machine RepairOrder"
        default: INTAKE
        constraints: "one of {INTAKE, QUOTED, APPROVED, DECLINED, SCHEDULED, IN_REPAIR, PARTS_HOLD, READY, CLOSED, CANCELLED}"

  - name: RepairLine
    parent: null
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; parent repair"
      - name: repair_type
        type: enum
        source: input
        description: "Component being repaired"
        constraints: "one of {WHEEL, HANDLE, ZIPPER, OTHER}"
      - name: labor_hours
        type: number
        source: input
        description: "Estimated labor hours for this line"
        constraints: ">= 0"
      - name: complexity
        type: enum
        source: input
        description: "Labor complexity band"
        default: STANDARD
        constraints: "one of {STANDARD, COMPLEX}"
      - name: parts_cost_cents
        type: integer
        source: input
        description: "Parts cost in cents for this line"
        constraints: ">= 0"
      - name: line_labor_cents
        type: integer
        source: computed
        description: "Clamped labor cost for this line; see calc repair_quote"
        default: 0
      - name: line_total_cents
        type: integer
        source: computed
        description: "line_labor_cents + parts_cost_cents"
        default: 0

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the buyer"
      - name: is_gift
        type: boolean
        source: input
        description: "When true, gift wrap fee applies and a gift receipt is issued"
        default: false
      - name: gift_message
        type: string
        source: input
        description: "Optional gift message"
        default: null
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of per-line rounded amounts plus monogram fees; see calc sales_order_pricing"
        default: 0
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: "Tier discount on subtotal at order creation; see calc sales_order_pricing"
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax on (subtotal - loyalty_discount)"
        default: 0
      - name: gift_wrap_fee_cents
        type: integer
        source: computed
        description: "GIFT_WRAP_FEE_CENTS when is_gift else 0"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "(subtotal - loyalty_discount) + tax + gift_wrap_fee; see calc sales_order_pricing"
        default: 0
      - name: provisional_points
        type: integer
        source: computed
        description: "Points estimate at creation using tier at creation; not yet credited (see calc loyalty_points_accrual)"
        default: 0
      - name: points_credited
        type: integer
        source: computed
        description: "Points actually credited at payment capture using tier at capture; 0 until CAPTURED"
        default: 0
      - name: payment_status
        type: enum
        source: system
        description: "Payment axis; see state machine SalesOrder"
        default: PENDING
        constraints: "one of {PENDING, CAPTURED, REFUNDED}"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Fulfillment axis; evolves independently of payment_status"
        default: UNFULFILLED
        constraints: "one of {UNFULFILLED, FULFILLED, CANCELLED}"

  - name: SalesOrderLine
    parent: null
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: input
        description: "FK -> SalesOrder.id; parent order"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; item purchased"
      - name: monogram_station_id
        type: string
        source: input
        description: "FK -> MonogramStation.id; assigned when a monogram window is scheduled; null otherwise"
        default: null
      - name: unit_price_cents
        type: integer
        source: input
        description: "Per-unit price in cents"
        constraints: ">= 0"
      - name: qty
        type: integer
        source: input
        description: "Quantity purchased"
        constraints: ">= 1"
      - name: line_discount_pct
        type: number
        source: input
        description: "Per-line fractional discount 0..1"
        default: 0
        constraints: "0 <= x <= 1"
      - name: monogram_text
        type: string
        source: input
        description: "Personalization text; when present a monogram fee applies and a monogram job is created"
        default: null
      - name: monogram_fee_cents
        type: integer
        source: computed
        description: "MONOGRAM_FEE_CENTS when monogram_text present else 0"
        default: 0
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: "round_half_up(unit_price_cents * qty * (1 - line_discount_pct)) + monogram_fee_cents (per-line rounding pinned)"
        default: 0
      - name: monogram_start
        type: datetime
        source: input
        description: "Scheduled monogram window start; set at schedule-monogram"
        default: null
      - name: monogram_end
        type: datetime
        source: input
        description: "Scheduled monogram window end; set at schedule-monogram"
        default: null
      - name: monogram_status
        type: enum
        source: system
        description: "Monogram sub-lifecycle; see state machine SalesOrderLine"
        default: NONE
        constraints: "one of {NONE, QUEUED, SCHEDULED, IN_PROGRESS, DONE}"

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; who is trading in"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; model of the traded-in unit (msrp base)"
      - name: expected_customer_version
        type: integer
        source: input
        description: "OCC guard: Customer.version the client last observed (offers supersede prior open offers)"
      - name: condition
        type: enum
        source: input
        description: "Assessed condition"
        constraints: "one of {LIKE_NEW, GOOD, FAIR, POOR}"
      - name: offer_amount_cents
        type: integer
        source: computed
        description: "Trade-in offer; see calc trade_in_offer_value"
        default: 0
      - name: expires_at
        type: datetime
        source: computed
        description: "OFFERED offers expire TRADE_IN_OFFER_DAYS days after created_at"
      - name: status
        type: enum
        source: system
        description: "Trade-in lifecycle; see state machine TradeIn"
        default: OFFERED
        constraints: "one of {OFFERED, ACCEPTED, DECLINED, EXPIRED, VOIDED, SUPERSEDED}"

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; requester"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; item to source"
      - name: quantity
        type: integer
        source: input
        description: "Units requested"
        constraints: ">= 1"
      - name: deposit_cents
        type: integer
        source: input
        description: "Deposit collected up front"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Special-order lifecycle; see state machine SpecialOrder"
        default: REQUESTED
        constraints: "one of {REQUESTED, SOURCED, ARRIVED, FULFILLED, CANCELLED}"

  - name: RecallNotice
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the recalled model"
      - name: reason
        type: string
        source: input
        description: "Recall reason text"
      - name: remedy
        type: enum
        source: input
        description: "Offered remedy"
        constraints: "one of {REPAIR, REPLACE, REFUND}"
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle; see state machine RecallNotice"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, CLOSED}"

  - name: ServiceBench
    parent: null
    common_fields: false
    fields:
      - name: label
        type: string
        source: input
        description: "Bench identifier, e.g. 'Bench A'"
      - name: skill
        type: enum
        source: input
        description: "Repair specialty this bench handles"
        constraints: "one of {WHEEL, HANDLE, ZIPPER, GENERAL}"

  - name: MonogramStation
    parent: null
    common_fields: false
    fields:
      - name: label
        type: string
        source: input
        description: "Station identifier, e.g. 'Emboss 1'"
      - name: method
        type: enum
        source: input
        description: "Personalization method"
        constraints: "one of {EMBOSS, HEATSTAMP, ENGRAVE}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: RECALLED
        trigger: "POST /store/recall-notices/{id}/publish (system side effect)"
        actor: system
        preconditions: ["a RecallNotice for this product transitions DRAFT->PUBLISHED"]
        side_effects:
          - "each WarrantyRegistration with product_id==Product.id AND status==ACTIVE transitions ACTIVE->RECALL_FLAGGED (cascade link 2)"
          - "each SpecialOrder with product_id==Product.id AND status IN {REQUESTED, SOURCED} transitions to CANCELLED"
      - from: RECALLED
        to: ACTIVE
        trigger: "POST /store/recall-notices/{id}/close"
        actor: Manager
        preconditions: ["the PUBLISHED RecallNotice for this product transitions PUBLISHED->CLOSED"]
        side_effects:
          - "each WarrantyRegistration with product_id==Product.id AND status==RECALL_FLAGGED transitions RECALL_FLAGGED->ACTIVE"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /store/products/{id}/discontinue"
        actor: Manager
        preconditions: ["no OPEN SpecialOrder (status IN {REQUESTED, SOURCED, ARRIVED}) references this product"]
        side_effects: ["Product excluded from new sales-order lines and registrations"]

  - entity: WarrantyRegistration
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: RECALL_FLAGGED
        trigger: "system: owning Product transitions ACTIVE->RECALLED"
        actor: system
        preconditions: ["Product.status becomes RECALLED"]
        side_effects:
          - "each WarrantyClaim with registration_id==this.id AND status IN {SUBMITTED, UNDER_REVIEW} transitions to NEEDS_INFO (cascade link 3)"
      - from: RECALL_FLAGGED
        to: ACTIVE
        trigger: "system: owning Product transitions RECALLED->ACTIVE"
        actor: system
        preconditions: ["Product.status becomes ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: VOID
        trigger: "POST /store/warranty-registrations/{id}/void"
        actor: Manager
        preconditions: ["no WarrantyClaim on this registration is in {UNDER_REVIEW, NEEDS_INFO}"]
        side_effects: ["registration no longer accepts new claims"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [RESOLVED, REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer WarrantyClaim is created on the same registration (POST /store/warranty-claims)"
        actor: system
        preconditions: ["a new claim is created on registration_id while this claim is non-terminal"]
        side_effects: ["this claim is closed as SUPERSEDED"]
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system: a newer WarrantyClaim is created on the same registration"
        actor: system
        preconditions: ["a new claim is created on registration_id while this claim is non-terminal"]
        side_effects: []
      - from: NEEDS_INFO
        to: SUPERSEDED
        trigger: "system: a newer WarrantyClaim is created on the same registration"
        actor: system
        preconditions: ["a new claim is created on registration_id while this claim is non-terminal"]
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /store/warranty-claims/{id}/review"
        actor: Associate
        preconditions:
          - "WarrantyRegistration.status == ACTIVE (cross-entity: registration not RECALL_FLAGGED or VOID)"
          - "clock < WarrantyRegistration.warranty_expiry (warranty not expired)"
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /store/warranty-claims/{id}/request-info"
        actor: Associate
        preconditions: ["claim.status == UNDER_REVIEW"]
        side_effects: []
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /store/warranty-claims/{id}/resubmit"
        actor: Associate
        preconditions: ["claim.status == NEEDS_INFO"]
        side_effects: []
        note: "cyclic loop UNDER_REVIEW<->NEEDS_INFO"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /store/warranty-claims/{id}/resolve (resolution in {REPAIR, REPLACE})"
        actor: Manager
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "WarrantyRegistration.status == ACTIVE (cross-entity)"
        side_effects:
          - "set resolution; when resolution==REPAIR a RepairOrder may be opened with claim_id==this.id (WARRANTY_COVERED)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /store/warranty-claims/{id}/resolve (resolution==REJECT)"
        actor: Manager
        preconditions: ["claim.status == UNDER_REVIEW"]
        side_effects: ["set resolution=REJECT"]

  - entity: RepairOrder
    initial_state: INTAKE
    terminal_states: [DECLINED, CLOSED, CANCELLED]
    transitions:
      - from: INTAKE
        to: QUOTED
        trigger: "POST /store/repair-orders/{id}/quote"
        actor: Associate
        preconditions:
          - "at least one RepairLine exists for this repair_order_id (non-empty line set)"
          - "Product.status != RECALLED"
        side_effects:
          - "compute each RepairLine.line_labor_cents and line_total_cents (calc repair_quote)"
          - "set RepairOrder.quoted_total_cents and warranty_cost_cents by pay_mode"
      - from: QUOTED
        to: APPROVED
        trigger: "POST /store/repair-orders/{id}/approve"
        actor: Customer
        preconditions:
          - "repair.status == QUOTED"
          - "Product.status != RECALLED (business_safety)"
        side_effects: []
      - from: QUOTED
        to: DECLINED
        trigger: "POST /store/repair-orders/{id}/decline"
        actor: Customer
        preconditions: ["repair.status == QUOTED"]
        side_effects: []
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /store/repair-orders/{id}/schedule"
        actor: Associate
        preconditions:
          - "repair.status == APPROVED"
          - "bench_start < bench_end"
          - "no other RepairOrder on the same bench_id in {SCHEDULED, IN_REPAIR, PARTS_HOLD} occupies an overlapping [bench_start, bench_end) window (half-open; adjacency where end==other.start is allowed)"
        side_effects: ["set bench_id, bench_start, bench_end"]
      - from: SCHEDULED
        to: IN_REPAIR
        trigger: "POST /store/repair-orders/{id}/start"
        actor: Associate
        preconditions: ["repair.status == SCHEDULED"]
        side_effects: []
      - from: IN_REPAIR
        to: PARTS_HOLD
        trigger: "POST /store/repair-orders/{id}/parts-hold"
        actor: Associate
        preconditions: ["repair.status == IN_REPAIR"]
        side_effects: []
      - from: PARTS_HOLD
        to: IN_REPAIR
        trigger: "POST /store/repair-orders/{id}/resume"
        actor: Associate
        preconditions: ["repair.status == PARTS_HOLD"]
        side_effects: []
        note: "cyclic loop IN_REPAIR<->PARTS_HOLD"
      - from: IN_REPAIR
        to: READY
        trigger: "POST /store/repair-orders/{id}/ready"
        actor: Associate
        preconditions: ["repair.status == IN_REPAIR"]
        side_effects: []
      - from: READY
        to: CLOSED
        trigger: "POST /store/repair-orders/{id}/close"
        actor: Associate
        preconditions: ["repair.status == READY"]
        side_effects:
          - "when pay_mode==CUSTOMER_PAY: Customer.points_balance += floor(quoted_total_cents/100) (loyalty on paid repairs); may cross a tier threshold triggering tier upgrade"

  - entity: SalesOrder
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CAPTURED
        trigger: "POST /store/sales-orders/{id}/capture"
        actor: Associate
        preconditions:
          - "payment_status == PENDING"
          - "at least one SalesOrderLine exists"
          - "no SalesOrderLine references a Product whose status==RECALLED"
        side_effects:
          - "compute points_credited using Customer.tier at capture (calc loyalty_points_accrual FINAL)"
          - "Customer.points_balance += points_credited (cascade link 1)"
          - "Customer.lifetime_spend_cents += (subtotal_cents - loyalty_discount_cents); may cross a tier threshold -> Customer.tier upgraded (cascade link 2)"
        note: "payment axis; independent of fulfillment_status"
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /store/sales-orders/{id}/refund"
        actor: Manager
        preconditions: ["payment_status == CAPTURED"]
        side_effects:
          - "Customer.points_balance -= points_credited (compensation; conserves points invariant)"
          - "Customer.lifetime_spend_cents -= (subtotal_cents - loyalty_discount_cents)"
      - from: UNFULFILLED
        to: FULFILLED
        trigger: "POST /store/sales-orders/{id}/fulfill"
        actor: Associate
        preconditions:
          - "fulfillment_status == UNFULFILLED"
          - "payment_status == CAPTURED (cross-entity axis dependency within the row)"
          - "every SalesOrderLine with monogram_text present has monogram_status == DONE"
        side_effects: []
        note: "fulfillment axis"
      - from: UNFULFILLED
        to: CANCELLED
        trigger: "POST /store/sales-orders/{id}/cancel"
        actor: Associate
        preconditions: ["fulfillment_status == UNFULFILLED"]
        side_effects: []

  - entity: SalesOrderLine
    initial_state: NONE
    terminal_states: [DONE]
    transitions:
      - from: QUEUED
        to: SCHEDULED
        trigger: "POST /store/sales-order-lines/{id}/schedule-monogram"
        actor: Associate
        preconditions:
          - "monogram_status == QUEUED (monogram_text present)"
          - "monogram_start < monogram_end"
          - "no other SalesOrderLine on the same monogram_station_id in {SCHEDULED, IN_PROGRESS} occupies a window within STATION_BUFFER_MIN=15 minutes (closed interval expanded by the buffer on both sides)"
        side_effects: ["set monogram_station_id, monogram_start, monogram_end"]
        note: "monogram_status starts at QUEUED at line creation when monogram_text is present, else NONE"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /store/sales-order-lines/{id}/start-monogram"
        actor: Associate
        preconditions:
          - "monogram_status == SCHEDULED"
          - "parent SalesOrder.payment_status == CAPTURED (cross-entity dependency)"
        side_effects: []
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /store/sales-order-lines/{id}/complete-monogram"
        actor: Associate
        preconditions: ["monogram_status == IN_PROGRESS"]
        side_effects: []

  - entity: TradeIn
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, VOIDED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system: a newer TradeIn is created for the same customer_id + product_id (POST /store/trade-ins)"
        actor: system
        preconditions: ["a new OFFERED trade-in is created for same customer_id and product_id while this one is OFFERED"]
        side_effects: ["prior offer closed as SUPERSEDED"]
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /store/trade-ins/{id}/accept"
        actor: Manager
        preconditions:
          - "status == OFFERED"
          - "clock < expires_at (offer not expired)"
        side_effects:
          - "Customer.store_credit_cents += offer_amount_cents (conserves store-credit invariant)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /store/trade-ins/{id}/decline"
        actor: Customer
        preconditions: ["status == OFFERED"]
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /store/trade-ins/{id}/accept when clock >= expires_at (auto-expire on touch)"
        actor: system
        preconditions: ["status == OFFERED AND clock >= expires_at"]
        side_effects: []
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /store/trade-ins/{id}/void"
        actor: Manager
        preconditions: ["status == ACCEPTED"]
        side_effects:
          - "Customer.store_credit_cents -= offer_amount_cents (compensation; store-credit invariant restored)"

  - entity: SpecialOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SOURCED
        trigger: "POST /store/special-orders/{id}/source"
        actor: Associate
        preconditions:
          - "status == REQUESTED"
          - "Product.status != RECALLED (cross-entity)"
        side_effects: []
      - from: SOURCED
        to: ARRIVED
        trigger: "POST /store/special-orders/{id}/arrive"
        actor: Associate
        preconditions: ["status == SOURCED"]
        side_effects: []
      - from: ARRIVED
        to: FULFILLED
        trigger: "POST /store/special-orders/{id}/fulfill"
        actor: Associate
        preconditions: ["status == ARRIVED"]
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /store/special-orders/{id}/cancel OR system on owning Product RECALLED"
        actor: Associate
        preconditions: ["status == REQUESTED"]
        side_effects: []
      - from: SOURCED
        to: CANCELLED
        trigger: "POST /store/special-orders/{id}/cancel OR system on owning Product RECALLED"
        actor: Associate
        preconditions: ["status == SOURCED"]
        side_effects: []

  - entity: RecallNotice
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /store/recall-notices/{id}/publish"
        actor: Manager
        preconditions:
          - "status == DRAFT"
          - "Product.status == ACTIVE"
        side_effects:
          - "owning Product transitions ACTIVE->RECALLED (cascade link 1; which cascades to registrations and their claims)"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /store/recall-notices/{id}/close"
        actor: Manager
        preconditions: ["status == PUBLISHED"]
        side_effects:
          - "owning Product transitions RECALLED->ACTIVE (which reverts RECALL_FLAGGED registrations to ACTIVE)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: claim-create-stale-registration
    parent_entity: WarrantyRegistration
    write_endpoint: "POST /store/warranty-claims"
    occ_field: "expected_warranty_registration_version"
    description: |
      Creating a WarrantyClaim against a WarrantyRegistration whose version has
      advanced since the client last observed it is rejected. A newly created
      claim legitimately supersedes any prior non-terminal claim on the same
      registration; a client whose expected_warranty_registration_version is
      stale has not seen the prior claim creation that bumped the registration
      version, so its create is rejected rather than silently superseding a
      claim it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: repair_quote
    trigger: "RepairOrder INTAKE->QUOTED (POST /store/repair-orders/{id}/quote)"
    algorithm: aggregation
    formula: |
      # Per-line labor with clamped nested min/max (>=3 inputs):
      LABOR_RATE = { WHEEL:3500, HANDLE:4000, ZIPPER:3000, OTHER:4500 }  # cents/hour
      COMPLEXITY_MULT = { STANDARD:1.0, COMPLEX:1.5 }
      for line in RepairLines(repair_order_id):
        raw = round_half_up(LABOR_RATE[line.repair_type] * line.labor_hours * COMPLEXITY_MULT[line.complexity])
        line.line_labor_cents = min(MAX_LABOR_CENTS, max(MIN_LABOR_CENTS, raw))
        line.line_total_cents = line.line_labor_cents + line.parts_cost_cents
      lines_total = sum(line.line_total_cents for line in lines)
      # pay_mode = WARRANTY_COVERED iff claim_id set and claim.resolution==REPAIR, else CUSTOMER_PAY
      if pay_mode == CUSTOMER_PAY:
        quoted_total_cents = lines_total + DIAGNOSTIC_FEE_CENTS
        warranty_cost_cents = 0
      else:  # WARRANTY_COVERED
        quoted_total_cents = 0
        warranty_cost_cents = lines_total     # diagnostic fee waived under warranty
    input_set: "all RepairLine rows with repair_order_id == this RepairOrder.id (no status filter; lines are immutable inputs)"
    constants:
      MIN_LABOR_CENTS: 1500
      MAX_LABOR_CENTS: 20000
      DIAGNOSTIC_FEE_CENTS: 2500
    precision: "integer cents, round_half_up on the per-line labor product before clamping"
    variants:
      - name: customer_pay
        when: "claim_id is null (no warranty coverage)"
        difference: "quoted_total_cents = lines_total + DIAGNOSTIC_FEE_CENTS; warranty_cost_cents = 0"
      - name: warranty_covered
        when: "claim_id set and its WarrantyClaim.resolution == REPAIR"
        difference: "quoted_total_cents = 0 (customer owes nothing); warranty_cost_cents = lines_total; diagnostic fee waived"

  - name: sales_order_pricing
    trigger: "SalesOrder + SalesOrderLine creation (recomputed on POST /store/sales-order-lines and read on the order)"
    algorithm: tiered_pricing
    formula: |
      MONOGRAM_FEE_CENTS = 1200
      GIFT_WRAP_FEE_CENTS = 800
      TAX_RATE = 0.08
      TIER_DISCOUNT = { BRONZE:0.00, SILVER:0.05, GOLD:0.10, PLATINUM:0.15 }
      # Rounding order pinned: round EACH line to whole cents, THEN sum.
      for line in SalesOrderLines(sales_order_id):
        line.monogram_fee_cents = MONOGRAM_FEE_CENTS if line.monogram_text else 0
        line.line_subtotal_cents = round_half_up(line.unit_price_cents * line.qty * (1 - line.line_discount_pct)) + line.monogram_fee_cents
      subtotal_cents = sum(line.line_subtotal_cents for line in lines)
      loyalty_discount_cents = round_half_up(subtotal_cents * TIER_DISCOUNT[Customer.tier_at_order_creation])
      taxable = subtotal_cents - loyalty_discount_cents
      tax_cents = round_half_up(taxable * TAX_RATE)
      gift_wrap_fee_cents = GIFT_WRAP_FEE_CENTS if is_gift else 0
      total_cents = taxable + tax_cents + gift_wrap_fee_cents
    input_set: "all SalesOrderLine rows for the order; tier read from Customer.tier at order-creation time"
    constants:
      MONOGRAM_FEE_CENTS: 1200
      GIFT_WRAP_FEE_CENTS: 800
      TAX_RATE: 0.08
    precision: "integer cents, round_half_up; per-line rounding performed BEFORE summation (order is load-bearing)"

  - name: loyalty_points_accrual
    trigger: "provisional at SalesOrder creation; final at PENDING->CAPTURED"
    algorithm: threshold
    formula: |
      POINTS_PER_100_CENTS = 1
      TIER_MULT = { BRONZE:1.00, SILVER:1.25, GOLD:1.50, PLATINUM:2.00 }
      net_merch_cents = subtotal_cents - loyalty_discount_cents   # excludes tax and gift wrap
      points = floor( floor(net_merch_cents / 100) * TIER_MULT[tier] )
    input_set: "single SalesOrder; net merchandise only (tax and gift-wrap excluded)"
    constants:
      POINTS_PER_100_CENTS: 1
    precision: "integer points; floor(net/100) first, multiply by tier multiplier, then floor"
    variants:
      - name: provisional
        when: "order creation, payment_status==PENDING"
        difference: "tier = Customer.tier at ORDER CREATION; result stored in provisional_points, NOT credited to points_balance"
      - name: final
        when: "PENDING->CAPTURED"
        difference: "tier = Customer.tier at CAPTURE time (may have upgraded since creation); result stored in points_credited AND added to Customer.points_balance"

  - name: warranty_expiry
    trigger: "WarrantyRegistration creation"
    algorithm: aggregation
    formula: |
      warranty_expiry = purchase_date + Product.warranty_months months
    input_set: "single registration and its Product.warranty_months"
    constants: {}
    precision: "calendar month addition; exact instant of purchase_date preserved"

  - name: trade_in_offer_value
    trigger: "TradeIn creation (POST /store/trade-ins)"
    algorithm: threshold
    formula: |
      CONDITION_FACTOR = { LIKE_NEW:0.40, GOOD:0.30, FAIR:0.20, POOR:0.10 }
      raw = round_half_up(Product.msrp_cents * CONDITION_FACTOR[condition])
      offer_amount_cents = max(MIN_TRADE_CENTS, raw)
      expires_at = created_at + TRADE_IN_OFFER_DAYS days
    input_set: "single TradeIn; Product.msrp_cents and condition"
    constants:
      MIN_TRADE_CENTS: 500
      TRADE_IN_OFFER_DAYS: 14
    precision: "integer cents, round_half_up then floored to MIN_TRADE_CENTS"

  - name: airline_fit
    trigger: "GET /store/products/{id}/airline-fit?airline_id=..."
    algorithm: threshold
    formula: |
      fits_carry_on = (Product.length_mm <= Airline.carry_on_max_length_mm)
                  and (Product.width_mm  <= Airline.carry_on_max_width_mm)
                  and (Product.height_mm <= Airline.carry_on_max_height_mm)
      linear_mm = Product.length_mm + Product.width_mm + Product.height_mm
      fits_checked = linear_mm <= Airline.checked_linear_limit_mm
    input_set: "one Product, one Airline"
    constants: {}
    precision: "integer mm comparison; boundary is inclusive (<=), exact equality fits"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per RBAC matrix; entity-backed Customer acts only on own resources"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "all path ids and body foreign keys resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: business_safety
    check: "operation not blocked because the referenced Product.status == RECALLED (repair approve, sales capture, special-order source)"
    error_id: ERR_PRODUCT_RECALLED
    http_status: 409
    applies_to: "POST /store/repair-orders/{id}/quote, POST /store/repair-orders/{id}/approve, POST /store/sales-orders/{id}/capture, POST /store/special-orders/{id}/source"
  - priority: 6
    category: business_referential
    check: "warranty claim actions require WarrantyRegistration.status == ACTIVE (not RECALL_FLAGGED or VOID)"
    error_id: ERR_REGISTRATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /store/warranty-claims/{id}/review, POST /store/warranty-claims/{id}/resolve"
  - priority: 7
    category: business_temporal
    check: "warranty claim review requires clock < WarrantyRegistration.warranty_expiry"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /store/warranty-claims/{id}/review"
  - priority: 8
    category: business_temporal
    check: "trade-in accept requires clock < TradeIn.expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /store/trade-ins/{id}/accept"
  - priority: 9
    category: business_constraint
    check: "repair quote requires at least one RepairLine (non-empty set)"
    error_id: ERR_NO_REPAIR_LINES
    http_status: 422
    applies_to: "POST /store/repair-orders/{id}/quote"
  - priority: 10
    category: business_constraint
    check: "monogram window respects bench/station overlap semantics (bench half-open; station buffered)"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /store/repair-orders/{id}/schedule, POST /store/sales-order-lines/{id}/schedule-monogram"
  - priority: 11
    category: business_constraint
    check: "unique constraints: Customer.email global; Product.sku across {ACTIVE,RECALLED}; WarrantyRegistration.serial_number per product_id"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /store/customers, POST /store/products, POST /store/warranty-registrations"
  - priority: 12
    category: business_constraint
    check: "start-monogram requires parent SalesOrder.payment_status == CAPTURED"
    error_id: ERR_ORDER_NOT_CAPTURED
    http_status: 409
    applies_to: "POST /store/sales-order-lines/{id}/start-monogram"
  - priority: 13
    category: business_constraint
    check: "sales-order fulfill requires every monogrammed line monogram_status == DONE"
    error_id: ERR_MONOGRAM_PENDING
    http_status: 409
    applies_to: "POST /store/sales-orders/{id}/fulfill"
  - priority: 14
    category: business_constraint
    check: "OCC: expected_warranty_registration_version equals current WarrantyRegistration.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /store/warranty-claims"
  - priority: 15
    category: business_constraint
    check: "OCC: expected_customer_version equals current Customer.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /store/trade-ins"
  - priority: 16
    category: business_constraint
    check: "required fields present and enum values are members of their declared set"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"
  - priority: 17
    category: business_constraint
    check: "numeric ranges valid: qty >= 1, money fields non-negative, line_discount_pct in [0,1]"
    error_id: ERR_VALIDATION_RANGE
    http_status: 422
    applies_to: "POST /store/sales-order-lines, POST /store/repair-lines, POST /store/products, POST /store/special-orders"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Manager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced/set for all temporal rules"]

  # --- Product ---
  - method: POST
    path: "/store/products"
    description: "Create a catalog product"
    roles: [Manager, Associate]
    code: 201
    input: [sku, name, category, msrp_cents, warranty_months, length_mm, width_mm, height_mm]
    output: Product
    side_effects: ["status defaults ACTIVE"]
  - method: GET
    path: "/store/products/{id}"
    description: "Fetch a product"
    roles: [Manager, Associate, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/store/products"
    description: "List products (paginated); optional category filter"
    roles: [Manager, Associate, Customer]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/store/products/{id}/airline-fit"
    description: "Computed read: whether the product fits an airline's carry-on and checked limits (calc airline_fit)"
    roles: [Manager, Associate, Customer]
    code: 200
    input: [airline_id]
    output: "{ fits_carry_on: boolean, fits_checked: boolean, linear_mm: integer }"
    side_effects: []
  - method: POST
    path: "/store/products/{id}/discontinue"
    description: "Discontinue a product"
    roles: [Manager]
    code: 200
    input: []
    output: Product
    side_effects: ["Product ACTIVE->DISCONTINUED"]

  # --- Airline ---
  - method: POST
    path: "/store/airlines"
    description: "Create an airline size profile"
    roles: [Manager, Associate]
    code: 201
    input: [iata_code, name, carry_on_max_length_mm, carry_on_max_width_mm, carry_on_max_height_mm, checked_linear_limit_mm]
    output: Airline
    side_effects: []
  - method: GET
    path: "/store/airlines/{id}"
    description: "Fetch an airline"
    roles: [Manager, Associate, Customer]
    code: 200
    input: []
    output: Airline
    side_effects: []
  - method: GET
    path: "/store/airlines"
    description: "List airlines (paginated)"
    roles: [Manager, Associate, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Airline[]
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/store/customers"
    description: "Create a customer (loyalty account)"
    roles: [Manager, Associate]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: ["tier defaults BRONZE; balances 0"]
  - method: GET
    path: "/store/customers/{id}"
    description: "Fetch a customer"
    roles: [Manager, Associate, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/store/customers"
    description: "List customers (paginated)"
    roles: [Manager, Associate]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # --- WarrantyRegistration ---
  - method: POST
    path: "/store/warranty-registrations"
    description: "Register a purchased unit's warranty"
    roles: [Manager, Associate, Customer]
    code: 201
    input: [product_id, customer_id, serial_number, purchase_date]
    output: WarrantyRegistration
    side_effects: ["compute warranty_expiry (calc warranty_expiry); status ACTIVE"]
  - method: GET
    path: "/store/warranty-registrations/{id}"
    description: "Fetch a registration"
    roles: [Manager, Associate, Customer]
    code: 200
    input: []
    output: WarrantyRegistration
    side_effects: []
  - method: GET
    path: "/store/warranty-registrations"
    description: "List/filter registrations by product_id and/or customer_id"
    roles: [Manager, Associate, Customer]
    code: 200
    input: ["product_id?", "customer_id?", "limit?", "offset?"]
    output: WarrantyRegistration[]
    side_effects: []
  - method: POST
    path: "/store/warranty-registrations/{id}/void"
    description: "Void a registration"
    roles: [Manager]
    code: 200
    input: []
    output: WarrantyRegistration
    side_effects: ["status ACTIVE->VOID"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/store/warranty-claims"
    description: "Open a warranty claim; supersedes any prior non-terminal claim on the registration. OCC guarded on registration version."
    roles: [Manager, Associate, Customer]
    code: 201
    input: [registration_id, expected_warranty_registration_version, defect_type, description]
    output: WarrantyClaim
    side_effects:
      - "prior non-terminal claim on registration_id -> SUPERSEDED"
      - "increments WarrantyRegistration.version by 1"
      - "status SUBMITTED"
  - method: GET
    path: "/store/warranty-claims/{id}"
    description: "Fetch a claim"
    roles: [Manager, Associate, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/store/warranty-claims"
    description: "List/filter claims by registration_id"
    roles: [Manager, Associate, Customer]
    code: 200
    input: ["registration_id?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/store/warranty-claims/{id}/review"
    description: "Begin review (SUBMITTED->UNDER_REVIEW)"
    roles: [Manager, Associate]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
