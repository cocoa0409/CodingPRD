  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: agency_error_cascade_transmittal_to_form_to_group_to_season
        grounds:
          - state_machines.Transmittal.TRANSMITTED_to_ACCEPTED_WITH_ERRORS
          - state_machines.Form1095C.PENDING_FILING_to_FILED_WITH_ERRORS
          - state_machines.ControlledGroup.DETERMINED_ALE_to_CORRECTION_OPEN
          - entities.FilingSeason.fields.open_correction_count
          - entities.TransmittalError.fields.resolution_status
        distinguishing_aspect: |
          Depth-5 chain from one agency-response call: Transmittal -> TransmittalError ->
          Form1095C.filing_status FILED_WITH_ERRORS -> Form1095C.furnishing_status
          REDELIVERY_REQUIRED -> ControlledGroup CORRECTION_OPEN -> FilingSeason
          open_correction_count 1, all five links observable after a single request.
