              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-5001", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /payments"
              payload: { judgment_id: "${jud_id}", amount_cents: 1000000, received_on: "2026-03-02", source: "DEBTOR_DIRECT" }
              as: CaseManager
              captures: { pay_id: $.data.id }
          trigger:
            - call: "GET /judgments/${jud_id}/payoff"
              payload: { as_of: "2026-08-01", application_order: "PRINCIPAL_FIRST" }
              as: Creditor
              as_user_id: "${cred_id}"
              captures: { q_total: $.data.total_payoff_cents, q_order: $.data.application_order }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { s_total: $.data.total_payoff_cents, s_order: $.data.application_order, s_p: $.data.principal_balance_cents }
          assert:
            - "${q_total} == 4293767"
            - "${q_order} == PRINCIPAL_FIRST"
            - "${s_total} == 4299064"
            - "${s_order} == STATUTORY_ORDER"
            - "${s_p} == 4127192"

