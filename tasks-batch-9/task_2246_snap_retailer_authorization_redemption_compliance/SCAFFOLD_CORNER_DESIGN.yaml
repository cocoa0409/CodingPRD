        distinguishing_aspect: "The processor file replaces every one of the four aggregate fields, not just the total, while pos_derived_total_cents keeps the POS truth for the variance. A variance of exactly 500 is MATCHED (the tolerance test is strictly greater) and 501 flips to VARIANCE, and re-importing simply overwrites."
        test_recipe:
          setup:
            - "The same authorized store, ACTIVE deployment and OPEN 2026-08-01/08-02 period as above with a single 1000c AUTHORIZED sale inside it, clock advanced to 2026-08-02T00:00Z."
          setup_api_calls:
