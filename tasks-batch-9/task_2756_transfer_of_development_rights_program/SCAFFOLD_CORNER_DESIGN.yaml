              as_user_id: "${dev_id}"
          assert:
            - "at intake ReceivingSiteApplication.${rsa_id}.base_units == 48, max_bonus_units == 16, required_backing_units == 16, provisional_bonus_units == 8, allocated_bonus_units == 0"
            - "after finalization ReceivingSiteApplication.${rsa_id}.status == FINALIZED, backed_units == 16, pending_backed_units == 0, allocated_bonus_units == 16"
            - "ReceivingSiteApplication.${rsa_id}.provisional_bonus_units == 8 — the PROVISIONAL figure is preserved, not overwritten by the FINAL variant"
            - "CertificateRedemption.${red_id}.status == CONFIRMED with confirmed_at == 2026-08-10T00:00:00Z"
            - "Certificate.${cert_id}.units_redeemed == 16, units_remaining == 6, units_encumbered == 0, lifecycle_status == PARTIALLY_REDEEMED"
            - "ReceivingArea.${ra_id}.absorbed_units == 16, reserved_units == 0, status == ACTIVE (16 is far below the 500 cap)"
            - "ConservationEasement.${eas_id}.units_redeemed_confirmed == 16 and units_outstanding == 6 and units_issued_total == 22"
            - "Party.${dev_id}.units_held == 6 and certificates_held_count == 1"

      - name: severance_grant_is_trimmed_by_the_parcel_bucket_before_the_area_bucket
        claim_type: correct_result
        grounds:
          - calculations.severance_allocation_grant
          - entities.SeveranceApplication.fields.allocated_units
          - entities.SeveranceApplication.fields.residual_units_retained
          - state_machines.SeveranceApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "The waterfall's first bucket is the PARCEL: a request for 30 units against a parcel holding 10 remaining units inside an area with 200 units of headroom is trimmed to 10 by the parcel, not by the area, and residual_units_retained is 0 because the parcel is exhausted. applied_formula_version is frozen onto the application at the same moment."
        test_recipe:
          setup:
            - "logical clock left at its 2026-08-01T00:00:00Z startup default"
            - "LANDOWNER party; ACTIVE SA-EAST (V1_NET_ACRE, base_rate 0.25, cap 200, severed_units_total 0)"
            - "parcel APN-TEN (40.00 / 0.00 / LOCAL / 0) -> baseline_allocation_units 10, remaining_units 10"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-TEN", gross_acres: 40.00, constrained_acres: 0.00, soil_class: "LOCAL", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 30 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
          assert:
            - "the decision returns 200 and SeveranceApplication.${app_id}.status == APPROVED"
            - "SeveranceApplication.${app_id}.allocated_units == 10 — min(30, parcel 10, area 200)"
            - "SeveranceApplication.${app_id}.residual_units_retained == 0"
            - "SeveranceApplication.${app_id}.applied_formula_version == V1_NET_ACRE and requested_units == 30 (the request is not rewritten)"
            - "the call does NOT return ERR_NO_ALLOCABLE_UNITS or ERR_SENDING_CAP_EXHAUSTED"
            - "SendingParcel.${parcel_id}.severed_units == 0 and remaining_units == 10 — approval sizes the grant, certification consumes it"

      - name: per_unit_rounding_precision_is_covered_by_the_bank_price_difficulty_instance
        claim_type: precision
        grounds:
          - calculations.bank_channel_price
          - calculations.appraisal_reference_value
        distinguishing_aspect: "The rounding ORDER claim: whole cents per unit first, then multiply, so a total-first rounding diverges by a couple of cents."
        excluded_because:
          difficulty_instance: bank_purchase_price_rounds_per_unit_before_multiplying_mode_b
          rationale: "That §1.8 combinatorial_formula instance pins both channels' arithmetic to the cent (BANK_PURCHASE 22 units 27004296 versus the wrong 27004298, BANK_RESALE 5 units 6643515 versus 6643513) and names the wrong-order figures explicitly, which is strictly stronger than a generic precision claim."

      - name: allocation_variant_divergence_is_covered_by_the_dual_variant_instance
        claim_type: variant_divergence
        grounds:
          - calculations.parcel_baseline_allocation
          - entities.SendingArea.fields.allocation_formula_version
        distinguishing_aspect: "The same parcel geometry yields a different baseline under V1_NET_ACRE than under V2_GROSS_DISCOUNTED, and the delta must be reproduced exactly."
        excluded_because:
          difficulty_instance: parcel_allocation_v1_net_acre_vs_v2_gross_discounted
          rationale: "That §1.8 dual_variant_calc instance enrolls the identical parcel in two areas differing only in allocation_formula_version and asserts 22 versus 23 with the ignored-input reasoning for each variant."

  # ===========================================================================
  # §1.9.4 Validations
  # ===========================================================================
  - section: validations
    instances:

      - name: a_landowner_cannot_file_a_severance_for_someone_elses_parcel
        claim_type: violation_to_error
        grounds:
          - validations.priority_6_ownership
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Landowner
        distinguishing_aspect: "Ownership for an entity_backed role is checked against the resource's owning FK, so a landowner who names another landowner as the applicant is refused at priority 6 — after the parcel FK has resolved (priority 5) and before any party-kind or state reasoning."
        test_recipe:
          setup:
            - "logical clock left at its 2026-08-01T00:00:00Z startup default"
            - "two LANDOWNER parties: owner A (holds the parcel) and outsider B"
            - "ACTIVE SA-EAST; parcel APN-001 owned by A"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_a: $.data.id }
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Hollow Creek LLC", contact_email: "hollow@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_b: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_a}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_a}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_b}"
          assert:
            - "the call returns 403 ERR_NOT_RESOURCE_OWNER"
            - "the call does NOT return ERR_ROLE_NOT_PERMITTED (Landowner is a permitted role for this endpoint)"
            - "GET /tdr/severance-applications?sending_parcel_id=${parcel_id} returns total_count 0"
            - "the same payload sent with as_user_id ${own_a} returns 201 with status SUBMITTED"

      - name: a_developer_party_cannot_occupy_the_landowner_applicant_slot
        claim_type: violation_to_error
        grounds:
          - validations.priority_7_party_kind
          - errors.ERR_PARTY_KIND_MISMATCH
          - entities.Party.fields.kind
        distinguishing_aspect: "Party-kind typing is enforced per slot at priority 7, one step AFTER ownership: the acting id equals applicant_party_id so the ownership check passes cleanly, and only then does the DEVELOPER kind in a LANDOWNER-only slot produce a 422 rather than a 403."
        test_recipe:
          setup:
            - "logical clock left at its 2026-08-01T00:00:00Z startup default"
            - "one LANDOWNER party (parcel owner) and one DEVELOPER party"
            - "ACTIVE SA-EAST; parcel APN-001 owned by the landowner"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${dev_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${dev_id}"
          assert:
            - "the call returns 422 ERR_PARTY_KIND_MISMATCH"
            - "the call does NOT return ERR_NOT_RESOURCE_OWNER — the acting id matches the applicant slot it filled"
            - "GET /tdr/severance-applications?applicant_party_id=${dev_id} returns total_count 0"

      - name: the_operator_who_approved_a_severance_cannot_also_certify_it
        claim_type: violation_to_error
        grounds:
          - validations.priority_8_segregation_of_duties
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
          - entities.SeveranceApplication.fields.decided_by_user_id
        distinguishing_aspect: "Segregation of duties compares X-User-ID against the stored decided_by_user_id, not against the ROLE: the same human presenting the ProgramAdministrator role is still refused, and the refusal happens at priority 8 — before the APPROVED state check that would otherwise pass — so no easement is recorded and no certificate is minted."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER party; ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2)"
