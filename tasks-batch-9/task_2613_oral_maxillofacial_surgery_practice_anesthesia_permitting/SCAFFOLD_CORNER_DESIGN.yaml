            - "AnesthesiaPermit.${perm_id}.status is still PROBATION with remediation_deadline_at unchanged and probation_count == 1"
            - "Practice.${prac_id}.sedation_privilege_state is still RESTRICTED"

      - name: clearing_a_prohibitive_case_rejected_but_deferral_allowed
