              payload: { club_id: "${club_a_id}", full_name: "Nadia Cross", email: "nadia.cross@alpha.test", role_type: "HEAD_COACH", has_minor_athlete_contact: true, date_of_birth: "1981-01-21", jurisdiction_codes: ["CA", "NV", "OR"] }
