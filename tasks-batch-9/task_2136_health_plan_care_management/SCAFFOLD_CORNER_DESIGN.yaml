              as_user_id: "${cm_a}"
              captures: { ref: $.data.id }
          trigger:
            - call: "POST /care-management/referrals/${ref}/decision"
              payload: { decision: "ACCEPT" }
              as: CommunityPartner
              as_user_id: "${res_b}"
              captures: { err: $.data.error_id }
            - call: "GET /care-management/referrals/${ref}"
              payload: {}
              as: ProgramAdmin
              captures: { st: $.data.status, dec_at: $.data.decision_at }
          assert:
            - "HTTP 403 with ${err} == ERR_NOT_RESOURCE_OWNER"
            - "${st} == SENT and ${dec_at} == null"
            - "CommunityResource.${res_b}.open_referral_count == 0"

      - name: peer_role_exclusive_operations_are_denied_to_other_roles
        claim_type: other_role_denied
        grounds: ["roles.ProgramAdmin", "roles.UtilizationAnalyst", "roles.CareManager", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Peer-role exclusivity holds in both directions: a UtilizationAnalyst cannot create a Program and a CareManager cannot create an ROI measurement, both returning ERR_FORBIDDEN_ROLE with HTTP 403."
        test_recipe:
          setup: ["One ACTIVE enrollment created under a program; clock stepped so a whole month exists is NOT required because both calls are rejected on role before any body logic."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Peer Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-9501", full_name: "Pee Rex", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /care-management/programs"
              payload: { name: "Analyst Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: UtilizationAnalyst
              captures: { e_prog: $.data.error_id }
            - call: "POST /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "PRE_POST", expected_enrollment_version: "${v1}" }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { e_roi: $.data.error_id }
          assert:
            - "${e_prog} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "${e_roi} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "GET /care-management/enrollments/${enr}/roi-measurements returns total_count == 0"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_transfer_returns_stale_enrollment_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transfer-stale-enrollment]", "errors[ERR_STALE_ENROLLMENT_VERSION]", "validations[priority=35]"]
        distinguishing_aspect: "A transfer carrying the version observed at create time, after activation has already advanced Enrollment.version, is rejected with ERR_STALE_ENROLLMENT_VERSION and HTTP 412; retrying with the current version succeeds and advances the version again."
        test_recipe:
          setup: ["Two RN care managers in CA with capacity 20.0; one enrollment created (version captured) and then activated, which bumps the version."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "OCC Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Dana Ruiz", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_b: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-9601", full_name: "Occ Ozzy", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id, v_create: $.data.version }
            - call: "POST /care-management/enrollments/${enr}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v_active: $.data.version }
          trigger:
            - call: "POST /care-management/enrollments/${enr}/transfer"
              payload: { to_care_manager_id: "${cm_b}", expected_enrollment_version: "${v_create}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /care-management/enrollments/${enr}"
              payload: {}
              as: ProgramAdmin
              captures: { owner_mid: $.data.care_manager_id, v_mid: $.data.version }
            - call: "POST /care-management/enrollments/${enr}/transfer"
              payload: { to_care_manager_id: "${cm_b}", expected_enrollment_version: "${v_active}" }
              as: ProgramAdmin
              captures: { owner_end: $.data.care_manager_id, v_end: $.data.version }
          assert:
            - "${v_active} == ${v_create} + 1"
            - "the stale transfer returns HTTP 412 with ${err} == ERR_STALE_ENROLLMENT_VERSION"
            - "${owner_mid} == ${cm_a} and ${v_mid} == ${v_active}"
            - "${owner_end} == ${cm_b}"
            - "${v_end} == ${v_active} + 1"
            - "CareManager.${cm_a}.assigned_caseload_points == 0.0 and CareManager.${cm_b}.assigned_caseload_points == 1.0"

      - name: occ_stale_version_on_roi_measurement_returns_stale_enrollment_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[roi-measurement-stale-enrollment]", "errors[ERR_STALE_ENROLLMENT_VERSION]"]
        distinguishing_aspect: "The second OCC-guarded endpoint behaves identically on its own parent: an ROI measurement carrying the version observed before an intervening transfer is rejected with HTTP 412, and the retry with the fresh version creates the measurement."
        test_recipe:
          setup:
            - "Clock set to 2026-05-01T00:00:00Z for activation and advanced to 2026-08-01T00:00:00Z for measurement, so three whole months exist."
            - "Enrollment ACTIVE with no interventions and no closed utilization events, so program_cost_cents is 0 and roi_ratio is null."
            - "A transfer between the two version reads advances Enrollment.version."
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /care-management/programs"
              payload: { name: "ROI OCC Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Dana Ruiz", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_b: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-9701", full_name: "Roi Rue", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /care-management/enrollments/${enr}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v_stale: $.data.version }
            - call: "POST /care-management/enrollments/${enr}/transfer"
              payload: { to_care_manager_id: "${cm_b}", expected_enrollment_version: "${v_stale}" }
              as: ProgramAdmin
              captures: { v_fresh: $.data.version }
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "PRE_POST", expected_enrollment_version: "${v_stale}" }
              as: UtilizationAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "PRE_POST", expected_enrollment_version: "${v_fresh}" }
              as: UtilizationAnalyst
              captures: { roi_id: $.data.id, months: $.data.intervention_month_count, pmpm: $.data.baseline_pmpm_cents, pc: $.data.program_cost_cents, ratio: $.data.roi_ratio, gross: $.data.gross_savings_cents }
          assert:
            - "the stale measurement returns HTTP 412 with ${err} == ERR_STALE_ENROLLMENT_VERSION and creates no row"
            - "${months} == 3"
            - "${pmpm} == 0"
            - "${gross} == 0"
            - "${pc} == 0"
            - "${ratio} == null"
            - "GET /care-management/enrollments/${enr}/roi-measurements returns total_count == 1"

      - name: roi_measurement_supersedes_prior_measurement_of_same_method
        claim_type: derived_field_reconciliation
        grounds: ["entities.RoiMeasurement.fields.superseded", "calculations.roi_savings_measurement"]
        distinguishing_aspect: "Re-measuring the same enrollment with the same method marks the earlier RoiMeasurement superseded true while the new row stays false; a measurement with the other method is unaffected."
        test_recipe:
          setup:
            - "Clock set to 2026-05-01T00:00:00Z for activation and advanced to 2026-08-01T00:00:00Z for measurement."
            - "Enrollment ACTIVE with no interventions and no closed utilization events."
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /care-management/programs"
              payload: { name: "Supersede Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-9801", full_name: "Sup Sara", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /care-management/enrollments/${enr}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v1: $.data.version }
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "PRE_POST", expected_enrollment_version: "${v1}" }
              as: UtilizationAnalyst
              captures: { r1: $.data.id, r1_sup: $.data.superseded }
            - call: "GET /care-management/enrollments/${enr}"
              payload: {}
              as: ProgramAdmin
              captures: { v2: $.data.version }
            - call: "POST /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "MATCHED_COHORT", expected_enrollment_version: "${v2}" }
              as: UtilizationAnalyst
              captures: { r_other: $.data.id }
            - call: "GET /care-management/enrollments/${enr}"
              payload: {}
              as: ProgramAdmin
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "PRE_POST", expected_enrollment_version: "${v3}" }
              as: UtilizationAnalyst
              captures: { r2: $.data.id, r2_sup: $.data.superseded }
            - call: "GET /care-management/enrollments/${enr}/roi-measurements"
              payload: { method: "PRE_POST" }
              as: UtilizationAnalyst
          assert:
            - "${r1_sup} == false at creation time"
            - "${r2_sup} == false"
            - "RoiMeasurement.${r1}.superseded == true after the second PRE_POST measurement"
            - "RoiMeasurement.${r_other}.superseded == false"
            - "the PRE_POST list returns total_count == 2"

      - name: cascading_side_effect_depth_stub
        claim_type: cascading_side_effects
        grounds: ["state_machines.SocialNeed.REFERRED_to_UNMET_ESCALATED"]
        excluded_because:
          difficulty_instance: transitive_cascade / referral_unmet_barrier_cascade_depth_three_on_matching_domain
          rationale: "The three-hop referral-to-goal-to-plan chain and its domain conditionality are asserted there."

  - section: consistency_model
    instances:
      - name: activation_response_reflects_every_derived_field_in_the_same_request
        claim_type: immediate
        grounds: ["state_machines.Enrollment.PENDING_to_ACTIVE", "calculations.caseload_weight_points", "calculations.next_touch_due_at_projection"]
        distinguishing_aspect: "consistency_model is immediate: the activate response itself already carries the recomputed cadence_tier, acuity_weight_points and next_touch_due_at, and a read of the care manager in the same sequence already shows the updated caseload ledger - no second call or delay is needed."
        test_recipe:
          setup: ["One PENDING enrollment for a HIGH-tier member on a care manager with capacity_points 20.0; clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Immediate Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-9901", full_name: "Imm Ida", birth_date: "1946-04-06", state_code: "CA", chronic_condition_count: 15 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { tier: $.data.tier, score: $.data.score }
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id, w_pending: $.data.acuity_weight_points, tier_pending: $.data.cadence_tier }
          trigger:
            - call: "POST /care-management/enrollments/${enr}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { tier_active: $.data.cadence_tier, snap: $.data.cadence_tier_snapshot, w_active: $.data.acuity_weight_points, due: $.data.next_touch_due_at, act: $.data.activated_at }
            - call: "GET /care-management/care-managers/${cm_a}"
              payload: {}
              as: ProgramAdmin
              captures: { load: $.data.assigned_caseload_points, status: $.data.capacity_status, n_active: $.data.active_enrollment_count }
          assert:
            - "${tier} == HIGH and ${score} == 90"
            - "${tier_pending} == STANDARD and ${w_pending} == 7.0"
            - "${tier_active} == INTENSIVE and ${snap} == INTENSIVE"
            - "${w_active} == 10.5"
            - "${act} == 2026-08-01T00:00:00.000Z"
            - "${due} == 2026-08-15T00:00:00.000Z"
            - "${load} == 10.5 and ${status} == OPEN and ${n_active} == 1"
