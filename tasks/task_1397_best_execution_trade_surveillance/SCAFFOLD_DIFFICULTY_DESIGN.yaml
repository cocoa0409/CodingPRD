  - rule_id: boundary_precision_check
    instances:
      - name: alert_score_boundary_50_escalate_vs_close
        grounds:
          - calculations.calc_front_running_score
          - validations[priority=29]
          - endpoints["POST /surveillance/surveillance-alerts/{id}/transition"]
        distinguishing_aspect: |
          Complementary boundary on the alert score metric: score == 50 escalates
          (>= 50 inclusive) and cannot close; score == 49 closes (< 50 strict) and
          cannot escalate. Both outcomes reachable only through the alert transition
          endpoint; distinct metric from the sibling instance (lexicon score).
