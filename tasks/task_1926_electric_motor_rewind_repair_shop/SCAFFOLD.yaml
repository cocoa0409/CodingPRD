scenario: |
  1926. Electric Motor Rewind & Repair Shop (EASA-accredited service center): incoming test & failure diagnosis, rewind vs replace economics quote, core loss test & coil data record, EASA-accredited process record, balance/vibration & final test report, rush/emergency service premium, customer spare-motor pool, warranty on repaired unit

domain_name: motor-rewind-shop
api_prefix: /shops

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true
    fields:
      - { name: shop_name, type: string, source: input, description: "Service center display name" }
      - { name: easa_accreditation_id, type: string, source: input, description: "EASA accreditation number; must match regex ^EASA-[0-9]{4,6}$" }
      - { name: labor_rate_small_cents, type: integer, source: input, description: "Hourly labor rate (cents) for frame_mm <= 200" }
      - { name: labor_rate_medium_cents, type: integer, source: input, description: "Hourly labor rate (cents) for 200 < frame_mm <= 355" }
      - { name: labor_rate_large_cents, type: integer, source: input, description: "Hourly labor rate (cents) for 355 < frame_mm <= 560" }
      - { name: labor_rate_xlarge_cents, type: integer, source: input, description: "Hourly labor rate (cents) for frame_mm > 560" }
      - { name: rush_premium_pct, type: number, source: input, description: "Rush multiplier on the labor+materials+supplies subtotal (e.g. 0.35)" }
      - { name: replace_threshold_pct, type: number, source: input, description: "Rewind-vs-replace decision threshold (e.g. 0.65): rewind recommended when rewind_total <= threshold * replacement_cost_cents" }
      - { name: supplies_low_pct, type: number, source: input, description: "Shop-supplies rate on the first SUPPLIES_TIER_BREAK_CENTS of labor+materials (e.g. 0.08)" }
      - { name: supplies_high_pct, type: number, source: input, description: "Shop-supplies marginal rate on the portion of labor+materials above SUPPLIES_TIER_BREAK_CENTS (e.g. 0.06)" }
      - { name: warranty_months, type: integer, source: input, description: "Standard warranty window in months on rewound windings (e.g. 12)" }
      - { name: pool_slot_monthly_cents, type: integer, source: input, description: "Monthly fee per spare-pool slot (cents)" }
      - { name: pool_loan_daily_cents, type: integer, source: input, description: "Daily overdue charge (cents) for a pool loan beyond the grace window" }
      - { name: pool_loan_grace_days, type: integer, source: input, description: "Grace days after work-order delivery before pool-loan overdue charges begin" }
      - { name: currency, type: enum, source: input, default: "USD", description: "ISO currency; only USD supported", constraints: "enum: USD" }

  - name: Customer
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: company_name, type: string, source: input, description: "Customer company name" }
      - { name: account_credit_cents, type: integer, source: computed, default: 0, description: "Credit balance from warranty prorations / overpayments; never negative" }
      - { name: standing, type: enum, source: computed, default: "GOOD", description: "GOOD | WATCH | HOLD — derived: HOLD when any invoice overdue > 30 days, WATCH when any invoice overdue > 0 days, else GOOD", constraints: "enum: GOOD, WATCH, HOLD" }

  - name: Motor
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: owner_customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer; null only for shop-owned pool spares", constraints: "nullable" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique per shop" }
      - { name: rated_kw, type: number, source: input, description: "Nameplate kW rating (> 0)" }
      - { name: frame_mm, type: integer, source: input, description: "IEC frame size in mm (> 0); drives labor-rate tier and vibration limit" }
      - { name: voltage_v, type: integer, source: input, description: "Nameplate voltage" }
      - { name: manufacture_year, type: integer, source: input, description: "Year of manufacture; age_years derived at quote time" }
      - { name: custody, type: enum, source: system, default: "WITH_CUSTOMER", description: "WITH_CUSTOMER | IN_SHOP | IN_POOL | ON_LOAN", constraints: "enum: WITH_CUSTOMER, IN_SHOP, IN_POOL, ON_LOAN" }
      - { name: is_pool_spare, type: boolean, source: input, default: false, description: "True when this motor is a shop-maintained pool spare" }
      - { name: supersedes_motor_id, type: string, source: input, description: "FK -> Motor.id; when a replacement motor record supersedes a scrapped one (self-referential)", constraints: "nullable" }

  - name: WorkOrder
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: motor_id, type: string, source: input, description: "FK -> Motor.id; the unit under repair" }
      - { name: priority, type: enum, source: input, default: "STANDARD", description: "STANDARD | RUSH | EMERGENCY", constraints: "enum: STANDARD, RUSH, EMERGENCY" }
      - { name: no_charge, type: boolean, source: system, default: false, description: "True for warranty-resolution (FREE_REWIND) work orders; forces invoice_total_cents to 0 at release" }
      - { name: status, type: enum, source: system, description: "INTAKE | INCOMING_TEST | DIAGNOSED | QUOTED | AWAITING_APPROVAL | APPROVED | IN_REWIND | BALANCING | FINAL_TEST | READY_FOR_PICKUP | DELIVERED | CLOSED | DECLINED | SCRAPPED", constraints: "enum: INTAKE, INCOMING_TEST, DIAGNOSED, QUOTED, AWAITING_APPROVAL, APPROVED, IN_REWIND, BALANCING, FINAL_TEST, READY_FOR_PICKUP, DELIVERED, CLOSED, DECLINED, SCRAPPED" }
      - { name: failure_diagnosis, type: string, source: input, description: "Recorded at diagnosis step", constraints: "nullable until DIAGNOSED" }
      - { name: rewind_hours, type: integer, source: input, description: "Estimated rewind labor hours recorded at diagnosis (> 0)", constraints: "nullable until DIAGNOSED" }
      - { name: materials_cents, type: integer, source: input, description: "Estimated materials cost in cents recorded at diagnosis (>= 0)", constraints: "nullable until DIAGNOSED" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Quoted cost of a new replacement motor (cents), recorded at diagnosis (> 0)", constraints: "nullable until DIAGNOSED" }
      - { name: active_quote_id, type: string, source: system, description: "FK -> Quote.id; the currently-issued quote (at most one ISSUED quote per work order)", constraints: "nullable" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Sum of line-item charges; rounded per line then summed (see calculation invoice_total)" }
      - { name: delivered_at, type: datetime, source: system, description: "Set when status -> DELIVERED", constraints: "nullable" }
      - { name: closed_at, type: datetime, source: system, description: "Set when status -> CLOSED", constraints: "nullable" }

  - name: TestRecord
    parent: WorkOrder
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id" }
      - { name: kind, type: enum, source: input, description: "INCOMING | CORE_LOSS | FINAL", constraints: "enum: INCOMING, CORE_LOSS, FINAL" }
      - { name: measured_watts, type: integer, source: input, description: "Core-loss watts (CORE_LOSS only)", constraints: "required iff kind=CORE_LOSS" }
      - { name: vibration_mm_s, type: number, source: input, description: "Vibration velocity RMS mm/s (FINAL only)", constraints: "required iff kind=FINAL" }
      - { name: insulation_megohms, type: integer, source: input, description: "Insulation resistance megohms (INCOMING and FINAL)", constraints: "required iff kind IN {INCOMING, FINAL}" }
      - { name: verdict, type: enum, source: computed, description: "PASS | FAIL — computed per kind against motor nameplate", constraints: "enum: PASS, FAIL" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the technician who recorded the test" }
      - { name: notes, type: string, source: input, description: "Free-text", constraints: "nullable" }

  - name: Quote
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id" }
      - { name: variant, type: enum, source: system, description: "AS_QUOTED | TCO_ADJUSTED — which pricing variant produced recommendation", constraints: "enum: AS_QUOTED, TCO_ADJUSTED" }
      - { name: rewind_labor_cents, type: integer, source: computed, description: "rewind_hours * tiered labor rate" }
      - { name: rewind_materials_cents, type: integer, source: computed, description: "= WorkOrder.materials_cents at issue time" }
      - { name: shop_supplies_cents, type: integer, source: computed, description: "Marginal-tier supplies surcharge" }
      - { name: rush_premium_cents, type: integer, source: computed, description: "0 unless WorkOrder.priority IN {RUSH, EMERGENCY}" }
      - { name: rewind_total_cents, type: integer, source: computed, description: "AS_QUOTED total = labor + materials + supplies + rush" }
      - { name: risk_pct, type: number, source: computed, description: "Failure-risk percentage used by TCO variant" }
      - { name: risk_cost_cents, type: integer, source: computed, description: "TCO-only: rewind_total_cents * risk_pct" }
      - { name: tco_total_cents, type: integer, source: computed, description: "TCO-only: rewind_total_cents + risk_cost_cents" }
      - { name: recommendation, type: enum, source: computed, description: "REWIND | REPLACE", constraints: "enum: REWIND, REPLACE" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | ACCEPTED | DECLINED | SUPERSEDED | EXPIRED", constraints: "enum: DRAFT, ISSUED, ACCEPTED, DECLINED, SUPERSEDED, EXPIRED" }
      - { name: issued_at, type: datetime, source: system, description: "Set on transition to ISSUED", constraints: "nullable" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + QUOTE_VALID_DAYS (30)", constraints: "nullable until ISSUED"}

  - name: CoilDataRecord
    parent: WorkOrder
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id" }
      - { name: wire_gauge_awg, type: string, source: input, description: "Magnet wire gauge" }
      - { name: turns_per_coil, type: integer, source: input, description: "Turns per coil (> 0)" }
      - { name: coils_per_phase, type: integer, source: input, description: "Coils per phase (> 0)" }
      - { name: connection, type: enum, source: input, description: "WYE | DELTA", constraints: "enum: WYE, DELTA" }
      - { name: winding_resistance_ohms, type: number, source: input, description: "Measured phase resistance" }
      - { name: easa_form_version, type: string, source: system, description: "EASA form revision pinned from Shop at record creation (e.g. EASA-AR100-2024)" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of winding technician" }

  - name: SparePoolContract
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: slot_count, type: integer, source: input, description: "Number of pool slots contracted (>= 1)" }
      - { name: activated_on, type: datetime, source: system, description: "Contract activation date (server date at POST)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", constraints: "enum: ACTIVE, SUSPENDED, TERMINATED" }
      - { name: first_month_fee_cents, type: integer, source: computed, description: "Prorated first-month fee: slot_count * pool_slot_monthly_cents * remaining_days/days_in_month, rounded half-up to integer cents" }

  - name: PoolLoan
    parent: SparePoolContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> SparePoolContract.id" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the repair job the loan covers" }
      - { name: spare_motor_id, type: string, source: input, description: "FK -> Motor.id; pool spare lent out" }
      - { name: checked_out_at, type: datetime, source: system, description: "Set at checkout" }
      - { name: due_at, type: datetime, source: computed, description: "= linked WorkOrder.delivered_at + pool_loan_grace_days; recomputed on delivery", constraints: "nullable until delivery"}
      - { name: returned_at, type: datetime, source: system, description: "Set on return", constraints: "nullable" }
      - { name: overdue_days, type: integer, source: computed, default: 0, description: "max(0, days(returned_at or now) - days(due_at)) whole-day floor" }
      - { name: overdue_charge_cents, type: integer, source: computed, default: 0, description: "overdue_days * pool_loan_daily_cents" }
      - { name: status, type: enum, source: system, description: "OUT | RETURNED | OVERDUE", constraints: "enum: OUT, RETURNED, OVERDUE" }

  - name: Invoice
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id (denormalized from WorkOrder for ledger queries)" }
      - { name: total_cents, type: integer, source: computed, description: "= WorkOrder.invoice_total_cents at issuance" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of applied payments (waterfall)" }
      - { name: balance_due_cents, type: integer, source: computed, description: "total_cents - amount_paid_cents" }
      - { name: issued_at, type: datetime, source: system, description: "Set at issuance (on READY_FOR_PICKUP)" }
      - { name: due_at, type: datetime, source: computed, description: "issued_at + NET30" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | OVERDUE | VOID", constraints: "enum: OPEN, PAID, OVERDUE, VOID" }

  - name: WarrantyClaim
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id (denormalized)" }
      - { name: failure_mode, type: enum, source: input, description: "WINDING_SHORT | GROUND_FAULT | BEARING_FAILURE | OVERLOAD | INGRESS | MISAPPLICATION | UNAUTHORIZED_REPAIR", constraints: "enum: WINDING_SHORT, GROUND_FAULT, BEARING_FAILURE, OVERLOAD, INGRESS, MISAPPLICATION, UNAUTHORIZED_REPAIR" }
      - { name: filed_at, type: datetime, source: system, description: "Server timestamp at filing" }
      - { name: months_elapsed, type: integer, source: computed, description: "Whole months between delivered_at and filed_at (floor)" }
      - { name: remedy, type: enum, source: input, description: "FREE_REWIND | PRORATED_CREDIT", constraints: "enum: FREE_REWIND, PRORATED_CREDIT; required on approve" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "PRORATED_CREDIT amount: (warranty_months - months_elapsed)/warranty_months * invoice_total_cents, rounded half-up; 0 when months_elapsed >= warranty_months" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | RESOLVED", constraints: "enum: FILED, UNDER_REVIEW, APPROVED, DENIED, RESOLVED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of reviewing ServiceManager", constraints: "nullable" }
      - { name: resolution_work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; new no-charge work order created for FREE_REWIND remedy", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WorkOrder
    initial_state: INTAKE
    terminal_states: [CLOSED, DECLINED, SCRAPPED]
    transitions:
      - from: INTAKE
        to: INCOMING_TEST
        trigger: "POST /shops/{shopId}/work-orders/{woId}/tests (kind=INCOMING recorded)"
        actor: Technician
        preconditions:
          - "Motor.custody must be IN_SHOP (set at intake)"
        side_effects:
          - "status -> INCOMING_TEST on successful record (regardless of PASS/FAIL)"
      - from: INCOMING_TEST
        to: DIAGNOSED
        trigger: "POST /shops/{shopId}/work-orders/{woId}/diagnose"
        actor: Technician
        preconditions:
          - "At least one INCOMING TestRecord exists for this WorkOrder"
          - "payload carries failure_diagnosis, rewind_hours > 0, materials_cents >= 0, replacement_cost_cents > 0"
        side_effects:
          - "status -> DIAGNOSED"
      - from: DIAGNOSED
        to: QUOTED
        trigger: "POST /shops/{shopId}/work-orders/{woId}/quotes (issue)"
        actor: Estimator
        preconditions:
          - "No other Quote for this WorkOrder in status ISSUED (one live quote at a time)"
        side_effects:
          - "Quote computed (both variants); Quote.status DRAFT -> ISSUED; WorkOrder.active_quote_id set; status -> QUOTED"
      - from: QUOTED
        to: AWAITING_APPROVAL
        trigger: "POST /shops/{shopId}/work-orders/{woId}/quotes/{quoteId}/send"
        actor: Estimator
        preconditions:
          - "Quote.status == ISSUED and Quote.id == WorkOrder.active_quote_id"
        side_effects:
          - "status -> AWAITING_APPROVAL"
      - from: AWAITING_APPROVAL
        to: APPROVED
        trigger: "POST /shops/{shopId}/work-orders/{woId}/quotes/{quoteId}/accept"
        actor: Customer
        preconditions:
          - "Quote.status == ISSUED and not expired (now < expires_at)"
          - "Customer.standing != HOLD (HOLD blocks new approval)"
        side_effects:
          - "Quote.status -> ACCEPTED; status -> APPROVED"
      - from: AWAITING_APPROVAL
        to: QUOTED
        trigger: "POST /shops/{shopId}/work-orders/{woId}/quotes/{quoteId}/revise (cyclic revise loop)"
        actor: Estimator
        preconditions:
          - "Quote.status == ISSUED"
        side_effects:
          - "Quote.status -> SUPERSEDED; WorkOrder.active_quote_id cleared; status -> QUOTED"
      - from: AWAITING_APPROVAL
        to: DECLINED
        trigger: "POST /shops/{shopId}/work-orders/{woId}/quotes/{quoteId}/decline"
        actor: Customer
        preconditions:
          - "Quote.status == ISSUED"
        side_effects:
          - "Quote.status -> DECLINED; status -> DECLINED; Motor.custody -> WITH_CUSTOMER"
      - from: APPROVED
        to: IN_REWIND
        trigger: "POST /shops/{shopId}/work-orders/{woId}/start-rewind"
        actor: WindingTechnician
        preconditions:
          - "WorkOrder.status == APPROVED"
          - "No PoolLoan against this WorkOrder in status OUT with spare_motor still IN_POOL (sanity: loan checkout precedes rewind start or follows delivery, never mid-rewind)"
        side_effects:
          - "status -> IN_REWIND"
      - from: IN_REWIND
        to: BALANCING
        trigger: "POST /shops/{shopId}/work-orders/{woId}/coil-data (EASA coil data record completed)"
        actor: WindingTechnician
        preconditions:
          - "CoilDataRecord payload complete (all fields present)"
          - "Segregation of duties: recorded_by (WindingTechnician) may not equal the Technician who recorded the INCOMING test"
        side_effects:
          - "status -> BALANCING"
      - from: BALANCING
        to: FINAL_TEST
        trigger: "POST /shops/{shopId}/work-orders/{woId}/tests (kind=FINAL recorded)"
        actor: Technician
        preconditions:
          - "WorkOrder.status == BALANCING"
          - "Segregation of duties: FINAL test recorder may not equal coil-data recorded_by"
        side_effects:
          - "TestRecord.verdict computed; status -> FINAL_TEST regardless of verdict"
      - from: FINAL_TEST
        to: READY_FOR_PICKUP
        trigger: "POST /shops/{shopId}/work-orders/{woId}/release"
        actor: ServiceManager
        preconditions:
          - "Latest FINAL TestRecord.verdict == PASS (ERR_FINAL_TEST_NOT_PASS otherwise)"
          - "If a CORE_LOSS TestRecord exists its verdict must be PASS"
        side_effects:
          - "Invoice issued (invoice_total computed); status -> READY_FOR_PICKUP"
      - from: FINAL_TEST
        to: IN_REWIND
        trigger: "system (automatic rework loop when latest FINAL verdict == FAIL)"
        actor: system
        preconditions:
          - "Latest FINAL TestRecord.verdict == FAIL"
        side_effects:
          - "status -> IN_REWIND; rework_count conceptually incremented via version bump; a fresh CoilDataRecord is required before next BALANCING"
      - from: READY_FOR_PICKUP
        to: DELIVERED
        trigger: "POST /shops/{shopId}/work-orders/{woId}/deliver"
        actor: ServiceManager
        preconditions:
          - "Invoice.status IN {OPEN, PAID} (delivery allowed with open invoice; payment not a gate)"
        side_effects:
          - "delivered_at = now; Motor.custody -> WITH_CUSTOMER; status -> DELIVERED"
          - "For each PoolLoan with work_order_id == this.id and status OUT: due_at = delivered_at + grace_days; if now > due_at then status -> OVERDUE"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /shops/{shopId}/work-orders/{woId}/close"
        actor: ServiceManager
        preconditions:
          - "No WarrantyClaim for this WorkOrder in status IN {FILED, UNDER_REVIEW, APPROVED} (ERR_CLAIMS_OPEN)"
          - "All PoolLoans for this WorkOrder in status RETURNED (ERR_CLAIMS_OPEN)"
        side_effects:
          - "closed_at = now; status -> CLOSED"
      - from: DELIVERED
        to: CLOSED
        trigger: "system (automatic at warranty_months anniversary of delivered_at when no open claims)"
        actor: system
        preconditions:
          - "now >= delivered_at + Shop.warranty_months months"
          - "No open WarrantyClaim"
        side_effects:
          - "closed_at = now; status -> CLOSED"
      - from: INTAKE
        to: SCRAPPED
        trigger: "POST /shops/{shopId}/work-orders/{woId}/scrap"
        actor: ServiceManager
        preconditions:
          - "WorkOrder.status IN {INTAKE, INCOMING_TEST, DIAGNOSED, QUOTED, AWAITING_APPROVAL}"
        side_effects:
          - "status -> SCRAPPED; Motor.custody -> WITH_CUSTOMER; any ISSUED quote -> SUPERSEDED"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /shops/{shopId}/work-orders/{woId}/quotes (creation computes and issues in one step)"
        actor: Estimator
        preconditions: []
        side_effects:
          - "issued_at = now; expires_at = issued_at + 30 days"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST .../quotes/{quoteId}/accept"
        actor: Customer
        preconditions:
          - "now < expires_at (else auto-EXPIRED)"
        side_effects: ["WorkOrder -> APPROVED"]
      - from: ISSUED
        to: DECLINED
        trigger: "POST .../quotes/{quoteId}/decline"
        actor: Customer
        preconditions: []
        side_effects: ["WorkOrder -> DECLINED; Motor.custody -> WITH_CUSTOMER"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST .../quotes/{quoteId}/revise"
        actor: Estimator
        preconditions: []
        side_effects: ["WorkOrder.active_quote_id cleared; WorkOrder status AWAITING_APPROVAL -> QUOTED"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (lazy: any access or accept attempt when now >= expires_at)"
        actor: system
        preconditions: ["now >= expires_at"]
        side_effects:
          - "WorkOrder.active_quote_id cleared; WorkOrder status AWAITING_APPROVAL -> QUOTED"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "system (automatic when balance_due_cents reaches 0 via payment waterfall)"
        actor: system
        preconditions: ["balance_due_cents == 0"]
        side_effects: []
      - from: OPEN
        to: OVERDUE
        trigger: "system (lazy on read/payment when now > due_at and balance_due_cents > 0)"
        actor: system
        preconditions: ["now > due_at", "balance_due_cents > 0"]
        side_effects: ["Customer.standing recomputed (may become WATCH/HOLD)"]
      - from: OVERDUE
        to: PAID
        trigger: "system (automatic when balance_due_cents reaches 0)"
        actor: system
        preconditions: ["balance_due_cents == 0"]
        side_effects: ["Customer.standing recomputed"]
      - from: OPEN
        to: VOID
        trigger: "POST /shops/{shopId}/invoices/{invoiceId}/void"
        actor: ServiceManager
        preconditions: ["amount_paid_cents == 0 (ERR_INVOICE_HAS_PAYMENTS)"]
        side_effects: ["Customer.standing recomputed"]

  - entity: SparePoolContract
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /shops/{shopId}/pool-contracts/{id}/suspend"
        actor: ServiceManager
        preconditions: ["No PoolLoan under this contract in status OUT or OVERDUE"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /shops/{shopId}/pool-contracts/{id}/resume"
        actor: ServiceManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /shops/{shopId}/pool-contracts/{id}/terminate"
        actor: ServiceManager
        preconditions: ["No PoolLoan under this contract in status OUT or OVERDUE"]
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /shops/{shopId}/pool-contracts/{id}/terminate"
        actor: ServiceManager
        preconditions: []
        side_effects: []

  - entity: PoolLoan
    initial_state: OUT
    terminal_states: [RETURNED]
    transitions:
      - from: OUT
        to: RETURNED
        trigger: "POST /shops/{shopId}/pool-contracts/{cid}/loans/{loanId}/return"
        actor: ServiceManager
        preconditions: []
        side_effects:
          - "returned_at = now; overdue_days/overdue_charge recomputed; spare Motor.custody -> IN_POOL"
          - "If overdue_charge_cents > 0: a surcharge Invoice is issued to the customer"
      - from: OUT
        to: OVERDUE
        trigger: "system (lazy on read when now > due_at and due_at set)"
        actor: system
        preconditions: ["due_at is not null", "now > due_at"]
        side_effects: ["Customer.standing recomputed"]

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [DENIED, RESOLVED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /shops/{shopId}/warranty-claims/{id}/start-review"
        actor: ServiceManager
        preconditions: []
        side_effects: ["reviewed_by = X-User-ID"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /shops/{shopId}/warranty-claims/{id}/approve"
        actor: ServiceManager
        preconditions:
          - "months_elapsed < Shop.warranty_months (in-window; boundary: months_elapsed == warranty_months is out of window)"
          - "failure_mode IN {WINDING_SHORT, GROUND_FAULT, BEARING_FAILURE} (covered set)"
          - "failure_mode NOT IN {OVERLOAD, INGRESS, MISAPPLICATION, UNAUTHORIZED_REPAIR} (exclusion set)"
          - "Segregation of duties: reviewed_by may not equal the X-User-ID that filed the claim when filer was a ServiceManager acting for the customer"
        side_effects:
          - "If remedy == PRORATED_CREDIT: credit_cents computed; Customer.account_credit_cents += credit_cents"
          - "If remedy == FREE_REWIND: a new WorkOrder is created (priority=STANDARD, no_charge=true, same motor/customer) and resolution_work_order_id set; Motor.custody -> IN_SHOP for the resolution intake"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /shops/{shopId}/warranty-claims/{id}/deny"
        actor: ServiceManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: RESOLVED
        trigger: "system (PRORATED_CREDIT: immediate on credit posting; FREE_REWIND: when resolution WorkOrder reaches DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Motor
    initial_state: WITH_CUSTOMER
    terminal_states: []
    transitions:
      - from: WITH_CUSTOMER
        to: IN_SHOP
        trigger: "POST /shops/{shopId}/work-orders (intake captures the motor); or system when a FREE_REWIND warranty approval creates the resolution work order"
        actor: Technician
        preconditions: ["Motor.custody == WITH_CUSTOMER"]
        side_effects: []
      - from: IN_SHOP
        to: WITH_CUSTOMER
        trigger: "WorkOrder DELIVERED / DECLINED / SCRAPPED"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_POOL
        to: ON_LOAN
        trigger: "POST /shops/{shopId}/pool-contracts/{cid}/loans (checkout)"
        actor: ServiceManager
        preconditions: ["Motor.is_pool_spare == true", "Motor.custody == IN_POOL"]
        side_effects: []
      - from: ON_LOAN
        to: IN_POOL
        trigger: "POST .../loans/{loanId}/return"
        actor: ServiceManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-issue-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /shops/{shopId}/work-orders/{woId}/quotes"
    occ_field: expected_work_order_version
    description: |
      Issuing a Quote against a WorkOrder whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      Estimator has just issued a quote (which legitimately sets
      active_quote_id and bumps the work order version) and the current
      client's view of the work order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: work-order-deliver-stale-version
    parent_entity: WorkOrder
    write_endpoint: "POST /shops/{shopId}/work-orders/{woId}/deliver"
    occ_field: expected_work_order_version
    description: |
      Delivering a WorkOrder whose version has advanced since the client last
      observed it is rejected. Captures the case where a warranty-driven
      resolution work order or an invoice void bumped the version and the
      delivering manager's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rewind_labor_tiered
    trigger: "Quote issuance"
    algorithm: tiered_pricing
    formula: |
      rate = labor_rate_small_cents   if motor.frame_mm <= 200
           = labor_rate_medium_cents  if 200 < frame_mm <= 355
           = labor_rate_large_cents   if 355 < frame_mm <= 560
           = labor_rate_xlarge_cents  if frame_mm > 560
      rewind_labor_cents = rewind_hours * rate
    input_set: "WorkOrder.rewind_hours, Motor.frame_mm, Shop labor rates"
    precision: "integer cents (exact)"
    constants:
      TIER_SMALL_MAX: 200
      TIER_MEDIUM_MAX: 355
      TIER_LARGE_MAX: 560

  - name: estimated_rewind_hours
    trigger: "advisory only at diagnosis (not enforced; Estimator may override)"
    algorithm: aggregation
    formula: |
      est_hours = round_half_up(6 + 0.08 * motor.rated_kw) to integer hours
    input_set: "Motor.rated_kw"
    precision: "integer hours, round_half_up"
    note: "Advisory only; the authoritative rewind_hours is the Estimator-entered WorkOrder field. Used by tests to cross-check plausibility."

  - name: shop_supplies_marginal
    trigger: "Quote issuance"
    algorithm: tiered_pricing
    formula: |
      base = rewind_labor_cents + rewind_materials_cents
      if base <= SUPPLIES_TIER_BREAK_CENTS:
        shop_supplies_cents = round_half_up(base * shop.supplies_low_pct)
      else:
        shop_supplies_cents = round_half_up(SUPPLIES_TIER_BREAK_CENTS * shop.supplies_low_pct
                                            + (base - SUPPLIES_TIER_BREAK_CENTS) * shop.supplies_high_pct)
      # Pinned: marginal tiering (low rate on first break, high rate only on excess),
      # NOT flat high-rate on the whole base. Rounding applied once at the end.
    input_set: "rewind_labor_cents, WorkOrder.materials_cents, Shop supplies rates"
    precision: "integer cents, round_half_up applied once after tier split"
    constants:
      SUPPLIES_TIER_BREAK_CENTS: 100000

  - name: rush_premium
    trigger: "Quote issuance"
    algorithm: threshold
    formula: |
      subtotal = rewind_labor_cents + rewind_materials_cents + shop_supplies_cents
      if work_order.priority == STANDARD: rush_premium_cents = 0
      if work_order.priority == RUSH:     rush_premium_cents = round_half_up(subtotal * shop.rush_premium_pct)
      if work_order.priority == EMERGENCY: rush_premium_cents = round_half_up(subtotal * shop.rush_premium_pct * 1.5)
      # Pinned: premium computed on subtotal INCLUDING supplies, after supplies rounding.
    input_set: "WorkOrder.priority, subtotal"
    precision: "integer cents, round_half_up"
    constants:
      EMERGENCY_MULT: 1.5

  - name: rewind_vs_replace_quote
    trigger: "Quote issuance"
    algorithm: forward_looking
    formula: |
      rewind_total_cents = rewind_labor_cents + rewind_materials_cents + shop_supplies_cents + rush_premium_cents
      replace_threshold_cents = round_half_up(shop.replace_threshold_pct * work_order.replacement_cost_cents)
      # Both variants are computed on every quote and exposed side-by-side.
      # PINNED: Quote.recommendation is always the TCO_ADJUSTED decision
      # (the conservative EASA-recommended basis); Quote.variant is pinned to
      # TCO_ADJUSTED. The AS_QUOTED decision is derivable from the exposed
      # rewind_total_cents vs replace_threshold_cents but is NOT the stored
      # recommendation.
      if tco_total_cents <= replace_threshold_cents: recommendation = REWIND
      else: recommendation = REPLACE
    input_set: "Quote line items, WorkOrder.replacement_cost_cents, Shop.replace_threshold_pct"
    precision: "integer cents, round_half_up for threshold"
    variants:
      - name: AS_QUOTED
        when: "Reference variant shown to the customer; decision would compare raw rewind_total_cents to threshold"
        difference: "Ignores failure-risk adjustment; identical inputs can disagree with the stored TCO-based recommendation"
      - name: TCO_ADJUSTED
        when: "Authoritative variant; the stored Quote.recommendation uses this decision"
        difference: "Adds risk_cost_cents = round_half_up(rewind_total_cents * risk_pct) before the threshold comparison; identical inputs can flip the recommendation vs AS_QUOTED"

  - name: failure_risk_pct
    trigger: "Quote issuance (feeds TCO_ADJUSTED variant)"
    algorithm: threshold
    formula: |
      age_years = current_year - motor.manufacture_year  (current_year from server clock)
      if any CORE_LOSS TestRecord for this WorkOrder has verdict == FAIL: risk_pct = 0.35
      else if age_years >= 15: risk_pct = 0.25
      else if age_years >= 8:  risk_pct = 0.15
      else:                    risk_pct = 0.08
      # Pinned precedence: core-loss FAIL dominates age tiers.
    input_set: "Motor.manufacture_year, CORE_LOSS TestRecord verdicts, server clock year"
    precision: "exact decimal"
    constants:
      RISK_CORE_FAIL: 0.35
      RISK_AGE_15: 0.25
      RISK_AGE_8: 0.15
      RISK_BASE: 0.08

  - name: core_loss_verdict
    trigger: "TestRecord creation with kind=CORE_LOSS"
    algorithm: threshold
    formula: |
      rated_watts = motor.rated_kw * 1000
      loss_pct = measured_watts / rated_watts
      verdict = PASS if loss_pct <= CORE_LOSS_MAX_PCT else FAIL
      # Boundary pinned: exactly 5.000% is PASS (<= comparison).
    input_set: "measured_watts, Motor.rated_kw"
    precision: "percentage compared exactly (Decimal division, no pre-rounding of loss_pct)"
    constants:
      CORE_LOSS_MAX_PCT: 0.05

  - name: vibration_verdict
    trigger: "TestRecord creation with kind=FINAL"
    algorithm: threshold
    formula: |
      if motor.frame_mm <= 315: limit = 2.8
      else if motor.frame_mm <= 630: limit = 3.5
      else: limit = 4.5
      verdict = PASS if vibration_mm_s <= limit else FAIL
      # Boundary pinned: measured == limit is PASS; any value strictly greater is FAIL.
    input_set: "vibration_mm_s, Motor.frame_mm"
    precision: "one-decimal comparison; client sends number, server compares as Decimal"
    constants:
      VIB_LIMIT_SMALL: 2.8
      VIB_LIMIT_MEDIUM: 3.5
      VIB_LIMIT_LARGE: 4.5
      FRAME_SMALL_MAX: 315
      FRAME_MEDIUM_MAX: 630

  - name: invoice_total
    trigger: "WorkOrder release (READY_FOR_PICKUP transition)"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: each line item is computed and rounded to integer
      # cents FIRST, then summed. Never sum-then-round.
      lines = [INCOMING_TEST_FEE_CENTS]
      if a CORE_LOSS TestRecord exists: lines += [CORE_LOSS_TEST_FEE_CENTS]
      if WorkOrder reached BALANCING at least once: lines += [BALANCING_FEE_CENTS]
      lines += [rewind_labor_cents, rewind_materials_cents, shop_supplies_cents, rush_premium_cents]
      lines += [FINAL_TEST_FEE_CENTS]
      invoice_total_cents = sum(lines)
      if work_order.no_charge: invoice_total_cents = 0   # warranty FREE_REWIND resolution orders are never billed
    input_set: "Quote line items (from the ACCEPTED quote), TestRecord kinds present, Shop fee schedule"
    precision: "integer cents; per-line round_half_up then sum"
    constants:
      INCOMING_TEST_FEE_CENTS: 7500
      CORE_LOSS_TEST_FEE_CENTS: 12000
      BALANCING_FEE_CENTS: 9500
      FINAL_TEST_FEE_CENTS: 8500

  - name: payment_waterfall
    trigger: "POST /shops/{shopId}/customers/{customerId}/payments"
    algorithm: waterfall_allocation
    formula: |
      # Allocate a single payment across the customer's OPEN/OVERDUE invoices,
      # oldest issued_at first; ties broken by created_at ASC (never id).
      remaining = payment_cents
      for invoice in sort(invoices where customer_id == customer and status IN {OPEN, OVERDUE},
                          by issued_at ASC, then created_at ASC):
        applied = min(remaining, invoice.balance_due_cents)
        invoice.amount_paid_cents += applied
        invoice.balance_due_cents -= applied
        remaining -= applied
        if invoice.balance_due_cents == 0: invoice.status -> PAID
      if remaining > 0: Customer.account_credit_cents += remaining
    input_set: "Customer's OPEN/OVERDUE invoices"
    precision: "integer cents"
    note: "Recompute Customer.standing after every payment."

  - name: pool_first_month_fee
    trigger: "SparePoolContract creation"
    algorithm: aggregation
    formula: |
      full = slot_count * shop.pool_slot_monthly_cents
      days_in_month = number of days in the calendar month of activated_on
      remaining_days = days_in_month - day_of_month(activated_on) + 1   # activation day counts
      first_month_fee_cents = round_half_up(full * remaining_days / days_in_month) to integer cents
    input_set: "slot_count, shop.pool_slot_monthly_cents, activated_on"
    precision: "integer cents, round_half_up to whole cents"

  - name: pool_overdue_charge
    trigger: "PoolLoan return, or lazy on read when status OVERDUE"
    algorithm: aggregation
    formula: |
      if due_at is null: overdue_days = 0
      else:
        end = returned_at if returned_at else now
        overdue_days = max(0, floor((end - due_at) in whole days))
      overdue_charge_cents = overdue_days * shop.pool_loan_daily_cents
    input_set: "due_at, returned_at/now, shop.pool_loan_daily_cents"
    precision: "whole days floor; integer cents"

  - name: warranty_prorated_credit
    trigger: "WarrantyClaim approval with remedy=PRORATED_CREDIT"
    algorithm: aggregation
    formula: |
      months_elapsed = whole months between WorkOrder.delivered_at and WarrantyClaim.filed_at (floor)
      remaining_months = max(0, shop.warranty_months - months_elapsed)
      credit_cents = round_half_up(invoice_total_cents * remaining_months / shop.warranty_months) to integer cents
      # Boundary pinned: months_elapsed == warranty_months -> credit_cents == 0 and
      # the claim is out of window (approval rejected); months_elapsed == warranty_months - 1
      # yields the minimum non-zero credit.
    input_set: "WorkOrder.delivered_at, filed_at, invoice_total_cents, shop.warranty_months"
    precision: "integer cents, round_half_up"

  - name: customer_standing
    trigger: "Any Invoice status change, payment, PoolLoan overdue flip, or lazy read"
    algorithm: aggregation
    formula: |
      overdue_invoices = invoices where customer_id == customer and status == OVERDUE
      overdue_loans = pool loans joined via SparePoolContract where contract.customer_id == customer
                      and loan.status == OVERDUE
      if any invoice in overdue_invoices with (now - invoice.due_at) > 30 days: standing = HOLD
      else if any invoice in overdue_invoices: standing = WATCH
      else if any loan in overdue_loans: standing = WATCH
      else: standing = GOOD
      # Boundary pinned: exactly 30 days overdue is WATCH, not HOLD (> 30, not >=).
      # Overdue pool loans can only contribute WATCH, never HOLD.
    input_set: "Customer invoices; customer's PoolLoans via SparePoolContract.customer_id"
    precision: "whole days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint (RBAC matrix)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist and belong to the declared parent chain (shop -> work-order -> child), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"
  - priority: 4
    category: business_referential
    check: "Body FK references resolve: motor_id/customer_id on work-order create; work_order_id/spare_motor_id on loan checkout"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST endpoints with body FKs"
  - priority: 5
    category: state
    check: "Target entity in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_temporal
    check: "Quote accept: now < quote.expires_at (expired quote auto-transitions to EXPIRED first)"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST .../quotes/{quoteId}/accept"
  - priority: 7
    category: business_fiscal
    check: "Quote accept: Customer.standing != HOLD"
    error_id: ERR_CUSTOMER_ON_HOLD
    http_status: 402
    applies_to: "POST .../quotes/{quoteId}/accept"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: coil-data recorder != incoming-test recorder; final-test recorder != coil-data recorder; warranty approver != claim filer (when filer was a manager)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST .../coil-data; POST .../tests kind=FINAL; POST .../warranty-claims/{id}/approve"
  - priority: 9
    category: business_constraint
    check: "Uniqueness: one ISSUED quote per WorkOrder; Motor.serial_number unique per shop; one ACTIVE contract per (customer, shop)"
    error_id: ERR_DUPLICATE_ACTIVE
    http_status: 409
    applies_to: "quote issue, motor create, pool contract create"
  - priority: 10
    category: business_constraint
    check: "Release gates: latest FINAL verdict == PASS; any CORE_LOSS record must be PASS"
    error_id: ERR_FINAL_TEST_NOT_PASS
    http_status: 409
    applies_to: "POST .../release"
  - priority: 11
    category: business_constraint
    check: "Pool loan checkout: contract.status == ACTIVE, count(loans under contract with status IN {OUT, OVERDUE}) < slot_count, spare motor custody == IN_POOL, spare rated_kw within +/-20% (inclusive) of the unit under repair"
    error_id: ERR_POOL_UNAVAILABLE
    http_status: 409
    applies_to: "POST .../loans"
  - priority: 12
    category: business_fiscal
    check: "Warranty approval window: months_elapsed < shop.warranty_months"
    error_id: ERR_WARRANTY_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST .../warranty-claims/{id}/approve"
  - priority: 13
    category: business_safety
    check: "Warranty covered failure mode: failure_mode in {WINDING_SHORT, GROUND_FAULT, BEARING_FAILURE}"
    error_id: ERR_WARRANTY_EXCLUDED_MODE
    http_status: 422
    applies_to: "POST .../warranty-claims/{id}/approve"
  - priority: 14
    category: business_constraint
    check: "Input shape: rewind_hours > 0, replacement_cost_cents > 0, materials_cents >= 0, slot_count >= 1, measured_watts > 0, insulation_megohms > 0, vibration_mm_s >= 0"
    error_id: ERR_INVALID_INPUT
    http_status: 400
    applies_to: "POST endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Shop ---
  - method: POST
    path: "/shops"
    description: "Create a shop (service center configuration)"
    roles: [ShopAdmin]
    code: 201
    input: [shop_name, easa_accreditation_id, labor_rate_small_cents, labor_rate_medium_cents, labor_rate_large_cents, labor_rate_xlarge_cents, rush_premium_pct, replace_threshold_pct, supplies_low_pct, supplies_high_pct, warranty_months, pool_slot_monthly_cents, pool_loan_daily_cents, pool_loan_grace_days, "currency?"]
    output: Shop
    side_effects: ["version=1"]

  - method: GET
    path: "/shops/{shopId}"
    description: "Get a shop"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: Shop
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/shops/{shopId}/customers"
    description: "Register a customer"
    roles: [ServiceManager]
    code: 201
    input: [company_name]
    output: Customer
    side_effects: ["account_credit_cents=0, standing=GOOD"]

  - method: GET
    path: "/shops/{shopId}/customers"
    description: "List customers"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "standing?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/customers/{customerId}"
    description: "Get a customer (recomputes standing lazily)"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: ["standing recomputed lazily"]

  # --- Motor ---
  - method: POST
    path: "/shops/{shopId}/motors"
    description: "Register a motor (customer unit or pool spare)"
    roles: [ServiceManager]
    code: 201
    input: [owner_customer_id, serial_number, rated_kw, frame_mm, voltage_v, manufacture_year, "is_pool_spare?", "supersedes_motor_id?"]
    output: Motor
    side_effects: ["custody=WITH_CUSTOMER or IN_POOL when is_pool_spare=true"]

  - method: GET
    path: "/shops/{shopId}/motors"
    description: "List motors (filtered)"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "owner_customer_id?", "custody?", "is_pool_spare?"]
    output: "Motor[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/motors/{motorId}"
    description: "Get a motor"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: Motor
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/shops/{shopId}/work-orders"
    description: "Intake a work order (captures motor into shop)"
    roles: [Technician]
    code: 201
    input: [customer_id, motor_id, "priority?"]
    output: WorkOrder
    side_effects: ["Motor.custody WITH_CUSTOMER -> IN_SHOP", "status=INTAKE", "invoice_total_cents=0"]

  - method: GET
    path: "/shops/{shopId}/work-orders"
    description: "List work orders"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?", "priority?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/work-orders/{woId}"
    description: "Get a work order"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/tests"
    description: "Record a test (INCOMING / CORE_LOSS / FINAL); verdict computed server-side"
    roles: [Technician]
    code: 201
    input: [kind, "measured_watts?", "vibration_mm_s?", "insulation_megohms?", "notes?"]
    output: TestRecord
    side_effects:
      - "verdict computed per kind"
      - "kind=INCOMING and status INTAKE -> INCOMING_TEST"
      - "kind=FINAL and status BALANCING -> FINAL_TEST; if verdict FAIL, status FINAL_TEST -> IN_REWIND (rework loop)"

  - method: GET
    path: "/shops/{shopId}/work-orders/{woId}/tests"
    description: "List test records for a work order"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: ["limit?", "offset?", "kind?"]
    output: "TestRecord[]"
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/diagnose"
    description: "Record failure diagnosis and estimate inputs"
    roles: [Technician]
    code: 200
    input: [failure_diagnosis, rewind_hours, materials_cents, replacement_cost_cents]
    output: WorkOrder
    side_effects: ["status INCOMING_TEST -> DIAGNOSED"]

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/scrap"
    description: "Scrap a pre-approval work order"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> SCRAPPED", "Motor.custody -> WITH_CUSTOMER", "ISSUED quote -> SUPERSEDED"]

  # --- Quote ---
  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/quotes"
    description: "Compute and issue a quote (both variants side-by-side)"
    roles: [Estimator]
    code: 201
    input: [expected_work_order_version]
    output: Quote
    side_effects:
      - "increments WorkOrder.version by 1"
      - "Quote DRAFT -> ISSUED; issued_at/expires_at set"
      - "WorkOrder.active_quote_id set; status DIAGNOSED -> QUOTED (or QUOTED stays on re-issue after revise)"

  - method: GET
    path: "/shops/{shopId}/work-orders/{woId}/quotes"
    description: "List quotes for a work order"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Quote[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/work-orders/{woId}/quotes/{quoteId}"
    description: "Get a quote"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["lazy EXPIRED transition when now >= expires_at"]

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/quotes/{quoteId}/send"
    description: "Send an issued quote to the customer (moves WO to AWAITING_APPROVAL)"
    roles: [Estimator]
    code: 200
    input: []
    output: Quote
    side_effects: ["WorkOrder QUOTED -> AWAITING_APPROVAL"]

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/quotes/{quoteId}/accept"
    description: "Customer accepts a quote"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote -> ACCEPTED; WorkOrder AWAITING_APPROVAL -> APPROVED"]

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/quotes/{quoteId}/decline"
    description: "Customer declines a quote"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote -> DECLINED; WorkOrder -> DECLINED; Motor.custody -> WITH_CUSTOMER"]

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/quotes/{quoteId}/revise"
    description: "Estimator supersedes the live quote (cyclic back to QUOTED for re-issue)"
    roles: [Estimator]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote -> SUPERSEDED; WorkOrder AWAITING_APPROVAL -> QUOTED; active_quote_id cleared"]

  # --- Rewind process ---
  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/start-rewind"
    description: "Begin the rewind"
    roles: [WindingTechnician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status APPROVED -> IN_REWIND"]

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/coil-data"
    description: "Record the EASA coil data record (immutable)"
    roles: [WindingTechnician]
    code: 201
    input: [wire_gauge_awg, turns_per_coil, coils_per_phase, connection, winding_resistance_ohms]
    output: CoilDataRecord
    side_effects:
      - "easa_form_version pinned from shop (EASA-AR100-2024)"
      - "status IN_REWIND -> BALANCING"
      - "segregation: recorded_by != incoming-test recorder"

  - method: GET
    path: "/shops/{shopId}/work-orders/{woId}/coil-data"
    description: "List coil data records for a work order (0..n due to rework loop)"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CoilDataRecord[]"
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/release"
    description: "Release for pickup; issues the invoice"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["invoice_total computed (per-line rounding then sum)", "Invoice created OPEN", "status FINAL_TEST -> READY_FOR_PICKUP"]

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/deliver"
    description: "Deliver the repaired unit"
    roles: [ServiceManager]
    code: 200
    input: [expected_work_order_version]
    output: WorkOrder
    side_effects:
      - "increments WorkOrder.version by 1"
      - "delivered_at set; Motor.custody -> WITH_CUSTOMER; status -> DELIVERED"
      - "PoolLoans OUT: due_at recomputed; overdue loans -> OVERDUE"

  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/close"
    description: "Close a delivered work order"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["closed_at set; status DELIVERED -> CLOSED"]

  # --- Invoice / payments ---
  - method: GET
    path: "/shops/{shopId}/work-orders/{woId}/invoices"
    description: "List invoices for a work order"
    roles: [ShopAdmin, Estimator, ServiceManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: ["lazy OVERDUE transitions applied"]

  - method: GET
    path: "/shops/{shopId}/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [ShopAdmin, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["lazy OVERDUE transition applied"]

  - method: POST
    path: "/shops/{shopId}/invoices/{invoiceId}/void"
    description: "Void an unpaid invoice"
    roles: [ServiceManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice OPEN -> VOID", "Customer.standing recomputed"]

  - method: POST
    path: "/shops/{shopId}/customers/{customerId}/payments"
    description: "Record a customer payment; waterfall allocation across open invoices"
    roles: [ServiceManager]
    code: 201
    input: [payment_cents]
    output: "{ applied: [{invoice_id, applied_cents}], credit_added_cents: integer }"
    side_effects: ["oldest-first allocation (issued_at ASC, created_at ASC tiebreak)", "invoices may become PAID", "remainder -> account_credit_cents", "standing recomputed"]

  # --- Spare pool ---
  - method: POST
    path: "/shops/{shopId}/pool-contracts"
    description: "Create a spare-pool contract"
    roles: [ServiceManager]
    code: 201
    input: [customer_id, slot_count]
    output: SparePoolContract
    side_effects: ["activated_on = now", "first_month_fee_cents computed (prorated)", "status=ACTIVE"]

  - method: GET
    path: "/shops/{shopId}/pool-contracts"
    description: "List pool contracts"
    roles: [ShopAdmin, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?"]
    output: "SparePoolContract[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/pool-contracts/{contractId}"
    description: "Get a pool contract"
    roles: [ShopAdmin, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: SparePoolContract
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/pool-contracts/{contractId}/suspend"
    description: "Suspend a pool contract"
    roles: [ServiceManager]
    code: 200
    input: []
    output: SparePoolContract
    side_effects: ["ACTIVE -> SUSPENDED"]

  - method: POST
    path: "/shops/{shopId}/pool-contracts/{contractId}/resume"
    description: "Resume a suspended contract"
    roles: [ServiceManager]
    code: 200
    input: []
    output: SparePoolContract
    side_effects: ["SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/shops/{shopId}/pool-contracts/{contractId}/terminate"
    description: "Terminate a pool contract"
    roles: [ServiceManager]
    code: 200
    input: []
    output: SparePoolContract
    side_effects: ["ACTIVE|SUSPENDED -> TERMINATED"]

  - method: POST
    path: "/shops/{shopId}/pool-contracts/{contractId}/loans"
    description: "Check out a pool spare against a work order"
    roles: [ServiceManager]
    code: 201
    input: [work_order_id, spare_motor_id]
    output: PoolLoan
    side_effects:
      - "Motor.custody IN_POOL -> ON_LOAN"
      - "checked_out_at = now; due_at null until delivery"
      - "validations: contract ACTIVE; active loans < slot_count; spare rated_kw within +/-20% of repair unit"

  - method: GET
    path: "/shops/{shopId}/pool-contracts/{contractId}/loans"
    description: "List loans under a contract"
    roles: [ShopAdmin, Estimator, ServiceManager, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PoolLoan[]"
    side_effects: ["lazy OVERDUE transitions applied"]

  - method: POST
    path: "/shops/{shopId}/pool-contracts/{contractId}/loans/{loanId}/return"
    description: "Return a pool spare"
    roles: [ServiceManager]
    code: 200
    input: []
    output: PoolLoan
    side_effects:
      - "returned_at set; overdue charge computed; surcharge invoice when charge > 0"
      - "Motor.custody ON_LOAN -> IN_POOL"
      - "status -> RETURNED"

  # --- Warranty ---
  - method: POST
    path: "/shops/{shopId}/work-orders/{woId}/warranty-claims"
    description: "File a warranty claim on a delivered work order"
    roles: [Customer, ServiceManager]
    code: 201
    input: [failure_mode]
    output: WarrantyClaim
    side_effects: ["filed_at = now; months_elapsed computed; status=FILED"]

  - method: GET
    path: "/shops/{shopId}/work-orders/{woId}/warranty-claims"
    description: "List warranty claims for a work order"
    roles: [ShopAdmin, Technician, Estimator, ServiceManager, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/warranty-claims/{claimId}"
    description: "Get a warranty claim"
    roles: [ShopAdmin, Technician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/warranty-claims/{claimId}/start-review"
    description: "Move claim to UNDER_REVIEW"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["reviewed_by set"]

  - method: POST
    path: "/shops/{shopId}/warranty-claims/{claimId}/approve"
    description: "Approve a claim with a remedy"
    roles: [ServiceManager]
    code: 200
    input: [remedy]
    output: WarrantyClaim
    side_effects:
      - "window + exclusion + segregation validations"
      - "PRORATED_CREDIT: credit_cents computed; Customer.account_credit_cents += credit_cents; status -> RESOLVED immediately"
      - "FREE_REWIND: resolution WorkOrder created (no-charge); status -> APPROVED until resolution delivered"

  - method: POST
    path: "/shops/{shopId}/warranty-claims/{claimId}/deny"
    description: "Deny a claim"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> DENIED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; lazy transitions re-evaluate on next read"]

  # --- Flat read aliases (query convenience + FK reverse-reachability) ---
  # These read-only aliases mirror the nested GETs; every list supports
  # filtering by every FK the entity declares, plus shop_id scoping.
  - method: GET
    path: "/shops/customers/{customerId}"
    description: "Flat alias: get a customer by id"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: ["standing recomputed lazily"]
  - method: GET
    path: "/shops/customers"
    description: "Flat alias: list/filter customers"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "shop_id?", "standing?"]
    output: "Customer[]"
    side_effects: []
  - method: GET
    path: "/shops/motors/{motorId}"
    description: "Flat alias: get a motor by id"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: Motor
    side_effects: []
  - method: GET
    path: "/shops/motors"
    description: "Flat alias: list/filter motors"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "shop_id?", "owner_customer_id?", "supersedes_motor_id?", "custody?", "is_pool_spare?"]
    output: "Motor[]"
    side_effects: []
  - method: GET
    path: "/shops/work-orders/{woId}"
    description: "Flat alias: get a work order by id"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/shops/work-orders"
    description: "Flat alias: list/filter work orders"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "shop_id?", "customer_id?", "motor_id?", "active_quote_id?", "status?", "priority?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: GET
    path: "/shops/test-records/{testRecordId}"
    description: "Flat alias: get a test record by id"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: TestRecord
    side_effects: []
  - method: GET
    path: "/shops/test-records"
    description: "Flat alias: list/filter test records"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "work_order_id?", "kind?"]
    output: "TestRecord[]"
    side_effects: []
  - method: GET
    path: "/shops/quotes/{quoteId}"
    description: "Flat alias: get a quote by id"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["lazy EXPIRED transition"]
  - method: GET
    path: "/shops/quotes"
    description: "Flat alias: list/filter quotes"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "work_order_id?", "status?"]
    output: "Quote[]"
    side_effects: []
  - method: GET
    path: "/shops/coil-data-records/{coilDataRecordId}"
    description: "Flat alias: get a coil data record by id"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: CoilDataRecord
    side_effects: []
  - method: GET
    path: "/shops/coil-data-records"
    description: "Flat alias: list/filter coil data records"
    roles: [ShopAdmin, Technician, WindingTechnician, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "work_order_id?"]
    output: "CoilDataRecord[]"
    side_effects: []
  - method: GET
    path: "/shops/pool-contracts-flat/{contractId}"
    description: "Flat alias: get a pool contract by id"
    roles: [ShopAdmin, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: SparePoolContract
    side_effects: []
  - method: GET
    path: "/shops/pool-contracts-flat"
    description: "Flat alias: list/filter pool contracts"
    roles: [ShopAdmin, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "shop_id?", "customer_id?", "status?"]
    output: "SparePoolContract[]"
    side_effects: []
  - method: GET
    path: "/shops/pool-loans/{loanId}"
    description: "Flat alias: get a pool loan by id"
    roles: [ShopAdmin, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: PoolLoan
    side_effects: ["lazy OVERDUE transition"]
  - method: GET
    path: "/shops/pool-loans"
    description: "Flat alias: list/filter pool loans"
    roles: [ShopAdmin, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "contract_id?", "work_order_id?", "spare_motor_id?", "status?"]
    output: "PoolLoan[]"
    side_effects: ["lazy OVERDUE transitions applied"]
  - method: GET
    path: "/shops/invoices-flat/{invoiceId}"
    description: "Flat alias: get an invoice by id"
    roles: [ShopAdmin, Estimator, ServiceManager, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["lazy OVERDUE transition"]
  - method: GET
    path: "/shops/invoices-flat"
    description: "Flat alias: list/filter invoices"
    roles: [ShopAdmin, Estimator, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "work_order_id?", "customer_id?", "status?"]
    output: "Invoice[]"
    side_effects: ["lazy OVERDUE transitions applied"]
  - method: GET
    path: "/shops/warranty-claims-flat/{claimId}"
    description: "Flat alias: get a warranty claim by id"
    roles: [ShopAdmin, Technician, Estimator, ServiceManager, Customer]
