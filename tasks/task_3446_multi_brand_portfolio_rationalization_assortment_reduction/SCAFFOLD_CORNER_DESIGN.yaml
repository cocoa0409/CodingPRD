        distinguishing_aspect: "units_rejected > units_produced is physically impossible -> ERR_INVALID_RUN at priority 15; the run is not recorded and the counter is untouched."
        test_recipe:
          setup: ["Transfer PLANNED S -> T"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA13", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA13-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA13-T", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-VA13", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { t_id: $.data.id } }
