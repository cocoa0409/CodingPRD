            - "after meeting A is CANCELLED the identical candidate is accepted with HTTP 201"
            - "the accepted meeting has status SCHEDULED and only one non-cancelled meeting exists for the club"

      - name: speech_role_rolling_window_capacity_and_release_exclusion
