            - call: "POST /v1/autoship-plans/${plan_d3b}/items"
              payload: { product_id: "${prod_d3b}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_d3b}"
              captures: { item_d3b: "$.data.id" }
            - call: "GET /v1/autoship-plans/${plan_d3b}"
              payload: {}
              as: Customer
