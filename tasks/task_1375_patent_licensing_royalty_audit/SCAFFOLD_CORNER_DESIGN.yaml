scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_licensee_missing_required_field
        claim_type: required_fields
        grounds: ["entities.Licensee.fields.legal_name", "errors[ERR_VALIDATION]", "validations[priority=5]"]
        distinguishing_aspect: "Omitting required legal_name yields ERR_VALIDATION (400); other required fields (tax_id, contact_email) behave identically."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/licensees"
              payload: { tax_id: "TAX-NOF-1", contact_email: "x@x.test" }
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION"
            - "http status == 400"
      - name: create_licensee_duplicate_tax_id
        claim_type: type_constraints
        grounds: ["entities.Licensee.fields.tax_id", "errors[ERR_DUPLICATE_TAX_ID]", "validations[priority=10]"]
        distinguishing_aspect: "tax_id uniqueness: second licensee with the same tax_id is rejected with ERR_DUPLICATE_TAX_ID (409)."
        test_recipe:
          setup: ["one licensee with tax_id TAX-DUP-1 exists"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "First Co", tax_id: "TAX-DUP-1", contact_email: "a@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Second Co", tax_id: "TAX-DUP-1", contact_email: "b@x.test" }
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DUPLICATE_TAX_ID"
      - name: agreement_defaults_applied
        claim_type: defaults
        grounds: ["entities.LicenseAgreement.fields.minimum_period_royalty_cents", "entities.LicenseAgreement.fields.audit_window_months", "entities.LicenseAgreement.fields.underreport_tolerance_bp"]
        distinguishing_aspect: "Omitting every optional field on agreement creation yields documented defaults (min 0, sublicense_allowed false, passthrough 0, mfl false/RETROACTIVE/4, window 24, tolerance 500) and status DRAFT with zeroed computed fields."
        test_recipe:
          setup: ["licensee exists"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Def Co", tax_id: "TAX-DEF-1", contact_email: "d@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-12121-T1"
                title: "Defaults"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_min: $.data.minimum_period_royalty_cents, ag_sub: $.data.sublicense_allowed, ag_ptr: $.data.sublicense_passthrough_rate_bp, ag_mfl: $.data.mfl_clause, ag_mode: $.data.mfl_mode, ag_lbq: $.data.mfl_lookback_quarters, ag_win: $.data.audit_window_months, ag_tol: $.data.underreport_tolerance_bp, ag_st: $.data.status, ag_cum: $.data.cumulative_accepted_base_cents, ag_pool: $.data.undistributed_pool_cents, ag_adj: $.data.mfl_adjusted_rate_bp }
          assert:
            - "ag_min == 0, ag_sub == false, ag_ptr == 0, ag_mfl == false, ag_mode == RETROACTIVE, ag_lbq == 4, ag_win == 24, ag_tol == 500"
            - "ag_st == DRAFT; ag_cum == 0; ag_pool == 0; ag_adj == null"
      - name: computed_and_system_fields_rejected_in_payload
        claim_type: computed_fields
        grounds: ["entities.Licensee.fields.outstanding_balance_cents", "errors[ERR_VALIDATION]", "validations[priority=5]"]
        distinguishing_aspect: "Strict schema: supplying a computed field (outstanding_balance_cents) or a system field (status) in a create payload is rejected with ERR_VALIDATION, not silently ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Bad Co", tax_id: "TAX-BAD-1", contact_email: "b@x.test", outstanding_balance_cents: 999 }
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION (undeclared/computed field in payload)"
      - name: get_nonexistent_entities_return_404
        claim_type: not_found
        grounds: ["errors[ERR_AGREEMENT_NOT_FOUND]", "errors[ERR_DISPUTE_NOT_FOUND]", "errors[ERR_LICENSEE_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "GET-by-id with a well-formed but absent UUID returns the entity-specific 404 error for each readable collection."
        test_recipe:
          setup: ["empty database (no resources)"]
          setup_api_calls: []
          trigger:
            - call: "GET /licensing/licensees/00000000-0000-0000-0000-000000000000"
              as: LicensingAnalyst
              captures: { e1: $.data.error_id }
            - call: "GET /licensing/license-agreements/00000000-0000-0000-0000-000000000000"
              as: LicensingAnalyst
              captures: { e2: $.data.error_id }
            - call: "GET /licensing/royalty-reports/00000000-0000-0000-0000-000000000000"
              as: LicensingAnalyst
              captures: { e3: $.data.error_id }
            - call: "GET /licensing/disputes/00000000-0000-0000-0000-000000000000"
              as: LicensingAnalyst
              captures: { e4: $.data.error_id }
          assert:
            - "e1 == ERR_LICENSEE_NOT_FOUND, e2 == ERR_AGREEMENT_NOT_FOUND, e3 == ERR_REPORT_NOT_FOUND, e4 == ERR_DISPUTE_NOT_FOUND (all http 404)"
      - name: pagination_envelope_on_list
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more: 2 licensees, limit=1 page 0 -> has_more true; page 1 -> has_more false."
        test_recipe:
          setup: ["two licensees exist"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Pg A", tax_id: "TAX-PG-1", contact_email: "pa@x.test" }
              as: LicensingAnalyst
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Pg B", tax_id: "TAX-PG-2", contact_email: "pb@x.test" }
              as: LicensingAnalyst
          trigger:
            - call: "GET /licensing/licensees"
              payload: { limit: 1, offset: 0 }
              as: LicensingAnalyst
          assert:
            - "page0: data length == 1, total_count == 2, has_more == true"
            - "a second call with offset=1 returns data length == 1, has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: ["state_machines.Licensee", "state_machines.LicenseAgreement", "state_machines.Milestone", "state_machines.SublicenseGrant", "state_machines.RoyaltyReport", "state_machines.RoyaltyAudit"]
        distinguishing_aspect: "Every entity lands in its declared initial_state at creation: Licensee ACTIVE, LicenseAgreement DRAFT, Milestone PENDING, SublicenseGrant PENDING, RoyaltyReport SUBMITTED, RoyaltyAudit INITIATED."
        test_recipe:
          setup: ["licensee + agreement (sublicensing allowed) created"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Init Co", tax_id: "TAX-IN-1", contact_email: "i@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id, l_st: $.data.status }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-23232-U1"
                title: "Init"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                sublicense_allowed: true
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id, ag_st: $.data.status }
            - call: "POST /licensing/milestones"
              payload: { agreement_id: "${ag_id}", name: "M", trigger_type: CUMULATIVE_SALES, threshold_cents: 1000000, fee_cents: 100 }
              as: LicensingAnalyst
              captures: { ms_st: $.data.status }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/sublicense-grants"
              payload: { agreement_id: "${ag_id}", sublicensee_name: "Sub", territory: "EU" }
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { sg_st: $.data.status }
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 1, gross_sales_cents: 10000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_st: $.data.status }
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2026-03-01T00:00:00Z", scope_period_end: "2026-03-31T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { au_st: $.data.status }
          trigger: []
          assert:
            - "l_st == ACTIVE; ag_st == DRAFT; ms_st == PENDING; sg_st == PENDING; r_st == SUBMITTED; au_st == INITIATED"
      - name: validate_accepted_report_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.RoyaltyReport", "errors[ERR_REPORT_INVALID_STATE]", "validations[priority=8]"]
        distinguishing_aspect: "From ACCEPTED there is no validate transition; re-validating yields ERR_REPORT_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["AG ACTIVE; one report VALIDATED then ACCEPTED"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Inv Co", tax_id: "TAX-IV-1", contact_email: "iv@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-34343-V1"
                title: "Inv"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 1, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r_id}/accept"
              payload: {}
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_REPORT_INVALID_STATE"
      - name: terminal_dispute_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Dispute", "errors[ERR_DISPUTE_INVALID_STATE]"]
        distinguishing_aspect: "A SETTLED dispute is terminal: arbitrate afterwards yields ERR_DISPUTE_INVALID_STATE and no balance mutation."
        test_recipe:
          setup:
            - "Full dispute lifecycle: FLAGGED report -> audit -> finding -> dispute -> counsel offer 30000 -> licensee accepts -> counsel-1 ratifies (audit opened by ana-1) -> SETTLED"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Term Co", tax_id: "TAX-TM-1", contact_email: "t@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-45454-W1"
                title: "Term"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                underreport_tolerance_bp: 1000
                audit_window_months: 24
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 1, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 200000 }
              as: LicensingAnalyst
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2026-03-01T00:00:00Z", scope_period_end: "2026-03-31T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { au_id: $.data.id }
            - call: "POST /licensing/audits/${au_id}/advance"
              payload: { to_state: FIELDWORK }
              as: LicensingAnalyst
            - call: "POST /licensing/audit-findings"
              payload: { audit_id: "${au_id}", report_id: "${r_id}", finding_type: UNDERREPORTED_BASE, audited_base_cents: 180000 }
              as: LicensingAnalyst
              captures: { f_id: $.data.id }
            - call: "POST /licensing/audit-findings/${f_id}/dispute"
              payload: {}
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /licensing/disputes/${d_id}/offers"
              payload: { amount_cents: 30000, expected_dispute_version: "${d_v}" }
              as: LegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /licensing/disputes/${d_id}/accept-offer"
              payload: {}
              as: Licensee
              as_user_id: "${l1_id}"
            - call: "POST /licensing/disputes/${d_id}/ratify"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
              captures: { d_st: $.data.status }
          trigger:
            - call: "POST /licensing/disputes/${d_id}/arbitrate"
              payload: { awarded_amount_cents: 50000 }
              as: LegalCounsel
              captures: { err: $.data.error_id }
          assert:
            - "captured d_st == SETTLED"
            - "captured err == ERR_DISPUTE_INVALID_STATE (terminal lockdown)"
      - name: audit_close_blocked_with_open_findings
        claim_type: precondition_enforcement
        grounds: ["state_machines.RoyaltyAudit.FINDINGS_ISSUED_to_CLOSED", "errors[ERR_AUDIT_INVALID_STATE]"]
        distinguishing_aspect: "Aggregate precondition: advancing to CLOSED while a finding is still OPEN fails with ERR_AUDIT_INVALID_STATE; after the finding is WAIVED the close succeeds."
        test_recipe:
          setup: ["audit in FIELDWORK with one OPEN finding"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Cls Co", tax_id: "TAX-CL-1", contact_email: "cl@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-56565-X1"
                title: "Cls"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                underreport_tolerance_bp: 1000
                audit_window_months: 24
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 1, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 200000 }
              as: LicensingAnalyst
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2026-03-01T00:00:00Z", scope_period_end: "2026-03-31T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { au_id: $.data.id }
            - call: "POST /licensing/audits/${au_id}/advance"
              payload: { to_state: FIELDWORK }
              as: LicensingAnalyst
            - call: "POST /licensing/audit-findings"
              payload: { audit_id: "${au_id}", report_id: "${r_id}", finding_type: UNDERREPORTED_BASE, audited_base_cents: 180000 }
              as: LicensingAnalyst
              captures: { f_id: $.data.id }
            - call: "POST /licensing/audits/${au_id}/advance"
              payload: { to_state: FINDINGS_ISSUED }
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/audits/${au_id}/advance"
              payload: { to_state: CLOSED }
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /licensing/audit-findings/${f_id}/resolution"
              payload: { resolution: WAIVED }
              as: LicensingAnalyst
            - call: "POST /licensing/audits/${au_id}/advance"
              payload: { to_state: CLOSED }
              as: LicensingAnalyst
              captures: { au_st: $.data.status }
          assert:
            - "captured err == ERR_AUDIT_INVALID_STATE (OPEN finding blocks close)"
            - "captured au_st == CLOSED after the finding was WAIVED"
      - name: sublicense_revoked_blocks_pass_through_lines
        claim_type: side_effect_execution
        grounds: ["state_machines.SublicenseGrant.APPROVED_to_REVOKED", "errors[ERR_NO_APPROVED_SUBLICENSE]", "validations[priority=12]"]
        distinguishing_aspect: "After the only grant is REVOKED, a report carrying is_sublicense_revenue=true lines is rejected with ERR_NO_APPROVED_SUBLICENSE — the referential check re-evaluates current grant state."
        test_recipe:
          setup: ["AG ACTIVE with sublicense_allowed; grant APPROVED then REVOKED"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Sub Co", tax_id: "TAX-SB-1", contact_email: "sb@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-67676-Y1"
                title: "Sub"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                sublicense_allowed: true
                sublicense_passthrough_rate_bp: 800
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/sublicense-grants"
              payload: { agreement_id: "${ag_id}", sublicensee_name: "Sub", territory: "EU" }
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { sg_id: $.data.id }
            - call: "POST /licensing/sublicense-grants/${sg_id}/decision"
              payload: { decision: APPROVED }
              as: LicensingAnalyst
            - call: "POST /licensing/sublicense-grants/${sg_id}/decision"
              payload: { decision: REVOKED }
              as: LicensingAnalyst
              captures: { sg_st: $.data.status }
          trigger:
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "S1", units_sold: 1, gross_sales_cents: 50000, deductions_cents: 0, is_sublicense_revenue: true } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured sg_st == REVOKED"
            - "captured err == ERR_NO_APPROVED_SUBLICENSE"
      - name: date_milestone_achieved_on_clock_advance
        claim_type: valid_transition
        grounds: ["state_machines.Milestone.PENDING_to_ACHIEVED", "calculations.milestone_trigger_check"]
        distinguishing_aspect: "System trigger: advancing the logical clock past a DATE milestone's trigger_date achieves it and accrues fee_cents to the licensee balance — no report involved."
        test_recipe:
          setup: ["AG ACTIVE; DATE milestone trigger 2026-06-15 fee 12000; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Date Co", tax_id: "TAX-DT-1", contact_email: "dt@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-78787-Z1"
                title: "Date"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
