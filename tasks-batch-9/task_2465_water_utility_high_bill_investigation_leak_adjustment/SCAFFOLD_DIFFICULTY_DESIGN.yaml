      # -------- conserved quantity: the meter-test deposit escrow --------
      - name: compensating_invariant_meter_test_deposit_escrow_conserved_per_request
        grounds:
          - state_machines.MeterTestRequest
          - entities.MeterTestRequest.fields.deposit_cents
          - entities.MeterTestRequest.fields.deposit_refunded
          - entities.AccountLedgerEntry.fields.source_kind
          - endpoints[POST /meter-test-requests/{id}/record-bench-result]
        distinguishing_aspect: |
          CONSERVED QUANTITY: the meter-test deposit escrow — a third unit, distinct from the
          receivable and from gallons, and conserved PER REQUEST rather than globally. A request
          that vindicates the meter keeps the customer's 3000-cent deposit (net +3000,
          deposit_refunded false); a request that convicts the meter returns it with a single
          compensating -3000 entry so that request's deposit legs net to exactly 0 and
          deposit_refunded becomes true. Two requests on one account therefore leave the escrow at
          +3000, not 0 and not +6000, and the refund is a compensating entry rather than a
          deletion of the original charge.
