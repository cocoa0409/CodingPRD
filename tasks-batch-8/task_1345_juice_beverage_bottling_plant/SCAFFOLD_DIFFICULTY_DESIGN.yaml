  - rule_id: transitive_cascade
    instances:
      - name: condemn_batch_cascade_depth4
        grounds:
          - state_machines.Batch.RELEASED_to_CONDEMNED
          - state_machines.ProductionRun.SCHEDULED_to_BLOCKED_SUPPLY
          - calculations.container_reservation
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /batches/{id}/condemn: Batch RELEASED
          -> CONDEMNED (hop 0) forces the linked ProductionRun SCHEDULED ->
          BLOCKED_SUPPLY (hop 1), whose container reservation release mutates
          ContainerLot counters (hop 2), whose line-window liberation lets a
          second run book the exact same window (hop 3, observable proof).
        test_recipe:
          setup:
            - "Full pipeline; run R1 SCHEDULED into 2026-08-11T08:00-12:00Z on line L-8 with the only RELEASED batch; lot SUP-8 reserved 1050 of 5000"
