      - The second signup for the same (activity_id, registration_id) pair is rejected with ERR_DUPLICATE_ACTIVITY_SIGNUP
        and HTTP 409, and booked_count stays 1 — the rejected write creates no row.
      - The cancel returns 200 with status "CANCELLED" and booked_count drops to 0.
      - 'The third signup for the same pair returns 201 with status "BOOKED": the cancelled row is outside
        the uniqueness key, so GET /activity-signups?activity_id=${av1_id}&registration_id=${ra_id} then
        returns total_count 2, one CANCELLED and one BOOKED.'
      - The duplicate-signup rejection is a 409 business conflict, not a 412 — the expected_activity_version
        supplied was current, so the OCC guard at priority 9 passed and the uniqueness rule at priority
        22 is what fired.
  - name: boundary_satisfying_values_pass_risk_inspection_schedule_and_deviation_gates
