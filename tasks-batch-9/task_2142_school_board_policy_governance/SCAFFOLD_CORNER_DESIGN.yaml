            - call: "POST /governance/agenda-items/${ai}/record-vote"
              payload: { yes_member_ids: ["${bm1}", "${bm2}"], no_member_ids: ["${bm3}"], abstain_member_ids: [] }
              as: BoardPresident
              as_user_id: "${bm1}"
          trigger:
            - call: "GET /governance/policy-versions"
              payload: { first_reading_meeting_id: "${m}" }
              as: Public
            - call: "GET /governance/policy-versions"
              payload: { policy_id: "${pol}", status: "FIRST_READING_PASSED" }
              as: Public
          assert:
            - "first trigger call returns total_count == 1 and the row id == ${pv1}"
            - "second trigger call returns total_count == 1"
            - "PolicyVersion.${pv1}.first_reading_meeting_id == ${m}"
            - "PolicyVersion.${pv1}.adopting_meeting_id == null"

      - name: pagination_limit_above_the_maximum_returns_invalid_request
        claim_type: Listing
        grounds:
          - validations[priority=10]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The declared pagination window is 1..100; a limit of 101 is a shape violation returning ERR_INVALID_REQUEST at HTTP 400 rather than being silently clamped."
        test_recipe:
          setup: ["One policy exists."]
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-9010", title: "Board Retreat Guidelines", category: "GOVERNANCE", legal_requirement_level: "LOCAL_DISCRETION", manual_section: "9000.10" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
          trigger:
            - call: "GET /governance/policies"
              payload: { limit: 101 }
              as: Public
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

  # =======================================================================
  - section: errors
    instances:

      - name: unknown_path_ids_return_domain_specific_not_found_errors
        claim_type: Violation to Error
        grounds:
          - errors[ERR_MEETING_NOT_FOUND]
          - errors[ERR_AGENDA_ITEM_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_DISCLOSURE_NOT_FOUND]
          - errors[ERR_MANDATE_NOT_FOUND]
          - errors[ERR_WAIVER_NOT_FOUND]
          - errors[ERR_EVALUATION_NOT_FOUND]
          - errors[ERR_PUBLICATION_NOT_FOUND]
          - errors[ERR_BOARD_MEMBER_NOT_FOUND]
          - errors[ERR_COMMITTEE_NOT_FOUND]
          - errors[ERR_POLICY_VERSION_NOT_FOUND]
        distinguishing_aspect: "Every collection returns its own domain-specific 404 rather than a shared generic code, so the same unknown UUID yields eleven different error_id values depending on which collection was addressed."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /governance/meetings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Public
              captures: { e_meeting: $.data.error_id }
            - call: "GET /governance/agenda-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Public
              captures: { e_item: $.data.error_id }
            - call: "GET /governance/committee-assignments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BoardClerk
              captures: { e_assign: $.data.error_id }
            - call: "GET /governance/conflict-disclosures/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Public
              captures: { e_disc: $.data.error_id }
            - call: "GET /governance/legal-mandates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LegalUpdateService
              captures: { e_mandate: $.data.error_id }
            - call: "GET /governance/waiver-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchoolPrincipal
              captures: { e_waiver: $.data.error_id }
            - call: "GET /governance/superintendent-evaluations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BoardClerk
              captures: { e_eval: $.data.error_id }
            - call: "GET /governance/manual-publications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Public
              captures: { e_pub: $.data.error_id }
            - call: "GET /governance/board-members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BoardClerk
              captures: { e_member: $.data.error_id }
            - call: "GET /governance/committees/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BoardClerk
              captures: { e_committee: $.data.error_id }
            - call: "GET /governance/policy-versions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Public
              captures: { e_version: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404 with response_type == error"
            - "captured e_meeting == ERR_MEETING_NOT_FOUND"
            - "captured e_item == ERR_AGENDA_ITEM_NOT_FOUND"
            - "captured e_assign == ERR_ASSIGNMENT_NOT_FOUND"
            - "captured e_disc == ERR_DISCLOSURE_NOT_FOUND"
            - "captured e_mandate == ERR_MANDATE_NOT_FOUND"
            - "captured e_waiver == ERR_WAIVER_NOT_FOUND"
            - "captured e_eval == ERR_EVALUATION_NOT_FOUND"
            - "captured e_pub == ERR_PUBLICATION_NOT_FOUND"
            - "captured e_member == ERR_BOARD_MEMBER_NOT_FOUND"
            - "captured e_committee == ERR_COMMITTEE_NOT_FOUND"
            - "captured e_version == ERR_POLICY_VERSION_NOT_FOUND"

      - name: publishing_an_already_published_edition_returns_already_published
        claim_type: Violation to Error
        grounds:
          - errors[ERR_PUBLICATION_ALREADY_PUBLISHED]
          - state_machines.ManualPublication.BUILDING_to_PUBLISHED
        distinguishing_aspect: "Publish is declared only from BUILDING; a second publish on the same edition returns ERR_PUBLICATION_ALREADY_PUBLISHED at HTTP 409 and published_at keeps the instant the first call stamped."
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "Policy BP-4119 adopted at an EMERGENCY meeting on 2026-08-02T18:00:00Z, and edition 2026-FALL already PUBLISHED at that instant."
