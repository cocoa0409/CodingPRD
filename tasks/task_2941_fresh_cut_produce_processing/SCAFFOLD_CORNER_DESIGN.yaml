              payload: { shift: "SECOND", scheduled_for: "2026-08-03T13:00:00Z", is_allergen_changeover: false }
              as: SanitationTech
              captures: { san_b: "$.data.id", seq_b: "$.data.sequence_no" }
          trigger:
