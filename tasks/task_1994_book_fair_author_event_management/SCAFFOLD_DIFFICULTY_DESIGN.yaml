  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_counter_cycle_rounds_exhaustion
        grounds:
          - state_machines.ConsignmentAgreement.PROPOSED_to_COUNTERED
          - state_machines.ConsignmentAgreement.COUNTERED_to_PROPOSED
          - validations[priority=16]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          Cyclic machine on ConsignmentAgreement: PROPOSED -> COUNTERED -> PROPOSED
          loop bounded by MAX_NEGOTIATION_ROUNDS == 6; the counter that would push
          negotiation_round from 6 to 7 is rejected with
          ERR_NEGOTIATION_ROUNDS_EXHAUSTED while the version is still valid.
        test_recipe:
          setup:
            - "School + publisher parties and a fair exist; agreement created (PROPOSED, round 1, version 1, offered_by ORGANIZER)"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
