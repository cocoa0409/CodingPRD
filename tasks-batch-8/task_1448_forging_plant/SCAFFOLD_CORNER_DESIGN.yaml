# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_1448_forging_plant
# §1.9 Coverage Index: every non-difficulty testable claim of SCAFFOLD.yaml
# §1.1–§1.7, organized per the claim-extraction-guide taxonomy.
# Sections: entities, state_machines, calculations, validations, endpoints,
# errors, rbac, cross_cutting, consistency.
# Fixture literals mirror SCAFFOLD_DIFFICULTY_DESIGN.yaml's canonical profile.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: entity_create_applies_system_defaults
        claim_type: creation_defaults
        grounds: [entities.MillHeat, entities.MillHeat.fields.status, entities.MillHeat.fields.remaining_weight_lbs]
        distinguishing_aspect: "A heat created with valid input starts in RECEIVED with version 1, a UUID id, and remaining_weight_lbs == received_weight_lbs."
        test_recipe:
          setup: ["Alloy AISI-4140 exists"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill-heats", payload: { heat_number: "H-7001", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { h_status: "$.data.status", h_version: "$.data.version", h_rem: "$.data.remaining_weight_lbs", h_id: "$.data.id" } }
          assert:
            - "status == RECEIVED; version == 1; remaining_weight_lbs == 20000.00"
            - "id is a server-minted UUID; created_at/updated_at present in ISO8601 UTC with millisecond precision"

      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields the error envelope with ERR_NOT_FOUND and HTTP 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mill-heats/00000000-0000-4000-8000-000000000000", payload: {}, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND; response_type == error; meta.api_request_id present"

      - name: computed_field_input_ignored_on_create
        claim_type: computed_fields
        grounds: [entities.MillHeat.fields.remaining_weight_lbs]
        distinguishing_aspect: "Client-supplied values for computed/system fields are silently ignored: remaining_weight_lbs derives from received weight, not from the payload."
        test_recipe:
          setup: ["Alloy AISI-4140 exists"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill-heats", payload: { heat_number: "H-7002", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50, remaining_weight_lbs: 5.00 }, as: PlantManager, captures: { h_rem: "$.data.remaining_weight_lbs" } }
          assert:
            - "201 Created; remaining_weight_lbs == 20000.00 (payload value 5.00 ignored)"

      - name: system_field_input_ignored_on_create
        claim_type: system_fields
        grounds: [entities.WorkCenter]
        distinguishing_aspect: "Client-supplied id/version on creation are ignored; server mints its own identity and starts version at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /work-centers", payload: { code: "WC-9", type: "PRESS", rated_tonnage: 500, id: "11111111-1111-4111-8111-111111111111", version: 99 }, as: PlantManager, captures: { wc_id: "$.data.id", wc_v: "$.data.version" } }
          assert:
            - "201 Created; response id != 11111111-1111-4111-8111-111111111111 (server-minted); version == 1"

      - name: workcenter_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.WorkCenter.fields.type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "type is enum {PRESS, HAMMER}; any other value is a 400 schema error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /work-centers", payload: { code: "WC-9", type: "SCREW", rated_tonnage: 500 }, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: mill_heat_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.MillHeat.fields.heat_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input heat_number yields ERR_INVALID_REQUEST (400) before any existence or business check."
        test_recipe:
          setup: ["Alloy AISI-4140 exists"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill-heats", payload: { alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: list_pagination_envelope_and_defaults
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List responses are paginated arrays: limit/offset/total_count/has_more present; limit=2 over 3 rows returns has_more true then false on the second page."
        test_recipe:
          setup: ["three alloy specs created"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager }
            - { call: "POST /alloy-specs", payload: { grade_code: "AL-7075", name: "Aluminum 7075", forge_temp_min_f: 750, forge_temp_max_f: 850, reheat_limit: 1, flash_allowance_pct: 8.0, strokes_per_part: 1, flow_stress_ksi: 4.0, carbon_max_pct: 0.10, manganese_max_pct: 0.30, grain_flow_min_rating: 4, macro_etch_required: false }, as: PlantManager }
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-8620", name: "NiCrMo Steel", forge_temp_min_f: 2050, forge_temp_max_f: 2250, reheat_limit: 2, flash_allowance_pct: 10.0, strokes_per_part: 3, flow_stress_ksi: 7.5, carbon_max_pct: 0.23, manganese_max_pct: 0.90, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager }
          trigger:
            - { call: "GET /alloy-specs", payload: { limit: 2 }, as: PlantManager }
            - { call: "GET /alloy-specs", payload: { limit: 2, offset: 2 }, as: PlantManager }
          assert:
            - "page 1: response_type == array; 2 data rows; limit == 2; offset == 0; total_count == 3; has_more == true"
            - "page 2: 1 data row; offset == 2; total_count == 3; has_more == false"

      - name: forge_heat_has_no_version_field
        claim_type: immutability
        grounds: [entities.ForgeHeat]
        distinguishing_aspect: "ForgeHeat is an append-only event (common_fields: false): its response carries id + created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "Alloy AISI-4140; heat H-7003 CERT_VERIFIED; 2 billets; charge READY; die installed; WO qty 2; run IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-7003", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 2 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { chg_id: "$.data.id" } }
            - { call: "POST /furnace-charges/${chg_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-21", part_family: "FLG-4", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /die-sets/${die_id}/install", payload: { work_center_id: "${wc_id}" }, as: DieShopTechnician }
            - { call: "POST /work-orders", payload: { order_number: "WO-20", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 2, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 2, expected_work_order_version: "${wo_v}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_id: "$.data.id" } }
            - { call: "POST /forge-runs/${run_id}/start", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg_id}", billet_ids: ["${b1}", "${b2}"], parts_good: 2, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1", captures: { fh_id: "$.data.id", fh_hits: "$.data.hits_added" } }
          assert:
            - "ForgeHeat response has id and created_at but no `version` and no `updated_at` key (common_fields: false)"
            - "hits_added == 6 (2 parts * 3 strokes)"

      - name: cut_from_unverified_heat_rejected
        claim_type: parent_relationships
        grounds: [entities.Billet.fields.mill_heat_id, "validations[priority=14]", "errors[ERR_HEAT_NOT_CERTIFIED]"]
        distinguishing_aspect: "Billet creation is gated on parent heat state: a RECEIVED (never verified) heat rejects cutting with ERR_HEAT_NOT_CERTIFIED."
        test_recipe:
          setup: ["Alloy AISI-4140; heat H-7004 registered, never verified"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-7004", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 1 } ] }, as: SawOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; error_id == ERR_HEAT_NOT_CERTIFIED; heat status remains RECEIVED"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_across_pipeline
        claim_type: initial_state
        grounds: [state_machines.MillHeat, state_machines.Billet, state_machines.FurnaceCharge, state_machines.DieSet, state_machines.WorkOrder, state_machines.ForgeRun, state_machines.TrimTicket, state_machines.Invoice]
        distinguishing_aspect: "Every creatable entity lands in its declared initial_state: heat RECEIVED, billet CUT, charge LOADING, die AVAILABLE, order RELEASED, run SCHEDULED, trim ticket DRAFT, invoice PROVISIONAL."
        test_recipe:
          setup: ["Alloy AISI-4140; surcharge 2026-08; heat H-7101 CERT_VERIFIED; 2 billets; furnace; die; WC-1; WO-21 qty 2"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /surcharge-indices", payload: { alloy_spec_id: "${alloy_id}", effective_month: "2026-08", surcharge_cents_per_ton: 250000, energy_pct: 0.10 }, as: PlantManager }
            - { call: "POST /mill-heats", payload: { heat_number: "H-7101", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id", h_st: "$.data.status" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 2 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id", b_st: "$.data[0].status" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { chg_id: "$.data.id", c_st: "$.data.status" } }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-22", part_family: "FLG-4", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id", d_st: "$.data.status" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /work-orders", payload: { order_number: "WO-21", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 2, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version", w_st: "$.data.status" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 2, expected_work_order_version: "${wo_v}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_id: "$.data.id", r_st: "$.data.status" } }
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: SalesPlanner, captures: { wo_v2: "$.data.version" } }
            - { call: "POST /work-orders/${wo_id}/invoices", payload: { expected_work_order_version: "${wo_v2}" }, as: SalesPlanner, captures: { inv_st: "$.data.status" } }
          trigger:
            - { call: "GET /forge-runs/${run_id}", payload: {}, as: ForgeOperator }
            - { call: "POST /forge-runs/${run_id}/start", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /furnace-charges/${chg_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:30:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg_id}", billet_ids: ["${b1}", "${b2}"], parts_good: 2, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/finish-forging", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/trim-tickets", payload: {}, as: ForgeOperator, captures: { tt_st: "$.data.status" } }
          assert:
            - "h_st == RECEIVED; b_st == CUT; c_st == LOADING; d_st == AVAILABLE; w_st == RELEASED; r_st == SCHEDULED; inv_st == PROVISIONAL; tt_st == DRAFT"

      - name: discharge_loading_charge_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FurnaceCharge.transitions]
        distinguishing_aspect: "discharge is valid only from READY; a LOADING charge rejects with ERR_INVALID_STATE_TRANSITION (abort is the escape hatch)."
        test_recipe:
          setup: ["Alloy AISI-4140; heat CERT_VERIFIED; 1 billet; FUR-1; charge created (LOADING)"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-7102", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 1 } ] }, as: SawOperator, captures: { b1: "$.data[0].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { chg_id: "$.data.id" } }
          trigger:
            - { call: "POST /furnace-charges/${chg_id}/discharge", payload: {}, as: FurnaceOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE_TRANSITION; charge remains LOADING"

      - name: finish_forging_without_heats_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ForgeRun.IN_PROGRESS_to_FORGED, "errors[ERR_RUN_NO_HEATS]"]
        distinguishing_aspect: "finish-forging requires >= 1 recorded ForgeHeat; zero heats yields ERR_RUN_NO_HEATS (not the generic invalid-state error)."
        test_recipe:
          setup: ["Alloy; die installed on WC-1; WO-22; run started, zero heats"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
