        distinguishing_aspect: "The common-field contract requires version to start at 1 and increment by exactly one on every mutation: a freshly created lock reads 1, after a RESTRICTED posture change 2, and after returning to OPEN 3."
        test_recipe:
          setup: ["One lock created with the default OPEN posture."]
          setup_api_calls:
            - call: "POST /locks"
              payload: { lock_name: "Chain of Rocks", river_mile: 185.0, chamber_capacity_barges: 9, cycle_minutes: 45, turnback_buffer_minutes: 30 }
              as: WaterwayAdmin
              captures: { lock_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /locks/${lock_id}/set-status"
              payload: { status: "RESTRICTED" }
              as: WaterwayAdmin
            - call: "POST /locks/${lock_id}/set-status"
              payload: { status: "OPEN" }
              as: WaterwayAdmin
          assert:
            - "${v0} == 1 and Lock.${lock_id}.status == OPEN at creation"
            - "after the first posture change Lock.${lock_id}.version == 2 and status == RESTRICTED"
            - "after the second Lock.${lock_id}.version == 3 and status == OPEN"
            - "Lock.${lock_id}.updated_at is strictly later than the value read at creation"

