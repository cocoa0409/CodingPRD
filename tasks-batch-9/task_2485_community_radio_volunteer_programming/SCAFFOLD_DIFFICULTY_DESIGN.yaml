            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-02-20T12:00:00Z" }, as: ProgramDirector }
            - { call: "POST /volunteers", payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }, as: TrainingCoordinator, captures: { host_id: "$.data.id" } }
