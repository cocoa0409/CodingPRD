            - call: "POST /ir/publications"
              payload: { component_id: "${comp}", metric_key: "TOTAL_HEADCOUNT_FALL", published_value: 1002.0, effective_from: "2026-11-15T00:00:00Z", effective_to: "2026-11-20T00:00:00Z" }
