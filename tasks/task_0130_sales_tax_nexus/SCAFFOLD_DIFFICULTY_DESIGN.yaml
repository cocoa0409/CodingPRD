          - entities.NexusProfile.fields.cumulative_txn_count
        distinguishing_aspect: |
          A DIFFERENT metric (transaction COUNT, not dollars) on the same SETTLE endpoint reached via three
          separate settles: with txn threshold 3, cumulative_txn_count reaches exactly 3 on the third settle
          and flips THRESHOLD_MET (inclusive >=), while sales dollars stay far below the sales threshold.
