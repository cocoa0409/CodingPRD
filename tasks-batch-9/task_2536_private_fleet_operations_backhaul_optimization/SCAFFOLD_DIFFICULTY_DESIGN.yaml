            - "CONTROL, before the trigger: ${ev_1_points} == 12, ${mid_points} == 24, ${mid_score} == 76, ${mid_hold} == false, ${planned_status} == PLANNED and ${mid_plan_status} == PLANNED - two events changed nothing beyond the driver's own counters"
            - "LINK 1: Driver.${drv_77_id}.open_penalty_points == 36"
            - "LINK 2: Driver.${drv_77_id}.safety_score == 64 and coaching_hold == true"
            - "LINK 3: Trip.${trip_1_id}.plan_status == DRAFT with driver_id == null, tractor_id == null and trailer_id == null"
            - "LINK 3b: Tractor.${trc_501_id}.status == AVAILABLE and Trailer.${trl_900_id}.status == AVAILABLE"
            - "LINK 3c: TripStop ${stop_1_id} and ${stop_2_id} both have status == SKIPPED"
            - "LINK 4: ReplenishmentOrder.${ord_1_id}.status == UNSCHEDULED"
            - "LINK 5: Store.${store_s1_id}.open_scheduled_cases == 0 (it was 900 while the trip was PLANNED)"
            - "the same trigger also set RouteBid ${bid_77_id} status == PASSED_OVER and lowered RoutePosting.${posting_100_id}.bid_count to 0"
            - "GET /fleet/telematics-events?driver_id=${drv_77_id} returns 3 rows, all with coached == false"

      - name: driver_termination_cascades_to_open_bids_and_domicile_balance_index
        grounds:
          - state_machines.Driver.ACTIVE_to_TERMINATED
          - calculations.domicile_balance_index
          - entities.Domicile.fields.assigned_driver_count
          - entities.Domicile.fields.balance_index
          - endpoints[POST /fleet/drivers/{driver_id}/termination]
        distinguishing_aspect: |
          DEPTH 3 from a THIRD distinct trigger, POST /fleet/drivers/{driver_id}/termination.
          Link 1: the driver's status becomes TERMINATED. Link 2: BECAUSE the
          status left ACTIVE, the domicile's ACTIVE headcount falls from 3 to 2.
          Link 3: BECAUSE the headcount fell, balance_index is re-derived from
          2/2 to exactly 1.0000, which is the value that closes the borrow gate
          for a target domicile. The same status change passes the driver's open
          SUBMITTED bid to PASSED_OVER while deliberately leaving an already
          AWARDED posting untouched.
        test_recipe:
          setup:
            - "Domicile DOM-KC has driver_headcount_target 2 and three ACTIVE drivers, so assigned_driver_count == 3 and balance_index == round_half_up(3/2, 4) == 1.5000."
            - "Driver D-93 holds a SUBMITTED bid on posting RT-200."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
