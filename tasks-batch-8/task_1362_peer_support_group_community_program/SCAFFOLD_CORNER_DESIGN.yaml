  # ==========================================================================
  # §1.9 Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: enrollment_fee_tier_boundary_household_4_hits_discount
        claim_type: correct_result
        grounds: [calculations.enrollment_fee_after_subsidy]
        distinguishing_aspect: "household_size=4 hits the 0.50 tier (>=4); household_size=3 stays at 0.25"
        test_recipe:
          setup:
            - "Two Participants: A with household_size=4, B with household_size=3, both with attendance_streak=0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", household_size: 4 }
              as: ProgramAdmin
              captures: { pa: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "B", email: "b@x.com", household_size: 3 }
              as: ProgramAdmin
              captures: { pb: $.data.id }
          trigger:
