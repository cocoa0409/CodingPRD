      - name: provisioned_terminal_rejects_every_state_action
        claim_type: invalid_transitions
        grounds:
          - state_machines.Terminal.transitions
          - validations[priority=75]
          - errors[ERR_INVALID_TERMINAL_STATE]
        distinguishing_aspect: "PROVISIONED declares exactly one outgoing edge, POST /terminals/{id}/configure, so all three state-actions (ENFORCE, QUARANTINE, RESTORE) are refused 409 ERR_INVALID_TERMINAL_STATE from that state and the terminal keeps program_id null."
