  - rule_id: priority_pair_validation_conflict
    instances:

      - name: order_not_allocatable_state_beats_customer_credit_hold_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=26]
          - errors[ERR_ORDER_NOT_ALLOCATABLE]
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
          - state_machines.Customer.ACTIVE_to_CREDIT_HOLD
        distinguishing_aspect: |
          Category pair STATE (priority 7) versus BUSINESS_FISCAL (priority 27):
          a single allocate request violates both -- the order is already
          ALLOCATED and the customer is on CREDIT_HOLD -- and the response must be
          ERR_ORDER_NOT_ALLOCATABLE (409), never ERR_CUSTOMER_CREDIT_HOLD (402).
        test_recipe:
          setup:
            - "One branch, product P1, index CI1, one 1000 ft reel, and a customer with a 100000-cent limit."
            - "A single CUT line of 300 ft is quoted, issued, converted and fully allocated, so the order is ALLOCATED."
            - "A credit adjustment of +150000 cents to the open balance drives available_credit_cents to -50000 and the customer to CREDIT_HOLD; the order is ALLOCATED so it is NOT moved to HELD."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
