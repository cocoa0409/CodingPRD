    code: 200
    input: [child_user_id, "monthly_spend_limit_robux?", "chat_mode?", "allowed_age_ratings?", pin_hash, expected_user_version]
    output: ParentalControls
    side_effects: ["increments User.version on the parent (the acting user) AND on the child (chat_filter_level recompute); OCC on expected_user_version against the parent's version"]

  - method: GET
    path: "/ugc/users/{id}/parental-controls"
    description: "Get parental controls for a child"
    roles: [Creator, PlatformAdmin]
    code: 200
    input: [child_user_id]
    output: "ParentalControls[]"
    side_effects: []

