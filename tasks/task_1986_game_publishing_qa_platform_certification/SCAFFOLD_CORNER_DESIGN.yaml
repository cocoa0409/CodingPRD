  # =========================================================== validations ====
  - section: validations
    instances:
      - name: na_result_on_required_item_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - "errors[ERR_NA_NOT_ALLOWED_FOR_REQUIRED]"
        distinguishing_aspect: "result NA is reserved for RECOMMENDED items; applying it to REQUIRED item TRC-PS-01 fails 400 — the item stays UNVERIFIED."
        test_recipe:
          setup: ["Full assembly chain: package ASSEMBLING with the 4-item PS5 checklist"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "VAL-NA", name: "Val Na", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorNa", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { pkg: $.data.id, cid: $.data.checklist_id }
          trigger:
            - call: "POST /qa-cert/compliance-checklists/${cid}/items/verify"
              payload: { requirement_code: "TRC-PS-01", result: "NA" }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NA_NOT_ALLOWED_FOR_REQUIRED, http 400"
            - "checklist unverified_count remains 4"

      - name: package_create_platform_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - "errors[ERR_BUILD_PLATFORM_MISMATCH]"
        distinguishing_aspect: "A CANDIDATE PC build referenced by a PS5 package fails the referential platform check with 422 ERR_BUILD_PLATFORM_MISMATCH even though every other gate passes."
        test_recipe:
          setup: ["Title T on [PS5, PC]; PS5 plan APPROVED; PC build CANDIDATE"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "VAL-PLT", name: "Val Plt", platform_codes: ["PS5", "PC"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorPl", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PC", version_string: "1.0.0" }
              as: QALead
              captures: { bpc: $.data.id }
            - { call: "POST /qa-cert/builds/${bpc}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${bpc}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${bpc}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${bpc}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BUILD_PLATFORM_MISMATCH, http 422"
            - "no package row created; plan stays APPROVED (not LOCKED)"

      - name: regression_target_must_be_closed_first
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - entities.BugReport.fields.regression_of_id
          - "errors[ERR_REGRESSION_TARGET_NOT_CLOSED]"
        distinguishing_aspect: "regression_of_id against an OPEN bug fails 422 ERR_REGRESSION_TARGET_NOT_CLOSED; after the target reaches CLOSED the same link is accepted and is_regression computes true."
        test_recipe:
          setup: ["Title T; build B IN_TEST; bug G1 OPEN"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "VAL-REG", name: "Val Reg", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { bid: $.data.id }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${bid}", severity: "MAJOR", category: "GAMEPLAY" }
              as: QALead
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${bid}", severity: "MAJOR", category: "GAMEPLAY", regression_of_id: "${g1}" }
              as: QALead
              captures: { err: $.data.error_id }
            - { call: "POST /qa-cert/bugs/${g1}/triage", payload: { severity: "MAJOR" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${g1}/transition", payload: { to_status: "IN_PROGRESS" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${g1}/transition", payload: { to_status: "RESOLVED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${g1}/transition", payload: { to_status: "VERIFIED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${g1}/transition", payload: { to_status: "CLOSED" }, as: QALead }
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${bid}", severity: "MAJOR", category: "GAMEPLAY", regression_of_id: "${g1}" }
              as: QALead
              captures: { g2: $.data.id, reg: $.data.is_regression }
          assert:
            - "target OPEN: error_id == ERR_REGRESSION_TARGET_NOT_CLOSED, http 422"
            - "target CLOSED: created, is_regression == true"

      - name: finding_fix_requires_strictly_newer_build
        claim_type: violation_to_error
        grounds:
