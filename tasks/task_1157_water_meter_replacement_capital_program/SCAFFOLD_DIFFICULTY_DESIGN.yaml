            - { call: "POST /api/appointments", payload: { work_order_id: "${wo}", slot_date: "2026-05-07", window: "AM", expected_work_order_version: "${wo_s2}" }, as: Scheduler, captures: { appt2: $.data.id } }
            - { call: "POST /api/appointments/${appt2}/no-access", payload: {}, as: FieldContractor, as_user_id: "${contr}" }
            # strike 3 appointment booked
