  - rule_id: non_linear_state_machine
    instances:
      - name: interpreter_request_decline_reassign_cycle
        grounds:
          - state_machines.InterpreterRequest.ASSIGNED_to_REQUESTED
          - state_machines.InterpreterRequest.REQUESTED_to_ASSIGNED
          - calculations.waitlist_promotion_selector
        distinguishing_aspect: |
          True cycle on InterpreterRequest: REQUESTED -> ASSIGNED -> (decline) -> REQUESTED ->
          ASSIGNED -> CONFIRMED. After the decline, the auto-selector must skip the declined
          interpreter (declined_interpreter_ids) even though he ranks first on
          committed_minutes ASC + created_at ASC, and pick I2 instead.
        test_recipe:
          setup:
            - "Window BOOKING_OPEN; teacher T1; interpreters I1 (created first) and I2 (both cover es, zero committed minutes)"
            - "Family F1 student stA linked to T1 with a booking on slot 0 carrying interpreter_language 'es' -> request r REQUESTED"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6, family_conf_cap: 8, cancel_cutoff_hours: 24, waitlist_offer_ttl_hours: 24, no_show_strike_threshold: 3, auto_no_show_grace_hours: 24 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/interpreters", payload: { full_name: "I One", languages: ["es"], max_consecutive_minutes: 120, base_minutes_per_window: 600, hourly_rate_cents: 6000 }, as: SchoolAdmin, captures: { i1: $.data.id } }
            - { call: "POST /conf/interpreters", payload: { full_name: "I Two", languages: ["es"], max_consecutive_minutes: 120, base_minutes_per_window: 600, hourly_rate_cents: 6000 }, as: SchoolAdmin, captures: { i2: $.data.id } }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G1", email: "f1@x.com", preferred_language: "es" }, as: FrontOfficeStaff, captures: { f1: $.data.id } }
            - { call: "POST /conf/families/${f1}/students", payload: { full_name: "A", grade_level: 3 }, as: FrontOfficeStaff, captures: { stA: $.data.id } }
            - { call: "POST /conf/students/${stA}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${stA}", channel: "IN_PERSON", interpreter_language: "es" }, as: FamilyGuardian, as_user_id: "${f1}", captures: { bk1: $.data.id } }
            - { call: "GET /conf/interpreter-requests", payload: { booking_id: "${bk1}" }, as: FrontOfficeStaff, captures: { r: "$.data[0].id" } }
          trigger:
            - { call: "POST /conf/interpreter-requests/${r}/assign", payload: {}, as: FrontOfficeStaff, captures: { a1_interp: $.data.interpreter_id } }
            - { call: "POST /conf/interpreter-requests/${r}/decline", payload: { reason: "unavailable" }, as: Interpreter, as_user_id: "${i1}", captures: { after_decline_status: $.data.status } }
            - { call: "POST /conf/interpreter-requests/${r}/assign", payload: {}, as: FrontOfficeStaff, captures: { a2_interp: $.data.interpreter_id } }
            - { call: "POST /conf/interpreter-requests/${r}/accept", payload: {}, as: Interpreter, as_user_id: "${i2}", captures: { final_status: $.data.status } }
            - { call: "GET /conf/interpreters/${i1}", as: FrontOfficeStaff, captures: { i1_committed: $.data.committed_minutes } }
          assert:
            - "first auto-assign picked I1 (committed 0 tie -> created_at ASC): a1_interp == ${i1}"
            - "after decline: status REQUESTED, interpreter_id null, declined_interpreter_ids contains ${i1}"
            - "second auto-assign picked I2 (I1 excluded by declined_interpreter_ids despite ranking first): a2_interp == ${i2}"
            - "after accept: status CONFIRMED"
            - "I1.committed_minutes == 0 (decline released the 20 minutes)"

      - name: waitlist_offer_cycle_to_exhausted
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_WAITING
          - state_machines.WaitlistEntry.OFFERED_to_EXHAUSTED
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
        distinguishing_aspect: |
          True cycle with termination on WaitlistEntry (a different entity from
          InterpreterRequest): WAITING -> OFFERED -> decline -> WAITING -> OFFERED -> decline ->
          EXHAUSTED once offers_made_count hits MAX_OFFERS = 2; declined slots are never
          re-offered to the same entry.
        test_recipe:
          setup:
            - "Window BOOKING_OPEN; teacher T1; family FA with students a1, a2 (bookings on slots 0 and 1)"
            - "Family FB with student b1 linked to T1 and WAITING entry E (channel_pref EITHER)"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
