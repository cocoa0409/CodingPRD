  # ---------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (≥2, different error-category pairs)
  # ---------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_settlement_finalize
        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_UNSETTLED_LINES]
        distinguishing_aspect: |
          Conflict pair: state (priority 6) vs business_fiscal (priority 16).
          A settlement still in DRAFT with would-be-PENDING lines: the
          state-machine rejection (ERR_INVALID_STATE, settlement not in
          AIRLINE_REVIEW or RESOLVED) MUST surface, not the fiscal
          ERR_UNSETTLED_LINES, because state runs first.
        test_recipe:
          setup:
            - "FY_PVS OPEN; activity exists; settlement computed but NOT published for review (still in COMPUTED state, not AIRLINE_REVIEW/RESOLVED)."
            - "We then call finalize — settlement is in COMPUTED which does not admit finalize (per state machine only AIRLINE_REVIEW|RESOLVED → FINALIZED)."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_PVS", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_pvs_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_pvs_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "PV", legal_name: "PrioV Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { pv_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${pv_id}", fiscal_year_id: "${fy_pvs_id}", rented_space_sqft: 0 }
              as: AirportFinance
            - call: "GET /airport/fiscal_years/${fy_pvs_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_11: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_pvs_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_11}" }
              as: AirportFinance
              captures: { rs_pvs_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_pvs_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_pvs_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/fiscal_years/{fy_pvs_id}/activity_records"
              payload: { airline_id: "${pv_id}", activity_date: "2026-09-10T00:00:00Z", landed_weight_kg: 1000, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_pvs_id}/settlement/compute"
              payload: {}
              as: AirportFinance
              captures: { settle_pvs_id: $.data.id }
          trigger:
            - call: "POST /airport/settlements/{settle_pvs_id}/finalize"
              payload: {}
              as: AirportDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 6 wins over business_fiscal priority 16)"
            - "AnnualSettlement.${settle_pvs_id}.status == COMPUTED (unchanged)"

      - name: business_safety_vs_business_referential_on_mii_vote
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_AIRLINE_SUSPENDED]
          - errors[ERR_NOT_SIGNATORY]
        distinguishing_aspect: |
          Conflict pair: business_safety (priority 10) vs business_referential
          (priority 11). A SUSPENDED airline that is also NON_SIGNATORY attempts
          to vote; safety rejection MUST surface first.
          Note: priority 10 in our scaffold is for ActivityRecord/PFC creation,
          so we instead exercise business_temporal (priority 8) vs
          business_safety (priority 9): an activity posted past the
          fiscal-year window AND on a CLOSED FY surfaces
          ERR_FISCAL_YEAR_CLOSED (priority 9 < 8 is wrong; we want priority 8
          temporal first). Actually we need the pair: (a) state vs fiscal (covered
          above) and (b) safety vs referential — implemented as: a SUSPENDED
          airline whose agreement has been superseded attempts to countersign;
          supersession (business_referential via ERR_AGREEMENT_SUPERSEDED)
          vs credit-standing safety; we declare supersession as a
          business_referential violation and safety as credit-standing —
          higher priority (state, priority 6 for the signature state machine,
          surfaces ERR_INVALID_STATE first). To keep the pairing distinct from
          instance 1, we use business_temporal (priority 8) vs
          business_referential (priority 11) on an MII vote cast past the
          voting window by a NON_SIGNATORY airline: temporal surfaces first.
        test_recipe:
          setup:
            - "FY_PVR OPEN; airline NV registered but NOT countersigned (NON_SIGNATORY); CapitalProject CP_PVR in PROPOSED (never opened for voting)."
            - "NV attempts to cast an APPROVE vote on CP_PVR: project is not in MII_VOTING (state violation, ERR_INVALID_STATE at priority 6) AND voter is non-signatory (referential ERR_NOT_SIGNATORY at priority 11). State must win."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_PVR", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_pvr_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_pvr_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "NV", legal_name: "NonVoter Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { nv_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${nv_id}", fiscal_year_id: "${fy_pvr_id}", rented_space_sqft: 0 }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_pvr_id}/capital_projects"
              payload: { project_name: "Terminal Expansion", cost_center: "TERMINAL", budget_cents: 9000000, mii_threshold_pct: 50 }
              as: AirportFinance
              captures: { cp_pvr_id: $.data.id }
          trigger:
            - call: "POST /airport/capital_projects/{cp_pvr_id}/mii_votes"
              payload: { airline_id: "${nv_id}", ballot: "APPROVE" }
              as: SignatoryAirline
              as_user_id: "${nv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 6 wins over referential priority 11)"
            - "CapitalProject.${cp_pvr_id}.votes_for_count == 0"

  # ---------------------------------------------------------
  # Rule 6 — boundary_precision_check (≥2, different metrics, different endpoints)
  # ---------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: landing_fee_500kg_remainder_boundary
        grounds:
          - calculations.landing_fee_charge
          - endpoints: "POST /airport/fiscal_years/{fy_id}/activity_records"
        distinguishing_aspect: |
          Numeric boundary: 500-kg remainder exactly at the round-up threshold
          (>= vs >). 1499 kg → 1 unit; 1500 kg → 2 units. Metric: weight-based
          charge units; endpoint: activity_records POST.
        test_recipe:
          setup:
            - "FY_BND1 OPEN; signatory rate 1000 cents/1000kg; RatesSetting adopted."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_BND1", methodology: "RESIDUAL", airfield_opex_cents: 100000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 100000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_bnd1_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_bnd1_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "BN", legal_name: "Boundary Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { bn_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_bnd1_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_12: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_bnd1_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_12}" }
              as: AirportFinance
              captures: { rs_bnd1_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_bnd1_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_bnd1_id}/adopt"
              payload: {}
              as: AirportDirector
          trigger:
            - call: "POST /airport/fiscal_years/{fy_bnd1_id}/activity_records"
              payload: { airline_id: "${bn_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 1499, signature_status_at_activity: "NON_SIGNATORY" }
              as: AirportFinance
              captures: { fee_1499: $.data.billed_landing_fee_cents }
            - call: "POST /airport/fiscal_years/{fy_bnd1_id}/activity_records"
              payload: { airline_id: "${bn_id}", activity_date: "2026-09-06T00:00:00Z", landed_weight_kg: 1500, signature_status_at_activity: "NON_SIGNATORY" }
              as: AirportFinance
              captures: { fee_1500: $.data.billed_landing_fee_cents }
          assert:
            - "fee_1499 == 1250 (1 unit × 1250 non-signatory rate; 499 < 500 rounds down)"
            - "fee_1500 == 2500 (2 units × 1250; 500 >= 500 rounds up)"

      - name: mii_threshold_exact_50pct_count_and_weight
        grounds:
          - calculations.mii_tally
          - endpoints: "POST /airport/capital_projects/{id}/mii_votes"
        distinguishing_aspect: |
          Empty-set / exact-threshold boundary on a different metric
          (vote-percent) via a different endpoint (mii_votes POST). With
          threshold_pct=50 and exactly 50% of count AND weight approving,
          the >= comparison APPROVES the project; with 49% it does not.
        test_recipe:
          setup:
            - "FY_BND2 OPEN; two signatory airlines E1 (600 kg) and E2 (400 kg); threshold_pct=50; CP in MII_VOTING."
            - "E1 votes APPROVE. count leg: 1/2 = 50% >= 50% ✓; weight leg: 600/1000 = 60% >= 50% ✓ → auto-APPROVED."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_BND2", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_bnd2_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_bnd2_id}/open"
