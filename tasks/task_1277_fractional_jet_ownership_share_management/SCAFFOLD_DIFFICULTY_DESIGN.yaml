# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Fractional Jet Ownership & Share Management
# Every instance grounded in SCAFFOLD.yaml §1.1–§1.7; all formula-derived
# asserts pre-computed as literals via the §1.3 formulas and constants.

scaffold_difficulty_design:

  # ==========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calcs on DIFFERENT domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: occupied_hours_provisional_vs_final_billing
        grounds:
          - calculations.occupied_hours_billing
          - calculations.occupied_hours_billing.variants.provisional_estimate_billing
          - entities.BookingRequest.fields.billing_status
          - endpoints: "GET /bookings/{id}/quote"
        distinguishing_aspect: |
          Same booking priced two valid ways: the provisional quote (estimated
          hours × requested class rate, no peak adjustment preview) diverges
          from the final invoice line (actual hours × effective rate + peak
          surcharge). The variant lives in the FLIGHT-BILLING domain.
        test_recipe:
          setup:
            - "Program ACTIVE, peak_day_calendar includes 2026-09-07"
            - "MID class rate 450000 cents/hr; owner GOOD with ACTIVE 1/8 MID share (entitlement 100.00h)"
            - "Booking on 2026-09-07 (a peak day), estimated 2.00h, confirmed, completed with actual 2.50h"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-DV1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: ["2026-09-07"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "DV1 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N100DV", class_id: "${cls_mid}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-07T15:00:00Z", estimated_block_hours: 2.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /bookings/${bk_id}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
            - call: "GET /bookings/${bk_id}/quote"
              payload: {}
              as: FleetOps
              captures: { prov_total: $.data.provisional_total_cents }
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_block_hours: 2.50 }
              as: FleetOps
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", billing_period: "2026-09" }
              as: FinanceOps
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOps
              captures: { occ_fee: $.data.occupied_hours_fee_cents }
          assert:
            - "provisional quote ${prov_total} == 900000 (2.00h x 450000, estimate basis)"
            - "Invoice.${inv_id}.occupied_hours_fee_cents == 1293750 (2.50h x 450000 = 1125000 base + 168750 peak @1500bp)"
            - "provisional 900000 != final 1293750 — same booking, two valid variants"
            - "BookingRequest.${bk_id}.billing_status == FINALLY_BILLED"

      - name: depreciation_straight_line_vs_double_declining
        grounds:
          - calculations.depreciation_pass_through
          - calculations.depreciation_pass_through.variants.double_declining_balance
          - entities.DepreciationSchedule.fields.schedule_method
        distinguishing_aspect: |
          Two shares with identical basis 1200000 cents and 5-year recovery but
          different schedule_method produce different December tax adjustments:
          STRAIGHT_LINE posts 240000, DOUBLE_DECLINING posts 480000. The variant
          lives in the TAX-DEPRECIATION domain, not flight billing.
        test_recipe:
          setup:
            - "Program ACTIVE; owner GOOD with two ACTIVE 1/16 LIGHT shares, basis 1200000 each"
            - "Share A schedule_method=STRAIGHT_LINE, Share B schedule_method=DOUBLE_DECLINING"
            - "Clock advanced to 2026-12-15; December invoice issued"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-DV2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "LIGHT", hourly_rate_cents: 300000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 1500000, seats: 6 }
              as: ProgramAdmin
              captures: { cls_l: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "DV2 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_l}", fraction_numerator: 1, fraction_denominator: 16, purchase_price_cents: 1200000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { sh_a: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_l}", fraction_numerator: 1, fraction_denominator: 16, purchase_price_cents: 1200000, schedule_method: "DOUBLE_DECLINING", recovery_years: 5 }
              as: ProgramAdmin
              captures: { sh_b: $.data.id }
            - call: "POST /shares/${sh_a}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /shares/${sh_b}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", billing_period: "2026-12" }
              as: FinanceOps
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOps
              captures: { tax_adj: $.data.tax_adjustment_cents }
          assert:
            - "Invoice.${inv_id}.tax_adjustment_cents == -720000 (240000 SL + 480000 DDB, posted as credit)"
            - "STRAIGHT_LINE allowance 240000 != DOUBLE_DECLINING allowance 480000 for identical basis and recovery_years"

  # ==========================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes (a)/(b)/(c)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: occupied_hours_per_line_rounding_order
        grounds:
          - calculations.occupied_hours_billing
          - endpoints: "POST /invoices/{id}/issue"
        distinguishing_aspect: |
          Mode (b) — nested rounding order. The scaffold PINS round-per-line
          (base rounded, peak rounded from the rounded base, then lines summed).
          Fixture: LIGHT class with hourly_rate_cents=301337, two peak-day legs
          of 1.05h and 1.07h. Per-line: leg1 base=round(1.05×301337)=316404,
          peak=round(316404×0.15)=round(47460.60)=47461; leg2 base=
          round(1.07×301337)=322431, peak=round(48364.65)=48365; total 734661.
          The FORBIDDEN sum-then-round alternative rounds the summed raw peaks
          (47460.60+48364.65=95825.25→95825) giving 734660 — exactly 1 cent
          lower. The 1-cent delta is the assertion.
        test_recipe:
          setup:
            - "Program ACTIVE, peak day 2026-09-07; LIGHT class hourly_rate_cents=301337"
            - "Owner with ACTIVE 1/4 LIGHT share (200.00h entitlement)"
            - "Two bookings both completed on 2026-09-07 with actuals 1.05h and 1.07h"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-CF1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: ["2026-09-07"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "LIGHT", hourly_rate_cents: 301337, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 1500000, seats: 6 }
              as: ProgramAdmin
              captures: { cls_l: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "CF1 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_l}", fraction_numerator: 1, fraction_denominator: 4, purchase_price_cents: 4800000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N200CF", class_id: "${cls_l}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_l}", scheduled_departure_utc: "2026-09-07T10:00:00Z", estimated_block_hours: 1.10, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk1: $.data.id }
            - call: "POST /bookings/${bk1}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /bookings/${bk1}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
            - call: "POST /bookings/${bk1}/complete"
              payload: { actual_block_hours: 1.05 }
              as: FleetOps
            - call: "GET /shares/${share_id}"
              payload: {}
              as: FleetOps
              captures: { share_v2: $.data.version }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_l}", scheduled_departure_utc: "2026-09-07T18:00:00Z", estimated_block_hours: 1.10, expected_share_version: "${share_v2}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk2: $.data.id }
            - call: "POST /bookings/${bk2}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /bookings/${bk2}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
            - call: "POST /bookings/${bk2}/complete"
              payload: { actual_block_hours: 1.07 }
              as: FleetOps
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", billing_period: "2026-09" }
              as: FinanceOps
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOps
              captures: { occ_fee: $.data.occupied_hours_fee_cents }
          assert:
            - "Invoice.${inv_id}.occupied_hours_fee_cents == 734661 (per-line rounding: 316404+47461 + 322431+48365)"
            - "Rejects the sum-then-round alternative 734660 — exactly 1 cent lower"

      - name: exit_buyout_circular_evaluation_order
        grounds:
          - calculations.exit_buyout_formula
          - entities.ExitRequest.fields.buyout_amount_cents
          - entities.ExitRequest.fields.settlement_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned: settlement uses
          outstanding invoice balance as of valuation clock, EXCLUDING any line
          generated by the exit itself; penalty depends on years_held which
          depends on contract_year_index at valuation. With purchase 40000000,
          years_held=1: market=32800000, penalty=4373333, buyout=28426667,
          settlement=28426667-500000 outstanding+2000000 deposit=29926667.
        test_recipe:
          setup:
            - "Program ACTIVE since 2026-08-01, contract_year_start_month=8"
            - "Owner with ACTIVE 1/8 MID share purchased 40000000, deposit 2000000"
            - "One UNPAID issued invoice for 2026-08 totaling 500000 (management fee line)"
            - "Clock at 2027-09-01 (one full contract year elapsed → contract_year_index=1)"
            - "ExitRequest created, then valued"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-CF2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 4000000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "CF2 Owner", initial_deposit_cents: 2000000 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 40000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", billing_period: "2026-08" }
              as: FinanceOps
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /shares/${share_id}/exit"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { exit_id: $.data.id }
          trigger:
            - call: "POST /exit-requests/${exit_id}/value"
              payload: {}
              as: FinanceOps
              captures: { buyout: $.data.buyout_amount_cents, penalty: $.data.early_exit_penalty_cents }
          assert:
            - "ExitRequest.${exit_id}.early_exit_penalty_cents == 4373333 (32800000 × 0.20 × 2/3, round_half_up)"
            - "ExitRequest.${exit_id}.buyout_amount_cents == 28426667 (32800000 − 4373333)"
            - "Invoice.${inv_id} 2026-08 total_due_cents == 500000 (1/8 × 4000000 management fee, sole line) and is EXCLUDED from the exit's own valuation inputs"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine: two non-linear machines on DIFFERENT entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_dispute_cycle_returns_to_issued
        grounds:
          - state_machines.Invoice.DISPUTED_to_ISSUED
          - state_machines.Invoice.ISSUED_to_DISPUTED
        distinguishing_aspect: |
          Invoice has a CYCLE: ISSUED → DISPUTED → ISSUED (reject_adjustment)
          → DISPUTED again → SETTLED_AFTER_DISPUTE. The entity loops through
          DISPUTED more than once, with different side effects per branch
          (total replaced vs unchanged; owner standing restored vs not).
        test_recipe:
          setup:
            - "Owner with ACTIVE 1/8 MID share; September invoice issued (total 812500 = 312500 mgmt + 500000 occupied hours from a 1.00h non-peak MID leg... pinned below to pure management fee 312500)"
            - "Invoice issued then disputed; dispute rejected (back to ISSUED); disputed again; resolved with adjusted total 300000"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-NL1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "NL1 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", billing_period: "2026-08" }
              as: FinanceOps
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOps
          trigger:
            - call: "POST /invoices/${inv_id}/dispute"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /invoices/${inv_id}/resolve-dispute"
              payload: { adjusted_total_cents: 0, reject_adjustment: true }
              as: FinanceOps
            - call: "POST /invoices/${inv_id}/dispute"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /invoices/${inv_id}/resolve-dispute"
              payload: { adjusted_total_cents: 300000, reject_adjustment: false }
              as: FinanceOps
              captures: { final_total: $.data.total_due_cents, final_status: $.data.invoice_status }
          assert:
            - "After first resolve-dispute with reject_adjustment=true: invoice_status == ISSUED and total_due_cents unchanged at 312500"
            - "Second dispute succeeds from ISSUED (cycle re-entry)"
            - "After second resolve: Invoice.${inv_id}.invoice_status == SETTLED_AFTER_DISPUTE"
            - "Invoice.${inv_id}.total_due_cents == 300000 (adjusted, not original 312500)"

      - name: booking_parallel_dims_scheduling_x_billing
        grounds:
          - state_machines.BookingRequest
          - entities.BookingRequest.fields.booking_status
          - entities.BookingRequest.fields.billing_status
        distinguishing_aspect: |
          BookingRequest carries TWO PARALLEL state dimensions on one row:
          booking_status (REQUESTED→CONFIRMED→COMPLETED/CANCELLED/EXPIRED)
          evolves independently of billing_status (UNBILLED→PROVISIONALLY_BILLED
          →FINALLY_BILLED, and back to UNBILLED on cancel). A CONFIRMED booking
          can be PROVISIONALLY_BILLED; cancelling reverts billing to UNBILLED
          while scheduling goes to terminal CANCELLED.
        test_recipe:
          setup:
            - "Owner with ACTIVE 1/8 MID share; booking created, confirmed (PROVISIONALLY_BILLED), then cancelled (billing back to UNBILLED while booking_status is terminal CANCELLED)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-NL2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "NL2 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-10T15:00:00Z", estimated_block_hours: 2.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { after_confirm_billing: $.data.billing_status }
            - call: "POST /bookings/${bk_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { after_cancel_status: $.data.booking_status, after_cancel_billing: $.data.billing_status }
          assert:
            - "After confirm: booking_status == CONFIRMED AND billing_status == PROVISIONALLY_BILLED (dims moved together here)"
            - "After cancel: booking_status == CANCELLED (terminal) AND billing_status == UNBILLED (billing reverted — independent dimension)"
            - "Share.${share_id}.hours_remaining_cy == 100.00 (provisional 2.00h debit fully re-credited)"

  # ==========================================================================
  # Rule 4 — transitive_cascade: two cascades, depth>=3 and depth>=2, different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: maintenance_start_cascade_depth3
        grounds:
          - state_machines.MaintenanceEvent.SCHEDULED_to_IN_PROGRESS
          - state_machines.BookingRequest.CONFIRMED_to_CONFIRMED
          - entities.Aircraft.fields.aircraft_status
        distinguishing_aspect: |
          Depth-3 chain from POST /maintenance-events/{id}/start:
          MaintenanceEvent SCHEDULED→IN_PROGRESS (hop 0) → Aircraft
          IN_SERVICE→IN_MAINTENANCE (hop 1, caused by hop 0) → overlapping
          CONFIRMED booking loses assigned_aircraft_id (hop 2, caused by the
          aircraft status change) → booking interchange_direction reset to NONE
          and any prepared INTERCHANGE_ADJUSTMENT withdrawn (hop 3, caused by
          the unassignment). Each hop is caused by the previous link.
        test_recipe:
          setup:
            - "Program ACTIVE; MID tail N300TC assigned to a CONFIRMED booking departing 2026-09-10T15:00Z (est 2.00h)"
            - "SCHEDULED maintenance window on N300TC [2026-09-10T00:00Z, 2026-09-11T00:00Z) overlapping the booking"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-TC1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
