      - name: deal_diamond_fork_and_join_both_arms
        claim_type: branching
        grounds:
          - state_machines[DistributionDeal.status].shape
          - state_machines[DistributionDeal.status].transitions[EXECUTED->TERMINATION_NOTICE]
          - state_machines[DistributionDeal.status].transitions[EXECUTED->EXPIRED]
          - state_machines[DistributionDeal.status].transitions[TERMINATION_NOTICE->POST_TERM_COLLECTION]
          - state_machines[DistributionDeal.status].transitions[EXPIRED->POST_TERM_COLLECTION]
        distinguishing_aspect: |
          The two forks out of EXECUTED reach the same join state POST_TERM_COLLECTION by
          deliberately divergent side-effect sets, and the divergence is visible on the releases
          rather than on the deal: the terminate arm MOVES release state (RELEASED -> REVERSION_PENDING,
          PLANNED -> REVERTED) and sets termination_effective_date, while the expire arm moves NO
          release state, leaves termination_effective_date null, and dates the collection window off
          term_end_date instead. Falsified if an implementation shares one side-effect routine
          between the arms, or if either arm cannot reach the join.
        test_recipe:
          setup:
            - "deal T (terminate arm): term 2026-01-01..2026-12-31, post_term_collection_days 90, one PLANNED release and one RELEASED release"
            - "deal E (expire arm): term 2026-01-01..2026-06-30, post_term_collection_days 90, one PLANNED release and one RELEASED release"
            - "the logical clock stays at its 2026-08-01T00:00:00Z default, which is inside deal T's term and strictly after deal E's term_end_date"
