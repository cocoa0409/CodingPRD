  # ===========================================================================
  - section: calculations
    instances:
      - name: spectro_ce_failure_with_passing_elements
        claim_type: constants_applied
        grounds: [calculations.spectro_certification]
        distinguishing_aspect: "Compound certification: every element reading sits inside its [min,max] band, yet the carbon equivalent CE = 3.55 + 2.55/3 + 0.02/2 = 4.41 exceeds ce_max 4.30, so the heat still fails to SAMPLED."
        test_recipe:
          setup: ["Heat with 1000 kg charged; spec C[3.2,3.6] Si[2.2,2.6] P[0,0.05] ce_max 4.30"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 }, Si: { min: 2.2, max: 2.6 }, P: { min: 0.0, max: 0.05 } }, ce_max: 4.30 } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 3.55, Si: 2.55, P: 0.02 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
          trigger:
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.55, Si: 2.55, P: 0.02 } }, as: Spectrographer, as_user_id: "spectro_1", captures: { h: $.data } }
          assert:
            - "status == SAMPLED and last_sample_passed == false (CE 4.41 > 4.30 despite all element bands passing)"

      - name: spectro_inclusive_bounds_pass_at_min_and_max
        claim_type: precision
        grounds: [calculations.spectro_certification]
        distinguishing_aspect: "Element bounds are inclusive: readings exactly at min (C 3.20) and max (Si 2.60, P 0.05) pass, with CE 3.20+0.8667+0.025 = 4.09 <= 4.30."
        test_recipe:
          setup: ["Heat with 1000 kg charged at boundary composition"]
