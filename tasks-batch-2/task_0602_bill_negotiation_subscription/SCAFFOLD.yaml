scenario: |
  Bill Negotiation & Subscription Manager (Rocket Money/Trim style): linked-account
  recurring-charge detection, subscription inventory & cancel-on-behalf, bill-negotiation
  savings & success-fee split, price-drop/refund pursuit, free-trial reminder, savings
  auto-transfer, concierge dispute, savings reporting.

domain_name: bill-negotiation-subscription
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - scheduled_deferred_actions
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities under a Member, linked by FK references (LinkedAccount, RecurringCharge,
  # Subscription, NegotiationCase, RefundClaim, etc.) — no deep nesting in URL paths.

  state_machine_shape: cyclic
  # NegotiationCase has negotiation rounds (PROPOSED -> COUNTERED -> PROPOSED) and
  # RefundClaim has a dispute escalation loop; Subscription has parallel-ish trial/billing tracks.

  relationship_patterns:
    - one_to_many        # Member -> LinkedAccount -> RecurringCharge -> Subscription
    - flat               # cross-aggregate FK references between cases/claims and charges
    - cross_aggregate    # SavingsLedgerEntry references both NegotiationCase and Subscription

  role_model: peer_roles
  # Member acts on own resources; ConciergeAgent runs negotiations/disputes; PlatformAdmin
  # operates clock/webhooks/seed; SavingsBank is the auto-transfer destination operator.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Member login email", constraints: "unique among Members" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: success_fee_pct, type: number, source: input, default: 0.40, description: "Member's contracted success-fee share of realized negotiation/refund savings", constraints: "0 < success_fee_pct < 1" }
      - { name: savings_account_id, type: string, source: input, required: false, description: "FK -> SavingsAccount.id; nullable; destination for savings auto-transfer; must belong to this Member" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED members cannot initiate negotiations or transfers", constraints: "ACTIVE | SUSPENDED" }
      - { name: lifetime_gross_savings_cents, type: integer, source: computed, default: 0, description: "Sum of realized gross savings across all member NegotiationCases (status WON) and RefundClaims (status REFUNDED)" }
      - { name: lifetime_member_savings_cents, type: integer, source: computed, default: 0, description: "Sum of member's net share (gross minus success fee) across all realized cases/claims" }

  - name: SavingsAccount
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: nickname, type: string, source: input, description: "Display name for the savings destination" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Running balance of member-net savings transferred in; never decreases via this API" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED — CLOSED accounts reject transfers", constraints: "OPEN | CLOSED" }

  - name: LinkedAccount
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: institution_name, type: string, source: input, description: "Bank/card institution display name" }
      - { name: account_type, type: enum, source: input, description: "CHECKING | CREDIT_CARD", constraints: "CHECKING | CREDIT_CARD" }
      - { name: status, type: enum, source: system, default: "LINKED", description: "LINKED | UNLINKED — UNLINKED stops charge detection", constraints: "LINKED | UNLINKED" }
      - { name: detected_charge_count, type: integer, source: computed, default: 0, description: "Count of RecurringCharges detected on this account whose status != DISMISSED" }

  - name: RecurringCharge
    parent: null
    common_fields: true
    fields:
      - { name: linked_account_id, type: string, source: input, description: "FK -> LinkedAccount.id; account the charge was detected on" }
      - { name: merchant_name, type: string, source: input, description: "Normalized merchant/biller name" }
      - { name: amount_cents, type: integer, source: input, description: "Per-cycle charge amount in cents", constraints: ">= 1" }
      - { name: cadence, type: enum, source: input, description: "MONTHLY | ANNUAL | WEEKLY — billing cadence used to annualize", constraints: "MONTHLY | ANNUAL | WEEKLY" }
      - { name: category, type: enum, source: input, default: "OTHER", description: "STREAMING | TELECOM | INSURANCE | UTILITY | SOFTWARE | OTHER", constraints: "STREAMING | TELECOM | INSURANCE | UTILITY | SOFTWARE | OTHER" }
      - { name: first_seen_utc, type: datetime, source: input, description: "Timestamp the charge was first observed" }
      - { name: annualized_cost_cents, type: integer, source: computed, description: "Annualized cost derived from amount_cents and cadence (see calc annualize_charge_cost)" }
      - { name: status, type: enum, source: system, default: "DETECTED", description: "DETECTED | CONFIRMED | DISMISSED — CONFIRMED charges may be converted into a Subscription or NegotiationCase", constraints: "DETECTED | CONFIRMED | DISMISSED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: recurring_charge_id, type: string, source: input, description: "FK -> RecurringCharge.id; charge this subscription tracks" }
      - { name: plan_name, type: string, source: input, description: "Subscription plan name" }
      - { name: monthly_cost_cents, type: integer, source: input, description: "Monthly cost charged by provider", constraints: ">= 0" }
      - { name: is_free_trial, type: boolean, source: input, default: false, description: "True if currently in a free-trial period" }
      - { name: trial_end_utc, type: datetime, source: input, required: false, description: "When the free trial converts to paid; required when is_free_trial=true" }
      - { name: trial_reminder_lead_days, type: integer, source: input, default: 3, description: "Days before trial_end_utc a reminder becomes due", constraints: ">= 0" }
      - { name: reminder_due, type: boolean, source: computed, default: false, description: "True when is_free_trial and clock >= trial_end_utc - trial_reminder_lead_days and not yet cancelled" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CANCEL_REQUESTED | CANCELLED | CANCEL_FAILED — cancel-on-behalf lifecycle", constraints: "ACTIVE | CANCEL_REQUESTED | CANCELLED | CANCEL_FAILED" }
      - { name: cancelled_utc, type: datetime, source: system, required: false, description: "Timestamp cancellation was confirmed by provider" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version (from common_fields)" }

  - name: NegotiationCase
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: recurring_charge_id, type: string, source: input, description: "FK -> RecurringCharge.id; the bill being negotiated" }
      - { name: assigned_agent_id, type: string, source: input, required: false, description: "FK -> ConciergeAgentProfile.id; agent who owns this case" }
      - { name: baseline_annual_cost_cents, type: integer, source: system, description: "Snapshot of RecurringCharge.annualized_cost_cents at case OPEN; immutable baseline for savings" }
      - { name: current_offer_annual_cost_cents, type: integer, source: system, required: false, description: "Latest provider/agent offered annual cost during negotiation rounds" }
      - { name: agreed_annual_cost_cents, type: integer, source: system, required: false, description: "Final agreed annual cost set on WON" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of completed proposal/counter rounds" }
      - { name: gross_annual_savings_cents, type: integer, source: computed, default: 0, description: "= max(0, baseline_annual_cost_cents - agreed_annual_cost_cents) on WON; else 0" }
      - { name: success_fee_cents, type: integer, source: computed, default: 0, description: "Platform success fee on realized savings (see calc success_fee_split)" }
      - { name: member_net_savings_cents, type: integer, source: computed, default: 0, description: "= gross_annual_savings_cents - success_fee_cents" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | PROPOSED | COUNTERED | WON | LOST | CANCELLED — cyclic PROPOSED<->COUNTERED rounds", constraints: "OPEN | PROPOSED | COUNTERED | WON | LOST | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version (from common_fields)" }

  - name: ConciergeAgentProfile
    parent: null
    common_fields: false
    fields:
      - { name: display_name, type: string, source: input, description: "Concierge agent display name" }
      - { name: max_open_cases, type: integer, source: input, default: 5, description: "Max simultaneously open NegotiationCases the agent may own", constraints: ">= 1" }
      - { name: open_case_count, type: integer, source: computed, default: 0, description: "Count of NegotiationCases assigned to this agent whose status IN {OPEN, PROPOSED, COUNTERED}" }

  - name: RefundClaim
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: recurring_charge_id, type: string, source: input, description: "FK -> RecurringCharge.id; charge a price-drop/refund is pursued for" }
      - { name: claim_type, type: enum, source: input, description: "PRICE_DROP | DOUBLE_BILL | SERVICE_OUTAGE", constraints: "PRICE_DROP | DOUBLE_BILL | SERVICE_OUTAGE" }
      - { name: observed_old_amount_cents, type: integer, source: input, description: "Amount originally paid (per cycle)", constraints: ">= 1" }
      - { name: observed_new_amount_cents, type: integer, source: input, description: "Lower amount now available (per cycle)", constraints: ">= 0" }
      - { name: claimed_refund_cents, type: integer, source: computed, description: "Pursued refund amount (see calc refund_pursuit_amount)" }
      - { name: approved_refund_cents, type: integer, source: system, required: false, description: "Refund amount provider approved on REFUNDED" }
      - { name: success_fee_cents, type: integer, source: computed, default: 0, description: "Platform success fee on approved refund (see calc success_fee_split)" }
      - { name: member_net_savings_cents, type: integer, source: computed, default: 0, description: "= approved_refund_cents - success_fee_cents" }
      - { name: dispute_round, type: integer, source: system, default: 0, description: "Number of times claim has been escalated back into dispute" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | UNDER_REVIEW | DISPUTED | REFUNDED | DENIED — DENIED<->DISPUTED escalation loop", constraints: "FILED | UNDER_REVIEW | DISPUTED | REFUNDED | DENIED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version (from common_fields)" }

  - name: SavingsLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member the savings belongs to" }
      - { name: source_type, type: enum, source: input, description: "NEGOTIATION | REFUND", constraints: "NEGOTIATION | REFUND" }
      - { name: negotiation_case_id, type: string, source: input, required: false, description: "FK -> NegotiationCase.id; set when source_type=NEGOTIATION" }
      - { name: refund_claim_id, type: string, source: input, required: false, description: "FK -> RefundClaim.id; set when source_type=REFUND" }
      - { name: gross_savings_cents, type: integer, source: system, description: "Realized gross savings booked by this entry" }
      - { name: success_fee_cents, type: integer, source: system, description: "Success fee booked by this entry" }
      - { name: member_net_cents, type: integer, source: system, description: "= gross_savings_cents - success_fee_cents" }
      - { name: transfer_status, type: enum, source: system, default: "PENDING", description: "PENDING | TRANSFERRED | REVERSED — auto-transfer lifecycle of member_net to SavingsAccount", constraints: "PENDING | TRANSFERRED | REVERSED" }
      - { name: transferred_utc, type: datetime, source: system, required: false, description: "When member_net was auto-transferred to the SavingsAccount" }

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: system, default: "2026-01-01T00:00:00Z", description: "Logical server clock; defaults to 2026-01-01T00:00:00Z at startup" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RecurringCharge
    initial_state: DETECTED
    terminal_states: [DISMISSED]
    transitions:
      - from: DETECTED
        to: CONFIRMED
        trigger: "POST /recurring-charges/{id}/confirm"
        actor: Member
        preconditions:
          - "LinkedAccount.status == LINKED"
          - "RecurringCharge.status == DETECTED"
        side_effects:
          - "recompute RecurringCharge.annualized_cost_cents via annualize_charge_cost"
        note: "Member confirms a detected charge is real before any action."
      - from: DETECTED
        to: DISMISSED
        trigger: "POST /recurring-charges/{id}/dismiss"
        actor: Member
        preconditions:
          - "RecurringCharge.status == DETECTED"
        side_effects:
          - "decrement LinkedAccount.detected_charge_count by 1"
      - from: CONFIRMED
        to: DISMISSED
        trigger: "POST /recurring-charges/{id}/dismiss"
        actor: Member
        preconditions:
          - "RecurringCharge.status == CONFIRMED"
          - "no Subscription, NegotiationCase, or RefundClaim references this charge in a non-terminal state"
        side_effects:
          - "decrement LinkedAccount.detected_charge_count by 1"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCEL_REQUESTED
        trigger: "POST /subscriptions/{id}/request-cancel"
        actor: Member
        preconditions:
          - "Member.status == ACTIVE"
          - "Subscription.status == ACTIVE"
          - "payload expected_subscription_version == Subscription.version"
        side_effects:
          - "increment Subscription.version by 1"
      - from: CANCEL_REQUESTED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/confirm-cancel"
        actor: ConciergeAgent
        preconditions:
          - "Subscription.status == CANCEL_REQUESTED"
        side_effects:
          - "set Subscription.cancelled_utc = SystemClock.current_utc"
          - "set Subscription.reminder_due = false"
          - "increment Subscription.version by 1"
      - from: CANCEL_REQUESTED
        to: CANCEL_FAILED
        trigger: "POST /subscriptions/{id}/fail-cancel"
        actor: ConciergeAgent
        preconditions:
          - "Subscription.status == CANCEL_REQUESTED"
        side_effects:
          - "increment Subscription.version by 1"
      - from: CANCEL_FAILED
        to: CANCEL_REQUESTED
        trigger: "POST /subscriptions/{id}/request-cancel"
        actor: Member
        preconditions:
          - "Member.status == ACTIVE"
          - "Subscription.status == CANCEL_FAILED"
          - "payload expected_subscription_version == Subscription.version"
        side_effects:
          - "increment Subscription.version by 1"
        note: "Retry loop: a failed cancellation can be re-requested (cyclic)."

  - entity: NegotiationCase
    initial_state: OPEN
    terminal_states: [WON, LOST, CANCELLED]
    transitions:
      - from: OPEN
        to: PROPOSED
        trigger: "POST /negotiation-cases/{id}/propose"
        actor: ConciergeAgent
        preconditions:
          - "NegotiationCase.status == OPEN"
          - "NegotiationCase.assigned_agent_id is set"
          - "payload offered_annual_cost_cents >= 0"
        side_effects:
          - "set NegotiationCase.current_offer_annual_cost_cents = payload offered_annual_cost_cents"
          - "increment NegotiationCase.round_count by 1"
          - "increment NegotiationCase.version by 1"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /negotiation-cases/{id}/counter"
        actor: ConciergeAgent
        preconditions:
          - "NegotiationCase.status == PROPOSED"
          - "payload counter_annual_cost_cents >= 0"
        side_effects:
          - "set NegotiationCase.current_offer_annual_cost_cents = payload counter_annual_cost_cents"
          - "increment NegotiationCase.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /negotiation-cases/{id}/propose"
        actor: ConciergeAgent
        preconditions:
          - "NegotiationCase.status == COUNTERED"
          - "NegotiationCase.round_count < MAX_ROUNDS"
          - "payload offered_annual_cost_cents >= 0"
        side_effects:
          - "set NegotiationCase.current_offer_annual_cost_cents = payload offered_annual_cost_cents"
          - "increment NegotiationCase.round_count by 1"
          - "increment NegotiationCase.version by 1"
        note: "Cyclic negotiation rounds capped at MAX_ROUNDS."
      - from: PROPOSED
        to: WON
        trigger: "POST /negotiation-cases/{id}/accept"
        actor: ConciergeAgent
        preconditions:
          - "NegotiationCase.status == PROPOSED"
          - "NegotiationCase.current_offer_annual_cost_cents <= NegotiationCase.baseline_annual_cost_cents"
        side_effects:
          - "set NegotiationCase.agreed_annual_cost_cents = current_offer_annual_cost_cents"
          - "compute NegotiationCase.gross_annual_savings_cents = baseline_annual_cost_cents - agreed_annual_cost_cents"
          - "compute NegotiationCase.success_fee_cents via success_fee_split"
          - "compute NegotiationCase.member_net_savings_cents = gross_annual_savings_cents - success_fee_cents"
          - "create SavingsLedgerEntry (source_type=NEGOTIATION, transfer_status=PENDING) booking these amounts [cascade L1->ledger]"
          - "recompute Member.lifetime_gross_savings_cents and lifetime_member_savings_cents [cascade L2->member]"
          - "decrement ConciergeAgentProfile.open_case_count by 1"
          - "increment NegotiationCase.version by 1"
      - from: COUNTERED
        to: WON
        trigger: "POST /negotiation-cases/{id}/accept"
        actor: ConciergeAgent
        preconditions:
          - "NegotiationCase.status == COUNTERED"
          - "NegotiationCase.current_offer_annual_cost_cents <= NegotiationCase.baseline_annual_cost_cents"
        side_effects:
          - "set NegotiationCase.agreed_annual_cost_cents = current_offer_annual_cost_cents"
          - "compute NegotiationCase.gross_annual_savings_cents = baseline_annual_cost_cents - agreed_annual_cost_cents"
          - "compute NegotiationCase.success_fee_cents via success_fee_split"
          - "compute NegotiationCase.member_net_savings_cents = gross_annual_savings_cents - success_fee_cents"
          - "create SavingsLedgerEntry (source_type=NEGOTIATION, transfer_status=PENDING) booking these amounts"
          - "recompute Member.lifetime_gross_savings_cents and lifetime_member_savings_cents"
          - "decrement ConciergeAgentProfile.open_case_count by 1"
          - "increment NegotiationCase.version by 1"
      - from: OPEN
        to: LOST
        trigger: "POST /negotiation-cases/{id}/abandon"
        actor: ConciergeAgent
        preconditions:
          - "NegotiationCase.status IN {OPEN, PROPOSED, COUNTERED}"
        side_effects:
          - "decrement ConciergeAgentProfile.open_case_count by 1"
          - "increment NegotiationCase.version by 1"
      - from: PROPOSED
        to: LOST
        trigger: "POST /negotiation-cases/{id}/abandon"
        actor: ConciergeAgent
        preconditions:
          - "NegotiationCase.status IN {OPEN, PROPOSED, COUNTERED}"
        side_effects:
          - "decrement ConciergeAgentProfile.open_case_count by 1"
          - "increment NegotiationCase.version by 1"
      - from: COUNTERED
        to: LOST
        trigger: "POST /negotiation-cases/{id}/abandon"
        actor: ConciergeAgent
        preconditions:
          - "NegotiationCase.status IN {OPEN, PROPOSED, COUNTERED}"
        side_effects:
          - "decrement ConciergeAgentProfile.open_case_count by 1"
          - "increment NegotiationCase.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /negotiation-cases/{id}/cancel"
        actor: Member
        preconditions:
          - "Member is owner of the case"
          - "NegotiationCase.status == OPEN"
        side_effects:
          - "decrement ConciergeAgentProfile.open_case_count by 1"
          - "increment NegotiationCase.version by 1"

  - entity: RefundClaim
    initial_state: FILED
    terminal_states: [REFUNDED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /refund-claims/{id}/start-review"
        actor: ConciergeAgent
        preconditions:
          - "RefundClaim.status == FILED"
        side_effects:
          - "increment RefundClaim.version by 1"
      - from: UNDER_REVIEW
        to: REFUNDED
        trigger: "POST /refund-claims/{id}/approve"
        actor: ConciergeAgent
        preconditions:
          - "RefundClaim.status == UNDER_REVIEW"
          - "payload approved_refund_cents >= 0"
          - "payload approved_refund_cents <= RefundClaim.claimed_refund_cents"
        side_effects:
          - "set RefundClaim.approved_refund_cents = payload approved_refund_cents"
          - "compute RefundClaim.success_fee_cents via success_fee_split"
          - "compute RefundClaim.member_net_savings_cents = approved_refund_cents - success_fee_cents"
          - "create SavingsLedgerEntry (source_type=REFUND, transfer_status=PENDING) booking these amounts [cascade R1->ledger]"
          - "recompute Member.lifetime_gross_savings_cents and lifetime_member_savings_cents [cascade R2->member]"
          - "increment RefundClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /refund-claims/{id}/deny"
        actor: ConciergeAgent
        preconditions:
          - "RefundClaim.status == UNDER_REVIEW"
        side_effects:
          - "increment RefundClaim.version by 1"
      - from: DENIED
        to: DISPUTED
        trigger: "POST /refund-claims/{id}/dispute"
        actor: Member
        preconditions:
          - "Member is owner of the claim"
          - "RefundClaim.status == DENIED"
          - "RefundClaim.dispute_round < MAX_DISPUTE_ROUNDS"
          - "payload expected_refund_claim_version == RefundClaim.version"
        side_effects:
          - "increment RefundClaim.dispute_round by 1"
          - "increment RefundClaim.version by 1"
        note: "Concierge dispute escalation loop (DENIED -> DISPUTED -> UNDER_REVIEW -> ...)."
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "POST /refund-claims/{id}/start-review"
        actor: ConciergeAgent
        preconditions:
          - "RefundClaim.status == DISPUTED"
        side_effects:
          - "increment RefundClaim.version by 1"

  - entity: SavingsLedgerEntry
    initial_state: PENDING
    terminal_states: [TRANSFERRED, REVERSED]
    transitions:
      - from: PENDING
        to: TRANSFERRED
        trigger: "POST /savings-ledger-entries/{id}/transfer"
        actor: Member
        preconditions:
          - "Member is owner of the entry"
          - "Member.status == ACTIVE"
          - "Member.savings_account_id is set"
          - "SavingsAccount.status == OPEN"
          - "SavingsLedgerEntry.transfer_status == PENDING"
        side_effects:
          - "set SavingsLedgerEntry.transferred_utc = SystemClock.current_utc"
          - "increment SavingsAccount.balance_cents by SavingsLedgerEntry.member_net_cents [conserves: total_member_net]"
      - from: TRANSFERRED
        to: REVERSED
        trigger: "POST /savings-ledger-entries/{id}/reverse"
        actor: ConciergeAgent
        preconditions:
          - "SavingsLedgerEntry.transfer_status == TRANSFERRED"
          - "SavingsAccount.status == OPEN"
        side_effects:
          - "decrement SavingsAccount.balance_cents by SavingsLedgerEntry.member_net_cents [compensation: restores total_member_net to pre-transfer value]"
          - "clear SavingsLedgerEntry.transferred_utc"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Member.status == ACTIVE"
        side_effects:
          - "increment Member.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Member.status == SUSPENDED"
        side_effects:
          - "increment Member.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: subscription-cancel-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/request-cancel"
    occ_field: "expected_subscription_version"
    description: |
      Requesting cancellation of a Subscription whose version has advanced since the
      client last observed it is rejected. The new cancel request legitimately supersedes
      the prior intent (e.g., a concierge already flipped the subscription to
      CANCEL_REQUESTED and then to CANCEL_FAILED, bumping version), so a client whose view
      of the subscription is stale must re-read before acting.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: refund-dispute-stale-version
    parent_entity: RefundClaim
    write_endpoint: "POST /refund-claims/{id}/dispute"
    occ_field: "expected_refund_claim_version"
    description: |
      Disputing a DENIED RefundClaim whose version has advanced since the client last
      observed it is rejected. A re-dispute legitimately supersedes the member's prior
      view, but a concierge re-review may have already bumped the version, making the
      member's expected_refund_claim_version stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: annualize_charge_cost
    trigger: "On RecurringCharge create, and on RecurringCharge DETECTED->CONFIRMED transition"
    algorithm: threshold
    formula: |
      # cadence-driven annualization; WEEKLY uses 52 weeks, not 365/7, and is the
      # boundary that distinguishes this from a naive amount*12.
      if cadence == "MONTHLY":  annualized = amount_cents * 12
      elif cadence == "ANNUAL": annualized = amount_cents * 1
      elif cadence == "WEEKLY": annualized = amount_cents * 52
      annualized_cost_cents = annualized   # integer cents, exact (no rounding needed)
    input_set: "Single RecurringCharge row; cadence and amount_cents."
    constants:
      WEEKS_PER_YEAR: 52
      MONTHS_PER_YEAR: 12
    precision: "integer cents, exact"

  - name: success_fee_split
    trigger: "On NegotiationCase ->WON and on RefundClaim ->REFUNDED"
    algorithm: tiered_pricing
    formula: |
      # Realized gross savings basis differs by domain:
      #   NEGOTIATION: gross = max(0, baseline_annual_cost_cents - agreed_annual_cost_cents)
      #   REFUND:      gross = approved_refund_cents
      # Tiered platform fee rate applied to gross, then capped, then floored, in THIS order:
      #   step 1: pick rate by tier on gross (marginal NOT used; single rate by total tier)
      #     gross <  LOW_TIER_CENTS                      -> rate = LOW_RATE   (0.40)
      #     LOW_TIER_CENTS <= gross < HIGH_TIER_CENTS    -> rate = MID_RATE   (0.35)
      #     gross >= HIGH_TIER_CENTS                     -> rate = HIGH_RATE  (0.30)
      #   step 2: raw_fee = round_half_up(gross * rate)          # round AFTER multiply
      #   step 3: capped  = min(raw_fee, FEE_CAP_CENTS)          # apply cap
      #   step 4: success_fee_cents = max(capped, 0)             # floor at zero
      # member_net = gross - success_fee_cents
      # Evaluation order is pinned: tier-rate selection precedes rounding; rounding
      # precedes cap; cap precedes floor. NOTE: rate uses platform tier table, NOT
      # Member.success_fee_pct (that field is a display/contract hint only).
    input_set: "One NegotiationCase (WON) OR one RefundClaim (REFUNDED); its realized gross."
    constants:
      LOW_TIER_CENTS: 10000
      HIGH_TIER_CENTS: 50000
      LOW_RATE: 0.40
      MID_RATE: 0.35
      HIGH_RATE: 0.30
      FEE_CAP_CENTS: 20000
    precision: "2-step: multiply in cents then round_half_up to whole cents"
    variants:
      - name: negotiation_basis
        when: "source is a NegotiationCase reaching WON"
        difference: "gross = baseline_annual_cost_cents - agreed_annual_cost_cents (a delta of two annual figures)"
      - name: refund_basis
        when: "source is a RefundClaim reaching REFUNDED"
        difference: "gross = approved_refund_cents (a single absolute approved amount, not a delta)"

  - name: refund_pursuit_amount
    trigger: "On RefundClaim create (computes claimed_refund_cents)"
    algorithm: forward_looking
    formula: |
      # Two valid interpretations of 'pursued refund' produce different numbers; the
      # scaffold pins ONE per claim_type. delta = max(0, observed_old_amount_cents -
      # observed_new_amount_cents).
      if claim_type == "PRICE_DROP":
        # retroactive pursuit over the lookback window: refund the per-cycle delta for
        # each of the LOOKBACK_CYCLES already billed at the old price.
        claimed = delta * LOOKBACK_CYCLES
      elif claim_type == "DOUBLE_BILL":
        # a duplicate charge of the OLD amount is refunded in full, exactly once.
        claimed = observed_old_amount_cents
      elif claim_type == "SERVICE_OUTAGE":
        # pro-rated credit: OUTAGE_DAYS out of 30-day cycle on the OLD amount, rounded.
        claimed = round_half_up(observed_old_amount_cents * OUTAGE_DAYS / 30)
      claimed_refund_cents = max(0, claimed)
    input_set: "Single RefundClaim row at creation."
    constants:
      LOOKBACK_CYCLES: 6
      OUTAGE_DAYS: 10
      CYCLE_DAYS: 30
    precision: "round_half_up to whole cents on SERVICE_OUTAGE pro-ration"

  - name: member_lifetime_savings_rollup
    trigger: "On NegotiationCase ->WON and RefundClaim ->REFUNDED (cascade), recomputed from realized rows"
    algorithm: aggregation
    formula: |
      # Recompute (not incremental) from realized rows to avoid drift:
      lifetime_gross_savings_cents =
        sum(NegotiationCase.gross_annual_savings_cents for cases WHERE member_id=M AND status==WON)
        + sum(RefundClaim.approved_refund_cents for claims WHERE member_id=M AND status==REFUNDED)
      lifetime_member_savings_cents =
        sum(NegotiationCase.member_net_savings_cents for cases WHERE member_id=M AND status==WON)
        + sum(RefundClaim.member_net_savings_cents for claims WHERE member_id=M AND status==REFUNDED)
    input_set: "All WON NegotiationCases and REFUNDED RefundClaims for the member; terminal-only."
    constants: {}
    precision: "integer cents, exact"

  - name: savings_report_summary
    trigger: "GET /members/{id}/savings-report"
    algorithm: aggregation
    formula: |
      # Report aggregates over the member's realized + pending savings.
      realized_gross_cents   = lifetime_gross_savings_cents (from rollup)
      realized_net_cents     = lifetime_member_savings_cents (from rollup)
      total_fees_cents       = realized_gross_cents - realized_net_cents
      pending_transfer_cents = sum(SavingsLedgerEntry.member_net_cents
                                   WHERE member_id=M AND transfer_status==PENDING)
      transferred_cents      = sum(SavingsLedgerEntry.member_net_cents
                                   WHERE member_id=M AND transfer_status==TRANSFERRED)
      # REVERSED entries are EXCLUDED from transferred_cents (boundary: status filter).
    input_set: "All SavingsLedgerEntries for member plus rollup fields."
    constants: {}
    precision: "integer cents, exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /members and POST /_clock/set_current_utc" }
  - { priority: 2, category: auth, check: "Role permitted for this operation per RBAC matrix", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Acting entity_backed user owns the target resource (Member owns own subscriptions/cases/claims/ledger entries)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "member-owned resource mutations" }
  - { priority: 4, category: existence, check: "Path-referenced resource exists (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all {id} paths" }
  - { priority: 5, category: existence, check: "Body FK references resolve to existing resources", error_id: ERR_FK_NOT_FOUND, http_status: 404, applies_to: "endpoints with FK body fields" }
  - { priority: 6, category: business_constraint, check: "Required body fields present and well-typed; enums within declared sets", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all writes" }
  - { priority: 7, category: business_constraint, check: "Numeric fields satisfy declared ranges (amount_cents>=1, success_fee_pct in (0,1), offered/counter costs>=0)", error_id: ERR_VALUE_OUT_OF_RANGE, http_status: 422, applies_to: "writes with numeric inputs" }
  - { priority: 8, category: state, check: "Target resource is in a state from which this transition is allowed", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 9, category: business_referential, check: "Cross-entity precondition: LinkedAccount.status==LINKED when confirming a charge; RecurringCharge.status==CONFIRMED when opening Subscription/NegotiationCase/RefundClaim against it", error_id: ERR_LINKED_RESOURCE_STATE, http_status: 409, applies_to: "POST /recurring-charges/{id}/confirm, POST /subscriptions, POST /negotiation-cases, POST /refund-claims" }
  - { priority: 10, category: business_referential, check: "Cannot dismiss a CONFIRMED charge that has a non-terminal Subscription/NegotiationCase/RefundClaim referencing it", error_id: ERR_CHARGE_IN_USE, http_status: 409, applies_to: "POST /recurring-charges/{id}/dismiss" }
  - { priority: 11, category: business_constraint, check: "ConciergeAgent open_case_count < max_open_cases before assigning/opening a case to that agent", error_id: ERR_AGENT_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /negotiation-cases" }
  - { priority: 12, category: business_constraint, check: "Negotiation round cap: cannot propose/counter when round_count >= MAX_ROUNDS", error_id: ERR_MAX_ROUNDS_REACHED, http_status: 409, applies_to: "POST /negotiation-cases/{id}/propose, POST /negotiation-cases/{id}/counter" }
  - { priority: 13, category: business_constraint, check: "Dispute round cap: cannot dispute when dispute_round >= MAX_DISPUTE_ROUNDS", error_id: ERR_MAX_DISPUTE_ROUNDS_REACHED, http_status: 409, applies_to: "POST /refund-claims/{id}/dispute" }
  - { priority: 14, category: business_fiscal, check: "Accepted negotiation offer must not exceed baseline (current_offer_annual_cost_cents <= baseline_annual_cost_cents)", error_id: ERR_OFFER_ABOVE_BASELINE, http_status: 422, applies_to: "POST /negotiation-cases/{id}/accept" }
  - { priority: 15, category: business_fiscal, check: "Approved refund must not exceed claimed_refund_cents", error_id: ERR_REFUND_ABOVE_CLAIM, http_status: 422, applies_to: "POST /refund-claims/{id}/approve" }
  - { priority: 16, category: business_referential, check: "Trial subscription must supply trial_end_utc when is_free_trial=true", error_id: ERR_TRIAL_END_REQUIRED, http_status: 422, applies_to: "POST /subscriptions" }
  - { priority: 17, category: business_fiscal, check: "Savings transfer requires Member.savings_account_id set and SavingsAccount.status==OPEN", error_id: ERR_NO_SAVINGS_DESTINATION, http_status: 409, applies_to: "POST /savings-ledger-entries/{id}/transfer" }
  - { priority: 18, category: state, check: "OCC: payload expected_<parent>_version equals current parent.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /subscriptions/{id}/request-cancel, POST /refund-claims/{id}/dispute" }
  - { priority: 19, category: business_constraint, check: "Member must be ACTIVE to initiate negotiations, cancellations, disputes, or transfers", error_id: ERR_MEMBER_SUSPENDED, http_status: 403, applies_to: "POST /negotiation-cases, POST /subscriptions/{id}/request-cancel, POST /refund-claims/{id}/dispute, POST /savings-ledger-entries/{id}/transfer" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Member ----
  - { method: POST, path: "/members", description: "Register a member", roles: [Anonymous], code: 201, input: [email, full_name, "success_fee_pct?"], output: Member, side_effects: ["Member created status=ACTIVE"] }
  - { method: GET, path: "/members/{id}", description: "Get a member", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/members", description: "List members; filterable by savings_account_id", roles: [PlatformAdmin], code: 200, input: ["savings_account_id?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: POST, path: "/members/{id}/suspend", description: "Suspend a member", roles: [PlatformAdmin], code: 200, input: [], output: Member, side_effects: ["Member.status=SUSPENDED", "increment Member.version"] }
  - { method: POST, path: "/members/{id}/reinstate", description: "Reinstate a suspended member", roles: [PlatformAdmin], code: 200, input: [], output: Member, side_effects: ["Member.status=ACTIVE", "increment Member.version"] }
  - { method: PATCH, path: "/members/{id}", description: "Set member's savings_account_id", roles: [Member], code: 200, input: [savings_account_id], output: Member, side_effects: ["link savings destination"] }
  - { method: GET, path: "/members/{id}/savings-report", description: "Computed savings report (savings_report_summary)", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: [], output: "object", side_effects: ["runs savings_report_summary"] }

  # ---- SavingsAccount ----
  - { method: POST, path: "/savings-accounts", description: "Open a savings account for a member", roles: [Member], code: 201, input: [member_id, nickname], output: SavingsAccount, side_effects: ["SavingsAccount created status=OPEN balance_cents=0"] }
  - { method: GET, path: "/savings-accounts/{id}", description: "Get a savings account", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: [], output: SavingsAccount, side_effects: [] }
  - { method: GET, path: "/savings-accounts", description: "List savings accounts filtered by member", roles: [Member, PlatformAdmin], code: 200, input: ["member_id?", "limit?", "offset?"], output: "SavingsAccount[]", side_effects: [] }
  - { method: POST, path: "/savings-accounts/{id}/close", description: "Close a savings account", roles: [Member], code: 200, input: [], output: SavingsAccount, side_effects: ["SavingsAccount.status=CLOSED"] }

  # ---- LinkedAccount ----
  - { method: POST, path: "/linked-accounts", description: "Link a financial account", roles: [Member], code: 201, input: [member_id, institution_name, account_type], output: LinkedAccount, side_effects: ["LinkedAccount created status=LINKED"] }
  - { method: GET, path: "/linked-accounts/{id}", description: "Get a linked account", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: [], output: LinkedAccount, side_effects: [] }
  - { method: GET, path: "/linked-accounts", description: "List linked accounts filtered by member", roles: [Member, PlatformAdmin], code: 200, input: ["member_id?", "limit?", "offset?"], output: "LinkedAccount[]", side_effects: [] }
  - { method: POST, path: "/linked-accounts/{id}/unlink", description: "Unlink an account (stops detection)", roles: [Member], code: 200, input: [], output: LinkedAccount, side_effects: ["LinkedAccount.status=UNLINKED"] }

  # ---- RecurringCharge (detection) ----
  - { method: POST, path: "/recurring-charges", description: "Record/ingest a detected recurring charge on a linked account", roles: [Member, PlatformAdmin], code: 201, input: [linked_account_id, merchant_name, amount_cents, cadence, "category?", first_seen_utc], output: RecurringCharge, side_effects: ["status=DETECTED", "compute annualized_cost_cents", "increment LinkedAccount.detected_charge_count"] }
  - { method: GET, path: "/recurring-charges/{id}", description: "Get a recurring charge", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: [], output: RecurringCharge, side_effects: [] }
  - { method: GET, path: "/recurring-charges", description: "List recurring charges filtered by linked_account_id", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: ["linked_account_id?", "status?", "limit?", "offset?"], output: "RecurringCharge[]", side_effects: [] }
  - { method: POST, path: "/recurring-charges/{id}/confirm", description: "Confirm a detected charge", roles: [Member], code: 200, input: [], output: RecurringCharge, side_effects: ["status=CONFIRMED", "recompute annualized_cost_cents"] }
  - { method: POST, path: "/recurring-charges/{id}/dismiss", description: "Dismiss a charge", roles: [Member], code: 200, input: [], output: RecurringCharge, side_effects: ["status=DISMISSED", "decrement LinkedAccount.detected_charge_count"] }

  # ---- Subscription (inventory + cancel-on-behalf + trial reminder) ----
  - { method: POST, path: "/subscriptions", description: "Create a subscription tracking a CONFIRMED charge", roles: [Member], code: 201, input: [member_id, recurring_charge_id, plan_name, monthly_cost_cents, "is_free_trial?", "trial_end_utc?", "trial_reminder_lead_days?"], output: Subscription, side_effects: ["status=ACTIVE", "compute reminder_due"] }
  - { method: GET, path: "/subscriptions/{id}", description: "Get a subscription (reminder_due recomputed vs clock)", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: [], output: Subscription, side_effects: ["recompute reminder_due"] }
  - { method: GET, path: "/subscriptions", description: "List subscriptions filtered by member_id or recurring_charge_id", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: ["member_id?", "recurring_charge_id?", "reminder_due?", "limit?", "offset?"], output: "Subscription[]", side_effects: ["recompute reminder_due"] }
  - { method: POST, path: "/subscriptions/{id}/request-cancel", description: "Member requests cancel-on-behalf (OCC guarded)", roles: [Member], code: 200, input: [expected_subscription_version], output: Subscription, side_effects: ["status=CANCEL_REQUESTED", "increment Subscription.version"] }
  - { method: POST, path: "/subscriptions/{id}/confirm-cancel", description: "Concierge confirms provider cancellation", roles: [ConciergeAgent], code: 200, input: [], output: Subscription, side_effects: ["status=CANCELLED", "set cancelled_utc", "reminder_due=false", "increment Subscription.version"] }
  - { method: POST, path: "/subscriptions/{id}/fail-cancel", description: "Concierge marks cancellation failed", roles: [ConciergeAgent], code: 200, input: [], output: Subscription, side_effects: ["status=CANCEL_FAILED", "increment Subscription.version"] }

  # ---- ConciergeAgentProfile ----
  - { method: POST, path: "/concierge-agents", description: "Create a concierge agent profile", roles: [PlatformAdmin], code: 201, input: [display_name, "max_open_cases?"], output: ConciergeAgentProfile, side_effects: ["open_case_count=0"] }
  - { method: GET, path: "/concierge-agents/{id}", description: "Get a concierge agent profile", roles: [ConciergeAgent, PlatformAdmin], code: 200, input: [], output: ConciergeAgentProfile, side_effects: [] }
  - { method: GET, path: "/concierge-agents", description: "List concierge agent profiles", roles: [PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "ConciergeAgentProfile[]", side_effects: [] }

  # ---- NegotiationCase (cyclic rounds + success-fee split) ----
  - { method: POST, path: "/negotiation-cases", description: "Open a negotiation against a CONFIRMED charge, assigned to an agent", roles: [Member], code: 201, input: [member_id, recurring_charge_id, assigned_agent_id], output: NegotiationCase, side_effects: ["status=OPEN", "snapshot baseline_annual_cost_cents", "increment ConciergeAgentProfile.open_case_count"] }
  - { method: GET, path: "/negotiation-cases/{id}", description: "Get a negotiation case", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: [], output: NegotiationCase, side_effects: [] }
  - { method: GET, path: "/negotiation-cases", description: "List negotiation cases filtered by member_id, recurring_charge_id, or assigned_agent_id", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: ["member_id?", "recurring_charge_id?", "assigned_agent_id?", "status?", "limit?", "offset?"], output: "NegotiationCase[]", side_effects: [] }
  - { method: POST, path: "/negotiation-cases/{id}/propose", description: "Agent proposes an offered annual cost (round)", roles: [ConciergeAgent], code: 200, input: [offered_annual_cost_cents], output: NegotiationCase, side_effects: ["status=PROPOSED", "set current_offer", "increment round_count", "increment version"] }
  - { method: POST, path: "/negotiation-cases/{id}/counter", description: "Agent records a provider counter", roles: [ConciergeAgent], code: 200, input: [counter_annual_cost_cents], output: NegotiationCase, side_effects: ["status=COUNTERED", "set current_offer", "increment version"] }
  - { method: POST, path: "/negotiation-cases/{id}/accept", description: "Agent accepts current offer -> WON; books savings", roles: [ConciergeAgent], code: 200, input: [], output: NegotiationCase, side_effects: ["status=WON", "set agreed cost", "compute gross/fee/net", "create SavingsLedgerEntry", "rollup Member lifetime", "decrement agent open_case_count", "increment version"] }
  - { method: POST, path: "/negotiation-cases/{id}/abandon", description: "Agent abandons -> LOST", roles: [ConciergeAgent], code: 200, input: [], output: NegotiationCase, side_effects: ["status=LOST", "decrement agent open_case_count", "increment version"] }
  - { method: POST, path: "/negotiation-cases/{id}/cancel", description: "Member cancels an OPEN case", roles: [Member], code: 200, input: [], output: NegotiationCase, side_effects: ["status=CANCELLED", "decrement agent open_case_count", "increment version"] }

  # ---- RefundClaim (price-drop/refund pursuit + dispute loop) ----
  - { method: POST, path: "/refund-claims", description: "File a price-drop/refund claim against a CONFIRMED charge", roles: [Member], code: 201, input: [member_id, recurring_charge_id, claim_type, observed_old_amount_cents, observed_new_amount_cents], output: RefundClaim, side_effects: ["status=FILED", "compute claimed_refund_cents"] }
  - { method: GET, path: "/refund-claims/{id}", description: "Get a refund claim", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: [], output: RefundClaim, side_effects: [] }
  - { method: GET, path: "/refund-claims", description: "List refund claims filtered by member_id or recurring_charge_id", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: ["member_id?", "recurring_charge_id?", "status?", "limit?", "offset?"], output: "RefundClaim[]", side_effects: [] }
  - { method: POST, path: "/refund-claims/{id}/start-review", description: "Agent moves claim into review", roles: [ConciergeAgent], code: 200, input: [], output: RefundClaim, side_effects: ["status=UNDER_REVIEW", "increment version"] }
  - { method: POST, path: "/refund-claims/{id}/approve", description: "Agent approves a refund -> REFUNDED; books savings", roles: [ConciergeAgent], code: 200, input: [approved_refund_cents], output: RefundClaim, side_effects: ["status=REFUNDED", "set approved_refund_cents", "compute fee/net", "create SavingsLedgerEntry", "rollup Member lifetime", "increment version"] }
  - { method: POST, path: "/refund-claims/{id}/deny", description: "Agent denies a claim", roles: [ConciergeAgent], code: 200, input: [], output: RefundClaim, side_effects: ["status=DENIED", "increment version"] }
  - { method: POST, path: "/refund-claims/{id}/dispute", description: "Member disputes a denied claim (OCC guarded, concierge dispute loop)", roles: [Member], code: 200, input: [expected_refund_claim_version], output: RefundClaim, side_effects: ["status=DISPUTED", "increment dispute_round", "increment version"] }

  # ---- SavingsLedgerEntry (auto-transfer) ----
  - { method: GET, path: "/savings-ledger-entries/{id}", description: "Get a savings ledger entry", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: [], output: SavingsLedgerEntry, side_effects: [] }
  - { method: GET, path: "/savings-ledger-entries", description: "List ledger entries filtered by member_id, negotiation_case_id, or refund_claim_id", roles: [Member, ConciergeAgent, PlatformAdmin], code: 200, input: ["member_id?", "negotiation_case_id?", "refund_claim_id?", "transfer_status?", "limit?", "offset?"], output: "SavingsLedgerEntry[]", side_effects: [] }
  - { method: POST, path: "/savings-ledger-entries/{id}/transfer", description: "Auto-transfer member-net savings to the member's SavingsAccount", roles: [Member], code: 200, input: [], output: SavingsLedgerEntry, side_effects: ["transfer_status=TRANSFERRED", "increment SavingsAccount.balance_cents by member_net_cents", "set transferred_utc"] }
  - { method: POST, path: "/savings-ledger-entries/{id}/reverse", description: "Reverse a transferred entry (compensation)", roles: [ConciergeAgent], code: 200, input: [], output: SavingsLedgerEntry, side_effects: ["transfer_status=REVERSED", "decrement SavingsAccount.balance_cents by member_net_cents", "clear transferred_utc"] }

  # ---- Test-driving ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical server clock. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: SystemClock, side_effects: ["SystemClock.current_utc updated"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized auth headers on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed Member acting on a resource it does not own" }
  - { id: ERR_MEMBER_SUSPENDED, http: 403, condition: "Member is SUSPENDED and attempts a member-initiated action" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed body, or invalid enum value" }
  - { id: ERR_VALUE_OUT_OF_RANGE, http: 422, condition: "Numeric field violates declared range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_LINKED_RESOURCE_STATE, http: 409, condition: "A linked resource is not in the required state (LinkedAccount not LINKED, or RecurringCharge not CONFIRMED)" }
  - { id: ERR_CHARGE_IN_USE, http: 409, condition: "Dismissing a CONFIRMED charge that has a non-terminal Subscription/NegotiationCase/RefundClaim" }
  - { id: ERR_AGENT_CAPACITY_EXCEEDED, http: 409, condition: "ConciergeAgent open_case_count would exceed max_open_cases" }
  - { id: ERR_MAX_ROUNDS_REACHED, http: 409, condition: "Negotiation round_count >= MAX_ROUNDS on propose/counter" }
  - { id: ERR_MAX_DISPUTE_ROUNDS_REACHED, http: 409, condition: "RefundClaim dispute_round >= MAX_DISPUTE_ROUNDS on dispute" }
  - { id: ERR_OFFER_ABOVE_BASELINE, http: 422, condition: "Accepting an offer whose annual cost exceeds the baseline" }
  - { id: ERR_REFUND_ABOVE_CLAIM, http: 422, condition: "Approving a refund above claimed_refund_cents" }
  - { id: ERR_TRIAL_END_REQUIRED, http: 422, condition: "is_free_trial=true without trial_end_utc on subscription create" }
  - { id: ERR_NO_SAVINGS_DESTINATION, http: 409, condition: "Transfer attempted with no savings_account_id or a non-OPEN SavingsAccount" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register a member and set the clock is NOT allowed."
    identity: opaque
    exclusive_operations: ["POST /members"]
    shared_operations: []
  - name: Member
    description: "A registered member acting on their own accounts, charges, subscriptions, cases, claims, and savings."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "PATCH /members/{id}"
      - "POST /savings-accounts"
      - "POST /savings-accounts/{id}/close"
      - "POST /linked-accounts"
      - "POST /linked-accounts/{id}/unlink"
      - "POST /recurring-charges/{id}/confirm"
      - "POST /recurring-charges/{id}/dismiss"
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/request-cancel"
      - "POST /negotiation-cases"
      - "POST /negotiation-cases/{id}/cancel"
      - "POST /refund-claims"
      - "POST /refund-claims/{id}/dispute"
      - "POST /savings-ledger-entries/{id}/transfer"
    shared_operations:
      - "POST /recurring-charges"
      - "GET /members/{id}"
      - "GET /members/{id}/savings-report"
      - "GET (own) savings-accounts, linked-accounts, recurring-charges, subscriptions, negotiation-cases, refund-claims, savings-ledger-entries"
  - name: ConciergeAgent
    description: "Operations agent who runs negotiations, cancellations, refund reviews/disputes, and reversals on behalf of members."
    identity: "entity_backed:ConciergeAgentProfile"
    exclusive_operations:
      - "POST /subscriptions/{id}/confirm-cancel"
      - "POST /subscriptions/{id}/fail-cancel"
      - "POST /negotiation-cases/{id}/propose"
      - "POST /negotiation-cases/{id}/counter"
      - "POST /negotiation-cases/{id}/accept"
      - "POST /negotiation-cases/{id}/abandon"
      - "POST /refund-claims/{id}/start-review"
      - "POST /refund-claims/{id}/approve"
      - "POST /refund-claims/{id}/deny"
      - "POST /savings-ledger-entries/{id}/reverse"
    shared_operations:
      - "POST /recurring-charges"
      - "GET endpoints across members, cases, claims, charges, subscriptions, ledger, savings-accounts"
  - name: PlatformAdmin
    description: "Operator role: member suspension/reinstatement, concierge agent management, charge ingestion, clock control."
    identity: opaque
    exclusive_operations:
      - "POST /members/{id}/suspend"
      - "POST /members/{id}/reinstate"
      - "POST /concierge-agents"
      - "GET /members"
      - "GET /concierge-agents"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /recurring-charges"
      - "GET endpoints across all resources"
