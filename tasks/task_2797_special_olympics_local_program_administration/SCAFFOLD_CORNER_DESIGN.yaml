            - "UnifiedTeam.${team}.partner_volunteer_ids contains exactly one entry, ${pvol}, after the accepted retry"

      - name: cumulative_threshold_layer_probe
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.attendance_counting_threshold
          - calculations.program_compliance_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / attendance_counted_minutes_threshold_boundary
          rationale: "The rate/threshold layer is probed at its exact boundary by the §1.8 instance: required_minutes = ceil(duration * 0.75) is tested at threshold-1, at threshold and at threshold+1 in one chain, and the §1.9 calculations section adds the posture-ratio boundary at exactly 0.2000. A third generic threshold probe would repeat both."

      - name: cascading_side_effect_chain_layer_probe
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Credential.CERTIFIED_to_EXPIRED
          - endpoints.POST_programs_id_compliance_sweep
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_credential_expiry_voids_scheduled_sessions
          rationale: "The deepest cascade in the scaffold - sweep expires the credential, which voids its SCHEDULED sessions, which reverses their attendance rows and the two practice-minute ledgers, which re-derives certified_coach_count and the posture - is driven end-to-end by that §1.8 instance, including the ordering sensitivity between steps."

      - name: derived_field_reconciliation_layer_probe
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.program_practice_minute_ledger
          - calculations.contribution_recognized_value
        excluded_because:
          difficulty_instance: compensating_invariant / session_cancel_conserves_practice_minute_ledger
          rationale: "Reconciliation after create, after update and after removal of the source row is exactly what the two §1.8 conservation instances assert - the practice-minute ledger across a session cancel and the support ledger across a contribution void - each demanding an exact return to the pre-write totals with zero drift."

  - section: consistency_model
    instances:
      - name: approval_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - state_machines.MedicalForm.SUBMITTED_to_APPROVED
          - calculations.athlete_registration_expiry
          - entities.Program.active_athlete_count
        distinguishing_aspect: "consistency_model is immediate, so the review response itself already carries the approved form and every derived consequence is readable on the very next call with no settling step: the athlete reads ACTIVE/CLEARED with registration_expires_on 2027-08-01 and the program's active_athlete_count is already 1."
        test_recipe:
          setup:
            - "One program with one athlete whose medical form is SUBMITTED, exam_date 2026-06-15, at clock 2026-08-01"
            - "Program.active_athlete_count is 0 before the review"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Maya Foster", birth_date: "2004-03-09", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath: $.data.id }
            - call: "POST /athletes/${ath}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
              as: ProgramManager
              captures: { form: $.data.id }
          trigger:
            - call: "POST /medical-forms/${form}/review"
              payload: { decision: "APPROVE" }
              as: MedicalReviewer
              as_user_id: "reviewer-1"
            - call: "GET /athletes/${ath}"
              payload: {}
              as: MedicalReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramManager
          assert:
            - "the review response body already shows status == APPROVED, approved_at == 2026-08-01T00:00:00Z, reviewed_by_user_id == reviewer-1 and expires_on == 2029-06-14"
            - "the immediately following GET /athletes/${ath} returns registration_status == ACTIVE, medical_status == CLEARED, current_medical_form_id == ${form} and registration_expires_on == 2027-08-01 (min(exam 2026-06-15 + 1095 = 2029-06-14, approval 2026-08-01 + 365 = 2027-08-01))"
            - "the immediately following GET /programs/${prog} returns active_athlete_count == 1 with no second call and no re-read needed"

      - name: sweep_counters_match_the_sweep_response_on_immediate_reread
        claim_type: immediate
        grounds:
          - endpoints.POST_programs_id_compliance_sweep
          - entities.Program.sweep_epoch
          - entities.Program.last_sweep_at
          - calculations.program_compliance_posture
        distinguishing_aspect: "The checkpoint's own response is authoritative and lags nothing: the sweep at clock 2026-08-02 returns sweep_epoch 1, last_sweep_at 2026-08-02T00:00:00Z, certified_coach_count 1, expired_credential_ratio 0.0000 and compliance_posture OPEN, and an immediate GET /programs/{id} returns byte-identical values for all five fields."
        test_recipe:
          setup:
            - "One program with one CERTIFIED, unexpired COACH credential and one ACTIVE, CLEARED athlete; no sweep has ever run, so sweep_epoch is 0 and last_sweep_at is null"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/volunteers"
              payload: { full_name: "Dana Ruiz", email: "dana@rb.example", date_of_birth: "1988-04-12", volunteer_class: "COACH" }
              as: ProgramManager
              captures: { vol: $.data.id }
            - call: "POST /volunteers/${vol}/credentials"
              payload: { role_class: "COACH" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
              captures: { cred: $.data.id }
            - call: "POST /credentials/${cred}/screening"
              payload: { completed_on: "2026-07-01", result: "CLEAR", vendor_reference: "BGS-1001" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
            - call: "POST /credentials/${cred}/training"
              payload: { completed_on: "2026-07-05", curriculum_code: "PB-CORE-2026" }
              as: CredentialingOfficer
              as_user_id: "officer-2"
            - call: "POST /credentials/${cred}/certify"
              payload: {}
              as: CredentialingOfficer
              as_user_id: "officer-3"
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Maya Foster", birth_date: "2004-03-09", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath: $.data.id }
            - call: "POST /athletes/${ath}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
              as: ProgramManager
              captures: { form: $.data.id }
            - call: "POST /medical-forms/${form}/review"
              payload: { decision: "APPROVE" }
              as: MedicalReviewer
              as_user_id: "reviewer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /programs/${prog}/compliance-sweep"
              payload: {}
              as: ProgramManager
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramManager
          assert:
            - "the sweep response returns HTTP 200 with sweep_epoch == 1, last_sweep_at == 2026-08-02T00:00:00Z, certified_coach_count == 1, credential_denominator_count == 1, expired_credential_count == 0, expired_credential_ratio == 0.0000, active_athlete_count == 1 and compliance_posture == OPEN"
            - "the immediately following GET /programs/${prog} returns exactly the same values for those eight fields"
            - "Credential.${cred}.status is still CERTIFIED with expires_on == 2027-07-05 (min(screening 2026-07-01 + 1095 = 2029-06-30, training 2026-07-05 + 365 = 2027-07-05)) - the sweep expired nothing"
            - "Athlete.${ath}.registration_status is still ACTIVE because registration_expires_on 2027-08-01 is after the clock date 2026-08-02"
