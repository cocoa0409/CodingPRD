scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: per_diem_provisional_vs_final_on_cage_billing
        grounds:
          - calculations.per_diem_billing
          - state_machines.BillingRun.PROVISIONAL_to_FINALIZED
          - entities.PerDiemCharge.fields.variant
        distinguishing_aspect: |
          Same cage and same billing period produce amount_cents 2625 under the
          PROVISIONAL variant (raw occupancy, 21 cage-days) and 1250 under the
          FINAL variant (reconciled census excluding the animal retired on
          2026-08-11, 10 cage-days) — a per-cage fiscal calculation.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z (default)"
            - "Investigator + solvent grant (500000 cents, expires 2027-01-01)"
            - "APPROVED mouse protocol via DMR path"
            - "Cage C1 (MOUSE, STANDARD, capacity 5) with 1 mouse"
            - "Census records discrepancy==0 for every day of 2026-08-01..2026-08-21"
            - "Mouse retired effective 2026-08-11 (before finalize)"
            - "BillingRun period [2026-08-01, 2026-08-22) computed provisional then finalized"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
              payload: { full_name: "Dr. Ada", email: "ada@uni.edu", department: "Biology" }
              as: IacucAdministrator
              captures: { inv_id: $.data.id }
            - call: "POST /iacuc/grants"
              payload: { grant_number: "R01-100", investigator_id: "${inv_id}", budget_total_cents: 500000, expires_on: "2027-01-01T00:00:00Z" }
              as: IacucAdministrator
              captures: { grant_id: $.data.id }
            - call: "POST /iacuc/protocols"
              payload: { investigator_id: "${inv_id}", grant_id: "${grant_id}", title: "Mouse study", species: "MOUSE", max_animals_justified: 10, pain_category: "C", review_path: "DMR" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /iacuc/protocols/${proto_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /iacuc/protocols/${proto_id}/review-decisions"
              payload:
                decisions:
                  - reviewer_kind: "DESIGNATED_MEMBER"
                    decision: "APPROVE"
              as: IacucAdministrator
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "C1", room_code: "VIV-101", species: "MOUSE", cage_kind: "STANDARD", capacity_adults: 5, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { cage_id: $.data.id }
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "M-001", cage_id: "${cage_id}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-05-01T00:00:00Z", sex: "F" }
              as: AnimalCareStaff
              captures: { animal_id: $.data.id }
            - call: "POST /iacuc/census-records"
              payload: { cage_id: "${cage_id}", census_date: "2026-08-01T00:00:00Z", physical_count: 1 }
              as: AnimalCareStaff
            - call: "POST /iacuc/census-records"
              payload: { cage_id: "${cage_id}", census_date: "2026-08-11T00:00:00Z", physical_count: 1 }
              as: AnimalCareStaff
            - call: "POST /iacuc/census-records"
              payload: { cage_id: "${cage_id}", census_date: "2026-08-21T00:00:00Z", physical_count: 1 }
              as: AnimalCareStaff
            - call: "POST /iacuc/billing-runs"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-22T00:00:00Z" }
              as: BillingCoordinator
              captures: { run_id: $.data.id, run_v0: $.data.version }
            - call: "POST /iacuc/billing-runs/${run_id}/compute-provisional"
              payload: {}
              as: BillingCoordinator
              captures: { run_v1: $.data.version }
            - call: "POST /iacuc/animals/${animal_id}/retire"
              payload: {}
              as: AnimalCareStaff
            - call: "POST /iacuc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: IacucAdministrator
          trigger:
            - call: "POST /iacuc/billing-runs/${run_id}/finalize"
              payload: { expected_billing_run_version: "${run_v1}" }
              as: BillingCoordinator
            - call: "GET /iacuc/billing-runs/${run_id}/charges"
              payload: {}
              as: BillingCoordinator
              captures: { final_amount: "$.data[0].amount_cents", final_variant: "$.data[0].variant", final_days: "$.data[0].cage_days" }
          assert:
            - "PerDiemCharge FINAL variant has cage_days == 10"
            - "PerDiemCharge FINAL variant has amount_cents == 1250"
            - "PerDiemCharge FINAL variant has variant == FINAL"
            - "FINAL amount_cents (1250) != PROVISIONAL amount_cents (2625) for the same cage and period"


      - name: training_gate_completed_vs_expired_on_personnel
        grounds:
          - calculations.training_gate
          - state_machines.TrainingEnrollment.COMPLETED_to_EXPIRED
          - entities.Personnel.fields.training_completed
        distinguishing_aspect: |
          The same personnel member flips training_completed true→false purely by
          the clock crossing a TrainingEnrollment.expires_at (COMPLETED→EXPIRED),
          while the occ_health_gate stays true — a compliance boolean computed on
          Personnel, a different entity domain than the fiscal per-diem variant.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z"
            - "Personnel P1 with all 4 courses COMPLETED on 2026-08-01 (expire 2027-08-01) and occ-health CLEARED"
          setup_api_calls:
            - call: "POST /iacuc/personnel"
              payload: { full_name: "Tech Tom", email: "tom@uni.edu", role_on_protocols: "TECHNICIAN" }
              as: IacucAdministrator
              captures: { pers_id: $.data.id }
            - call: "POST /iacuc/training-enrollments"
              payload: { personnel_id: "${pers_id}", course_code: "ANIMAL_HANDLING" }
              as: TrainingCoordinator
              captures: { te1: $.data.id }
            - call: "POST /iacuc/training-enrollments"
              payload: { personnel_id: "${pers_id}", course_code: "ASEPTIC_TECHNIQUE" }
              as: TrainingCoordinator
              captures: { te2: $.data.id }
            - call: "POST /iacuc/training-enrollments"
              payload: { personnel_id: "${pers_id}", course_code: "EUTHANASIA" }
              as: TrainingCoordinator
              captures: { te3: $.data.id }
            - call: "POST /iacuc/training-enrollments"
              payload: { personnel_id: "${pers_id}", course_code: "SPECIES_SPECIFIC" }
              as: TrainingCoordinator
              captures: { te4: $.data.id }
            - call: "POST /iacuc/training-enrollments/${te1}/complete"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /iacuc/training-enrollments/${te2}/complete"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /iacuc/training-enrollments/${te3}/complete"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /iacuc/training-enrollments/${te4}/complete"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /iacuc/occ-health-enrollments"
              payload: { personnel_id: "${pers_id}" }
              as: OccHealthNurse
              captures: { oh_id: $.data.id }
            - call: "POST /iacuc/occ-health-enrollments/${oh_id}/clear"
              payload: {}
              as: OccHealthNurse
            - call: "GET /iacuc/personnel/${pers_id}"
              payload: {}
              as: IacucAdministrator
              captures: { gate_before: $.data.training_completed }
            - call: "POST /iacuc/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-02T00:00:00Z" }
              as: IacucAdministrator
          trigger:
            - call: "GET /iacuc/personnel/${pers_id}"
              payload: {}
              as: IacucAdministrator
              captures: { gate_after: $.data.training_completed, oh_after: $.data.occ_health_cleared }
          assert:
            - "Personnel.training_completed == true before clock advance"
            - "Personnel.training_completed == false after clock advance past 2027-08-01"
            - "Personnel.occ_health_cleared == false after clock advance (occ-health also expired)"
            - "Same rows, two evaluation instants, different computed gate values"


  # ===========================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rat_cage_tiered_daily_rate_mixed_ages
        grounds:
          - calculations.per_diem_billing
          - entities.PerDiemCharge.fields.rate_cents
        distinguishing_aspect: |
          Mode (a) — a formula with >= 3 inputs and non-linear interaction: the
          daily cage rate for RAT cages is the MAX over per-rat tier rates
          (PUP 75 / ADULT 150 / AGED 210) so a mixed-age cage bills at the
          highest tier present; 1 adult + 1 aged rat over 21 days yields 4410
          cents, while an adult-only cage yields 3150 — not the sum of tiers.
        test_recipe:
          setup:
            - "Two APPROVED rat protocols (or one protocol, two cages)"
            - "Cage R-AGED: 1 ADULT rat (dob 2026-01-01) + 1 AGED rat (dob 2024-01-01), occupied all 21 days of the period"
            - "Cage R-ADULT: 1 ADULT rat only, same period"
            - "Clean census for both cages; finalized billing run"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
              payload: { full_name: "Dr. Rao", email: "rao@uni.edu", department: "Neuro" }
              as: IacucAdministrator
              captures: { inv_id: $.data.id }
            - call: "POST /iacuc/grants"
              payload: { grant_number: "R01-200", investigator_id: "${inv_id}", budget_total_cents: 500000, expires_on: "2027-01-01T00:00:00Z" }
              as: IacucAdministrator
              captures: { grant_id: $.data.id }
            - call: "POST /iacuc/protocols"
              payload: { investigator_id: "${inv_id}", grant_id: "${grant_id}", title: "Rat study", species: "RAT", max_animals_justified: 20, pain_category: "C", review_path: "DMR" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /iacuc/protocols/${proto_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /iacuc/protocols/${proto_id}/review-decisions"
              payload:
                decisions:
                  - reviewer_kind: "DESIGNATED_MEMBER"
                    decision: "APPROVE"
              as: IacucAdministrator
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "R-AGED", room_code: "VIV-102", species: "RAT", cage_kind: "STANDARD", capacity_adults: 2, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { cage_aged: $.data.id }
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "R-ADULT", room_code: "VIV-102", species: "RAT", cage_kind: "STANDARD", capacity_adults: 2, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { cage_adult: $.data.id }
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "RT-1", cage_id: "${cage_aged}", protocol_id: "${proto_id}", species: "RAT", date_of_birth: "2026-01-01T00:00:00Z", sex: "M" }
              as: AnimalCareStaff
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "RT-2", cage_id: "${cage_aged}", protocol_id: "${proto_id}", species: "RAT", date_of_birth: "2024-01-01T00:00:00Z", sex: "M" }
              as: AnimalCareStaff
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "RT-3", cage_id: "${cage_adult}", protocol_id: "${proto_id}", species: "RAT", date_of_birth: "2026-01-01T00:00:00Z", sex: "F" }
              as: AnimalCareStaff
            - call: "POST /iacuc/census-records"
              payload: { cage_id: "${cage_aged}", census_date: "2026-08-01T00:00:00Z", physical_count: 2 }
              as: AnimalCareStaff
            - call: "POST /iacuc/census-records"
              payload: { cage_id: "${cage_adult}", census_date: "2026-08-01T00:00:00Z", physical_count: 1 }
              as: AnimalCareStaff
            - call: "POST /iacuc/billing-runs"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-22T00:00:00Z" }
              as: BillingCoordinator
              captures: { run_id: $.data.id }
            - call: "POST /iacuc/billing-runs/${run_id}/compute-provisional"
              payload: {}
              as: BillingCoordinator
          trigger:
            - call: "GET /iacuc/billing-runs/${run_id}/charges"
              payload: {}
              as: BillingCoordinator
              captures: { amt0: "$.data[0].amount_cents", amt1: "$.data[1].amount_cents" }
          assert:
            - "Mixed-age rat cage charge amount_cents == 4410 (21 days * 210 AGED max-tier)"
            - "Adult-only rat cage charge amount_cents == 3150 (21 days * 150)"
            - "Mixed-age charge != sum-of-tiers (21*(150+210) == 7560) — max-tier semantics, not additive"


      - name: per_diem_per_day_rounding_order
        grounds:
          - calculations.per_diem_billing
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: per_diem_billing rounds
          each DAY's charge to integer cents before summing. A zebrafish cage
          billed at 40 cents/day over 21 days sums to 840 exactly when rounded
          per-day-then-summed; the scaffold pins this order so that any
          fractional-rate species introduced later cannot silently drift, and
          the pinned literal 840 is what the test asserts.
        test_recipe:
          setup:
            - "APPROVED zebrafish protocol"
            - "Cage Z1 with 1 zebrafish, occupied all 21 days, clean census"
            - "Billing run computed provisional"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
              payload: { full_name: "Dr. Zeb", email: "zeb@uni.edu", department: "Genetics" }
              as: IacucAdministrator
              captures: { inv_id: $.data.id }
            - call: "POST /iacuc/grants"
              payload: { grant_number: "R01-300", investigator_id: "${inv_id}", budget_total_cents: 500000, expires_on: "2027-01-01T00:00:00Z" }
              as: IacucAdministrator
              captures: { grant_id: $.data.id }
            - call: "POST /iacuc/protocols"
              payload: { investigator_id: "${inv_id}", grant_id: "${grant_id}", title: "Zfish study", species: "ZEBRAFISH", max_animals_justified: 50, pain_category: "B", review_path: "DMR" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /iacuc/protocols/${proto_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /iacuc/protocols/${proto_id}/review-decisions"
              payload:
                decisions:
                  - reviewer_kind: "DESIGNATED_MEMBER"
                    decision: "APPROVE"
              as: IacucAdministrator
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "Z1", room_code: "AQUA-01", species: "ZEBRAFISH", cage_kind: "STANDARD", capacity_adults: 20, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { cage_id: $.data.id }
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "ZF-1", cage_id: "${cage_id}", protocol_id: "${proto_id}", species: "ZEBRAFISH", date_of_birth: "2026-01-01T00:00:00Z", sex: "M" }
              as: AnimalCareStaff
            - call: "POST /iacuc/census-records"
              payload: { cage_id: "${cage_id}", census_date: "2026-08-01T00:00:00Z", physical_count: 1 }
              as: AnimalCareStaff
            - call: "POST /iacuc/billing-runs"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-22T00:00:00Z" }
              as: BillingCoordinator
              captures: { run_id: $.data.id }
            - call: "POST /iacuc/billing-runs/${run_id}/compute-provisional"
              payload: {}
              as: BillingCoordinator
          trigger:
            - call: "GET /iacuc/billing-runs/${run_id}/charges"
              payload: {}
              as: BillingCoordinator
              captures: { z_amt: "$.data[0].amount_cents", z_rate: "$.data[0].rate_cents", z_days: "$.data[0].cage_days" }
          assert:
            - "PerDiemCharge rate_cents == 40 (zebrafish flat rate)"
            - "PerDiemCharge cage_days == 21"
            - "PerDiemCharge amount_cents == 840 (per-day rounding pinned: round(40) per day * 21)"


  # ===========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: protocol_review_revision_cycle
        grounds:
          - state_machines.Protocol.DMR_REVIEW_to_DRAFT
          - state_machines.Protocol.DRAFT_to_SUBMITTED
          - state_machines.Protocol.DMR_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Protocol runs a revision CYCLE DRAFT→SUBMITTED→DMR_REVIEW→DRAFT→…→
          APPROVED: REQUIRE_MODIFICATIONS loops back to DRAFT and a resubmission
          re-enters review, with reviewer rows reset to PENDING on each loop —
          a cyclic machine on Protocol.
        test_recipe:
          setup:
            - "Investigator + solvent grant"
            - "DMR protocol submitted, returned for modifications once, resubmitted, then approved"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
              payload: { full_name: "Dr. Cyc", email: "cyc@uni.edu", department: "Biochem" }
              as: IacucAdministrator
              captures: { inv_id: $.data.id }
            - call: "POST /iacuc/grants"
              payload: { grant_number: "R01-400", investigator_id: "${inv_id}", budget_total_cents: 500000, expires_on: "2027-01-01T00:00:00Z" }
              as: IacucAdministrator
              captures: { grant_id: $.data.id }
            - call: "POST /iacuc/protocols"
              payload: { investigator_id: "${inv_id}", grant_id: "${grant_id}", title: "Cycle study", species: "MOUSE", max_animals_justified: 5, pain_category: "C", review_path: "DMR" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /iacuc/protocols/${proto_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /iacuc/protocols/${proto_id}/review-decisions"
              payload:
                decisions:
                  - reviewer_kind: "DESIGNATED_MEMBER"
                    decision: "REQUIRE_MODIFICATIONS"
              as: IacucAdministrator
            - call: "POST /iacuc/protocols/${proto_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { resub_status: $.data.status }
          trigger:
            - call: "POST /iacuc/protocols/${proto_id}/review-decisions"
              payload:
                decisions:
                  - reviewer_kind: "DESIGNATED_MEMBER"
                    decision: "APPROVE"
              as: IacucAdministrator
              captures: { final_status: $.data.status, approved_ver: $.data.version }
          assert:
            - "After REQUIRE_MODIFICATIONS, status == DRAFT and reviewer rows reset to PENDING"
            - "Resubmission from DRAFT succeeds (status returns to DMR_REVIEW)"
            - "Second APPROVE decision moves protocol to APPROVED with approved_at set"
            - "Protocol.version incremented on every loop transition (cycle counted by version)"


      - name: billing_run_branching_void_paths
        grounds:
          - state_machines.BillingRun.DRAFT_to_VOIDED
          - state_machines.BillingRun.PROVISIONAL_to_VOIDED
          - state_machines.BillingRun.DRAFT_to_PROVISIONAL
        distinguishing_aspect: |
          BillingRun is a BRANCHING fork-join: DRAFT→{PROVISIONAL→FINALIZED→
          POSTED, VOIDED} and DRAFT→VOIDED, where the VOIDED branch from
          PROVISIONAL carries the distinct side-effect of deleting provisional
          PerDiemCharge rows while the DRAFT→VOIDED branch deletes nothing — a
          divergent-side-effect branch on BillingRun, a different entity than
          Protocol.
        test_recipe:
          setup:
            - "Two billing runs for the same clean-census period"
            - "Run A voided from DRAFT; Run B computed provisional then voided"
          setup_api_calls:
            - call: "POST /iacuc/billing-runs"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-22T00:00:00Z" }
              as: BillingCoordinator
              captures: { run_a: $.data.id }
            - call: "POST /iacuc/billing-runs/${run_a}/void"
              payload: {}
              as: BillingCoordinator
              captures: { run_a_state: $.data.state }
            - call: "POST /iacuc/billing-runs"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-22T00:00:00Z" }
              as: BillingCoordinator
              captures: { run_b: $.data.id }
            - call: "POST /iacuc/billing-runs/${run_b}/compute-provisional"
              payload: {}
              as: BillingCoordinator
          trigger:
            - call: "POST /iacuc/billing-runs/${run_b}/void"
              payload: {}
              as: BillingCoordinator
            - call: "GET /iacuc/billing-runs/${run_b}/charges"
              payload: {}
              as: BillingCoordinator
          assert:
            - "Run A state == VOIDED with zero charges ever created"
            - "Run B state == VOIDED"
            - "GET /iacuc/billing-runs/${run_b}/charges returns empty array (provisional rows deleted by the VOID branch)"
            - "A VOIDED run rejects further finalize/post with ERR_INVALID_STATE"


  # ===========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deviation_to_protocol_to_cage_and_adverse_event
        grounds:
          - state_machines.ProtocolDeviation.UNDER_REVIEW_to_SUSPENSION_IMPOSED
          - state_machines.Protocol.APPROVED_to_SUSPENDED
          - state_machines.AdverseEventReport.OPEN_to_ESCALATED
        distinguishing_aspect: |
          Depth-3 cascade: impose-suspension on a ProtocolDeviation mutates the
          Protocol (APPROVED→SUSPENDED); that protocol mutation itself cascades
          to every OCCUPIED Cage (→OVER_CAPACITY) and to every OPEN/
          UNDER_TREATMENT AdverseEventReport (→ESCALATED). Three hops, each
          caused by the previous link.
        test_recipe:
          setup:
            - "APPROVED mouse protocol with 1 occupied cage and 1 OPEN adverse event"
            - "MINOR/serious deviation reported and under review"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
              payload: { full_name: "Dr. Cascade", email: "cascade@uni.edu", department: "Med" }
              as: IacucAdministrator
              captures: { inv_id: $.data.id }
            - call: "POST /iacuc/grants"
              payload: { grant_number: "R01-500", investigator_id: "${inv_id}", budget_total_cents: 500000, expires_on: "2027-01-01T00:00:00Z" }
              as: IacucAdministrator
              captures: { grant_id: $.data.id }
            - call: "POST /iacuc/protocols"
              payload: { investigator_id: "${inv_id}", grant_id: "${grant_id}", title: "Cascade study", species: "MOUSE", max_animals_justified: 5, pain_category: "D", review_path: "DMR" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /iacuc/protocols/${proto_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /iacuc/protocols/${proto_id}/review-decisions"
              payload:
                decisions:
                  - reviewer_kind: "DESIGNATED_MEMBER"
                    decision: "APPROVE"
              as: IacucAdministrator
            - call: "POST /iacuc/cages"
