  - section: cross_cutting
    instances:

      - name: stale_case_version_on_settle_accept
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[case-settle-stale-version]
          - errors[ERR_STALE_CASE_VERSION]
          - validations[priority=19]
        distinguishing_aspect: |
          With a Case at version=V_pre observed by the client before the latest
          mutation, POST /settlement-offers/{id}/accept with
          expected_case_version=V_pre−1 (one step stale) returns
          ERR_STALE_CASE_VERSION (412). The offer stays PENDING and Case stays
          in IN_NEGOTIATION.
        test_recipe:
          setup:
            - "Active CA Case in IN_NEGOTIATION; one CARRIER PENDING offer at 4_000_000; Case.version observed and bound to ${case_v_pre} from a GET BEFORE further state changes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Stale", email: "st@example.com", phone: "555-4700" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Stale Hosp", contact: "st@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 500000 }
              as: Paralegal
              captures: { di_id: $.data.id }
            - call: "POST /damages-items/${di_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_st"
              captures: { dl_id: $.data.id }
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_st"
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 4000000, by_party: "CARRIER" }
              as: Attorney
              captures: { offer_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Attorney
              captures: { case_v_observed: $.data.version }
            # Another mutation bumps Case.version (include a second damages item).
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "LOST_WAGES", amount_cents: 300000 }
              as: Paralegal
              captures: { di2_id: $.data.id }
            - call: "POST /damages-items/${di2_id}/include"
              payload: {}
              as: Attorney
          trigger:
            - call: "POST /settlement-offers/${offer_id}/accept"
              payload: { expected_case_version: "${case_v_observed}" }
              as: ManagingPartner
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 412"
            - "response.data.error_id == 'ERR_STALE_CASE_VERSION'"
            - "SettlementOffer.${offer_id}.status == 'PENDING'"
            - "Case.${case_id}.status == 'IN_NEGOTIATION'"

      - name: stale_case_version_on_disbursement_release
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[case-disburse-stale-version]
          - errors[ERR_STALE_CASE_VERSION]
          - validations[priority=19]
        distinguishing_aspect: |
          A Disbursement release with an expected_case_version that lags the
          current Case.version returns ERR_STALE_CASE_VERSION (412). The release
          does not occur and AGREED liens stay AGREED (do not advance to PAID).
        test_recipe:
          setup:
            - "Settled CA Case (gross 6_000_000), Disbursement PENDING; expected_case_version is read BEFORE a subsequent Case mutation that bumps version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Disb Stale", email: "ds@example.com", phone: "555-4800" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "DS Hosp", contact: "ds@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 1000000 }
              as: Paralegal
              captures: { di_id: $.data.id }
            - call: "POST /damages-items/${di_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_ds"
              captures: { dl_id: $.data.id }
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_ds"
            - call: "POST /medical-liens"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}", asserted_amount_cents: 500000 }
              as: Paralegal
              captures: { lien_id: $.data.id }
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 6000000, by_party: "CARRIER" }
              as: Attorney
              captures: { offer_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Attorney
              captures: { case_v_pre_accept: $.data.version }
            - call: "POST /settlement-offers/${offer_id}/accept"
              payload: { expected_case_version: "${case_v_pre_accept}" }
              as: ManagingPartner
            - call: "GET /disbursements"
              payload: { case_id: "${case_id}" }
              as: Attorney
              captures: { disb_id: "$.data[0].id" }
            # Observe the current version, but then bump it via lien renegotiation
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Attorney
              captures: { stale_v: $.data.version }
          trigger:
            - call: "POST /disbursements/${disb_id}/release"
              payload: { expected_case_version: "${stale_v} - 1" }
              as: ManagingPartner
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 412"
            - "response.data.error_id == 'ERR_STALE_CASE_VERSION'"
            - "Disbursement.${disb_id}.status == 'PENDING'"
            - "MedicalLien.${lien_id}.status == 'AGREED'"

      - name: stub_settlement_accept_cascade_layered_side_effects
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SettlementOffer.PENDING_to_ACCEPTED
        excluded_because:
          difficulty_instance: transitive_cascade / settlement_accept_three_hop_cascade
          rationale: "End-to-end cascade asserted by the named §1.8 instance."

      - name: stub_dual_variant_layer_economics
        claim_type: dual_variant_calculation
        grounds:
          - calculations.gross_damages_model
          - calculations.contingency_fee
        excluded_because:
          difficulty_instance: dual_variant_calc / contingency_fee_pre_suit_vs_post_suit_diverges
          rationale: "Dual-variant calculation layer is exercised across §1.8 dual_variant_calc instances."
