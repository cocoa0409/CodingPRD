  - section: validations
    instances:
      - name: corner_unauthenticated_request_is_rejected_before_role_check
        claim_type: violation_to_error
        grounds: [validations.priority_1_auth, errors.ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 fires before priority 2: a request with no X-User-Role or X-User-ID headers to a PolicyAdmin-only endpoint returns ERR_UNAUTHENTICATED (401), never ERR_ROLE_NOT_PERMITTED (403)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /review-offices"
              payload: { office_code: "ERO-9", name: "Unheaded Request Office" }
              as: "(request sent with no X-User-Role and no X-User-ID header)"
          assert:
            - "HTTP status is 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "data.error_id != ERR_ROLE_NOT_PERMITTED"
            - "No ReviewOffice row is created: GET /review-offices returns total_count == 0"

      - name: corner_unknown_path_id_outranks_unknown_body_reference_not_found
        claim_type: priority_ordering
        grounds:
          - validations.priority_4_path_existence
          - validations.priority_5_body_reference
          - errors.ERR_NOT_FOUND
          - errors.ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: "Both the path action id and the body scoping_period_id are unknown; priority 4 must win, so the response is ERR_NOT_FOUND (404) and never ERR_REFERENCE_NOT_FOUND (404) — same status, different error_id."
        test_recipe:
          setup: ["ReviewOffice ERO-1 exists; no ProposedAction and no ScopingPeriod exist."]
          setup_api_calls:
            - *k_office
          trigger:
            - call: "POST /proposed-actions/{id}/issues"
              payload: { scoping_period_id: "${off_id}", resource_area: "WATER", origin: "PUBLIC", significance: "SIGNIFICANT", summary: "Downstream turbidity" }
              as: NepaCoordinator
          assert:
            - "With an unknown UUID in the path, HTTP status is 404 and data.error_id == ERR_NOT_FOUND"
            - "data.error_id != ERR_REFERENCE_NOT_FOUND"
            - "No Issue row is created"

      - name: corner_second_resource_analysis_for_same_area_is_rejected
        claim_type: violation_to_error
        grounds: [validations.priority_12_business_constraint, errors.ERR_DUPLICATE_RESOURCE_ANALYSIS]
        distinguishing_aspect: "At most one ResourceAnalysis may exist per (action, resource_area): a second BIOLOGICAL row is refused with ERR_DUPLICATE_RESOURCE_ANALYSIS while a first CULTURAL row for the same action is accepted."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action is at review_stage ANALYSIS with one DRAFT BIOLOGICAL ResourceAnalysis."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
            - *k_get_act_v
            - *k_adopt
            - *k_close_scope
            - *k_ra_bio
          trigger:
            - call: "POST /proposed-actions/${act_id}/resource-analyses"
              payload: { resource_area: "BIOLOGICAL", intensity_score: 30.0, context_sensitivity_score: 30.0, affected_area_hectares: 1.0 }
              as: ResourceSpecialist
            - call: "POST /proposed-actions/${act_id}/resource-analyses"
              payload: { resource_area: "CULTURAL", intensity_score: 30.0, context_sensitivity_score: 30.0, affected_area_hectares: 1.0 }
              as: ResourceSpecialist
              captures: { ra_cultural_id: $.data.id }
          assert:
            - "The duplicate BIOLOGICAL call returns 409 with data.error_id == ERR_DUPLICATE_RESOURCE_ANALYSIS"
            - "ResourceAnalysis.${ra_bio_id}.intensity_score is still 72.0"
            - "The CULTURAL call returns 201 with ResourceAnalysis.${ra_cultural_id}.status == DRAFT"
            - "GET /proposed-actions/${act_id}/resource-analyses returns total_count == 2"

      - name: corner_objection_filed_at_window_close_instant_is_rejected
        claim_type: temporal_validation
        grounds: [validations.priority_13_business_temporal, errors.ERR_OBJECTION_WINDOW_CLOSED]
        distinguishing_aspect: "The objection window is half-open [opens_at, closes_at): filing at exactly 2026-12-16T12:00:00Z is outside it and must be refused with ERR_OBJECTION_WINDOW_CLOSED, proving closes_at is exclusive."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline FONSI decision was signed at 2026-11-01T12:00:00Z, so its window is [2026-11-01T12:00:00Z, 2026-12-16T12:00:00Z)."
            - "The logical clock has been advanced to exactly 2026-12-16T12:00:00Z."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
            - *k_get_act_v
            - *k_adopt
            - *k_alt_a
            - *k_alt_b
            - *k_screen_alt_a
            - *k_screen_alt_b
            - *k_agency_fws
            - *k_con_esa
            - *k_con_concur
            - *k_close_scope
            - *k_doc_ea
            - *k_clk_sep5
            - *k_publish
            - *k_clk_oct5
            - *k_close_comments
            - *k_doc_final
