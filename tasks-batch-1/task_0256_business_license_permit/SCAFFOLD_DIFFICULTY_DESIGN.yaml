  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: renewal_window_half_open_lower_bound
        grounds:
          - validations[priority=11]
          - state_machines.License.ACTIVE_to_ACTIVE
          - calculations.delinquency_penalty
          - errors[ERR_RENEWAL_WINDOW_CLOSED]
        distinguishing_aspect: |
          Interval semantics #1 — half-open lower bound on the renewal window [expires_on -
          RENEWAL_WINDOW_DAYS, infinity). At clock = expires_on - 61 days the window is CLOSED
          (renew rejected ERR_RENEWAL_WINDOW_CLOSED); at expires_on - 60 it would be open. The conflict
          is the clock instant falling outside the open window of the License resource.
        test_recipe:
          setup:
            - "License MEDIUM expires 2027-06-01; clock set to 2027-03-31 (62 days before expiry, before window opens at day 60)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "WIN_MED", risk_tier: "MEDIUM", activity_base_risk: 20, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Window Co", owner_name: "WC", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-31T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /licenses/${lic_id}/renew"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RENEWAL_WINDOW_CLOSED"

      - name: revocation_threshold_closed_upper_interval
        grounds:
          - validations[priority=12]
          - state_machines.License.DELINQUENT_to_REVOKED
          - errors[ERR_REVOCATION_THRESHOLD_NOT_REACHED]
        distinguishing_aspect: |
          Interval semantics #2 — a strict-greater-than upper-overdue threshold on a DIFFERENT resource
          aspect: revocation requires days_overdue > REVOCATION_THRESHOLD_DAYS=90. At exactly 90 days
          overdue (the boundary), the over-threshold interval is NOT yet entered, so revoke is rejected
          with ERR_REVOCATION_THRESHOLD_NOT_REACHED — distinct adjacency arithmetic from the half-open
          renewal window.
        test_recipe:
          setup:
            - "License MEDIUM DELINQUENT, clock set to exactly expires_on + 90 days (2027-08-30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "REV_MED", risk_tier: "MEDIUM", activity_base_risk: 20, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "RevThr Co", owner_name: "RT", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
