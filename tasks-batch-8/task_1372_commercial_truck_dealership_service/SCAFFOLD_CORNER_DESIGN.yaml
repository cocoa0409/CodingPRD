        distinguishing_aspect: "Quantity break threshold: qty 9 -> GOLD 10% only (net 11249); qty 10 -> 15% (net 10624). Same part, same tier — the break engages at exactly 10."
        test_recipe:
          setup: ["GOLD account credit 100000000; part list 12499 on_hand 30"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "BreakCo", account_type: "FLEET", fleet_tier: "GOLD", credit_limit_cents: 100000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/parts", payload: { sku: "FLT-Q1", part_name: "Filter Q", list_price_cents: 12499, cost_cents: 7000, on_hand: 30 }, as: PartsCounterRep, captures: { part_id: $.data.id } }
