              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { dg1_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-02", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 21.00, screen_bottom_ft: 41.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-03", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 23.00, screen_bottom_ft: 43.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { comparison_basis: "INTERWELL", background_window_start_on: "2025-01-01", background_window_end_on: "2025-12-31" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/monitoring-programs/${prog_id}/certify-network"
              payload: { certified_on: "2026-06-01" }
