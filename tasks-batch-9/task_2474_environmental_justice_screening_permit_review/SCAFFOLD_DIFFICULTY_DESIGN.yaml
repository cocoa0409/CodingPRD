            - "Facility FAC_D (MINOR_SOURCE, 1500 m from centroid, IN_COMPLIANCE)."
            - "APP_D: proposed_emissions_tpy 10.00, submitted and screened onto the STANDARD track (no trigger fired), review_track STANDARD, no ParticipationPlan."
