      - name: cf_monthly_netting_nested_min_max_partial_draw
        grounds:
          - calculations.monthly_netting
          - entities.MeterReading.fields.bill_cents
          - entities.CreditLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Mode (a) combinatorial: monthly_netting combines >= 3 inputs (import_wh, export_wh,
          banked_wh, tariff rates) with nested min() (bank draw = min(banked_wh, net_wh)) and a
          sign branch — here a partial draw leaves a billable remainder of 600000 Wh and a bill
          of exactly 18000 cents. Distinct mode from the rounding-order instance.
        test_recipe:
          setup:
            - "ENERGY_BANKING + BANK_ROLLOVER program (cap 1000000, tum 4, COMMITTED); tariff import 30000 / export 12000 / ns 4500 effective 2026-01-01 open-ended; account COMMERCIAL usage 20000000; 10000 W application OPERATING."
