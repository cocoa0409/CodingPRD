            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-RS2", street_address: "17 Elm", occupancy_status: "ABANDONED", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
          trigger:
