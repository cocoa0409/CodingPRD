            - "${e_c3c_gross} == 44700 with Enrollee.${e_c3c}.withhold_cents == 3129 and net_pmpm_cents == 41571 (SENIOR factor 14500, POS add 1200)"
            - "no gross value is clamped here — all three sit strictly between PMPM_FLOOR_CENTS 8000 and PMPM_CEILING_CENTS 95000"

      - name: settlement_preview_selects_ibnr_variant_from_override_without_mutating_pool
        claim_type: variant_selection
        grounds:
          - calculations.ibnr_reserve_estimate
          - endpoints.GET_/ipa/risk-pools/{id}/settlement-preview
          - entities.RiskPool.fields.ibnr_method_used
        distinguishing_aspect: |
          The preview endpoint must apply the variant named in
          ibnr_method_override for the duration of that read only. The same pool
          read twice — once with no override, once with
          ibnr_method_override: PMPM_LOSS_RATIO — must return ibnr_reserve_cents
          3380 and then 1480 on identical stored data, while the persisted
          RiskPool keeps ibnr_reserve_cents 3380, ibnr_method_used
          COMPLETION_FACTOR and an unchanged version. An implementation that
          ignores the override returns 3380 twice; one that writes the override
          through bumps the pool version and corrupts the stored reserve.
        test_recipe:
          setup:
            - "Agreement AGR_C4 (COMPLETION_FACTOR, cf 8000, target 15000) with one enrollee, one PROFESSIONAL pool funded 20000, one PAID claim of 13520, pool RESERVED with no override."
