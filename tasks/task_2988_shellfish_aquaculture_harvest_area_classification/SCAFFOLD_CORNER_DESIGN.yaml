              payload: { shipped_at: "2026-08-10T10:55:00Z" }
              as: SeafoodDealer
              as_user_id: "${dealer}"
            - call: "POST /shellfish/shipments/${ship}/ship"
              payload: { shipped_at: "2026-08-10T10:56:00Z" }
              as: SeafoodDealer
              as_user_id: "${dealer}"
          assert:
            - "First call: HTTP 200 with data.status == SHIPPED, data.shipped_at == 2026-08-10T10:55:00Z, data.lot_count == 2 and data.total_bushels == 30"
            - "GET /shellfish/harvest-lots/${lot_a} and GET /shellfish/harvest-lots/${lot_b} both report status == SHIPPED"
            - "Second call: HTTP 409 with data.error_id == ERR_INVALID_SHIPMENT_STATE"
            - "GET /shellfish/shipments/${ship} still reports shipped_at == 2026-08-10T10:55:00Z (the refused call did not restamp it)"

      - name: rainfall_ingest_is_an_action_endpoint_with_a_four_hop_side_effect_chain
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /shellfish/growing-areas/{id}/rainfall-events]"
          - "state_machines[GrowingArea.harvest_status OPEN -> CLOSED_RAINFALL]"
          - "entities.RainfallEvent.fields.triggered_closure"
        excluded_because:
          difficulty_instance: rainfall_closure_cascades_authorization_void_lot_embargo_shipment_hold
          rationale: "That instance already exercises every declared side effect of this endpoint end to end (closure stamps, authorization void, lot embargo, shipment hold and counter reset) from one POST, so a separate action-endpoint recipe would duplicate it verbatim."
  - section: errors
    instances:

      - name: pagination_limit_above_the_maximum_returns_invalid_request
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - response_envelope.pagination
          - endpoints[GET /shellfish/growing-areas]
        distinguishing_aspect: |
          The declared max of 100 is a hard validation rather than a clamp: limit=101 is refused with
          a 400 ERR_INVALID_REQUEST while limit=100 succeeds, so an implementation that silently
          truncates the limit to 100 fails this pair.
        test_recipe:
          setup:
            - "Three GrowingAreas exist: GA-114, GA-220 and GA-331."
            - "The declared pagination defaults are limit 10 (min 1, max 100) and offset 0."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { a1: $.data.id }
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-220", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { a2: $.data.id }
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-331", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { a3: $.data.id }
          trigger:
            - call: "GET /shellfish/growing-areas"
              payload: { limit: 101 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas"
              payload: { limit: 0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas"
              payload: { limit: 100 }
              as: ShellfishControlAuthority
          assert:
            - "First call: HTTP 400 with data.error_id == ERR_INVALID_REQUEST and a non-empty data.message"
            - "Second call: HTTP 400 with data.error_id == ERR_INVALID_REQUEST (limit min is 1)"
            - "Third call: HTTP 200 with response_type == \"array\", data of length 3, total_count == 3, limit == 100, offset == 0 and has_more == false"

      - name: every_failure_response_carries_an_error_id_and_a_message
        claim_type: error_envelope
        grounds:
          - response_envelope.error
          - errors[ERR_GROWING_AREA_NOT_FOUND]
          - errors[ERR_AREA_ALREADY_OPEN]
        distinguishing_aspect: |
          The failure envelope is uniform across HTTP families: a 404 lookup miss and a 409 business
          refusal both return meta.api_request_id, meta.api_request_timestamp, a data.error_id and a
          non-empty human-readable data.message, and the success envelope for the same resource
          carries no error_id at all.
        test_recipe:
          setup:
            - "One GrowingArea GA-114 exists and its harvest_status is OPEN."
            - "The id 00000000-0000-0000-0000-000000000000 belongs to no area."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
          trigger:
            - call: "GET /shellfish/growing-areas/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/reopen"
              payload: { reopen_note: "already open" }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
          assert:
            - "First call: HTTP 404 with data.error_id == ERR_GROWING_AREA_NOT_FOUND and a non-empty data.message"
            - "Second call: HTTP 409 with data.error_id == ERR_AREA_ALREADY_OPEN and a non-empty data.message"
            - "Both failures carry meta.api_request_id and meta.api_request_timestamp, and their meta.api_request_id values differ"
            - "Third call: HTTP 200 with response_type == \"object\", data.code == GA-114 and no data.error_id key"

      - name: every_not_found_code_is_triggerable_from_an_unknown_id
        claim_type: error_triggerability
        grounds:
          - errors[ERR_LEASE_NOT_FOUND]
          - errors[ERR_HATCHERY_NOT_FOUND]
          - errors[ERR_SEED_LOT_NOT_FOUND]
          - errors[ERR_VESSEL_NOT_FOUND]
          - errors[ERR_AUTHORIZATION_NOT_FOUND]
          - errors[ERR_HARVEST_LOT_NOT_FOUND]
          - errors[ERR_DEALER_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_INVESTIGATION_NOT_FOUND]
        distinguishing_aspect: |
          Each resource family owns a DISTINCT 404 code rather than a shared generic one, so the
          same unknown id 00000000-0000-0000-0000-000000000000 must produce nine different error_id
          values depending only on which collection was addressed.
        test_recipe:
          setup:
            - "An empty database apart from the logical clock: no lease, hatchery, seed lot, vessel, authorization, lot, dealer, shipment or investigation exists."
            - "The id 00000000-0000-0000-0000-000000000000 therefore addresses nothing in any collection."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
          trigger:
            - call: "GET /shellfish/leases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
            - call: "GET /shellfish/hatcheries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
            - call: "GET /shellfish/seed-lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
            - call: "GET /shellfish/harvest-vessels/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FarmOperator
              as_user_id: "op-1"
            - call: "GET /shellfish/harvest-authorizations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
            - call: "GET /shellfish/harvest-lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
            - call: "GET /shellfish/dealers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
            - call: "GET /shellfish/shipments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
            - call: "GET /shellfish/illness-investigations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
          assert:
            - "All nine calls return HTTP 404, each with a non-empty data.message"
            - "The error_id values are, in call order: ERR_LEASE_NOT_FOUND, ERR_HATCHERY_NOT_FOUND, ERR_SEED_LOT_NOT_FOUND, ERR_VESSEL_NOT_FOUND, ERR_AUTHORIZATION_NOT_FOUND, ERR_HARVEST_LOT_NOT_FOUND, ERR_DEALER_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_INVESTIGATION_NOT_FOUND"
            - "No call returns ERR_INVALID_REQUEST — a syntactically valid id that matches nothing is a lookup miss, not a malformed request"

      - name: wrong_from_state_transitions_return_the_matching_invalid_state_code
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INVALID_GROWOUT_UNIT_STATE]
          - errors[ERR_INVALID_LOT_STATE]
          - errors[ERR_INVALID_DEALER_LISTING_STATE]
          - errors[ERR_UNIT_LEASE_MISMATCH]
        distinguishing_aspect: |
          Each state machine reports its own from-state violation with its own code, and the
          early-priority state gates (33, 35, 38) pre-empt the later business rules on the same
          endpoints: the second tag is refused as an invalid lot state rather than as a tag-field
          mismatch, and the authorization naming the wrong lease reaches the 89 mismatch only
          because the unit it names is idle and current.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED/OPEN with an ACTIVE month-8 vibrio plan; LISTED NC dealer; vessel with capacity 2."
            - "Two APPROVED leases owned by op-1 on GA-114: L-2988-01 with plots P1..P3 and L-2988-02 with plots P4..P6, both with rent paid through 2026-12-31."
            - "On L-2988-01: unit U1 on P1 (40 gear, 25000 seed) and unit U2 on P2 (20 gear, 15000 seed), both with fresh 2026-07-20 husbandry logs."
            - "U1 backs an ACTIVE authorization (activated 2026-08-10T06:00:00Z), so U1.status is HARVESTING; U2 is DEPLOYED and backs nothing."
            - "Clock 2026-08-10T11:00:00Z; LOT-A (10 bushels) is landed under U1's authorization and already TAGGED; the dealer's listing_status is LISTED."
