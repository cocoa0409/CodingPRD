              payload: {}
              as: Merchandiser
          assert:
            - "EB is admitted: its buffered interval is 2026-09-09T22:00:00Z to 2026-09-11T02:00:00Z, which is clear of EA's buffered 2026-09-04T22:00:00Z to 2026-09-06T02:00:00Z"
            - "EC is refused with 409 ERR_BRAND_WINDOW_OVERLAP even though EC starts exactly when EA ends — the intervals are CLOSED and the buffer is mandatory, so touching is a collision"
            - "ED is refused with 409 ERR_BRAND_WINDOW_OVERLAP and the reported blocker is EA, the earliest-starting collider, not EB"
            - "the sibling-shop event on the second shop IS admitted despite occupying the same instants as EA — the overlap predicate is scoped to one shop and never crosses shops"
            - "Event.${event_c_id}.event_status is still DRAFT and Event.${event_d_id}.event_status is still DRAFT, so neither refused schedule left a partial state"
            - "Event.${event_a_id}.event_status is still SCHEDULED and untouched by the three refusals"

