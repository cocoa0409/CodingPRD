scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: provisional_estimate_vs_final_invoice_total_diverge
        grounds:
          - calculations.estimate_provisional_total
          - calculations.invoice_final_total
          - entities.Estimate.fields.estimate_total_cents
          - entities.Invoice.fields.final_total_cents
        distinguishing_aspect: |
          Cost accounting on the ServiceJob/Invoice domain: the provisional Estimate prices the
          projected part quantity (3 units), while the FINAL Invoice prices the ACTUAL consumed
          quantity (2 units), so Estimate.estimate_total_cents (42200) != Invoice.final_total_cents (40201).
        test_recipe:
          setup:
            - "OfficeManager has created plan NONE, a flat-rate item (skill 2, base 10067) plus two more (5067, 3067), and a part LIST 1999."
            - "Customer with credit_limit 100000, no plan; Technician skill 3 with TruckStock of the part qty 10."
            - "Job dispatched after-hours (window_start 18:00 UTC), confirmed, technician en route, on site."
            - "Estimate presented with three FLAT_RATE lines and one PART line qty 3; approved by customer; job started."
            - "Job completed consuming only 2 of the part (actual < estimated)."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-06-15T18:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/membership-plans"
              payload: { tier_code: "NONE", name: "No Plan", labor_discount_pct: 0, waives_trip_fee: false, annual_fee_cents: 0 }
              as: OfficeManager
              captures: { plan_none_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "LK-A", category: "LEAK", base_price_cents: 10067, skill_required: 2 }
              as: OfficeManager
              captures: { fr_a_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "LK-B", category: "LEAK", base_price_cents: 5067, skill_required: 2 }
              as: OfficeManager
              captures: { fr_b_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "LK-C", category: "LEAK", base_price_cents: 3067, skill_required: 1 }
              as: OfficeManager
              captures: { fr_c_id: $.data.id }
            - call: "POST /plumbing/parts"
              payload: { sku: "P-1", name: "Valve", list_price_cents: 1999 }
              as: OfficeManager
              captures: { part_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust One", service_address: "1 Main St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech One", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/truck-stock"
              payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity: 10, reorder_point: 2 }
              as: OfficeManager
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T18:00:00.000Z", window_end: "2026-06-15T20:00:00.000Z", eta: "2026-06-15T18:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_a_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_b_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_c_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "PART", part_id: "${part_id}", quantity: 3 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /plumbing/service-jobs/${job_id}/start-work"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /plumbing/service-jobs/${job_id}/complete"
              payload: { consumed_parts: [ { part_id: "${part_id}", units: 2 } ] }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}/invoices"
              payload: {}
              as: OfficeManager
              captures: { inv_id: "$.data[0].id", inv_total: "$.data[0].final_total_cents" }
          assert:
            - "Estimate.${est_id}.estimate_total_cents == 42200"
            - "Invoice.${inv_id}.final_parts_cents == 3998"
            - "Invoice.${inv_id}.final_total_cents == 40201"
            - "Estimate.${est_id}.estimate_total_cents != Invoice.${inv_id}.final_total_cents"

      - name: technician_lifetime_vs_rolling_callback_rate_diverge
        grounds:
          - calculations.technician_callback_rate
          - entities.Technician.fields.lifetime_callback_count
          - entities.Technician.fields.lifetime_completed_count
        distinguishing_aspect: |
          Risk scoring on the Technician domain (not cost accounting): the technician completes 6 distinct
          jobs J1..J6 at strictly increasing completed_at; OPEN callbacks are filed only against the TWO
          OLDEST (J1, J2). lifetime_callback_rate = 2/6 = 0.3333, but the rolling window (5 most recent by
          completed_at DESC = J6,J5,J4,J3,J2) contains only J2's callback, so rolling = 1/5 = 0.2000 — same
          data, two rates that diverge.
        test_recipe:
          setup:
            - "One customer, one skill-5 technician, one flat-rate item base 10000. Six jobs J1..J6 each go through the full lifecycle to COMPLETED, with the clock advanced one day between completions so completed_at strictly increases J1<J2<...<J6."
            - "After all six complete (lifetime_completed_count=6), OPEN callbacks are filed against J1 and J2 only (lifetime_callback_count=2). No callback is accepted, so no job reopens and completed_at ordering is stable."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-01-01T09:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/customers"
              payload: { name: "Cust CB", service_address: "9 Oak St", credit_limit_cents: 100000000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech CB", skill_level: 5 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "GEN-1", category: "DRAIN", base_price_cents: 10000, skill_required: 1 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            # ---- J1 (completed 2026-01-01) ----
            - call: "POST /plumbing/service-jobs"
