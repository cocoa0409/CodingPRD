            - "the third call returns HTTP 201 and ${rule_b_status} == ACTIVE (abutting at 2026-10-01T00:00:00Z is legal)"
            - "the fourth call returns HTTP 201 (supersede_rule_id exempts rule A from the overlap check, and rule B only abuts)"
