# =============================================================================
# Task 2304 — Health Plan Transparency & Contract Attestation Compliance
# Scaffold seed tables §1.0–§1.7 (single source of truth for downstream PRD,
# unit tests, and reference implementation).
# Difficulty target: beyond Expert (13 entities, 15 state-machine dimensions across
# 13 entities, 9 calculations, 45 ordered validations, 73 endpoints, 2 OCC rules,
# 57 error codes, 5 roles).
# =============================================================================

scenario: |
  2304. Health Plan Transparency & Contract Attestation Compliance (employer plan sponsor compliance): machine-readable file publication of negotiated rates and allowed amounts with monthly refresh, price comparison tool availability for covered items and services, service provider contract review for prohibited gag clauses on cost and quality data, annual attestation submission with documentation of contract terms, broker and consultant compensation disclosure receipt and reasonableness assessment, prescription drug data collection reporting with plan and pharmacy vendor data assembly, vendor contract amendments to secure data rights and cooperation, penalty exposure assessment and remediation planning

domain_name: health-plan-transparency-compliance
api_prefix: /compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  # Every entity is a peer addressed at /compliance/<collection>/{id}; parents are
  # reached only through FK fields in request bodies and filtered list endpoints.
  state_machine_shape: parallel
  # PlanYear carries two independent dimensions (lifecycle_status × compliance_posture);
  # ServiceProviderContract carries two more (gag_review_status × data_rights_status)
  # with a cyclic remediation loop on the gag dimension; Attestation is fork-join
  # branching (SUBMITTED → {ACCEPTED, REJECTED}) with divergent side-effect sets.
  relationship_patterns:
    - one_to_many
    - self_referential      # PenaltyLedgerEntry.reverses_entry_id -> PenaltyLedgerEntry.id
    - cross_aggregate       # VendorDataPackage gated by ServiceProviderContract.data_rights_status
  role_model: segregation_of_duties
  # The ComplianceOfficer who prepared an Attestation may not submit it; the
  # ExternalAuditor who adjudicates it may not prepare or submit it.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PlanYear
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_name, type: string, source: input, description: "Employer plan sponsor legal name" }
      - { name: plan_year_label, type: string, source: input, description: "Human label such as PY2027", constraints: "non-empty, unique across PlanYear" }
      - { name: start_date, type: string, source: input, description: "First day of the plan year, ISO date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Last day of the plan year, ISO date YYYY-MM-DD", constraints: "must be strictly after start_date" }
      - { name: covered_lives, type: integer, source: input, description: "Enrolled covered lives; drives the penalty size_multiplier tier", constraints: ">= 1" }
      - { name: attestation_deadline_date, type: string, source: input, description: "ISO date by which the annual gag-clause attestation must be ACCEPTED" }
      - { name: rxdc_deadline_date, type: string, source: input, description: "ISO date by which the prescription-drug data submission must reach SUBMITTED" }
      - { name: lifecycle_status, type: enum, source: system, default: SETUP, description: "Administrative dimension of the PlanYear state machine", constraints: "SETUP | ACTIVE | REPORTING_CLOSED" }
      - { name: compliance_posture, type: enum, source: computed, default: COMPLIANT, description: "Derived posture dimension gating child mutations; recomputed by calculations.plan_year_compliance_posture", constraints: "COMPLIANT | AT_RISK | DEFICIENT | FROZEN" }
      - { name: deficiency_points, type: integer, source: computed, default: 0, description: "Weighted open-deficiency point total feeding compliance_posture" }
      - { name: penalty_exposure_cents, type: integer, source: computed, default: 0, description: "Posted ledger balance; equals calculations.penalty_ledger_balance over PenaltyLedgerEntry rows of this plan year" }
      - { name: tool_sla_breach_count, type: integer, source: computed, default: 0, description: "Count of PriceComparisonTool rows of this plan year with sla_breach_open == true" }
      - { name: attestation_status, type: enum, source: computed, default: NOT_STARTED, description: "Mirror of the most recently created Attestation.status for this plan year (latest created_at)", constraints: "NOT_STARTED | DRAFT | SUBMITTED | ACCEPTED | REJECTED | VOIDED" }
      - { name: freeze_flag, type: boolean, source: system, default: false, description: "Set true by the ExternalAuditor freeze action; forces compliance_posture = FROZEN" }
      - { name: freeze_reason, type: string, source: system, default: null, description: "Reason captured on the freeze action; cleared on unfreeze" }
      - { name: last_compliance_run_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent compliance run on this plan year" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Service provider legal name" }
      - { name: vendor_type, type: enum, source: input, description: "Kind of service provider", constraints: "TPA | PBM | BROKER | CONSULTANT | NETWORK_VENDOR" }
      - { name: contact_email, type: string, source: input, description: "Vendor contact mailbox" }

  - name: ServiceProviderContract
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; plan year this contract serves" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; contracted service provider" }
      - { name: contract_type, type: enum, source: input, description: "Service category of the contract", constraints: "TPA | PBM | BROKER | CONSULTANT | NETWORK_VENDOR" }
      - { name: term_start, type: string, source: input, description: "ISO date, first day of the contract term (interval treated half-open [term_start, term_end))" }
      - { name: term_end, type: string, source: input, description: "ISO date, exclusive end of the contract term", constraints: "must be strictly after term_start" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Contracted annual direct fee in cents", constraints: ">= 0" }
      - { name: gag_review_status, type: enum, source: system, default: NOT_REVIEWED, description: "Gag-clause dimension; cycles IN_REVIEW <-> REMEDIATION_REQUESTED before terminating", constraints: "NOT_REVIEWED | IN_REVIEW | REMEDIATION_REQUESTED | COMPLIANT | NON_COMPLIANT" }
      - { name: data_rights_status, type: enum, source: system, default: NOT_SECURED, description: "Data-rights dimension, advanced independently by ContractAmendment", constraints: "NOT_SECURED | PENDING_AMENDMENT | SECURED" }
      - { name: clause_inventory_count, type: integer, source: system, default: 0, description: "Total clauses inventoried by the latest gag-clause review action" }
      - { name: prohibited_clause_count, type: integer, source: system, default: 0, description: "Outstanding prohibited gag clauses on cost or quality data" }
      - { name: remediation_round, type: integer, source: system, default: 0, description: "Number of completed gag remediation loops; capped by MAX_REMEDIATION_ROUNDS" }
      - { name: gag_non_compliant_since, type: string, source: system, default: null, description: "ISO date on which gag_review_status became NON_COMPLIANT; onset date of the GAG_CLAUSE deficiency" }
      - { name: compensation_disclosure_required, type: boolean, source: computed, description: "True exactly when contract_type IN {BROKER, CONSULTANT}" }

  - name: ContractAmendment
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceProviderContract.id; contract being amended" }
      - { name: amendment_type, type: enum, source: input, description: "Purpose of the amendment", constraints: "DATA_RIGHTS | GAG_CLAUSE_REMOVAL | COOPERATION_SLA" }
      - { name: proposed_terms_summary, type: string, source: input, description: "Sponsor-side proposed terms text" }
      - { name: data_rights_granted, type: boolean, source: input, description: "Whether the current proposal grants the sponsor data rights and cooperation" }
      - { name: expires_at, type: datetime, source: input, description: "ISO 8601 UTC instant after which the amendment lapses if not executed" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "Negotiation state", constraints: "PROPOSED | COUNTERED | EXECUTED | WITHDRAWN | LAPSED" }
      - { name: round, type: integer, source: system, default: 1, description: "Negotiation round; incremented by revise-proposal, capped by MAX_NEGOTIATION_ROUNDS" }
      - { name: counter_terms_summary, type: string, source: system, default: null, description: "Vendor counter text recorded by the counter action" }
      - { name: executed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of execution" }
      - { name: executed_terms_note, type: string, source: system, default: null, description: "Optional note captured at execution" }
      - { name: withdrawal_reason, type: string, source: system, default: null, description: "Reason text; set to SUPERSEDED_BY_NEWER_AMENDMENT when a newer amendment of the same type supersedes this one" }

  - name: CompensationDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceProviderContract.id; broker or consultant contract the disclosure covers" }
      - { name: direct_comp_cents, type: integer, source: input, description: "Direct compensation reported for the plan year, in cents", constraints: ">= 0" }
      - { name: indirect_comp_cents, type: integer, source: input, description: "Indirect compensation (carrier overrides, bonuses) in cents", constraints: ">= 0" }
      - { name: benchmark_median_cents, type: integer, source: input, description: "Market benchmark median compensation in cents", constraints: ">= 1" }
      - { name: services_scope_score, type: integer, source: input, description: "Breadth-of-services score, 5 = fullest scope", constraints: "integer 1..5" }
      - { name: disclosure_completeness_score, type: integer, source: input, description: "Completeness of the 408(b)(2) disclosure, 5 = fully complete", constraints: "integer 1..5" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "Assessment state", constraints: "RECEIVED | REASONABLE | UNREASONABLE" }
      - { name: variant_applied, type: enum, source: computed, default: null, description: "Which calculations.compensation_reasonableness_score variant was applied", constraints: "TOTAL_WITH_INDIRECT | DIRECT_ONLY" }
      - { name: component_price_score, type: number, source: computed, default: null, description: "Rounded price component of the unreasonableness score, 2 dp" }
      - { name: component_scope_score, type: number, source: computed, default: null, description: "Rounded scope-deficit component, 2 dp" }
      - { name: component_disclosure_score, type: number, source: computed, default: null, description: "Rounded disclosure-deficit component, 2 dp" }
      - { name: unreasonableness_score, type: number, source: computed, default: null, description: "Sum of the three already-rounded components, 2 dp" }
      - { name: assessed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of assessment" }
      - { name: assessed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer who assessed the disclosure" }

  - name: MachineReadableFile
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; plan year the file discloses" }
      - { name: file_type, type: enum, source: input, description: "Machine-readable file flavor", constraints: "IN_NETWORK_RATES | ALLOWED_AMOUNTS" }
      - { name: posting_month, type: string, source: input, description: "Posting month in YYYY-MM form; monthly refresh key" }
      - { name: public_url, type: string, source: input, description: "Public https location of the posted file" }
      - { name: row_count, type: integer, source: input, description: "Rows of negotiated rates or allowed amounts in the file", constraints: ">= 1" }
      - { name: schema_version, type: string, source: input, description: "CMS schema version string of the posted payload" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Publication state", constraints: "DRAFT | VALIDATING | PUBLISHED | REJECTED | SUPERSEDED" }
      - { name: validation_error_count, type: integer, source: system, default: null, description: "Schema error count reported by the validate action; 0 publishes, >0 rejects" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Logical-clock instant the file reached PUBLISHED" }
      - { name: superseded_at, type: datetime, source: system, default: null, description: "Logical-clock instant a newer PUBLISHED file of the same (plan_year_id, file_type, posting_month) displaced this one" }

  - name: RefreshCycle
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; plan year whose monthly refresh this cycle tracks" }
      - { name: period_month, type: string, source: input, description: "Refresh month in YYYY-MM form; must equal the posting_month of the files certified" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive first day of the refresh period" }
      - { name: period_end, type: string, source: input, description: "ISO date, INCLUSIVE last day of the refresh period; cycle intervals are closed [period_start, period_end]" }
      - { name: deadline_at, type: datetime, source: computed, description: "period_end + GRACE_DAYS days at 23:59:59.999Z; certification at or before this instant is on time" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Certification state", constraints: "PENDING | CERTIFIED | LATE_CERTIFIED | MISSED" }
      - { name: certified_at, type: datetime, source: system, default: null, description: "Logical-clock instant of certification" }
      - { name: certified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the certifying ComplianceOfficer" }
      - { name: on_time, type: boolean, source: computed, default: null, description: "True when certified_at <= deadline_at; false for LATE_CERTIFIED; null while PENDING or MISSED" }
      - { name: certification_note, type: string, source: system, default: null, description: "Optional note captured at certification" }

  - name: PriceComparisonTool
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; plan year the tool serves" }
      - { name: tool_name, type: string, source: input, description: "Consumer-facing name of the price comparison tool" }
      - { name: covered_items_count, type: integer, source: input, description: "Count of covered items and services priced by the tool", constraints: ">= 0" }
      - { name: sla_target_uptime_pct, type: number, source: input, default: 99.00, description: "Availability target in percent, 2 dp" }
      - { name: status, type: enum, source: system, default: PENDING_LAUNCH, description: "Availability state", constraints: "PENDING_LAUNCH | LIVE" }
      - { name: launched_at, type: datetime, source: system, default: null, description: "Logical-clock instant the tool went LIVE" }
      - { name: outage_windows, type: array, source: system, default: [], description: "Append-only embedded outage records, each an object { window_start, window_end, cause } with half-open [window_start, window_end) semantics" }
      - { name: last_evaluated_month, type: string, source: system, default: null, description: "YYYY-MM of the most recent availability evaluation" }
      - { name: last_uptime_pct, type: number, source: computed, default: null, description: "Uptime percent of last_evaluated_month, 2 dp, from calculations.tool_monthly_uptime" }
      - { name: last_downtime_minutes, type: integer, source: computed, default: null, description: "Merged downtime minutes inside last_evaluated_month" }
      - { name: sla_breach_open, type: boolean, source: system, default: false, description: "True while the most recent evaluation fell below sla_target_uptime_pct" }
      - { name: breach_onset_date, type: string, source: system, default: null, description: "ISO date, first day of the month following the breached evaluation month; onset date of the TOOL_SLA deficiency" }

  - name: RxDataSubmission
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; plan year being reported" }
      - { name: reference_year, type: integer, source: input, description: "Prescription-drug data reference year", constraints: ">= 2020" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Assembly and filing state", constraints: "OPEN | ASSEMBLING | RECONCILED | SUBMITTED" }
      - { name: assembled_record_count, type: integer, source: computed, default: 0, description: "Conserved quantity: equals the sum of record_count over VendorDataPackage rows of this submission with status == VALIDATED" }
      - { name: gross_spend_cents, type: integer, source: computed, default: null, description: "Gross prescription-drug spend from calculations.rxdc_reconciliation_totals; null until RECONCILED and nulled on demotion" }
      - { name: rebate_reported_cents, type: integer, source: computed, default: null, description: "Sum of rebate_cents over VALIDATED packages at reconciliation" }
      - { name: rebate_cap_pct, type: number, source: computed, default: null, description: "Rebate cap percentage selected from the gross_spend_cents tier" }
      - { name: rebate_credit_cents, type: integer, source: computed, default: null, description: "Allowed rebate credit after the cap" }
      - { name: net_plan_spend_cents, type: integer, source: computed, default: null, description: "gross_spend_cents - rebate_credit_cents" }
      - { name: reconciled_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the last successful reconciliation" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant the submission was filed" }

  - name: VendorDataPackage
    parent: null
    common_fields: true
    fields:
      - { name: rx_submission_id, type: string, source: input, description: "FK -> RxDataSubmission.id; submission this package feeds" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; plan or pharmacy vendor supplying the data" }
      - { name: data_section, type: enum, source: input, description: "RxDC data section supplied", constraints: "D2_SPENDING | D6_RX_TOTALS | D7_RX_REBATES | D8_PREMIUM_IMPACT" }
      - { name: expected_record_count, type: integer, source: input, description: "Record count the sponsor expects from this vendor", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: EXPECTED, description: "Delivery state; REJECTED is re-enterable through resubmit", constraints: "EXPECTED | RECEIVED | VALIDATED | REJECTED" }
      - { name: record_count, type: integer, source: system, default: null, description: "Records actually delivered in the latest delivery round" }
      - { name: plan_paid_cents, type: integer, source: system, default: null, description: "Plan-paid prescription spend in the delivered package, cents" }
      - { name: member_paid_cents, type: integer, source: system, default: null, description: "Member-paid prescription spend in the delivered package, cents" }
      - { name: rebate_cents, type: integer, source: system, default: null, description: "Rebates reported in the delivered package, cents" }
      - { name: delivery_round, type: integer, source: system, default: 0, description: "Number of deliveries made, incremented by deliver and resubmit" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded by the reject action" }
      - { name: validated_at, type: datetime, source: system, default: null, description: "Logical-clock instant of validation" }

  - name: Attestation
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; plan year attested to" }
      - { name: attestation_type, type: enum, source: input, description: "Attestation flavor", constraints: "GAG_CLAUSE_CEE" }
      - { name: contract_terms_doc_count, type: integer, source: input, default: 0, description: "Number of contract-term documents attached as attestation evidence", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Attestation state; branches at SUBMITTED", constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | VOIDED" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who created the draft; segregation-of-duties anchor" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the submitting ComplianceOfficer; must differ from prepared_by_user_id" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of submission" }
      - { name: signature_statement, type: string, source: system, default: null, description: "Signature text captured at submission" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Auditor reason captured on rejection" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Incremented each time a REJECTED attestation is revised back to DRAFT" }
      - { name: void_reason, type: string, source: system, default: null, description: "POSTURE_DEFICIENT when auto-voided by a posture flip, SUPERSEDED_BY_NEWER_DRAFT when displaced by a newer draft" }

  - name: PenaltyLedgerEntry
    parent: null
    common_fields: false
    immutable: true
    fields:
      - { name: id, type: string, source: system, description: "UUID primary key. MUST NEVER decide a business outcome; ledger ordering is by created_at" }
      - { name: created_at, type: datetime, source: system, description: "Logical-clock instant the entry was posted; the ledger's only ordering key" }
      - { name: plan_year_id, type: string, source: system, description: "FK -> PlanYear.id; plan year the entry scores against" }
      - { name: entry_type, type: enum, source: system, description: "Direction of the entry", constraints: "ACCRUAL | ABATEMENT" }
      - { name: deficiency_type, type: enum, source: system, description: "Deficiency the entry prices", constraints: "MRF_REFRESH | TOOL_SLA | RXDC_LATE | GAG_CLAUSE | ATTESTATION_LATE" }
      - { name: signed_amount_cents, type: integer, source: system, description: "Positive for ACCRUAL, negative for ABATEMENT; the ledger is append-only and immutable" }
      - { name: daily_rate_cents, type: integer, source: system, description: "DAILY_RATE_CENTS entry used when the accrual was priced; 0 on abatements" }
      - { name: days_open, type: integer, source: system, description: "Whole days from onset_date through the posting clock date, inclusive; 0 on abatements" }
      - { name: size_multiplier, type: number, source: system, description: "Covered-lives multiplier applied at posting; 1.0 on abatements" }
      - { name: onset_date, type: string, source: system, description: "ISO date the priced deficiency began; null on abatements" }
      - { name: reverses_entry_id, type: string, source: system, default: null, description: "FK -> PenaltyLedgerEntry.id; set on the compensating entry produced by the reverse action" }
      - { name: remediation_plan_id, type: string, source: system, default: null, description: "FK -> RemediationPlan.id; set on abatements produced by remediation-plan completion" }
      - { name: reason, type: string, source: system, description: "Human-readable posting reason" }
      - { name: posted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the actor whose call posted the entry; null for compliance-run postings" }

  - name: RemediationPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id; plan year being remediated" }
      - { name: target_deficiency_type, type: enum, source: input, description: "Deficiency family the plan abates", constraints: "MRF_REFRESH | TOOL_SLA | RXDC_LATE | GAG_CLAUSE | ATTESTATION_LATE" }
      - { name: milestone_count, type: integer, source: input, description: "Total milestones the plan commits to", constraints: ">= 1" }
      - { name: plan_summary, type: string, source: input, description: "Narrative of the corrective steps" }
      - { name: completed_milestone_count, type: integer, source: system, default: 0, description: "Milestones recorded complete so far" }
      - { name: last_milestone_label, type: string, source: system, default: null, description: "Label of the most recently completed milestone" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Plan state", constraints: "ACTIVE | COMPLETED" }
      - { name: abatement_posted_cents, type: integer, source: computed, default: null, description: "Absolute value of the ABATEMENT entry posted at completion, from calculations.remediation_abatement_amount" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of completion" }

# =============================================================================
# §1.2 State Machine Table
# PlanYear and ServiceProviderContract each carry TWO independent dimensions;
# each dimension is listed as its own machine entry with a `dimension:` key.
# =============================================================================
state_machines:
  - entity: PlanYear
    dimension: lifecycle_status
    initial_state: SETUP
    terminal_states: [REPORTING_CLOSED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /compliance/plan-years/{id}/activate"
        actor: PlanSponsorAdmin
        preconditions:
          - "lifecycle_status == SETUP"
          - "compliance_posture != FROZEN"
          - "at least one ServiceProviderContract exists with plan_year_id == this PlanYear.id AND contract_type == TPA"
        side_effects:
          - "PlanYear.version increments by 1; updated_at refreshed"
        note: "Child operations gated on ACTIVE: refresh-cycle certify, price-tool launch, rx-submission create/submit, attestation submit."
      - from: ACTIVE
        to: REPORTING_CLOSED
        trigger: "POST /compliance/plan-years/{id}/close-reporting"
        actor: PlanSponsorAdmin
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "compliance_posture != FROZEN"
          - "logical clock date > PlanYear.end_date"
        side_effects:
          - "PlanYear.version increments by 1"
          - "compliance_posture is recomputed once (calculations.plan_year_compliance_posture) so the closing snapshot reflects any deficiency accrued on the final day"

  - entity: PlanYear
    dimension: compliance_posture
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: AT_RISK
        trigger: "system — recomputation of calculations.plan_year_compliance_posture after any deficiency-affecting mutation"
        actor: system
        preconditions:
          - "freeze_flag == false"
          - "1 <= deficiency_points < DEFICIENT_POINT_THRESHOLD (6)"
        side_effects:
          - "PlanYear.deficiency_points is stored; PlanYear.version increments by 1"
      - from: AT_RISK
        to: DEFICIENT
        trigger: "system — recomputation after a deficiency-affecting mutation (gag escalation, missed refresh cycle, tool SLA breach, RxDC lateness, unreasonable compensation)"
        actor: system
        preconditions:
          - "freeze_flag == false"
          - "DEFICIENT_POINT_THRESHOLD (6) <= deficiency_points < FROZEN_POINT_THRESHOLD (12)"
        side_effects:
          - "Every Attestation of this plan year with status == DRAFT auto-transitions to VOIDED with void_reason = POSTURE_DEFICIENT"
          - "PlanYear.attestation_status is refreshed from the latest Attestation (VOIDED when the latest draft was voided)"
          - "PlanYear.version increments by 1"
      - from: COMPLIANT
        to: DEFICIENT
        trigger: "system — same recomputation when a single mutation adds >= DEFICIENT_POINT_THRESHOLD points at once (e.g. GAG_CLAUSE weight 6)"
        actor: system
        preconditions:
          - "freeze_flag == false"
          - "deficiency_points >= DEFICIENT_POINT_THRESHOLD (6) and < FROZEN_POINT_THRESHOLD (12)"
        side_effects:
          - "Same DRAFT-attestation voiding cascade as AT_RISK → DEFICIENT"
          - "PlanYear.version increments by 1"
      - from: DEFICIENT
        to: FROZEN
        trigger: "system — recomputation, or POST /compliance/plan-years/{id}/freeze"
        actor: system
        preconditions:
          - "freeze_flag == true OR deficiency_points >= FROZEN_POINT_THRESHOLD (12)"
        side_effects:
          - "All mutating child endpoints of this plan year reject with ERR_PLAN_YEAR_FROZEN, except POST /compliance/plan-years/{id}/unfreeze, POST /compliance/penalty-ledger-entries/{id}/reverse, POST /compliance/remediation-plans (create), POST /compliance/remediation-plans/{id}/milestone-completions and POST /compliance/remediation-plans/{id}/complete"
          - "PlanYear.version increments by 1"
      - from: COMPLIANT
        to: FROZEN
        trigger: "POST /compliance/plan-years/{id}/freeze"
        actor: ExternalAuditor
        preconditions:
          - "freeze_flag == false"
        side_effects:
          - "freeze_flag = true; freeze_reason = request.reason"
          - "Same child-mutation lockdown as DEFICIENT → FROZEN"
          - "PlanYear.version increments by 1"
      - from: FROZEN
        to: COMPLIANT
        trigger: "POST /compliance/plan-years/{id}/unfreeze"
        actor: ExternalAuditor
        preconditions:
          - "freeze_flag == true"
          - "deficiency_points == 0 after recomputation"
        side_effects:
          - "freeze_flag = false; freeze_reason = null"
          - "compliance_posture recomputed from deficiency_points (0 → COMPLIANT)"
          - "PlanYear.version increments by 1"
      - from: FROZEN
        to: AT_RISK
        trigger: "POST /compliance/plan-years/{id}/unfreeze"
        actor: ExternalAuditor
        preconditions:
          - "freeze_flag == true"
          - "1 <= deficiency_points < DEFICIENT_POINT_THRESHOLD (6) after recomputation"
        side_effects:
          - "freeze_flag = false; freeze_reason = null; posture recomputed to AT_RISK"
          - "PlanYear.version increments by 1"
      - from: FROZEN
        to: DEFICIENT
        trigger: "POST /compliance/plan-years/{id}/unfreeze"
        actor: ExternalAuditor
        preconditions:
          - "freeze_flag == true"
          - "deficiency_points >= DEFICIENT_POINT_THRESHOLD (6) after recomputation"
        side_effects:
          - "freeze_flag = false; posture recomputed to DEFICIENT; DRAFT attestations of the plan year are voided with void_reason = POSTURE_DEFICIENT"
          - "PlanYear.version increments by 1"
      - from: DEFICIENT
        to: AT_RISK
        trigger: "system — recomputation after a remediating mutation (ledger reversal, remediation completion, gag clearance, refresh certification)"
        actor: system
        preconditions:
          - "freeze_flag == false"
          - "1 <= deficiency_points < DEFICIENT_POINT_THRESHOLD (6)"
        side_effects:
          - "PlanYear.version increments by 1; voided attestations are NOT revived (VOIDED is terminal)"
      - from: AT_RISK
        to: COMPLIANT
        trigger: "system — recomputation after a remediating mutation"
        actor: system
        preconditions:
          - "freeze_flag == false"
          - "deficiency_points == 0"
        side_effects:
          - "PlanYear.version increments by 1"

  - entity: ServiceProviderContract
    dimension: gag_review_status
    initial_state: NOT_REVIEWED
    terminal_states: [COMPLIANT, NON_COMPLIANT]
    transitions:
      - from: NOT_REVIEWED
        to: IN_REVIEW
        trigger: "POST /compliance/contracts/{id}/gag-review"
        actor: ComplianceOfficer
        preconditions:
          - "gag_review_status == NOT_REVIEWED"
          - "PlanYear.compliance_posture != FROZEN"
          - "request.prohibited_clause_count <= request.clause_inventory_count"
        side_effects:
          - "clause_inventory_count and prohibited_clause_count are stored from the request"
          - "ServiceProviderContract.version increments by 1"
      - from: IN_REVIEW
        to: REMEDIATION_REQUESTED
        trigger: "POST /compliance/contracts/{id}/request-remediation"
        actor: ComplianceOfficer
        preconditions:
          - "gag_review_status == IN_REVIEW"
          - "prohibited_clause_count >= 1"
          - "remediation_round < MAX_REMEDIATION_ROUNDS (2)"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "ServiceProviderContract.version increments by 1"
      - from: REMEDIATION_REQUESTED
        to: IN_REVIEW
        trigger: "POST /compliance/contracts/{id}/submit-remediation"
        actor: VendorContact
        preconditions:
          - "gag_review_status == REMEDIATION_REQUESTED"
          - "X-User-ID == ServiceProviderContract.vendor_id"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "prohibited_clause_count = request.prohibited_clause_count; remediation_round increments by 1"
          - "ServiceProviderContract.version increments by 1"
        note: "This is the cycle edge: REMEDIATION_REQUESTED → IN_REVIEW → REMEDIATION_REQUESTED may repeat until remediation_round reaches MAX_REMEDIATION_ROUNDS."
      - from: IN_REVIEW
        to: COMPLIANT
        trigger: "POST /compliance/contracts/{id}/clear-gag"
        actor: ComplianceOfficer
        preconditions:
          - "gag_review_status == IN_REVIEW"
          - "prohibited_clause_count == 0"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "gag_non_compliant_since = null"
          - "PlanYear.deficiency_points and compliance_posture are recomputed"
          - "ServiceProviderContract.version increments by 1"
      - from: IN_REVIEW
        to: NON_COMPLIANT
        trigger: "POST /compliance/contracts/{id}/escalate-gag"
        actor: ComplianceOfficer
        preconditions:
          - "gag_review_status IN {IN_REVIEW, REMEDIATION_REQUESTED}"
          - "prohibited_clause_count >= 1"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "CASCADE-A link 1: gag_non_compliant_since = logical clock date (UTC calendar date); ServiceProviderContract.version increments by 1"
          - "CASCADE-A link 2: because gag_review_status became NON_COMPLIANT, the system posts one PenaltyLedgerEntry { entry_type: ACCRUAL, deficiency_type: GAG_CLAUSE, onset_date: gag_non_compliant_since } priced by calculations.penalty_accrual_posting"
          - "CASCADE-A link 3: the posted entry itself triggers recomputation of PlanYear.penalty_exposure_cents (calculations.penalty_ledger_balance) and PlanYear.deficiency_points"
          - "CASCADE-A link 4: the recomputed deficiency_points crossing DEFICIENT_POINT_THRESHOLD flips PlanYear.compliance_posture to DEFICIENT"
          - "CASCADE-A link 5: the posture flip to DEFICIENT itself voids every DRAFT Attestation of the plan year (void_reason = POSTURE_DEFICIENT) and refreshes PlanYear.attestation_status"
      - from: REMEDIATION_REQUESTED
        to: NON_COMPLIANT
        trigger: "POST /compliance/contracts/{id}/escalate-gag"
        actor: ComplianceOfficer
        preconditions:
          - "gag_review_status == REMEDIATION_REQUESTED"
          - "prohibited_clause_count >= 1"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "Identical CASCADE-A links 1-5 as the IN_REVIEW → NON_COMPLIANT edge"

  - entity: ServiceProviderContract
    dimension: data_rights_status
    initial_state: NOT_SECURED
    terminal_states: []
    transitions:
      - from: NOT_SECURED
        to: PENDING_AMENDMENT
        trigger: "POST /compliance/contract-amendments (create with amendment_type == DATA_RIGHTS)"
        actor: PlanSponsorAdmin
        preconditions:
          - "data_rights_status == NOT_SECURED"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "ServiceProviderContract.version increments by 1 (this is what makes a second create carrying the pre-create version stale)"
      - from: PENDING_AMENDMENT
        to: SECURED
        trigger: "POST /compliance/contract-amendments/{id}/execute"
        actor: PlanSponsorAdmin
        preconditions:
          - "the executed ContractAmendment has amendment_type == DATA_RIGHTS AND data_rights_granted == true"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "ServiceProviderContract.data_rights_status = SECURED; version increments by 1"
          - "VendorDataPackage deliveries for this contract's vendor within the same plan year become permitted"
      - from: PENDING_AMENDMENT
        to: NOT_SECURED
        trigger: "system — POST /compliance/plan-years/{id}/compliance-runs lapses every DATA_RIGHTS amendment whose expires_at < logical clock"
        actor: system
        preconditions:
          - "no ContractAmendment of this contract with amendment_type == DATA_RIGHTS remains in status IN {PROPOSED, COUNTERED} after the lapse sweep"
          - "data_rights_status == PENDING_AMENDMENT"
        side_effects:
          - "ServiceProviderContract.data_rights_status = NOT_SECURED; version increments by 1"

  - entity: ContractAmendment
    initial_state: PROPOSED
    terminal_states: [EXECUTED, WITHDRAWN, LAPSED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /compliance/contract-amendments/{id}/counter"
        actor: VendorContact
        preconditions:
          - "status == PROPOSED"
          - "X-User-ID == ServiceProviderContract.vendor_id of the amendment's contract"
          - "logical clock <= expires_at"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "counter_terms_summary stored; ContractAmendment.version increments by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /compliance/contract-amendments/{id}/revise-proposal"
        actor: PlanSponsorAdmin
        preconditions:
          - "status == COUNTERED"
          - "round < MAX_NEGOTIATION_ROUNDS (3)"
          - "logical clock <= expires_at"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "proposed_terms_summary and data_rights_granted replaced from the request; round increments by 1"
          - "ContractAmendment.version increments by 1"
        note: "Negotiation cycle edge. When round == MAX_NEGOTIATION_ROUNDS the call is rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED."
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /compliance/contract-amendments/{id}/execute"
        actor: PlanSponsorAdmin
        preconditions:
          - "status == PROPOSED"
          - "logical clock <= expires_at"
          - "if amendment_type == DATA_RIGHTS then data_rights_granted == true"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "executed_at = logical clock; executed_terms_note stored"
          - "if amendment_type == DATA_RIGHTS: the contract's data_rights_status advances PENDING_AMENDMENT → SECURED (cross-entity)"
          - "if amendment_type == GAG_CLAUSE_REMOVAL: ServiceProviderContract.prohibited_clause_count = 0 (the removal is contractual) and version increments"
          - "ContractAmendment.version increments by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system — POST /compliance/contract-amendments (create) supersedes the prior open amendment of the same contract_id AND amendment_type"
        actor: system
        preconditions:
          - "status IN {PROPOSED, COUNTERED}"
        side_effects:
          - "withdrawal_reason = SUPERSEDED_BY_NEWER_AMENDMENT; ContractAmendment.version increments by 1"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "system — same supersede rule as PROPOSED → WITHDRAWN"
        actor: system
        preconditions:
          - "status == COUNTERED"
        side_effects:
          - "withdrawal_reason = SUPERSEDED_BY_NEWER_AMENDMENT; ContractAmendment.version increments by 1"
      - from: PROPOSED
        to: LAPSED
        trigger: "system — POST /compliance/plan-years/{id}/compliance-runs"
        actor: system
        preconditions:
          - "status IN {PROPOSED, COUNTERED}"
          - "expires_at < logical clock"
        side_effects:
          - "ContractAmendment.version increments by 1"
          - "if no other open DATA_RIGHTS amendment remains, the contract's data_rights_status reverts PENDING_AMENDMENT → NOT_SECURED"
      - from: COUNTERED
        to: LAPSED
        trigger: "system — POST /compliance/plan-years/{id}/compliance-runs"
        actor: system
        preconditions:
          - "status == COUNTERED"
          - "expires_at < logical clock"
        side_effects:
          - "Identical to PROPOSED → LAPSED"

  - entity: CompensationDisclosure
    initial_state: RECEIVED
    terminal_states: [REASONABLE, UNREASONABLE]
    transitions:
      - from: RECEIVED
        to: REASONABLE
        trigger: "POST /compliance/compensation-disclosures/{id}/assess"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECEIVED"
          - "PlanYear.compliance_posture != FROZEN"
          - "calculations.compensation_reasonableness_score yields unreasonableness_score < UNREASONABLE_THRESHOLD (55.00)"
        side_effects:
          - "variant_applied, component_price_score, component_scope_score, component_disclosure_score, unreasonableness_score stored; assessed_at and assessed_by_user_id stored"
          - "CompensationDisclosure.version increments by 1"
      - from: RECEIVED
        to: UNREASONABLE
        trigger: "POST /compliance/compensation-disclosures/{id}/assess"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECEIVED"
          - "PlanYear.compliance_posture != FROZEN"
          - "unreasonableness_score >= UNREASONABLE_THRESHOLD (55.00)"
        side_effects:
          - "Same score fields stored as the REASONABLE branch"
          - "PlanYear.deficiency_points recomputed (+3 for this disclosure) and compliance_posture recomputed — divergent side-effect set versus the REASONABLE branch, which touches no PlanYear field"
          - "CompensationDisclosure.version increments by 1"

  - entity: MachineReadableFile
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: VALIDATING
        trigger: "POST /compliance/machine-readable-files/{id}/validate"
        actor: PlanSponsorAdmin
        preconditions:
          - "status == DRAFT"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "validation_error_count stored from the request; MachineReadableFile.version increments by 1"
        note: "VALIDATING is an instantaneous intermediate state: the same request continues to PUBLISHED or REJECTED before responding."
      - from: VALIDATING
        to: PUBLISHED
        trigger: "system — continuation of POST /compliance/machine-readable-files/{id}/validate"
        actor: system
        preconditions:
          - "validation_error_count == 0"
        side_effects:
          - "published_at = logical clock"
          - "any other MachineReadableFile with the same plan_year_id, file_type and posting_month currently in status PUBLISHED transitions to SUPERSEDED with superseded_at = logical clock"
          - "MachineReadableFile.version increments by 1"
      - from: VALIDATING
        to: REJECTED
        trigger: "system — continuation of POST /compliance/machine-readable-files/{id}/validate"
        actor: system
        preconditions:
          - "validation_error_count >= 1"
        side_effects:
          - "published_at stays null; MachineReadableFile.version increments by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /compliance/machine-readable-files/{id}/revise"
        actor: PlanSponsorAdmin
        preconditions:
          - "status == REJECTED"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "public_url and row_count replaced from the request; validation_error_count reset to null"
          - "MachineReadableFile.version increments by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system — a newer file of the same (plan_year_id, file_type, posting_month) reaches PUBLISHED"
        actor: system
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "superseded_at = logical clock; MachineReadableFile.version increments by 1"

  - entity: RefreshCycle
    initial_state: PENDING
    terminal_states: [CERTIFIED, LATE_CERTIFIED, MISSED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /compliance/refresh-cycles/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING"
          - "PlanYear.lifecycle_status == ACTIVE"
          - "PlanYear.compliance_posture != FROZEN"
          - "a MachineReadableFile with status == PUBLISHED exists for this plan_year_id AND posting_month == period_month for EACH file_type in {IN_NETWORK_RATES, ALLOWED_AMOUNTS}"
          - "logical clock <= deadline_at"
        side_effects:
          - "certified_at = logical clock; certified_by_user_id = X-User-ID; on_time = true"
          - "RefreshCycle.version increments by 1"
      - from: PENDING
        to: LATE_CERTIFIED
        trigger: "POST /compliance/refresh-cycles/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING"
          - "PlanYear.lifecycle_status == ACTIVE"
          - "PlanYear.compliance_posture != FROZEN"
          - "both required PUBLISHED files exist"
          - "logical clock > deadline_at"
        side_effects:
          - "certified_at = logical clock; on_time = false"
          - "PlanYear.deficiency_points recomputed (+2 for this cycle) and compliance_posture recomputed"
          - "RefreshCycle.version increments by 1"
      - from: PENDING
        to: MISSED
        trigger: "system — POST /compliance/plan-years/{id}/compliance-runs"
        actor: system
        preconditions:
          - "status == PENDING"
          - "logical clock > deadline_at"
        side_effects:
          - "CASCADE-C link 1: RefreshCycle.status = MISSED; version increments by 1"
          - "CASCADE-C link 2: the MISSED status itself posts a PenaltyLedgerEntry { entry_type: ACCRUAL, deficiency_type: MRF_REFRESH, onset_date: deadline_at date + 1 day } priced by calculations.penalty_accrual_posting, unless an unreversed MRF_REFRESH accrual already exists for this cycle's period_month"
          - "CASCADE-C link 3: the posting recomputes PlanYear.penalty_exposure_cents and deficiency_points (+3 per MISSED cycle)"
          - "CASCADE-C link 4: the recomputed points may flip compliance_posture, which in turn voids DRAFT attestations when the new posture is DEFICIENT or FROZEN"

  - entity: PriceComparisonTool
    initial_state: PENDING_LAUNCH
    terminal_states: []
    transitions:
      - from: PENDING_LAUNCH
        to: LIVE
        trigger: "POST /compliance/price-comparison-tools/{id}/launch"
        actor: PlanSponsorAdmin
        preconditions:
          - "status == PENDING_LAUNCH"
          - "PlanYear.lifecycle_status == ACTIVE"
          - "PlanYear.compliance_posture != FROZEN"
          - "covered_items_count >= REQUIRED_COVERED_ITEMS (500)"
        side_effects:
          - "launched_at = logical clock; PriceComparisonTool.version increments by 1"

  - entity: RxDataSubmission
    initial_state: OPEN
    terminal_states: [SUBMITTED]
    transitions:
      - from: OPEN
        to: ASSEMBLING
        trigger: "system — first VendorDataPackage of this submission reaches RECEIVED via POST /compliance/vendor-data-packages/{id}/deliver"
        actor: system
        preconditions:
          - "status == OPEN"
        side_effects:
          - "RxDataSubmission.version increments by 1"
      - from: ASSEMBLING
        to: RECONCILED
        trigger: "POST /compliance/rx-data-submissions/{id}/reconcile"
        actor: ComplianceOfficer
        preconditions:
          - "status == ASSEMBLING"
          - "PlanYear.compliance_posture != FROZEN"
          - "at least one VendorDataPackage exists for this submission"
          - "every VendorDataPackage of this submission has status == VALIDATED"
        side_effects:
          - "calculations.rxdc_reconciliation_totals writes gross_spend_cents, rebate_reported_cents, rebate_cap_pct, rebate_credit_cents, net_plan_spend_cents; reconciled_at = logical clock"
          - "RxDataSubmission.version increments by 1"
      - from: RECONCILED
        to: ASSEMBLING
        trigger: "system — a VALIDATED VendorDataPackage of this submission is rejected via POST /compliance/vendor-data-packages/{id}/reject"
        actor: system
        preconditions:
          - "status == RECONCILED"
        side_effects:
          - "CASCADE-B link 3: gross_spend_cents, rebate_reported_cents, rebate_cap_pct, rebate_credit_cents, net_plan_spend_cents and reconciled_at are all set back to null because the reconciliation is no longer supported by validated data"
          - "CASCADE-B link 4: the demotion itself posts a PenaltyLedgerEntry { entry_type: ACCRUAL, deficiency_type: RXDC_LATE, onset_date: PlanYear.rxdc_deadline_date + 1 day } when logical clock date > PlanYear.rxdc_deadline_date AND no unreversed RXDC_LATE accrual exists for the plan year; that posting recomputes PlanYear.penalty_exposure_cents, deficiency_points (+5) and compliance_posture"
          - "RxDataSubmission.version increments by 1"
      - from: RECONCILED
        to: SUBMITTED
        trigger: "POST /compliance/rx-data-submissions/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECONCILED"
          - "PlanYear.lifecycle_status == ACTIVE"
          - "PlanYear.compliance_posture != FROZEN"
          - "every VendorDataPackage of this submission has status == VALIDATED"
        side_effects:
          - "submitted_at = logical clock"
          - "PlanYear.deficiency_points recomputed: the RXDC_LATE deficiency closes once status == SUBMITTED"
          - "RxDataSubmission.version increments by 1"

  - entity: VendorDataPackage
    initial_state: EXPECTED
    terminal_states: []
    transitions:
      - from: EXPECTED
        to: RECEIVED
        trigger: "POST /compliance/vendor-data-packages/{id}/deliver"
        actor: VendorContact
        preconditions:
          - "status == EXPECTED"
          - "X-User-ID == VendorDataPackage.vendor_id"
          - "PlanYear.compliance_posture != FROZEN"
          - "a ServiceProviderContract exists with plan_year_id == the submission's plan_year_id AND vendor_id == this package's vendor_id AND data_rights_status == SECURED"
        side_effects:
          - "record_count, plan_paid_cents, member_paid_cents, rebate_cents stored; delivery_round increments by 1"
          - "if the parent RxDataSubmission.status == OPEN it auto-advances to ASSEMBLING (bubble-up)"
          - "VendorDataPackage.version increments by 1"
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /compliance/vendor-data-packages/{id}/validate"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECEIVED"
          - "PlanYear.compliance_posture != FROZEN"
          - "record_count >= 1"
        side_effects:
          - "validated_at = logical clock"
          - "RxDataSubmission.assembled_record_count increases by this package's record_count (ledger sync of the conserved record-count quantity)"
          - "VendorDataPackage.version increments by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /compliance/vendor-data-packages/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECEIVED"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "rejection_reason stored; VendorDataPackage.version increments by 1"
          - "assembled_record_count is unchanged because a RECEIVED package was never counted"
      - from: VALIDATED
        to: REJECTED
        trigger: "POST /compliance/vendor-data-packages/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "status == VALIDATED"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "CASCADE-B link 1: rejection_reason stored, status = REJECTED, VendorDataPackage.version increments by 1"
          - "CASCADE-B link 2: because a VALIDATED package left the validated set, RxDataSubmission.assembled_record_count decreases by this package's record_count (compensating action on the conserved record-count quantity)"
          - "CASCADE-B link 3+4: the decrement leaves the parent submission without a fully validated package set, so a RECONCILED submission demotes to ASSEMBLING, which nulls its reconciliation totals and (past the RxDC deadline) posts the RXDC_LATE accrual chain described on RxDataSubmission RECONCILED → ASSEMBLING"
      - from: REJECTED
        to: RECEIVED
        trigger: "POST /compliance/vendor-data-packages/{id}/resubmit"
        actor: VendorContact
        preconditions:
          - "status == REJECTED"
          - "X-User-ID == VendorDataPackage.vendor_id"
          - "PlanYear.compliance_posture != FROZEN"
          - "the vendor's contract for the submission's plan year still has data_rights_status == SECURED"
        side_effects:
          - "record_count, plan_paid_cents, member_paid_cents, rebate_cents replaced from the request; delivery_round increments by 1; rejection_reason cleared"
          - "VendorDataPackage.version increments by 1"
        note: "Cycle edge: RECEIVED → REJECTED → RECEIVED may repeat without bound."

  - entity: Attestation
    initial_state: DRAFT
    terminal_states: [ACCEPTED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance/attestations/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "PlanYear.lifecycle_status == ACTIVE"
          - "PlanYear.compliance_posture IN {COMPLIANT, AT_RISK}"
          - "every ServiceProviderContract of the plan year with contract_type IN {TPA, PBM, BROKER, CONSULTANT} has gag_review_status == COMPLIANT"
          - "contract_terms_doc_count >= 1"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
        side_effects:
          - "submitted_by_user_id = X-User-ID; submitted_at = logical clock; signature_statement stored"
          - "PlanYear.attestation_status = SUBMITTED; PlanYear.version increments by 1"
          - "Attestation.version increments by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance/attestations/{id}/accept"
        actor: ExternalAuditor
        preconditions:
          - "status == SUBMITTED"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "PlanYear.attestation_status = ACCEPTED"
          - "PlanYear.deficiency_points recomputed: the ATTESTATION_LATE deficiency closes (this branch posts NO ledger entry)"
          - "Attestation.version and PlanYear.version each increment by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance/attestations/{id}/reject"
        actor: ExternalAuditor
        preconditions:
          - "status == SUBMITTED"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "rejection_reason stored; PlanYear.attestation_status = REJECTED"
          - "a PenaltyLedgerEntry { entry_type: ACCRUAL, deficiency_type: ATTESTATION_LATE, onset_date: logical clock date } is posted per calculations.penalty_accrual_posting — the divergent side effect versus the ACCEPTED branch"
          - "PlanYear.penalty_exposure_cents, deficiency_points (+5) and compliance_posture recomputed"
          - "Attestation.version and PlanYear.version each increment by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /compliance/attestations/{id}/revise"
        actor: ComplianceOfficer
        preconditions:
          - "status == REJECTED"
          - "PlanYear.compliance_posture != FROZEN"
        side_effects:
          - "contract_terms_doc_count replaced from the request; revision_round increments by 1; rejection_reason cleared; submitted_by_user_id and submitted_at reset to null"
          - "prepared_by_user_id is REPLACED with the revising officer's X-User-ID, so segregation of duties is re-evaluated against the reviser on the next submit"
          - "PlanYear.attestation_status = DRAFT; PlanYear.version increments by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system — PlanYear.compliance_posture flips to DEFICIENT or FROZEN, or a newer Attestation is created for the same plan year"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "void_reason = POSTURE_DEFICIENT or SUPERSEDED_BY_NEWER_DRAFT; Attestation.version increments by 1"
          - "PlanYear.attestation_status refreshed from the latest Attestation by created_at"

  - entity: RemediationPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /compliance/remediation-plans/{id}/complete"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
          - "completed_milestone_count == milestone_count"
          - "at least one unreversed PenaltyLedgerEntry with entry_type == ACCRUAL and deficiency_type == target_deficiency_type exists for the plan year"
        side_effects:
          - "abatement_posted_cents = calculations.remediation_abatement_amount; completed_at = logical clock"
          - "one PenaltyLedgerEntry { entry_type: ABATEMENT, deficiency_type: target_deficiency_type, signed_amount_cents: -abatement_posted_cents, remediation_plan_id: this plan id, daily_rate_cents: 0, days_open: 0, size_multiplier: 1.0, onset_date: null } is posted"
          - "PlanYear.penalty_exposure_cents recomputed from the ledger; deficiency_points are NOT reduced (abatement moves money, not deficiency state)"
          - "RemediationPlan.version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
#
# VERSION SEMANTICS: an entity's `version` increments by exactly 1 per mutation that
# CHANGES at least one stored field. A recomputation that leaves every stored field
# equal (e.g. a posture recompute that yields the same posture and the same points)
# is not a mutation and does NOT increment `version`. Clients therefore read the
# parent immediately before a create that carries expected_<parent>_version.
# =============================================================================
concurrency_rules:
  - rule_id: attestation-create-stale-plan-year
    parent_entity: PlanYear
    write_endpoint: "POST /compliance/attestations"
    occ_field: "expected_plan_year_version"
    description: |
      Creating an Attestation against a PlanYear whose version has advanced since
      the client last observed it is rejected. A new DRAFT attestation legitimately
      supersedes the prior DRAFT for the same plan year (voiding it), so the create
      cannot be rejected on state grounds; the stale-version check is what stops a
      writer from superseding a draft it never saw, and from attesting against a
      posture snapshot that has since changed.
    error_id: ERR_STALE_PLAN_YEAR_VERSION
    http_status: 412

  - rule_id: amendment-create-stale-contract
    parent_entity: ServiceProviderContract
    write_endpoint: "POST /compliance/contract-amendments"
    occ_field: "expected_contract_version"
    description: |
      Creating a ContractAmendment against a ServiceProviderContract whose version
      has advanced since the client last observed it is rejected. A new amendment of
      the same amendment_type legitimately supersedes the prior open one (withdrawing
      it), so the create is state-legal; the stale-version check stops a writer from
      withdrawing a negotiation round it never observed, and from proposing terms
      against a data_rights_status or gag_review_status that has since moved.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Table
# All money is integer cents. All rounding is ROUND_HALF_UP (away from zero on a
# tie). Every ordering below is PINNED: an implementation that applies the same
# operations in a different order produces a different, wrong number.
# =============================================================================
calculations:
  - name: penalty_accrual_posting
    entity: PenaltyLedgerEntry
    trigger: "system — whenever a deficiency opens (gag escalation, missed refresh cycle, tool SLA breach onset, RxDC lateness, attestation rejection)"
    inputs:
      - "deficiency_type of the opening deficiency"
      - "onset_date (ISO date) of the deficiency"
      - "logical clock date at posting time"
      - "PlanYear.covered_lives"
    constants:
      DAILY_RATE_CENTS: "{ MRF_REFRESH: 10000, TOOL_SLA: 5000, RXDC_LATE: 20000, GAG_CLAUSE: 15000, ATTESTATION_LATE: 12000 }"
      SIZE_MULTIPLIER_TIERS: "covered_lives < 500 -> 1.0 ; 500 <= covered_lives <= 4999 -> 1.5 ; covered_lives >= 5000 -> 2.0"
      PENALTY_CAP_CENTS: 100000000
    formula: |
      daily_rate_cents = DAILY_RATE_CENTS[deficiency_type]
      size_multiplier  = tier(PlanYear.covered_lives)
      days_open        = (clock_date - onset_date).days + 1     # INCLUSIVE of both endpoints
      raw_cents        = daily_rate_cents * days_open
      signed_amount_cents = min(round_half_up(raw_cents * size_multiplier), PENALTY_CAP_CENTS)
    output_fields: "PenaltyLedgerEntry.{signed_amount_cents, daily_rate_cents, days_open, size_multiplier, onset_date}"
    precision: "days_open is an inclusive whole-day count; the multiplier is applied to the raw integer product exactly once, then rounded half-up to whole cents."
    duplicate_suppression: "No second ACCRUAL is posted for a deficiency instance that already has an unreversed ACCRUAL of the same deficiency_type and onset_date on the same plan year. An ACCRUAL is 'reversed' iff some PenaltyLedgerEntry exists whose reverses_entry_id equals its id."
    worked_example: "GAG_CLAUSE, onset_date == clock date, covered_lives 6000 -> 15000 * 1 * 2.0 = 30000 cents."

  - name: penalty_exposure_projection
    entity: PlanYear
    trigger: "GET /compliance/plan-years/{id}/penalty-projection"
    forward_looking: true
    inputs:
      - "as_of_date (optional ISO date input; defaults to the logical clock date)"
      - "the OPEN deficiency set derived from live child state (NOT from the ledger)"
      - "PlanYear.covered_lives, PlanYear.end_date"
    open_deficiency_derivation: |
      GAG_CLAUSE       : one per ServiceProviderContract of the plan year with gag_review_status == NON_COMPLIANT;
                         onset = ServiceProviderContract.gag_non_compliant_since
      MRF_REFRESH      : one per RefreshCycle of the plan year with status == MISSED;
                         onset = date(deadline_at) + 1 day
      TOOL_SLA         : one per PriceComparisonTool of the plan year with sla_breach_open == true;
                         onset = PriceComparisonTool.breach_onset_date
      RXDC_LATE        : one per RxDataSubmission of the plan year with status != SUBMITTED, counted only when
                         as_of_date > PlanYear.rxdc_deadline_date; onset = rxdc_deadline_date + 1 day
      ATTESTATION_LATE : one per plan year when attestation_status != ACCEPTED, counted only when
                         as_of_date > PlanYear.attestation_deadline_date; onset = attestation_deadline_date + 1 day
      A deficiency whose onset is after as_of_date is excluded from both variants.
    constants:
      DAILY_RATE_CENTS: "same map as penalty_accrual_posting"
      SIZE_MULTIPLIER_TIERS: "same tiers as penalty_accrual_posting"
      PENALTY_CAP_CENTS: 100000000
    formula: |
      # PINNED ORDER (sum-then-multiply-then-round-then-cap). Per-deficiency rounding is WRONG.
      raw_accrued  = SUM over open deficiencies of ( DAILY_RATE_CENTS[type] * ((as_of_date - onset).days + 1) )
      raw_statutory= SUM over open deficiencies of ( DAILY_RATE_CENTS[type] * ((PlanYear.end_date - onset).days + 1) )
      accrued_to_date_cents   = min(round_half_up(raw_accrued   * size_multiplier), PENALTY_CAP_CENTS)
      statutory_maximum_cents = min(round_half_up(raw_statutory * size_multiplier), PENALTY_CAP_CENTS)
      open_deficiency_count   = count of open deficiencies included above
    variants:
      accrued_to_date: "Day count runs onset .. as_of_date inclusive — what is owed today."
      statutory_maximum: "Day count runs onset .. PlanYear.end_date inclusive, i.e. every open deficiency is assumed to stay open through the end of the plan year — the ceiling used for remediation prioritisation."
    variant_selection: "Both variants are always returned in the same response object; the caller does not choose. The two differ ONLY in the day-count endpoint, so a scaffold that reuses one number for both is detectable."
    precision: "Both variants round half-up to whole cents after the single multiplier application, then clamp at PENALTY_CAP_CENTS."
    output_fields: "inline projection object { statutory_maximum_cents, accrued_to_date_cents, open_deficiency_count, size_multiplier }"
    note: "The projection is derived from LIVE open child state, never from the ledger, so it deliberately disagrees with PlanYear.penalty_exposure_cents: a deficiency open for 11 days projects 11 days of exposure while the ledger still holds the single 1-day accrual posted when it opened. A REJECTED attestation before attestation_deadline_date contributes deficiency POINTS (see plan_year_compliance_posture) but no projected ATTESTATION_LATE deficiency; its posted ACCRUAL still counts in penalty_exposure_cents."
    worked_example: "One GAG_CLAUSE deficiency, onset 2027-07-10, as_of_date 2027-07-20, PlanYear.end_date 2027-12-31, covered_lives 6000 (multiplier 2.0): accrued = 15000 * 11 * 2.0 = 330000; statutory = 15000 * 175 * 2.0 = 5250000."

  - name: compensation_reasonableness_score
    entity: CompensationDisclosure
    trigger: "POST /compliance/compensation-disclosures/{id}/assess"
    inputs:
      - "CompensationDisclosure.{direct_comp_cents, indirect_comp_cents, benchmark_median_cents, services_scope_score, disclosure_completeness_score}"
      - "ServiceProviderContract.contract_type of the disclosure's contract (variant selector)"
    constants:
      W_PRICE: 40
      W_SCOPE: 25
      W_DISCLOSURE: 35
      RATIO_CAP: 3.0
      UNREASONABLE_THRESHOLD: 55.00
    variants:
      TOTAL_WITH_INDIRECT: "Applied when the contract_type == BROKER. compensation_base_cents = direct_comp_cents + indirect_comp_cents (brokers are judged on all-in remuneration, including carrier-paid overrides)."
      DIRECT_ONLY: "Applied when the contract_type == CONSULTANT. compensation_base_cents = direct_comp_cents (indirect_comp_cents is disclosed and stored but deliberately excluded from the reasonableness base)."
    variant_selection: "Selected exclusively by the parent ServiceProviderContract.contract_type; no other contract_type can reach this calculation because compensation_disclosure_required is false for TPA, PBM and NETWORK_VENDOR contracts."
    formula: |
      compensation_base_cents = variant(contract_type)
      price_ratio = compensation_base_cents / benchmark_median_cents        # exact rational, NOT pre-rounded
      component_price_score      = round_half_up(W_PRICE      * min(price_ratio, RATIO_CAP), 2)
      component_scope_score      = round_half_up(W_SCOPE      * (5 - services_scope_score) / 3, 2)
      component_disclosure_score = round_half_up(W_DISCLOSURE * (5 - disclosure_completeness_score) / 3, 2)
      # PINNED ORDER (mode b): each component is rounded to 2 decimals FIRST, then the three
      # rounded components are added. Summing exact components and rounding once at the end
      # (mode a) yields a different stored score.
      unreasonableness_score = component_price_score + component_scope_score + component_disclosure_score
      status = UNREASONABLE if unreasonableness_score >= UNREASONABLE_THRESHOLD else REASONABLE
    precision: "Two decimal places, ROUND_HALF_UP, applied per component. The threshold comparison is inclusive: exactly 55.00 is UNREASONABLE."
    output_fields: "CompensationDisclosure.{variant_applied, component_price_score, component_scope_score, component_disclosure_score, unreasonableness_score, status, assessed_at, assessed_by_user_id}"
    worked_examples:
      - "BROKER, direct 1000000, indirect 400000, benchmark 1000000, scope 5, completeness 4 -> base 1400000, ratio 1.4 -> 56.00 + 0.00 + 11.67 = 67.67 -> UNREASONABLE"
      - "CONSULTANT, same numbers -> base 1000000, ratio 1.0 -> 40.00 + 0.00 + 11.67 = 51.67 -> REASONABLE"
      - "CONSULTANT, direct 875000, benchmark 1000000, scope 4, completeness 4 -> 35.00 + 8.33 + 11.67 = 55.00 -> UNREASONABLE (inclusive boundary)"
      - "CONSULTANT, direct 541600, benchmark 1000000, scope 4, completeness 2 -> 21.66 + 8.33 + 35.00 = 64.99 under the pinned per-component rounding; the unpinned sum-then-round order would store 65.00"

  - name: tool_monthly_uptime
    entity: PriceComparisonTool
    trigger: "POST /compliance/price-comparison-tools/{id}/evaluations"
    inputs:
      - "evaluation_month (input, YYYY-MM) — must be strictly before the logical clock month"
      - "PriceComparisonTool.outage_windows (append-only embedded array of { window_start, window_end, cause })"
      - "PriceComparisonTool.sla_target_uptime_pct"
    constants:
      MINUTES_PER_DAY: 1440
      INTERVAL_SEMANTICS: "each outage window is HALF-OPEN [window_start, window_end); a window ending exactly when the next begins is contiguous downtime and the two MERGE into one interval"
    formula: |
      month_start   = first instant of evaluation_month (UTC)
      month_end     = first instant of the following month (UTC)                     # exclusive
      month_minutes = days_in(evaluation_month) * MINUTES_PER_DAY
      # 1. clip every window to [month_start, month_end); discard empty results
      # 2. sort the clipped windows by window_start ASC, then window_end ASC
      # 3. merge windows that overlap OR touch (next.window_start <= current.window_end)
      # 4. downtime_minutes = SUM of merged interval lengths, in whole minutes
      last_uptime_pct = round_half_up(100 * (month_minutes - downtime_minutes) / month_minutes, 2)
      sla_breach_open = last_uptime_pct < sla_target_uptime_pct                       # STRICTLY less than
      breach_onset_date = first day of the month AFTER evaluation_month (set only when a breach opens)
    precision: "Uptime percent carries exactly two decimals, ROUND_HALF_UP. The comparison is strict: last_uptime_pct exactly equal to sla_target_uptime_pct is compliant."
    side_effects: |
      When sla_breach_open flips false -> true: breach_onset_date is set and a PenaltyLedgerEntry
      { entry_type: ACCRUAL, deficiency_type: TOOL_SLA, onset_date: breach_onset_date } is posted per
      penalty_accrual_posting; PlanYear.tool_sla_breach_count, deficiency_points, penalty_exposure_cents
      and compliance_posture are recomputed. When a later evaluation is compliant, sla_breach_open flips
      back to false, breach_onset_date is cleared and the deficiency closes (the posted ACCRUAL stays —
      only an explicit reversal or an abatement moves money).
    output_fields: "PriceComparisonTool.{last_evaluated_month, last_uptime_pct, last_downtime_minutes, sla_breach_open, breach_onset_date}"
    worked_examples:
      - "evaluation_month 2027-06 (30 days, 43200 minutes), sla_target_uptime_pct 99.00, single window of 432 minutes -> 100 * 42768 / 43200 = 99.00 exactly -> sla_breach_open false"
      - "same month, single window of 435 minutes -> 100 * 42765 / 43200 = 98.9930... -> 98.99 -> sla_breach_open true"
      - "two windows 2027-06-10T00:00:00Z..2027-06-10T03:00:00Z and 2027-06-10T03:00:00Z..2027-06-10T04:12:00Z touch and merge into 252 minutes of downtime (not two separately-counted intervals)"

  - name: rxdc_reconciliation_totals
    entity: RxDataSubmission
    trigger: "POST /compliance/rx-data-submissions/{id}/reconcile"
    inputs:
      - "the VendorDataPackage set of this submission, filtered to status == VALIDATED, ordered created_at ASC"
      - "per package: plan_paid_cents, member_paid_cents, rebate_cents, record_count"
    constants:
      REBATE_CAP_TIERS: "gross_spend_cents < 10000000 -> 0.25 ; 10000000 <= gross_spend_cents < 100000000 -> 0.20 ; gross_spend_cents >= 100000000 -> 0.15"
    input_set_filtering: "Only VALIDATED packages contribute. EXPECTED, RECEIVED and REJECTED packages are excluded from every total, including gross spend and reported rebates."
    formula: |
      gross_spend_cents     = SUM(plan_paid_cents) + SUM(member_paid_cents)   over VALIDATED packages
      rebate_reported_cents = SUM(rebate_cents)                              over VALIDATED packages
      # PINNED ORDER (mode c): the cap tier is keyed on GROSS spend, evaluated BEFORE any rebate
      # deduction. Selecting the tier from a rebate-net figure picks a different tier and a
      # different credit.
      rebate_cap_pct        = tier(gross_spend_cents)
      rebate_credit_cents   = min(rebate_reported_cents, round_half_up(rebate_cap_pct * gross_spend_cents))
      net_plan_spend_cents  = gross_spend_cents - rebate_credit_cents
      assembled_record_count = SUM(record_count) over VALIDATED packages   # conserved quantity, maintained incrementally
    precision: "The capped rebate is rounded half-up to whole cents before the min() comparison; all other totals are exact integer sums."
    output_fields: "RxDataSubmission.{gross_spend_cents, rebate_reported_cents, rebate_cap_pct, rebate_credit_cents, net_plan_spend_cents, reconciled_at}"
    worked_example: "Package A (plan 6000000, member 1000000, rebate 1500000, records 1200) and package B (plan 2500000, member 500000, rebate 900000, records 800), both VALIDATED -> gross 10000000, reported 2400000, tier 0.20, credit min(2400000, 2000000) = 2000000, net 8000000, assembled_record_count 2000."

  - name: plan_year_compliance_posture
    entity: PlanYear
    trigger: "system — after every mutation that opens or closes a deficiency, and on every compliance run"
    inputs:
      - "RefreshCycle rows of the plan year (status MISSED / LATE_CERTIFIED)"
      - "ServiceProviderContract rows of the plan year (gag_review_status NON_COMPLIANT)"
      - "PriceComparisonTool rows of the plan year (sla_breach_open)"
      - "RxDataSubmission rows of the plan year (status != SUBMITTED past the RxDC deadline)"
      - "PlanYear.attestation_status past the attestation deadline"
      - "CompensationDisclosure rows reachable through the plan year's contracts (status UNREASONABLE)"
      - "PlanYear.freeze_flag"
    constants:
      POINTS_MISSED_REFRESH_CYCLE: 3
      POINTS_LATE_CERTIFIED_CYCLE: 2
      POINTS_NON_COMPLIANT_CONTRACT: 6
      POINTS_TOOL_SLA_BREACH: 2
      POINTS_RXDC_LATE: 5
      POINTS_ATTESTATION_LATE: 5
      POINTS_UNREASONABLE_DISCLOSURE: 3
      DEFICIENT_POINT_THRESHOLD: 6
      FROZEN_POINT_THRESHOLD: 12
    formula: |
      deficiency_points =
          POINTS_MISSED_REFRESH_CYCLE     * count(RefreshCycle.status == MISSED)
        + POINTS_LATE_CERTIFIED_CYCLE     * count(RefreshCycle.status == LATE_CERTIFIED)
        + POINTS_NON_COMPLIANT_CONTRACT   * count(ServiceProviderContract.gag_review_status == NON_COMPLIANT)
        + POINTS_TOOL_SLA_BREACH          * count(PriceComparisonTool.sla_breach_open == true)
        + POINTS_RXDC_LATE                * count(RxDataSubmission.status != SUBMITTED and clock_date > rxdc_deadline_date)
        + POINTS_ATTESTATION_LATE         * (1 if attestation_status == REJECTED or (attestation_status != ACCEPTED and clock_date > attestation_deadline_date) else 0)
        + POINTS_UNREASONABLE_DISCLOSURE  * count(CompensationDisclosure.status == UNREASONABLE)

      compliance_posture =
          FROZEN     if freeze_flag == true or deficiency_points >= FROZEN_POINT_THRESHOLD
        else DEFICIENT if deficiency_points >= DEFICIENT_POINT_THRESHOLD
        else AT_RISK   if deficiency_points >= 1
        else COMPLIANT
    precision: "Integer point arithmetic; both threshold comparisons are inclusive (exactly 6 points is DEFICIENT, exactly 12 is FROZEN)."
    output_fields: "PlanYear.{deficiency_points, compliance_posture, tool_sla_breach_count}"
    note: "Money (penalty_exposure_cents) and deficiency state (deficiency_points) are independent axes: an ABATEMENT lowers exposure without lowering points, and closing a deficiency lowers points without lowering exposure."

  - name: penalty_ledger_balance
    entity: PlanYear
    trigger: "system — after every PenaltyLedgerEntry insert"
    inputs:
      - "every PenaltyLedgerEntry with plan_year_id == this PlanYear.id (the ledger is append-only and immutable)"
    formula: |
      penalty_exposure_cents = SUM(signed_amount_cents) over ALL entries of the plan year
      # ACCRUAL entries carry signed_amount_cents > 0; ABATEMENT entries and reversal entries
      # carry signed_amount_cents < 0. No entry is ever updated or deleted, so this sum is the
      # single source of truth for exposure.
    invariant: "PlanYear.penalty_exposure_cents == SUM(PenaltyLedgerEntry.signed_amount_cents) at every observable instant. A reversal must be a NEW compensating entry of -original; flipping a status on the original would double-count."
    precision: "Exact integer cents; no rounding."
    output_fields: "PlanYear.penalty_exposure_cents"

  - name: remediation_abatement_amount
    entity: RemediationPlan
    trigger: "POST /compliance/remediation-plans/{id}/complete"
    inputs:
      - "RemediationPlan.target_deficiency_type"
      - "the unreversed ACCRUAL entries of the plan year whose deficiency_type == target_deficiency_type"
    constants:
      ABATEMENT_PCT: 0.50
    input_set_filtering: "An ACCRUAL is excluded when some PenaltyLedgerEntry exists whose reverses_entry_id equals its id. ABATEMENT entries never contribute to the base."
    formula: |
      accrual_base_cents      = SUM(signed_amount_cents) over unreversed ACCRUAL entries of the target type
      abatement_posted_cents  = round_half_up(ABATEMENT_PCT * accrual_base_cents)
      # a single ABATEMENT entry of signed_amount_cents = -abatement_posted_cents is appended
    precision: "Rounded half-up to whole cents after the single multiplication."
    output_fields: "RemediationPlan.{abatement_posted_cents, completed_at, status}; one new PenaltyLedgerEntry"
    worked_example: "One unreversed GAG_CLAUSE accrual of 30000 -> abatement 15000, ledger balance 30000 - 15000 = 15000."

  - name: refresh_cycle_outcome
    entity: RefreshCycle
    trigger: "POST /compliance/refresh-cycles/{id} (create, deadline derivation) and POST /compliance/refresh-cycles/{id}/certify (outcome selection)"
    inputs:
      - "RefreshCycle.{period_start, period_end}"
      - "logical clock instant at certification"
    constants:
      GRACE_DAYS: 5
      INTERVAL_SEMANTICS: "the refresh period is a CLOSED interval [period_start, period_end]; two cycles of the same plan year overlap when period_start_A <= period_end_B AND period_start_B <= period_end_A, so periods that share a single boundary day DO collide"
    formula: |
      deadline_at = (period_end + GRACE_DAYS days) at 23:59:59.999Z
      outcome     = CERTIFIED      if clock <= deadline_at
                  = LATE_CERTIFIED if clock >  deadline_at
      # a cycle never certified is swept to MISSED by the compliance run once clock > deadline_at
    precision: "Millisecond comparison against an inclusive deadline: certifying at exactly deadline_at is CERTIFIED; one millisecond later is LATE_CERTIFIED."
    output_fields: "RefreshCycle.{deadline_at, status, certified_at, certified_by_user_id, on_time}"
    worked_example: "period_end 2027-06-30 -> deadline_at 2027-07-05T23:59:59.999Z. Certifying at 2027-07-05T23:59:59.999Z -> CERTIFIED, on_time true; certifying at 2027-07-06T00:00:00.000Z -> LATE_CERTIFIED, on_time false, +2 deficiency points."

# =============================================================================
# §1.4 Validation Table — evaluated in strict `priority` order. The FIRST rule
# that fails determines the response; no later rule may pre-empt an earlier one.
# =============================================================================
validations:
  - priority: 1
    category: authentication
    rule: "X-User-ID header must be present and non-empty on every endpoint."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: authorization_role
    rule: "X-Role header must be present and must be one of the roles listed for the endpoint in §1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: path_existence
    rule: "Every {id} path parameter must resolve to an existing row of the addressed entity."
    error_id: "entity-specific 404 (ERR_PLAN_YEAR_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_AMENDMENT_NOT_FOUND, ERR_DISCLOSURE_NOT_FOUND, ERR_MRF_NOT_FOUND, ERR_REFRESH_CYCLE_NOT_FOUND, ERR_TOOL_NOT_FOUND, ERR_RX_SUBMISSION_NOT_FOUND, ERR_PACKAGE_NOT_FOUND, ERR_ATTESTATION_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND, ERR_REMEDIATION_PLAN_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints carrying a path {id}"

  - priority: 4
    category: schema
    rule: "Request body must contain every required field with the declared type; enum fields must carry a listed member; integer money fields must be integers; date fields must be ISO YYYY-MM-DD; datetime fields must be ISO 8601 with a Z offset; month fields must match ^\\d{4}-(0[1-9]|1[0-2])$."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: pagination
    rule: "limit must be an integer in [1, 100]; offset must be an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 6
    category: referential_integrity
    rule: "Every FK supplied in a request body must resolve to an existing row (plan_year_id, vendor_id, contract_id, rx_submission_id, ledger entry id, remediation plan id)."
    error_id: "entity-specific 404 as in priority 3"
    http_status: 404
    applies_to: "all create endpoints and filtered list endpoints that filter on a FK"

  - priority: 7
    category: authorization_scope
    rule: "A VendorContact may act only on rows whose owning vendor_id equals the caller's X-User-ID (contract remediation submission, amendment counter, package deliver/resubmit). Cross-vendor access is refused even though the role itself is permitted on the endpoint."
    error_id: ERR_VENDOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /compliance/contracts/{id}/submit-remediation, POST /compliance/contract-amendments/{id}/counter, POST /compliance/vendor-data-packages/{id}/deliver, POST /compliance/vendor-data-packages/{id}/resubmit"

  - priority: 8
    category: concurrency
    rule: "When the endpoint declares an expected_<parent>_version input, the supplied value must equal the parent's current version."
    error_id: "ERR_STALE_PLAN_YEAR_VERSION | ERR_STALE_CONTRACT_VERSION"
    http_status: 412
    applies_to: "POST /compliance/attestations, POST /compliance/contract-amendments"

  - priority: 9
    category: business_safety
    rule: "When the owning PlanYear.compliance_posture == FROZEN, every mutating child endpoint of that plan year is refused. Exempt: POST /compliance/plan-years/{id}/unfreeze, POST /compliance/penalty-ledger-entries/{id}/reverse, POST /compliance/remediation-plans, POST /compliance/remediation-plans/{id}/milestone-completions, POST /compliance/remediation-plans/{id}/complete."
    error_id: ERR_PLAN_YEAR_FROZEN
    http_status: 409
    applies_to: "all mutating endpoints scoped to a plan year except the listed exemptions"

  - priority: 10
    category: state
    rule: "The addressed entity must be in a state from which the requested transition is declared in §1.2 (including the parent PlanYear.lifecycle_status precondition where declared)."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 11
    category: business_safety
    rule: "An Attestation may not be submitted while PlanYear.compliance_posture is DEFICIENT (FROZEN is already refused at priority 9). This safety gate outranks the segregation-of-duties check, so a deficient plan year returns the posture error even when the submitter is also the preparer."
    error_id: ERR_POSTURE_BLOCKS_ATTESTATION
    http_status: 409
    applies_to: "POST /compliance/attestations/{id}/submit"

  - priority: 12
    category: authorization_sod
    rule: "The X-User-ID submitting an Attestation must differ from Attestation.prepared_by_user_id; the ExternalAuditor accepting or rejecting it must differ from both prepared_by_user_id and submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /compliance/attestations/{id}/submit, POST /compliance/attestations/{id}/accept, POST /compliance/attestations/{id}/reject"

  - priority: 13
    category: business_constraint
    rule: "An Attestation may not be submitted while any ServiceProviderContract of the plan year with contract_type IN {TPA, PBM, BROKER, CONSULTANT} has gag_review_status != COMPLIANT."
    error_id: ERR_GAG_CLAUSES_OUTSTANDING
    http_status: 409
    applies_to: "POST /compliance/attestations/{id}/submit"

  - priority: 14
    category: business_constraint
    rule: "An Attestation may not be submitted with contract_terms_doc_count < 1."
    error_id: ERR_CONTRACT_TERMS_DOC_REQUIRED
    http_status: 422
    applies_to: "POST /compliance/attestations/{id}/submit, POST /compliance/attestations/{id}/revise"

  - priority: 15
    category: cross_entity_state
    rule: "A RefreshCycle may not be certified unless a MachineReadableFile with status == PUBLISHED exists for the same plan_year_id and posting_month == period_month for EACH of file_type IN_NETWORK_RATES and ALLOWED_AMOUNTS."
    error_id: ERR_MRF_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /compliance/refresh-cycles/{id}/certify"

  - priority: 16
    category: cross_entity_state
    rule: "A VendorDataPackage may not be delivered or resubmitted unless a ServiceProviderContract exists for the submission's plan_year_id and the package's vendor_id with data_rights_status == SECURED."
    error_id: ERR_DATA_RIGHTS_NOT_SECURED
    http_status: 409
    applies_to: "POST /compliance/vendor-data-packages/{id}/deliver, POST /compliance/vendor-data-packages/{id}/resubmit"

  - priority: 17
    category: cross_entity_state
    rule: "An RxDataSubmission may not be reconciled or submitted unless it has at least one VendorDataPackage and every one of them has status == VALIDATED."
    error_id: ERR_PACKAGES_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /compliance/rx-data-submissions/{id}/reconcile, POST /compliance/rx-data-submissions/{id}/submit"

  - priority: 18
    category: cross_entity_state
    rule: "A PlanYear may not be activated unless at least one ServiceProviderContract with contract_type == TPA exists for it."
    error_id: ERR_TPA_CONTRACT_REQUIRED
    http_status: 409
    applies_to: "POST /compliance/plan-years/{id}/activate"

  - priority: 19
    category: business_temporal
    rule: "Interval inputs must be well formed: PlanYear.end_date > start_date; ServiceProviderContract.term_end > term_start; RefreshCycle.period_end >= period_start and both must fall inside [PlanYear.start_date, PlanYear.end_date]; an outage window's window_end must be strictly after window_start; ContractAmendment.expires_at must be strictly after the logical clock."
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /compliance/plan-years, POST /compliance/contracts, POST /compliance/refresh-cycles, POST /compliance/price-comparison-tools/{id}/outage-windows, POST /compliance/contract-amendments"

  - priority: 20
    category: business_temporal
    rule: "A RefreshCycle period must not overlap another RefreshCycle of the same plan year. Periods are CLOSED intervals, so sharing a single boundary day is an overlap."
    error_id: ERR_REFRESH_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /compliance/refresh-cycles"

  - priority: 21
    category: business_constraint
    rule: "An outage window must not overlap an existing outage window of the same tool. Windows are HALF-OPEN, so a window starting exactly when another ends is accepted. This constraint is evaluated only after priority 19 has accepted the window's own shape, so an inverted-and-overlapping window returns ERR_INVALID_INTERVAL."
    error_id: ERR_OUTAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /compliance/price-comparison-tools/{id}/outage-windows"

  - priority: 22
    category: business_temporal
    rule: "An outage window must lie entirely at or before the logical clock (window_end <= clock) and at or after PriceComparisonTool.launched_at."
    error_id: ERR_OUTAGE_WINDOW_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /compliance/price-comparison-tools/{id}/outage-windows"

  - priority: 23
    category: business_temporal
    rule: "An evaluation_month must be strictly before the logical clock's month (a month still in progress cannot be scored), and must not precede the month of PriceComparisonTool.launched_at."
    error_id: ERR_EVALUATION_MONTH_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /compliance/price-comparison-tools/{id}/evaluations"

  - priority: 24
    category: business_temporal
    rule: "A PlanYear may not be closed for reporting until the logical clock date is strictly after PlanYear.end_date."
    error_id: ERR_REPORTING_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /compliance/plan-years/{id}/close-reporting"

  - priority: 25
    category: business_temporal
    rule: "A ContractAmendment action is refused once the logical clock is past its expires_at, even while the amendment is still recorded as PROPOSED or COUNTERED (the compliance run has not yet swept it to LAPSED). This temporal rule outranks the round-exhaustion constraint at priority 27."
    error_id: ERR_AMENDMENT_EXPIRED
    http_status: 409
    applies_to: "POST /compliance/contract-amendments/{id}/counter, POST /compliance/contract-amendments/{id}/revise-proposal, POST /compliance/contract-amendments/{id}/execute"

  - priority: 26
    category: business_constraint
    rule: "A DATA_RIGHTS amendment may not be executed with data_rights_granted == false — the amendment's whole purpose is to grant data rights."
    error_id: ERR_DATA_RIGHTS_NOT_GRANTED
    http_status: 422
    applies_to: "POST /compliance/contract-amendments/{id}/execute"

  - priority: 27
    category: business_constraint
    rule: "A proposal may not be revised once round == MAX_NEGOTIATION_ROUNDS (3)."
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /compliance/contract-amendments/{id}/revise-proposal"

  - priority: 28
    category: business_constraint
    rule: "Gag remediation may not be requested once remediation_round == MAX_REMEDIATION_ROUNDS (2); the contract must be cleared or escalated instead."
    error_id: ERR_REMEDIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /compliance/contracts/{id}/request-remediation"

  - priority: 29
    category: business_constraint
    rule: "A gag review may not be cleared while prohibited_clause_count >= 1, and may not be escalated while prohibited_clause_count == 0."
    error_id: ERR_PROHIBITED_CLAUSES_PRESENT
    http_status: 409
    applies_to: "POST /compliance/contracts/{id}/clear-gag, POST /compliance/contracts/{id}/escalate-gag"

  - priority: 30
    category: business_constraint
    rule: "A PriceComparisonTool may not be launched with covered_items_count < REQUIRED_COVERED_ITEMS (500)."
    error_id: ERR_COVERED_ITEMS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /compliance/price-comparison-tools/{id}/launch"

  - priority: 31
    category: business_constraint
    rule: "A CompensationDisclosure may only be created against a ServiceProviderContract whose compensation_disclosure_required == true (contract_type IN {BROKER, CONSULTANT})."
    error_id: ERR_DISCLOSURE_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /compliance/compensation-disclosures"

  - priority: 32
    category: business_constraint
    rule: "benchmark_median_cents must be >= 1 (it is a divisor); services_scope_score and disclosure_completeness_score must be integers in [1, 5]; direct_comp_cents and indirect_comp_cents must be >= 0."
    error_id: ERR_INVALID_BENCHMARK
    http_status: 422
    applies_to: "POST /compliance/compensation-disclosures"

  - priority: 33
    category: business_constraint
    rule: "A VendorDataPackage delivery or resubmission must carry record_count >= 1 and monetary fields >= 0; validation additionally requires record_count >= 1."
    error_id: ERR_INVALID_PACKAGE_TOTALS
    http_status: 422
    applies_to: "POST /compliance/vendor-data-packages/{id}/deliver, POST /compliance/vendor-data-packages/{id}/resubmit, POST /compliance/vendor-data-packages/{id}/validate"

  - priority: 34
    category: business_fiscal
    rule: "Only an ACCRUAL entry may be reversed; an ABATEMENT entry or an entry that is itself a reversal is not reversible."
    error_id: ERR_NOT_REVERSIBLE_ENTRY
    http_status: 409
    applies_to: "POST /compliance/penalty-ledger-entries/{id}/reverse"

  - priority: 35
    category: business_fiscal
    rule: "An ACCRUAL entry may be reversed at most once: the request is refused when any PenaltyLedgerEntry already carries reverses_entry_id == this entry's id."
    error_id: ERR_ENTRY_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /compliance/penalty-ledger-entries/{id}/reverse"

  - priority: 36
    category: business_fiscal
    rule: "A RemediationPlan may only be completed when at least one unreversed ACCRUAL of its target_deficiency_type exists on the plan year (there must be money to abate)."
    error_id: ERR_NO_ACCRUAL_TO_REMEDIATE
    http_status: 409
    applies_to: "POST /compliance/remediation-plans/{id}/complete"

  - priority: 37
    category: business_constraint
    rule: "A RemediationPlan may only be completed when completed_milestone_count == milestone_count; a milestone completion beyond milestone_count is refused with the same error."
    error_id: ERR_MILESTONES_INCOMPLETE
    http_status: 409
    applies_to: "POST /compliance/remediation-plans/{id}/complete, POST /compliance/remediation-plans/{id}/milestone-completions"

  - priority: 38
    category: business_temporal
    rule: "penalty-projection as_of_date, when supplied, must be >= PlanYear.start_date and <= PlanYear.end_date."
    error_id: ERR_PROJECTION_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "GET /compliance/plan-years/{id}/penalty-projection"

  - priority: 39
    category: business_constraint
    rule: "A MachineReadableFile's posting_month must fall within the months spanned by [PlanYear.start_date, PlanYear.end_date]; row_count must be >= 1; validation_error_count must be >= 0."
    error_id: ERR_INVALID_MRF_INPUT
    http_status: 422
    applies_to: "POST /compliance/machine-readable-files, POST /compliance/machine-readable-files/{id}/validate, POST /compliance/machine-readable-files/{id}/revise"

# --- §1.4 (continued): rules whose evaluation is deliberately LAST -----------
  - priority: 40
    category: authorization_identity
    rule: "A caller presenting X-Role VendorContact must have an X-User-ID that resolves to an existing Vendor row. Priority 7 pre-empts this rule whenever the addressed row belongs to a different vendor, so a bogus vendor identity acting on another vendor's row returns ERR_VENDOR_SCOPE_VIOLATION rather than this error."
    error_id: ERR_ROLE_ENTITY_MISMATCH
    http_status: 403
    applies_to: "all endpoints reachable by VendorContact"

  - priority: 41
    category: uniqueness
    rule: "PlanYear.plan_year_label must be unique across all plan years."
    error_id: ERR_DUPLICATE_PLAN_YEAR_LABEL
    http_status: 409
    applies_to: "POST /compliance/plan-years"

  - priority: 42
    category: uniqueness
    rule: "At most one VendorDataPackage may exist per (rx_submission_id, vendor_id, data_section) triple."
    error_id: ERR_DUPLICATE_DATA_SECTION
    http_status: 409
    applies_to: "POST /compliance/vendor-data-packages"

  - priority: 43
    category: business_constraint
    rule: "A gag review may not record prohibited_clause_count > clause_inventory_count, and neither count may be negative."
    error_id: ERR_CLAUSE_COUNT_INCONSISTENT
    http_status: 422
    applies_to: "POST /compliance/contracts/{id}/gag-review, POST /compliance/contracts/{id}/submit-remediation"

  - priority: 44
    category: business_constraint
    rule: "RxDataSubmission.reference_year must equal the calendar year of PlanYear.start_date or the year immediately before it."
    error_id: ERR_RX_REFERENCE_YEAR_INVALID
    http_status: 422
    applies_to: "POST /compliance/rx-data-submissions"

  - priority: 45
    category: business_temporal
    rule: "The logical clock may only be moved forward or held: a current_utc strictly earlier than the clock's present value is refused so that day counts and deadline comparisons stay monotonic."
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 409
    applies_to: "POST /compliance/_clock/set_current_utc"

# =============================================================================
# §1.5 Endpoint Table — 73 endpoints, all under /compliance. Every parent link is
# reverse-reachable through the entity's filtered list endpoint (FK fields are
# optional query inputs). Every list endpoint also accepts limit? and offset?.
# =============================================================================
endpoints:
  # --- PlanYear -------------------------------------------------------------
  - method: POST
    path: /compliance/plan-years
    roles: [PlanSponsorAdmin]
    input: [sponsor_name, plan_year_label, start_date, end_date, covered_lives, attestation_deadline_date, rxdc_deadline_date]
    output: PlanYear
    description: "Create a plan year in lifecycle_status SETUP with compliance_posture COMPLIANT."
  - method: GET
    path: /compliance/plan-years/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor, PlatformOperator]
    input: []
    output: PlanYear
    description: "Retrieve one plan year including its derived posture, points and exposure."
  - method: GET
    path: /compliance/plan-years
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor, PlatformOperator]
    input: ["plan_year_label?", "lifecycle_status?", "compliance_posture?", "limit?", "offset?"]
    output: PlanYear[]
    description: "List plan years, newest created_at first."
  - method: POST
    path: /compliance/plan-years/{id}/activate
    roles: [PlanSponsorAdmin]
    input: []
    output: PlanYear
    description: "SETUP -> ACTIVE. Requires at least one TPA ServiceProviderContract."
  - method: POST
    path: /compliance/plan-years/{id}/close-reporting
    roles: [PlanSponsorAdmin]
    input: []
    output: PlanYear
    description: "ACTIVE -> REPORTING_CLOSED once the clock date is past end_date; recomputes posture once."
  - method: POST
    path: /compliance/plan-years/{id}/freeze
    roles: [ExternalAuditor]
    input: [reason]
    output: PlanYear
    description: "Set freeze_flag and force compliance_posture FROZEN, locking down child mutations."
  - method: POST
    path: /compliance/plan-years/{id}/unfreeze
    roles: [ExternalAuditor]
    input: ["note?"]
    output: PlanYear
    description: "Clear freeze_flag and recompute compliance_posture from deficiency_points."
  - method: POST
    path: /compliance/plan-years/{id}/compliance-runs
    roles: [ComplianceOfficer, PlatformOperator]
    input: []
    output: { run_id: string, cycles_missed_count: integer, amendments_lapsed_count: integer, accruals_posted_count: integer, posture_before: string, posture_after: string, deficiency_points: integer, penalty_exposure_cents: integer }
    description: "Ops checkpoint. Sweeps PENDING refresh cycles past deadline to MISSED, lapses expired amendments (reverting data_rights_status where nothing open remains), posts the resulting accruals, then recomputes exposure, points and posture. Idempotent for a fixed clock: a second run posts no further accruals."
  - method: GET
    path: /compliance/plan-years/{id}/penalty-projection
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["as_of_date?"]
    output: { statutory_maximum_cents: integer, accrued_to_date_cents: integer, open_deficiency_count: integer, size_multiplier: number }
    description: "Dual-variant forward-looking exposure projection over the OPEN deficiency set (calculations.penalty_exposure_projection). Read-only."

  # --- Vendor ---------------------------------------------------------------
  - method: POST
    path: /compliance/vendors
    roles: [PlanSponsorAdmin]
    input: [legal_name, vendor_type, contact_email]
    output: Vendor
    description: "Register a service provider."
  - method: GET
    path: /compliance/vendors/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor, VendorContact]
    input: []
    output: Vendor
    description: "Retrieve one vendor."
  - method: GET
    path: /compliance/vendors
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["vendor_type?", "limit?", "offset?"]
    output: Vendor[]
    description: "List vendors."

  # --- ServiceProviderContract ---------------------------------------------
  - method: POST
    path: /compliance/contracts
    roles: [PlanSponsorAdmin]
    input: [plan_year_id, vendor_id, contract_type, term_start, term_end, annual_fee_cents]
    output: ServiceProviderContract
    description: "Create a service provider contract in gag_review_status NOT_REVIEWED and data_rights_status NOT_SECURED."
  - method: GET
    path: /compliance/contracts/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor, VendorContact]
    input: []
    output: ServiceProviderContract
    description: "Retrieve one contract with both status dimensions."
  - method: GET
    path: /compliance/contracts
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["plan_year_id?", "vendor_id?", "contract_type?", "gag_review_status?", "data_rights_status?", "limit?", "offset?"]
    output: ServiceProviderContract[]
    description: "List contracts; reverse-reachability for ServiceProviderContract.plan_year_id and ServiceProviderContract.vendor_id."
  - method: POST
    path: /compliance/contracts/{id}/gag-review
    roles: [ComplianceOfficer]
    input: [clause_inventory_count, prohibited_clause_count, "review_note?"]
    output: ServiceProviderContract
    description: "NOT_REVIEWED -> IN_REVIEW, recording the clause inventory and the prohibited-clause finding."
  - method: POST
    path: /compliance/contracts/{id}/request-remediation
    roles: [ComplianceOfficer]
    input: ["remediation_request_note?"]
    output: ServiceProviderContract
    description: "IN_REVIEW -> REMEDIATION_REQUESTED while remediation_round < MAX_REMEDIATION_ROUNDS."
  - method: POST
    path: /compliance/contracts/{id}/submit-remediation
    roles: [VendorContact]
    input: [prohibited_clause_count, "remediation_note?"]
    output: ServiceProviderContract
    description: "REMEDIATION_REQUESTED -> IN_REVIEW (cycle edge); the vendor restates its remaining prohibited-clause count and remediation_round increments."
  - method: POST
    path: /compliance/contracts/{id}/clear-gag
    roles: [ComplianceOfficer]
    input: ["clearance_note?"]
    output: ServiceProviderContract
    description: "IN_REVIEW -> COMPLIANT; requires prohibited_clause_count == 0."
  - method: POST
    path: /compliance/contracts/{id}/escalate-gag
    roles: [ComplianceOfficer]
    input: ["escalation_note?"]
    output: ServiceProviderContract
    description: "IN_REVIEW or REMEDIATION_REQUESTED -> NON_COMPLIANT; triggers CASCADE-A (accrual, exposure, points, posture flip, DRAFT attestation voiding)."

  # --- ContractAmendment ---------------------------------------------------
  - method: POST
    path: /compliance/contract-amendments
    roles: [PlanSponsorAdmin]
    input: [contract_id, amendment_type, proposed_terms_summary, data_rights_granted, expires_at, expected_contract_version]
    output: ContractAmendment
    description: "Propose an amendment. OCC on ServiceProviderContract.version; supersedes (WITHDRAWN) the prior open amendment of the same contract_id and amendment_type; a DATA_RIGHTS proposal moves the contract NOT_SECURED -> PENDING_AMENDMENT."
  - method: GET
    path: /compliance/contract-amendments/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor, VendorContact]
    input: []
    output: ContractAmendment
    description: "Retrieve one amendment."
  - method: GET
    path: /compliance/contract-amendments
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor, VendorContact]
    input: ["contract_id?", "amendment_type?", "status?", "limit?", "offset?"]
    output: ContractAmendment[]
    description: "List amendments; reverse-reachability for ContractAmendment.contract_id."
  - method: POST
    path: /compliance/contract-amendments/{id}/counter
    roles: [VendorContact]
    input: [counter_terms_summary]
    output: ContractAmendment
    description: "PROPOSED -> COUNTERED by the contracted vendor."
  - method: POST
    path: /compliance/contract-amendments/{id}/revise-proposal
    roles: [PlanSponsorAdmin]
    input: [proposed_terms_summary, data_rights_granted]
    output: ContractAmendment
    description: "COUNTERED -> PROPOSED (cycle edge), round increments; refused at MAX_NEGOTIATION_ROUNDS."
  - method: POST
    path: /compliance/contract-amendments/{id}/execute
    roles: [PlanSponsorAdmin]
    input: ["executed_terms_note?"]
    output: ContractAmendment
    description: "PROPOSED -> EXECUTED; a DATA_RIGHTS execution secures the contract's data rights, a GAG_CLAUSE_REMOVAL execution zeroes prohibited_clause_count."

  # --- CompensationDisclosure ---------------------------------------------
  - method: POST
    path: /compliance/compensation-disclosures
    roles: [PlanSponsorAdmin, ComplianceOfficer]
    input: [contract_id, direct_comp_cents, indirect_comp_cents, benchmark_median_cents, services_scope_score, disclosure_completeness_score]
    output: CompensationDisclosure
    description: "Record receipt of a broker or consultant compensation disclosure in status RECEIVED."
  - method: GET
    path: /compliance/compensation-disclosures/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: []
    output: CompensationDisclosure
    description: "Retrieve one disclosure with its component scores."
  - method: GET
    path: /compliance/compensation-disclosures
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["contract_id?", "status?", "variant_applied?", "limit?", "offset?"]
    output: CompensationDisclosure[]
    description: "List disclosures; reverse-reachability for CompensationDisclosure.contract_id."
  - method: POST
    path: /compliance/compensation-disclosures/{id}/assess
    roles: [ComplianceOfficer]
    input: ["assessment_note?"]
    output: CompensationDisclosure
    description: "Run calculations.compensation_reasonableness_score and branch RECEIVED -> REASONABLE or UNREASONABLE."

  # --- MachineReadableFile -------------------------------------------------
  - method: POST
    path: /compliance/machine-readable-files
    roles: [PlanSponsorAdmin]
    input: [plan_year_id, file_type, posting_month, public_url, row_count, schema_version]
    output: MachineReadableFile
    description: "Stage a machine-readable file in DRAFT."
  - method: GET
    path: /compliance/machine-readable-files/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: []
    output: MachineReadableFile
    description: "Retrieve one file."
  - method: GET
    path: /compliance/machine-readable-files
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["plan_year_id?", "file_type?", "posting_month?", "status?", "limit?", "offset?"]
    output: MachineReadableFile[]
    description: "List files; reverse-reachability for MachineReadableFile.plan_year_id."
  - method: POST
    path: /compliance/machine-readable-files/{id}/validate
    roles: [PlanSponsorAdmin]
    input: [validation_error_count]
    output: MachineReadableFile
    description: "DRAFT -> VALIDATING and onward to PUBLISHED (0 errors, superseding any prior published file of the same month and type) or REJECTED."
  - method: POST
    path: /compliance/machine-readable-files/{id}/revise
    roles: [PlanSponsorAdmin]
    input: [public_url, row_count]
    output: MachineReadableFile
    description: "REJECTED -> DRAFT with a replacement payload."

  # --- RefreshCycle --------------------------------------------------------
  - method: POST
    path: /compliance/refresh-cycles
    roles: [PlanSponsorAdmin, ComplianceOfficer]
    input: [plan_year_id, period_month, period_start, period_end]
    output: RefreshCycle
    description: "Open a monthly refresh cycle in PENDING; deadline_at is derived as period_end + GRACE_DAYS at 23:59:59.999Z. Closed-interval overlap with a sibling cycle is refused."
  - method: GET
    path: /compliance/refresh-cycles/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: []
    output: RefreshCycle
    description: "Retrieve one refresh cycle."
  - method: GET
    path: /compliance/refresh-cycles
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["plan_year_id?", "status?", "period_month?", "limit?", "offset?"]
    output: RefreshCycle[]
    description: "List refresh cycles; reverse-reachability for RefreshCycle.plan_year_id."
  - method: POST
    path: /compliance/refresh-cycles/{id}/certify
    roles: [ComplianceOfficer]
    input: ["certification_note?"]
    output: RefreshCycle
    description: "PENDING -> CERTIFIED or LATE_CERTIFIED depending on the clock versus deadline_at; requires both required file types PUBLISHED for the period month."

  # --- PriceComparisonTool -------------------------------------------------
  - method: POST
    path: /compliance/price-comparison-tools
    roles: [PlanSponsorAdmin]
    input: [plan_year_id, tool_name, covered_items_count, "sla_target_uptime_pct?"]
    output: PriceComparisonTool
    description: "Register a price comparison tool in PENDING_LAUNCH (sla_target_uptime_pct defaults to 99.00)."
  - method: GET
    path: /compliance/price-comparison-tools/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: []
    output: PriceComparisonTool
    description: "Retrieve one tool including its outage_windows array and last evaluation."
  - method: GET
    path: /compliance/price-comparison-tools
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["plan_year_id?", "status?", "sla_breach_open?", "limit?", "offset?"]
    output: PriceComparisonTool[]
    description: "List tools; reverse-reachability for PriceComparisonTool.plan_year_id."
  - method: POST
    path: /compliance/price-comparison-tools/{id}/launch
    roles: [PlanSponsorAdmin]
    input: []
    output: PriceComparisonTool
    description: "PENDING_LAUNCH -> LIVE; requires covered_items_count >= REQUIRED_COVERED_ITEMS."
  - method: POST
    path: /compliance/price-comparison-tools/{id}/outage-windows
    roles: [PlanSponsorAdmin, PlatformOperator]
    input: [window_start, window_end, cause]
    output: PriceComparisonTool
    description: "Append one half-open outage window. Overlap with an existing window is refused; a window starting exactly when another ends is accepted."
  - method: POST
    path: /compliance/price-comparison-tools/{id}/evaluations
    roles: [ComplianceOfficer, PlatformOperator]
    input: [evaluation_month]
    output: PriceComparisonTool
    description: "Score an elapsed month with calculations.tool_monthly_uptime, opening or closing the SLA breach and posting the TOOL_SLA accrual on a new breach."

  # --- RxDataSubmission ----------------------------------------------------
  - method: POST
    path: /compliance/rx-data-submissions
    roles: [PlanSponsorAdmin, ComplianceOfficer]
    input: [plan_year_id, reference_year]
    output: RxDataSubmission
    description: "Open a prescription-drug data collection submission in OPEN."
  - method: GET
    path: /compliance/rx-data-submissions/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: []
    output: RxDataSubmission
    description: "Retrieve one submission with its assembled record count and reconciliation totals."
  - method: GET
    path: /compliance/rx-data-submissions
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["plan_year_id?", "status?", "reference_year?", "limit?", "offset?"]
    output: RxDataSubmission[]
    description: "List submissions; reverse-reachability for RxDataSubmission.plan_year_id."
  - method: POST
    path: /compliance/rx-data-submissions/{id}/reconcile
    roles: [ComplianceOfficer]
    input: []
    output: RxDataSubmission
    description: "ASSEMBLING -> RECONCILED, writing calculations.rxdc_reconciliation_totals; requires every package VALIDATED."
  - method: POST
    path: /compliance/rx-data-submissions/{id}/submit
    roles: [ComplianceOfficer]
    input: []
    output: RxDataSubmission
    description: "RECONCILED -> SUBMITTED, closing the RXDC_LATE deficiency."

  # --- VendorDataPackage ---------------------------------------------------
  - method: POST
    path: /compliance/vendor-data-packages
    roles: [PlanSponsorAdmin, ComplianceOfficer]
    input: [rx_submission_id, vendor_id, data_section, expected_record_count]
    output: VendorDataPackage
    description: "Request a vendor data section in EXPECTED."
  - method: GET
    path: /compliance/vendor-data-packages/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor, VendorContact]
    input: []
    output: VendorDataPackage
    description: "Retrieve one package."
  - method: GET
    path: /compliance/vendor-data-packages
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor, VendorContact]
    input: ["rx_submission_id?", "vendor_id?", "data_section?", "status?", "limit?", "offset?"]
    output: VendorDataPackage[]
    description: "List packages; reverse-reachability for VendorDataPackage.rx_submission_id and VendorDataPackage.vendor_id."
  - method: POST
    path: /compliance/vendor-data-packages/{id}/deliver
    roles: [VendorContact]
    input: [record_count, plan_paid_cents, member_paid_cents, rebate_cents]
    output: VendorDataPackage
    description: "EXPECTED -> RECEIVED by the owning vendor; requires the vendor's contract for the plan year to have data_rights_status SECURED; bubbles the parent submission OPEN -> ASSEMBLING."
  - method: POST
    path: /compliance/vendor-data-packages/{id}/validate
    roles: [ComplianceOfficer]
    input: []
    output: VendorDataPackage
    description: "RECEIVED -> VALIDATED and adds record_count to RxDataSubmission.assembled_record_count."
  - method: POST
    path: /compliance/vendor-data-packages/{id}/reject
    roles: [ComplianceOfficer]
    input: [rejection_reason]
    output: VendorDataPackage
    description: "RECEIVED or VALIDATED -> REJECTED. From VALIDATED this triggers CASCADE-B (record-count decrement, reconciliation demotion, totals nulled, RXDC_LATE accrual past the deadline)."
  - method: POST
    path: /compliance/vendor-data-packages/{id}/resubmit
    roles: [VendorContact]
    input: [record_count, plan_paid_cents, member_paid_cents, rebate_cents]
    output: VendorDataPackage
    description: "REJECTED -> RECEIVED (cycle edge) with a corrected payload; delivery_round increments."

  # --- Attestation ---------------------------------------------------------
  - method: POST
    path: /compliance/attestations
    roles: [ComplianceOfficer]
    input: [plan_year_id, attestation_type, contract_terms_doc_count, expected_plan_year_version]
    output: Attestation
    description: "Create an attestation DRAFT; prepared_by_user_id is the caller. OCC on PlanYear.version; supersedes any prior DRAFT for the plan year (VOIDED, SUPERSEDED_BY_NEWER_DRAFT)."
  - method: GET
    path: /compliance/attestations/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: []
    output: Attestation
    description: "Retrieve one attestation."
  - method: GET
    path: /compliance/attestations
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["plan_year_id?", "status?", "limit?", "offset?"]
    output: Attestation[]
    description: "List attestations; reverse-reachability for Attestation.plan_year_id."
  - method: POST
    path: /compliance/attestations/{id}/submit
    roles: [ComplianceOfficer]
    input: [signature_statement]
    output: Attestation
    description: "DRAFT -> SUBMITTED. Requires posture COMPLIANT or AT_RISK, every material contract gag-COMPLIANT, at least one contract-terms document, and a submitter distinct from the preparer."
  - method: POST
    path: /compliance/attestations/{id}/accept
    roles: [ExternalAuditor]
    input: ["acceptance_note?"]
    output: Attestation
    description: "SUBMITTED -> ACCEPTED; closes the ATTESTATION_LATE deficiency and posts NO ledger entry."
  - method: POST
    path: /compliance/attestations/{id}/reject
    roles: [ExternalAuditor]
    input: [rejection_reason]
    output: Attestation
    description: "SUBMITTED -> REJECTED; posts an ATTESTATION_LATE accrual and recomputes exposure, points and posture."
  - method: POST
    path: /compliance/attestations/{id}/revise
    roles: [ComplianceOfficer]
    input: [contract_terms_doc_count]
    output: Attestation
    description: "REJECTED -> DRAFT; revision_round increments and prepared_by_user_id becomes the reviser, so segregation of duties is re-evaluated against them."

  # --- PenaltyLedgerEntry --------------------------------------------------
  - method: GET
    path: /compliance/penalty-ledger-entries/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: []
    output: PenaltyLedgerEntry
    description: "Retrieve one immutable ledger entry."
  - method: GET
    path: /compliance/penalty-ledger-entries
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["plan_year_id?", "entry_type?", "deficiency_type?", "reverses_entry_id?", "remediation_plan_id?", "limit?", "offset?"]
    output: PenaltyLedgerEntry[]
    description: "List ledger entries ordered created_at ASC; reverse-reachability for PenaltyLedgerEntry.plan_year_id, PenaltyLedgerEntry.reverses_entry_id and PenaltyLedgerEntry.remediation_plan_id."
  - method: POST
    path: /compliance/penalty-ledger-entries/{id}/reverse
    roles: [ExternalAuditor]
    input: [reason]
    output: PenaltyLedgerEntry
    description: "Append a compensating entry of -signed_amount_cents carrying reverses_entry_id, then recompute PlanYear.penalty_exposure_cents. The original entry is never mutated. Permitted while the plan year is FROZEN."

  # --- RemediationPlan -----------------------------------------------------
  - method: POST
    path: /compliance/remediation-plans
    roles: [ComplianceOfficer]
    input: [plan_year_id, target_deficiency_type, milestone_count, plan_summary]
    output: RemediationPlan
    description: "Open a remediation plan in ACTIVE. Permitted while the plan year is FROZEN."
  - method: GET
    path: /compliance/remediation-plans/{id}
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: []
    output: RemediationPlan
    description: "Retrieve one remediation plan."
  - method: GET
    path: /compliance/remediation-plans
    roles: [PlanSponsorAdmin, ComplianceOfficer, ExternalAuditor]
    input: ["plan_year_id?", "status?", "target_deficiency_type?", "limit?", "offset?"]
    output: RemediationPlan[]
    description: "List remediation plans; reverse-reachability for RemediationPlan.plan_year_id."
  - method: POST
    path: /compliance/remediation-plans/{id}/milestone-completions
    roles: [ComplianceOfficer]
    input: [milestone_label]
    output: RemediationPlan
    description: "Record one completed milestone; refused beyond milestone_count. Permitted while the plan year is FROZEN."
  - method: POST
    path: /compliance/remediation-plans/{id}/complete
    roles: [ComplianceOfficer]
    input: ["completion_note?"]
    output: RemediationPlan
    description: "ACTIVE -> COMPLETED once every milestone is recorded; posts the ABATEMENT entry from calculations.remediation_abatement_amount without lowering deficiency_points. Permitted while the plan year is FROZEN."

  # --- Logical clock -------------------------------------------------------
  - method: POST
    path: /compliance/_clock/set_current_utc
    roles: [PlatformOperator]
    input: [current_utc]
    output: { current_utc: string }
    description: "Test-driving endpoint that sets the service's logical clock. Every timestamp, deadline comparison and day count in this domain reads this clock. Default at startup: 2026-08-01T00:00:00Z."

# =============================================================================
# §1.6 Error Catalog — 57 codes. Every code is reachable by at least one request.
# =============================================================================
errors:
  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, when: "X-User-ID header missing or empty" }
  - { error_id: ERR_FORBIDDEN_ROLE, http_status: 403, when: "X-Role missing, unknown, or not listed for the endpoint" }
  - { error_id: ERR_ROLE_ENTITY_MISMATCH, http_status: 403, when: "X-Role VendorContact but X-User-ID does not resolve to a Vendor" }
  - { error_id: ERR_VENDOR_SCOPE_VIOLATION, http_status: 403, when: "VendorContact acts on a contract, amendment or package owned by a different vendor_id" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, when: "Attestation submitter equals preparer, or the accepting/rejecting auditor equals the preparer or submitter" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 400, when: "Missing required body field, wrong type, unknown enum member, or malformed date/datetime/month string" }
  - { error_id: ERR_INVALID_PAGINATION, http_status: 400, when: "limit outside [1,100] or offset < 0" }
  - { error_id: ERR_PLAN_YEAR_NOT_FOUND, http_status: 404, when: "plan year id in the path or plan_year_id in a body/filter does not exist" }
  - { error_id: ERR_VENDOR_NOT_FOUND, http_status: 404, when: "vendor id in the path or vendor_id in a body/filter does not exist" }
  - { error_id: ERR_CONTRACT_NOT_FOUND, http_status: 404, when: "contract id in the path or contract_id in a body/filter does not exist" }
  - { error_id: ERR_AMENDMENT_NOT_FOUND, http_status: 404, when: "contract amendment id in the path does not exist" }
  - { error_id: ERR_DISCLOSURE_NOT_FOUND, http_status: 404, when: "compensation disclosure id in the path does not exist" }
  - { error_id: ERR_MRF_NOT_FOUND, http_status: 404, when: "machine-readable file id in the path does not exist" }
  - { error_id: ERR_REFRESH_CYCLE_NOT_FOUND, http_status: 404, when: "refresh cycle id in the path does not exist" }
  - { error_id: ERR_TOOL_NOT_FOUND, http_status: 404, when: "price comparison tool id in the path does not exist" }
  - { error_id: ERR_RX_SUBMISSION_NOT_FOUND, http_status: 404, when: "rx data submission id in the path or rx_submission_id in a body/filter does not exist" }
  - { error_id: ERR_PACKAGE_NOT_FOUND, http_status: 404, when: "vendor data package id in the path does not exist" }
  - { error_id: ERR_ATTESTATION_NOT_FOUND, http_status: 404, when: "attestation id in the path does not exist" }
  - { error_id: ERR_LEDGER_ENTRY_NOT_FOUND, http_status: 404, when: "penalty ledger entry id in the path or reverses_entry_id filter does not exist" }
  - { error_id: ERR_REMEDIATION_PLAN_NOT_FOUND, http_status: 404, when: "remediation plan id in the path or remediation_plan_id filter does not exist" }
  - { error_id: ERR_STALE_PLAN_YEAR_VERSION, http_status: 412, when: "expected_plan_year_version does not match PlanYear.version on attestation creation" }
  - { error_id: ERR_STALE_CONTRACT_VERSION, http_status: 412, when: "expected_contract_version does not match ServiceProviderContract.version on amendment creation" }
  - { error_id: ERR_PLAN_YEAR_FROZEN, http_status: 409, when: "A mutating child endpoint is called while the owning PlanYear.compliance_posture == FROZEN (outside the unfreeze / ledger-reversal / remediation exemptions)" }
  - { error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, when: "The addressed entity is not in a state from which the requested transition (or state-requiring action) is declared in §1.2" }
  - { error_id: ERR_POSTURE_BLOCKS_ATTESTATION, http_status: 409, when: "Attestation submit attempted while PlanYear.compliance_posture == DEFICIENT" }
  - { error_id: ERR_GAG_CLAUSES_OUTSTANDING, http_status: 409, when: "Attestation submit attempted while a material contract of the plan year is not gag-COMPLIANT" }
  - { error_id: ERR_CONTRACT_TERMS_DOC_REQUIRED, http_status: 422, when: "Attestation submit or revise with contract_terms_doc_count < 1" }
  - { error_id: ERR_MRF_NOT_PUBLISHED, http_status: 409, when: "Refresh cycle certify without a PUBLISHED file of each required type for the period month" }
  - { error_id: ERR_DATA_RIGHTS_NOT_SECURED, http_status: 409, when: "Package deliver or resubmit while the vendor's contract for the plan year is not data_rights_status SECURED" }
  - { error_id: ERR_PACKAGES_NOT_VALIDATED, http_status: 409, when: "Reconcile or submit attempted while the submission has no packages or any package is not VALIDATED" }
  - { error_id: ERR_TPA_CONTRACT_REQUIRED, http_status: 409, when: "Plan year activate attempted with no TPA contract" }
  - { error_id: ERR_REPORTING_PERIOD_NOT_ENDED, http_status: 409, when: "close-reporting attempted while the clock date is on or before PlanYear.end_date" }
  - { error_id: ERR_INVALID_INTERVAL, http_status: 422, when: "An interval input is inverted or degenerate (end not after start), a refresh period falls outside the plan year, or expires_at is not in the future" }
  - { error_id: ERR_REFRESH_PERIOD_OVERLAP, http_status: 409, when: "A new refresh cycle's closed period intersects a sibling cycle's closed period, including sharing a single boundary day" }
  - { error_id: ERR_OUTAGE_WINDOW_OVERLAP, http_status: 409, when: "A new half-open outage window intersects an existing window of the same tool (touching endpoints are accepted)" }
  - { error_id: ERR_OUTAGE_WINDOW_OUT_OF_RANGE, http_status: 422, when: "An outage window extends beyond the logical clock or begins before launched_at" }
  - { error_id: ERR_EVALUATION_MONTH_NOT_ELAPSED, http_status: 422, when: "evaluation_month is the current clock month or later, or precedes the launch month" }
  - { error_id: ERR_AMENDMENT_EXPIRED, http_status: 409, when: "counter, revise-proposal or execute called after the amendment's expires_at, before the compliance run has swept it to LAPSED" }
  - { error_id: ERR_DATA_RIGHTS_NOT_GRANTED, http_status: 422, when: "A DATA_RIGHTS amendment is executed with data_rights_granted false" }
  - { error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, http_status: 409, when: "revise-proposal called when round == MAX_NEGOTIATION_ROUNDS (3)" }
  - { error_id: ERR_REMEDIATION_ROUNDS_EXHAUSTED, http_status: 409, when: "request-remediation called when remediation_round == MAX_REMEDIATION_ROUNDS (2)" }
  - { error_id: ERR_PROHIBITED_CLAUSES_PRESENT, http_status: 409, when: "clear-gag with prohibited_clause_count >= 1, or escalate-gag with prohibited_clause_count == 0" }
  - { error_id: ERR_CLAUSE_COUNT_INCONSISTENT, http_status: 422, when: "prohibited_clause_count exceeds clause_inventory_count, or either count is negative" }
  - { error_id: ERR_COVERED_ITEMS_INSUFFICIENT, http_status: 422, when: "Tool launch with covered_items_count < 500" }
  - { error_id: ERR_DISCLOSURE_NOT_APPLICABLE, http_status: 409, when: "Compensation disclosure created against a contract whose compensation_disclosure_required is false" }
  - { error_id: ERR_INVALID_BENCHMARK, http_status: 422, when: "benchmark_median_cents < 1, a 1..5 score out of range, or a negative compensation amount" }
  - { error_id: ERR_INVALID_PACKAGE_TOTALS, http_status: 422, when: "Package deliver, resubmit or validate with record_count < 1 or a negative monetary total" }
  - { error_id: ERR_DUPLICATE_DATA_SECTION, http_status: 409, when: "A second package is requested for the same (rx_submission_id, vendor_id, data_section)" }
  - { error_id: ERR_RX_REFERENCE_YEAR_INVALID, http_status: 422, when: "reference_year is neither the plan year's start year nor the year before it" }
  - { error_id: ERR_NOT_REVERSIBLE_ENTRY, http_status: 409, when: "Reverse called on an ABATEMENT entry or on an entry that is itself a reversal" }
  - { error_id: ERR_ENTRY_ALREADY_REVERSED, http_status: 409, when: "Reverse called on an ACCRUAL that already has a reversing entry" }
  - { error_id: ERR_NO_ACCRUAL_TO_REMEDIATE, http_status: 409, when: "Remediation plan completion with no unreversed accrual of the target deficiency type" }
  - { error_id: ERR_MILESTONES_INCOMPLETE, http_status: 409, when: "Completion attempted with completed_milestone_count < milestone_count, or a milestone recorded beyond milestone_count" }
  - { error_id: ERR_PROJECTION_DATE_OUT_OF_RANGE, http_status: 422, when: "as_of_date is before PlanYear.start_date or after PlanYear.end_date" }
  - { error_id: ERR_INVALID_MRF_INPUT, http_status: 422, when: "posting_month outside the plan year, row_count < 1, or validation_error_count < 0" }
  - { error_id: ERR_DUPLICATE_PLAN_YEAR_LABEL, http_status: 409, when: "plan_year_label already used by another plan year" }
  - { error_id: ERR_CLOCK_REWIND_FORBIDDEN, http_status: 409, when: "current_utc is strictly earlier than the clock's present value" }

# =============================================================================
# §1.7 RBAC Table — 5 roles, segregation of duties between preparation,
# submission and adjudication.
# =============================================================================
roles:
  - name: PlanSponsorAdmin
    binding: opaque
    description: "Employer plan sponsor operator. Owns plan-year setup, vendor registration, contracts, amendments, machine-readable file publication and tool registration. May NOT certify refresh cycles, assess disclosures, prepare or submit attestations, adjudicate them, or reverse ledger entries."
  - name: ComplianceOfficer
    binding: opaque
    description: "Compliance function. Runs gag reviews, certifies refresh cycles, scores tool uptime, assesses compensation disclosures, validates and rejects vendor data packages, reconciles and submits RxDC data, prepares/submits/revises attestations, drives compliance runs and remediation plans. May not accept or reject an attestation, and may not submit an attestation it prepared."
  - name: ExternalAuditor
    binding: opaque
    description: "Independent adjudicator. Accepts or rejects submitted attestations, freezes and unfreezes plan years, and reverses penalty ledger entries. Read-only everywhere else. May not prepare or submit an attestation."
  - name: VendorContact
    binding: "entity_backed:Vendor"
    description: "Service provider representative. X-User-ID MUST equal the Vendor.id it acts for. May submit gag remediation, counter amendments, and deliver or resubmit its own data packages. Every write is scoped to rows whose vendor_id equals X-User-ID."
  - name: PlatformOperator
    binding: opaque
    description: "Platform automation identity. Sets the logical clock, appends outage windows reported by monitoring, runs tool evaluations and drives compliance runs. Holds no business judgement authority: it cannot review contracts, assess disclosures, certify cycles or touch attestations."
