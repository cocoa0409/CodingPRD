  # =================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_shift_half_open_overlap_on_staff
        grounds:
          - validations[priority=9]
          - errors[ERR_STAFF_SHIFT_OVERLAP]
          - entities.CrewShift.fields.start_hour
        distinguishing_aspect: |
          Resource: StaffMember. Semantics: half-open intervals [start_hour, end_hour)
          — a shift starting exactly when another ends (10 after 6-10) is LEGAL, while
          9-12 intersecting 6-10 is rejected. Each creation must carry the staff
          member's current version (OCC), which itself increments per created shift.
        test_recipe:
          setup:
            - "Fair in SETUP; crew staff member with no shifts; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway Q", operator_company_name: "ShowCo", location: "Lot 20", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup Q", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew Q", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v1: "$.data.version" } }
          trigger:
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v1}" }, as: FairManager, as_user_id: "${sup_id}", captures: { sh1: "$.data.id" } }
            - { call: "GET /midway/staff/${crew_id}", as: FairManager, as_user_id: "${sup_id}", captures: { crew_v2: "$.data.version" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 10, end_hour: 14, shift_role: "SETUP", expected_staff_version: "${crew_v2}" }, as: FairManager, as_user_id: "${sup_id}", captures: { sh2: "$.data.id" } }
            - { call: "GET /midway/staff/${crew_id}", as: FairManager, as_user_id: "${sup_id}", captures: { crew_v3: "$.data.version" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 9, end_hour: 12, shift_role: "SETUP", expected_staff_version: "${crew_v3}" }, as: FairManager, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "shift 6-10 created (version 1 accepted)"
            - "shift 10-14 created — adjacent touch at hour 10 is legal under half-open [start, end) semantics"
            - "shift 9-12 -> err == ERR_STAFF_SHIFT_OVERLAP with http 409 (intersects both 6-10 and 10-14)"
            - "StaffMember.${crew_id}.version == 3 after exactly two successful creates"

      - name: inspector_buffer_gap_and_daily_cap_on_assignment
        grounds:
          - calculations.inspector_assignment
          - errors[ERR_INSPECTOR_UNAVAILABLE]
        distinguishing_aspect: |
          Resource: Inspector (different from the sibling's StaffMember). Semantics
          differ on both axes: a 2-hour travel BUFFER must separate same-date
          appointments (touching endpoints are NOT enough — 11+2 <= 13 passes, a 12
          start fails), AND an aggregate daily capacity (max_daily_inspections)
          independently empties the pool once three appointments occupy the date.
        test_recipe:
          setup:
            - "Fair PERMIT_REQUESTED with one verified ride and one PENDING permit"
            - "Exactly ONE active inspector, max_daily_inspections 3; existing appointment 09:00-11:00 on 2026-08-02"
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway R", operator_company_name: "ShowCo", location: "Lot 21", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup R", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew R", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Solo Insp", license_number: "LIC-O2-1", max_daily_inspections: 3 }, as: StateProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-O2-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { a1: "$.data.id", a1_insp: "$.data.inspector_id" } }
          trigger:
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 12, duration_hours: 1 }, as: FairManager, as_user_id: "${sup_id}", captures: { err_buffer: "$.data.error_id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 13, duration_hours: 1 }, as: FairManager, as_user_id: "${sup_id}", captures: { a2: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "RIDE_AUDIT", ride_id: "${ride_id}", scheduled_date: "2026-08-02", start_hour: 16, duration_hours: 1 }, as: FairManager, as_user_id: "${sup_id}", captures: { a3: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 19, duration_hours: 1 }, as: FairManager, as_user_id: "${sup_id}", captures: { err_cap: "$.data.error_id" } }
          assert:
            - "12:00 start -> err_buffer == ERR_INSPECTOR_UNAVAILABLE (11 + 2 = 13 > 12 violates the travel buffer)"
            - "13:00 start -> assigned ${insp_id} (13 >= 13 exactly satisfies the buffer; boundary is inclusive of the gap endpoint)"
            - "16:00 RIDE_AUDIT -> assigned ${insp_id} (14 + 2 = 16 <= 16)"
            - "19:00 -> err_cap == ERR_INSPECTOR_UNAVAILABLE (3 appointments already occupy 2026-08-02; daily cap reached)"

  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_conservation_across_board_void_and_abort
        grounds:
          - state_machines.RideRedemption.REDEEMED_to_VOIDED
          - state_machines.RideCycle.RUNNING_to_ABORTED
          - entities.TicketSale.fields.credits_remaining
        distinguishing_aspect: |
          Conserved quantity: credits. For every credit-bearing sale,
          credits_granted == credits_remaining + credits_redeemed + credits_forfeited
          must hold after every step: boarding moves remaining->redeemed, voiding a
          boarded-but-undispatched redemption moves it back, and aborting a RUNNING
          cycle refunds every boarded credit — 5 == 5 + 0 + 0 at the end, with no drift.
        test_recipe:
          setup:
            - "Permitted fair; THRILL ride (capacity 4, interval 5) OPEN on day 2026-08-03; sale s1 of 5 credits at 100 (subtotal 500, fee 50, total 550)"
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
