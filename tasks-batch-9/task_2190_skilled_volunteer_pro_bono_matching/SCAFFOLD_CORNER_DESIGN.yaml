  - section: state_machines
    instances:
      - name: sm_partner_active_to_suspended_runs_full_abandon_cascade
        claim_type: valid_transition
        grounds: [state_machines.PartnerOrg.transitions.ACTIVE_to_SUSPENDED, "endpoints[PATCH /partner-orgs/{id}/status]"]
        distinguishing_aspect: "One PATCH walks the whole four-step cascade: request ABANDONED, its OFFERED offer WITHDRAWN with withdraw_reason PARTNER_SUSPENDED, the window's 40.00 held hours released, and the cycle's reserved slot given back."
        test_recipe:
          setup: ["Base chain up to one OFFERED MatchOffer (reserved_hours 40.00) on an ACTIVE partner's request."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
