              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r1}" }
            - call: "GET /api/requests/${req}"
              payload: {}
              as: TrafficEngineer
              captures: { sig_count: $.data.signature_count }
          assert:
            - "First signature attempt: error_id == ERR_REQUEST_INVALID_STATE (parent request SUBMITTED, not PETITION_OPEN)"
            - "After open-petition, the identical signature call succeeds and signature_count == 1"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — half-open crew intervals (adjacency
  # allowed) vs buffer-inclusive study windows (exactly-7-day gap conflicts).
  # Different interval semantics on different resource entities.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_schedule_half_open_adjacency
        grounds:
          - calculations.crew_schedule_conflict
          - errors[ERR_CREW_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource = InstallationWorkOrder.crew_ref; semantics = half-open
          [start, start+duration): an interval starting exactly at the other's
          end (2026-09-04 == 09-01+3d) is ALLOWED, while a 1-day overlap is
          rejected with ERR_CREW_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "Two requests on two segments, both CONSENT_GRANTED at clock 2026-08-01 (ballot close 2026-08-03, tally at 2026-08-04)"
