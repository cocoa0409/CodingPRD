  # ============================================================ Table 7: RBAC
  - section: rbac
    instances:
      - name: receive_is_exclusive_to_the_sample_coordinator_and_the_admin_cannot_call_it
        claim_type: exclusive_operations
        grounds:
          - roles.SampleCoordinator.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority=3]
        distinguishing_aspect: "Intake is the sample coordinator's exclusive operation: the StudioAdmin who created the vendor is still refused with 403 ERR_FORBIDDEN_ROLE, and the sample stays EXPECTED until the coordinator calls the same endpoint."
        test_recipe:
          setup:
            - "Vendor NRTH and sample SMP-1001 exist; the sample is EXPECTED."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smp_id: $.data.id }
          trigger:
            - call: "POST /studio/samples/${smp_id}/receive"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/samples/${smp_id}/receive"
              payload: {}
              as: SampleCoordinator
          assert:
            - "first call: status == 403 and error_id == \"ERR_FORBIDDEN_ROLE\""
            - "Sample.${smp_id}.custody_state == \"EXPECTED\" after the first call"
            - "Sample.${smp_id}.received_at == null after the first call"
