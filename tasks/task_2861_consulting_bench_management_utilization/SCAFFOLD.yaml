# =============================================================================
# PRD Benchmark Scaffold — Consulting Bench Management & Utilization
# Sections §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml (never inside this file).
# =============================================================================

scenario: |
  2861. Consulting Bench Management & Utilization (technology consulting firm resource management): consultant skill taxonomy with proficiency levels, certifications and industry experience, demand pipeline visibility from sales with probability weighting for staffing decisions, assignment matching balancing skill fit, development goals, travel constraints and cost rate, utilization target setting by level with billable, investment and bench time categories, bench aging escalation with reskilling assignments, internal projects and separation decisions, subcontractor and partner sourcing when internal capacity is short, rate realization tracking against standard rates and discount approvals, forecast of hiring needs by skill and geography

domain_name: consulting-bench-management
api_prefix: ""            # flat topology: every business collection is top-level

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Every business entity is a peer top-level collection joined by foreign keys
  # (`/consultants`, `/demand-opportunities`, `/assignments`, `/bench-spells`, …).
  # Only two read paths nest (utilization periods under their consultant, child
  # groups under their parent group) because those children have exactly one
  # owner and no independent identity in the product surface.

  state_machine_shape: cyclic
  # BenchSpell is the spine and it loops: MONITORING → ESCALATED_L1 →
  # ESCALATED_L2 → RESKILLING → MONITORING. DemandOpportunity additionally runs
  # two parallel dimensions (pipeline_status × staffing_status) that fork on
  # staffing_mode and re-join at close. DiscountApproval loops
  # PENDING → REJECTED → PENDING via revise.

  relationship_patterns:
    - one_to_many          # PracticeGroup→Consultant, DemandOpportunity→Assignment
    - many_to_many         # SkillAssertion is the Consultant↔Skill junction
    - self_referential     # PracticeGroup.parent_group_id → PracticeGroup.id
    - cross_aggregate      # Assignment couples Consultant and DemandOpportunity;
                           # ExternalPlacement couples SubcontractorFirm and
                           # DemandOpportunity
  role_model: segregation_of_duties
  # A DiscountApproval may not be decided by the user who requested it, and a
  # separation may not be decided by the user who proposed it — enforced on
  # X-User-ID, not merely on X-User-Role.

  consistency_model: immediate
  # Every derived field (allocated_pct, coverage FTEs, realization, bench ratio,
  # posture, utilization hours) is recomputed inside the same request that
  # mutates its inputs; no read-time lag anywhere.

  difficulty_level: beyond_expert
  # 13 entities, 63 endpoints, 56 error codes, 10 calculations (4 with variants),
  # 44 ordered validations, 2 OCC concurrency rules, 5 roles, and 8 state-machine
  # entries over 7 entities (DemandOpportunity contributes two parallel
  # dimensions; BenchSpell and DiscountApproval are cyclic).

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: PracticeGroup
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: practice group display name
        constraints: "1..120 chars; unique across PracticeGroup"
      - name: geography_code
        type: enum
        source: input
        description: staffing geography this group recruits and bills from
        constraints: "one of {NA, EMEA, APAC, LATAM}"
      - name: parent_group_id
        type: string
        source: input
        description: "FK -> PracticeGroup.id; nullable; self-referential parent in the practice hierarchy; a group may not be its own parent and the chain may not form a cycle"
        default: null
      - name: external_sourcing_cap_pct
        type: number
        source: input
        description: maximum share of this group's QUALIFIED demand FTE that may be covered by SubcontractorFirm placements
        default: 20.00
        constraints: "0.00..100.00, 2 decimals"
      - name: level_targets
        type: object
        source: input
        description: |
          Per-level utilization and bench-aging policy. Shape:
          { "<LEVEL>": { "target_utilization_pct": number, "bench_escalation_l1_days": integer,
                         "bench_escalation_l2_days": integer, "max_investment_pct": number } }
          Optional on create; any LEVEL key absent from the supplied object falls back
          to LEVEL_TARGET_DEFAULTS (§1.3 `constants:` of bench_aging_escalation, replicated
          in utilization_period_metrics), namely:
            ANALYST            target 70.00, L1 21d, L2 45d, max_investment_pct 20.00
            CONSULTANT         target 75.00, L1 14d, L2 30d, max_investment_pct 15.00
            SENIOR_CONSULTANT  target 80.00, L1 14d, L2 28d, max_investment_pct 12.00
            MANAGER            target 70.00, L1 30d, L2 60d, max_investment_pct 25.00
            PRINCIPAL          target 55.00, L1 45d, L2 90d, max_investment_pct 35.00
        default: {}
      - name: total_headcount
        type: integer
        source: computed
        description: count of Consultant rows with practice_group_id == this.id and availability_status != SEPARATED
      - name: bench_headcount
        type: integer
        source: computed
        description: count of Consultant rows with practice_group_id == this.id and availability_status IN {BENCH, RESKILLING}
      - name: escalated_l2_count
        type: integer
        source: computed
        description: count of BenchSpell rows in state ESCALATED_L2 or SEPARATION_PROPOSED whose consultant_id belongs to this group or any descendant group
      - name: own_bench_ratio
        type: number
        source: computed
        description: "round(bench_headcount / total_headcount, 4); 0.0000 when total_headcount == 0"
      - name: rollup_bench_ratio
        type: number
        source: computed
        description: "round(SUM(bench_headcount over self + all transitive descendant groups) / SUM(total_headcount over self + all transitive descendant groups), 4); 0.0000 when the denominator is 0"
      - name: posture
        type: enum
        source: computed
        description: "gating posture per calculations.practice_posture_rollup; one of {OPEN, CONSTRAINED, FROZEN}"
        default: OPEN

  - name: Skill
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: stable skill code used as the natural key by HiringForecast
        constraints: "^[A-Z][A-Z0-9_]{2,29}$; unique across Skill"
      - name: name
        type: string
        source: input
        description: human-readable skill name
        constraints: "1..120 chars"
      - name: family
        type: enum
        source: input
        description: taxonomy family the skill belongs to
        constraints: "one of {CLOUD, DATA, SECURITY, ERP, AI}"
      - name: scarcity_index
        type: number
        source: input
        description: market scarcity 0.0000 (abundant) .. 1.0000 (scarce); >= 0.7000 exempts external sourcing from CONSTRAINED posture blocking
        default: 0.5000
        constraints: "0.0000..1.0000, 4 decimals"
      - name: retired
        type: boolean
        source: input
        description: retired skills may not be referenced by new DemandOpportunity or ReskillingProgram rows
        default: false

  - name: Consultant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: consultant display name
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: login identity
        constraints: "must contain '@'; unique across Consultant"
      - name: level
        type: enum
        source: input
        description: career level; selects the row of PracticeGroup.level_targets that governs this consultant
        constraints: "one of {ANALYST, CONSULTANT, SENIOR_CONSULTANT, MANAGER, PRINCIPAL}"
      - name: practice_group_id
        type: string
        source: input
        description: "FK -> PracticeGroup.id; the group whose level_targets, posture and bench ratio this consultant contributes to"
      - name: home_city
        type: string
        source: input
        description: home base city
        constraints: "1..80 chars"
      - name: home_geo_code
        type: enum
        source: input
        description: home geography; must equal the practice group's geography_code
        constraints: "one of {NA, EMEA, APAC, LATAM}"
      - name: cost_rate_usd_per_hour
        type: number
        source: input
        description: fully loaded internal cost rate, USD/hour
        constraints: "0.01..2000.00, 2 decimals"
      - name: standard_bill_rate_usd_per_hour
        type: number
        source: input
        description: list bill rate for this consultant, USD/hour (reference only; DemandOpportunity carries the commercial rate)
        constraints: "0.01..5000.00, 2 decimals"
      - name: travel_max_nights_per_week
        type: integer
        source: input
        description: maximum onsite nights per week this consultant accepts
        default: 3
        constraints: "0..5"
      - name: travel_willing_international
        type: boolean
        source: input
        description: whether the consultant accepts international engagements
        default: false
      - name: development_goal_skill_id
        type: string
        source: input
        description: "FK -> Skill.id; nullable; skill the consultant is developing — contributes dev_goal_fit to match_score"
        default: null
      - name: industry_experience
        type: array
        source: input
        description: "array of { industry_code: string, years: number } objects; duplicate industry_code entries are rejected; years 0.0..40.0"
        default: []
      - name: availability_status
        type: enum
        source: computed
        description: "derived per calculations.consultant_availability; one of {ASSIGNED, BENCH, RESKILLING, INTERNAL_PROJECT, SEPARATED}"
        default: BENCH
      - name: allocated_pct
        type: number
        source: computed
        description: "SUM(Assignment.allocation_pct) over assignments of this consultant with status IN {CONFIRMED, ACTIVE} whose half-open interval [start_date, end_date) contains the logical clock date; 0.00 when none"
      - name: separated_on
        type: datetime
        source: system
        description: logical-clock date-time stamped when a separation decision APPROVED closes the bench spell; null otherwise
        default: null

  - name: SkillAssertion
    parent: null
    common_fields: true
    fields:
      - name: consultant_id
        type: string
        source: input
        description: "FK -> Consultant.id; the consultant who holds the skill"
      - name: skill_id
        type: string
        source: input
        description: "FK -> Skill.id; the asserted skill"
      - name: proficiency_level
        type: integer
        source: input
        description: proficiency 1 (aware) .. 5 (authority)
        constraints: "1..5"
      - name: certification_code
        type: string
        source: input
        description: vendor certification backing the assertion; null when uncertified
        default: null
        constraints: "1..40 chars when present"
      - name: certification_expires_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) on which the certification lapses; null means never expires; must be null when certification_code is null"
        default: null
      - name: last_used_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) the skill was last used on a client engagement; informational"
        default: null
      - name: assertion_status
        type: enum
        source: computed
        description: "ACTIVE when certification_code is null OR certification_expires_on >= logical clock date; EXPIRED otherwise. One of {ACTIVE, EXPIRED}"

  - name: DemandOpportunity
    parent: null
    common_fields: true
    fields:
      - name: client_name
        type: string
        source: input
        description: client the demand belongs to
        constraints: "1..120 chars"
      - name: practice_group_id
        type: string
        source: input
        description: "FK -> PracticeGroup.id; the group that owns delivery, whose posture gates external sourcing and whose external_sourcing_cap_pct applies"
      - name: required_skill_id
        type: string
        source: input
        description: "FK -> Skill.id; the single skill the staffing decision is matched on; must have retired == false at create time"
      - name: min_proficiency_level
        type: integer
        source: input
        description: minimum SkillAssertion.proficiency_level required to be staffed on this demand
        constraints: "1..5"
      - name: required_fte
        type: number
        source: input
        description: full-time-equivalents the client needs
        constraints: "0.25..20.00, 2 decimals"
      - name: win_probability_pct
        type: integer
        source: input
        description: sales-supplied win probability used to weight the demand for staffing and hiring-forecast decisions
        constraints: "0..100"
      - name: start_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); inclusive first delivery day"
      - name: end_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); inclusive last delivery day; must be >= start_date"
      - name: industry_code
        type: string
        source: input
        description: client industry code matched against Consultant.industry_experience[].industry_code
        constraints: "^[A-Z][A-Z0-9_]{2,29}$"
      - name: onsite_nights_per_week
        type: integer
        source: input
        description: onsite nights the engagement demands per week
        constraints: "0..5"
      - name: is_international
        type: boolean
        source: input
        description: whether delivery requires international travel
        default: false
      - name: standard_rate_usd_per_hour
        type: number
        source: input
        description: firm standard (list) rate for this demand, the denominator of every realization figure
        constraints: "1.00..5000.00, 2 decimals"
      - name: requested_rate_usd_per_hour
        type: number
        source: input
        description: rate sales wants to quote; may be below standard and then needs a DiscountApproval
        constraints: "0.01..5000.00, 2 decimals; must be <= standard_rate_usd_per_hour"
      - name: approved_rate_usd_per_hour
        type: number
        source: system
        description: rate actually approved; null until a DiscountApproval on this demand reaches status APPROVED
        default: null
      - name: effective_rate_usd_per_hour
        type: number
        source: computed
        description: "approved_rate_usd_per_hour when non-null, else requested_rate_usd_per_hour"
      - name: pipeline_status
        type: enum
        source: computed
        description: "sales dimension; one of {QUALIFYING, QUALIFIED, CLOSED_WON, CLOSED_LOST}"
        default: QUALIFYING
      - name: staffing_mode
        type: enum
        source: input
        description: "branch selector set once by POST /demand-opportunities/{opportunityId}/staffing-mode; null until then; one of {INTERNAL, EXTERNAL}"
        default: null
      - name: staffing_status
        type: enum
        source: computed
        description: "coverage dimension, derived per calculations.opportunity_coverage; one of {UNSTAFFED, INTERNAL_STAFFING, EXTERNAL_SOURCING, PARTIALLY_COVERED, COVERED}"
        default: UNSTAFFED
      - name: covered_internal_fte
        type: number
        source: computed
        description: "round(SUM(Assignment.allocation_pct)/100, 2) over assignments on this demand with status IN {CONFIRMED, ACTIVE}"
      - name: covered_external_fte
        type: number
        source: computed
        description: "round(SUM(ExternalPlacement.fte), 2) over placements on this demand with status IN {APPROVED, ACTIVE}"
      - name: open_fte
        type: number
        source: computed
        description: "round(max(0.00, required_fte - covered_internal_fte - covered_external_fte), 2)"
      - name: weighted_fte
        type: number
        source: computed
        description: "round(required_fte * win_probability_pct / 100, 2); the staffing-priority weight sales visibility exposes"
      - name: booked_realization_pct
        type: number
        source: computed
        description: "round(100 * effective_rate_usd_per_hour / standard_rate_usd_per_hour, 2) — the booked variant of calculations.rate_realization"
      - name: earned_realization_pct
        type: number
        source: computed
        description: "the earned (hours-weighted) variant of calculations.rate_realization; null when total delivered hours == 0"
        default: null
      - name: blended_cost_rate_usd_per_hour
        type: number
        source: computed
        description: "round(SUM(a.cost_rate_usd_per_hour * hours_a) / SUM(hours_a), 2) over assignments on this demand with status IN {CONFIRMED, ACTIVE}; 0.00 when SUM(hours_a) == 0"
      - name: blended_margin_pct
        type: number
        source: computed
        description: "round(100 * (effective_rate_usd_per_hour - blended_cost_rate_usd_per_hour) / effective_rate_usd_per_hour, 2); null when blended_cost_rate_usd_per_hour == 0.00 (no staffed assignment yet)"
        default: null
      - name: margin_breach
        type: boolean
        source: computed
        description: "true when blended_margin_pct is non-null and < MARGIN_FLOOR_PCT (20.00)"
        default: false
      - name: closed_outcome
        type: enum
        source: system
        description: "outcome recorded by POST /demand-opportunities/{opportunityId}/close; one of {WON, LOST}; null while open"
        default: null

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: consultant_id
        type: string
        source: input
        description: "FK -> Consultant.id; the staffed consultant"
      - name: demand_opportunity_id
        type: string
        source: input
        description: "FK -> DemandOpportunity.id; the demand being covered"
      - name: allocation_pct
        type: number
        source: input
        description: share of the consultant's capacity committed to this demand
        constraints: "1.00..100.00, 2 decimals"
      - name: start_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); inclusive first day of the assignment interval"
      - name: end_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); EXCLUSIVE end of the assignment interval — the interval is half-open [start_date, end_date) so an assignment ending on D and one starting on D never overlap; must be > start_date"
      - name: category
        type: enum
        source: input
        description: "time category this assignment books into utilization; one of {BILLABLE, INVESTMENT}"
      - name: bill_rate_usd_per_hour
        type: number
        source: computed
        description: "DemandOpportunity.effective_rate_usd_per_hour when category == BILLABLE else 0.00; re-pinned on every rate change while status IN {PROPOSED, CONFIRMED, ACTIVE}; frozen at its last value once status IN {RELEASED, CANCELLED}"
      - name: cost_rate_usd_per_hour
        type: number
        source: computed
        description: snapshot of Consultant.cost_rate_usd_per_hour taken when the assignment row is created; never re-read afterwards
      - name: match_score
        type: number
        source: computed
        description: "calculations.match_score value at creation time, 4 decimals; never recomputed afterwards"
      - name: status
        type: enum
        source: computed
        description: "one of {PROPOSED, CONFIRMED, ACTIVE, RELEASED, CANCELLED}"
        default: PROPOSED
      - name: confirmed_on
        type: string
        source: system
        description: "logical clock date (YYYY-MM-DD) the assignment was confirmed; null while PROPOSED"
        default: null
      - name: activated_on
        type: string
        source: system
        description: "logical clock date (YYYY-MM-DD) POST /bench-runs moved the assignment to ACTIVE; null before that"
        default: null
      - name: released_on
        type: string
        source: system
        description: "logical clock date (YYYY-MM-DD) the assignment was released; becomes the EXCLUSIVE effective end used by every hour calculation; null unless status == RELEASED"
        default: null

  - name: BenchSpell
    parent: null
    common_fields: true
    fields:
      - name: consultant_id
        type: string
        source: input
        description: "FK -> Consultant.id; the consultant whose bench time this spell tracks"
      - name: started_on
        type: string
        source: system
        description: "ISO 8601 date (YYYY-MM-DD) the spell opened, stamped from the logical clock"
      - name: age_reset_on
        type: string
        source: system
        description: "ISO 8601 date (YYYY-MM-DD) the aging clock was reset (set when a reskilling programme completes or an internal project ends); null until then"
        default: null
      - name: ended_on
        type: string
        source: system
        description: "ISO 8601 date (YYYY-MM-DD) the spell closed; null while open"
        default: null
      - name: state
        type: enum
        source: computed
        description: "one of {MONITORING, ESCALATED_L1, ESCALATED_L2, RESKILLING, INTERNAL_PROJECT, SEPARATION_PROPOSED, CLOSED, SEPARATED}"
        default: MONITORING
      - name: escalation_count
        type: integer
        source: computed
        description: number of escalation transitions (MONITORING→ESCALATED_L1 and ESCALATED_L1→ESCALATED_L2) this spell has undergone; survives reskilling cycles
        default: 0
      - name: age_days
        type: integer
        source: computed
        description: "(logical clock date - max(started_on, age_reset_on)) in whole calendar days when the spell is open; frozen at (ended_on - max(started_on, age_reset_on)) once ended_on is set"
      - name: reskilling_program_id
        type: string
        source: input
        description: "FK -> ReskillingProgram.id; nullable; set when the spell enters RESKILLING via POST /reskilling-programs/{programId}/enrollments"
        default: null
      - name: internal_project_code
        type: string
        source: input
        description: internal (non-client) project the consultant was placed on; null unless the spell entered INTERNAL_PROJECT
        default: null
        constraints: "1..40 chars when present"
      - name: investment_started_on
        type: string
        source: system
        description: "ISO 8601 date (YYYY-MM-DD) the spell entered RESKILLING or INTERNAL_PROJECT — inclusive start of the investment-hours window; null when the spell never entered either state"
        default: null
      - name: investment_ended_on
        type: string
        source: system
        description: "ISO 8601 date (YYYY-MM-DD) the spell left RESKILLING or INTERNAL_PROJECT — EXCLUSIVE end of the investment-hours window; null while the window is still open"
        default: null
      - name: separation_proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ResourceManager who filed the separation proposal; null until then
        default: null
      - name: separation_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the PracticePartner who decided the proposal; must differ from separation_proposed_by_user_id
        default: null
      - name: separation_decision
        type: enum
        source: computed
        description: "one of {APPROVED, REJECTED}; null until a decision is filed"
        default: null

  - name: ReskillingProgram
    parent: null
    common_fields: true
    fields:
      - name: skill_id
        type: string
        source: input
        description: "FK -> Skill.id; the skill the cohort re-skills into; must have retired == false at create time"
      - name: target_proficiency_level
        type: integer
        source: input
        description: proficiency each graduate is asserted at on completion
        constraints: "1..5"
      - name: cohort_start_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); INCLUSIVE first cohort day"
      - name: cohort_end_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); INCLUSIVE last cohort day; must be >= cohort_start_on"
      - name: seat_capacity
        type: integer
        source: input
        description: number of enrollable seats
        constraints: "1..50"
      - name: seats_taken
        type: integer
        source: computed
        description: count of BenchSpell rows with reskilling_program_id == this.id and state IN {RESKILLING}
      - name: cooldown_days
        type: integer
        source: input
        description: calendar days that must elapse after a consultant's previous COMPLETED programme's cohort_end_on before that consultant may enrol again
        default: 3
        constraints: "0..30"
      - name: status
        type: enum
        source: computed
        description: "one of {PLANNED, RUNNING, COMPLETED}; PLANNED on create, RUNNING once POST /bench-runs observes cohort_start_on <= clock date, COMPLETED via POST /reskilling-programs/{programId}/complete"
        default: PLANNED

  - name: SubcontractorFirm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: partner firm name
        constraints: "1..120 chars; unique across SubcontractorFirm"
      - name: geo_code
        type: enum
        source: input
        description: geography the firm supplies from
        constraints: "one of {NA, EMEA, APAC, LATAM}"
      - name: max_concurrent_placements
        type: integer
        source: input
        description: maximum number of placements in status IN {APPROVED, ACTIVE} the firm may hold on any single calendar day
        constraints: "1..50"
      - name: markup_pct
        type: number
        source: input
        description: contractual markup the firm charges over its pass-through rate
        default: 15.00
        constraints: "0.00..100.00, 2 decimals"
      - name: pass_through_rate_usd_per_hour
        type: number
        source: input
        description: cost rate the firm charges the consultancy, USD/hour
        constraints: "0.01..5000.00, 2 decimals"
      - name: approval_status
        type: enum
        source: input
        description: "master-data vetting state; one of {PENDING, APPROVED, SUSPENDED}; only APPROVED firms may take placements"
        default: APPROVED
      - name: active_placements_count
        type: integer
        source: computed
        description: count of ExternalPlacement rows for this firm with status IN {APPROVED, ACTIVE}

  - name: ExternalPlacement
    parent: null
    common_fields: true
    fields:
      - name: subcontractor_firm_id
        type: string
        source: input
        description: "FK -> SubcontractorFirm.id; the sourcing partner"
      - name: demand_opportunity_id
        type: string
        source: input
        description: "FK -> DemandOpportunity.id; the demand this placement covers"
      - name: fte
        type: number
        source: input
        description: full-time-equivalents the placement covers
        constraints: "0.25..10.00, 2 decimals"
      - name: start_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); INCLUSIVE first day of the placement interval"
      - name: end_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); INCLUSIVE last day of the placement interval — the interval is CLOSED [start_date, end_date] so a placement ending on D collides with one starting on D; must be >= start_date"
      - name: pass_through_rate_usd_per_hour
        type: number
        source: computed
        description: snapshot of SubcontractorFirm.pass_through_rate_usd_per_hour taken when the placement row is created
      - name: bill_rate_usd_per_hour
        type: number
        source: computed
        description: "DemandOpportunity.effective_rate_usd_per_hour at placement-approval time; 0.00 while status == REQUESTED"
      - name: status
        type: enum
        source: computed
        description: "one of {REQUESTED, APPROVED, ACTIVE, TERMINATED}"
        default: REQUESTED
      - name: terminated_on
        type: string
        source: system
        description: "ISO 8601 date (YYYY-MM-DD) the placement was terminated; null otherwise"
        default: null

  - name: DiscountApproval
    parent: null
    common_fields: true
    fields:
      - name: demand_opportunity_id
        type: string
        source: input
        description: "FK -> DemandOpportunity.id; the demand whose rate is being discounted"
      - name: requested_rate_usd_per_hour
        type: number
        source: input
        description: rate the requester wants approved, USD/hour
        constraints: "0.01..5000.00, 2 decimals; must be <= the demand's standard_rate_usd_per_hour"
      - name: standard_rate_usd_per_hour
        type: number
        source: computed
        description: snapshot of DemandOpportunity.standard_rate_usd_per_hour taken when the approval row is created
      - name: discount_pct
        type: number
        source: computed
        description: "step S1 of calculations.discount_tier_and_margin: round(100 * (1 - requested_rate_usd_per_hour / standard_rate_usd_per_hour), 2)"
      - name: provisional_realization_pct
        type: number
        source: computed
        description: "step S2: round(100.00 - discount_pct, 2); never recomputed after S2 even if later steps rewrite required_tier"
      - name: blended_cost_rate_usd_per_hour
        type: number
        source: computed
        description: "step S4 snapshot: hours-weighted cost rate over the demand's assignments with status IN {CONFIRMED, ACTIVE}; 0.00 when there are none"
      - name: projected_margin_pct
        type: number
        source: computed
        description: "step S5: round(100 * (requested_rate_usd_per_hour - blended_cost_rate_usd_per_hour) / requested_rate_usd_per_hour, 2)"
      - name: required_tier
        type: enum
        source: computed
        description: "steps S3 then S6 (single pass, no re-iteration); one of {NONE, L1_PRACTICE_PARTNER, L2_FINANCE}"
      - name: tier_escalated
        type: boolean
        source: computed
        description: "true when step S6 rewrote required_tier from L1_PRACTICE_PARTNER to L2_FINANCE because projected_margin_pct < MARGIN_FLOOR_PCT"
        default: false
      - name: status
        type: enum
        source: computed
        description: "one of {PENDING, APPROVED, REJECTED}; created PENDING unless required_tier == NONE, in which case it is created APPROVED"
        default: PENDING
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the SalesLead who filed the request; re-stamped on every revise
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the decider; must differ from requested_by_user_id; null while PENDING; the string 'SYSTEM_AUTO' when required_tier == NONE auto-approved the row at creation"
        default: null
      - name: decision_note
        type: string
        source: input
        description: free-text note supplied with the decision
        default: null
        constraints: "1..280 chars when present"
      - name: revision_count
        type: integer
        source: computed
        description: number of times POST /discount-approvals/{approvalId}/revise has moved this row REJECTED → PENDING
        default: 0

  - name: UtilizationPeriod
    parent: Consultant
    common_fields: true
    fields:
      - name: consultant_id
        type: string
        source: input
        description: "FK -> Consultant.id; the consultant whose hours the period classifies"
      - name: period_start_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); INCLUSIVE first day of the measurement period"
      - name: period_end_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); INCLUSIVE last day of the measurement period; must be >= period_start_on; periods of one consultant may not overlap"
      - name: holiday_hours
        type: number
        source: input
        description: holiday and paid-leave hours falling inside the period; removed from available capacity but still part of capacity_hours
        default: 0.00
        constraints: "0.00..2000.00, 2 decimals"
      - name: period_workdays
        type: integer
        source: computed
        description: count of Mon–Fri dates in the INCLUSIVE range [period_start_on, period_end_on]
      - name: capacity_hours
        type: number
        source: computed
        description: "round(period_workdays * 8, 2) — the conserved total the four hour buckets must add back up to"
      - name: net_available_hours
        type: number
        source: computed
        description: "round(capacity_hours - holiday_hours, 2)"
      - name: billable_hours
        type: number
        source: computed
        description: "hours booked from BILLABLE assignments per calculations.utilization_period_metrics"
      - name: investment_hours
        type: number
        source: computed
        description: "hours booked from INVESTMENT assignments plus RESKILLING / INTERNAL_PROJECT bench-spell windows per calculations.utilization_period_metrics"
      - name: bench_hours
        type: number
        source: computed
        description: "round(max(0.00, net_available_hours - billable_hours - investment_hours), 2)"
      - name: hour_overallocated
        type: boolean
        source: computed
        description: "true when billable_hours + investment_hours > net_available_hours; blocks period close"
        default: false
      - name: target_utilization_pct
        type: number
        source: computed
        description: "PracticeGroup.level_targets[Consultant.level].target_utilization_pct of the consultant's group, resolved at period-open time and frozen on the row"
      - name: utilization_pct_target_basis
        type: number
        source: computed
        description: "variant TARGET_BASIS: round(100 * billable_hours / capacity_hours, 2)"
      - name: utilization_pct_available_basis
        type: number
        source: computed
        description: "variant AVAILABLE_BASIS: round(100 * billable_hours / net_available_hours, 2); null when net_available_hours == 0.00"
      - name: utilization_pct_of_record
        type: number
        source: computed
        description: "utilization_pct_available_basis while status == OPEN; utilization_pct_target_basis once status == CLOSED"
      - name: variance_pp
        type: number
        source: computed
        description: "round(utilization_pct_of_record - target_utilization_pct, 2), in percentage points"
      - name: status
        type: enum
        source: computed
        description: "one of {OPEN, CLOSED}"
        default: OPEN

  - name: HiringForecast
    parent: null
    common_fields: false
    fields:
      - name: skill_code
        type: string
        source: input
        description: "Skill.code natural-key value the forecast is cut by (matched as Skill.code == skill_code); intentionally a code and not an id so a forecast survives skill re-registration"
        constraints: "must match the code of an existing Skill row"
      - name: geography_code
        type: enum
        source: input
        description: geography the forecast is cut by, matched against PracticeGroup.geography_code
        constraints: "one of {NA, EMEA, APAC, LATAM}"
      - name: horizon_start_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); INCLUSIVE first day of the forecast horizon"
      - name: horizon_end_on
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); INCLUSIVE last day of the forecast horizon; must be >= horizon_start_on"
      - name: basis
        type: enum
        source: input
        description: "which demand-weighting variant calculations.weighted_pipeline_demand applies; WEIGHTED counts every QUALIFIED demand at its win probability, COMMITTED counts only demands with win_probability_pct >= 70 and counts them at FULL required_fte"
        default: WEIGHTED
        constraints: "one of {WEIGHTED, COMMITTED}"
      - name: weighted_demand_fte
        type: number
        source: computed
        description: "probability-weighted demand per calculations.weighted_pipeline_demand (round per opportunity, then sum, then round)"
      - name: internal_supply_fte
        type: number
        source: computed
        description: "unallocated internal capacity able to serve the skill in this geography per calculations.weighted_pipeline_demand"
      - name: external_supply_fte
        type: number
        source: computed
        description: "partner-sourced FTE already committed to matching demand per calculations.weighted_pipeline_demand"
      - name: gap_fte
        type: number
        source: computed
        description: "round(weighted_demand_fte - internal_supply_fte - external_supply_fte, 2); negative means surplus"
      - name: recommended_hires
        type: integer
        source: computed
        description: "0 when gap_fte <= 0.00, else ceil(gap_fte / HIRE_YIELD_FTE)"
      - name: generated_at
        type: datetime
        source: system
        description: logical clock instant the snapshot was generated, ISO 8601 UTC with three fractional digits

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# Seven machines. DemandOpportunity carries TWO parallel dimensions on the same
# row (pipeline_status × staffing_status) that fork on staffing_mode and re-join
# at close; BenchSpell is cyclic; DiscountApproval is cyclic.
# -----------------------------------------------------------------------------
state_machines:

  - entity: DemandOpportunity
    dimension: pipeline_status
    initial_state: QUALIFYING
    terminal_states: [CLOSED_WON, CLOSED_LOST]
    transitions:
      - from: QUALIFYING
        to: QUALIFIED
        trigger: "POST /demand-opportunities/{opportunityId}/qualify"
        actor: SalesLead
        preconditions:
          - "pipeline_status == QUALIFYING"
          - "win_probability_pct >= 25"
          - "Skill referenced by required_skill_id has retired == false"
        side_effects:
          - "pipeline_status := QUALIFIED"
          - "weighted_fte recomputed = round(required_fte * win_probability_pct / 100, 2)"
          - "the demand enters the hiring-forecast scope (calculations.weighted_pipeline_demand counts only QUALIFIED demands)"
          - "the demand enters the external-sourcing-cap denominator of its PracticeGroup"
          - "increments DemandOpportunity.version by 1"
        note: "Unqualified demand is invisible to staffing and to the forecast; this is the input-set filter of weighted_pipeline_demand."

      - from: QUALIFIED
        to: CLOSED_WON
        trigger: "POST /demand-opportunities/{opportunityId}/close with outcome=WON"
        actor: SalesLead
        preconditions:
          - "pipeline_status == QUALIFIED"
          - "staffing_status == COVERED (the fork's join condition: open_fte == 0.00)"
          - "margin_breach == false"
        side_effects:
          - "pipeline_status := CLOSED_WON; closed_outcome := WON"
          - "INTERNAL branch only (staffing_mode == INTERNAL): every Assignment on this demand with status == CONFIRMED becomes ACTIVE, activated_on := logical clock date"
          - "EXTERNAL branch only (staffing_mode == EXTERNAL): every ExternalPlacement on this demand with status == APPROVED becomes ACTIVE"
          - "increments DemandOpportunity.version by 1"
        note: "Divergent side-effect sets per branch — internal assignments activate, external placements activate; neither branch touches the other's rows."

      - from: QUALIFIED
        to: CLOSED_LOST
        trigger: "POST /demand-opportunities/{opportunityId}/close with outcome=LOST"
        actor: SalesLead
        preconditions:
          - "pipeline_status == QUALIFIED"
        side_effects:
          - "pipeline_status := CLOSED_LOST; closed_outcome := LOST"
          - "INTERNAL branch only: every Assignment on this demand with status IN {PROPOSED, CONFIRMED} becomes CANCELLED; every Assignment with status == ACTIVE becomes RELEASED with released_on := logical clock date"
          - "EXTERNAL branch only: every ExternalPlacement on this demand with status IN {REQUESTED, APPROVED, ACTIVE} becomes TERMINATED with terminated_on := logical clock date"
          - "each newly RELEASED/CANCELLED assignment triggers the release cascade documented on Assignment.ACTIVE_to_RELEASED (consultant allocation → availability → bench spell → practice bench ratio → posture)"
          - "coverage recomputed: covered_internal_fte, covered_external_fte, open_fte, staffing_status"
          - "increments DemandOpportunity.version by 1"

      - from: QUALIFYING
        to: CLOSED_LOST
        trigger: "POST /demand-opportunities/{opportunityId}/close with outcome=LOST"
        actor: SalesLead
        preconditions:
          - "pipeline_status == QUALIFYING"
        side_effects:
          - "pipeline_status := CLOSED_LOST; closed_outcome := LOST"
          - "increments DemandOpportunity.version by 1"
        note: "An unqualified demand can be abandoned; it can never be closed WON because the join condition requires COVERED which requires a staffing_mode, and staffing-mode selection requires QUALIFIED."

  - entity: DemandOpportunity
    dimension: staffing_status
    initial_state: UNSTAFFED
    terminal_states: []
    transitions:
      - from: UNSTAFFED
        to: INTERNAL_STAFFING
        trigger: "POST /demand-opportunities/{opportunityId}/staffing-mode with mode=INTERNAL"
        actor: ResourceManager
        preconditions:
          - "pipeline_status == QUALIFIED (cross-dimension guard: the sales dimension must have advanced first)"
          - "staffing_mode IS NULL"
        side_effects:
          - "staffing_mode := INTERNAL; staffing_status := INTERNAL_STAFFING"
          - "POST /assignments and POST /demand-opportunities/{opportunityId}/auto-staff become permitted on this demand"
          - "POST /external-placements against this demand is now rejected with ERR_STAFFING_MODE_MISMATCH"
          - "increments DemandOpportunity.version by 1"

      - from: UNSTAFFED
        to: EXTERNAL_SOURCING
        trigger: "POST /demand-opportunities/{opportunityId}/staffing-mode with mode=EXTERNAL"
        actor: ResourceManager
        preconditions:
          - "pipeline_status == QUALIFIED"
          - "staffing_mode IS NULL"
        side_effects:
          - "staffing_mode := EXTERNAL; staffing_status := EXTERNAL_SOURCING"
          - "POST /external-placements becomes permitted on this demand"
          - "POST /assignments and POST /demand-opportunities/{opportunityId}/auto-staff against this demand are now rejected with ERR_STAFFING_MODE_MISMATCH"
          - "increments DemandOpportunity.version by 1"

      - from: INTERNAL_STAFFING
        to: PARTIALLY_COVERED
        trigger: "POST /assignments/{assignmentId}/confirm (system re-derivation of staffing_status)"
        actor: system
        preconditions:
          - "covered_internal_fte + covered_external_fte > 0.00 AND open_fte > 0.00"
        side_effects:
          - "staffing_status := PARTIALLY_COVERED"

      - from: PARTIALLY_COVERED
        to: COVERED
        trigger: "POST /assignments/{assignmentId}/confirm or POST /external-placements/{placementId}/approve (system re-derivation)"
        actor: system
        preconditions:
          - "open_fte == 0.00"
        side_effects:
          - "staffing_status := COVERED — this is the join gate POST /demand-opportunities/{opportunityId}/close with outcome=WON requires"

      - from: INTERNAL_STAFFING
        to: COVERED
        trigger: "POST /assignments/{assignmentId}/confirm covering the whole demand in one step (system re-derivation)"
        actor: system
        preconditions:
          - "open_fte == 0.00"
        side_effects:
          - "staffing_status := COVERED"

      - from: EXTERNAL_SOURCING
        to: PARTIALLY_COVERED
        trigger: "POST /external-placements/{placementId}/approve (system re-derivation)"
        actor: system
        preconditions:
          - "covered_external_fte > 0.00 AND open_fte > 0.00"
        side_effects:
          - "staffing_status := PARTIALLY_COVERED"

      - from: EXTERNAL_SOURCING
        to: COVERED
        trigger: "POST /external-placements/{placementId}/approve covering the whole demand (system re-derivation)"
        actor: system
        preconditions:
          - "open_fte == 0.00"
        side_effects:
          - "staffing_status := COVERED"

      - from: COVERED
        to: PARTIALLY_COVERED
        trigger: "POST /assignments/{assignmentId}/release, POST /assignments/{assignmentId}/cancel or POST /external-placements/{placementId}/terminate (system re-derivation)"
        actor: system
        preconditions:
          - "open_fte > 0.00 AND covered_internal_fte + covered_external_fte > 0.00"
        side_effects:
          - "staffing_status := PARTIALLY_COVERED — the coverage dimension is cyclic: coverage can be lost and regained without touching pipeline_status"

      - from: PARTIALLY_COVERED
        to: INTERNAL_STAFFING
        trigger: "POST /assignments/{assignmentId}/release or /cancel removing the last covering assignment (system re-derivation)"
        actor: system
        preconditions:
          - "covered_internal_fte + covered_external_fte == 0.00 AND staffing_mode == INTERNAL"
        side_effects:
          - "staffing_status := INTERNAL_STAFFING"

      - from: PARTIALLY_COVERED
        to: EXTERNAL_SOURCING
        trigger: "POST /external-placements/{placementId}/terminate removing the last covering placement (system re-derivation)"
        actor: system
        preconditions:
          - "covered_internal_fte + covered_external_fte == 0.00 AND staffing_mode == EXTERNAL"
        side_effects:
          - "staffing_status := EXTERNAL_SOURCING"

      - from: COVERED
        to: INTERNAL_STAFFING
        trigger: "POST /assignments/{assignmentId}/release or /cancel removing the ONLY covering assignment of a fully covered demand (system re-derivation)"
        actor: system
        preconditions:
          - "covered_internal_fte + covered_external_fte == 0.00 AND staffing_mode == INTERNAL"
        side_effects:
          - "staffing_status := INTERNAL_STAFFING — a demand covered by a single assignment skips PARTIALLY_COVERED entirely on the way back"

      - from: COVERED
        to: EXTERNAL_SOURCING
        trigger: "POST /external-placements/{placementId}/terminate removing the ONLY covering placement of a fully covered demand (system re-derivation)"
        actor: system
        preconditions:
          - "covered_internal_fte + covered_external_fte == 0.00 AND staffing_mode == EXTERNAL"
        side_effects:
          - "staffing_status := EXTERNAL_SOURCING — the single-placement mirror of the COVERED -> INTERNAL_STAFFING edge"

  - entity: Assignment
    initial_state: PROPOSED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /assignments/{assignmentId}/confirm"
        actor: ResourceManager
        preconditions:
          - "status == PROPOSED"
          - "DemandOpportunity.pipeline_status == QUALIFIED"
          - "DemandOpportunity.staffing_mode == INTERNAL"
          - "Consultant.availability_status IN {ASSIGNED, BENCH, INTERNAL_PROJECT} — SEPARATED is rejected with ERR_CONSULTANT_SEPARATED and RESKILLING with ERR_CONSULTANT_IN_RESKILLING"
          - "the consultant holds a SkillAssertion for DemandOpportunity.required_skill_id whose assertion_status == ACTIVE (else ERR_CERTIFICATION_EXPIRED when an EXPIRED assertion exists, ERR_PROFICIENCY_INSUFFICIENT when none exists)"
          - "that assertion's proficiency_level >= DemandOpportunity.min_proficiency_level"
          - "travel fit: DemandOpportunity.onsite_nights_per_week <= Consultant.travel_max_nights_per_week AND (DemandOpportunity.is_international == false OR Consultant.travel_willing_international == true)"
          - "PracticeGroup.posture of the demand's group != FROZEN when category == INVESTMENT"
          - "allocation capacity: for every date d in the half-open interval [start_date, end_date), SUM(allocation_pct) over the consultant's other assignments with status IN {CONFIRMED, ACTIVE} whose half-open interval contains d, plus this.allocation_pct, is <= 100.00"
          - "margin floor: round(100 * (DemandOpportunity.effective_rate_usd_per_hour - this.cost_rate_usd_per_hour) / DemandOpportunity.effective_rate_usd_per_hour, 2) >= 20.00 when category == BILLABLE"
        side_effects:
          - "status := CONFIRMED; confirmed_on := logical clock date"
          - "bill_rate_usd_per_hour re-pinned from DemandOpportunity.effective_rate_usd_per_hour (0.00 when category == INVESTMENT)"
          - "Consultant.allocated_pct recomputed"
          - "when Consultant.allocated_pct >= 50.00: Consultant.availability_status := ASSIGNED, and the consultant's open BenchSpell (state NOT IN {CLOSED, SEPARATED}) becomes CLOSED with ended_on := logical clock date and, when it was in RESKILLING or INTERNAL_PROJECT, investment_ended_on := logical clock date"
          - "that bench-spell closure decrements PracticeGroup.bench_headcount, which recomputes own_bench_ratio and rollup_bench_ratio for the group and every ancestor group, which re-derives each of their posture values"
          - "DemandOpportunity.covered_internal_fte / open_fte / staffing_status recomputed"
          - "DemandOpportunity.blended_cost_rate_usd_per_hour, blended_margin_pct and margin_breach recomputed"
          - "every OPEN UtilizationPeriod of the consultant intersecting [start_date, end_date) recomputed"
          - "increments Assignment.version by 1"

      - from: CONFIRMED
        to: ACTIVE
        trigger: "POST /bench-runs (ops checkpoint) when start_date <= logical clock date, or POST /demand-opportunities/{opportunityId}/close with outcome=WON"
        actor: system
        preconditions:
          - "status == CONFIRMED"
          - "start_date <= logical clock date (bench-run path only)"
        side_effects:
          - "status := ACTIVE; activated_on := logical clock date"
          - "DemandOpportunity.earned_realization_pct recomputed (ACTIVE assignments enter the delivered-hours denominator)"
          - "every OPEN UtilizationPeriod of the consultant intersecting the assignment interval recomputed"

      - from: ACTIVE
        to: RELEASED
        trigger: "POST /assignments/{assignmentId}/release, or POST /bench-runs when end_date <= logical clock date, or the CLOSED_LOST cascade"
        actor: ResourceManager | system
        preconditions:
          - "status == ACTIVE"
          - "release date (logical clock date) >= start_date"
        side_effects:
          - "status := RELEASED; released_on := logical clock date (this becomes the EXCLUSIVE effective end for every hour computation)"
          - "bill_rate_usd_per_hour frozen at its current value — later rate changes on the demand no longer touch this row"
          - "CASCADE HOP 1→2: Consultant.allocated_pct recomputed"
          - "CASCADE HOP 2→3: because allocated_pct fell below 50.00, Consultant.availability_status := BENCH"
          - "CASCADE HOP 3→4: because the consultant became BENCH and holds no open spell, a new BenchSpell row is created with state MONITORING, started_on := logical clock date, escalation_count 0"
          - "CASCADE HOP 4→5: because that BenchSpell row exists, PracticeGroup.bench_headcount increments and own_bench_ratio / rollup_bench_ratio are recomputed for the group and every ancestor group"
          - "CASCADE HOP 5→6: because rollup_bench_ratio crossed a breakpoint, PracticeGroup.posture is re-derived (OPEN → CONSTRAINED at >= 0.3000, → FROZEN at >= 0.5000) for the group and every ancestor group"
          - "DemandOpportunity.covered_internal_fte / open_fte / staffing_status recomputed; earned_realization_pct and blended_margin_pct recomputed"
          - "every OPEN UtilizationPeriod of the consultant intersecting the assignment interval recomputed — billable_hours falls and bench_hours rises by exactly the same amount, conserving capacity_hours"
          - "increments Assignment.version by 1"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /assignments/{assignmentId}/release"
        actor: ResourceManager
        preconditions:
          - "status == CONFIRMED"
          - "logical clock date >= start_date"
        side_effects:
          - "identical to ACTIVE → RELEASED, including every cascade hop"
        note: "A confirmed-but-not-yet-activated assignment can be released once its start date has arrived; releasing before start_date is rejected with ERR_ASSIGNMENT_STATE_INVALID."

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /assignments/{assignmentId}/cancel"
        actor: ResourceManager
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "status := CANCELLED"
          - "no consultant allocation change (PROPOSED never reserved capacity) — Consultant.allocated_pct and availability_status are untouched"
          - "DemandOpportunity coverage untouched (PROPOSED never counted toward covered_internal_fte)"
          - "increments Assignment.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /assignments/{assignmentId}/cancel"
        actor: ResourceManager
        preconditions:
          - "status == CONFIRMED"
          - "logical clock date < start_date (a started assignment must be released, not cancelled)"
        side_effects:
          - "status := CANCELLED"
          - "Consultant.allocated_pct recomputed; if it falls below 50.00 the availability → bench-spell → practice-ratio → posture cascade documented on ACTIVE → RELEASED runs identically"
          - "DemandOpportunity.covered_internal_fte / open_fte / staffing_status recomputed — this is the compensating action that restores the FTE-coverage identity"
          - "increments Assignment.version by 1"

  - entity: BenchSpell
    initial_state: MONITORING
    terminal_states: [CLOSED, SEPARATED]
    transitions:
      - from: MONITORING
        to: ESCALATED_L1
        trigger: "POST /bench-runs (ops checkpoint)"
        actor: system
        preconditions:
          - "state == MONITORING"
          - "age_days >= PracticeGroup.level_targets[Consultant.level].bench_escalation_l1_days of the consultant's group (>= , so the threshold day itself escalates)"
        side_effects:
          - "state := ESCALATED_L1; escalation_count += 1"
          - "the spell becomes eligible for reskilling enrolment and internal-project placement (both reject state == MONITORING with ERR_BENCH_SPELL_STATE_INVALID)"

      - from: ESCALATED_L1
        to: ESCALATED_L2
        trigger: "POST /bench-runs (ops checkpoint)"
        actor: system
        preconditions:
          - "state == ESCALATED_L1"
          - "age_days >= PracticeGroup.level_targets[Consultant.level].bench_escalation_l2_days"
        side_effects:
          - "state := ESCALATED_L2; escalation_count += 1"
          - "PracticeGroup.escalated_l2_count increments for the consultant's group and every ancestor group, which re-derives their posture (>= 3 forces FROZEN regardless of bench ratio)"
          - "the spell becomes eligible for a separation proposal"

      - from: ESCALATED_L1
        to: RESKILLING
        trigger: "POST /reskilling-programs/{programId}/enrollments"
        actor: ResourceManager
        preconditions:
          - "state IN {ESCALATED_L1, ESCALATED_L2}"
          - "ReskillingProgram.status IN {PLANNED, RUNNING}"
          - "ReskillingProgram.seats_taken < ReskillingProgram.seat_capacity"
          - "the cohort's CLOSED interval [cohort_start_on, cohort_end_on] intersects no assignment of this consultant with status IN {CONFIRMED, ACTIVE} on its half-open interval [start_date, end_date)"
          - "cohort_start_on > (previous COMPLETED programme's cohort_end_on + ReskillingProgram.cooldown_days) for this consultant, when such a programme exists"
        side_effects:
          - "state := RESKILLING; reskilling_program_id := the programme id; investment_started_on := logical clock date"
          - "ReskillingProgram.seats_taken recomputed (+1)"
          - "Consultant.availability_status := RESKILLING — the consultant leaves the auto-staff candidate pool and match_score for them becomes 0.0000"
          - "the consultant still counts in PracticeGroup.bench_headcount (bench_headcount counts {BENCH, RESKILLING}), so bench ratio and posture do not move"
          - "every OPEN UtilizationPeriod of the consultant intersecting the investment window recomputed — investment_hours rises, bench_hours falls by the same amount"

      - from: ESCALATED_L2
        to: RESKILLING
        trigger: "POST /reskilling-programs/{programId}/enrollments"
        actor: ResourceManager
        preconditions:
          - "identical to ESCALATED_L1 → RESKILLING"
        side_effects:
          - "identical to ESCALATED_L1 → RESKILLING, plus PracticeGroup.escalated_l2_count decrements for the group and every ancestor (the spell is no longer in ESCALATED_L2), re-deriving their posture"

      - from: RESKILLING
        to: MONITORING
        trigger: "POST /reskilling-programs/{programId}/complete"
        actor: ResourceManager
        preconditions:
          - "state == RESKILLING"
          - "ReskillingProgram.status == RUNNING"
        side_effects:
          - "state := MONITORING; age_reset_on := logical clock date (the aging clock restarts, so age_days returns to 0 and the escalation ladder can be climbed again — this closes the cycle)"
          - "escalation_count is PRESERVED (it is a lifetime counter, not an aging counter)"
          - "investment_ended_on := logical clock date"
          - "a SkillAssertion for (consultant_id, ReskillingProgram.skill_id) is created at proficiency_level = target_proficiency_level, or, when one already exists, its proficiency_level is raised to max(existing, target_proficiency_level) — this cascade-created row is discoverable only through GET /skill-assertions"
          - "Consultant.availability_status := BENCH"
          - "ReskillingProgram.seats_taken recomputed (-1)"

      - from: ESCALATED_L1
        to: INTERNAL_PROJECT
        trigger: "POST /bench-spells/{spellId}/internal-project"
        actor: ResourceManager
        preconditions:
          - "state IN {ESCALATED_L1, ESCALATED_L2}"
          - "Consultant.allocated_pct < 50.00"
        side_effects:
          - "state := INTERNAL_PROJECT; internal_project_code := the supplied code; investment_started_on := logical clock date"
          - "Consultant.availability_status := INTERNAL_PROJECT — the consultant STAYS in the auto-staff candidate pool (eligibility admits {BENCH, INTERNAL_PROJECT}) but LEAVES PracticeGroup.bench_headcount, so bench ratio drops and posture is re-derived for the group and every ancestor group"
          - "every OPEN UtilizationPeriod of the consultant intersecting the investment window recomputed — investment_hours rises, bench_hours falls by the same amount"

      - from: ESCALATED_L2
        to: INTERNAL_PROJECT
        trigger: "POST /bench-spells/{spellId}/internal-project"
        actor: ResourceManager
        preconditions:
          - "identical to ESCALATED_L1 → INTERNAL_PROJECT"
        side_effects:
          - "identical to ESCALATED_L1 → INTERNAL_PROJECT, plus PracticeGroup.escalated_l2_count decrements for the group and every ancestor, re-deriving their posture"

      - from: INTERNAL_PROJECT
        to: MONITORING
        trigger: "POST /bench-runs (ops checkpoint)"
        actor: system
        preconditions:
          - "state == INTERNAL_PROJECT"
          - "(logical clock date - investment_started_on) >= INTERNAL_PROJECT_MAX_DAYS (30)"
        side_effects:
          - "state := MONITORING; age_reset_on := logical clock date; investment_ended_on := logical clock date"
          - "Consultant.availability_status := BENCH, so PracticeGroup.bench_headcount increments again and bench ratio / posture are re-derived for the group and every ancestor group"

      - from: ESCALATED_L2
        to: SEPARATION_PROPOSED
        trigger: "POST /bench-spells/{spellId}/separation-proposal"
        actor: ResourceManager
        preconditions:
          - "state == ESCALATED_L2"
          - "escalation_count >= 2"
        side_effects:
          - "state := SEPARATION_PROPOSED; separation_proposed_by_user_id := X-User-ID of the caller"
          - "PracticeGroup.escalated_l2_count is unchanged (it counts {ESCALATED_L2, SEPARATION_PROPOSED})"

      - from: SEPARATION_PROPOSED
        to: SEPARATED
        trigger: "POST /bench-spells/{spellId}/separation-decision with decision=APPROVED"
        actor: PracticePartner
        preconditions:
          - "state == SEPARATION_PROPOSED"
          - "X-User-ID != separation_proposed_by_user_id (segregation of duties)"
          - "Consultant.allocated_pct == 0.00"
        side_effects:
          - "state := SEPARATED; separation_decision := APPROVED; separation_decided_by_user_id := X-User-ID; ended_on := logical clock date"
          - "Consultant.availability_status := SEPARATED; Consultant.separated_on := logical clock instant"
          - "the consultant leaves BOTH PracticeGroup.total_headcount and bench_headcount, and leaves escalated_l2_count, so own_bench_ratio, rollup_bench_ratio and posture are re-derived for the group and every ancestor group"
          - "the consultant is removed from every auto-staff candidate pool and from HiringForecast.internal_supply_fte"

      - from: SEPARATION_PROPOSED
        to: ESCALATED_L2
        trigger: "POST /bench-spells/{spellId}/separation-decision with decision=REJECTED"
        actor: PracticePartner
        preconditions:
          - "state == SEPARATION_PROPOSED"
          - "X-User-ID != separation_proposed_by_user_id (segregation of duties)"
        side_effects:
          - "state := ESCALATED_L2; separation_decision := REJECTED; separation_decided_by_user_id := X-User-ID"
          - "escalation_count unchanged; the spell may be proposed for separation again, re-skilled, or placed on an internal project — the rejection returns the spell to the escalation cycle"

      - from: MONITORING
        to: CLOSED
        trigger: "POST /assignments/{assignmentId}/confirm bringing Consultant.allocated_pct to >= 50.00"
        actor: system
        preconditions:
          - "state IN {MONITORING, ESCALATED_L1, ESCALATED_L2, INTERNAL_PROJECT}"
          - "Consultant.allocated_pct >= 50.00 after the confirm"
        side_effects:
          - "state := CLOSED; ended_on := logical clock date; age_days frozen"
          - "when the spell was in INTERNAL_PROJECT, investment_ended_on := logical clock date"
          - "Consultant.availability_status := ASSIGNED; PracticeGroup.bench_headcount / escalated_l2_count / bench ratios / posture re-derived for the group and every ancestor group"
        note: "A spell in RESKILLING can never be CLOSED this way: confirm rejects a consultant whose availability_status == RESKILLING with ERR_CONSULTANT_IN_RESKILLING."

  - entity: ReskillingProgram
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: RUNNING
        trigger: "POST /bench-runs (ops checkpoint)"
        actor: system
        preconditions:
          - "status == PLANNED"
          - "cohort_start_on <= logical clock date"
        side_effects:
          - "status := RUNNING"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /reskilling-programs/{programId}/complete"
        actor: ResourceManager
        preconditions:
          - "status == RUNNING"
          - "cohort_end_on <= logical clock date"
        side_effects:
          - "status := COMPLETED"
          - "every enrolled BenchSpell (state == RESKILLING, reskilling_program_id == this.id) runs the RESKILLING → MONITORING transition above, which creates or upgrades a SkillAssertion per graduate"
          - "seats_taken recomputed to 0"

  - entity: ExternalPlacement
    initial_state: REQUESTED
    terminal_states: [TERMINATED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /external-placements/{placementId}/approve"
        actor: PracticePartner
        preconditions:
          - "status == REQUESTED"
          - "SubcontractorFirm.approval_status == APPROVED"
          - "DemandOpportunity.pipeline_status == QUALIFIED AND staffing_mode == EXTERNAL"
          - "PracticeGroup.posture of the demand's group != FROZEN"
          - "PracticeGroup.posture != CONSTRAINED, OR the demand's required Skill has scarcity_index >= 0.7000 (the scarcity carve-out)"
          - "firm concurrency: for every date d in the CLOSED interval [start_date, end_date], the count of the firm's other placements with status IN {APPROVED, ACTIVE} whose CLOSED interval contains d, plus one, is <= SubcontractorFirm.max_concurrent_placements"
          - "external sourcing cap: round((SUM(fte) over APPROVED/ACTIVE placements on QUALIFIED demands of the group + this.fte) / SUM(required_fte) over QUALIFIED demands of the group, 4) <= external_sourcing_cap_pct / 100"
        side_effects:
          - "status := APPROVED; bill_rate_usd_per_hour := DemandOpportunity.effective_rate_usd_per_hour"
          - "SubcontractorFirm.active_placements_count recomputed"
          - "DemandOpportunity.covered_external_fte / open_fte / staffing_status recomputed"
          - "HiringForecast.external_supply_fte of any later-generated forecast for the demand's skill/geography now includes this fte"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /bench-runs when start_date <= logical clock date, or POST /demand-opportunities/{opportunityId}/close with outcome=WON"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "status := ACTIVE"
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /external-placements/{placementId}/terminate"
        actor: PracticePartner
        preconditions:
          - "status IN {APPROVED, ACTIVE}"
        side_effects:
          - "status := TERMINATED; terminated_on := logical clock date"
          - "SubcontractorFirm.active_placements_count recomputed, freeing the concurrency slot for the interval"
          - "DemandOpportunity.covered_external_fte / open_fte / staffing_status recomputed — this is the compensating action that restores the FTE-coverage identity exactly"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /external-placements/{placementId}/terminate"
        actor: PracticePartner
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "identical to APPROVED → TERMINATED"

  - entity: DiscountApproval
    initial_state: PENDING
    terminal_states: [APPROVED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /discount-approvals/{approvalId}/decide with decision=APPROVED"
        actor: PracticePartner | FinanceController
        preconditions:
          - "status == PENDING"
          - "X-User-ID != requested_by_user_id (segregation of duties)"
          - "the caller's role satisfies required_tier: L1_PRACTICE_PARTNER accepts PracticePartner or FinanceController; L2_FINANCE accepts FinanceController only"
          - "discount_pct <= DISCOUNT_HARD_CAP_PCT (35.00)"
        side_effects:
          - "status := APPROVED; decided_by_user_id := X-User-ID"
          - "CASCADE HOP 1→2: DemandOpportunity.approved_rate_usd_per_hour := requested_rate_usd_per_hour, so effective_rate_usd_per_hour and booked_realization_pct are recomputed"
          - "CASCADE HOP 2→3: because effective_rate_usd_per_hour changed, every Assignment on the demand with status IN {PROPOSED, CONFIRMED, ACTIVE} and category == BILLABLE has bill_rate_usd_per_hour re-pinned to the new effective rate (RELEASED and CANCELLED rows keep their frozen value)"
          - "CASCADE HOP 3→4: because those bill rates changed, DemandOpportunity.earned_realization_pct, blended_margin_pct and margin_breach are recomputed from the re-priced rows"
          - "every other DiscountApproval on the same demand with status == PENDING is left untouched (they must be decided or revised on their own)"
          - "increments DemandOpportunity.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /discount-approvals/{approvalId}/decide with decision=REJECTED"
        actor: PracticePartner | FinanceController
        preconditions:
          - "status == PENDING"
          - "X-User-ID != requested_by_user_id (segregation of duties)"
          - "the caller's role satisfies required_tier (same rule as APPROVED)"
        side_effects:
          - "status := REJECTED; decided_by_user_id := X-User-ID"
          - "DemandOpportunity.approved_rate_usd_per_hour is NOT touched — the demand keeps quoting requested_rate_usd_per_hour"
      - from: REJECTED
        to: PENDING
        trigger: "POST /discount-approvals/{approvalId}/revise"
        actor: SalesLead
        preconditions:
          - "status == REJECTED"
          - "the revised requested_rate_usd_per_hour is strictly greater than the currently stored requested_rate_usd_per_hour (a revision must give ground on price)"
        side_effects:
          - "status := PENDING; revision_count += 1; decided_by_user_id := null; requested_by_user_id := X-User-ID of the reviser"
          - "steps S1–S6 of calculations.discount_tier_and_margin are re-run from scratch against the new requested rate and the CURRENT assignment mix, so discount_pct, provisional_realization_pct, blended_cost_rate_usd_per_hour, projected_margin_pct, required_tier and tier_escalated may all change — this is the negotiation cycle"
        note: "Cyclic: PENDING → REJECTED → PENDING may repeat; revision_count records the number of rounds."

  - entity: UtilizationPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /consultants/{consultantId}/utilization-periods/{periodId}/close"
        actor: FinanceController
        preconditions:
          - "status == OPEN"
          - "period_end_on < logical clock date"
          - "hour_overallocated == false"
        side_effects:
          - "status := CLOSED"
          - "utilization_pct_of_record switches variant from AVAILABLE_BASIS to TARGET_BASIS and variance_pp is recomputed against target_utilization_pct — the same hours therefore report a different percentage after close"
          - "the row stops being recomputed: later assignment releases no longer change its hour buckets"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# Both entries are CREATE-with-supersede: a second sequential create against the
# same parent is legitimate product behaviour (a demand may carry several
# discount rounds; a consultant may carry several assignments), so the only
# deterministic way to reject a writer working from a stale view is OCC on the
# parent's `version`. Nothing here depends on request timing.
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: discount-approval-create-stale-opportunity
    parent_entity: DemandOpportunity
    write_endpoint: "POST /discount-approvals"
    occ_field: "expected_opportunity_version"
    description: |
      Creating a DiscountApproval against a DemandOpportunity whose version has
      advanced past the value the client last observed is rejected. A second
      approval on the same demand is legitimate on its own terms — the tier and
      projected margin are re-derived from the demand's current approved rate and
      assignment mix — so the request cannot be refused by any state
      precondition. The stale-version check is what makes the refusal
      deterministic: whoever quotes an outdated version must re-read the demand,
      see the rate that has since been approved, and re-price.
    error_id: ERR_STALE_OPPORTUNITY_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-consultant
    parent_entity: Consultant
    write_endpoint: "POST /assignments"
    occ_field: "expected_consultant_version"
    description: |
      Creating an Assignment for a Consultant whose version has advanced past
      the value the client last observed is rejected. A consultant may legitimately
      hold several assignments, and a PROPOSED assignment reserves no capacity, so
      no state precondition rejects the second create. The stale-version check
      forces a writer whose view of allocated_pct, availability_status or
      cost_rate_usd_per_hour predates another write to re-read the consultant
      before proposing, since match_score and cost_rate_usd_per_hour are snapshot
      at create time and never recomputed.
    error_id: ERR_STALE_CONSULTANT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# Ten rules. Four carry `variants:` (utilization_period_metrics,
# rate_realization, discount_tier_and_margin, weighted_pipeline_demand).
# -----------------------------------------------------------------------------
calculations:

  - name: consultant_availability
    trigger: "on every write that changes a consultant's assignments, bench spell state or separation decision; recomputed in the same request (consistency_model: immediate)"
    algorithm: projection
    formula: |
      allocated_pct = SUM(a.allocation_pct)
        over Assignment a WHERE a.consultant_id == c.id
          AND a.status IN {CONFIRMED, ACTIVE}
          AND a.start_date <= CLOCK_DATE < effective_end(a)
      effective_end(a) = a.released_on when a.status == RELEASED else a.end_date
        # both are EXCLUSIVE bounds, so an assignment whose end_date equals
        # CLOCK_DATE contributes 0.00

      availability_status =
        SEPARATED         when c.separated_on is not null
        RESKILLING        when the consultant's open BenchSpell.state == RESKILLING
        INTERNAL_PROJECT  when the consultant's open BenchSpell.state == INTERNAL_PROJECT
        ASSIGNED          when allocated_pct >= ASSIGNED_ALLOCATION_THRESHOLD_PCT
        BENCH             otherwise
      # The branch order is normative: a consultant with a RESKILLING spell is
      # never reported ASSIGNED even if a stray allocation exists.
    input_set: "assignments in {CONFIRMED, ACTIVE} whose half-open effective interval contains the logical clock date; the consultant's single open BenchSpell (state NOT IN {CLOSED, SEPARATED})"
    constants:
      ASSIGNED_ALLOCATION_THRESHOLD_PCT: 50.00
    precision: "allocated_pct 2 decimals, round_half_up"

  - name: match_score
    trigger: "computed once when an Assignment row is created (POST /assignments or POST /demand-opportunities/{opportunityId}/auto-staff) and stored on the row; never recomputed"
    algorithm: weighted_scoring
    formula: |
      Let d = the DemandOpportunity, c = the Consultant, and
      s = the SkillAssertion of (c.id, d.required_skill_id) with the HIGHEST
          proficiency_level among that consultant's ACTIVE assertions for the
          skill (ties broken by created_at ASC).

      skill_fit    = round(s.proficiency_level / 5, 4)
      industry_fit = round(min(1.0, years_for(c, d.industry_code) / INDUSTRY_FIT_FULL_YEARS), 4)
                     where years_for(...) = the `years` of the c.industry_experience
                     entry whose industry_code == d.industry_code, else 0.0
      dev_goal_fit = 1.0000 when c.development_goal_skill_id == d.required_skill_id else 0.0000
      travel_fit   = 0.0000 when d.onsite_nights_per_week > c.travel_max_nights_per_week
                            OR (d.is_international AND NOT c.travel_willing_international)
                     else round(1 - d.onsite_nights_per_week / 5, 4)
      cost_fit     = round(max(0.0, min(1.0,
                       (d.standard_rate_usd_per_hour - c.cost_rate_usd_per_hour)
                       / d.standard_rate_usd_per_hour)), 4)
                     # clamped at 0.0000, so every consultant costing at or above
                     # the demand's standard rate scores identically here
      cert_bonus   = CERT_BONUS when s.certification_code is not null
                                AND s.assertion_status == ACTIVE
                     else 0.0000

      raw = W_SKILL*skill_fit + W_INDUSTRY*industry_fit + W_DEV_GOAL*dev_goal_fit
          + W_TRAVEL*travel_fit + W_COST*cost_fit + cert_bonus
      match_score = min(1.0000, round(raw, 4))

      OVERRIDE: match_score = 0.0000 when c.availability_status IN {RESKILLING, SEPARATED}.
    input_set: "one demand × one consultant; only ACTIVE SkillAssertions for the demand's required skill are consulted (an EXPIRED assertion contributes neither skill_fit nor cert_bonus and makes the consultant ineligible)"
    constants:
      W_SKILL: 0.35
      W_INDUSTRY: 0.15
      W_DEV_GOAL: 0.15
      W_TRAVEL: 0.20
      W_COST: 0.15
      CERT_BONUS: 0.10
      INDUSTRY_FIT_FULL_YEARS: 3
    precision: "every component and the result at 4 decimals, round_half_up; the five weights sum to exactly 1.00 so raw <= 1.10 before the cert bonus is capped away"

  - name: auto_staff_selection
    trigger: "POST /demand-opportunities/{opportunityId}/auto-staff"
    algorithm: selector_ranking
    formula: |
      ELIGIBILITY FILTER (a consultant is a candidate only if ALL hold):
        E1 c.practice_group_id == d.practice_group_id, OR c.practice_group_id is a
           transitive descendant of d.practice_group_id
        E2 c.availability_status IN {BENCH, INTERNAL_PROJECT}
        E3 there exists a SkillAssertion (c.id, d.required_skill_id) with
           assertion_status == ACTIVE AND proficiency_level >= d.min_proficiency_level
        E4 travel_fit(c, d) > 0.0000
        E5 headroom: 100.00 - peak_allocation(c, [d.start_date, d.end_date])
           >= AUTO_STAFF_ALLOCATION_PCT, where peak_allocation is the maximum over
           every date in the demand's inclusive delivery window of the sum of
           allocation_pct of that consultant's {CONFIRMED, ACTIVE} assignments whose
           half-open interval contains the date
      RANKING (applied to the candidate set in this exact order):
        R1 match_score DESC
        R2 c.cost_rate_usd_per_hour ASC          # reachable because cost_fit clamps at 0.0000
        R3 open BenchSpell.age_days DESC          # longest-benched consultant first
        R4 c.created_at ASC                       # sole final tie-break
      OUTCOME:
        winner -> one Assignment created with status PROPOSED,
          allocation_pct = AUTO_STAFF_ALLOCATION_PCT,
          start_date = d.start_date, end_date = d.end_date + 1 day (the demand's
            end_date is INCLUSIVE, the assignment's is EXCLUSIVE),
          category = BILLABLE,
          match_score = calculations.match_score of (d, winner)
        empty candidate set -> ERR_NO_ELIGIBLE_CONSULTANT (409) and NO mutation of
          any kind: no Assignment row, no version bump on the demand or on any
          consultant, no coverage or staffing_status change.
    input_set: "every non-SEPARATED Consultant of the demand's group and its transitive descendant groups; RESKILLING consultants are excluded by E2 and would score 0.0000 anyway"
    constants:
      AUTO_STAFF_ALLOCATION_PCT: 100.00
    precision: "ranking comparisons use the stored 4-decimal match_score and the 2-decimal cost rate exactly as stored; no epsilon tolerance"

  - name: opportunity_coverage
    trigger: "on every assignment status change, external placement status change, or required_fte-affecting write on the demand"
    algorithm: aggregation
    formula: |
      covered_internal_fte = round(SUM(a.allocation_pct) / 100, 2)
        over Assignment a on the demand WHERE a.status IN {CONFIRMED, ACTIVE}
      covered_external_fte = round(SUM(p.fte), 2)
        over ExternalPlacement p on the demand WHERE p.status IN {APPROVED, ACTIVE}
      open_fte = round(max(0.00, required_fte - covered_internal_fte - covered_external_fte), 2)

      staffing_status =
        COVERED           when open_fte == 0.00 AND (covered_internal_fte + covered_external_fte) > 0.00
        PARTIALLY_COVERED when open_fte > 0.00 AND (covered_internal_fte + covered_external_fte) > 0.00
        INTERNAL_STAFFING when no coverage exists AND staffing_mode == INTERNAL
        EXTERNAL_SOURCING when no coverage exists AND staffing_mode == EXTERNAL
        UNSTAFFED         when no coverage exists AND staffing_mode is null
      # PROPOSED assignments and REQUESTED placements contribute nothing: coverage
      # only counts committed rows, which is why proposing never moves
      # staffing_status and why releasing restores the previous value exactly.
    input_set: "assignments in {CONFIRMED, ACTIVE} and external placements in {APPROVED, ACTIVE} on the one demand"
    precision: "2 decimals, round_half_up"

  - name: bench_aging_escalation
    trigger: "POST /bench-runs evaluates every open BenchSpell in ascending (started_on, created_at) order"
    algorithm: threshold
    formula: |
      age_days = CLOCK_DATE - COALESCE(age_reset_on, started_on)      # whole days
      L1 = level_target(spell.consultant).bench_escalation_l1_days
      L2 = level_target(spell.consultant).bench_escalation_l2_days
      level_target(c) = c's PracticeGroup.level_targets[c.level] when that LEVEL key
        is present in the group's object, else LEVEL_TARGET_DEFAULTS[c.level]
        (per-key fallback: a group that supplies only ANALYST still uses the
        defaults for every other level)

      state == MONITORING     AND age_days >= L1 -> ESCALATED_L1
      state == ESCALATED_L1   AND age_days >= L2 -> ESCALATED_L2
      # Inclusive thresholds: the threshold day itself escalates. A single
      # bench-run advances a spell by AT MOST ONE rung even when age_days >= L2
      # from MONITORING, so reaching ESCALATED_L2 always takes two bench-runs.
      # RESKILLING and INTERNAL_PROJECT spells never age: the RESKILLING →
      # MONITORING and INTERNAL_PROJECT → MONITORING transitions set
      # age_reset_on := CLOCK_DATE, which restarts the ladder from 0.
    input_set: "BenchSpell rows with state IN {MONITORING, ESCALATED_L1}; rows in RESKILLING, INTERNAL_PROJECT, SEPARATION_PROPOSED, CLOSED and SEPARATED are skipped by the ladder"
    constants:
      LEVEL_TARGET_DEFAULTS: |
        ANALYST:           { target_utilization_pct: 70.00, bench_escalation_l1_days: 21, bench_escalation_l2_days: 45, max_investment_pct: 20.00 }
        CONSULTANT:        { target_utilization_pct: 75.00, bench_escalation_l1_days: 14, bench_escalation_l2_days: 30, max_investment_pct: 15.00 }
        SENIOR_CONSULTANT: { target_utilization_pct: 80.00, bench_escalation_l1_days: 14, bench_escalation_l2_days: 28, max_investment_pct: 12.00 }
        MANAGER:           { target_utilization_pct: 70.00, bench_escalation_l1_days: 30, bench_escalation_l2_days: 60, max_investment_pct: 25.00 }
        PRINCIPAL:         { target_utilization_pct: 55.00, bench_escalation_l1_days: 45, bench_escalation_l2_days: 90, max_investment_pct: 35.00 }
      INTERNAL_PROJECT_MAX_DAYS: 30
    precision: "age_days is an integer count of whole days; no partial-day arithmetic anywhere"

  - name: practice_posture_rollup
    trigger: "on every consultant create, bench spell state change, separation, or assignment confirm/release that moves a consultant in or out of the bench population"
    algorithm: constraint_propagation
    formula: |
      For the touched consultant's group G and every transitive ancestor of G,
      walking child-to-parent so a parent always sees settled child values:
        own_bench_ratio    = round(bench_headcount / total_headcount, 4)      # 0.0000 when denominator 0
        rollup_bench_ratio = round(SUM(bench_headcount over self + all transitive descendants)
                                   / SUM(total_headcount over self + all transitive descendants), 4)
        posture =
          FROZEN      when rollup_bench_ratio >= POSTURE_FROZEN_RATIO
                        OR escalated_l2_count >= POSTURE_FROZEN_L2_COUNT
          CONSTRAINED when rollup_bench_ratio >= POSTURE_CONSTRAINED_RATIO
          OPEN        otherwise
      The escalated_l2_count arm is independent of headcount: three ESCALATED_L2 /
      SEPARATION_PROPOSED spells anywhere in the subtree freeze the group even at a
      0.1000 bench ratio, and a group can therefore be FROZEN while its own
      own_bench_ratio is below the CONSTRAINED threshold.
      Propagation terminates because the parent chain is acyclic (POST
      /practice-groups rejects a parent_group_id that would close a cycle with
      ERR_GROUP_CYCLE) and each group is visited exactly once.
    input_set: "the touched group plus every transitive ancestor; sibling subtrees are re-read for the rollup numerator/denominator but their own posture is not recomputed"
    constants:
      POSTURE_CONSTRAINED_RATIO: 0.3000
      POSTURE_FROZEN_RATIO: 0.5000
      POSTURE_FROZEN_L2_COUNT: 3
    precision: "ratios 4 decimals, round_half_up; threshold comparisons are >= on the ROUNDED ratio"

  - name: utilization_period_metrics
    trigger: "on UtilizationPeriod create, on every assignment confirm/activate/release/cancel intersecting the period while status == OPEN, on every bench-spell investment window change, and once more at period close"
    algorithm: aggregation
    formula: |
      period_workdays  = count of Mon–Fri dates in the INCLUSIVE range
                         [period_start_on, period_end_on]
      capacity_hours   = round(period_workdays * WORKDAY_HOURS, 2)
      net_available_hours = round(capacity_hours - holiday_hours, 2)

      billable_hours = round(SUM over Assignment a of the consultant WHERE
                         a.category == BILLABLE AND a.status IN {CONFIRMED, ACTIVE, RELEASED}
                         of (a.allocation_pct / 100) * overlap_workdays(a) * WORKDAY_HOURS, 2)
      investment_hours = round(
                         SUM over Assignment a WHERE a.category == INVESTMENT AND
                           a.status IN {CONFIRMED, ACTIVE, RELEASED}
                           of (a.allocation_pct / 100) * overlap_workdays(a) * WORKDAY_HOURS
                       + SUM over BenchSpell s of the consultant WHERE
                           s.investment_started_on is not null
                           of investment_overlap_workdays(s) * WORKDAY_HOURS, 2)
      overlap_workdays(a) = count of Mon–Fri dates in
                         [max(a.start_date, period_start_on),
                          min(effective_end(a), period_end_on + 1 day))   # half-open on the right
                         where effective_end(a) = a.released_on when a.status == RELEASED
                                                  else a.end_date
      investment_overlap_workdays(s) = count of Mon–Fri dates in
                         [max(s.investment_started_on, period_start_on),
                          min(COALESCE(s.investment_ended_on, period_end_on + 1 day),
                              period_end_on + 1 day))                     # half-open on the right
      bench_hours = round(max(0.00,
                        net_available_hours - billable_hours - investment_hours), 2)
      hour_overallocated = (billable_hours + investment_hours) > net_available_hours

      CONSERVATION INVARIANT (holds exactly whenever hour_overallocated == false):
        billable_hours + investment_hours + bench_hours + holiday_hours == capacity_hours
      A release therefore never destroys hours: whatever billable_hours loses,
      bench_hours gains, penny for penny.

      target_utilization_pct = level_target(consultant).target_utilization_pct,
        resolved when the period row is created and FROZEN on the row thereafter
        (a later change to PracticeGroup.level_targets does not move it)
      variance_pp = round(utilization_pct_of_record - target_utilization_pct, 2)
    input_set: "assignments of the one consultant in {CONFIRMED, ACTIVE, RELEASED} overlapping the period, plus that consultant's bench-spell investment windows; PROPOSED and CANCELLED assignments contribute zero hours"
    constants:
      WORKDAY_HOURS: 8
      LEVEL_TARGET_DEFAULTS: "same table as bench_aging_escalation.constants.LEVEL_TARGET_DEFAULTS"
    precision: "hours 2 decimals, round_half_up; percentages 2 decimals, round_half_up; workday counts are integers"
    variants:
      - name: TARGET_BASIS
        when: "status == CLOSED — the period is being reported against the firm's target, so the full calendar capacity is the denominator"
        difference: "utilization_pct_target_basis = round(100 * billable_hours / capacity_hours, 2); holiday and paid leave DILUTE the number because they stay in the denominator"
      - name: AVAILABLE_BASIS
        when: "status == OPEN — the period is being managed in-flight, so only hours the consultant could actually have sold are the denominator"
        difference: "utilization_pct_available_basis = round(100 * billable_hours / net_available_hours, 2), null when net_available_hours == 0.00; holiday hours are removed from the denominator so the same booked hours report HIGHER than under TARGET_BASIS whenever holiday_hours > 0.00"
    variant_selection: "utilization_pct_of_record is utilization_pct_available_basis while status == OPEN and utilization_pct_target_basis once status == CLOSED; closing a period therefore changes the reported percentage and variance_pp WITHOUT any hour changing"

  - name: rate_realization
    trigger: "on every write that changes a demand's effective rate, its assignment mix, or an assignment's status"
    algorithm: aggregation
    formula: |
      booked_realization_pct = round(100 * effective_rate_usd_per_hour
                                     / standard_rate_usd_per_hour, 2)

      delivered_hours(a) = (a.allocation_pct / 100) * delivered_workdays(a) * WORKDAY_HOURS
      delivered_workdays(a) = count of Mon–Fri dates in
        [a.start_date, min(effective_end(a), CLOCK_DATE + 1 day))
        # half-open; future-dated days are NOT delivered
      total_delivered_hours = SUM(delivered_hours(a)) over Assignment a on the demand
        WHERE a.status IN {CONFIRMED, ACTIVE, RELEASED}

      earned_realization_pct =
        null when total_delivered_hours == 0
        else round(100 * SUM(a.bill_rate_usd_per_hour * delivered_hours(a))
                       / (standard_rate_usd_per_hour * total_delivered_hours), 2)
      # INVESTMENT assignments carry bill_rate_usd_per_hour == 0.00 and DO count in
      # the denominator, so every investment hour drags earned realization down
      # while leaving booked realization untouched.

      blended_cost_rate_usd_per_hour =
        0.00 when total committed hours == 0
        else round(SUM(a.cost_rate_usd_per_hour * delivered_hours(a))
                   / total_delivered_hours, 2)
      blended_margin_pct = null when blended_cost_rate_usd_per_hour == 0.00
        else round(100 * (effective_rate_usd_per_hour - blended_cost_rate_usd_per_hour)
                   / effective_rate_usd_per_hour, 2)
      margin_breach = blended_margin_pct is not null AND blended_margin_pct < MARGIN_FLOOR_PCT
    input_set: "assignments on the one demand in {CONFIRMED, ACTIVE, RELEASED}; PROPOSED and CANCELLED rows are excluded from both variants"
    constants:
      WORKDAY_HOURS: 8
      MARGIN_FLOOR_PCT: 20.00
    precision: "2 decimals, round_half_up; the ratio is rounded ONCE at the end, never per assignment"
    variants:
      - name: BOOKED
        when: "always available — it is a pure price ratio and needs no delivery history"
        difference: "uses only effective_rate_usd_per_hour / standard_rate_usd_per_hour; never null; unaffected by assignment category or hours"
      - name: EARNED
        when: "available only once total_delivered_hours > 0; null before any assignment has delivered a workday"
        difference: "hours-weighted over the actual mix, so BILLABLE-only delivery makes EARNED equal BOOKED while any INVESTMENT hours push EARNED strictly below BOOKED"
    variant_selection: "both variants are persisted side by side on DemandOpportunity (booked_realization_pct and earned_realization_pct); no context switches between them, and the pair is the reconciliation the finance role reads"

  - name: discount_tier_and_margin
    trigger: "POST /discount-approvals (creation) and POST /discount-approvals/{approvalId}/revise (re-run from scratch)"
    algorithm: tiered_pricing
    formula: |
      SINGLE PASS, steps in this exact order. No step re-reads a value written by
      a later step, and the pass is NOT iterated to a fixed point.

      S1 standard_rate_usd_per_hour := d.standard_rate_usd_per_hour   (snapshot)
         discount_pct := round(100 * (standard_rate_usd_per_hour
                                      - requested_rate_usd_per_hour)
                               / standard_rate_usd_per_hour, 2)
      S2 provisional_realization_pct := round(100 * requested_rate_usd_per_hour
                                              / standard_rate_usd_per_hour, 2)
      S3 blended_cost_rate_usd_per_hour := (see variants below)
      S4 projected_margin_pct := round(100 * (requested_rate_usd_per_hour
                                              - blended_cost_rate_usd_per_hour)
                                       / requested_rate_usd_per_hour, 2)
      S5 required_tier :=
           NONE               when discount_pct <= TIER_NONE_MAX_PCT
           L1_PRACTICE_PARTNER when TIER_NONE_MAX_PCT < discount_pct <= TIER_L1_MAX_PCT
           L2_FINANCE         when discount_pct > TIER_L1_MAX_PCT
      S6 when projected_margin_pct < MARGIN_FLOOR_PCT AND required_tier != L2_FINANCE:
           required_tier := L2_FINANCE ; tier_escalated := true
      S7 when required_tier == NONE:
           status := APPROVED ; decided_by_user_id := 'SYSTEM_AUTO' ;
           the demand's approved_rate_usd_per_hour := requested_rate_usd_per_hour
           and the full rate cascade of the PENDING → APPROVED transition runs
         otherwise:
           status := PENDING
      Order sensitivity is the whole point of S6 sitting before S7: a 4.00%
      discount that projects a 16.67% margin is escalated to L2_FINANCE by S6 and
      therefore does NOT auto-approve at S7, even though its discount alone would
      have needed no approval at all.
    input_set: "the one demand, plus its assignments in {CONFIRMED, ACTIVE} for the MIX_WEIGHTED variant"
    constants:
      TIER_NONE_MAX_PCT: 5.00
      TIER_L1_MAX_PCT: 15.00
      DISCOUNT_HARD_CAP_PCT: 35.00
      MARGIN_FLOOR_PCT: 20.00
      STANDARD_COST_RATE_BY_PROFICIENCY: "{ 1: 45.00, 2: 60.00, 3: 80.00, 4: 105.00, 5: 130.00 }"
    precision: "2 decimals, round_half_up on every step; the tier comparison uses the ROUNDED discount_pct, so a raw 5.004% discount rounds to 5.00 and stays in tier NONE"
    variants:
      - name: MIX_WEIGHTED
        when: "the demand has at least one Assignment with status IN {CONFIRMED, ACTIVE}"
        difference: "blended_cost_rate_usd_per_hour = round(SUM(a.cost_rate_usd_per_hour * delivered_hours(a)) / SUM(delivered_hours(a)), 2) over those assignments, falling back to an equal weighting by allocation_pct when no workday has yet been delivered — the real staffed cost, which can be far above the level floor"
      - name: LEVEL_FLOOR
        when: "the demand has no Assignment in {CONFIRMED, ACTIVE} (nothing is staffed yet, so there is no cost mix to weight)"
        difference: "blended_cost_rate_usd_per_hour = STANDARD_COST_RATE_BY_PROFICIENCY[d.min_proficiency_level] — a policy proxy, not an observed cost, so the same requested rate can pass the margin floor before staffing and fail it after"
    variant_selection: "chosen by the presence of committed assignments at the moment S3 runs; a revise after the first assignment is confirmed therefore switches variant and can move required_tier even though requested_rate_usd_per_hour did not change"

  - name: weighted_pipeline_demand
    trigger: "POST /hiring-forecasts — snapshot computed once at creation and frozen on the immutable row"
    algorithm: forward_looking
    formula: |
      SCOPE: DemandOpportunity rows d WHERE
        d.pipeline_status == QUALIFIED
        AND Skill(d.required_skill_id).code == forecast.skill_code
        AND PracticeGroup(d.practice_group_id).geography_code == forecast.geography_code
        AND d.start_date <= forecast.horizon_end_on
        AND d.end_date   >= forecast.horizon_start_on
      # QUALIFYING demand is invisible (sales has not committed to it) and both
      # CLOSED_WON and CLOSED_LOST are out of scope (won demand is already staffed
      # or externally sourced, lost demand is gone).

      weighted_demand_fte = round(SUM over d of contribution(d), 2)
        where contribution(d) is ROUNDED PER OPPORTUNITY to 2 decimals BEFORE the
        sum — it is exactly the value stored in d.weighted_fte. Summing the raw
        products and rounding once at the end is WRONG and gives a different
        answer (three 0.25-FTE demands at 33% give 0.08 each and 0.24 in total,
        not the 0.2475 -> 0.25 a sum-then-round would report).

      internal_supply_fte = round(SUM over Consultant c of
                              (100 - c.allocated_pct) / 100, 2)
        over c WHERE PracticeGroup(c.practice_group_id).geography_code ==
                       forecast.geography_code
          AND c.availability_status IN {BENCH, INTERNAL_PROJECT}
          AND c has a SkillAssertion for the forecast's skill with
              assertion_status == ACTIVE AND proficiency_level >= SUPPLY_MIN_PROFICIENCY
        # RESKILLING consultants are NOT supply: they are mid-programme and their
        # future assertion does not exist yet. SEPARATED consultants are not supply.
      external_supply_fte = round(SUM(p.fte), 2) over ExternalPlacement p WHERE
        p.status IN {APPROVED, ACTIVE} AND p's demand is in SCOPE above

      gap_fte = round(weighted_demand_fte - internal_supply_fte - external_supply_fte, 2)
      recommended_hires = 0 when gap_fte <= 0.00
                          else ceil(gap_fte / HIRE_YIELD_FTE)
      # ceil, not round: half a hire cannot be recruited. A 0.24 gap still
      # recommends 1 hire, and a 1.30 gap recommends 2 (1.30 / 0.85 = 1.5294 -> 2).
    input_set: "QUALIFIED demands intersecting the horizon for the skill/geography cut; bench and internal-project consultants in the geography holding an ACTIVE assertion at proficiency >= 3; APPROVED/ACTIVE placements on in-scope demands"
    constants:
      HIRE_YIELD_FTE: 0.85
      SUPPLY_MIN_PROFICIENCY: 3
      COMMITTED_PROBABILITY_FLOOR_PCT: 70
    precision: "FTE values 2 decimals, round_half_up; recommended_hires is an integer produced by ceil, never by rounding"
    variants:
      - name: WEIGHTED
        when: "forecast.basis == WEIGHTED (the default)"
        difference: "contribution(d) = round(d.required_fte * d.win_probability_pct / 100, 2) for EVERY in-scope demand — low-probability demand still moves the forecast a little"
      - name: COMMITTED
        when: "forecast.basis == COMMITTED"
        difference: "in-scope demands with win_probability_pct < COMMITTED_PROBABILITY_FLOOR_PCT contribute 0.00 and are dropped entirely; the survivors contribute their FULL round(d.required_fte, 2), not a probability-weighted share — so COMMITTED can report both LESS (long tail dropped) and MORE (survivors counted whole) than WEIGHTED on the same data"
    variant_selection: "the `basis` input field on POST /hiring-forecasts; the value is stored on the immutable row so a reader always knows which variant produced the numbers"

# -----------------------------------------------------------------------------
# §1.4 Validation Order Table
# Priorities are a TOTAL order: when a single request violates several rules the
# error with the LOWEST priority number is returned and no mutation occurs.
# Bands: 1–3 auth/shape · 4–5 existence · 6 ownership · 7 OCC · 8–18 state
#        19–22 safety/compliance · 23–34 constraint · 35–37 referential
#        38–41 fiscal · 42–44 capacity/posture.
# Domain rationale for the business bands: a consulting firm refuses on
# compliance grounds (who may approve what, is the certification still valid)
# before it refuses on scheduling grounds, and on scheduling grounds before it
# argues about price and capacity — a badly-priced but legal assignment is a
# negotiation, an illegally-approved one is an audit finding.
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the §1.7 role names; X-User-ID header present and non-empty; for identity: entity_backed roles the id must be the id of an existing row of the backing entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the caller's X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body shape: unknown keys rejected, required fields present, types/enums/numeric ranges/decimal widths as declared in §1.1, ISO 8601 date and date-time formats well formed, intra-payload ordering (end_date > start_date for Assignment, end_date >= start_date for DemandOpportunity, cohort_end_on >= cohort_start_on, period_end_on >= period_start_on, horizon_end_on >= horizon_start_on), pagination limit 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every templated id in the PATH resolves to an existing row, checked LEFT TO RIGHT: for POST /consultants/{id}/utilization-periods/{periodId}/close the consultant is checked before the period, and a bad consultant id with a bad period id returns ERR_CONSULTANT_NOT_FOUND"
    error_id: "ERR_PRACTICE_GROUP_NOT_FOUND | ERR_SKILL_NOT_FOUND | ERR_CONSULTANT_NOT_FOUND | ERR_SKILL_ASSERTION_NOT_FOUND | ERR_OPPORTUNITY_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_BENCH_SPELL_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_FIRM_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_APPROVAL_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_FORECAST_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a templated path segment"

  - priority: 5
    category: existence
    check: "every FK supplied in the request BODY resolves to an existing row, checked in the order the fields are DECLARED in §1.1 for the target entity: POST /assignments checks consultant_id before demand_opportunity_id; POST /external-placements checks subcontractor_firm_id before demand_opportunity_id; a period-scoped nested path is checked before any body FK"
    error_id: "same 404 catalog as priority 4"
    http_status: 404
    applies_to: "POST /consultants, POST /skill-assertions, POST /demand-opportunities, POST /assignments, POST /reskilling-programs, POST /reskilling-programs/{id}/enrollments, POST /external-placements, POST /discount-approvals, PATCH /consultants/{id}, PATCH /practice-groups/{id}"

  - priority: 6
    category: auth
    check: "a caller whose role is Consultant may only read or write rows belonging to the Consultant row whose id equals X-User-ID: GET /consultants/{id} with a foreign id, GET /consultants/{id}/utilization-periods of another consultant, POST /skill-assertions with a foreign consultant_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /consultants/{id}, GET /consultants/{id}/utilization-periods, GET /consultants/{id}/utilization-periods/{periodId}, POST /skill-assertions, PATCH /skill-assertions/{id}"

  - priority: 7
    category: business_constraint
    check: "the supplied expected_<parent>_version equals the parent's current version, per the §1.2.1 concurrency rule guarding the endpoint; checked AFTER existence so a request quoting both a missing FK and a stale version returns the 404"
    error_id: "ERR_STALE_OPPORTUNITY_VERSION | ERR_STALE_CONSULTANT_VERSION"
    http_status: 412
    applies_to: "POST /discount-approvals, POST /assignments"

  - priority: 8
    category: state
    check: "the DemandOpportunity is in a pipeline_status that permits the operation: qualify requires QUALIFYING; staffing-mode requires QUALIFYING or QUALIFIED and an unset staffing_mode; close requires QUALIFIED; auto-staff, POST /assignments and POST /external-placements require QUALIFIED"
    error_id: ERR_OPPORTUNITY_STATE_INVALID
    http_status: 409
    applies_to: "POST /demand-opportunities/{id}/qualify, POST /demand-opportunities/{id}/staffing-mode, POST /demand-opportunities/{id}/close, POST /demand-opportunities/{id}/auto-staff, POST /assignments, POST /external-placements, POST /discount-approvals"

  - priority: 9
    category: state
    check: "the Assignment is in a status that permits the operation: confirm requires PROPOSED; release requires CONFIRMED or ACTIVE; cancel requires PROPOSED or CONFIRMED; a second confirm, or a release of an already RELEASED row, is rejected here (idempotency is NOT granted)"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm, POST /assignments/{id}/release, POST /assignments/{id}/cancel"

  - priority: 10
    category: state
    check: "the BenchSpell is in a state that permits the operation: enrollment requires ESCALATED_L1 or ESCALATED_L2; internal-project requires ESCALATED_L1 or ESCALATED_L2; separation-proposal requires ESCALATED_L2; separation-decision requires SEPARATION_PROPOSED; CLOSED and SEPARATED spells accept nothing"
    error_id: ERR_BENCH_SPELL_STATE_INVALID
    http_status: 409
    applies_to: "POST /bench-spells/{id}/internal-project, POST /bench-spells/{id}/separation-proposal, POST /bench-spells/{id}/separation-decision, POST /reskilling-programs/{id}/enrollments"

  - priority: 11
    category: state
    check: "the ReskillingProgram is in a status that permits the operation: enrollment requires PLANNED or RUNNING; complete requires RUNNING and cohort_end_on <= the logical clock date"
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /reskilling-programs/{id}/enrollments, POST /reskilling-programs/{id}/complete"

  - priority: 12
    category: state
    check: "the ExternalPlacement is in a status that permits the operation: approve requires REQUESTED; terminate requires APPROVED or ACTIVE"
    error_id: ERR_PLACEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /external-placements/{id}/approve, POST /external-placements/{id}/terminate"

  - priority: 13
    category: state
    check: "the DiscountApproval is in a status that permits the operation: decide requires PENDING; revise requires REJECTED; an APPROVED row is terminal and accepts neither"
    error_id: ERR_APPROVAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /discount-approvals/{id}/decide, POST /discount-approvals/{id}/revise"

  - priority: 14
    category: state
    check: "the UtilizationPeriod is OPEN and its period_end_on is strictly before the logical clock date when close is called; a CLOSED period accepts no further operation"
    error_id: ERR_PERIOD_STATE_INVALID
    http_status: 409
    applies_to: "POST /consultants/{id}/utilization-periods/{periodId}/close"

  - priority: 15
    category: state
    check: "a Skill with retired == true may not be referenced by a new DemandOpportunity, a new ReskillingProgram, or a qualify call"
    error_id: ERR_SKILL_RETIRED
    http_status: 409
    applies_to: "POST /demand-opportunities, POST /reskilling-programs, POST /demand-opportunities/{id}/qualify"

  - priority: 16
    category: state
    check: "the DemandOpportunity has a non-null staffing_mode before any staffing action is attempted: auto-staff, POST /assignments and POST /external-placements all require the branch to have been selected"
    error_id: ERR_STAFFING_MODE_NOT_SET
    http_status: 409
    applies_to: "POST /demand-opportunities/{id}/auto-staff, POST /assignments, POST /external-placements"

  - priority: 17
    category: state
    check: "the Consultant has availability_status != SEPARATED for any staffing, assertion or enrolment write"
    error_id: ERR_CONSULTANT_SEPARATED
    http_status: 409
    applies_to: "POST /assignments, POST /assignments/{id}/confirm, POST /skill-assertions, POST /reskilling-programs/{id}/enrollments, POST /consultants/{id}/utilization-periods"

  - priority: 18
    category: state
    check: "the Consultant has availability_status != RESKILLING when an assignment is confirmed — a consultant mid-programme is not staffable even though a PROPOSED assignment could be created before the enrolment"
    error_id: ERR_CONSULTANT_IN_RESKILLING
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm"

  - priority: 19
    category: business_safety
    check: "segregation of duties on X-User-ID: the user deciding a DiscountApproval must differ from requested_by_user_id, and the user deciding a separation must differ from separation_proposed_by_user_id"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /discount-approvals/{id}/decide, POST /bench-spells/{id}/separation-decision"

  - priority: 20
    category: business_safety
    check: "the caller's role satisfies DiscountApproval.required_tier: L1_PRACTICE_PARTNER admits PracticePartner or FinanceController, L2_FINANCE admits FinanceController only; a PracticePartner deciding an L2_FINANCE row is rejected here even though the endpoint's roles list admits the role"
    error_id: ERR_APPROVAL_TIER_INSUFFICIENT
    http_status: 403
    applies_to: "POST /discount-approvals/{id}/decide"

  - priority: 21
    category: business_safety
    check: "the SkillAssertion backing a confirm has assertion_status == ACTIVE — a certification that lapsed on or before the logical clock date makes the assertion EXPIRED and the consultant unconfirmable"
    error_id: ERR_CERTIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm"

  - priority: 22
    category: business_safety
    check: "a separation proposal requires BenchSpell.escalation_count >= 2, and a separation decision of APPROVED requires Consultant.allocated_pct == 0.00"
    error_id: ERR_SEPARATION_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /bench-spells/{id}/separation-proposal, POST /bench-spells/{id}/separation-decision"

  - priority: 23
    category: business_constraint
    check: "uniqueness: PracticeGroup.name, Skill.code, Consultant.email and SubcontractorFirm.name are each unique across their collection, and at most one SkillAssertion may exist per (consultant_id, skill_id) pair"
    error_id: ERR_UNIQUENESS_CONFLICT
    http_status: 409
    applies_to: "POST /practice-groups, POST /skills, POST /consultants, POST /subcontractor-firms, POST /skill-assertions"

  - priority: 24
    category: business_referential
    check: "parent_group_id must not equal the group's own id and must not close a cycle through the transitive parent chain"
    error_id: ERR_GROUP_CYCLE
    http_status: 409
    applies_to: "POST /practice-groups, PATCH /practice-groups/{id}"

  - priority: 25
    category: business_constraint
    check: "the consultant holds an ACTIVE SkillAssertion for the demand's required_skill_id whose proficiency_level >= DemandOpportunity.min_proficiency_level"
    error_id: ERR_PROFICIENCY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm"

  - priority: 26
    category: business_constraint
    check: "travel fit: DemandOpportunity.onsite_nights_per_week <= Consultant.travel_max_nights_per_week, and when the demand is_international the consultant must have travel_willing_international == true"
    error_id: ERR_TRAVEL_CONSTRAINT_VIOLATED
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm"

  - priority: 27
    category: business_temporal
    check: "UtilizationPeriod rows of one consultant may not overlap on their INCLUSIVE [period_start_on, period_end_on] ranges; a period starting on the day a previous one ends is an overlap"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /consultants/{id}/utilization-periods"

  - priority: 28
    category: business_temporal
    check: "the programme's INCLUSIVE cohort window [cohort_start_on, cohort_end_on] must not intersect any {CONFIRMED, ACTIVE} assignment of the enrolling consultant on that assignment's HALF-OPEN interval [start_date, end_date) — an assignment ending exactly on cohort_start_on does NOT conflict, one starting exactly on cohort_end_on DOES"
    error_id: ERR_COHORT_CONFLICTS_WITH_ASSIGNMENT
    http_status: 409
    applies_to: "POST /reskilling-programs/{id}/enrollments"

  - priority: 29
    category: business_temporal
    check: "cohort_start_on must be strictly greater than (the cohort_end_on of the consultant's most recent COMPLETED programme + ReskillingProgram.cooldown_days of the NEW programme)"
    error_id: ERR_RESKILLING_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /reskilling-programs/{id}/enrollments"

  - priority: 30
    category: business_constraint
    check: "seats_taken < seat_capacity at the moment of enrolment"
    error_id: ERR_COHORT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /reskilling-programs/{id}/enrollments"

  - priority: 31
    category: business_temporal
    check: "for every date in the placement's CLOSED interval [start_date, end_date], the firm's {APPROVED, ACTIVE} placements covering that date plus this one must not exceed SubcontractorFirm.max_concurrent_placements; because the interval is CLOSED, a placement ending on D and one starting on D DO collide on D — the opposite of the Assignment interval convention"
    error_id: ERR_FIRM_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /external-placements/{id}/approve"

  - priority: 32
    category: business_constraint
    check: "for every date in the assignment's HALF-OPEN interval [start_date, end_date), the consultant's committed allocation from {CONFIRMED, ACTIVE} assignments plus this assignment's allocation_pct must not exceed 100.00; an allocation summing to exactly 100.00 is allowed"
    error_id: ERR_ALLOCATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm"

  - priority: 33
    category: business_constraint
    check: "a UtilizationPeriod with hour_overallocated == true (billable_hours + investment_hours > net_available_hours) may not be closed"
    error_id: ERR_HOUR_OVERALLOCATION
    http_status: 409
    applies_to: "POST /consultants/{id}/utilization-periods/{periodId}/close"

  - priority: 34
    category: business_constraint
    check: "the auto-staff eligibility filter of calculations.auto_staff_selection yields at least one candidate; on an empty pool nothing is created and no version anywhere advances"
    error_id: ERR_NO_ELIGIBLE_CONSULTANT
    http_status: 409
    applies_to: "POST /demand-opportunities/{id}/auto-staff"

  - priority: 35
    category: business_referential
    check: "Consultant.home_geo_code must equal the geography_code of its PracticeGroup, and HiringForecast.skill_code must match the code of an existing Skill"
    error_id: ERR_GEOGRAPHY_MISMATCH
    http_status: 409
    applies_to: "POST /consultants, PATCH /consultants/{id}, POST /hiring-forecasts"

  - priority: 36
    category: business_referential
    check: "the staffing branch matches the channel: POST /assignments and auto-staff require DemandOpportunity.staffing_mode == INTERNAL; POST /external-placements and its approve require staffing_mode == EXTERNAL"
    error_id: ERR_STAFFING_MODE_MISMATCH
    http_status: 409
    applies_to: "POST /assignments, POST /demand-opportunities/{id}/auto-staff, POST /external-placements, POST /external-placements/{id}/approve"

  - priority: 37
    category: business_referential
    check: "SubcontractorFirm.approval_status == APPROVED (PENDING and SUSPENDED firms may not be used), and SubcontractorFirm.geo_code must equal the demand's PracticeGroup.geography_code"
    error_id: ERR_FIRM_NOT_APPROVED
    http_status: 409
    applies_to: "POST /external-placements, POST /external-placements/{id}/approve"

  - priority: 38
    category: business_fiscal
    check: "DiscountApproval.requested_rate_usd_per_hour must be <= the demand's standard_rate_usd_per_hour (a premium is not a discount), and DemandOpportunity.requested_rate_usd_per_hour must be <= standard_rate_usd_per_hour at create time"
    error_id: ERR_RATE_ABOVE_STANDARD
    http_status: 422
    applies_to: "POST /demand-opportunities, POST /discount-approvals, POST /discount-approvals/{id}/revise"

  - priority: 39
    category: business_fiscal
    check: "the computed discount_pct must not exceed DISCOUNT_HARD_CAP_PCT (35.00); no role may approve beyond the cap, so the create is refused rather than routed to a tier"
    error_id: ERR_DISCOUNT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /discount-approvals, POST /discount-approvals/{id}/decide, POST /discount-approvals/{id}/revise"

  - priority: 40
    category: business_fiscal
    check: "confirming an assignment must not drive the demand's blended_margin_pct below MARGIN_FLOOR_PCT (20.00); the margin is projected WITH the candidate assignment included before the write is accepted"
    error_id: ERR_MARGIN_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /assignments/{id}/confirm"

  - priority: 41
    category: business_fiscal
    check: "a revised requested_rate_usd_per_hour must be strictly greater than the currently stored value"
    error_id: ERR_REVISION_NOT_HIGHER
    http_status: 422
    applies_to: "POST /discount-approvals/{id}/revise"

  - priority: 42
    category: business_constraint
    check: "the demand's PracticeGroup.posture must not be FROZEN for any external sourcing write; a FROZEN posture admits no carve-out"
    error_id: ERR_PRACTICE_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /external-placements, POST /external-placements/{id}/approve"

  - priority: 43
    category: business_constraint
    check: "when the demand's PracticeGroup.posture is CONSTRAINED, external sourcing is refused UNLESS the demand's required Skill has scarcity_index >= 0.7000"
    error_id: ERR_PRACTICE_POSTURE_CONSTRAINED
    http_status: 409
    applies_to: "POST /external-placements, POST /external-placements/{id}/approve"

  - priority: 44
    category: business_fiscal
    check: "approving the placement must keep round((committed external FTE on the group's QUALIFIED demands + this placement's fte) / (SUM of required_fte over the group's QUALIFIED demands), 4) at or below PracticeGroup.external_sourcing_cap_pct / 100"
    error_id: ERR_EXTERNAL_SOURCING_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /external-placements/{id}/approve"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Flat top-level collections (api_prefix is ""). Two nested read paths exist
# (child-groups under a group, utilization periods under a consultant); every
# other relationship is reached through a filtered list. `{id}` always names the
# id of the collection the segment belongs to; a nested child's id gets its own
# placeholder name.
# Fields suffixed `?` are optional; all others are required.
# -----------------------------------------------------------------------------
endpoints:

  # --- PracticeGroup -----------------------------------------------------
  - method: POST
    path: "/practice-groups"
    description: "Register a practice group, optionally under a parent group, with its external sourcing cap and per-level utilization / bench-aging targets."
    roles: [PracticePartner]
    code: 201
    input: [name, geography_code, "parent_group_id?", "external_sourcing_cap_pct?", "level_targets?"]
    output: PracticeGroup
    side_effects:
      - "total_headcount, bench_headcount, escalated_l2_count all 0; own_bench_ratio and rollup_bench_ratio 0.0000; posture OPEN"
      - "when parent_group_id is supplied, the parent chain's rollup_bench_ratio and posture are recomputed per calculations.practice_posture_rollup"
      - "any LEVEL key absent from level_targets falls back per-key to LEVEL_TARGET_DEFAULTS"

  - method: GET
    path: "/practice-groups"
    description: "List practice groups, filterable by geography and by parent (parent_group_id also serves as the reverse-reachability filter for the self-referential FK)."
    roles: [PracticePartner, ResourceManager, FinanceController, SalesLead]
    code: 200
    input: ["geography_code?", "parent_group_id?", "posture?", "limit?", "offset?"]
    output: PracticeGroup[]
    side_effects: []

  - method: GET
    path: "/practice-groups/{id}"
    description: "Read one practice group including its derived headcounts, bench ratios and posture."
    roles: [PracticePartner, ResourceManager, FinanceController, SalesLead]
    code: 200
    input: []
    output: PracticeGroup
    side_effects: []

  - method: PATCH
    path: "/practice-groups/{id}"
    description: "Update a group's sourcing cap, per-level targets or parent link."
    roles: [PracticePartner]
    code: 200
    input: ["external_sourcing_cap_pct?", "level_targets?", "parent_group_id?"]
    output: PracticeGroup
    side_effects:
      - "re-derives own_bench_ratio, rollup_bench_ratio and posture for this group and every transitive ancestor, and for the previous ancestor chain when parent_group_id changes"
      - "does NOT retro-change target_utilization_pct on any existing UtilizationPeriod (that value is frozen on the row at period creation)"

  - method: GET
    path: "/practice-groups/{id}/child-groups"
    description: "List the direct child groups of a practice group — the reverse-reachability read for PracticeGroup.parent_group_id."
    roles: [PracticePartner, ResourceManager, FinanceController, SalesLead]
    code: 200
    input: ["limit?", "offset?"]
    output: PracticeGroup[]
    side_effects: []

  # --- Skill -------------------------------------------------------------
  - method: POST
    path: "/skills"
    description: "Register a skill in the taxonomy with its market scarcity index."
    roles: [PracticePartner]
    code: 201
    input: [code, name, family, "scarcity_index?", "retired?"]
    output: Skill
    side_effects: []

  - method: GET
    path: "/skills"
    description: "List skills, filterable by family and retirement flag."
    roles: [PracticePartner, ResourceManager, FinanceController, SalesLead, Consultant]
    code: 200
    input: ["family?", "retired?", "limit?", "offset?"]
    output: Skill[]
    side_effects: []

  - method: GET
    path: "/skills/{id}"
    description: "Read one skill."
    roles: [PracticePartner, ResourceManager, FinanceController, SalesLead, Consultant]
    code: 200
    input: []
    output: Skill
    side_effects: []

  - method: PATCH
    path: "/skills/{id}"
    description: "Adjust a skill's scarcity index or retire it."
    roles: [PracticePartner]
    code: 200
    input: ["scarcity_index?", "retired?"]
    output: Skill
    side_effects:
      - "raising scarcity_index to >= 0.7000 opens the CONSTRAINED-posture carve-out for external sourcing on demands requiring this skill"
      - "retiring a skill blocks NEW demands and programmes referencing it but leaves existing rows untouched"

  # --- Consultant --------------------------------------------------------
  - method: POST
    path: "/consultants"
    description: "Hire a consultant into a practice group. Creates the consultant's first BenchSpell."
    roles: [ResourceManager]
    code: 201
    input: [full_name, email, level, practice_group_id, home_city, home_geo_code, cost_rate_usd_per_hour, standard_bill_rate_usd_per_hour, "travel_max_nights_per_week?", "travel_willing_international?", "development_goal_skill_id?", "industry_experience?"]
    output: Consultant
    side_effects:
      - "availability_status BENCH, allocated_pct 0.00"
      - "creates one BenchSpell in state MONITORING with started_on = the logical clock date, age_reset_on null, escalation_count 0 — discoverable only through GET /bench-spells"
      - "increments the group's total_headcount and bench_headcount, then re-derives own_bench_ratio, rollup_bench_ratio and posture for the group and every transitive ancestor"

  - method: GET
    path: "/consultants"
    description: "List consultants, filterable by group, availability, level and development goal (practice_group_id and development_goal_skill_id are the reverse-reachability filters for those two FKs)."
    roles: [ResourceManager, PracticePartner, FinanceController, SalesLead]
    code: 200
    input: ["practice_group_id?", "development_goal_skill_id?", "availability_status?", "level?", "limit?", "offset?"]
    output: Consultant[]
    side_effects: []

  - method: GET
    path: "/consultants/{id}"
    description: "Read one consultant including derived availability_status and allocated_pct. A Consultant caller may read only their own row."
    roles: [ResourceManager, PracticePartner, FinanceController, SalesLead, Consultant]
    code: 200
    input: []
    output: Consultant
    side_effects: []

  - method: PATCH
    path: "/consultants/{id}"
    description: "Update a consultant's cost rate, travel constraints, development goal or industry experience."
    roles: [ResourceManager]
    code: 200
    input: ["cost_rate_usd_per_hour?", "standard_bill_rate_usd_per_hour?", "travel_max_nights_per_week?", "travel_willing_international?", "development_goal_skill_id?", "industry_experience?", "home_city?", "home_geo_code?"]
    output: Consultant
    side_effects:
      - "increments Consultant.version by 1, which invalidates any expected_consultant_version a client captured earlier"
      - "a new cost_rate_usd_per_hour does NOT re-price existing assignments (cost_rate_usd_per_hour is snapshot on the Assignment row) and does NOT re-score any stored match_score"

  # --- SkillAssertion ----------------------------------------------------
  - method: POST
    path: "/skill-assertions"
    description: "Assert a consultant's proficiency in a skill, optionally backed by a vendor certification with an expiry date. A Consultant caller may assert only for themselves."
    roles: [ResourceManager, Consultant]
    code: 201
    input: [consultant_id, skill_id, proficiency_level, "certification_code?", "certification_expires_on?", "last_used_on?"]
    output: SkillAssertion
    side_effects:
      - "assertion_status derived from certification_expires_on against the logical clock date"
      - "the consultant becomes eligible for demands whose min_proficiency_level is at or below proficiency_level, and gains cert_bonus in calculations.match_score while the certification is ACTIVE"

  - method: GET
    path: "/skill-assertions"
    description: "List skill assertions, filterable by consultant, skill and status — the reverse-reachability read for both of this junction entity's FKs, and the only way to observe assertions created by a reskilling completion."
    roles: [ResourceManager, PracticePartner, FinanceController, SalesLead, Consultant]
    code: 200
    input: ["consultant_id?", "skill_id?", "assertion_status?", "limit?", "offset?"]
    output: SkillAssertion[]
    side_effects: []

  - method: GET
    path: "/skill-assertions/{id}"
    description: "Read one skill assertion."
    roles: [ResourceManager, PracticePartner, FinanceController, SalesLead, Consultant]
    code: 200
    input: []
    output: SkillAssertion
    side_effects: []

  - method: PATCH
    path: "/skill-assertions/{id}"
    description: "Revise a proficiency level, attach or renew a certification, or record last use."
    roles: [ResourceManager, Consultant]
    code: 200
    input: ["proficiency_level?", "certification_code?", "certification_expires_on?", "last_used_on?"]
    output: SkillAssertion
    side_effects:
      - "re-derives assertion_status; letting a certification lapse flips ACTIVE to EXPIRED and makes pending confirms fail with ERR_CERTIFICATION_EXPIRED"
      - "does NOT re-score any stored Assignment.match_score"

  # --- DemandOpportunity -------------------------------------------------
  - method: POST
    path: "/demand-opportunities"
    description: "Register a client demand from the sales pipeline with its win probability, travel profile and commercial rates."
    roles: [SalesLead]
    code: 201
    input: [client_name, practice_group_id, required_skill_id, min_proficiency_level, required_fte, win_probability_pct, start_date, end_date, industry_code, onsite_nights_per_week, standard_rate_usd_per_hour, requested_rate_usd_per_hour, "is_international?"]
    output: DemandOpportunity
    side_effects:
      - "pipeline_status QUALIFYING, staffing_status UNSTAFFED, staffing_mode null"
      - "weighted_fte, open_fte and booked_realization_pct computed; earned_realization_pct and blended_margin_pct null"

  - method: GET
    path: "/demand-opportunities"
    description: "List demands, filterable by group, skill, pipeline status and staffing status — the reverse-reachability read for practice_group_id and required_skill_id."
    roles: [SalesLead, ResourceManager, PracticePartner, FinanceController]
    code: 200
    input: ["practice_group_id?", "required_skill_id?", "pipeline_status?", "staffing_status?", "staffing_mode?", "limit?", "offset?"]
    output: DemandOpportunity[]
    side_effects: []

  - method: GET
    path: "/demand-opportunities/{id}"
    description: "Read one demand including both status dimensions, coverage FTEs, realization pair and margin fields. Read this to obtain the `version` an OCC-guarded write must quote."
    roles: [SalesLead, ResourceManager, PracticePartner, FinanceController]
    code: 200
    input: []
    output: DemandOpportunity
    side_effects: []

  - method: POST
    path: "/demand-opportunities/{id}/qualify"
    description: "Sales qualifies the demand, admitting it to staffing and to the hiring forecast."
    roles: [SalesLead]
    code: 200
    input: []
    output: DemandOpportunity
    side_effects:
      - "pipeline_status QUALIFYING -> QUALIFIED; weighted_fte recomputed; increments DemandOpportunity.version by 1"
      - "the demand enters the weighted_pipeline_demand scope and the group's external-sourcing-cap denominator"

  - method: POST
    path: "/demand-opportunities/{id}/staffing-mode"
    description: "Select the staffing branch (internal bench versus partner sourcing). Settable once."
    roles: [ResourceManager]
    code: 200
    input: [staffing_mode]
    output: DemandOpportunity
    side_effects:
      - "staffing_mode set; staffing_status UNSTAFFED -> INTERNAL_STAFFING or EXTERNAL_SOURCING per calculations.opportunity_coverage"
      - "increments DemandOpportunity.version by 1"

  - method: POST
    path: "/demand-opportunities/{id}/close"
    description: "Close the demand as WON or LOST. WON is the join point of the two status dimensions and requires full coverage with no margin breach."
    roles: [SalesLead]
    code: 200
    input: [outcome, "note?"]
    output: DemandOpportunity
    side_effects:
      - "outcome WON requires staffing_status == COVERED and margin_breach == false; pipeline_status -> CLOSED_WON; every APPROVED ExternalPlacement on the demand becomes ACTIVE"
      - "outcome LOST -> CLOSED_LOST; every {PROPOSED, CONFIRMED} Assignment on the demand is CANCELLED and every {REQUESTED, APPROVED} ExternalPlacement is TERMINATED, releasing consultant allocation and firm concurrency slots"
      - "the demand leaves the weighted_pipeline_demand scope either way"
      - "increments DemandOpportunity.version by 1"

  - method: POST
    path: "/demand-opportunities/{id}/auto-staff"
    description: "Run the selector of calculations.auto_staff_selection over the eligible bench and create the winning PROPOSED assignment."
    roles: [ResourceManager]
    code: 201
    input: []
    output: Assignment
    side_effects:
      - "creates one Assignment with status PROPOSED, allocation_pct 100.00, category BILLABLE and the stored match_score of the winner"
      - "no coverage change (PROPOSED assignments do not count) and no consultant version bump"
      - "an empty candidate pool returns ERR_NO_ELIGIBLE_CONSULTANT (409) with zero mutations"

  # --- Assignment --------------------------------------------------------
  - method: POST
    path: "/assignments"
    description: "Propose a named consultant for a demand. OCC-guarded on the consultant's version per §1.2.1 assignment-create-stale-consultant. The end_date is EXCLUSIVE."
    roles: [ResourceManager]
    code: 201
    input: [consultant_id, demand_opportunity_id, allocation_pct, start_date, end_date, category, expected_consultant_version]
    output: Assignment
    side_effects:
      - "status PROPOSED; cost_rate_usd_per_hour snapshot from the consultant; match_score computed once per calculations.match_score and never recomputed; bill_rate_usd_per_hour pinned to the demand's effective_rate_usd_per_hour when category == BILLABLE else 0.00"
      - "increments Consultant.version by 1"
      - "no coverage change and no allocation change — a PROPOSED assignment reserves nothing, which is exactly why this create needs OCC rather than a state precondition"

  - method: GET
    path: "/assignments"
    description: "List assignments, filterable by consultant, demand and status — the reverse-reachability read for both FKs."
    roles: [ResourceManager, PracticePartner, FinanceController, SalesLead, Consultant]
    code: 200
    input: ["consultant_id?", "demand_opportunity_id?", "status?", "category?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: GET
    path: "/assignments/{id}"
    description: "Read one assignment including its frozen match_score and its pinned bill and cost rates."
    roles: [ResourceManager, PracticePartner, FinanceController, SalesLead, Consultant]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/assignments/{id}/confirm"
    description: "Commit the proposed assignment. This is where every staffing gate fires: proficiency, certification validity, travel, allocation capacity and the margin floor."
    roles: [ResourceManager]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "status PROPOSED -> CONFIRMED; confirmed_on := logical clock date"
      - "Consultant.allocated_pct recomputed; when it reaches >= 50.00 availability_status becomes ASSIGNED and the open BenchSpell is CLOSED, which decrements the group's bench_headcount (and escalated_l2_count when the spell was ESCALATED_L2 or SEPARATION_PROPOSED) and re-derives bench ratios and posture up the whole ancestor chain"
      - "DemandOpportunity.covered_internal_fte, open_fte and staffing_status recomputed; earned_realization_pct, blended_cost_rate_usd_per_hour, blended_margin_pct and margin_breach recomputed"
      - "every OPEN UtilizationPeriod of the consultant overlapping the assignment interval has its hour buckets recomputed"
      - "increments Consultant.version by 1 and DemandOpportunity.version by 1"

  - method: POST
    path: "/assignments/{id}/release"
    description: "Release a committed assignment early. released_on becomes the EXCLUSIVE effective end for every hour calculation."
    roles: [ResourceManager]
    code: 200
    input: ["reason?"]
    output: Assignment
    side_effects:
      - "status -> RELEASED; released_on := logical clock date; bill_rate_usd_per_hour frozen at its current value"
      - "the six-hop cascade of the Assignment ACTIVE -> RELEASED transition runs: allocation -> availability -> new BenchSpell -> group bench_headcount -> ancestor ratios -> posture"
      - "DemandOpportunity coverage, realization and margin recomputed; the hours the period loses from billable_hours reappear in bench_hours penny for penny"
      - "increments Consultant.version by 1 and DemandOpportunity.version by 1"

  - method: POST
    path: "/assignments/{id}/cancel"
    description: "Cancel a proposed or confirmed assignment. Cancelling a CONFIRMED row is the compensating action that restores coverage exactly."
    roles: [ResourceManager]
    code: 200
    input: ["reason?"]
    output: Assignment
    side_effects:
      - "status -> CANCELLED; bill_rate_usd_per_hour frozen; the row contributes zero hours to every utilization bucket"
      - "when the row was CONFIRMED, allocation, availability, bench spell, coverage, realization and margin are all restored to their pre-confirm values"
      - "increments Consultant.version by 1; increments DemandOpportunity.version by 1 only when the row was CONFIRMED"

  # --- BenchSpell --------------------------------------------------------
  - method: GET
    path: "/bench-spells"
    description: "List bench spells, filterable by consultant, state and reskilling programme — the reverse-reachability read for both FKs and the only way to observe the spell created by a consultant hire or an assignment release."
    roles: [ResourceManager, PracticePartner, FinanceController]
    code: 200
    input: ["consultant_id?", "reskilling_program_id?", "state?", "limit?", "offset?"]
    output: BenchSpell[]
    side_effects: []

  - method: GET
    path: "/bench-spells/{id}"
    description: "Read one bench spell including age_days, escalation_count and its investment window."
    roles: [ResourceManager, PracticePartner, FinanceController]
    code: 200
    input: []
    output: BenchSpell
    side_effects: []

  - method: POST
    path: "/bench-spells/{id}/internal-project"
    description: "Park an escalated bench consultant on an internal project, booking the time as investment rather than bench."
    roles: [ResourceManager]
    code: 200
    input: [internal_project_code]
    output: BenchSpell
    side_effects:
      - "state -> INTERNAL_PROJECT; investment_started_on := logical clock date; Consultant.availability_status -> INTERNAL_PROJECT"
      - "the consultant leaves bench_headcount (but stays in the auto-staff candidate pool), so bench ratios and posture are re-derived up the ancestor chain, and escalated_l2_count decrements when the spell was ESCALATED_L2"
      - "OPEN UtilizationPeriods overlapping the window shift hours from bench_hours to investment_hours"

  - method: POST
    path: "/bench-spells/{id}/separation-proposal"
    description: "Propose separation for a consultant benched past the second escalation rung."
    roles: [ResourceManager]
    code: 200
    input: ["rationale?"]
    output: BenchSpell
    side_effects:
      - "state ESCALATED_L2 -> SEPARATION_PROPOSED; separation_proposed_by_user_id := X-User-ID"
      - "escalated_l2_count is unchanged (it counts SEPARATION_PROPOSED too), so posture does not move"

  - method: POST
    path: "/bench-spells/{id}/separation-decision"
    description: "Decide a separation proposal. Segregation of duties: the decider may not be the proposer."
    roles: [PracticePartner]
    code: 200
    input: [decision, "note?"]
    output: BenchSpell
    side_effects:
      - "decision APPROVED -> state SEPARATED (terminal), Consultant.availability_status SEPARATED and separated_on stamped; the consultant leaves total_headcount, bench_headcount and escalated_l2_count, re-deriving ratios and posture up the ancestor chain, and leaves every candidate pool and the forecast's internal_supply_fte"
      - "decision REJECTED -> state back to ESCALATED_L2 with escalation_count preserved; escalated_l2_count unchanged; the spell re-enters the escalation cycle and may be proposed again, re-skilled, or moved to an internal project"

  # --- ReskillingProgram -------------------------------------------------
  - method: POST
    path: "/reskilling-programs"
    description: "Open a reskilling cohort for a skill with a seat capacity and an INCLUSIVE cohort window."
    roles: [ResourceManager]
    code: 201
    input: [skill_id, target_proficiency_level, cohort_start_on, cohort_end_on, seat_capacity, "cooldown_days?"]
    output: ReskillingProgram
    side_effects:
      - "status PLANNED; seats_taken 0"

  - method: GET
    path: "/reskilling-programs"
    description: "List reskilling programmes, filterable by skill and status — the reverse-reachability read for skill_id."
    roles: [ResourceManager, PracticePartner, FinanceController]
    code: 200
    input: ["skill_id?", "status?", "limit?", "offset?"]
    output: ReskillingProgram[]
    side_effects: []

  - method: GET
    path: "/reskilling-programs/{id}"
    description: "Read one reskilling programme including live seat occupancy."
    roles: [ResourceManager, PracticePartner, FinanceController]
    code: 200
    input: []
    output: ReskillingProgram
    side_effects: []

  - method: POST
    path: "/reskilling-programs/{id}/enrollments"
    description: "Enrol an escalated bench consultant into the cohort. Returns the consultant's bench spell, which is the row that changes state."
    roles: [ResourceManager]
    code: 200
    input: [consultant_id]
    output: BenchSpell
    side_effects:
      - "the consultant's open BenchSpell moves ESCALATED_L1 or ESCALATED_L2 -> RESKILLING with reskilling_program_id set and investment_started_on stamped"
      - "seats_taken recomputed; Consultant.availability_status -> RESKILLING, removing the consultant from every candidate pool and from the forecast's internal_supply_fte while KEEPING them in bench_headcount, so posture does not move"
      - "escalated_l2_count decrements when the spell was ESCALATED_L2, re-deriving ancestor postures"
      - "OPEN UtilizationPeriods overlapping the window shift hours from bench_hours to investment_hours"

  - method: POST
    path: "/reskilling-programs/{id}/complete"
    description: "Graduate the cohort. Every enrolled spell returns to MONITORING with its aging clock reset and a new or upgraded skill assertion."
    roles: [ResourceManager]
    code: 200
    input: []
    output: ReskillingProgram
    side_effects:
      - "status RUNNING -> COMPLETED; seats_taken recomputed to 0"
      - "for each enrolled spell: state RESKILLING -> MONITORING, age_reset_on := logical clock date (the aging ladder restarts at 0), investment_ended_on stamped, Consultant.availability_status -> BENCH"
      - "for each graduate: a SkillAssertion for (consultant, programme skill) is created at target_proficiency_level, or an existing one is raised to max(existing, target_proficiency_level) — observable only through GET /skill-assertions"

  # --- SubcontractorFirm -------------------------------------------------
  - method: POST
    path: "/subcontractor-firms"
    description: "Register a partner firm with its concurrency ceiling, pass-through rate and markup."
    roles: [PracticePartner]
    code: 201
    input: [name, geo_code, max_concurrent_placements, pass_through_rate_usd_per_hour, "markup_pct?", "approval_status?"]
    output: SubcontractorFirm
    side_effects:
      - "active_placements_count 0"

  - method: GET
    path: "/subcontractor-firms"
    description: "List partner firms, filterable by geography and approval status."
    roles: [PracticePartner, ResourceManager, FinanceController]
    code: 200
    input: ["geo_code?", "approval_status?", "limit?", "offset?"]
    output: SubcontractorFirm[]
    side_effects: []

  - method: GET
    path: "/subcontractor-firms/{id}"
    description: "Read one partner firm including its live placement count."
    roles: [PracticePartner, ResourceManager, FinanceController]
    code: 200
    input: []
    output: SubcontractorFirm
    side_effects: []

  - method: PATCH
    path: "/subcontractor-firms/{id}"
    description: "Suspend or re-approve a firm, or adjust its concurrency ceiling and commercial terms."
    roles: [PracticePartner]
    code: 200
    input: ["approval_status?", "max_concurrent_placements?", "markup_pct?", "pass_through_rate_usd_per_hour?"]
    output: SubcontractorFirm
    side_effects:
      - "suspending a firm blocks new placements and new approvals but leaves APPROVED and ACTIVE placements in place"
      - "a new pass_through_rate_usd_per_hour does NOT re-price existing placements (the rate is snapshot on the placement row)"

  # --- ExternalPlacement -------------------------------------------------
  - method: POST
    path: "/external-placements"
    description: "Request a partner placement against an externally-sourced demand. The interval is CLOSED on both ends."
    roles: [ResourceManager]
    code: 201
    input: [subcontractor_firm_id, demand_opportunity_id, fte, start_date, end_date]
    output: ExternalPlacement
    side_effects:
      - "status REQUESTED; pass_through_rate_usd_per_hour snapshot from the firm; bill_rate_usd_per_hour = round(pass_through_rate_usd_per_hour * (1 + markup_pct / 100), 2)"
      - "no coverage change — REQUESTED placements do not count toward covered_external_fte"

  - method: GET
    path: "/external-placements"
    description: "List partner placements, filterable by firm, demand and status — the reverse-reachability read for both FKs."
    roles: [ResourceManager, PracticePartner, FinanceController]
    code: 200
    input: ["subcontractor_firm_id?", "demand_opportunity_id?", "status?", "limit?", "offset?"]
    output: ExternalPlacement[]
    side_effects: []

  - method: GET
    path: "/external-placements/{id}"
    description: "Read one partner placement."
    roles: [ResourceManager, PracticePartner, FinanceController]
    code: 200
    input: []
    output: ExternalPlacement
    side_effects: []

  - method: POST
    path: "/external-placements/{id}/approve"
    description: "Approve a partner placement. Gates on firm approval, practice posture with the scarcity carve-out, the firm's CLOSED-interval concurrency ceiling and the group's external sourcing cap."
    roles: [PracticePartner]
    code: 200
    input: []
    output: ExternalPlacement
    side_effects:
      - "status REQUESTED -> APPROVED; SubcontractorFirm.active_placements_count recomputed"
      - "DemandOpportunity.covered_external_fte, open_fte and staffing_status recomputed — this is how a demand reaches PARTIALLY_COVERED and COVERED on the external branch"
      - "increments DemandOpportunity.version by 1"

  - method: POST
    path: "/external-placements/{id}/terminate"
    description: "Terminate an approved or active partner placement, freeing the firm's concurrency slot and restoring the demand's coverage."
    roles: [PracticePartner]
    code: 200
    input: ["reason?"]
    output: ExternalPlacement
    side_effects:
      - "status -> TERMINATED; terminated_on := logical clock date; active_placements_count recomputed"
      - "DemandOpportunity.covered_external_fte, open_fte and staffing_status restored exactly to their pre-approval values"
      - "increments DemandOpportunity.version by 1"

  # --- DiscountApproval --------------------------------------------------
  - method: POST
    path: "/discount-approvals"
    description: "Request approval for a discounted rate on a demand. OCC-guarded on the demand's version per §1.2.1 discount-approval-create-stale-opportunity. Runs steps S1–S7 of calculations.discount_tier_and_margin in a single pass."
    roles: [SalesLead]
    code: 201
    input: [demand_opportunity_id, requested_rate_usd_per_hour, expected_opportunity_version, "decision_note?"]
    output: DiscountApproval
    side_effects:
      - "standard_rate_usd_per_hour snapshot; discount_pct, provisional_realization_pct, blended_cost_rate_usd_per_hour (MIX_WEIGHTED or LEVEL_FLOOR variant), projected_margin_pct, required_tier and tier_escalated all computed in the S1–S7 order"
      - "required_tier == NONE auto-approves the row (status APPROVED, decided_by_user_id 'SYSTEM_AUTO') and applies the demand's rate cascade immediately; any other tier leaves status PENDING"
      - "requested_by_user_id := X-User-ID; revision_count 0"
      - "increments DemandOpportunity.version by 1"

  - method: GET
    path: "/discount-approvals"
    description: "List discount approvals, filterable by demand, status and required tier — the reverse-reachability read for demand_opportunity_id."
    roles: [SalesLead, PracticePartner, FinanceController]
    code: 200
    input: ["demand_opportunity_id?", "status?", "required_tier?", "limit?", "offset?"]
    output: DiscountApproval[]
    side_effects: []

  - method: GET
    path: "/discount-approvals/{id}"
    description: "Read one discount approval including the tier it was routed to and whether the margin floor escalated it."
    roles: [SalesLead, PracticePartner, FinanceController]
    code: 200
    input: []
    output: DiscountApproval
    side_effects: []

  - method: POST
    path: "/discount-approvals/{id}/decide"
    description: "Approve or reject a pending discount. Segregation of duties on X-User-ID, and the caller's role must satisfy required_tier."
    roles: [PracticePartner, FinanceController]
    code: 200
    input: [decision, "decision_note?"]
    output: DiscountApproval
    side_effects:
      - "decision APPROVED -> status APPROVED (terminal) and the four-hop rate cascade runs: demand approved_rate -> effective_rate and booked_realization_pct -> re-pinned bill_rate on every non-terminal BILLABLE assignment -> earned_realization_pct, blended_margin_pct and margin_breach"
      - "decision REJECTED -> status REJECTED; the demand's approved_rate_usd_per_hour is untouched"
      - "decided_by_user_id := X-User-ID; increments DemandOpportunity.version by 1 on APPROVED"

  - method: POST
    path: "/discount-approvals/{id}/revise"
    description: "Re-open a rejected discount at a higher rate. Steps S1–S6 re-run from scratch against the current assignment mix, so the required tier can change."
    roles: [SalesLead]
    code: 200
    input: [requested_rate_usd_per_hour, "decision_note?"]
    output: DiscountApproval
    side_effects:
      - "status REJECTED -> PENDING; revision_count += 1; decided_by_user_id cleared; requested_by_user_id := X-User-ID of the reviser"
      - "discount_pct, provisional_realization_pct, blended_cost_rate_usd_per_hour, projected_margin_pct, required_tier and tier_escalated all recomputed — the S3 variant may switch from LEVEL_FLOOR to MIX_WEIGHTED if an assignment was confirmed in the meantime"

  # --- UtilizationPeriod (nested under its consultant) -------------------
  - method: POST
    path: "/consultants/{id}/utilization-periods"
    description: "Open a measurement period for a consultant. target_utilization_pct is resolved from the group's level_targets and frozen on the row."
    roles: [FinanceController]
    code: 201
    input: [period_start_on, period_end_on, "holiday_hours?"]
    output: UtilizationPeriod
    side_effects:
      - "status OPEN; period_workdays, capacity_hours and net_available_hours computed; the four hour buckets computed from the consultant's existing assignments and bench-spell investment windows"
      - "utilization_pct_of_record takes the AVAILABLE_BASIS variant while OPEN; variance_pp computed against the frozen target"

  - method: GET
    path: "/consultants/{id}/utilization-periods"
    description: "List a consultant's measurement periods — the reverse-reachability read for UtilizationPeriod.consultant_id. A Consultant caller may list only their own."
    roles: [FinanceController, ResourceManager, PracticePartner, Consultant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: UtilizationPeriod[]
    side_effects: []

  - method: GET
    path: "/consultants/{id}/utilization-periods/{periodId}"
    description: "Read one measurement period with both utilization variants side by side and the one currently of record."
    roles: [FinanceController, ResourceManager, PracticePartner, Consultant]
    code: 200
    input: []
    output: UtilizationPeriod
    side_effects: []

  - method: POST
    path: "/consultants/{id}/utilization-periods/{periodId}/close"
    description: "Close a finished period. The variant of record switches from AVAILABLE_BASIS to TARGET_BASIS, so the reported percentage moves without any hour changing."
    roles: [FinanceController]
    code: 200
    input: []
    output: UtilizationPeriod
    side_effects:
      - "status OPEN -> CLOSED; utilization_pct_of_record switches to utilization_pct_target_basis; variance_pp recomputed"
      - "the row stops being recomputed: later releases and confirms no longer move its hour buckets"
      - "refused with ERR_HOUR_OVERALLOCATION when hour_overallocated == true"

  # --- HiringForecast (immutable snapshot) -------------------------------
  - method: POST
    path: "/hiring-forecasts"
    description: "Generate an immutable hiring-gap snapshot for one skill code and geography over a horizon, under the WEIGHTED or COMMITTED demand variant."
    roles: [FinanceController, PracticePartner]
    code: 201
    input: [skill_code, geography_code, horizon_start_on, horizon_end_on, "basis?"]
    output: HiringForecast
    side_effects:
      - "weighted_demand_fte computed by rounding each in-scope demand's contribution to 2 decimals FIRST and summing the rounded values"
      - "internal_supply_fte, external_supply_fte, gap_fte and recommended_hires (ceil of gap / HIRE_YIELD_FTE) computed and frozen; generated_at stamped from the logical clock"
      - "the row is immutable: no PATCH endpoint and no version field"

  - method: GET
    path: "/hiring-forecasts"
    description: "List hiring-gap snapshots, filterable by skill code, geography and basis."
    roles: [FinanceController, PracticePartner, ResourceManager]
    code: 200
    input: ["skill_code?", "geography_code?", "basis?", "limit?", "offset?"]
    output: HiringForecast[]
    side_effects: []

  - method: GET
    path: "/hiring-forecasts/{id}"
    description: "Read one hiring-gap snapshot."
    roles: [FinanceController, PracticePartner, ResourceManager]
    code: 200
    input: []
    output: HiringForecast
    side_effects: []

  # --- Operational checkpoint -------------------------------------------
  - method: POST
    path: "/bench-runs"
    description: "Operations checkpoint evaluated against the logical clock. This is the only time-driven mover in the system: it ages bench spells, activates due assignments and programmes, and returns internal-project spells that have run their course."
    roles: [ResourceManager]
    code: 200
    input: []
    output: null
    side_effects:
      - "every open BenchSpell is evaluated in ascending (started_on, created_at) order and advanced AT MOST ONE rung per run: MONITORING -> ESCALATED_L1 at age_days >= L1, ESCALATED_L1 -> ESCALATED_L2 at age_days >= L2"
      - "each ESCALATED_L1 -> ESCALATED_L2 increments escalated_l2_count for the consultant's group and every ancestor, which can flip a posture to FROZEN on the >= 3 arm alone"
      - "INTERNAL_PROJECT spells whose investment_started_on is INTERNAL_PROJECT_MAX_DAYS (30) or more days old return to MONITORING with age_reset_on stamped and the consultant back on bench"
      - "CONFIRMED assignments whose start_date <= the clock date become ACTIVE; APPROVED external placements whose start_date <= the clock date become ACTIVE; PLANNED programmes whose cohort_start_on <= the clock date become RUNNING"
      - "observe the results through GET /bench-spells, GET /assignments, GET /reskilling-programs and GET /practice-groups/{id}"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every age, expiry, delivery-hour and window rule reads. The clock defaults to 2026-08-01T00:00:00Z at server startup and MUST NOT fall back to real wall-clock time before or after any call to this endpoint."
    roles: [ResourceManager, PracticePartner, FinanceController, SalesLead]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "every computed field that reads the clock (Consultant.allocated_pct and availability_status, SkillAssertion.assertion_status, BenchSpell.age_days, DemandOpportunity.earned_realization_pct, UtilizationPeriod hour buckets) is re-derived on next read"
      - "moving the clock alone never advances a state machine; only POST /bench-runs does that"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# Every code is triggerable by at least one endpoint; the §1.4 priority column
# fixes which one wins when several apply to one request.
# -----------------------------------------------------------------------------
errors:
  # --- auth / shape ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty, role name not in §1.7, or an entity_backed role whose X-User-ID matches no row of the backing entity"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the target endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "unknown body key, missing required field, wrong type, out-of-range number, bad decimal width, invalid enum value, malformed ISO 8601 date or date-time, reversed date pair, or pagination limit/offset outside 1..100 / >= 0"

  # --- existence (404) ---
  - id: ERR_PRACTICE_GROUP_NOT_FOUND
    http: 404
    condition: "practice group id in the path or in practice_group_id / parent_group_id does not exist"
  - id: ERR_SKILL_NOT_FOUND
    http: 404
    condition: "skill id in the path or in required_skill_id / skill_id / development_goal_skill_id does not exist"
  - id: ERR_CONSULTANT_NOT_FOUND
    http: 404
    condition: "consultant id in the path or in consultant_id does not exist"
  - id: ERR_SKILL_ASSERTION_NOT_FOUND
    http: 404
    condition: "skill assertion id in the path does not exist"
  - id: ERR_OPPORTUNITY_NOT_FOUND
    http: 404
    condition: "demand opportunity id in the path or in demand_opportunity_id does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment id in the path does not exist"
  - id: ERR_BENCH_SPELL_NOT_FOUND
    http: 404
    condition: "bench spell id in the path does not exist"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "reskilling programme id in the path does not exist"
  - id: ERR_FIRM_NOT_FOUND
    http: 404
    condition: "subcontractor firm id in the path or in subcontractor_firm_id does not exist"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "external placement id in the path does not exist"
  - id: ERR_APPROVAL_NOT_FOUND
    http: 404
    condition: "discount approval id in the path does not exist"
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "utilization period id in the path does not exist, or exists but belongs to a different consultant than the one named in the path"
  - id: ERR_FORECAST_NOT_FOUND
    http: 404
    condition: "hiring forecast id in the path does not exist"

  # --- ownership / concurrency ---
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Consultant-role caller addresses a consultant row, utilization period or skill assertion that does not belong to the Consultant whose id equals X-User-ID"
  - id: ERR_STALE_OPPORTUNITY_VERSION
    http: 412
    condition: "expected_opportunity_version on POST /discount-approvals does not equal the demand's current version"
  - id: ERR_STALE_CONSULTANT_VERSION
    http: 412
    condition: "expected_consultant_version on POST /assignments does not equal the consultant's current version"

  # --- state ---
  - id: ERR_OPPORTUNITY_STATE_INVALID
    http: 409
    condition: "the demand's pipeline_status does not permit the operation (qualifying an already-QUALIFIED demand, staffing a QUALIFYING or closed demand, closing a demand that is not QUALIFIED)"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "the assignment's status does not permit the operation (second confirm, release of a PROPOSED or already-RELEASED row, cancel of a RELEASED or CANCELLED row)"
  - id: ERR_BENCH_SPELL_STATE_INVALID
    http: 409
    condition: "the bench spell's state does not permit the operation (enrolling or parking a MONITORING spell, proposing separation from a state other than ESCALATED_L2, deciding a spell that is not SEPARATION_PROPOSED, any write to a CLOSED or SEPARATED spell)"
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "the programme's status does not permit the operation (enrolling into a COMPLETED cohort, completing a PLANNED cohort, or completing before cohort_end_on has passed)"
  - id: ERR_PLACEMENT_STATE_INVALID
    http: 409
    condition: "the placement's status does not permit the operation (approving a non-REQUESTED row, terminating a REQUESTED or already-TERMINATED row)"
  - id: ERR_APPROVAL_STATE_INVALID
    http: 409
    condition: "the discount approval's status does not permit the operation (deciding a non-PENDING row, revising a PENDING or APPROVED row)"
  - id: ERR_PERIOD_STATE_INVALID
    http: 409
    condition: "closing a period that is already CLOSED, or whose period_end_on is not strictly before the logical clock date"
  - id: ERR_SKILL_RETIRED
    http: 409
    condition: "a retired skill is referenced by a new demand, a new reskilling programme, or a qualify call"
  - id: ERR_STAFFING_MODE_NOT_SET
    http: 409
    condition: "a staffing action is attempted on a demand whose staffing_mode is still null"
  - id: ERR_CONSULTANT_SEPARATED
    http: 409
    condition: "a staffing, assertion, enrolment or period write names a consultant whose availability_status is SEPARATED"
  - id: ERR_CONSULTANT_IN_RESKILLING
    http: 409
    condition: "an assignment confirm names a consultant whose availability_status is RESKILLING"

  # --- safety / compliance ---
  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 403
    condition: "X-User-ID equals the requester of the discount approval, or the proposer of the separation, being decided"
  - id: ERR_APPROVAL_TIER_INSUFFICIENT
    http: 403
    condition: "the caller's role does not satisfy DiscountApproval.required_tier (a PracticePartner deciding an L2_FINANCE row)"
  - id: ERR_CERTIFICATION_EXPIRED
    http: 409
    condition: "the SkillAssertion backing the confirm has assertion_status EXPIRED because its certification_expires_on is before the logical clock date"
  - id: ERR_SEPARATION_NOT_ELIGIBLE
    http: 409
    condition: "a separation proposal on a spell with escalation_count < 2, or an APPROVED separation decision while the consultant still has allocated_pct > 0.00"

  # --- constraint / temporal ---
  - id: ERR_UNIQUENESS_CONFLICT
    http: 409
    condition: "duplicate PracticeGroup.name, Skill.code, Consultant.email, SubcontractorFirm.name, or a second SkillAssertion for the same (consultant_id, skill_id) pair"
  - id: ERR_GROUP_CYCLE
    http: 409
    condition: "parent_group_id equals the group's own id or would close a cycle in the practice hierarchy"
  - id: ERR_PROFICIENCY_INSUFFICIENT
    http: 409
    condition: "the consultant holds no ACTIVE assertion for the demand's required skill at or above min_proficiency_level"
  - id: ERR_TRAVEL_CONSTRAINT_VIOLATED
    http: 409
    condition: "the demand's onsite_nights_per_week exceeds the consultant's travel_max_nights_per_week, or the demand is international and the consultant is not willing to travel internationally"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "a new utilization period's INCLUSIVE range intersects an existing period of the same consultant, including sharing a single boundary day"
  - id: ERR_COHORT_CONFLICTS_WITH_ASSIGNMENT
    http: 409
    condition: "the programme's INCLUSIVE cohort window intersects a CONFIRMED or ACTIVE assignment of the enrolling consultant on its HALF-OPEN interval"
  - id: ERR_RESKILLING_COOLDOWN_ACTIVE
    http: 409
    condition: "cohort_start_on is not strictly after the consultant's most recent COMPLETED cohort_end_on plus the new programme's cooldown_days"
  - id: ERR_COHORT_CAPACITY_EXCEEDED
    http: 409
    condition: "seats_taken already equals seat_capacity"
  - id: ERR_FIRM_CONCURRENCY_EXCEEDED
    http: 409
    condition: "approving the placement would put more than max_concurrent_placements of the firm's APPROVED/ACTIVE placements on some single date of its CLOSED interval — including a date shared only as an endpoint with another placement"
  - id: ERR_ALLOCATION_CAPACITY_EXCEEDED
    http: 409
    condition: "confirming would take the consultant's committed allocation above 100.00 on some date of the assignment's HALF-OPEN interval"
  - id: ERR_HOUR_OVERALLOCATION
    http: 409
    condition: "closing a period whose billable_hours + investment_hours exceed net_available_hours"
  - id: ERR_NO_ELIGIBLE_CONSULTANT
    http: 409
    condition: "auto-staff found no consultant satisfying the eligibility filter; nothing is created and no version advances"

  # --- referential ---
  - id: ERR_GEOGRAPHY_MISMATCH
    http: 409
    condition: "Consultant.home_geo_code differs from its practice group's geography_code, or HiringForecast.skill_code matches no existing Skill.code"
  - id: ERR_STAFFING_MODE_MISMATCH
    http: 409
    condition: "an internal staffing action on an EXTERNAL demand, or an external sourcing action on an INTERNAL demand"
  - id: ERR_FIRM_NOT_APPROVED
    http: 409
    condition: "the firm's approval_status is PENDING or SUSPENDED, or its geo_code differs from the demand's practice group geography_code"

  # --- fiscal ---
  - id: ERR_RATE_ABOVE_STANDARD
    http: 422
    condition: "a requested rate exceeds the applicable standard_rate_usd_per_hour"
  - id: ERR_DISCOUNT_CAP_EXCEEDED
    http: 422
    condition: "the computed discount_pct exceeds DISCOUNT_HARD_CAP_PCT (35.00)"
  - id: ERR_MARGIN_FLOOR_BREACH
    http: 422
    condition: "confirming the assignment would put the demand's blended_margin_pct below MARGIN_FLOOR_PCT (20.00)"
  - id: ERR_REVISION_NOT_HIGHER
    http: 422
    condition: "a revised requested_rate_usd_per_hour is not strictly greater than the stored value"

  # --- capacity / posture ---
  - id: ERR_PRACTICE_POSTURE_FROZEN
    http: 409
    condition: "the demand's practice group posture is FROZEN, which blocks external sourcing with no carve-out"
  - id: ERR_PRACTICE_POSTURE_CONSTRAINED
    http: 409
    condition: "the demand's practice group posture is CONSTRAINED and the required skill's scarcity_index is below 0.7000"
  - id: ERR_EXTERNAL_SOURCING_CAP_EXCEEDED
    http: 422
    condition: "approving the placement would take the group's external coverage share above external_sourcing_cap_pct"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# role_model: segregation_of_duties — the decider of a discount and the decider
# of a separation are both compared against X-User-ID, not merely against
# X-User-Role, so one user holding the right role is still not enough.
# -----------------------------------------------------------------------------
roles:
  - name: SalesLead
    description: "Owns the demand pipeline: registers demands, qualifies them, requests discounts, revises rejected discounts, and closes demands WON or LOST. Never staffs anyone and never decides its own discount."
    identity: opaque
    exclusive_operations:
      - "POST /demand-opportunities"
      - "POST /demand-opportunities/{id}/qualify"
      - "POST /demand-opportunities/{id}/close"
      - "POST /discount-approvals"
      - "POST /discount-approvals/{id}/revise"
    shared_operations:
      - "GET /demand-opportunities, GET /demand-opportunities/{id}"
      - "GET /discount-approvals, GET /discount-approvals/{id}"
      - "GET /practice-groups and its reads, GET /skills, GET /skill-assertions, GET /consultants, GET /assignments"
      - "POST /_clock/set_current_utc"

  - name: ResourceManager
    description: "Owns supply and staffing: hires consultants, records assertions, selects the staffing branch, proposes and confirms assignments, releases and cancels them, runs the operational checkpoint, requests partner placements, and manages reskilling and internal projects. Proposes separations but may not decide them."
    identity: opaque
    exclusive_operations:
      - "POST /consultants, PATCH /consultants/{id}"
      - "POST /demand-opportunities/{id}/staffing-mode"
      - "POST /demand-opportunities/{id}/auto-staff"
      - "POST /assignments, POST /assignments/{id}/confirm, POST /assignments/{id}/release, POST /assignments/{id}/cancel"
      - "POST /bench-spells/{id}/internal-project, POST /bench-spells/{id}/separation-proposal"
      - "POST /reskilling-programs, POST /reskilling-programs/{id}/enrollments, POST /reskilling-programs/{id}/complete"
      - "POST /external-placements"
      - "POST /bench-runs"
    shared_operations:
      - "POST /skill-assertions, PATCH /skill-assertions/{id}"
      - "every GET in §1.5 except GET /discount-approvals and GET /discount-approvals/{id}"
      - "POST /_clock/set_current_utc"

  - name: PracticePartner
    description: "Owns the practice structure and the partner channel: registers groups, skills and firms, approves and terminates partner placements, and decides separations and L1 discounts. May not decide a discount routed to L2_FINANCE."
    identity: opaque
    exclusive_operations:
      - "POST /practice-groups, PATCH /practice-groups/{id}"
      - "POST /skills, PATCH /skills/{id}"
      - "POST /subcontractor-firms, PATCH /subcontractor-firms/{id}"
      - "POST /external-placements/{id}/approve, POST /external-placements/{id}/terminate"
      - "POST /bench-spells/{id}/separation-decision"
    shared_operations:
      - "POST /discount-approvals/{id}/decide (only when required_tier is L1_PRACTICE_PARTNER)"
      - "POST /hiring-forecasts"
      - "every GET in §1.5"
      - "POST /_clock/set_current_utc"

  - name: FinanceController
    description: "Owns measurement and the fiscal gate: opens and closes utilization periods, generates hiring forecasts, and is the only role that may decide a discount escalated to L2_FINANCE."
    identity: opaque
    exclusive_operations:
      - "POST /consultants/{id}/utilization-periods"
      - "POST /consultants/{id}/utilization-periods/{periodId}/close"
    shared_operations:
      - "POST /discount-approvals/{id}/decide (any tier, including L2_FINANCE)"
      - "POST /hiring-forecasts"
      - "every GET in §1.5"
      - "POST /_clock/set_current_utc"

  - name: Consultant
    description: "The consultant acting on their own record: reads their own profile, their own assignments and their own utilization periods, and may assert or update their own skills. Owns nothing else."
    identity: "entity_backed:Consultant"
    exclusive_operations: []
    shared_operations:
      - "GET /consultants/{id} (own row only)"
      - "GET /consultants/{id}/utilization-periods and GET /consultants/{id}/utilization-periods/{periodId} (own rows only)"
      - "POST /skill-assertions and PATCH /skill-assertions/{id} (own rows only)"
      - "GET /skill-assertions, GET /skills, GET /skills/{id}, GET /assignments, GET /assignments/{id}"
