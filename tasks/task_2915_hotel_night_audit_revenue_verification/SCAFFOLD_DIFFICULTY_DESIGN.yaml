              captures: { folio_z_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_z_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
          trigger: "POST /night-audit/business-dates/${bd_noavail_id}/post-room-and-tax as NightAuditor (X-User-ID u_na_1) - a day with one occupied room and zero available rooms."
          assert:
            - "The trigger response returns rooms_available_count == 0, rooms_occupied_count == 1, room_night_revenue_amount == 200.00, occupancy_pct == 0.00 (guarded, not 100.00 and not an error) and revpar_amount == 0.00 (guarded)."
            - "The same response returns adr_amount == 200.00, because the adr guard is on rooms_occupied_count, which is 1 - the two guards are independent."
            - "GET /night-audit/business-dates/${bd_empty_id} returns rooms_available_count == 96, rooms_occupied_count == 0, occupancy_pct == 0.00, adr_amount == 0.00 (guarded on the occupied count) and revpar_amount == 0.00 (a real 0.00 / 96 division)."
            - "The same read returns room_night_revenue_amount == 0.00, other_room_revenue_amount == 0.00, room_revenue_amount == 0.00, tax_revenue_amount == 0.00, outlet_revenue_amount == 0.00 and total_revenue_amount == 0.00, all exactly 0.00 and none null."
            - "GET /night-audit/business-dates/${bd_empty_id} returns status == ROOM_POSTING - an empty day still advances its state machine."
            - "An implementation that raises ZeroDivisionError, returns null, or shares a single guard across occupancy_pct, adr_amount and revpar_amount fails on one of the two days."

      - name: settlement_variance_tolerance_inclusive_at_five_dollars
        grounds: "§1.3 calculation settlement_reconciliation ('if abs(variance_amount) <= settlement_variance_tolerance_amount: MATCHED'); §1.1 BusinessDate.settlement_variance_total_amount and .unresolved_settlement_batch_count."
        distinguishing_aspect: >-
          An inclusive <= tolerance on an absolute value, evaluated in bulk by verify-settlements
          rather than at write time, and the cent that crosses it changes a batch's *status* and
          the day's unresolved count while both batches keep contributing to the variance total.
          Uses two outlets so the two sides share an identical system_amount.
        test_recipe:
          setup: "Standard property (settlement_variance_tolerance_amount 5.00); two ACTIVE outlets with requires_shift_settlement true; business date 2026-08-01; each outlet has one CASH ticket at gross 120.00 closed with transmitted_at 2026-08-01T18:00:00.000Z, so each outlet's system_amount is 150.45; each outlet declares a CASH batch over the half-open window [2026-08-01T14:00:00.000Z, 2026-08-01T22:00:00.000Z) - 155.45 at outlet one and 155.46 at outlet two; room and tax are posted and sealed so the date sits in CHARGES_SEALED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T20:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
