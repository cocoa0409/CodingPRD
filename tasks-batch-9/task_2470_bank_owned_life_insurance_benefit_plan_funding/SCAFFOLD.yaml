scenario: |
  Generate task harder than expert level!

  2470. Bank-Owned Life Insurance & Benefit Plan Funding (bank benefits finance office): pre-purchase due diligence on carriers, product types and concentration limits, insurable interest determination and employee consent documentation, policy purchase capacity against capital limits with regulatory notification, crediting rate, mortality and expense charge monitoring across carriers, nonqualified deferred compensation liability matching to policy cash values, death benefit claim processing and beneficiary split with employee families, policy exchange or surrender analysis including tax consequences, annual risk assessment and board reporting
domain_name: bank-owned-life-insurance-funding
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the insurance carrier
      - name: naic_code
        type: string
        source: input
        description: NAIC company code used on regulatory filings
      - name: am_best_rating
        type: enum
        source: input
        description: financial strength rating supplied at onboarding
        constraints: "one of A_PLUS_PLUS, A_PLUS, A, A_MINUS, B_PLUS_PLUS, B_PLUS, B"
      - name: statutory_surplus_usd
        type: number
        source: input
        description: carrier statutory surplus in USD, 2 decimal places
        constraints: "> 0"
      - name: domicile_state
        type: string
        source: input
        description: two-letter state of domicile
      - name: status
        type: enum
        source: computed
        description: carrier authorization posture; gates every purchase against this carrier
        default: PENDING_DILIGENCE
        constraints: "one of PENDING_DILIGENCE, AUTHORIZED, RESTRICTED, SUSPENDED, TERMINATED"
      - name: watch_list_flag
        type: boolean
        source: computed
        description: true once any of this carrier's product types reaches CLOSED_TO_NEW
        default: false
      - name: reserved_premium_usd
        type: number
        source: computed
        description: sum of reserved_premium_usd over this carrier's PolicyPurchaseRequest rows in CAPACITY_RESERVED, NOTICE_FILED, CONCURRENCE_PENDING or APPROVED
        default: 0.00
      - name: in_force_premium_usd
        type: number
        source: computed
        description: sum of single_premium_usd over this carrier's Policy rows in IN_FORCE, PENDING_EXCHANGE or CLAIM_PENDING
        default: 0.00
      - name: in_force_cash_value_usd
        type: number
        source: computed
        description: sum of cash_surrender_value_usd over this carrier's Policy rows in IN_FORCE, PENDING_EXCHANGE or CLAIM_PENDING
        default: 0.00
      - name: concentration_bps
        type: integer
        source: computed
        description: in_force_cash_value_usd as basis points of the latest CapitalPosition.tier1_capital_usd; drives the AUTHORIZED/RESTRICTED hysteresis
        default: 0
      - name: regulatory_notice_count
        type: integer
        source: computed
        description: count of purchase requests that have reached NOTICE_FILED against this carrier
        default: 0
      - name: last_approved_review_year
        type: integer
        source: computed
        description: review_year of the most recently APPROVED DiligenceReview for this carrier
        default: null

  - name: ProductType
    parent: Carrier
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; issuing carrier of this product"
      - name: product_name
        type: string
        source: input
        description: carrier product name
      - name: account_type
        type: enum
        source: input
        description: separate-account products carry a tighter single-carrier concentration limit
        constraints: "one of GENERAL, SEPARATE, HYBRID"
      - name: mec_status
        type: enum
        source: input
        description: modified endowment contract classification; selects the cost-recovery variant on withdrawal
        constraints: "one of MEC, NON_MEC"
      - name: disclosed_me_charge_bps
        type: integer
        source: input
        description: mortality and expense charge disclosed by the carrier, in basis points of prior cash value per valuation period
        constraints: ">= 0"
      - name: guaranteed_min_crediting_bps
        type: integer
        source: input
        description: contractual minimum gross crediting rate in basis points
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: product availability posture
        default: OPEN
        constraints: "one of OPEN, ON_WATCH, CLOSED_TO_NEW"
      - name: consecutive_low_yield_count
        type: integer
        source: computed
        description: number of consecutive PolicyValuation rows on this product whose net_yield_bps is below MIN_ACCEPTABLE_NET_YIELD_BPS
        default: 0
      - name: latest_me_charge_bps
        type: integer
        source: computed
        description: me_charge_bps of the most recent PolicyValuation on this product ordered by as_of_date then created_at ASC
        default: 0
      - name: latest_me_drift_bps
        type: integer
        source: computed
        description: latest_me_charge_bps minus disclosed_me_charge_bps
        default: 0

  - name: DiligenceReview
    parent: Carrier
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; carrier under pre-purchase due diligence"
      - name: review_year
        type: integer
        source: input
        description: calendar year this diligence cycle covers
      - name: rating_points
        type: integer
        source: computed
        description: RATING_POINTS lookup of the carrier's am_best_rating
      - name: surplus_points
        type: integer
        source: computed
        description: capped statutory surplus component of the financial strength score
      - name: concentration_points
        type: number
        source: computed
        description: concentration component of the financial strength score, may carry one decimal
      - name: financial_strength_score
        type: integer
        source: computed
        description: weighted score gating carrier authorization; compared against MIN_APPROVAL_SCORE
      - name: status
        type: enum
        source: computed
        description: diligence workflow state
        default: DRAFT
        constraints: "one of DRAFT, UNDER_REVIEW, INFO_REQUESTED, APPROVED, DECLINED"
      - name: info_request_count
        type: integer
        source: computed
        description: number of information-request rounds consumed; capped by INFO_REQUEST_LIMIT
        default: 0
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator who last submitted this review for decision
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator who approved or declined this review
        default: null

  - name: CapitalPosition
    parent: null
    common_fields: false
    fields:
      - name: as_of_date
        type: datetime
        source: input
        description: measurement date of the regulatory capital snapshot
      - name: tier1_capital_usd
        type: number
        source: input
        description: tier-1 capital in USD; denominator of every concentration and capacity ratio
        constraints: "> 0"
      - name: total_assets_usd
        type: number
        source: input
        description: total consolidated assets in USD
        constraints: "> 0"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who filed the snapshot

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: insured employee name
      - name: employee_number
        type: string
        source: input
        description: payroll identifier
      - name: annual_salary_usd
        type: number
        source: input
        description: base annual salary in USD; drives insurable interest and the survivor multiple
        constraints: "> 0"
      - name: officer_flag
        type: boolean
        source: input
        description: true when the employee is a designated executive officer
        default: false
      - name: insurable_interest_status
        type: enum
        source: computed
        description: recomputed whenever a ConsentRecord for this employee is executed
        default: NOT_ESTABLISHED
        constraints: "one of NOT_ESTABLISHED, ESTABLISHED"
      - name: employment_status
        type: enum
        source: computed
        description: employment posture; set to DECEASED when a DeathBenefitClaim is filed on any of this employee's policies
        default: ACTIVE
        constraints: "one of ACTIVE, TERMINATED, DECEASED"

  - name: ConsentRecord
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; employee giving notice-and-consent"
      - name: coverage_start_date
        type: datetime
        source: input
        description: first day of the consented coverage interval, inclusive
      - name: coverage_end_date
        type: datetime
        source: input
        description: last day of the consented coverage interval, inclusive
      - name: consent_form_reference
        type: string
        source: input
        description: document reference of the signed consent form
      - name: notice_and_consent_version
        type: string
        source: input
        description: version tag of the notice-and-consent template used
      - name: status
        type: enum
        source: computed
        description: consent lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, EXECUTED, REVOKED, EXPIRED"
      - name: executed_at
        type: datetime
        source: computed
        description: logical clock instant at which the employee signature was recorded
        default: null

  - name: PolicyPurchaseRequest
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; carrier the premium would be placed with"
      - name: product_type_id
        type: string
        source: input
        description: "FK -> ProductType.id; product the policy would be issued under"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; proposed insured"
      - name: single_premium_usd
        type: number
        source: input
        description: single premium the bank would pay, 2 decimal places
        constraints: "> 0"
      - name: face_amount_usd
        type: number
        source: input
        description: requested death benefit face amount
        constraints: "> 0"
      - name: requested_effective_date
        type: datetime
        source: input
        description: desired policy effective date
      - name: status
        type: enum
        source: computed
        description: purchase workflow state; branches at CAPACITY_RESERVED on the notice threshold
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, DILIGENCE_CLEARED, CAPACITY_RESERVED, NOTICE_FILED, CONCURRENCE_PENDING, APPROVED, ISSUED, REJECTED, WITHDRAWN"
      - name: reserved_premium_usd
        type: number
        source: computed
        description: premium currently held against the carrier's capacity by this request; zeroed on reject or withdraw
        default: 0.00
      - name: base_ratio_bps
        type: integer
        source: computed
        description: prospective committed premium as basis points of the base aggregate limit
        default: 0
      - name: effective_limit_pct
        type: number
        source: computed
        description: tier-selected aggregate limit percentage frozen at reservation time
        default: 0
      - name: aggregate_limit_usd
        type: number
        source: computed
        description: tier-1 capital multiplied by effective_limit_pct
        default: 0.00
      - name: headroom_usd
        type: number
        source: computed
        description: aggregate_limit_usd minus prospective committed premium; may be negative
        default: 0.00
      - name: carrier_concentration_bps
        type: integer
        source: computed
        description: prospective single-carrier premium as basis points of tier-1 capital
        default: 0
      - name: notice_required
        type: boolean
        source: computed
        description: true when single_premium_usd exceeds NOTICE_THRESHOLD_USD
        default: false
      - name: notice_filed_at
        type: datetime
        source: computed
        description: logical clock instant the regulatory notification was filed
        default: null
      - name: notice_waiting_ends_at
        type: datetime
        source: computed
        description: notice_filed_at plus NOTICE_WAITING_PERIOD_DAYS
        default: null
      - name: concurrence_requested_at
        type: datetime
        source: computed
        description: logical clock instant risk concurrence was requested
        default: null
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator who submitted the request
        default: null
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator who approved the request
        default: null

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: purchase_request_id
        type: string
        source: input
        description: "FK -> PolicyPurchaseRequest.id; the APPROVED request this policy issues from"
      - name: carrier_id
        type: string
        source: computed
        description: "FK -> Carrier.id; copied from the purchase request"
      - name: product_type_id
        type: string
        source: computed
        description: "FK -> ProductType.id; copied from the purchase request"
      - name: employee_id
        type: string
        source: computed
        description: "FK -> Employee.id; the insured, copied from the purchase request"
      - name: exchanged_from_policy_id
        type: string
        source: computed
        description: "FK -> Policy.id; predecessor policy of a section 1035 exchange; null for original purchases"
        default: null
      - name: policy_number
        type: string
        source: input
        description: carrier-assigned policy number
      - name: issue_date
        type: datetime
        source: input
        description: date the carrier issued the contract
      - name: single_premium_usd
        type: number
        source: computed
        description: premium copied from the purchase request, or the transferred cash value on a section 1035 exchange
      - name: face_amount_usd
        type: number
        source: computed
        description: death benefit face amount copied from the purchase request
      - name: cost_basis_usd
        type: number
        source: computed
        description: tax cost basis; equals the premium paid, and carries over unchanged through a section 1035 exchange
      - name: cash_surrender_value_usd
        type: number
        source: computed
        description: latest cash value; updated by every PolicyValuation posting
      - name: policy_year
        type: integer
        source: computed
        description: contract year used to select the surrender charge tier
        default: 1
      - name: status
        type: enum
        source: computed
        description: policy lifecycle state
        default: IN_FORCE
        constraints: "one of IN_FORCE, PENDING_EXCHANGE, CLAIM_PENDING, EXCHANGED, SURRENDERED, PAID_OUT"

  - name: PolicyValuation
    parent: Policy
    common_fields: false
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; policy the statement period belongs to"
      - name: period_start_date
        type: datetime
        source: input
        description: inclusive start of the half-open valuation interval
      - name: as_of_date
        type: datetime
        source: input
        description: exclusive end of the half-open valuation interval, and the statement date
      - name: prior_cash_value_usd
        type: number
        source: computed
        description: policy cash_surrender_value_usd immediately before this posting
      - name: credited_interest_usd
        type: number
        source: input
        description: interest credited by the carrier for the period
        constraints: ">= 0"
      - name: mortality_expense_charge_usd
        type: number
        source: input
        description: mortality and expense charge assessed for the period
        constraints: ">= 0"
      - name: market_value_adjustment_usd
        type: number
        source: input
        description: market value adjustment for the period; may be negative
        default: 0.00
      - name: gross_crediting_rate_bps
        type: integer
        source: input
        description: gross crediting rate declared by the carrier for the period
        constraints: ">= 0"
      - name: cash_value_usd
        type: number
        source: computed
        description: prior_cash_value_usd plus credited_interest_usd minus mortality_expense_charge_usd plus market_value_adjustment_usd
      - name: net_yield_bps
        type: integer
        source: computed
        description: net credited yield after the mortality and expense charge, in basis points of prior_cash_value_usd
      - name: me_charge_bps
        type: integer
        source: computed
        description: mortality and expense charge in basis points of prior_cash_value_usd
      - name: me_drift_bps
        type: integer
        source: computed
        description: me_charge_bps minus the product's disclosed_me_charge_bps
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who posted the statement

  - name: NqdcPlan
    parent: null
    common_fields: true
    fields:
      - name: plan_name
        type: string
        source: input
        description: nonqualified deferred compensation plan name
      - name: plan_type
        type: enum
        source: input
        description: plan family
        constraints: "one of SERP, DEFERRED_BONUS, DIRECTOR_FEE"
      - name: discount_rate_bps
        type: integer
        source: input
        description: annual discount rate used by the projected-benefit-obligation variant
        default: 500
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: plan posture; FROZEN blocks new participant liabilities
        default: ACTIVE
        constraints: "one of ACTIVE, FROZEN, TERMINATED"
      - name: accrual_liability_usd
        type: number
        source: computed
        description: sum of accrued_to_date_usd over ACTIVE participant liabilities
        default: 0.00
      - name: pbo_liability_usd
        type: number
        source: computed
        description: sum of discounted_benefit_usd over ACTIVE participant liabilities
        default: 0.00
      - name: matched_cash_value_usd
        type: number
        source: computed
        description: sum of cash_surrender_value_usd over policies matched to this plan's ACTIVE participant liabilities
        default: 0.00
      - name: funding_posture
        type: enum
        source: computed
        description: funding posture persisted on the ACCRUAL basis
        default: FUNDED
        constraints: "one of FUNDED, UNDERFUNDED, CRITICAL"
      - name: funded_ratio_bps
        type: integer
        source: computed
        description: matched_cash_value_usd as basis points of accrual_liability_usd
        default: 10000

  - name: NqdcParticipantLiability
    parent: NqdcPlan
    common_fields: true
    fields:
      - name: nqdc_plan_id
        type: string
        source: input
        description: "FK -> NqdcPlan.id; plan this liability belongs to"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; plan participant"
      - name: matched_policy_id
        type: string
        source: input
        description: "FK -> Policy.id; policy whose cash value funds this liability; null when unmatched"
        default: null
      - name: accrued_to_date_usd
        type: number
        source: input
        description: liability accrued to date under the ACCRUAL basis
        constraints: ">= 0"
      - name: projected_benefit_usd
        type: number
        source: input
        description: total projected benefit payable at the payout date
        constraints: "> 0"
      - name: years_to_payout
        type: integer
        source: input
        description: whole years from valuation to payout
        constraints: ">= 0"
      - name: discounted_benefit_usd
        type: number
        source: computed
        description: projected_benefit_usd discounted at the plan's discount_rate_bps over years_to_payout
      - name: status
        type: enum
        source: computed
        description: liability lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, SETTLED"

  - name: DeathBenefitClaim
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; policy the claim is filed against"
      - name: date_of_death
        type: datetime
        source: input
        description: recorded date of death
      - name: terminal_dividend_usd
        type: number
        source: input
        description: terminal dividend added to the face amount
        default: 0.00
        constraints: ">= 0"
      - name: proof_reference
        type: string
        source: input
        description: document reference for proof of death
      - name: total_death_benefit_usd
        type: number
        source: computed
        description: policy face_amount_usd plus terminal_dividend_usd
      - name: survivor_entitlement_usd
        type: number
        source: computed
        description: family share of the death benefit after the cap and the salary multiple
      - name: bank_portion_usd
        type: number
        source: computed
        description: total_death_benefit_usd minus survivor_entitlement_usd
      - name: adjudication_status
        type: enum
        source: computed
        description: adjudication dimension of the claim, independent of distribution_status
        default: FILED
        constraints: "one of FILED, UNDER_ADJUDICATION, APPROVED, DENIED, VOIDED"
      - name: distribution_status
        type: enum
        source: computed
        description: distribution dimension of the claim, independent of adjudication_status
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, ALLOCATED, DISTRIBUTED"
      - name: allocated_bps_total
        type: integer
        source: computed
        description: sum of allocation_pct_bps over ACTIVE beneficiary allocations
        default: 0
      - name: filed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator who filed the claim
      - name: adjudicated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator who approved or denied the claim
        default: null

  - name: BeneficiaryAllocation
    parent: DeathBenefitClaim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> DeathBenefitClaim.id; claim being split"
      - name: beneficiary_name
        type: string
        source: input
        description: family beneficiary name
      - name: relationship
        type: enum
        source: input
        description: relationship of the beneficiary to the insured
        constraints: "one of SPOUSE, CHILD, TRUST, ESTATE"
      - name: allocation_pct_bps
        type: integer
        source: input
        description: share of the survivor entitlement in basis points
        constraints: "1 to 10000"
      - name: gross_amount_usd
        type: number
        source: computed
        description: rounded share of survivor_entitlement_usd, including the residual when this allocation carries the greatest allocation_pct_bps
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: allocation lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, VOIDED"

  - name: ExchangeSurrenderAnalysis
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; policy being exchanged or surrendered"
      - name: replacement_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; receiving carrier of a section 1035 exchange; null for surrender-only analyses"
        default: null
      - name: disposition_type
        type: enum
        source: input
        description: disposition being analysed
        constraints: "one of FULL_SURRENDER, PARTIAL_SURRENDER, EXCHANGE_1035"
      - name: requested_withdrawal_usd
        type: number
        source: input
        description: withdrawal amount for a partial surrender; must be 0.00 for other dispositions
        default: 0.00
        constraints: ">= 0"
      - name: cost_recovery_method
        type: enum
        source: computed
        description: cost-recovery variant selected from the product's mec_status
        constraints: "one of FIFO_BASIS_FIRST, LIFO_INCOME_FIRST"
      - name: taxable_gain_usd
        type: number
        source: computed
        description: taxable gain under the selected cost-recovery variant
      - name: surrender_charge_usd
        type: number
        source: computed
        description: surrender charge from the policy_year schedule
      - name: tax_liability_usd
        type: number
        source: computed
        description: taxable_gain_usd multiplied by the combined federal and state rate
      - name: net_proceeds_usd
        type: number
        source: computed
        description: gross amount less surrender_charge_usd less tax_liability_usd
      - name: status
        type: enum
        source: computed
        description: analysis workflow state
        default: DRAFT
        constraints: "one of DRAFT, REVIEWED, COMMITTED, EXECUTED, ABANDONED, REJECTED"
      - name: resulting_policy_id
        type: string
        source: computed
        description: "FK -> Policy.id; policy created by an executed section 1035 exchange; null otherwise"
        default: null

  - name: RiskAssessment
    parent: null
    common_fields: true
    fields:
      - name: capital_position_id
        type: string
        source: input
        description: "FK -> CapitalPosition.id; capital snapshot the assessment is measured against"
      - name: assessment_year
        type: integer
        source: input
        description: calendar year of the annual assessment; unique across RiskAssessment rows
      - name: restricted_carrier_count
        type: integer
        source: computed
        description: count of carriers whose concentration_bps exceeds CARRIER_RESTRICT_BPS
      - name: watch_list_carrier_count
        type: integer
        source: computed
        description: count of carriers with watch_list_flag true
      - name: on_watch_product_count
        type: integer
        source: computed
        description: count of product types in ON_WATCH
      - name: closed_product_count
        type: integer
        source: computed
        description: count of product types in CLOSED_TO_NEW
      - name: critical_plan_count
        type: integer
        source: computed
        description: count of NqdcPlan rows whose PBO-basis posture is CRITICAL
      - name: underfunded_plan_count
        type: integer
        source: computed
        description: count of NqdcPlan rows whose PBO-basis posture is UNDERFUNDED
      - name: risk_points
        type: integer
        source: computed
        description: weighted sum of the six counts above
      - name: risk_rating
        type: enum
        source: computed
        description: board-facing rating derived from risk_points
        constraints: "one of LOW, MODERATE, HIGH, SEVERE"
      - name: status
        type: enum
        source: computed
        description: board reporting workflow state
        default: COMPILED
        constraints: "one of COMPILED, BOARD_SUBMITTED, BOARD_ACCEPTED, RETURNED"
      - name: compiled_at
        type: datetime
        source: computed
        description: logical clock instant the assessment was compiled
      - name: board_note
        type: string
        source: input
        description: note recorded by the board secretary on acceptance or return
        default: null

state_machines:
  - entity: Carrier
    state_field: status
    initial_state: PENDING_DILIGENCE
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_DILIGENCE
        to: AUTHORIZED
        trigger: "POST /diligence-reviews/{id}/approve (cascaded side effect of the review approval)"
        actor: system
        preconditions:
          - "DiligenceReview.status == UNDER_REVIEW"
          - "DiligenceReview.financial_strength_score >= MIN_APPROVAL_SCORE"
        side_effects:
          - "sets Carrier.last_approved_review_year = DiligenceReview.review_year"
          - "increments Carrier.version by 1"
      - from: AUTHORIZED
        to: RESTRICTED
        trigger: "system re-evaluation of Carrier.concentration_bps during POST /policy-valuations or POST /policies"
        actor: system
        preconditions:
          - "recomputed Carrier.concentration_bps >= CARRIER_RESTRICT_BPS"
        side_effects:
          - "sets Carrier.concentration_bps to the recomputed value"
          - "increments Carrier.version by 1"
        note: "hysteresis band: entry at >= 1500 bps, release only at <= 1200 bps"
      - from: RESTRICTED
        to: AUTHORIZED
        trigger: "system re-evaluation of Carrier.concentration_bps during POST /policy-valuations, POST /death-claims/{id}/distribute or POST /exchange-analyses/{id}/execute-surrender"
        actor: system
        preconditions:
          - "recomputed Carrier.concentration_bps <= CARRIER_RELEASE_BPS"
        side_effects:
          - "sets Carrier.concentration_bps to the recomputed value"
          - "increments Carrier.version by 1"
      - from: RESTRICTED
        to: RESTRICTED
        trigger: "system re-evaluation of Carrier.concentration_bps during POST /policy-valuations"
        actor: system
        preconditions:
          - "recomputed Carrier.concentration_bps > CARRIER_RELEASE_BPS"
        side_effects:
          - "sets Carrier.concentration_bps to the recomputed value"
          - "increments Carrier.version by 1"
        note: "explicit self-loop: a value inside the hysteresis band (1201..1499 bps) does NOT release the restriction"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /carriers/{id}/suspend"
        actor: RiskOfficer
        preconditions:
          - "Carrier.status IN {AUTHORIZED, RESTRICTED}"
        side_effects:
          - "increments Carrier.version by 1"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "POST /carriers/{id}/suspend"
        actor: RiskOfficer
        preconditions:
          - "Carrier.status IN {AUTHORIZED, RESTRICTED}"
        side_effects:
          - "increments Carrier.version by 1"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /carriers/{id}/reinstate"
        actor: RiskOfficer
        preconditions:
          - "Carrier.concentration_bps <= CARRIER_RELEASE_BPS"
          - "Carrier.watch_list_flag == false"
        side_effects:
          - "increments Carrier.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /carriers/{id}/terminate"
        actor: RiskOfficer
        preconditions:
          - "no Policy with carrier_id == Carrier.id has status IN {IN_FORCE, PENDING_EXCHANGE, CLAIM_PENDING}"
        side_effects:
          - "cascades every ProductType with carrier_id == Carrier.id and status IN {OPEN, ON_WATCH} to CLOSED_TO_NEW"
          - "cascades every PolicyPurchaseRequest with carrier_id == Carrier.id and status IN {SUBMITTED, DILIGENCE_CLEARED, CAPACITY_RESERVED, NOTICE_FILED, CONCURRENCE_PENDING, APPROVED} to REJECTED, releasing each request's reserved_premium_usd from Carrier.reserved_premium_usd"
          - "increments Carrier.version by 1"

  - entity: ProductType
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED_TO_NEW]
    transitions:
      - from: OPEN
        to: ON_WATCH
        trigger: "POST /policy-valuations (cascaded mortality-and-expense drift evaluation)"
        actor: system
        preconditions:
          - "PolicyValuation.me_drift_bps > ME_DRIFT_TOLERANCE_BPS"
        side_effects:
          - "sets ProductType.latest_me_charge_bps and ProductType.latest_me_drift_bps from the posted valuation"
          - "increments ProductType.version by 1"
      - from: ON_WATCH
        to: OPEN
        trigger: "POST /product-types/{id}/clear-watch"
        actor: RiskOfficer
        preconditions:
          - "ProductType.latest_me_drift_bps <= ME_DRIFT_TOLERANCE_BPS"
        side_effects:
          - "resets ProductType.consecutive_low_yield_count to 0"
          - "increments ProductType.version by 1"
      - from: OPEN
        to: CLOSED_TO_NEW
        trigger: "POST /policy-valuations (cascaded low-yield streak evaluation)"
        actor: system
        preconditions:
          - "ProductType.consecutive_low_yield_count >= CONSECUTIVE_LOW_YIELD_LIMIT after this posting"
        side_effects:
          - "sets Carrier.watch_list_flag = true on the owning carrier and increments Carrier.version by 1"
          - "the carrier's watch_list_flag becoming true then drives every DiligenceReview of that carrier in UNDER_REVIEW to INFO_REQUESTED"
          - "increments ProductType.version by 1"
      - from: ON_WATCH
        to: CLOSED_TO_NEW
        trigger: "POST /policy-valuations (cascaded low-yield streak evaluation)"
        actor: system
        preconditions:
          - "ProductType.consecutive_low_yield_count >= CONSECUTIVE_LOW_YIELD_LIMIT after this posting"
        side_effects:
          - "sets Carrier.watch_list_flag = true on the owning carrier and increments Carrier.version by 1"
          - "the carrier's watch_list_flag becoming true then drives every DiligenceReview of that carrier in UNDER_REVIEW to INFO_REQUESTED"
          - "increments ProductType.version by 1"

  - entity: DiligenceReview
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /diligence-reviews/{id}/submit"
        actor: BenefitsAnalyst
        preconditions:
          - "Carrier.status IN {PENDING_DILIGENCE, AUTHORIZED, RESTRICTED}"
          - "at least one CapitalPosition exists"
        side_effects:
          - "recomputes rating_points, surplus_points, concentration_points and financial_strength_score via carrier_financial_strength_score"
          - "sets DiligenceReview.submitted_by_user_id = X-User-ID"
          - "increments DiligenceReview.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /diligence-reviews/{id}/request-info"
        actor: RiskOfficer
        preconditions:
          - "DiligenceReview.info_request_count < INFO_REQUEST_LIMIT"
        side_effects:
          - "increments DiligenceReview.info_request_count by 1"
          - "increments DiligenceReview.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /policy-valuations (cascaded: the owning carrier's watch_list_flag became true)"
        actor: system
        preconditions:
          - "Carrier.watch_list_flag transitioned false -> true in this request"
        side_effects:
          - "increments DiligenceReview.info_request_count by 1, without regard to INFO_REQUEST_LIMIT"
          - "increments DiligenceReview.version by 1"
        note: "third hop of the valuation cascade; the operator-driven request-info path is capped, the cascaded path is not"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /diligence-reviews/{id}/submit"
        actor: BenefitsAnalyst
        preconditions:
          - "Carrier.status IN {PENDING_DILIGENCE, AUTHORIZED, RESTRICTED}"
          - "at least one CapitalPosition exists"
        side_effects:
          - "recomputes financial_strength_score via carrier_financial_strength_score"
          - "sets DiligenceReview.submitted_by_user_id = X-User-ID"
          - "increments DiligenceReview.version by 1"
        note: "cycle UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW; the operator-driven loop terminates once info_request_count reaches INFO_REQUEST_LIMIT"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /diligence-reviews/{id}/approve"
        actor: RiskOfficer
        preconditions:
          - "DiligenceReview.financial_strength_score >= MIN_APPROVAL_SCORE"
          - "X-User-ID != DiligenceReview.submitted_by_user_id"
        side_effects:
          - "sets DiligenceReview.decided_by_user_id = X-User-ID"
          - "drives Carrier PENDING_DILIGENCE -> AUTHORIZED and sets Carrier.last_approved_review_year"
          - "increments DiligenceReview.version by 1"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /diligence-reviews/{id}/decline"
        actor: RiskOfficer
        preconditions:
          - "X-User-ID != DiligenceReview.submitted_by_user_id"
        side_effects:
          - "sets DiligenceReview.decided_by_user_id = X-User-ID"
          - "increments DiligenceReview.version by 1"
      - from: INFO_REQUESTED
        to: DECLINED
        trigger: "POST /diligence-reviews/{id}/decline"
        actor: RiskOfficer
        preconditions:
          - "X-User-ID != DiligenceReview.submitted_by_user_id"
        side_effects:
          - "sets DiligenceReview.decided_by_user_id = X-User-ID"
          - "increments DiligenceReview.version by 1"

  - entity: ConsentRecord
    state_field: status
    initial_state: DRAFT
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /consent-records/{id}/execute"
        actor: BenefitsAnalyst
        preconditions:
          - "Employee.employment_status == ACTIVE"
          - "logical clock <= ConsentRecord.coverage_end_date"
        side_effects:
          - "sets ConsentRecord.executed_at = logical clock"
          - "recomputes Employee.insurable_interest_status: ESTABLISHED when Employee.annual_salary_usd >= INSURABLE_INTEREST_MIN_SALARY_USD or Employee.officer_flag == true, otherwise NOT_ESTABLISHED"
          - "increments ConsentRecord.version by 1"
      - from: EXECUTED
        to: REVOKED
        trigger: "POST /consent-records/{id}/revoke"
        actor: BenefitsAnalyst
        preconditions:
          - "ConsentRecord.status == EXECUTED"
        side_effects:
          - "sets Employee.insurable_interest_status = NOT_ESTABLISHED when no other ConsentRecord of that employee is EXECUTED"
          - "increments ConsentRecord.version by 1"
      - from: EXECUTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system sweep)"
        actor: system
        preconditions:
          - "new logical clock value > ConsentRecord.coverage_end_date"
        side_effects:
          - "sets Employee.insurable_interest_status = NOT_ESTABLISHED when no other ConsentRecord of that employee remains EXECUTED"
          - "increments ConsentRecord.version by 1"

  - entity: PolicyPurchaseRequest
    state_field: status
    initial_state: DRAFT
    terminal_states: [ISSUED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /purchase-requests/{id}/submit"
        actor: BenefitsAnalyst
        preconditions:
          - "an EXECUTED ConsentRecord exists for PolicyPurchaseRequest.employee_id whose coverage_start_date <= requested_effective_date <= coverage_end_date"
          - "Employee.insurable_interest_status == ESTABLISHED"
          - "ProductType.carrier_id == PolicyPurchaseRequest.carrier_id"
        side_effects:
          - "sets PolicyPurchaseRequest.notice_required = single_premium_usd > NOTICE_THRESHOLD_USD"
          - "sets PolicyPurchaseRequest.submitted_by_user_id = X-User-ID"
          - "increments PolicyPurchaseRequest.version by 1"
      - from: SUBMITTED
        to: DILIGENCE_CLEARED
        trigger: "POST /purchase-requests/{id}/clear-diligence"
        actor: RiskOfficer
        preconditions:
          - "Carrier.status == AUTHORIZED"
          - "the DiligenceReview of that carrier with the greatest review_year among status == APPROVED rows has financial_strength_score >= MIN_APPROVAL_SCORE"
          - "ProductType.status IN {OPEN, ON_WATCH}"
        side_effects:
          - "increments PolicyPurchaseRequest.version by 1"
        note: "cross-entity state dependency: PolicyPurchaseRequest advance is gated on Carrier.status"
      - from: DILIGENCE_CLEARED
        to: CAPACITY_RESERVED
        trigger: "POST /purchase-requests/{id}/reserve-capacity"
        actor: TreasuryController
        preconditions:
          - "expected_carrier_version == Carrier.version"
          - "purchase_capacity_headroom yields headroom_usd >= 0"
          - "purchase_capacity_headroom yields carrier_concentration_bps <= the product's single-carrier limit"
        side_effects:
          - "writes base_ratio_bps, effective_limit_pct, aggregate_limit_usd, headroom_usd and carrier_concentration_bps onto the request"
          - "sets PolicyPurchaseRequest.reserved_premium_usd = single_premium_usd"
          - "adds single_premium_usd to Carrier.reserved_premium_usd and increments Carrier.version by 1"
          - "increments PolicyPurchaseRequest.version by 1"
      - from: CAPACITY_RESERVED
        to: NOTICE_FILED
        trigger: "POST /purchase-requests/{id}/file-notice"
        actor: TreasuryController
        preconditions:
          - "PolicyPurchaseRequest.notice_required == true"
        side_effects:
          - "sets notice_filed_at = logical clock and notice_waiting_ends_at = logical clock + NOTICE_WAITING_PERIOD_DAYS"
          - "increments Carrier.regulatory_notice_count by 1 and increments Carrier.version by 1"
          - "increments PolicyPurchaseRequest.version by 1"
        note: "branch A of the fork at CAPACITY_RESERVED; taken when the premium exceeds NOTICE_THRESHOLD_USD"
      - from: CAPACITY_RESERVED
        to: CONCURRENCE_PENDING
        trigger: "POST /purchase-requests/{id}/request-concurrence"
        actor: BenefitsAnalyst
        preconditions:
          - "PolicyPurchaseRequest.notice_required == false"
        side_effects:
          - "sets concurrence_requested_at = logical clock"
          - "increments PolicyPurchaseRequest.version by 1"
        note: "branch B of the fork at CAPACITY_RESERVED; leaves notice_filed_at and notice_waiting_ends_at null, and does NOT touch Carrier.regulatory_notice_count"
      - from: NOTICE_FILED
        to: CONCURRENCE_PENDING
        trigger: "POST /purchase-requests/{id}/request-concurrence"
        actor: BenefitsAnalyst
        preconditions:
          - "PolicyPurchaseRequest.notice_filed_at is not null"
        side_effects:
          - "sets concurrence_requested_at = logical clock"
          - "increments PolicyPurchaseRequest.version by 1"
        note: "join point of the fork: both branches converge on CONCURRENCE_PENDING with divergent notice fields"
      - from: CONCURRENCE_PENDING
        to: APPROVED
        trigger: "POST /purchase-requests/{id}/approve"
        actor: RiskOfficer
        preconditions:
          - "X-User-ID != PolicyPurchaseRequest.submitted_by_user_id"
          - "when notice_filed_at is not null, logical clock >= notice_waiting_ends_at"
        side_effects:
          - "sets PolicyPurchaseRequest.approved_by_user_id = X-User-ID"
          - "increments PolicyPurchaseRequest.version by 1"
        note: "the waiting-period precondition applies only on branch A, so the two branches are not interchangeable at the join"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /policies"
        actor: BenefitsAnalyst
        preconditions:
          - "no Policy already references this purchase_request_id"
          - "Carrier.status == AUTHORIZED"
        side_effects:
          - "creates the Policy with cost_basis_usd = single_premium_usd and cash_surrender_value_usd = single_premium_usd"
          - "moves single_premium_usd from Carrier.reserved_premium_usd to Carrier.in_force_premium_usd, adds it to Carrier.in_force_cash_value_usd, recomputes Carrier.concentration_bps and applies the hysteresis, and increments Carrier.version by 1"
          - "sets PolicyPurchaseRequest.reserved_premium_usd = 0.00"
          - "increments PolicyPurchaseRequest.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /purchase-requests/{id}/reject"
        actor: RiskOfficer
        preconditions:
          - "PolicyPurchaseRequest.status IN {SUBMITTED, DILIGENCE_CLEARED, CAPACITY_RESERVED, NOTICE_FILED, CONCURRENCE_PENDING, APPROVED}"
        side_effects:
          - "subtracts PolicyPurchaseRequest.reserved_premium_usd from Carrier.reserved_premium_usd and increments Carrier.version by 1"
          - "sets PolicyPurchaseRequest.reserved_premium_usd = 0.00"
          - "increments PolicyPurchaseRequest.version by 1"
      - from: CAPACITY_RESERVED
        to: REJECTED
        trigger: "POST /purchase-requests/{id}/reject"
        actor: RiskOfficer
        preconditions:
          - "PolicyPurchaseRequest.status IN {SUBMITTED, DILIGENCE_CLEARED, CAPACITY_RESERVED, NOTICE_FILED, CONCURRENCE_PENDING, APPROVED}"
        side_effects:
          - "subtracts PolicyPurchaseRequest.reserved_premium_usd from Carrier.reserved_premium_usd and increments Carrier.version by 1"
          - "sets PolicyPurchaseRequest.reserved_premium_usd = 0.00"
          - "increments PolicyPurchaseRequest.version by 1"
      - from: NOTICE_FILED
        to: WITHDRAWN
        trigger: "POST /purchase-requests/{id}/withdraw"
        actor: BenefitsAnalyst
        preconditions:
          - "PolicyPurchaseRequest.status IN {SUBMITTED, DILIGENCE_CLEARED, CAPACITY_RESERVED, NOTICE_FILED, CONCURRENCE_PENDING}"
          - "X-User-ID == PolicyPurchaseRequest.submitted_by_user_id"
        side_effects:
          - "subtracts PolicyPurchaseRequest.reserved_premium_usd from Carrier.reserved_premium_usd and increments Carrier.version by 1"
          - "sets PolicyPurchaseRequest.reserved_premium_usd = 0.00"
          - "increments PolicyPurchaseRequest.version by 1"
        note: "compensating action for reserve-capacity; restores the reserved-premium conservation invariant exactly"
      - from: CAPACITY_RESERVED
        to: WITHDRAWN
        trigger: "POST /purchase-requests/{id}/withdraw"
        actor: BenefitsAnalyst
        preconditions:
          - "PolicyPurchaseRequest.status IN {SUBMITTED, DILIGENCE_CLEARED, CAPACITY_RESERVED, NOTICE_FILED, CONCURRENCE_PENDING}"
          - "X-User-ID == PolicyPurchaseRequest.submitted_by_user_id"
        side_effects:
          - "subtracts PolicyPurchaseRequest.reserved_premium_usd from Carrier.reserved_premium_usd and increments Carrier.version by 1"
          - "sets PolicyPurchaseRequest.reserved_premium_usd = 0.00"
          - "increments PolicyPurchaseRequest.version by 1"

  - entity: Policy
    state_field: status
    initial_state: IN_FORCE
    terminal_states: [EXCHANGED, SURRENDERED, PAID_OUT]
    transitions:
      - from: IN_FORCE
        to: PENDING_EXCHANGE
        trigger: "POST /exchange-analyses/{id}/commit"
        actor: TreasuryController
        preconditions:
          - "ExchangeSurrenderAnalysis.status == REVIEWED"
          - "Policy.status == IN_FORCE"
        side_effects:
          - "increments Policy.version by 1"
        note: "cross-entity state dependency: the analysis can only commit while its policy is IN_FORCE"
      - from: PENDING_EXCHANGE
        to: IN_FORCE
        trigger: "POST /exchange-analyses/{id}/abandon"
        actor: TreasuryController
        preconditions:
          - "ExchangeSurrenderAnalysis.status == COMMITTED"
        side_effects:
          - "restores Policy.cost_basis_usd and Policy.cash_surrender_value_usd to their pre-commit values"
          - "increments Policy.version by 1"
        note: "compensating action; the cost-basis conservation invariant holds exactly across commit + abandon"
      - from: PENDING_EXCHANGE
        to: EXCHANGED
        trigger: "POST /exchange-analyses/{id}/execute-exchange"
        actor: TreasuryController
        preconditions:
          - "ExchangeSurrenderAnalysis.status == COMMITTED"
          - "ExchangeSurrenderAnalysis.disposition_type == EXCHANGE_1035"
          - "ExchangeSurrenderAnalysis.replacement_carrier_id is not null and that Carrier.status == AUTHORIZED"
        side_effects:
          - "creates a successor Policy with exchanged_from_policy_id = this policy, single_premium_usd = net transferred cash value, cost_basis_usd carried over unchanged, cash_surrender_value_usd = net transferred cash value, policy_year = 1"
          - "sets ExchangeSurrenderAnalysis.resulting_policy_id to the successor policy"
          - "removes this policy's premium and cash value from the old Carrier's in_force totals, adds the successor's to the replacement Carrier's totals, recomputes both carriers' concentration_bps with the hysteresis, and increments both Carrier.version values by 1"
          - "increments Policy.version by 1"
      - from: PENDING_EXCHANGE
        to: SURRENDERED
        trigger: "POST /exchange-analyses/{id}/execute-surrender"
        actor: TreasuryController
        preconditions:
          - "ExchangeSurrenderAnalysis.status == COMMITTED"
          - "ExchangeSurrenderAnalysis.disposition_type IN {FULL_SURRENDER, PARTIAL_SURRENDER}"
        side_effects:
          - "sets Policy.cash_surrender_value_usd = 0.00 for FULL_SURRENDER, or reduces it by requested_withdrawal_usd for PARTIAL_SURRENDER"
          - "removes the policy from the Carrier in_force totals for FULL_SURRENDER, recomputes Carrier.concentration_bps with the hysteresis, and increments Carrier.version by 1"
          - "sets every NqdcParticipantLiability with matched_policy_id == this policy to matched_policy_id = null; that unmatch then recomputes the owning NqdcPlan totals and funding_posture, which then drives NqdcPlan ACTIVE -> FROZEN when the posture becomes CRITICAL"
          - "increments Policy.version by 1"
      - from: IN_FORCE
        to: CLAIM_PENDING
        trigger: "POST /death-claims"
        actor: ClaimsAdministrator
        preconditions:
          - "Policy.status == IN_FORCE"
        side_effects:
          - "sets Employee.employment_status = DECEASED and increments Employee.version by 1"
          - "increments Policy.version by 1"
      - from: CLAIM_PENDING
        to: IN_FORCE
        trigger: "POST /death-claims/{id}/void"
        actor: ClaimsAdministrator
        preconditions:
          - "DeathBenefitClaim.distribution_status != DISTRIBUTED"
        side_effects:
          - "sets Employee.employment_status = ACTIVE and increments Employee.version by 1"
          - "voids every ACTIVE BeneficiaryAllocation of the claim and resets DeathBenefitClaim.allocated_bps_total to 0"
          - "increments Policy.version by 1"
      - from: CLAIM_PENDING
        to: PAID_OUT
        trigger: "POST /death-claims/{id}/distribute"
        actor: ClaimsAdministrator
        preconditions:
          - "DeathBenefitClaim.adjudication_status == APPROVED"
          - "DeathBenefitClaim.distribution_status == ALLOCATED"
        side_effects:
          - "sets Policy.cash_surrender_value_usd = 0.00"
          - "removes the policy's premium and cash value from the Carrier in_force totals, recomputes Carrier.concentration_bps with the hysteresis, and increments Carrier.version by 1"
          - "sets every NqdcParticipantLiability with matched_policy_id == this policy to matched_policy_id = null; that unmatch then recomputes the owning NqdcPlan totals and funding_posture, which then drives NqdcPlan ACTIVE -> FROZEN when the posture becomes CRITICAL"
          - "increments Policy.version by 1"

  - entity: DeathBenefitClaim
    state_field: adjudication_status
    initial_state: FILED
    terminal_states: [DENIED, VOIDED]
    transitions:
      - from: FILED
        to: UNDER_ADJUDICATION
        trigger: "POST /death-claims/{id}/start-adjudication"
        actor: ClaimsAdministrator
        preconditions:
          - "DeathBenefitClaim.adjudication_status == FILED"
        side_effects:
          - "increments DeathBenefitClaim.version by 1"
      - from: UNDER_ADJUDICATION
        to: APPROVED
        trigger: "POST /death-claims/{id}/approve"
        actor: RiskOfficer
        preconditions:
          - "X-User-ID != DeathBenefitClaim.filed_by_user_id"
        side_effects:
          - "recomputes total_death_benefit_usd, survivor_entitlement_usd and bank_portion_usd via death_benefit_split"
          - "sets DeathBenefitClaim.adjudicated_by_user_id = X-User-ID"
          - "increments DeathBenefitClaim.version by 1"
      - from: UNDER_ADJUDICATION
        to: DENIED
        trigger: "POST /death-claims/{id}/deny"
        actor: RiskOfficer
        preconditions:
          - "X-User-ID != DeathBenefitClaim.filed_by_user_id"
        side_effects:
          - "sets DeathBenefitClaim.adjudicated_by_user_id = X-User-ID"
          - "drives Policy CLAIM_PENDING -> IN_FORCE and Employee back to ACTIVE"
          - "increments DeathBenefitClaim.version by 1"
      - from: FILED
        to: VOIDED
        trigger: "POST /death-claims/{id}/void"
        actor: ClaimsAdministrator
        preconditions:
          - "DeathBenefitClaim.distribution_status != DISTRIBUTED"
        side_effects:
          - "drives Policy CLAIM_PENDING -> IN_FORCE"
          - "increments DeathBenefitClaim.version by 1"
      - from: UNDER_ADJUDICATION
        to: VOIDED
        trigger: "POST /death-claims/{id}/void"
        actor: ClaimsAdministrator
        preconditions:
          - "DeathBenefitClaim.distribution_status != DISTRIBUTED"
        side_effects:
          - "drives Policy CLAIM_PENDING -> IN_FORCE"
          - "increments DeathBenefitClaim.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /death-claims/{id}/void"
        actor: ClaimsAdministrator
        preconditions:
          - "DeathBenefitClaim.distribution_status != DISTRIBUTED"
        side_effects:
          - "drives Policy CLAIM_PENDING -> IN_FORCE"
          - "voids every ACTIVE BeneficiaryAllocation and resets allocated_bps_total to 0"
          - "increments DeathBenefitClaim.version by 1"
        note: "parallel dimensions: adjudication_status may reach APPROVED while distribution_status is still NOT_STARTED or ALLOCATED"

  - entity: DeathBenefitClaim
    state_field: distribution_status
    initial_state: NOT_STARTED
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: NOT_STARTED
        to: ALLOCATED
        trigger: "POST /death-claims/{id}/seal-allocations"
        actor: ClaimsAdministrator
        preconditions:
          - "DeathBenefitClaim.adjudication_status == APPROVED"
          - "DeathBenefitClaim.allocated_bps_total == 10000"
        side_effects:
          - "computes gross_amount_usd on every ACTIVE BeneficiaryAllocation via death_benefit_split"
          - "increments DeathBenefitClaim.version by 1"
        note: "independent of the adjudication dimension except for this single guard on adjudication_status"
      - from: ALLOCATED
        to: NOT_STARTED
        trigger: "POST /beneficiary-allocations/{id}/void"
        actor: ClaimsAdministrator
        preconditions:
          - "DeathBenefitClaim.distribution_status == ALLOCATED"
        side_effects:
          - "sets BeneficiaryAllocation.status = VOIDED and gross_amount_usd = 0.00"
          - "reduces DeathBenefitClaim.allocated_bps_total by the voided allocation_pct_bps"
          - "increments DeathBenefitClaim.version by 1"
        note: "reverts the distribution dimension while leaving adjudication_status untouched at APPROVED"
      - from: ALLOCATED
        to: DISTRIBUTED
        trigger: "POST /death-claims/{id}/distribute"
        actor: ClaimsAdministrator
        preconditions:
          - "DeathBenefitClaim.adjudication_status == APPROVED"
        side_effects:
          - "drives Policy CLAIM_PENDING -> PAID_OUT with its full cascade"
          - "increments DeathBenefitClaim.version by 1"

  - entity: ExchangeSurrenderAnalysis
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXECUTED, ABANDONED, REJECTED]
    transitions:
      - from: DRAFT
        to: REVIEWED
        trigger: "POST /exchange-analyses/{id}/review"
        actor: RiskOfficer
        preconditions:
          - "Policy.status == IN_FORCE"
        side_effects:
          - "increments ExchangeSurrenderAnalysis.version by 1"
      - from: REVIEWED
        to: COMMITTED
        trigger: "POST /exchange-analyses/{id}/commit"
        actor: TreasuryController
        preconditions:
          - "Policy.status == IN_FORCE"
        side_effects:
          - "drives Policy IN_FORCE -> PENDING_EXCHANGE"
          - "increments ExchangeSurrenderAnalysis.version by 1"
      - from: REVIEWED
        to: REJECTED
        trigger: "POST /exchange-analyses/{id}/reject"
        actor: RiskOfficer
        preconditions:
          - "ExchangeSurrenderAnalysis.status == REVIEWED"
        side_effects:
          - "increments ExchangeSurrenderAnalysis.version by 1"
      - from: COMMITTED
        to: EXECUTED
        trigger: "POST /exchange-analyses/{id}/execute-exchange or POST /exchange-analyses/{id}/execute-surrender"
        actor: TreasuryController
        preconditions:
          - "Policy.status == PENDING_EXCHANGE"
        side_effects:
          - "drives Policy PENDING_EXCHANGE -> EXCHANGED or PENDING_EXCHANGE -> SURRENDERED with its full cascade"
          - "increments ExchangeSurrenderAnalysis.version by 1"
      - from: COMMITTED
        to: ABANDONED
        trigger: "POST /exchange-analyses/{id}/abandon"
        actor: TreasuryController
        preconditions:
          - "Policy.status == PENDING_EXCHANGE"
        side_effects:
          - "drives Policy PENDING_EXCHANGE -> IN_FORCE restoring cost_basis_usd and cash_surrender_value_usd"
          - "increments ExchangeSurrenderAnalysis.version by 1"

  - entity: NqdcPlan
    state_field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /nqdc-plans/{id}/freeze"
        actor: TreasuryController
        preconditions:
          - "NqdcPlan.status == ACTIVE"
        side_effects:
          - "increments NqdcPlan.version by 1"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /death-claims/{id}/distribute or POST /exchange-analyses/{id}/execute-surrender (cascaded funding recomputation)"
        actor: system
        preconditions:
          - "recomputed ACCRUAL-basis funding_posture == CRITICAL"
        side_effects:
          - "increments NqdcPlan.version by 1"
        note: "third hop of the distribution cascade: policy pay-out unmatches liabilities, the unmatch recomputes plan funding, the recomputed CRITICAL posture freezes the plan"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /nqdc-plans/{id}/unfreeze"
        actor: TreasuryController
        preconditions:
          - "recomputed ACCRUAL-basis funding_posture IN {FUNDED, UNDERFUNDED}"
        side_effects:
          - "increments NqdcPlan.version by 1"
        note: "cycle ACTIVE -> FROZEN -> ACTIVE"
      - from: FROZEN
        to: TERMINATED
        trigger: "POST /nqdc-plans/{id}/terminate"
        actor: TreasuryController
        preconditions:
          - "every NqdcParticipantLiability of the plan has status == SETTLED"
        side_effects:
          - "increments NqdcPlan.version by 1"

  - entity: RiskAssessment
    state_field: status
    initial_state: COMPILED
    terminal_states: [BOARD_ACCEPTED]
    transitions:
      - from: COMPILED
        to: BOARD_SUBMITTED
        trigger: "POST /risk-assessments/{id}/submit-to-board"
        actor: RiskOfficer
        preconditions:
          - "RiskAssessment.status IN {COMPILED, RETURNED}"
        side_effects:
          - "increments RiskAssessment.version by 1"
      - from: BOARD_SUBMITTED
        to: BOARD_ACCEPTED
        trigger: "POST /risk-assessments/{id}/accept"
        actor: BoardSecretary
        preconditions:
          - "RiskAssessment.status == BOARD_SUBMITTED"
        side_effects:
          - "increments RiskAssessment.version by 1"
      - from: BOARD_SUBMITTED
        to: RETURNED
        trigger: "POST /risk-assessments/{id}/return"
        actor: BoardSecretary
        preconditions:
          - "RiskAssessment.status == BOARD_SUBMITTED"
        side_effects:
          - "increments RiskAssessment.version by 1"
      - from: RETURNED
        to: BOARD_SUBMITTED
        trigger: "POST /risk-assessments/{id}/submit-to-board"
        actor: RiskOfficer
        preconditions:
          - "RiskAssessment.status IN {COMPILED, RETURNED}"
        side_effects:
          - "recompiles every count, risk_points and risk_rating via risk_assessment_rating"
          - "increments RiskAssessment.version by 1"
        note: "cycle BOARD_SUBMITTED -> RETURNED -> BOARD_SUBMITTED"

concurrency_rules:
  - rule_id: reserve-capacity-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /purchase-requests/{id}/reserve-capacity"
    occ_field: "expected_carrier_version"
    description: |
      Reserving capacity against a Carrier whose version has advanced since the
      TreasuryController last read it is rejected as stale. A second purchase
      request in DILIGENCE_CLEARED against the same carrier is a legitimate
      operation under the natural product semantics — no state field on the
      request or the carrier forbids it — but the reservation is sized against
      the carrier's reserved_premium_usd, which the earlier reservation already
      moved. The stale expected_carrier_version is what the system rejects.
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412

  - rule_id: analysis-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /exchange-analyses"
    occ_field: "expected_policy_version"
    description: |
      Creating an ExchangeSurrenderAnalysis supersedes every earlier analysis on
      the same policy that is still in DRAFT or REVIEWED, so a second create is
      legitimate under the product semantics and no state precondition rejects
      it. The system instead requires expected_policy_version to match
      Policy.version: an author whose view of the policy predates the earlier
      supersede is rejected as stale.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

calculations:
  - name: carrier_financial_strength_score
    trigger: "on POST /diligence-reviews/{id}/submit (DRAFT -> UNDER_REVIEW and INFO_REQUESTED -> UNDER_REVIEW)"
    algorithm: weighted_scoring
    formula: |
      rating_points        = RATING_POINTS[Carrier.am_best_rating]
      surplus_points       = min(100, floor(Carrier.statutory_surplus_usd / SURPLUS_UNIT_USD) * 10)
      concentration_points = max(0, 100 - (Carrier.concentration_bps / 20))
      raw                  = 0.50 * rating_points
                           + 0.30 * surplus_points
                           + 0.20 * concentration_points
      score                = round_half_up(raw, 0)
      if Carrier.watch_list_flag == true:
          score = min(60, score)
      # authorization gate applied by the APPROVE transition, not here:
      #   score >= MIN_APPROVAL_SCORE passes; score == MIN_APPROVAL_SCORE - 1 fails
    input_set: "the single Carrier named by DiligenceReview.carrier_id, read at submit time; Carrier.concentration_bps is whatever the carrier currently carries"
    constants:
      RATING_POINTS: { A_PLUS_PLUS: 100, A_PLUS: 90, A: 80, A_MINUS: 70, B_PLUS_PLUS: 55, B_PLUS: 40, B: 20 }
      SURPLUS_UNIT_USD: 500000000
      MIN_APPROVAL_SCORE: 65
      WATCH_LIST_SCORE_CAP: 60
      INFO_REQUEST_LIMIT: 2
    precision: "financial_strength_score is an integer, round_half_up on the weighted raw value; concentration_points keeps one decimal place"

  - name: purchase_capacity_headroom
    trigger: "on POST /purchase-requests/{id}/reserve-capacity and on GET /purchase-requests/{id}/capacity-projection"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED. The tier depends on the utilisation of the
      # BASE limit, and the limit itself depends on the tier, so the order below
      # is normative and is executed exactly once. There is NO second pass:
      # effective_limit_pct is frozen at step 6 and is never re-derived from the
      # step 8 result.
      step 1: tier1                = latest CapitalPosition.tier1_capital_usd
                                     (greatest as_of_date; tie-break created_at ASC)
                                     -> when no CapitalPosition exists: ERR_NO_CAPITAL_POSITION
      step 2: base_limit_usd       = round_half_up(tier1 * BASE_AGGREGATE_LIMIT_PCT, 2)
      step 3: committed_usd        = SUM(Carrier.reserved_premium_usd over ALL Carrier rows)
                                   + SUM(Policy.single_premium_usd over ALL Policy rows
                                         whose status IN {IN_FORCE, PENDING_EXCHANGE, CLAIM_PENDING})
      step 4: prospective_usd      = committed_usd + PolicyPurchaseRequest.single_premium_usd
      step 5: base_ratio_bps       = round_half_up(prospective_usd / base_limit_usd * 10000, 0)
      step 6: effective_limit_pct  = TIER_0 when base_ratio_bps <= TIER_1_BREAK_BPS
                                     TIER_1 when TIER_1_BREAK_BPS < base_ratio_bps <= TIER_2_BREAK_BPS
                                     TIER_2 when base_ratio_bps > TIER_2_BREAK_BPS
      step 7: aggregate_limit_usd  = round_half_up(tier1 * effective_limit_pct, 2)
      step 8: headroom_usd         = aggregate_limit_usd - prospective_usd   # may be negative
      carrier_concentration_bps    = round_half_up(
                                       (Carrier.reserved_premium_usd
                                        + Carrier.in_force_premium_usd
                                        + PolicyPurchaseRequest.single_premium_usd) / tier1 * 10000, 0)
      single_carrier_limit_bps     = SINGLE_CARRIER_LIMIT_SEPARATE_BPS
                                       when ProductType.account_type == SEPARATE
                                     else SINGLE_CARRIER_LIMIT_GENERAL_BPS
      # gates, in the §1.4 priority order (concentration at priority 15, capital at 16):
      #   carrier_concentration_bps > single_carrier_limit_bps -> ERR_CARRIER_CONCENTRATION_EXCEEDED
      #   headroom_usd < 0                                     -> ERR_CAPITAL_CAPACITY_EXCEEDED
    input_set: "Carrier.reserved_premium_usd over every Carrier row; Policy.single_premium_usd over Policy rows in IN_FORCE, PENDING_EXCHANGE or CLAIM_PENDING only (EXCHANGED, SURRENDERED and PAID_OUT are excluded); the requesting PolicyPurchaseRequest's own single_premium_usd is always added even though the request is not yet reserved"
    constants:
      BASE_AGGREGATE_LIMIT_PCT: 0.25
      TIER_1_BREAK_BPS: 6000
      TIER_2_BREAK_BPS: 8500
      TIER_0: 0.25
      TIER_1: 0.22
      TIER_2: 0.20
      SINGLE_CARRIER_LIMIT_GENERAL_BPS: 1500
      SINGLE_CARRIER_LIMIT_SEPARATE_BPS: 1000
    precision: "USD amounts 2 decimal places round_half_up; every bps value is an integer produced by round_half_up on the un-truncated ratio"

  - name: nqdc_liability_valuation
    trigger: "on POST /nqdc-liabilities, on POST /nqdc-plans/{id}/revalue, on GET /nqdc-plans/{id}/funding-summary, and as the cascaded recompute inside POST /death-claims/{id}/distribute and POST /exchange-analyses/{id}/execute-surrender"
    algorithm: aggregation
    formula: |
      # per participant, both variants
      accrued_i    = NqdcParticipantLiability.accrued_to_date_usd
      discounted_i = round_half_up(
                       NqdcParticipantLiability.projected_benefit_usd
                       / (1 + NqdcPlan.discount_rate_bps / 10000) ** NqdcParticipantLiability.years_to_payout,
                       2)
      # plan level: round per participant FIRST, then sum
      accrual_liability_usd  = SUM(accrued_i)
      pbo_liability_usd      = SUM(discounted_i)
      matched_cash_value_usd = SUM(Policy.cash_surrender_value_usd
                                   for each ACTIVE liability whose matched_policy_id is not null
                                   and whose policy status IN {IN_FORCE, PENDING_EXCHANGE, CLAIM_PENDING})
      basis_liability        = accrual_liability_usd   when basis == ACCRUAL
                             = pbo_liability_usd       when basis == PBO
      funded_ratio_bps       = 10000 when basis_liability == 0.00
                             else round_half_up(matched_cash_value_usd / basis_liability * 10000, 0)
      funding_posture        = FUNDED       when funded_ratio_bps >= FUNDED_MIN_BPS
                             = UNDERFUNDED  when funded_ratio_bps >= UNDERFUNDED_MIN_BPS
                             = CRITICAL     otherwise
      # NqdcPlan.funded_ratio_bps and NqdcPlan.funding_posture are ALWAYS persisted
      # on the ACCRUAL basis. The PBO basis is exposed on demand through
      # GET /nqdc-plans/{id}/funding-summary?basis=PBO and is the basis the annual
      # risk assessment counts.
    input_set: "NqdcParticipantLiability rows of the plan whose status == ACTIVE; SETTLED liabilities are excluded from both variants and from matched_cash_value_usd"
    constants:
      FUNDED_MIN_BPS: 10000
      UNDERFUNDED_MIN_BPS: 8000
    precision: "per-participant discounted_benefit_usd rounded to 2 decimals round_half_up before summation; funded_ratio_bps an integer round_half_up"
    variants:
      - name: ACCRUAL
        when: "the value persisted on NqdcPlan and returned by GET /nqdc-plans/{id}/funding-summary with basis omitted or basis=ACCRUAL"
        difference: "liability is the undiscounted sum of accrued_to_date_usd, so the posture is systematically more favourable than the PBO view"
      - name: PBO
        when: "GET /nqdc-plans/{id}/funding-summary?basis=PBO, and the basis the annual RiskAssessment counts plans on"
        difference: "liability is the sum of projected_benefit_usd discounted at NqdcPlan.discount_rate_bps over years_to_payout, so the same participants can be UNDERFUNDED on ACCRUAL and CRITICAL on PBO"

  - name: policy_taxable_gain
    trigger: "on POST /exchange-analyses and on POST /exchange-analyses/{id}/review"
    algorithm: threshold
    formula: |
      product              = ProductType named by Policy.product_type_id
      cost_recovery_method = LIFO_INCOME_FIRST when product.mec_status == MEC
                             else FIFO_BASIS_FIRST
      charge_bps           = SURRENDER_CHARGE_BPS_BY_YEAR[min(Policy.policy_year, 7)]
      basis                = Policy.cost_basis_usd
      csv                  = Policy.cash_surrender_value_usd
      if disposition_type == FULL_SURRENDER:
          gross         = csv
          taxable_gain  = max(0.00, csv - basis)
      elif disposition_type == PARTIAL_SURRENDER:
          gross         = requested_withdrawal_usd            # must be <= csv
          gain_in_policy = max(0.00, csv - basis)
          taxable_gain  = max(0.00, gross - basis)             when cost_recovery_method == FIFO_BASIS_FIRST
                        = min(gross, gain_in_policy)           when cost_recovery_method == LIFO_INCOME_FIRST
      else:  # EXCHANGE_1035
          gross         = csv
          taxable_gain  = 0.00
      surrender_charge_usd = round_half_up(gross * charge_bps / 10000, 2)
      tax_liability_usd    = round_half_up(taxable_gain * (FEDERAL_TAX_RATE_BPS + STATE_TAX_RATE_BPS) / 10000, 2)
      net_proceeds_usd     = gross - surrender_charge_usd - tax_liability_usd
      # on execute-exchange the successor policy receives
      #   single_premium_usd        = net_proceeds_usd
      #   cash_surrender_value_usd  = net_proceeds_usd
      #   cost_basis_usd            = basis            (carried over unchanged)
    input_set: "the single Policy named by policy_id together with its ProductType; no aggregation over sibling policies"
    constants:
      SURRENDER_CHARGE_BPS_BY_YEAR: { 1: 600, 2: 500, 3: 400, 4: 300, 5: 200, 6: 100, 7: 0 }
      FEDERAL_TAX_RATE_BPS: 2100
      STATE_TAX_RATE_BPS: 600
    precision: "2 decimal places round_half_up; surrender_charge_usd and tax_liability_usd are each rounded before the subtraction, never after"
    variants:
      - name: FIFO_BASIS_FIRST
        when: "ProductType.mec_status == NON_MEC"
        difference: "a partial withdrawal recovers cost basis first, so taxable_gain is max(0, withdrawal - basis) and a withdrawal below basis is entirely tax free"
      - name: LIFO_INCOME_FIRST
        when: "ProductType.mec_status == MEC"
        difference: "a partial withdrawal distributes income first, so taxable_gain is min(withdrawal, csv - basis) and the same withdrawal on identical figures is fully taxable up to the inside build-up"

  - name: death_benefit_split
    trigger: "on POST /death-claims/{id}/approve (total, survivor and bank amounts) and on POST /death-claims/{id}/seal-allocations (per-beneficiary amounts)"
    algorithm: waterfall_allocation
    formula: |
      total_death_benefit_usd  = Policy.face_amount_usd + DeathBenefitClaim.terminal_dividend_usd
      cap_usd                  = round_half_up(total_death_benefit_usd * FAMILY_CAP_PCT, 2)
      multiple_usd             = round_half_up(Employee.annual_salary_usd * SURVIVOR_MULTIPLE, 2)
      survivor_entitlement_usd = min(cap_usd, multiple_usd)
      bank_portion_usd         = total_death_benefit_usd - survivor_entitlement_usd
      # PINNED ROUNDING ORDER: round PER ALLOCATION first, then sum, then push the
      # residual onto ONE allocation. Summing the unrounded shares and rounding the
      # total would produce different cents; that order is NOT used.
      for each ACTIVE BeneficiaryAllocation a, ordered by created_at ASC:
          a.gross_amount_usd = round_half_up(
                                 survivor_entitlement_usd * a.allocation_pct_bps / 10000, 2)
      residual_usd = survivor_entitlement_usd - SUM(a.gross_amount_usd)
      # residual_usd may be POSITIVE or NEGATIVE
      target       = the ACTIVE allocation with the greatest allocation_pct_bps;
                     tie-break created_at ASC (never id)
      target.gross_amount_usd = target.gross_amount_usd + residual_usd
      # conserved quantity, asserted after every allocation mutation:
      #   total_death_benefit_usd == bank_portion_usd + SUM(ACTIVE a.gross_amount_usd)
    input_set: "BeneficiaryAllocation rows of the claim whose status == ACTIVE; VOIDED allocations contribute neither bps nor amount"
    constants:
      FAMILY_CAP_PCT: 0.60
      SURVIVOR_MULTIPLE: 2.0
      ALLOCATION_BPS_TOTAL: 10000
    precision: "2 decimal places round_half_up per allocation, then a single signed residual adjustment on the greatest-bps allocation so the parts sum exactly to survivor_entitlement_usd"

  - name: valuation_net_yield
    trigger: "on POST /policy-valuations"
    algorithm: chronological
    formula: |
      prior_cash_value_usd = Policy.cash_surrender_value_usd immediately before this posting
      cash_value_usd       = round_half_up(prior_cash_value_usd
                                           + credited_interest_usd
                                           - mortality_expense_charge_usd
                                           + market_value_adjustment_usd, 2)
      net_yield_bps        = round_half_up((credited_interest_usd - mortality_expense_charge_usd)
                                           / prior_cash_value_usd * 10000, 0)
      me_charge_bps        = round_half_up(mortality_expense_charge_usd
                                           / prior_cash_value_usd * 10000, 0)
      me_drift_bps         = me_charge_bps - ProductType.disclosed_me_charge_bps
      # side-effect order is PINNED and executed exactly in this sequence:
      #  1. persist the PolicyValuation row
      #  2. Policy.cash_surrender_value_usd = cash_value_usd
      #  3. recompute Carrier.in_force_cash_value_usd and Carrier.concentration_bps,
      #     then apply the hysteresis:
      #       AUTHORIZED -> RESTRICTED when concentration_bps >= CARRIER_RESTRICT_BPS
      #       RESTRICTED -> AUTHORIZED when concentration_bps <= CARRIER_RELEASE_BPS
      #       RESTRICTED -> RESTRICTED otherwise (band 1201..1499 does not release)
      #  4. ProductType.latest_me_charge_bps / latest_me_drift_bps = this row's values;
      #     OPEN -> ON_WATCH when me_drift_bps > ME_DRIFT_TOLERANCE_BPS
      #     (exactly ME_DRIFT_TOLERANCE_BPS does NOT trip the watch)
      #  5. ProductType.consecutive_low_yield_count += 1 when
      #     net_yield_bps < MIN_ACCEPTABLE_NET_YIELD_BPS, else reset to 0;
      #     count >= CONSECUTIVE_LOW_YIELD_LIMIT drives the product to CLOSED_TO_NEW
      #  6. a product reaching CLOSED_TO_NEW sets Carrier.watch_list_flag = true
      #  7. Carrier.watch_list_flag turning true drives every DiligenceReview of that
      #     carrier in UNDER_REVIEW to INFO_REQUESTED
    input_set: "the single Policy named by policy_id and its ProductType; the low-yield streak counter is per ProductType and spans every policy of that product, ordered by as_of_date then created_at ASC"
    constants:
      ME_DRIFT_TOLERANCE_BPS: 25
      MIN_ACCEPTABLE_NET_YIELD_BPS: 150
      CONSECUTIVE_LOW_YIELD_LIMIT: 2
      CARRIER_RESTRICT_BPS: 1500
      CARRIER_RELEASE_BPS: 1200
    precision: "USD 2 decimal places round_half_up; net_yield_bps, me_charge_bps and me_drift_bps are integers produced by round_half_up and may be negative"

  - name: risk_assessment_rating
    trigger: "on POST /risk-assessments and on POST /risk-assessments/{id}/submit-to-board from RETURNED"
    algorithm: aggregation
    formula: |
      restricted_carrier_count = COUNT(Carrier where concentration_bps > CARRIER_RESTRICT_BPS
                                       and status != TERMINATED)
      watch_list_carrier_count = COUNT(Carrier where watch_list_flag == true
                                       and status != TERMINATED)
      on_watch_product_count   = COUNT(ProductType where status == ON_WATCH)
      closed_product_count     = COUNT(ProductType where status == CLOSED_TO_NEW)
      # both plan counts use the PBO basis, NOT the ACCRUAL posture persisted on NqdcPlan
      critical_plan_count      = COUNT(NqdcPlan where status != TERMINATED
                                       and PBO-basis funding_posture == CRITICAL)
      underfunded_plan_count   = COUNT(NqdcPlan where status != TERMINATED
                                       and PBO-basis funding_posture == UNDERFUNDED)
      risk_points = restricted_carrier_count * W_RESTRICTED_CARRIER
                  + watch_list_carrier_count * W_WATCH_CARRIER
                  + on_watch_product_count   * W_ON_WATCH_PRODUCT
                  + closed_product_count     * W_CLOSED_PRODUCT
                  + critical_plan_count      * W_CRITICAL_PLAN
                  + underfunded_plan_count   * W_UNDERFUNDED_PLAN
      risk_rating = SEVERE   when risk_points >= SEVERE_MIN_POINTS
                  = HIGH     when risk_points >= HIGH_MIN_POINTS
                  = MODERATE when risk_points >= MODERATE_MIN_POINTS
                  = LOW      otherwise
    input_set: "every Carrier whose status != TERMINATED, every ProductType regardless of carrier status, every NqdcPlan whose status != TERMINATED evaluated on the PBO basis; the RiskAssessment's own capital_position_id supplies tier1_capital_usd for the report but does not enter risk_points"
    constants:
      W_RESTRICTED_CARRIER: 20
      W_WATCH_CARRIER: 15
      W_ON_WATCH_PRODUCT: 5
      W_CLOSED_PRODUCT: 10
      W_CRITICAL_PLAN: 25
      W_UNDERFUNDED_PLAN: 10
      MODERATE_MIN_POINTS: 15
      HIGH_MIN_POINTS: 35
      SEVERE_MIN_POINTS: 60
    precision: "all counts and risk_points are integers; no rounding involved"

  - name: purchase_request_gating
    trigger: "on POST /purchase-requests/{id}/submit (insurable interest and the notice flag), on POST /purchase-requests/{id}/file-notice (the waiting-period end) and on POST /purchase-requests/{id}/approve (the waiting-period gate)"
    algorithm: threshold
    formula: |
      # insurable interest, evaluated on POST /consent-records/{id}/execute and re-checked at submit
      insurable_interest_status = ESTABLISHED
          when Employee.annual_salary_usd >= INSURABLE_INTEREST_MIN_SALARY_USD
               or Employee.officer_flag == true
          else NOT_ESTABLISHED
      # regulatory notification, evaluated at submit; STRICTLY greater than the threshold
      notice_required = PolicyPurchaseRequest.single_premium_usd > NOTICE_THRESHOLD_USD
      # waiting period, evaluated at file-notice and enforced at approve
      notice_filed_at        = logical clock at file-notice
      notice_waiting_ends_at = notice_filed_at + NOTICE_WAITING_PERIOD_DAYS whole UTC days
      # approve gate on the notice branch only:
      #   notice_required == true and logical clock < notice_waiting_ends_at
      #     -> ERR_NOTICE_WAITING_PERIOD_ACTIVE
      #   logical clock == notice_waiting_ends_at passes (>= comparison)
    input_set: "the single PolicyPurchaseRequest under action together with the Employee named by its employee_id; no aggregation"
    constants:
      INSURABLE_INTEREST_MIN_SALARY_USD: 250000.00
      NOTICE_THRESHOLD_USD: 25000000.00
      NOTICE_WAITING_PERIOD_DAYS: 30
    precision: "USD comparisons at 2 decimal places; the waiting period is whole UTC days added to notice_filed_at"

  - name: consent_window_conflict
    trigger: "on POST /consent-records"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with a symmetric CONSENT_GAP_DAYS buffer on BOTH sides.
      # Two consent windows on the same employee conflict when
      #   new.coverage_start_date <= existing.coverage_end_date   + CONSENT_GAP_DAYS
      #   AND existing.coverage_start_date <= new.coverage_end_date + CONSENT_GAP_DAYS
      # A gap of EXACTLY CONSENT_GAP_DAYS still conflicts (<=);
      # a gap of CONSENT_GAP_DAYS + 1 day is accepted.
      conflict -> ERR_CONSENT_WINDOW_OVERLAP
    input_set: "ConsentRecord rows of the same employee_id whose status IN {DRAFT, EXECUTED}; REVOKED and EXPIRED rows never conflict"
    constants:
      CONSENT_GAP_DAYS: 30
    precision: "date arithmetic in whole UTC days; both interval endpoints inclusive"

  - name: valuation_period_conflict
    trigger: "on POST /policy-valuations"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [period_start_date, as_of_date) with NO buffer.
      # Two statement periods on the same policy conflict when
      #   new.period_start_date < existing.as_of_date
      #   AND existing.period_start_date < new.as_of_date
      # Adjacency (new.period_start_date == existing.as_of_date, gap 0) is ACCEPTED,
      # which is exactly what the buffered closed-interval consent rule rejects.
      conflict -> ERR_VALUATION_PERIOD_OVERLAP
    input_set: "every PolicyValuation row with the same policy_id; PolicyValuation is append-only and carries no status filter"
    constants:
      VALUATION_GAP_DAYS: 0
    precision: "instant comparison on the stored ISO 8601 UTC values; start inclusive, end exclusive"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the X-User-Role value is a role declared in §1.7 and that role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when X-User-Role == CarrierLiaison, X-User-ID equals the carrier_id of every resource named in the path or body"
    error_id: ERR_CARRIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles list includes CarrierLiaison"
  - priority: 4
    category: business_constraint
    check: "request body and query parameters are schema-valid: required fields present, types correct, enum members declared, USD amounts non-negative with at most 2 decimals, bps values integral, datetimes ISO 8601 UTC, limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "every id in the path exists, validated left to right; the error_id is the one for the entity that segment addresses"
    error_id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id (also ERR_PRODUCT_TYPE_NOT_FOUND, ERR_EMPLOYEE_NOT_FOUND, ERR_REVIEW_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_ANALYSIS_NOT_FOUND, ERR_RECORD_NOT_FOUND per addressed entity)"
  - priority: 6
    category: business_referential
    check: "every foreign key supplied in the request body exists, validated in the order the endpoint's input list declares them"
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints that accept a foreign key (also ERR_CARRIER_NOT_FOUND, ERR_PRODUCT_TYPE_NOT_FOUND, ERR_EMPLOYEE_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_PLAN_NOT_FOUND per referenced entity)"
  - priority: 7
    category: state
    check: "the target resource is not in a terminal state for the state dimension the operation advances"
    error_id: ERR_TERMINAL_STATE_LOCKED
    http_status: 409
    applies_to: "all action endpoints that advance a §1.2 state machine"
  - priority: 8
    category: state
    check: "the target resource's current state has an outgoing transition for this trigger in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints that advance a §1.2 state machine, plus POST /policies, POST /death-claims and POST /nqdc-liabilities against a FROZEN or TERMINATED NqdcPlan"
  - priority: 9
    category: state
    check: "expected_carrier_version matches Carrier.version"
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412
    applies_to: "POST /purchase-requests/{id}/reserve-capacity"
  - priority: 9
    category: state
    check: "expected_policy_version matches Policy.version"
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /exchange-analyses"
  - priority: 10
    category: business_safety
    check: "the acting X-User-ID differs from the operator who submitted or filed the item being decided"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /diligence-reviews/{id}/approve, POST /diligence-reviews/{id}/decline, POST /purchase-requests/{id}/approve, POST /death-claims/{id}/approve, POST /death-claims/{id}/deny"
  - priority: 11
    category: business_safety
    check: "an EXECUTED ConsentRecord exists for the employee whose closed coverage interval contains requested_effective_date"
    error_id: ERR_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/submit"
  - priority: 11
    category: business_safety
    check: "the covering ConsentRecord has not been revoked and its coverage_end_date is not before the logical clock"
    error_id: ERR_CONSENT_EXPIRED
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/submit, POST /consent-records/{id}/execute"
  - priority: 11
    category: business_safety
    check: "Employee.insurable_interest_status == ESTABLISHED, which requires annual_salary_usd >= INSURABLE_INTEREST_MIN_SALARY_USD or officer_flag == true"
    error_id: ERR_INSURABLE_INTEREST_NOT_ESTABLISHED
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/submit"
  - priority: 12
    category: business_safety
    check: "the carrier has an APPROVED DiligenceReview and its financial_strength_score >= MIN_APPROVAL_SCORE"
    error_id: ERR_DILIGENCE_NOT_CLEARED
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/clear-diligence"
  - priority: 12
    category: business_safety
    check: "DiligenceReview.financial_strength_score >= MIN_APPROVAL_SCORE at approval time"
    error_id: ERR_FINANCIAL_STRENGTH_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /diligence-reviews/{id}/approve"
  - priority: 12
    category: business_safety
    check: "DiligenceReview.info_request_count < INFO_REQUEST_LIMIT before an operator-driven information request"
    error_id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /diligence-reviews/{id}/request-info"
  - priority: 13
    category: business_referential
    check: "ProductType.carrier_id equals the carrier_id supplied on the same request, and ExchangeSurrenderAnalysis.replacement_carrier_id is non-null exactly when disposition_type == EXCHANGE_1035"
    error_id: ERR_PRODUCT_CARRIER_MISMATCH
    http_status: 422
    applies_to: "POST /purchase-requests, POST /purchase-requests/{id}/submit, POST /exchange-analyses"
  - priority: 13
    category: business_referential
    check: "ACTIVE BeneficiaryAllocation rows of the claim sum to exactly ALLOCATION_BPS_TOTAL on seal, and never exceed it on create"
    error_id: ERR_BENEFICIARY_TOTAL_INVALID
    http_status: 422
    applies_to: "POST /beneficiary-allocations, POST /death-claims/{id}/seal-allocations"
  - priority: 14
    category: business_temporal
    check: "the new consent window does not conflict with any DRAFT or EXECUTED window of the same employee under consent_window_conflict"
    error_id: ERR_CONSENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /consent-records"
  - priority: 14
    category: business_temporal
    check: "the new statement period does not conflict with any existing period of the same policy under valuation_period_conflict"
    error_id: ERR_VALUATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /policy-valuations"
  - priority: 14
    category: business_temporal
    check: "when notice_filed_at is not null, the logical clock has reached notice_waiting_ends_at"
    error_id: ERR_NOTICE_WAITING_PERIOD_ACTIVE
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/approve"
  - priority: 14
    category: business_temporal
    check: "no other RiskAssessment already carries this assessment_year"
    error_id: ERR_ASSESSMENT_YEAR_DUPLICATE
    http_status: 409
    applies_to: "POST /risk-assessments"
  - priority: 15
    category: business_constraint
    check: "ProductType.status is not CLOSED_TO_NEW"
    error_id: ERR_PRODUCT_CLOSED_TO_NEW
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/clear-diligence, POST /purchase-requests/{id}/reserve-capacity, POST /policies"
  - priority: 15
    category: business_constraint
    check: "Carrier.status is not RESTRICTED, SUSPENDED or TERMINATED for operations that add exposure"
    error_id: ERR_CARRIER_RESTRICTED
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/reserve-capacity, POST /policies, POST /exchange-analyses/{id}/execute-exchange"
  - priority: 15
    category: business_constraint
    check: "purchase_capacity_headroom yields carrier_concentration_bps <= the product's single-carrier limit"
    error_id: ERR_CARRIER_CONCENTRATION_EXCEEDED
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/reserve-capacity"
  - priority: 16
    category: business_fiscal
    check: "purchase_capacity_headroom yields headroom_usd >= 0"
    error_id: ERR_CAPITAL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/reserve-capacity"
  - priority: 16
    category: business_fiscal
    check: "at least one CapitalPosition exists to supply tier1_capital_usd"
    error_id: ERR_NO_CAPITAL_POSITION
    http_status: 422
    applies_to: "POST /purchase-requests/{id}/reserve-capacity, GET /purchase-requests/{id}/capacity-projection, POST /diligence-reviews/{id}/submit, POST /risk-assessments"
  - priority: 16
    category: business_fiscal
    check: "requested_withdrawal_usd <= Policy.cash_surrender_value_usd for a PARTIAL_SURRENDER analysis"
    error_id: ERR_SURRENDER_EXCEEDS_CASH_VALUE
    http_status: 422
    applies_to: "POST /exchange-analyses"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock to any ISO 8601 UTC instant. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Advancing the clock sweeps EXECUTED ConsentRecord rows whose coverage_end_date is now in the past to EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, expired_consent_count: integer }"
    side_effects:
      - "sets the logical clock used by every date comparison in §1.3 and §1.4"
      - "cascades ConsentRecord EXECUTED -> EXPIRED for every record whose coverage_end_date is before the new clock value, then resets Employee.insurable_interest_status to NOT_ESTABLISHED for employees left with no EXECUTED consent"

  - method: POST
    path: "/capital-positions"
    description: "File a regulatory capital snapshot."
    roles: [TreasuryController]
    code: 201
    input: [as_of_date, tier1_capital_usd, total_assets_usd]
    output: CapitalPosition
    side_effects:
      - "recomputes Carrier.concentration_bps for every Carrier against the new latest snapshot and applies the hysteresis"
  - method: GET
    path: "/capital-positions/{id}"
    description: "Read one capital snapshot."
    roles: [TreasuryController, RiskOfficer, BoardSecretary]
    code: 200
    input: []
    output: CapitalPosition
    side_effects: []

  - method: POST
    path: "/carriers"
    description: "Onboard an insurance carrier in PENDING_DILIGENCE."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, naic_code, am_best_rating, statutory_surplus_usd, domicile_state]
    output: Carrier
    side_effects: []
  - method: GET
    path: "/carriers"
    description: "List carriers with optional status filter."
    roles: [PlatformAdmin, BenefitsAnalyst, RiskOfficer, TreasuryController, BoardSecretary]
    code: 200
    input: ["status?", "watch_list_flag?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []
  - method: GET
    path: "/carriers/{id}"
    description: "Read one carrier, including the version an OCC-guarded reservation must echo."
    roles: [PlatformAdmin, BenefitsAnalyst, RiskOfficer, TreasuryController, BoardSecretary, CarrierLiaison]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: POST
    path: "/carriers/{id}/suspend"
    description: "Suspend an AUTHORIZED or RESTRICTED carrier."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Carrier
    side_effects:
      - "Carrier AUTHORIZED|RESTRICTED -> SUSPENDED"
      - "increments Carrier.version by 1"
  - method: POST
    path: "/carriers/{id}/reinstate"
    description: "Return a SUSPENDED carrier to AUTHORIZED."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Carrier
    side_effects:
      - "Carrier SUSPENDED -> AUTHORIZED"
      - "increments Carrier.version by 1"
  - method: POST
    path: "/carriers/{id}/terminate"
    description: "Terminate a SUSPENDED carrier with no in-force policies."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Carrier
    side_effects:
      - "Carrier SUSPENDED -> TERMINATED"
      - "cascades this carrier's OPEN and ON_WATCH product types to CLOSED_TO_NEW"
      - "cascades this carrier's non-terminal purchase requests to REJECTED and releases their reserved premium"
      - "increments Carrier.version by 1"

  - method: POST
    path: "/product-types"
    description: "Register a carrier product available for BOLI placement."
    roles: [PlatformAdmin]
    code: 201
    input: [carrier_id, product_name, account_type, mec_status, disclosed_me_charge_bps, guaranteed_min_crediting_bps]
    output: ProductType
    side_effects: []
  - method: GET
    path: "/product-types"
    description: "List product types, filterable by carrier."
    roles: [PlatformAdmin, BenefitsAnalyst, RiskOfficer, TreasuryController, CarrierLiaison]
    code: 200
    input: ["carrier_id?", "status?", "account_type?", "limit?", "offset?"]
    output: ProductType[]
    side_effects: []
  - method: GET
    path: "/product-types/{id}"
    description: "Read one product type."
    roles: [PlatformAdmin, BenefitsAnalyst, RiskOfficer, TreasuryController, CarrierLiaison]
    code: 200
    input: []
    output: ProductType
    side_effects: []
  - method: POST
    path: "/product-types/{id}/clear-watch"
    description: "Return an ON_WATCH product to OPEN once its latest mortality-and-expense drift is back within tolerance."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: ProductType
    side_effects:
      - "ProductType ON_WATCH -> OPEN"
      - "resets ProductType.consecutive_low_yield_count to 0"
      - "increments ProductType.version by 1"

  - method: POST
    path: "/diligence-reviews"
    description: "Open a pre-purchase due diligence file on a carrier."
    roles: [BenefitsAnalyst]
    code: 201
    input: [carrier_id, review_year]
    output: DiligenceReview
    side_effects: []
  - method: GET
    path: "/diligence-reviews"
    description: "List diligence reviews, filterable by carrier."
    roles: [BenefitsAnalyst, RiskOfficer, BoardSecretary]
    code: 200
    input: ["carrier_id?", "status?", "review_year?", "limit?", "offset?"]
    output: DiligenceReview[]
    side_effects: []
  - method: GET
    path: "/diligence-reviews/{id}"
    description: "Read one diligence review including its financial strength score."
    roles: [BenefitsAnalyst, RiskOfficer, BoardSecretary]
    code: 200
    input: []
    output: DiligenceReview
    side_effects: []
  - method: POST
    path: "/diligence-reviews/{id}/submit"
    description: "Submit a DRAFT or INFO_REQUESTED review for decision; recomputes the financial strength score."
    roles: [BenefitsAnalyst]
    code: 200
    input: []
    output: DiligenceReview
    side_effects:
      - "DiligenceReview DRAFT|INFO_REQUESTED -> UNDER_REVIEW"
      - "recomputes rating_points, surplus_points, concentration_points and financial_strength_score"
      - "sets submitted_by_user_id = X-User-ID"
      - "increments DiligenceReview.version by 1"
  - method: POST
    path: "/diligence-reviews/{id}/request-info"
    description: "Send a review back to the analyst for more information; capped at INFO_REQUEST_LIMIT rounds."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DiligenceReview
    side_effects:
      - "DiligenceReview UNDER_REVIEW -> INFO_REQUESTED"
      - "increments info_request_count by 1"
      - "increments DiligenceReview.version by 1"
  - method: POST
    path: "/diligence-reviews/{id}/approve"
    description: "Approve a review, authorizing the carrier."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DiligenceReview
    side_effects:
      - "DiligenceReview UNDER_REVIEW -> APPROVED"
      - "sets decided_by_user_id = X-User-ID"
      - "drives Carrier PENDING_DILIGENCE -> AUTHORIZED and sets Carrier.last_approved_review_year"
      - "increments DiligenceReview.version by 1 and Carrier.version by 1"
  - method: POST
    path: "/diligence-reviews/{id}/decline"
    description: "Decline a review; the carrier stays in PENDING_DILIGENCE."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DiligenceReview
    side_effects:
      - "DiligenceReview UNDER_REVIEW|INFO_REQUESTED -> DECLINED"
      - "sets decided_by_user_id = X-User-ID"
      - "increments DiligenceReview.version by 1"

  - method: POST
    path: "/employees"
    description: "Register a prospective insured."
    roles: [BenefitsAnalyst]
    code: 201
    input: [full_name, employee_number, annual_salary_usd, "officer_flag?"]
    output: Employee
    side_effects: []
  - method: GET
    path: "/employees/{id}"
    description: "Read one employee including insurable interest status."
    roles: [BenefitsAnalyst, RiskOfficer, ClaimsAdministrator, TreasuryController]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: POST
    path: "/employees/{id}/employment-status"
    description: "Record an employment status change."
    roles: [BenefitsAnalyst]
    code: 200
    input: [employment_status]
    output: Employee
    side_effects:
      - "sets Employee.employment_status"
      - "increments Employee.version by 1"

  - method: POST
    path: "/consent-records"
    description: "Create a DRAFT notice-and-consent record for a coverage window."
    roles: [BenefitsAnalyst]
    code: 201
    input: [employee_id, coverage_start_date, coverage_end_date, consent_form_reference, notice_and_consent_version]
    output: ConsentRecord
    side_effects: []
  - method: GET
    path: "/consent-records"
    description: "List consent records, filterable by employee."
    roles: [BenefitsAnalyst, RiskOfficer, ClaimsAdministrator]
    code: 200
    input: ["employee_id?", "status?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []
  - method: GET
    path: "/consent-records/{id}"
    description: "Read one consent record."
    roles: [BenefitsAnalyst, RiskOfficer, ClaimsAdministrator]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: POST
    path: "/consent-records/{id}/execute"
    description: "Record the employee signature, establishing insurable interest where the tests are met."
    roles: [BenefitsAnalyst]
    code: 200
    input: []
    output: ConsentRecord
    side_effects:
      - "ConsentRecord DRAFT -> EXECUTED and sets executed_at = logical clock"
      - "recomputes Employee.insurable_interest_status and increments Employee.version by 1"
      - "increments ConsentRecord.version by 1"
  - method: POST
    path: "/consent-records/{id}/revoke"
    description: "Revoke an executed consent."
    roles: [BenefitsAnalyst]
    code: 200
    input: []
    output: ConsentRecord
    side_effects:
      - "ConsentRecord EXECUTED -> REVOKED"
      - "resets Employee.insurable_interest_status to NOT_ESTABLISHED when no other EXECUTED consent remains"
      - "increments ConsentRecord.version by 1"

  - method: POST
    path: "/purchase-requests"
    description: "Draft a single-premium BOLI purchase request."
    roles: [BenefitsAnalyst]
    code: 201
    input: [carrier_id, product_type_id, employee_id, single_premium_usd, face_amount_usd, requested_effective_date]
    output: PolicyPurchaseRequest
    side_effects: []
  - method: GET
    path: "/purchase-requests"
    description: "List purchase requests, filterable by carrier, product type or employee."
    roles: [BenefitsAnalyst, RiskOfficer, TreasuryController, CarrierLiaison]
    code: 200
    input: ["carrier_id?", "product_type_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: PolicyPurchaseRequest[]
    side_effects: []
  - method: GET
    path: "/purchase-requests/{id}"
    description: "Read one purchase request including its frozen capacity figures."
    roles: [BenefitsAnalyst, RiskOfficer, TreasuryController]
    code: 200
    input: []
    output: PolicyPurchaseRequest
    side_effects: []
  - method: GET
    path: "/purchase-requests/{id}/capacity-projection"
    description: "What-if read of purchase_capacity_headroom for this request without reserving anything."
    roles: [RiskOfficer, TreasuryController]
    code: 200
    input: []
    output: "{ tier1_capital_usd: number, base_limit_usd: number, committed_usd: number, prospective_usd: number, base_ratio_bps: integer, effective_limit_pct: number, aggregate_limit_usd: number, headroom_usd: number, carrier_concentration_bps: integer, single_carrier_limit_bps: integer }"
    side_effects: []
  - method: POST
    path: "/purchase-requests/{id}/submit"
    description: "Submit a DRAFT request; enforces consent and insurable interest and sets notice_required."
    roles: [BenefitsAnalyst]
    code: 200
    input: []
    output: PolicyPurchaseRequest
    side_effects:
      - "PolicyPurchaseRequest DRAFT -> SUBMITTED"
      - "sets notice_required = single_premium_usd > NOTICE_THRESHOLD_USD"
      - "sets submitted_by_user_id = X-User-ID"
      - "increments PolicyPurchaseRequest.version by 1"
  - method: POST
    path: "/purchase-requests/{id}/clear-diligence"
    description: "Confirm carrier and product eligibility for a SUBMITTED request."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: PolicyPurchaseRequest
    side_effects:
      - "PolicyPurchaseRequest SUBMITTED -> DILIGENCE_CLEARED"
      - "increments PolicyPurchaseRequest.version by 1"
  - method: POST
    path: "/purchase-requests/{id}/reserve-capacity"
    description: "Reserve the premium against the carrier's and the bank's capital limits. OCC-guarded on the carrier the request names."
    roles: [TreasuryController]
    code: 200
    input: [expected_carrier_version]
    output: PolicyPurchaseRequest
    side_effects:
      - "PolicyPurchaseRequest DILIGENCE_CLEARED -> CAPACITY_RESERVED"
      - "writes base_ratio_bps, effective_limit_pct, aggregate_limit_usd, headroom_usd, carrier_concentration_bps and reserved_premium_usd"
      - "adds single_premium_usd to Carrier.reserved_premium_usd"
      - "increments Carrier.version by 1"
      - "increments PolicyPurchaseRequest.version by 1"
  - method: POST
    path: "/purchase-requests/{id}/file-notice"
    description: "File the regulatory notification required above NOTICE_THRESHOLD_USD and start the waiting period."
    roles: [TreasuryController]
    code: 200
    input: []
    output: PolicyPurchaseRequest
    side_effects:
      - "PolicyPurchaseRequest CAPACITY_RESERVED -> NOTICE_FILED"
      - "sets notice_filed_at = logical clock and notice_waiting_ends_at = logical clock + NOTICE_WAITING_PERIOD_DAYS"
      - "increments Carrier.regulatory_notice_count by 1 and Carrier.version by 1"
      - "increments PolicyPurchaseRequest.version by 1"
  - method: POST
    path: "/purchase-requests/{id}/request-concurrence"
    description: "Ask risk for concurrence; reachable from CAPACITY_RESERVED on the no-notice branch or from NOTICE_FILED."
    roles: [BenefitsAnalyst]
    code: 200
    input: []
    output: PolicyPurchaseRequest
    side_effects:
      - "PolicyPurchaseRequest CAPACITY_RESERVED|NOTICE_FILED -> CONCURRENCE_PENDING"
      - "sets concurrence_requested_at = logical clock"
      - "increments PolicyPurchaseRequest.version by 1"
  - method: POST
    path: "/purchase-requests/{id}/approve"
    description: "Approve a request pending concurrence; on the notice branch the waiting period must have elapsed."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: PolicyPurchaseRequest
    side_effects:
      - "PolicyPurchaseRequest CONCURRENCE_PENDING -> APPROVED"
      - "sets approved_by_user_id = X-User-ID"
      - "increments PolicyPurchaseRequest.version by 1"
  - method: POST
    path: "/purchase-requests/{id}/reject"
    description: "Reject a non-terminal request and release any reserved premium."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: PolicyPurchaseRequest
    side_effects:
      - "PolicyPurchaseRequest SUBMITTED|DILIGENCE_CLEARED|CAPACITY_RESERVED|NOTICE_FILED|CONCURRENCE_PENDING|APPROVED -> REJECTED"
      - "subtracts reserved_premium_usd from Carrier.reserved_premium_usd and increments Carrier.version by 1"
      - "sets reserved_premium_usd = 0.00"
      - "increments PolicyPurchaseRequest.version by 1"
  - method: POST
    path: "/purchase-requests/{id}/withdraw"
    description: "Withdraw a request the acting analyst submitted, releasing any reserved premium."
    roles: [BenefitsAnalyst]
    code: 200
    input: []
    output: PolicyPurchaseRequest
    side_effects:
      - "PolicyPurchaseRequest SUBMITTED|DILIGENCE_CLEARED|CAPACITY_RESERVED|NOTICE_FILED|CONCURRENCE_PENDING -> WITHDRAWN"
      - "subtracts reserved_premium_usd from Carrier.reserved_premium_usd and increments Carrier.version by 1"
      - "sets reserved_premium_usd = 0.00"
      - "increments PolicyPurchaseRequest.version by 1"

  - method: POST
    path: "/policies"
    description: "Issue the policy for an APPROVED purchase request."
    roles: [BenefitsAnalyst]
    code: 201
    input: [purchase_request_id, policy_number, issue_date]
    output: Policy
    side_effects:
      - "creates the Policy with single_premium_usd, face_amount_usd, cost_basis_usd and cash_surrender_value_usd derived from the request, policy_year 1 and status IN_FORCE"
      - "PolicyPurchaseRequest APPROVED -> ISSUED and sets reserved_premium_usd = 0.00"
      - "moves the premium from Carrier.reserved_premium_usd to Carrier.in_force_premium_usd, adds it to Carrier.in_force_cash_value_usd, recomputes Carrier.concentration_bps with the hysteresis and increments Carrier.version by 1"
      - "increments PolicyPurchaseRequest.version by 1"
  - method: GET
    path: "/policies"
    description: "List policies, filterable by carrier, product type, employee, originating request or exchange predecessor."
    roles: [BenefitsAnalyst, RiskOfficer, TreasuryController, ClaimsAdministrator, CarrierLiaison]
    code: 200
    input: ["carrier_id?", "product_type_id?", "employee_id?", "purchase_request_id?", "exchanged_from_policy_id?", "status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: GET
    path: "/policies/{id}"
    description: "Read one policy including the version an OCC-guarded analysis create must echo."
    roles: [BenefitsAnalyst, RiskOfficer, TreasuryController, ClaimsAdministrator, CarrierLiaison]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/policy-valuations"
    description: "Post a carrier statement period for a policy; drives the crediting-rate, mortality-and-expense and concentration cascades."
    roles: [TreasuryController]
    code: 201
    input: [policy_id, period_start_date, as_of_date, credited_interest_usd, mortality_expense_charge_usd, "market_value_adjustment_usd?", gross_crediting_rate_bps]
    output: PolicyValuation
    side_effects:
      - "computes cash_value_usd, net_yield_bps, me_charge_bps and me_drift_bps"
      - "sets Policy.cash_surrender_value_usd = cash_value_usd and increments Policy.version by 1"
      - "recomputes Carrier.in_force_cash_value_usd and Carrier.concentration_bps, applies the AUTHORIZED/RESTRICTED hysteresis and increments Carrier.version by 1"
      - "updates ProductType.latest_me_charge_bps and latest_me_drift_bps, driving OPEN -> ON_WATCH above ME_DRIFT_TOLERANCE_BPS"
      - "updates ProductType.consecutive_low_yield_count, driving OPEN|ON_WATCH -> CLOSED_TO_NEW at CONSECUTIVE_LOW_YIELD_LIMIT"
      - "a product reaching CLOSED_TO_NEW sets Carrier.watch_list_flag = true, which then drives every UNDER_REVIEW DiligenceReview of that carrier to INFO_REQUESTED"
  - method: GET
    path: "/policy-valuations"
    description: "List statement periods, filterable by policy."
    roles: [TreasuryController, RiskOfficer, CarrierLiaison]
    code: 200
    input: ["policy_id?", "limit?", "offset?"]
    output: PolicyValuation[]
    side_effects: []
  - method: GET
    path: "/policy-valuations/{id}"
    description: "Read one statement period."
    roles: [TreasuryController, RiskOfficer, CarrierLiaison]
    code: 200
    input: []
    output: PolicyValuation
    side_effects: []

  - method: POST
    path: "/nqdc-plans"
    description: "Create a nonqualified deferred compensation plan."
    roles: [TreasuryController]
    code: 201
    input: [plan_name, plan_type, "discount_rate_bps?"]
    output: NqdcPlan
    side_effects: []
  - method: GET
    path: "/nqdc-plans/{id}"
    description: "Read one plan with its ACCRUAL-basis funding posture."
    roles: [TreasuryController, RiskOfficer, BoardSecretary]
    code: 200
    input: []
    output: NqdcPlan
    side_effects: []
  - method: GET
    path: "/nqdc-plans/{id}/funding-summary"
    description: "Funding summary on either liability basis; basis defaults to ACCRUAL."
    roles: [TreasuryController, RiskOfficer, BoardSecretary]
    code: 200
    input: ["basis?"]
    output: "{ basis: string, accrual_liability_usd: number, pbo_liability_usd: number, matched_cash_value_usd: number, basis_liability_usd: number, funded_ratio_bps: integer, funding_posture: string, participant_count: integer }"
    side_effects: []
  - method: POST
    path: "/nqdc-plans/{id}/revalue"
    description: "Recompute the plan's liability totals and ACCRUAL-basis posture from its ACTIVE participant liabilities."
    roles: [TreasuryController]
    code: 200
    input: []
    output: NqdcPlan
    side_effects:
      - "recomputes accrual_liability_usd, pbo_liability_usd, matched_cash_value_usd, funded_ratio_bps and funding_posture"
      - "drives NqdcPlan ACTIVE -> FROZEN when the recomputed ACCRUAL posture is CRITICAL"
      - "increments NqdcPlan.version by 1"
  - method: POST
    path: "/nqdc-plans/{id}/freeze"
    description: "Freeze a plan, blocking new participant liabilities."
    roles: [TreasuryController]
    code: 200
    input: []
    output: NqdcPlan
    side_effects:
      - "NqdcPlan ACTIVE -> FROZEN"
      - "increments NqdcPlan.version by 1"
  - method: POST
    path: "/nqdc-plans/{id}/unfreeze"
    description: "Return a FROZEN plan to ACTIVE once its recomputed posture is no longer CRITICAL."
    roles: [TreasuryController]
    code: 200
    input: []
    output: NqdcPlan
    side_effects:
      - "NqdcPlan FROZEN -> ACTIVE"
      - "increments NqdcPlan.version by 1"
  - method: POST
    path: "/nqdc-plans/{id}/terminate"
    description: "Terminate a FROZEN plan whose participant liabilities are all SETTLED."
    roles: [TreasuryController]
    code: 200
    input: []
    output: NqdcPlan
    side_effects:
      - "NqdcPlan FROZEN -> TERMINATED"
      - "increments NqdcPlan.version by 1"
  - method: POST
    path: "/nqdc-liabilities"
    description: "Add a participant liability, optionally matched to a funding policy."
    roles: [TreasuryController]
    code: 201
    input: [nqdc_plan_id, employee_id, "matched_policy_id?", accrued_to_date_usd, projected_benefit_usd, years_to_payout]
    output: NqdcParticipantLiability
    side_effects:
      - "computes discounted_benefit_usd at the plan's discount_rate_bps"
      - "recomputes the plan's liability totals, funded_ratio_bps and ACCRUAL-basis funding_posture and increments NqdcPlan.version by 1"
  - method: GET
    path: "/nqdc-liabilities"
    description: "List participant liabilities, filterable by plan, employee or matched policy."
    roles: [TreasuryController, RiskOfficer, BoardSecretary]
    code: 200
    input: ["nqdc_plan_id?", "employee_id?", "matched_policy_id?", "status?", "limit?", "offset?"]
    output: NqdcParticipantLiability[]
    side_effects: []
  - method: GET
    path: "/nqdc-liabilities/{id}"
    description: "Read one participant liability."
    roles: [TreasuryController, RiskOfficer, BoardSecretary]
    code: 200
    input: []
    output: NqdcParticipantLiability
    side_effects: []
  - method: POST
    path: "/nqdc-liabilities/{id}/settle"
    description: "Settle a participant liability, removing it from both liability bases."
    roles: [TreasuryController]
    code: 200
    input: []
    output: NqdcParticipantLiability
    side_effects:
      - "sets NqdcParticipantLiability.status = SETTLED"
      - "recomputes the plan's totals and ACCRUAL-basis posture and increments NqdcPlan.version by 1"
      - "increments NqdcParticipantLiability.version by 1"

  - method: POST
    path: "/death-claims"
    description: "File a death benefit claim against an IN_FORCE policy."
    roles: [ClaimsAdministrator]
    code: 201
    input: [policy_id, date_of_death, "terminal_dividend_usd?", proof_reference]
    output: DeathBenefitClaim
    side_effects:
      - "creates the claim with adjudication_status FILED and distribution_status NOT_STARTED and sets filed_by_user_id = X-User-ID"
      - "drives Policy IN_FORCE -> CLAIM_PENDING and increments Policy.version by 1"
      - "sets Employee.employment_status = DECEASED and increments Employee.version by 1"
  - method: GET
    path: "/death-claims"
    description: "List claims, filterable by policy and by either state dimension."
    roles: [ClaimsAdministrator, RiskOfficer, BenefitsAnalyst]
    code: 200
    input: ["policy_id?", "adjudication_status?", "distribution_status?", "limit?", "offset?"]
    output: DeathBenefitClaim[]
    side_effects: []
  - method: GET
    path: "/death-claims/{id}"
    description: "Read one claim with both state dimensions and the split amounts."
    roles: [ClaimsAdministrator, RiskOfficer, BenefitsAnalyst]
    code: 200
    input: []
    output: DeathBenefitClaim
    side_effects: []
  - method: POST
    path: "/death-claims/{id}/start-adjudication"
    description: "Move a FILED claim into adjudication."
    roles: [ClaimsAdministrator]
    code: 200
    input: []
    output: DeathBenefitClaim
    side_effects:
      - "DeathBenefitClaim adjudication_status FILED -> UNDER_ADJUDICATION"
      - "increments DeathBenefitClaim.version by 1"
  - method: POST
    path: "/death-claims/{id}/approve"
    description: "Approve the claim and compute the bank and survivor split."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DeathBenefitClaim
    side_effects:
      - "DeathBenefitClaim adjudication_status UNDER_ADJUDICATION -> APPROVED"
      - "computes total_death_benefit_usd, survivor_entitlement_usd and bank_portion_usd"
      - "sets adjudicated_by_user_id = X-User-ID"
      - "increments DeathBenefitClaim.version by 1"
  - method: POST
    path: "/death-claims/{id}/deny"
    description: "Deny the claim and return the policy to IN_FORCE."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DeathBenefitClaim
    side_effects:
      - "DeathBenefitClaim adjudication_status UNDER_ADJUDICATION -> DENIED"
      - "drives Policy CLAIM_PENDING -> IN_FORCE and Employee back to ACTIVE"
      - "increments DeathBenefitClaim.version by 1"
  - method: POST
    path: "/death-claims/{id}/void"
    description: "Void a claim that has not been distributed, reversing every side effect of filing."
    roles: [ClaimsAdministrator]
    code: 200
    input: []
    output: DeathBenefitClaim
    side_effects:
      - "DeathBenefitClaim adjudication_status FILED|UNDER_ADJUDICATION|APPROVED -> VOIDED"
      - "voids every ACTIVE BeneficiaryAllocation, zeroes their gross_amount_usd and resets allocated_bps_total to 0"
      - "drives Policy CLAIM_PENDING -> IN_FORCE and Employee back to ACTIVE"
      - "increments DeathBenefitClaim.version by 1"
  - method: POST
    path: "/death-claims/{id}/seal-allocations"
    description: "Seal the beneficiary split once the ACTIVE allocations sum to exactly 10000 bps, computing each gross amount."
    roles: [ClaimsAdministrator]
    code: 200
    input: []
    output: DeathBenefitClaim
    side_effects:
      - "DeathBenefitClaim distribution_status NOT_STARTED -> ALLOCATED"
      - "computes gross_amount_usd on every ACTIVE BeneficiaryAllocation, pushing the signed residual onto the greatest-bps allocation"
      - "increments DeathBenefitClaim.version by 1"
  - method: POST
    path: "/death-claims/{id}/distribute"
    description: "Distribute the sealed split and pay the policy out."
    roles: [ClaimsAdministrator]
    code: 200
    input: []
    output: DeathBenefitClaim
    side_effects:
      - "DeathBenefitClaim distribution_status ALLOCATED -> DISTRIBUTED"
      - "drives Policy CLAIM_PENDING -> PAID_OUT and zeroes its cash_surrender_value_usd"
      - "removes the policy from the Carrier in_force totals, recomputes Carrier.concentration_bps with the hysteresis and increments Carrier.version by 1"
      - "unmatches every NqdcParticipantLiability whose matched_policy_id was this policy; that unmatch recomputes the owning NqdcPlan totals and posture, which then drives NqdcPlan ACTIVE -> FROZEN when the posture becomes CRITICAL"
      - "increments DeathBenefitClaim.version by 1"

  - method: POST
    path: "/beneficiary-allocations"
    description: "Add a family beneficiary share to a claim."
    roles: [ClaimsAdministrator]
    code: 201
    input: [claim_id, beneficiary_name, relationship, allocation_pct_bps]
    output: BeneficiaryAllocation
    side_effects:
      - "adds allocation_pct_bps to DeathBenefitClaim.allocated_bps_total and increments DeathBenefitClaim.version by 1"
  - method: GET
    path: "/beneficiary-allocations"
    description: "List beneficiary allocations, filterable by claim."
    roles: [ClaimsAdministrator, RiskOfficer]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: BeneficiaryAllocation[]
    side_effects: []
  - method: GET
    path: "/beneficiary-allocations/{id}"
    description: "Read one beneficiary allocation."
    roles: [ClaimsAdministrator, RiskOfficer]
    code: 200
    input: []
    output: BeneficiaryAllocation
    side_effects: []
  - method: POST
    path: "/beneficiary-allocations/{id}/void"
    description: "Void a beneficiary share, reverting the claim's distribution dimension."
    roles: [ClaimsAdministrator]
    code: 200
    input: []
    output: BeneficiaryAllocation
    side_effects:
      - "sets BeneficiaryAllocation.status = VOIDED and gross_amount_usd = 0.00"
      - "reduces DeathBenefitClaim.allocated_bps_total by the voided bps and reverts distribution_status ALLOCATED -> NOT_STARTED"
      - "increments BeneficiaryAllocation.version by 1 and DeathBenefitClaim.version by 1"

  - method: POST
    path: "/exchange-analyses"
    description: "Create an exchange or surrender analysis, computing the tax consequences. OCC-guarded on the policy, and supersedes every DRAFT or REVIEWED analysis on that policy."
    roles: [TreasuryController]
    code: 201
    input: [policy_id, disposition_type, "replacement_carrier_id?", "requested_withdrawal_usd?", expected_policy_version]
    output: ExchangeSurrenderAnalysis
    side_effects:
      - "selects cost_recovery_method from the product's mec_status and computes taxable_gain_usd, surrender_charge_usd, tax_liability_usd and net_proceeds_usd"
      - "supersedes every other analysis on the same policy in DRAFT or REVIEWED by setting it to REJECTED"
      - "increments Policy.version by 1"
  - method: GET
    path: "/exchange-analyses"
    description: "List analyses, filterable by policy, replacement carrier or resulting policy."
    roles: [TreasuryController, RiskOfficer]
    code: 200
    input: ["policy_id?", "replacement_carrier_id?", "resulting_policy_id?", "status?", "limit?", "offset?"]
    output: ExchangeSurrenderAnalysis[]
    side_effects: []
  - method: GET
    path: "/exchange-analyses/{id}"
    description: "Read one exchange or surrender analysis."
    roles: [TreasuryController, RiskOfficer]
    code: 200
    input: []
    output: ExchangeSurrenderAnalysis
    side_effects: []
  - method: POST
    path: "/exchange-analyses/{id}/review"
    description: "Review a DRAFT analysis, refreshing the tax figures against the policy's current values."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: ExchangeSurrenderAnalysis
    side_effects:
      - "ExchangeSurrenderAnalysis DRAFT -> REVIEWED"
      - "recomputes taxable_gain_usd, surrender_charge_usd, tax_liability_usd and net_proceeds_usd"
      - "increments ExchangeSurrenderAnalysis.version by 1"
  - method: POST
    path: "/exchange-analyses/{id}/reject"
    description: "Reject a REVIEWED analysis."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: ExchangeSurrenderAnalysis
    side_effects:
      - "ExchangeSurrenderAnalysis REVIEWED -> REJECTED"
      - "increments ExchangeSurrenderAnalysis.version by 1"
  - method: POST
    path: "/exchange-analyses/{id}/commit"
    description: "Commit a REVIEWED analysis, moving the policy to PENDING_EXCHANGE."
    roles: [TreasuryController]
    code: 200
    input: []
    output: ExchangeSurrenderAnalysis
    side_effects:
      - "ExchangeSurrenderAnalysis REVIEWED -> COMMITTED"
      - "drives Policy IN_FORCE -> PENDING_EXCHANGE and increments Policy.version by 1"
      - "increments ExchangeSurrenderAnalysis.version by 1"
  - method: POST
    path: "/exchange-analyses/{id}/abandon"
    description: "Abandon a COMMITTED analysis, restoring the policy exactly as it was before the commit."
    roles: [TreasuryController]
    code: 200
    input: []
    output: ExchangeSurrenderAnalysis
    side_effects:
      - "ExchangeSurrenderAnalysis COMMITTED -> ABANDONED"
      - "drives Policy PENDING_EXCHANGE -> IN_FORCE restoring cost_basis_usd and cash_surrender_value_usd and increments Policy.version by 1"
      - "increments ExchangeSurrenderAnalysis.version by 1"
  - method: POST
    path: "/exchange-analyses/{id}/execute-exchange"
    description: "Execute a committed section 1035 exchange, issuing the successor policy at the replacement carrier."
    roles: [TreasuryController]
    code: 201
    input: [policy_number, issue_date]
    output: Policy
    side_effects:
      - "ExchangeSurrenderAnalysis COMMITTED -> EXECUTED and sets resulting_policy_id"
      - "drives the old Policy PENDING_EXCHANGE -> EXCHANGED"
      - "creates the successor Policy with exchanged_from_policy_id set, single_premium_usd and cash_surrender_value_usd equal to net_proceeds_usd, cost_basis_usd carried over unchanged and policy_year 1"
      - "recomputes both carriers' in_force totals and concentration_bps with the hysteresis and increments both Carrier.version values by 1"
  - method: POST
    path: "/exchange-analyses/{id}/execute-surrender"
    description: "Execute a committed full or partial surrender."
    roles: [TreasuryController]
    code: 200
    input: []
    output: ExchangeSurrenderAnalysis
    side_effects:
      - "ExchangeSurrenderAnalysis COMMITTED -> EXECUTED"
      - "drives Policy PENDING_EXCHANGE -> SURRENDERED and adjusts cash_surrender_value_usd"
      - "recomputes Carrier.in_force totals and concentration_bps with the hysteresis and increments Carrier.version by 1"
      - "unmatches every NqdcParticipantLiability whose matched_policy_id was this policy; that unmatch recomputes the owning NqdcPlan totals and posture, which then drives NqdcPlan ACTIVE -> FROZEN when the posture becomes CRITICAL"

  - method: POST
    path: "/risk-assessments"
    description: "Compile the annual BOLI risk assessment against a capital snapshot."
    roles: [RiskOfficer]
    code: 201
    input: [capital_position_id, assessment_year]
    output: RiskAssessment
    side_effects:
      - "computes the six counts, risk_points and risk_rating, counting NQDC plans on the PBO basis"
      - "sets compiled_at = logical clock"
  - method: GET
    path: "/risk-assessments"
    description: "List annual assessments, filterable by capital snapshot."
    roles: [RiskOfficer, BoardSecretary, TreasuryController]
    code: 200
    input: ["capital_position_id?", "status?", "assessment_year?", "limit?", "offset?"]
    output: RiskAssessment[]
    side_effects: []
  - method: GET
    path: "/risk-assessments/{id}"
    description: "Read one annual assessment."
    roles: [RiskOfficer, BoardSecretary, TreasuryController]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: []
  - method: POST
    path: "/risk-assessments/{id}/submit-to-board"
    description: "Submit a COMPILED or RETURNED assessment to the board; a RETURNED assessment is recompiled first."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: RiskAssessment
    side_effects:
      - "RiskAssessment COMPILED|RETURNED -> BOARD_SUBMITTED"
      - "recompiles every count, risk_points and risk_rating when the previous state was RETURNED"
      - "increments RiskAssessment.version by 1"
  - method: POST
    path: "/risk-assessments/{id}/accept"
    description: "Board acceptance of a submitted assessment."
    roles: [BoardSecretary]
    code: 200
    input: [board_note]
    output: RiskAssessment
    side_effects:
      - "RiskAssessment BOARD_SUBMITTED -> BOARD_ACCEPTED and stores board_note"
      - "increments RiskAssessment.version by 1"
  - method: POST
    path: "/risk-assessments/{id}/return"
    description: "Board returns a submitted assessment for rework."
    roles: [BoardSecretary]
    code: 200
    input: [board_note]
    output: RiskAssessment
    side_effects:
      - "RiskAssessment BOARD_SUBMITTED -> RETURNED and stores board_note"
      - "increments RiskAssessment.version by 1"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the called endpoint"
  - id: ERR_CARRIER_SCOPE_VIOLATION
    http: 403
    condition: "a CarrierLiaison addresses a resource whose carrier_id differs from its X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, undeclared enum member, negative or over-precise USD amount, malformed ISO 8601 datetime, or pagination parameter outside 1..100 / offset < 0"
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "carrier id in the path or body does not exist"
  - id: ERR_PRODUCT_TYPE_NOT_FOUND
    http: 404
    condition: "product type id in the path or body does not exist"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "employee id in the path or body does not exist"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "diligence review id in the path does not exist"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "purchase request id in the path or body does not exist"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy id in the path or body does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "death benefit claim id in the path or body does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "NQDC plan id in the path or body does not exist"
  - id: ERR_ANALYSIS_NOT_FOUND
    http: 404
    condition: "exchange or surrender analysis id in the path does not exist"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "consent record, policy valuation, beneficiary allocation, participant liability, capital position or risk assessment id does not exist"
  - id: ERR_TERMINAL_STATE_LOCKED
    http: 409
    condition: "the addressed resource is already in a terminal state for the dimension the operation advances"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the addressed resource's current state has no outgoing transition for this trigger"
  - id: ERR_STALE_CARRIER_VERSION
    http: 412
    condition: "expected_carrier_version does not match Carrier.version on reserve-capacity"
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version does not match Policy.version on analysis create"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same operator who submitted or filed the item being decided"
  - id: ERR_CONSENT_MISSING
    http: 422
    condition: "no EXECUTED consent record covers the employee for the requested effective date"
  - id: ERR_CONSENT_EXPIRED
    http: 422
    condition: "the covering consent record is REVOKED or EXPIRED, or the logical clock is past its coverage_end_date"
  - id: ERR_INSURABLE_INTEREST_NOT_ESTABLISHED
    http: 422
    condition: "the employee's salary is below INSURABLE_INTEREST_MIN_SALARY_USD and officer_flag is false"
  - id: ERR_DILIGENCE_NOT_CLEARED
    http: 422
    condition: "the carrier has no APPROVED diligence review, or its score is below MIN_APPROVAL_SCORE"
  - id: ERR_FINANCIAL_STRENGTH_BELOW_MINIMUM
    http: 422
    condition: "financial_strength_score is below MIN_APPROVAL_SCORE at review approval"
  - id: ERR_INFO_REQUEST_LIMIT_REACHED
    http: 409
    condition: "an operator information request would exceed INFO_REQUEST_LIMIT rounds"
  - id: ERR_PRODUCT_CARRIER_MISMATCH
    http: 422
    condition: "the product type belongs to a different carrier than the request names, or the replacement carrier is present exactly when it must not be"
  - id: ERR_BENEFICIARY_TOTAL_INVALID
    http: 422
    condition: "ACTIVE beneficiary allocations exceed 10000 bps on create, or do not equal 10000 bps on seal"
  - id: ERR_CONSENT_WINDOW_OVERLAP
    http: 409
    condition: "the new consent window collides with a DRAFT or EXECUTED window of the same employee once the CONSENT_GAP_DAYS buffer is applied"
  - id: ERR_VALUATION_PERIOD_OVERLAP
    http: 409
    condition: "the new half-open statement period overlaps an existing period of the same policy"
  - id: ERR_NOTICE_WAITING_PERIOD_ACTIVE
    http: 422
    condition: "approval attempted on the notice branch before notice_waiting_ends_at"
  - id: ERR_ASSESSMENT_YEAR_DUPLICATE
    http: 409
    condition: "another risk assessment already carries this assessment_year"
  - id: ERR_PRODUCT_CLOSED_TO_NEW
    http: 422
    condition: "the product type is CLOSED_TO_NEW"
  - id: ERR_CARRIER_RESTRICTED
    http: 422
    condition: "the carrier is RESTRICTED, SUSPENDED or TERMINATED for an operation that would add exposure"
  - id: ERR_CARRIER_CONCENTRATION_EXCEEDED
    http: 422
    condition: "prospective single-carrier concentration exceeds the product's single-carrier limit in basis points"
  - id: ERR_CAPITAL_CAPACITY_EXCEEDED
    http: 422
    condition: "prospective committed premium leaves negative headroom against the tier-selected aggregate limit"
  - id: ERR_NO_CAPITAL_POSITION
    http: 422
    condition: "no capital position exists to supply tier1_capital_usd"
  - id: ERR_SURRENDER_EXCEEDS_CASH_VALUE
    http: 422
    condition: "requested_withdrawal_usd exceeds the policy's cash surrender value on a partial surrender analysis"

