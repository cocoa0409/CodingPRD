          assert:
            - "trigger call 1 returns HTTP 409 with error_id == ERR_INVALID_PERFORMANCE_STATE — a rejection cannot be reversed"
            - "trigger call 2 returns HTTP 409 with error_id == ERR_INVALID_PERFORMANCE_STATE"
            - "trigger call 3 returns total_count == 1 with data[0].verification_status == REJECTED, data[0].verified_seconds == null and data[0].rejection_reason == \"course not certified\" — the original reason survives"

      - name: corner_double_certify_race_result_rejected_as_non_idempotent
        claim_type: idempotency
        grounds:
