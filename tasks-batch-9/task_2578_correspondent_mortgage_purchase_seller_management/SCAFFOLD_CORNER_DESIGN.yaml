              captures: { s_stale: $.data.id }
            - call: "POST /correspondent/sellers/${s_stale}/financial-statements"
              payload: { fiscal_year_end: "2025-01-01", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
