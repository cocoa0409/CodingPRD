            - "Reservation.${res_id}.plan_version_pinned == the version of BenefitPlan.${p2_id} at intake, not that of BenefitPlan.${p1_id}"

      - name: provider_credential_review_flips_with_credential_status
        grounds:
          - state_machines.Provider.PENDING_to_CREDENTIALED
          - state_machines.Credential.VALID_to_REVOKED
          - state_machines.Provider.CREDENTIALED_to_SUSPENDED
          - validations[priority=910]
          - errors[ERR_PROVIDER_NOT_CREDENTIALED]
        distinguishing_aspect: |
          Entity pair Provider -> Credential: POST /backup-care/providers/{id}/credential-review is
          rejected with ERR_PROVIDER_NOT_CREDENTIALED while only 3 of the 4
          REQUIRED_CREDENTIAL_TYPES are VALID, succeeds the moment the fourth is added, and the same
          gate re-closes after a single credential is revoked so POST
          /backup-care/providers/{id}/network-status back to CREDENTIALED fails again. Different
          entity pair from Reservation -> BenefitPlan in
          reservation_intake_blocked_by_superseded_plan_until_employee_remapped.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One CENTER_BASED Provider in PENDING with exactly three VALID credentials: LICENSE, BACKGROUND_CHECK and CPR. The fourth required type, INSURANCE, is absent."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers"
              payload: { provider_name: "Cascade Kids Center", owner_user_id: "u_pm_ck", care_mode: "CENTER_BASED", market_code: "MKT-SEA", postal_code: "98101", daily_capacity_slots: 6, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { prov_id: $.data.id, ns0: $.data.network_status }
            - call: "POST /backup-care/providers/${prov_id}/credentials"
              payload: { credential_type: "LICENSE", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_id}/credentials"
              payload: { credential_type: "BACKGROUND_CHECK", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_id}/credentials"
              payload: { credential_type: "CPR", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { cpr_id: $.data.id, cpr_status0: $.data.status }
          trigger:
            - call: "POST /backup-care/providers/${prov_id}/credential-review"
              payload: { reason_code: "INITIAL_REVIEW" }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { err1: $.data.error_id }
            - call: "POST /backup-care/providers/${prov_id}/credentials"
              payload: { credential_type: "INSURANCE", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_id}/credential-review"
              payload: { reason_code: "INITIAL_REVIEW" }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { ns1: $.data.network_status }
            - call: "POST /backup-care/credentials/${cpr_id}/revoke"
              payload: { revoked_reason_code: "ISSUER_WITHDRAWN" }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { cpr_status1: $.data.status }
            - call: "GET /backup-care/providers/${prov_id}"
              payload: {}
              as: network_admin
              as_user_id: "u_na_1"
              captures: { ns2: $.data.network_status }
            - call: "POST /backup-care/providers/${prov_id}/network-status"
              payload: { target_status: "CREDENTIALED", reason_code: "MANUAL_REINSTATE" }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { err2: $.data.error_id }
          assert:
            - "${ns0} == PENDING"
            - "${cpr_status0} == VALID"
            - "${err1} == ERR_PROVIDER_NOT_CREDENTIALED"
            - "The first credential-review call returns HTTP 409 and leaves Provider.${prov_id}.network_status == PENDING"
            - "${ns1} == CREDENTIALED"
            - "${cpr_status1} == REVOKED"
            - "${ns2} == SUSPENDED"
            - "${err2} == ERR_PROVIDER_NOT_CREDENTIALED"
            - "The network-status call returns HTTP 409 and Provider.${prov_id}.network_status is still SUSPENDED"
            - "GET /backup-care/providers/${prov_id}/credentials?status=VALID returns exactly 3 rows (LICENSE, BACKGROUND_CHECK, INSURANCE)"

