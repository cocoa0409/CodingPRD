  - rule_id: boundary_precision_check
    instances:
      - name: community_services_fee_tier_boundary_at_exactly_200000_cents
        grounds:
          - calculations.community_services_fee
          - calculations.base_rent_selection
          - entities.Lease.fields.services_fee_cents
          - entities.Lease.fields.gross_monthly_charge_cents
        distinguishing_aspect: |
          The services-fee tier break at 200000 cents is an inclusive lower bound keyed on base_rent
          alone. A COTTAGE lease priced at 199999 pays 350 bps (round_half_up(199999*350/10000) = 7000)
          plus the 3000 detached-product surcharge for cottages = 10000, while a lease priced one cent
          higher at exactly 200000 falls into the 300 bps band and pays 6000 + 3000 = 9000. The fee
          therefore drops by 1000 cents as the rent rises by 1, which is only reproducible if the tier
          uses >= at 200000 and if the bps product is rounded half-up rather than truncated (199999 *
          350 / 10000 = 6999.965).
        test_recipe:
          setup:
            - "Community 'Perrin Court' with product_mix {DETACHED: 0, COTTAGE: 2, TOWNHOME: 0}, total_planned_units 2, plat APPROVED, posture OPEN."
            - "One SECTIONS_RELEASED housing phase with two released AVAILABLE COTTAGE homesites."
            - "A PUBLISHED COTTAGE schedule at 199999 effective 2026-07-15, later superseded by a PUBLISHED COTTAGE schedule at 200000 effective 2026-08-01."
            - "Two households each with monthly_income_cents 700000, which clears 3x on both gross charges (629997 and 627000)."
