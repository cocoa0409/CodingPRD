            - "trigger[1] -> 200; total_count == 3, len(data) == 1, has_more == false"
            - "trigger[0] and trigger[1] together return {${r1_id}, ${r2_id}, ${r3_id}} with no id appearing twice"
            - "trigger[2] -> 200; InspectionReport.${r2_id}.status == VALIDATED"
