  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: posture_precedence_flow_impaired_over_pending
        claim_type: correct_result
        grounds:
          - "calculations.flow_posture_derivation"
        distinguishing_aspect: "When an open order (PENDING_REPLENISHMENT) and a moisture breach (FLOW_IMPAIRED) both hold, FLOW_IMPAIRED wins and site_posture becomes CRITICAL."
        test_recipe:
          setup: ["Site, vessel (moisture_limit 12.0, reorder 30). Reading 25.0 creates an open order -> posture PENDING_REPLENISHMENT."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "PP Site", state_code: "IA" }
              as: ServiceManager
              captures: { spp: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${spp}", name: "SILO-PP", vessel_kind: "SILO", capacity_tons: 100, material_name: "flour", reorder_point_pct: 30, target_fill_pct: 90, moisture_limit_pct: 12.0 }
              as: ServiceManager
              captures: { vpp: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Q", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { ttq: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${vpp}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${spp}"
          trigger:
            - call: "POST /quality-reports"
              payload: { vessel_id: "${vpp}", sampled_at: "2026-08-03T00:00:00Z", moisture_pct: 13.0, caking_index: 1 }
              as: Technician
              as_user_id: "${ttq}"
          assert:
            - "GET /vessels/${vpp} flow_posture == FLOW_IMPAIRED (not PENDING_REPLENISHMENT despite the open TRIGGERED order)"
            - "GET /sites/${spp} site_posture == CRITICAL"
            - "quality report flowability_grade == POOR (13.0 > 12.0)"

      - name: inventory_reanchors_on_newer_reading
        claim_type: correct_result
        grounds:
          - "calculations.current_inventory_tons"
        distinguishing_aspect: "A newer LevelReading re-anchors inventory: receipts at or before the new anchor's measured_at leave the sum, so inventory snaps to the reading's implied tons (10.0) regardless of the earlier +25.0 t receipt; the low level also triggers a fresh 80.0 t order."
        test_recipe:
          setup: ["Vessel (capacity 100, reorder 30, target 90): reading 25.0 -> order -> dispatch -> receive 25.0 t at 2026-08-03 (inventory 50.0)."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "RA Site", state_code: "IA" }
              as: ServiceManager
              captures: { sra: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sra}", name: "SILO-RA", vessel_kind: "SILO", capacity_tons: 100, material_name: "corn", reorder_point_pct: 30, target_fill_pct: 90 }
              as: ServiceManager
              captures: { vra: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${vra}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${sra}"
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${vra}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { ora: "$.data[0].id" }
            - call: "POST /replenishment-orders/${ora}/dispatch"
              payload: {}
              as: ServiceManager
            - call: "POST /replenishment-orders/${ora}/receive"
              payload: { delivered_tons: 25.0, received_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              as_user_id: "${sra}"
          trigger:
            - call: "POST /level-readings"
              payload: { vessel_id: "${vra}", measured_at: "2026-08-04T00:00:00Z", level_pct: 10.0 }
              as: PlantOperator
              as_user_id: "${sra}"
          assert:
            - "GET /vessels/${vra} current_inventory_tons == 10.0 (re-anchored; the 2026-08-03 receipt is at/before the new anchor)"
            - "GET /replenishment-orders?vessel_id=${vra}&status=TRIGGERED returns total_count == 1 with order_quantity_tons == 80.0 (90 - 10.0)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401"

      - name: get_single_resources_not_found_return_404
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_VESSEL_NOT_FOUND]"
          - "errors[ERR_TICKET_NOT_FOUND]"
          - "errors[ERR_PERMIT_NOT_FOUND]"
          - "errors[ERR_ORDER_NOT_FOUND]"
          - "errors[ERR_SITE_NOT_FOUND]"
          - "errors[ERR_TECHNICIAN_NOT_FOUND]"
        distinguishing_aspect: "Each single-resource GET with a well-formed but unknown UUID returns that resource's domain 404 error."
        test_recipe:
          setup: ["Empty DB (ids below reference nothing)."]
          setup_api_calls: []
          trigger:
            - call: "GET /sites/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: ServiceManager
              captures: { e1: $.data.error_id }
            - call: "GET /vessels/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: ServiceManager
              captures: { e2: $.data.error_id }
            - call: "GET /technicians/00000000-0000-0000-0000-000000000003"
              payload: {}
              as: ServiceManager
              captures: { e3: $.data.error_id }
            - call: "GET /service-tickets/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: ServiceManager
              captures: { e4: $.data.error_id }
            - call: "GET /entry-permits/00000000-0000-0000-0000-000000000005"
              payload: {}
              as: ServiceManager
              captures: { e5: $.data.error_id }
            - call: "GET /replenishment-orders/00000000-0000-0000-0000-000000000006"
              payload: {}
              as: ServiceManager
              captures: { e6: $.data.error_id }
          assert:
            - "site -> ERR_SITE_NOT_FOUND, vessel -> ERR_VESSEL_NOT_FOUND, technician -> ERR_TECHNICIAN_NOT_FOUND"
            - "ticket -> ERR_TICKET_NOT_FOUND, permit -> ERR_PERMIT_NOT_FOUND, order -> ERR_ORDER_NOT_FOUND"
            - "all http status 404"

      - name: body_fk_references_not_found_return_404
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_SITE_NOT_FOUND]"
          - "errors[ERR_VESSEL_NOT_FOUND]"
        distinguishing_aspect: "Body-referenced FKs are existence-checked: POST /vessels with unknown site_id -> ERR_SITE_NOT_FOUND; POST /level-readings with unknown vessel_id -> ERR_VESSEL_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vessels"
              payload: { site_id: "00000000-0000-0000-0000-000000000010", name: "X", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 20 }
              as: ServiceManager
              captures: { f1: $.data.error_id }
            - call: "POST /level-readings"
              payload: { vessel_id: "00000000-0000-0000-0000-000000000011", measured_at: "2026-08-02T00:00:00Z", level_pct: 50.0 }
              as: Technician
              as_user_id: "00000000-0000-0000-0000-0000000000bb"
              captures: { f2: $.data.error_id }
          assert:
            - "f1 == ERR_SITE_NOT_FOUND (404)"
            - "f2 == ERR_VESSEL_NOT_FOUND (404)"

      - name: schedule_window_in_past_rejected
        claim_type: temporal_validation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_WINDOW_IN_PAST]"
        distinguishing_aspect: "Scheduling a window whose start is not strictly after the logical clock fails with ERR_WINDOW_IN_PAST; clock is set via the test-driving endpoint."
        test_recipe:
          setup: ["Site, vessel, technician; ticket APPROVED. Logical clock advanced to 2026-08-10T00:00:00Z."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "WP Site", state_code: "IA" }
              as: ServiceManager
              captures: { swp: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${swp}", name: "BIN-WP", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
