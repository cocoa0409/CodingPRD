  - rule_id: boundary_precision_check
    instances:
      - name: match_score_exactly_at_auto_link_threshold_links_but_one_ten_thousandth_higher_reviews
        grounds:
          - calculations.match_score
          - entities.MatchThresholdConfig.fields.auto_link_threshold
          - state_machines.MatchLink.PROPOSED_to_AUTO_LINKED
          - state_machines.MatchLink.PROPOSED_to_PENDING_REVIEW
          - endpoints.POST_hie_participants_id_patient_records
        distinguishing_aspect: |
          Boundary metric: the numeric auto-link threshold, exercised on
          POST /hie/participants/{id}/patient-records. A demographic pair that agrees on family name,
          given name, birth date, ssn_last4 and phone but disagrees on postal code scores exactly
          0.9200 - the same four-decimal value as auto_link_threshold. Generation 1 (threshold 0.9200,
          inclusive >=) must AUTO_LINK it; generation 2 (threshold 0.9201) must route an identically
          scoring pair to PENDING_REVIEW. One ten-thousandth is the whole difference, so any
          implementation using > instead of >= or rounding the score to 2 decimals fails.
        test_recipe:
          setup:
            - "Threshold generation 1 is ACTIVE with auto_link_threshold 0.9200 and review_lower_bound 0.7500; generation 2 is drafted with auto_link_threshold 0.9201 and otherwise identical weights."
            - "Two participants are at CONFORMANCE_TESTING so both may contribute records."
            - "Record L1 (Robert Nguyen, 1979-04-12, ssn 4417, postal 94110, phone 4155550111) and record R1 (same person, postal 02139) are contributed under generation 1, scoring 0.20 + 0.12 + 0.25 + 0.28 + 0.07 = 0.9200 with zero credit for the postal disagreement (94110 and 02139 do not share their first three characters)."
            - "Record L2 (Amara Okonjo, 1986-09-30, ssn 7734, postal 80202, phone 3035550122) is contributed under generation 1 and shares nothing with L1 or R1, so its links score 0.0000 and are REJECTED."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-BOUND-G1", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgB1_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgB1_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-BOUND-G2", auto_link_threshold: 0.9201, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgB2_id: $.data.id }
            - call: "POST /hie/participants"
              payload: { legal_name: "Bayfront Medical Group", org_type: "CLINIC", declared_annual_patient_volume: 60000, primary_contact_email: "hie@bayfront.example" }
              as: HieAdmin
              captures: { pB1_id: $.data.id }
            - call: "POST /hie/participants/${pB1_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pB1_id}"
            - call: "POST /hie/participants/${pB1_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Copley Square Health Partners", org_type: "CLINIC", declared_annual_patient_volume: 48000, primary_contact_email: "hie@copleysquare.example" }
              as: HieAdmin
              captures: { pB2_id: $.data.id }
