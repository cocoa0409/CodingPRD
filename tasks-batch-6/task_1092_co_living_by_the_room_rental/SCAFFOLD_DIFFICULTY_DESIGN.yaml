  # ===================================================================
  # Rule 5 - validation priority conflicts across different pairs
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: application_state_error_outranks_income_fiscal_error
        grounds:
          - validations[priority=10]
          - validations[priority=31]
          - errors[ERR_APPLICATION_NOT_PENDING]
          - errors[ERR_INCOME_INSUFFICIENT]
          - calculations.application_income_qualification
        distinguishing_aspect: |
          The conflicting pair is category `state` (priority 10, ERR_APPLICATION_NOT_PENDING)
          against category `business_fiscal` (priority 31, ERR_INCOME_INSUFFICIENT): a single
          APPROVE call violates both because the application is already DENIED and the
          cosigner-boosted income of 150000 is still under required_income_cents 324999. The
          state error must win.
        setup_note: "distinct from the referential-vs-temporal pair used by the sibling instance"
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; house Peachtree A with room 101 at 25000 cents/week, so required_income_cents is 324999."
            - "Member Bea filed a WEEKLY application on room 101, was screened at 100000 verified income, decided CONDITIONAL, resubmitted with a 50000 cosigner, was screened again at 100000, and was then DENIED."
            - "Room 101 is still VACANT and Application.cosigner_monthly_income_cents == 50000, so the fiscal rule is also violated by an APPROVE."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
