              as: ShopManager
              captures: { cust_v2: $.data.version }
          trigger:
            - call: "POST /fab/scrap-credits/${credit_id}/void"
              payload: { expected_customer_version: "${cust_v2}" }
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "http 403 ERR_FORBIDDEN_ROLE; credit remains POSTED"

