        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "MailSpecialist calling POST /paper-purchase-orders/{id}/receive -> 403; purchasing is PurchasingManager-exclusive."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /paper-purchase-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/receive", payload: { sheets_received: 1 }, as: MailSpecialist, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE"]

      - name: rbac_purchasing_cannot_approve_proof
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "PurchasingManager calling POST /proofs/{id}/approve -> 403; proof approval is Customer-exclusive."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
