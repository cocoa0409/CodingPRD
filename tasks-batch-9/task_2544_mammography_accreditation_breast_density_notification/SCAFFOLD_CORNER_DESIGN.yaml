      - name: duplicate_state_code_and_duplicate_model_serial_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "StatePolicy.state_code is globally unique while MammographyUnit.model_serial is unique only inside its facility: the same serial is rejected with 409 in the owning facility and accepted in a second facility, which no single global-uniqueness implementation can satisfy."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; the primary facility with one DBT_3D unit whose model_serial is SEL-9001; a second facility on the same policy with no units."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - call: "POST /facilities"
              payload: { name: "Second Harbor Imaging", state_policy_id: "${pol_ct_id}", accreditation_body: "STATE_CERTIFIED" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dup_fac2_id: $.data.id }
          trigger:
            - call: "POST /state-policies"
              payload: { state_code: "CT", density_notice_rule: "FEDERAL_ONLY", lay_summary_max_reading_grade: 8, lay_summary_deadline_days: 30, supplemental_coverage_mandate: "NONE" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { dup_err1: $.data.error_id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { manufacturer: "Hologic", model_serial: "SEL-9001", modality: "DM_2D", accreditation_expires_on: "2027-06-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dup_err2: $.data.error_id }
            - call: "POST /facilities/${dup_fac2_id}/units"
              payload: { manufacturer: "Hologic", model_serial: "SEL-9001", modality: "DM_2D", accreditation_expires_on: "2027-06-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dup_unit2_id: $.data.id }
          assert:
            - "Duplicate state_code — HTTP status == 409 and error_id == \"ERR_DUPLICATE_RESOURCE\""
            - "Duplicate model_serial in the same facility — HTTP status == 409 and error_id == \"ERR_DUPLICATE_RESOURCE\""
            - "Same model_serial in the second facility — HTTP status == 201 and MammographyUnit.${dup_unit2_id}.model_serial == \"SEL-9001\""
            - "GET /state-policies/${pol_ct_id} still reports density_notice_rule == STATE_ENHANCED_ALL — the rejected create did not overwrite it"
            - "GET /facilities/${fac_id}/units returns total_count == 1"

      - name: future_timestamp_and_clock_rewind_are_rejected_while_a_no_op_hold_passes
        claim_type: violation_to_error
        grounds:
          - validations[priority=60]
          - validations[priority=66]
          - errors[ERR_FUTURE_TIMESTAMP]
          - errors[ERR_CLOCK_REWIND]
        distinguishing_aspect: "Both temporal guards compare against the logical clock with opposite strictness: a performed_at one month ahead of the clock is rejected 422, a clock move one day backwards is rejected 422, yet setting the clock to exactly its current value is accepted because the rule permits holding."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
          trigger:
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-TS-1", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-09-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ts_err1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ts_err2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "GET /_clock/current"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "Future performed_at — HTTP status == 422 and error_id == \"ERR_FUTURE_TIMESTAMP\""
            - "Backwards clock move — HTTP status == 422 and error_id == \"ERR_CLOCK_REWIND\""
            - "Clock held at the same instant — HTTP status == 200"
            - "GET /_clock/current reports 2026-08-01T00:00:00Z"
            - "GET /exams returns total_count == 0"

      - name: screening_interpretation_without_a_density_category_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=74]
          - errors[ERR_DENSITY_CATEGORY_REQUIRED]
        distinguishing_aspect: "The density requirement is conditional on exam_type: the same interpret payload with no density_category is rejected 422 on a SCREENING exam and accepted on a DIAGNOSTIC exam, because only the screening lay summary needs a density statement."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One SCREENING and one DIAGNOSTIC exam, both performed 2026-07-20 and awaiting interpretation."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-DC-S", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { dc_scr_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-DC-D", patient_state_code: "CT", exam_type: "DIAGNOSTIC", performed_at: "2026-07-20T00:00:00Z", original_image_count: 6 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { dc_dia_id: $.data.id }
          trigger:
            - call: "POST /exams/${dc_scr_id}/interpret"
              payload: { birads_assessment: 1 }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { dc_err: $.data.error_id }
            - call: "POST /exams/${dc_dia_id}/interpret"
              payload: { birads_assessment: 3 }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
          assert:
            - "SCREENING interpret — HTTP status == 422 and error_id == \"ERR_DENSITY_CATEGORY_REQUIRED\""
            - "Exam.${dc_scr_id}.report_status == AWAITING_INTERPRETATION and interpreting_physician_id == null"
            - "DIAGNOSTIC interpret — HTTP status == 200 and Exam.${dc_dia_id}.report_status == INTERPRETED_FINAL"
            - "Exam.${dc_dia_id}.density_category == null and notification_status == NOT_REQUIRED"
            - "Exam.${dc_dia_id}.recall_flag == false (BI-RADS 3 is not a recall, and only SCREENING exams can be recalls)"

      - name: supplemental_order_on_an_ineligible_exam_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=75]
          - errors[ERR_EXAM_NOT_ELIGIBLE_FOR_SUPPLEMENTAL]
        distinguishing_aspect: "Eligibility is a conjunction, so both halves are probed independently: an INTERPRETED_FINAL diagnostic exam with a null density_category and an uninterpreted screening exam with no report at all are each rejected 422 by the same rule."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One DIAGNOSTIC exam interpreted BI-RADS 3 with no density_category, and one SCREENING exam still awaiting interpretation."
          setup_api_calls:
