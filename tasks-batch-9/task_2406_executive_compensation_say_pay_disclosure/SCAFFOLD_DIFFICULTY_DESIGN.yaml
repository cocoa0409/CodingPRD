          The program's own design_status stays DISCLOSED, so the priority-16 state gate is satisfied; only the
          CD_AND_A section's state has regressed. The two conditions look identical from the program row alone,
          and an implementation that treats "DISCLOSED" as proof that the CD&A is filed will wrongly accept the
          vote. This is the mirror image of the first instance, where the dependency ran outward from a Company;
          here it runs inward from a child that the parent's own status no longer reflects.
