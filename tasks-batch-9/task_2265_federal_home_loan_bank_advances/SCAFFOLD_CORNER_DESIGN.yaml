            - "GET /fhlb/collateral-assets/{asset_sf} reports custody_location == \"FHLB_SAFEKEEPING\", effective_listing_mode == \"DELIVERED\", discount_factor_bps == 9200, lendable_value_cents == 18400000, status still \"ELIGIBLE\""
            - "GET /fhlb/member-banks/{member_id} reports lendable_collateral_value_cents == 18400000 and borrowing_capacity_cents == 18400000"

      - name: safekeeping_confirm_before_delivery_date_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.SafekeepingReceipt (confirm requires logical clock >= delivery_date)", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Files cannot be confirmed as received before the date they were shipped: with the clock at 2026-08-01 and delivery_date 2026-08-10 the confirm must be refused, so custody and the discount factor stay put."
        test_recipe:
          setup: ["The same Harbor Savings fixture with an ELIGIBLE SF_MORTGAGE at factor 7800 and a PENDING_DELIVERY receipt whose delivery_date is nine days in the future."]
          setup_api_calls:
