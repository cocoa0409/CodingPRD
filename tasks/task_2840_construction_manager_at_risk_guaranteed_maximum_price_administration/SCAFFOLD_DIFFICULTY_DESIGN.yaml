  - rule_id: boundary_precision_check
    instances:
      - name: construction_draw_at_exact_owner_approval_threshold_and_one_cent_above
        grounds:
          - calculations.draw_approval_requirement
          - global_constants.DRAW_OWNER_APPROVAL_THRESHOLD
          - validations.priority_120_ERR_OWNER_APPROVAL_REQUIRED
          - state_machines.ContingencyDraw.REQUESTED_to_POSTED
          - calculations.contingency_posture_derivation
        distinguishing_aspect: |
          DRAW_OWNER_APPROVAL_THRESHOLD is 50000.00 and the comparison is STRICTLY greater,
          so a draw of exactly 50000.00 posts on the direct path while a draw of 50000.01 -
          one cent above - is forced onto the owner-approved path. The pair pins both the
          direction of the strict inequality and the cent-level precision of the comparison;
          an implementation using >= inverts the first case and one truncating to whole
          dollars inverts the second.
