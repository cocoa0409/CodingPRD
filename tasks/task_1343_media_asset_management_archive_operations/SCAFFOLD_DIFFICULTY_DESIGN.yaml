              as: LegalCounsel
              as_user_id: "lc-2"
            - call: "POST /archive/retrieval-requests/${rr_id}/approve"
              payload: {}
              as: AccessOfficer
          assert:
            - "Approve under hold: error_id == ERR_ASSET_UNDER_LEGAL_HOLD, http 409"
            - "After release by lc-2 (!= lc-1 placer): RetrievalRequest.${rr_id}.status == STAGED"

  # ---------------------------------------------------------------------------
  # Rule 8 — temporal-overlap conflicts with DIFFERENT interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusive_rights_grant_half_open_overlap
        grounds:
          - calculations.exclusive_grant_overlap
          - errors[ERR_EXCLUSIVE_GRANT_OVERLAP]
        distinguishing_aspect: |
          Resource = Asset's exclusive rights scope, semantics = half-open
          [start, end): an overlapping exclusive BROADCAST/DOMESTIC window is
          rejected, but a window starting exactly at the existing window_end
          (adjacency, end == start) is ACCEPTED.
        test_recipe:
          setup:
            - "Asset exists; exclusive ACTIVE grant G1 BROADCAST DOMESTIC [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${asset_id}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", exclusive: true }
              as: RightsManager
          trigger:
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${asset_id}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-06-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z", exclusive: true }
              as: RightsManager
              captures: { err: $.data.error_id }
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${asset_id}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2027-01-01T00:00:00Z", window_end: "2028-01-01T00:00:00Z", exclusive: true }
              as: RightsManager
              captures: { g2: $.data.id }
          assert:
            - "Overlapping create: error_id == ERR_EXCLUSIVE_GRANT_OVERLAP, http 422"
            - "Adjacent create (window_start == existing window_end) succeeds with status ACTIVE"

      - name: workstation_buffered_gap_conflict
        grounds:
          - calculations.workstation_schedule_conflict
          - errors[ERR_WORKSTATION_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource = Workstation (different resource than the rights scope),
          semantics = 30-minute turnaround buffer (different interval geometry than
          half-open adjacency): a new slot starting exactly at the previous slot's
          end (gap 0) is REJECTED, while a gap of exactly 30 minutes is ACCEPTED.
        test_recipe:
          setup:
            - "Workstation W (supports BETACAM_SP); obsolete-format assets A1, A2"
            - "Ticket T1 ASSIGNED on W with slot [2030-01-01T10:00, 2030-01-01T12:00)"
          setup_api_calls:
            - call: "POST /archive/workstations"
              payload: { name: "WS-1", supported_formats: ["BETACAM_SP"] }
              as: SystemAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "VAULT" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "A1", description: "d", media_type: "VIDEO", format_class: "BETACAM_SP", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { a1: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "A2", description: "d", media_type: "VIDEO", format_class: "BETACAM_SP", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { a2: $.data.id }
            - call: "POST /archive/digitization-tickets"
              payload: { asset_id: "${a1}", scheduled_start: "2030-01-01T10:00:00Z", scheduled_end: "2030-01-01T12:00:00Z", output_format: "PRORES_FILE" }
              as: ArchivistLead
              captures: { t1: $.data.id }
            - call: "POST /archive/digitization-tickets/${t1}/assign"
              payload: { workstation_id: "${ws_id}" }
              as: LabTechnician
            - call: "POST /archive/digitization-tickets"
              payload: { asset_id: "${a2}", scheduled_start: "2030-01-01T12:00:00Z", scheduled_end: "2030-01-01T14:00:00Z", output_format: "PRORES_FILE" }
              as: ArchivistLead
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /archive/digitization-tickets/${t2}/assign"
              payload: { workstation_id: "${ws_id}" }
              as: LabTechnician
              captures: { err: $.data.error_id }
            - call: "POST /archive/digitization-tickets"
              payload: { asset_id: "${a2}", scheduled_start: "2030-01-01T12:30:00Z", scheduled_end: "2030-01-01T14:30:00Z", output_format: "PRORES_FILE" }
              as: ArchivistLead
              captures: { t3: $.data.id }
            - call: "POST /archive/digitization-tickets/${t3}/assign"
              payload: { workstation_id: "${ws_id}" }
              as: LabTechnician
          assert:
            - "Gap-0 assign: error_id == ERR_WORKSTATION_SCHEDULE_CONFLICT, http 422"
            - "Gap-30min assign (exactly the >= buffer boundary) succeeds: ticket ${t3} status == ASSIGNED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating-action invariants on DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: disposal_approve_withdraw_conserves_catalog_status
        grounds:
          - state_machines.DisposalOrder.APPROVED_to_WITHDRAWN
          - state_machines.Asset.DISPOSAL_SCHEDULED_to_ARCHIVED
        distinguishing_aspect: |
          Conserved quantity = Asset.catalog_status. Forward action approve (ARCHIVED
          → DISPOSAL_SCHEDULED) paired with its compensating withdraw MUST return the
          asset to exactly ARCHIVED, with the order terminally WITHDRAWN — zero drift
          in the catalog disposition.
        test_recipe:
          setup:
            - "Asset ARCHIVED; DisposalOrder created by arch-1, submitted, approved by arch-2 (asset DISPOSAL_SCHEDULED)"
          setup_api_calls:
            - call: "POST /archive/retention-policies"
              payload: { media_type: "VIDEO", min_retention_years: 0 }
              as: SystemAdmin
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /archive/assets/${asset_id}/submit-metadata"
              payload: {}
              as: MetadataCataloger
              as_user_id: "cat-1"
            - call: "POST /archive/assets/${asset_id}/metadata-approve"
              payload: {}
              as: MetadataLibrarian
              as_user_id: "lib-1"
            - call: "POST /archive/proxy-renditions"
              payload: { asset_id: "${asset_id}" }
              as: LabTechnician
              captures: { pr_id: $.data.id }
            - call: "POST /archive/proxy-renditions/${pr_id}/claim"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/proxy-renditions/${pr_id}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /archive/rights-grants"
              payload: { asset_id: "${asset_id}", grant_type: "BROADCAST", territory: "DOMESTIC", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: RightsManager
            - call: "POST /archive/assets/${asset_id}/archive"
              payload: {}
              as: ArchivistLead
              as_user_id: "arch-1"
              captures: { v_arch: $.data.version }
            - call: "POST /archive/disposal-orders"
              payload: { asset_id: "${asset_id}", scheduled_execution_date: "2026-08-02T00:00:00Z", expected_asset_version: "${v_arch}" }
              as: ArchivistLead
              as_user_id: "arch-1"
              captures: { order_id: $.data.id }
            - call: "POST /archive/disposal-orders/${order_id}/submit"
              payload: {}
              as: ArchivistLead
              as_user_id: "arch-1"
            - call: "POST /archive/disposal-orders/${order_id}/approve"
              payload: {}
              as: ArchivistLead
              as_user_id: "arch-2"
          trigger:
            - call: "POST /archive/disposal-orders/${order_id}/withdraw"
              payload: {}
              as: ArchivistLead
              as_user_id: "arch-1"
            - call: "GET /archive/assets/${asset_id}"
              as: ArchivistLead
              captures: { post_catalog: $.data.catalog_status }
          assert:
            - "DisposalOrder.${order_id}.status == WITHDRAWN"
            - "Asset.${asset_id}.catalog_status == ARCHIVED (invariant: catalog disposition unchanged by approve+withdraw pair)"
            - "Asset.${asset_id}.hold_status == CLEAR"

      - name: migration_supersede_cancel_conserves_tier_and_queue
        grounds:
          - state_machines.MigrationJob.QUEUED_to_SUPERSEDED
          - state_machines.MigrationJob.QUEUED_to_CANCELLED
          - concurrency_rules[migration-job-create-stale-asset]
        distinguishing_aspect: |
          Conserved quantities = Asset.storage_tier and the count of non-terminal
          MigrationJobs for the asset (different quantity than catalog disposition):
          create A, create B (supersedes A), cancel B MUST leave storage_tier ==
          ONLINE and exactly 0 QUEUED jobs.
        test_recipe:
          setup:
            - "Fresh Asset ONLINE at version 1"
          setup_api_calls:
            - call: "POST /archive/ingest-batches"
              payload: { batch_name: "B1", source_department: "NEWS" }
              as: IngestCoordinator
              captures: { batch_id: $.data.id }
            - call: "POST /archive/assets"
              payload: { ingest_batch_id: "${batch_id}", title: "T", description: "d", media_type: "VIDEO", format_class: "DIGITAL_FILE", duration_seconds: 60, size_gb: 5, rights_holder: "ACME", keywords: ["k"], content_rating: "G" }
              as: IngestCoordinator
              captures: { asset_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /archive/migration-jobs"
              payload: { asset_id: "${asset_id}", target_tier: "NEARLINE", expected_asset_version: "${v1}" }
              as: ArchivistLead
              captures: { job_a: $.data.id }
            - call: "GET /archive/assets/${asset_id}"
              as: ArchivistLead
              captures: { v2: $.data.version }
            - call: "POST /archive/migration-jobs"
              payload: { asset_id: "${asset_id}", target_tier: "DEEP_ARCHIVE", expected_asset_version: "${v2}" }
              as: ArchivistLead
              captures: { job_b: $.data.id }
            - call: "POST /archive/migration-jobs/${job_b}/cancel"
              payload: {}
              as: ArchivistLead
            - call: "GET /archive/migration-jobs?asset_id=${asset_id}&status=QUEUED"
              as: ArchivistLead
          assert:
            - "MigrationJob.${job_a}.status == SUPERSEDED (via GET or list)"
            - "MigrationJob.${job_b}.status == CANCELLED"
            - "Asset.${asset_id}.storage_tier == ONLINE (invariant: tier unchanged by supersede+cancel pair)"
            - "count of QUEUED MigrationJobs for the asset == 0"
