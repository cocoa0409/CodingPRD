              captures: { jp3: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp3}", agreed_rate_cents: 2000, scheduled_start: "2026-04-03T19:00:00Z", scheduled_end: "2026-04-03T22:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk3: $.data.id }
            - call: "POST /marketplace/bookings/${bk3}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
