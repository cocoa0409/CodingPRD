          A different conserved quantity from the share invariant: cents. The identity
          cumulative_repurchase_funding_cents == repurchase_reserve_cents +
          committed_repurchase_cents + cumulative_repurchase_settled_cents must read
          5000000 == 5000000 + 0 + 0 both before the fund and after the compensating
          cancel, and the deferred sibling must be restored to PENDING.
