# =============================================================================
# PRD Benchmark Scaffold — Citrus Packinghouse & Grove Caretaking
# =============================================================================

scenario: |
  Citrus Packinghouse & Grove Caretaking (Florida citrus packinghouse): harvest
  crew scheduling & maturity testing, degreening room & color add, size/grade
  sorting & fresh vs juice diversion, grower pool accounting & advance payments,
  caretaking billing (spray/fertilize/prune) charged to grove, pest quarantine &
  regulatory compliance, export protocol & phytosanitary certificate, packout &
  marketing allocation

domain_name: citrus-packinghouse
api_prefix: /packinghouse

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit      # quarantine/phyto/regulatory gates drive every core flow
  secondary_archetype: ledger_reconciliation  # pool accounting: provisional vs final price, advance recoupment, caretaking offsets
  complexity_layers:
    - optimistic_concurrency               # OCC on Grove.version (maturity supersede), Delivery.version (sort-run recreate), Pool.version (re-price)
    - dual_variant_calculation             # provisional vs final pool price; NEXT_SETTLEMENT_FULL vs PRO_RATA_THIRDS recoupment
    - cascading_side_effects               # quarantine activation cascades grove -> assignments -> crew capacity -> delivery holds
    - derived_field_reconciliation         # posture, channel remaining, pool totals, grower ledgers must stay consistent under reversal
  entity_topology: hybrid                  # growers->groves tree + flat cross-references (assignments, sessions, lots)
  state_machine_shape: parallel            # Delivery carries processing_status x regulatory_status; several cyclic/branching machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential: false
    - many_to_many: false
  role_model: segregation_of_duties        # sort create vs verify; quarantine issue vs release; inspection request vs certificate issue
  consistency_model: immediate             # all cascades and recomputes atomic in the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: grower_code, type: string, source: input, description: "Unique human-readable grower code", constraints: "unique across all growers" }
      - { name: display_name, type: string, source: input, description: "Grower display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }
      - { name: advance_outstanding_cents, type: integer, source: computed, description: "Sum of outstanding_cents over all AdvancePayment rows of this grower in states ISSUED or PARTIALLY_RECOUPED", default: 0 }
      - { name: caretaking_balance_cents, type: integer, source: computed, description: "Sum of (total_cents - paid_cents) over this grower's CaretakingInvoice rows in states ISSUED or PARTIALLY_PAID", default: 0 }

  - name: Grove
    parent: Grower
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; owning grower" }
      - { name: block_code, type: string, source: input, description: "Grove block code", constraints: "unique within the owning grower" }
      - { name: variety, type: enum, source: input, description: "HAMLIN | VALENCIA | RED_GRAPEFRUIT | TANGERINE" }
      - { name: acreage, type: number, source: input, description: "Grove acres", constraints: "> 0" }
      - { name: county_code, type: string, source: input, description: "Florida county code (e.g. POLK, HIGHLANDS)" }
      - { name: caretaking_enrolled, type: boolean, source: input, description: "Whether grove is enrolled in the caretaking program", default: false }
      - { name: lifecycle_status, type: enum, source: system, description: "PRODUCTIVE | RETIRED", default: PRODUCTIVE }
      - { name: quarantine_posture, type: enum, source: computed, description: "CLEAR | QUARANTINED; QUARANTINED iff any ACTIVE QuarantineOrder targets this grove (scope GROVE, grove_id match) or its county (scope COUNTY_ZONE, county_code match)", default: CLEAR }

  - name: MaturityTest
    parent: Grove
    common_fields: true
    fields:
      - { name: grove_id, type: string, source: input, description: "FK -> Grove.id; tested grove (path parameter)" }
      - { name: sampled_at, type: datetime, source: input, description: "UTC timestamp the sample was drawn" }
      - { name: brix, type: number, source: input, description: "Degrees Brix of sample", constraints: "> 0" }
      - { name: acid_pct, type: number, source: input, description: "Percent anhydrous citric acid", constraints: "> 0" }
      - { name: juice_pct, type: number, source: input, description: "Percent juice content by weight", constraints: "0 < juice_pct <= 100" }
      - { name: ratio, type: number, source: computed, description: "round_half_up(brix / acid_pct, 2)" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per maturity_evaluation calculation for the grove variety" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED; newest test per grove is CURRENT, creation supersedes the prior CURRENT test", default: CURRENT }
      - { name: expires_at, type: datetime, source: computed, description: "sampled_at + MATURITY_VALIDITY_HOURS (120 hours)" }

  - name: HarvestCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_code, type: string, source: input, description: "Unique crew code", constraints: "unique" }
      - { name: daily_capacity_boxes, type: integer, source: input, description: "Maximum boxes per 24h day", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }

  - name: HarvestAssignment
    parent: null
    common_fields: true
    fields:
      - { name: crew_id, type: string, source: input, description: "FK -> HarvestCrew.id; assigned crew" }
      - { name: grove_id, type: string, source: input, description: "FK -> Grove.id; grove to harvest" }
      - { name: window_start, type: datetime, source: input, description: "Window start (inclusive), UTC" }
      - { name: window_end, type: datetime, source: input, description: "Window end (exclusive), UTC; half-open [window_start, window_end)" }
      - { name: planned_boxes, type: integer, source: input, description: "Planned boxes for the window", constraints: "> 0 and <= daily_capacity_boxes * ceil((window_end - window_start)/24h)" }
      - { name: actual_boxes, type: integer, source: input, description: "Actual harvested boxes, supplied on completion; null until COMPLETED", constraints: "on complete: >= 1 and <= ceil(planned_boxes * 1.25)", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", default: SCHEDULED }

  - name: Delivery
    parent: Grove
    common_fields: true
    fields:
      - { name: grove_id, type: string, source: input, description: "FK -> Grove.id; source grove" }
      - { name: assignment_id, type: string, source: input, description: "FK -> HarvestAssignment.id; assignment the fruit was harvested under" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: variety, type: enum, source: system, description: "Copied from grove.variety at creation" }
      - { name: gross_boxes, type: integer, source: input, description: "Gross field boxes on the truck", constraints: "> 0" }
      - { name: tare_boxes, type: integer, source: input, description: "Tare/reject-at-scale boxes", constraints: ">= 0 and < gross_boxes" }
      - { name: net_boxes, type: integer, source: computed, description: "gross_boxes - tare_boxes" }
      - { name: processing_status, type: enum, source: system, description: "RECEIVED | IN_DEGREENING | READY_TO_SORT | SORTED | CLOSED", default: RECEIVED }
      - { name: regulatory_status, type: enum, source: system, description: "CLEAR | HELD | RELEASED | CONDEMNED", default: CLEAR }
      - { name: pool_id, type: string, source: computed, description: "FK -> Pool.id; resolved at creation to the OPEN pool whose variety matches and whose week contains received_at", default: null }
      - { name: requires_degreening, type: boolean, source: computed, description: "true for varieties RED_GRAPEFRUIT and TANGERINE; false for HAMLIN and VALENCIA" }

  - name: DegreeningRoom
    parent: null
    common_fields: true
    fields:
      - { name: room_code, type: string, source: input, description: "Unique room code", constraints: "unique" }
      - { name: capacity_boxes, type: integer, source: input, description: "Maximum simultaneous boxes in the room", constraints: "> 0" }
      - { name: min_hours, type: integer, source: input, description: "Minimum conditioning hours before release", default: 12 }
      - { name: max_hours, type: integer, source: input, description: "Maximum conditioning hours before release", default: 72 }
      - { name: status, type: enum, source: system, description: "AVAILABLE | MAINTENANCE", default: AVAILABLE }

  - name: DegreeningSession
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> DegreeningRoom.id" }
      - { name: delivery_id, type: string, source: input, description: "FK -> Delivery.id" }
      - { name: boxes, type: integer, source: input, description: "Boxes loaded into the room", constraints: "> 0; sum over the delivery's sessions must be <= delivery.net_boxes" }
      - { name: planned_hours, type: integer, source: input, description: "Planned conditioning hours; defines the reservation interval [started_at, started_at + planned_hours)", constraints: "> 0" }
      - { name: color_add_applied, type: boolean, source: input, description: "Whether color-add (ethylene + dye) is applied", default: true }
      - { name: started_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: released_at, type: datetime, source: system, description: "Logical clock timestamp at release; null until released", default: null }
      - { name: duration_hours, type: number, source: computed, description: "(released_at - started_at) in hours, 2 decimals; null until released", default: null }
      - { name: status, type: enum, source: system, description: "CONDITIONING | RELEASED | ABORTED", default: CONDITIONING }

  - name: SortRun
    parent: Delivery
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: input, description: "FK -> Delivery.id; delivery being sorted" }
      - { name: fancy_boxes, type: integer, source: input, description: "Measured FANCY boxes", constraints: ">= 0" }
      - { name: choice_boxes, type: integer, source: input, description: "Measured CHOICE boxes", constraints: ">= 0" }
      - { name: standard_boxes, type: integer, source: input, description: "Measured STANDARD boxes", constraints: ">= 0" }
      - { name: juice_boxes, type: integer, source: input, description: "Measured juice-grade boxes", constraints: ">= 0" }
      - { name: cull_boxes, type: integer, source: input, description: "Measured cull (waste) boxes", constraints: ">= 0" }
      - { name: color_score, type: integer, source: input, description: "Color score 1 (green) to 10 (full color)", constraints: "1..10" }
      - { name: defect_pct, type: number, source: input, description: "Surface defect percentage of the grade sample", constraints: "0..100" }
      - { name: fresh_eligible, type: boolean, source: computed, description: "color_score >= FRESH_COLOR_MIN(6) and defect_pct <= FRESH_DEFECT_MAX(20) and delivery.regulatory_status in {CLEAR, RELEASED}" }
      - { name: ge_boxes, type: number, source: computed, description: "Grade-equivalent boxes per ge_box_conversion (2 decimals)" }
      - { name: proceeds_cents, type: integer, source: computed, description: "Total proceeds of this run's allocation; null until POSTED", default: null }
      - { name: allocation, type: array, source: computed, description: "Array of {channel_id, grade, boxes} lines produced by packout_allocation at post; null until POSTED", default: null }
      - { name: created_by, type: string, source: system, description: "X-User-ID of creator (LineOperator)" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifying QualityInspector; null until VERIFIED; must differ from created_by", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | VERIFIED | POSTED | VOIDED", default: OPEN }

  - name: AllocationChannel
    parent: null
    common_fields: true
    fields:
      - { name: channel_code, type: string, source: input, description: "Unique channel code", constraints: "unique" }
      - { name: channel_type, type: enum, source: input, description: "EXPORT | DOMESTIC_FRESH | JUICE" }
      - { name: destination_market, type: enum, source: input, description: "JAPAN | EU | KOREA | DOMESTIC | NONE; JUICE channels must use NONE, DOMESTIC_FRESH must use DOMESTIC, EXPORT must use JAPAN/EU/KOREA" }
      - { name: variety, type: enum, source: input, description: "HAMLIN | VALENCIA | RED_GRAPEFRUIT | TANGERINE; channel accepts only this variety" }
      - { name: week_start, type: string, source: input, description: "Monday date (YYYY-MM-DD) of the allocation week" }
      - { name: allocation_boxes, type: integer, source: input, description: "Contracted weekly capacity; JUICE channels are uncapped and this value is ignored (convention: 0)", constraints: ">= 0" }
      - { name: price_cents_per_box, type: integer, source: input, description: "Contract price paid into the pool per box", constraints: "> 0" }
      - { name: priority_rank, type: integer, source: input, description: "Waterfall order; lower fills first; ties broken by created_at ASC" }
      - { name: accepts_grades, type: array, source: input, description: "Subset of [FANCY, CHOICE, STANDARD, JUICE] the channel accepts" }
      - { name: remaining_boxes, type: integer, source: computed, description: "allocation_boxes - boxes already allocated to POSTED sort runs; uncapped (JUICE) channels report null", default: null }

  - name: Pool
    parent: null
    common_fields: true
    fields:
      - { name: variety, type: enum, source: input, description: "HAMLIN | VALENCIA | RED_GRAPEFRUIT | TANGERINE" }
      - { name: week_start, type: string, source: input, description: "Monday date (YYYY-MM-DD); pool covers [week_start, week_start+6] inclusive", constraints: "unique together with variety" }
      - { name: status, type: enum, source: system, description: "OPEN | INTAKE_CLOSED | PRICED | SETTLED", default: OPEN }
      - { name: posted_ge_boxes, type: number, source: computed, description: "Sum of ge_boxes over POSTED sort runs of deliveries assigned to this pool (2 decimals)", default: 0 }
      - { name: posted_proceeds_cents, type: integer, source: computed, description: "Sum of proceeds_cents over POSTED sort runs plus export diversion credits, minus reversal debits", default: 0 }
      - { name: sorted_field_boxes, type: integer, source: computed, description: "Sum of net_boxes of deliveries with a POSTED sort run in this pool", default: 0 }
      - { name: provisional_price_cents_per_ge_box, type: integer, source: computed, description: "Forward-looking price per pool_provisional_price calculation", default: 0 }
      - { name: final_price_cents_per_ge_box, type: integer, source: computed, description: "Final price per pool_final_price; null until PRICED", default: null }

  - name: AdvancePayment
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; recipient grower" }
      - { name: pool_id, type: string, source: input, description: "FK -> Pool.id; pool the advance is drawn against" }
      - { name: amount_cents, type: integer, source: input, description: "Advance amount", constraints: "> 0" }
      - { name: recoup_policy, type: enum, source: input, description: "NEXT_SETTLEMENT_FULL | PRO_RATA_THIRDS", default: NEXT_SETTLEMENT_FULL }
      - { name: status, type: enum, source: system, description: "REQUESTED | ISSUED | DENIED | PARTIALLY_RECOUPED | RECOUPED | WRITTEN_OFF", default: REQUESTED }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock timestamp of approval; null until ISSUED", default: null }
      - { name: recouped_cents, type: integer, source: computed, description: "Amount recouped through pool settlements", default: 0 }
      - { name: written_off_cents, type: integer, source: computed, description: "Amount written off", default: 0 }
      - { name: outstanding_cents, type: integer, source: computed, description: "amount_cents - recouped_cents - written_off_cents; invariant amount == recouped + written_off + outstanding" }

  - name: CaretakingServiceOrder
    parent: Grove
    common_fields: true
    fields:
      - { name: grove_id, type: string, source: input, description: "FK -> Grove.id; serviced grove" }
      - { name: service_type, type: enum, source: input, description: "SPRAY | FERTILIZE | PRUNE | MOW" }
      - { name: service_date, type: string, source: input, description: "Date (YYYY-MM-DD) the service is/was performed" }
      - { name: acres_treated, type: number, source: input, description: "Acres treated", constraints: "> 0 and <= grove.acreage" }
      - { name: chemical_cost_cents, type: integer, source: input, description: "Pass-through chemical cost; must be 0 unless service_type == SPRAY", default: 0, constraints: ">= 0" }
      - { name: rate_tier, type: enum, source: computed, description: "SMALL | MEDIUM | LARGE from grove.acreage: SMALL < 40, MEDIUM 40..120 inclusive, LARGE > 120" }
      - { name: line_amount_cents, type: integer, source: computed, description: "Computed at completion per caretaking_billing_rollup; null until COMPLETED", default: null }
      - { name: invoice_id, type: string, source: system, description: "FK -> CaretakingInvoice.id; null until invoiced", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | COMPLETED | INVOICED | CANCELLED", default: REQUESTED }

  - name: CaretakingInvoice
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; billed grower" }
      - { name: period_start, type: string, source: input, description: "Inclusive period start date (YYYY-MM-DD)" }
      - { name: period_end, type: string, source: input, description: "Inclusive period end date (YYYY-MM-DD); must be >= period_start" }
      - { name: line_order_ids, type: array, source: computed, description: "CaretakingServiceOrder ids swept into this invoice at creation: grower's groves' orders in COMPLETED status with invoice_id null and service_date in [period_start, period_end], ordered by service_date ASC then created_at ASC" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of member orders' line_amount_cents (per-line rounding, then summed)" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of accepted payments", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | DISPUTED | VOID", default: DRAFT }

  - name: QuarantineOrder
    parent: null
    common_fields: true
    fields:
      - { name: scope_type, type: enum, source: input, description: "GROVE | COUNTY_ZONE" }
      - { name: grove_id, type: string, source: input, description: "FK -> Grove.id; required iff scope_type == GROVE, must be null otherwise", default: null }
      - { name: county_code, type: string, source: input, description: "County code; required iff scope_type == COUNTY_ZONE, must be null otherwise", default: null }
      - { name: pest_type, type: enum, source: input, description: "CANKER | HLB_GREENING | FRUIT_FLY | BLACK_SPOT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", default: ACTIVE }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of issuing ComplianceOfficer" }
      - { name: released_at, type: datetime, source: system, description: "Null until RELEASED", default: null }
      - { name: released_by, type: string, source: system, description: "X-User-ID of releasing officer; must differ from issued_by", default: null }

  - name: ExportLot
    parent: null
    common_fields: true
    fields:
      - { name: destination_market, type: enum, source: input, description: "JAPAN | EU | KOREA" }
      - { name: variety, type: enum, source: input, description: "HAMLIN | VALENCIA | RED_GRAPEFRUIT | TANGERINE" }
      - { name: grade, type: enum, source: input, description: "FANCY | CHOICE | STANDARD" }
      - { name: boxes, type: integer, source: input, description: "Boxes reserved for this lot", constraints: "> 0" }
      - { name: source_channel_id, type: string, source: input, description: "FK -> AllocationChannel.id; must be an EXPORT channel of matching variety, destination_market, and whose week matches the fruit's pool week" }
      - { name: source_grove_id, type: string, source: input, description: "FK -> Grove.id; registered grove of origin for protocol declarations" }
      - { name: cold_treatment_hours, type: integer, source: input, description: "Logged cold-treatment hours; JAPAN lots require >= COLD_TREATMENT_MIN_HOURS (24)", default: 0, constraints: ">= 0" }
      - { name: pool_id, type: string, source: computed, description: "FK -> Pool.id; resolved from source channel's variety + week_start" }
      - { name: inspection_requested_by, type: string, source: system, description: "X-User-ID of officer who requested inspection; null until INSPECTION_READY", default: null }
      - { name: phyto_certificate_id, type: string, source: system, description: "FK -> PhytosanitaryCertificate.id; the certificate that certified the lot; null until CERTIFIED", default: null }
      - { name: diverted_to, type: enum, source: system, description: "JUICE; set when DIVERTED (diverted fruit is always credited to the juice channel)", default: null }
      - { name: status, type: enum, source: system, description: "BUILDING | INSPECTION_READY | CERTIFIED | REJECTED | SHIPPED | DIVERTED", default: BUILDING }

  - name: PhytosanitaryCertificate
    parent: ExportLot
    common_fields: true
    fields:
      - { name: export_lot_id, type: string, source: input, description: "FK -> ExportLot.id (path parameter)" }
      - { name: certificate_number, type: string, source: input, description: "USDA-issued certificate number", constraints: "unique" }
      - { name: inspection_result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock timestamp at issuance" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of issuing ComplianceOfficer; must differ from lot.inspection_requested_by" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + CERT_VALIDITY_DAYS (14 days); shipping requires now < expires_at (strict)" }
      - { name: status, type: enum, source: system, description: "ISSUED | CONSUMED | REVOKED; a FAIL inspection creates the record directly in REVOKED status", default: ISSUED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Grower
    field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /packinghouse/growers/{id}/suspend"
        actor: PoolAccountant
        preconditions: []
        side_effects:
          - "Blocks new advances, deliveries, and caretaking orders for this grower (fiscal standing gate)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /packinghouse/growers/{id}/reinstate"
        actor: PoolAccountant
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /packinghouse/growers/{id}/terminate"
        actor: PoolAccountant
        preconditions:
          - "advance_outstanding_cents == 0"
          - "caretaking_balance_cents == 0"
        side_effects:
          - "Cancels all SCHEDULED CaretakingServiceOrder rows for the grower's groves"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /packinghouse/growers/{id}/terminate"
        actor: PoolAccountant
        preconditions:
          - "advance_outstanding_cents == 0"
          - "caretaking_balance_cents == 0"
        side_effects:
          - "Cancels all SCHEDULED CaretakingServiceOrder rows for the grower's groves"

  - entity: Grove
    field: lifecycle_status
    initial_state: PRODUCTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: PRODUCTIVE
        to: RETIRED
        trigger: "POST /packinghouse/groves/{id}/retire"
        actor: PackinghouseAdmin
        preconditions:
          - "No HarvestAssignment for this grove in SCHEDULED or IN_PROGRESS"
          - "No Delivery for this grove with processing_status in {RECEIVED, IN_DEGREENING, READY_TO_SORT}"
        side_effects:
          - "Cancels all SCHEDULED or REQUESTED CaretakingServiceOrder rows for the grove"
    note: "quarantine_posture is a computed field (see entities.Grove), not a stored machine state; every QuarantineOrder create/release recomputes it."

  - entity: MaturityTest
    field: status
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (creation of a newer MaturityTest for the same grove via POST /packinghouse/groves/{id}/maturity-tests)"
        actor: system
        preconditions: []
        side_effects:
          - "Prior CURRENT test becomes SUPERSEDED atomically with the new test's creation"
    note: "Validity is time-derived: a test is usable iff status == CURRENT and result == PASS and now < expires_at. There is no EXPIRED stored state."

  - entity: HarvestCrew
    field: status
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /packinghouse/crews/{id}/deactivate"
        actor: PackinghouseAdmin
        preconditions:
          - "No HarvestAssignment for this crew in SCHEDULED or IN_PROGRESS"
        side_effects: []

  - entity: HarvestAssignment
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /packinghouse/harvest-assignments/{id}/start"
        actor: FieldSupervisor
        preconditions:
          - "crew.status == ACTIVE"
          - "grove.lifecycle_status == PRODUCTIVE"
          - "grove.quarantine_posture == CLEAR"
          - "The grove's CURRENT MaturityTest has result == PASS and now < expires_at"
          - "window_start <= now < window_end"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /packinghouse/harvest-assignments/{id}/complete"
        actor: FieldSupervisor
        preconditions:
          - "1 <= actual_boxes <= ceil(planned_boxes * 1.25)"
        side_effects:
          - "Sets actual_boxes"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /packinghouse/harvest-assignments/{id}/cancel OR system (quarantine cascade / grove retirement)"
        actor: "FieldSupervisor or system"
        preconditions: []
        side_effects:
          - "Releases the crew's committed window capacity (derived crew load recomputed)"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /packinghouse/harvest-assignments/{id}/cancel"
        actor: FieldSupervisor
        preconditions:
          - "No Delivery references this assignment"
        side_effects:
          - "Releases the crew's committed window capacity (derived crew load recomputed)"

  - entity: Delivery
    field: processing_status
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: IN_DEGREENING
        trigger: "system (first DegreeningSession created for this delivery)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_DEGREENING
        to: READY_TO_SORT
        trigger: "system (sum of boxes over the delivery's sessions in {RELEASED, ABORTED} reaches delivery.net_boxes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: READY_TO_SORT
        trigger: "system (SortRun created for a delivery with requires_degreening == false)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY_TO_SORT
        to: SORTED
        trigger: "system (SortRun POSTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SORTED
        to: READY_TO_SORT
        trigger: "system (POSTED SortRun reversed via POST /packinghouse/sort-runs/{id}/reverse)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SORTED
        to: CLOSED
        trigger: "POST /packinghouse/deliveries/{id}/close"
        actor: LineOperator
        preconditions:
          - "delivery.pool.status in {PRICED, SETTLED}"
        side_effects: []

  - entity: Delivery
    field: regulatory_status
    initial_state: CLEAR
    terminal_states: [CONDEMNED]
    transitions:
      - from: CLEAR
        to: HELD
        trigger: "POST /packinghouse/deliveries/{id}/hold OR system (quarantine cascade on source grove)"
        actor: "ComplianceOfficer or system"
        preconditions: []
        side_effects:
          - "Blocks sort-run creation, verification, and posting while HELD"
      - from: HELD
        to: RELEASED
        trigger: "POST /packinghouse/deliveries/{id}/release OR system (quarantine release cascade when no other ACTIVE hold cause remains)"
        actor: "ComplianceOfficer or system"
        preconditions: []
        side_effects: []
      - from: HELD
        to: CONDEMNED
        trigger: "POST /packinghouse/deliveries/{id}/condemn"
        actor: ComplianceOfficer
        preconditions:
          - "delivery.processing_status != SORTED and != CLOSED"
        side_effects:
          - "Any SortRun for this delivery in OPEN or VERIFIED is auto-VOIDED"
          - "The auto-VOID does not touch pool totals (only POSTED runs contribute), but recomputes the delivery's sortable state"
    note: "processing_status and regulatory_status are PARALLEL dimensions: both evolve independently on the same row, and several operations guard on both (e.g., SortRun create requires processing in {RECEIVED, READY_TO_SORT} and regulatory in {CLEAR, RELEASED})."

  - entity: DegreeningRoom
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /packinghouse/degreening-rooms/{id}/enter-maintenance"
        actor: PackinghouseAdmin
        preconditions:
          - "No DegreeningSession in this room with status CONDITIONING"
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /packinghouse/degreening-rooms/{id}/exit-maintenance"
        actor: PackinghouseAdmin
        preconditions: []
        side_effects: []

  - entity: DegreeningSession
    field: status
    initial_state: CONDITIONING
    terminal_states: [RELEASED, ABORTED]
    transitions:
      - from: CONDITIONING
        to: RELEASED
        trigger: "POST /packinghouse/degreening-sessions/{id}/release"
        actor: "LineOperator, or QualityInspector when override_approved == true"
        preconditions:
          - "room.min_hours <= duration_hours <= room.max_hours, unless override_approved == true (QualityInspector only)"
          - "delivery.regulatory_status in {CLEAR, RELEASED}"
        side_effects:
          - "Sets released_at and duration_hours"
          - "If released+aborted boxes for the delivery reach net_boxes, delivery.processing_status -> READY_TO_SORT"
      - from: CONDITIONING
        to: ABORTED
        trigger: "POST /packinghouse/degreening-sessions/{id}/abort"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "Aborted boxes count toward the delivery's degreening completion (fruit proceeds to sorting without color add)"

  - entity: SortRun
    field: status
    initial_state: OPEN
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: OPEN
        to: VERIFIED
        trigger: "POST /packinghouse/sort-runs/{id}/verify"
        actor: QualityInspector
        preconditions:
          - "verified_by (X-User-ID) != created_by (segregation of duties)"
          - "delivery.regulatory_status in {CLEAR, RELEASED}"
        side_effects:
          - "Sets verified_by"
      - from: VERIFIED
        to: POSTED
        trigger: "POST /packinghouse/sort-runs/{id}/post"
        actor: LineOperator
        preconditions:
          - "delivery.regulatory_status in {CLEAR, RELEASED}"
          - "delivery.processing_status == READY_TO_SORT"
          - "delivery.pool.status == OPEN"
        side_effects:
          - "Runs packout_allocation; stores allocation lines, ge_boxes, proceeds_cents"
          - "delivery.processing_status -> SORTED; increments delivery.version"
          - "Decrements each touched AllocationChannel.remaining_boxes"
          - "Increments pool.posted_ge_boxes, pool.posted_proceeds_cents, pool.sorted_field_boxes; recomputes pool.provisional_price_cents_per_ge_box; increments pool.version"
      - from: OPEN
        to: VOIDED
        trigger: "POST /packinghouse/sort-runs/{id}/void OR system (delivery condemn cascade)"
        actor: "LineOperator or system"
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /packinghouse/sort-runs/{id}/void OR system (delivery condemn cascade)"
        actor: "LineOperator or system"
        preconditions: []
        side_effects: []
      - from: POSTED
        to: VOIDED
        trigger: "POST /packinghouse/sort-runs/{id}/reverse"
        actor: PoolAccountant
        preconditions:
          - "delivery.pool.status in {OPEN, INTAKE_CLOSED}"
        side_effects:
          - "Restores each touched AllocationChannel.remaining_boxes"
          - "Decrements pool.posted_ge_boxes, pool.posted_proceeds_cents, pool.sorted_field_boxes by exactly the amounts the post added; recomputes provisional price; increments pool.version"
          - "delivery.processing_status -> READY_TO_SORT; increments delivery.version"

  - entity: Pool
    field: status
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: INTAKE_CLOSED
        trigger: "POST /packinghouse/pools/{id}/close-intake"
        actor: PoolAccountant
        preconditions:
          - "No delivery with pool_id == pool.id, processing_status in {RECEIVED, IN_DEGREENING, READY_TO_SORT}, and regulatory_status != CONDEMNED"
        side_effects: []
      - from: INTAKE_CLOSED
        to: PRICED
        trigger: "POST /packinghouse/pools/{id}/set-price"
        actor: PoolAccountant
        preconditions:
          - "expected_pool_version == pool.version (OCC)"
        side_effects:
          - "Computes final_price_cents_per_ge_box per pool_final_price; increments pool.version"
      - from: PRICED
        to: PRICED
        trigger: "POST /packinghouse/pools/{id}/set-price (re-price)"
        actor: PoolAccountant
        preconditions:
          - "expected_pool_version == pool.version (OCC)"
        side_effects:
          - "Recomputes final_price_cents_per_ge_box; increments pool.version"
      - from: PRICED
        to: SETTLED
        trigger: "POST /packinghouse/pools/{id}/settle"
        actor: PoolAccountant
        preconditions: []
        side_effects:
          - "Runs settlement_waterfall for every grower with posted ge_boxes in the pool"
          - "Applies advance recoupment per each advance's recoup_policy, oldest issued_at ASC; advances fully recouped -> RECOUPED, partially -> PARTIALLY_RECOUPED"
          - "Decrements each grower's caretaking_balance_cents by the applied offset and advance_outstanding_cents by the recouped amount; increments each touched grower.version"

  - entity: AdvancePayment
    field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, RECOUPED, WRITTEN_OFF]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /packinghouse/advances/{id}/approve"
        actor: PoolAccountant
        preconditions:
          - "grower.status == ACTIVE"
          - "pool.status == OPEN"
          - "advance_cap_check passes: grower.advance_outstanding_cents + amount_cents <= cap"
        side_effects:
          - "Sets issued_at; increments grower.advance_outstanding_cents by amount_cents; increments grower.version"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /packinghouse/advances/{id}/deny"
        actor: PoolAccountant
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PARTIALLY_RECOUPED
        trigger: "system (pool settlement recoups less than outstanding)"
        actor: system
        preconditions: []
        side_effects:
          - "recouped_cents increased; outstanding_cents recomputed; grower.advance_outstanding_cents decremented by the recouped amount"
      - from: ISSUED
        to: RECOUPED
        trigger: "system (pool settlement recoups full outstanding)"
        actor: system
        preconditions: []
        side_effects:
          - "recouped_cents == amount_cents; grower.advance_outstanding_cents decremented accordingly"
      - from: PARTIALLY_RECOUPED
        to: RECOUPED
        trigger: "system (a later settlement finishes recoupment)"
        actor: system
        preconditions: []
        side_effects:
          - "recouped_cents == amount_cents"
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /packinghouse/advances/{id}/write-off"
        actor: PoolAccountant
        preconditions:
          - "The advance's pool is SETTLED"
        side_effects:
          - "written_off_cents = outstanding_cents; outstanding_cents -> 0; grower.advance_outstanding_cents decremented by the written-off amount"
      - from: PARTIALLY_RECOUPED
        to: WRITTEN_OFF
        trigger: "POST /packinghouse/advances/{id}/write-off"
        actor: PoolAccountant
        preconditions:
          - "The advance's pool is SETTLED"
        side_effects:
          - "written_off_cents = outstanding_cents; outstanding_cents -> 0"

  - entity: CaretakingServiceOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /packinghouse/caretaking-orders/{id}/schedule"
        actor: FieldSupervisor
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /packinghouse/caretaking-orders/{id}/complete"
        actor: FieldSupervisor
        preconditions: []
        side_effects:
          - "Computes rate_tier and line_amount_cents per caretaking_billing_rollup"
      - from: COMPLETED
        to: INVOICED
        trigger: "system (POST /packinghouse/caretaking-invoices/{id}/issue sweeps the order)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets invoice_id"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /packinghouse/caretaking-orders/{id}/cancel OR system (grower termination / grove retirement)"
        actor: "Grower (own grove), FieldSupervisor, or system"
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /packinghouse/caretaking-orders/{id}/cancel OR system (grower termination / grove retirement)"
        actor: "Grower (own grove), FieldSupervisor, or system"
        preconditions: []
        side_effects: []

  - entity: CaretakingInvoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /packinghouse/caretaking-invoices/{id}/issue"
        actor: PoolAccountant
        preconditions:
          - "grower.status != TERMINATED"
          - "line_order_ids is non-empty"
        side_effects:
          - "Each swept order: status COMPLETED -> INVOICED, invoice_id set"
          - "grower.caretaking_balance_cents += total_cents; increments grower.version"
      - from: DRAFT
        to: VOID
        trigger: "POST /packinghouse/caretaking-invoices/{id}/void"
        actor: PoolAccountant
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /packinghouse/caretaking-invoices/{id}/payments with amount_cents < total_cents - paid_cents"
        actor: "Grower (own invoice) or PoolAccountant"
        preconditions:
          - "0 < amount_cents <= total_cents - paid_cents"
        side_effects:
          - "paid_cents += amount_cents; grower.caretaking_balance_cents -= amount_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /packinghouse/caretaking-invoices/{id}/payments with amount_cents == total_cents - paid_cents"
        actor: "Grower (own invoice) or PoolAccountant"
        preconditions:
          - "0 < amount_cents <= total_cents - paid_cents"
        side_effects:
          - "paid_cents = total_cents; grower.caretaking_balance_cents -= amount_cents"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /packinghouse/caretaking-invoices/{id}/payments with amount_cents == total_cents - paid_cents"
        actor: "Grower (own invoice) or PoolAccountant"
        preconditions:
          - "0 < amount_cents <= total_cents - paid_cents"
        side_effects:
          - "paid_cents = total_cents; grower.caretaking_balance_cents -= amount_cents"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /packinghouse/caretaking-invoices/{id}/dispute"
        actor: "Grower (own invoice)"
        preconditions: []
        side_effects:
          - "grower.caretaking_balance_cents -= (total_cents - paid_cents); the disputed open amount is suspended from the balance"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /packinghouse/caretaking-invoices/{id}/reissue"
        actor: PoolAccountant
        preconditions:
          - "0 < adjusted_total_cents <= original total_cents"
          - "adjusted_total_cents >= paid_cents"
        side_effects:
          - "total_cents = adjusted_total_cents; grower.caretaking_balance_cents += (adjusted_total_cents - paid_cents) (revision loop: dispute/reissue may repeat)"

  - entity: QuarantineOrder
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /packinghouse/quarantine-orders/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "payload inspection_passed == true"
          - "released_by (X-User-ID) != issued_by (segregation of duties)"
        side_effects:
          - "Recomputes quarantine_posture of every affected grove (GROVE scope: that grove; COUNTY_ZONE scope: all groves in the county); a grove returns to CLEAR only when no other ACTIVE order covers it"
          - "Every delivery of an affected grove with regulatory_status == HELD transitions to RELEASED when its grove's posture becomes CLEAR and no other hold cause exists"
    note: "Creation (status becomes ACTIVE) fires the quarantine cascade: grove posture -> QUARANTINED, SCHEDULED HarvestAssignments of covered groves -> CANCELLED (which releases crew committed capacity), CLEAR deliveries of covered groves -> HELD."

  - entity: ExportLot
    field: status
    initial_state: BUILDING
    terminal_states: [SHIPPED, DIVERTED]
    transitions:
      - from: BUILDING
        to: INSPECTION_READY
        trigger: "POST /packinghouse/export-lots/{id}/request-inspection"
        actor: ComplianceOfficer
        preconditions:
          - "If destination_market == JAPAN: cold_treatment_hours >= COLD_TREATMENT_MIN_HOURS (24)"
          - "source grove quarantine_posture == CLEAR"
          - "If destination_market == JAPAN: no ACTIVE FRUIT_FLY QuarantineOrder covers the source grove or its county (export protocol)"
        side_effects:
          - "Sets inspection_requested_by = X-User-ID"
      - from: INSPECTION_READY
        to: CERTIFIED
        trigger: "POST /packinghouse/export-lots/{id}/phytosanitary-certificates with inspection_result == PASS"
        actor: ComplianceOfficer
        preconditions:
          - "issuer X-User-ID != lot.inspection_requested_by (segregation of duties)"
          - "source grove quarantine_posture == CLEAR (re-checked at certification)"
        side_effects:
          - "Certificate created ISSUED with expires_at = now + 14 days; lot.phyto_certificate_id set"
      - from: INSPECTION_READY
        to: REJECTED
        trigger: "POST /packinghouse/export-lots/{id}/phytosanitary-certificates with inspection_result == FAIL"
        actor: ComplianceOfficer
        preconditions:
          - "issuer X-User-ID != lot.inspection_requested_by (segregation of duties)"
        side_effects:
          - "Certificate record created directly in REVOKED status (failed inspection record)"
      - from: REJECTED
        to: BUILDING
        trigger: "POST /packinghouse/export-lots/{id}/rework"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Clears inspection_requested_by; optional cold_treatment_hours update applied (rework loop)"
      - from: CERTIFIED
        to: SHIPPED
        trigger: "POST /packinghouse/export-lots/{id}/ship"
        actor: ComplianceOfficer
        preconditions:
          - "lot.phyto_certificate_id references a certificate with status == ISSUED"
          - "now < certificate.expires_at (strict)"
        side_effects:
          - "Certificate -> CONSUMED"
      - from: BUILDING
        to: DIVERTED
        trigger: "POST /packinghouse/export-lots/{id}/divert"
        actor: ComplianceOfficer
        preconditions:
          - "lot.pool.status in {OPEN, INTAKE_CLOSED}"
          - "A JUICE AllocationChannel exists for the lot's variety and pool week"
        side_effects:
          - "diverted_to = JUICE; pool.posted_proceeds_cents adjusted by boxes * (juice price - export price) per export_diversion_credit; provisional price recomputed"
      - from: INSPECTION_READY
        to: DIVERTED
        trigger: "POST /packinghouse/export-lots/{id}/divert"
        actor: ComplianceOfficer
        preconditions:
          - "lot.pool.status in {OPEN, INTAKE_CLOSED}"
          - "A JUICE AllocationChannel exists for the lot's variety and pool week"
        side_effects:
          - "diverted_to = JUICE; pool proceeds adjusted per export_diversion_credit"
      - from: CERTIFIED
        to: DIVERTED
        trigger: "POST /packinghouse/export-lots/{id}/divert"
        actor: ComplianceOfficer
        preconditions:
          - "lot.pool.status in {OPEN, INTAKE_CLOSED}"
          - "A JUICE AllocationChannel exists for the lot's variety and pool week"
        side_effects:
          - "diverted_to = JUICE; attached certificate -> REVOKED; pool proceeds adjusted per export_diversion_credit"

  - entity: PhytosanitaryCertificate
    field: status
    initial_state: ISSUED
    terminal_states: [CONSUMED, REVOKED]
    transitions:
      - from: ISSUED
        to: CONSUMED
        trigger: "system (export lot shipped)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /packinghouse/phytosanitary-certificates/{id}/revoke OR system (lot diverted)"
        actor: "ComplianceOfficer or system"
        preconditions:
          - "Manual revoke: the lot is not SHIPPED"
        side_effects:
          - "If the lot was CERTIFIED, lot returns to INSPECTION_READY and phyto_certificate_id is cleared (must re-inspect)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: maturity-test-create-stale-grove
    parent_entity: Grove
    write_endpoint: "POST /packinghouse/groves/{grove_id}/maturity-tests"
    occ_field: "expected_grove_version"
    description: |
      Creating a MaturityTest supersedes the grove's CURRENT test and bumps
      grove.version. If the client's expected_grove_version is behind the
      grove's current version (e.g., another writer has just created a test
      that legitimately superseded the prior CURRENT one), the create is
      rejected as stale rather than silently superseding a test the caller
      never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: sort-run-create-stale-delivery
    parent_entity: Delivery
    write_endpoint: "POST /packinghouse/sort-runs"
    occ_field: "expected_delivery_version"
    description: |
      Creating a SortRun is the delivery's create-with-supersede operation:
      after a prior run is VOIDED a new run legitimately replaces it, and the
      create bumps delivery.version. A create carrying an
      expected_delivery_version older than the delivery's current version is
      rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pool-set-price-stale-pool
    parent_entity: Pool
    write_endpoint: "POST /packinghouse/pools/{pool_id}/set-price"
    occ_field: "expected_pool_version"
    description: |
      Setting (or re-setting) the pool's final price is legitimate from
      INTAKE_CLOSED or PRICED and bumps pool.version. A set-price carrying an
      expected_pool_version older than the pool's current version (e.g., a
      re-price landed after the caller's read) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: maturity_evaluation
    trigger: "On MaturityTest creation (POST /packinghouse/groves/{id}/maturity-tests)"
    algorithm: threshold
    formula: |
      ratio = round_half_up(brix / acid_pct, 2)          # round FIRST, compare SECOND
      mins  = VARIETY_MINIMUMS[grove.variety]
      result = PASS iff (ratio >= mins.min_ratio)
                   and (brix  >= mins.min_brix)
                   and (juice_pct >= mins.min_juice)
                   else FAIL
      expires_at = sampled_at + MATURITY_VALIDITY_HOURS hours
      A test is usable for harvest/receiving iff status == CURRENT and result == PASS
      and now < expires_at (strict inequality at the expiry instant).
    input_set: "The new MaturityTest's inputs plus the grove's variety"
    constants:
      MATURITY_VALIDITY_HOURS: 120
      VARIETY_MINIMUMS:
        HAMLIN:         { min_ratio: 9.0, min_brix: 8.5, min_juice: 42.0 }
        VALENCIA:       { min_ratio: 9.0, min_brix: 9.0, min_juice: 45.0 }
        RED_GRAPEFRUIT: { min_ratio: 7.0, min_brix: 8.0, min_juice: 38.0 }
        TANGERINE:      { min_ratio: 9.5, min_brix: 9.0, min_juice: 40.0 }
    precision: "ratio: 2 decimal places, round_half_up; comparisons applied to the ROUNDED ratio (>= is inclusive)"

  - name: ge_box_conversion
    trigger: "On SortRun creation and again at post (stored on SortRun.ge_boxes)"
    algorithm: weighted_scoring
    formula: |
      ge_boxes = round_half_up(
          fancy_boxes    * GE_WEIGHT_FANCY
        + choice_boxes   * GE_WEIGHT_CHOICE
        + standard_boxes * GE_WEIGHT_STANDARD
        + juice_boxes    * GE_WEIGHT_JUICE, 2)
      # cull_boxes contribute 0 and never enter ge.
      # Weights apply to MEASURED grades regardless of final fresh/juice diversion.
    input_set: "The SortRun's measured grade boxes"
    constants:
      GE_WEIGHT_FANCY: 1.15
      GE_WEIGHT_CHOICE: 1.0
      GE_WEIGHT_STANDARD: 0.9
      GE_WEIGHT_JUICE: 0.35
    precision: "2 decimal places, round_half_up"

  - name: packout_allocation
    trigger: "On SortRun post (POST /packinghouse/sort-runs/{id}/post)"
    algorithm: waterfall_allocation
    formula: |
      # Gate: if NOT sort_run.fresh_eligible, the ENTIRE fancy+choice+standard
      # volume is forced into the JUICE channel (fresh waterfall skipped).
      if fresh_eligible:
          channels = AllocationChannel where variety == delivery.variety
                     and week_start == pool.week_start and channel_type != JUICE
          order channels by priority_rank ASC, tie-break created_at ASC
          remaining = {FANCY: fancy_boxes, CHOICE: choice_boxes, STANDARD: standard_boxes}
          for ch in channels:                       # nested min per grade, in grade order
              for g in [FANCY, CHOICE, STANDARD]:
                  if g in ch.accepts_grades and ch.remaining_boxes > 0:
                      take = min(remaining[g], ch.remaining_boxes)   # exact-fit allowed
                      alloc += {channel_id: ch.id, grade: g, boxes: take}
                      remaining[g] -= take; ch.remaining_boxes -= take
          overflow_fresh = remaining[FANCY] + remaining[CHOICE] + remaining[STANDARD]
      else:
          overflow_fresh = fancy_boxes + choice_boxes + standard_boxes
      juice_channel = JUICE channel for (variety, week)  # MUST exist; else ERR_NO_JUICE_CHANNEL
      juice_channel receives overflow_fresh + juice_boxes
      cull_boxes receive no proceeds and go to no channel
      proceeds_cents = sum over allocation lines of boxes * channel.price_cents_per_box
    input_set: "The SortRun's measured boxes, fresh_eligible flag, all AllocationChannel rows matching (delivery.variety, pool.week_start)"
    constants:
      FRESH_COLOR_MIN: 6
      FRESH_DEFECT_MAX: 20
    precision: "integer boxes and cents; no rounding needed"
    variants:
      - name: fresh_first
        when: "fresh_eligible == true"
        difference: "Grade waterfall runs in priority order; only channel overflow is juiced"
      - name: juice_forced
        when: "fresh_eligible == false (color/defect failure or regulatory hold bypass attempt)"
        difference: "All fresh grades diverted to JUICE at juice price; non-JUICE channels untouched"

  - name: pool_provisional_price
    trigger: "Recomputed on every mutation that touches the pool: sort-run post, sort-run reverse, export-lot divert; also readable any time"
    algorithm: forward_looking
    formula: |
      finite_channels = AllocationChannel for (pool.variety, pool.week_start) with channel_type != JUICE
      projected_proceeds = pool.posted_proceeds_cents
                           + FILL_ASSUMPTION * sum(ch.remaining_boxes * ch.price_cents_per_box)
      projected_ge       = pool.posted_ge_boxes
                           + FILL_ASSUMPTION * sum(ch.remaining_boxes)
      provisional_price  = round_half_up(projected_proceeds / max(projected_ge, 1), 0)
      # JUICE channels are uncapped and excluded from the projection.
    input_set: "Pool totals (posted runs only) plus finite-capacity channels of the pool's variety+week"
    constants:
      FILL_ASSUMPTION: 0.8
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Pool in OPEN or INTAKE_CLOSED; used for advance caps and grower estimates"
        difference: "Forward-looking; includes projected fill of remaining channel capacity and NO packing charge"
      - name: final
        when: "Pool PRICED via set-price"
        difference: "Actuals only (posted proceeds, no projection) minus tiered packing charge; see pool_final_price"

  - name: pool_final_price
    trigger: "On POST /packinghouse/pools/{id}/set-price"
    algorithm: tiered_pricing
    formula: |
      # Tiered packing charge keyed on TOTAL sorted field boxes (not ge boxes):
      charge_rate = 150 if sorted_field_boxes <  TIER1_MAX
                    140 if TIER1_MAX <= sorted_field_boxes < TIER2_MAX
                    125 if sorted_field_boxes >= TIER2_MAX        # tier edges are inclusive-low
      packing_charge_total = sorted_field_boxes * charge_rate
      final_price = round_half_up(
          (posted_proceeds_cents - packing_charge_total) / max(posted_ge_boxes, 1), 0)
      # final uses ACTUALS ONLY: no FILL_ASSUMPTION projection, unlike the provisional variant.
    input_set: "Pool posted aggregates at pricing time"
    constants:
      TIER1_MAX: 10000
      TIER2_MAX: 50000
    precision: "integer cents, round_half_up"

  - name: settlement_waterfall
    trigger: "On POST /packinghouse/pools/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      # Per grower with posted_ge > 0 in this pool. Evaluation order is PINNED because
      # the terms are mutually dependent (offset capped by share; recoup from residual):
      for each grower g (ordered by grower.created_at ASC):
          share  = round_half_up(g.posted_ge_in_pool * pool.final_price_cents_per_ge_box, 0)
          offset = min(g.caretaking_balance_cents,
                       round_half_up(CARETAKING_OFFSET_CAP_PCT * share, 0))   # step 2 depends on step 1
          residual = share - offset
          # step 3: recoup advances, oldest issued_at ASC, per advance policy
          for adv in g's advances on this pool in {ISSUED, PARTIALLY_RECOUPED}, order issued_at ASC, tie-break created_at ASC:
              if adv.recoup_policy == NEXT_SETTLEMENT_FULL: cap_adv = adv.outstanding_cents
              if adv.recoup_policy == PRO_RATA_THIRDS:      cap_adv = round_half_up(adv.amount_cents / 3, 0)
              recoup = min(adv.outstanding_cents, cap_adv, residual)
              residual -= recoup; adv.recouped_cents += recoup; advance status updated
          paid = residual                                       # step 4
      # grower payable = paid; caretaking_balance -= offset; advance_outstanding -= sum(recoup)
    input_set: "Growers with posted ge_boxes in the pool, their caretaking balances, and their pool advances in {ISSUED, PARTIALLY_RECOUPED}"
    constants:
      CARETAKING_OFFSET_CAP_PCT: 0.5
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: next_settlement_full
        when: "AdvancePayment.recoup_policy == NEXT_SETTLEMENT_FULL"
        difference: "Entire outstanding recouped from the residual at the next settlement"
      - name: pro_rata_thirds
        when: "AdvancePayment.recoup_policy == PRO_RATA_THIRDS"
        difference: "At most round_half_up(amount/3) recouped per settlement; identical inputs yield a smaller recoupment and a larger grower payment"

  - name: advance_cap_check
    trigger: "On POST /packinghouse/advances/{id}/approve"
    algorithm: threshold
    formula: |
      grower_pool_ge = sum of ge_boxes of POSTED sort runs whose delivery.grove.grower_id == grower
                       and delivery.pool_id == advance.pool_id
      projected_value_cents = grower_pool_ge * pool.provisional_price_cents_per_ge_box
      cap = round_half_up(ADVANCE_CAP_PCT * projected_value_cents, 0)
      approve allowed iff grower.advance_outstanding_cents + amount_cents <= cap   # inclusive boundary
    input_set: "Grower's posted ge in the advance's pool and the pool's current provisional price"
    constants:
      ADVANCE_CAP_PCT: 0.60
    precision: "integer cents, round_half_up; boundary is inclusive (<=)"

  - name: caretaking_billing_rollup
    trigger: "Line amount on CaretakingServiceOrder complete; invoice total on CaretakingInvoice creation"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (mode: round per component, per line, THEN sum):
      tier = SMALL if grove.acreage < 40 else MEDIUM if grove.acreage <= 120 else LARGE
      rate = RATE_CENTS_PER_ACRE[service_type][tier]
      labor_component     = round_half_up(acres_treated * rate, 0)
      chemical_component  = round_half_up(chemical_cost_cents * (1 + CHEMICAL_MARKUP_PCT), 0)  # SPRAY only
      line_amount_cents   = labor_component + chemical_component
      invoice.total_cents = sum(line_amount_cents over swept orders)   # sum of rounded lines; no re-round
    input_set: "The completed order (line) / the grower's COMPLETED uninvoiced orders with service_date inside the invoice period (rollup)"
    constants:
      CHEMICAL_MARKUP_PCT: 0.12
      RATE_CENTS_PER_ACRE:
        SPRAY:     { SMALL: 4200, MEDIUM: 3900, LARGE: 3500 }
        FERTILIZE: { SMALL: 3800, MEDIUM: 3500, LARGE: 3100 }
        PRUNE:     { SMALL: 5500, MEDIUM: 5200, LARGE: 4800 }
        MOW:       { SMALL: 1800, MEDIUM: 1700, LARGE: 1500 }
    precision: "integer cents; each component rounded half-up to whole cents BEFORE summation"

  - name: crew_window_capacity_check
    trigger: "On HarvestAssignment creation"
    algorithm: threshold
    formula: |
      window_days = ceil((window_end - window_start) / 24h)      # 25h window counts as 2 days
      capacity    = crew.daily_capacity_boxes * window_days
      create allowed iff planned_boxes <= capacity               # exact-fit allowed
    input_set: "The crew and the requested window"
    constants: {}
    precision: "integer boxes"

  - name: crew_overlap_check
    trigger: "On HarvestAssignment creation"
    algorithm: interval_merge
    formula: |
      # EXCLUSIVE half-open occupancy on the crew resource:
      # conflict iff new.window_start < existing.window_end AND existing.window_start < new.window_end
      # over the crew's assignments in {SCHEDULED, IN_PROGRESS}.
      # Adjacent windows (new.window_start == existing.window_end) do NOT conflict.
    input_set: "The crew's SCHEDULED and IN_PROGRESS assignments"
    constants: {}
    precision: "datetime comparison, half-open [start, end)"

  - name: degreening_capacity_check
    trigger: "On DegreeningSession creation"
    algorithm: interval_merge
    formula: |
      # AGGREGATE-CAPACITY overlap semantics (unlike the crew's exclusive occupancy):
      # the new session reserves [now, now + planned_hours). Reject iff there EXISTS an
      # instant t in that interval where sum(boxes of CONDITIONING sessions whose
      # [started_at, started_at + planned_hours) covers t) + new.boxes > room.capacity_boxes.
      # Equality at every instant is allowed (<= capacity).
      # Sessions in RELEASED or ABORTED never occupy.
    input_set: "CONDITIONING sessions of the room"
    constants: {}
    precision: "integer boxes; datetime intervals half-open"

  - name: export_diversion_credit
    trigger: "On POST /packinghouse/export-lots/{id}/divert"
    algorithm: aggregation
    formula: |
      juice_channel = JUICE AllocationChannel for (lot.variety, lot.pool.week_start)   # else ERR_NO_JUICE_CHANNEL
      export_price  = lot.source_channel.price_cents_per_box
      pool.posted_proceeds_cents += lot.boxes * (juice_channel.price_cents_per_box - export_price)
      # posted_ge_boxes is UNCHANGED by diversion (ge measures fruit, not destination)
      recompute pool.provisional_price_cents_per_ge_box
    input_set: "The diverted lot, its source channel, and the matching juice channel"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Grower-role ownership: X-User-ID must equal the target grower's id (or the owning grower of the target grove/invoice/advance)"
    error_id: ERR_GROWER_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Grower-accessible endpoints: GET /packinghouse/growers/{id}, POST /packinghouse/advances, POST /packinghouse/caretaking-orders, POST /packinghouse/caretaking-invoices/{id}/payments, POST /packinghouse/caretaking-invoices/{id}/dispute, POST /packinghouse/caretaking-orders/{id}/cancel"
  - priority: 4
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Request body well-formed: required fields present, types valid, enum members valid, numeric ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "Target resource's current state permits the requested transition (includes OCC expected_*_version match, evaluated here as ERR_STALE_VERSION)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Regulatory gates: grove quarantine_posture must be CLEAR where required (ERR_GROVE_QUARANTINED); grove must be PRODUCTIVE (ERR_GROVE_RETIRED); delivery regulatory_status must not be HELD/CONDEMNED where required (ERR_DELIVERY_REGULATORY_HOLD); segregation-of-duties identity pairs must differ (ERR_SEGREGATION_OF_DUTIES); export protocol gates (ERR_COLD_TREATMENT_INSUFFICIENT, ERR_FRUIT_FLY_PROTOCOL_BLOCK) also live in this tier, and for JAPAN export-lot transitions ERR_FRUIT_FLY_PROTOCOL_BLOCK is evaluated BEFORE the generic ERR_GROVE_QUARANTINED posture gate"
    error_id: ERR_GROVE_QUARANTINED
    http_status: 422
    applies_to: "assignment create/start, delivery create, degreening session create/release, export-lot create/request-inspection/certify, quarantine release, phyto certificate create, sort-run verify"
  - priority: 8
    category: business_safety
    check: "Maturity gates: grove has a CURRENT maturity test (ERR_MATURITY_TEST_REQUIRED), its result is PASS (ERR_MATURITY_NOT_PASSING)"
    error_id: ERR_MATURITY_TEST_REQUIRED
    http_status: 422
    applies_to: "assignment start, delivery create"
  - priority: 9
    category: business_constraint
    check: "Uniqueness and set constraints: grower_code/block_code/crew_code/room_code/channel_code/certificate_number unique; pool (variety, week_start) unique; at most one non-VOIDED SortRun per delivery (ERR_SORT_RUN_ALREADY_ACTIVE)"
    error_id: ERR_DUPLICATE_ENTITY
    http_status: 409
    applies_to: "create endpoints"
  - priority: 10
    category: business_constraint
    check: "Capacity constraints: crew window capacity (ERR_CREW_CAPACITY_EXCEEDED), crew half-open overlap (ERR_CREW_WINDOW_OVERLAP), room aggregate capacity (ERR_ROOM_CAPACITY_EXCEEDED), sort grade sum equals delivery.net_boxes (ERR_SORT_BOX_MISMATCH), export lot boxes <= channel export-available (ERR_CHANNEL_CAPACITY_EXCEEDED), acres_treated <= grove.acreage (ERR_ACRES_EXCEED_GROVE), chemical_cost only for SPRAY (ERR_CHEMICAL_COST_NOT_ALLOWED)"
    error_id: ERR_CREW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "create/complete endpoints with quantity semantics"
  - priority: 11
    category: business_temporal
    check: "Time-window gates: maturity test unexpired (ERR_MATURITY_TEST_EXPIRED), assignment window open (ERR_ASSIGNMENT_WINDOW_NOT_OPEN), degreening duration within [min_hours, max_hours] unless override (ERR_DEGREENING_DURATION_OUT_OF_BOUNDS), certificate unexpired at ship (ERR_CERT_EXPIRED)"
    error_id: ERR_MATURITY_TEST_EXPIRED
    http_status: 422
    applies_to: "time-gated action endpoints"
  - priority: 12
    category: business_fiscal
    check: "Fiscal gates: grower.status == ACTIVE where value is extended (ERR_GROWER_NOT_ACTIVE); advance cap (ERR_ADVANCE_CAP_EXCEEDED); invoice payment amount within remaining balance (ERR_INVOICE_OVERPAYMENT, ERR_PAYMENT_AMOUNT_INVALID)"
    error_id: ERR_GROWER_NOT_ACTIVE
    http_status: 409
    applies_to: "advance approve, delivery create, caretaking order create, invoice payments"
  - priority: 13
    category: business_referential
    check: "Referenced-entity coherence: channel variety/market/week match (ERR_CHANNEL_MISMATCH), assignment IN_PROGRESS for deliveries (ERR_ASSIGNMENT_NOT_ACTIVE), JUICE channel present for post/divert (ERR_NO_JUICE_CHANNEL), grove enrolled for caretaking orders (ERR_CARETAKING_NOT_ENROLLED), degreening-required variety must be READY_TO_SORT via sessions (ERR_DEGREENING_REQUIRED), pool OPEN where intake occurs (ERR_POOL_NOT_ACCEPTING)"
    error_id: ERR_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "endpoints with cross-referenced entities"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Role shorthand note: every endpoint lists its roles explicitly.
# "Grower" on a read/self-service endpoint is always ownership-scoped (§1.4 pri 3).
endpoints:
  # --- logical clock (test-driving; default startup time is fixed) ---
  - method: POST
    path: /packinghouse/_clock/set_current_utc
    description: "Sets the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. All timestamped logic (maturity expiry, certificate expiry, degreening duration, assignment windows, pool weeks) reads this clock."
    roles: [PackinghouseAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Growers ---
  - method: POST
    path: /packinghouse/growers
    description: "Onboard a grower"
    roles: [PackinghouseAdmin]
    code: 201
    input: [grower_code, display_name]
    output: Grower
    side_effects: []
  - method: GET
    path: /packinghouse/growers
    description: "List growers"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Grower[]
    side_effects: []
  - method: GET
    path: /packinghouse/growers/{id}
    description: "Get one grower; Grower role may read only its own id"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer, Grower]
    code: 200
    input: []
    output: Grower
    side_effects: []
  - method: POST
    path: /packinghouse/growers/{id}/suspend
    description: "Suspend a grower (fiscal standing gate)"
    roles: [PoolAccountant]
    code: 200
    input: []
    output: Grower
    side_effects: ["Grower ACTIVE -> SUSPENDED; increments grower.version"]
  - method: POST
    path: /packinghouse/growers/{id}/reinstate
    description: "Reinstate a suspended grower"
    roles: [PoolAccountant]
    code: 200
    input: []
    output: Grower
    side_effects: ["Grower SUSPENDED -> ACTIVE; increments grower.version"]
  - method: POST
    path: /packinghouse/growers/{id}/terminate
    description: "Terminate a grower with zero outstanding advances and zero caretaking balance"
    roles: [PoolAccountant]
    code: 200
    input: []
    output: Grower
    side_effects: ["Grower -> TERMINATED; cancels SCHEDULED/REQUESTED caretaking orders of the grower's groves; increments grower.version"]

  # --- Groves ---
  - method: POST
    path: /packinghouse/groves
    description: "Register a grove under a grower"
    roles: [PackinghouseAdmin]
    code: 201
    input: [grower_id, block_code, variety, acreage, county_code, "caretaking_enrolled?"]
    output: Grove
    side_effects: []
  - method: GET
    path: /packinghouse/groves
    description: "List groves; Grower role is scoped to its own groves"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer, Grower]
    code: 200
    input: ["grower_id?", "variety?", "quarantine_posture?", "lifecycle_status?", "limit?", "offset?"]
    output: Grove[]
    side_effects: []
  - method: GET
    path: /packinghouse/groves/{id}
    description: "Get one grove"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer, Grower]
    code: 200
    input: []
    output: Grove
    side_effects: []
  - method: POST
    path: /packinghouse/groves/{id}/retire
    description: "Retire a grove"
    roles: [PackinghouseAdmin]
    code: 200
    input: []
    output: Grove
    side_effects: ["Grove PRODUCTIVE -> RETIRED; cancels REQUESTED/SCHEDULED caretaking orders; increments grove.version"]

  # --- Maturity tests ---
  - method: POST
    path: /packinghouse/groves/{grove_id}/maturity-tests
    description: "Record a maturity test for a grove; supersedes the grove's CURRENT test (OCC on grove.version)"
    roles: [QualityInspector]
    code: 201
    input: [sampled_at, brix, acid_pct, juice_pct, expected_grove_version]
    output: MaturityTest
    side_effects: ["Prior CURRENT test -> SUPERSEDED; computes ratio/result/expires_at; increments grove.version"]
  - method: GET
    path: /packinghouse/groves/{id}/maturity-tests
    description: "List maturity tests of a grove, newest first"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: MaturityTest[]
    side_effects: []
  - method: GET
    path: /packinghouse/maturity-tests/{id}
    description: "Get one maturity test"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer]
    code: 200
    input: []
    output: MaturityTest
    side_effects: []

  # --- Harvest crews ---
  - method: POST
    path: /packinghouse/crews
    description: "Register a harvest crew"
    roles: [PackinghouseAdmin]
    code: 201
    input: [crew_code, daily_capacity_boxes]
    output: HarvestCrew
    side_effects: []
  - method: GET
    path: /packinghouse/crews
    description: "List crews"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HarvestCrew[]
    side_effects: []
  - method: GET
    path: /packinghouse/crews/{id}
    description: "Get one crew"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer]
    code: 200
    input: []
    output: HarvestCrew
    side_effects: []
  - method: POST
    path: /packinghouse/crews/{id}/deactivate
    description: "Deactivate a crew with no open assignments"
    roles: [PackinghouseAdmin]
    code: 200
    input: []
    output: HarvestCrew
    side_effects: ["Crew ACTIVE -> INACTIVE; increments crew.version"]

  # --- Harvest assignments ---
  - method: POST
    path: /packinghouse/harvest-assignments
    description: "Schedule a crew on a grove for a half-open window"
    roles: [FieldSupervisor]
    code: 201
    input: [crew_id, grove_id, window_start, window_end, planned_boxes]
    output: HarvestAssignment
    side_effects: []
  - method: GET
    path: /packinghouse/harvest-assignments
    description: "List assignments"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer]
    code: 200
    input: ["crew_id?", "grove_id?", "status?", "limit?", "offset?"]
    output: HarvestAssignment[]
    side_effects: []
  - method: GET
    path: /packinghouse/harvest-assignments/{id}
    description: "Get one assignment"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer]
    code: 200
    input: []
    output: HarvestAssignment
    side_effects: []
  - method: POST
    path: /packinghouse/harvest-assignments/{id}/start
    description: "Start a scheduled assignment (maturity + quarantine + window gates)"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: HarvestAssignment
    side_effects: ["Assignment SCHEDULED -> IN_PROGRESS; increments assignment.version"]
  - method: POST
    path: /packinghouse/harvest-assignments/{id}/complete
    description: "Complete an in-progress assignment with actual boxes"
    roles: [FieldSupervisor]
    code: 200
    input: [actual_boxes]
    output: HarvestAssignment
    side_effects: ["Assignment IN_PROGRESS -> COMPLETED; sets actual_boxes; increments assignment.version"]
  - method: POST
    path: /packinghouse/harvest-assignments/{id}/cancel
    description: "Cancel a scheduled (or unstarted in-progress) assignment"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: HarvestAssignment
    side_effects: ["Assignment -> CANCELLED; crew committed capacity released; increments assignment.version"]

  # --- Deliveries ---
  - method: POST
    path: /packinghouse/deliveries
    description: "Receive a truckload of fruit at the packinghouse; resolves pool by variety + week of received_at"
    roles: [FieldSupervisor]
    code: 201
    input: [grove_id, assignment_id, gross_boxes, tare_boxes]
    output: Delivery
    side_effects: ["Delivery created RECEIVED/CLEAR with net_boxes computed; pool_id resolved to the OPEN pool"]
  - method: GET
    path: /packinghouse/deliveries
    description: "List deliveries"
    roles: [PackinghouseAdmin, PoolAccountant, FieldSupervisor, QualityInspector, LineOperator, ComplianceOfficer]
    code: 200
