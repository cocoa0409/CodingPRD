scenario: |
  Open Source License Compliance (software company open source office): dependency scanning & bill-of-materials generation, license identification & policy classification (permissive/copyleft), obligation determination (attribution/source disclosure) by distribution mode, approval workflow for restricted licenses, notice file generation & release gating, vulnerability & license change monitoring, remediation/replacement tracking, M&A code audit response

domain_name: open-source-license-compliance
api_prefix: /oss-products

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - selector_policy

  entity_topology: hierarchical
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code (e.g., CRM-SUITE)" }
      - { name: product_name, type: string, source: input, description: "Human-readable product name" }
      - { name: distribution_model, type: enum, source: input, description: "SaaS | ON_PREMISE | EMBEDDED | MOBILE_APP — determines obligation scope" }
      - { name: compliance_posture, type: enum, source: system, description: "COMPLIANT | AT_RISK | BLOCKED — derived from open findings, pending approvals, unresolved violations" }
      - { name: posture_version, type: integer, source: system, default: 1, description: "Monotonic version for OCC on posture changes" }
      - { name: total_dependency_count, type: integer, source: computed, description: "Count of resolved dependencies in current BOM" }
      - { name: copyleft_dependency_count, type: integer, source: computed, description: "Count of dependencies with copyleft licenses in current BOM" }
      - { name: restricted_dependency_count, type: integer, source: computed, description: "Count of dependencies with restricted licenses pending approval" }
      - { name: high_severity_vulnerability_count, type: integer, source: computed, description: "Count of open HIGH/CRITICAL vulnerabilities across all components" }

  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: package_url, type: string, source: input, description: "PURL identifier (e.g., pkg:npm/lodash@4.17.21)" }
      - { name: component_name, type: string, source: input, description: "Package name" }
      - { name: version, type: string, source: input, description: "Package version" }
      - { name: declared_license_spdx, type: string, source: input, description: "SPDX identifier from package metadata" }
      - { name: discovered_license_spdx, type: string, source: computed, description: "License discovered by deep scan; null until scan completes" }
      - { name: license_policy_classification, type: enum, source: computed, description: "PERMISSIVE | WEAK_COPYLEFT | STRONG_COPYLEFT | RESTRICTED | PROHIBITED" }
      - { name: policy_override_classification, type: enum, source: input, description: "Manual override of classification; requires LegalCounsel" }
      - { name: effective_classification, type: enum, source: computed, description: "policy_override_classification if set else license_policy_classification" }
      - { name: source_download_url, type: string, source: input, description: "URL to source archive for copyleft compliance" }
      - { name: copyright_notice, type: string, source: input, description: "Copyright attribution text" }

  - name: DependencyScan
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: scan_tool, type: enum, source: input, description: "SYFT | ORT | SCANCODE | FOSSOLOGY | COMMERCIAL_VENDOR_X" }
      - { name: scan_scope, type: enum, source: input, description: "FULL | INCREMENTAL | TRANSITIVE | DIRECT_ONLY" }
      - { name: status, type: enum, source: system, description: "QUEUED → PARSING → RESOLVING → SCANNING_LICENSES → SCORING → COMPLETED / FAILED / CANCELLED" }
      - { name: raw_manifest_hash, type: string, source: system, description: "SHA-256 of input manifest for idempotency" }
      - { name: components_discovered, type: integer, source: computed, description: "Count of components found" }
      - { name: components_resolved, type: integer, source: computed, description: "Count successfully resolved to Component records" }
      - { name: license_scan_coverage_pct, type: number, source: computed, description: "Percent of resolved components with discovered_license_spdx populated" }

  - name: BillOfMaterials
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: scan_id, type: string, source: system, description: "FK -> DependencyScan.id — scan that produced this BOM" }
      - { name: version_label, type: string, source: input, description: "Release version this BOM covers (e.g., 2.4.0-rc1)" }
      - { name: status, type: enum, source: system, description: "DRAFT → FINALIZED → SUPERSEDED | ARCHIVED" }
      - { name: bom_posture, type: enum, source: computed, description: "GREEN | YELLOW | RED — derived from component classifications and open findings" }
      - { name: total_components, type: integer, source: computed, description: "Count of BOM entries" }
      - { name: copyleft_components, type: integer, source: computed, description: "Count of WEAK_COPYLEFT + STRONG_COPYLEFT entries" }
      - { name: restricted_components, type: integer, source: computed, description: "Count of RESTRICTED entries" }
      - { name: prohibited_components, type: integer, source: computed, description: "Count of PROHIBITED entries" }
      - { name: notice_file_generated, type: boolean, source: computed, description: "Whether NOTICE file has been generated for this BOM" }
      - { name: notice_file_hash, type: string, source: computed, description: "SHA-256 of generated NOTICE file" }

  - name: BomEntry
    parent: BillOfMaterials
    common_fields: true
    fields:
      - { name: bom_id, type: string, source: system, description: "FK -> BillOfMaterials.id" }
      - { name: component_id, type: string, source: system, description: "FK -> Component.id" }
      - { name: dependency_scope, type: enum, source: input, description: "RUNTIME | BUILD_TIME | TEST | OPTIONAL | DEV" }
      - { name: is_direct, type: boolean, source: input, description: "True if direct dependency, false if transitive" }
      - { name: dependency_depth, type: integer, source: computed, description: "Depth in dependency tree (0 = direct)" }
      - { name: parent_entry_id, type: string, source: system, description: "FK -> BomEntry.id (self-referential for transitive chains); null for direct" }
      - { name: obligation_determination, type: enum, source: computed, description: "NONE | ATTRIBUTION_ONLY | SOURCE_DISCLOSURE | FULL_SOURCE_DISCLOSURE | PROHIBITED_USE" }
      - { name: obligation_fulfilled, type: boolean, source: computed, default: false, description: "Whether all obligations for this entry are fulfilled" }
      - { name: vulnerability_severity_max, type: enum, source: computed, description: "NONE | LOW | MEDIUM | HIGH | CRITICAL — max severity of open vulnerabilities" }

  - name: LicenseApprovalRequest
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: component_id, type: string, source: system, description: "FK -> Component.id" }
      - { name: bom_entry_id, type: string, source: system, description: "FK -> BomEntry.id that triggered this request" }
      - { name: request_reason, type: string, source: input, description: "Business justification for using restricted/prohibited component" }
      - { name: risk_acknowledgment, type: boolean, source: input, description: "Requester acknowledges legal risk" }
      - { name: status, type: enum, source: system, description: "PENDING → LEGAL_REVIEW → ENGINEERING_REVIEW → APPROVED / REJECTED / EXPIRED / WITHDRAWN" }
      - { name: legal_reviewer_id, type: string, source: system, description: "User ID of assigned legal reviewer" }
      - { name: engineering_reviewer_id, type: string, source: system, description: "User ID of assigned engineering reviewer" }
      - { name: legal_decision, type: enum, source: system, description: "PENDING | APPROVE | REJECT | CONDITIONAL" }
      - { name: legal_conditions, type: string, source: system, description: "Conditions attached to legal approval" }
      - { name: engineering_decision, type: enum, source: system, description: "PENDING | APPROVE | REJECT" }
      - { name: final_decision, type: enum, source: computed, description: "APPROVED | REJECTED | EXPIRED — derived from legal + engineering" }
      - { name: decision_effective_at, type: datetime, source: system, description: "When final decision became effective" }
      - { name: expiry_at, type: datetime, source: system, description: "Approval validity expiry (90 days from approval)" }

  - name: ObligationTicket
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: bom_entry_id, type: string, source: system, description: "FK -> BomEntry.id" }
      - { name: obligation_type, type: enum, source: system, description: "ATTRIBUTION | SOURCE_OFFER | SOURCE_DELIVERY | LICENSE_TEXT | NOTICE_FILE | COPYLEFT_COMPLIANCE" }
      - { name: due_at, type: datetime, source: system, description: "Deadline for fulfillment (release date minus buffer)" }
      - { name: status, type: enum, source: system, description: "OPEN → IN_PROGRESS → FULFILLED / WAIVED / OVERDUE" }
      - { name: fulfillment_evidence_uri, type: string, source: input, description: "URI to evidence of fulfillment" }
      - { name: waiver_reason, type: string, source: input, description: "Reason for waiving obligation (requires LegalCounsel)" }
      - { name: waived_by, type: string, source: system, description: "User ID who waived" }

  - name: Vulnerability
    parent: null
    common_fields: true
    fields:
      - { name: cve_id, type: string, source: input, description: "CVE identifier (e.g., CVE-2024-12345)" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: cvss_score, type: number, source: input, description: "CVSS v3.1 base score 0.0-10.0" }
      - { name: published_at, type: datetime, source: input, description: "When CVE was published" }
      - { name: affected_package_url, type: string, source: input, description: "PURL pattern of affected component" }
      - { name: fixed_in_version, type: string, source: input, description: "First fixed version, null if unfixed" }
      - { name: license_change_flag, type: boolean, source: input, description: "True if this CVE accompanies a license change in the fixed version" }
      - { name: new_license_spdx, type: string, source: input, description: "New license in fixed version if license_change_flag" }

  - name: VulnerabilityFinding
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: bom_entry_id, type: string, source: system, description: "FK -> BomEntry.id" }
      - { name: vulnerability_id, type: string, source: system, description: "FK -> Vulnerability.id" }
      - { name: detected_at, type: datetime, source: system, description: "When finding was created" }
      - { name: status, type: enum, source: system, description: "OPEN → CONFIRMED → MITIGATED / REMEDIATED / FALSE_POSITIVE / WONT_FIX" }
      - { name: remediation_deadline, type: datetime, source: computed, description: "SLA deadline based on severity: CRITICAL=7d, HIGH=30d, MEDIUM=90d, LOW=180d" }
      - { name: remediation_component_id, type: string, source: system, description: "FK -> Component.id — replacement component selected for remediation" }
      - { name: remediation_status, type: enum, source: system, description: "NOT_STARTED | IN_PROGRESS | VERIFIED | FAILED" }
      - { name: verification_evidence_uri, type: string, source: input, description: "URI proving remediation verified" }

  - name: ReleaseGate
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: bom_id, type: string, source: system, description: "FK -> BillOfMaterials.id — BOM this gate evaluates" }
      - { name: release_version, type: string, source: input, description: "Version intended for release" }
      - { name: gate_status, type: enum, source: system, description: "OPEN → EVALUATING → PASSED / FAILED / BYPASSED / EXPIRED" }
      - { name: evaluation_result, type: enum, source: computed, description: "PASS | FAIL | CONDITIONAL_PASS" }
      - { name: blocking_findings_count, type: integer, source: computed, description: "Count of open CRITICAL vulnerabilities + PROHIBITED components" }
      - { name: warning_findings_count, type: integer, source: computed, description: "Count of open HIGH vulnerabilities + RESTRICTED pending approval" }
      - { name: notice_file_attached, type: boolean, source: computed, description: "Whether NOTICE file for this BOM is attached" }
      - { name: obligations_fulfilled_pct, type: number, source: computed, description: "Percentage of ObligationTickets in FULFILLED or WAIVED status" }
      - { name: bypass_reason, type: string, source: input, description: "Reason for emergency bypass (requires CISO approval)" }
      - { name: bypass_approved_by, type: string, source: system, description: "User ID of CISO approving bypass" }
      - { name: evaluation_expires_at, type: datetime, source: system, description: "When evaluation becomes stale (30 days)" }

  - name: RemediationPlan
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: finding_id, type: string, source: system, description: "FK -> VulnerabilityFinding.id" }
      - { name: plan_type, type: enum, source: input, description: "UPGRADE | REPLACE | PATCH | MITIGATE_CONFIG | ACCEPT_RISK" }
      - { name: target_component_id, type: string, source: input, description: "FK -> Component.id — component to migrate to" }
      - { name: target_version, type: string, source: input, description: "Target version for UPGRADE" }
      - { name: migration_effort_days, type: integer, source: input, description: "Estimated effort in person-days" }
      - { name: status, type: enum, source: system, description: "PROPOSED → APPROVED → IN_PROGRESS → COMPLETED / REJECTED / ABANDONED" }
      - { name: actual_completion_at, type: datetime, source: system, description: "When remediation actually completed" }
      - { name: verification_scan_id, type: string, source: system, description: "FK -> DependencyScan.id — scan verifying fix" }
      - { name: license_compatibility_verified, type: boolean, source: computed, description: "Whether replacement component's license is compatible" }

  - name: AuditEngagement
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: audit_type, type: enum, source: input, description: "M_AND_A | IPO_READINESS | CUSTOMER_DUE_DILIGENCE | REGULATORY_INQUIRY" }
      - { name: requesting_party, type: string, source: input, description: "External party requesting audit" }
      - { name: scope_description, type: string, source: input, description: "Audit scope (full product, specific versions, etc.)" }
      - { name: status, type: enum, source: system, description: "INITIATED → SCOPING → DATA_COLLECTION → ANALYSIS → REPORT_DRAFT → REPORT_FINAL / CANCELLED" }
      - { name: target_completion_at, type: datetime, source: input, description: "Requested completion date" }
      - { name: actual_completion_at, type: datetime, source: system, description: "When audit report finalized" }
      - { name: findings_summary, type: string, source: system, description: "Summary of audit findings" }
      - { name: critical_findings_count, type: integer, source: computed, description: "Count of critical findings" }
      - { name: report_hash, type: string, source: computed, description: "SHA-256 of final audit report" }

state_machines:
  - entity: Product
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: AT_RISK
        trigger: "system (automatic when open HIGH/CRITICAL vulnerability detected or RESTRICTED component pending approval >7 days)"
        actor: system
        preconditions: []
        side_effects:
          - "compliance_posture = AT_RISK"
          - "posture_version incremented"
          - "All open ReleaseGates for this product: evaluation_result recomputed, warning_findings_count incremented"

      - from: AT_RISK
        to: BLOCKED
        trigger: "system (automatic when PROHIBITED component added to active BOM or CRITICAL vulnerability open >7 days)"
        actor: system
        preconditions: []
        side_effects:
          - "compliance_posture = BLOCKED"
          - "posture_version incremented"
          - "All open ReleaseGates for this product: gate_status → FAILED"
          - "All PENDING LicenseApprovalRequests: status → EXPIRED"
          - "All OPEN ObligationTickets: status → OVERDUE if due_at < now"

      - from: AT_RISK
        to: COMPLIANT
        trigger: "system (automatic when all CRITICAL/HIGH vulnerabilities remediated and no PROHIBITED components in active BOM)"
        actor: system
        preconditions: []
        side_effects:
          - "compliance_posture = COMPLIANT"
          - "posture_version incremented"

      - from: BLOCKED
        to: AT_RISK
        trigger: "POST /oss-products/{productId}/unblock (requires CISO override with documented remediation plan)"
        actor: CISO
        preconditions:
          - "Product must be in BLOCKED state"
          - "All PROHIBITED components must have approved RemediationPlans in IN_PROGRESS or COMPLETED status"
        side_effects:
          - "compliance_posture = AT_RISK"
          - "posture_version incremented"

  - entity: DependencyScan
    initial_state: QUEUED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - from: QUEUED
        to: PARSING
        trigger: "system (automatic when scan worker picks up job)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PARSING
        to: RESOLVING
        trigger: "system (automatic when manifest parsed successfully)"
        actor: system
        preconditions: []
        side_effects:
          - "components_discovered set from parsed manifest"

      - from: RESOLVING
        to: SCANNING_LICENSES
        trigger: "system (automatic when all components resolved to Component records)"
        actor: system
        preconditions: []
        side_effects:
          - "components_resolved set"
          - "BillOfMaterials created in DRAFT status"
          - "BomEntry records created for each resolved component"

      - from: SCANNING_LICENSES
        to: SCORING
        trigger: "system (automatic when license scan completes for all components)"
        actor: system
        preconditions: []
        side_effects:
          - "Each Component: discovered_license_spdx populated"
          - "Each Component: license_policy_classification computed from SPDX"
          - "Each BomEntry: obligation_determination computed from distribution_model + effective_classification"
          - "license_scan_coverage_pct computed"

      - from: SCORING
        to: COMPLETED
        trigger: "system (automatic when scoring and posture calculation complete)"
        actor: system
        preconditions: []
        side_effects:
          - "BillOfMaterials: status → FINALIZED, bom_posture computed"
          - "Product: total_dependency_count, copyleft_dependency_count, restricted_dependency_count updated"
          - "If any BomEntry has PROHIBITED classification: Product compliance_posture → BLOCKED"
          - "If any BomEntry has RESTRICTED classification without approval: LicenseApprovalRequest created in PENDING"
          - "ObligationTickets created for each BomEntry with obligation_determination != NONE"

      - from: QUEUED
        to: CANCELLED
        trigger: "POST /oss-products/{productId}/dependency-scans/{scanId}/cancel"
        actor: ComplianceAnalyst
        preconditions:
          - "Scan must be in QUEUED or PARSING state"
        side_effects: []

      - from: PARSING
        to: CANCELLED
        trigger: "POST /oss-products/{productId}/dependency-scans/{scanId}/cancel"
        actor: ComplianceAnalyst
        preconditions:
          - "Scan must be in QUEUED or PARSING state"
        side_effects: []

      - from: PARSING
        to: FAILED
        trigger: "system (automatic on parse error)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESOLVING
        to: FAILED
        trigger: "system (automatic on resolution error)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCANNING_LICENSES
        to: FAILED
        trigger: "system (automatic on scan error)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BillOfMaterials
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "system (automatic when parent DependencyScan reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "bom_posture computed"
          - "notice_file_generated = false"
          - "Product counts updated"

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (automatic when newer BOM for same product reaches FINALIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "All open ReleaseGates referencing this BOM: gate_status → EXPIRED"
          - "All open ObligationTickets referencing this BOM's entries: status → OVERDUE if not fulfilled"

      - from: FINALIZED
        to: ARCHIVED
        trigger: "POST /oss-products/{productId}/boms/{bomId}/archive"
        actor: ComplianceAnalyst
        preconditions:
          - "No open ReleaseGates reference this BOM"
          - "Product has a newer FINALIZED BOM"
        side_effects: []

  - entity: LicenseApprovalRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: LEGAL_REVIEW
        trigger: "POST /oss-products/{productId}/license-approvals/{requestId}/assign-legal"
        actor: LegalCounsel
        preconditions:
          - "Request must be in PENDING"
        side_effects:
          - "legal_reviewer_id set to acting LegalCounsel user"

      - from: LEGAL_REVIEW
        to: ENGINEERING_REVIEW
        trigger: "POST /oss-products/{productId}/license-approvals/{requestId}/legal-decision"
        actor: LegalCounsel
        preconditions:
          - "Request must be in LEGAL_REVIEW"
          - "legal_decision must be APPROVE, REJECT, or CONDITIONAL"
        side_effects:
          - "If legal_decision == REJECT: status → REJECTED, final_decision = REJECTED"
          - "If legal_decision == APPROVE or CONDITIONAL: status → ENGINEERING_REVIEW"
          - "legal_conditions recorded if CONDITIONAL"

      - from: ENGINEERING_REVIEW
        to: APPROVED
        trigger: "POST /oss-products/{productId}/license-approvals/{requestId}/engineering-decision"
        actor: EngineeringManager
        preconditions:
          - "Request must be in ENGINEERING_REVIEW"
          - "engineering_decision must be APPROVE"
          - "legal_decision must be APPROVE or CONDITIONAL"
        side_effects:
          - "status → APPROVED"
          - "final_decision = APPROVED"
          - "decision_effective_at = now"
          - "expiry_at = now + 90 days"
          - "BomEntry: obligation_fulfilled = true for linked entry"
          - "If Product was BLOCKED due to this request: re-evaluate posture"

      - from: ENGINEERING_REVIEW
        to: REJECTED
        trigger: "POST /oss-products/{productId}/license-approvals/{requestId}/engineering-decision"
        actor: EngineeringManager
        preconditions:
          - "Request must be in ENGINEERING_REVIEW"
          - "engineering_decision must be REJECT"
        side_effects:
          - "status → REJECTED"
          - "final_decision = REJECTED"

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /oss-products/{productId}/license-approvals/{requestId}/withdraw"
        actor: ComplianceAnalyst
        preconditions:
          - "Request must be in PENDING"
          - "Acting user must be original requester"
        side_effects: []

      - from: LEGAL_REVIEW
        to: WITHDRAWN
        trigger: "POST /oss-products/{productId}/license-approvals/{requestId}/withdraw"
        actor: ComplianceAnalyst
        preconditions:
          - "Request must be in LEGAL_REVIEW"
          - "Acting user must be original requester"
        side_effects: []

      - from: PENDING
        to: EXPIRED
        trigger: "system (automatic when Product becomes BLOCKED or when request open >30 days)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ObligationTicket
    initial_state: OPEN
    terminal_states: [FULFILLED, WAIVED, OVERDUE]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /oss-products/{productId}/obligation-tickets/{ticketId}/start"
        actor: ComplianceAnalyst
        preconditions:
          - "Ticket must be OPEN"
        side_effects: []

      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "POST /oss-products/{productId}/obligation-tickets/{ticketId}/fulfill"
        actor: ComplianceAnalyst
        preconditions:
          - "Ticket must be IN_PROGRESS"
          - "fulfillment_evidence_uri must be provided"
        side_effects:
          - "BomEntry: obligation_fulfilled = true if all linked tickets FULFILLED or WAIVED"
          - "If all ObligationTickets for BOM are FULFILLED/WAIVED: BillOfMaterials notice_file_generated may be set"

      - from: OPEN
        to: WAIVED
        trigger: "POST /oss-products/{productId}/obligation-tickets/{ticketId}/waive"
        actor: LegalCounsel
        preconditions:
          - "Ticket must be OPEN"
          - "waiver_reason must be provided"
        side_effects:
          - "waived_by set to acting LegalCounsel user"
          - "BomEntry: obligation_fulfilled = true if all linked tickets FULFILLED or WAIVED"

      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /oss-products/{productId}/obligation-tickets/{ticketId}/waive"
        actor: LegalCounsel
        preconditions:
          - "Ticket must be IN_PROGRESS"
          - "waiver_reason must be provided"
        side_effects:
          - "waived_by set to acting LegalCounsel user"
          - "BomEntry: obligation_fulfilled = true if all linked tickets FULFILLED or WAIVED"

      - from: OPEN
        to: OVERDUE
        trigger: "system (automatic when due_at < now and status not FULFILLED/WAIVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Product compliance_posture re-evaluated"

      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system (automatic when due_at < now and status not FULFILLED/WAIVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Product compliance_posture re-evaluated"

  - entity: VulnerabilityFinding
    initial_state: OPEN
    terminal_states: [REMEDIATED, FALSE_POSITIVE, WONT_FIX]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /oss-products/{productId}/vulnerability-findings/{findingId}/confirm"
        actor: SecurityAnalyst
        preconditions:
          - "Finding must be OPEN"
        side_effects:
          - "If severity == CRITICAL: Product compliance_posture → AT_RISK"
          - "If severity == CRITICAL and open >7 days: Product compliance_posture → BLOCKED"

      - from: CONFIRMED
        to: MITIGATED
        trigger: "POST /oss-products/{productId}/vulnerability-findings/{findingId}/mitigate"
        actor: SecurityAnalyst
        preconditions:
          - "Finding must be CONFIRMED"
        side_effects: []

      - from: CONFIRMED
        to: REMEDIATED
        trigger: "POST /oss-products/{productId}/vulnerability-findings/{findingId}/verify-remediation"
        actor: SecurityAnalyst
        preconditions:
          - "Finding must be CONFIRMED or MITIGATED"
          - "verification_evidence_uri must be provided"
          - "remediation_status must be VERIFIED"
        side_effects:
          - "BomEntry: vulnerability_severity_max recomputed"
          - "Product: high_severity_vulnerability_count decremented"
          - "If no CRITICAL/HIGH findings remain: Product compliance_posture → COMPLIANT"

      - from: MITIGATED
        to: REMEDIATED
        trigger: "POST /oss-products/{productId}/vulnerability-findings/{findingId}/verify-remediation"
        actor: SecurityAnalyst
        preconditions:
          - "Finding must be CONFIRMED or MITIGATED"
          - "verification_evidence_uri must be provided"
          - "remediation_status must be VERIFIED"
        side_effects:
          - "BomEntry: vulnerability_severity_max recomputed"
          - "Product: high_severity_vulnerability_count decremented"
          - "If no CRITICAL/HIGH findings remain: Product compliance_posture → COMPLIANT"

      - from: OPEN
        to: FALSE_POSITIVE
        trigger: "POST /oss-products/{productId}/vulnerability-findings/{findingId}/mark-false-positive"
        actor: SecurityAnalyst
        preconditions:
          - "Finding must be OPEN"
        side_effects:
          - "Product counts recomputed"

      - from: OPEN
        to: WONT_FIX
        trigger: "POST /oss-products/{productId}/vulnerability-findings/{findingId}/wont-fix"
        actor: CISO
        preconditions:
          - "Finding must be OPEN or CONFIRMED"
          - "Risk acceptance rationale required"
        side_effects:
          - "Product counts recomputed"

      - from: CONFIRMED
        to: WONT_FIX
        trigger: "POST /oss-products/{productId}/vulnerability-findings/{findingId}/wont-fix"
        actor: CISO
        preconditions:
          - "Finding must be OPEN or CONFIRMED"
          - "Risk acceptance rationale required"
        side_effects:
          - "Product counts recomputed"

  - entity: ReleaseGate
    initial_state: OPEN
    terminal_states: [PASSED, FAILED, BYPASSED, EXPIRED]
    transitions:
      - from: OPEN
        to: EVALUATING
        trigger: "POST /oss-products/{productId}/release-gates/{gateId}/evaluate"
        actor: ReleaseManager
        preconditions:
          - "Gate must be OPEN"
          - "BOM must be FINALIZED"
          - "notice_file_attached must be true"
        side_effects:
          - "blocking_findings_count computed"
          - "warning_findings_count computed"
          - "obligations_fulfilled_pct computed"

      - from: EVALUATING
        to: PASSED
        trigger: "system (automatic when evaluation completes with blocking_findings_count == 0 and warning_findings_count <= threshold and obligations_fulfilled_pct >= 100)"
        actor: system
        preconditions: []
        side_effects:
          - "evaluation_result = PASS"
          - "evaluation_expires_at = now + 30 days"

      - from: EVALUATING
        to: FAILED
        trigger: "system (automatic when evaluation completes with blocking_findings_count > 0 or obligations_fulfilled_pct < 100)"
        actor: system
        preconditions: []
        side_effects:
          - "evaluation_result = FAIL"

      - from: EVALUATING
        to: BYPASSED
        trigger: "POST /oss-products/{productId}/release-gates/{gateId}/bypass"
        actor: CISO
        preconditions:
          - "Gate must be EVALUATING"
          - "bypass_reason must be provided"
          - "Product must not be in BLOCKED posture"
        side_effects:
          - "evaluation_result = CONDITIONAL_PASS"
          - "bypass_approved_by set"
          - "evaluation_expires_at = now + 7 days (shorter for bypass)"

      - from: OPEN
        to: EXPIRED
        trigger: "system (automatic when BOM is SUPERSEDED or gate open >14 days)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PASSED
        to: EXPIRED
        trigger: "system (automatic when evaluation_expires_at < now)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BYPASSED
        to: EXPIRED
        trigger: "system (automatic when evaluation_expires_at < now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RemediationPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, REJECTED, ABANDONED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /oss-products/{productId}/remediation-plans/{planId}/approve"
        actor: EngineeringManager
        preconditions:
          - "Plan must be PROPOSED"
          - "If plan_type == UPGRADE or REPLACE: target_component_id license must be compatible (PERMISSIVE or WEAK_COPYLEFT)"
        side_effects:
          - "VulnerabilityFinding: remediation_status = IN_PROGRESS"
          - "license_compatibility_verified computed"

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /oss-products/{productId}/remediation-plans/{planId}/start"
        actor: EngineeringManager
        preconditions:
          - "Plan must be APPROVED"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /oss-products/{productId}/remediation-plans/{planId}/complete"
        actor: EngineeringManager
        preconditions:
          - "Plan must be IN_PROGRESS"
          - "verification_scan_id must reference a COMPLETED scan showing vulnerability absent"
        side_effects:
          - "actual_completion_at = now"
          - "VulnerabilityFinding: remediation_status = VERIFIED"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /oss-products/{productId}/remediation-plans/{planId}/reject"
        actor: EngineeringManager
        preconditions:
          - "Plan must be PROPOSED"
        side_effects: []

      - from: APPROVED
        to: ABANDONED
        trigger: "POST /oss-products/{productId}/remediation-plans/{planId}/abandon"
        actor: EngineeringManager
        preconditions:
          - "Plan must be APPROVED or IN_PROGRESS"
        side_effects:
          - "VulnerabilityFinding: remediation_status = NOT_STARTED"

      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "POST /oss-products/{productId}/remediation-plans/{planId}/abandon"
        actor: EngineeringManager
        preconditions:
          - "Plan must be APPROVED or IN_PROGRESS"
        side_effects:
          - "VulnerabilityFinding: remediation_status = NOT_STARTED"

  - entity: AuditEngagement
    initial_state: INITIATED
    terminal_states: [REPORT_FINAL, CANCELLED]
    transitions:
      - from: INITIATED
        to: SCOPING
        trigger: "POST /oss-products/{productId}/audit-engagements/{engagementId}/start-scoping"
        actor: ComplianceAnalyst
        preconditions:
          - "Engagement must be INITIATED"
        side_effects: []

      - from: SCOPING
        to: DATA_COLLECTION
        trigger: "POST /oss-products/{productId}/audit-engagements/{engagementId}/start-data-collection"
        actor: ComplianceAnalyst
        preconditions:
          - "Engagement must be SCOPING"
        side_effects:
          - "Snapshot of all FINALIZED BOMs for product taken"
          - "Snapshot of all open VulnerabilityFindings taken"

      - from: DATA_COLLECTION
        to: ANALYSIS
        trigger: "POST /oss-products/{productId}/audit-engagements/{engagementId}/start-analysis"
        actor: ComplianceAnalyst
        preconditions:
          - "Engagement must be DATA_COLLECTION"
        side_effects: []

      - from: ANALYSIS
        to: REPORT_DRAFT
        trigger: "POST /oss-products/{productId}/audit-engagements/{engagementId}/draft-report"
        actor: ComplianceAnalyst
        preconditions:
          - "Engagement must be ANALYSIS"
        side_effects:
          - "findings_summary populated"
          - "critical_findings_count computed"

      - from: REPORT_DRAFT
        to: REPORT_FINAL
        trigger: "POST /oss-products/{productId}/audit-engagements/{engagementId}/finalize-report"
        actor: LegalCounsel
        preconditions:
          - "Engagement must be REPORT_DRAFT"
        side_effects:
          - "actual_completion_at = now"
          - "report_hash computed"

      - from: INITIATED
        to: CANCELLED
        trigger: "POST /oss-products/{productId}/audit-engagements/{engagementId}/cancel"
        actor: ComplianceAnalyst
        preconditions:
          - "Engagement must be INITIATED, SCOPING, or DATA_COLLECTION"
        side_effects: []

      - from: SCOPING
        to: CANCELLED
        trigger: "POST /oss-products/{productId}/audit-engagements/{engagementId}/cancel"
        actor: ComplianceAnalyst
        preconditions:
          - "Engagement must be INITIATED, SCOPING, or DATA_COLLECTION"
        side_effects: []

      - from: DATA_COLLECTION
        to: CANCELLED
        trigger: "POST /oss-products/{productId}/audit-engagements/{engagementId}/cancel"
        actor: ComplianceAnalyst
        preconditions:
          - "Engagement must be INITIATED, SCOPING, or DATA_COLLECTION"
        side_effects: []

concurrency_rules:
  - rule_id: bom-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /oss-products/{productId}/dependency-scans"
    occ_field: "expected_product_version"
    description: |
      Creating a DependencyScan against a Product whose posture_version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a scan (which legitimately may change the
      product's compliance posture) and the current writer's view of the product
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: release-gate-evaluate-stale-bom
    parent_entity: BillOfMaterials
    write_endpoint: "POST /oss-products/{productId}/release-gates/{gateId}/evaluate"
    occ_field: "expected_bom_version"
    description: |
      Evaluating a ReleaseGate against a BillOfMaterials whose version has advanced
      since the client last observed it is rejected. This captures the case where
      a newer scan has superseded the BOM and the current evaluation would be
      against stale data.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: license_policy_classification
    trigger: "Component scan completion or policy_override_classification update"
    algorithm: weighted_scoring
    formula: |
      1. If policy_override_classification is set: effective_classification = policy_override_classification
      2. Else compute license_policy_classification from discovered_license_spdx:
         - PERMISSIVE: MIT, BSD-2-Clause, BSD-3-Clause, ISC, Apache-2.0, Zlib, Unlicense
         - WEAK_COPYLEFT: LGPL-2.1, LGPL-3.0, MPL-2.0, EPL-2.0, CDDL-1.0
         - STRONG_COPYLEFT: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0
         - RESTRICTED: CC-BY-NC-4.0, CC-BY-SA-4.0, proprietary with source available
         - PROHIBITED: WTFPL, unlicensed, proprietary without grant, SSPL-1.0 (SaaS context)
      3. Context adjustment: if Product.distribution_model == SaaS and license == AGPL-3.0:
         upgrade to PROHIBITED
      4. If license not in known list: default to RESTRICTED (conservative)
    constants:
      KNOWN_LICENSES_COUNT: 18
    precision: "exact enum match"
    variants:
      - name: conservative_default
        when: "discovered_license_spdx is null or unrecognized"
        difference: "Classification defaults to RESTRICTED instead of failing open"

  - name: obligation_determination
    trigger: "BomEntry creation or Component classification change"
    algorithm: constraint_propagation
    formula: |
      Inputs: effective_classification, Product.distribution_model, dependency_scope
      1. If effective_classification == PROHIBITED: obligation_determination = PROHIBITED_USE
      2. If dependency_scope in {TEST, DEV}: obligation_determination = NONE
      3. If effective_classification == PERMISSIVE: obligation_determination = ATTRIBUTION_ONLY
      4. If effective_classification == WEAK_COPYLEFT:
         - If distribution_model == SaaS: ATTRIBUTION_ONLY
         - Else: SOURCE_OFFER (must offer source for library)
      5. If effective_classification == STRONG_COPYLEFT:
         - If distribution_model == SaaS and license == AGPL-3.0: FULL_SOURCE_DISCLOSURE
         - If distribution_model in {ON_PREMISE, EMBEDDED}: SOURCE_DISCLOSURE
         - If distribution_model == MOBILE_APP: FULL_SOURCE_DISCLOSURE
      6. If effective_classification == RESTRICTED: requires approval; obligation = SOURCE_DISCLOSURE if approved
    constants:
      SaaS_AGPL_UPGRADE: true
    precision: "exact enum match"
    variants:
      - name: distribution_mode_dependent
        when: "same component in SaaS vs ON_PREMISE product"
        difference: "AGPL-3.0 in SaaS triggers FULL_SOURCE_DISCLOSURE; in ON_PREMISE triggers SOURCE_DISCLOSURE"

  - name: bom_posture
    trigger: "BillOfMaterials finalization or any BomEntry/Component change"
    algorithm: threshold
    formula: |
      1. Count entries by effective_classification:
         - prohibited_count = count of PROHIBITED
         - restricted_count = count of RESTRICTED without APPROVED LicenseApprovalRequest
         - copyleft_count = count of WEAK_COPYLEFT + STRONG_COPYLEFT
      2. Count entries with vulnerability_severity_max in {HIGH, CRITICAL}
      3. If prohibited_count > 0: bom_posture = RED
      4. Else if restricted_count > 0 or high_vuln_count > 0: bom_posture = YELLOW
      5. Else: bom_posture = GREEN
      6. Product compliance_posture escalates: RED BOM → BLOCKED product, YELLOW BOM → AT_RISK product
    constants:
      YELLOW_THRESHOLD: 1
    precision: "exact enum match"
    variants:
      - name: strict_mode
        when: "Product.distribution_model == EMBEDDED"
        difference: "Any WEAK_COPYLEFT also triggers YELLOW (stricter for embedded)"

  - name: release_gate_evaluation
    trigger: "ReleaseGate evaluation requested"
    algorithm: threshold
    formula: |
      1. blocking_findings_count = count of:
         - BomEntries with effective_classification == PROHIBITED
         - VulnerabilityFindings with severity == CRITICAL and status in {OPEN, CONFIRMED}
      2. warning_findings_count = count of:
         - BomEntries with effective_classification == RESTRICTED without APPROVED LicenseApprovalRequest
         - VulnerabilityFindings with severity == HIGH and status in {OPEN, CONFIRMED}
      3. obligations_fulfilled_pct = (FULFILLED + WAIVED ObligationTickets) / total ObligationTickets * 100
      4. If blocking_findings_count > 0: evaluation_result = FAIL
      5. Else if obligations_fulfilled_pct < 100: evaluation_result = FAIL
      6. Else if warning_findings_count > 3: evaluation_result = FAIL
      7. Else if warning_findings_count > 0: evaluation_result = CONDITIONAL_PASS
      8. Else: evaluation_result = PASS
    constants:
      MAX_WARNINGS_FOR_PASS: 0
      MAX_WARNINGS_FOR_CONDITIONAL: 3
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict_release
        when: "Product.distribution_model == EMBEDDED or audit_engagement active"
        difference: "MAX_WARNINGS_FOR_CONDITIONAL = 0 (no conditional pass allowed)"

  - name: remediation_sla_deadline
    trigger: "VulnerabilityFinding confirmation"
    algorithm: threshold
    formula: |
      Base deadline = detected_at + SLA_DAYS[severity]
      SLA_DAYS = {CRITICAL: 7, HIGH: 30, MEDIUM: 90, LOW: 180}
      If Vulnerability.license_change_flag == true: deadline = min(deadline, detected_at + 14 days)
      If Product.compliance_posture == BLOCKED: deadline = min(deadline, now + 3 days)
    constants:
      CRITICAL_SLA_DAYS: 7
      HIGH_SLA_DAYS: 30
      MEDIUM_SLA_DAYS: 90
      LOW_SLA_DAYS: 180
      LICENSE_CHANGE_SLA_DAYS: 14
      BLOCKED_PRODUCT_SLA_DAYS: 3
    precision: "datetime, UTC"
    variants:
      - name: license_change_accelerated
        when: "Vulnerability.license_change_flag == true"
        difference: "SLA compressed to 14 days regardless of severity"

  - name: license_scan_coverage
    trigger: "DependencyScan completion"
    algorithm: aggregation
    formula: |
      license_scan_coverage_pct = (components with discovered_license_spdx != null) / components_resolved * 100
      Round to 2 decimal places, round_half_up
      If components_resolved == 0: coverage = 0.00
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: audit_critical_findings
    trigger: "AuditEngagement report draft"
    algorithm: aggregation
    formula: |
      critical_findings_count = count of:
        - PROHIBITED components in any FINALIZED BOM
        - CRITICAL vulnerabilities with status OPEN or CONFIRMED
        - RESTRICTED components with expired or missing approvals
        - ObligationTickets OVERDUE > 30 days
    constants:
      OVERDUE_CRITICAL_DAYS: 30
    precision: "integer count"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "Product must be in correct posture for operational actions"
    error_id: ERR_PRODUCT_BLOCKED
    http_status: 409
    applies_to: "Create scans, create release gates, approve remediation plans"

  - priority: 5
    category: state
    check: "Target resource must be in correct state for operation"
    error_id: "varies (ERR_SCAN_NOT_CANCELLABLE, ERR_GATE_NOT_EVALUABLE, ERR_REQUEST_NOT_PENDING, etc.)"
    http_status: 409
    applies_to: "State transition endpoints"

  - priority: 6
    category: business_safety
    check: "PROHIBITED components cannot be added to BOM without CISO waiver"
    error_id: ERR_PROHIBITED_COMPONENT
    http_status: 403
    applies_to: "POST /oss-products/{productId}/dependency-scans (manifest containing prohibited components)"

  - priority: 7
    category: business_safety
    check: "Release gate evaluation requires NOTICE file generated and attached"
    error_id: ERR_NOTICE_FILE_MISSING
    http_status: 409
    applies_to: "POST /oss-products/{productId}/release-gates/{gateId}/evaluate"

  - priority: 8
    category: business_referential
    check: "RemediationPlan target_component_id must reference existing Component with compatible license"
    error_id: ERR_INCOMPATIBLE_LICENSE
    http_status: 400
    applies_to: "POST /oss-products/{productId}/remediation-plans"

  - priority: 9
    category: business_temporal
    check: "LicenseApprovalRequest expiry_at must not be exceeded for use"
    error_id: ERR_APPROVAL_EXPIRED
    http_status: 409
    applies_to: "Release gate evaluation, BOM finalization"

  - priority: 10
    category: business_fiscal
    check: "RemediationPlan migration_effort_days must not exceed available engineering capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 402
    applies_to: "POST /oss-products/{productId}/remediation-plans"

endpoints:
  # --- Product ---
  - method: POST
    path: "/oss-products"
    description: "Create a new Product"
    roles: [ComplianceAnalyst]
    code: 201
    input: [product_code, product_name, distribution_model]
    output: Product
    side_effects:
      - "compliance_posture initialized to COMPLIANT"
      - "posture_version initialized to 1"
      - "counts initialized to 0"

  - method: GET
    path: "/oss-products"
    description: "List all Products"
    roles: [ComplianceAnalyst, LegalCounsel, EngineeringManager, SecurityAnalyst, ReleaseManager, CISO, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/oss-products/{productId}"
    description: "Get a specific Product"
    roles: [ComplianceAnalyst, LegalCounsel, EngineeringManager, SecurityAnalyst, ReleaseManager, CISO, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/oss-products/{productId}/unblock"
    description: "Request unblock of BLOCKED product (CISO only)"
    roles: [CISO]
    code: 200
    input: [justification]
    output: Product
    side_effects:
      - "compliance_posture → AT_RISK if preconditions met"
      - "posture_version incremented"

  # --- Component ---
  - method: POST
    path: "/oss-components"
    description: "Create a new Component"
    roles: [ComplianceAnalyst]
    code: 201
    input: ["package_url", "component_name", "version", "declared_license_spdx", "source_download_url?", "copyright_notice?"]
    output: Component
    side_effects:
      - "discovered_license_spdx = null"
      - "license_policy_classification not yet computed"

  - method: GET
    path: "/oss-components"
    description: "List all Components"
    roles: [ComplianceAnalyst, LegalCounsel, EngineeringManager, SecurityAnalyst, ReleaseManager, CISO, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "package_url?", "effective_classification?"]
    output: "Component[]"
    side_effects: []

  - method: GET
    path: "/oss-components/{componentId}"
    description: "Get a specific Component"
    roles: [ComplianceAnalyst, LegalCounsel, EngineeringManager, SecurityAnalyst, ReleaseManager, CISO, PlatformAdmin]
    code: 200
    input: []
    output: Component
    side_effects: []

  - method: POST
    path: "/oss-components/{componentId}/override-classification"
    description: "Override license policy classification (LegalCounsel only)"
    roles: [LegalCounsel]
    code: 200
    input: [policy_override_classification, rationale]
    output: Component
    side_effects:
      - "effective_classification updated"
      - "All BomEntries referencing this component: obligation_determination recomputed"
      - "All BillOfMaterials containing this component: bom_posture recomputed"
      - "All Products with this component: counts updated, posture re-evaluated"

  # --- DependencyScan ---
  - method: POST
    path: "/oss-products/{productId}/dependency-scans"
    description: "Create a new DependencyScan"
    roles: [ComplianceAnalyst]
    code: 201
    input: [scan_tool, scan_scope, expected_product_version]
    output: DependencyScan
    side_effects:
      - "status = QUEUED"
      - "Product version incremented (OCC)"
      - "If Product posture == BLOCKED: rejected with ERR_PRODUCT_BLOCKED"

  - method: GET
    path: "/oss-products/{productId}/dependency-scans"
    description: "List DependencyScans for a Product"
    roles: [ComplianceAnalyst, LegalCounsel, EngineeringManager, SecurityAnalyst, ReleaseManager, CISO, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DependencyScan[]"
    side_effects: []

  - method: GET
    path: "/oss-products/{productId}/dependency-scans/{scanId}"
    description: "Get a specific DependencyScan"
    roles: [ComplianceAnalyst, LegalCounsel, EngineeringManager, SecurityAnalyst, ReleaseManager, CISO, PlatformAdmin]
    code: 200
    input: []
    output: DependencyScan
    side_effects: []

  - method: POST
    path: "/oss-products/{productId}/dependency-scans/{scanId}/cancel"
    description: "Cancel a QUEUED or PARSING scan"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: DependencyScan
    side_effects: ["status → CANCELLED"]

