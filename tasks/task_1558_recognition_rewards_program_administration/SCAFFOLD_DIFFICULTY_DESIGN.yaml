  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: budget_period_half_open_overlap
        grounds:
          - validations[priority=13]
          - entities.PointBudget.fields.period_end_date
          - errors[ERR_BUDGET_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the PointBudget resource timeline:
          [2026-08-01, 2027-02-01) permits an exactly-adjacent successor
          starting 2027-02-01 AND an exactly-adjacent predecessor ending
          2026-08-01, but rejects [2027-01-15, 2027-03-01) which intersects.
        test_recipe:
          setup:
            - "Program and department; first budget B1 [2026-08-01, 2027-02-01)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-08-01", period_end_date: "2027-02-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2027-02-01", period_end_date: "2027-08-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { b2: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2027-01-15", period_end_date: "2027-03-01", allocated_points: 5000 }, as: FinanceAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-07-01", period_end_date: "2026-08-01", allocated_points: 5000 }, as: FinanceAdmin, captures: { b4: $.data.id } }
          assert:
            - "PointBudget.${b2} created (201): start == B1.end is allowed adjacency"
            - "${err} == ERR_BUDGET_PERIOD_OVERLAP"
            - "PointBudget.${b4} created (201): end == B1.start is allowed adjacency"
            - "GET /api/budgets?program_id=${prog}&department_id=${dept} returns exactly 3 rows"

      - name: vendor_ship_date_aggregate_capacity
        grounds:
          - calculations.vendor_ship_date_assignment
          - entities.FulfillmentVendor.fields.daily_ship_capacity
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on FulfillmentVendor (different
          resource and semantics from the PointBudget half-open window): a
          calendar day is a capacity BUCKET with no adjacency concept —
          weekends are skipped (Friday submission with 1-day lead ships
          Monday), the second order on a capacity-1 vendor rolls to Tuesday,
          and a DIFFERENT vendor's bucket the same Monday is unaffected.
        test_recipe:
          setup:
            - "Clock pinned to Friday 2026-08-07; vendor V1 capacity 1 lead 1; vendor V2 capacity 5 lead 1; employee funded with 10000 points; one 100-point item per vendor; three orders (two on V1's item, one on V2's)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 10000, reason_code: DELIVERY, message: "g", idempotency_key: "to2-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendOne", vendor_code: "V1", daily_ship_capacity: 1, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { v1: $.data.id } }
            - { call: "POST /api/vendors", payload: { name: "VendTwo", vendor_code: "V2", daily_ship_capacity: 5, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { v2: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${v1}", sku: "A1", name: "ItemA", category: "MERCH", point_cost: 100, cash_value_cents: 500, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item1: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${v2}", sku: "B1", name: "ItemB", category: "MERCH", point_cost: 100, cash_value_cents: 500, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item2: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item1}", quantity: 1, idempotency_key: "to2-r1" }, as: Employee, as_user_id: "${emp}", captures: { o1: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item1}", quantity: 1, idempotency_key: "to2-r2" }, as: Employee, as_user_id: "${emp}", captures: { o2: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item2}", quantity: 1, idempotency_key: "to2-r3" }, as: Employee, as_user_id: "${emp}", captures: { o3: $.data.id } }
          trigger:
            - { call: "POST /api/redemption-orders/${o1}/submit", payload: {}, as: VendorOps, captures: { s1: $.data.ship_date } }
            - { call: "POST /api/redemption-orders/${o2}/submit", payload: {}, as: VendorOps, captures: { s2: $.data.ship_date } }
            - { call: "POST /api/redemption-orders/${o3}/submit", payload: {}, as: VendorOps, captures: { s3: $.data.ship_date } }
          assert:
            - "${s1} == 2026-08-10"
            - "${s2} == 2026-08-11"
            - "${s3} == 2026-08-10"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (3 instances, different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: redeem_then_cancel_points_conservation
        grounds:
          - state_machines.RedemptionOrder."fulfillment=PENDING_SUBMISSION (escrow=HELD)"_to_"fulfillment=CANCELLED (escrow=REFUNDED)"
          - entities.Employee.fields.available_points
          - entities.Employee.fields.held_points
        distinguishing_aspect: |
          Conserved quantity: the employee's total point stock
          (available_points + held_points). Forward action (order create) moves
          1000 from available to held; the compensating cancel returns it —
          available + held == 3000 at every observation and the ledger nets to
          the original 3000-point grant.
        test_recipe:
          setup:
            - "Employee granted 3000 points; item costing 1000"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 3000, reason_code: DELIVERY, message: "g", idempotency_key: "ci1-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "BAG", name: "Bag", category: "MERCH", point_cost: 1000, cash_value_cents: 5000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
          trigger:
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "ci1-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { a_mid: $.data.available_points, h_mid: $.data.held_points } }
            - { call: "POST /api/redemption-orders/${ord}/cancel", payload: {}, as: Employee, as_user_id: "${emp}" }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { a_end: $.data.available_points, h_end: $.data.held_points } }
          assert:
            - "${a_mid} == 2000 and ${h_mid} == 1000"
            - "${a_end} == 3000 and ${h_end} == 0"
            - "invariant held at every step: available_points + held_points == 3000"
            - "GET /api/employees/${emp}/ledger-entries nets to +3000 (GRANT_NOMINATION +3000, HOLD -1000, REFUND +1000)"

      - name: approve_then_revoke_budget_conservation
        grounds:
          - state_machines.Nomination.PENDING_REVIEW_to_APPROVED
          - state_machines.Award.ACTIVE_to_REVOKED
          - entities.PointBudget.fields.committed_points
        distinguishing_aspect: |
          Conserved quantity: the budget's committed_points. Forward approve
          moves 2500 reserved -> committed; the compensating award revocation
          releases exactly those 2500 — reserved_points and committed_points
          both return to the pre-nomination baseline 0, and
          committed_points_after_revoke == committed_points_before_submit.
        test_recipe:
          setup:
            - "Budget 10000; MANAGER nomination for 2500 points approved, then the award revoked by HRAdmin"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 2500, reason_code: DELIVERY, message: "g", idempotency_key: "ci2-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
          trigger:
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin, captures: { award: $.data.award_id } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { com_mid: $.data.committed_points, res_mid: $.data.reserved_points } }
            - { call: "POST /api/awards/${award}/revoke", payload: { reason: "granted in error" }, as: HRAdmin }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { com_end: $.data.committed_points, res_end: $.data.reserved_points } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { e_avail: $.data.available_points } }
          assert:
            - "${res_mid} == 0 and ${com_mid} == 2500"
            - "${res_end} == 0 and ${com_end} == 0"
            - "Award.${award}.status == REVOKED"
            - "${e_avail} == 0"

      - name: settle_then_return_same_period_chargeback_neutral
        grounds:
          - calculations.chargeback_calculation
          - state_machines.RedemptionOrder."fulfillment=RETURN_REQUESTED (escrow=SETTLED)"_to_"fulfillment=RETURNED (escrow=SETTLED_WITH_FEE)"
          - state_machines.TaxRecord.ESTIMATED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: the period's net chargeback EXCLUDING restocking
          fees. A 1000-point order delivered then returned inside the same
          accrual month contributes only its 200-point fee (1000 x 20%) to the
          chargeback (round(200 x 0.5) = 100 cents); the non-fee portion is
          exactly compensated and the linked ESTIMATED TaxRecord is VOIDED
          (gross-up expense contribution 0).
        test_recipe:
          setup:
            - "Program grossup disabled, rate 0.5; vendor restocking 20%; employee granted 1000 points; 1000-point item delivered and returned, all in August 2026"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "RecProg", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 }, grossup_enabled: false }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 100000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MGR1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "EMP1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 1000, reason_code: DELIVERY, message: "g", idempotency_key: "ci3-n1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "VendCo", vendor_code: "VC1", daily_ship_capacity: 10, lead_time_business_days: 1, restocking_fee_percent: 20, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "BAG", name: "Bag", category: "MERCH", point_cost: 1000, cash_value_cents: 5000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { item: $.data.id } }
            - { call: "POST /api/redemption-orders", payload: { catalog_item_id: "${item}", quantity: 1, idempotency_key: "ci3-r1" }, as: Employee, as_user_id: "${emp}", captures: { ord: $.data.id } }
            - { call: "POST /api/redemption-orders/${ord}/submit", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord}/mark-shipped", payload: {}, as: VendorOps }
            - { call: "POST /api/redemption-orders/${ord}/mark-delivered", payload: {}, as: VendorOps, captures: { tr: $.data.tax_record_id } }
            - { call: "POST /api/redemption-orders/${ord}/request-return", payload: { reason: "wrong size" }, as: Employee, as_user_id: "${emp}" }
            - { call: "POST /api/redemption-orders/${ord}/complete-return", payload: {}, as: VendorOps, captures: { fee: $.data.restocking_fee_points, esc: $.data.escrow_status } }
          trigger:
            - { call: "POST /api/accrual-runs", payload: { program_id: "${prog}", period_year: 2026, period_month: 8 }, as: FinanceAdmin, captures: { cb_cost: "$.data.department_breakdown[0].redemption_cost_cents", cb_gu: "$.data.department_breakdown[0].gross_up_expense_cents", cb_net: "$.data.department_breakdown[0].net_chargeback_cents" } }
            - { call: "GET /api/tax-records/${tr}", payload: {}, as: HRAdmin, captures: { tr_status: $.data.status } }
          assert:
            - "${fee} == 200 and ${esc} == SETTLED_WITH_FEE"
            - "${tr_status} == VOIDED"
            - "${cb_cost} == 100"
            - "${cb_gu} == 0"
            - "${cb_net} == 100"
