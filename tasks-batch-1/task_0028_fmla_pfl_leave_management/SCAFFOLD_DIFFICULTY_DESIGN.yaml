            - call: "POST /leave/employers"
              payload: { legal_name: "Inv1 Co", state_code: "FED", fmla_method: "CALENDAR_YEAR", employer_premium_share_pct: 0.50, monthly_premium_total_cents: 100000 }
              as: PlatformAdmin
