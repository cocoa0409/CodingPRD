- rule_id: combinatorial_formula
  instances:
  - name: league_age_three_input_branch_mode_a
    grounds:
    - calculations.league_age_computation
    - entities.Player.fields.league_age
    - state_machines.Player.REGISTERED_to_AGE_VERIFIED
    distinguishing_aspect: 'Mode (a): league_age is a >=3-input non-linear formula over (cutoff.year, bd.year,

      and the (month,day) tuple comparison branch) — a birth of 2014-08-31 yields league_age 12

      while 2014-09-01 yields 11, because the (bd.month,bd.day) > (cutoff.month,cutoff.day) branch

      subtracts a year only past the cutoff day.

      '
    test_recipe:
      setup:
      - League with age_cutoff_date 2026-08-31, division Majors [9,12]; two players born 2014-08-31 and 2014-09-01.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
          draft_snake: true
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /families
        payload:
          league_id: ${lg}
          guardian_email: fam@x.com
          guardian_name: Fam
          volunteer_deposit_cents: 0
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          fam: $.data.id
      - call: POST /_clock/set
        payload:
          now_iso: '2026-02-01T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /players
        payload:
          league_id: ${lg}
          family_id: ${fam}
          division_id: ${div}
          full_name: Aug31 Kid
          birth_date: '2014-08-31'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          p_aug: $.data.id
      - call: POST /players
        payload:
          league_id: ${lg}
          family_id: ${fam}
          division_id: ${div}
          full_name: Sep01 Kid
          birth_date: '2014-09-01'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          p_sep: $.data.id
      assert:
      - Player.${p_aug}.league_age == 12
      - Player.${p_sep}.league_age == 11
  - name: volunteer_refund_round_then_sum_mode_b
    grounds:
    - calculations.volunteer_refund
    - state_machines.League.PLAYOFFS_to_CLOSED
    - entities.Family.fields.volunteer_credit_cents
    distinguishing_aspect: 'Mode (b): the 5% admin fee is rounded PER COMMITMENT to whole cents then summed; for three

      fulfilled credits of 1050 each the per-commitment order yields refund 2991, whereas

      sum-then-round would yield 2992 — the scaffold pins round-then-sum.

