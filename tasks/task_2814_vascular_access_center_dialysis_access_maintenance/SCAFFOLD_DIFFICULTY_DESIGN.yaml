      - name: recovery_bay_windows_are_closed_so_touching_at_a_single_instant_collides
        grounds:
          - validations.priority_21_ERR_RECOVERY_BAY_UNAVAILABLE
          - calculations.sedation_staffing_capacity
          - entities.ProcedureRoom.fields.recovery_bay_count
        distinguishing_aspect: |
          The recovery-bay window [scheduled_end, scheduled_end + 90 min] is closed at BOTH ends,
          so two cases whose recovery windows share only the single instant scheduled_end collide -
          the opposite convention from the room rule (half-open) and the RN rule (half-open) in the
          same request path. One minute of separation is enough to make the identical booking legal,
          and the test repeats the boundary a second time against the newly accepted case to prove
          the rule is re-evaluated against live data rather than a fixed schedule. turnover_buffer_min
          0 and daily_case_cap 6 guarantee the bay dimension is the only one that can fail.
        test_recipe:
          setup:
            - "room ANGIO-16 with turnover_buffer_min 0, daily_case_cap 6, recovery_bay_count 1"
            - "one sedation RN with max_concurrent_sedation_cases 2, one interventionalist"
