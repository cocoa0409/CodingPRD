            - call: "POST /api/plans/${plan_id}/resume"
              as: PlanSponsor
              captures: { status_resumed: $.data.status }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-SR", hire_date: "2023-08-03", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
          assert:
            - "${status_susp} == SUSPENDED"
            - "${gate_err} == ERR_PLAN_NOT_ACTIVE (mid-cycle child write blocked)"
            - "${status_resumed} == ACTIVE (cycle closes)"
            - "post-resume participant create returns 201 with id ${participant_id}"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: payment_zero_balance_account_close_cascade
        grounds:
          - state_machines.DistributionRequest.PAYABLE_to_PAID
          - state_machines.Account.ACTIVE_to_CLOSED
          - calculations.account_balances
        distinguishing_aspect: |
          Depth-4 chain from the pay trigger: pay posts the DISTRIBUTION_DEBIT
          (link 1); the new entry forces the ledger-replay balance recompute
          (link 2); settled hitting exactly 0 flips Account to CLOSED (link 3);
          the account close force-cancels the sibling SCHEDULED request (link 4).
          Each link is caused by the previous link, not by pay directly.
        test_recipe:
          setup:
            - "ACTIVE plan (events SEPARATION+FIXED_TIME), vested participant, account funded with exactly 100000 settled cents"
            - "separation confirmed (alleged 2027-03-15); request A (SEPARATION, full vested -> locks 100000, scheduled 2027-04-14)"
            - "request B (FIXED_TIME 2028-06-01, full) SCHEDULED on the same account"
            - "clock at 2027-04-14 so A is PAYABLE"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan CC", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION", "FIXED_TIME"], officer_comp_threshold_cents: 20000000, processing_lag_days: 30, vesting_cliff_years: 3 }
              as: PlanSponsor
