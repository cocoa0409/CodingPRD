# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Wildlife Refuge Public Use Permitting & Habitat Management
# Breadth walk of the claim-extraction taxonomy against §1.1-§1.7.
# Claims already exercised by §1.8 appear as excluded_because stubs.
# Server default clock: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: unit_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.ManagementUnit.fields.habitat_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field habitat_type is rejected with ERR_INVALID_REQUEST (400) before any persistence."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /refuge/management-units"
              payload: { name: "No Habitat Unit", acreage: 100 }
              as: RefugeManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
            - "no ManagementUnit is persisted"
      - name: unit_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ManagementUnit.fields.habitat_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "habitat_type value outside [WETLAND, GRASSLAND, FOREST, MIXED] is rejected."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /refuge/management-units"
              payload: { name: "Bad Unit", habitat_type: "DESERT", acreage: 100 }
              as: RefugeManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
      - name: permit_create_provisional_fee_ignores_crew_size
        claim_type: computed_fields
        grounds: [entities.PermitApplication.fields.provisional_fee_cents, calculations.permit_fee_assessment]
        distinguishing_aspect: "provisional_fee_cents is server-computed as the flat RESEARCH base (15000) regardless of crew_size: crew 1 and crew 99 both yield 15000."
        test_recipe:
          setup: ["One unit; one FINAL COMPATIBLE RESEARCH determination."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
          trigger:
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 1, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { prov_a: $.data.provisional_fee_cents }
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-2", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 99, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "app-2"
              captures: { prov_b: $.data.provisional_fee_cents }
          assert:
            - "crew 1 permit: provisional_fee_cents == 15000"
            - "crew 99 permit: provisional_fee_cents == 15000 (crew size ignored by the provisional variant)"
      - name: volunteer_cleared_on_stamps_logical_clock_date
        claim_type: system_fields
        grounds: [entities.Volunteer.fields.cleared_on, state_machines.Volunteer.PENDING_to_CLEARED]
        distinguishing_aspect: "clear-background stamps cleared_on with the current LOGICAL clock date (2026-09-12), not wall-clock."
        test_recipe:
          setup: ["One registered volunteer (PENDING); logical clock advanced to 2026-09-12."]
          setup_api_calls:
            - call: "POST /refuge/volunteers"
              payload: { full_name: "Vol One", email: "v1@x.com" }
              as: Anonymous
              captures: { v1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: RefugeManager
          trigger:
            - call: "POST /refuge/volunteers/${v1}/clear-background"
              payload: {}
              as: VolunteerCoordinator
              captures: { cleared: $.data.cleared_on, st: $.data.background_status }
          assert:
            - "background_status == CLEARED"
            - "cleared_on == 2026-09-12 (logical clock date)"
      - name: citation_points_computed_from_severity
        claim_type: computed_fields
        grounds: [entities.Citation.fields.points, calculations.compliance_point_deduction]
        distinguishing_aspect: "Citation.points is server-computed from severity (MAJOR -> 25); a permit-subject citation changes no permit field."
        test_recipe:
          setup: ["One unit; FINAL COMPATIBLE RESEARCH determination; one APPROVED permit (assessed 21000, unpaid)."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 4, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { p1: $.data.id }
            - call: "POST /refuge/permits/${p1}/return-for-revision"
              payload: { note: "n" }
              as: PermitOfficer
            - call: "POST /refuge/permits/${p1}/resubmit"
              payload: {}
              as: PermitApplicant
              as_user_id: "app-1"
            - call: "POST /refuge/permits/${p1}/approve"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /refuge/citations"
              payload: { severity: "MAJOR", note: "Off-trail intrusion", subject_permit_id: "${p1}" }
              as: LawEnforcementOfficer
              captures: { pts: $.data.points, cit1: $.data.id }
            - call: "GET /refuge/permits/${p1}"
              as: PermitOfficer
              captures: { p_st: $.data.status }
          assert:
            - "citation.points == 25 (computed from MAJOR)"
            - "permit status unchanged == APPROVED (permit-subject citations have no status or fee side effect)"
      - name: determination_unresolved_count_tracks_comments
        claim_type: computed_fields
        grounds: [entities.CompatibilityDetermination.fields.unresolved_comment_count]
        distinguishing_aspect: "unresolved_comment_count increments per submitted comment (2) and decrements on adjudication (back to 1)."
        test_recipe:
          setup: ["One determination in PUBLIC_COMMENT (clock 2026-09-06 inside window)."]
          setup_api_calls:
            - call: "POST /refuge/determinations"
              payload: { use_type: "PHOTOGRAPHY", title: "Photo use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /refuge/determinations/${d1}/comments"
              payload: { author_name: "A", body: "first" }
              as: Anonymous
              captures: { cm1: $.data.id }
            - call: "POST /refuge/determinations/${d1}/comments"
              payload: { author_name: "B", body: "second" }
              as: Anonymous
            - call: "GET /refuge/determinations/${d1}"
              as: PermitOfficer
              captures: { n2: $.data.unresolved_comment_count }
            - call: "POST /refuge/comments/${cm1}/adjudicate"
              payload: { disposition: "ACCEPTED" }
              as: PermitOfficer
            - call: "GET /refuge/determinations/${d1}"
              as: PermitOfficer
              captures: { n1: $.data.unresolved_comment_count }
          assert:
            - "after two comments: unresolved_comment_count == 2"
            - "after one adjudication: unresolved_comment_count == 1"
      - name: permit_read_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent permit UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /refuge/permits/00000000-0000-0000-0000-000000000000"
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"
      - name: agreement_reachable_via_winning_bid_filter
        claim_type: parent_relationships
        grounds: [entities.CooperativeAgreement.fields.winning_bid_id, "endpoints[GET /refuge/cooperative-agreements]"]
        distinguishing_aspect: "The cascade-created agreement is discoverable only through the filtered list: GET /refuge/cooperative-agreements?winning_bid_id=<bid> returns exactly one agreement copying unit and window from the offering."
        test_recipe:
          setup: ["One awarded offering with winning bid b1 (GRAZING determination FINAL COMPATIBLE)."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "South Pasture", habitat_type: "GRASSLAND", acreage: 3000 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "GRAZING", title: "Grazing compatibility", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { dg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/management-units/${u1}/grazing-offerings"
              payload: { description: "Winter grazing", aum_cap: 100, grazing_window_start: "2026-11-01", grazing_window_end: "2027-02-28", application_deadline: "2026-10-01", min_stewardship_rating: 5 }
              as: Biologist
              captures: { off1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/bids"
              payload: { cooperator_ref: "coop-1", rate_cents_per_aum: 2000, stewardship_rating: 7 }
              as: Cooperator
              as_user_id: "coop-1"
              captures: { b1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/close-and-select"
              payload: {}
              as: RefugeManager
          trigger:
            - call: "GET /refuge/cooperative-agreements"
              payload: { winning_bid_id: "${b1}" }
              as: RefugeManager
              captures: { ag_unit: "$.data[0].management_unit_id", ag_st: "$.data[0].status", ag_coop: "$.data[0].cooperator_ref" }
          assert:
            - "exactly one agreement is returned for winning_bid_id ${b1}"
            - "agreement.management_unit_id == ${u1} (copied from offering)"
            - "agreement.cooperator_ref == coop-1 (copied from winning bid); status == ACTIVE"
  - section: state_machines
    instances:
      - name: finalize_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CompatibilityDetermination.ADJUDICATION_to_FINAL, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "finalize is only legal from ADJUDICATION; from DRAFT it returns ERR_INVALID_STATE (409) and the determination stays DRAFT."
        test_recipe:
          setup: ["One DRAFT determination."]
          setup_api_calls:
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
      - name: open_comment_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.CompatibilityDetermination.DRAFT_to_PUBLIC_COMMENT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating open-comment once the window is open is rejected (second call sees PUBLIC_COMMENT, not DRAFT)."
        test_recipe:
          setup: ["One determination in PUBLIC_COMMENT."]
          setup_api_calls:
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
      - name: adjudicate_twice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PublicComment.SUBMITTED_to_ADJUDICATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ADJUDICATED is terminal for comments: a second adjudicate on the same comment is rejected even while the determination is still in PUBLIC_COMMENT."
        test_recipe:
          setup: ["Determination in PUBLIC_COMMENT with one comment already adjudicated."]
          setup_api_calls:
            - call: "POST /refuge/determinations"
              payload: { use_type: "PHOTOGRAPHY", title: "Photo use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /refuge/determinations/${d1}/comments"
              payload: { author_name: "A", body: "comment" }
              as: Anonymous
              captures: { cm1: $.data.id }
            - call: "POST /refuge/comments/${cm1}/adjudicate"
              payload: { disposition: "NOTED" }
              as: PermitOfficer
          trigger:
            - call: "POST /refuge/comments/${cm1}/adjudicate"
              payload: { disposition: "REJECTED" }
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409 (terminal lockdown)"
      - name: approve_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PermitApplication.UNDER_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve requires UNDER_REVIEW; calling it on a fresh SUBMITTED permit (skipping the revision loop) is rejected even when the determination is FINAL and COMPATIBLE."
        test_recipe:
          setup: ["One unit; FINAL COMPATIBLE RESEARCH determination; one SUBMITTED permit."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 4, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /refuge/permits/${p1}/approve"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409; assessed_fee_cents remains null"
      - name: revoke_terminal_lockdown_then_pay_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PermitApplication.APPROVED_to_REVOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal: after revoking an APPROVED permit, its pay endpoint rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["One APPROVED RESEARCH permit (assessed 21000), then revoked by the officer."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 4, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { p1: $.data.id }
            - call: "POST /refuge/permits/${p1}/return-for-revision"
              payload: { note: "n" }
              as: PermitOfficer
            - call: "POST /refuge/permits/${p1}/resubmit"
              payload: {}
              as: PermitApplicant
              as_user_id: "app-1"
            - call: "POST /refuge/permits/${p1}/approve"
              payload: {}
              as: PermitOfficer
            - call: "POST /refuge/permits/${p1}/revoke"
              payload: { reason: "False statements in application" }
              as: PermitOfficer
              captures: { st: $.data.status }
          trigger:
            - call: "POST /refuge/permits/${p1}/pay"
              payload: { amount_cents: 21000 }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { err: $.data.error_id }
          assert:
            - "revoke succeeds: status == REVOKED"
            - "subsequent pay -> error_id == ERR_INVALID_STATE, http 409"
      - name: treatment_start_before_window_opens_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.HabitatTreatment.WINDOW_OPEN_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start requires WINDOW_OPEN; at the default clock (2026-09-01) with a future window the treatment is still SCHEDULED and start is rejected."
        test_recipe:
          setup: ["One unit; one treatment windowed 2026-10-01..2026-10-10 (SCHEDULED at default clock)."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Prairie Unit", habitat_type: "GRASSLAND", acreage: 800 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "INVASIVE_CONTROL", window_start: "2026-10-01", window_end: "2026-10-10" }
              as: Biologist
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /refuge/treatments/${t1}/start"
              payload: {}
              as: Biologist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409 (treatment is SCHEDULED, not WINDOW_OPEN)"
      - name: closure_lift_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FacilityClosure.ACTIVE_to_LIFTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "lift requires ACTIVE; a SCHEDULED closure cannot be lifted."
        test_recipe:
          setup: ["One unit; one SCHEDULED closure."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/closures"
              payload: { closure_type: "MIGRATION", scope: "FULL", start_date: "2026-10-09", end_date: "2026-10-20" }
              as: Biologist
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /refuge/closures/${c1}/lift"
              payload: {}
              as: Biologist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
