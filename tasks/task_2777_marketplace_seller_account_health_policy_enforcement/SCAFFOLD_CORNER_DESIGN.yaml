              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-LOCK-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The listing text was corrected before any order shipped and the buyer report was withdrawn." }
              as: Seller
