        distinguishing_aspect: "COMPLETED requires now >= started_at + 28 days inclusive: at +10 days it fails ERR_PEP_COURSE_INCOMPLETE (422); at exactly +28 days it succeeds."
        test_recipe:
          setup: ["Employee; MEDIUM case exposure 2026-07-30T10:00:00Z; PEP STARTED at 2026-08-01T12:00:00Z (clock then 2026-08-01T12:00:00Z)"]
