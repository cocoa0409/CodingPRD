            - { call: "POST /adjudication-matrices/${m1_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "T", department: "D", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Xc Three", email: "xc3@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
