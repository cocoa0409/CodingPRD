            - "Customer.${cust}.ar_balance_cents == 5400"
            - "Customer.${cust}.ar_status == ACTIVE"
            - "Order.${o2}.credit_status == PENDING"

      - name: approve_credit_cascade_order_to_lots_depth2
        grounds:
          - state_machines.Order.SUBMITTED_to_SUBMITTED
          - entities.InventoryLot.fields.reserved_splits
          - entities.Customer.fields.ar_balance_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (approve-credit): the approval reserves stock so the allocated
          InventoryLot.reserved_splits is increased (link1), and the order's computed total then debits
          Customer.ar_balance (link2 — the AR debit is caused by the totals produced during the same approval).
        test_recipe:
          setup:
            - "Customer C credit_limit 100000, ar_balance 0; one lot of 24 splits."
            - "Order O delivery 2026-06-17, CASE line qty 2 (24 splits) of P (spc 12, tier (1,2400)) -> total 4800."
            - "Order submitted; approve-credit reserves the lot and debits AR by the order total."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 24 }
              as: WarehouseOp
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 2 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
          assert:
            - "InventoryLot.${lot}.reserved_splits == 24"
            - "Order.${order}.order_total_cents == 4800"
            - "Customer.${cust}.ar_balance_cents == 4800"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: forbidden_role_beats_invalid_state_auth_vs_state
        grounds:
          - validations[priority=2]
          - validations[priority=7]
          - errors[ERR_FORBIDDEN_FOR_ROLE]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A SalesRep (not permitted) calls approve-credit on an order that is also not PENDING-eligible (still DRAFT);
          auth (priority 2, ERR_FORBIDDEN_FOR_ROLE) outranks state (priority 7, ERR_INVALID_STATE). Category pair auth vs state.
        test_recipe:
          setup:
            - "A DRAFT order O exists (created, one line, not submitted). approve-credit requires CreditManager."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
