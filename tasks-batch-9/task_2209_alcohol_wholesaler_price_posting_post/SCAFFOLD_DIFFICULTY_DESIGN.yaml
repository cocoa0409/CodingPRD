            - "PriceScheduleItem.${item_a}.amendment_count is still 1 after the rejection"
            - "Wholesaler.${wh_a}.frivolous_amendment_count == 1"
            - "Wholesaler.${wh_a}.amendment_penalty_accrued_cents == 0 because the penalty only accrues at a count of 3"

  - rule_id: transitive_cascade
    instances:
      - name: posting_run_supersession_cascades_from_new_item_through_tier_to_prior_schedule
        grounds:
          - state_machines.PriceSchedule.POSTED_to_EFFECTIVE
          - state_machines.PriceSchedule.EFFECTIVE_to_SUPERSEDED
          - entities.PriceScheduleItem.fields.supersedes_item_id
          - entities.QuantityDiscountTier.fields.status
          - entities.PriceSchedule.fields.superseded_by_schedule_id
          - calculations.posted_case_price_resolution
        distinguishing_aspect: |
          This cascade is triggered by POST /posting-runs and runs four links deep through four different records,
          each caused by the one before it: the September item becomes EFFECTIVE, which supersedes the August item of
          the same posting key, which deactivates that August item's tier, which — because it was the schedule's only
          item — flips the August schedule itself to SUPERSEDED. Nothing but the September schedule was named in the
          request, so none of links two, three or four can be reached by writing the request's target directly.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (hold_window_days 3, posting_deadline_day 10)."
            - "Wholesaler A with a filing agent, a certifying officer and an APPROVED brand Rio Reserve."
            - "Schedule AUG for posting month 2026-08 (effective_date 2026-09-01T00:00:00.000Z) carries exactly one item, the 750 ml / 12 per case pack at case 120000 / unit 11000; submitted on time and certified at 2026-08-01T00:00:00Z, so its hold window ends 2026-08-04T00:00:00.000Z."
            - "That August item carries one ACTIVE quantity discount tier at min_cases 5 and discount_pct 0.10, so discounted_case_price_cents is 108000."
            - "Schedule SEP for posting month 2026-09 (effective_date 2026-10-01T00:00:00.000Z) carries exactly one item with the SAME posting key — same wholesaler, program, brand name, beverage class, 750 ml and 12 per case — at case 125000 / unit 12000; also submitted on time and certified at 2026-08-01T00:00:00Z."
            - "The clock moves to 2026-09-01T00:00:00Z and a first posting run makes only schedule AUG EFFECTIVE, because schedule SEP's effective_date has not been reached; no item is superseded by that first run."
            - "The clock then moves to 2026-10-01T00:00:00Z, which is schedule SEP's effective_date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-08" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_aug: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_aug}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_aug: $.data.id }
            - call: "POST /price-schedules/${sched_aug}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules/${sched_aug}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_a}"
            - call: "POST /quantity-discount-tiers"
              payload: { item_id: "${item_aug}", min_cases: 5, discount_pct: 0.10 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { tier_aug: $.data.id }
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_sep: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_sep}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 125000, unit_price_cents: 12000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_sep: $.data.id }
            - call: "POST /price-schedules/${sched_sep}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules/${sched_sep}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /posting-runs"
              payload: { state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { first_run_effective: $.data.effective_schedule_ids, first_run_superseded: $.data.superseded_schedule_ids }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /posting-runs"
              payload: { state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { run_count: $.data.processed_schedule_count, run_effective: $.data.effective_schedule_ids, run_superseded: $.data.superseded_schedule_ids }
          assert:
            - "the first posting run returned effective_schedule_ids containing only ${sched_aug} and superseded_schedule_ids empty, so no link of the cascade had fired before the trigger"
            - "the trigger returns 200 with processed_schedule_count == 1"
            - "link 1: PriceScheduleItem.${item_sep}.status == EFFECTIVE and PriceSchedule.${sched_sep}.status == EFFECTIVE"
            - "link 2: PriceScheduleItem.${item_aug}.status == SUPERSEDED and PriceScheduleItem.${item_sep}.supersedes_item_id == ${item_aug}"
            - "link 3: QuantityDiscountTier.${tier_aug}.status == INACTIVE while QuantityDiscountTier.${tier_aug}.discounted_case_price_cents is still 108000, so only the status moved"
            - "link 4: PriceSchedule.${sched_aug}.status == SUPERSEDED and PriceSchedule.${sched_aug}.superseded_by_schedule_id == ${sched_sep}"
            - "the trigger response reports superseded_schedule_ids containing exactly ${sched_aug} and effective_schedule_ids containing exactly ${sched_sep}"
            - "PriceSchedule.${sched_sep}.superseded_by_schedule_id == null and PriceScheduleItem.${item_aug}.supersedes_item_id == null"
            - "GET /price-schedule-items/${item_aug}/posted-price with as_of 2026-10-01T00:00:00Z and variant as_amended returns resolved_item_id == ${item_sep} and posted_case_price_cents == 125000"
            - "GET /price-schedule-items?supersedes_item_id=${item_aug} returns total_count == 1 with data[0].id == ${item_sep}"
            - "GET /quantity-discount-tiers?item_id=${item_aug}&status=ACTIVE returns total_count == 0"

      - name: second_approved_correction_cascades_from_schedule_counter_into_the_wholesaler_penalty_ledger
        grounds:
          - state_machines.ErrorCorrection.SUBMITTED_to_APPROVED
          - entities.PriceSchedule.fields.correction_count
          - entities.Wholesaler.fields.correction_penalty_accrued_cents
          - entities.Wholesaler.fields.penalty_exposure_cents
          - calculations.wholesaler_penalty_exposure
          - entities.StateProgram.fields.repeat_correction_penalty_cents
        distinguishing_aspect: |
          This cascade is triggered by POST /error-corrections/{id}/approve and crosses three records without a single
          fan-out: the approval writes the item, the item's write raises the SCHEDULE's correction_count to 2, and only
          because that counter reached 2 does the WHOLESALER's correction_penalty_accrued_cents move to 100000 and its
          penalty_exposure_cents follow. The identical approval on the same schedule one correction earlier left both
          wholesaler fields at 0, which proves link two is caused by the counter and not by the approval.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (max_corrections_per_schedule 2, repeat_correction_penalty_cents 100000, correction_window_days 15)."
            - "Wholesaler A with a filing agent, a certifying officer and an APPROVED brand Rio Reserve."
            - "One schedule for posting month 2026-09 carrying two items: item A (750 ml / 12 per case) at case 120000 / unit 11000 and item C (375 ml / 24 per case) at case 30000 / unit 1500; submitted on time and certified at 2026-08-01T00:00:00Z, so both items are POSTED and the correction window runs to 2026-08-16T00:00:00Z."
            - "Item A carries one ACTIVE quantity discount tier at min_cases 5 and discount_pct 0.10."
            - "A first error correction on item A to case 114000 / unit 10500 (variance_pct 0.05) has already been APPROVED, so the schedule's correction_count is 1 and the tier reads 102600."
            - "A second error correction on item C to case 28500 / unit 1425 (variance_pct 0.05) is filed and still SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 375, bottles_per_case: 24, case_price_cents: 30000, unit_price_cents: 1500 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_c: $.data.id }
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules/${sched_a}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_a}"
            - call: "POST /quantity-discount-tiers"
              payload: { item_id: "${item_a}", min_cases: 5, discount_pct: 0.10 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { tier_a: $.data.id }
            - call: "POST /error-corrections"
              payload: { item_id: "${item_a}", corrected_case_price_cents: 114000, corrected_unit_price_cents: 10500, reason: "Case price keyed from the wrong supplier quote sheet." }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { corr_1: $.data.id }
            - call: "POST /error-corrections/${corr_1}/approve"
              as: ComplianceOfficer
            - call: "GET /wholesalers/${wh_a}"
              as: ComplianceOfficer
              captures: { accrued_after_first: $.data.correction_penalty_accrued_cents, version_after_first: $.data.version }
            - call: "POST /error-corrections"
              payload: { item_id: "${item_c}", corrected_case_price_cents: 28500, corrected_unit_price_cents: 1425, reason: "375 ml case price transposed with the six pack price." }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { corr_2: $.data.id }
          trigger:
            - call: "POST /error-corrections/${corr_2}/approve"
              as: ComplianceOfficer
              captures: { corr_2_status: $.data.status }
          assert:
            - "after the FIRST approval the setup read showed Wholesaler.${wh_a}.correction_penalty_accrued_cents == 0 and Wholesaler.${wh_a}.version == 1, so nothing had cascaded to the wholesaler yet"
            - "the trigger returns 200 with ErrorCorrection.${corr_2}.status == APPROVED"
            - "link 1: PriceScheduleItem.${item_c}.case_price_cents == 28500, PriceScheduleItem.${item_c}.unit_price_cents == 1425 and PriceScheduleItem.${item_c}.correction_count == 1"
            - "link 2: PriceSchedule.${sched_a}.correction_count == 2"
            - "link 3: Wholesaler.${wh_a}.correction_penalty_accrued_cents == 100000"
            - "link 4: Wholesaler.${wh_a}.penalty_exposure_cents == 100000 and Wholesaler.${wh_a}.version == 2"
            - "GET /wholesalers/${wh_a}/penalty-exposure with variant assessed_exposure returns accrued_cents == 100000, provisional_cents == 0 and exposure_cents == 100000"
            - "PriceScheduleItem.${item_a}.case_price_cents == 114000 and PriceScheduleItem.${item_a}.correction_count == 1, untouched by the second approval"
            - "QuantityDiscountTier.${tier_a}.discounted_case_price_cents == 102600, because item C carries no tier and the recompute follows the corrected item only"
            - "Wholesaler.${wh_a}.late_filing_penalty_accrued_cents == 0 and Wholesaler.${wh_a}.assessed_penalty_cents == 0, so the 100000 in penalty_exposure_cents comes only from the correction bucket"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_license_business_safety_outranks_the_unregistered_brand_prerequisite_on_submit
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.PriceSchedule.DRAFT_to_SUBMITTED
          - entities.Wholesaler.fields.license_status
          - entities.Brand.fields.registration_status
        distinguishing_aspect: |
          The pair pitted here is business_safety (priority 9, ERR_LICENSE_NOT_ACTIVE) against business_prerequisite
          (priority 10, ERR_BRAND_NOT_REGISTERED) on one POST /price-schedules/{id}/submit where BOTH are violated:
          the licence is SUSPENDED and the only item's brand is still PENDING. Clearing the licence alone leaves the
          same request answering ERR_BRAND_NOT_REGISTERED, which proves the brand rule was live during the first
          refusal and that the ordering, not the absence of the second defect, chose the answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (posting_deadline_day 10)."
            - "Wholesaler A with a filing agent."
            - "Brand Rio Reserve is registered for 2026-01-01T00:00:00Z through 2027-12-31T23:59:59Z but has NOT been approved, so its registration_status is PENDING."
            - "A DRAFT schedule for posting month 2026-08 (effective_date 2026-09-01T00:00:00.000Z) carries one item on that PENDING brand, so the priority 19 cardinality rule is satisfied."
            - "The wholesaler's licence is then set to SUSPENDED, so priorities 9 and 10 are simultaneously violated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-08" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /wholesalers/${wh_a}/license-status"
              payload: { license_status: "SUSPENDED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { first_error: $.data.error_id }
            - call: "POST /wholesalers/${wh_a}/license-status"
              payload: { license_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { second_error: $.data.error_id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { final_status: $.data.status, final_is_late: $.data.is_late }
          assert:
            - "the first submit returns HTTP 409 with error_id == ERR_LICENSE_NOT_ACTIVE, not ERR_BRAND_NOT_REGISTERED"
            - "after the first refusal PriceSchedule.${sched_a}.status == DRAFT, PriceSchedule.${sched_a}.filed_at == null and PriceSchedule.${sched_a}.filed_by_user_id == null"
            - "the second submit, with the licence back to ACTIVE and nothing else changed, returns HTTP 409 with error_id == ERR_BRAND_NOT_REGISTERED, which proves priority 10 was also violated during the first refusal"
            - "after the second refusal PriceSchedule.${sched_a}.status == DRAFT and Brand.${brand_a}.registration_status == PENDING"
            - "the third submit returns HTTP 200 with status == SUBMITTED and is_late == false, because 2026-08-01T00:00:00Z precedes the 2026-08-10T23:59:59.999Z deadline"
            - "Wholesaler.${wh_a}.late_filing_penalty_accrued_cents == 0 and Wholesaler.${wh_a}.penalty_exposure_cents == 0"
            - "PriceScheduleItem.${item_a}.status == DRAFT because submission does not post items"

      - name: already_approved_correction_state_outranks_the_exhausted_schedule_correction_quota
        grounds:
          - validations[priority=8]
          - validations[priority=18]
          - state_machines.ErrorCorrection.SUBMITTED_to_APPROVED
