# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_3308
# Multi-Brand Home Services Franchise Umbrella & Territory Administration
#
# Breadth probe over the claim-extraction-guide's nine sections. Every claim the
# §1.1-§1.7 surface declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not
# already exercise. Corners §1.8 already covers appear as `excluded_because:`
# stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: brand_create_returns_all_declared_fields_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Brand
          - endpoints.POST_/franchise/brands
        distinguishing_aspect: "A brand created with the seven required fields plus an empty fee table comes back 201 with status ACTIVE, version 1, and server-minted id / created_at / updated_at; every declared field round-trips."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchiseAdmin
          trigger:
            - call: "POST /franchise/brands"
              payload: { brand_code: "MS", display_name: "Mosaic Plumbing", trade: "PLUMBING", royalty_rate: 0.06, national_ad_fund_rate: 0.01, min_certification_level: "APPRENTICE", audit_cycle_months: 12 }
              as: FranchiseAdmin
              captures: { brand_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Brand.${brand_id}.brand_code == \"MS\" and trade == PLUMBING"
            - "Brand.${brand_id}.royalty_rate == 0.06 and national_ad_fund_rate == 0.01"
            - "Brand.${brand_id}.min_certification_level == APPRENTICE and audit_cycle_months == 12"
            - "Brand.${brand_id}.status == ACTIVE and version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: franchisee_get_returns_the_stored_aggregate_with_its_basis
        claim_type: Retrieval
        grounds:
          - entities.Franchisee
          - endpoints.GET_/franchise/franchisees/{id}
          - entities.Franchisee.fields.standards_score_basis
        distinguishing_aspect: "Every Franchisee aggregate field round-trips through GET exactly as it stands after one agreement is activated, including standards_score_basis which reads AUDIT_BASED while exactly one agreement is held."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Franchisee Mosaic Central LLC holds one ACTIVE agreement for brand MS."
          setup_api_calls:
            - *k_clock
            - &k_fr
              call: "POST /franchise/franchisees"
              payload: { legal_name: "Mosaic Central LLC", principal_name: "Dana Vaughn", entity_type: "LLC", shared_services_enrolled: true }
              as: FranchiseAdmin
              captures: { fr_id: $.data.id }
            - &k_brand_ms
              call: "POST /franchise/brands"
              payload: { brand_code: "MS", display_name: "Mosaic Plumbing", trade: "PLUMBING", royalty_rate: 0.06, national_ad_fund_rate: 0.01, min_certification_level: "APPRENTICE", audit_cycle_months: 12 }
              as: FranchiseAdmin
              captures: { ms_brand_id: $.data.id }
            - &k_ter
              call: "POST /franchise/territories"
              payload: { territory_code: "MS-01", brand_id: "${ms_brand_id}", household_count: 30000, postal_codes: ["75001", "75002"], expansion_right_households: 40000, protected: true, franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
              captures: { ter_ms_id: $.data.id }
            - &k_agt
              call: "POST /franchise/agreements"
              payload: { agreement_number: "A-MS-01", franchisee_id: "${fr_id}", brand_id: "${ms_brand_id}", territory_id: "${ter_ms_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "JOURNEYMAN" }
              as: FranchiseAdmin
              captures: { agt_id: $.data.id }
            - call: "POST /franchise/territories/${ter_ms_id}/offer"
              payload: { franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_v: $.data.version }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_v}" }
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/activate"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "GET /franchise/franchisees/${fr_id}"
              payload: {}
              as: FranchiseAdmin
          assert:
            - "the response status is 200 and response_type is object"
            - "Franchisee.${fr_id}.status == ACTIVE and entity_type == LLC"
            - "Franchisee.${fr_id}.shared_services_enrolled == true"
            - "Franchisee.${fr_id}.active_brand_count == 1 and active_agreement_count == 1"
            - "Franchisee.${fr_id}.allocated_households == 30000"
            - "Franchisee.${fr_id}.standards_score_basis == AUDIT_BASED"
            - "Franchisee.${fr_id}.lead_cost_balance_cents == 0"

      - name: agreements_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/franchise/agreements
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three agreements for one franchisee, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One franchisee holding three DRAFT agreements across brands MS, IL and RV."
          setup_api_calls:
            - *k_clock
            - *k_fr
            - *k_brand_ms
            - &k_brand_il
              call: "POST /franchise/brands"
              payload: { brand_code: "IL", display_name: "Illume Electric", trade: "ELECTRICAL", royalty_rate: 0.06, national_ad_fund_rate: 0.01, min_certification_level: "JOURNEYMAN", audit_cycle_months: 12 }
              as: FranchiseAdmin
              captures: { il_brand_id: $.data.id }
            - &k_brand_rv
              call: "POST /franchise/brands"
              payload: { brand_code: "RV", display_name: "Revive Restoration", trade: "RESTORATION", royalty_rate: 0.07, national_ad_fund_rate: 0.015, min_certification_level: "MASTER", audit_cycle_months: 6 }
              as: FranchiseAdmin
              captures: { rv_brand_id: $.data.id }
            - &k_ter_ms
              call: "POST /franchise/territories"
              payload: { territory_code: "MS-01", brand_id: "${ms_brand_id}", household_count: 30000, postal_codes: ["75001"], expansion_right_households: 40000, protected: true, franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
              captures: { ter_ms_id: $.data.id }
            - &k_ter_il
              call: "POST /franchise/territories"
              payload: { territory_code: "IL-01", brand_id: "${il_brand_id}", household_count: 20000, postal_codes: ["77001"], expansion_right_households: 30000, protected: true, franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
              captures: { ter_il_id: $.data.id }
            - &k_ter_rv
              call: "POST /franchise/territories"
              payload: { territory_code: "RV-01", brand_id: "${rv_brand_id}", household_count: 10000, postal_codes: ["78001"], expansion_right_households: 15000, protected: true, franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
              captures: { ter_rv_id: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { agreement_number: "A-MS-01", franchisee_id: "${fr_id}", brand_id: "${ms_brand_id}", territory_id: "${ter_ms_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "JOURNEYMAN" }
              as: FranchiseAdmin
            - call: "POST /franchise/agreements"
              payload: { agreement_number: "A-IL-01", franchisee_id: "${fr_id}", brand_id: "${il_brand_id}", territory_id: "${ter_il_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "MASTER" }
              as: FranchiseAdmin
            - call: "POST /franchise/agreements"
              payload: { agreement_number: "A-RV-01", franchisee_id: "${fr_id}", brand_id: "${rv_brand_id}", territory_id: "${ter_rv_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "MASTER" }
              as: FranchiseAdmin
          trigger:
            - call: "GET /franchise/agreements"
              payload: { franchisee_id: "${fr_id}", limit: 2, offset: 0 }
              as: FranchiseAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /franchise/agreements?franchisee_id=${fr_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /franchise/agreements?brand_id=${rv_brand_id} returns exactly 1 row"
            - "GET /franchise/agreements?lifecycle_status=DRAFT returns 3 rows"
            - "GET /franchise/agreements with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: agreement_get_with_an_unknown_id_returns_agreement_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/franchise/agreements/{id}
          - errors.ERR_AGREEMENT_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unallocated id in the path produces the entity-specific 404 ERR_AGREEMENT_NOT_FOUND, not a generic not-found and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No agreement has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /franchise/agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FranchiseAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_AGREEMENT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: work_order_create_without_parts_defaults_parts_and_revenue_to_zero
        claim_type: Defaults
        grounds:
          - entities.WorkOrder.fields.parts_cents
          - entities.WorkOrder.fields.revenue_cents
          - endpoints.POST_/franchise/work-orders
        distinguishing_aspect: "parts_cents declares a default of 0, so omitting it stores 0 rather than null, and a DIRECT STANDARD work order completed at its dispatched instant bills only labor."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS is ACTIVE with certification JOURNEYMAN."
          setup_api_calls:
            - *k_clock
            - *k_fr
            - *k_brand_ms
            - *k_ter_ms
            - *k_agt
            - call: "POST /franchise/territories/${ter_ms_id}/offer"
              payload: { franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_v: $.data.version }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_v}" }
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/activate"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "POST /franchise/work-orders"
              payload: { agreement_id: "${agt_id}", source: "DIRECT", priority: "STANDARD", service_level_hours: 2 }
              as: FranchiseAdmin
              captures: { wo_id: $.data.id }
            - call: "POST /franchise/work-orders/${wo_id}/dispatch"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_id}"
            - call: "POST /franchise/work-orders/${wo_id}/start"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_id}"
            - call: "POST /franchise/work-orders/${wo_id}/complete"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_id}"
          assert:
            - "WorkOrder.${wo_id}.parts_cents == 0, not null"
            - "WorkOrder.${wo_id}.labor_cents == 29000"
            - "WorkOrder.${wo_id}.revenue_cents == 29000"
            - "the response status is 200 and WorkOrder.${wo_id}.status == COMPLETED"

      - name: expired_territory_status_is_recomputed_on_clock_advance
        claim_type: Computed Fields
        grounds:
          - entities.FranchiseAgreement.fields.expires_on
          - endpoints.GET_/franchise/agreements/{id}
          - state_machines.FranchiseAgreement.ACTIVE_to_EXPIRED
        distinguishing_aspect: "expires_on is computed from signed_on and initial_term_months and is never taken from input: a 12-month agreement signed 2026-09-01T00:00:00Z reads 2027-09-01T00:00:00Z, and the clock at 2027-08-31T23:59:59Z still refuses the expire with ERR_AGREEMENT_NOT_EXPIRABLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS is ACTIVE, signed 2026-09-01T00:00:00Z with initial_term_months 12."
          setup_api_calls:
            - *k_clock
            - *k_fr
            - *k_brand_ms
            - *k_ter_ms
            - *k_agt
            - call: "POST /franchise/territories/${ter_ms_id}/offer"
              payload: { franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_v: $.data.version }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_v}" }
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/activate"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "GET /franchise/agreements/${agt_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { expires: $.data.expires_on }
          assert:
            - "the response status is 200"
            - "Agreement.${agt_id}.expires_on == 2027-09-01T00:00:00Z, derived from signed_on plus 12 calendar months"
            - "at the current clock the expire call returns 422 with error_id == ERR_AGREEMENT_NOT_EXPIRABLE, and Agreement.${agt_id}.lifecycle_status is still ACTIVE"
            - "expires_on is derived, not stored: it advances by exactly the same number of calendar months as initial_term_months on every read"

      - name: franchisee_create_ignores_client_supplied_status_and_version
        claim_type: System Fields
        grounds:
          - entities.Franchisee.fields.status
          - endpoints.POST_/franchise/franchisees
        distinguishing_aspect: "Franchisee.status is source: system with initial state PROSPECT, and version starts at 1; the create endpoint declares neither as input."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Mosaic Central LLC", principal_name: "Dana Vaughn", entity_type: "LLC", shared_services_enrolled: true }
              as: FranchiseAdmin
              captures: { fr_id: $.data.id }
            - call: "GET /franchise/franchisees/${fr_id}"
              payload: {}
              as: FranchiseAdmin
          assert:
            - "the create response status is 201"
            - "Franchisee.${fr_id}.status == PROSPECT and version == 1, both server-assigned"
            - "Franchisee.${fr_id}.active_agreement_count == 0 and allocated_households == 0"
            - "Franchisee.${fr_id}.lead_cost_balance_cents == 0"
            - "Franchisee.${fr_id}.created_at equals meta.api_request_timestamp of the create response, so the system field was stamped and not client-supplied"
            - "GET /franchise/franchisees?status=PROSPECT returns exactly 1 row"

      - name: brand_create_with_an_out_of_enum_trade_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Brand.fields.trade
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "trade is a closed seven-member enum, so a value such as ROOFING is rejected at priority 3 with 400 ERR_INVALID_REQUEST rather than being stored and later failing a certification comparison."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /franchise/brands"
              payload: { brand_code: "RF", display_name: "Ridge Roofing", trade: "ROOFING", royalty_rate: 0.06, national_ad_fund_rate: 0.01, min_certification_level: "APPRENTICE", audit_cycle_months: 12 }
              as: FranchiseAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_DUPLICATE_BRAND_CODE"
            - "GET /franchise/brands?trade=PLUMBING returns 0 rows and no Brand was persisted"

      - name: work_order_create_checks_fk_existence_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - endpoints.POST_/franchise/work-orders
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_ACCOUNT_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology puts every foreign key in the request body, and priority 5 checks them in the order the endpoint's input list declares — agreement_id before national_account_id. With BOTH unknown the answer is ERR_AGREEMENT_NOT_FOUND; with only national_account_id unknown it is ERR_ACCOUNT_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS is ACTIVE, so a valid agreement_id exists."
          setup_api_calls:
            - *k_clock
            - *k_fr
            - *k_brand_ms
            - *k_ter_ms
            - *k_agt
            - call: "POST /franchise/territories/${ter_ms_id}/offer"
              payload: { franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_v: $.data.version }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_v}" }
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/activate"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "POST /franchise/work-orders"
              payload: { agreement_id: "00000000-0000-4000-8000-000000000001", source: "NATIONAL_ACCOUNT", priority: "STANDARD", service_level_hours: 4, national_account_id: "00000000-0000-4000-8000-000000000002" }
              as: FranchiseAdmin
              captures: { error_both: $.data.error_id }
            - call: "POST /franchise/work-orders"
              payload: { agreement_id: "${agt_id}", source: "NATIONAL_ACCOUNT", priority: "STANDARD", service_level_hours: 4, national_account_id: "00000000-0000-4000-8000-000000000002" }
              as: FranchiseAdmin
              captures: { error_account: $.data.error_id }
          assert:
            - "the first request returns 404 and error_both == ERR_AGREEMENT_NOT_FOUND"
            - "error_both != ERR_ACCOUNT_NOT_FOUND"
            - "the second request returns 404 and error_account == ERR_ACCOUNT_NOT_FOUND"
            - "GET /franchise/work-orders?agreement_id=${agt_id} returns 0 rows"# ===========================================================================
  - section: state_machines
    instances:

      - name: territory_offer_from_reclaimed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Territory.transitions.DEFINED_to_OFFERED
          - errors.ERR_INVALID_STATE
          - validations[priority=6]
        distinguishing_aspect: "Territory RECLAIMED is terminal, so a later offer is refused with ERR_INVALID_STATE and no franchisee_id is written back onto the reclaimed row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Territory MS-01 is RECLAIMED, previously offered, awarded, suspended and reclaimed."
          setup_api_calls:
            - *k_clock
            - *k_fr
            - *k_brand_ms
            - *k_ter_ms
            - *k_agt
            - call: "POST /franchise/territories/${ter_ms_id}/offer"
              payload: { franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_v1: $.data.version }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_v1}" }
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt_id}/suspend"
              payload: { reason: "Standing down ahead of a reallocation" }
              as: FranchiseAdmin
            - call: "POST /franchise/territories/${ter_ms_id}/reclaim"
              payload: {}
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_v2: $.data.version }
          trigger:
            - call: "POST /franchise/territories/${ter_ms_id}/offer"
              payload: { franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_ALREADY_TERMINAL, because the transition is simply undeclared from RECLAIMED"
            - "Territory.${ter_ms_id}.status is still RECLAIMED and franchisee_id is null"

      - name: agreement_expire_before_term_end_returns_not_expirable
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FranchiseAgreement.transitions.ACTIVE_to_EXPIRED
          - errors.ERR_AGREEMENT_NOT_EXPIRABLE
          - validations[priority=10]
        distinguishing_aspect: "The ACTIVE to EXPIRED transition requires the logical clock to be at or past expires_on; one second earlier the same call is refused with 422 ERR_AGREEMENT_NOT_EXPIRABLE and leaves the agreement ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS is ACTIVE, signed 2025-09-01T00:00:00Z with a 12-month term, so expires_on is 2026-09-01T00:00:00Z — already reached at the current clock."
          setup_api_calls:
            - *k_clock
            - *k_fr
            - *k_brand_ms
            - *k_ter_ms
            - call: "POST /franchise/agreements"
              payload: { agreement_number: "A-MS-01", franchisee_id: "${fr_id}", brand_id: "${ms_brand_id}", territory_id: "${ter_ms_id}", signed_on: "2025-09-01T00:00:00Z", initial_term_months: 12, certification_level: "JOURNEYMAN" }
              as: FranchiseAdmin
              captures: { agt_id: $.data.id }
            - call: "POST /franchise/territories/${ter_ms_id}/offer"
              payload: { franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_v: $.data.version }
