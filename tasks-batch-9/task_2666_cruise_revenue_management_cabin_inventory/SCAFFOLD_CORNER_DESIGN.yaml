      - name: bid_gates_cover_the_window_the_floor_and_both_wrong_statuses
        claim_type: triggerable
        grounds:
          - errors[ERR_BID_WINDOW_CLOSED]
          - errors[ERR_BID_BELOW_FLOOR]
          - errors[ERR_BID_NOT_PENDING]
          - errors[ERR_BID_NOT_COUNTERED]
          - calculations.upgrade_bid_floor
          - validations[priority=16]
        distinguishing_aspect: |
          The bidding programme has four distinct refusals and they sit at three different
          priorities: too early or too late is temporal (priority 16), below the floor is fiscal
          (priority 20), and the two status errors are the state gate (priority 10) - rebid needs
          COUNTERED while counter and accept need SUBMITTED, so the pair cannot be collapsed into
          one code. The floor itself is exercised at its exact boundary: 32999 is refused and 33000
          is taken.
        test_recipe:
          setup:
            - "Clock at 2026-11-01T17:00:00Z and embark 2027-01-10T17:00:00Z, so days_to_sail starts at 70 - above BID_WINDOW_MAX_DAYS 60."
            - "Sailing BID-2701 (nights 7, total_lower_berths 200, final_payment_days_before 30) is OPEN_FOR_SALE with IA (guarantee, tier 1, upgrade_to OV, base 189995, onboard upper 6000) and OV (tier 2, base 289995, onboard upper 7000), both with allotments and 730..0 fare windows."
            - "Nell holds one two-adult booking on IA, so the derived floor is 40000 - 7000 == 33000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T17:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "OV", tier_rank: 2, max_occupancy: 4, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000 }
              as: RevenueManager
              captures: { cat_ov: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000, upgrade_to_category_id: "${cat_ov}" }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "BID-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 30, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_b: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_b}", cabin_category_id: "${cat_ov}", physical_cabins: 30, oversell_allowance: 0 }
              as: RevenueManager
