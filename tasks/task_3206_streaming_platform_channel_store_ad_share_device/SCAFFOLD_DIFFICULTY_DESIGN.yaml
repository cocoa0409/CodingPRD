            - "err_zero == ERR_INVALID_REQUEST: zero-length window rejected by shape validation before the overlap check"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: subscription_creation_gated_by_channel_publish_state
        grounds:
          - state_machines.Channel
          - state_machines.Subscription
          - validations[priority=7]
          - errors.ERR_CHANNEL_NOT_PUBLISHED
        distinguishing_aspect: |
          Entity pair Subscription -> Channel: a viewer can subscribe only while
          the channel is PUBLISHED. CERTIFIED (pre-publish) and SUSPENDED both
          reject with ERR_CHANNEL_NOT_PUBLISHED; PUBLISHED accepts.
        test_recipe:
          setup:
            - "Clock default. Publisher P, channel C carried to CERTIFIED (not yet published). Viewer V."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Gate Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Gate Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "gv@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 1000 }
              as: Viewer
              as_user_id: "${vw}"
              captures: { err_certified: $.data.error_id }
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 1000 }
              as: Viewer
              as_user_id: "${vw}"
              captures: { sub: $.data.id }
            - call: "POST /channels/${ch}/suspend"
              payload: { reason: "OPS" }
              as: PlatformAdmin
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 1000 }
              as: Viewer
              as_user_id: "${vw}"
              captures: { err_suspended: $.data.error_id }
          assert:
            - "err_certified == ERR_CHANNEL_NOT_PUBLISHED (CERTIFIED is not PUBLISHED)"
            - "Subscription ${sub} created 201 with billing_status ACTIVE once the channel is PUBLISHED"
            - "err_suspended == ERR_CHANNEL_NOT_PUBLISHED (SUSPENDED blocks new subscriptions; existing ${sub} stays ACTIVE)"

      - name: device_activation_gated_by_model_certification_and_compliance
        grounds:
          - state_machines.DeviceModel
          - state_machines.DeviceUnit
          - validations[priority=12]
          - errors.ERR_MODEL_NOT_CERTIFIED
          - errors.ERR_UPDATE_OVERDUE
        distinguishing_aspect: |
          Entity pair DeviceUnit -> DeviceModel: activation of a SOLD unit is
          rejected with ERR_MODEL_NOT_CERTIFIED while the model is SUBMITTED,
          succeeds once CERTIFIED, and is rejected again with ERR_UPDATE_OVERDUE
          when the compliance dimension flips OVERDUE under a lapsed mandatory
          update — two distinct cross-entity gates on one transition.
        test_recipe:
          setup:
            - "Clock default. Manufacturer M with model MD (SUBMITTED). Unit U1 created? No — unit creation itself requires CERTIFIED; instead use two models: MD_NC stays SUBMITTED (gate 1), MD_OK becomes CERTIFIED with unit U sold (happy path), then MD_OK goes OVERDUE via a lapsed mandatory update (gate 2) and a second unit's activation fails."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Gate TV", royalty_per_device_cents: 300 }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /device-models"
              payload: { manufacturer_id: "${mfr}", model_code: "G-OK", recovery_policy: "MONETIZATION" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { mod: $.data.id }
            - call: "POST /device-models/${mod}/lab-bookings"
              payload: { bench_code: "LAB_BENCH_1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T08:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /device-models/${mod}/certify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units"
              payload: { device_model_id: "${mod}", serial_number: "G-1", hardware_cost_cents: 9000, sale_price_cents: 9000 }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { u1: $.data.id }
            - call: "POST /device-units"
              payload: { device_model_id: "${mod}", serial_number: "G-2", hardware_cost_cents: 9000, sale_price_cents: 9000 }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { u2: $.data.id }
            - call: "POST /device-units/${u1}/sell"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units/${u2}/sell"
              payload: {}
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "dv@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
            - call: "POST /os-updates"
              payload: { version_tag: "15.0.0", mandatory: true, rollout_start: "2026-09-02T00:00:00Z", compliance_deadline: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /device-units/${u1}/activate"
              payload: {}
              as: Viewer
              as_user_id: "${vw}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /device-models/${mod}/refresh-compliance"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units/${u2}/activate"
              payload: {}
              as: Viewer
              as_user_id: "${vw}"
              captures: { err_overdue: $.data.error_id }
          assert:
            - "DeviceUnit.${u1}.status == ACTIVATED (CERTIFIED + COMPLIANT model permits activation)"
            - "DeviceModel.${mod}.update_compliance == OVERDUE after the deadline lapsed with U1 still on BASE"
            - "err_overdue == ERR_UPDATE_OVERDUE — the second unit's activation is gated by the model's compliance dimension"
            - "DeviceUnit.${u2}.status == SOLD (unchanged by the failed activation)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics, different
  # resource entities)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: placement_half_open_overlap_rejected_on_home_screen_slot
        grounds:
          - calculations.placement_overlap_check
          - entities.PlacementBooking.fields.slot_code
          - errors.ERR_SLOT_OVERLAP
        distinguishing_aspect: |
          Resource: home-screen slot (slot_code). Semantics: HALF-OPEN
          [start, end) — adjacency allowed, any interior intersection rejected
          with ERR_SLOT_OVERLAP, and RELEASED bookings stop blocking (rebooking
          a released window succeeds).
        test_recipe:
          setup:
            - "Clock default. Publisher P, channel PUBLISHED, two ACTIVE campaigns K1, K2 (same flight). K1 holds HELD booking on HOME_ROW_4 [2026-09-12T10:00, 2026-09-12T12:00), then it is released."
