            - "the third revise returns 200 and EngineeringDesign.${d4_id}.revision_count == 3 with status DRAFT"
            - "the fourth revise returns error_id ERR_REVISION_LIMIT_REACHED with HTTP status 409"
            - "after the rejected fourth revise EngineeringDesign.${d4_id}.revision_count is still 3"
            - "after the rejected fourth revise EngineeringDesign.${d4_id}.status is still REVISION_REQUIRED"

      - name: territory_builder_limit_boundary_at_second_and_third_authorization
        grounds:
          - validations[priority=14, error_id=ERR_TERRITORY_BUILDER_LIMIT]
          - entities.Jurisdiction.fields.max_authorized_builders
          - entities.Jurisdiction.fields.authorized_builder_count
          - state_machines.Builder.PENDING_AUTHORIZATION_to_AUTHORIZED
        distinguishing_aspect: |
          A third metric (authorized_builder_count within a sales territory) on a third endpoint
          (POST /builders/{id}/authorize). With max_authorized_builders 2 the gate is
          count_of_AUTHORIZED < 2, so the second authorization must succeed at count 1 and the third must
          be rejected at count 2. The count is territory-scoped, not jurisdiction-scoped, so the third
          builder is rejected even though it was registered against a different Jurisdiction row in the
          same territory.
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z."
            - "Two jurisdictions share territory TX-GULF: TX-HARRIS with max_authorized_builders 2 and TX-GALVESTON with max_authorized_builders 2."
            - "Three builders are registered in PENDING_AUTHORIZATION: b1 and b2 under TX-HARRIS, b3 under TX-GALVESTON."
            - "Builder b1 has already been authorized, so the territory count is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "TX-GALVESTON", name: "Galveston County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "D", design_wind_speed_mph: 150, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j3_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Bayou Building Systems", tier: "BRONZE", credit_limit_cents: 50000000 }
              as: PlatformAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j3_id}", name: "Island Erectors", tier: "BRONZE", credit_limit_cents: 50000000 }
              as: PlatformAdmin
              captures: { b3_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /builders/${b2_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /builders/${b3_id}/authorize"
              payload: {}
              as: PlatformAdmin
          assert:
            - "before the trigger Jurisdiction.${j1_id}.authorized_builder_count == 1"
            - "the second authorization returns 200 and Builder.${b2_id}.status == AUTHORIZED"
            - "after the second authorization Jurisdiction.${j1_id}.authorized_builder_count == 2"
            - "the third authorization returns error_id ERR_TERRITORY_BUILDER_LIMIT with HTTP status 409"
            - "Builder.${b3_id}.status is still PENDING_AUTHORIZATION and authorized_at == null"
            - "Jurisdiction.${j3_id}.authorized_builder_count == 2 — the count is territory-scoped, so the sibling jurisdiction sees the same two AUTHORIZED builders"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: design_create_requires_configuration_locked
        grounds:
          - validations[priority=10, error_id=ERR_CONFIGURATION_NOT_LOCKED]
          - state_machines.BuildingConfiguration.DRAFT_to_LOCKED
          - entities.EngineeringDesign.fields.configuration_id
        distinguishing_aspect: |
          Entity pair EngineeringDesign -> BuildingConfiguration: whether a design may be created depends
          entirely on the status of a different row. Every field of the design request is valid and the
          OCC version supplied is the current one, so the rejection can only come from the parent's DRAFT
          status; locking the parent and changing nothing else makes the identical request succeed.
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; AUTHORIZED SILVER builder; configuration cfg1 created and still in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id, cfg1_v_draft: $.data.version }
          trigger:
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_draft}" }
              as: Engineer
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
              captures: { cfg1_v_locked: $.data.version }
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_locked}" }
              as: Engineer
              captures: { d5_id: $.data.id }
          assert:
            - "the first design create returns error_id ERR_CONFIGURATION_NOT_LOCKED with HTTP status 409"
            - "the first design create does not return ERR_STALE_CONFIGURATION_VERSION — the supplied version was current"
            - "no EngineeringDesign row exists for cfg1 after the first call"
            - "BuildingConfiguration.${cfg1_id}.status == LOCKED after the lock and criteria_revision_at_lock == 1"
            - "the second design create returns 201 with EngineeringDesign.${d5_id}.status == DRAFT"
            - "EngineeringDesign.${d5_id}.required_moment_kip_ft == 1010.94 — the locked parent's loads are now readable"

      - name: release_requires_drawing_package_sealed
        grounds:
          - validations[priority=10, error_id=ERR_DRAWINGS_NOT_SEALED]
          - state_machines.DrawingPackage.PENDING_to_SEALED
          - state_machines.Order.ENG_APPROVED_to_ENG_SEALED
