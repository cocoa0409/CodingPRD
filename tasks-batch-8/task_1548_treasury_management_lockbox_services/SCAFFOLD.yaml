    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites/{siteId}/availability_schedules"
    description: "List availability schedules for a site"
    roles: [BankOperationsAdmin, TreasuryImplementer, TreasuryActivator, LockboxOperator, CustomerOperator, BillingSpecialist, BillingApprover, Auditor]
    code: 200
    input: ["status?", "tier?", "limit?", "offset?"]
    output: "AvailabilitySchedule[]"
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites/{siteId}/availability_schedules/{scheduleId}"
