              as: Forecaster
              as_user_id: "${ov2_fc}"
              captures: { ov2_wv2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:16:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alerts/products/${ov2_w}/issue"
              payload: { expected_product_version: "${ov2_wv2}" }
              as: Forecaster
              as_user_id: "${ov2_fc}"
              captures: { ov2_err: $.data.error_id }
          assert:
            - "the issue is 412 with error_id == ERR_STALE_VERSION (the product's version is now 3 after the expiry-driven revert)"
            - "Product.${ov2_w} is DRAFT at version 3 and its coordination request is EXPIRED"

      - name: confirm_unmatched_event_mutates_no_product
        claim_type: derived_field_reconciliation
        grounds: [state_machines.VerificationEvent.REPORTED_to_CONFIRMED, entities.Product.fields.verified_event_count]
        distinguishing_aspect: "CONFIRM is selective: an event outside every warning polygon confirms cleanly with an empty matched_product_ids, and every existing product's verified_event_count and version remain untouched."
        test_recipe:
          setup: ["Office, zone Z, FLASH_FLOOD storm rain 2.5, issued warning over Z's left half. One event at (0.05, 0.075) — inside Z but outside the polygon."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KNOM", name: "NoMatch Office", region: "EAST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { nm_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZNM1", name: "NoMatch Zone", office_id: "${nm_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { nm_zone: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${nm_off}", full_name: "Noa Nomatch", employee_code: "EMP-NM", level: "SENIOR" }
              as: PlatformAdmin
              captures: { nm_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${nm_off}", hazard_type: "FLASH_FLOOD", rainfall_rate_in_hr: 2.5 }
              as: Forecaster
              as_user_id: "${nm_fc}"
              captures: { nm_storm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "FLASH_FLOOD", issuing_office_id: "${nm_off}", storm_event_id: "${nm_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.05 }, { lat: 0.1, lon: 0.05 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T11:00:00Z" }
              as: Forecaster
              as_user_id: "${nm_fc}"
              captures: { nm_w: $.data.id, nm_wv: $.data.version }
            - call: "POST /alerts/products/${nm_w}/issue"
              payload: { expected_product_version: "${nm_wv}" }
              as: Forecaster
              as_user_id: "${nm_fc}"
            - call: "POST /alerts/verification-events"
              payload: { zone_id: "${nm_zone}", hazard_type: "FLASH_FLOOD", observed_at: "2026-09-01T10:20:00Z", location_lat: 0.05, location_lon: 0.075, magnitude: "2.5in" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { nm_ev: $.data.id }
          trigger:
            - call: "POST /alerts/verification-events/${nm_ev}/adjudicate"
              payload: { outcome: "CONFIRMED" }
              as: VerificationAnalyst
              as_user_id: "va-1"
          assert:
            - "VerificationEvent.${nm_ev}.status == CONFIRMED and matched_product_ids == []"
            - "Product.${nm_w}.verified_event_count == 0, verification_status == UNVERIFIED, and version is unchanged by the adjudication"

      - name: verification_variant_and_priority_conflict_corners
        claim_type: optimistic_concurrency
        grounds: [calculations.verification_matching, "validations[priority=7]"]
        excluded_because:
          difficulty_instance: verification_matching_polygon_strict_vs_county_fallback
          rationale: "Variant divergence, the state-vs-temporal priority pair (continuation_of_cancelled_with_bad_window_reports_state_error) and the safety-vs-referential pair (low_wind_and_polygon_outside_cwa_reports_criteria_error) are all asserted in the named §1.8 instances."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: issue_side_effects_visible_immediately_in_same_instant
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/alerts/products/{id}/issue"]
        distinguishing_aspect: "Immediate consistency: the issue response itself carries ISSUED status and issued_at, and a dissemination-record list read in the very next call (same logical instant, no clock advance) already shows the QUEUED records — no lag, no recompute endpoint."
        test_recipe:
          setup: ["Office, zone, SEVERE storm wind 60, one DATA_FEED channel (auto-confirm). Clock at 10:00."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KIMM", name: "Immediate Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { im_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZIM1", name: "Immediate Zone", office_id: "${im_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
            - call: "POST /alerts/alert-channels"
              payload: { name: "DF-IMM", channel_type: "DATA_FEED", supports_levels: ["WARNING"], max_message_chars: 4000 }
              as: PlatformAdmin
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${im_off}", full_name: "Ivy Imm", employee_code: "EMP-IM", level: "SENIOR" }
              as: PlatformAdmin
              captures: { im_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${im_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${im_fc}"
              captures: { im_storm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${im_off}", storm_event_id: "${im_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T10:45:00Z" }
              as: Forecaster
              as_user_id: "${im_fc}"
              captures: { im_w: $.data.id, im_wv: $.data.version }
          trigger:
            - call: "POST /alerts/products/${im_w}/issue"
              payload: { expected_product_version: "${im_wv}" }
              as: Forecaster
              as_user_id: "${im_fc}"
              captures: { im_status: $.data.status, im_issued_at: $.data.issued_at }
            - call: "GET /alerts/dissemination-records"
              payload: { product_id: "${im_w}" }
              as: Forecaster
              as_user_id: "${im_fc}"
          assert:
            - "the issue response itself has status == ISSUED and issued_at == 2026-09-01T10:00:00Z"
            - "the immediately following list read returns exactly 1 record, QUEUED with queued_at == 2026-09-01T10:00:00Z"
            - "Product.${im_w}.effective_from == issued_at (WARNING onset is overwritten at issue)"

      - name: coordination_gate_and_em_gate_corners
        claim_type: immediate_consistency
        grounds: [state_machines.Product.PENDING_COORDINATION_to_ISSUED, state_machines.EmergencyAction.RECOMMENDED_to_ORDERED]
        excluded_because:
          difficulty_instance: issue_blocked_until_coordination_acknowledged
          rationale: "The Product x CoordinationRequest gate and (in emergency_order_requires_linked_product_issued) the EmergencyAction x Product gate are asserted in the named §1.8 instances."

      - name: cardinality_and_coverage_invariant_corners
        claim_type: immediate_consistency
        grounds: [entities.DisseminationRecord, entities.Product.fields.window_end]
        excluded_because:
          difficulty_instance: dissemination_record_cardinality_conserved_through_cancel
          rationale: "Per-product record cardinality under cancel and (in supersede_chain_preserves_single_coverage_at_handoff) single-coverage at the supersede handoff are asserted in the named §1.8 instances."
