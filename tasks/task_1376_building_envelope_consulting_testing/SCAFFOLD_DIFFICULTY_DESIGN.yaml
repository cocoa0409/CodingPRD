              captures: { hold_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
              captures: { blocked_err: $.data.error_id }
          trigger:
            - call: "POST /engagements/${eng_id}/litigation-holds/${hold_id}/release"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
              captures: { status_after: $.data.status }
          assert:
            - "blocked_err == ERR_ENGAGEMENT_FROZEN while hold ACTIVE"
            - "LitigationHold.${hold_id}.hold_status == RELEASED"
            - "Engagement.${eng_id}.litigation_hold_active == false (hop 1)"
            - "Engagement.${eng_id}.posture == OPEN (hop 2 derivation)"
            - "DesignReview.${rev_id}.status == UNDER_REVIEW after release (gate re-opened)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (two instances, different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_frozen_certify_by_performer
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair = state (posture/state preconditions, priorities 6-7)
          vs business_safety (segregation of duties, priority 8). A certify call
          made BY THE PERFORMER while the engagement is FROZEN violates both
          ERR_DUTY_SEGREGATION_VIOLATION (p8) and the execution_status
          precondition is fine — the FROZEN posture gate at p6 fires first, so
          the returned error is ERR_ENGAGEMENT_FROZEN, not the duty error.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS; assembly APPROVED; field test driven to RESULT_RECORDED with PASS by tech-user-1; litigation hold applied (posture FROZEN)"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E9", client_name: "C9", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W9", assembly_type: "CURTAIN_WALL", design_u_factor: 1.9, required_airtightness_lps_m2: 2.0 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews"
              payload: { assembly_id: "${asm_id}", barrier_scope: ["AIR"], drawing_count: 2 }
              as: Consultant
              captures: { rev_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/field-tests"
              payload: { assembly_id: "${asm_id}", test_method: "AAMA_502", test_date: "2026-09-10", test_pressure_pa: 75 }
              as: Consultant
              captures: { ft_id: $.data.id }
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/begin"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-user-1"
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/record-result"
              payload: { measured_leakage_lps_m2: 1.0 }
              as: FieldTechnician
              as_user_id: "tech-user-1"
            - call: "POST /engagements/${eng_id}/litigation-holds"
              payload: { matter_reference: "CASE-2026-009" }
              as: Principal
          trigger:
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/certify"
              payload: {}
              as: Principal
              as_user_id: "tech-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ENGAGEMENT_FROZEN (state/posture priority 6 beats business_safety priority 8)"
            - "error_id != ERR_DUTY_SEGREGATION_VIOLATION"
      - name: temporal_beats_referential_on_late_escalate_of_unacknowledged_claim
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          Category pair = state (claim state precondition, priority 7) vs
          business_temporal (escalation window, priority 9): escalating a claim
          that is DENIED but whose 30-day window has NOT elapsed violates only
          the temporal rule -> ERR_ESCALATION_WINDOW_NOT_ELAPSED; escalating a
          claim still UNDER_MANUFACTURER_REVIEW with the window elapsed violates
          the earlier state rule -> ERR_CLAIM_NOT_ACTIONABLE. One endpoint, two
          error outcomes decided purely by priority order.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS; anomaly VERIFIED; claim C1 FILED -> manufacturer-acknowledge -> decide DENIED at clock 2026-09-01 (response_due_at 2026-10-01); claim C2 acknowledged but undecided; clock advanced to 2026-10-02 (window elapsed for C1 pattern) — pinned: C1 is DENIED with window NOT elapsed at first trigger, C2 is UNDER_MANUFACTURER_REVIEW with window elapsed at second trigger"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E10", client_name: "C10", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
