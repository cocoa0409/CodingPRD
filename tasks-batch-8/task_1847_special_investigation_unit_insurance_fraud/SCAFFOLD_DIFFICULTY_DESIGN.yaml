              captures: { k_v: $.data.version }
            - call: "POST /siu/cases/${k}/assignments"
              payload: { investigator_id: "${inv1}", expected_case_version: "${k_v}" }
              as: SIUManager
              captures: { asg1: $.data.id, k_v2: $.data.version }
          trigger:
            - call: "POST /siu/cases/${k}/assignments"
              payload: { investigator_id: "${inv2}", expected_case_version: "${k_v2}" }
              as: SIUManager
              captures: { asg2: $.data.id }
            - call: "GET /siu/investigators/${inv1}"
              payload: {}
              as: SIUManager
              captures: { i1_after_reassign: $.data.active_case_count }
            - call: "GET /siu/investigators/${inv2}"
              payload: {}
              as: SIUManager
              captures: { i2_after_reassign: $.data.active_case_count }
            - call: "POST /siu/assignments/${asg2}/terminate"
              payload: { reason: "closing" }
              as: SIUManager
            - call: "GET /siu/investigators/${inv1}"
              payload: {}
              as: SIUManager
              captures: { i1_final: $.data.active_case_count }
            - call: "GET /siu/investigators/${inv2}"
              payload: {}
              as: SIUManager
              captures: { i2_final: $.data.active_case_count }
          assert:
            - "After reassign: I1.count=0, I2.count=1 (sum still 1 — conservation across reassignment)"
            - "After terminate: I1.count=0, I2.count=0 (sum=0 — conservation across termination)"
            - "Assignment.${asg1}.status == REASSIGNED; Assignment.${asg2}.status == TERMINATED"
