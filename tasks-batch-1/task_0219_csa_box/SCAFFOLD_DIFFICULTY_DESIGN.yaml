              payload: { expected_season_version: "${sea_v2}" }
              as: FarmManager
          assert:
            - "Subscription.${sub_b_id}.billing_status == CONFIRMED (confirmed_share_count 1 < capacity 2 succeeds at boundary)"
            - "Season.${season_id}.confirmed_share_count == 2 after this confirm"

      - name: addon_supply_exhausted_zero_remaining_boundary
        grounds:
          - validations[priority=11]
          - entities.AddOn.fields.committed_count
          - errors[ERR_ADDON_SUPPLY_EXHAUSTED]
        distinguishing_aspect: |
          Empty-remaining-capacity boundary on a DIFFERENT endpoint (POST /subscription-add-ons): with
          weekly_supply_cap 1 and committed_count already 1, attaching another add-on fails (1 < 1 is false) with
          ERR_ADDON_SUPPLY_EXHAUSTED — a zero-remaining-supply edge distinct from the numeric capacity threshold.
        test_recipe:
          setup:
            - "OPEN season, add-on FLOWERS weekly_supply_cap 1; one subscription already has it ATTACHED (committed_count 1); a second subscription exists wanting the same add-on"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S12", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-12-30T00:00:00Z", total_share_capacity: 100 }
              as: FarmManager
