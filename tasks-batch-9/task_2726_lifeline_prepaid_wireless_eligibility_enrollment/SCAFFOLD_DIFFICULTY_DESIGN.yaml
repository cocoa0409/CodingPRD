scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 - dual_variant_calc
  # Two dual-variant calculations on DIFFERENT ENTITY DOMAINS:
  #   1A operates on money accrued to a ReimbursementClaim / Provider ledger;
  #   1B operates on household income screening for a Subscriber / Enrollment.
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: claim_provisional_vs_final_support_diverges_on_reimbursement_claim
        grounds:
          - calculations.claim_support_amount
          - entities.ReimbursementClaim.fields.provisional_amount_cents
          - entities.ReimbursementClaim.fields.final_amount_cents
          - entities.ReimbursementClaim.fields.variance_cents
          - entities.ReimbursementClaim.fields.covered_enrollment_count
          - state_machines.ReimbursementClaim.status.DRAFT_to_FILED
          - concurrency_rules[claim-draft-stale-provider]
        distinguishing_aspect: |
          This dual-variant pair lives in the MONEY domain: the provisional variant is
          pinned at DRAFT creation to 493 cents over 1 covered enrollment while the final
          variant recomputed at FILE time is 2158 cents over 2 covered enrollments, so
          variance_cents is exactly 1665 and the two variants are numerically distinct on
          identical stored enrollment rows.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-16T00:00:00Z (mid service month 2026-06)."
            - "One ACTIVE provider licensed in TX and NM with enrollment_cap 50."
            - "Enrollment E1: non-tribal, VOICE, benefit_start_date 2026-01-10, still ACTIVE."
            - "Enrollment E2: tribal, BROADBAND, benefit_start_date 2026-06-21 - i.e. AFTER the clock, so the provisional pass cannot see it."
            - "A DRAFT reimbursement claim for service_month 2026-06 created while the clock is still inside the month."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143001", study_area_code: "489001", licensed_state_codes: ["TX", "NM"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-A1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-01-10T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "450 Yandell Dr", unit_designator: "Unit 12", city: "El Paso", state_code: "TX", postal_code: "79902" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Bea Tso", date_of_birth: "1975-09-02", last4_ssn: "8823", address_id: "${addr2_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-A2" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk2_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk2_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub2_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk2_id}", certified_address_id: "${addr2_id}", service_type: "BROADBAND", one_per_household_attested: true, benefit_start_date: "2026-06-21T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr2_id: $.data.id }
            - call: "GET /lifeline/providers/${prov_a_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { prov_a_ver: $.data.version }
            - call: "POST /lifeline/reimbursement-claims"
              payload: { provider_id: "${prov_a_id}", service_month: "2026-06", expected_provider_version: "${prov_a_ver}" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/file"
              payload: { certifying_officer_ref: "OFFICER-9" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
          assert:
            - "ReimbursementClaim.${claim_id}.provisional_amount_cents == 493"
            - "ReimbursementClaim.${claim_id}.final_amount_cents == 2158"
            - "ReimbursementClaim.${claim_id}.variance_cents == 1665"
            - "ReimbursementClaim.${claim_id}.covered_enrollment_count == 2"
            - "ReimbursementClaim.${claim_id}.status == FILED"
            - "ReimbursementClaim.${claim_id}.provisional_amount_cents != ReimbursementClaim.${claim_id}.final_amount_cents"
            - "Provider.${prov_a_id}.claim_gross_cents == 2158"
            - "Provider.${prov_a_id}.net_reimbursed_cents == 2158"
            - "Provider.${prov_a_id}.recouped_cents == 0"
            - "Provider.${prov_a_id}.open_claim_count == 1"

      - name: recert_income_annualized_vs_three_month_averaged_on_subscriber
        grounds:
          - calculations.eligibility_income_evaluation
          - calculations.fpg_income_threshold
          - calculations.recertification_window
          - entities.Enrollment.fields.recert_evaluated_income_cents
          - entities.Enrollment.fields.recert_income_threshold_cents
          - validations[priority=70]
          - state_machines.Enrollment.recert_status.NOTICED_to_NOT_DUE
        distinguishing_aspect: |
          This dual-variant pair lives in the INCOME-SCREENING domain and not in money
          accrual: the identical figure 4400000 cents fails the strict_annualized variant
          at POST /lifeline/subscribers/{id}/eligibility-checks with
          ERR_SUBSCRIBER_INCOME_ABOVE_THRESHOLD, yet the three_month_averaged variant at
          POST /lifeline/enrollments/{id}/recertify evaluates 1050000 * 4 = 4200000 and
          passes the same 4341600 threshold, a 200000-cent divergence on one household.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Provider licensed in TX, enrollment_cap 50."
            - "Subscriber S1 (household_size 4, non-tribal, annual_income_cents 3000000) enrolled on VOICE with benefit_start_date 2026-08-01."
            - "Subscriber S2 (household_size 4, non-tribal, annual_income_cents 4400000) created at the same address cohort-free address, never screened."
            - "Clock advanced to 2027-06-02T00:00:00Z, usage recorded so the non-usage sweep step cannot flag E1, then a compliance sweep drives E1.recert_status to NOTICED."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143002", study_area_code: "489002", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "88 Cotton St", unit_designator: "Apt 2", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-B1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "912 Alameda Ave", unit_designator: "Apt 7", city: "El Paso", state_code: "TX", postal_code: "79905" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Carl Vega", date_of_birth: "1969-01-30", last4_ssn: "5510", address_id: "${addr2_id}", household_size: 4, annual_income_cents: 4400000, last_3mo_income_cents: 1050000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/enrollments/${enr1_id}/usage"
              payload: { usage_kind: "OUTBOUND_CALL" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
            - call: "POST /lifeline/providers/${prov_a_id}/compliance-sweep"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /lifeline/enrollments/${enr1_id}/recertify"
              payload: { household_size: 4, annual_income_cents: 4400000, last_3mo_income_cents: 1050000, attested_qualifying_benefit: "NONE", attestation_ref: "ATT-1" }
              as: Subscriber
              as_user_id: "${sub1_id}"
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-B2" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { s2_err: $.data.error_id }
          assert:
            - "Enrollment.${enr1_id}.recert_evaluated_income_cents == 4200000"
            - "Enrollment.${enr1_id}.recert_income_threshold_cents == 4341600"
            - "Enrollment.${enr1_id}.recert_status == NOT_DUE"
            - "Enrollment.${enr1_id}.benefit_status == ACTIVE"
            - "Enrollment.${enr1_id}.recert_due_date == 2028-06-01"
            - "Enrollment.${enr1_id}.recert_last_responded_at == 2027-06-02T00:00:00Z"
            - "Subscriber.${sub1_id}.annual_income_cents == 4400000"
            - "Subscriber.${sub1_id}.income_threshold_cents == 4341600"
            - "Subscriber.${sub1_id}.status == ENROLLED"
            - "the second trigger call returns HTTP 409 and ${s2_err} == ERR_SUBSCRIBER_INCOME_ABOVE_THRESHOLD"
            - "Subscriber.${sub2_id}.status == PROSPECT"

  # =========================================================================
  # RULE 2 - combinatorial_formula
  # Three instances in THREE DIFFERENT MODES:
  #   2A -> mode (b) nested rounding where the ORDER of rounding changes the result;
  #   2B -> mode (c) circular-looking dependency resolved by a PINNED evaluation order;
  #   2C -> mode (a) >= 3 inputs combined non-linearly through nested min/max.
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: claim_line_rounding_order_pinned_per_line_not_per_claim
        grounds:
          - calculations.claim_support_amount
          - entities.ReimbursementClaim.fields.final_amount_cents
          - entities.ReimbursementClaim.fields.provisional_amount_cents
          - entities.ReimbursementClaim.fields.variance_cents
          - state_machines.ReimbursementClaim.status.DRAFT_to_FILED
        distinguishing_aspect: |
          MODE (b) - nested rounding where order matters: two identical non-tribal VOICE
          lines each worth 925 * 16 / 30 = 493.333 cents must be rounded PER LINE and then
          summed to 986, whereas summing first (986.667) and rounding once yields 987, so
          the single literal 986 falsifies the wrong rounding order.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One ACTIVE provider licensed in TX, enrollment_cap 50."
            - "Two non-tribal VOICE enrollments at two distinct addresses, both with benefit_start_date 2026-06-15 and both still ACTIVE."
            - "A DRAFT claim for service_month 2026-06 created at 2026-06-20 (6 support days per line)."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143003", study_area_code: "489003", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-C1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-06-15T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "450 Yandell Dr", unit_designator: "Unit 12", city: "El Paso", state_code: "TX", postal_code: "79902" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Bea Tso", date_of_birth: "1975-09-02", last4_ssn: "8823", address_id: "${addr2_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-C2" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk2_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk2_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub2_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk2_id}", certified_address_id: "${addr2_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-06-15T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr2_id: $.data.id }
            - call: "GET /lifeline/providers/${prov_a_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { prov_a_ver: $.data.version }
            - call: "POST /lifeline/reimbursement-claims"
              payload: { provider_id: "${prov_a_id}", service_month: "2026-06", expected_provider_version: "${prov_a_ver}" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/file"
              payload: { certifying_officer_ref: "OFFICER-4" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
          assert:
            - "ReimbursementClaim.${claim_id}.final_amount_cents == 986"
            - "ReimbursementClaim.${claim_id}.final_amount_cents != 987"
            - "ReimbursementClaim.${claim_id}.provisional_amount_cents == 370"
            - "ReimbursementClaim.${claim_id}.variance_cents == 616"
            - "ReimbursementClaim.${claim_id}.covered_enrollment_count == 2"
            - "Provider.${prov_a_id}.claim_gross_cents == 986"
            - "Provider.${prov_a_id}.net_reimbursed_cents == 986"

      - name: recoupment_penalty_tier_read_from_extrapolated_not_from_final_amount
        grounds:
          - calculations.audit_recoupment_amount
          - calculations.claim_support_amount
          - calculations.audit_sample_selection
          - entities.ReimbursementClaim.fields.penalty_cents
          - entities.ReimbursementClaim.fields.recoupment_amount_cents
          - entities.ReimbursementClaim.fields.net_payable_cents
          - state_machines.ReimbursementClaim.status.UNDER_AUDIT_to_AUDIT_FAILED
          - validations[priority=34]
        distinguishing_aspect: |
          MODE (c) - circular-looking dependency with a pinned evaluation order: the penalty
          rate looks like it depends on the claim total but is defined to read the
          EXTRAPOLATED figure, so with final_amount_cents 2158 and 1 of 2 samples failed
          the extrapolated 1079 selects PENALTY_RATE_MID 0.10 and recoupment lands on 1187,
          not the 1295 that reading the tier off 2158 (>= PENALTY_TIER_2_CENTS) would give.
        test_recipe:
          setup:
            - "The claim from claim_provisional_vs_final_support_diverges_on_reimbursement_claim: FILED for 2026-06 with final_amount_cents 2158 over 2 enrollments."
            - "Clock at 2026-07-02T00:00:00Z."
            - "An audit sample of size 2 drawn by auditor AUD-1; both enrollments carry audit_risk_score 0 so ranking falls to benefit_start_date ASC and sample[0] is the 2026-01-10 non-tribal VOICE line worth 925."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143004", study_area_code: "489004", licensed_state_codes: ["TX", "NM"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-D1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-01-10T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "450 Yandell Dr", unit_designator: "Unit 12", city: "El Paso", state_code: "TX", postal_code: "79902" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Bea Tso", date_of_birth: "1975-09-02", last4_ssn: "8823", address_id: "${addr2_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
