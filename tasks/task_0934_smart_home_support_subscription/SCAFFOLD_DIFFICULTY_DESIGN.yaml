          - entities.Ticket.fields.sla_uncovered_minutes
        distinguishing_aspect: |
          Conserved quantity: WALL-CLOCK MINUTES of a ticket. Over 600 minutes of wall
          time on a BUSINESS_HOURS plan the partition must be exactly counted 60 +
          paused 480 + uncovered 60 == 600; the pause moves minutes between buckets
          and must neither create nor destroy any. This is a time quantity, unlike the
          slot-row quantity of the sibling instance.
