            - call: "GET /artworks/${art_id}"
              payload: {}
              as: Registrar
              captures: { art_v2: $.data.version }
            - call: "POST /policies"
              payload: { artwork_id: "${art_id}", coverage_type: "ALL_RISK", insured_value_cents: 1000000, effective_start: "2026-05-01T00:00:00Z", effective_end: "2027-05-01T00:00:00Z", expected_artwork_version: "${art_v2}" }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { placement_id: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${art_id}", client_id: "${client_id}", borrower_name: "City Museum", exhibition_name: "Stars", loan_start: "2026-05-10T00:00:00Z", loan_end: "2026-06-10T00:00:00Z", is_international: false, required_value_cents: 1000000 }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/state"
