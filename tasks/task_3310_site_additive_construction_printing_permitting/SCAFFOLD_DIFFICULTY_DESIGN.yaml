                every ConventionalTradeTask in PLANNED or READY cascades to CANCELLED,
                and every PermitApplication in DRAFT/SUBMITTED/AM_REVIEW cascades to WITHDRAWN.
          Trigger differs from instance 1 (Site suspend vs revision approval), satisfying the
          "different triggering transitions" clause.
