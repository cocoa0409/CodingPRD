scaffold_corner_design:

  # ===========================================================================
  # Section: Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: plan_create_minimal_valid_payload_returns_201
        claim_type: creation
        grounds:
          - entities.Plan
          - endpoints[POST /plans]
        distinguishing_aspect: "POST /plans with all required fields returns 201 and a Plan in status=DRAFT with version=1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { name: "Acme 401k", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id, plan_status: $.data.status, plan_version: $.data.version }
          assert:
            - "response.status == 201"
            - "Plan.${plan_id}.status == DRAFT"
            - "Plan.${plan_id}.version == 1"
            - "Plan.${plan_id}.match_formula == TIERED"
            - "Plan.${plan_id}.vesting_schedule == CLIFF_3"

      - name: plan_get_by_unknown_id_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints[GET /plans/{id}]
        distinguishing_aspect: "GET /plans/{unknown-uuid} returns 404 with error_id=ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "$.data.error_id == ERR_NOT_FOUND"

      - name: participant_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /participants]
        distinguishing_aspect: "POST /participants without annual_compensation_cents returns 400/ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "ACTIVE plan exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "P", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "X", date_of_birth: "1980-01-01T00:00:00Z", hire_date: "2024-01-01T00:00:00Z" }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: participant_create_invalid_enum_for_match_formula_on_plan
        claim_type: type_constraints
        grounds:
          - entities.Plan.fields.match_formula
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /plans with match_formula='UNKNOWN' rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { name: "Bad", plan_year: 2026, match_formula: "UNKNOWN", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: plan_default_annual_limits_when_omitted
        claim_type: defaults
        grounds:
          - entities.Plan.fields.annual_compensation_limit_cents
          - entities.Plan.fields.annual_deferral_limit_cents
        distinguishing_aspect: "POST /plans omitting annual_compensation_limit_cents and annual_deferral_limit_cents -> 34500000 and 2300000 respectively."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { name: "Dflt", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id, lim_comp: $.data.annual_compensation_limit_cents, lim_def: $.data.annual_deferral_limit_cents }
          assert:
            - "Plan.${plan_id}.annual_compensation_limit_cents == 34500000"
            - "Plan.${plan_id}.annual_deferral_limit_cents == 2300000"

      - name: participant_system_fields_generated_on_create
        claim_type: system_fields
        grounds:
          - entities.Participant.fields.enrollment_status
          - entities.Participant.fields.employee_balance_cents
          - entities.Participant.fields.employer_balance_cents
        distinguishing_aspect: "Newly created Participant has system-defaulted enrollment_status=PENDING, employee_balance_cents=0, employer_balance_cents=0."
        test_recipe:
          setup:
            - "ACTIVE plan."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "P", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Z", date_of_birth: "1980-01-01T00:00:00Z", hire_date: "2024-01-01T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id, st: $.data.enrollment_status, eb: $.data.employee_balance_cents, mb: $.data.employer_balance_cents }
          assert:
            - "Participant.${p_id}.enrollment_status == PENDING"
            - "Participant.${p_id}.employee_balance_cents == 0"
            - "Participant.${p_id}.employer_balance_cents == 0"

      - name: vesting_event_immutable_no_version_no_update
        claim_type: immutability
        grounds:
          - entities.VestingEvent
        distinguishing_aspect: "VestingEvent has common_fields:false; there is no PUT/PATCH endpoint for VestingEvent in §1.5."
        test_recipe:
          setup:
            - "ACTIVE plan with one ENROLLED participant; one VestingEvent appended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "VE", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "VE Holder", date_of_birth: "1980-01-01T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /vesting-events"
              payload: { participant_id: "${p_id}", as_of_date: "2026-06-15T00:00:00Z", years_of_service_after: 2, vested_pct_bps_after: 4000 }
              as: PlanAdmin
              captures: { ve_id: $.data.id }
            - call: "GET /vesting-events"
              payload: { participant_id: "${p_id}" }
              as: PlanAdmin
          assert:
            - "VestingEvent.${ve_id}.years_of_service_after == 2"
            - "VestingEvent.${ve_id}.vested_pct_bps_after == 4000"
            - "VestingEvent.${ve_id}.participant_id == ${p_id}"

  # ===========================================================================
  # Section: State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: plan_activate_from_already_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Plan.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /plans/{id}/activate on an already-ACTIVE plan returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "ACTIVE plan."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "P", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: plan_terminate_from_terminated_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Plan.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /plans/{id}/terminate on a TERMINATED plan returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "TERMINATED plan."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "P", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { v_active: $.data.version }
            - call: "POST /plans/${plan_id}/terminate"
              payload: { expected_plan_version: "${v_active}" }
              as: PlanAdmin
              captures: { v_terminated: $.data.version }
          trigger:
            - call: "POST /plans/${plan_id}/terminate"
              payload: { expected_plan_version: "${v_terminated}" }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: participant_enroll_requires_plan_active
        claim_type: cross_entity_precondition
        grounds:
          - state_machines.Participant.PENDING_to_ENROLLED
        excluded_because:
          difficulty_instance: contribution_close_requires_plan_active
          rationale: "Cross-entity Participant -> Plan dependency is asserted by the §1.8 cross_entity_state_dependency instance (close requires ACTIVE plan, suspend/enroll equally so)."

      - name: loan_default_when_participant_terminates
        claim_type: cascade_down
        grounds:
          - state_machines.Loan.DISBURSED_to_DEFAULTED
        excluded_because:
          difficulty_instance: plan_terminate_cascades_to_loan_default_depth_3
          rationale: "Loan default cascade is the depth-3 §1.8 transitive_cascade chain."

      - name: hardship_pay_drains_employee_balance_first
        claim_type: side_effect_execution
        grounds:
          - state_machines.HardshipWithdrawal.APPROVED_to_PAID
          - entities.Participant.fields.employee_balance_cents
          - entities.Participant.fields.employer_balance_cents
        distinguishing_aspect: |
          POST /hardship-withdrawals/{id}/pay debits employee_balance_cents
          first; shortfall goes to employer_balance_cents. For an approved
          amount that fits entirely within employee_balance_cents, only
          employee_balance_cents is reduced.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE plan; ENROLLED participant age 45 with employee_balance_cents=40000 and vested_employer_balance_cents=14000; one APPROVED HardshipWithdrawal for 27000 cents (matches max_hardship_amount)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "HP", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Hp", date_of_birth: "1981-06-15T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-05-31T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp1: $.data.id }
            - call: "POST /contribution-periods/${cp1}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp2: $.data.id }
            - call: "POST /contribution-periods/${cp2}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /hardship-withdrawals"
              payload: { participant_id: "${p_id}", requested_amount_cents: 100000, hardship_category: "MEDICAL_EXPENSES" }
              as: PlanAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hardship-withdrawals/${h_id}/approve"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /hardship-withdrawals/${h_id}/pay"
              payload: {}
              as: PlanAdmin
          assert:
            - "HardshipWithdrawal.${h_id}.status == PAID"
            - "Participant.${p_id}.employee_balance_cents == 13000"
            - "Participant.${p_id}.employer_balance_cents == 35000"
            - "Participant.${p_id}.vested_employer_balance_cents == 14000"

  # ===========================================================================
  # Section: Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: tiered_match_at_deferral_300_bps_full_first_tier_only
        claim_type: correct_result
        grounds:
          - calculations.tiered_employer_match
        distinguishing_aspect: |
          TIERED at exactly the first-tier ceiling (deferral_rate_bps=300):
          tier1_pct=300, tier2_pct=0; employer_match_cents = floor(500000*300/10000)
          = 15000.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE TIERED/CLIFF_3 plan."
            - "ENROLLED participant with deferral_rate_bps=300."
            - "One OPEN ContributionPeriod gross=500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "T300", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "T", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 300 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
          assert:
            - "ContributionPeriod.${cp_id}.employee_contribution_cents == 15000"
            - "ContributionPeriod.${cp_id}.employer_match_cents == 15000"

      - name: tiered_match_zero_deferral_yields_zero_match
        claim_type: input_set_filtering
        grounds:
          - calculations.tiered_employer_match
          - entities.Participant.fields.deferral_rate_bps
        distinguishing_aspect: "Deferral 0 bps -> employee_contribution_cents=0, employer_match_cents=0 (no input -> no output)."
        test_recipe:
          setup:
            - "Clock at 2026-06-15; ACTIVE plan; ENROLLED participant with deferral_rate_bps=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "T0", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Z", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 100 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "PATCH /participants/${p_id}/deferral-rate"
              payload: { deferral_rate_bps: 0 }
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
          assert:
            - "ContributionPeriod.${cp_id}.employee_contribution_cents == 0"
            - "ContributionPeriod.${cp_id}.employer_match_cents == 0"

      - name: graded_vesting_at_yos_1_to_5_uses_table
        claim_type: correct_result
        grounds:
          - calculations.vested_balance
          - entities.Plan.fields.vesting_schedule
        distinguishing_aspect: |
          GRADED_6 vesting at yos=1 -> 20%, yos=4 -> 80%. Verified by closing
          a contribution period under each yos and reading
          vested_employer_balance_cents.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE TIERED/GRADED_6 plan."
            - "Two ENROLLED participants — yos=1 (hire 2025-06-15) and yos=4 (hire 2022-06-15)."
            - "Each has one OPEN ContributionPeriod gross=500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "G", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "G1", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2025-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /participants/${p1_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "G4", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2022-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /participants/${p4_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p1_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp1_id: $.data.id }
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p4_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp4_id: $.data.id }
          trigger:
            - call: "POST /contribution-periods/${cp1_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods/${cp4_id}/close"
              payload: {}
              as: PlanAdmin
          assert:
            - "Participant.${p1_id}.employer_balance_cents == 17500"
            - "Participant.${p1_id}.vested_employer_balance_cents == 3500"
            - "Participant.${p4_id}.employer_balance_cents == 17500"
            - "Participant.${p4_id}.vested_employer_balance_cents == 14000"

      - name: cliff_vesting_boundary
        claim_type: boundary_threshold
        grounds:
          - calculations.vested_balance
        excluded_because:
          difficulty_instance: cliff_vesting_at_year_3_exact_boundary
          rationale: "CLIFF_3 boundary at yos=3 already proven by §1.8 boundary_precision_check instance 2."

      - name: hardship_penalty_zero_when_participant_age_at_or_above_59
        claim_type: boundary_threshold
        grounds:
          - calculations.max_hardship_amount
        distinguishing_aspect: "Participant age 60 (DOB 1966-01-01, clock 2026-06-15) has ten_percent_penalty_cents=0 on hardship approval."
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE TIERED/GRADED_6 plan."
            - "Participant ENROLLED age 60 (DOB 1966-01-01), yos=2 (hire 2024-06-15)."
            - "One closed contribution period: employee_balance=20000, employer_balance=17500, vested_employer=7000."
            - "REQUESTED hardship for 1000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Age60", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Sixty", date_of_birth: "1966-01-01T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /hardship-withdrawals"
              payload: { participant_id: "${p_id}", requested_amount_cents: 1000, hardship_category: "MEDICAL_EXPENSES" }
              as: PlanAdmin
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /hardship-withdrawals/${h_id}/approve"
              payload: {}
              as: PlanAdmin
          assert:
            - "HardshipWithdrawal.${h_id}.approved_amount_cents == 1000"
            - "HardshipWithdrawal.${h_id}.ten_percent_penalty_cents == 0"

      - name: rmd_uniform_lifetime_table_value_at_age_75
