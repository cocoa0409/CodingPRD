              captures: { t1: $.data.id }
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "EVALUATING" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "OFFERED" }
              as: GeneralManager
          trigger:
            - call: "POST /scouting/free-agent-targets/${t1}/sign"
              payload: { budget_id: "${bud}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"

      - name: medical_detail_redacted_for_area_scout
        claim_type: role_denial
        grounds: ["entities.ConfidentialFlag.fields.detail", 'endpoints["GET /scouting/prospects/{id}/flags"]']
        distinguishing_aspect: "Field-level confidentiality: AreaScout sees MEDICAL flag rows with detail null while MedicalStaff sees the full detail string."
        test_recipe:
          setup: ["scout s; prospect p with one MEDICAL flag (detail 'torn acl') created by MedicalStaff"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA" }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/flags"
              payload: { flag_type: "MEDICAL", severity: "HIGH", detail: "torn acl" }
              as: MedicalStaff
              captures: { f1: $.data.id }
          trigger:
            - call: "GET /scouting/prospects/${p1}/flags"
              as: AreaScout
              as_user_id: "${s1}"
              captures: { red_detail: "$.data[0].detail", red_type: "$.data[0].flag_type" }
            - call: "GET /scouting/prospects/${p1}/flags"
              as: MedicalStaff
              captures: { med_detail: "$.data[0].detail" }
          assert:
            - "AreaScout sees flag_type == MEDICAL but detail == null (redacted)"
            - "MedicalStaff sees detail == 'torn acl'"

  # =========================================================================
  # Section: cross_cutting_layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: reorder_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[board-reorder-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: a reorder carrying the pre-mutation board version is rejected 412 after a successful reorder advanced the version."
        test_recipe:
          setup: ["scout s, director d; prospect p BOARD_READY; OPEN board b1 with entry e1; board version captured before first reorder"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { e1: $.data.id }
            - call: "GET /scouting/draft-boards/${b1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { bv: $.data.version }
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/entries/reorder"
              payload: { entry_id: "${e1}", new_rank: 1, expected_board_version: "${bv}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { v_ok: $.data.version }
            - call: "POST /scouting/draft-boards/${b1}/entries/reorder"
              payload: { entry_id: "${e1}", new_rank: 1, expected_board_version: "${bv}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "first reorder succeeds and board.version == ${bv} + 1"
            - "second reorder with the stale version -> error_id ERR_STALE_VERSION, HTTP 412"

      - name: budget_adjustment_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[budget-adjust-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Budget.version: a second adjustment replaying the pre-mutation version is rejected 412."
        test_recipe:
          setup: ["budget created; version captured"]
          setup_api_calls:
            - call: "POST /scouting/budgets"
              payload: { season_year: 2026, base_cap_cents: 100000000, rollover_cents: 0 }
              as: GeneralManager
              captures: { bud: $.data.id, bv: $.data.version }
          trigger:
            - call: "POST /scouting/budgets/${bud}/adjustments"
              payload: { rollover_delta_cents: 5000000, expected_budget_version: "${bv}" }
              as: GeneralManager
              captures: { v_ok: $.data.version }
            - call: "POST /scouting/budgets/${bud}/adjustments"
              payload: { rollover_delta_cents: 5000000, expected_budget_version: "${bv}" }
              as: GeneralManager
              captures: { err: $.data.error_id }
          assert:
            - "first adjustment succeeds (version advanced)"
            - "second adjustment with stale version -> error_id ERR_STALE_VERSION, HTTP 412"

      - name: budget_adjustment_updates_available
        claim_type: derived_field_reconciliation
        grounds: ["calculations.cap_hit_and_budget_posture", "entities.Budget.fields.available_cents"]
        distinguishing_aspect: "Derived-field reconciliation: a +5000000 rollover adjustment immediately reflects in available_cents 105000000 with posture HEALTHY."
        test_recipe:
          setup: ["budget base 100000000 rollover 0; version captured"]
          setup_api_calls:
            - call: "POST /scouting/budgets"
              payload: { season_year: 2026, base_cap_cents: 100000000, rollover_cents: 0 }
              as: GeneralManager
              captures: { bud: $.data.id, bv: $.data.version }
          trigger:
            - call: "POST /scouting/budgets/${bud}/adjustments"
              payload: { rollover_delta_cents: 5000000, expected_budget_version: "${bv}" }
              as: GeneralManager
              captures: { avail: $.data.available_cents, post: $.data.posture }
          assert:
            - "available_cents == 105000000 and posture == HEALTHY in the same response (immediate consistency)"

