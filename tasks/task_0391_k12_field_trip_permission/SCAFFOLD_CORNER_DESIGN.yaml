        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ratio_safety_beats_transport_constraint_at_lock
          rationale: "Placeholder mapping; the OCC stale-version path is exercised by its dedicated corner instance below (occ_stale_lock_version_rejected) — see that instance for the actual 412 assertion."

      - name: occ_stale_lock_version_rejected
