            - call: "POST /bpo/brokers/${brk_t}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bpo/properties"
              payload: { street_address: "1 T", city: "NWK", state_code: "NJ", postal_code: "07101", living_area_sqft: 1000, lot_area_sqft: 3000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { prop_t: $.data.id }
            - call: "POST /bpo/properties"
              payload: { street_address: "2 C", city: "NWK", state_code: "NJ", postal_code: "07102", living_area_sqft: 1000, lot_area_sqft: 3000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { cmp_t1: $.data.id }
            - call: "POST /bpo/properties"
              payload: { street_address: "3 C", city: "NWK", state_code: "NJ", postal_code: "07103", living_area_sqft: 1000, lot_area_sqft: 3000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { cmp_t2: $.data.id }
            - call: "POST /bpo/properties"
              payload: { street_address: "4 C", city: "NWK", state_code: "NJ", postal_code: "07104", living_area_sqft: 1000, lot_area_sqft: 3000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { cmp_t3: $.data.id }
            - call: "POST /bpo/valuation-orders"
              payload: { property_id: "${prop_t}", order_kind: "BPO", inspection_level: "DRIVE_BY", priority: "STANDARD", agreed_fee_cents: 10000, client_id: "${cl_t}" }
              as: ClientAdmin
              as_user_id: "${cl_t}"
              captures: { ord_t: $.data.id, ord_t_v: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_t}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_t}"
              captures: { ord_t_v2: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_t}/dispatch"
              payload: { broker_id: "${brk_t}", expected_order_version: "${ord_t_v2}" }
              as: DispatchCoordinator
            - call: "POST /bpo/valuation-orders/${ord_t}/accept"
              payload: {}
              as: Broker
              as_user_id: "${brk_t}"
            - call: "POST /bpo/valuation-orders/${ord_t}/comparables"
              payload: { source_property_id: "${cmp_t1}", sale_price_cents: 30000000, sale_date: "2026-06-01T00:00:00Z", distance_miles: 1.5, adjustment_cents: 0 }
              as: Broker
              as_user_id: "${brk_t}"
              captures: { ct1: $.data.id }
            - call: "POST /bpo/valuation-orders/${ord_t}/comparables"
              payload: { source_property_id: "${cmp_t2}", sale_price_cents: 30000000, sale_date: "2026-06-02T00:00:00Z", distance_miles: 1.5, adjustment_cents: 0 }
              as: Broker
              as_user_id: "${brk_t}"
              captures: { ct2: $.data.id }
            - call: "POST /bpo/valuation-orders/${ord_t}/comparables"
              payload: { source_property_id: "${cmp_t3}", sale_price_cents: 30000000, sale_date: "2026-06-03T00:00:00Z", distance_miles: 1.5, adjustment_cents: 0 }
              as: Broker
              as_user_id: "${brk_t}"
              captures: { ct3: $.data.id }
            - call: "POST /bpo/valuation-orders/${ord_t}/comparables/${ct1}/select"
              payload: {}
              as: Broker
              as_user_id: "${brk_t}"
            - call: "POST /bpo/valuation-orders/${ord_t}/comparables/${ct2}/select"
              payload: {}
              as: Broker
              as_user_id: "${brk_t}"
            - call: "POST /bpo/valuation-orders/${ord_t}/comparables/${ct3}/select"
              payload: {}
              as: Broker
              as_user_id: "${brk_t}"
            - call: "POST /bpo/valuation-orders/${ord_t}/photos"
              payload: { photo_kind: "FRONT", file_url: "https://x/f.jpg", captured_at: "2026-08-01T01:00:00Z" }
              as: Broker
              as_user_id: "${brk_t}"
            - call: "POST /bpo/valuation-orders/${ord_t}/photos"
              payload: { photo_kind: "STREET", file_url: "https://x/s.jpg", captured_at: "2026-08-01T01:01:00Z" }
              as: Broker
              as_user_id: "${brk_t}"
            - call: "POST /bpo/valuation-orders/${ord_t}/fee-lines"
              payload: { fee_kind: "BASE", description: "Base", amount_cents: 10000 }
              as: Broker
              as_user_id: "${brk_t}"
            - call: "POST /bpo/valuation-orders/${ord_t}/report"
              payload: {}
              as: Broker
              as_user_id: "${brk_t}"
            - call: "POST /bpo/valuation-orders/${ord_t}/qc/open"
              payload: {}
              as: QCReviewer
              captures: { qc_t: $.data.id }
            - call: "POST /bpo/valuation-orders/${ord_t}/qc/${qc_t}/verdict"
              payload: { verdict: "APPROVE", defects_found: 0, notes: "ok" }
              as: QCReviewer
            - call: "POST /bpo/valuation-orders/${ord_t}/complete"
              payload: {}
              as: OperationsManager
          trigger:
            - call: "POST /bpo/valuation-orders/${ord_t}/cancel"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_t}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "ValuationOrder.${ord_t}.fulfillment_status remains COMPLETED"

      - name: payout_batch_disbursed_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PayoutBatch
        distinguishing_aspect: "After disburse, calling approve again is rejected (terminal lockdown)."
        test_recipe:
          setup: ["a payout batch driven to DISBURSED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bpo/state-regulations"
