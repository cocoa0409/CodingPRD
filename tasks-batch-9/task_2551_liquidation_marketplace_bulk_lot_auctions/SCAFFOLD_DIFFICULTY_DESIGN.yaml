  # ===========================================================================
  # Rule 6 - boundary/precision checks on different metrics at different endpoints
  #   instance 1: money tier boundary at POST /liquidation/listings/{id}/bids
  #   instance 2: empty-collection boundary at POST /liquidation/lots/{id}/manifest-submissions
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: buyer_premium_tier_boundary_at_exactly_one_million_cents
        grounds:
          - calculations.buyer_premium
          - calculations.order_settlement
          - entities.SaleOrder.fields.buyer_premium_bps
          - state_machines.Listing.OPEN_to_CLOSED_SOLD_fixed_price
          - endpoints[POST /liquidation/listings/{id}/bids]
        distinguishing_aspect: |
          The BUYER_PREMIUM_TIERS table is flat, not marginal, and its first boundary is inclusive at
          1,000,000 cents. A hammer of exactly 1000000 is charged 1400 bps (140000) while a hammer of
          1000001 - one cent more - is charged 1200 bps on the whole amount (120000), so the more
          expensive lot carries the CHEAPER premium and total_due_cents falls from 1148500 to
          1128501. An off-by-one boundary (exclusive <) or a marginal reading of the table produces a
          different number on at least one of the two orders.
        test_recipe:
          setup:
            - "Seller, warehouse with dock_door_count 2, one QUALIFIED buyer with a 10,000,000-cent limit."
            - "Two NEW_OVERSTOCK lots, each one ACTIVE line 50 x 20000 so pallet_count is ceil(50/200) = 1 and estimated_freight_cents is 8500 on both."
            - "Lot P1 carries a FIXED_PRICE listing at ask_price_cents exactly 1000000; lot P2 carries a FIXED_PRICE listing at ask_price_cents 1000001. Both are OPEN over [2026-08-05T00:00:00Z, 2026-08-20T00:00:00Z) and the clock stands at 2026-08-05T01:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
