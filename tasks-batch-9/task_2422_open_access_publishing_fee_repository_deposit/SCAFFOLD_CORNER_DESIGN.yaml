            - "the second response returned HTTP 403"
            - "Article.${v3_a_id}.funding_status == SELF_FUNDED"

      - name: corner_capped_amount_field_conditional_requirement_rejects_both_mismatches
        claim_type: conditional
        grounds:
          - validations[priority 5]
          - entities.AgreementCoverage.fields.capped_amount_cents
        distinguishing_aspect: |
          capped_amount_cents is required exactly when coverage_type is CAPPED_APC and forbidden
          otherwise: CAPPED_APC without it is ERR_INVALID_REQUEST 400, READ_ONLY with it is also
          ERR_INVALID_REQUEST 400, and CAPPED_APC with it is created (201). The field is neither
          unconditionally optional nor unconditionally required.
        test_recipe:
          setup:
            - "DRAFT agreement on a publisher with two of its own journals"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { v4_p_id: $.data.id, v4_p_v: $.data.version }
            - call: "POST /journals"
              payload: { publisher_id: "${v4_p_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { v4_j1_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${v4_p_id}", issn: "2050-084X", title: "Meridian Journal of Marine Ecology", oa_model: "HYBRID", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { v4_j2_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${v4_p_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2027-07-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${v4_p_v}" }
              as: AgreementAdmin
              captures: { v4_ta_id: $.data.id }
          trigger:
            - call: "POST /transformative-agreements/${v4_ta_id}/coverages"
              payload: { journal_id: "${v4_j1_id}", coverage_type: "CAPPED_APC", covered_from: "2026-07-01", covered_until: "2027-06-30" }
              as: AgreementAdmin
              captures: { v4_err_missing: $.data.error_id }
            - call: "POST /transformative-agreements/${v4_ta_id}/coverages"
              payload: { journal_id: "${v4_j1_id}", coverage_type: "READ_ONLY", capped_amount_cents: 150000, covered_from: "2026-07-01", covered_until: "2027-06-30" }
              as: AgreementAdmin
              captures: { v4_err_extra: $.data.error_id }
            - call: "POST /transformative-agreements/${v4_ta_id}/coverages"
              payload: { journal_id: "${v4_j1_id}", coverage_type: "CAPPED_APC", capped_amount_cents: 150000, covered_from: "2026-07-01", covered_until: "2027-06-30" }
              as: AgreementAdmin
              captures: { v4_cov_id: $.data.id, v4_cap: $.data.capped_amount_cents, v4_type: $.data.coverage_type }
          assert:
            - "${v4_err_missing} == ERR_INVALID_REQUEST"
            - "the first response returned HTTP 400"
            - "${v4_err_extra} == ERR_INVALID_REQUEST"
            - "the second response returned HTTP 400"
            - "the third response returned HTTP 201"
            - "${v4_type} == CAPPED_APC"
            - "${v4_cap} == 150000"
            - "the coverages list for the agreement returns exactly 1 row with total_count 1"

      - name: corner_pagination_bounds_outside_the_declared_range_are_rejected
        claim_type: aggregate
        grounds:
          - validations[priority 5]
          - pagination
        distinguishing_aspect: |
          The pagination contract is limit in 1..100 and offset >= 0. limit 0, limit 101 and
          offset -1 are each ERR_INVALID_REQUEST 400 rather than being silently clamped, while
          limit 1 and limit 100 are accepted at the inclusive edges.
        test_recipe:
          setup:
            - "one publisher with two journals so a page of one is a strict subset"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { v5_p_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${v5_p_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
            - call: "POST /journals"
              payload: { publisher_id: "${v5_p_id}", issn: "2050-084X", title: "Meridian Journal of Marine Ecology", oa_model: "FULLY_OA", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
          trigger:
            - call: "GET /publishers/${v5_p_id}/journals"
              payload: { limit: 0, offset: 0 }
              as: AgreementAdmin
              captures: { v5_err_zero: $.data.error_id }
            - call: "GET /publishers/${v5_p_id}/journals"
              payload: { limit: 101, offset: 0 }
              as: AgreementAdmin
              captures: { v5_err_over: $.data.error_id }
            - call: "GET /publishers/${v5_p_id}/journals"
              payload: { limit: 10, offset: -1 }
              as: AgreementAdmin
              captures: { v5_err_offset: $.data.error_id }
            - call: "GET /publishers/${v5_p_id}/journals"
              payload: { limit: 1, offset: 1 }
              as: AgreementAdmin
            - call: "GET /publishers/${v5_p_id}/journals"
              payload: { limit: 100, offset: 0 }
              as: AgreementAdmin
          assert:
            - "${v5_err_zero} == ERR_INVALID_REQUEST"
            - "${v5_err_over} == ERR_INVALID_REQUEST"
            - "${v5_err_offset} == ERR_INVALID_REQUEST"
            - "the limit 1 offset 1 page returns exactly 1 journal with total_count 2 and has_more false"
            - "the limit 100 offset 0 page returns exactly 2 journals with total_count 2 and has_more false"

      - name: corner_state_rule_outranks_the_fiscal_rule_on_the_same_call
        claim_type: priority_conflict
        grounds:
          - validations[priority 8]
          - validations[priority 33]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_precondition_outranks_author_cap_on_fund_decision
          rationale: "That instance builds one APPROVE call violating both priority 8 and priority 33 and asserts ERR_REQUEST_NOT_REVIEWABLE 409, then isolates the cap violation to show ERR_AUTHOR_CAP_EXHAUSTED 422 is reachable."

      - name: corner_business_safety_outranks_business_referential
        claim_type: priority_conflict
        grounds:
          - validations[priority 15]
          - validations[priority 18]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_safety_publisher_blocked_outranks_grant_not_active
          rationale: "That instance uses a BLOCKED publisher plus a CLOSED grant on one eligibility check and asserts ERR_PUBLISHER_BLOCKED 422 wins over ERR_GRANT_NOT_ACTIVE 409."

      - name: corner_author_annual_cap_is_evaluated_against_the_encumbrance_basis
        claim_type: aggregate
        grounds:
          - validations[priority 33]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_precondition_outranks_author_cap_on_fund_decision
          rationale: "That instance exhausts the author's annual cap through prior encumbrances and asserts the ENCUMBRANCE_INCLUSIVE remaining-cap computation drives ERR_AUTHOR_CAP_EXHAUSTED."

      - name: corner_decision_outcome_depends_on_the_referenced_fund_state
        claim_type: cross_entity
        grounds:
          - validations[priority 34]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / fund_decision_depends_on_apc_fund_open_versus_frozen
          rationale: "That instance approves the identical request against an OPEN fund and against a FROZEN fund, asserting ERR_NO_FUND_CAPACITY 409 in the frozen case with the request left UNDER_REVIEW."

      - name: corner_agreement_window_overlap_is_half_open
        claim_type: temporal
        grounds:
          - validations[priority 23]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / agreement_windows_half_open_adjacency_allowed_overlap_conflicts
          rationale: "That instance admits the abutting window (new.effective_from == other.effective_until) and rejects a one-day intersection with ERR_AGREEMENT_WINDOW_OVERLAP 409."

      - name: corner_coverage_window_conflict_extends_one_day_past_the_edges
        claim_type: temporal
        grounds:
          - validations[priority 24]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / coverage_windows_closed_with_one_day_gap_rule
          rationale: "That instance places a coverage line exactly one day after another for the same journal (rejected) and two days after (accepted), pinning the COVERAGE_GAP_DAYS arithmetic."

  - section: endpoints
    instances:
      - name: corner_fund_create_then_read_then_empty_allocation_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /apc-funds]
          - endpoints[GET /apc-funds/{id}]
          - endpoints[GET /apc-funds/{id}/allocations]
        distinguishing_aspect: |
          A freshly created fund reads back with committed_cents 0, spent_cents 0,
          available_cents equal to total_budget_cents, status OPEN, freeze_reason null and
          version 1, and its allocations sub-resource returns an empty page (total_count 0,
          has_more false) rather than 404.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /apc-funds"
              payload: { fund_code: "OA-CENTRAL-2027", fiscal_year: 2027, period_from: "2026-07-01", period_to: "2027-06-30", total_budget_cents: 500000, priority_rank: 1, eligible_affiliation_statuses: ["ELIGIBLE_FACULTY", "ELIGIBLE_POSTDOC"], per_article_cap_cents: 400000 }
              as: FundManager
              captures: { e1_fd_id: $.data.id, e1_avail: $.data.available_cents, e1_status: $.data.status, e1_v: $.data.version }
            - call: "GET /apc-funds/${e1_fd_id}"
              as: FundManager
              captures: { e1_committed: $.data.committed_cents, e1_spent: $.data.spent_cents, e1_reason: $.data.freeze_reason, e1_cap: $.data.per_article_cap_cents }
            - call: "GET /apc-funds/${e1_fd_id}/allocations"
              payload: { limit: 10, offset: 0 }
              as: FundManager
          assert:
            - "the create response returned HTTP 201"
            - "${e1_avail} == 500000"
            - "${e1_status} == OPEN"
            - "${e1_v} == 1"
            - "${e1_committed} == 0"
            - "${e1_spent} == 0"
            - "${e1_reason} == null"
            - "${e1_cap} == 400000"
            - "the allocations page returns HTTP 200 with 0 items, total_count 0 and has_more false"

      - name: corner_start_review_action_takes_an_empty_body_and_stamps_the_reviewer
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /fund-requests/{id}/start-review]
          - entities.FundRequest.fields.reviewed_by_user_id
        distinguishing_aspect: |
          start-review declares `input: []`: it is driven purely by the path id and the acting
          identity, so an empty body is a valid request. It flips SUBMITTED -> UNDER_REVIEW,
          records reviewed_by_user_id from X-User-ID, leaves decided_by_user_id null and does not
          touch requested_cents or revision_round.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
