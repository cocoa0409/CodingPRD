  # ---------------------------------------------------------------------------
  # excluded_because stubs — corners already exercised by a §1.8 instance
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: error_drop_window_overlap_on_create_drop
        claim_type: violation_to_error
        grounds: ["errors[ERR_DROP_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: drop_exclusive_window_overlap_half_open
          rationale: "The overlap rejection is the asserted failure path of that §1.8 resource_temporal_overlap instance."

      - name: error_batch_line_conflict_on_create_batch
        claim_type: violation_to_error
        grounds: ["errors[ERR_BATCH_LINE_CONFLICT]"]
        excluded_because:
          difficulty_instance: batch_cure_window_conflict_closed
          rationale: "The cure-window conflict is the asserted failure path of that §1.8 resource_temporal_overlap instance."

      - name: error_empty_bundle_on_activate
        claim_type: violation_to_error
        grounds: ["errors[ERR_EMPTY_BUNDLE]"]
        excluded_because:
          difficulty_instance: empty_bundle_activate_zero_items
          rationale: "Empty-bundle rejection is the asserted outcome of that §1.8 boundary instance."

      - name: error_bulk_min_not_met_on_checkout
        claim_type: violation_to_error
        grounds: ["errors[ERR_BULK_MIN_NOT_MET]"]
        excluded_because:
          difficulty_instance: bulk_min_quantity_at_checkout
          rationale: "The bulk-minimum rejection is the asserted outcome of that §1.8 boundary instance."

      - name: error_customer_suspended_on_renew
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: renew_requires_customer_active
          rationale: "Suspended-customer rejection is the asserted outcome of that §1.8 cross_entity_state_dependency instance."

      - name: error_batch_not_released_on_add_line
        claim_type: violation_to_error
        grounds: ["errors[ERR_BATCH_NOT_RELEASED]"]
        excluded_because:
          difficulty_instance: add_line_requires_batch_released
          rationale: "Batch-not-released rejection is the asserted outcome of that §1.8 cross_entity_state_dependency instance."

  - section: state_machines
    instances:
      - name: empty_order_checkout_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_EMPTY_ORDER]", state_machines.Order.PENDING_to_ALLOCATED]
        distinguishing_aspect: "Checkout of a PENDING order with zero RESERVED lines is rejected with ERR_EMPTY_ORDER (422); order stays UNPAID."
        test_recipe:
          setup: ["A customer with a freshly created order that has no lines. Version captured."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "eo@x.com", full_name: "Eo" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 422"
            - "error_id == ERR_EMPTY_ORDER"
            - "Order.${o1}.payment_status == UNPAID"
