          trigger:
            - call: "POST /fairtrade/certificate-holders/00000000-0000-4000-8000-000000000021/suspend"
              payload: {}
              as: none
              as_user_id: none
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED and success == false"
            - "the same call with valid CertificationOfficer headers would return 404 ERR_HOLDER_NOT_FOUND, so the 401 proves priority 1 precedes priority 4"
            - "the same call with headers X-User-Role FarmInspector and X-User-ID officer-1 also returns 401 ERR_UNAUTHENTICATED, because the role is not one of the six declared roles"

