      - name: one_compliance_sweep_voids_a_stale_filing_and_expires_a_stale_physical
        claim_type: bulk_action
        grounds:
          - endpoints[POST /compliance-checks/run]
          - state_machines.Transaction.DRAFT_to_VOIDED
          - state_machines.PhysicalExam.PASSED_to_EXPIRED
          - state_machines.Contract.PENDING_APPROVAL_to_VOIDED
        distinguishing_aspect: "A single sweep call performs several independent clock-driven steps in one response: the never-filed DRAFT past 2026-08-12T14:00:00Z is VOIDED (dragging its contract with it) and the physical past 2026-08-24T14:00:00Z is EXPIRED, with the resulting posture still COMPLIANT because neither leftover is a violation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings (cap 500000000) creates a 3-year SIGNING filing for Ray Alder (filing_deadline_at 2026-08-12T14:00:00Z, provisional commitment 83333333) and never files it."
            - "The same player has a PASSED entry physical performed at 2026-08-10T14:00:00Z, so expires_at is 2026-08-24T14:00:00Z."
            - "The clock is advanced to 2026-08-26T14:00:00Z — inside the daily window and past both timestamps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { ba_team_id: $.data.id, ba_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
