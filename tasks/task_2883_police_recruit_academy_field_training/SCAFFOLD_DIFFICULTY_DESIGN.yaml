      - name: rotation_activation_blocked_by_clock_driven_fto_certification_expiry
        grounds:
          - state_machines[Instructor].transitions[CERTIFIED -> EXPIRED]
          - state_machines[Instructor].transitions[EXPIRED -> CERTIFIED]
          - state_machines[FieldTrainingRotation].transitions[PLANNED -> ACTIVE]
          - validations[priority 57 category business_safety ERR_FTO_NOT_CERTIFIED]
          - entities.Instructor.fields.certification_expires_at
          - entities.Instructor.fields.active_trainee_count
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Activating a rotation is gated on the CURRENT state of a third entity that no one touched:
          the FTO's certification_status is swept CERTIFIED -> EXPIRED by a clock advance past
          certification_expires_at, so an activation that would have succeeded before the clock moved
          now fails, and the rotation stays PLANNED with the FTO's active_trainee_count still 0.
          Re-certifying the same instructor (EXPIRED -> CERTIFIED, a loop edge) makes the identical
          request succeed. The dependency is also asymmetric by design: the expiry sweep does NOT
          touch the instructor's LessonPlan or the already-DELIVERED CourseSession, and rotation
          CREATION never checks the FTO at all - only activation does.
