  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: meeting_space_recurring_window_and_buffer_geometry_on_cohort_series
        grounds:
          - calculations.meeting_space_occupation_conflict
          - entities.MeetingSpace.fields.turnover_buffer_minutes
          - entities.Cohort.fields.series_end_date
          - entities.Cohort.fields.weekday
          - errors[ERR_SPACE_TIME_CONFLICT]
        distinguishing_aspect: |
          MeetingSpace occupation uses CLOSED-interval geometry expanded by
          turnover_buffer_minutes AND a recurring weekday window: two cohort series
          with identical minute geometry (a 30-minute gap, exactly the buffer) collide
          when their [series_start_date, series_end_date] windows overlap on the same
          weekday and are both accepted when the windows are disjoint.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20 and turnover_buffer_minutes 30."
            - "Cohort A occupies the room every TUE from minute 600 for 90 minutes (block 600-690) across series 2026-09-08 .. 2026-10-27."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Series A", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 240000 }
              as: ProgramDirector
              captures: { c_a_id: $.data.id, c_a_end: $.data.series_end_date }
          trigger:
            - call: "POST /bereavement/cohorts"
              payload: { name: "Series B Overlapping Window", loss_type: "SUDDEN_DEATH", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 720, duration_minutes: 60, series_start_date: "2026-10-20", sessions_total: 4, direct_cost_cents: 100000 }
              as: ProgramDirector
              captures: { err_overlap: $.data.error_id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Series C Disjoint Window", loss_type: "SUDDEN_DEATH", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 720, duration_minutes: 60, series_start_date: "2026-11-03", sessions_total: 4, direct_cost_cents: 100000 }
              as: ProgramDirector
              captures: { c_c_id: $.data.id }
          assert:
            - "c_a_end == 2026-10-27"
            - "The first trigger call returns HTTP 409"
            - "err_overlap == ERR_SPACE_TIME_CONFLICT"
            - "The second trigger call returns HTTP 201"
            - "Cohort.${c_c_id}.series_end_date == 2026-11-24"
            - "Cohort.${c_c_id}.status == FORMING"
            - "Cohort.${c_c_id}.admin_fee_cents == 12000"
            - "Cohort.${c_c_id}.program_cost_total_cents == 112000"
            - "GET /bereavement/cohorts?meeting_space_id=${sp_id} returns exactly 2 rows"

      - name: counselor_weekly_minutes_aggregate_capacity_admits_exact_equality
        grounds:
          - calculations.counselor_weekly_capacity
          - entities.Counselor.fields.weekly_capacity_minutes
          - entities.Counselor.fields.committed_minutes
