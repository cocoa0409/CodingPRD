      - name: application_approval_depends_on_control_person_clearance
        grounds:
          - validations[priority=71]
          - errors[ERR_BACKGROUND_CHECK_INCOMPLETE]
          - entities.ControlPerson.fields.background_check_status
          - entities.Licensee.fields.control_chain_status
          - state_machines.ControlPerson.PROPOSED_to_SEATED
          - state_machines.LicenseApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          A different entity pair (LicenseApplication -> ControlPerson, mediated by
          Licensee.control_chain_status): the application is in a perfectly valid UNDER_REVIEW state
          with sufficient net worth, and approval is refused only because a CONTROL person of the
          licensee is still PENDING; clearing that third entity unblocks the identical call.
        test_recipe:
          setup:
            - "Jurisdiction CA; licensee with 500000000 net worth; application submitted and UNDER_REVIEW."
            - "Control person 'Dana Whitfield', ENTITY_HOLDER, direct_ownership_bps 5000 -> CONTROL with background_check_status PENDING, so Licensee.control_chain_status is PENDING_CHECKS."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
