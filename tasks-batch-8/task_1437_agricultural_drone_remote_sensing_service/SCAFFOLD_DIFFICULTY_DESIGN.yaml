scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: mission_billing_provisional_vs_final_overage
        grounds:
          - calculations.mission_billing
          - entities.FlightMission.fields.acres_flown
          - entities.Grower.fields.acres_included_ytd
        distinguishing_aspect: |
          For an identical set of COMPLETED missions, the PROVISIONAL variant
          (flat overage rate) and the FINAL variant (tiered overage with 80%
          discount past 200 acres) produce different invoice_cents on the same
          Grower — a billing-domain dual variant.
        test_recipe:
          setup:
            - "Plan P with included_acres_per_year=100, overage_rate_cents_per_acre=500, spray_allowed=true"
            - "Grower G on plan P, subscription_started_on 2026-01-01"
            - "Field F under G, legal_acres=1000, airspace_class=G (laanc_required=false)"
            - "Pilot H ACTIVE with part107_expires_on=2027-01-01"
            - "Mission M on F covering 350 acres, run to COMPLETED with acres_flown=350"
            - "Prior acres_included_ytd == 0 before M completes; after M completes, 350"
            - "Current time is 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "SCOUT_PRO", included_acres_per_year: 100, base_fee_cents: 1200000, overage_rate_cents_per_acre: 500, spray_allowed: true, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "G Farms", contact_email: "g@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 100000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "North 40", legal_acres: 1000, airspace_class: "G", insurance_policy_no: "POL-1" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot A", part107_certificate_no: "P107-A", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T12:00:00Z", acres_planned: 350 }
              as: FlightCoordinator
              captures: { mission_id: $.data.id }
            - call: "POST /ag-drone/missions/${mission_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${mission_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${mission_id}/capture"
              payload: { acres_flown: 350, wind_kt_max_observed: 10 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${mission_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
          trigger:
            - call: "POST /ag-drone/growers/${grower_id}/invoice"
              payload: { period_start: "2026-06-01", period_end: "2026-06-30" }
              as: OpsAdmin
              captures: { invoice_cents: $.data.invoice_cents, provisional_total_cents: $.data.provisional_total_cents }
          assert:
            - "overage_acres = 350 - 100 = 250; PROVISIONAL = 250 * 500 = 125000 cents"
            - "FINAL = 200*500 + 50*round(500*0.80) = 100000 + 50*400 = 120000 cents"
            - "invoice_cents == 120000"
            - "provisional_total_cents == 125000"
            - "invoice_cents != provisional_total_cents"

      - name: field_health_score_ndvi_vs_plant_count_basis
        grounds:
          - calculations.field_health_score
          - entities.Field.fields.health_score
          - entities.ImageryDeliverable.fields.kind
        distinguishing_aspect: |
          field_health_score has two divergent bases depending on the latest
          deliverable's kind: NDVI base = round(ndvi_mean * 100) versus
          PLANT_COUNT base = min(100, round(plant_count_per_acre / 30000 * 100)).
          For identical field state and zero open alerts, the two deliverable
          kinds yield different health_score values — a derived-field dual
          variant on the Field entity (distinct domain from billing).
        test_recipe:
          setup:
            - "Plan P with storage_retention_days=90"
            - "Grower G on plan P, Field F legal_acres=100, airspace_class=G"
            - "Pilot H ACTIVE"
            - "Two COMPLETED missions on F: M1 (acres_flown=50) producing an NDVI deliverable with ndvi_mean=0.720, and M2 (acres_flown=50) producing a PLANT_COUNT deliverable with plant_count_per_acre=24000"
            - "Zero alerts open on F"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "SCOUT_BASIC", included_acres_per_year: 500, base_fee_cents: 600000, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 48, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "H Farms", contact_email: "h@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "South 100", legal_acres: 100, airspace_class: "G", insurance_policy_no: "POL-2" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot B", part107_certificate_no: "P107-B", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            # M1 -> NDVI deliverable
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 50 }
              as: FlightCoordinator
              captures: { m1_id: $.data.id }
            - call: "POST /ag-drone/missions/${m1_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m1_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m1_id}/capture"
              payload: { acres_flown: 50, wind_kt_max_observed: 8 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m1_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
            - call: "GET /ag-drone/missions/${m1_id}/deliverables"
              payload: {}
              as: ProcessingEngine
              captures: { d1_id: "$.data[0].id" }
            - call: "POST /ag-drone/deliverables/${d1_id}/process"
              payload: { ndvi_mean: 0.720, cells_below_threshold: 0 }
              as: ProcessingEngine
            - call: "GET /ag-drone/fields/${field_id}"
              payload: {}
              as: FlightCoordinator
              captures: { health_after_ndvi: $.data.health_score }
            # M2 -> PLANT_COUNT deliverable (window after M1)
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-03T08:00:00Z", scheduled_end: "2026-06-03T10:00:00Z", acres_planned: 50 }
              as: FlightCoordinator
              captures: { m2_id: $.data.id }
            - call: "POST /ag-drone/missions/${m2_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m2_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m2_id}/capture"
              payload: { acres_flown: 50, wind_kt_max_observed: 9 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m2_id}/complete"
              payload: { deliverable_kinds: ["PLANT_COUNT"] }
              as: FlightCoordinator
            - call: "GET /ag-drone/missions/${m2_id}/deliverables"
              payload: {}
              as: ProcessingEngine
              captures: { d2_id: "$.data[0].id" }
            - call: "POST /ag-drone/deliverables/${d2_id}/process"
              payload: { plant_count_per_acre: 24000 }
              as: ProcessingEngine
          trigger:
            - call: "GET /ag-drone/fields/${field_id}"
              payload: {}
              as: FlightCoordinator
              captures: { health_after_pc: $.data.health_score }
          assert:
            - "health_after_ndvi == 72   # round(0.720*100), no alerts"
            - "health_after_pc == 80     # min(100, round(24000/30000*100)) = min(100, 80)"
            - "health_after_ndvi != health_after_pc"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mission_billing_tiered_overage_straddle
        grounds:
          - calculations.mission_billing
          - entities.SubscriptionPlan.fields.included_acres_per_year
          - entities.SubscriptionPlan.fields.overage_rate_cents_per_acre
        distinguishing_aspect: |
          Mode (a): a tiered formula with >=3 inputs (prior_acres, new_acres,
          included_cap, TIER1_OVERAGE_CAP, overage_rate) and a conditional
          branch on whether prior+new straddles the included boundary and the
          tier-1 200-acre cap. Tests the FINAL variant when one mission pushes
          cumulative acres across both boundaries.
        test_recipe:
          setup:
            - "Plan P included=100, overage rate=500"
            - "Grower G with acres_included_ytd=80 (from a prior 80-acre COMPLETED mission)"
            - "Field F legal_acres=2000, airspace_class=G"
            - "Pilot H ACTIVE"
            - "New mission M with acres_flown=250 — straddles included boundary (80->100) and tier-1 cap (200 overage)"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "STRADDLE", included_acres_per_year: 100, base_fee_cents: 0, overage_rate_cents_per_acre: 500, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 30 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "S Farms", contact_email: "s@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "BigField", legal_acres: 2000, airspace_class: "G", insurance_policy_no: "POL-S" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot C", part107_certificate_no: "P107-C", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            # First mission: 80 acres (sets prior_acres=80)
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 80 }
              as: FlightCoordinator
              captures: { m1_id: $.data.id }
            - call: "POST /ag-drone/missions/${m1_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m1_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m1_id}/capture"
              payload: { acres_flown: 80, wind_kt_max_observed: 5 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m1_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
            # Second mission: 250 acres — straddles included + tier-1 cap
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-03T08:00:00Z", scheduled_end: "2026-06-03T10:00:00Z", acres_planned: 250 }
              as: FlightCoordinator
              captures: { m2_id: $.data.id }
            - call: "POST /ag-drone/missions/${m2_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m2_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m2_id}/capture"
              payload: { acres_flown: 250, wind_kt_max_observed: 5 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m2_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
          trigger:
            - call: "POST /ag-drone/growers/${grower_id}/invoice"
              payload: { period_start: "2026-06-01", period_end: "2026-06-30" }
              as: OpsAdmin
              captures: { invoice_cents: $.data.invoice_cents }
          assert:
            - "First mission line FINAL: prior=80, new=80 -> included_portion = min(80, 100-80)=20; overage = 60; tier1 = 60; FINAL = 60*500 = 30000"
            - "Second mission line FINAL: prior=160, new=250 -> included_portion = max(0, min(250, 100-160))=0; overage=250; t1=min(250,200)=200; t2=50; FINAL = 200*500 + 50*400 = 120000"
            - "invoice_cents == 150000  # 30000 + 120000, per-line round then sum"

      - name: field_health_score_nested_min_max
        grounds:
          - calculations.field_health_score
          - entities.Field.fields.health_score
        distinguishing_aspect: |
          Mode (c): nested min/max where health_score = max(0, min(100, base -
          alert_penalty)) and base itself is min(100, ...) for PLANT_COUNT;
          alert_penalty aggregates variable-weight severities. The formula's
          floor/cap behavior is load-bearing — a penalty overshoot must clamp
          at 0 (not go negative), and a high-plant-count input must clamp at
          100 (not exceed it). Distinct mode from tiered pricing.
        test_recipe:
          setup:
            - "Plan P storage_retention_days=90"
            - "Grower G on P, Field F legal_acres=200, airspace_class=G"
            - "Pilot H ACTIVE"
            - "Mission M -> NDVI deliverable with ndvi_mean=0.050 (base=5) and cells_below_threshold=30000 across 100 acres flown -> anomaly_count = round_half_up(30000*100/1000) = 3000 >= 50 -> HIGH alert created (weight 12)"
            - "penalty 12 > base 5 -> result must clamp at 0"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "SCOUT_BASIC", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "C Farms", contact_email: "c@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "Stressed", legal_acres: 200, airspace_class: "G", insurance_policy_no: "POL-C" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot D", part107_certificate_no: "P107-D", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 100 }
              as: FlightCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m_id}/capture"
              payload: { acres_flown: 100, wind_kt_max_observed: 5 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
            - call: "GET /ag-drone/missions/${m_id}/deliverables"
              payload: {}
              as: ProcessingEngine
              captures: { d_id: "$.data[0].id" }
            - call: "POST /ag-drone/deliverables/${d_id}/process"
              payload: { ndvi_mean: 0.050, cells_below_threshold: 30000 }
              as: ProcessingEngine
          trigger:
            - call: "GET /ag-drone/fields/${field_id}"
              payload: {}
              as: FlightCoordinator
              captures: { hs: $.data.health_score }
          assert:
            - "anomaly_count on deliverable == 3000  # round_half_up(30000*100/1000)"
            - "ScoutingAlert created with severity == HIGH"
            - "hs == 0   # max(0, min(100, 5 - 12)) = max(0, -7) = 0 (floor clamps)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: flight_mission_replan_cycle
        grounds:
          - state_machines.FlightMission
          - endpoints.POST /ag-drone/missions/{missionId}/replan
        distinguishing_aspect: |
          FlightMission supports a cyclic shape: PLANNED -> AUTHORIZED ->
          IN_FLIGHT -> WEATHER_ABORTED, then replan creates a fresh PLANNED
          revision (cycle back to PLANNED via a new mission record), and that
          new mission can itself be authorized, launched, and weather-aborted
          again. Cycle belongs to FlightMission entity.
        test_recipe:
          setup:
            - "Plan P spray_allowed=false; Grower G on P; Field F airspace_class=G"
            - "Pilot H ACTIVE"
            - "Mission M1 scheduled 2026-06-02 08:00-10:00 -> AUTHORIZED -> IN_FLIGHT -> WEATHER_ABORTED (wind=25)"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "SCOUT_BASIC", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "W Farms", contact_email: "w@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "WindyField", legal_acres: 100, airspace_class: "G", insurance_policy_no: "POL-W" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot E", part107_certificate_no: "P107-E", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 80 }
              as: FlightCoordinator
              captures: { m1_id: $.data.id, m1_v0: $.data.version }
            - call: "POST /ag-drone/missions/${m1_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m1_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m1_id}/abort-weather"
              payload: { wind_kt_max_observed: 25 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "GET /ag-drone/missions/${m1_id}"
              payload: {}
              as: FlightCoordinator
              captures: { m1_v_after_abort: $.data.version }
          trigger:
            - call: "POST /ag-drone/missions/${m1_id}/replan"
              payload: { scheduled_start: "2026-06-04T08:00:00Z", scheduled_end: "2026-06-04T10:00:00Z", expected_mission_version: "${m1_v_after_abort}" }
              as: FlightCoordinator
              captures: { m2_id: $.data.id, m2_status: $.data.status }
            - call: "POST /ag-drone/missions/${m2_id}/authorize"
