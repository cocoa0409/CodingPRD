            - call: "POST /regional-news-ops/region-hubs/${hub_id}/delivery-contractors"
              payload: { name: "Cedar Hill Carriers", pay_basis: "PER_STOP", per_copy_rate_cents: 45, min_stop_guarantee: 3, net_60_available: true, cost_per_copy_ceiling_cents: 600, last_load_claim_weight_lbs: 0, sanction_reason_code: "NONE" }
              as: DeliveryNetworkManager
              captures: { con_cedar_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-contractors/${con_cedar_id}/routes"
              payload: { print_market_id: "${mkt_riv_id}", route_code: "R1", stop_capacity: 6, per_stop_fee_cents: 1150, dist_per_stop_miles: 3.0, cost_per_copy_ceiling_cents: 600, printed_copies_surcharge_cents: 0, cost_run_date: "2026-09-10" }
              as: DeliveryNetworkManager
