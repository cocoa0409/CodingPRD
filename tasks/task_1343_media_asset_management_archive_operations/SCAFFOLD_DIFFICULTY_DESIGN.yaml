            - "RoyaltyStatement.${stmt_id}.volume_tier == TIER_2 (>= boundary inclusive)"
            - "RoyaltyStatement.${stmt_id}.provisional_total_cents == 386900"
            - "RoyaltyStatement.${stmt_id}.total_accrual_cents == 309520 (333500*0.8=266800 + 53400*0.8=42720)"

      - name: delivery_deadline_at_rights_window_end
        grounds:
