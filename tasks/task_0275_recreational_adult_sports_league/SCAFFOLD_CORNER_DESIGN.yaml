        claim_type: immediate
        grounds: [entities.Division.fields.confirmed_team_count]
        distinguishing_aspect: "Confirming a team updates Division.confirmed_team_count immediately; the value is visible on the very next GET (immediate consistency)."
        test_recipe:
          setup: ["An OPEN division with one PENDING team."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "IM", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "IMD", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 0 }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "IMC", email: "imc@x.com" }
              as: LeagueAdmin
              captures: { cap_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v: $.data.version }
