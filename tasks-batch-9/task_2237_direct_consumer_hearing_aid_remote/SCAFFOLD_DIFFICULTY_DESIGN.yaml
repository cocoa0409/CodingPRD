        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with max_loss_damage_claims 2, one InventoryPool NEO/M/OPEN with 5 units, one IN_STOCK NEO device."
          - "Patient age 68 screens clean and takes delivery on 2026-08-01T00:00:00Z, so Device.shipped_at is 2026-08-01T00:00:00Z and warranty_expires_at is 2028-07-31T00:00:00Z (shipped_at + 730 days)."
          - "Clock moved to 2027-08-01T00:00:00Z: device_age_months is exactly 12, the inclusive upper edge of AGE_TIER1_MONTHS."
          - "A first DEFECT claim is filed, triaged (deductible 0 because kind_factor is 0.0 and claim_ordinal is 1) and decided REPAIR so it counts toward claim_ordinal; the RepairOrder it creates stays in KIT_REQUESTED and therefore never blocks anything."
