  - method: PUT
    path: "/commercial/tool-loans/{loanId}"
    description: "Adjust the deposit held on a checked-out loan"
    roles: [CreditAnalyst]
    code: 200
    input: ["deposit_amount_cents", "expected_account_version"]
    output: ToolLoan
    side_effects:
      - "petty_cash_cents adjusted by the delta between the new and previous deposit"
      - "credit_exposure_cents recomputed"

  - method: POST
    path: "/commercial/tool-loans/{loanId}/checkout"
    description: "Check out a requested loaner tool and take the deposit"
    roles: [CommercialSalesRep]
    code: 200
    input: ["accepted_deposit_cents", "expected_account_version"]
    output: ToolLoan
    side_effects:
      - "deposit_state → HELD"
      - "petty_cash_cents += deposit_amount_cents"
      - "status → CHECKED_OUT"

  - method: POST
    path: "/commercial/tool-loans/{loanId}/return"
    description: "Record a loaner tool as returned by the driver"
    roles: [DeliveryDriver]
    code: 200
    input: []
    output: ToolLoan
    side_effects: ["status → RETURNED; returned_at set to the logical clock"]

  - method: POST
    path: "/commercial/tool-loans/{loanId}/inspect"
    description: "Inspect a returned loaner tool and record its condition"
    roles: [ToolCribAttendant]
    code: 200
    input: ["return_condition"]
    output: ToolLoan
    side_effects:
      - "wear_intensity, damage_multiplier and forfeiture_rate computed from return_condition"
      - "deposit_forfeited_cents computed"
      - "ToolCatalog.wear_accumulated += 0.4 for WORN or BROKEN"
      - "replacement_part_id selected for WORN; set to the catalogue default for LOST"
      - "status → INSPECTED"

  - method: POST
    path: "/commercial/tool-loans/{loanId}/close"
    description: "Close an inspected loan, refunding the unearned deposit"
    roles: [ToolCribAttendant]
    code: 200
    input: []
    output: ToolLoan
    side_effects:
      - "deposit_state → REFUNDED"
      - "petty_cash_cents -= (deposit_amount_cents - deposit_forfeited_cents)"
      - "status → CLOSED"

  - method: POST
    path: "/commercial/tool-loans/{loanId}/forfeit"
    description: "Close an inspected loan by forfeiting the deposit"
    roles: [ToolCribAttendant]
    code: 200
    input: []
    output: ToolLoan
    side_effects:
      - "deposit_state → APPLIED_TO_BALANCE or FORFEITED depending on the receivable balance"
      - "deposit_forfeited_cents = deposit_amount_cents"
      - "status → FORFEITED"

  # --- CoreReturn / WarrantyRegistration ---
  - method: POST
    path: "/commercial/core-returns"
    description: "Open a core return against a delivered order"
    roles: [CommercialSalesRep]
    code: 201
    input: ["order_id", "line_items"]
    output: CoreReturn
    side_effects: ["status = INITIATED", "core_subtotal_cents computed"]

  - method: GET
    path: "/commercial/core-returns"
    description: "List core returns, filtered by order or account"
    roles: [CommercialSalesRep, CreditAnalyst, ToolCribAttendant, DeliveryDriver, Any]
    code: 200
    input: ["order_id?", "account_id?", "status?", "limit?", "offset?"]
    output: "CoreReturn[]"
    side_effects: []

  - method: GET
    path: "/commercial/part-orders/{orderId}/core-returns"
    description: "Find the core returns opened against a part order"
    roles: [CommercialSalesRep, CreditAnalyst, ToolCribAttendant, DeliveryDriver, Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CoreReturn[]"
    side_effects: []

  - method: GET
    path: "/commercial/part-orders/{orderId}/route-stops"
    description: "Find the route stops at which a part order is dropped"
    roles: [RouteDispatcher, DeliveryDriver, CommercialSalesRep, CreditAnalyst, Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []

  - method: GET
    path: "/commercial/core-returns/{coreReturnId}"
    description: "Get one core return"
    roles: [CommercialSalesRep, CreditAnalyst, ToolCribAttendant, DeliveryDriver, Any]
    code: 200
    input: []
    output: CoreReturn
    side_effects: []

  - method: POST
    path: "/commercial/core-returns/{coreReturnId}/transit"
    description: "Mark a core return as in transit back to the hub"
    roles: [DeliveryDriver]
    code: 200
    input: []
    output: CoreReturn
    side_effects: ["status → IN_TRANSIT"]

  - method: POST
    path: "/commercial/core-returns/{coreReturnId}/inspect"
    description: "Inspect a core return and compute its credit"
    roles: [ToolCribAttendant]
    code: 200
    input: []
    output: CoreReturn
    side_effects:
      - "core_subtotal_cents, warranty_covered, restocking_fee_cents and credit_amount_cents computed"
      - "status → INSPECTED"

  - method: POST
    path: "/commercial/core-returns/{coreReturnId}/credit"
    description: "Post the inspected core credit to the account"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: CoreReturn
    side_effects:
      - "petty_cash_cents += credit_amount_cents"
      - "receivable_balance_cents and credit_exposure_cents recomputed"
      - "status → CREDITED"

  - method: POST
    path: "/commercial/core-returns/{coreReturnId}/reject"
    description: "Reject a core return before inspection or in transit"
    roles: [ToolCribAttendant]
    code: 200
    input: []
    output: CoreReturn
    side_effects: ["status → REJECTED; no credit posted"]

  - method: POST
    path: "/commercial/warranty-registrations"
    description: "Record a warranty for an account and part without requiring a receipt lookup"
    roles: [CommercialSalesRep]
    code: 201
    input: ["account_id", "part_id", "purchase_order_id?", "purchased_at", "warranty_expires_at", "claim_reference?"]
    output: WarrantyRegistration
    side_effects: []

  - method: GET
    path: "/commercial/warranty-registrations"
    description: "List warranty registrations, filtered by account or part"
    roles: [CommercialSalesRep, CreditAnalyst, ToolCribAttendant, DeliveryDriver, Any]
    code: 200
    input: ["account_id?", "part_id?", "purchase_order_id?", "limit?", "offset?"]
    output: "WarrantyRegistration[]"
    side_effects: []

  - method: GET
    path: "/commercial/commercial-accounts/{accountId}/warranty-registrations"
    description: "Find the warranty registrations held by a commercial account"
    roles: [CommercialSalesRep, CreditAnalyst, ToolCribAttendant, DeliveryDriver, Any]
    code: 200
    input: ["part_id?", "limit?", "offset?"]
    output: "WarrantyRegistration[]"
    side_effects: []

  - method: GET
    path: "/commercial/warranty-registrations/{registrationId}"
    description: "Get one warranty registration"
    roles: [CommercialSalesRep, CreditAnalyst, ToolCribAttendant, DeliveryDriver, Any]
    code: 200
    input: []
    output: WarrantyRegistration
    side_effects: []

  # --- ServiceRoute / RouteStop ---
  - method: POST
    path: "/commercial/service-routes"
    description: "Create a driver service route"
    roles: [RouteDispatcher]
    code: 201
    input: ["route_code", "service_date", "driver_id", "driver_type", "departure_at", "shift_end_at"]
    output: ServiceRoute
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/commercial/service-routes"
    description: "List service routes"
    roles: [RouteDispatcher, DeliveryDriver, CommercialSalesRep, CreditAnalyst, Any]
    code: 200
    input: ["service_date?", "driver_id?", "status?", "limit?", "offset?"]
    output: "ServiceRoute[]"
    side_effects: []

  - method: GET
    path: "/commercial/service-routes/{routeId}"
    description: "Get one service route"
    roles: [RouteDispatcher, DeliveryDriver, CommercialSalesRep, CreditAnalyst, Any]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: []

  - method: POST
    path: "/commercial/service-routes/{routeId}/stops"
    description: "Attach a delivery stop to a draft route"
    roles: [RouteDispatcher]
    code: 201
    input: ["account_id", "stop_kind", "delivery_window_start", "delivery_window_end", "travel_minutes_from_previous", "drop_minutes", "order_ids?", "expected_route_version"]
    output: RouteStop
    side_effects: ["status = PLANNED; projected fields derived once the route is planned"]

  - method: GET
    path: "/commercial/service-routes/{routeId}/stops"
    description: "Find the stops on a service route"
    roles: [RouteDispatcher, DeliveryDriver, CommercialSalesRep, CreditAnalyst, Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []

  - method: GET
    path: "/commercial/service-routes/{routeId}/stops/{stopId}"
    description: "Get one stop on a service route"
    roles: [RouteDispatcher, DeliveryDriver, CommercialSalesRep, CreditAnalyst, Any]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: POST
    path: "/commercial/service-routes/{routeId}/plan"
    description: "Sequence a draft route's stops and compute projections"
    roles: [RouteDispatcher]
    code: 200
    input: ["expected_route_version"]
    output: ServiceRoute
    side_effects:
      - "stop_sequence assigned by the deterministic stop-ordering rule"
      - "effective_departure_at derived; every stop's projected and lateness fields computed"
      - "status → PLANNED"

  - method: POST
    path: "/commercial/service-routes/{routeId}/dispatch"
    description: "Dispatch a planned route and its picked orders"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: ServiceRoute
    side_effects:
      - "every RouteStop → EN_ROUTE"
      - "every PICKING PartOrder on the route → DISPATCHED"
      - "status → DISPATCHED"

  - method: POST
    path: "/commercial/service-routes/{routeId}/revert-to-draft"
    description: "Return a planned route to draft"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: ["every RouteStop → PLANNED and cleared", "status → DRAFT"]

  - method: POST
    path: "/commercial/service-routes/{routeId}/complete"
    description: "Complete a dispatched route and compute the driver credit"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: ServiceRoute
    side_effects: ["total_miles and run_credit_cents computed", "status → COMPLETED"]

  - method: POST
    path: "/commercial/service-routes/{routeId}/cancel"
    description: "Cancel a route"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: ServiceRoute
    side_effects:
      - "every RouteStop → REJECTED"
      - "every DISPATCHED PartOrder on the route reverts to CONFIRMED"
      - "status → CANCELLED"

  - method: GET
    path: "/commercial/route-stops"
    description: "List route stops, filtered by route"
    roles: [RouteDispatcher, DeliveryDriver, CommercialSalesRep, CreditAnalyst, Any]
    code: 200
    input: ["route_id?", "account_id?", "status?", "stop_kind?", "order_ids?", "limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []

  - method: GET
    path: "/commercial/route-stops/{stopId}"
    description: "Get one route stop"
    roles: [RouteDispatcher, DeliveryDriver, CommercialSalesRep, CreditAnalyst, Any]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: GET
    path: "/commercial/route-stops/{stopId}/orders"
    description: "Find the part orders dropped at a route stop"
    roles: [RouteDispatcher, DeliveryDriver, CommercialSalesRep, CreditAnalyst, Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PartOrder[]"
    side_effects: []

  - method: POST
    path: "/commercial/route-stops/{stopId}/deliver"
    description: "Complete a stop at the shop"
    roles: [DeliveryDriver]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status → DELIVERED", "every PartOrder dropped at this stop is delivered through the order deliver side effects"]

  - method: POST
    path: "/commercial/route-stops/{stopId}/miss"
    description: "Record a stop as missed"
    roles: [DeliveryDriver]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status → MISSED", "orders revert to CONFIRMED", "later stops re-derived"]

  - method: POST
    path: "/commercial/route-stops/{stopId}/reject"
    description: "Reject a stop before dispatch"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status → REJECTED", "orders revert to CONFIRMED", "later stops re-derived"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing, or the role is not a declared role"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The caller's role is not listed on the endpoint"

  # --- input validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request body is malformed or a required field is absent"
  - id: ERR_INVALID_DELIVERY_WINDOW
    http: 400
    condition: "delivery_window_end is not strictly after delivery_window_start"
  - id: ERR_FITMENT_YEAR_RANGE_INVALID
    http: 400
    condition: "PartFitment.year_to is earlier than PartFitment.year_from"
  - id: ERR_HAZARDOUS_PART_NOT_DELIVERABLE
    http: 400
    condition: "A hazardous part was added to an order whose account is on DELIVERY_DESK service"

  # --- existence ---
  - id: ERR_COMMERCIAL_ACCOUNT_NOT_FOUND
    http: 404
    condition: "CommercialAccount id in the path does not exist"
  - id: ERR_PART_ORDER_NOT_FOUND
    http: 404
    condition: "PartOrder id in the path does not exist"
  - id: ERR_TOOL_LOAN_NOT_FOUND
    http: 404
    condition: "ToolLoan id in the path does not exist"
  - id: ERR_CORE_RETURN_NOT_FOUND
    http: 404
    condition: "CoreReturn id in the path does not exist"
  - id: ERR_SERVICE_ROUTE_NOT_FOUND
    http: 404
    condition: "ServiceRoute id in the path does not exist"
  - id: ERR_ROUTE_STOP_NOT_FOUND
    http: 404
    condition: "RouteStop id in the path does not exist"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "Store id in the path does not exist"
  - id: ERR_PART_NOT_FOUND
    http: 404
    condition: "Part id in the path does not exist"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "Vehicle id in the path does not exist"
  - id: ERR_SALES_REP_NOT_FOUND
    http: 404
    condition: "SalesRep id in the path does not exist"
  - id: ERR_COVERAGE_NOT_FOUND
    http: 404
    condition: "RepCoverage id in the path does not exist"
  - id: ERR_TOOL_CATALOG_NOT_FOUND
    http: 404
    condition: "ToolCatalog id in the path does not exist"
  - id: ERR_INVENTORY_ITEM_NOT_FOUND
    http: 404
    condition: "InventoryItem id in the path does not exist"

  # --- state preconditions ---
  - id: ERR_ORDER_NOT_DRAFT
    http: 409
    condition: "PartOrder is not in DRAFT for this operation"
  - id: ERR_ORDER_NOT_CONFIRMED
    http: 409
    condition: "PartOrder is not in CONFIRMED for this operation"
  - id: ERR_ORDER_NOT_ALLOCATED
    http: 409
    condition: "PartOrder is not in ALLOCATED for this operation"
  - id: ERR_ORDER_NOT_PICKING
    http: 409
    condition: "PartOrder is not in PICKING for this operation"
  - id: ERR_ORDER_NOT_DISPATCHED
    http: 409
    condition: "PartOrder is not in DISPATCHED for this operation"
  - id: ERR_ORDER_NOT_DELIVERED
    http: 409
    condition: "PartOrder is not in DELIVERED for this operation"
  - id: ERR_ORDER_NOT_VOIDABLE
    http: 409
    condition: "PartOrder is in a state from which void is not permitted"
  - id: ERR_LOAN_NOT_REQUESTED
    http: 409
    condition: "ToolLoan is not in REQUESTED"
  - id: ERR_LOAN_NOT_CHECKED_OUT
    http: 409
    condition: "ToolLoan is not in CHECKED_OUT"
  - id: ERR_LOAN_NOT_OUT
    http: 409
    condition: "ToolLoan is not in IN_USE, DUE or OVERDUE"
  - id: ERR_LOAN_NOT_RETURNED
    http: 409
    condition: "ToolLoan is not in RETURNED"
  - id: ERR_LOAN_NOT_INSPECTED
    http: 409
    condition: "ToolLoan is not in INSPECTED"
  - id: ERR_LOAN_NOT_CLOSABLE
    http: 409
    condition: "ToolLoan inspection condition does not permit close"
  - id: ERR_DEPOSIT_NOT_HELD
    http: 409
    condition: "ToolLoan deposit is not in HELD"
  - id: ERR_INVALID_RETURN_CONDITION
    http: 400
    condition: "return_condition is not one of GOOD, WORN, BROKEN, LOST"
  - id: ERR_INSUFFICIENT_TOOL_WEAR
    http: 409
    condition: "ToolCatalog.wear_accumulated has not reached the band threshold"
  - id: ERR_INVALID_TOOL_WEAR_BAND
    http: 409
    condition: "ToolCatalog.wear_band is not the band the transition requires"
  - id: ERR_INVALID_ACCOUNT_POSTURE
    http: 409
    condition: "CommercialAccount.account_posture is not the state the transition requires"
  - id: ERR_CREDIT_LIMIT_STILL_EXCEEDED
    http: 409
    condition: "Account cannot be released or restored while exposure still exceeds the limit"
  - id: ERR_CORE_RETURN_NOT_INITIATED
    http: 409
    condition: "CoreReturn is not in INITIATED"
  - id: ERR_CORE_RETURN_NOT_IN_TRANSIT
    http: 409
    condition: "CoreReturn is not in IN_TRANSIT"
  - id: ERR_CORE_RETURN_NOT_INSPECTED
    http: 409
    condition: "CoreReturn is not in INSPECTED"
  - id: ERR_CORE_RETURN_NOT_REJECTABLE
    http: 409
    condition: "CoreReturn has already reached a terminal state"
  - id: ERR_ROUTE_NOT_DRAFT
    http: 409
    condition: "ServiceRoute is not in DRAFT"
  - id: ERR_ROUTE_NOT_PLANNED
    http: 409
    condition: "ServiceRoute is not in PLANNED"
  - id: ERR_ROUTE_NOT_DISPATCHED
    http: 409
    condition: "ServiceRoute is not in DISPATCHED"
  - id: ERR_ROUTE_NOT_CANCELLABLE
    http: 409
    condition: "ServiceRoute has already reached a terminal state"
  - id: ERR_ROUTE_STOP_NOT_ACTIVE
    http: 409
    condition: "RouteStop carrying the order is not in SEQUENCED or EN_ROUTE"
  - id: ERR_ROUTE_STOP_NOT_TERMINAL
    http: 409
    condition: "RouteStop carrying the order is not in MISSED or REJECTED"
  - id: ERR_ROUTE_STOPS_UNRESOLVED
    http: 409
    condition: "ServiceRoute still carries stops in a non-terminal state"
  - id: ERR_STOP_NOT_EN_ROUTE
    http: 409
    condition: "RouteStop is not in EN_ROUTE"
  - id: ERR_STOP_NOT_REJECTABLE
    http: 409
    condition: "RouteStop is not in PLANNED or SEQUENCED"
  - id: ERR_STOP_PAST_WINDOW
    http: 409
    condition: "RouteStop.lateness_minutes is greater than zero, so the stop cannot be recorded as delivered"
  - id: ERR_PART_ALREADY_SUPERSEDED
    http: 409
    condition: "Part.catalog_state is already SUPERSEDED"
  - id: ERR_PART_NOT_SUPERSEDED
    http: 409
    condition: "Part.catalog_state is not SUPERSEDED"
  - id: ERR_COVERAGE_NOT_STARTED
    http: 409
    condition: "Logical clock is before RepCoverage.effective_from"
  - id: ERR_COVERAGE_STILL_OPEN
    http: 409
    condition: "Logical clock is not yet past RepCoverage.effective_to"
  - id: ERR_COVERAGE_NOT_EXPIRED
    http: 409
    condition: "RepCoverage is not in EXPIRED"
  - id: ERR_COVERAGE_NOT_ENDABLE
    http: 409
    condition: "RepCoverage is in a terminal state"
  - id: ERR_COVERAGE_EXTENSION_NOT_FORWARD
    http: 409
    condition: "The requested effective_to is not strictly after the logical clock"
  - id: ERR_ACCOUNT_NOT_OPEN
    http: 409
    condition: "CommercialAccount.account_posture is not OPEN"
  - id: ERR_ACCOUNT_CLOSED
    http: 409
    condition: "CommercialAccount.account_posture is CLOSED"
  - id: ERR_OPEN_ORDERS_EXIST
    http: 409
    condition: "Account still carries a PartOrder in an open state"
  - id: ERR_OPEN_LOANS_EXIST
    http: 409
    condition: "Account still carries a ToolLoan in a non-terminal state"
  - id: ERR_OPEN_CORE_RETURNS_EXIST
    http: 409
    condition: "Account still carries a CoreReturn in a non-terminal state"

  # --- business rules ---
  - id: ERR_FITMENT_MISMATCH
    http: 409
    condition: "An order line's part does not fit the order's vehicle by fitment, interchange or supersession"
  - id: ERR_SUPERSEDING_PART_NOT_FOUND
    http: 409
    condition: "The named superseding part does not exist or is archived"
  - id: ERR_SUPERSEDING_PART_NOT_TERMINAL
    http: 409
    condition: "The named superseding part is not the terminal current part of its own chain"
  - id: ERR_SUPERSESSION_CYCLE
    http: 409
    condition: "The supersession would close a cycle through the existing chain"
  - id: ERR_ARCHIVE_BLOCKED_BY_OPEN_REFERENCE
    http: 409
    condition: "A non-terminal resource still references the entity being archived"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "The selected source does not hold available_units for an order line"
  - id: ERR_NO_FULFILLMENT_SOURCE
    http: 409
    condition: "No routing band produced a source, so the order is UNROUTABLE"
  - id: ERR_SAME_DAY_SLOT_TAKEN
    http: 409
    condition: "The account already holds an allocated or picking order against the same source store today"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "The source store's committed_units_today would exceed daily_capacity_units"
  - id: ERR_RETURN_WINDOW_CLOSED
    http: 409
    condition: "The delivery-plus-30-days return window has passed"
  - id: ERR_CORE_QUANTITY_EXCEEDS_PURCHASE
    http: 409
    condition: "A core return line exceeds the quantity of that part on the referenced order"
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "The matched warranty registration lapsed before the logical clock"
  - id: ERR_STOP_WINDOW_BEFORE_DEPARTURE
    http: 400
    condition: "A stop's delivery window closes before the route departs"
  - id: ERR_STOP_WINDOW_OVERLAP
    http: 409
    condition: "A new stop's window overlaps an existing non-rejected stop window on the same account and date"
  - id: ERR_COVERAGE_OVERLAP
    http: 409
    condition: "A new coverage window overlaps a non-expired window for the same account"
  - id: ERR_DRIVER_ROUTE_CONFLICT
    http: 409
    condition: "The driver already holds a non-terminal route for this service date"
  - id: ERR_ROUTE_HAS_NO_STOPS
    http: 409
    condition: "A route cannot be planned with no stops"
  - id: ERR_SHIFT_END_EXCEEDED
    http: 409
    condition: "A stop would be projected past the driver's shift end"
  - id: ERR_WINDOW_EXPIRED
    http: 409
    condition: "The 30-minute rollback window measured from the earliest delivered stop has passed"
  - id: ERR_TOOL_ALREADY_ON_LOAN
    http: 409
    condition: "The account already holds this tool on an open loan"
  - id: ERR_DEPOSIT_BELOW_MINIMUM
    http: 402
    condition: "The requested deposit is below the tool's catalogue deposit"
  - id: ERR_DEPOSIT_AMOUNT_EXCEEDS_CHARGE
    http: 409
    condition: "The refundable amount exceeds the deposit originally charged"
  - id: ERR_RETURN_DESK_STOP_MISSING
    http: 409
    condition: "No return-desk stop exists for the account, so the tool cannot be inspected"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "Cumulative credit exposure would exceed the account's credit limit"
  - id: ERR_RECEIVABLE_BALANCE_OUTSTANDING
    http: 402
    condition: "The account still carries a receivable balance"
  - id: ERR_INVALID_LINE_REFERENCE
    http: 400
    condition: "An order line carries a record_id that is not greater than zero"
  - id: ERR_DESTINATION_MISMATCH
    http: 400
    condition: "A destination id on the payload does not match the id in the path"
  - id: ERR_DELIVERY_ADDRESS_MISMATCH
    http: 409
    condition: "The delivery address does not belong to the ordering account"
  - id: ERR_RESTOCKING_FEE_MISAPPLIED
    http: 409
    condition: "A restocking fee was computed on a warranty-covered credit"
  - id: ERR_ACCOUNT_TIER_MISMATCH
    http: 409
    condition: "The order would be priced at a band its own account has not reached"
  - id: ERR_ROUTE_SLICE_INCOMPLETE
    http: 409
    condition: "Another order dropped at the same RouteStop has not been delivered yet"
  - id: ERR_ORDER_ALREADY_DELIVERED
    http: 409
    condition: "PartOrder.delivered_at is already set"
  - id: ERR_PART_NOT_RETURNABLE
    http: 409
    condition: "A line on the order carries a non-returnable part"
  - id: ERR_STALE_ACCOUNT_VERSION
