            - call: "GET /mills/${mill_id}/campaigns/${camp_ok}"
              payload: {}
              as: Scheduler
              captures: { camp_ok_v: $.data.version }
            - call: "GET /mills/${mill_id}/campaigns/${camp_over}"
              payload: {}
              as: Scheduler
              captures: { camp_over_v: $.data.version }
          trigger:
            - call: "POST /mills/${mill_id}/campaigns/${camp_ok}/commit"
              payload: { expected_campaign_version: "${camp_ok_v}" }
              as: Scheduler
              captures: { ok_status: $.data.status }
            - call: "POST /mills/${mill_id}/campaigns/${camp_over}/commit"
              payload: { expected_campaign_version: "${camp_over_v}" }
              as: Scheduler
              captures: { over_err: $.data.error_id }
          assert:
            - "Camp-OK: single line => roll_changes_used == 0 == budget 0, commits with ok_status == COMMITTED (the boundary is inclusive: changes <= budget passes)"
            - "Camp-Over: tap-ordered line sequence is H-B1(09-16, GROUP_B) -> H-A2(09-17, GROUP_A) -> H-B2(09-18, GROUP_B) = 2 changes > budget 1, so the commit rejects with over_err == ERR_ROLL_CHANGE_BUDGET_EXCEEDED"
            - "Campaign.${camp_over}.status remains OPEN after the rejected commit"

      - name: contract_underdelivered_fill_boundary
        grounds:
          - validations[priority=19]
          - errors.ERR_UNDER_DELIVERED
          - state_machines.ProcurementContract.OPEN_to_CLOSED
        distinguishing_aspect: |
          Zero/ratio boundary on a different metric (contract fill ratio) and a
          different endpoint (contract close): received_tons == exactly 80% of
          committed closes; one lot short of 80% rejects with
          ERR_UNDER_DELIVERED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill; FIXED contract C1 committed 100t with one 80t dry lot (exactly 80%); FIXED contract C2 committed 100t with one 79t dry lot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "Exact Fill Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_80: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_80}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 80, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "Short Fill Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_79: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_79}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 79, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
          trigger:
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_80}/close"
              payload: {}
              as: ProcurementOfficer
              captures: { c80_status: $.data.status }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_79}/close"
              payload: {}
              as: ProcurementOfficer
              captures: { c79_err: $.data.error_id }
          assert:
            - "C1 (80/100 = exactly the 0.80 floor) closes: c80_status == CLOSED"
            - "C2 (79/100 < 0.80) rejects: c79_err == ERR_UNDER_DELIVERED and the contract remains OPEN"
            - "C1 settlement_tons == 80 and settlement_amount_cents == 3120000 (80 * 39000)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_confirm_gated_by_account_credit
        grounds:
          - state_machines.Order.QUOTED_to_CONFIRMED
          - state_machines.CustomerAccount
          - validations[priority=17]
        distinguishing_aspect: |
          Order → CustomerAccount: the order's valid transitions depend on the
          account's credit_status. Pair: Order × CustomerAccount.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill, SHREDDED 2026-09 index, grade, SPOT account at WATCH with a QUOTED order (still confirmable — only BLOCKED gates)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", price_per_ton_cents: 38000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
