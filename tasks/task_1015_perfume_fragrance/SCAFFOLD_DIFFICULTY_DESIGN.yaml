scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_estimate_vs_final_on_order_return
        grounds:
          - calculations.return_refund
          - state_machines.ReturnRequest.REQUESTED_to_APPROVED
          - entities.ReturnRequest.fields.refund_estimate_cents
          - entities.ReturnRequest.fields.final_refund_cents
        distinguishing_aspect: |
          On the Order/Return domain, the provisional estimate (flat RESTOCK_FEE_ESTIMATE_CENTS
          subtracted -> 11500) differs from the condition-driven SEALED final (full 12000).
        test_recipe:
          setup:
            - "One ACTIVE customer; a product with a FULL_BOTTLE variant priced 12000, on_hand 5."
            - "An order of that variant qty 1, PLACED then FULFILLED (line_total 12000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "A" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Noir", brand: "Maison", concentration: "EDP", hygiene_returnable: true }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 12000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentOps
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${order_id}", line_ids: ["${line_id}"], condition: "SEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { return_id: $.data.id }
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: FulfillmentOps
          assert:
            - "ReturnRequest.${return_id}.refund_estimate_cents == 11500"
            - "ReturnRequest.${return_id}.final_refund_cents == 12000"

      - name: subscription_actual_vs_projected_charge
        grounds:
          - calculations.subscription_charge
          - entities.Shipment.fields.charge_cents
          - entities.Subscription.fields.projected_next_charge_cents
        distinguishing_aspect: |
          On the Subscription domain, the shipment's actual charge keyed on period_start
          2026-07-01 (fee still 5000) differs from the forward-looking projected charge at
          the next boundary 2026-08-01 (pending fee 6000).
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-07-01T00:00:00Z."
            - "An ACTIVE subscription: monthly_fee 5000, pending_fee 6000 effective 2026-08-01, current_period_end 2026-08-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "b@x.com", full_name: "B" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", tier: "BASIC", monthly_fee_cents: 5000, pending_fee_cents: 6000, fee_effective_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/shipments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FulfillmentOps
              captures: { ship_id: $.data.id }
          assert:
            - "Shipment.${ship_id}.charge_cents == 5000"
            - "Subscription.${sub_id}.projected_next_charge_cents == 6000"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_shipping_threshold_after_loyalty_mode_c
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.shipping_fee_cents
          - entities.Order.fields.total_cents
          - entities.Order.fields.loyalty_redeemed_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: free-shipping threshold is keyed on
          net_after_loyalty (7400, computed BEFORE shipping) not on total, so redeeming
          600 points drops the order below FREE_SHIP_THRESHOLD and adds 595 shipping.
        test_recipe:
          setup:
            - "Customer with a 600-point balance earned by fulfilling a prior 60000 order (BRONZE mult 1.0 -> 600 points)."
            - "A standard variant priced 8000, on_hand 2, in a second order."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Lux", brand: "Maison", concentration: "PARFUM" }
              as: Merchandiser
              captures: { lux_prod: $.data.id }
            - call: "POST /products/${lux_prod}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 60000, on_hand_qty: 2 }
              as: Merchandiser
              captures: { lux_var: $.data.id }
            - call: "POST /products"
              payload: { name: "Std", brand: "House", concentration: "EDT" }
              as: Merchandiser
              captures: { std_prod: $.data.id }
            - call: "POST /products/${std_prod}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 50, unit_price_cents: 8000, on_hand_qty: 2 }
              as: Merchandiser
              captures: { std_var: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_a: $.data.id }
            - call: "POST /orders/${order_a}/lines"
              payload: { variant_id: "${lux_var}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_a}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_a}/fulfill"
              payload: {}
              as: FulfillmentOps
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_b: $.data.id }
            - call: "POST /orders/${order_b}/lines"
              payload: { variant_id: "${std_var}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_b}/place"
              payload: { redeem_points: 600 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${order_b}.subtotal_cents == 8000"
            - "Order.${order_b}.loyalty_redeemed_cents == 600"
            - "Order.${order_b}.shipping_fee_cents == 595"
            - "Order.${order_b}.total_cents == 7995"

      - name: loyalty_round_per_line_then_sum_mode_b
        grounds:
          - calculations.loyalty_points_earned
          - state_machines.Order.PLACED_to_FULFILLED
          - entities.OrderLine.fields.points_earned
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: |
          Mode (b) pinned rounding order: two lines of 250 each earn round_half_up(2.5)=3
          per line -> 6 total, NOT round_half_up(500/100)=5 (sum-then-round).
        test_recipe:
          setup:
            - "One BRONZE customer (mult 1.0)."
            - "Two distinct SAMPLE variants each priced 250, on_hand 20; an order with one line of each."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "d@x.com", full_name: "D" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Samples", brand: "House", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "SAMPLE", volume_ml: 2, unit_price_cents: 250, on_hand_qty: 20 }
              as: Merchandiser
              captures: { s1: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "SAMPLE", volume_ml: 2, unit_price_cents: 250, on_hand_qty: 20 }
              as: Merchandiser
              captures: { s2: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${s1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { l1: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${s2}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { l2: $.data.id }
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentOps
          assert:
            - "OrderLine.${l1}.points_earned == 3"
            - "OrderLine.${l2}.points_earned == 3"
            - "Customer.${cust_id}.loyalty_points_balance == 6"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order.CART_to_PLACED
          - state_machines.Order.PLACED_to_FULFILLED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent state dimensions: place advances fulfillment
          CART->PLACED and payment UNPAID->PAID; fulfill then advances fulfillment
          PLACED->FULFILLED while payment stays PAID (dimensions evolve independently).
        test_recipe:
          setup:
            - "Customer; a FULL_BOTTLE variant priced 12000, on_hand 5; order of qty 1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e@x.com", full_name: "E" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Ambre", brand: "Maison", concentration: "EDP" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 12000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentOps
          assert:
            - "Order.${order_id}.fulfillment_status == FULFILLED"
            - "Order.${order_id}.payment_status == PAID"

      - name: subscription_cyclic_pause_resume
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.status
          - entities.Subscription.fields.version
        distinguishing_aspect: |
          Subscription forms an A->B->A cycle: ACTIVE->PAUSED->ACTIVE->PAUSED, each hop
          bumping version (1 at create, 4 after the third transition).
        test_recipe:
          setup:
            - "One ACTIVE subscription (version 1)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "f@x.com", full_name: "F" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", tier: "PREMIUM", monthly_fee_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Subscription.${sub_id}.status == PAUSED"
            - "Subscription.${sub_id}.version == 4"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_approve_depth3_line_order_customer
        grounds:
          - state_machines.ReturnRequest.REQUESTED_to_APPROVED
          - state_machines.Order.FULFILLED_to_RETURNED
          - entities.OrderLine.fields.status
          - entities.Customer.fields.loyalty_points_balance
          - entities.Customer.fields.tier
        distinguishing_aspect: |
          One approve triggers a >=3-hop chain: OrderLine->RETURNED, which drives
          Order->RETURNED/REFUNDED, which drives the loyalty REVERSAL and Customer
          balance/lifetime/tier recompute (balance 100->0, tier back to BRONZE).
        test_recipe:
          setup:
            - "BRONZE customer; a SEALED-returnable order of a single 10000 line, PLACED then FULFILLED (earns 100 points, lifetime 9500)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "g@x.com", full_name: "G" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Cedre", brand: "Maison", concentration: "EDP", hygiene_returnable: true }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 10000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentOps
            - call: "POST /returns"
              payload: { order_id: "${order_id}", line_ids: ["${line_id}"], condition: "SEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { return_id: $.data.id }
          trigger:
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: FulfillmentOps
          assert:
            - "OrderLine.${line_id}.status == RETURNED"
            - "Order.${order_id}.fulfillment_status == RETURNED"
            - "Order.${order_id}.payment_status == REFUNDED"
            - "Customer.${cust_id}.loyalty_points_balance == 0"
            - "Customer.${cust_id}.lifetime_spend_cents == 0"
            - "Customer.${cust_id}.tier == BRONZE"

      - name: order_cancel_depth2_line_inventory_release
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - entities.OrderLine.fields.status
          - entities.Variant.fields.on_hand_qty
          - entities.Variant.fields.reserved_qty
        distinguishing_aspect: |
          A different trigger (order cancel from PLACED) drives a 2-hop chain:
          OrderLine->CANCELLED, which releases the variant reservation (reserved 3->0,
          on_hand 7->10).
        test_recipe:
          setup:
            - "Customer; variant on_hand 10; order of qty 3, PLACED (reserved 3, on_hand 7)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h@x.com", full_name: "H" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Musk", brand: "House", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "DECANT", volume_ml: 10, unit_price_cents: 3500, on_hand_qty: 10 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "OrderLine.${line_id}.status == CANCELLED"
            - "Variant.${var_id}.reserved_qty == 0"
            - "Variant.${var_id}.on_hand_qty == 10"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_double_place
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - state_machines.Order.CART_to_PLACED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A re-place carries both a state violation (order already PLACED, priority 4)
          and a fiscal violation (redeem 999 > balance 0, priority 9); the state error
          wins -> ERR_INVALID_STATE, not ERR_INSUFFICIENT_POINTS.
        test_recipe:
          setup:
            - "Customer with 0 points; variant on_hand 5; order of qty 1 already PLACED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "i@x.com", full_name: "I" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Vetiver", brand: "House", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 9000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 999 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: safety_beats_referential_on_return
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_HYGIENE_NON_RETURNABLE]
          - errors[ERR_LINE_NOT_IN_ORDER]
        distinguishing_aspect: |
          A return with condition OPENED on hygiene-non-returnable products (safety,
          priority 5) AND line_ids pointing to a foreign order's line (referential,
          priority 6): safety wins -> ERR_HYGIENE_NON_RETURNABLE.
        test_recipe:
          setup:
            - "Two products, both hygiene_returnable false; order A (fulfilled) of product1 line; order B (fulfilled) of product2 line."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "j@x.com", full_name: "J" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "P1", brand: "House", concentration: "EDT", hygiene_returnable: false }
              as: Merchandiser
              captures: { p1: $.data.id }
            - call: "POST /products/${p1}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 12000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { v1: $.data.id }
            - call: "POST /products"
              payload: { name: "P2", brand: "House", concentration: "EDT", hygiene_returnable: false }
              as: Merchandiser
              captures: { p2: $.data.id }
            - call: "POST /products/${p2}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 12000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { v2: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_a: $.data.id }
            - call: "POST /orders/${order_a}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_a}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_a}/fulfill"
              payload: {}
              as: FulfillmentOps
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_b: $.data.id }
            - call: "POST /orders/${order_b}/lines"
              payload: { variant_id: "${v2}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_b: $.data.id }
            - call: "POST /orders/${order_b}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_b}/fulfill"
              payload: {}
              as: FulfillmentOps
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${order_a}", line_ids: ["${line_b}"], condition: "OPENED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_HYGIENE_NON_RETURNABLE"
            - "response.http_status == 422"

  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: allocation_claim_exact_remaining_boundary
        grounds:
          - validations[priority=8]
          - calculations.allocation_remaining
          - errors[ERR_ALLOCATION_EXHAUSTED]
          - concurrency_rules[claim-create-stale-window]
        distinguishing_aspect: |
          Metric = allocation count on POST /allocation-windows/{id}/claims: claiming
          exactly the remaining 10 succeeds (claimed_units == total_allocation), a
          further 1 unit is rejected ERR_ALLOCATION_EXHAUSTED.
        test_recipe:
          setup:
            - "Exclusive product, per_customer_limit 100; one window 2026-06-15..2026-07-31 (OPEN at default clock), total_allocation 10, per_customer_cap 100."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "k@x.com", full_name: "K" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Excl", brand: "Maison", concentration: "PARFUM", is_exclusive: true, per_customer_limit: 100 }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/allocation-windows"
              payload: { window_start: "2026-06-15T00:00:00Z", window_end: "2026-07-31T00:00:00Z", total_allocation: 10, per_customer_cap: 100 }
              as: Merchandiser
              captures: { win_id: $.data.id, wv0: $.data.version }
            - call: "POST /allocation-windows/${win_id}/claims"
              payload: { customer_id: "${cust_id}", units: 10, expected_window_version: "${wv0}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /allocation-windows/${win_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wv1: $.data.version }
          trigger:
            - call: "POST /allocation-windows/${win_id}/claims"
              payload: { customer_id: "${cust_id}", units: 1, expected_window_version: "${wv1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "AllocationWindow.${win_id}.claimed_units == 10"
            - "response.data.error_id == ERR_ALLOCATION_EXHAUSTED"

      - name: place_empty_order_zero_lines_boundary
        grounds:
          - validations[priority=8]
          - errors[ERR_EMPTY_ORDER]
          - state_machines.Order.CART_to_PLACED
        distinguishing_aspect: |
          Metric = line-count zero on POST /orders/{id}/place (a different endpoint and
          a different metric from the allocation-count boundary): placing a cart with no
          ACTIVE lines is rejected ERR_EMPTY_ORDER.
        test_recipe:
          setup:
            - "An empty CART order (no lines)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "l@x.com", full_name: "L" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_ORDER"
            - "response.http_status == 422"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: place_requires_customer_active
        grounds:
          - validations[priority=8]
          - state_machines.Customer.ACTIVE_to_SUSPENDED
          - entities.Customer.fields.status
          - errors[ERR_CUSTOMER_SUSPENDED]
        distinguishing_aspect: |
          Entity pair Order<-Customer: an order's CART->PLACED transition is blocked when
          the owning Customer.status == SUSPENDED -> ERR_CUSTOMER_SUSPENDED.
        test_recipe:
          setup:
            - "Customer with a ready CART order (variant on_hand 5, qty 1), then SUSPENDED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "m@x.com", full_name: "M" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Q", brand: "House", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 9000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /customers/${cust_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CUSTOMER_SUSPENDED"
            - "response.http_status == 403"

      - name: generate_shipment_requires_subscription_active
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - entities.Subscription.fields.status
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Shipment<-Subscription: generating a shipment is blocked when the
          parent Subscription.status == PAUSED -> ERR_SUBSCRIPTION_NOT_ACTIVE (a
          different pair from Order<-Customer).
        test_recipe:
          setup:
            - "A PAUSED subscription."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "n@x.com", full_name: "N" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", tier: "BASIC", monthly_fee_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/shipments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FulfillmentOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SUBSCRIPTION_NOT_ACTIVE"
            - "response.http_status == 409"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: shipment_period_halfopen_overlap
        grounds:
          - validations[priority=7]
          - entities.Shipment.fields.period_start
          - entities.Shipment.fields.period_end
          - errors[ERR_SHIPMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource = Subscription with HALF-OPEN [start,end) semantics: a second shipment
          period [2026-07-15,2026-08-15) overlaps the existing [2026-07-01,2026-08-01);
          adjacency (end == next.start) would be allowed.
        test_recipe:
          setup:
            - "ACTIVE subscription with one shipment [2026-07-01,2026-08-01)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "o@x.com", full_name: "O" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", tier: "BASIC", monthly_fee_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/shipments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FulfillmentOps
          trigger:
            - call: "POST /subscriptions/${sub_id}/shipments"
              payload: { period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-15T00:00:00Z" }
              as: FulfillmentOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SHIPMENT_PERIOD_OVERLAP"
            - "response.http_status == 409"

      - name: allocation_window_closed_buffer_overlap
        grounds:
          - validations[priority=7]
          - entities.AllocationWindow.fields.window_start
          - entities.AllocationWindow.fields.window_end
          - errors[ERR_ALLOCATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = Product with CLOSED [start,end] + ALLOCATION_BUFFER_HOURS(24) buffer
          semantics: a second window starting 2026-07-10T12:00 shares the closed endpoint
          and sits within 24h of the first [2026-07-01,2026-07-10] -> rejected. This
          differs geometrically from the half-open shipment rule.
        test_recipe:
          setup:
            - "Exclusive product with one window [2026-07-01,2026-07-10]."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "p@x.com", full_name: "P" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Excl2", brand: "Maison", concentration: "PARFUM", is_exclusive: true, per_customer_limit: 5 }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/allocation-windows"
              payload: { window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-10T00:00:00Z", total_allocation: 10, per_customer_cap: 5 }
              as: Merchandiser
          trigger:
            - call: "POST /products/${prod_id}/allocation-windows"
              payload: { window_start: "2026-07-10T12:00:00Z", window_end: "2026-07-20T00:00:00Z", total_allocation: 10, per_customer_cap: 5 }
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ALLOCATION_WINDOW_OVERLAP"
            - "response.http_status == 409"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_units_conserved_place_then_cancel
        grounds:
          - state_machines.Order.CART_to_PLACED
          - state_machines.Order.PLACED_to_CANCELLED
          - entities.Variant.fields.on_hand_qty
          - entities.Variant.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity = inventory units_total (on_hand_qty + reserved_qty): place
          reserves (7+3), cancel releases (10+0); units_total stays 10 across the
          forward+compensating pair.
        test_recipe:
          setup:
            - "Variant on_hand 10; order of qty 3 PLACED (on_hand 7, reserved 3)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "q@x.com", full_name: "Q" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Iris", brand: "House", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "DECANT", volume_ml: 10, unit_price_cents: 3500, on_hand_qty: 10 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Variant.${var_id}.on_hand_qty == 10"
            - "Variant.${var_id}.reserved_qty == 0"

      - name: loyalty_points_conserved_earn_then_reversal
        grounds:
          - state_machines.Order.PLACED_to_FULFILLED
          - state_machines.ReturnRequest.REQUESTED_to_APPROVED
          - entities.Customer.fields.loyalty_points_balance
          - entities.LoyaltyTransaction.fields.points_delta
        distinguishing_aspect: |
          Conserved quantity = loyalty points (distinct from inventory units): fulfill
          earns +100, return approve reverses -100; balance returns to 0 and equals the
          signed sum of LoyaltyTransaction.points_delta.
        test_recipe:
          setup:
            - "BRONZE customer; a returnable 10000 order PLACED then FULFILLED (balance 100)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "r@x.com", full_name: "R" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Rose", brand: "Maison", concentration: "EDP", hygiene_returnable: true }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 10000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentOps
            - call: "POST /returns"
              payload: { order_id: "${order_id}", line_ids: ["${line_id}"], condition: "SEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { return_id: $.data.id }
          trigger:
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: FulfillmentOps
          assert:
            - "Customer.${cust_id}.loyalty_points_balance == 0"
            - "sum(LoyaltyTransaction.points_delta where customer_id==${cust_id}) == 0"
