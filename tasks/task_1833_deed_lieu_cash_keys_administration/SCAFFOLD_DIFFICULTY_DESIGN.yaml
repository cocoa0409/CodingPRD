  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: certify_title_requires_commitment_cleared
        grounds:
          - state_machines.WorkoutCase.TITLE_REVIEW_to_TERMS_NEGOTIATION
          - state_machines.TitleCommitment
          - errors[ERR_TITLE_COMMITMENT_MISSING]
        distinguishing_aspect: |
          Entity pair WorkoutCase x TitleCommitment: the case's TITLE_REVIEW exit
          is gated on a DIFFERENT entity's state — no commitment at all
          (ERR_TITLE_COMMITMENT_MISSING), commitment present but not CLEARED
          (ERR_JUNIOR_LIENS_OUTSTANDING / ERR_TITLE_INVALID_STATE), then success
          only once the commitment reaches CLEARED.
        test_recipe:
          setup:
            - "DIL case LN-CS1 in TITLE_REVIEW; no commitment yet, then ORDERED commitment, then received with one lien"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
