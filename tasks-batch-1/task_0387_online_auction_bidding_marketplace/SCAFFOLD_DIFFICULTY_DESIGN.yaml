  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: publish_requires_seller_account_good_standing   # Listing -> Account
        grounds:
          - state_machines.Listing.DRAFT_to_ACTIVE
          - "validations[priority=10]"
          - entities.Account.fields.standing
          - "errors[ERR_SELLER_SUSPENDED]"
        distinguishing_aspect: |
          Listing's DRAFT->ACTIVE transition depends on a DIFFERENT entity's state (Account.standing): a seller
          whose Account.standing==SUSPENDED (fee_balance_cents 3630 > 3000 threshold from a prior sold 30000 item)
          cannot publish a new listing — ERR_SELLER_SUSPENDED.
        test_recipe:
          setup:
            - "Seller S sold a BUY_NOW item 30000 (unpaid order, Invoice 3630 INVOICED) so S.fee_balance_cents==3630 and S.standing==SUSPENDED; S has a second DRAFT listing ready to publish."
          setup_api_calls:
