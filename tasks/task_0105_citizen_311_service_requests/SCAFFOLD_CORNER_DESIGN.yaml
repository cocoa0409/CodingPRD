              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
            - call: "GET /work-orders"
              payload: { request_id: "${req_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.0.id, wo_v0: $.data.0.version }
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { assigned_agent_id: "${agent1}", expected_work_order_version: "${wo_v0}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/assign"
