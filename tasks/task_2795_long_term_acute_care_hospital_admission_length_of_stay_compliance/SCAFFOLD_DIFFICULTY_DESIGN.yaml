  - rule_id: transitive_cascade
    instances:
      - name: discharge_cascades_four_levels_to_an_auto_issued_documentation_query
        grounds:
          - state_machines.Stay.ADMITTED_to_DISCHARGED
          - state_machines.PaymentDetermination.initial_state_DRAFT
          - state_machines.DenialRiskReview.OPEN_to_QUERIES_ISSUED
          - state_machines.DocumentationQuery.initial_state_ISSUED
          - calculations.denial_risk_score
        distinguishing_aspect: |
          A single write walks FOUR entity levels in one request: Stay -> PaymentDetermination ->
          DenialRiskReview -> DocumentationQuery, and the fourth level only materialises because the
          THIRD level's computed score landed in the HIGH band - a data-dependent cascade depth, not a
          fixed chain. The query's due_at is stamped from the logical clock at the moment of the
          discharge, so the whole four-level chain is observable from one call.
        test_recipe:
          setup:
            - "OPEN period, ACTIVE criteria set CS-2026A, DRG 573 loaded."
            - "Patient Rita Denial qualifies on the COMPLEX_WOUND track (wound stage 3, count 2) but fails the site-neutral patient-level criteria (vent 10h, ICU 1 day), so her stay prices SITE_NEUTRAL."
            - "Admitted backdated to 2026-07-24 with the clock left at its default 2026-08-01T00:00:00Z, giving covered LOS 8 - at or below the DRG 573 short-stay threshold of 10."
            - "No interdisciplinary notes and no weaning plan are recorded, so all 4 required disciplines are missing (32) and the weaning gap applies (15); with the SSO flag (20) and the site-neutral flag (10) the as-documented score is exactly 77 - inside the HIGH band."
