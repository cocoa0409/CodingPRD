            - "An APPROVED LARVICIDE plan with three 1.00-acre routes for the same applicator on 2026-06-05: R-1 09:00Z..12:00Z (already COMMITTED), R-2 12:44Z..13:44Z and R-3 12:45Z..13:45Z (both PLANNED)."
