      - name: incident_dispatch_cascade_depth_three_to_day_plan_posture
        grounds:
          - state_machines.Patroller.AVAILABLE_to_ON_INCIDENT
          - state_machines.PatrolIncident.REPORTED_to_DISPATCHED
          - state_machines.TerrainArea.OPEN_to_PATROL_HOLD
          - state_machines.DayPlan.PUBLISHED_FULL_to_PUBLISHED_PARTIAL
          - calculations.incident_response_minutes
          - calculations.day_guest_capacity
          - entities.TerrainArea.fields.assigned_patroller_count
        distinguishing_aspect: |
          A different trigger and a different chain from the weather cascade, three hops deep: Patroller
          (AVAILABLE -> ON_INCIDENT) -> TerrainArea (assigned_patroller_count 2 -> 1, which falls below
          min_patrollers_per_open_area and forces OPEN -> PATROL_HOLD) -> DayPlan (counters recomputed and
          posture PUBLISHED_FULL -> PUBLISHED_PARTIAL), with GroomingTask -> DEFERRED branching off hop two.
          The cascade is driven by a staffing count crossing a configured floor rather than by a weather
