              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { s1: "$.data[0].id", s2: "$.data[1].id", s3: "$.data[2].id" }
            - call: "GET /v1/submittals/${s1}"
              payload: {}
              as: ProjectEngineer
              captures: { s1_v: $.data.version }
            - call: "POST /v1/submittals/${s1}/revisions"
              payload: { document_ref: "doc://s1r0", expected_submittal_version: "${s1_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev1: $.data.id }
            - call: "GET /v1/submittals/${s2}"
              payload: {}
              as: ProjectEngineer
              captures: { s2_v: $.data.version }
            - call: "POST /v1/submittals/${s2}/revisions"
              payload: { document_ref: "doc://s2r0", expected_submittal_version: "${s2_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev2: $.data.id }
            - call: "GET /v1/submittals/${s3}"
              payload: {}
              as: ProjectEngineer
              captures: { s3_v: $.data.version }
            - call: "POST /v1/submittals/${s3}/revisions"
              payload: { document_ref: "doc://s3r0", expected_submittal_version: "${s3_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev3: $.data.id }
            - call: "POST /v1/revisions/${rev1}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/revisions/${rev2}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
          trigger:
            - call: "POST /v1/revisions/${rev3}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
            - call: "POST /v1/revisions/${rev1}/return"
              payload: { action_code: "B", comments: "noted" }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "POST /v1/revisions/${rev3}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
              captures: { st3: $.data.status }
            - call: "GET /v1/reviewers/${r1_id}"
              payload: {}
              as: ProjectEngineer
              captures: { cnt: $.data.open_review_count }
          assert:
            - "err == ERR_REVIEWER_AT_CAPACITY at open_review_count 2 >= capacity 2"
            - "after rev1 return (count 1), retry route succeeds: st3 == UNDER_REVIEW"
            - "cnt == 2 (rev2 + rev3 still held)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: contingency_price_then_waive_conserves_funds
        grounds:
          - calculations.contingency_ledger_update
          - entities.Project.fields.contingency_available_cents
        distinguishing_aspect: |
          Conserved quantity is money: available + reserved + spent == initial_contingency at
          every step; price (forward) moves 117810 into reserved, and waive (compensation)
          releases it — ending ledger identical to the start (2000000/0/0), zero drift.
        test_recipe:
          setup:
            - "Project ACTIVE with initial_contingency_cents 2000000; reviewer R1; RFI answered cost est 100000 -> IA ESTIMATED"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Ledger", initial_contingency_cents: 2000000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "Cost", question_text: "?", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi_id: $.data.id }
            - call: "POST /v1/rfis/${rfi_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi_id}/answer"
              payload: { answer_text: "premium", cost_impact_flag: true, schedule_impact_flag: false, estimated_cost_cents: 100000 }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/impact-assessments"
              payload: { rfi_id: "${rfi_id}" }
              as: ProjectEngineer
              captures: { ia_id: "$.data[0].id" }
          trigger:
            - call: "POST /v1/impact-assessments/${ia_id}/price"
              payload: { sub_quote_cents: 100000 }
              as: ProjectEngineer
              as_user_id: "pe-001"
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectEngineer
              captures: { avail1: $.data.contingency_available_cents, res1: $.data.contingency_reserved_cents, spent1: $.data.contingency_spent_cents }
            - call: "POST /v1/impact-assessments/${ia_id}/waive"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectEngineer
              captures: { avail2: $.data.contingency_available_cents, res2: $.data.contingency_reserved_cents, spent2: $.data.contingency_spent_cents }
          assert:
            - "after price: avail1 == 1882190 and res1 == 117810 and spent1 == 0 (sum == 2000000)"
            - "after waive (compensation): avail2 == 2000000 and res2 == 0 and spent2 == 0"
            - "avail2 + res2 + spent2 == initial_contingency_cents (2000000) — invariant holds"

      - name: reviewer_workload_route_return_conserves_count
        grounds:
          - state_machines.SubmittalRevision.status
          - entities.Reviewer.fields.open_review_count
        distinguishing_aspect: |
          Conserved quantity is a count, not money: reviewer.open_review_count must always
          equal the number of their UNDER_REVIEW revisions; route (+1) and return (-1) are
          compensating actions — after a route/return pair the count returns to its origin.
        test_recipe:
          setup:
            - "Project ACTIVE; sub C1 responsible for section with 2 kinds -> S1, S2; reviewer R1 ARCH capacity 3; revision submitted on S1 and on S2"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Workload" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "SteelFab", trade: "structural steel" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH", review_capacity: 3 }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "051200", lead_time_days: 20, review_days: 10, default_need_date: "2026-10-30", responsible_subcontractor_id: "${c1_id}", required_submittal_kinds: ["PRODUCT_DATA", "SHOP_DRAWINGS"] }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { s1: "$.data[0].id", s2: "$.data[1].id" }
            - call: "GET /v1/submittals/${s1}"
              payload: {}
              as: ProjectEngineer
              captures: { s1_v: $.data.version }
            - call: "POST /v1/submittals/${s1}/revisions"
              payload: { document_ref: "doc://s1r0", expected_submittal_version: "${s1_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev1: $.data.id }
            - call: "GET /v1/submittals/${s2}"
              payload: {}
              as: ProjectEngineer
              captures: { s2_v: $.data.version }
            - call: "POST /v1/submittals/${s2}/revisions"
              payload: { document_ref: "doc://s2r0", expected_submittal_version: "${s2_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev2: $.data.id }
          trigger:
            - call: "POST /v1/revisions/${rev1}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/revisions/${rev2}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "GET /v1/reviewers/${r1_id}"
              payload: {}
              as: ProjectEngineer
              captures: { cnt_mid: $.data.open_review_count }
            - call: "POST /v1/revisions/${rev1}/return"
              payload: { action_code: "A" }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "POST /v1/revisions/${rev2}/return"
              payload: { action_code: "C", comments: "redo" }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/reviewers/${r1_id}"
              payload: {}
              as: ProjectEngineer
              captures: { cnt_end: $.data.open_review_count }
          assert:
            - "cnt_mid == 2 (two routes, two increments)"
            - "cnt_end == 0 (two returns compensate both increments; floor 0 respected)"
            - "open_review_count always equals count of that reviewer's UNDER_REVIEW revisions"
