              payload: { assignment_id: "${a1}" }
              as: FiscalOfficer
              captures: { pc1: "$.data[0].id", pc1_status: "$.data[0].status", pc1_prov: "$.data[0].provisional_total_cents", pc1_rs: "$.data[0].rate_schedule_id" }
            - call: "GET /courthouses/${ch_main}"
              payload: {}
              as: FiscalOfficer
              captures: { ch_enc1: "$.data.encumbered_pay_cents", ch_obl1: "$.data.obligated_pay_cents", ch_avail1: "$.data.available_pay_cents" }
            - call: "GET /interpreters/${iA}"
              payload: {}
              as: FiscalOfficer
              captures: { iA_pending1: "$.data.pending_pay_cents" }
