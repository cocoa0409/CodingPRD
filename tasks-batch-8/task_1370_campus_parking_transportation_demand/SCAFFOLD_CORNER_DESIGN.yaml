            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_w}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_w: $.data.id }
            - call: "GET /parking/allocations/${alloc_w}"
              as: ParkingAdmin
              captures: { v_w: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${occ_id}", allocation_id: "${alloc_w}", plate_number: "O111", expected_allocation_version: "${v_w}" }
              as: ParkingAdmin
              captures: { occ_permit: $.data.id }
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${w_id}", allocation_id: "${alloc_w}" }
              as: ParkingAdmin
              captures: { w_entry: $.data.id }
            - call: "POST /parking/permits/${occ_permit}/cancel"
              payload: {}
              as: ParkingAdmin
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_w}"
              as: ParkingAdmin
              captures: { v_w2: $.data.version }
          trigger:
            - call: "POST /parking/waitlist-entries/${w_entry}/claim"
              payload: { expected_allocation_version: "${v_w2}" }
              as: Commuter
              as_user_id: "${w_id}"
              captures: { claim_total: $.data.fee_total_cents, claim_status: $.data.status }
            - call: "GET /parking/waitlist-entries/${w_entry}"
              as: ParkingAdmin
              captures: { w_status: $.data.status }
          assert:
            - "captured claim_status == ACTIVE and claim_total == 84000 (valid_from defaults to 2026-08-04, 111 remaining days = 16 weeks -> 80000 + 4000)"
            - "captured w_status == CLAIMED (claim at exactly the expiry instant is allowed: expired iff now > offer_expires_at)"

  # ============================================================ validations
  - section: validations
    instances:
      - name: missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails priority 1 with 401 before any other check (the unit test drops the headers from an otherwise valid call)."
        test_recipe:
          setup: ["empty database; the trigger call is dispatched WITHOUT the X-User-Role/X-User-ID headers"]
          setup_api_calls: []
          trigger:
            - call: "GET /parking/patrons"
              as: ParkingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 401)"

      - name: commuter_cannot_create_lot_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", "roles"]
        distinguishing_aspect: "Role check (priority 2) precedes existence: a Commuter creating a lot gets ERR_FORBIDDEN_ROLE even though the payload is perfectly valid."
        test_recipe:
          setup: ["a patron exists to back the Commuter identity"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "C", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /parking/lots"
              payload: { lot_code: "HACK", name: "Nope", zone: "CORE", capacity_total: 10 }
              as: Commuter
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_FORBIDDEN_ROLE (HTTP 403)"

      - name: decide_appeal_nonexistent_citation_returns_404
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "errors[ERR_CITATION_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 4) precedes state (priority 7): deciding an appeal on a never-created citation id returns 404 ERR_CITATION_NOT_FOUND, not a state error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /parking/citations/00000000-0000-0000-0000-000000000000/decide-appeal"
              payload: { outcome: "UPHELD" }
              as: AppealsOfficer
              as_user_id: "off-9"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_CITATION_NOT_FOUND (HTTP 404)"

      - name: eligibility_role_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PATRON_INELIGIBLE]", "entities.LotAllocation.fields.eligible_roles"]
        distinguishing_aspect: "A STUDENT patron cannot buy from a FACULTY-only allocation: ERR_PATRON_INELIGIBLE fires at priority 10 after state and temporal checks pass."
        test_recipe:
          setup: ["STUDENT patron; OPEN allocation with eligible_roles [FACULTY]"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "S", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { s_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LS", name: "Lot S", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_s: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_s}", permit_code: "FAC", eligible_roles: ["FACULTY"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_s: $.data.id }
            - call: "GET /parking/allocations/${alloc_s}"
              as: ParkingAdmin
              captures: { v_s: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${s_id}", allocation_id: "${alloc_s}", plate_number: "S111", expected_allocation_version: "${v_s}" }
              as: Commuter
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_PATRON_INELIGIBLE (HTTP 403)"

      - name: residency_rule_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PATRON_INELIGIBLE]", "entities.LotAllocation.fields.residency_rule"]
        distinguishing_aspect: "An ON_CAMPUS patron is rejected by an OFF_CAMPUS_ONLY allocation — residency_rule is enforced independently of role eligibility."
        test_recipe:
          setup: ["ON_CAMPUS STAFF patron; OPEN allocation residency_rule OFF_CAMPUS_ONLY, eligible_roles include STAFF"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "R", campus_role: "STAFF", residency: "ON_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { r_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LR", name: "Lot R", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_r: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_r}", permit_code: "COMM", eligible_roles: ["STAFF"], residency_rule: "OFF_CAMPUS_ONLY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_r: $.data.id }
            - call: "GET /parking/allocations/${alloc_r}"
              as: ParkingAdmin
              captures: { v_r: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${r_id}", allocation_id: "${alloc_r}", plate_number: "R111", expected_allocation_version: "${v_r}" }
              as: Commuter
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_PATRON_INELIGIBLE (HTTP 403)"

      - name: plate_overlap_inclusive_touching_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ACTIVE_PERMIT]", "entities.Permit.fields.plate_number"]
        distinguishing_aspect: "Permit plate windows are INCLUSIVE on both ends: a second permit for the same plate whose valid_from equals the first permit's valid_to (2026-11-22) still overlaps and is rejected."
        test_recipe:
          setup: ["patron holds permit plate K111 valid [2026-08-03, 2026-11-22] on a quota-2 allocation"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "K", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { k_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LK", name: "Lot K", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_k: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_k}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 2 }
              as: ParkingAdmin
              captures: { alloc_k: $.data.id }
            - call: "GET /parking/allocations/${alloc_k}"
              as: ParkingAdmin
              captures: { v_k: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${k_id}", allocation_id: "${alloc_k}", plate_number: "K111", expected_allocation_version: "${v_k}" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_k}"
              as: ParkingAdmin
              captures: { v_k2: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${k_id}", allocation_id: "${alloc_k}", plate_number: "K111", valid_from: "2026-11-22", expected_allocation_version: "${v_k2}" }
              as: Commuter
              as_user_id: "${k_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DUPLICATE_ACTIVE_PERMIT (HTTP 409) — touching dates count as overlap under inclusive semantics"

      - name: duplicate_waitlist_join_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_ALREADY_WAITLISTED]"]
        distinguishing_aspect: "A patron with a WAITING entry on an allocation cannot join it again."
        test_recipe:
          setup: ["quota-1 WAITLISTING allocation (filled by occupier); patron D already WAITING"]
          setup_api_calls:
