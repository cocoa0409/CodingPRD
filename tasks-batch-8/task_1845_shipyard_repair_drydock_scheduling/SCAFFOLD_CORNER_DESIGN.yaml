              as_user_id: "pm_1"
              captures: { p_v2: $.data.version }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v2}", description: "Growth steel", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 2, schedule_delta_days: 0, quantity: 0.4, unit_price_cents: 500000 }
              as: ProjectManager
