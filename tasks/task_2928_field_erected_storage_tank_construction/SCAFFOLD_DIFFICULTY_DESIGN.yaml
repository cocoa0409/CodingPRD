# =============================================================================
# 1.8 SCAFFOLD DIFFICULTY DESIGN (Test Targeting Index)
#   Task 2928 - Field-Erected Storage Tank Construction
#   Nine §0.5 rule_ids, 25 instances. Every instance grounds only in elements
#   already declared in SCAFFOLD.yaml §1.1-§1.7; deleting this file leaves the
#   scaffold's declared behaviour identical.
#
#   Shared fixture vocabulary used across the chains below (all literals):
#     Tank TK-101      : diameter_ft 100, shell_height_ft 40, design_liquid_level_ft 40,
#                        product_specific_gravity 0.85, joint_efficiency 1.00,
#                        corrosion_allowance_in 0.0625, bottom 0.25 / 0.10,
#                        assumed_corrosion_rate_ipy 0.01  -> min_nominal_thickness_in 0.250
#     Course 1         : course_width_ft 8, plate_thickness_in 0.4375,
#                        Sd 23200 / St 24900 -> required_thickness_in 0.434 (DESIGN)
#     Foundation       : monitoring_point_count 8, permitted_differential_ratio 0.005,
#                        permitted_uniform_settlement_in 6.0
#                        -> point_spacing_in 471.2389, allowable_differential_in 2.356
#     Welder W-07      : SMAW, both thickness limits 0.75 in,
#                        qualification_date_utc 2026-06-01T00:00:00Z,
#                        continuity_limit_days 180 -> continuity_expires_at_utc
#                        2026-11-28T00:00:00Z
#     WaterSource      : permitted_volume_gal 2000000, max_concurrent_rate_gpm 900,
#                        water 3.33 usd/kgal, disposal 2.10 usd/kgal,
#                        permit_expiry_utc 2027-06-30T00:00:00Z
#     Logical clock    : startup default 2026-08-01T00:00:00Z; chains set it explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_method_cosine_vs_adjacent_pair_divergence
        grounds:
          - calculations.differential_settlement_evaluation
          - calculations.settlement_tolerance_envelope
          - entities.FoundationPackage.fields.settlement_evaluation_method
          - entities.SettlementSurvey.fields.governing_metric_in
          - state_machines.SettlementSurvey.NOT_APPLICABLE_to_OPEN
        distinguishing_aspect: |
          The dual variant lives in the foundation/settlement domain: byte-identical
          point_readings yield governing_metric_in 0.000 and verdict WITHIN_TOLERANCE
          under COSINE_BEST_FIT but governing_metric_in 2.828 and verdict
          OUT_OF_TOLERANCE under ADJACENT_PAIR, because a perfect cosine settlement
          pattern has zero out-of-plane deviation while its point-to-point steps are
          charged in full.
        test_recipe:
          setup:
            - "Two tanks, each with its own foundation package: package A configured COSINE_BEST_FIT, package B configured ADJACENT_PAIR, both with 8 monitoring points, permitted_differential_ratio 0.005 and permitted_uniform_settlement_in 6.0, so both carry allowable_differential_in 2.356."
            - "Each package has a baseline survey whose eight elevations are all 100.000 in."
            - "Logical clock at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", design_standard: "API_650_BASIC", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, roof_type: "CONE_SUPPORTED", bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_a_id: $.data.id }
            - call: "POST /tanks"
              payload: { tank_tag: "TK-102", design_standard: "API_650_BASIC", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, roof_type: "CONE_SUPPORTED", bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_b_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_a_id}", foundation_type: "RINGWALL_CONCRETE", ringwall_top_elevation_ft: 1.5, settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_cos_id: $.data.id, allow_cos: $.data.allowable_differential_in }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_b_id}", foundation_type: "RINGWALL_CONCRETE", ringwall_top_elevation_ft: 1.5, settlement_evaluation_method: "ADJACENT_PAIR", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_adj_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_cos_id}", fill_percent: 0, measured_at_utc: "2026-08-10T00:00:00Z", point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
              captures: { sv_cos_base_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_adj_id}", fill_percent: 0, measured_at_utc: "2026-08-10T00:00:00Z", point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
              captures: { sv_adj_base_id: $.data.id }
          trigger:
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_cos_id}", fill_percent: 50, measured_at_utc: "2026-08-20T00:00:00Z", point_readings: [ { point_index: 1, elevation_in: 91.000 }, { point_index: 2, elevation_in: 92.172 }, { point_index: 3, elevation_in: 95.000 }, { point_index: 4, elevation_in: 97.828 }, { point_index: 5, elevation_in: 99.000 }, { point_index: 6, elevation_in: 97.828 }, { point_index: 7, elevation_in: 95.000 }, { point_index: 8, elevation_in: 92.172 } ] }
              as: CivilContractor
              captures: { sv_cos_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_adj_id}", fill_percent: 50, measured_at_utc: "2026-08-20T00:00:00Z", point_readings: [ { point_index: 1, elevation_in: 91.000 }, { point_index: 2, elevation_in: 92.172 }, { point_index: 3, elevation_in: 95.000 }, { point_index: 4, elevation_in: 97.828 }, { point_index: 5, elevation_in: 99.000 }, { point_index: 6, elevation_in: 97.828 }, { point_index: 7, elevation_in: 95.000 }, { point_index: 8, elevation_in: 92.172 } ] }
              as: CivilContractor
              captures: { sv_adj_id: $.data.id }
          assert:
            - "FoundationPackage.${fp_cos_id}.point_spacing_in == 471.2389"
            - "FoundationPackage.${fp_cos_id}.allowable_differential_in == 2.356"
            - "FoundationPackage.${fp_adj_id}.allowable_differential_in == 2.356"
            - "SettlementSurvey.${sv_cos_id}.uniform_settlement_in == 5.000"
            - "SettlementSurvey.${sv_cos_id}.max_out_of_plane_in == 0.000"
            - "SettlementSurvey.${sv_cos_id}.max_adjacent_differential_in == 2.828"
            - "SettlementSurvey.${sv_cos_id}.governing_metric_in == 0.000"
            - "SettlementSurvey.${sv_cos_id}.verdict == WITHIN_TOLERANCE"
            - "SettlementSurvey.${sv_cos_id}.nonconformance_state == NOT_APPLICABLE"
            - "SettlementSurvey.${sv_adj_id}.uniform_settlement_in == 5.000"
            - "SettlementSurvey.${sv_adj_id}.max_out_of_plane_in == 0.000"
            - "SettlementSurvey.${sv_adj_id}.max_adjacent_differential_in == 2.828"
            - "SettlementSurvey.${sv_adj_id}.governing_metric_in == 2.828"
            - "SettlementSurvey.${sv_adj_id}.verdict == OUT_OF_TOLERANCE"
            - "SettlementSurvey.${sv_adj_id}.nonconformance_state == OPEN"
            - "Tank.${tank_a_id}.quality_posture == OPEN and Tank.${tank_a_id}.open_nonconformance_count == 0"
            - "Tank.${tank_b_id}.quality_posture == RESTRICTED and Tank.${tank_b_id}.open_nonconformance_count == 1"

      - name: coating_dft_spot_average_vs_individual_gauge_divergence
        grounds:
          - calculations.coating_dft_acceptance
          - entities.CoatingApplication.fields.dft_acceptance_method
          - entities.CoatingApplication.fields.dft_verdict
          - state_machines.CoatingApplication.PREP_ACCEPTED_to_DFT_RECORDED
        distinguishing_aspect: |
          The second dual variant sits in a different entity domain - coating quality on
          CoatingApplication, not settlement on SettlementSurvey - and diverges on a
          different mechanism: identical spot_readings give dft_verdict PASS under
          SPOT_AVERAGE_80_120 (every spot average inside 8.00-12.00 and overall 10.33
          at or above spec) but FAIL under INDIVIDUAL_GAUGE_MIN, because one individual
          gauge reading of 8.0 mils is below the 10.0 mil specification.
        test_recipe:
          setup:
            - "One tank with two coating applications: an INTERNAL_LINING scope evaluated by SPOT_AVERAGE_80_120 and an EXTERNAL_COATING scope evaluated by INDIVIDUAL_GAUGE_MIN, both with specified_min_dft_mils 10.0 and specified_prep_standard SSPC_SP10."
            - "Both applications are PREP_ACCEPTED with achieved_prep_standard SSPC_SP10 and dew_point_spread_f 12.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", design_standard: "API_650_BASIC", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, roof_type: "CONE_SUPPORTED", bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /coating-applications"
              payload: { tank_id: "${tank_id}", scope: "INTERNAL_LINING", surface_area_sqft: 12000, specified_prep_standard: "SSPC_SP10", specified_min_dft_mils: 10.0, dft_acceptance_method: "SPOT_AVERAGE_80_120", coating_system: "epoxy-phenolic 2 coat" }
              as: ProjectEngineer
              captures: { ca_spot_id: $.data.id }
            - call: "POST /coating-applications"
              payload: { tank_id: "${tank_id}", scope: "EXTERNAL_COATING", surface_area_sqft: 12000, specified_prep_standard: "SSPC_SP10", specified_min_dft_mils: 10.0, dft_acceptance_method: "INDIVIDUAL_GAUGE_MIN", coating_system: "epoxy-phenolic 2 coat" }
              as: ProjectEngineer
              captures: { ca_indiv_id: $.data.id }
            - call: "POST /coating-applications/${ca_spot_id}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP10", profile_mils: 3.0, dew_point_spread_f: 12.0 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_indiv_id}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP10", profile_mils: 3.0, dew_point_spread_f: 12.0 }
              as: QcInspector
          trigger:
            - call: "POST /coating-applications/${ca_spot_id}/dft-readings"
              payload: { spot_readings: [ [ 8.0, 10.0, 12.0 ], [ 10.0, 11.0, 12.0 ], [ 9.0, 10.0, 11.0 ] ] }
              as: QcInspector
            - call: "POST /coating-applications/${ca_indiv_id}/dft-readings"
              payload: { spot_readings: [ [ 8.0, 10.0, 12.0 ], [ 10.0, 11.0, 12.0 ], [ 9.0, 10.0, 11.0 ] ] }
              as: QcInspector
          assert:
            - "CoatingApplication.${ca_spot_id}.spot_count == 3"
            - "CoatingApplication.${ca_spot_id}.computed_spot_average_min_mils == 10.00"
            - "CoatingApplication.${ca_spot_id}.computed_spot_average_max_mils == 11.00"
            - "CoatingApplication.${ca_spot_id}.computed_overall_average_mils == 10.33"
            - "CoatingApplication.${ca_spot_id}.computed_min_gauge_reading_mils == 8.00"
            - "CoatingApplication.${ca_spot_id}.dft_verdict == PASS"
            - "CoatingApplication.${ca_spot_id}.status == DFT_RECORDED"
            - "CoatingApplication.${ca_indiv_id}.computed_spot_average_min_mils == 10.00"
            - "CoatingApplication.${ca_indiv_id}.computed_overall_average_mils == 10.33"
            - "CoatingApplication.${ca_indiv_id}.computed_min_gauge_reading_mils == 8.00"
            - "CoatingApplication.${ca_indiv_id}.dft_verdict == FAIL"
            - "CoatingApplication.${ca_indiv_id}.status == DFT_RECORDED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: shell_thickness_three_way_max_with_diameter_tier
        grounds:
          - calculations.shell_course_required_thickness
          - entities.ShellCourse.fields.governing_case
          - entities.Tank.fields.min_nominal_thickness_in
          - validations.priority_54
        distinguishing_aspect: |
          Mode (a) - a nested MAX over three independently computed candidates where the
          third candidate is itself a table lookup on the parent Tank's diameter. Each of
          the three branches must win in some configuration, and the branch that wins
          decides both governing_case and thickness_verdict. This is a pure geometry
          formula and shares no operand with the currency modes below.
        test_recipe:
          setup:
            - "Three tanks that steer the MAX to a different branch: TK-101 (G 0.85, CA 0.0625) where the design case wins, TK-102 (G 0.70, CA 0.0) where the hydrostatic-test case wins, and TK-103 (diameter 30 ft, liquid level 12 ft) where the diameter-tier floor of 0.188 in wins."
            - "All courses use Sd 23200 psi, St 24900 psi and E 1.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_design_id: $.data.id, mn_100: $.data.min_nominal_thickness_in }
            - call: "POST /tanks"
              payload: { tank_tag: "TK-102", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.70, joint_efficiency: 1.00, corrosion_allowance_in: 0.0, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_test_id: $.data.id }
            - call: "POST /tanks"
              payload: { tank_tag: "TK-103", diameter_ft: 30, shell_height_ft: 12, design_liquid_level_ft: 12, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_small_id: $.data.id, mn_30: $.data.min_nominal_thickness_in }
          trigger:
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_design_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c_design_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_design_id}", course_number: 2, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c_upper_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_test_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c_test_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_small_id}", course_number: 1, course_width_ft: 6, plate_thickness_in: 0.250, material_spec: "A36", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c_small_id: $.data.id }
          assert:
            - "Tank.${tank_design_id}.min_nominal_thickness_in == 0.250"
            - "Tank.${tank_small_id}.min_nominal_thickness_in == 0.188"
            - "ShellCourse.${c_design_id}.course_bottom_elevation_ft == 0.0 and design_liquid_height_ft == 40.0"
            - "ShellCourse.${c_design_id}.required_thickness_design_in == 0.434"
            - "ShellCourse.${c_design_id}.required_thickness_test_in == 0.407"
            - "ShellCourse.${c_design_id}.required_thickness_in == 0.434 and governing_case == DESIGN"
            - "ShellCourse.${c_design_id}.thickness_verdict == ADEQUATE"
            - "ShellCourse.${c_upper_id}.course_bottom_elevation_ft == 8.0 and design_liquid_height_ft == 32.0"
            - "ShellCourse.${c_upper_id}.required_thickness_design_in == 0.358 and required_thickness_test_in == 0.324"
            - "ShellCourse.${c_upper_id}.required_thickness_in == 0.358 and governing_case == DESIGN"
            - "ShellCourse.${c_test_id}.required_thickness_design_in == 0.306"
            - "ShellCourse.${c_test_id}.required_thickness_test_in == 0.407"
            - "ShellCourse.${c_test_id}.required_thickness_in == 0.407 and governing_case == TEST"
            - "ShellCourse.${c_small_id}.required_thickness_design_in == 0.094 and required_thickness_test_in == 0.034"
            - "ShellCourse.${c_small_id}.required_thickness_in == 0.188 and governing_case == MIN_NOMINAL"
            - "ShellCourse.${c_small_id}.thickness_verdict == ADEQUATE"

      - name: water_cost_round_per_withdrawal_then_sum
        grounds:
          - calculations.hydrotest_water_and_disposal_cost
          - entities.WaterWithdrawal.fields.withdrawal_cost_usd
          - entities.HydrotestPlan.fields.water_cost_usd
          - entities.HydrotestPlan.fields.disposal_cost_usd
        distinguishing_aspect: |
          Mode (b) - the operand order inside one money formula: each withdrawal is
          rounded to cents FIRST and the rounded amounts are summed, while the disposal
          leg is priced once on the un-split aggregate volume with a tier multiplier.
          Three withdrawals of 125555 gal give water_cost_usd 1254.30, whereas rounding
          the summed 376.665 kgal would give 1254.29 - a one-cent discriminator that no
          amount of tier juggling can produce.
        test_recipe:
          setup:
            - "A tank, a water source priced at 3.33 usd/kgal supply and 2.10 usd/kgal disposal with 2000000 gal permitted and 900 gpm concurrent limit, and a DRAFT hydrotest plan against both."
            - "The water source version is re-read before every withdrawal because each reservation increments it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /water-sources"
              payload: { source_name: "Riverside Intake", source_type: "RIVER", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 376665, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T06:00:00Z", rate_gpm: 300, reserved_volume_gal: 125555, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { wd1_id: $.data.id, wd1_cost: $.data.withdrawal_cost_usd }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v2: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T06:00:00Z", window_end_utc: "2026-08-11T12:00:00Z", rate_gpm: 300, reserved_volume_gal: 125555, expected_water_source_version: "${ws_v2}" }
              as: ErectionSuperintendent
              captures: { wd2_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v3: $.data.version }
          trigger:
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T12:00:00Z", window_end_utc: "2026-08-11T18:00:00Z", rate_gpm: 300, reserved_volume_gal: 125555, expected_water_source_version: "${ws_v3}" }
              as: ErectionSuperintendent
              captures: { wd3_id: $.data.id }
          assert:
            - "WaterWithdrawal.${wd1_id}.withdrawal_cost_usd == 418.10"
            - "WaterWithdrawal.${wd3_id}.withdrawal_cost_usd == 418.10"
            - "HydrotestPlan.${plan_id}.water_cost_usd == 1254.30"
            - "HydrotestPlan.${plan_id}.water_cost_usd != 1254.29 (the value that rounding the summed 376.665 kgal would produce)"
            - "HydrotestPlan.${plan_id}.disposal_cost_usd == 791.00"
            - "HydrotestPlan.${plan_id}.subtotal_usd == 2045.30"
            - "WaterSource.${ws_id}.reserved_volume_gal == 376665.00"
            - "WaterSource.${ws_id}.available_volume_gal == 1623335.00"

      - name: permit_surcharge_tier_keyed_on_subtotal_not_total
        grounds:
          - calculations.hydrotest_permit_surcharge
          - entities.HydrotestPlan.fields.permit_surcharge_pct
          - entities.HydrotestPlan.fields.total_cost_usd
        distinguishing_aspect: |
          Mode (c) - which intermediate the tier selector reads. A single 360000 gal
          withdrawal produces subtotal_usd 1954.80, so permit_surcharge_pct is the
          1000-2000 band value 0.03 and total_cost_usd lands at 2013.44. The total is
          above the 2000.00 boundary, so an implementation that keyed the tier on
          total_cost_usd would charge 0.05 and report 2052.54. Same formula family as
          mode (b) but a different question: the selector operand, not the rounding order.
        test_recipe:
          setup:
            - "A tank, the same 3.33 / 2.10 usd/kgal water source, and a DRAFT hydrotest plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /water-sources"
              payload: { source_name: "Riverside Intake", source_type: "RIVER", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 360000, disposal_method: "HAUL_OFFSITE", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
          trigger:
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T20:00:00Z", rate_gpm: 300, reserved_volume_gal: 360000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { wd_id: $.data.id }
          assert:
            - "WaterWithdrawal.${wd_id}.withdrawal_cost_usd == 1198.80"
            - "HydrotestPlan.${plan_id}.water_cost_usd == 1198.80"
            - "HydrotestPlan.${plan_id}.disposal_cost_usd == 756.00"
            - "HydrotestPlan.${plan_id}.subtotal_usd == 1954.80"
            - "HydrotestPlan.${plan_id}.permit_surcharge_pct == 0.03"
            - "HydrotestPlan.${plan_id}.surcharge_usd == 58.64"
            - "HydrotestPlan.${plan_id}.total_cost_usd == 2013.44"
            - "HydrotestPlan.${plan_id}.total_cost_usd != 2052.54 (the value a tier keyed on total_cost_usd would produce)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: weld_seam_repair_cycle_terminates_at_cap
        grounds:
          - state_machines.WeldSeam
          - entities.WeldSeam.fields.repair_cycle_count
          - validations.priority_45
          - validations.priority_15
        distinguishing_aspect: |
          WeldSeam is the cyclic machine: FIT_READY -> WELDED -> EXAM_SCHEDULED ->
          RT_REJECTED -> REPAIR_IN_PROGRESS -> WELDED is a genuine loop whose exit is a
          counter, and the same trigger (weld-log) produces a different target state on
          each pass. The loop terminates in REPLACEMENT_REQUIRED once repair_cycle_count
          has reached 2, after which both loop entry points are refused.
        test_recipe:
          setup:
            - "A tank with an ACCEPTED foundation package (8-point baseline all at 100.000 in), one ADEQUATE course (plate 0.4375 in) fitted up, a QUALIFIED welder W-07 created by AuthorizedInspector user ai-1, and one vertical seam V1 welded by that welder."
            - "Every RT window is on its own calendar day so the 60-minute exclusion buffer never collides."
            - "Each rejection is closed by a later ACCEPT so the tank posture never reaches FROZEN and the repair-cap error is the one that surfaces."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
              captures: { base_sv_id: $.data.id }
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G", "4G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z", continuity_limit_days: 180 }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { seam_id: $.data.id }
            - call: "POST /weld-seams/${seam_id}/weld-log"
              payload: { welder_id: "${w1_id}", filler_lot: "E7018-A" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${seam_id}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r1_id: $.data.id }
            - call: "POST /nde-reports/${r1_id}/result"
              payload: { decision: "REJECT", indication_count: 2, film_count: 4, defect_type: "SLAG_INCLUSION" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /weld-seams/${seam_id}/repair-start"
              payload: { defect_disposition: "EXCAVATE_AND_REWELD" }
              as: ErectionSuperintendent
            - call: "POST /weld-seams/${seam_id}/weld-log"
              payload: { welder_id: "${w1_id}", filler_lot: "E7018-B" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${seam_id}", method: "RT", window_start_utc: "2026-08-12T10:00:00Z", window_end_utc: "2026-08-12T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r2_id: $.data.id }
            - call: "POST /nde-reports/${r2_id}/result"
              payload: { decision: "ACCEPT", indication_count: 0, film_count: 4 }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${seam_id}", method: "RT", window_start_utc: "2026-08-13T10:00:00Z", window_end_utc: "2026-08-13T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r3_id: $.data.id }
            - call: "POST /nde-reports/${r3_id}/result"
              payload: { decision: "REJECT", indication_count: 1, film_count: 4, defect_type: "POROSITY" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /weld-seams/${seam_id}/repair-start"
              payload: { defect_disposition: "EXCAVATE_AND_REWELD" }
              as: ErectionSuperintendent
            - call: "POST /weld-seams/${seam_id}/weld-log"
              payload: { welder_id: "${w1_id}", filler_lot: "E7018-C" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${seam_id}", method: "RT", window_start_utc: "2026-08-14T10:00:00Z", window_end_utc: "2026-08-14T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r4_id: $.data.id }
            - call: "POST /nde-reports/${r4_id}/result"
              payload: { decision: "ACCEPT", indication_count: 0, film_count: 4 }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${seam_id}", method: "RT", window_start_utc: "2026-08-15T10:00:00Z", window_end_utc: "2026-08-15T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r5_id: $.data.id }
          trigger:
            - call: "POST /nde-reports/${r5_id}/result"
              payload: { decision: "REJECT", indication_count: 3, film_count: 4, defect_type: "CRACK" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /weld-seams/${seam_id}/weld-log"
              payload: { welder_id: "${w1_id}", filler_lot: "E7018-D" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /weld-seams/${seam_id}/repair-start"
              payload: { defect_disposition: "CUT_OUT_AND_REPLACE" }
              as: ErectionSuperintendent
          assert:
            - "after the first REJECT (r1) WeldSeam.${seam_id}.status == RT_REJECTED and repair_cycle_count == 0"
            - "after the first repair weld WeldSeam.${seam_id}.status == WELDED and repair_cycle_count == 1"
            - "after the second REJECT (r3) WeldSeam.${seam_id}.status == RT_REJECTED and repair_cycle_count == 1"
            - "after the second repair weld WeldSeam.${seam_id}.status == WELDED and repair_cycle_count == 2"
            - "the r5 REJECT returns 201 and WeldSeam.${seam_id}.status == REPLACEMENT_REQUIRED with repair_cycle_count == 2 (the cap is not incremented past 2)"
            - "ShellCourse.${course_id}.status == FITTED"
            - "Tank.${tank_id}.weld_reject_rate == 0.6000 and Tank.${tank_id}.required_examination_pct == 100.0"
            - "Tank.${tank_id}.open_nonconformance_count == 1 and Tank.${tank_id}.quality_posture == RESTRICTED"
            - "the follow-up weld-log returns 409 ERR_REPAIR_LIMIT_EXCEEDED"
            - "the follow-up repair-start returns 409 ERR_REPAIR_LIMIT_EXCEEDED"
            - "WeldSeam.${seam_id}.status is still REPLACEMENT_REQUIRED after both refused calls"

      - name: tank_phase_and_posture_move_independently
        grounds:
          - state_machines.Tank.construction_phase
          - state_machines.Tank.quality_posture
          - calculations.tank_quality_posture
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          A different entity and a different non-linearity: Tank carries two orthogonal
          state fields, so this instance is about a machine with no single current state.
          quality_posture walks OPEN -> RESTRICTED -> FROZEN -> RESTRICTED while
          construction_phase stays pinned at ERECTION_IN_PROGRESS, and the phase moves
          only when an operator asks for it. No loop and no counter is involved - the
          non-linearity is dimensional, not cyclic.
