        distinguishing_aspect: "Two structurally identical leases at the same rent in the same building diverge on one tenant flag: the physician-owned tenant's submit-fmv-review is refused with ERR_NO_QUALIFYING_APPRAISAL while the non-physician-owned tenant's succeeds, and the physician lease only opens once an appraisal survives the independence check (a non-independent appraisal is refused at QUALIFY with ERR_APPRAISAL_INDEPENDENCE_MISSING)."
