      - name: pipe_chain_rounds_every_segment_to_two_places_before_accumulating
        claim_type: precision
        grounds:
          - calculations.pipe_sizing_chain
          - entities.PipeSizingIteration.fields.friction_loss_psi
          - entities.PipeSizingIteration.fields.cumulative_psi_after
          - entities.HydraulicCalculation.fields.required_psi_at_base_of_riser
        distinguishing_aspect: |
          The pinned rounding order is observable in the last cent: rounding each of the eight terms to
          two places and re-rounding the running total after every segment yields
          19.05 -> 40.34 -> 45.28 -> 50.54, whereas summing the raw Hazen-Williams losses and rounding
          once at the end yields 50.5569... -> 50.56. The 0.02 psi gap propagates into
          required_psi_at_demand (55.54 against 55.56) and is therefore not cosmetic.
        test_recipe:
          setup:
            - "Project FP-2601 (lead-in loss 5.0 psi), rack area Rack Storage Bay A, calculation HC-1 AREA_DENSITY k_factor 25.2, design_flow_gpm 880.0"
            - "Two iterations already in the chain: index 1 (2 in, 150 + 40 ft, 110 gpm) and index 2 (4 in, 90 + 5 ft, 420 gpm)"
            - "Flow test H-14 and a preliminary RAW_TEST evaluation exist so the supply iteration has something to close against"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
