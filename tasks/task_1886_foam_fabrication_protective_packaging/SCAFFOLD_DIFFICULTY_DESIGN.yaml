# =============================================================================
# Task 1886 — Foam Fabrication & Protective Packaging
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: production_order_provisional_vs_final_pricing
        grounds:
          - calculations.quote_pricing_calc
          - calculations.order_total_rounding
          - entities.ProductionOrder.fields.provisional_unit_price_cents
          - entities.ProductionOrder.fields.final_unit_price_cents
        distinguishing_aspect: |
          Entity domain = ProductionOrder pricing. Same qty/material/method priced
          twice: provisional variant (assumed yield floor(52*0.70)=36 parts/sheet)
          yields unit 896 / total 453000; final variant (locked program's actual
          52 parts/sheet) yields unit 730 / total 370000. Same inputs, two valid
          algorithms, different money.
        test_recipe:
          setup:
            - "Customer C1 (STANDARD), Material M1 (PE, ild 130, sheet 108x48x2, cost 250 cents/bf, recyclable, scrap 12)"
            - "Spec S1 (part 10x8, weight 5 lb, drop 30 in -> required_ild_lb 50, max_g 60) APPROVED"
            - "CutProgram P1 DIE_CUT NESTED with parts_per_sheet 52, tooling T1 (die 250000 cents, amort 1000) IN_SERVICE, P1 LOCKED"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
          trigger:
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 500 }, as: SalesEngineer, captures: { ord_id: $.data.id, prov_unit: $.data.provisional_unit_price_cents, prov_total: $.data.provisional_total_cents } }
            - { call: "POST /api/production-orders/${ord_id}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer, captures: { final_unit: $.data.final_unit_price_cents, final_total: $.data.final_total_cents, amort: $.data.tooling_amort_cents } }
          assert:
            - "ProductionOrder.${ord_id}.provisional_unit_price_cents == 896"
            - "ProductionOrder.${ord_id}.provisional_total_cents == 453000"
            - "ProductionOrder.${ord_id}.final_unit_price_cents == 730"
            - "ProductionOrder.${ord_id}.final_total_cents == 370000"
            - "ProductionOrder.${ord_id}.tooling_amort_cents == 125000"
            - "provisional_unit (896) != final_unit (730) for identical qty/material/method"

      - name: release_order_locked_vs_current_pricing
        grounds:
          - calculations.release_pricing_calc
          - entities.InventoryProgram.fields.locked_material_cost_bf_cents
          - entities.InventoryProgram.fields.pricing_mode
        distinguishing_aspect: |
          Entity domain = InventoryProgram/ReleaseOrder pricing (distinct from
          ProductionOrder quote pricing). Identical release (qty 100, same spec,
          same program geometry) priced under LOCKED variant (material cost pinned
          at activation: 250 cents/bf) yields unit 443; under CURRENT variant
          (material repriced to 300 cents/bf before allocate) yields unit 526.
        test_recipe:
          setup:
            - "Approved spec S1 with LOCKED DIE cut program (as in production_order_provisional_vs_final_pricing)"
            - "Program PA (pricing_mode LOCKED, max 1000, reorder 200, min 50) ACTIVE while material cost is 250 -> locked_material_cost_bf_cents 250"
            - "Program PB (pricing_mode CURRENT, same params) ACTIVE"
            - "Both programs stocked to on_hand 1000 via completed replenishment orders"
            - "Material cost then raised 250 -> 300"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "CONTRACT" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", package_spec_id: "${spec_id}", pricing_mode: "LOCKED", max_stock_qty: 1000, reorder_point_qty: 200, min_release_qty: 50 }, as: SalesEngineer, captures: { prog_a: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_a}/activate", payload: {}, as: SalesEngineer }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", package_spec_id: "${spec_id}", pricing_mode: "CURRENT", max_stock_qty: 1000, reorder_point_qty: 200, min_release_qty: 50 }, as: SalesEngineer, captures: { prog_b: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_b}/activate", payload: {}, as: SalesEngineer }
            - { call: "POST /api/inventory-programs/${prog_a}/replenish", payload: { qty: 1000 }, as: PlantManager, captures: { rpo_a: $.data.id } }
            - { call: "POST /api/production-orders/${rpo_a}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T09:00:00Z" }, as: SalesEngineer }
            - { call: "POST /api/production-orders/${rpo_a}/start", payload: {}, as: PlantManager }
            - { call: "POST /api/production-orders/${rpo_a}/complete", payload: {}, as: PlantManager }
            - { call: "POST /api/inventory-programs/${prog_b}/replenish", payload: { qty: 1000 }, as: PlantManager, captures: { rpo_b: $.data.id } }
            - { call: "POST /api/production-orders/${rpo_b}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-04T09:00:00Z", window_end: "2026-08-04T10:00:00Z" }, as: SalesEngineer }
            - { call: "POST /api/production-orders/${rpo_b}/start", payload: {}, as: PlantManager }
            - { call: "POST /api/production-orders/${rpo_b}/complete", payload: {}, as: PlantManager }
            - { call: "PATCH /api/materials/${mat_id}", payload: { cost_per_board_ft_cents: 300 }, as: PlantManager }
          trigger:
            - { call: "POST /api/release-orders", payload: { inventory_program_id: "${prog_a}", qty: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_a: $.data.id } }
            - { call: "POST /api/release-orders/${rel_a}/allocate", payload: {}, as: PlantManager, captures: { unit_a: $.data.unit_price_cents, total_a: $.data.total_price_cents } }
            - { call: "POST /api/release-orders", payload: { inventory_program_id: "${prog_b}", qty: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_b: $.data.id } }
            - { call: "POST /api/release-orders/${rel_b}/allocate", payload: {}, as: PlantManager, captures: { unit_b: $.data.unit_price_cents, total_b: $.data.total_price_cents } }
          assert:
            - "ReleaseOrder.${rel_a}.unit_price_cents == 443 (LOCKED: material pinned at 250)"
            - "ReleaseOrder.${rel_a}.total_price_cents == 44300"
            - "ReleaseOrder.${rel_b}.unit_price_cents == 526 (CURRENT: material repriced at 300)"
            - "ReleaseOrder.${rel_b}.total_price_cents == 52600"
            - "InventoryProgram.${prog_a}.locked_material_cost_bf_cents == 250 (unchanged by the PATCH)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) then (b))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quote_pricing_tiered_amortization_interaction
        grounds:
          - calculations.quote_pricing_calc
          - entities.Tooling.fields.amortized_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — qty tier selection,
          method branch (DIE vs CNC cutting cost), and tooling amortization keyed
          on remaining_unamortized_cents at pricing time. Three qty-500 DIE orders
          on one die price at 730, 587, then 515 cents/unit purely because the
          amortization component depletes (250 -> 125 -> 63 cents/part).
        test_recipe:
          setup:
            - "Approved spec + LOCKED DIE program with tooling (die 250000 cents, amort qty 1000), per the standard chain"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
          trigger:
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 500 }, as: SalesEngineer, captures: { o1: $.data.id } }
            - { call: "POST /api/production-orders/${o1}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer, captures: { o1_unit: $.data.final_unit_price_cents, o1_amort: $.data.tooling_amort_cents } }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 500 }, as: SalesEngineer, captures: { o2: $.data.id } }
            - { call: "POST /api/production-orders/${o2}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z" }, as: SalesEngineer, captures: { o2_unit: $.data.final_unit_price_cents, o2_amort: $.data.tooling_amort_cents } }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 500 }, as: SalesEngineer, captures: { o3: $.data.id } }
            - { call: "POST /api/production-orders/${o3}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: SalesEngineer, captures: { o3_unit: $.data.final_unit_price_cents, o3_amort: $.data.tooling_amort_cents } }
            - { call: "GET /api/toolings/${tool_id}", as: DesignEngineer, captures: { tool_amortized: $.data.amortized_cents } }
          assert:
            - "Order ${o1}.final_unit_price_cents == 730 (amort component 250/part)"
            - "Order ${o1}.tooling_amort_cents == 125000"
            - "Order ${o2}.final_unit_price_cents == 587 (amort component ceil(125000/1000)=125/part on remaining 125000)"
            - "Order ${o2}.tooling_amort_cents == 62500 (125 * min(500,1000), capped at remaining 125000)"
            - "Order ${o3}.final_unit_price_cents == 515 (amort component ceil(62500/1000)=63/part; base (360+25+63)*1.15=515.2)"
            - "Order ${o3}.tooling_amort_cents == 31500 (63 * 500, capped at remaining 62500)"
            - "Tooling.${tool_id}.amortized_cents == 219000 (125000 + 62500 + 31500; never exceeds die_cost_cents 250000)"

      - name: order_total_unit_rounding_then_multiply
        grounds:
          - calculations.order_total_rounding
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned. Final unit_raw for qty 500 DIE is
          730.25 cents. Pinned order (round unit to integer cents FIRST, then
          multiply, then add setup fee) yields 730*500+5000 = 370000. The rejected
          alternative (multiply raw, then round) yields 730.25*500+5000 = 370125.
          Different cents; scaffold pins the first.
        test_recipe:
          setup:
            - "Approved spec + LOCKED DIE program with tooling, per the standard chain"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
          trigger:
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 500 }, as: SalesEngineer, captures: { ord_id: $.data.id } }
            - { call: "POST /api/production-orders/${ord_id}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer, captures: { f_unit: $.data.final_unit_price_cents, f_total: $.data.final_total_cents } }
          assert:
            - "ProductionOrder.${ord_id}.final_unit_price_cents == 730 (round_half_up(730.25))"
            - "ProductionOrder.${ord_id}.final_total_cents == 370000 (pinned order: 730*500 + 5000)"
            - "final_total_cents != 370125 (the sum-then-round alternative is rejected)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: package_spec_revision_loop
        grounds:
          - state_machines.PackageSpec.IN_VALIDATION_to_DRAFT
          - state_machines.PackageSpec.VALIDATED_to_APPROVED
          - entities.PackageSpec.fields.revision_no
        distinguishing_aspect: |
          Entity = PackageSpec; shape = cyclic revision loop. IN_VALIDATION returns
          to DRAFT (revision_no 1 -> 2), then loops forward again through SUBMITTED
          and IN_VALIDATION to APPROVED — a non-linear cycle, not a pipeline.
        test_recipe:
          setup:
            - "Customer + material; spec submitted and in validation; first drop test recorded FAIL (75 > limit 60)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt1: $.data.id } }
            - { call: "POST /api/drop-tests/${dt1}/record", payload: { measured_peak_g: 75 }, as: QualityEngineer, captures: { dt1_result: $.data.result } }
          trigger:
            - { call: "POST /api/package-specs/${spec_id}/return-for-revision", payload: {}, as: QualityEngineer, captures: { rev_after: $.data.revision_no, status_after: $.data.status } }
            - { call: "PATCH /api/package-specs/${spec_id}", payload: { product_weight_lb: 4 }, as: SalesEngineer, captures: { ild_after: $.data.required_ild_lb } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T10:30:00Z", scheduled_end: "2026-08-02T11:30:00Z", drop_height_in: 30, orientation: "EDGE" }, as: QualityEngineer, captures: { dt2: $.data.id } }
