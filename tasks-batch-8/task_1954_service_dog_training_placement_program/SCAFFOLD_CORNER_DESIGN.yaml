        grounds: ["validations[priority=9]", "errors[ERR_INVALID_STATE]", state_machines.Dog.CLEARED_to_RAISER_PLACED]
        distinguishing_aspect: "A dog already RAISER_PLACED rejects a second placement with ERR_INVALID_STATE (placement creation is guarded to CLEARED|RECALLED), regardless of spare raiser capacity."
        test_recipe:
          setup: ["dog RAISER_PLACED with raiser R1; raiser R2 APPROVED with spare capacity"]
          setup_api_calls:
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser D1", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r1_id: $.data.id } }
