            - call: "POST /placement-appeals/${app}/decide"
              payload: { decision: "GRANT", decision_note: "Attempted by a non-reviewer on an endorsed appeal." }
              as: Registrar
              as_user_id: "registrar-2"
              captures: { err_binding_alone: $.data.error_id }
            - call: "GET /placement-appeals/${app}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { app_state4: $.data.state }
