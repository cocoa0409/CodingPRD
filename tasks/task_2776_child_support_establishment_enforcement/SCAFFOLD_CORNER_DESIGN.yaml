          Two second-family cases pin down step ordering and rounding mode
          independently. Case G is chosen so the reserve ceiling 38133 sits one cent
          above the after-credit figure 38132 and 4237 below the raw share 42369:
          crediting then flooring gives 38132, flooring then crediting gives 33896,
          so the two orderings cannot both pass. Case H is chosen so the credit is
          exactly 5000.5 cents: round_half_up yields 5001 and an order of 45004,
          while bankers rounding yields 5000 and 45005.
