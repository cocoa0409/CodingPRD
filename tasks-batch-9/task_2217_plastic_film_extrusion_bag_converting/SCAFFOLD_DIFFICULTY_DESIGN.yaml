            - { call: "POST /print-jobs/${pj1}/start-print", payload: {}, as: PrintOperator }
          assert:
            - "after the registration check: PrintJob.${pj1}.registration_state == REG_PASS, color_state == COLOR_PENDING, status == SETUP, setup_attempt_count == 1"
            - "the first POST /print-jobs/${pj1}/start-print -> 409 ERR_PRINT_JOB_STATE_INVALID"
            - "PrintJob.${pj1}.status == SETUP after the refused start-print"
            - "after the failing colour proof: PrintJob.${pj1}.color_state == COLOR_FAIL, registration_state still REG_PASS, delta_e_measured == 3.0, setup_attempt_count == 2"
            - "after the passing colour proof: PrintJob.${pj1}.color_state == COLOR_PASS, delta_e_measured == 1.2, setup_attempt_count == 3, status still SETUP"
            - "the second POST /print-jobs/${pj1}/start-print -> 200 and PrintJob.${pj1}.status == PRINTING"
            - "PrintJob.${pj1}.registration_drift_micron == 40.0 and cylinders_required == 4"
      - name: bag_lot_three_way_fork_conditional_branch_tightens_release_gate
        grounds:
          - state_machines.BagLot.TESTING_to_CONDITIONAL
          - state_machines.BagLot.CONDITIONAL_to_PACKED
          - calculations.seal_strength_qualification
          - entities.BagLot.fields.seal_final_verdict
        distinguishing_aspect: |
          A single finalize-tests call is a three-way fork whose branch is chosen by the final
          verdict: the panel 22.0 / 22.0 / 19.0 lands in the middle band (min 19.00 clears the
          0.80 x spec floor of 17.60 but misses the 0.90 x floor of 19.80, while the mean 21.00
          clears the 0.95 x spec of 20.90) and yields CONDITIONAL -- a state that, unlike QUALIFIED,
