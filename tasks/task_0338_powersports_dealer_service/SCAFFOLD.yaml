  # ---------------- FloorPlanLoan ----------------
  - method: POST
    path: "/floor-plan-loans"
    description: "Open a floor-plan loan for a NEW_FLOORED unit"
    roles: [DealerPrincipal]
    code: 201
    input: [unit_id, opened_on, apr_bps]
    output: FloorPlanLoan
    side_effects:
      - "original_advance_cents := Unit.dealer_cost_cents; principal_outstanding_cents := original_advance_cents; status=OPEN"
      - "Unit.floor_plan_loan_id := this loan id"

  - method: GET
    path: "/floor-plan-loans"
    description: "List floor-plan loans (filterable by unit_id, status)"
    roles: [DealerPrincipal, FinanceManager, SalesManager]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "FloorPlanLoan[]"
    side_effects: []

  - method: GET
    path: "/floor-plan-loans/{id}"
    description: "Get a floor-plan loan; ?interest_basis=SIMPLE|DECLINING selects the accrual variant"
    roles: [DealerPrincipal, FinanceManager, SalesManager]
    code: 200
    input: ["interest_basis?"]
    output: FloorPlanLoan
    side_effects: ["accrued_interest_cents computed per interest_basis (default SIMPLE)"]

  - method: POST
    path: "/floor-plan-loans/{id}/run-aging"
    description: "Run aging; if >= 90 days since opened_on, OPEN -> CURTAILMENT_DUE"
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: FloorPlanLoan
    side_effects: ["status -> CURTAILMENT_DUE when due-day threshold met"]

  # ---------------- Curtailment ----------------
  - method: POST
