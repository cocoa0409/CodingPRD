# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe over §1.1–§1.7)
# Section/claim_type values follow references/claim-extraction-guide.md.
# Corners already covered by a §1.8 difficulty instance are emitted as
# excluded_because stubs (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_service_order_returns_201_with_default_axes
        claim_type: creation
        grounds:
          - entities.ServiceOrder.fields.broadcast_status
          - entities.ServiceOrder.fields.settlement_status
          - entities.ServiceOrder.fields.stream_status
        distinguishing_aspect: "A fresh ServiceOrder starts broadcast_status=DRAFT, settlement_status=UNBILLED, stream_status=PENDING, memorial_status=DRAFT, recording_status=NONE, version=1."
        test_recipe:
          setup:
            - "A FuneralHome and Venue."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Ac Home", contact_email: "ac@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Ac Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "A Cee", scheduled_start: "2026-06-20T10:00:00Z", scheduled_end: "2026-06-20T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
          assert:
            - "ServiceOrder.${order_id}.broadcast_status == DRAFT"
            - "ServiceOrder.${order_id}.settlement_status == UNBILLED"
            - "ServiceOrder.${order_id}.stream_status == PENDING"
            - "ServiceOrder.${order_id}.memorial_status == DRAFT"
            - "ServiceOrder.${order_id}.version == 1"

      - name: get_service_order_not_found_returns_404
        claim_type: not_found
        grounds: [entities.ServiceOrder]
        distinguishing_aspect: "GET /service-orders/{unknown uuid} returns ERR_SERVICE_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /service-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SERVICE_ORDER_NOT_FOUND"

      - name: create_order_missing_decedent_name_returns_422
        claim_type: required_fields
        grounds: [entities.ServiceOrder.fields.decedent_name]
        distinguishing_aspect: "Omitting the required decedent_name field on POST /service-orders returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A FuneralHome and Venue."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rq Home", contact_email: "rq@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Rq Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", scheduled_start: "2026-06-20T10:00:00Z", scheduled_end: "2026-06-20T11:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_order_with_unknown_venue_returns_not_found
        claim_type: foreign_key_integrity
        grounds: [entities.ServiceOrder.fields.venue_id]
        distinguishing_aspect: "A ServiceOrder referencing a non-existent venue_id is rejected with ERR_VENUE_NOT_FOUND (404)."
        test_recipe:
          setup: ["A FuneralHome only."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Fk Home", contact_email: "fk@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "00000000-0000-4000-8000-000000000001", decedent_name: "F Kay", scheduled_start: "2026-06-20T10:00:00Z", scheduled_end: "2026-06-20T11:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VENUE_NOT_FOUND"

      - name: create_order_invalid_camera_count_returns_422
        claim_type: type_constraints
        grounds: [entities.ServiceOrder.fields.camera_count, "validations[priority=5]"]
        distinguishing_aspect: "camera_count=5 (outside 1..4) is rejected with ERR_INVALID_CAMERA_COUNT (422)."
        test_recipe:
          setup: ["A FuneralHome and Venue."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Cc Home", contact_email: "cc@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Cc Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "C Cee", scheduled_start: "2026-06-20T10:00:00Z", scheduled_end: "2026-06-20T11:00:00Z", camera_count: 5 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_CAMERA_COUNT"

      - name: create_order_invalid_time_range_returns_422
        claim_type: type_constraints
        grounds: [entities.ServiceOrder.fields.scheduled_end, "validations[priority=5]"]
        distinguishing_aspect: "scheduled_end not strictly after scheduled_start returns ERR_INVALID_TIME_RANGE (422)."
        test_recipe:
          setup: ["A FuneralHome and Venue."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Tr Home", contact_email: "tr@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Tr Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "T Ree", scheduled_start: "2026-06-20T12:00:00Z", scheduled_end: "2026-06-20T10:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_TIME_RANGE"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: go_live_from_draft_returns_not_scheduled
        claim_type: invalid_transition
        grounds: [state_machines.ServiceOrder.SCHEDULED_to_LIVE, "validations[priority=6]"]
        distinguishing_aspect: "GO_LIVE while broadcast_status is DRAFT (never scheduled) returns ERR_ORDER_NOT_SCHEDULED."
        test_recipe:
          setup: ["A fresh DRAFT order."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Gl Home", contact_email: "gl@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Gl Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "G Ell", scheduled_start: "2026-06-21T10:00:00Z", scheduled_end: "2026-06-21T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "GO_LIVE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_SCHEDULED"

      - name: tribute_publish_from_draft_returns_invalid_transition
        claim_type: invalid_transition
        grounds: [state_machines.TributeVideo.APPROVED_to_PUBLISHED, "validations[priority=6]"]
        distinguishing_aspect: "PUBLISH on a DRAFT (never approved) TributeVideo returns ERR_TRIBUTE_INVALID_TRANSITION."
        test_recipe:
          setup: ["An order and a DRAFT tribute video."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Tv Home", contact_email: "tv@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Tv Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "T Vee", scheduled_start: "2026-06-21T10:00:00Z", scheduled_end: "2026-06-21T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
            - call: "POST /tribute-videos"
              payload: { order_id: "${order_id}", title: "Draft Reel", photo_count: 5 }
              as: PlatformAdmin
              captures: { tv_id: $.data.id }
          trigger:
            - call: "POST /tribute-videos/${tv_id}/transitions"
              payload: { action: "PUBLISH" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRIBUTE_INVALID_TRANSITION"

      - name: cancelled_order_not_cancellable_again_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ServiceOrder.DRAFT_to_CANCELLED, "validations[priority=6]"]
        distinguishing_aspect: "A DRAFT order cancelled once (CANCELLED) rejects a second CANCEL with ERR_ORDER_NOT_CANCELLABLE."
        test_recipe:
          setup: ["A DRAFT order already cancelled."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Lk Home", contact_email: "lk@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Lk Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "L Kay", scheduled_start: "2026-06-21T10:00:00Z", scheduled_end: "2026-06-21T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "CANCEL" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "CANCEL" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_CANCELLABLE"

      - name: settle_already_settled_donation_returns_not_pledged
        claim_type: idempotency
        grounds: [state_machines.Donation.PLEDGED_to_SETTLED, "validations[priority=6]"]
        distinguishing_aspect: "SETTLE on a donation already SETTLED returns ERR_DONATION_NOT_PLEDGED (not a silent no-op)."
        test_recipe:
          setup: ["Order with PUBLISHED memorial, one SETTLED donation."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Sd Home", contact_email: "sd@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Sd Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "S Dee", scheduled_start: "2026-06-21T10:00:00Z", scheduled_end: "2026-06-21T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "PUBLISH_MEMORIAL" }
              as: PlatformAdmin
            - call: "POST /donations"
              payload: { order_id: "${order_id}", donor_name: "D1", gross_amount_cents: 1000 }
              as: Guest
              captures: { d1: $.data.id }
            - call: "POST /donations/${d1}/transitions"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /donations/${d1}/transitions"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DONATION_NOT_PLEDGED"

      - name: confirm_already_confirmed_booking_returns_not_held
        claim_type: invalid_transition
        grounds: [state_machines.VenueBooking.HELD_to_CONFIRMED, "validations[priority=6]"]
        distinguishing_aspect: "confirm on a CONFIRMED booking returns ERR_BOOKING_NOT_HELD."
        test_recipe:
          setup: ["Order with a CONFIRMED booking."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Cb Home", contact_email: "cb@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Cb Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "C Bee", scheduled_start: "2026-06-21T10:00:00Z", scheduled_end: "2026-06-21T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-21T10:00:00Z", window_end: "2026-06-21T11:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_id: $.data.id }
            - call: "POST /venue-bookings/${booking_id}/confirm"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /venue-bookings/${booking_id}/confirm"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BOOKING_NOT_HELD"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: guest_donation_before_memorial_published_returns_error
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", entities.ServiceOrder.fields.memorial_status]
        distinguishing_aspect: "A Guest donation on an order whose memorial_status is still DRAFT returns ERR_MEMORIAL_NOT_PUBLISHED."
        test_recipe:
          setup: ["An order with memorial still DRAFT (unpublished)."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Md Home", contact_email: "md@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Md Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "M Dee", scheduled_start: "2026-06-22T10:00:00Z", scheduled_end: "2026-06-22T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /donations"
              payload: { order_id: "${order_id}", donor_name: "D1", gross_amount_cents: 1000 }
              as: Guest
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMORIAL_NOT_PUBLISHED"

      - name: wrong_access_password_single_attempt_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", entities.ServiceOrder.fields.access_password]
        distinguishing_aspect: "A single wrong-password /access attempt (below the lock threshold) returns ERR_INVALID_ACCESS_PASSWORD (403) and leaves failed_access_count at 1, access_locked false."
        test_recipe:
          setup: ["An order with privacy_mode PASSWORD and access_password 'secret'."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Wp Home", contact_email: "wp@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Wp Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "W Pee", scheduled_start: "2026-06-22T10:00:00Z", scheduled_end: "2026-06-22T11:00:00Z", privacy_mode: "PASSWORD", access_password: "secret" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /service-orders/${order_id}/access"
              payload: { password: "nope" }
              as: Guest
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_ACCESS_PASSWORD"
            - "ServiceOrder.${order_id}.failed_access_count == 1"
            - "ServiceOrder.${order_id}.access_locked == false"

      - name: schedule_insufficient_credits_returns_402
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", entities.FuneralHome.fields.stream_credit_balance]
        distinguishing_aspect: "SCHEDULE on a DRAFT order that is booking-confirmed and stream-ready but whose home has 0 credits returns ERR_INSUFFICIENT_STREAM_CREDITS (402)."
        test_recipe:
          setup: ["Home with 0 credits; order booking CONFIRMED and stream READY, still DRAFT."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Ic Home", contact_email: "ic@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Ic Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "I See", scheduled_start: "2026-06-22T10:00:00Z", scheduled_end: "2026-06-22T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-22T10:00:00Z", window_end: "2026-06-22T11:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_id: $.data.id }
            - call: "POST /venue-bookings/${booking_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SET_STREAM_READY" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SCHEDULE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_STREAM_CREDITS"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_operators_pagination_envelope
        claim_type: listing
        grounds: [entities.Operator, endpoints]
        distinguishing_aspect: "GET /operators?home_id=&limit=1 over two operators returns a 1-element data array with total_count==2 and has_more==true."
        test_recipe:
          setup: ["A home with two operators."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Pg Home", contact_email: "pg@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /operators"
              payload: { home_id: "${home_id}", full_name: "Op A", skill: "CAMERA" }
              as: PlatformAdmin
            - call: "POST /operators"
              payload: { home_id: "${home_id}", full_name: "Op B", skill: "AUDIO" }
              as: PlatformAdmin
          trigger:
            - call: "GET /operators"
              payload: { home_id: "${home_id}", limit: 1 }
              as: PlatformAdmin
          assert:
            - "response.data is an array of length 1"
            - "response.total_count == 2"
            - "response.has_more == true"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: guest_cannot_create_service_order_returns_unauthorized
        claim_type: role_denial
        grounds: [roles.Guest, endpoints]
        distinguishing_aspect: "A Guest calling POST /service-orders (a FuneralHome/PlatformAdmin operation) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A home and venue exist."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Gz Home", contact_email: "gz@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Gz Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "G Zee", scheduled_start: "2026-06-23T10:00:00Z", scheduled_end: "2026-06-23T11:00:00Z" }
              as: Guest
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: cross_tenant_get_order_returns_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=4]", roles.FuneralHome]
        distinguishing_aspect: "FuneralHome A reading a ServiceOrder owned by home B (via X-User-ID = A) is denied with ERR_CROSS_TENANT_FORBIDDEN (403)."
        test_recipe:
          setup: ["Two funeral homes A and B; an order under home B."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Home A", contact_email: "a@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_a: $.data.id }
            - call: "POST /funeral-homes"
              payload: { name: "Home B", contact_email: "b@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_b: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_b}", name: "B Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_b: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_b}", venue_id: "${venue_b}", decedent_name: "B Own", scheduled_start: "2026-06-23T10:00:00Z", scheduled_end: "2026-06-23T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_b: $.data.id }
          trigger:
            - call: "GET /service-orders/${order_b}"
              payload: {}
              as: FuneralHome
              as_user_id: "${home_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CROSS_TENANT_FORBIDDEN"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_order_version_on_second_booking_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-create-stale-order]", "validations[priority=12]"]
        distinguishing_aspect: "After booking A supersedes on an order (order.version 1->2), a second booking still carrying expected_order_version from the pre-supersede read is rejected with ERR_STALE_ORDER_VERSION (412)."
        test_recipe:
          setup: ["An order at version 1; booking A created (order advances to 2)."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Oc Home", contact_email: "oc@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Oc Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "O See", scheduled_start: "2026-06-24T10:00:00Z", scheduled_end: "2026-06-24T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-24T10:00:00Z", window_end: "2026-06-24T11:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_a: $.data.id }
          trigger:
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-24T10:00:00Z", window_end: "2026-06-24T11:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_ORDER_VERSION"

      - name: order_version_increments_on_booking_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-create-stale-order]", entities.ServiceOrder.fields.version]
        distinguishing_aspect: "Creating a VenueBooking bumps the parent ServiceOrder.version from 1 to 2 (giving the OCC check something to observe)."
        test_recipe:
          setup: ["A fresh order at version 1."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Vi Home", contact_email: "vi@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Vi Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "V Eye", scheduled_start: "2026-06-24T10:00:00Z", scheduled_end: "2026-06-24T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
          trigger:
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-24T10:00:00Z", window_end: "2026-06-24T11:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_id: $.data.id }
          assert:
            - "ServiceOrder.${order_id}.version == 2"
            - "VenueBooking.${booking_id}.status == HELD"

      - name: guestbook_approve_recomputes_order_entry_count
        claim_type: derived_field_reconciliation
        grounds: [state_machines.GuestbookEntry.PENDING_to_APPROVED, entities.ServiceOrder.fields.guestbook_entry_count]
        distinguishing_aspect: "Approving one PENDING guestbook entry recomputes order.guestbook_entry_count from 0 to 1 (a PENDING entry does not count)."
        test_recipe:
          setup: ["Order with PUBLISHED memorial and one PENDING guestbook entry."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Gb Home", contact_email: "gb@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Gb Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "G Bee", scheduled_start: "2026-06-25T10:00:00Z", scheduled_end: "2026-06-25T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "PUBLISH_MEMORIAL" }
              as: PlatformAdmin
            - call: "POST /guestbook-entries"
              payload: { order_id: "${order_id}", author_name: "Guest One", message: "Rest in peace" }
              as: Guest
              captures: { gb_id: $.data.id }
          trigger:
            - call: "POST /guestbook-entries/${gb_id}/moderation"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
          assert:
            - "GuestbookEntry.${gb_id}.status == APPROVED"
            - "ServiceOrder.${order_id}.guestbook_entry_count == 1"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: final_invoice_overage_boundary
        claim_type: correct_result
        grounds: [calculations.service_billing]
        excluded_because:
          difficulty_instance: boundary_precision_check / invoice_no_overage_at_exactly_included_minutes
          rationale: "The included-minutes overage boundary and final_invoice_cents correctness are asserted by the named §1.8 instance."

      - name: donation_net_per_donation_rounding
        claim_type: correct_result
        grounds: [calculations.donation_ledger]
        excluded_because:
          difficulty_instance: combinatorial_formula / donation_net_rounds_per_donation_before_summing
          rationale: "Per-donation fee/net rounding correctness is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_cascade_booking_and_camera
        claim_type: cascade_down
        grounds: [state_machines.ServiceOrder.SCHEDULED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_scheduled_order_cascades_booking_then_camera_release
          rationale: "Booking->camera cascade on CANCEL is exercised by the named §1.8 instance."

      - name: refund_settled_donation_compensation
        claim_type: compensation
        grounds: [state_machines.Donation.SETTLED_to_REFUNDED]
        excluded_because:
          difficulty_instance: compensating_invariant / refund_settled_donation_restores_home_net_cents
          rationale: "Refund compensation of the net ledger is asserted by the named §1.8 instance."
