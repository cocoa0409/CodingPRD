      - name: settlement_execution_closes_the_price_freezes_contingency_and_closes_awarded_packages
        claim_type: guarded_transitions
        grounds:
          - state_machines.CmarProject.closeout_status
          - state_machines.CmarProject.contingency_posture
          - validations.priority_72
          - validations.priority_73
        distinguishing_aspect: |
          The settling call fires four state changes across three entities and then locks the
          project: a replay is refused with ERR_CLOSEOUT_ALREADY_SETTLED, while a draw that was
          requested BEFORE settlement can no longer be posted - and that path reports
          ERR_CONTINGENCY_FROZEN, because priority 72 deliberately does not claim the
          contingency-draw endpoints.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z, advanced to 2026-08-15T00:00:00Z to close the solicitation"
