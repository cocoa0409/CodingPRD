              as: Technician
              as_user_id: "${tech1_id}"
              captures: { rec1_id: $.data.id, rec1_until: $.data.occupies_until }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v2: $.data.version }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq2_id}", service_type: "ROUTINE_MAINTENANCE", performed_at: "2026-08-01T08:59:00Z", duration_minutes: 30, expected_system_version: "${sys1_v2}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq2_id}", service_type: "ROUTINE_MAINTENANCE", performed_at: "2026-08-01T09:00:00Z", duration_minutes: 30, expected_system_version: "${sys1_v2}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { rec2_id: $.data.id, rec2_until: $.data.occupies_until }
          assert:
            - "ServiceRecord.${rec1_id}.occupies_until == 2026-08-01T09:00:00Z and equipment_released_at == 2026-08-01T10:00:00Z"
            - "one minute of overlap: HTTP 409 with error_id == ERR_TECHNICIAN_SCHEDULE_CONFLICT"
            - "one minute of overlap: RefrigerantSystem.${sys1_id}.version == ${sys1_v2} (nothing written)"
            - "abutting at the exact end instant: HTTP 201 with ServiceRecord.${rec2_id}.occupies_until == 2026-08-01T09:30:00Z"
            - "RefrigerantSystem.${sys1_id}.current_charge_lbs == 80.0 and leak_rate_pct == 0.0 throughout (ROUTINE_MAINTENANCE moves no mass)"
            - "Store.${store_id}.compliance_status == COMPLIANT and open_leak_event_count == 0"

      - name: recovery_machine_occupancy_is_closed_and_buffered_touching_rejected
        grounds:
          - validations[priority=33]
          - errors[ERR_EQUIPMENT_DECONTAMINATION_CONFLICT]
          - entities.ServiceRecord.fields.equipment_released_at
          - entities.RecoveryEquipment.fields.equipment_serial
        distinguishing_aspect: |
          A different resource entity (RecoveryEquipment) under deliberately
          different interval semantics: CLOSED and decontamination-buffered
          [performed_at, performed_at + duration_minutes + 60 minutes]. Unlike
          the technician rule, sharing a single instant IS a conflict, so a
          record starting exactly at equipment_released_at is rejected and only
          one minute later succeeds. The two technicians differ on every attempt
