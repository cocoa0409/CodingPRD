          assert:
            - "L1 Inmate.${inm}.custody_status == DECEASED"
            - "L2 Inmate.${inm}.records_state == FROZEN"
            - "L3 MedicationOrder.${ord}.status == DISCONTINUED"
            - "L4 MedicationAdministration.${d4}.outcome == VOIDED"
            - "L5 MedicationOrder.${ord}.consecutive_missed_count == 0"
            - "L5 MedicationOrder.${ord}.escalated_to_prescriber == false"
            - "MedicationOrder.${ord}.adherence_pct == 0.00"
            - "MortalityReview.${mr}.status == OPEN"
            - "MortalityReview.${mr}.due_at == 2026-06-03T00:00:00.000Z"

      - name: grievance_granted_depth5_charge_reversal_to_indigency
        grounds:
          - state_machines.Grievance.UNDER_REVIEW_to_DECIDED
          - calculations.inmate_account_balance
          - calculations.indigency_determination
          - entities.CopayCharge.fields.reversal_grievance_id
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Depth-5 chain from a DIFFERENT trigger - the grievance decision, not the death
          event: GRANTED (L1) causes the CopayCharge to be REVERSED (L2), the reversal causes
          a REVERSAL LedgerEntry of +500 to be appended (L3), the append causes
          account_balance_cents to return to 600 (L4), and the balance change causes the
          read-time indigent_flag to fall from true back to false (L5).
        test_recipe:
          setup:
            - "600-cent DEPOSIT at 2026-05-01T00:00:00Z, then a FUNDED 500-cent SICK_CALL charge at 2026-05-02T00:00:00Z leaving account_balance_cents 100."
            - "A billing grievance naming that charge, filed and accepted at 2026-05-02T00:00:00Z (inside the 15-day INFORMAL filing window)."
            - "Clock then advanced to 2026-06-05T00:00:00Z, so both earlier ledger entries fall outside the 30-day lookback and the read-time indigent_flag is true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
