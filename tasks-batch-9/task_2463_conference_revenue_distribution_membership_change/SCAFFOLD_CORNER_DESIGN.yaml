      - name: corner_final_audited_variant_without_audited_expense_rejected
        claim_type: Variant Selection
        grounds:
          - validations[priority 64]
          - errors.ERR_AUDITED_EXPENSE_MISSING
          - endpoints[POST /revenue-pools/{id}/distribution-runs]
        distinguishing_aspect: |
          Variant selection is an input, not an inference: on an OPEN pool whose
          audited_expense_cents is still null, FINAL_AUDITED is refused with
          ERR_AUDITED_EXPENSE_MISSING rather than silently falling back to
          estimated_expense_cents, while PROVISIONAL on the very same pool
          version succeeds and nets 480000000 off the 20000000 estimate. The
          refused attempt must also leave the pool version untouched, which is
          why the second call reuses the same captured version.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a 12000000 reserve against an 18000000 target."
            - "The FY2027 MEDIA_RIGHTS pool is OPEN at 500000000 gross with estimated_expense_cents 20000000 and audited_expense_cents still null."
