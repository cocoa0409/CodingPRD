# =============================================================================
# Municipal Cemetery Management — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Municipal Cemetery Management: plot/grave inventory & GIS, sale &
  deed/right-of-interment, interment scheduling & opening/closing, perpetual-care
  fund, genealogy/records lookup, foundation/marker permit, disinterment
  authorization, billing

domain_name: municipal-cemetery-management
api_prefix: /cemetery-mgmt

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic          # + parallel (Interment) + branching (Disinterment)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                       # Invoice.subject_type/subject_id
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Cemetery
    parent: null
    common_fields: true                 # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Cemetery name" }
      - { name: timezone, type: string, source: input, required: false, default: "UTC", description: "IANA timezone label (informational)" }
      - { name: crew_team_count, type: integer, source: input, required: false, default: 1, description: "Number of independent grounds crews available per day; governs crew time-window overlap (>=1)" }
      - { name: perpetual_care_fund_balance_cents, type: integer, source: computed, description: "Running perpetual-care fund balance = SUM(CONTRIBUTION)+SUM(INTEREST)-SUM(DISBURSEMENT) over CareFundEntry rows for this cemetery" }

  - name: Plot
    parent: null
    common_fields: true
    fields:
      - { name: cemetery_id, type: string, source: input, description: "FK -> Cemetery.id; owning cemetery" }
      - { name: section_code, type: string, source: input, description: "GIS section label, e.g. 'A'" }
      - { name: row, type: string, source: input, description: "Row label within section" }
      - { name: plot_number, type: string, source: input, description: "Plot number within row" }
      - { name: gis_lat, type: number, source: input, description: "GIS latitude of plot centroid" }
      - { name: gis_lng, type: number, source: input, description: "GIS longitude of plot centroid" }
      - { name: plot_type, type: enum, source: input, description: "GRAVE | LAWN_CRYPT | NICHE | MAUSOLEUM" }
      - { name: interment_capacity, type: integer, source: input, description: "Maximum number of active interments this plot may hold (>=1)" }
      - { name: interments_used, type: integer, source: computed, description: "COUNT(Interment for this plot with operational_status IN {SCHEDULED, OPENED, COMPLETED}); conserved against interment schedule/cancel" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | SOLD | RETIRED" }

  - name: RightHolder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the interment-right holder" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, required: false, description: "Contact phone" }

  - name: Decedent
    parent: null
    common_fields: false                # id, created_at only — immutable genealogy record
    fields:
      - { name: full_name, type: string, source: input, description: "Full name of the decedent" }
      - { name: date_of_birth, type: string, source: input, required: false, description: "ISO date of birth (YYYY-MM-DD)" }
      - { name: date_of_death, type: string, source: input, description: "ISO date of death (YYYY-MM-DD)" }
      - { name: sex, type: enum, source: input, required: false, description: "M | F | X | UNKNOWN" }
      - { name: death_year, type: integer, source: computed, description: "Year parsed from date_of_death; genealogy-lookup filter key" }

  - name: Deed
    parent: null
    common_fields: true
    fields:
      - { name: plot_id, type: string, source: input, description: "FK -> Plot.id; plot conveyed by this right-of-interment" }
      - { name: holder_id, type: string, source: input, description: "FK -> RightHolder.id; current holder of the interment right" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Sale price of the interment right, in cents (>=0)" }
      - { name: sale_type, type: enum, source: input, description: "NEW_SALE | RESALE — selects perpetual-care contribution variant" }
      - { name: care_fund_contribution_cents, type: integer, source: computed, description: "Perpetual-care contribution computed from purchase_price_cents and sale_type (see care_fund_contribution calc); pinned at issuance" }
      - { name: sale_invoice_id, type: string, source: system, description: "Id of the DEED_SALE Invoice generated when this deed is created" }
      - { name: status, type: enum, source: system, description: "PENDING_PAYMENT | ISSUED | TRANSFER_PENDING | SURRENDERED" }
      - { name: pending_new_holder_id, type: string, source: system, required: false, description: "FK -> RightHolder.id; proposed holder while status is TRANSFER_PENDING (nulled on accept)" }

  - name: Interment
    parent: null
    common_fields: true
    fields:
      - { name: plot_id, type: string, source: input, description: "FK -> Plot.id; plot receiving the interment" }
      - { name: decedent_id, type: string, source: input, description: "FK -> Decedent.id; who is interred" }
      - { name: deed_id, type: string, source: input, description: "FK -> Deed.id; right-of-interment authorizing this interment (must be ISSUED)" }
      - { name: interment_type, type: enum, source: input, description: "BURIAL | ENTOMBMENT | INURNMENT" }
      - { name: depth_position, type: integer, source: input, description: "Depth/tier index within the plot (1 = first/top); drives depth surcharge (>=1)" }
      - { name: scheduled_date, type: string, source: input, description: "ISO calendar date (YYYY-MM-DD) of the opening/closing" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC start of the crew time window" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC end of the crew time window (must be strictly after scheduled_start)" }
      - { name: day_type, type: enum, source: computed, description: "WEEKDAY | WEEKEND | HOLIDAY derived from scheduled_date" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Opening/closing service fee (see interment_service_fee calc)" }
      - { name: service_invoice_id, type: string, source: system, description: "Id of the INTERMENT_SERVICE Invoice generated when scheduled" }
      - { name: operational_status, type: enum, source: system, description: "SCHEDULED | OPENED | COMPLETED | CANCELLED | DISINTERRED (operational axis)" }
      - { name: billing_status, type: enum, source: system, description: "INVOICED | PAID | VOIDED (billing axis, evolves independently of operational_status)" }

  - name: DisintermentAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: interment_id, type: string, source: input, description: "FK -> Interment.id; the COMPLETED interment to be disinterred" }
      - { name: reason, type: string, source: input, description: "Stated reason for disinterment" }
      - { name: disinterment_type, type: enum, source: input, description: "RELOCATION | REMOVAL — selects the settlement variant" }
      - { name: target_plot_id, type: string, source: input, required: false, description: "FK -> Plot.id; destination plot when disinterment_type=RELOCATION" }
      - { name: health_cleared, type: boolean, source: system, default: false, description: "true once a HealthOfficer records clearance" }
      - { name: nok_consented, type: boolean, source: system, default: false, description: "true once next-of-kin consent is recorded" }
      - { name: disinterment_invoice_id, type: string, source: system, description: "Id of the DISINTERMENT Invoice generated at request time" }
      - { name: settlement_cents, type: integer, source: computed, required: false, description: "Perpetual-care settlement disbursed on execution (see disinterment_settlement calc)" }
      - { name: approved_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the CemeteryDirector who approved; compared against executor for segregation of duties" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | EXECUTED" }

  - name: MarkerPermit
    parent: null
    common_fields: true
    fields:
      - { name: plot_id, type: string, source: input, description: "FK -> Plot.id; plot where the foundation/marker is installed" }
      - { name: deed_id, type: string, source: input, description: "FK -> Deed.id; deed that must be ISSUED to authorize the marker" }
      - { name: marker_type, type: enum, source: input, description: "FLAT | UPRIGHT | MONUMENT — selects foundation fee" }
      - { name: foundation_length_in, type: integer, source: input, description: "Foundation length in inches (>0)" }
      - { name: foundation_width_in, type: integer, source: input, description: "Foundation width in inches (>0)" }
      - { name: foundation_fee_cents, type: integer, source: computed, description: "Foundation/marker fee = MARKER_FEE_BY_TYPE[marker_type]" }
      - { name: foundation_invoice_id, type: string, source: system, description: "Id of the MARKER_FOUNDATION Invoice generated at application" }
      - { name: status, type: enum, source: system, description: "APPLIED | APPROVED | INSTALLED | REJECTED | CANCELLED | DECOMMISSIONED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: input, description: "FK -> RightHolder.id; party billed" }
      - { name: subject_type, type: enum, source: system, description: "DEED_SALE | INTERMENT_SERVICE | MARKER_FOUNDATION | DISINTERMENT (polymorphic subject discriminator)" }
      - { name: subject_id, type: string, source: system, description: "Polymorphic reference: id of the Deed/Interment/MarkerPermit/DisintermentAuthorization this invoice bills (resolve using subject_type)" }
      - { name: lines, type: array, source: system, description: "List of {label, amount_cents, taxable} line items" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line amount_cents" }
      - { name: tax_cents, type: integer, source: computed, description: "Per-line tax rounded then summed (see invoice_total calc)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the actor whose action generated the invoice" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | VOID" }

  - name: Payment
    parent: null
    common_fields: false                # id, created_at only — append-only payment event
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; invoice being settled" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered; must equal Invoice.total_cents" }
      - { name: method, type: enum, source: input, description: "CARD | CHECK | CASH | ACH" }

  - name: CareFundEntry
    parent: null
    common_fields: false                # id, created_at only — append-only ledger event
    fields:
      - { name: cemetery_id, type: string, source: input, description: "FK -> Cemetery.id; fund this entry posts to" }
      - { name: entry_type, type: enum, source: input, description: "CONTRIBUTION | DISBURSEMENT | INTEREST" }
      - { name: amount_cents, type: integer, source: input, description: "Positive magnitude of the entry (>=0); sign applied by entry_type" }
      - { name: source_deed_id, type: string, source: input, required: false, description: "FK -> Deed.id; deed that originated a CONTRIBUTION/DISBURSEMENT (nullable for INTEREST)" }
      - { name: note, type: string, source: input, required: false, description: "Free-text memo" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Plot
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /cemetery-mgmt/deeds (create right-of-interment)"
        actor: Registrar
        preconditions:
          - "Plot.status == AVAILABLE (ERR_PLOT_NOT_AVAILABLE)"
          - "expected_plot_version == Plot.version (ERR_STALE_VERSION)"
        side_effects:
          - "A Deed is created in PENDING_PAYMENT referencing this plot"
          - "increments Plot.version by 1"
      - from: RESERVED
        to: SOLD
        trigger: "system: DEED_SALE Invoice reaches PAID (via POST /cemetery-mgmt/payments)"
        actor: system
        preconditions: ["Deed for this plot is PENDING_PAYMENT"]
        side_effects:
          - "linked Deed -> ISSUED"
          - "CareFundEntry CONTRIBUTION of Deed.care_fund_contribution_cents posted (source_deed_id = Deed.id)"
          - "increments Plot.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /cemetery-mgmt/deeds/{deed_id}/surrender"
        actor: Registrar
        preconditions: ["no Interment on plot with operational_status IN {SCHEDULED, OPENED, COMPLETED}"]
        side_effects:
          - "cascade: reclaimed plot triggers non-terminal MarkerPermit(s) -> CANCELLED"
      - from: SOLD
        to: AVAILABLE
        trigger: "POST /cemetery-mgmt/deeds/{deed_id}/surrender"
        actor: Registrar
        preconditions: ["no Interment on plot with operational_status IN {SCHEDULED, OPENED, COMPLETED} (ERR_PLOT_OCCUPIED)"]
        side_effects:
          - "linked Deed -> SURRENDERED"
          - "cascade: reclaimed plot triggers non-terminal MarkerPermit(s) (APPLIED/APPROVED) -> CANCELLED"
          - "CareFundEntry DISBURSEMENT reversing the deed contribution posted; refund Invoice issued"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /cemetery-mgmt/plots/{plot_id}/retire"
        actor: CemeteryDirector
        preconditions: ["Plot.status == AVAILABLE (ERR_PLOT_NOT_AVAILABLE)", "interments_used == 0"]
        side_effects: ["increments Plot.version by 1"]

  - entity: Deed
    initial_state: PENDING_PAYMENT
    terminal_states: [SURRENDERED]
    transitions:
      - from: PENDING_PAYMENT
        to: ISSUED
        trigger: "system: DEED_SALE Invoice PAID"
        actor: system
        preconditions: []
        side_effects:
          - "Plot -> SOLD"
          - "care_fund_contribution_cents pinned; CareFundEntry CONTRIBUTION posted (cascade link 3)"
      - from: ISSUED
        to: TRANSFER_PENDING
        trigger: "POST /cemetery-mgmt/deeds/{deed_id}/transfer"
        actor: Registrar
        preconditions: ["new_holder_id references an existing RightHolder (ERR_HOLDER_NOT_FOUND)", "new_holder_id != holder_id"]
        side_effects: ["pending_new_holder_id = new_holder_id"]
      - from: TRANSFER_PENDING
        to: ISSUED
        trigger: "POST /cemetery-mgmt/deeds/{deed_id}/accept-transfer"
        actor: RightHolder
        preconditions: ["acting RightHolder (X-User-ID) == pending_new_holder_id (ERR_NOT_PENDING_HOLDER)"]
        side_effects:
          - "holder_id = pending_new_holder_id; pending_new_holder_id nulled"
          - "cyclic: deed returns to ISSUED and may be transferred again"
      - from: ISSUED
        to: SURRENDERED
        trigger: "POST /cemetery-mgmt/deeds/{deed_id}/surrender"
        actor: Registrar
        preconditions: ["Plot has no active Interment (ERR_PLOT_OCCUPIED)"]
        side_effects:
          - "Plot -> AVAILABLE (cascade link 2)"
          - "non-terminal MarkerPermit(s) -> CANCELLED (cascade link 3)"
          - "CareFundEntry DISBURSEMENT reversing contribution; refund Invoice issued"

  - entity: Interment
    initial_state: SCHEDULED            # operational_status axis; billing_status starts INVOICED
    terminal_states: [CANCELLED, DISINTERRED]
    transitions:
      - from: SCHEDULED
        to: OPENED
        trigger: "POST /cemetery-mgmt/interments/{interment_id}/open"
        actor: GroundsForeman
        preconditions:
          - "service Invoice for this interment is PAID (billing_status == PAID) (ERR_INVOICE_UNPAID)"
          - "current logical clock date >= scheduled_date (ERR_TOO_EARLY_TO_OPEN)"
        side_effects: ["operational_status -> OPENED (billing_status unchanged)"]
      - from: OPENED
        to: COMPLETED
        trigger: "POST /cemetery-mgmt/interments/{interment_id}/complete"
        actor: GroundsForeman
        preconditions: []
        side_effects: ["operational_status -> COMPLETED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cemetery-mgmt/interments/{interment_id}/cancel"
        actor: Registrar
        preconditions: []
        side_effects:
          - "Plot.interments_used decremented (compensates the schedule; occupancy invariant preserved)"
          - "service Invoice -> VOID; billing_status -> VOIDED"
      - from: OPENED
        to: CANCELLED
        trigger: "POST /cemetery-mgmt/interments/{interment_id}/cancel"
        actor: Registrar
        preconditions: []
        side_effects:
          - "Plot.interments_used decremented"
          - "service Invoice -> VOID (if not PAID); billing_status -> VOIDED"
      - from: COMPLETED
        to: DISINTERRED
        trigger: "system: DisintermentAuthorization EXECUTED"
        actor: system
        preconditions: ["a DisintermentAuthorization for this interment is APPROVED and its DISINTERMENT invoice PAID"]
        side_effects:
          - "Plot.interments_used decremented (cascade link 2)"
          - "INSTALLED MarkerPermit on the plot -> DECOMMISSIONED (cascade link 3)"
          - "CareFundEntry DISBURSEMENT of settlement_cents posted"
      # --- billing_status axis (parallel dimension) ---
      - from: INVOICED
        to: PAID
        trigger: "system: INTERMENT_SERVICE Invoice PAID (via POST /cemetery-mgmt/payments)"
        actor: system
        note: "billing_status axis; independent of operational_status"
        preconditions: []
        side_effects: ["billing_status -> PAID (operational_status unchanged)"]
      - from: INVOICED
        to: VOIDED
        trigger: "system: service Invoice voided on interment cancel"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DisintermentAuthorization
    initial_state: REQUESTED
    terminal_states: [DENIED, EXECUTED]
    transitions:
      - from: REQUESTED
        to: REQUESTED
        trigger: "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/record-clearance"
        actor: HealthOfficer
        preconditions: ["health_cleared == false (ERR_ALREADY_RECORDED)"]
        side_effects: ["health_cleared = true (branch A of fork-join)"]
      - from: REQUESTED
        to: REQUESTED
        trigger: "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/record-consent"
        actor: RightHolder
        preconditions: ["nok_consented == false (ERR_ALREADY_RECORDED)"]
        side_effects: ["nok_consented = true (branch B of fork-join)"]
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/approve"
        actor: CemeteryDirector
        preconditions:
          - "health_cleared == true AND nok_consented == true (join gate) (ERR_CONSENT_INCOMPLETE)"
        side_effects: ["approved_by_user_id = acting X-User-ID"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/deny"
        actor: CemeteryDirector
        preconditions: []
        side_effects: ["DISINTERMENT invoice -> VOID"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/execute"
        actor: Registrar
        preconditions:
          - "DISINTERMENT Invoice PAID (ERR_INVOICE_UNPAID)"
          - "acting X-User-ID != approved_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "linked Interment -> DISINTERRED (cascade link 1)"
          - "settlement_cents computed and posted as CareFundEntry DISBURSEMENT"

  - entity: MarkerPermit
    initial_state: APPLIED
    terminal_states: [REJECTED, CANCELLED, DECOMMISSIONED]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /cemetery-mgmt/marker-permits/{permit_id}/approve"
        actor: CemeteryDirector
        preconditions: ["referenced Deed.status == ISSUED (ERR_DEED_NOT_ISSUED)"]
        side_effects: []
      - from: APPROVED
        to: INSTALLED
        trigger: "POST /cemetery-mgmt/marker-permits/{permit_id}/install"
        actor: GroundsForeman
        preconditions:
          - "MARKER_FOUNDATION Invoice PAID (ERR_INVOICE_UNPAID)"
          - "plot has an Interment with operational_status == COMPLETED (ERR_NO_COMPLETED_INTERMENT)"
        side_effects: []
      - from: APPLIED
        to: REJECTED
        trigger: "POST /cemetery-mgmt/marker-permits/{permit_id}/reject"
        actor: CemeteryDirector
        preconditions: []
        side_effects: ["MARKER_FOUNDATION invoice -> VOID"]
      - from: APPROVED
        to: CANCELLED
        trigger: "system: plot reclaimed by deed surrender"
        actor: system
        preconditions: []
        side_effects: ["MARKER_FOUNDATION invoice -> VOID (if unpaid)"]
      - from: APPLIED
        to: CANCELLED
        trigger: "system: plot reclaimed by deed surrender"
        actor: system
        preconditions: []
        side_effects: ["MARKER_FOUNDATION invoice -> VOID (if unpaid)"]
      - from: INSTALLED
        to: DECOMMISSIONED
        trigger: "system: linked interment DISINTERRED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /cemetery-mgmt/payments"
        actor: FinanceOfficer
        preconditions: ["amount_cents == Invoice.total_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"]
        side_effects:
          - "subject-specific cascade fires (DEED_SALE -> deed ISSUED + plot SOLD + contribution; INTERMENT_SERVICE -> billing_status PAID)"
      - from: ISSUED
        to: VOID
        trigger: "POST /cemetery-mgmt/invoices/{invoice_id}/void"
        actor: FinanceOfficer
        preconditions: ["acting X-User-ID != issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: deed-create-stale-plot
    parent_entity: Plot
    write_endpoint: "POST /cemetery-mgmt/deeds"
    occ_field: "expected_plot_version"
    description: |
      Creating a Deed against a Plot whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has already created a deed that legitimately reserves the plot (advancing
      Plot.version), so the current writer's view of the plot is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: care_fund_contribution
    trigger: "Deed creation (pinned onto the deed at issuance)"
    algorithm: dual_variant_threshold
    formula: |
      NEW_SALE: contribution = max( round_half_up(purchase_price_cents * CARE_PCT), CARE_MIN_CENTS )
      RESALE:   contribution = round_half_up(purchase_price_cents * RESALE_CARE_PCT)   # no statutory floor
    input_set: "single Deed; sale_type selects the variant"
    constants: { CARE_PCT: 0.15, CARE_MIN_CENTS: 25000, RESALE_CARE_PCT: 0.10 }
    precision: "cents, round_half_up on Decimal arithmetic"
    variants:
      - { name: NEW_SALE, when: "sale_type == NEW_SALE", difference: "percentage floored at statutory CARE_MIN_CENTS" }
      - { name: RESALE, when: "sale_type == RESALE", difference: "lower rate, no statutory floor -> different result for identical price" }

  - name: interment_service_fee
    trigger: "Interment scheduling (POST /cemetery-mgmt/interments)"
    algorithm: tiered_pricing
    formula: |
      base       = BASE_FEE_BY_PLOT_TYPE[plot_type]
      depth      = 0 if depth_position == 1 else (DEPTH_TIER_2 if depth_position == 2 else DEPTH_TIER_3PLUS)
      day        = HOLIDAY_SURCHARGE if day_type == HOLIDAY else (WEEKEND_SURCHARGE if day_type == WEEKEND else 0)
      notice     = SHORT_NOTICE_SURCHARGE if (scheduled_date - clock_date_in_days) < SHORT_NOTICE_DAYS else 0
      service_fee_cents = base + depth + day + notice
    input_set: "single Interment; day_type derived from scheduled_date vs HOLIDAYS; notice from logical clock"
    constants:
      BASE_FEE_BY_PLOT_TYPE: { GRAVE: 90000, LAWN_CRYPT: 120000, NICHE: 45000, MAUSOLEUM: 150000 }
      DEPTH_TIER_2: 15000
      DEPTH_TIER_3PLUS: 30000
      WEEKEND_SURCHARGE: 20000
      HOLIDAY_SURCHARGE: 35000
      SHORT_NOTICE_SURCHARGE: 25000
      SHORT_NOTICE_DAYS: 3
      HOLIDAYS: ["2026-01-01", "2026-07-04", "2026-11-26", "2026-12-25"]
    precision: "integer cents; HOLIDAY dominates WEEKEND when both apply"

  - name: invoice_total
    trigger: "Invoice generation for any subject_type"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum(line.amount_cents for line in lines)
      # PINNED ORDER — round per taxable line, THEN sum (round-then-sum differs by a cent):
      tax_cents = sum( round_half_up(Decimal(line.amount_cents) * TAX_RATE) for line in lines if line.taxable )
      total_cents = subtotal_cents + tax_cents
    input_set: "the Invoice's own lines[]; non-taxable lines (e.g. perpetual_care) excluded from tax"
    constants: { TAX_RATE: 0.0725 }
    precision: "cents, round_half_up per line, then sum (NOT sum-then-round)"
    line_composition: |
      # Per-subject line breakdown is PINNED so totals are deterministic:
      DEED_SALE:         [ {label: purchase_price, amount: purchase_price_cents, taxable: true},
                           {label: perpetual_care, amount: care_fund_contribution_cents, taxable: false} ]
      INTERMENT_SERVICE: one taxable line per NON-ZERO component of interment_service_fee, in the
                         fixed order [base, depth_surcharge, day_surcharge, short_notice_surcharge]
                         (so tax is rounded per component then summed — the round-then-sum trap).
      MARKER_FOUNDATION: [ {label: foundation, amount: foundation_fee_cents, taxable: true} ]
      DISINTERMENT:      [ {label: disinterment, amount: DISINTERMENT_FEE_CENTS, taxable: true} ]

  - name: disinterment_billing_fee
    trigger: "DisintermentAuthorization request (POST /cemetery-mgmt/disinterment-authorizations)"
    algorithm: table_lookup
    formula: |
      # The DISINTERMENT Invoice carries a single taxable line of DISINTERMENT_FEE_CENTS.
      disinterment_fee_cents = DISINTERMENT_FEE_CENTS
    input_set: "single DisintermentAuthorization"
    constants: { DISINTERMENT_FEE_CENTS: 200000 }
    precision: "integer cents"

  - name: disinterment_settlement
    trigger: "DisintermentAuthorization execution"
    algorithm: dual_variant_threshold
    formula: |
      contribution = Deed.care_fund_contribution_cents   # via Interment.deed_id
      RELOCATION: settlement_cents = round_half_up(contribution * RELOC_CREDIT_PCT)   # care funds follow remains
      REMOVAL:    settlement_cents = round_half_up(contribution * REMOVAL_REFUND_PCT)  # partial refund, remainder retained
      # posted as a CareFundEntry DISBURSEMENT of settlement_cents
    input_set: "the disinterred Interment's originating Deed; disinterment_type selects the variant"
    constants: { RELOC_CREDIT_PCT: 0.50, REMOVAL_REFUND_PCT: 0.25 }
    precision: "cents, round_half_up"
    variants:
      - { name: RELOCATION, when: "disinterment_type == RELOCATION", difference: "50% of contribution disbursed" }
      - { name: REMOVAL, when: "disinterment_type == REMOVAL", difference: "25% of contribution disbursed -> different result" }

  - name: perpetual_care_balance
    trigger: "any CareFundEntry insert"
    algorithm: aggregation
    formula: |
      balance = SUM(amount_cents WHERE entry_type IN {CONTRIBUTION, INTEREST})
              - SUM(amount_cents WHERE entry_type == DISBURSEMENT)
      # over all CareFundEntry rows for cemetery_id (append-only; no status filter)
      # A DISBURSEMENT that would drive balance < 0 is rejected (ERR_CARE_FUND_INSUFFICIENT).
    input_set: "all CareFundEntry rows for the cemetery"
    constants: {}
    precision: "integer cents"

  - name: plot_occupancy
    trigger: "Interment schedule / cancel / disinterment"
    algorithm: aggregation
    formula: |
      interments_used = COUNT(Interment WHERE plot_id == Plot.id
                              AND operational_status IN {SCHEDULED, OPENED, COMPLETED})
      # A schedule paired with its cancellation/disinterment restores the prior count exactly.
    input_set: "Interment rows for the plot, filtered by operational_status"
    constants: {}
    precision: "integer count"

  - name: marker_foundation_fee
    trigger: "MarkerPermit application"
    algorithm: table_lookup
    formula: |
      foundation_fee_cents = MARKER_FEE_BY_TYPE[marker_type]
    input_set: "single MarkerPermit"
    constants:
      MARKER_FEE_BY_TYPE: { FLAT: 15000, UPRIGHT: 30000, MONUMENT: 60000 }
    precision: "integer cents"

  - name: crew_time_window_overlap
    trigger: "Interment scheduling (POST /cemetery-mgmt/interments)"
    algorithm: interval_merge
    formula: |
      # Two distinct interval semantics guard scheduling:
      # (1) Plot-day (whole-day, closed): at most one non-cancelled Interment per plot
      #     per scheduled_date -> ERR_PLOT_DOUBLE_BOOKED.
      # (2) Crew time-window (half-open [scheduled_start, scheduled_end), buffered):
      #     count of same-day interments whose window, padded by CREW_BUFFER_MINUTES on
      #     each side, intersects the new window must be < Cemetery.crew_team_count.
      #     Adjacency touching exactly at an endpoint does NOT overlap (half-open);
      #     a gap smaller than CREW_BUFFER_MINUTES DOES overlap. Violation -> ERR_CREW_UNAVAILABLE.
      overlaps(a, b) := a.start < (b.end + BUFFER) AND b.start < (a.end + BUFFER)
    input_set: "same-day interments with operational_status IN {SCHEDULED, OPENED, COMPLETED}"
    constants: { CREW_BUFFER_MINUTES: 60 }
    precision: "minute-resolution half-open intervals; buffer applied symmetrically"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role authorized for this operation (and, for entity_backed RightHolder, ownership of the target resource)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: validation
    check: "Body well-formed: required fields present, enums in range, numeric fields non-negative / positive as noted, scheduled_end > scheduled_start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all write endpoints
  - priority: 4
    category: existence
    check: "Path ids and referenced foreign keys exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: concurrency
    check: "expected_plot_version equals current Plot.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cemetery-mgmt/deeds"
  - priority: 6
    category: state
    check: "Target resource in a state that permits the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state transition endpoints
  - priority: 7
    category: business_referential
    check: "Cross-entity gate: deed ISSUED for interment scheduling / marker approval; interment COMPLETED for disinterment request; new_holder valid for transfer"
    error_id: ERR_DEED_NOT_ISSUED
    http_status: 409
    applies_to: "POST /cemetery-mgmt/interments, marker approve, disinterment create"
  - priority: 8
    category: business_safety
    check: "Disinterment consent/clearance and segregation-of-duties gates satisfied"
    error_id: ERR_CONSENT_INCOMPLETE
    http_status: 409
    applies_to: "disinterment approve/execute"
  - priority: 9
    category: business_temporal
    check: "scheduled_date not in the past; open only on/after scheduled_date"
    error_id: ERR_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /cemetery-mgmt/interments, interment open"
  - priority: 10
    category: business_constraint
    check: "Plot capacity (interments_used < interment_capacity), plot per-day single-booking, crew time-window/buffer availability"
    error_id: ERR_PLOT_CAPACITY
    http_status: 409
    applies_to: "POST /cemetery-mgmt/interments"
  - priority: 11
    category: business_fiscal
    check: "Invoice paid where required; payment amount matches; care-fund balance stays non-negative"
    error_id: ERR_INVOICE_UNPAID
    http_status: 409
    applies_to: "interment open, marker install, disinterment execute, payments, care-fund disbursements"

# =============================================================================
# Response envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Cemetery ---
  - { method: POST, path: "/cemetery-mgmt/cemeteries", description: "Create a cemetery", roles: [CemeteryDirector], code: 201, input: [name, "timezone?", "crew_team_count?"], output: Cemetery, side_effects: ["perpetual_care_fund_balance_cents = 0"] }
  - { method: GET, path: "/cemetery-mgmt/cemeteries/{cemetery_id}", description: "Get a cemetery (includes fund balance)", roles: [Registrar, GroundsForeman, FinanceOfficer, HealthOfficer, CemeteryDirector, RightHolder], code: 200, input: [], output: Cemetery, side_effects: [] }

  # --- Plot ---
  - { method: POST, path: "/cemetery-mgmt/plots", description: "Create a plot in a cemetery", roles: [Registrar], code: 201, input: [cemetery_id, section_code, row, plot_number, gis_lat, gis_lng, plot_type, interment_capacity], output: Plot, side_effects: ["status=AVAILABLE", "interments_used=0"] }
  - { method: GET, path: "/cemetery-mgmt/plots/{plot_id}", description: "Get a plot", roles: [Registrar, GroundsForeman, FinanceOfficer, HealthOfficer, CemeteryDirector, RightHolder], code: 200, input: [], output: Plot, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/plots", description: "List/search plots (reverse-reach for Plot.cemetery_id)", roles: [Registrar, GroundsForeman, FinanceOfficer, HealthOfficer, CemeteryDirector, RightHolder], code: 200, input: ["cemetery_id?", "status?", "section_code?", "limit?", "offset?"], output: "Plot[]", side_effects: [] }
  - { method: POST, path: "/cemetery-mgmt/plots/{plot_id}/retire", description: "Retire an empty available plot", roles: [CemeteryDirector], code: 200, input: [], output: Plot, side_effects: ["status=RETIRED", "increments Plot.version by 1"] }

  # --- RightHolder ---
  - { method: POST, path: "/cemetery-mgmt/holders", description: "Create a right-holder record", roles: [Registrar], code: 201, input: [full_name, email, "phone?"], output: RightHolder, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/holders/{holder_id}", description: "Get a right-holder", roles: [Registrar, FinanceOfficer, CemeteryDirector, RightHolder], code: 200, input: [], output: RightHolder, side_effects: [] }

  # --- Decedent / genealogy ---
  - { method: POST, path: "/cemetery-mgmt/decedents", description: "Create an (immutable) decedent record", roles: [Registrar], code: 201, input: [full_name, date_of_death, "date_of_birth?", "sex?"], output: Decedent, side_effects: ["death_year computed from date_of_death"] }
  - { method: GET, path: "/cemetery-mgmt/decedents/{decedent_id}", description: "Get a decedent record", roles: [Registrar, GroundsForeman, FinanceOfficer, HealthOfficer, CemeteryDirector, RightHolder], code: 200, input: [], output: Decedent, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/decedents", description: "Genealogy lookup (search decedents)", roles: [Registrar, GroundsForeman, FinanceOfficer, HealthOfficer, CemeteryDirector, RightHolder], code: 200, input: ["full_name?", "death_year?", "limit?", "offset?"], output: "Decedent[]", side_effects: [] }

  # --- Deed / right-of-interment ---
  - { method: POST, path: "/cemetery-mgmt/deeds", description: "Sell right-of-interment on a plot (OCC on plot)", roles: [Registrar], code: 201, input: [plot_id, holder_id, purchase_price_cents, sale_type, expected_plot_version], output: Deed, side_effects: ["status=PENDING_PAYMENT", "Plot AVAILABLE->RESERVED", "increments Plot.version by 1", "care_fund_contribution_cents computed", "DEED_SALE Invoice issued (sale_invoice_id)"] }
  - { method: GET, path: "/cemetery-mgmt/deeds/{deed_id}", description: "Get a deed", roles: [Registrar, FinanceOfficer, CemeteryDirector, RightHolder], code: 200, input: [], output: Deed, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/deeds", description: "List deeds (reverse-reach for plot_id/holder_id/pending_new_holder_id)", roles: [Registrar, FinanceOfficer, CemeteryDirector, RightHolder], code: 200, input: ["plot_id?", "holder_id?", "pending_new_holder_id?", "status?", "limit?", "offset?"], output: "Deed[]", side_effects: [] }
  - { method: POST, path: "/cemetery-mgmt/deeds/{deed_id}/transfer", description: "Propose transfer of a deed to a new holder", roles: [Registrar], code: 200, input: [new_holder_id], output: Deed, side_effects: ["status=TRANSFER_PENDING", "pending_new_holder_id set"] }
  - { method: POST, path: "/cemetery-mgmt/deeds/{deed_id}/accept-transfer", description: "New holder accepts transfer (deed returns to ISSUED)", roles: [RightHolder], code: 200, input: [], output: Deed, side_effects: ["holder_id updated", "status=ISSUED (cyclic)"] }
  - { method: POST, path: "/cemetery-mgmt/deeds/{deed_id}/surrender", description: "Surrender a deed; plot reclaimed", roles: [Registrar], code: 200, input: [], output: Deed, side_effects: ["status=SURRENDERED", "Plot->AVAILABLE", "non-terminal MarkerPermits->CANCELLED", "care-fund reversal + refund invoice"] }

  # --- Interment ---
  - { method: POST, path: "/cemetery-mgmt/interments", description: "Schedule an interment (opening/closing)", roles: [Registrar], code: 201, input: [plot_id, decedent_id, deed_id, interment_type, depth_position, scheduled_date, scheduled_start, scheduled_end], output: Interment, side_effects: ["operational_status=SCHEDULED", "billing_status=INVOICED", "day_type + service_fee_cents computed", "Plot.interments_used +1", "INTERMENT_SERVICE Invoice issued (service_invoice_id)"] }
  - { method: GET, path: "/cemetery-mgmt/interments/{interment_id}", description: "Get an interment", roles: [Registrar, GroundsForeman, FinanceOfficer, HealthOfficer, CemeteryDirector, RightHolder], code: 200, input: [], output: Interment, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/interments", description: "List interments (reverse-reach for plot/decedent/deed)", roles: [Registrar, GroundsForeman, FinanceOfficer, HealthOfficer, CemeteryDirector, RightHolder], code: 200, input: ["plot_id?", "decedent_id?", "deed_id?", "scheduled_date?", "operational_status?", "limit?", "offset?"], output: "Interment[]", side_effects: [] }
  - { method: POST, path: "/cemetery-mgmt/interments/{interment_id}/open", description: "Open the grave (SCHEDULED->OPENED)", roles: [GroundsForeman], code: 200, input: [], output: Interment, side_effects: ["operational_status=OPENED"] }
  - { method: POST, path: "/cemetery-mgmt/interments/{interment_id}/complete", description: "Close the grave (OPENED->COMPLETED)", roles: [GroundsForeman], code: 200, input: [], output: Interment, side_effects: ["operational_status=COMPLETED"] }
  - { method: POST, path: "/cemetery-mgmt/interments/{interment_id}/cancel", description: "Cancel a scheduled/opened interment", roles: [Registrar], code: 200, input: [], output: Interment, side_effects: ["operational_status=CANCELLED", "Plot.interments_used -1", "service Invoice VOID; billing_status=VOIDED"] }

  # --- DisintermentAuthorization ---
  - { method: POST, path: "/cemetery-mgmt/disinterment-authorizations", description: "Request disinterment of a completed interment", roles: [Registrar], code: 201, input: [interment_id, reason, disinterment_type, "target_plot_id?"], output: DisintermentAuthorization, side_effects: ["status=REQUESTED", "DISINTERMENT Invoice issued (disinterment_invoice_id)"] }
  - { method: GET, path: "/cemetery-mgmt/disinterment-authorizations/{auth_id}", description: "Get a disinterment authorization", roles: [Registrar, HealthOfficer, CemeteryDirector, RightHolder], code: 200, input: [], output: DisintermentAuthorization, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/disinterment-authorizations", description: "List disinterment authorizations (reverse-reach for interment_id/target_plot_id)", roles: [Registrar, HealthOfficer, CemeteryDirector, RightHolder], code: 200, input: ["interment_id?", "target_plot_id?", "status?", "limit?", "offset?"], output: "DisintermentAuthorization[]", side_effects: [] }
  - { method: POST, path: "/cemetery-mgmt/disinterment-authorizations/{auth_id}/record-clearance", description: "Health officer records public-health clearance (branch A)", roles: [HealthOfficer], code: 200, input: [], output: DisintermentAuthorization, side_effects: ["health_cleared=true"] }
  - { method: POST, path: "/cemetery-mgmt/disinterment-authorizations/{auth_id}/record-consent", description: "Next-of-kin (right-holder) records consent (branch B)", roles: [RightHolder], code: 200, input: [], output: DisintermentAuthorization, side_effects: ["nok_consented=true"] }
  - { method: POST, path: "/cemetery-mgmt/disinterment-authorizations/{auth_id}/approve", description: "Director approves (join gate)", roles: [CemeteryDirector], code: 200, input: [], output: DisintermentAuthorization, side_effects: ["status=APPROVED", "approved_by_user_id set"] }
  - { method: POST, path: "/cemetery-mgmt/disinterment-authorizations/{auth_id}/deny", description: "Director denies", roles: [CemeteryDirector], code: 200, input: ["reason?"], output: DisintermentAuthorization, side_effects: ["status=DENIED", "DISINTERMENT invoice VOID"] }
  - { method: POST, path: "/cemetery-mgmt/disinterment-authorizations/{auth_id}/execute", description: "Registrar executes disinterment (cascade)", roles: [Registrar], code: 200, input: [], output: DisintermentAuthorization, side_effects: ["status=EXECUTED", "Interment->DISINTERRED", "settlement disbursed", "INSTALLED marker DECOMMISSIONED"] }

  # --- MarkerPermit ---
  - { method: POST, path: "/cemetery-mgmt/marker-permits", description: "Apply for a foundation/marker permit", roles: [Registrar, RightHolder], code: 201, input: [plot_id, deed_id, marker_type, foundation_length_in, foundation_width_in], output: MarkerPermit, side_effects: ["status=APPLIED", "foundation_fee_cents computed", "MARKER_FOUNDATION Invoice issued (foundation_invoice_id)"] }
  - { method: GET, path: "/cemetery-mgmt/marker-permits/{permit_id}", description: "Get a marker permit", roles: [Registrar, GroundsForeman, FinanceOfficer, CemeteryDirector, RightHolder], code: 200, input: [], output: MarkerPermit, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/marker-permits", description: "List marker permits (reverse-reach for plot_id/deed_id)", roles: [Registrar, GroundsForeman, FinanceOfficer, CemeteryDirector, RightHolder], code: 200, input: ["plot_id?", "deed_id?", "status?", "limit?", "offset?"], output: "MarkerPermit[]", side_effects: [] }
  - { method: POST, path: "/cemetery-mgmt/marker-permits/{permit_id}/approve", description: "Director approves marker permit", roles: [CemeteryDirector], code: 200, input: [], output: MarkerPermit, side_effects: ["status=APPROVED"] }
  - { method: POST, path: "/cemetery-mgmt/marker-permits/{permit_id}/install", description: "Grounds foreman records installation", roles: [GroundsForeman], code: 200, input: [], output: MarkerPermit, side_effects: ["status=INSTALLED"] }
  - { method: POST, path: "/cemetery-mgmt/marker-permits/{permit_id}/reject", description: "Director rejects marker permit", roles: [CemeteryDirector], code: 200, input: ["reason?"], output: MarkerPermit, side_effects: ["status=REJECTED", "invoice VOID"] }

  # --- Invoice / billing ---
  - { method: GET, path: "/cemetery-mgmt/invoices/{invoice_id}", description: "Get an invoice", roles: [Registrar, FinanceOfficer, CemeteryDirector, RightHolder], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/invoices", description: "List invoices (reverse-reach for holder_id)", roles: [Registrar, FinanceOfficer, CemeteryDirector, RightHolder], code: 200, input: ["holder_id?", "subject_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/cemetery-mgmt/invoices/{invoice_id}/void", description: "Void an issued invoice (maker-checker)", roles: [FinanceOfficer], code: 200, input: [], output: Invoice, side_effects: ["status=VOID"] }

  # --- Payment ---
  - { method: POST, path: "/cemetery-mgmt/payments", description: "Record a payment settling an invoice (fires subject cascade)", roles: [FinanceOfficer], code: 201, input: [invoice_id, amount_cents, method], output: Payment, side_effects: ["Invoice->PAID", "subject-specific cascade"] }
  - { method: GET, path: "/cemetery-mgmt/payments/{payment_id}", description: "Get a payment", roles: [Registrar, FinanceOfficer, CemeteryDirector], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/payments", description: "List payments (reverse-reach for invoice_id)", roles: [Registrar, FinanceOfficer, CemeteryDirector], code: 200, input: ["invoice_id?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }

  # --- CareFundEntry / perpetual-care ledger ---
  - { method: POST, path: "/cemetery-mgmt/care-fund-entries", description: "Post a perpetual-care ledger entry", roles: [FinanceOfficer], code: 201, input: [cemetery_id, entry_type, amount_cents, "source_deed_id?", "note?"], output: CareFundEntry, side_effects: ["Cemetery.perpetual_care_fund_balance_cents recomputed", "DISBURSEMENT rejected if it would drive balance < 0"] }
  - { method: GET, path: "/cemetery-mgmt/care-fund-entries/{entry_id}", description: "Get a care-fund entry", roles: [FinanceOfficer, CemeteryDirector], code: 200, input: [], output: CareFundEntry, side_effects: [] }
  - { method: GET, path: "/cemetery-mgmt/care-fund-entries", description: "List care-fund entries (reverse-reach for cemetery_id/source_deed_id)", roles: [FinanceOfficer, CemeteryDirector], code: 200, input: ["cemetery_id?", "source_deed_id?", "entry_type?", "limit?", "offset?"], output: "CareFundEntry[]", side_effects: [] }

  # --- Test-driving logical clock ---
  - { method: POST, path: "/cemetery-mgmt/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z (used before any set); never falls back to wall-clock.", roles: [Registrar, GroundsForeman, FinanceOfficer, HealthOfficer, CemeteryDirector], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set to to_iso8601"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or RightHolder acting on a resource it does not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad enum, negative amount, or scheduled_end <= scheduled_start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced foreign key does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_plot_version does not match current Plot.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits this transition" }
  - { id: ERR_PLOT_NOT_AVAILABLE, http: 409, condition: "Plot is not AVAILABLE for sale/retire" }
  - { id: ERR_PLOT_OCCUPIED, http: 409, condition: "Deed cannot be surrendered while the plot has an active interment" }
  - { id: ERR_DEED_NOT_ISSUED, http: 409, condition: "Operation requires an ISSUED deed on the plot" }
  - { id: ERR_HOLDER_NOT_FOUND, http: 404, condition: "Transfer target holder does not exist" }
  - { id: ERR_NOT_PENDING_HOLDER, http: 403, condition: "Acting holder is not the pending transfer recipient" }
  - { id: ERR_CONSENT_INCOMPLETE, http: 409, condition: "Disinterment approval requires both health clearance and next-of-kin consent" }
  - { id: ERR_ALREADY_RECORDED, http: 409, condition: "Health clearance or consent already recorded" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same X-User-ID may not both approve and execute a disinterment, nor both issue and void an invoice" }
  - { id: ERR_NO_COMPLETED_INTERMENT, http: 409, condition: "Marker cannot be installed before a COMPLETED interment exists on the plot" }
  - { id: ERR_DATE_IN_PAST, http: 422, condition: "scheduled_date is before the current logical-clock date" }
  - { id: ERR_TOO_EARLY_TO_OPEN, http: 422, condition: "Grave opened before its scheduled_date" }
  - { id: ERR_PLOT_CAPACITY, http: 409, condition: "interments_used has reached interment_capacity" }
  - { id: ERR_PLOT_DOUBLE_BOOKED, http: 409, condition: "Plot already has a non-cancelled interment on the same scheduled_date" }
  - { id: ERR_CREW_UNAVAILABLE, http: 409, condition: "Crew time window (with buffer) collides with another interment that day and no free crew remains" }
  - { id: ERR_INVOICE_UNPAID, http: 409, condition: "Required invoice has not been PAID" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 409, condition: "Payment amount_cents does not equal Invoice.total_cents" }
  - { id: ERR_INVOICE_NOT_OPEN, http: 409, condition: "Payment/void attempted on an invoice not in ISSUED state" }
  - { id: ERR_CARE_FUND_INSUFFICIENT, http: 409, condition: "Disbursement would drive the perpetual-care balance below zero" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Records office: plots, holders, decedents, deed sales/transfers/surrenders, interment scheduling, and disinterment request/execute"
    identity: "opaque"
    exclusive_operations:
      - "POST /cemetery-mgmt/plots"
      - "POST /cemetery-mgmt/holders"
      - "POST /cemetery-mgmt/decedents"
      - "POST /cemetery-mgmt/deeds"
      - "POST /cemetery-mgmt/deeds/{deed_id}/transfer"
      - "POST /cemetery-mgmt/deeds/{deed_id}/surrender"
      - "POST /cemetery-mgmt/interments"
      - "POST /cemetery-mgmt/interments/{interment_id}/cancel"
      - "POST /cemetery-mgmt/disinterment-authorizations"
      - "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/execute"
    shared_operations:
      - "POST /cemetery-mgmt/marker-permits (with RightHolder)"
      - "POST /cemetery-mgmt/_clock/set_current_utc"
      - "GET reads"
  - name: GroundsForeman
    description: "Field crew: opens/closes graves and installs markers"
    identity: "opaque"
    exclusive_operations:
      - "POST /cemetery-mgmt/interments/{interment_id}/open"
      - "POST /cemetery-mgmt/interments/{interment_id}/complete"
      - "POST /cemetery-mgmt/marker-permits/{permit_id}/install"
    shared_operations: ["GET reads", "POST /cemetery-mgmt/_clock/set_current_utc"]
  - name: FinanceOfficer
    description: "Billing: payments, invoice voids (maker-checker), and perpetual-care ledger"
    identity: "opaque"
    exclusive_operations:
      - "POST /cemetery-mgmt/payments"
      - "POST /cemetery-mgmt/invoices/{invoice_id}/void"
      - "POST /cemetery-mgmt/care-fund-entries"
    shared_operations: ["GET reads", "POST /cemetery-mgmt/_clock/set_current_utc"]
  - name: HealthOfficer
    description: "Public-health authority: records disinterment clearance"
    identity: "opaque"
    exclusive_operations:
      - "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/record-clearance"
    shared_operations: ["GET reads", "POST /cemetery-mgmt/_clock/set_current_utc"]
  - name: CemeteryDirector
    description: "Approving authority: cemeteries, plot retirement, marker & disinterment approve/deny"
    identity: "opaque"
    exclusive_operations:
      - "POST /cemetery-mgmt/cemeteries"
      - "POST /cemetery-mgmt/plots/{plot_id}/retire"
      - "POST /cemetery-mgmt/marker-permits/{permit_id}/approve"
      - "POST /cemetery-mgmt/marker-permits/{permit_id}/reject"
      - "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/approve"
      - "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/deny"
    shared_operations: ["GET reads", "POST /cemetery-mgmt/_clock/set_current_utc"]
  - name: RightHolder
    description: "Interment-right holder acting on OWN deeds/markers/disinterments (X-User-ID == RightHolder.id)"
    identity: "entity_backed:RightHolder"
    exclusive_operations:
      - "POST /cemetery-mgmt/deeds/{deed_id}/accept-transfer (as pending_new_holder_id)"
      - "POST /cemetery-mgmt/disinterment-authorizations/{auth_id}/record-consent (own interment's deed holder)"
    shared_operations:
      - "POST /cemetery-mgmt/marker-permits (with Registrar; must own the deed)"
      - "GET reads of own resources"
