            - call: "POST /programs/pg_does_not_exist/go-to-market"
              payload: {}
              as: BrokerPlacementLead
              captures: { e_missing: $.data.error_id }
            - call: "POST /programs/${prog_id}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
              captures: { e_state: $.data.error_id }
          assert:
            - "${e_shape} == ERR_VALIDATION with HTTP 400 — the type error is reported ahead of the unknown cedent_id"
            - "${e_missing} == ERR_PROGRAM_NOT_FOUND with HTTP 404"
            - "${e_state} == ERR_PROGRAM_STATE_INVALID with HTTP 409, not ERR_CEDENT_SUSPENDED"
