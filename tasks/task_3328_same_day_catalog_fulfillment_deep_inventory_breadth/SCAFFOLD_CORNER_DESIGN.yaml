      - name: long_tail_supplier_below_its_commitment_is_red_flagged
        claim_type: Violation to Error
        grounds:
          - errors.ERR_SUPPLIER_CANDIDATE_EMPTY
          - calculations.supplier_selector
          - entities.Supplier.fields.min_stock_commitment_units
        distinguishing_aspect: "The supplier selector's fallback fires on the eligibility filter, and it is the REPORTED units that decide it: a report of 40 units against a 50-unit commitment both records the breach and empties the candidate set, so the call answers 409 ERR_SUPPLIER_CANDIDATE_EMPTY while the supplier's rating drops to 90."
