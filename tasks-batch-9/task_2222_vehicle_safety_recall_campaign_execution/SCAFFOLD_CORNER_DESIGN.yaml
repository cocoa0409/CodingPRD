            - "response.data.stop_sale_flag == true and response.data.do_not_drive_flag == true"
            - "response.data.remedy_status == \"REMEDY_UNDER_DEVELOPMENT\""
            - "GET /vehicles/${veh1_id} shows stop_sale_hold == true and sale_status == \"IN_DEALER_STOCK\""

      - name: mailing_a_wave_that_was_never_released_returns_wave_invalid_state
        claim_type: invalid_transitions
        grounds:
          - validations[priority=16]
          - errors[ERR_WAVE_INVALID_STATE]
          - state_machines.NotificationWave.RELEASE_APPROVED_to_MAILED
        distinguishing_aspect: |
          MAILED is only reachable from RELEASE_APPROVED. The wave's scheduled_mail_date is today, so
          the temporal gate at priority 33 is satisfied and the rejection can only come from the
          state gate at priority 16 (409 ERR_WAVE_INVALID_STATE), leaving the wave PLANNED.
        test_recipe:
          setup:
            - "Campaign 26V-203 is FILED and carries one PLANNED REMEDY wave for NE scheduled 2026-08-03; release has not been called."
          setup_api_calls:
