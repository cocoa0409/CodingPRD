  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: seat_limit_max_seats_exactly_allowed_plus_one_rejected
        grounds:
          - calculations.seat_count_check
          - errors.ERR_SEAT_LIMIT_REACHED
          - endpoints.POST_/companies/{id}/users
        distinguishing_aspect: |
          Metric: seat count vs max_seats. Boundary uses strict > on
          (occupied + 1) — at exactly max_seats occupied, the add succeeds;
          at max_seats + 1, ERR_SEAT_LIMIT_REACHED.
        test_recipe:
          setup:
            - "Plan ESSENTIALS max_seats=3. Company N with subscription."
          setup_api_calls:
            - *k_clock
            - &k_plan_ess
              call: "POST /api/plans"
              payload: { plan_code: "ESSENTIALS", list_price_cents: 5000, max_seats: 3, feature_inventory: false, feature_project_profitability: false, feature_multi_currency: true, feature_bank_rules: true, plan_rank: 2 }
              as: PlatformAdmin
              captures: { plan_ess_id: $.data.id }
            - &k_company_n
              call: "POST /api/companies"
              payload: { legal_name: "Nu Corp", admin_email: "n@n.example", home_country: "US", data_region: "US", plan_id: "${plan_ess_id}" }
              as: PlatformAdmin
              captures: { company_n_id: $.data.id }
            - &k_company_n_admin
              call: "POST /api/companies/${company_n_id}/users"
              payload: { company_id: "${company_n_id}", email: "admin@n.example", display_name: "N Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_n_admin_id: $.data.id }
            - call: "POST /api/companies/${company_n_id}/users/${company_n_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_n_admin_id}"
            - call: "POST /api/companies/${company_n_id}/users"
              payload: { company_id: "${company_n_id}", email: "u2@n.example", display_name: "User Two", permission_level: "STANDARD" }
              as: CompanyUser
              as_user_id: "${company_n_admin_id}"
              captures: { u2_id: $.data.id }
            - call: "POST /api/companies/${company_n_id}/users"
              payload: { company_id: "${company_n_id}", email: "u3@n.example", display_name: "User Three", permission_level: "STANDARD" }
              as: CompanyUser
              as_user_id: "${company_n_admin_id}"
              captures: { u3_id: $.data.id }
          trigger:
            # occupied is now 3 (admin ACTIVE + u2 INVITED + u3 INVITED). Adding a 4th
            # is the boundary: occupied+1 = 4 > max_seats=3, must reject.
            - call: "POST /api/companies/${company_n_id}/users"
              payload: { company_id: "${company_n_id}", email: "u4@n.example", display_name: "User Four", permission_level: "STANDARD" }
              as: CompanyUser
              as_user_id: "${company_n_admin_id}"
              captures: { err_seat: $.data.error_id }
          assert:
            - "the response status is 400"
            - "err_seat == ERR_SEAT_LIMIT_REACHED (boundary: 4 > 3, rejected)"
            - "after rejection, GET /companies/${company_n_id}/subscription returns pending_upgrade_prompt == true"
            - "exactly 3 CompanyUsers exist for company N (the 4th was not created)"

      - name: recon_difference_zero_exactly_required
        grounds:
          - calculations.reconciliation_difference
          - state_machines.Reconciliation.transitions.IN_PROGRESS_to_COMPLETED
          - errors.ERR_RECON_DIFFERENCE_NOT_ZERO
        distinguishing_aspect: |
          Metric: difference_cents vs 0. Boundary: complete is allowed only
          when difference_cents == 0 exactly. 1 cent off (positive or
          negative) rejects. Empty set / zero-count edge — different metric
          and endpoint than seat limit.
        test_recipe:
          setup:
            - "Company O with bank connection and a categorized txn of -1000 cents in window. Statement ending balance -1000 makes difference == 0; ending balance -999 makes difference == -1 (reject)."
          setup_api_calls:
            - *k_clock
            - *k_plan_plus
            - &k_company_o
              call: "POST /api/companies"
              payload: { legal_name: "Omicron Corp", admin_email: "o@o.example", home_country: "US", data_region: "US", plan_id: "${plan_plus_id}" }
              as: PlatformAdmin
              captures: { company_o_id: $.data.id }
            - &k_company_o_admin
              call: "POST /api/companies/${company_o_id}/users"
              payload: { company_id: "${company_o_id}", email: "admin@o.example", display_name: "O Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_o_admin_id: $.data.id }
            - call: "POST /api/companies/${company_o_id}/users/${company_o_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_o_admin_id}"
            - call: "POST /api/companies/${company_o_id}/subscription/activate"
              payload: { payment_method_token: "pm_card_visa" }
              as: CompanyUser
              as_user_id: "${company_o_admin_id}"
            - &k_bc_o
              call: "POST /api/companies/${company_o_id}/bank_connections"
              payload: { company_id: "${company_o_id}", institution_name: "Citi", external_account_mask: "5555", consent_expires_at: "2027-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_o_admin_id}"
              captures: { bc_o_id: $.data.id }
            - call: "POST /api/companies/${company_o_id}/bank_connections/${bc_o_id}/authorize"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_o_admin_id}"
            - &k_cat_o
              call: "POST /api/companies/${company_o_id}/categories"
              payload: { company_id: "${company_o_id}", name: "Misc", tax_line: "SCH-C-L27" }
              as: CompanyUser
              as_user_id: "${company_o_admin_id}"
              captures: { cat_o_id: $.data.id }
            - &k_txn_o
              call: "POST /api/companies/${company_o_id}/bank_connections/${bc_o_id}/transactions"
              payload: { posted_at: "2026-09-10T00:00:00Z", amount_cents: -1000, payee_raw: "STAPLES" }
              as: PlatformAdmin
              captures: { txn_o_id: $.data.id }
            - call: "POST /api/companies/${company_o_id}/bank_transactions/${txn_o_id}/categorize"
              payload: { category_id: "${cat_o_id}" }
              as: CompanyUser
              as_user_id: "${company_o_admin_id}"
          trigger:
            # First recon with ending balance -999 — difference == -1, must fail
            - call: "POST /api/companies/${company_o_id}/reconciliations"
              payload: { company_id: "${company_o_id}", bank_connection_id: "${bc_o_id}", statement_period_start: "2026-09-01T00:00:00Z", statement_period_end: "2026-09-30T00:00:00Z", statement_ending_balance_cents: -999 }
              as: CompanyUser
              as_user_id: "${company_o_admin_id}"
              captures: { recon_o1_id: $.data.id }
            - call: "POST /api/companies/${company_o_id}/reconciliations/${recon_o1_id}/start"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_o_admin_id}"
            - call: "POST /api/companies/${company_o_id}/reconciliations/${recon_o1_id}/complete"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_o_admin_id}"
              captures: { err_recon: $.data.error_id }
          assert:
            - "the response status is 400"
            - "err_recon == ERR_RECON_DIFFERENCE_NOT_ZERO (difference == -1, one cent off, rejected)"
            - "Reconciliation.${recon_o1_id}.recon_status == IN_PROGRESS (state unchanged on failure)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: recon_start_blocked_by_bank_connection_stale
        grounds:
          - state_machines.Reconciliation
          - state_machines.BankConnection
          - entities.Reconciliation.fields.bank_connection_id
        distinguishing_aspect: |
          Pair: Reconciliation depends on BankConnection. Reconciliation start
          on a STALE (or REVOKED) BankConnection is rejected — the txn-flow
          precondition is upstream on a different entity.
        test_recipe:
          setup:
            - "Company P with bank connection driven to STALE via consent expiry."
          setup_api_calls:
            - *k_clock
            - *k_plan_plus
            - &k_company_p
              call: "POST /api/companies"
              payload: { legal_name: "Pi Corp", admin_email: "p@p.example", home_country: "US", data_region: "US", plan_id: "${plan_plus_id}" }
              as: PlatformAdmin
              captures: { company_p_id: $.data.id }
            - &k_company_p_admin
              call: "POST /api/companies/${company_p_id}/users"
              payload: { company_id: "${company_p_id}", email: "admin@p.example", display_name: "P Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_p_admin_id: $.data.id }
