        grounds:
          - errors.ERR_VENUE_SLOT_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / venue_slot_half_open_adjacency_allowed
          rationale: "Asserted as the failure path of the named §1.8 instance."

