            - "${sum_p} == 84.63 and ${prov} == 83.13: the score used M1's 0.40 / 0.25 / 0.20 / 0.15 weights. Under the only ADOPTED version, M2, the four terms would have been 23.56 + 21.88 + 20.00 + 20.63 == 86.07, so any implementation that resolved weights by current adoption is caught by a 1.44-point gap in the weighted sum alone"
            - "${e_new_on_retired} == ERR_METHODOLOGY_NOT_ADOPTED with HTTP 409: the same version id that legally governs ${c1} cannot start a new cycle, because priority 12 reads the version's CURRENT status while scoring reads the cycle's pin"
            - "${sum_f} == 84.63 and ${final} == 83.13 with ${pin_after} == ${m1}: the final variant at publication re-reads the pin rather than the catalogue"
            - "${pub_label} == M1 and ${pub_score} == 83.13: the public record names the retired methodology that actually judged this charity, which is the disclosure the whole pinning layer exists to protect"
      - name: dual_variant_composite_and_credibility_both_diverge
        claim_type: dual_variant_calculation
        grounds:
          - calculations.composite_score_with_penalty
          - calculations.complaint_credibility_score
          - entities.RatingCycle.fields.provisional_composite_score
          - entities.RatingCycle.fields.final_composite_score
          - entities.Complaint.fields.credibility_score
        excluded_because:
          difficulty_instance: provisional_vs_final_composite_diverge_on_zero_completeness_impact
          rationale: |
            §1.8's dual_variant_calc rule already carries both variant pairs declared
            in §1.3 and covers every claim this row asks for. Its first instance drives
            composite_score_with_penalty through variant divergence (provisional 70.88
            grade NEEDS_IMPROVEMENT against final 83.38 grade MEETS_STANDARDS on the
            same DimensionScore rows, the delta caused solely by renormalising away an
            evidence-free IMPACT dimension), variant selection (provisional at score
            time, final at publication) and reconciliation (the PublicationRecord
            copying the final figure while the cycle retains both). Its second
            instance does the same for complaint_credibility across INTAKE and
            INVESTIGATED, where the divergence crosses a severity tier and changes the
            penalty ceiling. A corner instance here could only restate them with
            different literals.
      - name: cascading_side_effects_chains_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Complaint.INVESTIGATING_to_SUBSTANTIATED
          - state_machines.Appeal.PANEL_ASSIGNED_to_GRANTED
          - state_machines.RatingCycle.ORG_REVIEW_to_PUBLISHED
          - state_machines.MethodologyVersion.COMMENT_CLOSED_to_ADOPTED
        excluded_because:
          difficulty_instance: substantiated_complaint_four_hop_accountability_cascade
          rationale: |
            §1.8's transitive_cascade rule covers this layer at greater depth than a
            corner instance would: one instance walks the four-hop chain from a
            substantiated Complaint through the cycle's penalty ledger, the
            re-scored DimensionScore rows and the Organization roll-up, and the
            second walks the four-hop filing substitution a granted Appeal causes,
            each asserting hop ordering and the untouched state of every row outside
            the cascade's selected set. The remaining cascade in §1.2 - the
            three-hop publication chain and the three-hop adoption chain with its
            conditional transition grants - are already asserted call-by-call in the
            calculations section of this file, including the negative population
            (an organization with no PublicationRecord receives no grant, and
            PUBLISHED or WITHDRAWN cycles are skipped by hop 3).

  - section: errors
    instances:
      - name: err_methodology_window_conflict_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_METHODOLOGY_WINDOW_CONFLICT
          - state_machines.MethodologyVersion.COMMENT_CLOSED_to_ADOPTED
          - endpoints.POST_/methodology-versions/{methodology_version_id}/adopt
        excluded_because:
          difficulty_instance: methodology_effectivity_closed_interval_with_thirty_day_buffer
          rationale: |
            §1.8's resource_temporal_overlap instance already drives this code from
            both sides of the buffer: it adopts a successor whose effective_from is
            one day short of the retiring version's effective_until plus
            METHODOLOGY_BUFFER_DAYS and gets ERR_METHODOLOGY_WINDOW_CONFLICT, then
            re-adopts at exactly the buffer boundary and succeeds, with the retired
            row's effective_until asserted afterwards. A corner instance would need
            the identical eight-call methodology chain to say the same thing.
      - name: err_cycle_period_overlap_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_CYCLE_PERIOD_OVERLAP
          - validations[priority=17]
          - endpoints.POST_/rating-cycles
        excluded_because:
          difficulty_instance: rating_cycle_period_half_open_adjacency_allowed
          rationale: |
            §1.8's resource_temporal_overlap instance covers the whole boundary
            family for this code - a one-second intrusion into an existing cycle's
            interval is refused with ERR_CYCLE_PERIOD_OVERLAP, exact adjacency
            (period_start == the neighbour's period_end) is admitted because the
            interval is half-open, and the same overlapping window is admitted for a
            different organization to prove the constraint is per-organization. The
            corner walk adds nothing.
      - name: err_no_validated_filing_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_NO_VALIDATED_FILING
          - validations[priority=18]
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/score
        excluded_because:
          difficulty_instance: wrong_analyst_outranks_missing_validated_filing_on_score
          rationale: |
            §1.8's priority_pair_validation_conflict instance triggers this code as
            the lower-priority half of its pair: a cycle whose only filing is
            REJECTED is scored by the assigned analyst and answers
            ERR_NO_VALIDATED_FILING, after the same request from the wrong analyst
            answered ERR_NOT_ASSIGNED_ANALYST. Both the trigger and the ordering are
            therefore already asserted with literals.
      - name: err_data_completeness_too_low_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_DATA_COMPLETENESS_TOO_LOW
          - calculations.dimension_data_completeness
          - state_machines.RatingCycle.ORG_REVIEW_to_PUBLISHED
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/publish
        excluded_because:
          difficulty_instance: completeness_gate_outranks_publish_window_state_check
          rationale: |
            §1.8's priority_pair_validation_conflict instance publishes a cycle whose
            data_completeness_pct is below the 60.00 floor while the correction
            window is also still open, and asserts ERR_DATA_COMPLETENESS_TOO_LOW is
            returned in preference to ERR_CYCLE_NOT_PUBLISHABLE, then re-publishes
            after a filing lifts completeness over the floor. The code's trigger,
            its boundary and its precedence are all covered there.

  - section: consistency_model
    instances:
      - name: every_cascade_is_readable_the_instant_its_own_response_returns
        claim_type: immediate
        grounds:
          - state_machines.RatingCycle.DATA_COLLECTION_to_SCORED
          - state_machines.RatingCycle.ORG_REVIEW_to_PUBLISHED
          - entities.Organization.fields.latest_published_score
          - entities.Organization.fields.published_cycle_count
          - entities.Organization.fields.trend_direction
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/score
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/publish
          - endpoints.GET_/rating-cycles/{id}/dimension-scores
          - endpoints.GET_/governance-profiles/{id}/standard-evaluations
          - endpoints.GET_/publication-records
          - endpoints.GET_/organizations/{organization_id}/rating-trend
        distinguishing_aspect: |
          The declared consistency model is immediate, which is a stronger promise
          than "the write eventually lands": every derived value a cascade touches -
          rows created two hops away, roll-up counters on a different entity, the
          public trend read - must already be correct in the response that caused
          them and in any read issued immediately afterwards, with no sweep, no
          background job and no recomputation on read. This instance takes the two
          widest cascades in the scaffold and compares the value carried in the
          write's own response body against the value a separate read returns one
          call later, in both directions: the write response may not be optimistic
          about state that is not yet stored, and the read may not be stale about
          state the write already reported.
        test_recipe:
          setup:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "AUDITED_STATEMENT", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, joint_cost_allocated_cents: 500000, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2025: $.data.id }
            - call: "GET /organizations/${org1}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { org1_v2: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2024, source_kind: "AUDITED_STATEMENT", total_expense_cents: 6000000, program_expense_cents: 4500000, fundraising_expense_cents: 1000000, admin_expense_cents: 500000, contributions_cents: 5000000, total_revenue_cents: 6500000, net_assets_cents: 3000000, total_liabilities_cents: 1000000, expected_organization_version: "${org1_v2}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2024: $.data.id }
            - call: "GET /organizations/${org1}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { org1_v3: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2023, source_kind: "AUDITED_STATEMENT", total_expense_cents: 4000000, program_expense_cents: 2800000, fundraising_expense_cents: 900000, admin_expense_cents: 300000, contributions_cents: 3000000, total_revenue_cents: 4200000, net_assets_cents: 2000000, total_liabilities_cents: 800000, expected_organization_version: "${org1_v3}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2023: $.data.id }
            - call: "POST /filing-records/${f2025}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /filing-records/${f2024}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /filing-records/${f2023}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c1: $.data.id }
            - call: "POST /governance-profiles"
              payload: { rating_cycle_id: "${c1}", board_member_count: 7, independent_board_member_count: 4, conflict_of_interest_policy_on_file: true, coi_policy_reviewed_at: "2026-03-01T00:00:00Z", board_meetings_last_year: 4, audit_committee_exists: true, whistleblower_policy: true, ceo_compensation_reviewed: false, impact_report_on_file: true, outcome_measures_count: 3, third_party_evaluation_on_file: true }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { g1: $.data.id }
            - call: "POST /governance-profiles/${g1}/evaluate"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /rating-cycles/${c1}/score"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { w_prov: $.data.provisional_composite_score, w_ratio: $.data.program_expense_ratio, w_completeness: $.data.data_completeness_pct, w_failed: $.data.failed_standard_count, w_status: $.data.status }
            - call: "GET /rating-cycles/${c1}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { r_prov: $.data.provisional_composite_score, r_ratio: $.data.program_expense_ratio, r_completeness: $.data.data_completeness_pct, r_failed: $.data.failed_standard_count, r_status: $.data.status }
            - call: "GET /rating-cycles/${c1}/dimension-scores"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { first_dim_status: "$.data[0].status" }
            - call: "GET /governance-profiles/${g1}/standard-evaluations"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { first_std: "$.data[0].id" }
            - call: "POST /rating-cycles/${c1}/open-org-review"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /rating-cycles/${c1}/publish"
              payload: { publishing_reviewer_note: "immediate visibility check" }
              as: PublishingReviewer
              as_user_id: "reviewer-1"
              captures: { w_final: $.data.final_composite_score, w_grade: $.data.grade, w_published_at: $.data.published_at }
            - call: "GET /organizations/${org1}"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { o_latest: $.data.latest_published_score, o_count: $.data.published_cycle_count, o_trend: $.data.trend_direction }
            - call: "GET /publication-records?organization_id=${org1}"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { pr_score: "$.data[0].published_score", pr_seq: "$.data[0].sequence_number", pr_dir: "$.data[0].change_direction" }
            - call: "GET /organizations/${org1}/rating-trend"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { t_latest: $.data.latest_published_score, t_count: $.data.published_cycle_count }
          assert:
            - "${w_prov} == ${r_prov} == 83.13, ${w_ratio} == ${r_ratio} == 0.7500, ${w_completeness} == ${r_completeness} == 100.00, ${w_failed} == ${r_failed} == 1 and ${w_status} == ${r_status} == SCORED: the scoring response and the read that follows it agree field for field, so nothing was computed on the fly for the response and left unsaved"
            - "${first_dim_status} == COMPUTED and ${first_std} is present: the four DimensionScore rows and every StandardEvaluation row created as side effects of the same score call are already listable in the very next request, with no sweep endpoint invoked between them"
            - "${w_final} == 83.13 and ${w_grade} == MEETS_STANDARDS are present in the publish response itself, not null pending a later reconciliation"
            - "${o_latest} == 83.13, ${o_count} == 1 and ${o_trend} == NOT_APPLICABLE: the Organization roll-up that hop 3 of the publication cascade maintains is already correct on the first read after publish, so the denormalised fields do not lag"
            - "${pr_score} == 83.13, ${pr_seq} == 1 and ${pr_dir} == FIRST_PUBLICATION: the PublicationRecord that hop 2 appended is immediately visible to an unrelated PublicUser reader, which is the externally observable half of immediate consistency"
            - "${t_latest} == ${o_latest} == ${pr_score} and ${t_count} == ${o_count} == 1: the computed read, the stored roll-up and the ledger row are mutually consistent at the same instant, so no reader can observe a partially applied cascade"
            - "${w_published_at} == 2026-09-22T00:00:00Z, identical to the logical clock at the moment of the call - the publication instant comes from the clock rather than from a deferred worker"
