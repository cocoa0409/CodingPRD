      - name: payer_impact_forward_projected_scales_units_and_applies_all_three_reimbursement_methods
        claim_type: variant_selection
        grounds:
          - calculations.payer_impact_delta.variants.FORWARD_PROJECTED
          - endpoints[POST /chargemaster/price-change-analyses]
        distinguishing_aspect: "Units are round_half_up(trailing_units * 10500 / 10000) so 50 -> 53 (52.5 rounds up) and 10 -> 11; per-unit reimbursement is rounded BEFORE multiplying. LESSER_OF_FEE_SCHEDULE caps the new side at the 200000 fee schedule (delta 2968000), PERCENT_OF_CHARGE scales freely (delta 18900000), CASE_RATE is charge-independent (delta 0) and a zero-trailing-units payer still emits a units=0 line. The EXPIRED CIGNA term is excluded entirely, so the total is 21868000 across exactly four lines ordered by payer_code."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility NEAREST_CENT keeping the default volume_growth_bp 10500 and the default 40000 bp markup limit."
            - "Item CDM-1001 driven to ACTIVE at gross 240000 (cost 100000, medicare 50000, market_p75 900000)."
