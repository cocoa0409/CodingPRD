          - errors[ERR_REFUND_IN_FLIGHT]
          - state_machines.CustomerComplaint.transitions.TRIAGED_to_CLOSED
        distinguishing_aspect: "The two parallel dimensions of a complaint interlock in one direction only: the workflow state may not reach CLOSED while refund_state is REQUESTED, so the same close call is a 409 before the refund decision and a 200 after a DENY. This proves the guard reads the refund dimension rather than the workflow dimension it is transitioning."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T12:00:00Z."
