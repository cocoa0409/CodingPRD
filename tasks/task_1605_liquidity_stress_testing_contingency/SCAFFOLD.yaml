  - method: GET
    path: "/liquidity/contingency-playbooks/{id}/actions"
    description: "List actions of a playbook (FK reverse-reachability)"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["limit?", "offset?"]
    output: PlaybookAction[]
    side_effects: []

  - method: GET
    path: "/liquidity/playbook-actions/{id}"
    description: "Get a PlaybookAction"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: []
    output: PlaybookAction
    side_effects: []

  - method: GET
    path: "/liquidity/playbook-actions"
