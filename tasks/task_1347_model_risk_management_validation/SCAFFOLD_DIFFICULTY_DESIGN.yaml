            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "HIGH" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "psi", direction: "ABOVE_IS_BREACH", threshold_value: 0.25 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_id: $.data.id }
            - call: "POST /mrm/monitoring-metrics/${met_id}/readings"
              payload: { value: 0.30, observed_at: "2026-08-02T00:00:00Z" }
              as: ModelOwner
              as_user_id: u_own_a
            - call: "POST /mrm/monitoring-metrics/${met_id}/readings"
              payload: { value: 0.31, observed_at: "2026-08-03T00:00:00Z" }
              as: ModelOwner
              as_user_id: u_own_a
          trigger:
            - call: "POST /mrm/monitoring-metrics/${met_id}/readings"
              payload: { value: 0.32, observed_at: "2026-08-04T00:00:00Z" }
              as: ModelOwner
              as_user_id: u_own_a
          assert:
            - "MonitoringMetric.${met_id}.consecutive_breach_count == 3 (hop 1: third BreachEvent OPEN created)"
            - "Model.${m_id}.monitoring_posture == BREACHED (hop 1)"
            - "GET /mrm/models/${m_id}/findings returns exactly 1 finding: source MONITORING, severity HIGH, status OPEN, title 'AUTO: 3 consecutive breaches on psi' (hop 2)"
            - "Auto-finding remediation_due_at == 2026-08-26T00:00:00Z (created at logical time 2026-08-01; round(30*1.0) - 5 = 25 days)"
            - "Model.${m_id}.open_findings_count == 1 and Model.${m_id}.risk_score == 90 (85 + 5 HIGH penalty — hop 3 recompute)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: engagement_create_state_beats_window_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_MODEL_ALREADY_RETIRED]
          - errors[ERR_VALIDATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair = state vs business_constraint: one request
          violating BOTH (target model RETIRED and review window overlapping
          an existing engagement) must surface ERR_MODEL_ALREADY_RETIRED
          (priority 6), never ERR_VALIDATION_WINDOW_OVERLAP (priority 10).
        test_recipe:
          setup:
            - "Model A: APPROVED doc, COMPLETED engagement over [2026-08-02, 2026-08-10), approved for use, then RETIRED with replacement B"
            - "Model B: fully approved replacement (own doc + completed engagement)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Retiree A", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { a_id: $.data.id }
            - call: "POST /mrm/models/${a_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { a_doc: $.data.id }
            - call: "POST /mrm/models/${a_id}/documentations/${a_doc}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${a_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-02T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { a_eng: $.data.id }
            - call: "POST /mrm/validation-engagements/${a_eng}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${a_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models"
              payload: { name: "Replacement B", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { b_id: $.data.id }
            - call: "POST /mrm/models/${b_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { b_doc: $.data.id }
            - call: "POST /mrm/models/${b_id}/documentations/${b_doc}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${b_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-02T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { b_eng: $.data.id }
            - call: "POST /mrm/validation-engagements/${b_eng}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${b_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${a_id}/retire"
              payload: { replacement_model_id: "${b_id}" }
              as: ModelRiskOfficer
              as_user_id: u_cro
          trigger:
            - call: "POST /mrm/models/${a_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: false, period_start: "2026-08-05T00:00:00Z", period_end: "2026-08-15T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_MODEL_ALREADY_RETIRED — NOT ERR_VALIDATION_WINDOW_OVERLAP, even though [2026-08-05, 2026-08-15) also overlaps the existing engagement"

      - name: approve_vendor_gate_beats_validation_overdue
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_VENDOR_ASSESSMENT_NOT_CURRENT]
          - errors[ERR_VALIDATION_OVERDUE]
        distinguishing_aspect: |
          Error-category pair = business_safety vs business_temporal
          (different pair than state-vs-constraint): an approval violating
          BOTH the vendor-transparency gate and the validation-currency gate
          must surface ERR_VENDOR_ASSESSMENT_NOT_CURRENT (priority 7), never
          ERR_VALIDATION_OVERDUE (priority 8).
        test_recipe:
          setup:
            - "Vendor model V (is_vendor_model true; HIGH/SINGLE_DESK/100 → 70, TIER_1), APPROVED doc, engagement completed at 2026-08-01 with assessed HIGH (score 85, still TIER_1) → validation_due_at = 2027-02-01 (6 months)"
            - "Vendor assessment created 2026-08-01, completeness 80, valid_months 1 → valid_until 2026-09-01"
            - "Clock at 2027-03-01: assessment EXPIRED (2027-03-01 > 2026-09-01) AND validation overdue (2027-03-01 > 2027-02-01) — both gates fail"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Vendor V", business_unit: "Trading", declared_complexity: "HIGH", usage_scope: "SINGLE_DESK", exposure_amount: 100, is_vendor_model: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { v_id: $.data.id }
            - call: "POST /mrm/models/${v_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { v_doc: $.data.id }
            - call: "POST /mrm/models/${v_id}/documentations/${v_doc}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${v_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { v_eng: $.data.id }
            - call: "POST /mrm/validation-engagements/${v_eng}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "HIGH" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${v_id}/vendor-assessments"
              payload: { completeness_score: 80, valid_months: 1 }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mrm/models/${v_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { err: $.data.error_id }
          assert:
            - "VendorTransparencyAssessment on ${v_id} is EXPIRED at trigger time"
            - "captured ${err} == ERR_VENDOR_ASSESSMENT_NOT_CURRENT (business_safety, priority 7) — NOT ERR_VALIDATION_OVERDUE (business_temporal, priority 8), even though both conditions hold"
            - "Model.${v_id}.status == REGISTERED (unchanged)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: reading_exactly_at_threshold_is_not_a_breach
        grounds:
          - calculations.consecutive_breach_escalation
          - entities.MetricReading.fields.is_breach
        distinguishing_aspect: |
          Metric = numeric monitoring value; endpoint = POST
          /mrm/monitoring-metrics/{id}/readings. STRICT comparison: value ==
          threshold is not a breach, one ulp above is.
        test_recipe:
          setup:
            - "Approved model M (LOW/SINGLE_DESK/100 → 30, TIER_3) with ACTIVE metric psi (ABOVE_IS_BREACH, threshold 0.25)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Boundary M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "psi", direction: "ABOVE_IS_BREACH", threshold_value: 0.25 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_id: $.data.id }
          trigger:
            - call: "POST /mrm/monitoring-metrics/${met_id}/readings"
              payload: { value: 0.25, observed_at: "2026-08-02T00:00:00Z" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { r_breach: $.data.is_breach }
            - call: "POST /mrm/monitoring-metrics/${met_id}/readings"
              payload: { value: 0.250001, observed_at: "2026-08-03T00:00:00Z" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { r_breach2: $.data.is_breach }
          assert:
            - "captured ${r_breach} == false (equality is NOT a breach under strict >)"
            - "GET /mrm/monitoring-metrics/${met_id}/breach-events after the first reading: empty list, and consecutive_breach_count == 0"
            - "captured ${r_breach2} == true (0.250001 > 0.25)"
            - "After the second reading: MonitoringMetric.${met_id}.consecutive_breach_count == 1"

      - name: risk_score_exactly_70_lands_tier_1
        grounds:
          - calculations.model_risk_score
          - entities.Model.fields.risk_tier
        distinguishing_aspect: |
          Metric = composite risk score; endpoint = POST /mrm/models. The tier
          boundary is INCLUSIVE: score == 70 lands TIER_1 (>= 70), score 60
          lands TIER_2 — a different metric and endpoint than the reading
          threshold rule, with the opposite inclusivity direction.
        test_recipe:
          setup:
            - "Two registrations at default clock, no findings"
            - "M70: MEDIUM (2) + MULTI_DESK (1) + exposure 500000 (points 1) → 40 + 10 + 10 = 70"
            - "M60: MEDIUM (2) + MULTI_DESK (1) + exposure 500000 (points 1) → 40 + 10 + 10 = 60 (below-side bracket)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Boundary 70", business_unit: "Risk", declared_complexity: "MEDIUM", usage_scope: "MULTI_DESK", exposure_amount: 500000 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m70_score: $.data.risk_score, m70_tier: $.data.risk_tier }
            - call: "POST /mrm/models"
              payload: { name: "Boundary 60", business_unit: "Risk", declared_complexity: "MEDIUM", usage_scope: "MULTI_DESK", exposure_amount: 500000 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m60_score: $.data.risk_score, m60_tier: $.data.risk_tier }
          trigger:
            - call: "GET /mrm/models"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
          assert:
            - "captured ${m70_score} == 70 AND captured ${m70_tier} == TIER_1 (boundary >= 70 is inclusive)"
            - "captured ${m60_score} == 60 AND captured ${m60_tier} == TIER_2 (below the boundary)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_requires_completed_engagement_on_model
        grounds:
          - state_machines.Model.REGISTERED_to_APPROVED_FOR_USE
          - errors[ERR_NO_COMPLETED_VALIDATION]
        distinguishing_aspect: |
          Entity pair = Model → ValidationEngagement: REGISTERED →
          APPROVED_FOR_USE is gated on another entity's state (a COMPLETED
          engagement with outcome != INEFFECTIVE); an INEFFECTIVE completion
          leaves the gate shut.
        test_recipe:
          setup:
            - "Model M (LOW/SINGLE_DESK/100 → 30, TIER_3) with APPROVED documentation"
            - "Engagement E completed with outcome INEFFECTIVE"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Gated M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: false, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "INEFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
          trigger:
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_NO_COMPLETED_VALIDATION (INEFFECTIVE does not satisfy the gate)"
            - "Model.${m_id}.status == REGISTERED (unchanged)"

      - name: retire_requires_replacement_model_approved
        grounds:
          - state_machines.Model.APPROVED_FOR_USE_to_RETIRED
          - errors[ERR_REPLACEMENT_MODEL_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair = Model → Model (self-referential; different pair than
          Model → ValidationEngagement): retirement is gated on the state of
          a SECOND model instance, which must be APPROVED_FOR_USE.
        test_recipe:
          setup:
            - "Model A fully approved for use (LOW/SINGLE_DESK/100)"
            - "Model B merely REGISTERED (no documentation, no validation)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Retire A", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { a_id: $.data.id }
            - call: "POST /mrm/models/${a_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { a_doc: $.data.id }
            - call: "POST /mrm/models/${a_id}/documentations/${a_doc}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${a_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { a_eng: $.data.id }
            - call: "POST /mrm/validation-engagements/${a_eng}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${a_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models"
              payload: { name: "Unready B", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${a_id}/retire"
              payload: { replacement_model_id: "${b_id}" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_REPLACEMENT_MODEL_NOT_APPROVED"
            - "Model.${a_id}.status == APPROVED_FOR_USE and Model.${a_id}.replaced_by_model_id == null (unchanged)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: engagement_windows_half_open_adjacency_allowed
        grounds:
          - errors[ERR_VALIDATION_WINDOW_OVERLAP]
          - entities.ValidationEngagement.fields.period_start
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on resource
          ValidationEngagement-per-model: a window starting exactly at the
          existing window's end is ALLOWED; a start one second earlier is
          rejected.
        test_recipe:
          setup:
            - "Model M (LOW/SINGLE_DESK/100) with APPROVED documentation"
            - "Engagement E1 window [2026-08-02T00:00:00Z, 2026-08-10T00:00:00Z) in TESTING"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Overlap M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-02T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: false, scope_outcomes_analysis: true, period_start: "2026-08-10T00:00:00Z", period_end: "2026-08-20T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { e2_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: false, period_start: "2026-08-09T23:59:59Z", period_end: "2026-08-21T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent creation succeeded: ${e2_id} is non-null (start == existing end allowed under half-open semantics)"
            - "captured ${err} == ERR_VALIDATION_WINDOW_OVERLAP (2026-08-09T23:59:59Z falls inside [2026-08-02, 2026-08-10))"

      - name: report_periods_closed_interval_adjacency_conflicts
        grounds:
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - state_machines.RegulatoryReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Interval semantics = CLOSED [start, end] on resource
          RegulatoryReport-per-report_type: a period starting exactly at the
          submitted period's end IS a conflict — the opposite adjacency
          treatment from engagement windows, on a different resource entity.
        test_recipe:
          setup:
            - "R1 BOARD_QUARTERLY covering [2026-04-01, 2026-06-30], SUBMITTED"
          setup_api_calls:
            - call: "POST /mrm/regulatory-reports"
              payload: { report_type: "BOARD_QUARTERLY", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", aggregation_method: "EQUAL_WEIGHTED" }
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { r1_id: $.data.id }
            - call: "POST /mrm/regulatory-reports/${r1_id}/submit"
              payload: {}
              as: RegulatoryReporter
              as_user_id: u_rep
            - call: "POST /mrm/regulatory-reports"
              payload: { report_type: "BOARD_QUARTERLY", period_start: "2026-06-30T00:00:00Z", period_end: "2026-09-30T00:00:00Z", aggregation_method: "EQUAL_WEIGHTED" }
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { r2_id: $.data.id }
            - call: "POST /mrm/regulatory-reports"
              payload: { report_type: "BOARD_QUARTERLY", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", aggregation_method: "EQUAL_WEIGHTED" }
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /mrm/regulatory-reports/${r2_id}/submit"
              payload: {}
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { err: $.data.error_id }
            - call: "POST /mrm/regulatory-reports/${r3_id}/submit"
              payload: {}
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { r3_status: $.data.status }
          assert:
            - "captured ${err} == ERR_REPORT_PERIOD_OVERLAP (closed interval: new start 2026-06-30 <= existing end 2026-06-30 — adjacency conflicts)"
            - "RegulatoryReport.${r2_id}.status == DRAFT (rejected)"
            - "captured ${r3_status} == SUBMITTED (start 2026-07-01 > 2026-06-30 — disjoint, accepted)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: close_reopen_restores_open_findings_count
        grounds:
          - state_machines.Finding.OPEN_to_CLOSED
          - state_machines.Finding.CLOSED_to_OPEN
          - calculations.open_findings_count
        distinguishing_aspect: |
          Conserved quantity = Model.open_findings_count (finding
          cardinality): close (−1) paired with reopen (+1) returns the count
          and the findings-penalty-bearing risk_score to their exact
          pre-action values.
        test_recipe:
          setup:
            - "Model M (LOW/SINGLE_DESK/100 → 30, TIER_3) with APPROVED doc"
            - "MEDIUM finding F at clock 2026-08-01 → open_findings_count 1, risk_score 32 (30 + 2)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Invariant M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/findings"
              payload: { severity: "MEDIUM", title: "invariant finding" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f_id: $.data.id, f_due: $.data.remediation_due_at }
          trigger:
            - call: "POST /mrm/models/${m_id}/findings/${f_id}/close"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/findings/${f_id}/reopen"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
          assert:
            - "After close: Model.${m_id}.open_findings_count == 0 and Model.${m_id}.risk_score == 30"
            - "After reopen: Model.${m_id}.open_findings_count == 1 — exactly the pre-close value (conserved)"
            - "After reopen: Model.${m_id}.risk_score == 32 — exactly the pre-close value"
            - "Finding.${f_id}.remediation_due_at == captured ${f_due} (reopen preserves the original deadline)"
            - "Finding.${f_id}.closed_at == null after reopen"

      - name: suspend_resume_conserves_metric_activation
        grounds:
          - state_machines.Model.APPROVED_FOR_USE_to_SUSPENDED
          - state_machines.Model.SUSPENDED_to_APPROVED_FOR_USE
          - state_machines.MonitoringMetric.ACTIVE_to_PAUSED
          - state_machines.MonitoringMetric.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity = per-model count of MonitoringMetrics in
          {ACTIVE, PAUSED} plus each metric's activation identity — a
          different conserved quantity than finding cardinality. Suspend
          (ACTIVE → PAUSED) paired with resume (PAUSED → ACTIVE) leaves the
          total and each metric's status exactly as before.
        test_recipe:
          setup:
            - "TIER_1 model M (HIGH/SINGLE_DESK/100 → 70) approved at 2026-08-01 with TWO ACTIVE metrics (psi, auc)"
            - "CRITICAL finding F created 2026-08-02 (due 2026-08-16); clock at 2026-08-24 → F ESCALATED, M SUSPENDED, both metrics PAUSED"
            - "Retest engagement window [2026-08-20, 2026-08-23) completed at logical time 2026-08-24 — completed_at > F.created_at (2026-08-02), satisfying the CRITICAL close gate"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Conserve M", business_unit: "Risk", declared_complexity: "HIGH", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng1: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng1}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "HIGH" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "psi", direction: "ABOVE_IS_BREACH", threshold_value: 0.25 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_psi: $.data.id }
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "auc", direction: "BELOW_IS_BREACH", threshold_value: 0.7 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_auc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mrm/models/${m_id}/findings"
              payload: { severity: "CRITICAL", title: "suspend driver" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: false, period_start: "2026-08-20T00:00:00Z", period_end: "2026-08-23T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng2: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng2}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "HIGH" }
              as: ModelValidator
              as_user_id: u_val
          trigger:
            - call: "POST /mrm/models/${m_id}/findings/${f_id}/close"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
          assert:
            - "Before close: both metrics PAUSED, model SUSPENDED; count of metrics IN {ACTIVE, PAUSED} == 2"
            - "After close: Model.${m_id}.status == APPROVED_FOR_USE (auto-resume)"
            - "After close: MonitoringMetric.${met_psi}.status == ACTIVE AND MonitoringMetric.${met_auc}.status == ACTIVE — each metric's identity and status restored"
            - "After close: count of M's metrics IN {ACTIVE, PAUSED} == 2 — conserved across the suspend/resume round trip"
