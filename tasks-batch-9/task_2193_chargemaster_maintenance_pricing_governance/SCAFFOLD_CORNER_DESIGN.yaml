            - call: "GET /chargemaster/captured-charges"
              payload: { batch_id: "${b1}", match_status: "MATCHED" }
              as: RevenueIntegrityAnalyst
              captures: { line0: "$.data[0].id" }
          assert:
            - "${b1_status} == INGESTED and ${b1_lines} == 0 and ${b1_passes} == 0 and ${gross} == 240000"
            - "${e_empty} == ERR_BATCH_HAS_NO_LINES with HTTP 422 (a zero-line batch cannot be reconciled)"
            - "${l1_match} == UNRECONCILED at creation"
            - "${rec_status} == RECONCILING, ${matched} == 1, ${exceptions} == 0, ${mean_bp} == 0, ${passes} == 1"
            - "${e_late_line} == ERR_INVALID_BATCH_STATE with HTTP 409 — lines may only be appended while the batch is INGESTED"
