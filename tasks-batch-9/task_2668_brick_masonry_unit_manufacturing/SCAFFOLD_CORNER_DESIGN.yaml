              payload: { production_run_id: "${r2}", kiln_position: 4, expected_kiln_run_version: "${kr1v1}" }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /kiln-runs/${kr1}"
              payload: {}
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { after_reject_version: "$.data.version", after_reject_loaded: "$.data.loaded_units" }
            - call: "POST /kiln-runs/${kr1}/load"
              payload: { production_run_id: "${r2}", kiln_position: 4, expected_kiln_run_version: "${kr1v2}" }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr1v3: "$.data.version", kr1_status_b: "$.data.status" }
          assert:
            - "${kr1_status_a} == SCHEDULED and ${kr1_status_b} == SCHEDULED - loading never moves the run, so status can never substitute for the version"
            - "${e_stale} == ERR_STALE_VERSION with HTTP 412, not ERR_KILN_POSITION_OCCUPIED: position 4 was free the whole time"
            - "${after_reject_version} == ${kr1v2} and ${after_reject_loaded} == 9600 - only R1 net green units are on the run, so the refused load neither took position 4 nor advanced the version"
            - "The retry with ${kr1v2} returns 200, ${kr1v3} differs from ${kr1v2}, and R2 now sits at position 4"
            - "R2 remains SET until the refused load is retried - a rejected load leaves the production run untouched, it does not move it to LOADED"

