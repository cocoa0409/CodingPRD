  - rule_id: boundary_precision_check
    instances:
      - name: escrow_break_at_exact_minimum_offering_threshold
        grounds:
          - calculations.subscription_load_and_shares
          - entities.Offering.fields.minimum_offering_amount_cents
          - errors[ERR_MINIMUM_OFFERING_NOT_MET]
          - state_machines.Offering.escrow_status.COLLECTING_to_BROKEN
          - entities.Offering.fields.escrow_balance_cents
        distinguishing_aspect: |
          At an escrow balance of 19750000 against a 20000000 minimum the break
          must fail, and at exactly 20000000 — not one cent more — it must
          succeed, so the comparison is `>=` and the escrow balance tracks
          gross_investment_cents rather than the post-load net_invested_cents
          (which would total only 19300000 and never clear the threshold).
