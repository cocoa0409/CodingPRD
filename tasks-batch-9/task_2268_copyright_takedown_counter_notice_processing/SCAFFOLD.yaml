# =============================================================================
# PRD Benchmark Seed Tables — task_2268
# Copyright Takedown & Counter-Notice Processing (online service provider)
# Difficulty band: beyond Expert (§0.4) — 15 entities, 71 endpoints, 58 errors,
# 10 calculations (4 with divergent variants), 16 state machines.
# =============================================================================

scenario: |
  2268. Copyright Takedown & Counter-Notice Processing (online service provider): designated agent registration with the copyright office and public contact publication, notice intake with statutory element validation and rejection of deficient notices, expeditious removal or disabling of access with user notification and repeat infringer tracking, counter-notice receipt with statutory elements, forwarding to the complainant and restoration timing rules, repeat infringer policy with strike accounting, account termination thresholds and appeal, abuse detection for fraudulent takedowns with penalties for misrepresentation, safe harbor eligibility maintenance with documentation of policy implementation, high-volume rights holder programs with automated ingestion and reference file matching

domain_name: copyright-takedown-counter-notice
api_prefix: /dmca

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: graph
  # NoticeClaim is a junction between TakedownNotice and ContentItem; CounterNotice
  # references itself via superseded_by_counter_notice_id; StrikeRecord and
  # MisrepresentationCase reach across the Account and RightsHolder aggregates.

  state_machine_shape: parallel
  # ContentItem carries two independent dimensions (availability_status x
  # dispute_status). Account standing is cyclic (ACTIVE -> LIMITED -> TERMINATED ->
  # ACTIVE), DesignatedAgent registration is cyclic (REGISTERED -> LAPSED ->
  # SUBMITTED -> REGISTERED), CounterNotice branches (RESTORED | BLOCKED_BY_SUIT |
  # SUPERSEDED), and TakedownNotice auto-CLOSES compound-style once every child
  # NoticeClaim reaches a terminal state.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Termination appeals cannot be decided by the officer who executed the
  # termination; misrepresentation cases cannot be substantiated by the
  # investigator who opened them.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  list_ordering: |
    Every list endpoint returns its rows in created_at ASC order, tie-broken by
    created_at only (`id` is never consulted). Filters are applied BEFORE
    pagination: total_count is the size of the filtered set and has_more is
    (offset + returned_rows) < total_count. Multiple filters intersect.

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: ServiceProviderProfile
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        required: true
        description: "Legal name of the online service provider claiming safe harbor"
      - name: service_domain
        type: string
        source: input
        required: true
        description: "Public domain the provider operates (used in the public contact page)"
      - name: public_contact_url
        type: string
        source: computed
        required: false
        description: "URL where the designated agent contact information is published; null until publish-contact"
        default: null
      - name: public_contact_published_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time at which publish-contact succeeded; null while unpublished"
        default: null
      - name: designated_agent_registered
        type: boolean
        source: computed
        required: true
        description: "True while at least one DesignatedAgent of this provider is in REGISTERED"
        default: false
      - name: repeat_infringer_policy_published
        type: boolean
        source: computed
        required: true
        description: "True while exactly one RepeatInfringerPolicy of this provider is in PUBLISHED"
        default: false
      - name: safe_harbor_score
        type: integer
        source: computed
        required: true
        description: "Latest safe_harbor_compliance_score; 0 while any hard gate fails"
        default: 0
      - name: safe_harbor_status
        type: enum
        source: computed
        required: true
        description: "Posture derived from safe_harbor_score and the hard gates"
        default: FORFEITED
        constraints: "one of ELIGIBLE, AT_RISK, FORFEITED"
      - name: last_audit_at
        type: datetime
        source: computed
        required: false
        description: "created_at of the most recent SafeHarborAudit for this provider"
        default: null

  - name: DesignatedAgent
    parent: ServiceProviderProfile
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        required: true
        description: "FK -> ServiceProviderProfile.id; the provider this agent is designated for"
      - name: agent_name
        type: string
        source: input
        required: true
        description: "Name of the natural person or entity designated to receive notices"
      - name: agent_email
        type: string
        source: input
        required: true
        description: "Notice-receiving email address published on the public contact page"
      - name: agent_phone
        type: string
        source: input
        required: true
        description: "Notice-receiving telephone number"
      - name: mailing_address
        type: string
        source: input
        required: true
        description: "Physical mailing address filed with the copyright office"
      - name: copyright_office_receipt
        type: string
        source: input
        required: false
        description: "Receipt identifier returned by the copyright office directory; supplied at register"
        default: null
      - name: registration_status
        type: enum
        source: computed
        required: true
        description: "Registration lifecycle with the copyright office directory"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, REGISTERED, LAPSED"
      - name: submitted_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time of the most recent submit"
        default: null
      - name: registered_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time of the most recent register"
        default: null
      - name: expires_at
        type: datetime
        source: computed
        required: false
        description: "registered_at plus REGISTRATION_TERM_DAYS (fixed at 1095 days); lapse is rejected before this instant"
        default: null

  - name: RepeatInfringerPolicy
    parent: ServiceProviderProfile
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        required: true
        description: "FK -> ServiceProviderProfile.id; the provider whose policy this is"
      - name: policy_text
        type: string
        source: input
        required: true
        description: "Published prose of the repeat infringer policy"
      - name: strike_expiry_days
        type: integer
        source: input
        required: false
        description: "Days after accrual at which a StrikeRecord EXPIRES and stops counting"
        default: 365
        constraints: "integer 30..3650"
      - name: decay_step_days
        type: integer
        source: input
        required: false
        description: "Age step used by the strike decay curve (see account_strike_points)"
        default: 90
        constraints: "integer 30..365"
      - name: limitation_threshold_points
        type: number
        source: input
        required: false
        description: "Strike points at or above which the Account is LIMITED"
        default: 20
        constraints: "number > 0 and < termination_threshold_points"
      - name: termination_threshold_points
        type: number
        source: input
        required: false
        description: "Strike points at or above which a TerminationCase is opened"
        default: 40
        constraints: "number > limitation_threshold_points"
      - name: appeal_window_days
        type: integer
        source: input
        required: false
        description: "Calendar days after termination execution during which an appeal may be filed"
        default: 14
        constraints: "integer 1..90"
      - name: counter_notice_window_days
        type: integer
        source: input
        required: false
        description: "Calendar days after a claim is DISABLED during which a counter-notice is accepted"
        default: 30
        constraints: "integer 1..180"
      - name: dispute_window_days
        type: integer
        source: input
        required: false
        description: "Length of the half-open duplicate-claim interval on a ContentItem"
        default: 30
        constraints: "integer 1..180"
      - name: status
        type: enum
        source: computed
        required: true
        description: "Publication lifecycle of this policy revision"
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED, SUPERSEDED"
      - name: published_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time at which this revision was published"
        default: null

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        required: true
        description: "FK -> ServiceProviderProfile.id; the provider hosting this subscriber account"
      - name: handle
        type: string
        source: input
        required: true
        description: "Subscriber handle, unique per provider"
        constraints: "unique within provider_id"
      - name: email
        type: string
        source: input
        required: true
        description: "Subscriber notification address used for takedown notifications"
      - name: standing
        type: enum
        source: computed
        required: true
        description: "Repeat-infringer standing derived from strike_points and termination outcome"
        default: ACTIVE
        constraints: "one of ACTIVE, LIMITED, TERMINATED"
      - name: strike_points
        type: number
        source: computed
        required: true
        description: "account_strike_points result; recomputed on strike create/void, clock set, appeal decision, termination execute, and audit run"
        default: 0
      - name: upload_restricted
        type: boolean
        source: computed
        required: true
        description: "True while standing is LIMITED or TERMINATED; blocks content-item creation"
        default: false
      - name: notified_count
        type: integer
        source: computed
        required: true
        description: "Number of takedown notifications delivered to this subscriber"
        default: 0
      - name: available_content_count
        type: integer
        source: computed
        required: true
        description: "Count of this account's ContentItems whose availability_status is AVAILABLE or RESTORED"
        default: 0
      - name: terminated_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time of the executed termination; cleared when an appeal vacates it"
        default: null

  - name: ContentItem
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        required: true
        description: "FK -> Account.id; the uploader of this material"
      - name: content_url
        type: string
        source: input
        required: true
        description: "Location of the allegedly infringing material"
        constraints: "unique within provider (via account_id -> provider_id)"
      - name: title
        type: string
        source: input
        required: true
        description: "Subscriber-supplied title of the material"
      - name: fingerprint_hash
        type: string
        source: input
        required: true
        description: "Lowercase 32-character hex content fingerprint compared against ReferenceFile.fingerprint_hash"
        constraints: "exactly 32 characters, /^[0-9a-f]{32}$/"
      - name: availability_status
        type: enum
        source: computed
        required: true
        description: "Access dimension; independent of dispute_status"
        default: AVAILABLE
        constraints: "one of AVAILABLE, DISABLED, RESTORED, PURGED"
      - name: dispute_status
        type: enum
        source: computed
        required: true
        description: "Dispute dimension; independent of availability_status"
        default: NONE
        constraints: "one of NONE, UNDER_NOTICE, COUNTER_NOTICED, RESTORATION_PENDING, RESOLVED"
      - name: disabled_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time at which access was most recently disabled"
        default: null
      - name: restored_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time at which access was most recently restored"
        default: null

  - name: RightsHolder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        required: true
        description: "Rights holder or authorized agent submitting notices"
      - name: contact_email
        type: string
        source: input
        required: true
        description: "Contact address for forwarded counter-notices"
      - name: reference_file_quota
        type: integer
        source: input
        required: false
        description: "Maximum number of ReferenceFiles in PENDING or ACTIVE for this rights holder"
        default: 50
        constraints: "integer 1..5000"
      - name: daily_item_quota
        type: integer
        source: input
        required: false
        description: "Maximum ingestion items accepted in any closed 24-hour sliding window"
        default: 500
        constraints: "integer 1..100000"
      - name: enrollment_status
        type: enum
        source: computed
        required: true
        description: "High-volume program enrollment lifecycle"
        default: PROSPECT
        constraints: "one of PROSPECT, ENROLLED, SUSPENDED"
      - name: program_tier
        type: enum
        source: computed
        required: true
        description: "Program tier controlling notice compliance variant and ingestion privileges"
        default: STANDARD
        constraints: "one of STANDARD, VERIFIED, TRUSTED"
      - name: notices_processed
        type: integer
        source: computed
        required: true
        description: "Count of this holder's TakedownNotices that reached PROCESSED"
        default: 0
      - name: withdrawn_count
        type: integer
        source: computed
        required: true
        description: "Count of this holder's TakedownNotices in WITHDRAWN"
        default: 0
      - name: rejected_count
        type: integer
        source: computed
        required: true
        description: "Count of this holder's TakedownNotices in REJECTED"
        default: 0
      - name: misrepresentation_count
        type: integer
        source: computed
        required: true
        description: "Count of this holder's MisrepresentationCases in SUBSTANTIATED"
        default: 0
      - name: abuse_score
        type: number
        source: computed
        required: true
        description: "rights_holder_abuse_score result; recomputed on notice reject/withdraw and on misrepresentation substantiate"
        default: 0
  - name: TakedownNotice
    parent: RightsHolder
    common_fields: true
    fields:
      - name: rights_holder_id
        type: string
        source: input
        required: true
        description: "FK -> RightsHolder.id; the complaining party"
      - name: ingestion_batch_id
        type: string
        source: input
        required: false
        description: "FK -> IngestionBatch.id; set only for automated API_BULK submissions"
        default: null
      - name: submission_channel
        type: enum
        source: input
        required: true
        description: "Intake channel; API_BULK forces the strict compliance variant"
        constraints: "one of WEB_FORM, EMAIL, API_BULK"
      - name: signature_present
        type: boolean
        source: input
        required: false
        description: "Statutory element (i): physical or electronic signature of the complaining party"
        default: false
      - name: work_identification
        type: string
        source: input
        required: false
        description: "Statutory element (ii): identification of the copyrighted work claimed infringed; null when omitted"
        default: null
      - name: material_identification
        type: string
        source: input
        required: false
        description: "Statutory element (iii): identification of the material to be removed; null when omitted"
        default: null
      - name: contact_email
        type: string
        source: input
        required: false
        description: "Statutory element (iv): contact information of the complaining party; null when omitted"
        default: null
      - name: good_faith_statement
        type: boolean
        source: input
        required: false
        description: "Statutory element (v): good-faith belief that use is not authorized"
        default: false
      - name: accuracy_statement
        type: boolean
        source: input
        required: false
        description: "Statutory element (vi) first clause: the information in the notice is accurate"
        default: false
      - name: authority_statement
        type: boolean
        source: input
        required: false
        description: "Statutory element (vi) second clause: authorized to act on behalf of the owner"
        default: false
      - name: sworn_under_penalty
        type: boolean
        source: input
        required: false
        description: "Whether element (vi) is sworn under penalty of perjury; required by the strict variant"
        default: false
      - name: claimed_urls
        type: array
        source: input
        required: true
        description: "Ordered list of allegedly infringing URLs; NoticeClaims are created in this order"
        constraints: "1..25 entries, each non-empty"
      - name: completeness_score
        type: number
        source: computed
        required: true
        description: "notice_statutory_completeness result, 0..100"
        default: 0
      - name: compliance_variant
        type: enum
        source: computed
        required: true
        description: "Which completeness variant was applied at validate time"
        default: SUBSTANTIAL_COMPLIANCE
        constraints: "one of SUBSTANTIAL_COMPLIANCE, STRICT_COMPLIANCE"
      - name: status
        type: enum
        source: computed
        required: true
        description: "Notice lifecycle"
        default: RECEIVED
        constraints: "one of RECEIVED, VALIDATED, REJECTED, PROCESSED, WITHDRAWN, CLOSED"
      - name: rejection_reason
        type: string
        source: computed
        required: false
        description: "Which statutory deficiency caused rejection; null unless REJECTED"
        default: null
      - name: matched_claim_count
        type: integer
        source: computed
        required: true
        description: "Number of claimed_urls that matched a live ContentItem at process time"
        default: 0
      - name: unmatched_url_count
        type: integer
        source: computed
        required: true
        description: "Number of claimed_urls with no live ContentItem at process time"
        default: 0
      - name: validated_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time of validate"
        default: null
      - name: processed_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time of process; used as the response-latency endpoint"
        default: null

  - name: NoticeClaim
    parent: TakedownNotice
    common_fields: true
    fields:
      - name: notice_id
        type: string
        source: system
        required: true
        description: "FK -> TakedownNotice.id; the notice that produced this claim"
      - name: content_item_id
        type: string
        source: system
        required: true
        description: "FK -> ContentItem.id; the material this claim targets"
      - name: rights_holder_id
        type: string
        source: system
        required: true
        description: "FK -> RightsHolder.id; denormalized complainant, forms the duplicate-claim interval key with content_item_id"
      - name: reference_file_id
        type: string
        source: system
        required: false
        description: "FK -> ReferenceFile.id; the ACTIVE reference file that matched, null when matched by URL only"
        default: null
      - name: matched_url
        type: string
        source: system
        required: true
        description: "The claimed_urls entry this claim resolved"
      - name: match_confidence
        type: number
        source: computed
        required: false
        description: "reference_match_confidence result for the selected reference file; null when no reference file matched"
        default: null
      - name: status
        type: enum
        source: computed
        required: true
        description: "Claim lifecycle from disabling through restoration or upholding"
        default: MATCHED
        constraints: "one of MATCHED, DISABLED, COUNTER_NOTICED, RESTORATION_SCHEDULED, RESTORED, UPHELD, WITHDRAWN"
      - name: dispute_window_days
        type: integer
        source: computed
        required: true
        description: "Snapshot of RepeatInfringerPolicy.dispute_window_days taken when the claim was disabled"
        default: 30
      - name: counter_notice_window_days
        type: integer
        source: computed
        required: true
        description: "Snapshot of RepeatInfringerPolicy.counter_notice_window_days taken when the claim was disabled"
        default: 30
      - name: disabled_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time at which access to the material was disabled under this claim"
        default: null
      - name: restoration_due_at
        type: datetime
        source: computed
        required: false
        description: "Earliest restoration instant copied from the forwarded CounterNotice; null until forwarded"
        default: null

  - name: CounterNotice
    parent: NoticeClaim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        required: true
        description: "FK -> NoticeClaim.id; the disabled claim being disputed"
      - name: account_id
        type: string
        source: computed
        required: true
        description: "FK -> Account.id; copied from the claim's ContentItem owner"
      - name: superseded_by_counter_notice_id
        type: string
        source: computed
        required: false
        description: "FK -> CounterNotice.id; set on the prior counter-notice when a later one supersedes it"
        default: null
      - name: subscriber_name
        type: string
        source: input
        required: true
        description: "Name of the subscriber submitting the counter-notice"
      - name: contact_email
        type: string
        source: input
        required: false
        description: "Statutory element: subscriber contact information; null when omitted"
        default: null
      - name: material_identification
        type: string
        source: input
        required: false
        description: "Statutory element: identification of the removed material and its former location; null when omitted"
        default: null
      - name: signature_present
        type: boolean
        source: input
        required: false
        description: "Statutory element: physical or electronic signature of the subscriber"
        default: false
      - name: good_faith_mistake_statement
        type: boolean
        source: input
        required: false
        description: "Statutory element: good-faith belief the material was removed by mistake or misidentification"
        default: false
      - name: consent_to_jurisdiction
        type: boolean
        source: input
        required: false
        description: "Non-waivable statutory element: consent to federal district court jurisdiction"
        default: false
      - name: consent_to_service_of_process
        type: boolean
        source: input
        required: false
        description: "Non-waivable statutory element: consent to accept service of process from the complainant"
        default: false
      - name: completeness_score
        type: number
        source: computed
        required: true
        description: "counter_notice_statutory_completeness result, 0..100"
        default: 0
      - name: status
        type: enum
        source: computed
        required: true
        description: "Counter-notice lifecycle; branches into RESTORED, BLOCKED_BY_SUIT, or SUPERSEDED"
        default: RECEIVED
        constraints: "one of RECEIVED, VALIDATED, FORWARDED, RESTORATION_SCHEDULED, RESTORED, BLOCKED_BY_SUIT, SUPERSEDED, REJECTED"
      - name: rejection_reason
        type: string
        source: computed
        required: false
        description: "Which statutory deficiency caused rejection; null unless REJECTED"
        default: null
      - name: forwarded_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time at which the counter-notice was forwarded to the complainant"
        default: null
      - name: restoration_earliest_at
        type: datetime
        source: computed
        required: false
        description: "restoration_window lower bound (10 business days after forwarded_at)"
        default: null
      - name: restoration_deadline_at
        type: datetime
        source: computed
        required: false
        description: "restoration_window upper bound (14 business days after forwarded_at)"
        default: null
      - name: suit_notice_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time at which the complainant's notice of court action was recorded"
        default: null

  - name: StrikeRecord
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        required: true
        description: "FK -> Account.id; the struck subscriber"
      - name: claim_id
        type: string
        source: system
        required: true
        description: "FK -> NoticeClaim.id; the claim that produced the strike"
      - name: weight
        type: number
        source: computed
        required: true
        description: "Program-tier weight of the complaining rights holder at accrual time"
        default: 1.0
        constraints: "1.0 for STANDARD, 1.5 for VERIFIED, 2.0 for TRUSTED"
      - name: base_points
        type: number
        source: computed
        required: true
        description: "STRIKE_BASE_POINTS times weight, before age decay"
        default: 10
      - name: effective_points
        type: number
        source: computed
        required: true
        description: "base_points after the decay factor for the strike's current age, per the pinned variant"
        default: 10
      - name: reason
        type: enum
        source: computed
        required: true
        description: "Why the strike accrued"
        default: NOTICE_PROCESSED
        constraints: "one of NOTICE_PROCESSED, CLAIM_UPHELD"
      - name: status
        type: enum
        source: computed
        required: true
        description: "Strike lifecycle; only ACTIVE and DECAYED strikes contribute points"
        default: ACTIVE
        constraints: "one of ACTIVE, DECAYED, EXPIRED, VOIDED"
      - name: accrued_at
        type: datetime
        source: computed
        required: true
        description: "Logical-clock time of accrual; the decay and expiry curves are measured from here"
      - name: expires_at
        type: datetime
        source: computed
        required: true
        description: "accrued_at plus RepeatInfringerPolicy.strike_expiry_days"

  - name: TerminationCase
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        required: true
        description: "FK -> Account.id; the account proposed for termination"
      - name: trigger_points
        type: number
        source: computed
        required: true
        description: "Account.strike_points observed when the case was opened"
      - name: status
        type: enum
        source: computed
        required: true
        description: "Termination case lifecycle including appeal"
        default: OPEN
        constraints: "one of OPEN, EXECUTED, APPEAL_FILED, VACATED, CLOSED"
      - name: opened_by_user_id
        type: string
        source: computed
        required: false
        description: "Null: cases are opened by the system when the termination threshold is crossed"
        default: null
      - name: executed_by_user_id
        type: string
        source: computed
        required: false
        description: "X-User-ID of the ComplianceOfficer who executed the termination"
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        required: false
        description: "X-User-ID of the ComplianceOfficer who decided the appeal; must differ from executed_by_user_id"
        default: null
      - name: executed_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time of termination execution"
        default: null
      - name: appeal_deadline_at
        type: datetime
        source: computed
        required: false
        description: "executed_at plus RepeatInfringerPolicy.appeal_window_days"
        default: null
      - name: appeal_filed_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time at which the subscriber filed the appeal"
        default: null
      - name: decision
        type: enum
        source: computed
        required: false
        description: "Appeal outcome; null until decided"
        default: null
        constraints: "one of UPHELD, VACATED"

  - name: MisrepresentationCase
    parent: RightsHolder
    common_fields: true
    fields:
      - name: rights_holder_id
        type: string
        source: input
        required: true
        description: "FK -> RightsHolder.id; the party accused of knowing misrepresentation"
      - name: claim_id
        type: string
        source: input
        required: true
        description: "FK -> NoticeClaim.id; the claim alleged to be a fraudulent takedown"
      - name: allegation
        type: string
        source: input
        required: true
        description: "Investigator's statement of the alleged misrepresentation"
      - name: opened_by_user_id
        type: string
        source: computed
        required: false
        description: "X-User-ID of the AbuseInvestigator who opened the case; null when the abuse-score trigger opened it"
        default: null
      - name: substantiated_by_user_id
        type: string
        source: computed
        required: false
        description: "X-User-ID of the AbuseInvestigator who substantiated the case; must differ from opened_by_user_id when that is non-null"
        default: null
      - name: status
        type: enum
        source: computed
        required: true
        description: "Investigation lifecycle"
        default: OPEN
        constraints: "one of OPEN, SUBSTANTIATED, DISMISSED"
      - name: affected_claim_count
        type: integer
        source: computed
        required: true
        description: "Claims of the same notice counted into the penalty base"
        default: 0
      - name: disabled_day_count
        type: integer
        source: computed
        required: true
        description: "Sum of whole days of disabled access across the affected claims"
        default: 0
      - name: base_penalty_cents
        type: integer
        source: computed
        required: true
        description: "misrepresentation_penalty base component in cents"
        default: 0
      - name: surcharge_cents
        type: integer
        source: computed
        required: true
        description: "misrepresentation_penalty surcharge component in cents, tiered on the base"
        default: 0
      - name: total_penalty_cents
        type: integer
        source: computed
        required: true
        description: "base_penalty_cents plus surcharge_cents"
        default: 0
      - name: substantiated_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time of substantiation"
        default: null

  - name: ReferenceFile
    parent: RightsHolder
    common_fields: true
    fields:
      - name: rights_holder_id
        type: string
        source: input
        required: true
        description: "FK -> RightsHolder.id; owner of the reference work"
      - name: work_title
        type: string
        source: input
        required: true
        description: "Title of the reference work"
      - name: fingerprint_hash
        type: string
        source: input
        required: true
        description: "Lowercase 32-character hex fingerprint compared against ContentItem.fingerprint_hash"
        constraints: "exactly 32 characters, /^[0-9a-f]{32}$/"
      - name: registration_number
        type: string
        source: input
        required: false
        description: "Copyright registration number; presence contributes the registration bonus to match confidence"
        default: null
      - name: status
        type: enum
        source: computed
        required: true
        description: "Reference file lifecycle; only ACTIVE files participate in matching"
        default: PENDING
        constraints: "one of PENDING, ACTIVE, QUARANTINED"
      - name: activated_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock time of activation"
        default: null
      - name: match_count
        type: integer
        source: computed
        required: true
        description: "Number of NoticeClaims that selected this file"
        default: 0

  - name: IngestionBatch
    parent: RightsHolder
    common_fields: true
    fields:
      - name: rights_holder_id
        type: string
        source: input
        required: true
        description: "FK -> RightsHolder.id; the high-volume program participant"
      - name: item_count
        type: integer
        source: input
        required: true
        description: "Number of ingestion items this batch declares"
        constraints: "integer 1..10000"
      - name: rolling_item_total
        type: integer
        source: computed
        required: true
        description: "ingestion_window_quota rolling total including this batch at acceptance time"
        default: 0
      - name: status
        type: enum
        source: computed
        required: true
        description: "Batch lifecycle"
        default: ACCEPTED
        constraints: "one of ACCEPTED, PROCESSING, COMPLETED, REJECTED"
      - name: notices_created
        type: integer
        source: computed
        required: true
        description: "Count of TakedownNotices carrying this ingestion_batch_id"
        default: 0
      - name: matched_count
        type: integer
        source: computed
        required: true
        description: "Sum of matched_claim_count over this batch's notices at completion"
        default: 0
      - name: unmatched_count
        type: integer
        source: computed
        required: true
        description: "Sum of unmatched_url_count over this batch's notices at completion"
        default: 0
      - name: accepted_at
        type: datetime
        source: computed
        required: true
        description: "Logical-clock time of acceptance; anchors the 24-hour sliding window"

  - name: SafeHarborAudit
    parent: ServiceProviderProfile
    common_fields: false
    fields:
      - name: provider_id
        type: string
        source: input
        required: true
        description: "FK -> ServiceProviderProfile.id; the audited provider"
      - name: median_response_hours
        type: number
        source: computed
        required: true
        description: "Median hours from notice created_at to processed_at over PROCESSED notices"
      - name: overdue_restoration_count
        type: integer
        source: computed
        required: true
        description: "Count of FORWARDED counter-notices whose restoration_deadline_at is at or before the clock and whose claim is not RESTORED"
      - name: termination_compliance
        type: boolean
        source: computed
        required: true
        description: "True when no Account holds strike_points at or above the termination threshold without an open or executed TerminationCase"
      - name: contact_published
        type: boolean
        source: computed
        required: true
        description: "True when the provider's public_contact_published_at is non-null"
      - name: response_component
        type: number
        source: computed
        required: true
        description: "Response-time component of the compliance score"
      - name: restoration_component
        type: number
        source: computed
        required: true
        description: "Restoration-timeliness component of the compliance score"
      - name: termination_component
        type: number
        source: computed
        required: true
        description: "Repeat-infringer-termination component of the compliance score"
      - name: contact_component
        type: number
        source: computed
        required: true
        description: "Public-contact component of the compliance score"
      - name: compliance_score
        type: integer
        source: computed
        required: true
        description: "safe_harbor_compliance_score result, 0..100"
      - name: resulting_status
        type: enum
        source: computed
        required: true
        description: "Posture written back onto the provider"
        constraints: "one of ELIGIBLE, AT_RISK, FORFEITED"
      - name: gate_failure_reason
        type: string
        source: computed
        required: false
        description: "Which hard gate forced score 0 and FORFEITED; null when no gate failed"
        default: null

# =============================================================================
# Table 2: State Machine Table (§1.2) — 16 machines
# Non-linear shapes: ContentItem carries two parallel dimensions; Account,
# DesignatedAgent, RightsHolder.program_tier and RightsHolder.enrollment_status
# are cyclic; CounterNotice and TakedownNotice branch.
# =============================================================================
state_machines:
  - entity: ServiceProviderProfile
    state_field: safe_harbor_status
    initial_state: FORFEITED
    terminal_states: []
    note: |
      Posture is recomputed ONLY by these four triggers: publish-contact, agent
      register, policy publish, and audit run. Notice/counter-notice processing
      never changes posture directly; it changes the inputs the next audit reads.
    transitions:
      - from: FORFEITED
        to: ELIGIBLE
        trigger: "POST /dmca/repeat-infringer-policies/{id}/publish | POST /dmca/designated-agents/{id}/register | POST /dmca/providers/{id}/publish-contact | POST /dmca/safe-harbor-audits"
        actor: ComplianceOfficer
        preconditions:
          - "all three hard gates pass: designated_agent_registered, repeat_infringer_policy_published, public_contact_published_at non-null"
          - "safe_harbor_compliance_score >= 85"
        side_effects:
          - "sets safe_harbor_score to the recomputed score"
          - "increments ServiceProviderProfile.version by 1"
      - from: FORFEITED
        to: AT_RISK
        trigger: "POST /dmca/safe-harbor-audits | POST /dmca/repeat-infringer-policies/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "all three hard gates pass"
          - "safe_harbor_compliance_score between 60 and 84 inclusive"
        side_effects:
          - "sets safe_harbor_score to the recomputed score"
      - from: ELIGIBLE
        to: AT_RISK
        trigger: "POST /dmca/safe-harbor-audits"
        actor: ComplianceOfficer
        preconditions:
          - "all three hard gates pass"
          - "safe_harbor_compliance_score between 60 and 84 inclusive"
        side_effects:
          - "sets safe_harbor_score to the recomputed score"
      - from: AT_RISK
        to: ELIGIBLE
        trigger: "POST /dmca/safe-harbor-audits"
        actor: ComplianceOfficer
        preconditions:
          - "all three hard gates pass"
          - "safe_harbor_compliance_score >= 85"
        side_effects:
          - "sets safe_harbor_score to the recomputed score"
      - from: ELIGIBLE
        to: FORFEITED
        trigger: "POST /dmca/designated-agents/{id}/lapse | POST /dmca/safe-harbor-audits"
        actor: system
        preconditions:
          - "a hard gate fails OR safe_harbor_compliance_score < 60"
        side_effects:
          - "sets safe_harbor_score to 0 when a hard gate failed"
          - "records gate_failure_reason on the audit when the trigger was an audit"
      - from: AT_RISK
        to: FORFEITED
        trigger: "POST /dmca/designated-agents/{id}/lapse | POST /dmca/safe-harbor-audits"
        actor: system
        preconditions:
          - "a hard gate fails OR safe_harbor_compliance_score < 60"
        side_effects:
          - "sets safe_harbor_score to 0 when a hard gate failed"

  - entity: DesignatedAgent
    state_field: registration_status
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic: REGISTERED -> LAPSED -> SUBMITTED -> REGISTERED (re-designation after the registration term expires)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dmca/designated-agents/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "agent_email, agent_phone and mailing_address are non-empty"
        side_effects:
          - "sets submitted_at to the logical clock"
      - from: SUBMITTED
        to: REGISTERED
        trigger: "POST /dmca/designated-agents/{id}/register"
        actor: ComplianceOfficer
        preconditions:
          - "provider public_contact_published_at is non-null"
          - "expected_provider_version equals the provider's current version (§1.2.1)"
        side_effects:
          - "sets registered_at to the logical clock and expires_at to registered_at + REGISTRATION_TERM_DAYS, where REGISTRATION_TERM_DAYS is fixed at 1095 calendar days"
          - "sets ServiceProviderProfile.designated_agent_registered to true"
          - "increments ServiceProviderProfile.version by 1"
          - "that provider mutation recomputes safe_harbor_compliance_score, which may advance ServiceProviderProfile.safe_harbor_status"
      - from: REGISTERED
        to: LAPSED
        trigger: "POST /dmca/designated-agents/{id}/lapse"
        actor: ComplianceOfficer
        preconditions:
          - "the logical clock is at or after expires_at"
        side_effects:
          - "sets ServiceProviderProfile.designated_agent_registered to false when no other agent of the provider is REGISTERED"
          - "that gate flip forces ServiceProviderProfile.safe_harbor_status to FORFEITED and safe_harbor_score to 0"
      - from: LAPSED
        to: SUBMITTED
        trigger: "POST /dmca/designated-agents/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "agent_email, agent_phone and mailing_address are non-empty"
        side_effects:
          - "overwrites submitted_at with the logical clock; registered_at and expires_at are retained until the next register"

  - entity: RepeatInfringerPolicy
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /dmca/repeat-infringer-policies/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "limitation_threshold_points < termination_threshold_points"
          - "expected_provider_version equals the provider's current version (§1.2.1)"
        side_effects:
          - "sets published_at to the logical clock"
          - "moves any other PUBLISHED policy of the same provider to SUPERSEDED"
          - "sets ServiceProviderProfile.repeat_infringer_policy_published to true and increments provider version by 1"
          - "that provider mutation recomputes safe_harbor_compliance_score and may advance safe_harbor_status"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: another revision of the same provider is published"
        actor: system
        preconditions:
          - "a sibling policy of the same provider reaches PUBLISHED"
        side_effects:
          - "already-snapshotted NoticeClaim window fields are NOT rewritten"

  - entity: Account
    state_field: standing
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic: ACTIVE -> LIMITED -> TERMINATED -> ACTIVE (appeal vacated or explicit reinstatement)."
    transitions:
      - from: ACTIVE
        to: LIMITED
        trigger: "system: strike_points recomputation crosses the limitation threshold"
        actor: system
        preconditions:
          - "recomputed strike_points >= RepeatInfringerPolicy.limitation_threshold_points"
        side_effects:
          - "sets upload_restricted to true, which blocks POST /dmca/content-items for this account"
          - "when recomputed strike_points also reach termination_threshold_points the system opens one OPEN TerminationCase for this account (skipped when an OPEN or EXECUTED case already exists); standing stays LIMITED until that case is executed"
      - from: LIMITED
        to: ACTIVE
        trigger: "system: strike_points recomputation falls below the limitation threshold (strike decay, expiry, or void)"
        actor: system
        preconditions:
          - "recomputed strike_points < RepeatInfringerPolicy.limitation_threshold_points"
        side_effects:
          - "sets upload_restricted to false"
      - from: LIMITED
        to: TERMINATED
        trigger: "POST /dmca/termination-cases/{id}/execute"
        actor: ComplianceOfficer
        preconditions:
          - "the TerminationCase is OPEN and belongs to this account"
          - "strike_points >= RepeatInfringerPolicy.termination_threshold_points at execution time"
        side_effects:
          - "sets terminated_at and upload_restricted true"
          - "moves every ContentItem of the account whose availability_status is AVAILABLE or RESTORED to DISABLED"
      - from: TERMINATED
        to: ACTIVE
        trigger: "POST /dmca/termination-cases/{id}/decide-appeal with decision VACATED | POST /dmca/accounts/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "for decide-appeal: the case is APPEAL_FILED and the deciding user differs from executed_by_user_id"
          - "for reinstate: the account is TERMINATED and its recomputed strike_points are STRICTLY BELOW RepeatInfringerPolicy.limitation_threshold_points, which only happens once the strikes have decayed or expired; the TerminationCase itself is left EXECUTED or CLOSED and is never reopened"
        side_effects:
          - "clears terminated_at, sets upload_restricted false"
          - "voids every StrikeRecord of the account that is ACTIVE or DECAYED (decide-appeal VACATED only)"
          - "that void recomputes strike_points to 0, so standing settles at ACTIVE rather than re-entering LIMITED"

  - entity: ContentItem
    state_field: availability_status
    initial_state: AVAILABLE
    terminal_states: [PURGED]
    note: "Parallel dimension 1 of 2. Advances independently of dispute_status."
    transitions:
      - from: AVAILABLE
        to: DISABLED
        trigger: "POST /dmca/notices/{id}/process | POST /dmca/termination-cases/{id}/execute"
        actor: TakedownAgent
        preconditions:
          - "a NoticeClaim was created for this item (process), or the owning account was terminated (execute)"
        side_effects:
          - "sets disabled_at to the logical clock"
          - "decrements Account.available_content_count by 1"
      - from: DISABLED
        to: RESTORED
        trigger: "POST /dmca/claims/{id}/restore"
        actor: TakedownAgent
        preconditions:
          - "the claim is RESTORATION_SCHEDULED and the logical clock is at or after restoration_due_at"
        side_effects:
          - "sets restored_at to the logical clock"
          - "increments Account.available_content_count by 1"
      - from: RESTORED
        to: DISABLED
        trigger: "POST /dmca/notices/{id}/process"
        actor: TakedownAgent
        preconditions:
          - "a later notice produced a new NoticeClaim for this item"
        side_effects:
          - "overwrites disabled_at with the logical clock"
          - "decrements Account.available_content_count by 1"
      - from: AVAILABLE
        to: PURGED
        trigger: "POST /dmca/content-items/{id}/purge"
        actor: Subscriber
        preconditions:
          - "the acting subscriber owns the item"
        side_effects:
          - "decrements Account.available_content_count by 1"
      - from: RESTORED
        to: PURGED
        trigger: "POST /dmca/content-items/{id}/purge"
        actor: Subscriber
        preconditions:
          - "the acting subscriber owns the item"
        side_effects:
          - "decrements Account.available_content_count by 1"
      - from: DISABLED
        to: PURGED
        trigger: "POST /dmca/content-items/{id}/purge"
        actor: ComplianceOfficer
        preconditions:
          - "no NoticeClaim on this item is COUNTER_NOTICED or RESTORATION_SCHEDULED"
        side_effects:
          - "leaves Account.available_content_count unchanged (the item was already excluded)"

  - entity: ContentItem
    state_field: dispute_status
    initial_state: NONE
    terminal_states: []
    note: "Parallel dimension 2 of 2. A PURGED item can still hold dispute_status RESOLVED; the two dimensions never gate each other."
    transitions:
      - from: NONE
        to: UNDER_NOTICE
        trigger: "POST /dmca/notices/{id}/process"
        actor: TakedownAgent
        preconditions:
          - "a NoticeClaim reached DISABLED for this item"
        side_effects:
          - "notifies the subscriber and increments Account.notified_count by 1"
      - from: UNDER_NOTICE
        to: COUNTER_NOTICED
        trigger: "POST /dmca/counter-notices/{id}/validate"
        actor: TakedownAgent
        preconditions:
          - "the counter-notice passed counter_notice_statutory_completeness"
        side_effects:
          - "moves the disputed NoticeClaim from DISABLED to COUNTER_NOTICED"
      - from: COUNTER_NOTICED
        to: RESTORATION_PENDING
        trigger: "POST /dmca/counter-notices/{id}/forward"
        actor: TakedownAgent
        preconditions:
          - "the counter-notice is VALIDATED"
        side_effects:
          - "copies restoration_earliest_at onto NoticeClaim.restoration_due_at"
      - from: RESTORATION_PENDING
        to: RESOLVED
        trigger: "POST /dmca/claims/{id}/restore"
        actor: TakedownAgent
        preconditions:
          - "the claim is RESTORATION_SCHEDULED and the restoration window has opened"
        side_effects: []
      - from: RESTORATION_PENDING
        to: RESOLVED
        trigger: "POST /dmca/counter-notices/{id}/record-suit-notice"
        actor: TakedownAgent
        preconditions:
          - "the counter-notice is still FORWARDED (the restoration window has not opened yet) and the logical clock is before restoration_deadline_at"
        side_effects:
          - "the claim moves to UPHELD and the item stays DISABLED"
      - from: RESTORATION_PENDING
        to: RESOLVED
        trigger: "POST /dmca/claims/{id}/uphold"
        actor: TakedownAgent
        preconditions:
          - "the claim is RESTORATION_SCHEDULED and its governing CounterNotice is BLOCKED_BY_SUIT"
        side_effects:
          - "the claim moves to UPHELD, the item stays DISABLED and no second strike accrues (the first strike is never voided)"
      - from: UNDER_NOTICE
        to: RESOLVED
        trigger: "POST /dmca/claims/{id}/uphold"
        actor: TakedownAgent
        preconditions:
          - "the claim is DISABLED and the counter-notice window has closed"
        side_effects:
          - "accrues a second StrikeRecord with reason CLAIM_UPHELD"
      - from: RESOLVED
        to: UNDER_NOTICE
        trigger: "POST /dmca/notices/{id}/process"
        actor: TakedownAgent
        preconditions:
          - "a later notice produced a new NoticeClaim for this item"
        side_effects:
          - "increments Account.notified_count by 1"

  - entity: RightsHolder
    state_field: enrollment_status
    initial_state: PROSPECT
    terminal_states: []
    note: "Cyclic: ENROLLED -> SUSPENDED -> ENROLLED."
    transitions:
      - from: PROSPECT
        to: ENROLLED
        trigger: "POST /dmca/rights-holders/{id}/enroll"
        actor: ComplianceOfficer
        preconditions:
          - "contact_email is non-empty"
          - "abuse_score < 70"
        side_effects: []
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /dmca/rights-holders/{id}/suspend | system: abuse_score reaches 70 after a case is substantiated"
        actor: AbuseInvestigator
        preconditions:
          - "for the system trigger: recomputed abuse_score >= 70"
        side_effects:
          - "moves every ACTIVE ReferenceFile of this holder to QUARANTINED (PENDING files are untouched)"
          - "that quarantine cascade withdraws the claims those files matched (see NoticeClaim)"
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /dmca/rights-holders/{id}/enroll"
        actor: ComplianceOfficer
        preconditions:
          - "abuse_score < 70"
        side_effects:
          - "quarantined reference files stay QUARANTINED; they must be re-created to participate in matching again"

  - entity: RightsHolder
    state_field: program_tier
    initial_state: STANDARD
    terminal_states: []
    note: "Cyclic: STANDARD -> VERIFIED -> TRUSTED -> VERIFIED -> STANDARD. Tier sets the strike weight and the notice compliance variant."
    transitions:
      - from: STANDARD
        to: VERIFIED
        trigger: "POST /dmca/rights-holders/{id}/promote-tier"
        actor: ComplianceOfficer
        preconditions:
          - "enrollment_status is ENROLLED"
          - "abuse_score < 40"
        side_effects:
          - "future StrikeRecords from this holder carry weight 1.5"
      - from: VERIFIED
        to: TRUSTED
        trigger: "POST /dmca/rights-holders/{id}/promote-tier"
        actor: ComplianceOfficer
        preconditions:
          - "enrollment_status is ENROLLED"
          - "abuse_score < 40"
          - "at least one ACTIVE ReferenceFile exists for this holder"
        side_effects:
          - "future StrikeRecords carry weight 2.0 and future notices are scored with the STRICT_COMPLIANCE variant"
      - from: TRUSTED
        to: VERIFIED
        trigger: "system: POST /dmca/misrepresentation-cases/{id}/substantiate recomputes abuse_score >= 70"
        actor: system
        preconditions:
          - "recomputed abuse_score >= 70"
        side_effects:
          - "existing StrikeRecords keep the weight snapshotted at accrual; only future strikes use 1.5"
      - from: VERIFIED
        to: STANDARD
        trigger: "system: POST /dmca/misrepresentation-cases/{id}/substantiate recomputes abuse_score >= 70"
        actor: system
        preconditions:
          - "recomputed abuse_score >= 70"
        side_effects:
          - "future notices revert to the SUBSTANTIAL_COMPLIANCE variant unless the channel is API_BULK"

  - entity: TakedownNotice
    state_field: status
    initial_state: RECEIVED
    terminal_states: [REJECTED, WITHDRAWN, CLOSED]
    note: |
      Branching at validate (VALIDATED vs REJECTED) with divergent side-effect
      sets, plus a compound auto-close: once every child NoticeClaim is terminal
      (RESTORED, UPHELD or WITHDRAWN) the notice auto-transitions PROCESSED -> CLOSED.
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /dmca/notices/{id}/validate"
        actor: TakedownAgent
        preconditions:
          - "the provider has a REGISTERED DesignatedAgent"
          - "notice_statutory_completeness passes the applicable variant's threshold AND every core element is present"
        side_effects:
          - "writes completeness_score, compliance_variant and validated_at"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /dmca/notices/{id}/validate"
        actor: TakedownAgent
        preconditions:
          - "notice_statutory_completeness fails the applicable variant's threshold OR a core element is missing"
        side_effects:
          - "writes completeness_score, compliance_variant and rejection_reason; no claim is created and no access is disabled"
          - "increments RightsHolder.rejected_count by 1, which recomputes rights_holder_abuse_score"
      - from: VALIDATED
        to: PROCESSED
        trigger: "POST /dmca/notices/{id}/process"
        actor: TakedownAgent
        preconditions:
          - "at least one claimed_urls entry resolves to a ContentItem whose availability_status is AVAILABLE or RESTORED"
          - "the owning provider has a PUBLISHED RepeatInfringerPolicy"
        side_effects:
          - "creates one NoticeClaim per resolved URL in claimed_urls order, each entering DISABLED"
          - "sets matched_claim_count, unmatched_url_count and processed_at"
          - "each new claim disables its ContentItem (availability DISABLED, dispute UNDER_NOTICE)"
          - "each disabling accrues one StrikeRecord on the owning Account"
          - "each accrual recomputes Account.strike_points, which may move standing ACTIVE -> LIMITED"
          - "crossing termination_threshold_points opens a TerminationCase for that account"
          - "increments RightsHolder.notices_processed by 1"
      - from: VALIDATED
        to: WITHDRAWN
        trigger: "POST /dmca/notices/{id}/withdraw"
        actor: RightsHolderRep
        preconditions:
          - "the acting rights holder owns the notice"
        side_effects:
          - "increments RightsHolder.withdrawn_count by 1 and recomputes abuse_score"
      - from: PROCESSED
        to: WITHDRAWN
        trigger: "POST /dmca/notices/{id}/withdraw"
        actor: RightsHolderRep
        preconditions:
          - "the acting rights holder owns the notice"
          - "no child NoticeClaim is UPHELD"
        side_effects:
          - "moves every non-terminal child NoticeClaim to WITHDRAWN"
          - "each withdrawn claim restores its ContentItem (availability RESTORED, dispute RESOLVED) unless the item is PURGED"
          - "each withdrawn claim voids its StrikeRecord, which recomputes Account.strike_points and may return standing LIMITED -> ACTIVE"
          - "increments RightsHolder.withdrawn_count by 1 and recomputes abuse_score"
      - from: PROCESSED
        to: CLOSED
        trigger: "system: every child NoticeClaim reached a terminal state"
        actor: system
        preconditions:
          - "matched_claim_count >= 1 and every child claim is RESTORED, UPHELD or WITHDRAWN"
        side_effects:
          - "no further claim may be created against this notice"

  - entity: NoticeClaim
    state_field: status
    initial_state: MATCHED
    terminal_states: [RESTORED, UPHELD, WITHDRAWN]
    note: "MATCHED is transient: POST /dmca/notices/{id}/process creates the claim and disables it within the same request."
    transitions:
      - from: MATCHED
        to: DISABLED
        trigger: "POST /dmca/notices/{id}/process"
        actor: TakedownAgent
        preconditions:
          - "the target ContentItem availability_status is AVAILABLE or RESTORED"
          - "no other claim of the same (content_item_id, rights_holder_id) pair occupies the dispute interval"
        side_effects:
          - "snapshots dispute_window_days and counter_notice_window_days from the PUBLISHED policy"
          - "sets disabled_at, disables the ContentItem and accrues a StrikeRecord"
      - from: DISABLED
        to: COUNTER_NOTICED
        trigger: "POST /dmca/counter-notices/{id}/validate"
        actor: TakedownAgent
        preconditions:
          - "the counter-notice on this claim passed its completeness check"
        side_effects:
          - "moves the ContentItem dispute_status to COUNTER_NOTICED"
      - from: COUNTER_NOTICED
        to: RESTORATION_SCHEDULED
        trigger: "POST /dmca/counter-notices/{id}/forward"
        actor: TakedownAgent
        preconditions:
          - "the counter-notice is VALIDATED"
        side_effects:
          - "copies the counter-notice restoration_earliest_at onto restoration_due_at"
      - from: RESTORATION_SCHEDULED
        to: RESTORED
        trigger: "POST /dmca/claims/{id}/restore"
        actor: TakedownAgent
        preconditions:
          - "the logical clock is at or after restoration_due_at"
          - "the governing CounterNotice is not BLOCKED_BY_SUIT"
        side_effects:
          - "restores the ContentItem (availability RESTORED, dispute RESOLVED) and increments Account.available_content_count"
          - "voids the StrikeRecord of this claim, recomputing Account.strike_points"
          - "when every sibling claim of the notice is terminal, the notice auto-closes"
      - from: DISABLED
        to: UPHELD
        trigger: "POST /dmca/claims/{id}/uphold"
        actor: TakedownAgent
        preconditions:
          - "the logical clock is at or after disabled_at + counter_notice_window_days"
          - "no CounterNotice on this claim is VALIDATED, FORWARDED or RESTORATION_SCHEDULED"
        side_effects:
          - "moves the ContentItem dispute_status to RESOLVED while access stays DISABLED"
          - "accrues a second StrikeRecord with reason CLAIM_UPHELD, recomputing Account.strike_points"
      - from: RESTORATION_SCHEDULED
        to: UPHELD
        trigger: "POST /dmca/counter-notices/{id}/record-suit-notice | POST /dmca/claims/{id}/uphold"
        actor: TakedownAgent
        preconditions:
          - "for record-suit-notice: the counter-notice is still FORWARDED (the restoration window has not opened yet) and the clock is before restoration_deadline_at"
          - "for uphold: the governing CounterNotice is already BLOCKED_BY_SUIT (the suit notice arrived after the restoration window opened, so the claim stayed RESTORATION_SCHEDULED and is finalised here)"
        side_effects:
          - "clears restoration_due_at and keeps the ContentItem DISABLED"
          - "moves the ContentItem dispute_status to RESOLVED"
          - "no second StrikeRecord accrues on this path and the existing strike is not voided"
          - "when every sibling claim of the notice is terminal, the notice auto-closes"
      - from: DISABLED
        to: WITHDRAWN
        trigger: "POST /dmca/notices/{id}/withdraw | system: the matched ReferenceFile was quarantined"
        actor: RightsHolderRep
        preconditions:
          - "the claim is not UPHELD"
        side_effects:
          - "restores the ContentItem unless PURGED and voids this claim's StrikeRecord"
      - from: COUNTER_NOTICED
        to: WITHDRAWN
        trigger: "POST /dmca/notices/{id}/withdraw | system: the matched ReferenceFile was quarantined"
        actor: RightsHolderRep
        preconditions:
          - "the claim is not UPHELD"
        side_effects:
          - "restores the ContentItem unless PURGED, voids the StrikeRecord, and moves the CounterNotice to SUPERSEDED"

  - entity: CounterNotice
    state_field: status
    initial_state: RECEIVED
    terminal_states: [RESTORED, BLOCKED_BY_SUIT, SUPERSEDED, REJECTED]
    note: "Branching: FORWARDED forks into RESTORED (window elapsed, no suit) or BLOCKED_BY_SUIT (complainant filed), with disjoint side-effect sets; a later counter-notice on the same claim SUPERSEDES an earlier non-terminal one."
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /dmca/counter-notices/{id}/validate"
        actor: TakedownAgent
        preconditions:
          - "counter_notice_statutory_completeness >= COUNTER_THRESHOLD"
          - "both non-waivable consents are present"
        side_effects:
          - "moves the claim DISABLED -> COUNTER_NOTICED and the ContentItem dispute_status to COUNTER_NOTICED"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /dmca/counter-notices/{id}/validate"
        actor: TakedownAgent
        preconditions:
          - "counter_notice_statutory_completeness < COUNTER_THRESHOLD OR a non-waivable consent is missing"
        side_effects:
          - "writes rejection_reason; the claim stays DISABLED and access is not restored"
      - from: VALIDATED
        to: FORWARDED
        trigger: "POST /dmca/counter-notices/{id}/forward"
        actor: TakedownAgent
        preconditions:
          - "the complainant RightsHolder has a non-empty contact_email"
        side_effects:
          - "sets forwarded_at, restoration_earliest_at and restoration_deadline_at from restoration_window"
          - "moves the claim to RESTORATION_SCHEDULED and the ContentItem dispute_status to RESTORATION_PENDING"
      - from: FORWARDED
        to: RESTORATION_SCHEDULED
        trigger: "POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "the logical clock reaches or passes restoration_earliest_at"
        side_effects:
          - "restoration becomes mandatory; the audit counts it overdue once the clock passes restoration_deadline_at"
      - from: RESTORATION_SCHEDULED
        to: RESTORED
        trigger: "POST /dmca/claims/{id}/restore"
        actor: TakedownAgent
        preconditions:
          - "the claim is RESTORATION_SCHEDULED and the clock is at or after restoration_due_at"
        side_effects:
          - "the claim reaches RESTORED and access is restored"
      - from: FORWARDED
        to: BLOCKED_BY_SUIT
        trigger: "POST /dmca/counter-notices/{id}/record-suit-notice"
        actor: TakedownAgent
        preconditions:
          - "the clock is before restoration_deadline_at"
        side_effects:
          - "sets suit_notice_at, moves the claim to UPHELD and keeps access DISABLED"
      - from: RESTORATION_SCHEDULED
        to: BLOCKED_BY_SUIT
        trigger: "POST /dmca/counter-notices/{id}/record-suit-notice"
        actor: TakedownAgent
        preconditions:
          - "the clock is before restoration_deadline_at"
        side_effects:
          - "sets suit_notice_at and keeps access DISABLED"
          - "the claim STAYS RESTORATION_SCHEDULED because the restoration window had already opened; restoration is blocked rather than cancelled, so POST /dmca/claims/{id}/restore now returns ERR_RESTORATION_BLOCKED_BY_SUIT at priority 15"
          - "the claim is finalised by POST /dmca/claims/{id}/uphold, which is the only endpoint that can move a RESTORATION_SCHEDULED claim once its counter-notice is BLOCKED_BY_SUIT"
      - from: RECEIVED
        to: SUPERSEDED
        trigger: "POST /dmca/counter-notices"
        actor: system
        preconditions:
          - "a later counter-notice on the same claim was created with a matching expected_claim_version"
        side_effects:
          - "sets superseded_by_counter_notice_id to the newer counter-notice id"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "POST /dmca/counter-notices"
        actor: system
        preconditions:
          - "a later counter-notice on the same claim was created with a matching expected_claim_version"
        side_effects:
          - "sets superseded_by_counter_notice_id and returns the claim to DISABLED so the newer counter-notice can be validated"

  - entity: StrikeRecord
    state_field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: ACTIVE
        to: DECAYED
        trigger: "POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "clock minus accrued_at is at least decay_step_days and less than strike_expiry_days"
        side_effects:
          - "recomputes effective_points with the decay factor and recomputes Account.strike_points"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "the clock is at or after expires_at"
        side_effects:
          - "sets effective_points to 0 and recomputes Account.strike_points"
      - from: DECAYED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "the clock is at or after expires_at"
        side_effects:
          - "sets effective_points to 0 and recomputes Account.strike_points"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /dmca/notices/{id}/withdraw | POST /dmca/claims/{id}/restore | POST /dmca/termination-cases/{id}/decide-appeal with decision VACATED"
        actor: system
        preconditions:
          - "the originating claim left DISABLED without being UPHELD, or the termination appeal was vacated"
        side_effects:
          - "sets effective_points to 0 and recomputes Account.strike_points"
      - from: DECAYED
        to: VOIDED
        trigger: "POST /dmca/notices/{id}/withdraw | POST /dmca/claims/{id}/restore | POST /dmca/termination-cases/{id}/decide-appeal with decision VACATED"
        actor: system
        preconditions:
          - "the originating claim left DISABLED without being UPHELD, or the termination appeal was vacated"
        side_effects:
          - "sets effective_points to 0 and recomputes Account.strike_points"

  - entity: TerminationCase
    state_field: status
    initial_state: OPEN
    terminal_states: [VACATED, CLOSED]
    transitions:
      - from: OPEN
        to: EXECUTED
        trigger: "POST /dmca/termination-cases/{id}/execute"
        actor: ComplianceOfficer
        preconditions:
          - "the account's strike_points are still at or above termination_threshold_points"
          - "the provider has a PUBLISHED RepeatInfringerPolicy"
        side_effects:
          - "records executed_by_user_id, executed_at and appeal_deadline_at"
          - "moves the Account to TERMINATED, which disables all of its available content"
      - from: EXECUTED
        to: APPEAL_FILED
        trigger: "POST /dmca/termination-cases/{id}/file-appeal"
        actor: Subscriber
        preconditions:
          - "the acting subscriber owns the account"
          - "the clock is before appeal_deadline_at"
        side_effects:
          - "sets appeal_filed_at"
      - from: APPEAL_FILED
        to: VACATED
        trigger: "POST /dmca/termination-cases/{id}/decide-appeal with decision VACATED"
        actor: ComplianceOfficer
        preconditions:
          - "the deciding X-User-ID differs from executed_by_user_id"
        side_effects:
          - "voids every ACTIVE or DECAYED StrikeRecord of the account"
          - "returns the Account to ACTIVE with strike_points 0 and upload_restricted false"
      - from: APPEAL_FILED
        to: CLOSED
        trigger: "POST /dmca/termination-cases/{id}/decide-appeal with decision UPHELD"
        actor: ComplianceOfficer
        preconditions:
          - "the deciding X-User-ID differs from executed_by_user_id"
        side_effects:
          - "the Account stays TERMINATED and strike records are untouched"
      - from: EXECUTED
        to: CLOSED
        trigger: "POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "the clock is STRICTLY AFTER appeal_deadline_at and no appeal was filed; at exactly appeal_deadline_at the case is still EXECUTED even though file-appeal already returns ERR_APPEAL_WINDOW_CLOSED"
        side_effects:
          - "the appeal route is final: file-appeal and decide-appeal are refused for ever after, so the account can only return to ACTIVE through POST /dmca/accounts/{id}/reinstate once its strike_points have decayed below limitation_threshold_points"

  - entity: MisrepresentationCase
    state_field: status
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /dmca/misrepresentation-cases/{id}/substantiate"
        actor: AbuseInvestigator
        preconditions:
          - "the acting X-User-ID differs from opened_by_user_id when that field is non-null"
          - "the referenced claim is not UPHELD"
        side_effects:
          - "writes affected_claim_count, disabled_day_count and the misrepresentation_penalty amounts"
          - "increments RightsHolder.misrepresentation_count, which recomputes abuse_score"
          - "an abuse_score of 70 or more steps program_tier down one level and moves enrollment_status to SUSPENDED"
          - "that suspension quarantines every ACTIVE ReferenceFile of the holder"
          - "each quarantined file withdraws the non-terminal claims that selected it, restoring their content items"
          - "each withdrawn claim voids its StrikeRecord, recomputing Account.strike_points and possibly returning standing to ACTIVE"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /dmca/misrepresentation-cases/{id}/dismiss"
        actor: AbuseInvestigator
        preconditions:
          - "the acting X-User-ID differs from opened_by_user_id when that field is non-null"
        side_effects:
          - "no penalty is recorded and abuse_score is unchanged"

  - entity: ReferenceFile
    state_field: status
    initial_state: PENDING
    terminal_states: [QUARANTINED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /dmca/reference-files/{id}/activate"
        actor: RightsHolderRep
        preconditions:
          - "the owning RightsHolder enrollment_status is ENROLLED"
          - "fingerprint_hash is 32 lowercase hex characters"
        side_effects:
          - "the file becomes eligible for reference_match_confidence selection"
      - from: ACTIVE
        to: QUARANTINED
        trigger: "system: the owning RightsHolder moved to SUSPENDED"
        actor: system
        preconditions:
          - "the owning holder left ENROLLED"
        side_effects:
          - "withdraws every non-terminal NoticeClaim whose reference_file_id is this file"

  - entity: IngestionBatch
    state_field: status
    initial_state: ACCEPTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: ACCEPTED
        to: PROCESSING
        trigger: "POST /dmca/notices"
        actor: system
        preconditions:
          - "a notice was created carrying this ingestion_batch_id"
        side_effects:
          - "increments notices_created by 1"
      - from: PROCESSING
        to: COMPLETED
        trigger: "POST /dmca/ingestion-batches/{id}/complete"
        actor: RightsHolderRep
        preconditions:
          - "every notice of this batch is PROCESSED, REJECTED, WITHDRAWN or CLOSED"
        side_effects:
          - "sums matched_count and unmatched_count over the batch's notices"
      - from: ACCEPTED
        to: REJECTED
        trigger: "POST /dmca/ingestion-batches/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "notices_created is 0"
        side_effects:
          - "the batch's item_count is excluded from future ingestion_window_quota rolling totals"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: agent-register-stale-provider
    parent_entity: ServiceProviderProfile
    write_endpoint: "POST /dmca/designated-agents/{id}/register"
    occ_field: "expected_provider_version"
    description: |
      Registering a designated agent against a provider whose version has
      advanced since the client last observed it is rejected. A registration
      legitimately supersedes the provider's previously published agent
      designation, so a writer holding a stale provider view must re-read the
      provider before re-issuing the registration.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412

  - rule_id: policy-publish-stale-provider
    parent_entity: ServiceProviderProfile
    write_endpoint: "POST /dmca/repeat-infringer-policies/{id}/publish"
    occ_field: "expected_provider_version"
    description: |
      Publishing a repeat infringer policy revision against a stale provider
      version is rejected. Publication legitimately supersedes the provider's
      currently published policy, so the writer must hold the provider version
      it intends to supersede.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412

  - rule_id: counter-notice-create-stale-claim
    parent_entity: NoticeClaim
    write_endpoint: "POST /dmca/counter-notices"
    occ_field: "expected_claim_version"
    description: |
      Creating a counter-notice against a claim whose version has advanced
      since the subscriber last read it is rejected. A newly created
      counter-notice legitimately supersedes an earlier non-terminal
      counter-notice on the same claim, so the creating writer must present the
      claim version it observed when it decided to supersede.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3) — 10 rules, 2 with declared variants
# No business decision anywhere reads `id`; every ordering/tie-break uses created_at.
# =============================================================================
calculations:
  - name: notice_statutory_completeness
    description: "Weighted score over the six statutory notice elements, gated by a non-waivable core-element check."
    trigger: "POST /dmca/notices/{id}/validate"
    algorithm: weighted_scoring
    inputs: [signature_present, work_identification, material_identification, contact_email, good_faith_statement, accuracy_statement, authority_statement, sworn_under_penalty, submission_channel, "rights_holder.program_tier"]
    input_set: "The single TakedownNotice being validated, plus its RightsHolder.program_tier for variant selection."
    formula: |
      present(e) = true when a boolean element is true, or a string element is
                   non-null and non-empty after trimming.
      score = SUM over the seven elements of (present(e) ? WEIGHT[e] : 0)
      # WEIGHT sums to exactly 100.
      core_missing = the first element, in this fixed order, that is absent:
        [signature_present, work_identification, material_identification,
         good_faith_statement, authority_statement]
      variant = STRICT_COMPLIANCE when submission_channel == "API_BULK"
                OR rights_holder.program_tier == "TRUSTED",
                otherwise SUBSTANTIAL_COMPLIANCE
      # Evaluation order is pinned: the score is computed FIRST, the threshold is
      # applied SECOND, and the core-element gate is applied THIRD. A notice can
      # therefore satisfy the threshold and still be rejected by the gate.
      passes = (variant == SUBSTANTIAL_COMPLIANCE
                  ? score >= SUBSTANTIAL_THRESHOLD
                  : score >= STRICT_THRESHOLD and sworn_under_penalty == true)
                and core_missing == null
      rejection_reason = core_missing != null
                           ? "CORE_ELEMENT_MISSING:" + core_missing
                           : (variant == STRICT_COMPLIANCE and not sworn_under_penalty
                                ? "UNSWORN_UNDER_STRICT_VARIANT"
                                : "SCORE_BELOW_THRESHOLD")
    constants:
      WEIGHT_SIGNATURE_PRESENT: 8
      WEIGHT_WORK_IDENTIFICATION: 18
      WEIGHT_MATERIAL_IDENTIFICATION: 20
      WEIGHT_CONTACT_EMAIL: 10
      WEIGHT_GOOD_FAITH_STATEMENT: 18
      WEIGHT_ACCURACY_STATEMENT: 8
      WEIGHT_AUTHORITY_STATEMENT: 18
      SUBSTANTIAL_THRESHOLD: 92
      STRICT_THRESHOLD: 100
    precision: "score is an integer 0..100 (weights are integers); comparisons are inclusive at the threshold"
    variants:
      - name: substantial_compliance
        when: "submission_channel is WEB_FORM or EMAIL and program_tier is STANDARD or VERIFIED"
        difference: "Passes at score >= 92 and ignores sworn_under_penalty; a notice missing only accuracy_statement (score 92) is VALIDATED."
      - name: strict_compliance
        when: "submission_channel is API_BULK or program_tier is TRUSTED"
        difference: "Requires score == 100 AND sworn_under_penalty true; the same score-92 payload is REJECTED with SCORE_BELOW_THRESHOLD."

  - name: account_strike_points
    description: "Repeat-infringer point total for an Account, decayed by strike age, pinned to per-strike rounding then summation."
    trigger: "StrikeRecord create or void, POST /_clock/set_current_utc, POST /dmca/termination-cases/{id}/decide-appeal, POST /dmca/termination-cases/{id}/execute, POST /dmca/safe-harbor-audits"
    algorithm: decay_function
    inputs: ["StrikeRecord.weight", "StrikeRecord.accrued_at", "StrikeRecord.status", "RepeatInfringerPolicy.decay_step_days", "RepeatInfringerPolicy.strike_expiry_days", "logical clock"]
    input_set: "StrikeRecords of the account whose status is ACTIVE or DECAYED. EXPIRED and VOIDED strikes are excluded entirely."
    formula: |
      age_days(s)   = floor((clock - s.accrued_at) / 1 day)
      step(s)       = floor(age_days(s) / policy.decay_step_days)
      factor(s)     = DECAY_FACTORS[step(s)] when step(s) <= 2, else 0.0
      # PINNED EVALUATION ORDER (round per strike, THEN sum):
      points(s)     = round_half_up(STRIKE_BASE_POINTS * s.weight * factor(s), 2)
      strike_points = round_half_up(SUM over included strikes, in accrued_at ASC
                                    order, of points(s), 2)
      # The rejected reading "sum the unrounded products, then round once" gives a
      # different cent value whenever three or more strikes land on factor 0.325.
    constants:
      STRIKE_BASE_POINTS: 10
      DECAY_FACTORS: [1.0, 0.65, 0.325]
      WEIGHT_STANDARD: 1.0
      WEIGHT_VERIFIED: 1.5
      WEIGHT_TRUSTED: 2.0
    precision: "2 decimal places, round_half_up, applied per strike and once more to the sum"
    variants:
      - name: chronological_replay
        when: "always — this is the pinned variant"
        difference: "Applies the age decay factor to each strike and rounds per strike before summing; two strikes at weight 1.0/step 0 and weight 1.5/step 1 total 19.75."
      - name: snapshot_aggregate
        when: "rejected reading: sum StrikeRecord.base_points as stored at accrual and round once"
        difference: "Ignores decay entirely; the same two strikes total 25.00, which crosses limitation_threshold_points and wrongly moves the account to LIMITED."

  - name: counter_notice_statutory_completeness
    description: "Weighted score over the counter-notice elements with two non-waivable consents that no score can compensate for."
    trigger: "POST /dmca/counter-notices/{id}/validate"
    algorithm: weighted_scoring
    inputs: [signature_present, material_identification, good_faith_mistake_statement, contact_email, consent_to_jurisdiction, consent_to_service_of_process]
    input_set: "The single CounterNotice being validated."
    formula: |
      score = SUM over the six elements of (present(e) ? WEIGHT[e] : 0)
      consent_missing = the first absent element in this fixed order:
        [consent_to_jurisdiction, consent_to_service_of_process]
      passes = score >= COUNTER_THRESHOLD and consent_missing == null
      rejection_reason = consent_missing != null
                           ? "CONSENT_MISSING:" + consent_missing
                           : "SCORE_BELOW_THRESHOLD"
      # A counter-notice missing only consent_to_jurisdiction scores exactly 94,
      # meeting COUNTER_THRESHOLD, and is still REJECTED by the consent gate.
    constants:
      WEIGHT_SIGNATURE_PRESENT: 20
      WEIGHT_MATERIAL_IDENTIFICATION: 20
      WEIGHT_GOOD_FAITH_MISTAKE_STATEMENT: 22
      WEIGHT_CONTACT_EMAIL: 26
      WEIGHT_CONSENT_TO_JURISDICTION: 6
      WEIGHT_CONSENT_TO_SERVICE_OF_PROCESS: 6
      COUNTER_THRESHOLD: 94
    precision: "integer 0..100, inclusive comparison at the threshold"

  - name: restoration_window
    description: "Business-day restoration window opened by forwarding a counter-notice to the complainant."
    trigger: "POST /dmca/counter-notices/{id}/forward"
    algorithm: interval_merge
    inputs: [forwarded_at, PROVIDER_HOLIDAYS]
    input_set: "The single CounterNotice being forwarded; the fixed holiday calendar below."
    formula: |
      business_day(d) = d falls Monday..Friday and its UTC date is not in
                        PROVIDER_HOLIDAYS
      add_business_days(t, n):
        d = t
        counted = 0
        while counted < n:
          d = d + 1 day            # same UTC time-of-day is preserved
          if business_day(d): counted = counted + 1
        return d
      # The anchor instant itself never counts, even when it is a business day.
      restoration_earliest_at  = add_business_days(forwarded_at, RESTORE_MIN_BUSINESS_DAYS)
      restoration_deadline_at  = add_business_days(forwarded_at, RESTORE_MAX_BUSINESS_DAYS)
      # forwarded_at 2026-09-01T00:00:00Z (Tue) yields earliest 2026-09-16T00:00:00Z
      # and deadline 2026-09-22T00:00:00Z (2026-09-07 is a holiday and is skipped).
    constants:
      RESTORE_MIN_BUSINESS_DAYS: 10
      RESTORE_MAX_BUSINESS_DAYS: 14
      PROVIDER_HOLIDAYS: ["2026-09-07", "2026-11-26", "2026-11-27", "2026-12-25", "2027-01-01"]
    precision: "instants are exact to the millisecond; the time-of-day of forwarded_at is preserved"

  - name: misrepresentation_penalty
    description: "Statutory misrepresentation penalty whose surcharge tier is keyed on the base, not on the running total."
    trigger: "POST /dmca/misrepresentation-cases/{id}/substantiate"
    algorithm: tiered_pricing
    inputs: [affected_claim_count, disabled_day_count]
    input_set: "Every NoticeClaim of the same TakedownNotice as the case's claim whose status is DISABLED, COUNTER_NOTICED, RESTORATION_SCHEDULED, RESTORED or UPHELD."
    formula: |
      affected_claim_count = count of the input_set claims
      disabled_day_count   = SUM over those claims of
                             floor((coalesce(restored_at_of_item, clock)
                                    - claim.disabled_at) / 1 day)
      base_penalty_cents   = PER_ITEM_BASE_CENTS * affected_claim_count
                             + DAILY_HARM_CENTS * disabled_day_count
      # PINNED EVALUATION ORDER — the tier is selected from base_penalty_cents.
      # Re-selecting the tier from the running total is the rejected reading.
      rate = base_penalty_cents >= SURCHARGE_TIER2_FLOOR ? SURCHARGE_RATE_TIER2
           : base_penalty_cents >= SURCHARGE_TIER1_FLOOR ? SURCHARGE_RATE_TIER1
           : 0.0
      surcharge_cents      = round_half_up(base_penalty_cents * rate, 0)
      total_penalty_cents  = base_penalty_cents + surcharge_cents
      # 4 claims disabled 60 days each: base 460000, rate 0.10, surcharge 46000,
      # total 506000. Re-tiering on the total (506000 >= 500000 -> 0.20) would
      # yield 552000 and is wrong.
    constants:
      PER_ITEM_BASE_CENTS: 25000
      DAILY_HARM_CENTS: 1500
      SURCHARGE_TIER1_FLOOR: 100000
      SURCHARGE_TIER2_FLOOR: 500000
      SURCHARGE_RATE_TIER1: 0.10
      SURCHARGE_RATE_TIER2: 0.20
    precision: "integer cents, round_half_up on the surcharge only"

  - name: safe_harbor_compliance_score
    description: "Four-component posture score for safe harbor eligibility, preceded by three hard gates."
    trigger: "POST /dmca/safe-harbor-audits, POST /dmca/providers/{id}/publish-contact, POST /dmca/designated-agents/{id}/register, POST /dmca/designated-agents/{id}/lapse, POST /dmca/repeat-infringer-policies/{id}/publish"
    algorithm: weighted_scoring
    inputs: [median_response_hours, overdue_restoration_count, termination_compliance, contact_published]
    input_set: |
      median_response_hours: TakedownNotices of the provider's accounts' claims
      whose status is PROCESSED or CLOSED, measured created_at -> processed_at.
      overdue_restoration_count: CounterNotices in FORWARDED or
      RESTORATION_SCHEDULED whose restoration_deadline_at is at or before the clock.
    formula: |
      # HARD GATES, evaluated in this order before any component is computed:
      if not provider.designated_agent_registered:            gate = "AGENT_NOT_REGISTERED"
      elif not provider.repeat_infringer_policy_published:    gate = "POLICY_NOT_PUBLISHED"
      elif provider.public_contact_published_at is null:      gate = "CONTACT_NOT_PUBLISHED"
      else: gate = null
      if gate != null: return { score: 0, status: "FORFEITED", gate_failure_reason: gate }

      latencies = for each included notice, round_half_up(
                    (processed_at - created_at) / 1 hour, 2), sorted ASC
      median_response_hours = latencies is empty ? 0
                            : odd count  ? latencies[middle]
                            : round_half_up((latencies[n/2 - 1] + latencies[n/2]) / 2, 2)
      response_component    = round_half_up(RESPONSE_WEIGHT *
                                max(0, min(1, (RESPONSE_TARGET_HOURS - median_response_hours)
                                              / RESPONSE_TARGET_HOURS)), 2)
      restoration_component = max(0, RESTORATION_WEIGHT
                                - OVERDUE_PENALTY * overdue_restoration_count)
      termination_component = termination_compliance ? TERMINATION_WEIGHT : 0
      contact_component     = contact_published ? CONTACT_WEIGHT : 0
      compliance_score      = round_half_up(response_component + restoration_component
                                + termination_component + contact_component, 0)
      status = compliance_score >= ELIGIBLE_FLOOR ? "ELIGIBLE"
             : compliance_score >= AT_RISK_FLOOR  ? "AT_RISK" : "FORFEITED"
    constants:
      RESPONSE_WEIGHT: 40
      RESPONSE_TARGET_HOURS: 48
      RESTORATION_WEIGHT: 30
      OVERDUE_PENALTY: 6
      TERMINATION_WEIGHT: 20
      CONTACT_WEIGHT: 10
      ELIGIBLE_FLOOR: 85
      AT_RISK_FLOOR: 60
    precision: "components to 2 decimal places round_half_up; compliance_score is an integer round_half_up"

  - name: reference_match_confidence
    description: "Confidence of a reference-file match plus the tier-dependent acceptance threshold and the selector's ranking rule."
    trigger: "POST /dmca/notices/{id}/process (once per resolved claimed_urls entry)"
    algorithm: weighted_scoring
    inputs: ["ContentItem.fingerprint_hash", "ReferenceFile.fingerprint_hash", "ReferenceFile.registration_number", "rights_holder.program_tier"]
    input_set: "ReferenceFiles of the notice's RightsHolder whose status is ACTIVE. PENDING and QUARANTINED files are excluded."
    formula: |
      prefix_len(a, b) = length of the longest common leading substring of the
                         two 32-character fingerprints
      confidence(r)    = round_half_up(SIMILARITY_WEIGHT * prefix_len / 32
                           + REGISTRATION_WEIGHT * (r.registration_number != null ? 1 : 0), 4)
      min_confidence   = program_tier == "TRUSTED"  ? TRUSTED_MIN_CONFIDENCE
                       : program_tier == "VERIFIED" ? VERIFIED_MIN_CONFIDENCE
                       :                              STANDARD_MIN_CONFIDENCE
      candidates = ACTIVE reference files with confidence(r) >= min_confidence
      # Ranking: confidence DESC, then created_at ASC. `id` is never consulted.
      selected   = candidates is empty ? null : first candidate after ranking
      claim.reference_file_id  = selected?.id
      claim.match_confidence   = selected == null ? null : confidence(selected)
      # Empty-pool fallback: the claim is still created from the URL match, with
      # reference_file_id and match_confidence null.
      # A 30/32 prefix on a registered file scores exactly 0.9500 and is accepted
      # at VERIFIED; the same file without a registration number scores 0.7500.
    constants:
      SIMILARITY_WEIGHT: 0.80
      REGISTRATION_WEIGHT: 0.20
      STANDARD_MIN_CONFIDENCE: 1.0
      VERIFIED_MIN_CONFIDENCE: 0.95
      TRUSTED_MIN_CONFIDENCE: 0.90
    precision: "4 decimal places, round_half_up; threshold comparisons are inclusive"

  - name: rights_holder_abuse_score
    description: "Abuse pressure of a rights holder over its own notice volume, with an auto-open selector at 40 and suspension at 70."
    trigger: "POST /dmca/notices/{id}/validate (rejection branch), POST /dmca/notices/{id}/withdraw, POST /dmca/misrepresentation-cases/{id}/substantiate"
    algorithm: threshold
    inputs: [withdrawn_count, rejected_count, misrepresentation_count, notices_processed]
    input_set: "Counters maintained on the RightsHolder itself."
    formula: |
      weighted = WITHDRAWN_WEIGHT * withdrawn_count
               + REJECTED_WEIGHT * rejected_count
               + MISREPRESENTATION_WEIGHT * misrepresentation_count
      abuse_score = round_half_up(100 * weighted / max(notices_processed, VOLUME_FLOOR), 2)
      # At or above AUTO_OPEN_FLOOR the system opens one MisrepresentationCase
      # against this holder, selecting the holder's most recent claim in
      # {DISABLED, COUNTER_NOTICED, RESTORATION_SCHEDULED, UPHELD} ranked by
      # disabled_at DESC then created_at DESC, with opened_by_user_id null.
      # Empty-pool fallback: no eligible claim -> no case is opened.
      # Skipped when an OPEN case already exists for that (holder, claim) pair.
      # At or above SUSPENSION_FLOOR a substantiation additionally suspends the
      # holder and steps program_tier down one level.
    constants:
      WITHDRAWN_WEIGHT: 1
      REJECTED_WEIGHT: 2
      MISREPRESENTATION_WEIGHT: 3
      VOLUME_FLOOR: 5
      AUTO_OPEN_FLOOR: 40
      SUSPENSION_FLOOR: 70
    precision: "2 decimal places, round_half_up; threshold comparisons are inclusive"

  - name: ingestion_window_quota
    description: "Closed 24-hour sliding-window aggregate cap on ingestion items per rights holder."
    trigger: "POST /dmca/ingestion-batches"
    algorithm: aggregation
    inputs: [item_count, "RightsHolder.daily_item_quota", "logical clock"]
    input_set: "IngestionBatches of the same RightsHolder whose status is ACCEPTED, PROCESSING or COMPLETED and whose accepted_at falls in the CLOSED interval [clock - 24h, clock]. REJECTED batches are excluded."
    formula: |
      window_total       = SUM of item_count over the input_set
      rolling_item_total = window_total + requested item_count
      # CLOSED interval: a batch accepted exactly 24h before the clock IS counted.
      reject when rolling_item_total > rights_holder.daily_item_quota
      # Equality is accepted: rolling_item_total == daily_item_quota succeeds.
    constants:
      WINDOW_HOURS: 24
    precision: "integer item counts; the comparison is strict (>) so the quota value itself is attainable"

  - name: claim_dispute_interval_overlap
    description: "Half-open duplicate-claim interval per content item and complainant pair."
    trigger: "POST /dmca/notices/{id}/process (per resolved claimed_urls entry)"
    algorithm: interval_merge
    inputs: ["NoticeClaim.disabled_at", "NoticeClaim.dispute_window_days", "NoticeClaim.status", "logical clock"]
    input_set: "Existing NoticeClaims with the same (content_item_id, rights_holder_id) pair whose status is DISABLED, COUNTER_NOTICED, RESTORATION_SCHEDULED, UPHELD or RESTORED. A RESTORED claim keeps occupying its window as an anti-harassment cooldown; only WITHDRAWN releases the interval."
    formula: |
      occupied(c) = [c.disabled_at, c.disabled_at + c.dispute_window_days)
      # HALF-OPEN: the upper bound is excluded.
      reject when the logical clock at process time falls inside occupied(c)
      for any claim c in the input_set
      # clock == c.disabled_at + dispute_window_days is OUTSIDE the interval and
      # the new claim is created.
    constants: {}
    precision: "instants exact to the millisecond; lower bound inclusive, upper bound exclusive"

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — evaluated strictly in priority order
# Compliance/safe-harbor gates run BEFORE state checks; temporal checks run
# BEFORE referential ones; quota and OCC checks run last.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "request body and query shape: required fields present, enums in range, fingerprint_hash matches /^[0-9a-f]{32}$/, claimed_urls has 1..25 non-empty entries, limit in 1..100, offset >= 0, threshold ordering limitation < termination"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "resources named in the path exist, validated left to right"
    error_id: "ERR_PROVIDER_NOT_FOUND | ERR_DESIGNATED_AGENT_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_CONTENT_ITEM_NOT_FOUND | ERR_RIGHTS_HOLDER_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_COUNTER_NOTICE_NOT_FOUND | ERR_STRIKE_NOT_FOUND | ERR_TERMINATION_CASE_NOT_FOUND | ERR_MISREPRESENTATION_CASE_NOT_FOUND | ERR_REFERENCE_FILE_NOT_FOUND | ERR_INGESTION_BATCH_NOT_FOUND | ERR_AUDIT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 5
    category: existence
    check: "foreign keys supplied in the request body exist (provider_id, account_id, rights_holder_id, claim_id, ingestion_batch_id, filter parameters)"
    error_id: "the matching *_NOT_FOUND code from priority 4"
    http_status: 404
    applies_to: "POST /dmca/designated-agents, POST /dmca/repeat-infringer-policies, POST /dmca/accounts, POST /dmca/content-items, POST /dmca/reference-files, POST /dmca/ingestion-batches, POST /dmca/notices, POST /dmca/counter-notices, POST /dmca/misrepresentation-cases, POST /dmca/safe-harbor-audits"

  - priority: 6
    category: auth
    check: "entity-backed roles act only on their own resources: Subscriber X-User-ID equals the target Account.id, RightsHolderRep X-User-ID equals the target RightsHolder.id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /dmca/content-items, POST /dmca/content-items/{id}/purge, POST /dmca/counter-notices, POST /dmca/termination-cases/{id}/file-appeal, POST /dmca/notices, POST /dmca/notices/{id}/withdraw, POST /dmca/reference-files, POST /dmca/reference-files/{id}/activate, POST /dmca/ingestion-batches, POST /dmca/ingestion-batches/{id}/complete"

  - priority: 7
    category: business_safety
    check: "the provider has at least one DesignatedAgent in REGISTERED before any notice may be validated"
    error_id: ERR_DESIGNATED_AGENT_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /dmca/notices/{id}/validate"

  - priority: 8
    category: business_safety
    check: "the provider's public contact information is published before an agent registration may be recorded"
    error_id: ERR_PUBLIC_CONTACT_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /dmca/designated-agents/{id}/register"

  - priority: 9
    category: business_safety
    check: "the provider's safe_harbor_status is ELIGIBLE before automated high-volume ingestion is accepted"
    error_id: ERR_SAFE_HARBOR_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /dmca/ingestion-batches"

  - priority: 10
    category: business_safety
    check: "the provider has a RepeatInfringerPolicy in PUBLISHED before access is disabled or an account is terminated"
    error_id: ERR_REPEAT_INFRINGER_POLICY_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /dmca/notices/{id}/process, POST /dmca/termination-cases/{id}/execute"

  - priority: 11
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2"
    error_id: "ERR_INVALID_AGENT_STATE | ERR_INVALID_POLICY_STATE | ERR_INVALID_NOTICE_STATE | ERR_INVALID_CLAIM_STATE | ERR_INVALID_COUNTER_NOTICE_STATE | ERR_INVALID_CONTENT_STATE | ERR_INVALID_ACCOUNT_STANDING | ERR_INVALID_TERMINATION_STATE | ERR_INVALID_MISREPRESENTATION_STATE | ERR_INVALID_REFERENCE_FILE_STATE | ERR_INVALID_BATCH_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 12
    category: auth
    check: "segregation of duties: the appeal decider differs from executed_by_user_id; the substantiating investigator differs from a non-null opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /dmca/termination-cases/{id}/decide-appeal, POST /dmca/misrepresentation-cases/{id}/substantiate, POST /dmca/misrepresentation-cases/{id}/dismiss"

  - priority: 13
    category: business_temporal
    check: "the logical clock is at or after NoticeClaim.restoration_due_at before access is restored"
    error_id: ERR_RESTORATION_TOO_EARLY
    http_status: 409
    applies_to: "POST /dmca/claims/{id}/restore"

  - priority: 13
    category: business_temporal
    check: "the counter-notice arrives no later than claim.disabled_at + counter_notice_window_days"
    error_id: ERR_COUNTER_NOTICE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /dmca/counter-notices"

  - priority: 13
    category: business_temporal
    check: "a DISABLED claim may be upheld only after claim.disabled_at + counter_notice_window_days has elapsed (the rule does not apply to a RESTORATION_SCHEDULED claim whose CounterNotice is BLOCKED_BY_SUIT, which may be upheld at once)"
    error_id: ERR_COUNTER_NOTICE_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /dmca/claims/{id}/uphold"

  - priority: 13
    category: business_temporal
    check: "the complainant's notice of court action is recorded before restoration_deadline_at"
    error_id: ERR_SUIT_NOTICE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /dmca/counter-notices/{id}/record-suit-notice"

  - priority: 13
    category: business_temporal
    check: "an appeal is filed before TerminationCase.appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /dmca/termination-cases/{id}/file-appeal"

  - priority: 13
    category: business_temporal
    check: "a registration may be lapsed only once the clock reaches DesignatedAgent.expires_at"
    error_id: ERR_REGISTRATION_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /dmca/designated-agents/{id}/lapse"

  - priority: 14
    category: business_referential
    check: "the RightsHolder enrollment_status is ENROLLED"
    error_id: ERR_RIGHTS_HOLDER_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /dmca/reference-files/{id}/activate, POST /dmca/ingestion-batches, POST /dmca/rights-holders/{id}/promote-tier"

  - priority: 14
    category: business_referential
    check: "the acting subscriber's Account standing is not TERMINATED"
    error_id: ERR_ACCOUNT_TERMINATED
    http_status: 403
    applies_to: "POST /dmca/content-items, POST /dmca/counter-notices"

  - priority: 14
    category: business_referential
    check: "the account is not upload restricted (standing LIMITED or TERMINATED)"
    error_id: ERR_ACCOUNT_UPLOAD_RESTRICTED
    http_status: 403
    applies_to: "POST /dmca/content-items"

  - priority: 14
    category: business_referential
    check: "the rights holder's program_tier is VERIFIED or TRUSTED before a notice may carry an ingestion_batch_id"
    error_id: ERR_PROGRAM_TIER_INSUFFICIENT
    http_status: 409
    applies_to: "POST /dmca/notices, POST /dmca/ingestion-batches"

  - priority: 14
    category: business_referential
    check: "promotion to TRUSTED requires at least one ACTIVE ReferenceFile"
    error_id: ERR_NO_REFERENCE_FILE_ACTIVE
    http_status: 409
    applies_to: "POST /dmca/rights-holders/{id}/promote-tier"

  - priority: 14
    category: business_referential
    check: "abuse_score is below AUTO_OPEN_FLOOR for promotion and below SUSPENSION_FLOOR for enrollment"
    error_id: ERR_ABUSE_SCORE_TOO_HIGH
    http_status: 409
    applies_to: "POST /dmca/rights-holders/{id}/promote-tier, POST /dmca/rights-holders/{id}/enroll"

  - priority: 15
    category: business_safety
    check: "restoration is refused while the governing CounterNotice is BLOCKED_BY_SUIT"
    error_id: ERR_RESTORATION_BLOCKED_BY_SUIT
    http_status: 409
    applies_to: "POST /dmca/claims/{id}/restore"

  - priority: 16
    category: business_constraint
    check: "content_url is unique across the provider's accounts"
    error_id: ERR_CONTENT_URL_CONFLICT
    http_status: 409
    applies_to: "POST /dmca/content-items"

  - priority: 16
    category: business_constraint
    check: "handle is unique within the provider"
    error_id: ERR_ACCOUNT_HANDLE_CONFLICT
    http_status: 409
    applies_to: "POST /dmca/accounts"

  - priority: 16
    category: business_constraint
    check: "the (content_item, rights_holder) dispute interval is free per claim_dispute_interval_overlap"
    error_id: ERR_DUPLICATE_CLAIM_WINDOW
    http_status: 409
    applies_to: "POST /dmca/notices/{id}/process"

  - priority: 16
    category: business_constraint
    check: "at most one OPEN MisrepresentationCase exists per (rights_holder_id, claim_id)"
    error_id: ERR_MISREPRESENTATION_CASE_EXISTS
    http_status: 409
    applies_to: "POST /dmca/misrepresentation-cases"

  - priority: 16
    category: business_constraint
    check: "the provider has no other DesignatedAgent in REGISTERED when a registration is recorded"
    error_id: ERR_AGENT_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /dmca/designated-agents/{id}/register"

  - priority: 17
    category: business_constraint
    check: "at least one claimed_urls entry resolves to a ContentItem whose availability_status is AVAILABLE or RESTORED and whose dispute interval is free"
    error_id: ERR_NO_ACTIONABLE_CLAIMS
    http_status: 422
    applies_to: "POST /dmca/notices/{id}/process"

  - priority: 18
    category: business_fiscal
    check: "the count of the holder's ReferenceFiles in PENDING or ACTIVE stays at or below reference_file_quota"
    error_id: ERR_REFERENCE_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /dmca/reference-files"

  - priority: 18
    category: business_fiscal
    check: "ingestion_window_quota rolling_item_total does not exceed daily_item_quota"
    error_id: ERR_INGESTION_WINDOW_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /dmca/ingestion-batches"

  - priority: 19
    category: state
    check: "expected_provider_version equals ServiceProviderProfile.version"
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412
    applies_to: "POST /dmca/designated-agents/{id}/register, POST /dmca/repeat-infringer-policies/{id}/publish"

  - priority: 19
    category: state
    check: "expected_claim_version equals NoticeClaim.version"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /dmca/counter-notices"

# =============================================================================
# Table 5: API Endpoint Table (§1.5) — 71 endpoints
# Every FK in §1.1 is reverse-reachable either as a sub-resource collection or
# through a filtered list; every state in §1.2 is reachable from an empty DB.
# =============================================================================
endpoints:
  # --- ServiceProviderProfile ------------------------------------------------
  - method: POST
    path: "/dmca/providers"
    description: "Register the online service provider claiming safe harbor"
    roles: [ComplianceOfficer]
    code: 201
    input: [legal_name, service_domain]
    output: ServiceProviderProfile
    side_effects: ["safe_harbor_status starts at FORFEITED with safe_harbor_score 0"]

  - method: GET
    path: "/dmca/providers/{id}"
    description: "Read one provider profile including its safe harbor posture"
    roles: [ComplianceOfficer, TakedownAgent, AbuseInvestigator]
    code: 200
    input: []
    output: ServiceProviderProfile
    side_effects: []

  - method: GET
    path: "/dmca/providers"
    description: "List provider profiles"
    roles: [ComplianceOfficer, TakedownAgent, AbuseInvestigator]
    code: 200
    input: ["safe_harbor_status?", "limit?", "offset?"]
    output: ServiceProviderProfile[]
    side_effects: []

  - method: POST
    path: "/dmca/providers/{id}/publish-contact"
    description: "Publish the designated agent contact information on the provider's public site"
    roles: [ComplianceOfficer]
    code: 200
    input: [public_contact_url]
    output: ServiceProviderProfile
    side_effects:
      - "sets public_contact_url and public_contact_published_at"
      - "recomputes safe_harbor_compliance_score and safe_harbor_status"
      - "increments ServiceProviderProfile.version by 1"

  - method: GET
    path: "/dmca/providers/{id}/designated-agents"
    description: "List the designated agents of a provider"
    roles: [ComplianceOfficer, TakedownAgent]
    code: 200
    input: ["registration_status?", "limit?", "offset?"]
    output: DesignatedAgent[]
    side_effects: []

  - method: GET
    path: "/dmca/providers/{id}/repeat-infringer-policies"
