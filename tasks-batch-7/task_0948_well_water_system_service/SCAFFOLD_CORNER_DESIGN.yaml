      - name: corner_endpoint_success_envelope_object_array_and_error_shapes
        claim_type: Standard CRUD
        grounds: ["response_envelope.success", "response_envelope.error", "response_envelope.pagination_fields", "errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: |
          The three envelope shapes are distinct and all three carry the same meta
          block. A single-resource GET answers response_type "object" with the entity
          under data; a list GET answers response_type "array" with the rows under data
          and limit, offset, total_count and has_more alongside; a 404 answers
          response_type "error" with data.error_id and data.message and NO entity
          fields. An implementation that returns the bare entity, or that omits
          has_more on the list, fails one of the three.
        test_recipe:
          setup: ["Exactly two accounts, created in a fixed order."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Envelope One Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "e1@corner.example" }
              as: PlatformAdmin
              captures: { acct_1: $.data.id }
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Envelope Two Co", billing_jurisdiction_code: "JUR_BRAVO", contact_email: "e2@corner.example", membership_tier: "PREMIER" }
              as: PlatformAdmin
              captures: { acct_2: $.data.id }
          trigger:
            - call: "GET /water-service/accounts/${acct_2}"
              payload: {}
              as: PlatformAdmin
              captures: { legal_2: $.data.legal_name }
            - call: "GET /water-service/accounts"
              payload: { limit: 10, offset: 0 }
              as: PlatformAdmin
            - call: "GET /water-service/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "The single-resource read answers response_type == object and ${legal_2} == Envelope Two Co"
            - "Every response carries a non-empty meta.api_request_id and an ISO 8601 meta.api_request_timestamp"
            - "The list read answers response_type == array with exactly 2 rows in the order ${acct_1}, ${acct_2}"
            - "The list read reports limit == 10, offset == 0, total_count == 2 and has_more == false"
            - "The unknown-id read answers response_type == error with HTTP status 404"
            - "${err_nf} == ERR_ACCOUNT_NOT_FOUND and the error body carries a non-empty message"

      - name: corner_endpoint_emergency_ticket_list_filters_both_axes_independently
        claim_type: Standard CRUD
        grounds: ["endpoints", "entities.EmergencyTicket.fields.dispatch_status", "entities.EmergencyTicket.fields.authorization_status", "calculations.pagination_window", "calculations.emergency_response_minutes"]
        distinguishing_aspect: |
          The two axes filter independently on one list endpoint. Of three tickets on
          one account - one left at INTAKE/NOT_REQUIRED, one DIAGNOSED/PRE_AUTHORIZED
          (estimate 20000 under the 75000 NONE cap) and one DIAGNOSED/PENDING (estimate
          200000 over it) - dispatch_status=DIAGNOSED returns 2 rows,
          authorization_status=PENDING returns 1, the two filters together return
          exactly the PENDING one, and account_id alone returns all 3 in created_at ASC
          order. An implementation that couples the axes cannot produce a
          DIAGNOSED/PRE_AUTHORIZED row and a DIAGNOSED/PENDING row at once. The chain
          also pins response_minutes, which is floor((dispatched_at - intake_at)/60):
          ticket B is taken in at 09:00:00Z and dispatched at 09:37:00Z giving 37, while
          ticket C is taken in at 09:37:00Z and dispatched at 10:15:00Z giving 38; the
          undispatched ticket A keeps response_minutes null.
