          - global_constants.GRADE_B_FLOOR
          - global_constants.GRADE_C_FLOOR
          - entities.Module.fields.cycle_count
        distinguishing_aspect: "Four modules with cycle_count omitted (default 0) and min == mean score exactly 80.00, 70.00, 60.00 and 59.99, landing on A, B, C and D: every band floor is an inclusive lower bound and one hundredth below the C floor drops the module to MATERIAL_RECOVERY."
