              payload: { full_name: "Dr H", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PHIS", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id }
            - call: "POST /cc/bed-holds/${hold}/release"
              payload: {}
              as: TransferCenterCoordinator
          trigger:
            - call: "POST /cc/bed-holds/${hold}/release"
              payload: {}
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_HOLD_INVALID_STATE"
            - "BedHold.${hold}.status remains RELEASED"

      - name: hold_explicit_bed_acuity_and_service_violations
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACUITY_EXCEEDS_BED_CAPABILITY]", "errors[ERR_SERVICE_MISMATCH]", "validations[priority=8]", "validations[priority=9]"]
        distinguishing_aspect: "The two remaining safety checks on explicit-bed holds: an OBSERVATION bed under a CRITICAL request fails ERR_ACUITY_EXCEEDS_BED_CAPABILITY; a NEURO bed under a CARDIAC request fails ERR_SERVICE_MISMATCH."
        test_recipe:
          setup:
            - "Clock at 00:00; facility; physician ON_CALL credentialed CARDIAC + NEURO"
            - "TR-HI: CARDIAC / ACUITY_1_CRITICAL / NONE, ACCEPTED; TR-SV: CARDIAC / ACUITY_3_MEDICAL_SURGICAL / NONE, ACCEPTED"
            - "bLow: CARDIAC OBSERVATION bed; bNeuro: NEURO STEPDOWN bed (non-MEDICAL, service mismatch for a CARDIAC request)"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Safe Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr Safe", services: ["CARDIAC", "NEURO"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "LOW", service: "CARDIAC", max_acuity: "ACUITY_4_OBSERVATION", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { bLow: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "N-1", label: "NEU", service: "NEURO", max_acuity: "ACUITY_2_STEPDOWN", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { bNeuro: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PHI", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "EMERGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { trHi: $.data.id }
            - call: "POST /cc/transfer-requests/${trHi}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${trHi}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PSV", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { trSv: $.data.id }
            - call: "POST /cc/transfer-requests/${trSv}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${trSv}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
          trigger:
            - call: "POST /cc/transfer-requests/${trHi}/bed-holds"
              payload: { bed_id: "${bLow}" }
              as: TransferCenterCoordinator
              captures: { err_acu: $.data.error_id }
            - call: "POST /cc/transfer-requests/${trSv}/bed-holds"
              payload: { bed_id: "${bNeuro}" }
              as: TransferCenterCoordinator
              captures: { err_svc: $.data.error_id }
          assert:
            - "acuity violation: HTTP 422 error_id == ERR_ACUITY_EXCEEDS_BED_CAPABILITY"
            - "service violation: HTTP 422 error_id == ERR_SERVICE_MISMATCH"
            - "both requests remain ACCEPTED; both beds remain AVAILABLE"


  # ===========================================================================
  # 7. RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: coordinator_cannot_respond_to_consult
        claim_type: role_denial
        grounds: ["roles[AcceptingPhysician]", "roles[TransferCenterCoordinator]"]
        distinguishing_aspect: "The coordinator role is not permitted on consult-response (AcceptingPhysician-exclusive) — denied 403 even with a physician-matching body."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician; request CONSULT_PENDING"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "RBAC Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr R", services: ["CARDIAC"] }
