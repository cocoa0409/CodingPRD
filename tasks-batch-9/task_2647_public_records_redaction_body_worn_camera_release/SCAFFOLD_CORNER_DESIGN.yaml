  - section: rbac
    instances:
      - name: peer_roles_cannot_reach_each_others_exclusive_operations
        claim_type: Violation -> Error
        grounds:
          - validations.priority_2
          - roles.RedactionTechnician.exclusive_operations
          - roles.QualityReviewer.exclusive_operations
          - roles.RecordsSupervisor.exclusive_operations
          - roles.LegalCounsel.exclusive_operations
        distinguishing_aspect: |
          The supervisor holds the fiscal and destruction authority yet is refused the
          production and litigation-hold operations, which proves the role model is peer
          segregation rather than a hierarchy with an override at the top.
        test_recipe:
          setup:
            - "One request with a RESPONSIVE 30-minute record; the record carries one DRAFT FACE task assigned to the technician."
