        test_recipe:
          setup: ["Member with ACTIVE non-renew CLASS_PACK, cycle_end 2026-03-03; clock advanced past it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { email: "ex@x.com", full_name: "Ex", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "CLASS_PACK", price_cents: 5000, credits_total: 5, cycle_start_utc: "2026-02-01T00:00:00Z", auto_renew: false }
              as: StudioManager
              captures: { ent_id: $.data.id }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T01:00:00Z" }
              as: StudioManager
            - call: "POST /_ops/run"
              payload: {}
              as: StudioManager
            - call: "GET /entitlements/${ent_id}"
              payload: {}
              as: StudioManager
              captures: { lc: $.data.lifecycle_status }
          assert:
            - "Entitlement.${ent_id}.lifecycle_status == EXPIRED"

      - name: session_complete_settlement_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.ClassSession.IN_PROGRESS_to_COMPLETED, state_machines.Reservation.CHECKED_IN_to_ATTENDED]
        distinguishing_aspect: "Completing a session settles all three reservation classes in one call: CHECKED_IN->ATTENDED, BOOKED->NO_SHOW, WAITLISTED->CANCELLED_EARLY."
        test_recipe:
          setup: ["Session S cap 1 with M1 CHECKED_IN, plus M2 WAITLISTED; clock at start."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Reformer A", room_type: "REFORMER", station_capacity: 1 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tara", certifications: ["REFORMER"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ca1@x.com", full_name: "Ca1", home_studio_state: "CA" }
              as: StudioManager
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ca2@x.com", full_name: "Ca2", home_studio_state: "CA" }
              as: StudioManager
              captures: { m2_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m1_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e1_id: $.data.id }
            - call: "POST /entitlements/${e1_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /entitlements"
              payload: { member_id: "${m2_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e2_id: $.data.id }
            - call: "POST /entitlements/${e2_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-12T10:00:00Z", end_utc: "2026-02-12T11:00:00Z", published_capacity: 1, waitlist_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v0: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m1_id}", class_session_id: "${s_id}", entitlement_id: "${e1_id}", expected_class_session_version: "${s_v0}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /class-sessions/${s_id}"
              payload: {}
              as: StudioManager
              captures: { s_vA: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m2_id}", class_session_id: "${s_id}", entitlement_id: "${e2_id}", expected_class_session_version: "${s_vA}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-12T10:00:00Z" }
              as: StudioManager
            - call: "POST /class-sessions/${s_id}/start"
              payload: {}
              as: StudioManager
            - call: "POST /reservations/${r1_id}/check-in"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /class-sessions/${s_id}/complete"
              payload: {}
              as: StudioManager
            - call: "GET /reservations/${r1_id}"
              payload: {}
              as: StudioManager
              captures: { r1_f: $.data.status }
            - call: "GET /reservations/${r2_id}"
              payload: {}
              as: StudioManager
              captures: { r2_f: $.data.status }
          assert:
            - "Reservation.${r1_id}.status == ATTENDED"
            - "Reservation.${r2_id}.status == CANCELLED_EARLY"
            - "ClassSession.${s_id}.status == COMPLETED"

