            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Waterfall Job", jobsite_address: "18 Sycamore St", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 1000000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
