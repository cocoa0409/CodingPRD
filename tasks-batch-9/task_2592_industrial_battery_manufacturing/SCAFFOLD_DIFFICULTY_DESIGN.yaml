            - "${cert_a} == CERTIFIED and ${cert_b} == CERTIFIED and ${plan_n} == 3 and ${plan_c} == 0"
            - "${res_a} == FAIL and ${yield_a} == 94.99   # threshold round(465.0*0.95,1) = 441.8, and 441.7 < 441.8 by one tenth"
            - "ProductionLot.${lot_id}.failed_test_count == 1 and ProductionLot.${lot_id}.completed_test_count == 1   # HOP 1"
            - "ProductionLot.${lot_id}.process_state == QUARANTINED   # HOP 2: failed_test_count 1 > acceptance_number 0"
            - "BatteryAssembly.${asm_a_id}.certification_status == REVOKED and BatteryAssembly.${asm_b_id}.certification_status == REVOKED   # HOP 3 fans out to the sibling the trigger never named"
            - "CapacityTest.${test_b_id}.test_state == VOIDED and CapacityTest.${test_b_id}.result == null   # HOP 4"
            - "CapacityTest.${test_a_id}.test_state == COMPLETED (the trigger's own test is not voided)"
            - "ProductionLot.${lot_id}.lot_capacity_yield_pct == null   # the yield window holds PASS tests only and there are none"
            - "ProductionLot.${lot_id}.last_test_recorded_by_worker_id == ${qa_a_id}"
            - "BatteryAssembly.${asm_a_id}.rework_count == 0 (a REVOKE is not a rework)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lot_state_beats_emission_budget_on_run_scheduling
        grounds:
          - validations[priority 11 -> ERR_LOT_STATE_INVALID]
          - validations[priority 16 -> ERR_EMISSION_BUDGET_EXCEEDED]
          - endpoints[POST /formation-runs]
        distinguishing_aspect: |
          Pairs category `state` (priority 11) against category `business_fiscal`
          (priority 16) on the same request: the lot is past FORMATION AND the
          reservation would blow the monthly lead-emission permit. The state error must
          win. A control call proves the fiscal breach is genuinely present, so an
          implementation that evaluates the quota first is detectably wrong rather
          than merely lucky.
        test_recipe:
          setup:
            - "Plant whose monthly_lead_emission_permit_g is only 100.00 g, so ANY lead formation run (255.00 g reserved) exceeds the quota."
            - "LOT-A advanced all the way to ASSEMBLY (so it is no longer schedulable) and LOT-B left in FORMATION as the control; two bays so the control cannot trip the bay-conflict rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID", "LITHIUM_LFP"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
