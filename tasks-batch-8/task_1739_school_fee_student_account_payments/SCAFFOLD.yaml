# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (left-to-right first failure)" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 404, condition: "Body-referenced FK id does not exist or is out of year scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, or range violation (amount<=0, end<=start, pct out of 0..10000, etc.)" }
  - { id: ERR_YEAR_NOT_OPEN, http: 409, condition: "Write attempted under a DRAFT or CLOSED school year" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in the from-state required by its state machine" }
  - { id: ERR_YEAR_NOT_CONFIGURABLE, http: 409, condition: "Open attempted on a year with no departments" }
  - { id: ERR_OPEN_COLLECTIONS_CASES, http: 409, condition: "Close attempted with non-terminal CollectionsCase under the year" }
  - { id: ERR_ACTIVE_PAYMENT_PLANS, http: 409, condition: "Close attempted with ACTIVE PaymentPlan under the year" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "ACTIVE enrollment already exists for (account, offering)" }
  - { id: ERR_OFFERING_FULL, http: 409, condition: "Offering at capacity (ACTIVE enrollment count == capacity)" }
  - { id: ERR_ENROLLMENT_WINDOW_CLOSED, http: 409, condition: "Offering not SCHEDULED at enrollment time" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Enrollment would overlap another ACTIVE enrollment's offering window on the same account (half-open interval semantics)" }
  - { id: ERR_YEAR_OVERLAP, http: 409, condition: "New school year's date range intersects an existing non-CLOSED year (closed-interval semantics; shared endpoint date collides)" }
  - { id: ERR_STUDENT_IN_COLLECTIONS, http: 409, condition: "Withdraw attempted while any account of the student is in COLLECTIONS posture" }
  - { id: ERR_NOT_GRADUATION_CANDIDATE, http: 422, condition: "Graduate attempted for grade_level != 12" }
  - { id: ERR_ACCOUNT_HOLD_BLOCKS_GRADUATION, http: 409, condition: "Graduation blocked by GRADUATION_HOLD or COLLECTIONS posture" }
  - { id: ERR_FEE_ITEM_IN_USE, http: 409, condition: "Retire attempted while non-terminal assessments reference the item" }
  - { id: ERR_ASSESSMENT_HAS_ACTIVITY, http: 409, condition: "Void attempted on an assessment with allocations or refunds" }
  - { id: ERR_WAIVER_PROGRAM_SUSPENDED, http: 409, condition: "Approval attempted against a SUSPENDED program" }
  - { id: ERR_WAIVER_INELIGIBLE, http: 422, condition: "Student grade outside the program's eligibility band" }
  - { id: ERR_WAIVER_SELF_APPROVAL, http: 403, condition: "Reviewer X-User-ID equals the application's submitted_by_user_id" }
  - { id: ERR_DUPLICATE_PAYMENT, http: 409, condition: "idempotency_key already used by a non-FAILED payment on the account" }
  - { id: ERR_OVERPAYMENT_REJECTED, http: 402, condition: "Settle amount exceeds allocatable capacity under REJECT policy" }
  - { id: ERR_PLAN_TERMS_VIOLATION, http: 422, condition: "Plan floor/installment-count terms violated, or no outstanding to cover" }
  - { id: ERR_PLAN_HAS_PAYMENTS, http: 409, condition: "Plan cancel attempted with at least one PAID installment" }
  - { id: ERR_ITEM_SOLD_OUT, http: 409, condition: "Purchase attempted when sold_count == inventory_cap" }
  - { id: ERR_ZERO_REFUND, http: 422, condition: "Execute attempted on a refund whose computed refund_cents == 0" }
  - { id: ERR_CASE_NOT_AGED, http: 409, condition: "Write-off attempted before BUCKET_3" }
  - { id: ERR_WRITEOFF_NEEDS_APPROVAL, http: 403, condition: "Write-off above bookkeeper limit without Superintendent approval coverage" }
  - { id: ERR_WRITEOFF_SOD, http: 403, condition: "Write-off actor recorded the most recent SUCCEEDED payment on the account" }
  - { id: ERR_ACCOUNT_WRITTEN_OFF, http: 409, condition: "Settle attempted on an account in WRITTEN_OFF posture" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version mismatch" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Bookkeeper
    description: "School bookkeeper — operates the year configuration, assessments, refunds, plans, collections, reconciliation"
    identity: "opaque"
    exclusive_operations:
      - "POST /school-years and all /school-years/{id}/* configuration and action endpoints"
      - "POST /students and student withdraw/graduate"
      - "POST /student-accounts and enrollment/assessment/refund/plan/collections management endpoints"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: FamilyMember
    description: "Parent/guardian acting on a student account — submits waiver applications, initiates/settles payments, purchases optional items"
    identity: "opaque"
    exclusive_operations:
      - "POST /student-accounts/{id}/payments and .../settle"
      - "POST /student-accounts/{id}/waiver-applications"
      - "POST /student-accounts/{id}/purchases"
    shared_operations:
      - "All GET endpoints"
  - name: Superintendent
    description: "District superintendent — co-approves large write-offs; read-only otherwise"
    identity: "opaque"
    exclusive_operations:
      - "POST /student-accounts/{id}/collections-cases/{caseId}/approve-writeoff"
    shared_operations:
      - "All GET endpoints"
