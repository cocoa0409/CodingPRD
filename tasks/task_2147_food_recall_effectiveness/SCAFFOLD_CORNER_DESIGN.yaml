        distinguishing_aspect: "Ratification requires status SUBMITTED: deciding on a DRAFT evaluation returns HTTP 409 ERR_INVALID_EVALUATION_STATE and leaves variant PRELIMINARY."
        test_recipe:
          setup: ["One FDA Recall in DRAFT with one HazardEvaluation still in DRAFT."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
