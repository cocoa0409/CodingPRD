        distinguishing_aspect: "The scope predicate is scope_issued_from <= not_before < scope_issued_to, so a certificate whose not_before equals scope_issued_to (2026-08-01T00:30:00Z) is outside the pool and mass-revoke returns ERR_NO_CERTIFICATES_IN_SCOPE, while an incident whose window starts at that same instant does select it and drains the pool in one batch."
