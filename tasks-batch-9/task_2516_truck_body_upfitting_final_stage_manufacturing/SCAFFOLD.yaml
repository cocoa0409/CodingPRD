scenario: |
  2516. Truck Body Upfitting & Final Stage Manufacturing (commercial truck upfitter): incomplete
  vehicle receipt with body builder book constraints on weight, wheelbase and electrical integration,
  body selection and installation across service, dump, flatbed and van configurations, equipment
  integration including cranes, liftgates and power take-off systems with hydraulic routing, weight
  distribution and payload certification with final stage manufacturer labeling responsibility,
  electrical interface with vehicle networks and aftermarket controls without voiding chassis warranty,
  pool stock versus customer-specific builds with configuration standardization, upfit scheduling
  against chassis availability and customer in-service dates, warranty responsibility split between
  chassis maker and upfitter
domain_name: truck-body-upfitting-final-stage-manufacturing
api_prefix: "/upfit"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Child resources are created at their own
  # top-level collections (`POST /upfit/equipment-installations` with `upfit_order_id` in the
  # body), never as nested URL segments; only lifecycle actions use `/{id}/<verb>` paths.

  state_machine_shape: parallel
  # UpfitOrder carries two independent state dimensions on the same row — `build_status`
  # (production progress) and `compliance_status` (final-stage certification progress). Each
  # advances on its own triggers; delivery is the single join point that requires both.
  # Secondary non-linear shapes: EquipmentInstallation has an INSTALLED <-> COMMISSIONED cycle,
  # WarrantyClaim has an ADJUDICATED -> DISPUTED -> INSPECTED re-adjudication cycle, Chassis
  # branches INSPECTED -> {ALLOCATED, QUARANTINED} with a QUARANTINED -> INSPECTED revert.

  relationship_patterns:
    - one_to_many          # UpfitOrder -> EquipmentInstallation / ElectricalInterface / BuildSlot
    - self_referential     # ComplianceLabel.supersedes_label_id -> ComplianceLabel.id
    - cross_aggregate      # BuildSlot references both WorkBay and Chassis across aggregates
    - polymorphic: false

  role_model: segregation_of_duties
  # The ComplianceOfficer who drafts a WeightCertification may not approve it, and the
  # ComplianceOfficer who approved the order's ElectricalInterface may not issue its
  # FINAL_STAGE ComplianceLabel.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ChassisModel
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Body builder book model code, e.g. F550-DRW-84CA"
        constraints: "unique across ChassisModel; 1..40 chars"
      - name: make
        type: string
        source: input
        description: "Chassis manufacturer name"
      - name: gvwr_lb
        type: integer
        source: input
        description: "Gross vehicle weight rating from the incomplete vehicle document"
        constraints: ">= 1"
      - name: front_gawr_lb
        type: integer
        source: input
        description: "Front gross axle weight rating"
        constraints: ">= 1"
      - name: rear_gawr_lb
        type: integer
        source: input
        description: "Rear gross axle weight rating"
        constraints: ">= 1"
      - name: wheelbase_in
        type: integer
        source: input
        description: "Front-axle centerline to rear-axle centerline distance in inches; denominator of every moment calculation"
        constraints: ">= 1"
      - name: cab_to_axle_in
        type: integer
        source: input
        description: "Back-of-cab to rear-axle centerline distance in inches"
        constraints: ">= 1"
      - name: curb_front_axle_lb
        type: integer
        source: input
        description: "Book curb weight carried by the front axle of the incomplete vehicle"
        constraints: ">= 0"
      - name: curb_rear_axle_lb
        type: integer
        source: input
        description: "Book curb weight carried by the rear axle of the incomplete vehicle"
        constraints: ">= 0"
      - name: max_aux_amp_draw
        type: integer
        source: input
        description: "Body builder book ceiling on continuous auxiliary current draw, in amps"
        constraints: ">= 0"
      - name: electrical_bus
        type: enum
        source: input
        description: "Vehicle network the aftermarket controls must interface with"
        constraints: "one of {J1939_CAN, DISCRETE}"
      - name: pto_provision
        type: enum
        source: input
        description: "Factory power take-off provision level"
        constraints: "one of {NONE, CLUTCH_SHIFT, FULL}"
      - name: pto_max_flow_gpm
        type: integer
        source: input
        description: "Hydraulic flow the factory PTO can source, gallons per minute; the finite pool the hydraulic waterfall allocates"
        default: 0
        constraints: ">= 0; MUST be 0 when pto_provision == NONE"
      - name: body_builder_book_rev
        type: string
        source: input
        description: "Revision label of the body builder book this model's constraints were read from"
      - name: incomplete_vehicle_document_rev
        type: string
        source: input
        description: "Revision label of the incomplete vehicle document that transfers labeling duty to the final-stage manufacturer"
        default: "IVD-2026.1"

  - name: Chassis
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: "Vehicle identification number of the received incomplete vehicle"
        constraints: "unique across Chassis; exactly 17 chars"
      - name: chassis_model_id
        type: string
        source: input
        description: "FK -> ChassisModel.id; supplies every body builder book constraint applied to builds on this unit"
      - name: ownership
        type: enum
        source: input
        description: "Whether the unit sits in pool stock or is already assigned to a customer order"
        default: POOL_STOCK
        constraints: "one of {POOL_STOCK, CUSTOMER_ASSIGNED}"
      - name: status
        type: enum
        source: system
        description: "Receipt-through-completion lifecycle state; see §1.2 Chassis"
        default: RECEIVED
        constraints: "one of {RECEIVED, INSPECTED, QUARANTINED, ALLOCATED, IN_UPFIT, COMPLETED, RETURNED}"
      - name: measured_front_axle_weight_lb
        type: integer
        source: input
        description: "Scale-ticket front axle weight recorded at inspection; null until inspected"
        default: null
        constraints: ">= 0 when present"
      - name: measured_rear_axle_weight_lb
        type: integer
        source: input
        description: "Scale-ticket rear axle weight recorded at inspection; null until inspected"
        default: null
        constraints: ">= 0 when present"
      - name: availability_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the unit is free to enter a build bay"
        constraints: "ISO calendar date"
      - name: allocated_upfit_order_id
        type: string
        source: system
        description: "FK -> UpfitOrder.id; the order this unit is allocated to, null while unallocated"
        default: null
      - name: quarantine_reason
        type: string
        source: system
        description: "Free-text reason stamped when the unit is quarantined at inspection"
        default: null

  - name: BodySpec
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Catalog code of the body, e.g. SERVICE-11FT"
        constraints: "unique across BodySpec"
      - name: body_type
        type: enum
        source: input
        description: "Body family driving labor hours and bay eligibility"
        constraints: "one of {SERVICE, DUMP, FLATBED, VAN}"
      - name: weight_lb
        type: integer
        source: input
        description: "Catalog dry weight of the body, used by the AS_DESIGNED weight basis"
        constraints: ">= 1"
      - name: cg_from_body_front_in
        type: integer
        source: input
        description: "Body center of gravity measured rearward from the body's front edge, in inches"
        constraints: ">= 0"
      - name: cargo_cg_from_body_front_in
        type: integer
        source: input
        description: "Cargo centroid measured rearward from the body's front edge; drives the payload-capacity axle terms"
        constraints: ">= 0"
      - name: length_in
        type: integer
        source: input
        description: "Overall body length in inches"
        constraints: ">= 1"
      - name: required_min_ca_in
        type: integer
        source: input
        description: "Minimum chassis cab-to-axle dimension the body may be mounted on"
        constraints: ">= 0"
      - name: required_min_wheelbase_in
        type: integer
        source: input
        description: "Minimum chassis wheelbase the body may be mounted on"
        constraints: ">= 0"
      - name: aux_amp_draw
        type: integer
        source: input
        description: "Continuous auxiliary current the body's own lighting and controls draw, in amps"
        constraints: ">= 0"
      - name: requires_hydraulics
        type: boolean
        source: input
        description: "True when the body cannot function without a PTO-sourced hydraulic supply"
        default: false
      - name: list_price_cents
        type: integer
        source: input
        description: "Catalog price of the body in cents; first term of the build invoice subtotal"
        constraints: ">= 0"

  - name: EquipmentSpec
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Catalog code of the equipment item, e.g. CRANE-6000"
        constraints: "unique across EquipmentSpec"
      - name: equipment_class
        type: enum
        source: input
        description: "Equipment family"
        constraints: "one of {CRANE, LIFTGATE, PTO_HOIST, PTO_PUMP}"
      - name: weight_lb
        type: integer
        source: input
        description: "Catalog dry weight of the equipment item"
        constraints: ">= 1"
      - name: requires_pto
        type: boolean
        source: input
        description: "True when the item draws hydraulic flow from the chassis power take-off"
        default: false
      - name: required_flow_gpm
        type: integer
        source: input
        description: "Hydraulic flow the item needs, gallons per minute; 0 when requires_pto is false"
        default: 0
        constraints: ">= 0; MUST be 0 when requires_pto == false"
      - name: aux_amp_draw
        type: integer
        source: input
        description: "Continuous auxiliary current the item draws, in amps"
        constraints: ">= 0"
      - name: duty_priority
        type: integer
        source: input
        description: "Hydraulic duty rank, 1 = served first by the PTO flow waterfall"
        constraints: ">= 1"
      - name: mount_zone
        type: enum
        source: input
        description: "Where on the chassis the item is mounted"
        constraints: "one of {BEHIND_CAB, BODY_FLOOR, REAR_OVERHANG}"
      - name: requires_can_gateway
        type: boolean
        source: input
        description: "True when the item's controls must be read through an approved network gateway rather than spliced"
        default: false
      - name: list_price_cents
        type: integer
        source: input
        description: "Catalog price of the item in cents"
        constraints: ">= 0"

  - name: WorkBay
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Bay identifier, e.g. BAY-1"
        constraints: "unique across WorkBay"
      - name: concurrent_capacity
        type: integer
        source: input
        description: "How many SCHEDULED or IN_BUILD slots may share any instant in this bay; the aggregate-capacity term of the bay overlap rule"
        constraints: ">= 1"
      - name: supported_body_types
        type: array
        source: input
        description: "Body families this bay can mount; array of {SERVICE, DUMP, FLATBED, VAN}"
        constraints: "non-empty; values from the BodySpec.body_type enum"
      - name: status
        type: enum
        source: system
        description: "Bay availability; DOWN bays reject new slots"
        default: ACTIVE
        constraints: "one of {ACTIVE, DOWN}"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Fleet customer legal name"
      - name: account_code
        type: string
        source: input
        description: "Fleet account code"
        constraints: "unique across Customer"
      - name: fleet_contact_email
        type: string
        source: input
        description: "Contact address for in-service date coordination"

  - name: BuildConfiguration
    parent: null
    common_fields: true
    fields:
      - name: config_code
        type: string
        source: input
        description: "Standardized configuration code, e.g. STD-SERVICE-A"
        constraints: "unique across BuildConfiguration"
      - name: chassis_model_id
        type: string
        source: input
        description: "FK -> ChassisModel.id; the only chassis model orders on this configuration may be allocated"
      - name: body_spec_id
        type: string
        source: input
        description: "FK -> BodySpec.id; the body every order on this configuration mounts"
      - name: standardization_tier
        type: enum
        source: input
        description: "Standardization tier driving the pool-stock invoice discount"
        constraints: "one of {TIER_A, TIER_B, CUSTOM}"
      - name: standard_equipment_spec_ids
        type: array
        source: input
        description: "EquipmentSpec ids a POOL_STOCK order on this configuration may install; array of string"
        default: []
      - name: status
        type: enum
        source: system
        description: "Publication lifecycle; only PUBLISHED configurations accept new orders"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, DEPRECATED}"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant the configuration was published; null while DRAFT"
        default: null

  - name: UpfitOrder
    parent: null
    common_fields: true
    fields:
      - name: order_number
        type: string
        source: input
        description: "Shop order number"
        constraints: "unique across UpfitOrder"
      - name: order_type
        type: enum
        source: input
        description: "POOL_STOCK builds are standardized and unassigned; CUSTOMER_SPECIFIC builds are cut to one customer's in-service date"
        constraints: "one of {POOL_STOCK, CUSTOMER_SPECIFIC}"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; REQUIRED when order_type == CUSTOMER_SPECIFIC, MUST be null when order_type == POOL_STOCK"
        default: null
      - name: build_configuration_id
        type: string
        source: input
        description: "FK -> BuildConfiguration.id; must be a configuration whose status == PUBLISHED at order creation"
      - name: body_spec_id
        type: string
        source: system
        description: "FK -> BodySpec.id; copied from BuildConfiguration.body_spec_id at creation and never re-derived"
      - name: chassis_id
        type: string
        source: system
        description: "FK -> Chassis.id; set by the allocate-chassis action, cleared when the unit is returned"
        default: null
      - name: body_mount_offset_from_front_axle_in
        type: integer
        source: input
        description: "Rearward distance from the front-axle centerline to the body's front edge, in inches; the single geometric input the shop controls"
        constraints: ">= 0"
      - name: body_actual_weight_lb
        type: integer
        source: input
        description: "Scale-verified installed body weight, recorded by the body-install action; null until the body is installed"
        default: null
        constraints: ">= 1 when present"
      - name: body_install_status
        type: enum
        source: system
        description: "Physical body-mount progress; see §1.2 UpfitOrder.body_install_status"
        default: PLANNED
        constraints: "one of {PLANNED, INSTALLED}"
      - name: required_payload_lb
        type: integer
        source: input
        description: "Payload the customer contracted for; release compares it against the AS_DESIGNED payload_capacity_lb"
        default: 0
        constraints: ">= 0"
      - name: requested_in_service_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the customer needs the truck in service; null for POOL_STOCK orders"
        default: null
      - name: warranty_liability_cap_cents
        type: integer
        source: input
        description: "Ceiling on cumulative upfitter warranty liability this order may absorb without an explicit override"
        default: 5000000
        constraints: ">= 0"
      - name: build_status
        type: enum
        source: system
        description: "Production dimension of the order state; evolves independently of compliance_status"
        default: DRAFT
        constraints: "one of {DRAFT, ENGINEERING_REVIEW, REWORK, RELEASED, SCHEDULED, IN_BUILD, BUILD_COMPLETE, DELIVERED, CHASSIS_HOLD, CANCELLED}"
      - name: compliance_status
        type: enum
        source: system
        description: "Final-stage certification dimension of the order state; evolves independently of build_status"
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, DESIGN_CERTIFIED, MEASURED_CERTIFIED, LABELED}"
      - name: chassis_warranty_status
        type: enum
        source: computed
        description: "Worst warranty_impact across this order's ElectricalInterface rows in status == APPROVED; INTACT when there are none"
        default: INTACT
        constraints: "one of {INTACT, CONDITIONAL, VOIDED}; INTACT < CONDITIONAL < VOIDED"
      - name: committed_pto_flow_gpm
        type: integer
        source: computed
        description: "Sum of EquipmentSpec.required_flow_gpm over this order's EquipmentInstallation rows in status IN {PLANNED, INSTALLED, COMMISSIONED} whose spec has requires_pto == true"
        default: 0
      - name: committed_aux_amp_draw
        type: integer
        source: computed
        description: "BodySpec.aux_amp_draw plus equipment and approved-interface amp draws; see calculations.aux_electrical_load"
        default: 0
      - name: invoice_total_cents
        type: integer
        source: computed
        description: "Output of calculations.build_invoice_total; recomputed on release and on every body-mount change while pre-delivery"
        default: 0
      - name: chassis_liability_cents
        type: integer
        source: computed
        description: "Sum of WarrantyClaim.chassis_liability_cents over this order's claims in status IN {ADJUDICATED, PAID}"
        default: 0
      - name: upfitter_liability_cents
        type: integer
        source: computed
        description: "Sum of WarrantyClaim.upfitter_liability_cents over this order's claims in status IN {ADJUDICATED, PAID}"
        default: 0
      - name: customer_goodwill_cents
        type: integer
        source: computed
        description: "Sum of WarrantyClaim.customer_goodwill_cents over this order's claims in status IN {ADJUDICATED, PAID}"
        default: 0
      - name: engineering_submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the UpfitEngineer who last submitted the order for engineering review"
        default: null
      - name: rework_round
        type: integer
        source: system
        description: "How many times the order has looped ENGINEERING_REVIEW -> REWORK -> ENGINEERING_REVIEW"
        default: 0

  - name: EquipmentInstallation
    parent: null
    common_fields: true
    fields:
      - name: upfit_order_id
        type: string
        source: input
        description: "FK -> UpfitOrder.id; the order this item is integrated into"
      - name: equipment_spec_id
        type: string
        source: input
        description: "FK -> EquipmentSpec.id; supplies weight, flow demand, amp draw and duty_priority"
      - name: mount_cg_from_front_axle_in
        type: integer
        source: input
        description: "Rearward distance from the front-axle centerline to this item's center of gravity, in inches"
        constraints: ">= 0"
      - name: hydraulic_circuit
        type: enum
        source: input
        description: "Which hydraulic routing the item is plumbed onto; NONE for electric-only items"
        default: NONE
        constraints: "one of {NONE, PRIMARY, SECONDARY}; MUST NOT be NONE when the spec has requires_pto == true"
      - name: actual_weight_lb
        type: integer
        source: input
        description: "Scale-verified weight recorded by the install action; null while PLANNED"
        default: null
        constraints: ">= 1 when present"
      - name: allocated_flow_gpm
        type: integer
        source: computed
        description: "Flow this item actually receives from calculations.pto_flow_waterfall; equals the spec demand unless the pool ran dry"
        default: 0
      - name: hydraulic_status
        type: enum
        source: computed
        description: "OK when allocated_flow_gpm equals the spec demand, DEFICIT when short, NOT_APPLICABLE for non-PTO items"
        default: NOT_APPLICABLE
        constraints: "one of {NOT_APPLICABLE, OK, DEFICIT}"
      - name: status
        type: enum
        source: system
        description: "Installation lifecycle; see §1.2 EquipmentInstallation"
        default: PLANNED
        constraints: "one of {PLANNED, INSTALLED, COMMISSIONED, REMOVED}"

  - name: ElectricalInterface
    parent: null
    common_fields: true
    fields:
      - name: upfit_order_id
        type: string
        source: input
        description: "FK -> UpfitOrder.id; the order whose vehicle network this interface taps"
      - name: interface_method
        type: enum
        source: input
        description: "How the aftermarket control is joined to the vehicle network"
        constraints: "one of {BODY_BUILDER_MODULE, CAN_GATEWAY, DIRECT_SPLICE}"
      - name: circuit_amp_draw
        type: integer
        source: input
        description: "Continuous current this interface's circuits add to the auxiliary load"
        constraints: ">= 0"
      - name: signal_source
        type: enum
        source: input
        description: "Where the interface reads vehicle signals from"
        constraints: "one of {BODY_CONTROLLER, J1939_BUS, DISCRETE_CIRCUIT}"
      - name: customer_warranty_waiver_ack
        type: boolean
        source: input
        description: "True when the customer has signed off on a warranty-voiding interface method"
        default: false
      - name: warranty_impact
        type: enum
        source: computed
        description: "Output of calculations.electrical_warranty_impact over interface_method and the chassis model's electrical_bus"
        constraints: "one of {NONE, CONDITIONAL, VOIDS}"
      - name: status
        type: enum
        source: system
        description: "Interface review lifecycle; only APPROVED rows count toward the auxiliary load and the warranty posture"
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, REJECTED, SUPERSEDED}"
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the UpfitEngineer who proposed the interface"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who approved the interface; null while PROPOSED"
        default: null

  - name: BuildSlot
    parent: null
    common_fields: true
    fields:
      - name: upfit_order_id
        type: string
        source: input
        description: "FK -> UpfitOrder.id; the order occupying the bay window"
      - name: work_bay_id
        type: string
        source: input
        description: "FK -> WorkBay.id; the bay resource whose aggregate capacity this slot consumes"
      - name: chassis_id
        type: string
        source: system
        description: "FK -> Chassis.id; copied from UpfitOrder.chassis_id at slot creation and never re-derived"
      - name: slot_type
        type: enum
        source: input
        description: "Which stage of the upfit occupies the bay"
        constraints: "one of {BODY_MOUNT, EQUIPMENT_INTEGRATION, FINAL_QC}"
      - name: start_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the slot opens; inclusive under both overlap rules"
        constraints: "ISO calendar date"
      - name: end_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the slot ends; EXCLUSIVE for the bay-capacity rule, INCLUSIVE for the chassis-occupancy rule"
        constraints: "ISO calendar date; MUST be > start_date"
      - name: queue_if_full
        type: boolean
        source: input
        description: "When true a bay-capacity collision parks the slot as QUEUED instead of rejecting it; the chassis-occupancy rule is never queued"
        default: false
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle; see §1.2 BuildSlot"
        default: SCHEDULED
        constraints: "one of {QUEUED, SCHEDULED, IN_BUILD, CLOSED, CANCELLED}"
      - name: promoted_from_queue_at
        type: datetime
        source: system
        description: "Logical-clock instant the slot was promoted QUEUED -> SCHEDULED by the waitlist selector; null otherwise"
        default: null

  - name: WeightCertification
    parent: null
    common_fields: true
    fields:
      - name: upfit_order_id
        type: string
        source: input
        description: "FK -> UpfitOrder.id; the order whose axle loads are certified"
      - name: basis
        type: enum
        source: input
        description: "Which variant of calculations.axle_load_distribution produced the numbers on this row"
        constraints: "one of {AS_DESIGNED, AS_MEASURED}"
      - name: front_axle_load_lb
        type: integer
        source: computed
        description: "Front axle load in pounds from calculations.axle_load_distribution under this basis"
      - name: rear_axle_load_lb
        type: integer
        source: computed
        description: "Rear axle load in pounds from calculations.axle_load_distribution under this basis"
      - name: gvw_lb
        type: integer
        source: computed
        description: "front_axle_load_lb + rear_axle_load_lb, both already rounded"
      - name: payload_capacity_lb
        type: integer
        source: computed
        description: "Output of calculations.payload_capacity under this basis"
      - name: included_component_count
        type: integer
        source: computed
        description: "How many components entered the basis's inclusion set: 1 for the body when included, plus one per included EquipmentInstallation"
      - name: status
        type: enum
        source: system
        description: "Certification lifecycle; only APPROVED rows may back a ComplianceLabel"
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED, VOIDED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who drafted the certification; may not also approve it"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who approved the certification; null while DRAFT"
        default: null
      - name: voided_reason
        type: string
        source: system
        description: "Why the certification was voided, e.g. COMPONENT_SET_CHANGED or BODY_MOUNT_CHANGED"
        default: null

  - name: ComplianceLabel
    parent: null
    common_fields: false
    fields:
      - name: upfit_order_id
        type: string
        source: input
        description: "FK -> UpfitOrder.id; the order the label is affixed to"
      - name: weight_certification_id
        type: string
        source: input
        description: "FK -> WeightCertification.id; the APPROVED certification whose numbers the label reproduces"
      - name: supersedes_label_id
        type: string
        source: input
        description: "FK -> ComplianceLabel.id; the voided label this one replaces, null for a first issuance"
        default: null
      - name: label_type
        type: enum
        source: computed
        description: "Output of calculations.label_responsibility"
        constraints: "one of {FINAL_STAGE, ALTERER, INCOMPLETE_PASSTHROUGH}"
      - name: responsible_party
        type: enum
        source: computed
        description: "Who certifies conformity, from calculations.label_responsibility"
        constraints: "one of {UPFITTER, CHASSIS_MANUFACTURER}"
      - name: certified_gvwr_lb
        type: integer
        source: computed
        description: "Copied from the order's chassis model gvwr_lb at issuance"
      - name: certified_front_gawr_lb
        type: integer
        source: computed
        description: "Copied from the order's chassis model front_gawr_lb at issuance"
      - name: certified_rear_gawr_lb
        type: integer
        source: computed
        description: "Copied from the order's chassis model rear_gawr_lb at issuance"
      - name: certified_payload_lb
        type: integer
        source: computed
        description: "Copied from the backing certification's payload_capacity_lb at issuance"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who issued the label"
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant the label was voided by a cascade; null while the label stands"
        default: null

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: upfit_order_id
        type: string
        source: input
        description: "FK -> UpfitOrder.id; the delivered build the failure occurred on"
      - name: claim_number
        type: string
        source: input
        description: "Claim reference number"
        constraints: "unique across WarrantyClaim"
      - name: failure_system
        type: enum
        source: input
        description: "Which vehicle system failed; keys the base liability split table"
        constraints: "one of {CHASSIS_ENGINE, CHASSIS_TRANSMISSION, CHASSIS_BRAKES, CHASSIS_ELECTRICAL, BODY_STRUCTURE, BODY_ELECTRICAL, HYDRAULICS}"
      - name: claim_cost_cents
        type: integer
        source: input
        description: "Total repair cost in cents; the conserved quantity the split apportions"
        constraints: ">= 1"
      - name: taint_confirmed
        type: boolean
        source: system
        description: "Set by the inspect action when teardown confirms an upfitter interface contributed to the failure"
        default: false
      - name: split_basis
        type: enum
        source: computed
        description: "Which variant of calculations.warranty_liability_split produced the cents fields on this row"
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: chassis_pct
        type: integer
        source: computed
        description: "Whole-percent share assigned to the chassis maker under the active split_basis"
      - name: upfitter_pct
        type: integer
        source: computed
        description: "Whole-percent share assigned to the upfitter under the active split_basis"
      - name: goodwill_pct
        type: integer
        source: computed
        description: "Whole-percent share absorbed as customer goodwill under the active split_basis"
      - name: chassis_liability_cents
        type: integer
        source: computed
        description: "Chassis maker's cents share; first party in the pinned rounding order"
      - name: upfitter_liability_cents
        type: integer
        source: computed
        description: "Upfitter's cents share; second party in the pinned rounding order"
      - name: customer_goodwill_cents
        type: integer
        source: computed
        description: "Remainder party: claim_cost_cents minus the two rounded shares, never rounded independently"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle including the re-adjudication cycle; see §1.2 WarrantyClaim"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, INSPECTED, ADJUDICATED, DISPUTED, PAID}"
      - name: dispute_round
        type: integer
        source: system
        description: "How many times the claim has looped ADJUDICATED -> DISPUTED -> INSPECTED"
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Chassis
    state_field: status
    initial_state: RECEIVED
    terminal_states: [COMPLETED, RETURNED]
    transitions:
      - from: RECEIVED
        to: INSPECTED
        trigger: "POST /upfit/chassis/{chassis_id}/inspect"
        actor: InstallTechnician
        preconditions:
          - "chassis.status IN {RECEIVED, QUARANTINED}"
          - "measured_front_axle_weight_lb and measured_rear_axle_weight_lb are both present in the request body"
        side_effects:
          - "stores measured_front_axle_weight_lb and measured_rear_axle_weight_lb on the Chassis (the AS_MEASURED weight basis reads these)"
          - "clears quarantine_reason to null"
          - "increments Chassis.version by 1 and refreshes Chassis.updated_at"
      - from: QUARANTINED
        to: INSPECTED
        trigger: "POST /upfit/chassis/{chassis_id}/inspect"
        actor: InstallTechnician
        preconditions:
          - "chassis.status == QUARANTINED"
          - "measured_front_axle_weight_lb and measured_rear_axle_weight_lb are both present in the request body"
        side_effects:
          - "overwrites the measured axle weights with the re-inspection scale ticket"
          - "clears quarantine_reason to null"
          - "increments Chassis.version by 1"
        note: "Revert edge: a quarantined unit re-enters the allocatable pool only through re-inspection."
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /upfit/chassis/{chassis_id}/quarantine"
        actor: PlantAdmin
        preconditions: ["chassis.status IN {RECEIVED, INSPECTED}"]
        side_effects:
          - "stores quarantine_reason from the request body"
          - "increments Chassis.version by 1"
      - from: INSPECTED
        to: QUARANTINED
        trigger: "POST /upfit/chassis/{chassis_id}/quarantine"
        actor: PlantAdmin
        preconditions: ["chassis.status IN {RECEIVED, INSPECTED}"]
        side_effects:
          - "stores quarantine_reason from the request body"
          - "increments Chassis.version by 1"
        note: "Branch sibling of INSPECTED -> ALLOCATED; the two edges diverge on the inspector's finding."
      - from: INSPECTED
        to: ALLOCATED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/allocate-chassis"
        actor: ProductionScheduler
        preconditions:
          - "chassis.status IN {INSPECTED, ALLOCATED}"
          - "expected_chassis_version equals the Chassis.version currently stored (§1.2.1 allocate-chassis-stale-chassis)"
          - "chassis.chassis_model_id == the order's BuildConfiguration.chassis_model_id"
          - "order.build_status IN {DRAFT, ENGINEERING_REVIEW, REWORK, RELEASED, CHASSIS_HOLD}"
        side_effects:
          - "sets Chassis.allocated_upfit_order_id to the order id"
          - "sets UpfitOrder.chassis_id to the chassis id"
          - "sets Chassis.ownership to CUSTOMER_ASSIGNED when order.order_type == CUSTOMER_SPECIFIC"
          - "recomputes UpfitOrder.committed_pto_flow_gpm and re-runs calculations.pto_flow_waterfall against the newly bound chassis model, restamping every EquipmentInstallation.allocated_flow_gpm and hydraulic_status"
          - "moves UpfitOrder.build_status CHASSIS_HOLD -> RELEASED when the order was on chassis hold"
          - "increments Chassis.version by 1 and UpfitOrder.version by 1"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/allocate-chassis"
        actor: ProductionScheduler
        preconditions:
          - "chassis.status == ALLOCATED and chassis.allocated_upfit_order_id != the requested order id"
          - "expected_chassis_version equals the Chassis.version currently stored"
          - "the currently allocated order has build_status IN {DRAFT, ENGINEERING_REVIEW, REWORK, RELEASED}"
        side_effects:
          - "clears the previously allocated UpfitOrder.chassis_id to null and sets that order's build_status to CHASSIS_HOLD"
          - "rebinds Chassis.allocated_upfit_order_id to the requesting order and sets that order's chassis_id"
          - "increments Chassis.version by 1"
        note: "Pool-stock re-allocation is a legitimate supersede, which is exactly why the OCC guard of §1.2.1 exists on this endpoint."
      - from: ALLOCATED
        to: IN_UPFIT
        trigger: "POST /upfit/build-slots/{build_slot_id}/start"
        actor: InstallTechnician
        preconditions:
          - "chassis.status == ALLOCATED"
          - "slot.status == SCHEDULED"
        side_effects:
          - "increments Chassis.version by 1"
          - "sets UpfitOrder.build_status to IN_BUILD"
      - from: IN_UPFIT
        to: COMPLETED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/deliver"
        actor: ProductionScheduler
        preconditions:
          - "chassis.status == IN_UPFIT"
          - "order.build_status == BUILD_COMPLETE and order.compliance_status == LABELED"
        side_effects:
          - "sets UpfitOrder.build_status to DELIVERED"
          - "increments Chassis.version by 1"
      - from: ALLOCATED
        to: RETURNED
        trigger: "POST /upfit/chassis/{chassis_id}/return"
        actor: PlantAdmin
        preconditions: ["chassis.status IN {INSPECTED, ALLOCATED, IN_UPFIT}"]
        side_effects:
          - "CASCADE hop 1 — clears Chassis.allocated_upfit_order_id and, because the order lost its unit, sets that UpfitOrder.chassis_id to null and its build_status to CHASSIS_HOLD"
          - "CASCADE hop 2 — because the order is no longer schedulable, every BuildSlot of that order in status IN {QUEUED, SCHEDULED, IN_BUILD} transitions to CANCELLED"
          - "CASCADE hop 3 — because a bay window was freed by hop 2, calculations.queue_promotion_selector runs for each affected WorkBay and promotes at most one QUEUED BuildSlot to SCHEDULED, stamping promoted_from_queue_at"
          - "CASCADE hop 4 — because a promoted slot became SCHEDULED, its own UpfitOrder.build_status moves RELEASED -> SCHEDULED"
          - "increments Chassis.version by 1"
      - from: IN_UPFIT
        to: RETURNED
        trigger: "POST /upfit/chassis/{chassis_id}/return"
        actor: PlantAdmin
        preconditions: ["chassis.status IN {INSPECTED, ALLOCATED, IN_UPFIT}"]
        side_effects:
          - "same four-hop cascade as ALLOCATED -> RETURNED"
      - from: INSPECTED
        to: RETURNED
        trigger: "POST /upfit/chassis/{chassis_id}/return"
        actor: PlantAdmin
        preconditions: ["chassis.status IN {INSPECTED, ALLOCATED, IN_UPFIT}"]
        side_effects:
          - "increments Chassis.version by 1; no order cascade because allocated_upfit_order_id is null"

  - entity: UpfitOrder
    state_field: build_status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ENGINEERING_REVIEW
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/submit-engineering"
        actor: UpfitEngineer
        preconditions:
          - "order.build_status IN {DRAFT, REWORK}"
          - "order.body_mount_offset_from_front_axle_in is present"
        side_effects:
          - "sets engineering_submitted_by_user_id to the caller's X-User-ID"
          - "increments UpfitOrder.version by 1"
      - from: REWORK
        to: ENGINEERING_REVIEW
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/submit-engineering"
        actor: UpfitEngineer
        preconditions:
          - "order.build_status IN {DRAFT, REWORK}"
        side_effects:
          - "overwrites engineering_submitted_by_user_id with the caller's X-User-ID"
          - "increments UpfitOrder.version by 1"
        note: "Closing edge of the engineering revision cycle."
      - from: ENGINEERING_REVIEW
        to: REWORK
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/request-rework"
        actor: ComplianceOfficer
        preconditions: ["order.build_status == ENGINEERING_REVIEW"]
        side_effects:
          - "increments rework_round by 1"
          - "increments UpfitOrder.version by 1"
      - from: ENGINEERING_REVIEW
        to: RELEASED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/release"
        actor: ProductionScheduler
        preconditions:
          - "order.build_status == ENGINEERING_REVIEW"
          - "the caller's X-User-ID != order.engineering_submitted_by_user_id (§1.4 priority 4)"
          - "order.chassis_id is not null and the bound Chassis.status == ALLOCATED"
          - "the AS_DESIGNED variant of calculations.axle_load_distribution satisfies gvw_lb <= gvwr_lb, front_axle_load_lb <= front_gawr_lb and rear_axle_load_lb <= rear_gawr_lb"
          - "the AS_DESIGNED payload_capacity_lb >= order.required_payload_lb"
          - "requested_in_service_date is null OR requested_in_service_date >= calculations.earliest_feasible_in_service_date"
          - "no EquipmentInstallation of the order in status IN {PLANNED, INSTALLED, COMMISSIONED} has hydraulic_status == DEFICIT"
          - "the order's BodySpec.requires_hydraulics == false OR at least one EquipmentInstallation in status IN {PLANNED, INSTALLED, COMMISSIONED} has a spec with requires_pto == true (else ERR_HYDRAULIC_SOURCE_MISSING)"
          - "every EquipmentInstallation whose spec has requires_can_gateway == true is matched by an ElectricalInterface of the order in status APPROVED with interface_method IN {CAN_GATEWAY, BODY_BUILDER_MODULE}"
          - "order.order_type == POOL_STOCK implies every EquipmentInstallation.equipment_spec_id IN BuildConfiguration.standard_equipment_spec_ids"
        side_effects:
          - "recomputes UpfitOrder.invoice_total_cents via calculations.build_invoice_total"
          - "increments UpfitOrder.version by 1"
      - from: RELEASED
        to: SCHEDULED
        trigger: "POST /upfit/build-slots (a slot for this order is created or promoted into status SCHEDULED)"
        actor: ProductionScheduler
        preconditions:
          - "order.build_status == RELEASED"
        side_effects:
          - "increments UpfitOrder.version by 1"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /upfit/build-slots/{build_slot_id}/cancel"
        actor: ProductionScheduler
        preconditions:
          - "after the cancellation the order has zero BuildSlot rows in status IN {SCHEDULED, IN_BUILD}"
        side_effects:
          - "increments UpfitOrder.version by 1"
      - from: SCHEDULED
        to: IN_BUILD
        trigger: "POST /upfit/build-slots/{build_slot_id}/start"
        actor: InstallTechnician
        preconditions:
          - "order.build_status == SCHEDULED"
          - "slot.status == SCHEDULED and the bound Chassis.status == ALLOCATED"
        side_effects:
          - "sets Chassis.status to IN_UPFIT"
          - "increments UpfitOrder.version by 1"
      - from: IN_BUILD
        to: BUILD_COMPLETE
        trigger: "POST /upfit/build-slots/{build_slot_id}/close"
        actor: InstallTechnician
        preconditions:
          - "order.build_status == IN_BUILD"
          - "after this closure the order has zero BuildSlot rows in status IN {QUEUED, SCHEDULED, IN_BUILD}"
          - "order.body_install_status == INSTALLED"
        side_effects:
          - "increments UpfitOrder.version by 1"
        note: "Bubble-up edge: the parent order advances only once every child slot is CLOSED or CANCELLED."
      - from: BUILD_COMPLETE
        to: IN_BUILD
        trigger: "system — cascade hop 4 of POST /upfit/equipment-installations/{equipment_installation_id}/remove"
        actor: system
        preconditions:
          - "order.build_status == BUILD_COMPLETE"
          - "the cascade has just moved compliance_status off LABELED"
        side_effects:
          - "reopens the order's most recently CLOSED BuildSlot (highest created_at) back to IN_BUILD"
          - "increments UpfitOrder.version by 1"
      - from: BUILD_COMPLETE
        to: DELIVERED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/deliver"
        actor: ProductionScheduler
        preconditions:
          - "order.build_status == BUILD_COMPLETE"
          - "order.compliance_status == LABELED"
          - "the bound Chassis.status == IN_UPFIT"
        side_effects:
          - "sets Chassis.status to COMPLETED"
          - "increments UpfitOrder.version by 1"
      - from: RELEASED
        to: CHASSIS_HOLD
        trigger: "system — cascade hop 1 of POST /upfit/chassis/{chassis_id}/return"
        actor: system
        preconditions: ["order.build_status IN {RELEASED, SCHEDULED, IN_BUILD}"]
        side_effects:
          - "clears chassis_id to null"
          - "increments UpfitOrder.version by 1"
      - from: SCHEDULED
        to: CHASSIS_HOLD
        trigger: "system — cascade hop 1 of POST /upfit/chassis/{chassis_id}/return"
        actor: system
        preconditions: ["order.build_status IN {RELEASED, SCHEDULED, IN_BUILD}"]
        side_effects:
          - "clears chassis_id to null; hop 2 then cancels the order's QUEUED/SCHEDULED/IN_BUILD slots"
          - "increments UpfitOrder.version by 1"
      - from: IN_BUILD
        to: CHASSIS_HOLD
        trigger: "system — cascade hop 1 of POST /upfit/chassis/{chassis_id}/return"
        actor: system
        preconditions: ["order.build_status IN {RELEASED, SCHEDULED, IN_BUILD}"]
        side_effects:
          - "clears chassis_id to null; hop 2 then cancels the order's QUEUED/SCHEDULED/IN_BUILD slots"
          - "increments UpfitOrder.version by 1"
      - from: CHASSIS_HOLD
        to: RELEASED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/allocate-chassis"
        actor: ProductionScheduler
        preconditions:
          - "order.build_status == CHASSIS_HOLD"
          - "the replacement chassis satisfies every allocate-chassis precondition"
        side_effects:
          - "sets chassis_id to the replacement unit"
          - "increments UpfitOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/cancel"
        actor: PlantAdmin
        preconditions: ["order.build_status IN {DRAFT, ENGINEERING_REVIEW, REWORK, RELEASED, SCHEDULED, CHASSIS_HOLD}"]
        side_effects:
          - "every BuildSlot of the order in status IN {QUEUED, SCHEDULED} transitions to CANCELLED"
          - "every EquipmentInstallation of the order in status PLANNED transitions to REMOVED, and UpfitOrder.committed_pto_flow_gpm is recomputed"
          - "when chassis_id is not null, the bound Chassis returns to status INSPECTED and its allocated_upfit_order_id is cleared"
          - "increments UpfitOrder.version by 1"
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/cancel"
        actor: PlantAdmin
        preconditions: ["order.build_status IN {DRAFT, ENGINEERING_REVIEW, REWORK, RELEASED, SCHEDULED, CHASSIS_HOLD}"]
        side_effects:
          - "same conditional cascade as DRAFT -> CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/cancel"
        actor: PlantAdmin
        preconditions: ["order.build_status IN {DRAFT, ENGINEERING_REVIEW, REWORK, RELEASED, SCHEDULED, CHASSIS_HOLD}"]
        side_effects:
          - "same conditional cascade as DRAFT -> CANCELLED"

  - entity: UpfitOrder
    state_field: compliance_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: DESIGN_CERTIFIED
        trigger: "POST /upfit/weight-certifications/{weight_certification_id}/approve (on a certification with basis == AS_DESIGNED)"
        actor: ComplianceOfficer
        preconditions:
          - "certification.status == DRAFT and certification.basis == AS_DESIGNED"
          - "order.compliance_status == NOT_STARTED"
        side_effects:
          - "increments UpfitOrder.version by 1"
        note: "This dimension advances regardless of where build_status sits, which is what makes the two dimensions independent."
      - from: DESIGN_CERTIFIED
        to: MEASURED_CERTIFIED
        trigger: "POST /upfit/weight-certifications/{weight_certification_id}/approve (on a certification with basis == AS_MEASURED)"
        actor: ComplianceOfficer
        preconditions:
          - "certification.status == DRAFT and certification.basis == AS_MEASURED"
          - "order.compliance_status == DESIGN_CERTIFIED"
          - "order.body_install_status == INSTALLED OR at least one EquipmentInstallation of the order is in status IN {INSTALLED, COMMISSIONED} — something the upfitter added must actually be bolted on before a measured basis means anything (else ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "increments UpfitOrder.version by 1"
      - from: MEASURED_CERTIFIED
        to: LABELED
        trigger: "POST /upfit/compliance-labels"
        actor: ComplianceOfficer
        preconditions:
          - "order.compliance_status == MEASURED_CERTIFIED"
          - "the cited WeightCertification has basis == AS_MEASURED, status == APPROVED and upfit_order_id == the order"
          - "the caller's X-User-ID differs from the cited WeightCertification.approved_by_user_id (§1.4 priority 4)"
        side_effects:
          - "creates the ComplianceLabel row with label_type and responsible_party from calculations.label_responsibility"
          - "increments UpfitOrder.version by 1"
      - from: LABELED
        to: LABELED
        trigger: "POST /upfit/compliance-labels (a correction that supersedes the label already on the truck)"
        actor: ComplianceOfficer
        preconditions:
          - "order.compliance_status == LABELED"
          - "supersedes_label_id is present and names the order's ComplianceLabel whose voided_at IS NULL — omitted on a LABELED order the request is refused with ERR_LABEL_ALREADY_ACTIVE (§1.4 priority 92), and naming a label whose voided_at is already stamped is refused with ERR_LABEL_ALREADY_SUPERSEDED (§1.4 priority 48)"
          - "the cited WeightCertification still has basis == AS_MEASURED, status == APPROVED and upfit_order_id == the order"
          - "the caller's X-User-ID differs from the cited WeightCertification.approved_by_user_id (§1.4 priority 4)"
        side_effects:
          - "stamps voided_at on the superseded label from the current logical clock"
          - "creates the replacement ComplianceLabel with label_type and responsible_party recomputed by calculations.label_responsibility"
          - "increments UpfitOrder.version by 1"
        note: "Self-loop edge. A label row is immutable (common_fields: false), so a correction is a new row plus a voided predecessor; the compliance dimension does not move."
      - from: LABELED
        to: DESIGN_CERTIFIED
        trigger: "system — cascade hops 2-3 of POST /upfit/equipment-installations/{equipment_installation_id}/remove"
        actor: system
        preconditions: ["order.compliance_status == LABELED"]
        side_effects:
          - "the order's APPROVED AS_MEASURED WeightCertification transitions to VOIDED with voided_reason COMPONENT_SET_CHANGED"
          - "because that certification was voided, every ComplianceLabel of the order with voided_at IS NULL gets voided_at stamped"
          - "increments UpfitOrder.version by 1"
      - from: MEASURED_CERTIFIED
        to: DESIGN_CERTIFIED
        trigger: "system — the order's APPROVED AS_MEASURED certification is voided while no label stands"
        actor: system
        preconditions: ["order.compliance_status == MEASURED_CERTIFIED"]
        side_effects:
          - "increments UpfitOrder.version by 1"
      - from: DESIGN_CERTIFIED
        to: NOT_STARTED
        trigger: "system — the order's APPROVED AS_DESIGNED certification is voided by PATCH /upfit/upfit-orders/{upfit_order_id}/body-mount"
        actor: system
        preconditions: ["order.compliance_status == DESIGN_CERTIFIED"]
        side_effects:
          - "the AS_DESIGNED certification transitions to VOIDED with voided_reason BODY_MOUNT_CHANGED"
          - "increments UpfitOrder.version by 1"

  - entity: UpfitOrder
    state_field: body_install_status
    initial_state: PLANNED
    terminal_states: [INSTALLED]
    transitions:
      - from: PLANNED
        to: INSTALLED
        trigger: "POST /upfit/upfit-orders/{upfit_order_id}/body-install"
        actor: InstallTechnician
        preconditions:
          - "order.build_status == IN_BUILD"
          - "order.body_install_status == PLANNED"
          - "body_actual_weight_lb is present in the request body"
        side_effects:
          - "stores body_actual_weight_lb (the AS_MEASURED basis prefers it over BodySpec.weight_lb)"
          - "increments UpfitOrder.version by 1"

  - entity: EquipmentInstallation
    state_field: status
    initial_state: PLANNED
    terminal_states: [REMOVED]
    transitions:
      - from: PLANNED
        to: INSTALLED
        trigger: "POST /upfit/equipment-installations/{equipment_installation_id}/install"
        actor: InstallTechnician
        preconditions:
          - "installation.status == PLANNED"
          - "the parent order's build_status == IN_BUILD"
          - "installation.hydraulic_status != DEFICIT"
          - "actual_weight_lb is present in the request body"
        side_effects:
          - "stores actual_weight_lb"
          - "because the installed component set changed, every APPROVED AS_MEASURED WeightCertification of the order transitions to VOIDED with voided_reason COMPONENT_SET_CHANGED, and the compliance_status cascade of that dimension follows"
          - "increments EquipmentInstallation.version by 1 and UpfitOrder.version by 1"
      - from: INSTALLED
        to: COMMISSIONED
        trigger: "POST /upfit/equipment-installations/{equipment_installation_id}/commission"
        actor: InstallTechnician
        preconditions:
          - "installation.status == INSTALLED"
          - "installation.hydraulic_status IN {NOT_APPLICABLE, OK}"
        side_effects:
          - "increments EquipmentInstallation.version by 1"
      - from: COMMISSIONED
        to: INSTALLED
        trigger: "POST /upfit/equipment-installations/{equipment_installation_id}/decommission"
        actor: InstallTechnician
        preconditions:
          - "installation.status == COMMISSIONED"
          - "the parent order's build_status IN {IN_BUILD, BUILD_COMPLETE}"
        side_effects:
          - "increments EquipmentInstallation.version by 1"
        note: "Closing edge of the INSTALLED <-> COMMISSIONED cycle; commissioning may be repeated any number of times."
      - from: PLANNED
        to: REMOVED
        trigger: "POST /upfit/equipment-installations/{equipment_installation_id}/remove"
        actor: InstallTechnician
        preconditions: ["installation.status IN {PLANNED, INSTALLED, COMMISSIONED}"]
        side_effects:
          - "recomputes UpfitOrder.committed_pto_flow_gpm and committed_aux_amp_draw, then re-runs calculations.pto_flow_waterfall"
          - "increments EquipmentInstallation.version by 1 and UpfitOrder.version by 1"
      - from: INSTALLED
        to: REMOVED
        trigger: "POST /upfit/equipment-installations/{equipment_installation_id}/remove"
        actor: InstallTechnician
        preconditions: ["installation.status IN {PLANNED, INSTALLED, COMMISSIONED}"]
        side_effects:
          - "CASCADE hop 1 — recomputes UpfitOrder.committed_pto_flow_gpm and committed_aux_amp_draw and, because the committed flow fell, re-runs calculations.pto_flow_waterfall so any sibling installation whose demand is now fully served flips hydraulic_status DEFICIT -> OK"
          - "CASCADE hop 2 — because the order's installed component set changed, every WeightCertification of the order with basis == AS_MEASURED and status == APPROVED transitions to VOIDED with voided_reason COMPONENT_SET_CHANGED"
          - "CASCADE hop 3 — because that certification was voided, every ComplianceLabel of the order with voided_at IS NULL gets voided_at stamped and UpfitOrder.compliance_status moves LABELED -> DESIGN_CERTIFIED"
          - "CASCADE hop 4 — because compliance_status left LABELED, an order sitting at build_status BUILD_COMPLETE reverts to IN_BUILD and its most recently CLOSED BuildSlot (highest created_at) reopens to IN_BUILD"
          - "increments EquipmentInstallation.version by 1 and UpfitOrder.version by 1"
      - from: COMMISSIONED
        to: REMOVED
        trigger: "POST /upfit/equipment-installations/{equipment_installation_id}/remove"
        actor: InstallTechnician
        preconditions: ["installation.status IN {PLANNED, INSTALLED, COMMISSIONED}"]
        side_effects:
          - "same four-hop cascade as INSTALLED -> REMOVED"

  - entity: ElectricalInterface
    state_field: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /upfit/electrical-interfaces/{electrical_interface_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "interface.status == PROPOSED"
          - "the parent order's build_status IN {DRAFT, ENGINEERING_REVIEW, REWORK, RELEASED, SCHEDULED, IN_BUILD}"
          - "calculations.aux_electrical_load computed with this interface counted <= the chassis model's max_aux_amp_draw"
        side_effects:
          - "stores approved_by_user_id from the caller's X-User-ID"
          - "recomputes UpfitOrder.committed_aux_amp_draw and UpfitOrder.chassis_warranty_status"
          - "every other APPROVED ElectricalInterface of the same order with the same signal_source transitions to SUPERSEDED, and committed_aux_amp_draw is recomputed again without their draw"
          - "increments ElectricalInterface.version by 1 and UpfitOrder.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /upfit/electrical-interfaces/{electrical_interface_id}/reject"
        actor: ComplianceOfficer
        preconditions: ["interface.status == PROPOSED"]
        side_effects:
          - "increments ElectricalInterface.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — a later ElectricalInterface with the same signal_source is approved on the same order"
        actor: system
        preconditions: ["interface.status == APPROVED"]
        side_effects:
          - "its circuit_amp_draw drops out of UpfitOrder.committed_aux_amp_draw and out of the chassis_warranty_status derivation"
          - "increments ElectricalInterface.version by 1"

  - entity: BuildSlot
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: QUEUED
        to: SCHEDULED
        trigger: "system — calculations.queue_promotion_selector after a sibling slot in the same bay is CANCELLED"
        actor: system
        preconditions:
          - "slot.status == QUEUED"
          - "the bay's overlapping SCHEDULED/IN_BUILD count for this slot's half-open window is now < WorkBay.concurrent_capacity"
          - "the slot still passes the chassis-occupancy rule of §1.4 priority 61"
        side_effects:
          - "stamps promoted_from_queue_at with the current logical-clock instant"
          - "moves the slot's UpfitOrder.build_status RELEASED -> SCHEDULED"
          - "increments BuildSlot.version by 1"
      - from: SCHEDULED
        to: IN_BUILD
        trigger: "POST /upfit/build-slots/{build_slot_id}/start"
        actor: InstallTechnician
        preconditions:
          - "slot.status == SCHEDULED"
          - "the bound Chassis.status == ALLOCATED"
          - "WorkBay.status == ACTIVE"
        side_effects:
          - "sets Chassis.status to IN_UPFIT and UpfitOrder.build_status to IN_BUILD"
          - "increments BuildSlot.version by 1"
      - from: IN_BUILD
        to: CLOSED
        trigger: "POST /upfit/build-slots/{build_slot_id}/close"
        actor: InstallTechnician
        preconditions:
          - "slot.status == IN_BUILD"
        side_effects:
          - "when the order then has zero slots in status IN {QUEUED, SCHEDULED, IN_BUILD} and body_install_status == INSTALLED, UpfitOrder.build_status moves IN_BUILD -> BUILD_COMPLETE"
          - "increments BuildSlot.version by 1"
      - from: CLOSED
        to: IN_BUILD
        trigger: "system — cascade hop 4 of POST /upfit/equipment-installations/{equipment_installation_id}/remove"
        actor: system
        preconditions:
          - "slot.status == CLOSED and it is the order's CLOSED slot with the highest created_at"
          - "the order's build_status is reverting BUILD_COMPLETE -> IN_BUILD"
        side_effects:
          - "increments BuildSlot.version by 1"
        note: "Compensation edge: reopening the last closed slot is what makes the BUILD_COMPLETE revert observable on the slot as well as on the order."
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /upfit/build-slots/{build_slot_id}/cancel"
        actor: ProductionScheduler
        preconditions: ["slot.status IN {QUEUED, SCHEDULED, IN_BUILD}"]
        side_effects:
          - "increments BuildSlot.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /upfit/build-slots/{build_slot_id}/cancel"
        actor: ProductionScheduler
        preconditions: ["slot.status IN {QUEUED, SCHEDULED, IN_BUILD}"]
        side_effects:
          - "because a bay window was freed, calculations.queue_promotion_selector runs for this WorkBay and promotes at most one QUEUED slot to SCHEDULED"
          - "when the order then has zero slots in status IN {SCHEDULED, IN_BUILD}, its build_status moves SCHEDULED -> RELEASED"
          - "increments BuildSlot.version by 1"
      - from: IN_BUILD
        to: CANCELLED
        trigger: "POST /upfit/build-slots/{build_slot_id}/cancel"
        actor: ProductionScheduler
        preconditions: ["slot.status IN {QUEUED, SCHEDULED, IN_BUILD}"]
        side_effects:
          - "same bay-promotion side effect as SCHEDULED -> CANCELLED"

  - entity: WeightCertification
    state_field: status
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /upfit/weight-certifications/{weight_certification_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "certification.status == DRAFT"
          - "the caller's X-User-ID != certification.created_by_user_id"
          - "basis == AS_DESIGNED requires order.compliance_status == NOT_STARTED; basis == AS_MEASURED requires order.compliance_status == DESIGN_CERTIFIED and (order.body_install_status == INSTALLED OR at least one EquipmentInstallation of the order in status IN {INSTALLED, COMMISSIONED})"
        side_effects:
          - "stores approved_by_user_id"
          - "advances UpfitOrder.compliance_status one step on the compliance dimension"
          - "increments WeightCertification.version by 1 and UpfitOrder.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system — POST /upfit/weight-certifications creates a newer certification with the same basis for the same order"
        actor: system
        preconditions: ["certification.status == DRAFT"]
        side_effects:
          - "stores voided_reason SUPERSEDED_BY_NEWER_DRAFT"
          - "increments WeightCertification.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "system — the order's component set or body mount changed (equipment install/remove, body-mount patch, or a newer certification of the same basis)"
        actor: system
        preconditions: ["certification.status == APPROVED"]
        side_effects:
          - "stores voided_reason from {COMPONENT_SET_CHANGED, BODY_MOUNT_CHANGED, SUPERSEDED_BY_NEWER_DRAFT}"
          - "because the certification was voided, the order's compliance_status steps back one level on its dimension and any standing ComplianceLabel is voided"
          - "increments WeightCertification.version by 1"

  - entity: WarrantyClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [PAID]
    transitions:
      - from: SUBMITTED
        to: INSPECTED
        trigger: "POST /upfit/warranty-claims/{warranty_claim_id}/inspect"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status IN {SUBMITTED, DISPUTED}"
        side_effects:
          - "stores taint_confirmed from the request body"
          - "increments WarrantyClaim.version by 1"
      - from: DISPUTED
        to: INSPECTED
        trigger: "POST /upfit/warranty-claims/{warranty_claim_id}/inspect"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status IN {SUBMITTED, DISPUTED}"
        side_effects:
          - "overwrites taint_confirmed from the request body"
          - "increments WarrantyClaim.version by 1"
        note: "Closing edge of the re-adjudication cycle ADJUDICATED -> DISPUTED -> INSPECTED -> ADJUDICATED."
      - from: INSPECTED
        to: ADJUDICATED
        trigger: "POST /upfit/warranty-claims/{warranty_claim_id}/adjudicate"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == INSPECTED"
          - "the FINAL upfitter share would keep order.upfitter_liability_cents (recomputed with this claim included) <= order.warranty_liability_cap_cents, unless override_liability_cap == true"
        side_effects:
          - "sets split_basis to FINAL and restamps chassis_pct/upfitter_pct/goodwill_pct and the three cents fields from the FINAL variant of calculations.warranty_liability_split"
          - "recomputes UpfitOrder.chassis_liability_cents, upfitter_liability_cents and customer_goodwill_cents as sums over the order's claims in status IN {ADJUDICATED, PAID}"
          - "increments WarrantyClaim.version by 1 and UpfitOrder.version by 1"
      - from: ADJUDICATED
        to: DISPUTED
        trigger: "POST /upfit/warranty-claims/{warranty_claim_id}/dispute"
        actor: Customer
        preconditions:
          - "claim.status == ADJUDICATED"
          - "when the caller's role is Customer, X-User-ID == the order's customer_id; a WarrantyAdministrator may dispute on the customer's behalf"
        side_effects:
          - "the claim leaves the {ADJUDICATED, PAID} set, so UpfitOrder.chassis_liability_cents, upfitter_liability_cents and customer_goodwill_cents are recomputed without it"
          - "the claim's own chassis_liability_cents / upfitter_liability_cents / customer_goodwill_cents and split_basis are left untouched"
          - "increments WarrantyClaim.version by 1 and UpfitOrder.version by 1"
      - from: ADJUDICATED
        to: PAID
        trigger: "POST /upfit/warranty-claims/{warranty_claim_id}/pay"
        actor: WarrantyAdministrator
        preconditions: ["claim.status == ADJUDICATED"]
        side_effects:
          - "the claim stays inside the {ADJUDICATED, PAID} ledger set, so the order's three liability fields are unchanged"
          - "increments WarrantyClaim.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: certification-create-stale-order
    parent_entity: UpfitOrder
    write_endpoint: "POST /upfit/weight-certifications"
    occ_field: "expected_upfit_order_version"
    description: |
      Drafting a WeightCertification against an UpfitOrder whose version has advanced past the
      version the client last observed is rejected. A newer certification of the same basis
      legitimately voids the prior one, so a client working from a stale view of the order would
      silently supersede a certification drafted from a component set it never saw; the version
      check turns that into a deterministic rejection.
    error_id: ERR_STALE_UPFIT_ORDER_VERSION
    http_status: 412
  - rule_id: allocate-chassis-stale-chassis
    parent_entity: Chassis
    write_endpoint: "POST /upfit/upfit-orders/{upfit_order_id}/allocate-chassis"
    occ_field: "expected_chassis_version"
    description: |
      Allocating a Chassis whose version has advanced past the version the client last observed is
      rejected. Pool-stock re-allocation is legitimate — an ALLOCATED unit may be rebound to another
      order under §1.2 Chassis ALLOCATED -> ALLOCATED — so a client holding a stale view of the unit
      would otherwise pull it off an order it never inspected; the version check makes the loser
      deterministic.
    error_id: ERR_STALE_CHASSIS_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: axle_load_distribution
    trigger: |
      Runs on POST /upfit/weight-certifications (stamping front_axle_load_lb, rear_axle_load_lb,
      gvw_lb and included_component_count on the new row), on GET
      /upfit/upfit-orders/{upfit_order_id}/weight-projection (read-only, both bases), and as the
      safety gate inside the UpfitOrder ENGINEERING_REVIEW -> RELEASED transition (AS_DESIGNED only).
    algorithm: constraint_propagation
    formula: |
      WB  = ChassisModel.wheelbase_in                       # of the order's chassis model (see input_set)
      # --- inclusion set ------------------------------------------------------
      items = []
      if body_included(basis):
          items += [ (body_weight(basis), order.body_mount_offset_from_front_axle_in
                                          + BodySpec.cg_from_body_front_in) ]
      for inst in equipment_included(basis):                # ordered by created_at ASC; order does not affect the sum
          items += [ (equipment_weight(basis, inst), inst.mount_cg_from_front_axle_in) ]
      included_component_count = len(items)
      # --- moment balance about the axle pair ----------------------------------
      # Each item's weight splits between the axles by its distance behind the FRONT axle.
      # Contributions are accumulated at full float precision; NO per-item rounding.
      front_acc = curb_front(basis)
      rear_acc  = curb_rear(basis)
      for (W, cg) in items:
          rear_i  = W * cg / WB                             # may exceed W when cg > WB (rear overhang)
          front_i = W - rear_i                              # may be negative: the item unloads the front axle
          rear_acc  += rear_i
          front_acc += front_i
      # --- single rounding step, then the sum of the ROUNDED axle loads --------
      front_axle_load_lb = round_half_up(front_acc, 0)
      rear_axle_load_lb  = round_half_up(rear_acc, 0)
      gvw_lb             = front_axle_load_lb + rear_axle_load_lb   # NOT round(front_acc + rear_acc)
    input_set: |
      The chassis model is UpfitOrder.chassis_id -> Chassis.chassis_model_id when a unit is allocated,
      otherwise BuildConfiguration.chassis_model_id. Per-basis inclusion and weight sourcing:
        AS_DESIGNED — body_included = true always; body_weight = BodySpec.weight_lb;
          equipment_included = EquipmentInstallation rows of the order with
          status IN {PLANNED, INSTALLED, COMMISSIONED}; equipment_weight = EquipmentSpec.weight_lb;
          curb_front = ChassisModel.curb_front_axle_lb; curb_rear = ChassisModel.curb_rear_axle_lb.
        AS_MEASURED — body_included = (order.body_install_status == INSTALLED);
          body_weight = order.body_actual_weight_lb when present else BodySpec.weight_lb;
          equipment_included = EquipmentInstallation rows with status IN {INSTALLED, COMMISSIONED}
          (PLANNED rows are excluded — nothing is on the truck yet);
          equipment_weight = inst.actual_weight_lb when present else EquipmentSpec.weight_lb;
          curb_front = Chassis.measured_front_axle_weight_lb;
          curb_rear = Chassis.measured_rear_axle_weight_lb.
      REMOVED installations are excluded under both bases. There is no tie-break to pin: the
      accumulation is a sum, so item order cannot change the result.
    constants: {}
    precision: "Whole pounds. round_half_up applied exactly twice — once to front_acc, once to rear_acc. gvw_lb is the sum of those two rounded integers."
    variants:
      - name: AS_DESIGNED
        when: "basis == AS_DESIGNED — drafted before or during the build; the only basis the release safety gate uses"
        difference: "Reads book curb weights and catalog component weights, and counts PLANNED equipment plus the body whether or not it is physically mounted, so it answers 'what will this truck weigh when built as drawn'."
      - name: AS_MEASURED
        when: "basis == AS_MEASURED — drafted after the body is installed; the only basis a ComplianceLabel may cite"
        difference: "Reads the chassis scale ticket captured at inspection and the scale-verified actual weights of components that are physically on the truck, and drops PLANNED equipment entirely, so it answers 'what does this truck weigh right now'. For identical entity data the two bases return different front_axle_load_lb, rear_axle_load_lb, gvw_lb and payload_capacity_lb."

  - name: payload_capacity
    trigger: "Runs immediately after axle_load_distribution, on the same events, stamping WeightCertification.payload_capacity_lb; also the value compared against UpfitOrder.required_payload_lb by the release gate."
    algorithm: threshold
    formula: |
      WB = ChassisModel.wheelbase_in
      c  = order.body_mount_offset_from_front_axle_in + BodySpec.cargo_cg_from_body_front_in
      rear_share  = c / WB                 # fraction of added payload landing on the rear axle
      front_share = 1 - rear_share         # negative when the cargo centroid sits behind the rear axle
      candidates = [ ChassisModel.gvwr_lb - gvw_lb ]                              # (1) GVWR headroom
      candidates += [ (ChassisModel.rear_gawr_lb - rear_axle_load_lb) / rear_share ]   # (2) rear axle headroom
      if front_share > 0:                                                          # (3) CONDITIONAL TERM
          candidates += [ (ChassisModel.front_gawr_lb - front_axle_load_lb) / front_share ]
      # When front_share <= 0 the payload UNLOADS the front axle, so no front-axle
      # ceiling exists and term (3) is omitted from the min entirely.
      payload_capacity_lb = max(0, round_half_up(min(candidates), 0))
    input_set: "Consumes the front_axle_load_lb / rear_axle_load_lb / gvw_lb of the same basis, so payload_capacity_lb is basis-specific. rear_share uses WB > 0 (guaranteed by ChassisModel.wheelbase_in >= 1)."
    constants: {}
    precision: "min() is taken over UNROUNDED candidates; round_half_up to whole pounds happens once, on the minimum. Negative minima are floored to 0."
    variants:
      - name: AS_DESIGNED
        when: "consumed by the release gate and by AS_DESIGNED certifications"
        difference: "Book curb weights and PLANNED-inclusive axle loads leave less headroom than the measured basis whenever planned equipment is not yet mounted."
      - name: AS_MEASURED
        when: "consumed by the ComplianceLabel's certified_payload_lb"
        difference: "Scale-ticket axle loads and installed-only components; this is the number that appears on the final-stage label."

  - name: aux_electrical_load
    trigger: "Runs on POST /upfit/electrical-interfaces (as a pre-insert check), on POST /upfit/electrical-interfaces/{electrical_interface_id}/approve, on POST /upfit/equipment-installations, and on the equipment remove transition; stamps UpfitOrder.committed_aux_amp_draw."
    algorithm: aggregation
    formula: |
      committed_aux_amp_draw =
            BodySpec.aux_amp_draw                                   # counted from order creation onward
          + sum(EquipmentSpec.aux_amp_draw
                for inst in EquipmentInstallation
                if inst.upfit_order_id == order.id
                   and inst.status IN {PLANNED, INSTALLED, COMMISSIONED})
          + sum(iface.circuit_amp_draw
                for iface in ElectricalInterface
                if iface.upfit_order_id == order.id
                   and iface.status == APPROVED)
      # Ceiling test, evaluated with the candidate row counted in:
      ACCEPT when committed_aux_amp_draw <= ChassisModel.max_aux_amp_draw
      REJECT with ERR_AUX_ELECTRICAL_LOAD_EXCEEDED when committed_aux_amp_draw > ChassisModel.max_aux_amp_draw
    input_set: "PROPOSED, REJECTED and SUPERSEDED interfaces contribute nothing; REMOVED installations contribute nothing. ChassisModel is the allocated Chassis.chassis_model_id when order.chassis_id is not null, otherwise BuildConfiguration.chassis_model_id. Sum order is irrelevant (integers)."
    constants: {}
    precision: "Whole amps; no rounding."

  - name: electrical_warranty_impact
    trigger: "Runs on POST /upfit/electrical-interfaces, stamping ElectricalInterface.warranty_impact; the APPROVED subset then determines UpfitOrder.chassis_warranty_status."
    algorithm: constraint_propagation
    formula: |
      # (interface_method, ChassisModel.electrical_bus) -> warranty_impact
      IMPACT_TABLE = {
        (BODY_BUILDER_MODULE, J1939_CAN): NONE,
        (BODY_BUILDER_MODULE, DISCRETE) : NONE,
        (CAN_GATEWAY,         J1939_CAN): CONDITIONAL,
        (CAN_GATEWAY,         DISCRETE) : NONE,
        (DIRECT_SPLICE,       J1939_CAN): VOIDS,
        (DIRECT_SPLICE,       DISCRETE) : CONDITIONAL,
      }
      warranty_impact = IMPACT_TABLE[(interface_method, electrical_bus)]
      # Creation gate: a VOIDS row is refused unless the customer signed the waiver.
      if warranty_impact == VOIDS and customer_warranty_waiver_ack == false:
          REJECT with ERR_CHASSIS_WARRANTY_VOIDING_INTERFACE
      # Order-level posture, recomputed after every approve / supersede:
      RANK = { INTACT: 0, CONDITIONAL: 1, VOIDED: 2 }
      approved = [i for i in ElectricalInterface
                  if i.upfit_order_id == order.id and i.status == APPROVED]
      chassis_warranty_status = INTACT if approved is empty
                                else the member of {CONDITIONAL, VOIDED} with the highest RANK
                                     among approved rows (NONE maps to INTACT, VOIDS maps to VOIDED)
    input_set: "Only ElectricalInterface rows with status == APPROVED enter the posture. The empty set yields INTACT — that is the sole producer of INTACT after any interface work."
    constants: {}
    precision: "Enumerated; no arithmetic."

  - name: pto_flow_waterfall
    trigger: "Runs on POST /upfit/equipment-installations, on the equipment remove transition, and on POST /upfit/upfit-orders/{upfit_order_id}/allocate-chassis; restamps EquipmentInstallation.allocated_flow_gpm and hydraulic_status for every candidate row and UpfitOrder.committed_pto_flow_gpm."
    algorithm: waterfall_allocation
    formula: |
      pool = ChassisModel.pto_max_flow_gpm of the ALLOCATED Chassis
             (exactly 0 when order.chassis_id is null — no unit, no hydraulic supply)
      candidates = [ inst for inst in EquipmentInstallation
                     if inst.upfit_order_id == order.id
                        and inst.status IN {PLANNED, INSTALLED, COMMISSIONED}
                        and EquipmentSpec.requires_pto == true ]
      # Deterministic service order: duty_priority ASC, then created_at ASC.
      # `id` MUST NOT participate in the ordering.
      candidates.sort(key = (EquipmentSpec.duty_priority ASC, EquipmentInstallation.created_at ASC))
      committed_pto_flow_gpm = sum(EquipmentSpec.required_flow_gpm for inst in candidates)
      remaining = pool
      for inst in candidates:
          demand   = EquipmentSpec.required_flow_gpm
          granted  = min(demand, remaining)
          inst.allocated_flow_gpm = granted
          inst.hydraulic_status   = OK if granted == demand else DEFICIT
          remaining -= granted
      for every other EquipmentInstallation of the order (non-PTO spec, or status == REMOVED):
          inst.allocated_flow_gpm = 0
          inst.hydraulic_status   = NOT_APPLICABLE
      # Insert-time gate on POST /upfit/equipment-installations:
      if EquipmentSpec.requires_pto and ChassisModel.pto_provision == NONE:
          REJECT with ERR_PTO_NOT_PROVISIONED
      if order.chassis_id is not null
         and EquipmentSpec.requires_pto
         and committed_pto_flow_gpm (with the candidate row counted)
             > ChassisModel.pto_max_flow_gpm:
          REJECT with ERR_PTO_FLOW_CAPACITY_EXCEEDED
      # The flow gate is deferred while no unit is bound: the pool belongs to the physical
      # chassis, not to the book. Installations planned before allocation therefore start at
      # DEFICIT (pool 0) and flip to OK when allocate-chassis re-runs this waterfall.
      # pto_provision, by contrast, is a book property and IS checked pre-allocation using
      # BuildConfiguration.chassis_model_id.
    input_set: "Candidate set is exactly the order's non-REMOVED PTO installations. The insert gate makes over-subscription unreachable at creation; DEFICIT rows can only appear after allocate-chassis rebinds the order to a model with a smaller pto_max_flow_gpm."
    constants: {}
    precision: "Whole gallons per minute; no rounding. `<=` is the accepting comparison, so a demand exactly equal to the remaining pool is granted."

  - name: earliest_feasible_in_service_date
    trigger: "Runs inside the UpfitOrder ENGINEERING_REVIEW -> RELEASED transition whenever requested_in_service_date is not null."
    algorithm: interval_merge
    formula: |
      base_days = BODY_BUILD_LEAD_DAYS[BodySpec.body_type]
      pto_items     = count(inst for inst in EquipmentInstallation
                            if inst.upfit_order_id == order.id
                               and inst.status IN {PLANNED, INSTALLED, COMMISSIONED}
                               and EquipmentSpec.requires_pto == true)
      non_pto_items = count(inst for inst in EquipmentInstallation
                            if inst.upfit_order_id == order.id
                               and inst.status IN {PLANNED, INSTALLED, COMMISSIONED}
                               and EquipmentSpec.requires_pto == false)
      total_days = base_days + PTO_INTEGRATION_DAYS * pto_items
                             + AUX_INTEGRATION_DAYS * non_pto_items
      start_date = max( date_part(current logical clock UTC), Chassis.availability_date )
      earliest_feasible_in_service_date = start_date + total_days calendar days
      ACCEPT when requested_in_service_date >= earliest_feasible_in_service_date
      REJECT with ERR_IN_SERVICE_DATE_INFEASIBLE otherwise
    input_set: "Counts only the order's non-REMOVED installations. Chassis is the allocated unit (release already requires chassis_id to be non-null), so availability_date is always defined here."
    constants:
      BODY_BUILD_LEAD_DAYS: { SERVICE: 21, DUMP: 18, FLATBED: 12, VAN: 25 }
      PTO_INTEGRATION_DAYS: 5
      AUX_INTEGRATION_DAYS: 2
    precision: "Whole calendar days added to a date; comparison is date-only, `>=` accepts the boundary date exactly."

  - name: build_invoice_total
    trigger: "Runs inside the UpfitOrder ENGINEERING_REVIEW -> RELEASED transition and on PATCH /upfit/upfit-orders/{upfit_order_id}/body-mount when build_status IN {RELEASED, SCHEDULED, IN_BUILD}; stamps UpfitOrder.invoice_total_cents."
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — subtotal (integer cents; no rounding needed)
      subtotal_cents = BodySpec.list_price_cents
                     + sum(EquipmentSpec.list_price_cents
                           for inst in EquipmentInstallation
                           if inst.upfit_order_id == order.id
                              and inst.status IN {PLANNED, INSTALLED, COMMISSIONED})
                     + LABOR_HOURS[BodySpec.body_type] * LABOR_RATE_CENTS_PER_HOUR
      # STEP 2 — standardization discount, POOL_STOCK orders only
      pct = STANDARDIZATION_DISCOUNT_PCT[BuildConfiguration.standardization_tier]
            if order.order_type == POOL_STOCK else 0
      discount_cents          = round_half_up(subtotal_cents * pct, 0)
      discounted_subtotal_cents = subtotal_cents - discount_cents
      # STEP 3 — final-stage certification fee, keyed on the DISCOUNTED subtotal.
      #   EVALUATION ORDER IS PINNED HERE: the fee tier is selected from
      #   discounted_subtotal_cents, never from subtotal_cents and never from the
      #   total that the fee itself is part of. This resolves the apparent circularity
      #   total = discounted_subtotal + fee(total).
      final_stage_cert_fee_cents =
            CERT_FEE_TIERS[0].fee if discounted_subtotal_cents <  2000000
       else CERT_FEE_TIERS[1].fee if discounted_subtotal_cents <  4000000
       else CERT_FEE_TIERS[2].fee
      # STEP 4 — total
      invoice_total_cents = discounted_subtotal_cents + final_stage_cert_fee_cents
    input_set: "Equipment prices come from the order's installations in status IN {PLANNED, INSTALLED, COMMISSIONED}; REMOVED rows drop out, which is why a remove during build changes the invoice on the next recompute. Sum order is irrelevant (integers)."
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 11500
      LABOR_HOURS: { SERVICE: 18, DUMP: 14, FLATBED: 10, VAN: 22 }
      STANDARDIZATION_DISCOUNT_PCT: { TIER_A: 0.08, TIER_B: 0.04, CUSTOM: 0.00 }
      CERT_FEE_TIERS:
        - { upper_bound_exclusive_cents: 2000000, fee: 45000 }
        - { upper_bound_exclusive_cents: 4000000, fee: 72500 }
        - { upper_bound_exclusive_cents: null, fee: 98000 }
    precision: "Integer cents. round_half_up is applied exactly once, to the discount amount; the tier comparison uses `<` against the exclusive upper bound so a discounted subtotal of exactly 2000000 lands in the second tier."

  - name: warranty_liability_split
    trigger: "The PROVISIONAL variant runs on POST /upfit/warranty-claims; the FINAL variant runs on POST /upfit/warranty-claims/{warranty_claim_id}/adjudicate. Both stamp chassis_pct/upfitter_pct/goodwill_pct and the three cents fields on the claim; adjudication also restamps the order's three liability fields."
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — base percentage split keyed on failure_system
      (chassis_pct, upfitter_pct, goodwill_pct) = BASE_SPLIT_PCT[failure_system]
      # STEP 2 — taint shift, FINAL variant only
      if variant == FINAL
         and claim.taint_confirmed == true
         and failure_system IN {CHASSIS_ENGINE, CHASSIS_TRANSMISSION, CHASSIS_BRAKES, CHASSIS_ELECTRICAL}
         and UpfitOrder.chassis_warranty_status IN {CONDITIONAL, VOIDED}:
             shift        = min(TAINT_SHIFT_PCT, chassis_pct)     # chassis share floors at 0
             chassis_pct  = chassis_pct  - shift
             upfitter_pct = upfitter_pct + shift
      # STEP 3 — cents apportionment in a PINNED PARTY ORDER, remainder to the last party
      chassis_liability_cents  = round_half_up(claim_cost_cents * chassis_pct  / 100, 0)
      upfitter_liability_cents = round_half_up(claim_cost_cents * upfitter_pct / 100, 0)
      customer_goodwill_cents  = claim_cost_cents - chassis_liability_cents
                                                  - upfitter_liability_cents
      # goodwill_pct is reported for transparency but is NEVER used to round the third
      # share: rounding all three independently can sum to claim_cost_cents +/- 1 cent.
      # STEP 4 — order ledger (only claims inside the posted set)
      UpfitOrder.chassis_liability_cents  = sum(c.chassis_liability_cents  for c in claims of the order if c.status IN {ADJUDICATED, PAID})
      UpfitOrder.upfitter_liability_cents = sum(c.upfitter_liability_cents for c in claims of the order if c.status IN {ADJUDICATED, PAID})
      UpfitOrder.customer_goodwill_cents  = sum(c.customer_goodwill_cents  for c in claims of the order if c.status IN {ADJUDICATED, PAID})
      # STEP 5 — fiscal ceiling, checked at adjudication only
      if UpfitOrder.upfitter_liability_cents (recomputed with this claim posted)
             > UpfitOrder.warranty_liability_cap_cents and override_liability_cap != true:
          REJECT with ERR_WARRANTY_BUDGET_EXCEEDED
    input_set: "Claims in status IN {SUBMITTED, INSPECTED, DISPUTED} are outside the posted set and contribute nothing to the order ledger. Ledger sums have no tie-break to pin (integer addition)."
    constants:
      TAINT_SHIFT_PCT: 45
      BASE_SPLIT_PCT:
        CHASSIS_ENGINE: { chassis: 95, upfitter: 0, goodwill: 5 }
        CHASSIS_TRANSMISSION: { chassis: 95, upfitter: 0, goodwill: 5 }
        CHASSIS_BRAKES: { chassis: 95, upfitter: 0, goodwill: 5 }
        CHASSIS_ELECTRICAL: { chassis: 60, upfitter: 35, goodwill: 5 }
        BODY_STRUCTURE: { chassis: 0, upfitter: 95, goodwill: 5 }
        BODY_ELECTRICAL: { chassis: 0, upfitter: 95, goodwill: 5 }
        HYDRAULICS: { chassis: 0, upfitter: 95, goodwill: 5 }
    precision: "Integer cents. round_half_up applied exactly twice, to the chassis share then the upfitter share, in that order; the goodwill share is the arithmetic remainder so the three cents fields always sum to claim_cost_cents exactly."
    variants:
      - name: PROVISIONAL
        when: "stamped at claim submission, before teardown"
        difference: "Uses the base table alone — taint_confirmed is still false and no shift is applied, so a CHASSIS_ELECTRICAL claim reads 60/35/5."
      - name: FINAL
        when: "restamped at adjudication, after teardown recorded taint_confirmed"
        difference: "Applies the 45-point taint shift when teardown confirmed an upfitter interface on a chassis-side failure and the order's chassis_warranty_status is CONDITIONAL or VOIDED, so the same CHASSIS_ELECTRICAL claim reads 15/80/5 and both cents shares move."

  - name: label_responsibility
    trigger: "Runs on POST /upfit/compliance-labels, stamping ComplianceLabel.label_type and responsible_party."
    algorithm: threshold
    formula: |
      installed_equipment_count = count(inst for inst in EquipmentInstallation
                                        if inst.upfit_order_id == order.id
                                           and inst.status IN {INSTALLED, COMMISSIONED})
      if order.body_install_status == INSTALLED and installed_equipment_count >= 1:
          # A body on the frame plus integrated equipment: the upfitter completed the vehicle.
          label_type = FINAL_STAGE;            responsible_party = UPFITTER
      elif order.body_install_status == INSTALLED:
          # A body and nothing else: a mere alteration of the incomplete vehicle.
          label_type = ALTERER;                responsible_party = UPFITTER
      else:
          # Equipment bolted to a still-bodiless chassis: the vehicle remains incomplete and the
          # incomplete vehicle document passes conformity certification back to the chassis maker.
          label_type = INCOMPLETE_PASSTHROUGH; responsible_party = CHASSIS_MANUFACTURER
      certified_gvwr_lb       = ChassisModel.gvwr_lb
      certified_front_gawr_lb = ChassisModel.front_gawr_lb
      certified_rear_gawr_lb  = ChassisModel.rear_gawr_lb
      certified_payload_lb    = the cited WeightCertification.payload_capacity_lb
    input_set: >
      PLANNED and REMOVED installations do not count toward installed_equipment_count. All three
      label types are reachable because the AS_MEASURED certification gate (§1.2 WeightCertification
      DRAFT -> APPROVED) accepts EITHER a mounted body OR at least one INSTALLED/COMMISSIONED
      equipment item: body + equipment yields FINAL_STAGE, body alone yields ALTERER, and equipment
      on a bodiless chassis yields INCOMPLETE_PASSTHROUGH with conformity left to the chassis maker.
    constants: {}
    precision: "Enumerated; the ratings are copied as integers."

  - name: queue_promotion_selector
    trigger: "Runs whenever a BuildSlot in a bay leaves the {SCHEDULED, IN_BUILD} set — POST /upfit/build-slots/{build_slot_id}/cancel, and cascade hop 3 of POST /upfit/chassis/{chassis_id}/return."
    algorithm: chronological
    formula: |
      # (a) ELIGIBILITY FILTER — candidate set
      candidates = [ s for s in BuildSlot
                     if s.work_bay_id == freed_slot.work_bay_id
                        and s.status == QUEUED
                        and WorkBay.status == ACTIVE
                        and s.upfit_order_id's order.build_status == RELEASED ]
      # (b) RANKING EXPRESSION
      candidates.sort(key = (s.start_date ASC, s.created_at ASC))
      # (c) TIE-BREAK — created_at ASC, applied above; `id` MUST NOT be consulted
      # (d) EMPTY-POOL FALLBACK — when candidates is empty the cancellation completes
      #     with no promotion; this is a no-op, never an error.
      for s in candidates:                      # at most ONE promotion per freed slot
          overlapping = count(o for o in BuildSlot
                              if o.work_bay_id == s.work_bay_id
                                 and o.id != s.id
                                 and o.status IN {SCHEDULED, IN_BUILD}
                                 and o.start_date < s.end_date and s.start_date < o.end_date)
          chassis_clash = exists(o for o in BuildSlot
                                 if o.chassis_id == s.chassis_id
                                    and o.id != s.id
                                    and o.status IN {QUEUED, SCHEDULED, IN_BUILD}
                                    and o.start_date <= s.end_date and s.start_date <= o.end_date)
          if overlapping < WorkBay.concurrent_capacity and not chassis_clash:
              promote s to SCHEDULED, stamp promoted_from_queue_at, move its order
              RELEASED -> SCHEDULED, and STOP scanning
          else:
              continue to the next candidate
    input_set: "Only QUEUED slots of the same WorkBay whose order is still RELEASED are eligible; slots of CHASSIS_HOLD or CANCELLED orders are skipped. At most one slot is promoted per freed slot even when several become feasible."
    constants: {}
    precision: "Integer counts; the bay overlap test is half-open and the chassis test is closed, exactly as in §1.4 priorities 62 and 61."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins when a
#      single request violates several rules)
# =============================================================================
validations:
  # ---- authentication / authorization -------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the §1.7 role names; X-User-ID header present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's roles: list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "When the acting role is Customer, X-User-ID must equal the customer_id of the UpfitOrder reached through the path (directly, or via the order of an installation / interface / slot / certification / label / claim). A Customer reading another account's resource is refused."
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all GET /upfit/... reads and POST /upfit/warranty-claims"
  - priority: 4
    category: auth
    check: "Segregation of duties: X-User-ID of the approver must differ from the recorded author. Enforced on POST /upfit/weight-certifications/{weight_certification_id}/approve (vs created_by_user_id), POST /upfit/electrical-interfaces/{electrical_interface_id}/approve (vs proposed_by_user_id), POST /upfit/upfit-orders/{upfit_order_id}/release (vs engineering_submitted_by_user_id) and POST /upfit/compliance-labels (issuer vs the cited certification's approved_by_user_id)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "certification approve, interface approve, order release, compliance-label create"
  # ---- request shape --------------------------------------------------------
  - priority: 5
    category: format
    check: "All required input fields present; enums within their declared value sets; integers within declared ranges; dates ISO-8601; end_date not before start_date is checked separately at priority 64."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  # ---- existence (path resources left-to-right, then body FKs in declaration order) ----
  - priority: 10
    category: existence
    check: "chassis_model_id resolves to a ChassisModel."
    error_id: ERR_CHASSIS_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "chassis create, build-configuration create"
  - priority: 11
    category: existence
    check: "body_spec_id resolves to a BodySpec."
    error_id: ERR_BODY_SPEC_NOT_FOUND
    http_status: 404
    applies_to: "build-configuration create"
  - priority: 12
    category: existence
    check: "equipment_spec_id resolves to an EquipmentSpec (including every member of standard_equipment_spec_ids)."
    error_id: ERR_EQUIPMENT_SPEC_NOT_FOUND
    http_status: 404
    applies_to: "build-configuration create, equipment-installation create"
  - priority: 13
    category: existence
    check: "work_bay_id resolves to a WorkBay."
    error_id: ERR_WORK_BAY_NOT_FOUND
    http_status: 404
    applies_to: "build-slot create, work-bay set-status"
  - priority: 14
    category: existence
    check: "customer_id resolves to a Customer."
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "upfit-order create"
  - priority: 15
    category: existence
    check: "build_configuration_id resolves to a BuildConfiguration."
    error_id: ERR_BUILD_CONFIGURATION_NOT_FOUND
    http_status: 404
    applies_to: "upfit-order create"
  - priority: 16
    category: existence
    check: "chassis_id in a path or body resolves to a Chassis."
    error_id: ERR_CHASSIS_NOT_FOUND
    http_status: 404
    applies_to: "chassis reads and transitions, allocate-chassis"
  - priority: 17
    category: existence
    check: "upfit_order_id in a path or body resolves to an UpfitOrder."
    error_id: ERR_UPFIT_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all order-scoped paths and child creates"
  - priority: 18
    category: existence
    check: "equipment_installation_id resolves to an EquipmentInstallation."
    error_id: ERR_EQUIPMENT_INSTALLATION_NOT_FOUND
    http_status: 404
    applies_to: "installation reads and transitions"
  - priority: 19
    category: existence
    check: "electrical_interface_id resolves to an ElectricalInterface."
    error_id: ERR_ELECTRICAL_INTERFACE_NOT_FOUND
    http_status: 404
    applies_to: "interface reads, approve, reject"
  - priority: 20
    category: existence
    check: "build_slot_id resolves to a BuildSlot."
    error_id: ERR_BUILD_SLOT_NOT_FOUND
    http_status: 404
    applies_to: "slot reads and transitions"
  - priority: 21
    category: existence
    check: "weight_certification_id resolves to a WeightCertification."
    error_id: ERR_WEIGHT_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "certification reads, approve, compliance-label create"
  - priority: 22
    category: existence
    check: "compliance_label_id / supersedes_label_id resolves to a ComplianceLabel."
    error_id: ERR_COMPLIANCE_LABEL_NOT_FOUND
    http_status: 404
    applies_to: "label reads, compliance-label create with supersedes_label_id"
  - priority: 23
    category: existence
    check: "warranty_claim_id resolves to a WarrantyClaim."
    error_id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "claim reads and transitions"
  # ---- optimistic concurrency (§1.2.1) --------------------------------------
  - priority: 30
    category: concurrency
    check: "expected_upfit_order_version equals the current UpfitOrder.version."
    error_id: ERR_STALE_UPFIT_ORDER_VERSION
    http_status: 412
    applies_to: "POST /upfit/weight-certifications"
  - priority: 31
    category: concurrency
    check: "expected_chassis_version equals the current Chassis.version."
    error_id: ERR_STALE_CHASSIS_VERSION
    http_status: 412
    applies_to: "POST /upfit/upfit-orders/{upfit_order_id}/allocate-chassis"
  # ---- uniqueness -----------------------------------------------------------
  - priority: 35
    category: business_constraint
    check: "vin is unique across Chassis."
    error_id: ERR_DUPLICATE_VIN
    http_status: 409
    applies_to: "chassis create"
  - priority: 36
    category: business_constraint
    check: "config_code is unique across BuildConfiguration."
    error_id: ERR_DUPLICATE_CONFIG_CODE
    http_status: 409
    applies_to: "build-configuration create"
  - priority: 37
    category: business_constraint
    check: "order_number is unique across UpfitOrder."
    error_id: ERR_DUPLICATE_ORDER_NUMBER
    http_status: 409
    applies_to: "upfit-order create"
  - priority: 38
    category: business_constraint
    check: "claim_number is unique across WarrantyClaim."
    error_id: ERR_DUPLICATE_CLAIM_NUMBER
    http_status: 409
    applies_to: "warranty-claim create"
  # ---- state preconditions --------------------------------------------------
  - priority: 40
    category: state
    check: "UpfitOrder.build_status (or compliance_status / body_install_status, whichever dimension the operation drives) is in the transition's from-state set per §1.2."
    error_id: ERR_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "every order transition and every order-scoped child create"
  - priority: 41
    category: state
    check: "Chassis.status is in the from-state set for the operation: allocate-chassis needs one of {INSPECTED, ALLOCATED} (ALLOCATED only via the pool-stock rebind edge of §1.2, whose own admissibility is then decided by priority 93), inspect needs one of {RECEIVED, QUARANTINED}, return needs one of {INSPECTED, ALLOCATED, IN_UPFIT}, quarantine needs one of {RECEIVED, INSPECTED}."
    error_id: ERR_CHASSIS_INVALID_STATE
    http_status: 409
    applies_to: "chassis transitions, allocate-chassis"
  - priority: 42
    category: state
    check: "EquipmentInstallation.status is in the from-state set: install needs PLANNED, commission needs INSTALLED, decommission needs COMMISSIONED, remove needs one of {PLANNED, INSTALLED, COMMISSIONED}."
    error_id: ERR_INSTALLATION_INVALID_STATE
    http_status: 409
    applies_to: "installation transitions"
  - priority: 43
    category: state
    check: "ElectricalInterface.status is PROPOSED for approve and for reject."
    error_id: ERR_INTERFACE_INVALID_STATE
    http_status: 409
    applies_to: "interface approve, interface reject"
  - priority: 44
    category: state
    check: "BuildSlot.status is in the from-state set: start needs SCHEDULED, close needs IN_BUILD, cancel needs one of {QUEUED, SCHEDULED, IN_BUILD}."
    error_id: ERR_SLOT_INVALID_STATE
    http_status: 409
    applies_to: "slot transitions"
  - priority: 45
    category: state
    check: "WeightCertification.status is DRAFT for approve."
    error_id: ERR_CERTIFICATION_INVALID_STATE
    http_status: 409
    applies_to: "certification approve"
  - priority: 46
    category: state
    check: "WarrantyClaim.status is in the from-state set: inspect needs SUBMITTED, adjudicate needs one of {INSPECTED, DISPUTED}, dispute needs ADJUDICATED, pay needs ADJUDICATED."
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "claim transitions"
  - priority: 47
    category: state
    check: "BuildConfiguration.status is DRAFT for publish and PUBLISHED for deprecate."
    error_id: ERR_CONFIG_INVALID_STATE
    http_status: 409
    applies_to: "build-configuration publish, build-configuration deprecate"
  - priority: 48
    category: state
    check: "supersedes_label_id, when supplied, must reference a ComplianceLabel whose voided_at is null."
    error_id: ERR_LABEL_ALREADY_SUPERSEDED
    http_status: 409
    applies_to: "compliance-label create"
  # ---- business_safety (regulatory weight compliance outranks everything below) ----
  - priority: 50
    category: business_safety
    check: "axle_load_distribution.gvw_lb <= ChassisModel.gvwr_lb."
    error_id: ERR_GVWR_EXCEEDED
    http_status: 422
    applies_to: "order release, weight-certification create"
  - priority: 51
    category: business_safety
    check: "axle_load_distribution.rear_axle_load_lb <= ChassisModel.rear_gawr_lb."
    error_id: ERR_REAR_GAWR_EXCEEDED
    http_status: 422
    applies_to: "order release, weight-certification create"
  - priority: 52
    category: business_safety
    check: "axle_load_distribution.front_axle_load_lb <= ChassisModel.front_gawr_lb."
    error_id: ERR_FRONT_GAWR_EXCEEDED
    http_status: 422
    applies_to: "order release, weight-certification create"
  - priority: 53
    category: business_safety
    check: "payload_capacity (AS_DESIGNED) >= UpfitOrder.required_payload_lb."
    error_id: ERR_PAYLOAD_SHORTFALL
    http_status: 422
    applies_to: "order release"
  - priority: 54
    category: business_safety
    check: "A ComplianceLabel may only cite a WeightCertification whose basis is AS_MEASURED; an AS_DESIGNED certification cannot carry a final-stage label."
    error_id: ERR_MEASURED_CERTIFICATION_REQUIRED
    http_status: 409
    applies_to: "compliance-label create"
  # ---- business_temporal ----------------------------------------------------
  - priority: 60
    category: business_temporal
    check: "requested_in_service_date >= earliest_feasible_in_service_date."
    error_id: ERR_IN_SERVICE_DATE_INFEASIBLE
    http_status: 422
    applies_to: "order release"
  - priority: 61
    category: business_temporal
    check: "CHASSIS OCCUPANCY — exclusive, CLOSED interval. No other BuildSlot with the same chassis_id in status IN {QUEUED, SCHEDULED, IN_BUILD} may satisfy existing.start_date <= new.end_date AND new.start_date <= existing.end_date. A shared endpoint date collides: one physical truck cannot be in two bays on the changeover day."
    error_id: ERR_CHASSIS_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "build-slot create"
  - priority: 62
    category: business_temporal
    check: "BAY CAPACITY — aggregate, HALF-OPEN interval [start_date, end_date). count of BuildSlots in the same work_bay_id with status IN {SCHEDULED, IN_BUILD} satisfying existing.start_date < new.end_date AND new.start_date < existing.end_date must be < WorkBay.concurrent_capacity. Adjacency (existing.end_date == new.start_date) does NOT collide. When the request carries queue_if_full: true the slot is created QUEUED instead of rejected."
    error_id: ERR_BAY_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "build-slot create"
  - priority: 63
    category: business_temporal
    check: "Chassis.availability_date <= BuildSlot.start_date."
    error_id: ERR_CHASSIS_NOT_AVAILABLE_BY_SLOT_START
    http_status: 422
    applies_to: "build-slot create"
  - priority: 64
    category: business_temporal
    check: "end_date > start_date (a slot must span at least one day)."
    error_id: ERR_SLOT_DATE_RANGE_INVALID
    http_status: 422
    applies_to: "build-slot create"
  # ---- business_constraint (body builder book rules) -----------------------
  - priority: 70
    category: business_constraint
    check: "ChassisModel.cab_to_axle_in >= BodySpec.required_min_ca_in."
    error_id: ERR_CAB_TO_AXLE_INSUFFICIENT
    http_status: 422
    applies_to: "build-configuration create, order release"
  - priority: 71
    category: business_constraint
    check: "ChassisModel.wheelbase_in >= BodySpec.required_min_wheelbase_in."
    error_id: ERR_WHEELBASE_INSUFFICIENT
    http_status: 422
    applies_to: "build-configuration create, order release"
  - priority: 72
    category: business_constraint
    check: "aux_electrical_load.committed_aux_amp_draw (with the candidate row counted in) <= ChassisModel.max_aux_amp_draw."
    error_id: ERR_AUX_ELECTRICAL_LOAD_EXCEEDED
    http_status: 422
    applies_to: "electrical-interface create, interface approve, equipment-installation create"
  - priority: 73
    category: business_constraint
    check: "When order.chassis_id is not null: sum of required_flow_gpm over the order's non-REMOVED PTO installations (candidate included) <= the allocated model's pto_max_flow_gpm. Deferred while no unit is bound."
    error_id: ERR_PTO_FLOW_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "equipment-installation create"
  - priority: 74
    category: business_constraint
    check: "An EquipmentSpec with requires_pto: true cannot be installed when the governing chassis model (allocated Chassis.chassis_model_id, else BuildConfiguration.chassis_model_id) has pto_provision == NONE."
    error_id: ERR_PTO_NOT_PROVISIONED
    http_status: 422
    applies_to: "equipment-installation create"
  - priority: 75
    category: business_constraint
    check: "An EquipmentSpec with requires_pto: true must be installed with hydraulic_circuit IN {PRIMARY, SECONDARY}; a non-PTO spec must use hydraulic_circuit NONE."
    error_id: ERR_HYDRAULIC_CIRCUIT_REQUIRED
    http_status: 422
    applies_to: "equipment-installation create"
  - priority: 76
    category: business_constraint
    check: "No EquipmentInstallation of the order may have hydraulic_status DEFICIT."
    error_id: ERR_HYDRAULIC_DEFICIT_UNRESOLVED
    http_status: 409
    applies_to: "order release, installation commission"
  - priority: 77
    category: business_constraint
    check: "An ElectricalInterface whose computed warranty_impact is VOIDS requires customer_warranty_waiver_ack: true."
    error_id: ERR_CHASSIS_WARRANTY_VOIDING_INTERFACE
    http_status: 422
    applies_to: "electrical-interface create"
  - priority: 78
    category: business_constraint
    check: "An EquipmentSpec with requires_can_gateway: true may only be installed when the order already has an APPROVED ElectricalInterface with interface_method IN {CAN_GATEWAY, BODY_BUILDER_MODULE}."
    error_id: ERR_CAN_GATEWAY_REQUIRED
    http_status: 422
    applies_to: "equipment-installation create"
  - priority: 79
    category: business_constraint
    check: "The referenced BuildConfiguration.status must be PUBLISHED."
    error_id: ERR_CONFIG_NOT_PUBLISHED
    http_status: 409
    applies_to: "upfit-order create"
  - priority: 80
    category: business_constraint
    check: "BodySpec.body_type must appear in WorkBay.supported_body_types, and WorkBay.status must be ACTIVE."
    error_id: ERR_BAY_BODY_TYPE_UNSUPPORTED
    http_status: 422
    applies_to: "build-slot create"
  - priority: 81
    category: business_constraint
    check: "On a POOL_STOCK order the equipment_spec_id must be a member of the BuildConfiguration.standard_equipment_spec_ids list — pool builds stay standardized. CUSTOMER_SPECIFIC orders may install any spec."
    error_id: ERR_NON_STANDARD_POOL_EQUIPMENT
    http_status: 422
    applies_to: "equipment-installation create"
  - priority: 82
    category: business_constraint
    check: "body_install_status must be PLANNED for the body-install operation."
    error_id: ERR_BODY_ALREADY_INSTALLED
    http_status: 409
    applies_to: "order body-install"
  - priority: 83
    category: business_constraint
    check: "The allocated Chassis.chassis_model_id must equal the order's BuildConfiguration.chassis_model_id."
    error_id: ERR_CHASSIS_MODEL_MISMATCH
    http_status: 422
    applies_to: "allocate-chassis"
  - priority: 84
    category: business_constraint
    check: "At most one non-REMOVED EquipmentInstallation per (upfit_order_id, EquipmentSpec.mount_zone) pair — two bodies of iron cannot share one mounting zone."
    error_id: ERR_MOUNT_ZONE_CONFLICT
    http_status: 409
    applies_to: "equipment-installation create"
  # ---- business_referential -------------------------------------------------
  - priority: 85
    category: business_constraint
    check: "A body whose requires_hydraulics is true must have at least one EquipmentInstallation in status IN {PLANNED, INSTALLED, COMMISSIONED} whose spec requires_pto is true — a dump body needs a hoist to lift it."
    error_id: ERR_HYDRAULIC_SOURCE_MISSING
    http_status: 422
    applies_to: "order release"
  - priority: 90
    category: business_referential
    check: "The cited WeightCertification.upfit_order_id must equal the label's upfit_order_id."
    error_id: ERR_CERTIFICATION_ORDER_MISMATCH
    http_status: 422
    applies_to: "compliance-label create"
  - priority: 91
    category: business_referential
    check: "The cited WeightCertification.status must be APPROVED (a DRAFT or VOIDED certification cannot be labeled)."
    error_id: ERR_CERTIFICATION_NOT_APPROVED
    http_status: 409
    applies_to: "compliance-label create"
  - priority: 92
    category: business_referential
    check: "An order may have at most one ComplianceLabel with voided_at == null; issuing a second one requires supersedes_label_id naming the active label."
    error_id: ERR_LABEL_ALREADY_ACTIVE
    http_status: 409
    applies_to: "compliance-label create"
  - priority: 93
    category: business_referential
    check: >
      The chassis being allocated must not already be allocated to another order UNLESS that
      incumbent order is still re-plannable: ACCEPT when allocated_upfit_order_id is null, or
      equals this order, or the incumbent order's build_status IN {DRAFT, ENGINEERING_REVIEW,
      REWORK, RELEASED} — that is the legitimate pool-stock rebind of the §1.2 Chassis
      ALLOCATED -> ALLOCATED edge, which puts the incumbent order on CHASSIS_HOLD. REJECT when the
      incumbent order's build_status IN {SCHEDULED, IN_BUILD, BUILD_COMPLETE, DELIVERED}: a unit
      already committed to a bay window, or already built, cannot be pulled out from under it.
    error_id: ERR_CHASSIS_ALREADY_ALLOCATED
    http_status: 409
    applies_to: "allocate-chassis"
  # ---- business_fiscal (budget checks last) --------------------------------
  - priority: 100
    category: business_fiscal
    check: "After posting this adjudication, UpfitOrder.upfitter_liability_cents (recomputed over the order's claims in status IN {ADJUDICATED, PAID}, this one included) must not exceed UpfitOrder.warranty_liability_cap_cents unless the adjudicating WarrantyAdministrator supplies override_liability_cap: true."
    error_id: ERR_WARRANTY_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "warranty-claim adjudicate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving: logical clock -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every date-sensitive rule reads (earliest_feasible_in_service_date, promoted_from_queue_at, issued/voided timestamps). Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock advances or rewinds to current_utc; no entity is modified"]

  # ---- ChassisModel ---------------------------------------------------------
  - method: POST
    path: "/upfit/chassis-models"
    description: "Registers a body builder book entry: the incomplete vehicle's ratings, curb axle weights, electrical and PTO provisions."
    roles: [PlantAdmin]
    code: 201
    input: [code, make, gvwr_lb, front_gawr_lb, rear_gawr_lb, wheelbase_in, cab_to_axle_in, curb_front_axle_lb, curb_rear_axle_lb, max_aux_amp_draw, electrical_bus, pto_provision, pto_max_flow_gpm, body_builder_book_rev, incomplete_vehicle_document_rev]
    output: ChassisModel
    side_effects: []
  - method: GET
    path: "/upfit/chassis-models/{chassis_model_id}"
    description: "Reads one chassis model."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: []
    output: ChassisModel
    side_effects: []
  - method: GET
    path: "/upfit/chassis-models"
    description: "Lists chassis models."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: ["make?", "pto_provision?", "limit?", "offset?"]
    output: ChassisModel[]
    side_effects: []

  # ---- BodySpec -------------------------------------------------------------
  - method: POST
    path: "/upfit/body-specs"
    description: "Registers a body catalog entry (service, dump, flatbed or van) with its weight, centroids and book minimums."
    roles: [PlantAdmin]
    code: 201
    input: [code, body_type, weight_lb, cg_from_body_front_in, cargo_cg_from_body_front_in, length_in, required_min_ca_in, required_min_wheelbase_in, aux_amp_draw, requires_hydraulics, list_price_cents]
    output: BodySpec
    side_effects: []
  - method: GET
    path: "/upfit/body-specs/{body_spec_id}"
    description: "Reads one body spec."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: []
    output: BodySpec
    side_effects: []
  - method: GET
    path: "/upfit/body-specs"
    description: "Lists body specs."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: ["body_type?", "limit?", "offset?"]
    output: BodySpec[]
    side_effects: []

  # ---- EquipmentSpec --------------------------------------------------------
  - method: POST
    path: "/upfit/equipment-specs"
    description: "Registers a crane, liftgate, PTO hoist or PTO pump with its hydraulic demand, amp draw, duty priority and mount zone."
    roles: [PlantAdmin]
    code: 201
    input: [code, equipment_class, weight_lb, requires_pto, required_flow_gpm, aux_amp_draw, duty_priority, mount_zone, requires_can_gateway, list_price_cents]
    output: EquipmentSpec
    side_effects: []
  - method: GET
    path: "/upfit/equipment-specs/{equipment_spec_id}"
    description: "Reads one equipment spec."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: []
    output: EquipmentSpec
    side_effects: []
  - method: GET
    path: "/upfit/equipment-specs"
    description: "Lists equipment specs."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: ["equipment_class?", "requires_pto?", "limit?", "offset?"]
    output: EquipmentSpec[]
    side_effects: []

  # ---- WorkBay --------------------------------------------------------------
  - method: POST
    path: "/upfit/work-bays"
    description: "Creates an upfit bay with a concurrent capacity and the set of body types it can handle."
    roles: [PlantAdmin]
    code: 201
    input: [code, concurrent_capacity, supported_body_types]
    output: WorkBay
    side_effects: []
  - method: POST
    path: "/upfit/work-bays/{work_bay_id}/set-status"
    description: "Takes a bay ACTIVE or DOWN. A DOWN bay accepts no new slots and is skipped by queue_promotion_selector."
    roles: [PlantAdmin]
    code: 200
    input: [status]
    output: WorkBay
    side_effects: ["WorkBay.status set", "increments WorkBay.version by 1"]
  - method: GET
    path: "/upfit/work-bays/{work_bay_id}"
    description: "Reads one work bay."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: []
    output: WorkBay
    side_effects: []
  - method: GET
    path: "/upfit/work-bays"
    description: "Lists work bays."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WorkBay[]
    side_effects: []

  # ---- Customer -------------------------------------------------------------
  - method: POST
    path: "/upfit/customers"
    description: "Creates a fleet customer account. The returned id is the X-User-ID a Customer-role caller must present."
    roles: [PlantAdmin]
    code: 201
    input: [name, account_code, fleet_contact_email]
    output: Customer
    side_effects: []
  - method: GET
    path: "/upfit/customers/{customer_id}"
    description: "Reads one customer. A Customer-role caller may only read its own record."
    roles: [PlantAdmin, ProductionScheduler, WarrantyAdministrator, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/upfit/customers"
    description: "Lists customers."
    roles: [PlantAdmin, ProductionScheduler, WarrantyAdministrator]
    code: 200
    input: ["account_code?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # ---- BuildConfiguration ---------------------------------------------------
  - method: POST
    path: "/upfit/build-configurations"
    description: "Pairs a chassis model with a body and a standard equipment list. Book fit rules (cab-to-axle, wheelbase) are checked here so an unbuildable pairing never reaches an order."
    roles: [UpfitEngineer]
    code: 201
    input: ["config_code", "chassis_model_id", "body_spec_id", "standardization_tier", "standard_equipment_spec_ids?"]
    output: BuildConfiguration
    side_effects: ["status set to DRAFT", "ERR_CAB_TO_AXLE_INSUFFICIENT / ERR_WHEELBASE_INSUFFICIENT enforced against the paired model and body"]
  - method: POST
    path: "/upfit/build-configurations/{build_configuration_id}/publish"
    description: "Publishes a configuration so orders may reference it."
    roles: [UpfitEngineer]
    code: 200
    input: []
    output: BuildConfiguration
    side_effects: ["status DRAFT -> PUBLISHED", "published_at stamped from the logical clock", "increments BuildConfiguration.version by 1"]
  - method: POST
    path: "/upfit/build-configurations/{build_configuration_id}/deprecate"
    description: "Retires a configuration; existing orders are untouched, new orders are refused."
    roles: [UpfitEngineer]
    code: 200
    input: []
    output: BuildConfiguration
    side_effects: ["status PUBLISHED -> DEPRECATED", "increments BuildConfiguration.version by 1"]
  - method: GET
    path: "/upfit/build-configurations/{build_configuration_id}"
    description: "Reads one build configuration."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: []
    output: BuildConfiguration
    side_effects: []
  - method: GET
    path: "/upfit/build-configurations"
    description: "Lists build configurations, filterable by the chassis model or body spec they reference."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: ["chassis_model_id?", "body_spec_id?", "standardization_tier?", "status?", "limit?", "offset?"]
    output: BuildConfiguration[]
    side_effects: []

  # ---- Chassis --------------------------------------------------------------
  - method: POST
    path: "/upfit/chassis"
    description: "Receives an incomplete vehicle from the chassis manufacturer into pool stock or against a customer assignment."
    roles: [PlantAdmin]
    code: 201
    input: [vin, chassis_model_id, "ownership?", availability_date]
    output: Chassis
    side_effects: ["status set to RECEIVED", "measured axle weights left null until inspection"]
  - method: POST
    path: "/upfit/chassis/{chassis_id}/inspect"
    description: "Records the incoming scale ticket — the curb axle weights every AS_MEASURED certification is built on."
    roles: [InstallTechnician]
    code: 200
    input: [measured_front_axle_weight_lb, measured_rear_axle_weight_lb]
    output: Chassis
    side_effects: ["status RECEIVED|QUARANTINED -> INSPECTED", "measured_front_axle_weight_lb / measured_rear_axle_weight_lb stamped", "increments Chassis.version by 1"]
  - method: POST
    path: "/upfit/chassis/{chassis_id}/quarantine"
    description: "Holds a unit for transit damage or a document discrepancy, making it unallocatable."
    roles: [PlantAdmin]
    code: 200
    input: [quarantine_reason]
    output: Chassis
    side_effects: ["status RECEIVED|INSPECTED -> QUARANTINED", "quarantine_reason stamped", "increments Chassis.version by 1"]
  - method: POST
    path: "/upfit/chassis/{chassis_id}/return"
    description: "Sends the unit back to the chassis manufacturer. Drives the four-hop cascade documented on the §1.2 Chassis RETURNED transition."
    roles: [PlantAdmin]
    code: 200
    input: [reason]
    output: Chassis
    side_effects: ["status INSPECTED|ALLOCATED|IN_UPFIT -> RETURNED", "CASCADE: allocated_upfit_order_id cleared; the order's chassis_id cleared and build_status -> CHASSIS_HOLD; the order's QUEUED/SCHEDULED slots -> CANCELLED; queue_promotion_selector runs on each freed bay; a promoted slot's order moves RELEASED -> SCHEDULED", "increments Chassis.version by 1"]
  - method: GET
    path: "/upfit/chassis/{chassis_id}"
    description: "Reads one chassis."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: []
    output: Chassis
    side_effects: []
  - method: GET
    path: "/upfit/chassis"
    description: "Lists chassis, filterable by model, by the order they are allocated to, by ownership and by status."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator]
    code: 200
    input: ["chassis_model_id?", "allocated_upfit_order_id?", "ownership?", "status?", "limit?", "offset?"]
    output: Chassis[]
    side_effects: []

  # ---- UpfitOrder -----------------------------------------------------------
  - method: POST
    path: "/upfit/upfit-orders"
    description: "Opens an upfit order against a PUBLISHED build configuration, either as pool stock or as a customer-specific build. body_spec_id is copied from the configuration by the system."
    roles: [ProductionScheduler]
    code: 201
    input: ["order_number", "order_type", "customer_id", "build_configuration_id", "body_mount_offset_from_front_axle_in", "required_payload_lb?", "requested_in_service_date?", "warranty_liability_cap_cents?"]
    output: UpfitOrder
    side_effects: ["build_status set to DRAFT, compliance_status NOT_STARTED, body_install_status PLANNED, chassis_warranty_status INTACT", "body_spec_id copied from BuildConfiguration.body_spec_id", "committed_aux_amp_draw seeded to BodySpec.aux_amp_draw via aux_electrical_load", "committed_pto_flow_gpm set to 0, rework_round set to 0, all liability ledger fields set to 0"]
  - method: POST
    path: "/upfit/upfit-orders/{upfit_order_id}/submit-engineering"
    description: "Submits the build package for compliance review and records the submitting engineer for segregation-of-duties purposes."
    roles: [UpfitEngineer]
    code: 200
    input: []
    output: UpfitOrder
    side_effects: ["build_status DRAFT|REWORK -> ENGINEERING_REVIEW", "engineering_submitted_by_user_id stamped from X-User-ID", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/upfit-orders/{upfit_order_id}/request-rework"
    description: "Compliance sends the package back to engineering, incrementing the rework counter."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason"]
    output: UpfitOrder
    side_effects: ["build_status ENGINEERING_REVIEW -> REWORK", "rework_round incremented by 1", "compliance_status is untouched — the two dimensions advance independently", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/upfit-orders/{upfit_order_id}/allocate-chassis"
    description: "Binds a specific incomplete vehicle to the order. OCC-guarded on the Chassis the caller last observed (§1.2.1 allocate-chassis-stale-chassis)."
    roles: [ProductionScheduler]
    code: 200
    input: ["chassis_id", "expected_chassis_version"]
    output: UpfitOrder
    side_effects: ["UpfitOrder.chassis_id set", "Chassis.status INSPECTED -> ALLOCATED and Chassis.allocated_upfit_order_id set", "pto_flow_waterfall re-run against the newly bound model, restamping every installation's allocated_flow_gpm and hydraulic_status and the order's committed_pto_flow_gpm", "aux_electrical_load re-run against the newly bound model", "increments Chassis.version by 1", "increments UpfitOrder.version by 1"]
  - method: PATCH
    path: "/upfit/upfit-orders/{upfit_order_id}/body-mount"
    description: "Moves the body's mounting position relative to the front axle — the single input that shifts the whole weight distribution."
    roles: [UpfitEngineer]
    code: 200
    input: ["body_mount_offset_from_front_axle_in"]
    output: UpfitOrder
    side_effects: ["body_mount_offset_from_front_axle_in updated", "build_invoice_total re-run when build_status IN {RELEASED, SCHEDULED, IN_BUILD}, restamping invoice_total_cents", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/upfit-orders/{upfit_order_id}/release"
    description: "Releases the order to the shop floor. This is the compliance gate: AS_DESIGNED axle loads, payload sufficiency, hydraulic completeness, book fit rules and in-service feasibility are all evaluated here, in §1.4 priority order."
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: UpfitOrder
    side_effects: ["build_status ENGINEERING_REVIEW -> RELEASED", "axle_load_distribution (AS_DESIGNED) and payload_capacity evaluated as gates", "earliest_feasible_in_service_date evaluated against requested_in_service_date", "build_invoice_total run, stamping invoice_total_cents", "SoD: X-User-ID must differ from engineering_submitted_by_user_id", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/upfit-orders/{upfit_order_id}/body-install"
    description: "Records that the body is physically bolted down and scale-verified. Flipping this flag is what makes AS_MEASURED include the body and what makes a label FINAL_STAGE rather than ALTERER."
    roles: [InstallTechnician]
    code: 200
    input: ["body_actual_weight_lb"]
    output: UpfitOrder
    side_effects: ["body_install_status PLANNED -> INSTALLED", "body_actual_weight_lb stamped", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/upfit-orders/{upfit_order_id}/deliver"
    description: "Delivers the finished truck to the customer."
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: UpfitOrder
    side_effects: ["build_status BUILD_COMPLETE -> DELIVERED", "requires compliance_status == LABELED", "the bound Chassis.status IN_UPFIT -> COMPLETED", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/upfit-orders/{upfit_order_id}/cancel"
    description: "Cancels an order that has not yet been delivered."
    roles: [PlantAdmin]
    code: 200
    input: ["reason"]
    output: UpfitOrder
    side_effects: ["build_status DRAFT|ENGINEERING_REVIEW|REWORK|RELEASED|SCHEDULED|CHASSIS_HOLD -> CANCELLED", "the order's QUEUED/SCHEDULED slots -> CANCELLED and queue_promotion_selector runs on each freed bay", "an allocated Chassis returns to INSPECTED with allocated_upfit_order_id cleared", "increments UpfitOrder.version by 1"]
  - method: GET
    path: "/upfit/upfit-orders/{upfit_order_id}"
    description: "Reads one upfit order, including every derived ledger field. A Customer-role caller may only read its own orders."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: []
    output: UpfitOrder
    side_effects: []
  - method: GET
    path: "/upfit/upfit-orders"
    description: "Lists upfit orders, filterable by customer, configuration, body spec, allocated chassis and status."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: ["customer_id?", "build_configuration_id?", "body_spec_id?", "chassis_id?", "order_type?", "build_status?", "compliance_status?", "limit?", "offset?"]
    output: UpfitOrder[]
    side_effects: []
  - method: GET
    path: "/upfit/upfit-orders/{upfit_order_id}/weight-projection"
    description: "Read-only weight projection for the requested basis, returning the same numbers a certification of that basis would stamp. Response data is the inline object {basis, front_axle_load_lb, rear_axle_load_lb, gvw_lb, payload_capacity_lb, included_component_count, front_gawr_lb, rear_gawr_lb, gvwr_lb} — it persists nothing."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, ComplianceOfficer]
    code: 200
    input: ["basis"]
    output: null
    side_effects: ["runs axle_load_distribution and payload_capacity for the requested basis; no entity is written"]

  # ---- EquipmentInstallation ------------------------------------------------
  - method: POST
    path: "/upfit/equipment-installations"
    description: "Plans an equipment item onto the order at a given centroid and hydraulic circuit. All body-builder-book capacity gates (PTO provision, PTO flow, aux amps, mount zone, pool standardization, CAN gateway prerequisite) fire here. Permitted while the order's build_status IN {DRAFT, ENGINEERING_REVIEW, REWORK, RELEASED, SCHEDULED, IN_BUILD}; on a CHASSIS_HOLD, BUILD_COMPLETE, DELIVERED or CANCELLED order the create is refused with ERR_ORDER_INVALID_STATE."
    roles: [InstallTechnician, UpfitEngineer]
    code: 201
    input: ["upfit_order_id", "equipment_spec_id", "mount_cg_from_front_axle_in", "hydraulic_circuit"]
    output: EquipmentInstallation
    side_effects: ["status set to PLANNED", "pto_flow_waterfall re-run, stamping allocated_flow_gpm and hydraulic_status on every candidate row and committed_pto_flow_gpm on the order", "aux_electrical_load re-run, restamping the order's committed_aux_amp_draw", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/equipment-installations/{equipment_installation_id}/install"
    description: "Records the item as physically mounted with its scale-verified weight, which is what AS_MEASURED reads."
    roles: [InstallTechnician]
    code: 200
    input: ["actual_weight_lb"]
    output: EquipmentInstallation
    side_effects: ["status PLANNED -> INSTALLED", "actual_weight_lb stamped", "increments EquipmentInstallation.version by 1"]
  - method: POST
    path: "/upfit/equipment-installations/{equipment_installation_id}/commission"
    description: "Commissions the item after a function test; refused while its hydraulic_status is DEFICIT."
    roles: [InstallTechnician]
    code: 200
    input: []
    output: EquipmentInstallation
    side_effects: ["status INSTALLED -> COMMISSIONED", "increments EquipmentInstallation.version by 1"]
  - method: POST
    path: "/upfit/equipment-installations/{equipment_installation_id}/decommission"
    description: "Returns a commissioned item to INSTALLED for rework; the pair commission/decommission is the cycle in this state machine."
    roles: [InstallTechnician]
    code: 200
    input: ["reason"]
    output: EquipmentInstallation
    side_effects: ["status COMMISSIONED -> INSTALLED", "increments EquipmentInstallation.version by 1"]
  - method: POST
    path: "/upfit/equipment-installations/{equipment_installation_id}/remove"
    description: "Strips the item off the truck. Drives the four-hop cascade documented on the §1.2 EquipmentInstallation REMOVED transition."
    roles: [InstallTechnician]
    code: 200
    input: ["reason"]
    output: EquipmentInstallation
    side_effects: ["status PLANNED|INSTALLED|COMMISSIONED -> REMOVED, allocated_flow_gpm 0, hydraulic_status NOT_APPLICABLE", "CASCADE: pto_flow_waterfall and aux_electrical_load re-run on the order; every AS_MEASURED WeightCertification of the order in status APPROVED -> VOIDED; each active ComplianceLabel citing a voided certification gets voided_at stamped and the order's compliance_status drops LABELED -> DESIGN_CERTIFIED; build_status BUILD_COMPLETE -> IN_BUILD and the most recently CLOSED FINAL_QC slot reopens to IN_BUILD", "increments EquipmentInstallation.version by 1", "increments UpfitOrder.version by 1"]
  - method: GET
    path: "/upfit/equipment-installations/{equipment_installation_id}"
    description: "Reads one equipment installation."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: []
    output: EquipmentInstallation
    side_effects: []
  - method: GET
    path: "/upfit/equipment-installations"
    description: "Lists equipment installations, filterable by order, by spec and by status."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: ["upfit_order_id?", "equipment_spec_id?", "status?", "hydraulic_status?", "limit?", "offset?"]
    output: EquipmentInstallation[]
    side_effects: []

  # ---- ElectricalInterface --------------------------------------------------
  - method: POST
    path: "/upfit/electrical-interfaces"
    description: "Proposes how the upfit taps the vehicle's electrical architecture. electrical_warranty_impact is computed here from the method and the chassis bus, and a VOIDS proposal is refused without a signed customer waiver. Permitted while the order's build_status IN {DRAFT, ENGINEERING_REVIEW, REWORK, RELEASED, SCHEDULED, IN_BUILD}, the same window as equipment planning."
    roles: [UpfitEngineer]
    code: 201
    input: ["upfit_order_id", "interface_method", "circuit_amp_draw", "signal_source", "customer_warranty_waiver_ack?"]
    output: ElectricalInterface
    side_effects: ["status set to PROPOSED", "warranty_impact computed by electrical_warranty_impact", "proposed_by_user_id stamped from X-User-ID", "aux_electrical_load evaluated with this row counted in as the ceiling gate", "customer_warranty_waiver_ack defaults to false"]
  - method: POST
    path: "/upfit/electrical-interfaces/{electrical_interface_id}/approve"
    description: "Compliance approves the interface, which is the moment its amps and its warranty impact become binding on the order."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ElectricalInterface
    side_effects: ["status PROPOSED -> APPROVED", "approved_by_user_id stamped from X-User-ID", "aux_electrical_load re-run, restamping the order's committed_aux_amp_draw", "the order's chassis_warranty_status recomputed as the highest-ranked impact among APPROVED interfaces", "SoD: X-User-ID must differ from proposed_by_user_id", "increments ElectricalInterface.version by 1", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/electrical-interfaces/{electrical_interface_id}/reject"
    description: "Compliance rejects the interface; it contributes no amps and no warranty impact."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason"]
    output: ElectricalInterface
    side_effects: ["status PROPOSED -> REJECTED", "increments ElectricalInterface.version by 1"]
  - method: GET
    path: "/upfit/electrical-interfaces/{electrical_interface_id}"
    description: "Reads one electrical interface."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: []
    output: ElectricalInterface
    side_effects: []
  - method: GET
    path: "/upfit/electrical-interfaces"
    description: "Lists electrical interfaces, filterable by order, status and warranty impact."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: ["upfit_order_id?", "status?", "warranty_impact?", "interface_method?", "limit?", "offset?"]
    output: ElectricalInterface[]
    side_effects: []

  # ---- BuildSlot ------------------------------------------------------------
  - method: POST
    path: "/upfit/build-slots"
    description: "Books bay time for the order. Two different overlap semantics apply: the bay is an aggregate half-open resource, the chassis is an exclusive closed-interval resource. With queue_if_full: true a bay-capacity collision yields a QUEUED slot instead of a rejection. Slot creation is permitted whenever the order's build_status IN {RELEASED, SCHEDULED, IN_BUILD}: one order may hold several slots (BODY_MOUNT, EQUIPMENT_INTEGRATION, FINAL_QC), and only the first slot that lands in SCHEDULED drives the order's RELEASED -> SCHEDULED transition."
    roles: [ProductionScheduler]
    code: 201
    input: ["upfit_order_id", "work_bay_id", "slot_type", "start_date", "end_date", "queue_if_full?"]
    output: BuildSlot
    side_effects: ["chassis_id copied from the order's allocated chassis by the system", "status set to SCHEDULED, or QUEUED when the bay is full and queue_if_full is true", "queue_if_full defaults to false", "when the slot is SCHEDULED the order's build_status RELEASED -> SCHEDULED"]
  - method: POST
    path: "/upfit/build-slots/{build_slot_id}/start"
    description: "Starts work in the bay."
    roles: [InstallTechnician]
    code: 200
    input: []
    output: BuildSlot
    side_effects: ["status SCHEDULED -> IN_BUILD", "the order's build_status SCHEDULED -> IN_BUILD", "the allocated Chassis.status ALLOCATED -> IN_UPFIT", "increments BuildSlot.version by 1"]
  - method: POST
    path: "/upfit/build-slots/{build_slot_id}/close"
    description: "Closes the slot. Closing a FINAL_QC slot completes the build."
    roles: [InstallTechnician]
    code: 200
    input: []
    output: BuildSlot
    side_effects: ["status IN_BUILD -> CLOSED", "when slot_type == FINAL_QC the order's build_status IN_BUILD -> BUILD_COMPLETE; the Chassis is left IN_UPFIT because it is not handed over until delivery", "queue_promotion_selector runs on the freed bay", "increments BuildSlot.version by 1"]
  - method: POST
    path: "/upfit/build-slots/{build_slot_id}/cancel"
    description: "Cancels a booked or queued slot and lets the deterministic queue selector promote the next eligible QUEUED slot in the same bay."
    roles: [ProductionScheduler]
    code: 200
    input: ["reason"]
    output: BuildSlot
    side_effects: ["status QUEUED|SCHEDULED|IN_BUILD -> CANCELLED", "queue_promotion_selector runs on the freed bay; at most one QUEUED slot is promoted to SCHEDULED with promoted_from_queue_at stamped, and that slot's order moves RELEASED -> SCHEDULED", "increments BuildSlot.version by 1"]
  - method: GET
    path: "/upfit/build-slots/{build_slot_id}"
    description: "Reads one build slot."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: []
    output: BuildSlot
    side_effects: []
  - method: GET
    path: "/upfit/build-slots"
    description: "Lists build slots, filterable by order, bay, chassis, slot type and status."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: ["upfit_order_id?", "work_bay_id?", "chassis_id?", "slot_type?", "status?", "limit?", "offset?"]
    output: BuildSlot[]
    side_effects: []

  # ---- WeightCertification --------------------------------------------------
  - method: POST
    path: "/upfit/weight-certifications"
    description: "Drafts a weight certification on the requested basis. OCC-guarded on the UpfitOrder the caller last observed (§1.2.1 certification-create-stale-order), because any body-mount move, equipment change or chassis rebind invalidates the numbers."
    roles: [UpfitEngineer]
    code: 201
    input: ["upfit_order_id", "basis", "expected_upfit_order_version"]
    output: WeightCertification
    side_effects: ["status set to DRAFT", "axle_load_distribution and payload_capacity run for the requested basis, stamping front_axle_load_lb, rear_axle_load_lb, gvw_lb, payload_capacity_lb and included_component_count", "created_by_user_id stamped from X-User-ID", "GVWR / rear-GAWR / front-GAWR gates enforced in §1.4 priority order", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/weight-certifications/{weight_certification_id}/approve"
    description: "A second pair of eyes approves the certification; only an APPROVED certification may be labeled."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: WeightCertification
    side_effects: ["status DRAFT -> APPROVED", "approved_by_user_id stamped from X-User-ID", "the order's compliance_status advances to DESIGN_CERTIFIED for an AS_DESIGNED basis or MEASURED_CERTIFIED for an AS_MEASURED basis", "SoD: X-User-ID must differ from created_by_user_id", "increments WeightCertification.version by 1", "increments UpfitOrder.version by 1"]
  - method: GET
    path: "/upfit/weight-certifications/{weight_certification_id}"
    description: "Reads one weight certification."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: []
    output: WeightCertification
    side_effects: []
  - method: GET
    path: "/upfit/weight-certifications"
    description: "Lists weight certifications, filterable by order, basis and status."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: ["upfit_order_id?", "basis?", "status?", "limit?", "offset?"]
    output: WeightCertification[]
    side_effects: []

  # ---- ComplianceLabel ------------------------------------------------------
  - method: POST
    path: "/upfit/compliance-labels"
    description: "Issues the certification label. label_responsibility decides whether the upfitter signs as final-stage manufacturer, signs as an alterer, or passes conformity back to the chassis manufacturer. Accepted while the order's compliance_status IN {MEASURED_CERTIFIED, LABELED}: a first issuance requires MEASURED_CERTIFIED and no supersedes_label_id, while a correction on a LABELED order MUST name the standing label in supersedes_label_id. Immutable once issued: a correction is a new label that supersedes the old one."
    roles: [ComplianceOfficer]
    code: 201
    input: ["upfit_order_id", "weight_certification_id", "supersedes_label_id?"]
    output: ComplianceLabel
    side_effects: ["label_type and responsible_party computed by label_responsibility", "certified_gvwr_lb / certified_front_gawr_lb / certified_rear_gawr_lb copied from the chassis model and certified_payload_lb from the cited certification", "issued_by_user_id stamped from X-User-ID, voided_at left null", "any label named by supersedes_label_id gets voided_at stamped from the logical clock", "the order's compliance_status MEASURED_CERTIFIED -> LABELED", "SoD: X-User-ID must differ from the cited certification's approved_by_user_id", "increments UpfitOrder.version by 1"]
  - method: GET
    path: "/upfit/compliance-labels/{compliance_label_id}"
    description: "Reads one compliance label."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: []
    output: ComplianceLabel
    side_effects: []
  - method: GET
    path: "/upfit/compliance-labels"
    description: "Lists compliance labels, filterable by order, cited certification, the label they supersede, and type."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, InstallTechnician, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: ["upfit_order_id?", "weight_certification_id?", "supersedes_label_id?", "label_type?", "responsible_party?", "limit?", "offset?"]
    output: ComplianceLabel[]
    side_effects: []

  # ---- WarrantyClaim --------------------------------------------------------
  - method: POST
    path: "/upfit/warranty-claims"
    description: "Opens a warranty claim against a delivered truck. The PROVISIONAL liability split is stamped immediately from the failure system alone."
    roles: [WarrantyAdministrator, Customer]
    code: 201
    input: ["upfit_order_id", "claim_number", "failure_system", "claim_cost_cents"]
    output: WarrantyClaim
    side_effects: ["status set to SUBMITTED, split_basis PROVISIONAL, taint_confirmed false, dispute_round 0", "warranty_liability_split (PROVISIONAL) stamps chassis_pct / upfitter_pct / goodwill_pct and the three cents fields", "the order's ledger fields are NOT touched — a SUBMITTED claim is outside the posted set"]
  - method: POST
    path: "/upfit/warranty-claims/{warranty_claim_id}/inspect"
    description: "Records the teardown finding: whether an upfitter modification tainted a chassis-side failure."
    roles: [WarrantyAdministrator]
    code: 200
    input: ["taint_confirmed"]
    output: WarrantyClaim
    side_effects: ["status SUBMITTED -> INSPECTED", "taint_confirmed stamped", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/upfit/warranty-claims/{warranty_claim_id}/adjudicate"
    description: "Fixes the FINAL split. The 45-point taint shift moves liability from the chassis maker to the upfitter when teardown confirmed a chassis-side failure on a truck whose chassis warranty posture is CONDITIONAL or VOIDED."
    roles: [WarrantyAdministrator]
    code: 200
    input: ["override_liability_cap?"]
    output: WarrantyClaim
    side_effects: ["status INSPECTED|DISPUTED -> ADJUDICATED, split_basis PROVISIONAL -> FINAL", "warranty_liability_split (FINAL) restamps the three pct fields and the three cents fields", "the order's chassis_liability_cents / upfitter_liability_cents / customer_goodwill_cents recomputed over claims in status IN {ADJUDICATED, PAID}", "ERR_WARRANTY_BUDGET_EXCEEDED unless override_liability_cap is true", "override_liability_cap defaults to false", "increments WarrantyClaim.version by 1", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/warranty-claims/{warranty_claim_id}/dispute"
    description: "The customer or the chassis maker disputes the adjudicated split, pulling the claim back out of the posted set."
    roles: [WarrantyAdministrator, Customer]
    code: 200
    input: ["reason"]
    output: WarrantyClaim
    side_effects: ["status ADJUDICATED -> DISPUTED", "dispute_round incremented by 1", "the order's three ledger fields recomputed, so this claim's amounts are backed out", "increments WarrantyClaim.version by 1", "increments UpfitOrder.version by 1"]
  - method: POST
    path: "/upfit/warranty-claims/{warranty_claim_id}/pay"
    description: "Pays the adjudicated claim; the amounts stay in the posted set."
    roles: [WarrantyAdministrator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status ADJUDICATED -> PAID", "the order's three ledger fields recomputed (unchanged in value, since PAID is also inside the posted set)", "increments WarrantyClaim.version by 1", "increments UpfitOrder.version by 1"]
  - method: GET
    path: "/upfit/warranty-claims/{warranty_claim_id}"
    description: "Reads one warranty claim. A Customer-role caller may only read claims on its own orders."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/upfit/warranty-claims"
    description: "Lists warranty claims, filterable by order, failure system, split basis and status."
    roles: [PlantAdmin, ProductionScheduler, UpfitEngineer, ComplianceOfficer, WarrantyAdministrator, Customer]
    code: 200
    input: ["upfit_order_id?", "failure_system?", "split_basis?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth -----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the §1.7 role names."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles."
  - id: ERR_CUSTOMER_SCOPE_VIOLATION
    http: 403
    condition: "A Customer-role caller touches a resource whose owning UpfitOrder.customer_id differs from its X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The approving/releasing/issuing X-User-ID equals the recorded author (created_by_user_id, proposed_by_user_id, engineering_submitted_by_user_id, or the cited certification's approved_by_user_id)."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, unknown enum value, or a numeric/date value outside its declared range."
  # ---- existence ------------------------------------------------------------
  - id: ERR_CHASSIS_MODEL_NOT_FOUND
    http: 404
    condition: "chassis_model_id does not resolve to a ChassisModel."
  - id: ERR_BODY_SPEC_NOT_FOUND
    http: 404
    condition: "body_spec_id does not resolve to a BodySpec."
  - id: ERR_EQUIPMENT_SPEC_NOT_FOUND
    http: 404
    condition: "equipment_spec_id — or any member of standard_equipment_spec_ids — does not resolve to an EquipmentSpec."
  - id: ERR_WORK_BAY_NOT_FOUND
    http: 404
    condition: "work_bay_id does not resolve to a WorkBay."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id does not resolve to a Customer."
  - id: ERR_BUILD_CONFIGURATION_NOT_FOUND
    http: 404
    condition: "build_configuration_id does not resolve to a BuildConfiguration."
  - id: ERR_CHASSIS_NOT_FOUND
    http: 404
    condition: "chassis_id does not resolve to a Chassis."
  - id: ERR_UPFIT_ORDER_NOT_FOUND
    http: 404
    condition: "upfit_order_id does not resolve to an UpfitOrder."
  - id: ERR_EQUIPMENT_INSTALLATION_NOT_FOUND
    http: 404
    condition: "equipment_installation_id does not resolve to an EquipmentInstallation."
  - id: ERR_ELECTRICAL_INTERFACE_NOT_FOUND
    http: 404
    condition: "electrical_interface_id does not resolve to an ElectricalInterface."
  - id: ERR_BUILD_SLOT_NOT_FOUND
    http: 404
    condition: "build_slot_id does not resolve to a BuildSlot."
  - id: ERR_WEIGHT_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "weight_certification_id does not resolve to a WeightCertification."
  - id: ERR_COMPLIANCE_LABEL_NOT_FOUND
    http: 404
    condition: "compliance_label_id or supersedes_label_id does not resolve to a ComplianceLabel."
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "warranty_claim_id does not resolve to a WarrantyClaim."
  # ---- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_UPFIT_ORDER_VERSION
    http: 412
    condition: "expected_upfit_order_version does not equal the current UpfitOrder.version on POST /upfit/weight-certifications."
  - id: ERR_STALE_CHASSIS_VERSION
    http: 412
    condition: "expected_chassis_version does not equal the current Chassis.version on allocate-chassis."
  # ---- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "A Chassis with the same vin already exists."
  - id: ERR_DUPLICATE_CONFIG_CODE
    http: 409
    condition: "A BuildConfiguration with the same config_code already exists."
  - id: ERR_DUPLICATE_ORDER_NUMBER
    http: 409
    condition: "An UpfitOrder with the same order_number already exists."
  - id: ERR_DUPLICATE_CLAIM_NUMBER
    http: 409
    condition: "A WarrantyClaim with the same claim_number already exists."
  # ---- state ----------------------------------------------------------------
  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "The UpfitOrder's build_status / compliance_status / body_install_status is not in the from-state set the requested operation requires."
  - id: ERR_CHASSIS_INVALID_STATE
    http: 409
    condition: "The Chassis status is not in the from-state set the requested operation requires (e.g. allocating a QUARANTINED unit)."
  - id: ERR_INSTALLATION_INVALID_STATE
    http: 409
    condition: "The EquipmentInstallation status is not in the from-state set the requested operation requires (e.g. commissioning a PLANNED row)."
  - id: ERR_INTERFACE_INVALID_STATE
    http: 409
    condition: "The ElectricalInterface is not PROPOSED when approve or reject is called."
  - id: ERR_SLOT_INVALID_STATE
    http: 409
    condition: "The BuildSlot status is not in the from-state set the requested operation requires (e.g. starting a QUEUED slot)."
  - id: ERR_CERTIFICATION_INVALID_STATE
    http: 409
    condition: "The WeightCertification is not DRAFT when approve is called."
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "The WarrantyClaim status is not in the from-state set the requested operation requires (e.g. adjudicating a SUBMITTED claim)."
  - id: ERR_CONFIG_INVALID_STATE
    http: 409
    condition: "The BuildConfiguration is not DRAFT for publish or not PUBLISHED for deprecate."
  - id: ERR_LABEL_ALREADY_SUPERSEDED
    http: 409
    condition: "supersedes_label_id names a ComplianceLabel whose voided_at is already set."
  # ---- business_safety ------------------------------------------------------
  - id: ERR_GVWR_EXCEEDED
    http: 422
    condition: "Computed gvw_lb exceeds the chassis model's gvwr_lb."
  - id: ERR_REAR_GAWR_EXCEEDED
    http: 422
    condition: "Computed rear_axle_load_lb exceeds the chassis model's rear_gawr_lb."
  - id: ERR_FRONT_GAWR_EXCEEDED
    http: 422
    condition: "Computed front_axle_load_lb exceeds the chassis model's front_gawr_lb — typically a heavy crane mounted just behind the cab."
  - id: ERR_PAYLOAD_SHORTFALL
    http: 422
    condition: "AS_DESIGNED payload_capacity_lb is strictly less than the order's required_payload_lb."
  - id: ERR_MEASURED_CERTIFICATION_REQUIRED
    http: 409
    condition: "A ComplianceLabel cites a WeightCertification whose basis is AS_DESIGNED."
  # ---- business_temporal ----------------------------------------------------
  - id: ERR_IN_SERVICE_DATE_INFEASIBLE
    http: 422
    condition: "requested_in_service_date falls before earliest_feasible_in_service_date at release time."
  - id: ERR_CHASSIS_OCCUPANCY_CONFLICT
    http: 409
    condition: "Another live BuildSlot holds the same chassis over a closed interval that touches or overlaps the requested one — including a shared endpoint date."
  - id: ERR_BAY_CAPACITY_CONFLICT
    http: 409
    condition: "The requested half-open interval overlaps concurrent_capacity or more live slots in the same bay, and queue_if_full was not set."
  - id: ERR_CHASSIS_NOT_AVAILABLE_BY_SLOT_START
    http: 422
    condition: "The allocated chassis's availability_date is after the requested slot start_date."
  - id: ERR_SLOT_DATE_RANGE_INVALID
    http: 422
    condition: "end_date is not strictly after start_date."
  # ---- business_constraint (body builder book) ------------------------------
  - id: ERR_CAB_TO_AXLE_INSUFFICIENT
    http: 422
    condition: "The chassis model's cab_to_axle_in is less than the body's required_min_ca_in."
  - id: ERR_WHEELBASE_INSUFFICIENT
    http: 422
    condition: "The chassis model's wheelbase_in is less than the body's required_min_wheelbase_in."
  - id: ERR_AUX_ELECTRICAL_LOAD_EXCEEDED
    http: 422
    condition: "committed_aux_amp_draw with the candidate row counted in exceeds the chassis model's max_aux_amp_draw."
  - id: ERR_PTO_FLOW_CAPACITY_EXCEEDED
    http: 422
    condition: "An order with a chassis already allocated installs PTO equipment whose total required_flow_gpm, candidate included, exceeds the allocated model's pto_max_flow_gpm."
  - id: ERR_PTO_NOT_PROVISIONED
    http: 422
    condition: "A PTO-driven equipment spec is installed on a chassis model whose pto_provision is NONE."
  - id: ERR_HYDRAULIC_CIRCUIT_REQUIRED
    http: 422
    condition: "A PTO spec was submitted with hydraulic_circuit NONE, or a non-PTO spec was submitted with PRIMARY or SECONDARY."
  - id: ERR_HYDRAULIC_DEFICIT_UNRESOLVED
    http: 409
    condition: "An installation of the order carries hydraulic_status DEFICIT when release or commission is attempted."
  - id: ERR_CHASSIS_WARRANTY_VOIDING_INTERFACE
    http: 422
    condition: "An interface whose computed warranty_impact is VOIDS was proposed without customer_warranty_waiver_ack: true."
  - id: ERR_CAN_GATEWAY_REQUIRED
    http: 422
    condition: "An equipment spec with requires_can_gateway: true is installed while the order has no APPROVED CAN_GATEWAY or BODY_BUILDER_MODULE interface."
  - id: ERR_CONFIG_NOT_PUBLISHED
    http: 409
    condition: "The referenced BuildConfiguration is DRAFT or DEPRECATED."
  - id: ERR_BAY_BODY_TYPE_UNSUPPORTED
    http: 422
    condition: "The order's body_type is absent from the bay's supported_body_types, or the bay status is DOWN."
  - id: ERR_NON_STANDARD_POOL_EQUIPMENT
    http: 422
    condition: "A POOL_STOCK order installs an equipment spec outside its configuration's standard_equipment_spec_ids."
  - id: ERR_BODY_ALREADY_INSTALLED
    http: 409
    condition: "body-install is called when body_install_status is already INSTALLED."
  - id: ERR_CHASSIS_MODEL_MISMATCH
    http: 422
    condition: "The allocated chassis's chassis_model_id differs from the order configuration's chassis_model_id."
  - id: ERR_MOUNT_ZONE_CONFLICT
    http: 409
    condition: "A non-REMOVED installation already occupies the candidate spec's mount_zone on this order."
  - id: ERR_HYDRAULIC_SOURCE_MISSING
    http: 422
    condition: "A body requiring hydraulics is released with no PTO-driven equipment installed to power it."
  # ---- business_referential -------------------------------------------------
  - id: ERR_CERTIFICATION_ORDER_MISMATCH
    http: 422
    condition: "The cited WeightCertification belongs to a different UpfitOrder than the label."
  - id: ERR_CERTIFICATION_NOT_APPROVED
    http: 409
    condition: "The cited WeightCertification is DRAFT or VOIDED."
  - id: ERR_LABEL_ALREADY_ACTIVE
    http: 409
    condition: "The order already has a ComplianceLabel with voided_at == null and supersedes_label_id was not supplied."
  - id: ERR_CHASSIS_ALREADY_ALLOCATED
    http: 409
    condition: "The chassis's allocated_upfit_order_id is already set to a different order."
  # ---- business_fiscal ------------------------------------------------------
  - id: ERR_WARRANTY_BUDGET_EXCEEDED
    http: 402
    condition: "Posting this adjudication would push the order's upfitter_liability_cents above warranty_liability_cap_cents without override_liability_cap."

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant operations administrator. Owns the reference catalog (chassis models, body specs, equipment specs, bays, customers), incoming vehicle custody, order cancellation and the logical clock. Cannot author engineering packages, approve compliance artifacts or adjudicate claims."
    identity: opaque
    exclusive_operations: ["create chassis models", "create body specs", "create equipment specs", "create work bays", "set work bay status", "create customers", "receive chassis", "quarantine chassis", "return chassis", "cancel upfit order", "set logical clock"]
    shared_operations: ["read any entity"]
  - name: ProductionScheduler
    description: "Owns the order book and bay capacity: opens orders, allocates chassis, releases to the floor, books and cancels slots, delivers finished trucks. Cannot author or approve engineering or compliance artifacts."
    identity: opaque
    exclusive_operations: ["create upfit order", "allocate chassis to order", "release upfit order", "deliver upfit order", "create build slot", "cancel build slot"]
    shared_operations: ["read any entity"]
  - name: UpfitEngineer
    description: "Authors the technical package: build configurations, body mount position, equipment installations, electrical interface proposals and draft weight certifications. Authorship only — every artifact this role creates is approved by someone else."
    identity: opaque
    exclusive_operations: ["create build configuration", "publish build configuration", "deprecate build configuration", "submit engineering package", "update body mount offset", "create electrical interface", "create weight certification"]
    shared_operations: ["create equipment installation", "read any entity", "read weight projection"]
  - name: InstallTechnician
    description: "Shop floor. Records the incoming scale ticket, mounts the body, installs / commissions / decommissions / removes equipment, and starts and closes bay slots."
    identity: opaque
    exclusive_operations: ["inspect chassis", "install equipment", "commission equipment", "decommission equipment", "remove equipment", "record body install", "start build slot", "close build slot"]
    shared_operations: ["create equipment installation", "read any entity"]
  - name: ComplianceOfficer
    description: "The independent approver. Approves or rejects electrical interfaces, approves weight certifications, requests rework, and issues compliance labels. Never authors the artifact it approves — see §1.4 priority 4."
    identity: opaque
    exclusive_operations: ["approve electrical interface", "reject electrical interface", "approve weight certification", "request rework", "issue compliance label"]
    shared_operations: ["read any entity", "read weight projection"]
  - name: WarrantyAdministrator
    description: "Runs the post-delivery liability split between chassis maker and upfitter: inspects, adjudicates, disputes and pays claims."
    identity: opaque
    exclusive_operations: ["inspect warranty claim", "adjudicate warranty claim", "pay warranty claim"]
    shared_operations: ["create warranty claim", "dispute warranty claim", "read any entity"]
  - name: Customer
    description: "Fleet customer. X-User-ID equals the id of a Customer row; may read only its own orders and their children, may open a warranty claim and may dispute an adjudicated split. Cannot see or touch another account's builds."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations: ["create warranty claim", "dispute warranty claim", "read own customer record", "read own upfit orders and their installations, interfaces, slots, certifications, labels and claims"]
