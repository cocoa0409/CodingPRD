      - name: practice_hour_attainment_floors_each_partial_period_before_summing
        claim_type: correct_result
        grounds:
          - calculations.practice_hour_attainment.formula
          - entities.RenewalApplication.fields.verified_practice_hours
          - complexity_profile.calculation_algorithms
        distinguishing_aspect: "Three submitted periods straddle the half-open window [2026-08-01, 2028-08-01): a 92-day 1000-hour period overlapping 31 days at the front, an identical one overlapping 31 days at the back, and a fully contained 300-hour period. Flooring per period gives 336 + 336 + 300 = 972, while summing the exact pro-rations first and flooring once gives 973 — and 972 still clears the 960-hour requirement, so the difference is observable in verified_practice_hours rather than in the pass/fail flag."
