      - name: space_fit_inclusive_boundary_and_volume_check_runs_second
        claim_type: threshold
        grounds: ['calculations.space_fit_feasibility', 'validations[priority=68]', 'validations[priority=69]', 'errors[ERR_ROOM_CAPACITY_EXCEEDED]', 'errors[ERR_ROOM_VOLUME_EXCEEDED]']
        distinguishing_aspect: "A prospective load of exactly 192.00 against a 192.00 capacity fits, one inch more returns ERR_ROOM_CAPACITY_EXCEEDED, and an item that fits linearly but breaches nominal_volume_cft * 0.90 returns ERR_ROOM_VOLUME_EXCEEDED because rung 69 runs after rung 68."
        test_recipe:
          setup: ["A LIVING room of 240 nominal linear inches and 100 nominal cubic feet under a DRAFT placement, so capacity is 192.00 linear inches and 90.00 cubic feet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /destination-residences"
              payload: { engagement_id: "${eng}", name: "Maple Grove 12B", unit_type: "APARTMENT", address_line: "12B Maple Grove Way" }
              as: MOVE_MANAGER
              captures: { res: "$.data.id" }
            - call: "POST /destination-rooms"
              payload: { destination_residence_id: "${res}", room_type: "LIVING", nominal_linear_inches: 240, nominal_volume_cft: 100 }
              as: MOVE_MANAGER
              captures: { room: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Exact-fit wall unit", category: "FURNITURE", footprint_linear_inches: 192, volume_cft: 50 }
              as: MOVE_MANAGER
              captures: { f1: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "One inch too wide", category: "FURNITURE", footprint_linear_inches: 1, volume_cft: 1 }
              as: MOVE_MANAGER
              captures: { f2: "$.data.id" }
