      - name: a_request_with_a_missing_or_unknown_role_header_is_unauthorized
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "The header gate precedes every other rule: omitting X-User-Role, omitting X-User-ID on an entity-backed role, and sending the plausible-but-undeclared role Registrar all return ERR_UNAUTHENTICATED with HTTP 401 rather than the 403 ERR_UNAUTHORIZED that a declared-but-disallowed role would get."
        test_recipe:
          setup:
            - "Clock 2026-08-01 with one SUPERVISORY official and one program, so the target endpoint has valid data to act on if the request were authenticated."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
            - call: "POST /programs"
              payload: { program_code: "BSN-UG", name: "Nursing BS", degree_level: "UNDERGRAD", full_time_credit_hours: 12, campus_bah_monthly_cents: 213700 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { prog1: $.data.id }
          trigger:
            - call: "POST /academic-terms"
              payload: { term_code: "FA2026", academic_year: "2026-2027", term_type: "FALL", start_date: "2026-08-24", end_date: "2026-12-11", drop_deadline: "2026-09-04", certification_deadline: "2026-09-30" }
              as: "<X-User-Role header omitted entirely>"
              captures: { e_missing: $.data.error_id }
            - call: "POST /academic-terms"
              payload: { term_code: "FA2026", academic_year: "2026-2027", term_type: "FALL", start_date: "2026-08-24", end_date: "2026-12-11", drop_deadline: "2026-09-04", certification_deadline: "2026-09-30" }
              as: "Registrar"
            - call: "POST /academic-terms"
              payload: { term_code: "FA2026", academic_year: "2026-2027", term_type: "FALL", start_date: "2026-08-24", end_date: "2026-12-11", drop_deadline: "2026-09-04", certification_deadline: "2026-09-30" }
              as: SupervisorySCO
              as_user_id: "<X-User-ID header omitted entirely>"
            - call: "POST /academic-terms"
              payload: { term_code: "FA2026", academic_year: "2026-2027", term_type: "FALL", start_date: "2026-08-24", end_date: "2026-12-11", drop_deadline: "2026-09-04", certification_deadline: "2026-09-30" }
              as: SupervisorySCO
              as_user_id: "${sup1}"
          assert:
            - "Trigger steps 1, 2 and 3 each return HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "no AcademicTerm row exists after trigger step 3"
            - "Trigger step 4 returns HTTP 201 with term_code == FA2026 — the identical body succeeds once the headers are valid"

