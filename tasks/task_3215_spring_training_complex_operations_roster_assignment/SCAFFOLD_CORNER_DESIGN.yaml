              as: ComplexDirector
              captures: { wga: $.data.id, wga_v: $.data.version }
            - call: "POST /camp-ops/complexes/${cx}/workout-groups"
              payload: { complex_id: "${cx}", roster_bucket: "MINOR", group_name: "Rehab Group B", facility_kind: "TRAINING_ROOM", capacity_units: 20 }
