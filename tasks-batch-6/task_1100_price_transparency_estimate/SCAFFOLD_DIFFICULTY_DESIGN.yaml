              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 200000, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_id}" }
              as: ProviderStaff
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: PatientUser
              as_user_id: "${pat_id}"
            - call: "POST /providers"
              payload: { name: "Dr Ray", npi: "1000000008", specialty: "Radiology" }
              as: ProviderStaff
              captures: { prov_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "CT-1", room_type: "IMAGING" }
              as: ProviderStaff
              captures: { room_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", estimate_id: "${est_id}", provider_id: "${prov_id}", room_id: "${room_id}", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: ProviderStaff
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: ProviderStaff
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: ProviderStaff
              captures: { oop_after_settle: $.data.oop_met_cents }
          trigger:
            - call: "POST /estimates/${est_id}/void"
              payload: {}
              as: ProviderStaff
          assert:
            - "oop_after_settle == 122500"
            - "Estimate.${est_id}.status == VOID"
            - "Patient.${pat_id}.oop_met_cents == 0"
            - "Patient.${pat_id}.deductible_met_cents == 0"

      - name: ci_allowed_partition_conserved_under_dispute
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_ADJUSTED
          - entities.Estimate.fields.allowed_amount_cents
          - entities.Estimate.fields.plan_paid_cents
          - entities.Estimate.fields.patient_responsibility_cents
        distinguishing_aspect: "Conserved quantity #2 = the Estimate allowed partition (allowed_amount_cents == plan_paid_cents + patient_responsibility_cents): a dispute ADJUSTED that moves patient_responsibility from 122500 to 90000 pairs a matching plan_paid increase 77500 -> 110000, so allowed_amount_cents stays 200000 both before (77500+122500) and after (110000+90000) — a different conserved quantity than the oop accumulator."
