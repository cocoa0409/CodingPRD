# =============================================================================
# Scaffold: Map Data Correction, Business Listing Verification & Contributor
# Programs — task_3293 (difficulty: beyond expert)
# =============================================================================

scenario: |
  Map Data Correction, Business Listing Verification & Contributor Programs
  (Google Maps): map feature edits submitted by users and businesses with
  automated validation and human review queues, business listing claim and
  verification through postcard, phone, video or records with reverification
  triggers, listing suspension for policy violations including keyword
  stuffing, fake addresses and prohibited categories with appeals, review
  moderation with fake review detection and business owner reporting,
  attribute and hours accuracy maintained from multiple sources with conflict
  resolution, contributor programs granting recognition levels for edits,
  photos and reviews with quality weighting, imagery collection scheduling
  and privacy blurring obligations, routing data updates for closures,
  construction and turn restrictions

domain_name: map-correction-contributor
api_prefix: /v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Region display name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country code", constraints: "2 uppercase letters" }
      - { name: timezone, type: string, source: input, description: "IANA timezone name" }
      - { name: geo_min_lat, type: number, source: input, description: "South boundary of region bounding box" }
      - { name: geo_max_lat, type: number, source: input, description: "North boundary of region bounding box" }
      - { name: geo_min_lng, type: number, source: input, description: "West boundary of region bounding box" }
      - { name: geo_max_lng, type: number, source: input, description: "East boundary of region bounding box" }
      - { name: posture, type: enum, source: computed, description: "ACTIVE | CLEARANCE_PENDING | CLEAR | FROZEN — derived from imagery task privacy state per region_privacy_clearance" }
      - { name: privacy_pending_count, type: integer, source: computed, description: "Count of ImageryTask in this region with status in {CAPTURED, BLUR_PENDING, REPROCESS}" }
      - { name: routing_version, type: integer, source: computed, description: "Monotonic routing data epoch; bumped on every RoutingUpdate create/activate/expire/cancel in this region", default: 0 }
      - { name: max_active_imagery_tasks, type: integer, source: input, description: "Cap on ImageryTask with status in {PLANNED, SCHEDULED, CAPTURED, BLUR_PENDING, REPROCESS, BLURRED} per region", default: 5 }

  - name: Contributor
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Public display name" }
      - { name: email, type: string, source: input, description: "Unique email address", constraints: "unique across Contributor" }
      - { name: home_region_id, type: string, source: input, description: "FK -> Region.id; contributor home region" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESTRICTED | BANNED", default: "ACTIVE" }
      - { name: total_points, type: integer, source: computed, description: "Sum of points over ContributorGrant with status POSTED (revoked grants excluded); per-contribution rounding per contributor_points_award" }
      - { name: lifetime_points, type: integer, source: computed, description: "Sum of points over ALL ContributorGrant rows regardless of status" }
      - { name: level, type: enum, source: computed, description: "NEWCOMER | REGULAR | TRUSTED | EXPERT | MASTER — derived from total_points thresholds (0/50/250/1000/5000, >= semantics)" }
      - { name: provisional_trust_score, type: number, source: computed, description: "Trust score including edits younger than 7 days (provisional variant of contributor_trust_score)" }
      - { name: finalized_trust_score, type: number, source: computed, description: "Trust score including only MapEdit rows older than 7 days (finalized variant)" }
      - { name: failed_verification_count, type: integer, source: computed, description: "Count of VerificationAttempt with status FAILED on listings owned by this contributor", default: 0 }

  - name: ContributorGrant
    parent: null
    common_fields: false
    fields:
      - { name: contributor_id, type: string, source: input, description: "FK -> Contributor.id; grant recipient" }
      - { name: source_type, type: enum, source: input, description: "EDIT | PHOTO | REVIEW | VERIFICATION_ASSIST | ADJUSTMENT" }
      - { name: source_id, type: string, source: input, description: "Opaque id of the originating object (edit id, review id, or free text for ADJUSTMENT)" }
      - { name: base_points, type: integer, source: input, description: "Base points before quality multiplier" }
      - { name: quality_multiplier, type: number, source: input, description: "Quality weight in [0.0, 3.0]; 1.0 neutral", default: 1.0 }
      - { name: points, type: integer, source: computed, description: "round_half_up(base_points * quality_multiplier) — per-contribution rounding pinned by contributor_points_award" }
      - { name: status, type: enum, source: system, description: "POSTED | REVOKED", default: "POSTED" }
      - { name: note, type: string, source: input, description: "Free-text rationale (required when source_type == ADJUSTMENT)", default: "" }

  - name: BusinessListing
    parent: null
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; listing region" }
      - { name: name, type: string, source: input, description: "Business display name; keyword-stuffing screened per validation" }
      - { name: category, type: enum, source: input, description: "RESTAURANT | RETAIL | SERVICE | LODGING | HEALTH (prohibited categories ESCORT | WEAPONS | ADULT rejected at create)" }
      - { name: address_text, type: string, source: input, description: "Free-form street address" }
      - { name: geo_lat, type: number, source: input, description: "Latitude; must lie within region bounding box" }
      - { name: geo_lng, type: number, source: input, description: "Longitude; must lie within region bounding box" }
      - { name: owner_contributor_id, type: string, source: system, description: "FK -> Contributor.id; owning business-owner contributor account, null until claimed" }
      - { name: status, type: enum, source: system, description: "UNCLAIMED | CLAIM_PENDING | VERIFIED | REVERIFY_REQUIRED | SUSPENDED | PERMANENTLY_CLOSED", default: "UNCLAIMED" }
      - { name: visibility, type: enum, source: computed, description: "PUBLIC | RESTRICTED | HIDDEN — derived from status and listing_health_score (VERIFIED + health < 30 => RESTRICTED; SUSPENDED/PERMANENTLY_CLOSED => HIDDEN)" }
      - { name: health_score, type: number, source: computed, description: "Public variant of listing_health_score (excludes UNDER_MODERATION reviews)" }
      - { name: moderation_health_score, type: number, source: computed, description: "Moderation variant of listing_health_score (UNDER_MODERATION reviews at 0.5 weight)" }
      - { name: review_count, type: integer, source: computed, description: "Count of UserReview on this listing with status PUBLISHED", default: 0 }
      - { name: rating_avg, type: number, source: computed, description: "Mean rating over UserReview with status PUBLISHED; 0.0 when review_count == 0; 2 decimals round_half_up" }
      - { name: accepted_edit_count, type: integer, source: computed, description: "Count of MapEdit on this listing with status PUBLISHED", default: 0 }
      - { name: keyword_stuffing_strikes, type: integer, source: system, description: "Accumulated keyword-stuffing violations", default: 0 }
      - { name: verification_method, type: enum, source: system, description: "POSTCARD | PHONE | VIDEO | RECORDS — method of the successful VerificationAttempt, null until verified" }
      - { name: verified_at, type: datetime, source: system, description: "Timestamp of successful verification, null until verified" }
      - { name: reverify_due_at, type: datetime, source: system, description: "When reverification becomes due (verified_at + 365 days), null until verified" }

  - name: VerificationAttempt
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> BusinessListing.id; listing under verification" }
      - { name: method, type: enum, source: input, description: "POSTCARD | PHONE | VIDEO | RECORDS" }
      - { name: status, type: enum, source: system, description: "ISSUED | CODE_SUBMITTED | VERIFIED | FAILED | EXPIRED | CANCELLED", default: "ISSUED" }
      - { name: code, type: string, source: system, description: "Server-minted 6-digit verification code returned at creation (postcard/phone flows)" }
      - { name: attempts_used, type: integer, source: system, description: "Number of submit-code calls consumed", default: 0 }
      - { name: max_attempts, type: integer, source: system, description: "Max submit-code calls before FAILED", default: 3 }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of creation" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + 14 days; sweep-expired transitions ISSUED attempts past this to EXPIRED" }
      - { name: failure_reason, type: enum, source: system, description: "WRONG_CODE | ATTEMPTS_EXHAUSTED | MISMATCHED_RECORDS | VIDEO_INSUFFICIENT, null unless FAILED" }

  - name: MapEdit
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> BusinessListing.id; target listing" }
      - { name: contributor_id, type: string, source: input, description: "FK -> Contributor.id; submitting contributor" }
      - { name: edit_type, type: enum, source: input, description: "NAME | CATEGORY | ADDRESS | HOURS | LOCATION | ATTRIBUTE" }
      - { name: payload, type: object, source: input, description: "Edit body; keys depend on edit_type (e.g. {name}, {open_time, close_time, day_mask})" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | AUTO_VALIDATED | QUEUED | IN_REVIEW | NEEDS_MORE_INFO | PUBLISHED | REJECTED | REVERTED", default: "SUBMITTED" }
      - { name: auto_score, type: number, source: computed, description: "edit_auto_validation_score at creation; >= 85 => AUTO_VALIDATED, 50..84.99 => QUEUED, < 50 => REJECTED" }
      - { name: quality_weight, type: number, source: computed, description: "Quality weight granted to contributor on publish (level-based): NEWCOMER 0.5, REGULAR 1.0, TRUSTED 1.5, EXPERT 2.0, MASTER 2.5" }
      - { name: rejection_reason, type: enum, source: system, description: "AUTO_LOW_SCORE | POLICY | INSUFFICIENT_EVIDENCE | DUPLICATE, null unless REJECTED" }
      - { name: review_ticket_id, type: string, source: system, description: "FK -> ReviewTicket.id; ticket driving human review, null until assigned" }

  - name: ReviewTicket
    parent: null
    common_fields: true
    fields:
      - { name: map_edit_id, type: string, source: input, description: "FK -> MapEdit.id; edit under review, null when queue != EDIT_REVIEW" }
      - { name: review_flag_id, type: string, source: input, description: "FK -> ReviewFlag.id; flag under moderation, null when queue != REVIEW_MODERATION" }
      - { name: queue, type: enum, source: input, description: "EDIT_REVIEW | REVIEW_MODERATION" }
      - { name: status, type: enum, source: system, description: "OPEN | CLAIMED | RESOLVED | ESCALATED", default: "OPEN" }
      - { name: claimed_by, type: string, source: system, description: "X-User-ID of claiming Moderator, null until claimed" }
      - { name: priority, type: enum, source: input, description: "LOW | NORMAL | HIGH | CRITICAL", default: "NORMAL" }
      - { name: resolution, type: enum, source: system, description: "APPROVE | REJECT | NEEDS_INFO | REMOVE | RESTORE | DISMISS, null until resolved" }
      - { name: sla_due_at, type: datetime, source: system, description: "created_at + 72h (NORMAL/LOW) or + 24h (HIGH/CRITICAL)" }

  - name: UserReview
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> BusinessListing.id; reviewed listing" }
      - { name: contributor_id, type: string, source: input, description: "FK -> Contributor.id; reviewing contributor" }
      - { name: rating, type: integer, source: input, description: "Star rating", constraints: "integer 1..5" }
      - { name: text, type: string, source: input, description: "Review body", constraints: "1..2000 chars" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | FLAGGED | UNDER_MODERATION | REMOVED", default: "PUBLISHED" }
      - { name: fake_probability, type: number, source: computed, description: "review_fake_probability; >= 0.80 auto-creates OPEN ReviewFlag with reason FAKE", default: 0.0 }
      - { name: flag_count, type: integer, source: computed, description: "Count of ReviewFlag on this review with status OPEN", default: 0 }

  - name: ReviewFlag
    parent: null
    common_fields: false
    fields:
      - { name: review_id, type: string, source: input, description: "FK -> UserReview.id; flagged review" }
      - { name: reporter_contributor_id, type: string, source: system, description: "FK -> Contributor.id; reporting contributor or owning business-owner contributor; null for auto-detection" }
      - { name: reporter_is_owner, type: boolean, source: system, description: "True when reporter owns the reviewed listing", default: false }
      - { name: reason, type: enum, source: input, description: "FAKE | CONFLICT_OF_INTEREST | OFF_TOPIC | HATE | SPAM" }
      - { name: status, type: enum, source: system, description: "OPEN | DISMISSED | UPHELD", default: "OPEN" }

  - name: SuspensionCase
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> BusinessListing.id; suspended listing" }
      - { name: violation_type, type: enum, source: input, description: "KEYWORD_STUFFING | FAKE_ADDRESS | PROHIBITED_CATEGORY | FAKE_REVIEWS | IMPERSONATION" }
      - { name: status, type: enum, source: system, description: "OPEN | APPEAL_SUBMITTED | UNDER_APPEAL_REVIEW | UPHELD | OVERTURNED", default: "OPEN" }
      - { name: evidence_notes, type: string, source: input, description: "Policy analyst evidence summary" }
      - { name: appeal_text, type: string, source: system, description: "Business owner appeal statement, null until appealed" }
      - { name: appeal_deadline, type: datetime, source: system, description: "created_at + 30 days; appeals after this rejected with ERR_APPEAL_WINDOW_CLOSED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding PolicyAnalyst, null until decided" }

  - name: HoursObservation
    parent: null
    common_fields: false
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> BusinessListing.id; observed listing" }
      - { name: source, type: enum, source: input, description: "OWNER | CONTRIBUTOR | WEB_CRAWL | IMAGERY | THIRD_PARTY_FEED" }
      - { name: day_mask, type: string, source: input, description: "7-char MTWTFSS day applicability mask" }
      - { name: open_time, type: string, source: input, description: "HH:MM 24h opening time" }
      - { name: close_time, type: string, source: input, description: "HH:MM 24h closing time" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of observation" }
      - { name: corroboration_count, type: integer, source: computed, description: "Count of other observations on same listing+day_mask with identical open/close times", default: 0 }
      - { name: accepted, type: boolean, source: computed, description: "True when this observation is the current hours_conflict_winner for its listing+day_mask", default: false }

  - name: ImageryTask
    parent: null
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; collection region" }
      - { name: collection_zone, type: string, source: input, description: "Zone identifier within the region (free text, e.g. grid cell id)" }
      - { name: operator_id, type: string, source: input, description: "X-User-ID of the responsible ImageryOperator" }
      - { name: status, type: enum, source: system, description: "PLANNED | SCHEDULED | CAPTURED | BLUR_PENDING | REPROCESS | BLURRED | PUBLISHED | CANCELLED", default: "PLANNED" }
      - { name: window_start, type: datetime, source: input, description: "Planned capture window start (logical clock)" }
      - { name: window_end, type: datetime, source: input, description: "Planned capture window end (logical clock); half-open [start, end) overlap semantics" }
      - { name: blur_obligation, type: enum, source: input, description: "FACES_ONLY | FACES_AND_PLATES | FULL_PRIVACY" }
      - { name: capture_media_count, type: integer, source: system, description: "Media items captured, set on capture", default: 0 }
      - { name: blurred_media_count, type: integer, source: system, description: "Media items blurred, set on blur-complete", default: 0 }

  - name: RoutingUpdate
    parent: null
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; affected region" }
      - { name: segment_ref, type: string, source: input, description: "Road segment identifier the update applies to" }
      - { name: kind, type: enum, source: input, description: "CLOSURE | CONSTRUCTION | TURN_RESTRICTION" }
      - { name: status, type: enum, source: system, description: "PROPOSED | VALIDATED | SCHEDULED | ACTIVE | EXPIRED | CANCELLED", default: "PROPOSED" }
      - { name: effective_start, type: datetime, source: input, description: "Effect window start (logical clock)" }
      - { name: effective_end, type: datetime, source: input, description: "Effect window end (logical clock); CLOSURE/CONSTRUCTION on the same segment_ref require >= 24h gap to any other non-terminal window" }
      - { name: restriction_detail, type: object, source: input, description: "Kind-specific detail (e.g. {from_segment, to_segment, turn} for TURN_RESTRICTION)" }
      - { name: supersedes_id, type: string, source: input, description: "FK -> RoutingUpdate.id; prior update this one replaces, null for fresh updates" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MapEdit
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERTED]
    transitions:
      - from: SUBMITTED
        to: AUTO_VALIDATED
        trigger: "system at creation when edit_auto_validation_score >= 85"
        actor: system
        preconditions:
          - "auto_score >= 85"
        side_effects:
          - "Immediately continues to PUBLISHED via auto-publish (same creation request)"
      - from: SUBMITTED
        to: QUEUED
        trigger: "system at creation when 50 <= auto_score < 85"
        actor: system
        preconditions:
          - "50 <= auto_score < 85"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "system at creation when auto_score < 50"
        actor: system
        preconditions:
          - "auto_score < 50"
        side_effects:
          - "rejection_reason = AUTO_LOW_SCORE"
      - from: AUTO_VALIDATED
        to: PUBLISHED
        trigger: "system at creation (same request as AUTO_VALIDATED transition)"
        actor: system
        preconditions: []
        side_effects:
          - "Apply edit payload to BusinessListing fields per edit_type"
          - "BusinessListing.accepted_edit_count += 1 (ledger sync)"
          - "Create ContributorGrant { source_type: EDIT, source_id: MapEdit.id, base_points: 5, quality_multiplier: MapEdit.quality_weight } (cascade link 1)"
          - "Recompute Contributor.total_points, level, both trust score variants (cascade link 2)"
          - "Recompute BusinessListing.health_score and moderation_health_score (cascade link 3)"
      - from: QUEUED
        to: IN_REVIEW
        trigger: "POST /v1/review-tickets with queue=EDIT_REVIEW referencing this edit (assigns ticket and claims edit)"
        actor: Moderator
        preconditions:
          - "MapEdit.review_ticket_id is null (ERR_EDIT_ALREADY_ASSIGNED)"
        side_effects:
          - "ReviewTicket.status = CLAIMED, claimed_by = moderator id"
          - "MapEdit.review_ticket_id = ticket id"
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /v1/review-tickets/{id}/resolve with resolution=APPROVE"
        actor: Moderator
        preconditions:
          - "Ticket status CLAIMED and claimed_by == acting moderator (ERR_NOT_TICKET_OWNER — segregation of duties)"
        side_effects:
          - "Apply edit payload to BusinessListing fields"
          - "BusinessListing.accepted_edit_count += 1"
          - "Create ContributorGrant (source_type EDIT, base_points 5, multiplier quality_weight); recompute Contributor totals/level/trust; recompute listing health"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /v1/review-tickets/{id}/resolve with resolution=REJECT"
        actor: Moderator
        preconditions:
          - "Ticket status CLAIMED and claimed_by == acting moderator"
        side_effects:
          - "rejection_reason = POLICY or INSUFFICIENT_EVIDENCE per payload"
          - "Recompute Contributor trust scores (rejection lowers trust)"
      - from: IN_REVIEW
        to: NEEDS_MORE_INFO
        trigger: "POST /v1/review-tickets/{id}/resolve with resolution=NEEDS_INFO"
        actor: Moderator
        preconditions:
          - "Ticket status CLAIMED and claimed_by == acting moderator"
        side_effects:
          - "ReviewTicket.status = RESOLVED with resolution NEEDS_INFO (ticket closes; edit awaits contributor)"
      - from: NEEDS_MORE_INFO
        to: IN_REVIEW
        trigger: "POST /v1/map-edits/{id}/supply-info (contributor adds evidence; creates fresh ReviewTicket in OPEN)"
        actor: Contributor
        preconditions:
          - "MapEdit.contributor_id == acting contributor (ERR_NOT_EDIT_AUTHOR)"
          - "payload.evidence non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Create new OPEN ReviewTicket with queue=EDIT_REVIEW, priority HIGH"
          - "System immediately claims cycle: ticket remains OPEN until a moderator assigns via POST /v1/review-tickets; on assignment edit moves QUEUED->IN_REVIEW semantics (edit is already IN_REVIEW-target state)"
      - from: PUBLISHED
        to: REVERTED
        trigger: "POST /v1/map-edits/{id}/revert"
        actor: PolicyAnalyst
        preconditions:
          - "MapEdit status PUBLISHED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Undo payload application on BusinessListing fields (restore prior value)"
          - "BusinessListing.accepted_edit_count -= 1 (compensating ledger)"
          - "Revoke the ContributorGrant created at publish (status REVOKED); recompute Contributor.total_points (lifetime_points unchanged) — compensating_invariant: sum of POSTED grant points unchanged after publish-then-revert"
          - "Recompute listing health scores and contributor trust"

  - entity: VerificationAttempt
    initial_state: ISSUED
    terminal_states: [VERIFIED, FAILED, EXPIRED, CANCELLED]
    transitions:
      - from: ISSUED
        to: CODE_SUBMITTED
        trigger: "POST /v1/verification-attempts/{id}/submit-code"
        actor: BusinessOwner
        preconditions:
          - "Acting contributor id == listing.owner_contributor_id (ERR_NOT_LISTING_OWNER)"
          - "logical clock < expires_at (ERR_ATTEMPT_EXPIRED)"
          - "attempts_used < max_attempts (ERR_ATTEMPTS_EXHAUSTED)"
          - "Listing status in {CLAIM_PENDING, REVERIFY_REQUIRED} (ERR_LISTING_NOT_VERIFIABLE)"
        side_effects:
          - "attempts_used += 1"
          - "If code matches: immediately VERIFIED (same request); else if attempts_used == max_attempts: FAILED with WRONG_CODE; else stay CODE_SUBMITTED"
      - from: CODE_SUBMITTED
        to: VERIFIED
        trigger: "POST /v1/verification-attempts/{id}/submit-code with correct code"
        actor: BusinessOwner
        preconditions:
          - "code == attempt.code"
        side_effects:
          - "BusinessListing.status: CLAIM_PENDING -> VERIFIED or REVERIFY_REQUIRED -> VERIFIED (cycle closes)"
          - "BusinessListing.verification_method = attempt.method; verified_at = now; reverify_due_at = now + 365d"
          - "Owner ContributorGrant source_type VERIFICATION_ASSIST base_points 10 (cascade); recompute contributor totals"
      - from: CODE_SUBMITTED
        to: FAILED
        trigger: "POST /v1/verification-attempts/{id}/submit-code with wrong code consuming last attempt"
        actor: BusinessOwner
        preconditions:
          - "code != attempt.code and attempts_used reaches max_attempts"
        side_effects:
          - "failure_reason = WRONG_CODE"
          - "Listing owner failed_verification_count += 1 (cascade link 1); if failed_verification_count >= 5 the listing status -> SUSPENDED with SuspensionCase FAKE_ADDRESS auto-created (cascade link 2); suspension cascades per BusinessListing SUSPENDED side effects (cascade link 3)"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /v1/verification-attempts/sweep-expired (system sweep; every ISSUED attempt with expires_at <= now)"
        actor: PlatformAdmin
        preconditions:
          - "logical clock >= expires_at"
        side_effects:
          - "Listing remains in CLAIM_PENDING / REVERIFY_REQUIRED (a fresh attempt may be created)"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /v1/verification-attempts/{id}/cancel"
        actor: BusinessOwner
        preconditions:
          - "Acting contributor id == listing.owner_contributor_id"
        side_effects: []

  - entity: BusinessListing
    initial_state: UNCLAIMED
    terminal_states: [PERMANENTLY_CLOSED]
    transitions:
      - from: UNCLAIMED
        to: CLAIM_PENDING
        trigger: "POST /v1/business-listings/{id}/claim"
        actor: BusinessOwner
        preconditions:
          - "owner_contributor_id is null (ERR_LISTING_ALREADY_CLAIMED)"
          - "Claiming contributor status == ACTIVE (ERR_CONTRIBUTOR_RESTRICTED)"
        side_effects:
          - "owner_contributor_id = acting contributor id"
      - from: CLAIM_PENDING
        to: VERIFIED
        trigger: "VerificationAttempt VERIFIED transition (see VerificationAttempt machine)"
        actor: system
        preconditions: []
        side_effects: ["verification_method/verified_at/reverify_due_at set"]
      - from: VERIFIED
        to: REVERIFY_REQUIRED
        trigger: "POST /v1/business-listings/sweep-reverify (system sweep; VERIFIED listings with reverify_due_at <= now) OR PolicyAnalyst POST /v1/business-listings/{id}/suspend with violation KEYWORD_STUFFING pardoned-once semantics is NOT used here; manual trigger POST /v1/business-listings/{id}/require-reverify"
        actor: system
        preconditions: []
        side_effects:
          - "Any ISSUED VerificationAttempt on this listing -> CANCELLED"
      - from: REVERIFY_REQUIRED
        to: VERIFIED
        trigger: "VerificationAttempt VERIFIED transition"
        actor: system
        preconditions: []
        side_effects: ["verified_at/reverify_due_at refreshed (cycle)"]
      - from: CLAIM_PENDING
        to: SUSPENDED
        trigger: "POST /v1/business-listings/{id}/suspend"
        actor: PolicyAnalyst
        preconditions:
          - "violation_type in enum; if KEYWORD_STUFFING then keyword_stuffing_strikes must reach 2 via name updates before suspension allowed (ERR_STRIKES_BELOW_THRESHOLD when strikes < 2 and violation_type == KEYWORD_STUFFING)"
        side_effects:
          - "Create SuspensionCase OPEN with violation_type, evidence_notes, appeal_deadline = now + 30d (cascade link 1)"
          - "All MapEdit on listing in {SUBMITTED, QUEUED, IN_REVIEW, NEEDS_MORE_INFO} -> REJECTED with rejection_reason POLICY (cascade link 2)"
          - "Each rejection recomputes contributor trust scores; contributors whose finalized_trust_score drops below 20 get status RESTRICTED (cascade link 3)"
          - "visibility -> HIDDEN"
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /v1/business-listings/{id}/suspend"
        actor: PolicyAnalyst
        preconditions:
          - "violation_type in enum; KEYWORD_STUFFING requires keyword_stuffing_strikes >= 2 (ERR_STRIKES_BELOW_THRESHOLD)"
        side_effects:
          - "Same cascade as CLAIM_PENDING -> SUSPENDED (case creation, edit rejection storm, trust demotion)"
          - "Any ISSUED/CODE_SUBMITTED VerificationAttempt -> CANCELLED"
      - from: REVERIFY_REQUIRED
        to: SUSPENDED
        trigger: "POST /v1/business-listings/{id}/suspend"
        actor: PolicyAnalyst
        preconditions: ["violation_type in enum; KEYWORD_STUFFING requires strikes >= 2"]
        side_effects: ["Same cascade as CLAIM_PENDING -> SUSPENDED"]
      - from: SUSPENDED
        to: VERIFIED
        trigger: "SuspensionCase OVERTURNED decision (see SuspensionCase machine) — reinstatement restores pre-suspension status VERIFIED"
        actor: system
        preconditions:
          - "Listing was VERIFIED/REVERIFY_REQUIRED at suspension time"
        side_effects:
          - "visibility recomputed from health_score"
          - "If suspension lasted past reverify_due_at, status becomes REVERIFY_REQUIRED instead (system picks the stricter of the two)"
      - from: SUSPENDED
        to: PERMANENTLY_CLOSED
        trigger: "SuspensionCase UPHELD decision"
        actor: system
        preconditions: []
        side_effects:
          - "visibility = HIDDEN; all UserReview remain but listing excluded from public lists"
          - "Owner contributor trust recomputed with -25 permanent penalty folded into finalized_trust_score"

  - entity: UserReview
    initial_state: PUBLISHED
    terminal_states: [REMOVED]
    transitions:
      - from: PUBLISHED
        to: FLAGGED
        trigger: "POST /v1/reviews/{id}/flag (contributor or listing owner) OR system auto-flag when fake_probability >= 0.80 at creation"
        actor: Contributor
        preconditions:
          - "Review status PUBLISHED (ERR_INVALID_STATE)"
          - "flag_count < 5 (ERR_FLAG_LIMIT_REACHED)"
        side_effects:
          - "Create ReviewFlag OPEN (reporter_is_owner per reporter); flag_count += 1"
      - from: FLAGGED
        to: UNDER_MODERATION
        trigger: "POST /v1/review-tickets with queue=REVIEW_MODERATION referencing the flag (moderator pulls flag into moderation)"
        actor: Moderator
        preconditions: []
        side_effects:
          - "ReviewTicket CLAIMED; review leaves public aggregates (review_count/rating_avg recompute excludes UNDER_MODERATION)"
      - from: UNDER_MODERATION
        to: REMOVED
        trigger: "POST /v1/review-tickets/{id}/resolve with resolution=REMOVE"
        actor: Moderator
        preconditions: ["Ticket CLAIMED by acting moderator"]
        side_effects:
          - "ReviewFlag.status = UPHELD; flag_count recompute"
          - "Author ContributorGrant for the review REVOKED (compensating_invariant: total_points returns to pre-review value)"
          - "Listing review_count/rating_avg recompute; health scores recompute; if health drops below 30 listing visibility -> RESTRICTED (cascade link 2)"
      - from: UNDER_MODERATION
        to: PUBLISHED
        trigger: "POST /v1/review-tickets/{id}/resolve with resolution=RESTORE (cyclic restore)"
        actor: Moderator
        preconditions: ["Ticket CLAIMED by acting moderator"]
        side_effects:
          - "ReviewFlag.status = DISMISSED; flag_count recompute"
          - "Review re-enters public aggregates (review_count/rating_avg/health recompute)"
      - from: FLAGGED
        to: PUBLISHED
        trigger: "POST /v1/review-flags/{id}/dismiss (moderator dismisses without full moderation)"
        actor: Moderator
        preconditions: []
        side_effects:
          - "ReviewFlag.status = DISMISSED; flag_count -= 1; if flag_count == 0 review auto-returns to PUBLISHED (conditional cascade)"

  - entity: SuspensionCase
    initial_state: OPEN
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: OPEN
        to: APPEAL_SUBMITTED
        trigger: "POST /v1/suspension-cases/{id}/appeal"
        actor: BusinessOwner
        preconditions:
          - "Acting contributor id == listing.owner_contributor_id (ERR_NOT_LISTING_OWNER)"
          - "logical clock <= appeal_deadline (ERR_APPEAL_WINDOW_CLOSED)"
          - "appeal_text length >= 50 chars (ERR_INVALID_REQUEST)"
        side_effects: ["appeal_text stored"]
      - from: APPEAL_SUBMITTED
        to: UNDER_APPEAL_REVIEW
        trigger: "POST /v1/suspension-cases/{id}/start-appeal-review"
        actor: PolicyAnalyst
        preconditions:
          - "Acting analyst id != original suspending analyst id (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: UNDER_APPEAL_REVIEW
        to: UPHELD
        trigger: "POST /v1/suspension-cases/{id}/decide with decision=UPHELD"
        actor: PolicyAnalyst
        preconditions: ["decided_by = acting analyst; same analyst who started review"]
        side_effects:
          - "BusinessListing -> PERMANENTLY_CLOSED (cascade per listing machine)"
      - from: UNDER_APPEAL_REVIEW
        to: OVERTURNED
        trigger: "POST /v1/suspension-cases/{id}/decide with decision=OVERTURNED"
        actor: PolicyAnalyst
        preconditions: ["same analyst who started review (ERR_NOT_TICKET_OWNER)"]
        side_effects:
          - "BusinessListing SUSPENDED -> VERIFIED (or REVERIFY_REQUIRED if reverify_due_at passed; reinstatement cascade)"
          - "Owner trust penalty reversed; keyword_stuffing_strikes reset to 0 when violation_type == KEYWORD_STUFFING"

  - entity: ImageryTask
    initial_state: PLANNED
    terminal_states: [PUBLISHED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /v1/imagery-tasks/{id}/schedule"
        actor: ImageryOperator
        preconditions:
          - "Region posture in {ACTIVE, CLEAR} (ERR_REGION_FROZEN)"
          - "No other ImageryTask in same region+collection_zone with status in {SCHEDULED, CAPTURED, BLUR_PENDING, REPROCESS, BLURRED} whose [window_start, window_end) overlaps (half-open adjacency allowed: end == start is NOT overlap) (ERR_WINDOW_OVERLAP)"
          - "Region active-task count < region.max_active_imagery_tasks (ERR_IMAGERY_CAPACITY)"
        side_effects: ["Region.privacy_pending_count unchanged (not yet captured)"]
      - from: SCHEDULED
        to: CAPTURED
        trigger: "POST /v1/imagery-tasks/{id}/capture"
        actor: ImageryOperator
        preconditions:
          - "logical clock within [window_start, window_end) (ERR_OUTSIDE_WINDOW)"
          - "capture_media_count >= 1"
        side_effects:
          - "Region.privacy_pending_count += 1 (ledger sync; drives region_privacy_clearance)"
          - "Region posture recompute: if posture was CLEAR and privacy_pending_count > 0 -> CLEARANCE_PENDING (bubble up)"
      - from: CAPTURED
        to: BLUR_PENDING
        trigger: "system immediately after capture (same request)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLUR_PENDING
        to: BLURRED
        trigger: "POST /v1/imagery-tasks/{id}/blur-complete"
        actor: ImageryOperator
        preconditions:
          - "blurred_media_count >= capture_media_count when blur_obligation != FACES_ONLY; when FACES_ONLY, blurred_media_count >= 1 (ERR_BLUR_INCOMPLETE)"
        side_effects: []
      - from: BLUR_PENDING
        to: REPROCESS
        trigger: "POST /v1/imagery-tasks/{id}/blur-complete with reprocess=true (quality gate failed; cyclic re-blur loop)"
        actor: ImageryOperator
        preconditions: []
        side_effects: ["blurred_media_count reset to 0"]
      - from: REPROCESS
        to: BLUR_PENDING
        trigger: "POST /v1/imagery-tasks/{id}/blur-complete after reprocessing"
        actor: ImageryOperator
        preconditions: ["blurred_media_count >= capture_media_count (ERR_BLUR_INCOMPLETE)"]
        side_effects: []
      - from: BLURRED
        to: PUBLISHED
        trigger: "POST /v1/imagery-tasks/{id}/publish"
        actor: ImageryOperator
        preconditions: ["Region posture != FROZEN"]
        side_effects:
          - "Region.privacy_pending_count -= 1 (compensating ledger)"
          - "If privacy_pending_count reaches 0 and posture == CLEARANCE_PENDING -> posture CLEAR (bubble up)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /v1/imagery-tasks/{id}/cancel"
        actor: ImageryOperator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/imagery-tasks/{id}/cancel"
        actor: ImageryOperator
        preconditions: ["logical clock < window_start (ERR_WINDOW_ALREADY_STARTED)"]
        side_effects: []

  - entity: RoutingUpdate
    initial_state: PROPOSED
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: VALIDATED
        trigger: "POST /v1/routing-updates/{id}/validate"
        actor: RoutingEngineer
        preconditions:
          - "Region posture in {ACTIVE, CLEAR, CLEARANCE_PENDING} (ERR_REGION_FROZEN)"
          - "For CLOSURE/CONSTRUCTION: no other RoutingUpdate on same segment_ref with status in {VALIDATED, SCHEDULED, ACTIVE} whose effective window lies within 24h of this window on either side (buffer semantics: gap must be >= 24h; exactly 24h allowed) (ERR_ROUTING_WINDOW_CONFLICT)"
          - "effective_start < effective_end (ERR_INVALID_REQUEST)"
        side_effects: ["Region.routing_version += 1"]
      - from: VALIDATED
        to: SCHEDULED
        trigger: "system at validate when effective_start > now (same request)"
        actor: system
        preconditions: ["effective_start > now"]
        side_effects: []
      - from: VALIDATED
        to: ACTIVE
        trigger: "system at validate when effective_start <= now (same request)"
        actor: system
        preconditions: ["effective_start <= now"]
        side_effects: []
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /v1/routing-updates/{id}/activate (early activation) or system sweep POST /v1/routing-updates/sweep-activation when now >= effective_start"
        actor: RoutingEngineer
        preconditions: []
        side_effects:
          - "Region.routing_version += 1"
          - "If supersedes_id set: the superseded RoutingUpdate -> SUPERSEDED-via-CANCELLED (status CANCELLED with note) — only when superseded still in {PROPOSED, VALIDATED, SCHEDULED}"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep POST /v1/routing-updates/sweep-expired when now >= effective_end"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["Region.routing_version += 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /v1/routing-updates/{id}/cancel"
        actor: RoutingEngineer
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: CANCELLED
        trigger: "POST /v1/routing-updates/{id}/cancel"
        actor: RoutingEngineer
        preconditions: []
        side_effects: ["Region.routing_version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/routing-updates/{id}/cancel"
        actor: RoutingEngineer
        preconditions: ["logical clock < effective_start"]
        side_effects: ["Region.routing_version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: edit-create-stale-listing
    parent_entity: BusinessListing
    write_endpoint: "POST /v1/map-edits"
    occ_field: "expected_listing_version"
    description: |
      Creating a MapEdit against a BusinessListing whose version has advanced
      since the client last observed it is rejected. The new edit legitimately
      supersedes the client's view of listing fields (e.g., a name edit created
      after another edit already changed the name), so the stale write must
      be refused rather than silently layered.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-stale-listing
    parent_entity: BusinessListing
    write_endpoint: "POST /v1/business-listings/{id}/claim"
    occ_field: "expected_listing_version"
    description: |
      Claiming a BusinessListing whose version has advanced since the client
      last read it is rejected with the stale-version error, so a claim built
      on an outdated snapshot (e.g., one taken before another claim or a
      suspension mutated the listing) cannot complete.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: routing-create-stale-region
    parent_entity: Region
    write_endpoint: "POST /v1/routing-updates"
    occ_field: "expected_region_version"
    description: |
      Creating a RoutingUpdate against a Region whose version has advanced
      since the client last observed it is rejected; routing data is
      epoch-versioned and a create built on a stale epoch must restart from
      a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contributor_trust_score
    trigger: "Recomputed whenever a MapEdit of the contributor changes status (publish/reject/revert), when a ContributorGrant is posted or revoked, when an owned listing is permanently closed, and on GET /v1/contributors/{id}"
    algorithm: weighted_scoring
    formula: |
      Let P = count of MapEdit by contributor with status PUBLISHED in the input set,
          R = count with status REJECTED,
          V = count with status REVERTED.
      base = 50 + 3*P - 6*R - 9*V
      If any BusinessListing owned by the contributor has status PERMANENTLY_CLOSED:
          base -= 25  (permanence penalty, applies once regardless of closed-listing count)
      trust = clamp(0, 100, base)
      Contributor with finalized trust < 20 auto-transitions to status RESTRICTED (system).
    input_set: "MapEdit rows of the contributor filtered per variant (see variants); REVERTED edits are counted in V and NOT in P"
    constants:
      BASE: 50
      W_PUBLISHED: 3
      W_REJECTED: 6
      W_REVERTED: 9
      PERMANENT_CLOSE_PENALTY: 25
      RESTRICT_THRESHOLD: 20
    precision: "0 decimal places (integer trust); clamp to [0,100]"
    variants:
      - name: provisional
        when: "Surface for auto-validation routing and public display (provisional_trust_score field)"
        difference: "Input set includes ALL MapEdit rows regardless of age"
      - name: finalized
        when: "Used for auto-RESTRICT gating and edit_auto_validation_score trust component (finalized_trust_score field)"
        difference: "Input set excludes MapEdit rows whose created_at is less than 7 days before the current logical clock time (young edits do not yet count)"

  - name: contributor_points_award
    trigger: "On ContributorGrant creation (any source_type) and on revoke (recompute totals)"
    algorithm: aggregation
    formula: |
      Per-grant points = round_half_up(base_points * quality_multiplier)  # ROUND PER CONTRIBUTION FIRST
      total_points    = sum(points) over ContributorGrant with status POSTED
      lifetime_points = sum(points) over ALL ContributorGrant rows (POSTED + REVOKED)
      level = NEWCOMER if total_points < 50
              REGULAR  if 50   <= total_points < 250
              TRUSTED  if 250  <= total_points < 1000
              EXPERT   if 1000 <= total_points < 5000
              MASTER   if 5000 <= total_points
      # Rounding order is pinned: per-contribution rounding, then sum.
      # The alternative (sum raw products, then round once) is FORBIDDEN and
      # yields different totals (e.g. grants 1*0.5 and 1*0.5: pinned = 1+1 = 2,
      # sum-then-round = round(1.0) = 1).
    input_set: "ContributorGrant rows of one contributor, status-filtered as above"
    constants:
      T_REGULAR: 50
      T_TRUSTED: 250
      T_EXPERT: 1000
      T_MASTER: 5000
    precision: "integer points; round_half_up applied per grant before summation"
    variants:
      - name: per_contribution_rounding
        when: "always (pinned)"
        difference: "round each grant then sum — pinned order"
      - name: sum_then_round
        when: "never (explicitly forbidden alternative)"
        difference: "sum raw products then round once — produces different totals on half-point products"

  - name: listing_health_score
    trigger: "Recomputed when a UserReview on the listing changes status, when a MapEdit on the listing is published or reverted, when the listing is suspended or reinstated, and on GET /v1/business-listings/{id}"
    algorithm: weighted_scoring
    formula: |
      # EVALUATION ORDER IS PINNED (circular-looking dependency):
      # Step 1: revert_rate over the trailing 30 days FIRST.
      #   window = edits on this listing with created_at in [now-30d, now]
      #   revert_rate = V_w / max(1, P_w + V_w)  where P_w/V_w are windowed
      #   PUBLISHED / REVERTED counts (REVERTED not double-counted in P_w).
      # Step 2: rating aggregate (variant-specific, see variants).
      # Step 3: health = clamp(0, 100, round_half_up(
      #   50 + 4*rating_avg_used + 2*min(accepted_edit_count, 10)
      #      - 40*revert_rate - 5*is_suspended, 2))
      #   is_suspended = 1 if listing status == SUSPENDED else 0
      # visibility: status SUSPENDED/PERMANENTLY_CLOSED => HIDDEN;
      #   else public-variant health < 30 => RESTRICTED; else PUBLIC.
    input_set: "Reviews and edits of one listing; reviews filtered per variant; edits windowed to trailing 30 days for revert_rate"
    constants:
      BASE: 50
      W_RATING: 4
      W_ACCEPTED_EDITS: 2
      ACCEPTED_EDITS_CAP: 10
      W_REVERT_RATE: 40
      W_SUSPENDED: 5
      RESTRICT_THRESHOLD: 30
      REVERT_WINDOW_DAYS: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: public
        when: "health_score field; drives visibility"
        difference: "rating_avg_used = rating_avg over UserReview with status PUBLISHED only (0.0 when none)"
      - name: moderation
        when: "moderation_health_score field; drives Moderator queue prioritisation"
        difference: "rating_avg_used = (sum(PUBLISHED ratings) + 0.5*sum(UNDER_MODERATION ratings)) / (count(PUBLISHED) + 0.5*count(UNDER_MODERATION)); 0.0 when denominator is 0"

  - name: hours_conflict_winner
    trigger: "On POST /v1/business-listings/{id}/hours/resolve and on GET of a listing's accepted hours"
    algorithm: weighted_scoring
    formula: |
      For a given listing + day_mask, score each HoursObservation:
        source_priority = OWNER:5, THIRD_PARTY_FEED:4, WEB_CRAWL:3, IMAGERY:2, CONTRIBUTOR:1
        # CONDITIONAL BRANCH on contributor level: a CONTRIBUTOR observation whose
        # submitting contributor level is EXPERT or MASTER is promoted to priority 3.
        age_days = floor((now - recorded_at) / 86400)
        recency_score = max(0, 30 - age_days)
        corroboration_bonus = min(corroboration_count, 5) * 10
        score = source_priority*100 + recency_score + corroboration_bonus
      Winner = highest score; tie-break: later recorded_at wins; final tie-break:
        earlier created_at wins.
      Winner gets accepted=true; all others on the same listing+day_mask accepted=false.
      Empty candidate set (no observations for listing+day_mask): nothing is
      accepted and no error is raised — the resolve response reports an empty
      accepted list.
    input_set: "All HoursObservation rows for one listing sharing the same day_mask, regardless of accepted flag"
    constants:
      RECENCY_WINDOW_DAYS: 30
      CORROBORATION_CAP: 5
      CORROBORATION_UNIT: 10
      PRIORITY_SCALE: 100
    precision: "integer scores"
    variants: []

  - name: review_fake_probability
    trigger: "On POST /v1/reviews (at creation) and on POST /v1/reviews/sweep-fake-detection (re-evaluation of PUBLISHED reviews)"
    algorithm: weighted_scoring
    formula: |
      Signals (each 0 or 1):
        I1 = 1 if reviewer finalized_trust_score < 30
        I2 = 1 if reviewer has >= 3 other UserReview rows created within the
             trailing 24h (logical clock) on listings in the same region
        I3 = 1 if len(text) < 20 characters
        I4 = 1 if reviewer account created_at is less than 7 days before now
      fake_probability = clamp(0, 1, 0.10*I1 + 0.25*I2 + 0.30*I3 + 0.35*I4)
      If fake_probability >= 0.80: system creates an OPEN ReviewFlag with
        reason FAKE and reporter_contributor_id null (auto-detection); the
        review transitions PUBLISHED -> FLAGGED.
    input_set: "The new review plus the reviewer's trust, account age, and trailing-24h review history in the listing's region"
    constants:
      W_LOW_TRUST: 0.10
      W_BURST: 0.25
      W_SHORT_TEXT: 0.30
      W_NEW_ACCOUNT: 0.35
      AUTO_FLAG_THRESHOLD: 0.80
      BURST_COUNT: 3
      BURST_WINDOW_HOURS: 24
      SHORT_TEXT_LEN: 20
      NEW_ACCOUNT_DAYS: 7
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: edit_auto_validation_score
    trigger: "On POST /v1/map-edits (at creation, before any human review)"
    algorithm: threshold
    formula: |
      score = clamp(0, 100,
          40
        + 0.4 * contributor.finalized_trust_score
        + 10 * min(len(payload.evidence_urls), 3)
        - risk)
      risk = 25 if edit_type in {ADDRESS, LOCATION}
             10 if edit_type == NAME and listing.keyword_stuffing_strikes == 0
             30 if edit_type == NAME and listing.keyword_stuffing_strikes > 0
              5 otherwise  (CATEGORY, HOURS, ATTRIBUTE)
      payload.evidence_urls is an optional array (missing => 0 items).
      Routing: score >= 85      => SUBMITTED -> AUTO_VALIDATED -> PUBLISHED
               50 <= score < 85 => SUBMITTED -> QUEUED
               score < 50       => SUBMITTED -> REJECTED (AUTO_LOW_SCORE)
      Boundary is exact: 85.0 publishes; anything strictly below 85 queues.
    input_set: "The new edit, its contributor's finalized_trust_score, and the target listing's keyword_stuffing_strikes"
    constants:
      BASE: 40
      W_TRUST: 0.4
      W_EVIDENCE: 10
      EVIDENCE_CAP: 3
      RISK_ADDRESS_LOCATION: 25
      RISK_NAME_CLEAN: 10
      RISK_NAME_STRUCK: 30
      RISK_OTHER: 5
      AUTO_APPROVE_MIN: 85
      QUEUE_MIN: 50
    precision: "1 decimal place (trust contributes 0.4*integer); comparisons exact"
    variants: []

  - name: verification_attempt_cooldown
    trigger: "On POST /v1/verification-attempts (before issuing a new attempt)"
    algorithm: threshold
    formula: |
      Let last_failed = the most recent VerificationAttempt on this listing with
        status FAILED (by created_at; tie-break: later created_at — none, exact
        timestamps are distinct per logical clock tick).
      If last_failed exists and now < last_failed.updated_at + 72h:
        reject with ERR_VERIFICATION_COOLDOWN.
      attempts_30d = count of VerificationAttempt rows on this listing with
        created_at >= now - 30d (inclusive).
      If attempts_30d >= 5: reject with ERR_TOO_MANY_ATTEMPTS.
      Boundary: exactly 72h after failure => allowed; at 5 prior attempts in the
      window the 6th is rejected.
    input_set: "VerificationAttempt rows of one listing"
    constants:
      COOLDOWN_HOURS: 72
      MAX_ATTEMPTS_PER_30D: 5
    precision: "whole hours; boundary comparisons use < (strict) for cooldown and >= for the 30-day cap"
    variants: []

  - name: region_privacy_clearance
    trigger: "On ImageryTask capture, blur-complete, publish, cancel, and on Region read"
    algorithm: aggregation
    formula: |
      privacy_pending_count = count of ImageryTask in the region with status in
        {CAPTURED, BLUR_PENDING, REPROCESS}.
      posture (computed):
        if frozen == true                                   => FROZEN
        else if privacy_pending_count > 0                   => CLEARANCE_PENDING
        else if exists ImageryTask in region with capture_media_count > 0
                                                            => CLEAR
        else                                                => ACTIVE
      Transitions ACTIVE->CLEARANCE_PENDING (first capture), CLEARANCE_PENDING->CLEAR
      (count drains to 0 via publish/cancel), CLEAR->CLEARANCE_PENDING (new capture)
      are system side effects of the ImageryTask machine (bubble up).
    input_set: "ImageryTask rows of one region, status-filtered as above"
    constants: {}
    precision: "integer count"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a declared role; X-User-ID present for all non-Anonymous roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7 (e.g., Contributor cannot resolve ReviewTickets; Moderator cannot suspend listings)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (region before listing before edit); unknown UUID"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Body-referenced resources exist (listing_id, contributor_id, region_id, review_id, supersedes_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "Required fields present; enum values in declared sets; string lengths within bounds; rating integer 1..5; quality_multiplier in [0.0, 3.0]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "Target resource is in a state that admits the operation (edit only on non-terminal listing; submit-code only on ISSUED/CODE_SUBMITTED attempt; resolve only on CLAIMED ticket; appeal only on OPEN case; schedule only on PLANNED task; validate only on PROPOSED update)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes (POST /v1/map-edits, POST /v1/business-listings/{id}/claim, POST /v1/routing-updates)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/map-edits, POST /v1/business-listings/{id}/claim, POST /v1/routing-updates"
  - priority: 8
    category: business_referential
    check: "Ownership/assignment: actor is the listing owner (claim-adjacent ops, submit-code, appeal), the edit author (supply-info), or the claiming moderator/analyst (ticket resolve, case decide)"
    error_id: ERR_NOT_LISTING_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 9
    category: state
    check: "Listing admits the operation: MapEdit creation requires listing status not in {SUSPENDED, PERMANENTLY_CLOSED}; UserReview creation requires listing visibility != HIDDEN (status not SUSPENDED/PERMANENTLY_CLOSED); verification attempt creation requires listing in {CLAIM_PENDING, REVERIFY_REQUIRED}"
    error_id: ERR_LISTING_SUSPENDED
    http_status: 409
    applies_to: "POST /v1/map-edits, POST /v1/reviews, POST /v1/verification-attempts"
  - priority: 10
    category: business_safety
    check: "Content policy: listing name must not contain keyword-stuffing patterns (2+ consecutive uppercase keyword tokens from the service-keyword list, e.g. 'BEST CHEAP PIZZA NEAR ME'); violation increments keyword_stuffing_strikes and rejects the write"
    error_id: ERR_KEYWORD_STUFFING
    http_status: 422
    applies_to: "POST /v1/business-listings, POST /v1/map-edits (edit_type NAME), PATCH /v1/business-listings/{id}"
  - priority: 11
    category: business_safety
    check: "Category policy: category must not be in prohibited set {ESCORT, WEAPONS, ADULT} at create or via CATEGORY edit"
    error_id: ERR_PROHIBITED_CATEGORY
    http_status: 422
    applies_to: "POST /v1/business-listings, POST /v1/map-edits (edit_type CATEGORY)"
  - priority: 12
    category: business_safety
    check: "Geofence: geo_lat/geo_lng must lie inside the referenced region's bounding box (fake-address screen)"
    error_id: ERR_GEO_OUT_OF_REGION
    http_status: 422
    applies_to: "POST /v1/business-listings, POST /v1/map-edits (edit_type LOCATION or ADDRESS)"
  - priority: 13
    category: business_temporal
    check: "Verification: attempt not expired (now < expires_at); attempts_used < max_attempts; cooldown 72h after last FAILED; <= 5 attempts per listing per trailing 30 days"
    error_id: ERR_ATTEMPT_EXPIRED
    http_status: 409
    applies_to: "POST /v1/verification-attempts, POST /v1/verification-attempts/{id}/submit-code"
  - priority: 14
    category: business_temporal
    check: "Appeal window: logical clock <= SuspensionCase.appeal_deadline"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /v1/suspension-cases/{id}/appeal"
  - priority: 15
    category: business_constraint
    check: "Imagery scheduling: no overlapping [window_start, window_end) on same region+collection_zone among non-terminal tasks (half-open: end == start allowed); region active-task count < max_active_imagery_tasks"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /v1/imagery-tasks, POST /v1/imagery-tasks/{id}/schedule"
  - priority: 16
    category: business_temporal
    check: "Routing windows: for CLOSURE/CONSTRUCTION on same segment_ref, gap to any VALIDATED/SCHEDULED/ACTIVE window must be >= 24h on both sides (exactly 24h allowed)"
    error_id: ERR_ROUTING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /v1/routing-updates/{id}/validate"
  - priority: 17
    category: business_constraint
    check: "Review flagging: review must be PUBLISHED/FLAGGED; flag_count < 5"
    error_id: ERR_FLAG_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /v1/reviews/{id}/flag"
  - priority: 18
    category: business_constraint
    check: "Segregation of duties: appeal reviewer != suspending analyst; ticket resolver == claiming moderator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /v1/suspension-cases/{id}/start-appeal-review, POST /v1/review-tickets/{id}/resolve"
  - priority: 19
    category: business_fiscal
    check: "Keyword-stuffing suspension requires keyword_stuffing_strikes >= 2 accumulated before the suspend call when violation_type == KEYWORD_STUFFING"
    error_id: ERR_STRIKES_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /v1/business-listings/{id}/suspend"
  - priority: 20
    category: business_fiscal
    check: "Contributor must be ACTIVE (not RESTRICTED/BANNED) to submit edits, reviews, grants-affecting actions, or claims"
    error_id: ERR_CONTRIBUTOR_RESTRICTED
    http_status: 403
    applies_to: "POST /v1/map-edits, POST /v1/reviews, POST /v1/business-listings/{id}/claim, POST /v1/map-edits/{id}/supply-info"
  - priority: 21
    category: business_constraint
    check: "Blur completeness: blur-complete requires blurred_media_count >= capture_media_count (or >= 1 for FACES_ONLY)"
    error_id: ERR_BLUR_INCOMPLETE
    http_status: 422
    applies_to: "POST /v1/imagery-tasks/{id}/blur-complete"
  - priority: 22
    category: business_temporal
    check: "Capture must occur within [window_start, window_end); cancel of SCHEDULED task only before window_start"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /v1/imagery-tasks/{id}/capture, POST /v1/imagery-tasks/{id}/cancel"
  - priority: 23
    category: state
    check: "Region must not be FROZEN for imagery schedule/publish and routing validate"
    error_id: ERR_REGION_FROZEN
    http_status: 409
    applies_to: "POST /v1/imagery-tasks/{id}/schedule, POST /v1/imagery-tasks/{id}/publish, POST /v1/routing-updates/{id}/validate"
  - priority: 24
    category: business_constraint
    check: "Duplicate detection: contributor may not create a second MapEdit on the same listing+edit_type while one is in {SUBMITTED, QUEUED, IN_REVIEW, NEEDS_MORE_INFO}; contributor may not review the same listing twice while the first review is non-terminal"
    error_id: ERR_DUPLICATE_SUBMISSION
    http_status: 409
    applies_to: "POST /v1/map-edits, POST /v1/reviews"
  - priority: 25
    category: business_constraint
    check: "Imagery capacity: region active-task count must be < max_active_imagery_tasks at schedule time"
    error_id: ERR_IMAGERY_CAPACITY
    http_status: 409
    applies_to: "POST /v1/imagery-tasks/{id}/schedule"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- platform plumbing ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is exactly 2026-09-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []
  - method: POST
    path: "/v1/verification-attempts/sweep-expired"
    description: "System sweep: every ISSUED VerificationAttempt with expires_at <= now transitions to EXPIRED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { expired_count: integer }
    side_effects: ["VerificationAttempt ISSUED -> EXPIRED for all expired attempts"]
  - method: POST
    path: "/v1/business-listings/sweep-reverify"
    description: "System sweep: every VERIFIED listing with reverify_due_at <= now transitions to REVERIFY_REQUIRED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { transitioned_count: integer }
    side_effects: ["BusinessListing VERIFIED -> REVERIFY_REQUIRED; ISSUED attempts on those listings CANCELLED"]
  - method: POST
    path: "/v1/routing-updates/sweep-activation"
    description: "System sweep: SCHEDULED RoutingUpdates with effective_start <= now become ACTIVE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { activated_count: integer }
    side_effects: ["RoutingUpdate SCHEDULED -> ACTIVE; Region.routing_version += 1 each"]
  - method: POST
    path: "/v1/routing-updates/sweep-expired"
    description: "System sweep: ACTIVE RoutingUpdates with effective_end <= now become EXPIRED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { expired_count: integer }
    side_effects: ["RoutingUpdate ACTIVE -> EXPIRED; Region.routing_version += 1 each"]
  - method: POST
    path: "/v1/reviews/sweep-fake-detection"
    description: "Re-run review_fake_probability over all PUBLISHED reviews; reviews crossing >= 0.80 are auto-flagged"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { flagged_count: integer }
    side_effects: ["UserReview PUBLISHED -> FLAGGED; auto ReviewFlag FAKE created"]

  # --- regions ---
  - method: POST
    path: "/v1/regions"
    description: "Create a region"
    roles: [PlatformAdmin]
    code: 201
    input: [name, country_code, timezone, geo_min_lat, geo_max_lat, geo_min_lng, geo_max_lng, "max_active_imagery_tasks?"]
    output: Region
    side_effects: []
  - method: GET
    path: "/v1/regions"
    description: "List regions"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst, ImageryOperator, RoutingEngineer]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: Region[]
    side_effects: []
  - method: GET
    path: "/v1/regions/{id}"
    description: "Get one region (posture recomputed)"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst, ImageryOperator, RoutingEngineer]
    code: 200
    input: []
    output: Region
    side_effects: ["region_privacy_clearance recompute on read"]

  # --- contributors ---
  - method: POST
    path: "/v1/contributors"
    description: "Register a contributor account"
    roles: [Anonymous]
    code: 201
    input: [display_name, email, home_region_id]
    output: Contributor
    side_effects: ["Initial trust scores = 50; total_points = 0; level = NEWCOMER"]
  - method: GET
    path: "/v1/contributors"
    description: "List contributors"
    roles: [PlatformAdmin, Moderator, PolicyAnalyst]
    code: 200
    input: ["status?", "level?", "home_region_id?", "limit?", "offset?"]
    output: Contributor[]
    side_effects: []
  - method: GET
    path: "/v1/contributors/{id}"
    description: "Get contributor (trust scores and level recomputed)"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: []
    output: Contributor
    side_effects: ["contributor_trust_score + contributor_points_award recompute on read"]
  - method: GET
    path: "/v1/contributors/{id}/grants"
    description: "List a contributor's point grants"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContributorGrant[]
    side_effects: []
  - method: POST
    path: "/v1/contributor-grants"
    description: "Manual point adjustment (source_type ADJUSTMENT, note required; negative base_points allowed)"
    roles: [PlatformAdmin]
    code: 201
    input: [contributor_id, source_type, source_id, base_points, "quality_multiplier?", note]
    output: ContributorGrant
    side_effects: ["contributor_points_award recompute (total_points, lifetime_points, level)"]
  - method: POST
    path: "/v1/contributor-grants/{id}/revoke"
    description: "Revoke a posted grant (status -> REVOKED)"
    roles: [PlatformAdmin, Moderator]
    code: 200
    input: []
    output: ContributorGrant
    side_effects: ["contributor_points_award recompute; compensating_invariant: lifetime_points unchanged, total_points decreases by grant.points"]

  # --- business listings ---
  - method: POST
    path: "/v1/business-listings"
    description: "Create a business listing (UNCLAIMED)"
    roles: [PlatformAdmin, BusinessOwner]
    code: 201
    input: [region_id, name, category, address_text, geo_lat, geo_lng]
    output: BusinessListing
    side_effects: []
  - method: GET
    path: "/v1/business-listings"
    description: "List listings; PERMANENTLY_CLOSED excluded unless status filter names it"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: ["region_id?", "owner_contributor_id?", "status?", "visibility?", "category?", "limit?", "offset?"]
    output: BusinessListing[]
    side_effects: []
  - method: GET
    path: "/v1/business-listings/{id}"
    description: "Get one listing (health scores recomputed)"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: []
    output: BusinessListing
    side_effects: ["listing_health_score recompute on read"]
  - method: PATCH
    path: "/v1/business-listings/{id}"
    description: "Owner updates name/address_text/geo (name updates re-screen for keyword stuffing; strikes increment on violation and the write is rejected)"
    roles: [BusinessOwner, PlatformAdmin]
    code: 200
    input: ["name?", "address_text?", "geo_lat?", "geo_lng?"]
    output: BusinessListing
    side_effects: ["keyword_stuffing_strikes += 1 on ERR_KEYWORD_STUFFING violation (strike persists even though write fails)"]
  - method: POST
    path: "/v1/business-listings/{id}/claim"
    description: "Claim an unclaimed listing (OCC on listing version)"
    roles: [BusinessOwner]
    code: 200
    input: [expected_listing_version]
    output: BusinessListing
    side_effects: ["BusinessListing UNCLAIMED -> CLAIM_PENDING; increments BusinessListing.version by 1"]
  - method: POST
    path: "/v1/business-listings/{id}/suspend"
    description: "Suspend a listing for a policy violation; creates SuspensionCase and cascades edit rejections + trust demotion"
    roles: [PolicyAnalyst]
    code: 200
    input: [violation_type, evidence_notes]
    output: SuspensionCase
    side_effects: ["SuspensionCase OPEN created (appeal_deadline = now + 30d)", "listing -> SUSPENDED, visibility HIDDEN", "non-terminal MapEdits REJECTED", "contributor trust demotion cascade (RESTRICTED below 20)", "increments BusinessListing.version by 1"]
  - method: POST
    path: "/v1/business-listings/{id}/require-reverify"
    description: "Policy analyst manually forces reverification"
    roles: [PolicyAnalyst]
    code: 200
    input: []
    output: BusinessListing
    side_effects: ["BusinessListing VERIFIED -> REVERIFY_REQUIRED; ISSUED attempts CANCELLED"]
  - method: GET
    path: "/v1/business-listings/{id}/map-edits"
    description: "List edits on a listing"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MapEdit[]
    side_effects: []
  - method: GET
    path: "/v1/business-listings/{id}/reviews"
    description: "List reviews on a listing"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: UserReview[]
    side_effects: []
  - method: GET
    path: "/v1/business-listings/{id}/hours-observations"
    description: "List hours observations on a listing"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: ["day_mask?", "limit?", "offset?"]
    output: HoursObservation[]
    side_effects: []
  - method: POST
    path: "/v1/business-listings/{id}/hours/resolve"
    description: "Run hours_conflict_winner over the listing's observations for one day_mask"
    roles: [PlatformAdmin, Moderator]
    code: 200
    input: [day_mask]
    output: { accepted_observation_id: string, accepted_count: integer }
    side_effects: ["hours_conflict_winner; accepted flags rewritten for listing+day_mask"]

  # --- verification attempts ---
  - method: POST
    path: "/v1/verification-attempts"
    description: "Issue a verification attempt for a listing in CLAIM_PENDING or REVERIFY_REQUIRED"
    roles: [BusinessOwner]
    code: 201
    input: [listing_id, method]
    output: VerificationAttempt
    side_effects: ["code minted (6-digit string)", "expires_at = now + 14d", "verification_attempt_cooldown checks"]
  - method: GET
    path: "/v1/verification-attempts"
    description: "List verification attempts"
    roles: [PlatformAdmin, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: ["listing_id?", "status?", "method?", "limit?", "offset?"]
    output: VerificationAttempt[]
    side_effects: []
  - method: GET
    path: "/v1/verification-attempts/{id}"
    description: "Get one attempt"
    roles: [PlatformAdmin, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: []
    output: VerificationAttempt
    side_effects: []
  - method: POST
    path: "/v1/verification-attempts/{id}/submit-code"
    description: "Submit the verification code; correct => VERIFIED (listing verified), wrong consuming last attempt => FAILED"
    roles: [BusinessOwner]
    code: 200
    input: [code]
    output: VerificationAttempt
    side_effects: ["attempts_used += 1; on VERIFIED: listing status VERIFIED + verification fields set + owner VERIFICATION_ASSIST grant"]
  - method: POST
    path: "/v1/verification-attempts/{id}/cancel"
    description: "Owner cancels an ISSUED attempt"
    roles: [BusinessOwner]
    code: 200
    input: []
    output: VerificationAttempt
    side_effects: ["ISSUED -> CANCELLED"]

  # --- map edits ---
  - method: POST
    path: "/v1/map-edits"
    description: "Submit a map edit (auto-validation routes to publish/queue/reject; OCC on listing version)"
    roles: [Contributor, BusinessOwner]
    code: 201
    input: [listing_id, contributor_id, edit_type, payload, expected_listing_version]
    output: MapEdit
    side_effects: ["edit_auto_validation_score computed; SUBMITTED -> AUTO_VALIDATED/QUEUED/REJECTED; AUTO_VALIDATED continues to PUBLISHED with grant + ledger cascades; increments BusinessListing.version by 1"]
  - method: GET
    path: "/v1/map-edits"
    description: "List map edits"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: ["listing_id?", "contributor_id?", "status?", "edit_type?", "review_ticket_id?", "limit?", "offset?"]
    output: MapEdit[]
    side_effects: []
  - method: GET
    path: "/v1/map-edits/{id}"
    description: "Get one edit"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: []
    output: MapEdit
    side_effects: []
  - method: POST
    path: "/v1/map-edits/{id}/supply-info"
    description: "Author supplies evidence after NEEDS_MORE_INFO; reopens review via fresh ticket"
    roles: [Contributor, BusinessOwner]
    code: 200
    input: [evidence]
    output: MapEdit
    side_effects: ["NEEDS_MORE_INFO -> IN_REVIEW; new OPEN ReviewTicket created (queue EDIT_REVIEW, priority HIGH)"]
  - method: POST
    path: "/v1/map-edits/{id}/revert"
    description: "Revert a published edit; compensates grant and listing ledger"
    roles: [PolicyAnalyst]
    code: 200
    input: []
    output: MapEdit
    side_effects: ["PUBLISHED -> REVERTED; accepted_edit_count -= 1; publish-grant REVOKED; trust + health recompute"]

  # --- review tickets ---
  - method: POST
    path: "/v1/review-tickets"
    description: "Create (and claim) a review ticket over a QUEUED edit or an OPEN flag"
    roles: [Moderator]
    code: 201
    input: [queue, "map_edit_id?", "review_flag_id?", "priority?"]
    output: ReviewTicket
    side_effects: ["queue=EDIT_REVIEW: MapEdit QUEUED -> IN_REVIEW (or re-review of NEEDS_MORE_INFO-supplied edit)", "queue=REVIEW_MODERATION: UserReview FLAGGED -> UNDER_MODERATION"]
  - method: GET
    path: "/v1/review-tickets"
    description: "List review tickets (the human review queue)"
    roles: [PlatformAdmin, Moderator]
    code: 200
    input: ["queue?", "status?", "claimed_by?", "priority?", "map_edit_id?", "review_flag_id?", "limit?", "offset?"]
    output: ReviewTicket[]
    side_effects: []
  - method: GET
    path: "/v1/review-tickets/{id}"
    description: "Get one ticket"
    roles: [PlatformAdmin, Moderator]
    code: 200
    input: []
    output: ReviewTicket
    side_effects: []
  - method: GET
    path: "/v1/map-edits/{id}/review-tickets"
    description: "List review tickets referencing one map edit (reverse reachability for ReviewTicket.map_edit_id)"
    roles: [PlatformAdmin, Moderator]
    code: 200
    input: ["limit?", "offset?"]
    output: ReviewTicket[]
    side_effects: []
  - method: GET
    path: "/v1/review-flags/{id}/review-tickets"
    description: "List review tickets referencing one review flag (reverse reachability for ReviewTicket.review_flag_id)"
    roles: [PlatformAdmin, Moderator]
    code: 200
    input: ["limit?", "offset?"]
    output: ReviewTicket[]
    side_effects: []
  - method: POST
    path: "/v1/review-tickets/{id}/claim"
    description: "Claim an OPEN ticket"
    roles: [Moderator]
    code: 200
    input: []
    output: ReviewTicket
    side_effects: ["OPEN -> CLAIMED; claimed_by = acting moderator"]
  - method: POST
    path: "/v1/review-tickets/{id}/resolve"
    description: "Resolve a CLAIMED ticket; only the claiming moderator may resolve (segregation of duties)"
    roles: [Moderator]
    code: 200
    input: [resolution]
    output: ReviewTicket
    side_effects: ["EDIT_REVIEW: APPROVE -> edit PUBLISHED (+grants/ledgers), REJECT -> REJECTED, NEEDS_INFO -> NEEDS_MORE_INFO; REVIEW_MODERATION: REMOVE -> review REMOVED (+grant revoke + health cascade), RESTORE -> PUBLISHED, DISMISS -> flag DISMISSED"]
  - method: POST
    path: "/v1/review-tickets/{id}/escalate"
    description: "Escalate a CLAIMED ticket to ESCALATED (priority bump; returns to queue for any moderator)"
    roles: [Moderator]
    code: 200
    input: []
    output: ReviewTicket
    side_effects: ["CLAIMED -> ESCALATED; priority bumped LOW->NORMAL->HIGH->CRITICAL (CRITICAL stays)"]

  # --- user reviews & flags ---
  - method: POST
    path: "/v1/reviews"
    description: "Post a review on a listing (fake_probability computed; >= 0.80 auto-flags)"
    roles: [Contributor, BusinessOwner]
    code: 201
    input: [listing_id, contributor_id, rating, text]
    output: UserReview
    side_effects: ["listing review_count/rating_avg recompute (PUBLISHED only); health recompute; ContributorGrant source_type REVIEW base_points 2 multiplier per reviewer level; auto-flag at fake_probability >= 0.80"]
  - method: GET
    path: "/v1/reviews"
    description: "List reviews"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: ["listing_id?", "contributor_id?", "status?", "limit?", "offset?"]
    output: UserReview[]
    side_effects: []
  - method: GET
    path: "/v1/reviews/{id}"
    description: "Get one review"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: []
    output: UserReview
    side_effects: []
  - method: POST
    path: "/v1/reviews/{id}/flag"
    description: "Flag a review (any contributor, or the listing owner reporting it)"
    roles: [Contributor, BusinessOwner]
    code: 201
    input: [reason]
    output: ReviewFlag
    side_effects: ["ReviewFlag OPEN created; flag_count += 1; review PUBLISHED -> FLAGGED"]
  - method: GET
    path: "/v1/review-flags"
    description: "List review flags"
    roles: [PlatformAdmin, Moderator, PolicyAnalyst]
    code: 200
    input: ["review_id?", "reporter_contributor_id?", "status?", "reason?", "limit?", "offset?"]
    output: ReviewFlag[]
    side_effects: []
  - method: GET
    path: "/v1/review-flags/{id}"
    description: "Get one review flag"
    roles: [PlatformAdmin, Moderator, PolicyAnalyst]
    code: 200
    input: []
    output: ReviewFlag
    side_effects: []
  - method: POST
    path: "/v1/review-flags/{id}/dismiss"
    description: "Dismiss a flag without full moderation; flag_count recompute may return review to PUBLISHED"
    roles: [Moderator]
    code: 200
    input: []
    output: ReviewFlag
    side_effects: ["OPEN -> DISMISSED; flag_count -= 1; if flag_count == 0 review FLAGGED -> PUBLISHED"]

  # --- suspension cases ---
  - method: GET
    path: "/v1/suspension-cases"
    description: "List suspension cases"
    roles: [PlatformAdmin, PolicyAnalyst, Moderator]
    code: 200
    input: ["listing_id?", "status?", "violation_type?", "limit?", "offset?"]
    output: SuspensionCase[]
    side_effects: []
  - method: GET
    path: "/v1/suspension-cases/{id}"
    description: "Get one suspension case"
    roles: [PlatformAdmin, PolicyAnalyst, Moderator, BusinessOwner]
    code: 200
    input: []
    output: SuspensionCase
    side_effects: []
  - method: POST
    path: "/v1/suspension-cases/{id}/appeal"
    description: "Owner appeals a suspension (appeal_text >= 50 chars; within appeal_deadline)"
    roles: [BusinessOwner]
    code: 200
    input: [appeal_text]
    output: SuspensionCase
    side_effects: ["OPEN -> APPEAL_SUBMITTED"]
  - method: POST
    path: "/v1/suspension-cases/{id}/start-appeal-review"
    description: "An analyst different from the suspender takes the appeal under review"
    roles: [PolicyAnalyst]
    code: 200
    input: []
    output: SuspensionCase
    side_effects: ["APPEAL_SUBMITTED -> UNDER_APPEAL_REVIEW; decided_by = acting analyst"]
  - method: POST
    path: "/v1/suspension-cases/{id}/decide"
    description: "Decide an appeal: UPHELD (listing PERMANENTLY_CLOSED) or OVERTURNED (listing reinstated VERIFIED/REVERIFY_REQUIRED)"
    roles: [PolicyAnalyst]
    code: 200
    input: [decision]
    output: SuspensionCase
    side_effects: ["UNDER_APPEAL_REVIEW -> UPHELD/OVERTURNED; listing cascade per BusinessListing machine; KEYWORD_STUFFING overturn resets strikes to 0"]
  - method: GET
    path: "/v1/business-listings/{id}/suspension-cases"
    description: "List suspension cases for one listing (reverse reachability for SuspensionCase.listing_id)"
    roles: [PlatformAdmin, PolicyAnalyst, Moderator, BusinessOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: SuspensionCase[]
    side_effects: []

  # --- hours observations ---
  - method: POST
    path: "/v1/hours-observations"
    description: "Record an hours observation from any source (corroboration_count recomputed over identical observation set)"
    roles: [Contributor, BusinessOwner, PlatformAdmin, Moderator]
    code: 201
    input: [listing_id, source, day_mask, open_time, close_time]
    output: HoursObservation
    side_effects: ["corroboration_count recompute for identical (listing, day_mask, open, close) observation set"]
  - method: GET
    path: "/v1/hours-observations/{id}"
    description: "Get one hours observation"
    roles: [PlatformAdmin, Contributor, BusinessOwner, Moderator, PolicyAnalyst]
    code: 200
    input: []
    output: HoursObservation
    side_effects: []

  # --- imagery tasks ---
  - method: POST
    path: "/v1/imagery-tasks"
    description: "Create an imagery collection task (PLANNED)"
    roles: [ImageryOperator, PlatformAdmin]
    code: 201
    input: [region_id, collection_zone, operator_id, window_start, window_end, blur_obligation]
    output: ImageryTask
    side_effects: []
  - method: GET
    path: "/v1/imagery-tasks"
    description: "List imagery tasks"
    roles: [PlatformAdmin, ImageryOperator, Moderator]
    code: 200
    input: ["region_id?", "status?", "collection_zone?", "limit?", "offset?"]
    output: ImageryTask[]
    side_effects: []
  - method: GET
    path: "/v1/imagery-tasks/{id}"
    description: "Get one imagery task"
    roles: [PlatformAdmin, ImageryOperator, Moderator]
    code: 200
    input: []
    output: ImageryTask
    side_effects: []
  - method: POST
    path: "/v1/imagery-tasks/{id}/schedule"
    description: "Schedule a PLANNED task (window-overlap + capacity checks)"
    roles: [ImageryOperator]
    code: 200
    input: []
    output: ImageryTask
    side_effects: ["PLANNED -> SCHEDULED"]
  - method: POST
    path: "/v1/imagery-tasks/{id}/capture"
    description: "Record capture within the window; privacy pending ledger starts"
    roles: [ImageryOperator]
    code: 200
    input: [capture_media_count]
    output: ImageryTask
    side_effects: ["SCHEDULED -> CAPTURED -> BLUR_PENDING; region privacy_pending_count += 1; posture bubble-up"]
  - method: POST
    path: "/v1/imagery-tasks/{id}/blur-complete"
    description: "Complete blurring (or request reprocess loop via reprocess=true)"
    roles: [ImageryOperator]
    code: 200
    input: [blurred_media_count, "reprocess?"]
    output: ImageryTask
    side_effects: ["BLUR_PENDING -> BLURRED, or BLUR_PENDING -> REPROCESS -> BLUR_PENDING (cyclic)"]
  - method: POST
    path: "/v1/imagery-tasks/{id}/publish"
    description: "Publish blurred imagery; drains privacy pending ledger"
    roles: [ImageryOperator]
    code: 200
    input: []
    output: ImageryTask
    side_effects: ["BLURRED -> PUBLISHED; region privacy_pending_count -= 1; posture CLEAR when drained to 0"]
  - method: POST
    path: "/v1/imagery-tasks/{id}/cancel"
    description: "Cancel a PLANNED or pre-window SCHEDULED task"
    roles: [ImageryOperator]
    code: 200
    input: []
    output: ImageryTask
    side_effects: ["PLANNED/SCHEDULED -> CANCELLED"]

  # --- routing updates ---
  - method: POST
    path: "/v1/routing-updates"
    description: "Propose a routing update (OCC on region version)"
    roles: [RoutingEngineer, PlatformAdmin]
    code: 201
    input: [region_id, segment_ref, kind, effective_start, effective_end, "restriction_detail?", "supersedes_id?", expected_region_version]
    output: RoutingUpdate
    side_effects: ["PROPOSED created; increments Region.version by 1"]
  - method: GET
    path: "/v1/routing-updates"
    description: "List routing updates"
    roles: [PlatformAdmin, RoutingEngineer, Moderator]
    code: 200
    input: ["region_id?", "segment_ref?", "kind?", "status?", "supersedes_id?", "limit?", "offset?"]
    output: RoutingUpdate[]
    side_effects: []
  - method: GET
    path: "/v1/routing-updates/{id}"
    description: "Get one routing update"
    roles: [PlatformAdmin, RoutingEngineer, Moderator]
    code: 200
    input: []
    output: RoutingUpdate
    side_effects: []
  - method: POST
    path: "/v1/routing-updates/{id}/validate"
    description: "Validate a PROPOSED update (24h buffer window conflict for CLOSURE/CONSTRUCTION); routes to SCHEDULED or ACTIVE by effective_start"
    roles: [RoutingEngineer]
    code: 200
    input: []
    output: RoutingUpdate
    side_effects: ["PROPOSED -> VALIDATED -> SCHEDULED/ACTIVE; Region.routing_version += 1"]
  - method: POST
    path: "/v1/routing-updates/{id}/activate"
    description: "Early-activate a SCHEDULED update; supersedes prior update if supersedes_id set"
    roles: [RoutingEngineer]
    code: 200
    input: []
    output: RoutingUpdate
    side_effects: ["SCHEDULED -> ACTIVE; Region.routing_version += 1; superseded update -> CANCELLED"]
  - method: POST
    path: "/v1/routing-updates/{id}/cancel"
    description: "Cancel a PROPOSED/VALIDATED/SCHEDULED update (SCHEDULED only before effective_start)"
    roles: [RoutingEngineer]
    code: 200
    input: []
    output: RoutingUpdate
    side_effects: ["-> CANCELLED; Region.routing_version += 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (path or body reference)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, enum outside declared set, length/range violation, malformed datetime" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state admitting the requested transition (incl. transitions from terminal states)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on an OCC-guarded write" }
  - { id: ERR_NOT_LISTING_OWNER, http: 403, condition: "Acting contributor is not the listing's owner_contributor_id" }
  - { id: ERR_NOT_EDIT_AUTHOR, http: 403, condition: "supply-info by a contributor other than the edit's author" }
  - { id: ERR_NOT_TICKET_OWNER, http: 403, condition: "Resolve/decide attempted by a moderator/analyst other than the claimer/decider" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appeal review started by the same analyst who suspended the listing" }
  - { id: ERR_LISTING_ALREADY_CLAIMED, http: 409, condition: "Claim attempted on a listing with owner_contributor_id already set" }
  - { id: ERR_LISTING_SUSPENDED, http: 409, condition: "Operation requires listing not in SUSPENDED/PERMANENTLY_CLOSED (edits, reviews, verification)" }
  - { id: ERR_LISTING_NOT_VERIFIABLE, http: 409, condition: "Verification attempt requires listing in CLAIM_PENDING or REVERIFY_REQUIRED" }
  - { id: ERR_ATTEMPT_EXPIRED, http: 409, condition: "submit-code at or after expires_at, or sweep has expired the attempt" }
  - { id: ERR_ATTEMPTS_EXHAUSTED, http: 409, condition: "submit-code when attempts_used >= max_attempts" }
  - { id: ERR_VERIFICATION_COOLDOWN, http: 409, condition: "New attempt within 72h of the listing's most recent FAILED attempt" }
  - { id: ERR_TOO_MANY_ATTEMPTS, http: 409, condition: "6th verification attempt on a listing within trailing 30 days" }
  - { id: ERR_KEYWORD_STUFFING, http: 422, condition: "Name contains keyword-stuffing pattern; strike recorded and write rejected" }
  - { id: ERR_PROHIBITED_CATEGORY, http: 422, condition: "Category in prohibited set {ESCORT, WEAPONS, ADULT}" }
  - { id: ERR_GEO_OUT_OF_REGION, http: 422, condition: "geo_lat/geo_lng outside the referenced region's bounding box" }
  - { id: ERR_STRIKES_BELOW_THRESHOLD, http: 409, condition: "KEYWORD_STUFFING suspension with keyword_stuffing_strikes < 2" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal after appeal_deadline (created_at + 30d)" }
  - { id: ERR_EDIT_ALREADY_ASSIGNED, http: 409, condition: "Ticket creation for an edit whose review_ticket_id is already set" }
  - { id: ERR_DUPLICATE_SUBMISSION, http: 409, condition: "Second non-terminal edit of same type on same listing by same contributor, or second non-terminal review of same listing by same contributor" }
  - { id: ERR_FLAG_LIMIT_REACHED, http: 409, condition: "Flag on a review whose flag_count >= 5 or review not in PUBLISHED/FLAGGED" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Imagery [window_start, window_end) overlaps another non-terminal task in same region+collection_zone (half-open; end == start allowed)" }
  - { id: ERR_IMAGERY_CAPACITY, http: 409, condition: "Region active imagery task count >= max_active_imagery_tasks at schedule" }
  - { id: ERR_OUTSIDE_WINDOW, http: 409, condition: "Capture outside [window_start, window_end) or cancel of SCHEDULED task at/after window_start" }
  - { id: ERR_BLUR_INCOMPLETE, http: 422, condition: "blur-complete with blurred_media_count below the obligation-driven requirement" }
  - { id: ERR_REGION_FROZEN, http: 409, condition: "Region posture FROZEN rejects imagery schedule/publish and routing validate" }
  - { id: ERR_ROUTING_WINDOW_CONFLICT, http: 409, condition: "CLOSURE/CONSTRUCTION validate with < 24h gap to another non-terminal window on same segment_ref (exactly 24h allowed)" }
  - { id: ERR_CONTRIBUTOR_RESTRICTED, http: 403, condition: "Contributor in RESTRICTED or BANNED status attempted a contribution-scoped write" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registration caller"
    identity: opaque
    exclusive_operations: ["POST /v1/contributors"]
    shared_operations: []
  - name: Contributor
    description: "Map contributor; submits edits, reviews, hours observations, flags reviews; acts on own resources only where noted"
    identity: "entity_backed:Contributor"
    exclusive_operations: ["POST /v1/map-edits/{id}/supply-info"]
    shared_operations: ["POST /v1/map-edits", "POST /v1/reviews", "POST /v1/reviews/{id}/flag", "POST /v1/hours-observations", "GET reads"]
  - name: BusinessOwner
    description: "Contributor account that owns a claimed listing; drives claim, verification, appeals, listing updates"
    identity: "entity_backed:Contributor"
    exclusive_operations: ["POST /v1/business-listings/{id}/claim", "POST /v1/verification-attempts", "POST /v1/verification-attempts/{id}/submit-code", "POST /v1/verification-attempts/{id}/cancel", "POST /v1/suspension-cases/{id}/appeal", "PATCH /v1/business-listings/{id}"]
    shared_operations: ["POST /v1/map-edits", "POST /v1/reviews", "POST /v1/reviews/{id}/flag", "GET reads"]
  - name: Moderator
    description: "Human review queue worker; claims and resolves tickets, dismisses flags, runs hours resolution"
    identity: opaque
    exclusive_operations: ["POST /v1/review-tickets", "POST /v1/review-tickets/{id}/claim", "POST /v1/review-tickets/{id}/resolve", "POST /v1/review-tickets/{id}/escalate", "POST /v1/review-flags/{id}/dismiss"]
    shared_operations: ["POST /v1/business-listings/{id}/hours/resolve", "POST /v1/contributor-grants/{id}/revoke", "GET reads"]
  - name: PolicyAnalyst
    description: "Policy enforcement; suspends listings, forces reverification, decides appeals (cannot review own suspension), reverts edits"
    identity: opaque
    exclusive_operations: ["POST /v1/business-listings/{id}/suspend", "POST /v1/business-listings/{id}/require-reverify", "POST /v1/suspension-cases/{id}/start-appeal-review", "POST /v1/suspension-cases/{id}/decide", "POST /v1/map-edits/{id}/revert"]
    shared_operations: ["GET reads"]
  - name: ImageryOperator
    description: "Street-imagery operator; schedules, captures, blurs, publishes imagery tasks"
    identity: opaque
    exclusive_operations: ["POST /v1/imagery-tasks/{id}/schedule", "POST /v1/imagery-tasks/{id}/capture", "POST /v1/imagery-tasks/{id}/blur-complete", "POST /v1/imagery-tasks/{id}/publish", "POST /v1/imagery-tasks/{id}/cancel"]
    shared_operations: ["POST /v1/imagery-tasks", "GET reads"]
  - name: RoutingEngineer
    description: "Routing data engineer; proposes/validates/activates/cancels routing updates"
    identity: opaque
    exclusive_operations: ["POST /v1/routing-updates/{id}/validate", "POST /v1/routing-updates/{id}/activate", "POST /v1/routing-updates/{id}/cancel"]
    shared_operations: ["POST /v1/routing-updates", "GET reads"]
  - name: PlatformAdmin
    description: "Operator role; regions, clock, sweeps, manual grants, fake-detection sweeps"
    identity: opaque
    exclusive_operations: ["POST /v1/_clock/set_current_utc", "POST /v1/regions", "POST /v1/verification-attempts/sweep-expired", "POST /v1/business-listings/sweep-reverify", "POST /v1/routing-updates/sweep-activation", "POST /v1/routing-updates/sweep-expired", "POST /v1/reviews/sweep-fake-detection", "POST /v1/contributor-grants"]
    shared_operations: ["GET reads", "POST /v1/imagery-tasks", "POST /v1/routing-updates", "POST /v1/hours-observations"]
