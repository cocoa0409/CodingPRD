  - method: POST
    path: "/hcv/rent-comparables"
    description: "Record a market-rent comparable"
    roles: [HousingAuthorityAdmin]
    code: 201
    input: [zip_code, bedroom_count, rent_cents, survey_date]
    output: RentComparable
    side_effects: []
  - method: GET
    path: "/hcv/rent-comparables"
    description: "List rent comparables"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: ["zip_code?", "bedroom_count?", "limit?", "offset?"]
    output: RentComparable[]
    side_effects: []

  - method: POST
    path: "/hcv/contracts"
    description: "Create a HAP contract (DRAFT). Requires OCC expected_unit_version."
    roles: [Landlord]
    code: 201
    input: [unit_id, family_id, contract_rent_cents, lease_start_date, expected_unit_version]
    output: HAPContract
    side_effects: ["Unit LISTED -> UNDER_CONTRACT; increments Unit.version by 1"]
  - method: GET
    path: "/hcv/contracts"
    description: "List HAP contracts, optionally filtered by family_id (reverse-reachability for HAPContract.family_id)"
    roles: [HousingAuthorityAdmin, Landlord]
    code: 200
    input: ["family_id?", "limit?", "offset?"]
    output: HAPContract[]
    side_effects: []
  - method: GET
    path: "/hcv/contracts/{id}"
    description: "Get HAP contract"
    roles: [HousingAuthorityAdmin, Landlord, Inspector]
    code: 200
    input: []
    output: HAPContract
    side_effects: []
  - method: POST
    path: "/hcv/contracts/{id}/submit"
    description: "Submit contract: runs rent reasonableness + HAP split, moves DRAFT -> PENDING_INSPECTION, auto-creates INITIAL inspection"
    roles: [Landlord]
    code: 200
    input: []
    output: HAPContract
    side_effects: ["runs rent_reasonableness; runs hap_split; creates INITIAL Inspection SCHEDULED; HAPContract DRAFT -> PENDING_INSPECTION; increments HAPContract.version by 1"]
  - method: POST
    path: "/hcv/contracts/{id}/withdraw"
    description: "Withdraw a submitted contract back to DRAFT; cancels the scheduled initial inspection"
    roles: [Landlord]
    code: 200
    input: []
    output: HAPContract
    side_effects: ["HAPContract PENDING_INSPECTION -> DRAFT; INITIAL Inspection SCHEDULED -> CLOSED; portions reset to 0; increments HAPContract.version by 1"]
  - method: POST
    path: "/hcv/contracts/{id}/activate"
    description: "Activate an approved contract on/after lease start"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: []
    output: HAPContract
    side_effects: ["HAPContract APPROVED -> ACTIVE; sets next_recert_due_date; VoucherFamily SEARCHING -> LEASED; runs first_payment_schedule creating first HAPPayment; increments HAPContract.version by 1"]
  - method: POST
    path: "/hcv/contracts/{id}/terminate"
    description: "Terminate an active or abated contract (move-out)"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: []
    output: HAPContract
    side_effects: ["HAPContract -> TERMINATED; VoucherFamily LEASED -> SEARCHING; Unit -> LISTED; future SCHEDULED/ABATED_HELD HAPPayments -> VOID; increments HAPContract.version by 1"]
  - method: GET
    path: "/hcv/contracts/{id}/inspections"
    description: "List inspections for a contract (reverse-reachability for Inspection.contract_id)"
    roles: [HousingAuthorityAdmin, Landlord, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/hcv/contracts/{id}/hap-payments"
    description: "List HAP payments for a contract (reverse-reachability for HAPPayment.contract_id)"
    roles: [HousingAuthorityAdmin, Landlord]
    code: 200
    input: ["limit?", "offset?"]
    output: HAPPayment[]
    side_effects: []
  - method: GET
    path: "/hcv/contracts/{id}/rent-increase-requests"
    description: "List rent increase requests for a contract (reverse-reachability for RentIncreaseRequest.contract_id)"
    roles: [HousingAuthorityAdmin, Landlord]
    code: 200
    input: ["limit?", "offset?"]
    output: RentIncreaseRequest[]
    side_effects: []
  - method: GET
    path: "/hcv/contracts/{id}/recertifications"
