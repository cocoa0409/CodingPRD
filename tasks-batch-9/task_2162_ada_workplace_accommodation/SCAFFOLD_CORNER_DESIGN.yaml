              payload: { job_code: "C-JP-41", title: "Corner Profile 41", department_code: "CO7", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: Anonymous
              captures: { c41_err: $.data.error_id }
          assert:
            - "HTTP status is 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "No JobProfile with job_code C-JP-41 exists afterwards"

