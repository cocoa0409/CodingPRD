    instances:
      - name: occ_correct_version_psc_submission_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[psc-create-stale-entry]
          - endpoints.POST_/post-summary-corrections
          - entities.CustomsEntry.fields.version
        distinguishing_aspect: "Happy path of the OCC rule: submitting a PSC carrying expected_entry_version equal to the LIQUIDATED entry's current version succeeds (201) and creates a SUBMITTED PSC; complements the §1.8 stale-version negative path."
        test_recipe:
          setup:
            - "A LIQUIDATED general entry; client reads the entry's current version after liquidation."
            - "Clock 2026-06-05; bond high limit."
          setup_api_calls:
