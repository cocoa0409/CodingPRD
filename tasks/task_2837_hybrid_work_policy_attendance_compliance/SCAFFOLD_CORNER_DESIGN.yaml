      - name: authorisation_is_answered_before_existence
        claim_type: exclusive_operations
        grounds:
          - validations[priority=12, ERR_UNAUTHORIZED]
          - validations[priority=20, existence]
        excluded_because:
          difficulty_instance: unauthorized_outranks_not_found
          rationale: "That §1.8 instance already shows a forbidden role naming a non-existent resource receiving 403 rather than 404, which is the only interaction between these two bands. The §1.9 exclusive-operation sweep deliberately uses REAL resources so that it cannot be satisfied by an existence check."

  - section: cross_cutting_complexity_layers
