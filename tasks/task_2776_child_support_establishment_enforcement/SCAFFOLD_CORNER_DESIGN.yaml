              captures: { v_post: "$.data.version", inc_post: "$.data.monthly_gross_income_cents", src_post: "$.data.income_verification_source", emp_post: "$.data.employer_name", loc_post: "$.data.locate_status" }
            - call: "GET /child-support/participants/${ncpe4}"
              as: CaseWorker
              captures: { v_read: "$.data.version", inc_read: "$.data.monthly_gross_income_cents", src_read: "$.data.income_verification_source" }
            - call: "GET /child-support/orders/${ordere4}"
              as: CaseWorker
              captures: { o_ncpi: "$.data.guideline_ncp_income_cents", o_mon: "$.data.monthly_obligation_cents", o_st: "$.data.status" }
            - call: "GET /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", limit: 1, offset: 0 }
              as: CaseWorker
              captures: { n_total: "$.meta.total_count", n_more: "$.meta.has_more" }
            - call: "GET /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", limit: 1, offset: 1 }
              as: CaseWorker
              captures: { n_total2: "$.meta.total_count", n_more2: "$.meta.has_more" }
            - call: "GET /child-support/participants"
              payload: { residence_state_code: "TX" }
              as: CaseWorker
              captures: { tx_total: "$.meta.total_count" }
            - call: "GET /child-support/participants"
              payload: { locate_status: "LOCATED" }
              as: CaseWorker
              captures: { loc_total: "$.meta.total_count" }
            - call: "GET /child-support/participants"
              payload: { enforcement_risk_tier: "LOW" }
              as: CaseWorker
              captures: { low_total: "$.meta.total_count" }
          assert:
            - "${v_pre} == 2 and ${inc_pre} == 300000 and ${loc_pre} == LOCATED and ${tier_pre} == LOW  # creation plus the locate-results write"
            - "${v_post} == 3 and ${inc_post} == 400000 and ${src_post} == SELF_REPORTED and ${emp_post} == Amundsen Boatyard  # exactly one version step for one PATCH"
            - "${loc_post} == LOCATED  # the PATCH touches only the three income fields"
            - "${v_read} == 3 and ${inc_read} == 400000 and ${src_read} == SELF_REPORTED  # the update is durable, not response-only"
            - "${o_ncpi} == 300000 and ${o_mon} == 75000 and ${o_st} == ENTERED  # the entered order keeps the income it was calculated on; only a future guideline calculation would see 400000"
            - "${n_total} == 2 and ${n_more} == true  # two noncustodial parties exist and limit 1 leaves one behind"
            - "${n_total2} == 2 and ${n_more2} == false  # total_count is the filtered total, not the page size, and page two exhausts it"
            - "${tx_total} == 2  # the residence filter excludes both MN parties"
            - "${loc_total} == 1  # only the case A noncustodial party ever had a locate result; the other three sit at NOT_NEEDED"
            - "${low_total} == 4  # every participant scores 0, and custodial parties are always LOW by rule"

      - name: locate_outcome_decides_which_case_paths_open_and_which_close
        claim_type: conditional_action
        grounds:
          - "endpoints[POST /child-support/participants/{participant_id}/locate-results]"
          - "state_machines.SupportCase.case_status.LOCATE -> CLOSED"
          - "validations[priority 16]"
          - "validations[priority 10 ERR_INVALID_CASE_STATUS]"
          - "errors[ERR_NCP_NOT_LOCATED]"
          - "errors[ERR_INVALID_CASE_STATUS]"
        distinguishing_aspect: >
          Two cases run byte-identical call sequences that differ in exactly one
          enum value, and the value decides which of two later endpoints is legal.
          LOCATED opens the paternity path and makes NO_JURISDICTION closure
          illegal; UNLOCATABLE does the exact opposite, and the refusals are
          reported by different rules - the paternity refusal is priority 16 on a
          Participant field, while the closure refusal is priority 10 because LOCATE
          -> CLOSED simply is not an available transition for a located obligor. The
          closure path is also reason-conditional: CP_REQUEST is refused from LOCATE
          even for the unlocatable obligor.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "Case L and case U are both DIRECT_APPLICATION with CP 200000 and NCP 300000, both created with no locate result, so both noncustodial parties start at locate_status NOT_NEEDED."
            - "Each case receives one locate referral, which moves case_status OPENED -> LOCATE and the participant to PENDING."
            - "Case L then records locate_outcome LOCATED; case U records UNLOCATABLE."
            - "No order exists on either case, so both remain in LOCATE for the whole trigger sequence."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Beatrix Nkemelu", ssn_last4: "6243", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpl: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Chidi Nkemelu", ssn_last4: "6244", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpl: "$.data.id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpl}", noncustodial_party_id: "${ncpl}", child_count: 1, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casel: "$.data.id" }
            - call: "POST /child-support/cases/${casel}/locate-referrals"
              payload: { locate_source: "CREDIT_BUREAU" }
              as: CaseWorker
              captures: { l_cs0: "$.data.case_status" }
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Ilse Tanaka", ssn_last4: "6245", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpu: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Haruto Tanaka", ssn_last4: "6246", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpu: "$.data.id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpu}", noncustodial_party_id: "${ncpu}", child_count: 1, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { caseu: "$.data.id" }
            - call: "POST /child-support/cases/${caseu}/locate-referrals"
              payload: { locate_source: "EMPLOYER_TIP" }
              as: CaseWorker
              captures: { u_cs0: "$.data.case_status" }
          trigger:
            - call: "POST /child-support/participants/${ncpl}/locate-results"
              payload: { locate_outcome: "LOCATED", employer_name: "Nkemelu Logistics" }
              as: CaseWorker
              captures: { l_loc: "$.data.locate_status", l_emp: "$.data.employer_name" }
            - call: "POST /child-support/participants/${ncpu}/locate-results"
              payload: { locate_outcome: "UNLOCATABLE" }
              as: CaseWorker
              captures: { u_loc: "$.data.locate_status", u_emp: "$.data.employer_name" }
            - call: "POST /child-support/cases/${casel}/closure"
              payload: { closed_reason: "NO_JURISDICTION" }
              as: SupervisingAttorney
              captures: { e_l_close: "$.data.error_id" }
            - call: "POST /child-support/cases/${caseu}/paternity-actions"
              payload: { method: "VOLUNTARY_ACKNOWLEDGMENT" }
              as: CaseWorker
              captures: { e_u_pat: "$.data.error_id" }
            - call: "POST /child-support/cases/${caseu}/closure"
              payload: { closed_reason: "CP_REQUEST" }
              as: SupervisingAttorney
              captures: { e_u_reason: "$.data.error_id" }
            - call: "POST /child-support/cases/${casel}/paternity-actions"
              payload: { method: "VOLUNTARY_ACKNOWLEDGMENT" }
              as: CaseWorker
              captures: { l_pat: "$.data.status", l_pat_cs: "$.data.case_id" }
            - call: "POST /child-support/cases/${caseu}/closure"
              payload: { closed_reason: "NO_JURISDICTION" }
              as: SupervisingAttorney
              captures: { u_cs: "$.data.case_status", u_reason: "$.data.closed_reason", u_at: "$.data.closed_at" }
            - call: "GET /child-support/cases/${casel}"
              as: CaseWorker
              captures: { l_cs: "$.data.case_status" }
          assert:
            - "${l_cs0} == LOCATE and ${u_cs0} == LOCATE  # both cases enter the trigger sequence in the same state"
            - "${l_loc} == LOCATED and ${l_emp} == Nkemelu Logistics  # the optional employer_name rides along with a successful locate"
            - "${u_loc} == UNLOCATABLE and ${u_emp} == null  # same endpoint, same role, one different enum value"
            - "HTTP 409 and ${e_l_close} == ERR_INVALID_CASE_STATUS  # LOCATE -> CLOSED requires locate_status UNLOCATABLE, so for a LOCATED obligor the transition does not exist at all"
            - "HTTP 409 and ${e_u_pat} == ERR_NCP_NOT_LOCATED  # UNLOCATABLE is not LOCATED, and this refusal comes from a Participant field at priority 16"
            - "HTTP 409 and ${e_u_reason} == ERR_INVALID_CASE_STATUS  # the LOCATE -> CLOSED transition is also reason-conditional: only NO_JURISDICTION is available from LOCATE"
            - "${l_pat} == PENDING and ${l_pat_cs} == ${casel}  # the LOCATED branch opens the paternity path"
            - "${u_cs} == CLOSED and ${u_reason} == NO_JURISDICTION and ${u_at} == 2026-08-01T00:00:00Z  # the UNLOCATABLE branch opens the closure path the other case was refused"
            - "${l_cs} == PATERNITY_PENDING  # the two identical sequences ended in opposite terminal positions"

  # ====================================================================
  # Table 6 - Errors. §1.6 declares 67 error ids across six HTTP statuses
  # (401, 403, 404, 409, 412, 422). Table 6 declares no claim rows of its own,
  # so every instance here uses claim_type error_triggerable: the first proves
  # the two auth ids fire ahead of every other band, the second walks one
  # error from each declared status to pin the id-to-status mapping and the
  # shape of the failure envelope.
  # ====================================================================
  - section: errors
    instances:

      - name: auth_header_errors_preempt_payload_and_state_checks
        claim_type: error_triggerable
        grounds:
          - "validations[priority 1]"
          - "validations[priority 2]"
          - "errors[ERR_MISSING_AUTH_HEADERS]"
          - "errors[ERR_INVALID_ROLE]"
          - "validations[priority 7]"
          - "roles"
        distinguishing_aspect: >
          Priorities 1 and 2 sit above every other band, so a request that is ALSO
          malformed still answers 401 ERR_MISSING_AUTH_HEADERS rather than 422
          ERR_VALIDATION - the payload is never inspected. The two 401 ids are
          distinguished by which half of the credential is wrong: absent or empty
          headers give ERR_MISSING_AUTH_HEADERS (including a present role with an
          empty X-User-ID), while a syntactically fine but unknown role name gives
          ERR_INVALID_ROLE. Role matching is exact, so the lowercased spelling of a
          real role is an unknown role, and none of the five refused calls persists
          a Participant.
        test_recipe:
          setup:
            - "Empty database. The clock is set by a properly credentialled ProgramAdmin call before anything else."
            - "§1.7 declares exactly eight role names: CaseWorker, SupervisingAttorney, FinanceOfficer, EmployerAgent, CustodialParty, NoncustodialParty, InterstateLiaison, ProgramAdmin."
            - "POST /child-support/participants is a CaseWorker-exclusive write whose payload requires role_type, full_name, ssn_last4 and residence_state_code."
            - "ssn_last4 must be exactly four digits, so the value 12 is a priority-7 violation."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Perpetua Odongo", ssn_last4: "6247", residence_state_code: "MN" }
              as: "(both X-User-Role and X-User-ID headers omitted)"
              captures: { e_miss1: "$.data.error_id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Perpetua Odongo", ssn_last4: "12", residence_state_code: "ZZ" }
              as: "(both X-User-Role and X-User-ID headers omitted)"
              captures: { e_miss2: "$.data.error_id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Perpetua Odongo", ssn_last4: "6247", residence_state_code: "MN" }
              as: "(X-User-Role: CaseWorker with an empty X-User-ID)"
              captures: { e_miss3: "$.data.error_id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Perpetua Odongo", ssn_last4: "6247", residence_state_code: "MN" }
              as: "CountyAttorney"
              captures: { e_role1: "$.data.error_id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Perpetua Odongo", ssn_last4: "6247", residence_state_code: "MN" }
              as: "caseworker"
              captures: { e_role2: "$.data.error_id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Perpetua Odongo", ssn_last4: "6247", residence_state_code: "MN" }
              as: CaseWorker
              captures: { ok_id: "$.data.id", ok_role: "$.data.role_type" }
            - call: "GET /child-support/participants"
              payload: {}
              as: CaseWorker
              captures: { total: "$.meta.total_count" }
          assert:
            - "HTTP 401 and ${e_miss1} == ERR_MISSING_AUTH_HEADERS"
            - "HTTP 401 and ${e_miss2} == ERR_MISSING_AUTH_HEADERS  # the payload carries a 2-digit ssn_last4 and a bogus state code, yet priority 1 answers first and ERR_VALIDATION is never reached"
            - "HTTP 401 and ${e_miss3} == ERR_MISSING_AUTH_HEADERS  # an empty X-User-ID counts as absent even though the role header is valid"
            - "HTTP 401 and ${e_role1} == ERR_INVALID_ROLE  # CountyAttorney is not one of the eight declared roles"
            - "HTTP 401 and ${e_role2} == ERR_INVALID_ROLE  # role names match exactly; caseworker is not CaseWorker"
            - "HTTP 201 and ${ok_role} == CUSTODIAL_PARTY and ${ok_id} is non-empty  # the same payload succeeds once the headers are right"
            - "${total} == 1  # five refused requests wrote nothing"

      - name: one_error_per_declared_status_maps_to_its_declared_code
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_INVALID_ROLE]"
          - "errors[ERR_UNAUTHORIZED]"
          - "errors[ERR_CHARGE_NOT_FOUND]"
          - "errors[ERR_INVALID_ORDER_STATUS]"
          - "errors[ERR_STALE_ORDER_VERSION]"
          - "errors[ERR_VALIDATION]"
          - "validations[priority 9]"
          - "validations[priority 3]"
        distinguishing_aspect: >
          Six requests against one prepared case draw one error from each of the six
          statuses §1.6 uses, in a single instance, so a mapping mistake is visible
          as a status mismatch rather than as a plausible-looking wrong id. The 412
          is the interesting one: the stale expected_order_version is supplied AFTER
          a charge posting silently bumped the order's version, so the caller's read
          was correct when it was taken - the failure is concurrency, not
          malformation, and it must not be reported as a 422.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD; ENTERED order at monthly_obligation_cents 75000."
            - "One MN employer with remittance_fee_cents 0."
            - "The order version is captured, then a CURRENT_SUPPORT charge is posted, which increments SupportOrder.version by 1 and makes the captured value stale."
            - "child_count must be in 1..6, so 7 is a priority-7 violation."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Wilhelmina Osei", ssn_last4: "6248", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpx2: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Kwabena Osei", ssn_last4: "6249", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpx2: "$.data.id" }
            - call: "POST /child-support/participants/${ncpx2}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpx2}", noncustodial_party_id: "${ncpx2}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casex2: "$.data.id" }
            - call: "POST /child-support/cases/${casex2}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casex2}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderx2: "$.data.id" }
            - call: "POST /child-support/orders/${orderx2}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { gx2: "$.data.guideline_monthly_cents" }
            - call: "POST /child-support/orders/${orderx2}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monx2: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/employers"
              payload: { legal_name: "Osei Freight Lines", fein: "41-0000114", state_code: "MN", pay_frequency: "MONTHLY", remittance_fee_cents: 0 }
              as: ProgramAdmin
              captures: { empx2: "$.data.id" }
            - call: "GET /child-support/orders/${orderx2}"
              as: CaseWorker
              captures: { v_stale: "$.data.version" }
            - call: "POST /child-support/orders/${orderx2}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
              captures: { chx2: "$.data.id" }
            - call: "GET /child-support/orders/${orderx2}"
              as: CaseWorker
              captures: { v_fresh: "$.data.version" }
          trigger:
            - call: "GET /child-support/cases/${casex2}"
              as: "Auditor"
              captures: { e401: "$.data.error_id" }
            - call: "POST /child-support/cases/${casex2}/closure"
              payload: { closed_reason: "CP_REQUEST" }
              as: FinanceOfficer
              captures: { e403: "$.data.error_id" }
            - call: "GET /child-support/charges/chg_0000000000000000000000000000"
              as: FinanceOfficer
              captures: { e404: "$.data.error_id" }
            - call: "POST /child-support/orders/${orderx2}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { e409: "$.data.error_id" }
            - call: "POST /child-support/orders/${orderx2}/withholding-orders"
              payload: { employer_id: "${empx2}", expected_order_version: "${v_stale}", reported_disposable_income_cents: 150000 }
              as: CaseWorker
              captures: { e412: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpx2}", noncustodial_party_id: "${ncpx2}", child_count: 7, tanf_assistance: false }
              as: CaseWorker
              captures: { e422: "$.data.error_id" }
            - call: "GET /child-support/withholding-orders"
              payload: { order_id: "${orderx2}" }
              as: CaseWorker
              captures: { iwo_total: "$.meta.total_count" }
            - call: "GET /child-support/cases"
              payload: {}
              as: CaseWorker
              captures: { case_total: "$.meta.total_count" }
          assert:
            - "${monx2} == 75000 and ${v_fresh} == ${v_stale} + 1  # posting the charge bumped the order version"
            - "HTTP 401 and ${e401} == ERR_INVALID_ROLE  # unknown role on a read the caller would otherwise be allowed"
            - "HTTP 403 and ${e403} == ERR_UNAUTHORIZED  # closure is SupervisingAttorney-exclusive; FinanceOfficer is authenticated but not authorised"
            - "HTTP 404 and ${e404} == ERR_CHARGE_NOT_FOUND  # a well-formed id that matches no row"
            - "HTTP 409 and ${e409} == ERR_INVALID_ORDER_STATUS  # the order is already ENTERED, so ENTERED -> ENTERED is not a declared transition"
            - "HTTP 412 and ${e412} == ERR_STALE_ORDER_VERSION  # expected_order_version was read before the charge posting; the value is well formed, so this must not degrade to 422"
            - "HTTP 422 and ${e422} == ERR_VALIDATION  # child_count 7 is outside 1..6"
            - "every failing response body carries exactly the error envelope - a string error_id from §1.6 and a human-readable message - and no data payload of the target entity"
            - "${iwo_total} == 0 and ${case_total} == 1  # neither the 412 nor the 422 persisted anything"

  # ====================================================================
  # Table 7 - RBAC. §1.7 declares eight roles, three of them entity-backed
  # (EmployerAgent on Employer, CustodialParty and NoncustodialParty on
  # Participant) and five opaque. There is no hierarchical override:
  # ProgramAdmin owns only the employer registry and the clock. All three
  # declared claim rows are covered below.
  # ====================================================================
  - section: rbac
    instances:

      - name: role_exclusive_writes_reject_every_other_role_including_program_admin
        claim_type: exclusive_operations
        grounds:
          - "roles.ProgramAdmin.note"
          - "roles.CaseWorker.exclusive_operations"
          - "roles.SupervisingAttorney.exclusive_operations"
          - "roles.FinanceOfficer.exclusive_operations"
          - "validations[priority 3]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: >
          Each of the four opaque staff roles is refused on another role's exclusive
          write and every refusal is the same 403 ERR_UNAUTHORIZED, which is the
          point of the declaration that there is NO hierarchical override:
          ProgramAdmin - the role that owns the employer registry and the clock -
          cannot open a case, and CaseWorker, which drafts orders, cannot enter one.
          The two rejected writes are then replayed by their owning roles on the
          same rows and succeed unchanged, so the refusals are about the caller and
          not about the state.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD; the order is left in CALCULATED with guideline_monthly_cents 75000 so entry is still available."
            - "EmployerAgent is not in the roles list of GET /child-support/cases/{case_id} at all."
            - "No employer exists yet, so the CaseWorker attempt at POST /child-support/employers is refused on the role and not on a duplicate FEIN."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Theodora Bergqvist", ssn_last4: "6250", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
