      - name: guideline_missing_for_case_state_returns_404
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_GUIDELINE_NOT_FOUND]"
          - "entities.Case.fields.state_code"
        distinguishing_aspect: "Creating a SUPPORT order on a case whose state_code has no GuidelineSchedule -> ERR_GUIDELINE_NOT_FOUND (404). (Case created in a state for which a schedule exists, then support requested for a different missing-schedule path is not possible — so this fires when the case's own state_code schedule was never registered; case creation requires the schedule, so the trigger is a support order whose state schedule was deleted-equivalent: here we register TX schedule, create TX case, but request support — covered by registering schedule for case state but NOT for spousal pcts path is not applicable.) Concretely: register only a CA schedule, attempt POST /api/cases with state_code WY (no schedule) -> the case-create itself rejects with ERR_GUIDELINE_NOT_FOUND."
        test_recipe:
          setup: ["Only a CA GuidelineSchedule exists; no WY schedule."]
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ] }
