      - name: assign_rejected_when_appraiser_inactive
        grounds:
          - state_machines.AppraisalOrder.ACCEPTED_to_ASSIGNED
          - state_machines.Appraiser.ACTIVE_to_INACTIVE
          - errors[ERR_APPRAISER_NOT_ASSIGNABLE]
        distinguishing_aspect: |
          Entity pair AppraisalOrder <- Appraiser: the same assign call succeeds
          or fails purely on the target Appraiser's status field — INACTIVE
          yields ERR_APPRAISER_NOT_ASSIGNABLE (422), ACTIVE yields ASSIGNED.
        test_recipe:
          setup:
