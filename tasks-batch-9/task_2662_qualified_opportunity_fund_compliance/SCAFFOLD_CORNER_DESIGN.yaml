        distinguishing_aspect: "The partial update writes exactly one supplied field and recomputes the derived NQFP figure, while the declared side-effect boundary holds: an already MEASURED BusinessTest keeps its snapshot nqfp_amount_measured 20000.00 and nqfp_pct 2.0000 even though the live business figure jumps to 200000.00."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund and one QOZBusiness with declared_nqfp_amount 20000.00, total_asset_value 1000000.00 and total_tangible_property_basis 850000.00."
