    instances:
      - name: funding_pool_conserved_across_disburse_and_settle
        grounds:
          - state_machines.Advance.APPROVED_to_DISBURSED
          - state_machines.Advance.RECOUPING_to_SETTLED
          - entities.Employer.fields.funding_balance_cents
          - entities.Employer.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Conserved quantity #1: funding_balance_cents + outstanding_principal_cents
          is invariant across the disburse (forward) / settle (compensating) pair.
          Before disburse it is 100000; after disburse (debit 12000, outstanding
          +12000) it is still 100000; after full settle (credit 12000, outstanding
          -12000) it is still 100000.
