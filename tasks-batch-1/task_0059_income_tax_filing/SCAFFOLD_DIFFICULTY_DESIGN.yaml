scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deduction_standard_vs_itemized_diverges_on_taxreturn
        grounds:
          - calculations.compute_return_tax
          - entities.TaxReturn.fields.deduction_method
          - entities.TaxReturn.fields.balance_due_cents
        distinguishing_aspect: "Same income data on the TaxReturn entity domain: STANDARD deduction yields taxable_income 6,500,000 (balance_due 35,300) while ITEMIZED with Schedule A 2,500,000 yields taxable_income 5,500,000 (balance_due -184,700)."
        test_recipe:
          setup:
            - "Taxpayer registered, SINGLE."
            - "TaxReturn (tax_year 2025, SINGLE, deduction_method STANDARD) with one W-2: wages 8,000,000, withholding 900,000."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "a@x.com", full_name: "A", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { std_bal: $.data.balance_due_cents }
          assert:
            - "TaxReturn.${ret_id}.taxable_income_cents == 6500000"
            - "TaxReturn.${ret_id}.tax_before_credits_cents == 935300"
            - "TaxReturn.${ret_id}.balance_due_cents == 35300"

      - name: estimated_tax_safe_harbor_current_vs_prior_year
        grounds:
          - calculations.compute_underpayment_penalty
          - entities.Taxpayer.fields.prior_year_total_tax_cents
          - entities.Taxpayer.fields.prior_year_agi_cents
        distinguishing_aspect: "Distinct entity domain (Taxpayer + EstimatedTaxPayment, not the TaxReturn deduction): prior-year safe harbor (prior_total_tax 1,000,000 -> required 1,000,000) is the lesser of the two harbors and overrides current-year 90% (1,237,770), giving penalty 40,000."
        test_recipe:
          setup:
            - "Taxpayer with prior_year_total_tax_cents 1,000,000 and prior_year_agi_cents 5,000,000 (not high-income)."
            - "TaxReturn SINGLE, one W-2 wages 10,000,000 withholding 0, computed (tax_after_credits 1,375,300)."
            - "One on-time Q1 estimated payment 500,000."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "b@x.com", full_name: "B", filing_status: "SINGLE", prior_year_agi_cents: 5000000, prior_year_total_tax_cents: 1000000 }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 10000000, federal_withholding_cents: 0 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /estimated-tax-payments"
              payload: { return_id: "${ret_id}", quarter: "Q1", amount_cents: 500000, paid_on: "2025-04-10T00:00:00Z", period_start: "2025-01-01T00:00:00Z", period_end: "2025-04-01T00:00:00Z" }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "GET /tax-returns/${ret_id}/estimated-tax-status"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "estimated-tax-status.required_annual_cents == 1000000"
            - "estimated-tax-status.safe_harbor_used == \"prior_year_safe_harbor\""
            - "estimated-tax-status.shortfall_cents == 500000"
            - "estimated-tax-status.penalty_cents == 40000"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bracket_tax_three_tier_nonlinear_mode_a
        grounds:
          - calculations.compute_return_tax
          - entities.TaxReturn.fields.tax_before_credits_cents
          - entities.TaxReturn.fields.taxable_income_cents
        distinguishing_aspect: "Mode (a): marginal bracket tax with >=3 tiers and tier-selection branching — taxable_income 6,500,000 SINGLE crosses all three tiers (10%/12%/22%) producing 935,300 = 116,000 + 426,600 + 392,700, not a flat-rate product."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn STANDARD; one W-2 wages 8,000,000."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "c@x.com", full_name: "C", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 0 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "TaxReturn.${ret_id}.taxable_income_cents == 6500000"
            - "TaxReturn.${ret_id}.tax_before_credits_cents == 935300"

      - name: aotc_two_step_floor_rounding_order_mode_b
        grounds:
          - calculations.compute_credit_allowance
          - entities.CreditClaim.fields.allowed_amount_cents
          - entities.CreditClaim.fields.refundable_cents
        distinguishing_aspect: "Mode (b): nested rounding where order matters — at AGI 8,000,010 the pinned order floor(allowed)=249,997 then floor(249,997*40/100)=99,998, whereas percent-then-floor would give 99,999; the scaffold pins floor-then-percent."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn STANDARD; one W-2 wages 8,000,010 withholding 1,000,000."
            - "One student Dependent age 19; AOTC CreditClaim claimed 250,000."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "d@x.com", full_name: "D", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000010, federal_withholding_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/dependents"
              payload: { full_name: "Kid", age_years: 19, is_student: true }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/credit-claims"
              payload: { credit_type: "AOTC", claimed_amount_cents: 250000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "CreditClaim(AOTC).allowed_amount_cents == 249997"
            - "CreditClaim(AOTC).refundable_cents == 99998"
            - "TaxReturn.${ret_id}.balance_due_cents == -314695"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: taxreturn_reject_reopen_recompute_refile_cycle
        grounds:
          - state_machines.TaxReturn.READY_to_REJECTED
          - state_machines.TaxReturn.REJECTED_to_DRAFT
          - state_machines.TaxReturn.DRAFT_to_READY
        distinguishing_aspect: "Cyclic shape on TaxReturn: READY->REJECTED->DRAFT->READY revisits the READY state via a revision loop, which a linear pipeline cannot express; status returns to DRAFT then READY again."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn computed to READY (one W-2), e-filed and REJECTED by gateway."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "e@x.com", full_name: "E", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_after_compute: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_after_compute}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "REJECTED", ack_code: "R0001" }
              as: IrsGateway
          trigger:
            - call: "PATCH /tax-returns/${ret_id}"
              payload: { reopen: true }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { reopened_status: $.data.status }
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { final_status: $.data.status }
          assert:
            - "TaxReturn.${ret_id}.status after PATCH reopen == DRAFT"
            - "TaxReturn.${ret_id}.status after recompute == READY"

      - name: efiling_transmitted_branches_accept_or_reject
        grounds:
          - state_machines.EFilingSubmission.TRANSMITTED_to_ACCEPTED
          - state_machines.EFilingSubmission.TRANSMITTED_to_REJECTED
        distinguishing_aspect: "Branching fork on EFilingSubmission (different entity from TaxReturn): a single TRANSMITTED state resolves to exactly one of ACCEPTED / REJECTED with divergent parent side-effects (return FILED vs return REJECTED)."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn computed READY; e-file TRANSMITTED."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "f@x.com", full_name: "F", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_after_compute: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_after_compute}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
          trigger:
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
              captures: { ef_status: $.data.status }
          assert:
            - "EFilingSubmission.${ef_id}.status == ACCEPTED"
            - "TaxReturn.${ret_id}.status == FILED"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: amend_file_cascades_three_levels_to_efiling
        grounds:
          - state_machines.AmendedReturn.DRAFT_to_FILED
          - state_machines.TaxReturn.FILED_to_AMENDED
          - entities.EFilingSubmission.fields.superseded_by_amendment
        distinguishing_aspect: "Depth-3 chain from the amend-file trigger: file 1040X -> AmendedReturn FILED (hop1) -> original TaxReturn AMENDED (hop2, caused by hop1) -> its ACCEPTED EFilingSubmission superseded_by_amendment=true (hop3, caused by hop2); each hop caused by the prior."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn computed, e-filed, ACCEPTED -> FILED; an AmendedReturn DRAFT exists against it."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "g@x.com", full_name: "G", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_after_compute: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_after_compute}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_filed: $.data.version }
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${tp_id}", corrected_balance_due_cents: 50000, correction_period_start: "2025-01-01T00:00:00Z", correction_period_end: "2025-12-31T00:00:00Z", expected_return_version: "${v_filed}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { amd_id: $.data.id }
          trigger:
            - call: "POST /amended-returns/${amd_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "AmendedReturn.${amd_id}.status == FILED"
            - "TaxReturn.${ret_id}.status == AMENDED"
            - "EFilingSubmission.${ef_id}.superseded_by_amendment == true"

      - name: efile_accept_cascades_two_levels_to_return_filed
        grounds:
          - state_machines.EFilingSubmission.TRANSMITTED_to_ACCEPTED
          - state_machines.TaxReturn.READY_to_FILED
        distinguishing_aspect: "Depth-2 chain from the acknowledge trigger (different origin than amend-file): acknowledge ACCEPTED -> EFilingSubmission ACCEPTED (hop1) -> parent TaxReturn READY->FILED (hop2, caused by hop1's acceptance)."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn computed READY; e-file TRANSMITTED."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "h@x.com", full_name: "H", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_after_compute: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_after_compute}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
          trigger:
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
          assert:
            - "EFilingSubmission.${ef_id}.status == ACCEPTED"
            - "TaxReturn.${ret_id}.status == FILED"

  # =================================================================
  # Rule 5 — Validation priority conflicts across different category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_constraint_on_compute
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: "Category pair state(7) vs business_constraint(10): an ITEMIZED return already FILED, recomputed, fails the state check (ERR_INVALID_STATE) before the missing-Schedule-A constraint (ERR_ITEMIZED_REQUIRES_SCHEDULE_A) — state wins."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn ITEMIZED with Schedule A, computed, e-filed, ACCEPTED -> FILED."
            - "After FILED, the Schedule A constraint is irrelevant because compute from FILED is itself an undefined transition."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "i@x.com", full_name: "I", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "ITEMIZED" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/schedules"
              payload: { schedule_type: "A", gross_amount_cents: 2500000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_after_compute: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_after_compute}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: owner_auth_before_state_on_amend_file
        grounds:
          - validations[priority=3]
          - validations[priority=14]
        distinguishing_aspect: "Category pair auth-ownership(3) vs business_safety(14): a non-owner Taxpayer filing a 1040X against a DRAFT amendment fails the ownership check (ERR_NOT_RESOURCE_OWNER) before the original-not-FILED safety check (ERR_ORIGINAL_NOT_FILED) — ownership wins."
        test_recipe:
          setup:
            - "Owner Taxpayer O has a FILED TaxReturn and a DRAFT AmendedReturn against it; a second Taxpayer X exists who is not the owner."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "o@x.com", full_name: "O", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { o_id: $.data.id }
            - call: "POST /taxpayers"
              payload: { email: "x@x.com", full_name: "X", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { x_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${o_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${o_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${o_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${o_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${o_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${o_id}"
              captures: { v_filed: $.data.version }
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${o_id}", corrected_balance_due_cents: 40000, correction_period_start: "2025-01-01T00:00:00Z", correction_period_end: "2025-12-31T00:00:00Z", expected_return_version: "${v_filed}" }
              as: Taxpayer
              as_user_id: "${o_id}"
              captures: { amd_id: $.data.id }
          trigger:
            - call: "POST /amended-returns/${amd_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${x_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER"
            - "HTTP status == 403"

  # =================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: aotc_phaseout_start_inclusive_boundary
        grounds:
          - calculations.compute_credit_allowance
          - entities.CreditClaim.fields.allowed_amount_cents
        distinguishing_aspect: "Numeric <= boundary on AGI at exactly AOTC_PHASEOUT_START (8,000,000): agi == start uses the below-phaseout branch and yields full allowed 250,000; one cent more (8,000,001) prorates to 249,999."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; W-2 wages exactly 8,000,000 (agi == AOTC_PHASEOUT_START); student Dependent; AOTC claimed 250,000."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "j@x.com", full_name: "J", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 0 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/dependents"
              payload: { full_name: "Kid", age_years: 19, is_student: true }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/credit-claims"
              payload: { credit_type: "AOTC", claimed_amount_cents: 250000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "CreditClaim(AOTC).allowed_amount_cents == 250000"
            - "CreditClaim(AOTC).refundable_cents == 100000"

      - name: capital_loss_limit_exact_boundary
        grounds:
          - calculations.compute_capital_gain
          - entities.Schedule.fields.net_amount_cents
        distinguishing_aspect: "Different metric and endpoint (Schedule D net via income-documents 1099_B, not AGI threshold): a raw net loss of exactly -300,000 (== CAPITAL_LOSS_LIMIT) is preserved as -300,000, while -300,001 is capped at -300,000."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; one W-2 wages 5,000,000; one 1099-B with proceeds 0 cost_basis 300,000 (raw net -300,000, exactly the limit)."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "k@x.com", full_name: "K", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 5000000, federal_withholding_cents: 0 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "1099_B", payer_name: "Broker", box_amount_cents: 0, proceeds_cents: 0, cost_basis_cents: 300000, holding_long_term: true }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "Schedule(D).net_amount_cents == -300000"
            - "TaxReturn.${ret_id}.total_income_cents == 4700000"

  # =================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: return_filed_requires_efiling_accepted
        grounds:
          - state_machines.TaxReturn.READY_to_FILED
          - state_machines.EFilingSubmission.TRANSMITTED_to_ACCEPTED
        distinguishing_aspect: "Entity pair TaxReturn<-EFilingSubmission: the return reaches FILED only because its EFilingSubmission reached ACCEPTED; while the submission is still TRANSMITTED the return stays READY."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn computed READY; e-file TRANSMITTED but not yet acknowledged."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "l@x.com", full_name: "L", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
          trigger:
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { st_before: $.data.status }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
          assert:
            - "TaxReturn.${ret_id}.status before acknowledge == READY"
            - "TaxReturn.${ret_id}.status after ACCEPTED == FILED"

      - name: amend_file_requires_original_return_filed
        grounds:
          - state_machines.AmendedReturn.DRAFT_to_FILED
          - state_machines.TaxReturn.FILED_to_AMENDED
          - validations[priority=14]
        distinguishing_aspect: "Entity pair AmendedReturn<-TaxReturn (different from the TaxReturn<-EFilingSubmission pair): filing the 1040X is permitted only because the original TaxReturn is in FILED; the guard reads the original's state."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn computed, e-filed, ACCEPTED -> FILED; a DRAFT AmendedReturn against it."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "m@x.com", full_name: "M", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_filed: $.data.version }
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${tp_id}", corrected_balance_due_cents: 60000, correction_period_start: "2025-01-01T00:00:00Z", correction_period_end: "2025-12-31T00:00:00Z", expected_return_version: "${v_filed}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { amd_id: $.data.id }
          trigger:
            - call: "POST /amended-returns/${amd_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { amd_status: $.data.status }
          assert:
            - "AmendedReturn.${amd_id}.status == FILED"
            - "TaxReturn.${ret_id}.status == AMENDED"

  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: estimated_payment_half_open_period_overlap
        grounds:
          - validations[priority=15]
          - entities.EstimatedTaxPayment.fields.period_start
          - entities.EstimatedTaxPayment.fields.period_end
        distinguishing_aspect: "Half-open [start,end) semantics on EstimatedTaxPayment: a Q2 payment with period [2025-03-01, 2025-06-01) overlaps an existing Q1 payment [2025-01-01, 2025-04-01) and is rejected; a touching boundary (start == prior end) would NOT overlap."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn (one W-2) with a Q1 estimated payment covering [2025-01-01, 2025-04-01)."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "n@x.com", full_name: "N", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 0 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /estimated-tax-payments"
              payload: { return_id: "${ret_id}", quarter: "Q1", amount_cents: 200000, paid_on: "2025-04-10T00:00:00Z", period_start: "2025-01-01T00:00:00Z", period_end: "2025-04-01T00:00:00Z" }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /estimated-tax-payments"
              payload: { return_id: "${ret_id}", quarter: "Q2", amount_cents: 200000, paid_on: "2025-06-10T00:00:00Z", period_start: "2025-03-01T00:00:00Z", period_end: "2025-06-01T00:00:00Z" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAYMENT_PERIOD_OVERLAP"
            - "HTTP status == 409"

      - name: amendment_closed_window_adjacency_overlap
        grounds:
          - validations[priority=16]
          - entities.AmendedReturn.fields.correction_period_start
          - entities.AmendedReturn.fields.correction_period_end
        distinguishing_aspect: "Closed [start,end] inclusive-endpoint semantics on AmendedReturn (different resource and different interval arithmetic from the half-open payment rule): a second amendment whose window starts exactly on the prior window's end date is rejected because closed-interval adjacency counts as overlap."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; a FILED TaxReturn with one filed AmendedReturn covering [2025-01-01, 2025-06-30]."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "p@x.com", full_name: "P", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_filed1: $.data.version }
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${tp_id}", corrected_balance_due_cents: 40000, correction_period_start: "2025-01-01T00:00:00Z", correction_period_end: "2025-06-30T00:00:00Z", expected_return_version: "${v_filed1}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_now: $.data.version }
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${tp_id}", corrected_balance_due_cents: 50000, correction_period_start: "2025-06-30T00:00:00Z", correction_period_end: "2025-12-31T00:00:00Z", expected_return_version: "${v_now}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CORRECTION_WINDOW_OVERLAP"
            - "HTTP status == 409"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: amendment_delta_conserves_balance_due_ledger
        grounds:
          - state_machines.AmendedReturn.DRAFT_to_FILED
          - calculations.compute_underpayment_penalty
          - entities.AmendedReturn.fields.delta_cents
          - entities.AmendedReturn.fields.corrected_balance_due_cents
        distinguishing_aspect: "Conserved quantity = balance-due ledger: after filing, original.balance_due_cents (35,300) + amended.delta_cents (-14,700) == amended.corrected_balance_due_cents (20,600), exactly; the compensating delta reconstructs the corrected balance with zero drift."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn (W-2 wages 8,000,000, withholding 900,000) computed balance_due 35,300, e-filed ACCEPTED -> FILED."
            - "A DRAFT AmendedReturn with corrected_balance_due_cents 20,600."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "q@x.com", full_name: "Q", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_filed: $.data.version }
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${tp_id}", corrected_balance_due_cents: 20600, correction_period_start: "2025-01-01T00:00:00Z", correction_period_end: "2025-12-31T00:00:00Z", expected_return_version: "${v_filed}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { amd_id: $.data.id }
          trigger:
            - call: "POST /amended-returns/${amd_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { delta: $.data.delta_cents }
          assert:
            - "AmendedReturn.${amd_id}.delta_cents == -14700"
            - "AmendedReturn.${amd_id}.corrected_balance_due_cents == 20600"
            - "invariant: 35300 + (-14700) == 20600 holds exactly"

      - name: reopen_recompute_conserves_total_payments
        grounds:
          - state_machines.TaxReturn.REJECTED_to_DRAFT
          - state_machines.TaxReturn.DRAFT_to_READY
          - entities.TaxReturn.fields.total_payments_cents
        distinguishing_aspect: "Different conserved quantity (payments ledger, not balance-due): a payment-neutral REJECTED->DRAFT->READY cycle leaves total_payments_cents unchanged at 900,000 (withholding) + 200,000 (Q1) == 1,100,000 with zero drift across the reopen/recompute."
        test_recipe:
          setup:
            - "Taxpayer SINGLE; TaxReturn with W-2 withholding 900,000 and a Q1 estimated payment 200,000; computed, e-filed, REJECTED by gateway."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "r@x.com", full_name: "R", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /estimated-tax-payments"
              payload: { return_id: "${ret_id}", quarter: "Q1", amount_cents: 200000, paid_on: "2025-04-10T00:00:00Z", period_start: "2025-01-01T00:00:00Z", period_end: "2025-04-01T00:00:00Z" }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "REJECTED", ack_code: "R0002" }
              as: IrsGateway
          trigger:
            - call: "PATCH /tax-returns/${ret_id}"
              payload: { reopen: true }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { tp_payments: $.data.total_payments_cents }
          assert:
            - "TaxReturn.${ret_id}.total_payments_cents == 1100000"
            - "TaxReturn.${ret_id}.status == READY"
