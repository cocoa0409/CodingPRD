        claim_type: conditional_validation
        grounds:
          - calculations.transport_release_window
          - validations[priority=65]
          - errors[ERR_RELEASE_TIME_EXCEEDED]
          - entities.School.fields.max_release_minutes_per_request
        distinguishing_aspect: "The ceiling is per-school configuration, not a global constant: with school_day_end_utc_hhmm 20:30 and max_release_minutes_per_request 30, a trip departing at 16:00Z computes 270 release minutes and is refused with ERR_RELEASE_TIME_EXCEEDED, while a school configured at 240 would accept the identical trip only if it computed 240 or fewer."
        test_recipe:
          setup: ["North High with school_day_end_utc_hhmm 20:30 and max_release_minutes_per_request 30, hosting a SCHEDULED contest on 2026-09-20 18:00-20:00Z."]
