  - rule_id: non_linear_state_machine
    instances:
      - name: vehicle_parallel_dimensions_and_inspection_rework_cycle
        grounds:
          - state_machines.Vehicle.processing_status
          - state_machines.Vehicle.damage_status
          - state_machines.Vehicle.processing_status.INSPECTION_PASSED_to_ACCESSORY_IN_PROGRESS
          - entities.Vehicle.fields.rework_cycle_count
        distinguishing_aspect: |
          Non-linear because the processing dimension contains the backward edge
          INSPECTION_PASSED -> ACCESSORY_IN_PROGRESS (a genuine cycle with
          ACCESSORY_IN_PROGRESS -> INSPECTION_PASSED, so the graph is not a DAG) and because the
          two dimensions on the same row advance on disjoint triggers: the FAIL rewind moves
          processing_status backwards while damage_status stays at REPAIRED, and the repair
          completion moves damage_status while processing_status stays put.
        test_recipe:
          setup:
            - "One unit discharged 2026-08-02, surveyed with severity_index 53 (damage opened, claim not mandatory)."
            - "One accessory work order for qty 2, kitted and installed (processing_status ACCESSORY_IN_PROGRESS)."
            - "Repair authorized (AUTO, estimate 60000) and completed -> damage_status REPAIRED."
            - "First quality inspection PASSED -> processing_status INSPECTION_PASSED."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000006", model_line: "LX500", pio_program_code: "PIO-ALLOY" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/vessels/${vessel_id}/complete-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers/${center_id}/accessory-kits"
              payload: { kit_code: "KIT-ALLOY-19", program_code: "PIO-ALLOY", received_qty_total: 10, unit_cost_cents: 12340, install_minutes_per_unit: 24 }
              as: AccessoryTechnician
              captures: { kit_id: $.data.id }
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "BODY_PANEL", severity_points: 40, repair_estimate_cents: 40000 }, { damage_zone: "GLASS", severity_points: 30, repair_estimate_cents: 20000 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
              payload: {}
