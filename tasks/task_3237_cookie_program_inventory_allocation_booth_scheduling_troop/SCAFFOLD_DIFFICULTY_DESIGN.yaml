            - "TroopAccount balance_cents == 48000 and proceeds_accrued_cents == 8000 (80*100)"
            - "CookieSeason.${s_id}.initial_commit_units == 80, pending_commit_units == 0, remaining_units == 20"
            - "CookieSeason.${s_id}.forecast_attainment_pct == 80.00"
            - "CookieSeason.${s_id}.status == SELLING (hop 3: attainment >= 80 with clock >= ordering_opens_at auto-flipped the season)"

      - name: transfer_complete_two_hop_swap_symmetry_cascade
        grounds:
          - state_machines.InventoryTransfer.RECEIVER_SIGNED_to_COMPLETED
          - entities.InventoryTransfer.fields.counter_transfer_id
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (POST /transfers/{id}/complete):
          (1) completing transfer X with counter_transfer_id=Y where Y is
          RECEIVER_SIGNED causes (2) Y to auto-complete — the completion of Y
