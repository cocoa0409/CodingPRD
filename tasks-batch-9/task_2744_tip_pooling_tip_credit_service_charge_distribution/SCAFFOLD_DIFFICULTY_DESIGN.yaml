            - "Shift.${shift_id}.declaration_status is still UNDECLARED with declared_charged_tips_cents 0, declared_cash_tips_cents 0 and declaration_count 0"
            - "Shift.${shift_id}.time_status is still VOIDED, so the rejected call changed nothing"

