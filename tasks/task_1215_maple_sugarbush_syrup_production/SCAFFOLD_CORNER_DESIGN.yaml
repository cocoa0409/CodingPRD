scaffold_corner_design:
- section: entities
  instances:
  - name: season_create_initial_state
    claim_type: creation
    grounds:
    - entities.Season
    - state_machines.Season
    distinguishing_aspect: POST /seasons with all required fields returns 201 with status PLANNED and zeroed aggregates; server-minted id present.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      trigger:
      - call: GET /sugarhouse/seasons/${season_id}
        as: SugarhouseManager
      assert:
      - Season.status == PLANNED, taps_live == 0, total_sap_gallons == 0, total_syrup_gallons == 0, version == 1
  - name: crew_cert_default_false
    claim_type: defaults
    grounds:
    - entities.CrewMember.fields.cert_organic_handler
    distinguishing_aspect: Omitting cert_organic_handler on crew create defaults it to false.
    test_recipe:
      setup:
      - season created (PLANNED is enough for hiring)
      setup_api_calls:
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      trigger:
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Tammy Tapper
          crew_role: TAPPER
        as: SugarhouseManager
        captures:
          crew_id: $.data.id
          cert: $.data.cert_organic_handler
      assert:
      - CrewMember.${crew_id}.cert_organic_handler == false
      - CrewMember.${crew_id}.status == HIRED
  - name: season_missing_year_rejected
    claim_type: required_fields
    grounds:
    - entities.Season.fields.year
    - errors[ERR_VALIDATION]
    distinguishing_aspect: Missing required field year -> ERR_VALIDATION 400.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /sugarhouse/seasons
        payload:
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION (HTTP 400)
  - name: sugarbush_get_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but nonexistent UUID -> ERR_NOT_FOUND 404.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /sugarhouse/sugarbushes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: SugarhouseManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND (HTTP 404)
  - name: computed_field_in_create_rejected
    claim_type: computed_fields
    grounds:
    - entities.Sugarbush.fields.taps_set
    - errors[ERR_VALIDATION]
    distinguishing_aspect: Sending computed field taps_set in a create body is rejected as an unknown field.
    test_recipe:
      setup:
      - season exists
      setup_api_calls:
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      trigger:
      - call: POST /sugarhouse/sugarbushes
        payload:
          season_id: ${season_id}
          name: North Woods
          tap_capacity: 5000
          taps_set: 999
        as: SugarhouseManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION (HTTP 400); no Sugarbush persisted with taps_set 999
  - name: crew_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.CrewMember.fields.crew_role
    - errors[ERR_VALIDATION]
    distinguishing_aspect: crew_role outside {TAPPER, BOILER, GRADER} -> ERR_VALIDATION.
    test_recipe:
      setup:
      - season exists
      setup_api_calls:
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      trigger:
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Bad Role
          crew_role: MANAGER
        as: SugarhouseManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION (HTTP 400)
  - name: batch_intake_immutable_shape
    claim_type: immutability
    grounds:
    - entities.BatchIntake
    distinguishing_aspect: 'common_fields:false event entity: intake rows expose id and created_at but no version/updated_at, and no update endpoint exists.'
    test_recipe:
      setup:
      - run confirmed 50 gal; batch FILLING with one 50-gal intake
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      - call: POST /sugarhouse/seasons/${season_id}/open
        as: SugarhouseManager
        captures:
          season_v: $.data.version
      - call: POST /sugarhouse/sugarbushes
        payload:
          season_id: ${season_id}
          name: North Woods
          tap_capacity: 5000
        as: SugarhouseManager
        captures:
          bush_id: $.data.id
      - call: POST /sugarhouse/sugarbushes/${bush_id}/begin-tapping
        as: SugarhouseManager
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L1
          tap_count: 100
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line1_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line1_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/sugarbushes/${bush_id}/go-live
        as: SugarhouseManager
      - call: POST /sugarhouse/weather-windows
        payload:
          season_id: ${season_id}
          opens_at: '2027-03-01T00:00:00Z'
          closes_at: '2027-03-10T00:00:00Z'
          forecast_min_f: 28.0
          forecast_max_f: 42.0
          expected_season_version: ${season_v}
        as: SugarhouseManager
        captures:
          win_id: $.data.id
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Tammy Tapper
          crew_role: TAPPER
        as: SugarhouseManager
        captures:
          tapper_id: $.data.id
      - call: POST /sugarhouse/crew-members/${tapper_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Bob Boiler
          crew_role: BOILER
        as: SugarhouseManager
        captures:
          boiler_id: $.data.id
      - call: POST /sugarhouse/crew-members/${boiler_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-02T08:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/weather-windows/${win_id}/open
        as: SugarhouseManager
      - call: POST /sugarhouse/sap-runs
        payload:
          sugarbush_id: ${bush_id}
          weather_window_id: ${win_id}
          collected_by: ${tapper_id}
          gallons_collected: 50.0
          measured_brix: 2.0
        as: FieldCrew
        as_user_id: ${tapper_id}
        captures:
          run_id: $.data.id
      - call: POST /sugarhouse/sap-runs/${run_id}/confirm
        as: FieldCrew
        as_user_id: ${tapper_id}
      - call: POST /sugarhouse/batches
        payload:
          season_id: ${season_id}
          boiled_by: ${boiler_id}
          evaporator_capacity_gal: 200
        as: SugarMaker
        as_user_id: ${boiler_id}
        captures:
          batch_id: $.data.id
      - call: POST /sugarhouse/batches/${batch_id}/intakes
        payload:
          sap_run_id: ${run_id}
          gallons_drawn: 50.0
        as: SugarMaker
        as_user_id: ${boiler_id}
        captures:
          intake_id: $.data.id
      trigger:
      - call: GET /sugarhouse/batches/${batch_id}/intakes
        as: SugarhouseManager
      assert:
      - intake row has id and created_at; response object has no version and no updated_at keys
      - BatchIntake.${intake_id}.gallons_drawn == 50.0 and draw_sequence == 1
  - name: sap_run_list_pagination
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints[GET /sugarhouse/sap-runs]
    distinguishing_aspect: GET /sap-runs?limit=1&offset=0 over 2 runs returns exactly 1 row with total_count 2 and has_more true; offset 1 returns the second row with has_more false.
    test_recipe:
      setup:
      - full live chain; two DRAFT runs created at 2027-03-02T08:00:00Z and 2027-03-02T09:00:00Z
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      - call: POST /sugarhouse/seasons/${season_id}/open
        as: SugarhouseManager
        captures:
          season_v: $.data.version
      - call: POST /sugarhouse/sugarbushes
        payload:
          season_id: ${season_id}
          name: North Woods
          tap_capacity: 5000
        as: SugarhouseManager
        captures:
          bush_id: $.data.id
      - call: POST /sugarhouse/sugarbushes/${bush_id}/begin-tapping
        as: SugarhouseManager
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L1
          tap_count: 100
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line1_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line1_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/sugarbushes/${bush_id}/go-live
        as: SugarhouseManager
      - call: POST /sugarhouse/weather-windows
        payload:
          season_id: ${season_id}
          opens_at: '2027-03-01T00:00:00Z'
          closes_at: '2027-03-10T00:00:00Z'
          forecast_min_f: 28.0
          forecast_max_f: 42.0
          expected_season_version: ${season_v}
        as: SugarhouseManager
        captures:
          win_id: $.data.id
      - call: POST /sugarhouse/crew-members
        payload:
          season_id: ${season_id}
          name: Tammy Tapper
          crew_role: TAPPER
        as: SugarhouseManager
        captures:
          tapper_id: $.data.id
      - call: POST /sugarhouse/crew-members/${tapper_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-02T08:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/weather-windows/${win_id}/open
        as: SugarhouseManager
      - call: POST /sugarhouse/sap-runs
        payload:
          sugarbush_id: ${bush_id}
          weather_window_id: ${win_id}
          collected_by: ${tapper_id}
          gallons_collected: 10.0
          measured_brix: 2.0
        as: FieldCrew
        as_user_id: ${tapper_id}
        captures:
          run1_id: $.data.id
      - call: POST /sugarhouse/sap-runs
        payload:
          sugarbush_id: ${bush_id}
          weather_window_id: ${win_id}
          collected_by: ${tapper_id}
          gallons_collected: 20.0
          measured_brix: 2.5
        as: FieldCrew
        as_user_id: ${tapper_id}
        captures:
          run2_id: $.data.id
      trigger:
      - call: GET /sugarhouse/sap-runs?limit=1&offset=0
        as: SugarhouseManager
      - call: GET /sugarhouse/sap-runs?limit=1&offset=1
        as: SugarhouseManager
      assert:
      - 'page 1: exactly 1 item, total_count == 2, has_more == true'
      - 'page 2: exactly 1 item, total_count == 2, has_more == false'
- section: state_machines
