# =============================================================================
# SCAFFOLD.yaml — Therapy Animal Certification & Visit Scheduling
# =============================================================================

scenario: |
  Therapy Animal Certification & Visit Scheduling (Pet Partners style program): handler/animal evaluation & temperament testing, certification renewal & health/vaccination requirements, facility partnership agreement & orientation, visit scheduling & facility-specific rules, incident reporting & animal welfare limits (visit length/rest), volunteer hour tracking & recognition, insurance coverage & liability waivers, request queue & unmet facility demand

domain_name: therapy-animal-visits
api_prefix: /v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK links in bodies)
# =============================================================================
entities:
  - name: Handler
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer handler legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across handlers" }
      - { name: region_code, type: string, source: input, description: "Home region code (free-form 2-letter)" }
      - { name: volunteer_since, type: string, source: input, description: "ISO date the volunteer first joined any program; drives experience_years" }
      - { name: phone, type: string, source: input, required: false, description: "Optional contact phone" }
      - { name: status, type: enum, source: system, description: "APPLICANT | ACTIVE | SUSPENDED | RETIRED | REJECTED" }
      - { name: suspension_reason, type: string, source: system, required: false, description: "Set when status becomes SUSPENDED" }
      - { name: lifetime_minutes, type: integer, source: computed, default: 0, description: "Sum over all HourCredit rows for this handler (PROVISIONAL + FINAL + REVERSAL + ADJUSTMENT); floor 0 enforced on posting" }
      - { name: recognition_tier, type: enum, source: computed, default: NONE, description: "NONE | BRONZE | SILVER | GOLD | PLATINUM derived from lifetime_minutes (thresholds 1500/6000/15000/30000, >= inclusive)" }

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - { name: handler_id, type: string, source: system, description: "FK -> Handler.id; owning handler taken from X-User-ID at creation" }
      - { name: name, type: string, source: input, description: "Animal name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | RABBIT | GUINEA_PIG | BIRD | MINIATURE_HORSE" }
      - { name: breed, type: string, source: input, description: "Breed label" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | WELFARE_HOLD | RETIRED" }
      - { name: welfare_hold_until, type: datetime, source: system, required: false, description: "Hold expiry set by welfare-hold action or incident escalation precaution (14 days)" }
      - { name: welfare_hold_reason, type: string, source: system, required: false, description: "MANUAL | INCIDENT_PRECAUTION" }
      - { name: welfare_blocked_until, type: datetime, source: computed, required: false, description: "Rest block: actual_end + rest_requirement_minutes of the most recent COMPLETED visit; null when no rest owed" }
      - { name: forward_workload_minutes, type: integer, source: computed, default: 0, description: "FORWARD_LOOKING variant of welfare_workload_minutes over window [now-7d, now+7d)" }
      - { name: audit_workload_minutes, type: integer, source: computed, default: 0, description: "AUDIT variant of welfare_workload_minutes over window [now-7d, now)" }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: handler_id, type: string, source: system, description: "FK -> Handler.id; owning handler from X-User-ID at creation" }
      - { name: animal_id, type: string, source: input, description: "FK -> Animal.id; animal must belong to the creating handler" }
      - { name: team_name, type: string, source: input, description: "Display name for the handler-animal team" }
      - { name: status, type: enum, source: system, description: "FORMING | ACTIVE | SUSPENDED | DISSOLVED; ACTIVE/SUSPENDED bubble up from Certification" }
      - { name: late_cancel_count, type: integer, source: system, default: 0, description: "Tiered late-cancel penalty accumulator; resets to 0 when it triggers certification suspension" }
      - { name: no_show_count, type: integer, source: system, default: 0, description: "Increments when a SCHEDULED visit is swept to NO_SHOW" }
      - { name: warning_count, type: integer, source: system, default: 0, description: "Increments when an incident resolves with resolution_code WARNING" }

  - name: Evaluator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Evaluator name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: region_code, type: string, source: input, description: "Operating region" }
      - { name: specializations, type: array, source: input, description: "Non-empty list of species enums the evaluator is certified to score" }
      - { name: max_evaluations_per_day, type: integer, source: input, default: 4, description: "Daily scoring-slot cap (1..8)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Evaluation
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; team under evaluation" }
      - { name: evaluator_id, type: string, source: system, required: false, description: "FK -> Evaluator.id; null until scheduled" }
      - { name: attempt_number, type: integer, source: system, default: 1, description: "1 for first attempt; increments on each APPEALED -> SCHEDULED re-schedule" }
      - { name: scheduled_start, type: datetime, source: system, required: false, description: "Set by schedule action" }
      - { name: scheduled_end, type: datetime, source: system, required: false, description: "Set by schedule action; duration must be 30..120 minutes" }
      - { name: aptitude_score, type: integer, source: input, required: false, description: "0..100, supplied at scoring" }
      - { name: obedience_score, type: integer, source: input, required: false, description: "0..100, supplied at scoring" }
      - { name: composite_score, type: number, source: computed, required: false, description: "round_half_up(0.6*aptitude + 0.4*obedience, 2)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | PASSED | FAILED | APPEALED | CANCELLED | EXPIRED" }
      - { name: requested_at, type: datetime, source: system, description: "Creation timestamp; REQUESTED rows older than 60 days are swept to EXPIRED" }
      - { name: scored_at, type: datetime, source: system, required: false, description: "Set at scoring" }
      - { name: failed_at, type: datetime, source: system, required: false, description: "Set when scored into FAILED; appeal window = failed_at + 14 days" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> Evaluation.id; must reference a PASSED evaluation of the same team" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | ACTIVE | RENEWAL_DUE | SUSPENDED | EXPIRED | REVOKED" }
      - { name: activated_on, type: string, source: system, required: false, description: "ISO date of first (or latest) activation" }
      - { name: expires_on, type: string, source: system, required: false, description: "ISO date; activation sets today+730d; renewal sets max(today, prior expires_on)+730d" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of successful renewals" }
      - { name: suspension_reason, type: string, source: system, required: false, description: "MANUAL | INCIDENT_PRECAUTION | INCIDENT_SUSPENSION | INSURANCE_LAPSE | LATE_CANCELLATIONS" }
      - { name: suspension_until, type: string, source: system, required: false, description: "ISO date floor for reinstatement; null means immediate reinstatement allowed" }

  - name: VaccinationRecord
    parent: null
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: input, description: "FK -> Animal.id" }
      - { name: vaccine_type, type: enum, source: input, description: "RABIES | DISTEMPER | BORDETELLA | CANINE_INFLUENZA | FELINE_FVRCP" }
      - { name: administered_on, type: string, source: input, description: "ISO date administered" }
      - { name: valid_until, type: string, source: input, description: "ISO date; record VALID while today <= valid_until" }
      - { name: veterinarian_name, type: string, source: input, description: "Administering veterinarian" }
      - { name: clinic_name, type: string, source: input, required: false, description: "Clinic label" }
      - { name: status, type: enum, source: system, description: "VALID | EXPIRED | VOIDED" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: facility_type, type: enum, source: input, description: "HOSPITAL | SCHOOL | NURSING_HOME | REHAB_CENTER | HOSPICE" }
      - { name: region_code, type: string, source: input, description: "Region code" }
      - { name: address, type: string, source: input, required: false, description: "Optional street address" }
      - { name: max_visit_minutes, type: integer, source: input, description: "Facility cap on a single visit's scheduled duration" }
      - { name: allowed_species, type: array, source: input, description: "Non-empty list of species enums admitted for visits" }
      - { name: min_liability_coverage_cents, type: integer, source: input, description: "Facility-specific minimum liability coverage" }
      - { name: max_overlapping_teams, type: integer, source: input, description: "Aggregate capacity: max visits whose intervals overlap at any instant" }
      - { name: visits_per_week_cap, type: integer, source: input, description: "Max visits per ISO week (Mon-Sun) in states SCHEDULED/IN_PROGRESS/COMPLETED" }
      - { name: required_waiver_version, type: string, source: input, default: "v1", description: "Waiver version a SIGNED LiabilityWaiver must match to authorize visits" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ONBOARDING | ACTIVE | SUSPENDED | TERMINATED" }

  - name: FacilityAgreement
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: start_on, type: string, source: input, description: "ISO date; must be strictly before end_on" }
      - { name: end_on, type: string, source: input, description: "ISO date; agreement covers start_on..end_on inclusive" }
      - { name: agreed_max_visit_minutes, type: integer, source: input, description: "Contract cap on visit duration at this facility" }
      - { name: insurance_minimum_cents, type: integer, source: input, description: "Contract insurance floor (feeds insurance_adequacy_requirement via facility)" }
      - { name: terms_version, type: string, source: input, description: "Contract terms label" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_FACILITY_SIGNATURE | PENDING_PROGRAM_SIGNATURE | ACTIVE | EXPIRED | TERMINATED | WITHDRAWN" }
      - { name: terminated_reason, type: string, source: system, required: false, description: "Free-text reason on termination" }

  - name: OrientationRecord
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; derived from the creating FacilityCoordinator's X-User-ID" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED | EXPIRED" }
      - { name: attended_on, type: string, source: system, required: false, description: "ISO date set on completion" }
      - { name: expires_on, type: string, source: system, required: false, description: "attended_on + 365 days" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: handler_id, type: string, source: system, description: "FK -> Handler.id; owning handler from X-User-ID" }
      - { name: insurer_name, type: string, source: input, description: "Insurer label" }
      - { name: policy_number, type: string, source: input, description: "Policy identifier; unique per handler" }
      - { name: coverage_cents, type: integer, source: input, description: "Liability coverage amount in cents" }
      - { name: effective_from, type: string, source: input, description: "ISO date coverage begins (inclusive)" }
      - { name: effective_until, type: string, source: input, description: "ISO date coverage ends (inclusive); must be >= effective_from" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | EXPIRED | CANCELLED" }

  - name: LiabilityWaiver
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: waiver_version, type: string, source: input, description: "Version label; must equal facility.required_waiver_version to authorize visits" }
      - { name: signed_on, type: string, source: input, description: "ISO date signed; must be <= today" }
      - { name: status, type: enum, source: system, description: "SIGNED | VOIDED" }

  - name: VisitRequest
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; derived from the creating FacilityCoordinator's X-User-ID" }
      - { name: requested_start, type: datetime, source: input, description: "Requested visit start (ISO8601 UTC); must be in the future" }
      - { name: requested_end, type: datetime, source: input, description: "Requested visit end; duration must be 30..120 minutes" }
      - { name: species_preference, type: enum, source: input, required: false, description: "Optional preferred species (same enum as Animal.species); null = open" }
      - { name: visit_program, type: enum, source: input, description: "READING | REHAB | STRESS_RELIEF | GENERAL" }
      - { name: priority, type: enum, source: input, description: "ROUTINE | HIGH | URGENT; feeds team_match_score multiplier" }
      - { name: status, type: enum, source: system, description: "OPEN | OFFERED | ACCEPTED | FULFILLED | WITHDRAWN | EXPIRED" }
      - { name: offered_team_id, type: string, source: system, required: false, description: "FK -> Team.id; set while OFFERED, cleared on decline/offer-expiry" }
      - { name: offered_at, type: datetime, source: system, required: false, description: "Offer timestamp" }
      - { name: offer_expires_at, type: datetime, source: system, required: false, description: "offered_at + 72 hours" }
      - { name: decline_count, type: integer, source: system, default: 0, description: "Number of handler-initiated declines (sweep offer expiry does NOT increment)" }
      - { name: expired_on, type: string, source: system, required: false, description: "ISO date the request was swept to EXPIRED; feeds unmet_demand_index" }
      - { name: fulfilled_on, type: string, source: system, required: false, description: "ISO date the request reached FULFILLED; feeds demand summary" }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: request_id, type: string, source: system, required: false, description: "FK -> VisitRequest.id; set only when created via request acceptance" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled end; duration 30..120 and <= effective cap" }
      - { name: actual_start, type: datetime, source: system, required: false, description: "Set at check-in" }
      - { name: actual_end, type: datetime, source: system, required: false, description: "Set at check-out" }
      - { name: actual_minutes, type: integer, source: computed, required: false, description: "floor((actual_end - actual_start) in seconds / 60)" }
      - { name: lifecycle_status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | DISPUTED; transitions only while lifecycle_status == COMPLETED" }
      - { name: cancel_reason, type: enum, source: system, required: false, description: "HANDLER_CANCEL | ADMIN_CANCEL | FACILITY_CANCEL | AGREEMENT_ENDED | CERT_SUSPENDED | CERT_REVOKED | TEAM_DISSOLVED | INCIDENT_PRECAUTION" }
      - { name: cancelled_at, type: datetime, source: system, required: false, description: "Cancellation timestamp" }
      - { name: verified_at, type: datetime, source: system, required: false, description: "Verification timestamp" }
      - { name: approved_minutes, type: integer, source: system, required: false, description: "Set by resolve-dispute; feeds FINAL credit" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; visit must be IN_PROGRESS or COMPLETED" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: category, type: enum, source: input, description: "ANIMAL_STRESS | BITE_SCRATCH | INJURY | PROPERTY_DAMAGE | PROTOCOL_BREACH" }
      - { name: description, type: string, source: input, description: "Free-text description (>= 10 chars)" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | ESCALATED | RESOLVED" }
      - { name: filed_by_role, type: string, source: system, description: "X-User-Role of the filer" }
      - { name: triaged_by, type: string, source: system, required: false, description: "X-User-ID of the ComplianceOfficer who triaged" }
      - { name: resolved_by, type: string, source: system, required: false, description: "X-User-ID of resolver; must differ from triaged_by (segregation of duties)" }
      - { name: resolution_code, type: enum, source: system, required: false, description: "NO_ACTION | WARNING | SUSPENSION | REVOCATION" }
      - { name: suspension_days, type: integer, source: input, required: false, description: "Required when resolution_code == SUSPENSION (1..365)" }

  - name: HourCredit
    parent: null
    common_fields: false
    fields:
      - { name: handler_id, type: string, source: system, description: "FK -> Handler.id" }
      - { name: visit_id, type: string, source: system, required: false, description: "FK -> Visit.id; null for ADJUSTMENT rows" }
      - { name: kind, type: enum, source: system, description: "PROVISIONAL | FINAL | REVERSAL | ADJUSTMENT" }
      - { name: minutes, type: integer, source: system, description: "Signed minutes; PROVISIONAL/FINAL positive, REVERSAL negative, ADJUSTMENT either sign" }
      - { name: note, type: string, source: system, required: false, description: "Reason label (e.g., adjustment reason)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Handler
    initial_state: APPLICANT
    terminal_states: [RETIRED, REJECTED]
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /v1/handlers/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "status == APPLICANT (ERR_HANDLER_NOT_APPLICANT)"
        side_effects: []
      - from: APPLICANT
        to: REJECTED
        trigger: "POST /v1/handlers/{id}/reject"
        actor: ProgramAdmin
        preconditions:
          - "status == APPLICANT (ERR_HANDLER_NOT_APPLICANT)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/handlers/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE (ERR_HANDLER_NOT_ACTIVE)"
        side_effects:
          - "suspension_reason set; existing SCHEDULED visits and certifications are NOT modified"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/handlers/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUSPENDED (ERR_HANDLER_NOT_SUSPENDED)"
        side_effects:
          - "suspension_reason cleared"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /v1/handlers/{id}/retire"
        actor: Handler | ProgramAdmin
        preconditions:
          - "status == ACTIVE (ERR_HANDLER_NOT_ACTIVE)"
        side_effects:
          - "Every Team of this handler in status IN {FORMING, ACTIVE, SUSPENDED} -> DISSOLVED"
          - "Every Visit of those teams with lifecycle_status == SCHEDULED -> CANCELLED (cancel_reason=TEAM_DISSOLVED); Animal.forward_workload_minutes decremented per cancelled visit; request-backed visits return their VisitRequest to OPEN (offer fields cleared)"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /v1/handlers/{id}/retire"
        actor: Handler | ProgramAdmin
        preconditions:
          - "status IN {ACTIVE, SUSPENDED} (ERR_HANDLER_NOT_ACTIVE)"
        side_effects:
          - "Same cascade as ACTIVE -> RETIRED"

  - entity: Animal
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "system (bubble-up when a Team containing this animal has its Certification activated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: WELFARE_HOLD
        trigger: "POST /v1/animals/{id}/welfare-hold OR system (incident escalation precaution)"
        actor: ComplianceOfficer | system
        preconditions:
          - "status == ACTIVE (ERR_ANIMAL_NOT_ACTIVE)"
        side_effects:
          - "welfare_hold_until set (manual: payload hold_until; precaution: now + 14 days); welfare_hold_reason set (MANUAL | INCIDENT_PRECAUTION)"
      - from: WELFARE_HOLD
        to: ACTIVE
        trigger: "POST /v1/animals/{id}/welfare-release OR system sweep (now > welfare_hold_until AND no IncidentReport on this animal's visits in {FILED, UNDER_REVIEW, ESCALATED})"
        actor: ComplianceOfficer | system
        preconditions:
          - "status == WELFARE_HOLD (ERR_ANIMAL_NOT_ON_HOLD)"
        side_effects:
          - "welfare_hold_until and welfare_hold_reason cleared"
      - from: REGISTERED
        to: RETIRED
        trigger: "POST /v1/animals/{id}/retire"
        actor: Handler
        preconditions:
          - "status IN {REGISTERED, ACTIVE} (ERR_ANIMAL_NOT_RETIRABLE)"
          - "No Team containing this animal in status IN {FORMING, ACTIVE, SUSPENDED} (ERR_ANIMAL_HAS_ACTIVE_TEAM)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /v1/animals/{id}/retire"
        actor: Handler
        preconditions:
          - "status IN {REGISTERED, ACTIVE} (ERR_ANIMAL_NOT_RETIRABLE)"
          - "No Team containing this animal in status IN {FORMING, ACTIVE, SUSPENDED} (ERR_ANIMAL_HAS_ACTIVE_TEAM)"
        side_effects: []

  - entity: Team
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: ACTIVE
        trigger: "system (bubble-up when the team's Certification transitions PROVISIONAL -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (bubble-up when the team's Certification transitions to SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (bubble-up when the team's Certification is reinstated to ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FORMING
        to: DISSOLVED
        trigger: "POST /v1/teams/{id}/dissolve OR system (handler retirement cascade, incident REVOCATION resolution)"
        actor: Handler | system
        preconditions:
          - "Manual dissolve: no Visit of this team with lifecycle_status IN {SCHEDULED, IN_PROGRESS} (ERR_TEAM_HAS_SCHEDULED_VISITS)"
        side_effects: []
      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /v1/teams/{id}/dissolve OR system (handler retirement cascade, incident REVOCATION resolution)"
        actor: Handler | system
        preconditions:
          - "Manual dissolve: no Visit of this team with lifecycle_status IN {SCHEDULED, IN_PROGRESS} (ERR_TEAM_HAS_SCHEDULED_VISITS)"
        side_effects:
          - "Certification of this team in status IN {PROVISIONAL, ACTIVE, RENEWAL_DUE, SUSPENDED} -> REVOKED (system path only when triggered by REVOCATION resolution; manual dissolve requires the certification be REVOKED/absent first via ERR_TEAM_HAS_ACTIVE_CERTIFICATION)"
      - from: SUSPENDED
        to: DISSOLVED
        trigger: "POST /v1/teams/{id}/dissolve OR system (handler retirement cascade, incident REVOCATION resolution)"
        actor: Handler | system
        preconditions:
          - "Manual dissolve: no Visit of this team with lifecycle_status IN {SCHEDULED, IN_PROGRESS} (ERR_TEAM_HAS_SCHEDULED_VISITS)"
        side_effects: []

  - entity: Evaluator
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /v1/evaluators/{id} with status=INACTIVE"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Existing SCHEDULED evaluations remain schedulable/scorable; new scheduling is blocked (ERR_EVALUATOR_NOT_ACTIVE)"
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /v1/evaluators/{id} with status=ACTIVE"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: Evaluation
    initial_state: REQUESTED
    terminal_states: [PASSED, CANCELLED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /v1/evaluations/{id}/schedule"
        actor: ProgramAdmin
        preconditions:
          - "status IN {REQUESTED, APPEALED} (ERR_EVALUATION_NOT_SCHEDULABLE)"
          - "Evaluator status == ACTIVE (ERR_EVALUATOR_NOT_ACTIVE)"
          - "Animal species of the team IN evaluator.specializations (ERR_EVALUATOR_SPECIES_MISMATCH)"
          - "scheduled_start >= now (ERR_EVALUATION_SCHEDULE_IN_PAST)"
          - "duration 30..120 minutes (ERR_EVALUATION_DURATION_INVALID)"
          - "No buffered evaluator conflict (ERR_EVALUATOR_SCHEDULING_CONFLICT)"
          - "Evaluator SCHEDULED-evaluation count on that UTC day < max_evaluations_per_day (ERR_EVALUATOR_DAILY_CAP_EXCEEDED)"
        side_effects:
          - "evaluator_id, scheduled_start, scheduled_end set"
          - "If transitioning from APPEALED: attempt_number += 1"
      - from: APPEALED
        to: SCHEDULED
        trigger: "POST /v1/evaluations/{id}/schedule"
        actor: ProgramAdmin
        preconditions:
          - "status IN {REQUESTED, APPEALED} (ERR_EVALUATION_NOT_SCHEDULABLE)"
          - "Same evaluator/schedule preconditions as REQUESTED -> SCHEDULED"
        side_effects:
          - "attempt_number += 1; evaluator_id, scheduled_start, scheduled_end set"
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /v1/evaluations/{id}/score"
        actor: Evaluator
        preconditions:
          - "status == SCHEDULED (ERR_EVALUATION_NOT_SCHEDULED)"
          - "Acting Evaluator id == evaluation.evaluator_id (ERR_OWNERSHIP_MISMATCH)"
          - "now >= scheduled_end (ERR_EVALUATION_NOT_CONCLUDED)"
          - "Pass rule per evaluation_composite: attempt 1 requires aptitude >= 70 AND obedience >= 70 AND composite >= 75.0; attempt >= 2 additionally requires composite >= 80.0"
        side_effects:
          - "aptitude_score, obedience_score, composite_score, scored_at set"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /v1/evaluations/{id}/score (same call; failing composite routes here)"
        actor: Evaluator
        preconditions:
          - "status == SCHEDULED (ERR_EVALUATION_NOT_SCHEDULED)"
          - "Acting Evaluator id == evaluation.evaluator_id (ERR_OWNERSHIP_MISMATCH)"
          - "now >= scheduled_end (ERR_EVALUATION_NOT_CONCLUDED)"
        side_effects:
          - "aptitude_score, obedience_score, composite_score, scored_at, failed_at set"
      - from: FAILED
        to: APPEALED
        trigger: "POST /v1/evaluations/{id}/appeal"
        actor: Handler
        preconditions:
          - "status == FAILED (ERR_EVALUATION_NOT_FAILED)"
          - "now <= failed_at + 14 days (ERR_EVALUATION_APPEAL_WINDOW_CLOSED)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /v1/evaluations/{id}/cancel"
        actor: Handler | ProgramAdmin
        preconditions:
          - "status IN {REQUESTED, SCHEDULED, APPEALED} (ERR_EVALUATION_NOT_CANCELLABLE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/evaluations/{id}/cancel"
        actor: Handler | ProgramAdmin
        preconditions:
          - "status IN {REQUESTED, SCHEDULED, APPEALED} (ERR_EVALUATION_NOT_CANCELLABLE)"
        side_effects: []
      - from: APPEALED
        to: CANCELLED
        trigger: "POST /v1/evaluations/{id}/cancel"
        actor: Handler | ProgramAdmin
        preconditions:
          - "status IN {REQUESTED, SCHEDULED, APPEALED} (ERR_EVALUATION_NOT_CANCELLABLE)"
        side_effects: []
      - from: REQUESTED
        to: EXPIRED
        trigger: "system sweep (now > requested_at + 60 days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: EXPIRED
        trigger: "system sweep (now > failed_at + 14 days)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Certification
    initial_state: PROVISIONAL
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /v1/certifications/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "status == PROVISIONAL (ERR_CERT_NOT_PROVISIONAL)"
          - "Safety: animal has a VaccinationRecord with vaccine_type == RABIES, status == VALID, valid_until >= today (ERR_VACCINATION_MISSING / ERR_VACCINATION_EXPIRED)"
          - "Fiscal: handler has an InsurancePolicy with status == ACTIVE, effective_from <= today <= effective_until, coverage_cents >= 100000000 (ERR_NO_ACTIVE_INSURANCE / ERR_INSURANCE_COVERAGE_INADEQUATE)"
        side_effects:
          - "activated_on = today; expires_on = today + 730 days"
          - "Team FORMING -> ACTIVE (bubble-up)"
          - "Animal REGISTERED -> ACTIVE (bubble-up)"
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "system sweep (today >= expires_on - 60 days AND today <= expires_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /v1/certifications/{id}/renew"
        actor: ProgramAdmin
        preconditions:
          - "status IN {RENEWAL_DUE, EXPIRED} (ERR_CERT_NOT_RENEWABLE)"
          - "Safety: RABIES VaccinationRecord VALID with valid_until >= today (ERR_VACCINATION_MISSING / ERR_VACCINATION_EXPIRED)"
          - "Constraint: >= 6 visits of this team with lifecycle_status == COMPLETED AND verification_status == VERIFIED and actual_end within [activated_on, expires_on] using the PRE-RENEWAL expires_on (ERR_RENEWAL_VISIT_MINIMUM_NOT_MET)"
          - "Fiscal: ACTIVE InsurancePolicy with coverage_cents >= 100000000 covering today (ERR_NO_ACTIVE_INSURANCE / ERR_INSURANCE_COVERAGE_INADEQUATE)"
        side_effects:
          - "Evaluation order pinned by certification_renewal_window: eligibility counted against pre-renewal expires_on FIRST, then expires_on = max(today, pre-renewal expires_on) + 730 days, then renewal_count += 1"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /v1/certifications/{id}/renew (late renewal)"
        actor: ProgramAdmin
        preconditions:
          - "status IN {RENEWAL_DUE, EXPIRED} (ERR_CERT_NOT_RENEWABLE)"
          - "today <= expires_on + 90 days (ERR_RENEWAL_WINDOW_CLOSED)"
          - "Same safety/constraint/fiscal gates as RENEWAL_DUE -> ACTIVE"
        side_effects:
          - "expires_on = max(today, pre-renewal expires_on) + 730 days; renewal_count += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep (today > expires_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RENEWAL_DUE
        to: EXPIRED
        trigger: "system sweep (today > expires_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/certifications/{id}/suspend OR system (incident escalation precaution, insurance-policy cancellation cascade, late-cancel threshold)"
        actor: ComplianceOfficer | system
        preconditions:
          - "status IN {ACTIVE, RENEWAL_DUE} (ERR_CERT_NOT_SUSPENDABLE)"
        side_effects:
          - "suspension_reason set (MANUAL | INCIDENT_PRECAUTION | INCIDENT_SUSPENSION | INSURANCE_LAPSE | LATE_CANCELLATIONS); suspension_until set only for INCIDENT_SUSPENSION"
          - "Team ACTIVE -> SUSPENDED (bubble-up)"
          - "Every Visit of the team with lifecycle_status == SCHEDULED -> CANCELLED (cancel_reason=CERT_SUSPENDED); Animal.forward_workload_minutes decremented per cancelled visit; request-backed visits return their VisitRequest to OPEN (offer fields cleared)"
      - from: RENEWAL_DUE
        to: SUSPENDED
        trigger: "POST /v1/certifications/{id}/suspend OR system"
        actor: ComplianceOfficer | system
        preconditions:
          - "status IN {ACTIVE, RENEWAL_DUE} (ERR_CERT_NOT_SUSPENDABLE)"
        side_effects:
          - "Same as ACTIVE -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/certifications/{id}/reinstate OR system (incident resolved NO_ACTION/WARNING releasing a precaution suspension)"
        actor: ComplianceOfficer | system
        preconditions:
          - "status == SUSPENDED (ERR_CERT_NOT_SUSPENDED)"
          - "suspension_until IS NULL OR today >= suspension_until (ERR_SUSPENSION_NOT_ELAPSED)"
          - "Re-gate: RABIES vaccination VALID with valid_until >= today (ERR_VACCINATION_EXPIRED) and ACTIVE InsurancePolicy coverage_cents >= 100000000 covering today (ERR_INSURANCE_COVERAGE_INADEQUATE)"
        side_effects:
          - "suspension_reason, suspension_until cleared"
          - "Team SUSPENDED -> ACTIVE (bubble-up); expires_on unchanged (no extension)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /v1/certifications/{id}/revoke OR system (incident resolved REVOCATION)"
        actor: ComplianceOfficer | system
        preconditions:
          - "status IN {ACTIVE, RENEWAL_DUE, SUSPENDED} (ERR_CERT_NOT_REVOKABLE)"
        side_effects:
          - "Team -> DISSOLVED; every SCHEDULED Visit of the team -> CANCELLED (cancel_reason=CERT_REVOKED); request-backed visits return their VisitRequest to OPEN"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /v1/certifications/{id}/revoke OR system (incident resolved REVOCATION)"
        actor: ComplianceOfficer | system
        preconditions:
          - "status IN {ACTIVE, RENEWAL_DUE, SUSPENDED} (ERR_CERT_NOT_REVOKABLE)"
        side_effects:
          - "Same as ACTIVE -> REVOKED"
      - from: RENEWAL_DUE
        to: REVOKED
        trigger: "POST /v1/certifications/{id}/revoke OR system (incident resolved REVOCATION)"
        actor: ComplianceOfficer | system
        preconditions:
          - "status IN {ACTIVE, RENEWAL_DUE, SUSPENDED} (ERR_CERT_NOT_REVOKABLE)"
        side_effects:
          - "Same as ACTIVE -> REVOKED"

  - entity: VaccinationRecord
    initial_state: VALID
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "system sweep (today > valid_until)"
        actor: system
        preconditions: []
        side_effects:
          - "No automatic certification effect; the expired record fails future activation/renewal/visit gates"
      - from: VALID
        to: VOIDED
        trigger: "POST /v1/vaccination-records/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "status == VALID (ERR_VACCINATION_NOT_VALID)"
        side_effects: []

  - entity: Facility
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ONBOARDING
        trigger: "system (when the first FacilityAgreement for this facility is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ONBOARDING
        to: ACTIVE
        trigger: "system (when a FacilityAgreement for this facility transitions to ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/facilities/{id}/suspend OR system (agreement EXPIRED/TERMINATED cascade)"
        actor: ComplianceOfficer | system
        preconditions:
          - "status == ACTIVE (ERR_FACILITY_NOT_ACTIVE)"
        side_effects:
          - "MANUAL suspend (ComplianceOfficer): existing SCHEDULED visits are NOT cancelled; new scheduling is blocked while SUSPENDED"
          - "SYSTEM cascade (agreement loss): every Visit at this facility with lifecycle_status == SCHEDULED -> CANCELLED (cancel_reason=AGREEMENT_ENDED); Animal.forward_workload_minutes decremented; request-backed visits return their VisitRequest to OPEN; every VisitRequest of this facility in status IN {OPEN, OFFERED} -> WITHDRAWN"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/facilities/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUSPENDED (ERR_FACILITY_NOT_SUSPENDED)"
          - "A FacilityAgreement for this facility with status == ACTIVE exists (ERR_NO_ACTIVE_AGREEMENT)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /v1/facilities/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "status IN {ACTIVE, SUSPENDED, ONBOARDING, PROSPECT} (ERR_FACILITY_ALREADY_TERMINAL)"
        side_effects:
          - "Agreement in status ACTIVE -> TERMINATED; same visit/request cascades as agreement loss"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /v1/facilities/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "status IN {ACTIVE, SUSPENDED, ONBOARDING, PROSPECT} (ERR_FACILITY_ALREADY_TERMINAL)"
        side_effects:
          - "Same as ACTIVE -> TERMINATED"
      - from: ONBOARDING
        to: TERMINATED
        trigger: "POST /v1/facilities/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "status IN {ACTIVE, SUSPENDED, ONBOARDING, PROSPECT} (ERR_FACILITY_ALREADY_TERMINAL)"
        side_effects: []
      - from: PROSPECT
        to: TERMINATED
        trigger: "POST /v1/facilities/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "status IN {ACTIVE, SUSPENDED, ONBOARDING, PROSPECT} (ERR_FACILITY_ALREADY_TERMINAL)"
        side_effects: []

  - entity: FacilityAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_FACILITY_SIGNATURE
        trigger: "POST /v1/facility-agreements/{id}/submit"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT (ERR_AGREEMENT_NOT_DRAFT)"
        side_effects: []
      - from: PENDING_FACILITY_SIGNATURE
        to: PENDING_PROGRAM_SIGNATURE
        trigger: "POST /v1/facility-agreements/{id}/sign-facility"
        actor: FacilityCoordinator
        preconditions:
          - "status == PENDING_FACILITY_SIGNATURE (ERR_AGREEMENT_NOT_AWAITING_FACILITY)"
          - "Acting FacilityCoordinator's facility id == agreement.facility_id (ERR_OWNERSHIP_MISMATCH)"
          - "today <= end_on (ERR_AGREEMENT_TERM_PASSED)"
        side_effects: []
      - from: PENDING_PROGRAM_SIGNATURE
        to: ACTIVE
        trigger: "POST /v1/facility-agreements/{id}/sign-program"
        actor: ProgramAdmin
        preconditions:
          - "status == PENDING_PROGRAM_SIGNATURE (ERR_AGREEMENT_NOT_AWAITING_PROGRAM)"
          - "today <= end_on (ERR_AGREEMENT_TERM_PASSED)"
        side_effects:
          - "Facility ONBOARDING -> ACTIVE (a SUSPENDED facility stays SUSPENDED until reinstated)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /v1/facility-agreements/{id}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "status IN {DRAFT, PENDING_FACILITY_SIGNATURE, PENDING_PROGRAM_SIGNATURE} (ERR_AGREEMENT_NOT_WITHDRAWABLE)"
        side_effects: []
      - from: PENDING_FACILITY_SIGNATURE
        to: WITHDRAWN
        trigger: "POST /v1/facility-agreements/{id}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "status IN {DRAFT, PENDING_FACILITY_SIGNATURE, PENDING_PROGRAM_SIGNATURE} (ERR_AGREEMENT_NOT_WITHDRAWABLE)"
        side_effects: []
      - from: PENDING_PROGRAM_SIGNATURE
        to: WITHDRAWN
        trigger: "POST /v1/facility-agreements/{id}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "status IN {DRAFT, PENDING_FACILITY_SIGNATURE, PENDING_PROGRAM_SIGNATURE} (ERR_AGREEMENT_NOT_WITHDRAWABLE)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /v1/facility-agreements/{id}/terminate"
        actor: ProgramAdmin | FacilityCoordinator
        preconditions:
          - "status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "FacilityCoordinator actor: own facility only (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "terminated_reason set; Facility ACTIVE -> SUSPENDED (agreement-loss cascade per Facility machine)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep (today > end_on)"
        actor: system
        preconditions: []
        side_effects:
          - "Facility ACTIVE -> SUSPENDED (agreement-loss cascade per Facility machine)"

  - entity: OrientationRecord
    initial_state: ASSIGNED
    terminal_states: []
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /v1/orientation-records/{id}/complete"
        actor: FacilityCoordinator
        preconditions:
          - "status == ASSIGNED (ERR_ORIENTATION_NOT_ASSIGNED)"
          - "Acting FacilityCoordinator's facility id == orientation.facility_id (ERR_OWNERSHIP_MISMATCH)"
          - "attended_on <= today (ERR_ORIENTATION_DATE_FUTURE)"
        side_effects:
          - "attended_on set; expires_on = attended_on + 365 days"
      - from: COMPLETED
        to: EXPIRED
        trigger: "system sweep (today > expires_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: ASSIGNED
        trigger: "POST /v1/orientation-records/{id}/reassign"
        actor: FacilityCoordinator
        preconditions:
          - "status == EXPIRED (ERR_ORIENTATION_NOT_EXPIRED)"
          - "Acting FacilityCoordinator's facility id == orientation.facility_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "attended_on, expires_on cleared"

  - entity: InsurancePolicy
    initial_state: PENDING
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /v1/insurance-policies/{id}/verify"
        actor: ProgramAdmin
        preconditions:
          - "status == PENDING (ERR_POLICY_NOT_PENDING)"
          - "effective_from <= today <= effective_until (ERR_POLICY_WINDOW_INVALID)"
          - "No other InsurancePolicy for the same handler with status == ACTIVE (ERR_ACTIVE_POLICY_EXISTS)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep (today > effective_until)"
        actor: system
        preconditions: []
        side_effects:
          - "No cascade: expiry does NOT suspend certifications (unlike cancellation); future gates fail on the missing ACTIVE policy"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /v1/insurance-policies/{id}/cancel"
        actor: Handler | ProgramAdmin
        preconditions:
          - "status IN {PENDING, ACTIVE} (ERR_POLICY_NOT_CANCELLABLE)"
        side_effects:
          - "For each Certification of the handler's teams in status IN {ACTIVE, RENEWAL_DUE}: if no remaining ACTIVE policy with coverage_cents >= 100000000 covering today, that Certification -> SUSPENDED (suspension_reason=INSURANCE_LAPSE)"
          - "Cascade hop 2: each suspended Certification's Team -> SUSPENDED"
          - "Cascade hop 3: each such Team's SCHEDULED Visits -> CANCELLED (cancel_reason=CERT_SUSPENDED); Animal.forward_workload_minutes decremented per cancelled visit"
          - "Cascade hop 4: request-backed cancelled visits return their VisitRequest to OPEN (offer fields cleared)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /v1/insurance-policies/{id}/cancel"
        actor: Handler | ProgramAdmin
        preconditions:
          - "status IN {PENDING, ACTIVE} (ERR_POLICY_NOT_CANCELLABLE)"
        side_effects: []

  - entity: LiabilityWaiver
    initial_state: SIGNED
    terminal_states: [VOIDED]
    transitions:
      - from: SIGNED
        to: VOIDED
        trigger: "POST /v1/liability-waivers/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "status == SIGNED (ERR_WAIVER_NOT_SIGNED)"
        side_effects:
          - "No retroactive effect on existing SCHEDULED visits; new visit creation requiring this waiver version is blocked (ERR_WAIVER_NOT_ON_FILE)"

  - entity: VisitRequest
    initial_state: OPEN
    terminal_states: [FULFILLED, WITHDRAWN, EXPIRED]
    transitions:
      - from: OPEN
        to: OFFERED
        trigger: "POST /v1/visit-requests/{id}/offers"
        actor: ProgramAdmin
        preconditions:
          - "status == OPEN (ERR_REQUEST_NOT_OPEN)"
          - "OCC: expected_visit_request_version must equal request.version (ERR_STALE_VERSION)"
          - "Team eligibility per team_match_score eligibility filter (ERR_TEAM_NOT_ELIGIBLE)"
        side_effects:
          - "offered_team_id = payload team_id; offered_at = now; offer_expires_at = now + 72 hours"
          - "increments VisitRequest.version by 1"
      - from: OFFERED
        to: OPEN
        trigger: "POST /v1/visit-requests/{id}/decline OR system sweep (now > offer_expires_at)"
        actor: Handler | system
        preconditions:
          - "status == OFFERED (ERR_REQUEST_NOT_OFFERED)"
          - "Handler actor must own offered_team_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "offered_team_id/offered_at/offer_expires_at cleared; decline_count += 1 for handler decline only (sweep does NOT increment)"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /v1/visit-requests/{id}/accept"
        actor: Handler
        preconditions:
          - "status == OFFERED (ERR_REQUEST_NOT_OFFERED)"
          - "Handler actor must own offered_team_id (ERR_OWNERSHIP_MISMATCH)"
          - "now <= offer_expires_at (ERR_OFFER_EXPIRED)"
          - "All visit-creation gates re-validated against the requested window (safety/referential/temporal/fiscal/constraint chain of POST /v1/visits)"
        side_effects:
          - "Creates Visit (team_id=offered_team_id, facility_id=request.facility_id, request_id=request.id, scheduled_start=requested_start, scheduled_end=requested_end, lifecycle_status=SCHEDULED, verification_status=UNVERIFIED)"
          - "increments Team.version by 1; Animal.forward_workload_minutes incremented per welfare_workload_minutes FORWARD_LOOKING variant"
      - from: ACCEPTED
        to: FULFILLED
        trigger: "system (bubble-up when the backed Visit transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "fulfilled_on = today"
      - from: ACCEPTED
        to: OPEN
        trigger: "system (compensation when the backed Visit transitions to CANCELLED or NO_SHOW)"
        actor: system
        preconditions: []
        side_effects:
          - "offer fields cleared; request_id linkage retained on the visit"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /v1/visit-requests/{id}/withdraw OR system (agreement-loss cascade)"
        actor: FacilityCoordinator | system
        preconditions:
          - "status IN {OPEN, OFFERED} (ERR_REQUEST_NOT_WITHDRAWABLE)"
          - "FacilityCoordinator actor: own facility only (ERR_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /v1/visit-requests/{id}/withdraw OR system (agreement-loss cascade)"
        actor: FacilityCoordinator | system
        preconditions:
          - "status IN {OPEN, OFFERED} (ERR_REQUEST_NOT_WITHDRAWABLE)"
          - "FacilityCoordinator actor: own facility only (ERR_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: OPEN
        to: EXPIRED
        trigger: "system sweep (requested_end < now while still OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "expired_on = today; feeds unmet_demand_index"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /v1/visits/{id}/check-in"
        actor: Handler
        preconditions:
          - "lifecycle_status == SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
          - "Handler actor must own the visit's team (ERR_OWNERSHIP_MISMATCH)"
          - "Safety: animal of the team NOT in WELFARE_HOLD (ERR_ANIMAL_WELFARE_HOLD)"
          - "Referential: certification of the team in status IN {ACTIVE, RENEWAL_DUE} (ERR_CERT_NOT_ACTIVE)"
          - "Temporal: now >= scheduled_start - 15 minutes (ERR_CHECKIN_TOO_EARLY) AND now <= scheduled_end (ERR_CHECKIN_WINDOW_PASSED)"
        side_effects:
          - "actual_start = now"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /v1/visits/{id}/check-out"
        actor: Handler
        preconditions:
          - "lifecycle_status == IN_PROGRESS (ERR_VISIT_NOT_IN_PROGRESS)"
          - "Handler actor must own the visit's team (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "actual_end = now; actual_minutes = floor((actual_end - actual_start)/60s)"
          - "Posts HourCredit PROVISIONAL = scheduled_minutes per visit_credit_minutes PROVISIONAL variant; Handler.lifetime_minutes and recognition_tier recomputed"
          - "Animal.welfare_blocked_until = actual_end + rest_requirement_minutes(actual_minutes)"
          - "Animal.audit_workload_minutes / forward_workload_minutes recomputed per welfare_workload_minutes variants"
          - "If request-backed: VisitRequest ACCEPTED -> FULFILLED (fulfilled_on = today)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/visits/{id}/cancel OR system (certification suspension/revocation, handler retirement, agreement loss)"
        actor: Handler | ProgramAdmin | FacilityCoordinator | system
        preconditions:
          - "lifecycle_status == SCHEDULED (ERR_VISIT_NOT_CANCELLABLE)"
          - "Ownership: Handler must own team; FacilityCoordinator must own facility (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "cancelled_at = now; cancel_reason mapped from actor (HANDLER_CANCEL | ADMIN_CANCEL | FACILITY_CANCEL) or system cause"
          - "Animal.forward_workload_minutes decremented by this visit's scheduled minutes (compensation of the scheduling increment)"
          - "Handler-initiated only: late_cancel_penalty applied to Team.late_cancel_count; at >= 3 the team's Certification (ACTIVE|RENEWAL_DUE) -> SUSPENDED (reason=LATE_CANCELLATIONS) and the counter resets to 0"
          - "If request-backed: VisitRequest ACCEPTED -> OPEN (offer fields cleared)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system sweep (now > scheduled_end + 30 minutes and lifecycle_status still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "Team.no_show_count += 1; Animal.forward_workload_minutes decremented; request-backed VisitRequest ACCEPTED -> OPEN"

  - entity: VisitVerification
    initial_state: UNVERIFIED
    terminal_states: [VERIFIED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /v1/visits/{id}/verify"
        actor: FacilityCoordinator
        preconditions:
          - "lifecycle_status == COMPLETED (ERR_VISIT_NOT_COMPLETED)"
          - "verification_status == UNVERIFIED (ERR_VISIT_ALREADY_RESOLVED)"
          - "FacilityCoordinator actor must own the visit's facility (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "verified_at = now; posts HourCredit REVERSAL = -(provisional amount) then FINAL = round_half_up(min(actual_minutes, scheduled_minutes, effective_cap_minutes)/15)*15 per visit_credit_minutes FINAL variant; Handler.lifetime_minutes and recognition_tier recomputed"
      - from: UNVERIFIED
        to: DISPUTED
        trigger: "POST /v1/visits/{id}/dispute"
        actor: FacilityCoordinator
        preconditions:
          - "lifecycle_status == COMPLETED (ERR_VISIT_NOT_COMPLETED)"
          - "verification_status == UNVERIFIED (ERR_VISIT_ALREADY_RESOLVED)"
        side_effects: []
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /v1/visits/{id}/resolve-dispute"
        actor: ComplianceOfficer
        preconditions:
          - "verification_status == DISPUTED (ERR_VISIT_NOT_DISPUTED)"
          - "0 <= approved_minutes <= scheduled_minutes (ERR_INVALID_REQUEST)"
        side_effects:
          - "approved_minutes, verified_at set; posts REVERSAL = -(provisional) then FINAL = round_half_up(min(approved_minutes, scheduled_minutes, effective_cap_minutes)/15)*15; Handler.lifetime_minutes and recognition_tier recomputed"
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "system sweep (COMPLETED and now > actual_end + 14 days; deemed verified)"
        actor: system
        preconditions: []
        side_effects:
          - "Same credit reconciliation as manual verify (FINAL computed from actual_minutes)"

  - entity: IncidentReport
    initial_state: FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /v1/incident-reports/{id}/triage"
        actor: ComplianceOfficer
        preconditions:
          - "status == FILED (ERR_INCIDENT_NOT_FILED)"
        side_effects:
          - "triaged_by = X-User-ID"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /v1/incident-reports/{id}/escalate"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW (ERR_INCIDENT_NOT_UNDER_REVIEW)"
        side_effects:
          - "Cascade hop 1: Animal of the visit's team (status ACTIVE) -> WELFARE_HOLD with welfare_hold_until = now + 14 days, welfare_hold_reason=INCIDENT_PRECAUTION"
          - "Cascade hop 2: that team's Certification in status IN {ACTIVE, RENEWAL_DUE} -> SUSPENDED (suspension_reason=INCIDENT_PRECAUTION)"
          - "Cascade hop 3: Team -> SUSPENDED; every SCHEDULED Visit of the team -> CANCELLED (cancel_reason=INCIDENT_PRECAUTION); Animal.forward_workload_minutes decremented per cancelled visit"
          - "Cascade hop 4: request-backed cancelled visits return their VisitRequest to OPEN (offer fields cleared)"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /v1/incident-reports/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {UNDER_REVIEW, ESCALATED} (ERR_INCIDENT_NOT_RESOLVABLE)"
          - "Segregation of duties: X-User-ID != triaged_by (ERR_SOD_VIOLATION)"
          - "resolution_code == SUSPENSION requires suspension_days 1..365 (ERR_INVALID_REQUEST)"
        side_effects:
          - "resolved_by = X-User-ID; resolution_code set"
          - "NO_ACTION: precaution holds released — Animal WELFARE_HOLD(reason=INCIDENT_PRECAUTION) -> ACTIVE; Certification SUSPENDED(reason=INCIDENT_PRECAUTION) -> ACTIVE (no gate re-check on this release); cancelled visits are NOT restored"
          - "WARNING: same release as NO_ACTION plus Team.warning_count += 1"
          - "SUSPENSION: Certification -> SUSPENDED (reason=INCIDENT_SUSPENSION, suspension_until = today + suspension_days); Animal hold extended to today + suspension_days"
          - "REVOCATION: Certification -> REVOKED; Team -> DISSOLVED; remaining SCHEDULED Visits -> CANCELLED (cancel_reason=CERT_REVOKED); Animal WELFARE_HOLD -> ACTIVE"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /v1/incident-reports/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {UNDER_REVIEW, ESCALATED} (ERR_INCIDENT_NOT_RESOLVABLE)"
          - "Segregation of duties: X-User-ID != triaged_by (ERR_SOD_VIOLATION)"
        side_effects:
          - "Same resolution-code side effects as UNDER_REVIEW -> RESOLVED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-request
    parent_entity: VisitRequest
    write_endpoint: "POST /v1/visit-requests/{id}/offers"
    occ_field: "expected_visit_request_version"
    description: |
      Creating an offer against a VisitRequest whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just modified the request (e.g., created an
      offer, or a decline cycled it back to OPEN clearing offer fields) and
      the current writer's view of the request is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: visit-create-stale-team
    parent_entity: Team
    write_endpoint: "POST /v1/visits"
    occ_field: "expected_team_version"
    description: |
      Creating a Visit against a Team whose version has advanced since the
      client last observed it is rejected. This captures the case where
      another writer has just booked a visit for the team (which legitimately
      mutates the team's workload bookkeeping) and the current writer's view
      of the team is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: visit_credit_minutes
    trigger: "Visit check-out (PROVISIONAL variant); visit verify / resolve-dispute / deemed-verified sweep (FINAL variant)"
    algorithm: aggregation
    formula: |
      scheduled_minutes = (scheduled_end - scheduled_start) in whole minutes
      actual_minutes    = floor((actual_end - actual_start) in seconds / 60)
      effective_cap_minutes = min(facility.max_visit_minutes,
                                  agreement.agreed_max_visit_minutes, 120)
      PROVISIONAL variant: credit = scheduled_minutes            (unrounded)
      FINAL variant:       credit = round_half_up(min(actual_minutes,
                                  scheduled_minutes,
                                  effective_cap_minutes) / 15) * 15
      Verification reconciliation: post REVERSAL = -(PROVISIONAL amount),
      then post FINAL; net lifetime change from the full cycle == FINAL.
    input_set: "The single Visit; facility = visit.facility_id; agreement = the FacilityAgreement with status == ACTIVE covering the visit's scheduled date"
    constants:
      PROGRAM_CAP_MINUTES: 120
      ROUND_UNIT_MINUTES: 15
    precision: "integer minutes; round_half_up to the nearest 15-minute unit for FINAL only"
    variants:
      - name: PROVISIONAL
        when: "Posted at check-out; optimistic credit equal to scheduled_minutes regardless of actual duration"
        difference: "Ignores actual_minutes and the effective cap; unrounded"
      - name: FINAL
        when: "Posted at verification (manual, dispute resolution, or deemed-verified sweep)"
        difference: "Clamped by actual_minutes, scheduled_minutes, and effective_cap_minutes; rounded to 15-minute units; provisional reversed"

  - name: welfare_workload_minutes
    trigger: "Visit create/accept (gate, FORWARD_LOOKING), visit check-out / cancel / no-show (recompute), Animal read (both computed fields)"
    algorithm: forward_looking
    formula: |
      Window (FORWARD_LOOKING): [now - 7 days, now + 7 days)
        include visits of the animal's teams with lifecycle_status IN
        {SCHEDULED, IN_PROGRESS} at their scheduled minutes, plus
        lifecycle_status == COMPLETED at their actual_minutes.
      Window (AUDIT): actual_end within [now - 7 days, now] (closed at now)
        include only lifecycle_status == COMPLETED at actual_minutes.
      Gate: FORWARD_LOOKING(existing) + new visit's scheduled minutes <= 240
            else ERR_WORKLOAD_LIMIT_EXCEEDED (equality allowed).
    input_set: "All Visit rows whose team's animal_id == animal.id; status filters per variant above; CANCELLED and NO_SHOW visits excluded from both variants"
    constants:
      WORKLOAD_FORWARD_CAP_MINUTES: 240
      WINDOW_PAST_DAYS: 7
      WINDOW_FUTURE_DAYS: 7
    precision: "integer minutes, no rounding"
    variants:
      - name: FORWARD_LOOKING
        when: "Scheduling gate at visit create / request accept; Animal.forward_workload_minutes"
        difference: "Includes SCHEDULED and IN_PROGRESS visits at scheduled minutes over [now-7d, now+7d)"
      - name: AUDIT
        when: "Welfare reporting; Animal.audit_workload_minutes"
        difference: "COMPLETED visits only at actual_minutes over [now-7d, now] (closed at now); a SCHEDULED-heavy animal shows a higher FORWARD than AUDIT value"

  - name: recognition_lifetime_and_tier
    trigger: "Any HourCredit row posted (provisional, final, reversal, adjustment)"
    algorithm: threshold
    formula: |
      Rounding order is PINNED: each FINAL credit is rounded to 15-minute
      units (round_half_up) AT POSTING TIME; the lifetime total then sums
      the already-rounded entries. (Sum-then-round yields different totals
      and is NOT used.)
      lifetime_minutes = sum(minutes over ALL HourCredit rows of the handler:
        PROVISIONAL + FINAL + REVERSAL + ADJUSTMENT); floor at 0
        (a posting that would take it below 0 -> ERR_INVALID_ADJUSTMENT).
      lifetime_hours = lifetime_minutes / 60 (display 2dp, round_half_up)
      recognition_tier = highest tier whose threshold <= lifetime_minutes:
        NONE < 1500; BRONZE >= 1500; SILVER >= 6000; GOLD >= 15000;
        PLATINUM >= 30000  (>= inclusive at exact boundary)
    input_set: "All HourCredit rows with handler_id == handler.id (no time window)"
    constants:
      BRONZE_MINUTES: 1500
      SILVER_MINUTES: 6000
      GOLD_MINUTES: 15000
      PLATINUM_MINUTES: 30000
    precision: "integer minutes; hours display 2 decimal places, round_half_up"

  - name: team_match_score
    trigger: "GET /v1/visit-requests/{id}/candidate-teams"
    algorithm: weighted_scoring
    formula: |
      eligibility filter (candidate set):
        team.status == ACTIVE AND handler.status == ACTIVE
        AND animal.status == ACTIVE AND animal.welfare_hold_until IS NULL
        AND certification.status == ACTIVE
        AND SIGNED LiabilityWaiver (team, facility,
             waiver_version == facility.required_waiver_version) exists
        AND OrientationRecord (team, facility) status == COMPLETED
             AND expires_on >= today
        AND policy adequate per insurance_adequacy_requirement
        AND NOT (facility.facility_type == NURSING_HOME
             AND handler.recognition_tier == NONE)
      score inputs:
        exp        = min(floor((today - handler.volunteer_since)/365d) * 5, 40)
        species    = 25 if animal.species == request.species_preference
                     else 10 if request.species_preference IS NULL else 0
        recency    = 20 - 2*floor(days_since_last_verified_visit_to_facility/7)
                     clamped to [0, 20]; 0 if the team has never had a
                     VERIFIED visit at this facility
        penalty    = min(floor(animal.forward_workload_minutes / 10), 30)
        subtotal   = exp + species + recency - penalty
        multiplier = 1.5 URGENT / 1.2 HIGH / 1.0 ROUTINE
        score      = round_half_up(subtotal * multiplier, 2)
      ranking: score DESC; tie-break team.created_at ASC
      empty candidate set -> empty array (HTTP 200, NOT an error)
    input_set: "All Team rows passing the eligibility filter; recency looks at Visit rows of the team at the request's facility with verification_status == VERIFIED, taking the latest verified_at"
    constants:
      EXP_POINTS_PER_YEAR: 5
      EXP_CAP: 40
      SPECIES_MATCH: 25
      SPECIES_OPEN: 10
      RECENCY_MAX: 20
      RECENCY_DECAY_PER_WEEK: 2
      PENALTY_PER_10_MIN: 1
      PENALTY_CAP: 30
      MULT_URGENT: 1.5
      MULT_HIGH: 1.2
      MULT_ROUTINE: 1.0
    precision: "2 decimal places, round_half_up"

  - name: evaluation_composite
    trigger: "POST /v1/evaluations/{id}/score"
    algorithm: weighted_scoring
    formula: |
      composite = round_half_up(0.6 * aptitude_score + 0.4 * obedience_score, 2)
      attempt_number == 1: PASS iff aptitude >= 70 AND obedience >= 70
                           AND composite >= 75.0
      attempt_number >= 2: PASS iff aptitude >= 70 AND obedience >= 70
                           AND composite >= 80.0  (higher bar on retake)
      PASS routes Evaluation -> PASSED, otherwise -> FAILED.
    input_set: "The single Evaluation's aptitude_score, obedience_score, attempt_number"
    constants:
      SECTION_FLOOR: 70
      PASS_COMPOSITE_FIRST: 75.0
      PASS_COMPOSITE_RETAKE: 80.0
      W_APTITUDE: 0.6
      W_OBEDIENCE: 0.4
    precision: "2 decimal places, round_half_up"

  - name: rest_requirement_minutes
    trigger: "Visit check-out (sets Animal.welfare_blocked_until); visit create/accept (gate: scheduled_start >= welfare_blocked_until else ERR_ANIMAL_REST_PERIOD; equality allowed)"
    algorithm: threshold
    formula: |
      by actual_minutes of the completed visit:
        actual_minutes <= 30            -> 60 minutes rest
        31 <= actual_minutes <= 60      -> 120 minutes rest
        actual_minutes >= 61            -> 240 minutes rest
      welfare_blocked_until = actual_end + rest minutes
    input_set: "The completed Visit's actual_minutes"
    constants:
      REST_TIER1_MAX: 30
      REST_TIER1_MINUTES: 60
      REST_TIER2_MAX: 60
      REST_TIER2_MINUTES: 120
      REST_TIER3_MINUTES: 240
    precision: "integer minutes"

  - name: insurance_adequacy_requirement
    trigger: "Visit create/accept (facility-specific), certification activate/renew/reinstate (program floor), candidate-teams eligibility"
    algorithm: tiered_pricing
    formula: |
      Facility-specific (visit gates):
        base = max(100000000, facility.min_liability_coverage_cents)
        required_cents = round_half_up(base * 1.5, 0) if facility_type == HOSPITAL
                         else base
      Certification-level (activate/renew/reinstate):
        required_cents = 100000000
      Adequate iff EXISTS InsurancePolicy of the team's handler with
      status == ACTIVE AND effective_from <= today <= effective_until
      AND coverage_cents >= required_cents (>= inclusive at exact boundary).
      Missing policy -> ERR_NO_ACTIVE_INSURANCE; present but short ->
      ERR_INSURANCE_COVERAGE_INADEQUATE.
    input_set: "InsurancePolicy rows with handler_id == team's handler and status == ACTIVE"
    constants:
      PROGRAM_FLOOR_CENTS: 100000000
      HOSPITAL_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up on the multiplier"

  - name: certification_renewal_window
    trigger: "POST /v1/certifications/{id}/renew; sweep marking RENEWAL_DUE / EXPIRED"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency is PINNED to this evaluation order:
        (1) eligibility visit count = visits of the team with
            lifecycle_status == COMPLETED AND verification_status == VERIFIED
            AND actual_end date within [activated_on, expires_on_OLD]
            where expires_on_OLD is the pre-renewal value;
        (2) new expires_on = max(today, expires_on_OLD) + 730 days
            (an on-time renewal therefore extends from the OLD expiry and
            loses no days; a late renewal extends from today);
        (3) renewal_count += 1.
      Windows: RENEWAL_DUE when expires_on - 60d <= today <= expires_on;
      EXPIRED when today > expires_on; late renewal allowed while
      today <= expires_on + 90 days (inclusive), else
      ERR_RENEWAL_WINDOW_CLOSED.
    input_set: "The Certification row; Visit rows of the team per step (1)"
    constants:
      CERT_PERIOD_DAYS: 730
      RENEWAL_DUE_DAYS_BEFORE: 60
      LATE_RENEWAL_GRACE_DAYS: 90
      RENEWAL_MIN_VERIFIED_VISITS: 6
    precision: "whole days (ISO dates)"

  - name: late_cancel_penalty
    trigger: "Handler-initiated visit cancellation"
    algorithm: threshold
    formula: |
      hours_notice = (scheduled_start - now) in hours (fractional, floor to
      whole hours for tier selection):
        hours_notice >= 48          -> +0
        24 <= hours_notice < 48     -> +1
        hours_notice < 24           -> +2
      team.late_cancel_count += tier points; if late_cancel_count >= 3:
        team's Certification in {ACTIVE, RENEWAL_DUE} -> SUSPENDED
        (reason=LATE_CANCELLATIONS, suspension_until=null) and
        late_cancel_count resets to 0.
    input_set: "The cancelled Visit (scheduled_start, cancelled_at), the Team"
    constants:
      TIER_FULL_NOTICE_HOURS: 48
      TIER_LOW_NOTICE_HOURS: 24
      TIER_LOW_POINTS: 1
      TIER_LATE_POINTS: 2
      SUSPENSION_THRESHOLD: 3
    precision: "whole hours (floor)"

  - name: visit_duration_cap
    trigger: "Visit create / request accept; request create (generic 30..120 check only)"
    algorithm: threshold
    formula: |
      duration = scheduled_end - scheduled_start in whole minutes
      duration < 30 -> ERR_VISIT_DURATION_INVALID
      effective_cap = min(facility.max_visit_minutes,
                          agreement.agreed_max_visit_minutes, 120)
      duration > effective_cap -> ERR_VISIT_DURATION_EXCEEDS_CAP
      (equality with the cap is allowed: duration <= effective_cap passes)
    input_set: "Visit payload; Facility row; ACTIVE FacilityAgreement covering the scheduled date"
    constants:
      MIN_VISIT_MINUTES: 30
      PROGRAM_CAP_MINUTES: 120
    precision: "integer minutes"

  - name: unmet_demand_index
    trigger: "GET /v1/facilities/{id}/demand-summary"
    algorithm: aggregation
    formula: |
      open_request_count = count(VisitRequest of facility with status IN
        {OPEN, OFFERED})
      expired_last_90d   = count(status == EXPIRED AND
        expired_on >= today - 90 days)
      fulfilled_last_90d = count(status == FULFILLED AND
        fulfilled_on >= today - 90 days)
      unmet_demand_index = open_request_count + expired_last_90d
      Boundary: expired_on exactly today - 90 days is included (>=).
    input_set: "VisitRequest rows with facility_id == facility.id; status filters as above"
    constants:
      DEMAND_WINDOW_DAYS: 90
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership: entity-backed actor matches the resource owner (Handler owns animal/team/visit team; Evaluator is the assigned evaluator; FacilityCoordinator owns the facility of the target resource)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all endpoints acting on owned resources"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: business_constraint
    check: "Request body schema: required fields present, types match, enum values valid, unknown fields rejected, string minimums (incident description >= 10 chars), date sanity (start < end, effective_from <= effective_until)"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_ENUM_VALUE"
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/visit-requests/{id}/offers, POST /v1/visits"
  - priority: 7
    category: state
    check: "Target resource state permits the transition (per §1.2 preconditions); for POST /v1/visits this covers team.status == ACTIVE (ERR_TEAM_NOT_ACTIVE), facility.status == ACTIVE (ERR_FACILITY_NOT_ACTIVE), animal.status == ACTIVE (ERR_ANIMAL_NOT_ACTIVE); for POST /v1/evaluations: handler.status == ACTIVE (ERR_HANDLER_NOT_ACTIVE) and team.status == FORMING (ERR_TEAM_NOT_FORMING); for POST /v1/certifications: team.status == FORMING (ERR_TEAM_NOT_FORMING), the referenced evaluation is PASSED (ERR_EVALUATION_NOT_PASSED) and belongs to the same team (ERR_EVALUATION_TEAM_MISMATCH)"
    error_id: "ERR_*_NOT_* state errors"
    http_status: 409
    applies_to: "all state-transition and gated-creation endpoints"
  - priority: 8
    category: business_safety
    check: "Animal welfare and biosafety: animal not in WELFARE_HOLD (ERR_ANIMAL_WELFARE_HOLD), rest block satisfied (ERR_ANIMAL_REST_PERIOD), forward workload cap (ERR_WORKLOAD_LIMIT_EXCEEDED), daily visit limit (ERR_DAILY_VISIT_LIMIT_EXCEEDED), species permitted at facility (ERR_SPECIES_NOT_PERMITTED), RABIES vaccination VALID covering the relevant date (ERR_VACCINATION_MISSING / ERR_VACCINATION_EXPIRED)"
    error_id: "ERR_ANIMAL_WELFARE_HOLD | ERR_ANIMAL_REST_PERIOD | ERR_WORKLOAD_LIMIT_EXCEEDED | ERR_DAILY_VISIT_LIMIT_EXCEEDED | ERR_SPECIES_NOT_PERMITTED | ERR_VACCINATION_MISSING | ERR_VACCINATION_EXPIRED"
    http_status: 403
    applies_to: "POST /v1/visits, request accept, certification activate/renew/reinstate, visit check-in (hold only)"
  - priority: 9
    category: business_referential
    check: "Cross-entity references: certification ACTIVE|RENEWAL_DUE (ERR_CERT_NOT_ACTIVE), ACTIVE FacilityAgreement covering the scheduled date (ERR_NO_ACTIVE_AGREEMENT), orientation COMPLETED and unexpired (ERR_ORIENTATION_NOT_COMPLETED), SIGNED waiver matching facility.required_waiver_version (ERR_WAIVER_NOT_ON_FILE)"
    error_id: "ERR_CERT_NOT_ACTIVE | ERR_NO_ACTIVE_AGREEMENT | ERR_ORIENTATION_NOT_COMPLETED | ERR_WAIVER_NOT_ON_FILE"
    http_status: 409
    applies_to: "POST /v1/visits, request accept, visit check-in (cert), facility reinstate (agreement)"
  - priority: 10
    category: business_temporal
    check: "Temporal window rules: scheduled_start in future (ERR_VISIT_IN_PAST), team half-open interval overlap (ERR_TEAM_SCHEDULING_CONFLICT), evaluator buffered overlap (ERR_EVALUATOR_SCHEDULING_CONFLICT), evaluation schedule in past (ERR_EVALUATION_SCHEDULE_IN_PAST), check-in window (ERR_CHECKIN_TOO_EARLY / ERR_CHECKIN_WINDOW_PASSED), offer expiry (ERR_OFFER_EXPIRED), appeal window (ERR_EVALUATION_APPEAL_WINDOW_CLOSED), renewal window (ERR_RENEWAL_WINDOW_CLOSED)"
    error_id: "ERR_VISIT_IN_PAST | ERR_TEAM_SCHEDULING_CONFLICT | ERR_EVALUATOR_SCHEDULING_CONFLICT | ERR_EVALUATION_SCHEDULE_IN_PAST | ERR_CHECKIN_TOO_EARLY | ERR_CHECKIN_WINDOW_PASSED | ERR_OFFER_EXPIRED | ERR_EVALUATION_APPEAL_WINDOW_CLOSED | ERR_RENEWAL_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /v1/visits, schedule/score/check-in/accept/appeal/renew endpoints"
  - priority: 11
    category: business_fiscal
    check: "Insurance adequacy: ACTIVE policy exists covering today (ERR_NO_ACTIVE_INSURANCE); coverage meets insurance_adequacy_requirement (ERR_INSURANCE_COVERAGE_INADEQUATE)"
    error_id: "ERR_NO_ACTIVE_INSURANCE | ERR_INSURANCE_COVERAGE_INADEQUATE"
    http_status: 402
    applies_to: "POST /v1/visits, request accept, certification activate/renew/reinstate, candidate-teams eligibility"
  - priority: 12
    category: business_constraint
    check: "Capacity/uniqueness/minimums: duration cap (ERR_VISIT_DURATION_EXCEEDS_CAP), facility overlap capacity (ERR_FACILITY_CAPACITY_EXCEEDED), weekly cap (ERR_FACILITY_WEEKLY_CAP_EXCEEDED), evaluator daily cap (ERR_EVALUATOR_DAILY_CAP_EXCEEDED), one non-terminal certification per team (ERR_ACTIVE_CERTIFICATION_EXISTS), one ACTIVE policy per handler (ERR_ACTIVE_POLICY_EXISTS), one SIGNED waiver per (team,facility,version) (ERR_WAIVER_ALREADY_EXISTS), one non-DISSOLVED team per animal (ERR_ACTIVE_TEAM_EXISTS), one non-terminal agreement per facility in {DRAFT, PENDING_FACILITY_SIGNATURE, PENDING_PROGRAM_SIGNATURE, ACTIVE} (ERR_ACTIVE_AGREEMENT_EXISTS), renewal visit minimum (ERR_RENEWAL_VISIT_MINIMUM_NOT_MET), offer eligibility (ERR_TEAM_NOT_ELIGIBLE), adjustment floor (ERR_INVALID_ADJUSTMENT)"
    error_id: "ERR_VISIT_DURATION_EXCEEDS_CAP | ERR_FACILITY_CAPACITY_EXCEEDED | ERR_FACILITY_WEEKLY_CAP_EXCEEDED | ERR_EVALUATOR_DAILY_CAP_EXCEEDED | ERR_ACTIVE_CERTIFICATION_EXISTS | ERR_ACTIVE_POLICY_EXISTS | ERR_WAIVER_ALREADY_EXISTS | ERR_ACTIVE_TEAM_EXISTS | ERR_RENEWAL_VISIT_MINIMUM_NOT_MET | ERR_TEAM_NOT_ELIGIBLE | ERR_INVALID_ADJUSTMENT"
    http_status: 422
    applies_to: "creation and gate endpoints as listed"
  - priority: 13
    category: business_constraint
    check: "Segregation of duties: incident resolver must differ from triager"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /v1/incident-reports/{id}/resolve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving / logical clock ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). The server starts with the logical clock fixed at 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly that default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []
  - method: POST
    path: "/v1/_sweeps/run"
    description: "Run all deterministic time-based transitions against the logical clock: evaluation request/appeal expiry, certification RENEWAL_DUE/EXPIRED, vaccination EXPIRED, policy EXPIRED, orientation EXPIRED, agreement EXPIRED (with facility cascade), request offer-expiry and request EXPIRED, visit NO_SHOW, deemed-verified, welfare-hold auto-release."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { evaluations_expired: integer, certifications_marked_renewal_due: integer, certifications_expired: integer, vaccinations_expired: integer, policies_expired: integer, orientations_expired: integer, agreements_expired: integer, offers_expired: integer, requests_expired: integer, visits_marked_no_show: integer, visits_deemed_verified: integer, welfare_holds_released: integer }
    side_effects: ["Applies every §1.2 'system sweep' transition in pinned order: offers-expiry, request-expiry, evaluation-expiry, vaccination/policy/orientation expiry, certification renewal-due then expiry, agreement expiry cascade, visit no-show, deemed-verified, welfare-hold release"]

  # --- Handlers ---
  - method: POST
    path: "/v1/handlers"
    description: "Self-register a handler (status APPLICANT)"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, region_code, volunteer_since, "phone?"]
    output: Handler
    side_effects: ["status=APPLICANT, lifetime_minutes=0, recognition_tier=NONE"]
  - method: GET
    path: "/v1/handlers/{id}"
    description: "Get a handler"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Handler
    side_effects: []
  - method: GET
    path: "/v1/handlers"
    description: "List handlers"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["status?", "recognition_tier?", "limit?", "offset?"]
    output: "Handler[]"
    side_effects: []
  - method: POST
    path: "/v1/handlers/{id}/approve"
    description: "Approve an applicant handler"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Handler
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/v1/handlers/{id}/reject"
    description: "Reject an applicant handler"
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: Handler
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/v1/handlers/{id}/suspend"
    description: "Suspend a handler (compliance)"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Handler
    side_effects: ["status -> SUSPENDED; suspension_reason set"]
  - method: POST
    path: "/v1/handlers/{id}/reinstate"
    description: "Reinstate a suspended handler"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Handler
    side_effects: ["status SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/v1/handlers/{id}/retire"
    description: "Retire a handler; cascades teams to DISSOLVED and cancels their SCHEDULED visits"
    roles: [Handler, ProgramAdmin]
    code: 200
    input: []
    output: Handler
    side_effects: ["status -> RETIRED", "teams DISSOLVED cascade", "SCHEDULED visits CANCELLED (TEAM_DISSOLVED); request-backed requests return to OPEN; forward workload decremented"]
  - method: GET
    path: "/v1/handlers/{id}/recognition"
    description: "Computed recognition summary for a handler"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: { handler_id: string, lifetime_minutes: integer, lifetime_hours: number, recognition_tier: string, next_tier: string, minutes_to_next_tier: integer }
    side_effects: []

  # --- Animals ---
  - method: POST
    path: "/v1/animals"
    description: "Register an animal for the acting handler"
    roles: [Handler]
    code: 201
    input: [name, species, breed, date_of_birth]
    output: Animal
    side_effects: ["status=REGISTERED; handler_id from X-User-ID"]
  - method: GET
    path: "/v1/animals/{id}"
    description: "Get an animal"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Animal
    side_effects: []
  - method: GET
    path: "/v1/animals"
    description: "List animals"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["handler_id?", "status?", "species?", "limit?", "offset?"]
    output: "Animal[]"
    side_effects: []
  - method: POST
    path: "/v1/animals/{id}/retire"
    description: "Retire an animal (owner handler only)"
    roles: [Handler]
    code: 200
    input: []
    output: Animal
    side_effects: ["status -> RETIRED"]
  - method: POST
    path: "/v1/animals/{id}/welfare-hold"
    description: "Place an ACTIVE animal on welfare hold"
    roles: [ComplianceOfficer]
    code: 200
    input: [hold_until, reason]
    output: Animal
    side_effects: ["status -> WELFARE_HOLD; welfare_hold_until=hold_until; welfare_hold_reason=MANUAL"]
  - method: POST
    path: "/v1/animals/{id}/welfare-release"
    description: "Release an animal from welfare hold"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Animal
    side_effects: ["status WELFARE_HOLD -> ACTIVE; hold fields cleared"]

  # --- Vaccination records ---
  - method: POST
    path: "/v1/vaccination-records"
    description: "Record a vaccination for an owned animal"
    roles: [Handler]
    code: 201
    input: [animal_id, vaccine_type, administered_on, valid_until, veterinarian_name, "clinic_name?"]
    output: VaccinationRecord
    side_effects: ["status=VALID"]
  - method: GET
    path: "/v1/vaccination-records/{id}"
    description: "Get a vaccination record"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: VaccinationRecord
    side_effects: []
  - method: GET
    path: "/v1/vaccination-records"
    description: "List vaccination records"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["animal_id?", "status?", "vaccine_type?", "limit?", "offset?"]
    output: "VaccinationRecord[]"
    side_effects: []
  - method: POST
    path: "/v1/vaccination-records/{id}/void"
    description: "Void a vaccination record"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: VaccinationRecord
    side_effects: ["status VALID -> VOIDED"]

  # --- Teams ---
  - method: POST
    path: "/v1/teams"
    description: "Form a team from an owned animal (one non-DISSOLVED team per animal)"
    roles: [Handler]
    code: 201
    input: [animal_id, team_name]
    output: Team
    side_effects: ["status=FORMING; handler_id from X-User-ID"]
  - method: GET
    path: "/v1/teams/{id}"
    description: "Get a team"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Team
    side_effects: []
  - method: GET
    path: "/v1/teams"
    description: "List teams"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["handler_id?", "animal_id?", "status?", "limit?", "offset?"]
    output: "Team[]"
    side_effects: []
  - method: POST
    path: "/v1/teams/{id}/dissolve"
    description: "Dissolve a team (no SCHEDULED/IN_PROGRESS visits; no non-terminal certification)"
    roles: [Handler]
    code: 200
    input: []
    output: Team
    side_effects: ["status -> DISSOLVED"]

  # --- Evaluators ---
  - method: POST
    path: "/v1/evaluators"
    description: "Create an evaluator"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email, region_code, specializations, "max_evaluations_per_day?"]
    output: Evaluator
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/v1/evaluators/{id}"
    description: "Get an evaluator"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Evaluator
    side_effects: []
  - method: GET
    path: "/v1/evaluators"
    description: "List evaluators"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["status?", "region_code?", "limit?", "offset?"]
    output: "Evaluator[]"
    side_effects: []
  - method: PATCH
    path: "/v1/evaluators/{id}"
    description: "Update evaluator status/specializations/daily cap"
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "specializations?", "max_evaluations_per_day?"]
    output: Evaluator
    side_effects: ["state transition per Evaluator machine when status changes"]

  # --- Evaluations ---
  - method: POST
    path: "/v1/evaluations"
    description: "Request a team evaluation"
    roles: [Handler]
    code: 201
    input: [team_id]
    output: Evaluation
    side_effects: ["status=REQUESTED; requested_at=now"]
  - method: GET
    path: "/v1/evaluations/{id}"
    description: "Get an evaluation"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Evaluation
    side_effects: []
  - method: GET
    path: "/v1/evaluations"
    description: "List evaluations"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["team_id?", "evaluator_id?", "status?", "limit?", "offset?"]
    output: "Evaluation[]"
    side_effects: []
  - method: POST
    path: "/v1/evaluations/{id}/schedule"
    description: "Schedule an evaluation with an evaluator (buffered 30-minute interval conflicts rejected)"
    roles: [ProgramAdmin]
    code: 200
    input: [evaluator_id, scheduled_start, scheduled_end]
    output: Evaluation
    side_effects: ["status -> SCHEDULED; attempt_number += 1 when re-scheduling from APPEALED"]
  - method: POST
    path: "/v1/evaluations/{id}/score"
    description: "Score a concluded evaluation; routes to PASSED or FAILED per evaluation_composite"
    roles: [Evaluator]
    code: 200
    input: [aptitude_score, obedience_score]
    output: Evaluation
    side_effects: ["composite_score computed; status -> PASSED | FAILED"]
  - method: POST
    path: "/v1/evaluations/{id}/appeal"
    description: "Appeal a FAILED evaluation within 14 days"
    roles: [Handler]
    code: 200
    input: []
    output: Evaluation
    side_effects: ["status FAILED -> APPEALED"]
  - method: POST
    path: "/v1/evaluations/{id}/cancel"
    description: "Cancel a non-terminal evaluation"
    roles: [Handler, ProgramAdmin]
    code: 200
    input: []
    output: Evaluation
    side_effects: ["status -> CANCELLED"]

  # --- Certifications ---
  - method: POST
    path: "/v1/certifications"
    description: "Issue a PROVISIONAL certification from a PASSED evaluation"
    roles: [ProgramAdmin]
    code: 201
    input: [team_id, evaluation_id]
    output: Certification
    side_effects: ["status=PROVISIONAL"]
  - method: GET
    path: "/v1/certifications/{id}"
    description: "Get a certification"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: GET
    path: "/v1/certifications"
    description: "List certifications"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["team_id?", "evaluation_id?", "status?", "limit?", "offset?"]
    output: "Certification[]"
    side_effects: []
  - method: POST
    path: "/v1/certifications/{id}/activate"
    description: "Activate a PROVISIONAL certification (vaccination + insurance gates)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: ["status -> ACTIVE; activated_on/expires_on set; Team FORMING->ACTIVE; Animal REGISTERED->ACTIVE"]
  - method: POST
    path: "/v1/certifications/{id}/renew"
    description: "Renew a RENEWAL_DUE certification, or an EXPIRED one inside the 90-day grace window"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: ["status -> ACTIVE; expires_on = max(today, old expires_on)+730d; renewal_count += 1"]
  - method: POST
    path: "/v1/certifications/{id}/suspend"
    description: "Suspend a certification; cascades team suspension and SCHEDULED-visit cancellation"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason, "suspension_until?"]
    output: Certification
    side_effects: ["status -> SUSPENDED; Team -> SUSPENDED; SCHEDULED visits -> CANCELLED (CERT_SUSPENDED); request-backed requests -> OPEN"]
  - method: POST
    path: "/v1/certifications/{id}/reinstate"
    description: "Reinstate a suspended certification (re-checks vaccination and insurance gates)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Certification
    side_effects: ["status SUSPENDED -> ACTIVE; Team -> ACTIVE"]
  - method: POST
    path: "/v1/certifications/{id}/revoke"
    description: "Revoke a certification; team dissolves, visits cancelled"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Certification
    side_effects: ["status -> REVOKED; Team -> DISSOLVED; SCHEDULED visits -> CANCELLED (CERT_REVOKED); request-backed requests -> OPEN"]

  # --- Facilities ---
  - method: POST
    path: "/v1/facilities"
    description: "Register a facility (status PROSPECT)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, facility_type, region_code, max_visit_minutes, allowed_species, min_liability_coverage_cents, max_overlapping_teams, visits_per_week_cap, "required_waiver_version?", "address?"]
    output: Facility
    side_effects: ["status=PROSPECT"]
  - method: GET
    path: "/v1/facilities/{id}"
    description: "Get a facility"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/v1/facilities"
    description: "List facilities"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["status?", "facility_type?", "region_code?", "limit?", "offset?"]
    output: "Facility[]"
    side_effects: []
  - method: PATCH
    path: "/v1/facilities/{id}"
    description: "Update facility rules; applies prospectively to new visits (existing visits unchanged)"
    roles: [ProgramAdmin]
    code: 200
    input: ["name?", "max_visit_minutes?", "allowed_species?", "min_liability_coverage_cents?", "max_overlapping_teams?", "visits_per_week_cap?", "required_waiver_version?"]
    output: Facility
    side_effects: []
  - method: POST
    path: "/v1/facilities/{id}/suspend"
    description: "Suspend a facility (manual: existing SCHEDULED visits are kept; new scheduling blocked)"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Facility
    side_effects: ["status ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/v1/facilities/{id}/reinstate"
    description: "Reinstate a suspended facility (requires an ACTIVE agreement)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Facility
    side_effects: ["status SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/v1/facilities/{id}/terminate"
    description: "Terminate a facility; agreement terminated, visits cancelled, requests withdrawn"
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: Facility
    side_effects: ["status -> TERMINATED; ACTIVE agreement -> TERMINATED; SCHEDULED visits -> CANCELLED (AGREEMENT_ENDED); OPEN/OFFERED requests -> WITHDRAWN"]
  - method: GET
    path: "/v1/facilities/{id}/demand-summary"
    description: "Computed unmet-demand summary for a facility"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: { facility_id: string, open_request_count: integer, expired_last_90d: integer, fulfilled_last_90d: integer, unmet_demand_index: integer }
    side_effects: []

  # --- Facility agreements ---
  - method: POST
    path: "/v1/facility-agreements"
    description: "Draft a facility agreement (facility PROSPECT -> ONBOARDING; one non-terminal agreement per facility)"
    roles: [ProgramAdmin]
    code: 201
    input: [facility_id, start_on, end_on, agreed_max_visit_minutes, insurance_minimum_cents, terms_version]
    output: FacilityAgreement
    side_effects: ["status=DRAFT; Facility PROSPECT -> ONBOARDING"]
  - method: GET
    path: "/v1/facility-agreements/{id}"
    description: "Get an agreement"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: FacilityAgreement
    side_effects: []
  - method: GET
    path: "/v1/facility-agreements"
    description: "List agreements"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "FacilityAgreement[]"
    side_effects: []
  - method: POST
    path: "/v1/facility-agreements/{id}/submit"
    description: "Submit a draft agreement for facility signature"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FacilityAgreement
    side_effects: ["status DRAFT -> PENDING_FACILITY_SIGNATURE"]
  - method: POST
    path: "/v1/facility-agreements/{id}/sign-facility"
    description: "Facility countersigns the agreement"
    roles: [FacilityCoordinator]
    code: 200
    input: []
    output: FacilityAgreement
    side_effects: ["status -> PENDING_PROGRAM_SIGNATURE"]
  - method: POST
    path: "/v1/facility-agreements/{id}/sign-program"
    description: "Program countersigns; agreement activates and facility becomes ACTIVE"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FacilityAgreement
    side_effects: ["status -> ACTIVE; Facility ONBOARDING -> ACTIVE"]
  - method: POST
    path: "/v1/facility-agreements/{id}/terminate"
    description: "Terminate an ACTIVE agreement; cascades facility suspension, visit cancellation, request withdrawal"
    roles: [ProgramAdmin, FacilityCoordinator]
    code: 200
    input: [reason]
    output: FacilityAgreement
    side_effects: ["status -> TERMINATED; Facility ACTIVE -> SUSPENDED; SCHEDULED visits at facility -> CANCELLED (AGREEMENT_ENDED); forward workload decremented; request-backed requests -> OPEN; OPEN/OFFERED requests -> WITHDRAWN"]
  - method: POST
    path: "/v1/facility-agreements/{id}/withdraw"
    description: "Withdraw a pre-activation agreement"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FacilityAgreement
    side_effects: ["status -> WITHDRAWN"]

  # --- Orientation records ---
  - method: POST
    path: "/v1/orientation-records"
    description: "Assign a team to facility orientation (facility from X-User-ID)"
    roles: [FacilityCoordinator]
    code: 201
    input: [team_id]
    output: OrientationRecord
    side_effects: ["status=ASSIGNED; facility_id from X-User-ID"]
  - method: GET
    path: "/v1/orientation-records/{id}"
    description: "Get an orientation record"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: OrientationRecord
    side_effects: []
  - method: GET
    path: "/v1/orientation-records"
    description: "List orientation records"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["team_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: "OrientationRecord[]"
    side_effects: []
  - method: POST
    path: "/v1/orientation-records/{id}/complete"
    description: "Mark orientation completed; expires_on = attended_on + 365 days"
    roles: [FacilityCoordinator]
    code: 200
    input: [attended_on]
    output: OrientationRecord
    side_effects: ["status -> COMPLETED; attended_on/expires_on set"]
  - method: POST
    path: "/v1/orientation-records/{id}/reassign"
    description: "Re-assign an EXPIRED orientation (cyclic)"
    roles: [FacilityCoordinator]
    code: 200
    input: []
    output: OrientationRecord
    side_effects: ["status EXPIRED -> ASSIGNED; attended_on/expires_on cleared"]

  # --- Insurance policies ---
  - method: POST
    path: "/v1/insurance-policies"
    description: "Register a liability insurance policy (PENDING)"
    roles: [Handler]
    code: 201
    input: [insurer_name, policy_number, coverage_cents, effective_from, effective_until]
    output: InsurancePolicy
    side_effects: ["status=PENDING; handler_id from X-User-ID"]
  - method: GET
    path: "/v1/insurance-policies/{id}"
    description: "Get a policy"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/v1/insurance-policies"
    description: "List policies"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["handler_id?", "status?", "limit?", "offset?"]
    output: "InsurancePolicy[]"
    side_effects: []
  - method: POST
    path: "/v1/insurance-policies/{id}/verify"
    description: "Verify a PENDING policy (one ACTIVE policy per handler)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status PENDING -> ACTIVE"]
  - method: POST
    path: "/v1/insurance-policies/{id}/cancel"
    description: "Cancel a policy; insurance-lapse cascade suspends certifications and cancels visits"
    roles: [Handler, ProgramAdmin]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status -> CANCELLED; certification INSURANCE_LAPSE suspension cascade per §1.2"]

  # --- Liability waivers ---
  - method: POST
    path: "/v1/liability-waivers"
    description: "Sign a facility liability waiver for an owned team"
    roles: [Handler]
    code: 201
    input: [team_id, facility_id, waiver_version, signed_on]
    output: LiabilityWaiver
    side_effects: ["status=SIGNED"]
  - method: GET
    path: "/v1/liability-waivers/{id}"
    description: "Get a waiver"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: LiabilityWaiver
    side_effects: []
  - method: GET
    path: "/v1/liability-waivers"
    description: "List waivers"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["team_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: "LiabilityWaiver[]"
    side_effects: []
  - method: POST
    path: "/v1/liability-waivers/{id}/void"
    description: "Void a SIGNED waiver (prospective: blocks new visits; existing visits unaffected)"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: LiabilityWaiver
    side_effects: ["status SIGNED -> VOIDED"]

  # --- Visit requests ---
  - method: POST
    path: "/v1/visit-requests"
    description: "Post a visit request (facility from X-User-ID)"
    roles: [FacilityCoordinator]
    code: 201
    input: [requested_start, requested_end, "species_preference?", visit_program, priority]
    output: VisitRequest
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/v1/visit-requests/{id}"
    description: "Get a visit request"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: VisitRequest
    side_effects: []
  - method: GET
    path: "/v1/visit-requests"
    description: "List visit requests"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "status?", "priority?", "offered_team_id?", "limit?", "offset?"]
    output: "VisitRequest[]"
    side_effects: []
  - method: POST
    path: "/v1/visit-requests/{id}/offers"
    description: "Offer an OPEN request to an eligible team (OCC on request version)"
    roles: [ProgramAdmin]
    code: 200
    input: [team_id, expected_visit_request_version]
    output: VisitRequest
    side_effects: ["status OPEN -> OFFERED; offer fields set; increments VisitRequest.version by 1"]
  - method: POST
    path: "/v1/visit-requests/{id}/accept"
    description: "Offered team's handler accepts; creates the SCHEDULED Visit after re-running all visit gates"
    roles: [Handler]
    code: 200
    input: []
    output: Visit
    side_effects: ["VisitRequest OFFERED -> ACCEPTED", "Visit created (SCHEDULED, UNVERIFIED)", "increments Team.version by 1; forward workload incremented"]
  - method: POST
    path: "/v1/visit-requests/{id}/decline"
    description: "Offered team's handler declines; request cycles back to OPEN"
    roles: [Handler]
    code: 200
    input: []
    output: VisitRequest
    side_effects: ["status OFFERED -> OPEN; offer fields cleared; decline_count += 1"]
  - method: POST
    path: "/v1/visit-requests/{id}/withdraw"
    description: "Withdraw an OPEN/OFFERED request"
    roles: [FacilityCoordinator]
    code: 200
    input: []
    output: VisitRequest
    side_effects: ["status -> WITHDRAWN"]
  - method: GET
    path: "/v1/visit-requests/{id}/candidate-teams"
    description: "Ranked eligible candidate teams for a request per team_match_score (score DESC, created_at ASC tie-break; empty pool -> [])"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "Team[]"
    side_effects: []

  # --- Visits ---
  - method: POST
    path: "/v1/visits"
    description: "Directly schedule a visit (OCC on team version); runs the full gate chain (state, safety, referential, temporal, fiscal, constraint)"
    roles: [ProgramAdmin]
    code: 201
    input: [team_id, facility_id, scheduled_start, scheduled_end, expected_team_version]
    output: Visit
    side_effects: ["lifecycle_status=SCHEDULED; verification_status=UNVERIFIED; increments Team.version by 1; forward workload incremented"]
  - method: GET
    path: "/v1/visits/{id}"
    description: "Get a visit"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/v1/visits"
    description: "List visits"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["team_id?", "facility_id?", "request_id?", "lifecycle_status?", "verification_status?", "limit?", "offset?"]
    output: "Visit[]"
    side_effects: []
  - method: POST
    path: "/v1/visits/{id}/check-in"
    description: "Check in to a scheduled visit within the window [scheduled_start-15min, scheduled_end]"
    roles: [Handler]
    code: 200
    input: []
    output: Visit
    side_effects: ["lifecycle_status -> IN_PROGRESS; actual_start=now"]
  - method: POST
    path: "/v1/visits/{id}/check-out"
    description: "Check out; completes the visit, posts PROVISIONAL credit, sets rest block, fulfills the request"
    roles: [Handler]
    code: 200
    input: []
    output: Visit
    side_effects: ["lifecycle_status -> COMPLETED; actual_end/actual_minutes set; PROVISIONAL HourCredit posted; Animal.welfare_blocked_until set; request-backed VisitRequest -> FULFILLED"]
  - method: POST
    path: "/v1/visits/{id}/cancel"
    description: "Cancel a SCHEDULED visit; late-cancel penalty tiers; request reopens"
    roles: [Handler, ProgramAdmin, FacilityCoordinator]
    code: 200
    input: [reason]
    output: Visit
    side_effects: ["lifecycle_status -> CANCELLED; forward workload decremented; handler-initiated applies late_cancel_penalty; request-backed VisitRequest ACCEPTED -> OPEN"]
  - method: POST
    path: "/v1/visits/{id}/verify"
    description: "Facility verifies a completed visit; provisional credit reversed, FINAL credit posted"
    roles: [FacilityCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: ["verification_status UNVERIFIED -> VERIFIED; REVERSAL + FINAL HourCredits posted; lifetime/tier recomputed"]
  - method: POST
    path: "/v1/visits/{id}/dispute"
    description: "Facility disputes a completed visit"
    roles: [FacilityCoordinator]
    code: 200
    input: [dispute_reason]
    output: Visit
    side_effects: ["verification_status UNVERIFIED -> DISPUTED"]
  - method: POST
    path: "/v1/visits/{id}/resolve-dispute"
    description: "Compliance resolves a dispute with approved minutes; FINAL credit computed from approved_minutes"
    roles: [ComplianceOfficer]
    code: 200
    input: [approved_minutes]
    output: Visit
    side_effects: ["verification_status DISPUTED -> VERIFIED; approved_minutes set; REVERSAL + FINAL HourCredits posted"]

  # --- Incident reports ---
  - method: POST
    path: "/v1/incident-reports"
    description: "File an incident against an IN_PROGRESS or COMPLETED visit"
    roles: [Handler, FacilityCoordinator]
    code: 201
    input: [visit_id, severity, category, description]
    output: IncidentReport
    side_effects: ["status=FILED; filed_by_role recorded"]
  - method: GET
    path: "/v1/incident-reports/{id}"
    description: "Get an incident report"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/v1/incident-reports"
    description: "List incident reports"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["visit_id?", "status?", "severity?", "limit?", "offset?"]
    output: "IncidentReport[]"
    side_effects: []
  - method: POST
    path: "/v1/incident-reports/{id}/triage"
    description: "Triage a filed incident (records triaged_by)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status FILED -> UNDER_REVIEW; triaged_by set"]
  - method: POST
    path: "/v1/incident-reports/{id}/escalate"
    description: "Escalate; precaution cascade: animal WELFARE_HOLD, certification suspension, visit cancellation, request reopen"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status UNDER_REVIEW -> ESCALATED; precaution cascade per §1.2"]
  - method: POST
    path: "/v1/incident-reports/{id}/resolve"
    description: "Resolve with a resolution code; resolver must differ from triager (segregation of duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_code, "suspension_days?"]
    output: IncidentReport
    side_effects: ["status -> RESOLVED; resolution-code side effects per §1.2"]

  # --- Hour credits ---
  - method: GET
    path: "/v1/hour-credits/{id}"
    description: "Get an hour-credit ledger row"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: HourCredit
    side_effects: []
  - method: GET
    path: "/v1/hour-credits"
    description: "List hour-credit ledger rows"
    roles: [ProgramAdmin, Handler, Evaluator, FacilityCoordinator, ComplianceOfficer]
    code: 200
    input: ["handler_id?", "visit_id?", "kind?", "limit?", "offset?"]
    output: "HourCredit[]"
    side_effects: []
  - method: POST
    path: "/v1/hour-credits/adjustments"
    description: "Post a manual hour adjustment (signed minutes; lifetime floored at 0)"
    roles: [ComplianceOfficer]
    code: 201
    input: [handler_id, minutes, reason]
    output: HourCredit
    side_effects: ["ADJUSTMENT HourCredit posted; Handler.lifetime_minutes and recognition_tier recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed actor does not own the target resource (handler/animal/team/evaluator assignment/facility)" }
  # --- Existence (path, left-to-right) ---
  - { id: ERR_HANDLER_NOT_FOUND, http: 404, condition: "Handler id does not exist" }
  - { id: ERR_ANIMAL_NOT_FOUND, http: 404, condition: "Animal id does not exist" }
  - { id: ERR_TEAM_NOT_FOUND, http: 404, condition: "Team id does not exist" }
  - { id: ERR_EVALUATOR_NOT_FOUND, http: 404, condition: "Evaluator id does not exist" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "Evaluation id does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "Certification id does not exist" }
  - { id: ERR_VACCINATION_RECORD_NOT_FOUND, http: 404, condition: "VaccinationRecord id does not exist" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "FacilityAgreement id does not exist" }
  - { id: ERR_ORIENTATION_NOT_FOUND, http: 404, condition: "OrientationRecord id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "InsurancePolicy id does not exist" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "LiabilityWaiver id does not exist" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "VisitRequest id does not exist" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "Visit id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "IncidentReport id does not exist" }
  - { id: ERR_HOUR_CREDIT_NOT_FOUND, http: 404, condition: "HourCredit id does not exist" }
  # --- Body / schema ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, unknown field, string/date sanity failure (start < end, effective_from <= effective_until, description >= 10 chars, approved_minutes within 0..scheduled_minutes)" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 400, condition: "Enum field carries a value outside its declared set" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  # --- State ---
  - { id: ERR_HANDLER_NOT_APPLICANT, http: 409, condition: "Handler not in APPLICANT for approve/reject" }
  - { id: ERR_HANDLER_NOT_ACTIVE, http: 409, condition: "Handler not ACTIVE where required (suspend, retire, evaluation request, offer acceptance, check-in)" }
  - { id: ERR_HANDLER_NOT_SUSPENDED, http: 409, condition: "Handler not SUSPENDED for reinstate" }
  - { id: ERR_ANIMAL_NOT_ACTIVE, http: 409, condition: "Animal not ACTIVE where required (visit scheduling, welfare-hold)" }
  - { id: ERR_ANIMAL_NOT_ON_HOLD, http: 409, condition: "Animal not in WELFARE_HOLD for welfare-release" }
  - { id: ERR_ANIMAL_NOT_RETIRABLE, http: 409, condition: "Animal not in REGISTERED/ACTIVE for retire" }
  - { id: ERR_ANIMAL_HAS_ACTIVE_TEAM, http: 409, condition: "Animal has a team in FORMING/ACTIVE/SUSPENDED and cannot retire" }
  - { id: ERR_TEAM_NOT_ACTIVE, http: 409, condition: "Team not ACTIVE for visit scheduling or offer acceptance" }
  - { id: ERR_TEAM_NOT_FORMING, http: 409, condition: "Team not FORMING (evaluation request, initial certification issuance)" }
  - { id: ERR_TEAM_HAS_SCHEDULED_VISITS, http: 409, condition: "Team has visits in SCHEDULED/IN_PROGRESS and cannot dissolve" }
  - { id: ERR_TEAM_HAS_ACTIVE_CERTIFICATION, http: 409, condition: "Manual dissolve blocked: team has a certification in PROVISIONAL/ACTIVE/RENEWAL_DUE/SUSPENDED" }
  - { id: ERR_EVALUATOR_NOT_ACTIVE, http: 409, condition: "Evaluator INACTIVE for new scheduling" }
  - { id: ERR_EVALUATION_NOT_SCHEDULABLE, http: 409, condition: "Evaluation not in REQUESTED/APPEALED for scheduling" }
  - { id: ERR_EVALUATION_NOT_SCHEDULED, http: 409, condition: "Evaluation not SCHEDULED for scoring" }
  - { id: ERR_EVALUATION_NOT_FAILED, http: 409, condition: "Evaluation not FAILED for appeal" }
  - { id: ERR_EVALUATION_NOT_CANCELLABLE, http: 409, condition: "Evaluation in terminal state for cancel" }
  - { id: ERR_EVALUATION_NOT_PASSED, http: 409, condition: "Certification issuance requires a PASSED evaluation" }
  - { id: ERR_EVALUATION_TEAM_MISMATCH, http: 409, condition: "evaluation_id references an evaluation of a different team" }
  - { id: ERR_CERT_NOT_PROVISIONAL, http: 409, condition: "Certification not PROVISIONAL for activate" }
  - { id: ERR_CERT_NOT_RENEWABLE, http: 409, condition: "Certification not in RENEWAL_DUE/EXPIRED for renew" }
  - { id: ERR_CERT_NOT_SUSPENDABLE, http: 409, condition: "Certification not ACTIVE/RENEWAL_DUE for suspend" }
  - { id: ERR_CERT_NOT_SUSPENDED, http: 409, condition: "Certification not SUSPENDED for reinstate" }
  - { id: ERR_SUSPENSION_NOT_ELAPSED, http: 409, condition: "suspension_until is in the future" }
  - { id: ERR_CERT_NOT_REVOKABLE, http: 409, condition: "Certification not ACTIVE/RENEWAL_DUE/SUSPENDED for revoke" }
  - { id: ERR_CERT_NOT_ACTIVE, http: 409, condition: "Team certification not ACTIVE/RENEWAL_DUE (visit scheduling, check-in)" }
  - { id: ERR_VACCINATION_NOT_VALID, http: 409, condition: "VaccinationRecord not VALID for void" }
  - { id: ERR_FACILITY_NOT_ACTIVE, http: 409, condition: "Facility not ACTIVE (visit scheduling, suspend)" }
  - { id: ERR_FACILITY_NOT_SUSPENDED, http: 409, condition: "Facility not SUSPENDED for reinstate" }
  - { id: ERR_FACILITY_ALREADY_TERMINAL, http: 409, condition: "Facility already TERMINATED" }
  - { id: ERR_AGREEMENT_NOT_DRAFT, http: 409, condition: "Agreement not DRAFT for submit" }
  - { id: ERR_AGREEMENT_NOT_AWAITING_FACILITY, http: 409, condition: "Agreement not PENDING_FACILITY_SIGNATURE for sign-facility" }
  - { id: ERR_AGREEMENT_NOT_AWAITING_PROGRAM, http: 409, condition: "Agreement not PENDING_PROGRAM_SIGNATURE for sign-program" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement not ACTIVE for terminate" }
  - { id: ERR_AGREEMENT_NOT_WITHDRAWABLE, http: 409, condition: "Agreement not in DRAFT/PENDING_* for withdraw" }
  - { id: ERR_ORIENTATION_NOT_ASSIGNED, http: 409, condition: "OrientationRecord not ASSIGNED for complete" }
  - { id: ERR_ORIENTATION_NOT_EXPIRED, http: 409, condition: "OrientationRecord not EXPIRED for reassign" }
  - { id: ERR_POLICY_NOT_PENDING, http: 409, condition: "InsurancePolicy not PENDING for verify" }
  - { id: ERR_POLICY_NOT_CANCELLABLE, http: 409, condition: "InsurancePolicy not PENDING/ACTIVE for cancel" }
  - { id: ERR_WAIVER_NOT_SIGNED, http: 409, condition: "LiabilityWaiver not SIGNED for void" }
  - { id: ERR_REQUEST_NOT_OPEN, http: 409, condition: "VisitRequest not OPEN for offer creation" }
  - { id: ERR_REQUEST_NOT_OFFERED, http: 409, condition: "VisitRequest not OFFERED for accept/decline" }
  - { id: ERR_REQUEST_NOT_WITHDRAWABLE, http: 409, condition: "VisitRequest not OPEN/OFFERED for withdraw" }
  - { id: ERR_VISIT_NOT_SCHEDULED, http: 409, condition: "Visit not SCHEDULED for check-in" }
  - { id: ERR_VISIT_NOT_IN_PROGRESS, http: 409, condition: "Visit not IN_PROGRESS for check-out" }
  - { id: ERR_VISIT_NOT_CANCELLABLE, http: 409, condition: "Visit not SCHEDULED for cancel" }
  - { id: ERR_VISIT_NOT_COMPLETED, http: 409, condition: "Visit not COMPLETED for verify/dispute or incident filing" }
  - { id: ERR_VISIT_ALREADY_RESOLVED, http: 409, condition: "Visit verification_status not UNVERIFIED for verify/dispute" }
  - { id: ERR_VISIT_NOT_DISPUTED, http: 409, condition: "Visit verification_status not DISPUTED for resolve-dispute" }
  - { id: ERR_INCIDENT_NOT_FILED, http: 409, condition: "IncidentReport not FILED for triage" }
  - { id: ERR_INCIDENT_NOT_UNDER_REVIEW, http: 409, condition: "IncidentReport not UNDER_REVIEW for escalate" }
  - { id: ERR_INCIDENT_NOT_RESOLVABLE, http: 409, condition: "IncidentReport not UNDER_REVIEW/ESCALATED for resolve" }
  # --- Safety ---
  - { id: ERR_ANIMAL_WELFARE_HOLD, http: 403, condition: "Animal in WELFARE_HOLD (visit scheduling, check-in)" }
  - { id: ERR_ANIMAL_REST_PERIOD, http: 403, condition: "scheduled_start < animal.welfare_blocked_until (equality allowed)" }
  - { id: ERR_WORKLOAD_LIMIT_EXCEEDED, http: 403, condition: "FORWARD_LOOKING workload + new scheduled minutes > 240 in [now-7d, now+7d)" }
  - { id: ERR_DAILY_VISIT_LIMIT_EXCEEDED, http: 403, condition: "Animal already has 2 visits in states SCHEDULED/IN_PROGRESS/COMPLETED on that UTC calendar day" }
  - { id: ERR_SPECIES_NOT_PERMITTED, http: 403, condition: "Animal species not in facility.allowed_species" }
  - { id: ERR_VACCINATION_MISSING, http: 403, condition: "No RABIES VaccinationRecord exists at all for the animal (in any status)" }
  - { id: ERR_VACCINATION_EXPIRED, http: 403, condition: "A RABIES record exists but none has status VALID with valid_until >= the required date (today for activate/renew/reinstate; scheduled date for visits); a record whose validity lapsed — whether or not the sweep has marked it EXPIRED — yields this error, not ERR_VACCINATION_MISSING" }
  # --- Referential ---
  - { id: ERR_NO_ACTIVE_AGREEMENT, http: 409, condition: "No FacilityAgreement with status ACTIVE covers the facility and scheduled date" }
  - { id: ERR_ORIENTATION_NOT_COMPLETED, http: 409, condition: "No OrientationRecord (team, facility) with status COMPLETED and expires_on >= today" }
  - { id: ERR_WAIVER_NOT_ON_FILE, http: 409, condition: "No SIGNED LiabilityWaiver (team, facility) with waiver_version == facility.required_waiver_version" }
  # --- Temporal ---
  - { id: ERR_VISIT_IN_PAST, http: 409, condition: "scheduled_start < now" }
  - { id: ERR_TEAM_SCHEDULING_CONFLICT, http: 409, condition: "Half-open interval [start,end) overlaps another SCHEDULED/IN_PROGRESS visit of the team; adjacency (end == start) is allowed" }
  - { id: ERR_EVALUATOR_SCHEDULING_CONFLICT, http: 409, condition: "The new evaluation's raw interval [start,end) intersects the buffered interval [s-30min, e+30min) of another SCHEDULED evaluation of the same evaluator; equivalently the gap between back-to-back evaluations must be >= 30 minutes (bare adjacency, gap == 0, conflicts; gap == 30 passes)" }
  - { id: ERR_EVALUATION_SCHEDULE_IN_PAST, http: 409, condition: "scheduled_start < now for evaluation scheduling" }
  - { id: ERR_EVALUATION_DURATION_INVALID, http: 409, condition: "Evaluation duration outside 30..120 minutes" }
  - { id: ERR_EVALUATION_NOT_CONCLUDED, http: 409, condition: "now < scheduled_end when scoring" }
  - { id: ERR_EVALUATION_APPEAL_WINDOW_CLOSED, http: 409, condition: "now > failed_at + 14 days at appeal" }
  - { id: ERR_CHECKIN_TOO_EARLY, http: 409, condition: "now < scheduled_start - 15 minutes at check-in" }
  - { id: ERR_CHECKIN_WINDOW_PASSED, http: 409, condition: "now > scheduled_end at check-in" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "now > offer_expires_at at accept" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Certification EXPIRED and today > expires_on + 90 days" }
  - { id: ERR_AGREEMENT_TERM_PASSED, http: 409, condition: "today > end_on when signing" }
  - { id: ERR_ORIENTATION_DATE_FUTURE, http: 409, condition: "attended_on > today at orientation completion" }
  # --- Fiscal ---
  - { id: ERR_NO_ACTIVE_INSURANCE, http: 402, condition: "No InsurancePolicy with status ACTIVE covering today for the team's handler" }
  - { id: ERR_INSURANCE_COVERAGE_INADEQUATE, http: 402, condition: "ACTIVE policy exists but coverage_cents < required per insurance_adequacy_requirement" }
  # --- Constraint ---
  - { id: ERR_VISIT_DURATION_INVALID, http: 422, condition: "Visit duration < 30 minutes" }
  - { id: ERR_VISIT_DURATION_EXCEEDS_CAP, http: 422, condition: "Visit duration > min(facility.max_visit_minutes, agreement.agreed_max_visit_minutes, 120)" }
  - { id: ERR_FACILITY_CAPACITY_EXCEEDED, http: 422, condition: "Resulting overlapping-visit count at the facility would exceed max_overlapping_teams" }
  - { id: ERR_FACILITY_WEEKLY_CAP_EXCEEDED, http: 422, condition: "Facility visits this ISO week (SCHEDULED/IN_PROGRESS/COMPLETED) >= visits_per_week_cap" }
  - { id: ERR_EVALUATOR_DAILY_CAP_EXCEEDED, http: 422, condition: "Evaluator already has max_evaluations_per_day SCHEDULED evaluations on that UTC day" }
  - { id: ERR_ACTIVE_CERTIFICATION_EXISTS, http: 422, condition: "Team already has a certification in PROVISIONAL/ACTIVE/RENEWAL_DUE/SUSPENDED" }
  - { id: ERR_ACTIVE_POLICY_EXISTS, http: 422, condition: "Handler already has an ACTIVE policy; verify of a second is rejected" }
  - { id: ERR_WAIVER_ALREADY_EXISTS, http: 422, condition: "A SIGNED waiver already exists for (team, facility, waiver_version)" }
  - { id: ERR_ACTIVE_TEAM_EXISTS, http: 422, condition: "Animal already belongs to a team in FORMING/ACTIVE/SUSPENDED" }
  - { id: ERR_ACTIVE_AGREEMENT_EXISTS, http: 422, condition: "Facility already has an agreement in DRAFT/PENDING_*/ACTIVE" }
  - { id: ERR_RENEWAL_VISIT_MINIMUM_NOT_MET, http: 422, condition: "Fewer than 6 COMPLETED+VERIFIED visits within [activated_on, pre-renewal expires_on]" }
  - { id: ERR_TEAM_NOT_ELIGIBLE, http: 422, condition: "Team fails the team_match_score eligibility filter for this request" }
  - { id: ERR_INVALID_ADJUSTMENT, http: 422, condition: "Adjustment would take lifetime_minutes below 0, or minutes == 0" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Incident resolver X-User-ID equals triaged_by" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register as a handler"
    identity: opaque
    exclusive_operations:
      - "POST /v1/handlers — handler self-registration"
    shared_operations: []

  - name: Handler
    description: "Volunteer handler; manages own animals, teams, evaluations, vaccinations, policies, waivers; performs visits; files incidents"
    identity: "entity_backed:Handler"
    exclusive_operations:
      - "POST /v1/animals, POST /v1/animals/{id}/retire"
      - "POST /v1/teams, POST /v1/teams/{id}/dissolve"
      - "POST /v1/evaluations, POST /v1/evaluations/{id}/appeal"
      - "POST /v1/vaccination-records"
      - "POST /v1/insurance-policies"
      - "POST /v1/liability-waivers"
      - "POST /v1/visit-requests/{id}/accept, POST /v1/visit-requests/{id}/decline"
      - "POST /v1/visits/{id}/check-in, POST /v1/visits/{id}/check-out"
    shared_operations:
      - "POST /v1/handlers/{id}/retire (with ProgramAdmin)"
      - "POST /v1/evaluations/{id}/cancel (with ProgramAdmin)"
      - "POST /v1/insurance-policies/{id}/cancel (with ProgramAdmin)"
      - "POST /v1/visits/{id}/cancel (with ProgramAdmin, FacilityCoordinator)"
      - "POST /v1/incident-reports (with FacilityCoordinator)"
      - "All GET endpoints (with all authenticated roles)"

  - name: Evaluator
    description: "Certified temperament evaluator; scores own assigned evaluations"
    identity: "entity_backed:Evaluator"
    exclusive_operations:
      - "POST /v1/evaluations/{id}/score"
    shared_operations:
      - "All GET endpoints (with all authenticated roles)"

  - name: FacilityCoordinator
    description: "Facility-side coordinator; manages requests, orientations, visit verification, incidents for the own facility"
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /v1/visit-requests, POST /v1/visit-requests/{id}/withdraw"
      - "POST /v1/orientation-records, POST /v1/orientation-records/{id}/complete, POST /v1/orientation-records/{id}/reassign"
      - "POST /v1/visits/{id}/verify, POST /v1/visits/{id}/dispute"
      - "POST /v1/facility-agreements/{id}/sign-facility"
    shared_operations:
      - "POST /v1/facility-agreements/{id}/terminate (with ProgramAdmin)"
      - "POST /v1/visits/{id}/cancel (with Handler, ProgramAdmin)"
      - "POST /v1/incident-reports (with Handler)"
      - "All GET endpoints (with all authenticated roles)"

  - name: ProgramAdmin
    description: "Program operator; runs onboarding, scheduling, matching, sweeps, clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/_clock/set_current_utc, POST /v1/_sweeps/run"
      - "POST /v1/handlers/{id}/approve, POST /v1/handlers/{id}/reject"
      - "POST /v1/evaluators, PATCH /v1/evaluators/{id}"
      - "POST /v1/evaluations/{id}/schedule"
      - "POST /v1/certifications, POST /v1/certifications/{id}/activate, POST /v1/certifications/{id}/renew"
      - "POST /v1/facilities, PATCH /v1/facilities/{id}, POST /v1/facilities/{id}/terminate"
      - "POST /v1/facility-agreements, POST /v1/facility-agreements/{id}/submit, POST /v1/facility-agreements/{id}/sign-program, POST /v1/facility-agreements/{id}/withdraw"
      - "POST /v1/insurance-policies/{id}/verify"
      - "POST /v1/visits (direct scheduling)"
      - "POST /v1/visit-requests/{id}/offers, GET /v1/visit-requests/{id}/candidate-teams"
    shared_operations:
      - "POST /v1/handlers/{id}/retire (with Handler)"
      - "POST /v1/evaluations/{id}/cancel (with Handler)"
      - "POST /v1/insurance-policies/{id}/cancel (with Handler)"
      - "POST /v1/visits/{id}/cancel (with Handler, FacilityCoordinator)"
      - "POST /v1/facility-agreements/{id}/terminate (with FacilityCoordinator)"
      - "All GET endpoints (with all authenticated roles)"

  - name: ComplianceOfficer
    description: "Compliance and animal-welfare officer; suspends/reinstates/revokes, triages and resolves incidents (segregated), posts hour adjustments"
    identity: opaque
    exclusive_operations:
      - "POST /v1/handlers/{id}/suspend, POST /v1/handlers/{id}/reinstate"
      - "POST /v1/animals/{id}/welfare-hold, POST /v1/animals/{id}/welfare-release"
      - "POST /v1/certifications/{id}/suspend, POST /v1/certifications/{id}/reinstate, POST /v1/certifications/{id}/revoke"
      - "POST /v1/facilities/{id}/suspend, POST /v1/facilities/{id}/reinstate"
      - "POST /v1/vaccination-records/{id}/void"
      - "POST /v1/liability-waivers/{id}/void"
      - "POST /v1/incident-reports/{id}/triage, POST /v1/incident-reports/{id}/escalate, POST /v1/incident-reports/{id}/resolve"
      - "POST /v1/visits/{id}/resolve-dispute"
      - "POST /v1/hour-credits/adjustments"
    shared_operations:
      - "All GET endpoints (with all authenticated roles)"
