  - section: errors
    instances:
      - name: stylist_inactive_blocks_check_in
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STYLIST_INACTIVE]
          - state_machines.Appointment.BOOKED_to_CHECKED_IN
          - entities.Stylist.fields.active
        distinguishing_aspect: "Check-in on an appointment whose stylist was set active=false is rejected ERR_STYLIST_INACTIVE; appointment stays BOOKED."
        test_recipe:
          setup:
            - "A stylist active=true with a BOOKED appointment, then stylist toggled active=false via PATCH."
          setup_api_calls:
            - call: "POST /stylists"
              payload: { full_name: "Bee" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "CONSULTATION", start_at: "2026-07-16T10:00:00.000Z", end_at: "2026-07-16T11:00:00.000Z" }
              as: BridalConsultant
              captures: { appt: $.data.id }
            - call: "PATCH /stylists/${sty}"
              payload: { active: false }
              as: ShopManager
          trigger:
            - call: "POST /appointments/${appt}/check-in"
              payload: {}
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STYLIST_INACTIVE"
            - "Appointment.${appt}.status == BOOKED"

      - name: release_already_released_booking_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BOOKING_NOT_HELD]
          - state_machines.FittingRoomBooking.HELD_to_RELEASED
        distinguishing_aspect: "Releasing a booking already RELEASED is rejected ERR_BOOKING_NOT_HELD."
        test_recipe:
          setup:
            - "A HELD booking, then RELEASED."
          setup_api_calls:
            - call: "POST /fitting-rooms"
              payload: { room_label: "Suite I", capacity: 2 }
              as: ShopManager
              captures: { room: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Cyd" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "FITTING", start_at: "2026-07-17T10:00:00.000Z", end_at: "2026-07-17T11:00:00.000Z" }
              as: BridalConsultant
              captures: { appt: $.data.id }
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt}", fitting_room_id: "${room}", party_size: 1, slot_start_at: "2026-07-17T10:00:00.000Z", slot_end_at: "2026-07-17T11:00:00.000Z" }
              as: BridalConsultant
              captures: { b1: $.data.id }
            - call: "POST /fitting-room-bookings/${b1}/release"
              payload: {}
              as: BridalConsultant
          trigger:
            - call: "POST /fitting-room-bookings/${b1}/release"
              payload: {}
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOOKING_NOT_HELD"

      - name: fk_appointment_unknown_stylist_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STYLIST_NOT_FOUND]
          - entities.Appointment.fields.stylist_id
          - validations[priority=3]
        distinguishing_aspect: "POST /appointments with a non-existent stylist_id returns 404 ERR_STYLIST_NOT_FOUND (FK existence)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /appointments"
              payload: { stylist_id: "00000000-0000-4000-8000-000000000099", appointment_type: "CONSULTATION", start_at: "2026-07-18T10:00:00.000Z", end_at: "2026-07-18T11:00:00.000Z" }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_STYLIST_NOT_FOUND"

  # ===========================================================================
  - section: rbac
    instances:
      - name: consultant_cannot_receive_order
        claim_type: role_denied
        grounds:
          - roles
          - endpoints
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /gown-orders/{id}/receive is ShopManager-exclusive; a BridalConsultant call is rejected 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "A GownOrder ORDERED (plan exists, submitted)."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
          trigger:
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: seamstress_cannot_post_payment
        claim_type: role_denied
        grounds:
          - roles
          - endpoints
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /payment-plans/{id}/payments is restricted to FinanceClerk/ShopManager; a Seamstress call is rejected 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "A plan exists (deposit unpaid)."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv0}" }
              as: Seamstress
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_user_context_header_unauthenticated
        claim_type: role_denied
        grounds:
          - roles
          - errors[ERR_MISSING_USER_CONTEXT]
          - validations[priority=1]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID context is rejected 401 ERR_MISSING_USER_CONTEXT before any role check."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_MISSING_USER_CONTEXT"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_plan_version_rejected_on_payment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payment-post-stale-plan]
          - errors[ERR_STALE_PLAN_VERSION]
          - entities.PaymentPlan.fields.expected_plan_version
        distinguishing_aspect: "After a first payment advances PaymentPlan.version, a second payment carrying the pre-advance version is rejected 412 ERR_STALE_PLAN_VERSION; ledger unchanged by the rejected call."
        test_recipe:
          setup:
            - "GownOrder quoted 290000; plan deposit 145000 term 5 (version captured at create); deposit 145000 posted (version advances)."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ELEGANCE", ordered_size: 22, base_price_cents: 200000, standard_lead_days: 90, is_rush: true }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 5, deposit_cents: 145000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 145000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
          trigger:
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 29000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_PLAN_VERSION"
            - "PaymentPlan.${plan}.amount_paid_cents == 145000"

      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payment-post-stale-plan]
          - entities.PaymentPlan.fields.version
        distinguishing_aspect: "Posting a payment with the current expected_plan_version succeeds (201) and increments PaymentPlan.version; the create-time version 1 advances to 2 after the deposit."
        test_recipe:
          setup:
            - "GownOrder quoted 290000; plan deposit 145000 term 5 at version 1."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ELEGANCE", ordered_size: 22, base_price_cents: 200000, standard_lead_days: 90, is_rush: true }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 5, deposit_cents: 145000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 145000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
            - call: "GET /payment-plans/${plan}"
              payload: {}
              as: FinanceClerk
              captures: { pv1: $.data.version }
          assert:
            - "PaymentPlan.${plan}.version == 2"
            - "PaymentPlan.${plan}.status == ACTIVE"

      - name: cascade_order_cancel_zero_paid_plan_cancelled
        claim_type: cascading_side_effects
        grounds:
          - state_machines.GownOrder.DRAFT_to_CANCELLED
          - state_machines.PaymentPlan.DEPOSIT_DUE_to_CANCELLED
        distinguishing_aspect: "Cancelling a DRAFT order whose plan has amount_paid_cents==0 cascades the plan to CANCELLED (no refund needed)."
        test_recipe:
          setup:
            - "DRAFT GownOrder with a plan, nothing paid."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id }
          trigger:
            - call: "POST /gown-orders/${ord}/cancel"
              payload: {}
              as: ShopManager
          assert:
            - "GownOrder.${ord}.fulfillment_status == CANCELLED"
            - "PaymentPlan.${plan}.status == CANCELLED"

      - name: derived_member_order_count_reconciles_on_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - entities.BridalParty.fields.member_order_count
          - state_machines.GownOrder.DRAFT_to_CANCELLED
        distinguishing_aspect: "member_order_count counts non-CANCELLED member orders: two orders on a party give 2; cancelling one reconciles it to 1."
        test_recipe:
          setup:
            - "A FORMING party with two member orders (both DRAFT)."
          setup_api_calls:
            - call: "POST /bridal-parties"
              payload: { party_name: "Count Wedding", event_date: "2026-12-15T00:00:00.000Z" }
              as: BridalConsultant
              captures: { party: $.data.id }
            - call: "POST /gown-orders"
              payload: { gown_style_code: "M1", ordered_size: 10, base_price_cents: 100000, standard_lead_days: 30, bridal_party_id: "${party}" }
              as: BridalConsultant
              captures: { o1: $.data.id }
            - call: "POST /gown-orders"
              payload: { gown_style_code: "M2", ordered_size: 12, base_price_cents: 120000, standard_lead_days: 30, bridal_party_id: "${party}" }
              as: BridalConsultant
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /gown-orders/${o2}/cancel"
              payload: {}
              as: ShopManager
            - call: "GET /bridal-parties/${party}"
              payload: {}
              as: BridalConsultant
              captures: { cnt: $.data.member_order_count }
          assert:
            - "BridalParty.${party}.member_order_count == 1"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_payment_reflects_in_same_request
        claim_type: immediate
        grounds:
          - calculations.plan_ledger
          - state_machines.GownOrder.UNPAID_to_PAID_IN_FULL
        distinguishing_aspect: "Immediate consistency: the second payment's 201 response (and an immediate plan GET) already reflect PAID_IN_FULL and balance 0 — no lag."
        test_recipe:
          setup:
            - "GownOrder quoted 180000; plan deposit 90000 term 2; deposit posted (ACTIVE, balance 90000)."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
            - call: "GET /payment-plans/${plan}"
              payload: {}
              as: FinanceClerk
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv1}" }
              as: FinanceClerk
            - call: "GET /payment-plans/${plan}"
              payload: {}
              as: FinanceClerk
              captures: { bal: $.data.balance_due_cents, st: $.data.status }
          assert:
            - "PaymentPlan.${plan}.balance_due_cents == 0"
            - "PaymentPlan.${plan}.status == PAID_IN_FULL"
            - "GownOrder.${ord}.payment_status == PAID_IN_FULL"
