          Pair = (state, business_safety). A finalize attempt on an already-VOID
          AllocationDecision that references a CONTROLLED lot targeting a
          non-DEA site violates BOTH the DRAFT precondition (state) AND the
          controlled-site rule (safety). The state error wins because state
          (priority 5) precedes business_safety (priority 8).
