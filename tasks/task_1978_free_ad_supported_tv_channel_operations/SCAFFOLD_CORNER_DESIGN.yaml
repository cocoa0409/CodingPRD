            - { call: "POST /v1/channels/${ch}/snapshot-computations", payload: { snapshot_date: "2026-09-01" }, as: ChannelProgrammer, captures: { snap: $.data.id } }
          assert:
            - "ChannelDaySnapshot.${snap}.peak_concurrent_viewers == 5 (ends at 00:10 replay after starts despite earlier insertion)"
            - "ChannelDaySnapshot.${snap}.capacity_seconds == 0 (no PUBLISHED loop for the date)"

      - name: fill_rate_zero_capacity_day
        claim_type: correct_result
        grounds: ["calculations.fill_rate", "calculations.ecpm_calculation"]
        distinguishing_aspect: "Zero-capacity edge: a snapshot for a date with no PUBLISHED loop yields capacity_seconds 0 and both fill rates exactly 0.0000 (pinned, not an error or null)."
        test_recipe:
          setup: ["Channel ch exists; no loops"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch ZC", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
          trigger:
            - { call: "POST /v1/channels/${ch}/snapshot-computations", payload: { snapshot_date: "2026-09-01" }, as: ChannelProgrammer, captures: { snap: $.data.id } }
          assert:
            - "ChannelDaySnapshot.${snap}.capacity_seconds == 0"
            - "ChannelDaySnapshot.${snap}.direct_fill_rate == 0.0000 and effective_fill_rate == 0.0000"
            - "ChannelDaySnapshot.${snap}.ecpm_cents == 0 and performance_score == 0"

      - name: grant_plays_exact_boundary_at_publish
        claim_type: boundary_edge
        grounds: ["calculations.rights_play_consumption"]
        excluded_because:
          difficulty_instance: r4_publish_plays_exhaustion_cascade_reverts_validated_loops
          rationale: "max_plays == 1 exhausted exactly at publish is asserted inside the cascade instance (plays_used == 1, EXHAUSTED)."

      - name: fill_rate_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.fill_rate"]
        excluded_because:
          difficulty_instance: r1_direct_vs_effective_fill_rate_diverge_on_house_substitution
          rationale: "Both variants asserted with literal values in the difficulty instance."

      - name: revenue_variant_selection_and_reconciliation
        claim_type: variant_selection
        grounds: ["calculations.revenue_share_statement"]
        excluded_because:
          difficulty_instance: r1_provisional_vs_final_revenue_statement_diverge_on_unreconciled
          rationale: "Provisional-at-create vs final-at-finalize selection and the input-set delta are asserted there."

  # ============================================================ validations ====
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role is rejected at priority 1 with 400 before any role or existence check."
        test_recipe:
          setup: ["A platform exists (so the target collection is non-empty)"]
          setup_api_calls:
            - { call: "POST /v1/distributor-platforms", payload: { name: "Seed", reporting_tier: "STANDARD" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /v1/channels", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Request sent with auth headers stripped: error_id == ERR_MISSING_CONTEXT_HEADER and http status == 400"

      - name: content_licensing_cannot_create_campaign
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Role check fires even with a perfectly valid payload: ContentLicensing is not in POST /v1/ad-campaigns roles."
        test_recipe:
          setup: ["A platform exists (unrelated seed)"]
          setup_api_calls:
            - { call: "POST /v1/distributor-platforms", payload: { name: "Seed", reporting_tier: "STANDARD" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: ContentLicensing, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and http status == 403"

      - name: partner_cannot_ingest_event_for_foreign_platform
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Entity-backed ownership: DistributorPartner p2 posting an event carrying platform_id p1 is rejected — X-User-ID is compared against the platform FK."
        test_recipe:
          setup: ["Channel ch; platforms p1 and p2 exist"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch Own", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P1", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P2", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "SESSION_START", viewer_session_id: "s1", occurred_at_utc: "2026-09-01T00:00:00Z" }, as: DistributorPartner, as_user_id: "${p2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNERSHIP and http status == 403"

      - name: reviewer_cannot_approve_own_creative
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the same X-User-ID that trafficked the creative cannot approve it even when presenting the AdQualityReviewer role."
        test_recipe:
          setup: ["Campaign c1; creative crv created by user ops-1"]
          setup_api_calls:
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { crv: $.data.id } }
          trigger:
            - { call: "POST /v1/ad-creatives/${crv}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES and AdCreative.${crv}.creative_status == PENDING_REVIEW"

      - name: controller_cannot_finalize_own_generated_report
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "state_machines.RevenueReport.PROVISIONAL_to_FINALIZED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
