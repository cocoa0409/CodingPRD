      - name: release_promotion_rejected_outside_term_and_on_a_draft_deal
        claim_type: precondition_enforcement
        grounds:
          - state_machines[Release.status].transitions[PLANNED->RELEASED].preconditions
          - validations[priority 8 ERR_INVALID_DEAL_STATE]
          - validations[priority 10 ERR_PERIOD_OUTSIDE_TERM]
          - endpoints[POST /releases/{id}/release]
        distinguishing_aspect: |
          The PLANNED -> RELEASED edge carries three preconditions of three different categories:
          the release's own status (priority 8), the parent deal's status (priority 8, cross-entity)
          and the supplied street date against the deal term (priority 10). Each is exercised
          separately on the same release, and the two failures are ordered: on a DRAFT deal with an
          ALSO out-of-term date the deal-state 409 wins over the temporal 422. The deal-state arm is
          the same claim §1.8 cross_entity_state_dependency.release_promotion_requires_deal_executed
          asserts in isolation; what is new here is the priority ordering against the street-date
          window and the inclusive lower bound of that window. Falsified if the date
          window is evaluated before the deal state, if the inclusive lower bound term_start_date is
          rejected, or if a DRAFT deal is allowed to send a release to market.
        test_recipe:
          setup:
            - "one deal, term 2026-01-01..2026-12-31, still DRAFT, with a single PLANNED release"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Cairn Supply", legal_entity: "Cairn Supply Ltd" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Pell Aster", email: "pell@example.test" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000107", title: "Street Date Probe", planned_release_date: "2026-03-01", formats: ["DIGITAL"] }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /releases/${rel_id}/release"
              payload: { actual_release_date: "2027-01-05" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { err_draft: $.data.error_id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-CAIRN" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel_id}/release"
              payload: { actual_release_date: "2027-01-05" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { err_after: $.data.error_id }
            - call: "POST /releases/${rel_id}/release"
              payload: { actual_release_date: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          assert:
            - "the first call, made while the deal is DRAFT and with an out-of-term date, returns 409 with err_draft == \"ERR_INVALID_DEAL_STATE\" — priority 8 decides before the priority 10 window check, so ERR_PERIOD_OUTSIDE_TERM is NOT returned"
            - "the second call, made after execution with the same 2027-01-05 date, now returns 422 with err_after == \"ERR_PERIOD_OUTSIDE_TERM\" — the same payload changes error class purely because the blocking precondition changed"
            - "the release is still \"PLANNED\" and actual_release_date is still null after both failures: a rejected transition writes nothing"
            - "the third call, using the inclusive lower bound actual_release_date == term_start_date == \"2026-01-01\", returns 200 with data.status == \"RELEASED\", data.actual_release_date == \"2026-01-01\" and version incremented by exactly 1"

      - name: execute_side_effects_write_ledger_and_recompute_parent_count
        claim_type: side_effect_execution
        grounds:
          - state_machines[DistributionDeal.status].transitions[DRAFT->EXECUTED].side_effects
          - entities.DistributionDeal.advance_recouped_cents
          - entities.DistributionDeal.unrecouped_advance_cents
          - entities.DistributionDeal.recoupment_status
          - entities.Distributor.active_deal_count
