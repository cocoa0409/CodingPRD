- section: state_machines
  instances:
  - name: corner_new_item_and_integration_test_start_in_their_declared_initial_states
    claim_type: initial_state
    grounds:
    - state_machines.DropshipItem.initial_state
    - state_machines.IntegrationTest.initial_state
    - entities.IntegrationTest.fields.round_number
    distinguishing_aspect: A freshly created DropshipItem is DRAFT with suppression_reason null and available_units
      0 even before any feed arrives, and a freshly recorded IntegrationTest is PENDING at the vendor's current
      integration_round of 1 with evaluated_at null.
    test_recipe:
      setup:
      - Vendor V-INIT is created and taken to INTEGRATION_TESTING, so integration_round is 1.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
        payload:
          vendor_code: V-INIT
          legal_name: Initial State LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
        as: PlatformAdmin
        captures:
          vin_id: $.data.id
      - call: POST /dropship/vendors/${vin_id}/begin-integration
        payload: {}
        as: VendorOpsAnalyst
      trigger:
      - call: POST /dropship/vendors/${vin_id}/integration-tests
        payload:
          message_type: CATALOG
          sample_payload_digest: sha256-init-catalog
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-init
        captures:
          tin_id: $.data.id
      - call: POST /dropship/items
        payload:
          vendor_id: ${vin_id}
          sku: SKU-INIT-1
          unit_retail_cents: 4000
          ship_method: GROUND
          lead_time_days: 3
        as: MerchandiseManager
        captures:
          iin_id: $.data.id
      assert:
      - IntegrationTest.${tin_id}.status == PENDING
      - IntegrationTest.${tin_id}.round_number == 1
      - IntegrationTest.${tin_id}.evaluated_at is null and evaluated_by_user_id is null
      - DropshipItem.${iin_id}.status == DRAFT
      - DropshipItem.${iin_id}.suppression_reason is null
      - DropshipItem.${iin_id}.available_units == 0
      - DropshipItem.${iin_id}.reserved_units == 0 and all three lifetime counters == 0
  - name: corner_begin_integration_moves_vendor_from_draft_to_integration_testing
    claim_type: valid_transition
    grounds:
    - state_machines.Vendor.DRAFT_to_INTEGRATION_TESTING
    - endpoints[POST /dropship/vendors/{id}/begin-integration]
    distinguishing_aspect: The declared DRAFT -> INTEGRATION_TESTING transition fires on POST begin-integration,
      sets integration_round to 1 and bumps Vendor.version from 1 to 2.
    test_recipe:
      setup:
      - Vendor V-BEGIN is DRAFT at version 1.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
        payload:
          vendor_code: V-BEGIN
          legal_name: Begin Integration LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
        as: PlatformAdmin
        captures:
          vbg_id: $.data.id
      trigger:
      - call: POST /dropship/vendors/${vbg_id}/begin-integration
        payload: {}
        as: VendorOpsAnalyst
      assert:
      - the response status is 200
      - Vendor.${vbg_id}.onboarding_status == INTEGRATION_TESTING
      - Vendor.${vbg_id}.integration_round == 1
      - Vendor.${vbg_id}.version == 2
  - name: corner_vendor_certify_from_draft_is_rejected
    claim_type: invalid_transitions
    grounds:
    - state_machines.Vendor
    - validations[priority=19]
    - errors[ERR_VENDOR_INVALID_STATE]
    - endpoints[POST /dropship/vendors/{id}/certify]
    distinguishing_aspect: certify is declared only from INTEGRATION_TESTING. Firing it from DRAFT - a trigger that
      is not in DRAFT's outbound transition list - returns 409 ERR_VENDOR_INVALID_STATE and no side effect runs,
      so certified_by_user_id stays null even though the caller's role is permitted.
    test_recipe:
      setup:
      - Vendor V-EARLY is DRAFT at version 1 and has no IntegrationTest rows.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
        payload:
          vendor_code: V-EARLY
          legal_name: Premature Certify LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
        as: PlatformAdmin
        captures:
          vey_id: $.data.id
      trigger:
