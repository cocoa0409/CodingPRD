  - rule_id: priority_pair_validation_conflict
    instances:

      - name: frozen_posture_priority16_beats_stage_window_conflict_priority33
        grounds:
          - validations[priority=16]
          - validations[priority=33]
          - calculations.project_posture
          - errors.ERR_PROJECT_FROZEN
          - errors.ERR_STAGE_WINDOW_CONFLICT
        distinguishing_aspect: |
          A single request violates BOTH the posture gate at priority 16 and the stage-occupancy
          rule at priority 33; only ERR_PROJECT_FROZEN (409) may come back. The control call proves
          the second violation is real: after the picture is re-locked the very same overlapping
          window returns ERR_STAGE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "One stage with a 45-minute changeover; mixer certified THEATRICAL and STREAMING."
            - "Locked STANDARD project with 40.00 authorized hours and no stem packages."
            - "One RESERVED FINAL_MIX booking occupying 2026-09-14T10:00:00Z -> 13:00:00Z."
            - "Picture lock is then broken, so posture becomes FROZEN while the booking stays RESERVED."
            - "The offending request is a PREMIX booking for 11:00 -> 12:00, which is inside the occupied window (PREMIX is chosen because it is exempt from the picture-lock rule at priority 18)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-stages"
              payload: { room_code: "STAGE_G", display_name: "Stage G", hourly_rate_cents: 120000, supports_remote_review: true, changeover_minutes: 45 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { stage_id: $.data.id }
            - call: "POST /mixers"
              payload: { full_name: "Gus Mixer", certified_platforms: ["THEATRICAL", "STREAMING"], max_daily_hours: 10.00 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { mixer_one_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Feature Iota", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z", turnaround_class: "STANDARD", stage_hours_authorized: 40.00 }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/picture-lock"
              payload: {}
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_pre_booking: $.data.version }
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v_pre_booking}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_one_id}", booking_type: "FINAL_MIX", platform: "THEATRICAL", window_start_utc: "2026-09-14T10:00:00Z", window_end_utc: "2026-09-14T13:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { occupying_booking_id: $.data.id }
            - call: "POST /projects/${proj_id}/break-picture-lock"
              payload: { break_reason: "reel 2 recut" }
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_frozen: $.data.version, posture_frozen: $.data.posture }
          trigger:
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v_frozen}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_one_id}", booking_type: "PREMIX", platform: "THEATRICAL", window_start_utc: "2026-09-14T11:00:00Z", window_end_utc: "2026-09-14T12:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { blocked_error: $.data.error_id }
            - call: "POST /projects/${proj_id}/picture-lock"
              payload: {}
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_relocked: $.data.version, posture_relocked: $.data.posture }
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v_relocked}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_one_id}", booking_type: "PREMIX", platform: "THEATRICAL", window_start_utc: "2026-09-14T11:00:00Z", window_end_utc: "2026-09-14T12:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { control_error: $.data.error_id }
          assert:
            - "the frozen attempt returns HTTP 409 with error_id == ERR_PROJECT_FROZEN"
            - "the frozen attempt does NOT return ERR_STAGE_WINDOW_CONFLICT even though the window overlaps"
            - "after the re-lock, Project.${proj_id}.posture == OPEN (no stale stem packages exist)"
            - "the control attempt returns HTTP 409 with error_id == ERR_STAGE_WINDOW_CONFLICT"
            - "MixStageBooking.${occupying_booking_id}.status == RESERVED throughout"
            - "no new MixStageBooking is created by either rejected call"
            - "Project.${proj_id}.stage_hours_reserved == 3.00 (unchanged by both rejections)"

      - name: mixer_certification_priority24_beats_stage_hours_priority42
        grounds:
          - validations[priority=24]
          - validations[priority=42]
          - errors.ERR_MIXER_NOT_CERTIFIED
          - errors.ERR_STAGE_HOURS_EXCEEDED
          - calculations.stage_hours_ledger
        distinguishing_aspect: |
          A capability defect (422) is deliberately ordered ahead of a fiscal-budget defect (409):
          a 6.00-hour request against a 4.00-hour authorization with an uncertified mixer must
          return ERR_MIXER_NOT_CERTIFIED, and only when the mixer is swapped for a certified one
          does the same window surface ERR_STAGE_HOURS_EXCEEDED — two different HTTP statuses from
          one unchanged window.
        test_recipe:
          setup:
            - "Stage at 100000 cents/hour."
            - "Mixer A certified for STREAMING only; Mixer B certified for THEATRICAL; both max_daily_hours 10.00."
            - "STANDARD project with stage_hours_authorized 4.00, no bookings yet (available 4.00)."
            - "Requested PREMIX window 2026-09-14T10:00:00Z -> 16:00:00Z = 6.00 hours on THEATRICAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-stages"
              payload: { room_code: "STAGE_H", display_name: "Stage H", hourly_rate_cents: 100000, supports_remote_review: true, changeover_minutes: 45 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { stage_id: $.data.id }
            - call: "POST /mixers"
              payload: { full_name: "Uncertified Uma", certified_platforms: ["STREAMING"], max_daily_hours: 10.00 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { mixer_uncertified_id: $.data.id }
            - call: "POST /mixers"
              payload: { full_name: "Certified Cleo", certified_platforms: ["THEATRICAL"], max_daily_hours: 10.00 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { mixer_certified_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Feature Kappa", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z", turnaround_class: "STANDARD", stage_hours_authorized: 4.00 }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_first: $.data.version, available_before: $.data.stage_hours_available }
          trigger:
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v_first}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_uncertified_id}", booking_type: "PREMIX", platform: "THEATRICAL", window_start_utc: "2026-09-14T10:00:00Z", window_end_utc: "2026-09-14T16:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { capability_error: $.data.error_id }
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_second: $.data.version }
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v_second}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_certified_id}", booking_type: "PREMIX", platform: "THEATRICAL", window_start_utc: "2026-09-14T10:00:00Z", window_end_utc: "2026-09-14T16:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { fiscal_error: $.data.error_id }
          assert:
            - "the uncertified attempt returns HTTP 422 with error_id == ERR_MIXER_NOT_CERTIFIED"
            - "the uncertified attempt does NOT return ERR_STAGE_HOURS_EXCEEDED"
            - "the certified attempt returns HTTP 409 with error_id == ERR_STAGE_HOURS_EXCEEDED"
            - "Project.${proj_id}.stage_hours_reserved == 0.00 after both rejections"
            - "Project.${proj_id}.stage_hours_available == 4.00 after both rejections"
            - "Project.${proj_id}.version is unchanged by both rejected calls"
            - "GET /mix-bookings?project_id=${proj_id} returns an empty list"

  - rule_id: boundary_precision_check
    instances:

      - name: loudness_deviation_exactly_at_tolerance_and_true_peak_exactly_at_max_pass
        grounds:
          - calculations.loudness_qc_verdict
          - entities.PlatformSpec.fields.tolerance_lu
          - entities.PlatformSpec.fields.true_peak_max_dbtp
          - entities.Deliverable.fields.deviation_lu
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          The verdict uses strict comparisons in both dimensions: deviation_lu 0.51 (measured
          -24.51 against target -24.00) fails, while deviation_lu exactly 0.50 == tolerance_lu
          PASSES, and a true peak of exactly -2.00 == true_peak_max_dbtp also PASSES. A `>=`
          implementation rejects the second submission; a rounding to 1 decimal place turns 0.51
          into 0.5 and wrongly passes the first.
