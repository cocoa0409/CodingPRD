        distinguishing_aspect: "zone_code is globally unique across RiskZone: the second create with Z-B54 returns 409 ERR_ZONE_CODE_TAKEN even though every other input differs, and the list still holds exactly one zone."
        test_recipe:
          setup:
            - "One zone with zone_code Z-B54."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
