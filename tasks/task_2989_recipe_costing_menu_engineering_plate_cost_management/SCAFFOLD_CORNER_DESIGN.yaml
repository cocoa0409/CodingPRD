              as: CulinaryDirector
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { rev_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/mix-lines"
              payload: { menu_item_id: "${mi_id}", units_sold: 100, gross_sales_cents: 40000 }
              as: CostAnalyst
              captures: { ml_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-15T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed2_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed2_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 33000000, effective_from: "2026-07-15T00:00:00.000Z" }
              as: CostAnalyst
              captures: { line2_id: $.data.id, line2_status0: $.data.status }
          trigger:
            - call: "POST /culinary/menu-period-reviews/${rev_id}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 10500, received_base_units: 0, counted_base_units: 300 }
              as: CostAnalyst
              captures: { cl_id: $.data.id, cl_used: $.data.used_base_units, cl_exp: $.data.expected_base_units, cl_var: $.data.variance_base_units, cl_sync: $.data.sync_state, cl_valued: $.data.valued_usage_micros }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/classify"
              as: CostAnalyst
              captures: { rev_pop: $.data.popularity_threshold_bps, rev_margin: $.data.margin_threshold_cents, rev_st: $.data.status }
            - call: "GET /culinary/menu-items/${mi_id}"
              as: CostAnalyst
              captures: { class_before: $.data.margin_class, plate_before: $.data.plate_cost_cents, state_before: $.data.plate_cost_state }
            - call: "POST /culinary/price-feeds/${feed2_id}/publish"
              as: CostAnalyst
              captures: { feed_status: $.data.status, feed_published_at: $.data.published_at }
            - call: "GET /culinary/recipes/${grill_id}"
              as: CostAnalyst
              captures: { recipe_state_now: $.data.cost_state, recipe_batch_now: $.data.batch_cost_micros }
            - call: "GET /culinary/menu-items/${mi_id}"
              as: CostAnalyst
              captures: { class_now: $.data.margin_class, state_now: $.data.plate_cost_state, plate_now: $.data.plate_cost_cents }
            - call: "GET /culinary/menu-period-reviews/${rev_id}/count-lines"
              payload: { limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { cl_sync_now: "$.data[0].sync_state", cl_exp_now: "$.data[0].expected_base_units" }
            - call: "GET /culinary/menu-period-reviews/${rev_id}/mix-lines"
              payload: { limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { ml_class_now: "$.data[0].margin_class", ml_snap_now: "$.data[0].plate_cost_cents_snapshot" }
          assert:
            - "the write's OWN response already carries the derived fields: ${cl_used} == 10200, ${cl_exp} == 10000, ${cl_var} == 200 and ${cl_sync} == CURRENT, with ${cl_valued} == 0 because valuation is deferred to the close and not to a background job"
            - "${rev_st} == CLASSIFIED with ${rev_pop} == 7000 and ${rev_margin} == 300 returned by the classify call itself"
            - "${class_before} == STAR, ${plate_before} == 100 and ${state_before} == FRESH — the classification is visible on the item in the read that immediately follows the classify"
            - "${line2_status0} == PENDING and, after publication, ${feed_status} == PUBLISHED with ${feed_published_at} == the logical clock — HOP 1 is in the publish response"
            - "${recipe_state_now} == STALE in the very next read, with ${recipe_batch_now} == 3880071 unchanged: the invalidation is immediate, the recomputation is explicit"
            - "${class_now} == UNCLASSIFIED and ${state_now} == STALE with ${plate_now} == 100 — the five-hop cascade reached the margin class before the publish call returned, so no retry loop is ever needed to observe it"
            - "${cl_sync_now} == CURRENT and ${cl_exp_now} == 10000 — the price move is deliberately NOT a specification move, so the count sheet is untouched; immediate consistency is not permission to invalidate everything"
            - "${ml_class_now} == STAR and ${ml_snap_now} == 100 — the mix line keeps both its classification and its snapshot, so 'immediately visible' never means 'retroactively rewritten'"
