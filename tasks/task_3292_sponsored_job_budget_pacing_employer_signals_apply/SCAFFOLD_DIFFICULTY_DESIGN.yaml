              as: Employer
              as_user_id: "${emp_pp}"
              captures: { camp_pp: $.data.id }
            - call: "POST /api/campaigns/${camp_pp}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_pp}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_pp}", job_posting_id: "${post_pp}", cpc_bid_cents: 300, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_pp}"
              captures: { sj_pp: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T00:00:00Z" }
