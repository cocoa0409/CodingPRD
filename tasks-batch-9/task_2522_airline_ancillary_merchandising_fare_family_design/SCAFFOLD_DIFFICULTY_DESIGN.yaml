              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AA500", origin: "JFK", destination: "LAX", scheduled_departure_utc: "2026-09-15T14:00:00Z", cabin_seat_total: 180 }
