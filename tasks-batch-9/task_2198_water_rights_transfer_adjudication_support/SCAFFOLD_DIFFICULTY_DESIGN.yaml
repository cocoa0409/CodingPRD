              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /transfer-applications
              payload: {water_right_id: "${right_id}", hcu_study_id: "${study_id}", application_type: CHANGE_OF_USE, requested_af: 40.00, proposed_purpose_of_use: MUNICIPAL}
              as: WaterRightsAnalyst
              captures: {app_id: id}
            - call: POST /transfer-applications/${app_id}/injury-analyses
              payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}
              as: WaterRightsAnalyst
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v2: version}
            - call: POST /transfer-applications/${app_id}/submit
              payload: {expected_water_right_version: "${right_v2}"}
              as: WaterRightsAnalyst
            - call: POST /transfer-applications/${app_id}/publish
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-05T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /protests
              payload: {transfer_application_id: "${app_id}", protestant_claimant_id: "${claimant_b_id}", claimed_injury_af: 8.00, basis: INJURY_TO_SENIOR_RIGHT}
              as: Claimant
              as_user_id: "${claimant_b_id}"
              captures: {protest_b_id: id}
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-30T23:59:59Z"}
              as: WaterRightsAnalyst
          trigger: >-
            CONTROL first, at 2026-03-30T23:59:59Z: POST /protests as Claimant
            (X-User-ID ${claimant_b_id}) with {transfer_application_id:
            "${app_id}", protestant_claimant_id: "${claimant_b_id}",
            claimed_injury_af: 8.00, basis: PUBLIC_INTEREST}. Then set the clock
            to exactly 2026-03-31T00:00:00Z and repeat the identical POST
            /protests body.
          assert: |
            CONTROL (clock 2026-03-30T23:59:59Z, inside the window):
              409 with error id ERR_DUPLICATE_PROTEST   # priority 39 fires alone
            TRIGGER (clock exactly 2026-03-31T00:00:00Z == protest_deadline):
              422 with error id ERR_PROTEST_WINDOW_CLOSED   # priority 32 wins
              and NOT 409 ERR_DUPLICATE_PROTEST
            No Protest row is created by either call: GET
            /protests?transfer_application_id=${app_id} still returns exactly 1
            row and app.unresolved_protest_count == 1.
            Filing at the deadline instant is late by design: the window test is
            strict `<`, so 2026-03-30T23:59:59Z is in and 2026-03-31T00:00:00Z is out.

      - name: lease_window_conflict_beats_insufficient_credit
        grounds: validations[priority=41]
        distinguishing_aspect: >-
          One POST /lease-assignments violates priority 41 (business_constraint
          — the candidate at a DIFFERENT headgate of the same right starts
          2026-07-01, inside the closed 7-day fallow buffer that the existing
          POD1 lease projects out to 2026-07-07) and simultaneously violates
          priority 46 (business_fiscal — available_credit_af is exactly 0.00
          because the first lease committed the whole 100.00 af deposit). The
          answer must be 409 ERR_LEASE_WINDOW_CONFLICT; moving the candidate one
          day later to 2026-07-08 clears rule 41 and exposes rule 46's 422
          ERR_INSUFFICIENT_BANK_CREDIT on otherwise identical input.
