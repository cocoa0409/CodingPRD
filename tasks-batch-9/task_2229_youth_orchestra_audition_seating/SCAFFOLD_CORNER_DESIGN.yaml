      - name: season_gate_errors_separate_wrong_hop_from_unmet_precondition
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SEASON_PRECONDITION_UNMET]
          - errors[ERR_SEASON_NOT_ACCEPTING_AUDITIONS]
          - errors[ERR_INVALID_SEASON_TRANSITION]
          - validations[priority 20]
          - validations[priority 40]
          - validations[priority 46]
        distinguishing_aspect: |
          Two different reasons an advance-status call can fail must not be conflated: a
          hop that is not the declared successor is 409 ERR_INVALID_SEASON_TRANSITION
          (priority 20), while the RIGHT hop whose data precondition is unmet is 409
          ERR_SEASON_PRECONDITION_UNMET (priority 46) - here an ensemble with no
          SectionQuota blocks AUDITIONS_OPEN, and an unseated ensemble blocks IN_SEASON.
          Once the season has left AUDITIONS_OPEN, slot creation and audition registration
          report 409 ERR_SEASON_NOT_ACCEPTING_AUDITIONS (priority 40) rather than any
          transition error - the season row itself is untouched by those calls.
        test_recipe:
          setup:
            - "A Season in PLANNING whose audition window is 2026-08-10..2026-08-20, one"
            - "Philharmonic ensemble WITHOUT any SectionQuota, two available VIOLIN panelists"
            - "and one PROSPECT member. The logical clock reads 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Ada Strings", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B", years_in_org: 1, sibling_enrolled: false, alumni_engagement_opt_in: false }
              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel One", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Two", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p2_id: "$.data.id" }
          trigger:
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "PLACEMENT" }
              as: ArtisticDirector
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "PLANNING" }
              as: ArtisticDirector
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "PLACEMENT" }
              as: ArtisticDirector
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R1", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T11:00:00Z", panelist_ids: ["${p1_id}", "${p2_id}"], instrument_focus: "VIOLIN", quorum_required: 2 }
              as: RegistrarStaff
              captures: { e_slot_state: "$.data.error_id" }
            - call: "POST /auditions"
              payload: { member_id: "${m1_id}", season_id: "${season_id}", declared_program: "Late Program", excerpt_ids: ["EX1"] }
              as: Guardian
              as_user_id: "${m1_id}"
              captures: { e_audition_state: "$.data.error_id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "IN_SEASON" }
              as: ArtisticDirector
            - call: "GET /seasons/${season_id}"
              as: ArtisticDirector
          assert:
            - "trigger[0] -> 409 with data.error_id == \"ERR_INVALID_SEASON_TRANSITION\" (PLANNING -> PLACEMENT skips a hop)"
            - "trigger[1] -> 409 with data.error_id == \"ERR_SEASON_PRECONDITION_UNMET\" (the only ensemble owns no SectionQuota)"
            - "trigger[2] -> 201 (the missing quota is created)"
            - "trigger[3] -> 200 with data.status == \"AUDITIONS_OPEN\" and data.version == 2 (same hop, now admissible)"
            - "trigger[4] -> 409 with data.error_id == \"ERR_INVALID_SEASON_TRANSITION\" (AUDITIONS_OPEN -> PLANNING is a reversal)"
            - "trigger[5] -> 200 with data.status == \"PLACEMENT\" (no audition is SCORED or REVISION_REQUESTED)"
            - "trigger[6] -> 409 with data.error_id == \"ERR_SEASON_NOT_ACCEPTING_AUDITIONS\" (slot creation needs AUDITIONS_OPEN)"
            - "trigger[7] -> 409 with data.error_id == \"ERR_SEASON_NOT_ACCEPTING_AUDITIONS\" (registration needs PLANNING or AUDITIONS_OPEN)"
            - "trigger[8] -> 409 with data.error_id == \"ERR_SEASON_PRECONDITION_UNMET\" (seated_ensemble_count 0 != ensemble_count 1)"
            - "trigger[9] -> 200 with data.status == \"PLACEMENT\" and data.seated_ensemble_count == 0 (all six rejections left the season row untouched)"

      - name: panel_integrity_and_slot_capacity_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_AUDITION_SLOT_FULL]
          - errors[ERR_PANEL_CONFLICT_OF_INTEREST]
          - errors[ERR_PANELIST_NOT_ON_PANEL]
          - errors[ERR_DUPLICATE_PANEL_SCORE]
          - validations[priority 50]
          - validations[priority 51]
          - validations[priority 62]
          - validations[priority 66]
        distinguishing_aspect: |
          Three ways to be the wrong panelist are three different errors: Conflicted Carla
          IS on the panel but declares Ada in conflict_member_ids, so blind-panel integrity
          answers 403 ERR_PANEL_CONFLICT_OF_INTEREST at priority 50; Outside Otto is not in
          the slot's panelist_ids at all and Cello Cora is listed but her
          instrument_expertise is CELLO against a VIOLIN focus - both answer 403
          ERR_PANELIST_NOT_ON_PANEL at priority 51. A legitimate second sheet from Panel One
          for the same (audition, panelist, revision_round) is 409
          ERR_DUPLICATE_PANEL_SCORE, and because only one of the required three sheets
          exists the audition is still SCHEDULED, so the duplicate check - not the state
          check - is what fires. Separately, the slot's capacity is 1 and Ada already booked
          it, so Ben's schedule call is 409 ERR_AUDITION_SLOT_FULL.
