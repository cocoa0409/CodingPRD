    input: []
    output: ChargeStatement
    side_effects: ["statement -> UNDER_AUDIT; variance computed"]

  - method: POST
    path: "/ui/charge-statements/{id}/audit/complete"
    description: "Complete audit"
    roles: [ChargeAuditor]
    code: 200
    input: []
    output: ChargeStatement
    side_effects: ["statement -> AUDIT_COMPLETE"]

  - method: POST
    path: "/ui/charge-statements/{id}/reconcile"
    description: "Reconcile statement into employer ledger"
    roles: [ChargeAuditor]
    code: 200
    input: []
    output: ChargeStatement
    side_effects: ["statement -> RECONCILED; employer protest_credits += reversed totals; rating models SUPERSEDED"]

  - method: GET
    path: "/ui/charge-line-items/{id}"
    description: "Get line item"
    roles: [PlatformAdmin, ChargeAuditor, AgencyLiaison]
    code: 200
    input: []
    output: ChargeLineItem
    side_effects: []

  - method: GET
    path: "/ui/charge-line-items/{id}/protests"
    description: "Protests on a line"
    roles: [PlatformAdmin, ChargeAuditor, AgencyLiaison]
    code: 200
    input: []
    output: "ChargeProtest[]"
    side_effects: []

  - method: POST
    path: "/ui/charge-line-items/{id}/protests"
    description: "File charge protest (OCC on statement)"
    roles: [ChargeAuditor]
    code: 201
    input: [protest_basis, expected_statement_version]
    output: ChargeProtest
    side_effects: ["line PENDING -> PROTESTED; evidence_strength computed; statement bubble-up to UNDER_AUDIT; increments ChargeStatement.version by 1"]

  - method: POST
    path: "/ui/charge-line-items/{id}/waive"
    description: "Agency waives a pending charge line"
    roles: [AgencyLiaison]
    code: 200
    input: []
    output: ChargeLineItem
    side_effects: ["line PENDING -> WAIVED; statement total, claim charged, employer reserve adjusted; no protest_credits accrual"]

  - method: GET
    path: "/ui/charge-protests/{id}"
    description: "Get protest"
    roles: [PlatformAdmin, ChargeAuditor, AgencyLiaison]
    code: 200
    input: []
    output: ChargeProtest
    side_effects: []

  - method: POST
    path: "/ui/charge-protests/{id}/review"
    description: "Open protest review"
    roles: [AgencyLiaison]
    code: 200
    input: []
    output: ChargeProtest
    side_effects: ["protest FILED -> UNDER_REVIEW"]

  - method: POST
    path: "/ui/charge-protests/{id}/sustain"
    description: "Sustain protest"
    roles: [AgencyLiaison]
    code: 200
    input: []
    output: ChargeProtest
    side_effects: ["protest -> SUSTAINED; line -> REVERSED; ledger credit cascades"]

  - method: POST
    path: "/ui/charge-protests/{id}/deny"
    description: "Deny protest"
    roles: [AgencyLiaison]
    code: 200
    input: []
    output: ChargeProtest
    side_effects: ["protest -> DENIED; line -> SUSTAINED; posture half-strike"]

  - method: POST
    path: "/ui/charge-protests/{id}/withdraw"
    description: "Withdraw protest"
    roles: [ChargeAuditor]
    code: 200
    input: []
    output: ChargeProtest
    side_effects: ["protest -> WITHDRAWN; line -> PENDING (compensation)"]

  # --- Experience rating models ---
  - method: POST
    path: "/ui/employers/{id}/experience-rating-models"
    description: "Create a rating projection model"
    roles: [RatingAnalyst]
    code: 201
    input: [model_year, variant, kind]
    output: ExperienceRatingModel
    side_effects: ["experience_rating_projection computed; input_snapshot_hash stored"]

  - method: GET
    path: "/ui/experience-rating-models/{id}"
    description: "Get model"
    roles: [PlatformAdmin, RatingAnalyst]
    code: 200
    input: []
    output: ExperienceRatingModel
    side_effects: []

  - method: POST
    path: "/ui/employers/{id}/experience-rating-models/{mid}/finalize"
    description: "Finalize model (OCC on employer; supersedes prior official)"
    roles: [RatingAnalyst]
    code: 200
    input: [expected_employer_version]
    output: ExperienceRatingModel
    side_effects: ["model DRAFT -> FINALIZED; prior FINALIZED OFFICIAL for employer+year -> SUPERSEDED; increments EmployerAccount.version by 1"]

  - method: GET
    path: "/ui/employers/{id}/rating-summary"
    description: "Computed read: current rate, posture, strikes, credits"
    roles: [PlatformAdmin, RatingAnalyst, ChargeAuditor]
    code: 200
    input: []
    output: { current_tax_rate_bps: integer, compliance_posture: string, late_response_strikes: integer, protest_credits_cents: integer }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or enum out of domain" }
  - { id: ERR_CROSS_PARENT_REFERENCE, http: 422, condition: "Body FK resolves but belongs to a different parent than the path scope" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure on an action endpoint" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match parent version (OCC)" }
  - { id: ERR_CLAIM_NOT_RESPONSIVE, http: 409, condition: "Claim not in NOTICE_RECEIVED when drafting first response" }
  - { id: ERR_RESPONSE_NOT_DRAFT, http: 409, condition: "Response not DRAFT at submit" }
  - { id: ERR_RESPONSE_INCOMPLETE, http: 422, condition: "completeness_score < 40 at submit" }
  - { id: ERR_RESPONSE_NOT_SUBMITTED, http: 409, condition: "Accept/reject attempted on non-SUBMITTED response" }
  - { id: ERR_CLAIM_NOT_UNDER_ADJUDICATION, http: 409, condition: "Determination posted while claim not UNDER_ADJUDICATION" }
  - { id: ERR_CLAIM_NOT_CLOSABLE, http: 409, condition: "Close attempted on non-DETERMINED claim" }
  - { id: ERR_CLAIM_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw attempted beyond RESPONSE_IN_PROGRESS" }
  - { id: ERR_DETERMINATION_NOT_APPEALABLE, http: 409, condition: "Appeal filed against non-ISSUED determination" }
  - { id: ERR_DETERMINATION_NOT_FINAL, http: 409, condition: "Claim close blocked: determination not FINAL" }
  - { id: ERR_APPEAL_IN_FLIGHT, http: 409, condition: "Claim close blocked by open appeal" }
  - { id: ERR_APPEAL_NOT_DOCKETABLE, http: 409, condition: "Hearing scheduled on non-FILED appeal" }
  - { id: ERR_APPEAL_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw attempted on terminal/HEARD appeal" }
  - { id: ERR_APPEAL_NOT_HEARD, http: 409, condition: "Decide attempted before hearing held" }
  - { id: ERR_HEARING_NOT_READY, http: 409, condition: "Hold attempted while hearing not READY" }
  - { id: ERR_REFEREE_DOUBLE_BOOKED, http: 409, condition: "Referee has another SCHEDULED/HELD hearing within 30-minute buffer of the interval" }
  - { id: ERR_WITNESS_UNAVAILABLE, http: 409, condition: "Witness availability window does not contain the hearing interval" }
  - { id: ERR_CONTINUANCE_LIMIT, http: 409, condition: "continuance_count already 3" }
  - { id: ERR_TPA_SCOPE_VIOLATION, http: 403, condition: "TPA authority_scope does not cover the attempted filing" }
  - { id: ERR_TPA_WINDOW_OVERLAP, http: 409, condition: "New engagement window intersects an existing non-TERMINATED engagement for the same employer (closed-closed interval intersection)" }
  - { id: ERR_TPA_NOT_ACTIVE, http: 403, condition: "Engagement SUSPENDED/TERMINATED or outside effective window at filing time" }
  - { id: ERR_TPA_NOT_SUSPENDED, http: 409, condition: "Reinstate attempted on non-SUSPENDED engagement" }
  - { id: ERR_TPA_HAS_OPEN_WORK, http: 409, condition: "Terminate blocked: engagement owns in-progress responses" }
  - { id: ERR_REMEDIATION_NOTE_SHORT, http: 422, condition: "Reinstate note shorter than 20 characters" }
  - { id: ERR_CODING_EVIDENCE_MISSING, http: 422, condition: "Misconduct coding confirm lacks warning/policy/incident evidence" }
  - { id: ERR_WINDOW_VIOLATION, http: 422, condition: "Filing outside its computed window where window is hard, or hearing end <= start" }
  - { id: ERR_STATEMENT_NOT_AUDITABLE, http: 409, condition: "Audit opened on non-ISSUED statement" }
  - { id: ERR_STATEMENT_NOT_RECONCILABLE, http: 409, condition: "Reconcile attempted on statement not AUDIT_COMPLETE" }
  - { id: ERR_PROTESTS_IN_FLIGHT, http: 409, condition: "Audit-complete or reconcile blocked by PROTESTED lines / open protests" }
  - { id: ERR_LINE_NOT_PROTESTABLE, http: 409, condition: "Protest filed on non-PENDING line" }
  - { id: ERR_LINE_NOT_WAIVABLE, http: 409, condition: "Waive attempted on non-PENDING line" }
  - { id: ERR_LINE_ALREADY_PROTESTED, http: 409, condition: "Second protest on a line whose prior protest is not DENIED" }
  - { id: ERR_PROTEST_NOT_REVIEWABLE, http: 409, condition: "Review attempted on non-FILED protest" }
  - { id: ERR_PROTEST_EVIDENCE_WEAK, http: 422, condition: "Sustain attempted with evidence_strength < 60" }
  - { id: ERR_MAX_BENEFIT_EXCEEDED, http: 422, condition: "Posting line would push claim.charged_amount_cents above max_benefit_cents" }
  - { id: ERR_FISCAL_CAP_EXCEEDED, http: 422, condition: "Generic aggregate fiscal cap violation (negative amounts, overflow)" }
  - { id: ERR_DUPLICATE_ACTIVE_RECORD, http: 409, condition: "Duplicate state_claim_number in state, or second FINALIZED OFFICIAL model without supersede, or duplicate open protest" }
  - { id: ERR_MODEL_NOT_DRAFT, http: 409, condition: "Finalize attempted on non-DRAFT model" }
  - { id: ERR_MODEL_VARIANT_MISMATCH, http: 422, condition: "OFFICIAL model variant differs from employer.merit_rating_method" }
  - { id: ERR_MODEL_INPUT_STALE, http: 409, condition: "input_snapshot_hash no longer matches current inputs at finalize" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; seeds state rules, employers, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /ui/state-rules"
      - "POST /ui/employers"
    shared_operations:
      - "GET endpoints across all resources"

  - name: ClaimsAnalyst
    description: "Employer-side analyst: intake, separation coding, response drafting, evidence, hearings, appeals"
    identity: opaque
    exclusive_operations:
      - "POST /ui/separations"
      - "POST /ui/separations/{id}/coding/confirm"
      - "POST /ui/claims/{id}/close"
      - "POST /ui/appeals/{id}/withdraw"
      - "POST /ui/appeals/{id}/hearings"
      - "POST /ui/hearings/{id}/witnesses"
      - "POST /ui/hearings/{id}/witnesses/{id}/prep"
      - "POST /ui/hearings/{id}/continue"
      - "DELETE /ui/evidence/{id}"
    shared_operations:
      - "POST /ui/claims (with AgencyLiaison)"
      - "POST /ui/claims/{id}/responses (with TpaAgent)"
      - "POST /ui/claims/{id}/responses/{id}/submit (with TpaAgent)"
      - "POST /ui/claims/{id}/evidence (with TpaAgent)"
      - "POST /ui/determinations/{id}/appeals (with AgencyLiaison)"
      - "GET endpoints"

  - name: TpaAgent
    description: "Third-party administrator filer acting under a TpaEngagement's scope"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /ui/claims/{id}/responses"
      - "POST /ui/claims/{id}/responses/{id}/submit"
      - "POST /ui/claims/{id}/evidence"
      - "GET /ui/claims, /ui/claims/{id}, /ui/claims/{id}/responses, /ui/claims/{id}/evidence, /ui/state-rules"

  - name: AgencyLiaison
    description: "State-agency side: determinations, appeal decisions, charge statements, protest adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /ui/claims/{id}/determinations"
      - "POST /ui/claims/{id}/responses/{id}/accept"
      - "POST /ui/claims/{id}/responses/{id}/reject"
      - "POST /ui/appeals/{id}/decide"
      - "POST /ui/hearings/{id}/hold"
      - "POST /ui/claims/{id}/withdraw"
      - "POST /ui/charge-statements"
      - "POST /ui/charge-statements/{id}/line-items"
      - "POST /ui/charge-line-items/{id}/waive"
      - "POST /ui/charge-protests/{id}/review"
      - "POST /ui/charge-protests/{id}/sustain"
      - "POST /ui/charge-protests/{id}/deny"
    shared_operations:
      - "POST /ui/claims (with ClaimsAnalyst)"
      - "POST /ui/determinations/{id}/appeals (with ClaimsAnalyst)"
      - "GET endpoints"

  - name: ChargeAuditor
    description: "Employer-side charge statement auditor and protest filer"
    identity: opaque
    exclusive_operations:
      - "POST /ui/charge-statements/{id}/audit"
      - "POST /ui/charge-statements/{id}/audit/complete"
      - "POST /ui/charge-statements/{id}/reconcile"
      - "POST /ui/charge-line-items/{id}/protests"
      - "POST /ui/charge-protests/{id}/withdraw"
    shared_operations:
      - "GET endpoints incl. /ui/employers/{id}/rating-summary"

  - name: RatingAnalyst
    description: "Employer-side experience-rating modeler"
    identity: opaque
    exclusive_operations:
      - "POST /ui/employers/{id}/experience-rating-models"
      - "POST /ui/employers/{id}/experience-rating-models/{id}/finalize"
    shared_operations:
      - "GET /ui/employers/{id}/rating-summary and other GET endpoints"

  - name: TpaManager
    description: "Oversees TPA engagements: suspend, reinstate, terminate"
    identity: opaque
    exclusive_operations:
      - "POST /ui/tpa-engagements"
      - "POST /ui/tpa-engagements/{id}/suspend"
      - "POST /ui/tpa-engagements/{id}/reinstate"
      - "POST /ui/tpa-engagements/{id}/terminate"
    shared_operations:
      - "GET /ui/employers/{id}/tpa-engagements, GET /ui/tpa-engagements/{id}"
