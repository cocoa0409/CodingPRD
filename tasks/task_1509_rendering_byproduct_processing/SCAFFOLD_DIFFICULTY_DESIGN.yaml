          from state-vs-safety: confirm violates both (allocated lot fails the contract spec:
          moisture 0.9 > 0.5 and FFA 6.0 > 4.0; margin 11.63% < floor 20.0%) and the safety
          error ERR_SPEC_BELOW_CONTRACT_MIN must win over ERR_MARGIN_FLOOR_BREACH.
