    roles: [SalesRep]
    code: 200
    input: []
    output: MaterialTakeoff
    side_effects: ["estimated_amount_cents frozen (locked_at_quote variant)"]

  - method: POST
    path: "/roofing/takeoffs/{id}/revise"
