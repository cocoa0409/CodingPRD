      - name: chamber_capacity_equality_allowed
        grounds:
          - calculations.chamber_occupancy
          - state_machines.SamplingTimePoint.PENDING_to_PULLED
        distinguishing_aspect: |
          Boundary on the unit-count metric via POST .../pull (distinct metric and
          endpoint from the mean-threshold instance): reserved 3 + pull 2 ==
          capacity 5 is ALLOWED (<=), while one further unit (5 + 1 > 5) is
          rejected with ERR_CHAMBER_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "REAL_TIME study IN_PROGRESS; tp0; arms STANDARD_FILM (control) and MAP; chamber CH-EQ capacity 5 at 20C"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Cap Co", contact_email: "cap@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Coffee", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_c: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "MAP", is_control: false }, as: SensoryScientist, captures: { arm_v: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp_id: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-EQ", temp_c: 20, capacity_units: 5 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
          trigger:
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_c}", quantity: 3, unit_purpose: "RETAIN" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_v}", quantity: 2, unit_purpose: "RETAIN" }, as: SensoryScientist }
            - { call: "GET /sensory-lab/chambers/${chamber_id}", payload: {}, as: LabDirector, captures: { res_full: $.data.reserved_units } }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_v}", quantity: 1, unit_purpose: "RETAIN" }, as: SensoryScientist, captures: { err_over: $.data.error_id } }
          assert:
            - "pull #1 (quantity 3) succeeds: reserved_units 3 <= 5"
            - "pull #2 (quantity 2) succeeds: 3 + 2 == 5 — equality against capacity is ALLOWED"
            - "StorageChamber.${chamber_id}.reserved_units == 5"
            - "pull #3 (quantity 1) rejected with ERR_CHAMBER_CAPACITY_EXCEEDED (5 + 1 > 5); reserved_units remains 5"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (Session x SampleUnit; Report x Claim)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_open_requires_pulled_samples
        grounds:
          - state_machines.EvaluationSession.PLANNED_to_OPEN
          - state_machines.SamplingTimePoint.PENDING_to_PULLED
        distinguishing_aspect: |
          Entity pair EvaluationSession -> SamplingTimePoint/SampleUnit: opening
          a session before any unit is pulled for its (time_point, arm) fails
          with ERR_NO_PULLED_SAMPLES; after the pull the same open succeeds.
        test_recipe:
          setup:
            - "REAL_TIME study IN_PROGRESS; tp0 (day 0); control arm; session S (tp0, control, 2026-08-01 10:00-11:00); chamber CH-OP; clock 2026-08-01T10:00:00Z (inside the open window)"
