      - name: an_agency_cannot_concur_with_or_counter_its_own_proposal_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=16]
          - errors.ERR_SELF_CONCURRENCE
          - state_machines.DiscrepancyCase.PROPOSAL_PENDING_to_CONCURRED
          - calculations.discrepancy_proposal_projection
        distinguishing_aspect: "Priority 16 guards both halves of the negotiation: the OPENER that filed the current proposal can neither concur with it nor file the next counter, and the case version stays at 2 through both refusals before the COUNTERPARTY concurs and moves it to 3."
        test_recipe:
          setup:
            - "One jurisdiction LARCO, one DRAFT centerline \"N MAPLE STREET\", two ACTIVE agencies a1 (LAW) and a2 (FIRE)."
            - "One ROAD_NAME case opened by a1 against a2 over that centerline, with one proposal filed by a1 (round 1, side OPENER)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { a1_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { a2_id: $.data.id }
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${a2_id}", description: "Sheriff CAD shows N MAPLE ST; fire shows MAPLE ST N" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "N MAPLE STREET", expected_case_version: "${case_v1}", rationale: "Matches the recorded plat" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { prop1_id: $.data.id }
            - call: "GET /gis/discrepancy-cases/${case_id}"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /gis/discrepancy-cases/${case_id}/concur"
              payload: { proposal_id: "${prop1_id}" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /gis/discrepancy-cases/${case_id}/proposals"
              payload: { proposed_value: "NORTH MAPLE STREET", expected_case_version: "${case_v2}", rationale: "Self counter" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /gis/discrepancy-cases/${case_id}/concur"
              payload: { proposal_id: "${prop1_id}" }
              as: AgencyLiaison
              as_user_id: "${a2_id}"
          assert:
            - "the a1 concur returns status_code == 403 with ${e1} == \"ERR_SELF_CONCURRENCE\""
            - "the a1 counter-proposal returns status_code == 403 with ${e2} == \"ERR_SELF_CONCURRENCE\"   # an agency may not counter itself"
            - "after both refusals DiscrepancyCase.${case_id}.status == \"PROPOSAL_PENDING\" and version == 2 and round_count == 1"
            - "GET /gis/discrepancy-cases/${case_id}/proposals returns meta.total_count == 1 — the refused counter appended nothing"
            - "DiscrepancyProposal.${prop1_id}.proposed_by_side == \"OPENER\" and round_number == 1 and status == \"PENDING\""
            - "the a2 concur returns status_code == 200 with DiscrepancyCase.${case_id}.status == \"CONCURRED\""
            - "DiscrepancyCase.${case_id}.concurred_by_side == \"COUNTERPARTY\" and current_proposal_id == \"${prop1_id}\" and version == 3"
            - "DiscrepancyCase.${case_id}.opened_by_agency_id == \"${a1_id}\" and resolved_value == null   # adoption, not concurrence, writes the value"

      - name: coverage_cell_creation_is_shared_by_the_admin_and_the_analyst
        claim_type: shared_operations
        grounds:
          - roles.SystemAdmin.shared_operations
          - roles.GisAnalyst.shared_operations
          - endpoints[POST /gis/coverage-cells]
        distinguishing_aspect: "POST /gis/coverage-cells is the single shared write in the model: both SystemAdmin and GisAnalyst create cells successfully in the same jurisdiction, and the shared writes accumulate into one counter set (cell_count 2, gap_pair_count 6) rather than being partitioned by role."
        test_recipe:
          setup:
