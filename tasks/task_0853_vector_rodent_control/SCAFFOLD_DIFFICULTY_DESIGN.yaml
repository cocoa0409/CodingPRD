  - rule_id: non_linear_state_machine
    instances:
      - name: abatement_order_escalation_cycle_returns_to_served
        grounds:
          - state_machines.AbatementOrder.SERVED_to_REINSPECTION_SCHEDULED
          - state_machines.AbatementOrder.REINSPECTION_SCHEDULED_to_ESCALATED
          - state_machines.AbatementOrder.ESCALATED_to_SERVED
          - calculations.abatement_compliance_deadline
          - entities.AbatementOrder.fields.escalation_level
        distinguishing_aspect: |
          The AbatementOrder machine is cyclic: the row leaves SERVED, passes through
          REINSPECTION_SCHEDULED and ESCALATED and re-enters SERVED under a FINAL_WARNING
          service, carrying escalation_level 1 forward and shortening the compliance window
          from 7 days to 7 days measured from the NEW service instant, which no linear
          pipeline can express.
        test_recipe:
          setup:
            - "A SEVERE-tier order on APN-1001 was served on 2026-05-05T10:00:00Z with compliance_deadline 2026-05-12T10:00:00Z"
            - "A re-inspection on 2026-05-12 returned NON_COMPLIANT, so the order sits in ESCALATED with escalation_level 1"
