scenario: "1038. House-Swap & Home-Exchange Network: member & home listing, points/reciprocal & balance, exchange request & agreement, verification & trust, insurance/damage, calendar & availability, dispute, membership"
domain_name: house-swap-exchange
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential   # ExchangeRequest links two HomeListings (target + offered) owned by two Members
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: login email, unique across members
        constraints: unique; non-empty
      - name: full_name
        type: string
        source: input
        description: member display name
      - name: home_city
        type: string
        source: input
        description: member's home city (informational)
      - name: verification_status
        type: enum
        source: computed
        description: "VERIFIED iff the member has at least one Verification of type IDENTITY in status VERIFIED; else UNVERIFIED"
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED}"
      - name: active_membership_tier
        type: enum
        source: computed
        description: "tier of this member's Membership currently in status ACTIVE (given logical clock), else null"
        constraints: "one of {BASIC, PLUS, PREMIER, null}"
      - name: settled_points_balance
        type: integer
        source: computed
        description: "SETTLED variant: sum of PointsLedgerEntry.amount for member where status==POSTED (see calculations.member_points_balance)"
        default: 0
      - name: available_points_balance
        type: integer
        source: computed
        description: "PROJECTED variant: sum of PointsLedgerEntry.amount for member where status IN {POSTED, HELD} (settled minus outstanding holds)"
        default: 0
      - name: trust_score
        type: integer
        source: computed
        description: "weighted trust score in [0,100] (see calculations.trust_score)"
        default: 50
      - name: completed_exchange_count
        type: integer
        source: system
        description: "number of ExchangeAgreements in status COMPLETED where member is guest or host"
        default: 0
      - name: upheld_damage_count
        type: integer
        source: system
        description: "number of DamageClaims in status SETTLED where member is the respondent"
        default: 0
      - name: disputes_lost_count
        type: integer
        source: system
        description: "number of Disputes in status RESOLVED_FOR_CLAIMANT where member is the respondent"
        default: 0

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the subscriber"
      - name: tier
        type: enum
        source: input
        description: "subscription tier"
        constraints: "one of {BASIC, PLUS, PREMIER}"
      - name: status
        type: enum
        source: system
        description: "lifecycle status"
        default: PENDING_ACTIVATION
        constraints: "one of {PENDING_ACTIVATION, ACTIVE, EXPIRED, CANCELLED}"
      - name: activated_at
        type: datetime
        source: system
        description: "logical-clock instant activation succeeded; null until ACTIVE"
      - name: expires_at
        type: datetime
        source: computed
        description: "activated_at + MEMBERSHIP_TERM_DAYS days; null until ACTIVE"

  - name: HomeListing
    parent: null
    common_fields: true
    fields:
      - name: owner_member_id
        type: string
        source: input
        description: "FK -> Member.id; the home owner"
      - name: title
        type: string
        source: input
        description: listing title
      - name: address_city
        type: string
        source: input
        description: city of the home
      - name: address_country
        type: string
        source: input
        description: ISO country
      - name: points_per_night
        type: integer
        source: input
        description: base nightly points value used in exchange_points_cost
        constraints: ">= 1"
      - name: max_points_per_exchange
        type: integer
        source: input
        description: upper clamp for a single exchange's total points cost
        constraints: ">= MIN_EXCHANGE_POINTS"
      - name: min_trust_score
        type: integer
        source: input
        description: minimum requester trust_score required to open an exchange request against this listing
        default: 0
        constraints: "0..100"
      - name: capacity
        type: integer
        source: input
        description: max guests (informational)
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "lifecycle status"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE}"

  - name: AvailabilityWindow
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> HomeListing.id; the listing this window belongs to"
      - name: start_date
        type: string
        source: input
        description: "inclusive start date (YYYY-MM-DD)"
      - name: end_date
        type: string
        source: input
        description: "exclusive end date (YYYY-MM-DD); window covers half-open [start_date, end_date)"
      - name: nights
        type: integer
        source: computed
        description: "(end_date - start_date) in days; must be >= 1"
      - name: status
        type: enum
        source: system
        description: "OPEN when bookable; BOOKED when consumed by an accepted agreement"
        default: OPEN
        constraints: "one of {OPEN, BOOKED}"

  - name: Verification
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member being verified"
      - name: verification_type
        type: enum
        source: input
        description: "kind of verification"
        constraints: "one of {IDENTITY, HOME}"
      - name: document_ref
        type: string
        source: input
        description: opaque reference to submitted document
      - name: status
        type: enum
        source: system
        description: "review status"
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, VERIFIED, REJECTED}"
      - name: decided_by
        type: string
        source: system
        description: "opaque PlatformAdmin id that decided; null until decided"

  - name: ExchangeRequest
    parent: null
    common_fields: true
    fields:
      - name: requester_member_id
        type: string
        source: input
        description: "FK -> Member.id; the guest who wants to stay at the target listing"
      - name: target_listing_id
        type: string
        source: input
        description: "FK -> HomeListing.id; the home the requester wants to stay in"
      - name: offered_listing_id
        type: string
        source: input
        description: "FK -> HomeListing.id; for RECIPROCAL exchanges, the requester's own home offered in return; null for POINTS"
      - name: exchange_type
        type: enum
        source: input
        description: "POINTS debits points from requester; RECIPROCAL is a home swap with points_cost 0"
        constraints: "one of {POINTS, RECIPROCAL}"
      - name: requested_start_date
        type: string
        source: input
        description: "inclusive check-in date (YYYY-MM-DD)"
      - name: requested_end_date
        type: string
        source: input
        description: "exclusive check-out date (YYYY-MM-DD)"
      - name: points_cost
        type: integer
        source: computed
        description: "computed by exchange_points_cost; 0 for RECIPROCAL"
        default: 0
      - name: hold_ledger_entry_id
        type: string
        source: system
        description: "id of the HELD PointsLedgerEntry reserving points_cost for POINTS requests; null for RECIPROCAL"
      - name: status
        type: enum
        source: system
        description: "negotiation status"
        default: PROPOSED
        constraints: "one of {PROPOSED, COUNTERED, ACCEPTED, DECLINED, WITHDRAWN, EXPIRED}"
      - name: expires_at
        type: datetime
        source: computed
        description: "created_at (or last counter/repropose instant) + REQUEST_TTL_DAYS(=7) days"

  - name: ExchangeAgreement
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: system
        description: "FK -> ExchangeRequest.id; the accepted request that produced this agreement"
      - name: guest_member_id
        type: string
        source: system
        description: "FK -> Member.id; the traveling member (== request.requester_member_id)"
      - name: host_member_id
        type: string
        source: system
        description: "FK -> Member.id; the owner of the target listing"
      - name: listing_id
        type: string
        source: system
        description: "FK -> HomeListing.id; the target listing"
      - name: availability_window_id
        type: string
        source: system
        description: "FK -> AvailabilityWindow.id; the window booked by this agreement"
      - name: exchange_type
        type: enum
        source: system
        description: "copied from the request"
        constraints: "one of {POINTS, RECIPROCAL}"
      - name: check_in
        type: string
        source: system
        description: "inclusive check-in date copied from request.requested_start_date"
      - name: check_out
        type: string
        source: system
        description: "exclusive check-out date copied from request.requested_end_date"
      - name: points_cost
        type: integer
        source: system
        description: "snapshot of request.points_cost at acceptance"
        default: 0
      - name: coverage_limit_points
        type: integer
        source: computed
        description: "damage coverage cap set at confirm from host's active_membership_tier (see calculations.damage_claim_payout constants)"
        default: 0
      - name: insurance_status
        type: enum
        source: system
        description: "NONE before confirm; ACTIVE after confirm; CLAIMED once a DamageClaim is filed"
        default: NONE
        constraints: "one of {NONE, ACTIVE, CLAIMED}"
      - name: refund_points
        type: integer
        source: computed
        description: "points refunded to guest on cancellation (see calculations.cancellation_refund); 0 until cancelled"
        default: 0
      - name: status
        type: enum
        source: system
        description: "agreement lifecycle"
        default: PENDING_CONFIRMATION
        constraints: "one of {PENDING_CONFIRMATION, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED}"

  - name: PointsLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member whose balance this entry affects"
      - name: agreement_id
        type: string
        source: system
        description: "FK -> ExchangeAgreement.id; the agreement that generated this entry; null for WELCOME_BONUS/ADMIN_ADJUSTMENT"
      - name: entry_type
        type: enum
        source: system
        description: "kind of ledger movement"
        constraints: "one of {WELCOME_BONUS, ADMIN_ADJUSTMENT, EXCHANGE_HOLD, EXCHANGE_DEBIT, EXCHANGE_CREDIT, EXCHANGE_REFUND, CREDIT_REVERSAL, DAMAGE_SETTLEMENT, DISPUTE_PENALTY}"
      - name: amount
        type: integer
        source: system
        description: "signed points delta (negative debits, positive credits)"
      - name: status
        type: enum
        source: system
        description: "HELD reserves availability only; POSTED affects settled balance; VOIDED is a released hold"
        default: POSTED
        constraints: "one of {HELD, POSTED, VOIDED}"
      - name: memo
        type: string
        source: system
        description: human-readable note

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ExchangeAgreement.id; the stay the claim is about"
      - name: claimant_member_id
        type: string
        source: input
        description: "FK -> Member.id; the agreement party filing the claim"
      - name: respondent_member_id
        type: string
        source: computed
        description: "the other agreement party (at-fault); == agreement.guest_member_id if claimant==host else agreement.host_member_id"
      - name: claimed_amount
        type: integer
        source: input
        description: "points the claimant requests"
        constraints: ">= 1"
      - name: assessed_amount
        type: integer
        source: system
        description: "adjudicated damage amount set by PlatformAdmin at adjudicate; null until adjudicated"
      - name: provisional_payout
        type: integer
        source: computed
        description: "PROVISIONAL variant at filing from claimed_amount (see calculations.damage_claim_payout)"
        default: 0
      - name: deductible_points
        type: integer
        source: computed
        description: "deductible applied in the FINAL payout"
        default: 0
      - name: final_payout
        type: integer
        source: computed
        description: "FINAL variant at adjudication from assessed_amount; 0 until settled"
        default: 0
      - name: status
        type: enum
        source: system
        description: "claim lifecycle"
        default: FILED
        constraints: "one of {FILED, SETTLED, REJECTED}"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ExchangeAgreement.id; the stay in dispute"
      - name: opened_by_member_id
        type: string
        source: input
        description: "FK -> Member.id; the agreement party opening the dispute (claimant)"
      - name: respondent_member_id
        type: string
        source: computed
        description: "the other agreement party; == agreement.guest_member_id if opener==host else agreement.host_member_id"
      - name: reason
        type: string
        source: input
        description: free-text dispute reason
      - name: penalty_points
        type: integer
        source: input
        description: "points the opener seeks as penalty; transferred on RESOLVED_FOR_CLAIMANT"
        constraints: ">= 1"
      - name: resolution_note
        type: string
        source: system
        description: PlatformAdmin note recorded at resolution; null until resolved
      - name: status
        type: enum
        source: system
        description: "dispute lifecycle"
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, RESOLVED_FOR_CLAIMANT, RESOLVED_FOR_RESPONDENT, WITHDRAWN}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: ExchangeRequest
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /exchange-requests/{id}/counter"
        actor: Member
        preconditions:
          - "acting Member is owner of target_listing (host)"
          - "request.status == PROPOSED"
        side_effects:
          - "overwrite requested_start_date/requested_end_date with the host counter dates"
          - "recompute points_cost via exchange_points_cost"
          - "for POINTS: update the HELD hold_ledger_entry amount to -points_cost"
          - "reset expires_at = now + REQUEST_TTL_DAYS(=7)"
        note: "cyclic negotiation — host counter"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /exchange-requests/{id}/repropose"
        actor: Member
        preconditions:
          - "acting Member == requester_member_id"
          - "request.status == COUNTERED"
        side_effects:
          - "optionally overwrite requested dates with requester's re-proposal"
          - "recompute points_cost via exchange_points_cost"
          - "for POINTS: update the HELD hold_ledger_entry amount to -points_cost"
          - "reset expires_at = now + REQUEST_TTL_DAYS(=7)"
        note: "cyclic negotiation — requester re-proposes; PROPOSED<->COUNTERED loop"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /exchange-requests/{id}/accept"
        actor: Member
        preconditions:
          - "acting Member is owner of target_listing (host)"
          - "request.status == PROPOSED"
          - "guest (requester) verification_status == VERIFIED  [business_safety]"
          - "host (owner) verification_status == VERIFIED  [business_safety]"
          - "chosen AvailabilityWindow belongs to target_listing and status == OPEN"
          - "no BOOKED AvailabilityWindow on target_listing overlaps [requested_start_date, requested_end_date) half-open  [business_temporal]"
          - "guest has no other non-terminal agreement whose [check_in,check_out] is within TRAVEL_BUFFER_DAYS(=1) of this stay  [business_temporal]"
          - "expected_listing_version == target_listing.version  [OCC]"
        side_effects:
          - "create ExchangeAgreement (status PENDING_CONFIRMATION) copying request fields  [cascade-2 link1]"
          - "flip chosen AvailabilityWindow OPEN -> BOOKED"
          - "for POINTS: void the HELD hold_ledger_entry, post EXCHANGE_DEBIT(-points_cost) to guest and EXCHANGE_CREDIT(+points_cost) to host  [cascade-2 link2, caused by agreement creation]"
          - "recompute guest and host settled/available balances  [cascade-2 link3, caused by ledger posting]"
          - "increments HomeListing.version by 1"
        note: "OCC write endpoint on HomeListing.version"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /exchange-requests/{id}/decline"
        actor: Member
        preconditions:
          - "acting Member is owner of target_listing (host)"
          - "request.status == PROPOSED"
        side_effects:
          - "for POINTS: void the HELD hold_ledger_entry (releases availability)  [compensation, points conserved]"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /exchange-requests/{id}/decline"
        actor: Member
        preconditions:
          - "acting Member is owner of target_listing (host)"
          - "request.status == COUNTERED"
        side_effects:
          - "for POINTS: void the HELD hold_ledger_entry"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /exchange-requests/{id}/withdraw"
        actor: Member
        preconditions:
          - "acting Member == requester_member_id"
          - "request.status == PROPOSED"
        side_effects:
          - "for POINTS: void the HELD hold_ledger_entry"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /exchange-requests/{id}/withdraw"
        actor: Member
        preconditions:
          - "acting Member == requester_member_id"
          - "request.status == COUNTERED"
        side_effects:
          - "for POINTS: void the HELD hold_ledger_entry"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system: logical clock passes expires_at (evaluated lazily on read/advance)"
        actor: system
        preconditions:
          - "now >= expires_at"
        side_effects:
          - "for POINTS: void the HELD hold_ledger_entry"
      - from: COUNTERED
        to: EXPIRED
        trigger: "system: logical clock passes expires_at"
        actor: system
        preconditions:
          - "now >= expires_at"
        side_effects:
          - "for POINTS: void the HELD hold_ledger_entry"

  - entity: ExchangeAgreement
    initial_state: PENDING_CONFIRMATION
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING_CONFIRMATION
        to: CONFIRMED
        trigger: "POST /exchange-agreements/{id}/confirm"
        actor: Member
        preconditions:
          - "acting Member is guest or host of the agreement"
          - "agreement.status == PENDING_CONFIRMATION"
        side_effects:
          - "set coverage_limit_points from host.active_membership_tier (BASIC 2000, PLUS 5000, PREMIER 10000; 0 if none)"
          - "set insurance_status = ACTIVE"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /exchange-agreements/{id}/start"
        actor: PlatformAdmin
        preconditions:
          - "agreement.status == CONFIRMED"
          - "now >= check_in"
        side_effects:
          - "none beyond status change"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /exchange-agreements/{id}/complete"
        actor: Member
        preconditions:
          - "acting Member is guest or host of the agreement"
          - "agreement.status == IN_PROGRESS"
          - "now >= check_out"
        side_effects:
          - "increment guest.completed_exchange_count and host.completed_exchange_count by 1"
          - "recompute guest.trust_score and host.trust_score"
      - from: PENDING_CONFIRMATION
        to: CANCELLED
        trigger: "POST /exchange-agreements/{id}/cancel"
        actor: Member
        preconditions:
          - "acting Member is guest or host of the agreement"
          - "agreement.status == PENDING_CONFIRMATION"
        side_effects:
          - "flip availability_window BOOKED -> OPEN  [availability nights conserved]"
          - "compute refund_points via cancellation_refund"
          - "for POINTS: post EXCHANGE_REFUND(+refund_points) to guest and CREDIT_REVERSAL(-refund_points) to host; host retains points_cost - refund_points  [points conserved: debit+credit+refund+reversal == 0]"
          - "recompute guest and host settled/available balances"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /exchange-agreements/{id}/cancel"
        actor: Member
        preconditions:
          - "acting Member is guest or host of the agreement"
          - "agreement.status == CONFIRMED"
        side_effects:
          - "flip availability_window BOOKED -> OPEN"
          - "compute refund_points via cancellation_refund"
          - "for POINTS: post EXCHANGE_REFUND(+refund_points) to guest and CREDIT_REVERSAL(-refund_points) to host"
          - "recompute guest and host settled/available balances"
        note: "no cancel allowed from IN_PROGRESS or COMPLETED"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_FOR_CLAIMANT, RESOLVED_FOR_RESPONDENT, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/review"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status == OPEN"
        side_effects:
          - "none beyond status change"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/resolve with decision WITHDRAW by opener"
        actor: Member
        preconditions:
          - "acting Member == opened_by_member_id"
          - "dispute.status == OPEN"
        side_effects:
          - "none"
        note: "opener may withdraw only while OPEN"
      - from: UNDER_REVIEW
        to: RESOLVED_FOR_CLAIMANT
        trigger: "POST /disputes/{id}/resolve with decision FOR_CLAIMANT"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status == UNDER_REVIEW"
        side_effects:
          - "post DISPUTE_PENALTY(-penalty_points) to respondent and DISPUTE_PENALTY(+penalty_points) to claimant  [points conserved]"
          - "recompute respondent and claimant settled/available balances"
          - "increment respondent.disputes_lost_count by 1 and recompute respondent.trust_score"
          - "record resolution_note"
        note: "branch A — divergent side effects (points transfer + trust penalty)"
      - from: UNDER_REVIEW
        to: RESOLVED_FOR_RESPONDENT
        trigger: "POST /disputes/{id}/resolve with decision FOR_RESPONDENT"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status == UNDER_REVIEW"
        side_effects:
          - "no points transfer; no trust change"
          - "record resolution_note"
        note: "branch B — divergent side effects (no transfer); fork-join branch of the same review node"

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: FILED
        to: SETTLED
        trigger: "POST /damage-claims/{id}/adjudicate with decision APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "claim.status == FILED"
          - "assessed_amount provided (>= 0)"
        side_effects:
          - "set assessed_amount; compute final_payout + deductible_points via damage_claim_payout  [cascade-1 hop1]"
          - "post DAMAGE_SETTLEMENT(-final_payout) to respondent and DAMAGE_SETTLEMENT(+final_payout) to claimant  [cascade-1 hop2, caused by settlement]"
          - "recompute respondent and claimant settled/available balances  [cascade-1 hop3, caused by ledger posting]"
          - "increment respondent.upheld_damage_count by 1 and recompute respondent.trust_score"
      - from: FILED
        to: REJECTED
        trigger: "POST /damage-claims/{id}/adjudicate with decision REJECT"
        actor: PlatformAdmin
        preconditions:
          - "claim.status == FILED"
        side_effects:
          - "no points transfer; no trust change"

  - entity: Membership
    initial_state: PENDING_ACTIVATION
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /memberships/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "membership.status == PENDING_ACTIVATION"
          - "member has no other Membership in status ACTIVE"
        side_effects:
          - "set activated_at = now; expires_at = now + MEMBERSHIP_TERM_DAYS"
          - "post WELCOME_BONUS to member (BASIC 500, PLUS 1000, PREMIER 2000)"
          - "recompute member settled/available balances"
      - from: PENDING_ACTIVATION
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Member
        preconditions:
          - "acting Member == member_id"
          - "membership.status == PENDING_ACTIVATION"
        side_effects:
          - "none"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Member
        preconditions:
          - "acting Member == member_id"
          - "membership.status == ACTIVE"
        side_effects:
          - "none (welcome bonus retained)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock passes expires_at"
        actor: system
        preconditions:
          - "now >= expires_at"
        side_effects:
          - "none"

  - entity: Verification
    initial_state: PENDING_REVIEW
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /verifications/{id}/decide with decision APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "verification.status == PENDING_REVIEW"
        side_effects:
          - "set decided_by = acting admin id"
          - "if verification_type == IDENTITY: member.verification_status recomputes to VERIFIED"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /verifications/{id}/decide with decision REJECT"
        actor: PlatformAdmin
        preconditions:
          - "verification.status == PENDING_REVIEW"
        side_effects:
          - "set decided_by = acting admin id"

  - entity: HomeListing
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /home-listings/{id}/activate"
        actor: Member
        preconditions:
          - "acting Member == owner_member_id"
          - "listing.status == DRAFT"
          - "owner.verification_status == VERIFIED"
        side_effects:
          - "increments HomeListing.version by 1"
        note: "listing must be ACTIVE before it can be targeted by an ExchangeRequest"

  - entity: AvailabilityWindow
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "system: on POST /exchange-requests/{id}/accept"
        actor: system
        preconditions:
          - "window.status == OPEN"
        side_effects:
          - "listing open_nights decreases by window.nights; booked_nights increases by window.nights (total conserved)"
      - from: BOOKED
        to: OPEN
        trigger: "system: on POST /exchange-agreements/{id}/cancel"
        actor: system
        preconditions:
          - "window.status == BOOKED"
        side_effects:
          - "listing booked_nights decreases by window.nights; open_nights increases by window.nights (total conserved)"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: accept-stale-listing
    parent_entity: HomeListing
    write_endpoint: "POST /exchange-requests/{id}/accept"
    occ_field: "expected_listing_version"
    description: |
      Accepting an ExchangeRequest against a HomeListing whose version has
      advanced since the requester last observed it is rejected. Each accept
      books a window and bumps the listing's version; a subsequent accept that
      still carries the pre-advance version is operating on a stale view of the
      listing's availability aggregate and terms, and is rejected. This is the
      CREATE-with-supersede case: the second accept (targeting a different, still
      OPEN window) would legitimately succeed on identical state, but its stale
      version proves the client did not observe the prior booking.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: exchange_points_cost
    trigger: "on POST /exchange-requests (create), and recomputed on counter/repropose"
    algorithm: tiered_pricing
    formula: |
      # POINTS type only; RECIPROCAL => 0
      # nights = each date d in [requested_start_date, requested_end_date)
      # season_multiplier(d): month(d) in {6,7,8,12} -> 1.5 (PEAK);
      #                       month(d) in {3,4,5,9,10,11} -> 1.2 (SHOULDER);
      #                       month(d) in {1,2} -> 1.0 (OFF)
      # discount = MEMBERSHIP_DISCOUNT[requester.active_membership_tier] (0 if none)
      # PINNED ROUNDING ORDER: round EACH night to an integer, THEN sum.
      total = 0
      for d in nights:
          nightly = round_half_up(points_per_night * season_multiplier(d) * (1 - discount))
          total += nightly
      cost = max(MIN_EXCHANGE_POINTS, min(total, target_listing.max_points_per_exchange))
      return cost
    input_set: "all dates in half-open [requested_start_date, requested_end_date); membership tier from requester's ACTIVE Membership at request time"
    constants:
      MIN_EXCHANGE_POINTS: 100
      SEASON_PEAK_MULT: 1.5
      SEASON_SHOULDER_MULT: 1.2
      SEASON_OFF_MULT: 1.0
      PEAK_MONTHS: [6, 7, 8, 12]
      SHOULDER_MONTHS: [3, 4, 5, 9, 10, 11]
      OFF_MONTHS: [1, 2]
      MEMBERSHIP_DISCOUNT_BASIC: 0.0
      MEMBERSHIP_DISCOUNT_PLUS: 0.10
      MEMBERSHIP_DISCOUNT_PREMIER: 0.20
    precision: "integer points, round_half_up per night before summing (order is pinned; sum-then-round is NOT used)"

  - name: member_points_balance
    trigger: "recomputed after any PointsLedgerEntry is created, posted, or voided (membership activate, accept, cancel, adjudicate, dispute resolve, admin adjustment)"
    algorithm: aggregation
    formula: |
      settled_points_balance   = sum(e.amount for e in ledger[member] if e.status == POSTED)
      available_points_balance = sum(e.amount for e in ledger[member] if e.status in {POSTED, HELD})
      # HELD entries are negative holds, so available <= settled while holds outstanding
    input_set: "all PointsLedgerEntry rows for the member; POSTED for settled, POSTED+HELD for available"
    constants: {}
    precision: "integer points; no rounding (all amounts are integers)"
    variants:
      - name: settled
        when: "final accounting / display of realized balance"
        difference: "includes only POSTED entries (excludes outstanding HELD holds)"
      - name: available
        when: "sufficiency check when creating a new POINTS exchange request"
        difference: "includes POSTED and HELD entries, so outstanding holds reduce it"

  - name: damage_claim_payout
    trigger: "provisional on POST /exchange-agreements/{id}/damage-claims (filing); final on POST /damage-claims/{id}/adjudicate (APPROVE)"
    algorithm: threshold
    formula: |
      # PROVISIONAL (at filing) uses claimed_amount; FINAL (at adjudication) uses assessed_amount.
      def payout(amount, coverage_limit):
          if   amount <= 500:  rate = 0.20      # tiered deductible-rate selection
          elif amount <= 2000: rate = 0.10
          else:                rate = 0.05
          deductible = max(FIXED_DEDUCTIBLE_POINTS, round_half_up(amount * rate))
          return max(0, min(amount, coverage_limit) - deductible), deductible
      provisional_payout, _        = payout(claimed_amount, agreement.coverage_limit_points)
      final_payout, deductible_pts = payout(assessed_amount, agreement.coverage_limit_points)
    input_set: "claimed_amount (provisional) or assessed_amount (final); agreement.coverage_limit_points fixed at confirm"
    constants:
      FIXED_DEDUCTIBLE_POINTS: 50
      DEDUCTIBLE_RATE_LOW: 0.20
      DEDUCTIBLE_RATE_MID: 0.10
      DEDUCTIBLE_RATE_HIGH: 0.05
      LOW_BAND_MAX: 500
      MID_BAND_MAX: 2000
      COVERAGE_LIMIT_BASIC: 2000
      COVERAGE_LIMIT_PLUS: 5000
      COVERAGE_LIMIT_PREMIER: 10000
    precision: "integer points, round_half_up on the deductible; ≥3 inputs (amount, tiered rate, fixed floor, coverage cap) with nested min/max"
    variants:
      - name: provisional
        when: "at claim filing, before adjudication"
        difference: "computed from claimant-asserted claimed_amount"
      - name: final
        when: "at adjudication APPROVE"
        difference: "computed from PlatformAdmin-assessed assessed_amount; drives the actual DAMAGE_SETTLEMENT transfer"

  - name: cancellation_refund
    trigger: "on POST /exchange-agreements/{id}/cancel (POINTS agreements)"
    algorithm: threshold
    formula: |
      days_before = (date(check_in) - date(now)).days
      if   days_before >= 7: refund_pct = 1.0
      elif days_before >= 2: refund_pct = 0.5
      else:                  refund_pct = 0.0
      refund_points = round_half_up(points_cost * refund_pct)
      # host retains points_cost - refund_points (penalty compensation); total points conserved
    input_set: "agreement.points_cost, check_in, logical clock now"
    constants:
      FULL_REFUND_MIN_DAYS: 7
      PARTIAL_REFUND_MIN_DAYS: 2
      PARTIAL_REFUND_PCT: 0.5
    precision: "integer points, round_half_up"

  - name: trust_score
    trigger: "recomputed on agreement complete, damage settle, dispute resolve-for-claimant"
    algorithm: weighted_scoring
    formula: |
      raw = 50 + 2*completed_exchange_count - 10*upheld_damage_count - 15*disputes_lost_count
      trust_score = max(0, min(100, raw))
    input_set: "Member counters: completed_exchange_count, upheld_damage_count, disputes_lost_count"
    constants:
      BASE: 50
      COMPLETED_WEIGHT: 2
      DAMAGE_PENALTY: 10
      DISPUTE_PENALTY: 15
      FLOOR: 0
      CEILING: 100
    precision: "integer; clamp to [0,100]"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /members/register"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per RBAC; ownership: entity_backed Member must match the resource's owning FK"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path/body-referenced resources exist, validated left-to-right in the path then body FKs"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, integers within declared constraints"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 5
    category: business_temporal
    check: "date range well-formed: end_date strictly after start_date (nights >= 1); requested_end_date strictly after requested_start_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /home-listings/{id}/availability-windows; POST /exchange-requests"
  - priority: 6
    category: state
    check: "target resource is in a state that admits this transition (e.g., request PROPOSED for accept/decline/counter; agreement PENDING_CONFIRMATION for confirm; dispute UNDER_REVIEW for resolve)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "target HomeListing.status == ACTIVE when opening an ExchangeRequest against it"
    error_id: ERR_LISTING_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /exchange-requests"
  - priority: 8
    category: state
    check: "requester has a Membership in status ACTIVE when opening an ExchangeRequest"
    error_id: ERR_MEMBERSHIP_INACTIVE
    http_status: 409
    applies_to: "POST /exchange-requests"
  - priority: 9
    category: business_safety
    check: "requester.trust_score >= target_listing.min_trust_score when opening an ExchangeRequest"
    error_id: ERR_TRUST_TOO_LOW
    http_status: 403
    applies_to: "POST /exchange-requests"
  - priority: 10
    category: business_fiscal
    check: "for POINTS requests, requester.available_points_balance >= points_cost (placing the hold keeps availability >= 0)"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 402
    applies_to: "POST /exchange-requests"
  - priority: 11
    category: business_safety
    check: "on accept, both guest and host verification_status == VERIFIED"
    error_id: ERR_MEMBER_NOT_VERIFIED
    http_status: 403
    applies_to: "POST /exchange-requests/{id}/accept"
  - priority: 12
    category: business_temporal
    check: "on accept, chosen window OPEN and no BOOKED window on the listing overlaps [requested_start_date, requested_end_date) half-open (adjacency allowed)"
    error_id: ERR_AVAILABILITY_CONFLICT
    http_status: 409
    applies_to: "POST /exchange-requests/{id}/accept"
  - priority: 13
    category: business_temporal
    check: "on accept, guest has no other non-terminal agreement whose closed stay [check_in,check_out] is within TRAVEL_BUFFER_DAYS(=1) of this stay"
    error_id: ERR_TRAVELER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /exchange-requests/{id}/accept"
  - priority: 14
    category: business_referential
    check: "on damage claim, linked ExchangeAgreement.status == COMPLETED and claimant is a party of the agreement"
    error_id: ERR_AGREEMENT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /exchange-agreements/{id}/damage-claims"
  - priority: 15
    category: business_constraint
    check: "damage claimed_amount >= 1; dispute penalty_points >= 1"
    error_id: ERR_INVALID_CLAIM_AMOUNT
    http_status: 422
    applies_to: "POST /exchange-agreements/{id}/damage-claims"
  - priority: 16
    category: state
    check: "OCC: expected_listing_version equals current target_listing.version on accept"
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
    applies_to: "POST /exchange-requests/{id}/accept"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Members ---
  - method: POST
    path: "/members/register"
    description: "register a new member (starts UNVERIFIED, 0 points, trust 50)"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, home_city]
    output: Member
    side_effects: []
  - method: GET
    path: "/members/{id}"
    description: "fetch a member with computed balances and trust"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/members/{id}/points-adjustments"
    description: "PlatformAdmin posts a manual ADMIN_ADJUSTMENT ledger entry (may be negative) to seed/correct a member balance"
    roles: [PlatformAdmin]
    code: 201
    input: [amount, "memo?"]
    output: PointsLedgerEntry
    side_effects: ["post ADMIN_ADJUSTMENT ledger entry", "recompute member settled/available balances"]
  - method: GET
    path: "/members/{id}/ledger-entries"
    description: "list a member's ledger entries (reverse-reachability for PointsLedgerEntry.member_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PointsLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/members/{id}/memberships"
    description: "list a member's memberships (reverse-reachability for Membership.member_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: GET
    path: "/members/{id}/home-listings"
    description: "list a member's home listings (reverse-reachability for HomeListing.owner_member_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: HomeListing[]
    side_effects: []
  - method: GET
    path: "/members/{id}/verifications"
    description: "list a member's verifications (reverse-reachability for Verification.member_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Verification[]
    side_effects: []
  - method: GET
    path: "/members/{id}/exchange-requests"
    description: "list requests where the member is requester (reverse-reachability for ExchangeRequest.requester_member_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ExchangeRequest[]
    side_effects: []

  # --- Memberships ---
  - method: POST
    path: "/memberships"
    description: "subscribe: create a Membership in PENDING_ACTIVATION for the acting member"
    roles: [Member]
    code: 201
    input: [member_id, tier]
    output: Membership
    side_effects: []
  - method: POST
    path: "/memberships/{id}/activate"
    description: "activate a membership (payment simulated); grants tier welcome bonus"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["set activated_at/expires_at", "post WELCOME_BONUS", "recompute member balances"]
  - method: POST
    path: "/memberships/{id}/cancel"
    description: "cancel a membership (self)"
    roles: [Member]
    code: 200
    input: []
    output: Membership
    side_effects: []

  # --- Verifications ---
  - method: POST
    path: "/verifications"
    description: "submit a verification for the acting member"
    roles: [Member]
    code: 201
    input: [member_id, verification_type, document_ref]
    output: Verification
    side_effects: []
  - method: POST
    path: "/verifications/{id}/decide"
    description: "PlatformAdmin approves or rejects a pending verification"
    roles: [PlatformAdmin]
    code: 200
    input: [decision]
    output: Verification
    side_effects: ["set decided_by", "on APPROVE + IDENTITY: member.verification_status -> VERIFIED"]

  # --- Home Listings ---
  - method: POST
    path: "/home-listings"
    description: "create a home listing in DRAFT for the acting member"
    roles: [Member]
    code: 201
    input: [owner_member_id, title, address_city, address_country, points_per_night, max_points_per_exchange, capacity, "min_trust_score?"]
    output: HomeListing
    side_effects: []
  - method: GET
    path: "/home-listings/{id}"
    description: "fetch a listing"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: HomeListing
    side_effects: []
  - method: POST
    path: "/home-listings/{id}/activate"
    description: "activate a DRAFT listing (owner must be VERIFIED); bumps version"
    roles: [Member]
    code: 200
    input: []
    output: HomeListing
    side_effects: ["increments HomeListing.version by 1"]
  - method: POST
    path: "/home-listings/{id}/availability-windows"
    description: "publish a bookable availability window on the listing"
    roles: [Member]
    code: 201
    input: [start_date, end_date]
    output: AvailabilityWindow
    side_effects: []
  - method: GET
    path: "/home-listings/{id}/availability-windows"
    description: "list a listing's windows (reverse-reachability for AvailabilityWindow.listing_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AvailabilityWindow[]
    side_effects: []
  - method: GET
    path: "/home-listings/{id}/exchange-requests"
    description: "list requests targeting or offering this listing (reverse-reachability for ExchangeRequest.target_listing_id and offered_listing_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ExchangeRequest[]
    side_effects: []
  - method: GET
    path: "/availability-windows/{id}"
    description: "fetch an availability window with its status"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: AvailabilityWindow
    side_effects: []

  # --- Exchange Requests (negotiation) ---
  - method: POST
    path: "/exchange-requests"
    description: "open an exchange request (starts PROPOSED); places a points HOLD for POINTS type"
    roles: [Member]
    code: 201
    input: [requester_member_id, target_listing_id, exchange_type, requested_start_date, requested_end_date, "offered_listing_id?"]
    output: ExchangeRequest
    side_effects: ["compute points_cost", "for POINTS: post HELD hold ledger entry", "set expires_at", "recompute requester available balance"]
  - method: GET
    path: "/exchange-requests/{id}"
    description: "fetch a request with negotiation status and points_cost"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: ExchangeRequest
    side_effects: []
  - method: POST
    path: "/exchange-requests/{id}/counter"
    description: "host counters with new dates (PROPOSED -> COUNTERED)"
    roles: [Member]
    code: 200
    input: [requested_start_date, requested_end_date]
    output: ExchangeRequest
    side_effects: ["overwrite dates", "recompute points_cost", "update HELD hold amount", "reset expires_at"]
  - method: POST
    path: "/exchange-requests/{id}/repropose"
    description: "requester re-proposes (COUNTERED -> PROPOSED)"
    roles: [Member]
    code: 200
    input: ["requested_start_date?", "requested_end_date?"]
    output: ExchangeRequest
    side_effects: ["optionally overwrite dates", "recompute points_cost", "update HELD hold amount", "reset expires_at"]
  - method: POST
    path: "/exchange-requests/{id}/accept"
    description: "host accepts (PROPOSED -> ACCEPTED); creates the agreement, books the window, commits points. OCC on listing version."
    roles: [Member]
    code: 201
    input: [availability_window_id, expected_listing_version]
    output: ExchangeAgreement
    side_effects: ["create ExchangeAgreement", "flip window OPEN->BOOKED", "for POINTS: void hold, post EXCHANGE_DEBIT + EXCHANGE_CREDIT", "recompute both balances", "increments HomeListing.version by 1"]
  - method: POST
    path: "/exchange-requests/{id}/decline"
    description: "host declines (PROPOSED/COUNTERED -> DECLINED)"
    roles: [Member]
    code: 200
    input: []
    output: ExchangeRequest
    side_effects: ["for POINTS: void HELD hold", "recompute requester available balance"]
  - method: POST
    path: "/exchange-requests/{id}/withdraw"
    description: "requester withdraws (PROPOSED/COUNTERED -> WITHDRAWN)"
    roles: [Member]
    code: 200
    input: []
    output: ExchangeRequest
    side_effects: ["for POINTS: void HELD hold", "recompute requester available balance"]

  # --- Exchange Agreements ---
  - method: GET
    path: "/exchange-agreements/{id}"
    description: "fetch an agreement"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: []
  - method: GET
    path: "/exchange-agreements"
    description: "filtered list of agreements (reverse-reachability for request_id, guest_member_id, host_member_id, listing_id, availability_window_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["request_id?", "guest_member_id?", "host_member_id?", "listing_id?", "availability_window_id?", "limit?", "offset?"]
    output: ExchangeAgreement[]
    side_effects: []
  - method: GET
    path: "/exchange-agreements/{id}/ledger-entries"
    description: "list ledger entries tied to an agreement (reverse-reachability for PointsLedgerEntry.agreement_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PointsLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/exchange-agreements/{id}/confirm"
    description: "guest or host confirms (PENDING_CONFIRMATION -> CONFIRMED); activates coverage"
    roles: [Member]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: ["set coverage_limit_points from host tier", "set insurance_status ACTIVE"]
  - method: POST
    path: "/exchange-agreements/{id}/start"
    description: "system/admin marks stay started (CONFIRMED -> IN_PROGRESS) once now >= check_in"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: []
  - method: POST
    path: "/exchange-agreements/{id}/complete"
    description: "guest or host completes stay (IN_PROGRESS -> COMPLETED) once now >= check_out"
    roles: [Member]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: ["increment completed_exchange_count for guest and host", "recompute trust_score for both"]
  - method: POST
    path: "/exchange-agreements/{id}/cancel"
    description: "guest or host cancels (PENDING_CONFIRMATION/CONFIRMED -> CANCELLED); refunds per policy, releases window"
    roles: [Member]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: ["flip window BOOKED->OPEN", "compute refund_points", "post EXCHANGE_REFUND + CREDIT_REVERSAL", "recompute both balances"]

  # --- Damage Claims ---
  - method: POST
    path: "/exchange-agreements/{id}/damage-claims"
    description: "a party files a damage claim on a COMPLETED agreement (computes provisional payout)"
    roles: [Member]
    code: 201
    input: [claimant_member_id, claimed_amount]
    output: DamageClaim
    side_effects: ["compute respondent_member_id", "compute provisional_payout", "set agreement.insurance_status CLAIMED"]
  - method: GET
    path: "/damage-claims/{id}"
    description: "fetch a damage claim"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/damage-claims"
    description: "filtered list of claims (reverse-reachability for DamageClaim.agreement_id and claimant_member_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["agreement_id?", "claimant_member_id?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: "/damage-claims/{id}/adjudicate"
    description: "PlatformAdmin sets assessed_amount and APPROVE/REJECT (FILED -> SETTLED/REJECTED)"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "assessed_amount?"]
    output: DamageClaim
    side_effects: ["on APPROVE: compute final_payout/deductible, post DAMAGE_SETTLEMENT (debit respondent, credit claimant), recompute balances, increment respondent.upheld_damage_count + recompute respondent trust_score"]

  # --- Disputes ---
  - method: POST
    path: "/exchange-agreements/{id}/disputes"
    description: "a party opens a dispute on an agreement (starts OPEN)"
    roles: [Member]
    code: 201
    input: [opened_by_member_id, reason, penalty_points]
    output: Dispute
    side_effects: ["compute respondent_member_id"]
  - method: GET
    path: "/disputes/{id}"
    description: "fetch a dispute"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "filtered list of disputes (reverse-reachability for Dispute.agreement_id and opened_by_member_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["agreement_id?", "opened_by_member_id?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{id}/review"
    description: "PlatformAdmin takes a dispute under review (OPEN -> UNDER_REVIEW)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "resolve a dispute: PlatformAdmin FOR_CLAIMANT/FOR_RESPONDENT from UNDER_REVIEW; opener WITHDRAW from OPEN"
    roles: [Member, PlatformAdmin]
    code: 200
    input: [decision, "resolution_note?"]
    output: Dispute
    side_effects: ["FOR_CLAIMANT: post DISPUTE_PENALTY transfer respondent->claimant, recompute balances, increment respondent.disputes_lost_count + recompute trust"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advance logical clock; lazily EXPIRE requests/memberships whose expires_at has passed"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation, or entity_backed Member is not the owner of the resource"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field, bad enum, integer out of declared range"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "referenced Member id does not exist"
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "referenced Membership id does not exist"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "referenced HomeListing id does not exist"
  - id: ERR_AVAILABILITY_WINDOW_NOT_FOUND
    http: 404
    condition: "referenced AvailabilityWindow id does not exist or not on the target listing"
  - id: ERR_VERIFICATION_NOT_FOUND
    http: 404
    condition: "referenced Verification id does not exist"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "referenced ExchangeRequest id does not exist"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "referenced ExchangeAgreement id does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "referenced DamageClaim id does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "referenced Dispute id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a state that admits the requested transition"
  - id: ERR_LISTING_NOT_ACTIVE
    http: 409
    condition: "opening an ExchangeRequest against a listing whose status != ACTIVE"
  - id: ERR_MEMBERSHIP_INACTIVE
    http: 409
    condition: "requester has no Membership in status ACTIVE when opening an ExchangeRequest"
  - id: ERR_DUPLICATE_ACTIVE_MEMBERSHIP
    http: 409
    condition: "activating a Membership when the member already has an ACTIVE Membership"
  - id: ERR_TRUST_TOO_LOW
    http: 403
    condition: "requester.trust_score < target_listing.min_trust_score"
  - id: ERR_INSUFFICIENT_POINTS
    http: 402
    condition: "POINTS request where requester.available_points_balance < points_cost"
  - id: ERR_MEMBER_NOT_VERIFIED
    http: 403
    condition: "on accept, guest or host verification_status != VERIFIED; or activating a listing whose owner is not VERIFIED"
  - id: ERR_AVAILABILITY_CONFLICT
    http: 409
    condition: "on accept, chosen window not OPEN or a BOOKED window overlaps the requested half-open range"
  - id: ERR_TRAVELER_DOUBLE_BOOKED
    http: 409
    condition: "on accept, guest already has a stay within TRAVEL_BUFFER_DAYS(=1) of the requested stay"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "end_date/requested_end_date not strictly after start_date/requested_start_date (nights < 1)"
  - id: ERR_STALE_LISTING_VERSION
    http: 412
    condition: "expected_listing_version != current target_listing.version on accept"
  - id: ERR_AGREEMENT_NOT_COMPLETED
    http: 409
    condition: "filing a damage claim on an agreement whose status != COMPLETED"
  - id: ERR_INVALID_CLAIM_AMOUNT
    http: 422
    condition: "claimed_amount < 1 (damage) or penalty_points < 1 (dispute)"
  - id: ERR_CLAIM_ALREADY_ADJUDICATED
    http: 409
    condition: "adjudicating a DamageClaim whose status != FILED"
  - id: ERR_DISPUTE_ALREADY_RESOLVED
    http: 409
    condition: "resolving/reviewing a Dispute that is already terminal"
  - id: ERR_NOT_AGREEMENT_PARTY
    http: 403
    condition: "acting Member is neither guest nor host of the agreement for a party-only operation"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Anonymous
    description: "unauthenticated caller; may only self-register"
    identity: opaque
    exclusive_operations:
      - "POST /members/register"
    shared_operations: []
  - name: Member
    description: "an authenticated member acting on their own resources (as requester, host, guest, claimant, or dispute opener)"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /memberships (self)"
      - "POST /memberships/{id}/cancel (self)"
      - "POST /verifications (self)"
      - "POST /home-listings (self)"
      - "POST /home-listings/{id}/activate (owner)"
      - "POST /home-listings/{id}/availability-windows (owner)"
      - "POST /exchange-requests (as requester)"
      - "POST /exchange-requests/{id}/counter (host/owner)"
      - "POST /exchange-requests/{id}/repropose (requester)"
      - "POST /exchange-requests/{id}/accept (host/owner)"
      - "POST /exchange-requests/{id}/decline (host/owner)"
      - "POST /exchange-requests/{id}/withdraw (requester)"
      - "POST /exchange-agreements/{id}/confirm (party)"
      - "POST /exchange-agreements/{id}/complete (party)"
      - "POST /exchange-agreements/{id}/cancel (party)"
      - "POST /exchange-agreements/{id}/damage-claims (party)"
      - "POST /exchange-agreements/{id}/disputes (party)"
    shared_operations:
      - "GET reads on own/related members, listings, windows, requests, agreements, ledger, claims, disputes"
      - "POST /disputes/{id}/resolve (opener WITHDRAW only)"
  - name: PlatformAdmin
    description: "operational staff: verification, membership activation, stay lifecycle, adjudication, dispute review/resolution, clock, and balance seeding"
    identity: opaque
    exclusive_operations:
      - "POST /members/{id}/points-adjustments"
      - "POST /memberships/{id}/activate"
      - "POST /verifications/{id}/decide"
      - "POST /exchange-agreements/{id}/start"
      - "POST /damage-claims/{id}/adjudicate"
      - "POST /disputes/{id}/review"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
      - "POST /disputes/{id}/resolve (FOR_CLAIMANT / FOR_RESPONDENT)"
