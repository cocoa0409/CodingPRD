  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    rule_summary: >-
      Three fixtures each violate two §1.4 rows at once, and in each case the
      lower-priority row's error is the wrong answer. The pairs are drawn from
      three different bands of the ladder — authorization against existence,
      concurrency against cross-entity state, and two neighbouring
      business_safety rows on the same endpoint — so no single ordering shortcut
      satisfies all three.
    instances:

      - instance_id: PP-1
        name: forbidden_role_precedes_report_not_found
        grounds:
          - validations[priority=2]
          - validations[priority=10]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_REPORT_NOT_FOUND]
          - rbac.DistributorLiaison
        title: "priority 2 ERR_FORBIDDEN_ROLE beats priority 10 ERR_REPORT_NOT_FOUND"
        conflicting_rows: "priority 2 (ERR_FORBIDDEN_ROLE, 403) vs priority 10 (ERR_REPORT_NOT_FOUND, 404)"
        rationale: >-
          Report review is exclusive to RevenueAccountant. An AuditManager
          calling it against a report id that does not exist violates both the
          role gate and the existence check. Answering 404 would confirm to an
          unauthorized caller that the id is absent, which is exactly the leak the
          priority ladder is ordered to prevent.
        distinguishing_aspect: >-
          403 ERR_FORBIDDEN_ROLE, not 404 ERR_REPORT_NOT_FOUND, for a syntactically
          valid but non-existent reportId. The same call made by a
          RevenueAccountant against the same non-existent id DOES return 404, which
          proves the 403 came from the role gate rather than from a blanket refusal.
        test_recipe:
          setup: >-
            No domain fixture is required beyond a well-formed but unallocated
            report identifier. One distributor is created only so the store is
            non-empty and the 404 branch is genuinely reachable.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d4_id: "id"
          trigger:
            call: "POST /carriage/subscriber-reports/00000000-0000-4000-8000-000000000abc/review"
            payload:
              action: "ACCEPT"
            as: AuditManager
            as_user_id: "u-audit-1"
          assert:
            - "response status code == 403"
            - "response body data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "response body data.error_id is NOT \"ERR_REPORT_NOT_FOUND\" and the status code is NOT 404"
            - "the identical call made as RevenueAccountant with X-User-ID u-rev-1 returns 404 with data.error_id == \"ERR_REPORT_NOT_FOUND\""
            - "GET /carriage/subscriber-reports as RevenueAccountant returns an empty list, confirming the id was never allocated"

      - instance_id: PP-2
        name: stale_agreement_version_precedes_invalid_mfn_state
        grounds:
          - validations[priority=20]
          - validations[priority=37]
          - errors[ERR_STALE_AGREEMENT_VERSION]
          - errors[ERR_INVALID_MFN_STATE]
          - concurrency_rules[mfn-reset-stale-agreement]
        title: "priority 20 ERR_STALE_AGREEMENT_VERSION beats priority 37 ERR_INVALID_MFN_STATE"
        conflicting_rows: "priority 20 (ERR_STALE_AGREEMENT_VERSION, 412) vs priority 37 (ERR_INVALID_MFN_STATE, 409)"
        rationale: >-
          An MFN reset carries an optimistic-concurrency token for the parent
          agreement. When the caller both presents a stale token and aims the
          reset at a clause that has already been waived, two rows fire. The
          concurrency check sits above own-entity state because a caller working
          from a stale read cannot be trusted to have seen the clause's current
          status either — reporting the state error first would tell the caller
          something about a world it has not yet observed.
        distinguishing_aspect: >-
          412 ERR_STALE_AGREEMENT_VERSION, not 409 ERR_INVALID_MFN_STATE. Replaying
          the same request with the correct expected_agreement_version then
          surfaces the 409 — the two errors are reachable in that order and only
          that order, which is what distinguishes a priority ladder from a set of
          independent guards.
        test_recipe:
          setup: >-
            Northgate is executed and carries an MFN clause that has since been
            waived, so the clause is no longer resettable. The caller holds an
            agreement version token of 999, which cannot match any agreement that
            has been through DRAFT, NEGOTIATING and EXECUTED.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Northgate Cable Systems"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 4000000
                credit_limit_cents: 500000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d1_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d1_id}"
                contract_code: "NG-2024-01"
                term_start_date: "2024-01-01T00:00:00Z"
                term_end_date: "2027-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 42.0000
                escalator_pct: 0.04
                penetration_floor_pct: 0.85
                committed_tier: "EXPANDED_BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_id: "id"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_version: "version"
            - call: "POST /carriage/mfn-clauses"
              payload:
                agreement_id: "${a1_id}"
                mfn_scope: "DOMESTIC"
                min_peer_subscribers: 1000000
                rate_floor_cents: 30.0000
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                mfn1_id: "id"
            - call: "POST /carriage/mfn-clauses/${mfn1_id}/reset"
              payload:
                action: "WAIVE"
                expected_agreement_version: "${a1_version}"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                mfn1_status: "status"
          trigger:
            call: "POST /carriage/mfn-clauses/${mfn1_id}/reset"
            payload:
              action: "RESET"
              expected_agreement_version: 999
            as: AffiliateSalesExec
            as_user_id: "u-sales-1"
          assert:
            - "the captured mfn1_status equals \"WAIVED\""
            - "response status code == 412"
            - "response body data.error_id == \"ERR_STALE_AGREEMENT_VERSION\""
            - "response body data.error_id is NOT \"ERR_INVALID_MFN_STATE\" and the status code is NOT 409"
            - "GET /carriage/mfn-clauses/${mfn1_id} returns status == \"WAIVED\", benchmark_status == \"NOT_EVALUATED\" and benchmark_rate_cents == null (the rejected reset changed nothing)"
            - "replaying the same trigger with the current agreement version instead of 999 returns 409 with data.error_id == \"ERR_INVALID_MFN_STATE\""

      - instance_id: PP-3
        name: blackout_separation_precedes_monthly_cap
        grounds:
          - validations[priority=50]
          - validations[priority=51]
          - errors[ERR_BLACKOUT_SEPARATION_VIOLATION]
          - errors[ERR_BLACKOUT_MONTHLY_CAP_EXCEEDED]
          - calculations.blackout_separation
        title: "priority 50 ERR_BLACKOUT_SEPARATION_VIOLATION beats priority 51 ERR_BLACKOUT_MONTHLY_CAP_EXCEEDED"
        conflicting_rows: "priority 50 (ERR_BLACKOUT_SEPARATION_VIOLATION, 409) vs priority 51 (ERR_BLACKOUT_MONTHLY_CAP_EXCEEDED, 422)"
        rationale: >-
          Two neighbouring business_safety rows guard the same endpoint with
          different status codes: a pairwise interval rule at 409 and an aggregate
          monthly budget at 422. A single proposed blackout can breach both. The
          pairwise conflict is the more specific and the more actionable failure,
          so it is ordered first, and the difference is visible in the HTTP status
          alone.
        distinguishing_aspect: >-
          409 ERR_BLACKOUT_SEPARATION_VIOLATION, not 422
          ERR_BLACKOUT_MONTHLY_CAP_EXCEEDED, for a rule that simultaneously sits
          inside the 24-hour separation buffer of an existing rule AND would carry
          the operator's September total to 96 hours against a 72-hour cap. A
          differently-placed 24-hour rule that clears every buffer but still
          breaches the cap returns 422, which proves both rows are live.
        test_recipe:
          setup: >-
            Northgate holds two scheduled US blackouts in September 2026: a
            48-hour rule 2026-09-01T00:00:00Z..2026-09-03T00:00:00Z and a 24-hour
            rule 2026-09-05T00:00:00Z..2026-09-06T00:00:00Z. The second clears the
            first's buffer because its start minus 24 hours (2026-09-04T00:00:00Z)
            is still after the first's end. Together they consume exactly the
            72-hour monthly cap, leaving zero headroom.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Northgate Cable Systems"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 4000000
                credit_limit_cents: 500000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d1_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d1_id}"
                contract_code: "NG-2024-01"
                term_start_date: "2024-01-01T00:00:00Z"
                term_end_date: "2027-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 42.0000
                escalator_pct: 0.04
                penetration_floor_pct: 0.85
                committed_tier: "EXPANDED_BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
