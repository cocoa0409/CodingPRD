  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: determination_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[determination-stale-request]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reading the request version, then attaching a document (which bumps version), then issuing a determination with the pre-document version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Request UNDER_REVIEW; version captured BEFORE a document is added; document then added (version bumped)."]
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Sue", email: "sue@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Body A2", jurisdiction_state: "MS", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "s", description: "x", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
              captures: { rr_v_old: $.data.version }
            - call: "POST /records-requests/${req_id}/documents"
              payload: { title: "Late add", page_count: 5, review_minutes: 0, retention_series: "ADMIN" }
              as: RecordsOfficer
          trigger:
            - call: "POST /records-requests/${req_id}/determination"
              payload: { decision: "GRANTED", expected_records_request_version: "${rr_v_old}" }
              as: RecordsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "http_status == 412"

      - name: determination_correct_version_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[determination-stale-request]", entities.RecordsRequest.fields.version]
        distinguishing_aspect: "A determination carrying the current version succeeds and increments RecordsRequest.version by 1."
        test_recipe:
          setup: ["Request UNDER_REVIEW with current version read immediately before determination."]
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Tia", email: "tia@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Body Z2", jurisdiction_state: "WV", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "s", description: "x", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
              captures: { rr_v: $.data.version }
          trigger:
            - call: "POST /records-requests/${req_id}/determination"
              payload: { decision: "DENIED", expected_records_request_version: "${rr_v}" }
              as: RecordsOfficer
              captures: { new_v: $.data.version }
          assert:
            - "RecordsRequest.${req_id}.decision == DENIED"
            - "RecordsRequest.${req_id}.status == DENIED"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_meetings_returns_paginated_array
        claim_type: Listing
        grounds: [endpoints, entities.Meeting.fields.body_id]
        distinguishing_aspect: "GET /public-bodies/{id}/meetings returns an array envelope with total_count and has_more; reverse-reachability for Meeting.body_id."
        test_recipe:
          setup: ["Body with one meeting."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body Y2", jurisdiction_state: "IN", seat_count: 3, quorum_size: 1 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room Y2" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "Y2", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
          trigger:
            - call: "GET /public-bodies/${body_id}/meetings"
