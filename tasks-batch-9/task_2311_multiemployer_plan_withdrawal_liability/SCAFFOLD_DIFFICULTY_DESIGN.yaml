scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: allocation_method_dollar_basis_versus_cbu_basis_divergence
        grounds:
          - calculations.allocation_fraction_and_gross_share
          - entities.LiabilityAssessment.fields.allocation_method_applied
          - entities.LiabilityAssessment.fields.gross_allocated_cents
          - entities.Plan.fields.allocation_method
        distinguishing_aspect: |
          On the LiabilityAssessment entity domain, the identical certified contribution history and
          identical certified valuation set produce gross_allocated_cents == 145000000 under
          MODIFIED_PRESUMPTIVE (five-year contribution-DOLLAR ratio) and 200000000 under ROLLING_5
          (five-year contribution-BASE-UNIT ratio) — a 55000000-cent divergence caused solely by the
          ratio basis, with the method pinned at each assessment's creation.
        test_recipe:
          setup:
            - "Plan with allocation_method MODIFIED_PRESUMPTIVE, STATUTORY de minimis, interest_rate_bps 700, mass_withdrawal_declared false."
            - "One controlled group and one employer whose rate profile falls over time (2000 -> 500 cents per CBU) so the dollar ratio and the CBU ratio disagree."
            - "CERTIFIED valuations for plan years 2021..2025, each uvb_total_cents 10000000000, all_employer_contributions_cents 2000000000, all_employer_cbu 2000000."
            - "Five single-year CERTIFIED contribution records: 2021 20000 CBU / 40000000 cents, 2022 30000 / 30000000, 2023 40000 / 20000000, 2024 50000 / 25000000, 2025 60000 / 30000000."
            - "Withdrawal event for plan year 2026 determined COMPLETE."
            - "Logical clock at its default 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2021, measurement_window_start: "2021-01-01T00:00:00Z", measurement_window_end: "2021-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2022, measurement_window_start: "2022-01-01T00:00:00Z", measurement_window_end: "2022-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2023, measurement_window_start: "2023-01-01T00:00:00Z", measurement_window_end: "2023-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2024, measurement_window_start: "2024-01-01T00:00:00Z", measurement_window_end: "2024-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2025, measurement_window_start: "2025-01-01T00:00:00Z", measurement_window_end: "2025-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { v2025_id: "$.data.id" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2021, plan_year_end: 2021, contribution_base_units: 20000, contribution_amount_cents: 40000000, contribution_rate_cents_per_cbu: 2000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v2: "$.data.employer_version_at_apply" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2022, plan_year_end: 2022, contribution_base_units: 30000, contribution_amount_cents: 30000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v2}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v3: "$.data.employer_version_at_apply" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2023, plan_year_end: 2023, contribution_base_units: 40000, contribution_amount_cents: 20000000, contribution_rate_cents_per_cbu: 500, expected_employer_version: "${emp_v3}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v4: "$.data.employer_version_at_apply" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2024, plan_year_end: 2024, contribution_base_units: 50000, contribution_amount_cents: 25000000, contribution_rate_cents_per_cbu: 500, expected_employer_version: "${emp_v4}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v5: "$.data.employer_version_at_apply" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2025, plan_year_end: 2025, contribution_base_units: 60000, contribution_amount_cents: 30000000, contribution_rate_cents_per_cbu: 500, expected_employer_version: "${emp_v5}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "POST /withdrawal-events"
              payload: { employer_id: "${emp_id}", cessation_date: "2026-06-30T00:00:00Z", withdrawal_plan_year: 2026, reported_cause: "CONTRIBUTION_OBLIGATION_CEASED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { we_id: "$.data.id" }
            - call: "POST /withdrawal-events/${we_id}/determine"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
          trigger:
            - call: "POST /liability-assessments"
              payload: { withdrawal_event_id: "${we_id}" }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { la_dollar_id: "$.data.id", gross_dollar: "$.data.gross_allocated_cents" }
            - call: "PATCH /plans/${plan_id}"
              payload: { allocation_method: "ROLLING_5" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "POST /liability-assessments"
              payload: { withdrawal_event_id: "${we_id}" }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { la_cbu_id: "$.data.id", gross_cbu: "$.data.gross_allocated_cents" }
          assert:
            - "LiabilityAssessment.${la_dollar_id}.allocation_method_applied == MODIFIED_PRESUMPTIVE"
            - "LiabilityAssessment.${la_dollar_id}.gross_allocated_cents == 145000000"
            - "LiabilityAssessment.${la_dollar_id}.de_minimis_reduction_cents == 0"
            - "LiabilityAssessment.${la_dollar_id}.net_assessed_cents == 145000000"
            - "LiabilityAssessment.${la_dollar_id}.pool_term_breakdown == []"
            - "LiabilityAssessment.${la_cbu_id}.allocation_method_applied == ROLLING_5"
            - "LiabilityAssessment.${la_cbu_id}.gross_allocated_cents == 200000000"
            - "LiabilityAssessment.${la_cbu_id}.net_assessed_cents == 200000000"
            - "${gross_cbu} - ${gross_dollar} == 55000000"
            - "LiabilityAssessment.${la_dollar_id}.annual_payment_cents == 100000000 and LiabilityAssessment.${la_cbu_id}.annual_payment_cents == 100000000 (the level annual payment is history-derived and identical under both variants)"
            - "LiabilityAssessment.${la_dollar_id}.high_3yr_window_start_year == 2023 and LiabilityAssessment.${la_dollar_id}.peak_rate_plan_year == 2021"
            - "LiabilityAssessment.${la_dollar_id}.valuation_id == ${v2025_id}"

      - name: amortization_cap_variant_capped_forgiveness_versus_mass_withdrawal_rejection
        grounds:
          - calculations.amortization_and_twenty_year_cap
          - entities.PaymentSchedule.fields.forgiven_by_cap_cents
          - entities.PaymentSchedule.fields.amortization_years
          - entities.Plan.fields.mass_withdrawal_declared
          - errors[ERR_UNAMORTIZABLE_ASSESSMENT]
        distinguishing_aspect: |
          On the PaymentSchedule entity domain (a different subject from instance one's
          LiabilityAssessment allocation), the identical basis of 10020000000 cents and identical
          annual payment of 336666667 cents amortize to amortization_years 20 with
          forgiven_by_cap_cents 6453348534 under the capped_twenty_year variant, while the
          uncapped_mass_withdrawal variant refuses the same numbers outright with
          ERR_UNAMORTIZABLE_ASSESSMENT because no payment count up to 100 years reaches the basis.
        test_recipe:
          setup:
            - "Plan with MODIFIED_PRESUMPTIVE allocation, STATUTORY de minimis, interest_rate_bps 700, mass_withdrawal_declared false."
            - "CERTIFIED valuations 2021..2025 each uvb_total_cents 100000000000, all_employer_contributions_cents 2000000000, all_employer_cbu 2000000."
            - "Contribution history front-loaded: 2021 alone carries 200000 CBU / 1000000000 cents at 5000 cents per CBU; 2022..2025 together carry 4000 CBU / 2000000 cents at 500 cents per CBU."
            - "Withdrawal event for 2026 determined COMPLETE, assessment created and ISSUED at the default clock 2026-08-01T00:00:00Z so generation 1 exists under the capped variant."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Great Lakes Freight Pension Plan", industry: "TRUCKING", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Lakeside Carriers Group", common_control_basis: "BROTHER_SISTER" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Lakeside Cartage Inc", ein: "410000201", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2021, measurement_window_start: "2021-01-01T00:00:00Z", measurement_window_end: "2021-10-01T00:00:00Z", uvb_total_cents: 100000000000, uvb_pool_cents: 10000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2022, measurement_window_start: "2022-01-01T00:00:00Z", measurement_window_end: "2022-10-01T00:00:00Z", uvb_total_cents: 100000000000, uvb_pool_cents: 10000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2023, measurement_window_start: "2023-01-01T00:00:00Z", measurement_window_end: "2023-10-01T00:00:00Z", uvb_total_cents: 100000000000, uvb_pool_cents: 10000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2024, measurement_window_start: "2024-01-01T00:00:00Z", measurement_window_end: "2024-10-01T00:00:00Z", uvb_total_cents: 100000000000, uvb_pool_cents: 10000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2025, measurement_window_start: "2025-01-01T00:00:00Z", measurement_window_end: "2025-10-01T00:00:00Z", uvb_total_cents: 100000000000, uvb_pool_cents: 10000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2021, plan_year_end: 2021, contribution_base_units: 200000, contribution_amount_cents: 1000000000, contribution_rate_cents_per_cbu: 5000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v2: "$.data.employer_version_at_apply" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2022, plan_year_end: 2025, contribution_base_units: 4000, contribution_amount_cents: 2000000, contribution_rate_cents_per_cbu: 500, expected_employer_version: "${emp_v2}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "POST /withdrawal-events"
              payload: { employer_id: "${emp_id}", cessation_date: "2026-05-15T00:00:00Z", withdrawal_plan_year: 2026, reported_cause: "CONTRIBUTION_OBLIGATION_CEASED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { we_id: "$.data.id" }
            - call: "POST /withdrawal-events/${we_id}/determine"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /liability-assessments"
              payload: { withdrawal_event_id: "${we_id}" }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { la_id: "$.data.id" }
            - call: "POST /liability-assessments/${la_id}/issue"
              payload: {}
              as: PlanTrustee
              as_user_id: "tr-001"
            - call: "GET /payment-schedules"
              payload: { liability_assessment_id: "${la_id}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { gen1_id: "$.data[0].id", gen1_forgiven: "$.data[0].forgiven_by_cap_cents", gen1_years: "$.data[0].amortization_years" }
          trigger:
            - call: "PATCH /plans/${plan_id}"
              payload: { mass_withdrawal_declared: true }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "GET /liability-assessments/${la_id}"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
              captures: { la_v: "$.data.version" }
            - call: "POST /payment-schedules"
              payload: { liability_assessment_id: "${la_id}", expected_assessment_version: "${la_v}", source: "ACTUARIAL_CORRECTION", override_net_assessed_cents: 10020000000 }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "${gen1_years} == 20"
            - "${gen1_forgiven} == 6453348534"
            - "PaymentSchedule.${gen1_id}.amortization_basis_cents == 10020000000"
            - "PaymentSchedule.${gen1_id}.capped_basis_cents == 3566651466"
            - "PaymentSchedule.${gen1_id}.installment_count == 80"
            - "PaymentSchedule.${gen1_id}.quarterly_installment_cents == 44583143"
            - "PaymentSchedule.${gen1_id}.final_installment_cents == 44583169"
            - "${err} == ERR_UNAMORTIZABLE_ASSESSMENT"
            - "HTTP status of the POST /payment-schedules trigger == 422"
            - "PaymentSchedule.${gen1_id}.status == ACTIVE (the rejected regeneration superseded nothing)"
            - "LiabilityAssessment.${la_id}.active_schedule_generation == 1"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: presumptive_pool_terms_rounded_before_summing_mode_b
        grounds:
          - calculations.allocation_fraction_and_gross_share
          - entities.LiabilityAssessment.fields.pool_term_breakdown
          - entities.LiabilityAssessment.fields.gross_allocated_cents
          - entities.PlanYearValuation.fields.uvb_pool_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: three decayed pool terms each round to whole cents BEFORE they
          are summed, giving gross_allocated_cents == 114000000, whereas summing the unrounded terms
          36000000.36 + 38000000.38 + 40000000.3666... and rounding once gives 114000001 — the
          scaffold pins round-each-term-then-sum, so the one-cent difference is observable.
        test_recipe:
          setup:
            - "Plan with allocation_method PRESUMPTIVE, STATUTORY de minimis, interest_rate_bps 700."
            - "CERTIFIED valuations 2021..2025 each uvb_total_cents 20000000000, all_employer_contributions_cents 3000000000, all_employer_cbu 3000000; uvb_pool_cents 1000000000 for 2021 and 2022, 1200000012 for 2023, 1200000012 for 2024, 1200000011 for 2025."
            - "One CERTIFIED contribution record covering 2021..2025 with 1500000 CBU and 500000000 cents, so every plan year carries 300000 CBU and 100000000 cents and every three-year rolling dollar ratio is exactly 1/30."
            - "Withdrawal event for 2026 determined COMPLETE; clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Atlantic Bakery Workers Pension Plan", industry: "GENERAL", allocation_method: "PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Harborline Foods Group", common_control_basis: "COMBINED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Harborline Baking Co", ein: "410000301", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2021, measurement_window_start: "2021-01-01T00:00:00Z", measurement_window_end: "2021-10-01T00:00:00Z", uvb_total_cents: 20000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 3000000000, all_employer_cbu: 3000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2022, measurement_window_start: "2022-01-01T00:00:00Z", measurement_window_end: "2022-10-01T00:00:00Z", uvb_total_cents: 20000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 3000000000, all_employer_cbu: 3000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2023, measurement_window_start: "2023-01-01T00:00:00Z", measurement_window_end: "2023-10-01T00:00:00Z", uvb_total_cents: 20000000000, uvb_pool_cents: 1200000012, all_employer_contributions_cents: 3000000000, all_employer_cbu: 3000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2024, measurement_window_start: "2024-01-01T00:00:00Z", measurement_window_end: "2024-10-01T00:00:00Z", uvb_total_cents: 20000000000, uvb_pool_cents: 1200000012, all_employer_contributions_cents: 3000000000, all_employer_cbu: 3000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2025, measurement_window_start: "2025-01-01T00:00:00Z", measurement_window_end: "2025-10-01T00:00:00Z", uvb_total_cents: 20000000000, uvb_pool_cents: 1200000011, all_employer_contributions_cents: 3000000000, all_employer_cbu: 3000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2021, plan_year_end: 2025, contribution_base_units: 1500000, contribution_amount_cents: 500000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "POST /withdrawal-events"
              payload: { employer_id: "${emp_id}", cessation_date: "2026-04-01T00:00:00Z", withdrawal_plan_year: 2026, reported_cause: "CONTRIBUTION_OBLIGATION_CEASED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { we_id: "$.data.id" }
            - call: "POST /withdrawal-events/${we_id}/determine"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
          trigger:
            - call: "POST /liability-assessments"
              payload: { withdrawal_event_id: "${we_id}" }
              as: PlanActuary
              as_user_id: "act-001"
              captures: { la_id: "$.data.id", breakdown: "$.data.pool_term_breakdown" }
          assert:
            - "LiabilityAssessment.${la_id}.gross_allocated_cents == 114000000"
            - "LiabilityAssessment.${la_id}.gross_allocated_cents != 114000001 (sum-then-round is the wrong order)"
            - "len(${breakdown}) == 3"
            - "${breakdown}[0].plan_year == 2023 and ${breakdown}[0].decay_factor == 0.90 and ${breakdown}[0].term_cents == 36000000"
            - "${breakdown}[1].plan_year == 2024 and ${breakdown}[1].decay_factor == 0.95 and ${breakdown}[1].term_cents == 38000000"
