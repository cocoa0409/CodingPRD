            - call: "POST /review-cases/${rc_id}/appeal"
              payload: { appeal_grounds: "the committee was not shown the guardrail photographs", appeal_grounds_code: "PROCEDURAL" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { status_appealed: $.data.status, det_after: $.data.determination, round_after: $.data.appeal_round }
            - call: "GET /crashes/${c_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { prev_after: $.data.preventability_status }
          assert:
            - "${det_pending} == PENDING with four ballots cast and ${v4} > ${v3} > ${v2} > ${v1} — each ballot bumps the case version"
            - "${e_voter_decides} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — sm-001 holds a live ballot on this case, and that bars him from recording its determination even though POST /decide is a SafetyManager-exclusive operation he is otherwise entitled to"
            - "${dead_page} has exactly 1 row, sm-001's first ballot, and ${live_page} has exactly 3 rows (cm-001, cm-002 and sm-001's second) — re-casting supersedes the earlier ballot but always leaves the member one live one"
            - "${e_voter_decides_again} == ERR_SEGREGATION_OF_DUTIES — there is no escape by re-casting: the bar keys on holding ANY non-superseded ballot, so a member can never decide his own case"
            - "${det} == PREVENTABLE with ${basis} == UNWEIGHTED_MAJORITY (three live PREVENTABLE ballots meet COMMITTEE_QUORUM_MIN 3 on a COMPLETE posture), ${status_decided} == DECIDED and ${decided_by} == sm-002"
            - "${e_decider_appeals} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — the appeal bar keys on decided_by_user_id, so sm-002 cannot review his own determination"
            - "${status_appealed} == DELIBERATION with ${det_after} == PENDING and ${round_after} == 1 — sm-001 CAN grant the appeal: being a balloting member disqualifies him from deciding but not from granting, which proves the two segregation rules read different facts rather than one shared 'was involved' flag"
            - "${prev_after} == UNDER_REVIEW — the granted appeal unwound the determination it vacated"

