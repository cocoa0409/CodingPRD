  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Program.fields.client_id]
        distinguishing_aspect: "Program.version starts at 1 and increments by 1 on each mutating transition (activate bumps it from 1 to 2)."
        test_recipe:
          setup: ["Client+Program with one debt; capture version before and after activate."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c22@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, v_create: $.data.version }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "VI-1", original_balance: 5000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v_after: $.data.version }
          assert:
            - "Program.version at create == 1; Program.version after activate == 2"

      - name: derived_account_balance_reconciles_after_deposit
        claim_type: derived_field_reconciliation
        grounds: [entities.DedicatedAccount.fields.balance, entities.DedicatedAccount.fields.lifetime_deposited]
        distinguishing_aspect: "DedicatedAccount.balance and lifetime_deposited equal the sum of CLEARED deposits immediately after a deposit (no disbursements)."
        test_recipe:
          setup: ["Clock 2026-06-01T00:00:00Z. Client+Program; two CLEARED deposits of 600 in distinct months."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "C", email: "c23@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-04-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-05-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /accounts"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
              captures: { bal: "$.data[0].balance", lifetime: "$.data[0].lifetime_deposited" }
          assert:
            - "DedicatedAccount.balance == 1200.00 and lifetime_deposited == 1200.00"

      - name: rate_threshold_delinquent_then_cured_back_to_current
        claim_type: rate_threshold_triggers
        grounds: [entities.Program.fields.missed_deposit_count, state_machines.Program.field.account_standing]
        distinguishing_aspect: "missed_deposit_count crossing 1 moves standing to DELINQUENT; curing the missed deposit back to 0 returns standing to CURRENT (reset works)."
        test_recipe:
          setup: ["Clock 2026-06-01T00:00:00Z. Client+Program; one MISSED deposit -> DELINQUENT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "C", email: "c24@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-06-15T00:00:00Z", amount: 600, status: "MISSED" }
              as: ProgramAdmin
              captures: { dep_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              as: ProgramAdmin
              captures: { standing_before: $.data.account_standing }
            - call: "POST /deposits/${dep_id}/cure"
              payload: {}
              as: ProgramAdmin
            - call: "GET /programs/${prog_id}"
              as: ProgramAdmin
              captures: { standing_after: $.data.account_standing, missed: $.data.missed_deposit_count }
          assert:
            - "account_standing before cure == DELINQUENT (missed_deposit_count 1)"
            - "account_standing after cure == CURRENT (missed_deposit_count 0)"

      - name: cascade_settlement_void_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Settlement.FUNDED_to_VOIDED]
        excluded_because:
          difficulty_instance: compensating_invariant / account_cash_conserved_on_settlement_void
          rationale: "The void compensation cascade (account credit, fee WAIVED, debt/offer revert) is asserted by the named §1.8 instance."

