              as: FloorManager
              captures: { b_f: $.data.id }
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /shows/${show2_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
