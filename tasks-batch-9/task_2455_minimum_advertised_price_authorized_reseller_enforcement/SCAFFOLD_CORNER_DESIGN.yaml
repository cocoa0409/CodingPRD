            - "${st} == 'APPROVED'"
            - "${rby} == 'counsel-1'"
            - "${notes} == 'No resale price terms present'"

      - name: publish_requires_a_future_or_present_effective_from
        claim_type: conditional_action
        grounds: ["endpoints.POST /pricing-policies/{policy_id}/publish"]
        distinguishing_aspect: "Publication is conditional on effective_from >= the logical clock; publishing at exactly the clock instant 2026-08-01 is allowed and stamps published_by_user_id."
        test_recipe:
          setup: ["Policy MAP-2026-A in APPROVED at clock 2026-08-01."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
          trigger:
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { st: $.data.status, ef: $.data.effective_from, pby: $.data.published_by_user_id }
          assert:
            - "HTTP 200"
            - "${st} == 'PUBLISHED'"
            - "${ef} == '2026-08-01T00:00:00Z'"
            - "${pby} == 'counsel-1'"
            - "PricingPolicy.${pol}.superseded_by_policy_id == null"

      - name: withdraw_policy_records_the_reason_without_cascading
        claim_type: action_endpoint
        grounds: ["endpoints.POST /pricing-policies/{policy_id}/withdraw"]
        distinguishing_aspect: "Withdrawal is explicitly non-cascading: the policy reaches the terminal WITHDRAWN state with withdrawn_reason stored, while the product that names it as governing policy is untouched."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED with product SKU-AUDIO-1 governed by it."]
          setup_api_calls:
