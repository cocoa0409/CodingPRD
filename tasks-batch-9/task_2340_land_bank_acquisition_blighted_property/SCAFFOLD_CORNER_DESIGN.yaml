              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-380" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-4580-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
              captures: { pk_status: $.data.status }
          trigger:
            - call: "POST /land-bank/properties/${p_id}/title-actions"
              payload: { action_type: "QUIET_TITLE_SUIT" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta_id: $.data.id }
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { mid_custody: $.data.custody_status, mid_title: $.data.title_status }
            - call: "POST /land-bank/title-actions/${ta_id}/adjudicate"
              payload: { outcome: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { clear_custody: $.data.custody_status, clear_title: $.data.title_status }
            - call: "POST /land-bank/properties/${p_id}/list"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { final_custody: $.data.custody_status, final_title: $.data.title_status, listed: $.data.listed_at }
          assert:
            - "${pk_status} == CLOSED and the parcel is (ACQUIRED, CLOUDED) right after close"
            - "${mid_custody} == ACQUIRED and ${mid_title} == QUIET_TITLE_FILED  # title moved, custody did not"
            - "${clear_custody} == ACQUIRED and ${clear_title} == CLEAR"
            - "${final_custody} == LISTED and ${final_title} == CLEAR and ${listed} == 2026-08-01T00:00:00Z"
            - "Property.${p_id}.acquisition_cost_cents == 4000  # donation: offer 0 + fee 4000"

      - name: listing_blocked_while_demolition_order_scheduled
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Property.custody_status.ACQUIRED_to_LISTED.preconditions
          - validations[priority=66]
          - errors.ERR_PROPERTY_NOT_IN_INVENTORY
        distinguishing_aspect: "A guarded transition across entities: the parcel's own title is CLEAR and custody is ACQUIRED, but a SCHEDULED DEMOLITION order on it blocks listing with ERR_PROPERTY_NOT_IN_INVENTORY - and cancelling that order immediately unblocks the same call."
        test_recipe:
          setup:
            - "An ACQUIRED, CLEAR-title parcel (grade D, lot 10000, structure present) with a SCHEDULED DEMOLITION order (estimate 1973019) on an ANY source authorized 5000000."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Demolition Guard Line", source_type: "GRANT", authorized_cents: 5000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
