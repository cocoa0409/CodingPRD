  - section: endpoints
    instances:
      - name: list_registrations_pagination_and_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /registrations?workshop_id&limit=1 over 2 rows returns the fixed envelope: meta.api_request_id present, total_count 2, has_more true, exactly 1 data row."
        test_recipe:
          setup: ["capacity-5 workshop with 2 REGISTERED registrations (P1, P2)"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "PG-100", title: "PG", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CPG2", email: "cpg2@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PP1", email: "pp1@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "PP2", email: "pp2@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm Z", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 5 }, as: ProgramAdmin, captures: { ws: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${ws}", participant_id: "${p1}" }, as: ProgramAdmin }
            - { call: "POST /registrations", payload: { workshop_id: "${ws}", participant_id: "${p2}" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /registrations", payload: { workshop_id: "${ws}", limit: 1, offset: 0 }, as: ProgramAdmin }
