        distinguishing_aspect: "Two OFFERED calls for one seat (the issue endpoint does not require the prior call to resolve): E1 accepts first and fills the job; E2 then accepts with the CURRENT job version (OCC passes) but filled_count >= crew_required -> ERR_JOB_ALREADY_FILLED (422)."
        test_recipe:
          setup:
            - "Board with E1(pos1), E2(pos2); Job J crew_required=1"
            - "C1 issued -> E1 (OFFERED); C2 issued while C1 still OFFERED -> E2 (OFFERED)"
            - "E1 accepts: job FILLED, version advanced"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
