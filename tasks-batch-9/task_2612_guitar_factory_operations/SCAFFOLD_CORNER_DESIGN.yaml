            cmp1_status_after_reject: "QC_HELD"
            cmp1_qc_hold_reason_after_reject: "PROTECTED_SPECIES"
            cmp2_status_after_reject: "ROUGH_SAWN"
            build_stage_after_reject: "COMPLIANCE_HOLD"
            lot1_board_feet_available_after_reject: 0.00
            lot1_board_feet_unassigned_after_reject: 0.00
            lot1_board_feet_reserved_after_reject: 0.00
            lot1_board_feet_scrapped_after_reject: 99.10
            lot1_board_feet_kerf_loss_after_reject: 0.90
            stage_before_compliance_hold: "COMPONENTS_RELEASED"
