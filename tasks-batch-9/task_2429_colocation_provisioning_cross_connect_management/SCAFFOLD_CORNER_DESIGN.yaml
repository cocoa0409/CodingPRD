            - "The ticket now reports authorization_state == REVOKED and execution_state == CANCELLED"
            - "The ticket's authorized_at and response_deadline_at (00:00:00Z + 480 minutes = 2026-08-01T08:00:00Z for STANDARD) are unchanged by the revocation"

      - name: dispatch_of_an_unauthorized_ticket
        excluded_because:
          difficulty_instance: revoke_authorization_cancels_dispatched_execution_dimension
          rationale: "That §1.8 instance already dispatches on an AUTHORIZED ticket, revokes authorization mid-flight and then re-attempts dispatch, asserting ERR_TICKET_NOT_AUTHORIZED (priority 16) on a QUEUED-but-not-authorized ticket plus ERR_INVALID_STATE on the second revoke. Repeating the parallel-dimension guard here would add no new claim."

      - name: bounded_revision_cycle_on_a_cross_connect_order
        excluded_because:
          difficulty_instance: route_revision_cycle_bounded_at_two_conserves_port_pool
          rationale: "The cyclic-shape claim (ROUTE_PROPOSED → CHANGES_REQUESTED → ROUTE_PROPOSED twice, third request-changes refused with ERR_REVISION_LIMIT_REACHED, port pool conserved across every lap) is asserted end to end by that §1.8 instance."

      - name: de_energize_reverses_every_energize_side_effect
        excluded_because:
          difficulty_instance: de_energize_then_re_energize_restores_every_rollup_without_drift
          rationale: "The compensation pattern for ENERGIZED→DE_ENERGIZED→ENERGIZED — circuit allocation zeroed, Cabinet ACTIVE→INSTALLED on the 1→0 primary count, row and contract rollups returned to their pre-energization values with no drift — is the whole subject of that §1.8 instance."

      - name: decommission_fork_join_auto_advances_on_the_second_step
        excluded_because:
          difficulty_instance: cross_connect_close_pinned_six_step_order
          rationale: "That §1.8 instance drives the decommission order through both record-step calls (auto-join to READY_FOR_RELEASE) and release-ports, pinning the six-hop cascade order; the branching/join claim and every release-ports side effect are asserted there."

      - name: capacity_held_conditional_cascade_only_touches_reserved_cabinets
        excluded_because:
          difficulty_instance: energize_cascade_depth_five_density_capped_blocks_neighbour_circuit
          rationale: "The conditional cascade (row flips DENSITY_CAPPED → only RESERVED cabinets become CAPACITY_HELD → only their DESIGNED circuits become BLOCKED, INSTALLED/ACTIVE cabinets untouched) is asserted at depth five by that §1.8 instance."

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: measured_peak_window_boundary_admits_day_thirty_and_ignores_day_thirty_one
        claim_type: input_set_filtering
        grounds:
          - calculations.row_capacity_and_posture.formula.measured_peak_kw
          - calculations.row_capacity_and_posture.constants.MEASURED_WINDOW_DAYS
          - endpoints.POST_/colocation/power-circuits/{circuit_id}/readings
        distinguishing_aspect: "The trailing window is `interval_start >= clock_now - 30 days` inclusive: an interval starting exactly at 2026-07-02T00:00:00Z counts while one starting an hour earlier (2026-07-01T23:00:00Z) is dropped, so the higher out-of-window peak never reaches measured_peak_kw."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so the 30-day window opens at 2026-07-02T00:00:00Z."
            - "Row H4/R1 (design_density 25.0, max_row_power 200.0, cooling 60.0) with one RESERVED cabinet C01 carrying one DESIGNED circuit; effective_ceiling_kw = min(200.0, 25.000, 60.0) = 25.000."
            - "Two meter intervals appended: the OLDER one (interval_start 2026-07-01T23:00:00Z, peak_kw 9.0) then the in-window one (interval_start 2026-07-02T00:00:00Z, peak_kw 5.0)."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Cinder Hollow", account_code: "CHW" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "H4", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9301", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 50, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir_id}/readings"
              payload: { interval_start: "2026-07-01T23:00:00Z", interval_end: "2026-07-02T00:00:00Z", kwh: 9.0, peak_kw: 9.0 }
              as: BillingOperator
            - call: "POST /colocation/power-circuits/${cir_id}/readings"
              payload: { interval_start: "2026-07-02T00:00:00Z", interval_end: "2026-07-02T01:00:00Z", kwh: 5.0, peak_kw: 5.0 }
              as: BillingOperator
          trigger:
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
          assert:
            - "Response is 200 with data.measured_peak_kw == 5.000 — the 9.0 peak starting at 2026-07-01T23:00:00Z is outside the window"
            - "data.allocated_power_kw == 0.000 because the circuit is only DESIGNED"
            - "data.effective_ceiling_kw == 25.000, data.stranded_nameplate_kw == 25.000 and data.stranded_measured_kw == 20.000"
            - "data.row_status == OPEN (cooling_load_kw 0.000 < 54.000 alert, allocated 0.000 < density_ceiling 25.000)"
            - "GET /colocation/power-circuits/${cir_id} shows meter_intervals holding both intervals in request order"

