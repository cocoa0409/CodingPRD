            - "the session is untouched: ClassSession.${sess1_id}.seats_taken == 1 and fullness_posture == FULL"
            - "Client.${bea_id}.status == PORTABILITY_HOLD"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: waitlist_offer_refused_at_exactly_two_strikes_and_admitted_below
        grounds:
          - calculations.waitlist_offer_order
          - calculations.waitlist_offer_order.constants.STRIKE_OFFER_BLOCK_THRESHOLD
          - entities.Client.fields.no_show_strike_count
          - state_machines.WaitlistEntry.ACTIVE_to_OFFERED
        distinguishing_aspect: "A numeric threshold crossing evaluated with >=, so a strike count of exactly 2 keeps the hold in the candidate pool and exactly 3 removes it; the two fixtures differ by one strike and the observable is which entry receives the seat."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio, payroll period, template, instructor, a capacity-1 session, a booked client occupying the seat, and two waitlisted clients seeded at 2 and 3 strikes."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - *b7_a2_sess_cap1
            - *b4_a0_client_maya
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id }
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Cleo Ruiz", email: "cleo@example.com", home_state_code: "CA" }
              as: Client
              captures: { cleo_id: $.data.id }
            - call: "POST /_inject/client-history"
              payload: { client_id: "${bea_id}", no_show_strike_count: 2, late_cancel_count: 0 }
              as: OperatorOnly
            - call: "POST /_inject/client-history"
              payload: { client_id: "${cleo_id}", no_show_strike_count: 3, late_cancel_count: 0 }
              as: OperatorOnly
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess1_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_seat_id: $.data.id }
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess1_id}", client_id: "${bea_id}", position_mode: "QUEUED" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { wl_bea_id: $.data.id }
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess1_id}", client_id: "${cleo_id}", position_mode: "QUEUED" }
              as: Client
              as_user_id: "${cleo_id}"
              captures: { wl_cleo_id: $.data.id }
          trigger:
            - call: "POST /wellness/bookings/${bk_seat_id}/cancel"
              payload: { reason: "schedule conflict" }
              as: Client
              as_user_id: "${maya_id}"
          assert:
            - "the seat is offered to WaitlistEntry.${wl_bea_id} whose client holds exactly 2 strikes — 2 >= 3 is false, so the hold is admissible"
            - "WaitlistEntry.${wl_cleo_id} stays ACTIVE because 3 >= 3 is true, so the equality case is the one that blocks"
            - "flipping the two strikes upward by one — reapplying POST /_inject/client-history with 3 and 4 — moves the offer to ${wl_cleo_id}, confirming the comparison is not strict on the other side"

      - name: payroll_period_boundary_is_inclusive_so_gap_only_fires_past_the_endpoint
        grounds:
          - calculations.payroll_period_coverage
          - calculations.payroll_period_coverage.constants.MIN_PAYROLL_PERIOD_DAYS
          - errors.ERR_PAYROLL_PERIOD_GAP
          - endpoints.POST_/wellness/payroll-periods
        distinguishing_aspect: "An empty-set boundary rather than a numeric one: the coverage lookup is a closed-interval search, so a session starting exactly at a period's end_date resolves and only a session one second later falls into the empty set that raises ERR_PAYROLL_PERIOD_GAP."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a single payroll period running 2026-06-01T00:00:00Z to 2026-06-30T23:59:59Z, one template and one instructor."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_id}", period_index: 1, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp_id: $.data.id }
            - call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Ivy Chen", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 5000 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { ivy_id: $.data.id }
          trigger:
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-30T23:59:59Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_edge_id: $.data.id, sess_edge_pp: $.data.payroll_period_id }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-B", start_at: "2026-07-01T00:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the session starting exactly at the period end resolves: ClassSession.${sess_edge_id}.payroll_period_id == ${pp_id}"
            - "the session one second later fails with error_id == ERR_PAYROLL_PERIOD_GAP, and GET /wellness/class-sessions?studio_id=${studio_id} still returns exactly 1 row"
            - "a payroll period spanning exactly 7 inclusive days is accepted, so MIN_PAYROLL_PERIOD_DAYS is not off by one at the boundary"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: booking_admission_depends_on_the_clients_portability_posture
        grounds:
          - validations.check_client_admissibility_band
          - errors.ERR_CLIENT_NOT_ADMISSIBLE
          - state_machines.ClientPortabilityRequest.PENDING_to_RESOLVED_RELEASE
          - state_machines.Booking.RESERVED_to_CANCELLED
          - entities.Client.fields.status
        distinguishing_aspect: "The dependency crosses Booking → Client, and it flips without any Booking-side transition: the same client, the same session and the same payload are admitted before the portability release and refused after it, purely because the Client row moved into PORTABILITY_HOLD."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with payroll period, template, instructor, a capacity-4 session and a client who will be released."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 4, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_open_id: $.data.id }
            - *b4_a0_client_maya
          trigger:
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_open_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_ok_id: $.data.id }
            - call: "POST /wellness/portability-requests"
              payload: { studio_id: "${studio_id}", requesting_client_id: "${maya_id}", dispute_reason: "relocating" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /wellness/portability-requests/${pr_id}/resolve-release"
              payload: { include_booking_history: true, include_financial_history: false }
              as: StudioOwner
              as_user_id: "${studio_id}"
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_open_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the first booking succeeds with status RESERVED before the posture changes"
            - "the portability release moves Client.${maya_id}.status to PORTABILITY_HOLD and Studio.${studio_id}.data_ownership_state to PORTABILITY_GRANTED"
            - "the second booking on the SAME session fails with error_id == ERR_CLIENT_NOT_ADMISSIBLE"
            - "the refusal is caused by the Client row, not the session: GET /wellness/class-sessions/${sess_open_id} still reports fullness_posture OPEN with 1 of 4 seats taken"

      - name: session_completion_admission_depends_on_the_payroll_period_state
        grounds:
          - state_machines.ClassSession.IN_PROGRESS_to_COMPLETED
          - state_machines.PayrollPeriod.OPEN_to_LOCKED
          - errors.ERR_PAYROLL_PERIOD_NOT_OPEN
          - endpoints.POST_/wellness/payroll-periods/{id}/close
        distinguishing_aspect: "The dependency crosses ClassSession → PayrollPeriod, a different entity pair from the client-posture instance: a session whose period is LOCKED may still complete, but the commission entries it would accrue are refused, so the PayrollPeriod state — not the session state — decides whether the payroll side effect lands."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a June payroll period, template, instructor, a capacity-2 June session whose attendee has already checked in, and a second July period."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_id}", period_index: 2, start_date: "2026-07-01T00:00:00Z", end_date: "2026-07-31T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp2_id: $.data.id }
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id }
            - *b4_a0_client_maya
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /wellness/bookings/${bk_id}/check-in"
              payload: {}
              as: Client
              as_user_id: "${maya_id}"
          trigger:
            - call: "POST /wellness/payroll-periods/${pp1_id}/close"
              payload: { expected_payroll_period_version: "${pp1_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { err_close: $.data.error_id }
            - call: "POST /wellness/class-sessions/${sess_id}/complete"
              payload: {}
              as: PlatformAdmin
          assert:
            - "closing the June period while its own session is still SCHEDULED is refused, because the period must have no session in {SCHEDULED, IN_PROGRESS}"
            - "the session then completes and Booking.${bk_id}.status == ATTENDED"
            - "a session that completes against a LOCKED period is refused with ERR_PAYROLL_PERIOD_NOT_OPEN and accrues no CommissionEntry, so GET /wellness/commission-entries?payroll_period_id=${pp1_id} still returns 0 rows"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: room_overlap_uses_a_half_open_interval_so_adjacency_is_admitted
        grounds:
          - errors.ERR_ROOM_OVERLAP
          - calculations.session_list_price
          - entities.ClassSession.fields.start_at
          - endpoints.POST_/wellness/class-sessions
        distinguishing_aspect: "The interval semantics are half-open: [start, end) collides only when start_at is strictly less than the other session's end_at, so a session starting at the precise instant another ends in the same room is admitted — the treatment of adjacency is the whole rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with payroll period, a 50-minute template and an instructor."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_first_id: $.data.id }
          trigger:
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-B", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_adjacent_id: $.data.id, sess_adjacent_start: $.data.start_at }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:50:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_boundary_id: $.data.id, sess_boundary_start: $.data.start_at }
          assert:
            - "the ROOM-B session at the same instant is admitted, because the room differs — overlap is scoped to a single room_code"
            - "the ROOM-A session starting at exactly 2026-06-20T17:50:00Z is admitted even though the first session ends at that instant: the interval is half-open"
            - "ClassSession.${sess_boundary_id}.end_at == 2026-06-20T18:40:00Z"
            - "a further ROOM-A session starting at 2026-06-20T17:51:00Z succeeds, while one starting at 2026-06-20T17:00:00Z on a fresh clock fails with ERR_ROOM_OVERLAP"

      - name: instructor_buffer_uses_a_closed_gap_so_a_short_changeover_is_rejected
        grounds:
          - errors.ERR_BUFFER_INSUFFICIENT
          - entities.ClassTemplate.fields.buffer_minutes
          - validations.check_temporal_band
          - endpoints.POST_/wellness/class-sessions
        distinguishing_aspect: "The second overlap family measures a closed gap rather than inspecting intervals: the required separation is the larger of the two templates' buffer_minutes values, and any gap strictly smaller than that is refused — a different geometric treatment from the half-open room rule and on a different resource (instructor versus room)."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with payroll period, a 50-minute template carrying a 15-minute buffer, and an instructor."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_lead_id: $.data.id }
          trigger:
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-C", start_at: "2026-06-20T18:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the first session occupies 17:00 to 17:50 and the candidate starts at 18:00, leaving a 10-minute gap"
            - "the request fails with error_id == ERR_BUFFER_INSUFFICIENT, because 10 < the required 15-minute changeover"
            - "the same request at 18:05 — a 15-minute gap — is admitted, so the comparison is not strict at the boundary"
            - "the two templates' buffers are combined by taking the larger value, so a candidate on a 30-minute-buffer template needs the larger gap"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: pack_credit_conservation_survives_a_failed_claim_reversal
        grounds:
          - calculations.pack_refund_restoration
          - calculations.pack_refund_restoration.formula
          - state_machines.WaitlistEntry.CLAIMED_to_ACTIVE
          - entities.ClassPack.fields.credits_remaining
          - endpoints.POST_/wellness/bookings/{id}/reverse-claim
        distinguishing_aspect: "The conserved quantity is CREDIT — an integer count of pack credits — and the invariant is pinned as an explicit formula over ClassPack.pack_size and the bookings still holding credits, so a forward claim paired with a reverse-claim must leave sum(pack_size) − sum(credits_remaining) equal to the credits consumed by surviving bookings."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with payroll period, template, instructor, a capacity-1 session, a client holding a 5-credit pack, and a waitlist hold that will be offered and claimed."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - *b7_a2_sess_cap1
            - *b4_a0_client_maya
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id, bea_v: $.data.version }
            - call: "POST /wellness/class-packs"
              payload: { studio_id: "${studio_id}", client_id: "${bea_id}", pack_size: 5, purchased_at: "2026-06-01T00:00:00Z", expiry_scheme: "NONE", expected_client_version: "${bea_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pack_bea_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess1_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_seat_id: $.data.id }
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess1_id}", client_id: "${bea_id}", position_mode: "QUEUED" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /wellness/bookings/${bk_seat_id}/cancel"
              payload: { reason: "schedule conflict" }
              as: Client
              as_user_id: "${maya_id}"
          trigger:
            - call: "POST /wellness/waitlist-entries/${wl_id}/claim"
              payload: { payment_source: "CLASS_PACK", class_pack_id: "${pack_bea_id}" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { bk_claimed_id: $.data.id }
            - call: "POST /wellness/bookings/${bk_claimed_id}/reverse-claim"
              payload: { reason: "client called in sick" }
              as: StudioOwner
              as_user_id: "${studio_id}"
          assert:
            - "after the claim, ClassPack.${pack_bea_id}.credits_remaining == 4 and Booking.${bk_claimed_id}.status == RESERVED"
            - "after the reverse-claim, ClassPack.${pack_bea_id}.credits_remaining == 5 again — the compensating action restores the exact number, not a rounded one"
            - "the invariant credits_remaining + credits consumed by bookings in {RESERVED, CHECKED_IN, ATTENDED} == pack_size == 5 holds at every quiescent instant of the walk"
            - "the promoted WaitlistEntry.${wl_id} is back to ACTIVE with position_mode QUEUED and a raw_sequence_no strictly greater than the session's other holds"

      - name: studio_commission_and_attendance_conservation_across_a_late_substitution
        grounds:
          - calculations.pack_refund_restoration
          - calculations.pack_refund_restoration.formula
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED_BY_STUDIO
          - entities.CommissionEntry.fields.status
          - endpoints.POST_/wellness/class-sessions/{id}/cancel
        distinguishing_aspect: "The conserved quantity is REVENUE — the studio's attended-session gross in integer cents — and it is a different conserved type from the credit count: cancelling a session whose attended booking already produced a commission entry must post a REVERSED entry with the exact negation, so the studio's gross is identical before and after."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a June payroll period, a 4000-cent template, an instructor at the GROWTH teaching rate, a capacity-2 session on 2026-06-20T17:00:00Z, and a client who checks in."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - *b4_a0_client_maya
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /wellness/bookings/${bk_id}/check-in"
              payload: {}
              as: Client
              as_user_id: "${maya_id}"
          trigger:
            - call: "POST /wellness/class-sessions/${sess_id}/complete"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wellness/class-sessions/${sess_id}/cancel"
              payload: { reason: "studio closed for the day" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the completed session posts a CommissionEntry with commission_cents == 840: the 3360 studio-channel list price at the GROWTH teaching rate of 2500 basis points"
            - "the studio's attended-session gross summed over Booking.${bk_id} is 3360 at that instant"
            - "the follow-up cancel is refused, because COMPLETED is terminal — the reversal must instead be posted against a still-open session"
            - "when the reversal is performed on an open session, the CommissionEntry flips to REVERSED with the same magnitude, and gross-over-attended-bookings is unchanged at 3360 — no drift is introduced by the reversal entry"
