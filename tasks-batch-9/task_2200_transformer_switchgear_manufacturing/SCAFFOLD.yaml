    output: EngineeredOrder
    side_effects: ["fulfillment_status := CANCELLED", "non-terminal ShipmentRelease rows -> CANCELLED", "non-terminal CommissioningJob rows -> CANCELLED", "open PunchListItem rows -> REJECTED", "increments EngineeredOrder.version by 1"]
  - id: get_order_posture
    method: GET
    path: "/engineered-orders/{id}/posture"
