            - "D2 RESOLVED_REPLACEMENT: qty_damaged_unresolved drops 4 -> 2 and qty_damaged_credited rises 0 -> 2; damage_credit_cents stays 0 (replacement is not money)"
            - "S1 SHORTAGE claim resolves RESOLVED_REPLACEMENT; qty_short stays 5 (replacement units arrive via a future PO, not this line)"
            - "POLine.${l_id}: qty_received == 35, qty_short == 5, damage_credit_cents == 0"

