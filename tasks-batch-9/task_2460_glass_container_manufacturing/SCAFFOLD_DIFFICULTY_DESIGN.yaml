      - name: mold_unmount_returns_cavities_to_the_machine_capacity_pool
        grounds:
          - state_machines.MoldSet.MOUNTED_to_AVAILABLE
          - entities.FormingMachine.fields.mounted_cavities
          - validations.priority_40
          - errors.ERR_CAVITY_CAPACITY_EXCEEDED
          - calculations.changeover_minutes
        distinguishing_aspect: |
          A different conserved quantity than melt tonnage: machine cavity occupancy. Closing a job
          releases the machine to IDLE but deliberately leaves the mold set MOUNTED, so
          mounted_cavities stays at 30 of 40 and the next job's 12-cavity set cannot mount
          (ERR_CAVITY_CAPACITY_EXCEEDED). The explicit unmount must return exactly 30 cavities,
