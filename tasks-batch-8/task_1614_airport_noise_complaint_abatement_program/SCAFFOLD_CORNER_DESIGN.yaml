            - { call: "PATCH /noise-program/flight-operations/${f1}", payload: { status: "OPERATED", actual_at: "2026-08-03T22:35:00Z" }, as: NoiseOfficeAdmin }
            - { call: "PATCH /noise-program/flight-operations/${f2}", payload: { status: "OPERATED", actual_at: "2026-08-04T22:35:00Z" }, as: NoiseOfficeAdmin }
