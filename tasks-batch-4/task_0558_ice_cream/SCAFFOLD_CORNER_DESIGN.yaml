              payload: { flavor_id: "${van}", decorating_station_id: "00000000-0000-4000-8000-000000000000", customer_name: "Rey", decorate_start_utc: "2026-05-03T10:00:00Z", decorate_end_utc: "2026-05-03T12:00:00Z", pickup_utc: "2026-05-04T09:00:00Z", quoted_price_cents: 4000 }
