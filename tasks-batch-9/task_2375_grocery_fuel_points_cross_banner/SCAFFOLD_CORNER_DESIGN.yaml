            - "GET /fuel-redemptions?member_id=${cm_id} returns meta total_count == 0"
            - "Member.${cm_id}.available_points == 300 and version unchanged"

      - name: the_five_uniqueness_rules_at_priority_sixty_nine_each_fire_on_their_own_scope
        claim_type: Violation → Error
        grounds:
          - validations[priority=69]
          - errors[ERR_ALT_ID_DUPLICATE]
          - errors[ERR_HOUSEHOLD_CODE_DUPLICATE]
          - errors[ERR_CYCLE_MONTH_DUPLICATE]
          - errors[ERR_DUPLICATE_ACTIVE_LINK]
          - errors[ERR_PRIMARY_LINK_EXISTS]
        distinguishing_aspect: "All five uniqueness checks share priority 69 yet are scoped disjointly, so each is reachable alone: a repeated alt_id, a repeated household_code, a repeated cycle_month, a second link for the SAME (household, member) pair with a different role, and a second PRIMARY link for a DIFFERENT member of the same household each return their own code."
        test_recipe:
          setup:
            - "Banner CORE with cycles 2026-08 and 2026-09, member CM (alt_id 6660000001), a second member CM9, household HH-CORE-1 and an ACTIVE PRIMARY link CM -> HH-CORE-1; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_member
            - *cx_member2
            - *cx_household
            - *cx_link
            - *cx_link_activate
          trigger:
            - call: "POST /members"
              payload: { banner_id: "${cb_id}", alt_id: "6660000001", card_number: "4100000000000077", full_name: "Corner Clone" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { dup_alt_err: $.data.error_id }
            - call: "POST /households"
              payload: { banner_id: "${cb_id}", household_code: "HH-CORE-1" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { dup_hh_err: $.data.error_id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${cb_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { dup_cycle_err: $.data.error_id }
            - call: "POST /household-links"
              payload: { household_id: "${chh_id}", member_id: "${cm_id}", link_role: "SECONDARY" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { dup_link_err: $.data.error_id }
            - call: "POST /household-links"
              payload: { household_id: "${chh_id}", member_id: "${cm9_id}", link_role: "PRIMARY" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { dup_primary_err: $.data.error_id }
          assert:
            - "${dup_alt_err} == \"ERR_ALT_ID_DUPLICATE\" (409)"
            - "${dup_hh_err} == \"ERR_HOUSEHOLD_CODE_DUPLICATE\" (409)"
            - "${dup_cycle_err} == \"ERR_CYCLE_MONTH_DUPLICATE\" (409)"
            - "${dup_link_err} == \"ERR_DUPLICATE_ACTIVE_LINK\" (409)"
            - "${dup_primary_err} == \"ERR_PRIMARY_LINK_EXISTS\" (409)"
            - "Household.${chh_id}.linked_member_count == 1 and GET /household-links?household_id=${chh_id} returns meta total_count == 1"

      - name: each_site_type_gate_at_priority_sixty_three_rejects_the_wrong_site_kind
        claim_type: Conditional validation
        grounds:
          - validations[priority=63]
          - entities.Site.fields.site_type
          - errors[ERR_GROCERY_SITE_REQUIRED]
          - errors[ERR_FUEL_SITE_REQUIRED]
          - errors[ERR_PARTNER_SITE_REQUIRED]
        distinguishing_aspect: "The three site-type gates share priority 63 and each names a different endpoint: a basket rung at a fuel centre is refused ERR_GROCERY_SITE_REQUIRED, a redemption attempted at a grocery lane is refused ERR_FUEL_SITE_REQUIRED, and a settlement batch opened against an owned fuel centre is refused ERR_PARTNER_SITE_REQUIRED — an owned fuel centre is a legal redemption site but never a settleable one."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site G-100, owned fuel centre F-100 and member CM holding 300 points; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
            - call: "GET /sites/${cf_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${cf_id}"
              captures: { csv_fuel: $.data.version }
          trigger:
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 10000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cf_id}"
              captures: { grocery_req_err: $.data.error_id }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv}" }
              as: PumpTerminal
              as_user_id: "${cg_id}"
              captures: { fuel_req_err: $.data.error_id }
            - call: "POST /settlement-batches"
              payload: { site_id: "${cf_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${csv_fuel}" }
              as: SettlementClerk
              as_user_id: "${cf_id}"
              captures: { partner_req_err: $.data.error_id }
          assert:
            - "${grocery_req_err} == \"ERR_GROCERY_SITE_REQUIRED\" (422)"
            - "${fuel_req_err} == \"ERR_FUEL_SITE_REQUIRED\" (422)"
            - "${partner_req_err} == \"ERR_PARTNER_SITE_REQUIRED\" (422)"
            - "GET /settlement-batches?site_id=${cf_id} returns meta total_count == 0 and Member.${cm_id}.available_points == 300"

      - name: transfer_recipient_membership_is_checked_before_the_block_multiple_rule
        claim_type: Priority conflict
        grounds:
          - validations[priority=62]
          - validations[priority=64]
          - errors[ERR_RECIPIENT_NOT_IN_HOUSEHOLD]
          - errors[ERR_INVALID_TRANSFER_AMOUNT]
        distinguishing_aspect: "Priority 62 runs before 64: a 150-point transfer to an UNLINKED member reports ERR_RECIPIENT_NOT_IN_HOUSEHOLD even though the amount is also invalid, a self-transfer is caught by the same rule, and only once the recipient is properly linked does the same 150 points surface ERR_INVALID_TRANSFER_AMOUNT."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, household HH-CORE-1, member CM (300 points, ACTIVE PRIMARY link), member CM9 (ACTIVE SECONDARY link) and an unlinked member CM8; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_member2
            - call: "POST /members"
              payload: { banner_id: "${cb_id}", alt_id: "6660000008", card_number: "4100000000000008", full_name: "Corner Member Eight" }
              as: ProgramAdmin
              captures: { cm8_id: $.data.id }
            - *cx_household
            - *cx_link
            - *cx_link_activate
            - *cx_link2
            - *cx_link2_activate
            - *cx_basket
            - *cx_post
          trigger:
            - call: "POST /point-transfers"
              payload: { member_id: "${cm_id}", recipient_member_id: "${cm8_id}", points: 150 }
              as: Member
              as_user_id: "${cm_id}"
              captures: { unlinked_err: $.data.error_id }
            - call: "POST /point-transfers"
              payload: { member_id: "${cm_id}", recipient_member_id: "${cm_id}", points: 100 }
              as: Member
              as_user_id: "${cm_id}"
              captures: { self_err: $.data.error_id }
            - call: "POST /point-transfers"
              payload: { member_id: "${cm_id}", recipient_member_id: "${cm9_id}", points: 150 }
              as: Member
              as_user_id: "${cm_id}"
              captures: { amount_err: $.data.error_id }
          assert:
            - "${unlinked_err} == \"ERR_RECIPIENT_NOT_IN_HOUSEHOLD\" (422) — the amount rule never ran"
            - "${self_err} == \"ERR_RECIPIENT_NOT_IN_HOUSEHOLD\" (422) for the self-transfer"
            - "${amount_err} == \"ERR_INVALID_TRANSFER_AMOUNT\" (422) once the recipient is linked"
            - "GET /point-ledger-entries?member_id=${cm_id}&entry_type=TRANSFER_OUT returns meta total_count == 0 and Member.${cm_id}.available_points == 300"

      - name: the_fourth_transfer_in_a_cycle_is_refused_before_the_balance_is_consulted
        claim_type: Aggregate validation
        grounds:
          - validations[priority=66]
          - validations[priority=72]
          - entities.Banner.fields.max_transfers_per_cycle
          - errors[ERR_TRANSFER_LIMIT_EXCEEDED]
        distinguishing_aspect: "The cap counts TRANSFER_OUT rows per household per OPEN cycle, so three 100-point transfers succeed and the fourth is refused 409 ERR_TRANSFER_LIMIT_EXCEEDED — priority 66 beats priority 72, so the answer is the limit error and not the ERR_INSUFFICIENT_POINTS that the now-zero balance would also justify."
        test_recipe:
          setup:
            - "Banner CORE (max_transfers_per_cycle 3) with cycles, grocery site, household HH-CORE-1 and members CM (300 points, ACTIVE PRIMARY) and CM9 (ACTIVE SECONDARY); logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_member2
            - *cx_household
            - *cx_link
            - *cx_link_activate
            - *cx_link2
            - *cx_link2_activate
            - *cx_basket
            - *cx_post
            - *cx_transfer
            - call: "POST /point-transfers"
              payload: { member_id: "${cm_id}", recipient_member_id: "${cm9_id}", points: 100 }
              as: Member
              as_user_id: "${cm_id}"
            - call: "POST /point-transfers"
              payload: { member_id: "${cm_id}", recipient_member_id: "${cm9_id}", points: 100 }
              as: Member
              as_user_id: "${cm_id}"
          trigger:
            - call: "POST /point-transfers"
              payload: { member_id: "${cm_id}", recipient_member_id: "${cm9_id}", points: 100 }
              as: Member
              as_user_id: "${cm_id}"
              captures: { limit_err: $.data.error_id }
          assert:
            - "the fourth transfer returned HTTP 409 with ${limit_err} == \"ERR_TRANSFER_LIMIT_EXCEEDED\", not ERR_INSUFFICIENT_POINTS"
            - "GET /point-ledger-entries?member_id=${cm_id}&entry_type=TRANSFER_OUT returns meta total_count == 3"
            - "Member.${cm_id}.available_points == 0 and Member.${cm9_id}.available_points == 300"
            - "Household.${chh_id}.aggregate_available_points == 300"

      - name: accrual_is_refused_when_the_following_month_has_no_cycle_to_expire_into
        claim_type: Violation → Error
        grounds:
          - validations[priority=68]
          - calculations.purchase_point_accrual
          - errors[ERR_NEXT_CYCLE_NOT_DEFINED]
        distinguishing_aspect: "Posting needs somewhere to hang the new lot's lot_expires_at: with only the 2026-08 cycle defined the post is refused 422 ERR_NEXT_CYCLE_NOT_DEFINED and the basket stays RECORDED / NOT_ACCRUED, and the identical post succeeds the moment the 2026-09 cycle exists."
        test_recipe:
          setup:
            - "Banner CORE with ONLY the 2026-08 cycle, grocery site, member CM and one RECORDED 30000-cent basket; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_grocery
            - *cx_member
            - *cx_basket
          trigger:
            - call: "POST /purchase-transactions/${cbasket_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { next_err: $.data.error_id }
            - *cx_sep
            - call: "POST /purchase-transactions/${cbasket_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { post_points: $.data.gross_points_awarded }
          assert:
            - "the first post returned HTTP 422 with ${next_err} == \"ERR_NEXT_CYCLE_NOT_DEFINED\""
            - "PurchaseTransaction.${cbasket_id}.posting_status was still \"RECORDED\" and accrual_status \"NOT_ACCRUED\" after the refusal"
            - "the post after the 2026-09 cycle exists returned HTTP 200 with ${post_points} == 300"
            - "the resulting ACCRUAL row carries lot_expires_at == \"2026-09-30T23:59:59.999Z\""

      - name: posting_into_a_suspended_banner_is_refused
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=44]
          - state_machines.Banner
          - errors[ERR_BANNER_SUSPENDED]
        distinguishing_aspect: "Suspension freezes earning without touching stored history: an already-RECORDED basket can no longer be posted (409 ERR_BANNER_SUSPENDED) while GET on the same basket and its member still answer 200 with unchanged figures."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, member CM and one RECORDED 30000-cent basket; the banner is then suspended; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_basket
            - call: "POST /banners/${cb_id}/suspend"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /purchase-transactions/${cbasket_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { susp_err: $.data.error_id }
          assert:
            - "the response status is 409 and ${susp_err} == \"ERR_BANNER_SUSPENDED\""
            - "Banner.${cb_id}.status == \"SUSPENDED\""
            - "PurchaseTransaction.${cbasket_id}.posting_status == \"RECORDED\" and gross_points_awarded == 0"
            - "Member.${cm_id}.available_points == 0"

      - name: posting_outside_every_open_cycle_window_is_refused
        claim_type: Temporal validation
        grounds:
          - validations[priority=48]
          - entities.PointCycle.fields.closes_at
          - errors[ERR_CYCLE_NOT_OPEN]
        distinguishing_aspect: "The governing cycle is chosen by the logical clock, not by transacted_at: with the clock at 2026-10-01T00:00:00Z — past both OPEN cycles' windows — the post of an August basket is refused 409 ERR_CYCLE_NOT_OPEN even though a cycle with status OPEN still exists."
        test_recipe:
          setup:
            - "Banner CORE with OPEN cycles 2026-08 and 2026-09, grocery site, member CM and one RECORDED basket transacted 2026-08-01; the clock is then advanced to 2026-10-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_basket
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /purchase-transactions/${cbasket_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { window_err: $.data.error_id }
          assert:
            - "the response status is 409 and ${window_err} == \"ERR_CYCLE_NOT_OPEN\""
            - "GET /point-cycles?banner_id=${cb_id}&status=OPEN still returns meta total_count == 2"
            - "GET /point-ledger-entries?member_id=${cm_id} returns meta total_count == 0"

      - name: dispensing_one_thousandth_of_a_gallon_over_the_authorization_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[priority=74]
          - calculations.redemption_discount_amount
          - errors[ERR_GALLONS_EXCEED_AUTHORIZATION]
        distinguishing_aspect: "gallons_authorized is an inclusive ceiling checked at the third decimal: 35.001 gallons against a 35.000-gallon authorisation is refused 422 and the redemption remains AUTHORIZED (never clamped to 35.000), while exactly 35.000 completes for 1050 cents."
        test_recipe:
          setup:
            - "Banner CORE (owned_max_gallons_per_redemption 35) with cycles, grocery site, owned fuel centre and a member holding 300 points with one AUTHORIZED 300-point redemption; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
            - *cx_redeem
          trigger:
            - call: "POST /fuel-redemptions/${cr_id}/complete"
              payload: { gallons_dispensed: 35.001 }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { over_err: $.data.error_id }
            - call: "POST /fuel-redemptions/${cr_id}/complete"
              payload: { gallons_dispensed: 35.000 }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { exact_discount: $.data.discount_amount_cents, exact_settlement: $.data.settlement_status }
          assert:
            - "the over-dispense returned HTTP 422 with ${over_err} == \"ERR_GALLONS_EXCEED_AUTHORIZATION\""
            - "FuelRedemption.${cr_id}.authorization_status was still \"AUTHORIZED\" with gallons_dispensed == null after the refusal"
            - "the exact dispense returned HTTP 200 with ${exact_discount} == 1050 and ${exact_settlement} == \"NOT_APPLICABLE\" (owned fuel centre)"
            - "Site.${cf_id}.unbatched_gallons == 0 and unbatched_discount_cents == 0"

      - name: submitting_a_batch_with_no_pending_gallons_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[priority=76]
          - endpoints.POST_/settlement-batches/{id}/submit
          - errors[ERR_NO_SETTLEABLE_GALLONS]
        distinguishing_aspect: "An empty period may be OPENED but never SUBMITTED: the DRAFT batch is created 201 and only the submit answers 422 ERR_NO_SETTLEABLE_GALLONS, leaving the batch DRAFT with submitted_by_user_id null."
        test_recipe:
          setup:
            - "Banner CORE with partner station P-100 that has no dispensed redemptions, and one DRAFT August batch; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_partner
            - *cx_site_version
            - *cx_batch
          trigger:
            - call: "POST /settlement-batches/${cbatch_id}/submit"
              payload: {}
              as: SettlementClerk
              as_user_id: "${cp_id}"
              captures: { empty_err: $.data.error_id }
          assert:
            - "the batch creation returned HTTP 201 with status \"DRAFT\" and gallons_total == 0"
            - "the submit returned HTTP 422 with ${empty_err} == \"ERR_NO_SETTLEABLE_GALLONS\""
            - "SettlementBatch.${cbatch_id}.status == \"DRAFT\" and submitted_by_user_id == null"

      - name: closing_august_is_refused_while_july_is_still_open
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=49]
          - validations[priority=48]
          - errors[ERR_PRIOR_CYCLE_NOT_CLOSED]
        distinguishing_aspect: "Cycles must be retired in lexicographic cycle_month order: with the clock at 2026-09-01 the August cycle has ended (so priority 48 is satisfied) yet begin-close is refused 409 ERR_PRIOR_CYCLE_NOT_CLOSED until July reaches CLOSED, after which the identical call succeeds."
        test_recipe:
          setup:
            - "Banner CORE with OPEN cycles 2026-07, 2026-08 and 2026-09; logical clock advanced to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - call: "POST /point-cycles"
              payload: { banner_id: "${cb_id}", cycle_month: "2026-07", opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c_jul2: $.data.id }
            - *cx_aug
            - *cx_sep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /point-cycles/${c_aug}/begin-close"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { order_err: $.data.error_id }
            - call: "POST /point-cycles/${c_jul2}/begin-close"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
            - call: "POST /point-cycles/${c_jul2}/close"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
            - call: "POST /point-cycles/${c_aug}/begin-close"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { aug_status: $.data.status }
          assert:
            - "the first attempt returned HTTP 409 with ${order_err} == \"ERR_PRIOR_CYCLE_NOT_CLOSED\""
            - "PointCycle.${c_aug}.status was still \"OPEN\" after the refusal"
            - "PointCycle.${c_jul2}.status == \"CLOSED\" and closed_at == \"2026-09-01T00:00:00Z\""
            - "the retry returned HTTP 200 with ${aug_status} == \"CLOSING\""

      - name: adjustment_authority_ceiling_and_tier_are_enforced_at_different_steps
        claim_type: Conditional validation
        grounds:
          - validations[priority=39]
          - validations[priority=38]
          - errors[ERR_ADJUSTMENT_EXCEEDS_AUTHORITY]
          - errors[ERR_TIER_AUTHORITY_REQUIRED]
        distinguishing_aspect: "Two different rules police the same adjustment: priority 39 rejects a 600-point delta claimed under TIER1 (ceiling 500) at PROPOSE time, while priority 38 rejects a LoyaltySupervisor approving a TIER3 proposal at APPROVE time — only ProgramAdmin can sign a TIER3 adjustment, and only then is the ADJUSTMENT row written."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, household HH-CORE-1, members CM (300 points, ACTIVE PRIMARY) and CM9 (ACTIVE SECONDARY), one 100-point transfer producing a TRANSFER_OUT row, and a dispute over it moved to INVESTIGATING; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_member2
            - *cx_household
            - *cx_link
            - *cx_link_activate
            - *cx_link2
            - *cx_link2_activate
            - *cx_basket
            - *cx_post
            - *cx_transfer
            - *cx_dispute
            - *cx_dispute_investigate
          trigger:
            - call: "POST /point-disputes/${cd_id}/propose-adjustment"
              payload: { proposed_points_delta: 600, authority_tier: "TIER1" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { ceiling_err: $.data.error_id }
            - call: "POST /point-disputes/${cd_id}/propose-adjustment"
              payload: { proposed_points_delta: 600, authority_tier: "TIER3" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { prop_status: $.data.status, prop_by: $.data.proposed_by_user_id }
            - call: "POST /point-disputes/${cd_id}/approve-adjustment"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { tier_err: $.data.error_id }
            - call: "POST /point-disputes/${cd_id}/approve-adjustment"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { final_status: $.data.status, final_ledger: $.data.applied_ledger_entry_id }
          assert:
            - "the TIER1 proposal returned HTTP 403 with ${ceiling_err} == \"ERR_ADJUSTMENT_EXCEEDS_AUTHORITY\" and left the dispute in INVESTIGATING"
            - "the TIER3 proposal returned HTTP 200 with ${prop_status} == \"ADJUSTMENT_PROPOSED\" and ${prop_by} == \"analyst-1\""
            - "the supervisor approval returned HTTP 403 with ${tier_err} == \"ERR_TIER_AUTHORITY_REQUIRED\" and wrote no ledger row"
            - "the admin approval returned HTTP 200 with ${final_status} == \"RESOLVED_UPHELD\", ${final_ledger} non-null and approved_by_user_id == \"admin-1\""
            - "Member.${cm_id}.available_points == 800 (300 accrued, 100 transferred out, 600 adjusted in)"

      - name: dispute_filing_checks_entry_ownership_and_the_supersede_chain
        claim_type: Violation → Error
        grounds:
          - validations[priority=62]
          - validations[priority=69]
          - errors[ERR_DISPUTE_ENTRY_MEMBER_MISMATCH]
          - errors[ERR_SUPERSEDE_CHAIN_TOO_LONG]
        distinguishing_aspect: "A dispute must point at the filer's OWN ledger row — CM9 disputing CM's TRANSFER_OUT is refused 422 ERR_DISPUTE_ENTRY_MEMBER_MISMATCH — and a refiling may only supersede a dispute that is already RESOLVED_DENIED, so superseding a live FILED dispute is refused 409 ERR_SUPERSEDE_CHAIN_TOO_LONG and is accepted after the denial."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, household HH-CORE-1, members CM (ACTIVE PRIMARY) and CM9 (ACTIVE SECONDARY), one 100-point transfer producing a TRANSFER_OUT row for CM, and one FILED dispute over it."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_member2
            - *cx_household
            - *cx_link
            - *cx_link_activate
            - *cx_link2
            - *cx_link2_activate
            - *cx_basket
            - *cx_post
            - *cx_transfer
            - *cx_dispute
          trigger:
            - call: "POST /point-disputes"
              payload: { member_id: "${cm9_id}", disputed_ledger_entry_id: "${cledger_id}", claimed_points: 100, reason_code: "MISSING_ACCRUAL" }
              as: Member
              as_user_id: "${cm9_id}"
              captures: { mismatch_err: $.data.error_id }
            - call: "POST /point-disputes"
              payload: { member_id: "${cm_id}", disputed_ledger_entry_id: "${cledger_id}", claimed_points: 100, reason_code: "UNAUTHORIZED_REDEMPTION", supersedes_dispute_id: "${cd_id}" }
              as: Member
              as_user_id: "${cm_id}"
              captures: { chain_err: $.data.error_id }
            - *cx_dispute_investigate
            - call: "POST /point-disputes/${cd_id}/deny"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
            - call: "POST /point-disputes"
              payload: { member_id: "${cm_id}", disputed_ledger_entry_id: "${cledger_id}", claimed_points: 100, reason_code: "UNAUTHORIZED_REDEMPTION", supersedes_dispute_id: "${cd_id}" }
              as: Member
              as_user_id: "${cm_id}"
              captures: { refile_id: $.data.id, refile_status: $.data.status }
          assert:
            - "${mismatch_err} == \"ERR_DISPUTE_ENTRY_MEMBER_MISMATCH\" (422)"
            - "${chain_err} == \"ERR_SUPERSEDE_CHAIN_TOO_LONG\" (409) while the superseded dispute was still FILED"
            - "after the denial the refiling returned HTTP 201 with ${refile_status} == \"FILED\" and supersedes_dispute_id == \"${cd_id}\""
            - "GET /point-disputes?supersedes_dispute_id=${cd_id} returns meta total_count == 1 containing ${refile_id}"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: points_summary_reports_nulls_and_zeroes_outside_every_cycle_window
        claim_type: Computed read
        grounds:
          - endpoints.GET_/members/{id}/points-summary
          - calculations.points_summary_projection
        distinguishing_aspect: "The computed read degrades gracefully instead of erroring: with the clock at 2026-10-01 no OPEN cycle contains it, so open_cycle_id is null and every projected_* figure is 0 while available_points still reports the true 300-point balance."
        test_recipe:
          setup:
            - "Banner CORE with cycles 2026-08 and 2026-09, grocery site and member CM holding 300 points; the clock is then advanced to 2026-10-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_basket
            - *cx_post
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /members/${cm_id}/points-summary"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { out_available: $.data.available_points, out_cycle: $.data.open_cycle_id, out_after: $.data.projected_available_after_close }
          assert:
            - "the response status is 200 and ${out_available} == 300"
            - "${out_cycle} == null"
            - "the response reports pending_authorized_points == 0, projected_expiring_points == 0 and projected_rollover_points == 0"
            - "${out_after} == 0"

      - name: opening_a_second_batch_supersedes_the_existing_draft_for_that_site
        claim_type: Conditional action
        grounds:
          - validations[priority=58]
          - validations[priority=60]
          - state_machines.SettlementBatch.DRAFT_to_REJECTED
        distinguishing_aspect: "Batch creation is conditional on the incumbent's state: an existing DRAFT for the same site is superseded to REJECTED (so the new batch is created 201) whereas a SUBMITTED batch for a touching period would block — supersede happens BEFORE the open-batch count, so the limit of 2 is never reached by a chain of DRAFT re-opens."
        test_recipe:
          setup:
            - "Banner CORE with partner station P-100 and one DRAFT August batch; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_partner
            - *cx_site_version
            - *cx_batch
            - call: "GET /sites/${cp_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${cp_id}"
              captures: { csv2: $.data.version }
          trigger:
            - call: "POST /settlement-batches"
              payload: { site_id: "${cp_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${csv2}" }
              as: SettlementClerk
              as_user_id: "${cp_id}"
              captures: { newbatch_id: $.data.id, newbatch_status: $.data.status }
          assert:
            - "the response status is 201 with ${newbatch_status} == \"DRAFT\""
            - "SettlementBatch.${cbatch_id}.status == \"REJECTED\" (superseded, not deleted)"
            - "GET /settlement-batches?site_id=${cp_id}&status=DRAFT returns meta total_count == 1 containing ${newbatch_id}"
            - "no ERR_BATCH_PERIOD_OVERLAP and no ERR_OPEN_BATCH_LIMIT was raised"

      - name: link_activation_publishes_the_member_balance_into_the_household_aggregate
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/household-links
          - endpoints.POST_/household-links/{id}/activate
          - entities.Household.fields.aggregate_available_points
        distinguishing_aspect: "Creating the link is not enough: while the link is PENDING the household still reports linked_member_count 0 and aggregate_available_points 0, and only activation folds the member's 300 points into the aggregate — the association and its accounting effect are two distinct steps."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, member CM holding 300 points and household HH-CORE-1; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_household
            - *cx_link
          trigger:
            - call: "GET /households/${chh_id}"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { pending_count: $.data.linked_member_count, pending_agg: $.data.aggregate_available_points }
            - *cx_link_activate
            - call: "GET /households/${chh_id}"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { active_count: $.data.linked_member_count, active_agg: $.data.aggregate_available_points }
          assert:
            - "${pending_count} == 0 and ${pending_agg} == 0 while the link is PENDING"
            - "HouseholdLink.${cl_id}.status == \"ACTIVE\" and activated_at == \"2026-08-01T00:00:00Z\" after activation"
            - "${active_count} == 1 and ${active_agg} == 300"

      - name: suspending_a_fuel_site_stops_new_authorizations_and_keeps_dispensed_history
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/sites/{id}/suspend
          - validations[priority=45]
          - errors[ERR_SITE_SUSPENDED]
        distinguishing_aspect: "Site suspension is forward-only: a new redemption at the suspended fuel centre is refused 409 ERR_SITE_SUSPENDED while the already-DISPENSED redemption keeps its 1050-cent discount and remains readable, so suspension never rewrites settled history."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre, member CM with 600 points from a 60000-cent basket, and one DISPENSED 300-point redemption of 35.000 gallons; the fuel centre is then suspended."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 60000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { csusp_tx: $.data.id }
            - call: "POST /purchase-transactions/${csusp_tx}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
            - *cx_member_version
            - *cx_redeem
            - call: "POST /fuel-redemptions/${cr_id}/complete"
              payload: { gallons_dispensed: 35.000 }
              as: PumpTerminal
              as_user_id: "${cf_id}"
            - call: "POST /sites/${cf_id}/suspend"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /members/${cm_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { cmv_after: $.data.version }
          trigger:
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv_after}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { site_susp_err: $.data.error_id }
          assert:
            - "the response status is 409 and ${site_susp_err} == \"ERR_SITE_SUSPENDED\""
            - "Site.${cf_id}.status == \"SUSPENDED\""
            - "FuelRedemption.${cr_id}.authorization_status == \"DISPENSED\" and discount_amount_cents == 1050 and GET on it still answers 200"
            - "Member.${cm_id}.available_points == 300"

      - name: banner_scoped_child_listings_filter_by_status_and_paginate_independently
        claim_type: Listing
        grounds:
          - endpoints.GET_/banners/{id}/promo-events
          - endpoints.GET_/banners/{id}/households
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The two banner-scoped sub-listings paginate against their own collections: with three promos (two SCHEDULED, one ACTIVE) and two households, ?status=SCHEDULED&limit=1 returns one promo with total_count 2 and has_more true, while the household listing under the same banner is unaffected with total_count 2 and has_more false."
        test_recipe:
          setup:
            - "Banner CORE with three promo events on disjoint category sets (two left SCHEDULED, one activated) and two households; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_household
            - call: "POST /households"
              payload: { banner_id: "${cb_id}", household_code: "HH-CORE-2" }
              as: LoyaltyAnalyst
              captures: { chh2_id: $.data.id }
            - call: "POST /promo-events"
              payload: { banner_id: "${cb_id}", promo_code: "P_ONE", multiplier: 2, applies_to_categories: ["GROCERY"], starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", stack_priority: 10 }
              as: ProgramAdmin
              captures: { cp1: $.data.id }
            - call: "POST /promo-events"
              payload: { banner_id: "${cb_id}", promo_code: "P_TWO", multiplier: 2, applies_to_categories: ["GIFT_CARD"], starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", stack_priority: 20 }
              as: ProgramAdmin
              captures: { cp2: $.data.id }
            - call: "POST /promo-events"
              payload: { banner_id: "${cb_id}", promo_code: "P_THREE", multiplier: 2, applies_to_categories: ["PHARMACY"], starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", stack_priority: 30 }
              as: ProgramAdmin
              captures: { cp3: $.data.id }
            - call: "POST /promo-events/${cp3}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /banners/${cb_id}/promo-events?status=SCHEDULED&limit=1"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { promo_total: $.meta.total_count, promo_more: $.meta.has_more }
            - call: "GET /banners/${cb_id}/households"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { hh_total: $.meta.total_count, hh_more: $.meta.has_more }
          assert:
            - "${promo_total} == 2, ${promo_more} == true and the returned array holds exactly one promo drawn from {${cp1}, ${cp2}}"
            - "the promo listing echoes meta.limit == 1 and meta.offset == 0"
            - "${hh_total} == 2, ${hh_more} == false and the household listing echoes meta.limit == 10 (the declared default)"

      - name: default_pagination_returns_ten_of_twelve_members_with_has_more_true
        claim_type: Listing
        grounds:
          - response_envelope.pagination_defaults
          - endpoints.GET_/members
        distinguishing_aspect: "Omitting limit and offset applies the declared defaults exactly: 12 members yield 10 rows, total_count 12 and has_more true, and ?offset=10 returns the remaining 2 rows with has_more false — the total is the unpaginated count, not the page size."
        test_recipe:
          setup:
            - "Banner CORE with 12 members created with alt_ids 6660000101..6660000112; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - call: "POST /members"
              payload: { banner_id: "${cb_id}", alt_id: "6660000101", card_number: "4100000000000101", full_name: "Page Member 01" }
              as: ProgramAdmin
              captures: { cpg1: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${cb_id}", alt_id: "6660000112", card_number: "4100000000000112", full_name: "Page Member 12" }
              as: ProgramAdmin
              captures: { cpg12: $.data.id }
          trigger:
            - call: "GET /members?banner_id=${cb_id}"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { pg_total: $.meta.total_count, pg_more: $.meta.has_more }
            - call: "GET /members?banner_id=${cb_id}&offset=10"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { pg2_total: $.meta.total_count, pg2_more: $.meta.has_more }
          assert:
            - "the first page returned 10 rows with ${pg_total} == 12, ${pg_more} == true, meta.limit == 10 and meta.offset == 0"
            - "the second page returned 2 rows with ${pg2_total} == 12 and ${pg2_more} == false"
            - "the 12 created members (including ${cpg1} and ${cpg12}) appear exactly once across the two pages"

  # ===========================================================================
  - section: errors
    instances:

      - name: every_get_by_id_endpoint_raises_its_own_not_found_code
        claim_type: Error triggerability
        grounds:
          - errors[ERR_BANNER_NOT_FOUND]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_HOUSEHOLD_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_HOUSEHOLD_LINK_NOT_FOUND]
          - errors[ERR_POINT_CYCLE_NOT_FOUND]
          - errors[ERR_PURCHASE_TRANSACTION_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
          - errors[ERR_FUEL_REDEMPTION_NOT_FOUND]
          - errors[ERR_SETTLEMENT_BATCH_NOT_FOUND]
          - errors[ERR_POINT_DISPUTE_NOT_FOUND]
        distinguishing_aspect: "Each entity family owns a DISTINCT 404 code rather than a shared generic one: the same syntactically valid unknown id returns eleven different error_ids depending on which collection was addressed."
        test_recipe:
          setup:
            - "An empty program with the logical clock at 2026-08-01T00:00:00Z; no entity carries the probed id."
          setup_api_calls:
            - *cx_clock
          trigger:
            - call: "GET /banners/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_banner: $.data.error_id }
            - call: "GET /sites/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_site: $.data.error_id }
            - call: "GET /households/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_household: $.data.error_id }
            - call: "GET /members/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_member: $.data.error_id }
            - call: "GET /household-links/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_link: $.data.error_id }
            - call: "GET /point-cycles/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_cycle: $.data.error_id }
            - call: "GET /purchase-transactions/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_tx: $.data.error_id }
            - call: "GET /point-ledger-entries/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_ledger: $.data.error_id }
            - call: "GET /fuel-redemptions/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_redemption: $.data.error_id }
            - call: "GET /settlement-batches/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_batch: $.data.error_id }
            - call: "GET /point-disputes/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_dispute: $.data.error_id }
          assert:
            - "every response is HTTP 404"
            - "${e_banner} == \"ERR_BANNER_NOT_FOUND\", ${e_site} == \"ERR_SITE_NOT_FOUND\", ${e_household} == \"ERR_HOUSEHOLD_NOT_FOUND\", ${e_member} == \"ERR_MEMBER_NOT_FOUND\""
            - "${e_link} == \"ERR_HOUSEHOLD_LINK_NOT_FOUND\", ${e_cycle} == \"ERR_POINT_CYCLE_NOT_FOUND\", ${e_tx} == \"ERR_PURCHASE_TRANSACTION_NOT_FOUND\", ${e_ledger} == \"ERR_LEDGER_ENTRY_NOT_FOUND\""
            - "${e_redemption} == \"ERR_FUEL_REDEMPTION_NOT_FOUND\", ${e_batch} == \"ERR_SETTLEMENT_BATCH_NOT_FOUND\", ${e_dispute} == \"ERR_POINT_DISPUTE_NOT_FOUND\""

      - name: promo_and_fraud_signal_not_found_are_only_reachable_through_action_endpoints
        claim_type: Error triggerability
        grounds:
          - errors[ERR_PROMO_EVENT_NOT_FOUND]
          - errors[ERR_FRAUD_SIGNAL_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "PromoEvent and FraudSignal have no GET-by-id endpoint, so their 404 codes are reachable only via POST /promo-events/{id}/activate and POST /fraud-signals/{id}/clear — path resolution therefore has to run on action endpoints too, not just on reads."
        test_recipe:
          setup:
            - "An empty program with the logical clock at 2026-08-01T00:00:00Z; no promo event and no fraud signal carries the probed id."
          setup_api_calls:
            - *cx_clock
          trigger:
            - call: "POST /promo-events/00000000-0000-4000-8000-000000000011/activate"
              payload: {}
              as: ProgramAdmin
              captures: { e_promo: $.data.error_id }
            - call: "POST /fraud-signals/00000000-0000-4000-8000-000000000011/clear"
              payload: {}
              as: LoyaltyAnalyst
              captures: { e_signal: $.data.error_id }
          assert:
            - "both responses are HTTP 404"
            - "${e_promo} == \"ERR_PROMO_EVENT_NOT_FOUND\" and ${e_signal} == \"ERR_FRAUD_SIGNAL_NOT_FOUND\""

  # ===========================================================================
  - section: rbac
    instances:

      - name: the_admin_who_submits_a_batch_cannot_approve_it
        claim_type: Segregation of duties
        grounds:
          - validations[priority=36]
          - rbac.ProgramAdmin.exclusive_operations
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
        distinguishing_aspect: "Settlement approval is segregated by X-User-ID, not by role: admin-9 may submit the batch and holds the approve permission, yet approving its own submission is refused 403 ERR_SELF_APPROVAL_FORBIDDEN, and a second ProgramAdmin approves the identical batch."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, partner station P-100, member CM holding 300 points and one DISPENSED 12.000-gallon partner redemption; one DRAFT August batch exists."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_partner
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version_partner
            - *cx_redeem_partner
            - call: "POST /fuel-redemptions/${crp_id}/complete"
              payload: { gallons_dispensed: 12.000 }
              as: PumpTerminal
              as_user_id: "${cp_id}"
            - *cx_site_version
            - *cx_batch
            - call: "POST /settlement-batches/${cbatch_id}/submit"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-9"
              captures: { sub_by: $.data.submitted_by_user_id }
          trigger:
            - call: "POST /settlement-batches/${cbatch_id}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-9"
              captures: { self_batch_err: $.data.error_id }
            - call: "POST /settlement-batches/${cbatch_id}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { approved_status: $.data.status }
          assert:
            - "${sub_by} == \"admin-9\" and the submit returned HTTP 200 with status \"SUBMITTED\""
            - "the self-approval returned HTTP 403 with ${self_batch_err} == \"ERR_SELF_APPROVAL_FORBIDDEN\""
            - "the second admin's approval returned HTTP 200 with ${approved_status} == \"APPROVED\""
            - "FuelRedemption.${crp_id}.settlement_status == \"SETTLED\" only after the approval"

      - name: the_admin_who_proposes_an_adjustment_cannot_approve_it
        claim_type: Segregation of duties
        grounds:
          - validations[priority=36]
          - validations[priority=38]
          - state_machines.PointDispute.ADJUSTMENT_PROPOSED_to_RESOLVED_UPHELD
        distinguishing_aspect: "ProgramAdmin holds BOTH the propose and the approve permission, so only the X-User-ID comparison stops a one-person adjustment: admin-9's own TIER1 proposal is refused 403 ERR_SELF_APPROVAL_FORBIDDEN at approval and no ADJUSTMENT row is written until admin-1 signs it."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, household HH-CORE-1, members CM (ACTIVE PRIMARY) and CM9 (ACTIVE SECONDARY), a TRANSFER_OUT row for CM and a dispute over it in INVESTIGATING."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_member2
            - *cx_household
            - *cx_link
            - *cx_link_activate
            - *cx_link2
            - *cx_link2_activate
            - *cx_basket
            - *cx_post
            - *cx_transfer
            - *cx_dispute
            - *cx_dispute_investigate
            - call: "POST /point-disputes/${cd_id}/propose-adjustment"
              payload: { proposed_points_delta: 100, authority_tier: "TIER1" }
              as: ProgramAdmin
              as_user_id: "admin-9"
              captures: { sod_prop_by: $.data.proposed_by_user_id }
          trigger:
            - call: "POST /point-disputes/${cd_id}/approve-adjustment"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-9"
              captures: { self_adj_err: $.data.error_id }
            - call: "POST /point-disputes/${cd_id}/approve-adjustment"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { upheld_status: $.data.status, upheld_by: $.data.approved_by_user_id }
          assert:
            - "${sod_prop_by} == \"admin-9\""
            - "the self-approval returned HTTP 403 with ${self_adj_err} == \"ERR_SELF_APPROVAL_FORBIDDEN\" and the dispute stayed ADJUSTMENT_PROPOSED"
            - "GET /point-ledger-entries?member_id=${cm_id}&entry_type=ADJUSTMENT returned meta total_count == 0 after the refusal"
            - "the second admin's approval returned HTTP 200 with ${upheld_status} == \"RESOLVED_UPHELD\" and ${upheld_by} == \"admin-1\""
            - "Member.${cm_id}.available_points == 300 (200 after the transfer plus the 100-point adjustment)"

      - name: analyst_and_supervisor_cannot_reach_into_each_others_exclusive_operations
        claim_type: Exclusive operations
        grounds:
          - rbac.LoyaltyAnalyst.exclusive_operations
          - rbac.LoyaltySupervisor.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The two back-office roles are peers with disjoint powers: the analyst is refused 403 on cycle begin-close and household freeze, and the supervisor is refused 403 on fraud-signal creation and link activation, so neither can run a dispute end-to-end alone."
        test_recipe:
          setup:
            - "Banner CORE with cycles, household HH-CORE-1, member CM and one PENDING link; logical clock advanced past the August window for the begin-close attempt."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_member
            - *cx_household
            - *cx_link
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /point-cycles/${c_aug}/begin-close"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { analyst_close_err: $.data.error_id }
            - call: "POST /households/${chh_id}/freeze"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { analyst_freeze_err: $.data.error_id }
            - call: "POST /fraud-signals"
              payload: { household_id: "${chh_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 30 }
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { sup_signal_err: $.data.error_id }
            - call: "POST /household-links/${cl_id}/activate"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { sup_link_err: $.data.error_id }
          assert:
            - "all four responses are HTTP 403 with error_id ERR_UNAUTHORIZED (${analyst_close_err}, ${analyst_freeze_err}, ${sup_signal_err}, ${sup_link_err})"
            - "PointCycle.${c_aug}.status == \"OPEN\", Household.${chh_id}.status == \"ACTIVE\" and HouseholdLink.${cl_id}.status == \"PENDING\""
            - "GET /households/${chh_id}/fraud-signals returns meta total_count == 0"

      - name: a_member_sees_only_their_own_record_and_cannot_browse_the_roster
        claim_type: Peer roles
        grounds:
          - rbac.Member.scope
          - validations[priority=34]
          - endpoints.GET_/members
        distinguishing_aspect: "The Member role is scoped two different ways: reading ANOTHER member by id is 403 ERR_NOT_RESOURCE_OWNER (the endpoint accepts the role but not the subject), while the roster listing is 403 ERR_UNAUTHORIZED (the role is absent from GET /members entirely) — and the member's own record and summary read 200."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site and members CM (300 points) and CM9; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_member2
            - *cx_basket
            - *cx_post
          trigger:
            - call: "GET /members/${cm9_id}"
              payload: {}
              as: Member
              as_user_id: "${cm_id}"
              captures: { peek_err: $.data.error_id }
            - call: "GET /members?banner_id=${cb_id}"
              payload: {}
              as: Member
              as_user_id: "${cm_id}"
              captures: { roster_err: $.data.error_id }
            - call: "GET /members/${cm_id}"
              payload: {}
              as: Member
              as_user_id: "${cm_id}"
              captures: { own_points: $.data.available_points }
          assert:
            - "the cross-member read returned HTTP 403 with ${peek_err} == \"ERR_NOT_RESOURCE_OWNER\""
            - "the roster listing returned HTTP 403 with ${roster_err} == \"ERR_UNAUTHORIZED\""
            - "the self read returned HTTP 200 with ${own_points} == 300"

      - name: program_admin_acts_for_any_site_without_owning_it
        claim_type: Shared operations
        grounds:
          - validations[priority=34]
          - rbac.ProgramAdmin.scope
          - rbac.StoreOperator.scope
        distinguishing_aspect: "Rule 34 exempts opaque roles entirely: ProgramAdmin with X-User-ID admin-1 rings and posts a basket at the grocery lane and authorises at the fuel centre, while a StoreOperator whose X-User-ID is the FUEL site is refused 403 ERR_NOT_RESOURCE_OWNER for the very same basket."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and member CM; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
          trigger:
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cf_id}"
              captures: { wrong_site_err: $.data.error_id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { admin_tx_id: $.data.id }
            - call: "POST /purchase-transactions/${admin_tx_id}/post"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { admin_points: $.data.gross_points_awarded }
            - call: "GET /members/${cm_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { admin_mv: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${admin_mv}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { admin_r_id: $.data.id }
          assert:
            - "the StoreOperator call returned HTTP 403 with ${wrong_site_err} == \"ERR_NOT_RESOURCE_OWNER\""
            - "the admin's create and post returned 201/200 with ${admin_points} == 300"
            - "the admin's redemption returned HTTP 201 and FuelRedemption.${admin_r_id}.points_debited_at_auth == 300"
            - "Member.${cm_id}.available_points == 0"

      - name: front_line_roles_cannot_administer_the_program_or_cross_their_lane
        claim_type: Exclusive operations
        grounds:
          - rbac.ProgramAdmin.exclusive_operations
          - rbac.StoreOperator.shared_operations
          - rbac.PumpTerminal.shared_operations
        distinguishing_aspect: "Store and pump roles are confined to their own verbs: a StoreOperator is refused 403 on POST /sites and on POST /fuel-redemptions, and a PumpTerminal is refused 403 on POST /purchase-transactions, so no single front-line credential can both mint points and spend them."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and member CM holding 300 points; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
          trigger:
            - call: "POST /sites"
              payload: { banner_id: "${cb_id}", site_number: "G-999", site_type: "GROCERY" }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { op_site_err: $.data.error_id }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv}" }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { op_redeem_err: $.data.error_id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 10000, quantity: 1 }] }
              as: PumpTerminal
              as_user_id: "${cg_id}"
              captures: { pump_tx_err: $.data.error_id }
          assert:
            - "all three responses are HTTP 403 with ERR_UNAUTHORIZED (${op_site_err}, ${op_redeem_err}, ${pump_tx_err})"
            - "GET /sites?banner_id=${cb_id} still returns meta total_count == 2"
            - "Member.${cm_id}.available_points == 300 and GET /fuel-redemptions?member_id=${cm_id} returns meta total_count == 0"

  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: a_stale_expected_member_version_at_the_pump_is_refused_with_412
        layer: optimistic_concurrency
        claim_type: Stale version rejected
        grounds:
          - concurrency_rules.redemption-create-stale-member
          - errors[ERR_STALE_MEMBER_VERSION]
        distinguishing_aspect: "The pump's snapshot of the member is invalidated by ANY balance-moving write, not only by another redemption: after a second basket is posted the previously observed version is refused 412 ERR_STALE_MEMBER_VERSION, and the re-read version is accepted with the fuller balance."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and member CM with one posted 30000-cent basket (300 points) whose version the pump has captured."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 20000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { cocc_tx: $.data.id }
            - call: "POST /purchase-transactions/${cocc_tx}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
          trigger:
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { stale_member_err: $.data.error_id }
            - call: "GET /members/${cm_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { cmv_fresh: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv_fresh}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { fresh_r_id: $.data.id }
          assert:
            - "the stale attempt returned HTTP 412 with ${stale_member_err} == \"ERR_STALE_MEMBER_VERSION\" and created no redemption"
            - "${cmv_fresh} == ${cmv} + 1"
            - "the retry returned HTTP 201 and FuelRedemption.${fresh_r_id}.points_debited_at_auth == 300"
            - "Member.${cm_id}.available_points == 200 (500 accrued minus 300 debited)"

      - name: a_stale_expected_site_version_at_the_settlement_desk_is_refused_with_412
        layer: optimistic_concurrency
        claim_type: Stale version rejected
        grounds:
          - concurrency_rules.settlement-batch-create-stale-site
          - errors[ERR_STALE_SITE_VERSION]
        distinguishing_aspect: "The clerk's view of the settleable pool is invalidated by a pump completion: the version captured before 12.000 gallons were dispensed is refused 412 ERR_STALE_SITE_VERSION, and the re-read version opens a batch that already sees the 360-cent pool."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, partner station P-100 and member CM holding 300 points with one AUTHORIZED partner redemption; the clerk has captured the site version BEFORE the completion."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_partner
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version_partner
            - *cx_redeem_partner
            - *cx_site_version
            - call: "POST /fuel-redemptions/${crp_id}/complete"
              payload: { gallons_dispensed: 12.000 }
              as: PumpTerminal
              as_user_id: "${cp_id}"
          trigger:
            - call: "POST /settlement-batches"
              payload: { site_id: "${cp_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${csv}" }
              as: SettlementClerk
              as_user_id: "${cp_id}"
              captures: { stale_site_err: $.data.error_id }
            - call: "GET /sites/${cp_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${cp_id}"
              captures: { csv_fresh: $.data.version }
            - call: "POST /settlement-batches"
              payload: { site_id: "${cp_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${csv_fresh}" }
              as: SettlementClerk
              as_user_id: "${cp_id}"
              captures: { fresh_batch_id: $.data.id }
          assert:
            - "the stale attempt returned HTTP 412 with ${stale_site_err} == \"ERR_STALE_SITE_VERSION\" and created no batch"
            - "${csv_fresh} > ${csv}"
            - "the retry returned HTTP 201 and SettlementBatch.${fresh_batch_id}.status == \"DRAFT\""
            - "Site.${cp_id}.unbatched_gallons == 12.000 and unbatched_discount_cents == 360 at the moment of the successful create"

      - name: version_advances_on_every_write_and_the_ledger_carries_no_version_at_all
        layer: optimistic_concurrency
        claim_type: Version increments on every write
        grounds:
          - response_envelope.common_fields
          - entities.PointLedgerEntry
          - entities.Member.fields.available_points
        distinguishing_aspect: "Member.version walks 1 -> 2 -> 3 across create, accrual post and redemption authorisation — every balance-moving write bumps it exactly once — while the append-only PointLedgerEntry rows created by those same writes expose no version field to bump."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and a freshly created member; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
          trigger:
            - call: "GET /members/${cm_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { v_create: $.data.version }
            - *cx_post
            - call: "GET /members/${cm_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { v_accrual: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${v_accrual}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { v_r_id: $.data.id }
            - call: "GET /members/${cm_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { v_redeem: $.data.version }
          assert:
            - "${v_create} == 1, ${v_accrual} == 2 and ${v_redeem} == 3"
            - "the un-posted basket creation did NOT advance the member version"
            - "GET /point-ledger-entries?member_id=${cm_id} returns 2 rows and no row carries a version, created_by or updated_at field"
            - "FuelRedemption.${v_r_id}.version == 1"

      - name: the_freeze_threshold_fires_at_exactly_sixty_and_not_at_fifty_nine
        layer: rate_threshold_triggers
        claim_type: Instantaneous threshold boundary
        grounds:
          - calculations.household_fraud_score
          - entities.Banner.fields.freeze_threshold_score
          - state_machines.Household.ACTIVE_to_FROZEN
        distinguishing_aspect: "The auto-freeze comparison is >=, evaluated on the same request that pushes the score over: weights 30 + 29 leave the household ACTIVE at 59, and replacing the second signal with weight 30 freezes at exactly 60 with frozen_reason AUTO_FRAUD_SCORE."
        test_recipe:
          setup:
            - "Banner CORE (freeze_threshold_score 60, INSTANTANEOUS) with households HH-CORE-1 and HH-CORE-2; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_household
            - call: "POST /households"
              payload: { banner_id: "${cb_id}", household_code: "HH-CORE-3" }
              as: LoyaltyAnalyst
              captures: { chh3_id: $.data.id }
            - call: "POST /fraud-signals"
              payload: { household_id: "${chh_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 30 }
              as: LoyaltyAnalyst
            - call: "POST /fraud-signals"
              payload: { household_id: "${chh3_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 30 }
              as: LoyaltyAnalyst
          trigger:
            - call: "POST /fraud-signals"
              payload: { household_id: "${chh_id}", signal_type: "GEO_IMPOSSIBLE", severity_weight: 29 }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { under_signal_id: $.data.id }
            - call: "POST /fraud-signals"
              payload: { household_id: "${chh3_id}", signal_type: "GEO_IMPOSSIBLE", severity_weight: 30 }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { at_signal_id: $.data.id }
          assert:
            - "Household.${chh_id}.fraud_score == 59 with status \"ACTIVE\", frozen_reason == null and frozen_at == null"
            - "Household.${chh3_id}.fraud_score == 60 with status \"FROZEN\", frozen_reason == \"AUTO_FRAUD_SCORE\" and frozen_at == \"2026-08-01T00:00:00Z\""
            - "both signal creations returned HTTP 201 (${under_signal_id} and ${at_signal_id} are OPEN)"

      - name: the_transfer_lock_trips_on_the_second_open_signal_regardless_of_score
        layer: rate_threshold_triggers
        claim_type: Cumulative threshold boundary
        grounds:
          - validations[priority=50]
          - errors[ERR_TRANSFER_FRAUD_LOCK]
        distinguishing_aspect: "The transfer lock counts OPEN signals rather than summing weights: one 10-weight CROSS_BANNER_VELOCITY signal still permits the transfer, a SECOND one of the same benign type blocks it with 403 ERR_TRANSFER_FRAUD_LOCK at a fraud_score of only 20 — far below the freeze threshold, so the household is still ACTIVE."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, household HH-CORE-1 and members CM (300 points, ACTIVE PRIMARY) and CM9 (ACTIVE SECONDARY); one OPEN CROSS_BANNER_VELOCITY signal of weight 10."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_member2
            - *cx_household
            - *cx_link
            - *cx_link_activate
            - *cx_link2
            - *cx_link2_activate
            - *cx_basket
            - *cx_post
            - call: "POST /fraud-signals"
              payload: { household_id: "${chh_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 10 }
              as: LoyaltyAnalyst
          trigger:
            - *cx_transfer
            - call: "POST /fraud-signals"
              payload: { household_id: "${chh_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 10 }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
            - call: "POST /point-transfers"
              payload: { member_id: "${cm_id}", recipient_member_id: "${cm9_id}", points: 100 }
              as: Member
              as_user_id: "${cm_id}"
              captures: { lock_err: $.data.error_id }
          assert:
            - "the transfer at one OPEN signal returned HTTP 201 and produced ledger row ${cledger_id}"
            - "the transfer at two OPEN signals returned HTTP 403 with ${lock_err} == \"ERR_TRANSFER_FRAUD_LOCK\""
            - "Household.${chh_id}.fraud_score == 20 and status == \"ACTIVE\" (the freeze threshold of 60 was never reached)"
            - "Member.${cm_id}.available_points == 200 and GET /point-ledger-entries?member_id=${cm_id}&entry_type=TRANSFER_OUT returns meta total_count == 1"

      - name: expiry_basis_variant_divergence_on_identical_lots
        layer: dual_variant_calculation
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: expiry_sweep_lot_fifo_protects_the_soonest_expiring_lot
          rationale: "The LOT_FIFO / CYCLE_SCOPED divergence of calculations.point_expiry_sweep on identical lot sets is the whole subject of §1.8 dual_variant_calc instances 1a and 1b (`expiry_sweep_lot_fifo_protects_the_soonest_expiring_lot` and `expiry_sweep_cycle_scoped_expires_the_current_lot_in_full`), which already assert both variants' EXPIRY row counts and deltas against the same two-lot member. A §1.9 copy would add no distinct corner."

      - name: fraud_scoring_mode_variant_selection_per_banner
        layer: dual_variant_calculation
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: fraud_score_trailing_weighted_decays_below_threshold_after_ten_days
          rationale: "Selecting INSTANTANEOUS versus TRAILING_WEIGHTED by Banner.fraud_scoring_mode, and the freeze/no-freeze divergence it produces ten days after an identical signal, is fully asserted by §1.8 dual_variant_calc instances 1c and 1d. The remaining independent corner — the DECAY_FLOOR of 0.25 — is covered separately in this file's calculations section."

      - name: five_level_cascade_from_a_purchase_void
        layer: cascading_side_effects
        claim_type: N-level chain verified end-to-end
        excluded_because:
          difficulty_instance: purchase_void_cascades_reversal_autovoid_signal_and_household_freeze
          rationale: "The deepest cascade in the design — void -> REVERSAL row -> negative balance -> auto-void of the newest authorisation -> RAPID_TRANSFER signal -> household auto-freeze — is asserted level by level in §1.8 transitive_cascade instance 4a, with the companion cross-banner chain in 4b. This file instead covers the shallow single-hop side effects (pool fill, aggregate publish, ledger sync)."

      - name: compensation_restores_the_ledger_sum_without_deleting_history
        layer: cascading_side_effects
        claim_type: Compensation
        excluded_because:
          difficulty_instance: redemption_void_restores_member_ledger_sum_without_deleting_history
          rationale: "Reversal-by-compensation (a REDEMPTION_RELEASE row that restores the balance while all three ledger rows remain readable, with Member.version at 4) is asserted by §1.8 compensating_invariant instance 9a, and the partner-pool analogue by 9b. The §1.9 state_machines section keeps only the no-op branch, where a RECORDED basket's void writes nothing to compensate."

  # ===========================================================================
  - section: consistency model
    instances:

      - name: the_authorization_response_already_carries_every_derived_figure
        claim_type: All changes visible in same request's response
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/fuel-redemptions
          - calculations.redemption_authorization
        distinguishing_aspect: "No read-back is required to learn the outcome: the 201 body of POST /fuel-redemptions already reports cents_off_per_gallon, blocks_effective, points_debited_at_auth and gallons_authorized, and the very next GET /members shows the debited balance and the bumped version with no intermediate state."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and member CM holding 300 points; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
          trigger:
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { imm_cents: $.data.cents_off_per_gallon, imm_blocks: $.data.blocks_effective, imm_debit: $.data.points_debited_at_auth, imm_gallons: $.data.gallons_authorized }
            - call: "GET /members/${cm_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { imm_balance: $.data.available_points, imm_version: $.data.version }
          assert:
            - "the create response is HTTP 201 with ${imm_cents} == 30, ${imm_blocks} == 3, ${imm_debit} == 300 and ${imm_gallons} == 35.000"
            - "${imm_balance} == 0 and ${imm_version} == ${cmv} + 1 on the immediately following read"
            - "GET /point-ledger-entries?member_id=${cm_id}&entry_type=REDEMPTION returns meta total_count == 1 with points_delta == -300"

      - name: the_household_aggregate_is_current_in_the_read_right_after_a_transfer
        claim_type: All changes visible in same request's response
        grounds:
          - complexity_profile.consistency_model
          - entities.Household.fields.aggregate_available_points
          - endpoints.POST_/point-transfers
        distinguishing_aspect: "Cross-aggregate denormalisation does not lag: a 100-point transfer between two linked members leaves the household total at 300 in the immediately following read while the two member balances read 200 and 100 — the derived aggregate is recomputed within the transfer's own request, not on a later sweep."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, household HH-CORE-1 and members CM (300 points, ACTIVE PRIMARY) and CM9 (0 points, ACTIVE SECONDARY); logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_member2
            - *cx_household
            - *cx_link
            - *cx_link_activate
            - *cx_link2
            - *cx_link2_activate
            - *cx_basket
            - *cx_post
          trigger:
            - *cx_transfer
            - call: "GET /households/${chh_id}"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { agg_after: $.data.aggregate_available_points, agg_count: $.data.linked_member_count }
          assert:
            - "the transfer returned HTTP 201 with a TRANSFER_OUT row ${cledger_id} of points_delta == -100"
            - "${agg_after} == 300 and ${agg_count} == 2 on the immediately following read"
            - "Member.${cm_id}.available_points == 200 and Member.${cm9_id}.available_points == 100"
            - "GET /point-ledger-entries?member_id=${cm9_id}&entry_type=TRANSFER_IN returns meta total_count == 1 with points_delta == 100"
