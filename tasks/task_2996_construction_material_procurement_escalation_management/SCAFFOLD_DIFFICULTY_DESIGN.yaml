- rule_id: combinatorial_formula
  instances:
  - name: escalation_four_step_chain_with_single_intermediate_rounding
    grounds:
    - calculations.escalation_adjustment
    - entities.EscalationAgreement.fields.deadband_pct
    - entities.EscalationAgreement.fields.cap_pct
    - entities.EscalationAgreement.fields.contractor_share_pct
    distinguishing_aspect: 'Mode (a): four chained operations (index ratio, deadband subtraction, cap clamp, contractor share split) with exactly one intermediate rounding at index_delta_pct to 4 dp and one final rounding to 2 dp; PPI_COPPER_WIRE moving 200.00 -> 220.00 gives 10.0000 -> 8.0000 (deadband binds, the 10.0 cap does not) -> 5.60000 -> 49000.00, whereas re-rounding each step to 2 dp gives a different cent value.'
    test_recipe:
      setup:
      - Project with escalation_contingency_budget 500000.00
      - Copper feeder package estimated at 900000.00 with commodity_index_code PPI_COPPER_WIRE
      - PPI_COPPER_WIRE readings published for 2026-07 at 200.00 and 2026-10 at 220.00 (the 2026-10 reading carries published_at 2026-10-15, later than the delivery clock, which is audit metadata only)
      - Clause EXECUTED with baseline period 2026-07 (baseline_index_value 200.00), deadband 2.0, cap 10.0, contractor share 30.0
      - Commitment COMMITTED at committed_base_cost 875000.00, RELEASED_FOR_FAB at clock 2026-09-10 where the only reading at or before 2026-09 is 2026-07 at 200.00, then FABRICATING
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: ELEC-FEEDER-01, description: Medium voltage feeder conductor package, commodity_index_code: PPI_COPPER_WIRE, estimated_cost: '900000.00', required_onsite_date: '2027-05-01T00:00:00.000Z', fabrication_duration_days: 60, delivery_transit_days: 25, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Continental Wire and Cable, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_id}', supplier_id: '${sup_id}', base_price: '875000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_id: $.data.id}
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_COPPER_WIRE, period: 2026-07, value: '200.00', published_at: '2026-07-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_COPPER_WIRE, period: 2026-10, value: '220.00', published_at: '2026-10-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/escalation-agreements
        payload: {quote_id: '${q_id}', index_code: PPI_COPPER_WIRE, baseline_index_period: 2026-07, cap_pct: '10.0', contractor_share_pct: '30.0', price_hold_through: '2026-09-15T00:00:00.000Z', deadband_pct: '2.0', proposed_terms_note: Mill index escalation with 2 pct deadband and shared band}
        as: BuyoutManager
        captures: {ea_id: $.data.id}
      - call: POST /procurement/escalation-agreements/${ea_id}/propose
        payload: {}
        as: BuyoutManager
      - call: POST /procurement/escalation-agreements/${ea_id}/execute
        payload: {}
        as: ProjectExecutive
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
        captures: {pv: $.data.version}
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q_id}', po_number: PO-2996-0007, expected_project_version: '${pv}', escalation_agreement_id: '${ea_id}', is_early_buyout: false}
        as: BuyoutManager
        captures: {pc_id: $.data.id}
      - call: POST /procurement/purchase-commitments/${pc_id}/commit
        payload: {}
        as: ProjectExecutive
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-09-10T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/purchase-commitments/${pc_id}/delivery-posture
        payload: {to_posture: RELEASED_FOR_FAB}
        as: BuyoutManager
      - call: POST /procurement/purchase-commitments/${pc_id}/delivery-posture
        payload: {to_posture: FABRICATING}
        as: BuyoutManager
      trigger:
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-10-05T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/purchase-commitments/${pc_id}/delivery-posture
        payload: {to_posture: DELIVERED}
        as: BuyoutManager
      assert:
      - the provisional escalation observed at RELEASED_FOR_FAB was 0.00 with escalation_index_period "2026-07" (index unchanged from baseline)
      - PurchaseCommitment.${pc_id}.escalation_accrued == 49000.00
      - PurchaseCommitment.${pc_id}.escalation_variant == FINAL
      - PurchaseCommitment.${pc_id}.escalation_index_period == "2026-10"
      - Project.${proj_id}.escalation_contingency_committed == 49000.00
      - Project.${proj_id}.escalation_contingency_remaining == 451000.00
      - Project.${proj_id}.committed_total_cost == 924000.00
  - name: storage_carrying_cost_rounds_per_month_before_multiplying
    grounds:
    - calculations.storage_carrying_cost
    - entities.OffsiteStorageArrangement.fields.carrying_cost_accrued
    - entities.OffsiteStorageArrangement.fields.monthly_storage_rate_pct
    distinguishing_aspect: 'Mode (b): stored_value 862500.00 at monthly_storage_rate_pct 0.1875 plus INSURANCE_RATE_PCT 0.0175 over exactly 3 full months must read 5304.39, because each component is rounded to 2 dp per month (1617.19 + 150.94 = 1768.13) before multiplying; summing unrounded monthly values and rounding once yields 5304.38.'
    test_recipe:
      setup:
      - Steel package bought out as an early buyout (is_early_buyout true, so requires_storage_arrangement is true)
      - Commitment COMMITTED, RELEASED_FOR_FAB at clock 2026-09-10, then FABRICATING
      - OffsiteStorageArrangement at 'Harbor Yard 7' with stored_value 862500.00, monthly_storage_rate_pct 0.1875, stored_from 2026-09-20 and planned_release_date 2026-12-31
      - All three mandatory documents filed and verified (insurance coverage_amount 900000.00 >= stored_value), so the arrangement is ACTIVE and documentation_status is COMPLETE
      - Clock advanced to 2026-09-20 and the commitment moved to STORED_OFFSITE
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
