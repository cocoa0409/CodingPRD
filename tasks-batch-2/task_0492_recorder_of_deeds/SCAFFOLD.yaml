# =============================================================================
# Recorder of Deeds / County Land Recording — Scaffold Seed Tables (Expert tier)
# =============================================================================

scenario: |
  Recorder of Deeds / County Land Recording: document submission (e-record) &
  indexing, doc-type & recording fee/transfer tax, grantor/grantee index,
  page-stamp & return, rejection (margin/notary) & re-record, plat/survey,
  lien/UCC filing, certified copy & search.

domain_name: recorder-of-deeds
api_prefix: "/"

# Flat / peer topology: most resources are top-level collections referenced by
# foreign keys. A handful of children (party entries, fee assessments, payments,
# rejections, the recorded instrument) live under their owning DocumentPackage.
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on DocumentPackage.version (supersede races)
    - cascading_side_effects        # record -> instrument mint -> counter -> book roll
    - dual_variant_calculation      # estimated vs final transfer tax; settled vs available escrow
    - derived_field_reconciliation  # office sequence counters, daily ledger, index entry counts

  entity_topology: flat
  state_machine_shape: cyclic       # DocumentPackage reject->re-record loop; UCC continuation self-loop
  relationship_patterns:
    - one_to_many                   # Submitter -> packages; Package -> party entries
    - cross_aggregate               # Package recording mutates RecordingOffice counters
  role_model: segregation_of_duties # examiner who finalizes assessment may not record same package
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: RecordingOffice
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: county_name, type: string, source: input, description: "County recorder jurisdiction name" }
      - { name: book_capacity, type: integer, source: input, description: "Max RECORDED documents per book before the book rolls over", constraints: ">= 1" }
      - { name: instrument_seq_start, type: integer, source: input, description: "First instrument number this office mints", default: 1000000 }
      - { name: next_instrument_number, type: integer, source: computed, description: "Next instrument number to mint; starts at instrument_seq_start, +1 per RECORDED document" }
      - { name: current_book, type: integer, source: computed, description: "Current land-records book number; starts at 1, +1 when documents_in_current_book reaches book_capacity", default: 1 }
      - { name: current_page, type: integer, source: computed, description: "Next page within current_book; starts at 1, advances by recorded document page_count, resets to 1 on book roll", default: 1 }
      - { name: documents_in_current_book, type: integer, source: computed, description: "Count of RECORDED RecordedDocument rows where book == current_book and status == RECORDED; resets to 0 on book roll", default: 0 }
      - { name: recording_date, type: datetime, source: computed, description: "Logical business date used to stamp recordings and evaluate lapse/grace; mirrors the logical clock (default 2026-01-01T00:00:00Z)" }
      - { name: daily_collected_cents, type: integer, source: computed, description: "Sum of FeeAssessment.total_due_cents over RecordedDocument rows recorded on recording_date with status RECORDED; reconciled on record and on correction void", default: 0 }
      - { name: total_indexed_entries, type: integer, source: computed, description: "Count of PartyEntry rows in status INDEXED across all recorded packages", default: 0 }

  - name: Submitter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Filing party display name (title company, attorney, or self-filer)" }
      - { name: submitter_type, type: enum, source: input, description: "TITLE_COMPANY | ATTORNEY | SELF | GOVERNMENT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — suspended submitters may not submit new packages", default: ACTIVE }
      - { name: escrow_deposited_total_cents, type: integer, source: computed, description: "Lifetime sum of escrow deposits credited to this submitter", default: 0 }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "Settled escrow: escrow_deposited_total_cents minus sum of CAPTURED Payment.amount_cents drawn from escrow (not reduced by holds)", default: 0 }
      - { name: escrow_held_cents, type: integer, source: computed, description: "Sum of FeeAssessment.total_due_cents for this submitter's packages whose assessment is FINALIZED and not yet PAID/VOIDED (forward-looking hold)", default: 0 }
      - { name: escrow_available_cents, type: integer, source: computed, description: "escrow_balance_cents - escrow_held_cents (forward-looking spendable escrow)" }

  - name: DocumentPackage
    parent: null
    common_fields: true   # version is the OCC parent field
    fields:
      - { name: submitter_id, type: string, source: input, description: "FK -> Submitter.id; the filing party" }
      - { name: office_id, type: string, source: input, description: "FK -> RecordingOffice.id; the recording office" }
      - { name: doc_type, type: enum, source: input, description: "DEED | MORTGAGE | LIEN | UCC | PLAT | OTHER — drives doc-type surcharge and indexing rules" }
      - { name: declared_page_count, type: integer, source: input, description: "Page count declared by the submitter at submission", constraints: ">= 1" }
      - { name: verified_page_count, type: integer, source: computed, description: "Page count confirmed by the examiner during examination; null until examination", required: false }
      - { name: declared_consideration_cents, type: integer, source: input, description: "Consideration amount declared by submitter (for transfer-tax estimate); 0 for non-conveyance docs", default: 0 }
      - { name: verified_consideration_cents, type: integer, source: computed, description: "Consideration confirmed by examiner; null until examination", required: false }
      - { name: first_page_top_margin_inches, type: number, source: input, description: "Top margin of first page in inches; examined against MIN_TOP_MARGIN_INCHES" }
      - { name: notary_present, type: boolean, source: input, description: "Whether an acknowledgement/notary block is present and complete" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | IN_EXAMINATION | ASSESSED | PAID | RECORDED | REJECTED | WITHDRAWN", default: SUBMITTED }
      - { name: examiner_user_id, type: string, source: computed, description: "Opaque X-User-ID of the examiner who finalized the current FeeAssessment (for segregation-of-duties at recording); null until ASSESSED", required: false }
      - { name: resubmission_count, type: integer, source: computed, description: "Number of times this package has looped REJECTED -> IN_EXAMINATION via re-record", default: 0 }

  - name: PartyEntry
    parent: DocumentPackage
    common_fields: true
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> DocumentPackage.id; the package being indexed" }
      - { name: party_role, type: enum, source: input, description: "GRANTOR | GRANTEE — the grantor/grantee index dimension" }
      - { name: party_name, type: string, source: input, description: "Indexed name (last, first or entity name)" }
      - { name: status, type: enum, source: system, description: "PENDING | INDEXED | VOIDED — PENDING until package RECORDED, INDEXED on record, VOIDED on correction", default: PENDING }

  - name: FeeAssessment
    parent: DocumentPackage
    common_fields: true
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> DocumentPackage.id; the assessed package" }
      - { name: recording_fee_cents, type: integer, source: computed, description: "Page/index/doc-type recording fee (see recording_fee calc)" }
      - { name: transfer_tax_cents, type: integer, source: computed, description: "Rounded transfer tax on verified consideration (see transfer_tax calc, final variant)" }
      - { name: records_mgmt_cents, type: integer, source: computed, description: "Rounded records-management surcharge on verified consideration" }
      - { name: total_due_cents, type: integer, source: computed, description: "recording_fee_cents + transfer_tax_cents + records_mgmt_cents (round-each-component-then-sum)" }
      - { name: status, type: enum, source: system, description: "FINALIZED | SUPERSEDED | VOIDED — FINALIZED on exam approval, SUPERSEDED when a newer assessment replaces it, VOIDED on rejection", default: FINALIZED }

  - name: Payment
    parent: DocumentPackage
    common_fields: true
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> DocumentPackage.id; the package being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered; must equal the FINALIZED FeeAssessment.total_due_cents" }
      - { name: method, type: enum, source: input, description: "ESCROW | CARD — ESCROW draws the submitter's settled escrow balance" }
      - { name: status, type: enum, source: system, description: "CAPTURED | FAILED — captured on success, FAILED if escrow insufficient or amount mismatch path taken", default: CAPTURED }

  - name: RecordedDocument
    parent: DocumentPackage
    common_fields: true
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> DocumentPackage.id; the package that was recorded" }
      - { name: instrument_number, type: integer, source: computed, description: "Minted from RecordingOffice.next_instrument_number at record time; never reused" }
      - { name: book, type: integer, source: computed, description: "RecordingOffice.current_book at record time (page-stamp)" }
      - { name: page, type: integer, source: computed, description: "RecordingOffice.current_page at record time (page-stamp)" }
      - { name: recorded_on, type: datetime, source: computed, description: "RecordingOffice.recording_date at record time" }
      - { name: status, type: enum, source: system, description: "RECORDED | CORRECTED_VOID — CORRECTED_VOID set when a recording is voided for correction", default: RECORDED }

  - name: RejectionNotice
    parent: DocumentPackage
    common_fields: true
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> DocumentPackage.id; the rejected package" }
      - { name: reason_code, type: enum, source: input, description: "MARGIN | NOTARY | LEGAL_DESCRIPTION | INDEX_INCOMPLETE | FEE_DISCREPANCY" }
      - { name: detail, type: string, source: input, description: "Free-text rejection detail returned to the submitter", required: false }
      - { name: cured, type: boolean, source: computed, description: "True once the package re-enters examination via re-record", default: false }

  - name: PlatSurvey
    parent: null
    common_fields: true
    fields:
      - { name: submitter_id, type: string, source: input, description: "FK -> Submitter.id; the surveyor/filer" }
      - { name: office_id, type: string, source: input, description: "FK -> RecordingOffice.id; the recording office" }
      - { name: subdivision_name, type: string, source: input, description: "Subdivision name for block-lot reservation scoping" }
      - { name: block_number, type: integer, source: input, description: "Block number within the subdivision" }
      - { name: start_lot, type: integer, source: input, description: "First lot in the reserved contiguous range (inclusive)" }
      - { name: end_lot, type: integer, source: input, description: "Last lot in the reserved contiguous range (inclusive); >= start_lot" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | RECORDED | REJECTED", default: SUBMITTED }
      - { name: plat_book, type: integer, source: computed, description: "Plat-book number assigned at plat recording", required: false }
      - { name: plat_page, type: integer, source: computed, description: "Plat-page number assigned at plat recording", required: false }

  - name: LienUccFiling
    parent: null
    common_fields: true
    fields:
      - { name: submitter_id, type: string, source: input, description: "FK -> Submitter.id; the secured party / filer" }
      - { name: office_id, type: string, source: input, description: "FK -> RecordingOffice.id; the recording office" }
      - { name: lien_type, type: enum, source: input, description: "UCC1 | TAX_LIEN | JUDGMENT_LIEN | MECHANICS_LIEN" }
      - { name: parcel_id, type: string, source: input, description: "Parcel identifier the lien attaches to (used for TAX_LIEN exclusivity)" }
      - { name: debtor_name, type: string, source: input, description: "Debtor / property owner name" }
      - { name: effective_date, type: datetime, source: input, description: "Date the lien period begins (inclusive)" }
      - { name: lapse_date, type: datetime, source: computed, description: "effective_date + LIEN_LAPSE_YEARS; reset forward by continuation" }
      - { name: continuation_count, type: integer, source: computed, description: "Number of continuation statements filed", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED | TERMINATED — ACTIVE on file, LAPSED when recording_date >= lapse_date, TERMINATED on release", default: ACTIVE }

  - name: CopySearchRequest
    parent: null
    common_fields: true
    fields:
      - { name: submitter_id, type: string, source: input, description: "FK -> Submitter.id; the requestor" }
      - { name: request_type, type: enum, source: input, description: "CERTIFIED_COPY | NAME_SEARCH" }
      - { name: recorded_document_id, type: string, source: input, description: "FK -> RecordedDocument.id; required for CERTIFIED_COPY, must be null for NAME_SEARCH", required: false }
      - { name: search_name, type: string, source: input, description: "Name to search the grantor/grantee index (NAME_SEARCH only)", required: false }
      - { name: fee_cents, type: integer, source: computed, description: "Flat copy/search fee (see copy_search_fee calc)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | FULFILLED | DENIED", default: REQUESTED }
      - { name: result_count, type: integer, source: computed, description: "Number of index hits for a fulfilled NAME_SEARCH; copy count (1) for a fulfilled CERTIFIED_COPY", required: false }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: DocumentPackage
    initial_state: SUBMITTED
    terminal_states: [RECORDED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: IN_EXAMINATION
        trigger: "POST /packages/{package_id}/begin-examination"
        actor: Examiner
        preconditions:
          - "Submitter.status == ACTIVE (cross-entity: ERR_SUBMITTER_SUSPENDED)"
          - "At least one PartyEntry with party_role == GRANTOR and at least one with GRANTEE (ERR_INDEX_INCOMPLETE)"
        side_effects:
          - "status -> IN_EXAMINATION"

      - from: IN_EXAMINATION
        to: ASSESSED
        trigger: "POST /packages/{package_id}/assessments  (examiner approves examination by finalizing a FeeAssessment)"
        actor: Examiner
        preconditions:
          - "first_page_top_margin_inches >= MIN_TOP_MARGIN_INCHES (ERR_MARGIN_DEFECT)"
          - "notary_present == true (ERR_NOTARY_DEFECT)"
          - "verified_page_count and verified_consideration_cents supplied in request"
          - "expected_package_version matches DocumentPackage.version (OCC)"
        side_effects:
          - "verified_page_count, verified_consideration_cents set from request"
          - "creates FeeAssessment(status=FINALIZED) with recording_fee_cents, transfer_tax_cents, records_mgmt_cents, total_due_cents computed (final variant)"
          - "any prior FeeAssessment for the package set status=SUPERSEDED"
          - "examiner_user_id := acting Examiner X-User-ID"
          - "Submitter.escrow_held_cents increases by total_due_cents; escrow_available_cents recomputed"
          - "status -> ASSESSED"
          - "increments DocumentPackage.version by 1"

      - from: IN_EXAMINATION
        to: REJECTED
        trigger: "POST /packages/{package_id}/reject"
        actor: Examiner
        preconditions:
          - "reason_code supplied"
        side_effects:
          - "creates RejectionNotice(reason_code, detail) [cascade link 1]"
          - "RejectionNotice creation voids any FINALIZED FeeAssessment for the package -> FeeAssessment.status=VOIDED [cascade link 2]"
          - "voiding the FeeAssessment releases its hold: Submitter.escrow_held_cents decreases by that assessment's total_due_cents; escrow_available_cents recomputed [cascade link 3]"
          - "status -> REJECTED"

      - from: REJECTED
        to: IN_EXAMINATION
        trigger: "POST /packages/{package_id}/re-record"
        actor: Submitter
        preconditions:
          - "acting Submitter owns the package (X-User-ID == submitter_id)"
          - "Submitter.status == ACTIVE (ERR_SUBMITTER_SUSPENDED)"
        side_effects:
          - "applies corrected fields from request (declared_page_count, declared_consideration_cents, first_page_top_margin_inches, notary_present) where provided"
          - "latest RejectionNotice.cured := true"
          - "resubmission_count += 1"
          - "status -> IN_EXAMINATION  [cyclic: REJECTED -> IN_EXAMINATION]"

      - from: ASSESSED
        to: PAID
        trigger: "POST /packages/{package_id}/payments"
        actor: Submitter
        preconditions:
          - "FeeAssessment for package is FINALIZED (cross-entity: ERR_ASSESSMENT_NOT_FINALIZED)"
          - "amount_cents == FINALIZED FeeAssessment.total_due_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
          - "if method==ESCROW: Submitter.escrow_balance_cents >= amount_cents (ERR_ESCROW_INSUFFICIENT)"
          - "expected_package_version matches DocumentPackage.version (OCC)"
        side_effects:
          - "creates Payment(status=CAPTURED)"
          - "if ESCROW: Submitter.escrow_balance_cents decreases by amount_cents"
          - "Submitter.escrow_held_cents decreases by total_due_cents (hold converts to spend); escrow_available_cents recomputed"
          - "status -> PAID"
          - "increments DocumentPackage.version by 1"

      - from: PAID
        to: RECORDED
        trigger: "POST /packages/{package_id}/record"
        actor: Recorder
        preconditions:
          - "acting Recorder X-User-ID != examiner_user_id (segregation of duties: ERR_SEGREGATION_OF_DUTIES)"
          - "package has >= 1 GRANTOR and >= 1 GRANTEE PartyEntry (ERR_INDEX_INCOMPLETE)"
        side_effects:
          - "creates RecordedDocument: instrument_number := office.next_instrument_number, book := office.current_book, page := office.current_page, recorded_on := office.recording_date [cascade link 1]"
          - "RecordedDocument minting increments office.next_instrument_number by 1, advances office.current_page by verified_page_count, and increments office.documents_in_current_book by 1 [cascade link 2]"
          - "if office.documents_in_current_book reaches office.book_capacity: office.current_book += 1, office.documents_in_current_book := 0, office.current_page := 1 (book roll) [cascade link 3]"
          - "all PartyEntry for package: status PENDING -> INDEXED; office.total_indexed_entries += count"
          - "office.daily_collected_cents += FeeAssessment.total_due_cents"
          - "status -> RECORDED"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /packages/{package_id}/withdraw"
        actor: Submitter
        preconditions:
          - "acting Submitter owns the package (X-User-ID == submitter_id)"
        side_effects:
          - "status -> WITHDRAWN; PartyEntry rows -> VOIDED"

      - from: REJECTED
        to: WITHDRAWN
        trigger: "POST /packages/{package_id}/withdraw"
        actor: Submitter
        preconditions:
          - "acting Submitter owns the package (X-User-ID == submitter_id)"
        side_effects:
          - "status -> WITHDRAWN; PartyEntry rows -> VOIDED"

  - entity: RecordedDocument
    initial_state: RECORDED
    terminal_states: [CORRECTED_VOID]
    transitions:
      - from: RECORDED
        to: CORRECTED_VOID
        trigger: "POST /recorded-documents/{recorded_document_id}/void-correction"
        actor: Recorder
        preconditions:
          - "RecordedDocument.recorded_on == office.recording_date (only same-recording-day corrections allowed: ERR_CORRECTION_WINDOW_CLOSED)"
        side_effects:
          - "status -> CORRECTED_VOID"
          - "office.documents_in_current_book -= 1 (count of RECORDED docs in book decreases) [compensating: documents_in_current_book invariant]"
          - "office.daily_collected_cents -= FeeAssessment.total_due_cents [compensating: daily ledger]"
          - "package PartyEntry rows: INDEXED -> VOIDED; office.total_indexed_entries -= count [compensating: index entry invariant]"
          - "note: instrument_number is NOT reclaimed (tamper-evident sequence); next_instrument_number unchanged"

  - entity: PlatSurvey
    initial_state: SUBMITTED
    terminal_states: [RECORDED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plats/{plat_id}/approve"
        actor: Examiner
        preconditions:
          - "end_lot >= start_lot (ERR_INVALID_LOT_RANGE)"
          - "no RECORDED PlatSurvey on same office_id + subdivision_name + block_number whose [start_lot,end_lot] (closed, inclusive) overlaps this range (ERR_LOT_RANGE_OVERLAP)"
        side_effects:
          - "status -> APPROVED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plats/{plat_id}/reject"
        actor: Examiner
        preconditions: []
        side_effects:
          - "status -> REJECTED"

      - from: APPROVED
        to: RECORDED
        trigger: "POST /plats/{plat_id}/record"
        actor: Recorder
        preconditions:
          - "re-check: no RECORDED PlatSurvey overlaps the lot range (ERR_LOT_RANGE_OVERLAP)"
        side_effects:
          - "plat_book := office.current_book, plat_page := office.current_page (page-stamp)"
          - "status -> RECORDED"

  - entity: LienUccFiling
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /ucc-filings/{filing_id}/continue"
        actor: Submitter
        preconditions:
          - "acting Submitter owns the filing (X-User-ID == submitter_id)"
          - "office.recording_date < lapse_date (continuation only before lapse: ERR_FILING_ALREADY_LAPSED)"
          - "office.recording_date >= lapse_date - CONTINUATION_WINDOW_DAYS (continuation window: ERR_CONTINUATION_TOO_EARLY)"
        side_effects:
          - "lapse_date := lapse_date + LIEN_LAPSE_YEARS"
          - "continuation_count += 1  [cyclic self-loop ACTIVE -> ACTIVE]"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ucc-filings/{filing_id}/terminate"
        actor: Submitter
        preconditions:
          - "acting Submitter owns the filing (X-User-ID == submitter_id)"
        side_effects:
          - "status -> TERMINATED"

      - from: ACTIVE
        to: LAPSED
        trigger: "system: evaluated on GET /ucc-filings/{filing_id} when office.recording_date >= lapse_date"
        actor: system
        preconditions:
          - "office.recording_date >= lapse_date"
        side_effects:
          - "status -> LAPSED (terminal for enforcement; continuation no longer accepted)"
        note: "LAPSED is derived/lazy on read; clock advance via /_clock/set_current_utc makes it observable"

  - entity: CopySearchRequest
    initial_state: REQUESTED
    terminal_states: [FULFILLED, DENIED]
    transitions:
      - from: REQUESTED
        to: FULFILLED
        trigger: "POST /copy-search-requests/{request_id}/fulfill"
        actor: Clerk
        preconditions:
          - "if request_type==CERTIFIED_COPY: referenced RecordedDocument exists and status==RECORDED (cross-entity: ERR_DOCUMENT_NOT_RECORDED)"
        side_effects:
          - "status -> FULFILLED"
          - "result_count := 1 for CERTIFIED_COPY; for NAME_SEARCH := count of INDEXED PartyEntry whose party_name == search_name"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /copy-search-requests/{request_id}/deny"
        actor: Clerk
        preconditions: []
        side_effects:
          - "status -> DENIED"

# =============================================================================
# Concurrency Rules (§1.2.1) — true CREATE-with-supersede races, OCC-resolved
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-package
    parent_entity: DocumentPackage
    write_endpoint: "POST /packages/{package_id}/assessments"
    occ_field: "expected_package_version"
    description: |
      Finalizing a FeeAssessment against a DocumentPackage whose version has
      advanced since the client last observed it is rejected. A re-examination
      legitimately creates a new FINALIZED assessment that supersedes the prior
      one (the prior becomes SUPERSEDED), so a writer holding a stale package
      version is rejected on the OCC check rather than silently overwriting a
      newer assessment.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412

  - rule_id: payment-create-stale-package
    parent_entity: DocumentPackage
    write_endpoint: "POST /packages/{package_id}/payments"
    occ_field: "expected_package_version"
    description: |
      Capturing a Payment against a DocumentPackage whose version has advanced
      since the client last observed it is rejected. A newer assessment may have
      superseded the one the client priced against; the stale package version is
      rejected on the OCC check so the payment cannot be applied to an outdated
      total.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: recording_fee
    trigger: "DocumentPackage IN_EXAMINATION -> ASSESSED (FeeAssessment finalized)"
    algorithm: tiered_pricing
    formula: |
      page_fee_cents  = BASE_FIRST_PAGE_CENTS + ADDL_PAGE_CENTS * max(0, verified_page_count - 1)
      index_fee_cents = INDEX_SURCHARGE_CENTS * max(0, party_entry_count - FREE_PARTY_ENTRIES)
      doctype_fee_cents = DOCTYPE_SURCHARGE_CENTS[doc_type]
      recording_fee_cents = page_fee_cents + index_fee_cents + doctype_fee_cents
      # party_entry_count = count of non-VOIDED PartyEntry for the package (GRANTOR + GRANTEE)
    input_set: "verified_page_count, doc_type, and count of non-VOIDED PartyEntry for the package"
    constants:
      BASE_FIRST_PAGE_CENTS: 2500
      ADDL_PAGE_CENTS: 500
      INDEX_SURCHARGE_CENTS: 200
      FREE_PARTY_ENTRIES: 4
      DOCTYPE_SURCHARGE_CENTS: { DEED: 1000, MORTGAGE: 1500, LIEN: 800, UCC: 500, PLAT: 3000, OTHER: 0 }
    precision: "integer cents; no rounding (all terms integer)"

  - name: transfer_tax
    trigger: "estimated at submission (declared consideration); final at IN_EXAMINATION -> ASSESSED (verified consideration)"
    algorithm: threshold
    formula: |
      consideration = (variant == final) ? verified_consideration_cents : declared_consideration_cents
      if consideration <= EXEMPT_THRESHOLD_CENTS:
          transfer_tax_cents = 0
      else:
          transfer_tax_cents = round_half_up(consideration * TAX_RATE_BPS / 10000)
    input_set: "verified_consideration_cents (final) or declared_consideration_cents (estimated)"
    constants:
      TAX_RATE_BPS: 55            # 0.55%
      EXEMPT_THRESHOLD_CENTS: 10000  # consideration <= $100.00 is exempt (boundary: <=)
    precision: "round_half_up to whole cents"
    variants:
      - name: estimated
        when: "computed at submission from declared_consideration_cents; informational only, not persisted on FeeAssessment"
        difference: "uses submitter-declared consideration; may differ from final when examiner verifies a different consideration"
      - name: final
        when: "computed at examination approval from verified_consideration_cents; persisted as FeeAssessment.transfer_tax_cents"
        difference: "uses examiner-verified consideration; this is the authoritative value charged"

  - name: total_amount_due
    trigger: "DocumentPackage IN_EXAMINATION -> ASSESSED (FeeAssessment finalized)"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round each component to cents independently, THEN sum.
      # (NOT: sum the raw fractional components then round once.)
      transfer_tax_cents  = (verified_consideration_cents <= EXEMPT_THRESHOLD_CENTS) ? 0
                            : round_half_up(verified_consideration_cents * TAX_RATE_BPS / 10000)
      records_mgmt_cents  = (verified_consideration_cents <= EXEMPT_THRESHOLD_CENTS) ? 0
                            : round_half_up(verified_consideration_cents * RMS_BPS / 10000)
      total_due_cents     = recording_fee_cents + transfer_tax_cents + records_mgmt_cents
    input_set: "recording_fee_cents (from recording_fee), verified_consideration_cents"
    constants:
      TAX_RATE_BPS: 55
      RMS_BPS: 13                 # 0.13% records-management surcharge
      EXEMPT_THRESHOLD_CENTS: 10000
    precision: "round_half_up each of transfer_tax_cents and records_mgmt_cents to whole cents, then integer-sum with recording_fee_cents"

  - name: escrow_available
    trigger: "recomputed on FeeAssessment finalize/void, on Payment capture, and on escrow deposit"
    algorithm: forward_looking
    formula: |
      escrow_balance_cents   = escrow_deposited_total_cents - sum(Payment.amount_cents for CAPTURED ESCROW payments on this submitter's packages)
      escrow_held_cents      = sum(FeeAssessment.total_due_cents for this submitter's packages whose assessment is FINALIZED and package status == ASSESSED)
      escrow_available_cents = escrow_balance_cents - escrow_held_cents
    input_set: "Submitter's CAPTURED ESCROW payments (settled, chronological) and FINALIZED assessments on ASSESSED packages (forward-looking holds)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: settled
        when: "escrow_balance_cents — chronological: only CAPTURED escrow payments reduce it"
        difference: "reflects money actually drawn; ignores pending holds"
      - name: available
        when: "escrow_available_cents — forward-looking: also subtracts FINALIZED-but-unpaid assessment holds"
        difference: "reflects spendable escrow; a hold reduces available without reducing settled balance"

  - name: copy_search_fee
    trigger: "CopySearchRequest creation"
    algorithm: threshold
    formula: |
      fee_cents = (request_type == CERTIFIED_COPY) ? CERTIFIED_COPY_FEE_CENTS : NAME_SEARCH_FEE_CENTS
    input_set: "request_type"
    constants:
      CERTIFIED_COPY_FEE_CENTS: 1500
      NAME_SEARCH_FEE_CENTS: 800
    precision: "integer cents"

  - name: ucc_lapse_and_overlap
    trigger: "LienUccFiling create (lapse_date), continue (extend), and TAX_LIEN overlap check on create; LAPSED evaluated lazily on read"
    algorithm: interval_merge
    formula: |
      lapse_date = effective_date + LIEN_LAPSE_YEARS                      # on create
      lapse_date = lapse_date + LIEN_LAPSE_YEARS                          # on continuation
      status -> LAPSED  when  office.recording_date >= lapse_date         # half-open: lapsed AT lapse_date (>=)
      continuation window opens at  lapse_date - CONTINUATION_WINDOW_DAYS  (inclusive)
      # TAX_LIEN exclusivity per parcel (half-open periods with grace buffer):
      # reject new TAX_LIEN with period [effective_date, lapse_date) on parcel P if an ACTIVE TAX_LIEN
      # exists on P whose buffered period [existing.effective_date, existing.lapse_date + TAX_LIEN_GRACE_DAYS)
      # contains new.effective_date, i.e. new.effective_date < existing.lapse_date + TAX_LIEN_GRACE_DAYS
      # AND new.effective_date >= existing.effective_date. Adjacency requires >= grace gap.
    input_set: "effective_date, parcel_id, lien_type; ACTIVE TAX_LIEN filings on same parcel"
    constants:
      LIEN_LAPSE_YEARS: 5
      CONTINUATION_WINDOW_DAYS: 180   # continuation allowed within 180 days before lapse_date
      TAX_LIEN_GRACE_DAYS: 30         # mandatory buffer between consecutive tax-lien periods on a parcel

  - name: examination_margin
    trigger: "IN_EXAMINATION -> ASSESSED (examiner approves examination)"
    algorithm: threshold
    formula: |
      pass if first_page_top_margin_inches >= MIN_TOP_MARGIN_INCHES   # boundary: >= (exactly 3.0 passes)
      else ERR_MARGIN_DEFECT
    input_set: "first_page_top_margin_inches"
    constants:
      MIN_TOP_MARGIN_INCHES: 3.0

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource IDs resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body has all required fields with valid types/enums; numeric fields non-negative; for CERTIFIED_COPY recorded_document_id present and search_name absent, for NAME_SEARCH search_name present and recorded_document_id absent"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH"

  - priority: 5
    category: state
    check: "Target resource is in a valid source state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "Acting entity_backed user owns the resource (Submitter X-User-ID == resource.submitter_id) for owner-scoped actions"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "re-record, withdraw, payments, continue, terminate"

  - priority: 7
    category: business_safety
    check: "Compliance: submitter not SUSPENDED; segregation of duties (recorder != examiner of record); margin and notary defects block examination approval"
    error_id: "varies (ERR_SUBMITTER_SUSPENDED, ERR_SEGREGATION_OF_DUTIES, ERR_MARGIN_DEFECT, ERR_NOTARY_DEFECT)"
    http_status: 409
    applies_to: "begin-examination, assessments, record"

  - priority: 8
    category: business_referential
    check: "Index completeness (>=1 GRANTOR and >=1 GRANTEE) and cross-entity state (assessment FINALIZED before payment; document RECORDED before certified copy)"
    error_id: "varies (ERR_INDEX_INCOMPLETE, ERR_ASSESSMENT_NOT_FINALIZED, ERR_DOCUMENT_NOT_RECORDED)"
    http_status: 409
    applies_to: "begin-examination, record, payments, fulfill"

  - priority: 9
    category: business_temporal
    check: "Temporal-overlap and window rules: plat lot-range overlap; tax-lien period overlap with grace buffer; continuation window/lapse; same-day correction window"
    error_id: "varies (ERR_LOT_RANGE_OVERLAP, ERR_TAX_LIEN_OVERLAP, ERR_CONTINUATION_TOO_EARLY, ERR_FILING_ALREADY_LAPSED, ERR_CORRECTION_WINDOW_CLOSED)"
    http_status: 409
    applies_to: "plat approve/record, ucc create/continue, void-correction"

  - priority: 10
    category: business_fiscal
    check: "Payment amount equals FINALIZED total_due; escrow sufficiency for ESCROW method"
    error_id: "varies (ERR_PAYMENT_AMOUNT_MISMATCH, ERR_ESCROW_INSUFFICIENT)"
    http_status: 409
    applies_to: "payments"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_package_version matches current DocumentPackage.version"
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412
    applies_to: "assessments, payments"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- RecordingOffice ---
  - method: POST
    path: "/offices"
    description: "Create a recording office (sets sequence start, book capacity)"
    roles: [Clerk]
    code: 201
    input: [county_name, book_capacity, "instrument_seq_start?"]
    output: RecordingOffice
    side_effects: ["next_instrument_number=instrument_seq_start, current_book=1, current_page=1, documents_in_current_book=0, recording_date=clock"]

  - method: GET
    path: "/offices/{id}"
    description: "Get a recording office (sequence counters, daily ledger)"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: RecordingOffice
    side_effects: []

  - method: POST
    path: "/offices/{id}/deposit-escrow"
    description: "Credit escrow to a submitter via this office's cashier"
    roles: [Clerk]
    code: 201
    input: [submitter_id, amount_cents]
    output: Submitter
    side_effects: ["Submitter.escrow_deposited_total_cents += amount_cents; escrow_balance_cents += amount_cents; escrow_available recomputed"]

  # --- Submitter ---
  - method: POST
    path: "/submitters"
    description: "Register a filing party"
    roles: [Clerk]
    code: 201
    input: [name, submitter_type]
    output: Submitter
    side_effects: ["status=ACTIVE, escrow fields 0"]

  - method: GET
    path: "/submitters/{id}"
    description: "Get a submitter (escrow balances)"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: Submitter
    side_effects: []

  - method: POST
    path: "/submitters/{id}/suspend"
    description: "Suspend a submitter (blocks new submissions/re-records)"
    roles: [Clerk]
    code: 200
    input: []
    output: Submitter
    side_effects: ["status=SUSPENDED"]

  - method: GET
    path: "/submitters"
    description: "List submitters"
    roles: [Clerk, Examiner, Recorder]
    code: 200
    input: ["limit?", "offset?"]
    output: Submitter[]
    side_effects: []

  # --- DocumentPackage ---
  - method: POST
    path: "/packages"
    description: "Submit a document package (e-record)"
    roles: [Submitter]
    code: 201
    input: [submitter_id, office_id, doc_type, declared_page_count, "declared_consideration_cents?", first_page_top_margin_inches, notary_present]
    output: DocumentPackage
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/packages/{id}"
    description: "Get a document package"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: DocumentPackage
    side_effects: []

  - method: GET
    path: "/packages"
    description: "List/filter document packages"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: ["submitter_id?", "office_id?", "status?", "limit?", "offset?"]
    output: DocumentPackage[]
    side_effects: []

  - method: POST
    path: "/packages/{id}/party-entries"
    description: "Add a grantor/grantee index entry to a package"
    roles: [Submitter]
    code: 201
    input: [party_role, party_name]
    output: PartyEntry
    side_effects: ["PartyEntry status=PENDING"]

  - method: GET
    path: "/packages/{id}/party-entries"
    description: "List a package's grantor/grantee index entries"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: PartyEntry[]
    side_effects: []

  - method: POST
    path: "/packages/{id}/begin-examination"
    description: "Begin examination of a submitted package"
    roles: [Examiner]
    code: 200
    input: []
    output: DocumentPackage
    side_effects: ["status SUBMITTED -> IN_EXAMINATION"]

  - method: POST
    path: "/packages/{id}/assessments"
    description: "Approve examination by finalizing the fee/transfer-tax assessment (margin/notary checked here)"
    roles: [Examiner]
    code: 201
    input: [verified_page_count, verified_consideration_cents, expected_package_version]
    output: FeeAssessment
    side_effects:
      - "package verified_page_count/verified_consideration_cents set"
      - "FeeAssessment(FINALIZED) created with computed fees; prior assessment SUPERSEDED"
      - "examiner_user_id set; Submitter.escrow_held_cents += total_due_cents"
      - "status IN_EXAMINATION -> ASSESSED"
      - "increments DocumentPackage.version by 1"

  - method: GET
    path: "/packages/{id}/assessments"
    description: "List a package's fee assessments (latest FINALIZED is authoritative)"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: FeeAssessment[]
    side_effects: []

  - method: POST
    path: "/packages/{id}/reject"
    description: "Reject a package under examination (margin/notary/legal/index/fee)"
    roles: [Examiner]
    code: 201
    input: [reason_code, "detail?"]
    output: RejectionNotice
    side_effects:
      - "RejectionNotice created [cascade]"
      - "FINALIZED FeeAssessment -> VOIDED; escrow hold released [cascade]"
      - "package status IN_EXAMINATION -> REJECTED"

  - method: GET
    path: "/packages/{id}/rejections"
    description: "List a package's rejection notices"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: RejectionNotice[]
    side_effects: []

  - method: POST
    path: "/packages/{id}/re-record"
    description: "Re-record (correct & resubmit) a rejected package"
    roles: [Submitter]
    code: 200
    input: ["declared_page_count?", "declared_consideration_cents?", "first_page_top_margin_inches?", "notary_present?"]
    output: DocumentPackage
    side_effects: ["corrected fields applied; latest rejection cured; resubmission_count += 1; status REJECTED -> IN_EXAMINATION"]

  - method: POST
    path: "/packages/{id}/payments"
    description: "Pay a package's finalized assessment (escrow or card)"
    roles: [Submitter]
    code: 201
    input: [amount_cents, method, expected_package_version]
    output: Payment
    side_effects:
      - "Payment(CAPTURED) created; escrow drawn if ESCROW; hold released"
      - "status ASSESSED -> PAID"
      - "increments DocumentPackage.version by 1"

  - method: GET
    path: "/packages/{id}/payments"
    description: "List a package's payments"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/packages/{id}/record"
    description: "Record a paid package: page-stamp, mint instrument number, index parties"
    roles: [Recorder]
    code: 201
    input: []
    output: RecordedDocument
    side_effects:
      - "RecordedDocument minted (instrument_number/book/page/recorded_on) [cascade]"
      - "office counters advance; book may roll [cascade]"
      - "PartyEntry -> INDEXED; office.total_indexed_entries/daily_collected_cents updated"
      - "status PAID -> RECORDED"

  - method: GET
    path: "/packages/{id}/recorded-document"
    description: "Get the recorded instrument for a package (0 or 1)"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: RecordedDocument[]
    side_effects: []

  - method: POST
    path: "/packages/{id}/withdraw"
    description: "Withdraw a submitted or rejected package"
    roles: [Submitter]
    code: 200
    input: []
    output: DocumentPackage
    side_effects: ["status -> WITHDRAWN; PartyEntry -> VOIDED"]

  # --- RecordedDocument ---
  - method: GET
    path: "/recorded-documents/{id}"
    description: "Get a recorded instrument by id"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: RecordedDocument
    side_effects: []

  - method: POST
    path: "/recorded-documents/{id}/void-correction"
    description: "Void a recording for correction (same recording-day only)"
    roles: [Recorder]
    code: 200
    input: []
    output: RecordedDocument
    side_effects:
      - "status RECORDED -> CORRECTED_VOID"
      - "office documents_in_current_book/daily_collected_cents/total_indexed_entries decremented [compensating]"
      - "PartyEntry INDEXED -> VOIDED"

  # --- PlatSurvey ---
  - method: POST
    path: "/plats"
    description: "Submit a plat/survey reserving a block lot-range"
    roles: [Submitter]
    code: 201
    input: [submitter_id, office_id, subdivision_name, block_number, start_lot, end_lot]
    output: PlatSurvey
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/plats/{id}"
    description: "Get a plat/survey"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: PlatSurvey
    side_effects: []

  - method: GET
    path: "/plats"
    description: "List/filter plats/surveys"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: ["submitter_id?", "office_id?", "subdivision_name?", "status?", "limit?", "offset?"]
    output: PlatSurvey[]
    side_effects: []

  - method: POST
    path: "/plats/{id}/approve"
    description: "Approve a plat (lot-range overlap checked)"
    roles: [Examiner]
    code: 200
    input: []
    output: PlatSurvey
    side_effects: ["status SUBMITTED -> APPROVED"]

  - method: POST
    path: "/plats/{id}/reject"
    description: "Reject a plat"
    roles: [Examiner]
    code: 200
    input: []
    output: PlatSurvey
    side_effects: ["status SUBMITTED -> REJECTED"]

  - method: POST
    path: "/plats/{id}/record"
    description: "Record an approved plat (page-stamp in plat book)"
    roles: [Recorder]
    code: 200
    input: []
    output: PlatSurvey
    side_effects: ["plat_book/plat_page stamped; status APPROVED -> RECORDED"]

  # --- LienUccFiling ---
  - method: POST
    path: "/ucc-filings"
    description: "File a lien / UCC statement"
    roles: [Submitter]
    code: 201
    input: [submitter_id, office_id, lien_type, parcel_id, debtor_name, effective_date]
    output: LienUccFiling
    side_effects: ["lapse_date := effective_date + LIEN_LAPSE_YEARS; status=ACTIVE"]

  - method: GET
    path: "/ucc-filings/{id}"
    description: "Get a lien/UCC filing (lazily evaluates LAPSED)"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: LienUccFiling
    side_effects: ["if recording_date >= lapse_date and status==ACTIVE: status -> LAPSED"]

  - method: GET
    path: "/ucc-filings"
    description: "List/filter lien/UCC filings"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: ["submitter_id?", "office_id?", "parcel_id?", "lien_type?", "status?", "limit?", "offset?"]
    output: LienUccFiling[]
    side_effects: []

  - method: POST
    path: "/ucc-filings/{id}/continue"
    description: "File a continuation statement (extends lapse_date)"
    roles: [Submitter]
    code: 200
    input: []
    output: LienUccFiling
    side_effects: ["lapse_date += LIEN_LAPSE_YEARS; continuation_count += 1"]

  - method: POST
    path: "/ucc-filings/{id}/terminate"
    description: "Terminate a lien/UCC filing"
    roles: [Submitter]
    code: 200
    input: []
    output: LienUccFiling
    side_effects: ["status -> TERMINATED"]

  # --- CopySearchRequest ---
  - method: POST
    path: "/copy-search-requests"
    description: "Request a certified copy or a grantor/grantee name search"
    roles: [Submitter]
    code: 201
    input: [submitter_id, request_type, "recorded_document_id?", "search_name?"]
    output: CopySearchRequest
    side_effects: ["fee_cents computed; status=REQUESTED"]

  - method: GET
    path: "/copy-search-requests/{id}"
    description: "Get a copy/search request"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: []
    output: CopySearchRequest
    side_effects: []

  - method: GET
    path: "/copy-search-requests"
    description: "List/filter copy/search requests"
    roles: [Clerk, Examiner, Recorder, Submitter]
    code: 200
    input: ["submitter_id?", "recorded_document_id?", "request_type?", "status?", "limit?", "offset?"]
    output: CopySearchRequest[]
    side_effects: []

  - method: POST
    path: "/copy-search-requests/{id}/fulfill"
    description: "Fulfill a copy/search request (search runs the index)"
    roles: [Clerk]
    code: 200
    input: []
    output: CopySearchRequest
    side_effects: ["status -> FULFILLED; result_count set"]

  - method: POST
    path: "/copy-search-requests/{id}/deny"
    description: "Deny a copy/search request"
    roles: [Clerk]
    code: 200
    input: []
    output: CopySearchRequest
    side_effects: ["status -> DENIED"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (drives recording_date, lapse/grace evaluation). Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Clerk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all RecordingOffice.recording_date track the new clock value"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/invalid field, bad enum, negative amount, or copy/search field combination invalid" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid source state for the requested transition" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting submitter is not the owner of the target resource" }
  - { id: ERR_SUBMITTER_SUSPENDED, http: 409, condition: "Submitter is SUSPENDED; cannot submit or re-record" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Recorder X-User-ID equals the examiner_user_id who finalized the assessment" }
  - { id: ERR_MARGIN_DEFECT, http: 409, condition: "first_page_top_margin_inches < MIN_TOP_MARGIN_INCHES at examination approval" }
  - { id: ERR_NOTARY_DEFECT, http: 409, condition: "notary_present is false at examination approval" }
  - { id: ERR_INDEX_INCOMPLETE, http: 409, condition: "Package lacks at least one GRANTOR and one GRANTEE party entry" }
  - { id: ERR_ASSESSMENT_NOT_FINALIZED, http: 409, condition: "Payment attempted with no FINALIZED FeeAssessment" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 409, condition: "Payment amount_cents != FINALIZED total_due_cents" }
  - { id: ERR_ESCROW_INSUFFICIENT, http: 409, condition: "ESCROW payment exceeds submitter settled escrow_balance_cents" }
  - { id: ERR_DOCUMENT_NOT_RECORDED, http: 409, condition: "Certified copy referenced document is not RECORDED" }
  - { id: ERR_INVALID_LOT_RANGE, http: 422, condition: "Plat end_lot < start_lot" }
  - { id: ERR_LOT_RANGE_OVERLAP, http: 409, condition: "Plat lot range overlaps an already-RECORDED plat in same subdivision+block (closed inclusive intervals)" }
  - { id: ERR_TAX_LIEN_OVERLAP, http: 409, condition: "TAX_LIEN period overlaps (with grace buffer) an ACTIVE TAX_LIEN on the same parcel (half-open intervals)" }
  - { id: ERR_CONTINUATION_TOO_EARLY, http: 409, condition: "Continuation filed before the continuation window opens (lapse_date - CONTINUATION_WINDOW_DAYS)" }
  - { id: ERR_FILING_ALREADY_LAPSED, http: 409, condition: "Continuation attempted on a filing whose lapse_date has passed (LAPSED)" }
  - { id: ERR_CORRECTION_WINDOW_CLOSED, http: 409, condition: "Void-correction attempted after the recording day (recorded_on != office.recording_date)" }
  - { id: ERR_STALE_PACKAGE_VERSION, http: 412, condition: "expected_package_version != current DocumentPackage.version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Submitter
    description: "Filing party (title company, attorney, or self-filer) — submits packages, indexes parties, pays, re-records, files plats/liens, requests copies/searches"
    identity: "entity_backed:Submitter"
    exclusive_operations:
      - "POST /packages — submit package"
      - "POST /packages/{id}/party-entries — add index entry"
      - "POST /packages/{id}/re-record — correct & resubmit"
      - "POST /packages/{id}/payments — pay assessment"
      - "POST /packages/{id}/withdraw — withdraw package"
      - "POST /plats — submit plat"
      - "POST /ucc-filings — file lien/UCC"
      - "POST /ucc-filings/{id}/continue — continuation"
      - "POST /ucc-filings/{id}/terminate — terminate filing"
      - "POST /copy-search-requests — request copy/search"
    shared_operations:
      - "GET reads on owned and public records"

  - name: Examiner
    description: "County examiner — examines packages, checks margin/notary, finalizes assessments, rejects, approves/rejects plats"
    identity: "opaque"
    exclusive_operations:
      - "POST /packages/{id}/begin-examination"
      - "POST /packages/{id}/assessments — finalize assessment (approve exam)"
      - "POST /packages/{id}/reject"
      - "POST /plats/{id}/approve"
      - "POST /plats/{id}/reject"
    shared_operations:
      - "GET reads"

  - name: Recorder
    description: "Recording officer — records paid packages (page-stamp, instrument mint), records plats, voids recordings for correction. Segregated from the examiner of record."
    identity: "opaque"
    exclusive_operations:
      - "POST /packages/{id}/record"
      - "POST /recorded-documents/{id}/void-correction"
      - "POST /plats/{id}/record"
    shared_operations:
      - "GET reads"

  - name: Clerk
    description: "Front-office clerk — sets up offices, registers/suspends submitters, deposits escrow, fulfills/denies copy & search requests, sets the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /offices — create office"
      - "POST /offices/{id}/deposit-escrow"
      - "POST /submitters — register submitter"
      - "POST /submitters/{id}/suspend"
      - "POST /copy-search-requests/{id}/fulfill"
      - "POST /copy-search-requests/{id}/deny"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads"
