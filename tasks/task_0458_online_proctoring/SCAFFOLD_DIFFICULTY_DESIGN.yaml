              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
          trigger:
            - call: "POST /integrity-reports"
              payload: { institution_id: "${inst_id}", candidate_id: "${cand_id}", exam_id: "${exam_id}", session_ids: [] }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EMPTY_REPORT"

