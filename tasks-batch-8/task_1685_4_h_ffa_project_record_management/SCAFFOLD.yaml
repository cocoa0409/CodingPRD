    roles: [Volunteer]
    code: 200
    input: []
    output: TreasuryTransaction
    side_effects: ["transition POSTED->APPROVED", "debit club.treasury_balance_cents", "increments Club.version by 1"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role is recognized but not permitted to invoke this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource id does not exist."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Entity-backed caller does not own the target resource or X-User-ID does not resolve."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, invalid enum, negative amount, or ends_at not strictly after starts_at."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a valid from-state for the requested transition."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Acting volunteer violates a segregation-of-duties rule (self-review or self-endorsement)."
  - id: ERR_SCREENING_NOT_CLEARED
    http: 422
    condition: "Volunteer lacks required screening clearance, or clearance preconditions (score/FAIL events) unmet."
  - id: ERR_ROOM_CONFLICT
    http: 409
    condition: "Meeting interval overlaps an existing SCHEDULED/HELD meeting in the same room (half-open semantics)."
  - id: ERR_PEN_CAPACITY_EXCEEDED
    http: 422
    condition: "Stall assignment would exceed the pen's animal_capacity (aggregate count)."
  - id: ERR_STAR_QUOTA_EXCEEDED
    http: 422
    condition: "Club already has 2 active STAR nominations."
  - id: ERR_OWNERSHIP_PERIOD_SHORT
    http: 422
    condition: "Animal ownership days at the fair deadline fall below the species minimum."
  - id: ERR_INSUFFICIENT_TREASURY
    http: 422
    condition: "Approving a reimbursement would drive the club treasury negative."
  - id: ERR_REFERENTIAL_INTEGRITY
    http: 422
    condition: "Cross-entity reference inconsistent (project/member mismatch or wrong award track linkage)."

roles:
  - name: ProgramAdmin
    description: "County extension program administrator; manages clubs, volunteers, rooms, pens, and screening."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/clubs"
      - "POST /api/volunteers"
      - "POST /api/volunteers/{id}/clear"
      - "POST /api/volunteers/{id}/deny"
      - "POST /api/screening-events"
      - "POST /api/rooms"
      - "POST /api/pens"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
  - name: Volunteer
    description: "Cleared adult leader/advisor; enrolls members, reviews record books, manages meetings, fair entries, awards, treasury."
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /api/members"
      - "POST /api/members/{id}/activate"
      - "POST /api/members/{id}/suspend"
      - "POST /api/members/{id}/reinstate"
      - "POST /api/members/{id}/graduate"
      - "POST /api/record-books/{id}/begin-review"
      - "POST /api/record-books/{id}/approve"
      - "POST /api/record-books/{id}/reject"
      - "POST /api/record-books/{id}/return"
      - "POST /api/projects/{id}/complete"
      - "POST /api/meetings"
      - "POST /api/meetings/{id}/mark-held"
      - "POST /api/meetings/{id}/cancel"
      - "POST /api/attendance"
      - "POST /api/fair-entries/{id}/confirm"
      - "POST /api/fair-entries/{id}/mark-exhibited"
      - "POST /api/stall-assignments"
      - "POST /api/stall-assignments/{id}/release"
      - "POST /api/award-applications/{id}/nominate"
      - "POST /api/award-applications/{id}/endorse"
      - "POST /api/award-applications/{id}/evaluate"
      - "POST /api/award-applications/{id}/award"
      - "POST /api/award-applications/{id}/deny"
      - "POST /api/treasury-transactions"
      - "POST /api/treasury-transactions/{id}/approve"
      - "POST /api/treasury-transactions/{id}/void"
      - "POST /api/animal-tags/{id}/verify"
      - "POST /api/animal-tags/{id}/reject"
    shared_operations:
      - "GET endpoints"
      - "POST /api/projects"
      - "POST /api/animal-tags"
      - "POST /api/fair-entries/{id}/scratch"
  - name: Member
    description: "Youth member; manages own projects, record books, fair entries, award and scholarship applications."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /api/projects/{id}/start"
      - "POST /api/projects/{id}/drop"
      - "POST /api/record-books"
      - "POST /api/ledger-entries"
      - "POST /api/ledger-entries/{id}/void"
      - "POST /api/record-books/{id}/submit"
      - "POST /api/fair-entries"
      - "POST /api/award-applications"
      - "POST /api/award-applications/{id}/withdraw"
      - "POST /api/scholarship-apps"
      - "POST /api/scholarship-apps/{id}/submit"
    shared_operations:
      - "GET endpoints"
      - "POST /api/projects"
      - "POST /api/animal-tags"
      - "POST /api/fair-entries/{id}/scratch"
