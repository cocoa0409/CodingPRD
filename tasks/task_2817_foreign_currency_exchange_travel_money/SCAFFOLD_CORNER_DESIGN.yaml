      - name: damaged_recovery_bps_override_and_two_step_rounding
        claim_type: constants_applied
        grounds:
          - calculations.damaged_note_recovery
          - entities.CurrencyProfile.fields.damaged_note_recovery_bps
        distinguishing_aspect: "The recovery percentage comes from the currency profile, not from a global constant: with damaged_note_recovery_bps set to 4000 instead of the 6500 default, a 3 x 10000 damaged block recovers 12364 cents (round_half_up(30000 * 1000000 / 970600) = 30909, then round_half_up(30909 * 4000 / 10000)), whereas collapsing the two rounding steps gives 12363 and the 6500 default would give 20091."
        test_recipe:
          setup:
            - "Branch BR-LHR (SOUTH, 20,000,000-cent limit); EUR declared with damaged_note_recovery_bps 4000; a 920000-micro mid; a PUBLISHED card with 550/450 spreads (buy 970600)."
            - "A 20 x 10000 EUR position, then one SETTLED BUY of 3 x 10000 (gross 30909, commission 1082, total charge 29827) taking the position to 23 notes."
            - "One SUBMITTED NoteAssessment quarantining 3 x 10000 with defect_type DAMAGED."
