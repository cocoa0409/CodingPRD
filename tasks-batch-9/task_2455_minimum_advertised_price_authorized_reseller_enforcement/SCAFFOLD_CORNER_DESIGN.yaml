              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "Acme Store", listing_url: "https://mkt.example/l/high", listed_price_cents: 15500, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", matched_reseller_id: "${res}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obshigh: $.data.id }
          trigger:
            - call: "POST /price-observations/${obshigh}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
