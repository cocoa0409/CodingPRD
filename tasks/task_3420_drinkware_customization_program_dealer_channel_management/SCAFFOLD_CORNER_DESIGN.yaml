        distinguishing_aspect: "Once the clock passes window_end the slot reads CLOSED without any explicit transition, and reserve-slot against it fails ERR_SLOT_NOT_OPEN — the state moved under existing references."
        test_recipe:
          setup:
            - "Clock set; canonical line/drop/slot; order submitted but NOT yet reserved. Slot window ends 2026-09-14T12:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - *c_slot
            - *c_order
            - *c_submit
          trigger:
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
