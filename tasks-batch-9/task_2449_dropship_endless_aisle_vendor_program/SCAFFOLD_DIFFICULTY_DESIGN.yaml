- rule_id: cross_entity_state_dependency
  instances:
  - name: item_activation_blocked_until_the_owning_vendor_reaches_active
    grounds:
    - state_machines.DropshipItem.DRAFT_to_ACTIVE
    - state_machines.Vendor.CERTIFIED_to_ACTIVE
    - validations[priority=26]
    - errors[ERR_VENDOR_NOT_ACTIVE]
    - endpoints[POST /dropship/items/{id}/activate]
    distinguishing_aspect: 'The blocked entity is DropshipItem and the gating entity is its parent Vendor: an offer
      may be drafted against a merely CERTIFIED vendor but cannot be published to the endless aisle until the vendor
      itself is ACTIVE. Coverage already exists, so nothing about the item is wrong - only the parent''s state -
      and the same call flips from 409 to 200 the instant the parent transitions.'
