# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Employment-Based Immigration (PERM/LCA & H-1B) — Expert
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: lca_required_wage_provisional_vs_final
        grounds:
          - calculations.required_wage
          - entities.LCA.fields.required_wage_cents
          - state_machines.LCA.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          Provisional required_wage_cents tracks the LCA's live prevailing_wage_cents
          (11000000 at creation), while the final variant freezes at the value in
          effect at certification (13000000 after a DRAFT edit) — same LCA, two
          approaches diverge. Domain = LCA wage.
        test_recipe:
          setup:
            - "Employer exists; a DRAFT LCA with prevailing_wage_cents=10000000 and offered_wage_cents=11000000 (provisional required_wage_cents=11000000)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "111111111", legal_name: "Acme Corp", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 11000000, prevailing_wage_cents: 10000000, validity_start: "2026-06-01T00:00:00Z", validity_end: "2027-06-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { lca_id: $.data.id, prov0: $.data.required_wage_cents }
          trigger:
            - call: "PATCH /lcas/${lca_id}"
              payload: { prevailing_wage_cents: 13000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { prov1: $.data.required_wage_cents }
            - call: "POST /lcas/${lca_id}/transitions"
              payload: { to_status: "CERTIFIED" }
              as: DOLAnalyst
              captures: { final_req: $.data.required_wage_cents }
          assert:
            - "prov0 == 11000000 (provisional at creation uses prevailing 10000000, max with offered 11000000)"
            - "prov1 == 13000000 (provisional recomputed after PATCH raised prevailing to 13000000)"
            - "LCA.${lca_id}.required_wage_cents == 13000000 (final locked at certification)"
            - "prov0 != LCA.${lca_id}.required_wage_cents (provisional 11000000 diverges from final 13000000)"

      - name: i140_priority_date_perm_based_vs_self_petition
        grounds:
          - calculations.priority_date
          - entities.I140Petition.fields.priority_date
          - state_machines.I140Petition.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          A PERM-based EB2 I-140 inherits PermCase.priority_date (2026-07-10), while an
          EB1 self-petition uses its own filed_date (2026-08-01); for the identical I-140
          filing instant the two variants resolve to different priority dates. Domain =
          I-140 immigrant petition.
        test_recipe:
          setup:
            - "A PermCase is CERTIFIED with priority_date 2026-07-10 (filed at that clock)."
            - "One EB2 I-140 references that PermCase; one EB1 I-140 has no PermCase; both submitted at clock 2026-08-01."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "222222222", legal_name: "Beta LLC", employee_count: 12 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /beneficiaries"
              payload: { full_name: "Jane Doe", passport_number: "P-AAA-1" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { ben_id: $.data.id }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id }
            - call: "POST /prevailing-wage-determinations/${pwd_id}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v}" }
              as: DOLAnalyst
            - call: "POST /perm-cases"
              payload: { employer_id: "${emp_id}", pwd_id: "${pwd_id}", job_title: "SWE", offered_wage_cents: 12000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "RECRUITING" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /recruitment-steps"
              payload: { perm_case_id: "${pc_id}", step_type: "JOB_ORDER", start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-31T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /recruitment-steps"
              payload: { perm_case_id: "${pc_id}", step_type: "NEWSPAPER_AD", start_date: "2026-05-04T00:00:00Z", end_date: "2026-05-04T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /recruitment-steps"
              payload: { perm_case_id: "${pc_id}", step_type: "NEWSPAPER_AD", start_date: "2026-05-11T00:00:00Z", end_date: "2026-05-11T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "QUIET_PERIOD" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "FILED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "CERTIFIED" }
              as: DOLAnalyst
            - call: "POST /i140-petitions"
              payload: { employer_id: "${emp_id}", beneficiary_id: "${ben_id}", category: "EB2", perm_case_id: "${pc_id}" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { i140_perm: $.data.id }
            - call: "POST /i140-petitions"
              payload: { employer_id: "${emp_id}", beneficiary_id: "${ben_id}", category: "EB1" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { i140_self: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /i140-petitions/${i140_perm}/transitions"
              payload: { to_status: "SUBMITTED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pd_perm: $.data.priority_date }
            - call: "POST /i140-petitions/${i140_self}/transitions"
              payload: { to_status: "SUBMITTED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pd_self: $.data.priority_date }
          assert:
            - "I140Petition.${i140_perm}.priority_date == 2026-07-10T00:00:00Z (inherited PERM filed_date)"
            - "I140Petition.${i140_self}.priority_date == 2026-08-01T00:00:00Z (own filed_date)"
            - "pd_perm != pd_self despite identical filing instant"

  - rule_id: combinatorial_formula
    instances:
      - name: h1b_filing_fee_tiered_conditional
        grounds:
          - calculations.h1b_filing_fee
          - entities.H1BPetition.fields.filing_fee_cents
          - entities.Employer.fields.employee_count
        distinguishing_aspect: |
          Mode (a): non-linear fee over >=3 inputs (employee_count tiered at 25 and 50,
          h1b_dependent, is_amended) via nested conditionals. employee_count=60,
          h1b_dependent=true, not amended => 46000+50000+150000+400000 = 646000.
        test_recipe:
          setup:
            - "Employer with employee_count=60, h1b_dependent=true; an LCA, cap program, beneficiary and registration exist so the petition FKs resolve."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "333333333", legal_name: "Mega Inc", employee_count: 60, h1b_dependent: true }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ravi Kumar", passport_number: "P-BBB-1" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { ben_id: $.data.id }
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2028-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { lca_id: $.data.id }
            - call: "POST /cap-programs"
              payload: { fiscal_year: 2027, selection_quota: 5 }
              as: USCISOfficer
              captures: { cap_id: $.data.id }
            - call: "POST /h1b-registrations"
              payload: { employer_id: "${emp_id}", beneficiary_id: "${ben_id}", fiscal_year: 2027 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /h1b-petitions"
              payload: { employer_id: "${emp_id}", lca_id: "${lca_id}", beneficiary_id: "${ben_id}", registration_id: "${reg_id}", worksite_area: "AREA_A", employment_start: "2026-10-01T00:00:00Z", employment_end: "2029-10-01T00:00:00Z", is_amended: false }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pet_id: $.data.id, fee: $.data.filing_fee_cents }
          assert:
            - "H1BPetition.${pet_id}.filing_fee_cents == 646000"

      - name: lca_aggregate_wage_rounding_order
        grounds:
          - calculations.aggregate_wage_obligation
          - entities.LCA.fields.aggregate_wage_obligation_cents
        distinguishing_aspect: |
          Mode (b): round-per-worksite-then-sum is pinned. Two areas at 10000002 cents,
          hours_per_week=30 => per area round_half_up(10000002*30/40)=round(7500001.5)=7500002;
          sum=15000004. Sum-then-round would give 15000003. Different mode from the tiered fee.
        test_recipe:
          setup:
            - "Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "444444444", legal_name: "Gamma Co", employee_count: 8 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A", "AREA_B"], area_wage_map: { AREA_A: 10000002, AREA_B: 10000002 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000002, hours_per_week: 30, validity_start: "2026-05-01T00:00:00Z", validity_end: "2028-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { lca_id: $.data.id, agg: $.data.aggregate_wage_obligation_cents }
          assert:
            - "LCA.${lca_id}.aggregate_wage_obligation_cents == 15000004 (7500002 + 7500002, round per area then sum)"

  - rule_id: non_linear_state_machine
    instances:
      - name: h1b_petition_rfe_cycle
        grounds:
          - state_machines.H1BPetition.SUBMITTED_to_RFE_ISSUED
          - state_machines.H1BPetition.RFE_ISSUED_to_SUBMITTED
        distinguishing_aspect: |
          H1BPetition revisits SUBMITTED after RFE_ISSUED (cycle) and a second RFE can be
          issued, so the machine re-enters RFE_ISSUED — non-linear on H1BPetition.
        test_recipe:
          setup:
            - "A SUBMITTED H1B petition exists (LCA CERTIFIED, registration SELECTED, worksite covered)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "555555555", legal_name: "Delta Inc", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Li Wei", passport_number: "P-CCC-1" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { ben_id: $.data.id }
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2028-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { lca_id: $.data.id }
            - call: "POST /lcas/${lca_id}/transitions"
              payload: { to_status: "CERTIFIED" }
              as: DOLAnalyst
            - call: "POST /cap-programs"
              payload: { fiscal_year: 2027, selection_quota: 5 }
              as: USCISOfficer
              captures: { cap_id: $.data.id }
            - call: "POST /h1b-registrations"
              payload: { employer_id: "${emp_id}", beneficiary_id: "${ben_id}", fiscal_year: 2027 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /cap-programs/${cap_id}/run-lottery"
              as: USCISOfficer
            - call: "POST /h1b-petitions"
              payload: { employer_id: "${emp_id}", lca_id: "${lca_id}", beneficiary_id: "${ben_id}", registration_id: "${reg_id}", worksite_area: "AREA_A", employment_start: "2026-10-01T00:00:00Z", employment_end: "2029-10-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /h1b-petitions/${pet_id}/transitions"
              payload: { to_status: "SUBMITTED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /h1b-petitions/${pet_id}/transitions"
              payload: { to_status: "RFE_ISSUED" }
              as: USCISOfficer
            - call: "POST /h1b-petitions/${pet_id}/transitions"
              payload: { to_status: "SUBMITTED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { st_after_respond: $.data.status, rfe_after_respond: $.data.rfe_status }
            - call: "POST /h1b-petitions/${pet_id}/transitions"
              payload: { to_status: "RFE_ISSUED" }
              as: USCISOfficer
              captures: { st_second_rfe: $.data.status }
          assert:
            - "st_after_respond == SUBMITTED (petition returned to SUBMITTED after RFE response)"
            - "rfe_after_respond == RESPONDED"
            - "st_second_rfe == RFE_ISSUED (state re-entered, proving the cycle)"

      - name: perm_case_audit_cycle
        grounds:
          - state_machines.PermCase.FILED_to_AUDIT
          - state_machines.PermCase.AUDIT_to_FILED
        distinguishing_aspect: |
          PermCase revisits FILED after AUDIT (audit-response cycle) and a second AUDIT can
          be opened — non-linear on a different entity than H1BPetition.
        test_recipe:
          setup:
            - "A PermCase is FILED (recruitment >=30d, quiet period elapsed, within 180d)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "666666666", legal_name: "Epsilon Co", employee_count: 15 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id }
            - call: "POST /prevailing-wage-determinations/${pwd_id}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v}" }
              as: DOLAnalyst
            - call: "POST /perm-cases"
              payload: { employer_id: "${emp_id}", pwd_id: "${pwd_id}", job_title: "SWE", offered_wage_cents: 12000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "RECRUITING" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /recruitment-steps"
              payload: { perm_case_id: "${pc_id}", step_type: "JOB_ORDER", start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-31T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /recruitment-steps"
              payload: { perm_case_id: "${pc_id}", step_type: "NEWSPAPER_AD", start_date: "2026-05-04T00:00:00Z", end_date: "2026-05-04T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /recruitment-steps"
              payload: { perm_case_id: "${pc_id}", step_type: "NEWSPAPER_AD", start_date: "2026-05-11T00:00:00Z", end_date: "2026-05-11T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "QUIET_PERIOD" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "FILED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "AUDIT" }
              as: DOLAnalyst
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "FILED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { st_after_respond: $.data.status }
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "AUDIT" }
              as: DOLAnalyst
              captures: { st_second_audit: $.data.status }
          assert:
            - "st_after_respond == FILED (returned to FILED after audit response)"
            - "st_second_audit == AUDIT (state re-entered, proving the cycle)"

  - rule_id: transitive_cascade
    instances:
      - name: pwd_supersede_reverts_perm_and_voids_steps
        grounds:
          - state_machines.PrevailingWageDetermination.ISSUED_to_SUPERSEDED
          - state_machines.PermCase.RECRUITING_to_DRAFT
          - state_machines.RecruitmentStep.ACTIVE_to_VOID
        distinguishing_aspect: |
          Depth-3 chain: issuing a superseding PWD (link0) transitions the prior PWD to
          SUPERSEDED, which reverts the dependent RECRUITING PermCase to DRAFT (link1),
          which voids that case's ACTIVE RecruitmentSteps (link2). Originates from PWD issuance.
        test_recipe:
          setup:
            - "PWD_A ISSUED; a PermCase referencing PWD_A is RECRUITING with one ACTIVE JOB_ORDER step; PWD_B (same employer/soc/area) is PENDING."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "777777777", legal_name: "Zeta Co", employee_count: 20 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_a: $.data.id }
            - call: "POST /prevailing-wage-determinations/${pwd_a}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v0}" }
              as: DOLAnalyst
            - call: "GET /employers/${emp_id}"
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { emp_v1: $.data.version }
            - call: "POST /perm-cases"
              payload: { employer_id: "${emp_id}", pwd_id: "${pwd_a}", job_title: "SWE", offered_wage_cents: 12000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "RECRUITING" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /recruitment-steps"
              payload: { perm_case_id: "${pc_id}", step_type: "JOB_ORDER", start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-31T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 11000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_b: $.data.id }
          trigger:
            - call: "POST /prevailing-wage-determinations/${pwd_b}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v1}" }
              as: DOLAnalyst
          assert:
            - "PrevailingWageDetermination.${pwd_a}.status == SUPERSEDED"
            - "PermCase.${pc_id}.status == DRAFT"
            - "RecruitmentStep.${rs_id}.status == VOID"

      - name: perm_deny_cascades_i140_deny
        grounds:
          - state_machines.PermCase.FILED_to_DENIED
          - state_machines.I140Petition.DRAFT_to_DENIED
