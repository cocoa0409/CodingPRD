  - rule_id: boundary_precision_check
    instances:
      - name: min_experience_months_boundary_47_then_48
        grounds:
          - validations[priority=32]
          - calculations.experience_credit_evaluation
          - state_machines.ExperienceRecord.UNVERIFIED_to_PENDING_VERIFICATION
          - state_machines.Application.UNDER_REVIEW_to_EXAM_APPROVED
          - errors.ERR_EXPERIENCE_INSUFFICIENT
        distinguishing_aspect: |
          The MIN_EXPERIENCE_MONTHS (48) floor is probed from BOTH sides inside one test, and the month
          count itself is off-by-one bait: 2019-02..2022-12 is 47 months under the pinned closed-inclusive
          convention but 46 under an exclusive end and 48 under a "count both endpoint months plus the gap"
          reading. The same request is then re-issued after a single extra month of credit lands, so the
          only difference between the 422 and the 201 is one month at the exact threshold.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Tomas Elder' (applicant) and Engineer 'Iris Bekele' (supervisor, ACTIVE licence issued 2026-01-15) exist."
            - "Tomas's STANDARD_EXAM application has EABET_ACCREDITED education and one ExperienceRecord: RESPONSIBLE_CHARGE, post-degree, 2019-02..2022-12 — exactly 47 closed-inclusive months, one short of the floor."
            - "30000 cents were paid up front (above the 27500-cent one-record assessment) so the fee gate never re-fires when a second record is added."
            - "The record's DIRECT_SUPERVISOR reference has been ACCEPTED and credit determination has run, so verified_experience_months is 47 and credit_determined_by_user_id is set."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Tomas Elder", email: "tomas.elder@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_tomas: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Iris Bekele", email: "iris.bekele@pe.test", home_jurisdiction: "OR" }
