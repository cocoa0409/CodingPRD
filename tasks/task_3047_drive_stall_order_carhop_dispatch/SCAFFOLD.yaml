# =============================================================================
# PRD Benchmark Seed Tables — Drive-In Stall Order & Carhop Dispatch
# task_3047_drive_stall_order_carhop_dispatch
# =============================================================================

scenario: |
  Drive-In Stall Order & Carhop Dispatch (Sonic Drive-In): stall-based ordering
  with per-stall intercom or app-initiated check-in, order sequencing that must
  match carhop delivery routing rather than a single window queue, carhop
  assignment, tray loading and tip handling with per-order timing metrics,
  patio and drive-thru lane coexistence with different service targets,
  weather-driven volume swings and stall availability management, extensive
  drink and slush customization with combination pricing, happy-hour and
  app-only offer enforcement by stall check-in, stall equipment fault
  reporting and manual fallback.

domain_name: drive-in-stall-order-carhop-dispatch
api_prefix: /locations

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique store code, e.g. 'OKC-114'" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: timezone, type: string, source: input, description: "IANA timezone for offer window evaluation, e.g. 'America/Chicago'" }
      - { name: weather_mode, type: enum, source: system, default: "NORMAL", description: "NORMAL | HEAT_ADVISORY | STORM. Drives stall closures and service-target profile. Set via POST /locations/{id}/weather" }
      - { name: stall_capacity, type: integer, source: input, description: "Total physical stalls at the location; > 0" }
      - { name: stalls_available, type: integer, source: computed, description: "= stall_capacity - count(Stall where status IN {OCCUPIED, OUT_OF_SERVICE})" }
      - { name: lane_posture, type: enum, source: computed, description: "OPEN | CONGESTED | CURBSIDE_ONLY. Derived: CURBSIDE_ONLY if stalls_available == 0 or weather_mode == STORM; else CONGESTED if stalls_available <= ceil(stall_capacity * 0.20); else OPEN" }
      - { name: rush_index, type: integer, source: system, default: 0, description: "Monotone counter advanced by POST /locations/{id}/advance_rush; gates stall-request expiry and carhop SLA evaluation" }

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique SKU" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "FOOD | DRINK | SLUSH | DESSERT | ADDIN" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price in cents; >= 0" }
      - { name: size_scheme, type: enum, source: input, default: "NONE", description: "NONE | DRINK_SIZES. DRINK_SIZES enables size upcharge tiers for DRINK/SLUSH items" }
      - { name: half_price_eligible, type: boolean, source: input, default: false, description: "Whether this item participates in happy-hour half-price drinks/slushes" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED. RETIRED items cannot be added to new orders but remain on historical orders" }

  - name: CustomizationOption
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique option code, e.g. 'CHERRY', 'XL'" }
      - { name: applies_to_category, type: enum, source: input, description: "DRINK | SLUSH | ANY" }
      - { name: price_cents, type: integer, source: input, description: "Flat add-in price in cents; >= 0" }
      - { name: is_size, type: boolean, source: input, default: false, description: "True for size options (S/M/L/XL); size options combine via size-upcharge rule instead of flat add" }
      - { name: size_upcharge_cents, type: integer, source: input, default: 0, description: "Upcharge when this size option is selected on a DRINK_SIZES item; only meaningful when is_size == true" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique login email" }
      - { name: display_name, type: string, source: input, description: "Display name" }
      - { name: app_user, type: boolean, source: system, default: true, description: "True for app-registered customers; app-only offers require app_user == true" }
      - { name: stored_tip_default_pct, type: number, source: input, default: 0, description: "Customer's default tip percent (0–0.50); used when an app order omits explicit tip" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Store credit balance; debited before card on payment, credited on manager comp" }

  - name: Stall
    parent: Location
    common_fields: true
    fields:
      - { name: location_id, type: string, source: system, description: "FK -> Location.id; owning location" }
      - { name: stall_number, type: integer, source: input, description: "Physical stall number within the location; unique per location" }
      - { name: kind, type: enum, source: input, description: "STALL | PATIO. PATIO stalls use patio service targets and are excluded from stall_capacity occupancy math for drive-in stalls" }
      - { name: intercom_functional, type: boolean, source: system, default: true, description: "False while any EquipmentFault on this stall is OPEN" }
      - { name: status, type: enum, source: system, default: "IDLE", description: "IDLE | OCCUPIED | OUT_OF_SERVICE" }
      - { name: current_order_id, type: string, source: system, description: "FK -> Order.id; the order currently occupying the stall, null when IDLE" }

  - name: Carhop
    parent: Location
    common_fields: true
    fields:
      - { name: location_id, type: string, source: system, description: "FK -> Location.id" }
      - { name: name, type: string, source: input, description: "Carhop display name" }
      - { name: zone, type: enum, source: input, description: "NORTH | SOUTH | PATIO. Dispatch eligibility filter" }
      - { name: on_shift, type: boolean, source: input, default: true, description: "Whether clocked in; off-shift carhops are not dispatch-eligible" }
      - { name: max_trays, type: integer, source: input, default: 3, description: "Max orders per DeliveryRun this carhop can carry" }
      - { name: active_run_load, type: integer, source: computed, default: 0, description: "Sum of order counts across this carhop's DeliveryRuns in LOADED state" }
      - { name: tips_outstanding_cents, type: integer, source: computed, default: 0, description: "Sum of tip_cents on TipRecords for this carhop in RECORDED state" }
      - { name: tips_settled_cents, type: integer, source: computed, default: 0, description: "Sum of tip_cents on TipRecords for this carhop in SETTLED state" }

  - name: Order
    parent: Location
    common_fields: true
    fields:
      - { name: location_id, type: string, source: system, description: "FK -> Location.id" }
      - { name: stall_id, type: string, source: system, description: "FK -> Stall.id; null for DRIVE_THRU orders" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; null allowed for intercom guest orders" }
      - { name: channel, type: enum, source: input, description: "STALL_INTERCOM | APP_CHECKIN | DRIVE_THRU | PATIO" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Fulfillment axis: DRAFT -> PLACED -> PREPARING -> READY -> OUT_FOR_DELIVERY -> DELIVERED; also CANCELLED. See state machine" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "Payment axis, independent of fulfillment: UNPAID | AUTHORIZED | CAPTURED | VOIDED | REFUNDED" }
      - { name: checked_in_at, type: datetime, source: system, description: "Timestamp of stall check-in (intercom initiation or app check-in); null until check-in" }
      - { name: placed_at, type: datetime, source: system, description: "Timestamp of PLACED transition; null until placed" }
      - { name: ready_at, type: datetime, source: system, description: "Timestamp of READY transition; null until ready" }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp of DELIVERED transition; null until delivered" }
      - { name: service_target_seconds, type: integer, source: computed, description: "Target checkout-to-delivery seconds, snapshotted at PLACED from the location's active service-target profile for this channel and weather_mode" }
      - { name: late_flag, type: boolean, source: computed, default: false, description: "Set at DELIVERED: (delivered_at - placed_at) > service_target_seconds. Strictly greater; equal is on time" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of order-line extended prices after combination pricing, before offers and tip" }
      - { name: offer_discount_cents, type: integer, source: computed, default: 0, description: "Total discount from applied offers and happy-hour pricing" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Tax computed on (subtotal_cents - offer_discount_cents), rounded half-up per order" }
      - { name: tip_cents, type: integer, source: computed, default: 0, description: "Tip applied to the order (explicit or default); recorded on capture" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "= subtotal_cents - offer_discount_cents + tax_cents" }
      - { name: total_tendered_cents, type: integer, source: computed, default: 0, description: "= total_cents + tip_cents; amount actually captured" }
      - { name: delivery_run_id, type: string, source: system, description: "FK -> DeliveryRun.id; set when staged onto a tray run, null otherwise" }
      - { name: run_position, type: integer, source: system, description: "1-based position within the DeliveryRun route; null when not staged" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id" }
      - { name: quantity, type: integer, source: input, description: ">= 1" }
      - { name: size_option_code, type: string, source: input, description: "CustomizationOption.code of a size option; required iff the menu item has size_scheme == DRINK_SIZES" }
      - { name: addin_option_codes, type: array, source: input, default: [], description: "List of CustomizationOption.code for non-size add-ins; each must be ACTIVE and applicable to the item's category" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-unit price after size upcharge and add-ins, before combination pricing" }
      - { name: extended_price_cents, type: integer, source: computed, description: "= unit_price_cents * quantity, then adjusted by combination pricing (BOGO-half on eligible pairs); rounding pinned in calculations.order_pricing" }
      - { name: happy_hour_priced, type: boolean, source: computed, default: false, description: "True if this line received happy-hour half pricing at PLACED time" }

  - name: Offer
    parent: Location
    common_fields: true
    fields:
      - { name: location_id, type: string, source: system, description: "FK -> Location.id" }
      - { name: code, type: string, source: input, description: "Unique offer code per location" }
      - { name: kind, type: enum, source: input, description: "HAPPY_HOUR | APP_ONLY | PROMO" }
      - { name: discount_type, type: enum, source: input, description: "HALF_PRICE_DRINKS | PERCENT_OFF_ORDER | FIXED_OFF_CENTS" }
      - { name: discount_value, type: integer, source: input, description: "Percent (1–90) for PERCENT_OFF_ORDER, cents for FIXED_OFF_CENTS; ignored for HALF_PRICE_DRINKS" }
      - { name: window_start_local, type: string, source: input, description: "HH:MM local start of daily window, inclusive" }
      - { name: window_end_local, type: string, source: input, description: "HH:MM local end of daily window, exclusive; end == start means all-day" }
      - { name: app_only, type: boolean, source: input, default: false, description: "True: offer only applies to APP_CHECKIN orders placed by app_user customers" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DISABLED" }

  - name: DeliveryRun
    parent: Location
    common_fields: true
    fields:
      - { name: location_id, type: string, source: system, description: "FK -> Location.id" }
      - { name: carhop_id, type: string, source: system, description: "FK -> Carhop.id; assigned by the dispatch selector at stage time" }
      - { name: status, type: enum, source: system, default: "LOADED", description: "LOADED -> OUT -> COMPLETED; also VOIDED (orders bumped back to READY)" }
      - { name: order_count, type: integer, source: computed, default: 0, description: "Number of orders currently on the run" }
      - { name: staged_at, type: datetime, source: system, description: "When the run was created" }
      - { name: out_at, type: datetime, source: system, description: "When the run departed; null until OUT" }
      - { name: route_note, type: string, source: input, description: "Optional dispatcher note" }

  - name: TipRecord
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: carhop_id, type: string, source: system, description: "FK -> Carhop.id; the carhop who ran the order (from the delivery run), null for DRIVE_THRU window handoff" }
      - { name: tip_cents, type: integer, source: computed, description: "Tip amount; snapshot of Order.tip_cents at capture, adjusted on settle" }
      - { name: status, type: enum, source: system, default: "RECORDED", description: "RECORDED -> SETTLED; also VOIDED if the order payment is voided" }
      - { name: adjusted_tip_cents, type: integer, source: input, description: "Post-delivery tip adjustment; only settable while RECORDED via settle" }

  - name: EquipmentFault
    parent: Stall
    common_fields: true
    fields:
      - { name: stall_id, type: string, source: system, description: "FK -> Stall.id" }
      - { name: reported_by_role, type: enum, source: input, description: "CARHOP | SHIFT_MANAGER" }
      - { name: kind, type: enum, source: input, description: "INTERCOM_DEAD | PAYMENT_TERMINAL_DEAD | MENU_BOARD_DEAD" }
      - { name: note, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> RESOLVED" }

  - name: ServiceTargetProfile
    parent: Location
    common_fields: true
    fields:
      - { name: location_id, type: string, source: system, description: "FK -> Location.id" }
      - { name: channel, type: enum, source: input, description: "STALL_INTERCOM | APP_CHECKIN | DRIVE_THRU | PATIO" }
      - { name: weather_mode, type: enum, source: input, description: "NORMAL | HEAT_ADVISORY | STORM; the profile applies while the location is in this mode" }
      - { name: target_seconds, type: integer, source: input, description: "Checkout-to-delivery target for this (channel, weather_mode) pair; > 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED. At most one ACTIVE profile per (location, channel, weather_mode)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    note: "Two parallel axes on one row: fulfillment status and payment_status evolve independently. Deliver requires payment_status == CAPTURED; cancel requires payment_status != CAPTURED (captured orders must be refunded instead)."
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /locations/{locationId}/orders/{orderId}/place"
        actor: Customer | ShiftManager
        preconditions:
          - "Order has >= 1 OrderLine (ERR_EMPTY_ORDER)"
          - "Every line's MenuItem.status == ACTIVE at place time (ERR_MENU_ITEM_RETIRED)"
          - "For STALL_INTERCOM / APP_CHECKIN / PATIO: Stall.status == OCCUPIED and Stall.current_order_id == this order (ERR_STALL_NOT_OCCUPIED_BY_ORDER)"
          - "For STALL_INTERCOM: Stall.intercom_functional == true, OR an OPEN EquipmentFault of kind INTERCOM_DEAD exists on the stall and request carries fallback_confirmed == true (manual fallback) (ERR_INTERCOM_UNAVAILABLE)"
          - "Location.lane_posture != CURBSIDE_ONLY for channel == STALL_INTERCOM (ERR_LANE_CLOSED); CURBSIDE_ONLY locations accept APP_CHECKIN and DRIVE_THRU only"
          - "Happy-hour and offer evaluation pinned to checked_in_at (see calculations.offer_application)"
        side_effects:
          - "placed_at = now; service_target_seconds snapshotted from ServiceTargetProfile matching (channel, location.weather_mode) with status ACTIVE (ERR_NO_SERVICE_TARGET if none)"
          - "Happy-hour repricing applied to eligible lines; offer_discount_cents computed and frozen"
          - "Order pricing cascade recomputes subtotal_cents, tax_cents, total_cents"
      - from: PLACED
        to: PREPARING
        trigger: "POST /locations/{locationId}/orders/{orderId}/start_preparation"
        actor: KitchenStaff | ShiftManager
        preconditions:
          - "Location rush admits preparation: count of orders in PREPARING at this location < 8 (ERR_KITCHEN_SATURATED)"
        side_effects: []
      - from: PREPARING
        to: READY
        trigger: "POST /locations/{locationId}/orders/{orderId}/mark_ready"
        actor: KitchenStaff | ShiftManager
        preconditions: []
        side_effects:
          - "ready_at = now"
      - from: READY
        to: OUT_FOR_DELIVERY
        trigger: "POST /locations/{locationId}/delivery-runs/{runId}/depart (when this order is on the run)"
        actor: Carhop | ShiftManager
        preconditions:
          - "Order.delivery_run_id == runId and the run transitions LOADED -> OUT"
        side_effects:
          - "Runs depart in run_position order tracked on the run; no per-order state until DELIVERED"
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /locations/{locationId}/delivery-runs/{runId}/orders/{orderId}/deliver"
        actor: Carhop | ShiftManager
        preconditions:
          - "Order.payment_status == CAPTURED (ERR_PAYMENT_NOT_CAPTURED)"
          - "Order must be delivered in ascending run_position within the run: every order on the same run with a smaller run_position must already be DELIVERED or CANCELLED (ERR_RUN_SEQUENCE_VIOLATION)"
        side_effects:
          - "delivered_at = now; late_flag = (delivered_at - placed_at) > service_target_seconds"
          - "Stall.current_order_id cleared and Stall.status -> IDLE when this order is the stall's current order (channel STALL_INTERCOM / APP_CHECKIN / PATIO)"
          - "Location.stalls_available recomputed; lane_posture recomputed"
          - "When all orders on the run are DELIVERED or CANCELLED: DeliveryRun -> COMPLETED and Carhop.active_run_load decremented"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /locations/{locationId}/orders/{orderId}/cancel"
        actor: Customer | ShiftManager
        preconditions: []
        side_effects:
          - "If the order occupies a stall (Stall.current_order_id == order): stall -> IDLE, stalls_available recomputed"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /locations/{locationId}/orders/{orderId}/cancel"
        actor: ShiftManager
        preconditions:
          - "Order.payment_status IN {UNPAID, AUTHORIZED, VOIDED} (ERR_PAYMENT_CAPTURED_REQUIRES_REFUND)"
        side_effects:
          - "If AUTHORIZED: payment_status -> VOIDED"
          - "If the order occupies a stall: stall -> IDLE, stalls_available recomputed"
      - from: PREPARING
        to: CANCELLED
        trigger: "POST /locations/{locationId}/orders/{orderId}/cancel"
        actor: ShiftManager
        preconditions:
          - "Order.payment_status IN {UNPAID, AUTHORIZED, VOIDED}"
        side_effects:
          - "If AUTHORIZED: payment_status -> VOIDED"
          - "If the order occupies a stall: stall -> IDLE, stalls_available recomputed"
      - from: READY
        to: CANCELLED
        trigger: "POST /locations/{locationId}/orders/{orderId}/cancel"
        actor: ShiftManager
        preconditions:
          - "Order.payment_status IN {UNPAID, AUTHORIZED, VOIDED}"
        side_effects:
          - "If AUTHORIZED: payment_status -> VOIDED"
          - "If the order occupies a stall: stall -> IDLE, stalls_available recomputed"

  - entity: OrderPaymentAxis
    initial_state: UNPAID
    terminal_states: [CAPTURED, VOIDED, REFUNDED]
    note: "Parallel dimension on Order (payment_status field). Transitions listed separately for clarity."
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /locations/{locationId}/orders/{orderId}/authorize_payment"
        actor: Customer | ShiftManager
        preconditions:
          - "Order.status IN {DRAFT, PLACED, PREPARING, READY} (ERR_INVALID_STATE)"
        side_effects: []
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /locations/{locationId}/orders/{orderId}/capture_payment"
        actor: Customer | Carhop | ShiftManager
        preconditions: []
        side_effects:
          - "tip_cents resolved: explicit tip_cents in the request body wins; else Customer.stored_tip_default_pct * total_cents rounded half-up; wallet_credit_cents debited first for the (total_cents + tip_cents) tender"
          - "total_tendered_cents = total_cents + tip_cents"
          - "TipRecord created in RECORDED state with carhop_id = the delivering run's carhop if known, else null"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /locations/{locationId}/orders/{orderId}/cancel (cascade from PLACED/PREPARING/READY cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /locations/{locationId}/orders/{orderId}/refund"
        actor: ShiftManager
        preconditions:
          - "Order.status == DELIVERED or (Order.status != DELIVERED and refund carries manager_override == true)"
        side_effects:
          - "TipRecord -> VOIDED; Carhop.tips_outstanding_cents decremented by tip_cents"
          - "Customer.wallet_credit_cents credited by total_cents (not tip) when refund_mode == STORE_CREDIT"

  - entity: Stall
    initial_state: IDLE
    terminal_states: []
    note: "Cyclic: IDLE -> OCCUPIED -> IDLE on check-in/departure; OUT_OF_SERVICE loop on faults and weather."
    transitions:
      - from: IDLE
        to: OCCUPIED
        trigger: "POST /locations/{locationId}/stalls/{stallId}/checkin (intercom) or POST /locations/{locationId}/stalls/{stallId}/app-checkin (app)"
        actor: Customer | ShiftManager
        preconditions:
          - "Stall.status == IDLE (ERR_STALL_OCCUPIED)"
          - "Location.lane_posture != CURBSIDE_ONLY for intercom check-in (ERR_LANE_CLOSED)"
          - "app-checkin requires the customer to exist and app_user == true (ERR_APP_ONLY)"
          - "Weather rule: HEAT_ADVISORY closes every PATIO stall to new check-ins (ERR_STALL_WEATHER_CLOSED); STORM closes all stalls to intercom check-in"
        side_effects:
          - "A DRAFT Order is created bound to the stall (channel STALL_INTERCOM or APP_CHECKIN / PATIO by stall kind), checked_in_at = now, Stall.current_order_id set"
          - "Location.stalls_available recomputed; lane_posture recomputed"
      - from: OCCUPIED
        to: IDLE
        trigger: "system cascade from Order DELIVERED or CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "current_order_id cleared; Location.stalls_available recomputed"
      - from: IDLE
        to: OUT_OF_SERVICE
        trigger: "POST /locations/{locationId}/stalls/{stallId}/faults with kind MENU_BOARD_DEAD, or POST /locations/{locationId}/stalls/{stallId}/set_out_of_service"
        actor: Carhop | ShiftManager
        preconditions: []
        side_effects:
          - "Location.stalls_available recomputed; lane_posture recomputed"
      - from: OCCUPIED
        to: OUT_OF_SERVICE
        trigger: "POST /locations/{locationId}/stalls/{stallId}/set_out_of_service"
        actor: ShiftManager
        preconditions:
          - "The occupying order is CANCELLED in the same request (force_cancel == true required, ERR_STALL_OCCUPIED otherwise)"
        side_effects:
          - "Occupying order -> CANCELLED (with payment void cascade if AUTHORIZED)"
          - "Location.stalls_available recomputed"
      - from: OUT_OF_SERVICE
        to: IDLE
        trigger: "POST /locations/{locationId}/stalls/{stallId}/return_to_service"
        actor: ShiftManager
        preconditions:
          - "No OPEN EquipmentFault on the stall (ERR_FAULT_STILL_OPEN)"
        side_effects:
          - "intercom_functional = true; Location.stalls_available recomputed"

  - entity: DeliveryRun
    initial_state: LOADED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: LOADED
        to: OUT
        trigger: "POST /locations/{locationId}/delivery-runs/{runId}/depart"
        actor: Carhop | ShiftManager
        preconditions:
          - "The acting Carhop is the run's assigned carhop (ERR_NOT_ASSIGNED_CARHOP), unless actor is ShiftManager"
          - "order_count >= 1 (ERR_EMPTY_RUN)"
        side_effects:
          - "out_at = now"
          - "Every order on the run: status READY -> OUT_FOR_DELIVERY"
      - from: OUT
        to: COMPLETED
        trigger: "system (automatic when all orders on the run are DELIVERED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Carhop.active_run_load -= order_count"
      - from: LOADED
        to: VOIDED
        trigger: "POST /locations/{locationId}/delivery-runs/{runId}/void"
        actor: ShiftManager
        preconditions: []
        side_effects:
          - "Every order on the run: delivery_run_id and run_position cleared, remains READY"
          - "Carhop.active_run_load -= order_count"

  - entity: TipRecord
    initial_state: RECORDED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: RECORDED
        to: SETTLED
        trigger: "POST /locations/{locationId}/tip-records/{tipId}/settle"
        actor: ShiftManager
        preconditions:
          - "adjusted_tip_cents, if provided, must be >= 0"
        side_effects:
          - "If adjusted_tip_cents provided: tip_cents = adjusted_tip_cents"
          - "Carhop.tips_outstanding_cents -= tip_cents; Carhop.tips_settled_cents += tip_cents"
      - from: RECORDED
        to: VOIDED
        trigger: "system cascade from Order payment REFUNDED"
        actor: system
        preconditions: []
        side_effects:
          - "Carhop.tips_outstanding_cents -= tip_cents"

  - entity: EquipmentFault
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /locations/{locationId}/stalls/{stallId}/faults/{faultId}/resolve"
        actor: ShiftManager
        preconditions: []
        side_effects:
          - "If no other OPEN fault on the stall: Stall.intercom_functional = true"
          - "Fault creation side effect (reverse): when a fault is created OPEN, Stall.intercom_functional = false; kind MENU_BOARD_DEAD also forces Stall -> OUT_OF_SERVICE"

# =============================================================================
# Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: stall-checkin-stale-location
    parent_entity: Location
    write_endpoint: "POST /locations/{locationId}/stalls/{stallId}/checkin"
    occ_field: "expected_location_version"
    description: |
      A stall check-in whose caller's observed Location.version has advanced
      (e.g., because a weather change or another check-in mutated the location
      and its lane_posture) is rejected as stale; the caller must re-read the
      location before checking a customer in.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: run-stage-stale-carhop
    parent_entity: Carhop
    write_endpoint: "POST /locations/{locationId}/delivery-runs"
    occ_field: "expected_carhop_version"
    description: |
      Creating a DeliveryRun against a Carhop whose version has advanced since
      the dispatcher last read it (e.g., another run was just assigned and
      active_run_load changed) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    trigger: "Order line add/update/remove (DRAFT) and PLACED transition"
    algorithm: aggregation
    input_set: "All OrderLines of the order; each line's MenuItem and referenced CustomizationOptions"
    formula: |
      Per line:
        unit_price_cents = menu_item.base_price_cents
                         + (size_option.size_upcharge_cents if size_scheme == DRINK_SIZES else 0)
                         + sum(addin.price_cents for addin in addin_option_codes)
        extended_price_cents = unit_price_cents * quantity          # ROUND PER LINE
      Combination pricing (BOGO_HALF on drink/slush pairs):
        Eligible lines: lines whose menu_item.category IN {DRINK, SLUSH}.
        Pair the eligible units across ALL such lines in ascending
        unit_price_cents order (tie-break: OrderLine.created_at ASC); every
        second unit in each pair gets 50% off its unit price, rounded
        half-up to the cent. Apply as a per-line reduction folded into
        extended_price_cents.
      subtotal_cents = sum(extended_price_cents)
      ROUNDING ORDER (pinned): round per line first, then sum; the discount
      for each half-price unit is round_half_up(unit_price_cents * 0.5).
    constants:
      COMBO_HALF_PRICE_NUMERATOR: 1
      COMBO_HALF_PRICE_DENOMINATOR: 2
    precision: "integer cents, round_half_up at each pinned rounding point"
    variants:
      - name: pre_place_provisional
        when: "While Order.status == DRAFT (cart preview via GET)"
        difference: "No offer or happy-hour discounts applied; combination pricing applied; tax estimated as 0"
      - name: placed_final
        when: "On PLACED transition"
        difference: "Happy-hour repricing applied to eligible lines BEFORE offer computation; offers then applied on the repriced subtotal; tax computed last"

  - name: offer_application
    trigger: "PLACED transition, evaluated against checked_in_at converted to the location's timezone"
    algorithm: threshold
    input_set: "Offers of the location with status == ACTIVE; the order's lines repriced by happy hour"
    formula: |
      1. Happy hour: for each ACTIVE offer with kind == HAPPY_HOUR and
         discount_type == HALF_PRICE_DRINKS whose [window_start_local,
         window_end_local) contains the local time of checked_in_at
         (end == start means all-day; window may wrap midnight):
         every line with menu_item.half_price_eligible == true and
         category IN {DRINK, SLUSH} is repriced: unit_price_cents becomes
         round_half_up(unit_price_cents / 2); the line's
         happy_hour_priced = true and extended_price_cents recomputed.
      2. Offer selection: among remaining ACTIVE offers whose window contains
         checked_in_at (local) and (app_only == false OR (order.channel ==
         APP_CHECKIN AND customer.app_user == true)), and excluding
         HAPPY_HOUR kind (already applied): pick the offer producing the
         LARGEST discount:
           PERCENT_OFF_ORDER: round_half_up(subtotal_after_happy_hour * discount_value / 100)
           FIXED_OFF_CENTS:   min(discount_value, subtotal_after_happy_hour)
         Tie-break: smallest Offer.created_at; further tie-break is forbidden
         (created_at is unique per offer).
      3. offer_discount_cents = happy_hour_savings + selected_offer_discount.
         Only ONE non-happy-hour offer may apply per order (stacking
         forbidden); happy hour MAY stack with one offer.
    constants:
      HAPPY_HOUR_DIVISOR: 2
    precision: "integer cents, round_half_up"
    variants:
      - name: guest_intercom
        when: "channel == STALL_INTERCOM and customer_id is null"
        difference: "app_only offers excluded; happy hour still applies (it is window-based, not account-based)"

  - name: service_target_lookup
    trigger: "PLACED transition"
    algorithm: aggregation
    input_set: "ServiceTargetProfile rows of the location with status == ACTIVE"
    formula: |
      service_target_seconds = target_seconds of the ACTIVE profile matching
      (order.channel, location.weather_mode). If no exact weather_mode match,
      fall back to the ACTIVE profile for (channel, NORMAL). If neither
      exists: reject PLACE with ERR_NO_SERVICE_TARGET.
    variants:
      - name: weather_override
        when: "location.weather_mode != NORMAL at place time"
        difference: "Uses the weather-specific target (longer), not the NORMAL target; snapshot persists even if weather_mode later changes"

  - name: late_flag_evaluation
    trigger: "DELIVERED transition"
    algorithm: threshold
    formula: |
      elapsed = delivered_at - placed_at  (seconds)
      late_flag = (elapsed > service_target_seconds)   # STRICTLY greater;
      # elapsed == service_target_seconds is ON TIME
    precision: "whole seconds"

  - name: dispatch_selector
    trigger: "POST /locations/{locationId}/delivery-runs (staging a run)"
    algorithm: weighted_scoring
    input_set: "Carhops of the location; orders in READY state at the location"
    formula: |
      Order selection: candidate orders are status == READY, channel !=
      DRIVE_THRU (drive-thru hands off at the window, never on a tray run),
      delivery_run_id is null. Rank by placed_at ASC; tie-break by
      Order.created_at ASC. Take up to max_trays of the chosen carhop.
      Carhop selection: candidate carhops have on_shift == true AND
      (active_run_load + selected_order_count) <= max_trays AND
      zone matches the zone covering the majority of selected orders' stall
      kinds (PATIO orders -> zone PATIO; else NORTH/SOUTH by stall_number
      parity: even -> NORTH, odd -> SOUTH; mixed trays pick the zone of the
      earliest-placed order). Rank candidates by active_run_load ASC, then
      by Carhop.created_at ASC. Empty candidate set: ERR_NO_CARHOP_ELIGIBLE.
    variants: []

  - name: tip_resolution
    trigger: "capture_payment"
    algorithm: aggregation
    formula: |
      if request body provides tip_cents: tip = tip_cents
      elif customer_id is not null and customer.stored_tip_default_pct > 0:
        tip = round_half_up(total_cents * stored_tip_default_pct)
      else: tip = 0
      Tender: wallet_credit_cents debited first up to min(wallet, total+tip);
      remainder charged to card. On capture, wallet debit is immediate.
    precision: "integer cents, round_half_up"

  - name: timing_metrics_rollup
    trigger: "GET /locations/{locationId}/metrics"
    algorithm: aggregation
    input_set: "Orders of the location with status == DELIVERED, filtered by optional channel and placed_at range [from, to) query params"
    formula: |
      count_delivered, count_late = count(late_flag == true)
      avg_checkout_to_ready_seconds = mean(ready_at - placed_at) over delivered orders
      avg_ready_to_delivered_seconds = mean(delivered_at - ready_at)
      on_time_rate = (count_delivered - count_late) / count_delivered
      All means round_half_up to whole seconds. Empty set: count_delivered 0,
      means null, on_time_rate null.
    precision: "whole seconds, round_half_up; on_time_rate 4 decimal places"

  - name: stall_availability
    trigger: "Any Stall status change or weather_mode change"
    algorithm: aggregation
    formula: |
      stalls_available = stall_capacity - count(Stall where kind == STALL and status IN {OCCUPIED, OUT_OF_SERVICE})
      (PATIO stalls are excluded from drive-in stall math.)
      lane_posture:
        CURBSIDE_ONLY if stalls_available == 0 OR weather_mode == STORM
        CONGESTED     if stalls_available <= ceil(stall_capacity * 0.20)
        OPEN          otherwise
    constants:
      CONGESTION_FRACTION: 0.20

  - name: rush_admission
    trigger: "start_preparation; advance_rush"
    algorithm: threshold
    formula: |
      Preparing orders admitted per rush window: count of orders at the
      location with status == PREPARING must be < 8 at start_preparation,
      else ERR_KITCHEN_SATURATED (boundary: exactly 8 preparing rejects the
      9th; 7 admits the 8th). advance_rush increments rush_index and expires
      stall check-ins: any Order still DRAFT whose checked_in_at is older
      than 2 rush windows is CANCELLED (with stall release cascade).
    constants:
      MAX_PREPARING: 8
      DRAFT_EXPIRY_RUSH_WINDOWS: 2

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted on the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resources exist and are nested consistently (stall/fault/order/run/tip belong to the location in the path), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: business_referential
    check: "Body references exist: menu_item_id, customer_id, option codes, expected_*_version parents"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking body references"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "stall check-in; delivery-run create"
  - priority: 6
    category: state
    check: "Entity in a valid from-state for the requested transition (incl. terminal-state lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_safety
    check: "Weather/lane safety gates: CURBSIDE_ONLY blocks intercom check-in and STALL_INTERCOM place; HEAT_ADVISORY blocks PATIO check-in"
    error_id: ERR_LANE_CLOSED | ERR_STALL_WEATHER_CLOSED
    http_status: 409
    applies_to: "check-in, place"
  - priority: 8
    category: business_constraint
    check: "Stall occupancy: stall must be IDLE for check-in, or OCCUPIED-by-this-order for place; equipment fault gates (intercom fallback requires fallback_confirmed; return_to_service requires no OPEN faults)"
    error_id: ERR_STALL_OCCUPIED | ERR_STALL_NOT_OCCUPIED_BY_ORDER | ERR_INTERCOM_UNAVAILABLE | ERR_FAULT_STILL_OPEN
    http_status: 409
    applies_to: "check-in, app-checkin, place, return_to_service"
  - priority: 9
    category: business_constraint
    check: "Menu/catalog integrity: items ACTIVE, required size option present for DRINK_SIZES items, add-ins applicable to category, quantity >= 1"
    error_id: ERR_MENU_ITEM_RETIRED | ERR_SIZE_REQUIRED | ERR_OPTION_INVALID | ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "order line add/update, place"
  - priority: 10
    category: business_temporal
    check: "Offer windows evaluated against checked_in_at in location timezone; app_only offers require APP_CHECKIN + app_user"
    error_id: ERR_OFFER_NOT_APPLICABLE | ERR_APP_ONLY
    http_status: 409
    applies_to: "place (offer override), app-checkin"
  - priority: 11
    category: business_fiscal
    check: "Payment sequencing: capture requires AUTHORIZED; deliver requires CAPTURED; refund requires CAPTURED; cancel of CAPTURED order forbidden"
    error_id: ERR_PAYMENT_NOT_CAPTURED | ERR_PAYMENT_CAPTURED_REQUIRES_REFUND
    http_status: 409
    applies_to: "capture, deliver, refund, cancel"
  - priority: 12
    category: business_constraint
    check: "Dispatch constraints: run not empty, carhop eligible (zone, on_shift, max_trays), run-position delivery order"
    error_id: ERR_EMPTY_RUN | ERR_NO_CARHOP_ELIGIBLE | ERR_RUN_SEQUENCE_VIOLATION | ERR_NOT_ASSIGNED_CARHOP
    http_status: 409
    applies_to: "delivery-run create/depart/deliver"
  - priority: 13
    category: business_fiscal
    check: "Capacity: kitchen preparation cap (MAX_PREPARING), service target profile exists for channel"
    error_id: ERR_KITCHEN_SATURATED | ERR_NO_SERVICE_TARGET
    http_status: 409
    applies_to: "start_preparation, place"

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Location ---
  - method: POST
    path: "/locations"
    description: "Create a drive-in location"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, timezone, stall_capacity]
    output: Location
    side_effects: ["weather_mode=NORMAL, rush_index=0, stalls_available=stall_capacity, lane_posture=OPEN"]
  - method: GET
    path: "/locations/{locationId}"
    description: "Get a location with computed posture fields"
    roles: [PlatformAdmin, ShiftManager, Carhop, KitchenStaff, Customer]
    code: 200
    input: []
    output: Location
    side_effects: []
  - method: POST
    path: "/locations/{locationId}/weather"
    description: "Set weather mode; drives stall closures and lane posture"
    roles: [ShiftManager, PlatformAdmin]
    code: 200
    input: [weather_mode]
    output: Location
    side_effects: ["stalls_available and lane_posture recomputed; increments Location.version by 1"]
  - method: POST
    path: "/locations/{locationId}/advance_rush"
    description: "Advance the rush window; expires stale DRAFT orders (checked_in_at older than 2 rush windows -> CANCELLED with stall release)"
    roles: [ShiftManager]
    code: 200
    input: []
    output: Location
    side_effects: ["rush_index += 1; stale DRAFT orders cancelled; stalls released; increments Location.version by 1"]
  - method: GET
    path: "/locations/{locationId}/metrics"
    description: "Timing metrics rollup over delivered orders"
    roles: [ShiftManager, PlatformAdmin]
    code: 200
    input: ["channel?", "from?", "to?"]
    output: "{ count_delivered: integer, count_late: integer, avg_checkout_to_ready_seconds: integer, avg_ready_to_delivered_seconds: integer, on_time_rate: number }"
    side_effects: []

  # --- MenuItem ---
  - method: POST
    path: "/menu-items"
    description: "Create a menu item"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, category, base_price_cents, "size_scheme?", "half_price_eligible?"]
    output: MenuItem
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/menu-items"
    description: "List menu items"
    roles: [PlatformAdmin, ShiftManager, Carhop, KitchenStaff, Customer]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: "MenuItem[]"
    side_effects: []
  - method: GET
    path: "/menu-items/{itemId}"
    description: "Get a menu item"
    roles: [PlatformAdmin, ShiftManager, Carhop, KitchenStaff, Customer]
    code: 200
    input: []
    output: MenuItem
    side_effects: []
  - method: POST
    path: "/menu-items/{itemId}/retire"
    description: "Retire a menu item"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MenuItem
    side_effects: ["status=RETIRED"]
  - method: POST
    path: "/customization-options"
    description: "Create a customization option (add-in or size)"
    roles: [PlatformAdmin]
    code: 201
    input: [code, applies_to_category, price_cents, "is_size?", "size_upcharge_cents?"]
    output: CustomizationOption
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/customization-options"
    description: "List customization options"
    roles: [PlatformAdmin, ShiftManager, Carhop, KitchenStaff, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CustomizationOption[]"
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Register an app customer"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [email, display_name, "stored_tip_default_pct?"]
    output: Customer
    side_effects: ["app_user=true, wallet_credit_cents=0"]
  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer"
    roles: [Customer, ShiftManager, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [ShiftManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Customer[]"
    side_effects: []
  - method: POST
    path: "/customers/{customerId}/wallet/adjust"
    description: "Manager wallet credit/debit adjustment"
    roles: [ShiftManager]
    code: 200
    input: [delta_cents, reason]
    output: Customer
    side_effects: ["wallet_credit_cents += delta_cents; must remain >= 0 (ERR_WALLET_NEGATIVE)"]

  # --- Stall ---
  - method: POST
    path: "/locations/{locationId}/stalls"
    description: "Create a stall (or patio table)"
    roles: [ShiftManager, PlatformAdmin]
    code: 201
    input: [stall_number, kind]
    output: Stall
    side_effects: ["status=IDLE, intercom_functional=true; stalls_available recomputed"]
  - method: GET
    path: "/locations/{locationId}/stalls"
    description: "List stalls of a location"
    roles: [ShiftManager, Carhop, KitchenStaff, PlatformAdmin, Customer]
    code: 200
    input: ["status?", "kind?", "location_id?", "current_order_id?", "limit?", "offset?"]
    output: "Stall[]"
    side_effects: []
  - method: GET
    path: "/locations/{locationId}/stalls/{stallId}"
    description: "Get a stall"
    roles: [ShiftManager, Carhop, KitchenStaff, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Stall
    side_effects: []
  - method: POST
    path: "/locations/{locationId}/stalls/{stallId}/checkin"
    description: "Intercom check-in: occupies the stall and opens a DRAFT STALL_INTERCOM (or PATIO) order. OCC-guarded on Location.version."
    roles: [Customer, ShiftManager]
    code: 201
    input: [expected_location_version, "customer_id?"]
    output: Order
    side_effects: ["Stall IDLE -> OCCUPIED; DRAFT order created with checked_in_at=now; Location.stalls_available recomputed; Location.version unchanged (stall mutation only)"]
  - method: POST
    path: "/locations/{locationId}/stalls/{stallId}/app-checkin"
    description: "App-initiated check-in; requires existing app_user customer"
    roles: [Customer]
    code: 201
    input: [customer_id, expected_location_version]
    output: Order
    side_effects: ["Stall IDLE -> OCCUPIED; DRAFT APP_CHECKIN/PATIO order created; stalls_available recomputed"]
  - method: POST
    path: "/locations/{locationId}/stalls/{stallId}/faults"
    description: "Report equipment fault on a stall"
    roles: [Carhop, ShiftManager]
    code: 201
    input: [kind, note, reported_by_role]
    output: EquipmentFault
    side_effects: ["Stall.intercom_functional = false; if kind == MENU_BOARD_DEAD: Stall -> OUT_OF_SERVICE and stalls_available recomputed"]
  - method: GET
    path: "/locations/{locationId}/stalls/{stallId}/faults"
    description: "List faults of a stall"
    roles: [Carhop, ShiftManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EquipmentFault[]"
    side_effects: []
  - method: POST
    path: "/locations/{locationId}/stalls/{stallId}/faults/{faultId}/resolve"
    description: "Resolve an equipment fault"
    roles: [ShiftManager]
    code: 200
    input: []
    output: EquipmentFault
    side_effects: ["If no other OPEN fault on the stall: intercom_functional = true"]
  - method: POST
    path: "/locations/{locationId}/stalls/{stallId}/set_out_of_service"
    description: "Force a stall out of service; occupied stalls require force_cancel"
    roles: [ShiftManager]
    code: 200
    input: ["force_cancel?"]
    output: Stall
    side_effects: ["Stall -> OUT_OF_SERVICE; occupying order cancelled when force_cancel == true; stalls_available recomputed"]
  - method: POST
    path: "/locations/{locationId}/stalls/{stallId}/return_to_service"
    description: "Return a stall to IDLE"
    roles: [ShiftManager]
    code: 200
    input: []
    output: Stall
    side_effects: ["Requires no OPEN faults; stalls_available recomputed"]

  # --- Order ---
  - method: POST
    path: "/locations/{locationId}/orders"
    description: "Create a DRAFT drive-thru order (stall orders are created by check-in)"
    roles: [Customer, ShiftManager]
    code: 201
    input: ["status?", "channel?", "payment_status?", "location_id?", "stall_id?", "customer_id?", "delivery_run_id?", "limit?", "offset?"]
    output: Order
    side_effects: ["channel must be DRIVE_THRU (stall channels come from check-in); status=DRAFT"]
  - method: GET
    path: "/locations/{locationId}/orders"
    description: "List orders with filters"
    roles: [ShiftManager, Carhop, KitchenStaff, PlatformAdmin]
    code: 200
    input: ["status?", "channel?", "payment_status?", "location_id?", "stall_id?", "customer_id?", "delivery_run_id?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []
  - method: GET
    path: "/locations/{locationId}/orders/{orderId}"
    description: "Get an order with computed pricing fields"
    roles: [Customer, ShiftManager, Carhop, KitchenStaff, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: "/locations/{locationId}/orders/{orderId}/lines"
    description: "Add an order line (DRAFT only)"
    roles: [Customer, ShiftManager]
    code: 201
    input: [menu_item_id, quantity, "size_option_code?", "addin_option_codes?"]
    output: OrderLine
    side_effects: ["unit/extended price computed; order subtotal/tax/total recomputed (provisional variant)"]
  - method: GET
    path: "/locations/{locationId}/orders/{orderId}/lines"
    description: "List lines of an order"
    roles: [Customer, ShiftManager, Carhop, KitchenStaff, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: DELETE
    path: "/locations/{locationId}/orders/{orderId}/lines/{lineId}"
    description: "Remove an order line (DRAFT only)"
    roles: [Customer, ShiftManager]
    code: 204
    input: []
    output: null
    side_effects: ["order pricing recomputed"]
  - method: POST
    path: "/locations/{locationId}/orders/{orderId}/place"
    description: "Place the order: happy-hour repricing, offer selection, service-target snapshot"
    roles: [Customer, ShiftManager]
    code: 200
    input: ["offer_code?", "fallback_confirmed?"]
    output: Order
    side_effects: ["DRAFT -> PLACED; placed_at set; final pricing frozen; service_target_seconds snapshotted"]
  - method: POST
    path: "/locations/{locationId}/orders/{orderId}/start_preparation"
    description: "Move order to PREPARING (kitchen cap enforced)"
    roles: [KitchenStaff, ShiftManager]
    code: 200
    input: []
    output: Order
    side_effects: ["PLACED -> PREPARING"]
  - method: POST
    path: "/locations/{locationId}/orders/{orderId}/mark_ready"
    description: "Move order to READY"
    roles: [KitchenStaff, ShiftManager]
    code: 200
    input: []
    output: Order
    side_effects: ["PREPARING -> READY; ready_at set"]
  - method: POST
    path: "/locations/{locationId}/orders/{orderId}/authorize_payment"
    description: "Authorize payment (UNPAID -> AUTHORIZED)"
    roles: [Customer, ShiftManager]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status -> AUTHORIZED"]
  - method: POST
    path: "/locations/{locationId}/orders/{orderId}/capture_payment"
    description: "Capture payment with tip resolution and wallet tender"
    roles: [Customer, Carhop, ShiftManager]
    code: 200
    input: ["tip_cents?"]
    output: Order
    side_effects: ["AUTHORIZED -> CAPTURED; tip_cents resolved; wallet debited; TipRecord created (RECORDED)"]
  - method: POST
    path: "/locations/{locationId}/orders/{orderId}/refund"
    description: "Refund a captured order"
    roles: [ShiftManager]
    code: 200
    input: [refund_mode, "manager_override?"]
    output: Order
    side_effects: ["CAPTURED -> REFUNDED; TipRecord -> VOIDED; wallet credited when refund_mode == STORE_CREDIT"]
  - method: POST
    path: "/locations/{locationId}/orders/{orderId}/cancel"
    description: "Cancel an order (channel rules and payment-state gates per state machine)"
    roles: [Customer, ShiftManager]
    code: 200
    input: []
    output: Order
    side_effects: ["status -> CANCELLED; AUTHORIZED payment voided; stall released"]

  # --- Offer ---
  - method: POST
    path: "/locations/{locationId}/offers"
    description: "Create an offer"
    roles: [ShiftManager, PlatformAdmin]
    code: 201
    input: [code, kind, discount_type, discount_value, window_start_local, window_end_local, "app_only?"]
    output: Offer
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/locations/{locationId}/offers"
    description: "List offers of a location"
    roles: [ShiftManager, PlatformAdmin, Customer]
    code: 200
    input: ["status?", "kind?", "location_id?", "limit?", "offset?"]
    output: "Offer[]"
    side_effects: []
  - method: GET
    path: "/locations/{locationId}/offers/{offerId}"
    description: "Get an offer"
    roles: [ShiftManager, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: POST
    path: "/locations/{locationId}/offers/{offerId}/disable"
    description: "Disable an offer"
    roles: [ShiftManager, PlatformAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: ["status=DISABLED"]

  # --- ServiceTargetProfile ---
  - method: POST
    path: "/locations/{locationId}/service-targets"
    description: "Create a service target profile; at most one ACTIVE per (channel, weather_mode)"
    roles: [ShiftManager, PlatformAdmin]
    code: 201
    input: [channel, weather_mode, target_seconds]
    output: ServiceTargetProfile
    side_effects: ["status=ACTIVE; any existing ACTIVE profile for the same (channel, weather_mode) -> RETIRED"]
  - method: GET
    path: "/locations/{locationId}/service-targets"
    description: "List service target profiles"
    roles: [ShiftManager, PlatformAdmin]
    code: 200
    input: ["channel?", "status?", "location_id?", "limit?", "offset?"]
    output: "ServiceTargetProfile[]"
    side_effects: []

  # --- Carhop ---
  - method: POST
    path: "/locations/{locationId}/carhops"
    description: "Hire a carhop"
    roles: [ShiftManager, PlatformAdmin]
    code: 201
    input: [name, zone, "on_shift?", "max_trays?"]
    output: Carhop
    side_effects: ["active_run_load=0, tips counters 0"]
  - method: GET
    path: "/locations/{locationId}/carhops"
    description: "List carhops"
    roles: [ShiftManager, Carhop, PlatformAdmin]
    code: 200
    input: ["zone?", "on_shift?", "location_id?", "limit?", "offset?"]
    output: "Carhop[]"
    side_effects: []
  - method: GET
    path: "/locations/{locationId}/carhops/{carhopId}"
    description: "Get a carhop with tip and load counters"
    roles: [ShiftManager, Carhop, PlatformAdmin]
    code: 200
    input: []
    output: Carhop
    side_effects: []

  # --- DeliveryRun ---
  - method: POST
    path: "/locations/{locationId}/delivery-runs"
    description: "Stage a delivery run: dispatch_selector picks READY orders and an eligible carhop. OCC-guarded on the selected Carhop.version."
    roles: [ShiftManager]
    code: 201
    input: [carhop_id, expected_carhop_version, "order_ids?", "route_note?"]
    output: DeliveryRun
    side_effects: ["Orders staged in placed_at order with run_position 1..N; Carhop.active_run_load += order_count; Carhop.version incremented by 1"]
  - method: GET
    path: "/locations/{locationId}/delivery-runs"
    description: "List delivery runs"
    roles: [ShiftManager, Carhop, PlatformAdmin]
    code: 200
    input: ["status?", "carhop_id?", "location_id?", "limit?", "offset?"]
    output: "DeliveryRun[]"
    side_effects: []
  - method: GET
    path: "/locations/{locationId}/delivery-runs/{runId}"
    description: "Get a delivery run"
    roles: [ShiftManager, Carhop, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: []
  - method: POST
    path: "/locations/{locationId}/delivery-runs/{runId}/depart"
    description: "Depart the run (orders READY -> OUT_FOR_DELIVERY)"
    roles: [Carhop, ShiftManager]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: ["LOADED -> OUT; out_at set; staged orders transition"]
  - method: POST
    path: "/locations/{locationId}/delivery-runs/{runId}/void"
    description: "Void a LOADED run; orders return to READY unstaged"
    roles: [ShiftManager]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: ["LOADED -> VOIDED; orders cleared of run/position; active_run_load decremented"]
  - method: POST
    path: "/locations/{locationId}/delivery-runs/{runId}/orders/{orderId}/deliver"
    description: "Deliver one order off the run, in run_position order"
    roles: [Carhop, ShiftManager]
    code: 200
    input: []
    output: Order
    side_effects: ["OUT_FOR_DELIVERY -> DELIVERED; late_flag computed; stall released; run auto-completes when empty"]

  # --- TipRecord ---
  - method: GET
    path: "/locations/{locationId}/tip-records"
    description: "List tip records"
    roles: [ShiftManager, Carhop, PlatformAdmin]
    code: 200
    input: ["carhop_id?", "status?", "order_id?", "limit?", "offset?"]
    output: "TipRecord[]"
    side_effects: []
  - method: POST
    path: "/locations/{locationId}/tip-records/{tipId}/settle"
    description: "Settle a tip (optional adjustment)"
    roles: [ShiftManager]
    code: 200
    input: ["adjusted_tip_cents?"]
    output: TipRecord
    side_effects: ["RECORDED -> SETTLED; carhop tip counters updated"]

  # --- Test-driving endpoints ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: []


  # --- Flat single-resource alias reads (register collection segments for FK reachability) ---
  - method: GET
