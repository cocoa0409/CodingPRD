  # ===========================================================================
  - section: rbac
    instances:

      - name: buyer_cannot_manage_price_zones_or_warehouses
        claim_type: rbac_denial
        grounds:
          - roles.Buyer
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Buyer is denied on PricingAnalyst's and InventoryPlanner's exclusive endpoints: POST /price-zones and POST /warehouses both return 403 ERR_UNAUTHORIZED with no resource created."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /price-zones"
              payload: { zone_code: "NE", compare_at_multiplier: 1.5, markdown_cadence_weeks: 4, clearance_weeks: 12 }
              as: Buyer
              captures: { err_r1: $.data.error_id }
            - call: "POST /warehouses"
              payload: { warehouse_code: "W-RB", pallet_capacity: 100, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: Buyer
              captures: { err_r2: $.data.error_id }
          assert:
            - "both calls fail with 403 ERR_UNAUTHORIZED"
            - "GET /price-zones and GET /warehouses return 0 rows"

      - name: warehouse_clerk_cannot_confirm_shrink_or_open_seasons
        claim_type: rbac_denial
        grounds:
          - roles.WarehouseClerk
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "WarehouseClerk can receive goods but cannot confirm shrink (ShrinkAuditor) or open seasons (PlanningLead) — cross-role exclusive operations are 403 even when the resources exist and preconditions hold."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 DRAFT. Store ST-RB exists. An OPEN shrink case exists."
          setup_api_calls:
            - *k_clock
            - *k_season
            - *k_zone_mt
            - call: "POST /stores"
              payload: { store_code: "ST-RB", cluster_code: "VALUE_RURAL", zone_code: "MT", storage_capacity_units: 500 }
              as: AllocationManager
              captures: { store_rb_id: $.data.id }
            - call: "POST /shrink-cases"
              payload: { store_id: "${store_rb_id}", shrink_type: "DAMAGE", units_lost: 0, units_untraceable: 2 }
              as: ShrinkAuditor
              captures: { sc_rb_id: $.data.id }
          trigger:
            - call: "POST /shrink-cases/${sc_rb_id}/confirm"
              payload: {}
              as: WarehouseClerk
              captures: { err_r3: $.data.error_id }
            - call: "POST /merchandise-seasons/${k_season_id}/open"
              payload: {}
              as: WarehouseClerk
              captures: { err_r4: $.data.error_id }
          assert:
            - "the shrink confirm fails with 403 ERR_UNAUTHORIZED and the case stays OPEN"
            - "the season open fails with 403 ERR_UNAUTHORIZED and the season stays DRAFT"

      - name: store_ops_lead_cannot_approve_liquidation_order
        claim_type: rbac_denial
