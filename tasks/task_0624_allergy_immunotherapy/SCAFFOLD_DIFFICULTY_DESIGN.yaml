  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: epinephrine_safety_beats_insufficient_volume_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_EPINEPHRINE_NOT_ON_FILE]
          - errors[ERR_VIAL_INSUFFICIENT_VOLUME]
        distinguishing_aspect: |
          A SILVER injection on a patient WITHOUT epinephrine_on_file AND drawing more than
          the vial's remaining volume violates both priority 7 (business_safety) and priority
          16 (business_fiscal); the safety error ERR_EPINEPHRINE_NOT_ON_FILE wins.
        test_recipe:
          setup:
            - "An ACTIVE GREEN-start plan (HIGH tier) with a full GREEN starting vial (so activation succeeded) PLUS a SILVER vial mixed onto the same plan holding only 0.05 mL; patient epinephrine_on_file=false. The trigger shot draws from the SILVER vial."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Lou Ives", date_of_birth: "1980-10-10", epinephrine_on_file: false }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Severe", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "OAK", method: "SKIN", wheal_mm: 10, clinically_relevant: true }
