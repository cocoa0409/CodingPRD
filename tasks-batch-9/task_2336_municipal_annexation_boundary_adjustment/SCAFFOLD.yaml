# Task 2336 — Municipal Annexation & Boundary Adjustment
# Scaffold seed tables (§1.0–§1.7). Difficulty band: above Expert.

scenario: |
  2336. Municipal Annexation & Boundary Adjustment (city annexation program): annexation method
  selection across petition, referendum and involuntary processes by state law, contiguity, urban
  development and service capability requirements, fiscal impact analysis of service extension
  against projected revenue, plan of services adoption with timelines for police, fire, water and
  sewer, notice, public hearing and objection procedures with property owner protest thresholds,
  boundary commission or county approval where required, effective date, tax roll transfer and
  utility service transition, de-annexation petitions and municipal service district alternatives

domain_name: municipal-annexation
api_prefix: ""              # flat topology: peer collections mounted at the server root

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - conditional_feature_flags

  entity_topology: flat
  # Every entity is a root collection linked by explicit FK fields (no nested ownership URLs
  # except reverse-reachability reads). StatuteProfile acts as a configuration hub whose flags
  # switch whole code paths on AnnexationCase, Petition, PublicHearing and PlanOfServices.

  state_machine_shape: cyclic
  # AnnexationCase.status carries a genuine cure cycle (SUFFICIENCY_REVIEW → PETITION_CIRCULATING
  # → SUFFICIENCY_REVIEW) plus method-dependent branching, AND a second independent dimension
  # (tax_roll_status). PlanOfServices carries two independent dimensions (adoption_status ×
  # service_readiness). UtilityAccount cycles OUTSIDE_CITY → INSIDE_CITY_ACTIVE → OUTSIDE_CITY.

  relationship_patterns:
    - one_to_many          # AnnexationCase → Parcel, Petition, PublicHearing, PlanOfServices
    - many_to_many         # ParcelOwnerConsent junctions Petition × Parcel × PropertyOwner
    - self_referential     # AnnexationCase.predecessor_case_id → AnnexationCase.id (de-annexation)
    - cross_aggregate      # ServiceCommitment spans PlanOfServices and ServiceProvider capacity

  role_model: segregation_of_duties
  # The operator who finalized a case's FiscalImpactAnalysis may not decide its boundary-commission
  # review; municipal roles are scoped to their own Municipality; owners are scoped to their own
  # consents and protest filings.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: StatuteProfile
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter state code this annexation statute applies to
        constraints: exactly 2 uppercase letters; unique across StatuteProfile
      - name: authorized_methods
        type: array
        source: input
        description: Annexation methods the state authorizes; enum members PETITION_100, PETITION_MAJORITY, REFERENDUM, INVOLUNTARY_ORDINANCE
        constraints: non-empty; each member in {PETITION_100, PETITION_MAJORITY, REFERENDUM, INVOLUNTARY_ORDINANCE}
      - name: signature_basis
        type: enum
        source: input
        description: Basis used to measure petition sufficiency
        default: ASSESSED_VALUE
        constraints: ASSESSED_VALUE | OWNER_COUNT
      - name: signature_threshold_pct
        type: number
        source: input
        description: Percentage on signature_basis that a PETITION_MAJORITY petition must reach (inclusive, >=)
        default: 50.00
        constraints: 0 < x <= 100; 2 decimal places
      - name: protest_basis
        type: enum
        source: input
        description: Basis used to measure the property-owner protest percentage
        default: ASSESSED_VALUE
        constraints: ASSESSED_VALUE | OWNER_COUNT
      - name: protest_threshold_pct
        type: number
        source: input
        description: Protest percentage at or above which protest is SUSTAINED (inclusive, >=)
        default: 20.00
        constraints: 0 < x <= 100; 2 decimal places
      - name: contiguity_min_ratio
        type: number
        source: input
        description: Minimum shared-boundary ratio required for contiguity (inclusive, >=)
        default: 0.125
        constraints: 0 < x <= 1; 4 decimal places
      - name: urban_density_min_units_per_acre
        type: number
        source: input
        description: Dwelling units per acre at or above which the territory passes the density limb of the urban-development test
        default: 2.00
        constraints: x > 0
      - name: subdivision_test_min_developed_ratio
        type: number
        source: input
        description: developed_lot_count / total_lot_count at or above which the territory passes the subdivision limb of the urban-development test
        default: 0.60
        constraints: 0 < x <= 1
      - name: min_qualification_index
        type: number
        source: input
        description: Minimum territory_qualification_index required to certify a territory (inclusive, >=)
        default: 60.00
        constraints: 0 <= x <= 100
      - name: notice_min_days
        type: integer
        source: input
        description: Minimum whole days between notice publication and the hearing being held
        default: 30
        constraints: x >= 0
      - name: hearing_to_ordinance_min_days
        type: integer
        source: input
        description: Statutory cooling-off period in whole days between hearing_held_at and ordinance adoption
        default: 10
        constraints: x >= 0
      - name: required_service_types
        type: array
        source: input
        description: Service types a plan of services must cover before adoption; members in {POLICE, FIRE, WATER, SEWER}
        default: ["POLICE", "FIRE", "WATER", "SEWER"]
        constraints: non-empty; distinct members
      - name: police_fire_timeline_max_days
        type: integer
        source: input
        description: Maximum commitment window length in days allowed for POLICE and FIRE commitments
        default: 60
        constraints: x >= 1
      - name: water_sewer_timeline_max_days
        type: integer
        source: input
        description: Maximum commitment window length in days allowed for WATER and SEWER commitments
        default: 730
        constraints: x >= 1
      - name: fiscal_method
        type: enum
        source: input
        description: Service-cost methodology the state mandates for fiscal impact analysis
        default: AVERAGE_COST
        constraints: AVERAGE_COST | MARGINAL_COST
      - name: per_capita_shared_revenue_cents
        type: integer
        source: input
        description: State-shared revenue in cents per projected resident per year
        default: 12000
        constraints: x >= 0
      - name: referendum_required_methods
        type: array
        source: input
        description: Methods whose ordinance adoption must be ratified by referendum before it can be effectuated
        default: []
        constraints: members in {PETITION_100, PETITION_MAJORITY, REFERENDUM, INVOLUNTARY_ORDINANCE}
      - name: boundary_commission_required
        type: boolean
        source: input
        description: Whether a boundary commission / county approval step is required before effectuation
        default: false
      - name: de_annexation_allowed
        type: boolean
        source: input
        description: Whether DE_ANNEXATION cases may be created under this statute
        default: true
      - name: de_annexation_refund_basis
        type: enum
        source: input
        description: Basis used to compute the prorated tax refund when a de-annexation is effectuated
        default: DAILY_PRORATION
        constraints: DAILY_PRORATION | WHOLE_QUARTER
      - name: msd_alternative_allowed
        type: boolean
        source: input
        description: Whether a municipal service district may be adopted as the alternative after a sustained protest
        default: true
      - name: msd_cost_recovery_pct
        type: number
        source: input
        description: Fraction of the plan's committed cost recovered by the municipal service district annual assessment
        default: 0.75
        constraints: 0 < x <= 1
      - name: effective_date_rule
        type: enum
        source: input
        description: Rule constraining the effective_date supplied at effectuation
        default: IMMEDIATE
        constraints: IMMEDIATE | NEXT_QUARTER_START | NEXT_FISCAL_YEAR
      - name: fiscal_year_end_month_day
        type: string
        source: input
        description: Fiscal year end as MM-DD, used as the proration horizon for tax roll transfer
        default: "12-31"
        constraints: MM-DD format

  - name: Municipality
    parent: null
    common_fields: true
    fields:
      - name: statute_profile_id
        type: string
        source: input
        description: FK -> StatuteProfile.id; the statute governing every case of this municipality
      - name: name
        type: string
        source: input
        description: Municipality name
        constraints: 1..200 chars
      - name: state_code
        type: string
        source: input
        description: Two-letter state code; must equal the referenced StatuteProfile.state_code
        constraints: exactly 2 uppercase letters
      - name: population
        type: integer
        source: input
        description: Current incorporated population
        constraints: x >= 0
      - name: citywide_annual_service_cost_cents
        type: integer
        source: input
        description: Total annual general-fund service cost in cents, used by the AVERAGE_COST variant
        constraints: x >= 0
      - name: citywide_population
        type: integer
        source: input
        description: Denominator population for the AVERAGE_COST per-capita rate
        constraints: x >= 1
      - name: general_fund_millage_rate
        type: number
        source: input
        description: General-fund millage rate expressed in mills per $1,000 of assessed value
        constraints: x >= 0; 4 decimal places
      - name: taxable_assessed_value_cents
        type: integer
        source: computed
        description: Assessed value on the municipal tax roll in cents; incremented when a case posts its tax roll and decremented when a posting is reversed
        default: 0
      - name: corporate_boundary_perimeter_feet
        type: number
        source: input
        description: Length of the existing corporate boundary in feet; denominator of contiguity_ratio
        constraints: x > 0
      - name: fiscal_deficit_tolerance_pct
        type: number
        source: input
        description: Maximum deficit_ratio_pct tolerated at ordinance adoption (inclusive, <=)
        default: 5.00
        constraints: 0 <= x <= 100
      - name: hearing_changeover_buffer_minutes
        type: integer
        source: input
        description: Trailing buffer in minutes appended to every hearing occupation of the council chamber
        default: 30
        constraints: x >= 0
      - name: utility_outside_surcharge_pct
        type: number
        source: input
        description: Surcharge fraction applied to monthly_base_cents while a utility account is outside the corporate limits
        default: 0.50
        constraints: 0 <= x <= 2

  - name: ServiceProvider
    parent: null
    common_fields: true
    fields:
      - name: municipality_id
        type: string
        source: input
        description: FK -> Municipality.id; the municipality this provider serves
      - name: provider_name
        type: string
        source: input
        description: Department or utility authority name
        constraints: 1..200 chars
      - name: service_types
        type: array
        source: input
        description: Service types this provider can commit to; members in {POLICE, FIRE, WATER, SEWER}
        constraints: non-empty; distinct members
      - name: concurrent_project_capacity
        type: integer
        source: input
        description: Maximum number of ACTIVE or FULFILLED commitments whose closed date windows may contain any single calendar day
        default: 1
        constraints: x >= 1
      - name: encumbered_capacity_days
        type: integer
        source: computed
        description: Sum over ServiceCommitment rows of this provider with commitment_status IN {ACTIVE, FULFILLED} of window day count (inclusive of both endpoints)
        default: 0

  - name: PropertyOwner
    parent: null
    common_fields: true
    fields:
      - name: owner_name
        type: string
        source: input
        description: Record owner name as printed on the tax roll
        constraints: 1..200 chars
      - name: contact_email
        type: string
        source: input
        description: Contact address used for mailed notice
        constraints: contains '@'

  - name: AnnexationCase
    parent: null
    common_fields: true
    fields:
      - name: municipality_id
        type: string
        source: input
        description: FK -> Municipality.id; the annexing municipality
      - name: predecessor_case_id
        type: string
        source: input
        description: FK -> AnnexationCase.id; the EFFECTIVE annexation this case unwinds. Required when case_type == DE_ANNEXATION, must be null otherwise
        default: null
      - name: case_type
        type: enum
        source: input
        description: Whether the case annexes territory or de-annexes a predecessor's territory
        default: ANNEXATION
        constraints: ANNEXATION | DE_ANNEXATION
      - name: method
        type: enum
        source: input
        description: Annexation method selected for this case
        constraints: PETITION_100 | PETITION_MAJORITY | REFERENDUM | INVOLUNTARY_ORDINANCE
      - name: status
        type: enum
        source: system
        description: Procedural dimension of the case lifecycle
        default: DRAFT
        constraints: DRAFT | TERRITORY_CERTIFIED | PETITION_CIRCULATING | SUFFICIENCY_REVIEW | HEARING_NOTICED | HEARING_HELD | PROTEST_SUSTAINED | ORDINANCE_ADOPTED | REFERENDUM_PENDING | REFERENDUM_APPROVED | COMMISSION_REVIEW | COMMISSION_APPROVED | EFFECTIVE | DENIED | MSD_ALTERNATIVE_ADOPTED | DE_ANNEXED
      - name: tax_roll_status
        type: enum
        source: system
        description: Independent fiscal dimension of the case lifecycle, advanced only by the county assessor and by de-annexation reversal
        default: NOT_TRANSFERRED
        constraints: NOT_TRANSFERRED | POSTED | REVERSED
      - name: shared_boundary_feet
        type: number
        source: input
        description: Length in feet of the territory boundary shared with the existing corporate boundary
        constraints: x >= 0
      - name: total_lot_count
        type: integer
        source: input
        description: Total number of subdivision lots in the territory
        constraints: x >= 0
      - name: developed_lot_count
        type: integer
        source: input
        description: Number of lots in the territory carrying a permanent structure
        constraints: 0 <= x <= total_lot_count
      - name: dwelling_units
        type: integer
        source: input
        description: Dwelling units in the territory, used by the density limb of the urban-development test
        constraints: x >= 0
      - name: max_service_distance_miles
        type: number
        source: input
        description: Distance in miles from the nearest existing service facility to the farthest point of the territory
        default: 0
        constraints: x >= 0
      - name: parcel_count
        type: integer
        source: computed
        description: Count of Parcel rows of this case with parcel_status IN {PROPOSED, PENDING_ANNEX, INCORPORATED}
        default: 0
      - name: territory_acreage
        type: number
        source: computed
        description: Sum of Parcel.acreage over parcels with parcel_status IN {PROPOSED, PENDING_ANNEX, INCORPORATED}, 2 decimal places
        default: 0
      - name: territory_assessed_value_cents
        type: integer
        source: computed
        description: Sum of Parcel.assessed_value_cents over parcels with parcel_status IN {PROPOSED, PENDING_ANNEX, INCORPORATED}
        default: 0
      - name: contiguity_ratio
        type: number
        source: computed
        description: shared_boundary_feet / Municipality.corporate_boundary_perimeter_feet, 4 decimal places, round_half_up
        default: 0
      - name: urban_development_qualified
        type: boolean
        source: computed
        description: True when either limb of the urban-development test passes (see calculations.territory_qualification)
        default: false
      - name: qualification_index
        type: number
        source: computed
        description: Territory qualification index in 0..100 (see calculations.territory_qualification), 2 decimal places
        default: 0
      - name: effective_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) on which the boundary change takes effect, supplied at effectuation
        default: null
      - name: protest_pct
        type: number
        source: computed
        description: Protest percentage copied from the case's HELD hearing when its protest period closes, 2 decimal places
        default: 0
      - name: protest_outcome
        type: enum
        source: system
        description: Outcome of the property-owner protest procedure
        default: NOT_EVALUATED
        constraints: NOT_EVALUATED | FAILED | SUSTAINED
      - name: referendum_result
        type: enum
        source: system
        description: Result of the ratification referendum when the statute requires one
        default: NOT_HELD
        constraints: NOT_HELD | APPROVED | REJECTED
      - name: commission_review_status
        type: enum
        source: system
        description: Boundary commission / county approval state
        default: NOT_REQUIRED
        constraints: NOT_REQUIRED | PENDING | APPROVED | DENIED
      - name: fiscal_finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the FiscalAnalyst who finalized the case's current FINALIZED analysis; blocks that same operator from deciding the commission review
        default: null
      - name: hearing_held_at
        type: datetime
        source: system
        description: Timestamp at which the case's hearing was held; start of the cooling-off period
        default: null
      - name: ordinance_adopted_at
        type: datetime
        source: system
        description: Timestamp at which the annexation ordinance was adopted
        default: null
      - name: tax_roll_transferred_assessed_value_cents
        type: integer
        source: computed
        description: Assessed value transferred to the municipal tax roll when tax_roll_status became POSTED
        default: 0
      - name: tax_roll_transferred_tax_cents
        type: integer
        source: computed
        description: Sum of Parcel.prorated_tax_cents over INCORPORATED parcels, computed with per-parcel rounding (see calculations.tax_roll_proration)
        default: 0
      - name: de_annexation_refund_cents
        type: integer
        source: computed
        description: Refund owed on the predecessor's posted tax when this DE_ANNEXATION case is effectuated
        default: 0
      - name: msd_annual_assessment_cents
        type: integer
        source: computed
        description: Annual municipal service district assessment adopted as the alternative after a sustained protest
        default: 0

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - name: annexation_case_id
        type: string
        source: input
        description: FK -> AnnexationCase.id; the case whose territory contains this parcel
      - name: primary_owner_id
        type: string
        source: input
        description: FK -> PropertyOwner.id; record owner of the parcel
      - name: parcel_apn
        type: string
        source: input
        description: Assessor parcel number
        constraints: 1..40 chars; unique among parcels with parcel_status IN {PROPOSED, PENDING_ANNEX, INCORPORATED} within one Municipality
      - name: assessed_value_cents
        type: integer
        source: input
        description: County-assessed value of the parcel in cents
        constraints: x > 0
      - name: acreage
        type: number
        source: input
        description: Parcel area in acres, 2 decimal places
        constraints: x > 0
      - name: is_developed
        type: boolean
        source: input
        description: Whether the parcel carries a permanent structure
        default: false
      - name: dwelling_units
        type: integer
        source: input
        description: Dwelling units on the parcel
        default: 0
        constraints: x >= 0
      - name: parcel_status
        type: enum
        source: system
        description: Parcel position in the annexation lifecycle
        default: PROPOSED
        constraints: PROPOSED | PENDING_ANNEX | INCORPORATED | EXCLUDED | DE_ANNEXED
      - name: annual_tax_cents
        type: integer
        source: computed
        description: Full-year municipal tax on this parcel at the municipality's millage rate, stamped when the tax roll posts
        default: 0
      - name: prorated_tax_cents
        type: integer
        source: computed
        description: Per-parcel prorated tax for the remainder of the fiscal year, rounded to cents before summation
        default: 0

  - name: Petition
    parent: null
    common_fields: true
    fields:
      - name: annexation_case_id
        type: string
        source: input
        description: FK -> AnnexationCase.id; the case this petition circulates for
      - name: petition_type
        type: enum
        source: input
        description: Whether unanimous or majority owner support is required
        constraints: OWNER_100 | OWNER_MAJORITY
      - name: circulation_days
        type: integer
        source: input
        description: Number of days the petition may circulate from circulation_started_at
        default: 180
        constraints: 1 <= x <= 365
      - name: circulation_started_at
        type: datetime
        source: system
        description: Logical clock reading when the petition was created
      - name: circulation_deadline_at
        type: datetime
        source: computed
        description: circulation_started_at + circulation_days; signatures dated after this instant do not qualify
      - name: sufficiency_status
        type: enum
        source: system
        description: Sufficiency dimension of the petition
        default: CIRCULATING
        constraints: CIRCULATING | SUFFICIENT | INSUFFICIENT | EXPIRED
      - name: qualified_signature_assessed_value_cents
        type: integer
        source: computed
        description: Sum of ParcelOwnerConsent.qualified_value_cents over qualifying consents (see calculations.petition_sufficiency)
        default: 0
      - name: qualified_signature_owner_count
        type: integer
        source: computed
        description: Count of distinct property_owner_id over qualifying consents
        default: 0
      - name: signature_value_pct
        type: number
        source: computed
        description: qualified_signature_assessed_value_cents / AnnexationCase.territory_assessed_value_cents * 100, 2 decimal places
        default: 0
      - name: signature_owner_pct
        type: number
        source: computed
        description: qualified_signature_owner_count / distinct owner count of the territory * 100, 2 decimal places
        default: 0

  - name: ParcelOwnerConsent
    parent: null
    common_fields: true
    fields:
      - name: petition_id
        type: string
        source: input
        description: FK -> Petition.id; the petition being signed
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the parcel whose ownership interest is being pledged
      - name: property_owner_id
        type: string
        source: input
        description: FK -> PropertyOwner.id; the signing owner
      - name: ownership_share_pct
        type: number
        source: input
        description: Percentage of the parcel's ownership interest this signature represents
        constraints: 0 < x <= 100; 2 decimal places
      - name: consent_status
        type: enum
        source: system
        description: Whether the signature currently counts toward sufficiency
        default: SIGNED
        constraints: SIGNED | WITHDRAWN
      - name: signed_at
        type: datetime
        source: system
        description: Logical clock reading when the consent was recorded
      - name: withdrawn_at
        type: datetime
        source: system
        description: Logical clock reading when the consent was withdrawn
        default: null
      - name: qualified_value_cents
        type: integer
        source: computed
        description: round_half_up(Parcel.assessed_value_cents * ownership_share_pct / 100) — the per-consent rounded value that enters the petition sum
        default: 0

  - name: FiscalImpactAnalysis
    parent: null
    common_fields: true
    fields:
      - name: annexation_case_id
        type: string
        source: input
        description: FK -> AnnexationCase.id; the case being analyzed
      - name: analysis_method
        type: enum
        source: input
        description: Service-cost methodology; must equal the governing StatuteProfile.fiscal_method
        constraints: AVERAGE_COST | MARGINAL_COST
      - name: projected_population
        type: integer
        source: input
        description: Population projected to reside in the territory at build-out
        constraints: x >= 0
      - name: horizon_years
        type: integer
        source: input
        description: Analysis horizon in years, recorded for the record only
        default: 5
        constraints: 1 <= x <= 20
      - name: marginal_police_cost_cents
        type: integer
        source: input
        description: Annual marginal police cost of extending service, used only by the MARGINAL_COST variant
        default: 0
        constraints: x >= 0
      - name: marginal_fire_cost_cents
        type: integer
        source: input
        description: Annual marginal fire cost of extending service, used only by the MARGINAL_COST variant
        default: 0
        constraints: x >= 0
      - name: marginal_water_cost_cents
        type: integer
        source: input
        description: Annual marginal water cost of extending service, used only by the MARGINAL_COST variant
        default: 0
        constraints: x >= 0
      - name: marginal_sewer_cost_cents
        type: integer
        source: input
        description: Annual marginal sewer cost of extending service, used only by the MARGINAL_COST variant
        default: 0
        constraints: x >= 0
      - name: property_tax_revenue_cents
        type: integer
        source: computed
        description: Projected annual property tax on the territory at the municipality's millage rate
        default: 0
      - name: projected_utility_revenue_cents
        type: integer
        source: computed
        description: Projected annual utility revenue at inside-city rates over the territory's utility accounts
        default: 0
      - name: shared_revenue_cents
        type: integer
        source: computed
        description: Projected annual state-shared revenue for projected_population
        default: 0
      - name: gross_annual_revenue_cents
        type: integer
        source: computed
        description: property_tax_revenue_cents + projected_utility_revenue_cents + shared_revenue_cents
        default: 0
      - name: base_service_cost_cents
        type: integer
        source: computed
        description: Service cost before administrative overhead, per analysis_method variant
        default: 0
      - name: overhead_tier_pct
        type: number
        source: computed
        description: Overhead rate selected from base_service_cost_cents tiers, 2 decimal places
        default: 0
      - name: administrative_overhead_cents
        type: integer
        source: computed
        description: round_half_up(base_service_cost_cents * overhead_tier_pct)
        default: 0
      - name: projected_annual_service_cost_cents
        type: integer
        source: computed
        description: base_service_cost_cents + administrative_overhead_cents
        default: 0
      - name: net_annual_impact_cents
        type: integer
        source: computed
        description: gross_annual_revenue_cents - projected_annual_service_cost_cents (negative means deficit)
        default: 0
      - name: deficit_ratio_pct
        type: number
        source: computed
        description: max(0, -net_annual_impact_cents) / gross_annual_revenue_cents * 100, 2 decimal places
        default: 0
      - name: status
        type: enum
        source: system
        description: Analysis lifecycle
        default: DRAFT
        constraints: DRAFT | FINALIZED | SUPERSEDED
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the FiscalAnalyst who finalized this analysis
        default: null

  - name: PlanOfServices
    parent: null
    common_fields: true
    fields:
      - name: annexation_case_id
        type: string
        source: input
        description: FK -> AnnexationCase.id; the case this plan serves
      - name: adoption_status
        type: enum
        source: system
        description: Adoption dimension of the plan, advanced by the clerk
        default: DRAFT
        constraints: DRAFT | ADOPTED | RESCINDED
      - name: service_readiness
        type: enum
        source: system
        description: Delivery dimension of the plan, derived from its commitments and independent of adoption_status
        default: PENDING
        constraints: PENDING | PARTIAL | READY
      - name: adopted_at
        type: datetime
        source: system
        description: Logical clock reading when the plan was adopted
        default: null
      - name: committed_cost_cents
        type: integer
        source: computed
        description: Sum of ServiceCommitment.cost_cents over commitments with commitment_status IN {ACTIVE, FULFILLED}
        default: 0
      - name: covered_service_types
        type: array
        source: computed
        description: Distinct service_type values of commitments with commitment_status IN {ACTIVE, FULFILLED}, sorted POLICE, FIRE, WATER, SEWER
        default: []

  - name: ServiceCommitment
    parent: null
    common_fields: true
    fields:
      - name: plan_of_services_id
        type: string
        source: input
        description: FK -> PlanOfServices.id; the plan this commitment belongs to
      - name: service_provider_id
        type: string
        source: input
        description: FK -> ServiceProvider.id; the department or authority committing capacity
      - name: service_type
        type: enum
        source: input
        description: Service being committed; must be a member of ServiceProvider.service_types
        constraints: POLICE | FIRE | WATER | SEWER
      - name: window_start_date
        type: string
        source: input
        description: First calendar day (YYYY-MM-DD) of the commitment window, inclusive
      - name: window_end_date
        type: string
        source: input
        description: Last calendar day (YYYY-MM-DD) of the commitment window, inclusive; must be >= window_start_date
      - name: timeline_days
        type: integer
        source: computed
        description: (window_end_date - window_start_date) in days + 1 — closed-interval day count
        default: 0
      - name: committed_account_count
        type: integer
        source: input
        description: Number of utility accounts of this service_type the provider commits to cut over; 0 for POLICE and FIRE
        default: 0
        constraints: x >= 0
      - name: activated_account_count
        type: integer
        source: computed
        description: Number of utility accounts of this service_type already cut over to inside-city service
        default: 0
      - name: cost_cents
        type: integer
        source: input
        description: Annual cost in cents of the committed service extension
        constraints: x >= 0
      - name: commitment_status
        type: enum
        source: system
        description: Commitment lifecycle
        default: DRAFT
        constraints: DRAFT | ACTIVE | FULFILLED | VOIDED

  - name: PublicHearing
    parent: null
    common_fields: true
    fields:
      - name: annexation_case_id
        type: string
        source: input
        description: FK -> AnnexationCase.id; the case being heard
      - name: municipality_id
        type: string
        source: input
        description: FK -> Municipality.id; the council chamber occupied by this hearing
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Start of the chamber occupation, inclusive
      - name: scheduled_end_at
        type: datetime
        source: input
        description: End of the chamber occupation, exclusive; must be > scheduled_start_at
      - name: protest_window_days
        type: integer
        source: input
        description: Days the written-objection period stays open after the hearing is held
        default: 30
        constraints: 1 <= x <= 120
      - name: hearing_status
        type: enum
        source: system
        description: Hearing lifecycle
        default: SCHEDULED
        constraints: SCHEDULED | HELD | VACATED
      - name: held_at
        type: datetime
        source: system
        description: Logical clock reading when the hearing was held
        default: null
      - name: notice_published_at
        type: datetime
        source: computed
        description: published_at of the latest NoticePublication of this hearing with notice_status == PUBLISHED, or null when none
        default: null
      - name: protest_opens_at
        type: datetime
        source: computed
        description: Equals held_at; start of the protest interval, inclusive
        default: null
      - name: protest_closes_at
        type: datetime
        source: computed
        description: held_at + protest_window_days; end of the protest interval, inclusive
        default: null
      - name: protest_pct
        type: number
        source: computed
        description: Protest percentage on the statute's protest_basis, 2 decimal places
        default: 0
      - name: protest_outcome
        type: enum
        source: system
        description: Protest evaluation result, set when the protest period closes
        default: OPEN
        constraints: OPEN | FAILED | SUSTAINED

  - name: NoticePublication
    parent: null
    common_fields: false
    fields:
      - name: public_hearing_id
        type: string
        source: input
        description: FK -> PublicHearing.id; the hearing this notice announces
      - name: publication_type
        type: enum
        source: input
        description: Statutory notice channel
        constraints: NEWSPAPER | MAILED | POSTED
      - name: published_at
        type: datetime
        source: system
        description: Logical clock reading when the notice was published; start of the notice window
      - name: notice_status
        type: enum
        source: system
        description: Whether the notice still supports its hearing; mutated only by cascade, never by a client
        default: PUBLISHED
        constraints: PUBLISHED | SUPERSEDED

  - name: ProtestFiling
    parent: null
    common_fields: true
    fields:
      - name: public_hearing_id
        type: string
        source: input
        description: FK -> PublicHearing.id; the hearing whose protest period receives this filing
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the parcel whose interest is protesting
      - name: property_owner_id
        type: string
        source: input
        description: FK -> PropertyOwner.id; the protesting owner
      - name: ownership_share_pct
        type: number
        source: input
        description: Percentage of the parcel's ownership interest this filing represents
        constraints: 0 < x <= 100; 2 decimal places
      - name: filing_status
        type: enum
        source: system
        description: Whether the filing counts toward the protest percentage
        default: FILED
        constraints: FILED | WITHDRAWN
      - name: filed_at
        type: datetime
        source: system
        description: Logical clock reading when the filing was received
      - name: protest_value_cents
        type: integer
        source: computed
        description: round_half_up(Parcel.assessed_value_cents * ownership_share_pct / 100) — per-filing rounded value entering the protest sum
        default: 0

  - name: UtilityAccount
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK -> Parcel.id; the served parcel
      - name: service_provider_id
        type: string
        source: input
        description: FK -> ServiceProvider.id; the utility authority serving the account
      - name: service_type
        type: enum
        source: input
        description: Utility service delivered on this account
        constraints: WATER | SEWER
      - name: monthly_base_cents
        type: integer
        source: input
        description: Inside-city monthly base charge in cents
        constraints: x > 0
      - name: rate_schedule
        type: enum
        source: system
        description: Rate schedule currently applied to the account
        default: OUTSIDE_CITY_SURCHARGE
        constraints: OUTSIDE_CITY_SURCHARGE | INSIDE_CITY
      - name: account_status
        type: enum
        source: system
        description: Utility transition dimension of the account
        default: OUTSIDE_CITY
        constraints: OUTSIDE_CITY | INSIDE_CITY_PENDING_TRANSITION | INSIDE_CITY_ACTIVE | DISCONNECTED
      - name: effective_monthly_cents
        type: integer
        source: computed
        description: round_half_up(monthly_base_cents * (1 + Municipality.utility_outside_surcharge_pct)) while rate_schedule == OUTSIDE_CITY_SURCHARGE, else monthly_base_cents
        default: 0

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: AnnexationCase
    initial_state: DRAFT
    terminal_states: [DENIED, MSD_ALTERNATIVE_ADOPTED, DE_ANNEXED]
    note: |
      Two independent dimensions live on this row. `status` (transitions tagged
      `dimension: status`) is the procedural axis and carries the statutory cure cycle
      SUFFICIENCY_REVIEW -> PETITION_CIRCULATING -> SUFFICIENCY_REVIEW plus method-dependent
      branching at ordinance adoption. `tax_roll_status` (transitions tagged
      `dimension: tax_roll_status`, initialised NOT_TRANSFERRED) is the fiscal axis advanced
      only by the county assessor and by de-annexation reversal.
    transitions:
      - from: DRAFT
        to: TERRITORY_CERTIFIED
        trigger: "POST /annexation-cases/{caseId}/certify-territory"
        actor: MunicipalPlanner
        preconditions:
          - "case.status == DRAFT"
          - "case.parcel_count >= 1 — for an ANNEXATION case at least one own Parcel with parcel_status IN {PROPOSED, PENDING_ANNEX}; for a DE_ANNEXATION case at least one INCORPORATED Parcel on the predecessor"
          - "case.method IN StatuteProfile.authorized_methods of the governing statute"
          - "case_type == DE_ANNEXATION requires AnnexationCase[predecessor_case_id].status == EFFECTIVE and StatuteProfile.de_annexation_allowed == true"
          - "calculations.territory_qualification: contiguity_ratio >= StatuteProfile.contiguity_min_ratio"
          - "calculations.territory_qualification: urban_development_qualified == true"
          - "calculations.territory_qualification: qualification_index >= StatuteProfile.min_qualification_index"
        side_effects:
          - "recompute case.parcel_count, case.territory_acreage, case.territory_assessed_value_cents"
          - "stamp case.contiguity_ratio, case.urban_development_qualified, case.qualification_index (calculations.territory_qualification)"
          - "every Parcel of the case with parcel_status == PROPOSED -> PENDING_ANNEX"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: TERRITORY_CERTIFIED
        to: PETITION_CIRCULATING
        trigger: "POST /petitions"
        actor: MunicipalPlanner
        preconditions:
          - "case.status == TERRITORY_CERTIFIED"
          - "case.method IN {PETITION_100, PETITION_MAJORITY}"
          - "no Petition of the case has sufficiency_status IN {CIRCULATING, SUFFICIENT}"
        side_effects:
          - "Petition created with sufficiency_status CIRCULATING, circulation_started_at = logical clock, circulation_deadline_at = circulation_started_at + circulation_days"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: PETITION_CIRCULATING
        to: PETITION_CIRCULATING
        trigger: "POST /petitions (re-circulation after the prior petition lapsed)"
        actor: MunicipalPlanner
        preconditions:
          - "case.status == PETITION_CIRCULATING"
          - "case.method IN {PETITION_100, PETITION_MAJORITY}"
          - "no Petition of the case has sufficiency_status IN {CIRCULATING, SUFFICIENT} — every prior petition is EXPIRED or INSUFFICIENT"
        side_effects:
          - "a fresh Petition is created with sufficiency_status CIRCULATING and a new circulation window measured from the logical clock"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; self-loop — the city may re-circulate after a petition expires, and a second live petition is refused with ERR_PETITION_ALREADY_CIRCULATING"

      - from: PETITION_CIRCULATING
        to: SUFFICIENCY_REVIEW
        trigger: "POST /petitions/{petitionId}/certify-sufficiency (threshold met)"
        actor: CityClerk
        preconditions:
          - "petition.sufficiency_status IN {CIRCULATING, INSUFFICIENT}"
          - "logical clock <= petition.circulation_deadline_at"
          - "calculations.petition_sufficiency threshold met for petition_type"
        side_effects:
          - "petition.sufficiency_status -> SUFFICIENT and qualified_* / signature_*_pct fields stamped"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: SUFFICIENCY_REVIEW
        to: PETITION_CIRCULATING
        trigger: "system — cascade from POST /parcel-owner-consents/{consentId}/withdraw when the petition falls below its threshold"
        actor: system
        preconditions:
          - "petition.sufficiency_status == SUFFICIENT before the withdrawal"
          - "calculations.petition_sufficiency threshold no longer met after the withdrawal"
        side_effects:
          - "petition.sufficiency_status -> INSUFFICIENT"
          - "every PublicHearing of the case with hearing_status == SCHEDULED -> VACATED"
          - "every NoticePublication of those hearings with notice_status == PUBLISHED -> SUPERSEDED and hearing.notice_published_at -> null"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; statutory cure cycle — the petition may be re-certified after new consents"

      - from: HEARING_NOTICED
        to: PETITION_CIRCULATING
        trigger: "system — cascade from POST /parcel-owner-consents/{consentId}/withdraw when the petition falls below its threshold"
        actor: system
        preconditions:
          - "petition.sufficiency_status == SUFFICIENT before the withdrawal"
          - "calculations.petition_sufficiency threshold no longer met after the withdrawal"
        side_effects:
          - "petition.sufficiency_status -> INSUFFICIENT"
          - "every PublicHearing of the case with hearing_status == SCHEDULED -> VACATED"
          - "every NoticePublication of those hearings with notice_status == PUBLISHED -> SUPERSEDED and hearing.notice_published_at -> null"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; same cure cycle reached one step later"

      - from: SUFFICIENCY_REVIEW
        to: HEARING_NOTICED
        trigger: "POST /public-hearings/{hearingId}/notice-publications"
        actor: CityClerk
        preconditions:
          - "case.status IN {SUFFICIENCY_REVIEW, TERRITORY_CERTIFIED}"
          - "hearing.hearing_status == SCHEDULED"
          - "a PlanOfServices of the case has adoption_status == ADOPTED"
        side_effects:
          - "NoticePublication created with notice_status PUBLISHED, published_at = logical clock"
          - "hearing.notice_published_at = published_at"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: TERRITORY_CERTIFIED
        to: HEARING_NOTICED
        trigger: "POST /public-hearings/{hearingId}/notice-publications"
        actor: CityClerk
        preconditions:
          - "case.method IN {REFERENDUM, INVOLUNTARY_ORDINANCE} (no petition limb)"
          - "hearing.hearing_status == SCHEDULED"
          - "a PlanOfServices of the case has adoption_status == ADOPTED"
        side_effects:
          - "NoticePublication created with notice_status PUBLISHED, published_at = logical clock"
          - "hearing.notice_published_at = published_at"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; involuntary and referendum methods skip the petition limb entirely"

      - from: HEARING_NOTICED
        to: HEARING_HELD
        trigger: "POST /public-hearings/{hearingId}/hold"
        actor: CityClerk
        preconditions:
          - "hearing.hearing_status == SCHEDULED and hearing.notice_published_at != null"
          - "logical clock >= hearing.notice_published_at + StatuteProfile.notice_min_days days"
          - "logical clock >= hearing.scheduled_start_at"
          - "no other PublicHearing of the case has hearing_status == HELD"
        side_effects:
          - "hearing.hearing_status -> HELD, held_at = logical clock"
          - "hearing.protest_opens_at = held_at, hearing.protest_closes_at = held_at + protest_window_days days, hearing.protest_outcome = OPEN"
          - "case.hearing_held_at = held_at"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: HEARING_HELD
        to: PROTEST_SUSTAINED
        trigger: "POST /public-hearings/{hearingId}/close-protest-period (protest_pct >= threshold)"
        actor: CityClerk
        preconditions:
          - "hearing.hearing_status == HELD and hearing.protest_outcome == OPEN"
          - "logical clock > hearing.protest_closes_at"
          - "calculations.protest_evaluation yields protest_pct >= StatuteProfile.protest_threshold_pct"
        side_effects:
          - "hearing.protest_pct stamped, hearing.protest_outcome -> SUSTAINED"
          - "case.protest_pct = hearing.protest_pct, case.protest_outcome -> SUSTAINED"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; branch A of the protest fork"

      - from: HEARING_HELD
        to: HEARING_HELD
        trigger: "POST /public-hearings/{hearingId}/close-protest-period (protest_pct < threshold)"
        actor: CityClerk
        preconditions:
          - "hearing.hearing_status == HELD and hearing.protest_outcome == OPEN"
          - "logical clock > hearing.protest_closes_at"
          - "calculations.protest_evaluation yields protest_pct < StatuteProfile.protest_threshold_pct"
        side_effects:
          - "hearing.protest_pct stamped, hearing.protest_outcome -> FAILED"
          - "case.protest_pct = hearing.protest_pct, case.protest_outcome -> FAILED (case.status unchanged)"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; branch B of the protest fork — the case stays HEARING_HELD and becomes adoptable"

      - from: HEARING_HELD
        to: ORDINANCE_ADOPTED
        trigger: "POST /annexation-cases/{caseId}/adopt-ordinance (no referendum required)"
        actor: CityClerk
        preconditions:
          - "case.status == HEARING_HELD and case.protest_outcome == FAILED"
          - "logical clock >= case.hearing_held_at + StatuteProfile.hearing_to_ordinance_min_days days"
          - "a PlanOfServices of the case has adoption_status == ADOPTED"
          - "a FiscalImpactAnalysis of the case has status == FINALIZED"
          - "that analysis.deficit_ratio_pct <= Municipality.fiscal_deficit_tolerance_pct"
          - "case.method IN StatuteProfile.authorized_methods"
          - "case.method NOT IN StatuteProfile.referendum_required_methods"
        side_effects:
          - "case.ordinance_adopted_at = logical clock"
          - "case.commission_review_status -> PENDING when StatuteProfile.boundary_commission_required == true, else NOT_REQUIRED"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: HEARING_HELD
        to: REFERENDUM_PENDING
        trigger: "POST /annexation-cases/{caseId}/adopt-ordinance (referendum required)"
        actor: CityClerk
        preconditions:
          - "same preconditions as HEARING_HELD -> ORDINANCE_ADOPTED"
          - "case.method IN StatuteProfile.referendum_required_methods"
        side_effects:
          - "case.ordinance_adopted_at = logical clock"
          - "case.referendum_result stays NOT_HELD until recorded"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; method-driven branch of ordinance adoption"

      - from: REFERENDUM_PENDING
        to: REFERENDUM_APPROVED
        trigger: "POST /annexation-cases/{caseId}/record-referendum {result: APPROVED}"
        actor: CityClerk
        preconditions:
          - "case.status == REFERENDUM_PENDING"
        side_effects:
          - "case.referendum_result -> APPROVED"
          - "case.commission_review_status -> PENDING when StatuteProfile.boundary_commission_required == true"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: REFERENDUM_PENDING
        to: DENIED
        trigger: "POST /annexation-cases/{caseId}/record-referendum {result: REJECTED}"
        actor: CityClerk
        preconditions:
          - "case.status == REFERENDUM_PENDING"
        side_effects:
          - "case.referendum_result -> REJECTED"
          - "every Parcel of the case with parcel_status == PENDING_ANNEX -> EXCLUDED"
          - "every PlanOfServices of the case with adoption_status == ADOPTED -> RESCINDED"
          - "because the plan was rescinded: every ServiceCommitment of that plan with commitment_status IN {DRAFT, ACTIVE, FULFILLED} -> VOIDED"
          - "because those commitments were voided: ServiceProvider.encumbered_capacity_days released by each voided commitment's timeline_days, plan.committed_cost_cents and plan.covered_service_types recomputed, plan.service_readiness -> PENDING"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; terminal denial cascade"

      - from: ORDINANCE_ADOPTED
        to: COMMISSION_REVIEW
        trigger: "POST /annexation-cases/{caseId}/submit-to-commission"
        actor: MunicipalPlanner
        preconditions:
          - "case.status IN {ORDINANCE_ADOPTED, REFERENDUM_APPROVED}"
          - "StatuteProfile.boundary_commission_required == true"
          - "case.commission_review_status == PENDING"
        side_effects:
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: REFERENDUM_APPROVED
        to: COMMISSION_REVIEW
        trigger: "POST /annexation-cases/{caseId}/submit-to-commission"
        actor: MunicipalPlanner
        preconditions:
          - "case.status == REFERENDUM_APPROVED"
          - "StatuteProfile.boundary_commission_required == true"
          - "case.commission_review_status == PENDING"
        side_effects:
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: COMMISSION_REVIEW
        to: COMMISSION_APPROVED
        trigger: "POST /annexation-cases/{caseId}/commission-decision {decision: APPROVED}"
        actor: BoundaryCommissioner
        preconditions:
          - "case.status == COMMISSION_REVIEW and case.commission_review_status == PENDING"
          - "X-User-ID != case.fiscal_finalized_by_user_id (segregation of duties)"
        side_effects:
          - "case.commission_review_status -> APPROVED"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: COMMISSION_REVIEW
        to: DENIED
        trigger: "POST /annexation-cases/{caseId}/commission-decision {decision: DENIED}"
        actor: BoundaryCommissioner
        preconditions:
          - "case.status == COMMISSION_REVIEW and case.commission_review_status == PENDING"
          - "X-User-ID != case.fiscal_finalized_by_user_id (segregation of duties)"
        side_effects:
          - "case.commission_review_status -> DENIED"
          - "every Parcel of the case with parcel_status == PENDING_ANNEX -> EXCLUDED"
          - "every PlanOfServices of the case with adoption_status == ADOPTED -> RESCINDED"
          - "because the plan was rescinded: every ServiceCommitment of that plan with commitment_status IN {DRAFT, ACTIVE, FULFILLED} -> VOIDED"
          - "because those commitments were voided: ServiceProvider.encumbered_capacity_days released, plan.committed_cost_cents recomputed, plan.service_readiness -> PENDING"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: ORDINANCE_ADOPTED
        to: EFFECTIVE
        trigger: "POST /annexation-cases/{caseId}/effectuate"
        actor: MunicipalPlanner
        preconditions:
          - "case.status IN {ORDINANCE_ADOPTED, REFERENDUM_APPROVED, COMMISSION_APPROVED}"
          - "StatuteProfile.boundary_commission_required == false OR case.commission_review_status == APPROVED"
          - "case.method NOT IN StatuteProfile.referendum_required_methods OR case.referendum_result == APPROVED"
          - "effective_date satisfies StatuteProfile.effective_date_rule (calculations.effective_date_admissibility)"
        side_effects:
          - "case.status -> EFFECTIVE, case.effective_date stamped"
          - "L2 because the case became EFFECTIVE: every Parcel of the case with parcel_status == PENDING_ANNEX -> INCORPORATED (a DE_ANNEXATION case owns no parcels, so this link is a no-op for it and the predecessor cascade runs instead)"
          - "L3 because those parcels became INCORPORATED: each of their UtilityAccount rows with account_status == OUTSIDE_CITY -> INSIDE_CITY_PENDING_TRANSITION, rate_schedule -> INSIDE_CITY, effective_monthly_cents recomputed (surcharge dropped)"
          - "L4 because those accounts entered INSIDE_CITY_PENDING_TRANSITION: for each account, the ServiceCommitment on the case's ADOPTED plan with commitment_status == ACTIVE, matching service_type and service_provider_id has activated_account_count incremented by 1; when activated_account_count >= committed_account_count it becomes FULFILLED"
          - "L5 because those commitments became FULFILLED: plan.covered_service_types and plan.service_readiness recomputed (calculations.plan_service_readiness)"
          - "L6 because plan.service_readiness became READY: every UtilityAccount of the case in INSIDE_CITY_PENDING_TRANSITION whose service_type commitment is FULFILLED -> INSIDE_CITY_ACTIVE"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; six-link transitive cascade"

      - from: REFERENDUM_APPROVED
        to: EFFECTIVE
        trigger: "POST /annexation-cases/{caseId}/effectuate"
        actor: MunicipalPlanner
        preconditions:
          - "same preconditions as ORDINANCE_ADOPTED -> EFFECTIVE"
        side_effects:
          - "identical six-link cascade as ORDINANCE_ADOPTED -> EFFECTIVE"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: COMMISSION_APPROVED
        to: EFFECTIVE
        trigger: "POST /annexation-cases/{caseId}/effectuate"
        actor: MunicipalPlanner
        preconditions:
          - "same preconditions as ORDINANCE_ADOPTED -> EFFECTIVE"
        side_effects:
          - "identical six-link cascade as ORDINANCE_ADOPTED -> EFFECTIVE"
          - "when case_type == DE_ANNEXATION: the predecessor cascade in AnnexationCase EFFECTIVE -> DE_ANNEXED also runs"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status"

      - from: PROTEST_SUSTAINED
        to: MSD_ALTERNATIVE_ADOPTED
        trigger: "POST /annexation-cases/{caseId}/adopt-msd-alternative"
        actor: CityClerk
        preconditions:
          - "case.status == PROTEST_SUSTAINED"
          - "StatuteProfile.msd_alternative_allowed == true"
          - "a PlanOfServices of the case has adoption_status == ADOPTED"
        side_effects:
          - "case.msd_annual_assessment_cents = calculations.msd_assessment"
          - "every Parcel of the case with parcel_status == PENDING_ANNEX -> EXCLUDED"
          - "because those parcels were excluded: their UtilityAccount rows with account_status == OUTSIDE_CITY -> DISCONNECTED"
          - "increments AnnexationCase.version by 1"
        note: "dimension: status; the municipal service district replaces annexation without a boundary change"

      - from: EFFECTIVE
        to: DE_ANNEXED
        trigger: "system — cascade from POST /annexation-cases/{deAnnexCaseId}/effectuate on a DE_ANNEXATION case whose predecessor_case_id is this case"
        actor: system
        preconditions:
          - "this case.status == EFFECTIVE"
          - "successor case.case_type == DE_ANNEXATION and successor.predecessor_case_id == this case.id"
        side_effects:
          - "L2 because the successor became EFFECTIVE: this case.status -> DE_ANNEXED"
          - "L3 because this case became DE_ANNEXED: every Parcel of this case with parcel_status == INCORPORATED -> DE_ANNEXED"
          - "L4 because those parcels were de-annexed: their UtilityAccount rows with account_status IN {INSIDE_CITY_PENDING_TRANSITION, INSIDE_CITY_ACTIVE} -> OUTSIDE_CITY, rate_schedule -> OUTSIDE_CITY_SURCHARGE, effective_monthly_cents recomputed (surcharge restored)"
          - "L5 because this case was de-annexed while tax_roll_status == POSTED: tax_roll_status -> REVERSED, Municipality.taxable_assessed_value_cents decremented by this case.tax_roll_transferred_assessed_value_cents, successor.de_annexation_refund_cents = calculations.de_annexation_refund"
          - "increments AnnexationCase.version by 1 on both cases"
        note: "dimension: status; self-referential predecessor cascade"

      - from: NOT_TRANSFERRED
        to: POSTED
        trigger: "POST /annexation-cases/{caseId}/post-tax-roll"
        actor: CountyAssessor
        preconditions:
          - "case.status == EFFECTIVE"
          - "case.tax_roll_status == NOT_TRANSFERRED"
        side_effects:
          - "calculations.tax_roll_proration stamps Parcel.annual_tax_cents and Parcel.prorated_tax_cents on every INCORPORATED parcel"
          - "case.tax_roll_transferred_assessed_value_cents and case.tax_roll_transferred_tax_cents stamped"
          - "Municipality.taxable_assessed_value_cents incremented by case.tax_roll_transferred_assessed_value_cents"
          - "increments AnnexationCase.version by 1"
        note: "dimension: tax_roll_status"

      - from: POSTED
        to: REVERSED
        trigger: "system — cascade from the successor DE_ANNEXATION case becoming EFFECTIVE"
        actor: system
        preconditions:
          - "case.tax_roll_status == POSTED"
          - "case.status transitions to DE_ANNEXED in the same cascade"
        side_effects:
          - "Municipality.taxable_assessed_value_cents decremented by case.tax_roll_transferred_assessed_value_cents"
          - "successor.de_annexation_refund_cents = calculations.de_annexation_refund"
        note: "dimension: tax_roll_status"

  - entity: Petition
    initial_state: CIRCULATING
    terminal_states: [EXPIRED]
    transitions:
      - from: CIRCULATING
        to: SUFFICIENT
        trigger: "POST /petitions/{petitionId}/certify-sufficiency"
        actor: CityClerk
        preconditions:
          - "petition.sufficiency_status == CIRCULATING"
          - "logical clock <= petition.circulation_deadline_at"
          - "calculations.petition_sufficiency threshold met"
        side_effects:
          - "qualified_signature_assessed_value_cents, qualified_signature_owner_count, signature_value_pct, signature_owner_pct stamped"
          - "case.status -> SUFFICIENCY_REVIEW"
      - from: INSUFFICIENT
        to: SUFFICIENT
        trigger: "POST /petitions/{petitionId}/certify-sufficiency"
        actor: CityClerk
        preconditions:
          - "petition.sufficiency_status == INSUFFICIENT"
          - "logical clock <= petition.circulation_deadline_at"
          - "calculations.petition_sufficiency threshold met again after new consents"
        side_effects:
          - "qualified_* and signature_*_pct restamped"
          - "case.status -> SUFFICIENCY_REVIEW"
        note: "re-certification limb of the cure cycle"
      - from: SUFFICIENT
        to: INSUFFICIENT
        trigger: "system — cascade from POST /parcel-owner-consents/{consentId}/withdraw"
        actor: system
        preconditions:
          - "petition.sufficiency_status == SUFFICIENT"
          - "recomputed calculations.petition_sufficiency no longer meets the threshold"
        side_effects:
          - "qualified_* and signature_*_pct restamped"
          - "case.status -> PETITION_CIRCULATING and the case's SCHEDULED hearings are vacated"
      - from: CIRCULATING
        to: EXPIRED
        trigger: "POST /petitions/{petitionId}/certify-sufficiency after circulation_deadline_at"
        actor: CityClerk
        preconditions:
          - "petition.sufficiency_status IN {CIRCULATING, INSUFFICIENT}"
          - "logical clock > petition.circulation_deadline_at"
        side_effects:
          - "petition.sufficiency_status -> EXPIRED; case.status unchanged"
        note: "terminal — an EXPIRED petition can never be certified again"
      - from: INSUFFICIENT
        to: EXPIRED
        trigger: "POST /petitions/{petitionId}/certify-sufficiency after circulation_deadline_at"
        actor: CityClerk
        preconditions:
          - "petition.sufficiency_status == INSUFFICIENT"
          - "logical clock > petition.circulation_deadline_at"
        side_effects:
          - "petition.sufficiency_status -> EXPIRED; case.status unchanged"

  - entity: PlanOfServices
    initial_state: DRAFT
    terminal_states: [RESCINDED]
    note: |
      Two independent dimensions on one row: `adoption_status` (DRAFT -> ADOPTED -> RESCINDED),
      driven by the clerk, and `service_readiness` (PENDING <-> PARTIAL <-> READY), derived from
      the plan's commitments. A plan can be ADOPTED while still PENDING, and READY while still
      DRAFT — neither axis gates the other.
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /plans-of-services/{planId}/adopt"
        actor: CityClerk
        preconditions:
          - "plan.adoption_status == DRAFT"
          - "case.status IN {TERRITORY_CERTIFIED, PETITION_CIRCULATING, SUFFICIENCY_REVIEW, HEARING_NOTICED, HEARING_HELD}"
          - "plan.covered_service_types contains every member of StatuteProfile.required_service_types"
          - "every ServiceCommitment of the plan with commitment_status IN {ACTIVE, FULFILLED} has timeline_days <= the statutory maximum for its service_type"
          - "no other PlanOfServices of the case has adoption_status == ADOPTED"
        side_effects:
          - "plan.adopted_at = logical clock"
          - "increments PlanOfServices.version by 1"
        note: "dimension: adoption_status"
      - from: ADOPTED
        to: RESCINDED
        trigger: "system — cascade from case DENIED (referendum rejection or commission denial)"
        actor: system
        preconditions:
          - "plan.adoption_status == ADOPTED"
          - "case.status transitions to DENIED"
        side_effects:
          - "every ServiceCommitment of the plan with commitment_status IN {DRAFT, ACTIVE, FULFILLED} -> VOIDED"
          - "plan.committed_cost_cents -> 0, plan.covered_service_types -> [], plan.service_readiness -> PENDING"
        note: "dimension: adoption_status"
      - from: PENDING
        to: PARTIAL
        trigger: "system — POST /service-commitments/{commitmentId}/activate"
        actor: system
        preconditions:
          - "plan.service_readiness == PENDING"
          - "calculations.plan_service_readiness yields PARTIAL"
        side_effects:
          - "plan.committed_cost_cents and plan.covered_service_types recomputed"
        note: "dimension: service_readiness"
      - from: PARTIAL
        to: READY
        trigger: "system — a commitment becomes FULFILLED (at activation when committed_account_count == 0, or during the effectuate cascade)"
        actor: system
        preconditions:
          - "plan.service_readiness == PARTIAL"
          - "calculations.plan_service_readiness yields READY"
        side_effects:
          - "every UtilityAccount of the case in INSIDE_CITY_PENDING_TRANSITION whose service_type commitment is FULFILLED -> INSIDE_CITY_ACTIVE"
        note: "dimension: service_readiness"
      - from: READY
        to: PARTIAL
        trigger: "system — POST /service-commitments/{commitmentId}/void"
        actor: system
        preconditions:
          - "plan.service_readiness == READY"
          - "calculations.plan_service_readiness yields PARTIAL after the void"
        side_effects:
          - "plan.committed_cost_cents and plan.covered_service_types recomputed"
        note: "dimension: service_readiness"
      - from: PARTIAL
        to: PENDING
        trigger: "system — POST /service-commitments/{commitmentId}/void removing the last ACTIVE/FULFILLED commitment"
        actor: system
        preconditions:
          - "plan.service_readiness == PARTIAL"
          - "no ServiceCommitment of the plan has commitment_status IN {ACTIVE, FULFILLED} after the void"
        side_effects:
          - "plan.committed_cost_cents -> 0, plan.covered_service_types -> []"
        note: "dimension: service_readiness"

  - entity: ServiceCommitment
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /service-commitments/{commitmentId}/activate"
        actor: MunicipalPlanner
        preconditions:
          - "commitment.commitment_status == DRAFT"
          - "commitment.service_type IN ServiceProvider.service_types"
          - "commitment.timeline_days <= the statutory maximum for its service_type"
          - "calculations.provider_capacity_encumbrance finds no calendar day in the closed window where concurrent ACTIVE/FULFILLED commitments would exceed ServiceProvider.concurrent_project_capacity"
        side_effects:
          - "ServiceProvider.encumbered_capacity_days incremented by commitment.timeline_days"
          - "plan.committed_cost_cents, plan.covered_service_types, plan.service_readiness recomputed"
          - "when commitment.committed_account_count == 0 the commitment immediately auto-transitions ACTIVE -> FULFILLED"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system — activation with committed_account_count == 0, or the effectuate cascade cutting over the last committed account"
        actor: system
        preconditions:
          - "commitment.commitment_status == ACTIVE"
          - "commitment.activated_account_count >= commitment.committed_account_count"
        side_effects:
          - "plan.service_readiness recomputed (calculations.plan_service_readiness)"
      - from: DRAFT
        to: VOIDED
        trigger: "system — POST /service-commitments supersedes the plan's existing DRAFT commitment of the same service_type"
        actor: system
        preconditions:
          - "an existing commitment of the same plan_of_services_id and service_type has commitment_status == DRAFT"
        side_effects:
          - "no capacity release (a DRAFT commitment never encumbered capacity)"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /service-commitments/{commitmentId}/void"
        actor: MunicipalPlanner
        preconditions:
          - "commitment.commitment_status IN {DRAFT, ACTIVE, FULFILLED}"
          - "case.status NOT IN {EFFECTIVE, DE_ANNEXED}"
        side_effects:
          - "ServiceProvider.encumbered_capacity_days decremented by commitment.timeline_days"
          - "plan.committed_cost_cents and plan.covered_service_types recomputed"
          - "plan.service_readiness recomputed (READY -> PARTIAL, or PARTIAL -> PENDING when nothing remains)"
      - from: FULFILLED
        to: VOIDED
        trigger: "POST /service-commitments/{commitmentId}/void"
        actor: MunicipalPlanner
        preconditions:
          - "commitment.commitment_status == FULFILLED"
          - "case.status NOT IN {EFFECTIVE, DE_ANNEXED}"
        side_effects:
          - "ServiceProvider.encumbered_capacity_days decremented by commitment.timeline_days"
          - "plan.committed_cost_cents, plan.covered_service_types, plan.service_readiness recomputed"

  - entity: PublicHearing
    initial_state: SCHEDULED
    terminal_states: [VACATED]
    note: |
      `hearing_status` is the lifecycle axis; `protest_outcome` (OPEN -> FAILED | SUSTAINED)
      is a second axis that only advances while hearing_status == HELD.
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /public-hearings/{hearingId}/hold"
        actor: CityClerk
        preconditions:
          - "hearing.hearing_status == SCHEDULED"
          - "hearing.notice_published_at != null and logical clock >= notice_published_at + StatuteProfile.notice_min_days days"
          - "logical clock >= hearing.scheduled_start_at"
          - "case.status == HEARING_NOTICED"
        side_effects:
          - "held_at, protest_opens_at, protest_closes_at stamped; protest_outcome = OPEN"
          - "case.status -> HEARING_HELD and case.hearing_held_at stamped"
      - from: SCHEDULED
        to: VACATED
        trigger: "system — cascade from POST /parcel-owner-consents/{consentId}/withdraw dropping the petition below its threshold"
        actor: system
        preconditions:
          - "hearing.hearing_status == SCHEDULED"
          - "the case's petition transitions SUFFICIENT -> INSUFFICIENT"
        side_effects:
          - "every NoticePublication of this hearing with notice_status == PUBLISHED -> SUPERSEDED"
          - "hearing.notice_published_at -> null; the council-chamber occupation is released so the slot can be rescheduled"
      - from: OPEN
        to: FAILED
        trigger: "POST /public-hearings/{hearingId}/close-protest-period"
        actor: CityClerk
        preconditions:
          - "hearing.hearing_status == HELD and protest_outcome == OPEN"
          - "logical clock > hearing.protest_closes_at"
          - "calculations.protest_evaluation yields protest_pct < StatuteProfile.protest_threshold_pct"
        side_effects:
          - "hearing.protest_pct stamped; case.protest_outcome -> FAILED"
        note: "dimension: protest_outcome"
      - from: OPEN
        to: SUSTAINED
        trigger: "POST /public-hearings/{hearingId}/close-protest-period"
        actor: CityClerk
        preconditions:
          - "hearing.hearing_status == HELD and protest_outcome == OPEN"
          - "logical clock > hearing.protest_closes_at"
          - "calculations.protest_evaluation yields protest_pct >= StatuteProfile.protest_threshold_pct"
        side_effects:
          - "hearing.protest_pct stamped; case.protest_outcome -> SUSTAINED and case.status -> PROTEST_SUSTAINED"
        note: "dimension: protest_outcome"

  - entity: UtilityAccount
    initial_state: OUTSIDE_CITY
    terminal_states: [DISCONNECTED]
    transitions:
      - from: OUTSIDE_CITY
        to: INSIDE_CITY_PENDING_TRANSITION
        trigger: "system — link 3 of the effectuate cascade, caused by the account's parcel becoming INCORPORATED"
        actor: system
        preconditions:
          - "account.account_status == OUTSIDE_CITY"
          - "Parcel[account.parcel_id].parcel_status transitions PENDING_ANNEX -> INCORPORATED"
        side_effects:
          - "rate_schedule -> INSIDE_CITY and effective_monthly_cents recomputed to monthly_base_cents"
          - "the matching ACTIVE ServiceCommitment's activated_account_count incremented by 1"
      - from: INSIDE_CITY_PENDING_TRANSITION
        to: INSIDE_CITY_ACTIVE
        trigger: "system — link 6 of the effectuate cascade, caused by plan.service_readiness becoming READY"
        actor: system
        preconditions:
          - "account.account_status == INSIDE_CITY_PENDING_TRANSITION"
          - "the ServiceCommitment covering this account's service_type has commitment_status == FULFILLED"
        side_effects: []
      - from: INSIDE_CITY_ACTIVE
        to: OUTSIDE_CITY
        trigger: "system — de-annexation cascade, caused by the account's parcel becoming DE_ANNEXED"
        actor: system
        preconditions:
          - "account.account_status IN {INSIDE_CITY_PENDING_TRANSITION, INSIDE_CITY_ACTIVE}"
          - "Parcel[account.parcel_id].parcel_status transitions INCORPORATED -> DE_ANNEXED"
        side_effects:
          - "rate_schedule -> OUTSIDE_CITY_SURCHARGE and effective_monthly_cents recomputed with the surcharge"
        note: "closes the utility cycle OUTSIDE_CITY -> INSIDE_CITY_ACTIVE -> OUTSIDE_CITY"
      - from: OUTSIDE_CITY
        to: DISCONNECTED
        trigger: "POST /parcels/{parcelId}/exclude, or the MSD-alternative cascade excluding the parcel"
        actor: system
        preconditions:
          - "account.account_status == OUTSIDE_CITY"
          - "Parcel[account.parcel_id].parcel_status transitions to EXCLUDED"
        side_effects: []

  - entity: FiscalImpactAnalysis
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /fiscal-impact-analyses/{analysisId}/finalize"
        actor: FiscalAnalyst
        preconditions:
          - "analysis.status == DRAFT"
          - "case.status NOT IN {EFFECTIVE, DENIED, MSD_ALTERNATIVE_ADOPTED, DE_ANNEXED}"
          - "no other FiscalImpactAnalysis of the case has status == FINALIZED"
        side_effects:
          - "analysis.finalized_by_user_id = X-User-ID; case.fiscal_finalized_by_user_id = X-User-ID"
          - "increments AnnexationCase.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system — POST /fiscal-impact-analyses creates a newer analysis for the same case"
        actor: system
        preconditions:
          - "analysis.status IN {DRAFT, FINALIZED}"
        side_effects:
          - "case.fiscal_finalized_by_user_id -> null when the superseded analysis was the FINALIZED one"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system — POST /fiscal-impact-analyses creates a newer analysis for the same case"
        actor: system
        preconditions:
          - "analysis.status == FINALIZED"
        side_effects:
          - "case.fiscal_finalized_by_user_id -> null"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — only sanctioned mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: analysis-create-stale-case
    parent_entity: AnnexationCase
    write_endpoint: "POST /fiscal-impact-analyses"
    occ_field: "expected_case_version"
    description: |
      Creating a FiscalImpactAnalysis against an AnnexationCase whose version has advanced since
      the client last observed it is rejected. A new analysis legitimately supersedes every prior
      analysis of the case (and clears case.fiscal_finalized_by_user_id), so a writer holding a
      stale view of the case would silently discard an analysis it never saw.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: commitment-create-stale-plan
    parent_entity: PlanOfServices
    write_endpoint: "POST /service-commitments"
    occ_field: "expected_plan_of_services_version"
    description: |
      Creating a ServiceCommitment against a PlanOfServices whose version has advanced since the
      client last observed it is rejected. A new commitment legitimately supersedes the plan's
      existing DRAFT commitment for the same service_type, so a writer holding a stale view of the
      plan would void a commitment that was authored after its read.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: territory_qualification
    trigger: "POST /annexation-cases/{caseId}/certify-territory; also recomputed by POST /annexation-cases/{caseId}/parcels and POST /parcels/{parcelId}/exclude while case.status == DRAFT"
    algorithm: weighted_scoring
    formula: |
      # An ANNEXATION case owns its parcels. A DE_ANNEXATION case owns none: its territory IS
      # the predecessor's incorporated land, so the aggregates read through predecessor_case_id.
      territory_parcels = Parcel rows with annexation_case_id == case.id
                          AND parcel_status IN {PROPOSED, PENDING_ANNEX, INCORPORATED}
                          if case.case_type == ANNEXATION
                          else Parcel rows with annexation_case_id == case.predecessor_case_id
                          AND parcel_status == INCORPORATED
      parcel_count                   = count(territory_parcels)
      territory_acreage              = round_half_up(sum(p.acreage for p in territory_parcels), 2)
      territory_assessed_value_cents = sum(p.assessed_value_cents for p in territory_parcels)

      contiguity_ratio = round_half_up(case.shared_boundary_feet
                                       / Municipality.corporate_boundary_perimeter_feet, 4)
      developed_ratio  = round_half_up(case.developed_lot_count / max(case.total_lot_count, 1), 4)
      density          = round_half_up(case.dwelling_units / max(territory_acreage, 0.01), 4)

      urban_development_qualified =
            (developed_ratio >= StatuteProfile.subdivision_test_min_developed_ratio)
         OR (density         >= StatuteProfile.urban_density_min_units_per_acre)

      # Non-linear score: capped contiguity ramp, conditional bonus, conditional penalty,
      # step penalty on service distance.
      base             = 100.0 * min(1.0, contiguity_ratio
                                          / (2 * StatuteProfile.contiguity_min_ratio))
      urban_bonus      = 25.0 if urban_development_qualified else 0.0
      density_penalty  = 15.0 if (density < StatuteProfile.urban_density_min_units_per_acre
                                  AND developed_ratio < StatuteProfile.subdivision_test_min_developed_ratio)
                              else 0.0
      distance_penalty = 10.0 * max(0, ceil(case.max_service_distance_miles - 3))
      qualification_index = round_half_up(
            max(0.0, min(100.0, base + urban_bonus - density_penalty - distance_penalty)), 2)
    input_set: "For an ANNEXATION case: only its own parcels with parcel_status IN {PROPOSED, PENDING_ANNEX, INCORPORATED}. For a DE_ANNEXATION case: only the predecessor's parcels with parcel_status == INCORPORATED. EXCLUDED and DE_ANNEXED parcels never enter any territory aggregate."
    constants:
      DISTANCE_FREE_MILES: 3
      DISTANCE_PENALTY_PER_MILE: 10.0
      URBAN_BONUS: 25.0
      DENSITY_PENALTY: 15.0
      CONTIGUITY_RAMP_MULTIPLE: 2
    precision: "contiguity_ratio, developed_ratio, density: 4 decimals round_half_up; qualification_index: 2 decimals round_half_up; territory_acreage: 2 decimals round_half_up"

  - name: petition_sufficiency
    trigger: "POST /petitions/{petitionId}/certify-sufficiency; recomputed by POST /parcel-owner-consents and POST /parcel-owner-consents/{consentId}/withdraw"
    algorithm: aggregation
    formula: |
      qualifying = ParcelOwnerConsent rows with petition_id == petition.id
                   AND consent_status == SIGNED
                   AND signed_at >= petition.circulation_started_at
                   AND signed_at <= petition.circulation_deadline_at
      # PINNED ROUNDING ORDER: round each consent's share to whole cents FIRST, then sum.
      qualified_value_cents(c) = round_half_up(Parcel[c.parcel_id].assessed_value_cents
                                               * c.ownership_share_pct / 100)
      qualified_signature_assessed_value_cents = sum(qualified_value_cents(c) for c in qualifying)
      qualified_signature_owner_count = count(DISTINCT c.property_owner_id for c in qualifying)

      territory_owner_count = count(DISTINCT p.primary_owner_id for p in territory_parcels)
      signature_value_pct = round_half_up(qualified_signature_assessed_value_cents
                                          / case.territory_assessed_value_cents * 100, 2)
                            if case.territory_assessed_value_cents > 0 else 0.00
      signature_owner_pct = round_half_up(qualified_signature_owner_count
                                          / territory_owner_count * 100, 2)
                            if territory_owner_count > 0 else 0.00

      measured_pct = signature_value_pct if StatuteProfile.signature_basis == ASSESSED_VALUE
                     else signature_owner_pct
      threshold_met =
          (measured_pct >= 100.00)                                   if petition.petition_type == OWNER_100
          else (measured_pct >= StatuteProfile.signature_threshold_pct)
    input_set: "Only SIGNED consents dated inside the closed circulation interval [circulation_started_at, circulation_deadline_at]; WITHDRAWN consents and consents dated after the deadline are excluded."
    constants:
      OWNER_100_REQUIRED_PCT: 100.00
    precision: "per-consent value rounded to whole cents (round_half_up) BEFORE summation; percentages 2 decimals round_half_up"

  - name: fiscal_impact_projection
    trigger: "POST /fiscal-impact-analyses (stamped on creation); re-evaluated only by creating a new analysis"
    algorithm: tiered_pricing
    formula: |
      # ---- Revenue side -------------------------------------------------------
      property_tax_revenue_cents = round_half_up(case.territory_assessed_value_cents
                                                 * Municipality.general_fund_millage_rate / 1000)
      territory_accounts = UtilityAccount rows whose Parcel has annexation_case_id == case.id
                           AND parcel_status IN {PROPOSED, PENDING_ANNEX, INCORPORATED}
                           AND account_status != DISCONNECTED
      # Projected at the post-annexation INSIDE_CITY rate: monthly_base_cents, no surcharge.
      projected_utility_revenue_cents = sum(a.monthly_base_cents * 12 for a in territory_accounts)
      shared_revenue_cents = analysis.projected_population
                             * StatuteProfile.per_capita_shared_revenue_cents
      gross_annual_revenue_cents = property_tax_revenue_cents
                                 + projected_utility_revenue_cents
                                 + shared_revenue_cents

      # ---- Cost side: EVALUATION ORDER IS PINNED -----------------------------
      # Step 1 — base cost by variant (see variants below)
      if analysis_method == AVERAGE_COST:
          base_service_cost_cents = round_half_up(
              Municipality.citywide_annual_service_cost_cents
              * analysis.projected_population / Municipality.citywide_population)
      else:  # MARGINAL_COST
          base_service_cost_cents = (analysis.marginal_police_cost_cents
                                   + analysis.marginal_fire_cost_cents
                                   + analysis.marginal_water_cost_cents
                                   + analysis.marginal_sewer_cost_cents)
      # Step 2 — the overhead tier is selected from base_service_cost_cents, i.e. the cost
      #          BEFORE overhead is added. It is NOT re-selected from the post-overhead total,
      #          even though projected_annual_service_cost_cents later includes the overhead.
      overhead_tier_pct = 0.12 if base_service_cost_cents < 5000000
                     else 0.09 if base_service_cost_cents < 25000000
                     else 0.06
      # Step 3 — overhead, then total, then net. No iteration, no fixed point.
      administrative_overhead_cents = round_half_up(base_service_cost_cents * overhead_tier_pct)
      projected_annual_service_cost_cents = base_service_cost_cents
                                          + administrative_overhead_cents
      net_annual_impact_cents = gross_annual_revenue_cents
                              - projected_annual_service_cost_cents
      deficit_ratio_pct = 0.00 if net_annual_impact_cents >= 0
                     else 100.00 if gross_annual_revenue_cents == 0
                     else round_half_up(-net_annual_impact_cents
                                        / gross_annual_revenue_cents * 100, 2)
    input_set: "Territory parcels with parcel_status IN {PROPOSED, PENDING_ANNEX, INCORPORATED}; their utility accounts with account_status != DISCONNECTED."
    constants:
      OVERHEAD_TIER_1_CEILING_CENTS: 5000000
      OVERHEAD_TIER_2_CEILING_CENTS: 25000000
      OVERHEAD_TIER_1_PCT: 0.12
      OVERHEAD_TIER_2_PCT: 0.09
      OVERHEAD_TIER_3_PCT: 0.06
      MONTHS_PER_YEAR: 12
    precision: "all monetary results whole cents, round_half_up; deficit_ratio_pct 2 decimals round_half_up"
    variants:
      - name: average_cost_per_capita
        when: "StatuteProfile.fiscal_method == AVERAGE_COST (the analysis_method must match the statute)"
        difference: "base_service_cost_cents is the citywide per-capita service cost scaled by projected_population, so it ignores the four marginal_* inputs entirely and can select a different overhead tier than the marginal variant for identical territory data."
      - name: marginal_cost_buildout
        when: "StatuteProfile.fiscal_method == MARGINAL_COST"
        difference: "base_service_cost_cents is the sum of the four marginal_*_cost_cents inputs, ignoring citywide averages; identical territory + population inputs therefore yield a different base cost, a possibly different overhead_tier_pct, a different net_annual_impact_cents and a different deficit_ratio_pct."

  - name: protest_evaluation
    trigger: "POST /public-hearings/{hearingId}/close-protest-period"
    algorithm: threshold
    formula: |
      qualifying = ProtestFiling rows with public_hearing_id == hearing.id
                   AND filing_status == FILED
                   AND filed_at >= hearing.protest_opens_at
                   AND filed_at <= hearing.protest_closes_at      # closed interval, both ends in
      protest_value_cents(f) = round_half_up(Parcel[f.parcel_id].assessed_value_cents
                                             * f.ownership_share_pct / 100)
      if StatuteProfile.protest_basis == ASSESSED_VALUE:
          protest_pct = round_half_up(sum(protest_value_cents(f) for f in qualifying)
                                      / case.territory_assessed_value_cents * 100, 2)
                        if case.territory_assessed_value_cents > 0 else 0.00
      else:  # OWNER_COUNT
          territory_owner_count = count(DISTINCT p.primary_owner_id for p in territory_parcels)
          protest_pct = round_half_up(count(DISTINCT f.property_owner_id for f in qualifying)
                                      / territory_owner_count * 100, 2)
                        if territory_owner_count > 0 else 0.00
      protest_outcome = SUSTAINED if protest_pct >= StatuteProfile.protest_threshold_pct else FAILED
    input_set: "Only FILED filings whose filed_at lies in the closed interval [protest_opens_at, protest_closes_at]; WITHDRAWN filings and late filings are excluded."
    constants: {}
    precision: "per-filing value rounded to whole cents before summation; protest_pct 2 decimals round_half_up; comparison is inclusive (>=)"
    variants:
      - name: assessed_value_basis
        when: "StatuteProfile.protest_basis == ASSESSED_VALUE"
        difference: "protest weight is the rounded assessed-value share of each filing over territory_assessed_value_cents — a single high-value parcel can sustain the protest alone."
      - name: owner_count_basis
        when: "StatuteProfile.protest_basis == OWNER_COUNT"
        difference: "protest weight is distinct protesting owners over distinct territory owners — value is irrelevant, so the identical set of filings yields a different protest_pct and can flip protest_outcome relative to the assessed-value basis."

  - name: tax_roll_proration
    trigger: "POST /annexation-cases/{caseId}/post-tax-roll"
    algorithm: aggregation
    formula: |
      fy_end_this_year = date(effective_date.year, StatuteProfile.fiscal_year_end_month_day)
      fy_end = fy_end_this_year if effective_date <= fy_end_this_year
               else date(effective_date.year + 1, StatuteProfile.fiscal_year_end_month_day)
      days_remaining = (fy_end - case.effective_date).days + 1     # both endpoints inclusive

      # Parcels processed in created_at ASC order (never by id).
      for p in Parcel rows with annexation_case_id == case.id AND parcel_status == INCORPORATED,
              ordered by created_at ASC:
          p.annual_tax_cents   = round_half_up(p.assessed_value_cents
                                               * Municipality.general_fund_millage_rate / 1000)
          p.prorated_tax_cents = round_half_up(p.annual_tax_cents * days_remaining / FY_DAYS)

      # PINNED ROUNDING ORDER: per-parcel rounding FIRST, then summation. Summing the unrounded
      # products and rounding once at the end is explicitly NOT the rule and can differ by cents.
      case.tax_roll_transferred_tax_cents = sum(p.prorated_tax_cents for p in those parcels)
      case.tax_roll_transferred_assessed_value_cents = sum(p.assessed_value_cents for p in those parcels)
      Municipality.taxable_assessed_value_cents += case.tax_roll_transferred_assessed_value_cents
    input_set: "Only parcels with parcel_status == INCORPORATED at the moment of posting; EXCLUDED parcels contribute nothing."
    constants:
      FY_DAYS: 365
    precision: "annual_tax_cents and prorated_tax_cents whole cents round_half_up; sums are exact integer sums of already-rounded per-parcel values"

  - name: plan_service_readiness
    trigger: "POST /service-commitments/{commitmentId}/activate, POST /service-commitments/{commitmentId}/void, the effectuate cascade, and the plan-rescind cascade"
    algorithm: constraint_propagation
    formula: |
      active_set = ServiceCommitment rows with plan_of_services_id == plan.id
                   AND commitment_status IN {ACTIVE, FULFILLED}
      committed_cost_cents   = sum(c.cost_cents for c in active_set)
      covered_service_types  = distinct service_type over active_set,
                               ordered by the fixed sequence [POLICE, FIRE, WATER, SEWER]
      service_readiness =
          PENDING if active_set is empty
          READY   if every member of StatuteProfile.required_service_types is in covered_service_types
                     AND every c in active_set has commitment_status == FULFILLED
          PARTIAL otherwise
    input_set: "Only commitments with commitment_status IN {ACTIVE, FULFILLED}; DRAFT and VOIDED commitments contribute neither cost nor coverage."
    constants:
      SERVICE_TYPE_ORDER: ["POLICE", "FIRE", "WATER", "SEWER"]
    precision: "integer cents; enum output"

  - name: provider_capacity_encumbrance
    trigger: "POST /service-commitments/{commitmentId}/activate (admission test + encumbrance), POST /service-commitments/{commitmentId}/void and the rescind cascade (release)"
    algorithm: interval_merge
    formula: |
      # Closed date intervals with aggregate capacity. window covers every calendar day from
      # window_start_date through window_end_date INCLUSIVE, so two commitments that merely touch
      # (a.window_end_date == b.window_start_date) DO overlap on that shared day.
      timeline_days(c) = (c.window_end_date - c.window_start_date).days + 1
      occupied(c, D)   = c.window_start_date <= D <= c.window_end_date

      admission test for candidate C on provider SP:
          peers = ServiceCommitment rows with service_provider_id == SP.id
                  AND commitment_status IN {ACTIVE, FULFILLED}
          for each calendar day D with occupied(C, D):
              if count(peer for peer in peers if occupied(peer, D)) + 1
                     > SP.concurrent_project_capacity:
                  reject with ERR_PROVIDER_CAPACITY_EXCEEDED
      encumbrance invariant (recomputed after every activate / void / rescind):
          SP.encumbered_capacity_days == sum(timeline_days(c) for c in ServiceCommitment
                                             where service_provider_id == SP.id
                                             AND commitment_status IN {ACTIVE, FULFILLED})
    input_set: "Peers are only commitments with commitment_status IN {ACTIVE, FULFILLED}; DRAFT and VOIDED commitments occupy nothing."
    constants: {}
    precision: "integer days; date arithmetic on calendar days, no time component"

  - name: hearing_chamber_occupation
    trigger: "POST /public-hearings"
    algorithm: interval_merge
    formula: |
      # Half-open datetime intervals with a trailing changeover buffer and capacity 1.
      buffer_minutes = Municipality.hearing_changeover_buffer_minutes
      occupation(h) = [h.scheduled_start_at, h.scheduled_end_at + buffer_minutes)   # end exclusive
      peers = PublicHearing rows with municipality_id == candidate.municipality_id
              AND hearing_status IN {SCHEDULED, HELD}
      conflict(candidate, peer) =
          candidate.scheduled_start_at <  peer.scheduled_end_at      + buffer_minutes
          AND peer.scheduled_start_at  <  candidate.scheduled_end_at + buffer_minutes
      if any peer conflicts: reject with ERR_HEARING_SLOT_CONFLICT
      # Because both bounds are exclusive, a candidate starting exactly at
      # peer.scheduled_end_at + buffer_minutes is admitted.
    input_set: "Peers are only hearings with hearing_status IN {SCHEDULED, HELD}; VACATED hearings release the chamber."
    constants: {}
    precision: "minute resolution on ISO 8601 UTC timestamps; both interval bounds exclusive at the collision test"

  - name: de_annexation_refund
    trigger: "POST /annexation-cases/{deAnnexCaseId}/effectuate on a case with case_type == DE_ANNEXATION whose predecessor has tax_roll_status == POSTED"
    algorithm: threshold
    formula: |
      predecessor = AnnexationCase[de_annex_case.predecessor_case_id]
      d           = de_annex_case.effective_date
      if StatuteProfile.de_annexation_refund_basis == DAILY_PRORATION:
          fy_end_this_year = date(d.year, StatuteProfile.fiscal_year_end_month_day)
          fy_end = fy_end_this_year if d <= fy_end_this_year
                   else date(d.year + 1, StatuteProfile.fiscal_year_end_month_day)
          days_left = (fy_end - d).days + 1
          refund_cents = round_half_up(predecessor.tax_roll_transferred_tax_cents
                                       * days_left / FY_DAYS)
      else:  # WHOLE_QUARTER
          quarters_remaining = 4 - ((d.month - 1) // 3)
          refund_cents = round_half_up(predecessor.tax_roll_transferred_tax_cents
                                       * quarters_remaining / 4)
      de_annex_case.de_annexation_refund_cents = refund_cents
    input_set: "Only the predecessor's already-posted tax (tax_roll_transferred_tax_cents); parcels de-annexed from a case whose tax roll never posted refund 0."
    constants:
      FY_DAYS: 365
      QUARTERS_PER_YEAR: 4
    precision: "whole cents, round_half_up"
    variants:
      - name: daily_proration
        when: "StatuteProfile.de_annexation_refund_basis == DAILY_PRORATION"
        difference: "refund tracks the exact remaining days of the fiscal year, so a mid-quarter effective date refunds a fraction of that quarter."
      - name: whole_quarter
        when: "StatuteProfile.de_annexation_refund_basis == WHOLE_QUARTER"
        difference: "the quarter containing the effective date is refunded in full, so identical predecessor tax and identical effective date produce a strictly larger refund than daily proration for any date after the first day of a quarter."

  - name: msd_assessment
    trigger: "POST /annexation-cases/{caseId}/adopt-msd-alternative"
    algorithm: aggregation
    formula: |
      plan = the single PlanOfServices with annexation_case_id == case.id
             AND adoption_status == ADOPTED
             (at most one exists: a second adoption is rejected with ERR_PLAN_ALREADY_ADOPTED)
      msd_annual_assessment_cents = round_half_up(plan.committed_cost_cents
                                                  * StatuteProfile.msd_cost_recovery_pct)
    input_set: "committed_cost_cents already excludes DRAFT and VOIDED commitments."
    constants: {}
    precision: "whole cents, round_half_up"

  - name: utility_effective_rate
    trigger: "POST /utility-accounts, and every transition of UtilityAccount.rate_schedule"
    algorithm: threshold
    formula: |
      effective_monthly_cents =
          round_half_up(monthly_base_cents * (1 + Municipality.utility_outside_surcharge_pct))
              if rate_schedule == OUTSIDE_CITY_SURCHARGE
          else monthly_base_cents
    input_set: "The account's own monthly_base_cents and the municipality of the account's parcel's case."
    constants: {}
    precision: "whole cents, round_half_up"

  - name: effective_date_admissibility
    trigger: "POST /annexation-cases/{caseId}/effectuate"
    algorithm: threshold
    formula: |
      today = date part of the logical clock
      if StatuteProfile.effective_date_rule == IMMEDIATE:
          admissible = (effective_date == today)
      elif StatuteProfile.effective_date_rule == NEXT_QUARTER_START:
          next_q_month = 1 + 3 * ((today.month - 1) // 3 + 1)
          next_q_start = date(today.year, next_q_month, 1) if next_q_month <= 12
                         else date(today.year + 1, 1, 1)
          admissible = (effective_date == next_q_start)
      else:  # NEXT_FISCAL_YEAR
          fy_end_this_year = date(today.year, StatuteProfile.fiscal_year_end_month_day)
          fy_end = fy_end_this_year if today <= fy_end_this_year
                   else date(today.year + 1, StatuteProfile.fiscal_year_end_month_day)
          admissible = (effective_date == fy_end + 1 day)
      if not admissible: reject with ERR_EFFECTIVE_DATE_INVALID
    input_set: "The logical clock date and the governing statute's effective_date_rule."
    constants: {}
    precision: "calendar-date equality"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ascending priority — lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For MunicipalPlanner and CityClerk (identity entity_backed:Municipality), X-User-ID equals the Municipality reached from the target resource (AnnexationCase.municipality_id, ServiceProvider.municipality_id, PublicHearing.municipality_id, or the case behind a Parcel / Petition / PlanOfServices / ServiceCommitment / UtilityAccount)"
    error_id: ERR_MUNICIPALITY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all municipal write endpoints (annexation-cases/*, parcels/*, petitions/*, plans-of-services/*, service-commitments/*, public-hearings/*, utility-accounts, service-providers)"

  - priority: 4
    category: auth
    check: "When the acting role is PropertyOwner (identity entity_backed:PropertyOwner), X-User-ID equals the payload's property_owner_id on create, and the target ParcelOwnerConsent.property_owner_id / ProtestFiling.property_owner_id on withdraw"
    error_id: ERR_OWNER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /parcel-owner-consents, POST /parcel-owner-consents/{consentId}/withdraw, POST /protest-filings, POST /protest-filings/{filingId}/withdraw"

  - priority: 5
    category: auth
    check: "Segregation of duties — the BoundaryCommissioner's X-User-ID differs from AnnexationCase.fiscal_finalized_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /annexation-cases/{caseId}/commission-decision"

  - priority: 10
    category: existence
    check: "Every path id resolves to an existing row, validated left-to-right"
    error_id: "ERR_STATUTE_PROFILE_NOT_FOUND | ERR_MUNICIPALITY_NOT_FOUND | ERR_SERVICE_PROVIDER_NOT_FOUND | ERR_PROPERTY_OWNER_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_PARCEL_NOT_FOUND | ERR_PETITION_NOT_FOUND | ERR_CONSENT_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_HEARING_NOT_FOUND | ERR_NOTICE_PUBLICATION_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_UTILITY_ACCOUNT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 11
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, validated in the endpoint's declared input order"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields in the body"

  - priority: 20
    category: business_constraint
    check: "Required inputs present; enums within their declared member sets; numbers within their declared ranges; dates ISO 8601; window_end_date >= window_start_date; scheduled_end_at > scheduled_start_at; ownership_share_pct in (0, 100]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 21
    category: business_constraint
    check: "limit in [1, 100] and offset >= 0 on list endpoints"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 25
    category: business_constraint
    check: "expected_case_version equals AnnexationCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /fiscal-impact-analyses"

  - priority: 26
    category: business_constraint
    check: "expected_plan_of_services_version equals PlanOfServices.version"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /service-commitments"

  - priority: 30
    category: state
    check: "The AnnexationCase reached from the target resource is not in a terminal status (DENIED, MSD_ALTERNATIVE_ADOPTED, DE_ANNEXED)"
    error_id: ERR_CASE_TERMINAL
    http_status: 409
    applies_to: "every write endpoint that touches a case or one of its children"

  - priority: 31
    category: state
    check: "The AnnexationCase.status is a declared from-state for the requested transition (§1.2)"
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /annexation-cases/{caseId}/certify-territory, /adopt-ordinance, /record-referendum, /submit-to-commission, /commission-decision, /effectuate, /post-tax-roll, /adopt-msd-alternative, POST /petitions, POST /public-hearings/{hearingId}/notice-publications"

  - priority: 32
    category: state
    check: "petition.sufficiency_status != EXPIRED (an expired petition is terminal)"
    error_id: ERR_PETITION_EXPIRED
    http_status: 409
    applies_to: "POST /petitions/{petitionId}/certify-sufficiency, POST /parcel-owner-consents"

  - priority: 33
    category: state
    check: "No Petition of the case already has sufficiency_status IN {CIRCULATING, SUFFICIENT}"
    error_id: ERR_PETITION_ALREADY_CIRCULATING
    http_status: 409
    applies_to: "POST /petitions"

  - priority: 34
    category: state
    check: "consent.consent_status == SIGNED"
    error_id: ERR_CONSENT_ALREADY_WITHDRAWN
    http_status: 409
    applies_to: "POST /parcel-owner-consents/{consentId}/withdraw"

  - priority: 35
    category: state
    check: "filing.filing_status == FILED"
    error_id: ERR_FILING_ALREADY_WITHDRAWN
    http_status: 409
    applies_to: "POST /protest-filings/{filingId}/withdraw"

  - priority: 36
    category: state
    check: "hearing.hearing_status == SCHEDULED"
    error_id: ERR_HEARING_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /public-hearings/{hearingId}/hold, POST /public-hearings/{hearingId}/notice-publications"

  - priority: 37
    category: state
    check: "No other PublicHearing of the same case has hearing_status == HELD"
    error_id: ERR_HEARING_ALREADY_HELD
    http_status: 409
    applies_to: "POST /public-hearings/{hearingId}/hold"

  - priority: 38
    category: state
    check: "hearing.hearing_status == HELD and hearing.protest_outcome == OPEN for closing; the protest period is still OPEN for filing"
    error_id: ERR_PROTEST_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /public-hearings/{hearingId}/close-protest-period, POST /protest-filings, POST /protest-filings/{filingId}/withdraw"

  - priority: 39
    category: state
    check: "No other PlanOfServices of the case has adoption_status == ADOPTED"
    error_id: ERR_PLAN_ALREADY_ADOPTED
    http_status: 409
    applies_to: "POST /plans-of-services/{planId}/adopt"

  - priority: 41
    category: state
    check: "commitment.commitment_status == DRAFT for activate; commitment.commitment_status != VOIDED for void"
    error_id: ERR_COMMITMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /service-commitments/{commitmentId}/activate, POST /service-commitments/{commitmentId}/void"

  - priority: 42
    category: state
    check: "analysis.status == DRAFT"
    error_id: ERR_ANALYSIS_STATE_INVALID
    http_status: 409
    applies_to: "POST /fiscal-impact-analyses/{analysisId}/finalize"

  - priority: 44
    category: state
    check: "case.tax_roll_status == NOT_TRANSFERRED"
    error_id: ERR_TAX_ROLL_ALREADY_POSTED
    http_status: 409
    applies_to: "POST /annexation-cases/{caseId}/post-tax-roll"

  - priority: 45
    category: state
    check: "case.commission_review_status == PENDING"
    error_id: ERR_COMMISSION_REVIEW_NOT_PENDING
    http_status: 409
    applies_to: "POST /annexation-cases/{caseId}/submit-to-commission, POST /annexation-cases/{caseId}/commission-decision"

  - priority: 46
    category: state
    check: "parcel.parcel_status IN {PROPOSED, PENDING_ANNEX} for exclusion; parcels may only be added while case.status == DRAFT and case.case_type == ANNEXATION (a DE_ANNEXATION case owns no parcels)"
    error_id: ERR_PARCEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /parcels/{parcelId}/exclude, POST /annexation-cases/{caseId}/parcels"

  - priority: 47
    category: business_referential
    check: "No Parcel with the same parcel_apn exists in another AnnexationCase of the same municipality whose status is neither terminal nor EFFECTIVE (an already-annexed parcel may be re-described by a later case)"
    error_id: ERR_PARCEL_ALREADY_IN_PENDING_CASE
    http_status: 409
    applies_to: "POST /annexation-cases/{caseId}/parcels"

  - priority: 50
    category: business_safety
    check: "case.method IN StatuteProfile.authorized_methods"
    error_id: ERR_METHOD_NOT_AUTHORIZED_BY_STATUTE
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/certify-territory, POST /annexation-cases/{caseId}/adopt-ordinance"

  - priority: 51
    category: business_safety
    check: "An ANNEXATION case holds at least one Parcel with parcel_status IN {PROPOSED, PENDING_ANNEX}; a DE_ANNEXATION case's predecessor holds at least one Parcel with parcel_status == INCORPORATED"
    error_id: ERR_TERRITORY_EMPTY
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/certify-territory"

  - priority: 52
    category: business_safety
    check: "calculations.territory_qualification contiguity_ratio >= StatuteProfile.contiguity_min_ratio"
    error_id: ERR_TERRITORY_NOT_CONTIGUOUS
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/certify-territory"

  - priority: 53
    category: business_safety
    check: "calculations.territory_qualification urban_development_qualified == true (subdivision limb OR density limb)"
    error_id: ERR_URBAN_DEVELOPMENT_TEST_FAILED
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/certify-territory"

  - priority: 54
    category: business_safety
    check: "calculations.territory_qualification qualification_index >= StatuteProfile.min_qualification_index"
    error_id: ERR_SERVICE_CAPABILITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/certify-territory"

  - priority: 55
    category: business_safety
    check: "A PlanOfServices of the case has adoption_status == ADOPTED"
    error_id: ERR_PLAN_NOT_ADOPTED
    http_status: 422
    applies_to: "POST /public-hearings/{hearingId}/notice-publications, POST /annexation-cases/{caseId}/adopt-ordinance, POST /annexation-cases/{caseId}/adopt-msd-alternative"

  - priority: 56
    category: business_safety
    check: "plan.covered_service_types contains every member of StatuteProfile.required_service_types"
    error_id: ERR_SERVICE_TYPE_NOT_COVERED
    http_status: 422
    applies_to: "POST /plans-of-services/{planId}/adopt"

  - priority: 57
    category: business_safety
    check: "commitment.timeline_days <= StatuteProfile.police_fire_timeline_max_days for POLICE/FIRE, <= StatuteProfile.water_sewer_timeline_max_days for WATER/SEWER"
    error_id: ERR_PLAN_SERVICE_TIMELINE_EXCEEDS_STATUTE
    http_status: 422
    applies_to: "POST /service-commitments/{commitmentId}/activate, POST /plans-of-services/{planId}/adopt"

  - priority: 58
    category: business_safety
    check: "hearing.notice_published_at != null (a NoticePublication with notice_status == PUBLISHED exists)"
    error_id: ERR_NOTICE_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /public-hearings/{hearingId}/hold"

  - priority: 59
    category: business_safety
    check: "The case's HELD hearing has protest_outcome != OPEN (the protest period has been closed)"
    error_id: ERR_PROTEST_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /annexation-cases/{caseId}/adopt-ordinance"

  - priority: 60
    category: business_temporal
    check: "The logical clock is inside the closed interval [petition.circulation_started_at, petition.circulation_deadline_at]"
    error_id: ERR_PETITION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /parcel-owner-consents"

  - priority: 61
    category: business_temporal
    check: "logical clock >= hearing.notice_published_at + StatuteProfile.notice_min_days days"
    error_id: ERR_NOTICE_WINDOW_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /public-hearings/{hearingId}/hold"

  - priority: 62
    category: business_temporal
    check: "logical clock >= hearing.scheduled_start_at"
    error_id: ERR_HEARING_NOT_STARTED
    http_status: 422
    applies_to: "POST /public-hearings/{hearingId}/hold"

  - priority: 63
    category: business_temporal
    check: "logical clock > hearing.protest_closes_at"
    error_id: ERR_PROTEST_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /public-hearings/{hearingId}/close-protest-period"

  - priority: 64
    category: business_temporal
    check: "The logical clock (which becomes filed_at) is inside the closed interval [hearing.protest_opens_at, hearing.protest_closes_at]"
    error_id: ERR_PROTEST_FILING_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /protest-filings"

  - priority: 65
    category: business_temporal
    check: "logical clock >= case.hearing_held_at + StatuteProfile.hearing_to_ordinance_min_days days"
    error_id: ERR_COOLING_OFF_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/adopt-ordinance"

  - priority: 66
    category: business_temporal
    check: "calculations.effective_date_admissibility accepts the submitted effective_date under StatuteProfile.effective_date_rule"
    error_id: ERR_EFFECTIVE_DATE_INVALID
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/effectuate"

  - priority: 67
    category: business_temporal
    check: "calculations.hearing_chamber_occupation finds no SCHEDULED or HELD hearing of the same municipality whose buffered interval overlaps the candidate"
    error_id: ERR_HEARING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /public-hearings"

  - priority: 70
    category: business_referential
    check: "commitment.service_type IN ServiceProvider.service_types"
    error_id: ERR_PROVIDER_SERVICE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /service-commitments, POST /service-commitments/{commitmentId}/activate"

  - priority: 71
    category: business_referential
    check: "The referenced Parcel belongs to the same AnnexationCase as the referenced Petition / PublicHearing, and the ServiceProvider belongs to the case's Municipality"
    error_id: ERR_PARCEL_CASE_MISMATCH
    http_status: 422
    applies_to: "POST /parcel-owner-consents, POST /protest-filings, POST /service-commitments, POST /utility-accounts"

  - priority: 72
    category: business_referential
    check: "No ParcelOwnerConsent with consent_status == SIGNED already exists for the same (petition_id, parcel_id, property_owner_id)"
    error_id: ERR_CONSENT_DUPLICATE
    http_status: 409
    applies_to: "POST /parcel-owner-consents"

  - priority: 73
    category: business_referential
    check: "No ProtestFiling with filing_status == FILED already exists for the same (public_hearing_id, parcel_id, property_owner_id)"
    error_id: ERR_FILING_DUPLICATE
    http_status: 409
    applies_to: "POST /protest-filings"

  - priority: 74
    category: business_referential
    check: "case_type == DE_ANNEXATION requires StatuteProfile.de_annexation_allowed == true and a non-null predecessor_case_id; case_type == ANNEXATION forbids predecessor_case_id"
    error_id: ERR_DE_ANNEXATION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /annexation-cases, POST /annexation-cases/{caseId}/certify-territory"

  - priority: 75
    category: business_referential
    check: "AnnexationCase[predecessor_case_id].status == EFFECTIVE and it belongs to the same municipality"
    error_id: ERR_PREDECESSOR_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/certify-territory, POST /annexation-cases/{caseId}/effectuate"

  - priority: 76
    category: business_referential
    check: "StatuteProfile.msd_alternative_allowed == true"
    error_id: ERR_MSD_ALTERNATIVE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/adopt-msd-alternative"

  - priority: 78
    category: business_referential
    check: "StatuteProfile.boundary_commission_required == false OR case.commission_review_status == APPROVED"
    error_id: ERR_COMMISSION_APPROVAL_REQUIRED
    http_status: 409
    applies_to: "POST /annexation-cases/{caseId}/effectuate"

  - priority: 79
    category: business_constraint
    check: "calculations.provider_capacity_encumbrance finds no calendar day in the candidate's closed window where ACTIVE/FULFILLED peers plus the candidate exceed ServiceProvider.concurrent_project_capacity"
    error_id: ERR_PROVIDER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /service-commitments/{commitmentId}/activate"

  - priority: 80
    category: business_constraint
    check: "The sum of ownership_share_pct across SIGNED consents for the same (petition_id, parcel_id) does not exceed 100"
    error_id: ERR_CONSENT_OWNERSHIP_SHARE_INVALID
    http_status: 422
    applies_to: "POST /parcel-owner-consents"

  - priority: 81
    category: business_constraint
    check: "The sum of ownership_share_pct across FILED filings for the same (public_hearing_id, parcel_id) does not exceed 100"
    error_id: ERR_PROTEST_OWNERSHIP_SHARE_INVALID
    http_status: 422
    applies_to: "POST /protest-filings"

  - priority: 82
    category: business_fiscal
    check: "A FiscalImpactAnalysis of the case has status == FINALIZED"
    error_id: ERR_FISCAL_ANALYSIS_NOT_FINALIZED
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/adopt-ordinance"

  - priority: 83
    category: business_fiscal
    check: "analysis.analysis_method == StatuteProfile.fiscal_method"
    error_id: ERR_FISCAL_METHOD_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /fiscal-impact-analyses"

  - priority: 84
    category: business_fiscal
    check: "The FINALIZED analysis's deficit_ratio_pct <= Municipality.fiscal_deficit_tolerance_pct"
    error_id: ERR_FISCAL_DEFICIT_EXCEEDS_TOLERANCE
    http_status: 422
    applies_to: "POST /annexation-cases/{caseId}/adopt-ordinance"

  - priority: 86
    category: business_constraint
    check: "calculations.petition_sufficiency threshold met for petition.petition_type on StatuteProfile.signature_basis"
    error_id: ERR_PETITION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /petitions/{petitionId}/certify-sufficiency"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table  (api_prefix is "" — all paths are server-root)
# ---------------------------------------------------------------------------
endpoints:

  # -- test-driving clock ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to wall-clock time. Every deadline, notice window, protest window, cooling-off period and effective-date rule is evaluated against this clock."
    roles: [StateLawAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock set to to_iso8601 for all subsequent requests"]

  # -- statute configuration -------------------------------------------------
  - method: POST
    path: "/statute-profiles"
    description: "Register a state annexation statute profile — the configuration hub whose flags switch method eligibility, sufficiency basis, protest basis, notice and cooling-off windows, fiscal methodology, commission requirement, de-annexation and MSD availability."
    roles: [StateLawAdmin]
    code: 201
    input: ["state_code", "authorized_methods", "signature_basis?", "signature_threshold_pct?", "protest_basis?", "protest_threshold_pct?", "contiguity_min_ratio?", "urban_density_min_units_per_acre?", "subdivision_test_min_developed_ratio?", "min_qualification_index?", "notice_min_days?", "hearing_to_ordinance_min_days?", "required_service_types?", "police_fire_timeline_max_days?", "water_sewer_timeline_max_days?", "fiscal_method?", "per_capita_shared_revenue_cents?", "referendum_required_methods?", "boundary_commission_required?", "de_annexation_allowed?", "de_annexation_refund_basis?", "msd_alternative_allowed?", "msd_cost_recovery_pct?", "effective_date_rule?", "fiscal_year_end_month_day?"]
    output: StatuteProfile
    side_effects: ["defaults applied for every omitted optional flag"]

  - method: GET
    path: "/statute-profiles/{statuteProfileId}"
    description: "Read one statute profile"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: StatuteProfile
    side_effects: []

  - method: POST
    path: "/municipalities"
    description: "Register a municipality bound to a statute profile"
    roles: [StateLawAdmin]
    code: 201
    input: ["statute_profile_id", "name", "state_code", "population", "citywide_annual_service_cost_cents", "citywide_population", "general_fund_millage_rate", "corporate_boundary_perimeter_feet", "fiscal_deficit_tolerance_pct?", "hearing_changeover_buffer_minutes?", "utility_outside_surcharge_pct?"]
    output: Municipality
    side_effects: ["taxable_assessed_value_cents initialised to 0"]

  - method: GET
    path: "/municipalities/{municipalityId}"
    description: "Read one municipality, including the running taxable_assessed_value_cents ledger"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: Municipality
    side_effects: []

  - method: GET
    path: "/municipalities"
    description: "List municipalities, optionally filtered by statute profile"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["statute_profile_id?", "state_code?", "limit?", "offset?"]
    output: Municipality[]
    side_effects: []

  - method: POST
    path: "/municipalities/{municipalityId}/service-providers"
    description: "Register a service provider (police, fire, water or sewer operator) for a municipality"
    roles: [MunicipalPlanner]
    code: 201
    input: ["provider_name", "service_types", "concurrent_project_capacity?"]
    output: ServiceProvider
    side_effects: ["encumbered_capacity_days initialised to 0"]

  - method: GET
    path: "/service-providers/{serviceProviderId}"
    description: "Read one service provider, including its encumbered_capacity_days ledger"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: []

  - method: GET
    path: "/service-providers"
    description: "List service providers, optionally filtered by municipality"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["municipality_id?", "limit?", "offset?"]
    output: ServiceProvider[]
    side_effects: []

  - method: POST
    path: "/property-owners"
    description: "Register a property owner of record"
    roles: [CityClerk, StateLawAdmin]
    code: 201
    input: [owner_name, contact_email]
    output: PropertyOwner
    side_effects: []

  - method: GET
    path: "/property-owners/{propertyOwnerId}"
    description: "Read one property owner"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: PropertyOwner
    side_effects: []

  # -- cases and territory ---------------------------------------------------
  - method: POST
    path: "/annexation-cases"
    description: "Open an annexation or de-annexation case in DRAFT, choosing the statutory method"
    roles: [MunicipalPlanner]
    code: 201
    input: ["municipality_id", "method", "case_type?", "predecessor_case_id?", "shared_boundary_feet", "total_lot_count", "developed_lot_count", "dwelling_units", "max_service_distance_miles?"]
    output: AnnexationCase
    side_effects: ["status DRAFT, tax_roll_status NOT_TRANSFERRED, protest_outcome NOT_EVALUATED, referendum_result NOT_HELD, commission_review_status NOT_REQUIRED"]

  - method: GET
    path: "/annexation-cases/{caseId}"
    description: "Read one annexation case with every computed territory, protest, fiscal and tax-roll field plus its version"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: AnnexationCase
    side_effects: []

  - method: GET
    path: "/annexation-cases"
    description: "List annexation cases, optionally filtered by municipality, predecessor case or status"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["municipality_id?", "predecessor_case_id?", "status?", "case_type?", "limit?", "offset?"]
    output: AnnexationCase[]
    side_effects: []

  - method: POST
    path: "/annexation-cases/{caseId}/parcels"
    description: "Add a parcel to a DRAFT case's proposed territory"
    roles: [MunicipalPlanner]
    code: 201
    input: ["primary_owner_id", "parcel_apn", "assessed_value_cents", "acreage", "is_developed?", "dwelling_units?"]
    output: Parcel
    side_effects: ["parcel_status PROPOSED", "case.parcel_count, case.territory_acreage, case.territory_assessed_value_cents recomputed (calculations.territory_qualification)", "increments AnnexationCase.version by 1"]

  - method: GET
    path: "/parcels/{parcelId}"
    description: "Read one parcel including its prorated tax fields"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: GET
    path: "/parcels"
    description: "List parcels, optionally filtered by case, primary owner or status"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["annexation_case_id?", "primary_owner_id?", "parcel_status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  - method: POST
    path: "/parcels/{parcelId}/exclude"
    description: "Exclude a parcel from the territory (owner-requested carve-out or planner correction)"
    roles: [MunicipalPlanner]
    code: 200
    input: []
    output: Parcel
    side_effects: ["parcel_status -> EXCLUDED", "the parcel's UtilityAccount rows with account_status == OUTSIDE_CITY -> DISCONNECTED", "case territory aggregates recomputed", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/annexation-cases/{caseId}/certify-territory"
    description: "Certify the territory: runs the contiguity, urban-development and service-capability tests and moves the case DRAFT -> TERRITORY_CERTIFIED"
    roles: [MunicipalPlanner]
    code: 200
    input: []
    output: AnnexationCase
    side_effects: ["calculations.territory_qualification stamped", "every PROPOSED parcel -> PENDING_ANNEX", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/utility-accounts"
    description: "Register a water or sewer account serving a parcel from outside the corporate limits"
    roles: [MunicipalPlanner]
    code: 201
    input: [parcel_id, service_provider_id, service_type, monthly_base_cents]
    output: UtilityAccount
    side_effects: ["rate_schedule OUTSIDE_CITY_SURCHARGE, account_status OUTSIDE_CITY", "effective_monthly_cents computed (calculations.utility_effective_rate)"]

  - method: GET
    path: "/utility-accounts/{utilityAccountId}"
    description: "Read one utility account including its rate schedule and effective monthly charge"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: UtilityAccount
    side_effects: []

  - method: GET
    path: "/utility-accounts"
    description: "List utility accounts, optionally filtered by parcel or provider"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["parcel_id?", "service_provider_id?", "account_status?", "limit?", "offset?"]
    output: UtilityAccount[]
    side_effects: []

  # -- petition limb ---------------------------------------------------------
  - method: POST
    path: "/petitions"
    description: "Open a petition for circulation on a certified territory"
    roles: [MunicipalPlanner]
    code: 201
    input: ["annexation_case_id", "petition_type", "circulation_days?"]
    output: Petition
    side_effects: ["sufficiency_status CIRCULATING, circulation_started_at = logical clock, circulation_deadline_at = started_at + circulation_days", "case.status -> PETITION_CIRCULATING", "increments AnnexationCase.version by 1"]

  - method: GET
    path: "/petitions/{petitionId}"
    description: "Read one petition with its qualified-signature aggregates"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: Petition
    side_effects: []

  - method: GET
    path: "/petitions"
    description: "List petitions, optionally filtered by case"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["annexation_case_id?", "sufficiency_status?", "limit?", "offset?"]
    output: Petition[]
    side_effects: []

  - method: POST
    path: "/parcel-owner-consents"
    description: "Record a property owner's signature on a circulating petition for one parcel share"
    roles: [PropertyOwner, CityClerk]
    code: 201
    input: [petition_id, parcel_id, property_owner_id, ownership_share_pct]
    output: ParcelOwnerConsent
    side_effects: ["consent_status SIGNED, signed_at = logical clock", "qualified_value_cents computed", "petition aggregates recomputed (calculations.petition_sufficiency)"]

  - method: GET
    path: "/parcel-owner-consents/{consentId}"
    description: "Read one consent"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: ParcelOwnerConsent
    side_effects: []

  - method: GET
    path: "/parcel-owner-consents"
    description: "List consents, optionally filtered by petition, parcel or owner"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["petition_id?", "parcel_id?", "property_owner_id?", "consent_status?", "limit?", "offset?"]
    output: ParcelOwnerConsent[]
    side_effects: []

  - method: POST
    path: "/parcel-owner-consents/{consentId}/withdraw"
    description: "Withdraw a signature — may drop the petition below its threshold and unwind the hearing track"
    roles: [PropertyOwner, CityClerk]
    code: 200
    input: []
    output: ParcelOwnerConsent
    side_effects: ["consent_status -> WITHDRAWN, withdrawn_at = logical clock, qualified_value_cents -> 0", "petition aggregates recomputed; SUFFICIENT -> INSUFFICIENT when the threshold is no longer met", "case.status -> PETITION_CIRCULATING; SCHEDULED hearings -> VACATED; their PUBLISHED notices -> SUPERSEDED and notice_published_at -> null", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/petitions/{petitionId}/certify-sufficiency"
    description: "Clerk certification of petition sufficiency; after the circulation deadline the petition is instead marked EXPIRED"
    roles: [CityClerk]
    code: 200
    input: []
    output: Petition
    side_effects: ["qualified_signature_assessed_value_cents, qualified_signature_owner_count, signature_value_pct, signature_owner_pct stamped", "sufficiency_status -> SUFFICIENT and case.status -> SUFFICIENCY_REVIEW when the threshold is met", "sufficiency_status -> EXPIRED when the logical clock is past circulation_deadline_at", "increments AnnexationCase.version by 1"]

  # -- fiscal impact ---------------------------------------------------------
  - method: POST
    path: "/fiscal-impact-analyses"
    description: "Author a fiscal impact analysis for a case under the statute's mandated methodology; supersedes any prior analysis of the case"
    roles: [FiscalAnalyst]
    code: 201
    input: ["annexation_case_id", "analysis_method", "projected_population", "expected_case_version", "horizon_years?", "marginal_police_cost_cents?", "marginal_fire_cost_cents?", "marginal_water_cost_cents?", "marginal_sewer_cost_cents?"]
    output: FiscalImpactAnalysis
    side_effects: ["calculations.fiscal_impact_projection stamped (variant selected by analysis_method)", "every prior FiscalImpactAnalysis of the case -> SUPERSEDED; case.fiscal_finalized_by_user_id -> null when a FINALIZED one was superseded", "increments AnnexationCase.version by 1"]

  - method: GET
    path: "/fiscal-impact-analyses/{analysisId}"
    description: "Read one fiscal impact analysis with every computed revenue, cost and deficit field"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: FiscalImpactAnalysis
    side_effects: []

  - method: GET
    path: "/fiscal-impact-analyses"
    description: "List fiscal impact analyses, optionally filtered by case"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["annexation_case_id?", "status?", "limit?", "offset?"]
    output: FiscalImpactAnalysis[]
    side_effects: []

  - method: POST
    path: "/fiscal-impact-analyses/{analysisId}/finalize"
    description: "Finalize the analysis of record; stamps the acting analyst on the case for segregation-of-duties enforcement"
    roles: [FiscalAnalyst]
    code: 200
    input: []
    output: FiscalImpactAnalysis
    side_effects: ["status -> FINALIZED, finalized_by_user_id = X-User-ID", "case.fiscal_finalized_by_user_id = X-User-ID", "increments AnnexationCase.version by 1"]

  # -- plan of services ------------------------------------------------------
  - method: POST
    path: "/plans-of-services"
    description: "Open a plan of services for a case in DRAFT / PENDING"
    roles: [MunicipalPlanner]
    code: 201
    input: [annexation_case_id]
    output: PlanOfServices
    side_effects: ["adoption_status DRAFT, service_readiness PENDING, committed_cost_cents 0, covered_service_types []"]

  - method: GET
    path: "/plans-of-services/{planId}"
    description: "Read one plan of services with both dimensions, its committed cost and its version"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: PlanOfServices
    side_effects: []

  - method: GET
    path: "/plans-of-services"
    description: "List plans of services, optionally filtered by case"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["annexation_case_id?", "adoption_status?", "limit?", "offset?"]
    output: PlanOfServices[]
    side_effects: []

  - method: POST
    path: "/service-commitments"
    description: "Draft a service commitment on a plan; a new commitment supersedes the plan's existing DRAFT commitment for the same service_type"
    roles: [MunicipalPlanner]
    code: 201
    input: ["plan_of_services_id", "service_provider_id", "service_type", "window_start_date", "window_end_date", "cost_cents", "expected_plan_of_services_version", "committed_account_count?"]
    output: ServiceCommitment
    side_effects: ["commitment_status DRAFT, timeline_days = window_end_date - window_start_date + 1", "any existing DRAFT commitment of the same plan and service_type -> VOIDED", "increments PlanOfServices.version by 1"]

  - method: GET
    path: "/service-commitments/{commitmentId}"
    description: "Read one service commitment including its timeline and activated-account counters"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: ServiceCommitment
    side_effects: []

  - method: GET
    path: "/service-commitments"
    description: "List service commitments, optionally filtered by plan or provider"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["plan_of_services_id?", "service_provider_id?", "commitment_status?", "service_type?", "limit?", "offset?"]
    output: ServiceCommitment[]
    side_effects: []

  - method: POST
    path: "/service-commitments/{commitmentId}/activate"
    description: "Activate a drafted commitment — admits it against the provider's concurrent-project capacity and encumbers the provider's calendar"
    roles: [MunicipalPlanner]
    code: 200
    input: []
    output: ServiceCommitment
    side_effects: ["commitment_status -> ACTIVE (immediately -> FULFILLED when committed_account_count == 0)", "ServiceProvider.encumbered_capacity_days += timeline_days (calculations.provider_capacity_encumbrance)", "plan.committed_cost_cents, plan.covered_service_types, plan.service_readiness recomputed (calculations.plan_service_readiness)", "increments PlanOfServices.version by 1"]

  - method: POST
    path: "/service-commitments/{commitmentId}/void"
    description: "Void a commitment, releasing the provider's encumbered days and re-deriving the plan's readiness"
    roles: [MunicipalPlanner]
    code: 200
    input: []
    output: ServiceCommitment
    side_effects: ["commitment_status -> VOIDED", "ServiceProvider.encumbered_capacity_days -= timeline_days when the commitment was ACTIVE or FULFILLED", "plan.committed_cost_cents, plan.covered_service_types, plan.service_readiness recomputed", "increments PlanOfServices.version by 1"]

  - method: POST
    path: "/plans-of-services/{planId}/adopt"
    description: "Adopt the plan of services — required before notice publication and before ordinance adoption"
    roles: [CityClerk]
    code: 200
    input: []
    output: PlanOfServices
    side_effects: ["adoption_status -> ADOPTED, adopted_at = logical clock", "increments PlanOfServices.version by 1"]

  # -- notice, hearing, protest ---------------------------------------------
  - method: POST
    path: "/public-hearings"
    description: "Schedule a public hearing in the municipality's council chamber; the chamber holds one hearing at a time plus a changeover buffer"
    roles: [CityClerk]
    code: 201
    input: ["annexation_case_id", "municipality_id", "scheduled_start_at", "scheduled_end_at", "protest_window_days?"]
    output: PublicHearing
    side_effects: ["hearing_status SCHEDULED, protest_outcome OPEN", "calculations.hearing_chamber_occupation evaluated against SCHEDULED and HELD hearings of the municipality"]

  - method: GET
    path: "/public-hearings/{hearingId}"
    description: "Read one public hearing with its notice, protest window and protest result fields"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: PublicHearing
    side_effects: []

  - method: GET
    path: "/public-hearings"
    description: "List public hearings, optionally filtered by case or municipality"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["annexation_case_id?", "municipality_id?", "hearing_status?", "limit?", "offset?"]
    output: PublicHearing[]
    side_effects: []

  - method: POST
    path: "/public-hearings/{hearingId}/notice-publications"
    description: "Publish statutory notice of the hearing; starts the notice_min_days clock and moves the case to HEARING_NOTICED"
    roles: [CityClerk]
    code: 201
    input: [publication_type]
    output: NoticePublication
    side_effects: ["NoticePublication created with notice_status PUBLISHED, published_at = logical clock", "hearing.notice_published_at = published_at", "case.status -> HEARING_NOTICED", "increments AnnexationCase.version by 1"]

  - method: GET
    path: "/public-hearings/{hearingId}/notice-publications"
    description: "List the notice publications of a hearing (the primary discovery channel for cascade-superseded notices)"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["notice_status?", "limit?", "offset?"]
    output: NoticePublication[]
    side_effects: []

  - method: GET
    path: "/notice-publications/{noticePublicationId}"
    description: "Read one notice publication (immutable; there is no update endpoint and no version field)"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: NoticePublication
    side_effects: []

  - method: GET
    path: "/notice-publications"
    description: "List notice publications across hearings, filterable by hearing and by notice_status"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["public_hearing_id?", "notice_status?", "limit?", "offset?"]
    output: NoticePublication[]
    side_effects: []

  - method: POST
    path: "/public-hearings/{hearingId}/hold"
    description: "Hold the noticed hearing; opens the property-owner protest window"
    roles: [CityClerk]
    code: 200
    input: []
    output: PublicHearing
    side_effects: ["hearing_status -> HELD, held_at = logical clock, protest_opens_at = held_at, protest_closes_at = held_at + protest_window_days days", "case.status -> HEARING_HELD, case.hearing_held_at = held_at", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/protest-filings"
    description: "File a property owner's written protest against the annexation during the protest window"
    roles: [PropertyOwner, CityClerk]
    code: 201
    input: [public_hearing_id, parcel_id, property_owner_id, ownership_share_pct]
    output: ProtestFiling
    side_effects: ["filing_status FILED, filed_at = logical clock", "protest_value_cents computed as the rounded assessed-value share"]

  - method: GET
    path: "/protest-filings/{filingId}"
    description: "Read one protest filing"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: []
    output: ProtestFiling
    side_effects: []

  - method: GET
    path: "/protest-filings"
    description: "List protest filings, optionally filtered by hearing, parcel or owner"
    roles: [StateLawAdmin, MunicipalPlanner, CityClerk, FiscalAnalyst, BoundaryCommissioner, CountyAssessor, PropertyOwner]
    code: 200
    input: ["public_hearing_id?", "parcel_id?", "property_owner_id?", "filing_status?", "limit?", "offset?"]
    output: ProtestFiling[]
    side_effects: []

  - method: POST
    path: "/protest-filings/{filingId}/withdraw"
    description: "Withdraw a protest filing before the protest period closes"
    roles: [PropertyOwner, CityClerk]
    code: 200
    input: []
    output: ProtestFiling
    side_effects: ["filing_status -> WITHDRAWN, protest_value_cents -> 0"]

  - method: POST
    path: "/public-hearings/{hearingId}/close-protest-period"
    description: "Close the protest window and evaluate the statutory protest threshold on the statute's protest_basis"
    roles: [CityClerk]
    code: 200
    input: []
    output: PublicHearing
    side_effects: ["calculations.protest_evaluation stamps hearing.protest_pct and hearing.protest_outcome (FAILED or SUSTAINED)", "case.protest_pct and case.protest_outcome mirrored; case.status -> PROTEST_SUSTAINED when SUSTAINED", "increments AnnexationCase.version by 1"]

  # -- ordinance, referendum, commission, effect ----------------------------
  - method: POST
    path: "/annexation-cases/{caseId}/adopt-ordinance"
    description: "Adopt the annexation ordinance after the cooling-off period; branches to REFERENDUM_PENDING when the statute requires a referendum for the case's method"
    roles: [CityClerk]
    code: 200
    input: []
    output: AnnexationCase
    side_effects: ["case.ordinance_adopted_at = logical clock", "status -> ORDINANCE_ADOPTED, or -> REFERENDUM_PENDING when method IN StatuteProfile.referendum_required_methods", "commission_review_status -> PENDING when StatuteProfile.boundary_commission_required == true", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/annexation-cases/{caseId}/record-referendum"
    description: "Record the referendum result; rejection denies the case and rescinds its plan of services"
    roles: [CityClerk]
    code: 200
    input: [result]
    output: AnnexationCase
    side_effects: ["referendum_result -> APPROVED or REJECTED", "on APPROVED: status -> REFERENDUM_APPROVED (commission_review_status -> PENDING when required)", "on REJECTED: status -> DENIED, PENDING_ANNEX parcels -> EXCLUDED, the ADOPTED plan -> RESCINDED, its commitments -> VOIDED, provider capacity released", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/annexation-cases/{caseId}/submit-to-commission"
    description: "Submit the adopted annexation to the boundary commission where state law requires review"
    roles: [MunicipalPlanner]
    code: 200
    input: []
    output: AnnexationCase
    side_effects: ["status -> COMMISSION_REVIEW", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/annexation-cases/{caseId}/commission-decision"
    description: "Boundary commission decision; the commissioner may not be the operator who finalized the case's fiscal analysis"
    roles: [BoundaryCommissioner]
    code: 200
    input: [decision]
    output: AnnexationCase
    side_effects: ["commission_review_status -> APPROVED or DENIED", "on APPROVED: status -> COMMISSION_APPROVED", "on DENIED: status -> DENIED with the same parcel/plan/commitment rescind cascade as referendum rejection", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/annexation-cases/{caseId}/effectuate"
    description: "Make the boundary change effective on the statutory effective date, cutting parcels and utility accounts over into the city"
    roles: [MunicipalPlanner]
    code: 200
    input: [effective_date]
    output: AnnexationCase
    side_effects: ["status -> EFFECTIVE, effective_date stamped (calculations.effective_date_admissibility)", "PENDING_ANNEX parcels -> INCORPORATED", "their OUTSIDE_CITY utility accounts -> INSIDE_CITY_PENDING_TRANSITION with rate_schedule INSIDE_CITY and effective_monthly_cents recomputed", "matching ACTIVE commitments' activated_account_count incremented, reaching FULFILLED at committed_account_count", "plan.service_readiness recomputed; on READY the accounts -> INSIDE_CITY_ACTIVE", "for case_type DE_ANNEXATION: predecessor -> DE_ANNEXED, its INCORPORATED parcels -> DE_ANNEXED, their accounts -> OUTSIDE_CITY with the surcharge restored, predecessor tax_roll_status POSTED -> REVERSED, Municipality.taxable_assessed_value_cents decremented and de_annexation_refund_cents computed", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/annexation-cases/{caseId}/post-tax-roll"
    description: "County assessor posts the annexed parcels to the municipal tax roll with fiscal-year proration"
    roles: [CountyAssessor]
    code: 200
    input: []
    output: AnnexationCase
    side_effects: ["calculations.tax_roll_proration stamps each INCORPORATED parcel's annual_tax_cents and prorated_tax_cents", "case.tax_roll_transferred_assessed_value_cents and tax_roll_transferred_tax_cents stamped, tax_roll_status -> POSTED", "Municipality.taxable_assessed_value_cents incremented", "increments AnnexationCase.version by 1"]

  - method: POST
    path: "/annexation-cases/{caseId}/adopt-msd-alternative"
    description: "Adopt a municipal service district instead of annexation after a sustained protest"
    roles: [CityClerk]
    code: 200
    input: []
    output: AnnexationCase
    side_effects: ["status -> MSD_ALTERNATIVE_ADOPTED, msd_annual_assessment_cents = calculations.msd_assessment", "PENDING_ANNEX parcels -> EXCLUDED and their OUTSIDE_CITY accounts -> DISCONNECTED", "increments AnnexationCase.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed for the endpoint"
  - id: ERR_MUNICIPALITY_SCOPE_VIOLATION
    http: 403
    condition: "A MunicipalPlanner or CityClerk acts on a resource belonging to another municipality"
  - id: ERR_OWNER_SCOPE_VIOLATION
    http: 403
    condition: "A PropertyOwner records or withdraws a consent or protest filing for another owner"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The BoundaryCommissioner's X-User-ID equals AnnexationCase.fiscal_finalized_by_user_id"
  - id: ERR_STATUTE_PROFILE_NOT_FOUND
    http: 404
    condition: "statuteProfileId does not resolve"
  - id: ERR_MUNICIPALITY_NOT_FOUND
    http: 404
    condition: "municipalityId does not resolve"
  - id: ERR_SERVICE_PROVIDER_NOT_FOUND
    http: 404
    condition: "serviceProviderId does not resolve"
  - id: ERR_PROPERTY_OWNER_NOT_FOUND
    http: 404
    condition: "propertyOwnerId does not resolve"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "caseId does not resolve"
  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "parcelId does not resolve"
  - id: ERR_PETITION_NOT_FOUND
    http: 404
    condition: "petitionId does not resolve"
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "consentId does not resolve"
  - id: ERR_ANALYSIS_NOT_FOUND
    http: 404
    condition: "analysisId does not resolve"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "planId does not resolve"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "commitmentId does not resolve"
  - id: ERR_HEARING_NOT_FOUND
    http: 404
    condition: "hearingId does not resolve"
  - id: ERR_NOTICE_PUBLICATION_NOT_FOUND
    http: 404
    condition: "noticePublicationId does not resolve"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "filingId does not resolve"
  - id: ERR_UTILITY_ACCOUNT_NOT_FOUND
    http: 404
    condition: "utilityAccountId does not resolve"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A foreign key in the request body does not resolve to an existing row"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required input, wrong type, enum outside its member set, number outside range, malformed date, inverted window or ownership_share_pct outside (0, 100]"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit outside [1, 100] or offset negative"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal AnnexationCase.version on POST /fiscal-impact-analyses"
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_of_services_version does not equal PlanOfServices.version on POST /service-commitments"
  - id: ERR_CASE_TERMINAL
    http: 409
    condition: "The case is DENIED, MSD_ALTERNATIVE_ADOPTED or DE_ANNEXED and a write was attempted on it or one of its children"
  - id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "The case's status is not a declared from-state for the requested transition"
  - id: ERR_PETITION_EXPIRED
    http: 409
    condition: "The petition's sufficiency_status is EXPIRED"
  - id: ERR_PETITION_ALREADY_CIRCULATING
    http: 409
    condition: "The case already has a petition with sufficiency_status CIRCULATING or SUFFICIENT"
  - id: ERR_CONSENT_ALREADY_WITHDRAWN
    http: 409
    condition: "Withdrawing a consent whose consent_status is already WITHDRAWN"
  - id: ERR_FILING_ALREADY_WITHDRAWN
    http: 409
    condition: "Withdrawing a protest filing whose filing_status is already WITHDRAWN"
  - id: ERR_HEARING_NOT_SCHEDULED
    http: 409
    condition: "Publishing notice for, or holding, a hearing whose hearing_status is not SCHEDULED"
  - id: ERR_HEARING_ALREADY_HELD
    http: 409
    condition: "Another hearing of the same case already has hearing_status HELD"
  - id: ERR_PROTEST_PERIOD_CLOSED
    http: 409
    condition: "Closing an already-closed protest period, or filing/withdrawing a protest after the period closed"
  - id: ERR_PLAN_ALREADY_ADOPTED
    http: 409
    condition: "The case already has a PlanOfServices with adoption_status ADOPTED"
  - id: ERR_COMMITMENT_STATE_INVALID
    http: 409
    condition: "Activating a commitment that is not DRAFT, or voiding one that is already VOIDED"
  - id: ERR_ANALYSIS_STATE_INVALID
    http: 409
    condition: "Finalizing an analysis whose status is not DRAFT"
  - id: ERR_TAX_ROLL_ALREADY_POSTED
    http: 409
    condition: "The case's tax_roll_status is not NOT_TRANSFERRED"
  - id: ERR_COMMISSION_REVIEW_NOT_PENDING
    http: 409
    condition: "commission_review_status is not PENDING when submitting to or deciding at the boundary commission"
  - id: ERR_PARCEL_STATE_INVALID
    http: 409
    condition: "Excluding a parcel that is not PROPOSED or PENDING_ANNEX, or adding a parcel to a case that has left DRAFT"
  - id: ERR_PARCEL_ALREADY_IN_PENDING_CASE
    http: 409
    condition: "The parcel_apn already appears in another case of the same municipality whose status is neither terminal nor EFFECTIVE"
  - id: ERR_METHOD_NOT_AUTHORIZED_BY_STATUTE
    http: 422
    condition: "The case's method is not in StatuteProfile.authorized_methods"
  - id: ERR_TERRITORY_EMPTY
    http: 422
    condition: "Certifying an ANNEXATION territory with no PROPOSED or PENDING_ANNEX parcel, or a DE_ANNEXATION case whose predecessor holds no INCORPORATED parcel"
  - id: ERR_TERRITORY_NOT_CONTIGUOUS
    http: 422
    condition: "contiguity_ratio is below StatuteProfile.contiguity_min_ratio"
  - id: ERR_URBAN_DEVELOPMENT_TEST_FAILED
    http: 422
    condition: "Neither the subdivision limb nor the density limb of the urban-development test passes"
  - id: ERR_SERVICE_CAPABILITY_INSUFFICIENT
    http: 422
    condition: "qualification_index is below StatuteProfile.min_qualification_index"
  - id: ERR_PLAN_NOT_ADOPTED
    http: 422
    condition: "The case has no PlanOfServices with adoption_status ADOPTED"
  - id: ERR_SERVICE_TYPE_NOT_COVERED
    http: 422
    condition: "The plan's covered_service_types is missing a member of StatuteProfile.required_service_types"
  - id: ERR_PLAN_SERVICE_TIMELINE_EXCEEDS_STATUTE
    http: 422
    condition: "A commitment's timeline_days exceeds the statutory maximum for its service_type"
  - id: ERR_NOTICE_NOT_PUBLISHED
    http: 422
    condition: "Holding a hearing with no PUBLISHED notice"
  - id: ERR_PROTEST_PERIOD_OPEN
    http: 409
    condition: "Adopting an ordinance while the HELD hearing's protest_outcome is still OPEN"
  - id: ERR_PETITION_WINDOW_CLOSED
    http: 422
    condition: "Signing a consent outside the petition's circulation window"
  - id: ERR_NOTICE_WINDOW_NOT_SATISFIED
    http: 422
    condition: "Holding a hearing before notice_published_at + StatuteProfile.notice_min_days days"
  - id: ERR_HEARING_NOT_STARTED
    http: 422
    condition: "Holding a hearing before its scheduled_start_at"
  - id: ERR_PROTEST_PERIOD_NOT_CLOSED
    http: 422
    condition: "Closing the protest period before the logical clock passes protest_closes_at"
  - id: ERR_PROTEST_FILING_OUT_OF_WINDOW
    http: 422
    condition: "Filing a protest outside the closed interval [protest_opens_at, protest_closes_at]"
  - id: ERR_COOLING_OFF_NOT_ELAPSED
    http: 422
    condition: "Adopting an ordinance before hearing_held_at + StatuteProfile.hearing_to_ordinance_min_days days"
  - id: ERR_EFFECTIVE_DATE_INVALID
    http: 422
    condition: "The submitted effective_date is not the date StatuteProfile.effective_date_rule requires"
  - id: ERR_HEARING_SLOT_CONFLICT
    http: 409
    condition: "The requested hearing window overlaps another SCHEDULED or HELD hearing of the same municipality once the changeover buffer is applied"
  - id: ERR_PROVIDER_SERVICE_TYPE_MISMATCH
    http: 422
    condition: "The commitment's service_type is not in ServiceProvider.service_types"
  - id: ERR_PARCEL_CASE_MISMATCH
    http: 422
    condition: "A referenced parcel, provider or hearing belongs to a different case or municipality than the target"
  - id: ERR_CONSENT_DUPLICATE
    http: 409
    condition: "A SIGNED consent already exists for the same petition, parcel and owner"
  - id: ERR_FILING_DUPLICATE
    http: 409
    condition: "A FILED protest already exists for the same hearing, parcel and owner"
  - id: ERR_DE_ANNEXATION_NOT_ALLOWED
    http: 422
    condition: "De-annexation is disallowed by statute, a DE_ANNEXATION case lacks a predecessor, or an ANNEXATION case supplies one"
  - id: ERR_PREDECESSOR_NOT_EFFECTIVE
    http: 422
    condition: "The predecessor case is not EFFECTIVE or belongs to another municipality"
  - id: ERR_MSD_ALTERNATIVE_NOT_ALLOWED
    http: 422
    condition: "StatuteProfile.msd_alternative_allowed is false"
  - id: ERR_COMMISSION_APPROVAL_REQUIRED
    http: 409
    condition: "Effectuating a case that requires boundary commission approval without commission_review_status APPROVED"
  - id: ERR_PROVIDER_CAPACITY_EXCEEDED
    http: 409
    condition: "Activating a commitment would exceed the provider's concurrent_project_capacity on at least one calendar day of its closed window"
  - id: ERR_CONSENT_OWNERSHIP_SHARE_INVALID
    http: 422
    condition: "Cumulative SIGNED ownership_share_pct for a parcel on one petition would exceed 100"
  - id: ERR_PROTEST_OWNERSHIP_SHARE_INVALID
    http: 422
    condition: "Cumulative FILED ownership_share_pct for a parcel on one hearing would exceed 100"
  - id: ERR_FISCAL_ANALYSIS_NOT_FINALIZED
    http: 422
    condition: "The case has no FiscalImpactAnalysis with status FINALIZED"
  - id: ERR_FISCAL_METHOD_NOT_AUTHORIZED
    http: 422
    condition: "analysis_method differs from StatuteProfile.fiscal_method"
  - id: ERR_FISCAL_DEFICIT_EXCEEDS_TOLERANCE
    http: 422
    condition: "The FINALIZED analysis's deficit_ratio_pct exceeds Municipality.fiscal_deficit_tolerance_pct"
  - id: ERR_PETITION_INSUFFICIENT
    http: 422
    condition: "Certifying a petition that has not reached its statutory signature threshold"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: StateLawAdmin
    description: "State-level administrator who publishes annexation statute profiles, registers municipalities and property owners of record, and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /statute-profiles"
      - "POST /municipalities"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /property-owners (shared with CityClerk)"
      - "all GET reads"

  - name: MunicipalPlanner
    description: "City planning officer who assembles territory, certifies it, drafts the plan of services and its commitments, and effectuates the boundary change"
    identity: "entity_backed:Municipality"
    exclusive_operations:
      - "POST /municipalities/{municipalityId}/service-providers"
      - "POST /annexation-cases"
      - "POST /annexation-cases/{caseId}/parcels"
      - "POST /parcels/{parcelId}/exclude"
      - "POST /annexation-cases/{caseId}/certify-territory"
      - "POST /utility-accounts"
      - "POST /petitions"
      - "POST /plans-of-services"
      - "POST /service-commitments"
      - "POST /service-commitments/{commitmentId}/activate"
      - "POST /service-commitments/{commitmentId}/void"
      - "POST /annexation-cases/{caseId}/submit-to-commission"
      - "POST /annexation-cases/{caseId}/effectuate"
    shared_operations:
      - "all GET reads"

  - name: CityClerk
    description: "Municipal clerk who runs the statutory record: petition certification, notice publication, hearings, protest tabulation, ordinance adoption, referendum recording and the MSD alternative"
    identity: "entity_backed:Municipality"
    exclusive_operations:
      - "POST /petitions/{petitionId}/certify-sufficiency"
      - "POST /plans-of-services/{planId}/adopt"
      - "POST /public-hearings"
      - "POST /public-hearings/{hearingId}/notice-publications"
      - "POST /public-hearings/{hearingId}/hold"
      - "POST /public-hearings/{hearingId}/close-protest-period"
      - "POST /annexation-cases/{caseId}/adopt-ordinance"
      - "POST /annexation-cases/{caseId}/record-referendum"
      - "POST /annexation-cases/{caseId}/adopt-msd-alternative"
    shared_operations:
      - "POST /property-owners (shared with StateLawAdmin)"
      - "POST /parcel-owner-consents and its withdraw (shared with PropertyOwner — the clerk records paper filings)"
      - "POST /protest-filings and its withdraw (shared with PropertyOwner)"
      - "all GET reads"

  - name: PropertyOwner
    description: "Owner of record inside the proposed territory, who signs or withdraws petition consents and files or withdraws written protests for their own parcels"
    identity: "entity_backed:PropertyOwner"
    exclusive_operations: []
    shared_operations:
      - "POST /parcel-owner-consents (own property_owner_id only)"
      - "POST /parcel-owner-consents/{consentId}/withdraw (own consents only)"
      - "POST /protest-filings (own property_owner_id only)"
      - "POST /protest-filings/{filingId}/withdraw (own filings only)"
      - "all GET reads"

  - name: FiscalAnalyst
    description: "Finance-office analyst who authors and finalizes the fiscal impact analysis of service extension against projected revenue"
    identity: opaque
    exclusive_operations:
      - "POST /fiscal-impact-analyses"
      - "POST /fiscal-impact-analyses/{analysisId}/finalize"
    shared_operations:
      - "all GET reads"

  - name: BoundaryCommissioner
    description: "State boundary-commission member who approves or denies annexations where review is required; barred by segregation of duties from deciding a case whose fiscal analysis they finalized"
    identity: opaque
    exclusive_operations:
      - "POST /annexation-cases/{caseId}/commission-decision"
    shared_operations:
      - "all GET reads"

  - name: CountyAssessor
    description: "County assessor who transfers annexed parcels onto the municipal tax roll with fiscal-year proration"
    identity: opaque
    exclusive_operations:
      - "POST /annexation-cases/{caseId}/post-tax-roll"
    shared_operations:
      - "all GET reads"
