        distinguishing_aspect: "Finalize then reopen leaves the money partition invariant intact: mgmt_fee_cents(4506) + owner_payout_cents(20524) + work_order_owner_charges_cents(5000) == gross_rental_cents(30030), and tax_remitted_cents reverts to 0 — conserved quantity is money (cents)."
