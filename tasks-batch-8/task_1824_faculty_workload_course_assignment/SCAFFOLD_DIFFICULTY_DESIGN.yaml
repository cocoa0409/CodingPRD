  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: large_class_threshold_enrollment_boundary
        grounds:
          - calculations.assignment_credit_units
          - entities.WorkloadTerm.fields.large_class_threshold
        distinguishing_aspect: |
          Metric enrollment_count on endpoint enrollment-sync + POST
          /assignments: the bonus fires at enrolled_count >= 40 (inclusive), so
          39 yields credit_units 3.0 and exactly 40 yields 4.0.
        test_recipe:
          setup:
            - "Term OPEN default policy (threshold 40, bonus 1.0); CS-301 IN_PERSON sections 01 (MON) and 02 (TUE), caps raised to 60; Anna qualified"
            - "Section 01 synced to enrolled_count 39; section 02 synced to 40"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600, enrollment_cap: 60 }, as: DepartmentChair, captures: { s1_id: "$.data.id", s1_v: "$.data.version" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /course-sections/${s1_id}/enrollment-sync", payload: { enrolled_count: 39, expected_section_version: "${s1_v}" }, as: Registrar }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "02", modality: "IN_PERSON", meeting_day: "TUE", start_minute: 540, end_minute: 600, enrollment_cap: 60 }, as: DepartmentChair, captures: { s2_id: "$.data.id", s2_v: "$.data.version" } }
            - { call: "POST /course-sections/${s2_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /course-sections/${s2_id}/enrollment-sync", payload: { enrolled_count: 40, expected_section_version: "${s2_v}" }, as: Registrar }
          trigger:
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id", a1_cr: "$.data.credit_units" } }
            - { call: "POST /assignments", payload: { section_id: "${s2_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a2_id: "$.data.id", a2_cr: "$.data.credit_units" } }
          assert:
            - "Assignment.${a1_id}.credit_units == 3.0 (enrolled_count 39 < threshold 40: no bonus)"
            - "Assignment.${a2_id}.credit_units == 4.0 (enrolled_count 40 >= threshold 40: +1.0 bonus — boundary is inclusive)"

      - name: late_window_day_boundary
        grounds:
          - calculations.late_cancel_stipend
          - entities.WorkloadTerm.fields.reassignment_notice_days
          - entities.Assignment.fields.stipend_cents
        distinguishing_aspect: |
          Metric calendar-days-remaining on endpoint POST
          /assignments/{id}/transition (different metric AND endpoint from the
          enrollment boundary): stipend fires only when days_remaining <
          reassignment_notice_days, so exactly 14 days out is NOT late and
          13 days IS late.
        test_recipe:
          setup:
            - "Term OPEN, start_date 2026-08-24, notice window 14; CS-301; Anna qualified; sections 01 (MON), 02 (TUE), 03 (WED) each with a CONFIRMED assignment for Anna"
          setup_api_calls:
