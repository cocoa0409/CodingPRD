    input: [""]
    output: CustomDesignOrder
    side_effects: []
  - method: POST
    path: "/custom-design-orders/{id}/revisions"
    description: "Request a CAD revision; the first two are free and each later one is charged"
    roles: [Customer]
    code: 200
    input: [""]
    output: CustomDesignOrder
    side_effects: ["revision_count += 1", "revision_fee_cents += CAD_REVISION_FEE_CENTS when past the free limit", "design_status = CAD_REVISION"]
  - method: POST
    path: "/custom-design-orders/{id}/cad-approval"
    description: "Customer approves the CAD, locking the deposit as forfeitable"
    roles: [Customer]
    code: 200
    input: [""]
    output: CustomDesignOrder
    side_effects: ["design_status = CAD_APPROVED", "approved_at stamped", "non_refundable_deposit_cents = deposit_cents"]
  - method: POST
    path: "/custom-design-orders/{id}/start-production"
    description: "Release an approved design to the workshop"
    roles: [StoreManager]
    code: 200
    input: [""]
    output: CustomDesignOrder
    side_effects: ["design_status = IN_PRODUCTION", "refundable_deposit_cents = 0"]
  - method: POST
    path: "/custom-design-orders/{id}/recall"
    description: "Recall an in-production order whose shop quote moved more than ten percent off the estimate"
    roles: [StoreManager]
    code: 200
    input: [variance_pct]
    output: CustomDesignOrder
    side_effects: ["design_status reverts to CAD_APPROVED, then DEPOSIT_PAID when the customer declines", "non_refundable_deposit_cents = 0"]
  - method: POST
    path: "/custom-design-orders/{id}/complete"
    description: "Complete a commission and open the purchase that bills the estimate plus revision fees"
    roles: [StoreManager]
    code: 200
    input: [""]
    output: CustomDesignOrder
    side_effects: ["design_status = COMPLETED", "Purchase opened at estimate_amount_cents + revision_fee_cents"]
  - method: POST
    path: "/custom-design-orders/{id}/cancel"
    description: "Cancel a commission, keeping the non-refundable deposit whenever the design was approved"
    roles: [Customer, StoreManager]
    code: 200
    input: [""]
    output: CustomDesignOrder
    side_effects: ["design_status = CANCELLED", "custom_design_deposit_and_forfeit evaluated for cancellation_fee_cents", "refundable_deposit_cents released"]

  # --- Billing statements ---
  - method: POST
    path: "/billing-statements"
    description: "Generate a statement, allocating any payment across the three credit buckets"
    roles: [CreditAnalyst, CustomerService]
    code: 201
    input: [customer_id, statement_period, lines, "payment_cents?"]
    output: BillingStatement
    side_effects: ["payment_allocation_waterfall applied", "statement_balance_rollup computed", "min_payment_due_cents computed", "statement_status = OPEN"]
  - method: GET
    path: "/billing-statements"
    description: "List billing statements"
    roles: [ChainAdmin, CreditAnalyst, CustomerService, Customer]
    code: 200
    input: ["customer_id?", "statement_status?", "limit?", "offset?"]
    output: BillingStatement[]
    side_effects: []
  - method: GET
    path: "/billing-statements/{id}"
    description: "Get a billing statement"
    roles: [ChainAdmin, CreditAnalyst, CustomerService, Customer]
    code: 200
    input: [""]
    output: BillingStatement
    side_effects: []
  - method: POST
    path: "/billing-statements/{id}/close"
    description: "Close a statement"
    roles: [CustomerService]
    code: 200
    input: [""]
    output: BillingStatement
    side_effects: ["statement_status = CLOSED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role names no declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is not listed in the endpoint's roles, or performs another role's exclusive operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "request body misses a required field, carries an unknown field, or a field's type is wrong" }
  - { id: ERR_VALIDATION_FAILED, http: 422, condition: "a declared enum field receives a value outside its constraint set, or a numeric field falls outside its declared range" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "the path resource does not exist, or a body-supplied FK does not resolve" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "POST /customers with an email already held by another customer" }
  - { id: ERR_DUPLICATE_STONE_CODE, http: 409, condition: "POST /diamonds or POST /protection-bundles or POST /vendor-shops with a code already on file" }
  - { id: ERR_REGISTRY_ROW_MISSING, http: 422, condition: "no CreditLimitRegistryState row resolves for the priced tier and requested amount on a decision" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "the requested credit exceeds the standalone limit implied by the customer's credit tier" }
  - { id: ERR_DOWN_PAYMENT_REQUIRED, http: 422, condition: "declared down_payment_cents is below the formula-derived minimum down payment for the application's decisioned tier" }
  - { id: ERR_CREDIT_FROZEN, http: 422, condition: "the customer has at least one PromotionalPlan in plan_status DEFAULTED; all new credit obligations are refused" }
  - { id: ERR_ACCOUNT_NOT_OPEN, http: 422, condition: "the customer account carrying the obligation is not in account_status OPEN" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a state from which the requested transition is declared" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "the acting customer named by X-User-ID does not own the resource named in the path" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version" }
  - { id: ERR_PLAN_ALREADY_EXISTS, http: 409, condition: "a non-terminal PromotionalPlan already references the same purchase_id" }
  - { id: ERR_INSUFFICIENT_PAYOFF, http: 422, condition: "the payoff amount is below the plan's final settlement amount" }
  - { id: ERR_WINDOW_EXPIRED, http: 422, condition: "the acting instant falls outside the resource's declared validity window (decision validity, simplicity window, inspection cure window, store hold window)" }
  - { id: ERR_EXTENSION_WINDOW_EXPIRED, http: 422, condition: "an InspectionVisit is logged with a visit_at earlier than one full cycle before the registration's current inspection_due_at" }
  - { id: ERR_HOLD_PROMISE_CEILING, http: 422, condition: "a requested repair deadline extension would push promised_delivery_at past accepted_at + 1.5 x vendor_turnaround_days" }
  - { id: ERR_REGULATION_TERMS_VIOLATION, http: 422, condition: "no ServicePlanRegulation row exists for the store's state, or the plan's term exceeds the registered maximum" }
  - { id: ERR_PLAN_TERM_EXCEEDS_REGULATION, http: 422, condition: "plan_term_months exceeds ServicePlanRegulation.max_plan_term_months for the store's state" }
  - { id: ERR_PLAN_TERMS_UNSATISFIED, http: 422, condition: "the pinned ServicePlanRegistration is TERMINATED or VOID, or its bundle terms no longer cover the failure class" }
  - { id: ERR_REGISTRATION_TERMINATED, http: 409, condition: "an action is attempted against a registration already in a terminal coverage_status" }
  - { id: ERR_ORIGIN_DOCUMENT_MISSING, http: 422, condition: "a natural centre stone over 1.00 carat is acted on without an origin_registry document on file" }
  - { id: ERR_RING_METAL_NOT_CERTIFIED, http: 422, condition: "a custom design names an alloy outside the certified production metal list" }
  - { id: ERR_INSUFFICIENT_DEPOSIT, http: 422, condition: "a custom design deposit_pct falls below 0.30, or the recomputed deposit cannot cover the shop's release requirement" }
  - { id: ERR_REVISION_LIMIT_REACHED, http: 409, condition: "a sixth CAD revision is requested on the same custom design order" }
  - { id: ERR_VENDOR_MISSING, http: 422, condition: "the bench shop named by vendor_routing_and_turnaround does not exist with vendor_status ACTIVE" }
  - { id: ERR_VENDOR_AGREEMENT_REQUIRED, http: 422, condition: "the rush routing shop has no signed alliance agreement, so the rush route cannot be taken" }
  - { id: ERR_APPRAISAL_REQUIRED, http: 422, condition: "an insurance replacement advice is circulated against a repair that carries no issued replacement appraisal" }
  - { id: ERR_CLAIM_ALREADY_USED, http: 409, condition: "the registration's replacement_claims_used is already 1 when a second replacement advice is circulated" }
  - { id: ERR_TRADE_UP_GUARDIAN_REFERENCE, http: 409, condition: "a trade-up credit is stamped on a purchase that already names an origin_purchase_id or has reached TRADE_UP_APPLIED, so crediting it again would double-credit the same console" }
  - { id: ERR_TRADE_UP_FLOOR_NOT_MET, http: 422, condition: "the new purchase ticket does not reach twice the origin purchase price" }
  - { id: ERR_STORE_CREDIT_CAPACITY_EXCEEDED, http: 422, condition: "the store's available credit capacity cannot cover the obligation being booked" }
  - { id: ERR_CUSTOMER_ACTIVE_OBLIGATIONS, http: 409, condition: "a close is attempted while the customer still holds a non-terminal repair, a live registration, or a nonzero outstanding balance" }
  - { id: ERR_STATEMENT_OVERPAYMENT, http: 422, condition: "the statement payment exceeds the sum of the customer's three bucket balances" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ChainAdmin
    description: "Chain operations administrator; owns configuration and store lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /stores — Open store"
      - "POST /stores/{id}/activate — Activate store"
      - "POST /stores/{id}/suspend — Suspend store"
      - "POST /stores/{id}/reinstate — Reinstate store"
      - "POST /credit-limit-registry-state — Register risk-registry row"
      - "POST /service-plan-regulations — Register state lifetime-plan terms"
      - "POST /vendor-shops — Register bench shop"
      - "POST /protection-bundles — Register bundle"
      - "POST /protection-bundles/{id}/retire — Retire bundle"
      - "POST /service-plan-registrations/{id}/void — Void registration whose state has no registered terms"
      - "POST /_clock/set_current_utc — Set the logical clock"
    shared_operations:
      - "GET reads across stores, registry rows, regulations, shops, bundles, customers, applications, plans, registrations, repairs, appraisals, purchases, designs, statements"
  - name: StoreManager
    description: "Store manager; owns intake, inspections, repair routing and commission production"
    identity: opaque
    exclusive_operations:
      - "POST /repairs — Intake repair"
      - "POST /repairs/{id}/route — Route repair"
      - "POST /repairs/{id}/arrive-vendor — Record bench arrival"
      - "POST /repairs/{id}/submit-qc — Submit for quality review"
      - "POST /repairs/{id}/verify — Verify completed repair"
      - "POST /repairs/{id}/declare-unrepairable — Declare unrepairable"
      - "POST /repairs/{id}/declare-loss — Verify loss"
      - "POST /repairs/{id}/holds — Request deadline extension"
      - "POST /service-plan-registrations/{id}/exams — Log inspection visit"
      - "POST /service-plan-registrations/{id}/renew — Renew lapsed registration"
      - "POST /inspection-visits — Log store visit"
      - "POST /inspection-visits/{id}/claim — Claim visit"
      - "POST /inspection-visits/{id}/no-show — Record no-show"
      - "POST /inspection-reminders/run — Run reminder sweep"
      - "POST /custom-design-orders/{id}/start-production — Release to workshop"
      - "POST /custom-design-orders/{id}/recall — Recall in-production order"
      - "POST /custom-design-orders/{id}/complete — Complete commission"
    shared_operations:
      - "POST /service-plan-registrations — Register plan"
      - "POST /custom-design-orders — Open commission"
      - "POST /repairs/{id} GET reads"
  - name: CreditAnalyst
    description: "Credit analyst; owns decisioning, sweeps and account posture"
    identity: opaque
    exclusive_operations:
      - "POST /credit-applications/{id}/decision — Record instant decision"
      - "POST /credit-applications/expire-due — Expire stale applications"
      - "POST /plans/capitalize-due — Capitalize deferred interest"
      - "POST /plans/default-due — Default overdue plans"
      - "POST /promotional-plans/{id}/reinstate — Reinstate defaulted plan"
      - "POST /service-plan-registrations/lapse-due — Lapse missed inspections"
      - "POST /customers/{id}/reinstate — Reinstate suspended account"
    shared_operations:
      - "POST /billing-statements — Generate statement"
      - "POST /payoff-ledger-entries — Append ledger entry"
  - name: SalesAssociate
    description: "Counter sales associate; opens tickets, takes applications and completes sales"
    identity: opaque
    exclusive_operations:
      - "POST /purchases — Open purchase ticket"
      - "POST /purchases/{id}/complete — Complete purchase"
      - "POST /diamonds — Register stone"
    shared_operations:
      - "POST /customers — Create customer"
      - "POST /credit-applications — Take application"
      - "POST /promotional-plans — Open plan"
      - "POST /promotional-plans/{id}/payoff — Apply payoff"
      - "POST /repairs — Intake repair"
      - "POST /service-plan-registrations — Register plan"
      - "POST /custom-design-orders — Open commission"
      - "GET /purchases/{id}/trade-up-preview — Preview trade-up"
  - name: CustomerService
    description: "Aftercare desk; resolves repairs, appraisals, statements and cancellations"
    identity: opaque
    exclusive_operations:
      - "POST /appraisals/{id}/advise-insurer — Circulate replacement advice"
      - "POST /customers/{id}/close — Close customer account"
      - "POST /repairs/abandon-overdue — Abandon unclaimed repairs"
      - "POST /promotional-plans/{id}/cancel — Void unpaid plan"
    shared_operations:
      - "POST /customers — Create customer"
      - "POST /credit-applications — Take application"
      - "POST /promotional-plans/{id}/payoff — Apply payoff"
      - "POST /billing-statements — Generate statement"
      - "POST /billing-statements/{id}/close — Close statement"
      - "POST /appraisals — Issue appraisal"
      - "POST /service-plan-registrations/{id}/terminate — Terminate registration"
  - name: Customer
    description: "Cardholder acting on their own application, commission and statements"
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /credit-applications/{id}/accept — Accept countered offer"
      - "POST /credit-applications/{id}/decline-counter — Decline countered offer"
      - "POST /custom-design-orders/{id}/revisions — Request CAD revision"
      - "POST /custom-design-orders/{id}/cad-approval — Approve CAD"
    shared_operations:
      - "POST /custom-design-orders/{id}/cancel — Cancel own commission"
      - "GET /billing-statements — Read own statements"
