  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: application_filing_is_gated_by_the_parcel_eligibility_dimension
        grounds:
          - validations[priority=22]
          - state_machines.Parcel.ELIGIBLE_to_UNDER_APPLICATION
          - state_machines.Parcel.UNDER_APPLICATION_to_ELIGIBLE
          - entities.Parcel.fields.status
          - entities.Application.fields.contiguity_acres_at_receipt
          - endpoints[POST /applications]
          - errors.ERR_PARCEL_NOT_ELIGIBLE
        distinguishing_aspect: |
          The gate lives on a DIFFERENT aggregate than the one being created and on a
          different branch of the graph: filing on funding round R3 is refused because Parcel
          PA1 is UNDER_APPLICATION from an application on round R1, even though R3 itself is
          OPEN, the landowner is ACTIVE and the payload is otherwise identical to the one that
          succeeded. Withdrawing the R1 application returns PA1 to ELIGIBLE and the very same
          R3 payload then succeeds, so the refusal cannot be attributed to the round, the
          landowner or the request shape.
        test_recipe:
          setup:
            - "Program P1 with its three funding sources. Round R1 is OPEN and Application AP1 has been filed on it at clock 2026-08-10, so Parcel PA1.status == UNDER_APPLICATION."
            - "A second round R3 on the same program is created and OPENED with the identical 2026-08-05 .. 2026-09-30 window."
          setup_api_calls:
            - *c_prog1
            - *c_src_local
            - *c_src_state
            - *c_src_fed
            - *c_round1
            - *c_round1_open
            - *c_lo_a
            - *c_clk_0810
            - *c_parcel_a
            - *c_app_a
            - call: "POST /funding-rounds"
              payload: { program_id: "${prog_id}", round_label: "2026 Cycle C", opens_on: "2026-08-05T00:00:00Z", closes_on: "2026-09-30T00:00:00Z", pool_cents: 500000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { round3_id: $.data.id }
            - call: "POST /funding-rounds/${round3_id}/opening"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /applications"
              payload: { funding_round_id: "${round3_id}", parcel_id: "${parcel_a_id}", landowner_id: "${lo_a_id}", requested_price_cents: 170000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "POST /applications/${app_a_id}/withdrawal"
              payload: { withdrawal_reason: "refiling on the later cycle" }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "POST /applications"
              payload: { funding_round_id: "${round3_id}", parcel_id: "${parcel_a_id}", landowner_id: "${lo_a_id}", requested_price_cents: 170000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { app_a3_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_PARCEL_NOT_ELIGIBLE"
            - "Parcel.${parcel_a_id}.status == UNDER_APPLICATION at the time of the refusal"
            - "FundingRound.${round3_id}.status == OPEN and application_count == 0 after the refusal"
            - "the second trigger call returns HTTP 200 and Application.${app_a_id}.status == WITHDRAWN"
            - "Parcel.${parcel_a_id}.status == ELIGIBLE immediately after the withdrawal"
            - "the third trigger call returns HTTP 201 with Application.${app_a3_id}.status == RECEIVED"
            - "Application.${app_a3_id}.contiguity_acres_at_receipt == 80.00"
            - "Parcel.${parcel_a_id}.status == UNDER_APPLICATION again after the third call"
            - "FundingRound.${round3_id}.application_count == 1 and FundingRound.${round1_id}.application_count == 1"

      - name: amendment_submission_is_gated_by_the_easement_compliance_dimension_under_strict_policy
        grounds:
          - validations[priority=17]
          - state_machines.Amendment.DRAFT_to_UNDER_REVIEW
          - state_machines.Amendment.SUSPENDED_to_UNDER_REVIEW
          - state_machines.Easement.compliance_status
          - entities.PreservationProgram.fields.amendment_policy
          - endpoints[POST /amendments/{id}/submission]
          - endpoints[POST /amendments/{id}/reinstatement]
          - errors.ERR_EASEMENT_NOT_COMPLIANT
        distinguishing_aspect: |
          The guard reads a field two aggregates away — Amendment -> Easement.compliance_status
          -> PreservationProgram.amendment_policy — and the answer depends on the POLICY value,
          not just the state value. Under STRICT, only COMPLIANT admits a submission, so the
          same endpoint that succeeded for amendment AM1 while the easement was COMPLIANT now
          refuses AM2 at VIOLATION_CURED even though stewardship_hold is false and
          open_violation_count is 0; a CONDITIONAL program would admit VIOLATION_CURED. The
          second trigger call pins the SCOPE of that arm: reinstatement reads only the
          stewardship_hold arm of the same rule, so AM1 legitimately moves SUSPENDED ->
          UNDER_REVIEW in the exact compliance state that blocks AM2's submission. Applying
          the compliance arm to every amendment write, or applying only the hold arm to
          submission, breaks one half of this instance.
        test_recipe:
          setup:
            - "Program P1 has amendment_policy STRICT. Easement EA1 exists from the 2026-12-15 closing of AP1."
            - "At clock 2027-01-10, while compliance_status is COMPLIANT, amendment AM1 (BOUNDARY_ADJUSTMENT, net_conservation_benefit_cents 250,000) is created and submitted successfully, so it reaches UNDER_REVIEW."
