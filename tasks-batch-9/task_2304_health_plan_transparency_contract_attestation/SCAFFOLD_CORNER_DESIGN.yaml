            - "all four projections return data.open_deficiency_count == 0, data.accrued_to_date_cents == 0 and data.statutory_maximum_cents == 0"

      - name: tool_uptime_merges_touching_windows_and_clips_other_months
        claim_type: interval_merge
        grounds:
          - calculations.tool_monthly_uptime
          - endpoints[POST /compliance/price-comparison-tools/{id}/evaluations]
          - endpoints[POST /compliance/price-comparison-tools/{id}/outage-windows]
        distinguishing_aspect: "Scoring 2027-06 clips out the 600-minute May window entirely, merges the two touching June windows into ONE 252-minute interval and keeps the disjoint 60-minute June window separate: downtime_minutes == 312, not 912 (May included) and not 372 (a stray double count). 100 * (43200 - 312) / 43200 = 99.2777... rounds half-up to 99.28, which is above the 99.00 target, so no breach opens."
