            - call: "POST /proctor-sessions/${ps_id}/complete"
              payload: { score_percent: 78.00, integrity_incident: false }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /course-enrollments/${enr_id}/submit-for-award"
              payload: { final_percent: 84.00 }
