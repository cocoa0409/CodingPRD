            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"

      - name: deliver_with_open_recall_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_OPEN_RECALL_BLOCKS_DELIVERY]"]
        distinguishing_aspect: "Delivering a FUNDED deal whose unit has open_recall=true returns ERR_OPEN_RECALL_BLOCKS_DELIVERY (409)."
        test_recipe:
          setup: ["A FUNDED deal on a CASH unit created with open_recall true."]
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINRECALL001", make: "Regal", model: "28", model_year: 2020, unit_type: "BOAT", length_ft: 28, cost_cents: 6000000, list_price_cents: 7300000, acquisition_type: "CASH", open_recall: true }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /units/${u_id}/list"
              payload: {}
              as: Manager
            - call: "POST /deals"
              payload: { unit_id: "${u_id}", customer_name: "Gil", sale_price_cents: 7300000, financing_type: "CASH", tax_rate_bps: 700, doc_fee_cents: 39900, down_payment_cents: 3000000 }
              as: SalesRep
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /deals/${d_id}/fund"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /deals/${d_id}/deliver"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OPEN_RECALL_BLOCKS_DELIVERY"

