# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2967_label_distribution_deal_recoupment_accounting
#
# Machine-readable index of every difficulty feature SCAFFOLD.yaml §1.1–§1.7 already
# declares, cross-referenced against the nine §0.5 Difficulty Rules. Nothing here adds
# behaviour: every `grounds:` entry resolves into SCAFFOLD.yaml.
#
# Shared actor ids used by every recipe (opaque roles):
#   LabelAdmin        -> "label-admin-01"
#   BusinessAffairs   -> "biz-affairs-01"
#   RoyaltyAnalyst    -> "analyst-01"
#   DistributionPartner -> ${dist_id}   (entity_backed:Distributor)
#   Artist              -> ${artist_id} (entity_backed:Artist)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cross_collateralized_vs_siloed_advance_recoupment
        grounds:
          - calculations.advance_recoupment_waterfall
          - entities.DistributionDeal.fields.cross_collateralized
          - entities.DistributionDeal.fields.unrecouped_advance_cents
          - entities.Release.fields.advance_share_cents
          - endpoints[GET /distribution-deals/{id}/recoupment-summary]
          - state_machines.DspRevenueReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Domain = the deal-level advance pool. On one identical accepted period the
          CROSS_COLLATERALIZED arm applies 650000 cents of advance and reports RECOUPED, while the
          SILOED arm applies only 645000 and reports UNRECOUPED, because the SILOED arm caps each
          release at its own advance_share_cents and strands 35001 cents of Night Ferry surplus.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Distributor, one Artist"
            - "one DISTRIBUTION_FEE DistributionDeal, distribution_fee_pct 0.1500, advance_amount_cents 650000, cross_collateralized true, term 2026-01-01..2026-12-31, status EXECUTED"
            - "two RELEASED releases: Glass Harbour with advance_share_cents 600000 and Night Ferry with advance_share_cents 50000 (sum exactly equals the deal advance)"
            - "three StreamRateCard rows for dsp_code STRM: US/PREMIUM 4000 micros, US/AD_SUPPORTED 1200 micros, GB/PREMIUM 3000 micros, all effective_from 2026-01-01 with no effective_to"
            - "one DspRevenueReport for 2026-04-01..2026-06-30 with three lines (Glass Harbour US/PREMIUM 1000001 streams, Glass Harbour US/AD_SUPPORTED 2500003 streams, Night Ferry GB/PREMIUM 333338 streams), status ACCEPTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US", "GB"], cross_collateralized: true, advance_amount_cents: 650000, marketing_budget_cents: 500000, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345678905", title: "Glass Harbour", planned_release_date: "2026-02-01", formats: ["DIGITAL", "VINYL"], advance_share_cents: 600000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345678912", title: "Night Ferry", planned_release_date: "2026-02-15", formats: ["DIGITAL"], advance_share_cents: 50000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel2_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-2026-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel2_id}/release"
              payload: { actual_release_date: "2026-02-15" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "AD_SUPPORTED", rate_micros_per_stream: 1200, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "GB", tier: "PREMIUM", rate_micros_per_stream: 3000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /dsp-revenue-reports"
              payload: { deal_id: "${deal_id}", dsp_code: "STRM", period_start: "2026-04-01", period_end: "2026-06-30" }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /dsp-revenue-reports/${rep_id}/lines"
              payload: { release_id: "${rel1_id}", territory_code: "US", tier: "PREMIUM", stream_count: 1000001 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports/${rep_id}/lines"
              payload: { release_id: "${rel1_id}", territory_code: "US", tier: "AD_SUPPORTED", stream_count: 2500003 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports/${rep_id}/lines"
              payload: { release_id: "${rel2_id}", territory_code: "GB", tier: "PREMIUM", stream_count: 333338 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports/${rep_id}/submit"
              payload: {}
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_v: $.data.version }
            - call: "POST /dsp-revenue-reports/${rep_id}/accept"
              payload: { expected_deal_version: "${deal_v}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
          trigger:
            - call: "GET /distribution-deals/${deal_id}/recoupment-summary"
              payload: { variant: "CROSS_COLLATERALIZED" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
            - call: "GET /distribution-deals/${deal_id}/recoupment-summary"
              payload: { variant: "SILOED" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
          assert:
            - "DspRevenueReport.${rep_id}.gross_receipts_cents == 800001"
            - "DspRevenueReport.${rep_id}.distributor_share_cents == 120000"
            - "DspRevenueReport.${rep_id}.net_receipts_cents == 680001"
            - "the CROSS_COLLATERALIZED summary arm returns pool_net_receipts_cents == 680001, advance_applied_cents == 650000, unrecouped_advance_cents == 0, post_recoupment_net_receipts_cents == 30001, recoupment_status == RECOUPED"
            - "the SILOED summary arm returns pool_net_receipts_cents == 680001, advance_applied_cents == 645000, unrecouped_advance_cents == 5000, post_recoupment_net_receipts_cents == 35001, recoupment_status == UNRECOUPED"
            - "the two arms' advance_applied_cents differ by exactly 5000"
            - "DistributionDeal.${deal_id}.advance_recouped_cents == 650000 and DistributionDeal.${deal_id}.recoupment_status == RECOUPED (the persisted arm is CROSS because cross_collateralized is true)"
            - "Release.${rel1_id}.release_advance_recouped_cents == 595000 and Release.${rel2_id}.release_advance_recouped_cents == 55000 under the persisted CROSS arm"
            - "the SILOED release_breakdown reports 595000 for Glass Harbour and 50000 for Night Ferry, i.e. Night Ferry is capped at its own advance_share_cents"

      - name: provisional_vs_final_statement_net_payable
        grounds:
          - calculations.artist_statement_net_payable
          - calculations.recoupable_marketing_cap
          - entities.ArtistStatement.fields.basis_variant
          - entities.ArtistStatement.fields.reserve_withheld_cents
          - entities.PhysicalRun.fields.reserve_held_cents
          - state_machines.ArtistStatement.DRAFT_to_PREPARED
        distinguishing_aspect: |
          Domain = the artist statement's marketing and reserve buckets, a different entity domain
          from the deal-level advance pool of the sibling instance. On byte-identical database state
          the PROVISIONAL basis yields net_payable_cents 34600 and the FINAL basis 61820, a 27220
          divergence driven only by commitment-vs-invoice marketing and full-vs-unliquidated reserve.
        test_recipe:
          setup:
            - "the fixture of cross_collateralized_vs_siloed_advance_recoupment through report acceptance, so Glass Harbour carries accepted line net receipts of 340000 + 255000 = 595000"
            - "one ACTIVE ArtistAgreement on Glass Harbour: royalty_rate_pct 0.1200, escalated_royalty_rate_pct 0.1800, advance_amount_cents 50000, recording_costs_cents 100000, recording_recoupable_pct 0.5000, marketing_recoup_share_pct 0.5000; the deal reached RECOUPED so active_royalty_rate_pct is 0.1800"
            - "one PhysicalRun on Glass Harbour, window 2026-04-01..2026-06-30, 1200 units manufactured at 250 cents, 1000 shipped at 900 cents wholesale, 100 returned, then 40% of the reserve liquidated: reserve_initial_cents 135000, reserve_liquidated_cents 54000, reserve_held_cents 81000, physical_net_receipts_cents 510000"
            - "two marketing spends on Glass Harbour: a DIGITAL_ADS row of 60000 settled at 45000, and a TOUR_SUPPORT row of 40000 left APPROVED"
            - "two ArtistStatement rows for 2026-04-01..2026-06-30 on that agreement, one PROVISIONAL and one FINAL, both still DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
