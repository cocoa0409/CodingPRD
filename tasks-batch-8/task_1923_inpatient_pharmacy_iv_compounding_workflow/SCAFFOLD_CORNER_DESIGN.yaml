              captures: { drug_short: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugSNU", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_sub: $.data.id }
            - call: "POST /pharmacy/substitution-protocols"
              payload: { shortage_drug_product_id: "${drug_short}", substitute_drug_product_id: "${drug_sub}", conversion_factor: 0.5, max_dose_mg: 200.0, expires_at: "2026-09-01T00:00:00Z" }
              as: PharmacyAdmin
              captures: { proto_id: $.data.id }
            - call: "POST /pharmacy/substitution-protocols/${proto_id}/activate"
              payload: {}
              as: PharmacyAdmin
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_short}", route: "PO", ordered_dose_mg: 80.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/substitute"
              payload: { protocol_id: "${proto_id}" }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SUBSTITUTION_NOT_PENDING (422): activation swept no orders (none existed), so this later order was never flagged"
      - name: error_no_eligible_substitute_empty_pool
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ELIGIBLE_SUBSTITUTE]", "validations[priority=34]"]
        distinguishing_aspect: "Empty-set edge: protocol's substitute drug is DISCONTINUED -> activation fails ERR_NO_ELIGIBLE_SUBSTITUTE (422) (protocol activation guard), demonstrating the empty candidate pool."
        test_recipe:
          setup: ["Drug SHORT in_shortage; Drug SUB created DISCONTINUED; protocol DRAFT"]
          setup_api_calls:
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugNES", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, in_shortage: true }
              as: PharmacyAdmin
              captures: { drug_short: $.data.id }
            - call: "POST /pharmacy/drug-products"
