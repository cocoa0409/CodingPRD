scenario: "Class Action Settlement Administration: class-member notice, claim filing/validation, deficiency cure, opt-out/objection, pro-rata/tiered distribution, residual/cy pres, tax reporting, fund reconciliation"
domain_name: "class-action-settlement"
api_prefix: ""

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"

  entity_topology: flat
  # Peer entities linked by foreign keys (Settlement, ClassMember, Claim,
  # Deficiency, OptOutRequest, Objection, DistributionBatch, Payment, TaxForm,
  # CyPresDesignation, LedgerEntry, NoticeRecord). No nesting in URL paths;
  # all relationships are FK references on the child rows.

  state_machine_shape: branching
  # Claim is a branching-with-revert machine: SUBMITTED -> {VALIDATED, DEFICIENT},
  # DEFICIENT -> CURED -> re-validate (revision loop), with divergent side-effect
  # sets per branch. Settlement is posture/compound-flavored but the dominant
  # non-linear shapes are Claim (cyclic revision loop) and DistributionBatch
  # (branching fork into per-claimant payments then reconcile-or-reverse).

  relationship_patterns:
    - one_to_many       # Settlement -> ClassMember/Claim/DistributionBatch/LedgerEntry
    - cross_aggregate   # Payment references both DistributionBatch and Claim
    - self_referential  # Claim.supersedes_claim_id references a prior Claim (refile)

  role_model: segregation_of_duties
  # The user who validates a claim (ClaimsReviewer) cannot be the user who
  # approves the distribution batch that pays it (FundController). Notice and
  # member intake handled by a ClaimsAdministrator; objections ruled by the
  # Court actor. SettlementAdmin is the hierarchical superset that configures
  # the fund. Claimant is the entity-backed self-service role.

  consistency_model: immediate
  # All ledger debits/credits, derived-field recomputes, and cascades are
  # atomic within the triggering request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: case_caption
        type: string
        source: input
        description: "Human-readable case name, e.g. 'In re Acme Data Breach'."
      - name: gross_fund_cents
        type: integer
        source: input
        description: "Total settlement fund in cents, before any deductions. Immutable after creation."
        constraints: ">= 1"
      - name: attorney_fee_cents
        type: integer
        source: input
        description: "Court-approved attorney fees in cents, deducted from gross before the net distributable pool is computed."
        constraints: ">= 0"
      - name: admin_cost_cents
        type: integer
        source: input
        description: "Administration cost reserve in cents, deducted from gross before the net distributable pool is computed."
        constraints: ">= 0"
      - name: distribution_method
        type: enum
        source: input
        description: "PRO_RATA: each valid claim paid net_pool * (claim_recognized_loss / sum_recognized_loss). TIERED: fixed per-tier flat amounts capped by net pool."
        constraints: "one of {PRO_RATA, TIERED}"
      - name: tier_a_amount_cents
        type: integer
        source: input
        description: "Flat award for TIER_A claims under TIERED method, in cents. Required when distribution_method=TIERED, ignored otherwise."
        default: 0
        constraints: ">= 0"
      - name: tier_b_amount_cents
        type: integer
        source: input
        description: "Flat award for TIER_B claims under TIERED method, in cents. Required when distribution_method=TIERED, ignored otherwise."
        default: 0
        constraints: ">= 0"
      - name: claim_filing_deadline
        type: datetime
        source: input
        description: "Half-open claim window upper bound. A Claim with created_at >= this instant is rejected as untimely. ISO 8601 UTC."
      - name: objection_deadline
        type: datetime
        source: input
        description: "Half-open objection/opt-out window upper bound. An Objection or OptOutRequest with created_at >= this instant is rejected as untimely. ISO 8601 UTC."
      - name: cy_pres_floor_cents
        type: integer
        source: input
        description: "Per-claimant minimum economic-distribution threshold in cents. If the residual after distribution is strictly less than this floor it is swept to cy pres rather than redistributed."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle posture gating child operations. See §1.2 Settlement machine."
        default: "DRAFT"
        constraints: "one of {DRAFT, NOTICE_OPEN, CLAIMS_OPEN, CLAIMS_CLOSED, DISTRIBUTING, RECONCILED, CLOSED}"
      - name: net_distributable_cents
        type: integer
        source: computed
        description: "Computed: gross_fund_cents - attorney_fee_cents - admin_cost_cents. Recomputed on Settlement creation; the deductions are immutable so it never drifts."
      - name: allocated_cents
        type: integer
        source: computed
        description: "Running sum of cents committed to Payment rows across all POSTED DistributionBatch children of this Settlement. Recomputed on every batch post/reverse."
        default: 0
      - name: residual_cents
        type: integer
        source: computed
        description: "Computed at reconciliation: net_distributable_cents - allocated_cents - cy_pres swept amount. Must equal 0 when status=RECONCILED."
        default: 0

  - name: ClassMember
    parent: null
    common_fields: true
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; the settlement this member belongs to."
      - name: full_name
        type: string
        source: input
        description: "Class member legal name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique within a settlement."
      - name: claimant_tier
        type: enum
        source: input
        description: "Pre-adjudicated damages tier used by the TIERED distribution method."
        default: "TIER_B"
        constraints: "one of {TIER_A, TIER_B}"
      - name: tin_on_file
        type: boolean
        source: input
        description: "Whether a valid taxpayer identification number is on file; gates tax-form issuance and backup withholding."
        default: false
      - name: status
        type: enum
        source: system
        description: "Member participation posture. See §1.2 ClassMember machine."
        default: "NOTIFIED"
        constraints: "one of {NOTIFIED, PARTICIPATING, EXCLUDED}"
      - name: notice_count
        type: integer
        source: computed
        description: "Count of NoticeRecord children for this member. Recomputed on each notice send."
        default: 0

  - name: NoticeRecord
    parent: null
    common_fields: false
    fields:
      - name: class_member_id
        type: string
        source: input
        description: "FK -> ClassMember.id; the member this notice was addressed to."
      - name: channel
        type: enum
        source: input
        description: "Delivery channel of the notice."
        constraints: "one of {EMAIL, MAIL, PUBLICATION}"
      - name: delivery_status
        type: enum
        source: input
        description: "Outcome reported by the delivery vendor."
        constraints: "one of {DELIVERED, BOUNCED, RETURNED}"

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; the settlement claimed against."
      - name: class_member_id
        type: string
        source: input
        description: "FK -> ClassMember.id; the claimant. Must belong to the same settlement."
      - name: supersedes_claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the prior REJECTED claim this refile replaces. Null for an original filing."
        default: null
      - name: claimed_loss_cents
        type: integer
        source: input
        description: "Loss amount asserted by the claimant in cents, before review."
        constraints: ">= 0"
      - name: recognized_loss_cents
        type: integer
        source: computed
        description: "Loss recognized by the reviewer after validation; the pro-rata weight. 0 until VALIDATED. Set by the validate transition, capped at claimed_loss_cents."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle. Branching with deficiency-cure revision loop. See §1.2 Claim machine."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, DEFICIENT, CURED, VALIDATED, REJECTED, PAID}"
      - name: open_deficiency_count
        type: integer
        source: computed
        description: "Count of Deficiency children of this claim whose status=OPEN. Recomputed on each deficiency raise/resolve."
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: "Cents paid to this claim by its Payment row; 0 until PAID. Set when the owning DistributionBatch posts."
        default: 0

  - name: Deficiency
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim this deficiency was raised against."
      - name: reason_code
        type: enum
        source: input
        description: "Category of the defect requiring cure."
        constraints: "one of {MISSING_PROOF, SIGNATURE_MISSING, IDENTITY_UNVERIFIED, DUPLICATE_SUSPECTED}"
      - name: cure_deadline
        type: datetime
        source: input
        description: "Half-open cure window upper bound. A cure submitted with the clock at or after this instant is rejected as untimely. ISO 8601 UTC."
      - name: status
        type: enum
        source: system
        description: "Deficiency lifecycle. See §1.2 Deficiency machine."
        default: "OPEN"
        constraints: "one of {OPEN, CURED, EXPIRED}"

  - name: OptOutRequest
    parent: null
    common_fields: true
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; the settlement to be excluded from."
      - name: class_member_id
        type: string
        source: input
        description: "FK -> ClassMember.id; the member requesting exclusion."
      - name: status
        type: enum
        source: system
        description: "Opt-out lifecycle. See §1.2 OptOutRequest machine."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, EFFECTIVE, REVOKED}"

  - name: Objection
    parent: null
    common_fields: true
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; the settlement objected to."
      - name: class_member_id
        type: string
        source: input
        description: "FK -> ClassMember.id; the objecting member."
      - name: grounds
        type: string
        source: input
        description: "Free-text objection grounds."
      - name: status
        type: enum
        source: system
        description: "Objection lifecycle. See §1.2 Objection machine."
        default: "FILED"
        constraints: "one of {FILED, SUSTAINED, OVERRULED, WITHDRAWN}"

  - name: DistributionBatch
    parent: null
    common_fields: true
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; the settlement being distributed."
      - name: sequence_no
        type: integer
        source: input
        description: "Ordinal of this batch within the settlement; batches process oldest-first by created_at, sequence_no is for human labeling only."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Batch lifecycle. Branching: COMPUTED -> {POSTED, VOID}. See §1.2 DistributionBatch machine."
        default: "DRAFT"
        constraints: "one of {DRAFT, COMPUTED, POSTED, REVERSED, VOID}"
      - name: planned_total_cents
        type: integer
        source: computed
        description: "Sum of planned Payment.amount_cents for this batch after compute. Set by the compute transition."
        default: 0
      - name: posted_total_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents actually committed when the batch posted; 0 until POSTED."
        default: 0
      - name: residual_after_cents
        type: integer
        source: computed
        description: "net_distributable_cents minus cumulative allocated_cents across POSTED batches up to and including this one, computed at post time."
        default: 0

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: distribution_batch_id
        type: string
        source: input
        description: "FK -> DistributionBatch.id; the batch that generated this payment."
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim being paid."
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Pre-withholding award in cents, computed by the distribution calculation for this claim. Set when the batch is computed."
        default: 0
      - name: withholding_cents
        type: integer
        source: computed
        description: "Backup withholding deducted when the claimant has no TIN on file and gross >= the reporting threshold. Set when the batch is computed."
        default: 0
      - name: amount_cents
        type: integer
        source: computed
        description: "Net cents committed to the claimant: gross_amount_cents - withholding_cents. The value that debits the fund on post."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle, parallel to its owning batch. See §1.2 Payment machine."
        default: "PLANNED"
        constraints: "one of {PLANNED, COMMITTED, REVERSED, CANCELLED}"

  - name: TaxForm
    parent: null
    common_fields: true
    fields:
      - name: payment_id
        type: string
        source: input
        description: "FK -> Payment.id; the committed payment this 1099 reports."
      - name: class_member_id
        type: string
        source: input
        description: "FK -> ClassMember.id; the payee of record."
      - name: form_type
        type: enum
        source: input
        description: "Tax form variety."
        default: "1099_MISC"
        constraints: "one of {1099_MISC, 1099_NEC}"
      - name: reportable_cents
        type: integer
        source: computed
        description: "Reportable box amount: the payment's gross_amount_cents at the time the form was issued. Set on issuance."
        default: 0
      - name: withheld_cents
        type: integer
        source: computed
        description: "Federal backup withholding reported: the payment's withholding_cents. Set on issuance."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Tax form lifecycle. See §1.2 TaxForm machine."
        default: "ISSUED"
        constraints: "one of {ISSUED, CORRECTED, VOIDED}"

  - name: CyPresDesignation
    parent: null
    common_fields: true
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; the settlement whose residual flows to this recipient."
      - name: recipient_name
        type: string
        source: input
        description: "Charitable cy pres recipient organization name."
      - name: share_bps
        type: integer
        source: input
        description: "Basis points (1/10000) of the swept residual allocated to this recipient. Sum of all active designations' share_bps must equal 10000 before sweep."
        constraints: "1 <= share_bps <= 10000"
      - name: status
        type: enum
        source: system
        description: "Designation lifecycle. See §1.2 CyPresDesignation machine."
        default: "PROPOSED"
        constraints: "one of {PROPOSED, APPROVED, FUNDED, REVOKED}"
      - name: funded_cents
        type: integer
        source: computed
        description: "Cents actually swept to this recipient at reconciliation: floor(residual_swept * share_bps / 10000) with the rounding remainder assigned by the cy pres sweep calculation. 0 until FUNDED."
        default: 0

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; the fund this entry posts against."
      - name: entry_type
        type: enum
        source: input
        description: "Ledger entry kind."
        constraints: "one of {FUND_OPEN, FEE_DEBIT, ADMIN_DEBIT, PAYMENT_DEBIT, PAYMENT_REVERSAL_CREDIT, CY_PRES_DEBIT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed cents: debits negative, credits positive. The reconciliation invariant is that all LedgerEntry.amount_cents for a settlement sum to 0 when RECONCILED."
      - name: reference_id
        type: string
        source: input
        description: "Opaque id of the entity that produced this entry (Payment.id, CyPresDesignation.id, or the Settlement.id for fund-open/fee/admin)."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: NOTICE_OPEN
        trigger: "POST /settlements/{id}/open-notice"
        actor: SettlementAdmin
        preconditions:
          - "Settlement.status == DRAFT"
          - "at least one CyPresDesignation child exists with status=APPROVED OR cy_pres_floor_cents == 0"
        side_effects:
          - "set status=NOTICE_OPEN"
          - "append LedgerEntry{entry_type=FUND_OPEN, amount_cents=+gross_fund_cents, reference_id=Settlement.id}"
          - "append LedgerEntry{entry_type=FEE_DEBIT, amount_cents=-attorney_fee_cents, reference_id=Settlement.id}"
          - "append LedgerEntry{entry_type=ADMIN_DEBIT, amount_cents=-admin_cost_cents, reference_id=Settlement.id}"
          - "increments Settlement.version by 1"
      - from: NOTICE_OPEN
        to: CLAIMS_OPEN
        trigger: "POST /settlements/{id}/open-claims"
        actor: SettlementAdmin
        preconditions:
          - "Settlement.status == NOTICE_OPEN"
          - "at least one ClassMember child exists"
        side_effects:
          - "set status=CLAIMS_OPEN"
          - "increments Settlement.version by 1"
      - from: CLAIMS_OPEN
        to: CLAIMS_CLOSED
        trigger: "POST /settlements/{id}/close-claims"
        actor: SettlementAdmin
        preconditions:
          - "Settlement.status == CLAIMS_OPEN"
          - "the clock is at or after claim_filing_deadline"
        side_effects:
          - "set status=CLAIMS_CLOSED"
          - "for every Deficiency child with status=OPEN whose cure_deadline <= now: set Deficiency.status=EXPIRED, then set its Claim.status=REJECTED (cascade, see Claim machine)"
          - "increments Settlement.version by 1"
      - from: CLAIMS_CLOSED
        to: DISTRIBUTING
        trigger: "POST /settlements/{id}/begin-distribution"
        actor: FundController
        preconditions:
          - "Settlement.status == CLAIMS_CLOSED"
          - "at least one Claim child with status=VALIDATED exists"
        side_effects:
          - "set status=DISTRIBUTING"
          - "increments Settlement.version by 1"
      - from: DISTRIBUTING
        to: RECONCILED
        trigger: "POST /settlements/{id}/reconcile"
        actor: FundController
        preconditions:
          - "Settlement.status == DISTRIBUTING"
          - "no DistributionBatch child is in status COMPUTED (all are POSTED, VOID, or REVERSED)"
          - "expected_settlement_version matches Settlement.version"
        side_effects:
          - "compute residual_cents = net_distributable_cents - allocated_cents"
          - "if residual_cents > 0 and residual_cents < cy_pres_floor_cents: run cy_pres_sweep calculation, set each APPROVED CyPresDesignation.status=FUNDED with funded_cents, append CY_PRES_DEBIT LedgerEntry rows, set residual_cents=0"
          - "if residual_cents > 0 and residual_cents >= cy_pres_floor_cents: leave residual_cents as-is (eligible for a further batch); reconcile is still allowed and records the standing residual"
          - "set status=RECONCILED"
          - "increments Settlement.version by 1"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /settlements/{id}/close"
        actor: SettlementAdmin
        preconditions:
          - "Settlement.status == RECONCILED"
          - "sum of all LedgerEntry.amount_cents for this settlement == 0"
        side_effects:
          - "set status=CLOSED"
          - "increments Settlement.version by 1"

  - entity: ClassMember
    initial_state: NOTIFIED
    terminal_states: [EXCLUDED]
    transitions:
      - from: NOTIFIED
        to: PARTICIPATING
        trigger: "system: first Claim created for this member"
        actor: system
        preconditions:
          - "ClassMember.status == NOTIFIED"
          - "no EFFECTIVE OptOutRequest exists for this member"
        side_effects:
          - "set status=PARTICIPATING"
      - from: NOTIFIED
        to: EXCLUDED
        trigger: "system: OptOutRequest for this member transitions REQUESTED->EFFECTIVE"
        actor: system
        preconditions:
          - "ClassMember.status == NOTIFIED"
        side_effects:
          - "set status=EXCLUDED"
      - from: PARTICIPATING
        to: NOTIFIED
        trigger: "system: the member's only non-terminal Claim transitions to REJECTED and no other SUBMITTED/DEFICIENT/CURED/VALIDATED/PAID claim remains"
        actor: system
        preconditions:
          - "ClassMember.status == PARTICIPATING"
        side_effects:
          - "set status=NOTIFIED"
        note: "Revision loop: a member who refiles a superseding claim returns to PARTICIPATING. This is the cyclic edge on the member machine."

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /claims/{id}/validate"
        actor: ClaimsReviewer
        preconditions:
          - "Claim.status == SUBMITTED"
          - "Claim.open_deficiency_count == 0"
          - "owning Settlement.status == CLAIMS_OPEN OR CLAIMS_CLOSED"
          - "recognized_loss_cents in request <= Claim.claimed_loss_cents"
        side_effects:
          - "set recognized_loss_cents = request value"
          - "set status=VALIDATED"
          - "increments Claim.version by 1"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /claims/{id}/deficiencies (first OPEN deficiency raised)"
        actor: ClaimsReviewer
        preconditions:
          - "Claim.status == SUBMITTED"
          - "owning Settlement.status == CLAIMS_OPEN OR CLAIMS_CLOSED"
        side_effects:
          - "create Deficiency{status=OPEN}"
          - "increment Claim.open_deficiency_count"
          - "set status=DEFICIENT"
          - "increments Claim.version by 1"
      - from: DEFICIENT
        to: CURED
        trigger: "POST /claims/{id}/cure"
        actor: Claimant
        preconditions:
          - "Claim.status == DEFICIENT"
          - "every Deficiency child with status=OPEN has cure_deadline strictly after the clock"
        side_effects:
          - "set every OPEN Deficiency child status=CURED (cascade down)"
          - "set Claim.open_deficiency_count = 0"
          - "set status=CURED"
          - "increments Claim.version by 1"
      - from: CURED
        to: VALIDATED
        trigger: "POST /claims/{id}/validate"
        actor: ClaimsReviewer
        preconditions:
          - "Claim.status == CURED"
          - "Claim.open_deficiency_count == 0"
          - "recognized_loss_cents in request <= Claim.claimed_loss_cents"
        side_effects:
          - "set recognized_loss_cents = request value"
          - "set status=VALIDATED"
          - "increments Claim.version by 1"
      - from: CURED
        to: DEFICIENT
        trigger: "POST /claims/{id}/deficiencies (a new OPEN deficiency raised on a cured claim)"
        actor: ClaimsReviewer
        preconditions:
          - "Claim.status == CURED"
        side_effects:
          - "create Deficiency{status=OPEN}"
          - "increment Claim.open_deficiency_count"
          - "set status=DEFICIENT"
          - "increments Claim.version by 1"
        note: "Cyclic revision loop: CURED -> DEFICIENT -> CURED -> VALIDATED. Distinct side-effect set from the SUBMITTED->DEFICIENT branch (no member transition fires here)."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /claims/{id}/reject OR system cascade on claims-close deficiency expiry"
        actor: ClaimsReviewer
        preconditions:
          - "Claim.status in {SUBMITTED, DEFICIENT, CURED}"
        side_effects:
          - "set status=REJECTED"
          - "set every OPEN Deficiency child status=EXPIRED"
          - "set Claim.open_deficiency_count = 0"
          - "bubble up: if claimant has no remaining non-REJECTED claim, ClassMember PARTICIPATING->NOTIFIED"
          - "increments Claim.version by 1"
      - from: DEFICIENT
        to: REJECTED
        trigger: "POST /claims/{id}/reject OR system cascade on claims-close deficiency expiry"
        actor: ClaimsReviewer
        preconditions:
          - "Claim.status in {SUBMITTED, DEFICIENT, CURED}"
        side_effects:
          - "set status=REJECTED"
          - "set every OPEN Deficiency child status=EXPIRED"
          - "set Claim.open_deficiency_count = 0"
          - "bubble up: if claimant has no remaining non-REJECTED claim, ClassMember PARTICIPATING->NOTIFIED"
          - "increments Claim.version by 1"
      - from: VALIDATED
        to: PAID
        trigger: "system: owning DistributionBatch DRAFT->POSTED commits this claim's Payment"
        actor: system
        preconditions:
          - "Claim.status == VALIDATED"
          - "a COMMITTED Payment exists referencing this claim"
        side_effects:
          - "set paid_amount_cents = Payment.amount_cents"
          - "set status=PAID"
          - "increments Claim.version by 1"

  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [CURED, EXPIRED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "system: owning Claim DEFICIENT->CURED"
        actor: system
        preconditions:
          - "Deficiency.status == OPEN"
          - "cure_deadline strictly after the clock"
        side_effects:
          - "set status=CURED"
      - from: OPEN
        to: EXPIRED
        trigger: "system: claims-close sweep OR Claim rejection"
        actor: system
        preconditions:
          - "Deficiency.status == OPEN"
        side_effects:
          - "set status=EXPIRED"

  - entity: OptOutRequest
    initial_state: REQUESTED
    terminal_states: [REVOKED]
    transitions:
      - from: REQUESTED
        to: EFFECTIVE
        trigger: "POST /opt-outs/{id}/finalize"
        actor: ClaimsAdministrator
        preconditions:
          - "OptOutRequest.status == REQUESTED"
          - "the member has no non-REJECTED Claim"
          - "owning Settlement.status in {NOTICE_OPEN, CLAIMS_OPEN}"
        side_effects:
          - "set status=EFFECTIVE"
          - "cross-entity: set ClassMember.status=EXCLUDED"
      - from: EFFECTIVE
        to: REVOKED
        trigger: "POST /opt-outs/{id}/revoke"
        actor: ClaimsAdministrator
        preconditions:
          - "OptOutRequest.status == EFFECTIVE"
          - "owning Settlement.status in {NOTICE_OPEN, CLAIMS_OPEN}"
        side_effects:
          - "set status=REVOKED"
          - "cross-entity: set ClassMember.status=NOTIFIED"

  - entity: Objection
    initial_state: FILED
    terminal_states: [SUSTAINED, OVERRULED, WITHDRAWN]
    transitions:
      - from: FILED
        to: SUSTAINED
        trigger: "POST /objections/{id}/rule"
        actor: Court
        preconditions:
          - "Objection.status == FILED"
        side_effects:
          - "set status=SUSTAINED"
      - from: FILED
        to: OVERRULED
        trigger: "POST /objections/{id}/rule"
        actor: Court
        preconditions:
          - "Objection.status == FILED"
        side_effects:
          - "set status=OVERRULED"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /objections/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "Objection.status == FILED"
          - "acting Claimant is the objecting ClassMember"
        side_effects:
          - "set status=WITHDRAWN"

  - entity: DistributionBatch
    initial_state: DRAFT
    terminal_states: [VOID, REVERSED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /distribution-batches/{id}/compute"
        actor: FundController
        preconditions:
          - "DistributionBatch.status == DRAFT"
          - "owning Settlement.status == DISTRIBUTING"
        side_effects:
          - "run distribution_allocation calculation over VALIDATED claims not yet PAID"
          - "create one PLANNED Payment per eligible claim with gross_amount_cents, withholding_cents, amount_cents"
          - "set planned_total_cents = sum of Payment.amount_cents"
          - "set status=COMPUTED"
          - "increments DistributionBatch.version by 1"
      - from: COMPUTED
        to: POSTED
        trigger: "POST /distribution-batches/{id}/post"
        actor: FundController
        preconditions:
          - "DistributionBatch.status == COMPUTED"
          - "planned_total_cents <= (Settlement.net_distributable_cents - Settlement.allocated_cents)"
          - "the acting FundController is not the ClaimsReviewer who validated any claim in this batch (segregation of duties)"
          - "expected_settlement_version matches Settlement.version"
        side_effects:
          - "set every Payment in this batch status=COMMITTED"
          - "cascade: each paid Claim VALIDATED->PAID, set Claim.paid_amount_cents"
          - "append one PAYMENT_DEBIT LedgerEntry per Payment with amount_cents=-Payment.amount_cents"
          - "increment Settlement.allocated_cents by posted_total_cents; set posted_total_cents=planned_total_cents"
          - "set residual_after_cents = net_distributable_cents - allocated_cents"
          - "for each COMMITTED Payment whose claimant tin_on_file==false and gross_amount_cents >= TAX_REPORTING_THRESHOLD_CENTS: issue a TaxForm (cascade)"
          - "set status=POSTED"
          - "increments Settlement.version by 1"
      - from: COMPUTED
        to: VOID
        trigger: "POST /distribution-batches/{id}/void"
        actor: FundController
        preconditions:
          - "DistributionBatch.status == COMPUTED"
        side_effects:
          - "set every PLANNED Payment in this batch status=CANCELLED"
          - "set status=VOID"
          - "increments DistributionBatch.version by 1"
        note: "Branching fork from COMPUTED: post vs void, with divergent side-effect sets (ledger debit + claim PAID vs payment cancel only)."
      - from: POSTED
        to: REVERSED
        trigger: "POST /distribution-batches/{id}/reverse"
        actor: FundController
        preconditions:
          - "DistributionBatch.status == POSTED"
          - "owning Settlement.status == DISTRIBUTING"
          - "no TaxForm referencing a Payment in this batch is in status VOIDED"
        side_effects:
          - "set every COMMITTED Payment status=REVERSED"
          - "compensation: each PAID Claim reverts to VALIDATED, set Claim.paid_amount_cents=0"
          - "append one PAYMENT_REVERSAL_CREDIT LedgerEntry per Payment with amount_cents=+Payment.amount_cents"
          - "decrement Settlement.allocated_cents by posted_total_cents"
          - "set every TaxForm referencing a Payment in this batch status=VOIDED"
          - "increments DistributionBatch.version by 1"
          - "increments Settlement.version by 1"

  - entity: Payment
    initial_state: PLANNED
    terminal_states: [REVERSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: COMMITTED
        trigger: "system: owning DistributionBatch COMPUTED->POSTED"
        actor: system
        preconditions:
          - "Payment.status == PLANNED"
        side_effects:
          - "set status=COMMITTED"
      - from: PLANNED
        to: CANCELLED
        trigger: "system: owning DistributionBatch COMPUTED->VOID"
        actor: system
        preconditions:
          - "Payment.status == PLANNED"
        side_effects:
          - "set status=CANCELLED"
      - from: COMMITTED
        to: REVERSED
        trigger: "system: owning DistributionBatch POSTED->REVERSED"
        actor: system
        preconditions:
          - "Payment.status == COMMITTED"
        side_effects:
          - "set status=REVERSED"

  - entity: TaxForm
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: CORRECTED
        trigger: "POST /tax-forms/{id}/correct"
        actor: FundController
        preconditions:
          - "TaxForm.status == ISSUED"
          - "the referenced Payment.status == COMMITTED"
        side_effects:
          - "set reportable_cents = referenced Payment.gross_amount_cents"
          - "set withheld_cents = referenced Payment.withholding_cents"
          - "set status=CORRECTED"
          - "increments TaxForm.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "system: owning batch reversed"
        actor: system
        preconditions:
          - "TaxForm.status == ISSUED"
        side_effects:
          - "set status=VOIDED"
      - from: CORRECTED
        to: VOIDED
        trigger: "system: owning batch reversed"
        actor: system
        preconditions:
          - "TaxForm.status == CORRECTED"
        side_effects:
          - "set status=VOIDED"

  - entity: CyPresDesignation
    initial_state: PROPOSED
    terminal_states: [REVOKED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /cy-pres-designations/{id}/approve"
        actor: Court
        preconditions:
          - "CyPresDesignation.status == PROPOSED"
          - "owning Settlement.status in {DRAFT, NOTICE_OPEN, CLAIMS_OPEN, CLAIMS_CLOSED, DISTRIBUTING}"
        side_effects:
          - "set status=APPROVED"
      - from: APPROVED
        to: FUNDED
        trigger: "system: Settlement DISTRIBUTING->RECONCILED sweeps residual"
        actor: system
        preconditions:
          - "CyPresDesignation.status == APPROVED"
        side_effects:
          - "set funded_cents per cy_pres_sweep calculation"
          - "set status=FUNDED"
      - from: PROPOSED
        to: REVOKED
        trigger: "POST /cy-pres-designations/{id}/revoke"
        actor: Court
        preconditions:
          - "CyPresDesignation.status == PROPOSED"
        side_effects:
          - "set status=REVOKED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: batch-post-stale-settlement
    parent_entity: Settlement
    write_endpoint: "POST /distribution-batches/{id}/post"
    occ_field: "expected_settlement_version"
    description: |
      Posting a DistributionBatch against a Settlement whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. This captures the case where another POSTED batch has already
      debited the fund and advanced Settlement.allocated_cents (and therefore
      Settlement.version) after the current writer last read it; the budget
      headroom the current writer reasoned about is now stale, so the post must
      re-read before committing.
    error_id: ERR_STALE_SETTLEMENT_VERSION
    http_status: 412
  - rule_id: reconcile-stale-settlement
    parent_entity: Settlement
    write_endpoint: "POST /settlements/{id}/reconcile"
    occ_field: "expected_settlement_version"
    description: |
      Reconciling a Settlement whose version has advanced since the client last
      observed it is rejected with a stale-version error. A reconcile that began
      from a fund snapshot taken before a late batch post would compute a
      residual that no longer matches the ledger; the stale-version guard forces
      a re-read so the swept residual and cy pres allocations are computed from
      the current allocated_cents.
    error_id: ERR_STALE_SETTLEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: distribution_allocation
    trigger: "DistributionBatch DRAFT->COMPUTED (POST /distribution-batches/{id}/compute)"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: the owning Settlement; eligible claims E = all Claim with
      # status=VALIDATED, paid_amount_cents==0, belonging to this settlement,
      # whose claimant ClassMember.status==PARTICIPATING. Processed in
      # created_at ASC order, ties broken by created_at then by claim_id ASC
      # ONLY to make iteration total (never to decide an award amount).
      remaining = Settlement.net_distributable_cents - Settlement.allocated_cents
      if Settlement.distribution_method == "PRO_RATA":
          S = sum(c.recognized_loss_cents for c in E)        # > 0 guaranteed by precondition
          # Largest-remainder apportionment of `remaining` weighted by recognized_loss_cents.
          raw[c]   = remaining * c.recognized_loss_cents / S    # exact rational
          floor[c] = integer_floor(raw[c])
          gross[c] = floor[c]
          leftover = remaining - sum(floor[c])                  # 0..len(E)-1 cents
          # distribute leftover cents one each, claims ordered by fractional part
          # DESC, ties broken by created_at ASC (NOT by id):
          for c in sort(E, key=(frac(raw[c]) DESC, c.created_at ASC)):
              if leftover == 0: break
              gross[c] += 1; leftover -= 1
      else:  # TIERED
          # Flat per-tier award, NOT capped at compute time. Each claim receives
          # its full tier amount; the batch's planned_total is the un-capped sum.
          # The fund-capacity check is deferred to POST (validation priority 17,
          # ERR_FUND_EXCEEDED): a batch whose planned_total exceeds the remaining
          # headroom (net_distributable_cents - allocated_cents) is rejected at
          # post, not silently truncated. Claims processed created_at ASC,
          # claim_id ASC only to make iteration total (never to decide an amount).
          for c in sort(E, key=(c.created_at ASC, c.claim_id ASC)):
              tier_amt = Settlement.tier_a_amount_cents if member(c).claimant_tier=="TIER_A" else Settlement.tier_b_amount_cents
              gross[c] = tier_amt
      # Backup withholding applied per-claim AFTER gross is fixed:
      for c in E:
          if member(c).tin_on_file == false and gross[c] >= TAX_REPORTING_THRESHOLD_CENTS:
              withholding[c] = integer_floor(gross[c] * BACKUP_WITHHOLDING_BPS / 10000)
          else:
              withholding[c] = 0
          amount[c] = gross[c] - withholding[c]
    input_set: "Claim rows with status=VALIDATED AND paid_amount_cents==0 AND owning ClassMember.status==PARTICIPATING, for this settlement; ordered created_at ASC."
    constants:
      TAX_REPORTING_THRESHOLD_CENTS: 60000
      BACKUP_WITHHOLDING_BPS: 2400
    precision: "integer cents; floor on apportionment, largest-remainder for the leftover; no fractional cents ever persisted"
    variants:
      - name: pro_rata
        when: "Settlement.distribution_method == PRO_RATA"
        difference: "Award = largest-remainder apportionment of remaining headroom weighted by recognized_loss_cents; sum of gross awards exactly equals headroom (no residual within the batch)."
      - name: tiered
        when: "Settlement.distribution_method == TIERED"
        difference: "Award = full flat per-tier amount per claim, summed un-capped into planned_total; total may be strictly less than headroom (producing a residual eligible for cy pres) OR strictly greater (rejected at POST with ERR_FUND_EXCEEDED, never silently truncated)."

  - name: cy_pres_sweep
    trigger: "Settlement DISTRIBUTING->RECONCILED (POST /settlements/{id}/reconcile), only when 0 < residual_cents < cy_pres_floor_cents"
    algorithm: waterfall_allocation
    formula: |
      # residual = net_distributable_cents - allocated_cents  (> 0, < cy_pres_floor_cents)
      # Recipients R = CyPresDesignation with status=APPROVED for this settlement,
      # ordered created_at ASC. Precondition: sum(r.share_bps for r in R) == 10000.
      for r in sort(R, key=r.created_at ASC):
          floor[r] = integer_floor(residual * r.share_bps / 10000)
      leftover = residual - sum(floor[r])          # 0..len(R)-1 cents
      # Assign leftover cents one each, recipients ordered by fractional part DESC,
      # ties broken by created_at ASC (NOT by id):
      for r in sort(R, key=(frac(residual * r.share_bps / 10000) DESC, r.created_at ASC)):
          if leftover == 0: break
          funded[r] = floor[r] + 1; leftover -= 1
      # recipients not awarded a leftover cent keep funded[r] = floor[r]
      # Invariant: sum(funded[r]) == residual exactly.
    input_set: "CyPresDesignation rows with status=APPROVED for this settlement; ordered created_at ASC."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents; floor per recipient, largest-remainder for the leftover cents; sum equals residual exactly"

  - name: fund_reconciliation_balance
    trigger: "computed on read GET /settlements/{id}/ledger-balance and checked at Settlement RECONCILED->CLOSED"
    algorithm: aggregation
    formula: |
      # Ledger must net to zero for a closable settlement.
      balance = sum(e.amount_cents for e in LedgerEntry where e.settlement_id == S.id)
      # Decomposition (all signed):
      #   + gross_fund_cents                      (FUND_OPEN)
      #   - attorney_fee_cents                    (FEE_DEBIT)
      #   - admin_cost_cents                      (ADMIN_DEBIT)
      #   - sum committed Payment.amount_cents    (PAYMENT_DEBIT)
      #   + sum reversed Payment.amount_cents     (PAYMENT_REVERSAL_CREDIT)
      #   - sum CyPresDesignation.funded_cents    (CY_PRES_DEBIT)
      # A settlement is closable iff balance == 0, i.e. every distributable cent
      # is either paid, swept to cy pres, or standing as an acknowledged residual
      # offset that has itself been ledgered. RECONCILED requires the sweep or a
      # zero residual so that balance==0 holds.
    input_set: "All LedgerEntry rows for the settlement (append-only; none excluded)."
    constants:
      EXPECTED_BALANCE_CENTS: 0
    precision: "integer cents; exact equality to 0 required for closure"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /class-members/{id}/file-claim when self-serve token present"

  - priority: 2
    category: auth
    check: "X-User-Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path-referenced resource exists, validated left-to-right"
    error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "every body FK (settlement_id, class_member_id, claim_id, distribution_batch_id, payment_id, supersedes_claim_id) references an existing row"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with body FKs"

  - priority: 5
    category: business_referential
    check: "class_member_id on a Claim/OptOutRequest/Objection belongs to the same settlement_id named in the body"
    error_id: ERR_MEMBER_SETTLEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /claims, POST /opt-outs, POST /objections"

  - priority: 6
    category: state
    check: "the target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "the owning Settlement is in the posture that permits this child operation (e.g. claim filing requires CLAIMS_OPEN; opt-out requires NOTICE_OPEN or CLAIMS_OPEN)"
    error_id: ERR_SETTLEMENT_POSTURE_INVALID
    http_status: 409
    applies_to: "POST /claims, POST /opt-outs, POST /objections, POST /distribution-batches"

  - priority: 8
    category: business_temporal
    check: "a Claim is filed strictly before claim_filing_deadline (created_at < deadline); at-or-after is untimely"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /claims, POST /class-members/{id}/file-claim"

  - priority: 9
    category: business_temporal
    check: "an Objection or OptOutRequest is filed strictly before objection_deadline; at-or-after is untimely"
    error_id: ERR_OBJECTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /objections, POST /opt-outs"

  - priority: 10
    category: business_temporal
    check: "a deficiency cure is submitted strictly before every OPEN Deficiency.cure_deadline; at-or-after is untimely"
    error_id: ERR_CURE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /claims/{id}/cure"

  - priority: 11
    category: business_constraint
    check: "a member who has any non-REJECTED Claim cannot finalize an opt-out (participation and exclusion are mutually exclusive)"
    error_id: ERR_MEMBER_HAS_CLAIM
    http_status: 409
    applies_to: "POST /opt-outs/{id}/finalize"

  - priority: 12
    category: business_constraint
    check: "an EXCLUDED member cannot file a claim"
    error_id: ERR_MEMBER_EXCLUDED
    http_status: 409
    applies_to: "POST /claims, POST /class-members/{id}/file-claim"

  - priority: 13
    category: business_constraint
    check: "recognized_loss_cents supplied at validation must be <= the claim's claimed_loss_cents"
    error_id: ERR_RECOGNIZED_EXCEEDS_CLAIMED
    http_status: 422
    applies_to: "POST /claims/{id}/validate"

  - priority: 14
    category: business_constraint
    check: "a refile (supersedes_claim_id set) must point to a REJECTED claim of the same class_member_id; the superseded claim cannot already be superseded"
    error_id: ERR_INVALID_SUPERSEDE
    http_status: 422
    applies_to: "POST /claims"

  - priority: 15
    category: business_safety
    check: "segregation of duties: the FundController posting a batch must not equal the ClaimsReviewer (by X-User-ID) who validated any claim paid in that batch"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /distribution-batches/{id}/post"

  - priority: 16
    category: business_constraint
    check: "sum of share_bps over APPROVED CyPresDesignation children must equal 10000 before a cy pres sweep runs at reconcile"
    error_id: ERR_CY_PRES_SHARES_UNBALANCED
    http_status: 422
    applies_to: "POST /settlements/{id}/reconcile"

  - priority: 17
    category: business_fiscal
    check: "a batch post must not cause allocated_cents to exceed net_distributable_cents (planned_total_cents <= net_distributable_cents - allocated_cents)"
    error_id: ERR_FUND_EXCEEDED
    http_status: 422
    applies_to: "POST /distribution-batches/{id}/post"

  - priority: 18
    category: business_constraint
    check: "OCC: expected_settlement_version must equal the current Settlement.version"
    error_id: ERR_STALE_SETTLEMENT_VERSION
    http_status: 412
    applies_to: "POST /distribution-batches/{id}/post, POST /settlements/{id}/reconcile"

  - priority: 19
    category: business_constraint
    check: "unique email per settlement on ClassMember create"
    error_id: ERR_DUPLICATE_MEMBER_EMAIL
    http_status: 409
    applies_to: "POST /settlements/{id}/class-members"

  # Request-shape checks. Although listed at the tail of this table, they are
  # evaluated immediately after auth (priority 2) and before existence (priority
  # 3) at request-parse time; they are placed here only because they never form a
  # dual-failure conflict pair with the business rules above, so their numeric
  # rank does not affect any declared priority-conflict resolution.
  - priority: 20
    category: business_constraint
    check: "every required input field for the called endpoint (per §1.5 input:) is present in the request body"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 422
    applies_to: "all create/transition endpoints with required body fields"

  - priority: 21
    category: business_constraint
    check: "every enum-typed input field carries a value within its declared constraint set"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all endpoints accepting enum body fields (distribution_method, claimant_tier, channel, delivery_status, reason_code, form_type, ruling)"

  - priority: 22
    category: state
    check: "a claim being validated has open_deficiency_count == 0 (no unresolved deficiency blocks validation)"
    error_id: ERR_VALIDATION_BLOCKED_BY_DEFICIENCY
    http_status: 409
    applies_to: "POST /claims/{id}/validate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Settlement ----
  - method: POST
    path: "/settlements"
    description: "Create a settlement fund in DRAFT."
    roles: [SettlementAdmin]
    code: 201
    input: [case_caption, gross_fund_cents, attorney_fee_cents, admin_cost_cents, distribution_method, "tier_a_amount_cents?", "tier_b_amount_cents?", claim_filing_deadline, objection_deadline, "cy_pres_floor_cents?"]
    output: Settlement
    side_effects: ["compute net_distributable_cents"]
  - method: GET
    path: "/settlements/{id}"
    description: "Fetch a settlement."
    roles: [SettlementAdmin, FundController, ClaimsReviewer, ClaimsAdministrator, Court]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/settlements"
    description: "List settlements (paginated)."
    roles: [SettlementAdmin, FundController, ClaimsReviewer, ClaimsAdministrator, Court]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/settlements/{id}/open-notice"
    description: "DRAFT -> NOTICE_OPEN; opens the fund ledger."
    roles: [SettlementAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status=NOTICE_OPEN", "append FUND_OPEN/FEE_DEBIT/ADMIN_DEBIT LedgerEntry", "increments Settlement.version by 1"]
  - method: POST
    path: "/settlements/{id}/open-claims"
    description: "NOTICE_OPEN -> CLAIMS_OPEN."
    roles: [SettlementAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status=CLAIMS_OPEN", "increments Settlement.version by 1"]
  - method: POST
    path: "/settlements/{id}/close-claims"
    description: "CLAIMS_OPEN -> CLAIMS_CLOSED; expires overdue open deficiencies and rejects their claims."
    roles: [SettlementAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status=CLAIMS_CLOSED", "cascade expire OPEN deficiencies past cure_deadline -> REJECT claims", "increments Settlement.version by 1"]
  - method: POST
    path: "/settlements/{id}/begin-distribution"
    description: "CLAIMS_CLOSED -> DISTRIBUTING."
    roles: [FundController]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status=DISTRIBUTING", "increments Settlement.version by 1"]
  - method: POST
    path: "/settlements/{id}/reconcile"
    description: "DISTRIBUTING -> RECONCILED; sweeps sub-floor residual to cy pres."
    roles: [FundController]
    code: 200
    input: [expected_settlement_version]
    output: Settlement
    side_effects: ["compute residual_cents", "cy_pres_sweep when 0<residual<floor", "status=RECONCILED", "increments Settlement.version by 1"]
  - method: POST
    path: "/settlements/{id}/close"
    description: "RECONCILED -> CLOSED; requires zero ledger balance."
    roles: [SettlementAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status=CLOSED", "increments Settlement.version by 1"]
  - method: GET
    path: "/settlements/{id}/ledger-balance"
    description: "Computed read: fund_reconciliation_balance over LedgerEntry rows."
    roles: [SettlementAdmin, FundController]
    code: 200
    input: []
    output: "{ balance_cents: integer, net_distributable_cents: integer, allocated_cents: integer, residual_cents: integer }"
    side_effects: []
  - method: GET
    path: "/settlements/{id}/ledger-entries"
    description: "Reverse-reachability: list LedgerEntry children of a settlement."
    roles: [SettlementAdmin, FundController]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ---- ClassMember + NoticeRecord ----
  - method: POST
    path: "/settlements/{id}/class-members"
    description: "Register a class member under a settlement (NOTIFIED)."
    roles: [ClaimsAdministrator]
    code: 201
    input: [full_name, email, "claimant_tier?", "tin_on_file?"]
    output: ClassMember
    side_effects: []
  - method: GET
    path: "/class-members/{id}"
    description: "Fetch a class member."
    roles: [ClaimsAdministrator, ClaimsReviewer, FundController, Claimant]
    code: 200
    input: []
    output: ClassMember
    side_effects: []
  - method: GET
    path: "/class-members"
    description: "List class members, filterable by settlement (reverse-reachability for ClassMember.settlement_id)."
    roles: [ClaimsAdministrator, ClaimsReviewer, FundController]
    code: 200
    input: ["settlement_id?", "status?", "limit?", "offset?"]
    output: ClassMember[]
    side_effects: []
  - method: POST
    path: "/class-members/{id}/notices"
    description: "Record a notice sent to a member; increments notice_count."
    roles: [ClaimsAdministrator]
    code: 201
    input: [channel, delivery_status]
    output: NoticeRecord
    side_effects: ["increment ClassMember.notice_count"]
  - method: GET
    path: "/class-members/{id}/notices"
    description: "Reverse-reachability: list NoticeRecord children of a member."
    roles: [ClaimsAdministrator, ClaimsReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: NoticeRecord[]
    side_effects: []
  - method: POST
    path: "/class-members/{id}/file-claim"
    description: "Self-serve claim filing by the claimant; convenience wrapper over POST /claims that pins class_member_id from the path."
    roles: [Claimant]
    code: 201
    input: [settlement_id, claimed_loss_cents, "supersedes_claim_id?"]
    output: Claim
    side_effects: ["create Claim SUBMITTED", "ClassMember NOTIFIED->PARTICIPATING"]

  # ---- Claim + Deficiency ----
  - method: POST
    path: "/claims"
    description: "File a claim (administrator-entered)."
    roles: [ClaimsAdministrator, Claimant]
    code: 201
    input: [settlement_id, class_member_id, claimed_loss_cents, "supersedes_claim_id?"]
    output: Claim
    side_effects: ["create Claim SUBMITTED", "ClassMember NOTIFIED->PARTICIPATING"]
  - method: GET
    path: "/claims/{id}"
    description: "Fetch a claim."
    roles: [ClaimsReviewer, ClaimsAdministrator, FundController, Claimant]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List claims; filterable by settlement_id, class_member_id, supersedes_claim_id, status (reverse-reachability for all three Claim FKs)."
    roles: [ClaimsReviewer, ClaimsAdministrator, FundController]
    code: 200
    input: ["settlement_id?", "class_member_id?", "supersedes_claim_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/validate"
    description: "SUBMITTED|CURED -> VALIDATED; sets recognized_loss_cents."
    roles: [ClaimsReviewer]
    code: 200
    input: [recognized_loss_cents]
    output: Claim
    side_effects: ["set recognized_loss_cents", "status=VALIDATED", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/reject"
    description: "SUBMITTED|DEFICIENT|CURED -> REJECTED; expires open deficiencies, may demote member."
    roles: [ClaimsReviewer]
    code: 200
    input: []
    output: Claim
    side_effects: ["status=REJECTED", "expire OPEN deficiencies", "bubble-up member demotion", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/cure"
    description: "DEFICIENT -> CURED; resolves all open deficiencies."
    roles: [Claimant, ClaimsAdministrator]
    code: 200
    input: []
    output: Claim
    side_effects: ["cure OPEN deficiencies", "open_deficiency_count=0", "status=CURED", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/deficiencies"
    description: "Raise a deficiency against a claim; SUBMITTED|CURED -> DEFICIENT."
    roles: [ClaimsReviewer]
    code: 201
    input: [reason_code, cure_deadline]
    output: Deficiency
    side_effects: ["create Deficiency OPEN", "increment open_deficiency_count", "status=DEFICIENT", "increments Claim.version by 1"]
  - method: GET
    path: "/claims/{id}/deficiencies"
    description: "Reverse-reachability: list Deficiency children of a claim."
    roles: [ClaimsReviewer, ClaimsAdministrator, Claimant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Deficiency[]
    side_effects: []
  - method: GET
    path: "/deficiencies/{id}"
    description: "Fetch a deficiency."
    roles: [ClaimsReviewer, ClaimsAdministrator, Claimant]
    code: 200
    input: []
    output: Deficiency
    side_effects: []

  # ---- OptOut + Objection ----
  - method: POST
    path: "/opt-outs"
    description: "Request exclusion from a settlement (REQUESTED)."
    roles: [ClaimsAdministrator, Claimant]
    code: 201
    input: [settlement_id, class_member_id]
    output: OptOutRequest
    side_effects: []
  - method: GET
    path: "/opt-outs/{id}"
    description: "Fetch an opt-out request."
    roles: [ClaimsAdministrator, Claimant, FundController]
    code: 200
    input: []
    output: OptOutRequest
    side_effects: []
  - method: GET
    path: "/opt-outs"
    description: "List opt-out requests; filterable by settlement_id, class_member_id (reverse-reachability)."
    roles: [ClaimsAdministrator, FundController]
    code: 200
    input: ["settlement_id?", "class_member_id?", "status?", "limit?", "offset?"]
    output: OptOutRequest[]
    side_effects: []
  - method: POST
    path: "/opt-outs/{id}/finalize"
    description: "REQUESTED -> EFFECTIVE; excludes the member."
    roles: [ClaimsAdministrator]
    code: 200
    input: []
    output: OptOutRequest
    side_effects: ["status=EFFECTIVE", "ClassMember -> EXCLUDED"]
  - method: POST
    path: "/opt-outs/{id}/revoke"
    description: "EFFECTIVE -> REVOKED; restores the member to NOTIFIED."
    roles: [ClaimsAdministrator]
    code: 200
    input: []
    output: OptOutRequest
    side_effects: ["status=REVOKED", "ClassMember -> NOTIFIED"]
  - method: POST
    path: "/objections"
    description: "File an objection (FILED)."
    roles: [ClaimsAdministrator, Claimant]
    code: 201
    input: [settlement_id, class_member_id, grounds]
    output: Objection
    side_effects: []
  - method: GET
    path: "/objections/{id}"
    description: "Fetch an objection."
    roles: [ClaimsAdministrator, Claimant, Court, FundController]
    code: 200
    input: []
    output: Objection
    side_effects: []
  - method: GET
    path: "/objections"
    description: "List objections; filterable by settlement_id, class_member_id (reverse-reachability)."
    roles: [ClaimsAdministrator, Court, FundController]
    code: 200
    input: ["settlement_id?", "class_member_id?", "status?", "limit?", "offset?"]
    output: Objection[]
    side_effects: []
  - method: POST
    path: "/objections/{id}/rule"
    description: "FILED -> SUSTAINED|OVERRULED by the Court."
    roles: [Court]
    code: 200
    input: [ruling]
    output: Objection
    side_effects: ["status=SUSTAINED or OVERRULED"]
  - method: POST
    path: "/objections/{id}/withdraw"
    description: "FILED -> WITHDRAWN by the objecting member."
    roles: [Claimant]
    code: 200
    input: []
    output: Objection
    side_effects: ["status=WITHDRAWN"]

  # ---- DistributionBatch + Payment + TaxForm ----
  - method: POST
    path: "/distribution-batches"
    description: "Create a distribution batch in DRAFT under a DISTRIBUTING settlement."
    roles: [FundController]
    code: 201
    input: [settlement_id, sequence_no]
    output: DistributionBatch
    side_effects: []
  - method: GET
    path: "/distribution-batches/{id}"
    description: "Fetch a distribution batch."
    roles: [FundController, SettlementAdmin]
    code: 200
    input: []
    output: DistributionBatch
    side_effects: []
  - method: GET
    path: "/distribution-batches"
    description: "List distribution batches; filterable by settlement_id (reverse-reachability)."
    roles: [FundController, SettlementAdmin]
    code: 200
    input: ["settlement_id?", "status?", "limit?", "offset?"]
    output: DistributionBatch[]
    side_effects: []
  - method: POST
    path: "/distribution-batches/{id}/compute"
    description: "DRAFT -> COMPUTED; runs distribution_allocation and creates PLANNED payments."
    roles: [FundController]
    code: 200
    input: []
    output: DistributionBatch
    side_effects: ["run distribution_allocation", "create PLANNED Payments", "set planned_total_cents", "status=COMPUTED", "increments DistributionBatch.version by 1"]
  - method: POST
    path: "/distribution-batches/{id}/post"
    description: "COMPUTED -> POSTED; commits payments, debits fund, pays claims, issues tax forms."
    roles: [FundController]
    code: 200
    input: [expected_settlement_version]
    output: DistributionBatch
    side_effects: ["commit Payments", "claims VALIDATED->PAID", "append PAYMENT_DEBIT LedgerEntry", "increment Settlement.allocated_cents", "issue TaxForms", "status=POSTED", "increments Settlement.version by 1"]
  - method: POST
    path: "/distribution-batches/{id}/void"
    description: "COMPUTED -> VOID; cancels planned payments without ledger impact."
    roles: [FundController]
    code: 200
    input: []
    output: DistributionBatch
    side_effects: ["cancel PLANNED Payments", "status=VOID", "increments DistributionBatch.version by 1"]
  - method: POST
    path: "/distribution-batches/{id}/reverse"
    description: "POSTED -> REVERSED; compensates ledger, reverts claims, voids tax forms."
    roles: [FundController]
    code: 200
    input: []
    output: DistributionBatch
    side_effects: ["reverse Payments", "claims PAID->VALIDATED", "append PAYMENT_REVERSAL_CREDIT", "decrement allocated_cents", "void TaxForms", "increments Settlement.version by 1"]
  - method: GET
    path: "/distribution-batches/{id}/payments"
    description: "Reverse-reachability: list Payment children of a batch."
    roles: [FundController, SettlementAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/payments/{id}"
    description: "Fetch a payment."
    roles: [FundController, SettlementAdmin, ClaimsReviewer]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List payments; filterable by claim_id (reverse-reachability for Payment.claim_id)."
    roles: [FundController, SettlementAdmin, ClaimsReviewer]
    code: 200
    input: ["claim_id?", "distribution_batch_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/tax-forms/{id}"
    description: "Fetch a tax form."
    roles: [FundController, SettlementAdmin]
    code: 200
    input: []
    output: TaxForm
    side_effects: []
  - method: GET
    path: "/tax-forms"
    description: "List tax forms; filterable by payment_id and class_member_id (reverse-reachability)."
    roles: [FundController, SettlementAdmin]
    code: 200
    input: ["payment_id?", "class_member_id?", "status?", "limit?", "offset?"]
    output: TaxForm[]
    side_effects: []
  - method: POST
    path: "/tax-forms/{id}/correct"
    description: "ISSUED -> CORRECTED; refreshes reportable/withheld amounts from the payment."
    roles: [FundController]
    code: 200
    input: []
    output: TaxForm
    side_effects: ["recompute reportable_cents/withheld_cents", "status=CORRECTED", "increments TaxForm.version by 1"]

  # ---- CyPresDesignation ----
  - method: POST
    path: "/settlements/{id}/cy-pres-designations"
    description: "Propose a cy pres recipient under a settlement (PROPOSED)."
    roles: [SettlementAdmin]
    code: 201
    input: [recipient_name, share_bps]
    output: CyPresDesignation
    side_effects: []
  - method: GET
    path: "/cy-pres-designations/{id}"
    description: "Fetch a cy pres designation."
    roles: [SettlementAdmin, FundController, Court]
    code: 200
    input: []
    output: CyPresDesignation
    side_effects: []
  - method: GET
    path: "/settlements/{id}/cy-pres-designations"
    description: "Reverse-reachability: list CyPresDesignation children of a settlement."
    roles: [SettlementAdmin, FundController, Court]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CyPresDesignation[]
    side_effects: []
  - method: POST
    path: "/cy-pres-designations/{id}/approve"
    description: "PROPOSED -> APPROVED by the Court."
    roles: [Court]
    code: 200
    input: []
    output: CyPresDesignation
    side_effects: ["status=APPROVED"]
  - method: POST
    path: "/cy-pres-designations/{id}/revoke"
    description: "PROPOSED -> REVOKED by the Court."
    roles: [Court]
    code: 200
    input: []
    output: CyPresDesignation
    side_effects: ["status=REVOKED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's notion of current UTC for deadline-gated checks."
    roles: [SettlementAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["server clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or unparseable X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the authenticated role is not permitted for this operation"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "a path-referenced settlement (or other primary path resource) does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a body foreign key references a non-existent row"
  - id: ERR_MEMBER_SETTLEMENT_MISMATCH
    http: 422
    condition: "the class member named in the body does not belong to the settlement named in the body"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not defined from the resource's current state"
  - id: ERR_SETTLEMENT_POSTURE_INVALID
    http: 409
    condition: "the owning settlement is not in a posture that permits this child operation"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "a claim is filed at or after claim_filing_deadline"
  - id: ERR_OBJECTION_WINDOW_CLOSED
    http: 422
    condition: "an objection or opt-out is filed at or after objection_deadline"
  - id: ERR_CURE_WINDOW_CLOSED
    http: 422
    condition: "a cure is submitted at or after an OPEN deficiency's cure_deadline"
  - id: ERR_MEMBER_HAS_CLAIM
    http: 409
    condition: "finalizing an opt-out for a member that has a non-REJECTED claim"
  - id: ERR_MEMBER_EXCLUDED
    http: 409
    condition: "an EXCLUDED member attempts to file a claim"
  - id: ERR_RECOGNIZED_EXCEEDS_CLAIMED
    http: 422
    condition: "recognized_loss_cents supplied at validation exceeds the claim's claimed_loss_cents"
  - id: ERR_INVALID_SUPERSEDE
    http: 422
    condition: "supersedes_claim_id does not point to a REJECTED claim of the same member, or that claim is already superseded"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the FundController posting a batch validated a claim paid in it"
  - id: ERR_CY_PRES_SHARES_UNBALANCED
    http: 422
    condition: "sum of APPROVED cy pres share_bps != 10000 at reconcile sweep"
  - id: ERR_FUND_EXCEEDED
    http: 422
    condition: "posting a batch would push allocated_cents above net_distributable_cents"
  - id: ERR_STALE_SETTLEMENT_VERSION
    http: 412
    condition: "expected_settlement_version does not match the current Settlement.version"
  - id: ERR_DUPLICATE_MEMBER_EMAIL
    http: 409
    condition: "a class member with the same email already exists in the settlement"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "an enum-typed input field carries a value outside its declared set"
  - id: ERR_MISSING_REQUIRED_FIELD
    http: 422
    condition: "a required input field is absent from the request body"
  - id: ERR_VALIDATION_BLOCKED_BY_DEFICIENCY
    http: 409
    condition: "validating a claim with open_deficiency_count > 0"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SettlementAdmin
    description: "Configures the fund, runs the settlement-posture lifecycle (notice/claims windows, close), proposes cy pres recipients."
    identity: "opaque"
    exclusive_operations:
      - "POST /settlements"
      - "POST /settlements/{id}/open-notice"
      - "POST /settlements/{id}/open-claims"
      - "POST /settlements/{id}/close-claims"
      - "POST /settlements/{id}/close"
      - "POST /settlements/{id}/cy-pres-designations"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /settlements/{id}"
      - "GET /settlements/{id}/ledger-balance"
      - "GET /settlements/{id}/ledger-entries"

  - name: FundController
    description: "Owns the money: begins distribution, computes/posts/voids/reverses batches, reconciles, corrects tax forms. Segregated from claim validation."
    identity: "opaque"
    exclusive_operations:
      - "POST /settlements/{id}/begin-distribution"
      - "POST /settlements/{id}/reconcile"
      - "POST /distribution-batches"
      - "POST /distribution-batches/{id}/compute"
      - "POST /distribution-batches/{id}/post"
      - "POST /distribution-batches/{id}/void"
      - "POST /distribution-batches/{id}/reverse"
      - "POST /tax-forms/{id}/correct"
    shared_operations:
      - "GET /settlements/{id}"
      - "GET /distribution-batches/{id}"

  - name: ClaimsReviewer
    description: "Adjudicates claims: validates, rejects, raises deficiencies. Segregated from batch posting (cannot pay a claim they validated)."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/validate"
      - "POST /claims/{id}/reject"
      - "POST /claims/{id}/deficiencies"
    shared_operations:
      - "GET /claims/{id}"
      - "GET /claims"

  - name: ClaimsAdministrator
    description: "Intake operations: registers members, sends notices, files claims/opt-outs/objections on behalf of members, finalizes/revokes opt-outs, processes cures."
    identity: "opaque"
    exclusive_operations:
      - "POST /settlements/{id}/class-members"
      - "POST /class-members/{id}/notices"
      - "POST /opt-outs/{id}/finalize"
      - "POST /opt-outs/{id}/revoke"
    shared_operations:
      - "POST /claims"
      - "POST /opt-outs"
      - "POST /objections"
      - "POST /claims/{id}/cure"
      - "GET /class-members/{id}"

  - name: Claimant
    description: "Self-service class member: files own claim, cures deficiencies, files/withdraws objections and opt-outs."
    identity: "entity_backed:ClassMember"
    exclusive_operations:
      - "POST /class-members/{id}/file-claim"
      - "POST /objections/{id}/withdraw"
    shared_operations:
      - "POST /claims"
      - "POST /opt-outs"
      - "POST /objections"
      - "POST /claims/{id}/cure"
      - "GET /claims/{id}"

  - name: Court
    description: "Judicial actor: approves/revokes cy pres designations and rules on objections."
    identity: "opaque"
    exclusive_operations:
      - "POST /objections/{id}/rule"
      - "POST /cy-pres-designations/{id}/approve"
      - "POST /cy-pres-designations/{id}/revoke"
    shared_operations:
      - "GET /objections/{id}"
      - "GET /cy-pres-designations/{id}"
