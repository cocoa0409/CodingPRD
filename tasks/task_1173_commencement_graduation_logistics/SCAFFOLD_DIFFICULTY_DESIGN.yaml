              payload: { ceremony_id: "${c}", full_name: "Ora Pay", email: "ora@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
            - call: "POST /api/graduates/${g}/regalia-orders"
              payload: { items: [ { item_type: "GOWN", size: "M", quantity: 1, unit_price_cents: 10000 } ] }
              as: Graduate
              as_user_id: "${g}"
              captures: { o: $.data.id }
            - call: "POST /api/regalia-orders/${o}/cancel"
              payload: {}
              as: Graduate
              as_user_id: "${g}"
          trigger:
            - call: "POST /api/regalia-orders/${o}/pay"
              payload: { amount_cents: 1 }
              as: Graduate
              as_user_id: "${g}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 — the order is CANCELLED (state violation, priority 8)"
            - "amount 1 != total 9000 also violates the fiscal rule (priority 30), but the state error MUST win"

