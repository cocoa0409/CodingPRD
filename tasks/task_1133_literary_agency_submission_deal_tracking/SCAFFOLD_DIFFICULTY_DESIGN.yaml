            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "Loop Book" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
          trigger:
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 60 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/request-revision", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { rr1: $.data.revision_round } }
            - { call: "POST /manuscripts/${ms1}/resubmit", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 65 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/request-revision", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { rr2: $.data.revision_round } }
            - { call: "POST /manuscripts/${ms1}/resubmit", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 75 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/request-revision", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { err3: $.data.error_id } }
          assert:
            - "${rr1} == 1 and ${rr2} == 2   # loop closed twice"
            - "${err3} == ERR_REVISION_LIMIT_REACHED   # third loop rejected, http 409"
            - "Manuscript.${ms1}.revision_round == 2"
            - "Manuscript.${ms1}.status == EVALUATED   # failed third revision leaves state unchanged"

      - name: royalty_statement_audit_loop_reopen_and_clear
        grounds:
          - state_machines.RoyaltyStatement.RECONCILED_to_AUDIT_OPEN
          - state_machines.RoyaltyStatement.AUDIT_RESOLVED_to_AUDIT_OPEN
          - state_machines.RoyaltyStatement.AUDIT_RESOLVED_to_CLEARED
        distinguishing_aspect: |
          RoyaltyStatement (a DIFFERENT entity than the sibling's Manuscript) is
          non-linear with a branching audit loop: RECONCILED can go straight to
          CLEARED or fork into AUDIT_OPEN -> AUDIT_RESOLVED, and AUDIT_RESOLVED
          can loop BACK to AUDIT_OPEN when variance persists — the fork/join and
