              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua2}", application_type: "NEW", season_year: 2027, requested_service_days: 300, proposed_activity_type: "MOUNTAINEERING", narrative: "Willow Divide climbs." }
              as: PermitSpecialist
