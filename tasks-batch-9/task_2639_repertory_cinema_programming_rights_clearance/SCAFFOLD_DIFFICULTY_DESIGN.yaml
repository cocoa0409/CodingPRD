# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
#   Task 2639 - Repertory Cinema Programming & Rights Clearance
#   Companion to SCAFFOLD.yaml (§1.1-§1.7). Nothing here declares new behaviour;
#   every instance grounds in an element already declared there.
#
#   Canonical fixture used by most chains (all literals pre-computed):
#     Venue   : seat_capacity 12, house_hold_seats 4 (=> 8 sellable),
#               trailer_reel_minutes 12, turnaround_minutes 25,
#               min_useful_gap_minutes 45, dcp_ingest_lane_count 2,
#               open 11:00 / last start 22:00, utc_offset_minutes 0,
#               max_first_run_share 0.60, weekly_repertory_target 3,
#               base_house_nut_weekly_cents 200000
#     Title T1: runtime_minutes 104  => on-screen block 116 min, screen block 141 min
#     Booking : SLIDING_SCALE_90_10, house_nut 12500, share 0.35,
#               guarantee 3000, min_run_days 4, engagement 2026-08-10..2026-08-20
#     Logical clock default: 2026-08-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: settlement_provisional_vs_final_inclusion_set_divergence
        grounds:
          - calculations.settlement_film_rent
          - entities.Settlement.fields.film_rent_cents
          - entities.Settlement.fields.playing_days
          - state_machines.Settlement.SUBMITTED_to_RECONCILED
          - endpoints[POST /settlements]
          - endpoints[POST /settlements/{id}/finalize]
        distinguishing_aspect: |
          The two variants differ in their INCLUSION SET, not in their arithmetic: PROVISIONAL counts
          SCHEDULED showtimes and RESERVED holds, FINAL counts only COMPLETED showtimes and PAID
          orders. Over one unchanged database this drives playing_days 3 -> 2, which pushes the
          proration factor from 0.75 down to the MIN_PRORATION_FLOOR 0.60, and film_rent_cents from
          5332 to 4409 - the larger gross yields the SMALLER film rent because the prorated house nut
          grew faster than the gross did.
        test_recipe:
          setup:
            - "One venue, one distributor, one repertory title (104 min), one CONFIRMED booking on SLIDING_SCALE_90_10 with house_nut 12500 / guarantee 3000 / min_run_days 4."
            - "One CLEARED clearance (max_screenings 6) and one DCP asset, both DCP_2K."
            - "Three showtimes on three distinct venue-local dates: SA 2026-08-14T12:00Z and SB 2026-08-15T12:00Z are COMPLETED, SC 2026-08-16T12:00Z stays SCHEDULED."
            - "Four orders: O1 (member SUPPORTER, qty 3, total 4149) and O2 (anon qty 2, total 3200) and O3 (anon qty 4, total 6400) are PAID; O4 (anon qty 2, total 3200) stays RESERVED on SC."
            - "The booking is then CLOSED so a settlement may be drafted."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
              as_user_id: "u-rm-2"
            - call: "POST /dcp-assets"
              payload: { title_id: "${t1_id}", source_distributor_id: "${d_id}", venue_id: "${v_id}", format: "DCP_2K", is_encrypted: false, carrier_ref: "WB-77120", ingest_window_start_at: "2026-07-30T08:00:00Z", ingest_window_end_at: "2026-07-31T08:00:00Z" }
              as: TechnicalManager
              captures: { a_id: $.data.id }
            - call: "GET /clearances/${c_id}"
              payload: {}
              as: Programmer
              captures: { c_v1: $.data.version }
            - call: "POST /showtimes"
              payload: { venue_id: "${v_id}", title_id: "${t1_id}", booking_id: "${b_id}", clearance_id: "${c_id}", dcp_asset_id: "${a_id}", strand: "REPERTORY_SERIES", start_at: "2026-08-14T12:00:00Z", base_price_cents: 1450, public_sale_opens_at: "2026-08-01T00:00:00Z", format: "DCP_2K", expected_clearance_version: "${c_v1}" }
              as: Programmer
              captures: { sa_id: $.data.id }
            - call: "GET /clearances/${c_id}"
              payload: {}
              as: Programmer
              captures: { c_v2: $.data.version }
            - call: "POST /showtimes"
              payload: { venue_id: "${v_id}", title_id: "${t1_id}", booking_id: "${b_id}", clearance_id: "${c_id}", dcp_asset_id: "${a_id}", strand: "REPERTORY_SERIES", start_at: "2026-08-15T12:00:00Z", base_price_cents: 1450, public_sale_opens_at: "2026-08-01T00:00:00Z", format: "DCP_2K", expected_clearance_version: "${c_v2}" }
              as: Programmer
              captures: { sb_id: $.data.id }
            - call: "GET /clearances/${c_id}"
              payload: {}
              as: Programmer
              captures: { c_v3: $.data.version }
            - call: "POST /showtimes"
              payload: { venue_id: "${v_id}", title_id: "${t1_id}", booking_id: "${b_id}", clearance_id: "${c_id}", dcp_asset_id: "${a_id}", strand: "REPERTORY_SERIES", start_at: "2026-08-16T12:00:00Z", base_price_cents: 1450, public_sale_opens_at: "2026-08-01T00:00:00Z", format: "DCP_2K", expected_clearance_version: "${c_v3}" }
              as: Programmer
              captures: { sc_id: $.data.id }
            - call: "POST /showtimes/${sa_id}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /showtimes/${sb_id}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /showtimes/${sc_id}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /members"
              payload: { full_name: "Ada Wells", email: "ada@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/donations"
              payload: { amount_cents: 20000, received_at: "2026-03-01T10:00:00Z" }
              as: BoxOfficeManager
            - call: "POST /ticket-orders"
              payload: { showtime_id: "${sa_id}", quantity: 3, purchaser_email: "ada@example.com", member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /ticket-orders"
              payload: { showtime_id: "${sb_id}", quantity: 2, purchaser_email: "walkup1@example.com" }
              as: Anonymous
              captures: { o2_id: $.data.id }
            - call: "POST /ticket-orders"
              payload: { showtime_id: "${sb_id}", quantity: 4, purchaser_email: "walkup2@example.com" }
              as: Anonymous
              captures: { o3_id: $.data.id }
            - call: "POST /ticket-orders"
              payload: { showtime_id: "${sc_id}", quantity: 2, purchaser_email: "walkup3@example.com" }
              as: Anonymous
              captures: { o4_id: $.data.id }
            - call: "POST /ticket-orders/${o1_id}/pay"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /ticket-orders/${o2_id}/pay"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /ticket-orders/${o3_id}/pay"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /showtimes/${sa_id}/complete"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /showtimes/${sb_id}/complete"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /bookings/${b_id}/close"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "GET /bookings/${b_id}"
              payload: {}
              as: BoxOfficeManager
              captures: { b_v1: $.data.version }
          trigger:
            - call: "POST /settlements"
              payload: { booking_id: "${b_id}", variant: "PROVISIONAL", expected_booking_version: "${b_v1}" }
              as: BoxOfficeManager
              captures: { st_id: $.data.id }
            - call: "POST /settlements/${st_id}/submit"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /settlements/${st_id}/finalize"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
          assert:
            - "The PROVISIONAL draft returned by the first trigger call has Settlement.${st_id}.box_office_cents == 16949 and facility_fee_total_cents == 1650 and adjusted_gross_cents == 15299."
            - "The PROVISIONAL draft has Settlement.${st_id}.playing_days == 3 and proration_factor == 0.75 and house_nut_applied_cents == 9375."
            - "The PROVISIONAL draft has Settlement.${st_id}.film_rent_cents == 5332 and cinema_retained_cents == 11617."
            - "After finalize, Settlement.${st_id}.variant == FINAL and status == RECONCILED."
            - "After finalize, Settlement.${st_id}.box_office_cents == 13749 and facility_fee_total_cents == 1350 and adjusted_gross_cents == 12399."
            - "After finalize, Settlement.${st_id}.playing_days == 2 and proration_factor == 0.60 and house_nut_applied_cents == 7500."
            - "After finalize, Settlement.${st_id}.film_rent_cents == 4409 and cinema_retained_cents == 9340."
            - "No TicketOrder or Showtime row changed between the two computations: TicketOrder.${o4_id}.status == RESERVED and Showtime.${sc_id}.status == SCHEDULED throughout."
            - "Settlement.${st_id}.min_run_penalty_cents == 3750, matching Booking.${b_id}.min_run_penalty_cents."

      - name: member_rolling_twelve_month_vs_fiscal_ytd_tier_divergence
        grounds:
          - calculations.member_standing
          - entities.Member.fields.rolling_tier
          - entities.Member.fields.fiscal_tier
          - entities.Member.fields.effective_tier
          - endpoints[POST /members/{id}/donations]
          - endpoints[GET /members/{id}]
        distinguishing_aspect: |
          Both variants sum the SAME donations array against the SAME logical clock, differing only
          in window origin: rolling starts at clock - 365 days (2025-08-03T09:00:00Z), fiscal starts
          at FISCAL_YEAR_START 2026-07-01T00:00:00Z. The 20000-cent gift of 2026-03-01 is inside the
          rolling window and outside the fiscal year, so rolling_tier is SUPPORTER (28000) while
          fiscal_tier is only BASIC (8000); effective_tier takes the higher rank, SUPPORTER, and
          the member's discount_pct is therefore 0.15 rather than 0.10.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-03T09:00:00Z before any donation is lodged."
            - "One member with exactly two donations: 20000 cents received 2026-03-01T10:00:00Z (previous fiscal year, inside the rolling window) and 8000 cents received 2026-07-15T10:00:00Z (this fiscal year)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /members"
              payload: { full_name: "Ada Wells", email: "ada@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/donations"
              payload: { amount_cents: 20000, received_at: "2026-03-01T10:00:00Z" }
              as: BoxOfficeManager
          trigger:
            - call: "POST /members/${m_id}/donations"
              payload: { amount_cents: 8000, received_at: "2026-07-15T10:00:00Z" }
              as: BoxOfficeManager
            - call: "GET /members/${m_id}"
              payload: {}
              as: BoxOfficeManager
          assert:
            - "Member.${m_id}.rolling_donation_cents == 28000 and Member.${m_id}.rolling_tier == SUPPORTER."
            - "Member.${m_id}.fiscal_ytd_donation_cents == 8000 and Member.${m_id}.fiscal_tier == BASIC."
            - "Member.${m_id}.effective_tier == SUPPORTER (the higher-ranked of the two variants)."
            - "Member.${m_id}.discount_pct == 0.15 and advance_access_hours == 48 and comp_tickets_granted == 2 and comp_tickets_remaining == 2."
            - "Member.${m_id}.expires_at == 2027-07-15T10:00:00.000Z (latest donation received_at + MEMBERSHIP_TERM_DAYS) and status == ACTIVE."

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: ticket_pricing_per_ticket_rounding_before_summation
        grounds:
          - calculations.ticket_order_pricing
          - entities.TicketOrder.fields.unit_price_cents
          - entities.TicketOrder.fields.line_subtotal_cents
          - entities.TicketOrder.fields.total_cents
          - endpoints[POST /ticket-orders]
        distinguishing_aspect: |
          Mode (b): a fixed number of inputs whose STEP ORDER changes the answer. The discount is
          rounded half-up once per ticket and only then multiplied by the paid quantity, so
          round_half_up(1450 * 0.85) = 1233 -> 1233 * 3 = 3699 -> +450 facility = 4149. Summing first
          and rounding once, round_half_up(1450 * 3 * 0.85) = 3698 -> +450 = 4148, is off by exactly
          one cent - the single observable that separates the pinned order from the forbidden one.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title(104 min) / CONFIRMED booking / CLEARED clearance / DCP asset."
            - "One showtime SA 2026-08-14T12:00Z at base_price_cents 1450 with no special event, so surcharge_cents is 0; sales are open."
            - "One member whose only donation is 20000 cents received 2026-03-01T10:00:00Z, giving effective_tier SUPPORTER and discount_pct 0.15 against the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
              as_user_id: "u-rm-2"
            - call: "POST /dcp-assets"
              payload: { title_id: "${t1_id}", source_distributor_id: "${d_id}", venue_id: "${v_id}", format: "DCP_2K", is_encrypted: false, carrier_ref: "WB-77120", ingest_window_start_at: "2026-07-30T08:00:00Z", ingest_window_end_at: "2026-07-31T08:00:00Z" }
              as: TechnicalManager
              captures: { a_id: $.data.id }
            - call: "GET /clearances/${c_id}"
              payload: {}
              as: Programmer
              captures: { c_v1: $.data.version }
            - call: "POST /showtimes"
              payload: { venue_id: "${v_id}", title_id: "${t1_id}", booking_id: "${b_id}", clearance_id: "${c_id}", dcp_asset_id: "${a_id}", strand: "REPERTORY_SERIES", start_at: "2026-08-14T12:00:00Z", base_price_cents: 1450, public_sale_opens_at: "2026-08-01T00:00:00Z", format: "DCP_2K", expected_clearance_version: "${c_v1}" }
              as: Programmer
              captures: { sa_id: $.data.id }
            - call: "POST /showtimes/${sa_id}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /members"
              payload: { full_name: "Ada Wells", email: "ada@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/donations"
              payload: { amount_cents: 20000, received_at: "2026-03-01T10:00:00Z" }
              as: BoxOfficeManager
          trigger:
            - call: "POST /ticket-orders"
              payload: { showtime_id: "${sa_id}", quantity: 3, purchaser_email: "ada@example.com", member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o1_id: $.data.id }
          assert:
            - "TicketOrder.${o1_id}.unit_price_cents == 1233 (round_half_up of 1450 * 0.85, computed before any multiplication)."
