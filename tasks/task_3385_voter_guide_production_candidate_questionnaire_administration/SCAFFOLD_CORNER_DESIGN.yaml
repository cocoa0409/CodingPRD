  # ===========================================================================
  - section: errors
    instances:

      - name: every_error_id_is_triggered_by_a_declared_surface
        claim_type: violation_to_error
        grounds: ["errors"]
        distinguishing_aspect: "Catalog sweep: each of the 40 error ids is exercised by exactly one §1.8 instance or §1.9 corner; this checklist entry exists so the unit-test generator audits triggerability explicitly."
        test_recipe:
          setup: ["No runtime state; this is a coverage-audit instance mapping error ids to their triggering instances."]
          setup_api_calls: []
          trigger:
            - { call: "GET /election-cycles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: LeagueAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "Spot check: unknown cycle id yields ERR_NOT_FOUND 404"
            - "Coverage map (error_id -> exercising instance): ERR_UNAUTHENTICATED -> missing_role_header_returns_unauthenticated / volunteer_lacking_capability_tag_returns_unauthenticated; ERR_UNAUTHORIZED_ROLE -> reviewer_cannot_create_contest_returns_unauthorized_role / non_assigned_moderator_cannot_drive_forum; ERR_INVALID_REQUEST -> contest_create_with_undeclared_or_computed_field_rejected / measure_contest_with_office_name_rejected / public_user_question_sourcing_rules / forum_held_before_end_or_without_minutes_rejected; ERR_NOT_FOUND -> contest_get_with_random_uuid_returns_not_found / candidate_submit_to_foreign_contest_returns_not_found; ERR_CYCLE_NOT_OPEN -> contest_creation_on_draft_cycle_rejected; ERR_INVALID_STATE -> contest_lock_from_filing_open_returns_invalid_state / disqualified_filing_cannot_refile / resubmit_from_submitted_returns_invalid_state / distributed_edition_cannot_reopen / question_select_on_planned_forum_returns_invalid_state; ERR_QUESTIONNAIRE_NOT_ACCEPTING_SUBMISSIONS -> §1.8 closed_questionnaire_state_beats_past_due_temporal; ERR_FILING_NOT_VERIFIED -> §1.8 response_submit_blocked_when_filing_hidden; ERR_QUESTIONNAIRE_NOT_PINNED -> §1.8 contest_guide_ready_blocked_until_questionnaire_pinned; ERR_STALE_VERSION -> stale_contest_version_returns_412 / stale_questionnaire_version_returns_412; ERR_VOLUNTEER_SUSPENDED -> suspended_volunteer_cannot_coordinate; ERR_ATTESTATION_LAPSED -> attestation_lapse_blocks_then_attest_cures; ERR_ADVOCACY_SEPARATION -> advocacy_flagged_reviewer_rejected; ERR_MODERATOR_NOT_QUALIFIED -> moderator_without_moderator_role_tag_rejected; ERR_SOD_DRAFTER_CANNOT_REVIEW -> drafter_cannot_review_own_measure; ERR_SOD_MODERATOR_OWN_QUESTION -> moderator_cannot_select_own_authored_question; ERR_ONLY_DRAFTER_MAY_REVISE -> non_drafter_cannot_revise_or_submit; ERR_NEUTRALITY_REVIEW_OUTSTANDING -> §1.8 neutrality_outstanding_safety_beats_language_constraint; ERR_FILING_DEADLINE_PASSED -> filing_after_deadline_rejected; ERR_FILING_STILL_OPEN -> phase_advance_at_exact_deadline_rejected_filing_at_exact_deadline_accepted; ERR_SUBMISSION_WINDOW_CLOSED -> submission_after_due_single_failure_temporal; ERR_CLOSE_BEFORE_DEADLINE -> questionnaire_close_before_deadline_rejected; ERR_FORUM_TIME_OVERLAP -> §1.8 jurisdiction_forum_overlap_half_open_adjacency; ERR_MODERATOR_BUFFER_VIOLATION -> §1.8 moderator_twenty_four_hour_buffer_gap; ERR_FORUM_NOT_CONCLUDED -> forum_held_before_end_or_without_minutes_rejected; ERR_DUPLICATE_FIPS -> jurisdiction_duplicate_fips_in_same_cycle_rejected; ERR_DUPLICATE_FILING_REFERENCE -> filing_reference_reuse_rejected_in_same_contest_only; ERR_DUPLICATE_QUESTIONNAIRE / ERR_DUPLICATE_MEASURE -> duplicate_questionnaire_and_duplicate_measure_rejected; ERR_DUPLICATE_REVIEW_THIS_ROUND -> duplicate_review_same_round_rejected_then_allowed_next_round; ERR_CONTEST_KIND_MISMATCH -> kind_mismatch_rejected_both_directions; ERR_MISSING_PRO_OR_CON -> submit_for_review_without_con_side_rejected; ERR_FORUM_QUORUM_NOT_MET -> §1.8 forum_quorum_exactly_two_confirms; ERR_QUESTION_CAP_REACHED -> sixth_question_select_rejected; ERR_LANGUAGE_UNSUPPORTED -> language_unsupported_alone_rejected (and as the losing error in §1.8 neutrality_outstanding_safety_beats_language_constraint); ERR_ACCESSIBILITY_GRADE_EXCEEDED -> §1.8 reading_grade_fk_passes_smog_fails_same_text; ERR_STALE_SNAPSHOT -> stale_snapshot_blocks_distribute_after_incident_unlock; ERR_CONTESTS_NOT_LOCKED / ERR_NO_DISTRIBUTED_EDITION -> publish_blocked_by_unlocked_contest_and_by_missing_distribution; ERR_UNRESOLVED_INCIDENTS_EXIST -> publish_blocked_by_reported_incident"

