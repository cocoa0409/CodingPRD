            - "the second fails: 409 ERR_AGREEMENT_NOT_AWAITING_REVIEW"

      - name: appeal_and_resolve_appeal_from_wrong_states_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Complaint.ADJUDICATION_DECIDED_to_APPEALED
