        distinguishing_aspect: "CarePlan's DRAFT->ACTIVE depends on the origin Visit being a COMPLETED ANNUAL_PHYSICAL (CarePlan->Visit pair, distinct from Visit->Member): activating against an origin visit that is only CHECKED_IN (not COMPLETED) returns ERR_MEMBER_NOT_ELIGIBLE and the plan stays DRAFT."
        test_recipe:
          setup:
            - "ACTIVE member m with an ANNUAL_PHYSICAL visit that is CHECKED_IN (NOT yet COMPLETED). A DRAFT CarePlan with goal_count=1 referencing that visit."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC X7b", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
