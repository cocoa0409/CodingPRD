endpoints:
  # ---- Test-driving / configuration ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]
  - method: POST
    path: "/testing-sites"
    description: "Create a drug/alcohol testing site."
    roles: [ProgramAdmin]
    code: 201
    input: [name, slot_capacity]
    output: TestingSite
    side_effects: []
  - method: GET
    path: "/testing-sites/{id}"
    description: "Get a testing site."
    roles: [ProgramAdmin, SupervisingOfficer, IntakeOfficer, JudicialOfficer]
    code: 200
    input: []
    output: TestingSite
    side_effects: []
  - method: GET
    path: "/testing-sites/{id}/drug-tests"
    description: "List drug tests at a site (reverse lookup for DrugTest.site_id)."
    roles: [ProgramAdmin, SupervisingOfficer, IntakeOfficer, JudicialOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DrugTest[]
    side_effects: []
  - method: POST
    path: "/em-devices"
    description: "Create an EM device inventory pool."
    roles: [ProgramAdmin]
    code: 201
    input: [model_name, total_units]
    output: EMDevice
    side_effects: ["available_units = total_units"]
  - method: GET
    path: "/em-devices/{id}"
    description: "Get an EM device pool (including available_units)."
    roles: [ProgramAdmin, SupervisingOfficer, IntakeOfficer, JudicialOfficer]
    code: 200
    input: []
    output: EMDevice
    side_effects: []
  - method: GET
    path: "/em-devices/{id}/enrollments"
    description: "List enrollments on a device pool (reverse lookup for EMEnrollment.device_id)."
    roles: [ProgramAdmin, SupervisingOfficer, IntakeOfficer, JudicialOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EMEnrollment[]
    side_effects: []

  # ---- Defendant ----
  - method: POST
    path: "/defendants"
    description: "Create a defendant."
    roles: [IntakeOfficer]
    code: 201
    input: [case_number, full_name, date_of_birth, "indigent?"]
    output: Defendant
    side_effects: ["supervision_status = PRETRIAL_PENDING"]
  - method: GET
    path: "/defendants/{id}"
    description: "Get a defendant."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin, Defendant]
    code: 200
    input: []
    output: Defendant
    side_effects: []
  - method: GET
    path: "/defendants"
    description: "List defendants (paginated)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: ["supervision_status?", "supervision_level?", "limit?", "offset?"]
    output: Defendant[]
    side_effects: []
  - method: POST
    path: "/defendants/{id}/transition"
    description: "Discharge or terminate a defendant's supervision."
    roles: [JudicialOfficer, SupervisingOfficer]
    code: 200
    input: [to_status]
    output: Defendant
    side_effects: ["state transition per Defendant state machine"]
  - method: POST
    path: "/defendants/{id}/level-adjustments"
    description: "Record a manual supervision-level adjustment (OCC on Defendant.version)."
    roles: [SupervisingOfficer, JudicialOfficer]
    code: 201
    input: [expected_defendant_version, to_level, "reason?"]
    output: LevelAdjustment
    side_effects:
      - "set Defendant.supervision_level = to_level"
      - "set LevelAdjustment.from_level = prior level, source = MANUAL, adjusted_by_user_id = X-User-ID"
      - "increments Defendant.version by 1"
  - method: GET
    path: "/defendants/{id}/level-adjustments"
    description: "List a defendant's level adjustments (reverse lookup for LevelAdjustment.defendant_id)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: ["source?", "limit?", "offset?"]
    output: LevelAdjustment[]
    side_effects: []
  - method: POST
    path: "/defendants/{id}/fees"
    description: "Assess a supervision fee; creates a CHARGE LedgerEntry using the ASSESSED or ADJUSTED variant per Defendant.indigent."
    roles: [SupervisingOfficer, ProgramAdmin]
    code: 201
    input: [supervision_days, em_days, scheduled_test_count]
    output: LedgerEntry
    side_effects:
      - "compute supervision_fee variant"
      - "create LedgerEntry {entry_type: CHARGE, source: SUPERVISION_FEE, amount_cents: +charge}"
      - "recompute Defendant.balance_owed_cents"
  - method: POST
    path: "/defendants/{id}/ledger-entries"
    description: "Post a PAYMENT, WAIVER, or REVERSAL ledger entry."
    roles: [SupervisingOfficer, ProgramAdmin]
    code: 201
    input: [entry_type, "amount_cents?", "reverses_entry_id?"]
    output: LedgerEntry
    side_effects:
      - "PAYMENT/WAIVER: amount_cents stored negative; REVERSAL: amount_cents = -(referenced entry amount)"
      - "recompute Defendant.balance_owed_cents"
  - method: GET
    path: "/defendants/{id}/ledger"
    description: "List a defendant's ledger entries (reverse lookup for LedgerEntry.defendant_id)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ---- RiskAssessment ----
  - method: POST
    path: "/assessments"
    description: "Create a risk assessment in DRAFT."
    roles: [IntakeOfficer]
    code: 201
    input: [defendant_id, instrument_type, prior_failures, pending_charges_count, "pending_violent_charge?", employment_status, residence_stability, "substance_flag?"]
    output: RiskAssessment
    side_effects: ["status = DRAFT"]
  - method: POST
    path: "/assessments/{id}/transition"
    description: "Advance a risk assessment (SUBMITTED / APPROVED / REJECTED / DRAFT kickback)."
    roles: [IntakeOfficer, JudicialOfficer]
    code: 200
    input: [to_status]
    output: RiskAssessment
    side_effects: ["per RiskAssessment state machine: compute score on SUBMITTED, set risk_tier on APPROVED"]
  - method: GET
    path: "/assessments/{id}"
    description: "Get a risk assessment."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: []
  - method: GET
    path: "/defendants/{id}/assessments"
    description: "List a defendant's assessments (reverse lookup for RiskAssessment.defendant_id)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RiskAssessment[]
    side_effects: []

  # ---- ReleaseOrder ----
  - method: POST
    path: "/release-orders"
    description: "Propose a release order referencing an assessment."
    roles: [JudicialOfficer]
    code: 201
    input: [defendant_id, assessment_id, decision, ordered_conditions]
    output: ReleaseOrder
    side_effects: ["status = PROPOSED"]
  - method: POST
    path: "/release-orders/{id}/transition"
    description: "Order / deny / vacate a release order."
    roles: [JudicialOfficer]
    code: 200
    input: [to_status]
    output: ReleaseOrder
    side_effects: ["per ReleaseOrder state machine; ORDERED activates the defendant and sets supervision_level"]
  - method: GET
    path: "/defendants/{id}/release-orders"
    description: "List a defendant's release orders (reverse lookup for ReleaseOrder.defendant_id)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReleaseOrder[]
    side_effects: []
  - method: GET
    path: "/assessments/{id}/release-orders"
    description: "List release orders relying on an assessment (reverse lookup for ReleaseOrder.assessment_id)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReleaseOrder[]
    side_effects: []

  # ---- CheckIn ----
  - method: POST
    path: "/check-ins"
    description: "Schedule a check-in for a defendant."
    roles: [SupervisingOfficer]
    code: 201
    input: [defendant_id, due_at]
    output: CheckIn
    side_effects: ["status = SCHEDULED, origin = MANUAL"]
  - method: POST
    path: "/check-ins/{id}/transition"
    description: "Complete (defendant/officer) or mark-missed (officer) a check-in."
    roles: [Defendant, SupervisingOfficer]
    code: 200
    input: [to_status]
    output: CheckIn
    side_effects: ["per CheckIn state machine; MISSED cascades a ViolationEvent"]
  - method: GET
    path: "/defendants/{id}/check-ins"
    description: "List a defendant's check-ins (reverse lookup for CheckIn.defendant_id)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin, Defendant]
    code: 200
    input: ["status?", "origin?", "limit?", "offset?"]
    output: CheckIn[]
    side_effects: []

  # ---- EMEnrollment ----
  - method: POST
    path: "/em-enrollments"
    description: "Create an EM enrollment (PENDING) linking a defendant to a device pool."
    roles: [SupervisingOfficer]
    code: 201
    input: [defendant_id, device_id]
    output: EMEnrollment
    side_effects: ["status = PENDING"]
  - method: POST
    path: "/em-enrollments/{id}/transition"
    description: "Activate / suspend / resume / terminate an EM enrollment."
    roles: [SupervisingOfficer]
    code: 200
    input: [to_status]
    output: EMEnrollment
    side_effects: ["per EMEnrollment state machine; ACTIVE assigns a unit, TERMINATED returns it"]
