      - name: clock_set_endpoint_returns_the_new_instant
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          The clock endpoint echoes the instant it was given, normalised to millisecond
          precision, and is explicitly allowed to move backwards: setting 2026-05-01 then
          2026-01-05 both return 200 and the second value governs later temporal comparisons
          without rewriting stored rows.
        test_recipe:
          setup:
            - "Nothing beyond a running server; the boot clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T12:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Papa Two", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - "HTTP status is 200 and the body is { current_utc: \"2026-01-05T09:00:00.000Z\" }"
            - "the plan created under the later clock still carries created_at == \"2026-05-01T12:00:00.000Z\"; moving the clock backwards rewrites nothing"
            - "EquityPlan.${plan_id}.version is still 1"

      - name: approval_authority_revoke_is_conditional_action
        claim_type: conditional_action
        grounds:
          - endpoints[POST /approval-authorities/{id}/revoke]
          - state_machines.ApprovalAuthority.ACTIVE_to_REVOKED
          - validations[priority=40]
          - errors[ERR_AUTHORITY_INVALID_STATE]
        distinguishing_aspect: |
          Revocation freezes rather than unwinds: the grant already approved under the
          delegation stays APPROVED with its approved_under_authority_id intact,
          consumed_shares and remaining_shares are frozen at 3000/7000, the next DELEGATED
          approval is refused, and a second revoke of the same REVOKED row is refused with
          ERR_AUTHORITY_INVALID_STATE.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan; ApprovalAuthority to officer-1 effective 2026-01-01..2026-12-31 with per_grant_share_cap 5000 and aggregate_share_cap 10000."
            - "Grant 1 (NSO 3000) approved under the delegation; Grant 2 (NSO 1000) left in PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
