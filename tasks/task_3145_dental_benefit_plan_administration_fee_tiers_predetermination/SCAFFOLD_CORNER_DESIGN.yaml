        claim_type: violation_to_error
        grounds:
          - validations[priority=11.5]
          - errors.ERR_NO_FEE_SCHEDULE
        distinguishing_aspect: "The schedule is ACTIVE for the provider's tier but has no entry for cdt_code D9999 — claim creation fails 422 ERR_NO_FEE_SCHEDULE rather than silently pricing at zero."
        test_recipe:
