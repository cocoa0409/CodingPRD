  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sit_periods_are_inclusive_and_need_a_one_day_gap
        grounds:
          - validations[priority=40]
          - errors.ERR_SIT_PERIOD_OVERLAP
          - entities.SitAuthorization.fields.entry_date
          - state_machines.SitAuthorization.REQUESTED_to_AUTHORIZED
        distinguishing_aspect: >-
          Resource = one Shipment's storage-in-transit calendar, interval semantics = CLOSED on both
          ends PLUS a mandatory one-day gap. The first period [2026-09-16, 2026-09-26] makes a second
          period starting 2026-09-27 illegal (it touches with a zero gap) while 2026-09-28 is legal —
          a half-open reading would wrongly accept 2026-09-27, and a naive "no strict overlap"
          reading would wrongly accept 2026-09-26.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z; shipment awarded, packed, weighed, picked up 2026-08-17."
            - "SIT #1 requested for 10 days from 2026-09-16 (range [2026-09-16, 2026-09-26]) and AUTHORIZED, so it is non-RELEASED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/service-members"
              payload: { dod_id: "1000001606", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-2296-0020", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
            - call: "POST /hhg/counseling-sessions"
              payload: { order_id: "${o_id}", session_type: "IN_PERSON", scheduled_at: "2026-08-05T00:00:00Z" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { cs_id: $.data.id }
            - call: "POST /hhg/counseling-sessions/${cs_id}/complete"
              payload: { entitlement_briefed: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/counseling-sessions/${cs_id}/entitlements"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_id: "$.data[0].id" }
            - call: "POST /hhg/entitlements/${ent_id}/authorize"
              payload: { admin_weight_bump_lbs: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v: $.data.version }
            - call: "POST /hhg/tsps"
              payload: { name: "Chesapeake Van Lines", scac_code: "CVLQ", markets: ["MKT-BWI"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-0020", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s_id: $.data.id }
            - call: "POST /hhg/shipments/${s_id}/survey"
              payload: { estimate_method: "CUBE_X7", room_estimates: [{ room_name: "KITCHEN", cube_feet: 143.5 }, { room_name: "LIVING_ROOM", cube_feet: 268.25 }, { room_name: "MASTER_BEDROOM", cube_feet: 210.5 }, { room_name: "GARAGE", cube_feet: 96.75 }] }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-BWI", week_start_date: "2026-08-17T00:00:00Z", total_capacity_lbs: 12000, short_notice_reserve_pct: 0.15 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb_id: $.data.id, cb_v: $.data.version }
            - call: "POST /hhg/capacity-blocks/${cb_id}/awards"
              payload: { shipment_id: "${s_id}", expected_capacity_block_version: "${cb_v}" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s_id}/pack"
              payload: { pack_date: "2026-08-15T00:00:00Z" }
              as: TspCoordinator
