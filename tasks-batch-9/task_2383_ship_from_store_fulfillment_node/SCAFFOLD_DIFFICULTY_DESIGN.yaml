            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
              captures: { run0: "$.data.id" }
            - call: "GET /fulfillment-network/routing-candidates"
              payload: { routing_run_id: "${run0}" }
              as: NetworkPlanner
              captures: { cand0: "$.data[0].id" }
            - call: "POST /fulfillment-network/store-inventories/${inv1}/adjustments"
              payload: { expected_inventory_version: "${inv1_v}", counted_on_hand_units: 5, reason: "CYCLE_COUNT", safety_stock_units: 4 }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v2: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v2}" }
              as: NetworkPlanner
