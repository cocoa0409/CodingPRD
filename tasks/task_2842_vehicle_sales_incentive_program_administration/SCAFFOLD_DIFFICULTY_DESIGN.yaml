            - "A StackabilityConstraint row joining them with mode CAPPED_TOTAL and cap_amount_cents 400000, which also clears validations[priority=12] even though the incentive_types already differ."
            - "Dealer D-850, ACTIVE, region EAST."
            - "Delivery ON: msrp_cents 3750000, LEASE, term 36, base_residual_bps 5200, sale_date 2026-08-09; lease leg == round_half_up(3750000 * 400 / 10000) == 150000, so gross == 250000."
