            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /outages", payload: { service_area_id: "${a_id}", started_at: "2026-06-01T00:00:00Z", severity: "PARTIAL" }, as: NocOperator, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /outages", payload: { service_area_id: "${a_id}", started_at: "2026-06-01T00:30:00Z", severity: "PARTIAL" }, as: NocOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_OUTAGE_OVERLAP (409)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: device_inventory_count_conservation
        grounds:
          - state_machines.Device.IN_STOCK_to_ASSIGNED
          - state_machines.Device.ASSIGNED_to_IN_STOCK
          - entities.Device.fields.status
        distinguishing_aspect: "Conserved quantity = device count: assign (IN_STOCK->ASSIGNED) then return (ASSIGNED->IN_STOCK) leaves |IN_STOCK|+|ASSIGNED|+|DEPLOYED|+|RETURNED| == 3 unchanged and device1 back in IN_STOCK with subscription_id null."
        test_recipe:
          setup:
            - "3 devices created (all IN_STOCK); a subscription; device1 assigned to it."
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /devices", payload: { device_class: "CPE_MODEM", model: "M1", serial_number: "SN-1", value_cents: 5000 }, as: Dispatcher, captures: { d1: "$.data.id" } }
            - { call: "POST /devices", payload: { device_class: "CPE_MODEM", model: "M1", serial_number: "SN-2", value_cents: 5000 }, as: Dispatcher, captures: { d2: "$.data.id" } }
            - { call: "POST /devices", payload: { device_class: "CPE_MODEM", model: "M1", serial_number: "SN-3", value_cents: 5000 }, as: Dispatcher, captures: { d3: "$.data.id" } }
            - { call: "POST /devices/${d1}/assign", payload: { subscription_id: "${sub_id}" }, as: Dispatcher }
          trigger:
            - { call: "POST /devices/${d1}/return", payload: {}, as: Dispatcher }
          assert:
            - "Device.${d1}.status == IN_STOCK"
            - "Device.${d1}.subscription_id == null"
            - "count of devices across {IN_STOCK, ASSIGNED, DEPLOYED, RETURNED} == 3 (unchanged); all 3 IN_STOCK"

      - name: grant_funds_money_conservation
        grounds:
          - state_machines.GrantClaim.DRAFT_to_SUBMITTED
          - state_machines.GrantClaim.SUBMITTED_to_REJECTED
          - entities.Grant.fields.available_balance_cents
        distinguishing_aspect: "Conserved quantity = grant money: submit commits 1000 (available 1000000->999000), reject releases it (available back to 1000000); invariant award == available + committed + disbursed holds throughout."
        test_recipe:
          setup:
            - "Grant award=1000000; one ACTIVE subsidized subscriber (amount_claimed=1000); claim created and submitted (committed=1000, available=999000)."
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 1000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subsidy-programs", payload: { name: "Digital Equity Credit", monthly_discount_cents: 3000, device_benefit_cents: 12000, eligibility_fpl_pct: 200 }, as: ProgramAdmin, captures: { sp_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec", region: "North" }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub_id}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
            - { call: "POST /install-orders/${io_id}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub_id}/activate", payload: {}, as: CustomerCare }
            - { call: "POST /enrollments", payload: { subscriber_id: "${s_id}", subsidy_program_id: "${sp_id}", household_size: 2, annual_income_cents: 3000000 }, as: EligibilityWorker, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/verify", payload: {}, as: EligibilityWorker }
            - { call: "POST /grants/${g_id}/claims", payload: { claim_period_start: "2026-06-01T00:00:00Z", claim_period_end: "2026-07-01T00:00:00Z", service_area_ids: ["${a_id}"], expected_grant_version: "${g_v}" }, as: ComplianceAnalyst, captures: { c_id: "$.data.id" } }
            - { call: "POST /grant-claims/${c_id}/submit", payload: {}, as: ComplianceAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /grant-claims/${c_id}/reject", payload: { reason: "insufficient documentation" }, as: ComplianceOfficer, as_user_id: "officer-1" }
          assert:
            - "GrantClaim.${c_id}.status == REJECTED"
            - "Grant.${g_id}.committed_balance_cents == 0"
            - "Grant.${g_id}.disbursed_balance_cents == 0"
            - "Grant.${g_id}.available_balance_cents == 1000000"
            - "award(1000000) == available + committed + disbursed throughout"
