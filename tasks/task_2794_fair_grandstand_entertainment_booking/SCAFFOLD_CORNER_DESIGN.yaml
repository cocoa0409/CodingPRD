            - "The identical payload with the re-read version returns HTTP 201, so the refusal was purely a staleness decision."
            - "The second activation echoing the pre-activation version returns HTTP 412 with ${err_o2} == ERR_STALE_SHOW_BOOKING_VERSION -- the first activation's own version bump is what invalidated it."
