      - name: director_nomination_requires_qualified_role_title_and_current_competency
        claim_type: cross_entity_validation
        grounds:
          - validations[priority:64]
          - errors[ERR_DIRECTOR_NOT_QUALIFIED]
          - endpoints[PATCH /poct/sites/{id}/director]
        distinguishing_aspect: |
          The rule has two conjuncts and each is falsified separately: a trained
          MEDICAL_ASSISTANT (competency fine, role_title ineligible) is refused,
          an untrained PHYSICIAN (role_title fine, competency PENDING) is refused
          with the SAME error id, and only the trained PHYSICIAN is accepted.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One site with no director; a trained MEDICAL_ASSISTANT (PROVISIONAL x ACTIVE) and an untrained PHYSICIAN (PENDING x LOCKED_OUT)."
            - "PATCH /poct/sites/{id}/director has no certificate or posture precondition, so no coverage row is required."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/sites"
              payload: { name: "Student Health POCT", department_code: "DEPT-2400", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Uma Fields", role_title: "MEDICAL_ASSISTANT", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_ma: $.data.id }
            - call: "POST /poct/operators/${op_ma}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
              captures: { ma_comp: $.data.competency_status }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Dr. Val Ibarra", role_title: "PHYSICIAN", hire_date: "2026-01-06" }
              as: ProgramAdmin
              captures: { op_phys: $.data.id, phys_comp: $.data.competency_status }
          trigger:
            - call: "PATCH /poct/sites/${site_id}/director"
              payload: { lab_director_operator_id: "${op_ma}" }
              as: ProgramAdmin
              captures: { err_role: $.data.error_id, msg_role: $.data.message }
            - call: "PATCH /poct/sites/${site_id}/director"
              payload: { lab_director_operator_id: "${op_phys}" }
              as: ProgramAdmin
              captures: { err_comp: $.data.error_id, msg_comp: $.data.message }
            - call: "POST /poct/operators/${op_phys}/training"
              payload: { training_module_code: "POCT-DIRECTOR-101", completed_on: "2026-08-25" }
              as: QualityCoordinator
              captures: { phys_comp_after: $.data.competency_status }
            - call: "PATCH /poct/sites/${site_id}/director"
              payload: { lab_director_operator_id: "${op_phys}" }
              as: ProgramAdmin
              captures: { director_after: $.data.lab_director_operator_id }
          assert:
            - "${ma_comp} == \"PROVISIONAL\" and ${phys_comp} == \"PENDING\""
            - "the first PATCH returns HTTP 422 with ${err_role} == \"ERR_DIRECTOR_NOT_QUALIFIED\" (role_title MEDICAL_ASSISTANT is not in {PHYSICIAN, DOCTORAL_SCIENTIST, MIDLEVEL_PRACTITIONER})"
            - "the second PATCH returns HTTP 422 with ${err_comp} == \"ERR_DIRECTOR_NOT_QUALIFIED\" (competency_status PENDING is not in {PROVISIONAL, COMPETENT})"
            - "${phys_comp_after} == \"PROVISIONAL\""
            - "the third PATCH returns HTTP 200 with ${director_after} == ${op_phys}"
            - "TestSite.${site_id}.lab_director_operator_id == ${op_phys} and the two refused attempts left it null"

      - name: result_capture_after_qc_next_due_returns_qc_overdue
        claim_type: temporal_validation
        grounds:
          - validations[priority:55]
          - errors[ERR_QC_OVERDUE]
          - entities.Device.fields.qc_next_due_at
        distinguishing_aspect: |
          Priority 55 compares the clock to qc_next_due_at, NOT to device.status:
          the device is still ACTIVE (no oversight run has locked it), the lot is
          VERIFIED and the operator is fine, yet the result is refused 422 because
          2026-08-03 > qc_next_due_at 2026-08-02.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T08:00:00Z at build time."
            - "Covered WAIVED site, trained operator, device GLUCO-9 with qc_frequency_days 1; LEVEL_1 and LEVEL_2 PASS runs on 2026-08-01 set last_two_level_qc_pass_on 2026-08-01 and qc_next_due_at 2026-08-02; the lot is VERIFIED from those two runs."
            - "The clock is then advanced to 2026-08-03T09:00:00Z with NO oversight run, so the device is still ACTIVE."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243032", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Renal Clinic POCT", department_code: "DEPT-2500", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Wes Nakamura", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-07-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-2500", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 1 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
