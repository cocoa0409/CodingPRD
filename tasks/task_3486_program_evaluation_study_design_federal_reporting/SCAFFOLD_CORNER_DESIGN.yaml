              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/design-plans/${plan_id}/agency-decision"
              payload: { decision: "APPROVED" }
              as: AgencyOfficer
              as_user_id: "ao-1"
            - call: "POST /evaluation/studies/${study_id}/analysis-plans"
              payload: { primary_outcomes: ["employment_q4", "earnings_q4"], secondary_outcomes: ["job_retention"] }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
