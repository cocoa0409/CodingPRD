            - { call: "POST /plant/routes", payload: { route_code: "R-P1", route_date: "2026-08-05", region: "TX-SOUTH", vehicle_capacity_cases: 100 }, as: RouteDispatcher, captures: { route_id: "$.data.id", rv1: "$.data.version" } }
            - { call: "POST /plant/routes/${route_id}/stops", payload: { customer_id: "${cust_id}", pack_order_id: "${po_id}", requested_cases: 10, expected_route_version: "${rv1}" }, as: RouteDispatcher }
