# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1240: Christmas Tree Farm & Wholesale Program
# Nine Difficulty Rules x two instances each. Every chain replays from empty-DB
# using only §1.5 endpoints. Canonical season fixture used across instances:
#   booking  2026-06-01T00:00:00Z .. 2026-08-31T23:59:59Z
#   harvest  2026-11-01 .. 2026-11-25 (dates, inclusive)
#   shipping 2026-11-15T00:00:00Z .. 2026-12-10T23:59:59Z (inclusive end)
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: consignment_provisional_vs_final_settlement
        grounds:
          - calculations.consignment_settlement
          - entities.Consignment.fields.provisional_settlement_cents
          - entities.Consignment.fields.final_settlement_cents
        distinguishing_aspect: |
          Same delivery data, two valid settlement algorithms on the Consignment
          MONEY domain: provisional (assumes worst-case returns at max_return_pct,
          computed at deliver) yields 16473 while final (actual returns, computed
          at settle) yields 20965.
        test_recipe:
          setup:
            - "Season in BOOKING->HARVEST->SHIPPING->SETTLEMENT progression; lot with H_7_8 bucket standing 200"
            - "Consignment: quantity 10, unit_price_cents 2995, max_return_pct 0.45, delivered_count 10, returned_count 3"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 0, H_7_8: 200, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}/stand-buckets", payload: {}, as: FarmManager, captures: { b78: "$.data[3].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/consignments", payload: { season_id: "${s}", bucket_id: "${b78}", lot_name: "Lot 9 Partners", quantity: 10, unit_price_cents: 2995, max_return_pct: 0.45 }, as: FarmManager, captures: { cons: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/consignments/${cons}/deliver", payload: { delivered_count: 10 }, as: FarmManager, captures: { prov: $.data.provisional_settlement_cents } }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "SHIPPING" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "SETTLEMENT" }, as: Owner }
            - { call: "POST /api/consignments/${cons}/report-return", payload: { returned_count: 3 }, as: FarmManager }
          trigger:
            - { call: "POST /api/consignments/${cons}/settle", payload: {}, as: FarmManager, captures: { fin: $.data.final_settlement_cents } }
          assert:
            - "Consignment.${cons}.provisional_settlement_cents == 16473  (round_half_up(10*2995*0.55) = round_half_up(16472.5))"
            - "Consignment.${cons}.final_settlement_cents == 20965  (round_half_up((10-3)*2995))"
            - "provisional != final for identical delivery data (16473 != 20965)"
            - "Consignment.${cons}.status == SETTLED"

      - name: book_stock_vs_survey_stock_shrink
        grounds:
          - calculations.inventory_book_vs_survey
          - entities.StandBucket.fields.last_shrink_delta
        distinguishing_aspect: |
          Same physical bucket, two valid standings on the INVENTORY domain:
          ledger book stock (baseline minus recorded deltas) reads 260 while the
          physical survey reads 250; posting records shrink_delta -10 and adopts
          the survey as new baseline.
        test_recipe:
          setup:
            - "Season advanced to HARVEST; lot H_6_7 bucket baseline 300; order for 30 allocated and fully cut; cull of 10 recorded"
            - "Book stock before survey post: 300 - 10 (cull) - 30 (cut) = 260"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 300, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}/stand-buckets", payload: {}, as: FarmManager, captures: { b67: "$.data[2].id" } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 30, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 30, expected_order_version: "${ov}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${ord}", payload: {}, as: FarmManager, captures: { alc: "$.data[0].id" } }
            - { call: "POST /api/cull-records", payload: { bucket_id: "${b67}", count: 10, reason: "DISEASE" }, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/crews", payload: { season_id: "${s}", crew_code: "C-1", size: 5 }, as: FarmManager, captures: { crw: $.data.id } }
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-05", hours_worked: 8, lines: [ { allocation_id: "${alc}", cut_count: 30 } ] }, as: CrewLead, as_user_id: "${crw}" }
            - { call: "POST /api/surveys", payload: { crop_lot_id: "${lot}", surveyed_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 250, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { srv: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}", payload: {}, as: FarmManager, captures: { lotv: $.data.version } }
          trigger:
            - { call: "POST /api/surveys/${srv}/post", payload: { expected_crop_lot_version: "${lotv}" }, as: FarmManager }
          assert:
            - "pre-post book stock was 260 while survey_stock was 250 — two valid standings diverge for the same bucket"
            - "StandBucket H_6_7.last_shrink_delta == -10  (250 - 260)"
            - "StandBucket H_6_7.baseline_count == 250 and standing_count == 250 after post"
            - "StandBucket H_6_7.cut_cumulative == 0 and culled_cumulative == 0 after post (epoch reset)"
            - "InventorySurvey.${srv}.status == POSTED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: crew_pay_max_piece_vs_hourly_floor
        grounds:
          - calculations.crew_ticket_pay
          - entities.HarvestTicket.fields.gross_pay_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs (per-line cut counts keyed by
          height-class rate table, crew size, hours, minimum wage) with non-linear
          max(piece, floor) interaction; here the floor wins (41500 vs 60000).
        test_recipe:
          setup:
            - "Season in HARVEST; block HARVESTABLE; lot with H_6_7=200, H_7_8=100; order A (100x H_6_7) and order B (50x H_7_8) fully allocated"
            - "Crew of 5 works 8 hours; ticket cuts 100x H_6_7 and 50x H_7_8"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 200, H_7_8: 100, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 100, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { oa: $.data.id } }
            - { call: "POST /api/wholesale-orders/${oa}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { oav: $.data.version } }
            - { call: "POST /api/wholesale-orders/${oa}/allocate", payload: { quantity: 100, expected_order_version: "${oav}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${oa}", payload: {}, as: FarmManager, captures: { ala: "$.data[0].id" } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_7_8", quantity: 50, unit_price_cents: 500 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ob: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ob}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { obv: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ob}/allocate", payload: { quantity: 50, expected_order_version: "${obv}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${ob}", payload: {}, as: FarmManager, captures: { alb: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/crews", payload: { season_id: "${s}", crew_code: "C-1", size: 5 }, as: FarmManager, captures: { crw: $.data.id } }
          trigger:
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-05", hours_worked: 8, lines: [ { allocation_id: "${ala}", cut_count: 100 }, { allocation_id: "${alb}", cut_count: 50 } ] }, as: CrewLead, as_user_id: "${crw}", captures: { tkt: $.data.id } }
          assert:
            - "HarvestTicket.${tkt}.piece_total_cents == 41500  (100*260 + 50*310)"
            - "HarvestTicket.${tkt}.hourly_floor_cents == 60000  (5 * 8 * 1500)"
            - "HarvestTicket.${tkt}.gross_pay_cents == 60000  (max(41500, 60000))"
            - "HarvestTicket.${tkt}.pay_basis == HOURLY_FLOOR"

      - name: order_invoice_tier_discount_rounding_order
        grounds:
          - calculations.order_invoice
          - entities.WholesaleOrder.fields.invoice_discount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: discount must be computed from the rounded
          subtotal, half-up — round_half_up(109250*0.05)=5463, whereas the
          forbidden order round_half_up(250*437*0.95)=103788 changes the total by
          one cent; the scaffold pins the former.
        test_recipe:
          setup:
            - "Season in BOOKING; buyer with ample credit; order quantity 250 at 437 cents lands in the 200+ tier (5%)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "DOUGLAS_FIR", height_class: "H_6_7", quantity: 250, unit_price_cents: 437 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
          assert:
            - "WholesaleOrder.${ord}.invoice_subtotal_cents == 109250  (250*437)"
            - "WholesaleOrder.${ord}.discount_pct_applied == 0.05  (250 >= 200, inclusive)"
            - "WholesaleOrder.${ord}.invoice_discount_cents == 5463  (round_half_up(109250*0.05) = round_half_up(5462.5))"
            - "WholesaleOrder.${ord}.invoice_total_cents == 103787  (109250 - 5463; NOT 103788 from rounding the discounted product)"
            - "WholesaleOrder.${ord}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: block_rotation_full_cycle_replant
        grounds:
          - state_machines.Block.HARVESTED_to_RESTING
          - state_machines.Block.RESTING_to_PLANTED
        distinguishing_aspect: |
          Block follows a cyclic rotation RESTING->PLANTED->GROWING->HARVESTABLE
          ->HARVESTED->RESTING and re-enters PLANTED with a successor lot — not a
          linear pipeline; the second PLANTED proves the loop.
        test_recipe:
          setup:
            - "Season exists (no posture change needed); block with a lot of 300x H_6_7; all 300 culled so the lot auto-depletes"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 300, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}/stand-buckets", payload: {}, as: FarmManager, captures: { b67: "$.data[2].id" } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager, captures: { st1: $.data.rotation_state } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager, captures: { st2: $.data.rotation_state } }
            - { call: "POST /api/cull-records", payload: { bucket_id: "${b67}", count: 300, reason: "GRADING" }, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager, captures: { st3: $.data.rotation_state } }
          trigger:
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager, captures: { st4: $.data.rotation_state } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "GRAND_FIR", planted_year: 2027, initial_counts: { H_4_5: 400, H_5_6: 0, H_6_7: 0, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot2: $.data.id } }
          assert:
            - "rotation sequence observed: ${st1} == GROWING, ${st2} == HARVESTABLE, ${st3} == HARVESTED, ${st4} == RESTING"
            - "CropLot.${lot}.status == DEPLETED after the 300-cull (auto-transition)"
            - "second planting on the same block succeeds (cycle restart): CropLot.${lot2}.status == ACTIVE"
            - "Block.${blk}.rotation_state == PLANTED after the second lot create"

      - name: order_submitted_allocated_regression_loop
        grounds:
          - state_machines.WholesaleOrder.ALLOCATED_to_SUBMITTED
          - state_machines.WholesaleOrder.SUBMITTED_to_ALLOCATED
        distinguishing_aspect: |
          WholesaleOrder cycles SUBMITTED->ALLOCATED->SUBMITTED->ALLOCATED as
          allocations are created and released — a revision loop on the order
          entity, distinct from the Block rotation cycle.
        test_recipe:
          setup:
            - "Season in BOOKING; lot H_6_7 standing 300; buyer; order qty 100 fully allocated (ALLOCATED), then its allocation released"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 300, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 100, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov1: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 100, expected_order_version: "${ov1}" }, as: FarmManager, captures: { st_alloc: $.data.order_status } }
            - { call: "GET /api/allocations?order_id=${ord}", payload: {}, as: FarmManager, captures: { alc: "$.data[0].id" } }
            - { call: "POST /api/allocations/${alc}/release", payload: {}, as: FarmManager }
            - { call: "GET /api/wholesale-orders/${ord}", payload: {}, as: FarmManager, captures: { ov2: $.data.version, st_mid: $.data.status } }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 100, expected_order_version: "${ov2}" }, as: FarmManager, captures: { st_final: $.data.order_status } }
          assert:
            - "after full allocation: ${st_alloc} == ALLOCATED"
            - "after release: ${st_mid} == SUBMITTED and allocated_qty == 0 (regression ALLOCATED -> SUBMITTED)"
            - "after re-allocation: ${st_final} == ALLOCATED — the loop closed twice"
            - "StandBucket H_6_7 reserved_count == 100 at the end (re-reserved)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: survey_post_overreservation_sweep_cascade
        grounds:
          - calculations.over_reservation_sweep
          - state_machines.Allocation.RESERVED_to_RELEASED
          - state_machines.WholesaleOrder.ALLOCATED_to_SUBMITTED
        distinguishing_aspect: |
          Depth-3 chain from the survey-post trigger: survey re-baselines the
          bucket (standing 300 -> 50), the bucket's over-reservation sweep then
          releases whole allocations youngest-first, and each release regresses
          its order ALLOCATED -> SUBMITTED. Distinct trigger from the run-ops
          backfill cascade.
        test_recipe:
          setup:
            - "Season in BOOKING; lot H_6_7 standing 300; order A (60 trees, allocated first) and order B (40 trees, allocated second), both ALLOCATED; bucket reserved 100"
          setup_api_calls:
