  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: subscription_coverage_boundary_third_visit_billable
        grounds:
          - calculations.subscription_coverage_resolution
          - entities.Subscription.fields.used_cleanings
        distinguishing_aspect: |
          Metric = integer usage counter on POST /coopcare/service-visits: with
          included_cleanings_per_period == 2 the boundary is strict less-than —
          visits 1 and 2 resolve SUBSCRIPTION_COVERED, and the third visit at
          used == included resolves BILLABLE (>= does NOT cover).
        test_recipe:
          setup:
            - "URBAN household; plan included_cleanings_per_period=2; subscription ACTIVE (period 2026-05-01 -> 2026-06-01)"
            - "Coop INSTALLED via SETUP_INSTALL visit"
          setup_api_calls:
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "BND2", monthly_fee_cents: 2900, included_cleanings_per_period: 2, included_health_checks_per_period: 0, supply_discount_pct: 0, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /coopcare/households"
              payload: { name: "H Bnd", email: "hbnd@x.com", address: "10 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/subscriptions"
              payload: { household_id: "${hh_id}", plan_id: "${plan_id}", current_period_start: "2026-05-01T00:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 6 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_install: $.data.id }
            - call: "POST /coopcare/service-visits/${v_install}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_install}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_install}/complete"
              payload: { observed_flock_size: 6, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "COOP_CLEANING", scheduled_start: "2026-05-10T09:00:00Z", scheduled_end: "2026-05-10T10:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v1: $.data.id, c1: $.data.coverage }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "COOP_CLEANING", scheduled_start: "2026-05-12T09:00:00Z", scheduled_end: "2026-05-12T10:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v2: $.data.id, c2: $.data.coverage }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "COOP_CLEANING", scheduled_start: "2026-05-14T09:00:00Z", scheduled_end: "2026-05-14T10:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v3: $.data.id, c3: $.data.coverage }
            - call: "GET /coopcare/subscriptions/${sub_id}"
              as: BillingAdmin
              captures: { used: $.data.used_cleanings }
          assert:
            - "ServiceVisit.${v1}.coverage == SUBSCRIPTION_COVERED (used 0 < 2 at creation)"
            - "ServiceVisit.${v2}.coverage == SUBSCRIPTION_COVERED (used 1 < 2 at creation)"
            - "ServiceVisit.${v3}.coverage == BILLABLE (used 2 == included 2: strict less-than fails at equality)"
            - "Subscription.${sub_id}.used_cleanings == 2"

      - name: cancellation_notice_exactly_72h_zero_fee
        grounds:
          - calculations.sitting_cancellation_fee
          - entities.SittingEngagement.fields.cancellation_fee_cents
        distinguishing_aspect: |
          Metric = fractional notice hours on POST /coopcare/sitting-engagements/
          {id}/cancel (different metric and endpoint from the coverage counter):
          at exactly 72.0 hours notice the >= boundary makes the fee 0, while 71h
          notice (corner companion) falls into the 25% tier.
        test_recipe:
          setup:
            - "URBAN household with INSTALLED grade-B coop; no subscription (sitting discount 0)"
            - "PUBLISHED URBAN route on 2026-08-01; engagement 2026-08-01 -> 2026-08-02 CONFIRMED, quoted_price_cents == 5000"
            - "Logical clock advanced to 2026-07-29T00:00:00Z (exactly 72.0 hours before start_date 2026-08-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /coopcare/households"
