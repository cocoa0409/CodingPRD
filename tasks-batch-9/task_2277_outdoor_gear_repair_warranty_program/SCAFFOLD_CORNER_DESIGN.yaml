            - "first trigger: HTTP 201 with expedite_requested == true, promised_days == 15, promised_return_at == 2026-06-30T23:59:59.999Z, surge_multiplier_applied == 1.00, parts_wait_days == 0 (the expedite flag buys no schedule relief)"
            - "second trigger: RepairEstimate.${est_id}.variant == PROVISIONAL with labor_subtotal_cents == 5542, parts_subtotal_cents == 1800, shop_supply_fee_cents == 388, subtotal_cents == 7730, loyalty_discount_cents == 773, expedite_fee_cents == 0, tax_cents == 574, total_cents == 7531 and valid_until == 2026-06-22T09:00:00Z"
            - "last trigger: RepairEstimate.${inv_id}.variant == FINAL with labor_subtotal_cents == 6333, parts_subtotal_cents == 1800, shop_supply_fee_cents == 443, subtotal_cents == 8576, loyalty_discount_cents == 858, expedite_fee_cents == 3500, tax_cents == 925, total_cents == 12143"
            - "RepairOrder.${ro_id}.provisional_estimate_total_cents == 7531 and final_invoice_total_cents == 12143 (a 4612-cent spread, 3500 of it the expedite fee)"

      - name: surge_window_creation_raises_the_center_multiplier_only_while_covering_now
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /gear-service/service-centers/{id}/surge-windows]
          - entities.ServiceCenter.fields.current_surge_multiplier
          - calculations.turnaround_commitment.formula
        distinguishing_aspect: "current_surge_multiplier is max(queue tier, covering ACTIVE window): the June window lifts an empty queue from 1.00 to 1.60, while a strictly past May window is created ACTIVE yet contributes nothing because 2026-06-15 falls outside its closed interval — a naive max over all ACTIVE rows would report 2.00."
        test_recipe:
          setup:
            - "clock 2026-06-15T09:00:00Z; one center with an empty queue (active_queue_depth 0, tier multiplier 1.00)"
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
          trigger:
            - call: "POST /gear-service/service-centers/${sc_id}/surge-windows"
              payload: { label: "June repair rush", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z", multiplier: 1.60 }
              as: ProgramAdmin
              captures: { sw_june_id: $.data.id }
            - call: "GET /gear-service/service-centers/${sc_id}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers/${sc_id}/surge-windows"
              payload: { label: "May clearance surge", start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-31T23:59:59Z", multiplier: 2.00 }
              as: ProgramAdmin
              captures: { sw_may_id: $.data.id }
            - call: "GET /gear-service/service-centers/${sc_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /gear-service/service-centers/${sc_id}/surge-windows?status=ACTIVE"
              payload: {}
              as: ProgramAdmin
          assert:
            - "first trigger: HTTP 201 with service_center_id == ${sc_id}, label == June repair rush, multiplier == 1.60, status == ACTIVE"
            - "second trigger: current_surge_multiplier == 1.60, active_queue_depth == 0, last_queue_review_at == null, liability_posture == OPEN"
            - "third trigger: HTTP 201 with status == ACTIVE (creation never back-dates a window to RETIRED; only a queue-review does)"
            - "fourth trigger: current_surge_multiplier is still 1.60, NOT 2.00 — the May window does not cover the clock instant"
            - "fifth trigger: HTTP 200 with total_count == 2 and both ${sw_june_id} and ${sw_may_id} present"

      - name: excluded_work_block_cancel_action_endpoint
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: work_block_cancel_restores_technician_minutes
          rationale: "POST /work-blocks/{id}/cancel — the transition, its CANCELLED terminal row and the exact restoration of Technician.scheduled_minutes_open and the center's bench-capacity headroom — is asserted end-to-end by that §1.8 compensating_invariant instance."

      - name: excluded_parts_reservation_release_action_endpoint
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: parts_reservation_release_restores_lot_units
          rationale: "POST /parts-reservations/{id}/release with its lot-side reserved_units / available_units / status restoration is that §1.8 instance's entire subject."

  - section: errors
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "Priority 1 runs before every other rule, so a headerless request to a real resource is 401 (never 200), and a blank X-User-ID is treated as absent rather than falling through to the priority 3 actor lookup."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one service center exists"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
          trigger:
            - call: "GET /gear-service/service-centers/${sc_id}"
              payload: {}
              as: "(request sent with no X-User-Role and no X-User-ID header)"
            - call: "GET /gear-service/service-centers/${sc_id}"
              payload: {}
              as: ServiceAgent
              as_user_id: "(blank X-User-ID header)"
          assert:
            - "first trigger: HTTP 401 with error_id == ERR_MISSING_AUTH_HEADERS and a data object carrying only error_id and message"
            - "second trigger: HTTP 401 with error_id == ERR_MISSING_AUTH_HEADERS — a present-but-blank X-User-ID counts as absent, so priority 1 owns it and priority 3 never runs"
            - "no ServiceCenter field changes: version is unchanged from the setup response and open_liability_cents == 0"

      - name: unrecognized_role_header_is_invalid_role_before_any_lookup
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_INVALID_ROLE]
        distinguishing_aspect: "Priority 2 outranks the priority 6 path-id check, so an unknown role addressing a non-existent center is 401 ERR_INVALID_ROLE, not 404 — the server must not leak whether the id exists."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one service center exists"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
          trigger:
            - call: "GET /gear-service/service-centers/${sc_id}"
              payload: {}
              as: GearWizard
            - call: "GET /gear-service/service-centers/00000000-0000-4000-8000-0000000009ff"
              payload: {}
              as: GearWizard
          assert:
            - "first trigger: HTTP 401 with error_id == ERR_INVALID_ROLE (GearWizard is not one of the five §1.7 roles)"
            - "second trigger: HTTP 401 with error_id == ERR_INVALID_ROLE, NOT 404 ERR_SERVICE_CENTER_NOT_FOUND — priority 2 precedes priority 6"
            - "a well-formed control read of GET /gear-service/service-centers/${sc_id} as ServiceAgent returns HTTP 200"

      - name: unknown_actor_id_rejected_for_entity_backed_roles
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_UNKNOWN_ACTOR]
          - roles[Customer].identity
          - roles[RepairTechnician].identity
        distinguishing_aspect: "Priority 3 resolves X-User-ID against the role's own backing entity, so a real Customer id presented under the RepairTechnician role is still 401 ERR_UNKNOWN_ACTOR; opaque roles skip the check entirely, which the ProgramAdmin control call proves."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one center and one registered customer, no technicians at all"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /gear-service/customers/${cust_id}"
              payload: {}
              as: Customer
              as_user_id: "00000000-0000-4000-8000-0000000008ff"
            - call: "GET /gear-service/technicians?service_center_id=${sc_id}"
              payload: {}
              as: RepairTechnician
              as_user_id: "${cust_id}"
            - call: "GET /gear-service/customers/${cust_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "00000000-0000-4000-8000-0000000008ff"
          assert:
            - "first trigger: HTTP 401 with error_id == ERR_UNKNOWN_ACTOR (no Customer row with that id)"
            - "second trigger: HTTP 401 with error_id == ERR_UNKNOWN_ACTOR — the id resolves to a Customer, but RepairTechnician is backed by Technician"
            - "third trigger: HTTP 200 — ProgramAdmin is an opaque identity, so an unresolvable X-User-ID is irrelevant and the customer row is returned with full_name == Rowan Ives"

      - name: error_envelope_shape_is_uniform_across_rejected_requests
        claim_type: violation_to_error
        grounds:
          - response_envelope.error
          - errors[ERR_INVALID_PAGINATION]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_INVALID_CLAIM_STATE]
        distinguishing_aspect: "Every rejection — 401, 404, 409 and 422 alike — returns response_type \"error\" with data holding exactly error_id and message, and no partial entity payload leaks through on the 409."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one DRAFT warranty claim on a registered unit"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88213", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_id: $.data.id }
            - call: "POST /gear-service/warranty-claims"
              payload: { service_center_id: "${sc_id}", gear_item_id: "${item_id}", intake_kind: "WARRANTY_CLAIM", reported_defect_type: "SEAM_FAILURE", customer_narrative: "Floor seam split." }
              as: ServiceAgent
              captures: { claim_id: $.data.id }
          trigger:
            - call: "GET /gear-service/warranty-claims?limit=0"
              payload: {}
              as: ServiceAgent
            - call: "GET /gear-service/warranty-claims/00000000-0000-4000-8000-0000000007ff"
              payload: {}
              as: ServiceAgent
            - call: "POST /gear-service/warranty-claims/${claim_id}/resubmit"
              payload: { customer_narrative: "Adding photos." }
              as: ServiceAgent
            - call: "GET /gear-service/warranty-claims/${claim_id}"
              payload: {}
              as: GearWizard
          assert:
            - "first trigger: HTTP 422, response_type == error, data == { error_id: ERR_INVALID_PAGINATION, message: <non-empty string> } with no other keys"
            - "second trigger: HTTP 404, response_type == error, error_id == ERR_CLAIM_NOT_FOUND"
            - "third trigger: HTTP 409, response_type == error, error_id == ERR_INVALID_CLAIM_STATE (resubmit is legal only from INFO_REQUESTED), and the body carries no claim fields — no status, no version"
            - "fourth trigger: HTTP 401, response_type == error, error_id == ERR_INVALID_ROLE"
            - "every rejection carries meta.api_request_id and meta.api_request_timestamp, and WarrantyClaim.${claim_id}.status is still DRAFT with info_request_count == 0"

