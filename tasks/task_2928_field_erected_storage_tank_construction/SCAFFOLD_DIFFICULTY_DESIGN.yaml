      - name: coating_rework_loop_resets_and_is_uncapped
        grounds:
          - state_machines.CoatingApplication
          - entities.CoatingApplication.fields.rework_cycle_count
          - validations.priority_20
          - calculations.coating_dft_acceptance
        distinguishing_aspect: |
          A third entity with a third loop topology: CoatingApplication cycles
          PREP_ACCEPTED -> DFT_RECORDED -> REWORK_REQUIRED -> PREP_ACCEPTED with no cap
          at all, and every re-entry wipes the DFT aggregates back to their creation
          values instead of accumulating them. Contrast with the WeldSeam loop, which is
          capped at 2 and preserves its history.
        test_recipe:
          setup:
            - "One tank and one INTERNAL_LINING coating application with specified_min_dft_mils 10.0, SPOT_AVERAGE_80_120 acceptance and specified_prep_standard SSPC_SP10."
            - "The first cycle is driven all the way to a holiday failure so the loop is entered from DFT_RECORDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
