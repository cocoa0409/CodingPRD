              payload: { items: [ { scanned_barcode: "8110380000005001261231030", image_uri: "s3://z1.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-1" } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submission-lots/${lot_id}/finalize"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /submission-lots/${lot_id}/finalize"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "POST /retailers/${ret_id}/fraud-rescore"
              payload: { expected_retailer_version: "${rv}" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
