              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LIVE_MONITORING_BLOCKS_CANCEL"
            - "Device.${dev_j}.status == ACTIVE"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: agent_shift_half_open_overlap_zero_buffer
        grounds:
          - validations[priority=12]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.AgentShift.fields.starts_at
          - entities.AgentShift.fields.ends_at
        distinguishing_aspect: |
          AgentShift uses HALF-OPEN [start, end) intervals with ZERO buffer: a new shift
          [00:00, 12:00) for agent-3 that overlaps an existing [06:00, 18:00) is rejected,
          but an exactly-adjacent shift starting at the prior end is allowed. Resource =
          AgentShift.
        test_recipe:
          setup:
            - "Agent agent-3 has one SCHEDULED shift [2026-06-01T06:00Z, 2026-06-01T18:00Z). A second overlapping shift [2026-06-01T00:00Z, 2026-06-01T12:00Z) is attempted."
          setup_api_calls:
            - call: "POST /pers/agent-shifts"
              payload: { agent_user_id: "agent-3", starts_at: "2026-06-01T06:00:00Z", ends_at: "2026-06-01T18:00:00Z" }
              as: PlatformAdmin
              captures: { shift_1: $.data.id }
          trigger:
            - call: "POST /pers/agent-shifts"
              payload: { agent_user_id: "agent-3", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SHIFT_OVERLAP"

      - name: monitoring_hold_buffered_overlap_seven_day_gap
        grounds:
          - validations[priority=13]
          - errors[ERR_HOLD_OVERLAP]
          - entities.MonitoringHold.fields.starts_at
          - entities.MonitoringHold.fields.ends_at
        distinguishing_aspect: |
          MonitoringHold uses a 7-DAY BUFFER (distinct interval geometry from AgentShift's
          zero buffer, and a different resource entity): an existing hold ending 2026-06-10
          rejects a new hold starting 2026-06-13 (only 3 days gap < 7), even though the raw
          intervals do not overlap. Resource = MonitoringHold (a Device's holds).
        test_recipe:
          setup:
            - "ACTIVE BASIC contract + device with one SCHEDULED hold [2026-06-05, 2026-06-10). A new hold [2026-06-13, 2026-06-20) is attempted (gap 3 days < 7)."
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub K", email: "k@x.com", residence_address: "17 K St", phone: "555-0017" }
              as: PlatformAdmin
              captures: { sub_k: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_k}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_k: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_k}", serial_number: "SN-K1", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_k}"
              captures: { dev_k: $.data.id }
            - call: "POST /pers/devices/${dev_k}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_k}"
            - call: "POST /pers/devices/${dev_k}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_k}"
            - call: "POST /pers/contracts/${ctr_k}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/monitoring-holds"
              payload: { device_id: "${dev_k}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_k}"
              captures: { hold_1: $.data.id }
          trigger:
            - call: "POST /pers/monitoring-holds"
              payload: { device_id: "${dev_k}", starts_at: "2026-06-13T00:00:00Z", ends_at: "2026-06-20T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_k}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_HOLD_OVERLAP"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: open_alarm_count_conserved_across_resolve
        grounds:
          - entities.Device.fields.open_alarm_count
          - state_machines.AlarmEvent.AGENT_ASSIGNED_to_CONTACTING_SUBSCRIBER
          - state_machines.AlarmEvent.CONTACTING_SUBSCRIBER_to_RESOLVED_OK
        distinguishing_aspect: |
          Conserved quantity #1: Device.open_alarm_count. Forward action (raise alarm)
          increments it by 1; the compensating terminal action (resolve OK) decrements it
          by 1. INVARIANT pinned: after a raise+resolve cycle, Device.open_alarm_count
          equals its pre-cycle value (0). Quantity is an integer open-work counter.
        test_recipe:
          setup:
            - "ACTIVE BASIC contract + device (open_alarm_count 0); agent shift covering the window."
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub L", email: "l@x.com", residence_address: "18 L St", phone: "555-0018" }
              as: PlatformAdmin
              captures: { sub_l: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_l}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_l: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_l}", serial_number: "SN-L1", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_l}"
              captures: { dev_l: $.data.id }
            - call: "POST /pers/devices/${dev_l}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_l}"
            - call: "POST /pers/devices/${dev_l}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_l}"
            - call: "POST /pers/contracts/${ctr_l}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/agent-shifts"
              payload: { agent_user_id: "agent-4", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices/${dev_l}/alarms"
              payload: { signal_type: "MANUAL_BUTTON" }
              as: Subscriber
              as_user_id: "${sub_l}"
              captures: { alarm_l: $.data.id }
            - call: "POST /pers/alarms/${alarm_l}/assign"
              payload: {}
              as: CallCenterAgent
              as_user_id: "agent-4"
            - call: "POST /pers/alarms/${alarm_l}/dispatch-actions"
              payload: { action_type: "CALL_SUBSCRIBER", outcome: "ANSWERED" }
              as: CallCenterAgent
              as_user_id: "agent-4"
          trigger:
            - call: "POST /pers/alarms/${alarm_l}/dispatch-actions"
              payload: { action_type: "RESOLVE_OK", outcome: "CONFIRMED_OK" }
              as: CallCenterAgent
              as_user_id: "agent-4"
            - call: "GET /pers/devices/${dev_l}"
              payload: {}
              as: PlatformAdmin
              captures: { cnt: $.data.open_alarm_count }
          assert:
            - "AlarmEvent.${alarm_l}.status == RESOLVED_OK"
            - "Device.${dev_l}.open_alarm_count == 0"

      - name: contract_balance_net_etf_minus_refund_invariant
        grounds:
          - entities.Contract.fields.outstanding_balance_cents
          - entities.Contract.fields.etf_charged_cents
          - entities.Contract.fields.refund_cents
          - state_machines.Contract.SUSPENDED_to_CANCELLATION_REQUESTED
        distinguishing_aspect: |
          Conserved quantity #2 (a MONETARY balance, different from the integer alarm
          counter): outstanding_balance_cents MUST equal etf_charged_cents - refund_cents at
          cancellation. INVARIANT pinned as a formula over Contract fields. With ETF 20000
          and IMMEDIATE refund 2928, outstanding_balance_cents == 17072.
        test_recipe:
          setup:
            - "PLUS contract (ETF 20000, addon device) activated 2026-06-01, suspended, cancellation requested at 2026-06-15 (IMMEDIATE refund 2928)."
          setup_api_calls:
