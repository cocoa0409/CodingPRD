  - rule_id: priority_pair_validation_conflict
    instances:

      - name: operator_read_by_desk_role_returns_unauthorized_and_not_the_operator_not_found
        grounds:
          - validations[2].ERR_UNAUTHORIZED
          - validations[7].ERR_OPERATOR_NOT_FOUND
          - endpoints[GET /shore-excursions/operators/{operatorId}]
          - roles.ShoreExcursionDesk
        distinguishing_aspect: |
          Category pair auth (priority 2) versus existence (priority 7): both rules are violated by one
          request — a role outside the endpoint's list asks for an operator id that was never stored —
          and the 403 must win, so no 404 may leak the fact that the id is unknown.
        test_recipe:
          setup:
            - "No TourOperator row exists with id 00000000-0000-4000-8000-000000000000."
            - "ShoreExcursionDesk is not in the authorized roles of GET /shore-excursions/operators/{operatorId}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
          trigger:
            - call: "GET /shore-excursions/operators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403"
            - "data.error_id == ERR_UNAUTHORIZED"
            - "data.error_id != ERR_OPERATOR_NOT_FOUND"

      - name: excursion_create_with_invalid_price_tier_enum_rejects_before_the_missing_operator_lookup
        grounds:
          - validations[6].ERR_VALIDATION
          - validations[8].ERR_OPERATOR_NOT_FOUND
          - endpoints[POST /shore-excursions/excursions]
          - entities.Excursion.fields.price_tier
        distinguishing_aspect: |
          Category pair validation (priority 6) versus existence (priority 8) — a different pair from the
          auth-versus-existence instance, and it pins the unusual ordering that body shape is validated
          BEFORE foreign keys are resolved: price_tier "DIAMOND" is outside the enum while operator_id
          points at no stored row, and the 400 must win over the 404.
        test_recipe:
          setup:
            - "Cozumel is stored as an ALONGSIDE port."
            - "No TourOperator row exists with id 00000000-0000-4000-8000-0000000000ff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
