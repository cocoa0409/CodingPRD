      - name: rejected_dataset_resubmission_loops_back_through_draft
        claim_type: cyclic
        grounds:
          - state_machines.TrainingDataset.SUBMITTED_to_REJECTED
          - state_machines.TrainingDataset.REJECTED_to_DRAFT
          - state_machines.TrainingDataset.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          complexity_profile.state_machine_shape is `cyclic`, and this is the snapshot loop: submit
          from REJECTED does NOT jump straight back to SUBMITTED — it lands in DRAFT, so a rejected
          snapshot needs TWO submits to be re-reviewed. The loop is unbounded (no attempt counter) and
          each pass through it clears the previous decision.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one TrainingDataset registered by u_mle_1 so the steward u_stew_1 can decide it"
          setup_api_calls:
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
          trigger:
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "REJECT", note: "row count below the agreed floor" }
              as: DataSteward
              as_user_id: "u_stew_1"
              captures: { rej_state: $.data.approval_state, rej_by: $.data.decided_by_user_id, rej_at: $.data.decided_at }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { loop_state: $.data.approval_state }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { resub_state: $.data.approval_state }
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
              captures: { final_state: $.data.approval_state, final_by: $.data.decided_by_user_id }
          assert:
            - "REJECT from SUBMITTED: approval_state == 'REJECTED', decided_by_user_id == 'u_stew_1', decided_at == '2026-08-01T00:00:00Z'"
            - "submit from REJECTED lands in DRAFT, NOT in SUBMITTED: approval_state == 'DRAFT'"
            - "a second submit is required to re-enter review: approval_state == 'SUBMITTED'"
            - "the second decision succeeds on the same row: approval_state == 'APPROVED' with decided_by_user_id 'u_stew_1'"
            - "one row throughout: GET /training-datasets returns total_count 1 and its id is ${ds_id}"
            - "the loop is unbounded — no attempt counter exists on TrainingDataset, so REJECTED -> DRAFT -> SUBMITTED may repeat indefinitely"

      - name: incident_recurrence_escalates_at_the_max_and_resolve_stamps_closure
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PredictionIncident.OPEN_to_MITIGATING
          - state_machines.PredictionIncident.MONITORING_to_MITIGATING
          - state_machines.PredictionIncident.MONITORING_to_ESCALATED
          - state_machines.PredictionIncident.ESCALATED_to_RESOLVED
          - entities.PredictionIncident.fields.recurrence_count
        distinguishing_aspect: |
          The incident loop is BOUNDED by MAX_RECURRENCES 2 and the bound is evaluated on
          recurrence_count + 1, so the first RECUR (0+1 < 2) returns to MITIGATING while the second
          (1+1 >= 2) forks to ESCALATED and raises severity to SEV1 — one trigger, two destinations,
