            - "Unit.${u1}.habitability_status == HABITABLE after the successful end"

  # ---------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.RotationShift.fields.start_at
        distinguishing_aspect: |
          Resource = Technician, interval semantics = HALF-OPEN [start_at, end_at): a second
          shift beginning exactly at the first shift's end_at is legal (adjacency), while a
          one-hour interior overlap is rejected with ERR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "T1 exists; shift A PUBLISHED 2026-08-01T08:00 - 16:00"
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T16:00:00Z" }, as: PropertyAdmin, captures: { shA: $.data.id } }
          trigger:
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T16:00:00Z", end_at: "2026-08-02T00:00:00Z" }, as: PropertyAdmin, captures: { shB: $.data.id, stb: $.data.status } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T15:00:00Z", end_at: "2026-08-01T17:00:00Z" }, as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent shift B (start 16:00 == A.end 16:00) is created: status PUBLISHED (half-open semantics)"
            - "Overlapping shift C (15:00-17:00) is rejected: ERR_SHIFT_OVERLAP (409)"
            - "GET /v1/rotation-shifts?technician_id=${t1} returns exactly 2 shifts"

      - name: relocation_closed_interval_shared_boundary_conflicts
        grounds:
          - validations[priority=8]
          - errors[ERR_RELOCATION_OVERLAP]
          - entities.RelocationCase.fields.start_date
        distinguishing_aspect: |
          Resource = Unit, interval semantics = CLOSED [start_date, end_date] among
          APPROVED/ACTIVE cases: case B starting on the very day case A ends (2026-08-10)
          CONFLICTS (shared boundary date counts as occupation), whereas 2026-08-11 is free —
          the opposite boundary treatment from the shift half-open rule, on a different
          resource entity.
        test_recipe:
          setup:
            - "Ticket mitigated with unit_uninhabitable=true; RC-A (T1 proposed, S1 approved) APPROVED for [2026-08-05, 2026-08-10] at 20000/night"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-901", building_code: "B9" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller O", caller_phone: "555-0116", category: "FLOOD", description: "Flood" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Extracted", unit_uninhabitable: true }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u1}", call_ticket_id: "${tk}", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", nightly_rate_cents: 20000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { rcA: $.data.id } }
            - { call: "POST /v1/relocation-cases/${rcA}/approve", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
          trigger:
            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u1}", call_ticket_id: "${tk}", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-12T00:00:00Z", nightly_rate_cents: 20000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u1}", call_ticket_id: "${tk}", start_date: "2026-08-11T00:00:00Z", end_date: "2026-08-13T00:00:00Z", nightly_rate_cents: 20000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { rcC: $.data.id, nc: $.data.planned_nights, ec: $.data.est_cost_cents } }
          assert:
            - "Case B [2026-08-10, 2026-08-12] vs A [2026-08-05, 2026-08-10]: shared boundary date 2026-08-10 -> ERR_RELOCATION_OVERLAP (409)"
            - "Case C [2026-08-11, 2026-08-13] is created PROPOSED with planned_nights == 2 and est_cost_cents == 55000"
            - "RC-A remains APPROVED, unaffected"

  # ---------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: vendor_authorize_void_conserves_incident_exposure
        grounds:
          - state_machines.VendorAuthorization.PROPOSED_to_AUTHORIZED
          - state_machines.VendorAuthorization.AUTHORIZED_to_VOIDED
          - calculations.vendor_exposure_check
          - errors[ERR_INCIDENT_VENDOR_CAP_EXCEEDED]
        distinguishing_aspect: |
          Conserved quantity = committed vendor MONEY on the incident:
          exposure = sum(amount_cents over the ticket's VAs in {AUTHORIZED, INVOICED, PAID}).
          authorize(+20000) followed by void(-20000) leaves exposure identical (30000),
          proven by probing the 500000 incident cap: 470001 is rejected while 470000
          (30000 + 470000 == 500000, inclusive) authorizes.
        test_recipe:
          setup:
            - "Ticket mitigated; WO; vendor V1 limit 500000; VA1 30000 AUTHORIZED (exposure 30000); VA2 20000 PROPOSED (T1 requests, S1 authorizes)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-1001", building_code: "B10" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/vendors", payload: { name: "BigJobs", trade: "GENERAL", per_incident_limit_cents: 500000 }, as: PropertyAdmin, captures: { v1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller P", caller_phone: "555-0117", category: "FLOOD", description: "Flood" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T01:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Contained", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}", as: Dispatcher, captures: { wo: "$.data[0].id" } }
            - { call: "POST /v1/call-tickets/${tk}/vendor-authorizations", payload: { work_order_id: "${wo}", vendor_id: "${v1}", amount_cents: 30000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { va1: $.data.id } }
            - { call: "POST /v1/vendor-authorizations/${va1}/authorize", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
            - { call: "POST /v1/call-tickets/${tk}/vendor-authorizations", payload: { work_order_id: "${wo}", vendor_id: "${v1}", amount_cents: 20000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { va2: $.data.id } }
          trigger:
            - { call: "POST /v1/vendor-authorizations/${va2}/authorize", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
            - { call: "POST /v1/vendor-authorizations/${va2}/void", as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { stv: $.data.status } }
            - { call: "POST /v1/call-tickets/${tk}/vendor-authorizations", payload: { work_order_id: "${wo}", vendor_id: "${v1}", amount_cents: 470001 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { va3: $.data.id } }
            - { call: "POST /v1/vendor-authorizations/${va3}/authorize", as: PropertyAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /v1/call-tickets/${tk}/vendor-authorizations", payload: { work_order_id: "${wo}", vendor_id: "${v1}", amount_cents: 470000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { va4: $.data.id } }
            - { call: "POST /v1/vendor-authorizations/${va4}/authorize", as: PropertyAdmin, captures: { st4: $.data.status } }
            - { call: "GET /v1/work-orders/${wo}", as: Dispatcher, captures: { wost: $.data.status } }
          assert:
            - "VA2 authorize-then-void leaves exposure at exactly 30000: stv == VOIDED"
            - "Probe VA3 (470001): ERR_INCIDENT_VENDOR_CAP_EXCEEDED (402) — 30000 + 470001 > 500000 proves the void released exactly 20000"
            - "Probe VA4 (470000): AUTHORIZED — 30000 + 470000 == 500000 (inclusive cap)"
            - "WorkOrder.${wo}.status == ASSIGNED (VA1 still engaged; voiding VA2 did NOT release the order)"

      - name: shift_transfer_conserves_period_minutes
        grounds:
          - state_machines.RotationShift.PUBLISHED_to_PUBLISHED
          - concurrency_rules[transfer-stale-rotation-shift]
          - entities.RotationShift.fields.technician_id
        distinguishing_aspect: |
          Conserved quantity = scheduled TIME, not money (distinct from the vendor-exposure
          invariant): the transfer rewrites attribution only. Sum of (end_at - start_at)
          over the period's PUBLISHED shifts across both technicians is 960 minutes before
          and after; T1 loses exactly 480 and T2 gains exactly 480.
        test_recipe:
          setup:
            - "T1 holds PUBLISHED shifts A and B (2026-08-01 and 2026-08-02, 00:00-08:00, 480 min each); T2 holds none"
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Terry Two", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t2: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T08:00:00Z" }, as: PropertyAdmin, captures: { shA: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-02T00:00:00Z", end_at: "2026-08-02T08:00:00Z" }, as: PropertyAdmin, captures: { shB: $.data.id, vb: $.data.version } }
          trigger:
            - { call: "POST /v1/rotation-shifts/${shB}/transfer", payload: { to_technician_id: "${t2}", expected_rotation_shift_version: "${vb}" }, as: PropertyAdmin, captures: { nb: $.data.technician_id, vb2: $.data.version, nc: $.data.needs_coverage } }
            - { call: "GET /v1/rotation-shifts?technician_id=${t1}", as: PropertyAdmin, captures: { t1c: "$.data[0].id" } }
            - { call: "GET /v1/rotation-shifts?technician_id=${t2}", as: PropertyAdmin, captures: { t2c: "$.data[0].id" } }
          assert:
            - "Post-transfer: shift ${shB}.technician_id == ${t2}; version advanced by exactly 1"
            - "T1 retains exactly one shift (${shA}, 480 min); T2 holds exactly one (${shB}, 480 min)"
            - "Combined scheduled minutes 480 + 480 == 960, identical to pre-transfer (conserved quantity)"
            - "needs_coverage == false on the transferred shift (flag reset by transfer)"
