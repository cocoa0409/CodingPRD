              as_user_id: "${c_id}"
              captures: { e_state: $.data.error_id }
          assert:
            - "${m1_v1} == 1 and ${m1_v2} == 2 — creating the match and pinning its server configuration each bumped Match.version by exactly one before any coach reported"
            - "trigger 1 returns 412 with data.error_id == ERR_STALE_VERSION: the reporter held the version from creation and never saw the server configuration"
            - "after trigger 1 Match.${m1_id}.version is still ${m1_v2} and home_reported_home_games_won is still null — a 412 writes nothing at all"
            - "trigger 2 returns 200 with data.result_status == PARTIALLY_REPORTED, data.home_reported_home_games_won == 2, data.home_reported_away_games_won == 1 and ${m1_v3} == 3"
            - "trigger 3 returns 412 with data.error_id == ERR_STALE_VERSION: the away side held the pre-report version, so it would have overwritten a supersession it never saw"
            - "trigger 4 returns 200 with data.result_status == CONFIRMED, data.play_status == PLAYED, data.home_games_won == 2, data.away_games_won == 1, data.winner_team_id == ${tm_a_id}, data.home_points_awarded == 3, data.away_points_awarded == 0 and ${m1_v4} == 4"
