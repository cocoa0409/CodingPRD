# =============================================================================
# §1.9 SCAFFOLD CORNER DESIGN — Water Rights Transfer & Adjudication Support
# =============================================================================
# Breadth probe over the §1.1–§1.7 surface of SCAFFOLD.yaml. Every instance is
# reachable from an empty DB using only endpoints declared in §1.5; every
# `${var}` is bound by a `captures:` on an earlier line of the same instance;
# every formula-derived number in `assert:` was executed against the §1.3
# formula and its `constants:` with round-half-up at the pinned precision.
#
# Sections follow references/claim-extraction-guide.md; `claim_type:` values are
# the guide's per-section rows. `excluded_because:` stubs cite §1.8 instances by
# name in SCAFFOLD_DIFFICULTY_DESIGN.yaml and carry no test_recipe.
#
# §1.5 AUDIT FINDINGS FROM THIS WALK (SCAFFOLD.yaml was reshaped, not weakened):
#   - Walking state_machines "Valid Transition" for WaterRight SUSPENDED -> ACTIVE
#     proved POST /water-rights/{id}/reinstate was UNREACHABLE: the only route
#     into SUSPENDED is the condition-violation cascade, validations priority 31
#     blocks reinstatement while any ApprovalCondition is VIOLATED, and VIOLATED
#     was declared terminal — so no chain of §1.5 calls could ever clear it.
#     Ladder rung (1) resolved it by composition: §1.2 now declares the cure leg
#     VIOLATED -> SATISFIED on the EXISTING POST /approval-conditions/{id}/satisfy
#     endpoint, VIOLATED is no longer terminal, and no new endpoint was added.
#     See sm_violated_condition_cure_unlocks_reinstate.
#
# REUSED SETUP CHAINS (spelled out in full in every instance that needs them):
#   BASE RIGHT   clock 2026-03-01; claimant A; WaterRight authorized_diversion_af
#                400.00 / place_of_use_acres 120.00 / authorized_rate_cfs 5.000 /
#                priority_date 1901-05-01 / IRRIGATION; METER BeneficialUseRecords
#                2023, 2024, 2025 at reported_diversion_af 300.000 and
#                irrigated_acres 100.00; activate. Consequences pinned by §1.3:
#                consecutive_nonuse_years == 7 (window 2016..2025),
#                forfeiture_risk_score == 60.50, band ELEVATED.
#   CERTIFIED    BASE RIGHT + DIVERSION_BASED study 2023-2025 (per-year
#                300.000 * 0.65 = 195.000, mean 195.000, face cap 400.00 * 0.65 =
#                260.000, 3 qualifying years so no haircut, transferable_cu_af
#                195.00) + certify with expected_water_right_version captured by
#                a GET immediately before the call.
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # SECTION 1 — ENTITIES
  # ---------------------------------------------------------------------------
  - section: entities
    instances:

      - name: entity_creation_water_right_returns_declared_field_set
        claim_type: creation
        grounds:
          - "entities.WaterRight"
          - "endpoints[POST /water-rights]"
        distinguishing_aspect: >-
          201 with every declared WaterRight field present in data: the eight
          input fields echoed verbatim, status UNADJUDICATED, all four ledger
          buckets 0.00, and the four common fields (id, created_at, updated_at,
          version == 1).
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-03-01T00:00:00Z."
            - "One Claimant of record to own the right."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
          trigger:
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
          assert:
            - "HTTP 201."
            - "WaterRight.claimant_id == the created Claimant id; right_number == \"WR-2198-001\"; priority_date == \"1901-05-01T00:00:00Z\"; source_stream_code == \"SNK-14\"; purpose_of_use == IRRIGATION."
            - "WaterRight.place_of_use_acres == 120.00; authorized_diversion_af == 400.00; authorized_rate_cfs == 5.000."
            - "WaterRight.status == UNADJUDICATED."
            - "WaterRight.certified_hcu_af == 0.00, encumbered_af == 0.00, transferred_away_af == 0.00, transferable_af == 0.00."
            - "WaterRight.forfeiture_risk_score == 0.00, forfeiture_risk_band == LOW, consecutive_nonuse_years == 0, pending_review_count == 0."
            - "WaterRight.id is non-blank, created_at == \"2026-03-01T00:00:00Z\", updated_at == \"2026-03-01T00:00:00Z\", version == 1."

      - name: entity_retrieval_water_right_reads_back_stored_row
        claim_type: retrieval
        grounds:
          - "entities.WaterRight"
          - "endpoints[GET /water-rights/{id}]"
        distinguishing_aspect: >-
          GET /water-rights/{id} returns the same field values the create call
          returned, byte-for-byte on the input fields, and response_type is
          'object' (not an array).
        test_recipe:
          setup:
            - "Empty DB; clock 2026-03-01T00:00:00Z; claimant A; one WaterRight created."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
          trigger:
            - {call: "GET /water-rights/${wr}", as: DecisionAuthority}
          assert:
            - "HTTP 200; meta.api_request_id starts with \"req_\"; meta.api_request_timestamp is ISO8601; response_type == \"object\"."
            - "data.id == ${wr}; data.right_number == \"WR-2198-001\"; data.authorized_diversion_af == 400.00; data.authorized_rate_cfs == 5.000; data.status == UNADJUDICATED; data.version == 1."

      - name: entity_listing_water_rights_paginated_array_envelope
        claim_type: listing
        grounds:
          - "entities.WaterRight"
          - "endpoints[GET /water-rights]"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: >-
          Three rights exist; limit 2 / offset 0 returns exactly 2 rows with
          total_count 3 and has_more true, and limit 2 / offset 2 returns 1 row
          with has_more false — the has_more flip is at offset + limit >=
          total_count, not at a full page.
        test_recipe:
          setup:
            - "Empty DB; clock 2026-03-01T00:00:00Z; claimant A; three WaterRights created in ascending right_number order."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-002", priority_date: "1912-06-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: MUNICIPAL, place_of_use_acres: 0.00, authorized_diversion_af: 250.00, authorized_rate_cfs: 3.000}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-003", priority_date: "1930-04-15T00:00:00Z", source_stream_code: "SNK-22", purpose_of_use: STOCKWATER, place_of_use_acres: 5.00, authorized_diversion_af: 10.00, authorized_rate_cfs: 0.500}, as: WaterRightsAnalyst}
          trigger:
            - {call: "GET /water-rights", payload: {claimant_id: "${cl_a}", limit: 2, offset: 0}, as: HearingOfficer}
            - {call: "GET /water-rights", payload: {claimant_id: "${cl_a}", limit: 2, offset: 2}, as: HearingOfficer}
            - {call: "GET /water-rights", payload: {status: ACTIVE}, as: HearingOfficer}
          assert:
            - "First call: HTTP 200, response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0."
            - "Second call: len(data) == 1, total_count == 3, has_more == false, offset == 2."
            - "Third call: len(data) == 0, total_count == 0, has_more == false — the status filter is applied before pagination, and no right has been activated."

      - name: entity_listing_default_pagination_when_params_omitted
        claim_type: listing
        grounds:
          - "endpoints[GET /transfer-applications]"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: >-
          With limit/offset omitted the server applies limit 10 / offset 0: 12
          DRAFT applications exist, the unparameterised list returns exactly 10
          rows with total_count 12 and has_more true.
        test_recipe:
          setup:
            - "CERTIFIED right for claimant A (certified_hcu_af 195.00)."
            - "Twelve DRAFT TransferApplications on that right, requested_af 1.00 each — DRAFT applications escrow nothing, so the volume budget is never consulted."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 1.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst}
          trigger:
            - {call: "GET /transfer-applications", payload: {water_right_id: "${wr}"}, as: DecisionAuthority}
          assert:
            - "HTTP 200; response_type == \"array\"; len(data) == 10; limit == 10; offset == 0; total_count == 12; has_more == true."

      - name: entity_defaults_omitted_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds: [entities.WaterRight.bank_enrolled, entities.InjuryAnalysis.return_flow_credit_af]
        distinguishing_aspect: >-
          WaterRight.bank_enrolled defaults to false when the optional input is
          omitted, and InjuryAnalysis.return_flow_credit_af defaults to 0 —
          so the analysis's net_injury_af equals its gross_depletion_af exactly.
        test_recipe:
          setup:
            - "CERTIFIED right for claimant A; one DRAFT application requesting 100.00 AF."
            - "bank_enrolled omitted on the right; return_flow_credit_af omitted on the analysis."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
          trigger:
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}, as: WaterRightsAnalyst, captures: {ia: "$.data.id"}}
          assert:
            - "WaterRight.bank_enrolled == false (the optional input was omitted)."
            - "InjuryAnalysis.return_flow_credit_af == 0.00; status == DRAFT; offset_af == 0.00."
            - "InjuryAnalysis.gross_depletion_af == 78.00 (100.00 * 0.78, SEASONAL_AVERAGE ignores pod_move_miles) and net_injury_af == 78.00 — identical, because both credits defaulted to 0.00."
            - "TransferApplication.status == DRAFT, revision_round == 0, escrowed_af == 0.00, protest_deadline == null, unresolved_protest_count == 0, mitigation_fee_total_usd == 0.00."

      - name: entity_system_fields_are_server_stamped_and_input_ignored
        claim_type: system_fields
        grounds: [entities.BeneficialUseRecord.reported_by_user_id, entities.HcuStudy.certified_by_user_id]
        distinguishing_aspect: >-
          BeneficialUseRecord.reported_by_user_id is stamped from the caller's
          X-User-ID (not from the body) and HcuStudy.certified_by_user_id /
          certified_at are stamped only at certification — they are null on the
          DRAFT row even though the study already carries computed volumes.
        test_recipe:
          setup:
            - "BASE RIGHT for claimant A, with the 2025 record reported by the claimant themself (X-User-ID = the claimant id) and the 2023/2024 records reported by staff user u_analyst_1."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst, as_user_id: "u_analyst_1"}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst, as_user_id: "u_analyst_1"}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst, as_user_id: "u_analyst_1"}
          trigger:
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: Claimant, as_user_id: "${cl_a}", captures: {bur_2025: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, as_user_id: "u_analyst_1", captures: {st: "$.data.id"}}
          assert:
            - "BeneficialUseRecord(2025).reported_by_user_id == the claimant A id (taken from X-User-ID, never from the body)."
            - "BeneficialUseRecord(2025).id is non-blank and created_at == \"2026-03-01T00:00:00Z\"."
            - "HcuStudy.status == DRAFT, certified_by_user_id == null, certified_at == null."
            - "HcuStudy.qualifying_year_count == 3, average_annual_cu_af == 195.000, transferable_cu_af == 195.00 — computed at creation, i.e. the DRAFT row is already quantified while the certification stamps are still null."

      - name: entity_computed_fields_claimant_counters_are_derived_not_input
        claim_type: computed_fields
        grounds: [entities.Claimant.open_application_count, entities.Claimant.outstanding_fee_balance_usd]
        distinguishing_aspect: >-
          Claimant.open_application_count is 0 while the only application is
          DRAFT and becomes 1 on submit — it counts non-terminal SUBMITTED-side
          applications, not rows; outstanding_fee_balance_usd stays 0.00 because
          no ApprovalCondition has been priced.
        test_recipe:
          setup:
            - "CERTIFIED right for claimant A (certified_hcu_af 195.00, transferable_af 195.00); one DRAFT application requesting 100.00 AF; the right's version re-read immediately before submit."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
