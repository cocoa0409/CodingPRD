            - "${mem7_final_status} == ACTIVE and ${donor7_lapse} == 0"
            - "Membership.current_period_end == 2028-10-15T00:00:00Z (payment time 2027-10-15 + 12 months)"

      - name: writeoff_releases_reservation_rebalances_lot
        grounds:
          - state_machines.Pledge.PLEDGED_or_PARTIAL_to_WRITTEN_OFF
          - state_machines.PremiumReservation.HELD_to_RELEASED
          - entities.PremiumInventoryLot.fields.available_qty
