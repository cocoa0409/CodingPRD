  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_unit_version_funds_successfully
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[deal-fund-stale-unit]", state_machines.Deal.APPROVED_to_FUNDED]
        distinguishing_aspect: "Funding with the correct current expected_unit_version succeeds and increments Unit.version by 1."
        test_recipe:
          setup: ["an APPROVED SALE deal; client reads the current unit version"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "OK Cust", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-OK-1", condition: "NEW", model_code: "8R230", serial_number: "SN-OK-1", dealer_cost_cents: 6000000, list_price_cents: 8000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 8000000 }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v}" }
              as: FinanceManager
          assert:
            - "Deal.${deal_id}.status == FUNDED"
            - "Unit.${unit_id}.status == SOLD"

      - name: auction_settle_stale_unit_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[auction-settle-stale-unit]", "errors[ERR_STALE_UNIT_VERSION]"]
        distinguishing_aspect: "Settling a CLOSED_NO_SALE lot with a stale expected_unit_version (one less than current) returns ERR_STALE_UNIT_VERSION (412)."
        test_recipe:
          setup: ["a CLOSED_NO_SALE AuctionLot whose unit version advanced since the client read it"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-AS-1", condition: "USED", model_code: "S760", serial_number: "SN-AS-1", dealer_cost_cents: 3500000, list_price_cents: 5000000, engine_hours: 2600 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /auction-lots"
              payload: { unit_id: "${unit_id}", reserve_price_cents: 4500000, opens_at: "2026-01-01T00:00:00Z", closes_at: "2026-02-01T00:00:00Z" }
              as: AuctionClerk
              captures: { lot_id: $.data.id }
            - call: "POST /auction-lots/${lot_id}/open"
              payload: {}
              as: AuctionClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionClerk
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AuctionClerk
              captures: { unit_v: $.data.version }
          trigger:
            - call: "POST /auction-lots/${lot_id}/settle"
              payload: { expected_unit_version: "${unit_v} - 1" }
              as: AuctionClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "response error_id == ERR_STALE_UNIT_VERSION"
            - "AuctionLot.${lot_id}.status == CLOSED_NO_SALE"

      - name: floorplan_accrual_recomputed_on_clock_advance
        claim_type: derived_field_reconciliation
        grounds: [calculations.floor_plan_interest, endpoints, entities.FloorPlanNote.fields.interest_accrued_cents]
        distinguishing_aspect: "Advancing the clock recomputes interest_accrued_cents on an ACTIVE note: 30000000 @875bps for 100 days -> 719178, observable via GET."
        test_recipe:
          setup: ["an ACTIVE FloorPlanNote principal 30000000 @875bps activated at default clock"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-AC-1", condition: "NEW", model_code: "9520R", serial_number: "SN-AC-1", dealer_cost_cents: 30000000, list_price_cents: 42000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /floor-plan-notes"
              payload: { unit_id: "${unit_id}", principal_cents: 30000000, annual_rate_bps: 875 }
              as: FinanceManager
              captures: { note_id: $.data.id }
            - call: "POST /floor-plan-notes/${note_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00Z" }
              as: DealerAdmin
          trigger:
            - call: "GET /floor-plan-notes/${note_id}"
              payload: {}
              as: FinanceManager
              captures: { accrued: $.data.interest_accrued_cents }
          assert:
            - "FloorPlanNote.${note_id}.interest_accrued_cents == 719178"
            - "FloorPlanNote.${note_id}.days_outstanding == 100"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: deal_fund_all_cascades_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Deal.APPROVED_to_FUNDED, state_machines.Unit.RESERVED_to_SOLD]
        excluded_because:
          difficulty_instance: transitive_cascade / deal_fund_cascade_floorplan_payoff_depth3
          rationale: "The depth-3 fund cascade (Deal FUNDED, Unit SOLD, FloorPlanNote PAID_OFF) is asserted immediately in the same operation by the named §1.8 instance, demonstrating immediate consistency."

      - name: work_order_void_compensation_no_drift
        claim_type: saga
        grounds: [state_machines.WorkOrder.OPEN_to_VOID, calculations.parts_availability]
        excluded_because:
          difficulty_instance: compensating_invariant / work_order_void_restores_part_reserved_quantity
          rationale: "Void compensation restoring Part.reserved_qty to its pre-line value with no drift is the named §1.8 compensating-invariant instance."
