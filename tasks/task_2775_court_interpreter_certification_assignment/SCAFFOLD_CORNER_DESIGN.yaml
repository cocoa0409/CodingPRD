              as: QualityReviewer
              captures: { e_self_review: "$.data.error_id" }
            - call: "POST /complaints/${cx}/review"
              payload: { recommendation: "SUBSTANTIATE", findings: "Independent recording review confirms the omissions." }
              as: QualityReviewer
              captures: { cx_status2: "$.data.status", cx_reviewer: "$.data.reviewer_user_id" }
            - call: "POST /complaints/${cx}/adjudicate"
