            - "${sugg} == 172000 (vault is 0, so the suggestion equals the need)"

      - name: hold_standard_vs_large_check_boundary
        claim_type: boundary_edge
        grounds: [calculations.hold_capture_amount]
        distinguishing_aspect: "Face exactly 500000 is STANDARD (offset 2, held 480000); face 500001 is LARGE_CHECK (offset 7, held 480001) — the threshold is inclusive of STANDARD."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A balance 0"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CHECK_DEPOSIT", amount_cents: 500000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { tx1: $.data.id }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CHECK_DEPOSIT", amount_cents: 500001 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { tx2: $.data.id }
            - call: "GET /api/holds"
              payload: { transaction_id: "${tx1}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { h1_type: "$.data[0].hold_type", h1_amt: "$.data[0].amount_cents", h1_off: "$.data[0].release_day_offset" }
            - call: "GET /api/holds"
              payload: { transaction_id: "${tx2}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { h2_type: "$.data[0].hold_type", h2_amt: "$.data[0].amount_cents", h2_off: "$.data[0].release_day_offset" }
          assert:
            - "${h1_type} == STANDARD and ${h1_amt} == 480000 and ${h1_off} == 2"
            - "${h2_type} == LARGE_CHECK and ${h2_amt} == 480001 and ${h2_off} == 7"

      - name: hold_release_skips_weekend
        claim_type: correct_result
        grounds: [calculations.hold_capture_amount]
        distinguishing_aspect: "A STANDARD hold on a Thursday 2026-08-06 deposit releases on the 2nd BUSINESS day after: still ACTIVE on Saturday 2026-08-08, RELEASED with the account credited on Monday 2026-08-10."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A balance 0; a 100000 CHECK_DEPOSIT posted Thursday 2026-08-06"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CHECK_DEPOSIT", amount_cents: 100000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { tx: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /api/holds"
              payload: { transaction_id: "${tx}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { h_sat: "$.data[0].status" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /api/holds"
              payload: { transaction_id: "${tx}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { h_mon: "$.data[0].status" }
            - call: "GET /api/accounts/${a_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { bal: $.data.balance_cents }
          assert:
            - "${h_sat} == ACTIVE (Saturday is not a business day — no release yet)"
            - "${h_mon} == RELEASED"
            - "${bal} == 100000 (20000 credited at posting + 80000 at release)"

      - name: hold_waiver_shortens_release_to_one_day
        claim_type: correct_result
        grounds: [calculations.hold_capture_amount, state_machines.Hold.ACTIVE_to_WAIVED, entities.Approval]
        distinguishing_aspect: "Waiving a LARGE_CHECK hold rewrites release_day_offset to 1; the funds post one business day after the deposit and an Approval(HOLD_WAIVER) record exists."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A balance 0; a 700000 CHECK_DEPOSIT posted Monday 2026-08-03 (LARGE_CHECK, offset 7); the manager waives the hold"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
