              payload: { club_code: "ATL", market_name: "Atlanta", revenue_share_units: 100, status: "ACTIVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { club_atl: $.data.id }
            - call: "POST /licensing/clubs/${club_atl}/players"
              payload: { full_name: "A. Marchetti", group_licensing_opt_in: true, status: "ACTIVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { player_m3_1: $.data.id }
            - call: "POST /licensing/clubs/${club_atl}/players"
              payload: { full_name: "B. Okafor", group_licensing_opt_in: true, status: "ACTIVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { player_m3_2: $.data.id }
          trigger:
            - call: "POST /licensing/players/${player_m3_2}/group-licensing"
              payload: { opt_in: false }
              as: PlayerAgent
              as_user_id: "${player_m3_1}"
          assert:
            - "response status is 403 with data.error_id == 'ERR_FORBIDDEN_SCOPE' (the role is permitted, the row is not)"
            - "Player.${player_m3_2}.group_licensing_opt_in is still true and its version is unchanged"

