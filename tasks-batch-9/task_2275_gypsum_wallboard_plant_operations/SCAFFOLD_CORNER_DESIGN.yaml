  - section: validations
    instances:

      - name: line_speed_above_the_sku_ceiling_is_rejected_at_draft
        claim_type: violation_to_error
        grounds:
          - validations[priority 17, ERR_LINE_SPEED_EXCEEDS_SPEC]
          - endpoints[POST /plant-ops/production-runs]
        distinguishing_aspect: |
          The ceiling is min(line.max_speed_fpm, spec.line_speed_max_fpm), so 500 fpm is refused on a
          500 fpm line because the REGULAR SKU caps at 480, and 480 fpm on the same line is accepted —
          the line's own rating alone would have let both through.
        test_recipe:
          setup:
            - "Plant GYP-1 with LINE-1 rated 500 fpm, the REGULAR SKU capped at 480 fpm and one PLANNED batch."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { spec_reg_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 100.000, calcination_temp_f: 320.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T13:00:00Z" }
              as: MaterialsController
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 500, paper_tension_lb: 45.0, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { err_id: $.data.error_id }
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-04T06:00:00Z", window_end: "2026-08-04T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 480, paper_tension_lb: 45.0, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { ok_run_id: $.data.id }
          assert:
            - "the 500 fpm draft returned status 422 with ${err_id} == ERR_LINE_SPEED_EXCEEDS_SPEC"
            - "the 480 fpm draft returned 201 with ProductionRun.${ok_run_id}.status == DRAFT and required_paper_tension_lb == 41.80"
            - "GET /plant-ops/production-runs?plant_id=${plant_id} returns total_count == 1"

      - name: paper_tension_exactly_at_the_requirement_passes_one_hundredth_below_fails
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 17, ERR_PAPER_TENSION_OUT_OF_RANGE]
          - calculations.paper_tension_window
        distinguishing_aspect: |
          The accepted band is the closed interval [required_paper_tension_lb, spec.paper_tension_max_lb]:
          at 400 fpm on the REGULAR SKU 37.00 lb is accepted while 36.99 lb is refused, and 46.00 lb at
          the other end is also accepted — both endpoints are inclusive.
        test_recipe:
          setup:
            - "Plant GYP-1 with LINE-1, the REGULAR SKU (tension band 28.0 - 46.0 lb) and one PLANNED batch."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { spec_reg_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 100.000, calcination_temp_f: 320.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T13:00:00Z" }
              as: MaterialsController
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 400, paper_tension_lb: 36.99, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { err_id: $.data.error_id }
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-04T06:00:00Z", window_end: "2026-08-04T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 400, paper_tension_lb: 37.00, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { at_min_run_id: $.data.id }
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 400, paper_tension_lb: 46.00, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { at_max_run_id: $.data.id }
          assert:
            - "the 36.99 lb draft returned status 422 with ${err_id} == ERR_PAPER_TENSION_OUT_OF_RANGE"
            - "the 37.00 lb draft returned 201 with ProductionRun.${at_min_run_id}.required_paper_tension_lb == 37.00 and paper_tension_lb == 37.00"
            - "the 46.00 lb draft returned 201 with ProductionRun.${at_max_run_id}.paper_tension_lb == 46.00"
            - "GET /plant-ops/production-runs?plant_id=${plant_id} returns total_count == 2"

      - name: kiln_dwell_too_short_for_the_moisture_target_is_infeasible
        claim_type: violation_to_error
        grounds:
          - validations[priority 17, ERR_KILN_PROFILE_INFEASIBLE]
          - calculations.kiln_energy_and_moisture
        distinguishing_aspect: |
          projected_exit_moisture_pct must stay within kiln_exit_moisture_target_pct + MOISTURE_TOLERANCE_PCT
          (0.10), so a 32-minute dwell at 400 fpm against a 0.50 % target is refused while the same run at
          40 minutes is accepted — the tradeoff is between dwell time and energy, not a fixed dwell floor.
        test_recipe:
          setup:
            - "Plant GYP-1 with LINE-1, the REGULAR SKU and one PLANNED batch."
