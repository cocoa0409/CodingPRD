            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bpc_risk_threshold_30_inclusive
        grounds:
          - calculations.client_risk_score
          - entities.Client.fields.risk_band
          - validations[priority=10]
        distinguishing_aspect: "Numeric threshold crossing on risk_score: a client scoring exactly 30 (medical=1,adverse=1,self_sens=2 -> 8+12+10) is HIGH_RISK (>= is inclusive); a client scoring 29 (medical=3,self_sens=1 -> 24+5) is STANDARD. Reached through POST /clients."
        test_recipe:
          setup:
            - "Two clients created with risk inputs straddling the 30 threshold."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "At30", date_of_birth: "1990-01-01T00:00:00Z", medical_flag_count: 1, prior_adverse_reactions: 1, skin_sensitivity_self: 2 }
              as: FrontDesk
              captures: { c30_id: $.data.id, c30_score: $.data.risk_score, c30_band: $.data.risk_band }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "At29", date_of_birth: "1990-01-01T00:00:00Z", medical_flag_count: 3, prior_adverse_reactions: 0, skin_sensitivity_self: 1 }
              as: FrontDesk
              captures: { c29_id: $.data.id, c29_score: $.data.risk_score, c29_band: $.data.risk_band }
          assert:
            - "Client.${c30_id}.risk_score == 30"
            - "Client.${c30_id}.risk_band == HIGH_RISK"
            - "Client.${c29_id}.risk_score == 29"
            - "Client.${c29_id}.risk_band == STANDARD"

      - name: bpc_kit_available_zero_blocks_start
        grounds:
          - calculations.studio_kit_ledger
          - entities.Studio.fields.sterile_kit_available
          - validations[priority=17]
          - errors[ERR_NO_STERILE_KIT]
        distinguishing_aspect: "Zero-count edge on a different metric (sterile_kit_available) reached through a different endpoint (POST /appointments/{id}/start): a studio stocked with exactly 1 kit allows the first start but the second start with sterile_kit_available==0 fails ERR_NO_STERILE_KIT."
        test_recipe:
          setup:
            - "Studio with sterile_kit_total=1; two BOOKED DEPOSIT_PAID appointments each with READ/PASS patch tests."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 1 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${studio_id}", full_name: "Tech A", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${studio_id}", name: "Warm Taupe", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client A", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client A" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt1_id: $.data.id }
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt1_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /patch-tests/${pt2_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt1_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt2_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T12:00:00Z" }
              as: FrontDesk
              captures: { appt2_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /appointments/${appt2_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /appointments/${appt1_id}/start"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /appointments/${appt2_id}/start"
              payload: {}
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "Studio.${studio_id}.sterile_kit_available after first start == 0"
            - "response error_id == ERR_NO_STERILE_KIT"
            - "HTTP status == 422"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_start_requires_patchtest_read_pass
        grounds:
          - state_machines.Appointment.BOOKED_to_IN_PROCEDURE
          - state_machines.PatchTest.APPLIED_to_READ
          - validations[priority=8]
          - errors[ERR_PATCH_TEST_FAILED]
        distinguishing_aspect: "Appointment->PatchTest pair: an Appointment can only transition BOOKED->IN_PROCEDURE if its linked PatchTest.status==READ and result==PASS; a patch test READ with reaction_grade 2 (result FAIL) blocks /start with ERR_PATCH_TEST_FAILED at booking time."
        test_recipe:
          setup:
            - "Patch test READ with reaction_grade 2 -> result FAIL; booking is rejected at /appointments."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 10 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${studio_id}", full_name: "Tech A", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${studio_id}", name: "Warm Taupe", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client A", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client A" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 2 }
              as: Technician
              captures: { pt_result: $.data.result }
          trigger:
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "PatchTest.${pt_id}.result == FAIL"
            - "response error_id == ERR_PATCH_TEST_FAILED"
            - "HTTP status == 422"

      - name: cesd_start_requires_technician_license_active
        grounds:
          - state_machines.Appointment.BOOKED_to_IN_PROCEDURE
          - state_machines.Technician.LICENSE_ACTIVE_to_LICENSE_EXPIRED
          - entities.Technician.fields.license_status
          - validations[priority=12]
          - errors[ERR_LICENSE_INVALID]
        distinguishing_aspect: "Appointment->Technician pair (different from Appointment->PatchTest): a BOOKED DEPOSIT_PAID appointment can only move to IN_PROCEDURE while its technician.license_status==LICENSE_ACTIVE. The technician's license_expiry is 2026-01-05; the appointment is booked while still valid, but the clock advances to 2026-01-06 (past expiry) so /start observes LICENSE_EXPIRED and fails ERR_LICENSE_INVALID with the appointment still BOOKED (license expiry is a gating check, not a void cascade)."
        test_recipe:
          setup:
            - "Studio + one technician whose license_expiry is 2026-01-05; a BOOKED DEPOSIT_PAID appointment under that tech; clock advanced past the expiry before /start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 10 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${studio_id}", full_name: "Tech A", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2026-01-05T00:00:00Z" }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${studio_id}", name: "Warm Taupe", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client A", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client A" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "Appointment.${appt_id}.lifecycle_status == BOOKED"
            - "response error_id == ERR_LICENSE_INVALID"
            - "HTTP status == 422"

