            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-V20", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers/${cust_id}/suspend", payload: {}, as: ShopAdmin, captures: { st: "$.data.status" } }
          trigger:
            - call: "POST /fluid-power/work-orders"
              payload: { cylinder_id: "${cyl_id}", tier: "STANDARD", promised_hours: 96, complaint: "leak" }
              as: ServiceAdvisor
              captures: { err: "$.data.error_id" }
            - { call: "POST /fluid-power/customers/${cust_id}/reactivate", payload: {}, as: ShopAdmin }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "STANDARD", promised_hours: 96, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
          assert:
            - "while SUSPENDED (${st} == SUSPENDED): creation rejected with ERR_CUSTOMER_SUSPENDED (409)"
            - "after reactivate: creation succeeds, WorkOrder.${wo_id}.status == INTAKE"
