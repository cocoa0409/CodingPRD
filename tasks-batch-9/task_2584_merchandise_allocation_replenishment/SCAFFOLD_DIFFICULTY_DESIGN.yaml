            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s3_id}", item_id: "${item_id}", on_hand_units: 5, size_on_hand: [{ size_code: "S", units: 1 }, { size_code: "M", units: 2 }, { size_code: "L", units: 1 }, { size_code: "XL", units: 1 }], min_units: 4, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 6 }
              as: Allocator
