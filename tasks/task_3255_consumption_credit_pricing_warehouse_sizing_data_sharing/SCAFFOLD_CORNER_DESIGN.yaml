          - entities.PaidShareUsage.fields.price_per_credit
        distinguishing_aspect: "The second settlement on the same listing takes the PRICE_FROZEN_FIRST variant and reuses the frozen price, so a listing whose sticker price did not change still cannot reprice an earlier row."
        test_recipe:
          setup: ["one published share with two published usage-based listings at 0.50 and 0.80"]
          setup_api_calls:
