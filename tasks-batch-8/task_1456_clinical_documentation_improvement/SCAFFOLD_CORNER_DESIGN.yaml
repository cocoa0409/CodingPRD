      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: Please clarify.
          clinical_indicators: []
          proposed_drg_code: DRG-B
          proposed_drg_weight: 2.0
          proposed_soi: 2
          proposed_rom: 2
        as: CDISpecialist
        captures:
          q: $.data.id
          q_ver: $.data.version
      trigger:
      - call: POST /api/cdi-queries/${q}/send
        payload:
          expected_query_version: ${q_ver}
        as: CDISpecialist
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_LEADING_LANGUAGE
  - name: cmi_snapshot_empty_case_set_returns_zero_counts
    claim_type: input_set_filtering
    grounds:
    - calculations.cmi_snapshot_computation
    distinguishing_aspect: No cases in {RECONCILED, FINAL_CODED, CLOSED} -> case_count=0 and all CMI fields are 0.0000 (no division by zero).
    test_recipe:
      setup:
      - program with no finalized cases
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      trigger:
      - call: POST /api/cdi-programs/${prog}/cmi-snapshots
        payload: {}
        as: CDIManager
        captures:
          snap: $.data.id
      assert:
      - CMISnapshot.${snap}.case_count == 0
      - CMISnapshot.${snap}.unadjusted_cmi == 0.0000
      - CMISnapshot.${snap}.adjusted_cmi == 0.0000
      - CMISnapshot.${snap}.cdi_lift == 0.0000
      - CMISnapshot.${snap}.denial_target_misses == 0
  - name: cmi_snapshot_excludes_open_cases
    claim_type: input_set_filtering
    grounds:
    - calculations.cmi_snapshot_computation
    distinguishing_aspect: OPEN cases are excluded from snapshot — only {RECONCILED, FINAL_CODED, CLOSED} count.
    test_recipe:
      setup:
      - program with one OPEN case (never finalized) and one FINAL_CODED case
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M-open
          admission_period: 0
          discharge_period: 3
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 5.0
        as: HIMCoder
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M-fin
          admission_period: 0
          discharge_period: 3
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 2.0
        as: HIMCoder
        captures:
          cfin: $.data.id
          cfin_v: $.data.version
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 5
        as: CDIManager
      - call: POST /api/patient-cases/${cfin}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 2.0
          expected_case_version: ${cfin_v}
        as: HIMCoder
      trigger:
      - call: POST /api/cdi-programs/${prog}/cmi-snapshots
        payload: {}
        as: CDIManager
        captures:
          snap: $.data.id
      assert:
      - CMISnapshot.${snap}.case_count == 1
      - CMISnapshot.${snap}.unadjusted_cmi == 2.0000
