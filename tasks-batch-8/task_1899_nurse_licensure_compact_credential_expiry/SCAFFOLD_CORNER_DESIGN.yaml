  # ===========================================================================
  - section: calculations
    instances:
      - name: monitoring_bucket_boundaries
        claim_type: precision
        grounds:
          - "calculations.expiry_monitoring_buckets"
          - "entities.Certification.fields.expires_on"
        distinguishing_aspect: "Threshold bucketing at exact boundaries: days_to_expiry 30 -> CRITICAL, 31 -> WARNING, 60 -> WARNING, 61 -> OK; a REVOKED cert is excluded from the input set regardless of its date."
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurse holds four ACTIVE certs expiring 2026-08-31 (30d), 2026-09-01 (31d), 2026-09-30 (60d), 2026-10-01 (61d), plus one CNOR cert expiring 2026-09-15 that was REVOKED."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Mona Buckets", email: "mona.buckets@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2025-08-31", expires_on: "2026-08-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "ACLS", issuing_body: "AHA", obtained_on: "2025-09-01", expires_on: "2026-09-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "PALS", issuing_body: "AHA", obtained_on: "2025-09-30", expires_on: "2026-09-30" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "CCRN", issuing_body: "AACN", obtained_on: "2025-10-01", expires_on: "2026-10-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "CNOR", issuing_body: "CCI", obtained_on: "2025-09-15", expires_on: "2026-09-15" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { cnor_id: "$.data.id" } }
            - { call: "POST /credentialing/certifications/${cnor_id}/revoke", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "GET /credentialing/monitoring/expiry-report?nurse_id=${n_id}", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          assert:
            - "Report contains exactly 4 rows for ${n_id} (REVOKED CNOR excluded), ordered by days_to_expiry ASC: [BLS 30 CRITICAL, ACLS 31 WARNING, PALS 60 WARNING, CCRN 61 OK]"
            - "Boundaries honored: day 30 is CRITICAL (<= 30), day 31 is WARNING, day 60 is WARNING (<= 60), day 61 is OK"

      - name: weekly_hours_window_slide_edge
        claim_type: correct_result
        grounds:
          - "calculations.weekly_rolling_hours"
        distinguishing_aspect: "The 7-day window is relative to the NEW assignment's start date: a shift on 2026-08-03 falls outside the window [2026-08-04, 2026-08-11) of a 2026-08-10 booking, so the sixth 12h shift lands at exactly 60.0h and is allowed."
        test_recipe:
          setup:
