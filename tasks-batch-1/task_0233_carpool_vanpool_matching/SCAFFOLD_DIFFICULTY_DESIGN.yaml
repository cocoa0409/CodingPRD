        grounds:
          - state_machines.Trip.SCHEDULED_to_CANCELLED
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - entities.EmployerProgram.fields.subsidy_consumed_cents
          - entities.SubsidyLedgerEntry.fields.amount_cents
        distinguishing_aspect: "Depth-4 chain originating from POST /trips/{id}/cancel: Trip->CANCELLED (A) causes each Reservation->CANCELLED (B); each Reservation cancel refunds the rider wallet and appends a SubsidyLedgerEntry CREDIT (C); the CREDIT append recomputes EmployerProgram.subsidy_consumed_cents (D) — each link caused by the prior, not the trigger."
        test_recipe:
          setup:
            - "Trip SCHEDULED with two pay_now reservations whose subsidy was already finalized via a prior completed sibling trip so a DEBIT exists; cancel must reverse them."
