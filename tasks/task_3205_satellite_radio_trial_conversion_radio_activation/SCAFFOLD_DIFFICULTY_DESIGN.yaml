              captures: { tierGG_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "T10", name: "T10", package_tier_id: "${tierGG_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 30, price_cents: 0 }
              as: PlatformAdmin
              captures: { t10_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "T10B", name: "T10B", package_tier_id: "${tierGG_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 30, price_cents: 0 }
              as: PlatformAdmin
              captures: { t10b_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEML", name: "OEM L", feed_contact_email: "f@l.com" }
              as: PlatformAdmin
              captures: { oem12_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A000004", automaker_id: "${oem12_id}", model_year: 2025, owner_customer_id: "${c10_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { veh10_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESN0010", vehicle_id: "${veh10_id}", hardware_generation: "GEN2" }
              as: PlatformAdmin
              captures: { radio10_id: $.data.id, radio10_v: $.data.version }
            - call: "POST /api/v1/radios/${radio10_id}/trials"
              payload: { plan_id: "${t10_id}", customer_id: "${c10_id}", expected_radio_version: "${radio10_v}" }
              as: Customer
              as_user_id: "${c10_id}"
              captures: { sub10_id: $.data.id }
            - call: "GET /api/v1/radios/${radio10_id}"
              as: PlatformAdmin
              captures: { radio10_v2: $.data.version }
          trigger:
            - call: "POST /api/v1/radios/${radio10_id}/trials"
              payload: { plan_id: "${t10b_id}", customer_id: "${c10_id}", expected_radio_version: "${radio10_v2}" }
              as: Customer
              as_user_id: "${c10_id}"
              captures: { err10: $.data.error_id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/_billing/run_renewals"
              payload: {}
              as: SystemOperator
            - call: "GET /api/v1/radios/${radio10_id}"
              as: PlatformAdmin
              captures: { radio10_v3: $.data.version }
            - call: "POST /api/v1/radios/${radio10_id}/trials"
              payload: { plan_id: "${t10b_id}", customer_id: "${c10_id}", expected_radio_version: "${radio10_v3}" }
              as: Customer
              as_user_id: "${c10_id}"
              captures: { sub10b_id: $.data.id }
          assert:
            - "second trial while first is ACTIVE rejected with ERR_RADIO_INELIGIBLE (occupancy count 1 > 0, even though the requested interval starts inside the first — count semantics, not overlap arithmetic)"
            - "after the first trial EXPIRES via run_renewals (occupancy count back to 0), the same second-trial request succeeds: Subscription ${sub10b_id} status == PENDING_ACTIVATION"

  - rule_id: compensating_invariant
    instances:
      - name: ledger_conservation_under_cancel_refund
        grounds:
          - calculations.cancellation_refund
          - entities.BillingLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: per-subscription net billed amount. Invariant:
          sum(ledger amounts) == current_term_price_cents - refund for an
          immediate-cancelled paid sub, i.e. CHARGE + PRORATION_CREDIT ==
          price * floor(elapsed_days)/term exactly; a drift of even 1 cent
          violates conservation.
        test_recipe:
          setup:
            - "customer C11; radio R11 GEN2; plan P11 (9000/30d, auto_renew false); sub S11 ACTIVE since 2026-09-01T00:00:00Z; clock at 2026-09-11T00:00:00Z (10 days elapsed)"
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "c11@x.com", full_name: "C Eleven", household_size: 1 }
              as: Anonymous
              captures: { c11_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "THH", name: "TierHH", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierHH_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "P11", name: "P11", package_tier_id: "${tierHH_id}", service_mode: "IN_VEHICLE", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 9000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { p11_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMM", name: "OEM M", feed_contact_email: "f@m.com" }
              as: PlatformAdmin
              captures: { oem13_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A000005", automaker_id: "${oem13_id}", model_year: 2025, owner_customer_id: "${c11_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { veh11_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESN0011", vehicle_id: "${veh11_id}", hardware_generation: "GEN2" }
              as: PlatformAdmin
              captures: { radio11_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${c11_id}", plan_id: "${p11_id}", radio_id: "${radio11_id}", auto_renew: false }
              as: Customer
              as_user_id: "${c11_id}"
              captures: { sub11_id: $.data.id }
            - call: "GET /api/v1/radios/${radio11_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sig11_id: "$.data[0].id" }
            - call: "POST /api/v1/_signals/dispatch"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/signal-commands/${sig11_id}/ack"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/subscriptions/${sub11_id}/cancel"
              payload: { effective_mode: "IMMEDIATE" }
              as: Customer
              as_user_id: "${c11_id}"
          assert:
            - "sum(amount_cents over GET /api/v1/subscriptions/${sub11_id}/ledger) == 3000 (CHARGE 9000 + PRORATION_CREDIT -6000 == price retained for exactly 10 of 30 days)"
            - "conserved quantity: retained revenue equals current_term_price_cents * elapsed_whole_days / term_length_days — floor(9000*10/30) == 3000; total is unchanged by any reordering of the two postings"

      - name: family_discount_total_conservation_on_anchor_swap
        grounds:
          - calculations.family_discount
          - calculations.term_pricing
          - entities.Subscription.fields.is_primary_for_discount
        distinguishing_aspect: |
          Conserved quantity: count of discounted subscriptions per customer.
          Invariant: exactly (N-1) of the customer's N non-terminal paid subs
          carry the family discount at all times — anchor swap (cancel the
          anchor) MUST move the discount, never double it or drop it; different
          conserved quantity type from instance 1 (monetary ledger sum vs
          discount-grant cardinality).
        test_recipe:
          setup:
            - "customer C12 household 2; streaming plans PA8 (8000/365d) and PB6 (6000/365d) and PC4 (4000/365d), all auto_renew false"
            - "C12 buys all three streaming subs (ACTIVE immediately); anchor is PA8 (highest base)"
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "c12@x.com", full_name: "C Twelve", household_size: 2 }
              as: Anonymous
              captures: { c12_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TII", name: "TierII", channel_entitlements: ["CH1"], includes_streaming: true, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierII_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PA8", name: "PA8", package_tier_id: "${tierII_id}", service_mode: "STREAMING_ONLY", is_trial: false, term_kind: "ANNUAL", term_length_days: 365, price_cents: 8000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { pa8_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PB6", name: "PB6", package_tier_id: "${tierII_id}", service_mode: "STREAMING_ONLY", is_trial: false, term_kind: "ANNUAL", term_length_days: 365, price_cents: 6000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { pb6_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PC4", name: "PC4", package_tier_id: "${tierII_id}", service_mode: "STREAMING_ONLY", is_trial: false, term_kind: "ANNUAL", term_length_days: 365, price_cents: 4000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { pc4_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${c12_id}", plan_id: "${pa8_id}", auto_renew: false }
              as: Customer
              as_user_id: "${c12_id}"
              captures: { subPA_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${c12_id}", plan_id: "${pb6_id}", auto_renew: false }
              as: Customer
              as_user_id: "${c12_id}"
              captures: { subPB_id: $.data.id, subPB_price: $.data.current_term_price_cents }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${c12_id}", plan_id: "${pc4_id}", auto_renew: false }
              as: Customer
              as_user_id: "${c12_id}"
              captures: { subPC_id: $.data.id, subPC_price: $.data.current_term_price_cents }
          trigger:
            - call: "POST /api/v1/subscriptions/${subPA_id}/cancel"
              payload: { effective_mode: "IMMEDIATE" }
              as: Customer
              as_user_id: "${c12_id}"
          assert:
            - "before cancel: exactly 1 sub with is_primary_for_discount == true (${subPA_id}); PB at 4500 and PC at 3000 (both discounted) — discounted count == N-1 == 2"
            - "after anchor cancel: ${subPB_id}.is_primary_for_discount == true (6000 is next-highest base), ${subPC_id}.is_primary_for_discount == false — still exactly 1 anchor, discounted count == 1 == (2 remaining) - 1"
            - "${subPB_id}.current_term_price_cents repriced 4500 -> 6000; ${subPC_id} stays 3000"
            - "no subscription ever carries both is_primary_for_discount == true and a discounted price (conservation: discount grants move, never multiply)"
