              as: DsoIntegrationLead
              captures: { emp_id: "$.data.id" }
          assert:
            - "The WI offer returns HTTP 422 with data.error_id == ERR_LICENSE_STATE_MISMATCH"
            - "The IL offer returns HTTP 201 with DoctorEmployment.${emp_id}.employment_status == OFFERED and comp_model == MONTHLY_MIN_GUARANTEE by default"
            - "GET /dso/doctor-employments?practice_id=${prac_id} returns total_count == 1"

