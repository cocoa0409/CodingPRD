          trigger:
            - call: "POST /loan-applications/${app_id}/withdraw"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "LoanApplication.${app_id}.status == WITHDRAWN"
            - "RateLock.${lock_id}.status == CANCELLED"

  # -------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts (different error-category pairs)
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_udaap_priority_on_approve
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_UDAAP_BLOCKED]
        distinguishing_aspect: |
          Categories = state (priority 6, ERR_INVALID_STATE) vs business_safety
          (priority 8, ERR_UDAAP_BLOCKED). On POST /loan-applications/{id}/approve
          a LoanApplication that is still in DRAFT (never prequalified) AND
          whose most recent UDAAPCheck is FLAGGED → both rules violated.
          Priority 6 wins → ERR_INVALID_STATE returned, NOT ERR_UDAAP_BLOCKED.
        test_recipe:
          setup:
            - "Empty DB. Applicant + LoanApplication in DRAFT (NOT prequalified)."
            - "One UDAAPCheck on the application with review_outcome=FLAGGED."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "K", email: "k@test.com", ssn_last4: "9001", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "P5", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /udaap-checks"
              payload: { application_id: "${app_id}", review_outcome: "FLAGGED", flagged_reasons: ["HIDDEN_FEES"] }
              as: ComplianceOfficer
              as_user_id: "co-001"
          trigger:
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "LoanApplication.${app_id}.status == DRAFT"

      - name: lock_expired_vs_extension_cap_on_extend
        grounds:
          - validations[priority=13]
          - validations[priority=11]
          - errors[ERR_LOCK_EXPIRED]
          - errors[ERR_EXTENSION_CAP_EXCEEDED]
        distinguishing_aspect: |
          Categories = business_temporal (priority 13, ERR_LOCK_EXPIRED) vs
          business_constraint (priority 11, ERR_EXTENSION_CAP_EXCEEDED). DIFFERENT
          category pair from instance 1. On POST /rate-locks/{id}/extend a lock
          that has both (a) extension_count already at 2 AND (b) system clock
          past expires_at → both rules violated; priority 11 (lower number) wins
          → ERR_EXTENSION_CAP_EXCEEDED returned, NOT ERR_LOCK_EXPIRED.
        test_recipe:
          setup:
            - "Empty DB. Clock at 2026-06-01T00:00:00Z."
            - "Applicant + LoanApplication PREQUALIFIED."
            - "ACTIVE RateLock at 687 bps, 30-day term, with TWO extensions already applied (extension_count=2, expires_at=2026-08-30T00:00:00Z after 30+30+30=90 days). Then advance clock to 2026-09-01T00:00:00Z so lock has BOTH expired AND hit extension cap."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "L", email: "l@test.com", ssn_last4: "9002", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "P6", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 687, lock_term_days: 30, expected_application_version: "${app_v}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_id: $.data.id }
            - call: "POST /rate-locks/${lock_id}/extend"
              payload: { extend_days: 30 }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /rate-locks/${lock_id}/extend"
              payload: { extend_days: 30 }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
          trigger:
            - call: "POST /rate-locks/${lock_id}/extend"
              payload: { extend_days: 7 }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_EXTENSION_CAP_EXCEEDED'"
            - "RateLock.${lock_id}.extension_count == 2"

  # -------------------------------------------------------------------------
  # Rule 6 — Boundary precision checks on different metrics/endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: dti_front_end_at_exact_031_vs_just_over_on_prequalify
        grounds:
          - calculations.dti_ratio
          - validations[priority=10]
          - errors[ERR_DTI_FRONTEND_TOO_HIGH]
        distinguishing_aspect: |
          Metric = front_end_dti on POST /prequalify. Boundary 0.31. Numeric
          threshold (>= vs >) — rule uses strict > so 0.31 (==) passes, 0.3104
          (>) fails. Two applications: A with annual=7726104 (yields 0.31 exactly,
          PASS); B with annual=7716104 (yields 0.3104, FAIL with
          ERR_DTI_FRONTEND_TOO_HIGH).
        test_recipe:
          setup:
            - "Empty DB. Two Applicants — same debt 50000, credit 720, state CA — differing only in annual_income_cents."
            - "Two LoanApplications in DRAFT, both principal 30000000, 360-month, prop_value 31578948 (LTV=0.95)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "M-PASS", email: "m@test.com", ssn_last4: "9003", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { ap_pass: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "N-FAIL", email: "n@test.com", ssn_last4: "9004", annual_income_cents: 7716104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { ap_fail: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${ap_pass}", property_address: "PASS-DTI", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { la_pass: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${ap_fail}", property_address: "FAIL-DTI", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { la_fail: $.data.id }
            - call: "POST /loan-applications/${la_pass}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          trigger:
            - call: "POST /loan-applications/${la_fail}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "LoanApplication.${la_pass}.status == PREQUALIFIED"
            - "LoanApplication.${la_pass}.front_end_dti == 0.31"
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_DTI_FRONTEND_TOO_HIGH'"
            - "LoanApplication.${la_fail}.status == DRAFT"

      - name: cd_redisclose_apr_delta_just_under_vs_just_over_125_bps
        grounds:
          - calculations.cd_redisclose_check
          - entities.Disclosure.fields.change_requires_redisclose
          - state_machines.Disclosure.DRAFT_to_DELIVERED
        distinguishing_aspect: |
          Metric = APR delta in bps on POST /disclosures/{id}/deliver for
          CLOSING_DISCLOSURE. DIFFERENT endpoint from instance 1's prequalify.
          Boundary 12.5 (strict >). Two CDs delivered: prior CD at locked rate
          625 bps (apr 6.250%); new CD after relock at 637 bps (apr 6.370%,
          delta=12.0 bps, NO redisclose) versus relock at 638 bps (apr 6.380%,
          delta=13.0 bps, redisclose). Tests both sides of the strict-> boundary.
        test_recipe:
          setup:
            - "Empty DB. Clock at 2026-06-01T00:00:00Z."
            - "Applicant + LoanApplication PREQUALIFIED, ACTIVE RateLock at 625 bps."
            - "One DELIVERED LOAN_ESTIMATE on the application."
            - "One DELIVERED CLOSING_DISCLOSURE on the application with apr_at_issuance=6.250 (locked at 625 bps)."
            - "Then create a NEW RateLock at 638 bps (supersedes prior); create new DRAFT CLOSING_DISCLOSURE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "O", email: "o@test.com", ssn_last4: "9005", annual_income_cents: 9000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "CD-Bound", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 35000000, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v1: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 625, lock_term_days: 60, expected_application_version: "${app_v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock1_id: $.data.id }
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v2: $.data.version }
            - call: "POST /disclosures"
              payload: { application_id: "${app_id}", disclosure_type: "LOAN_ESTIMATE", expected_application_version: "${app_v2}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { le_id: $.data.id }
            - call: "POST /disclosures/${le_id}/deliver"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v3: $.data.version }
            - call: "POST /loan-applications/${app_id}/submit-for-review"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v4: $.data.version }
            - call: "POST /disclosures"
              payload: { application_id: "${app_id}", disclosure_type: "CLOSING_DISCLOSURE", expected_application_version: "${app_v4}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { cd1_id: $.data.id }
            - call: "POST /disclosures/${cd1_id}/deliver"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v5: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 638, lock_term_days: 60, expected_application_version: "${app_v5}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock2_id: $.data.id }
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v6: $.data.version }
            - call: "POST /disclosures"
              payload: { application_id: "${app_id}", disclosure_type: "CLOSING_DISCLOSURE", expected_application_version: "${app_v6}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { cd2_id: $.data.id }
          trigger:
            - call: "POST /disclosures/${cd2_id}/deliver"
