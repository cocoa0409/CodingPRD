  - section: rbac
    instances:
      - name: rbac_denied_exclusive_operations
        claim_type: role_exclusive_denial
        grounds: [roles.DistrictCoordinator, roles.CampusAdmin, roles.Volunteer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Exclusive operations reject the wrong role with 403 ERR_FORBIDDEN: Volunteer cannot create campuses, CampusAdmin cannot adjudicate background checks or incidents, Volunteer cannot verify own hours."
        test_recipe:
          setup: ["volunteer UNDER_SCREENING with PENDING check; ACTIVE second volunteer with a PENDING hour entry on a CONFIRMED placement; an OPEN incident on the second volunteer"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
