          setup:
            - "Base CA engagement in FIELDWORK; Position MISCLASSIFIED after a NONEXEMPT determination (interviews 46.0/45h/3 and 52.0/49h/2 both ATTESTED)."
            - "One ReclassificationCase with conversion_method COST_NEUTRAL_WITH_OT over [2026-10-01, 2026-10-31] and a FULL_RATE BackWageEstimate, so exposure_cents is 22274928."
            - "One VoluntaryCorrection SELF_CORRECT_FULL proposed by cm-1 for 22274928 and APPROVED by lc-1 at 22274928, which is at or under the 25000000 authority cap and at or above the exposure."
