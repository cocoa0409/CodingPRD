            - "Both Auditor GETs return 200 with total_count 1 and total_count 8 respectively, including the include_superseded view: read-only means ALL rows, not fewer rows."
      - name: unauthenticated_request_without_identity_headers_rejected
        claim_type: authentication_required
        grounds:
          - "errors ERR_UNAUTHENTICATED (401) - validations priority 1, applies_to all, check X-User-ID and X-User-Role are both present and non-empty"
          - "validations priority 2 ERR_UNAUTHORIZED and priority 63 ERR_DUPLICATE_RESOURCE sit below it"
        distinguishing_aspect: |
          Priority 1 is unconditional and precedes every other check including the role check and the
          duplicate check: an anonymous GET of a row that exists is 401 rather than 200, and an anonymous
          POST whose body is ALSO a duplicate is 401 rather than 409 - so the identity gate cannot be
          skipped for reads or shadowed by a body-level failure.
          
        test_recipe:
          setup:
            - "Market US_CORE exists, created by DataEngineer de-1."
            - "An empty as_user_id in the calls below encodes an ABSENT (or empty) X-User-ID header; the role header is present in the first three calls to isolate the identity half of the rule."
            - "The third call additionally carries a market_code that already exists, so it violates priority 63 as well."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
          trigger:
            - call: "GET /mmm/markets/${mkt}"
              as: Auditor
              as_user_id: "au-1"
            - call: "POST /mmm/markets"
              payload: { market_code: "AP_CORE", name: "Asia Pacific Core", total_population: 9000000, annual_budget_ceiling_cents: 4000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
          assert:
            - "Call 1 returns 401 with data.error_id == ERR_UNAUTHENTICATED - a read is not exempt."
            - "Call 2 returns 401 with data.error_id == ERR_UNAUTHENTICATED, and GET /mmm/markets?market_code=AP_CORE (as Auditor au-1) returns total_count == 0: nothing was created."
            - "Call 3 returns 401 with data.error_id == ERR_UNAUTHENTICATED and NOT 409 ERR_DUPLICATE_RESOURCE - priority 1 preempts priority 63."
            - "GET /mmm/markets (as Auditor au-1) returns total_count == 1 - only the setup market exists."
      - name: auditor_cannot_perform_any_mutation
        claim_type: exclusive_operation_denial
        grounds:
          - "roles Auditor exclusive_operations [] and shared_operations [every GET under /mmm] - the clock is deliberately NOT shared with Auditor"
          - "errors ERR_UNAUTHORIZED (403) - validations priority 2, check X-User-Role is permitted for this endpoint per the roles table"
          - "endpoints POST /_clock/set_current_utc roles [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner]"
        distinguishing_aspect: |
          Auditor is the only role with an empty exclusive_operations list, and the denial extends to the
          logical clock - the one mutation every OTHER role shares - so an implementation that treats the
          clock as an infrastructure endpoint outside RBAC fails here while still passing every business
          permission test.
          
        test_recipe:
          setup:
            - "Market US_CORE with an OPEN data window W1 [2026-08-03, 2026-08-31) WEEKLY, both created by DataEngineer de-1."
            - "The clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-31T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
          trigger:
            - call: "POST /mmm/markets"
              payload: { market_code: "AP_CORE", name: "Asia Pacific Core", total_population: 9000000, annual_budget_ceiling_cents: 4000000000, currency_code: "USD" }
              as: Auditor
              as_user_id: "au-1"
            - call: "POST /mmm/data-windows/${w1}/seal"
              as: Auditor
              as_user_id: "au-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/data-windows/${w1}"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/markets?data_posture=RESTRICTED"
              as: Auditor
              as_user_id: "au-1"
          assert:
            - "Calls 1, 2 and 3 each return 403 with data.error_id == ERR_UNAUTHORIZED."
            - "Call 3 in particular is refused even though every other role may set the clock, and a subsequent GET (as DataEngineer de-1) confirms the effective current_utc is still 2026-08-01T00:00:00Z - the refused call did not advance time."
            - "GET /mmm/data-windows/${w1} at call 4 returns 200 with status == OPEN: the seal never happened and reads are permitted."
            - "Call 5 returns 200 with total_count == 1 - the market's data_posture is RESTRICTED because it has no PUBLISHED run and no SEALED window."
            - "No 401 appears anywhere: au-1 is a valid identity, it simply has no write permission."
      - name: modeler_cannot_publish_and_analytics_lead_cannot_fit
        claim_type: exclusive_operation_denial
        grounds:
          - "roles Modeler exclusive_operations include fit and validate but NOT publish"
          - "roles AnalyticsLead exclusive_operations include publish but NOT fit"
