errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or unrecognized X-User-Role / X-User-ID headers
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted for the endpoint, or ownership/scope rule violated (agent acting on another agent's call, disputing another agent's
    review)
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field, ill-typed value, enum value outside the declared set, malformed period, ends_on <= starts_on, valid_until
    not in the future
- id: ERR_CONTRACT_NOT_FOUND
  http: 404
  condition: contract_id path/body reference does not exist
- id: ERR_SERVICE_LEVEL_NOT_FOUND
  http: 404
  condition: service-level id does not exist
- id: ERR_AGENT_NOT_FOUND
  http: 404
  condition: agent id does not exist
- id: ERR_QUEUE_NOT_FOUND
  http: 404
  condition: queue id does not exist
- id: ERR_CALL_NOT_FOUND
  http: 404
  condition: call id does not exist
- id: ERR_REVIEW_NOT_FOUND
  http: 404
  condition: quality-review id does not exist
- id: ERR_COACHING_PLAN_NOT_FOUND
  http: 404
  condition: coaching-plan id does not exist
- id: ERR_ARTICLE_NOT_FOUND
  http: 404
  condition: knowledge-article id does not exist
- id: ERR_TRAINING_COURSE_NOT_FOUND
  http: 404
  condition: training-course id does not exist
- id: ERR_SURGE_WINDOW_NOT_FOUND
  http: 404
  condition: surge-window id does not exist
- id: ERR_INCIDENT_NOT_FOUND
  http: 404
  condition: incident id does not exist
- id: ERR_INVOICE_NOT_FOUND
  http: 404
  condition: invoice id does not exist
- id: ERR_INVOICE_LINE_NOT_FOUND
  http: 404
  condition: invoice-line id does not exist
- id: ERR_CERTIFICATION_NOT_FOUND
  http: 404
  condition: certification referenced by filter does not exist
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_contract_version differs from Contract.version on an OCC-guarded write
- id: ERR_INVALID_STATE
  http: 409
  condition: Transition requested from a state where it is not defined (includes terminal lockdown and duplicate fire)
- id: ERR_SL_CONFLICT
  http: 409
  condition: Service-level activation would create a second EFFECTIVE row with equal effective_from for the same (contract, program_code, metric)
- id: ERR_QUEUE_OVERFLOW_MISMATCH
  http: 409
  condition: overflow_queue_id references a queue of a different contract, different language_code, or mismatched specialty_tag
- id: ERR_OVERFLOW_LOCKED
  http: 409
  condition: Clearing overflow_queue_id after at least one call has been assigned to the queue
- id: ERR_QUEUE_NOT_EMPTY
  http: 409
  condition: Closing a queue that still has calls in WAITING, ASSIGNED, or ANSWERED
- id: ERR_CALL_OVERFLOW_FORBIDDEN
  http: 409
  condition: Routing would require a second overflow hop (route_depth would exceed MAX_ROUTE_DEPTH 2)
- id: ERR_NO_ELIGIBLE_QUEUE
  http: 409
  condition: Queue selector finds no eligible queue and the overflow fallback is empty
- id: ERR_AGENT_HAS_LIVE_CALLS
  http: 409
  condition: Deactivating an agent who is agent_id of a call in ASSIGNED or ANSWERED
- id: ERR_DUPLICATE_PLAN
  http: 409
  condition: Opening a coaching plan for an agent who already has one in OPEN or ESCALATED
- id: ERR_INVOICE_PERIOD_DUPLICATE
  http: 409
  condition: An invoice for this contract and period already exists
- id: ERR_SURGE_OVERLAP
  http: 409
  condition: New surge window overlaps (adjacency counts) an existing DECLARED or ACTIVE window for the same contract+program
- id: ERR_CURE_WINDOW_CLOSED
  http: 409
  condition: Paying a remedy after the cure deadline (CurePeriod already FORFEIT) or on a non-PENDING cure period
- id: ERR_AUTO_REVIEW_REQUIRES_SECOND_APPROVER
  http: 409
  condition: Invoice.auto_review is true and the approving X-User-ID equals the preparer's user id
roles:
- name: PlatformAdmin
  description: Platform operator; creates contracts and drives the test clock; read access everywhere
  identity: opaque
  exclusive_operations:
  - POST /contracts
  - POST /_clock/set_current_utc
  shared_operations:
  - All GET list/detail endpoints
- name: OpsManager
  description: Contact-center operations lead; owns service levels, queues, agents, surge windows, contract lifecycle, invoice approval
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/transition
  - POST /service-levels, /service-levels/{id}/transition
  - POST /agents, /agents/{id}/transition
  - POST /queues, PATCH /queues/{id}, /queues/{id}/transition
  - POST /surge-windows, /surge-windows/{id}/transition
  - POST /invoices/{id}/transition (approve, reject, mark-paid)
  shared_operations:
  - POST /calls
  - All GET list/detail endpoints
- name: Supervisor
  description: Floor supervisor; registers calls, routes them, manages coaching plans
  identity: opaque
  exclusive_operations:
  - POST /calls/{id}/transition (route, abandon)
  - POST /coaching-plans, /coaching-plans/{id}/transition
  shared_operations:
  - POST /calls
  - GET endpoints for calls, queues, agents, certifications, coaching plans, articles
- name: Agent
  description: Certified call handler; acts only on calls assigned to their own X-User-ID
  identity: entity_backed:Agent
  exclusive_operations:
  - POST /calls/{id}/transition to ANSWERED or COMPLETED (own calls only)
  - POST /quality-reviews/{id}/transition to DISPUTED (own handled calls only)
  shared_operations:
  - GET /calls/{id}, GET /quality-reviews/{id}, GET /knowledge-articles, GET /contracts
- name: QualityAnalyst
  description: Quality monitor; scores calls and resolves disputes
  identity: opaque
  exclusive_operations:
  - POST /quality-reviews, /quality-reviews/{id}/transition to ACCEPTED, UPHELD, or OVERTURNED
  shared_operations:
  - GET endpoints for calls, reviews, agents, coaching plans
- name: KnowledgeManager
  description: Knowledge base owner; publishes articles and administers training
  identity: opaque
  exclusive_operations:
  - POST /knowledge-articles, /knowledge-articles/{id}/transition
  - POST /training-courses, /training-courses/{id}/complete
  shared_operations:
  - GET endpoints for articles, courses, certifications
- name: SecurityOfficer
  description: Privacy and security incident commander
  identity: opaque
  exclusive_operations:
  - POST /incidents, /incidents/{id}/transition
  shared_operations:
