  - method: POST
    path: "/consumers/{consumerId}/freeze"
    description: "Apply a data freeze to a consumer file. Freezes the consumer's ISSUED reports and blocks new report issuance and file disclosure until the freeze expires."
    roles: [ExchangeComplianceOfficer]
