      - name: notice_not_disputable_covered_by_difficulty
        claim_type: Error triggerable
        grounds:
          - errors.ERR_NOTICE_NOT_DISPUTABLE
        excluded_because:
          difficulty_instance: state_check_beats_dispute_window_on_resolved_notice
          rationale: "Filing against an already-resolved notice is the trigger of that instance and ERR_NOTICE_NOT_DISPUTABLE is its asserted response."

      - name: sod_violation_error_covered_by_difficulty
        claim_type: Error triggerable
        grounds:
          - errors.ERR_SOD_VIOLATION
        excluded_because:
          difficulty_instance: sod_check_beats_partial_outcome_referential_check
          rationale: "The reviewer-equals-issuer leg is asserted there as the winning error of a doubly-invalid resolve call."

      - name: invalid_partial_outcome_covered_by_difficulty
        claim_type: Error triggerable
        grounds:
          - errors.ERR_INVALID_PARTIAL_OUTCOME
        excluded_because:
          difficulty_instance: sod_check_beats_partial_outcome_referential_check
          rationale: "The same instance repeats the resolve call with a compliant reviewer and asserts ERR_INVALID_PARTIAL_OUTCOME for the malformed PARTIAL body."

      - name: max_dispute_rounds_covered_by_difficulty
        claim_type: Error triggerable
        grounds:
          - errors.ERR_MAX_DISPUTE_ROUNDS
        excluded_because:
          difficulty_instance: dispute_supplement_cycle_bounded_by_max_rounds
          rationale: "The cycle is walked until both the round and supplement caps are hit and the resulting 409 is asserted there."

      - name: device_out_of_calibration_covered_by_difficulty
        claim_type: Error triggerable
        grounds:
          - errors.ERR_DEVICE_OUT_OF_CALIBRATION
        excluded_because:
          difficulty_instance: capture_blocked_by_out_of_calibration_terminal
          rationale: "The counter is driven to the calibration interval and the next capture's 409 is asserted there."

      - name: education_hold_covered_by_difficulty
        claim_type: Error triggerable
        grounds:
          - errors.ERR_EDUCATION_HOLD
        excluded_because:
          difficulty_instance: dispute_blocked_by_education_hold_until_education_completes
          rationale: "The hold is raised by strike accumulation, the blocked filing asserted, and the unblocked retry after completion asserted in the same instance."

      - name: exception_overlap_covered_by_difficulty
        claim_type: Error triggerable
        grounds:
          - errors.ERR_EXCEPTION_OVERLAP
        excluded_because:
          difficulty_instance: exception_agreement_half_open_adjacency_allowed_overlap_rejected
          rationale: "Adjacent intervals are accepted and a one-second overlap rejected with ERR_EXCEPTION_OVERLAP there."

      - name: repricing_window_overlap_covered_by_difficulty
        claim_type: Error triggerable
        grounds:
          - errors.ERR_REPRICING_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: repricing_run_closed_window_with_strict_24_hour_buffer
          rationale: "The 24-hour buffer is probed at exactly 24 hours and just inside it, with ERR_REPRICING_WINDOW_OVERLAP asserted on the inside case."

