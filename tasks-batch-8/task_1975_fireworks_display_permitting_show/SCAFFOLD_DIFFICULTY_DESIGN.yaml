            - "Operator.${op}.status == SUSPENDED"
            - "E1.status == CANCELLED with cancellation_reason == OPERATOR_SUSPENDED"
            - "E2.status == CANCELLED and its SUBMITTED application == WITHDRAWN (link 1 fan-out)"
            - "auto-RETURN movement exists: $.data[1].movement_type == RETURN, auto_generated == true, quantity == 20 (link 2)"
            - "Magazine.${mag}.current_new_lbs == 25.00 (link 3 recompute: full 50 units back at 0.50 lbs)"
            - "E1 security post status == RELEASED"

      - name: dud_halt_cascade
        grounds:
          - calculations.c_dud_halt_threshold
          - state_machines.DisplayEvent.IN_PROGRESS_to_SHOW_COMPLETE
          - entities.DisplayEvent.fields.dud_count
        distinguishing_aspect: |
          Depth-2 cascade from POST /pyro/displays/{id}/misfires: the misfire write mutates
          DisplayEvent.dud_count (link 1); the counter mutation breaches
          max(2, ceil(fired_count*0.05)) and itself forces IN_PROGRESS -> SHOW_COMPLETE with
          termination_reason DUD_HALT (link 2). Different trigger than
          operator_suspend_cascade. With fired_count == 20 the threshold is max(2, 1) = 2,
          so the FIRST misfire must not halt and the SECOND must.
