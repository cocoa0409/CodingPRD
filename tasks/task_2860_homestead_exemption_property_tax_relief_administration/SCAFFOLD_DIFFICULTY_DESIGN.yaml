        grounds:
          - state_machines.FraudCase.OPEN_to_SUBSTANTIATED
          - state_machines.RetroactiveClaim.APPROVED_to_REVERSED
          - state_machines.IncomeCertification.CERTIFIED_to_REVOKED
          - calculations.recovery_assessment_total
          - calculations.parcel_value_decomposition
          - entities.TaxpayerAccount.fields.net_relief_cents
        distinguishing_aspect: |
          Depth-4 cascade rooted at a FraudCase SUBSTANTIATE: L1 assessment, L2 grant REVOKED,
          L3 parcel re-decomposition, L4 the already-APPROVED RetroactiveClaim flips to REVERSED and
          unwinds taxpayer.lifetime_refund_cents. The chain crosses FOUR entities (FraudCase ->
          ExemptionGrant -> Parcel -> RetroactiveClaim -> TaxpayerAccount) and its deepest link is a
          COMPENSATING REVERSAL of previously granted money.
