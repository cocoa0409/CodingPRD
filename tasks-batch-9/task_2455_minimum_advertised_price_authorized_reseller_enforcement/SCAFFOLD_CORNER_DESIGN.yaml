      - name: publication_side_effect_backlinks_the_superseded_policy
        claim_type: side_effect_execution
        grounds: ["state_machines.PricingPolicy.transitions.APPROVED_to_PUBLISHED"]
        distinguishing_aspect: "Publishing writes to a row other than the target: the incumbent's status and superseded_by_policy_id both change, while the new policy's own superseded_by_policy_id stays null."
