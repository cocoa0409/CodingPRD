# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7.
# Corners already exercised by a §1.8 instance are emitted as excluded_because
# stubs and carry no test_recipe.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: district_creation_returns_201_with_zeroed_ledger_and_readable_afterwards
        claim_type: creation
        grounds:
          - entities.District
          - endpoints.POST./districts
          - endpoints.GET./districts/{district_id}
        distinguishing_aspect: >-
          POST /districts with the three declared inputs returns 201 with
          replacement_charge_total_cents 0, security_assessment_cents 0 and
          open_discrepancy_count 0, and the same row is byte-identical on a follow-up GET.
        test_recipe:
          setup:
            - "Empty database; the logical clock has been pinned to 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-1001", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id, d_version: $.data.version }
            - call: "GET /districts/${d_id}"
              payload: {}
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
              captures: { read_code: $.data.district_code }
          assert:
            - "the first trigger call returns HTTP 201"
            - "District.${d_id}.district_code == NG-1001"
            - "District.${d_id}.state_code == NG"
            - "District.${d_id}.replacement_charge_total_cents == 0"
            - "District.${d_id}.security_assessment_cents == 0"
            - "District.${d_id}.open_discrepancy_count == 0"
            - "District.${d_id}.version == 1"
            - "the second trigger call returns HTTP 200 with data.district_code == NG-1001"

      - name: school_listing_filters_by_district_and_reports_pagination_fields
        claim_type: listing
        grounds:
          - endpoints.GET./schools
          - entities.School.fields.district_id
        distinguishing_aspect: >-
          GET /schools with district_id, limit 2 and offset 0 returns exactly 2 School
          rows out of 3 with total_count 3 and has_more true, ordered by created_at ASC.
        test_recipe:
          setup:
            - "One district holding three schools created in a known order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-1002", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Alpha High", school_code: "AH-01", max_concurrent_seats: 30 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s1_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Beta High", school_code: "BH-01", max_concurrent_seats: 30 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s2_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Gamma High", school_code: "GH-01", max_concurrent_seats: 30 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s3_id: $.data.id }
          trigger:
            - call: "GET /schools"
              payload: { district_id: "${d_id}", limit: 2, offset: 0 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { first_school: "$.data[0].id" }
          assert:
            - "the trigger call returns HTTP 200 with response_type array"
            - "meta pagination reports total_count == 3, limit == 2, offset == 0, has_more == true"
            - "the response contains exactly 2 items"
            - "first_school == ${s1_id}"

      - name: test_window_omitted_optionals_receive_declared_defaults
        claim_type: defaults
        grounds:
          - entities.TestWindow.fields.appeal_window_days
          - entities.TestWindow.fields.min_participation_pct
          - entities.TestWindow.fields.status
        distinguishing_aspect: >-
          Creating a window without appeal_window_days or min_participation_pct yields
          exactly 10 and 95.0, status PLANNED, security_hold false and both participation
          rates null.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "POST /test-windows"
              payload: { name: "Fall ELA G3-5", subject: "ELA", grade_band: "G3_5", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
          assert:
            - "the trigger call returns HTTP 201"
            - "TestWindow.${w_id}.appeal_window_days == 10"
            - "TestWindow.${w_id}.min_participation_pct == 95.0"
            - "TestWindow.${w_id}.status == PLANNED"
            - "TestWindow.${w_id}.security_hold == false"
            - "TestWindow.${w_id}.open_breach_count == 0"
            - "TestWindow.${w_id}.participation_rate_provisional_pct == null"
            - "TestWindow.${w_id}.participation_rate_final_pct == null"
            - "TestWindow.${w_id}.released_at == null"

      - name: district_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST./districts
        distinguishing_aspect: >-
          POST /districts without state_code is rejected with ERR_INVALID_REQUEST (400)
          and creates nothing, so a follow-up list of the district's schools is impossible
          because the district never existed.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-1003" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no District row exists afterwards"

      - name: test_window_unknown_subject_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.TestWindow.fields.subject
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          subject accepts only ELA, MATH, SCIENCE and SOCIAL_STUDIES; the value HISTORY is
          rejected with ERR_INVALID_REQUEST (400) before any window row is written.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "POST /test-windows"
              payload: { name: "Fall HIST G6-8", subject: "HISTORY", grade_band: "G6_8", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /test-windows returns total_count == 0"

      - name: material_lot_seal_range_must_match_quantity_shipped
        claim_type: type_constraints
        grounds:
          - entities.MaterialLot.fields.seal_range_end
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          The cross-field rule seal_range_end - seal_range_start + 1 == quantity_shipped is
          enforced at creation: 10 booklets with seals 2000..2008 (nine serials) is a 400.
        test_recipe:
          setup:
            - "One district and one PLANNED window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-1004", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /test-windows"
              payload: { name: "Fall ELA G6-8", subject: "ELA", grade_band: "G6_8", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /material-lots"
              payload: { window_id: "${w_id}", district_id: "${d_id}", lot_code: "LOT-Z1", quantity_shipped: 10, seal_range_start: 2000, seal_range_end: 2008 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /material-lots with window_id ${w_id} returns total_count == 0"

      - name: server_minted_system_fields_are_not_client_settable
        claim_type: system_fields
        grounds:
          - entities.District
          - endpoints.POST./districts
        distinguishing_aspect: >-
          id, created_at, updated_at and version are server-minted; a body carrying an id
          key is rejected because id is not a declared input of POST /districts, and the
          accepted request produces a bare UUID (no type prefix) with version 1.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-1005", state_code: "NG", id: "11111111-1111-4111-8111-111111111111" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { err: $.data.error_id }
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-1005", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id, d_created: $.data.created_at }
          assert:
            - "the first trigger call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the second trigger call returns HTTP 201"
            - "District.${d_id}.id matches ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ with no type prefix"
            - "District.${d_id}.id != 11111111-1111-4111-8111-111111111111"
            - "District.${d_id}.created_at == 2026-09-01T08:00:00.000Z"
            - "District.${d_id}.version == 1"

      - name: custody_event_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.CustodyEvent
          - endpoints.GET./custody-events/{custody_event_id}
        distinguishing_aspect: >-
          CustodyEvent is declared common_fields false, so its read exposes id and
          created_at but no version and no updated_at, and §1.5 declares no PUT, PATCH or
          DELETE for the collection.
        test_recipe:
          setup:
            - "One district, window and 10-booklet lot with a single RECEIPT custody event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-1006", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /test-windows"
              payload: { name: "Fall ELA G6-8", subject: "ELA", grade_band: "G6_8", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
            - call: "POST /material-lots"
              payload: { window_id: "${w_id}", district_id: "${d_id}", lot_code: "LOT-Z2", quantity_shipped: 10, seal_range_start: 2300, seal_range_end: 2309 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { lot_id: $.data.id }
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "RECEIPT", quantity: 10, sealed_count: 10 }
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
              captures: { ce_id: $.data.id }
          trigger:
            - call: "GET /custody-events/${ce_id}"
              payload: {}
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
              captures: { ce_seq: $.data.sequence_no }
          assert:
            - "the trigger call returns HTTP 200"
            - "CustodyEvent.${ce_id}.sequence_no == 1"
            - "CustodyEvent.${ce_id}.previous_event_id == null"
            - "CustodyEvent.${ce_id}.from_holder_type == STATE"
            - "CustodyEvent.${ce_id}.to_holder_type == DISTRICT"
            - "CustodyEvent.${ce_id}.actor_role == DistrictTestCoordinator"
            - "CustodyEvent.${ce_id}.occurred_at == 2026-09-01T08:00:00.000Z"
            - "CustodyEvent.${ce_id}.chain_balance_after == 10"
            - "the response body contains no version key and no updated_at key"

      - name: school_creation_with_unknown_district_parent_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_DISTRICT_NOT_FOUND]
          - entities.School.fields.district_id
        distinguishing_aspect: >-
          A School cannot exist without its District: a body district_id that resolves to
          nothing answers ERR_DISTRICT_NOT_FOUND (404) rather than creating an orphan.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "POST /schools"
              payload: { district_id: "00000000-0000-4000-8000-000000000000", name: "Orphan High", school_code: "OH-99", max_concurrent_seats: 20 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger call returns HTTP 404 with data.error_id == ERR_DISTRICT_NOT_FOUND"
            - "GET /schools returns total_count == 0"

      - name: every_path_scoped_resource_has_its_own_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_DISTRICT_NOT_FOUND]
          - errors[ERR_SCHOOL_NOT_FOUND]
          - errors[ERR_TEST_WINDOW_NOT_FOUND]
          - errors[ERR_PROCTOR_NOT_FOUND]
          - errors[ERR_SECURITY_AFFIDAVIT_NOT_FOUND]
          - errors[ERR_SESSION_NOT_FOUND]
          - errors[ERR_REGISTRATION_NOT_FOUND]
          - errors[ERR_MATERIAL_LOT_NOT_FOUND]
          - errors[ERR_CUSTODY_EVENT_NOT_FOUND]
          - errors[ERR_IRREGULARITY_REPORT_NOT_FOUND]
          - errors[ERR_SCORE_APPEAL_NOT_FOUND]
        distinguishing_aspect: >-
          Each of the eleven single-resource GETs answers its own domain-specific 404 for a
          well-formed but unknown UUID; none of them falls back to a generic not-found id.
        test_recipe:
          setup:
            - "Empty database; no resource of any kind exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "GET /districts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e1: $.data.error_id }
            - call: "GET /schools/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e2: $.data.error_id }
            - call: "GET /test-windows/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e3: $.data.error_id }
            - call: "GET /proctors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e4: $.data.error_id }
            - call: "GET /security-affidavits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e5: $.data.error_id }
            - call: "GET /sessions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e6: $.data.error_id }
            - call: "GET /registrations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e7: $.data.error_id }
            - call: "GET /material-lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e8: $.data.error_id }
            - call: "GET /custody-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e9: $.data.error_id }
            - call: "GET /irregularity-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e10: $.data.error_id }
            - call: "GET /score-appeals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { e11: $.data.error_id }
          assert:
            - "all eleven trigger calls return HTTP 404"
            - "e1 == ERR_DISTRICT_NOT_FOUND"
            - "e2 == ERR_SCHOOL_NOT_FOUND"
            - "e3 == ERR_TEST_WINDOW_NOT_FOUND"
            - "e4 == ERR_PROCTOR_NOT_FOUND"
            - "e5 == ERR_SECURITY_AFFIDAVIT_NOT_FOUND"
            - "e6 == ERR_SESSION_NOT_FOUND"
            - "e7 == ERR_REGISTRATION_NOT_FOUND"
            - "e8 == ERR_MATERIAL_LOT_NOT_FOUND"
            - "e9 == ERR_CUSTODY_EVENT_NOT_FOUND"
            - "e10 == ERR_IRREGULARITY_REPORT_NOT_FOUND"
            - "e11 == ERR_SCORE_APPEAL_NOT_FOUND"

      - name: session_computed_seat_fields_are_derived_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Session.fields.seats_consumed
          - entities.Session.fields.effective_seat_capacity
          - calculations.session_seat_pressure
        distinguishing_aspect: >-
          seats_consumed and effective_seat_capacity are absent from POST /sessions'
          declared input, so supplying them is a 400; the accepted request derives 0 and 12
          from min(seat_capacity 12, school max 60) with no separate-setting penalty.
        test_recipe:
          setup:
            - "One district, one school with max_concurrent_seats 60 and one OPEN window with a lot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-1007", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Sable High", school_code: "SH-01", max_concurrent_seats: 60 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s_id: $.data.id }
            - call: "POST /test-windows"
              payload: { name: "Fall ELA G9-12", subject: "ELA", grade_band: "G9_12", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
            - call: "POST /material-lots"
              payload: { window_id: "${w_id}", district_id: "${d_id}", lot_code: "LOT-Z3", quantity_shipped: 10, seal_range_start: 2400, seal_range_end: 2409 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /test-windows/${w_id}/transitions"
              payload: { to_status: "OPEN" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "POST /sessions"
              payload: { window_id: "${w_id}", school_id: "${s_id}", room_code: "R101", scheduled_start: "2026-09-08T09:00:00Z", scheduled_end: "2026-09-08T12:00:00Z", seat_capacity: 12, seats_consumed: 99 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
            - call: "POST /sessions"
              payload: { window_id: "${w_id}", school_id: "${s_id}", room_code: "R101", scheduled_start: "2026-09-08T09:00:00Z", scheduled_end: "2026-09-08T12:00:00Z", seat_capacity: 12, session_type: "INITIAL" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { sess_id: $.data.id }
          assert:
