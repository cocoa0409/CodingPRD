          - endpoints."GET /registry/reports/registry-summary"
        distinguishing_aspect: "With two properties (VACANT fee 10000, ABANDONED fee 15000), the summary reports total_properties 2 and total_outstanding_balance_cents 25000."
        test_recipe:
          setup: ["One OWNER registrant with a VACANT and an ABANDONED property."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner OO", party_type: "OWNER", email: "oo@x.com", contact_phone: "555-0308", mailing_address: "208 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-RS1", street_address: "16 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
