      - name: capped_panel_forces_the_conventional_variant_and_reprices_the_bill
        claim_type: correct_result
        grounds:
          - calculations.vehicle_repair_estimate
          - calculations.repairability_triage
          - calculations.vehicle_net_billable
          - entities.DamageLine.fields.capped
          - entities.DamageLine.fields.routed_to
