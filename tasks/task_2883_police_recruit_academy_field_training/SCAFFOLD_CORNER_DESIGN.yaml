          - state_machines.Recruit.academy_status.REMEDIATION_to_DISMISSAL_PENDING
        excluded_because:
          difficulty_instance: transitive_cascade / final_exam_failure_cascades_dismissal_pending_void_attendance_session_under_min
          rationale: "One grade call there moves the examination, the recruit's academy substate, every PROVISIONAL attendance row and the enrolment posture of the affected session, so the downstream revalidation chain is already pinned at each level."

  - section: endpoints
    instances:

      - name: standard_crud_lesson_plan_walks_submit_read_list_revise_and_approve
        claim_type: standard_crud
        grounds:
          - entities.LessonPlan
          - endpoints[POST /lesson-plans]
          - endpoints[GET /lesson-plans/{lessonPlanId}]
          - endpoints[GET /lesson-plans]
          - endpoints[POST /lesson-plans/{lessonPlanId}/request-revision]
          - endpoints[POST /lesson-plans/{lessonPlanId}/revisions]
          - endpoints[POST /lesson-plans/{lessonPlanId}/approve]
          - state_machines.LessonPlan
        distinguishing_aspect: "LessonPlan has NO update or delete verb - the whole write surface is four action endpoints - so 'update' must be read as the revision loop. A freshly SUBMITTED plan cannot be revised at all: the revision verb is legal only from REVISION_REQUESTED or APPROVED, so create -> revise is a 409 and the shortest legal edit path is create -> request-revision -> revise -> approve."
        test_recipe:
          setup:
            - "A CERTIFIED instructor B-100 authorized for PATROL exists; no lesson plan exists yet."
            - "The logical clock stands at 2026-08-05T10:00:00Z."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { badge_number: "B-100", full_name: "Ivy Nash" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { instr_id: $.data.id }
            - call: "POST /instructors/${instr_id}/certify"
              payload: { certification_expires_at: "2028-08-01T00:00:00Z", authorized_topic_codes: ["PATROL"], fto_certified: true }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          trigger:
            - call: "POST /lesson-plans"
              payload: { instructor_id: "${instr_id}", topic_code: "PATROL", title: "Patrol Operations", contact_hours: 2.00 }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { lp_id: $.data.id }
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
              captures: { lp_v1: $.data.version }
            - call: "GET /lesson-plans"
              payload: { instructor_id: "${instr_id}" }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "GET /lesson-plans"
              payload: { status: "APPROVED" }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans/${lp_id}/revisions"
              payload: { expected_lesson_plan_version: "${lp_v1}", contact_hours: 3.00, revision_notes: "premature edit" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /lesson-plans/${lp_id}/request-revision"
              payload: { reviewer_notes: "add a use-of-force block" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { lp_v2: $.data.version }
            - call: "POST /lesson-plans/${lp_id}/revisions"
              payload: { expected_lesson_plan_version: "${lp_v2}", contact_hours: 3.00, revision_notes: "use-of-force block added" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
            - call: "POST /lesson-plans/${lp_id}/approve"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: AcademyInstructor
              as_user_id: "${instr_id}"
            - call: "GET /lesson-plans"
              payload: { status: "APPROVED" }
              as: AcademyDirector
              as_user_id: "dir-1"
          assert:
            - "create: HTTP 201 with data.status == 'SUBMITTED', data.revision_number == 1, data.version == 1, and data.approved_revision_number, data.approved_at, data.approved_by_user_id and data.reviewer_notes all null"
            - "read-by-id by a RecordsCustodian returns exactly the created row - capture data.version as ${lp_v1} == 1"
            - "list filtered by instructor_id: total_count == 1, limit 10, offset 0, has_more == false"
            - "list filtered by status APPROVED before approval: total_count == 0 and an empty data array, not a 404"
            - "revision attempt from SUBMITTED: HTTP 409, data.error_id == 'ERR_INVALID_STATE' - the revision verb has no SUBMITTED source state"
            - "request-revision: HTTP 200, data.status == 'REVISION_REQUESTED', data.reviewer_notes == 'add a use-of-force block', data.revision_number still 1, data.version == 2"
            - "revision: HTTP 200, data.status == 'SUBMITTED', data.revision_number == 2, data.contact_hours == 3.00, data.reviewer_notes back to null, data.version == 3"
            - "approve: HTTP 200, data.status == 'APPROVED', data.approved_revision_number == 2, data.approved_at == '2026-08-05T10:00:00Z', data.approved_by_user_id == 'dir-1', data.version == 4"
            - "final read: data.title is still 'Patrol Operations' and data.instructor_id is unchanged - no verb in the chain overwrote an immutable input field"
            - "list filtered by status APPROVED after approval: total_count == 1"

      - name: action_endpoint_request_revision_is_legal_only_from_submitted
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /lesson-plans/{lessonPlanId}/request-revision]
          - state_machines.LessonPlan.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.LessonPlan.APPROVED_to_SUBMITTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An APPROVED plan is NOT sent back with this verb even though a reviewer plausibly would: the only exits from APPROVED are the author's own revision and the revocation cascade. The verb is also not idempotent - a second call from REVISION_REQUESTED is a 409, not a no-op - and it must never touch approved_revision_number, because live CourseSession rows pin that number."
        test_recipe:
          setup:
            - "A CERTIFIED instructor B-100 with an APPROVED PATROL plan (revision 1) exists."
            - "A SCHEDULED CourseSession of that plan pins approved revision 1."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-FT", state_code: "TX", min_total_hours: 2.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 2.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
            - call: "POST /academy-classes"
