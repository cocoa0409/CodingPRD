# =============================================================================
# Restaurant Franchise Management & Royalty — benchmark seed tables
# Difficulty tier: Expert (§0.4)
# =============================================================================

scenario: |
  Restaurant Franchise Management & Royalty: franchisee/unit & territory, royalty
  (% of sales) & ad-fund contribution, POS sales polling & reporting, brand-standard
  audit & score, approved-vendor compliance, FDD/renewal & transfer, development
  schedule, rebate/national-account

domain_name: restaurant-franchise
api_prefix: /franchise

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Flat collections under /franchise; foreign keys carried in request bodies and
  # exposed via filtered-list GETs. Franchisee→Unit and Unit→{SalesReport, RoyaltyStatement,
  # BrandAudit, VendorAuthorization} are 1:N FK links; VendorAuthorization is the Unit↔Vendor
  # junction; NationalAccount cross-cuts many Units via VendorAuthorization.

  state_machine_shape: parallel
  # Unit carries two independent state dimensions (operational_status × compliance_status);
  # BrandAudit has a cyclic remediation/re-audit loop; FranchiseAgreement branches at renewal
  # into RENEWED vs TRANSFERRED vs TERMINATED; DevelopmentSchedule is compound over its units.

  relationship_patterns:
    - one_to_many        # Brand→*, Franchisee→Unit, Unit→SalesReport/RoyaltyStatement/BrandAudit
    - many_to_many       # VendorAuthorization junction (Unit ↔ Vendor)
    - cross_aggregate    # NationalAccount references a Vendor and aggregates over many Units
    - self_referential   # FranchiseAgreement.successor_agreement_id -> FranchiseAgreement.id

  role_model: peer_roles
  # Franchisor (brand HQ operator), ComplianceAuditor (audits + vendor compliance),
  # Franchisee (entity-backed, owns own units), FinanceClerk (royalty/rebate settlement),
  # System (automated POS polling). Non-overlapping resource ownership.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand / franchisor name" }
      - { name: royalty_tier_1_rate, type: number, source: input, default: 0.06, description: "Marginal royalty rate on net sales up to tier-1 ceiling" }
      - { name: royalty_tier_2_rate, type: number, source: input, default: 0.05, description: "Marginal royalty rate on net sales between tier-1 and tier-2 ceilings" }
      - { name: royalty_tier_3_rate, type: number, source: input, default: 0.04, description: "Marginal royalty rate on net sales above tier-2 ceiling" }
      - { name: ad_fund_rate, type: number, source: input, default: 0.02, description: "Ad-fund contribution rate, flat percent of net sales" }
      - { name: late_fee_monthly_rate, type: number, source: input, default: 0.015, description: "Monthly late-fee rate applied to overdue royalty statements" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Deterministic billing-period counter; advanced by close-period" }
      - { name: current_utc, type: datetime, source: system, default: "2026-01-01T00:00:00Z", description: "Logical clock; defaults to 2026-01-01T00:00:00Z until set" }

  - name: Territory
    parent: Brand
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id" }
      - { name: code, type: string, source: input, description: "Territory code, unique per brand (uppercased)" }
      - { name: name, type: string, source: input, description: "Territory display name" }
      - { name: protected, type: boolean, source: input, default: true, description: "Whether territory grants exclusivity to its assigned franchisee" }
      - { name: assigned_franchisee_id, type: string, source: computed, default: null, description: "FK -> Franchisee.id; the franchisee holding this territory, null if unassigned" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | RETIRED", constraints: "AVAILABLE | ASSIGNED | RETIRED" }

  - name: Franchisee
    parent: Brand
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id" }
      - { name: legal_name, type: string, source: input, description: "Franchisee legal entity name" }
      - { name: owner_user_id, type: string, source: input, description: "Opaque external identity of the franchisee principal; matched against X-User-ID for the Franchisee role" }
      - { name: is_existing_operator, type: boolean, source: input, default: false, description: "True if this franchisee already operates other brand units (affects transfer training fee)" }
      - { name: status, type: enum, source: system, description: "APPLICANT | APPROVED | ACTIVE | DEFAULTED | TERMINATED", constraints: "APPLICANT | APPROVED | ACTIVE | DEFAULTED | TERMINATED" }
      - { name: open_compliance_strikes, type: integer, source: computed, default: 0, description: "Count of this franchisee's units currently in compliance_status SUSPENDED" }

  - name: FranchiseAgreement
    parent: Franchisee
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id" }
      - { name: fdd_version, type: string, source: input, description: "Franchise Disclosure Document version this agreement was signed under" }
      - { name: term_end_period_index, type: integer, source: input, description: "Brand period index at which the agreement term expires" }
      - { name: transfer_fee_rate, type: number, source: input, default: 0.02, description: "Rate applied to trailing-12-period net sales when computing a transfer fee" }
      - { name: successor_agreement_id, type: string, source: computed, default: null, description: "FK -> FranchiseAgreement.id; set on the prior agreement when renewed/transferred" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | RENEWAL_PENDING | RENEWED | TRANSFERRED | TERMINATED", constraints: "DRAFT | EXECUTED | RENEWAL_PENDING | RENEWED | TRANSFERRED | TERMINATED" }

  - name: Unit
    parent: Franchisee
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; the territory this unit operates in" }
      - { name: address, type: string, source: input, description: "Unit street address" }
      - { name: operational_status, type: enum, source: system, description: "PLANNED | OPEN | CLOSED (independent lifecycle dimension)", constraints: "PLANNED | OPEN | CLOSED" }
      - { name: compliance_status, type: enum, source: system, description: "GOOD_STANDING | PROBATION | SUSPENDED (independent compliance dimension)", constraints: "GOOD_STANDING | PROBATION | SUSPENDED" }
      - { name: latest_audit_score, type: number, source: computed, default: null, description: "Capped overall score of this unit's most recent FINALIZED BrandAudit, null if none" }
      - { name: lifetime_net_sales_cents, type: integer, source: computed, default: 0, description: "Sum of net_sales_cents over all ACCEPTED SalesReports for this unit" }

  - name: SalesReport
    parent: Unit
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: period_index, type: integer, source: input, description: "Brand billing period this report covers" }
      - { name: gross_sales_cents, type: integer, source: input, description: "Gross POS sales for the period, in cents, >= 0" }
      - { name: discounts_cents, type: integer, source: input, default: 0, description: "Discounts/comps to subtract from gross, in cents, >= 0 and <= gross_sales_cents" }
      - { name: net_sales_cents, type: integer, source: computed, description: "gross_sales_cents - discounts_cents, never negative" }
      - { name: source, type: enum, source: input, default: "POS_POLL", description: "POS_POLL | MANUAL", constraints: "POS_POLL | MANUAL" }
      - { name: status, type: enum, source: system, description: "POLLED | ACCEPTED | AMENDED (append-only event log)", constraints: "POLLED | ACCEPTED | AMENDED" }

  - name: RoyaltyStatement
    parent: Unit
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: period_index, type: integer, source: input, description: "Brand billing period this statement settles" }
      - { name: net_sales_basis_cents, type: integer, source: computed, default: 0, description: "Sum of net_sales_cents of ACCEPTED SalesReports for this unit+period" }
      - { name: royalty_cents, type: integer, source: computed, default: 0, description: "Tiered royalty on net_sales_basis_cents" }
      - { name: ad_fund_cents, type: integer, source: computed, default: 0, description: "Ad-fund contribution = round_half_up(net_sales_basis_cents * brand.ad_fund_rate)" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Late fee accrued on overdue principal; provisional or final per variant" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "royalty_cents + ad_fund_cents + late_fee_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative payments applied to this statement" }
      - { name: due_period_index, type: integer, source: computed, description: "period_index + 1; statement is overdue once brand.current_period_index > due_period_index" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | OVERDUE | WRITTEN_OFF", constraints: "DRAFT | ISSUED | PAID | OVERDUE | WRITTEN_OFF" }

  - name: Vendor
    parent: Brand
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id" }
      - { name: name, type: string, source: input, description: "Vendor / supplier name" }
      - { name: category, type: enum, source: input, description: "FOOD | PACKAGING | EQUIPMENT | SERVICES", constraints: "FOOD | PACKAGING | EQUIPMENT | SERVICES" }
      - { name: approval_status, type: enum, source: system, description: "PENDING | APPROVED | REVOKED", constraints: "PENDING | APPROVED | REVOKED" }

  - name: VendorAuthorization
    parent: Unit
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: qualifying_purchase_cents, type: integer, source: input, default: 0, description: "Purchases from this vendor this quarter, in cents, counts toward national-account rebate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED (a unit's authorization to source from a vendor)", constraints: "ACTIVE | DISABLED" }

  - name: BrandAudit
    parent: Unit
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: food_safety_score, type: integer, source: input, default: null, description: "Section score 0..100, supplied at finalize" }
      - { name: cleanliness_score, type: integer, source: input, default: null, description: "Section score 0..100, supplied at finalize" }
      - { name: service_score, type: integer, source: input, default: null, description: "Section score 0..100, supplied at finalize" }
      - { name: brand_compliance_score, type: integer, source: input, default: null, description: "Section score 0..100, supplied at finalize" }
      - { name: weighted_score, type: number, source: computed, default: null, description: "Weighted section sum before critical-fail cap, 1 decimal" }
      - { name: overall_score, type: number, source: computed, default: null, description: "weighted_score after critical-fail cap (food_safety<70 caps at 59.0)" }
      - { name: grade, type: enum, source: computed, default: null, description: "PASS | CONDITIONAL | FAIL", constraints: "PASS | CONDITIONAL | FAIL" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | FINALIZED | REMEDIATION | CLOSED", constraints: "SCHEDULED | IN_PROGRESS | FINALIZED | REMEDIATION | CLOSED" }

  - name: DevelopmentSchedule
    parent: Franchisee
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id" }
      - { name: required_units, type: integer, source: input, description: "Total units the franchisee committed to open, >= 1" }
      - { name: deadline_period_index, type: integer, source: input, description: "Brand period index by which all required units must be OPEN" }
      - { name: opened_units, type: integer, source: computed, default: 0, description: "Count of this franchisee's units in operational_status OPEN" }
      - { name: status, type: enum, source: system, description: "ON_TRACK | BEHIND | SATISFIED | BREACHED", constraints: "ON_TRACK | BEHIND | SATISFIED | BREACHED" }

  - name: NationalAccount
    parent: Brand
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; the vendor funding this rebate" }
      - { name: name, type: string, source: input, description: "National-account program name" }
      - { name: rebate_pool_cents, type: integer, source: input, description: "Total rebate pool to distribute this quarter, in cents, >= 0" }
      - { name: min_qualifying_cents, type: integer, source: input, default: 1000000, description: "Minimum unit quarterly purchase to qualify for a rebate share" }
      - { name: status, type: enum, source: system, description: "OPEN | DISTRIBUTED", constraints: "OPEN | DISTRIBUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Franchisee
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: APPROVED
        trigger: "POST /franchise/franchisees/{franchiseeId}/approve"
        actor: Franchisor
        preconditions:
          - "Franchisee.status == APPLICANT (else ERR_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: ACTIVE
        trigger: "system (automatic when the franchisee's first Unit transitions to OPEN)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (automatic when open_compliance_strikes reaches 2 after a Unit becomes SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cross-entity dependency: triggered by Unit compliance cascade (Unit {GOOD_STANDING,PROBATION}→SUSPENDED)."

      - from: DEFAULTED
        to: ACTIVE
        trigger: "system (automatic when open_compliance_strikes drops below 2 after a Unit is reinstated)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /franchise/franchisees/{franchiseeId}/terminate"
        actor: Franchisor
        preconditions:
          - "No Unit of this franchisee is in operational_status OPEN (else ERR_FRANCHISEE_HAS_OPEN_UNITS)"
          - "No RoyaltyStatement of this franchisee's units is in status OVERDUE (else ERR_OUTSTANDING_OBLIGATIONS)"
        side_effects:
          - "Set each held Territory.assigned_franchisee_id = null and Territory.status = AVAILABLE"
          - "Set every FranchiseAgreement of this franchisee in status {EXECUTED, RENEWAL_PENDING} to TERMINATED"

      - from: DEFAULTED
        to: TERMINATED
        trigger: "POST /franchise/franchisees/{franchiseeId}/terminate"
        actor: Franchisor
        preconditions:
          - "No Unit of this franchisee is in operational_status OPEN (else ERR_FRANCHISEE_HAS_OPEN_UNITS)"
          - "No RoyaltyStatement of this franchisee's units is in status OVERDUE (else ERR_OUTSTANDING_OBLIGATIONS)"
        side_effects:
          - "Set each held Territory.assigned_franchisee_id = null and Territory.status = AVAILABLE"
          - "Set every FranchiseAgreement of this franchisee in status {EXECUTED, RENEWAL_PENDING} to TERMINATED"

  - entity: Unit
    initial_state: PLANNED
    terminal_states: [CLOSED]
    note: |
      Two independent dimensions evolve on the same row. operational_status:
      PLANNED→OPEN→CLOSED. compliance_status: GOOD_STANDING↔PROBATION↔SUSPENDED.
      Compliance transitions do not change operational_status and vice-versa.
    transitions:
      # --- operational_status dimension ---
      - from: PLANNED
        to: OPEN
        trigger: "POST /franchise/units/{unitId}/open"
        actor: Franchisee
        preconditions:
          - "Unit.operational_status == PLANNED (else ERR_INVALID_STATE)"
          - "Owning Franchisee.status IN {APPROVED, ACTIVE} (else ERR_FRANCHISEE_NOT_APPROVED)"
          - "Unit.territory_id references a Territory whose status == ASSIGNED and assigned_franchisee_id == this unit's franchisee_id (else ERR_TERRITORY_NOT_HELD)"
        side_effects:
          - "If owning Franchisee.status == APPROVED, transition Franchisee APPROVED→ACTIVE"
          - "Recompute DevelopmentSchedule.opened_units for the franchisee; re-evaluate its status (ON_TRACK/BEHIND→SATISFIED when opened_units >= required_units)"
        note: "operational_status dimension only; compliance_status unchanged (stays GOOD_STANDING)."
      - from: OPEN
        to: CLOSED
        trigger: "POST /franchise/units/{unitId}/close"
        actor: Franchisee
        preconditions:
          - "Unit.operational_status == OPEN (else ERR_INVALID_STATE)"
          - "No RoyaltyStatement of this unit is in status OVERDUE (else ERR_OUTSTANDING_OBLIGATIONS)"
        side_effects:
          - "Recompute DevelopmentSchedule.opened_units for the franchisee; re-evaluate its status"
        note: "operational_status dimension only."
      # --- compliance_status dimension ---
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "system (automatic on BrandAudit IN_PROGRESS→FINALIZED with grade CONDITIONAL)"
        actor: system
        preconditions: []
        side_effects: []
        note: "compliance_status dimension only; operational_status unchanged."
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "system (automatic on BrandAudit IN_PROGRESS→FINALIZED with grade FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Increment owning Franchisee.open_compliance_strikes; if it reaches 2 and franchisee is ACTIVE, transition Franchisee ACTIVE→DEFAULTED"
        note: "compliance_status dimension only."
      - from: PROBATION
        to: SUSPENDED
        trigger: "system (automatic on BrandAudit IN_PROGRESS→FINALIZED with grade FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Increment owning Franchisee.open_compliance_strikes; if it reaches 2 and franchisee is ACTIVE, transition Franchisee ACTIVE→DEFAULTED"
        note: "compliance_status dimension only."
      - from: PROBATION
        to: GOOD_STANDING
        trigger: "system (automatic on a subsequent BrandAudit IN_PROGRESS→FINALIZED with grade PASS)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Compliance recovery loop (cyclic): PROBATION→GOOD_STANDING."
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /franchise/units/{unitId}/reinstate"
        actor: Franchisor
        preconditions:
          - "Unit.compliance_status == SUSPENDED (else ERR_INVALID_STATE)"
          - "Unit has a FINALIZED BrandAudit with grade != FAIL created after the audit that caused suspension (else ERR_REMEDIATION_INCOMPLETE)"
        side_effects:
          - "Decrement owning Franchisee.open_compliance_strikes; if it drops below 2 and franchisee is DEFAULTED, transition Franchisee DEFAULTED→ACTIVE"
        note: "Compliance recovery loop (cyclic): SUSPENDED→PROBATION→GOOD_STANDING→...→SUSPENDED."

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /franchise/royalty-statements/{statementId}/issue"
        actor: FinanceClerk
        preconditions:
          - "RoyaltyStatement.status == DRAFT (else ERR_INVALID_STATE)"
          - "At least one ACCEPTED SalesReport exists for the statement's unit+period (else ERR_NO_SALES_BASIS)"
        side_effects:
          - "Recompute net_sales_basis_cents, royalty_cents, ad_fund_cents, total_due_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /franchise/royalty-statements/{statementId}/payments"
        actor: FinanceClerk
        preconditions:
          - "RoyaltyStatement.status IN {ISSUED, OVERDUE} (else ERR_INVALID_STATE)"
        side_effects:
          - "Increase amount_paid_cents by payment.amount_cents"
          - "If amount_paid_cents >= total_due_cents, status → PAID; else statement remains in its prior status with partial payment recorded"
      - from: OVERDUE
        to: PAID
        trigger: "POST /franchise/royalty-statements/{statementId}/payments"
        actor: FinanceClerk
        preconditions:
          - "RoyaltyStatement.status IN {ISSUED, OVERDUE} (else ERR_INVALID_STATE)"
        side_effects:
          - "Increase amount_paid_cents; status → PAID when amount_paid_cents >= total_due_cents"
      - from: ISSUED
        to: OVERDUE
        trigger: "system (automatic during close-period when brand.current_period_index > due_period_index and amount_paid_cents < total_due_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute late_fee_cents using the SIMPLE provisional variant (see calculation late_fee)"
          - "Recompute total_due_cents to include late_fee_cents"
      - from: OVERDUE
        to: WRITTEN_OFF
        trigger: "POST /franchise/royalty-statements/{statementId}/write-off"
        actor: FinanceClerk
        preconditions:
          - "RoyaltyStatement.status == OVERDUE (else ERR_INVALID_STATE)"
          - "expected_brand_version matches Brand.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Recompute late_fee_cents using the COMPOUND final variant (replaces the provisional value)"
          - "Recompute total_due_cents to include the final late_fee_cents"
          - "increments Brand.version by 1"

  - entity: BrandAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    note: "Cyclic remediation loop: FINALIZED→REMEDIATION→ (next audit) SCHEDULED→...→FINALIZED."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /franchise/audits/{auditId}/start"
        actor: ComplianceAuditor
        preconditions:
          - "BrandAudit.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Target Unit.operational_status == OPEN (else ERR_UNIT_NOT_OPEN)"
        side_effects: []
      - from: IN_PROGRESS
        to: FINALIZED
        trigger: "POST /franchise/audits/{auditId}/finalize"
        actor: ComplianceAuditor
        preconditions:
          - "BrandAudit.status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "All four section scores present and each integer in 0..100 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Compute weighted_score, overall_score (critical-fail cap), grade"
          - "Set Unit.latest_audit_score = overall_score"
          - "If grade == CONDITIONAL and Unit.compliance_status == GOOD_STANDING: Unit GOOD_STANDING→PROBATION"
          - "If grade == FAIL: Unit {GOOD_STANDING,PROBATION}→SUSPENDED, incrementing Franchisee strikes (may DEFAULT franchisee)"
          - "If grade == PASS and Unit.compliance_status == PROBATION: Unit PROBATION→GOOD_STANDING"
      - from: FINALIZED
        to: REMEDIATION
        trigger: "POST /franchise/audits/{auditId}/open-remediation"
        actor: ComplianceAuditor
        preconditions:
          - "BrandAudit.status == FINALIZED (else ERR_INVALID_STATE)"
          - "BrandAudit.grade IN {CONDITIONAL, FAIL} (else ERR_NO_REMEDIATION_NEEDED)"
        side_effects: []
      - from: FINALIZED
        to: CLOSED
        trigger: "POST /franchise/audits/{auditId}/close"
        actor: ComplianceAuditor
        preconditions:
          - "BrandAudit.grade == PASS (else ERR_INVALID_STATE — only PASS audits close directly; CONDITIONAL/FAIL must route through REMEDIATION)"
        side_effects: []
      - from: REMEDIATION
        to: CLOSED
        trigger: "POST /franchise/audits/{auditId}/close"
        actor: ComplianceAuditor
        preconditions:
          - "A later FINALIZED BrandAudit exists for the same unit with grade != FAIL (else ERR_REMEDIATION_INCOMPLETE)"
        side_effects: []

  - entity: FranchiseAgreement
    initial_state: DRAFT
    terminal_states: [RENEWED, TRANSFERRED, TERMINATED]
    note: "Branching at renewal: RENEWAL_PENDING forks to RENEWED, TRANSFERRED, or TERMINATED with divergent side-effect sets."
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /franchise/agreements/{agreementId}/execute"
        actor: Franchisor
        preconditions:
          - "FranchiseAgreement.status == DRAFT (else ERR_INVALID_STATE)"
          - "Owning Franchisee.status IN {APPROVED, ACTIVE} (else ERR_FRANCHISEE_NOT_APPROVED)"
        side_effects: []
      - from: EXECUTED
        to: RENEWAL_PENDING
        trigger: "POST /franchise/agreements/{agreementId}/begin-renewal"
        actor: Franchisor
        preconditions:
          - "FranchiseAgreement.status == EXECUTED (else ERR_INVALID_STATE)"
          - "brand.current_period_index >= term_end_period_index - 1 (renewal window open, else ERR_RENEWAL_WINDOW_CLOSED)"
        side_effects: []
      - from: RENEWAL_PENDING
        to: RENEWED
        trigger: "POST /franchise/agreements/{agreementId}/renew"
        actor: Franchisor
        preconditions:
          - "FranchiseAgreement.status == RENEWAL_PENDING (else ERR_INVALID_STATE)"
          - "No Unit of this franchisee is in compliance_status SUSPENDED (else ERR_COMPLIANCE_BLOCK)"
          - "new_fdd_version and new_term_end_period_index provided (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Create successor FranchiseAgreement (status EXECUTED) with fdd_version=new_fdd_version, term_end_period_index=new_term_end_period_index, same franchisee"
          - "Set this agreement.successor_agreement_id to the new agreement id"
      - from: RENEWAL_PENDING
        to: TRANSFERRED
        trigger: "POST /franchise/agreements/{agreementId}/transfer"
        actor: Franchisor
        preconditions:
          - "FranchiseAgreement.status == RENEWAL_PENDING (else ERR_INVALID_STATE)"
          - "buyer_franchisee_id references a Franchisee in status {APPROVED, ACTIVE} (else ERR_FRANCHISEE_NOT_APPROVED)"
          - "No RoyaltyStatement of the seller franchisee's units is OVERDUE (else ERR_OUTSTANDING_OBLIGATIONS)"
        side_effects:
          - "Compute transfer_fee_cents (see calculation transfer_fee) — returned in response, not persisted on the agreement entity"
          - "Create successor FranchiseAgreement (status EXECUTED) under buyer_franchisee_id; set this agreement.successor_agreement_id"
          - "Reassign each Unit of the seller franchisee to the buyer (Unit.franchisee_id = buyer_franchisee_id); reassign each held Territory.assigned_franchisee_id = buyer_franchisee_id"
      - from: RENEWAL_PENDING
        to: TERMINATED
        trigger: "POST /franchise/agreements/{agreementId}/decline-renewal"
        actor: Franchisor
        preconditions:
          - "FranchiseAgreement.status == RENEWAL_PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "Release each Territory held by this franchisee: assigned_franchisee_id = null, status = AVAILABLE"

  - entity: DevelopmentSchedule
    initial_state: ON_TRACK
    terminal_states: [SATISFIED, BREACHED]
    note: "Compound: status is a function of opened_units (this franchisee's Units in OPEN) vs required_units and the brand clock vs deadline_period_index."
    transitions:
      - from: ON_TRACK
        to: SATISFIED
        trigger: "system (automatic when opened_units >= required_units, recomputed on Unit open)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_TRACK
        to: BEHIND
        trigger: "system (automatic during close-period when brand.current_period_index >= deadline_period_index and opened_units < required_units)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BEHIND
        to: SATISFIED
        trigger: "system (automatic when opened_units >= required_units, recomputed on Unit open)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BEHIND
        to: BREACHED
        trigger: "POST /franchise/development-schedules/{scheduleId}/declare-breach"
        actor: Franchisor
        preconditions:
          - "DevelopmentSchedule.status == BEHIND (else ERR_INVALID_STATE)"
          - "brand.current_period_index > deadline_period_index (else ERR_DEADLINE_NOT_PASSED)"
        side_effects:
          - "If owning Franchisee.status == ACTIVE, transition Franchisee ACTIVE→DEFAULTED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: rebate-distribute-stale-brand
    parent_entity: Brand
    write_endpoint: "POST /franchise/national-accounts/{accountId}/distribute"
    occ_field: "expected_brand_version"
    description: |
      Distributing a NationalAccount rebate pool snapshots every qualifying unit's
      qualifying_purchase_cents and the brand clock at distribution time. A distribute
      request that carries a Brand.version older than the brand's current version is
      rejected, because another writer has advanced the brand (e.g. closed a period,
      which re-buckets which purchases fall in the current quarter) since this client
      last observed it — its view of the qualifying set is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: writeoff-stale-brand
    parent_entity: Brand
    write_endpoint: "POST /franchise/royalty-statements/{statementId}/write-off"
    occ_field: "expected_brand_version"
    description: |
      Writing off an OVERDUE RoyaltyStatement recomputes its final compound late fee
      against the brand clock. A write-off request carrying a Brand.version older than
      the brand's current version is rejected, because a close-period advanced the clock
      (changing the months-late count feeding the compound late-fee formula) since this
      client last read the brand — the months-late basis it intends to settle is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_sales
    trigger: "SalesReport creation (POST /franchise/sales-reports)"
    algorithm: aggregation
    formula: |
      net_sales_cents = max(0, gross_sales_cents - discounts_cents)
    input_set: "Single SalesReport row's input fields."
    constants: {}
    precision: "integer cents (inputs already in cents); no rounding"

  - name: royalty
    trigger: "RoyaltyStatement issue (DRAFT→ISSUED) side-effect 'recompute royalty_cents'"
    algorithm: tiered_pricing
    formula: |
      basis = net_sales_basis_cents   # sum of net_sales_cents over ACCEPTED SalesReports for unit+period
      t1 = min(basis, TIER1_CEILING_CENTS)
      t2 = max(0, min(basis, TIER2_CEILING_CENTS) - TIER1_CEILING_CENTS)
      t3 = max(0, basis - TIER2_CEILING_CENTS)
      raw = t1*brand.royalty_tier_1_rate + t2*brand.royalty_tier_2_rate + t3*brand.royalty_tier_3_rate
      royalty_cents = round_half_up(raw)   # SINGLE rounding of the summed total, NOT per-tier
    input_set: "ACCEPTED SalesReports for the statement's unit and period_index only; POLLED and AMENDED excluded."
    constants:
      TIER1_CEILING_CENTS: 5000000   # $50,000
      TIER2_CEILING_CENTS: 10000000  # $100,000
    precision: "round_half_up to whole cents, applied once to the summed marginal total (sum-then-round)"
    variants:
      - name: marginal_tiered
        when: "always (this benchmark pins marginal tiered rates)"
        difference: "Marginal: each tier band charged at its own rate, NOT a single blended rate on the whole basis."

  - name: ad_fund
    trigger: "RoyaltyStatement issue (DRAFT→ISSUED) side-effect 'recompute ad_fund_cents'"
    algorithm: threshold
    formula: |
      ad_fund_cents = round_half_up(net_sales_basis_cents * brand.ad_fund_rate)
    input_set: "Same net_sales_basis_cents as the royalty calc — ACCEPTED SalesReports for unit+period."
    constants: {}
    precision: "round_half_up to whole cents"

  - name: late_fee
    trigger: "RoyaltyStatement ISSUED→OVERDUE (provisional) and OVERDUE→WRITTEN_OFF (final)"
    algorithm: decay_function
    formula: |
      principal = royalty_cents + ad_fund_cents   # late fee is on the obligation principal, excluding prior late fee
      months_late = brand.current_period_index - due_period_index   # whole periods past due, >= 1 when overdue
      monthly_rate = brand.late_fee_monthly_rate
      # variant selection pinned below
    input_set: "The single RoyaltyStatement and the brand clock."
    constants: {}
    precision: "round_half_up to whole cents, applied once to the computed fee"
    variants:
      - name: simple_provisional
        when: "Applied on ISSUED→OVERDUE auto-transition during close-period (provisional, shown while overdue)."
        difference: "late_fee_cents = round_half_up(principal * monthly_rate * months_late) — linear, no compounding."
      - name: compound_final
        when: "Applied on OVERDUE→WRITTEN_OFF (final settlement of the obligation)."
        difference: "late_fee_cents = round_half_up(principal * ((1 + monthly_rate)^months_late - 1)) — compounded; diverges from simple for months_late >= 2."

  - name: audit_score
    trigger: "BrandAudit IN_PROGRESS→FINALIZED side-effect 'compute weighted_score, overall_score, grade'"
    algorithm: weighted_scoring
    formula: |
      weighted_score = round_half_up(
        food_safety_score*W_FOOD + cleanliness_score*W_CLEAN
        + service_score*W_SERVICE + brand_compliance_score*W_BRAND, 1)
      if food_safety_score < CRITICAL_FOOD_SAFETY_FLOOR:
        overall_score = min(weighted_score, CRITICAL_FAIL_CAP)   # critical fail cap
      else:
        overall_score = weighted_score
      grade = PASS        if overall_score >= PASS_FLOOR
              CONDITIONAL if overall_score >= CONDITIONAL_FLOOR
              FAIL        otherwise
    input_set: "The four section scores on this BrandAudit row."
    constants:
      W_FOOD: 0.40
      W_CLEAN: 0.25
      W_SERVICE: 0.20
      W_BRAND: 0.15
      CRITICAL_FOOD_SAFETY_FLOOR: 70   # food_safety_score < 70 triggers critical-fail cap
      CRITICAL_FAIL_CAP: 59.0
      PASS_FLOOR: 90.0                 # overall_score >= 90.0 → PASS
      CONDITIONAL_FLOOR: 70.0          # 70.0 <= overall_score < 90.0 → CONDITIONAL
    precision: "weighted_score rounded half-up to 1 decimal place BEFORE the cap and grade banding are applied"

  - name: transfer_fee
    trigger: "FranchiseAgreement RENEWAL_PENDING→TRANSFERRED side-effect 'compute transfer_fee_cents'"
    algorithm: forward_looking
    formula: |
      trailing_basis = sum over the seller franchisee's units of
        net_sales_basis_cents of RoyaltyStatements whose period_index in
        [brand.current_period_index - 12, brand.current_period_index - 1] inclusive
        and status IN {ISSUED, OVERDUE, PAID, WRITTEN_OFF}   # any issued statement counts
      base_fee = max(FLAT_MIN_CENTS, round_half_up(trailing_basis * agreement.transfer_fee_rate))
      transfer_fee_cents = base_fee + (TRAINING_FEE_CENTS if buyer.is_existing_operator == false else 0)
    input_set: "Seller franchisee's issued RoyaltyStatements in the trailing-12-period window; buyer franchisee flag."
    constants:
      FLAT_MIN_CENTS: 1000000   # $10,000 floor
      TRAINING_FEE_CENTS: 500000  # $5,000 added when buyer is a brand-new operator
    precision: "round_half_up to whole cents on the percentage component before applying the floor and adding the training fee"

  - name: rebate_distribution
    trigger: "NationalAccount OPEN→DISTRIBUTED (POST /franchise/national-accounts/{accountId}/distribute)"
    algorithm: waterfall_allocation
    formula: |
      eligible = VendorAuthorizations for this account's vendor whose
        qualifying_purchase_cents >= account.min_qualifying_cents AND status == ACTIVE
      total_q = sum(qualifying_purchase_cents over eligible)
      if total_q == 0: every unit gets 0 (no distribution)
      for each eligible auth a:
        a.raw_share = floor(account.rebate_pool_cents * a.qualifying_purchase_cents / total_q)
      remainder = account.rebate_pool_cents - sum(raw_share)
      # allocate remainder one cent at a time, ordered by qualifying_purchase_cents DESC,
      # tie-break VendorAuthorization.created_at ASC (never id)
      ordered = eligible sorted by (-qualifying_purchase_cents, created_at ASC)
      i = 0
      while remainder > 0:
        ordered[i % len(ordered)].share += 1
        remainder -= 1; i += 1
    input_set: "ACTIVE VendorAuthorizations for the account's vendor meeting the min_qualifying threshold."
    constants: {}
    precision: "floor per-unit proportional share to whole cents; integer remainder distributed deterministically by the ordering above"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "A Franchisee acting via X-User-ID may only mutate Units / SalesReports / VendorAuthorizations of a franchisee whose owner_user_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Franchisee-scoped mutations (unit open/close, sales-report create, vendor-authorization create)"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "An audit cannot start on a unit that is not OPEN"
    error_id: ERR_UNIT_NOT_OPEN
    http_status: 409
    applies_to: "POST /franchise/audits/{auditId}/start"

  - priority: 7
    category: business_safety
    check: "A SUSPENDED unit cannot be reinstated without a passing post-suspension remediation audit; renewal blocked while any unit SUSPENDED"
    error_id: ERR_COMPLIANCE_BLOCK
    http_status: 409
    applies_to: "POST /franchise/units/{unitId}/reinstate, POST /franchise/agreements/{agreementId}/renew"

  - priority: 8
    category: business_referential
    check: "A unit may only be opened in a Territory currently ASSIGNED to the unit's franchisee"
    error_id: ERR_TERRITORY_NOT_HELD
    http_status: 409
    applies_to: "POST /franchise/units/{unitId}/open"

  - priority: 9
    category: business_temporal
    check: "Renewal may only begin within the renewal window (current_period_index >= term_end_period_index - 1)"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /franchise/agreements/{agreementId}/begin-renewal"

  - priority: 10
    category: business_constraint
    check: "Territory code unique per brand; a Territory in status ASSIGNED cannot be assigned to a second franchisee"
    error_id: ERR_TERRITORY_CONFLICT
    http_status: 409
    applies_to: "POST /franchise/territories, POST /franchise/territories/{territoryId}/assign"

  - priority: 11
    category: business_temporal
    check: "A SalesReport's period_index must equal brand.current_period_index (cannot report a closed period)"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /franchise/sales-reports"

  - priority: 12
    category: business_referential
    check: "A VendorAuthorization may only reference a Vendor whose approval_status == APPROVED"
    error_id: ERR_VENDOR_NOT_APPROVED
    http_status: 409
    applies_to: "POST /franchise/vendor-authorizations"

  - priority: 13
    category: business_fiscal
    check: "A RoyaltyStatement cannot be issued without at least one ACCEPTED SalesReport for its unit+period"
    error_id: ERR_NO_SALES_BASIS
    http_status: 409
    applies_to: "POST /franchise/royalty-statements/{statementId}/issue"

  - priority: 14
    category: business_fiscal
    check: "A franchisee/unit with an OVERDUE RoyaltyStatement cannot close the unit, terminate the franchisee, or transfer (outstanding obligations)"
    error_id: ERR_OUTSTANDING_OBLIGATIONS
    http_status: 409
    applies_to: "POST /franchise/units/{unitId}/close, POST /franchise/franchisees/{franchiseeId}/terminate, POST /franchise/agreements/{agreementId}/transfer"

  - priority: 15
    category: business_constraint
    check: "OCC version mismatch on Brand-guarded writes (distribute, write-off)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /franchise/national-accounts/{accountId}/distribute, POST /franchise/royalty-statements/{statementId}/write-off"

  - priority: 16
    category: business_constraint
    check: "A Unit may have at most one BrandAudit in an active phase (status IN {SCHEDULED, IN_PROGRESS}) at a time; scheduling a second active audit on the same unit collides"
    error_id: ERR_AUDIT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /franchise/audits"

  - priority: 17
    category: business_constraint
    check: "Field-level: amounts >= 0, discounts_cents <= gross_sales_cents, section scores integer in 0..100, required_units >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "create / finalize endpoints with numeric inputs"

# =============================================================================
# §1.5 API Endpoint Table  (flat topology under /franchise)
# =============================================================================
endpoints:
  # --- Brand & clock ---
  - method: POST
    path: "/franchise/brands"
    description: "Create a Brand (franchisor HQ)."
    roles: [Franchisor]
    code: 201
    input: ["name", "royalty_tier_1_rate?", "royalty_tier_2_rate?", "royalty_tier_3_rate?", "ad_fund_rate?", "late_fee_monthly_rate?"]
    output: Brand
    side_effects: ["current_period_index=0, current_utc=2026-01-01T00:00:00Z, version=1"]

  - method: GET
    path: "/franchise/brands/{brandId}"
    description: "Get a Brand."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: Brand
    side_effects: []

  - method: POST
    path: "/franchise/brands/{brandId}/close-period"
    description: "Advance the brand clock by one period and run period-close cascades."
    roles: [Franchisor, FinanceClerk]
    code: 200
    input: []
    output: Brand
    side_effects:
      - "current_period_index += 1"
      - "ISSUED RoyaltyStatements past due and not fully paid → OVERDUE with SIMPLE provisional late_fee_cents recomputed"
      - "DevelopmentSchedules past deadline with opened_units < required_units → BEHIND"
      - "increments Brand.version by 1"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the brand logical clock to an explicit instant. Default before any call is 2026-01-01T00:00:00Z."
    roles: [Franchisor]
    code: 200
    input: [brand_id, to_iso8601]
    output: Brand
    side_effects: ["Brand.current_utc = to_iso8601"]

  # --- Territory ---
  - method: POST
    path: "/franchise/territories"
    description: "Create a Territory."
    roles: [Franchisor]
    code: 201
    input: ["brand_id", "code", "name", "protected?"]
    output: Territory
    side_effects: ["status=AVAILABLE; ERR_TERRITORY_CONFLICT if code already used in brand"]

  - method: GET
    path: "/franchise/territories/{territoryId}"
    description: "Get a Territory."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: Territory
    side_effects: []

  - method: GET
    path: "/franchise/territories"
    description: "List Territories (filterable by brand / franchisee / status)."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: ["brand_id?", "assigned_franchisee_id?", "status?"]
    output: "Territory[]"
    side_effects: []

  - method: POST
    path: "/franchise/territories/{territoryId}/assign"
    description: "Assign a Territory to a franchisee (grants exclusivity)."
    roles: [Franchisor]
    code: 200
    input: [franchisee_id]
    output: Territory
    side_effects:
      - "status → ASSIGNED, assigned_franchisee_id set; ERR_TERRITORY_CONFLICT if already ASSIGNED"

  # --- Franchisee ---
  - method: POST
    path: "/franchise/franchisees"
    description: "Create a Franchisee (applicant)."
    roles: [Franchisor]
    code: 201
    input: ["brand_id", "legal_name", "owner_user_id", "is_existing_operator?"]
    output: Franchisee
    side_effects: ["status=APPLICANT, open_compliance_strikes=0"]

  - method: GET
    path: "/franchise/franchisees/{franchiseeId}"
    description: "Get a Franchisee."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: Franchisee
    side_effects: []

  - method: GET
    path: "/franchise/franchisees"
    description: "List Franchisees (filterable by brand / status)."
    roles: [Franchisor, ComplianceAuditor, FinanceClerk]
    code: 200
    input: ["brand_id?", "status?"]
    output: "Franchisee[]"
    side_effects: []

  - method: POST
    path: "/franchise/franchisees/{franchiseeId}/approve"
    description: "Approve an applicant franchisee."
    roles: [Franchisor]
    code: 200
    input: []
    output: Franchisee
    side_effects: ["status APPLICANT → APPROVED"]

  - method: POST
    path: "/franchise/franchisees/{franchiseeId}/terminate"
    description: "Terminate a franchisee."
    roles: [Franchisor]
    code: 200
    input: []
    output: Franchisee
    side_effects:
      - "status → TERMINATED; release held territories; terminate EXECUTED/RENEWAL_PENDING agreements"

  # --- Franchise Agreement (FDD / renewal / transfer) ---
  - method: POST
    path: "/franchise/agreements"
    description: "Create a draft FranchiseAgreement under an FDD version."
    roles: [Franchisor]
    code: 201
    input: ["franchisee_id", "fdd_version", "term_end_period_index", "transfer_fee_rate?"]
    output: FranchiseAgreement
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/franchise/agreements/{agreementId}"
    description: "Get a FranchiseAgreement."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: []

  - method: GET
    path: "/franchise/agreements"
    description: "List FranchiseAgreements (filterable by brand / franchisee / predecessor's successor link / status)."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: ["brand_id?", "franchisee_id?", "successor_agreement_id?", "status?"]
    output: "FranchiseAgreement[]"
    side_effects: []

  - method: POST
    path: "/franchise/agreements/{agreementId}/execute"
    description: "Execute a draft agreement."
    roles: [Franchisor]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["status DRAFT → EXECUTED"]

  - method: POST
    path: "/franchise/agreements/{agreementId}/begin-renewal"
    description: "Open the renewal window on an executed agreement."
    roles: [Franchisor]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["status EXECUTED → RENEWAL_PENDING"]

  - method: POST
    path: "/franchise/agreements/{agreementId}/renew"
    description: "Renew the agreement, creating an executed successor."
    roles: [Franchisor]
    code: 200
    input: [new_fdd_version, new_term_end_period_index]
    output: FranchiseAgreement
    side_effects: ["status → RENEWED; successor agreement created (EXECUTED); successor_agreement_id set"]

  - method: POST
    path: "/franchise/agreements/{agreementId}/transfer"
    description: "Transfer the franchise to a buyer franchisee; computes transfer fee."
    roles: [Franchisor]
    code: 200
    input: [buyer_franchisee_id]
    output: FranchiseAgreement
    side_effects:
      - "status → TRANSFERRED; successor created under buyer; units & held territories reassigned to buyer; successor_agreement_id set"

  - method: POST
    path: "/franchise/agreements/{agreementId}/decline-renewal"
    description: "Decline renewal and terminate the agreement."
    roles: [Franchisor]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["status → TERMINATED; release held territories"]

  # --- Development Schedule ---
  - method: POST
    path: "/franchise/development-schedules"
    description: "Create a development schedule for a franchisee."
    roles: [Franchisor]
    code: 201
    input: ["franchisee_id", "required_units", "deadline_period_index"]
    output: DevelopmentSchedule
    side_effects: ["status=ON_TRACK, opened_units=0"]

  - method: GET
    path: "/franchise/development-schedules/{scheduleId}"
    description: "Get a development schedule."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: DevelopmentSchedule
    side_effects: []

  - method: GET
    path: "/franchise/development-schedules"
    description: "List development schedules (filterable by brand / franchisee / status)."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: ["brand_id?", "franchisee_id?", "status?"]
    output: "DevelopmentSchedule[]"
    side_effects: []

  - method: POST
    path: "/franchise/development-schedules/{scheduleId}/declare-breach"
    description: "Declare a development-schedule breach after the deadline."
    roles: [Franchisor]
    code: 200
    input: []
    output: DevelopmentSchedule
    side_effects: ["status → BREACHED; may DEFAULT the franchisee"]

  # --- Unit ---
  - method: POST
    path: "/franchise/units"
    description: "Create a planned Unit under a franchisee."
    roles: [Franchisor, Franchisee]
    code: 201
    input: ["franchisee_id", "territory_id", "address"]
    output: Unit
    side_effects: ["operational_status=PLANNED, compliance_status=GOOD_STANDING"]

  - method: GET
    path: "/franchise/units/{unitId}"
    description: "Get a Unit."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/franchise/units"
    description: "List Units (filterable by brand / franchisee / territory / status)."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: ["brand_id?", "franchisee_id?", "territory_id?", "operational_status?", "compliance_status?"]
    output: "Unit[]"
    side_effects: []

  - method: POST
    path: "/franchise/units/{unitId}/open"
    description: "Open a planned unit."
    roles: [Franchisee, Franchisor]
    code: 200
    input: []
    output: Unit
    side_effects:
      - "operational_status PLANNED → OPEN"
      - "Franchisee APPROVED → ACTIVE if first open unit"
      - "Recompute owning DevelopmentSchedule.opened_units and status"

  - method: POST
    path: "/franchise/units/{unitId}/close"
    description: "Close an open unit."
    roles: [Franchisee, Franchisor]
    code: 200
    input: []
    output: Unit
    side_effects:
      - "operational_status OPEN → CLOSED"
      - "Recompute owning DevelopmentSchedule.opened_units and status"

  - method: POST
    path: "/franchise/units/{unitId}/reinstate"
    description: "Reinstate a suspended unit (compliance dimension) after remediation."
    roles: [Franchisor]
    code: 200
    input: []
    output: Unit
    side_effects:
      - "compliance_status SUSPENDED → PROBATION"
      - "Decrement franchisee strikes; DEFAULTED → ACTIVE if strikes < 2"

  # --- Sales Reports (POS polling) ---
  - method: POST
    path: "/franchise/sales-reports"
    description: "Ingest a POS sales report for a unit's current period."
    roles: [Franchisee, Franchisor, System]
    code: 201
    input: ["unit_id", "period_index", "gross_sales_cents", "discounts_cents?", "source?"]
    output: SalesReport
    side_effects: ["net_sales_cents computed; status=POLLED; ERR_PERIOD_CLOSED if period_index != brand.current_period_index"]

  - method: POST
    path: "/franchise/sales-reports/{salesReportId}/accept"
    description: "Accept a polled sales report into the royalty basis."
    roles: [Franchisor, FinanceClerk]
    code: 200
    input: []
    output: SalesReport
    side_effects:
      - "status POLLED → ACCEPTED"
      - "Recompute Unit.lifetime_net_sales_cents"

  - method: GET
    path: "/franchise/sales-reports/{salesReportId}"
    description: "Get a sales report."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: SalesReport
    side_effects: []

  - method: GET
    path: "/franchise/sales-reports"
    description: "List sales reports (filterable by brand / unit / period / status)."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: ["brand_id?", "unit_id?", "period_index?", "status?"]
    output: "SalesReport[]"
    side_effects: []

  # --- Royalty Statements ---
  - method: POST
    path: "/franchise/royalty-statements"
    description: "Create a draft royalty statement for a unit+period."
    roles: [FinanceClerk, Franchisor]
    code: 201
    input: ["unit_id", "period_index"]
    output: RoyaltyStatement
    side_effects: ["status=DRAFT; due_period_index = period_index + 1"]

  - method: GET
    path: "/franchise/royalty-statements/{statementId}"
    description: "Get a royalty statement."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []

  - method: GET
    path: "/franchise/royalty-statements"
    description: "List royalty statements (filterable by brand / unit / period / status)."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: ["brand_id?", "unit_id?", "period_index?", "status?"]
    output: "RoyaltyStatement[]"
    side_effects: []

  - method: POST
    path: "/franchise/royalty-statements/{statementId}/issue"
    description: "Issue a royalty statement; computes royalty and ad-fund."
    roles: [FinanceClerk]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects:
      - "status DRAFT → ISSUED"
      - "Compute net_sales_basis_cents, royalty_cents, ad_fund_cents, total_due_cents"

  - method: POST
    path: "/franchise/royalty-statements/{statementId}/payments"
    description: "Record a payment against a royalty statement."
    roles: [FinanceClerk]
    code: 200
    input: [amount_cents]
    output: RoyaltyStatement
    side_effects:
      - "Increase amount_paid_cents; status → PAID when total_due_cents covered"

  - method: POST
    path: "/franchise/royalty-statements/{statementId}/write-off"
    description: "Write off an overdue statement; finalizes compound late fee. OCC-guarded on Brand.version."
    roles: [FinanceClerk]
    code: 200
    input: [expected_brand_version]
    output: RoyaltyStatement
    side_effects:
      - "status OVERDUE → WRITTEN_OFF"
      - "Recompute late_fee_cents with the COMPOUND final variant; recompute total_due_cents"
      - "increments Brand.version by 1"

  # --- Vendors & approved-vendor compliance ---
  - method: POST
    path: "/franchise/vendors"
    description: "Create a vendor (pending approval)."
    roles: [Franchisor, ComplianceAuditor]
    code: 201
    input: ["brand_id", "name", "category"]
    output: Vendor
    side_effects: ["approval_status=PENDING"]

  - method: GET
    path: "/franchise/vendors/{vendorId}"
    description: "Get a vendor."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/franchise/vendors"
    description: "List vendors (filterable by brand / category / approval_status)."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: ["brand_id?", "category?", "approval_status?"]
    output: "Vendor[]"
    side_effects: []

  - method: POST
    path: "/franchise/vendors/{vendorId}/approve"
    description: "Approve a vendor for the brand."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: Vendor
    side_effects: ["approval_status PENDING → APPROVED"]

  - method: POST
    path: "/franchise/vendors/{vendorId}/revoke"
    description: "Revoke a vendor's approval."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "approval_status → REVOKED"
      - "Set every ACTIVE VendorAuthorization for this vendor to DISABLED"

  - method: POST
    path: "/franchise/vendor-authorizations"
    description: "Authorize a unit to source from an approved vendor."
    roles: [Franchisee, Franchisor]
    code: 201
    input: ["unit_id", "vendor_id", "qualifying_purchase_cents?"]
    output: VendorAuthorization
    side_effects: ["status=ACTIVE; ERR_VENDOR_NOT_APPROVED if vendor not APPROVED"]

  - method: GET
    path: "/franchise/vendor-authorizations/{authorizationId}"
    description: "Get a vendor authorization."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: VendorAuthorization
    side_effects: []

  - method: GET
    path: "/franchise/vendor-authorizations"
    description: "List vendor authorizations (filterable by brand / unit / vendor / status)."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: ["brand_id?", "unit_id?", "vendor_id?", "status?"]
    output: "VendorAuthorization[]"
    side_effects: []

  # --- Brand Audits ---
  - method: POST
    path: "/franchise/audits"
    description: "Schedule a brand-standard audit for a unit."
    roles: [ComplianceAuditor]
    code: 201
    input: ["unit_id"]
    output: BrandAudit
    side_effects: ["status=SCHEDULED; ERR_AUDIT_IN_PROGRESS if the unit already has an audit in status SCHEDULED or IN_PROGRESS"]

  - method: GET
    path: "/franchise/audits/{auditId}"
    description: "Get an audit."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: BrandAudit
    side_effects: []

  - method: GET
    path: "/franchise/audits"
    description: "List audits (filterable by brand / unit / status / grade)."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: ["brand_id?", "unit_id?", "status?", "grade?"]
    output: "BrandAudit[]"
    side_effects: []

  - method: POST
    path: "/franchise/audits/{auditId}/start"
    description: "Begin an audit on an OPEN unit."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: BrandAudit
    side_effects: ["status SCHEDULED → IN_PROGRESS"]

  - method: POST
    path: "/franchise/audits/{auditId}/finalize"
    description: "Finalize an audit with section scores; computes weighted/overall score and grade."
    roles: [ComplianceAuditor]
    code: 200
    input: [food_safety_score, cleanliness_score, service_score, brand_compliance_score]
    output: BrandAudit
    side_effects:
      - "Compute weighted_score, overall_score, grade"
      - "Set Unit.latest_audit_score"
      - "Cascade Unit compliance_status per grade (PROBATION on CONDITIONAL; SUSPENDED on FAIL; PROBATION→GOOD_STANDING on PASS)"

  - method: POST
    path: "/franchise/audits/{auditId}/open-remediation"
    description: "Open a remediation case on a CONDITIONAL/FAIL audit."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: BrandAudit
    side_effects: ["status FINALIZED → REMEDIATION"]

  - method: POST
    path: "/franchise/audits/{auditId}/close"
    description: "Close an audit (PASS directly, or REMEDIATION once a later non-FAIL audit exists)."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: BrandAudit
    side_effects: ["status → CLOSED"]

  # --- National Accounts / Rebates ---
  - method: POST
    path: "/franchise/national-accounts"
    description: "Create a national-account rebate program funded by a vendor."
    roles: [Franchisor, FinanceClerk]
    code: 201
    input: ["brand_id", "vendor_id", "name", "rebate_pool_cents", "min_qualifying_cents?"]
    output: NationalAccount
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/franchise/national-accounts/{accountId}"
    description: "Get a national account."
    roles: [Franchisor, ComplianceAuditor, Franchisee, FinanceClerk]
    code: 200
    input: []
    output: NationalAccount
    side_effects: []

  - method: GET
    path: "/franchise/national-accounts"
    description: "List national accounts (filterable by brand / vendor / status)."
    roles: [Franchisor, ComplianceAuditor, FinanceClerk]
    code: 200
    input: ["brand_id?", "vendor_id?", "status?"]
    output: "NationalAccount[]"
    side_effects: []

  - method: POST
    path: "/franchise/national-accounts/{accountId}/distribute"
    description: "Distribute the rebate pool across qualifying units. OCC-guarded on Brand.version."
    roles: [FinanceClerk]
    code: 200
    input: [expected_brand_version]
    output: NationalAccount
    side_effects:
      - "status OPEN → DISTRIBUTED; waterfall rebate allocation per qualifying VendorAuthorization"
      - "increments Brand.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Franchisee acts on a resource not owned by the franchisee whose owner_user_id == X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, negative amount, discounts > gross, score out of 0..100, required_units < 1, missing required field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_FRANCHISEE_NOT_APPROVED, http: 409, condition: "Operation requires the franchisee to be APPROVED or ACTIVE" }
  - { id: ERR_FRANCHISEE_HAS_OPEN_UNITS, http: 409, condition: "Cannot terminate a franchisee with units still OPEN" }
  - { id: ERR_TERRITORY_NOT_HELD, http: 409, condition: "Unit's territory is not ASSIGNED to the unit's franchisee" }
  - { id: ERR_TERRITORY_CONFLICT, http: 409, condition: "Territory code duplicate, or territory already ASSIGNED to another franchisee" }
  - { id: ERR_PERIOD_CLOSED, http: 409, condition: "SalesReport period_index does not equal brand.current_period_index" }
  - { id: ERR_VENDOR_NOT_APPROVED, http: 409, condition: "VendorAuthorization references a vendor that is not APPROVED" }
  - { id: ERR_NO_SALES_BASIS, http: 409, condition: "No ACCEPTED SalesReport exists for the statement's unit+period" }
  - { id: ERR_OUTSTANDING_OBLIGATIONS, http: 409, condition: "An OVERDUE RoyaltyStatement blocks unit close, franchisee termination, or transfer" }
  - { id: ERR_COMPLIANCE_BLOCK, http: 409, condition: "A SUSPENDED unit blocks reinstatement-without-remediation or agreement renewal" }
  - { id: ERR_REMEDIATION_INCOMPLETE, http: 409, condition: "Reinstate/close requires a later FINALIZED non-FAIL audit that does not yet exist" }
  - { id: ERR_NO_REMEDIATION_NEEDED, http: 409, condition: "open-remediation called on a PASS audit (grade not CONDITIONAL/FAIL)" }
  - { id: ERR_UNIT_NOT_OPEN, http: 409, condition: "Audit cannot start because the target unit is not OPEN" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "begin-renewal called before the renewal window opens" }
  - { id: ERR_DEADLINE_NOT_PASSED, http: 409, condition: "declare-breach called before the development deadline passes" }
  - { id: ERR_AUDIT_IN_PROGRESS, http: 409, condition: "Unit already has a BrandAudit in status SCHEDULED or IN_PROGRESS; cannot schedule another" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_brand_version does not match Brand.version on an OCC-guarded write" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Franchisor
    description: "Brand HQ operator: brand/territory/franchisee/agreement/development governance, vendor creation, unit lifecycle override."
    identity: opaque
    exclusive_operations:
      - "POST /franchise/brands — Create brand"
      - "POST /franchise/territories — Create territory"
      - "POST /franchise/territories/{territoryId}/assign — Assign territory"
      - "POST /franchise/franchisees — Create franchisee"
      - "POST /franchise/franchisees/{franchiseeId}/approve — Approve franchisee"
      - "POST /franchise/franchisees/{franchiseeId}/terminate — Terminate franchisee"
      - "POST /franchise/agreements — Create agreement"
      - "POST /franchise/agreements/{agreementId}/execute — Execute agreement"
      - "POST /franchise/agreements/{agreementId}/begin-renewal — Begin renewal"
      - "POST /franchise/agreements/{agreementId}/renew — Renew agreement"
      - "POST /franchise/agreements/{agreementId}/transfer — Transfer agreement"
      - "POST /franchise/agreements/{agreementId}/decline-renewal — Decline renewal"
      - "POST /franchise/development-schedules — Create development schedule"
      - "POST /franchise/development-schedules/{scheduleId}/declare-breach — Declare breach"
      - "POST /franchise/units/{unitId}/reinstate — Reinstate suspended unit"
    shared_operations:
      - "POST /franchise/units (with Franchisee) — Create unit"
      - "POST /franchise/units/{unitId}/open|close (with Franchisee) — Unit operational lifecycle"
      - "POST /franchise/vendor-authorizations (with Franchisee) — Authorize vendor"
      - "POST /franchise/sales-reports (with Franchisee, System) — Ingest POS sales"
      - "POST /franchise/sales-reports/{salesReportId}/accept (with FinanceClerk) — Accept sales report"
      - "POST /franchise/vendors (with ComplianceAuditor) — Create vendor"
      - "POST /franchise/brands/{brandId}/close-period (with FinanceClerk) — Advance period"
      - "POST /franchise/national-accounts (with FinanceClerk) — Create national account"
      - "POST /franchise/royalty-statements (with FinanceClerk) — Create royalty statement"
      - "POST /_clock/set_current_utc — Set logical clock"
      - "GET endpoints — Reads"

  - name: ComplianceAuditor
    description: "Conducts brand-standard audits and manages approved-vendor compliance."
    identity: opaque
    exclusive_operations:
      - "POST /franchise/audits — Schedule audit"
      - "POST /franchise/audits/{auditId}/start — Start audit"
      - "POST /franchise/audits/{auditId}/finalize — Finalize audit"
      - "POST /franchise/audits/{auditId}/open-remediation — Open remediation"
      - "POST /franchise/audits/{auditId}/close — Close audit"
      - "POST /franchise/vendors/{vendorId}/approve — Approve vendor"
      - "POST /franchise/vendors/{vendorId}/revoke — Revoke vendor"
    shared_operations:
      - "POST /franchise/vendors (with Franchisor) — Create vendor"
      - "GET endpoints — Reads"

  - name: Franchisee
    description: "Operates own units: opens/closes units, ingests POS sales, authorizes vendors. Entity-backed; X-User-ID matched to Franchisee.owner_user_id."
    identity: entity_backed:Franchisee
    exclusive_operations: []
    shared_operations:
      - "POST /franchise/units (with Franchisor) — Create own unit"
      - "POST /franchise/units/{unitId}/open|close (with Franchisor) — Own unit lifecycle"
      - "POST /franchise/sales-reports (with Franchisor, System) — Ingest POS sales for own unit"
      - "POST /franchise/vendor-authorizations (with Franchisor) — Authorize vendor for own unit"
      - "GET endpoints — Reads"

  - name: FinanceClerk
    description: "Royalty/rebate settlement: drafts/issues statements, records payments, writes off, distributes rebates."
    identity: opaque
    exclusive_operations:
      - "POST /franchise/royalty-statements/{statementId}/issue — Issue statement"
      - "POST /franchise/royalty-statements/{statementId}/payments — Record payment"
      - "POST /franchise/royalty-statements/{statementId}/write-off — Write off statement"
      - "POST /franchise/national-accounts/{accountId}/distribute — Distribute rebate"
    shared_operations:
      - "POST /franchise/royalty-statements (with Franchisor) — Create royalty statement"
      - "POST /franchise/sales-reports/{salesReportId}/accept (with Franchisor) — Accept sales report"
      - "POST /franchise/brands/{brandId}/close-period (with Franchisor) — Advance period"
      - "POST /franchise/national-accounts (with Franchisor) — Create national account"
      - "GET endpoints — Reads"

  - name: System
    description: "Automated POS polling identity."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /franchise/sales-reports (with Franchisee, Franchisor) — Automated POS ingest"
