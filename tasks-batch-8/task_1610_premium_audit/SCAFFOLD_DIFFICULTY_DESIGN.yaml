            - "appointment [10:30,12:00) fails with error_id ERR_APPOINTMENT_OVERLAP (intersects [09:00,11:00) of ${appt_a})"

      - name: payroll_allocation_closed_interval_overlap
        grounds:
          - calculations.allocation_period_overlap
          - errors[ERR_ALLOCATION_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on the PayrollAllocation resource (different entity and different geometry from
          the auditor calendar): two allocations of the SAME class code sharing only the boundary day 2026-03-31
