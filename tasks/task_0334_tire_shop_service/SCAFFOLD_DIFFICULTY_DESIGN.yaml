            - call: "POST /tire-models"
              payload: { brand: "FALKEN", model_name: "WILDPEAK", size_token: "225/65R17", load_index: 102, speed_rating: "T", unit_price_cents: 13000, mileage_warranty_miles: 60000, original_tread_32nds: 12, stock_qty: 10 }
              as: InventoryManager
