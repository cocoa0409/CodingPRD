              payload: { sku: "OH-1", name: "OnHold Disc Old", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "OH-2", name: "OnHold Disc New", product_form: "COATED", max_operating_speed_rpm: 6500 }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-OH", contract_number: "C-OH", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p1_id}", base_unit_price_cents: 9000 }, { product_id: "${p2_id}", base_unit_price_cents: 9500 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p1_id}", committed_qty: 50 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 5, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "POST /api/products/${p1_id}/discontinue"
              payload: { replacement_product_id: "${p2_id}" }
              as: ProgramAdmin
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { bo_v4: $.data.version, bo_sub: $.data.substitution_status }
          trigger:
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 3, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v4}" }
