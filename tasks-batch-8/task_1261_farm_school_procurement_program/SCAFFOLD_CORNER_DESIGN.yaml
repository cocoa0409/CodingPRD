            - { call: "POST /f2s/planting-agreements/${agr}/sign", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 40 }, as: FarmManager, as_user_id: "${farm}", captures: { del_early: $.data.id } }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-17", quantity: 10 }, as: FarmManager, as_user_id: "${farm}", captures: { del_late: $.data.id } }
          trigger:
            - { call: "POST /f2s/deliveries/${del_late}/check-in", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del_late}/accept", payload: { accepted_quantity: 10 }, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del_early}/check-in", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del_early}/accept", payload: { accepted_quantity: 40 }, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "GET /f2s/planting-agreements/${agr}", payload: {}, as: DistrictProgramAdmin, captures: { delivered: $.data.delivered_quantity } }
          assert:
            - "PlantingAgreement.${agr}.delivered_quantity == 50 despite out-of-order acceptance"

