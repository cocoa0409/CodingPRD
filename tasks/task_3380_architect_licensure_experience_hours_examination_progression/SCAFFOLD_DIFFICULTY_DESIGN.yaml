        distinguishing_aspect: |
          Error-category pair (business_referential, business_constraint) -
          different pair than schedule_conflict_state_beats_temporal: the
          submit violates BOTH the supervisor-active referential rule
          (priority 6) and the work-period-overlap constraint (priority 8);
          ERR_SUPERVISOR_NOT_ACTIVE must win.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C, supervisor S; R1 PJM 40h work 2026-01-05..2026-02-02 already SUBMITTED (occupies the interval)"
            - "S's license patched to INACTIVE before the trigger"
            - "R2 PJM 40h work 2026-01-20..2026-02-20 exists as DRAFT (its interval overlaps R1)"
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_MANAGEMENT", hours: 40, work_period_start: "2026-01-05", work_period_end: "2026-02-02" }, as: Candidate, as_user_id: "${cand_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "PATCH /licensure/supervisors/${sup_id}", payload: { expected_supervisor_version: "${sup_v}", license_status: "INACTIVE" }, as: NcarbAdministrator }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_MANAGEMENT", hours: 40, work_period_start: "2026-01-20", work_period_end: "2026-02-20" }, as: Candidate, as_user_id: "${cand_id}", captures: { r2_id: $.data.id } }
          trigger:
            - { call: "POST /licensure/experience-reports/${r2_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUPERVISOR_NOT_ACTIVE (business_referential, priority 6) not ERR_WORK_PERIOD_OVERLAP (business_constraint, priority 8)"
            - "ExperienceReport.${r2_id}.status == DRAFT (rejected before any stamping)"
  - rule_id: boundary_precision_check
    instances:
      - name: area_minimum_exact_1360_inclusive
        grounds:
          - calculations.experience_completion_gate
          - calculations.area_progress_aggregation
        distinguishing_aspect: |
          Metric: credited area hours. The area minimum comparison is an
          inclusive >=, so PROJECT_PLANNING_DESIGN at exactly 1360 credited
          hours satisfies its gate while 999 does not - exercised through the
          verify endpoint and observed on the summary.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C, supervisor S; PPD report R1 of 999h VERIFIED (area below minimum), PPD report R2 of 361h SUBMITTED"
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 999, work_period_start: "2026-01-05", work_period_end: "2026-03-31" }, as: Candidate, as_user_id: "${cand_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r1_id}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 361, work_period_start: "2026-04-01", work_period_end: "2026-06-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r2_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
          trigger:
            - { call: "POST /licensure/experience-reports/${r2_id}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "GET /licensure/candidates/${cand_id}/summary", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "before R2 verify: area_progress.PROJECT_PLANNING_DESIGN == 999 (< 1360, gate unsatisfied)"
            - "after R2 verify: area_progress.PROJECT_PLANNING_DESIGN == 1360 exactly and the >= boundary is inclusive (area gate satisfied)"
            - "summary.experience_status == IN_PROGRESS, not COMPLETE (five other areas still below minima)"
      - name: rolling_clock_expiry_boundary_day
        grounds:
          - calculations.rolling_clock_validity
          - endpoints.POST /licensure/_maintenance/run_expiry_sweep
        distinguishing_aspect: |
          Metric: days elapsed against the 60-month pass expiry - a different
          metric (time, not hours) reached through a different endpoint (the
          expiry sweep, not verify). current_date == expires_at is EXPIRED
          (inclusive boundary), while expires_at - 1 day keeps the pass valid.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C with exam authorization; division PCM PASSED with passed_at 2026-10-01 (expires_at 2031-10-01)"
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/candidates/${cand_id}/exam-authorizations", payload: { jurisdiction_code: "J1" }, as: BoardAdministrator }
            - { call: "GET /licensure/candidates/${cand_id}/exam-progress", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { div_pcm: "$.data[2].id" } }
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2026-10-01" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pcm}/report-score", payload: { result: "PASS", scaled_score: 75 }, as: NcarbAdministrator }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2031-09-30T00:00:00Z" }, as: NcarbAdministrator }
          trigger:
            - { call: "POST /licensure/_maintenance/run_expiry_sweep", payload: {}, as: NcarbAdministrator, captures: { expired_before: $.data.expired_divisions } }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2031-10-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/_maintenance/run_expiry_sweep", payload: {}, as: NcarbAdministrator, captures: { expired_after: $.data.expired_divisions } }
          assert:
            - "at 2031-09-30 (expires_at - 1 day): sweep expired_divisions == 0 and division status stays PASSED"
            - "at 2031-10-01 (exactly expires_at): sweep expired_divisions == 1 and division status == EXPIRED"
            - "expiry comparison is inclusive at the boundary day (current_date >= expires_at)"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: verify_requires_supervisor_active
        grounds:
          - validations[priority=6]
          - state_machines.ExperienceReport.SUBMITTED_to_VERIFIED
          - entities.Supervisor.fields.license_status
        distinguishing_aspect: |
          Entity pair ExperienceReport -> Supervisor: a report in the correct
          SUBMITTED state still cannot verify while its Supervisor entity sits
          in license_status == INACTIVE; flipping the supervisor back to
          ACTIVE unblocks the identical request.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C, supervisor S; R1 SUBMITTED while S ACTIVE; S then patched INACTIVE"
          setup_api_calls:
