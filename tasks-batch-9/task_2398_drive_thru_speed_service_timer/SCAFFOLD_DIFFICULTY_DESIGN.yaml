  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: timer_loop_parallel_dimensions_advance_independently
        grounds:
          - state_machines.TimerLoop.AT_WINDOW_to_CLOSED
          - state_machines.TimerLoop.PENDING_to_REMAKE_OPEN
          - state_machines.TimerLoop.REMAKE_OPEN_to_REMADE
          - state_machines.TimerLoop.PENDING_to_VERIFIED
          - entities.TimerLoop.fields.timing_state
          - entities.TimerLoop.fields.accuracy_state
          - calculations.loop_adjusted_total
        distinguishing_aspect: |
          Entity is TimerLoop, whose state machine is NOT a single linear chain: two orthogonal
          dimensions (timing_state and accuracy_state) advance from the same request stream, and
          because the accuracy dimension left PENDING before the depart, the declared
          PENDING -> VERIFIED auto-advance inside AT_WINDOW -> CLOSED does not fire, leaving the
          combined state (CLOSED, REMADE) that no linear ordering of the two dimensions can produce.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one SINGLE-lane Restaurant; two StaffMembers (reporter and remaker, distinct for the segregation-of-duties gate); one ACTIVE LUNCH DaypartProfile (25/95/40/75)."
            - "One TimerLoop driven to timing_state AT_WINDOW: arrive 11:00:00Z, greet 11:00:20Z, order-complete 11:01:00Z, window-arrive 11:02:00Z."
            - "While the loop is still AT_WINDOW a WRONG_ITEM AccuracyIncident is logged, moving accuracy_state PENDING -> REMAKE_OPEN (severity MAJOR, penalty_seconds 45, remake_cost_cents 750) with timing_state untouched."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
