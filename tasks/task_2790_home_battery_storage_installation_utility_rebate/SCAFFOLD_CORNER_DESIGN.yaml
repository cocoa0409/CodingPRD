          The review fork is exercised on its REQUEST_REVISION arm: revision_round_count goes to 1 and reviewer_notes are stored, the re-submit overrides heating_va to 4800 so connected_load_kw is recomputed from 21.48 to 19.08, and the join back through APPROVE leaves the count at 1.
