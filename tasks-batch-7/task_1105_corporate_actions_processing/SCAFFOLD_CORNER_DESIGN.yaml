  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role fails at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPD00001", name: "Acme Corp" }, as: "", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

      - name: election_submit_ownership_mismatch_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=5]", "errors[ERR_ACCOUNT_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "AccountHolder A submitting an election naming account B fails with ERR_ACCOUNT_OWNERSHIP_MISMATCH (403) — X-User-ID must equal account_id."
