            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 80000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 16.10, trash_pct: 4.40 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${s_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${t_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
            - { call: "GET /api/campaigns/${camp_id}/pools", as: POOL_ACCOUNTANT, captures: { pool_id: "$.data[0].id" } }
            - { call: "POST /api/pools/${pool_id}/open-accrual", payload: { estimated_pool_value_cents: 700000 }, as: POOL_ACCOUNTANT }
            - { call: "POST /api/tickets/${t_id}/credit", as: POOL_ACCOUNTANT }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T09:00:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/piles/${pile_id}/seal", as: STATION_OPERATOR }
            - { call: "POST /api/piles/${pile_id}/begin-reclaim", as: STATION_OPERATOR }
            - { call: "POST /api/piles/${pile_id}/complete-reclaim", payload: { shipped_lbs: 47328 }, as: STATION_OPERATOR }
            - { call: "POST /api/campaigns/${camp_id}/close", as: COOP_ADMIN }
            - { call: "POST /api/pools/${pool_id}/close", payload: { gross_pool_value_cents: 1000000 }, as: POOL_ACCOUNTANT }
            - { call: "POST /api/settlements/generate", payload: { campaign_id: "${camp_id}" }, as: POOL_ACCOUNTANT, captures: { stm_id: "$.data[0].id" } }
            - { call: "POST /api/settlements/${stm_id}/issue", as: POOL_ACCOUNTANT, captures: { v_issued: $.data.version } }
            - { call: "POST /api/settlements/${stm_id}/dispute", as: MEMBER, as_user_id: "${m1_id}", captures: { v_disputed: $.data.version, st_disputed: $.data.status } }
          trigger:
            - { call: "POST /api/settlements/${stm_id}/revise", payload: { expected_settlement_version: "${v_issued}" }, as: POOL_ACCOUNTANT, captures: { err: $.data.error_id } }
            - { call: "POST /api/settlements/${stm_id}/revise", payload: { expected_settlement_version: "${v_disputed}" }, as: POOL_ACCOUNTANT, captures: { st_revised: $.data.status } }
          assert:
            - "st_disputed == DISPUTED (state precondition for revise holds throughout)"
            - "err == ERR_STALE_VERSION (412) for the ISSUED-era version"
            - "st_revised == DRAFT with the current DISPUTED-era version"

      - name: entity_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[installment-create-stale-pool]", entities.Member]
        distinguishing_aspect: "Member.version starts at 1 and increments by exactly 1 per mutation: suspend -> 2, reinstate -> 3, observable on each response."
        test_recipe:
          setup: ["member created (version 1)"]
          setup_api_calls:
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /api/members/${m_id}/suspend", as: COOP_ADMIN, captures: { v2: $.data.version } }
            - { call: "POST /api/members/${m_id}/reinstate", as: COOP_ADMIN, captures: { v3: $.data.version } }
          assert:
            - "v1 == 1 and v2 == 2 and v3 == 3"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: accept_side_effects_immediately_visible
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.LoadTicket.SAMPLED_to_ACCEPTED]
        distinguishing_aspect: "Immediate consistency: the accept response already carries the final computed fields, and the very next GET on the pile shows stored_lbs updated — no asynchronous lag."
        test_recipe:
          setup: ["campaign, member, station, pile; booking CONFIRMED; ticket weighed 72000/32000 with lab 16.00/2.00 verified"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 16.00, trash_pct: 2.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${s_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
          trigger:
            - { call: "POST /api/tickets/${t_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR, captures: { t_status: $.data.status, t_adj: $.data.adjusted_net_tons_final, t_factor: $.data.final_factor } }
            - { call: "GET /api/piles/${pile_id}", as: STATION_OPERATOR, captures: { p_stored: $.data.stored_lbs } }
            - { call: "GET /api/stations/${st_id}", as: STATION_OPERATOR, captures: { st_received: $.data.received_tons, st_stored: $.data.stored_tons } }
          assert:
            - "t_status == ACCEPTED and t_adj == 20.0000 and t_factor == 1.0000 in the accept response itself"
            - "p_stored == 40000.0 and st_received == 20.0 and st_stored == 20.0 on the immediately following reads"
