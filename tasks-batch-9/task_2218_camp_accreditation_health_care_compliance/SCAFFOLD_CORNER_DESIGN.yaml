      - name: mandatory_score_variant_divergence_on_identical_stored_rows
        claim_type: Variant Divergence
        grounds:
          - calculations.mandatory_compliance_score.variants
        excluded_because:
          difficulty_instance: mandatory_compliance_score_provisional_versus_office_final_diverge
          rationale: "The §1.8 instance already drives one cycle through finalize-scoring and then the decision with INTERVIEW-sourced and NOT_APPLICABLE mandatory rows, asserting the provisional percentage and the final percentage as two different literals off the same stored evaluations. A second corner instance would restate it."

      - name: risk_index_variant_divergence_between_pre_visit_and_post_visit
        claim_type: Variant Divergence
        grounds:
          - calculations.camp_risk_index.variants
        excluded_because:
          difficulty_instance: camp_risk_index_pre_visit_versus_post_visit_diverge
          rationale: "The §1.8 instance reads the risk index on one unchanged camp before and after finalize-scoring and asserts both literals, covering variant selection and the delta in a single walk."

      - name: fee_precision_per_line_rounding_versus_rounding_the_sum
        claim_type: Precision
        grounds:
          - calculations.accreditation_fee_assessment.precision
        excluded_because:
          difficulty_instance: accreditation_fee_assessment_per_line_rounding_beats_sum_then_round
          rationale: "The §1.8 instance is built so that per-line round_half_up and round-after-summation differ by one cent, which is a strictly stronger check on the declared precision than any additional rounding fixture."

      - name: deficiency_tier_boundary_selection_across_the_base_total_breaks
        claim_type: Constants Applied
        grounds:
          - calculations.deficiency_penalty_and_deadline.constants.TIER_BASE_BREAKS
        excluded_because:
          difficulty_instance: deficiency_penalty_and_deadline_tier_from_base_total_not_post_surcharge
          rationale: "The §1.8 instance sits a batch exactly on a TIER_BASE_BREAKS boundary and shows that adding the escalation surcharge does not re-tier the batch, which subsumes a plain tier-boundary walk."

      - name: weighted_percentage_threshold_boundary_for_accredited
        claim_type: Correct Result
        grounds:
          - calculations.accreditation_decision_level.constants.WEIGHTED_ACCREDITED_PCT
        excluded_because:
          difficulty_instance: final_weighted_pct_exactly_95_00_yields_accredited_not_with_correction
          rationale: "The §1.8 instance pins final_weighted_pct to exactly 95.00 and asserts the inclusive branch, which is the only interesting point on that threshold."

      - name: empty_mandatory_denominator_yields_the_declared_constant
        claim_type: Correct Result
        grounds:
          - calculations.mandatory_compliance_score.constants.EMPTY_DENOMINATOR_RESULT
        excluded_because:
          difficulty_instance: zero_denominator_provisional_score_yields_100_00_and_no_deficiency
          rationale: "The §1.8 instance drives every mandatory row out of the provisional denominator and asserts 100.00 with no deficiency raised, covering the guard clause."

      - name: staffing_level_combination_bump_above_the_component_maximum
        claim_type: Correct Result
        grounds:
          - calculations.required_health_staffing_level
        excluded_because:
          difficulty_instance: required_health_staffing_level_combination_bump_promotes_family_camp
          rationale: "The §1.8 instance exercises the three-components-at-rank-two bump that lifts the requirement above the per-component maximum, which is the non-obvious half of this rule; the corner instance above already walks the census and distance breaks."

      - name: travel_commitment_buffer_interval_boundary
        claim_type: Correct Result
        grounds:
          - calculations.visitor_travel_commitment.constants.TRAVEL_BUFFER_DAYS
        excluded_because:
          difficulty_instance: visitor_travel_buffer_rejects_two_day_gap_and_admits_three_day_gap
          rationale: "The §1.8 instance tests the buffer at gap 2 (rejected) and gap 3 (admitted) on the same visitor, which is exactly the interval boundary this claim asks for."

      - name: controlled_dose_window_boundary_at_the_declared_hour_count
        claim_type: Constants Applied
        grounds:
          - calculations.controlled_substance_ledger.constants.CONTROLLED_WINDOW_HOURS
        excluded_because:
          difficulty_instance: controlled_dose_window_half_open_boundary_at_exactly_24_hours
          rationale: "The §1.8 instance places the third dose at exactly the 24-hour mark and one millisecond earlier, pinning the half-open window; the ledger corner instance above covers the stock and role rules."

