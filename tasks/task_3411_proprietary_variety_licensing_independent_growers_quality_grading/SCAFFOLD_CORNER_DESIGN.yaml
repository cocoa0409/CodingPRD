        distinguishing_aspect: "The propagation prohibition is enforced as RBAC: POST /licensing/plant-lots is exclusive to NurseryManager, so a GrowerPrincipal shipping its own plant material is denied 403 ERR_FORBIDDEN_ROLE even for its own ACTIVE agreement."
