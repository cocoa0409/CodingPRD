            - "after close B: status == PROBATION and seasoned_score == 73.43 ((0.4*100 + 0.3*38)/0.7 = 73.4286 -> 73.43; 73.43 < 75.00 so no recovery yet)"
            - "after close C: status == ACTIVE and seasoned_score == 86.22 ((0.4*100 + 0.3*100 + 0.2*38)/0.9 = 86.2222 -> 86.22 >= 75.00 triggers PROBATION -> ACTIVE)"
            - "the loop ACTIVE -> PROBATION -> ACTIVE was traversed (cyclic shape, not a linear pipeline)"

      - name: supply_order_waitlist_promotion_leaves_fulfillment_untouched
        grounds:
          - state_machines.SupplyOrder
          - entities.SupplyOrder.fields.allocation_state
          - entities.SupplyOrder.fields.fulfillment_state
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: the allocation axis cycles
          UNALLOCATED -> WAITLISTED -> RESERVED while the fulfillment axis holds
          at PENDING the entire time — proving the two axes evolve independently.
          Different entity from the Licensee cycle instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-S1 (cap 10), line Alder 89900 ACTIVE, licensees Summit and Prairie both ACTIVE, cycle week 2026-09-07 OPEN."
