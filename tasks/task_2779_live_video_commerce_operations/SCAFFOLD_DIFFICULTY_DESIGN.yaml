              captures: { err_occ: $.data.error_id }
            - call: "POST /carts/${ct1}/checkout"
              payload: { expected_cart_version: "${ct1_v}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { err_empty: $.data.error_id }
          assert:
            - "First checkout: HTTP 412 with ${err_occ} == ERR_STALE_CART_VERSION (not ERR_EMPTY_CART)"
            - "Second checkout with the current version: HTTP 422 with ${err_empty} == ERR_EMPTY_CART"
            - "No Order row exists for Cart.${ct1}; Cart.${ct1}.status == OPEN and Cart.${ct1}.version == ${ct1_v} (unchanged by either rejection)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: go_live_readiness_index_70_passes_69_fails
        grounds:
          - calculations.simulcast_readiness_index
          - validations[priority=23]
          - state_machines.Show.READY_to_LIVE
          - errors[ERR_SIMULCAST_NOT_READY]
        distinguishing_aspect: |
          Metric: Show.simulcast_readiness_index against GO_LIVE_MIN_INDEX = 70 on
          POST /shows/{show_id}/go-live. A single FLAGSHIP_APP channel reporting
          3050 ms yields exactly 69 and the go-live is refused with
          ERR_SIMULCAST_NOT_READY; 3000 ms yields exactly 70 and it succeeds, so the
          gate is >= and not >. The channel stays PROVISIONED at 69 because that is
          still above CHANNEL_FAIL_INDEX = 40, isolating the go-live gate from the
          channel-failure gate.
        test_recipe:
          setup:
            - "Show READY at 17:50Z with one PROVISIONED FLAGSHIP_APP channel (target_latency_ms 1500) that reported 1500 ms / 0.0 frames."
            - "Latency penalty is (latency_ms - 1500) / 50 with no frame or drift penalty on a single channel."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
          trigger:
            - call: "POST /stream-channels/${ch1}/health-reports"
              payload: { latency_ms: 3050, dropped_frame_pct: 0.0 }
              as: ShowProducer
            - call: "POST /shows/${sh1}/go-live"
              payload: {}
              as: ShowProducer
              captures: { err_ready: $.data.error_id }
            - call: "POST /stream-channels/${ch1}/health-reports"
              payload: { latency_ms: 3000, dropped_frame_pct: 0.0 }
              as: ShowProducer
            - call: "POST /shows/${sh1}/go-live"
              payload: {}
              as: ShowProducer
          assert:
            - "After the 3050 ms report: StreamChannel.${ch1}.readiness_index == 69 and Show.${sh1}.simulcast_readiness_index == 69"
            - "StreamChannel.${ch1}.status == PROVISIONED (69 >= CHANNEL_FAIL_INDEX 40, so no FAILED cascade) and Show.${sh1}.status == READY"
            - "First go-live: HTTP 422 with ${err_ready} == ERR_SIMULCAST_NOT_READY"
            - "After the 3000 ms report: StreamChannel.${ch1}.readiness_index == 70 and Show.${sh1}.simulcast_readiness_index == 70"
            - "Second go-live: HTTP 200, Show.${sh1}.status == LIVE, went_live_at == 2026-08-10T17:50:00Z, StreamChannel.${ch1}.status == LIVE"

      - name: host_turnaround_buffer_45_accepted_44_rejected
        grounds:
          - validations[priority=14]
          - errors[ERR_HOST_BOOKING_OVERLAP]
          - entities.HostBooking.fields.call_time_at
          - entities.HostBooking.fields.release_time_at
        distinguishing_aspect: |
          Metric: HOST_TURNAROUND_BUFFER_MIN = 45 minutes measured between one
          booking's release_time_at and the next booking's call_time_at on
          POST /host-bookings — a different metric and a different endpoint from the
          readiness-index boundary. A gap of exactly 45 minutes (20:30Z -> 21:15Z) is
          accepted; 44 minutes (21:14Z) is rejected with ERR_HOST_BOOKING_OVERLAP even
          though the raw half-open intervals do not intersect.
        test_recipe:
          setup:
            - "Host ada-vance is CERTIFIED and booked on show 1 with call_time_at 2026-08-10T17:00:00Z and release_time_at 2026-08-10T20:30:00Z (status PENDING counts for overlap)."
            - "A second show is scheduled 2026-08-10T21:30:00Z - 23:00:00Z."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_show
            - *c_booking
            - call: "POST /shows"
              payload: { title: "Late Silk", scheduled_start_at: "2026-08-10T21:30:00Z", scheduled_end_at: "2026-08-10T23:00:00Z" }
              as: ShowProducer
              captures: { sh2: $.data.id }
          trigger:
            - call: "POST /host-bookings"
              payload: { show_id: "${sh2}", host_id: "${h1}", role: "PRIMARY", call_time_at: "2026-08-10T21:14:00Z", release_time_at: "2026-08-10T23:30:00Z", fee_cents: 40000 }
              as: ShowProducer
              captures: { err_overlap: $.data.error_id }
            - call: "POST /host-bookings"
              payload: { show_id: "${sh2}", host_id: "${h1}", role: "PRIMARY", call_time_at: "2026-08-10T21:15:00Z", release_time_at: "2026-08-10T23:30:00Z", fee_cents: 40000 }
              as: ShowProducer
              captures: { b2: $.data.id }
          assert:
            - "The 21:14:00Z booking is rejected: HTTP 422 with ${err_overlap} == ERR_HOST_BOOKING_OVERLAP (44-minute gap < 45)"
            - "Exactly one HostBooking row exists for Show.${sh2} after both calls"
            - "The 21:15:00Z booking is created: HTTP 201, HostBooking.${b2}.status == PENDING, call_time_at == 2026-08-10T21:15:00Z, fee_cents == 40000"
            - "HostBooking.${b1}.status == PENDING and release_time_at == 2026-08-10T20:30:00Z unchanged"

      - name: free_shipping_at_exactly_7500_merchandise
