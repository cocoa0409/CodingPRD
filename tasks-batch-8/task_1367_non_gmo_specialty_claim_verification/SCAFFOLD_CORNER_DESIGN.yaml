  # ===========================================================================
  - section: calculations
    instances:
      - name: exposure_uses_max_confirmed_result_and_excludes_invalidated
        claim_type: input_set_filtering
        grounds: ["calculations.product_gmo_exposure"]
        distinguishing_aspect: "Per-ingredient resolution is MAX over CONFIRMED samples only: confirming 0.40 then 0.70 moves exposure 40.00 -> 70.00; invalidating the 0.70 sample restores 40.00 because INVALIDATED rows are excluded from the input set."
        test_recipe:
          setup: ["UNDER_EVALUATION product, HIGH_RISK 100% ingredient, INGREDIENT_INTAKE plan required == 1, samples S1 and S2 both created while plan ACTIVE"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.40 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { e1: $.data.confirmed_exposure_pct } }
            - { call: "POST /samples/${s2}/record-result", payload: { result_gmo_pct: 0.70 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s2}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { e2: $.data.confirmed_exposure_pct } }
            - { call: "POST /samples/${s2}/invalidate", as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { e3: $.data.confirmed_exposure_pct } }
          assert:
            - "after confirming 0.40: confirmed_exposure_pct == 40.00"
            - "after confirming 0.70: confirmed_exposure_pct == 70.00 (MAX, not latest-created)"
            - "after invalidating the 0.70 sample: confirmed_exposure_pct == 40.00 (INVALIDATED excluded)"

      - name: brand_probation_at_twenty_points_boundary
        claim_type: constants_applied
        grounds: ["calculations.brand_penalty_points", "entities.Brand.fields.standing_status"]
        distinguishing_aspect: "PROBATION boundary is >= 20: 15 points leaves GOOD_STANDING; adding exactly 5 more (total exactly 20) flips to PROBATION; cascades skip DRAFT products (no license to suspend) while penalty points still accrue."
        test_recipe:
          setup: ["brand with DRAFT products P1, P2; case on P1 substantiated LICENSE_SUSPENSION (+15)"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P2", gtin: "G-P2", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p2: $.data.id } }
            - { call: "POST /enforcement-cases", payload: { product_id: "${p1}", source: "RETEST_FAILURE", description: "d" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { c1: $.data.id } }
            - { call: "POST /enforcement-cases/${c1}/resolve", payload: { outcome: "SUBSTANTIATED", sanction: "LICENSE_SUSPENSION" }, as: EnforcementOfficer, as_user_id: "eo-2" }
          trigger:
            - { call: "GET /brands/${b1}", as: VerifierAdmin, captures: { pts1: $.data.lifetime_penalty_points, st1: $.data.standing_status } }
            - { call: "POST /enforcement-cases", payload: { product_id: "${p2}", source: "CONSUMER_COMPLAINT", description: "d" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { c2: $.data.id } }
            - { call: "POST /enforcement-cases/${c2}/resolve", payload: { outcome: "SUBSTANTIATED", sanction: "WARNING" }, as: EnforcementOfficer, as_user_id: "eo-2" }
            - { call: "GET /brands/${b1}", as: VerifierAdmin, captures: { pts2: $.data.lifetime_penalty_points, st2: $.data.standing_status } }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { p1st: $.data.enrollment_status } }
          assert:
            - "at 15 points: standing_status == GOOD_STANDING (15 < 20)"
            - "at exactly 20 points: standing_status == PROBATION (inclusive >= boundary)"
            - "P1 stays DRAFT throughout (conditional cascade: no ACTIVE license to suspend)"

      - name: trace_score_exactly_min_passes_and_below_blocks
        claim_type: correct_result
        grounds: ["calculations.traceability_score", "errors[ERR_TRACE_SCORE_BELOW_MIN]"]
        distinguishing_aspect: "PASSED gate is inclusive at 95.00: a 95.00 report accepts PASSED; a 94.99 report rejects PASSED with ERR_TRACE_SCORE_BELOW_MIN but still accepts FAILED."
        test_recipe:
          setup: ["brand B1; audit A1 will score exactly 95.00 (190/200); after A1 is decided (terminal), audit A2 will score 94.99 (189.98/200)"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { a1: $.data.id } }
            - { call: "POST /facility-audits/${a1}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-1", captures: { sc1: $.data.traceability_score_pct } }
          trigger:
            - { call: "POST /facility-audits/${a1}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin, captures: { d1: $.data.status } }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-09-01T00:00:00Z" }, as: VerifierAdmin, captures: { a2: $.data.id } }
            - { call: "POST /facility-audits/${a2}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 189.98 } ] }, as: Auditor, as_user_id: "aud-1", captures: { sc2: $.data.traceability_score_pct } }
            - { call: "POST /facility-audits/${a2}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /facility-audits/${a2}/decide", payload: { decision: "FAILED" }, as: VerifierAdmin, captures: { d2: $.data.status } }
          assert:
            - "A1 score == 95.00 and decide PASSED succeeds (status == PASSED) at the inclusive boundary"
            - "A2 score == 94.99 and decide PASSED fails with ERR_TRACE_SCORE_BELOW_MIN"
            - "A2 then accepts FAILED (status == FAILED)"

      - name: rolling_window_exact_365_days_excluded
        claim_type: correct_result
        grounds: ["calculations.brand_penalty_points"]
        excluded_because:
          difficulty_instance: brand_penalty_lifetime_vs_rolling_window
          rationale: "The 365-day exclusion boundary is asserted verbatim in the difficulty instance (rolling == 0 at exactly 365 days)."

      - name: plan_completion_at_exact_required_count
        claim_type: correct_result
        grounds: ["calculations.sampling_plan_completion"]
        excluded_because:
          difficulty_instance: plan_confirm_invalidate_count_conserved
          rationale: "The >= boundary (count 1 == required 1 -> COMPLETED) is asserted in the difficulty instance's first trigger step."

