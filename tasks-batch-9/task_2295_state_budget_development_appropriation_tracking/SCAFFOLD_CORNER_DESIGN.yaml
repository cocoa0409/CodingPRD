            - "the second close returns HTTP 200 with BudgetCycle.${cyc_id}.phase == CLOSED, the boundary being inclusive at exactly start + 12 months"
            - "Appropriation.${appr_id}.authority_status == CLOSED with carryforward_cents == 0 and reverted_cents == 2000000000, because CARRYFORWARD_CAP_PCT[GENERAL] is 0.00"
            - "BudgetCycle.${cyc_id}.total_carryforward_cents == 0 and total_reverted_cents == 2000000000"
            - "the advance-phase after close returns HTTP 409 with error_id == ERR_CYCLE_PHASE_INVALID"
            - "the third close returns HTTP 409 with error_id == ERR_INVALID_STATE, confirming CLOSED is terminal"

      - name: appropriation_enact_twice_is_rejected_on_the_second_attempt
        claim_type: Idempotency
        grounds:
          - state_machines.Appropriation.AUTHORITY_PENDING_to_AUTHORITY_ENACTED
          - validations[priority=11]
          - entities.Appropriation.fields.enacted_amount_cents
        distinguishing_aspect: |
          Non-idempotent action claim: enact is declared only from AUTHORITY_PENDING, so the
          second identical call returns ERR_INVALID_STATE rather than silently re-running the
          side effect — enacted_amount_cents stays at the single value 2000000000 instead of
          doubling.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 advanced to phase LEGISLATIVE with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 introduced 2000000000 with no committee actions, so committee_balance_cents == 2000000000"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
          trigger:
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
          assert:
            - "the first enact returns HTTP 200 with Appropriation.${appr_id}.authority_status == ENACTED and enacted_amount_cents == 2000000000"
            - "the second enact returns HTTP 409 with error_id == ERR_INVALID_STATE"
            - "Appropriation.${appr_id}.enacted_amount_cents is still 2000000000 and cash_status is still UNRELEASED"
            - "Appropriation.${appr_id}.transfers_in_cents == 0, transfers_out_cents == 0, released_cents == 0, expended_cents == 0"

      - name: package_defer_recomputes_the_request_total_only_for_the_deferred_row
        claim_type: Conditional cascade
        grounds:
          - state_machines.DecisionPackage.PROPOSED_to_DEFERRED
          - calculations.agency_request_total
          - entities.AgencyRequest.fields.total_request_cents
        distinguishing_aspect: |
          Conditional-cascade claim: the parent recompute fires on every recommend/defer, but
          the input set excludes only DEFERRED rows — deferring the 300000000 package drops
          the total from 1500000000 to 1200000000 while recommending the 200000000 package
          leaves it unchanged, because RECOMMENDED and PROPOSED are both inside the set.
        test_recipe:
          setup:
            - "Agency DOT and BudgetCycle 2027 in phase DEVELOPMENT"
            - "ACCEPTED AgencyRequest with base_budget_cents 1000000000 carrying TECHNICAL package A of 300000000 at rank 1 and TECHNICAL package B of 200000000 at rank 2, both PROPOSED"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 300000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { pkg_a_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 2, amount_cents: 200000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { pkg_b_id: $.data.id }
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/begin-review"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/accept"
              payload: {}
              as: BudgetAnalyst
          trigger:
            - call: "POST /fiscal/decision-packages/${pkg_a_id}/defer"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/decision-packages/${pkg_b_id}/recommend"
              payload: {}
              as: BudgetAnalyst
          assert:
            - "AgencyRequest.${req_id}.total_request_cents == 1500000000 after the accept, before either trigger call"
            - "after the defer: DecisionPackage.${pkg_a_id}.status == DEFERRED and AgencyRequest.${req_id}.total_request_cents == 1200000000"
            - "after the recommend: DecisionPackage.${pkg_b_id}.status == RECOMMENDED and AgencyRequest.${req_id}.total_request_cents is still 1200000000"
            - "AgencyRequest.${req_id}.base_budget_cents is still 1000000000 and status is still ACCEPTED"

      - name: corner_cyclic_state_machine_loop_count_respected
        claim_type: cyclic
        grounds:
          - state_machines.AgencyRequest.RETURNED_FOR_REVISION_to_SUBMITTED
          - entities.AgencyRequest.fields.revision_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / agency_request_revision_loop_returns_to_submitted_twice
          rationale: "That §1.8 instance already drives the DRAFT -> SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_REVISION -> SUBMITTED loop twice and asserts revision_count == 2 plus the terminal-ACCEPTED lockdown."

      - name: corner_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Appropriation.CASH_UNRELEASED_to_CASH_FROZEN
          - entities.Appropriation.fields.authority_status
          - entities.Appropriation.fields.cash_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / appropriation_authority_and_cash_dimensions_move_independently
          rationale: "That §1.8 instance walks release -> freeze -> unfreeze -> recall on the cash dimension while asserting authority_status stays ENACTED and available_authority_cents stays 2000000000."

      - name: corner_guarded_transition_requires_cross_entity_state
        claim_type: guarded transitions
        grounds:
          - state_machines.Allotment.DRAFT_to_PREPARED
          - validations[priority=13]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allotment_prepare_gated_by_owning_appropriation_cash_status
          rationale: "That §1.8 instance is exactly the guarded-transition claim: the same prepare call fails with ERR_CASH_FROZEN and then succeeds once the guarding Appropriation leaves FROZEN."

      - name: corner_ledger_sync_ancestor_derived_field_reconciles
        claim_type: Ledger sync
        grounds:
          - invariants.released_authority_conservation
          - entities.BudgetCycle.fields.total_released_cents
        excluded_because:
          difficulty_instance: compensating_invariant / recall_restores_released_cash_conservation_across_all_three_ledger_terms
          rationale: "That §1.8 instance asserts the Allotment, Appropriation and BudgetCycle ledger terms before and after the release, which is the ledger-sync claim end to end."

      - name: corner_compensation_undo_reverses_all_side_effects
        claim_type: Compensation
        grounds:
          - state_machines.BudgetTransfer.EXECUTED_to_REVERSED
          - invariants.transfer_authority_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / reverse_restores_cycle_authority_conservation_after_an_executed_transfer
          rationale: "That §1.8 instance asserts transfers_in_cents and transfers_out_cents both return to 0 with no offsetting drift left behind."

      - name: corner_cross_entity_cascade_adjusts_a_second_entity
        claim_type: Cross-entity
        grounds:
          - state_machines.MatchCommitment.COMMITTED_to_AT_RISK
          - entities.Agency.fields.federal_compliance_flag
        excluded_because:
          difficulty_instance: transitive_cascade / transfer_execution_cascades_to_agency_federal_compliance_flag
          rationale: "That §1.8 instance follows the five-level chain from transfer execute through MatchCommitment AT_RISK and FederalGrant SHORTFALL to Agency DEFICIENT."

  # ===========================================================================
  # Section 3 — Calculations (§1.3)
  # ===========================================================================
  - section: calculations
    instances:
      - name: request_total_adds_three_package_types_and_subtracts_reductions
        claim_type: Correct Result
        grounds:
          - calculations.agency_request_total
          - entities.DecisionPackage.fields.package_type
          - entities.AgencyRequest.fields.total_request_cents
        distinguishing_aspect: |
          Exercises all four package_type sign rules in one total: EXPANSION, TECHNICAL and
          FEDERAL_MATCH are additive while REDUCTION is subtractive, so
          1000000000 + 400000000 + 300000000 + 250000000 - 150000000 == 1800000000. A naive
          sum of absolute amounts would yield 2100000000.
        test_recipe:
          setup:
            - "Agency DOT and BudgetCycle 2027 in phase DEVELOPMENT"
            - "DRAFT AgencyRequest with base_budget_cents 1000000000"
            - "Four packages: EXPANSION 400000000 rank 1 (with a PerformanceMeasure), TECHNICAL 300000000 rank 2, FEDERAL_MATCH 250000000 rank 3, REDUCTION 150000000 rank 4"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "EXPANSION", priority_rank: 1, amount_cents: 400000000, fte_delta: 4 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { pkg_exp_id: $.data.id }
            - call: "POST /fiscal/performance-measures"
              payload: { decision_package_id: "${pkg_exp_id}", measure_code: "CLINIC_VISITS", unit: "COUNT", baseline_value: 1000, target_value: 1500 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 2, amount_cents: 300000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "FEDERAL_MATCH", priority_rank: 3, amount_cents: 250000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "REDUCTION", priority_rank: 4, amount_cents: 150000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "GET /fiscal/agency-requests/${req_id}"
              payload: {}
              as: BudgetAnalyst
          assert:
            - "AgencyRequest.${req_id}.total_request_cents == 1800000000"
            - "AgencyRequest.${req_id}.base_budget_cents is still 1000000000, unchanged by the recompute"
            - "AgencyRequest.${req_id}.status == SUBMITTED"
            - "the total is not 2100000000, which would mean REDUCTION was added instead of subtracted"

      - name: moe_current_spend_excludes_federal_fund_charges_and_voided_rows
        claim_type: Input Set Filtering
        grounds:
          - calculations.federal_moe_compliance
          - entities.FederalGrant.fields.moe_current_spend_cents
          - endpoints[POST /fiscal/federal-grants/{id}/moe-assessment]
        distinguishing_aspect: |
          Input-set claim: three charges exist totalling 600000000, but only the single
          POSTED GENERAL-fund charge of 300000000 is MOE-eligible — the FEDERAL-fund charge
          of 200000000 is excluded by fund_type and the VOIDED GENERAL charge of 100000000 is
          excluded by status. Against a baseline of 350000000 the correct filter yields
          DEFICIENT while any looser filter would yield COMPLIANT.
        setup_note: "Full eleven-call chain to phase EXECUTION plus a second FEDERAL-fund appropriation, two released allotments and three expenditures."
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 in phase EXECUTION with ADOPTED GENERAL revenue of 10000000000 cents; logical clock at the default 2026-08-01 (quarter 1)"
            - "GENERAL Appropriation P100 enacted 2000000000 with quarter-1 allotment 440000000 RELEASED"
            - "FEDERAL Appropriation P200 enacted 1000000000 with quarter-1 allotment 250000000 RELEASED"
            - "FederalGrant on the same agency and cycle with moe_baseline_cents 350000000"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_gen_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_gen_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "FEDERAL", program_code: "P200", introduced_amount_cents: 1000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_fed_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_fed_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_gen_id}", quarter: 1, requested_cents: 440000000 }
              as: BudgetAnalyst
              captures: { alt_gen_id: $.data.id }
            - call: "POST /fiscal/allotments/${alt_gen_id}/prepare"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/allotments/${alt_gen_id}/approve"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/allotments/${alt_gen_id}/release"
              payload: {}
              as: StateController
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_fed_id}", quarter: 1, requested_cents: 250000000 }
              as: BudgetAnalyst
              captures: { alt_fed_id: $.data.id }
            - call: "POST /fiscal/allotments/${alt_fed_id}/prepare"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/allotments/${alt_fed_id}/approve"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/allotments/${alt_fed_id}/release"
              payload: {}
              as: StateController
            - call: "POST /fiscal/expenditures"
              payload: { appropriation_id: "${appr_gen_id}", quarter: 1, amount_cents: 300000000, object_code: "OC100", vendor_reference: "INV-1" }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/expenditures"
              payload: { appropriation_id: "${appr_gen_id}", quarter: 1, amount_cents: 100000000, object_code: "OC100", vendor_reference: "INV-2" }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { exp_void_id: $.data.id }
            - call: "POST /fiscal/expenditures"
              payload: { appropriation_id: "${appr_fed_id}", quarter: 1, amount_cents: 200000000, object_code: "OC200", vendor_reference: "INV-3" }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/expenditures/${exp_void_id}/void"
              payload: { reason: "duplicate invoice" }
              as: StateController
            - call: "POST /fiscal/federal-grants"
              payload: { agency_id: "${ag_id}", budget_cycle_id: "${cyc_id}", cfda_number: "93.778", award_cents: 800000000, period_start: "2026-07-01T00:00:00Z", period_end: "2027-07-01T00:00:00Z", moe_baseline_cents: 350000000, required_match_ratio: 0.25 }
              as: BudgetAnalyst
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /fiscal/federal-grants/${grant_id}/moe-assessment"
              payload: { basis: "SINGLE_YEAR" }
              as: BudgetAnalyst
          assert:
            - "FederalGrant.${grant_id}.moe_current_spend_cents == 300000000, not 400000000 and not 600000000"
            - "FederalGrant.${grant_id}.moe_assessed_basis == SINGLE_YEAR"
            - "FederalGrant.${grant_id}.moe_compliance_status == DEFICIENT because 300000000 < 350000000"
            - "FederalGrant.${grant_id}.moe_compliance_ratio == 0.857143, round_half_up(300000000 / 350000000, 6)"
            - "Appropriation.${appr_gen_id}.expended_cents == 300000000 after the void, and Appropriation.${appr_fed_id}.expended_cents == 200000000"

      - name: late_low_sequence_restore_action_rewrites_every_later_running_balance
        claim_type: chronological
        grounds:
          - calculations.committee_running_balance
          - entities.CommitteeAction.fields.running_balance_cents
          - entities.Appropriation.fields.committee_balance_cents
        distinguishing_aspect: |
          Chronological-replay claim with an out-of-order insert in the middle of an existing
          chain: actions arrive at sequence 1, 2, 4 and then 3. Because the replay is ordered
          by sequence_number and RESTORE resets the balance to introduced_amount_cents rather
          than adjusting it, inserting sequence 3 rewrites the already-stored
          running_balance_cents of sequence 4 from 2000000000 to 1800000000.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 advanced to phase LEGISLATIVE with an ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 introduced 2000000000, still PENDING"
            - "Committee actions already recorded at sequence 1 (INCREASE 500000000), sequence 2 (DECREASE 300000000) and sequence 4 (DECREASE 200000000)"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "HOUSE", committee_name: "Appropriations", action_type: "INCREASE", amount_cents: 500000000, sequence_number: 1 }
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "HOUSE", committee_name: "Appropriations", action_type: "DECREASE", amount_cents: 300000000, sequence_number: 2 }
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "SENATE", committee_name: "Finance", action_type: "DECREASE", amount_cents: 200000000, sequence_number: 4 }
              as: LegislativeFiscalOfficer
          trigger:
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "SENATE", committee_name: "Finance", action_type: "RESTORE", amount_cents: 0, sequence_number: 3 }
              as: LegislativeFiscalOfficer
            - call: "GET /fiscal/appropriations/${appr_id}/committee-actions"
              payload: {}
              as: LegislativeFiscalOfficer
          assert:
            - "before the trigger, running_balance_cents was 2500000000 / 2200000000 / 2000000000 at sequences 1 / 2 / 4 and committee_balance_cents was 2000000000"
            - "after the trigger the list, ordered by sequence_number, returns running_balance_cents 2500000000, 2200000000, 2000000000, 1800000000 for sequences 1, 2, 3, 4"
            - "the sequence-3 RESTORE row carries running_balance_cents == 2000000000, equal to introduced_amount_cents, not 2200000000"
            - "the sequence-4 row was rewritten from 2000000000 to 1800000000"
            - "Appropriation.${appr_id}.committee_balance_cents == 1800000000 and authority_status is still PENDING"

