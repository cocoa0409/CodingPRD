  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # Three instances over three DIFFERENT entity pairs:
  #   7.1  Lease            <- MoveInInspection   (priority 30)
  #   7.2  DisplacementLodging <- HazardCase      (priority 26)
  #   7.3  HazardCase       <- WorkOrder          (priority 19, via the
  #        CLEARANCE_PENDING state only the remediation order can unlock)
  # In each case the blocked operation's OWN entity is in a perfectly legal
  # state; only the OTHER entity's state forbids it.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: move_in_gated_on_move_in_inspection_critical_deficiency_clearing
        grounds:
          - validations[priority=30]
          - entities.MoveInInspection.fields.critical_open_count
          - entities.MoveInInspection.fields.deficiencies
          - state_machines.MoveInInspection.TENANT_ACKNOWLEDGED_to_COMPLETED
          - state_machines.Lease.PENDING_MOVE_IN_to_OCCUPIED
          - endpoints.POST_/move-in-inspections/{id}/tenant-acknowledge
        distinguishing_aspect: |
          The Lease is in PENDING_MOVE_IN, its application is HOUSED, its unit
          is ASSIGNED and its BahRate row is on file — every condition the Lease
          itself controls is satisfied. Move-in is nevertheless refused because a
          DIFFERENT entity, the MoveInInspection, still reports
          critical_open_count 1, and the only way to clear that counter is to
          complete the WorkOrder the acknowledgment spawned. The pair here is
          Lease <- MoveInInspection; the other two instances of this rule use
          disjoint pairs. A non-critical COSMETIC deficiency left permanently
          OPEN proves the gate keys on critical_open_count and not on
          deficiency_count.
        test_recipe:
          setup:
            - "One installation, a BahRate row for E5 / with_dependents true / 2026 (245000, 19500), one 2-bedroom TOWNHOME unit designated JUNIOR_ENLISTED."
            - "One E5 sponsor with three full-time-custody dependents; the application was offered the unit and ACCEPTED it, and lease 1 exists in PENDING_MOVE_IN / NOT_STARTED with rent_basis OFFER_PROVISIONAL, gross_rent_cents 237650, net_rent_cents 218150."
            - "A MoveInInspection is scheduled for 2026-08-31; the walk-through logs two deficiencies — a HABITABILITY_CRITICAL NO_HEAT entry and a COSMETIC entry."
