        claim_type: derived_field_reconciliation
        grounds: [entities.Client.fields.no_show_strikes, state_machines.Appointment.SCHEDULED_to_NO_SHOW]
        excluded_because:
          difficulty_instance: compensating_invariant / no_show_then_waive_conserves_strikes
