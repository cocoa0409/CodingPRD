        excluded_because:
          difficulty_instance: coverage_requirement_provisional_vs_final_diverge_on_actuals
          rationale: "PROVISIONAL vs FINAL divergence, EM-share-cap crediting, and attainment computation are asserted with literal values by the named §1.8 instance."

