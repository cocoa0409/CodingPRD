      # ---- priority and cross-entity rows carried by §1.8 --------------------
      - name: priority_ordering_walk
        claim_type: priority_ordering
        grounds:
          - validations
        distinguishing_aspect: "When two rules are violated at once the ladder must answer with the lower-numbered rule's error."
        excluded_because:
          difficulty_instance: escheated_state_p11_beats_payout_minimum_p39
          rationale: "That §1.8 instance violates priority 11 and priority 39 in the same request and asserts the priority-11 error, which is the ordering claim."

      - name: priority_conflict_walk
        claim_type: priority_conflict
        grounds:
          - validations[priority 19]
          - validations[priority 30]
        distinguishing_aspect: "A deadline rule and an eligibility rule can both be violated by one election; only the earlier one may answer."
        excluded_because:
          difficulty_instance: election_deadline_p19_beats_disposition_eligibility_p30
          rationale: "That §1.8 instance drives an ART piece past its election deadline so both p19 and p30 are violated, and asserts ERR_ELECTION_DEADLINE_PASSED rather than ERR_DISPOSITION_NOT_ELIGIBLE."

      - name: cross_entity_validation_walk
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 14]
          - entities.ConsignmentAgreement.fields.status
        distinguishing_aspect: "Placement validity depends on the state of a different entity, the governing agreement, and must be tested in both directions."
        excluded_because:
          difficulty_instance: placement_blocked_by_expired_governing_agreement
          rationale: "That §1.8 instance places one piece while the agreement is ACTIVE and refuses the identical call after the markdown-run expires it, covering the valid and invalid sides of the cross-entity check."

  # ==========================================================================
  # 5. ENDPOINTS
  # ==========================================================================
  - section: endpoints
    instances:
      - name: consignor_create_read_list_and_patch_all_work
        claim_type: standard_crud
        grounds:
          - endpoints[POST /consignors]
          - endpoints[GET /consignors/{id}]
          - endpoints[GET /consignors]
          - endpoints[PATCH /consignors/{id}]
        distinguishing_aspect: "The Consignor aggregate is the only one with a PATCH, and the patch is partial: sending only floor_number and has_elevator must leave display_name, email and payout_method untouched while bumping version from 1 to 2. There is deliberately no DELETE anywhere in §1.5, so the C-R-U triple is the whole surface."
        test_recipe:
          setup:
            - "an empty database; one consignor Alpha created at floor 1 without an elevator and with the default payout_method"
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "GET /consignors/${cons_id}"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "GET /consignors"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "PATCH /consignors/${cons_id}"
              payload: { floor_number: 5, has_elevator: true }
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "the create call returned HTTP 201 with version == 1; the read returned HTTP 200 with the same id and display_name \"Alpha\"; the list returned HTTP 200 with total_count == 1 and has_more == false"
            - "the patch returns HTTP 200 with data.floor_number == 5, data.has_elevator == true and data.version == 2"
            - "data.display_name == \"Alpha\", data.email == \"alpha@example.com\", data.address_line == \"1 A St\" and data.payout_method == \"ACH\", all untouched by the partial patch"
            - "GET /consignors/${cons_id} reports unclaimed_balance_cents == 0, status \"ACTIVE\" and escheat_state \"NONE\""

      - name: closing_a_zone_flips_its_status_without_moving_the_pieces_in_it
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /floor-zones/{id}/close].side_effects
          - entities.FloorZone.fields.status
        distinguishing_aspect: "The close action is a status-only write: occupied_sqft stays at 20 and the piece keeps its placement_zone_id, so a CLOSED zone still reports the square footage it holds. Only new placements and new counts are barred."
        test_recipe:
          setup:
            - "consignor Alpha at floor 1 without an elevator on an ACTIVE STD-2026 agreement with one step at offset 0"
            - "one CASEGOOD piece declared 60000 at 12 cuft and 20 sqft, screened, collected on a completed 2-mover job (12000 + ceil(12/10)*2500 == 17000, cap 21000 not binding), received and placed in Front A (capacity 200) under TAG-001"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
