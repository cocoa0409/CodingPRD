        claim_type: permission_denied
        grounds: ["roles[PayrollClerk]", "roles[PlantManager]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Segregation-of-duties role split at the endpoint level: decide rejects PayrollClerk; calculate rejects PlantManager — regardless of user ids."
        test_recipe:
          setup: ["run r1 OPEN; run r2 OPEN-then-CALCULATED by u-pc1"]
          setup_api_calls:
            - { call: "POST /payroll-runs", payload: { period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollClerk, as_user_id: u-pc1, captures: { pr1: $.data.id, pr1_v: $.data.version } }
