          Approving a request removes it from the allocation's eligible set (only SCORED requests count),
          so a re-run of allocate gives the approved request's facility no row at all and supersedes the
          one it had — leaving an APPROVED request that can never be funded. The error is about the
          MISSING (non-superseded) row, not about capacity.
