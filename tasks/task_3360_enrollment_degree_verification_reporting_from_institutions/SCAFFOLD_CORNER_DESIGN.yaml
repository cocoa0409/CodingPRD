            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /verification-requests", payload: { student_id: "${st1}", institution_id: "${inst_id}", product_type: "TRANSCRIPT", purpose: "SELF" }, as: Learner, as_user_id: "${st1}", captures: { t1: "$.data.id" } }
            - { call: "POST /verification-requests", payload: { student_id: "${st1}", institution_id: "${inst_id}", product_type: "TRANSCRIPT", purpose: "SELF" }, as: Learner, as_user_id: "${st1}", captures: { t2: "$.data.id" } }
          trigger:
