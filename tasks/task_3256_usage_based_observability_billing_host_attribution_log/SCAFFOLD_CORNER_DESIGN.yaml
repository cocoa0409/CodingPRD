  # =========================================================================
  - section: errors
    instances:
      - name: duplicate_host_hour_record_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DUPLICATE_HOST_HOUR
        distinguishing_aspect: "A second HostHourRecord for the same (period, hour_bucket_utc) is rejected 409 ERR_DUPLICATE_HOST_HOUR — uniqueness on the natural key."
        test_recipe:
          setup:
            - "Period OPEN; one host-hour record already ingested for 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
