scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 - dual_variant_calc
  # Two dual-variant calcs on DIFFERENT entity domains:
  #   (i)  delivery_provisional_charge vs delivery_final_charge  (Delivery: cost accounting)
  #   (ii) client_satisfaction_score variants                    (Client: subject scoring)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: delivery_provisional_vs_final_diverge
        grounds:
          - calculations.delivery_provisional_charge
          - calculations.delivery_final_charge
          - state_machines.Delivery.DISPUTED_to_FINALIZED
          - entities.Delivery.fields.provisional_cents
          - entities.Delivery.fields.final_cents
          - entities.Delivery.fields.dispute_credit_cents
        distinguishing_aspect: |
          Same DeliveryLine set, same unit_price_cents_snapshot, but planned_units
          (provisional) diverges from actual_units (final) after a short-ship
          dispute; Delivery.provisional_cents != Delivery.final_cents. Domain:
          Delivery cost accounting.
        test_recipe:
          setup:
            - "clock at 2026-06-01T00:00:00Z"
            - "one Client with a ClientAdmin identity; one ACTIVE Subscription with an OPEN RotationCycle"
            - "one PANTRY Location (service_fee_bps=0) with two ParLevels: (productA, par=10) and (productB, par=5); productA.unit_cost_cents=100, productB.unit_cost_cents=200"
            - "one SCHEDULED Delivery generated under the OPEN cycle"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "STARTER", billing_type: "FLAT", flat_fee_cents: 5000, volume_discount_threshold_headcount: 50 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "AcmeCo", headcount: 20 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "HQ Pantry", kind: "PANTRY", capacity_units: 100 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "A-100", name: "Chips", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prodA_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "B-200", name: "Bars", category: "SNACK", unit_cost_cents: 200 }
              as: PlatformAdmin
              captures: { prodB_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prodA_id}", par_units: 10 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prodB_id}", par_units: 5 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
              captures: { delv_id: "$.data.id" }
          trigger:
            - call: "POST /deliveries/${delv_id}/dispatch"
              payload: {}
              as: PlatformAdmin
              captures: { prov_after_dispatch: "$.data.provisional_cents" }
            - call: "POST /deliveries/${delv_id}/confirm"
              payload: {}
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /deliveries/${delv_id}/dispute"
              payload: { dispute_reason: "short-shipped product A" }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "GET /deliveries/${delv_id}/lines"
              payload: {}
              as: PlatformAdmin
              captures: { line0_id: "$.data[0].id", line1_id: "$.data[1].id" }
            - call: "PATCH /delivery-lines/${line0_id}/actual"
              payload: { actual_units: 8 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "PATCH /delivery-lines/${line1_id}/actual"
              payload: { actual_units: 5 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /deliveries/${delv_id}/resolve-dispute"
              payload: {}
              as: PlatformAdmin
              captures: { fin_cents: "$.data.final_cents", prov_cents: "$.data.provisional_cents", credit_cents: "$.data.dispute_credit_cents" }
          assert:
            # Line0 (prodA): planned=10 * 100 = 1000; actual=8 * 100 = 800.
            # Line1 (prodB): planned=5 * 200 = 1000; actual=5 * 200 = 1000.
            # PANTRY -> fee_line=0 each. Both planned<100 -> discount=0 each.
            # provisional_cents = 1000 + 1000 = 2000; final_cents = 800 + 1000 = 1800.
            # dispute_credit_cents = (10-8)*100 + 0 = 200.
            - "prov_cents == 2000"
            - "fin_cents == 1800"
            - "credit_cents == 200"
            - "prov_cents != fin_cents"

      - name: client_satisfaction_score_variants_diverge
        grounds:
          - calculations.client_satisfaction_score
          - entities.Feedback.fields.rating
          - entities.Feedback.fields.swap_suggestion_product_id
          - entities.ParLevel
        distinguishing_aspect: |
          Same Feedback rows on Client, but provisional_all_feedback (all feedback)
          and authoritative_stocked_feedback (only feedback whose product is in a
          ParLevel) count different denominators, yielding different scores.
          Domain: Client subject scoring (weighted rating), NOT cost accounting.
        test_recipe:
          setup:
            - "clock at 2026-06-01T00:00:00Z"
            - "one Client (headcount=10) with one PANTRY Location"
            - "productA is in a ParLevel; productC is NOT in any ParLevel"
            - "3 feedback rows: (productA, rating=5, no swap), (productA, rating=3, swap=B), (productC, rating=1, no swap)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "SnackCo", headcount: 10 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "Pantry-A", kind: "PANTRY", capacity_units: 50 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "SKU-A", name: "ChipsA", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prodA_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "SKU-B", name: "BarsB", category: "SNACK", unit_cost_cents: 150 }
              as: PlatformAdmin
              captures: { prodB_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "SKU-C", name: "OldC", category: "SNACK", unit_cost_cents: 200 }
              as: PlatformAdmin
              captures: { prodC_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prodA_id}", par_units: 5 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/feedback"
              payload: { product_id: "${prodA_id}", rating: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/feedback"
              payload: { product_id: "${prodA_id}", rating: 3, swap_suggestion_product_id: "${prodB_id}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/feedback"
              payload: { product_id: "${prodC_id}", rating: 1 }
              as: ClientAdmin
              as_user_id: "${client_id}"
          trigger:
            - call: "GET /clients/${client_id}/satisfaction"
              payload: { variant: "authoritative_stocked_feedback" }
              as: PlatformAdmin
              captures: { auth_score: "$.data.score", auth_count: "$.data.feedback_considered" }
            - call: "GET /clients/${client_id}/satisfaction"
              payload: { variant: "provisional_all_feedback" }
              as: PlatformAdmin
              captures: { prov_score: "$.data.score", prov_count: "$.data.feedback_considered" }
          assert:
            # authoritative excludes productC (not in ParLevel):
            #   numerator = 5*1 + 3*2 = 11 ; denominator = 1 + 2 = 3
            #   score = round_half_up_2dp(11/3) = 3.67
            - "auth_score == 3.67"
            - "auth_count == 2"
            # provisional includes productC:
            #   numerator = 5*1 + 3*2 + 1*1 = 12 ; denominator = 1 + 2 + 1 = 4
            #   score = round_half_up_2dp(12/4) = 3.00
            - "prov_score == 3.00"
            - "prov_count == 3"
            - "auth_score != prov_score"

  # =========================================================================
  # Rule 2 - combinatorial_formula
  # (a) subscription_fee_tiered_multi_input  - 4+ inputs, branch on billing_type, tiered threshold
  # (b) delivery_provisional_per_line_rounding_order - per-line rounding vs sum-then-round diverges
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: subscription_fee_tiered_multi_input
        grounds:
          - calculations.subscription_fee
          - state_machines.RotationCycle.OPEN_to_CLOSED
          - entities.Plan.fields.billing_type
          - entities.Plan.fields.volume_discount_threshold_headcount
          - entities.Plan.fields.volume_discount_pct
          - entities.Client.fields.headcount
          - entities.Invoice.fields.subscription_fee_cents
        distinguishing_aspect: |
          Mode (a): 4-input non-linear formula. Result depends on branch
          (billing_type FLAT vs PER_EMPLOYEE), threshold comparison
          (>= volume_discount_threshold_headcount is inclusive), and
          a multiplication (per_employee_fee * headcount) discounted by
          volume_discount_pct. Not a simple aggregation.
        test_recipe:
          setup:
            - "clock advanced to 2026-07-15T00:00:00Z (after cycle window)"
            - "Plan: PER_EMPLOYEE, base_fee=5000, per_employee=200, threshold=50, discount_pct=0.10"
            - "Client headcount=100 (>=50 threshold, discount active)"
            - "ACTIVE Subscription with one OPEN RotationCycle scheduled to expire"
            - "no Deliveries created (invoice_consumption == 0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "GROWTH", billing_type: "PER_EMPLOYEE", base_fee_cents: 5000, per_employee_fee_cents: 200, volume_discount_threshold_headcount: 50, volume_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "BigCo", headcount: 100 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "HQ", kind: "PANTRY", capacity_units: 50 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "SKU-1", name: "Chips", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 5 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rotation-cycles/${rc0_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data.id", sub_fee: "$.data.subscription_fee_cents", cons: "$.data.consumption_cents", tot: "$.data.total_cents" }
          assert:
            # raw_per_employee = 200 * 100 = 20000
            # discounted = 20000 * 0.90 = 18000 (integer, no rounding)
            # subscription_fee_cents = 5000 + 18000 = 23000
            - "sub_fee == 23000"
            - "cons == 0"
            - "tot == 23000"

      - name: delivery_provisional_per_line_rounding_order
        grounds:
          - calculations.delivery_provisional_charge
          - entities.DeliveryLine.fields.unit_price_cents_snapshot
          - entities.DeliveryLine.fields.service_fee_bps_snapshot
          - entities.Location.fields.service_fee_bps
          - entities.Location.fields.kind
          - state_machines.Delivery.SCHEDULED_to_EN_ROUTE
        distinguishing_aspect: |
          Mode (b): scaffold pins per-line rounding of service fee BEFORE summation.
          Two lines whose raw*bps produces a 0.5-cent remainder each yield
          per-line-rounded fee = 8+8 = 16, but sum-then-round of (200*0.075=15)
          yields 15 -- the two orderings diverge by 1 cent, so the scaffold's
          chosen order is empirically distinguishable.
        test_recipe:
          setup:
            - "clock at 2026-06-01T00:00:00Z"
            - "one MICRO_MARKET Location with service_fee_bps=750; two ParLevels, each planned to ship 1 unit at price=100 cents"
            - "no bulk discount (planned<100)"
            - "SCHEDULED Delivery about to dispatch"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "STARTER", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 50 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "MMCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "MM", kind: "MICRO_MARKET", capacity_units: 20, service_fee_bps: 750 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "X-1", name: "X", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prodX_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "Y-1", name: "Y", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prodY_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prodX_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prodY_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
              captures: { delv_id: "$.data.id" }
          trigger:
            - call: "POST /deliveries/${delv_id}/dispatch"
              payload: {}
              as: PlatformAdmin
              captures: { prov: "$.data.provisional_cents" }
          assert:
            # Per line: raw=1*100=100, fee=round_half_up(100 * 0.075)=round_half_up(7.5)=8, disc=0
            # line_cents = 100 + 8 = 108 (each line)
            # provisional_cents = 108 + 108 = 216
            # (Sum-then-round would give: 200*0.075=15; total 200+15=215 -- differs by 1)
            - "prov == 216"

  # =========================================================================
  # Rule 3 - non_linear_state_machine
  # (i) Subscription: cyclic (ACTIVE <-> PAUSED)
  # (ii) Invoice: parallel dimensions (payment_status x dispute_status)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: subscription_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Cycle A->B->A: ACTIVE -> PAUSED -> ACTIVE. The state machine allows a
          loop, distinguishing it from a linear pipeline. Occurs on Subscription
          (an entity distinct from Invoice used in the other Rule 3 instance).
        test_recipe:
          setup:
            - "clock at 2026-06-01T00:00:00Z"
            - "ACTIVE Subscription for a client, no deliveries yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "STARTER", billing_type: "FLAT", flat_fee_cents: 5000, volume_discount_threshold_headcount: 50 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "Loopy", headcount: 8 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "Loc-1", kind: "PANTRY", capacity_units: 10 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "L-1", name: "L", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { st_active1: "$.data.status" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { st_paused: "$.data.status" }
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { st_active2: "$.data.status" }
          assert:
            - "st_active1 == 'ACTIVE'"
            - "st_paused == 'PAUSED'"
            - "st_active2 == 'ACTIVE'"

      - name: invoice_parallel_payment_dispute_dimensions
        grounds:
          - state_machines.Invoice.UNPAID_to_PAID
          - state_machines.Invoice.CLEAN_to_UNDER_DISPUTE
          - state_machines.Invoice.UNDER_DISPUTE_to_RESOLVED
          - entities.Invoice.fields.payment_status
          - entities.Invoice.fields.dispute_status
        distinguishing_aspect: |
          Two independent state dimensions on the same Invoice row: payment_status
          (UNPAID/PAID/DEFAULT) and dispute_status (CLEAN/UNDER_DISPUTE/RESOLVED)
          evolve independently. Different entity from the cyclic Subscription case.
        test_recipe:
          setup:
            - "clock at 2026-07-05T00:00:00Z"
            - "one closed RotationCycle producing an Invoice with payment_status=UNPAID, dispute_status=CLEAN"
            - "test pays the invoice; payment_status flips PAID while dispute_status stays CLEAN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "FLAT-A", billing_type: "FLAT", flat_fee_cents: 3000, volume_discount_threshold_headcount: 50 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "ParaCo", headcount: 12 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "P-A", name: "PA", category: "SNACK", unit_cost_cents: 50 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rotation-cycles/${rc0_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data.id", pay0: "$.data.payment_status", disp0: "$.data.dispute_status" }
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { pay1: "$.data.payment_status", disp1: "$.data.dispute_status" }
          assert:
            - "pay0 == 'UNPAID'"
            - "disp0 == 'CLEAN'"
            - "pay1 == 'PAID'"
            - "disp1 == 'CLEAN'"

  # =========================================================================
  # Rule 4 - transitive_cascade
  # (i) Subscription.pause: depth-3+ chain Sub -> RC -> Delivery -> Client
  # (ii) Delivery.resolve-dispute: depth-2 chain Delivery -> Client
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: subscription_pause_depth3_cascade
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.RotationCycle.OPEN_to_INVALIDATED
          - state_machines.Delivery.EN_ROUTE_to_CANCELLED
          - entities.Client.fields.credit_balance_cents
          - entities.Delivery.fields.status
          - entities.RotationCycle.fields.status
        distinguishing_aspect: |
          Depth-3+ chain, each hop caused by the previous hop's mutation, not by
          the origin action. Hop 1: Subscription.pause -> RC.OPEN_to_INVALIDATED
          (caused by Sub mutation). Hop 2: RC.INVALIDATED -> Delivery.CANCELLED
          (caused by RC mutation). Hop 3: Delivery.EN_ROUTE_to_CANCELLED credits
          client.credit_balance_cents (caused by Delivery mutation). Origin
          trigger is Subscription.pause.
        test_recipe:
          setup:
            - "ACTIVE Subscription, OPEN RotationCycle, one EN_ROUTE Delivery with provisional_cents=1000, client.credit_balance_cents starts at 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
