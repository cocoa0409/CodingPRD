# =============================================================================
# Scaffold Difficulty Design — task 2772 Zoological Animal Transfer & Species
# Survival Planning. Test-targeting index for the nine §0.5 Difficulty Rules.
#
# Shared fixture facts every instance below relies on (all literals pinned):
#   * The logical clock starts at 2026-08-01T00:00:00Z with no clock call.
#   * Sender    "Cedar Ridge Zoo"  US-CA, ACCREDITED, 40 slots, policy on file.
#   * Receiver  "Harbor Bay Zoo"   US-TX, ACCREDITED, 40 slots, policy on file.
#     -> transfer_scope derives to INTERSTATE (same country, different code).
#   * Programme "Panthera uncia", SSP_RED (PROGRAM_WEIGHT 1.0), target 300.
#   * M1 male   birth 2019-05-10, founder_representation_pct 12.45, at sender.
#   * F1 female birth 2020-03-15, founder_representation_pct 30.00, at receiver.
#   * With exactly those two animals accessioned, a BREED_WITH recommendation on
#     M1 x F1 with no shared pedigree scores demographic_need_index 0.9593 and
#     genetic_value_score 95.93 (gap_ratio 0.993333, founder_scarcity 0.8755,
#     kinship_relief 1.0000).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pedigree_only_vs_molecular_projected_inbreeding
        grounds:
          - calculations.kinship_and_pairing_verdict
          - entities.PopulationRecommendation.fields.projected_offspring_inbreeding
          - entities.PopulationRecommendation.fields.pairing_verdict
          - state_machines.PopulationRecommendation.PROPOSED_to_SUPERSEDED
        distinguishing_aspect: |
          This dual variant lives on the genetics domain (PopulationRecommendation over a pair of
          Animals): the identical unrelated pair scores projected_offspring_inbreeding 0.0000 and
          verdict RECOMMENDED under analysis_mode PEDIGREE_ONLY, and 0.1280 with verdict
          NOT_RECOMMENDED under PEDIGREE_PLUS_MOLECULAR, because the molecular variant blends
          MOLECULAR_WEIGHT 0.40 of the marker similarity into a coefficient the pedigree variant
          cannot see at all.
        test_recipe:
          setup:
            - "Clock left at its 2026-08-01T00:00:00Z default."
            - "Sender and receiver institutions registered, SSP_RED programme published on cycle 1."
            - "M1 (male, unrelated) at the sender and F1 (female, unrelated) at the receiver; neither carries sire_id or dam_id, so pedigree kinship between them is 0.0000."
            - "One PEDIGREE_ONLY recommendation is raised on M1 x F1, then a second PEDIGREE_PLUS_MOLECULAR recommendation on the same pair in the same cycle supersedes it; both rows stay readable."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /species-programs/${program_id}/publish-plan"
              payload: { publication_note: "Cycle 1 published" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id, m1_v1: $.data.version }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${receiver_id}", owning_institution_id: "${receiver_id}", local_id: "HB-201", sex: "FEMALE", birth_date: "2020-03-15", founder_representation_pct: 30.00 }
              as: Registrar
              as_user_id: "${receiver_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "BREED_WITH", subject_animal_id: "${m1_id}", paired_animal_id: "${f1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", analysis_mode: "PEDIGREE_ONLY", molecular_similarity_pct: 32.0, priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v1}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_pedigree_id: $.data.id }
            - call: "GET /animals/${m1_id}"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_v2: $.data.version }
          trigger:
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "BREED_WITH", subject_animal_id: "${m1_id}", paired_animal_id: "${f1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", analysis_mode: "PEDIGREE_PLUS_MOLECULAR", molecular_similarity_pct: 32.0, priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v2}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_molecular_id: $.data.id }
          assert:
            - "PopulationRecommendation.${rec_pedigree_id}.kinship_coefficient == 0.0000"
            - "PopulationRecommendation.${rec_pedigree_id}.projected_offspring_inbreeding == 0.0000"
            - "PopulationRecommendation.${rec_pedigree_id}.pairing_verdict == RECOMMENDED"
            - "PopulationRecommendation.${rec_molecular_id}.kinship_coefficient == 0.0000"
            - "PopulationRecommendation.${rec_molecular_id}.projected_offspring_inbreeding == 0.1280"
            - "PopulationRecommendation.${rec_molecular_id}.pairing_verdict == NOT_RECOMMENDED"
            - "PopulationRecommendation.${rec_pedigree_id}.status == SUPERSEDED"
            - "PopulationRecommendation.${rec_molecular_id}.status == PROPOSED"
            - "Animal.${m1_id}.pending_recommendation_id == ${rec_molecular_id}"

      - name: provisional_vs_final_transfer_credit_points
        grounds:
          - calculations.transfer_credit_valuation
          - calculations.thermal_excursion_window
          - entities.TransferAgreement.fields.provisional_credit_points
          - entities.TransferAgreement.fields.final_credit_points
          - entities.Institution.fields.transfer_credit_balance
          - state_machines.TransferAgreement.ACCEPTED_to_EXECUTED
          - state_machines.ShipmentBooking.IN_TRANSIT_to_DELIVERED
        distinguishing_aspect: |
          This dual variant lives on a different entity domain from the genetics one — money-like
          transfer credit on TransferAgreement and the Institution ledger: the same agreement is
          valued 62.23 at execution (provisional_at_execution, no temperature record yet) and
          56.23 at delivery (final_at_delivery, minus a 6.00 penalty for 120 excursion minutes),
          and the ledger is moved by the -6.00 delta rather than re-posted.
          
        test_recipe:
          setup:
            - "Base fixture as in pedigree_only_vs_molecular_projected_inbreeding through the PEDIGREE_ONLY recommendation on M1 x F1 (genetic_value_score 95.93)."
            - "The recommendation is endorsed by the sender, an OWNERSHIP_TRANSFER agreement with transport_cost_share_pct 51 is offered by the sender and accepted by the receiver."
            - "Clock moved to 2026-08-10 for execution (M1 is 7 years old), then to 2026-09-20 for delivery (M1 is still 7)."
            - "The journey envelope is 10.0 to 24.0 degrees C and the delivered log carries exactly four readings outside it."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /species-programs/${program_id}/publish-plan"
              payload: { publication_note: "Cycle 1 published" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id, m1_v1: $.data.version }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${receiver_id}", owning_institution_id: "${receiver_id}", local_id: "HB-201", sex: "FEMALE", birth_date: "2020-03-15", founder_representation_pct: 30.00 }
              as: Registrar
              as_user_id: "${receiver_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "BREED_WITH", subject_animal_id: "${m1_id}", paired_animal_id: "${f1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", analysis_mode: "PEDIGREE_ONLY", priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v1}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /population-recommendations/${rec_id}/endorse"
              payload: { endorsement_note: "Endorsed by sender" }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /transfer-agreements"
              payload: { recommendation_id: "${rec_id}", animal_id: "${m1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", ownership_disposition: "OWNERSHIP_TRANSFER", offspring_disposition_rule: "SPLIT_50_50", breeding_rights: "FULL", transport_cost_share_pct: 51.0 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /transfer-agreements/${ta_id}/offer"
              payload: { transport_cost_share_pct: 51.0 }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /transfer-agreements/${ta_id}/accept"
              payload: { acceptance_note: "Terms accepted" }
              as: Registrar
              as_user_id: "${receiver_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: AccreditationAdmin
            - call: "POST /transfer-agreements/${ta_id}/execute"
              payload: { execution_note: "Executed" }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { ta_v_exec: $.data.version }
            - call: "POST /shipment-bookings"
              payload: { transfer_agreement_id: "${ta_id}", carrier_code: "AVI-CARGO-7", crate_serial: "CR-CRATE-001", departure_utc: "2026-09-20T08:00:00Z", arrival_utc: "2026-09-20T20:00:00Z", temp_min_c: 10.0, temp_max_c: 24.0, expected_transfer_agreement_version: "${ta_v_exec}" }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T08:00:00Z" }
              as: AccreditationAdmin
          trigger:
            - call: "GET /transfer-agreements/${ta_id}"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /shipment-bookings/${booking_id}/deliver"
              payload: { temperature_samples: [12.0, 26.0, 27.0, 25.0, 26.0, 14.0, 15.0] }
              as: Registrar
              as_user_id: "${receiver_id}"
          assert:
            - "TransferAgreement.${ta_id}.provisional_credit_points == 62.23"
            - "ShipmentBooking.${booking_id}.thermal_excursion_minutes == 120"
            - "TransferAgreement.${ta_id}.final_credit_points == 56.23"
            - "Institution.${sender_id}.transfer_credit_balance == 56.23"
            - "Institution.${receiver_id}.transfer_credit_balance == -56.23"
            - "TransferAgreement.${ta_id}.provisional_credit_points != TransferAgreement.${ta_id}.final_credit_points"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: credit_component_rounding_order_pinned_round_then_sum
        grounds:
          - calculations.transfer_credit_valuation
          - entities.TransferAgreement.fields.provisional_credit_points
          - state_machines.TransferAgreement.ACCEPTED_to_EXECUTED
        distinguishing_aspect: |
          Mode (b), nested rounding where the order decides the cents: the three components round
          to 47.97 + 7.88 + 6.38 = 62.23 under the pinned round-per-component-then-sum order,
          while summing the raw components 47.965 + 7.875 + 6.375 = 62.215 and rounding once
          yields 62.22, so provisional_credit_points must be 62.23 and never 62.22.
        test_recipe:
          setup:
            - "Base fixture: sender US-CA, receiver US-TX, SSP_RED programme published, M1 (birth 2019-05-10, founder 12.45) at the sender and F1 at the receiver."
            - "A PEDIGREE_ONLY BREED_WITH recommendation on M1 x F1 scores genetic_value_score 95.93 and is endorsed."
            - "An OWNERSHIP_TRANSFER agreement with transport_cost_share_pct 51 is offered and accepted."
            - "Clock at 2026-08-10, on which M1 is exactly 7 years old."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /species-programs/${program_id}/publish-plan"
              payload: { publication_note: "Cycle 1 published" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id, m1_v1: $.data.version }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${receiver_id}", owning_institution_id: "${receiver_id}", local_id: "HB-201", sex: "FEMALE", birth_date: "2020-03-15", founder_representation_pct: 30.00 }
              as: Registrar
              as_user_id: "${receiver_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "BREED_WITH", subject_animal_id: "${m1_id}", paired_animal_id: "${f1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", analysis_mode: "PEDIGREE_ONLY", priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v1}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /population-recommendations/${rec_id}/endorse"
              payload: { endorsement_note: "Endorsed by sender" }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /transfer-agreements"
              payload: { recommendation_id: "${rec_id}", animal_id: "${m1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", ownership_disposition: "OWNERSHIP_TRANSFER", offspring_disposition_rule: "SPLIT_50_50", breeding_rights: "FULL", transport_cost_share_pct: 51.0 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /transfer-agreements/${ta_id}/offer"
              payload: { transport_cost_share_pct: 51.0 }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /transfer-agreements/${ta_id}/accept"
              payload: { acceptance_note: "Terms accepted" }
              as: Registrar
              as_user_id: "${receiver_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: AccreditationAdmin
          trigger:
            - call: "POST /transfer-agreements/${ta_id}/execute"
              payload: { execution_note: "Executed" }
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "TransferAgreement.${ta_id}.provisional_credit_points == 62.23"
            - "TransferAgreement.${ta_id}.provisional_credit_points != 62.22"
            - "Institution.${sender_id}.transfer_credit_balance == 62.23"
            - "Institution.${receiver_id}.transfer_credit_balance == -62.23"

      - name: studbook_surcharge_tier_keyed_on_base_points_only
        grounds:
          - calculations.studbook_lateness_assessment
          - entities.StudbookSubmission.fields.surcharge_multiplier
          - entities.StudbookSubmission.fields.total_compliance_points
        distinguishing_aspect: |
          Mode (c), a circular-looking dependency with a pinned evaluation order: total is
          base + surcharge while the surcharge tier is keyed on base_points alone, so 15 days late
          gives base 7.50, multiplier 0.10, surcharge 0.75 and total 8.25 — re-deriving the tier
          from the 8.25 total would select 0.25 and produce 9.38 instead.
        test_recipe:
          setup:
            - "Clock set to 2026-07-01 so the fixture is built before the deadline, then moved to 2026-07-15 for filing."
            - "One institution and one SSP_RED programme exist; the programme's plan does not need publishing because submissions are independent of the plan cycle."
            - "The reporting period ends 2026-05-31, so the deadline with SUBMISSION_GRACE_DAYS 30 is 2026-06-30 and filing on 2026-07-15 is 15 days late."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: AccreditationAdmin
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T10:00:00Z" }
              as: AccreditationAdmin
          trigger:
            - call: "POST /studbook-submissions"
              payload: { species_program_id: "${program_id}", institution_id: "${sender_id}", submission_type: "TRANSFER", reporting_period_end: "2026-05-31" }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "StudbookSubmission.${sub_id}.days_late == 15"
            - "StudbookSubmission.${sub_id}.base_points == 7.50"
            - "StudbookSubmission.${sub_id}.surcharge_multiplier == 0.10"
            - "StudbookSubmission.${sub_id}.surcharge_points == 0.75"
            - "StudbookSubmission.${sub_id}.total_compliance_points == 8.25"
            - "StudbookSubmission.${sub_id}.total_compliance_points != 9.38"
            - "StudbookSubmission.${sub_id}.status == SUBMITTED"
            - "Institution.${sender_id}.compliance_points_balance == 0.00"

      - name: demographic_need_index_nonlinear_program_weighted_composite
        grounds:
          - calculations.demographic_need_index
          - entities.PopulationRecommendation.fields.demographic_need_index
          - entities.PopulationRecommendation.fields.genetic_value_score
          - entities.SpeciesProgram.fields.current_population_count
        distinguishing_aspect: |
          Mode (a), a four-input non-linear composite with clamps and a state-keyed rate: identical
          demographics (target 300, population 2, founder 12.45, kinship 0.0000) score
          demographic_need_index 0.9593 / genetic_value_score 95.93 under an SSP_RED programme and
          0.2878 / 28.78 under a STUDBOOK_ONLY programme, because PROGRAM_WEIGHT scales the whole
          composite after the three factor weights have already been applied.
        test_recipe:
          setup:
            - "Clock left at its 2026-08-01T00:00:00Z default."
            - "Two programmes are published: an SSP_RED (PROGRAM_WEIGHT 1.0) and a STUDBOOK_ONLY (PROGRAM_WEIGHT 0.3), both with target_population_size 300."
            - "Each programme holds exactly two animals, so both report current_population_count 2 and gap_ratio 0.993333."
            - "Both subject males carry founder_representation_pct 12.45 and no pedigree, so founder_scarcity is 0.8755 and kinship_relief clamps to 1.0000 in both programmes."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_red_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Neofelis nebulosa", program_type: "STUDBOOK_ONLY", target_population_size: 300, studbook_keeper_name: "R. Okabe" }
              as: AccreditationAdmin
              captures: { program_only_id: $.data.id }
            - call: "POST /species-programs/${program_red_id}/publish-plan"
              payload: { publication_note: "Cycle 1 published" }
              as: ProgramCoordinator
              as_user_id: "${program_red_id}"
            - call: "POST /species-programs/${program_only_id}/publish-plan"
              payload: { publication_note: "Cycle 1 published" }
              as: ProgramCoordinator
              as_user_id: "${program_only_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_red_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
