              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm3_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
