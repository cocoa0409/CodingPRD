              as: GinOperator
              captures: { m: $.data.id }
            - call: "POST /gin-ops/modules/${m}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-SR1", net_weight_lbs: 1000} ] }
