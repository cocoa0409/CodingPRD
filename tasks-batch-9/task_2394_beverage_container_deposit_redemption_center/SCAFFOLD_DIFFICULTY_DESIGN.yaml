      - name: period_overlap_beats_duplicate_quarter_code
        grounds:
          - validations[priority=29]
          - validations[priority=31]
          - errors[ERR_PERIOD_OVERLAP]
          - errors[ERR_DUPLICATE_QUARTER_CODE]
        distinguishing_aspect: |
          One period creation violates the business_temporal rule at priority 29 (the requested
          closed interval shares 2026-09-30 with the stored period) and the business_constraint
          rule at priority 31 (quarter_code 2026Q3 is already stored); the temporal rule must
          win, so the response is ERR_PERIOD_OVERLAP and never ERR_DUPLICATE_QUARTER_CODE — a
          temporal-vs-uniqueness pair, both at HTTP 409, so only the error_id separates them.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z"
            - "One OPEN ProgramPeriod 2026Q3 spanning 2026-07-01..2026-09-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q3", start_date: "2026-07-01", end_date: "2026-09-30", operating_cost_cents: 1000 }
              as: ProgramAdmin
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q3", start_date: "2026-09-30", end_date: "2026-12-31", operating_cost_cents: 1000 }
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger response status is 409 and $.data.error_id == ERR_PERIOD_OVERLAP"
            - "$.data.error_id != ERR_DUPLICATE_QUARTER_CODE"
            - "GET /program-periods returns total_count 1"
            - "ProgramPeriod.${period_id}.status == OPEN"
            - "ProgramPeriod.${period_id}.end_date == 2026-09-30"

  - rule_id: boundary_precision_check
    instances:

      - name: fill_volume_3000_covered_and_3001_not_covered
        grounds:
          - calculations.container_coverage_and_deposit
          - entities.BeverageProduct.fields.coverage_status
          - entities.BeverageProduct.fields.coverage_reason
          - entities.BeverageProduct.fields.deposit_cents
          - state_machines.BeverageProduct.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          MAX_FILL_ML is inclusive: a 3000 ml label is COVERED with coverage_reason
          COVERED_STANDARD and deposit_cents 10, while an otherwise identical 3001 ml label is
          NOT_COVERED with coverage_reason VOLUME_OUT_OF_RANGE and deposit_cents 0 — a
          one-millilitre step across the upper bound flips three computed fields.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; ACTIVE Distributor"
            - "Product P3000: WATER / PET_PLASTIC / fill_volume_ml 3000 in registration_state DRAFT"
            - "Product P3001: WATER / PET_PLASTIC / fill_volume_ml 3001 in registration_state DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Growler 3000", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 3000, upc: "011110003000", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_in_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Growler 3001", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 3001, upc: "011110003001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_out_id: $.data.id }
          trigger:
            - call: "POST /beverage-products/${prod_in_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${prod_out_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
          assert:
            - "BeverageProduct.${prod_in_id}.registration_state == SUBMITTED"
            - "BeverageProduct.${prod_in_id}.coverage_status == COVERED"
            - "BeverageProduct.${prod_in_id}.coverage_reason == COVERED_STANDARD"
            - "BeverageProduct.${prod_in_id}.deposit_cents == 10"
            - "BeverageProduct.${prod_out_id}.registration_state == SUBMITTED"
            - "BeverageProduct.${prod_out_id}.coverage_status == NOT_COVERED"
            - "BeverageProduct.${prod_out_id}.coverage_reason == VOLUME_OUT_OF_RANGE"
            - "BeverageProduct.${prod_out_id}.deposit_cents == 0"

      - name: exemption_distance_boundary_3_50_grants_and_3_52_denied
        grounds:
          - calculations.retailer_exemption_distance
          - validations[priority=36]
          - errors[ERR_EXEMPTION_DISTANCE_EXCEEDED]
          - state_machines.Retailer.OBLIGATED_to_EXEMPT
          - entities.Retailer.fields.nearest_center_distance_miles
        distinguishing_aspect: |
          The radius test is non-strict and runs on the 2-decimal rounded distance: a store at
          (0.00, 0.00) is exactly 3.50 miles from the center at (2.10, 2.80) and becomes EXEMPT,
          while a store at (0.00, -0.03) rounds to 3.52 miles and is refused with
          ERR_EXEMPTION_DISTANCE_EXCEEDED — a 0.03-mile shift decides the obligation.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z"
            - "One OPERATIONAL center at (2.10, 2.80) with accepts_all_materials true and one machine"
            - "Retailer NEAR at (0.00, 0.00) and retailer FAR at (0.00, -0.03), both OBLIGATED with store_area_sqft 6000 and no visits"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
              payload: { site_name: "Redmond Redemption Center", x_miles: 2.10, y_miles: 2.80, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /retailers"
              payload: { store_name: "Near Market", x_miles: 0.00, y_miles: 0.00, store_area_sqft: 6000 }
              as: ProgramAdmin
              captures: { near_retailer_id: $.data.id }
            - call: "POST /retailers"
              payload: { store_name: "Far Market", x_miles: 0.00, y_miles: -0.03, store_area_sqft: 6000 }
              as: ProgramAdmin
              captures: { far_retailer_id: $.data.id }
          trigger:
            - call: "POST /retailers/${near_retailer_id}/exemption-actions"
              payload: { action: "CLAIM_EXEMPTION" }
              as: RetailClerk
              as_user_id: "${near_retailer_id}"
            - call: "POST /retailers/${far_retailer_id}/exemption-actions"
              payload: { action: "CLAIM_EXEMPTION" }
              as: RetailClerk
              as_user_id: "${far_retailer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Retailer.${near_retailer_id}.obligation_status == EXEMPT"
            - "Retailer.${near_retailer_id}.nearest_center_id == ${center_id}"
            - "Retailer.${near_retailer_id}.nearest_center_distance_miles == 3.5"
            - "Retailer.${near_retailer_id}.exemption_granted_at == 2026-08-05T09:00:00Z"
            - "the second trigger response status is 422 and $.data.error_id == ERR_EXEMPTION_DISTANCE_EXCEEDED"
            - "Retailer.${far_retailer_id}.obligation_status == OBLIGATED"
            - "Retailer.${far_retailer_id}.nearest_center_id == null"
            - "Retailer.${far_retailer_id}.nearest_center_distance_miles == null"
            - "Retailer.${far_retailer_id}.daily_limit_containers == 50"

      - name: close_count_over_empty_lot_set_pays_zero
        grounds:
