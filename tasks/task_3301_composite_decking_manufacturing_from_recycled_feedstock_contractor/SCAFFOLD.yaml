# =============================================================================
# SCAFFOLD.yaml — §1.0–§1.7 seed tables
# Task: task_3301_composite_decking_manufacturing_from_recycled_feedstock_contractor
#
# Composite decking manufacturing from recycled feedstock with a contractor
# certification program. Single-plant API surface; every recipe instance in
# §1.8/§1.9 begins with a plant-creation call.
# =============================================================================

scenario: |
  Composite Decking Manufacturing from Recycled Feedstock & Contractor Program (Trex): recycled polyethylene film and wood flour feedstock sourcing with contamination limits and supplier collection programs, formulation and extrusion with color capping, embossing and board profile changes, capacity planning against a highly seasonal building calendar with pre-season inventory builds, two-step distribution to dealers with stocking commitments and territory coverage, contractor certification program with training, lead referral and enhanced warranty registration, warranty claim adjudication for fading, staining and structural defects with board sample review, product line transitions where discontinued colors must be supported for repairs, retail merchandising with sample displays and color chip programs

domain_name: composite-decking-manufacturing
api_prefix: /decking

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant name" }
      - { name: daily_capacity_lf, type: integer, source: input, description: "Nominal extrusion capacity in linear feet per calendar day", constraints: ">= 1" }
      - { name: lines, type: integer, source: input, description: "Number of parallel extrusion lines", constraints: ">= 1" }
      - { name: resin_store, type: object, source: system, description: "Composite attribute tracking feedstock on hand per category: { VIRGIN_PE: integer lbs, REPRO_PE: integer lbs, PCR_FILM: integer lbs, WOOD_FLOUR: integer lbs }; all keys start at 0; PCR_FILM contributions are decayed 0.5% per calendar day at run_capacity_review" }
      - { name: fg_store, type: object, source: system, description: "Finished-goods on hand in linear feet keyed by ProductLine.id; every key starts at 0" }
      - { name: reserved_fg_store, type: object, source: system, description: "Finished goods in linear feet keyed by ProductLine.id reserved by OPEN AllocationCommitments; additive-only, independent of fg_store" }
      - { name: pre_season_window_start, type: string, source: input, description: "Calendar date MM-DD when the pre-season inventory build window opens (e.g. 01-01)" }
      - { name: pre_season_window_end, type: string, source: input, description: "Calendar date MM-DD when the pre-season build window closes; SELLING is the day after through Dec 31", constraints: "start must precede end within the same calendar year" }
      - { name: season_posture, type: enum, source: system, description: "PRE_SEASON | SELLING — derived from the logical clock against the pre-season window at plant creation and at every run_capacity_review" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: kind, type: enum, source: input, description: "COLLECTION_PROGRAM | BROKER — a supplier may operate both a collection program and brokered sales" }
      - { name: quality_tier, type: enum, source: computed, description: "STANDARD | PREFERRED — PREFERRED only while an ACTIVE CollectionProgram exists for this supplier; recomputed on program activation, suspension and termination" }
      - { name: reliability_score_bp, type: integer, source: computed, default: 10000, description: "Rolling reliability in basis points: 10000 - (rejected lot count / total lots) * 10000, computed as integer truncation; used only as reportage" }

  - name: CollectionProgram
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: region, type: string, source: input, description: "Geographic region label" }
      - { name: rebate_per_lb_cents, type: integer, source: input, description: "Per-pound rebate earned on ACCEPTED PCR_FILM lots from this supplier while the program is ACTIVE", constraints: ">= 0" }
      - { name: accrued_rebate_cents, type: integer, source: computed, default: 0, description: "Cumulative rebate cents accrued on RELEASED PCR_FILM lots while the program was ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED -> ACTIVE | TERMINATED" }

  - name: FeedstockLot
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: material, type: enum, source: input, description: "PCR_FILM | WOOD_FLOUR | REPRO_PE | VIRGIN_PE" }
      - { name: weight_lbs, type: integer, source: input, constraints: ">= 1" }
      - { name: received_date, type: string, source: input, description: "ISO date the lot physically arrived" }
      - { name: status, type: enum, source: system, description: "QUARANTINE -> RELEASED | REJECTED" }
      - { name: moisture_pct, type: number, source: input, description: "Lab-measured moisture content, one decimal place" }
      - { name: contamination_ppm, type: integer, source: input, description: "Lab-measured non-polymeric contamination in parts per million" }
      - { name: melt_flow_index, type: number, source: input, description: "Lab melt-flow index; required and constrained only for polymer lots" }
      - { name: certificate_ref, type: string, source: input, description: "Chain-of-custody certificate reference" }
      - { name: release_disposition, type: enum, source: system, description: "PRODUCTION | SUPPORT_STOCK — recorded at release; SUPPORT_STOCK lots contribute to resin_store but are barred from ACTIVE ProductionRuns of capped (capped = true) product lines" }

  - name: Formulation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input }
      - { name: lines, type: array, source: input, description: "Formulation lines, each { material: VIRGIN_PE|REPRO_PE|PCR_FILM|WOOD_FLOUR, weight_fraction_bp: integer }; weight fractions sum to exactly 10000 bp; every revision content-hash must be unique within the formulation" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> RETIRED" }
      - { name: active_revision, type: integer, source: system, default: 1, description: "Currently effective revision number; a ProductionRun created now pins this revision" }
      - { name: current_revision_hash, type: string, source: system, description: "Content hash of the ACTIVE revision's line set; uniqueness enforced across revisions of the same formulation" }

  - name: ProductLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Marketing name of the board line" }
      - { name: color, type: string, source: input }
      - { name: capped, type: boolean, source: input, description: "True when the line carries a co-extruded polymer capstock" }
      - { name: profile, type: enum, source: input, description: "GROOVED | SQUARE | FASCIA" }
      - { name: emboss, type: enum, source: input, description: "WOODGRAIN | SMOOTH" }
      - { name: board_length_ft, type: integer, source: input, constraints: ">= 1" }
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id" }
      - { name: repair_support_only, type: boolean, source: input, default: false, description: "When true the line may only be produced for warranty/repair support stock; sellable lots rejected" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> DISCONTINUED -> REPAIRED_SUPPORTED | SUNSET" }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input }
      - { name: territory_code, type: string, source: input, description: "Geographic territory the dealer covers; at most one ACTIVE StockingCommitment per (dealer, territory) pair" }
      - { name: credit_limit_cents, type: integer, source: input, constraints: ">= 0" }
      - { name: outstanding_cents, type: integer, source: computed, default: 0, description: "Sum of invoiced_cents over the dealer's ShipmentOrders with invoiced_cents set minus credited amounts; recomputed at invoicing and at claim credit issuance" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: ShipmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id" }
      - { name: lf, type: integer, source: input, constraints: ">= 1", description: "Linear feet ordered" }
      - { name: ship_week_start, type: string, source: input, description: "ISO date of the Monday of the requested ship week" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> CONFIRMED -> SHIPPED -> DELIVERED; CONFIRMED -> CANCELLED" }
      - { name: invoiced_cents, type: integer, source: system, description: "Set at SHIPPED per the dealer-invoicing calculation; null until shipped" }
      - { name: actual_ship_date, type: string, source: system, description: "ISO date recorded at SHIPPED" }
      - { name: price_book_id, type: string, source: system, description: "FK -> PriceBook.id; pinned at confirmation and used for invoicing" }

  - name: StockingCommitment
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id" }
      - { name: territory_code, type: string, source: input, description: "Must equal the dealer's territory_code at creation" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id" }
      - { name: committed_lf, type: integer, source: input, constraints: ">= 1" }
      - { name: season_year, type: integer, source: input }
      - { name: fulfilled_lf, type: integer, source: computed, default: 0, description: "Linear feet delivered under this commitment" }
      - { name: status, type: enum, source: system, description: "OPEN -> MET | SHORTFALL_PENALIZED | WAIVED" }

  - name: AllocationCommitment
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id" }
      - { name: reserved_lf, type: integer, source: input, constraints: ">= 1" }
      - { name: price_book_id, type: string, source: input, description: "FK -> PriceBook.id; reservation pins this price book for later confirmed orders" }
      - { name: status, type: enum, source: system, description: "OPEN -> CONSUMED | RELEASED | EXPIRED" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; always the plant addressed in the creation path" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id" }
      - { name: formulation_revision, type: integer, source: system, description: "Pinned from Formulation.active_revision at creation; immutable thereafter" }
      - { name: planned_lf, type: integer, source: input, constraints: ">= 1" }
      - { name: actual_lf, type: integer, source: system, description: "Recorded at completion" }
      - { name: production_date, type: string, source: input, description: "ISO date the run executes; capacity and extrusion-slot rules are evaluated per production_date" }
      - { name: line_slot, type: integer, source: system, description: "Extrusion line index assigned at creation; unique per (plant_id, production_date); NULL_SLOT runs carry line_slot = null" }
      - { name: changeover_minutes, type: integer, source: computed, description: "Changeover penalty computed against the previous run on the same line slot per changeover_minutes calculation" }
      - { name: total_minutes, type: integer, source: computed, description: "run_minutes + changeover_minutes" }
      - { name: run_kind, type: enum, source: input, default: "SELLABLE", description: "SELLABLE | SUPPORT_STOCK | NULL_SLOT" }
      - { name: reservation_id, type: string, source: input, description: "FK -> AllocationCommitment.id; required on SELLABLE runs when reservations exist for the product line; the created board lot is tagged to it", constraints: "nullable" }
      - { name: board_lot_id, type: string, source: system, description: "id of the BoardLot created at completion (1:1 back-reference; reverse reachability via GET /decking/production-runs/{runId}/board-lots)" }
      - { name: status, type: enum, source: system, description: "PLANNED -> RUNNING -> COMPLETED; PLANNED|RUNNING -> CANCELLED" }

  - name: BoardLot
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id" }
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id" }
      - { name: product_line_id, type: string, source: system, description: "FK -> ProductLine.id copied from the run" }
      - { name: formulation_revision, type: integer, source: system, description: "Pinned revision, copied from the run" }
      - { name: lf, type: integer, source: system, description: "Actual linear feet produced" }
      - { name: produced_at, type: string, source: system, description: "ISO datetime of production-run completion; FIFO ship consumption sorts by (produced_at, created_at)" }
      - { name: support_tagged, type: boolean, source: system, description: "True when produced by a SUPPORT_STOCK or NULL_SLOT run; such lots may only satisfy warranty claims" }
      - { name: disposition, type: enum, source: system, description: "AVAILABLE -> ALLOCATED -> SHIPPED | CONSUMED_BY_CLAIM | SCRAPPED" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input }
      - { name: email, type: string, source: input, constraints: "unique" }
      - { name: status, type: enum, source: system, description: "APPLIED -> IN_TRAINING -> CERTIFIED -> SUSPENDED -> LAPSED; SUSPENDED -> CERTIFIED" }
      - { name: tier, type: enum, source: computed, default: "SILVER", description: "SILVER | GOLD | PLATINUM — derived at certification from trailing-12-month completed_project_count and enhanced_warranty_count; SILVER grants warranty_years 10, GOLD 15, PLATINUM 25" }
      - { name: certified_at, type: string, source: system, description: "ISO datetime of most recent certification" }
      - { name: completed_project_count, type: integer, source: computed, default: 0, description: "InstallRegistrations status INSTALLED with completion_date inside the trailing 12 months" }
      - { name: enhanced_warranty_count, type: integer, source: computed, default: 0, description: "InstallRegistrations of this contractor with an enhanced warranty actived in the trailing 12 months" }

  - name: TrainingModule
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input }
      - { name: version_no, type: integer, source: input, constraints: ">= 1" }
      - { name: duration_hours, type: number, source: input, constraints: "> 0" }
      - { name: required_for_tier, type: enum, source: input, description: "SILVER | GOLD | PLATINUM — the certification level this module gates" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: module_id, type: string, source: input, description: "FK -> TrainingModule.id" }
      - { name: status, type: enum, source: system, description: "ENROLLED -> PASSED | FAILED" }
      - { name: passed_module_version, type: integer, source: system, description: "Module version_no at the moment of passing" }
      - { name: passed_at, type: string, source: system, description: "ISO datetime of passing" }

  - name: LeadReferral
    parent: null
    common_fields: true
    fields:
      - { name: homeowner_name, type: string, source: input }
      - { name: zip_code, type: string, source: input }
      - { name: submitted_by_dealer_id, type: string, source: input, description: "FK -> Dealer.id that surfaced the homeowner" }
      - { name: assigned_contractor_id, type: string, source: system, description: "FK -> Contractor.id chosen by the lead assignment selector" }
      - { name: status, type: enum, source: system, description: "OPEN -> ASSIGNED -> EXPIRED | DECLINED; DECLINED -> ASSIGNED (reassignment after a decline)" }

  - name: InstallRegistration
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id that sold the material" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id installed" }
      - { name: install_date, type: string, source: input, description: "ISO date of physical install" }
      - { name: registered_at, type: string, source: system, description: "ISO datetime the registration was created" }
      - { name: completion_date, type: string, source: system, description: "ISO date the project was marked INSTALLED" }
      - { name: enhanced_warranty, type: boolean, source: system, default: false, description: "True once the enhanced warranty is activated (contractor CERTIFIED at activation; registration window rules apply)" }
      - { name: warranty_years, type: integer, source: system, description: "25 if enhanced (tier PLATINUM), 15 if enhanced (GOLD), 10 if enhanced (SILVER); 5 baseline when not enhanced" }
      - { name: board_lot_id, type: string, source: system, description: "FK -> BoardLot.id that produced the installed boards; set at registration, used by the fade-claim age gate" }
      - { name: status, type: enum, source: system, description: "PENDING -> INSTALLED -> CANCELLED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: install_registration_id, type: string, source: input, description: "FK -> InstallRegistration.id" }
      - { name: category, type: enum, source: input, description: "FADING | STAINING | STRUCTURAL" }
      - { name: filed_at, type: string, source: system, description: "ISO datetime the claim was filed" }
      - { name: status, type: enum, source: system, description: "FILED -> SAMPLE_REQUESTED -> UNDER_REVIEW -> APPROVED | DENIED" }
      - { name: adjudication, type: enum, source: system, description: "REPLACEMENT | CREDIT | REPAIR — set at APPROVED" }
      - { name: credit_amount_cents, type: integer, source: system, description: "Computed at APPROVED when adjudication is CREDIT" }
      - { name: denial_reason, type: string, source: system, description: "Set at DENIED" }

  - name: ClaimSample
    parent: null
    common_fields: true
    fields:
      - { name: warranty_claim_id, type: string, source: input, description: "FK -> WarrantyClaim.id" }
      - { name: received_at, type: string, source: system, description: "ISO datetime the physical sample was logged in" }
      - { name: lab_verdict, type: enum, source: system, description: "CONFIRMS_DEFECT | CONTRADICTS_CLAIM | INCONCLUSIVE — set at review" }
      - { name: status, type: enum, source: system, description: "AWAITING -> RECEIVED -> REVIEWED" }

  - name: SampleKit
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id the kit is merchandised to" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id the kit showcases" }
      - { name: kit_type, type: enum, source: input, description: "DISPLAY_BOARD | CHIP_SET" }
      - { name: status, type: enum, source: system, description: "ORDERED -> DELIVERED -> RETIRED" }

  - name: ColorChipRequest
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id" }
      - { name: quantity, type: integer, source: input, constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> FULFILLED | CANCELLED" }
      - { name: chip_run_id, type: string, source: system, description: "FK -> ProductionRun.id of the chip production run that fulfilled this request (a SUPPORT_STOCK run)" }

  - name: PriceBook
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input }
      - { name: effective_from, type: string, source: input, description: "ISO date this price book becomes the active one; exactly one PriceBook is active per date — the one with the latest effective_from <= that date" }
      - { name: base_prices, type: object, source: input, description: "Base price per linear foot in cents keyed by ProductLine.id: { <product_line_id>: integer cents }" }
      - { name: tier_discounts_bp, type: object, source: input, description: "Dealer-tier discounts in basis points keyed by tier: { STANDARD: int, PREFERRED: int }" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plant
    initial_state: "n/a (posture computed, no lifecycle states)"
    terminal_states: []
    transitions:
      - from: "*"
        to: "*"
        trigger: "POST /decking/plants/{id}/run-capacity-review"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "season_posture recomputed from the logical clock against the pre-season window"
          - "PCR_FILM mass in resin_store decayed 0.5% per elapsed calendar day since the last review (integer truncation per day, applied per day chronologically)"
          - "FeedstockLots still QUARANTINE whose received_date is more than 14 days before the review date auto-transition to REJECTED (stale quarantine)"
          - "AllocationCommitments OPEN whose created date is more than 90 days before the review date transition to EXPIRED, releasing their reserved_fg_store contribution"
          - "LeadReferrals ASSIGNED more than 30 days transition to EXPIRED"
          - "increments Plant.version by 1"

  - entity: FeedstockLot
    initial_state: QUARANTINE
    terminal_states: [REJECTED]
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /decking/feedstock-lots/{id}/release"
        actor: QualityEngineer
        preconditions:
          - "material-specific lab limits hold per the contamination_limits validation (ERR_LOT_LIMIT_EXCEEDED on breach)"
          - "release_disposition provided in the request body (PRODUCTION | SUPPORT_STOCK)"
        side_effects:
          - "Plant.resin_store[material] += weight_lbs"
          - "if the lot is PCR_FILM from a supplier with an ACTIVE CollectionProgram, a rebate accrual of weight_lbs * rebate_per_lb_cents is recorded on the program ledger (exposed via the program GET)"
          - "increments FeedstockLot.version and Plant.version by 1"
      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /decking/feedstock-lots/{id}/reject or system stale-quarantine sweep at run-capacity-review"
        actor: QualityEngineer | system
        preconditions: []
        side_effects:
          - "Supplier.reliability_score_bp recomputed"
          - "increments FeedstockLot.version by 1"
      - from: RELEASED
        to: RELEASED
        trigger: "n/a — RELEASED lots are consumed by production runs (mass decremented), never re-quarantined"
        actor: system
        preconditions: []
        side_effects: []
        note: "RELEASED is not terminal in the enum sense but has no outgoing API transitions; consumption is tracked on Plant.resin_store"

  - entity: Formulation
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /decking/formulations/{id}/activate"
        actor: ProcessEngineer
        preconditions:
          - "lines weight fractions sum to exactly 10000 bp (ERR_FORMULA_UNBALANCED)"
        side_effects:
          - "current_revision_hash stamped; active_revision = 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /decking/formulations/{id}/revisions (revise-in-place)"
        actor: ProcessEngineer
        preconditions:
          - "new line set sums to 10000 bp"
          - "new content hash differs from every prior revision hash of this formulation (ERR_REVISION_COLLISION)"
        side_effects:
          - "active_revision += 1; current_revision_hash updated"
          - "existing PLANNED ProductionRuns keep their pinned formulation_revision (version-pinning on approval)"
          - "increments Formulation.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /decking/formulations/{id}/retire"
        actor: ProcessEngineer
        preconditions:
          - "no ProductLine in status ACTIVE references this formulation (ERR_FORMULATION_IN_USE)"
        side_effects:
          - "ProductLines in DISCONTINUED/REPAIRED_SUPPORTED keep referencing the retired formulation for repair support runs"

  - entity: ProductLine
    initial_state: ACTIVE
    terminal_states: [SUNSET]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /decking/product-lines/{id}/discontinue"
        actor: ProductManager
        preconditions:
          - "no ShipmentOrder in status REQUESTED or CONFIRMED references the line (ERR_LINE_HAS_OPEN_ORDERS)"
        side_effects:
          - "OPEN StockingCommitments for the line remain OPEN (they may still be fulfilled from existing finished goods)"
        note: "CollectionProgram, TrainingModule and ProductLine are distinct entities; their machines are declared in full in this table."
      - from: DISCONTINUED
        to: REPAIRED_SUPPORTED
        trigger: "POST /decking/product-lines/{id}/set-repair-support"
        actor: ProductManager
        preconditions:
          - "repair_support_only flag set to true in the same request or previously"
        side_effects:
          - "new ProductionRuns for the line allowed only with run_kind SUPPORT_STOCK or NULL_SLOT"
          - "sellable SELLABLE runs rejected with ERR_LINE_SUPPORT_ONLY"
      - from: REPAIRED_SUPPORTED
        to: SUNSET
        trigger: "POST /decking/product-lines/{id}/sunset"
        actor: ProductManager
        preconditions:
          - "no WarrantyClaim in status FILED, SAMPLE_REQUESTED or UNDER_REVIEW references an InstallRegistration of this line (ERR_LINE_HAS_OPEN_CLAIMS)"
          - "fg_store for the line is 0 (ERR_LINE_STOCK_REMAINS)"
        side_effects: []

  - entity: ProductionRun
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RUNNING
        trigger: "POST /decking/plants/{id}/production-runs/{runId}/start"
        actor: OpsManager
        preconditions:
          - "run's production_date equals the logical clock date (ERR_RUN_NOT_TODAY)"
          - "no other run on the same plant is RUNNING on the same line_slot (ERR_LINE_OCCUPIED)"
          - "resin_store holds sufficient mass for planned_lf per the recipe draw calculation (ERR_RESIN_SHORTFALL)"
          - "if the product line is capped and the plant's PCR_FILM stock originated exclusively from SUPPORT_STOCK lots: rejected (ERR_SUPPORT_STOCK_BARRED)"
        side_effects:
          - "resin_store decremented per formulation weight fractions (integer truncation per material, remainder to WOOD_FLOUR)"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /decking/plants/{id}/production-runs/{runId}/complete"
        actor: OpsManager
        preconditions:
          - "actual_lf provided in body, >= 1 and <= planned_lf * 1.10 (ERR_OVERAGE_LIMIT)"
        side_effects:
          - "a BoardLot is created (lf = actual_lf, support_tagged = run_kind != SELLABLE)"
          - "SELLABLE runs: Plant.fg_store[line] += actual_lf; if reservation_id set, Plant.reserved_fg_store[line] -= min(actual_lf, reservation.reserved_lf consumed share) and the AllocationCommitment is re-evaluated (CONSUMED when fully drawn)"
          - "SUPPORT_STOCK/NULL_SLOT runs: the lot does NOT enter fg_store (support stock tracked only on the lot)"
          - "Plant.version and ProductionRun.version incremented"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /decking/plants/{id}/production-runs/{runId}/cancel"
        actor: OpsManager
        preconditions: []
        side_effects: ["reservation untouched; slot freed"]
      - from: RUNNING
        to: CANCELLED
        trigger: "POST /decking/plants/{id}/production-runs/{runId}/cancel"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "resin consumed at start is NOT returned (scrap); a zero-length BoardLot is not created"

  - entity: ShipmentOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /decking/shipment-orders/{id}/confirm"
        actor: DealerSalesRep
        preconditions:
          - "Dealer.status == ACTIVE (ERR_DEALER_SUSPENDED)"
          - "Plant.fg_store[line] - (sum of lf over CONFIRMED unshipped orders for the line) >= order.lf (ERR_FG_SHORTFALL); boundary: equal is confirmable (>= semantics)"
          - "if an OPEN AllocationCommitment exists for (dealer, line) its price_book_id is pinned on the order; else the active PriceBook at confirm date is pinned"
        side_effects:
          - "price_book_id pinned"
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /decking/shipment-orders/{id}/ship"
        actor: DealerSalesRep
        preconditions:
          - "logical clock date falls inside [ship_week_start, ship_week_start + 6 days] (ERR_OUTSIDE_SHIP_WEEK)"
        side_effects:
          - "fg_store[line] -= lf; invoiced_cents computed per dealer_invoicing calculation; Dealer.outstanding_cents += invoiced_cents"
          - "BoardLots for the line consumed FIFO (oldest produced_at first, created_at tie-break), disposition AVAILABLE -> SHIPPED"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /decking/shipment-orders/{id}/deliver"
        actor: Dealer
        preconditions: []
        side_effects:
          - "matching OPEN StockingCommitment (dealer, line, season_year of ship date) fulfilled_lf += lf; if fulfilled_lf >= committed_lf the commitment transitions to MET"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /decking/shipment-orders/{id}/cancel"
        actor: DealerSalesRep
        preconditions: []
        side_effects: ["no inventory movement (nothing was decremented at confirm)"]

  - entity: StockingCommitment
    initial_state: OPEN
    terminal_states: [MET, SHORTFALL_PENALIZED, WAIVED]
    transitions:
      - from: OPEN
        to: MET
        trigger: "system (when fulfilled_lf >= committed_lf on a deliver)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: SHORTFALL_PENALIZED
        trigger: "POST /decking/stocking-commitments/{id}/close-season"
        actor: ChannelManager
        preconditions:
          - "logical clock date is after Dec 31 of season_year (post-season close; earliest close date is (season_year+1)-01-01)"
          - "fulfilled_lf < committed_lf"
        side_effects:
          - "dealer shortfall penalty computed per shortfall_penalty calculation and debited to Dealer.outstanding_cents"
      - from: OPEN
        to: WAIVED
        trigger: "POST /decking/stocking-commitments/{id}/close-season with waive=true"
        actor: ChannelManager
        preconditions:
          - "logical clock date is after Dec 31 of season_year"
        side_effects: []

  - entity: AllocationCommitment
    initial_state: OPEN
    terminal_states: [CONSUMED, RELEASED, EXPIRED]
    transitions:
      - from: OPEN
        to: CONSUMED
        trigger: "system (when reserved balance reaches 0 via production or order consumption)"
        actor: system
        preconditions: []
        side_effects: ["reserved_fg_store[line] decremented to remove the remaining share"]
      - from: OPEN
        to: RELEASED
        trigger: "POST /decking/allocation-commitments/{id}/release"
        actor: DealerSalesRep
        preconditions: []
        side_effects: ["reserved_fg_store[line] -= remaining reserved_lf"]
      - from: OPEN
        to: EXPIRED
        trigger: "system (run-capacity-review: OPEN commitments older than 90 days)"
        actor: system
        preconditions: []
        side_effects: ["reserved_fg_store[line] -= remaining reserved_lf"]

  - entity: Contractor
    initial_state: APPLIED
    terminal_states: [LAPSED]
    transitions:
      - from: APPLIED
        to: IN_TRAINING
        trigger: "POST /decking/training-records (first enrolment)"
        actor: Contractor
        preconditions: []
        side_effects: []
      - from: IN_TRAINING
        to: CERTIFIED
        trigger: "POST /decking/contractors/{id}/certify"
        actor: ProgramAdmin
        preconditions:
          - "TrainingRecords show PASSED for every ACTIVE TrainingModule whose required_for_tier <= SILVER (ERR_MODULES_INCOMPLETE)"
          - "at least one passed module version equals the module's current version_no (ERR_STALE_TRAINING) when any module was re-versioned after the contractor passed it — re-versioned modules must be re-passed"
        side_effects:
          - "certified_at stamped; tier computed per contractor_tier calculation"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /decking/contractors/{id}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "contractor ineligible for new lead assignment and enhanced warranty activation"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /decking/contractors/{id}/reinstate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["tier recomputed"]
      - from: CERTIFIED
        to: LAPSED
        trigger: "system (run-capacity-review: certified_at more than 24 months before review date and completed_project_count == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: LAPSED
        trigger: "system (run-capacity-review: suspended more than 24 months)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrainingRecord
    initial_state: ENROLLED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: ENROLLED
        to: PASSED
        trigger: "POST /decking/training-records/{id}/pass"
        actor: ProgramAdmin
        preconditions: ["module status == ACTIVE (ERR_MODULE_RETIRED)"]
        side_effects: ["passed_module_version and passed_at stamped"]
      - from: ENROLLED
        to: FAILED
        trigger: "POST /decking/training-records/{id}/fail"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: LeadReferral
    initial_state: OPEN
    terminal_states: [EXPIRED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /decking/lead-referrals/{id}/assign"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "assigned_contractor_id chosen by the lead selector: candidates are Contractors with status CERTIFIED; ranked by tier (PLATINUM > GOLD > SILVER), then by fewest ASSIGNED leads in the trailing 90 days, then by certified_at ASC (earliest certified first); a further tie breaks by Contractor.created_at ASC; empty pool -> ERR_NO_ELIGIBLE_CONTRACTOR"
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /decking/lead-referrals/{id}/decline"
        actor: Contractor
        preconditions: ["X-User-ID equals assigned_contractor_id (ERR_NOT_ASSIGNEE)"]
        side_effects: []
      - from: DECLINED
        to: ASSIGNED
        trigger: "POST /decking/lead-referrals/{id}/assign (reassignment; the declining contractor is excluded from the candidate pool)"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["selector re-run with exclusion"]
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system (run-capacity-review: ASSIGNED for more than 30 days)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InstallRegistration
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: INSTALLED
        trigger: "POST /decking/install-registrations/{id}/mark-installed"
        actor: Contractor
        preconditions:
          - "X-User-ID equals contractor_id (ERR_NOT_OWNER)"
        side_effects:
          - "completion_date stamped; Contractor.completed_project_count recomputed"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /decking/install-registrations/{id}/cancel"
        actor: Contractor
        preconditions: ["X-User-ID equals contractor_id (ERR_NOT_OWNER)"]
        side_effects: []
      - from: INSTALLED
        to: INSTALLED
        trigger: "POST /decking/install-registrations/{id}/activate-warranty"
        actor: Contractor
        preconditions:
          - "contractor status == CERTIFIED (ERR_CONTRACTOR_NOT_CERTIFIED)"
          - "registered_at within 60 days of install_date (ERR_REGISTRATION_WINDOW)"
          - "enhanced_warranty still false (idempotent re-activation rejected ERR_ALREADY_ENHANCED)"
        side_effects:
          - "enhanced_warranty = true; warranty_years set from tier; Contractor.enhanced_warranty_count recomputed"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: SAMPLE_REQUESTED
        trigger: "POST /decking/warranty-claims/{id}/request-sample"
        actor: ClaimsAdjuster
        preconditions:
          - "claim age and category pass the claim_eligibility gates (ERR_CLAIM_OUT_OF_WARRANTY, ERR_FADE_COOLDOWN)"
        side_effects: ["a ClaimSample is created in AWAITING"]
      - from: SAMPLE_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /decking/claim-samples/{id}/receive then /review"
        actor: ClaimsAdjuster
        preconditions: ["sample received and lab_verdict recorded"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /decking/warranty-claims/{id}/adjudicate with approve"
        actor: ClaimsAdjuster
        preconditions:
          - "lab_verdict == CONFIRMS_DEFECT (ERR_VERDICT_BLOCKS_APPROVAL)"
          - "adjudication in {REPLACEMENT, CREDIT, REPAIR}"
        side_effects:
          - "CREDIT: credit_amount_cents computed per claim_credit calculation and Dealer.outstanding_cents of the selling dealer decremented by it"
          - "REPLACEMENT: consumes support stock — the AVAILABLE support_tagged BoardLot of the claim's product line with the earliest produced_at (tie-break created_at) moves to CONSUMED_BY_CLAIM; if none exists, a SUPPORT_STOCK ProductionRun must be scheduled and completed first (ERR_NO_SUPPORT_STOCK)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /decking/warranty-claims/{id}/adjudicate with deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["denial_reason recorded"]

  - entity: ClaimSample
    initial_state: AWAITING
    terminal_states: [REVIEWED]
    transitions:
      - from: AWAITING
        to: RECEIVED
        trigger: "POST /decking/claim-samples/{id}/receive"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["received_at stamped"]
      - from: RECEIVED
        to: REVIEWED
        trigger: "POST /decking/claim-samples/{id}/review"
        actor: ClaimsAdjuster
        preconditions: ["lab_verdict provided"]
        side_effects: ["parent WarrantyClaim transitions SAMPLE_REQUESTED -> UNDER_REVIEW"]

  - entity: SampleKit
    initial_state: ORDERED
    terminal_states: [RETIRED]
    transitions:
      - from: ORDERED
        to: DELIVERED
        trigger: "POST /decking/sample-kits/{id}/deliver"
        actor: DealerSalesRep
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: RETIRED
        trigger: "POST /decking/sample-kits/{id}/retire"
        actor: DealerSalesRep
        preconditions: ["the kit's product line is DISCONTINUED or later, or the kit is superseded by a new kit for the same line (ERR_KIT_STILL_CURRENT)"]
        side_effects: []

  - entity: ColorChipRequest
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: FULFILLED
        trigger: "POST /decking/color-chip-requests/{id}/fulfill"
        actor: OpsManager
        preconditions:
          - "a SUPPORT_STOCK ProductionRun for the request's product line has COMPLETED with actual_lf >= quantity * 2 lf per chip (ERR_CHIP_STOCK_SHORT)"
        side_effects: ["chip_run_id recorded; the support lot is decremented"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /decking/color-chip-requests/{id}/cancel"
        actor: DealerSalesRep
        preconditions: []
        side_effects: []


  - entity: CollectionProgram
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /decking/collection-programs/{id}/suspend"
        actor: ChannelManager
        preconditions: []
        side_effects: ["Supplier.quality_tier recomputed to STANDARD if no other ACTIVE program for the supplier"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /decking/collection-programs/{id}/reactivate"
        actor: ChannelManager
        preconditions: []
        side_effects: ["Supplier.quality_tier recomputed to PREFERRED"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /decking/collection-programs/{id}/terminate"
        actor: ChannelManager
        preconditions: []
        side_effects: ["Supplier.quality_tier recomputed"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /decking/collection-programs/{id}/terminate"
        actor: ChannelManager
        preconditions: []
        side_effects: ["Supplier.quality_tier recomputed"]

  - entity: TrainingModule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /decking/training-modules/{id}/re-version"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["version_no += 1; passes on older versions become stale for certification"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /decking/training-modules/{id}/retire"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["module no longer required for certification; passes on it cannot be recorded (ERR_MODULE_RETIRED)"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: allocation-commitment-stale-plant
    parent_entity: Plant
    write_endpoint: "POST /decking/plants/{id}/allocation-commitments"
    occ_field: "expected_plant_version"
    description: |
      Creating an AllocationCommitment against a Plant whose version has
      advanced since the client last observed it is rejected. Finished-goods
      reservation mutates Plant.reserved_fg_store, so a writer holding a stale
      view of the plant's reservation state must re-read before reserving.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: run-schedule-stale-plant
    parent_entity: Plant
    write_endpoint: "POST /decking/plants/{id}/production-runs"
    occ_field: "expected_plant_version"
    description: |
      Scheduling a ProductionRun against a Plant whose version has advanced
      since the client last observed it is rejected. Slot assignment and
      capacity consumption mutate plant-level aggregates, so a stale read of
      the plant invalidates the scheduling decision.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: season_posture
    trigger: "plant creation and every run-capacity-review"
    algorithm: threshold
    formula: |
      let d = logical clock date
      let s = Plant.pre_season_window_start (MM-DD), e = Plant.pre_season_window_end (MM-DD)
      if MM-DD(d) in [s, e] inclusive: posture = PRE_SEASON
      else: posture = SELLING
      Boundary: a date exactly equal to pre_season_window_end is PRE_SEASON;
      the day after is SELLING.
    input_set: "the addressed Plant"
    constants:
      WINDOW_INCLUSIVE_END: true
    precision: "date granularity"

  - name: pcr_decay
    trigger: "run-capacity-review"
    algorithm: decay_function
    formula: |
      days = calendar days elapsed since the previous review (or since plant creation for the first review)
      for each day i in 1..days, in chronological order:
        resin_store.PCR_FILM = floor(resin_store.PCR_FILM * 0.995)
      (per-day truncation matters: floor applied each day, not once on the total)
    input_set: "Plant.resin_store.PCR_FILM"
    constants:
      DAILY_RETENTION: 0.995
    precision: "integer lbs, truncate per day"

  - name: recipe_draw
    trigger: "production run start"
    algorithm: aggregation
    formula: |
      total_lbs = ceil(planned_lf * 2.0)   # DEFAULT_LBS_PER_FT, uniform across product lines
      for each formulation line except WOOD_FLOUR:
        draw[material] = floor(total_lbs * weight_fraction_bp / 10000)
      draw[WOOD_FLOUR] = total_lbs - sum(other draws)   # remainder to WOOD_FLOUR
      reject if resin_store[m] < draw[m] for any m (ERR_RESIN_SHORTFALL)
    input_set: "Formulation revision pinned on the run; Plant.resin_store"
    constants:
      DEFAULT_LBS_PER_FT: 2.0
    precision: "integer lbs, floor per line, remainder to WOOD_FLOUR"

  - name: changeover_minutes
    trigger: "production run creation (slot scheduling)"
    algorithm: constraint_propagation
    formula: |
      prev = the PLANNED/RUNNING/COMPLETED run on the same line_slot with the
             greatest production_date strictly before this run's production_date
             (tie-break: latest created_at)
      if no prev: changeover_minutes = 60 (initial setup)
      else:
        changeover_minutes = 15  # base
        if prev.product_line.color != this.color: changeover_minutes += 45
        if prev.product_line.profile != this.profile: changeover_minutes += 60
        if prev.product_line.emboss != this.emboss: changeover_minutes += 30
        if prev.product_line.capped != this.capped: changeover_minutes += 25
      run_minutes = ceil(planned_lf / (daily_capacity_lf / lines) * 24 * 60 / 1.0)
      total_minutes = run_minutes + changeover_minutes
      A date's total scheduled minutes (sum of total_minutes over runs that
      production_date, across all slots) must be <= lines * 24 * 60
      (ERR_CAPACITY_EXCEEDED).
    input_set: "all runs of the plant on the same line_slot"
    constants:
      BASE_MINUTES: 15
      COLOR_CHANGE_MINUTES: 45
      PROFILE_CHANGE_MINUTES: 60
      EMBOSS_CHANGE_MINUTES: 30
      CAP_CHANGE_MINUTES: 25
      INITIAL_SETUP_MINUTES: 60
    precision: "integer minutes, ceil on run_minutes"

  - name: dealer_invoicing
    trigger: "shipment order ship"
    algorithm: tiered_pricing
    formula: |
      base_cents = order.lf * price_book.base_prices[order.product_line_id]
      dealer_tier derives from StockingCommitment history:
        PREFERRED if the dealer has >= 1 MET StockingCommitment with
        season_year == (year of ship date) - 1, else STANDARD
      discount_bp = price_book.tier_discounts_bp[dealer_tier]
      invoiced_cents = floor(base_cents * (10000 - discount_bp) / 10000)
      variants:
        provisional (at CONFIRMED): computed identically but NOT persisted;
        final (at SHIPPED): persisted to invoiced_cents and debited to
        Dealer.outstanding_cents. Because dealer_tier can change between
        confirm and ship (a commitment closing MET in between), the two
        variants legitimately disagree for identical order data.
    input_set: "ShipmentOrder, pinned PriceBook, Dealer commitment history"
    precision: "integer cents, floor"
    variants:
      - name: provisional
        when: "order confirmation — credit-limit projection only"
        difference: "not persisted; recomputed at ship"
      - name: final
        when: "ship"
        difference: "persisted to invoiced_cents; debited to outstanding_cents"

  - name: shortfall_penalty
    trigger: "stocking commitment close-season with shortfall"
    algorithm: threshold
    formula: |
      shortfall_lf = committed_lf - fulfilled_lf
      fill_rate_bp = floor(fulfilled_lf * 10000 / committed_lf)
      if fill_rate_bp >= 9000: penalty_cents = 0 (grace band) but status still SHORTFALL_PENALIZED
      elif fill_rate_bp >= 7000: penalty_cents = shortfall_lf * 50
      else: penalty_cents = shortfall_lf * 150
      penalty debited to Dealer.outstanding_cents
      Boundary: fill_rate_bp == 9000 exactly lands in the grace band (>= semantics).
    input_set: "the StockingCommitment"
    constants:
      GRACE_BAND_BP: 9000
      MID_BAND_BP: 7000
      MID_RATE_CENTS_PER_LF: 50
      LOW_RATE_CENTS_PER_LF: 150
    precision: "integer cents"

  - name: contractor_tier
    trigger: "certification and reinstatement"
    algorithm: weighted_scoring
    formula: |
      p = completed_project_count (trailing 12 months from logical clock)
      w = enhanced_warranty_count (trailing 12 months)
      score = p * 100 + w * 250
      if score >= 3000: tier = PLATINUM
      elif score >= 1000: tier = GOLD
      else: tier = SILVER
      Boundaries are >= : score == 3000 is PLATINUM, score == 1000 is GOLD.
    input_set: "Contractor aggregate fields"
    constants:
      PROJECT_POINTS: 100
      WARRANTY_POINTS: 250
      PLATINUM_MIN: 3000
      GOLD_MIN: 1000
    precision: "integer score"

  - name: claim_credit
    trigger: "warranty claim adjudication with adjudication CREDIT"
    algorithm: tiered_pricing
    formula: |
      Let n = warranty_years on the InstallRegistration,
          elapsed_days = days from install_date to the claim's filed_at date,
          remaining_years = n - floor(elapsed_days / 365)
      remaining_years = max(remaining_years, 0)
      original_value_cents = the SHIPPED ShipmentOrder.invoiced_cents whose
          BoardLot lineage contains InstallRegistration.board_lot_id
          (exact match on board lot; if the lot shipped on multiple orders,
          use the order with the earliest actual_ship_date, tie-break created_at)
      if remaining_years == 0: credit = 0
      else: credit = floor(original_value_cents * remaining_years / n)
      Rounding order is pinned: floor ONCE on the final product — never round
      remaining_years/n first.
    input_set: "InstallRegistration, WarrantyClaim, ShipmentOrder lineage"
    precision: "integer cents, single floor at the end"
    variants:
      - name: prorated
        when: "remaining_years > 0"
        difference: "linear proration over remaining whole years"
      - name: expired
        when: "remaining_years == 0"
        difference: "credit is 0 but the claim may still be APPROVED as REPAIR"

  - name: claim_eligibility
    trigger: "warranty claim sample request"
    algorithm: forward_looking
    formula: |
      let reg = InstallRegistration, claim = WarrantyClaim
      age_days = days between reg.install_date and claim.filed_at
      if age_days > reg.warranty_years * 365: ERR_CLAIM_OUT_OF_WARRANTY
      if claim.category == FADING:
        if the claim's board_lot was produced before the product line's most
        recent formulation revision date (reg.board_lot.formulation_revision <
        current active_revision) AND age_days < 180: ERR_FADE_COOLDOWN
        (fade claims on legacy-revision boards require 180 days of weathering)
      STAINING claims additionally require the install to be <= 5 years old
      regardless of warranty_years (stain coverage is capped at 5 years).
    input_set: "InstallRegistration, BoardLot, WarrantyClaim"
    constants:
      FADE_COOLDOWN_DAYS: 180
      STAIN_MAX_YEARS: 5
    precision: "whole days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path parameters reference existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "request-body foreign keys reference existing resources (supplier_id, dealer_id, product_line_id, formulation_id, module_id, contractor_id, install_registration_id, warranty_claim_id, price_book_id, reservation_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 422
    applies_to: "creation and action endpoints with body FKs"
  - priority: 5
    category: state
    check: "target resource in a state that permits the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "feedstock lab limits: PCR_FILM contamination_ppm <= 2000 and melt_flow_index in [0.3, 1.2]; WOOD_FLOUR moisture_pct <= 8.0 and contamination_ppm <= 500; REPRO_PE contamination_ppm <= 1500; VIRGIN_PE melt_flow_index in [0.4, 1.0]; melt_flow_index required for all polymer lots (PCR_FILM, REPRO_PE, VIRGIN_PE) and forbidden to be absent"
    error_id: ERR_LOT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /decking/feedstock-lots/{id}/release"
  - priority: 7
    category: business_safety
    check: "capped product lines may not draw PCR_FILM when the plant's PCR_FILM stock originated exclusively from SUPPORT_STOCK lots"
    error_id: ERR_SUPPORT_STOCK_BARRED
    http_status: 422
    applies_to: "POST /decking/plants/{id}/production-runs/{runId}/start"
  - priority: 8
    category: business_constraint
    check: "extrusion slot and capacity: line_slot unique per (plant, production_date); sum of total_minutes per production_date <= lines * 1440"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /decking/plants/{id}/production-runs"
  - priority: 9
    category: business_constraint
    check: "resin store sufficiency per recipe_draw"
    error_id: ERR_RESIN_SHORTFALL
    http_status: 409
    applies_to: "POST /decking/plants/{id}/production-runs/{runId}/start"
  - priority: 10
    category: business_constraint
    check: "formulation revision uniqueness and balance (sum of weight_fraction_bp == 10000)"
    error_id: ERR_REVISION_COLLISION / ERR_FORMULA_UNBALANCED
    http_status: 422
    applies_to: "formulation create/activate/revise"
  - priority: 11
    category: business_referential
    check: "dealer active and credit headroom sufficient: outstanding_cents + projected invoice (dealer_invoicing provisional variant) must be < credit_limit_cents; equal-to-limit is rejected (strict < semantics)"
    error_id: ERR_DEALER_SUSPENDED / ERR_CREDIT_LIMIT
    http_status: 409
    applies_to: "shipment order confirm"
  - priority: 11.5
    category: business_constraint
    check: "at most one OPEN StockingCommitment per (dealer_id, territory_code) pair"
    error_id: ERR_DUPLICATE_COMMITMENT
    http_status: 409
    applies_to: "POST /decking/stocking-commitments"
  - priority: 12
    category: business_constraint
    check: "finished-goods availability net of confirmed-unshipped demand"
    error_id: ERR_FG_SHORTFALL
    http_status: 409
    applies_to: "shipment order confirm"
  - priority: 13
    category: business_temporal
    check: "ship date inside the confirmed ship week; registration within 60 days of install; claim within warranty window; fade cooldown; stain 5-year cap"
    error_id: ERR_OUTSIDE_SHIP_WEEK / ERR_REGISTRATION_WINDOW / ERR_CLAIM_OUT_OF_WARRANTY / ERR_FADE_COOLDOWN
    http_status: 409
    applies_to: "ship, activate-warranty, request-sample"
  - priority: 14
    category: business_fiscal
    check: "idempotence guards on fiscal/entitlement re-entry (enhanced warranty already active)"
    error_id: ERR_ALREADY_ENHANCED
    http_status: 409
    applies_to: "activate-warranty re-entry"
  - priority: 15
    category: state
    check: "product line sellability: SELLABLE runs require line status ACTIVE; SUPPORT_STOCK runs additionally require repair_support_only == true on the product line; NULL_SLOT runs are unrestricted by this rule; ShipmentOrders require line status ACTIVE; SUNSET forbids all runs and orders"
    error_id: ERR_LINE_SUPPORT_ONLY / ERR_LINE_SUNSET
    http_status: 409
    applies_to: "production-run create, shipment-order create"
  - priority: 16
    category: business_referential
    check: "certification gates: required modules PASSED at current version"
    error_id: ERR_MODULES_INCOMPLETE / ERR_STALE_TRAINING
    http_status: 409
    applies_to: "contractor certify"
  - priority: 17
    category: business_referential
    check: "ownership: contractor acts only on own registrations; only the assignee may decline a lead"
    error_id: ERR_NOT_OWNER / ERR_NOT_ASSIGNEE
    http_status: 403
    applies_to: "install-registration actions, lead decline"
  - priority: 18
    category: business_referential
    check: "sample lab verdict gates approval"
    error_id: ERR_VERDICT_BLOCKS_APPROVAL
    http_status: 409
    applies_to: "warranty claim adjudicate"

