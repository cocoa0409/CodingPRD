      - name: guest_issue_resolve_reopen_cycle
        grounds:
          - state_machines.GuestIssue.OPEN_to_IN_PROGRESS
          - state_machines.GuestIssue.IN_PROGRESS_to_RESOLVED
          - state_machines.GuestIssue.RESOLVED_to_REOPENED
          - state_machines.GuestIssue.REOPENED_to_IN_PROGRESS
          - entities.GuestIssue.fields.reopen_count
          - validations[priority=16]
        distinguishing_aspect: |
          Cycle on GuestIssue - a third entity, and a cycle with an explicit termination condition
          rather than the derived re-entry of PositionSlot. IN_PROGRESS -> RESOLVED -> REOPENED ->
          IN_PROGRESS runs twice, so REOPENED is entered on reopen_count 1 and 2, and the third
          attempt terminates the loop with ERR_REOPEN_LIMIT_REACHED (409) while sla_clock_started_at
          keeps its original filing instant across every lap.
        test_recipe:
          setup:
            - "Clock pinned at 2026-09-12T19:00:00Z for the whole recipe, so every reopen is inside the 1440-minute window and no SLA breaches."
            - "Event IN_PROGRESS; one responder holding a VALID CODE_OF_CONDUCT certification."
