          assert:
            - "response error_id == ERR_COUNSELOR_SLOT_CONFLICT"
            - "CounselorReferral.${ref2_id}.status == REQUESTED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: billing_amount_conserved_on_cancel_reversal
        grounds:
          - state_machines.TestOrder.ORDERED_to_CANCELLED
          - state_machines.Billing.AUTH_APPROVED_to_SETTLED
          - entities.Billing.fields.coinsurance_collected_cents
          - entities.Billing.fields.writeoff_cents
          - entities.Billing.fields.allowed_amount_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY: allowed_amount_cents == coinsurance_collected_cents +
          writeoff_cents + payer_remainder at all times. After cancel reverses an AUTH_APPROVED
          billing (allowed 200000, nothing collected), writeoff_cents becomes 200000 and
          coinsurance_collected_cents is 0, so the sum still equals allowed_amount_cents (200000) —
          no money drift.
        test_recipe:
          setup:
            - "COMMERCIAL order, auth APPROVED allowed 200000, no collection; then cancelled."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
