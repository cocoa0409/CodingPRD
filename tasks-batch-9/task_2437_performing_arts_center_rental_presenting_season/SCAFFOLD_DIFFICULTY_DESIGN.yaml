  # ===========================================================================
  - rule_id: transitive_cascade
    rule_name: "Transitive cascade — one write propagates through three or more dependent hops, where a later hop consumes an earlier hop's output"
    instances:

      - name: engagement_cancel_reverse_cascade_to_deposit_and_client_balance
        differentiation: |
          A COMPENSATING (reverse) cascade that unwinds reservations: cancelling releases labor and
          equipment, and the deposit recomputation at step 6 must read the POST-release values
          produced by steps 4 and 5, so getting the order wrong yields 400000 instead of 300000 for
          deposit_required_cents. It also crosses an aggregate boundary into the RentalClient ledger.
          The sibling instance below is a FORWARD cascade that creates new records (a ledger entry, a
          counterparty balance increase) rather than releasing existing ones.
        mechanism: "state_machines Engagement.lifecycle_status CONFIRMED -> CANCELLED, CANCEL CASCADE STEPS 1-11, with deposit_requirement recomputed exactly once after both the equipment release and the labor cancellation"
        entities_involved: [Engagement, RentalClient, LaborCall, UnionDepartment, TechRider, EquipmentItem, EquipmentRentalLine]
        test_recipe:
          setup: |
            A RENTAL engagement driven all the way to CONFIRMED so that the cancellation is chargeable:
            facility fee 500000*2 + 200000*1 = 1200000; client credit_rating A (25% deposit) with a
            10000-cent outstanding balance.
            Deposit trail: at creation ceil100(round(0.25*1200000)) = 300000; after a crew-of-4
            6-hour call (per crew round(6*5000) = 30000, estimate 120000)
            ceil100(round(0.25*1320000)) = 330000; after the GAP rider is cleared with 100000 of
            equipment, 330000 + 100000 = 430000. A deposit of exactly 430000 is recorded.
            Risk (RENTAL variant): credit factor A = 0, arrears 10000/430000 = 0.0233, lead 62 days
            -> 100*(0.30*0.0233 + 0.20*(1-62/120)) = 10.4 -> 10 -> LOW -> CLEARED. Confirmation then
            passes the rider, clearance and deposit gates.
            Cancellation at the default clock (2026-08-01T00:00:00Z) is 62 days out, which is in the
            30..90 day band -> 40% of exposure (facility 1200000 + guarantee 0) = 480000.
            Cascade result: labor call CANCELLED -> labor estimate 0; equipment line RELEASED ->
            reserved_qty 0 and equipment cost 0; deposit recomputed ONCE afterwards to
            ceil100(round(0.25*1200000)) + 0 = 300000; client balance
            10000 + (480000 - 430000) = 60000.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
