scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1: dual_variant_calc (≥2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deduction_method_standard_vs_itemized
        grounds:
          - calculations.calc_taxable_income
          - entities.TaxReturn.fields.deduction_method
          - entities.Schedule.fields.itemized_medical_cents
          - entities.Schedule.fields.itemized_salt_cents
          - entities.Schedule.fields.itemized_charity_cents
        distinguishing_aspect: |
          The standard_path and itemized_path variants on calc_taxable_income operate on the
          TaxReturn entity domain (deduction selection) and produce different taxable_income_cents
          for identical AGI inputs depending on which path is selected; the itemized branch reads
          Schedule A fields and applies AGI-dependent floors/caps while the standard branch reads
          only filing_status. Different entity domain from instance 2 (amt) which acts on AMT
          parallel-tax math at the TaxReturn level via agi_cents.
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "TaxReturn R: tax_year=2025, filing_status=SINGLE, deduction_method=STANDARD, dependents_count=0"
            - "IncomeDocument W-2: wages_cents=8_000_000 ($80,000), federal_withholding_cents=600_000"
            - "Schedule A on R with itemized_medical_cents=0, itemized_salt_cents=500_000 ($5,000), itemized_mortgage_interest_cents=0, itemized_charity_cents=200_000 ($2,000)"
          trigger:
            - "POST /tax-returns/R/compute  (deduction_method=STANDARD)"
            - "Capture taxable_income_cents as TI_STD"
            - "PATCH /tax-returns/R {deduction_method: ITEMIZED, version: current}"
            - "POST /tax-returns/R/compute"
            - "Capture taxable_income_cents as TI_ITEM"
          assert:
            - "AGI = 8_000_000 (no SE, no schedule C, no cap gains)"
            - "TI_STD == 8_000_000 - 1_500_000 == 6_500_000  (STANDARD single deduction $15,000)"
            - "Itemized deduction: medical_floor=floor(8_000_000*75/1000)=600_000; medical_allowed=0; salt_allowed=500_000; mortgage_allowed=0; charity_cap=floor(8_000_000*60/100)=4_800_000; charity_allowed=200_000; total_itemized=700_000"
            - "TI_ITEM == 8_000_000 - 700_000 == 7_300_000"
            - "TI_STD != TI_ITEM  (6_500_000 vs 7_300_000 from same AGI)"
            - "TaxReturn.deduction_method update reverts status to DRAFT before second compute"

      - name: regular_tax_vs_amt_parallel
        grounds:
          - calculations.calc_regular_tax
          - calculations.calc_amt
          - entities.TaxReturn.fields.regular_tax_cents
          - entities.TaxReturn.fields.amt_cents
        distinguishing_aspect: |
          calc_regular_tax (progressive bracket schedule on taxable_income_cents) and calc_amt
          (parallel calc on AGI minus AMT exemption with 26%/28% tiers) operate on the same
          TaxReturn but represent two structurally different algorithms — one bracket-tiered on
          taxable_income, the other on AGI with a fixed exemption — producing two valid liabilities
          that may diverge. Different entity domain from instance 1 (deduction-method variants on
          taxable_income), since AMT runs on AGI not on the deducted base.
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "TaxReturn R: tax_year=2025, filing_status=SINGLE, deduction_method=STANDARD, dependents_count=0"
            - "IncomeDocument W-2: wages_cents=25_000_000 ($250,000), federal_withholding_cents=0"
          trigger:
            - "POST /tax-returns/R/compute"
          assert:
            - "AGI = 25_000_000"
            - "taxable_income = 25_000_000 - 1_500_000 = 23_500_000"
            - "regular_tax: bracket1 110_000 + bracket2 floor(3_375_000*1200/10000)=405_000 + bracket3 floor(5_062_500*2200/10000)=1_113_750 + bracket4 floor(8_685_000*2400/10000)=2_084_400 + bracket5 floor(5_277_500*3200/10000)=1_688_800 = 5_401_950"
            - "AMT: amt_base=25_000_000-8_550_000=16_450_000; tentative_amt=floor(16_450_000*2600/10000)=4_277_000; amt_cents=max(0,4_277_000-5_401_950)=0"
            - "regular_tax_cents == 5_401_950 AND amt_cents == 0  (regular_only_path)"
            - "Same inputs in a scenario with itemized SALT=1_000_000 + mortgage=4_000_000 would push deductions to 5_000_000, taxable=20_000_000, regular_tax lower, possibly amt_triggered_path"

  # ===========================================================================
  # Rule 2: combinatorial_formula (≥2 instances, different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: progressive_bracket_per_slice_rounding_order
        grounds:
          - calculations.calc_regular_tax
          - calculations.calc_regular_tax.precision
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters. calc_regular_tax PIN ORDER: "compute each
          bracket slice, integer-floor THAT slice, sum" produces a different cents-level total than
          "sum products then floor". Example: at TI=4_400_000 SINGLE, per-bracket-then-sum yields
          (110000)+(396000)=506_000 cents; sum-then-floor with full precision would also yield
          506000 here, but at irregular boundaries the truncation order materially differs (see
          test). The scaffold pins the order to per-slice floor then sum.
        test_recipe:
          setup:
            - "Taxpayer T1 (ACTIVE)"
            - "TaxReturn R1: tax_year=2025, filing_status=SINGLE, deduction_method=STANDARD"
            - "IncomeDocument W-2 wages_cents=6_000_000 (so AGI=6_000_000, taxable=4_500_000)"
          trigger:
            - "POST /tax-returns/R1/compute"
          assert:
            - "Bracket1 slice=1_100_000, contribution=floor(1_100_000*1000/10000)=110_000"
            - "Bracket2 slice=3_375_000, contribution=floor(3_375_000*1200/10000)=floor(40_500_000/10000)=405_000"
            - "Bracket3 slice=25_000, contribution=floor(25_000*2200/10000)=floor(5_500_000/10000)=5_500 — wait recompute: 25_000 above 4_475_000 boundary"
            - "Actually with taxable=4_500_000: bracket1 110_000; bracket2 lo=1_100_000 hi=4_475_000 slice=3_375_000 contrib=floor(3_375_000*12/100)=405_000; bracket3 lo=4_475_000 slice=25_000 contrib=floor(25_000*22/100)=5_500"
            - "regular_tax_cents == 110_000 + 405_000 + 5_500 == 520_500"
            - "Asserting per-slice-floor-then-sum order: each slice's integer division performed before summation"

      - name: ctc_phaseout_rounded_up_thousand_then_rate
        grounds:
          - calculations.calc_credits
          - calculations.calc_credits.constants.CTC_PHASEOUT_RATE_BPS
          - calculations.calc_credits.constants.CTC_PHASEOUT_STEP_CENTS
          - entities.TaxReturn.fields.qualifying_children_under_17
        distinguishing_aspect: |
          Mode (a) non-linear interaction with ≥3 inputs (filing_status, agi_cents,
          qualifying_children_under_17) and a nested rounding step where AGI excess must be rounded
          UP to the next $1000 BEFORE applying the 5% phaseout rate — an intentional non-monotonic
          step where AGI=$220_001 yields the same $50 phaseout as AGI=$221_000. Distinct from
          instance 1 (mode b, ordering of per-slice rounding) because here the combinatorial
          complexity lives in the round-up step and conditional MFS branch, not in summation order.
        test_recipe:
          setup:
            - "Taxpayer T2 (ACTIVE)"
            - "TaxReturn R2: tax_year=2025, filing_status=SINGLE, deduction_method=STANDARD, dependents_count=2, qualifying_children_under_17=2"
            - "IncomeDocument W-2 wages_cents=22_500_100 ($225,001)  → AGI=22_500_100"
            - "TaxCredit row credit_type=CTC, requested_amount_cents=400_000"
          trigger:
            - "POST /tax-returns/R2/compute"
          assert:
            - "gross_ctc = 2 * 200_000 = 400_000"
            - "excess = 22_500_100 - 20_000_000 = 2_500_100"
            - "excess_rounded_up_thousand = ((2_500_100 + 99_999) // 100_000) * 100_000 = (2_600_099 // 100_000)*100_000 = 26*100_000 = 2_600_000"
            - "phaseout = floor(2_600_000 * 500 / 10_000) = 130_000"
            - "ctc_total = max(0, 400_000 - 130_000) = 270_000"
            - "TaxCredit.approved_amount_cents == 270_000  (NOT 270_005 which would be sum-then-round)"
            - "ctc_refundable = min(270_000, 2*170_000)=270_000; ctc_nonrefundable=0"

  # ===========================================================================
  # Rule 3: non_linear_state_machine (≥2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tax_return_filed_rejected_redraft_cycle
        grounds:
          - state_machines.TaxReturn
          - state_machines.TaxReturn.transitions[FILED→REJECTED]
          - state_machines.TaxReturn.transitions[REJECTED→DRAFT]
          - state_machines.TaxReturn.transitions[DRAFT→READY_TO_FILE]
          - state_machines.TaxReturn.transitions[READY_TO_FILE→FILED]
        distinguishing_aspect: |
          TaxReturn forms a cycle DRAFT→READY_TO_FILE→FILED→REJECTED→DRAFT (the "fix-and-refile"
          loop). A taxpayer whose return is rejected by IRS can re-enter DRAFT via
          /unlock-for-correction, mutate inputs, recompute, and re-file — same entity revisits
          earlier states with full side-effect chain. Different entity from instance 2
          (AmendedReturn) which lives on a different table entirely.
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "TaxReturn R: SINGLE, deduction_method=STANDARD, wages=2_000_000, withholding=200_000"
            - "POST /tax-returns/R/compute  → status READY_TO_FILE"
            - "POST /tax-returns/R/efile    → status FILED, EFiling E created"
            - "POST /efilings/E/decide outcome=REJECTED, rejection_code=R0001  → status REJECTED"
          trigger:
            - "POST /tax-returns/R/unlock-for-correction  → status DRAFT"
            - "PATCH /income-documents/W2 wages_cents=2_500_000  (status remains DRAFT)"
            - "POST /tax-returns/R/compute  → status READY_TO_FILE"
            - "POST /tax-returns/R/efile    → status FILED"
          assert:
            - "TaxReturn.status visits sequence DRAFT → READY_TO_FILE → FILED → REJECTED → DRAFT → READY_TO_FILE → FILED"
            - "Two distinct EFiling rows exist for the same TaxReturn (first REJECTED, second PENDING)"
            - "TaxReturn.version incremented on every state transition and PATCH"
            - "AuditLog has RETURN_FILED, RETURN_REJECTED, RETURN_REOPENED, RETURN_FILED events"

      - name: amended_return_branching_with_revert
        grounds:
          - state_machines.AmendedReturn
          - state_machines.AmendedReturn.transitions[SUBMITTED→ACCEPTED]
          - state_machines.AmendedReturn.transitions[SUBMITTED→REJECTED]
          - state_machines.TaxReturn.transitions[ACCEPTED→AMENDED]
          - state_machines.TaxReturn.transitions[AMENDED→SUPERSEDED]
        distinguishing_aspect: |
          AmendedReturn exhibits BRANCHING fork from SUBMITTED → {ACCEPTED, REJECTED} with
          divergent side-effect sets: ACCEPTED cascades original TaxReturn AMENDED→SUPERSEDED
          (terminal), while REJECTED reverts original AMENDED→ACCEPTED (compensating undo).
          Different entity from instance 1 (TaxReturn cyclic loop).
        test_recipe:
          setup:
            - "Pre-existing ACCEPTED TaxReturn R with balance_due_or_refund_cents=B0"
            - "POST /amendments {original_return_id=R, reason_summary=X} → A in DRAFT"
            - "POST /amendments/A/submit → A in SUBMITTED, R in AMENDED"
          trigger:
            - "Branch A: POST /amendments/A/decide outcome=REJECTED, rejection_message=Y"
            - "Branch B (separate run): POST /amendments/A/decide outcome=ACCEPTED"
          assert:
            - "Branch A: AmendedReturn.status == REJECTED; original TaxReturn.status reverts from AMENDED back to ACCEPTED"
            - "Branch B: AmendedReturn.status == ACCEPTED; original TaxReturn.status moves AMENDED→SUPERSEDED"
            - "Side effects diverge: ACCEPTED is terminal cascade; REJECTED is compensating revert"

  # ===========================================================================
  # Rule 4: transitive_cascade (≥2 instances, depth ≥3 and ≥2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: compliance_lock_cancels_payments_invalidates_return_depth3
        grounds:
          - state_machines.Taxpayer.transitions[ACTIVE→LOCKED]
          - state_machines.EstimatedTaxPayment.transitions[SCHEDULED→CANCELLED]
          - state_machines.TaxReturn.transitions[READY_TO_FILE→DRAFT]
          - calculations.calc_balance_due_or_refund
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger /taxpayers/{id}/compliance-lock:
          Link 1: Taxpayer ACTIVE→LOCKED writes account_status.
          Link 2: BECAUSE Taxpayer is LOCKED, all SCHEDULED EstimatedTaxPayment rows for this
          taxpayer are auto-cancelled (SCHEDULED→CANCELLED).
          Link 3: BECAUSE those payments left CONFIRMED-or-PENDING set, any future compute on the
          taxpayer's TaxReturn yields a different estimated_payments_applied_cents (link 3 is the
          subsequent recompute showing the chain affected downstream computation, not a fan-out).
          Different trigger from instance 2 (amendment submit) and originates on Taxpayer.
        test_recipe:
          setup:
            - "Taxpayer T ACTIVE"
            - "POST /estimated-payments: tax_year=2025 Q1 amount=50_000 scheduled_pay_date=2026-09-01 (SCHEDULED)"
            - "POST /estimated-payments: tax_year=2025 Q2 amount=50_000 scheduled_pay_date=2026-09-15 (SCHEDULED)"
            - "TaxReturn R in DRAFT with W-2 wages=2_000_000 withholding=200_000"
            - "POST /tax-returns/R/compute → READY_TO_FILE; estimated_payments_applied_cents=0 (none confirmed yet)"
          trigger:
            - "POST /taxpayers/T/compliance-lock"
          assert:
            - "Taxpayer.account_status == LOCKED"
            - "Both EstimatedTaxPayment rows: status == CANCELLED, cancelled_at set"
            - "Any subsequent /tax-returns/R/compute fails with ERR_TAXPAYER_LOCKED (link-3 effect: taxpayer freeze blocks further compute)"
            - "AuditLog records COMPLIANCE_LOCK"

      - name: amendment_accept_cascades_supersede_depth2
        grounds:
          - state_machines.AmendedReturn.transitions[SUBMITTED→ACCEPTED]
          - state_machines.TaxReturn.transitions[AMENDED→SUPERSEDED]
          - calculations.calc_amendment_delta
          - entities.TaxReturn.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from POST /amendments/{id}/decide outcome=ACCEPTED:
          Link 1: AmendedReturn SUBMITTED→ACCEPTED writes AmendedReturn.status.
          Link 2: BECAUSE that link fired, the linked original TaxReturn transitions
          AMENDED→SUPERSEDED (terminal). The second link is CAUSED BY the first, not a parallel
          fan-out from the original trigger. Different trigger from instance 1 (compliance-lock).
        test_recipe:
          setup:
            - "Original TaxReturn R in ACCEPTED status with balance_due_or_refund_cents=B0"
            - "AmendedReturn A in SUBMITTED status referencing R"
          trigger:
            - "POST /amendments/A/decide outcome=ACCEPTED"
          assert:
            - "AmendedReturn.status == ACCEPTED (link 1)"
            - "TaxReturn.status == SUPERSEDED (link 2, caused by link 1)"
            - "AuditLog has AMENDMENT_ACCEPTED then RETURN_SUPERSEDED in order"

  # ===========================================================================
  # Rule 5: priority_pair_validation_conflict (≥2, different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_efile_with_invalid_div
        grounds:
          - validations[priority=7]   # ERR_INVALID_STATE
          - validations[priority=10]  # ERR_QUALIFIED_DIV_EXCEEDS_ORDINARY (business_safety)
          - errors.ERR_INVALID_STATE
          - errors.ERR_QUALIFIED_DIV_EXCEEDS_ORDINARY
        distinguishing_aspect: |
          Error-category pair: state (priority 7) vs business_safety (priority 10). When a
          taxpayer attempts to PATCH an IncomeDocument with qualified > ordinary on a return
          already in FILED state, state precondition (cannot mutate child after FILED) fires
          FIRST per priority order and wins with ERR_INVALID_STATE — not ERR_QUALIFIED_DIV_EXCEEDS_ORDINARY.
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "TaxReturn R in FILED state with EFiling E PENDING"
            - "IncomeDocument D doc_type=1099_DIV, ordinary_dividends_cents=100_000, qualified_dividends_cents=50_000"
          trigger:
            - "PATCH /income-documents/D {qualified_dividends_cents: 200_000, ordinary_dividends_cents: 100_000}"
          assert:
            - "HTTP 409 ERR_INVALID_STATE (state precondition wins over business_safety conflict)"
            - "IncomeDocument unchanged"

      - name: business_referential_vs_business_constraint_duplicate_amendment
        grounds:
          - validations[priority=8]   # ERR_AMENDMENT_NOT_ALLOWED (business_referential)
          - validations[priority=9]   # ERR_AMENDMENT_ALREADY_OPEN (business_referential pair-2)
          - validations[priority=21]  # ERR_INVALID_INPUT (business_fiscal)
          - errors.ERR_AMENDMENT_NOT_ALLOWED
          - errors.ERR_AMENDMENT_ALREADY_OPEN
        distinguishing_aspect: |
          Error-category pair: business_referential (priority 8 ERR_AMENDMENT_NOT_ALLOWED, when
          original is not ACCEPTED) vs business_referential (priority 9 ERR_AMENDMENT_ALREADY_OPEN,
          duplicate amendment). Distinct from instance 1's pair (state vs business_safety): when
          BOTH the original is not ACCEPTED (e.g., still DRAFT) AND a duplicate would also exist,
          priority 8 fires first and wins — exercises within-business priority ordering.
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "Original TaxReturn R in DRAFT status (NOT ACCEPTED)"
            - "AmendedReturn A1 already exists in DRAFT for R (artificial pre-existence)"
          trigger:
            - "POST /amendments {original_return_id: R, reason_summary: 'late W-2'}"
          assert:
            - "HTTP 409 ERR_AMENDMENT_NOT_ALLOWED  (priority 8 wins over priority 9)"

  # ===========================================================================
  # Rule 6: boundary_precision_check (≥2, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: payment_cancel_exact_pay_date_boundary
        grounds:
          - validations[priority=18]   # ERR_PAYMENT_CANNOT_CANCEL
          - state_machines.EstimatedTaxPayment.transitions[SCHEDULED→CANCELLED]
          - endpoints[POST /estimated-payments/{id}/cancel]
          - endpoints[POST /_clock/advance]
        distinguishing_aspect: |
          Boundary: strict `<` (clock.now < scheduled_pay_date) on a datetime metric. Reachable
          via the cancel endpoint. Different metric from instance 2 (numeric currency threshold
          on credit phaseout). Tests the exact transition from "cancel allowed" to "cancel
          rejected" at midnight UTC of the pay-date.
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "POST /estimated-payments: scheduled_pay_date=2026-06-15, amount_cents=100_000 → P SCHEDULED"
          trigger:
            - "POST /_clock/advance to 2026-06-14T23:59:59Z"
            - "POST /estimated-payments/P/cancel  → expect success"
            - "Second payment P2 same date created, advance to 2026-06-15T00:00:00Z"
            - "POST /estimated-payments/P2/cancel  → expect failure"
          assert:
            - "At clock.now=2026-06-14T23:59:59Z: P → CANCELLED, cancelled_at set"
            - "At clock.now=2026-06-15T00:00:00Z: P2 cancel returns HTTP 409 ERR_PAYMENT_CANNOT_CANCEL"
            - "P2.status remains SCHEDULED until clock advances past pay-date, at which point auto-CONFIRMED on next /_clock/advance"

      - name: eitc_phaseout_end_cliff
        grounds:
          - calculations.calc_credits
          - entities.TaxCredit.fields.approved_amount_cents
          - endpoints[POST /tax-returns/{id}/compute]
        distinguishing_aspect: |
          Boundary: `>=` cliff on agi_cents at EITC_PHASEOUT_END_SINGLE[0]=1_882_000. At AGI
          exactly 1_882_000, EITC drops to 0; at AGI=1_881_999, EITC is small but positive (6
          cents). Different metric (numeric currency phaseout) from instance 1 (datetime
          comparison); reachable via /tax-returns/{id}/compute endpoint (distinct endpoint from
          instance 1's /estimated-payments/{id}/cancel).
        test_recipe:
          setup:
            - "Taxpayer T1 (ACTIVE), TaxReturn R1 SINGLE STANDARD, qualifying_children_under_17=0"
            - "W-2 on R1 wages_cents=1_881_999 → AGI=1_881_999"
            - "TaxCredit credit_type=EITC requested_amount_cents=60_000 on R1"
            - "Taxpayer T2 (ACTIVE), TaxReturn R2 SINGLE STANDARD, qualifying_children_under_17=0"
            - "W-2 on R2 wages_cents=1_882_000 → AGI=1_882_000"
            - "TaxCredit credit_type=EITC requested_amount_cents=60_000 on R2"
          trigger:
            - "POST /tax-returns/R1/compute"
            - "POST /tax-returns/R2/compute"
          assert:
            - "On R1: kids=0, range=1_882_000-1_000_000=882_000, excess=881_999, retain_bps=10_000 - floor(881_999*10_000/882_000)=10_000-9_999=1; eitc=floor(60_000*1/10_000)=6"
            - "TaxCredit on R1: eligibility_status=ELIGIBLE, approved_amount_cents == 6, refundable_portion_cents == 6"
            - "On R2: agi >= EITC_PHASEOUT_END[0], eitc=0"
            - "TaxCredit on R2: eligibility_status=ELIGIBLE, approved_amount_cents == 0, refundable_portion_cents == 0"
            - "Boundary >=: 1_882_000 zeroes out; 1_881_999 yields 6"

  # ===========================================================================
  # Rule 7: cross_entity_state_dependency (≥2, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: efile_requires_active_taxpayer
        grounds:
          - state_machines.TaxReturn.transitions[READY_TO_FILE→FILED]
          - state_machines.Taxpayer.transitions[ACTIVE→LOCKED]
          - validations[priority=6]
          - errors.ERR_TAXPAYER_LOCKED
        distinguishing_aspect: |
          Entity pair: TaxReturn × Taxpayer. TaxReturn READY_TO_FILE→FILED transition is gated by
          a precondition on Taxpayer.account_status — if the linked Taxpayer is LOCKED, efile is
          rejected. Different entity pair from instance 2 (AmendedReturn × TaxReturn).
        test_recipe:
          setup:
            - "Taxpayer T initially ACTIVE"
            - "TaxReturn R: compute → READY_TO_FILE"
            - "POST /taxpayers/T/compliance-lock → T LOCKED"
          trigger:
            - "POST /tax-returns/R/efile"
          assert:
            - "HTTP 409 ERR_TAXPAYER_LOCKED (TaxReturn cannot transition because linked Taxpayer is LOCKED)"
            - "TaxReturn.status stays READY_TO_FILE"
            - "No EFiling row created"

      - name: amendment_submit_requires_accepted_original
        grounds:
          - state_machines.AmendedReturn.transitions[DRAFT→SUBMITTED]
          - state_machines.TaxReturn.transitions[ACCEPTED→AMENDED]
          - validations[priority=8]
          - errors.ERR_AMENDMENT_NOT_ALLOWED
        distinguishing_aspect: |
          Entity pair: AmendedReturn × TaxReturn (original). AmendedReturn DRAFT→SUBMITTED is
          gated on TaxReturn.status==ACCEPTED — if original drifts to DRAFT or FILED, submit
          fails. Different entity pair from instance 1 (TaxReturn × Taxpayer).
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "Original TaxReturn R: compute → READY_TO_FILE; efile → FILED"
            - "AmendedReturn A created with original_return_id=R while R in FILED (creation itself fails)  → adapt: create A while R is ACCEPTED, then manipulate R to drift, but R cannot drift without further action; instead use a separate scenario"
            - "Alternate concrete setup: TaxReturn R in DRAFT state (never accepted)"
          trigger:
            - "POST /amendments {original_return_id: R, reason_summary: 'foo'}"
          assert:
            - "HTTP 409 ERR_AMENDMENT_NOT_ALLOWED (AmendedReturn cannot be created because original TaxReturn is not in ACCEPTED state)"
            - "No AmendedReturn row created"

  # ===========================================================================
  # Rule 8: resource_temporal_overlap (≥2, different interval semantics, different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_quarter_payment_overlap_single_year
        grounds:
          - entities.EstimatedTaxPayment.fields.tax_year
          - entities.EstimatedTaxPayment.fields.quarter
          - validations[priority=15]   # uses ERR_DUPLICATE_CREDIT pattern; reuse ERR concept
          - errors.ERR_INVALID_INPUT
        distinguishing_aspect: |
          Interval semantics: discrete (tax_year, quarter) collision — a quarterly window is a
          point-interval (one of four discrete buckets per year). Two EstimatedTaxPayments with
          the same (taxpayer_id, tax_year, quarter, status in SCHEDULED) collide on the same
          discrete bucket. The geometric treatment is bucket-equality (not continuous time-range
          overlap). Different interval semantics from instance 2 (continuous date-range overlap
          on filing_year). NOTE: this scaffold treats duplicate-quarter as ERR_INVALID_INPUT
          input-level validation; see validations[priority=21]. Different resource entity from
          instance 2 (TaxReturn).
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "POST /estimated-payments: tax_year=2025, quarter=Q1, amount=100_000, scheduled_pay_date=2026-04-15 → P1 SCHEDULED"
          trigger:
            - "POST /estimated-payments: tax_year=2025, quarter=Q1, amount=200_000, scheduled_pay_date=2026-04-16"
          assert:
            - "HTTP 422 ERR_INVALID_INPUT (duplicate Q1 SCHEDULED for same taxpayer/year — discrete bucket collision)"
            - "Only P1 exists; second creation rejected"

      - name: duplicate_return_same_year_filing_overlap
        grounds:
          - validations[priority=19]   # ERR_DUPLICATE_RETURN
          - errors.ERR_DUPLICATE_RETURN
          - entities.TaxReturn.fields.tax_year
          - entities.TaxReturn.fields.taxpayer_id
        distinguishing_aspect: |
          Interval semantics: the tax_year integer is a closed annual interval. A taxpayer cannot
          have two TaxReturns in non-DRAFT states for the same tax_year — the year-interval
          treatment uses "is any non-DRAFT row present for the same tax_year". Different from
          instance 1's point-bucket quarter equality: here the conflict is a closed annual
          interval with a status-filter clause (status must be in {READY_TO_FILE, FILED, ACCEPTED,
          AMENDED, SUPERSEDED}). Different resource entity (TaxReturn vs EstimatedTaxPayment).
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "TaxReturn R1: tax_year=2025, computed, FILED, then ACCEPTED"
          trigger:
            - "POST /tax-returns: taxpayer_id=T, tax_year=2025, filing_status=SINGLE"
          assert:
            - "HTTP 409 ERR_DUPLICATE_RETURN (existing non-DRAFT return for same tax_year)"
            - "Only R1 exists"

  # ===========================================================================
  # Rule 9: compensating_invariant (≥2, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: amendment_reject_preserves_original_balance
        grounds:
          - state_machines.AmendedReturn.transitions[SUBMITTED→REJECTED]
          - state_machines.TaxReturn.transitions[ACCEPTED→AMENDED]
          - entities.TaxReturn.fields.balance_due_or_refund_cents
          - calculations.calc_amendment_delta
        distinguishing_aspect: |
          Conserved quantity: original TaxReturn.balance_due_or_refund_cents (currency, signed).
          Forward action: AmendedReturn submit moves TaxReturn ACCEPTED→AMENDED. Compensating
          action: AmendedReturn reject reverts TaxReturn AMENDED→ACCEPTED. After the
          forward+compensate pair, TaxReturn.balance_due_or_refund_cents MUST equal its
          pre-amendment value: invariant is `original.balance_due_or_refund_cents (after reject)
          == original.balance_due_or_refund_cents (before submit)`. Different conserved quantity
          from instance 2 (count-based: count of CONFIRMED EstimatedTaxPayments).
        test_recipe:
          setup:
            - "Original TaxReturn R: filing_status=SINGLE STANDARD, wages=2_000_000, withholding=200_000"
            - "Compute R → balance_due_or_refund_cents = B0 (computed and stored)"
            - "efile R, accept R → status ACCEPTED, B0 unchanged"
            - "Capture B0_pre = R.balance_due_or_refund_cents"
          trigger:
            - "POST /amendments {original_return_id: R, reason_summary: 'test'} → A DRAFT"
            - "POST /amendments/A/submit → A SUBMITTED, R AMENDED"
            - "POST /amendments/A/decide outcome=REJECTED → A REJECTED, R reverts to ACCEPTED"
          assert:
            - "After full cycle: R.status == ACCEPTED"
            - "R.balance_due_or_refund_cents == B0_pre  (invariant: forward+compensate leaves balance unchanged)"
            - "Conserved quantity formula: TaxReturn.balance_due_or_refund_cents pinned across (ACCEPTED → AMENDED → ACCEPTED) cycle"

      - name: confirmed_payments_count_conserved_across_cancel_attempt_post_date
        grounds:
          - state_machines.EstimatedTaxPayment.transitions[SCHEDULED→CONFIRMED]
          - state_machines.EstimatedTaxPayment.transitions[SCHEDULED→CANCELLED]
          - validations[priority=18]
          - entities.EstimatedTaxPayment.fields.status
        distinguishing_aspect: |
          Conserved quantity: count of CONFIRMED EstimatedTaxPayment rows for a (taxpayer_id,
          tax_year) pair (integer count, not currency). Forward action: clock advance past
          pay-date triggers SCHEDULED→CONFIRMED (count +1). Compensating attempt: try cancel
          (which fails with ERR_PAYMENT_CANNOT_CANCEL). The invariant is that the failed cancel
          MUST leave count_of(CONFIRMED) unchanged at its post-advance value. Different conserved
          quantity (integer count) from instance 1 (signed currency balance). Pinned formula:
          `count(EstimatedTaxPayment WHERE taxpayer_id=T AND tax_year=Y AND status=CONFIRMED)`
          before and after the failed cancel are equal.
        test_recipe:
          setup:
            - "Taxpayer T (ACTIVE)"
            - "POST /estimated-payments scheduled_pay_date=2026-04-15, amount=100_000 → P SCHEDULED"
            - "POST /_clock/advance to 2026-04-15T00:00:00Z → P auto-CONFIRMED"
            - "Capture N_pre = count of CONFIRMED for (T, 2025) (should equal 1)"
          trigger:
            - "POST /estimated-payments/P/cancel  (expected failure — already CONFIRMED)"
          assert:
            - "HTTP 409 ERR_INVALID_STATE (state precondition: cancel requires status==SCHEDULED)"
            - "P.status == CONFIRMED unchanged"
            - "N_post = count of CONFIRMED for (T, 2025) == N_pre == 1 (count invariant preserved)"
