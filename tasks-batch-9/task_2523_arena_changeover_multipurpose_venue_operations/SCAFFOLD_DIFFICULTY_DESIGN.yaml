            - "Booking B1 (PROFILE ICE) 2026-09-09T00:00Z..03:00Z and booking B2 (PROFILE CONCERT) 2026-09-09T16:00Z..19:00Z are HELD, and an incumbent ChangeoverOrder between them with crew_headcount 40 occupies the window 2026-09-09T03:45Z..16:00Z (735 minutes against a 708-minute plan)."
            - "Booking B5 (PROFILE COURT) 2026-09-09T12:00Z..15:14Z, booking B3 (PROFILE COURT) 2026-09-09T12:00Z..15:15Z and booking B4 (PROFILE FAMILY) 2026-09-10T00:00Z..03:00Z are HELD."
            - "COURT -> FAMILY with crew_headcount 25 plans to 215 minutes (raw 200 + 0 ice + 0 FULL_BOWL + 15 panel, crew_factor exactly 1.0, daytime window so no overnight multiplier), which both candidate windows comfortably exceed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
