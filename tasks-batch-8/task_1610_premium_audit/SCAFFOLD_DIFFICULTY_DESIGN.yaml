            - { call: "POST /payroll-allocations/${al2}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo2}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { res2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: AuditManager }
          trigger:
            - { call: "POST /audit-work-orders/${wo2}/issue-result", payload: {}, as: AuditManager, as_user_id: "mgr-1", captures: { res2_adj: "$.data.adjustment_cents", res2_status: "$.data.status" } }
            - { call: "GET /audit-results/${res2}/billing-transactions", payload: {}, as: AuditManager, captures: { bill2: "$.data[0].id", bill2_amount: "$.data[0].amount_cents", bill2_type: "$.data[0].type" } }
            - { call: "GET /billing-transactions/${bill1}", payload: {}, as: AuditManager, captures: { bill1_status: "$.data.status" } }
