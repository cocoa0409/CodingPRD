            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T16:30:00Z", onsite_address: "1 Main St", estimated_mileage: 10 }, as: OrgRequester, as_user_id: "${org1}", captures: { req1: $.data.id } }
