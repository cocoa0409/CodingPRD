      - name: corner_root_commodity_load_factor_scales_the_index
        claim_type: Correct Result
        grounds:
          - calculations.wash_water_load_and_target_ppm.constants.LOAD_FACTOR
          - validations[priority=51]
        distinguishing_aspect: "12000 pounds of ROOT celery weigh 21600.00 against the flume because LOAD_FACTOR[ROOT] is 1.8, which lifts the index to 0.540 and the tier to 35.0 where the same poundage of LEAFY product would have produced 0.300 and stayed at 20.0."
        test_recipe:
          setup:
            - "execute BASE steps 1-5, so P_ROMAINE, S_FS, L1 and W1 (4000 gal) exist and the clock is 2026-08-02T05:00:00Z"
