            - "the late ENTREE slip is refused with data.error_id == \"ERR_ENTREE_DEADLINE_PASSED\" and HTTP 409"
            - "the two refusals carry different error_ids, so the safety check did not simply fall through to the temporal one"

  # ===========================================================================
  # Rule 6 — boundary-precision checks on different metrics / endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: feature_start_boundary_is_exact_equality_on_the_clock
        grounds:
          - state_machines.Showtime.SERVICE_to_RUNNING
          - errors[ERR_FEATURE_START_BOUNDARY]
          - endpoints.POST_/showtimes/{id}/start-feature
          - entities.Showtime.fields.start_at_utc
        distinguishing_aspect: |
          An exact-instant boundary reached through the start-feature endpoint: one
          minute before start_at_utc the call is refused, at exactly start_at_utc it
          is accepted, and the status lands on SERVICE rather than RUNNING because
          the equality test is inclusive on the instant.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, kitchen_point_rate 1. ENTREE E1 price 1000 prep 1. Server S1 hired into A."
            - "Showtime X1 on A starts exactly 2026-09-01T20:00:00Z runtime 100. Clock at 2026-09-01T19:59:00Z, with X1 in SERVICE and one ENTREE slip accepted on SA1."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 12", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Pizza", channel: "ENTREE", price_cents: 1000, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Xan", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Arrival", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 9, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
            - call: "POST /showtimes/${x1_id}/start-service"
              payload: {}
              as: KitchenLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:59:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /showtimes/${x1_id}/start-feature"
              payload: {}
              as: KitchenLead
              captures: { err_one_before: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes/${x1_id}/start-feature"
              payload: {}
              as: KitchenLead
            - call: "GET /showtimes/${x1_id}"
              payload: {}
              as: KitchenLead
          assert:
            - "one minute before the boundary the call is refused with data.error_id == \"ERR_FEATURE_START_BOUNDARY\""
            - "at exactly 2026-09-01T20:00:00Z the same call succeeds with HTTP 200"
            - "after the successful call the showtime reads data.status == \"SERVICE\", not \"RUNNING\", because the equality case is treated as still inside the service window"
            - "the showtime reads data.service_mode == \"PRE_SHOW\" immediately after the successful call"

      - name: dining_window_half_open_boundary_admits_exact_abutment
        grounds:
          - validations[priority=12]
          - errors[ERR_OVERLAPPING_SHOWTIME_WINDOW]
          - endpoints.POST_/showtimes
          - entities.Showtime.fields.dining_close_at_utc
          - entities.Showtime.fields.dining_open_at_utc
        distinguishing_aspect: |
          A half-open interval boundary on the schedule endpoint: a second showtime
          opening exactly at the first one's dining_close_at_utc is admitted, while
          the same showtime opening one minute earlier is rejected — the strict
          inequality lives on the close instant, not the start instant.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, screen_lead_time_minutes 20. Showtime X1 on A starts 2026-09-01T20:00:00Z with runtime 60, so its dining window is [19:40, 20:15)."
            - "Clock at 2026-09-01T18:00:00Z."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 13", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Blade Runner", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_deadline: $.data.entree_ready_deadline_utc, x1_close: $.data.dining_close_at_utc }
          trigger:
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Blade Runner 2049 (early)", start_at_utc: "2026-09-01T20:35:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { err_overlap: $.data.error_id }
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Blade Runner 2049 (abutting)", start_at_utc: "2026-09-01T20:36:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x2_id: $.data.id, x2_open: $.data.dining_open_at_utc }
          assert:
            - "the showtime opening one minute before the earlier window closes is rejected with data.error_id == \"ERR_OVERLAPPING_SHOWTIME_WINDOW\""
            - "the showtime opening exactly at 20:16Z, one minute later, is created with HTTP 201 and data.status == \"SCHEDULED\""
            - "X1's derived data.dining_close_at_utc == \"2026-09-01T20:15:00Z\" and the admitted showtime's data.dining_open_at_utc == \"2026-09-01T20:16:00Z\""
            - "the two windows do not overlap, confirming the boundary is half-open on the close instant"

  # ===========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: showtime_open_dining_requires_activated_event_and_approved_preshow
        grounds:
          - state_machines.Showtime.SCHEDULED_to_DINING_OPEN
          - state_machines.ProgrammingEvent.DRAFT_to_ACTIVATED
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_PRE_SHOW_NOT_APPROVED]
          - endpoints.POST_/showtimes/{id}/open-dining
        distinguishing_aspect: |
          Showtime -> ProgrammingEvent: the showtime's own state is unchanged and
          its clock window is wide open, but the transition is refused purely
          because the linked event's pre-show content has not been approved — and
          it starts succeeding the moment the event is approved and activated.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats. ProgrammingEvent PE1 on A with requires_themed_menu true and one themed menu item. Showtime X1 content_type SPECIAL_EVENT on A, clock inside its dining window."
            - "PE1 is left in PRE_SHOW_DRAFT so the linked-event gate is the only thing blocking."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 14", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Curry Poutine", channel: "ENTREE", price_cents: 1100, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /programming-events"
              payload: { auditorium_id: "${aud_id}", theme_name: "Almost Famous Mixtape", requires_themed_menu: true }
              as: ProgrammingCoordinator
              captures: { pe_id: $.data.id, pe_v: $.data.version }
            - call: "POST /programming-events/${pe_id}/themed-menu-items"
              payload: { menu_item_id: "${e1_id}", theme_price_cents: 1250, is_signature: true }
              as: ProgrammingCoordinator
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Almost Famous", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "SPECIAL_EVENT" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id }
          trigger:
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
              captures: { err_unapproved: $.data.error_id }
            - call: "POST /programming-events/${pe_id}/pre-show-content/submit"
              payload: {}
              as: ProgrammingCoordinator
            - call: "POST /programming-events/${pe_id}/pre-show-content/approve"
              payload: {}
              as: PreShowProducer
            - call: "POST /programming-events/${pe_id}/activate"
              payload: { expected_programming_event_version: "${pe_v}" }
              as: ProgrammingCoordinator
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
          assert:
            - "the first open-dining is refused with data.error_id == \"ERR_PRE_SHOW_NOT_APPROVED\" while the showtime itself is still SCHEDULED and its window is wide open"
            - "after the linked event is approved and activated the identical open-dining call succeeds with HTTP 200"
            - "the showtime then reads data.status == \"DINING_OPEN\" and data.mode == \"DINING_OPEN\""

      - name: section_assignment_requires_local_auditorium_membership
        grounds:
          - state_machines.SectionAssignment.ACTIVE_to_REASSIGNMENT_PENDING
          - errors[ERR_SHOWTIME_FOR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_AUDITORIUM_NOT_SERVING]
          - endpoints.POST_/section-assignments
          - entities.Auditorium.fields.status
        distinguishing_aspect: |
          Auditorium -> SectionAssignment: the assignment endpoint resolves the
          showtime strictly against the auditorium named at creation, so the same
          server and the same showtime payload succeed or fail purely on the
          auditorium's state and membership — a different entity pair from the
          Showtime -> ProgrammingEvent dependency.
        test_recipe:
          setup:
            - "Auditoriums A and B, 60 seats each, kitchen_point_rate 1. Server S1 hired into A, server S2 hired into B. Two showtimes: X1 on A and X2 on B, both starting 2026-09-01T20:00:00Z runtime 60."
            - "Clock at 2026-09-01T19:45:00Z. A is open for dining on X1. X2 on B is created but B is still DARK because nothing has opened it."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater A", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_a_id: $.data.id }
            - call: "POST /auditoriums"
              payload: { name: "Theater B", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_b_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Yusuf", home_auditorium_id: "${aud_a_id}" }
              as: PlatformAdmin
              captures: { srv_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:45:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_a_id}", title: "Rashomon", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x_a_id: $.data.id }
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_b_id}", title: "Yojimbo", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x_b_id: $.data.id }
            - call: "POST /showtimes/${x_a_id}/open-dining"
              payload: {}
              as: KitchenLead
          trigger:
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x_b_id}", server_id: "${srv_a_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { err_not_placed: $.data.error_id }
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x_a_id}", server_id: "${srv_a_id}", section_label: "LEFT" }
              as: KitchenLead
          assert:
            - "assigning a section of a showtime on the DARK auditorium B is refused with data.error_id == \"ERR_AUDITORIUM_NOT_SERVING\""
            - "the same server assigned to a section of the showtime on the now-serving auditorium A succeeds with HTTP 201"
            - "the created assignment carries data.auditorium_id == \"${aud_a_id}\" and data.status == \"ACTIVE\""

  # ===========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: servobuffer_overlap_on_the_section_resource
        grounds:
          - validations[priority=10]
          - errors[ERR_SERVER_SECTION_OVERLAP]
          - endpoints.POST_/section-assignments
          - entities.SectionAssignment.fields.section_label
        distinguishing_aspect: |
          Buffered closed-interval semantics on the SECTION resource: a server's
          on-floor window is [dining_open_at_utc, start_at_utc] and two windows
          must be separated by at least SERVO_BUFFER_MINUTES, so a 10-minute gap is
          rejected while a 15-minute gap is admitted even though neither windows
          nor their endpoints touch.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, screen_lead_time_minutes 20, kitchen_point_rate 1. Server S1 hired into A."
            - "Showtime X1 on A starts 2026-09-01T20:00:00Z runtime 60, so its on-floor window is [19:40, 20:00]. Showtime X2 on A starts 2026-09-01T20:50:00Z runtime 60, so its on-floor window is [20:30, 20:50]. Showtime X3 on A starts 2026-09-01T20:55:00Z runtime 60, so its on-floor window is [20:35, 20:55]."
            - "Clock at 2026-09-01T19:45:00Z. S1 already holds the section on X1."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 15", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Zoe", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:45:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Se7en", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id }
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Zodiac", start_at_utc: "2026-09-01T20:50:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x2_id: $.data.id }
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Prisoners", start_at_utc: "2026-09-01T20:55:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x3_id: $.data.id }
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
          trigger:
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x2_id}", server_id: "${srv1_id}", section_label: "CENTER" }
              as: KitchenLead
              captures: { err_buffer: $.data.error_id }
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x3_id}", server_id: "${srv1_id}", section_label: "RIGHT" }
              as: KitchenLead
          assert:
            - "the assignment on X2 is refused with data.error_id == \"ERR_SERVER_SECTION_OVERLAP\" and HTTP 409"
            - "the assignment on X3 succeeds with HTTP 201 because its window opens 15 minutes after X1's closes, exactly the buffer, and a separation of exactly SERVO_BUFFER_MINUTES is admitted"
            - "X1's on-floor window closes at 2026-09-01T20:00:00Z and X2's opens at 2026-09-01T20:30:00Z, so a 30-minute separation is admitted while the 15-minute case is the boundary"

      - name: aggregate_daily_cap_on_the_server_resource
        grounds:
          - validations[priority=11]
          - errors[ERR_SERVER_HARD_CAP_EXCEEDED]
          - endpoints.POST_/section-assignments
          - entities.Server.fields.shift_load_projected
        distinguishing_aspect: |
          Whole-day aggregate-capacity semantics on the SERVER resource, a
          different resource and a different arithmetic from the buffered rule: the
          count of the server's non-terminal assignments created on the same
          service day is capped at 3, so a fourth assignment is refused even though
          nothing about its window overlaps anything.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, screen_lead_time_minutes 20, kitchen_point_rate 1. Server S1 hired into A."
            - "Four showtimes on A on 2026-09-01, all well separated: starts 20:00, 22:00, 2026-09-02T00:00:00Z and 03:00Z. S1 already holds sections on the first three, all created on the same service day, so shift_load_projected is 3, the cap."
            - "Clock at 2026-09-01T19:45:00Z."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 16", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Abe", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:45:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "One", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id }
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Two", start_at_utc: "2026-09-01T22:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x2_id: $.data.id }
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Three", start_at_utc: "2026-09-02T00:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x3_id: $.data.id }
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Four", start_at_utc: "2026-09-02T03:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x4_id: $.data.id }
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x2_id}", server_id: "${srv1_id}", section_label: "CENTER" }
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x3_id}", server_id: "${srv1_id}", section_label: "RIGHT" }
              as: KitchenLead
          trigger:
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x4_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { err_cap: $.data.error_id }
            - call: "GET /servers/${srv1_id}"
              payload: {}
              as: KitchenLead
          assert:
            - "the fourth assignment of the service day is refused with data.error_id == \"ERR_SERVER_HARD_CAP_EXCEEDED\" and HTTP 409"
            - "the refusal happens with no service-time overlap between the fourth showtime and any of the first three, so it is the whole-day count and not an interval test that rejected it"
            - "the server reads data.shift_load_projected == 3 both before and after the refused call, since a rejected assignment does not enter the count"

  # ===========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: compensating_refund_leaves_the_settled_tab_at_zero
        grounds:
          - calculations.compensation_refund
          - calculations.order_slip_completion
          - state_machines.CheckTab.PARTIALLY_REFUNDED_to_REFUNDED
          - errors[ERR_REFUND_EXCEEDS_ORIGINAL]
          - endpoints.POST_/disturbance-events/{id}/approve-ejection
          - endpoints.POST_/checks/{id}/close
        distinguishing_aspect: |
          The conserved quantity is the settled money on a tab: after a service
          compensation and then the compensating ejection refund, original_cents
          minus refunded_cents must be exactly zero, so a second refund of the
          original amount would breach the invariant and a later settlement cannot
          double-collect.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, kitchen_point_rate 1. ENTREE E1 price 1000 prep 1. Server S1 hired into A."
            - "Showtime X1 on A starts 2026-09-01T20:00:00Z runtime 100, entree_ready_deadline 21:15. Clock starts at 2026-09-01T19:40:00Z, X1 DINING_OPEN, SA1 (S1, LEFT). One ENTREE slip of 1x E1 at seat 40, subtotal 1000 cents."
            - "The slip is still in flight when the clock passes the entree deadline, so it books a 30 percent service compensation of 300 cents before the ejection refund lands."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 17", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Chili", channel: "ENTREE", price_cents: 1000, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Bo", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "The Thing", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 40, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { slip_id: $.data.id }
            - call: "POST /showtimes/${x1_id}/start-service"
              payload: {}
              as: KitchenLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T21:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /showtimes/${x1_id}/start-feature"
              payload: {}
              as: KitchenLead
            - call: "GET /checks"
              payload: { order_slip_id: "${slip_id}" }
              as: KitchenLead
              captures: { check_id: "$.data[0].id", check_refunded_after_auto: "$.data[0].refunded_cents", check_original: "$.data[0].original_cents" }
            - call: "POST /disturbance-events"
              payload: { order_slip_id: "${slip_id}", kind: "NO_TALKING" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { de_id: $.data.id }
            - call: "POST /disturbance-events/${de_id}/approve-ejection"
              payload: {}
              as: KitchenLead
            - call: "GET /checks/${check_id}"
              payload: {}
              as: KitchenLead
            - call: "POST /checks/${check_id}/refund"
              payload: { refund_cents: 1000 }
              as: KitchenLead
              captures: { err_double: $.data.error_id }
          assert:
            - "after the service compensation the check reads data.refunded_cents == 300 and data.status == \"PARTIALLY_REFUNDED\""
            - "after the ejection refund the same check reads data.refunded_cents == 1000, data.status == \"REFUNDED\" and data.reason_code == \"EJECTION_NO_TALKING\""
            - "the invariant holds exactly: data.original_cents minus data.refunded_cents == 0"
            - "the further refund of 1000 cents is rejected with data.error_id == \"ERR_REFUND_EXCEEDS_ORIGINAL\" and HTTP 422"
            - "no second refund of 300 or 1000 cents is bookable, so the compensating action left the conserved tab quantity at exactly zero"

      - name: void_and_recreate_leaves_the_kitchen_fire_budget_unchanged
        grounds:
          - calculations.ticket_fire_reallocation
          - calculations.ticket_sequence_position
          - calculations.ticket_priority_score
          - endpoints.POST_/kitchen-tickets/{id}/void
          - endpoints.POST_/kitchen-tickets/{id}/refresh
        distinguishing_aspect: |
          The conserved quantity is kitchen fire capacity rather than money: summing
          ceil(point_cost / kitchen_point_rate) over the cold-line cohort must equal
          the span between the entree fire instant and the last ticket's completion,
          both before and after a void — voiding the middle ticket of a run compacts
          the survivors without creating or destroying a minute of capacity.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, kitchen_point_rate 1, screen_lead_time_minutes 20. ENTREE E1 price 1000 prep_minutes 1, ENTREE E2 price 1000 prep_minutes 3. Server S1 hired into A."
            - "Showtime X1 on A starts 2026-09-01T20:00:00Z runtime 100, so ENTRÉE_FIRE_AT is 19:30. Clock at 2026-09-01T19:40:00Z. Three ENTREE slips on SA1, each one line: slip P 1x E1, slip Q 1x E2, slip R 1x E1, so the cohort costs 1 + 3 + 1 == 5 points and occupies 5 fire minutes from 19:30 to 19:35."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 18", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Garlic Bread", channel: "ENTREE", price_cents: 1000, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Deep Dish", channel: "ENTREE", price_cents: 1000, prep_minutes: 3, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e2_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Cai", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Goodfellas", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 1, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { p_slip_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 2, lines: [ { menu_item_id: "${e2_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { q_slip_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 3, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { r_slip_id: $.data.id }
            - call: "POST /showtimes/${x1_id}/start-service"
              payload: {}
              as: KitchenLead
            - call: "GET /showtimes/${x1_id}/kitchen-tickets"
              payload: { station: "cold_line" }
              as: KitchenLead
              captures: { p_ticket_id: "$.data[0].id", q_ticket_id: "$.data[1].id", r_ticket_id: "$.data[2].id", before_points: "$.data[0].point_cost" }
          trigger:
            - call: "GET /kitchen-tickets/${q_ticket_id}"
              payload: {}
              as: KitchenLead
              captures: { q_points: $.data.point_cost, q_seq: $.data.sequence_position, q_fire: $.data.fire_at_utc }
            - call: "POST /kitchen-tickets/${q_ticket_id}/void"
              payload: { reason_code: "SERVICE_OVERFLOW" }
              as: KitchenLead
            - call: "GET /kitchen-tickets/${r_ticket_id}"
              payload: {}
              as: KitchenLead
            - call: "POST /kitchen-tickets/${r_ticket_id}/refresh"
              payload: {}
              as: KitchenLead
              captures: { r_points: $.data.point_cost, r_seq: $.data.sequence_position, r_projected: $.data.projected_delivery_at_utc }
            - call: "GET /showtimes/${x1_id}/kitchen-tickets"
              payload: { station: "cold_line", status: "QUEUED" }
              as: KitchenLead
          assert:
            - "before the void the cold-line cohort costs 5 points and spans 5 fire minutes, so the invariant reads sum(ceil(point_cost / 1)) == 5 == last_fire_at_utc - 19:30"
            - "the voided middle ticket Q reported data.point_cost == 3 and data.sequence_position == 2 before it was voided"
            - "the filtered read of QUEUED cold-line tickets returns an array whose data holds exactly 2 elements, with the envelope reporting total_count == 2 and has_more == false"
            - "the surviving ticket R moves from sequence_position 3 to sequence_position 2 and its fire instant moves one minute earlier, so no gap is left behind"
            - "the invariant still holds after the void: the surviving cohort costs 1 + 1 == 2 points and spans 2 fire minutes, so sum(ceil(point_cost / 1)) == 2 == last_fire_at_utc - 19:30"
            - "the total fire budget consumed is unchanged in the sense that capacity was neither created nor destroyed — the 3 points voided are simply gone from the span rather than parked somewhere else"
