      - name: talent_adjacency_allowed_and_no_show_releases_the_window_but_not_the_cap
        grounds:
          - validations[priority=34]
          - validations[priority=35]
          - state_machines.AdrSession.CONFIRMED_to_NO_SHOW
          - calculations.adr_session_cost
          - errors.ERR_TALENT_WINDOW_CONFLICT
        distinguishing_aspect: |
          Talent windows carry NO buffer, so a session starting exactly at another's end is legal —
          the opposite of the stage rule — and a NO_SHOW cancellation leaves the OVERLAP set while
          staying in the daily-CAP set and inside adr_cost_cents: the same 10:30 -> 11:30 window is
          rejected before the no-show and accepted after it, yet the billed day still contains the
          no-show session (adr_cost_cents 108000, of which the newly accepted PROPOSED session
          contributes nothing).
        test_recipe:
          setup:
            - "UNION talent, min_call_minutes 60, daily_cap_minutes 240."
            - "Locked STANDARD project."
            - "Session A 2026-09-14T09:00:00Z -> 10:00:00Z, CONFIRMED (billable 60.00, 54000)."
            - "Session B 2026-09-14T10:00:00Z -> 11:00:00Z, adjacency with A, CONFIRMED (billable 60.00, 54000)."
            - "Candidate session C 2026-09-14T10:30:00Z -> 11:30:00Z overlaps B by 30 minutes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
