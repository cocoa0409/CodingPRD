              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }] }
              as: InspectionTechnician
