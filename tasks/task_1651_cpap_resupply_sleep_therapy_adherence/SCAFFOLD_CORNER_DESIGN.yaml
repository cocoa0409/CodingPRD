      - name: compliance_gate_blocks_clinical_clear
        claim_type: cross_entity_validation
        grounds: ["validations[priority=11]", "errors[ERR_COMPLIANCE_NOT_CURRENT]"]
        distinguishing_aspect: "After a non-compliant finalized report, clinical-clear is blocked (not first-fill grace)"
        test_recipe:
          setup: ["Patient RENTAL setup complete; non-compliant report finalized -> is_compliance_current=false; a first order was already dispensed (so not first-fill)"]
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { ppo: $.data.id }
