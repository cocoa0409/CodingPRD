            - "node_action == NONE because the window is not breached and the node was ELIGIBLE, not PROBATION; Store.${s1}.node_status stays ELIGIBLE and consecutive_breach_windows stays 0"
            - "Store.${s1}.review_score == 83.60 (capacity 40 * 118/200 = 23.6000 with units_committed_epoch still 2, labour 30.0000, performance 30 * 1.0 = 30.0000)"
            - "Store.${s1}.units_committed_epoch == 0 after step 4 and eligibility_score == 84.00 with eligibility_score_basis == TRAILING_WINDOW after step 7"
            - "a new NodePerformanceWindow exists with status OPEN and epoch 2, so GET /performance-windows?store_id=${s1} reports total_count 2"

      - name: cross_entity_pickup_gate_on_assignment_ship
        claim_type: cross_entity
        grounds:
          - state_machines.CarrierPickup
          - validations.priority_15
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ship_is_gated_by_the_carrier_pickup_state_not_the_assignment_state
          rationale: "The cross-entity cascade claim - a PACKED assignment being refused because the CarrierPickup it targets is CLOSED, then succeeding against a SCHEDULED pickup - is exactly the cross_entity_state_dependency instance of the same name in §1.8, which asserts ERR_PICKUP_STATE_INVALID and then the successful ship with unchanged assignment state in between."
      - name: inventory_reservation_ledger_round_trip
        claim_type: ledger_sync
        grounds:
          - calculations.reserved_units_reconciliation
          - entities.StoreInventory.fields.reserved_units
        excluded_because:
          difficulty_instance: compensating_invariant / inventory_reservation_round_trip_restores_available_to_promise
          rationale: "The ledger-sync claim that StoreInventory.reserved_units and available_to_promise_units stay in lockstep with the set of non-terminal assignments across commit, reject and reroute is the compensating_invariant instance of that name in §1.8, which pins every intermediate reserved_units and ATP value."
      - name: reject_release_compensation
        claim_type: compensation
        grounds:
          - endpoints.POST /fulfillment-network/assignments/{assignment_id}/reject
          - calculations.reserved_labor_minutes_reconciliation
        excluded_because:
          difficulty_instance: transitive_cascade / reject_release_reroute_chain_reprices_two_nodes
          rationale: "The compensation claim - a reject releasing the losing node's inventory and labour reservations and re-pricing both nodes through the reroute - is the transitive_cascade instance of that name in §1.8, which pins both eligibility scores and the reroute-overhead-bearing order cost."
      - name: short_pick_branching_shape
        claim_type: branching
        grounds:
          - state_machines.FulfillmentAssignment
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / assignment_short_pick_fork_rejoins_at_packed
          rationale: "The branching-shape claim for state_machine_shape branching - ACCEPTED forking to PICKED or SHORT_PICKED and both edges rejoining at PACKED - is the non_linear_state_machine instance of that name in §1.8, which walks both arms of the fork in one recipe."

