      - name: rating_dispute_overruled_recomputes_snapshot_excluding_complaint
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RatingDispute.UNDER_APPEAL_REVIEW_to_OVERRULED
          - calculations.rating_score
        distinguishing_aspect: "An OVERRULED appeal recomputes the rating with the disputed complaint removed from every input set: a LARGE business scored 88 (one UNANSWERED 12 + one RESOLVED) jumps to 100 when the unanswered complaint is excluded, the old snapshot is superseded, and Business.version advances."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business founded 2018-01-01."
            - "c1 UNANSWERED (expired via sweep at 2026-09-16); c2 RESOLVED (accepted). PUBLISHED snapshot s1: score 88, grade B_PLUS."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_large
            - *k_c1_file
            - *k_c1_forward
            - &k_clock_916
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: BureauAdmin
            - *k_sweep
            - *k_c2_file
            - call: "POST /complaints/${c2_id}/forward"
              payload: {}
              as: BureauAdmin
            - call: "POST /complaints/${c2_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "fixed" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /complaints/${c2_id}/responses"
              payload: { kind: "CONSUMER_ACCEPT", body: "ok" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "POST /businesses/${biz_id}/rating-snapshots"
              payload: { variant: "PUBLISHED" }
              as: BureauAdmin
              captures: { snap1_id: $.data.id, snap1_score: $.data.score }
            - call: "GET /businesses/${biz_id}"
              payload: {}
              as: BureauAdmin
              captures: { biz_v_now: $.data.version }
            - call: "POST /businesses/${biz_id}/rating-disputes"
              payload: { snapshot_id: "${snap1_id}", reason: "we never received complaint c1", expected_business_version: "${biz_v_now}", disputed_complaint_id: "${c1_id}" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /rating-disputes/${disp_id}/appeal-decision"
              payload: { decision: "OVERRULED" }
              as: BureauAdmin
          assert:
            - "RatingDispute.${disp_id}.status == OVERRULED"
            - "a new PUBLISHED snapshot exists with excluded_complaint_id == ${c1_id}, score == 100, grade == A_PLUS (c2 RESOLVED alone deducts nothing)"
            - "the old snapshot ${snap1_id} has superseded_by_id == the new snapshot id"
            - "Business.${biz_id}.current_published_score == 100 and current_published_grade == A_PLUS"
            - "Business.${biz_id}.version advanced by the dispute filing and again by the overruling"

