      - name: bfpp_compliance_is_one_with_no_obligations_and_after_full_imposition
        claim_type: weighted_scoring
        grounds:
          - calculations.bfpp_compliance.formula
          - calculations.bfpp_compliance.constants.OBLIGATION_WEIGHTS
          - state_machines.LiabilityProtection.OBLIGATIONS_NONE_to_CURRENT
        distinguishing_aspect: "The empty-denominator branch returns compliance_pct 1.0 with obligation_state OBLIGATIONS_NONE (not a division by zero and not 0.0), and after all five categories are imposed the integer weights sum to exactly 20 with compliance_pct 1.0000 and obligation_state CURRENT."
        test_recipe:
          setup:
            - "Clock 2026-08-01; parties and site created; liability protection opened with zero obligations."
            - "AAI completed and the site acquired so bfpp_status is ESTABLISHED throughout."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
          trigger:
            - &c_ob_rs
              call: "POST /liability-protections/${prot_id}/continuing-obligations"
              payload: { obligation_category: REASONABLE_STEPS, description: "Maintain fencing, signage and stormwater controls.", due_date: "2027-03-01", recurrence_days: 90 }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
