    roles: [LeaseManager]
    code: 200
    input: [expected_listing_version, confirmed_funds]
    output: ResaleListing
    side_effects: ["status → CLOSED; seller GroundLease → TERMINATED; buyer GroundLease auto-created in DRAFT; buyer WaitlistEntry → FULFILLED; Unit.occupancy_status → VACANT; increments ResaleListing.version by 1"]

  - method: POST
    path: "/programs/{id}/units/{unitId}/resale-listings/{listingId}/cancel"
