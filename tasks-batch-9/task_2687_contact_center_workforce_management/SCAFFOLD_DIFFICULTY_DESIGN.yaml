            - call: "POST /outsource-partners"
              payload: { legal_name: "Voice Only Partners BV", skill_codes: ["VOICE_EN"], rate_per_contact_millicents: 9000, interval_max_volume: 50, commitment_floor_volume: 10, performance_threshold_pct: 0.8500, billing_basis: "DELIVERED_ONLY" }
              as: SourcingManager
