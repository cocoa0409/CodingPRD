            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo_b}", technician_id: "${tech_id}", service_bay_id: "${bay_id}", service_location: "IN_SHOP", start_at: "2026-06-13T13:30:00Z", end_at: "2026-06-13T14:30:00Z" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "second appointment 13:30-14:30 fails 409 ERR_TECHNICIAN_DOUBLE_BOOKED (positive overlap, no buffer)"

      - name: calibration_bay_overlap_with_15min_buffer
        grounds:
          - validations[priority=12]
          - endpoints./recalibration-jobs
