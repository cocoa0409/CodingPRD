          rationale: "ERR_RESTRICTION_DAYS_EXCEEDED is triggered there at 46 aggregate days with 44 and 45 shown to pass."

      - name: parcel_has_open_charges_code
        claim_type: triggerability
        excluded_because:
          difficulty_instance: subdivision_gate_tracks_every_blocking_charge_state
          rationale: "ERR_PARCEL_HAS_OPEN_CHARGES is triggered there once per blocking charge status (OPEN, DELINQUENT, LIEN_ENCUMBERED) with PENDING, PAID and VOIDED shown not to block."

      - name: parent_member_not_found_code
        claim_type: triggerability
        excluded_because:
          difficulty_instance: connection_approval_depends_on_parent_member_and_roll_states
          rationale: "ERR_PARENT_MEMBER_NOT_FOUND is triggered there on a child lot whose parent parcel has no verified member, alongside the ERR_ROLL_NOT_FOUND branch of the same approval gate."

