            - "the clock then advances to 2026-08-25T00:00:00Z, so 10 pouch dose dates (2026-08-15..2026-08-24) have elapsed and the rolling window is [2026-07-28, 2026-08-25)"
            - "the patient reports 8 POUCH_TAKEN (2026-08-15..2026-08-22) and 1 POUCH_MISSED (2026-08-23); the 2026-08-24 pouch is never reported at all"
