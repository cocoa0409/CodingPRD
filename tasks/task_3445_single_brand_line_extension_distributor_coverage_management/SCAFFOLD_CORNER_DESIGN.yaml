      - name: clock_regression_rejected_then_forward_accepted
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CLOCK_REGRESSION
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The logical clock only moves forward: setting 2026-08-01 (before the 2026-09-01 startup default) fails 400 ERR_CLOCK_REGRESSION; a forward set succeeds and returns the new time."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { now: $.data.current_utc }
          assert:
