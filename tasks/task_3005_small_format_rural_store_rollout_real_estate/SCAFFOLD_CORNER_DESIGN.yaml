      - name: trade_area_adjusted_score_requalify_check
        claim_type: conditional_validation
        grounds:
          - calculations.trade_area_score
        distinguishing_aspect: "Conditional aggregation: the adjusted variant depends on the LIVE count of same-program OPEN/EXISTING stores — an area at raw 59.24 qualifies standard, drops to 55.68 adjusted once two EXISTING stores exist (still QUALIFIED but observably different score), and a rescreen after they are gone returns to the standard value."
        test_recipe:
          setup: ["ACTIVE program; trade area B (drive 20, hh 3000, income 4500000, gap 20); no existing stores yet"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
