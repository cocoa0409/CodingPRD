  - rule_id: boundary_precision_check
    instances:
      - name: match_score_exactly_at_flag_threshold_versus_three_ten_thousandths_below
        grounds:
          - calculations.listing_match_score
          - entities.MonitoredListing.fields.monitor_status
          - entities.MonitoredListing.fields.violation_type
        distinguishing_aspect: |
          0.70/0.70 with price_deviation_factor 0.7000 lands on match_score exactly
          0.7000 and MUST flag (the comparison is >=), while 0.70/0.6990 lands on
          0.6997 and MUST clear — a 0.0003 gap that also flips violation_type from
          COPYRIGHT to NONE.
        test_recipe:
          setup:
            - "Brand with authorized_msrp_cents 10000 and a seller with zero strike points (no risk boost)"
            - "Two identical listings priced 3000 cents, both monitor_status NEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0EDGE001", title_text: "ACME wrench edge one", image_hash: "IMGEDGE1", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_hi_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0EDGE002", title_text: "ACME wrench edge two", image_hash: "IMGEDGE2", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_lo_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/listings/${listing_hi_id}/screen"
              payload: { image_match_score: 0.70, text_match_score: 0.70 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/listings/${listing_lo_id}/screen"
              payload: { image_match_score: 0.70, text_match_score: 0.6990 }
