      - name: outage_calendar_half_open_aggregate_cap_of_two_concurrent_systems
        grounds:
          - validations[priority=41]
          - state_machines.AuxiliarySystem.PROPOSED_to_COMMISSIONED
          - entities.AuxiliarySystem.fields.outage_start_at
          - entities.AuxiliarySystem.fields.outage_end_at
          - errors.ERR_OUTAGE_CONCURRENCY_EXCEEDED
        distinguishing_aspect: |
          The outage rule is an AGGREGATE capacity over HALF-OPEN windows, not a pairwise conflict: two
          overlapping outages are legal and only the third simultaneous one is refused. The candidate
          [11:30, 13:00) is rejected because the sub-interval [11:30, 12:00) sits inside both existing
          windows, while [12:00, 13:00) is accepted because the first window ends exclusively at 12:00
          and only one other outage is then in flight. A pairwise overlap check would wrongly reject
          the second window, and a closed-interval reading would wrongly reject the touching candidate.
        test_recipe:
          setup:
            - "Project FP-2601 in DESIGN with design_posture OPEN, so commissioning is permitted"
            - "Three STANDPIPE_CLASS_II systems of 1 riser each, 100.0 gpm apiece, all PROPOSED"
