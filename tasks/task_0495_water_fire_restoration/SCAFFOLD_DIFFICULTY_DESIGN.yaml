              as: Estimator
              captures: { e2: $.data.id }
            - call: "POST /restoration/estimates/${e1}/approve"
              payload: {}
              as: Adjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /restoration/estimates/${e2}/approve"
              payload: {}
              as: Adjuster
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "InsuranceClaim.${claim_id}.status == SETTLED after E1 approval"
            - "trigger response status == 409"
            - "data.error_id == ERR_CLAIM_ALREADY_SETTLED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: equipment_unit_single_occupancy_collision
        grounds:
          - validations[priority=9]
          - entities.EquipmentUnit.fields.status
          - entities.EquipmentUnit.fields.active_placement_id
          - errors[ERR_EQUIPMENT_NOT_AVAILABLE]
        distinguishing_aspect: |
          Resource EquipmentUnit, capacity-1 single-occupancy interval semantics: a unit's ACTIVE
          placement occupies an open-ended interval [placed_on_day, infinity); a second placement of the
          same unit collides with that open occupation and is rejected ERR_EQUIPMENT_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "A WATER job with two chambers R1, R2; one AIR_MOVER unit already ACTIVE-placed in R1 (status DEPLOYED)."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P15", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-15", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am15: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "15 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R2", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch2: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am15}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl1: $.data.id }
          trigger:
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch2}", equipment_unit_id: "${am15}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "EquipmentUnit.${am15}.status == DEPLOYED and active_placement_id == ${pl1}"
            - "trigger response status == 409"
            - "data.error_id == ERR_EQUIPMENT_NOT_AVAILABLE"

      - name: chamber_aggregate_capacity_undersized
        grounds:
          - validations[priority=11]
          - state_machines.LossJob.MITIGATION_to_MONITORING
          - entities.DryingChamber.fields.air_movers_required
          - errors[ERR_EQUIPMENT_UNDERSIZED]
        distinguishing_aspect: |
          Resource DryingChamber, aggregate-capacity interval semantics (distinct from EquipmentUnit's
          capacity-1 occupancy): begin-monitoring requires the SUM of ACTIVE placement units in each OPEN
          chamber to meet its required air-mover/dehumidifier floor; a chamber needing 13 air movers but
          holding only 1 fails ERR_EQUIPMENT_UNDERSIZED.
        test_recipe:
          setup:
            - "A WATER class-2 job in MITIGATION with chamber R1 (700 sqft => air_movers_required=13, dehumidifiers_required=10) holding only 1 air mover and 0 dehumidifiers ACTIVE."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P16", peril: "WATER", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-16", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am16: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "16 Main", loss_type: "WATER", water_category: 2, water_class: 2 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 700, wet_wall_linear_ft: 40, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id, am_req: $.data.air_movers_required }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am16}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/start-mitigation"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /restoration/jobs/${job_id}/begin-monitoring"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "DryingChamber.${ch1}.air_movers_required == 13"
            - "trigger response status == 409"
            - "data.error_id == ERR_EQUIPMENT_UNDERSIZED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: place_remove_conserves_pool_availability
        grounds:
          - state_machines.EquipmentPlacement.ACTIVE_to_REMOVED
          - entities.EquipmentUnit.fields.status
          - entities.EquipmentUnit.fields.active_placement_id
        distinguishing_aspect: |
          Conserved quantity = count of AVAILABLE EquipmentUnits in the pool. The forward action
          (place) DEPLOYS a unit (AVAILABLE count -1); the compensating action (remove) returns it
          (AVAILABLE count +1). Place then remove leaves the AVAILABLE count exactly equal to its
          pre-place value (1 unit, count returns to 1).
        test_recipe:
          setup:
            - "A WATER job; one AIR_MOVER unit AVAILABLE in the pool; one chamber R1."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P17", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-17", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am17: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "17 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am17}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl1: $.data.id }
          trigger:
            - call: "POST /restoration/placements/${pl1}/remove"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st: $.data.status }
          assert:
            - "Before place: GET /restoration/equipment-units?status=AVAILABLE total_count == 1"
            - "After place: EquipmentUnit.${am17}.status == DEPLOYED (AVAILABLE count 0)"
            - "After remove: EquipmentUnit.${am17}.status == AVAILABLE and active_placement_id == null"
            - "After remove: GET /restoration/equipment-units?status=AVAILABLE total_count == 1 (conserved)"

      - name: contents_waterfall_conserves_allocation_total
        grounds:
          - calculations.contents_valuation_waterfall
          - entities.ContentsItem.fields.allocated_value_cents
          - entities.ContentsItem.fields.declared_value_cents
        distinguishing_aspect: |
          Conserved quantity = allocated cents (different conserved type than unit count): the waterfall
          guarantees sum(allocated_value_cents) == min(claim_limit, sum(declared)). With three items
          50000/30000/40000 and claim_limit 100000, allocations are 50000/30000/20000 summing to exactly
          100000 = min(100000, 120000).
        test_recipe:
          setup:
            - "A WATER job; claim coverage 100000 deductible 0; three PACKED_OUT items in created_at order with declared 50000, 30000, 40000."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P18", peril: "WATER", coverage_limit_cents: 100000, deductible_cents: 0 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "WRT" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "18 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/contents"
              payload: { job_id: "${job_id}", description: "Sofa", declared_value_cents: 50000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { i1: $.data.id }
            - call: "POST /restoration/contents"
              payload: { job_id: "${job_id}", description: "TV", declared_value_cents: 30000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { i2: $.data.id }
            - call: "POST /restoration/contents"
              payload: { job_id: "${job_id}", description: "Desk", declared_value_cents: 40000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { i3: $.data.id }
          trigger:
            - call: "POST /restoration/jobs/${job_id}/contents/value"
              payload: {}
              as: Adjuster
              as_user_id: "adj-1"
              captures: { alloc_total: $.data.allocated_total_cents }
          assert:
            - "ContentsItem.${i1}.allocated_value_cents == 50000"
            - "ContentsItem.${i2}.allocated_value_cents == 30000"
            - "ContentsItem.${i3}.allocated_value_cents == 20000"
            - "data.allocated_total_cents == 100000 == min(100000, 120000)"
