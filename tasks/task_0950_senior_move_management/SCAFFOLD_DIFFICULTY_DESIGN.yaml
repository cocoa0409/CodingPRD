scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: crew_hours_portal_vs_billing_rounding_order
        grounds:
          - calculations.crew_billable_hours
          - calculations.crew_overtime_split
          - calculations.crew_assignment_labor_cents
          - entities.CrewAssignment.fields.portal_hours
          - entities.CrewAssignment.fields.billing_hours
        distinguishing_aspect: |
          On the CrewAssignment/TimeEntry domain the PORTAL_VIEW variant rounds each
          entry to the quarter hour before summing and yields 8.00 hours, while the
          BILLING_VIEW variant sums the raw hours before rounding and yields 8.25
          hours for the identical three entries; the 0.25 h difference alone pushes
          applied_hours across HOURLY_OT_DAILY_THRESHOLD_HOURS and adds 2550 cents
          of overtime that the portal number would never show.
        test_recipe:
          setup:
            - "One HOURLY engagement in home_tier STUDIO whose move-day plan is IN_PROGRESS."
            - "A PACKER crew assignment at 6800 cents/hour, checked in at 14:00Z, carrying two TRAVEL time entries of exactly 1.1 h each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142", email: "ada@example.com" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /portal-parties"
              payload: { engagement_id: "${eng}", party_type: "CLIENT", display_name: "Ada Whitfield", email: "ada@example.com", client_id: "${cl}" }
              as: MOVE_MANAGER
              captures: { pc: "$.data.id" }
            - call: "POST /destination-residences"
              payload: { engagement_id: "${eng}", name: "Maple Grove 12B", unit_type: "APARTMENT", address_line: "12B Maple Grove Way" }
              as: MOVE_MANAGER
              captures: { res: "$.data.id" }
            - call: "POST /destination-rooms"
              payload: { destination_residence_id: "${res}", room_type: "LIVING", nominal_linear_inches: 240, nominal_volume_cft: 400, approved_addendum_linear_inches: 36 }
              as: MOVE_MANAGER
              captures: { room: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Walnut sideboard", category: "FURNITURE", footprint_linear_inches: 96, volume_cft: 40, appraised_value_cents: 200000, appraisal_source: "APPRAISED" }
              as: MOVE_MANAGER
              captures: { it1: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Reading chair", category: "FURNITURE", footprint_linear_inches: 90, volume_cft: 35 }
              as: MOVE_MANAGER
              captures: { it2: "$.data.id" }
            - call: "POST /inventory-items/${it1}/designate"
              payload: { disposition: "KEEP", assigned_room_id: "${room}" }
              as: MOVE_MANAGER
            - call: "POST /inventory-items/${it2}/designate"
              payload: { disposition: "KEEP", assigned_room_id: "${room}" }
              as: MOVE_MANAGER
            - call: "GET /milestones"
              payload: { engagement_id: "${eng}" }
              as: MOVE_MANAGER
              captures: { ms1: "$.data[0].id" }
            - call: "POST /milestones/${ms1}/complete"
              payload: { completed_by_party_id: "${pc}" }
              as: MOVE_MANAGER
            - call: "GET /engagements/${eng}"
              payload: {}
              as: MOVE_MANAGER
              captures: { engv: "$.data.version" }
            - call: "POST /sort-plans"
              payload: { engagement_id: "${eng}", expected_engagement_version: "${engv}" }
              as: MOVE_MANAGER
              captures: { sp: "$.data.id" }
            - call: "POST /sort-plans/${sp}/submit"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /sort-plans/${sp}/approve"
              payload: { approved_by_party_id: "${pc}" }
              as: MOVE_MANAGER
            - call: "POST /move-day-plans"
              payload: { engagement_id: "${eng}", scheduled_start_utc: "2026-06-15T14:00:00.000Z", truck_capacity_cft: 1000, truck_count: 1 }
              as: MOVE_MANAGER
              captures: { mdp: "$.data.id", mdpv: "$.data.version" }
            - call: "POST /crew-members"
              payload: { full_name: "Tom Reyes", crew_role: "LEAD", hourly_rate_cents: 9500 }
              as: PLATFORM_ADMIN
              captures: { cml: "$.data.id" }
            - call: "POST /crew-members"
              payload: { full_name: "Nina Ortiz", crew_role: "PACKER", hourly_rate_cents: 6800 }
              as: PLATFORM_ADMIN
              captures: { cmp: "$.data.id" }
            - call: "POST /crew-assignments"
              payload: { move_day_plan_id: "${mdp}", crew_member_id: "${cml}", expected_move_day_plan_version: "${mdpv}" }
              as: MOVE_MANAGER
              captures: { cal: "$.data.id" }
            - call: "GET /move-day-plans/${mdp}"
              payload: {}
              as: MOVE_MANAGER
              captures: { mdpv2: "$.data.version" }
            - call: "POST /crew-assignments"
              payload: { move_day_plan_id: "${mdp}", crew_member_id: "${cmp}", expected_move_day_plan_version: "${mdpv2}" }
              as: MOVE_MANAGER
              captures: { cap: "$.data.id" }
            - call: "POST /crew-assignments/${cal}/confirm"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /crew-assignments/${cap}/confirm"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /move-day-plans/${mdp}/confirm"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T14:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /move-day-plans/${mdp}/freeze"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T14:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /move-day-plans/${mdp}/start"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /crew-assignments/${cap}/check-in"
              payload: { at_utc: "2026-06-15T14:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /time-entries"
              payload: { crew_assignment_id: "${cap}", entry_kind: "TRAVEL", started_at_utc: "2026-06-15T12:00:00.000Z", ended_at_utc: "2026-06-15T13:06:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /time-entries"
              payload: { crew_assignment_id: "${cap}", entry_kind: "TRAVEL", started_at_utc: "2026-06-15T20:00:00.000Z", ended_at_utc: "2026-06-15T21:06:00.000Z" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /crew-assignments/${cap}/check-out"
              payload: { at_utc: "2026-06-15T20:00:00.000Z" }
              as: MOVE_MANAGER
          assert:
            - "CrewAssignment.${cap}.portal_hours == 8.00"
            - "CrewAssignment.${cap}.billing_hours == 8.25"
            - "CrewAssignment.${cap}.applied_hours == 8.25"
            - "CrewAssignment.${cap}.overtime_hours == 0.25"
            - "CrewAssignment.${cap}.labor_cents == 56950"
            - "CrewAssignment.${cap}.portal_hours != CrewAssignment.${cap}.billing_hours"
            - "CrewAssignment.${cap}.status == COMPLETED"

      - name: room_capacity_provisional_vs_approved
        grounds:
          - calculations.room_effective_capacity
          - calculations.room_load_and_headroom
          - state_machines.DestinationResidence.placement_status.PROPOSED_to_APPROVED
          - entities.DestinationRoom.fields.approved_addendum_linear_inches
        distinguishing_aspect: |
          On the DestinationRoom domain the same room reports 192.00 usable linear
          inches under the PROVISIONAL variant, which derates by 0.80 and ignores
          the addendum, and 276.00 under the APPROVED variant, which drops the
          derate and adds the 36-inch addendum; the entity domain is spatial
          capacity, not the labour-hours domain of the other dual-variant instance.
        test_recipe:
          setup:
            - "A destination residence in placement_status PROPOSED with one LIVING room of 240 nominal linear inches and a 36-inch approved addendum."
            - "Two KEEP items assigned to that room with footprints 96 and 90, so keep_load_linear_inches is 186.00 and PROVISIONAL headroom is 6.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142", email: "ada@example.com" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /portal-parties"
              payload: { engagement_id: "${eng}", party_type: "CLIENT", display_name: "Ada Whitfield", email: "ada@example.com", client_id: "${cl}" }
              as: MOVE_MANAGER
              captures: { pc: "$.data.id" }
            - call: "POST /destination-residences"
              payload: { engagement_id: "${eng}", name: "Maple Grove 12B", unit_type: "APARTMENT", address_line: "12B Maple Grove Way" }
              as: MOVE_MANAGER
              captures: { res: "$.data.id" }
            - call: "POST /destination-rooms"
              payload: { destination_residence_id: "${res}", room_type: "LIVING", nominal_linear_inches: 240, nominal_volume_cft: 400, approved_addendum_linear_inches: 36 }
              as: MOVE_MANAGER
              captures: { room: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Walnut sideboard", category: "FURNITURE", footprint_linear_inches: 96, volume_cft: 40 }
              as: MOVE_MANAGER
              captures: { it1: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Reading chair", category: "FURNITURE", footprint_linear_inches: 90, volume_cft: 35 }
              as: MOVE_MANAGER
              captures: { it2: "$.data.id" }
            - call: "POST /inventory-items/${it1}/designate"
              payload: { disposition: "KEEP", assigned_room_id: "${room}" }
              as: MOVE_MANAGER
            - call: "POST /inventory-items/${it2}/designate"
              payload: { disposition: "KEEP", assigned_room_id: "${room}" }
              as: MOVE_MANAGER
            - call: "GET /destination-rooms/${room}"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /destination-residences/${res}/propose-placement"
              payload: {}
              as: MOVE_MANAGER
          trigger:
            - call: "POST /destination-residences/${res}/approve-placement"
              payload: { approved_by_party_id: "${pc}" }
              as: MOVE_MANAGER
          assert:
            - "before the trigger, DestinationRoom.${room}.effective_capacity_linear_inches == 192.00 and headroom_linear_inches == 6.00"
            - "DestinationResidence.${res}.placement_status == APPROVED"
            - "DestinationRoom.${room}.effective_capacity_linear_inches == 276.00"
            - "DestinationRoom.${room}.keep_load_linear_inches == 186.00"
            - "DestinationRoom.${room}.headroom_linear_inches == 90.00"
            - "DestinationResidence.${res}.approved_by_party_id == ${pc}"

      - name: billing_fork_identical_inputs_diverge_across_the_two_pipelines
        grounds:
          - calculations.labor_charge_pipeline_selector
          - calculations.hourly_pipeline_labor_charge
          - calculations.package_base_charge
          - calculations.package_overage_charge
          - calculations.engagement_labor_rollup
          - calculations.invoice_coordination_fee
          - entities.Engagement.fields.billing_mode
        distinguishing_aspect: |
          A third dual-variant domain, the INVOICE LEDGER rather than crew hours or
          room capacity: two engagements built from byte-identical inputs (STUDIO home
          tier, 22 miles, 2 stair flights, 100 carry feet, a 9.50-hour LEAD at 9500 and
          a 9.00-hour PACKER at 6800) both accrue exactly 161975 cents of labour, yet
          the HOURLY pipeline bills all 161975 of it as one HOURLY_LABOR line and
          issues at total_cents 181254, while the PACKAGE pipeline bills a 185000
          PACKAGE_BASE line plus only the 0.50 hour above the STUDIO allowance as a
          4450 OVERAGE_LABOR line and issues at total_cents 210377.
        test_recipe:
          setup:
            - "Two engagements for the same client with identical home_tier STUDIO, scheduled_move_start_utc, mileage_miles 22, origin_stairs_flights 2 and origin_long_carry_feet 100; one is HOURLY and one is PACKAGE at package_tier STUDIO."
            - "Each has its own move-day plan staffed by its own LEAD at 9500 cents/hour and PACKER at 6800 cents/hour, both plans driven to COMPLETED with the LEAD working 9.50 hours and the PACKER 9.00 hours."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
