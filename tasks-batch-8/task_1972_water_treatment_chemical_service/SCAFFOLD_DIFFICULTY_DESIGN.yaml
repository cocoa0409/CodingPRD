              as: AccountManager
              captures: { c2b_inv: $.data.id }
          trigger:
            - { call: "POST /wt/invoices/${c2b_inv}/issue", payload: {}, as: AccountManager }
          assert:
            - "Invoice.${c2b_inv}.product_charges_cents == 4335"
            - "Invoice.${c2b_inv}.invoice_total_cents == 4335"
            - "product_charges_cents != 4334 (the sum-then-round value the pinned order forbids)"

      - name: blowdown_circular_mode_c_pinned_evaluation_order
        grounds:
          - calculations.cycles_blowdown_water_balance
          - entities.BlowdownEvent.fields.balance_residual_gal
          - entities.BlowdownEvent.fields.evaporation_gal
        distinguishing_aspect: |
          Mode (c): achieved CoC depends on logged blowdown while water-savings
          depends on achieved-vs-baseline blowdown — the pinned evaluation order
          (evaporation -> drift -> achieved CoC -> residual -> savings) makes
          the first event on a 500-gpm asset after 2880 minutes exactly
          evaporation_gal 12240.0, residual 0.0, saved 2832.0.
        test_recipe:
          setup:
            - "Account; asset (recirc 500 gpm, evaporation_factor 0.0085, drift_factor 0.0002) created at clock 2026-08-01T00:00:00Z; no prior BlowdownEvents"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Blowdown Co" }
              as: AccountManager
              captures: { c2c_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c2c_acct}", asset_tag: "CT-BD", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 500, system_volume_gal: 9000, metallurgy: "GALVANIZED" }
              as: WaterChemist
              captures: { c2c_asset: $.data.id }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /wt/assets/${c2c_asset}/blowdown-events"
              payload: { occurred_at: "2026-08-03T00:00:00Z", blowdown_gal: 3000, makeup_gal: 15528 }
              as: WaterChemist
              captures: { c2c_ev: $.data.id }
          assert:
            - "BlowdownEvent.${c2c_ev}.evaporation_gal == 12240.0"
            - "BlowdownEvent.${c2c_ev}.balance_residual_gal == 0.0"
            - "GET /wt/assets/${c2c_asset}/water-savings total_saved_gal == 2832.0"
            - "GET /wt/assets/${c2c_asset}/water-savings baseline_blowdown_gal == 5832.0"
            - "GET /wt/assets/${c2c_asset}/water-savings actual_blowdown_gal == 3000.0"

  # ---------------------------------------------------------------------------
  # Rule 3 — non-linear state machines on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: program_design_revision_cycle_increments_revision_number
        grounds:
          - state_machines.ProgramDesign.PROPOSED_to_REVISE_REQUESTED
          - state_machines.ProgramDesign.REVISE_REQUESTED_to_SURVEYED
          - entities.ProgramDesign.fields.revision_number
        distinguishing_aspect: |
          ProgramDesign has a true cycle PROPOSED -> REVISE_REQUESTED ->
          SURVEYED (-> DRAFTED -> PROPOSED again); after exactly one loop the
          revision_number == 2 and the design can be re-drafted and accepted.
        test_recipe:
          setup:
            - "Account + asset + design progressed to PROPOSED; customer requests revision; chemist reopens survey, re-drafts with proposed_coc 5.0, re-proposes, customer accepts"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Cycle Co" }
              as: AccountManager
              captures: { c3a_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c3a_acct}", asset_tag: "CT-C", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 300, system_volume_gal: 6000, metallurgy: "STAINLESS" }
              as: WaterChemist
              captures: { c3a_asset: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${c3a_asset}" }
              as: WaterChemist
              captures: { c3a_pd: $.data.id }
            - { call: "POST /wt/program-designs/${c3a_pd}/record-survey", payload: { survey_notes: "s1" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c3a_pd}/draft", payload: { proposed_coc: 4.0, inhibitor_target_ppm: 5, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 4000, service_rate_cents_per_month: 1000 }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c3a_pd}/propose", payload: {}, as: WaterChemist }
          trigger:
            - { call: "POST /wt/program-designs/${c3a_pd}/request-revision", payload: {}, as: CustomerContact, as_user_id: "${c3a_acct}" }
            - { call: "POST /wt/program-designs/${c3a_pd}/reopen-survey", payload: {}, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c3a_pd}/draft", payload: { proposed_coc: 5.0, inhibitor_target_ppm: 6, ph_min: 7.2, ph_max: 9.0, conductivity_max_umhos: 3500, service_rate_cents_per_month: 1200 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${c3a_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { c3a_pd_v2: $.data.version }
            - call: "POST /wt/program-designs/${c3a_pd}/accept"
              payload: { expected_program_design_version: "${c3a_pd_v2}" }
              as: CustomerContact
              as_user_id: "${c3a_acct}"
          assert:
            - "ProgramDesign.${c3a_pd}.revision_number == 2"
            - "ProgramDesign.${c3a_pd}.status == ACCEPTED"
            - "SystemAsset.${c3a_asset}.target_coc == 5.0"

      - name: legionella_plan_cyclic_validate_and_return_to_draft
        grounds:
          - state_machines.LegionellaRiskPlan.VALIDATION_DUE_to_ACTIVE
          - state_machines.LegionellaRiskPlan.SUSPENDED_to_DRAFT
          - state_machines.LegionellaRiskPlan.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          LegionellaRiskPlan cycles ACTIVE -> VALIDATION_DUE -> ACTIVE via
          validate (clock-driven), and ACTIVE -> SUSPENDED -> DRAFT -> ACTIVE
          via suspend/return-to-draft — a cyclic machine on a different entity
          than ProgramDesign, with posture side effects on the parent asset.
        test_recipe:
          setup:
            - "Commissioned asset (design ACCEPTED, station ONLINE) with LegionellaRiskPlan validation_interval_days 10; clock advanced past due date so plan is VALIDATION_DUE"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Legio Co" }
              as: AccountManager
              captures: { c3b_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c3b_acct}", asset_tag: "CT-L", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 300, system_volume_gal: 6000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { c3b_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "L-BIO", active_pct: 15, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { c3b_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${c3b_asset}", product_id: "${c3b_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { c3b_fs: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${c3b_asset}" }
              as: WaterChemist
              captures: { c3b_pd: $.data.id }
            - { call: "POST /wt/program-designs/${c3b_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c3b_pd}/draft", payload: { proposed_coc: 3.0, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 3000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${c3b_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { c3b_pd_v: $.data.version }
            - call: "POST /wt/program-designs/${c3b_pd}/accept"
              payload: { expected_program_design_version: "${c3b_pd_v}" }
              as: CustomerContact
              as_user_id: "${c3b_acct}"
            - { call: "POST /wt/feed-stations/${c3b_fs}/bring-online", payload: {}, as: WaterChemist }
            - { call: "POST /wt/assets/${c3b_asset}/commission", payload: {}, as: WaterChemist }
            - call: "POST /wt/legionella-plans"
              payload: { asset_id: "${c3b_asset}", plan_text: "Control scheme", validation_interval_days: 10 }
              as: WaterChemist
              captures: { c3b_plan: $.data.id }
            - { call: "POST /wt/legionella-plans/${c3b_plan}/activate", payload: {}, as: WaterChemist }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /wt/legionella-plans/${c3b_plan}/validate", payload: {}, as: WaterChemist }
            - { call: "POST /wt/legionella-plans/${c3b_plan}/suspend", payload: {}, as: AccountManager }
            - { call: "POST /wt/legionella-plans/${c3b_plan}/return-to-draft", payload: {}, as: WaterChemist }
          assert:
            - "LegionellaRiskPlan.${c3b_plan}.status == DRAFT after the full cycle"
            - "LegionellaRiskPlan.${c3b_plan}.last_validated_at == 2026-08-12T00:00:00Z"
            - "SystemAsset.${c3b_asset}.posture == COMPLIANT after return-to-draft recompute (no other drivers)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive cascades from DIFFERENT triggers (depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: out_of_range_escalation_cascade_depth4_result_to_autodraft
        grounds:
          - calculations.consecutive_violation_escalation
          - state_machines.CorrectiveAction.APPROVED_to_APPLIED
          - calculations.inventory_depletion_projection
          - entities.DeliveryOrder.fields.auto_drafted
        distinguishing_aspect: |
          Depth-4 chain from the WaterTestResult-create trigger: 3rd consecutive
          OUT_OF_RANGE result -> auto-create PENDING CorrectiveAction ->
          approval+apply mutates FeedStation.setpoint -> depletion projection
          recomputed (11.55 days out) -> auto-drafted DeliveryOrder created.
          Each link is caused by the previous link, not by the original POST.
        test_recipe:
          setup:
            - "Commissioned asset (recirc 500 gpm) with ACCEPTED design (inhibitor 5 ppm, ph 7.0-9.5, cond max 4000), ONLINE station FS for product (container 55); station inventory: 110 gal delivered, 4 gal residual returned; telemetry consumed 40.0009 gal over trailing window (4 readings x 7571 pulses x 5.0 ml); clock 2026-08-05T00:00:00Z"
            - "Three published-route stops for the asset at windows on 08-05, 08-06, 08-07; first two already recorded OUT_OF_RANGE (consecutive count == 2)"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Cascade Co" }
              as: AccountManager
              captures: { c4a_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c4a_acct}", asset_tag: "CT-X", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 500, system_volume_gal: 9000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { c4a_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "CAS-INH", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { c4a_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${c4a_asset}", product_id: "${c4a_prod}", capacity_cap_ml_per_min: 50, feed_mode: "CONTINUOUS" }
              as: WaterChemist
              captures: { c4a_fs: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${c4a_asset}" }
              as: WaterChemist
              captures: { c4a_pd: $.data.id }
            - { call: "POST /wt/program-designs/${c4a_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c4a_pd}/draft", payload: { proposed_coc: 4.0, inhibitor_target_ppm: 5, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 4000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${c4a_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { c4a_pd_v: $.data.version }
            - call: "POST /wt/program-designs/${c4a_pd}/accept"
              payload: { expected_program_design_version: "${c4a_pd_v}" }
              as: CustomerContact
              as_user_id: "${c4a_acct}"
            - { call: "POST /wt/feed-stations/${c4a_fs}/bring-online", payload: {}, as: WaterChemist }
            - { call: "POST /wt/assets/${c4a_asset}/commission", payload: {}, as: WaterChemist }
            # inventory: deliver 110, close with residual 4
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${c4a_acct}", station_id: "${c4a_fs}", quantity_gal: 110 }
              as: AccountManager
              captures: { c4a_do: $.data.id, c4a_do_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${c4a_do}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${c4a_do}/schedule", payload: { scheduled_for: "2026-08-02T00:00:00Z", expected_delivery_order_version: "${c4a_do_v}" }, as: AccountManager }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/delivery-orders/${c4a_do}/dispatch", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${c4a_do}/confirm-delivery", payload: { delivered_gal: 110 }, as: WaterChemist }
            - { call: "POST /wt/delivery-orders/${c4a_do}/close", payload: { returned_residual_gal: 4 }, as: WaterChemist }
            # telemetry: 4 readings inside trailing 7d of 2026-08-05
            - { call: "POST /wt/feed-stations/${c4a_fs}/telemetry", payload: { recorded_at: "2026-08-02T06:00:00Z", feed_pulses: 7571, ml_per_pulse: 5.0, level_gal: 100 }, as: WaterChemist }
            - { call: "POST /wt/feed-stations/${c4a_fs}/telemetry", payload: { recorded_at: "2026-08-03T06:00:00Z", feed_pulses: 7571, ml_per_pulse: 5.0, level_gal: 95 }, as: WaterChemist }
            - { call: "POST /wt/feed-stations/${c4a_fs}/telemetry", payload: { recorded_at: "2026-08-04T06:00:00Z", feed_pulses: 7571, ml_per_pulse: 5.0, level_gal: 90 }, as: WaterChemist }
            - { call: "POST /wt/feed-stations/${c4a_fs}/telemetry", payload: { recorded_at: "2026-08-04T18:00:00Z", feed_pulses: 7571, ml_per_pulse: 5.0, level_gal: 85 }, as: WaterChemist }
            # route with three stops; record two OUT_OF_RANGE results first
            - call: "POST /wt/test-routes"
              payload: { account_id: "${c4a_acct}", route_name: "CAS-R" }
              as: WaterChemist
              captures: { c4a_rt: $.data.id }
            - call: "POST /wt/test-routes/${c4a_rt}/stops"
