              payload: { name: "Grace", day_rate_cents: 30000 }
              as: OpsManager
              captures: { guide: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Ovl2 Dep1", start_date: "2026-08-01", end_date: "2026-08-05", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 6 } ] }
