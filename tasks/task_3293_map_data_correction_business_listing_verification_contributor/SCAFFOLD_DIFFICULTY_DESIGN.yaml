          Error-category pair: state (ERR_LISTING_SUSPENDED, priority 9) vs
          business_safety (ERR_KEYWORD_STUFFING, priority 10). A NAME edit with
          a stuffing pattern on a SUSPENDED listing fails both checks; the
          state error must win because priority 9 < 10.
