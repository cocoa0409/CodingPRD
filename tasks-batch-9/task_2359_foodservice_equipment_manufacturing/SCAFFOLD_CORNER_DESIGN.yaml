              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_ALPHA", scopes: ["SANITATION", "GAS"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { err: $.data.error_id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_ALPHA", scopes: ["SANITATION"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { listing_id: $.data.id, st: $.data.status }
          assert:
            - "${posture0} == UNLISTED"
            - "first trigger HTTP status == 422"
            - "${err} == ERR_AGENCY_SCOPE_NOT_COVERED"
            - "GET /certification-listings?equipment_model_id=${model_id} returns total_count == 1 after both triggers"
            - "second trigger HTTP status == 201"
            - "${st} == DRAFT"
            - "CertificationListing.${listing_id}.scopes == ['SANITATION']"

