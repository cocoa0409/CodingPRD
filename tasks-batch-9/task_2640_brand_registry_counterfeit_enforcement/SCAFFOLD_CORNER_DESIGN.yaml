      - name: price_above_msrp_clamps_the_deviation_factor_to_zero
        claim_type: Precision
        grounds:
          - calculations.listing_match_score
          - state_machines.MonitoredListing.CLEARED_to_FLAGGED
        distinguishing_aspect: "A listing priced ABOVE the authorized MSRP produces a negative raw deviation that is clamped to 0.0000 (never negative), so the composite is 0.3650 and CLEARED; re-screening the same row with a strong matcher output flips it to 0.7220 / FLAGGED / COUNTERFEIT with the price term still contributing nothing."
        test_recipe:
          setup:
            - "A brand with authorized_msrp_cents 10000 and one NEW listing priced at 12000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0ACME001", title_text: "ACME 8-inch adjustable wrench", image_hash: "IMGHASH1", price_cents: 12000, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 0.50, text_match_score: 0.40 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 0.92, text_match_score: 0.88 }
              as: EnforcementAnalyst
          assert:
            - "after the first screen price_deviation_factor == 0.0000 (not negative), match_score == 0.3650, monitor_status == CLEARED, violation_type == NONE"
            - "after the re-screen price_deviation_factor == 0.0000, match_score == 0.7220, monitor_status == FLAGGED, violation_type == COUNTERFEIT"
            - "MonitoredListing.${listing_id}.enforcement_status == NONE after both screens (the dimensions are independent)"
            - "MonitoredListing.${listing_id}.image_match_score == 0.92 and text_match_score == 0.88 after the re-screen"
            - "MonitoredListing.${listing_id}.version == 3 (one create plus two screens)"

      - name: seller_risk_boost_adds_003_once_standalone_points_pass_ten
        claim_type: Correct Result
        grounds:
          - calculations.listing_match_score
          - calculations.seller_strike_points
          - state_machines.DiversionInvestigation.EVIDENCE_SUBMITTED_to_DIVERSION_CONFIRMED
        distinguishing_aspect: "The risk boost is read from the seller at screen time: the same matcher output (0.92 / 0.88 at pdf 0.7000) scores 0.8620 before the seller carries any strike and 0.8920 after a confirmed diversion puts 25.15 standalone points on it — the BLOCKED rung (0.05) is not used because 25.15 < 60.00."
        test_recipe:
          setup:
            - "A RECORDED customs recordation, an EVIDENCE_SUBMITTED BORDER_SEIZURE investigation naming the seller, and one already-screened listing of that same seller at 0.8620"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
