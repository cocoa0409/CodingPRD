      - name: sponsor_cap_exceeded_by_second_guest_ticket
        claim_type: aggregate_validation
        grounds:
          - validations[priority=29]
          - errors[id=ERR_SPONSOR_LIMIT_EXCEEDED]
          - entities.Resident.fields.guest_meal_charge_balance_cents
          - calculations.ticket_billed_amount
        distinguishing_aspect: "Each sponsored guest ticket is individually under the 2000-cent cap; only their running sum breaks it, and the cap is aggregate over Resident.guest_meal_charge_balance_cents rather than per ticket — an unsponsored guest ticket at a higher price is still accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T12:00:00Z."
