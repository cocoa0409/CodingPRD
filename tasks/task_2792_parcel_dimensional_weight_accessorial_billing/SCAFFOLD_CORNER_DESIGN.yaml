              as: CarrierOps
              captures: { p: $.data.id }
            - call: "POST /shipments/${p}/exceptions"
              payload: { kind: "REFUSED", reason: "consignee refused delivery" }
              as: CarrierOps
              captures: { mv: $.data.movement_status }
          trigger:
            - call: "POST /shipments/${p}/deliver"
