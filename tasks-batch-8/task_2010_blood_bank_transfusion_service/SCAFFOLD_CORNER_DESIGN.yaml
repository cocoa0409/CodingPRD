              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "A", rh_type: "POS", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-540", lot_number: "LOT-5", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-6005", full_name: "Drew Doe", date_of_birth: "1997-01-01" }
              as: BloodBankTechnologist
              captures: { pat2: $.data.id }
            - call: "POST /blood-bank/mtp-activations"
              payload: { patient_id: "${pat2}", activation_reason: "massive bleed protocol" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { mtp: $.data.id }
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-6006", full_name: "Elle Doe", date_of_birth: "1980-05-05" }
              as: BloodBankTechnologist
              captures: { pat1: $.data.id, pat1_v: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat1}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat1_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts1: $.data.id }
            - call: "POST /blood-bank/type-and-screens/${ts1}/result"
              payload: { abo_result: "A", rh_result: "POS", antibody_screen: "NEGATIVE", antibody_identifications: [] }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/type-and-screens/${ts1}/validate"
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat1}", product_type: "RBC", units_requested: 1, urgency: "ROUTINE", indication_code: "ANEMIA" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /blood-bank/transfusion-orders/${ord}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { err: $.data.error_id }
            - call: "POST /blood-bank/mtp-activations/${mtp}/stand-down"
              as: OrderingPhysician
              as_user_id: "doc-1"
            - call: "POST /blood-bank/transfusion-orders/${ord}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { st: $.data.status }
          assert:
            - "while MTP ACTIVATED: 409 ERR_BUCKET_SHORTAGE_MTP_PRIORITY (bucket SHORTAGE at usable 1 <= 4)"
            - "after stand-down: 200, st == AWAITING_CROSSMATCH"
      - name: derived_field_patient_summary_on_expiry
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.Patient.fields.current_abo_type"
          - "entities.Patient.fields.has_active_type_and_screen"
        distinguishing_aspect: "After the expiry sweep, has_active_type_and_screen flips false while current_abo_type/current_rh_type RETAIN the last validated result."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; patient typed B NEG with one ACTIVE T&S (expires 2026-08-13T08:00:00Z)"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-6007", full_name: "Finn Doe", date_of_birth: "1971-07-07" }
              as: BloodBankTechnologist
              captures: { pat: $.data.id, pat_v: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts: $.data.id }
            - call: "POST /blood-bank/type-and-screens/${ts}/result"
              payload: { abo_result: "B", rh_result: "NEG", antibody_screen: "NEGATIVE", antibody_identifications: [] }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/type-and-screens/${ts}/validate"
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T09:00:00Z" }
              as: BloodBankSupervisor
          trigger:
            - call: "POST /blood-bank/_clock/sweep"
              as: BloodBankSupervisor
              captures: { n: $.data.ts_expired_count }
            - call: "GET /blood-bank/patients/${pat}"
              as: BloodBankTechnologist
              captures: { abo: $.data.current_abo_type, active_flag: $.data.has_active_type_and_screen }
          assert:
            - "n == 1"
            - "active_flag == false"
            - "abo == B and current_rh_type == NEG (historical typing retained, validity flag cleared)"
      - name: cascading_side_effects_layer_covered
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: ts_expiry_sweep_cascade
          rationale: "Depth-4 cascade asserted hop-by-hop there; two further cascades covered by recall_quarantine_cascade and supplier_suspension_cascade."
      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: ffp_unit_fixed_shelf_vs_thawed_clock
          rationale: "Dual-variant divergence asserted there and in bucket_physical_vs_prospective_posture."

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_create_then_get
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "All mutations are visible in the same request's response and in an immediate re-read — no lag."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-7001", full_name: "Gus Doe", date_of_birth: "1965-05-05", special_requirements: ["IRRADIATED"] }
              as: BloodBankTechnologist
              captures: { pat: $.data.id, create_v: $.data.version, create_abo: $.data.current_abo_type }
          trigger:
            - call: "GET /blood-bank/patients/${pat}"
              as: SupplierCoordinator
              captures: { get_v: $.data.version, get_abo: $.data.current_abo_type }
          assert:
            - "create response already carries computed fields (create_abo == UNKNOWN, special_requirements == [IRRADIATED])"
            - "GET returns identical values: get_v == 1 == create_v; updated_at == created_at"
