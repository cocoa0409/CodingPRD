            - "call1 went to E1 (position 1) and call2 to E2 after E1's no-answer penalty rotation"
            - "captured call3_emp == ${emp1_id} (E2 is ON_ASSIGNMENT and ineligible; E1 is the only AVAILABLE ACTIVE slot despite sitting at tail position 2)"

      - name: assignment_complete_depends_on_payrecord_state
        grounds:
          - state_machines.Assignment.TIE_UP_PENDING_to_COMPLETED
          - entities.PayRecord.fields.record_status
          - validations[priority=15]
        distinguishing_aspect: |
          Pair Assignment -> PayRecord (different pair from Call->Job): the
          complete transition is gated on the auto-created PayRecord having
