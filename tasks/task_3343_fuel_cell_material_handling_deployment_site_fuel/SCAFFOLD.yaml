    side_effects: ["plan.status -> DRAFT"]
  - method: POST
    path: "/api/sites/{id}/conversion-plans/{pid}/cancel"
    description: "Cancel an in-progress plan; cascades to non-terminal events."
    roles: [SiteManager]
    code: 200
    input: []
    output: ConversionPlan
    side_effects: ["plan.status -> CANCELLED", "non-terminal ConversionEvents -> CANCELLED"]
  - method: POST
