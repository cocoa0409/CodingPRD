        grounds:
          - calculations.appointment_slot_conflict
          - validations.priority_7_business_constraint
        distinguishing_aspect: |
          Overlap semantics: half-open interval [slot_start, slot_end) plus a fixed buffer
          of 10 minutes on both sides. Adjacent slots (end == start) do NOT conflict, but
          slots within the buffer window DO conflict.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One technician with an existing appointment 10:00-10:30."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
