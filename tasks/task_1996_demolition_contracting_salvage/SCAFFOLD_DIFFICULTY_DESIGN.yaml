            - { call: "POST /demolition/projects/${pa}/neighbor-notifications", payload: { address: "57 Elm St", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nna: $.data.id } }
