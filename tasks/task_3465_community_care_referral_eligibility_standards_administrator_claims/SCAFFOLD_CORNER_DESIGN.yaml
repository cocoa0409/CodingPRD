              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 2, duration_days: 60, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_id: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_id}/authorize"
              as: CareCoordinator
            - call: "POST /community-care/referral-authorizations/${ra_id}/extension-requests"
              payload: { requested_visits: 2, requested_extra_days: 0 }
              as: CareCoordinator
              captures: { ext_id: $.data.id }
            - call: "GET /community-care/referral-authorizations/${ra_id}"
              as: CareCoordinator
              captures: { ra_v_obs: $.data.version }
            - call: "POST /community-care/referral-authorizations/${ra_id}/appointments"
              payload: { scheduled_start: "2026-09-06T10:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
          trigger:
            - call: "POST /community-care/referral-authorizations/${ra_id}/extension-requests/${ext_id}/decide"
              payload: { decision: "APPROVED", expected_referral_authorization_version: "${ra_v_obs}" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /community-care/referral-authorizations/${ra_id}"
              as: CareCoordinator
              captures: { ra_v_new: $.data.version }
            - call: "POST /community-care/referral-authorizations/${ra_id}/extension-requests/${ext_id}/decide"
              payload: { decision: "APPROVED", expected_referral_authorization_version: "${ra_v_new}" }
              as: CareCoordinator
              captures: { ext_status: $.data.status }
          assert:
            - "stale decide: 412 error_id == ERR_STALE_VERSION (appointment creation bumped the authorization version)"
            - "fresh decide: ExtensionRequest.${ext_id}.status == APPROVED; extended_visits == 2"

  - section: consistency
    instances:
      - name: mutation_visibility_immediate_in_same_response
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Consistency is immediate: the authorize response itself carries status == AUTHORIZED, the stamped authorized_at, and version incremented by exactly 1 — no re-read needed to observe the mutation."
        test_recipe:
          setup: ["PENDING_REVIEW referral fixture, version captured at creation"]
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
