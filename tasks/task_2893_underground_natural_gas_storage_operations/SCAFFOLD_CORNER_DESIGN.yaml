          None of the action endpoints is idempotent: replaying activate, submit, confirm or
          ticket-confirm is a state-machine violation reported per entity
          (ERR_INVALID_CONTRACT_STATE / ERR_INVALID_NOMINATION_STATE / ERR_INVALID_TICKET_STATE, all
          409) and, crucially, the replay applies NO side effect a second time — the field's
          working_gas_inventory_dth stays 326000 and the contract's imbalance_dth stays
