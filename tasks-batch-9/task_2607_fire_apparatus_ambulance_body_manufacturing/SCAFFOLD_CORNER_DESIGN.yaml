          rationale: "ERR_SLOT_WINDOW_CONFLICT is raised there; ERR_BAY_CAPACITY_EXCEEDED is raised by the sibling instance bay_aggregate_capacity_over_closed_touching_windows."

      - name: escalation_year_out_of_range_triggerable
        claim_type: Violation → Error
        grounds:
