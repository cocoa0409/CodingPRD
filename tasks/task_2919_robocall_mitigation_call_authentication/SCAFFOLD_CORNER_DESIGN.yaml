              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025552401", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg_one: $.data.id }
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025552402", ownership_evidence: "PORTED_IN", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg_two: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices"
              payload: { provider_id: "${prov_id}", calling_number: "+12025552401", description: "Prerecorded sales calls to wireless numbers without consent" }
              as: Regulator
              captures: { notice_id: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices/${notice_id}/investigate"
              payload: { customer_id: "${cust_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /rmd/illegal-traffic-notices/${notice_id}/mitigate"
              payload: { mitigation_action: "CUSTOMER_TERMINATED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "The mitigate call is 200 with data.state == MITIGATED, data.mitigation_action == CUSTOMER_TERMINATED, data.resolved_at == 2026-08-24T00:00:00Z and data.penalty_points_assessed == 0"
            - "Customer.${cust_id}.origination_state == TERMINATED while kyc_state stays VERIFIED and suspension_cause stays null (termination is not a suspension)"
            - "NumberAssignment.${asg_one}.status == REVOKED and NumberAssignment.${asg_two}.status == REVOKED, both with revoked_at == 2026-08-24T00:00:00Z - the cascade reaches the number that was never named in the notice"
            - "Provider.${prov_id}.active_assigned_number_count == 0, open_notice_count == 0 and penalty_points == 0"
            - "Provider.${prov_id}.auth_posture == SIGNING_SUSPENDED because the provider never filed a plan, not because of the cascade"

      - name: regenerating_the_period_as_certified_supersedes_the_provisional_report
        claim_type: dual_variant_calculation
        grounds:
          - state_machines.EffectivenessReport.GENERATED_to_SUPERSEDED
          - entities.EffectivenessReport.fields.variant
          - "endpoints[POST /rmd/effectiveness-reports]"
        distinguishing_aspect: "Variant selection happens at generation time and is immutable afterwards, so switching variant means generating a second report whose period merely overlaps the first: the PROVISIONAL row is driven to SUPERSEDED and stops accepting certification, while the CERTIFIED row starts fresh at GENERATED."
        test_recipe:
          setup:
            - "One provider with one PROVISIONAL report over an elapsed period"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
