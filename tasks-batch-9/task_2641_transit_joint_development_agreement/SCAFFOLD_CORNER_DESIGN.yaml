      - name: corner_release_on_inventoried_site_returns_invalid_site_state
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_SITE_STATE]
          - state_machines.AgencySite
        distinguishing_aspect: |
          Releasing a brand-new INVENTORIED site for solicitation (no certified assessment yet) returns 409
          ERR_INVALID_SITE_STATE — the state gate, not the readiness-score gate ERR_SITE_NOT_READY, because
          readiness_composite_score is still null.
        test_recipe:
          setup:
            - "One site freshly created, still INVENTORIED with readiness_composite_score null"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
