  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, or out-of-range integer" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted to call this endpoint" }
  - { id: ERR_FORBIDDEN_ORG_OWNERSHIP, http: 403, condition: "OrgCoordinator X-User-ID does not match the resource's organization_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Refund approver X-User-ID equals Payment.initiated_by" }
  - { id: ERR_ORGANIZATION_NOT_FOUND, http: 404, condition: "Organization id does not exist" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id does not exist" }
  - { id: ERR_FEE_SCHEDULE_NOT_FOUND, http: 404, condition: "FeeSchedule id does not exist" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "AllocationWindow id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "PermitApplication id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Permit id does not exist" }
  - { id: ERR_CLOSURE_NOT_FOUND, http: 404, condition: "FieldClosure id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Payment id does not exist" }
  - { id: ERR_STRIKE_NOT_FOUND, http: 404, condition: "StrikeRecord id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_PERMIT_STATE, http: 409, condition: "Permit not in a valid from-state for the requested transition" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "Application not in a valid from-state" }
  - { id: ERR_INVALID_WINDOW_STATE, http: 409, condition: "Window not in a valid from-state (open/close/run-allocation)" }
  - { id: ERR_INVALID_INVOICE_STATE, http: 409, condition: "Invoice not in a valid from-state (issue/void/payment/adjustment/confirm gate)" }
  - { id: ERR_INVALID_CLOSURE_STATE, http: 409, condition: "Closure already LIFTED" }
  - { id: ERR_INVALID_SCHEDULE_STATE, http: 409, condition: "FeeSchedule not DRAFT on publish, or no PUBLISHED schedule at run-allocation" }
  - { id: ERR_INVALID_PAYMENT_STATE, http: 409, condition: "Payment not PENDING_APPROVAL on approve" }
  - { id: ERR_INVALID_STRIKE_STATE, http: 409, condition: "Strike already RESCINDED" }
  - { id: ERR_ORG_SUSPENDED, http: 409, condition: "Organization standing is SUSPENDED where GOOD/PROBATION is required" }
  - { id: ERR_FACILITY_CLOSED, http: 409, condition: "Facility condition_status is CLOSED (blocks new applications and reschedule targets)" }
  - { id: ERR_HEADCOUNT_EXCEEDS_CAPACITY, http: 409, condition: "headcount > facility.capacity" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "Application submitted while window not OPEN" }
  - { id: ERR_WINDOW_NOT_YET_OPEN, http: 409, condition: "Open attempted before opens_at per logical clock" }
  - { id: ERR_SLOT_IN_PAST, http: 409, condition: "Requested/rescheduled slot starts at or before the current logical clock" }
  - { id: ERR_RESCHEDULE_HORIZON_EXCEEDED, http: 409, condition: "new_date outside [permit_date, permit_date + 10 days]" }
  - { id: ERR_NO_SHOW_NOT_YET, http: 409, condition: "mark-no-show before the slot end has passed" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 409, condition: "check-in outside [start-30min, end]" }
  - { id: ERR_CHECKIN_REQUIRED, http: 409, condition: "settle attempted without a check-in" }
  - { id: ERR_INVALID_TIME_RANGE, http: 409, condition: "end_minute <= start_minute or duration outside 30..480 or closure interval invalid" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Half-open field slot overlaps an existing {RESERVED, CONFIRMED} permit on facility+date" }
  - { id: ERR_LIGHTS_BUFFER_OVERLAP, http: 409, condition: "Lights windows on same facility+date have gap < 30 minutes (reschedule)" }
  - { id: ERR_PRIME_CAP_EXCEEDED, http: 409, condition: "Reschedule would push awarded_prime_hours above window.prime_cap_hours_per_org" }
  - { id: ERR_TURF_REST_CAP_EXCEEDED, http: 409, condition: "Reschedule would push facility weekly prime load above weekly_prime_hour_cap" }
  - { id: ERR_RESCHEDULE_LIMIT_REACHED, http: 409, condition: "rain_reschedule_count already 2" }
  - { id: ERR_DEPOSIT_NOT_PAID, http: 422, condition: "confirm attempted with invoice.paid_cents < invoice.deposit_cents" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "payment amount_cents > balance_due_cents" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "refund amount_cents > paid_cents - refunded_cents" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 422, condition: "void attempted on an invoice with paid_cents > 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AthleticsAdmin
    description: "Parks & rec athletics office administrator; owns inventory, policy, windows, awards, revocations, and refund approval"
    identity: opaque
    exclusive_operations: ["create organizations", "reinstate organizations", "create facilities", "create/publish fee schedules", "create/open/close/run allocation windows", "request-info on applications", "revoke permits", "approve refunds", "rescind strikes", "set logical clock"]
    shared_operations: ["read any entity", "cancel permits"]
  - name: FieldSupervisor
    description: "Field operations supervisor; owns condition decisions, closures, check-in, no-show marking, and settlement"
    identity: opaque
    exclusive_operations: ["facility condition decisions", "create/lift field closures", "permit check-in", "mark no-show", "settle permits"]
    shared_operations: ["read any entity"]
  - name: OrgCoordinator
    description: "Coordinator of a registered Organization; acts only on own organization's applications and permits"
    identity: entity_backed:Organization
    exclusive_operations: ["submit applications", "withdraw own applications", "respond to info requests", "confirm permits", "reschedule own permits"]
    shared_operations: ["read any entity", "cancel own permits"]
  - name: FinanceClerk
    description: "Finance office clerk; issues/voids invoices, records payments, initiates refunds, posts adjustments"
    identity: opaque
    exclusive_operations: ["issue/void invoices", "record payments", "initiate refunds", "post invoice adjustments"]
    shared_operations: ["read any entity"]
