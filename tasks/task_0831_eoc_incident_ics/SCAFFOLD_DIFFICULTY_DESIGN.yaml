# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls chain drives empty-DB -> setup.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: federal_estimated_vs_actual_share
        grounds:
          - calculations.federal_share_percentage
          - calculations.incident_cost_rollup
          - entities.Incident.fields.federal_share_estimated
          - entities.Incident.fields.federal_share_actual
          - state_machines.CostRecord.ESTIMATED_to_ACTUAL
        distinguishing_aspect: "On the same incident, federal_share_estimated (75.00, over the still-ESTIMATED record) and federal_share_actual (150.00, over the ACTUAL record) diverge because they draw on different CostRecord subsets and different cost fields (estimated_cost vs actual_cost)."
        test_recipe:
          setup:
            - "Incident ACTIVATED, declaration ELIGIBLE (total_verified_damage=5,000,000), category EMERGENCY (pct=0.75)."
            - "CostRecord X: estimated_cost=100.00, eligible, stays ESTIMATED. CostRecord Y: estimated_cost=100.00, finalized ACTUAL with actual_cost=200.00."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Riverbend Flood", hazard_type: "FLOOD", declaration_category: "EMERGENCY" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/damage-assessments"
              payload: { incident_id: "${inc_id}", site_name: "Levee 4", estimated_loss: 5000000, infrastructure_category: "CAT_C_ROADS" }
              as: PlanningChief
              captures: { da_id: $.data.id }
            - call: "POST /eoc/damage-assessments/${da_id}/transition"
              payload: { to_status: "VALIDATED" }
              as: PlanningChief
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v1: $.data.version }
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "LABOR", estimated_cost: 100.00, eligible: true, expected_incident_version: "${inc_v1}" }
              as: FinanceChief
              captures: { cost_x: $.data.id }
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v2: $.data.version }
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "CONTRACT", estimated_cost: 100.00, eligible: true, expected_incident_version: "${inc_v2}" }
              as: FinanceChief
              captures: { cost_y: $.data.id }
          trigger:
            - call: "POST /eoc/cost-records/${cost_y}/transition"
              payload: { to_status: "ACTUAL", actual_cost: 200.00 }
              as: FinanceChief
          assert:
            - "Incident.${inc_id}.federal_share_estimated == 75.00"
            - "Incident.${inc_id}.federal_share_actual == 150.00"
            - "Incident.${inc_id}.federal_share_estimated != Incident.${inc_id}.federal_share_actual"
            - "Incident.${inc_id}.total_committed_cost == 300.00"

      - name: shelter_strict_vs_projected_capacity
        grounds:
          - calculations.shelter_capacity
          - entities.Shelter.fields.current_occupancy
          - entities.Shelter.fields.reserved_occupancy
          - state_machines.Shelter.PLANNED_to_OPEN
        distinguishing_aspect: "A check_in of 60 is rejected because projected_available (capacity - current - reserved = 50) < 60, even though strict_available (capacity - current = 70) would admit it — proving the gate uses projected, not strict, occupancy."
        test_recipe:
          setup:
            - "Incident ACTIVATED. Shelter OPEN, capacity=100, current_occupancy=30, reserved_occupancy=20 (strict_available=70, projected_available=50)."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Coastal Storm", hazard_type: "HURRICANE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/shelters"
              payload: { incident_id: "${inc_id}", name: "Central High", capacity: 100 }
              as: OperationsChief
              captures: { sh_id: $.data.id }
            - call: "POST /eoc/shelters/${sh_id}/transition"
              payload: { to_status: "OPEN" }
              as: OperationsChief
            - call: "POST /eoc/shelters/${sh_id}/occupancy"
              payload: { check_in: 30 }
              as: OperationsChief
            - call: "POST /eoc/shelters/${sh_id}/occupancy"
              payload: { reserve: 20 }
              as: OperationsChief
          trigger:
            - call: "POST /eoc/shelters/${sh_id}/occupancy"
              payload: { check_in: 60 }
              as: OperationsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHELTER_CAPACITY_EXCEEDED (HTTP 409)"
            - "Shelter.${sh_id}.current_occupancy == 30"
            - "Shelter.${sh_id}.reserved_occupancy == 20"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: federal_share_enhanced_tier_selection
        grounds:
          - calculations.federal_share_percentage
          - entities.Incident.fields.declaration_category
          - entities.Incident.fields.total_verified_damage
          - entities.Incident.fields.declaration_status
        distinguishing_aspect: "Mode (a): pct is chosen by a non-linear branch over THREE inputs (declaration_status=ELIGIBLE, declaration_category=MAJOR_DISASTER, total_verified_damage>=10,000,000) yielding ENHANCED 0.90; federal_share_estimated over a 1000.00 eligible record == 900.00."
        test_recipe:
          setup:
            - "Incident ACTIVATED, category MAJOR_DISASTER, total_verified_damage=10,000,000 (>=ENHANCED_DAMAGE_THRESHOLD) so declaration ELIGIBLE and pct=0.90."
            - "One eligible ESTIMATED CostRecord estimated_cost=1000.00."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Metro Quake", hazard_type: "EARTHQUAKE", declaration_category: "MAJOR_DISASTER" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/damage-assessments"
              payload: { incident_id: "${inc_id}", site_name: "Overpass 9", estimated_loss: 10000000, infrastructure_category: "CAT_C_ROADS" }
              as: PlanningChief
              captures: { da_id: $.data.id }
            - call: "POST /eoc/damage-assessments/${da_id}/transition"
              payload: { to_status: "VALIDATED" }
              as: PlanningChief
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v1: $.data.version }
          trigger:
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "CONTRACT", estimated_cost: 1000.00, eligible: true, expected_incident_version: "${inc_v1}" }
              as: FinanceChief
              captures: { cost_id: $.data.id }
          assert:
            - "Incident.${inc_id}.declaration_status == ELIGIBLE"
            - "Incident.${inc_id}.federal_share_estimated == 900.00"

      - name: cost_rollup_rounding_order
        grounds:
          - calculations.incident_cost_rollup
          - entities.Incident.fields.federal_share_estimated
          - state_machines.CostRecord.ESTIMATED_to_ACTUAL
        distinguishing_aspect: "Mode (b): with pct=0.75 and two eligible records of 6.02, per-record rounding (round(4.515)=4.52 each, sum 9.04) is pinned; 'sum then round' would give round(12.04*0.75)=9.03, so federal_share_estimated==9.04 proves the order."
        test_recipe:
          setup:
            - "Incident ACTIVATED, EMERGENCY, declaration ELIGIBLE (damage=5,000,000), pct=0.75."
            - "Two eligible ESTIMATED CostRecords, estimated_cost=6.02 each."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "County Wildfire", hazard_type: "WILDFIRE", declaration_category: "EMERGENCY" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/damage-assessments"
              payload: { incident_id: "${inc_id}", site_name: "Ridge Rd", estimated_loss: 5000000, infrastructure_category: "CAT_A_DEBRIS" }
              as: PlanningChief
              captures: { da_id: $.data.id }
            - call: "POST /eoc/damage-assessments/${da_id}/transition"
              payload: { to_status: "VALIDATED" }
              as: PlanningChief
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v1: $.data.version }
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "MATERIALS", estimated_cost: 6.02, eligible: true, expected_incident_version: "${inc_v1}" }
              as: FinanceChief
              captures: { cost_a: $.data.id }
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v2: $.data.version }
          trigger:
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "MATERIALS", estimated_cost: 6.02, eligible: true, expected_incident_version: "${inc_v2}" }
              as: FinanceChief
              captures: { cost_b: $.data.id }
          assert:
            - "Incident.${inc_id}.federal_share_estimated == 9.04"
            - "Incident.${inc_id}.federal_share_estimated != 9.03"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: resource_request_needs_info_revision_cycle
        grounds:
          - state_machines.ResourceRequest.SUBMITTED_to_NEEDS_INFO
          - state_machines.ResourceRequest.NEEDS_INFO_to_SUBMITTED
          - entities.ResourceRequest.fields.status
        distinguishing_aspect: "ResourceRequest cycles SUBMITTED->NEEDS_INFO->SUBMITTED (a genuine A->B->A revision loop on ResourceRequest), returning to SUBMITTED — not a linear one-way pipeline."
        test_recipe:
          setup:
            - "Incident ACTIVATED; a ResourceRequest in SUBMITTED."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Downtown Hazmat", hazard_type: "HAZMAT" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "EQUIPMENT", requested_quantity: 2 }
              as: OperationsChief
              captures: { req_id: $.data.id }
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "NEEDS_INFO" }
              as: LogisticsChief
          trigger:
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
          assert:
            - "ResourceRequest.${req_id}.status == SUBMITTED"
            - "ResourceRequest.${req_id}.submitted_at is not null"

      - name: mutual_aid_offer_counter_negotiation_cycle
        grounds:
          - state_machines.MutualAidRequest.OFFERED_to_COUNTERED
          - state_machines.MutualAidRequest.COUNTERED_to_OFFERED
          - entities.MutualAidRequest.fields.offered_units
        distinguishing_aspect: "MutualAidRequest cycles OFFERED->COUNTERED->OFFERED (negotiation rounds on a different entity than ResourceRequest), ending back in OFFERED with an updated offered_units."
        test_recipe:
          setup:
            - "Incident ACTIVATED; Jurisdiction registered; MutualAidRequest OFFERED with offered_units=4."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Regional Flood", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/jurisdictions"
              payload: { name: "North County" }
              as: EOCManager
              captures: { jur_id: $.data.id }
            - call: "POST /eoc/mutual-aid-requests"
              payload: { incident_id: "${inc_id}", to_jurisdiction_id: "${jur_id}", resource_type: "PERSONNEL", requested_units: 5 }
              as: LogisticsChief
              captures: { ma_id: $.data.id }
            - call: "POST /eoc/mutual-aid-requests/${ma_id}/transition"
              payload: { to_status: "OFFERED", offered_units: 4 }
              as: JurisdictionLiaison
              as_user_id: "${jur_id}"
            - call: "POST /eoc/mutual-aid-requests/${ma_id}/transition"
              payload: { to_status: "COUNTERED", countered_units: 6 }
              as: LogisticsChief
          trigger:
            - call: "POST /eoc/mutual-aid-requests/${ma_id}/transition"
              payload: { to_status: "OFFERED", offered_units: 5 }
              as: JurisdictionLiaison
              as_user_id: "${jur_id}"
          assert:
            - "MutualAidRequest.${ma_id}.status == OFFERED"
            - "MutualAidRequest.${ma_id}.offered_units == 5"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: demobilize_incident_three_hop_release
        grounds:
          - state_machines.Incident.ACTIVATED_to_DEMOBILIZING
          - state_machines.Task.ASSIGNED_to_CANCELLED
          - state_machines.ResourceRequest.FILLED_to_DEMOBILIZED
          - entities.ResourcePool.fields.units_committed
        distinguishing_aspect: "Depth-3 chain: Incident DEMOBILIZING cancels the Task (hop1); the Task cancellation itself demobilizes its backing ResourceRequest (hop2); the request demobilization itself releases pool.units_committed 3->0 (hop3) — each hop caused by the previous, not the incident directly."
        test_recipe:
          setup:
            - "Incident ACTIVATED; pool total_units=10; ResourceRequest FILLED for 3 units (pool committed=3, available=7); IAP PUBLISHED; Task ASSIGNED with resource_request_id = that request."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Valley Fire", hazard_type: "WILDFIRE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/jurisdictions"
              payload: { name: "State DOT" }
              as: EOCManager
              captures: { jur_id: $.data.id }
            - call: "POST /eoc/resource-pools"
              payload: { jurisdiction_id: "${jur_id}", resource_type: "VEHICLE", total_units: 10 }
              as: LogisticsChief
              captures: { pool_id: $.data.id }
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "VEHICLE", requested_quantity: 3 }
              as: OperationsChief
              captures: { req_id: $.data.id }
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SOURCED", pool_id: "${pool_id}" }
              as: LogisticsChief
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "FILLED", deploy_start: "2026-03-01T08:00:00Z", deploy_end: "2026-03-01T20:00:00Z" }
              as: LogisticsChief
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v1: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-01T06:00:00Z", operational_period_end: "2026-03-02T06:00:00Z", expected_incident_version: "${inc_v1}" }
              as: PlanningChief
              captures: { iap_id: $.data.id }
            - call: "POST /eoc/incident-action-plans/${iap_id}/transition"
              payload: { to_status: "PUBLISHED" }
              as: PlanningChief
            - call: "POST /eoc/tasks"
              payload: { iap_id: "${iap_id}", title: "Clear Route 12", resource_request_id: "${req_id}" }
              as: PlanningChief
              captures: { task_id: $.data.id }
            - call: "POST /eoc/tasks/${task_id}/transition"
              payload: { to_status: "ASSIGNED" }
              as: OperationsChief
          trigger:
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "DEMOBILIZING" }
              as: EOCManager
          assert:
            - "Task.${task_id}.status == CANCELLED"
            - "ResourceRequest.${req_id}.status == DEMOBILIZED"
            - "ResourcePool.${pool_id}.units_committed == 0"
            - "ResourcePool.${pool_id}.units_available == 10"

      - name: validate_damage_two_hop_declaration
        grounds:
          - state_machines.DamageAssessment.DRAFT_to_VALIDATED
          - entities.Incident.fields.total_verified_damage
          - entities.Incident.fields.declaration_status
          - calculations.declaration_threshold
        distinguishing_aspect: "Depth-2 chain from a different trigger (DamageAssessment VALIDATED): the validation adds estimated_loss to total_verified_damage (hop1); that recompute crossing DECLARATION_THRESHOLD itself flips declaration_status INELIGIBLE->ELIGIBLE (hop2)."
        test_recipe:
          setup:
            - "Incident ACTIVATED, declaration INELIGIBLE, no validated assessments; one DRAFT DamageAssessment estimated_loss=5,000,000."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "River Crest", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/damage-assessments"
              payload: { incident_id: "${inc_id}", site_name: "Water Plant", estimated_loss: 5000000, infrastructure_category: "CAT_E_BUILDINGS" }
              as: PlanningChief
              captures: { da_id: $.data.id }
          trigger:
            - call: "POST /eoc/damage-assessments/${da_id}/transition"
              payload: { to_status: "VALIDATED" }
              as: PlanningChief
          assert:
            - "Incident.${inc_id}.total_verified_damage == 5000000"
            - "Incident.${inc_id}.declaration_status == ELIGIBLE"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: source_state_beats_insufficient_resources
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.ResourceRequest.SUBMITTED_to_SOURCED
        distinguishing_aspect: "Category pair state (priority 5, ERR_INVALID_STATE) vs business_constraint (priority 10, ERR_INSUFFICIENT_RESOURCES): a NEEDS_INFO request SOURCED against a too-small pool returns ERR_INVALID_STATE, proving state precedes the capacity check."
        test_recipe:
          setup:
            - "Incident ACTIVATED; pool total_units=1; ResourceRequest for 5 units driven to NEEDS_INFO (not SUBMITTED)."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Border Wildfire", hazard_type: "WILDFIRE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Fire District 3" }
              as: EOCManager
              captures: { jur_id: $.data.id }
            - call: "POST /eoc/resource-pools"
              payload: { jurisdiction_id: "${jur_id}", resource_type: "PERSONNEL", total_units: 1 }
              as: LogisticsChief
              captures: { pool_id: $.data.id }
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "PERSONNEL", requested_quantity: 5 }
              as: OperationsChief
              captures: { req_id: $.data.id }
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "NEEDS_INFO" }
              as: LogisticsChief
          trigger:
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SOURCED", pool_id: "${pool_id}" }
              as: LogisticsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (HTTP 409)"
            - "ResourceRequest.${req_id}.status == NEEDS_INFO"
            - "ResourcePool.${pool_id}.units_available == 1"

      - name: assign_referential_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.Task.PLANNED_to_ASSIGNED
        distinguishing_aspect: "Category pair business_referential (priority 7, ERR_CROSS_INCIDENT_REFERENCE) vs business_temporal (priority 8, ERR_RESOURCE_WINDOW_MISMATCH): assigning a task whose backing request is from another incident AND whose deploy_end precedes the IAP period returns ERR_CROSS_INCIDENT_REFERENCE."
        test_recipe:
          setup:
            - "Incident A ACTIVATED with PUBLISHED IAP (operational_period_start=2026-03-05T06:00:00Z)."
            - "Incident B ACTIVATED with a FILLED ResourceRequest whose deploy window is [2026-03-01T08:00:00Z, 2026-03-01T12:00:00Z] (deploy_end precedes IAP period start)."
            - "A PLANNED Task under Incident A's IAP references Incident B's request."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Incident A", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_a: $.data.id }
            - call: "POST /eoc/incidents/${inc_a}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_a}"
              payload: {}
              as: PlanningChief
              captures: { inc_a_v: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_a}", operational_period_start: "2026-03-05T06:00:00Z", operational_period_end: "2026-03-06T06:00:00Z", expected_incident_version: "${inc_a_v}" }
              as: PlanningChief
              captures: { iap_a: $.data.id }
            - call: "POST /eoc/incident-action-plans/${iap_a}/transition"
              payload: { to_status: "PUBLISHED" }
              as: PlanningChief
            - call: "POST /eoc/incidents"
              payload: { name: "Incident B", hazard_type: "HAZMAT" }
              as: EOCManager
              captures: { inc_b: $.data.id }
            - call: "POST /eoc/incidents/${inc_b}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Mutual Aid Pool Owner" }
              as: EOCManager
              captures: { jur_id: $.data.id }
            - call: "POST /eoc/resource-pools"
              payload: { jurisdiction_id: "${jur_id}", resource_type: "VEHICLE", total_units: 4 }
              as: LogisticsChief
              captures: { pool_id: $.data.id }
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_b}", resource_type: "VEHICLE", requested_quantity: 2 }
              as: OperationsChief
              captures: { req_b: $.data.id }
            - call: "POST /eoc/resource-requests/${req_b}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
            - call: "POST /eoc/resource-requests/${req_b}/transition"
              payload: { to_status: "SOURCED", pool_id: "${pool_id}" }
              as: LogisticsChief
            - call: "POST /eoc/resource-requests/${req_b}/transition"
              payload: { to_status: "FILLED", deploy_start: "2026-03-01T08:00:00Z", deploy_end: "2026-03-01T12:00:00Z" }
              as: LogisticsChief
            - call: "POST /eoc/tasks"
              payload: { iap_id: "${iap_a}", title: "Cross-linked task", resource_request_id: "${req_b}" }
              as: PlanningChief
              captures: { task_id: $.data.id }
          trigger:
            - call: "POST /eoc/tasks/${task_id}/transition"
              payload: { to_status: "ASSIGNED" }
              as: OperationsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CROSS_INCIDENT_REFERENCE (HTTP 409)"
            - "Task.${task_id}.status == PLANNED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: pool_units_exact_available_boundary
        grounds:
          - calculations.resource_pool_availability
          - state_machines.ResourceRequest.SUBMITTED_to_SOURCED
          - entities.ResourcePool.fields.units_available
        distinguishing_aspect: "Units metric via POST /eoc/resource-requests/{id}/transition: a request for exactly units_available (3 of 3) SOURCES successfully (>=, driving units_available to 0); a follow-up request for 1 more is rejected ERR_INSUFFICIENT_RESOURCES."
        test_recipe:
          setup:
            - "Incident ACTIVATED; pool total_units=3; two SUBMITTED requests (qty 3 and qty 1) on the same pool's resource_type."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Ice Storm", hazard_type: "PUBLIC_HEALTH" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Public Works" }
              as: EOCManager
              captures: { jur_id: $.data.id }
            - call: "POST /eoc/resource-pools"
              payload: { jurisdiction_id: "${jur_id}", resource_type: "EQUIPMENT", total_units: 3 }
              as: LogisticsChief
              captures: { pool_id: $.data.id }
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "EQUIPMENT", requested_quantity: 3 }
              as: OperationsChief
              captures: { req1: $.data.id }
            - call: "POST /eoc/resource-requests/${req1}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
            - call: "POST /eoc/resource-requests/${req1}/transition"
              payload: { to_status: "SOURCED", pool_id: "${pool_id}" }
              as: LogisticsChief
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "EQUIPMENT", requested_quantity: 1 }
              as: OperationsChief
              captures: { req2: $.data.id }
            - call: "POST /eoc/resource-requests/${req2}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
          trigger:
            - call: "POST /eoc/resource-requests/${req2}/transition"
              payload: { to_status: "SOURCED", pool_id: "${pool_id}" }
              as: LogisticsChief
              captures: { err: $.data.error_id }
          assert:
            - "ResourceRequest.${req1}.status == SOURCED"
            - "ResourcePool.${pool_id}.units_available == 0"
            - "response error_id == ERR_INSUFFICIENT_RESOURCES (HTTP 409)"

      - name: declaration_damage_exact_threshold
        grounds:
          - calculations.declaration_threshold
          - state_machines.DamageAssessment.DRAFT_to_VALIDATED
          - entities.Incident.fields.declaration_status
        distinguishing_aspect: "Dollars metric via POST /eoc/damage-assessments/{id}/transition: total_verified_damage=4,999,999 keeps declaration INELIGIBLE, and adding 1 to reach exactly 5,000,000 flips it ELIGIBLE (>= boundary, not >)."
        test_recipe:
          setup:
            - "Incident ACTIVATED; DamageAssessment #1 estimated_loss=4,999,999 already VALIDATED (total=4,999,999, INELIGIBLE); DamageAssessment #2 estimated_loss=1 in DRAFT."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Coastal Surge", hazard_type: "HURRICANE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/damage-assessments"
              payload: { incident_id: "${inc_id}", site_name: "Pier 1", estimated_loss: 4999999, infrastructure_category: "CAT_G_PARKS" }
              as: PlanningChief
              captures: { da1: $.data.id }
            - call: "POST /eoc/damage-assessments/${da1}/transition"
              payload: { to_status: "VALIDATED" }
              as: PlanningChief
            - call: "POST /eoc/damage-assessments"
              payload: { incident_id: "${inc_id}", site_name: "Pier 2", estimated_loss: 1, infrastructure_category: "CAT_G_PARKS" }
              as: PlanningChief
              captures: { da2: $.data.id }
          trigger:
            - call: "POST /eoc/damage-assessments/${da2}/transition"
              payload: { to_status: "VALIDATED" }
              as: PlanningChief
          assert:
            - "Incident.${inc_id}.total_verified_damage == 5000000"
            - "Incident.${inc_id}.declaration_status == ELIGIBLE"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_request_requires_incident_activated
        grounds:
          - state_machines.ResourceRequest.DRAFT_to_SUBMITTED
          - entities.Incident.fields.op_status
          - validations[priority=10]
        distinguishing_aspect: "Entity pair ResourceRequest->Incident: submitting a ResourceRequest is rejected ERR_INCIDENT_NOT_ACTIVE while its Incident.op_status is MONITORING (not ACTIVATED)."
        test_recipe:
          setup:
            - "Incident in MONITORING (never activated); a DRAFT ResourceRequest on it."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Watch Only", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "SUPPLY", requested_quantity: 4 }
              as: OperationsChief
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INCIDENT_NOT_ACTIVE (HTTP 409)"
            - "ResourceRequest.${req_id}.status == DRAFT"

      - name: assign_task_requires_iap_published
        grounds:
          - state_machines.Task.PLANNED_to_ASSIGNED
          - entities.IncidentActionPlan.fields.status
          - validations[priority=10]
        distinguishing_aspect: "Entity pair Task->IncidentActionPlan: assigning a Task is rejected ERR_IAP_NOT_PUBLISHED while its IAP.status is DRAFT (not PUBLISHED)."
        test_recipe:
          setup:
            - "Incident ACTIVATED; a DRAFT (unpublished) IAP; a PLANNED Task under it with no backing request."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Quake Response", hazard_type: "EARTHQUAKE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-01T06:00:00Z", operational_period_end: "2026-03-02T06:00:00Z", expected_incident_version: "${inc_v}" }
              as: PlanningChief
              captures: { iap_id: $.data.id }
            - call: "POST /eoc/tasks"
              payload: { iap_id: "${iap_id}", title: "Assess bridges" }
              as: PlanningChief
              captures: { task_id: $.data.id }
          trigger:
            - call: "POST /eoc/tasks/${task_id}/transition"
              payload: { to_status: "ASSIGNED" }
              as: OperationsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_IAP_NOT_PUBLISHED (HTTP 409)"
            - "Task.${task_id}.status == PLANNED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: iap_operational_period_overlap
        grounds:
          - state_machines.IncidentActionPlan.DRAFT_to_PUBLISHED
          - entities.IncidentActionPlan.fields.operational_period_start
          - entities.IncidentActionPlan.fields.operational_period_end
        distinguishing_aspect: "Half-open interval semantics on IncidentActionPlan: a second IAP whose [start,end) overlaps a PUBLISHED IAP is rejected ERR_OPERATIONAL_PERIOD_OVERLAP (while pure adjacency end==start would be allowed)."
        test_recipe:
          setup:
            - "Incident ACTIVATED; IAP #1 [2026-03-01T06:00:00Z, 2026-03-02T06:00:00Z) PUBLISHED; IAP #2 [2026-03-01T18:00:00Z, 2026-03-02T18:00:00Z) DRAFT (overlaps #1)."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Storm Ops", hazard_type: "HURRICANE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v1: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-01T06:00:00Z", operational_period_end: "2026-03-02T06:00:00Z", expected_incident_version: "${inc_v1}" }
              as: PlanningChief
              captures: { iap1: $.data.id }
            - call: "POST /eoc/incident-action-plans/${iap1}/transition"
              payload: { to_status: "PUBLISHED" }
              as: PlanningChief
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: PlanningChief
              captures: { inc_v2: $.data.version }
            - call: "POST /eoc/incident-action-plans"
              payload: { incident_id: "${inc_id}", operational_period_start: "2026-03-01T18:00:00Z", operational_period_end: "2026-03-02T18:00:00Z", expected_incident_version: "${inc_v2}" }
              as: PlanningChief
              captures: { iap2: $.data.id }
          trigger:
            - call: "POST /eoc/incident-action-plans/${iap2}/transition"
              payload: { to_status: "PUBLISHED" }
              as: PlanningChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OPERATIONAL_PERIOD_OVERLAP (HTTP 409)"
            - "IncidentActionPlan.${iap2}.status == DRAFT"

      - name: pool_deployment_window_buffer_capacity
        grounds:
          - calculations.deployment_window_capacity
          - state_machines.ResourceRequest.SOURCED_to_FILLED
          - entities.ResourcePool.fields.turnaround_hours
        distinguishing_aspect: "Aggregate concurrent-window capacity + buffer on ResourcePool (surge_cap=5, total_units=10): both 3-unit requests SOURCE fine instantaneously, but filling R2 into R1's turnaround-inflated window is rejected ERR_DEPLOYMENT_WINDOW_CONFLICT because 3+3 > surge_cap 5 — a time-windowed aggregate check distinct from IAP pairwise half-open overlap and from the instantaneous units_available check."
        test_recipe:
          setup:
            - "Incident ACTIVATED; pool total_units=10, surge_cap=5, turnaround_hours=2; request R1 (3 units) FILLED window [2026-03-01T08:00:00Z, 2026-03-01T12:00:00Z]; request R2 (3 units) SOURCED (pool avail=4), window [2026-03-01T13:00:00Z, 2026-03-01T16:00:00Z] falls within R1's buffered window [06:00,14:00]."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Levee Deploy", hazard_type: "FLOOD" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Guard Motor Pool" }
              as: EOCManager
              captures: { jur_id: $.data.id }
            - call: "POST /eoc/resource-pools"
              payload: { jurisdiction_id: "${jur_id}", resource_type: "VEHICLE", total_units: 10, surge_cap: 5, turnaround_hours: 2 }
              as: LogisticsChief
              captures: { pool_id: $.data.id }
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "VEHICLE", requested_quantity: 3 }
              as: OperationsChief
              captures: { r1: $.data.id }
            - call: "POST /eoc/resource-requests/${r1}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
            - call: "POST /eoc/resource-requests/${r1}/transition"
              payload: { to_status: "SOURCED", pool_id: "${pool_id}" }
              as: LogisticsChief
            - call: "POST /eoc/resource-requests/${r1}/transition"
              payload: { to_status: "FILLED", deploy_start: "2026-03-01T08:00:00Z", deploy_end: "2026-03-01T12:00:00Z" }
              as: LogisticsChief
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "VEHICLE", requested_quantity: 3 }
              as: OperationsChief
              captures: { r2: $.data.id }
            - call: "POST /eoc/resource-requests/${r2}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
            - call: "POST /eoc/resource-requests/${r2}/transition"
              payload: { to_status: "SOURCED", pool_id: "${pool_id}" }
              as: LogisticsChief
          trigger:
            - call: "POST /eoc/resource-requests/${r2}/transition"
              payload: { to_status: "FILLED", deploy_start: "2026-03-01T13:00:00Z", deploy_end: "2026-03-01T16:00:00Z" }
              as: LogisticsChief
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEPLOYMENT_WINDOW_CONFLICT (HTTP 409)"
            - "ResourceRequest.${r2}.status == SOURCED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pool_units_conserved_on_demobilize
        grounds:
          - calculations.resource_pool_availability
          - state_machines.ResourceRequest.FILLED_to_DEMOBILIZED
          - entities.ResourcePool.fields.total_units
        distinguishing_aspect: "Conserved quantity = pool units: total_units == units_available + units_reserved + units_committed holds throughout; after FILL (commit 4) then DEMOBILIZE (release 4) the pool returns to units_available=10, units_committed=0 with total_units unchanged."
        test_recipe:
          setup:
            - "Incident ACTIVATED; pool total_units=10; request (4 units) FILLED (committed=4, available=6)."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Supply Push", hazard_type: "PUBLIC_HEALTH" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "POST /eoc/jurisdictions"
              payload: { name: "Health Dept" }
              as: EOCManager
              captures: { jur_id: $.data.id }
            - call: "POST /eoc/resource-pools"
              payload: { jurisdiction_id: "${jur_id}", resource_type: "SUPPLY", total_units: 10 }
              as: LogisticsChief
              captures: { pool_id: $.data.id }
            - call: "POST /eoc/resource-requests"
              payload: { incident_id: "${inc_id}", resource_type: "SUPPLY", requested_quantity: 4 }
              as: OperationsChief
              captures: { req_id: $.data.id }
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: OperationsChief
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "SOURCED", pool_id: "${pool_id}" }
              as: LogisticsChief
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "FILLED", deploy_start: "2026-03-01T08:00:00Z", deploy_end: "2026-03-01T18:00:00Z" }
              as: LogisticsChief
          trigger:
            - call: "POST /eoc/resource-requests/${req_id}/transition"
              payload: { to_status: "DEMOBILIZED" }
              as: LogisticsChief
          assert:
            - "ResourcePool.${pool_id}.units_committed == 0"
            - "ResourcePool.${pool_id}.units_reserved == 0"
            - "ResourcePool.${pool_id}.units_available == 10"

      - name: cost_ledger_conserved_on_void
        grounds:
          - calculations.incident_cost_rollup
          - state_machines.CostRecord.ESTIMATED_to_VOID
          - entities.Incident.fields.total_committed_cost
        distinguishing_aspect: "Conserved quantity = committed dollars: total_committed_cost == sum over {ESTIMATED,ACTUAL} CostRecords; a create (+500.00) followed by its VOID compensation returns total_committed_cost to 0.00 (a different conserved quantity than pool units)."
        test_recipe:
          setup:
            - "Incident ACTIVATED; one ESTIMATED CostRecord estimated_cost=500.00 (total_committed_cost=500.00)."
          setup_api_calls:
            - call: "POST /eoc/incidents"
              payload: { name: "Debris Op", hazard_type: "WILDFIRE" }
              as: EOCManager
              captures: { inc_id: $.data.id }
            - call: "POST /eoc/incidents/${inc_id}/transition"
              payload: { to_status: "ACTIVATED" }
              as: EOCManager
            - call: "GET /eoc/incidents/${inc_id}"
              payload: {}
              as: FinanceChief
              captures: { inc_v: $.data.version }
            - call: "POST /eoc/cost-records"
              payload: { incident_id: "${inc_id}", category: "EQUIPMENT", estimated_cost: 500.00, eligible: true, expected_incident_version: "${inc_v}" }
              as: FinanceChief
              captures: { cost_id: $.data.id }
          trigger:
            - call: "POST /eoc/cost-records/${cost_id}/transition"
              payload: { to_status: "VOID" }
              as: FinanceChief
          assert:
            - "CostRecord.${cost_id}.status == VOID"
            - "Incident.${inc_id}.total_committed_cost == 0.00"
