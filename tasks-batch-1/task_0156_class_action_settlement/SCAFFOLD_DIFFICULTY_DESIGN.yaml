              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /opt-outs/${oo_id}/finalize"
              payload: {}
              as: ClaimsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_MEMBER_HAS_CLAIM"
            - "OptOutRequest.${oo_id}.status == REQUESTED (unchanged)"

